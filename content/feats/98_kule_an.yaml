# Kule kat anları (DECISIONS #148): tanıklı başarılar. `rakip` şablonunda yaralı tırmanıcıyı soyarken görülmek
# (zarda başarısızlık ya da yanında yoldaş varken) bu söylentiyi yayar (events/98_kule_an_b.yaml).
basarilar:
  kule_soygunu:
    ad: { tr: "Kule'de yaralıyı soyan", en: "Robber of the Wounded" }
    tepkiler: { siginak: -6, lonca: -4, sessiz_ag: -2, yukselenler: 1 }
    satirlar:
      siginak: { tr: "Sığınak'ta Kule'ye çıkacak gençlere hikâyeni anlatıyorlar: böyle olmayın diye.", en: "At the Haven, they tell your story to the kids headed for the Spire as a warning: don't be this." }
      lonca: { tr: "Lonca'nın Kule panosunda adının yanına kimse yıldız koymuyor; biri tebeşirle bir çarpı çizmiş.", en: "Nobody's putting a star next to your name on the Guild's Spire board. Somebody chalked an X instead." }
      sessiz_ag: { tr: "Sessiz Ağ dosyana yeni bir satır ekliyor: kimse bakmıyor sandığında ne yaptığın.", en: "The Quiet Network adds a line to your file: what you do when you think nobody's watching." }
      yukselenler: { tr: "Yükselenler omuz silkiyor: taşıdığını koruyamayan, onu hak etmemiştir.", en: "The Ascended just shrug: whoever can't hold on to what they're carrying never deserved it." }
