# Parti K1 — Perde 4 görevleri.
gorevler:
  hasat_savunmasi:
    ad: { tr: "Hasat: Son Savunma", en: "The Harvest: Last Stand" }
    aciklama: { tr: "Kadim filosu körfezin üstünde. Sistem son değerlendirmeyi başlattı. {yer:kiyikent} ya ayakta kalacak ya biçilecek.", en: "The Ancient fleet is over the bay. The System has begun its final assessment. {yer:kiyikent} either stands or gets reaped." }
  cekirdege_inis:
    ad: { tr: "Çekirdeğe İniş", en: "Descent to the Core" }
    aciklama: { tr: "Kule'nin dibinde bir merdiven açıldı. Aşağıda, Sistem'in kendisi bekliyor.", en: "A staircase has opened at the foot of the Spire. Down there, the System itself is waiting." }
