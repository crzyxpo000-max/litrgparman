# Parti I — Çok-evren görevleri.
gorevler:
  cok_evren_batik:
    ad: { tr: "Son Fener", en: "The Last Light" }
    aciklama: { tr: "{yer:batik_takimada|in} sönmüş insanları Son Fener'in çevresinde toplanmış. Hasat'ın geride bıraktığı şey hâlâ denizin dibini tarıyor.", en: "The dimmed people of {yer:batik_takimada} are huddled around the Last Light. The thing the Harvest left behind is still combing the sea floor." }
  cok_evren_kervan:
    ad: { tr: "Boyun Senedi", en: "The Neckbond" }
    aciklama: { tr: "{yer:pirinc_kervan} dört yüz yıldır Kadimler'e onda birini ödüyor. Senedin mühür makinesi Kervan'ın kalbinde atıyor.", en: "For four hundred years {yer:pirinc_kervan} has paid the Ancients a tenth. The treaty's seal engine beats in the Caravan's heart." }
  cok_evren_taht:
    ad: { tr: "Yedinci Koltuk", en: "The Seventh Seat" }
    aciklama: { tr: "{yer:yedi_taht|in} boş koltuğu Dünya'nın hasadını bekliyor. Varis {npc:ossiran} onu almak için seni aşmak zorunda.", en: "The empty seat of {yer:yedi_taht} is waiting on Earth's harvest. To take it, Heir {npc:ossiran} has to go through you." }
