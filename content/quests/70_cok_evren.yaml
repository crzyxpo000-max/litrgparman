# Parti I — Çok-evren görevleri.
gorevler:
  cok_evren_batik:
    ad: { tr: "Son Fener", en: "The Last Light" }
    aciklama: { tr: "Batık Takımada'nın sönmüş insanları Son Fener'in çevresinde toplanmış. Hasat'ın geride bıraktığı şey hâlâ denizin dibini tarıyor.", en: "The dimmed people of the Drowned Reach are huddled around the Last Light. The thing the Harvest left behind is still combing the sea floor." }
  cok_evren_kervan:
    ad: { tr: "Boyun Senedi", en: "The Neckbond" }
    aciklama: { tr: "Pirinç Kervan dört yüz yıldır Kadimler'e onda birini ödüyor. Senedin mühür makinesi Kervan'ın kalbinde atıyor.", en: "For four hundred years the Brass Caravan has paid the Ancients a tenth. The treaty's seal engine beats in the Caravan's heart." }
  cok_evren_taht:
    ad: { tr: "Yedinci Koltuk", en: "The Seventh Seat" }
    aciklama: { tr: "Yedi Taht'ın boş koltuğu Dünya'nın hasadını bekliyor. Varis Ossiran onu almak için seni aşmak zorunda.", en: "The empty seat of the Sevenfold Court is waiting on Earth's harvest. To take it, Heir Ossiran has to go through you." }
