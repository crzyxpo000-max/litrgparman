# Parti G — Perde 2 Kıyıkent görevleri.
gorevler:
  duvardaki_isim:
    ad: { tr: "Duvardaki isim", en: "The name on the wall" }
    aciklama: { tr: "Kayıplar Duvarı'ndaki balıkçı yaşıyor, bir yerde saklanıyor. Onu bul; karısının yirmi yıllık sabrı bir cevabı hak ediyor.", en: "The fisherman on the Wall of the Missing is alive and hiding. Find him. His wife's twenty years of patience deserve an answer." }
  vapuru_yuzdur:
    ad: { tr: "Akşam vapuru", en: "The evening ferry" }
    aciklama: { tr: "Yan yatmış akşam vapurunu doğrult. Karşı yakadaki adalarda sahipsiz bahçeler var ve şehrin yarısı aç.", en: "Right the evening ferry lying on its side. There are orchards on the islands across the sound that nobody owns anymore, and half the city is hungry." }
  fenerciyi_avla:
    ad: { tr: "Sahte fener", en: "The false lighthouse" }
    aciklama: { tr: "Mendireğin ötesindeki ışığa giden kayıklar dönmüyor. Işığın altında ne olduğunu bul ve söndür.", en: "Boats that go out to the light past the jetty don't come back. Find out what's under it and put it out." }
