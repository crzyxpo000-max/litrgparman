gorevler:
  zincir_siginak:
    ad: { tr: "Sığınak Konseyi: Kalkan", en: "Haven Council: The Shield" }
    aciklama: { tr: "{npc:elif_sari|in} konseyi Kıyıkent'in sivillerini ayakta tutmaya çalışıyor. Onların kalkanı ol.", en: "{npc:elif_sari|pos} council is trying to keep Port Harlow's civilians standing. Be their shield." }
  zincir_lonca:
    ad: { tr: "Demir Lonca: Rütbe", en: "Iron Guild: Rank" }
    aciklama: { tr: "{npc:kaya_demir|in} loncasında güç rütbe demek. Merdiveni tırman.", en: "In {npc:kaya_demir|pos} guild, strength means rank. Climb the ladder." }
  zincir_yukselenler:
    ad: { tr: "Yükselenler: Seçilmiş", en: "The Ascended: The Chosen" }
    aciklama: { tr: "{npc:vahit} seni seçilmişlerin en önüne koymak istiyor. Bedelini yakıt öder.", en: "{npc:vahit} wants you at the very front of the Chosen. The fuel pays the price." }
  zincir_sessiz_ag:
    ad: { tr: "Sessiz Ağ: Kaynak Kodu", en: "The Quiet Network: Source Code" }
    aciklama: { tr: "{npc:mert_kilic} ve radyocuları Sistem'in kaynak koduna ulaşmak istiyor. Onlara yol aç.", en: "{npc:mert_kilic} and his radio crew want into the System's source code. Open the way." }
  zincir_kadimler:
    ad: { tr: "Kadimler: Elçilik", en: "The Ancients: The Embassy" }
    aciklama: { tr: "{npc:thessar} insanlıkla bir anlaşma arıyor. Masaya otur; ne pahasına olduğunu sonra öğrenirsin.", en: "{npc:thessar} wants a deal with humanity. Take a seat at the table. You'll find out the price later." }
