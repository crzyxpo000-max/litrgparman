# Parti C görevleri. ('carsi_mahsurlari' ana quests.yaml'da tanımlı.)
gorevler:
  olu_avcinin_mesaji:
    ad: { tr: "Yarım kalan cümle", en: "The unfinished sentence" }
    aciklama: { tr: "Penceresi kapanmayan ölü avcının künyesini kızına ulaştır. Notlarına yarım bir cümle yazmıştı.", en: "Get the dead hunter's tags to his daughter. He left half a sentence in his notes." }
  mert_anteni:
    ad: { tr: "Çatıdaki anten", en: "The antenna on the roof" }
    aciklama: { tr: "İstasyonun çatısındaki anten direğini doğrult; radyocular daha uzağı dinlemek istiyor. Kabloların hepsi kablo değil.", en: "Straighten the antenna mast on the station roof so the radio crew can listen farther out. Not all of those cables are cables." }
