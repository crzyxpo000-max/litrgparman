    aciklama: { tr: "Ayaklarını yere kök gibi salar, kendini bir surun içine kapatırsın. Yerinden kıpırdamazsın ama kimse de seni kıpırdatamaz.", en: "You root your feet and wall yourself in. You don't move. Neither does anything that hits you." }
