    aciklama: { tr: "Kalkan darbeyi emip bir kısmını geldiği yere iade eder; kibar bir ret mektubu gibi.", en: "The shield soaks the hit and returns part of it to sender. Like a polite rejection letter." }
    tur: "aktif"
