    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 12 }
    bekleme: 2
    stat: "per"
    taban: 34
    kat: 1.8
    hedef: "tek"
    durum: { etki: "yanma", sans: 0.6, sure: 3 }
    etiketler: ["menzilli", "ates", "delici"]
  yer_sarsan:
