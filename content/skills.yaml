yetenekler:
  agir_darbe:
    ad: { tr: "Ağır Darbe", en: "Heavy Blow" }
    aciklama: { tr: "Bütün ağırlığını tek bir vuruşa verirsin. Zarif değildir ama iş görür.", en: "Put your whole weight behind one swing. Not elegant. Effective." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { dayanim: 8 }
    bekleme: 1
    stat: "str"
    taban: 14
    kat: 1.2
    hedef: "tek"
    durum: { etki: "sersemleme", sans: 0.15, sure: 1 }
    evrim: ["yer_sarsan", "zirh_yaran"]
    etiketler: ["yakin", "fiziksel"]
  alev_oku:
    ad: { tr: "Alev Oku", en: "Flame Arrow" }
    aciklama: { tr: "Ucu alev alan bir ok fırlatır. Hedef tutuşabilir; sen de tutuşmamaya dikkat et.", en: "Looses an arrow with a burning tip. The target may catch fire. Try not to join it." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { mp: 8 }
    bekleme: 1
    stat: "per"
    taban: 12
    kat: 1.1
    hedef: "tek"
    durum: { etki: "yanma", sans: 0.3, sure: 3 }
    evrim: ["alev_yagmuru", "kor_mizrak"]
    etiketler: ["menzilli", "ates", "ok"]
  enerji_mermisi:
    ad: { tr: "Enerji Mermisi", en: "Mana Bolt" }
    aciklama: { tr: "Ham manayı sıkıştırıp hedefe fırlatır. Büyünün en kaba hâlidir ama hiç ıskalamazmış gibi davranır.", en: "Compresses raw mana and hurls it. Magic at its crudest, but it acts like it never misses." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { mp: 6 }
    bekleme: 0
    stat: "int"
    taban: 10
    kat: 1.3
    hedef: "tek"
    evrim: ["mana_selesi", "kristal_mizrak"]
    etiketler: ["buyu", "saf"]
  golge_adimi:
    ad: { tr: "Gölge Adımı", en: "Shadow Step" }
    aciklama: { tr: "Yakındaki bir gölgeye girip hedefin arkasından çıkarsın. Darbe de seninle birlikte gelir.", en: "Slip into a nearby shadow and come out behind your target, blade first." }
    tur: "aktif"
    nadirlik: "nadir"
    maliyet: { dayanim: 8 }
    bekleme: 2
    stat: "agi"
    taban: 10
    kat: 1.2
    hedef: "tek"
    evrim: ["bosluk_adimi", "golge_avi"]
    etiketler: ["hareket", "golge", "gizlilik"]
  kalkan_duvari:
    ad: { tr: "Kalkan Duvarı", en: "Shield Wall" }
    aciklama: { tr: "Önüne görünmez bir duvar örer. Arkasında durmak önünde durmaktan çok daha sağlıklıdır.", en: "Raises an invisible wall in front of you. Standing behind it beats standing in front of it." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { dayanim: 10 }
    bekleme: 3
    stat: "end"
    taban: 15
    kat: 1.4
    hedef: "kendi"
    durum: { etki: "kalkan", sans: 1.0, sure: 2 }
    evrim: ["kale_durusu", "yansitici_kalkan"]
    etiketler: ["koruma", "kalkan"]
  ruh_pencesi:
    ad: { tr: "Ruh Pençesi", en: "Spirit Claw" }
    aciklama: { tr: "Bağlı olduğun yarı saydam bir yaratığı kısa bir süre için çağırır, düşmanın üstüne salar.", en: "Briefly calls up a half-transparent bound beast and sics it on the enemy." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { mp: 10 }
    bekleme: 1
    stat: "wis"
    taban: 12
    kat: 1.1
    hedef: "tek"
    durum: { etki: "kanama", sans: 0.25, sure: 3 }
    etiketler: ["cagirma", "ruh"]
  dogaclama_tuzak:
    ad: { tr: "Doğaçlama Tuzak", en: "Jury-Rigged Trap" }
    aciklama: { tr: "Eldeki hurdadan bir tuzak kurarsın. Sistem yapıyı onaylamaz ama çalıştığını kabul eder.", en: "Builds a trap out of whatever junk you're holding. The System disapproves of the design. It admits it works." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { dayanim: 6 }
    bekleme: 2
    stat: "int"
    taban: 10
    kat: 1.0
    hedef: "tek"
    durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
    etiketler: ["zanaat", "tuzak"]
  kan_bedeli:
    ad: { tr: "Kan Bedeli", en: "Blood Price" }
    aciklama: { tr: "Kendi kanından bir damlayı silaha çevirir. Sistem bedeli faturaya yazmaz; bedenin yazar.", en: "Turns a drop of your own blood into a weapon. The System doesn't bill you for it. Your body does." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { mp: 5 }
    bekleme: 2
    stat: "wil"
    taban: 18
    kat: 1.2
    hedef: "tek"
    durum: { etki: "kanama", sans: 0.3, sure: 3 }
    etiketler: ["karanlik", "kan"]
  kapi_agzi:
    ad: { tr: "Kapı Ağzı", en: "Gatemaw" }
    aciklama: { tr: "Yuttuğun kapılardan kalan artık yumruğunda açılır. Bir kez boss yemiş olan şey sıradan düşmandan korkmaz.", en: "The leftovers of every Gate you've swallowed open up in your fist. Something that's eaten a boss isn't scared of mooks." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { dayanim: 12 }
    bekleme: 3
    stat: "str"
    taban: 20
    kat: 1.4
    hedef: "tek"
    etiketler: ["kapi", "yakin", "fiziksel"]
  bozuk_paket:
    ad: { tr: "Bozuk Paket", en: "Corrupt Packet" }
    aciklama: { tr: "Hedefe Sistem'in bile okuyamadığı bir veri yığını gönderir. Hedef bir süre neye uğradığını şaşırır.", en: "Sends the target a chunk of data even the System can't parse. For a moment, neither can they." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 9 }
    bekleme: 2
    stat: "int"
    taban: 14
    kat: 1.3
    hedef: "tek"
    durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
    etiketler: ["glitch", "buyu"]
  agit:
    ad: { tr: "Ağıt", en: "Lament" }
    aciklama: { tr: "Kaybettiklerin için yükselen bir ses. Onu duyan her düşman kendi kaybedeceklerini hatırlar.", en: "A voice raised for the ones you lost. Every enemy who hears it remembers what they stand to lose." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 10 }
    bekleme: 3
    stat: "wil"
    taban: 12
    kat: 1.1
    hedef: "tum"
    durum: { etki: "korku", sans: 0.4, sure: 2 }
    etiketler: ["ses", "zihin"]
  olumcul_nokta:
    ad: { tr: "Ölümcül Nokta", en: "Killpoint" }
    aciklama: { tr: "İlk vuruşunun kritik olma şansı ve kritik hasarı artar. Avcı ikinci vuruşa ihtiyaç duymaz.", en: "Your opening strike is more likely to crit, and crits harder. A hunter doesn't plan on a second shot." }
    tur: "pasif"
    nadirlik: "epik"
    stat: "per"
    taban: 10
    kat: 0.8
    hedef: "kendi"
    etiketler: ["kritik", "ilk_vurus", "goz"]
  sifa_dokunusu:
    ad: { tr: "Şifa Dokunuşu", en: "Mending Touch" }
    aciklama: { tr: "Avucunda ılık bir ışık toplanıp yaraları kapatır. Sistem'e göre merhamet de bir kaynaktır.", en: "Warm light gathers in your palm and closes wounds. Turns out the System counts mercy as a resource, too." }
    tur: "aktif"
    nadirlik: "nadir"
    maliyet: { mp: 10 }
    bekleme: 2
    stat: "wis"
    taban: 15
    kat: 1.3
    hedef: "kendi"
    iyilestirme: true
    etiketler: ["sifa", "isik"]
  uyarlanma:
    ad: { tr: "Uyarlanma", en: "Adapt" }
    aciklama: { tr: "Aynı düşmanla geçen her tur ona karşı direncini biraz artırır. Hiçbir şeyde en iyi değilsin ama her şeye alışırsın.", en: "Each round against the same enemy raises your resistance to it a little. You're the best at nothing. You get used to everything." }
    tur: "pasif"
    nadirlik: "nadir"
    stat: "wis"
    taban: 8
    kat: 0.8
    hedef: "kendi"
    etiketler: ["denge", "direnc"]
  ruh_emme:
    ad: { tr: "Ruh Emme", en: "Soul Siphon" }
    aciklama: { tr: "Verdiğin hasarın bir kısmı can olarak sana döner. Her kademede insanlar yüzüne bakmakta biraz daha zorlanır.", en: "Part of the damage you deal flows back to you as health. Every Grade, people find it a little harder to look you in the eye." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 8 }
    bekleme: 2
    stat: "wil"
    taban: 14
    kat: 1.3
    hedef: "tek"
    ceza: { cha: -1 }
    etiketler: ["karanlik", "can_emme", "ruh"]
  ruzgar_adimi:
    ad: { tr: "Rüzgar Adımı", en: "Wind Step" }
    aciklama: { tr: "Bir rüzgâr dalgasına binip bir anlığına iki kat hızlı hareket edersin.", en: "Ride a gust of wind and move twice as fast for a moment." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { dayanim: 6 }
    bekleme: 2
    stat: "agi"
    taban: 8
    kat: 0.8
    hedef: "kendi"
    durum: { etki: "hizlanma", sans: 1.0, sure: 1 }
    etiketler: ["hareket", "ruzgar"]
  ilk_yardim:
    ad: { tr: "İlk Yardım", en: "First Aid" }
    aciklama: { tr: "Bir bez, biraz bastırma, bolca küfür. Sistem bunu da yetenekten sayıyor.", en: "A rag, some pressure, and a lot of swearing. The System counts that as a skill." }
    tur: "aktif"
    nadirlik: "siradan"
    maliyet: { dayanim: 5 }
    bekleme: 3
    stat: "wis"
    taban: 12
    kat: 0.9
    hedef: "kendi"
    iyilestirme: true
    etiketler: ["sifa", "hayatta_kalma"]
  ikinci_soluk:
    ad: { tr: "İkinci Soluk", en: "Second Wind" }
    aciklama: { tr: "Canın yarının altına düşünce Dayanım bir kez yenilenir. Bedenin pes etmeyi daha öğrenmedi.", en: "Once per fight, when you drop below half health, your Stamina refills. Your body hasn't learned how to quit yet." }
    tur: "pasif"
    nadirlik: "siradan"
    stat: "end"
    taban: 10
    kat: 0.8
    hedef: "kendi"
    etiketler: ["hayatta_kalma", "dayanim"]
  tehlike_sezgisi:
    ad: { tr: "Tehlike Sezgisi", en: "Danger Sense" }
    aciklama: { tr: "Ensendeki tüyler tuzağı da pusuyu da bir an önceden haber verir.", en: "The hair on the back of your neck warns you about traps and ambushes a beat early." }
    tur: "pasif"
    nadirlik: "nadir"
    stat: "per"
    taban: 8
    kat: 1.0
    hedef: "kendi"
    etiketler: ["algi", "tuzak"]
  dehset_maskesi:
    ad: { tr: "Dehşet Maskesi", en: "Mask of Dread" }
    aciklama: { tr: "Yüzün bir anlığına düşmanlarının en kötü kâbusuna dönüşür. Her kademede maske biraz daha zor çıkar.", en: "For a moment your face becomes your enemies' worst nightmare. Every Grade, the mask gets a little harder to take off." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 12 }
    bekleme: 4
    stat: "wil"
    taban: 16
    kat: 1.2
    hedef: "tum"
    durum: { etki: "korku", sans: 0.6, sure: 2 }
    ceza: { wis: -1 }
    etiketler: ["karanlik", "zihin"]
  bosluk_adimi:
    ad: { tr: "Boşluk Adımı", en: "Void Step" }
    aciklama: { tr: "Gölgeye değil, aradaki boşluğa adım atarsın. Hedef seni gördüğünde çoktan yanılmış olur.", en: "You step not into shadow but into the gap between places. By the time they see you, they've already been wrong." }
    tur: "aktif"
    nadirlik: "epik"
    maliyet: { mp: 12 }
    bekleme: 2
    stat: "agi"
    taban: 26
    kat: 1.6
    hedef: "tek"
    durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
    etiketler: ["hareket", "uzay"]
  golge_avi:
    ad: { tr: "Gölge Avı", en: "Shadow Hunt" }
    aciklama: { tr: "Gölgeler seninle birlikte avlanır. Hedef kaçabilir ama gölgesi kaçamaz.", en: "The shadows hunt alongside you. The target can run. Its shadow can't." }
