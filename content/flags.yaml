bayraklar:
  yanki_bagi: "Entegrasyon Günü Yankı oyuncuya bağlandı (OP MC çekirdeği)."
  deniz_el_tutuldu: "Aktarımda Deniz'in eli tutuldu; Öğretici'de birlikte uyandılar."
  kalabaliga_yardim: "Entegrasyonda kalabalığa, yaşlılara ve çocuklara yardım edildi."
  sistem_okundu: "Entegrasyon penceresi satır satır okundu (gizli satır, Algı +1)."
  tehlike_sezildi: "Uyanışta gözler kapatılıp tehlike dinlendi."
  ilk_oldurme: "Öğretici'deki ilk fare savaşı göze alındı."
  yabanci_korundu: "Prologdaki yaralı yabancı fareden korundu (minnet tohumu)."
  yabanci_birakildi: "Prologdaki yaralı yabancı bırakıldı (intikam tohumu)."
  yanki_ile_konusuldu: "Yankı ile doğrudan konuşuldu (Sistem Hatası gizli sınıf koşulu)."
  yas_tutuldu: "Bir yoldaşın ölümünden sonra 3 gün savaşmadan yas tutuldu (Yas Tutan gizli sınıfı; Aşama 5)."
  gizli_evrim_kademe_kiran: "Kademe Kırma uyanışı: bir sonraki evrimde gizli yol açılır (Aşama 7 içeriği)."
  deniz_bulundu: "Aktarımda ayrı düşülen Deniz Öğretici'de bulundu."
  deniz_bekletildi: "Deniz tazılarla boğuşurken oyuncu bekledi (hesap tohumu)."
  deniz_yalani_yakaladi: "Deniz, oyuncunun 'plan' yalanını yakaladı (hafızaya girer; Aşama 5)."
