# Parti L2 — Kule'nin sırları (her hikaye katı bir parça açar).
bilgiler:
  kule_kayit:
    tur: sir
    ad: { tr: "Kule bir kayıttır", en: "The Spire is a recording" }
    aciklama: { tr: "Kule'nin onuncu katı, Entegrasyon akşamı {yer:kiyikent_iskele} iskelesinin kusursuz bir kaydı. Kayıt numarası üst üste yazılmış; yolcu listesinde adının yanında \"zaten kayıtlı\" yazıyor.", en: "The Spire's tenth floor is a perfect recording of the {yer:kiyikent_iskele} on Integration evening. The record number has been written over; on the passenger list, your name says \"already logged.\"" }
  kule_okuyan_goz:
    tur: sir
    ad: { tr: "Okuyan göz", en: "The eye that reads" }
    aciklama: { tr: "Analiz yalnızca Sistem'in değil. Yirminci kattaki fenerin okuması bir alıcıya iletildi: Yedi ███. Biri, senin okuduğunu okuyor.", en: "Analysis doesn't belong only to the System. The twentieth-floor lighthouse forwarded its reading to a recipient: Seven ███. Somebody reads whatever you read." }
  kule_el_yazisi:
    tur: sir
    ad: { tr: "Camdaki el yazısı", en: "Handwriting on the glass" }
    aciklama: { tr: "Otuzuncu katın aynasında senin el yazınla bir not var: \"bunu okuyorsan yine buradasın.\" Sen yazmadın. Ya da bu sen yazmadın.", en: "On the thirtieth-floor mirror there's a note in your handwriting: \"if you're reading this, you're here again.\" You didn't write it. Or this you didn't." }
  kule_sifir_gunu:
    tur: sir
    ad: { tr: "Gün 0", en: "Day 0" }
    aciklama: { tr: "Kırkıncı kattaki saatin kadranında 365 çentik ve bir tane daha var: sıfır. Saat 365'ten sonra bitmiyor, başa dönüyor. Bir C kademesi insan, bir önceki seferden, orada donmuş.", en: "The clock on the fortieth floor has 365 notches on its dial, and one more: zero. After 365 the clock doesn't stop. It wraps around. A C-Grade human from a previous time is frozen there." }
  kule_hasat_edilmis_dunyalar:
    tur: sir
    ad: { tr: "Her dünyanın bir Kulesi vardı", en: "Every world had a Spire" }
    aciklama: { tr: "Ellinci kat hasat edilmiş dünyaların enkazından yapılmış; her yığının tepesinde kırık bir kule ucu. En üstte, Kıyıkent büyüklüğünde boş bir yer bekliyor.", en: "The fiftieth floor is built from harvested worlds' wreckage, the tip of a broken spire on top of every heap. At the very top, an empty space the size of Port Harlow is waiting." }
  kule_yeni_entegrasyon:
    tur: sir
    ad: { tr: "Son satır", en: "The last line" }
    aciklama: { tr: "Altmışıncı kattaki arşivde her Katman'ın kaydı farklı bir sonla biter (hasat, vassal, kabul) ama son satır hep aynıdır: \"Yeni Entegrasyon başlatılıyor.\" Kayıtlar her döngüde yakılır. Taşıyıcı hariç.", en: "In the sixtieth-floor archive, every Layer's record ends differently (harvested, vassal, accepted), but the last line is always the same: \"Initiating new Integration.\" The records are burned every cycle. Host excepted." }
  kule_tohumluk:
    tur: sir
    ad: { tr: "Tohumluk", en: "Seed stock" }
    aciklama: { tr: "Hasat öldürmez; biçer ve saklar. Yetmişinci katta her döngünün en güçlüleri kristal kozalarda uyuyor ve Öz'leri Kule'nin zirvesini besliyor. Bir koza içeriden kırılmış; etiketinde yalnızca \"taşıyıcı\" yazıyor.", en: "The harvest doesn't kill. It reaps, and it keeps. On the seventieth floor the strongest from every cycle sleep in crystal pods, and their Essence feeds the top of the Spire. One pod was broken from the inside; its label only says \"host.\"" }
  kule_kabul_edilenler:
    tur: sir
    ad: { tr: "Kabul edilenler", en: "The accepted" }
    aciklama: { tr: "Kabul edilen Katmanlar ölmez; terfi eder. Yeni işlevleri hasattır. Kadimler bir zamanlar bir Dünya'ydı ve kendi Kulelerini tırmandı.", en: "Accepted Layers don't die. They get promoted. Their new function is harvesting. The Ancients were an Earth once, and they climbed their own Spire." }
  kule_onceki_tasiyici:
    tur: sir
    ad: { tr: "Önceki taşıyıcı", en: "The previous host" }
    aciklama: { tr: "Doksanıncı katta S kademesine ulaşmış bir Kıyıkentli oturuyordu; göğsünde bir sesin sığacağı büyüklükte bir delikle. Zirvede pencereye hayır demiş; yine de olmuş. Sonra ses onu bırakıp bir sonrakine gitmiş.", en: "On the ninetieth floor sat someone from Port Harlow who had reached Grade S, with a hole in their chest big enough for a voice. At the summit they told the window no; it happened anyway. Then the voice left them for the next one." }
  kule_zirve_baslangic:
    tur: sir
    ad: { tr: "Zirve başlangıçtır", en: "The summit is the beginning" }
    aciklama: { tr: "Kule'nin yüzüncü katı Entegrasyon'dan bir dakika öncesi. İlk Pencere'nin tek düğmesi var: evet. Gökyüzünün arkasında pencereyi tutan bir el var ve bileğindeki imza, senin el yazına çok benziyor.", en: "The Spire's hundredth floor is one minute before Integration. The First Window has one button: yes. Behind the sky there's a hand holding the window, and the signature on its wrist looks a lot like your handwriting." }
