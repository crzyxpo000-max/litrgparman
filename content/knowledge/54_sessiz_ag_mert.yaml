# Parti D (Aşama 7) — Sessiz Ağ zinciri ve Mert'in yayı: bilgi günlüğü kayıtları.
bilgiler:
  sa_sessiz_oda:
    tur: sir
    ad: { tr: "Bakır oda", en: "The copper room" }
    aciklama: { tr: "{fraksiyon:sessiz_ag} eski telefon santralinin bir odasını bakır tel örgüyle kaplamış. İçeride Sistem bildirimleri yarım saniye gecikiyor; Sistem orayı daha az dinliyor.", en: "{fraksiyon:sessiz_ag} lined one room of the old phone exchange with copper mesh. Inside, System notices lag by half a second. The System listens less in there." }
  sa_kaynak_farki:
    tur: sir
    ad: { tr: "Aynı el, eski sürüm", en: "Same hand, older build" }
    aciklama: { tr: "Kapı çekirdeğinden çıkan kaynak parçası ile kafandaki ses aynı elden çıkma. Ama sesin satırları parçadan daha eski bir sürüm numarası taşıyor.", en: "The source fragment from the Gate core and the voice in your head were written by the same hand. But the voice's lines carry an older build number than the fragment." }
  sa_kadim_gozu:
    tur: sir
    ad: { tr: "Camdan göz", en: "The glass eye" }
    aciklama: { tr: "{npc:mert_kilic|i} izleyenlerden biri insan değildi. {fraksiyon:kadimler} anomaliyi doğrudan değil, onun çevresindekiler üzerinden izliyor.", en: "One of the things tailing {npc:mert_kilic} wasn't human. {fraksiyon:kadimler} aren't watching the anomaly directly. They're watching the people around it." }
  sa_kule_kodu:
    tur: sir
    ad: { tr: "Katların arasındaki satırlar", en: "The lines between the floors" }
    aciklama: { tr: "Kule'nin iki katı arasında kaynak kodu çıplak duruyor. Kule bir ölçü aleti: bir türün ne kadar büyüdüğünü ölçüyor. Ve sürüm numarası, kafandaki sesin numarasından bir fazla.", en: "Between two of the Spire's floors, the source code sits out in the open. The Spire is a measuring instrument: it measures how much a species has grown. And its build number is one higher than the voice in your head." }
  sa_kadim_teklifi:
    tur: sir
    ad: { tr: "Gri sözcünün teklifi", en: "The gray speaker's offer" }
    aciklama: { tr: "{fraksiyon:kadimler} {fraksiyon:sessiz_ag|e} bir arşiv teklif etti: Sistem'in kendi belgeleri. Karşılığında istedikleri tek şey anomalinin sürekli telemetrisi.", en: "{fraksiyon:kadimler} offered {fraksiyon:sessiz_ag} an archive: the System's own documentation. All they wanted in return was a live feed on the anomaly." }
  sa_cekirdek_haritasi:
    tur: sir
    ad: { tr: "Çekirdeğin haritası", en: "The map to the Core" }
    aciklama: { tr: "Satırındaki adres, kaynak parçaları ve Kule kodu bir araya gelince bir harita çıkıyor: Sistem Çekirdeği'ne giden yol ve kimsenin kullanmadığı bir bakım kapısı.", en: "Put the address in your line together with the source fragments and the Spire code and you get a map: the route to the System Core, plus a maintenance port nobody uses." }
  sa_arka_kapi:
    tur: sir
    ad: { tr: "Yazma tutamağı", en: "The write handle" }
    aciklama: { tr: "Kaynak Katmanı'nda, Kök Bekçisi'nin arkasında bir arka kapı açık duruyor. İçine bir tutamak yerleştirildi: Sistem'in bir satırını değiştirmeye yetecek kadar yetki.", en: "In the Source Layer, behind the Root Warden, a backdoor stands open. A handle's been planted in it: enough privilege to change one line of the System." }
  sa_mert_yalani:
    tur: yalan
    ad: { tr: "{npc:mert_kilic|e} parçanın yok edildiğini söyledin", en: "You told {npc:mert_kilic} the fragment was destroyed" }
    aciklama: { tr: "Kaynak parçasını kendine sakladın, ona 'eridi, gitti' dedin.", en: "You kept the source fragment for yourself and told him it melted down to nothing." }
