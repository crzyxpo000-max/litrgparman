# Parti C bilgileri: Yükselenler'in katkı düzeni, Vahit'in sırları, yalanlar.
bilgiler:
  yakit_katkisi:
    tur: sir
    ad: { tr: "Katkı", en: "The contribution" }
    aciklama: { tr: "Tepe'nin sarnıcındaki Kapı zarına giren düşük seviyeli her insan geri gelmiyor; deneyimi halkadaki seçilmişlere bölünüyor. Göğün panelleri buna \"katkı\" diyor ve teşekkür ediyor.", en: "Every low-level person who walks into the Gate membrane in the hill's reservoir stays there, and their experience gets split among the Chosen in the ring. The sky panels call it a \"contribution\" and say thank you." }
  vahit_eski_hayati:
    tur: soylenti
    ad: { tr: "En İyi Hâlin", en: "The Best-Self Hour" }
    aciklama: { tr: "{npc:vahit} kıyametten önce 312 bin takipçili bir kişisel gelişim kanalı yönetiyordu. Son bölümü Entegrasyon sabahı kaydetti: \"Bugün Her Şey Değişebilir.\" O sabah penceresinde bir saniyeliğine \"Seni duyuyorum\" yazdığını söylüyor.", en: "Before the end, {npc:vahit} ran a self-help channel with 312K subscribers. He recorded the last episode the morning of Integration: \"Today Everything Could Change.\" He says that morning his window showed \"I hear you\" for exactly one second." }
  yukari_kapi:
    tur: soylenti
    ad: { tr: "Yukarı açılan kapı", en: "The door that opens upward" }
    aciklama: { tr: "{npc:vahit} sesin ona tek bir kapıdan bahsettiğini söylüyor: bütün kapılar dışarı açılır, bu yukarı. Ve onu senin açacağını.", en: "{npc:vahit} says the voice told him about a single door: every other door opens out, this one opens up. And you'll be the one who opens it." }
  secici_kanali:
    tur: sir
    ad: { tr: "Ön seçim ajanı · Tepe", en: "Pre-selection agent · The Heights" }
    aciklama: { tr: "Sistem {npc:vahit|e} gerçekten konuşuyor: hasadın ön seçim kanalı ona kota veriyor (41.200 / 60.000, teslim Gün 331). Yükselenler bir tarikat değil, hasadın yerel dağıtım şubesi.", en: "The System really does talk to {npc:vahit}: the Harvest's pre-selection channel gives him a quota (41,200 / 60,000, delivery Day 331). The Ascended aren't a cult. They're the Harvest's local distribution branch." }
  vahit_alicilari:
    tur: sir
    ad: { tr: "Dinleme Odası'ndaki yazıcı", en: "The printer in the Listening Room" }
    aciklama: { tr: "{npc:vahit|in} sesi yıllardır Sessiz Ağ'dan çalınmış tarayıcılardan, müritleri hakkındaki el yazısı notlardan ve Sistem'in yazı tipini basan ucuz bir yazıcıdan geliyor. Bir kez duyduğu tek satırı taklit ediyor.", en: "For years {npc:vahit|pos} voice has come from scanners stolen from the Quiet Network, handwritten notes on every disciple, and a cheap printer that does the System's font. He's been faking the one line he heard once." }
  vahit_ikinci_ses_yalani:
    tur: yalan
    ad: { tr: "{npc:vahit|e} 'Sistem seni övüyor' dedin", en: "You told {npc:vahit} 'the System praises you'" }
    aciklama: { tr: "Pilsiz mikrofonun önünde ona duymak istediğini söyledin; ertesi gün bunu on bin kişiye vaaz etti.", en: "In front of the dead mic you told him what he wanted to hear. The next day he preached it to ten thousand people." }
