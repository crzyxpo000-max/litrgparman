# Parti I — Çok-evren bilgileri (sırlar, söylentiler, gerçek seviyeler).
bilgiler:
  gecidin_kapilari:
    tur: soylenti
    ad: { tr: "Ellinci katın kapıları", en: "The doors on the fiftieth floor" }
    aciklama: { tr: "Kule'nin ellinci katının ardında üç kapı var: biri tuzlu su kokuyor, biri pirinç ve tütsü, üçüncüsü mühürlü. Mühürlüyü yalnızca davet açıyor.", en: "Behind the Spire's fiftieth floor there are three doors: one smells like salt water, one like brass and incense, and the third is sealed. Only an invitation opens that one." }
  batik_son_yili:
    tur: sir
    ad: { tr: "Nehhaların son yılı", en: "The Nehha's last year" }
    aciklama: { tr: "Nehhaların da üç yüz altmış beş günü vardı. Dört kampa bölündüler, birbirleriyle savaştılar ve son gün geldiğinde dördü de hazır olduğuna inanıyordu. Hasat bir gecede bitti.", en: "The Nehha had three hundred and sixty-five days too. They split into four camps and fought each other, and when the last day came, all four believed they were ready. The Harvest took one night." }
  nehha_fisildayani:
    tur: sir
    ad: { tr: "Nehhaların fısıldayanı", en: "The Nehha's whisperer" }
    aciklama: { tr: "Tuz Arşivi'ne göre Nehhaların arasında da yalnızca bir kişiye konuşan bozuk bir ses vardı. Arşiv o kişinin adını yazmıyor; yalnızca sesin son gün 'yeniden' dediğini.", en: "According to the Salt Archive, the Nehha had a broken voice too, one that spoke to only one of them. The Archive doesn't record that person's name. Only that, on the last day, the voice said: 'again.'" }
  basakci_cani:
    tur: sir
    ad: { tr: "Başakçı ve çanlar", en: "The Gleaner and the bells" }
    aciklama: { tr: "Son Başakçı, Nehha çanlarının sesinde yönünü kaybeder. Hasat'tan önce o çanlar bu dünyada Sistem'e ait olmayan tek sesti.", en: "The Last Gleaner loses its bearings at the sound of Nehha bells. Before the Harvest, those bells were the only sound on that world that didn't belong to the System." }
  kervan_boyun_senedi:
    tur: sir
    ad: { tr: "Boyun Senedi", en: "The Neckbond" }
    aciklama: { tr: "Tavvarlar dört yüz yıl önce hasat edilmemek için Kadimler'le bir senet imzaladı: dünyalarını bir gemiye çevirip ebediyen hizmet edecek, her kuşağın onda birini Yedi Taht'a verecekler. Senet bir Tavvar sırtına yazıldı.", en: "Four hundred years ago, to avoid being harvested, the Tavvari signed a bond with the Ancients: they'd turn their world into a ship, serve forever and give a tenth of every generation to the Sevenfold Court. The treaty was written on a Tavvari back." }
  ondalik_gercegi:
    tur: sir
    ad: { tr: "Onda birin akıbeti", en: "Where the tithe goes" }
    aciklama: { tr: "Ondalık olarak götürülen Tavvarlar Yedi Taht'ta hizmetkâr olmuyor. Seviyeleri sağılıyor ve Kadimler'in derisinin altına yıldız olarak gömülüyor.", en: "The Tavvari taken as the tithe don't become servants in the Sevenfold Court. Their levels get milked and buried under Ancient skin, as stars." }
  yedinci_taht_sirri:
    tur: sir
    ad: { tr: "Yedinci koltuğun bedeli", en: "The price of the Seventh Seat" }
    aciklama: { tr: "Yedi Taht'ın boş koltuğu, bir dünyayı tek başına hasat edene verilir. Dünya'nın hasadı Gün 365'te kime yazılırsa koltuk onun olacak; bunun bir Kadim olması gerekmiyor.", en: "The empty seat of the Sevenfold Court goes to whoever harvests a world single-handed. Whoever Earth's harvest gets credited to on Day 365 gets the seat, and it doesn't have to be an Ancient." }
  uyuyan_tanrilar:
    tur: sir
    ad: { tr: "Uyuyan tanrılar", en: "The sleeping gods" }
    aciklama: { tr: "Kadimler'in en yaşlıları uyumuyor; boşalmışlar. Yeterince dünya yutan bir Kadim'in içinde kendisi için yer kalmıyor.", en: "The oldest Ancients aren't asleep. They're empty. Swallow enough worlds, and there's no room left inside an Ancient for the Ancient." }
  ossiran_gercek_seviye:
    tur: seviye
    ad: { tr: "Ossiran'ın gerçek seviyesi", en: "Ossiran's real level" }
    aciklama: { tr: "Ossiran'ın görünen seviyesi bir dünyanın değil, üç dünyanın toplamı. Derisinin altındaki yıldızlar çıkarılınca kendi seviyesi şaşırtıcı derecede küçük.", en: "Ossiran's visible level isn't one world's worth. It's three added together. Subtract the stars under his skin, and his own level is surprisingly small." }
