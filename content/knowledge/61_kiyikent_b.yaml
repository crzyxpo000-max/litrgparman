# Parti H bilgileri (events/61_kiyikent_b.yaml).
bilgiler:
  lonca_kacak_emri:
    tur: sir
    ad: { tr: "Silodaki geri çekilme emri", en: "The retreat order at the silo" }
    aciklama: { tr: "Tahıl silosundaki kapıda geri çekilme emrini disiplin subayı verdi; kayda geçmemiş bir sandık C çekirdeğini Tepe'ye satmak için. Üç avcı sandığı korurken öldü.", en: "The provost gave the order to fall back at the grain silo Gate, to save a crate of unregistered C cores he was selling up to {yer:tepe}. Three hunters died guarding it." }
  yanlis_kademe_ilani:
    tur: sir
    ad: { tr: "Elle düzeltilmiş kademe", en: "The hand-corrected Grade" }
    aciklama: { tr: "Gümrük ambarındaki kapı ilanlarından bazılarında C harfi kazınıp D yazılmış. Biri kapıları ucuza satıyor; ekipler de bunun bedelini ölerek ödüyor.", en: "On some Gate notices at the bonded warehouse, the C has been scraped off and a D written in. Somebody's selling Gates cheap, and crews are dying for it." }
  besik_sinavi_hilesi:
    tur: sir
    ad: { tr: "Beşik'in beslenme saati", en: "The Cradle's feeding time" }
    aciklama: { tr: "Tepe'deki Beşik sınavında bekçi yalnızca zengin ailelerin çocukları girmeden önce çekirdekle besleniyor. Yoksul çocuklar aç bir bekçiyle karşılaşıyor.", en: "At {yer:tepe}' Cradle trial, the keeper only gets fed cores right before the rich families' kids go in. Poor kids face it hungry." }
  dinleyici_sayaci:
    tur: soylenti
    ad: { tr: "Başa saran sayaç", en: "The counter that rewinds" }
    aciklama: { tr: "Tepe'nin Dinleyicileri Sistem'in uğultusunda 365'ten geri sayan bir sayaç duyuyor. Bazı geceler sıfırdan sonra yeniden 365 geliyor; eski bir spikere göre bant başa sarıyor.", en: "The Heights' Listeners hear a counter in the System's hum, counting down from 365. Some nights, after zero, 365 comes around again. An old DJ says it sounds like a tape rewinding." }
  sahte_kat_haritalari:
    tur: soylenti
    ad: { tr: "{yer:kule_dibi|in} sahte haritaları", en: "Spire Plaza's fake maps" }
    aciklama: { tr: "Avcı pazarında satılan kat haritalarının çoğunu Kule'ye hiç girmemiş biri çizmiş. Kule de zaten her gece kendi haritasını değiştiriyor.", en: "Most of the floor maps sold at the hunters' market were drawn by people who never set foot in the Spire. The Spire redraws itself every night anyway." }
  sahte_rekor_gercegi:
    tur: seviye
    ad: { tr: "Kızıl Merdiven'in gerçek katı", en: "The Red Ladder's real floor" }
    aciklama: { tr: "Kızıl Merdiven yirminci katı geçtiğini söylüyor; kristalleri on dördüncü katın mavisi. On dördüncü katta üç kişiyi bırakıp inmişler.", en: "The Red Ladder claims Floor 20. Their crystals are Floor 14 blue. They left three people behind on 14 and came down." }
