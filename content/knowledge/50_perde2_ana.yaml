# Parti A — Perde 2 ana yay bilgi günlüğü kayıtları.
bilgiler:
  sistem_basligi:
    tur: sir
    ad: { tr: "Sistem'in başlığı", en: "The System's header" }
    aciklama: { tr: "{yer:kasaba_cekirdegi|in} altındaki bakım katmanında, her şeyin en üstünde duran satır: Sistem'in kendi adı ve neden var olduğu. Ne yazdığını okudun; kimin yazdığı hâlâ silik.", en: "In the maintenance layer under {yer:kasaba_cekirdegi}, the line that sits above everything else: the System's own name, and why it exists. You've read what it says. Who wrote it is still smudged out." }
  yineleme_sayisi:
    tur: sir
    ad: { tr: "Yineleme: 4.117", en: "Iteration: 4,117" }
    aciklama: { tr: "Başlığın en altında, kimsenin bakmayacağı bir köşede küçük bir sayı: yineleme. Bir şey bu işi daha önce dört bin yüz on altı kez yapmış.", en: "At the very bottom of the header, in a corner nobody would ever look, a small number: iteration. Something has done this four thousand one hundred and sixteen times before." }
  kule_yaziti:
    tur: soylenti
    ad: { tr: "Kule'nin kapısındaki yazı", en: "The writing on the Spire's door" }
    aciklama: { tr: "Kule'nin ilk kapısının lentosunda, Sistem'in harfleriyle ama Sistem'in sesiyle değil yazılmış bir satır: \"Zirveye çıkan, başlığı okur. Başlığı okuyan, geri dönmez.\" Kimse ikinci cümlenin bir uyarı mı bir vaat mi olduğunu bilmiyor.", en: "Carved into the lintel of the Spire's first door, in the System's letters but not in the System's voice: \"Whoever reaches the top reads the header. Whoever reads the header doesn't come back.\" Nobody knows if the second half is a warning or a promise." }
  kadim_gozcu:
    tur: sir
    ad: { tr: "Sırttaki gözcü", en: "The watcher on the ridge" }
    aciklama: { tr: "Öğretici'de sırtın üstünden seni izleyen şey bir Kadim gözcüsüydü. Görevi insanlığı değil, hasadın verimini ölçmek; raporunda adın ayrı bir satırda.", en: "The thing that watched you from the ridge in the Tutorial was an Ancient watcher. Its job isn't measuring humanity, it's measuring the yield of the harvest. You get your own line in its report." }
  tasma_sayaci:
    tur: soylenti
    ad: { tr: "Kordon kapısının sayacı", en: "The Esplanade Gate's countdown" }
    aciklama: { tr: "Kordon'daki kapının üstünde, döndüğün gün herkesin gördüğü bir sayaç: taşmaya 49 gün. Kimse o kapıyı kapatacak kadar güçlü değil; ya da güçlü olan, henüz kapatmaya karar vermedi.", en: "Over the Gate on the Esplanade, a counter everybody saw the day you got back: 49 days to overflow. Nobody's strong enough to close it. Or whoever is strong enough hasn't decided to yet." }
