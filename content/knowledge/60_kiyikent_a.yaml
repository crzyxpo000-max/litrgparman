# Parti G — Perde 2 Kıyıkent bilgileri (sırlar ve gerçek seviyeler).
bilgiler:
  duvar_kayit_satiri:
    tur: sir
    ad: { tr: "Kayıpların gizli satırı", en: "The hidden line on the missing" }
    aciklama: { tr: "Sistem herkese \"kayıt yok\" der; ama her kaybın bir dosyası var: Silindi, Aktif ya da gizlenmiş. Bazıları bulunmak istemiyor ve Sistem bu tek isteği harfiyen yerine getiriyor.", en: "The System tells everyone \"no record.\" But every missing person has a file: Deleted, Active, or hidden. Some of them don't want to be found, and the System honors that one wish to the letter." }
  duvar_ayrilmis_uc:
    tur: sir
    ad: { tr: "Ayrılmış üç satır", en: "Three reserved lines" }
    aciklama: { tr: "Kayıplar Duvarı'nda üç kişinin satırı seninki gibi adsız bir renkte: Ayrıldı. Sistem onlara da bir parça göndermiş; tutunamamışlar. Parça bir bedene bağlanır, beden taşıyamazsa ikisi birden silinir.", en: "On the Wall of the Missing, three people's lines are the same nameless color as yours: Reserved. The System sent them a piece too, and they couldn't hold on. The piece binds to a body. If the body can't carry it, both are deleted." }
  kantarci_gercek_seviye:
    tur: seviye
    ad: { tr: "Kantarcının gerçek seviyesi", en: "The Weighmaster's real level" }
    aciklama: { tr: "Balıkhanenin kantarcısı Seviye 31 görünüyor. Gerçeği 18; Mezat Sesi yeteneği korkunca tutmuyor.", en: "The fish hall Weighmaster shows Level 31. She's really an 18, and her Auction Chant can't hold when she's scared." }
  balikhane_kristal_kaynagi:
    tur: sir
    ad: { tr: "Pürüzsüz kristaller", en: "The smooth crystals" }
    aciklama: { tr: "Uyanmış insanlar da ölünce Öz Kristali düşürür. Balıkhanede satılan pürüzsüz kristaller dönüş gecesi körfeze düşenlerden ve sonra ölenlerden geliyor; her birinin içinde sahibinin adı yazılı.", en: "Awakened people drop Essence Crystals when they die, same as monsters. The smooth crystals sold at the fish hall come from the people the return dropped into the sound, and from everyone who died after. Each one has its owner's name written inside." }
  tasma_takvimi:
    tur: sir
    ad: { tr: "Taşma takvimi", en: "The break schedule" }
    aciklama: { tr: "Kordon'daki kapı mühürlüydü: \"Açılış: Gün 80. Taşma takvimi değiştirilemez. Değerlendirme aşaması 2/5.\" Kapı taşmaları kaza değil; bir takvime yazılmış.", en: "The Esplanade Gate was sealed: \"Opens: Day 80. Break schedule cannot be modified. Assessment phase 2 of 5.\" Gate breaks aren't accidents. They're on a calendar." }
  fener_geri_sayim:
    tur: sir
    ad: { tr: "Fenerin geri sayımı", en: "The lighthouse countdown" }
    aciklama: { tr: "Kordon'daki eski fener Entegrasyon'dan beri ölü bir frekansta kalan günleri sayıyor: \"Bu iletim yerel kullanıcılara yönelik değildir.\" Bipin içinde küçük harfli ikinci bir ses: hâlâ orada mısın?", en: "Since Integration, the old lighthouse on the Esplanade has been counting down the days left on a dead frequency: \"This transmission is not intended for local users.\" Inside the beep, a second, lowercase voice: are you still there?" }
