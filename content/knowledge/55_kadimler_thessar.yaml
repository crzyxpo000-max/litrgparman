# Parti E — Kadimler ve Elçi Thessar: sırlar, söylentiler, gerçek seviyeler ve söylenen yalanlar.
bilgiler:
  kadim_ithren:
    tur: sir
    ad: { tr: "Kadimler'in kendilerine verdiği ad", en: "What the Ancients call themselves" }
    aciklama: { tr: "Kendilerine Ithren diyorlar: \"hâlâ sayanlar\". Saymayı bırakan bir Ithren'in artık bir adı olmuyor; yalnızca bir toplamı oluyor.", en: "They call themselves the Ithren: \"the ones still counting.\" An Ithren who stops counting doesn't have a name anymore. Just a total." }
  thael_kelimesi:
    tur: soylenti
    ad: { tr: "Thael", en: "Thael" }
    aciklama: { tr: "Kadim dilinde konuk hakkı. Bir Ithren birine thael derse, onu hasat etmek ödenemeyecek bir borca dönüşür. Söylentiye göre bu kelime son bin yılda üç kez söylendi.", en: "Guest-right, in the Ancients' tongue. If an Ithren calls someone thael, harvesting them becomes a debt that can never be paid. Rumor says the word has been spoken three times in the last thousand years." }
  vel_bedeli:
    tur: sir
    ad: { tr: "Vel'in gerçek bedeli", en: "The real price of vel" }
    aciklama: { tr: "Sayım çadırlarında hiçbir şey parayla satılmıyor. Bedel, adının Defter'e yazılması: kaydedilen bir insan artık Kadimler'in malı sayılıyor. Mal korunur. Mal satılır da.", en: "Nothing at the tally tents is sold for money. The price is your name in the Ledger. Once you're entered, you count as the Ancients' property. Property gets protected. Property also gets sold." }
  kadim_imzasi:
    tur: sir
    ad: { tr: "Kadimler'in Gün 365'i", en: "The Ancients' own Day 365" }
    aciklama: { tr: "Bir zamanlar Ithren'e de üç yüz altmış beş gün verildi. Hasat edilmemek için imzaladılar ve hasatçı oldular. Defter'in ilk satırı onların kendi adı.", en: "The Ithren were given three hundred sixty-five days once, too. They signed so they wouldn't be harvested, and they became harvesters. The first line in the Ledger is their own name." }
  thessar_gercek_seviye:
    tur: seviye
    ad: { tr: "Elçinin gerçek seviyesi", en: "The Envoy's real level" }
    aciklama: { tr: "{npc:thessar} kendini Seviye 120 gösteriyor; Kadim elçileri kademelerini bir nezaket olarak düşük gösterir. Gerçeği okunmuyor. Okuyabildiğin tek şey: gösterdiğinin birkaç katı.", en: "{npc:thessar} shows Level 120. Ancient envoys show a lower Grade as a courtesy. The real number won't read. All you can tell is that it's several times what he shows." }
  meclis_budamasi:
    tur: sir
    ad: { tr: "Meclis'in Budayıcı'sı", en: "The Conclave's Pruner" }
    aciklama: { tr: "Meclis, hesabı bozan sapmaları budamak için bir Budayıcı gönderir. Bu kez iki dal var: anomali ve onu raporlayıp duran elçi.", en: "The Conclave sends a Pruner to cut away any deviation that throws off the books. This time there are two branches: the anomaly, and the envoy who kept filing reports on it." }
  defterdeki_ilk_anomali:
    tur: sir
    ad: { tr: "Defter'deki ilk anomali", en: "The first anomaly in the Ledger" }
    aciklama: { tr: "Defter'in en eski sayfasında, Ithren'in kendi adının hemen altında, senin gibi bir satır var: okunmayan, sayılmayan bir şey. Ithren onu budadı ve imzaladı. Kafandaki ses bu satırı okurken susuyor.", en: "On the oldest page of the Ledger, right under the Ithren's own name, there's a line like you: something that wouldn't read, wouldn't count. The Ithren pruned it, and then they signed. The voice in your head goes quiet when you read that line." }
  mert_kadim_dosyasi:
    tur: sir
    ad: { tr: "Muhbirin dosyası", en: "The informant's file" }
    aciklama: { tr: "{npc:mert_kilic} Kadimler'e rapor veriyor. Raporların yarısı Sessiz Ağ hakkında; öbür yarısı senin hakkında. Her birinin sonunda aynı not: \"Bana dokunmayacaklarına söz verdiler.\"", en: "{npc:mert_kilic} has been reporting to the Ancients. Half the reports are about the Quiet Network. The other half are about you. Every one ends with the same note: \"They promised they wouldn't touch me.\"" }
  sahte_okuma_yalani:
    tur: yalan
    ad: { tr: "Elçiye sahte bir okuma verdin", en: "You fed the Envoy a fake reading" }
    aciklama: { tr: "{npc:yanki} onun Okuyucu'suna bir yalan okuttu: daha küçük, daha sıradan, daha insan bir sen. Kadimler muhasebecidir; hesaplar bir gün tutmaz.", en: "{npc:yanki} let his Reader read a lie: a smaller, plainer, more human you. The Ancients are accountants. Someday the numbers won't add up." }
  vergi_yalani:
    tur: yalan
    ad: { tr: "Vel vergisini sahte kristalle ödedin", en: "You paid the vel with fake crystals" }
    aciklama: { tr: "Kristallerin yarısı içi boş camdı. {npc:thessar|e} hepsinin gerçek olduğunu söyledin, gözlerinin içine bakarak.", en: "Half the crystals were hollow glass. You told {npc:thessar} they were all real, looking him straight in the eye." }
  muhbir_yalani:
    tur: yalan
    ad: { tr: "Elçiye sahte isimler verdin", en: "You gave the Envoy fake names" }
    aciklama: { tr: "Muhbir listesinde direnişçi diye yazdığın isimlerin yarısı çoktan ölmüş insanlara ait. Öbür yarısı hiç var olmadı.", en: "Half the names you listed as resistance were people already dead. The other half never existed." }
  yanlis_kisi_yalani:
    tur: yalan
    ad: { tr: "Elçiye \"yanlış kişi\" dedin", en: "You told the Envoy he had the wrong person" }
    aciklama: { tr: "Rıhtımda, kalabalığın içinde, gözlerinin içine bakıp aradığı kişi olmadığını söyledin. Bir muhasebeciye söylenebilecek en kısa yalan.", en: "On the pier, in the middle of the crowd, you looked him in the eye and said you weren't the one he was looking for. The shortest lie you can tell an accountant." }
