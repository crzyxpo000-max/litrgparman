# Parti B — Orman ve genel olaylar bilgileri (söylentiler, sırlar, gerçek seviyeler).
bilgiler:
  avci_ortagi:
    tur: soylenti
    ad: { tr: "Ölü avcının açık penceresi", en: "The dead hunter's open window" }
    aciklama: { tr: "Kurtardığın avcının ortağı {yer:kirik_istasyon|de} bir kapının önünde öldü. Sistem penceresi hâlâ açık, ganimeti hâlâ orada.", en: "The partner of the hunter you saved died in front of a Gate at the {yer:kirik_istasyon}. His System window is still open. So is his loot." }
  bereket_zehri:
    tur: sir
    ad: { tr: "Korunun zehri", en: "The grove's poison" }
    aciklama: { tr: "Sisli ormanın meyve korularında alçak dallardaki meyveler yemdir ve zehirlidir. Güvenli olanlar tepededir, hiçbir hayvanın ulaşamadığı yerde.", en: "In the Fogwood's fruit groves, the low-hanging fruit is bait, and it's poisoned. The safe stuff grows up top, where no animal can reach." }
  dokuyucu_isaretleri:
    tur: sir
    ad: { tr: "Çentikli oklar", en: "The notched arrows" }
    aciklama: { tr: "Ağaçlardaki derin, çentikli okları insanlar kazımadı. Sis Dokuyucu, insanların okları takip ettiğini öğrendi.", en: "People didn't carve those deep, notched arrows on the trees. The Fog Weaver figured out that people follow arrows." }
  agin_isaretleri:
    tur: sir
    ad: { tr: "Daireli oklar", en: "The circled arrows" }
    aciklama: { tr: "Ucunda daire olan oklar {fraksiyon:sessiz_ag|in} güvenli yollarıdır. Yanlarındaki sayı, yolun hangi saatte kullanıldığını söyler.", en: "Arrows with a circle at the tip mark {fraksiyon:sessiz_ag|pos} safe routes. The number beside them tells you what hour the path gets walked." }
  beyazli_adam:
    tur: soylenti
    ad: { tr: "Ormandaki beyazlı adam", en: "The man in white in the woods" }
    aciklama: { tr: "Beyazlar giymiş biri ormanda kaybolan çocukları \"ışığa\" götürüyor. Kimse ışığın nerede olduğunu bilmiyor.", en: "Someone dressed in white has been leading lost kids in the woods \"to the light.\" Nobody knows where the light is." }
  sahte_seviye_gercek:
    tur: seviye
    ad: { tr: "Tezgâhtaki adamın gerçek seviyesi", en: "The man at the counter's real level" }
    aciklama: { tr: "{yer:harabe_carsi|de} koruma ücreti toplayan adamın başındaki on dokuz bir yanılsama. Gerçek seviyesi 4.", en: "The nineteen floating over the guy collecting protection money at the {yer:harabe_carsi} is an illusion. His real level is 4." }
