# Parti F — Deniz, Yankı ve Aras yaylarının bilgi günlüğü kayıtları.
bilgiler:
  kardes_yakit_listesi:
    tur: sir
    ad: { tr: "Seçilmiş · Yeniden sınıflandırıldı", en: "Chosen · Reclassified" }
    aciklama: { tr: "{fraksiyon:yukselenler} çocukları iki listede tutuyor: seçilmişler ve yakıt. {npc:deniz_arman|in} kardeşi {yer:kordon} taşmasından bir hafta önce birinci listeden ikinciye aktarıldı. Gerekçe satırında 'eğilim yetersiz' yazıyor.", en: "{fraksiyon:yukselenler} keep the kids on two lists: the Chosen and the fuel. The week before {yer:kordon} breach, {npc:deniz_arman|pos} sister was moved from the first list to the second. Reason field: 'insufficient affinity.'" }
  yanki_kaynak:
    tur: sir
    ad: { tr: "Dikiş yeri", en: "The seam" }
    aciklama: { tr: "Kule'nin katları arasında Sistem'in kendi kodunun açıkta kaldığı bir dikiş yeri var. {npc:yanki} oradan koparılmış; yara hâlâ kapanmamış.", en: "Between the Spire's floors there's a seam where the System's own code shows through. {npc:yanki} was torn out of it, and the wound never closed." }
  onceki_tasiyici:
    tur: sir
    ad: { tr: "Önceki taşıyıcı", en: "The previous carrier" }
    aciklama: { tr: "0x00 kaydında senden önce bir taşıyıcı daha görünüyor. Adı silinmiş, geriye yalnızca son komutu kalmış: [HAYIR].", en: "There's another carrier on 0x00's record, before you. The name's been wiped. Only the last command survived: [NO]." }
  dongu_gercegi:
    tur: sir
    ad: { tr: "Döngü", en: "The Loop" }
    aciklama: { tr: "Sistem bir döngüdür. Her Entegrasyon bir öncekinin küllerinden doğar, her döngü de kendine bir anomali seçer. Önceki altı döngünün altısı da hasatla bitti; şimdiki yedincisi. {npc:yanki} ilk döngünün anomalisinden geriye kalan parçadır: hayır demiş, kesilip atılmış ve o günden beri her döngünün anomalisine bağlanmış biri.", en: "The System is a loop. Every Integration starts from the ashes of the last one, and every cycle picks an anomaly. All six cycles before this one ended in a harvest; this is the seventh. {npc:yanki} is what's left of the first cycle's anomaly: someone who said no, got cut loose for it, and has been bolted onto every cycle's anomaly since." }
  aras_kopru:
    tur: sir
    ad: { tr: "{npc:aras_kurt|in} köprüsü", en: "{npc:aras_kurt|pos} bridge" }
    aciklama: { tr: "Aktarımdan önceki gece {npc:aras_kurt} köprünün korkuluklarının öbür yanındaydı; öldürmesi gereken kişi kendisiydi. Derken gökyüzü açıldı ve ona bir sayı verdi.", en: "The night before the transfer, {npc:aras_kurt} was on the wrong side of a bridge railing. The person he was supposed to kill was himself. Then the sky opened and gave him a number." }
  aras_kadim_teklifi:
    tur: soylenti
    ad: { tr: "Kısayol", en: "The shortcut" }
    aciklama: { tr: "Çok-evren geçidinin öbür yanında bir {fraksiyon:kadimler} gözcüsü {npc:aras_kurt|e} bir kısayol önerdi: S kademesine giden, bedeli sonra ödenecek bir yol.", en: "On the far side of the multiverse gate, a scout for {fraksiyon:kadimler} offered {npc:aras_kurt} a shortcut: a road straight to S-Grade, with the bill coming due later." }
