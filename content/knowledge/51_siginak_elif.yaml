# Parti B1 bilgileri.
bilgiler:
  demir_gece_plani:
    tur: sir
    ad: { tr: "Demir Gece", en: "Iron Night" }
    aciklama: { tr: "Pala'nın adamları tahliyenin kargaşasında Konsey'in deposunu ve Gümrük'teki hastaneyi almayı planlıyor. Kol balık halinin arkasındaki dar sokaktan geçecek.", en: "Cleaver's men are planning to use the evacuation chaos to take the Council's armory and the Customs House hospital. The column will come through the narrow alley behind the fish market." }
  onceki_siginak:
    tur: sir
    ad: { tr: "Kuru havuzun altındaki sığınak", en: "The haven under the drydock" }
    aciklama: { tr: "Son Sığınak'ın altında, ondan çok daha eski, elle oyulmuş bir oda var. Duvarlarında Konsey'in tahtasındakiyle aynı beşli çentikler, kapısında neredeyse tanıdık harflerle SIĞINAK yazıyor. Sayan kişi beşinci çizgiyi çizemeden bitmiş. Birileri burada, bizden önce, aynı şeyi yaşamış.", en: "Under the Last Haven there's a hand-carved chamber far older than the drydock. Its walls are covered in the same groups-of-five tallies as the Council's whiteboard, and over the door, in letters that are almost familiar, it says HAVEN. Whoever was counting ran out before the fifth line. Someone lived through this same thing here, before us." }
