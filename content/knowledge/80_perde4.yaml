# Parti K1 — Perde 4 bilgileri (sırlar, gerçek seviyeler).
bilgiler:
  filo_acigi:
    tur: sir
    ad: { tr: "Amiral gemisinin dikişi", en: "The flagship's seam" }
    aciklama: { tr: "Esir düşen Kadim Öncüsü'nün defterinden: Hasat Valisi'nin gemisi iniş anında hasat sütununa güç verirken kalkanını açar. Sütunun dibinde, zırhın dikiş yerinde, kalp atışı kadar kısa bir boşluk var.", en: "From the captured Pathfinder's ledger: when the Harvest Prefect's flagship lands, it drops its shield to power the harvest pillar. At the base of the pillar, at the seam of the armor, there's a gap about as long as a heartbeat." }
  oncu_defteri:
    tur: sir
    ad: { tr: "Öncünün defteri", en: "The Pathfinder's ledger" }
    aciklama: { tr: "Kadim Öncüsü {yer:kiyikent|i} metrekare metrekare ölçmüş. Her sokağın yanında bir verim tahmini, her mahallenin yanında bir \"hasat sırası\" yazıyor. Senin adının yanında yalnızca bir soru işareti var.", en: "The Ancient Pathfinder measured {yer:kiyikent} square foot by square foot. Every street has a yield estimate next to it, every neighborhood a \"harvest order.\" Next to your name there's nothing but a question mark." }
  vali_hafizasi:
    tur: sir
    ad: { tr: "Valinin hafızası", en: "The Prefect's memory" }
    aciklama: { tr: "Hasat Valisi'nin son düşünceleri bir sayımdı: bin dört yüz on bir dünya. Her birinde bir \"anomali\" çıkmış; her birinde anomali hasattan hemen önce kaybolmuş. Vali bunu hiç merak etmemiş.", en: "The Harvest Prefect's last thoughts were a tally: one thousand four hundred eleven worlds. Every one of them produced an \"anomaly.\" On every one, the anomaly vanished right before the harvest. The Prefect never once wondered why." }
  cekirdek_kaydi:
    tur: sir
    ad: { tr: "Çekirdeğin kaydı", en: "The Core's log" }
    aciklama: { tr: "Sistem Çekirdeği'nin kendi kaydı: Dünya \"Katman adayı\" olarak listelenmiş; listede ondan önce binlerce aday var. Her kaydın sonunda aynı satır: [Son erişim: bir önceki döngü].", en: "The System Core's own log: Earth is listed as a \"Layer candidate,\" with thousands of candidates ahead of it. Every entry ends with the same line: [Last accessed: previous cycle]." }
  makas_listesi:
    tur: sir
    ad: { tr: "Makasın ağzındaki isimler", en: "The names on the shears" }
    aciklama: { tr: "Meclis Makası'nın ağzına kazınmış isimler sapmaların, anomalilerin isimleri. Bazıları insan adına benziyor. Biri, harf harf, seninkine.", en: "The names engraved on the Conclave Shears belong to deviations, anomalies. Some of them look like human names. One of them, letter for letter, looks like yours." }
