# Parti J bilgileri (events/71_perde3.yaml).
bilgiler:
  yol_onceki_tasiyici:
    tur: sir
    ad: { tr: "Önceki taşıyıcı", en: "The last carrier" }
    aciklama: { tr: "{npc:yanki} senden önce başka bir şehirde, başka bir döngüde bir başkasına bağlıydı. O kişi ateşi ve duvarları seçmişti; sabahları ayakkabısını çift düğümle bağlardı.", en: "{npc:yanki} was bonded to somebody before you, in another city, another loop. They picked fire and walls. Every morning, they double-knotted their shoes." }
  bosluk_fisiltisi:
    tur: sir
    ad: { tr: "Dünyaların arasındaki fısıltı", en: "The whisper between worlds" }
    aciklama: { tr: "Dünyalar arasındaki karanlıkta ölü şeyler sana yol veriyor, hepsi de aynı sözcüğü fısıldıyor: yeniden.", en: "In the dark between worlds, dead things get out of your way, and they're all whispering the same word: again." }
  mert_listesi:
    tur: sir
    ad: { tr: "Üç yüz on iki isim", en: "Three hundred twelve names" }
    aciklama: { tr: "Sessiz Ağ'ın bütün üyeleri, muhbirleri ve Sistem'i okumaya kalkışmış herkes: Kadimler'in hasat sırası. Liste şimdi senin cebinde.", en: "Every Quiet Network member, every informant, everyone who ever tried to read the System. The Ancients' harvest order. Now it's in your pocket." }
  hasat_defteri:
    tur: sir
    ad: { tr: "Hasat Defteri", en: "The Harvest Ledger" }
    aciklama: { tr: "Defterde Kadim filosunun geliş açısı, ilk inecek birlikler ve hangi şehrin hangi gün susturulacağı yazılı. {npc:thessar} bu defteri dört yüz yıl boyunca tuttu.", en: "The Ancient fleet's approach vector, which units land first, and which city gets silenced on which day. {npc:thessar} kept this ledger for four hundred years." }
  olcucu_listesi:
    tur: sir
    ad: { tr: "Ölçücünün listesi", en: "The Assessor's list" }
    aciklama: { tr: "Kadim Ölçücüsü yalnızca seni ölçmedi: {yer:kiyikent|in} en güçlü kırk insanının ölçüleri filonun elinde.", en: "The Ancient Assessor didn't just measure you. The fleet has measurements on {yer:kiyikent|pos} forty strongest humans." }
  dort_duzeltme:
    tur: sir
    ad: { tr: "Dört düzeltme", en: "Four corrections" }
    aciklama: { tr: "Sistem seni dört kez silmeye çalıştı; üçünü hatırlamıyorsun. Belki de bir önceki döngüdeydiler.", en: "The System has tried to delete you four times. You don't remember three of them. Maybe they happened last loop." }
  amiral_gemisi:
    tur: sir
    ad: { tr: "Sonda gelen gemi", en: "The ship that comes at the end" }
    aciklama: { tr: "{npc:yanki} adını hatırlamıyor, o adı ona kimin verdiğini de bilmiyor. Ama Kadim filosunun amiral gemisini tanıyor; gölgesinin birden çok gökyüzünü örttüğünü hatırlıyor. Gemi hep sonda gelmiş, hiçbir zaman başta değil. Nedeni ya Kule'nin zirvesinde ya Çekirdek'te.", en: "{npc:yanki} doesn't remember its name, or who gave it one. But it knows the Ancient flagship: it remembers that ship's shadow falling across more than one sky. The ship always came at the end, never at the beginning. The reason is at the top of the Spire, or in the Core." }
  kuyruktaki_muhbirler:
    tur: soylenti
    ad: { tr: "Kuyruktaki on iki kişi", en: "The twelve in line" }
    aciklama: { tr: "Orduna katılmak için kapında bekleyenlerden on ikisi başkalarına rapor veriyordu. Yüzlerini biliyorsun.", en: "Twelve of the people lined up to join your army were reporting to someone else. You know their faces." }
  ellinci_kat_hizmet:
    tur: soylenti
    ad: { tr: "Hizmet girişi", en: "The service entrance" }
    aciklama: { tr: "Kule'nin elli birinci katındaki Kat, aşağı kademelerin hizmet girişinden taşıdığı su ve çöple ayakta duruyor.", en: "The Floor on the Spire's fifty-first story runs on water and trash hauled through the service entrance by the lower Grades." }
  ilk_ondaki_muhbirler:
    tur: sir
    ad: { tr: "Gümüş pullar", en: "The silver tokens" }
    aciklama: { tr: "Küresel Sıralama'nın ilk onundan ikisi cebinde Kadim pulu taşıyordu. Biri öğretmendi.", en: "Two of the Global Ranking's top ten were carrying Ancient tokens. One of them was a teacher." }
  batik_tohum:
    tur: sir
    ad: { tr: "Mercan yolcu", en: "The coral stowaway" }
    aciklama: { tr: "{yer:batik_takimada|den} dönenlerin bazıları içlerinde tuzlu, aç ve büyüyen bir tohum taşıyor.", en: "Some of the people coming back from {yer:batik_takimada} are carrying a seed inside them. Salty, hungry, and growing." }
  leviatan_hikayesi:
    tur: soylenti
    ad: { tr: "Balıkçının dedesi", en: "The fisherman's granddad" }
    aciklama: { tr: "Denizden gelen her büyük şey bir şey kaybetmiştir. Bulursan gider; bulamazsan seni de kaybeder.", en: "Every big thing that comes out of the sea has lost something. Find it, and it leaves. Don't, and it loses you too." }
  firtina_tasi:
    tur: sir
    ad: { tr: "Fırtına taşı", en: "The storm stone" }
    aciklama: { tr: "Yedi kapıyı birden çağıran işaret taşı Kadim işiydi: biri seni ölçmek istemişti.", en: "The marker stone that called seven Gates at once was Ancient work. Somebody wanted to measure you." }
