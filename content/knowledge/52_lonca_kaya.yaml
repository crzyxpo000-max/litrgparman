# Parti B2 bilgileri: Kaya'nın geçmişi, Lonca'nın defteri, Mavi Çapa ihbarı, darbe planı.
bilgiler:
  kaya_yirtilan_emir:
    tur: sir
    ad: { tr: "{npc:kaya_demir|in} yırttığı emir", en: "The order {npc:kaya_demir} tore up" }
    aciklama: { tr: "Büyük bir depremin ardından {npc:kaya_demir|in} birliği bir spor salonunu barınağa çevirmişti. Yağmurlu bir gecede 'kapasite doldu, kapıları kilitleyin' emri geldi; o kapıları açık tuttu, emri yırttı ve rütbesi söküldü. O gece salona giren kırk iki kişinin hepsi sabahı gördü.", en: "After a Gulf hurricane, {npc:kaya_demir|pos} unit turned a high school gym into a shelter. One night, with the water still rising, the order came down: capacity reached, lock the doors. He propped them open, tore the order in half, and got busted down a rank. All forty-two people who came through those doors that night saw morning." }
  lonca_katki_defteri:
    tur: sir
    ad: { tr: "Katkı defterinin son sayfası", en: "The last page of the contribution ledger" }
    aciklama: { tr: "Lonca'nın Destek sütunu eski 'ağız' sütununun yeni adı. Katkısı sıfır olanlar kapı işlerinde 'yük' olarak önden gönderiliyor; defterde bunun için ayrı bir sütun var: GERİ DÖNMEYEN.", en: "The Guild's Support column is just the old 'mouths' column with a new name. People with zero contribution get sent first through gates as 'load,' and the ledger has a separate column just for that: DIDN'T COME BACK." }
  capa_sahte_ihbar:
    tur: sir
    ad: { tr: "Mavi Çapa ihbarı sahte", en: "The Blue Anchor tip was forged" }
    aciklama: { tr: "Mavi Çapa'yı Kadimler'le iş birliğiyle suçlayan ihbar Lonca'nın kendi defterinde yazıldı. İçinde tek bir doğru isim var: Kadim simsarına kule kristali satan tek bir adam. Gerisi bir loncayı yutmak için uydurulmuş.", en: "The tip accusing the Blue Anchor of collaborating with the Ancients was written in the Guild's own ledger. Exactly one name on it is real: a single guy who sold Spire crystals to an Ancient broker. The rest was made up to swallow a whole guild." }
  capa_kacis_yalani:
    tur: yalan
    ad: { tr: "Mavi Çapa'nın kaçışını 'şans' diye anlattın", en: "You told the Guild the Blue Anchor 'just got lucky'" }
    aciklama: { tr: "Çapa'yı sen uyardın; {npc:kaya_demir|e} salonun boş bulunduğunu, birinin onları önceden duymuş olması gerektiğini söyledin.", en: "You were the one who tipped off the Anchor. You told {npc:kaya_demir} the hall was already empty when you got there, that somebody must have heard you coming." }
  liman_reisi_seviyesi:
    tur: seviye
    ad: { tr: "Liman Reisi'nin gerçek seviyesi", en: "The Harbormaster's real level" }
    aciklama: { tr: "Mavi Çapa'nın başındaki eski römorkör kaptanı penceresini olduğundan düşük gösteriyor. Lonca'nın sandığından çok daha güçlü; ama senin yanında yine bir çocuk.", en: "The old tugboat captain who runs the Blue Anchor keeps his window dialed down. He's a lot stronger than the Guild thinks. Next to you, he's still a kid." }
  kaya_darbe_plani:
    tur: sir
    ad: { tr: "Demir Lonca'nın şafak planı", en: "The Iron Guild's dawn plan" }
    aciklama: { tr: "{npc:kaya_demir|in} haritası: Sistem'in geri sayımı 65 gün gösterdiği sabah iki zırhlı kol Kasaba Çekirdeği'ni ve Konsey binasını alacak. Konsey 'savaş süresince' askıya alınacak. Planda tek bir cümle kırmızıyla yazılmış: 'Kan dökülmeyecek. Gerekmedikçe.'", en: "{npc:kaya_demir|pos} map: on the morning the System countdown reads 65 days, two armored columns take {yer:kasaba_cekirdegi} and the Council building. The Council gets suspended 'for the duration.' One line on the plan is written in red: 'No bloodshed. Unless necessary.'" }
