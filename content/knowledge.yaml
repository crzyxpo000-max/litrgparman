# Bilgi günlüğü (OP MC): söylentiler, sırlar ve gerçek seviyeler diyalog seçeneklerini açar (`bilgi` koşulu).
# Yalanlar da buradan başlık alır: `yalan: {npc, konu}` etkisinde `konu` bir bilgi kimliğiyse hatırada adı görünür.
bilgiler:
  deniz_plan_yalani:
    tur: yalan
    ad: { tr: "{npc:deniz_arman|e} 'bir planım vardı' dedin", en: "You told {npc:deniz_arman} you had a plan" }
    aciklama: { tr: "Tazılar onu sıkıştırırken bekledin. Sonra bunu bir plana benzettin.", en: "You waited while the hounds had them cornered. Then you dressed it up as a plan." }
  aras_hizi:
    tur: seviye
    ad: { tr: "{npc:aras_kurt} senin kadar hızlı", en: "{npc:aras_kurt} is as fast as you" }
    aciklama: { tr: "Öğretici'de onun kadar hızlı tırmanan başka kimse yok. Sıralamaya bak.", en: "Nobody else in the Tutorial is climbing like that. Check the board." }
  yanki_parcasi:
    tur: sir
    ad: { tr: "Yankı bir parça", en: "Echo is a fragment" }
    aciklama: { tr: "{npc:yanki}, Sistem'in koparılmış bir parçası. Ne zaman ve kim tarafından, söylemiyor.", en: "{npc:yanki} is a piece torn off the System. It won't say when, or by whom." }
  sirala_maske:
    tur: sir
    ad: { tr: "Sıralamadaki maske", en: "The mask on the board" }
    aciklama: { tr: "Küresel Sıralama senin görünen seviyeni gösteriyor. Gerçeğini {npc:yanki} saklıyor.", en: "The Global Ranking shows your public level. {npc:yanki} is hiding the real one." }
