gunluk:
  temel_kondisyon:
    baslik: { tr: "Temel Kondisyon", en: "Basic Conditioning" }
    aciklama: { tr: "50 burpee, 300 ip atlama, 3 dakika plank, 5 km tempolu yürüyüş. Gün bitmeden. Bahane kabul edilmez; bahaneler kaydedilir.", en: "50 burpees, 300 jump-rope skips, a 3-minute plank, a 3-mile ruck walk. Before the day ends. Excuses are not accepted. Excuses are logged." }
    tur: "antrenman"
    adim: 4
    xp: 30
  sabah_kosusu:
    baslik: { tr: "Şafak Koşusu", en: "Dawn Run" }
    aciklama: { tr: "Güneş doğmadan 5 km koşu, 50 şınav, 50 squat. Uyumak bir seçenekti. Sen yanlış olanı seçtin.", en: "3-mile run before sunrise, 50 push-ups, 50 squats. Sleeping in was an option. You picked the wrong one." }
    tur: "antrenman"
    adim: 3
    xp: 25
  guc_seti:
    baslik: { tr: "Güç Seti", en: "Strength Set" }
    aciklama: { tr: "150 şınav, 50 barfiks, 20 kg yükle 1 km yürüyüş, 100 squat. Kaslarının şikâyeti dikkate alınmayacaktır.", en: "150 push-ups, 50 pull-ups, a half-mile carry with 45 lb, 100 squats. Your muscles' complaints will not be reviewed." }
    tur: "antrenman"
    adim: 4
    xp: 35
  ceviklik_kosusu:
    baslik: { tr: "Çeviklik Parkuru", en: "Agility Course" }
    aciklama: { tr: "200 ip atlama, 50 burpee, 20 tur mekik koşusu, 3 km tempolu koşu. Ayakların seni kurtaracak; tabii önce öldürmezlerse.", en: "200 jump-rope skips, 50 burpees, 20 shuttle runs, a 2-mile tempo run. Your feet will save your life. If they don't kill you first." }
    tur: "antrenman"
    adim: 4
    xp: 30
  dayaniklilik_testi:
    baslik: { tr: "Dayanıklılık Testi", en: "Endurance Test" }
    aciklama: { tr: "15 km koşu, 5 dakika plank, 100 mekik. Durursan sayaç sıfırlanmaz. Sadece seninle dalga geçer.", en: "9-mile run, 5-minute plank, 100 sit-ups. If you stop, the counter doesn't reset. It just mocks you." }
    tur: "antrenman"
    adim: 3
    xp: 40
  zihin_disiplini:
    baslik: { tr: "Zihin Disiplini", en: "Mental Discipline" }
    aciklama: { tr: "30 dakika kıpırdamadan meditasyon, 100 squat, mana akışını üç kez boşaltıp doldur. Düşüncelerin gürültülü. Sustur onları.", en: "30 minutes of meditation without moving, 100 squats, drain and refill your mana three times. Your thoughts are loud. Shut them up." }
    tur: "antrenman"
    adim: 3
    xp: 30
  soguk_su:
    baslik: { tr: "Soğuk Su", en: "Cold Plunge" }
    aciklama: { tr: "4°C suda 5 dakika, ardından 100 şınav ve 5 km koşu. Titremek serbest. Pes etmek değil.", en: "5 minutes in 40°F water, then 100 push-ups and a 3-mile run. Shivering is allowed. Quitting is not." }
    tur: "antrenman"
    adim: 3
    xp: 35
  tam_program:
    baslik: { tr: "Tam Program", en: "The Full Program" }
    aciklama: { tr: "100 şınav, 100 mekik, 100 squat, 50 burpee, 10 km koşu. Sistem bugün cömert hissetmiyor.", en: "100 push-ups, 100 sit-ups, 100 squats, 50 burpees, 6-mile run. The System isn't feeling generous today." }
    tur: "antrenman"
    adim: 5
    xp: 45
  cevre_kesfi:
    baslik: { tr: "Çevre Keşfi", en: "Perimeter Sweep" }
    aciklama: { tr: "Sığınağın çevresinde üç bölgeyi tara, bir tehlikeyi işaretle, sağ dön. Son madde isteğe bağlı değil.", en: "Sweep three zones around your shelter, mark one hazard, come back alive. That last part is not optional." }
    tur: "kesif"
    adim: 3
    xp: 30
    kosul: { bayrak: "gunluk_genis_gorevler" }
  toplayici:
    baslik: { tr: "Toplayıcı", en: "Forager" }
    aciklama: { tr: "5 şifalı ot, 3 temiz su kaynağı ve 1 kullanılabilir alet bul. Dünya bir mağaza değil, ama raflar hâlâ dolu.", en: "Find 5 medicinal herbs, 3 clean water sources and 1 usable tool. The world isn't a store anymore, but the shelves aren't empty." }
    tur: "kesif"
    adim: 3
    xp: 25
    kosul: { bayrak: "gunluk_genis_gorevler" }
  avlanma_kotasi:
    baslik: { tr: "Av Kotası", en: "Kill Quota" }
    aciklama: { tr: "Seviyene yakın 10 canavar indir. Kaçmak, kotaya dahil değildir.", en: "Take down 10 monsters near your level. Running away does not count toward the quota." }
    tur: "savas"
    adim: 4
    xp: 40
    kosul: { bayrak: "gunluk_genis_gorevler" }
  teke_tek:
    baslik: { tr: "Teke Tek", en: "One on One" }
    aciklama: { tr: "Senden güçlü bir düşmanla yardım almadan savaş ve kazan. Sistem seni izliyor. Utandırma.", en: "Fight an enemy stronger than you, alone, and win. The System is watching. Don't embarrass it." }
    tur: "savas"
    adim: 3
    xp: 50
    kosul: { bayrak: "gunluk_genis_gorevler" }
  kapi_temizligi:
    baslik: { tr: "Kapı Temizliği", en: "Gate Sweep" }
    aciklama: { tr: "3 kapıya gir, 3 kapıyı kapat. Kapılar kendi kendine kapanmaz. Bunu da sen yapacaksın.", en: "Enter 3 Gates, close 3 Gates. They don't close themselves. That's your job, too." }
    tur: "kapi"
    adim: 3
    xp: 60
    kosul: { bayrak: "gunluk_genis_gorevler" }
  kapi_kesfi:
    baslik: { tr: "Kapı Keşfi", en: "Gate Recon" }
    aciklama: { tr: "Bir kapının içini haritala, bossunu analiz et, ikisini de kayda geçir. Savaşmak zorunda değilsin. Ölmek de.", en: "Map the inside of a Gate, analyze its boss, log both. You don't have to fight. You don't have to die either." }
    tur: "kapi"
    adim: 4
    xp: 45
    kosul: { bayrak: "gunluk_genis_gorevler" }
