gunluk:
  temel_kondisyon:
    baslik: { tr: "Temel Kondisyon", en: "Basic Conditioning" }
    aciklama: { tr: "Kampın su bidonlarını dereden doldurup taşı: on iki sefer, hiç dökmeden, gün bitmeden. Bahane kabul edilmez; bahaneler kaydedilir.", en: "Fill the camp's water jugs at the creek and haul them back: twelve trips, not a drop spilled. Before the day ends. Excuses are not accepted; excuses are logged." }
    tur: "antrenman"
    adim: 4
    xp: 30
  sabah_kosusu:
    baslik: { tr: "Şafak Koşusu", en: "Dawn Run" }
    aciklama: { tr: "Güneş doğmadan sisin kıyısına kadar koşup dön; ardından kampın çevresine çit kazıklarını tek başına çak. Uyumak da bir seçenekti, sen yanlışını seçtin.", en: "Run to the edge of the fog and back before sunrise, then drive every fence stake around camp yourself. Sleeping in was an option. You picked the wrong one." }
    tur: "antrenman"
    adim: 3
    xp: 25
  guc_seti:
    baslik: { tr: "Güç Seti", en: "Strength Set" }
    aciklama: { tr: "Devrilmiş bir ağacı kütüklere ayırıp kamp ateşine taşı; sonra en ağırını ateş sönene dek başının üstünde tut. Kaslarının şikâyeti dikkate alınmayacaktır.", en: "Split a fallen tree into logs and haul them to the fire, then hold the heaviest one over your head until the fire burns down. Your muscles' complaints will not be reviewed." }
    tur: "antrenman"
    adim: 4
    xp: 35
  ceviklik_kosusu:
    baslik: { tr: "Çeviklik Parkuru", en: "Agility Course" }
    aciklama: { tr: "Ormanda kırık köklerin arasına çizilmiş parkuru bir kez bile tökezlemeden üç kez geç. Ayakların seni kurtaracak; tabii önce öldürmezlerse.", en: "Run the course marked through the broken roots three times without stumbling once. Your feet will save your life. If they don't kill you first." }
    tur: "antrenman"
    adim: 4
    xp: 30
  dayaniklilik_testi:
    baslik: { tr: "Dayanıklılık Testi", en: "Endurance Test" }
    aciklama: { tr: "Sırtında başkasının yüküyle üç bölgenin sınırını dolaş. Durursan sayaç sıfırlanmaz; yalnızca seninle dalga geçer.", en: "Walk the border of all three zones carrying someone else's pack. If you stop, the counter doesn't reset. It just mocks you." }
    tur: "antrenman"
    adim: 3
    xp: 40
  zihin_disiplini:
    baslik: { tr: "Zihin Disiplini", en: "Mental Discipline" }
    aciklama: { tr: "Sisin içinde gözlerin kapalı otur, çevrendeki her sesi say; manayı üç kez boşaltıp yeniden doldur. Düşüncelerin gürültülü, sustur onları.", en: "Sit in the fog with your eyes closed and count every sound around you, then drain your mana and refill it three times. Your thoughts are loud. Shut them up." }
    tur: "antrenman"
    adim: 3
    xp: 30
  soguk_su:
    baslik: { tr: "Soğuk Su", en: "Cold Plunge" }
    aciklama: { tr: "İstasyonun su basmış tüneline girip en dipteki tabelaya dokun ve çık. Su 4°C. Titremek serbest, pes etmek değil.", en: "Wade into the station's flooded tunnel, touch the last sign at the bottom, and come back out. The water's 40°F. Shivering is allowed. Quitting is not." }
    tur: "antrenman"
    adim: 3
    xp: 35
  tam_program:
    baslik: { tr: "Tam Program", en: "The Full Program" }
    aciklama: { tr: "Bugün hepsi birden: su, odun, parkur, sınır yürüyüşü ve buz gibi tünel; sırayla, ara vermeden. Sistem bugün kendini cömert hissetmiyor.", en: "All of it today: water, wood, the course, the border walk, and the ice-cold tunnel. In order, no breaks. The System isn't feeling generous today." }
    tur: "antrenman"
    adim: 5
    xp: 45
  cevre_kesfi:
    baslik: { tr: "Çevre Keşfi", en: "Perimeter Sweep" }
    aciklama: { tr: "Sığınağın çevresinde üç bölgeyi tara, bir tehlikeyi işaretle, sağ dön. Son madde isteğe bağlı değil.", en: "Sweep three zones around your shelter, mark one hazard, come back alive. That last part is not optional." }
    tur: "kesif"
    adim: 3
    xp: 30
    kosul: { bayrak: "gunluk_genis_gorevler" }
  toplayici:
    baslik: { tr: "Toplayıcı", en: "Forager" }
    aciklama: { tr: "5 şifalı ot, 3 temiz su kaynağı ve 1 kullanılabilir alet bul. Dünya bir mağaza değil ama rafları hâlâ dolu.", en: "Find 5 medicinal herbs, 3 clean water sources and 1 usable tool. The world isn't a store anymore, but the shelves aren't empty." }
    tur: "kesif"
    adim: 3
    xp: 25
    kosul: { bayrak: "gunluk_genis_gorevler" }
  avlanma_kotasi:
    baslik: { tr: "Av Kotası", en: "Kill Quota" }
    aciklama: { tr: "Seviyene yakın 10 canavar indir. Kaçmak kotaya dahil değildir.", en: "Take down 10 monsters near your level. Running away does not count toward the quota." }
    tur: "savas"
    adim: 4
    xp: 40
    kosul: { bayrak: "gunluk_genis_gorevler" }
  teke_tek:
    baslik: { tr: "Teke Tek", en: "One on One" }
    aciklama: { tr: "Senden güçlü bir düşmanla yardım almadan savaş ve kazan. Sistem seni izliyor. Utandırma.", en: "Fight an enemy stronger than you, alone, and win. The System is watching. Don't embarrass it." }
    tur: "savas"
    adim: 3
    xp: 50
    kosul: { bayrak: "gunluk_genis_gorevler" }
  kapi_temizligi:
    baslik: { tr: "Kapı Temizliği", en: "Gate Sweep" }
    aciklama: { tr: "3 kapıya gir, 3 kapıyı kapat. Kapılar kendi kendine kapanmaz; bunu da sen yapacaksın.", en: "Enter 3 Gates, close 3 Gates. They don't close themselves. That's your job, too." }
    tur: "kapi"
    adim: 3
    xp: 60
    kosul: { bayrak: "gunluk_genis_gorevler" }
  kapi_kesfi:
    baslik: { tr: "Kapı Keşfi", en: "Gate Recon" }
    aciklama: { tr: "Bir kapının içini haritala, bossunu analiz et, ikisini de kayda geçir. Savaşmak zorunda değilsin. Ölmek de.", en: "Map the inside of a Gate, analyze its boss, log both. You don't have to fight. You don't have to die either." }
    tur: "kapi"
    adim: 4
    xp: 45
    kosul: { bayrak: "gunluk_genis_gorevler" }
