meslekler:
  simyaci:
    ad: { tr: "Simyacı", en: "Alchemist" }
    aciklama: { tr: "Otları, canavar parçalarını ve manayı şişeye hapseder. Patlamaların çoğu kazadır.", en: "Bottles herbs, monster parts and mana. Most of the explosions are accidents." }
  demirci:
    ad: { tr: "Demirci", en: "Blacksmith" }
    aciklama: { tr: "Hurdayı ve canavar kemiğini silaha, zırha ve tamire dönüştürür.", en: "Turns scrap metal and monster bone into weapons, armor and repairs." }
  run_ustasi:
    ad: { tr: "Rün Ustası", en: "Runesmith" }
    aciklama: { tr: "Eşyalara Sistem'in kendi dilinde küçük talimatlar kazır. Yazım hatası affedilmez.", en: "Carves tiny instructions into gear in the System's own language. Typos are not forgiven." }
  asci:
    ad: { tr: "Aşçı", en: "Cook" }
    aciklama: { tr: "Canavar etini yenebilir, hatta lezzetli hâle getirir. Moral de bir kaynaktır.", en: "Makes monster meat edible, even tasty. Morale is a resource, too." }
  kartograf:
    ad: { tr: "Kartograf", en: "Cartographer" }
    aciklama: { tr: "Değişen dünyanın haritasını çıkarır. Kapıların, tuzakların ve kestirmelerin yerini bilir.", en: "Maps a world that keeps changing. Knows where the Gates, traps and shortcuts are." }
