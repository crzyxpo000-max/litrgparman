# Bölüm yapısı (docs/CHAPTERS.md, DECISIONS #130).
# Her bölüm: Brifing (üs) → Hazırlık (serbest günler) → Ana operasyon (kilitli görev) → Sonrası (üs) → Darboğaz.
# acilis: bölümün açıldığı gün · son_tarih: operasyonun en geç başladığı gün (geçerse taşma) · bitis: bölüm sonu.
# brifing / darbogaz: ilk uygun olay. operasyon: sırayla açılan olaylar; nesne listesi = oyuncunun seçtiği seçenekler.
# erken: false = tarihli operasyon (dünya olayı); son tarih günü kendiliğinden başlar, oyuncu erken giremez.
# darbogaz_gun: darboğaz en erken bu gün gelir. tasma: son tarih kaçınca bildirimin satırı. Motorun her taşmada uyguladığı: bayrak bolum_<n>_tasti,
# hayatta_kalan −3, operasyon bölgesinin tehlikesi +15; tasma_etkiler bunlara eklenir.

uslar:
  1: "ogretici_orman"
  2: "kiyikent_liman"

bolumler:
  # ---- Perde 1 · Öğretici Katman ----
  - no: 1
    perde: 1
    acilis: 0
    son_tarih: 12
    bitis: 12
    baslik: { tr: "Sis Ağları", en: "The Fog Webs" }
    hedef: { tr: "Öğretici Katman'da ayakta kal. Ormanın derinindeki ağlar her gün büyüyor.", en: "Stay alive in the Tutorial Layer. The webs deep in the forest grow every day." }
    tehdit: { tr: "Kapalı bir orman, kıt kaynak, sisin içinde at büyüklüğünde bir şey.", en: "A sealed forest, scarce supplies, and something the size of a horse in the fog." }
    brifing: ["brifing_1"]
    operasyon: ["kirilma"]
    darbogaz: ["darbogaz_1"]
    tasma: { tr: "Sis ağları kampın kıyısına kadar indi. Bu sabah iki çadır boş.", en: "The fog webs crept down to the edge of camp. Two tents are empty this morning." }

  - no: 2
    perde: 1
    acilis: 13
    son_tarih: 24
    bitis: 24
    baslik: { tr: "Kemik Taç", en: "The Bone Crown" }
    hedef: { tr: "Kampı ayakta tut. Mantar açıklığından gelen izler bir şeyin yaklaştığını söylüyor.", en: "Keep the camp standing. The tracks coming out of the mushroom clearing say something's on its way." }
    tehdit: { tr: "Öğretici'de bir üst kademeden bir şey dolaşıyor.", en: "Something from a higher Grade is loose in the Tutorial." }
    brifing: ["brifing_2"]
    operasyon: ["deniz_son_secim", "yeni_tavan"]
    darbogaz: ["darbogaz_2"]
    tasma: { tr: "Boynuzlu gölge mantar açıklığından çıkıp kamp yoluna kadar indi; yolda kalanların hepsi geri dönmedi.", en: "The horned shadow left the mushroom clearing and came down the camp trail. Not everyone on it came back." }

  - no: 3
    perde: 1
    acilis: 25
    son_tarih: 28
    bitis: 30
    baslik: { tr: "Bekçi", en: "The Warden" }
    hedef: { tr: "Çıkış Kapısı'na in. Öğretici, Bekçi'yi geçemeyenleri bırakmıyor.", en: "Go down to the Exit Gate. The Tutorial doesn't let go of anyone who can't get past the Warden." }
    tehdit: { tr: "Öğretici Bekçisi: ölenlerin pencerelerinden örülmüş bir dev.", en: "The Tutorial Warden: a giant stitched together out of dead people's windows." }
    brifing: ["brifing_3"]
    operasyon: ["ogretici_bekci"]
    darbogaz: []
    tasma: { tr: "Kapı halkası daralıyor. Vadiye inen geçitte bekleyemeyenlerin izleri var.", en: "The Gate's ring is shrinking. In the pass down to the valley, you find the tracks of people who couldn't wait." }

  # ---- Perde 2 · Entegre Dünya ----
  - no: 4
    perde: 2
    erken: false
    geri_sayim: { tr: "Kule'nin yükselişine {n} gün", en: "{n} days until the Spire rises" }
    hazirlik:
      - id: "kule_iskele"
        ad: { tr: "İskele kur", en: "Put up scaffolding" }
        aciklama: { tr: "Meydanın çevresindeki cephelere iskele çak; düşen bir cephe tutulabilsin.", en: "Brace the building fronts around the square with scaffolding so a falling wall can be held." }
        sonuc: { tr: "İskeleler gece yarısına kadar çakıldı. Düşen bir cepheyi tutmak artık kas işi değil, zamanlama işi.", en: "The scaffolding goes up by midnight. Holding a falling wall is a matter of timing now, not muscle." }
        bedel: 1
      - id: "kule_tahliye"
        ad: { tr: "Meydanı boşalt", en: "Clear the square" }
        aciklama: { tr: "Dairenin çevresindeki apartmanları kapı kapı dolaş; insanları uzaklaştır.", en: "Go door to door through the buildings around the circle and get people out." }
        sonuc: { tr: "Yarım gün kapı çaldın. Çoğu gitti; kalanlar en azından balkonlarda oturmuyor.", en: "You spent half a day knocking on doors. Most of them left. The rest at least aren't sitting out on their balconies." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 3 }
    acilis: 31
    son_tarih: 40
    bitis: 45
    baslik: { tr: "Dönüş", en: "Homecoming" }
    hedef: { tr: "{yer:kiyikent|e} alış. Eski meydanın altındaki daire açılmak üzere.", en: "Get your bearings in {yer:kiyikent}. The circle under the old square is about to open." }
    tehdit: { tr: "Dört kamp, bölünmüş bir şehir, yerin altından yükselen bir Kule.", en: "Four camps, a split city, and a Spire pushing up out of the ground." }
    brifing: ["perde2_donus", "brifing_4"]
    operasyon: ["kule_yukselisi"]
    darbogaz: ["fraksiyon_secimi"]
    darbogaz_gun: 45
    tasma: { tr: "Kule senden önce yükseldi. Meydanın çevresindeki enkazdan çıkarılanların listesi uzun.", en: "The Spire came up without you. The list of people pulled out of the rubble around the square is long." }

  - no: 5
    perde: 2
    erken: false
    geri_sayim: { tr: "Çekirdeğin uyanışına {n} gün", en: "{n} days until the Core wakes" }
    hazirlik:
      - id: "cekirdek_kule"
        ad: { tr: "Saat kulesinin temelini oy", en: "Undercut the clock tower" }
        aciklama: { tr: "Saat kulesinin temel taşlarını gevşet; gerekirse muhafızın üstüne devrilsin.", en: "Loosen the clock tower's foundation stones so it can come down on the guardian if it has to." }
        sonuc: { tr: "Temel taşlarının üçünü yerinden oynattın. Kule hâlâ dimdik, ama artık bir itişe bakıyor.", en: "You worked three of the foundation stones loose. The tower's still standing tall, but it's one shove from coming down." }
        bedel: 2
      - id: "cekirdek_sivil"
        ad: { tr: "Meydanın çevresini boşalt", en: "Clear the streets around the square" }
        aciklama: { tr: "Meydana açılan sokaklardaki aileleri yokuş aşağı taşı.", en: "Move the families on the streets around the square down the hill." }
        sonuc: { tr: "Sokaklar boşaldı. Meydanda olacaklara artık yalnız gözcüler tanık olacak.", en: "The streets are empty. Whatever happens in the square, only the lookouts will be there to see it." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 3 }
    acilis: 46
    son_tarih: 60
    bitis: 66
    baslik: { tr: "Kasaba Çekirdeği", en: "The Town Core" }
    hedef: { tr: "{yer:eski_sehir|in} kalbi uyanıyor. Dört kamp da onu istiyor; senden önce davranacaklar.", en: "The heart of {yer:eski_sehir} is waking up. All four camps want it, and they won't wait for you." }
    tehdit: { tr: "Meydanın altındaki kristal ve onu koruyan muhafız.", en: "The crystal under the square and the guardian standing over it." }
    brifing: ["brifing_5"]
    operasyon: ["kasaba_cekirdegi"]
    darbogaz: ["darbogaz_5"]
    tasma: { tr: "Muhafız uyandı ve meydana ilk kim adım attıysa onu ezdi. Kamplar ölülerini birbirinin hanesine yazıyor.", en: "The guardian woke up and crushed whoever stepped into the square first. The camps are blaming each other for the dead." }

  - no: 6
    perde: 2
    erken: false
    geri_sayim: { tr: "Kordon kapısının taşmasına {n} gün", en: "{n} days until the Esplanade Gate spills" }
    hazirlik:
      - id: "tasma_plan"
        ad: { tr: "Kamp komutanlarıyla plan yap", en: "Plan it with the camp commanders" }
        aciklama: { tr: "Dört kampın komutanlarını aynı haritanın başına topla; kim nereyi tutacak, bugünden belli olsun.", en: "Get the four camps' commanders around one map and settle who holds what, starting now." }
        sonuc: { tr: "Harita masada, her kampın rengiyle işaretli. Kimse sevmedi ama herkes imzaladı.", en: "The map's on the table, marked in every camp's color. Nobody likes it, but everybody signed." }
        bedel: 2
      - id: "tasma_balkon"
        ad: { tr: "Balkonları önceden boşalt", en: "Clear the balconies ahead of time" }
        aciklama: { tr: "{yer:kordon|de}ki apartmanları dolaş; seyirciyi deniz çekilmeden önce içeri al.", en: "Go through the buildings on {yer:kordon} and get the spectators inside before the sea pulls back." }
        sonuc: { tr: "Balkonların yarısı boş. Kalanlar seni gördü ve en azından ayakkabılarını giydi.", en: "Half the balconies are empty. The rest saw you coming and at least put their shoes on." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 4 }
    acilis: 67
    son_tarih: 80
    bitis: 95
    baslik: { tr: "İlk Taşma", en: "The First Overflow" }
    hedef: { tr: "{yer:kordon|de}ki kapının sayacı sıfıra iniyor. Taştığı gün orada ol; o güne kadar şehri hazırla.", en: "{yer:kordon|b} Gate's counter is running down to zero. Be there the day it spills, and get the city ready until then." }
    tehdit: { tr: "{yer:kordon|de} kimsenin kapatamadığı bir kapı.", en: "A Gate on {yer:kordon} nobody's been able to close." }
    brifing: ["brifing_6"]
    operasyon: ["ilk_tasma"]
    darbogaz: ["deniz_kardes_bulundu", "deniz_anma_kardes"]
    darbogaz_gun: 95
    tasma: { tr: "Su kapıya doğru çekildi ve sen yoktun. {yer:kordon|in} balkonlarında oturanların çoğu geri dönmedi.", en: "The sea pulled back toward the Gate and you weren't there. Most of the people on the balconies along {yer:kordon} never came back." }

  - no: 7
    perde: 2
    acilis: 96
    son_tarih: 105
    bitis: 122
    baslik: { tr: "Küçük Harfler", en: "In Lowercase" }
    hedef: { tr: "{yer:kasaba_cekirdegi|in} bülteninde bir şey kıpırdıyor. Şehir fark etmeden önce sen fark et.", en: "Something's stirring in {yer:kasaba_cekirdegi|pos} bulletin. Notice it before the city does." }
    tehdit: { tr: "İçindeki şey şehrin pencerelerinden konuşmaya hazırlanıyor.", en: "The thing inside you is getting ready to talk through the city's windows." }
    brifing: ["brifing_7"]
    operasyon: ["yanki_ortaya_cikis"]
    darbogaz: ["darbogaz_7"]
    tasma: { tr: "Bülten sen gelmeden okundu. Şehrin yarısı artık 'birinin içinde' cümlesini ezbere biliyor.", en: "The bulletin got read before you showed up. Half the city knows 'inside someone' by heart now." }

  - no: 8
    perde: 2
    acilis: 123
    son_tarih: 135
    bitis: 150
    baslik: { tr: "Çekirdek'in Altı", en: "Beneath the Core" }
    hedef: { tr: "Çekirdek'in altında bir merdiven var ve yalnız sana açılıyor. Kapanmadan in.", en: "There's a staircase under the Core, and it only opens for you. Go down before it closes." }
    tehdit: { tr: "Sistem'in ne olduğuna dair ilk gerçek.", en: "The first real truth about what the System is." }
    brifing: ["brifing_8"]
    operasyon: ["sistem_gercegi"]
    darbogaz: ["darbogaz_8"]
    tasma: { tr: "Merdiven bir gece seni bekledi, sonra kendini kapattı. Ertesi sabah yeniden açıldığında basamaklar daha dardı.", en: "The staircase waited one night for you, then sealed itself. When it opened again the next morning, the steps were narrower." }

  - no: 9
    perde: 2
    erken: false
    geri_sayim: { tr: "Gemi inişine {n} gün", en: "{n} days until the ship arrives" }
    hazirlik:
      - id: "gemi_siginak"
        ad: { tr: "Sığınakları stokla", en: "Stock the shelters" }
        aciklama: { tr: "{yer:kiyikent_liman|in} altındaki ambarlara su ve erzak taşı; panik olursa insanlar bir yere sığabilsin.", en: "Haul water and supplies into the storerooms under the harbor so people have somewhere to go if it turns to panic." }
        sonuc: { tr: "Ambarlar dolu. Kapılarına tebeşirle kaç kişi alacakları yazılı.", en: "The storerooms are full. Chalked on each door is how many people it can hold." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 3 }
      - id: "gemi_gozcu"
        ad: { tr: "Kule'de gözcü yeri hazırla", en: "Set up a lookout in the Spire" }
        aciklama: { tr: "Kule'nin yüksek bir katında körfezi gören bir yer ayarla; gelen şeye ilk sen bak.", en: "Set up a spot high in the Spire with a view of the bay so you're the first to see whatever comes." }
        sonuc: { tr: "Kırkıncı katın penceresinden körfez avucunun içi gibi görünüyor. Dürbün yerinde.", en: "From the fortieth-floor window the bay looks small enough to hold. The binoculars are set." }
        bedel: 1
        operasyonda:
          - gizle: 5
    acilis: 151
    son_tarih: 178
    bitis: 180
    baslik: { tr: "Körfezin Üstündeki Gölge", en: "The Shadow Over the Bay" }
    hedef: { tr: "Perde 2'nin son günleri. Gökyüzünde bir şey yaklaşıyor; şehri hazırla.", en: "The last days of Act 2. Something's closing in from the sky. Get the city ready." }
    tehdit: { tr: "Bulutların üstünde bekleyen, gemi denemeyecek kadar büyük bir şey.", en: "Something waiting above the clouds, too big to call a ship." }
    brifing: ["brifing_9"]
    operasyon: ["perde2_son"]
    darbogaz: []
    tasma: { tr: "Gölge körfeze sen hazır olmadan düştü. {yer:kiyikent_liman} o öğleden sonra kendi başının çaresine baktı.", en: "The shadow fell over the bay before you were ready. The harbor was on its own that afternoon." }

  # ---- Perde 3 · Çok-evren ----
  - no: 10
    perde: 3
    erken: false
    geri_sayim: { tr: "Geçidin açılmasına {n} gün", en: "{n} days until the passage opens" }
    hazirlik:
      - id: "gecit_cephe"
        ad: { tr: "Dış cephede tırmanış yolu işaretle", en: "Mark a climbing route up the outside" }
        aciklama: { tr: "Kule'nin dış cephesinde ellinci kata çıkan bir yol bul, tutunma yerlerini işaretle.", en: "Find a way up the outside of the Spire to the fiftieth floor and mark the handholds." }
        sonuc: { tr: "Kırk dokuz kat boyunca tebeşir işaretleri. Yolun nerede biteceğini artık biliyorsun.", en: "Forty-nine floors of chalk marks. Now you know exactly where the route ends." }
        bedel: 2
      - id: "gecit_avci"
        ad: { tr: "Avcıları önceden topla", en: "Round up hunters early" }
        aciklama: { tr: "Geçit açıldığında yanında olacak bir avcı ekibi kur.", en: "Put together a crew of hunters who'll be with you when the passage opens." }
        sonuc: { tr: "On iki avcı adını yazdırdı. Hepsi aynı soruyu sordu: öbür tarafta para var mı?", en: "Twelve hunters signed up. Every one of them asked the same thing: is there money on the other side?" }
        bedel: 1
        operasyonda:
          - ordu_kazan: 5
          - itibar: { lonca: 2 }
    acilis: 181
    son_tarih: 200
    bitis: 205
    baslik: { tr: "Elli Katın Ardı", en: "Past the Fiftieth Floor" }
    hedef: { tr: "Elçi indi. Kule'nin ellinci katında bir geçit açılmak üzere; ilk geçen sen ol.", en: "The Envoy has landed. A passage is about to open on the Spire's fiftieth floor. Be the first one through." }
    tehdit: { tr: "{npc:thessar|in} teklifleri ve Kule'de açılan çok-evren geçidi.", en: "{npc:thessar|pos} offers, and a multiverse passage opening in the Spire." }
    brifing: ["thessar_inis", "brifing_10"]
    operasyon: ["cok_evren_kapisi"]
    darbogaz: ["darbogaz_10"]
    tasma: { tr: "Geçit sensiz açıldı. İlk geçenlerin adları Küresel Sıralama'nın tepesinde, çoğunun yanında artık bir çarpı var.", en: "The passage opened without you. The first names through are at the top of the Global Ranking, and most of them have an X next to them now." }

  - no: 11
    perde: 3
    acilis: 206
    son_tarih: 225
    bitis: 230
    baslik: { tr: "İlk Dünya", en: "The First World" }
    hedef: { tr: "Geçidin ardındaki dünyalardan biri hasat ediliyor. Hangisine gideceğini sen seç.", en: "One of the worlds past the passage is being harvested. You pick which one you go to." }
    tehdit: { tr: "Başka bir türün son günleri: ya {yer:batik_takimada} ya {yer:pirinc_kervan}.", en: "Another species' last days: {yer:batik_takimada} or {yer:pirinc_kervan}." }
    brifing: ["brifing_11"]
    operasyon:
      - ad: { tr: "Batık Takımada", en: "The Drowned Reach" }
        bolge: "batik_takimada"
        olaylar: ["batik_ilk_adim", "batik_son_fener", "batik_tuz_arsivi", "batik_son_basakci"]
      - ad: { tr: "Pirinç Kervan", en: "The Brass Caravan" }
        bolge: "pirinc_kervan"
        olaylar: ["kervan_tarti_carsisi", "kervan_sayman", "kervan_ondalik", "kervan_bos_kefe"]
    darbogaz: ["deniz_canavar_mi_tanri_mi", "deniz_anma_ayna"]
    darbogaz_gun: 225
    tasma: { tr: "Geçidin ardındaki dünyalardan biri sustu. Kimse hangisi olduğunu bilmiyor.", en: "One of the worlds past the passage went quiet. Nobody knows which one." }

  - no: 12
    perde: 3
    acilis: 231
    son_tarih: 260
    bitis: 260
    baslik: { tr: "Yol", en: "The Path" }
    hedef: { tr: "Kavradığın Özler birbirine uzanıyor. Onları tek bir Yol'a bağlamaya hazır ol.", en: "The Essences you've grasped are reaching for each other. Get ready to bind them into a single Path." }
    tehdit: { tr: "İçindeki güç, sen karar vermezsen kendi kararını verecek.", en: "If you don't decide, the power inside you will decide for itself." }
    brifing: ["brifing_12"]
    operasyon: ["yol_olusumu"]
    darbogaz: []
    tasma: { tr: "Özler sen hazır olmadan birbirine kenetlendi. Göğsündeki sızı bir haftadır geçmiyor.", en: "The Essences locked together before you were ready. The ache in your chest hasn't let up all week." }

  - no: 13
    perde: 3
    erken: false
    geri_sayim: { tr: "Kapı fırtınasına {n} gün", en: "{n} days until the Gate storm" }
    hazirlik:
      - id: "firtina_ritim"
        ad: { tr: "Kapıların ritmini ölç", en: "Measure the Gates' rhythm" }
        aciklama: { tr: "{fraksiyon:sessiz_ag} ile kapıların atışını dinle; hepsinin merkezini bul.", en: "Listen to the Gates' pulse with the {fraksiyon:sessiz_ag|k} and find the center they all beat around." }
        sonuc: { tr: "Kayıtlar aynı noktayı gösteriyor: {yer:sanayi|de}ki eski döküm fırını. Fırtına koptuğunda nereye koşacağını biliyorsun.", en: "The recordings all point to the same spot: the old foundry furnace in {yer:sanayi}. When the storm hits, you'll know where to run." }
        bedel: 2
      - id: "firtina_nobet"
        ad: { tr: "Mahallelere nöbetçi yerleştir", en: "Post lookouts in the neighborhoods" }
        aciklama: { tr: "Kapıların sıklaştığı yedi mahalleye birer nöbetçi koy; ilk açılan kapı hemen duyulsun.", en: "Put a lookout in each of the seven neighborhoods where the Gates keep coming, so the first one to open gets heard." }
        sonuc: { tr: "Yedi telsiz, yedi nöbetçi. Hepsi aynı frekansta, hepsi uykusuz.", en: "Seven radios, seven lookouts. All on the same frequency, all running on no sleep." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 4 }
    acilis: 261
    son_tarih: 292
    bitis: 292
    baslik: { tr: "Kapı Fırtınası", en: "The Gate Storm" }
    hedef: { tr: "Şehirde kapılar sıklaşıyor. Fırtına geldiğinde her mahalleye yetişemeyeceksin.", en: "Gates are coming faster across the city. When the storm hits, you won't reach every neighborhood." }
    tehdit: { tr: "Aynı gece yedi kapı.", en: "Seven Gates in one night." }
    brifing: ["brifing_13"]
    # Fırtına bütün şehre aynı anda düşer: operasyon üsten (Liman) başlar, olay mahalleleri kendisi gezer.
    operasyon:
      - ad: { tr: "Kapı Fırtınası", en: "The Gate Storm" }
        bolge: "kiyikent_liman"
        olaylar: ["p3_kapi_firtinasi"]
    darbogaz: ["darbogaz_13"]
    tasma: { tr: "Fırtına sen yokken koptu. Sabah üç mahallenin adı haritadan silinmişti.", en: "The storm broke while you were gone. By morning, three neighborhoods were off the map." }

  - no: 14
    perde: 3
    acilis: 293
    son_tarih: 300
    bitis: 305
    baslik: { tr: "Ortak Masa", en: "The Common Table" }
    hedef: { tr: "Dört kamp ilk kez aynı masada oturacak. Masada biri seni satmaya hazırlanıyor.", en: "For the first time, all four camps are sitting at one table. Someone at that table is getting ready to sell you out." }
    tehdit: { tr: "İçeriden gelen bir ihanet.", en: "A betrayal from the inside." }
    brifing: ["brifing_14"]
    operasyon: ["buyuk_ihanet"]
    darbogaz: []
    tasma: { tr: "Masa sensiz kuruldu ve sensiz dağıldı. Kimin kimi sattığını sonradan, başkalarından duyuyorsun.", en: "The table got set without you and broke up without you. You hear secondhand who sold out who." }

  - no: 15
    perde: 3
    erken: false
    geri_sayim: { tr: "Filonun görünmesine {n} gün", en: "{n} days until the fleet comes into view" }
    hazirlik:
      - id: "filo_sancak"
        ad: { tr: "Bayrağının altına adam topla", en: "Rally people to your banner" }
        aciklama: { tr: "Şehirde dolaş; filo geldiğinde yanında durmak isteyenleri kaydet.", en: "Walk the city and sign up anyone who wants to be standing with you when the fleet comes." }
        sonuc: { tr: "Liste uzadı. İçinde çocuk sesiyle verilmiş birkaç ad da var; onları sildin.", en: "The list got long. A few of the names were given in a kid's voice. You crossed those out." }
        bedel: 1
        operasyonda:
          - ordu_kazan: 10
      - id: "filo_stok"
        ad: { tr: "Kıtlığa hazırlan", en: "Get ready for the shortages" }
        aciklama: { tr: "Ekmek, su ve ilacı mahallelere dağıt; filodan sonrası uzun sürebilir.", en: "Spread bread, water and medicine across the neighborhoods. What comes after the fleet could last a while." }
        sonuc: { tr: "Her mahallenin bir deposu var artık. Anahtarlar güvendiğin ellerde.", en: "Every neighborhood has a stockpile now. The keys are in hands you trust." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 3 }
    acilis: 306
    son_tarih: 320
    bitis: 330
    baslik: { tr: "Filo", en: "The Fleet" }
    hedef: { tr: "Elçi hiçbir zaman ordu değildi. Ordu yolda; şehrin son hazırlığını yap.", en: "The Envoy was never the army. The army's on its way. Get the city through its last preparations." }
    tehdit: { tr: "Ayın yanında beliren sayısız ışık.", en: "Countless lights appearing next to the moon." }
    brifing: ["brifing_15"]
    operasyon: ["perde3_son"]
    darbogaz: []
    tasma: { tr: "Filonun ilk ışığını şehir sensiz gördü. O gece paniği durduracak kimse yoktu.", en: "The city saw the fleet's first light without you. There was nobody to stop the panic that night." }

  # ---- Perde 4 · Hasat ----
  - no: 16
    perde: 4
    erken: false
    geri_sayim: { tr: "İstilaya {n} gün", en: "{n} days until the invasion" }
    hazirlik:
      - id: "istila_ordu"
        ad: { tr: "Kıyı boyunca birlik topla", en: "Raise units along the shore" }
        aciklama: { tr: "Kampların avcılarını kıyı hattına göre birliklere ayır.", en: "Sort the camps' hunters into units along the shoreline." }
        sonuc: { tr: "Kıyı boyunca sancaklar dikili. Her birinin altında yorgun ama ayakta birileri var.", en: "There are banners all along the shore. Under each one, somebody tired but still on their feet." }
        bedel: 2
        operasyonda:
          - ordu_kazan: 20
      - id: "istila_silah"
        ad: { tr: "Ağır silahları Kule'ye taşı", en: "Haul the heavy guns up the Spire" }
        aciklama: { tr: "Lonca'nın ağır silahlarını Kule'nin yüksek katlarına çıkar; ilk gemiyi gökyüzünde karşıla.", en: "Get the Guild's heavy guns up to the Spire's high floors so you can meet the first ship in the sky." }
        sonuc: { tr: "Altmışıncı katta üç ağır top, namluları körfeze dönük. Mermileri saymak bir saat sürdü.", en: "Three heavy guns on the sixtieth floor, barrels turned toward the bay. Counting the shells took an hour." }
        bedel: 2
      - id: "istila_tahkimat"
        ad: { tr: "{yer:kiyikent_liman|i} tahkim et", en: "Fortify {yer:kiyikent_liman}" }
        aciklama: { tr: "Rıhtıma barikat kur, sığınakların kapılarını güçlendir.", en: "Barricade the docks and reinforce the shelter doors." }
        sonuc: { tr: "Konteynerler rıhtım boyunca dizildi; aralarından yalnız bir insan geçer. Gemiler bunu umursamayacak, ama insanlar umursuyor.", en: "Shipping containers line the docks, with only one person's width between them. The ships won't care. The people do." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 4 }
    acilis: 331
    son_tarih: 342
    bitis: 342
    baslik: { tr: "Hasat Başlıyor", en: "The Harvest Begins" }
    hedef: { tr: "Paneller sarardı ve gemiler iniyor. İstila geldiğinde şehrin yanında ol.", en: "The panels have gone yellow and the ships are coming down. Be at the city's side when the invasion hits." }
    tehdit: { tr: "Kadim istilası.", en: "The Ancients' invasion." }
    brifing: ["perde4_acilis", "brifing_16"]
    operasyon: ["kadim_istilasi"]
    darbogaz: ["darbogaz_16"]
    tasma: { tr: "Işık sütunları sen gelmeden indi. İlk saatte yukarı süzülenleri kimse durdurmadı.", en: "The pillars of light came down before you got there. In the first hour, nobody stopped the people floating up." }

  - no: 17
    perde: 4
    erken: false
    geri_sayim: { tr: "Merdivenin açılmasına {n} gün", en: "{n} days until the stairs open" }
    hazirlik:
      - id: "merdiven_kilit"
        ad: { tr: "Merdivenin kilidini incele", en: "Study the stairway lock" }
        aciklama: { tr: "{yer:kule_dibi|in} çöken taşlarının arasından sızan ışığın düzenini oku; kilidin nerede olduğunu bul.", en: "Read the pattern of the light leaking up through the sunken stones of {yer:kule_dibi} and find where the lock is." }
        sonuc: { tr: "Işık her yedi saniyede bir aynı yerde kırılıyor. Kilit orada; iradeyle değil, sırayla açılıyor.", en: "Every seven seconds the light breaks in the same spot. That's the lock. It doesn't open to willpower. It opens in sequence." }
        bedel: 2
      - id: "merdiven_erzak"
        ad: { tr: "Uzun bir iniş için hazırlan", en: "Get ready for a long way down" }
        aciklama: { tr: "Işık, su, sargı bezi; aşağıda ne kadar kalacağını bilen yok.", en: "Light, water, bandages. Nobody knows how long you'll be down there." }
        sonuc: { tr: "Çantan ağır, ama içindekilerin hiçbiri fazla değil.", en: "Your pack is heavy, but nothing in it is extra." }
        bedel: 1
        operasyonda:
          - can: 99999
          - mana: 99999
    acilis: 343
    son_tarih: 350
    bitis: 352
    baslik: { tr: "Kule'nin Altında", en: "Under the Spire" }
    hedef: { tr: "{yer:kule_dibi|de} aşağı inen bir merdiven açıldı. {yer:sistem_cekirdegi|e} in.", en: "A staircase going down has opened in {yer:kule_dibi}. Go down to {yer:sistem_cekirdegi}." }
    tehdit: { tr: "Sistem Çekirdeği ve onu koruyan her şey.", en: "The System Core and everything guarding it." }
    brifing: ["brifing_17"]
    operasyon: ["cekirdege_yol"]
    # Yol açıksa darboğaz Sistem Çekirdeği'nin kendisidir; açık değilse kapıda kalanların gecesi.
    darbogaz: ["sistem_cekirdegi", "darbogaz_17"]
    darbogaz_gun: 352
    tasma: { tr: "Merdivenin ağzını başkaları tuttu. İnmek için önce onların arasından geçmen gerekecek.", en: "Somebody else took the mouth of the staircase. To go down, you'll have to get through them first." }

  - no: 18
    perde: 4
    erken: false
    geri_sayim: { tr: "Son karara {n} gün", en: "{n} days until the final decision" }
    hazirlik:
      - id: "son_veda"
        ad: { tr: "Vedalaş", en: "Say your goodbyes" }
        aciklama: { tr: "Yanındakilerle, kamplarla, şehrin sokaklarıyla vedalaş.", en: "Say goodbye to the people close to you, to the camps, to the streets." }
        sonuc: { tr: "Herkese söyleyeceğini söyledin. Kalanını pencere söyleyecek.", en: "You said what you had to say to everyone. The window can say the rest." }
        bedel: 1
        operasyonda:
          - can: 99999
          - mana: 99999
      - id: "son_yollar"
        ad: { tr: "Kaçış yollarını aç", en: "Open the escape routes" }
        aciklama: { tr: "Ne olursa olsun, şehirden çıkmak isteyenlere bir yol bırak.", en: "Whatever happens, leave a way out for anyone who wants to leave the city." }
        sonuc: { tr: "Kuzeye giden iki yol açık, iskelede üç tekne hazır. Kullanan olmazsa da olsun.", en: "Two roads north are open and three boats are ready at the pier. If nobody uses them, fine." }
        bedel: 1
        operasyonda:
          - degisken: { hayatta_kalan: 2 }
    acilis: 353
    son_tarih: 358
    bitis: 365
    baslik: { tr: "Son Karar", en: "The Final Decision" }
    hedef: { tr: "Yılın sonu. Pencere yalnız sana açılacak.", en: "The end of the year. The window will open for you alone." }
    tehdit: { tr: "Hasat vakti.", en: "Harvest time." }
    brifing: ["brifing_18"]
    operasyon: ["son_karar"]
    darbogaz: ["hasat_vakti"]
    darbogaz_gun: 365
    tasma: { tr: "Karar penceresi açıldı ve sen başka yerdeydin. Gökyüzü bekliyor; uzun beklemeyecek.", en: "The decision window opened and you were somewhere else. The sky is waiting. It won't wait long." }
