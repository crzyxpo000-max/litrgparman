uyanislar:
  son_nefes:
    baslik: { tr: "[UYANIŞ] Son Nefes", en: "[AWAKENING] Last Breath" }
    satirlar:
      - { tr: "Canın %10'un altındaydı ve yine de kazandın. Bedenin bunu bir kural olarak kaydediyor.", en: "You were under 10% HP and you still won. Your body files that away as a rule." }
      - { tr: "Yankı fısıldıyor: \"Ölmeyi reddettin. Ben de bunu reddetmeyi reddediyorum.\"", en: "Echo whispers: \"You refused to die. I refuse to let that go to waste.\"" }
    kosul:
      degisken_min: { _savas_kazanildi: 1 }
      degisken_max: { _savas_en_dusuk_can: 9, _savas_ezme: 0 }
    etkiler:
      - yetenek: "son_nefes"
      - ahlak: { insanlik: -2 }
  kirik_tavan:
    baslik: { tr: "[UYANIŞ] Kırık Tavan", en: "[AWAKENING] Broken Ceiling" }
    satirlar:
      - { tr: "Kademe sınırı bir duvar değilmiş. Bir kapıymış ve sen onu tekmeyle açtın.", en: "The Grade limit wasn't a wall. It was a door, and you kicked it open." }
      - { tr: "Bir sonraki evriminde gizli bir yol daha açılacak.", en: "A hidden path will open at your next evolution." }
    kosul:
      degisken_min: { _savas_kademe_farki: 1 }
    etkiler:
      - bayrak: "gizli_evrim_kademe_kiran"
      - stat: { wil: 2 }
  ilk_bekci:
    baslik: { tr: "[UYANIŞ] Bekçinin Mirası", en: "[AWAKENING] The Warden's Legacy" }
    satirlar:
      - { tr: "Bekçinin içinden ölülerin pencereleri dökülüyor. İçlerinden biri sana açılıyor.", en: "Windows of the dead pour out of the Warden. One of them opens for you." }
    kosul: { bayrak: "yenildi_ogretici_bekcisi" }
    etkiler:
      - unvan: "ilk_bekci_deviren"
      - oz: { koruma: 40 }
  # ---- Kırılma (Parti D, events/40_ana_yay.yaml): Kırılma'dan sonraki ilk zaferde Sistem gecikmeli kaydeder.
  kirilma_kemik_kabuk:
    baslik: { tr: "[UYANIŞ] Kırılma · Kemik Kabuk", en: "[AWAKENING] The Break · Bone Plating" }
    satirlar:
      - { tr: "Sistem kaydı gecikmeli düşüyor: 'Kademe sınırı ihlali · kaynak bulunamadı.' Kaynak sensin.", en: "The System logs it late: 'Grade limit breach · source not found.' The source is you." }
      - { tr: "Yankı: sen dayandın. ben yalnızca kapıyı tuttum.", en: "Echo: you held. i just held the door." }
    kosul: { iz: "kemik_kabuk", bayrak: "kirilma_yasandi", degisken_min: { _savas_kazanildi: 1 } }
    etkiler:
      - yetenek: "kale_durusu"
      - stat: { end: 1, wil: 1 }
  kirilma_yanki_damari:
    baslik: { tr: "[UYANIŞ] Kırılma · Yankı Damarı", en: "[AWAKENING] The Break · Echo Vein" }
    satirlar:
      - { tr: "Sistem kaydı gecikmeli düşüyor: 'Kademe sınırı ihlali · kaynak bulunamadı.' Kaynak ikiniz.", en: "The System logs it late: 'Grade limit breach · source not found.' The source is both of you." }
      - { tr: "Yankı: artık birlikte görüyoruz. güzel, değil mi?", en: "Echo: we see together now. isn't that nice?" }
    kosul: { iz: "yanki_damari", bayrak: "kirilma_yasandi", degisken_min: { _savas_kazanildi: 1 } }
    etkiler:
      - yetenek: "tehlike_sezgisi"
      - stat: { per: 1, int: 1 }
  kirilma_kara_kan:
    baslik: { tr: "[UYANIŞ] Kırılma · Kara Kan", en: "[AWAKENING] The Break · Black Blood" }
    satirlar:
      - { tr: "Sistem kaydı gecikmeli düşüyor: 'Kademe sınırı ihlali · kaynak bulunamadı.' Kaynak sensin ve hâlâ kanıyorsun.", en: "The System logs it late: 'Grade limit breach · source not found.' The source is you, and you're still bleeding." }
      - { tr: "Yankı: bunu ben yapmadım. sen yaptın. ve hoşuna gitti.", en: "Echo: i didn't do that. you did. and you liked it." }
    kosul: { iz: "kara_kan", bayrak: "kirilma_yasandi", degisken_min: { _savas_kazanildi: 1 } }
    etkiler:
      - yetenek: "kan_bedeli"
      - stat: { str: 1, wil: 1 }
