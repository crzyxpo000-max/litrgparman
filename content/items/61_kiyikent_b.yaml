# Parti H eşyaları (events/61_kiyikent_b.yaml).
esyalar:
  ocak_tavli_cekirdek:
    ad: { tr: "Ocakta Tavlanmış Çekirdek", en: "Forge-Tempered Core" }
    aciklama: { tr: "Tersanedeki demirci kadının ateşinde tavlanmış bir kapı çekirdeği. Artık çığlık atmıyor; yalnızca ılık ve çok ağır.", en: "A Gate core tempered in the shipyard smith's fire. It doesn't scream anymore. It's just warm, and very heavy." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 140
  sahte_kat_haritasi:
    ad: { tr: "Sahte Kat Haritası", en: "Bogus Floor Map" }
    aciklama: { tr: "Kule'nin ilk beş katı için \"kesin güvenli\" bir rota. Mürekkebi hâlâ ıslak; üçüncü kattaki koridor bir duvara çıkıyor.", en: "A \"guaranteed safe\" route through the Spire's first five floors. The ink's still wet, and the third-floor hallway runs into a wall." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 1
  kule_merhemi:
    ad: { tr: "Kule Merhemi", en: "Spire Salve" }
    aciklama: { tr: "Konsey çadırında kristal tozu ve kızıl yaprakla karılan gri bir merhem. Taş kesiklerini kapatır; kokusu günlerce gitmez.", en: "A gray salve the Council tent mixes from crystal dust and bloodleaf. Closes up stone cuts. The smell sticks around for days." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 45
    kullan: { hp: 90 }
