# Parti I — Çok-evren eşyaları (ganimet ve hikaye eşyaları).
esyalar:
  tuz_tableti:
    ad: { tr: "Nehha Tuz Tableti", en: "Nehha Salt Tablet" }
    aciklama: { tr: "Nehhaların üstüne yazı yazdığı sıkıştırılmış deniz tuzu. Çentikleri gelgitleri sayar; çoğu bir adla biter.", en: "Pressed sea salt the Nehha used to write on. The notches count tides, and most of them end in a name." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 60
  nehha_cani:
    ad: { tr: "Nehha Çanı", en: "Nehha Bell" }
    aciklama: { tr: "Avuç içi kadar, yeşile çalmış bir bronz çan. Hasat'tan önce bu dünyada Sistem'e ait olmayan tek ses buydu.", en: "A palm-sized bronze bell gone green with age. Before the Harvest, it was the only sound on this world that didn't belong to the System." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 250
  basakci_cekirdegi:
    ad: { tr: "Başakçı Çekirdeği", en: "Gleaner Core" }
    aciklama: { tr: "Son Başakçı'nın göğsünden çıkan, içinde hâlâ yüzlerce sönük pencerenin titrediği soğuk bir küre. Elinde tuttuğunda seviyen bir an ağırlaşır.", en: "A cold sphere pulled from the Last Gleaner's chest, hundreds of dead windows still flickering inside it. Hold it and your level feels heavier for a second." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 2400
  pirinc_pul:
    ad: { tr: "Tavvar Söz Pulu", en: "Tavvari Word-Chit" }
    aciklama: { tr: "Pirinç Kervan'da konuşmanın bedeli: tırnak büyüklüğünde, üstüne bir hece kazınmış pirinç pul. Tavvarlar yüz pula bir sır satar.", en: "The price of talking on the Brass Caravan: a brass chit the size of a fingernail with one syllable stamped on it. The Tavvari will sell you a secret for a hundred of them." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 40
  muhur_parcasi:
    ad: { tr: "Senet Mühründen Parça", en: "Shard of the Bond-Seal" }
    aciklama: { tr: "Boyun Senedi'nin mühründen kopmuş, hâlâ sıcak bir pirinç parçası. Kenarında Kadim yazısıyla tek bir sözcük: 'Daima'.", en: "A still-warm chunk of brass broken off the Neckbond's seal. Along the edge, one word in Ancient script: 'Always.'" }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 900
  kadim_ipligi:
    ad: { tr: "Kadim İpliği", en: "Ancient Thread" }
    aciklama: { tr: "Bir Kadim'in derisinin altından sökülmüş, ışık gibi parlayan bir iplik. Ucunda başka bir dünyanın yıldızlarından biri hâlâ asılı duruyor.", en: "A thread of light unpicked from under an Ancient's skin. One of another world's stars is still hanging off the end of it." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 1100
  ossiran_tac_parcasi:
    ad: { tr: "Varis'in Tacından Parça", en: "Shard of the Heir's Crown" }
    aciklama: { tr: "Ossiran'ın tacından kopan, içinde üç dünyanın ışığının birbirine karıştığı bir kristal. Kulağına tutunca üç ayrı dilde ağlayan sesler duyarsın.", en: "A crystal broken off Ossiran's crown, the light of three worlds swirled together inside it. Hold it to your ear and you hear crying in three different languages." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 4000
