# Parti K1 — Perde 4 eşyaları.
esyalar:
  kadim_zirh_parcasi:
    ad: { tr: "Kadim Zırh Parçası", en: "Ancient Armor Shard" }
    aciklama: { tr: "Bir Hasat Piyadesi'nin zırhından kopmuş, hâlâ ılık bir plaka. İç yüzünde onu giyenin dünyasından kalma küçük bir çizik var; bir çocuğun çizdiği güneşe benziyor.", en: "A plate torn off a Reaper's armor, still warm. On the inside there's a little scratch left over from the world its wearer came from. It looks like a sun a kid drew." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 400
  hasat_cekirdegi:
    ad: { tr: "Hasat Çekirdeği", en: "Harvest Core" }
    aciklama: { tr: "Hasat Valisi'nin göğsünden sökülmüş, yumruk büyüklüğünde bir kristal. İçinde biçilmeyi bekleyen bir dünyanın bütün hesabı döner; avucunda tuttuğunda o hesap seni de sayar.", en: "A fist-sized crystal pried out of the Harvest Prefect's chest. Inside it turns the full accounting of a world waiting to be reaped. Hold it in your palm and the count includes you." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 5000
  cekirdek_kirintisi:
    ad: { tr: "Çekirdek Kırıntısı", en: "Core Fragment" }
    aciklama: { tr: "Sistem Çekirdeği'nden kopmuş, mavi ışıklı bir taş. Üstünde yalnız göz ucuyla bakınca okunabilen satırlar akar; doğrudan bakınca kaybolurlar.", en: "A blue-lit stone that broke off the System Core. Lines scroll across it that you can only read out of the corner of your eye. Look straight at them and they're gone." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 1500
  kusatma_tayini:
    ad: { tr: "Kuşatma Tayını", en: "Siege Ration" }
    aciklama: { tr: "Sığınak mutfaklarında pişirilmiş, mumlu kâğıda sarılmış yoğun bir ekmek. Üstüne biri kurşun kalemle \"dayan\" yazmış.", en: "A dense loaf baked in the Haven's kitchens and wrapped in wax paper. Somebody wrote \"hang in there\" on it in pencil." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 50
    kullan: { hp: 400 }
  son_mektup:
    ad: { tr: "Mühürlü Mektup", en: "Sealed Letter" }
    aciklama: { tr: "Sana bırakılmış, 365. günden sonra açılacak bir mektup. Zarfın üstünde yalnızca adın yazılı.", en: "A letter left for you, to be opened after Day 365. There's nothing on the envelope but your name." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 0
