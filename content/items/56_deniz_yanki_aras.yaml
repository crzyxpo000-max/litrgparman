# Parti F — Deniz, Yankı ve Aras yaylarının eşyaları.
esyalar:
  martili_tebesir:
    ad: { tr: "Martılı Tebeşir", en: "Gull Chalk" }
    aciklama: { tr: "Ucu körelmiş mavi bir okul tebeşiri. Kıyıkent'in duvarlarına ördeğe benzeyen martılar çizen el, en son bunu tutuyordu.", en: "A stubby blue sidewalk chalk. The hand that drew duck-looking gulls all over Port Harlow's walls was holding this one last." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 1
  sifir_paketi:
    ad: { tr: "Sıfır Paketi", en: "Packet Zero" }
    aciklama: { tr: "Sistem'in dikiş yerinden kopardığın, avucunda titreyen bir parça ışık. Üstünde tek bir satır var: 0x00. Ona bakarken kafandaki ses susuyor.", en: "A scrap of light you tore out of the System's seam, trembling in your palm. One line on it: 0x00. The voice in your head goes quiet when you look at it." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 900
  aras_cakisi:
    ad: { tr: "Rakibin Çakısı", en: "The Rival's Pocketknife" }
    aciklama: { tr: "Sapı aşınmış, ağzı hâlâ jilet gibi bir çakı. Öğretici'de bir elmayı soymuştu; şimdi senin cebinde.", en: "A pocketknife with a worn handle and an edge that's still a razor. It peeled an apple once in the Tutorial. Now it's in your pocket." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 1
