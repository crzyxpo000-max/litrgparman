# Parti J eşyaları.
esyalar:
  leviatan_pulu:
    ad: { tr: "Leviatan Pulu", en: "Leviathan Scale" }
    aciklama: { tr: "Kalkan büyüklüğünde, tuzdan sertleşmiş bir pul. Başka bir okyanusun soğuğu hâlâ içinde.", en: "A scale the size of a shield, hardened by salt. It still holds the cold of some other ocean." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 600
  gunes_kristali:
    ad: { tr: "Güneş Kristali", en: "Sunlight Crystal" }
    aciklama: { tr: "Bir kapı kristalinin içine sıkıştırılmış Kadim güneşi. Kırınca yaraları kapatan sıcak bir ışık yayar.", en: "Ancient sunlight packed into a Gate crystal. Crack it and it gives off a warm light that closes wounds." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 400
    kullan: { hp: 2000 }
  catlak_odunc_tac:
    ad: { tr: "Çatlak Ödünç Taç", en: "Cracked Borrowed Crown" }
    aciklama: { tr: "İnce, gümüş, çatlak bir Kadim işi. İçinde hâlâ bir fısıltı var; taşıyanın ömrünü faiz diye ister.", en: "Ancient-made, thin, silver, and cracked. There's still a whisper in it, asking for its wearer's lifespan as interest." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 5000
