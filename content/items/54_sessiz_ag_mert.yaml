# Parti D (Aşama 7) — Sessiz Ağ zinciri eşyaları.
esyalar:
  kaynak_parcasi:
    ad: { tr: "Kaynak Parçası", en: "Source Fragment" }
    aciklama: { tr: "Kapanmış bir kapının çekirdeğinden kalan, avuç içi büyüklüğünde, sıcak bir cam kırığı. İçinde biçimlenmemiş Sistem kodu akıyor; bakınca penceren titriyor.", en: "A palm-sized, warm shard of glass left over from a closed Gate's core. Raw, unformatted System code runs inside it. Look at it too long and your window starts to flicker." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 400
  duzeltme_cekirdegi:
    ad: { tr: "Düzeltme Çekirdeği", en: "Correction Core" }
    aciklama: { tr: "Bir Düzeltme Birimi'nin göğsündeki beyaz küp. Hâlâ hafifçe uğulduyor ve yakınındaki her şeyi 'standart'a döndürmeye çalışıyor.", en: "The white cube from a Correction Unit's chest. Still humming faintly, still trying to reset everything near it back to standard." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 120
  mert_sondasi:
    ad: { tr: "Kule Sondası", en: "Spire Probe" }
    aciklama: { tr: "Bir termos, iki araba aküsü, bir yönlendirici ve bolca bant. {npc:mert_kilic} buna 'sonda' diyor; sen buna dua diyorsun.", en: "A thermos, two car batteries, a router, and a whole lot of duct tape. {npc:mert_kilic} calls it a probe. You call it a prayer." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 60
