# Parti C eşyaları.
esyalar:
  beyaz_keten:
    ad: { tr: "Beyaz Keten", en: "White Linen" }
    aciklama: { tr: "Bir Yükselen cübbesinden kalan kumaş. Temiz, sağlam ve üstüne kömürle bir göz çizilmiş.", en: "Cloth from an Ascended robe. Clean, sturdy, with an eye drawn on it in charcoal." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 6
  kul_muhru:
    ad: { tr: "Kül Mührü", en: "Ash Seal" }
    aciklama: { tr: "Yakıtın alnına sürülen ince gri kül, küçük bir kâsede. Sarnıcın kenarından toplanmış; nereden geldiğini düşünmemeye çalış.", en: "The fine gray ash they thumb onto the fuel's foreheads, in a little bowl. Scraped from the edge of the reservoir. Try not to think about where it came from." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 20
  ocak_cekirdegi:
    ad: { tr: "Ocak Çekirdeği", en: "Kiln Core" }
    aciklama: { tr: "Ocak Ağzı'nın kalbinden kalan sıcak, beyaz bir taş. Elinde tuttuğunda çok uzaktan, çok sayıda sesin teşekkür ettiğini duyuyorsun.", en: "A warm white stone left over from the Kiln Mouth's heart. Hold it and you can hear a lot of voices, very far away, saying thank you." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 200
  vahit_mikrofonu:
    ad: { tr: "Pilsiz Mikrofon", en: "The Dead Mic" }
    aciklama: { tr: "Bir peygamberin masa mikrofonu. Kablosu hiçbir yere takılı değil, pili yok. Kırmızı ışığı hâlâ yanıyor.", en: "A prophet's desk mic. The cable isn't plugged into anything and there's no battery. The red light is still on." }
    tur: "malzeme"
    nadirlik: "benzersiz"
    deger: 1
