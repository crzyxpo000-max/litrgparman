# Parti L2 — Kule hikaye katlarının kalıntıları (boss ganimeti ve hikaye ödülü).
esyalar:
  kule_vapur_bileti:
    ad: { tr: "Delinmiş Vapur Bileti", en: "Punched Ferry Ticket" }
    aciklama: { tr: "Onuncu kattaki vapurdan kalma bir bilet. Üstünde Entegrasyon Günü'nün tarihiyle akşam seferinin saati yazılı; biletçi onu iki kez zımbalamış.", en: "A ticket from the ferry on the tenth floor. It's stamped with Integration Day's date and the time of the evening sailing, and the punch went through it twice." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 90
  kule_cam_mektup:
    ad: { tr: "Cam Mektup", en: "Glass Letter" }
    aciklama: { tr: "Otuzuncu katın aynasından kopan, avuç içi büyüklüğünde bir cam parçası. Üstündeki yazı senin el yazın, ama sen yazmadın.", en: "A palm-sized shard that broke off the mirror on the thirtieth floor. The writing on it is in your handwriting. You didn't write it." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 0
  kule_durmus_akrep:
    ad: { tr: "Durmuş Akrep", en: "The Stopped Hand" }
    aciklama: { tr: "Saat Ustası'nın kolundan kalan pirinç akrep. Hep aynı yeri gösterir: sıfırı.", en: "The brass hour hand left over from the Clockwright's arm. It always points to the same place: zero." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 260
  kule_esik_nisani:
    ad: { tr: "Eşik Nişanı", en: "Threshold Insignia" }
    aciklama: { tr: "Eşik Muhafızı'nın göğsünden düşen nişan. Arması artık var olmayan bir dünyaya ait; kenarında Sistem'in diliyle küçük bir satır: [Hasat edildi].", en: "The insignia that fell from the Threshold Warden's chest. Its crest belongs to a world that doesn't exist anymore, and along the edge, in the System's script, one small line: [Harvested]." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 420
  kule_tohum_kristali:
    ad: { tr: "Tohum Kristali", en: "Seed Crystal" }
    aciklama: { tr: "Tohumluk'taki kozalardan birinden kopmuş bir kristal parçası. Avucunda ılık duruyor, sanki içinde hâlâ biri uyuyor.", en: "A chip of crystal broken off a pod in the Seed Vault. It's warm in your palm, like somebody's still sleeping inside it." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 480
  kule_bos_kalp:
    ad: { tr: "Boş Kalp", en: "Hollow Heart" }
    aciklama: { tr: "Önceki Taşıyıcı'dan geriye kalan, ortası delik bir çizgi düğümü. Kulağına tutunca bir ses duyar gibi olursun; kafanın içindekine çok benzeyen bir ses.", en: "A knot of line art with a hole through the middle, all that's left of the Previous Carrier. Hold it to your ear and you almost hear a voice. A lot like the one in your head." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 0
  kule_ilk_pencere_parcasi:
    ad: { tr: "İlk Pencere'nin Kırığı", en: "Shard of the First Window" }
    aciklama: { tr: "Kule'nin zirvesindeki pencereden kopan mavi bir kırık. Kenarları kusursuz değil; yüzlerce kez açılıp kapanmaktan aşınmış.", en: "A blue shard broken off the window at the top of the Spire. The edges aren't clean. They're worn from being opened and closed hundreds of times." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 0
