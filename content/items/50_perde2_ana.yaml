# Parti A — Perde 2 ana yay eşyaları (ganimetler ve hikaye ödülleri).
esyalar:
  kanca_disi:
    ad: { tr: "Kanca Dişi", en: "Hook Tooth" }
    aciklama: { tr: "Liman Kancası'nın dilinin ucundaki kemik kanca. Balıkçılar bunu kapılarının üstüne asar; canavarı değil, denizi korkuttuğuna inanırlar.", en: "The bone hook off the end of a Harbor Hook's tongue. Fishermen hang them over their doors. They figure it scares off the sea, not the monsters." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 45
  haberci_cani:
    ad: { tr: "Haberci Çanının Parçası", en: "Herald's Bell Shard" }
    aciklama: { tr: "Kule'nin ilk sabahında inen habercinin çanından kopmuş bronz bir parça. Avucunda tuttuğunda Kule'nin hangi katının uyanık olduğunu duyarsın.", en: "A bronze shard broken off the bell of the herald that came down on the Spire's first morning. Hold it in your palm and you can hear which floor of the Spire is awake." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 260
  saat_tasi:
    ad: { tr: "Saat Taşı", en: "Clockstone" }
    aciklama: { tr: "Eski hükümet konağından bir taş; içinden bir dişliyle kristal damarlar geçer. Hâlâ tıkırdıyor ama Kıyıkent'in saatine göre değil.", en: "A stone from the old courthouse with a gear and crystal veins running through it. It still ticks. Just not on Port Harlow time." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 300
  tasma_kalbi:
    ad: { tr: "Taşma Kalbi", en: "Overflow Heart" }
    aciklama: { tr: "Dalga Ana'nın kabuğunun içinde atan mavi çekirdek. Bir kapının kırk dokuz günde biriktirdiği ne varsa bu yumruk büyüklüğündeki ışığın içinde.", en: "The blue core that beat inside the Brood Tide's shell. Everything a Gate stored up over forty-nine days, packed into a light the size of your fist." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 600
  duzeltme_kalintisi:
    ad: { tr: "Düzeltme Kalıntısı", en: "Correction Residue" }
    aciklama: { tr: "Düzeltici dağıldıktan sonra havada asılı kalan yarım bir satır. Okumaya çalıştıkça kendini siler.", en: "Half a line of code left hanging in the air after the Corrector came apart. Every time you try to read it, it deletes a little more of itself." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 280
  kadim_pulu:
    ad: { tr: "Kadim Pulu", en: "Ancient Scale" }
    aciklama: { tr: "Gözcünün harita gövdesinden düşmüş tek bir pul. Üstünde haritası çıkarılmış bir dünyanın kıyı çizgisi var ve bu çizgi {yer:kiyikent|in} körfezine benziyor.", en: "A single scale shed from the Watcher's map of a body, with the coastline of some charted world on it. The coastline looks a lot like the bay at {yer:kiyikent}." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 650
