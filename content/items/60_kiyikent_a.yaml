# Parti G — Perde 2 Kıyıkent eşyaları ve ganimetleri.
esyalar:
  fener_incisi:
    ad: { tr: "Fener İncisi", en: "Lamplighter's Pearl" }
    aciklama: { tr: "Fener Balığı Ana'nın sapının ucundaki ışık sönünce katılaşıp bir inciye dönüşmüş. Karanlıkta hâlâ hafif hafif sallanır.", en: "The light at the tip of the Lamplighter's stalk, gone hard and pearly after it died. In the dark it still sways a little." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 260
  kiskac_kabugu:
    ad: { tr: "Tuzlu Kıskaç Kabuğu", en: "Salt-Crusted Claw Shell" }
    aciklama: { tr: "Mendirek kıskaçlarının tuzla sertleşmiş, kenarları bıçak gibi keskin kabuğu. Zırhçılar bayılır.", en: "Shell off a jetty claw, hardened with salt, edges sharp as a knife. Armorers love the stuff." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 14
  safra_yagi:
    ad: { tr: "Safra Yağı", en: "Bilge Oil" }
    aciklama: { tr: "Vapurların dibinde yaşayan yılanların derisinden sızan kara, kaygan bir yağ. Pas tutmaz ama çabuk tutuşur.", en: "Black, slick oil that seeps out of the hides of the eels living in ferry bilges. Won't rust. Lights easy." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 12
  taklitci_disi:
    ad: { tr: "Taklitçi Dişi", en: "Mimic Tooth" }
    aciklama: { tr: "Kilit dili biçiminde çelik bir diş. Hangi kilide sokarsan sok, kilit bir an düşünüp açılır.", en: "A steel tooth shaped like a lock bolt. Stick it in any lock and the lock thinks about it for a second, then opens." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 70
  hamam_kristali:
    ad: { tr: "Hamam Kristali", en: "Steam-Room Crystal" }
    aciklama: { tr: "Bir kapının göbek taşından dökülmüş kızıl kristal. Avucunda hâlâ sıcacık; kış geceleri için birebir.", en: "A red crystal that spilled out of a Gate's steam-room slab. Hold it in your palm and it's still warm. Perfect for winter nights." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 90
  firin_ekmegi:
    ad: { tr: "Taş Fırın Ekmeği", en: "Wood-Fired Loaf" }
    aciklama: { tr: "Eski Şehir'in fırıncısı Sistem'den meslek alınca ekmeğine bir şey karışmış. Isırınca kesikler kapanıyor.", en: "The Old Town baker's System profession put something into his bread. Take a bite and cuts close up." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 15
    kullan: { hp: 35 }
