# Parti E — Kadimler zinciri ve Elçi Thessar'ın eşyaları (events/55_kadimler_thessar.yaml, enemies/55_kadimler.yaml).
esyalar:
  defter_yapragi:
    ad: { tr: "Defter Yaprağı", en: "Ledger Leaf" }
    aciklama: { tr: "Bir Kadim zırhından kopmuş, seramik kadar sert, cilalı bir yaprak. Üstünde küçük, düzgün harflerle alt alta adlar yazılı; hiçbirini okuyamıyorsun ama bazılarının üstü çizilmiş.", en: "A page torn off Ancient armor, lacquered hard as ceramic. A column of names runs down it in small, tidy script. You can't read any of them, but some are crossed out." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 120
  okuyucu_mercegi:
    ad: { tr: "Okuyucu Merceği", en: "Reader's Lens" }
    aciklama: { tr: "Bir Okuyucu'nun yarığının ardındaki ince, ıslak taş. Gözüne tutunca insanların seviyeleri bir anlığına çırılçıplak görünür, ardından baş ağrısı başlar.", en: "The thin, wet stone from behind a Reader's slit. Hold it up to your eye and people's levels show bare for a second. Then the headache kicks in." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 400
  vel_damlasi:
    ad: { tr: "Vel Damlası", en: "Vel Draught" }
    aciklama: { tr: "Kadim sayım çadırlarında dağıtılan koyu, soğuk bir şurup. Kemikleri kaynatır, yaraları kapatır; alanın adı bir deftere yazılır. Şişenin dibinde küçük bir çentik var.", en: "A thick, cold syrup handed out at the Ancients' tally tents. Knits bone, closes wounds, and puts the drinker's name in a ledger somewhere. There's a tiny notch cut into the bottom of the bottle." }
    tur: "tuketim"
    nadirlik: "epik"
    deger: 500
    kullan: { hp: 2500 }
  sayim_murekkebi:
    ad: { tr: "Sayım Mürekkebi", en: "Tally Ink" }
    aciklama: { tr: "Okuyucuların yarıklarından sızan mavi-siyah bir sıvı. İçince büyün yerine gelir, bir süre de her şeyi sayasın gelir: basamakları, nefesleri, kalanları.", en: "A blue-black fluid that seeps from Readers' slits. Drink it and your magic comes rushing back, along with an urge to count everything for a while: stairs, breaths, whoever's left." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 300
    kullan: { mp: 900 }
  defter_muhru:
    ad: { tr: "Defter Mührü", en: "Ledger Seal" }
    aciklama: { tr: "Kadim filosunun hasat yetkisi: avuç içi büyüklüğünde, ılık, canlı bir mühür. Elçi onu kendi derisinden söküp sana verdi. Basıldığı her emir Meclis'in emri sayılır.", en: "The Ancient fleet's authority to harvest: a warm, living seal the size of your palm. The Envoy cut it out of his own skin and gave it to you. Any order it stamps counts as an order of the Conclave." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 0
  antlasma_nushasi:
    ad: { tr: "Antlaşma Nüshası", en: "Copy of the Treaty" }
    aciklama: { tr: "Boyunduruk antlaşmasının insanlara bırakılan nüshası; kâğıda değil, ince bir deriye yazılmış. En altta kanla attığın imza duruyor, altındaki boşluk ikinci bir imzayı bekliyor.", en: "Humanity's copy of the vassal treaty. It isn't paper. It's a thin hide. Your signature is at the bottom in blood, and the blank under it is waiting for a second one." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 0
  budayici_gozu:
    ad: { tr: "Budayıcının Gözü", en: "The Pruner's Eye" }
    aciklama: { tr: "Hiç kapanmamış bir göz; avucunda bile açık durur. Bakınca dünyadaki her şeyin nereden kesilebileceğini görürsün.", en: "An eye that never once closed. It stays open even in your palm, and when you look through it you can see where everything in the world could be cut." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 2000
  elcinin_kalemi:
    ad: { tr: "Elçinin Kalemi", en: "The Envoy's Stylus" }
    aciklama: { tr: "Ucu kırık, zincirli bir kalem. Mürekkebi bitmez, çünkü mürekkebini tutanın kendisinden alır. Onunla yazılmış bir satırı Kadimler silemez.", en: "A chained stylus with a broken nib. It never runs dry, because it draws ink from whoever's holding it. A line written with it is one the Ancients can't erase." }
    tur: "malzeme"
    nadirlik: "mitik"
    deger: 2500
