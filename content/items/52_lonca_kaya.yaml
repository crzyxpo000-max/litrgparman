# Parti B2 eşyaları (Demir Lonca zinciri + Kaya Demir).
esyalar:
  turuncu_yama:
    ad: { tr: "Turuncu Lonca Yaması", en: "Orange Guild Patch" }
    aciklama: { tr: "Öğreticideki turuncu bandın büyümüş hâli: kalın kumaşa dikilmiş, kenarı çelik telle örülmüş bir yama. Sanayi'de kapılar bunu takana açılır.", en: "The orange tape from the tutorial, all grown up: a heavy cloth patch stitched with steel wire around the edge. In the Ironworks, doors open for whoever's wearing one." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 40
  kizak_kabugu:
    ad: { tr: "Kızak Kraliçesi'nin Kabuğu", en: "Slipway Queen Shell Plate" }
    aciklama: { tr: "Yarım kalmış bir gemi gövdesiyle kaynaşmış kitin. Ağırdır, soğuktur, hiçbir demirci ateşinde yumuşamaz; Lonca'nın zırhçıları bunun için sıraya girer.", en: "Chitin fused with a half-built ship's hull. Heavy, cold, and it won't soften in any forge the Guild has. Their armorers line up for a piece of it." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 260
  lonca_tayini:
    ad: { tr: "Lonca Tayını", en: "Guild Ration Pack" }
    aciklama: { tr: "Katkı puanına göre dağıtılan, üstü damgalı bir teneke kutu: bisküvi, konserve et, şeker ve Sanayi'nin kapı yosunundan yapılmış acı bir macun. Tadı kötü ama iş görür.", en: "A stamped tin handed out by contribution score: crackers, canned meat, sugar, and a bitter paste made from Ironworks gate moss. Tastes bad. Works." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 30
    kullan: { hp: 250 }
  demir_muhur:
    ad: { tr: "Demir Mühür", en: "The Iron Seal" }
    aciklama: { tr: "Lonca'nın emirlerini de Demir Yasa'yı da damgalayan ağır, dökme demir bir mühür. Sapındaki tutamak aylardır tek bir elde kalmaktan o elin biçimini almış.", en: "A heavy cast-iron seal that stamps the Guild's orders and the Iron Law. The grip has worn to the shape of a single hand over the months." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 500
  kaya_kunyesi:
    ad: { tr: "Eski Bir Askerin Künyesi", en: "An Old Soldier's Dog Tags" }
    aciklama: { tr: "İki çelik plaka, eğri bir zincir. Birinin kenarı ezik; yıllar önce bir kurşunu durdurmuş olabilir, belki de yalnızca bir kapıya sıkışmıştır. Sahibi sana anlatmadı.", en: "Two steel tags on a bent chain. One of them has a crushed edge. Maybe it stopped a round, years ago. Maybe it just got caught in a door. The man who gave it to you never said." }
    tur: "malzeme"
    nadirlik: "efsanevi"
    deger: 1
