bildirim_rakip: { tr: "[{npc} Küresel Sıralama'da seni geçti.]", en: "[{npc} passed you on the Global Ranking.]" }
bildirim_goz: { tr: "[{grade} kademesinden bir varlık seni fark etti.]", en: "[An entity of Grade {grade} has noticed you.]" }
bildirim_kapi: { tr: "[{grade} kademesinden bir kapı taşmak üzere. Kalan süre: 1 gün.]", en: "[A Grade {grade} Gate is about to overflow. Time remaining: 1 day.]" }
hafiza_siralama_atismasi: { tr: "Sıralamada seni geçince telsizden laf attın; güldü.", en: "When he passed you on the Ranking, you talked trash over the radio. He laughed." }
