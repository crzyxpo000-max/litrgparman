savas_yoldas_kalkan: { tr: "{ally} önüne geçip sana siper oluyor.", en: "{ally} steps in front of you and throws up a guard." }
savas_yoldas_sifa: { tr: "{ally} ellerini yaralarına bastırıyor; acı geri çekiliyor.", en: "{ally} gets hands on your wounds. The pain backs off." }
savas_yoldas_iskaladi: { tr: "{ally} saldırıyor ama {target} son anda kurtuluyor.", en: "{ally} swings, but {target} slips it at the last second." }
savas_dusman_yoldas_iskaladi: { tr: "{enemy} yana dönüp saldırıyor; {ally} kıl payı sıyrılıyor.", en: "{enemy} turns and lunges. {ally} slips it by a hair." }
savas_dusman_yoldasa: { tr: "{enemy} yana dönüp saldırıyor. Darbe yerini buluyor; {ally} sendeliyor.", en: "{enemy} turns and strikes. It connects. {ally} staggers." }
savas_yoldas_dustu: { tr: "{ally} yere yığılıyor. Nefes alıyor ama bu savaştan çıktı.", en: "{ally} hits the ground. Still breathing, but out of this fight." }
hafiza_olay_iyi: { tr: "Hatırlıyor: {event}", en: "Remembers: {event}" }
hafiza_olay_kotu: { tr: "Unutmadı: {event}", en: "Hasn't forgotten: {event}" }
hafiza_basari: { tr: "Gözüyle gördü: {name}", en: "Saw it firsthand: {name}" }
hafiza_yalan_acik: { tr: "Yalanını biliyor: {name}", en: "Knows you lied: {name}" }
hafiza_yalan_acik_genel: { tr: "Ona yalan söylediğini biliyor.", en: "Knows you lied to them." }
hafiza_kisisel_tamam: { tr: "En çok ihtiyaç duyduğu an yanındaydın.", en: "You were there when it mattered most." }
hafiza_savasta_dustu: { tr: "Senin yanında yere düştü.", en: "Went down fighting at your side." }
hafiza_duelloda_yenildi: { tr: "Sana yenildi; bunu hâlâ içinde taşıyor.", en: "Lost to you. Still carries it." }
hafiza_duelloda_bagislandi: { tr: "Bitirebilirdin. Bitirmedin.", en: "You could have finished it. You didn't." }
hafiza_guc_hayranlik: { tr: "Nasıl büyüdüğünü izledi ve hayran kaldı.", en: "Watched you grow and was in awe." }
hafiza_guc_endise: { tr: "Neye dönüştüğünden korkuyor.", en: "Worries about what you're becoming." }
hafiza_guc_kiskanclik: { tr: "Senin ulaştığın yere hâlâ uzanamıyor.", en: "Still can't reach where you are." }
hafiza_guc_bagimlilik: { tr: "Sensiz ayakta kalamayacağını düşünüyor.", en: "Thinks they can't make it without you." }
npc_durum_olu: { tr: "Öldü", en: "Dead" }
npc_durum_gitti: { tr: "Gitti", en: "Gone" }
npc_durum_yoldas: { tr: "Yoldaş", en: "Companion" }
npc_durum_rakip: { tr: "Rakip", en: "Rival" }
rol_saldiri: { tr: "Saldırı", en: "Striker" }
rol_koruma: { tr: "Koruma", en: "Guard" }
rol_sifa: { tr: "Şifa", en: "Healer" }
rol_menzil: { tr: "Menzil", en: "Ranged" }
hafiza_ihanetten_dondu: { tr: "Sana ihanet etmeye geldi; sen onu konuşarak geri getirdin.", en: "Came to betray you. You talked them back." }
hafiza_ihanette_birakildi: { tr: "İhanet ettiği gece onu durdurmaya çalışmadın bile.", en: "The night they turned on you, you didn't even try to stop them." }
hafiza_ihanet_sorgu: { tr: "Yenildikten sonra ona neden diye sordun.", en: "After it was over, you asked them why." }
hafiza_rica_reddedildi: { tr: "Senden tek bir şey istedi. Reddettin.", en: "Asked you for one thing. You said no." }
hafiza_kacinca_aradi: { tr: "Kaçtığında peşinden geldin, hem de kızmadan.", en: "When they ran, you came after them. Not angry." }
hafiza_ayaga_kaldirdi: { tr: "Önünde diz çöktü; sen onu ayağa kaldırdın.", en: "They knelt in front of you. You pulled them back up." }
hafiza_kucumsendi: { tr: "Meydan okudu; sen yüzüne güldün.", en: "They challenged you. You laughed in their face." }
hafiza_ayrilirken_ugurladi: { tr: "Ayrılırken onu kin tutmadan uğurladın.", en: "When they left, you saw them off. No grudge." }
hafiza_degisecegine_soz: { tr: "Değişeceğine söz verdin. Bekliyor.", en: "You promised you'd change. They're waiting." }
hafiza_yalani_itiraf_etti: { tr: "Yalanın ortaya çıkınca her şeyi itiraf ettin.", en: "When the lie came out, you owned all of it." }
infaz_acimasiz_npc: { tr: "Öldür", en: "Kill" }
infaz_acimasiz_npc_aciklama: { tr: "Bunun dönüşü yok. Merhamet −3, İnsanlık −2. Ölüm kalıcıdır.", en: "There's no coming back from this. Mercy −3, Humanity −2. Death is permanent." }
infaz_acimasiz_npc_metin: { tr: "Bitiriyorsun. {enemy} son nefesinde bile gözlerini senden ayırmıyor.", en: "You finish it. Even on the last breath, {enemy} doesn't look away from you." }
infaz_temiz_npc: { tr: "Dövüşü bitir", en: "End the fight" }
infaz_temiz_npc_aciklama: { tr: "Kesin yenilgi, ama can almadan. Düzen +2.", en: "A clear defeat, no killing blow. Order +2." }
infaz_temiz_npc_metin: { tr: "Son darbe silahını elinden uçuruyor. {enemy} yerde kalıyor; yenildiğini ikiniz de biliyorsunuz.", en: "Your last strike sends the weapon flying. {enemy} stays down, and you both know it's over." }
infaz_bagisla_npc: { tr: "Elini uzat", en: "Offer a hand" }
infaz_bagisla_npc_aciklama: { tr: "Kazandın; bunu yüzüne vurma. Merhamet +5.", en: "You won. Don't rub it in. Mercy +5." }
infaz_bagisla_npc_metin: { tr: "Silahını indirip elini uzatıyorsun. {enemy} bir an duraksıyor, sonra tutuyor.", en: "You lower your weapon and offer a hand. {enemy} hesitates, then takes it." }
hafiza_maskeyi_gordu: { tr: "Sıralamadaki maskenin ardını bir an gördü.", en: "Got one look behind the mask on the board." }
hafiza_kabul_edildi: { tr: "Aktarımda onu sorgusuz kabul ettin.", en: "During the transfer, you took it in without a single question." }
hafiza_ne_oldugu_soruldu: { tr: "İlk sorduğun şey ne olduğuydu.", en: "The first thing you asked was what it was." }
hafiza_direnildi: { tr: "Aktarımda çatlağı kapatmaya çalıştın. Bir anlığına başardın.", en: "During the transfer you tried to seal it out. For one second, you did." }
