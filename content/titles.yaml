ogreticinin_ilk_kani:
  ad: { tr: "Öğreticinin İlk Kanı", en: "First Blood of the Tutorial" }
  aciklama: { tr: "Öğretici Katman'daki ilk öldürmeyi sen yaptın. Dünyada bir tane var.", en: "You made the first kill in the Tutorial Layer. There's only one of these in the world." }
  nadirlik: "nadir"
  bonus: { str: 1, agi: 1 }
  ilk: true
ilk_kapi_kapatan:
  ad: { tr: "İlk Kapı Kapatan", en: "First Gate Closer" }
  aciklama: { tr: "Dünya'da bir kapıyı kapatan ilk insan sensin. Bütün gezegen bu bildirimi aldı.", en: "You're the first human on Earth to close a Gate. The whole planet got the notification." }
  nadirlik: "efsanevi"
  bonus: { str: 2, end: 2, wil: 2 }
  ilk: true
ilk_siniflanan:
  ad: { tr: "İlk Sınıflanan", en: "First to Be Classified" }
  aciklama: { tr: "Sistem'den sınıf alan ilk insan oldun. Kalan sekiz milyar kişi sıraya girdi.", en: "You were the first human the System assigned a class. The other eight billion are in line behind you." }
  nadirlik: "epik"
  bonus: { wis: 1, per: 1, cha: 1 }
  ilk: true
ilk_evrilen:
  ad: { tr: "İlk Evrilen", en: "First to Evolve" }
  aciklama: { tr: "Dünya'da sınıfını evrilten ilk kişi sensin. Sistem seni bir süre yakından izleyecek.", en: "You're the first person on Earth to evolve a class. The System will be keeping a close eye on you." }
  nadirlik: "efsanevi"
  bonus:
    str: 1
    agi: 1
    end: 1
    int: 1
    wil: 1
  ilk: true
ilk_zanaatkar:
  ad: { tr: "İlk Zanaatkâr", en: "First Artisan" }
  aciklama: { tr: "Bir meslekte ilk ürünü üreten insan oldun. Kıyamette bile biri çalışmak zorunda.", en: "You were the first human to craft anything with a Profession. Even in the apocalypse, somebody has to work." }
  nadirlik: "nadir"
  bonus: { int: 1, per: 1 }
  ilk: true
ilk_bekci_deviren:
  ad: { tr: "Bekçi Deviren İlk", en: "First Warden Felled" }
  aciklama: { tr: "Öğretici Katman'ın bekçisini deviren ilk kişi sensin. Ödül sandığı da ilk kez açıldı.", en: "You're the first to bring down the Tutorial Layer's warden. Its reward chest had never been opened before." }
  nadirlik: "epik"
  bonus: { str: 2, end: 1, per: 1 }
  ilk: true
ilk_cekirdek_sahibi:
  ad: { tr: "İlk Çekirdek Sahibi", en: "First Core Holder" }
  aciklama: { tr: "Bir Kasaba Çekirdeği'ni sahiplenen ilk insan sensin. Artık birileri senden kurallar bekliyor.", en: "You're the first human to claim a Town Core. Now people expect you to make the rules." }
  nadirlik: "efsanevi"
  bonus: { cha: 2, wis: 2 }
  ilk: true
ogretici_gazisi:
  ad: { tr: "Öğretici Gazisi", en: "Tutorial Survivor" }
  aciklama: { tr: "Öğretici Katman'dan sağ çıktın. İstatistiksel olarak bu bile bir başarı.", en: "You made it out of the Tutorial Layer alive. Statistically, that counts as an achievement." }
  nadirlik: "siradan"
  bonus: { end: 1 }
disiplinli:
  ad: { tr: "Disiplinli", en: "Disciplined" }
  aciklama: { tr: "Günlük Görev'i yedi gün üst üste tamamladın. Sistem şaşırmadığını iddia ediyor.", en: "You finished the Daily Quest seven days straight. The System claims it isn't surprised." }
  nadirlik: "siradan"
  bonus: { end: 1, wil: 1 }
kirilmaz_rutin:
  ad: { tr: "Kırılmaz Rutin", en: "Unbroken Routine" }
  aciklama: { tr: "Otuz gün, otuz Günlük Görev, sıfır bahane. Sistem ilk kez etkilenmiş görünüyor.", en: "Thirty days, thirty Daily Quests, zero excuses. For once, the System looks impressed." }
  nadirlik: "epik"
  bonus: { str: 1, agi: 1, end: 2, wil: 1 }
yabancilarin_kalkani:
  ad: { tr: "Yabancıların Kalkanı", en: "Shield of Strangers" }
  aciklama: { tr: "Hiç tanımadığın birini kendi canın pahasına korudun. Sistem bunu bir yatırım olarak kaydetti.", en: "You protected a total stranger at your own risk. The System logged it as an investment." }
  nadirlik: "nadir"
  bonus: { end: 1, cha: 1 }
uzanan_el:
  ad: { tr: "Uzanan El", en: "Outstretched Hand" }
  aciklama: { tr: "On yabancının hayatını kurtardın. İnsanlar adını bilmeden önce yüzünü tanıyor.", en: "You've saved ten strangers' lives. People recognize your face before they know your name." }
  nadirlik: "epik"
  bonus: { cha: 2, wis: 1 }
kademe_asan:
  ad: { tr: "Kademe Aşan", en: "Grade Defier" }
  aciklama: { tr: "Senden bir kademe yüksek bir düşmanı yendin. Sistem hesaplarını yeniden kontrol ediyor.", en: "You beat an enemy a full Grade above you. The System is double-checking its math." }
  nadirlik: "epik"
  bonus: { str: 1, agi: 1, wil: 2 }
analizci:
  ad: { tr: "Analizci", en: "Analyst" }
  aciklama: { tr: "Yüz düşmanı vurmadan önce inceledin. Bilgi, en ucuz zırhtır.", en: "You sized up a hundred enemies before swinging. Information is the cheapest armor there is." }
  nadirlik: "nadir"
  bonus: { per: 2 }
ceza_bolgesi_kacagi:
  ad: { tr: "Ceza Bölgesi Kaçağı", en: "Penalty Zone Escapee" }
  aciklama: { tr: "Günlük Görev'i ihmal ettin, Ceza Bölgesi'ne düştün ve bir şekilde çıktın. Bunu bir daha deneme.", en: "You skipped the Daily Quest, got dumped in the Penalty Zone, and somehow crawled out. Don't try that again." }
  nadirlik: "nadir"
  bonus: { end: 1, agi: 1 }
kardes_katili:
  ad: { tr: "Kardeş Katili", en: "Kinslayer" }
  aciklama: { tr: "Bir insanı kendi elinle öldürdün. Bu unvan herkese görünür ve kimse unutmaz.", en: "You killed a human with your own hands. Everyone can see this title, and no one forgets it." }
  nadirlik: "nadir"
  bonus: { str: 2, cha: -3 }
  itibar_tavani: { siginak: -50 }
kurban_eden:
  ad: { tr: "Kurban Eden", en: "The Sacrificer" }
  aciklama: { tr: "Kendi gücün için bir başkasını feda ettin. Bazıları bunu takdirle karşılıyor; bu daha da kötü.", en: "You sacrificed someone else for your own power. Some people admire that. That's worse." }
  nadirlik: "epik"
  bonus: { wil: 2, int: 1, cha: -2 }
  itibar_tavani: { siginak: -30 }
firari:
  ad: { tr: "Firari", en: "Deserter" }
  aciklama: { tr: "Yoldaşlarını tehlikenin ortasında bırakıp kaçtın. Hayatta kaldın; kimse bunu övmüyor.", en: "You ran and left your companions in the thick of it. You survived. Nobody's congratulating you." }
  nadirlik: "siradan"
  bonus: { agi: 1, cha: -2 }
  itibar_tavani: { lonca: -30 }
les_yiyici:
  ad: { tr: "Leş Yiyici", en: "Carrion Picker" }
  aciklama: { tr: "Ölü insanların üzerini aramayı alışkanlık hâline getirdin. Pratik, ama kokusu üstüne siniyor.", en: "You've made a habit of looting dead people. Practical, sure. But the smell sticks to you." }
  nadirlik: "siradan"
  bonus: { per: 1, cha: -1 }
kademe_kiran:
  ad: { tr: "Kademe Kıran", en: "Gap Breaker" }
  aciklama: { tr: "Bir üst kademeden bir varlığı yendin.", en: "You beat something a whole Grade above you." }
  nadirlik: "epik"
  bonus: { str: 2, agi: 2 }
kademe_kiran_2:
  ad: { tr: "Kademe Kıran II", en: "Gap Breaker II" }
  aciklama: { tr: "Üç kez. Artık tesadüf değil.", en: "Three times. It's not luck anymore." }
  nadirlik: "efsanevi"
  bonus: { str: 3, agi: 3, wil: 3 }
kademe_kiran_3:
  ad: { tr: "Kademe Kıran III", en: "Gap Breaker III" }
  aciklama: { tr: "On kez. Kademeler senin için bir öneri.", en: "Ten times. For you, Grades are a suggestion." }
  nadirlik: "mitik"
  bonus: { str: 5, agi: 5, end: 5, wil: 5 }
