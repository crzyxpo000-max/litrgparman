baslangic: "giris_entegrasyon"
sahneler:
  - id: "giris_entegrasyon"
    yer: "kiyikent_iskele"
    paragraflar:
      - { tr: "Akşam vapuru yine gecikmiş. {npc:deniz_arman} iskelenin korkuluğuna yaslanmış, simidinin son parçasını martılarla paylaşıyor.", en: "The evening ferry is running late again. {npc:deniz_arman} leans on the terminal railing, tossing the last of a soft pretzel to the gulls." }
      - { tr: "\"Yarın da gecikirse yüzerek giderim,\" diyor. Gülüyorsun; on yıldır aynı şakayı yapıyor ve on yıldır komik.", en: "\"If it's late again tomorrow, I'm swimming,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. You laugh. Same joke for ten years, and it's still funny." }
      - { tr: "Sonra martılar susuyor. Körfezin üstünde gökyüzü, biri camı tırnağıyla çizmiş gibi incecik bir çizgiyle yarılıyor.", en: "Then the gulls go quiet. Above the sound, the sky splits along a hairline crack, like someone dragged a fingernail across glass." }
      - { tr: "Çizgi açılıyor. İçinden mavi, kusursuz kenarlı bir pencere süzülüp tam gözünün önünde duruyor. İskeledeki herkesin önünde birer tane var.", en: "The crack opens. A blue window with perfectly clean edges drifts out and stops right in front of your eyes. Everyone on the pier has one." }
    bildirimler:
      - tur: "sistem"
        baslik: { tr: "Entegrasyon başlatıldı", en: "Integration initiated" }
        satirlar:
          - { tr: "Dünya, Çok-evren Ağı'na bağlanıyor.", en: "Earth is being connected to the Multiverse Network." }
          - { tr: "Tür: İnsan · Hayatta kalma eşiği: belirlenmedi", en: "Species: Human · Survival threshold: TBD" }
          - { tr: "Öğretici Katman'a aktarım: 10 saniye.", en: "Transfer to the Tutorial Layer in 10 seconds." }
      - tur: "yanki"
        baslik: { tr: "[HATA] Aktarım paketi bozuk", en: "[ERR] Transfer packet corrupted" }
        satirlar:
          - { tr: "Bağ... bağlantı. Bağlantı kuruldu. Bu satırı yalnızca sen görüyorsun.", en: "Con... connection. Connection established. Only you can see this line." }
          - { tr: "Seni buldum.", en: "Found you." }
    secenekler:
      - id: "el_tut"
        etiket: { tr: "{npc:deniz_arman|in} elini sıkıca tut", en: "Grab {npc:deniz_arman|pos} hand and hold on" }
        etkiler:
          - bayrak: "deniz_el_tutuldu"
          - iliski: { deniz_arman: { guven: 10, baglilik: 5 } }
          - hafiza: { npc: "deniz_arman", id: "el_tutuldu", agirlik: 50 }
          - yoldas_katil: "deniz_arman"
          - ahlak: { merhamet: 3 }
        sonraki: "giris_yanki"
      - id: "kalabaliga_kos"
        etiket: { tr: "Kalabalığa koş, yaşlılara ve çocuklara yardım et", en: "Run into the crowd and help the elderly and the kids" }
        etkiler:
          - bayrak: "kalabaliga_yardim"
          - ahlak: { merhamet: 8, insanlik: 5 }
        sonraki: "giris_yanki"
      - id: "pencereyi_oku"
        etiket: { tr: "Kıpırdama. Pencerenin her satırını oku", en: "Don't move. Read every line of the window" }
        etkiler:
          - bayrak: "sistem_okundu"
          - egilim: { menzilli: 2 }
          - stat: { per: 1 }
          - ahlak: { insanlik: -3 }
        sonraki: "giris_yanki"
  - id: "giris_yanki"
    paragraflar:
      - { tr: "Işık seni yutuyor. Bedenin yok, ağırlığın yok; yalnızca milyonlarca insanın aynı anda çektiği bir nefesin sesi var.", en: "The light swallows you. No body, no weight. Just the sound of millions of people drawing the same breath at once." }
      - { tr: "Sonra o ses kopuyor. Senin pencerenin kenarları titriyor, harfler birbirinin üstüne yığılıyor; bir şey çatlaktan içeri sızıyor.", en: "Then that sound cuts out. The edges of your window shudder, the letters pile up on top of each other, and something seeps in through the crack." }
      - { tr: "Herkesin penceresi mavi. Seninki bir an için kırmızıya, sonra hiçbir rengin adı olmayan bir şeye dönüyor.", en: "Everybody else's window is blue. Yours flickers red for a second, then turns a color nothing has a name for." }
    bildirimler:
      - tur: "yanki"
        baslik: { tr: "[H̷ATA] Paket 0x00 · sahipsiz parça", en: "[E̷RR] Packet 0x00 · orphaned fragment" }
        satirlar:
          - { tr: "Senin penceren bozuk. Ben de öyle. Birbirimize uyuyoruz.", en: "Your window's broken. So am I. We fit." }
          - { tr: "Herkes Sistem'i alıyor. Sen beni alıyorsun.", en: "Everyone gets the System. You get me." }
    sezgiler:
      - anlati: true
        kosul: { bayrak: "sistem_okundu" }
        metin: { tr: "Okumayı bırakmadın; bu yüzden gördün: pencerenin en altında, herkesin satırında olmayan tek bir satır var. Bir imza gibi. Yarım kalmış.", en: "You never stopped reading, so you caught it: at the very bottom of the window, one line nobody else has. Like a signature. Unfinished." }
      - anlati: true
        kosul: { bayrak: "deniz_el_tutuldu" }
        metin: { tr: "Elin hâlâ bir elin içinde. Ses bunu fark ediyor: \"Bırakmadın. İlginç.\"", en: "Your hand is still inside someone else's. The voice notices: \"You didn't let go. Interesting.\"" }
      - anlati: true
        kosul: { bayrak: "kalabaliga_yardim" }
        metin: { tr: "Kalabalığın sesleri hâlâ kulağında. Ses onları da duyuyor: \"Başkalarını kurtarmaya koştun. Bunu hatırlayacağım.\"", en: "The crowd's voices are still ringing in your ears. The voice hears them too: \"You ran to save other people. I'll remember that.\"" }
    secenekler:
      - id: "kabul_et"
        etiket: { tr: "\"Tamam. Kimsen, benimlesin.\"", en: "\"Fine. Whatever you are, you're with me.\"" }
        etkiler:
          - bayrak: "yanki_bagi"
          - iliski: { yanki: { guven: 10, baglilik: 10 } }
          - hafiza: { npc: "yanki", id: "kabul_edildi", agirlik: 45 }
          - ahlak: { duzen: -2 }
          - egilim: { karanlik: 1 }
        sonraki: "giris_yanki_bag"
      - id: "sor"
        etiket: { tr: "\"Sen nesin?\"", en: "\"What are you?\"" }
        etkiler:
          - bayrak: "yanki_bagi"
          - iliski: { yanki: { saygi: 10 } }
          - hafiza: { npc: "yanki", id: "ne_oldugu_soruldu", agirlik: 25 }
          - ahlak: { insanlik: 2 }
          - egilim: { buyu: 1 }
        sonraki: "giris_yanki_bag"
      - id: "dir"
        etiket: { tr: "Çatlağı kapatmaya çalış", en: "Try to seal the crack shut" }
        gerekli: { stat: { wil: 6 } }
        etkiler:
          - bayrak: "yanki_bagi"
          - iliski: { yanki: { saygi: 15, guven: -10 } }
          - hafiza: { npc: "yanki", id: "direnildi", agirlik: -20 }
          - stat: { wil: 1 }
          - ahlak: { duzen: 3 }
        sonraki: "giris_yanki_bag"
  - id: "giris_yanki_bag"
    paragraflar:
      - metin: { tr: "\"Tamam,\" diyor ses; sanki gülümsüyormuş gibi. \"Bunu daha önce kimse söylemedi.\"", en: "\"Fine,\" the voice echoes back, like it's smiling. \"Nobody's ever said that before.\"" }
        kosul: { hafiza: { yanki: "kabul_edildi" } }
      - metin: { tr: "\"Bir hata,\" diyor ses. \"Bir yankı. Bir şeyin koparılmış ucu. Şimdilik bu kadar yeter; gerisi pahalı.\"", en: "\"A glitch,\" the voice says. \"An echo. The torn-off end of something. That's enough for now. The rest costs extra.\"" }
        kosul: { hafiza: { yanki: "ne_oldugu_soruldu" } }
      - metin: { tr: "Çatlağı iradenle bastırıyorsun ve bir an için gerçekten kapanıyor. Sonra ses, neredeyse saygıyla, aralıktan yeniden içeri süzülüyor: \"Güçlüsün. İyi. Güçlü olana ihtiyacım var.\"", en: "You lean on the crack with everything you've got, and for one second it actually closes. Then the voice slides back in through the gap, almost respectful: \"You're strong. Good. I need strong.\"" }
        kosul: { hafiza: { yanki: "direnildi" } }
      - { tr: "Pencerende yeni bir satır beliriyor; harfler hâlâ titriyor ama okunuyor. Kimsenin göremeyeceği bir satır.", en: "A new line appears in your window, letters still jittering but readable. A line nobody else will ever see." }
      - { tr: "Işık seni bir yere fırlatıyor. Düşüş uzun sürüyor.", en: "The light flings you somewhere. The fall takes a long time." }
    bildirimler:
      - tur: "yanki"
        nadirlik: "mitik"
        baslik: { tr: "[BAĞ KURULDU · YANKI]", en: "[BOND ESTABLISHED · ECHO]" }
        satirlar:
          - { tr: "Gizli satırlar: açık. Günlük Görev: yalnızca sende. Gerçek veriler: senin gözünde.", en: "Hidden lines: unlocked. Daily Quest: yours alone. True data: for your eyes only." }
          - { tr: "Başkalarına anlatma. Anlamazlar. Bazıları anlar; onlar daha kötü.", en: "Don't tell anyone. They won't understand. A few will, and they're worse." }
    secenekler:
      - id: "dus"
        etiket: { tr: "Bırak, düşsün", en: "Let yourself fall" }
        sonraki: "ogretici_uyanis"
  - id: "ogretici_uyanis"
    yer: "ogretici_orman"
    paragraflar:
      - metin: { tr: "Gözlerini açtığında parmakların hâlâ birinin elini sıkıyor. {npc:deniz_arman} yanında, yosunların üstünde öksürüyor ama sağlam.", en: "When you open your eyes, your fingers are still locked around someone's hand. {npc:deniz_arman} is next to you on the moss, coughing, but in one piece." }
        kosul: { bayrak: "deniz_el_tutuldu" }
      - metin: { tr: "Gözlerini açtığında yalnızsın. {npc:deniz_arman} yok. Sadece sis, çam kokusu ve uzaklardan gelen bir çığlık.", en: "You open your eyes alone. No {npc:deniz_arman}. Just fog, the smell of pine, and a scream somewhere far off." }
        kosul: { bayrak_yok: "deniz_el_tutuldu" }
      - metin: { tr: "Aktarımdan önceki son anını hatırlıyorsun: tekerlekli sandalyedeki yaşlı bir adamın elini tutuyordun. Şimdi o el yok.", en: "You remember your last second before the transfer: you were holding the hand of an old man in a wheelchair. That hand is gone now." }
        kosul: { bayrak: "kalabaliga_yardim" }
      - { tr: "Ağaçlar fazla uzun, gökyüzü fazla mor. Burası Ege değil. Burası hiçbir yer değil.", en: "The trees are too tall, the sky too purple. This isn't the Pacific Northwest. This isn't anywhere." }
    bildirimler:
      - tur: "durum"
        baslik: { tr: "Durum penceresi açıldı", en: "Status window unlocked" }
        satirlar:
          - { tr: "{oyuncu} · Seviye 1 · Sınıfsız · Kademe F", en: "{oyuncu} · Level 1 · Classless · Grade F" }
          - { tr: "Öğretici süresi: 30 gün", en: "Tutorial time remaining: 30 days" }
          - { tr: "İpucu: Statlarını Durum sekmesinde görebilirsin.", en: "Tip: Check the Status tab to see your stats." }
      - tur: "uyari"
        nadirlik: "nadir"
        baslik: { tr: "Gizli satır tespit edildi", en: "Hidden line detected" }
        satirlar:
          - { tr: "Okumaya zaman ayıranlar daha fazlasını görür.", en: "Those who take the time to read see more." }
        kosul: { bayrak: "sistem_okundu" }
      - tur: "gorev"
        baslik: { tr: "Günlük Görev açıldı", en: "Daily Quest unlocked" }
        satirlar:
          - { tr: "Bu pencere yalnızca sana görünür. Başkalarına sorma; bilmiyorlar.", en: "This window is visible to you alone. Don't ask anyone else. They don't know." }
          - { tr: "Ayrıntılar: Daha fazla → Günlük Görev.", en: "Details: More → Daily Quest." }
    secenekler:
      - id: "dinle"
        etiket: { tr: "Gözlerini kapat ve sesleri dinle", en: "Close your eyes and listen" }
        gerekli:
          stat: { per: 6 }
        etkiler:
          - bayrak: "tehlike_sezildi"
          - egilim: { menzilli: 1 }
          - ahlak: { duzen: 2 }
        sonraki: "ilk_canavar"
      - id: "ciglige_kos"
        etiket: { tr: "Çığlığın geldiği yöne koş", en: "Run toward the scream" }
        etkiler:
          - ahlak: { merhamet: 3 }
          - egilim: { yakin_dovus: 1 }
        sonraki: "ilk_canavar"
      - id: "saklan"
        etiket: { tr: "Bir kayanın arkasına çömel ve bekle", en: "Crouch behind a boulder and wait" }
        etkiler:
          - egilim: { gizlilik: 2 }
          - ahlak: { merhamet: -4 }
        sonraki: "ilk_canavar"
    sezgiler:
      - kosul:
          stat: { per: 6 }
        metin: { tr: "Sis doğal değil. Ağaçlar fazla düzgün aralıklarla dizilmiş; biri bu ormanı çizmiş.", en: "This fog isn't natural. The trees are spaced too evenly. Someone drew this forest." }
      - kosul: { bayrak: "yanki_bagi" }
        metin: { tr: "Kafanın içinde bir ses, bozuk bir radyo gibi: \"Herkes aynı pencereyi görüyor. Sen görmüyorsun. Sen benimsin.\"", en: "A voice in your head, like a radio between stations: \"Everyone else sees the same window. You don't. You're mine.\"" }
  - id: "ilk_canavar"
    yer: "ogretici_orman"
    paragraflar:
      - metin: { tr: "Ses önünden değil, sağındaki çalılardan geliyor. Bunu bildiğin için ilk hamle senin olacak.", en: "The sound isn't coming from ahead; it's coming from the brush on your right. Knowing that, you get the first move." }
        kosul: { bayrak: "tehlike_sezildi" }
      - { tr: "Çalılar yarılıyor. Sokak köpeği büyüklüğünde, dişleri paslı demir gibi parlayan bir fare çıkıyor. Arkasında, bir ağaç kökünün dibinde, dizini tutan bir yabancı inliyor.", en: "The brush splits. Out comes a rat the size of a golden retriever, teeth gleaming like rusted rebar. Behind it, at the foot of a tree root, a stranger clutches one knee and groans." }
      - metin: { tr: "{npc:deniz_arman} yanında, eğilip yerden yumruk büyüklüğünde bir taş alıyor. \"Sağdan,\" diye fısıldıyor. \"Ben soldan.\"", en: "{npc:deniz_arman} is right beside you, crouching for a rock the size of a fist. \"You go right,\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. \"I've got left.\"" }
        kosul: { bayrak: "deniz_el_tutuldu" }
    bildirimler:
      - tur: "analiz"
        nadirlik: "siradan"
        baslik: { tr: "Kanal Faresi", en: "Sewer Rat" }
        satirlar:
          - { tr: "Seviye 2 · Sıradan", en: "Level 2 · Common" }
          - { tr: "Zaaf: Gözler", en: "Weak spot: Eyes" }
    secenekler:
      - id: "dovus"
        etiket: { tr: "Kırık bir dalı kap ve saldır", en: "Grab a broken branch and attack" }
        etkiler:
          - egilim: { yakin_dovus: 2 }
          - ahlak: { insanlik: -2 }
          - savas:
              dusmanlar: ["kanal_faresi"]
              ortam: ["karanlik"]
              kazan: "ilk_kan"
              kaybet: "ilk_canavar_yenilgi"
      - id: "yabanciyi_koru"
        etiket: { tr: "Taş fırlat, fareyi yabancıdan uzaklaştır", en: "Throw a rock and draw the rat away from the stranger" }
        etkiler:
          - tohum: { olay: "yabanci_minnet", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "yabanci_korundu" } }
          - bayrak: "yabanci_korundu"
          - xp: 60
          - ahlak: { merhamet: 10 }
          - egilim: { menzilli: 2 }
        sonraki: "ilk_gece"
      - id: "kac"
        etiket: { tr: "Yabancıyı bırak ve koş", en: "Leave the stranger and run" }
        etkiler:
          - tohum: { olay: "yabanci_geri_donus", gecikme: { min: 12, max: 20 }, kosul: { bayrak: "yabanci_birakildi" } }
          - bayrak: "yabanci_birakildi"
          - ahlak: { merhamet: -10 }
          - egilim: { gizlilik: 1 }
        sonraki: "ilk_gece"
    sezgiler:
      - kosul:
          stat: { per: 6 }
        metin: { tr: "Farenin sol arka bacağı sakat. Sağından dolaşırsan dönmekte zorlanır.", en: "The rat's left hind leg is lame. Circle to its right and it'll struggle to turn." }
      - kosul: { bayrak: "yanki_bagi" }
        metin: { tr: "[Kanal Faresi · Görünen Sv. 2 · Gerçek Sv. 3 · Zaaf: sol arka bacak] Başkalarının penceresinde yalnızca \"???\" yazıyor.", en: "[Sewer Rat · Shown Lv. 2 · True Lv. 3 · Weakness: left hind leg] Everyone else's window just says \"???\"." }
  - id: "ilk_canavar_yenilgi"
    yer: "ogretici_orman"
    paragraflar:
      - { tr: "Dişler baldırına gömülüyor ve dünya bir an beyaza kesiyor. Sırtüstü yerdesin; fare göğsünün üstünde, ağzından sıcak, pis bir nefes yüzüne vuruyor.", en: "The teeth sink into your calf and the world goes white for a second. You're flat on your back, the rat on your chest, its breath hot and rank in your face." }
      - metin: { tr: "Bir taş farenin kafasına çarpıyor, sonra bir tane daha. {npc:deniz_arman} bağırarak üstüne atılıyor ve fare cıyaklayarak sise kaçıyor.", en: "A rock cracks off the rat's skull, then another. {npc:deniz_arman} comes in yelling, and the rat squeals and bolts into the fog." }
        kosul: { bayrak: "deniz_el_tutuldu" }
      - metin: { tr: "Bir taş farenin kafasına çarpıyor. Dizini tutan yabancı, yerde sürünerek ikincisini fırlatıyor ve fare cıyaklayarak sise kaçıyor.", en: "A rock cracks off the rat's skull. The stranger with the bad knee drags across the dirt to throw a second one, and the rat squeals and bolts into the fog." }
        kosul: { bayrak_yok: "deniz_el_tutuldu" }
      - { tr: "Hayattasın. Bunu sen kazanmadın. Pencere yalnızca kuru bir satır yazıyor: [Savaş kaybedildi · Ölüm engellendi].", en: "You're alive. You didn't earn it. The window types one dry line: [Fight lost · Death prevented]." }
    sezgiler:
      - kosul: { bayrak: "yanki_bagi" }
        metin: { tr: "ilk dersin bu olsun. herkes seni kurtarmak için orada olmayacak.", en: "let that be lesson one. not everyone will be there to save you." }
    secenekler:
      - id: "kalk"
        etiket: { tr: "Bacağını sar ve kalk", en: "Wrap your leg and get up" }
        etkiler:
          - ahlak: { insanlik: 2 }
          - stat: { wil: 1 }
        sonraki: "ilk_gece"
  - id: "ilk_kan"
    yer: "ogretici_orman"
    paragraflar:
      - { tr: "Fare son bir kez titreyip duruyor. Elindeki dal kan içinde; senin kanın da biraz.", en: "The rat twitches once and goes still. The branch in your hand is soaked. Some of it's yours." }
      - { tr: "Ağacın dibindeki yabancı nefes nefese sana bakıyor; dizi kötü ama yaşıyor.", en: "The stranger at the foot of the tree is staring at you, out of breath. Bad knee, but alive." }
      - { tr: "Gökyüzünde bir pencere daha açılıyor, bu kez herkesin görebileceği büyüklükte.", en: "Another window opens in the sky, big enough for everyone to see." }
    secenekler:
      - id: "pencereyi_kapat"
        etiket: { tr: "Pencereyi kapat ve yabancıya bak", en: "Swipe the window away and check on the stranger" }
        etkiler:
          - bayrak: "ilk_oldurme"
          - bayrak: "yabanci_korundu"
          - tohum: { olay: "yabanci_minnet", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "yabanci_korundu" } }
          - unvan: "ogreticinin_ilk_kani"
          - ahlak: { merhamet: 3 }
        sonraki: "ilk_gece"
      - id: "pencereyi_oku_ilk"
        etiket: { tr: "Pencerenin altındaki küçük satırı oku", en: "Read the fine print under the window" }
        etkiler:
          - bayrak: "ilk_oldurme"
          - unvan: "ogreticinin_ilk_kani"
          - ahlak: { insanlik: -2 }
          - egilim: { menzilli: 1 }
        sonraki: "ilk_gece"
    sezgiler:
      - kosul: { bayrak: "yanki_bagi" }
        metin: { tr: "\"Dünyada ilk. Herkes ismini görecek; ama yalnızca sen neyin peşinde olduğumu göreceksin.\"", en: "\"First in the world. Everyone's going to see your name. Only you get to see what I'm after.\"" }
  - id: "ilk_gece"
    yer: "ogretici_orman"
    paragraflar:
      - metin: { tr: "Ellerin hâlâ titriyor. Ama içinde daha önce hiç olmayan bir şey uyanıyor: açlık gibi, ama yemek için değil.", en: "Your hands are still shaking. But something new is waking up inside you, like hunger, but not for food." }
        kosul: { bayrak: "ilk_oldurme" }
      - metin: { tr: "Fare taşın peşinden sise daldı ve bir daha görünmedi.", en: "The rat chased the rock into the fog and never came back." }
        kosul: { bayrak: "yabanci_korundu", bayrak_yok: "ilk_oldurme" }
      - metin: { tr: "Kurtardığın yabancı adını söyleyemeden uyuyakalıyor. Avucunda, sana bıraktığı bir çakı var.", en: "The stranger you saved falls asleep before they can tell you their name. In your palm is the pocketknife they left you." }
        kosul: { bayrak: "yabanci_korundu" }
      - metin: { tr: "Koşarken arkanda kalan çığlık kesildi. Ne zaman kesildiğini hatırlamıyorsun. Hatırlamak da istemiyorsun.", en: "The scream behind you stopped while you ran. You don't remember when. You don't want to." }
        kosul: { bayrak: "yabanci_birakildi" }
      - metin: { tr: "\"Annemler,\" diyor {npc:deniz_arman} ateşin karşısından ve cümlenin gerisini getirmiyor.", en: "\"My folks,\" {npc:deniz_arman} says from across the fire, and doesn't finish the sentence." }
        kosul: { bayrak: "deniz_el_tutuldu" }
      - { tr: "Mor gökyüzü kararmıyor, sadece soluyor. Öğretici Katman'daki ilk gecen başlıyor.", en: "The purple sky doesn't go dark; it just fades. Your first night in the Tutorial Layer begins." }
    bildirimler: []
    secenekler:
      - id: "uyu"
        etiket: { tr: "Ateşin yanında uyu", en: "Sleep by the fire" }
        etkiler:
          - gun: 1
          - ahlak: { insanlik: 2 }
        sonraki: "ilk_sabah"
      - id: "nobet_tut"
        etiket: { tr: "Uyuma. Sabaha kadar nöbet tut", en: "Don't sleep. Keep watch until morning" }
        etkiler:
          - gun: 1
          - stat: { wil: 1 }
          - egilim: { menzilli: 1 }
          - ahlak: { duzen: 2 }
        sonraki: "ilk_sabah"
    sezgiler:
      - kosul: { bayrak: "yanki_bagi" }
        metin: { tr: "Ateş çıtırdarken ses yine geliyor, bu kez daha net: \"Yarın da buradayım. Her gün. Başkalarına anlatma.\"", en: "The voice comes back while the fire crackles, clearer this time: \"I'll be here tomorrow. Every day. Don't tell the others.\"" }
  - id: "ilk_sabah"
    yer: "ogretici_orman"
    paragraflar:
      - { tr: "Sabah olduğunda Sistem yeni bir pencere açıyor: Öğretici Katman'da 29 gün kaldı.", en: "When morning comes, the System opens a new window: 29 days left in the Tutorial Layer." }
      - { tr: "Çıkış Kapısı'na giden yol uzun. Her gün birkaç saatin var; nasıl harcayacağına sen karar vereceksin.", en: "The road to the Exit Gate is long. Every day you get a few hours, and how you spend them is up to you." }
    bildirimler:
      - tur: "uyari"
        baslik: { tr: "Bir tohum ekildi", en: "A seed has been planted" }
        satirlar:
          - { tr: "Geride bıraktığın biri seni hatırlayacak.", en: "Someone you left behind will remember you." }
        kosul: { bayrak: "yabanci_birakildi" }
      - tur: "uyari"
        baslik: { tr: "Bir tohum ekildi", en: "A seed has been planted" }
        satirlar:
          - { tr: "Kurtardığın biri bu iyiliği unutmayacak.", en: "Someone you saved won't forget it." }
        kosul: { bayrak: "yabanci_korundu" }
    secenekler:
      - id: "gune_basla"
        etiket: { tr: "Güne başla", en: "Start the day" }
        etkiler:
          - gorev: { ogretici_cikis: "basla" }
          # Perde 1 dünya durumu: Öğretici'den sağ çıkacakların oranı (docs/PERDE1.md).
          - degisken: { hayatta_kalan: 50 }
        sonraki: "@akis"
