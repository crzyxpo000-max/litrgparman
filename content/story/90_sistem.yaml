sahneler:
  - id: "ceza_bolgesi"
    yer: "ceza_bolgesi"
    paragraflar:
      - { tr: "Göz açıp kapayıncaya kadar kendi sokağındasın; ama gece olmuş, sokak ıssız ve donmuş. Bütün saatler Günlük Görevi bıraktığın dakikada durmuş.", en: "One blink and you're standing on your own street, except it's night, empty, and frozen. Every clock stopped at the minute you skipped your Daily Quest." }
      - { tr: "Pencerelerde komşularının yüzleri beliriyor ama gülümsemeleri olması gerekenden geniş. Kapılar birer birer açılıyor.", en: "Your neighbors' faces are in the windows, but their smiles are too wide. The doors start opening, one by one." }
    bildirimler:
      - tur: "uyari"
        baslik: { tr: "Durmuş Saat", en: "The Stopped Hour" }
        satirlar:
          - { tr: "Günlük Görev ihmal edildi. Saatler yeniden çalışana kadar dayan.", en: "Daily Quest neglected. Hold out until the clocks start again." }
          - { tr: "Disiplin isteğe bağlı değildir.", en: "Discipline is not optional." }
    secenekler:
      - id: "dayan"
        etiket: { tr: "Sırtını bir duvara verip dayan", en: "Put your back to a wall and hold the line" }
        etkiler:
          - can: -30
          - stat: { end: 1 }
          - egilim: { koruma: 1 }
          - xp: 20
          - ahlak: { duzen: 2 }
        sonraki: "@geri"
      - id: "saldir"
        etiket: { tr: "Kapıdan ilk çıkana vur", en: "Hit the first thing out the door" }
        etkiler:
          - can: -45
          - stat: { str: 1 }
          - egilim: { yakin_dovus: 1 }
          - xp: 35
          - ahlak: { merhamet: -2 }
        sonraki: "@geri"
      - id: "izle"
        etiket: { tr: "Kıpırdama, saatleri izle", en: "Stay still and watch the clocks" }
        gerekli:
          stat: { per: 8 }
        etkiler:
          - can: -15
          - stat: { per: 1 }
          - egilim: { gizlilik: 1 }
          - xp: 25
          - ahlak: { insanlik: -2 }
        sonraki: "@geri"
  - id: "son_hasat"
    yer: "hasat"
    son: true
    paragraflar:
      - { tr: "Işık söndüğünde Sistem son bir pencere açıyor; bu kez yalnızca senin için değil, herkes için.", en: "When the light goes out, the System opens one last window. Not just for you this time. For everyone." }
      # Düştüğün perde
      - metin: { tr: "Sisli ormanda bir pencere kararıyor. Uyanan binlerce insandan hiçbiri neyin yitip gittiğini bilmiyor; bir tek Sistem biliyor ve bunu bir anlığına, yalnızca bir anlığına not ediyor.", en: "Somewhere in the fog, one window goes dark. None of the thousands who woke up know what was just lost. Only the System knows, and for a moment, just a moment, it takes note." }
        kosul: { perde: 1 }
      - metin: { tr: "Haber akşamüstü {yer:kiyikent} sokaklarına ulaşıyor. Kule'nin dibinde biri Küresel Sıralama'da adını arayıp bulamıyor. O gün listeden düşen tek isim seninki değil ama en çok ses getiren o.", en: "The news hits the streets of {yer:kiyikent} by late afternoon. At the foot of the Spire, someone scrolls the Global Ranking for your name and can't find it. Yours isn't the only name that drops off the list that day, but it's the one that makes the most noise." }
        kosul: { perde: 2 }
      - metin: { tr: "Haber çok-evrenin geçitlerini bile aşıyor: Dünya'nın anomalisi düştü. Bir Kadim gemisinde biri rapor yazıp siliyor, sonra yeniden yazıyor, bu kez kısacık: beklendiği gibi.", en: "The news makes it through the multiverse passages: Earth's anomaly is down. On an Ancient ship, someone writes a report, deletes it, then writes it again in a single word: as expected." }
        kosul: { perde: 3 }
      - metin: { tr: "Hasat'ın son haftalarında düşüyorsun. Körfezin üstündeki filo beklemeyi sürdürüyor ama neyi beklediğinden artık emin değil; beklediği tek şey sendin.", en: "You fall in the last weeks before the Harvest. The fleet over the bay keeps waiting, though it's no longer sure what for. You were the only thing it was waiting on." }
        kosul: { perde: 4, bayrak_yok: "kadimler_yenildi" }
      - metin: { tr: "Hasat'ın son haftalarında düşüyorsun. Yendiğin filonun enkazı körfezin dibinde paslanıyor. Bu kez seni bekleyen bir gemi yok, gökyüzündeki sayaçtan başka. O da beklemiyor zaten; sayıp duruyor.", en: "You fall in the last weeks before the Harvest. The wreck of the fleet you beat is rusting at the bottom of the bay. No ship is waiting on you this time, only the counter in the sky. And it isn't waiting. It's just counting." }
        kosul: { perde: 4, bayrak: "kadimler_yenildi" }
      # Yanındakiler
      - metin: { tr: "{npc:deniz_arman|in} sesi çok uzaklardan geliyor; adını bir kez söylüyor, sonra bir kez daha. Cevap vermek istiyorsun ama pencere izin vermiyor.", en: "You hear {npc:deniz_arman|pos} voice from very far away, saying your name once, then once more. You want to answer. The window won't let you." }
        kosul: { yoldas: "deniz_arman" }
      - metin: { tr: "{npc:yanki} karanlığa son satırını yazıyor: haddini aştın. aşacağını biliyordum. yine de seninle gurur duydum. bunu kimseye söyleme.", en: "{npc:yanki} writes its last line into the dark: you overreached. i knew you would. i was proud of you anyway. don't tell anyone." }
        kosul: { bayrak: "yanki_bagi", dikkat_min: 70 }
      - metin: { tr: "{npc:yanki} karanlığa son satırını yazıyor: yetmedi. bazen yetmez. elinden geleni yaptın, gördüm. yine de seninle gurur duydum. bunu kimseye söyleme.", en: "{npc:yanki} writes its last line into the dark: it wasn't enough. sometimes it isn't. you gave it everything, i saw. i was proud of you anyway. don't tell anyone." }
        kosul: { bayrak: "yanki_bagi", dikkat_max: 69 }
      - { tr: "Pencerede kupkuru tek bir satır kalıyor: [Anomali kayboldu. Tür: İnsan. Değerlendirme: yetersiz.] Gün 365 geldiğinde Dünya'nın önünde duracak kimse olmayacak; Hasat da her zaman olduğu gibi tam vaktinde başlayacak.", en: "One dry line is left in the window: [Anomaly lost. Species: Human. Assessment: insufficient.] When Day 365 comes, there will be no one standing in front of Earth, and the Harvest will start on time, the way it always does." }
    bildirimler:
      - tur: "uyari"
        kosul: { dikkat_min: 70 }
        baslik: { tr: "[SON: Hasat]", en: "[ENDING: The Harvest]" }
        satirlar:
          - { tr: "Demir Mod: ölüm kalıcıdır.", en: "Ironman Mode: death is permanent." }
          - { tr: "Haddini aşmak bir seçimdir. Bu da onun sonucu.", en: "Overreaching is a choice. This is what it costs." }
      - tur: "uyari"
        kosul: { dikkat_max: 69 }
        baslik: { tr: "[SON: Hasat]", en: "[ENDING: The Harvest]" }
        satirlar:
          - { tr: "Demir Mod: ölüm kalıcıdır.", en: "Ironman Mode: death is permanent." }
          - { tr: "Hayatta kalma eşiği karşılanmadı. Kayıt kapatıldı.", en: "Survival threshold not met. Record closed." }
