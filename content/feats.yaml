basarilar:
  tek_basina_suru:
    ad: { tr: "Sürüyü tek başına biçen", en: "The one who mowed down a whole pack alone" }
    tepkiler: { siginak: -3, lonca: 8 }
    satirlar:
      siginak: { tr: "Sığınak'ta fısıldaşıyorlar: bu kadar güç bir gün kime dönecek?", en: "At the Haven they whisper: who does that kind of power turn on someday?" }
      lonca: { tr: "Demir Lonca'nın kapıları sana biraz daha açık.", en: "The Iron Guild's door just opened a little wider for you." }
    unvan: { esik: 3, id: "ogretici_gazisi" }
  canavari_bagisladi:
    ad: { tr: "Canavarı bağışlayan", en: "The one who spared the monster" }
    tepkiler: { siginak: 6, lonca: -4, yukselenler: -3 }
    satirlar:
      siginak: { tr: "Sığınak bunu bir umut işareti sayıyor.", en: "The Haven takes it as a sign of hope." }
      lonca: { tr: "Lonca'da bunu zayıflık diye anlatıyorlar.", en: "The Guild tells it as a story about weakness." }
  yabancilari_iyilestirdi:
    ad: { tr: "Yabancıları iyileştiren", en: "The one who patched up strangers" }
    tepkiler: { siginak: 8, sessiz_ag: 2 }
    satirlar:
      siginak: { tr: "Sığınak'ta adın saygıyla anılıyor.", en: "Your name gets said with respect at the Haven." }
    unvan: { esik: 3, id: "uzanan_el" }
  acimasiz_infaz_tanikli:
    ad: { tr: "Herkesin önünde infaz eden", en: "The one who executed it in front of everyone" }
    tepkiler: { siginak: -8, lonca: 4, yukselenler: 6 }
    satirlar:
      siginak: { tr: "Sığınak'tan bir anne çocuğunu senden uzağa çekiyor.", en: "A mother at the Haven pulls her kid away from you." }
      yukselenler: { tr: "Yükselenler senin adını dua gibi tekrarlıyor.", en: "The Ascended repeat your name like a prayer." }
  kapiyi_yalniz_kapatti:
    ad: { tr: "Kapıyı tek başına kapatan", en: "The one who closed a Gate solo" }
    tepkiler: { lonca: 6, sessiz_ag: 4 }
    satirlar:
      lonca: { tr: "Lonca'nın panosunda adının yanına bir yıldız eklendi.", en: "Someone added a star next to your name on the Guild board." }
      sessiz_ag: { tr: "Sessiz Ağ'dan biri kapının kapandığı dakikayı not ediyor.", en: "Someone from the Quiet Network logs the exact minute the Gate shut." }
