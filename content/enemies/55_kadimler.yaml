# Parti E — Kadimler'in askerleri, muhafızları, av hayvanları, çıkarma tekneleri, Meclis'in Budayıcı'sı ve Elçi Thessar'ın savaş biçimi.
# Kadimler (kendi dillerinde Ithren, "hâlâ sayanlar"): bin dünya görmüş, hasatla güçlenmiş yaşlı bir çok-evren ırkı.
# Bedenleri fazla uzun, eklemleri yanlış yerden bükülür, gölgeleri güneşe doğru düşer; derileri hasat ettikleri dünyaların çentikleriyle
# bir hesap defteri gibi çizilidir. Zırhları cilalanıp sertleştirilmiş defter yapraklarıdır.
# Tasarım seviyesi 38–50 (Parti L1 ile aynı bant); içerikte `@oyuncu+N` (hikaye savaşı/boss) ya da `@dunya` (istila dalgası) ile ölçekle.
# Parti K1 istilada kullanır: kadim_defter_askeri, kadim_orakci, kadim_muhafiz, kadim_okuyucu, kadim_sayim_tazisi, kadim_kanca_teknesi;
# bosslar: kadim_budayici (Meclis'in Budayıcı'sı), thessar_elci (Elçi Thessar'ın savaş biçimi; "npc:thessar" yerine son boss).
dusmanlar:
  kadim_defter_askeri:
    ad: { tr: "Defter Askeri", en: "Ledger Soldier" }
    aciklama: { tr: "Kadimler'in sıradan piyadesi. Neredeyse üç metre boyunda, dizleri hafifçe geriye bükülen bir gövde; zırhı, cilalanıp seramik sertliğine getirilmiş defter yapraklarından. Kılıcı kâğıt kadar incedir, açtığı her yara bir çentik kadar düzgün.", en: "The Ancients' rank-and-file infantry. Nearly ten feet of body with knees that bend slightly backward, armored in ledger pages lacquered hard as ceramic. Its blade is thin as a sheet of paper, and every wound it leaves is as neat as a tally mark." }
    kanca: { tr: "Defter Askeri kılıcını kaldırıyor; zırhının yaprakları kitap sayfaları gibi hışırdayarak açılıyor. Her yaprakta bir sütun isim var, bazılarının üstü çizilmiş.", en: "The Ledger Soldier raises its blade, and the pages of its armor riffle open like a book. Every page holds a column of names. Some are crossed out." }
    seviye: 40
    can: 760
    statlar:
      str: 55
      agi: 44
      end: 52
      int: 30
      wis: 30
      per: 46
      wil: 48
      cha: 12
    davranis: "agresif"
    zeki: true
    zaaf: "ates"
    zaaf_metin: { tr: "Zırhı ne kadar cilalı olsa da sonuçta kâğıttır. Ateş yaprakları kıvırır; kıvrılan her yaprağın altında çıplak, gri bir deri kalır.", en: "However hard the lacquer, the armor is still paper. Fire curls the pages, and under every curled page there's bare gray skin." }
    saldirilar:
      - id: "sayim_kesigi"
        ad: { tr: "Sayım Kesiği", en: "Tally Cut" }
        stat: "str"
        taban: 24
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kâğıt inceliğindeki kılıcını üstünden çekiyor; açılan yara cetvelle çizilmiş gibi düz.", en: "{dusman} draws its paper-thin blade across you. The cut it leaves is straight as a ruled line." }
      - id: "kayit_darbesi"
        ad: { tr: "Kayıt Darbesi", en: "Entry Strike" }
        stat: "wil"
        taban: 26
        kat: 0.85
        etiketler: ["zihin", "yakin"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} kabzayı göğsüne indiriyor ve bir an Durum pencerende adının yanında yabancı bir sütun beliriyor: [Kaydedildi].", en: "{dusman} drives the pommel into your chest, and for a second a foreign column opens next to your name in your Status window: [Entered]." }
    xp: 7600
    ganimet: { defter_yapragi: 0.6, vel_damlasi: 0.15 }
    etiketler: ["kadim", "asker", "insansi"]
    boss: false

  kadim_orakci:
    ad: { tr: "Hasat Orakçısı", en: "Harvest Sickle" }
    aciklama: { tr: "Kadim saflarının kanat avcısı. Kolları dirseğin ötesinde bir eklem daha bükülür, her birinin ucunda hilal biçimli bir bıçak vardır. Hasat edilen dünyalarda kaçanları toplamak için yetiştirilmiştir.", en: "The flankers of the Ancient line. Its arms bend at one more joint past the elbow, and each one ends in a crescent blade. Bred to round up whatever runs on a world being harvested." }
    kanca: { tr: "Göz ucunda bir hilal bir kez parlıyor. Hasat Orakçısı yere değmeden yanına geçmiş bile; kollarını iki orak gibi açıyor.", en: "A crescent flashes once at the edge of your vision. The Harvest Sickle is already at your flank without touching the ground, arms spreading like a pair of scythes." }
    seviye: 42
    can: 700
    statlar:
      str: 50
      agi: 64
      end: 40
      int: 28
      wis: 30
      per: 58
      wil: 40
      cha: 10
    davranis: "agresif"
    zeki: false
    zaaf: "delici"
    zaaf_metin: { tr: "Hızlı olsun diye hafif yapılmıştır. Kabuğu, orakların kola bağlandığı yerde incecik; oraya saplanan bir uç kolu menteşe gibi kilitler.", en: "Built light so it can be fast. The shell where the sickles meet the arm is thin as a fingernail, and a point driven in there locks the joint like a jammed hinge." }
    saldirilar:
      - id: "hilal_bicisi"
        ad: { tr: "Hilal Biçişi", en: "Crescent Reap" }
        stat: "agi"
        taban: 26
        kat: 0.85
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.45, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} iki orağını birden, tarla biçer gibi alçaktan savuruyor.", en: "{dusman} swings both sickles low and wide, like it's cutting a field." }
      - id: "hasat_donusu"
        ad: { tr: "Hasat Dönüşü", en: "Harvest Turn" }
        stat: "str"
        taban: 32
        kat: 0.9
        etiketler: ["fiziksel", "alan"]
        bekleme: 2
        metin: { tr: "{dusman} kendi çevresinde bir kez dönüyor; oraklar, etrafındaki her şeyi aynı yükseklikten kesen bir çember çiziyor.", en: "{dusman} spins once, and the sickles draw a circle that cuts everything around it at exactly the same height." }
    xp: 8400
    ganimet: { defter_yapragi: 0.4 }
    etiketler: ["kadim", "asker", "hizli"]
    boss: false

  kadim_muhafiz:
    ad: { tr: "Elçilik Muhafızı", en: "Embassy Warden" }
    aciklama: { tr: "Elçileri korumak için değil, gözetlemek için yanlarına verilen ağır zırhlı Kadim. Kalkanı mühürlü bir defterin kapağıdır; içini yalnızca Meclis açabilir.", en: "A heavily armored Ancient assigned to an envoy, not to protect him but to watch him. Its shield is the cover of a sealed ledger, and only the Conclave can open it." }
    kanca: { tr: "Elçilik Muhafızı kalkanını yere dikiyor. Mühürlü kapağın altında taş çatırdıyor; muhafız sana değil, arkandaki bir şeye bakıyor gibi.", en: "The Embassy Warden plants its shield. The stone cracks under the sealed cover, and the Warden seems to be looking not at you, but at something behind you." }
    seviye: 44
    can: 1100
    statlar:
      str: 60
      agi: 32
      end: 72
      int: 30
      wis: 40
      per: 40
      wil: 58
      cha: 14
    davranis: "temkinli"
    zeki: true
    zaaf: "simsek"
    zaaf_metin: { tr: "Kalkanın kapağını kapalı tutan mühür hem metal hem canlıdır; şimşek mühürde düğümlenir ve kalkanı bir anlığına kendiliğinden açtırır.", en: "The seal holding the shield shut is metal, and it's alive. Lightning knots up in it and pops the cover open for a heartbeat." }
    saldirilar:
      - id: "muhur_darbesi"
        ad: { tr: "Mühür Darbesi", en: "Seal Bash" }
        stat: "str"
        taban: 26
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} mühürlü kalkanı bir kapı gibi üstüne kapatıyor.", en: "{dusman} slams the sealed shield into you like a door shutting." }
      - id: "elcilik_karari"
        ad: { tr: "Elçilik Kararı", en: "Embassy Ruling" }
        stat: "wil"
        taban: 30
        kat: 0.85
        etiketler: ["zihin", "alan"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} kalkanın kapağına bir kez vuruyor. Ses kulaklarına değil kemiklerine ulaşıyor; kemiklerin onu bir hüküm gibi dinliyor.", en: "{dusman} raps once on the shield's cover. The sound doesn't reach your ears. It reaches your bones, and your bones hear it as a verdict." }
    xp: 10000
    ganimet: { defter_yapragi: 0.7 }
    etiketler: ["kadim", "muhafiz", "elit"]
    boss: false

  kadim_okuyucu:
    ad: { tr: "Okuyucu", en: "Reader" }
    aciklama: { tr: "Yüzü olmayan, yalnızca dikey bir yarığı bulunan ince bir Kadim. Seni okur: statlarını, seviyeni, yalan söyleyip söylemediğini. Okuduğu satırlar senin pencerende griye döner.", en: "A thin Ancient with no face, only a single vertical slit. It reads you: your stats, your level, whether you're lying. Whatever it reads goes gray in your own window." }
    kanca: { tr: "Okuyucu'nun yarığı açılıyor. Durum pencerendeki satırlar birer birer griye dönüyor; biri onları senden önce okuyor.", en: "The Reader's slit opens. The lines in your Status window go gray one by one. Somebody's reading them before you do." }
    seviye: 45
    can: 640
    statlar:
      str: 20
      agi: 46
      end: 34
      int: 66
      wis: 62
      per: 70
      wil: 60
      cha: 20
    davranis: "temkinli"
    zeki: true
    zaaf: "karanlik"
    zaaf_metin: { tr: "Yalnızca okunabileni görür. Karanlık, yani okunmayan her satır, onun için duvar değil uçurumdur; içine düşer.", en: "It only sees what can be read. To a Reader, darkness, any line that won't read, isn't a wall. It's a cliff, and it falls in." }
    saldirilar:
      - id: "okuma"
        ad: { tr: "Okuma", en: "The Reading" }
        stat: "int"
        taban: 28
        kat: 0.85
        etiketler: ["zihin", "menzilli"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} seni okuyor. Pencerendeki satırlar griye dönerken gözlerin de onlarla birlikte kararıyor.", en: "{dusman} reads you. As the lines in your window go gray, your eyes go dark right along with them." }
      - id: "satir_silme"
        ad: { tr: "Satır Silme", en: "Line Deletion" }
        stat: "wil"
        taban: 34
        kat: 0.9
        etiketler: ["zihin", "menzilli"]
        durum: { etki: "korku", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} yarığını kısıyor ve Durum pencerenden bir satır kayboluyor. Hangisi olduğunu hatırlayamıyorsun; yalnızca eksik olduğunu biliyorsun.", en: "{dusman} narrows its slit, and a line disappears from your Status window. You can't remember which one. You just know it's gone." }
    xp: 10000
    ganimet: { okuyucu_mercegi: 0.4, sayim_murekkebi: 0.3 }
    etiketler: ["kadim", "okuyucu", "elit"]
    boss: false

  kadim_sayim_tazisi:
    ad: { tr: "Sayım Tazısı", en: "Tally Hound" }
    aciklama: { tr: "Hasat edilmiş bir dünyanın av hayvanlarından yetiştirilmiş, gözsüz, uzun bacaklı bir köpek. Kalp atışlarını sayar; sürü, saydığı sayı tamamlanana dek durmaz.", en: "An eyeless, long-legged hound bred from the game animals of some harvested world. It counts heartbeats, and the pack doesn't stop until the count comes out right." }
    kanca: { tr: "Sayım Tazıları sessizce yayılıyor. Başlarını eğmiş dinliyorlar; senin kalp atışlarını sayıyorlar.", en: "The Tally Hounds fan out without a sound, heads low, listening. They're counting your heartbeat." }
    seviye: 38
    can: 560
    statlar:
      str: 50
      agi: 58
      end: 40
      int: 10
      wis: 20
      per: 60
      wil: 30
      cha: 4
    davranis: "suru"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Kalp sayarak avlanır. Ani, sağır edici bir ses sayımı bozar; sürü baştan saymak zorunda kalır.", en: "It hunts by counting hearts. A sudden, deafening noise wrecks the count, and the pack has to start over." }
    saldirilar:
      - id: "nabiz_isirigi"
        ad: { tr: "Nabız Isırığı", en: "Pulse Bite" }
        stat: "str"
        taban: 22
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} dişlerini tam nabzının attığı yere geçiriyor.", en: "{dusman} sinks its teeth right where your pulse is." }
      - id: "sayim_ulumasi"
        ad: { tr: "Sayım Uluması", en: "Counting Howl" }
        stat: "wil"
        taban: 20
        kat: 0.8
        etiketler: ["ses", "alan"]
        durum: { etki: "korku", sans: 0.3, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} başını kaldırıp uluyor; uluma bir sayıya dönüşüyor. Kalbin istemeden o sayıya ayak uyduruyor.", en: "{dusman} throws its head back and howls, and the howl becomes a count. Without meaning to, your heart starts keeping time with it." }
    xp: 6000
    ganimet: { defter_yapragi: 0.2 }
    etiketler: ["kadim", "hayvan", "suru"]
    boss: false

  kadim_kanca_teknesi:
    ad: { tr: "Kanca Teknesi", en: "Hook Skiff" }
    aciklama: { tr: "Kadim gemilerinden kopup yere inen, yarı makine yarı canlı bir çıkarma teknesi. Altından zincirli kancalar sarkar; kıyıya tutunur, karnını açıp askerlerini boşaltır.", en: "A landing craft that breaks off the Ancient ships and drops to the ground, half machine and half alive. Chained hooks hang from its belly. It grabs the shore, opens up, and empties its soldiers out." }
    kanca: { tr: "Gökyüzünden bir gölge iniyor. Kanca Teknesi'nin zincirleri rıhtıma saplanıyor, teknenin karnı bir ağız gibi açılmaya başlıyor.", en: "A shadow drops out of the sky. The Hook Skiff's chains bite into the pier, and its belly starts to open like a mouth." }
    seviye: 46
    can: 1300
    statlar:
      str: 64
      agi: 30
      end: 70
      int: 20
      wis: 20
      per: 50
      wil: 40
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Havada asılı kalabilmek için bütün gövdesiyle denge kurar. Sert bir rüzgâr onu yana yatırır; yatan tekne kancalarını bırakmak zorunda kalır.", en: "It hangs in the air by balancing its whole body. A hard wind tips it sideways, and a tipped skiff has to let go of its hooks." }
    saldirilar:
      - id: "kanca_zinciri"
        ad: { tr: "Kanca Zinciri", en: "Hook Chain" }
        stat: "str"
        taban: 28
        kat: 0.85
        etiketler: ["fiziksel", "menzilli"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} zincirli bir kancayı üstüne savuruyor; kanca omzuna geçip seni yerden kaldırıyor.", en: "{dusman} whips a chained hook at you. It bites into your shoulder and yanks you off your feet." }
      - id: "boluk_bosaltma"
        ad: { tr: "Bölük Boşaltma", en: "Squad Drop" }
        stat: "str"
        taban: 30
        kat: 0.9
        etiketler: ["fiziksel", "alan"]
        bekleme: 3
        metin: { tr: "{dusman} karnını açıyor; içinden Defter Askerleri yağıyor, inerken kılıçları çoktan çekilmiş.", en: "{dusman} opens its belly, and Ledger Soldiers rain out of it, blades already drawn on the way down." }
    xp: 11000
    ganimet: { defter_yapragi: 1.0, canli_bakir: 0.5 }
    etiketler: ["kadim", "mekanik", "elit"]
    boss: false

  kadim_budayici:
    ad: { tr: "Budayıcı", en: "The Pruner" }
    aciklama: { tr: "Meclis'in sapmaları budamak için gönderdiği Kadim; elçilerden bile eski. Derisindeki çentikler dünyaları değil, budadığı kişileri sayar. Hiç kırpmadığı tek bir gözü vardır: budadığı şeyi görmek zorundadır.", en: "The Ancient the Conclave sends to prune deviations. Older than any envoy. The notches on its skin aren't worlds; they're the people it has pruned. It has one eye it never closes, because it has to see what it cuts." }
    kanca: { tr: "Hava bir makasın iki ağzı gibi kapanıyor. Budayıcı oradaydı; hep oradaydı. Tek gözü açık, sana bakıyor ve seni fazladan bir dal gibi tartıyor.", en: "The air closes like the two blades of a pair of shears. The Pruner was there. It was always there. Its one eye is open, and it's weighing you like an extra branch." }
    seviye: 50
    can: 2400
    statlar:
      str: 80
      agi: 70
      end: 78
      int: 60
      wis: 55
      per: 72
      wil: 85
      cha: 20
    davranis: "agresif"
    zeki: true
    zaaf: "goz"
    zaaf_metin: { tr: "Budadığı şeyi görmek zorunda olduğundan tek gözünü asla kapatmaz. O gözü kör etmek, Budayıcı'yı dalı nereden keseceğini bilemeyen yaşlı bir bahçıvana çevirir.", en: "It has to see what it prunes, so it never closes that one eye. Blind it, and the Pruner becomes an old gardener who doesn't know where to cut." }
    saldirilar:
      - id: "budama"
        ad: { tr: "Budama", en: "The Cut" }
        stat: "str"
        taban: 34
        kat: 0.85
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.45, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} makas kollarını bir kez kapatıyor. Kesik, dalın gövdeden ayrıldığı yer kadar temiz.", en: "{dusman} snaps its shear-arms shut once. The cut is clean, like where a branch comes off the trunk." }
      - id: "fazla_dal"
        ad: { tr: "Fazla Dal", en: "Surplus Growth" }
        stat: "wil"
        taban: 36
        kat: 0.9
        etiketler: ["zihin", "menzilli"]
        durum: { etki: "korku", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gözünü sana dikiyor; bir an kendini onun gördüğü gibi görüyorsun: ağaca ait olmayan, kesilmesi gereken bir şey.", en: "{dusman} fixes its eye on you, and for a second you see yourself the way it does: something that doesn't belong on the tree. Something that needs cutting." }
    xp: 30000
    ganimet: { budayici_gozu: 1.0, defter_yapragi: 1.0, vel_damlasi: 1.0 }
    etiketler: ["kadim", "boss", "meclis"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Budayıcı geri çekiliyor; derisindeki çentiklerden biri kendiliğinden kazınıyor. Senin adına açılmış yeni bir çentik. Henüz dolmamış.", en: "The Pruner steps back, and one of the notches on its skin carves itself fresh. A new mark, opened in your name. Not filled in yet." }
        guclenme: { str: 6, per: 6 }
        saldiri:
          id: "centik_acma"
          ad: { tr: "Çentik Açma", en: "Opening the Mark" }
          stat: "per"
          taban: 38
          kat: 0.85
          etiketler: ["fiziksel", "kritik"]
          durum: { etki: "kanama", sans: 0.6, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} senin çentiğini kazırken aynı çizgiyi senin derinde de açıyor.", en: "{dusman} carves your mark into its skin, and the same line opens in yours." }
      - esik: 40
        metin: { tr: "Makas kolları ikiye ayrılıyor: dört ağız, dört yön. Budayıcı artık seni değil, çevrendeki her şeyi budayarak sana ulaşıyor.", en: "Its shear-arms split in two. Four blades, four directions. The Pruner isn't cutting at you anymore; it's cutting everything around you to get to you." }
        guclenme: { agi: 8, str: 4 }
        saldiri:
          id: "dort_agiz"
          ad: { tr: "Dört Ağız", en: "Four Blades" }
          stat: "agi"
          taban: 40
          kat: 0.9
          etiketler: ["fiziksel", "alan"]
          bekleme: 2
          metin: { tr: "{dusman} dört makasını birden kapatıyor; aralarındaki havada kalan her şey parça parça yere dökülüyor.", en: "{dusman} snaps all four blades at once, and everything caught in the air between them falls to the ground in pieces." }
      - esik: 15
        metin: { tr: "Tek göz kanlanıyor ama kapanmıyor. Budayıcı ilk kez konuşuyor, kuru ve yorgun: \"Meclis bir dal için iki budayıcı göndermez. Gönderecek.\"", en: "The single eye floods red, but it doesn't close. The Pruner speaks for the first time, dry and tired: \"The Conclave never sends two pruners for one branch. It will now.\"" }
        guclenme: { str: 6, end: 6, wil: 6 }
        saldiri:
          id: "son_budama"
          ad: { tr: "Kökten Budama", en: "Cut to the Root" }
          stat: "wil"
          taban: 44
          kat: 0.95
          etiketler: ["zihin", "karanlik"]
          durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
          bekleme: 3
          metin: { tr: "{dusman} makaslarını yere saplıyor. Seni ayakta tutan şey her neyse kökünden kesiliyor; bir an duramıyorsun.", en: "{dusman} drives its shears into the ground. Whatever holds you up, its root gets cut, and for a moment you can't stand." }

  thessar_elci:
    ad: { tr: "Defterin Eli", en: "Hand of the Ledger" }
    aciklama: { tr: "Elçi, elçiliği bıraktığında. Kalemini kılıç gibi tutar, derisindeki otuz dokuz dünya zırh gibi parlar. Savaşmaz; seni kaydeder, sonra kaydı kapatır.", en: "The Envoy, once he stops being an envoy. He holds his stylus like a sword, and the thirty-nine worlds on his skin shine like armor. He doesn't fight you. He enters you into the record, and then he closes the entry." }
    kanca: { tr: "Elçi zincirli kalemini havaya kaldırıyor. Aranızdaki boşluk sayfa gibi düzleşiyor ve o sayfanın en tepesine senin adın yazılıyor.", en: "The Envoy lifts his chained stylus. The space between you flattens out like a page, and at the very top of that page, your name gets written." }
    seviye: 50
    can: 2600
    statlar:
      str: 50
      agi: 64
      end: 70
      int: 88
      wis: 84
      per: 76
      wil: 98
      cha: 66
    davranis: "temkinli"
    zeki: true
    zaaf: "karanlik"
    zaaf_metin: { tr: "Bütün gücü okumaya dayanır: okuyamadığını kaydedemez, kaydedemediğini silemez. Senin içindeki okunmayan karanlık onun defterinde bir mürekkep lekesidir; leke büyüdükçe sen elinden kayarsın.", en: "Everything he has runs on reading. What he can't read, he can't record, and what he can't record, he can't erase. The unreadable dark in you is an ink blot in his ledger, and the bigger it gets, the more you slip through his fingers." }
    saldirilar:
      - id: "katman_hukmu"
        ad: { tr: "Katman Hükmü", en: "Layer Decree" }
        stat: "wil"
        taban: 36
        kat: 0.9
        etiketler: ["zihin", "menzilli"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} iki parmağını kaldırıyor. Durduğun yer katlanıyor; kemiklerin yanlış yazılmış bir satır gibi düzeltilmeye çalışılıyor.", en: "{dusman} lifts two fingers. The space you're standing in folds, and your bones get corrected like a typo." }
      - id: "kayit_kapatma"
        ad: { tr: "Kaydı Kapatma", en: "Closing the Entry" }
        stat: "int"
        taban: 38
        kat: 0.9
        etiketler: ["zihin", "alan"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} kalemini havada yatay bir çizgi çekerek indiriyor. Çizginin altında kalan her şey, sen dahil, bir hesabın toplamı gibi kapanmaya başlıyor.", en: "{dusman} brings his stylus down in a single horizontal stroke. Everything under that line, you included, starts to close like the bottom of a column of figures." }
    xp: 32000
    ganimet: { elcinin_kalemi: 1.0, defter_yapragi: 1.0 }
    etiketler: ["kadim", "boss", "elci"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Elçi ceketinin düğmelerini çözüyor. Altında deri değil, satırlar var: otuz dokuz dünyanın son günleri, küçük, düzgün harflerle. \"Kırkıncı sayfa senin,\" diyor iki sesiyle.", en: "The Envoy unbuttons his coat. Under it there isn't skin, there are lines: the last days of thirty-nine worlds in small, tidy handwriting. \"The fortieth page is yours,\" he says in both his voices." }
        guclenme: { int: 8, wil: 6 }
        saldiri:
          id: "otuz_dokuz_dunya"
          ad: { tr: "Otuz Dokuz Dünya", en: "Thirty-Nine Worlds" }
          stat: "int"
          taban: 42
          kat: 0.9
          etiketler: ["zihin", "alan"]
          durum: { etki: "kor", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} derisindeki dünyaları birer birer okuyor; her biri son gününün ışığıyla gözlerini yakarak üstüne düşüyor.", en: "{dusman} reads the worlds off his skin one by one, and each of them falls on you in the light of its last day, burning out your eyes." }
      - esik: 40
        metin: { tr: "Elçinin ikinci sesi birincisine yetişiyor. Artık iki kişi konuşuyor ve ikisi aynı şeyi söylemiyor: biri seni siliyor, öbürü ezberliyor.", en: "The Envoy's second voice catches up with the first. Now there are two of him talking, and they're not saying the same thing. One is erasing you. The other is memorizing you." }
        guclenme: { agi: 8, per: 6 }
        saldiri:
          id: "cift_ses"
          ad: { tr: "Çift Ses", en: "Double Voice" }
          stat: "wil"
          taban: 44
          kat: 0.95
          etiketler: ["zihin", "ses"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} iki sesiyle aynı anda konuşuyor ve iki hüküm, yarım nefes arayla, aynı kemiği iki kez kırıyor.", en: "{dusman} speaks in both voices at once, and two verdicts, half a breath apart, break the same bone twice." }
      - esik: 15
        metin: { tr: "Kalemin ucu kırılınca Elçi kırık ucu bir an inceliyor, sonra mürekkebi kendi derisinden, otuz dokuzuncu dünyanın satırından alıyor. \"Hesap kapanır,\" diyor; ama sesi ilk kez titriyor.", en: "The stylus tip snaps. The Envoy studies the broken nib for a moment, then draws ink from his own skin, from the line of the thirty-ninth world. \"The account closes,\" he says. But for the first time, his voice shakes." }
        guclenme: { wil: 10, end: 6 }
        saldiri:
          id: "hesap_kapanir"
          ad: { tr: "Hesap Kapanır", en: "The Account Closes" }
          stat: "wil"
          taban: 48
          kat: 1.0
          etiketler: ["zihin", "karanlik"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} kendi kanıyla yazılmış tek bir satırı sana doğru çeviriyor. Satırın sonunda bir çizgi var; altında senin adın ve bir toplam.", en: "{dusman} turns a single line, written in his own blood, toward you. At the end of it there's a rule, and under the rule, your name and a total." }
