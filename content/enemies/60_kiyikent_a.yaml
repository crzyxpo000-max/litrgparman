        stat: "end"
        taban: 14
        kat: 0.6
        etiketler: ["fiziksel", "alan"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} bütün ağırlığıyla üstüne devriliyor.", en: "{dusman} topples over onto you with its full weight." }
    xp: 820
    kredi: 40
    ganimet: { taklitci_disi: 0.5, hurda: 0.6 }
    etiketler: ["mekanik", "elit"]
    boss: false
  hamam_buhar_hayaleti:
    ad: { tr: "Buhar Hayaleti", en: "Steam Wraith" }
    aciklama: { tr: "Bir kapının hamamında, kaynar buhardan yoğrulmuş insan biçimli bir şey. Dokunduğu yeri haşlar, vurulduğu yerde dağılıp yeniden toplanır.", en: "A human-shaped thing kneaded together out of scalding steam inside a Gate's bathhouse. It scalds whatever it touches, and wherever you hit it, it scatters and pulls itself back together." }
    kanca: { tr: "Buharın içinde bir şekil doğruluyor; yüzü yok, ama sana bakıyor.", en: "A shape stands up out of the steam. It has no face, but it's looking at you." }
    seviye: 24
    can: 260
    statlar:
      str: 14
      agi: 28
      end: 16
      int: 26
      wis: 18
      per: 22
      wil: 20
      cha: 4
    davranis: "suru"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Buhar soğukta su olur. Bir buz büyüsü onu yere döker.", en: "Steam turns to water in the cold. One frost spell and it drops to the floor as a puddle." }
