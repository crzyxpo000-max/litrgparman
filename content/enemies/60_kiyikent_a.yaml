        ad: { tr: "Devrilme", en: "Topple" }
        stat: "end"
        taban: 14
        kat: 0.6
        etiketler: ["fiziksel", "alan"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} bütün ağırlığıyla üstüne devriliyor.", en: "{dusman} topples over onto you with its full weight." }
    xp: 820
    kredi: 40
    ganimet: { taklitci_disi: 0.5, hurda: 0.6 }
    etiketler: ["mekanik", "elit"]
    boss: false
  hamam_buhar_hayaleti:
    ad: { tr: "Buhar Hayaleti", en: "Steam Wraith" }
    aciklama: { tr: "Bir kapının hamamında, kaynar buhardan yoğrulmuş insan biçimli bir şey. Dokunduğu yeri haşlar; vurulduğu yerden dağılır, sonra yeniden toplanır.", en: "A human-shaped thing kneaded together out of scalding steam inside a Gate's bathhouse. It scalds whatever it touches, and wherever you hit it, it scatters and pulls itself back together." }
    kanca: { tr: "Buharın içinde bir şekil doğruluyor; yüzü yok ama sana bakıyor.", en: "A shape stands up out of the steam. It has no face, but it's looking at you." }
    seviye: 24
    can: 260
    statlar:
      str: 14
      agi: 28
      end: 16
      int: 26
      wis: 18
      per: 22
      wil: 20
      cha: 4
    davranis: "suru"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Buhar soğukta suya döner. Tek bir buz büyüsü onu yere döker.", en: "Steam turns to water in the cold. One frost spell and it drops to the floor as a puddle." }
    saldirilar:
      - id: "haslama"
        ad: { tr: "Haşlama", en: "Scald" }
        stat: "int"
        taban: 12
        kat: 0.7
        etiketler: ["ates", "yakin"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} sana sarılıyor; kaynar bir kazana düşmüşsün gibi derin haşlanıyor.", en: "{dusman} wraps itself around you and your skin scalds like you fell into a pot." }
      - id: "sis_perdesi"
        ad: { tr: "Sis Perdesi", en: "Steam Screen" }
        stat: "wis"
        taban: 6
        kat: 0.5
        etiketler: ["alan"]
        durum: { etki: "kor", sans: 0.5, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} dağılıp bütün kubbeyi beyaz bir körlükle dolduruyor.", en: "{dusman} comes apart and fills the whole dome with white blindness." }
    xp: 500
    kredi: 14
    ganimet: { cam_sise: 0.4, mavi_yosun: 0.4 }
    etiketler: ["ruh", "kapi"]
    boss: false
  balikhane_kiralik_avci:
    ad: { tr: "Kiralık Avcı", en: "Hired Gun" }
    aciklama: { tr: "Dağ yolundan inmiş, kristal karşılığında her işi yapan bir avcı. Zırhı yamalı, topuzu eskimiş; kendine güveni seviyesinden büyük.", en: "A hunter who came down the mountain highway and does any job for crystals. Patched armor, a well-used mace, and more confidence than levels." }
    kanca: { tr: "Kiralık avcı topuzunu omzuna yaslayıp seni tepeden tırnağa süzüyor.", en: "The hired gun props his mace on his shoulder and looks you up and down." }
    seviye: 24
    can: 380
    statlar:
      str: 30
      agi: 22
      end: 26
      int: 12
      wis: 12
      per: 20
      wil: 20
      cha: 10
    davranis: "agresif"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Kristal için dövüşür, inanç için değil. Onu korkuttuğun an topuzunu indirir.", en: "He's fighting for crystals, not for a cause. Scare him and the mace comes down." }
    saldirilar:
      - id: "topuz"
        ad: { tr: "Topuz Darbesi", en: "Mace Swing" }
        stat: "str"
        taban: 13
        kat: 0.7
