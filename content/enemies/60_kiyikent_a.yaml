      end: 22
      int: 8
      wis: 12
      per: 26
      wil: 14
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Derisi kendi yağıyla kaplı. Bir kıvılcım yeter; yağ tutuşur ve yılan kendi derisinde yanar.", en: "Its skin is coated in its own oil. One spark is all it takes. The oil catches and the eel burns in its own hide." }
    saldirilar:
      - id: "dolanma"
        ad: { tr: "Dolanma", en: "Coil" }
        stat: "str"
        taban: 11
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} göğsüne dolanıp sıkıyor; nefesin kaburgalarında kalıyor.", en: "{dusman} wraps around your chest and squeezes until your breath gets stuck in your ribs." }
      - id: "isirik"
        ad: { tr: "Karanlık Isırık", en: "Blind Bite" }
        stat: "agi"
        taban: 13
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "zehir", sans: 0.3, sure: 3 }
        bekleme: 1
        metin: { tr: "{dusman} karanlığın içinden fırlıyor ve dişleri omzuna gömülüyor.", en: "{dusman} shoots out of the dark and buries its teeth in your shoulder." }
    xp: 540
    kredi: 16
    ganimet: { safra_yagi: 0.7 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  konteyner_taklitci:
    ad: { tr: "Konteyner Taklitçisi", en: "Container Mimic" }
    aciklama: { tr: "Kırmızı bir yük konteyneri; kapısının ardında kilit dili şeklinde sıra sıra çelik dişler. İçine bir ikmal sandığının ışığını yansıtıp bekler.", en: "A red shipping container with row after row of steel teeth shaped like lock bolts behind its doors. It reflects a supply drop's glow up out of itself and waits." }
    kanca: { tr: "Kırmızı konteynerin kapısı, nefes alır gibi, aralanıp kapanıyor.", en: "The red container's door eases open and shut, like it's breathing." }
