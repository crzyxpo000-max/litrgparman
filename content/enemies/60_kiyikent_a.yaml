# Parti G — Perde 2 Kıyıkent (Liman, Kordon, Eski Şehir) düşmanları. Tasarım seviyesi 20–30; olaylarda
# @dunya / @oyuncu+N ile ölçeklenir. Bosslar: fenerci_ana (Kordon), hamam_gobek_tasi (Eski Şehir kapısı).
dusmanlar:
  mendirek_kiskaci:
    ad: { tr: "Mendirek Kıskacı", en: "Jetty Clawback" }
    aciklama: { tr: "Köpek büyüklüğünde, kabuğunu tuz kaplamış bir yengeç. Kordon'un taşlarına yapışıp yaşar; dalgalarla birlikte, sürü hâlinde gelir.", en: "A crab the size of a dog, its shell crusted over with salt. It lives clamped to the rocks of the Esplanade and comes in with the waves, in packs." }
    kanca: { tr: "Taşların arasından bir tıkırtı geliyor, ardından yüz tıkırtı daha.", en: "Something clicks between the rocks. Then a hundred more somethings." }
    seviye: 22
    can: 340
    statlar:
      str: 30
      agi: 18
      end: 32
      int: 6
      wis: 10
      per: 20
      wil: 16
      cha: 3
    davranis: "suru"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Tuz kaplı kabuk elektriği iyi iletir. Tek bir şimşek bütün sürüyü aynı anda kasar.", en: "Salt-crusted shell conducts like a wire. One lightning strike locks up the whole pack at once." }
    saldirilar:
      - id: "kiskac"
        ad: { tr: "Kıskaç", en: "Pincer" }
        stat: "str"
        taban: 12
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kıskacını bileğine kapatıyor; tuz yaraya doluyor.", en: "{dusman} clamps a pincer on your wrist, and salt packs into the cut." }
      - id: "tuz_puskurtme"
        ad: { tr: "Tuz Püskürtme", en: "Brine Spray" }
        stat: "end"
        taban: 9
        kat: 0.6
        etiketler: ["alan"]
        durum: { etki: "kor", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} ağzından yüzüne kaynar tuzlu su fışkırtıyor.", en: "{dusman} sprays a jet of scalding brine right in your face." }
    xp: 520
    kredi: 18
    ganimet: { kiskac_kabugu: 0.6, kaya_tuzu: 0.4 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  vapur_safra_yilani:
    ad: { tr: "Safra Yılanı", en: "Bilge Eel" }
    aciklama: { tr: "Batık vapurların makine dairelerinde yaşayan, kol kalınlığında, beş metre boyunda kaygan bir yılan balığı. Karanlıkta görür, suyun içinde daha da iyi.", en: "A slick eel as thick as a man's arm and sixteen feet long that lives in the engine rooms of sunken ferries. It sees in the dark. It sees even better underwater." }
    kanca: { tr: "Makine dairesinin lombozunda iki göz yanıyor, sonra yok oluyor.", en: "Two eyes light up behind the engine room porthole, then they're gone." }
    seviye: 23
    can: 300
    statlar:
      str: 26
      agi: 30
      end: 22
      int: 8
      wis: 12
      per: 26
      wil: 14
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Derisi kendi yağıyla kaplıdır. Bir kıvılcım yeter: yağ tutuşur, yılan balığı kendi derisinin içinde yanar.", en: "Its skin is coated in its own oil. One spark is all it takes. The oil catches and the eel burns in its own hide." }
    saldirilar:
      - id: "dolanma"
        ad: { tr: "Dolanma", en: "Coil" }
        stat: "str"
        taban: 11
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} göğsüne dolanıp sıkıyor; nefesin kaburgalarında kalıyor.", en: "{dusman} wraps around your chest and squeezes until your breath gets stuck in your ribs." }
      - id: "isirik"
        ad: { tr: "Karanlık Isırık", en: "Blind Bite" }
        stat: "agi"
        taban: 13
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "zehir", sans: 0.3, sure: 3 }
        bekleme: 1
        metin: { tr: "{dusman} karanlığın içinden fırlıyor ve dişleri omzuna gömülüyor.", en: "{dusman} shoots out of the dark and buries its teeth in your shoulder." }
    xp: 540
    kredi: 16
    ganimet: { safra_yagi: 0.7 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  konteyner_taklitci:
    ad: { tr: "Konteyner Taklitçisi", en: "Container Mimic" }
    aciklama: { tr: "Kırmızı bir yük konteyneri; kapısının ardında kilit dili biçiminde sıra sıra çelik dişler. İçinden bir ikmal sandığının ışığını yansıtır ve bekler.", en: "A red shipping container with row after row of steel teeth shaped like lock bolts behind its doors. It reflects a supply drop's glow up out of itself and waits." }
    kanca: { tr: "Kırmızı konteynerin kapısı nefes alır gibi aralanıp kapanıyor.", en: "The red container's door eases open and shut, like it's breathing." }
    seviye: 25
    can: 620
    statlar:
      str: 38
