    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Kristal için dövüşüyor, inanç için değil. Korkuttuğun an topuzunu indirir.", en: "He's fighting for crystals, not for a cause. Scare him and the mace comes down." }
    saldirilar:
      - id: "topuz"
        ad: { tr: "Topuz Darbesi", en: "Mace Swing" }
        stat: "str"
        taban: 13
        kat: 0.7
