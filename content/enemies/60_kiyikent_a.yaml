      end: 40
      int: 10
      wis: 8
      per: 18
      wil: 22
      cha: 4
    davranis: "temkinli"
    zeki: true
    zaaf: "ses"
    zaaf_metin: { tr: "İçi boş bir çelik kutu. Yüksek bir ses içinde çınlar ve onu sersemletir.", en: "It's a hollow steel box. A loud enough noise rings around inside it and leaves it dazed." }
    saldirilar:
