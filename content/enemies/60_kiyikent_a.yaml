        ad: { tr: "Kirli Numara", en: "Dirty Trick" }
        stat: "agi"
        taban: 7
        kat: 0.5
        etiketler: ["yakin"]
        durum: { etki: "kor", sans: 0.45, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} gözlerine bir avuç tuz fırlatıyor ve gülüyor.", en: "{dusman} flings a fistful of salt in your eyes and laughs." }
    xp: 560
    kredi: 30
    ganimet: { kucuk_iyilesme_iksiri: 0.4 }
    etiketler: ["insan"]
    boss: false
  fenerci_ana:
    ad: { tr: "Fener Balığı Ana", en: "The Lamplighter" }
    aciklama: { tr: "Kordon'un açığında yaşayan, bir vapur büyüklüğünde fener balığı. Alnındaki sapın ucunda eski fenerin ışığını taklit eden bir ışık sallanır; ağzında batırdığı kayıkların küpeşteleri diş gibi dizilidir.", en: "A ferry-sized anglerfish living off the Esplanade. The light dangling from the stalk on its forehead fakes the old lighthouse beam, and the gunwales of every boat it ever sank are lined up in its mouth like teeth." }
    kanca: { tr: "Işığın altında su açılıyor ve bir vapur lombozu kadar solgun bir göz yükseliyor.", en: "Under the light the water opens, and a pale eye as big as a ferry porthole rises up." }
    seviye: 28
    can: 1800
    statlar:
      str: 44
      agi: 20
      end: 46
      int: 30
      wis: 24
      per: 30
      wil: 34
      cha: 20
    davranis: "agresif"
    zeki: true
    zaaf: "isik"
    zaaf_metin: { tr: "Kendi ışığından başka ışık görmemiş bir göz. Gerçek bir parıltı onu kör eder ve sapı açıkta kalır.", en: "An eye that's never seen any light but its own. One real flash blinds it and leaves the stalk wide open." }
    saldirilar:
      - id: "kayik_disleri"
        ad: { tr: "Kayık Dişleri", en: "Gunwale Teeth" }
        stat: "str"
        taban: 18
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.4, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} ağzını kapatıyor; batık kayıkların küpeşteleri etine gömülüyor.", en: "{dusman} snaps its mouth shut, and the gunwales of sunken boats sink into you." }
      - id: "sahte_fener"
        ad: { tr: "Sahte Fener", en: "False Beacon" }
        stat: "cha"
        taban: 12
        kat: 0.8
        etiketler: ["isik", "zihin"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} ışığını yüzüne sallıyor ve bir an iskeleyi, korkuluğu, akşam vapurunu görüyorsun; bacakların oraya yürümek istiyor.", en: "{dusman} swings its light in your face, and for a second you see the terminal, the railing, the evening ferry. Your legs want to walk there." }
    xp: 2600
    kredi: 160
    ganimet: { fener_incisi: 0.3, canavar_cekirdegi: 1.0, buyuk_iyilesme_iksiri: 0.5 }
    etiketler: ["boss", "deniz"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Işık söndüğü yerde yeniden yanıyor, bu kez çok daha yakında. Suyun altında başka ışıklar kıpırdıyor: yuvasındaki yumurtalar.", en: "The light goes out and comes back on, much closer this time. Other lights stir underwater: the eggs in its nest." }
        guclenme: { str: 4, wil: 3 }
        saldiri:
          id: "dalga"
          ad: { tr: "Dip Dalgası", en: "Undertow" }
          stat: "end"
          taban: 16
          kat: 0.7
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} kuyruğunu suya vuruyor ve bir dip dalgası seni dibe çekiyor.", en: "{dusman} slaps its tail on the water, and an undertow drags you down." }
      - esik: 40
        metin: { tr: "Ağzından bir kayık daha dökülüyor; üstünde hâlâ birinin adı yazılı. Fener Balığı Ana yuvasının önüne geçiyor ve artık geri çekilmiyor.", en: "Another boat spills out of its mouth, someone's name still painted on the hull. The Lamplighter puts itself between you and its nest and won't back off anymore." }
        guclenme: { end: 5, agi: 4 }
        saldiri:
          id: "yutma"
          ad: { tr: "Yutuş", en: "Gulp" }
          stat: "str"
          taban: 22
          kat: 0.8
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "korku", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} seni bütün olarak yutmaya çalışıyor; bir anlığına karanlıksın, tuzlu ve sıcak.", en: "{dusman} tries to swallow you whole. For a moment it's all dark, salty and hot." }
      - esik: 15
        metin: { tr: "Işık titriyor ve bir an fener değil, bir kadının sesi gibi bir şey çıkarıyor: denizden, uzaktan, bir ninni. Sonra yeniden yanıyor, kırmızı.", en: "The light flickers, and for a moment it isn't a lighthouse but something like a woman's voice, far out at sea, singing a lullaby. Then it burns again, red." }
        guclenme: { str: 5, wil: 5, int: 4 }
        saldiri:
          id: "kirmizi_fener"
          ad: { tr: "Kırmızı Fener", en: "Red Beacon" }
          stat: "int"
          taban: 20
          kat: 0.9
          etiketler: ["isik", "alan"]
          durum: { etki: "yanma", sans: 0.5, sure: 3 }
          bekleme: 2
          metin: { tr: "{dusman} ışığını kırmızıya çeviriyor ve suyun yüzeyi kaynamaya başlıyor.", en: "{dusman} turns its light red and the surface of the water starts to boil." }
  hamam_gobek_tasi:
    ad: { tr: "Göbek Taşı", en: "The Hearthstone" }
    aciklama: { tr: "Bir kapının hamamının kalbi: bir yatak büyüklüğünde, kızıl, ortasında yürek gibi atan bir çatlak. Ayağa kalktığında bütün kubbeler terler.", en: "The heart of a Gate's bathhouse: a red-hot slab as big as a bed with a crack in the middle beating like a heart. When it stands up, every dome sweats." }
    kanca: { tr: "En büyük kubbenin altında taş bir kez nefes alıyor ve ayağa kalkıyor.", en: "Under the biggest dome the stone takes one breath and stands up." }
    seviye: 27
    can: 1600
    statlar:
      str: 46
      agi: 12
      end: 50
      int: 24
      wis: 18
      per: 18
      wil: 30
      cha: 6
    davranis: "agresif"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Yüz yıldır sıcak. Bir buz darbesi çatlağını genişletir; ikincisi onu ortasından ikiye ayırır.", en: "It's been hot for a hundred years. One hit of frost widens the crack. A second splits it down the middle." }
    saldirilar:
      - id: "kizgin_yumruk"
        ad: { tr: "Kızgın Yumruk", en: "Searing Fist" }
        stat: "str"
        taban: 18
        kat: 0.7
        etiketler: ["fiziksel", "ates", "yakin"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kızgın taştan yumruğunu indiriyor; mermer bile çatlıyor.", en: "{dusman} brings down a fist of red-hot stone. Even the marble cracks." }
      - id: "buhar_patlamasi"
        ad: { tr: "Buhar Patlaması", en: "Steam Burst" }
        stat: "int"
        taban: 14
        kat: 0.7
        etiketler: ["ates", "alan"]
        durum: { etki: "kor", sans: 0.4, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} çatlağından bir buhar patlaması savuruyor; kubbe beyaz bir sıcaklıkla doluyor.", en: "{dusman} blasts steam out of its crack, and the dome fills with white heat." }
    xp: 2300
    kredi: 130
    ganimet: { hamam_kristali: 1.0, canavar_cekirdegi: 1.0 }
    etiketler: ["boss", "kapi"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Çatlak genişliyor ve içinden kızıl bir ışık sızıyor. Kurnalardaki su kaynamaya başlıyor.", en: "The crack widens and a red light seeps out of it. The water in the basins starts to boil." }
        guclenme: { str: 3, end: 3 }
        saldiri:
          id: "kaynar_kurna"
          ad: { tr: "Kaynar Kurna", en: "Boiling Basin" }
          stat: "int"
          taban: 16
          kat: 0.7
          etiketler: ["ates", "alan"]
          durum: { etki: "yanma", sans: 0.5, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} bir kurnayı söküp üstüne boşaltıyor.", en: "{dusman} rips a basin off the wall and dumps it over you." }
      - esik: 40
        metin: { tr: "Kubbeler terliyor; damlalar yere düşmeden buhara dönüyor. Taş daha hızlı, daha sıcak.", en: "The domes are sweating, and the drops turn to steam before they hit the floor. The stone's faster now. Hotter." }
        guclenme: { agi: 6, int: 4 }
        saldiri:
          id: "kizil_dalga"
          ad: { tr: "Kızıl Dalga", en: "Red Wave" }
          stat: "str"
          taban: 20
          kat: 0.8
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
          bekleme: 3
          metin: { tr: "{dusman} mermeri ikiye bölüyor ve kızıl bir sıcaklık dalgası seni duvara çarpıyor.", en: "{dusman} splits the marble floor and a wave of red heat slams you into the wall." }
      - esik: 15
        metin: { tr: "Çatlak bir yürek gibi hızla atıyor. Taş son bir kez, bütün sıcaklığını tek bir noktaya topluyor.", en: "The crack is beating fast now, like a heart. The stone gathers every bit of its heat into a single point." }
        guclenme: { str: 5, wil: 5 }
        saldiri:
          id: "son_kor"
          ad: { tr: "Son Kor", en: "Last Ember" }
          stat: "wil"
          taban: 22
          kat: 0.9
          etiketler: ["ates", "yakin"]
          durum: { etki: "yanma", sans: 0.6, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} göğsünü sana dayıyor; yüz yıllık bir hamamın bütün sıcaklığı bir anda içine akıyor.", en: "{dusman} presses its chest against you, and a hundred years of bathhouse heat pours into you all at once." }
