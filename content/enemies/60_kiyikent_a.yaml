        stat: "int"
        taban: 12
        kat: 0.7
        etiketler: ["ates", "yakin"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} sana sarılıyor ve derin kaynar suyla haşlanıyor.", en: "{dusman} wraps itself around you and your skin scalds like you fell into a pot." }
      - id: "sis_perdesi"
        ad: { tr: "Sis Perdesi", en: "Steam Screen" }
        stat: "wis"
        taban: 6
        kat: 0.5
        etiketler: ["alan"]
        durum: { etki: "kor", sans: 0.5, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} dağılıyor ve bütün kubbeyi beyaz bir körlükle dolduruyor.", en: "{dusman} comes apart and fills the whole dome with white blindness." }
    xp: 500
    kredi: 14
    ganimet: { cam_sise: 0.4, mavi_yosun: 0.4 }
    etiketler: ["ruh", "kapi"]
    boss: false
  balikhane_kiralik_avci:
    ad: { tr: "Kiralık Avcı", en: "Hired Gun" }
    aciklama: { tr: "Dağ yolundan inmiş, kristal karşılığı her işi yapan bir avcı. Zırhı yamalı, topuzu çok kullanılmış, kendine güveni seviyesinden büyük.", en: "A hunter who came down the mountain highway and does any job for crystals. Patched armor, a well-used mace, and more confidence than levels." }
    kanca: { tr: "Kiralık avcı topuzunu omzuna yaslıyor ve seni baştan aşağı süzüyor.", en: "The hired gun props his mace on his shoulder and looks you up and down." }
