# Parti G — Perde 2 Kıyıkent (Liman, Kordon, Eski Şehir) düşmanları. Tasarım seviyesi 20–30; olaylarda
# @dunya / @oyuncu+N ile ölçeklenir. Bosslar: fenerci_ana (Kordon), hamam_gobek_tasi (Eski Şehir kapısı).
dusmanlar:
  mendirek_kiskaci:
    ad: { tr: "Mendirek Kıskacı", en: "Jetty Clawback" }
    aciklama: { tr: "Bir köpek büyüklüğünde, kabuğu tuzla kabuk bağlamış bir yengeç. Kordon'un taşlarına yapışıp yaşıyor; sürü hâlinde, dalgalarla birlikte gelir.", en: "A crab the size of a dog, its shell crusted over with salt. It lives clamped to the rocks of the Esplanade and comes in with the waves, in packs." }
    kanca: { tr: "Taşların arasından bir tıkırtı geliyor, sonra yüz tıkırtı daha.", en: "Something clicks between the rocks. Then a hundred more somethings." }
    seviye: 22
    can: 340
    statlar:
      str: 30
      agi: 18
      end: 32
      int: 6
      wis: 10
      per: 20
      wil: 16
      cha: 3
    davranis: "suru"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Tuzlu kabuk elektriği iyi iletir. Bir şimşek bütün sürüyü aynı anda kasar.", en: "Salt-crusted shell conducts like a wire. One lightning strike locks up the whole pack at once." }
    saldirilar:
      - id: "kiskac"
        ad: { tr: "Kıskaç", en: "Pincer" }
        stat: "str"
        taban: 12
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kıskacını bileğine kapatıyor; tuz yaraya doluyor.", en: "{dusman} clamps a pincer on your wrist, and salt packs into the cut." }
      - id: "tuz_puskurtme"
        ad: { tr: "Tuz Püskürtme", en: "Brine Spray" }
        stat: "end"
        taban: 9
        kat: 0.6
        etiketler: ["alan"]
        durum: { etki: "kor", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} ağzından yüzüne kaynar bir tuzlu su fışkırtıyor.", en: "{dusman} sprays a jet of scalding brine right in your face." }
    xp: 520
    kredi: 18
    ganimet: { kiskac_kabugu: 0.6, kaya_tuzu: 0.4 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  vapur_safra_yilani:
    ad: { tr: "Safra Yılanı", en: "Bilge Eel" }
    aciklama: { tr: "Batık vapurların makine dairelerinde yaşayan, kolum kalınlığında, beş metre boyunda kaygan bir yılan balığı. Karanlıkta görür, suda daha da iyi.", en: "A slick eel as thick as a man's arm and sixteen feet long that lives in the engine rooms of sunken ferries. It sees in the dark. It sees even better underwater." }
    kanca: { tr: "Makine dairesinin camında iki göz yanıyor, sonra kayboluyor.", en: "Two eyes light up behind the engine room porthole, then they're gone." }
    seviye: 23
    can: 300
    statlar:
      str: 26
