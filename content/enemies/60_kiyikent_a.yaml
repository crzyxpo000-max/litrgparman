        durum: { etki: "kanama", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kapılarını açıp seni ısırıyor; çelik dişler etine kilitleniyor.", en: "{dusman} swings its doors open and bites. Steel teeth lock into you." }
