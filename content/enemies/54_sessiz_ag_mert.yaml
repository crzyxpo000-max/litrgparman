          metin: { tr: "{dusman} senin için yazılan kuralı üstüne indiriyor. Durum pencerende bütün sayılar bir an sıfıra dönüyor; sonra, isteksizce, geri geliyor.", en: "{dusman} brings the rule written for you crashing down. Every number in your Status window snaps to zero for a beat, then crawls back, reluctant." }
      - esik: 40
        metin: { tr: "Bekçi kendini yeniden derliyor. Yüzeyindeki kurallar sıklaşıyor, aralarındaki boşluklar kapanıyor; nefes alacak satır kalmıyor.", en: "The warden recompiles itself. The rules on its surface pack in tighter and the gaps between them close up until there's no line left to breathe in." }
        guclenme: { end: 6, wis: 4 }
        saldiri:
          id: "sikistirma"
          ad: { tr: "Sıkıştırma", en: "Compression" }
          stat: "wis"
          taban: 19
          kat: 0.9
          etiketler: ["zihin", "alan"]
          durum: { etki: "korku", sans: 0.4, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} etrafındaki bütün boşluğu sıkıştırıyor. Kaburgaların birbirine yaklaşıyor; düşüncelerin de.", en: "{dusman} compresses all the empty space around you. Your ribs squeeze together. So do your thoughts." }
      - esik: 15
        metin: { tr: "Bekçi bir sayfa gibi yırtılmaya başlıyor. Yırtığın kenarında, kimsenin yazmadığı boş bir satır parlıyor; bir kural olmayan tek yer.", en: "The warden starts tearing like a page. Along the edge of the rip glows one blank line nobody wrote. The only place in it that isn't a rule." }
        guclenme: { str: 6, end: 5 }
        saldiri:
          id: "son_kural"
          ad: { tr: "Son Kural", en: "Final Rule" }
          stat: "str"
          taban: 22
          kat: 1.0
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "kanama", sans: 0.45, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} bütün ağırlığıyla katlanıp üstüne kapanıyor; bir kitabın kapağı gibi, seni iki sayfanın arasında ezmeye çalışarak.", en: "{dusman} folds down on you with all its weight, like a book slamming shut, trying to press you flat between two pages." }
