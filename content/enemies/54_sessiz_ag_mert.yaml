    fazlar:
      - esik: 70
        metin: { tr: "Bekçinin yüzeyindeki kurallar yer değiştiriyor ve aralarından biri öne çıkıyor; senin için yazılmış bir kural: [Anomali görüldüğü yerde düzeltilir.]", en: "The rules on the warden's surface shuffle, and one of them comes forward. One written just for you: [Anomaly is corrected on sight.]" }
        guclenme: { int: 5, wil: 4 }
        saldiri:
          id: "anomali_kurali"
          ad: { tr: "Anomali Kuralı", en: "The Anomaly Clause" }
          stat: "int"
          taban: 20
          kat: 1.0
          etiketler: ["zihin", "glitch"]
          durum: { etki: "sersemleme", sans: 0.45, sure: 1 }
