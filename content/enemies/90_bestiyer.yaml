    ganimet: { hasat_kulu: 0.5 }
    etiketler: ["olu", "cok_evren"]
    boss: false
  mercan_cobani:
    ad: { tr: "Mercan Çobanı", en: "Reef Shepherd" }
    aciklama: { tr: "Batık şehirlerin üstünde büyüyen mercanları güden, balina büyüklüğünde, sırtı resife dönmüş bir yaratık. Halkı gittikten sonra şehirlerini yaşatmanın tek yolunu buldu: mercanı onlara benzetmek. Mercanların arasında sokaklar, kubbeler, yüzsüz heykeller yükselir. Bahçesine giren herkes onun gözünde yeni bir heykeldir.", en: "A whale-sized creature with a living reef for a back that tends the coral growing over the drowned cities. After its people were gone, it found the only way to keep their cities alive: grow the coral into their shape. There are streets in that reef, domes, statues with no faces. Anyone who wanders into its garden, it sees as a new statue." }
    kanca: { tr: "Kaya sanıp üstünde durduğun resif kalkıyor. Mercan kubbeler, mercan sokaklar sudan yükseliyor; resifin ortasında yosun gibi dalgalanan bir yüz sana eğiliyor.", en: "The reef you took for rock lifts under you. Coral domes and coral streets rise out of the water, and from the middle of the reef, a face rippling like seaweed leans down toward you." }
    seviye: 36
    can: 940
    statlar:
      str: 40
      agi: 18
      end: 44
      int: 26
      wis: 34
      per: 28
      wil: 38
      cha: 10
    davranis: "temkinli"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Mercanı ılık, sığ sularda yaşar. Soğuk resifi ağartıp öldürür; ölen mercan sırtında taş gibi ağırlaşır, çobanı dibe çeker.", en: "Its reef lives in warm, shallow water. Cold bleaches the coral and kills it, and dead coral turns to dead weight on its back, dragging the shepherd down." }
