          metin: { tr: "{dusman} merceğinden beyaz bir ışın sana yolluyor ve önünde tek satırlık bir pencere açılıyor: [Değer: sıfır. Zarar yazıldı.]", en: "{dusman} fires a white beam from its lens, and a one-line window opens in front of you: [Value: zero. Written off as a loss.]" }
  # ---------------------------------------------------------------- Çok-evren · Yedi Taht (EN: the Sevenfold Court)
  huzur_muhafizi:
    ad: { tr: "Huzur Muhafızı", en: "Presence Guard" }
    aciklama: { tr: "Yedi Taht'ın salonlarını bekleyen, yüzleri kalıplanmış maskelerin ardında saklı muhafızlar. Tahtların huzurunda konuşmak yasaktır ve onlar o yasanın kendisidir: sessizliği bozanı susturur, diz çökmeyeni diz çöktürürler. Ağızlarının olup olmadığını kimse bilmiyor.", en: "Guards who keep the halls of the Sevenfold Court, their faces hidden behind molded masks. Speaking in the presence of the thrones is forbidden, and they are that law in the flesh: they silence whoever breaks the silence and put whoever won't kneel on their knees. Nobody knows if they even have mouths." }
    kanca: { tr: "Uzun salonda adımlarının yankısı bile ayıp gibi. İki sütunun arasındaki maskeli figür tek bir parmak kaldırıyor, dudaklarına götürüyor; sonra teberini indiriyor.", en: "In the long hall, even the echo of your footsteps feels rude. The masked figure between two pillars raises a single finger to its lips. Then it lowers its halberd." }
    seviye: 37
    can: 470
    statlar:
      str: 26
      agi: 20
      end: 24
      int: 16
      wis: 18
      per: 20
      wil: 26
      cha: 10
    davranis: "agresif"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Yeminleri sessizliğe bağlı; güçlerini salonun sessizliğinden alıyorlar. Sağır edici bir ses o yemini parçalar ve muhafız, kendi yasasını çiğnenmiş görünce bir an ne yapacağını bilemez.", en: "Their oath is bound to silence, and they draw their strength from the hush of the halls. A deafening noise shatters the oath, and when a guard sees its own law broken, it doesn't know what to do for a moment." }
    saldirilar:
      - id: "sessiz_teber"
        ad: { tr: "Sessiz Teber", en: "Silent Halberd" }
        stat: "str"
        taban: 19
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} teberini yay gibi savuruyor; ne ıslık ne rüzgar sesi, hiçbir şey yok. Yalnızca böğründe açılan yara.", en: "{dusman} sweeps its halberd in a long arc. No whistle, no rush of air, nothing at all. Just the cut opening in your side." }
      - id: "diz_coktur"
        ad: { tr: "Diz Çöktürme", en: "Kneel" }
        stat: "wil"
        taban: 17
        kat: 0.8
        etiketler: ["zihin"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} teberinin sapını yere vuruyor ve salonun bütün ağırlığı omuzlarına çöküyor; dizlerin, sen istemeden, mermere değiyor.", en: "{dusman} raps the butt of its halberd on the floor, and the whole weight of the hall comes down on your shoulders. Your knees hit the marble before you can decide not to let them." }
      - id: "huzur_yasasi"
        ad: { tr: "Huzur Yasası", en: "Law of Presence" }
        stat: "wil"
        taban: 15
        kat: 0.8
        etiketler: ["zihin", "karanlik"]
        durum: { etki: "korku", sans: 0.4, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} maskesini sana çeviriyor ve boğazın kendiliğinden kapanıyor. Konuşmaya çalışıyorsun; ses yok. Nefes almaya çalışıyorsun; o da yasak gibi.", en: "{dusman} turns its mask toward you, and your throat closes on its own. You try to speak. Nothing. You try to breathe, and that feels forbidden too." }
    xp: 6650
    kredi: 30
    ganimet: { sessizlik_muhru: 0.45 }
    etiketler: ["cok_evren", "kadim"]
    boss: false
  hasat_kandili:
    ad: { tr: "Hasat Kandili", en: "Harvest Lamp" }
    aciklama: { tr: "Yedi Taht'ın koridorlarını aydınlatan, havada süzülen kristal kandiller. Yaktıkları şey yağ değil: hasat edilmiş dünyaların özü. Her kandilin içinde bir dünyanın son kıvılcımı yanıyor ve yakından bakınca, alevin içinde hâlâ kıpırdayan bir yüz görülüyor.", en: "Floating crystal lamps that light the corridors of the Sevenfold Court. They don't burn oil. They burn the essence of harvested worlds. Inside each one, the last spark of some world is still going, and if you look close, there's a face in the flame, still moving." }
    kanca: { tr: "Koridorun kandillerinden biri yerinden kopup sana doğru süzülüyor. Alevin içindeki yüz camın arkasından sana bakıyor ve dudakları senin dilinde bir kelime söylüyor: \"Kaç.\"", en: "One of the corridor lamps drifts loose and floats toward you. The face in the flame looks at you through the crystal, and its lips shape a word in your language: \"Run.\"" }
    seviye: 36
    can: 360
    statlar:
      str: 6
      agi: 16
      end: 12
      int: 26
      wis: 22
      per: 14
      wil: 24
      cha: 8
    davranis: "temkinli"
    zeki: false
    zaaf: "karanlik"
    zaaf_metin: { tr: "Yanmaya mecbur; Kadimler onu böyle bağladı. Karanlık alevi boğar ve kandil sönerken içindeki yüz, uzun zamandır ilk kez, gözlerini kapatır.", en: "It has to burn; the Ancients bound it that way. Darkness smothers the flame, and as the lamp goes out, the face inside closes its eyes for the first time in a very long time." }
    saldirilar:
      - id: "oz_alevi"
        ad: { tr: "Öz Alevi", en: "Essence Flame" }
        stat: "int"
        taban: 18
        kat: 0.8
        etiketler: ["ates", "menzilli"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} camının kapağını aralıyor ve üstüne soluk, mavi-beyaz bir alev akıyor; bir dünyanın son ateşi, şimdi tenini yakıyor.", en: "{dusman} cracks its crystal open and a pale blue-white flame pours over you. The last fire of a whole world, burning your skin." }
      - id: "icerideki_ses"
        ad: { tr: "İçerideki Ses", en: "The Voice Inside" }
        stat: "wis"
        taban: 16
        kat: 0.8
        etiketler: ["zihin", "ses"]
        durum: { etki: "korku", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} kıpırdıyor ve alevin içindeki yüz çığlık atıyor; ses camdan değil, kafatasının içinden geliyor ve bir dünyanın son anını anlatıyor.", en: "{dusman} flickers, and the face in the flame screams. The sound doesn't come through the crystal. It comes from inside your skull, and it's describing a world's last moment." }
      - id: "fitil_cekme"
        ad: { tr: "Fitil Çekme", en: "Wick Draw" }
        stat: "wil"
        taban: 17
        kat: 0.8
        etiketler: ["karanlik", "can_emme"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} göğsünden ince bir ışık ipliği çekiyor ve kendi fitiline ekliyor; alevi bir an daha parlak, sen bir an daha soluk.", en: "{dusman} draws a thin thread of light out of your chest and twists it into its own wick. For a moment its flame burns brighter, and you burn a little dimmer." }
    xp: 6330
    kredi: 18
    ganimet: { kandil_fitili: 0.45, canavar_cekirdegi: 0.15 }
    etiketler: ["ruh", "cok_evren", "kadim"]
    boss: false
  bos_taht_golgesi:
    ad: { tr: "Boş Tahtın Gölgesi", en: "Shadow of the Empty Throne" }
    aciklama: { tr: "Yedi Taht'ın yedi tahtından biri boş. Kim oturuyordu, neden kalktı, Kadimler bundan söz etmiyor. Ama tahtın gölgesi sahibini beklemekten hiç vazgeçmedi; tahta yaklaşan her yabancıyı bir gaspçı sayıyor ve bir zamanlar orada oturanın gücüyle onu ezmeye çalışıyor.", en: "One of the seven thrones of the Sevenfold Court is empty. Who sat there, and why they left, the Ancients never say. But the throne's shadow never stopped waiting for its owner. It takes every stranger who comes near for a usurper, and tries to crush them with the power of whoever used to sit there." }
    kanca: { tr: "Boş tahtın önünden geçerken gölgesi seninkinin üstüne düşüyor ve senin gölgen yerinden kalkıp diz çöküyor. Sen hâlâ ayaktasın. Taht gölgesi bunu hoş karşılamıyor.", en: "As you pass in front of the empty throne, its shadow falls across yours, and your shadow gets up off the floor and kneels. You're still standing. The throne's shadow does not care for that." }
    seviye: 39
    can: 980
    statlar:
      str: 38
      agi: 30
      end: 38
      int: 40
      wis: 34
      per: 32
      wil: 46
      cha: 30
    davranis: "agresif"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Bir gölge olarak tahtın arkasındaki karanlığa bağlı. Tahtın üstüne güçlü bir ışık düşür; gölge kısalır, incelir ve kendi sahibinin boyuna, yani hiçliğe, iner.", en: "As a shadow, it's tied to the dark behind the throne. Throw a hard light onto the throne itself and the shadow shortens, thins out, and shrinks down to the size of its owner. Which is to say, nothing." }
    saldirilar:
      - id: "taht_hukmu"
        ad: { tr: "Taht Hükmü", en: "Throne Edict" }
        stat: "wil"
        taban: 22
        kat: 0.8
        etiketler: ["karanlik", "zihin"]
        durum: { etki: "korku", sans: 0.45, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} bir hüküm veriyor; dili bilmiyorsun ama anlamını kemiklerin anlıyor: diz çök ya da yok ol.", en: "{dusman} hands down a decree. You don't speak the language, but your bones understand it fine: kneel, or stop existing." }
      - id: "golge_kilic"
        ad: { tr: "Gölge Kılıç", en: "Shade Blade" }
        stat: "agi"
        taban: 21
        kat: 0.8
        etiketler: ["karanlik", "yakin"]
        durum: { etki: "kanama", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} yerdeki gölgenden bir kılıç çekiyor, senin gölgenden, ve onu sana saplıyor.", en: "{dusman} draws a sword out of the shadow at your feet, your own shadow, and runs you through with it." }
      - id: "bos_koltuk"
        ad: { tr: "Boş Koltuk", en: "The Empty Seat" }
        stat: "int"
        taban: 20
        kat: 0.8
        etiketler: ["zihin"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} tahtı gösteriyor ve bir an kendini orada otururken görüyorsun: altında dünyalar, önünde diz çökmüş Kadimler. Görüntü kaybolduğunda hâlâ yerinden kıpırdayamıyorsun.", en: "{dusman} gestures at the throne, and for a moment you see yourself sitting in it, worlds beneath you, Ancients kneeling at your feet. When the vision fades, you still can't move." }
    xp: 14600
    kredi: 150
    ganimet: { taht_golgesi_parcasi: 0.6, canavar_cekirdegi: 1.0, sessizlik_muhru: 0.4 }
    etiketler: ["ruh", "cok_evren", "kadim", "elit"]
    boss: false
    fazlar:
      - esik: 60
        metin: { tr: "Gölge tahta geri çekiliyor ve tahtın üstünde bir an bir biçim beliriyor: uzun, taçlı, tanıdık olmayan. Sonra biçim dağılıyor ve gölge iki katına çıkarak salona yayılıyor.", en: "The shadow pulls back onto the throne, and for a moment a shape appears in the seat: tall, crowned, like nothing you know. Then the shape breaks up, and the shadow spills across the hall, twice the size it was." }
        guclenme: { str: 4, wil: 5 }
        saldiri:
          id: "taht_karanligi"
          ad: { tr: "Taht Karanlığı", en: "Throne Dark" }
          stat: "wil"
          taban: 24
          kat: 0.8
          etiketler: ["karanlik", "alan"]
          durum: { etki: "kor", sans: 0.45, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} salonun bütün ışıklarını tahtın arkasına çekiyor; karanlıkta yalnızca tahtın kenarları parlıyor ve bir taç.", en: "{dusman} drags every light in the hall back behind the throne. In the dark, the only things still shining are the edges of the throne, and a crown." }
      - esik: 25
        metin: { tr: "Gölge çatlıyor; çatlaklardan, tahttan kalkıp gidenin son sözleri sızıyor. Anlamıyorsun ama bir kelimeyi tanıyorsun, çünkü onu senin Sistem'in de kullanıyor: [Hasat].", en: "The shadow cracks, and through the cracks seep the last words of whoever got up and left that throne. You don't understand them, but you recognize one word, because your System uses it too: [Harvest]." }
        guclenme: { int: 5, agi: 4 }
        saldiri:
          id: "gaspcinin_sonu"
          ad: { tr: "Gaspçının Sonu", en: "The Usurper's End" }
          stat: "int"
          taban: 26
          kat: 0.8
          etiketler: ["karanlik", "can_emme"]
          durum: { etki: "kanama", sans: 0.5, sure: 3 }
          bekleme: 2
          metin: { tr: "{dusman} bütün ağırlığıyla üstüne çöküyor, bir tahtın bir gaspçıya çöktüğü gibi; gölgesi seninkini yutmaya başlıyor.", en: "{dusman} comes down on you with all its weight, the way a throne comes down on a usurper, and its shadow starts swallowing yours." }
  # ---------------------------------------------------------------- Sistem Çekirdeği (EN: the System Core) — bağışıklık sistemi
  ak_surec:
    ad: { tr: "Ak Süreç", en: "White Process" }
    aciklama: { tr: "Sistem Çekirdeği'nin koridorlarında dolaşan, bembeyaz, kusursuz geometrik biçimler: bir küp, bir çokyüzlü, bir dönen halka. Sistem'in bağışıklık hücreleri. Hata ararlar; buldukları her hatayı sarar, eritir ve silerler. Çekirdeğin gözünde, sen bir hatasın.", en: "Blinding white, perfectly geometric shapes that drift through the corridors of the System Core: a cube, a polyhedron, a spinning ring. The System's immune cells. They hunt for errors, and every error they find, they wrap up, dissolve and delete. As far as the Core is concerned, you're an error." }
    kanca: { tr: "Koridorun beyazlığında bir kıvrım beliriyor; bir küp, kendi etrafında dönerek sana yaklaşıyor. Önünde bir satır akıyor: [Tanımsız varlık. Sınıflandırılıyor...]", en: "A fold appears in the whiteness of the corridor: a cube, rotating slowly on its own axis, drifting closer. A line scrolls past in front of it: [Undefined entity. Classifying...]" }
    seviye: 38
    can: 380
    statlar:
      str: 18
      agi: 24
      end: 16
      int: 24
      wis: 18
      per: 24
      wil: 20
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "karanlik"
    zaaf_metin: { tr: "Saf Sistem ışığından yapılmışlar ve yalnızca temiz kodu tanırlar. Karanlık, onların gözünde bozulmuş veridir: dokundukları an kendilerini enfekte sayıp karantinaya alırlar.", en: "They're made of pure System light, and they only recognize clean code. Darkness reads to them as corrupted data: the moment they touch it, they flag themselves as infected and quarantine themselves." }
    saldirilar:
      - id: "silme_dokunusu"
        ad: { tr: "Silme Dokunuşu", en: "Delete Touch" }
        stat: "int"
        taban: 19
        kat: 0.8
        etiketler: ["isik", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} koluna değiyor ve değdiği yerde tenin bir an pikselleşiyor; birkaç satır, sessizce, siliniyor.", en: "{dusman} brushes your arm, and where it touches, your skin pixelates for a second. A few lines of you quietly get deleted." }
      - id: "yama"
        ad: { tr: "Yama", en: "Patch" }
        stat: "wis"
        taban: 16
        kat: 0.7
        etiketler: ["zihin"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} üstüne beyaz bir kare yapıştırıyor: [Yama uygulanıyor]. Bir an hareketlerin, sana ait olmayan bir koda göre işliyor.", en: "{dusman} slaps a white square onto you: [Applying patch]. For a moment, your body runs on code that isn't yours." }
      - id: "inceleme_isareti"
        ad: { tr: "İnceleme İşareti", en: "Flag for Review" }
        stat: "per"
        taban: 14
        kat: 0.7
        etiketler: ["isik", "alan"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} etrafında bir halka çiziyor ve çekirdeğin bütün beyazlığı sana dönüyor; gözlerin bembeyaz bir hatayla doluyor: [İnceleme için işaretlendi].", en: "{dusman} draws a ring around you, and all the white in the Core turns your way. Your eyes fill with one blinding error: [Flagged for review]." }
    xp: 4900
    kredi: 10
    ganimet: { ak_surec_parcasi: 0.45 }
    etiketler: ["sistem", "kukla"]
    boss: false
  karantina:
    ad: { tr: "Karantina", en: "Quarantine" }
    aciklama: { tr: "Sistem Çekirdeği'nin anomaliler için çalıştırdığı en büyük süreç: kendi etrafında yavaşça dönen, iç içe geçmiş beyaz kafeslerden oluşan bir yapı. Sistem'in sana karşı ilk ve son kişisel cevabı. Seni öldürmek için değil, seni hiçbir şeye dokunamayacağın bir yere kapatmak için var.", en: "The biggest process the System Core runs against anomalies: a structure of nested white cages, all turning slowly inside one another. The System's first and last personal answer to you. It isn't built to kill you. It's built to lock you somewhere you can never touch anything again." }
    kanca: { tr: "Önündeki koridor kapanıyor; arkandaki de. Duvarlar, tavan, zemin, hepsi aynı anda içe doğru katlanıyor ve ortada, kafeslerden yapılmış bir şey dönmeye başlıyor. [Anomali yalıtılıyor.]", en: "The corridor ahead of you seals shut. So does the one behind you. Walls, ceiling, floor, all of it folds inward at once, and in the middle, something made of cages starts to turn. [Isolating anomaly.]" }
    seviye: 40
    can: 1000
    statlar:
      str: 30
      agi: 26
      end: 50
      int: 50
      wis: 44
      per: 40
      wil: 52
      cha: 4
    davranis: "temkinli"
    zeki: false
    zaaf: "zihin"
    zaaf_metin: { tr: "Kusursuz bir mantıkla çalışıyor ve kusursuz mantığın da bir dibi var. Ona bir çelişki ver: kendini korumak için onu yok etmen gerektiğini, onu yok edersen Sistem'i koruyacağını. Kafesleri bir an birbirine takılır.", en: "It runs on flawless logic, and flawless logic has a floor. Hand it a contradiction: that to protect itself, it has to let you go; that destroying it is how the System gets protected. Its cages snag on each other for a moment." }
    saldirilar:
      - id: "karantina_hucresi"
        ad: { tr: "Karantina Hücresi", en: "Containment Cell" }
        stat: "int"
        taban: 22
        kat: 0.8
        etiketler: ["isik", "zihin"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} kafeslerinden birini fırlatıyor; beyaz çubuklar etrafında kapanıyor ve hücre daralırken her çubuk tenini dağlıyor.", en: "{dusman} throws out one of its cages. White bars snap shut around you, and as the cell tightens, every bar sears your skin." }
      - id: "sterilizasyon"
        ad: { tr: "Sterilizasyon", en: "Sterilize" }
        stat: "wil"
        taban: 22
        kat: 0.8
        etiketler: ["isik", "alan"]
        durum: { etki: "yanma", sans: 0.45, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} bütün kafeslerini aynı anda yakıyor ve yalıtılmış alan, temizlenecek bir şey gibi, beyaz bir ateşle dolup taşıyor.", en: "{dusman} lights up every one of its cages at once, and the sealed space floods with white fire, like something that needs to be scrubbed clean." }
      - id: "yalitim_duvari"
        ad: { tr: "Yalıtım Duvarı", en: "Isolation Wall" }
        stat: "end"
        taban: 18
        kat: 0.6
        etiketler: ["fiziksel"]
        durum: { etki: "kalkan", sans: 1.0, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} kafeslerini bir duvar gibi önüne diziyor ve seni geri itiyor: [Yalıtım katmanı eklendi].", en: "{dusman} stacks its cages into a wall between you and shoves you back: [Isolation layer added]." }
    xp: 15300
    kredi: 50
    ganimet: { karantina_anahtari: 0.6, canavar_cekirdegi: 1.0, ak_surec_parcasi: 0.6 }
    etiketler: ["sistem", "elit"]
    boss: false
    fazlar:
      - esik: 50
        metin: { tr: "Kafesler yavaşlıyor ve aralarından bir pencere süzülüyor: [Yalıtım başarısız. İkinci protokole geçiliyor.] Karantina artık seni kapatmaya çalışmıyor; seni küçültmeye çalışıyor.", en: "The cages slow down, and a window slips out between them: [Isolation failed. Escalating to secondary protocol.] Quarantine isn't trying to lock you up anymore. It's trying to make you smaller." }
        guclenme: { int: 5, wil: 5 }
        saldiri:
          id: "geri_yukleme"
          ad: { tr: "Geri Yükleme", en: "Restore Point" }
          stat: "int"
          taban: 25
          kat: 0.8
          etiketler: ["zihin"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} seni bir geri yükleme noktasına döndürmeye çalışıyor; bir an yeniden Entegrasyon sabahındasın, güçsüz ve korkmuş, mavi bir pencerenin önünde.", en: "{dusman} tries to roll you back to a restore point, and for one moment you're standing in the morning of Integration again, weak and scared, in front of a blue window." }
      - esik: 20
        metin: { tr: "Kafeslerin hepsi aynı anda çatlıyor ve çatlakların arasından, Sistem'in sesi değil, yorgun bir başka ses duyuluyor: [Bu döngüde de olmadı.] Sonra Karantina bütün gücünü tek bir noktaya, sana, topluyor.", en: "Every cage cracks at once, and through the cracks comes a voice that isn't the System's. A tired one: [Not this loop either.] Then Quarantine pulls everything it has into a single point. You." }
        guclenme: { end: 5, wil: 6 }
        saldiri:
          id: "tam_silme"
          ad: { tr: "Tam Silme", en: "Hard Delete" }
          stat: "wil"
          taban: 28
          kat: 0.8
          etiketler: ["isik", "alan"]
          durum: { etki: "kanama", sans: 0.5, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} tek bir beyaz ışın oluyor ve ışının geçtiği yerde, bir an için, hiçbir şey yok; ne koridor, ne zemin, ne de senin bir parçan.", en: "{dusman} becomes a single white beam, and wherever the beam passes, for a moment, there is nothing: no corridor, no floor, and not one piece of you." }
  # ---------------------------------------------------------------- Kule bantları (EN: the Spire) — kat seviyesine ölçeklenir
  kat_sarmasigi:
    ad: { tr: "Kat Sarmaşığı", en: "Stairvine" }
    aciklama: { tr: "Kule'nin iç boşluğunda, katları birbirine bağlayan merdiven kuyusunda yukarı doğru tırmanan bir sarmaşık. Hiç güneş görmedi; Sistem'in mavi ışığıyla besleniyor ve tırmananların ayaklarına dolanıp onları kendi gübresi yapıyor.", en: "A vine that climbs the hollow core of the Spire, up the stairwell that ties the floors together. It has never seen the sun. It lives on the System's blue light, and it tangles climbers' ankles and turns them into fertilizer." }
    kanca: { tr: "Basamağa bastığında altından bir yaprak kıpırdıyor. Sonra merdiven korkuluğuna sarılı bütün sarmaşık, bir yılan gibi, sana doğru başını kaldırıyor.", en: "When you step onto the stair, a leaf stirs under your boot. Then the whole vine wrapped around the railing lifts its head toward you like a snake." }
