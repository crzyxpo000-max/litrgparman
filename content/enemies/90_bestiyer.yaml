        durum: { etki: "yanma", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kolunu kapıyor; dişlerinin değdiği yerde kumaş tutuşuyor, deri cızırdıyor.", en: "{dusman} clamps onto your arm. Where its teeth touch, your sleeve catches fire and your skin sizzles." }
      - id: "curuf_silkme"
        ad: { tr: "Cüruf Silkme", en: "Slag Shake" }
        stat: "end"
        taban: 11
        kat: 0.7
        etiketler: ["ates", "alan"]
        durum: { etki: "kor", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} ıslak bir köpek gibi silkiniyor; etrafına kıvılcım ve kızgın cüruf damlaları saçılıyor.", en: "{dusman} shakes itself off like a wet dog, and a spray of sparks and molten droplets flies in every direction." }
    xp: 2100
    kredi: 6
    ganimet: { curuf_cekirdegi: 0.4, kul: 0.5 }
    etiketler: ["hayvan", "ates"]
    boss: false
  catal_cene:
    ad: { tr: "Çatal Çene", en: "Forkjaw" }
    aciklama: { tr: "Lonca'nın depolarında yük taşıyan bir forklift. Bir sabah kendiliğinden çalıştı ve bir daha durmadı. Çatalları çene gibi açılıp kapanır; geri vites uyarısı ötmeye başladığında iş işten geçmiştir.", en: "A forklift that used to haul pallets in the Guild's warehouses. One morning it started up on its own and never shut off. Its forks open and close like a jaw, and by the time you hear the backup beeper, it's already too late." }
    kanca: { tr: "Deponun karanlığında bir motor öksürerek çalışıyor, iki far yanıyor. Çatallar yerden bir metre kalkıp tam göğüs hizanda duruyor.", en: "Somewhere in the dark of the warehouse, an engine coughs to life. Two headlights snap on. The forks rise about three feet off the floor and stop, level with your chest." }
    seviye: 25
    can: 330
    statlar:
      str: 20
      agi: 10
      end: 18
      int: 6
      wis: 4
      per: 12
      wil: 13
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Bir aküyle bir yığın kablo sayesinde yaşar. Güçlü bir akım devrelerini yakar; çatallar kilitlenir, motor boğulur.", en: "It runs on one battery and a nest of wiring. A strong jolt fries its circuits, locks the forks in place, and stalls the engine." }
    saldirilar:
      - id: "catal_saplama"
        ad: { tr: "Çatal Saplama", en: "Tine Skewer" }
        stat: "str"
        taban: 15
        kat: 0.9
