  ara_kat_devi:
    ad: { tr: "Sahanlık Devi", en: "Landing Colossus" }
    aciklama: { tr: "Kule'nin bazı katları arasında, tavanı üç kat yüksekliğinde geniş sahanlıklar var. O sahanlıklardan birinde, tavana değecek boyda, tek gözlü bir dev oturuyor. Kule onu oraya bir kapı gibi koydu: geçmek için ya onu yenersin ya da Kule'nin gözünden düşersin.", en: "Between some of the Spire's floors there are wide landings with ceilings three stories high. On one of them sits a one-eyed giant tall enough to scrape that ceiling. The Spire put it there like a door: to get past, you beat it, or you fall out of the Spire's favor." }
    kanca: { tr: "Sahanlığın ortasında bir tepe yükseliyor. Tepe ayağa kalkıyor, kalkıyor, kalkıyor; başı tavana sürtünüyor. Tek göz açılıyor ve bütün sahanlık o gözün ışığıyla doluyor.", en: "There's a hill in the middle of the landing. The hill stands up, and up, and up, until its head scrapes the ceiling. A single eye opens, and the whole landing fills with its light." }
    seviye: 38
