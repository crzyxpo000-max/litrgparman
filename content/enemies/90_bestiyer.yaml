    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Pervaneleri, kameraları ve küçük akülerinden ibaretler. Tek bir şimşek bütün sürünün devrelerini aynı anda yakar; hepsi yağmur damlası gibi düşer.", en: "They're nothing but rotors, cameras and tiny batteries. One bolt of lightning fries the whole flock's circuits at once, and they drop like rain." }
