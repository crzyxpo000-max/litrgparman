        durum: { etki: "kanama", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} senin darbeni kılıcının düzüyle saptırıyor ve aynı hareketin devamında bileğinden omzuna kadar açıyor.", en: "{dusman} turns your swing aside with the flat of its blade and, in the same motion, opens you up from wrist to shoulder." }
      - id: "kalkan_ezmesi"
        ad: { tr: "Kalkan Ezmesi", en: "Shield Bash" }
        stat: "end"
        taban: 19
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} kalkanını yüzüne çarpıyor; bir an yalnızca metalin uğultusunu duyuyorsun.", en: "{dusman} smashes its shield into your face, and for a moment all you can hear is the metal ringing." }
      - id: "selam"
