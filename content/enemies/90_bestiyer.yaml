  kuyu_sakini:
    ad: { tr: "Kuyu Sakini", en: "Shaftdweller" }
    aciklama: { tr: "Kule'nin ortasından, içinde hiç asansör olmamış bir asansör boşluğu geçer; ne dibi görünür ne tepesi. O boşluğun duvarlarında, ızgaraların ardında, kolları gövdesinin üç katı uzun bir şey yaşar. Yukarı çıkanları seyreder, arada bir de birini içeri alır.", en: "There's an elevator shaft running up the middle of the Spire that never had an elevator in it. You can't see the bottom or the top. On the walls of that shaft, behind the grates, lives something with arms three times longer than its body. It watches people climb. Every so often, it takes one inside." }
    kanca: { tr: "Duvardaki havalandırma ızgarasından ılık bir hava durmadan akıyor. Derken akış kesiliyor, çünkü ızgaranın ardında bir şey nefesini tutmuş. Uzun gri parmaklar çubukları içeriden kavrıyor.", en: "A steady, warm draft breathes out of the vent grate in the wall. Then it stops, because something behind the grate is holding its breath. Long gray fingers curl around the bars from the inside." }
    seviye: 26
    can: 300
    statlar:
      str: 18
      agi: 16
      end: 13
      int: 8
      wis: 12
      per: 18
      wil: 14
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Boşluğun duvarlarına yalnız parmak uçlarıyla tutunur, kuyudan yükselen sıcak hava da onu taşır. Ters, sert bir rüzgâr onu tutunduğu yerden koparır; dipsiz kuyuya düşmemek için bütün kollarıyla duvara yapışması gerekir.", en: "It clings to the shaft walls by its fingertips, riding the warm air that rises up the well. A hard crosswind rips it off its holds, and it has to throw every arm it has at the wall just to keep from falling into the bottomless dark." }
