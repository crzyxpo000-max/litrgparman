        metin: { tr: "{dusman} çevrendeki suyu ağırlaştırıyor; birden yüz kulaç dibe inmiş gibi göğsün çöküyor, kulakların çınlıyor.", en: "{dusman} makes the water around you heavy. Your chest caves in like you just dropped a hundred fathoms, and your ears start to ring." }
    xp: 12660
