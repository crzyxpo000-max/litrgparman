        etiketler: ["karanlik", "zihin"]
        durum: { etki: "korku", sans: 0.45, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} bir hüküm okuyor. Dilini bilmiyorsun ama anlamını kemiklerin kavrıyor: diz çök ya da yok ol.", en: "{dusman} hands down a decree. You don't speak the language, but your bones understand it fine: kneel, or stop existing." }
      - id: "golge_kilic"
        ad: { tr: "Gölge Kılıç", en: "Shade Blade" }
        stat: "agi"
        taban: 21
        kat: 0.8
        etiketler: ["karanlik", "yakin"]
        durum: { etki: "kanama", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} yerdeki gölgenden, senin kendi gölgenden bir kılıç çekip sana saplıyor.", en: "{dusman} draws a sword out of the shadow at your feet, your own shadow, and runs you through with it." }
      - id: "bos_koltuk"
        ad: { tr: "Boş Koltuk", en: "The Empty Seat" }
        stat: "int"
