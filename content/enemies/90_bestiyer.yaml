# Parti L1 — Bestiyer: Perde 2–4 bölge düşmanları, çok-evren dünyaları, Sistem Çekirdeği ve Kule bantları.
# Tasarım seviyesi 20–40; bölgelerde dünya seviyesine, Kule'de kat seviyesine ölçeklenir (combat/EnemyScaling.kt).
# Sıradan düşman XP'si ≈ seviyenin bir sonraki seviye ihtiyacının %10'u (tür çarpanı ≈ 1), sürü ≈ %7, elit ≈ %20.
dusmanlar:
  # ---------------------------------------------------------------- Kıyıkent · Liman (EN: the Waterfront)
  pas_vatozu:
    ad: { tr: "Pas Vatozu", en: "Rust Ray" }
    aciklama: { tr: "Limanın mazot tabakasının altında büyümüş, kanat açıklığı bir kayık kadar olan bir vatoz. Sırtı gemi sacı gibi paslı; kuyruğundaki diken hâlâ bir zamanlar battığı teknenin akümülatöründen akım çekiyor.", en: "A stingray as wide as a rowboat that grew up under the harbor's diesel slick. Its back is rusted like old hull plating, and the barb on its tail still pulls current from the battery of whatever boat it sank." }
    kanca: { tr: "İskelenin altındaki su bir an kararıyor; sonra o karanlık, kenarları dalgalanarak kıpırdıyor ve iki küçük göz yüzeye çıkıyor.", en: "The water under the dock goes dark for a second. Then the dark ripples at the edges and moves, and two small eyes break the surface." }
    seviye: 21
    can: 250
    statlar:
      str: 12
      agi: 15
      end: 10
      int: 14
      wis: 9
      per: 13
      wil: 10
      cha: 2
    davranis: "temkinli"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Soğuk suya alışık değil; liman bunca yıldır mazotla ılık. Buz kanatlarını kaskatı eder ve vatoz bir tahta gibi dibe çöker.", en: "It's not built for cold water; this harbor has run warm with diesel for years. Ice locks its wings stiff, and it sinks like a dropped plank." }
    saldirilar:
      - id: "pas_dikeni"
        ad: { tr: "Pas Dikeni", en: "Rust Barb" }
        stat: "agi"
        taban: 12
        kat: 0.8
        etiketler: ["fiziksel", "delici"]
        durum: { etki: "zehir", sans: 0.35, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} sudan bir kırbaç gibi fırlıyor ve paslı kuyruk dikeni baldırına saplanıyor; yara anında morarıyor.", en: "{dusman} snaps out of the water like a whip, and its rusted barb punches into your calf. The wound goes purple on the spot." }
      - id: "akim_kanadi"
        ad: { tr: "Akım Kanadı", en: "Current Wing" }
        stat: "int"
        taban: 13
        kat: 0.8
        etiketler: ["simsek", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} kanatlarını ıslak tahtaya yapıştırıyor; iskele boyunca bir vızıltı koşuyor ve dişlerin birbirine kilitleniyor.", en: "{dusman} plasters its wings flat against the wet planks. A hum runs the length of the dock, and your teeth clamp shut on their own." }
      - id: "camur_bulutu"
        ad: { tr: "Dip Çamuru", en: "Silt Cloud" }
        stat: "per"
        taban: 9
        kat: 0.6
        etiketler: ["menzilli"]
        durum: { etki: "kor", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} dibe vurup kanatlarını çırpıyor; yüzüne kara, mazot kokulu bir çamur bulutu patlıyor.", en: "{dusman} slaps the bottom with both wings, and a cloud of black, diesel-stinking silt blows up into your face." }
    xp: 2400
    kredi: 12
    ganimet: { vatoz_dikeni: 0.45, canli_bakir: 0.15, kaya_tuzu: 0.3 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  halat_bogan:
    ad: { tr: "Halat Boğan", en: "Hawser Strangler" }
    aciklama: { tr: "Limandaki çürümüş palamar halatları, ağ parçaları ve yosun birbirine dolanıp bir yılanbalığı biçimi almış. Babalardan sarkar, bir bacağın suya değmesini bekler.", en: "Rotten mooring lines, net scraps and kelp, wound together into the shape of an eel. It hangs off the bollards and waits for a leg to dip into the water." }
    kanca: { tr: "Babaya sarılı kalın halat, rüzgar yokken gerilip gevşiyor. Bir kere. İki kere. Nefes alır gibi.", en: "The thick line looped around the bollard draws tight and goes slack, with no wind at all. Once. Twice. Like it's breathing." }
    seviye: 22
    can: 290
    statlar:
      str: 18
      agi: 11
      end: 16
      int: 4
      wis: 8
      per: 11
      wil: 14
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Halatlarının yarısı eski katranla kaplı. Islak görünüyor ama içi kuru; bir alev değince fitil gibi tutuşuyor ve düğümleri çözülüyor.", en: "Half its rope is coated in old tar. It looks soaked, but it's dry inside: one flame and it catches like a wick and the knots start letting go." }
    saldirilar:
      - id: "palamar_dugumu"
        ad: { tr: "Palamar Düğümü", en: "Bowline" }
        stat: "str"
        taban: 13
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} bileklerine iki tur atıyor ve bir denizci düğümü gibi tek hamlede sıkılıyor; kolların gövdene yapışıyor.", en: "{dusman} throws two turns around your wrists and cinches down like a sailor's knot. Your arms are pinned to your sides." }
      - id: "yosun_bogumu"
        ad: { tr: "Yosun Boğumu", en: "Kelp Choke" }
        stat: "str"
        taban: 11
        kat: 0.8
        etiketler: ["fiziksel"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} boynuna kayıyor; yosunun altındaki kırık olta iğneleri derine sürtünerek sıkıyor.", en: "{dusman} slides up around your neck and squeezes, and the broken fishhooks buried in the kelp drag across your skin." }
      - id: "dibe_cekme"
        ad: { tr: "Dibe Çekme", en: "Undertow" }
        stat: "wil"
        taban: 10
        kat: 0.8
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} ayak bileğini kavrayıp seni iskelenin kenarına sürüklüyor; bir an, yeşil suyun içinde yukarı bakan yüzleri görüyorsun.", en: "{dusman} grabs your ankle and drags you to the edge of the dock, and for a second you see faces in the green water, looking up." }
    xp: 2600
    kredi: 10
    ganimet: { katranli_halat: 0.5, mavi_yosun: 0.3, hurda: 0.3 }
    etiketler: ["deniz", "yaratik"]
    boss: false
  demir_gagali_marti:
    ad: { tr: "Demir Gagalı Martı", en: "Ironbill Gull" }
    aciklama: { tr: "Kıyametten önce de simidini kaparlardı; şimdi parmağını kapıyorlar. Gagaları demir, çığlıkları bir sis düdüğü kadar yüksek. Asla tek gelmezler ve asla doymazlar.", en: "They used to steal your fries off the pier. Now they steal fingers. Iron beaks, screams as loud as a foghorn. They never come alone, and they're never full." }
    kanca: { tr: "Vapurun direğindeki martılar aynı anda başlarını sana çeviriyor. Biri çığlık atıyor. Sonra hepsi.", en: "Every gull on the ferry's mast turns its head toward you at the same time. One of them screams. Then all of them do." }
    seviye: 20
    can: 170
    statlar:
      str: 9
      agi: 16
      end: 7
      int: 5
      wis: 6
      per: 15
      wil: 7
      cha: 3
    davranis: "suru"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Sürü, çığlıklarla birbirine yön veriyor. Onları bastıran tek bir sağır edici ses, sürüyü bir avuç şaşkın kuşa böler.", en: "The flock steers by its own screaming. Drown them out with one deafening sound and the flock breaks into a handful of confused birds." }
    saldirilar:
      - id: "demir_gaga"
        ad: { tr: "Demir Gaga", en: "Iron Bill" }
        stat: "agi"
        taban: 11
        kat: 0.8
        etiketler: ["fiziksel", "delici"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} pike yapıp demir gagasını omzuna gömüyor ve bir parça etle havalanıyor.", en: "{dusman} dives, drives its iron bill into your shoulder, and lifts off with a piece of you." }
      - id: "kapip_kacma"
        ad: { tr: "Kapıp Kaçma", en: "Snatch and Run" }
        stat: "agi"
        taban: 9
        kat: 0.7
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} kulağının dibinden geçerken pençeleriyle yanağını sıyırıyor ve kahkahaya benzeyen bir sesle uzaklaşıyor.", en: "{dusman} buzzes your ear, rakes your cheek with its feet, and wheels off making a sound a lot like laughter." }
      - id: "ciglik_firtinasi"
        ad: { tr: "Çığlık Fırtınası", en: "Shrieking Squall" }
        stat: "wil"
        taban: 8
        kat: 0.7
        etiketler: ["ses", "alan"]
        durum: { etki: "korku", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} sürünün ortasından bir çığlık koparıyor ve bütün kanatlar etrafında bir kasırga gibi dönmeye başlıyor.", en: "{dusman} lets out a scream from the middle of the flock, and every wing in the sky starts wheeling around you like a twister." }
    xp: 1500
    kredi: 6
    ganimet: { demir_gaga: 0.4, hurda: 0.2 }
    etiketler: ["hayvan", "deniz"]
    boss: false
  dip_balikcisi:
    ad: { tr: "Dip Balıkçısı", en: "Bottom Angler" }
    aciklama: { tr: "Körfezin dibinde, batık vapurun gölgesinde yaşayan, römorkör büyüklüğünde bir fener balığı. Alnından sarkan yem, uzaktan bir kamaranın sarı penceresine benziyor; geceleri limana bakan herkes o pencerede birinin el salladığını görüyor.", en: "A tugboat-sized anglerfish that lives at the bottom of the bay in the shadow of the sunken ferry. The lure hanging off its forehead looks, from a distance, like the yellow window of a cabin, and at night everyone who looks out over the harbor sees someone waving from it." }
    kanca: { tr: "Suyun altında sıcak, sarı bir ışık yanıyor: bir ev penceresi gibi davetkâr. Işığın arkasında, o pencerenin yüz katı genişliğinde bir karanlık açılıyor.", en: "A warm yellow light glows under the water, inviting as a kitchen window. Behind it, a darkness a hundred times wider than the window opens up." }
    seviye: 27
    can: 640
    statlar:
      str: 30
      agi: 14
      end: 28
      int: 22
      wis: 20
      per: 26
      wil: 24
      cha: 18
    davranis: "temkinli"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Ömrünü zifiri karanlıkta geçirmiş; kendi yemi dışında ışık görmemiş. Gerçek, keskin bir ışık gözlerini yakar ve yemi sönük bir et parçasına döner.", en: "It has spent its life in pitch black and never seen any light but its own lure. Real, hard light sears its eyes and turns that lure into a dull lump of meat." }
    saldirilar:
      - id: "fener_yemi"
        ad: { tr: "Fener Yemi", en: "The Lure" }
        stat: "cha"
        taban: 14
        kat: 0.8
        etiketler: ["zihin", "isik"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} yemini yavaşça sallıyor. Pencerede biri var; tanıdık biri. Farkında olmadan suya doğru bir adım atıyorsun.", en: "{dusman} sways its lure, slow and gentle. There's someone in the window. Someone you know. You take a step toward the water before you notice." }
      - id: "dip_agzi"
        ad: { tr: "Dip Ağzı", en: "Abyssal Gulp" }
        stat: "str"
        taban: 18
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.4, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} sudan bir çene olarak yükseliyor; iğne gibi dişlerin arasında bir an kalıyorsun ve seni tükürdüğünde yarın onun ağzında kalıyor.", en: "{dusman} comes up out of the water as nothing but jaw. For a second you're inside a cage of needle teeth, and when it spits you out, part of you stays behind." }
      - id: "kara_su"
        ad: { tr: "Kara Su", en: "Blackwater" }
        stat: "wil"
        taban: 14
        kat: 0.8
        etiketler: ["karanlik", "alan"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} mürekkep gibi kara bir bulut salıyor; iskelenin ışıkları birer birer kayboluyor ve geriye yalnızca o sarı pencere kalıyor.", en: "{dusman} bleeds out an ink-black cloud. The lights on the dock go out one by one until there's nothing left but that yellow window." }
    xp: 7540
    kredi: 70
    ganimet: { fener_yemi: 0.6, canavar_cekirdegi: 1.0, buyuk_iyilesme_iksiri: 0.2 }
    etiketler: ["hayvan", "deniz", "elit"]
    boss: false
    fazlar:
      - esik: 50
        metin: { tr: "Yemi titreyip sönüyor. Dip Balıkçısı ilk kez gözleriyle bakmak zorunda kalıyor ve gördüğü şeyden, yani senden, hoşlanmıyor. Kendini iskeleye fırlatıyor; tahtalar ağırlığı altında inliyor.", en: "Its lure flickers and dies. For the first time, the angler has to look with its own eyes, and it doesn't like what it sees: you. It hurls itself up onto the dock, and the planks groan under it." }
        guclenme: { str: 4, agi: 4 }
        saldiri:
          id: "karaya_vurus"
          ad: { tr: "Karaya Vuruş", en: "Beaching" }
          stat: "str"
          taban: 20
          kat: 0.8
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} bütün gövdesiyle iskeleye çarpıyor; tahtalar havaya fırlıyor ve sen de onlarla birlikte.", en: "{dusman} slams its whole body down on the dock. The planks go flying, and so do you." }
  # ---------------------------------------------------------------- Kıyıkent · Kordon (EN: the Esplanade)
  kopuk_ruhu:
    ad: { tr: "Köpük Ruhu", en: "Spindrift" }
    aciklama: { tr: "Lodos dalgaları kordonu döverken taşlara çarpıp savrulan köpükten doğmuş bir şey. İnsan boyunda, tuzlu ve soğuk; kırık banklara, devrilmiş fener direklerine yaslanıp dalga sesine benzer bir sesle ağlıyor.", en: "Something born from the foam that flies off the seawall when the winter storms pound the Esplanade. Human-sized, salty and cold. It leans against broken benches and toppled lampposts and cries in a voice that sounds like surf." }
    kanca: { tr: "Kordona vuran bir dalga geri çekilmiyor. Köpüğü taşların üstünde toplanıyor, doğruluyor ve sana doğru bir adım atıyor.", en: "A wave breaks over the Esplanade and doesn't go back. Its foam gathers on the stones, stands up, and takes a step toward you." }
    seviye: 22
    can: 230
    statlar:
      str: 8
      agi: 15
      end: 9
      int: 16
      wis: 14
      per: 10
      wil: 12
      cha: 2
    davranis: "temkinli"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Bedeni tuzlu su ve hava. Tuzlu su akımı çok iyi iletir: tek bir şimşek onu içinden kaynatır ve köpük, sönmüş bir bira gibi dağılır.", en: "Its body is salt water and air, and salt water carries current beautifully. One bolt of lightning boils it from the inside, and the foam goes flat like a stale beer." }
    saldirilar:
      - id: "tuzlu_kopuk"
        ad: { tr: "Tuzlu Köpük", en: "Brine Froth" }
        stat: "int"
        taban: 11
        kat: 0.8
        etiketler: ["menzilli", "alan"]
        durum: { etki: "kor", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kollarını açıyor ve yüzüne bir avuç tuzlu köpük çarpıyor; gözlerin yanıyor, dünya beyaza kesiyor.", en: "{dusman} flings its arms wide and a slap of salt foam hits you full in the face. Your eyes burn and the world goes white." }
      - id: "bogan_dalga"
        ad: { tr: "Boğan Dalga", en: "Drowning Surge" }
        stat: "wis"
        taban: 14
        kat: 0.8
        etiketler: ["alan"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} çöküp bir dalgaya dönüşüyor ve seni kordonun taşlarına yapıştırıyor; ağzın, burnun tuzlu suyla doluyor.", en: "{dusman} collapses into a breaker and pins you to the seawall stones. Your mouth and nose fill with brine." }
      - id: "ayaz_serpintisi"
        ad: { tr: "Ayaz Serpintisi", en: "Cold Spray" }
        stat: "int"
        taban: 12
        kat: 0.8
        etiketler: ["buz", "menzilli"]
        bekleme: 0
        metin: { tr: "{dusman} üstüne buz gibi bir serpinti savuruyor; ıslak giysilerin anında kaskatı kesiliyor.", en: "{dusman} hurls an ice-cold spray over you, and your wet clothes go stiff in an instant." }
    xp: 2600
    kredi: 8
    ganimet: { kopuk_tuzu: 0.5, kaya_tuzu: 0.4 }
    etiketler: ["deniz", "ruh"]
    boss: false
  fener_guvesi:
    ad: { tr: "Fener Güvesi", en: "Lamplight Moth" }
    aciklama: { tr: "Kordondaki sokak lambalarının etrafında toplanan, kanatları bir şemsiye kadar açılan güveler. Işığa delice tutkunlar: bir el feneri, bir çakmak, bir göz bebeği. Hepsi aynı ölçüde ışık sayılır.", en: "Moths with wings as wide as an umbrella that swarm the Esplanade's streetlamps. They are crazy for light: a flashlight, a lighter, the shine in your eyes. It all counts." }
    kanca: { tr: "Kordonun yanmayan lambalarından birinin etrafında gri bir bulut dönüyor. Elindeki ışığı fark ettiği an dönmeyi kesiyor.", en: "A gray cloud is circling one of the Esplanade's dead streetlamps. The second it notices the light in your hand, it stops circling." }
    seviye: 21
    can: 160
    statlar:
      str: 6
      agi: 14
      end: 7
      int: 10
      wis: 9
      per: 13
      wil: 8
      cha: 2
    davranis: "suru"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Kanatları büyük ama tüy kadar hafif. Sert bir rüzgar sürüyü denize savurur; ıslanan bir güve bir daha havalanamaz.", en: "Big wings, feather-light bodies. A hard gust throws the whole swarm out over the water, and a moth that gets wet never flies again." }
    saldirilar:
      - id: "kanat_tozu"
        ad: { tr: "Kanat Tozu", en: "Wing Dust" }
        stat: "int"
        taban: 10
        kat: 0.7
        etiketler: ["alan", "zehir"]
        durum: { etki: "kor", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} başının üstünde çırpınıyor ve gözlerine gümüşi, kaşındıran bir toz yağıyor.", en: "{dusman} beats its wings right over your head, and silvery, itching dust rains into your eyes." }
      - id: "hortum"
        ad: { tr: "Emici Hortum", en: "Proboscis" }
        stat: "str"
        taban: 10
        kat: 0.8
        etiketler: ["yakin", "can_emme"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} göz kapağının dibine konuyor ve kıvrık hortumunu açıp tam gözünün kenarına saplıyor.", en: "{dusman} lands right at the edge of your eyelid, uncoils its proboscis, and stabs it into the corner of your eye." }
      - id: "isik_cilginligi"
        ad: { tr: "Işık Çılgınlığı", en: "Light Frenzy" }
        stat: "wil"
        taban: 9
        kat: 0.7
        etiketler: ["zihin", "alan"]
        durum: { etki: "korku", sans: 0.3, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} ışığının etrafında öyle bir hızla dönmeye başlıyor ki fırtına kanatlardan ibaret bir hortuma dönüşüyor ve sen o hortumun tam ortasındasın.", en: "{dusman} starts circling your light so fast the swarm turns into a tornado made of wings, and you're standing in the eye of it." }
    xp: 1700
    kredi: 5
    ganimet: { guve_tozu: 0.5, goz_cicegi: 0.1 }
    etiketler: ["bocek"]
    boss: false
  kemik_fayton:
    ad: { tr: "Kemik Fayton", en: "Bone Carriage" }
    aciklama: { tr: "Entegrasyon sabahı kordonda turist taşıyan bir fayton. At öldü, arabacı öldü, yolcular öldü; fayton durmadı. Atın iskeleti hâlâ koşumlarda, göz çukurlarında fener yağıyla yanan iki alev; araba hâlâ aynı turu atıyor ve önüne çıkanı ezip geçiyor.", en: "On the morning of Integration, this carriage was hauling tourists down the Esplanade. The horse died. The driver died. The passengers died. The carriage never stopped. The horse's skeleton is still in harness with two lamp-oil flames burning in its eye sockets, and the carriage still runs the same loop, flattening anything in its way." }
    kanca: { tr: "Kordonun ucundan toynak sesleri geliyor; nal sesi değil, kemiğin taşa çarpışı. Ardından bir çıngırak.", en: "Hoofbeats come from the far end of the Esplanade. Not horseshoes: bone on stone. Then a little bell." }
    seviye: 23
    can: 300
    statlar:
      str: 18
      agi: 13
      end: 15
      int: 5
      wis: 6
      per: 11
      wil: 14
      cha: 3
    davranis: "agresif"
