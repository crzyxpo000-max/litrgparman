    aciklama: { tr: "Kule'nin alt katlarından birinin kurallarını uygulamak için yaratılmış bir bekçi; bir şekilde katından düştü ve kapısından çıkıp meydana indi. Hâlâ kendi katının kurallarını uyguluyor ama artık yanlış yerde: meydandaki herkes onun gözünde kural ihlali.", en: "A warden built to enforce the rules on one of the Spire's lower floors. Somehow it fell off its floor, walked out the door and wandered down into the plaza. It's still enforcing its floor's rules, just in the wrong place, and to it, everyone in the plaza is a violation." }
    kanca: { tr: "Önüne mavi bir pencere açılıyor ama bu senin Sistem'in değil: [Kat 7 Kuralı: Koşmak yasaktır.] Pencerenin arkasında, kırık bir zırh içinde bir şey sana doğru yürüyor.", en: "A blue window pops up in front of you, but it isn't your System's: [Floor 7 Rule: No running.] Behind the window, something in cracked armor is walking toward you." }
