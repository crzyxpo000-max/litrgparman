  # ---------------------------------------------------------------- Çok-evren · Batık Takımada (EN: the Drowned Reach)
  bogulmus_canci:
    ad: { tr: "Boğulmuş Çancı", en: "Drowned Bellringer" }
    aciklama: { tr: "Batık Takımada halkından geriye kalanlardan biri. Hasat geldiğinde adalarının gelgit çanlarını çalıp halkını uyarmaya çalışmış; deniz yükselmiş, halk gitmiş, o çalmayı sürdürmüş. Hâlâ çalar. Çanının sesini duyan her yabancıyı geç kalmış bir uyarının cevabı sanır.", en: "One of the last of the people of the Drowned Reach. When the Harvest came, it rang the tide bells of its island to warn everyone. The sea rose, the people were gone, and it kept ringing. It's still ringing. Every stranger who hears the bell, it takes for an answer to a warning that came far too late." }
    kanca: { tr: "Suyun altından boğuk bir çan sesi yükseliyor; bir kez, bir kez daha. Derken yosun kaplı bir kule tepesinden, iki kolu da çan ipine dolanmış bir beden sana bakıyor.", en: "A muffled bell tolls from under the water. Once. Once more. Then, from the top of a weed-choked tower, a figure with both arms wound into a bell rope looks down at you." }
    seviye: 33
    can: 400
    statlar:
      str: 20
      agi: 12
      end: 22
      int: 14
      wis: 20
      per: 14
      wil: 24
      cha: 4
    davranis: "temkinli"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Çanla, ipine sarılı tuzlu beden aynı devrenin parçalarıdır. Şimşek tunç çandan girip ipten akar; çancı da çan da aynı anda susar.", en: "The bell and the brine-soaked body wound into its rope are one circuit. Lightning goes into the bronze and runs down the rope, and the ringer and the bell go quiet at the same time." }
    saldirilar:
      - id: "gelgit_cani"
        ad: { tr: "Gelgit Çanı", en: "Tide Bell" }
        stat: "wil"
        taban: 16
