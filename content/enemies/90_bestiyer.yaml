        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} tahtı gösterince bir an kendini orada otururken görüyorsun: ayaklarının altında dünyalar, önünde diz çökmüş Kadimler. Görüntü silindiğinde hâlâ yerinden kıpırdayamıyorsun.", en: "{dusman} gestures at the throne, and for a moment you see yourself sitting in it, worlds beneath you, Ancients kneeling at your feet. When the vision fades, you still can't move." }
    xp: 14600
    kredi: 150
    ganimet: { taht_golgesi_parcasi: 0.6, canavar_cekirdegi: 1.0, sessizlik_muhru: 0.4 }
