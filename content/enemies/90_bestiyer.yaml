    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Kule'nin kuru, durgun havasında büyüdü; yaprakları kâğıt gibi. Bir alev bütün merdiven boyunca tırmanır ve sarmaşığı kökünden söker.", en: "It grew up in the Spire's dry, dead air, and its leaves are like paper. A flame will race up the whole stairwell and burn it out by the root." }
