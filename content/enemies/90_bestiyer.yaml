      - id: "dusus_hatirasi"
        ad: { tr: "Düşüşün Hatırası", en: "The Fall Remembered" }
        stat: "wil"
        taban: 17
        kat: 0.8
        etiketler: ["zihin", "karanlik"]
        durum: { etki: "korku", sans: 0.45, sure: 2 }
