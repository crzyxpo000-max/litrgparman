        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} teberini yay çizerek savuruyor; ne ıslık var ne rüzgâr sesi. Yalnızca böğründe açılan yara.", en: "{dusman} sweeps its halberd in a long arc. No whistle, no rush of air, nothing at all. Just the cut opening in your side." }
      - id: "diz_coktur"
        ad: { tr: "Diz Çöktürme", en: "Kneel" }
        stat: "wil"
        taban: 17
        kat: 0.8
