        metin: { tr: "{dusman} boynuna dalıyor ve iki metal dikeni tenine dayıyor; bir çatırtı, ardından kasılan bütün bir beden.", en: "{dusman} dives at your neck and presses two metal prongs to your skin. One crackle, then every muscle in your body seizes." }
      - id: "projektor"
