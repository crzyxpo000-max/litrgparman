  sinav_sovalyesi:
    ad: { tr: "Sınav Şövalyesi", en: "Proving Knight" }
    aciklama: { tr: "Kule'nin yüksek katlarından birinde bir sahanlığı bekleyen içi boş bir zırh. İçinde bir zamanlar kim vardıysa çoktan gitti; zırhın tek varlık sebebi önünden geçmek isteyeni sınamaktır. Yenilenleri değil, hak etmeyenleri öldürür.", en: "An empty suit of armor that guards a landing high up in the Spire. Whoever wore it is long gone, and the armor exists for one reason: to test anyone who wants to get past. It doesn't kill the ones who lose. It kills the ones who don't deserve to." }
    kanca: { tr: "Sahanlığın ortasındaki zırh kılıcını kaldırıp seni selamlıyor; eski, ağır, kusursuz bir selam bu. Sonra kılıcın ucu sana dönüyor.", en: "The armor in the middle of the landing raises its sword and salutes you, an old, heavy, flawless salute. Then the point of the blade swings toward you." }
    seviye: 33
    can: 820
    statlar:
      str: 40
      agi: 28
      end: 36
      int: 14
      wis: 20
      per: 30
      wil: 34
      cha: 10
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "İçi boş zırhı bir arada tutan, eklemlerinden akan ince, mavi bir akımdır. Şimşek o akımı boğar; zırh bir an gerçekten boş kalır, parçaları yere dökülmek üzeredir.", en: "What holds the empty armor together is a thin blue current running through its joints. Lightning drowns that current out, and for one moment the suit really is empty, every piece about to hit the floor." }
    saldirilar:
      - id: "dogru_hamle"
        ad: { tr: "Doğru Hamle", en: "Riposte" }
        stat: "agi"
        taban: 20
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} darbeni kılıcının yassı yüzüyle savuşturuyor, aynı hareketin devamında kolunu bileğinden omzuna kadar yarıyor.", en: "{dusman} turns your swing aside with the flat of its blade and, in the same motion, opens you up from wrist to shoulder." }
      - id: "kalkan_ezmesi"
        ad: { tr: "Kalkan Ezmesi", en: "Shield Bash" }
        stat: "end"
        taban: 19
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} kalkanını yüzüne çarpıyor; bir an yalnızca metalin uğultusunu duyuyorsun.", en: "{dusman} smashes its shield into your face, and for a moment all you can hear is the metal ringing." }
      - id: "selam"
        ad: { tr: "Selam", en: "The Salute" }
        stat: "wil"
        taban: 14
        kat: 0.6
        etiketler: ["zihin"]
        durum: { etki: "hizlanma", sans: 1.0, sure: 2 }
