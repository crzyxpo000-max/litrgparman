  hasat_kirpintisi:
    ad: { tr: "Hasat Kırpıntısı", en: "Harvest Chaff" }
    aciklama: { tr: "Bir dünyanın özü hasat edildiğinde geride kalan şey: insana benzeyen ama içi boş, gri, rengi alınmış kabuklar. Ne öldüler ne yaşıyorlar; yalnızca bir zamanlar sahip oldukları şeyi, ışığı, sıcaklığı, adı, başkalarında arıyorlar.", en: "What's left when a world's essence gets harvested: gray, hollow shells shaped like people, every bit of color taken out of them. They're not dead and they're not alive. They just go looking in other people for what they used to have: light, warmth, a name." }
    kanca: { tr: "Sığlıkta gri figürler duruyor; dalgalar bacaklarına çarpıyor ama hiçbiri sallanmıyor. Hepsi aynı anda başını sana çeviriyor. Yüzleri yok; yalnızca yüzün olması gereken yerde bir açlık var.", en: "Gray figures stand in the shallows. The waves slap their legs, and none of them so much as sways. They all turn their heads toward you at once. They have no faces, only a hunger where a face should be." }
    seviye: 32
    can: 280
    statlar:
      str: 12
      agi: 16
      end: 10
      int: 14
      wis: 12
      per: 13
      wil: 16
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Hasat onlardan ışığı aldı; ışığa hem açlar hem de dayanamıyorlar. Güçlü bir ışık onları doyurur, doyan kırpıntı da kül gibi dağılır.", en: "The Harvest took their light, and now they crave it and can't stand it at the same time. Hit them with real light and they get their fill, and a full husk falls apart like ash." }
    saldirilar:
      - id: "gri_dokunus"
        ad: { tr: "Gri Dokunuş", en: "Gray Touch" }
        stat: "wil"
        taban: 14
        kat: 0.8
