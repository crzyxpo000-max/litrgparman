  kayip_ekip:
    ad: { tr: "Kayıp Ekip", en: "Lost Party" }
    aciklama: { tr: "Kule'ye birlikte giren ve birlikte geri dönmeyen bir tırmanış ekibi. Hâlâ birbirlerine iple bağlılar; hâlâ tırmanıyorlar. Kask lambaları yanıyor, telsizleri cızırdıyor ve yollarına çıkan her canlıyı ekibe katmaya çalışıyorlar.", en: "A climbing party that went into the Spire together and never came back out. They're still roped together. They're still climbing. Their headlamps are on, their radios crackle, and they try to recruit every living thing they meet." }
    kanca: { tr: "Merdivenden yukarı bir sıra kask lambası yaklaşıyor; hepsi aynı ritimle sallanıyor. Telsizden cızırtılı bir ses geliyor: \"Bir kişi daha. Bağlayın.\"", en: "A line of headlamps comes up the stairs, all of them bobbing in the same rhythm. A radio crackles: \"One more. Rope 'em in.\"" }
    seviye: 30
    can: 340
    statlar:
      str: 18
      agi: 14
      end: 16
      int: 10
      wis: 8
      per: 14
      wil: 18
      cha: 4
    davranis: "suru"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Kask lambalarını hiç söndürmüyorlar ama o ışık onları yakmıyor; zayıf, sarı bir ışık. Gerçek, güçlü bir ışık onlara Kule'nin dışını, güneşi hatırlatır ve ip çözülür.", en: "Their headlamps never go out, but that weak yellow light doesn't hurt them. Real, strong light reminds them of the outside, of the sun, and the rope comes loose." }
