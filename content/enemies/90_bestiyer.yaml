  sinav_sovalyesi:
    ad: { tr: "Sınav Şövalyesi", en: "Proving Knight" }
    aciklama: { tr: "Kule'nin yüksek katlarından birinde, bir sahanlığı bekleyen, içi boş bir zırh. Bir zamanlar orada kim vardıysa çoktan gitti; zırh ise yalnızca bir şey için var: önünden geçmek isteyeni sınamak. Yenilenleri öldürmüyor. Hak etmeyenleri öldürüyor.", en: "An empty suit of armor that guards a landing high up in the Spire. Whoever wore it is long gone, and the armor exists for one reason: to test anyone who wants to get past. It doesn't kill the ones who lose. It kills the ones who don't deserve to." }
    kanca: { tr: "Sahanlığın ortasındaki zırh kılıcını kaldırıyor ve sana selam veriyor; eski, ağır, kusursuz bir selam. Sonra kılıcın ucu sana dönüyor.", en: "The armor in the middle of the landing raises its sword and salutes you, an old, heavy, flawless salute. Then the point of the blade swings toward you." }
    seviye: 33
    can: 820
    statlar:
      str: 40
      agi: 28
      end: 36
      int: 14
      wis: 20
      per: 30
      wil: 34
      cha: 10
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "İçi boş zırhı birbirine bağlayan şey, eklemlerinden akan ince bir mavi akım. Bir şimşek o akımı boğar; zırh bir an için gerçekten boştur ve parçaları yere düşmek üzeredir.", en: "What holds the empty armor together is a thin blue current running through its joints. Lightning drowns that current out, and for one moment the suit really is empty, every piece about to hit the floor." }
    saldirilar:
      - id: "dogru_hamle"
        ad: { tr: "Doğru Hamle", en: "Riposte" }
        stat: "agi"
        taban: 20
        kat: 0.8
