      int: 17
      wis: 15
      per: 11
      wil: 14
      cha: 3
    davranis: "temkinli"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Kapalı, havasız odalarda güçlü. Sert bir rüzgar onu inceltir, dağıtır; geriye yalnızca hafif bir baş ağrısı kalır.", en: "It's strong in sealed, stale rooms. A hard wind thins it out and scatters it, and all that's left is a mild headache." }
    saldirilar:
      - id: "tiner_nefesi"
        ad: { tr: "Tiner Nefesi", en: "Thinner Breath" }
        stat: "int"
        taban: 12
        kat: 0.8
        etiketler: ["zehir", "alan"]
        durum: { etki: "zehir", sans: 0.45, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} yüzüne sarılıyor; ciğerlerin tatlı, yakıcı bir şeyle doluyor ve öksürmek bile acıtıyor.", en: "{dusman} wraps itself around your face. Your lungs fill with something sweet and burning, and even coughing hurts." }
      - id: "renk_korlugu"
        ad: { tr: "Renk Körlüğü", en: "Color Blind" }
        stat: "wis"
        taban: 10
        kat: 0.7
        etiketler: ["zihin"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gözlerinin önünde dalgalanıyor; dünyanın renkleri birbirine akıyor ve nerede durduğunu bile kestiremiyorsun.", en: "{dusman} ripples in front of your eyes. The colors of the world run together until you can't even tell where you're standing." }
      - id: "parlama"
        ad: { tr: "Parlama", en: "Flashover" }
        stat: "int"
        taban: 16
        kat: 0.8
        etiketler: ["ates", "alan"]
        durum: { etki: "yanma", sans: 0.45, sure: 2 }
        bekleme: 3
        metin: { tr: "Bir yerde bir kıvılcım çakıyor ve {dusman} tek bir gürlemeyle alev alıyor; oda bir anlığına ateşten bir nefes alıyor.", en: "A spark pops somewhere, and {dusman} goes up in one big whump. For an instant, the whole room takes a breath of fire." }
    xp: 3050
    kredi: 8
    ganimet: { boya_ozu: 0.45, cam_sise: 0.4 }
    etiketler: ["ruh", "zehir"]
    boss: false
  yuksek_firin:
    ad: { tr: "Yüksek Fırın", en: "The Blast Furnace" }
    aciklama: { tr: "Sanayinin kalbindeki yüksek fırın, ilk kapı taşmasında kapıdan sızan bir şeyi yuttu ve o şey fırının kendisi oldu. Şimdi kızgın demirden bacaklar üstünde yürüyen, ağzı bir döküm kepçesi, göğsü bir körük olan bir dev. Lonca onu durdurmaya çalışmıyor; etrafına çit çekip içinde ürettiği çeliği topluyor.", en: "During the first gate break, the blast furnace at the heart of the Ironworks swallowed something that crawled out of a Gate, and that something became the furnace. Now it's a giant walking on legs of red-hot iron, with a casting ladle for a mouth and a bellows for a chest. The Guild doesn't try to stop it. They fenced it in and harvest the steel it makes." }
    kanca: { tr: "Fabrikanın çatısındaki bacadan siyah bir duman yükseliyor ve tuğla duvarlar içeriden kızarmaya başlıyor. Sonra duvarlardan biri yürüyor.", en: "Black smoke rolls out of the stack on the mill roof, and the brick walls start to glow from the inside. Then one of the walls starts walking." }
    seviye: 30
    can: 820
    statlar:
      str: 38
      agi: 10
      end: 42
      int: 32
      wis: 18
      per: 18
      wil: 32
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Ateşi sürekli yanmak zorunda; ısısı düşerse demir bacakları kasılıp çatlar. Buz, kızgın gövdesine değdiği her yerde onu kendi kendine kırar.", en: "Its fire has to keep burning. If the heat drops, the iron in its legs contracts and cracks. Wherever ice touches that red-hot body, the metal tears itself apart." }
    saldirilar:
      - id: "dokum_kepcesi"
        ad: { tr: "Döküm Kepçesi", en: "Ladle Pour" }
        stat: "str"
        taban: 21
        kat: 0.8
        etiketler: ["ates", "yakin"]
        durum: { etki: "yanma", sans: 0.45, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} kepçe ağzını eğiyor ve üstüne bembeyaz, erimiş demir döküyor; çevrendeki beton bile cızırdıyor.", en: "{dusman} tips its ladle-mouth and pours white-hot iron down on you. Even the concrete around you sizzles." }
      - id: "curuf_yagmuru"
        ad: { tr: "Cüruf Yağmuru", en: "Slag Rain" }
        stat: "int"
        taban: 19
        kat: 0.8
        etiketler: ["ates", "alan"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} bacasından göğe bir kıvılcım sütunu fırlatıyor ve gökyüzünden sıcak, kara bir yağmur yağmaya başlıyor.", en: "{dusman} blasts a column of sparks out of its stack, and a hot black rain starts falling out of the sky." }
      - id: "koruk"
        ad: { tr: "Körük", en: "Bellows" }
        stat: "end"
        taban: 17
        kat: 0.7
        etiketler: ["ruzgar", "ates"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} göğsündeki körüğü bir kere, derin bir nefes gibi çalıştırıyor; kavurucu bir hava dalgası seni ayaklarından koparıp duvara yapıştırıyor.", en: "{dusman} works the bellows in its chest once, like a deep breath, and a blast of scorching air lifts you off your feet and pins you to the wall." }
    xp: 9120
    kredi: 100
    ganimet: { firin_yuregi: 0.6, canavar_cekirdegi: 1.0, curuf_cekirdegi: 0.6 }
    etiketler: ["mekanik", "ates", "elit"]
    boss: false
    fazlar:
      - esik: 50
        metin: { tr: "Fırının kapağı patlayarak açılıyor. İçinde, eriyik demirin ortasında, kapıdan gelen o şey kıvranıyor: kırmızı, çok gözlü bir çekirdek. Isı dalgası o kadar yoğun ki havanın kendisi titriyor.", en: "The furnace door blows open. Inside, in the middle of the molten iron, the thing that came out of the Gate is writhing: a red core with far too many eyes. The heat is so thick the air itself is shaking." }
        guclenme: { str: 4, int: 5 }
        saldiri:
          id: "erime_noktasi"
          ad: { tr: "Erime Noktası", en: "Meltdown" }
