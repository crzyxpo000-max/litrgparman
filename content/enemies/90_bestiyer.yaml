    aciklama: { tr: "Kule'nin sınav katlarında, kaidelerinin üstünde kımıldamadan bekleyen taş heykeller. Bir tırmanıcı katın kuralını çiğneyince ya da bir sınavı yarıda bırakınca canlanırlar. Kaidelerinde Sistem'in dilinde yazılmış tek bir soru vardır; cevabını kimse bilmez.", en: "Stone statues that stand motionless on their plinths on the Spire's trial floors. They come to life when a climber breaks a floor's rule or walks away from a trial halfway through. Each plinth has a single question carved on it in the System's language. Nobody knows the answer." }
    kanca: { tr: "Kaidedeki yazı mavi mavi parlamaya başlıyor. Taştan bir göz kapağı ağır ağır kalkıyor; heykel yüzyılların tozunu silkeleyerek kaidesinden iniyor.", en: "The carving on the plinth starts to glow blue. A stone eyelid lifts, slow and heavy, and the statue steps down off its plinth, shaking off centuries of dust." }
