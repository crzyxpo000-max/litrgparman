        metin: { tr: "{dusman} ızgaranın ardından bir kol uzatıyor; bir dirsek, bir dirsek daha… Kol bir türlü bitmiyor ve sonunda bileğini kavrıyor.", en: "{dusman} reaches an arm out through the grate. Then an elbow. Then another elbow. The arm just keeps coming, and finally it closes around your wrist." }
      - id: "bosluga_cekme"
        ad: { tr: "Boşluğa Çekme", en: "Into the Shaft" }
