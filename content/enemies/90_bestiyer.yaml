        etiketler: ["isik", "menzilli"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} tam yüzüne bembeyaz bir projektör tutuyor; göz kapaklarının arkasında bile mor lekeler dans ediyor.", en: "{dusman} hits you right in the face with a white floodlight. Purple blotches dance even behind your eyelids." }
      - id: "alarm"
