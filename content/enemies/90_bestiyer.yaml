        metin: { tr: "{dusman} kıpırdayınca alevin içindeki yüz çığlık atıyor. Ses camdan değil kafatasının içinden geliyor, bir dünyanın son anını anlatıyor.", en: "{dusman} flickers, and the face in the flame screams. The sound doesn't come through the crystal. It comes from inside your skull, and it's describing a world's last moment." }
      - id: "fitil_cekme"
