  # ---------------------------------------------------------------- Çok-evren · Pirinç Kervan (EN: the Brass Caravan)
  gumruk_muhafizi:
    ad: { tr: "Gümrük Muhafızı", en: "Tariff Warden" }
    aciklama: { tr: "Pirinç Kervan'ın güvertelerinde dolaşan, pirinç zırhlı muhafızlar. Tüccar halkın kendi askerleri değiller: Kadimler'e boyun eğdiğinde kervana dayatılan bir kurumun parçası. Her yolcuya, her yüke, her nefese bir vergi biçiyorlar; ödeyemeyenin elindekine el koyuyorlar.", en: "Brass-armored wardens who patrol the decks of the Brass Caravan. They aren't the merchant people's own soldiers. They belong to an office the Ancients forced on the Caravan the day it bent the knee. They levy a duty on every passenger, every crate, every breath, and whatever you can't pay for, they confiscate." }
    kanca: { tr: "Önüne pirinç bir mızrak iniyor. Kaskın arkasından, mekanik bir sesle, ezberlenmiş bir cümle geliyor: \"Beyan edilmemiş yük. Değerlendirme başlıyor.\"", en: "A brass pike drops across your path. From behind the helmet comes a mechanical voice reciting something it's said ten thousand times: \"Undeclared cargo. Assessment in progress.\"" }
    seviye: 35
    can: 450
    statlar:
      str: 22
      agi: 16
      end: 24
      int: 18
      wis: 16
      per: 22
      wil: 20
      cha: 14
    davranis: "temkinli"
    zeki: true
    zaaf: "simsek"
    zaaf_metin: { tr: "Pirinç zırh güzel ama iletken; içindeki tüccar bedeni ise kervanın kuru havasında yıllardır su görmemiş. Bir şimşek zırhın içinde dolaşır ve onu kendi mühürleriyle kaynatır.", en: "Brass armor is gorgeous, and it conducts. The merchant body inside hasn't seen water in years of dry Caravan air. Lightning races around inside the armor and welds the warden into its own seals." }
    saldirilar:
