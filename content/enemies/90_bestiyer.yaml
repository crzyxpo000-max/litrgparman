  yasli_cam:
    ad: { tr: "Yaşlı Çam", en: "The Old Growth" }
    aciklama: { tr: "Tepenin en yüksek noktasında, kıyametten önce de yüzlerce yaşında olan bir çam. Entegrasyonda uyandı. Yükselenler onu bir işaret saydı; dallarına mavi kurdeleler, Sistem pencerelerinin dökümleri ve \"yakıt\" sayılanların eşyalarını asıyorlar. Kökleri villaların temellerini çatlatıyor ve ağaç her geçen gün biraz daha aç.", en: "A Douglas fir at the very top of the Heights that was already a few hundred years old before the world ended. It woke up on Integration Day. The Ascended took it for a sign: they hang its branches with blue ribbons, printouts of System windows, and the belongings of the people they counted as fuel. Its roots are cracking the foundations of the mansions, and every day the tree gets a little hungrier." }
    kanca: { tr: "Rüzgar yok ama çamın dalları sallanıyor; asılı kurdeleler, ayakkabılar, bir çocuk gözlüğü birbirine çarpıp tıkırdıyor. Gövdedeki kabuk bir göz kapağı gibi aralanıyor.", en: "There's no wind, but the fir's branches are swaying. The things hanging from them, ribbons, sneakers, a kid's glasses, knock together and click. The bark on the trunk slides open like an eyelid." }
    seviye: 30
    can: 900
    statlar:
      str: 34
      agi: 6
      end: 44
      int: 18
      wis: 32
      per: 20
      wil: 36
      cha: 4
    davranis: "temkinli"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Yüzyılların reçinesi gövdesinde birikmiş. Bir alev değerse yaşlı çam bir meşale gibi yanar; asılı adakların ilk tutuştuğu yer de onun en zayıf yeridir.", en: "Centuries of pitch have pooled in its trunk. Get a flame on it and the Old Growth goes up like a torch, and the offerings hanging from its branches are where it catches first." }
