  basamak_yiyen:
    ad: { tr: "Basamak Yiyen", en: "Stair Eater" }
    aciklama: { tr: "Kule'nin basamaklarını yiyerek yaşayan, halka ağızlı, gri bir kurt. Yediği basamakların yerine kendi bedenini koyuyor; bu yüzden Kule'de bazı merdivenler yumuşaktır ve bazı merdivenler nefes alır.", en: "A gray, ring-mouthed worm that lives by eating the Spire's stairs. It replaces every step it eats with a piece of its own body, which is why some staircases in the Spire are soft, and some of them breathe." }
    kanca: { tr: "Önündeki on basamak aynı anda, hafifçe, aşağı doğru çöküyor. Sonra yükseliyor. Merdiven bir yutkunma sesi çıkarıyor.", en: "The next ten steps all sag at once, just slightly. Then they rise again. The staircase makes a sound like a swallow." }
