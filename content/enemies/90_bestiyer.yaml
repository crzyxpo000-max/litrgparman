  # ---------------------------------------------------------------- Sistem Çekirdeği (EN: the System Core) — bağışıklık sistemi
  ak_surec:
    ad: { tr: "Ak Süreç", en: "White Process" }
    aciklama: { tr: "Sistem Çekirdeği'nin koridorlarında dolaşan bembeyaz, kusursuz geometrik biçimler: bir küp, bir çokyüzlü, dönen bir halka. Sistem'in bağışıklık hücreleridirler. Hata ararlar; buldukları her hatayı sarıp eritir, silerler. Çekirdeğin gözünde sen de bir hatasın.", en: "Blinding white, perfectly geometric shapes that drift through the corridors of the System Core: a cube, a polyhedron, a spinning ring. The System's immune cells. They hunt for errors, and every error they find, they wrap up, dissolve and delete. As far as the Core is concerned, you're an error." }
    kanca: { tr: "Koridorun beyazlığında bir kıvrım beliriyor; bir küp kendi çevresinde dönerek sana yaklaşıyor. Önünden bir satır akıyor: [Tanımsız varlık. Sınıflandırılıyor...]", en: "A fold appears in the whiteness of the corridor: a cube, rotating slowly on its own axis, drifting closer. A line scrolls past in front of it: [Undefined entity. Classifying...]" }
    seviye: 38
    can: 380
    statlar:
      str: 18
      agi: 24
      end: 16
      int: 24
      wis: 18
      per: 24
      wil: 20
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "karanlik"
    zaaf_metin: { tr: "Saf Sistem ışığından yapılmışlardır ve yalnız temiz kodu tanırlar. Karanlık onların gözünde bozuk veridir; ona dokundukları an kendilerini enfekte sayıp karantinaya alırlar.", en: "They're made of pure System light, and they only recognize clean code. Darkness reads to them as corrupted data: the moment they touch it, they flag themselves as infected and quarantine themselves." }
    saldirilar:
      - id: "silme_dokunusu"
        ad: { tr: "Silme Dokunuşu", en: "Delete Touch" }
        stat: "int"
        taban: 19
        kat: 0.8
        etiketler: ["isik", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} koluna değiyor; değdiği yerde tenin bir an pikselleşiyor, birkaç satır sessizce siliniyor.", en: "{dusman} brushes your arm, and where it touches, your skin pixelates for a second. A few lines of you quietly get deleted." }
      - id: "yama"
        ad: { tr: "Yama", en: "Patch" }
        stat: "wis"
        taban: 16
        kat: 0.7
        etiketler: ["zihin"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} üstüne beyaz bir kare yapıştırıyor: [Yama uygulanıyor]. Bir an hareketlerin sana ait olmayan bir kodla işliyor.", en: "{dusman} slaps a white square onto you: [Applying patch]. For a moment, your body runs on code that isn't yours." }
      - id: "inceleme_isareti"
        ad: { tr: "İnceleme İşareti", en: "Flag for Review" }
        stat: "per"
        taban: 14
        kat: 0.7
        etiketler: ["isik", "alan"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} çevrende bir halka çizince çekirdeğin bütün beyazlığı sana dönüyor; gözlerin bembeyaz bir hatayla doluyor: [İnceleme için işaretlendi].", en: "{dusman} draws a ring around you, and all the white in the Core turns your way. Your eyes fill with one blinding error: [Flagged for review]." }
    xp: 4900
    kredi: 10
    ganimet: { ak_surec_parcasi: 0.45 }
    etiketler: ["sistem", "kukla"]
    boss: false
  karantina:
    ad: { tr: "Karantina", en: "Quarantine" }
    aciklama: { tr: "Sistem Çekirdeği'nin anomaliler için çalıştırdığı en büyük süreç: kendi çevresinde ağır ağır dönen, iç içe geçmiş beyaz kafeslerden bir yapı. Sistem'in sana verdiği ilk ve son kişisel cevaptır. Varlık sebebi seni öldürmek değil, hiçbir şeye dokunamayacağın bir yere kapatmaktır.", en: "The biggest process the System Core runs against anomalies: a structure of nested white cages, all turning slowly inside one another. The System's first and last personal answer to you. It isn't built to kill you. It's built to lock you somewhere you can never touch anything again." }
    kanca: { tr: "Önündeki koridor kapanıyor, ardından arkandaki. Duvarlar, tavan, zemin hep birden içe katlanıyor; ortada kafeslerden yapılmış bir şey dönmeye başlıyor. [Anomali yalıtılıyor.]", en: "The corridor ahead of you seals shut. So does the one behind you. Walls, ceiling, floor, all of it folds inward at once, and in the middle, something made of cages starts to turn. [Isolating anomaly.]" }
    seviye: 40
    can: 1000
    statlar:
      str: 30
      agi: 26
      end: 50
      int: 50
      wis: 44
      per: 40
      wil: 52
      cha: 4
    davranis: "temkinli"
    zeki: false
    zaaf: "zihin"
    zaaf_metin: { tr: "Kusursuz bir mantıkla çalışır; kusursuz mantığın da bir dibi vardır. Ona bir çelişki ver: kendi varlığını korumak için seni bırakması gerektiğini, Sistem'i korumanın yolunun da onu yok etmek olduğunu söyle. Kafesleri bir an birbirine takılır.", en: "It runs on flawless logic, and flawless logic has a floor. Hand it a contradiction: that to protect itself, it has to let you go; that destroying it is how the System gets protected. Its cages snag on each other for a moment." }
    saldirilar:
      - id: "karantina_hucresi"
        ad: { tr: "Karantina Hücresi", en: "Containment Cell" }
        stat: "int"
        taban: 22
        kat: 0.8
        etiketler: ["isik", "zihin"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} kafeslerinden birini fırlatıyor; beyaz çubuklar çevrende kapanıyor, hücre daraldıkça her çubuk tenini dağlıyor.", en: "{dusman} throws out one of its cages. White bars snap shut around you, and as the cell tightens, every bar sears your skin." }
      - id: "sterilizasyon"
        ad: { tr: "Sterilizasyon", en: "Sterilize" }
        stat: "wil"
        taban: 22
        kat: 0.8
        etiketler: ["isik", "alan"]
        durum: { etki: "yanma", sans: 0.45, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} bütün kafeslerini birden tutuşturuyor; yalıtılmış alan, temizlenmesi gereken bir şeymiş gibi beyaz bir ateşle dolup taşıyor.", en: "{dusman} lights up every one of its cages at once, and the sealed space floods with white fire, like something that needs to be scrubbed clean." }
      - id: "yalitim_duvari"
        ad: { tr: "Yalıtım Duvarı", en: "Isolation Wall" }
        stat: "end"
        taban: 18
        kat: 0.6
        etiketler: ["fiziksel"]
        durum: { etki: "kalkan", sans: 1.0, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} kafeslerini bir duvar gibi önüne diziyor ve seni geri itiyor: [Yalıtım katmanı eklendi].", en: "{dusman} stacks its cages into a wall between you and shoves you back: [Isolation layer added]." }
    xp: 15300
    kredi: 50
    ganimet: { karantina_anahtari: 0.6, canavar_cekirdegi: 1.0, ak_surec_parcasi: 0.6 }
    etiketler: ["sistem", "elit"]
    boss: false
    fazlar:
      - esik: 50
        metin: { tr: "Kafesler yavaşlıyor, aralarından bir pencere süzülüyor: [Yalıtım başarısız. İkinci protokole geçiliyor.] Karantina artık seni kapatmaya değil, küçültmeye çalışıyor.", en: "The cages slow down, and a window slips out between them: [Isolation failed. Escalating to secondary protocol.] Quarantine isn't trying to lock you up anymore. It's trying to make you smaller." }
        guclenme: { int: 5, wil: 5 }
        saldiri:
          id: "geri_yukleme"
          ad: { tr: "Geri Yükleme", en: "Restore Point" }
          stat: "int"
          taban: 25
          kat: 0.8
          etiketler: ["zihin"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} seni bir geri yükleme noktasına döndürmeye çalışıyor. Bir an yeniden Entegrasyon sabahındasın; güçsüz, korku içinde, mavi bir pencerenin önünde duruyorsun.", en: "{dusman} tries to roll you back to a restore point, and for one moment you're standing in the morning of Integration again, weak and scared, in front of a blue window." }
      - esik: 20
        metin: { tr: "Kafeslerin hepsi birden çatlıyor; çatlakların arasından Sistem'in değil, başka ve yorgun bir sesin sözleri duyuluyor: [Bu döngüde de olmadı.] Sonra Karantina bütün gücünü tek bir noktada, sende topluyor.", en: "Every cage cracks at once, and through the cracks comes a voice that isn't the System's. A tired one: [Not this loop either.] Then Quarantine pulls everything it has into a single point. You." }
        guclenme: { end: 5, wil: 6 }
        saldiri:
          id: "tam_silme"
          ad: { tr: "Tam Silme", en: "Hard Delete" }
          stat: "wil"
          taban: 28
          kat: 0.8
