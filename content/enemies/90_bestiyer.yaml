          taban: 24
          kat: 0.8
          etiketler: ["ates", "alan"]
          durum: { etki: "yanma", sans: 0.55, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} açık kapağından içindeki cehennemi bir nefes gibi üstüne üflüyor; ter damlaları daha teninden ayrılmadan buharlaşıyor.", en: "{dusman} breathes the hell inside it out through its open door, and the sweat on your skin turns to steam before it can drip." }
  # ---------------------------------------------------------------- Kıyıkent · Tepe (EN: the Heights)
  recine_ayisi:
    ad: { tr: "Reçine Ayısı", en: "Pitchback Bear" }
    aciklama: { tr: "Tepedeki çamlıktan inen, sırtı katman katman donmuş reçineyle zırhlanmış bir ayı. Villaların bahçelerinde, boşaltılmış havuzların dibinde uyuyor; kahverengi kürkü reçinenin altında bir böcek gibi hapsolmuş.", en: "A bear that came down out of the fir woods on the Heights, its back armored in layer after layer of hardened pitch. It sleeps at the bottom of drained swimming pools in the big houses' backyards, its brown fur trapped under the resin like a bug in amber." }
    kanca: { tr: "Boş havuzun dibinde amber renginde bir tepe yatıyor. Yaklaştıkça tepe nefes alıyor ve reçine kabuğu bir kayanın çatlaması gibi çıtırdıyor.", en: "There's an amber-colored mound lying at the bottom of the empty pool. As you get closer, the mound breathes, and the resin shell creaks like a rock splitting." }
    seviye: 25
    can: 360
    statlar:
      str: 22
      agi: 10
      end: 20
      int: 3
      wis: 8
      per: 12
      wil: 14
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "goz"
    zaaf_metin: { tr: "Reçine bütün gövdesini kaplamış ama gözlerini değil; gözlerinin çevresindeki kürk bile hâlâ yumuşak. Göze inen bir darbe onu öfkeyle kör eder.", en: "The pitch covers every inch of it except the eyes; even the fur around them is still soft. A blow to the eye leaves it blind and furious." }
    saldirilar:
      - id: "recineli_pence"
        ad: { tr: "Reçineli Pençe", en: "Pitch Claw" }
