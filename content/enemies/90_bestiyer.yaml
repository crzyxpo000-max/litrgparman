    aciklama: { tr: "Eski Şehir'in kubbeli bedesteninde, kapanmış dükkânların tabelalarından, eski tapu defterlerinden ve kira senetlerinden örülmüş bir şey. Bedestene sığınan herkesten kira alır; parayla değil, ömürle. Defterinde kimin ne kadar borcu kaldığı yazar ve defter hiç yanılmaz.", en: "A thing woven out of shuttered shop signs, old property deeds and rent receipts, living down in the bricked-over streets of Old Town's underground. Everyone who shelters down there pays it rent. Not in money. In years. Its ledger lists exactly how much everyone still owes, and the ledger is never wrong." }
