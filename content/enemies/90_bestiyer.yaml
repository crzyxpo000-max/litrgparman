    zaaf_metin: { tr: "Kule'nin loş koridorlarında doğmuştur; gözleri en küçük ışığı bile toplayacak kadar büyüktür. Ani, güçlü bir ışık onu kör eder ve gizlenmenin sağladığı her üstünlüğü elinden alır.", en: "It was born in the Spire's dim corridors, and its eyes are huge enough to soak up the faintest light. A sudden, strong light blinds it and takes away everything hiding ever gave it." }
