        metin: { tr: "{dusman} çanı yavaşça, bir cenaze temposuyla çalıyor ve suyun altından binlerce ses aynı ezgiyi mırıldanmaya başlıyor. Ezgiyi bilmiyorsun ama sonunu biliyorsun.", en: "{dusman} tolls the bell slow, like a funeral, and from under the water a thousand voices start humming the same tune. You don't know the song, but you know how it ends." }
