  kazan_bocegi:
    ad: { tr: "Kazan Böceği", en: "Boilerbug" }
    aciklama: { tr: "Pirinç Kervan'ın kazan güvertelerinde yaşayan, kedi büyüklüğünde, perçinli böcekler. Bir zamanlar tüccarların yetiştirdiği bakım hayvanlarıydı; boruları temizler, çatlakları tıkarlardı. Kervan Kadimler'e boyun eğip bakımcılarını yitirdiğinden beri yabanileştiler, artık sürü hâlinde her sıcak şeye saldırırlar.", en: "Cat-sized riveted bugs that live on the Brass Caravan's boiler decks. They used to be maintenance animals the merchants bred to scrub pipes and plug cracks. Since the Caravan bent the knee and lost its keepers, they've gone feral, and now they swarm anything warm." }
    kanca: { tr: "Buhar borularının üstünde yüzlerce küçük pirinç kabuk birden tıkırdıyor; biri avucunda bozuk para sallıyor sanki. Derken hepsi borudan iniyor.", en: "On top of the steam pipes, hundreds of little brass shells start clicking at once, like someone's shaking a fistful of loose change. Then they all come down off the pipes." }
