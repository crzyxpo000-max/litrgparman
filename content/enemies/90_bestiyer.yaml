        stat: "str"
        taban: 17
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} çanından sökülmüş tunç tokmağı bir topuz gibi savuruyor ve kalçana indiriyor.", en: "{dusman} swings a bronze clapper torn out of a bell like a mace and slams it into your hip." }
