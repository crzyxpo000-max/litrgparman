        bekleme: 0
        metin: { tr: "{dusman} kılıcını ağır, kusursuz bir yay çizerek indiriyor; taş bıçak keskin değil, ama bu ağırlıkta keskin olması gerekmiyor.", en: "{dusman} brings its sword down in a slow, perfect arc. The stone blade isn't sharp. At that weight, it doesn't need to be." }
      - id: "kaide_darbesi"
        ad: { tr: "Kaide Darbesi", en: "Plinth Stomp" }
        stat: "end"
