  # ---------------------------------------------------------------- Kıyıkent · Kule Dibi (EN: Spire Plaza)
  kule_kirintisi:
    ad: { tr: "Kule Kırıntısı", en: "Spire Shard" }
    aciklama: { tr: "Kule'nin kara camdan dış yüzeyinden kopup meydana düşen parçalar. Yere değdikleri an örümcek gibi bacaklar çıkarıyor ve sürü hâlinde geri tırmanmaya çalışıyorlar; yollarına çıkanı kesip geçiyorlar.", en: "Pieces that crack off the Spire's black glass skin and fall into the plaza. The second they hit the ground they sprout spider legs and try to climb back up in swarms, slicing through anything in the way." }
    kanca: { tr: "Yukarıdan bir çatırtı geliyor. Bir saniye sonra meydana kara bir cam yağmuru iniyor ve kırıklar, düştükleri yerde, bacak çıkarıp doğruluyor.", en: "A crack echoes from way up. A second later, black glass rains down on the plaza, and where the shards land, they grow legs and stand up." }
