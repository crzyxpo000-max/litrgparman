        metin: { tr: "{dusman} ızgaranın arkasından bir kol uzatıyor, sonra bir dirsek, sonra bir dirsek daha; kol bitmiyor ve sonunda bileğini kavrıyor.", en: "{dusman} reaches an arm out through the grate. Then an elbow. Then another elbow. The arm just keeps coming, and finally it closes around your wrist." }
      - id: "bosluga_cekme"
        ad: { tr: "Boşluğa Çekme", en: "Into the Shaft" }
        stat: "str"
        taban: 15
        kat: 0.8
        etiketler: ["fiziksel"]
