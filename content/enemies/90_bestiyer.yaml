          metin: { tr: "{dusman} defterini sertçe kapatıyor. Ses kubbede bir tabut kapağı gibi yankılanıyor ve bir an, ödemediğin bütün borçların ağırlığını omuzlarında hissediyorsun.", en: "{dusman} slams its ledger shut. The sound booms off the brick like a coffin lid, and for one moment you feel the weight of every debt you ever skipped out on." }
  # ---------------------------------------------------------------- Kıyıkent · Sanayi (EN: the Ironworks)
  curuf_iti:
    ad: { tr: "Cüruf İti", en: "Slag Hound" }
    aciklama: { tr: "Sanayinin dökümhanelerinde dolaşan sokak köpekleri, Entegrasyon gecesi erimiş cürufun içinde uyudu ve uyanmadı; ya da uyandı ama artık köpek değildi. Damarlarında kızgın cüruf akıyor, havlamaları körük gibi sıcak.", en: "The strays that used to hang around the Ironworks' foundries curled up in the warm slag on the night of Integration and never woke up. Or they did wake up, and they weren't dogs anymore. Molten slag runs in their veins, and their barks come out hot as a bellows." }
    kanca: { tr: "Dökümhanenin kapısının altından turuncu bir ışık sızıyor ve ışığın içinden, hırlayan dört gölge çıkıyor.", en: "Orange light leaks out under the foundry door, and four growling shapes come out of it." }
    seviye: 24
    can: 220
    statlar:
      str: 15
