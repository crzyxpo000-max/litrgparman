        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} tam gaz üstüne sürüyor; çatallardan biri böğrüne giriyor, seni palet gibi duvara kadar taşıyor.", en: "{dusman} floors it. One tine catches you in the side and it carries you into the wall like a pallet." }
      - id: "kaldir_at"
        ad: { tr: "Kaldır At", en: "Lift and Dump" }
        stat: "str"
        taban: 13
        kat: 0.8
        etiketler: ["fiziksel"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} çatallarını altına sokup seni dört metre havaya kaldırıyor, sonra çatalları devirip beton zemine boşaltıyor.", en: "{dusman} slides its forks under you, hoists you twelve feet up, then tips them and dumps you onto the concrete." }
      - id: "geri_vites"
        ad: { tr: "Geri Vites Uyarısı", en: "Backup Beeper" }
        stat: "wil"
        taban: 10
        kat: 0.7
        etiketler: ["ses", "zihin"]
        durum: { etki: "korku", sans: 0.35, sure: 1 }
        bekleme: 3
        metin: { tr: "Bip. Bip. Bip. {dusman} geri geri sana doğru geliyor; ses her öttüğünde kalbin bir kez atmayı unutuyor.", en: "Beep. Beep. Beep. {dusman} backs toward you, and every time it beeps, your heart forgets to beat once." }
    xp: 3280
    kredi: 12
    ganimet: { catal_disi: 0.4, hurda: 0.6, canli_bakir: 0.2 }
    etiketler: ["mekanik"]
    boss: false
  boya_buhari:
    ad: { tr: "Boya Buharı", en: "Paint-Fume Wraith" }
    aciklama: { tr: "Sanayinin boyahanelerinde, tinerle verniğin, solventin birbirine karıştığı kapalı odalarda yoğunlaşmış zehirli bir bulut. Yüzü yoktur ama gülümsemesi vardır; onu içine çektiğinde başın döner ve onu sevmeye başlarsın.", en: "A toxic cloud that condensed out of the Ironworks' paint shops, in the sealed rooms where thinner, varnish and solvent all ran together. It has no face, but it has a smile. Breathe it in and your head swims, and you start to like it." }
    kanca: { tr: "Boyahanenin kapısını açtığın an keskin, tatlı bir koku burnuna doluyor. Gökkuşağı renginde bir sis kapı aralığından sana doğru eğiliyor.", en: "The second you open the paint-shop door, a sharp, sweet smell fills your nose. A haze in every color of an oil slick leans out through the gap toward you." }
    seviye: 24
    can: 210
    statlar:
      str: 4
      agi: 13
      end: 9
      int: 17
      wis: 15
      per: 11
      wil: 14
      cha: 3
    davranis: "temkinli"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Kapalı, havasız odalarda güçlüdür. Sert bir rüzgâr onu inceltip dağıtır; geriye hafif bir baş ağrısından başka bir şey kalmaz.", en: "It's strong in sealed, stale rooms. A hard wind thins it out and scatters it, and all that's left is a mild headache." }
    saldirilar:
      - id: "tiner_nefesi"
        ad: { tr: "Tiner Nefesi", en: "Thinner Breath" }
        stat: "int"
        taban: 12
        kat: 0.8
        etiketler: ["zehir", "alan"]
        durum: { etki: "zehir", sans: 0.45, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} yüzüne sarılıyor. Ciğerlerin tatlı, yakıcı bir şeyle doluyor; öksürmek bile acı veriyor.", en: "{dusman} wraps itself around your face. Your lungs fill with something sweet and burning, and even coughing hurts." }
      - id: "renk_korlugu"
        ad: { tr: "Renk Körlüğü", en: "Color Blind" }
        stat: "wis"
        taban: 10
        kat: 0.7
        etiketler: ["zihin"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gözlerinin önünde dalgalanırken dünyanın renkleri birbirine akıyor; nerede durduğunu bile kestiremiyorsun.", en: "{dusman} ripples in front of your eyes. The colors of the world run together until you can't even tell where you're standing." }
      - id: "parlama"
        ad: { tr: "Parlama", en: "Flashover" }
        stat: "int"
        taban: 16
        kat: 0.8
        etiketler: ["ates", "alan"]
        durum: { etki: "yanma", sans: 0.45, sure: 2 }
        bekleme: 3
        metin: { tr: "Bir yerde bir kıvılcım çakıyor; {dusman} tek bir gürlemeyle alev alıyor, oda bir anlığına ateşten bir soluk çekiyor.", en: "A spark pops somewhere, and {dusman} goes up in one big whump. For an instant, the whole room takes a breath of fire." }
    xp: 3050
    kredi: 8
    ganimet: { boya_ozu: 0.45, cam_sise: 0.4 }
    etiketler: ["ruh", "zehir"]
    boss: false
  yuksek_firin:
    ad: { tr: "Yüksek Fırın", en: "The Blast Furnace" }
    aciklama: { tr: "Sanayinin kalbindeki yüksek fırın, ilk kapı taşmasında kapıdan sızan bir şeyi yuttu ve o şey fırının kendisi oldu. Artık kızgın demir bacaklar üstünde yürüyen, ağzı döküm kepçesi, göğsü körük olan bir devdir. Lonca onu durdurmaya uğraşmaz; çevresine çit çekip içinde ürettiği çeliği toplar.", en: "During the first gate break, the blast furnace at the heart of the Ironworks swallowed something that crawled out of a Gate, and that something became the furnace. Now it's a giant walking on legs of red-hot iron, with a casting ladle for a mouth and a bellows for a chest. The Guild doesn't try to stop it. They fenced it in and harvest the steel it makes." }
    kanca: { tr: "Fabrikanın çatısındaki bacadan kara bir duman yükselirken tuğla duvarlar içeriden kızarmaya başlıyor. Derken duvarlardan biri yürüyor.", en: "Black smoke rolls out of the stack on the mill roof, and the brick walls start to glow from the inside. Then one of the walls starts walking." }
    seviye: 30
    can: 820
    statlar:
      str: 38
      agi: 10
      end: 42
      int: 32
      wis: 18
      per: 18
      wil: 32
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Ateşinin hiç sönmemesi gerekir; ısısı düşerse demir bacakları kasılıp çatlar. Kızgın gövdesine buz nereye değerse gövde orada kendi kendini kırar.", en: "Its fire has to keep burning. If the heat drops, the iron in its legs contracts and cracks. Wherever ice touches that red-hot body, the metal tears itself apart." }
    saldirilar:
      - id: "dokum_kepcesi"
        ad: { tr: "Döküm Kepçesi", en: "Ladle Pour" }
        stat: "str"
        taban: 21
        kat: 0.8
        etiketler: ["ates", "yakin"]
        durum: { etki: "yanma", sans: 0.45, sure: 3 }
        bekleme: 0
        metin: { tr: "{dusman} kepçe ağzını eğip üstüne bembeyaz erimiş demir döküyor; çevrendeki beton bile cızırdıyor.", en: "{dusman} tips its ladle-mouth and pours white-hot iron down on you. Even the concrete around you sizzles." }
      - id: "curuf_yagmuru"
        ad: { tr: "Cüruf Yağmuru", en: "Slag Rain" }
        stat: "int"
        taban: 19
        kat: 0.8
        etiketler: ["ates", "alan"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} bacasından göğe bir kıvılcım sütunu fırlatıyor; az sonra gökten sıcak, kara bir yağmur inmeye başlıyor.", en: "{dusman} blasts a column of sparks out of its stack, and a hot black rain starts falling out of the sky." }
      - id: "koruk"
        ad: { tr: "Körük", en: "Bellows" }
        stat: "end"
        taban: 17
        kat: 0.7
        etiketler: ["ruzgar", "ates"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} göğsündeki körüğü derin bir nefes gibi bir kez çalıştırıyor; kavurucu bir hava dalgası seni yerden koparıp duvara yapıştırıyor.", en: "{dusman} works the bellows in its chest once, like a deep breath, and a blast of scorching air lifts you off your feet and pins you to the wall." }
    xp: 9120
    kredi: 100
    ganimet: { firin_yuregi: 0.6, canavar_cekirdegi: 1.0, curuf_cekirdegi: 0.6 }
    etiketler: ["mekanik", "ates", "elit"]
    boss: false
    fazlar:
      - esik: 50
        metin: { tr: "Fırının kapağı bir patlamayla açılıyor. İçeride, eriyik demirin ortasında kapıdan gelen o şey kıvranıyor: kırmızı, çok gözlü bir çekirdek. Isı öyle yoğun ki hava titreşip duruyor.", en: "The furnace door blows open. Inside, in the middle of the molten iron, the thing that came out of the Gate is writhing: a red core with far too many eyes. The heat is so thick the air itself is shaking." }
        guclenme: { str: 4, int: 5 }
        saldiri:
          id: "erime_noktasi"
          ad: { tr: "Erime Noktası", en: "Meltdown" }
          stat: "int"
          taban: 24
          kat: 0.8
          etiketler: ["ates", "alan"]
          durum: { etki: "yanma", sans: 0.55, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} açık kapağından içindeki cehennemi bir nefes gibi üstüne üflüyor; ter damlaları daha teninden ayrılmadan buharlaşıyor.", en: "{dusman} breathes the hell inside it out through its open door, and the sweat on your skin turns to steam before it can drip." }
  # ---------------------------------------------------------------- Kıyıkent · Tepe (EN: the Heights)
  recine_ayisi:
    ad: { tr: "Reçine Ayısı", en: "Pitchback Bear" }
    aciklama: { tr: "Tepedeki çamlıktan inmiş, sırtı kat kat donmuş reçineyle zırhlanmış bir ayı. Villaların bahçelerinde, suyu boşaltılmış havuzların dibinde uyur; kahverengi kürkü reçinenin altında bir böcek gibi hapsolmuştur.", en: "A bear that came down out of the fir woods on the Heights, its back armored in layer after layer of hardened pitch. It sleeps at the bottom of drained swimming pools in the big houses' backyards, its brown fur trapped under the resin like a bug in amber." }
    kanca: { tr: "Boş havuzun dibinde kehribar renginde bir tümsek yatıyor. Yaklaştıkça tümsek nefes alıyor, reçine kabuğu çatlayan bir kaya gibi çıtırdıyor.", en: "There's an amber-colored mound lying at the bottom of the empty pool. As you get closer, the mound breathes, and the resin shell creaks like a rock splitting." }
    seviye: 25
    can: 360
    statlar:
      str: 22
      agi: 10
      end: 20
      int: 3
      wis: 8
      per: 12
      wil: 14
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "goz"
    zaaf_metin: { tr: "Reçine bütün gövdesini kaplamıştır ama gözlerini açıkta bırakmıştır; gözlerinin çevresindeki kürk bile hâlâ yumuşaktır. Göze inen bir darbe onu hem kör eder hem öfkeden çılgına çevirir.", en: "The pitch covers every inch of it except the eyes; even the fur around them is still soft. A blow to the eye leaves it blind and furious." }
    saldirilar:
      - id: "recineli_pence"
        ad: { tr: "Reçineli Pençe", en: "Pitch Claw" }
        stat: "str"
        taban: 15
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} reçineyle sertleşmiş pençesini savuruyor; tırnakları göğsünde yan yana dört çizik bırakıyor.", en: "{dusman} swings a paw hardened with pitch, and its claws leave four parallel lines across your chest." }
      - id: "ayi_kucagi"
        ad: { tr: "Ayı Kucağı", en: "Bear Hug" }
        stat: "str"
        taban: 14
        kat: 0.8
        etiketler: ["fiziksel"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} arka ayakları üstüne kalkıp seni göğsüne bastırıyor; reçine giysilerine yapışırken kaburgaların tek tek esniyor.", en: "{dusman} rises onto its hind legs and crushes you to its chest. The sticky pitch glues itself to your clothes, and your ribs flex one by one." }
      - id: "cam_kukremesi"
        ad: { tr: "Çamlık Kükremesi", en: "Timber Roar" }
        stat: "wil"
        taban: 11
        kat: 0.8
        etiketler: ["ses"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} başını kaldırıp kükrüyor; tepedeki bütün köpekler susuyor, villaların camları çerçevelerinde zangırdıyor.", en: "{dusman} throws its head back and roars. Every dog on the Heights goes quiet, and the windows of the big houses rattle in their frames." }
    xp: 3280
    kredi: 9
    ganimet: { recine_kehribari: 0.45, canavar_cekirdegi: 0.12 }
    etiketler: ["hayvan"]
    boss: false
  gozetleme_dronu:
    ad: { tr: "Gözetleme Dronu", en: "Sentinel Drone" }
    aciklama: { tr: "Tepedeki akıllı villaların güvenlik dronları. Sahipleri ya öldü ya kaçtı ama dronlar hâlâ \"izinsiz giriş\" kollar; artık tanımadıkları her yüzü izinsiz sayar, sürü hâlinde avlanırlar.", en: "Security drones from the smart homes up on the Heights. Their owners are dead or long gone, but the drones are still looking for trespassers, and these days every face they don't recognize counts. They hunt in flocks." }
    kanca: { tr: "Tependen ince bir vızıltı geçiyor. Göğsünde kırmızı bir ışık duruyor, ardından bir tane daha, bir tane daha. Derken bir ses: \"Yüz tanınmadı.\"", en: "A thin whine passes overhead. A red dot settles on your chest. Then another one. Then another. And a voice: \"Face not recognized.\"" }
    seviye: 23
    can: 170
    statlar:
      str: 5
      agi: 16
      end: 8
      int: 14
      wis: 6
      per: 18
      wil: 8
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Pervaneden, kameradan ve küçük bir aküden ibarettirler. Tek bir şimşek bütün sürünün devrelerini birden yakar; hepsi yağmur damlası gibi yere düşer.", en: "They're nothing but rotors, cameras and tiny batteries. One bolt of lightning fries the whole flock's circuits at once, and they drop like rain." }
    saldirilar:
      - id: "elektrosok"
        ad: { tr: "Şok Dikeni", en: "Stun Prong" }
