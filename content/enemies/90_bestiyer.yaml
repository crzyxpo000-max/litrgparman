          metin: { tr: "{dusman} tek bir beyaz ışına dönüşüyor; ışının geçtiği yerde bir an hiçbir şey kalmıyor, ne koridor ne zemin ne de senden bir parça.", en: "{dusman} becomes a single white beam, and wherever the beam passes, for a moment, there is nothing: no corridor, no floor, and not one piece of you." }
  # ---------------------------------------------------------------- Kule bantları (EN: the Spire) — kat seviyesine ölçeklenir
  kat_sarmasigi:
    ad: { tr: "Kat Sarmaşığı", en: "Stairvine" }
    aciklama: { tr: "Kule'nin iç boşluğunda, katları birbirine bağlayan merdiven kuyusunda yukarı tırmanan bir sarmaşık. Hiç güneş görmemiştir; Sistem'in mavi ışığıyla beslenir, tırmananların ayaklarına dolanıp onları kendine gübre yapar.", en: "A vine that climbs the hollow core of the Spire, up the stairwell that ties the floors together. It has never seen the sun. It lives on the System's blue light, and it tangles climbers' ankles and turns them into fertilizer." }
    kanca: { tr: "Basamağa bastığında altında bir yaprak kıpırdıyor. Derken korkuluğa sarılı sarmaşığın tamamı, yılan gibi başını sana doğru kaldırıyor.", en: "When you step onto the stair, a leaf stirs under your boot. Then the whole vine wrapped around the railing lifts its head toward you like a snake." }
