  basamak_yiyen:
    ad: { tr: "Basamak Yiyen", en: "Stair Eater" }
    aciklama: { tr: "Kule'nin basamaklarını yiyerek yaşayan, halka ağızlı gri bir kurt. Yediği basamakların yerine kendi bedenini koyar; Kule'de kimi merdivenlerin yumuşak olması, kimilerinin nefes alması bundandır.", en: "A gray, ring-mouthed worm that lives by eating the Spire's stairs. It replaces every step it eats with a piece of its own body, which is why some staircases in the Spire are soft, and some of them breathe." }
    kanca: { tr: "Önündeki on basamak hep birden hafifçe çöküp yeniden kalkıyor. Merdivenden bir yutkunma sesi geliyor.", en: "The next ten steps all sag at once, just slightly. Then they rise again. The staircase makes a sound like a swallow." }
