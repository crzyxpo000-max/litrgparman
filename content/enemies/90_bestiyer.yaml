        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} teberinin sapını yere vurunca salonun bütün ağırlığı omuzlarına çöküyor; dizlerin, sen istemeden mermere değiyor.", en: "{dusman} raps the butt of its halberd on the floor, and the whole weight of the hall comes down on your shoulders. Your knees hit the marble before you can decide not to let them." }
      - id: "huzur_yasasi"
        ad: { tr: "Huzur Yasası", en: "Law of Presence" }
        stat: "wil"
        taban: 15
        kat: 0.8
        etiketler: ["zihin", "karanlik"]
        durum: { etki: "korku", sans: 0.4, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} maskesini sana çevirince boğazın kendiliğinden kapanıyor. Konuşmaya çalışıyorsun, ses çıkmıyor; nefes almaya çalışıyorsun, o da yasakmış gibi.", en: "{dusman} turns its mask toward you, and your throat closes on its own. You try to speak. Nothing. You try to breathe, and that feels forbidden too." }
