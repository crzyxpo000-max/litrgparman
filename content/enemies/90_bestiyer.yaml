        metin: { tr: "{dusman} sana bir kez dokunup geri çekiliyor ve koridorun karanlığına karışıyor. Bir sonraki adımında onu iki yerden birden duyuyorsun.", en: "{dusman} tags you once, pulls back and dissolves into the dark of the corridor. On your next step, you hear it in two places at once." }
