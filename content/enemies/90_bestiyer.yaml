        metin: { tr: "{dusman} dallarındaki adakları birbirine çarptırıyor; tıkırtıların arasında, asılı eşyaların sahiplerinin sesleri yükseliyor. Hepsi aynı şeyi soruyor: neden?", en: "{dusman} knocks the offerings in its branches together, and between the clicks rise the voices of the people those things belonged to. All of them ask the same thing: why?" }
    xp: 9120
