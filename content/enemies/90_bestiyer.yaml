    aciklama: { tr: "Kule'ye ilk tırmananlardan biriydi; hakkı olmayan bir kata çıktı ve oradan düştü. Meydana çarptığı yerde ölmedi: Kule'nin taşı kemiklerine karışıp onu ayağa kaldırdı. Şimdi yeniden tırmanmak için gözünü yukarı diker, meydandaki her canlıyı da yolunda bir basamak sayar.", en: "He was one of the first people to climb the Spire. He made it to a floor he had no business on, and he fell. He didn't die where he hit the plaza. The Spire's stone got into his bones and stood him back up, and now he stares up at it, wanting to climb again, and treats every living thing in the plaza as one more step on the way." }
    kanca: { tr: "Meydanın ortasındaki çatlak kraterde biri oturuyor; sırtı sana dönük, başı Kule'ye kalkık. Dudakları kıpır kıpır, kat numaralarını sayıyor. Otuz ikiye gelince susup sana dönüyor.", en: "Someone's sitting in the cracked crater in the middle of the plaza, back to you, head tipped up at the Spire. His lips are moving. He's counting floors. When he gets to thirty-two, he stops and turns around." }
