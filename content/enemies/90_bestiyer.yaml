  kayip_ekip:
    ad: { tr: "Kayıp Ekip", en: "Lost Party" }
    aciklama: { tr: "Kule'ye birlikte girip birlikte geri dönmeyen bir tırmanış ekibi. Hâlâ birbirlerine iple bağlıdırlar, hâlâ tırmanırlar. Kask lambaları yanar, telsizleri cızırdar; yollarına çıkan her canlıyı ekibe katmaya çalışırlar.", en: "A climbing party that went into the Spire together and never came back out. They're still roped together. They're still climbing. Their headlamps are on, their radios crackle, and they try to recruit every living thing they meet." }
    kanca: { tr: "Merdivenden yukarı, aynı ritimle sallanan bir sıra kask lambası yaklaşıyor. Telsizden cızırtılı bir ses geliyor: \"Bir kişi daha. Bağlayın.\"", en: "A line of headlamps comes up the stairs, all of them bobbing in the same rhythm. A radio crackles: \"One more. Rope 'em in.\"" }
    seviye: 30
    can: 340
    statlar:
      str: 18
