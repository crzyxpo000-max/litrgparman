  kat_avcisi:
    ad: { tr: "Kat Avcısı", en: "Floor Stalker" }
    aciklama: { tr: "Kule'nin kendi yırtıcısı: uzun, eklemleri ters bükülen, gri derili bir şey. Bir katı bir avlak gibi kullanır; tırmananı bir kat boyunca izler, en yorgun anını bekler ve ancak o zaman karanlıktan çıkar.", en: "The Spire's own predator: a long, gray-skinned thing with joints that bend the wrong way. It treats each floor like a hunting ground, follows a climber the whole length of it, waits for the most exhausted moment, and only then steps out of the dark." }
    kanca: { tr: "Bütün kat boyunca bir şeyin seni izlediğini hissettin. Şimdi, nefesini toplamak için durduğun anda, arkandaki karanlıkta iki göz yavaşça açılıyor.", en: "You've felt something watching you the whole length of this floor. Now, the moment you stop to catch your breath, two eyes slowly open in the dark behind you." }
