        bekleme: 3
        metin: { tr: "{dusman} etrafındaki suyu ağırlaştırıyor; sanki birden yüz kulaç dibe inmişsin gibi göğsün çöküyor, kulakların çınlıyor.", en: "{dusman} makes the water around you heavy. Your chest caves in like you just dropped a hundred fathoms, and your ears start to ring." }
    xp: 12660
