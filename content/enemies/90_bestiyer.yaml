    davranis: "suru"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Kask lambalarını hiç söndürmezler ama o zayıf, sarı ışık onları yakmaz. Gerçek, güçlü bir ışık onlara Kule'nin dışını, güneşi hatırlatır; ip de çözülür.", en: "Their headlamps never go out, but that weak yellow light doesn't hurt them. Real, strong light reminds them of the outside, of the sun, and the rope comes loose." }
