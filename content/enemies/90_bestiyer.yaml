    zaaf_metin: { tr: "Mercanı ılık, sığ sularda yaşıyor. Soğuk resifi beyazlatır ve öldürür; ölen mercan sırtında taş gibi ağırlaşır, çobanı dibe çeker.", en: "Its reef lives in warm, shallow water. Cold bleaches the coral and kills it, and dead coral turns to dead weight on its back, dragging the shepherd down." }
    saldirilar:
      - id: "mercan_asasi"
        ad: { tr: "Mercan Asası", en: "Coral Crook" }
