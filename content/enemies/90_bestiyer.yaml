        metin: { tr: "{dusman} boşluğa doğru uzun, alçak bir ses bırakıyor ve kuyu o sesi yüz kat aşağıdan ve yüz kat yukarıdan aynı anda geri yolluyor.", en: "{dusman} lets a long, low moan out into the shaft, and the shaft sends it back from a hundred floors down and a hundred floors up at the same time." }
