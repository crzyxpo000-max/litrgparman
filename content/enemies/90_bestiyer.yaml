  yukselen_mumin:
    ad: { tr: "Yükselen Mümin", en: "Ascended Zealot" }
    aciklama: { tr: "Yükselenler'in tepedeki villalarda yaşayan inançlıları. Sistem'e tapıyor, insanları \"seçilmiş\" ve \"yakıt\" diye ayırıyorlar. Kendi aralarında yaşlılara, hastalara ve zayıflara yakıt deniyor; tepeye gelen yabancılar da genellikle yakıt sayılıyor.", en: "True believers of the Ascended, living in the mansions on the Heights. They worship the System and sort people into two piles: the Chosen and the fuel. Among themselves, the old, the sick and the weak are called fuel, and outsiders who wander up the hill usually get counted as fuel too." }
    kanca: { tr: "Villanın merdivenlerinde beyaz giysili biri bekliyor; gözleri Sistem penceresi gibi mavi parlıyor. Gülümsüyor: \"Hoş geldin. Senin için dua ediyorduk.\"", en: "Someone in white is waiting on the mansion steps, eyes glowing blue as a System window. They smile. \"Welcome. We've been praying for you.\"" }
    seviye: 25
    can: 300
    statlar:
      str: 14
      agi: 12
      end: 14
      int: 12
      wis: 14
      per: 11
      wil: 18
      cha: 13
    davranis: "agresif"
