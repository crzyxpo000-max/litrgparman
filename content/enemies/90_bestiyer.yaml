        metin: { tr: "{dusman} göğsünden ince bir ışık ipliği çekip kendi fitiline ekliyor; alevi bir an daha parlak, sen bir an daha solgun.", en: "{dusman} draws a thin thread of light out of your chest and twists it into its own wick. For a moment its flame burns brighter, and you burn a little dimmer." }
    xp: 6330
    kredi: 18
    ganimet: { kandil_fitili: 0.45, canavar_cekirdegi: 0.15 }
    etiketler: ["ruh", "cok_evren", "kadim"]
    boss: false
  bos_taht_golgesi:
    ad: { tr: "Boş Tahtın Gölgesi", en: "Shadow of the Empty Throne" }
    aciklama: { tr: "Yedi Taht'ın yedi tahtından biri boştur. Orada kimin oturduğundan, neden kalktığından Kadimler söz etmez. Ama tahtın gölgesi sahibini beklemekten hiç vazgeçmedi; tahta yaklaşan her yabancıyı gaspçı sayar, bir zamanlar orada oturanın gücüyle onu ezmeye çalışır.", en: "One of the seven thrones of the Sevenfold Court is empty. Who sat there, and why they left, the Ancients never say. But the throne's shadow never stopped waiting for its owner. It takes every stranger who comes near for a usurper, and tries to crush them with the power of whoever used to sit there." }
    kanca: { tr: "Boş tahtın önünden geçerken onun gölgesi seninkinin üstüne düşüyor; senin gölgen yerinden kalkıp diz çöküyor. Sen ise hâlâ ayaktasın ve taht gölgesi bunu hiç hoş karşılamıyor.", en: "As you pass in front of the empty throne, its shadow falls across yours, and your shadow gets up off the floor and kneels. You're still standing. The throne's shadow does not care for that." }
    seviye: 39
    can: 980
    statlar:
      str: 38
      agi: 30
      end: 38
      int: 40
      wis: 34
      per: 32
      wil: 46
      cha: 30
    davranis: "agresif"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Gölge olduğu için tahtın ardındaki karanlığa bağlıdır. Tahtın üstüne güçlü bir ışık düşürürsen gölge kısalıp incelir, sahibinin boyuna, yani hiçliğe iner.", en: "As a shadow, it's tied to the dark behind the throne. Throw a hard light onto the throne itself and the shadow shortens, thins out, and shrinks down to the size of its owner. Which is to say, nothing." }
    saldirilar:
      - id: "taht_hukmu"
        ad: { tr: "Taht Hükmü", en: "Throne Edict" }
        stat: "wil"
