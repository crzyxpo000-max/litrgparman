        metin: { tr: "Gövde boydan boya yarılıyor; içinden reçine değil, mavi bir ışık sızıyor. Yükselenler'in ona sunduğu her dua, her kurban artık o ışığın içinde. Yaşlı çam kökleriyle tepedeki bütün bahçeleri kavrıyor.", en: "The trunk splits open top to bottom, and what leaks out isn't sap. It's blue light. Every prayer and every sacrifice the Ascended ever gave it is in that light now, and the Old Growth grips every backyard on the Heights with its roots." }
