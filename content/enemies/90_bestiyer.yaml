    kanca: { tr: "Önünde mavi bir pencere açılıyor ama senin Sistem'inden gelmiyor: [Kat 7 Kuralı: Koşmak yasaktır.] Pencerenin ardında, kırık bir zırhın içindeki bir şey sana doğru yürüyor.", en: "A blue window pops up in front of you, but it isn't your System's: [Floor 7 Rule: No running.] Behind the window, something in cracked armor is walking toward you." }
