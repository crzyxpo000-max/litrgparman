        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} koluna dokunuyor; dokunduğu yerde tenin rengini yitiriyor ve bir an elinin kendi elin olduğundan emin olamıyorsun.", en: "{dusman} touches your arm, and where it touches, your skin goes gray. For a second you aren't sure that hand is still yours." }
      - id: "bos_bakis"
        ad: { tr: "Boş Bakış", en: "Empty Stare" }
        stat: "wis"
