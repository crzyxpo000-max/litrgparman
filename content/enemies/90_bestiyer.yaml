        metin: { tr: "{dusman} camının kapağını aralayınca üstüne soluk, mavi-beyaz bir alev akıyor; bir dünyanın son ateşi şimdi senin tenini yakıyor.", en: "{dusman} cracks its crystal open and a pale blue-white flame pours over you. The last fire of a whole world, burning your skin." }
      - id: "icerideki_ses"
        ad: { tr: "İçerideki Ses", en: "The Voice Inside" }
        stat: "wis"
