  degerleyici:
    ad: { tr: "Değerleyici", en: "The Assessor" }
    aciklama: { tr: "Pirinç Kervan'ın ana güvertesinde duran, kefeleri birer ev büyüklüğünde bir terazi-makine. Kadimler'in kervana yüklediği haracı hesaplar: her yükün, her işçinin, her çocuğun değerini biçer ve Kadimler'in payını ayırır. Tüccar halkı ona bakmaz; bakarsan sana da bir fiyat biçer.", en: "A scale-machine with pans the size of houses that stands on the Brass Caravan's main deck. It calculates the tribute the Ancients levy on the Caravan: it prices every crate, every worker, every child, and sets aside the Ancients' share. The merchant people never look at it. If you look, it puts a price on you, too." }
    kanca: { tr: "Dev terazinin tek kristal merceği sana dönüyor. Kefeler sallanıp duruluyor. Havada bir rakam beliriyor: senin fiyatın. Rakam yükseliyor, yükseliyor… Makine ilk kez duraksıyor.", en: "The giant scale's single crystal lens swivels toward you. The pans sway, then settle. A number appears in the air: your price. It goes up. And up. For the first time, the machine hesitates." }
    seviye: 37
