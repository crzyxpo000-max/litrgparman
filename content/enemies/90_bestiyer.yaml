        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} koluna dokunuyor ve dokunduğu yerde tenin rengini kaybediyor; elinin kendi elin olduğundan bir an emin olamıyorsun.", en: "{dusman} touches your arm, and where it touches, your skin goes gray. For a second you aren't sure that hand is still yours." }
      - id: "bos_bakis"
        ad: { tr: "Boş Bakış", en: "Empty Stare" }
        stat: "wis"
        taban: 12
        kat: 0.7
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} yüzünün olması gereken boşlukla sana bakıyor ve o boşlukta kendi şehrini görüyorsun: aynı gri, aynı sessiz.", en: "{dusman} looks at you with the blank where its face should be, and in that blank you see your own city. Just as gray. Just as quiet." }
    xp: 3600
    kredi: 4
    ganimet: { hasat_kulu: 0.5 }
    etiketler: ["olu", "cok_evren"]
    boss: false
  mercan_cobani:
    ad: { tr: "Mercan Çobanı", en: "Reef Shepherd" }
    aciklama: { tr: "Batık şehirlerin üstünde büyüyen mercanları güden, balina büyüklüğünde, sırtı resif olmuş bir yaratık. Halkı gittikten sonra şehirlerini yaşatmanın tek yolunu buldu: mercanı onlara benzetmek. Mercanların arasında sokaklar, kubbeler, yüzleri olmayan heykeller var. Bahçesine giren herkesi yeni bir heykel olarak görüyor.", en: "A whale-sized creature with a living reef for a back that tends the coral growing over the drowned cities. After its people were gone, it found the only way to keep their cities alive: grow the coral into their shape. There are streets in that reef, domes, statues with no faces. Anyone who wanders into its garden, it sees as a new statue." }
    kanca: { tr: "Altında kayalık sandığın resif kalkıyor. Mercan kubbeler, mercan sokaklar suyun içinden yükseliyor ve resifin ortasında, yosun gibi dalgalanan bir yüz sana eğiliyor.", en: "The reef you took for rock lifts under you. Coral domes and coral streets rise out of the water, and from the middle of the reef, a face rippling like seaweed leans down toward you." }
    seviye: 36
    can: 940
    statlar:
      str: 40
      agi: 18
      end: 44
      int: 26
      wis: 34
      per: 28
      wil: 38
      cha: 10
    davranis: "temkinli"
    zeki: false
