  # ---------------------------------------------------------------- Çok-evren · Yedi Taht (EN: the Sevenfold Court)
  huzur_muhafizi:
    ad: { tr: "Huzur Muhafızı", en: "Presence Guard" }
    aciklama: { tr: "Yedi Taht'ın salonlarını bekleyen, yüzlerini kalıp maskelerin ardına gizlemiş muhafızlar. Tahtların huzurunda konuşmak yasaktır; onlar da o yasanın ta kendisidir: sessizliği bozanı susturur, diz çökmeyeni diz çöktürürler. Ağızları olup olmadığını kimse bilmez.", en: "Guards who keep the halls of the Sevenfold Court, their faces hidden behind molded masks. Speaking in the presence of the thrones is forbidden, and they are that law in the flesh: they silence whoever breaks the silence and put whoever won't kneel on their knees. Nobody knows if they even have mouths." }
    kanca: { tr: "Uzun salonda adımlarının yankısı bile ayıp kaçıyor. İki sütunun arasındaki maskeli figür tek parmağını kaldırıp dudaklarına götürüyor, sonra teberini indiriyor.", en: "In the long hall, even the echo of your footsteps feels rude. The masked figure between two pillars raises a single finger to its lips. Then it lowers its halberd." }
    seviye: 37
    can: 470
    statlar:
      str: 26
      agi: 20
      end: 24
      int: 16
      wis: 18
      per: 20
      wil: 26
      cha: 10
    davranis: "agresif"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Yeminleri sessizliğe bağlıdır, güçlerini salonun sessizliğinden alırlar. Sağır edici bir ses o yemini parçalar; yasasının çiğnendiğini gören muhafız bir an ne yapacağını bilemez.", en: "Their oath is bound to silence, and they draw their strength from the hush of the halls. A deafening noise shatters the oath, and when a guard sees its own law broken, it doesn't know what to do for a moment." }
    saldirilar:
      - id: "sessiz_teber"
        ad: { tr: "Sessiz Teber", en: "Silent Halberd" }
