    xp: 2100
    kredi: 6
    ganimet: { curuf_cekirdegi: 0.4, kul: 0.5 }
    etiketler: ["hayvan", "ates"]
    boss: false
  catal_cene:
    ad: { tr: "Çatal Çene", en: "Forkjaw" }
    aciklama: { tr: "Lonca'nın depolarında yük taşıyan bir forklift. Bir sabah kendi kendine çalıştı ve bir daha durmadı. Çatalları bir çene gibi açılıp kapanıyor; geri vites uyarısı çalmaya başladığında artık çok geçtir.", en: "A forklift that used to haul pallets in the Guild's warehouses. One morning it started up on its own and never shut off. Its forks open and close like a jaw, and by the time you hear the backup beeper, it's already too late." }
    kanca: { tr: "Deponun karanlığında bir motor öksürerek çalışıyor. İki far yanıyor. Çatallar yerden bir metre kalkıyor ve tam göğüs hizanda duruyor.", en: "Somewhere in the dark of the warehouse, an engine coughs to life. Two headlights snap on. The forks rise about three feet off the floor and stop, level with your chest." }
    seviye: 25
    can: 330
    statlar:
      str: 20
      agi: 10
      end: 18
      int: 6
      wis: 4
      per: 12
      wil: 13
      cha: 1
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Bir akü ve bir yığın kabloyla yaşıyor. Güçlü bir akım devrelerini yakar, çatalları kilitlenir ve motor boğulur.", en: "It runs on one battery and a nest of wiring. A strong jolt fries its circuits, locks the forks in place, and stalls the engine." }
    saldirilar:
      - id: "catal_saplama"
