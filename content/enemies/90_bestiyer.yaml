  sessiz_kanat:
    ad: { tr: "Sessiz Kanat", en: "Hushwing" }
    aciklama: { tr: "Kule'nin yüksek tavanlı katlarında yaşayan, baykuşa benzeyen ama yüzü olmayan bir avcı. Uçarken hiç ses çıkarmıyor; etrafındaki sesleri de yutuyor. Geldiğini, kendi ayak seslerini duyamadığında anlarsın.", en: "A hunter that lives on the Spire's high-ceilinged floors. It's shaped like an owl but has no face. It makes no sound when it flies, and it swallows the sounds around it too. You know it's coming when you can't hear your own footsteps anymore." }
    kanca: { tr: "Adımların sessizleşiyor. Nefesin sessizleşiyor. Kalbinin atışını bile duyamıyorsun. Tepende, geniş ve beyaz bir şey kanatlarını açıyor.", en: "Your footsteps go quiet. Your breathing goes quiet. You can't even hear your heartbeat. Overhead, something wide and white spreads its wings." }
