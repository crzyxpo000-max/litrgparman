  sinav_heykeli:
    ad: { tr: "Sınav Heykeli", en: "Trial Statue" }
    aciklama: { tr: "Kule'nin sınav katlarında duran, kaidesinin üstünde kımıldamadan bekleyen taş heykeller. Bir tırmanıcı katın kuralını çiğnediğinde ya da bir sınavı yarıda bıraktığında canlanıyorlar. Kaidelerinde, Sistem'in dilinde yazılmış tek bir soru var; kimse cevabını bilmiyor.", en: "Stone statues that stand motionless on their plinths on the Spire's trial floors. They come to life when a climber breaks a floor's rule or walks away from a trial halfway through. Each plinth has a single question carved on it in the System's language. Nobody knows the answer." }
    kanca: { tr: "Kaidenin üstündeki yazı mavi parlamaya başlıyor. Taş bir göz kapağı ağır ağır kalkıyor ve heykel, yüzyılların tozunu silkeleyerek kaidesinden iniyor.", en: "The carving on the plinth starts to glow blue. A stone eyelid lifts, slow and heavy, and the statue steps down off its plinth, shaking off centuries of dust." }
    seviye: 28
