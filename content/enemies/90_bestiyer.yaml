        bekleme: 2
        metin: { tr: "{dusman} dallarını silkeleyince çivi sertliğinde bir çam iğnesi bulutu üstüne iniyor.", en: "{dusman} shakes its boughs, and a cloud of needles hard as finishing nails comes down on you." }
      - id: "adak_canlari"
