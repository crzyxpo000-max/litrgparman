        metin: { tr: "Gölge tahta çekiliyor; tahtın üstünde bir an uzun, taçlı, hiç tanımadığın bir biçim beliriyor. Sonra biçim dağılıyor, gölge iki katına çıkıp salona yayılıyor.", en: "The shadow pulls back onto the throne, and for a moment a shape appears in the seat: tall, crowned, like nothing you know. Then the shape breaks up, and the shadow spills across the hall, twice the size it was." }
        guclenme: { str: 4, wil: 5 }
        saldiri:
          id: "taht_karanligi"
          ad: { tr: "Taht Karanlığı", en: "Throne Dark" }
          stat: "wil"
          taban: 24
          kat: 0.8
          etiketler: ["karanlik", "alan"]
          durum: { etki: "kor", sans: 0.45, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} salonun bütün ışıklarını tahtın ardına çekiyor; karanlıkta yalnız tahtın kenarlarıyla bir taç parlıyor.", en: "{dusman} drags every light in the hall back behind the throne. In the dark, the only things still shining are the edges of the throne, and a crown." }
      - esik: 25
        metin: { tr: "Gölge çatlıyor; çatlaklardan tahtı bırakıp gidenin son sözleri sızıyor. Anlamıyorsun ama bir sözcüğü tanıyorsun, çünkü senin Sistem'in de onu kullanıyor: [Hasat].", en: "The shadow cracks, and through the cracks seep the last words of whoever got up and left that throne. You don't understand them, but you recognize one word, because your System uses it too: [Harvest]." }
        guclenme: { int: 5, agi: 4 }
