    etiketler: ["cok_evren", "kadim"]
    boss: false
  hasat_kandili:
    ad: { tr: "Hasat Kandili", en: "Harvest Lamp" }
    aciklama: { tr: "Yedi Taht'ın koridorlarını aydınlatan, havada süzülen kristal kandiller. Yaktıkları yağ değil, hasat edilmiş dünyaların özüdür. Her kandilin içinde bir dünyanın son kıvılcımı yanar; yakından bakınca alevin içinde hâlâ kıpırdayan bir yüz görülür.", en: "Floating crystal lamps that light the corridors of the Sevenfold Court. They don't burn oil. They burn the essence of harvested worlds. Inside each one, the last spark of some world is still going, and if you look close, there's a face in the flame, still moving." }
    kanca: { tr: "Koridorun kandillerinden biri yerinden kopup sana doğru süzülüyor. Alevin içindeki yüz camın ardından sana bakıyor, dudakları senin dilinde tek bir sözcük kıpırdatıyor: \"Kaç.\"", en: "One of the corridor lamps drifts loose and floats toward you. The face in the flame looks at you through the crystal, and its lips shape a word in your language: \"Run.\"" }
    seviye: 36
    can: 360
    statlar:
      str: 6
