    kanca: { tr: "Meydana geniş bir gölge düşüyor ve yavaşça daireler çiziyor. Gölgenin ortasında duruyorsun. Gölge küçülmeye başlıyor; yani şey alçalıyor.", en: "A wide shadow slides across the plaza and starts circling, slow. You're standing in the middle of it. The shadow is getting smaller, which means whatever's casting it is coming down." }
