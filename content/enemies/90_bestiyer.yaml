    xp: 3280
    kredi: 9
    ganimet: { recine_kehribari: 0.45, canavar_cekirdegi: 0.12 }
    etiketler: ["hayvan"]
    boss: false
  gozetleme_dronu:
    ad: { tr: "Gözetleme Dronu", en: "Sentinel Drone" }
    aciklama: { tr: "Tepedeki akıllı villaların güvenlik dronları. Sahipleri öldü ya da kaçtı ama dronlar hâlâ \"izinsiz giriş\" arıyor; şimdi tanımadıkları her yüzü izinsiz sayıyorlar ve sürü hâlinde avlanıyorlar.", en: "Security drones from the smart homes up on the Heights. Their owners are dead or long gone, but the drones are still looking for trespassers, and these days every face they don't recognize counts. They hunt in flocks." }
    kanca: { tr: "Tependen ince bir vızıltı geçiyor. Kırmızı bir ışık göğsünde duruyor; sonra bir tane daha, sonra bir tane daha. Ve bir ses: \"Yüz tanınmadı.\"", en: "A thin whine passes overhead. A red dot settles on your chest. Then another one. Then another. And a voice: \"Face not recognized.\"" }
    seviye: 23
    can: 170
    statlar:
      str: 5
      agi: 16
