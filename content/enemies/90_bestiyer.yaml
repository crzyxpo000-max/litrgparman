      end: 13
      int: 3
      wis: 5
      per: 12
      wil: 10
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "delici"
    zaaf_metin: { tr: "Kabuk gibi soğumuş cüruf derileri sert ama kırılgan. İnce bir uç o kabuğu deler ve içerideki erimiş çekirdeğe ulaşır; it kendi ateşiyle söner.", en: "Their hides are slag cooled to a crust, hard but brittle. A thin point cracks through and reaches the molten core underneath, and the dog burns out on its own fire." }
