        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} boynuna dalıp iki metal dikeni tenine dayıyor. Bir çatırtı, ardından baştan aşağı kasılan bir beden.", en: "{dusman} dives at your neck and presses two metal prongs to your skin. One crackle, then every muscle in your body seizes." }
      - id: "projektor"
        ad: { tr: "Projektör", en: "Floodlight" }
        stat: "per"
        taban: 9
        kat: 0.7
        etiketler: ["isik", "menzilli"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} yüzüne bembeyaz bir projektör tutuyor; göz kapaklarının ardında bile mor lekeler uçuşuyor.", en: "{dusman} hits you right in the face with a white floodlight. Purple blotches dance even behind your eyelids." }
      - id: "alarm"
        ad: { tr: "Alarm", en: "Alarm" }
        stat: "wil"
        taban: 8
        kat: 0.7
        etiketler: ["ses", "alan"]
        durum: { etki: "korku", sans: 0.3, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} siren çalmaya başlıyor; tepedeki bütün evlerden aynı siren karşılık veriyor. Karanlıkta yeni kırmızı ışıklar yanıyor.", en: "{dusman} starts wailing like a siren, and every house on the Heights answers with the same siren. New red dots light up in the dark." }
    xp: 2000
    kredi: 10
    ganimet: { dron_lensi: 0.4, canli_bakir: 0.3 }
    etiketler: ["mekanik"]
    boss: false
  yukselen_mumin:
    ad: { tr: "Yükselen Mümin", en: "Ascended Zealot" }
    aciklama: { tr: "Yükselenler'in tepedeki villalarda yaşayan müminleri. Sistem'e taparlar, insanları \"seçilmiş\" ve \"yakıt\" diye ikiye ayırırlar. Aralarındaki yaşlılara, hastalara ve zayıflara yakıt denir; tepeye gelen yabancılar da çoğunlukla yakıt sayılır.", en: "True believers of the Ascended, living in the mansions on the Heights. They worship the System and sort people into two piles: the Chosen and the fuel. Among themselves, the old, the sick and the weak are called fuel, and outsiders who wander up the hill usually get counted as fuel too." }
    kanca: { tr: "Villanın merdivenlerinde beyazlar giymiş biri bekliyor, gözleri Sistem penceresi gibi mavi mavi parlıyor. Gülümsüyor: \"Hoş geldin. Senin için dua ediyorduk.\"", en: "Someone in white is waiting on the mansion steps, eyes glowing blue as a System window. They smile. \"Welcome. We've been praying for you.\"" }
    seviye: 25
    can: 300
    statlar:
      str: 14
      agi: 12
      end: 14
      int: 12
      wis: 14
      per: 11
      wil: 18
      cha: 13
