    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Taşının içinde, yüzyıllardır biriken ince nem damarları var. Buz o damarları genişletir ve heykel, bir kaya gibi, içten çatlar.", en: "There are thin veins of moisture inside its stone, centuries in the making. Ice swells those veins and the statue cracks from the inside, like a boulder in a hard frost." }
    saldirilar:
      - id: "tas_kilic"
        ad: { tr: "Taş Kılıç", en: "Stone Blade" }
