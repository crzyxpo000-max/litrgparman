          metin: { tr: "{dusman} defterini sertçe kapatıyor. Ses kubbede tabut kapağı gibi yankılanırken ödemediğin bütün borçların ağırlığı bir an omuzlarına çöküyor.", en: "{dusman} slams its ledger shut. The sound booms off the brick like a coffin lid, and for one moment you feel the weight of every debt you ever skipped out on." }
  # ---------------------------------------------------------------- Kıyıkent · Sanayi (EN: the Ironworks)
  curuf_iti:
    ad: { tr: "Cüruf İti", en: "Slag Hound" }
    aciklama: { tr: "Sanayinin dökümhanelerinde dolaşan sokak köpekleri Entegrasyon gecesi erimiş cürufun içinde uyudular ve uyanmadılar; ya da uyandılar ama artık köpek değildiler. Damarlarında kızgın cüruf akar, havlamaları körük gibi sıcaktır.", en: "The strays that used to hang around the Ironworks' foundries curled up in the warm slag on the night of Integration and never woke up. Or they did wake up, and they weren't dogs anymore. Molten slag runs in their veins, and their barks come out hot as a bellows." }
    kanca: { tr: "Dökümhane kapısının altından turuncu bir ışık sızıyor; ışığın içinden hırlayan dört gölge çıkıyor.", en: "Orange light leaks out under the foundry door, and four growling shapes come out of it." }
    seviye: 24
    can: 220
    statlar:
      str: 15
      agi: 14
      end: 13
      int: 3
      wis: 5
      per: 12
      wil: 10
      cha: 1
    davranis: "suru"
    zeki: false
    zaaf: "delici"
    zaaf_metin: { tr: "Kabuk bağlamış cüruf derileri serttir ama kırılgandır. İnce bir uç o kabuğu delip içerideki erimiş çekirdeğe ulaşırsa it kendi ateşinde söner.", en: "Their hides are slag cooled to a crust, hard but brittle. A thin point cracks through and reaches the molten core underneath, and the dog burns out on its own fire." }
    saldirilar:
      - id: "erimis_isirik"
        ad: { tr: "Erimiş Isırık", en: "Molten Bite" }
        stat: "str"
        taban: 13
        kat: 0.8
