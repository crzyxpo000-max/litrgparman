        metin: { tr: "{dusman} kolunu kapıyor; dişlerinin değdiği yerde kumaş tutuşuyor, deri cızırdıyor.", en: "{dusman} clamps onto your arm. Where its teeth touch, your sleeve catches fire and your skin sizzles." }
      - id: "curuf_silkme"
        ad: { tr: "Cüruf Silkme", en: "Slag Shake" }
        stat: "end"
        taban: 11
