      end: 12
      int: 26
      wis: 22
      per: 14
      wil: 24
      cha: 8
    davranis: "temkinli"
    zeki: false
    zaaf: "karanlik"
    zaaf_metin: { tr: "Yanmaya mecburdur, Kadimler onu buna bağlamıştır. Karanlık alevi boğar; kandil sönerken içindeki yüz uzun zamandır ilk kez gözlerini kapar.", en: "It has to burn; the Ancients bound it that way. Darkness smothers the flame, and as the lamp goes out, the face inside closes its eyes for the first time in a very long time." }
    saldirilar:
      - id: "oz_alevi"
        ad: { tr: "Öz Alevi", en: "Essence Flame" }
