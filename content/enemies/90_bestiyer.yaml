    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Kule'nin loş koridorlarında doğdu; gözleri en küçük ışığı bile toplayacak kadar büyük. Ani, güçlü bir ışık onu kör eder ve gizlenmenin ona verdiği her şeyi elinden alır.", en: "It was born in the Spire's dim corridors, and its eyes are huge enough to soak up the faintest light. A sudden, strong light blinds it and takes away everything hiding ever gave it." }
