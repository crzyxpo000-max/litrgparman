        bekleme: 2
        metin: { tr: "{dusman} dallarını silkeliyor ve bir bulut çam iğnesi, çivi sertliğinde, üstüne iniyor.", en: "{dusman} shakes its boughs, and a cloud of needles hard as finishing nails comes down on you." }
      - id: "adak_canlari"
