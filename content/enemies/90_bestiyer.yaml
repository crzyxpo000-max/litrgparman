        metin: { tr: "{dusman} tam gaz üstüne sürüyor; çatallardan biri böğrüne giriyor ve seni bir palet gibi duvara taşıyor.", en: "{dusman} floors it. One tine catches you in the side and it carries you into the wall like a pallet." }
      - id: "kaldir_at"
        ad: { tr: "Kaldır At", en: "Lift and Dump" }
