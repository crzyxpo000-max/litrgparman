    kanca: { tr: "Kalkan içinden yanıyor; ona bağlı her soluk iplik bir nabız gibi atıyor.", en: "The shield burns from the inside, and every pale thread tied to it beats like a pulse." }
    seviye: 40
    can: 2700
    statlar: { str: 52, agi: 40, end: 66, int: 40, wis: 44, per: 46, wil: 60, cha: 30 }
    davranis: "temkinli"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Kalkanı taşıyan hâlâ bir insan. Tanıdık bir ses, bir anı, bir isim onu bir an durdurur.", en: "The one carrying the shield is still human. A familiar voice, a memory, a name can stop them for a second." }
    saldirilar:
      - id: "kalkan_darbesi"
        ad: { tr: "Kalkan Darbesi", en: "Shield Bash" }
        stat: "str"
        taban: 15
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} kalkanını öne sürüyor; yüzlerce insanın ağırlığı tek bir darbede.", en: "{dusman} drives the shield forward, the weight of hundreds of people in one hit." }
      - id: "yakit_yak"
        ad: { tr: "Yakıtı Yak", en: "Burn the Fuel" }
        stat: "wil"
        taban: 14
        kat: 0.9
        etiketler: ["ates", "alan"]
