# Parti J düşmanları (events/71_perde3.yaml). Tasarım seviyesi 40; olaylarda @oyuncu+N / @dunya ile ölçeklenir.
dusmanlar:
  kadim_hukumsuzlestirici:
    ad: { tr: "Hükümsüzleştirici", en: "Nullifier" }
    aciklama: { tr: "Uzun, yüzsüz, gümüş bir Kadim öncüsü. Kayıtları, sesleri ve sinyalleri bir kütüphanecinin özeniyle toplar.", en: "A tall, faceless, silver Ancient vanguard trooper. It collects records, voices, and signals with a librarian's care." }
    kanca: { tr: "Rafların arasından gümüş bir figür sana dönüyor; yüzü yok, ama baktığını biliyorsun.", en: "A silver figure turns toward you between the racks. It has no face, but you know it's looking." }
    seviye: 40
    can: 820
    statlar: { str: 42, agi: 46, end: 44, int: 52, wis: 40, per: 50, wil: 44, cha: 10 }
    davranis: "temkinli"
    zeki: true
    zaaf: "ses"
    zaaf_metin: { tr: "Sessizlikle çalışıyor; yüksek bir ses gövdesindeki gümüşü titretir ve çatlatır.", en: "It runs on silence. A loud enough noise makes the silver in its body shiver and crack." }
    saldirilar:
      - id: "silme"
        ad: { tr: "Kayıt Silme", en: "Record Wipe" }
        stat: "int"
        taban: 14
        kat: 0.9
        etiketler: ["zihin", "glitch"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} parmağını alnına değdiriyor; bir saniyelik hafızan siliniyor ve ne yaptığını unutuyorsun.", en: "{dusman} touches a finger to your forehead, and one second of your memory goes blank. You forget what you were doing." }
      - id: "gumus_el"
        ad: { tr: "Gümüş El", en: "Silver Hand" }
        stat: "str"
        taban: 12
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} gümüş elini göğsüne bastırıyor; kaburgaların bir kütüphane rafı gibi çatırdıyor.", en: "{dusman} presses a silver hand to your chest, and your ribs creak like an overloaded bookshelf." }
    xp: 2400
    kredi: 120
    etiketler: ["kadim", "insansi"]
    boss: false

  sessizlik_avcisi:
    ad: { tr: "Sessizlik Avcısı", en: "Silencer" }
    aciklama: { tr: "Kadimler'in tanık temizleyicisi. Saydam gövdesinin içinde hiçbir şeyi yansıtmayan bir boşluk döner; yanında sesler ölür.", en: "The Ancients' witness cleaner. A hollow turns inside its see-through body, reflecting nothing, and sound dies around it." }
    kanca: { tr: "Kurşun duvarlar çan gibi çınlıyor ve sonra hiçbir şey; kendi kalp atışını bile duyamıyorsun.", en: "The lead walls ring like a bell, and then nothing. You can't even hear your own heartbeat." }
    seviye: 40
    can: 2600
    statlar: { str: 48, agi: 52, end: 54, int: 60, wis: 52, per: 56, wil: 60, cha: 8 }
    davranis: "temkinli"
    zeki: true
    zaaf: "ses"
    zaaf_metin: { tr: "Boşluğu sesle beslenir ama sesi taşıyamaz. Yüksek sesle söylenen bir şey içini çatlatır.", en: "Its hollow feeds on sound but can't hold it. Something said out loud cracks it from the inside." }
    saldirilar:
      - id: "sessizlik"
        ad: { tr: "Mutlak Sessizlik", en: "Dead Air" }
        stat: "wil"
        taban: 16
        kat: 0.9
        etiketler: ["zihin", "karanlik"]
        durum: { etki: "korku", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} etrafındaki bütün sesi yutuyor; sessizlik kulaklarına bir yumruk gibi iniyor.", en: "{dusman} swallows every sound around it, and the silence hits your ears like a fist." }
      - id: "bosluk_kesigi"
        ad: { tr: "Boşluk Kesiği", en: "Hollow Cut" }
        stat: "agi"
        taban: 15
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} saydam bir kolla savruluyor; kesik sessiz, kanın bile ses çıkarmıyor.", en: "{dusman} sweeps a see-through arm at you. The cut is silent. Even your blood doesn't make a sound." }
    xp: 9000
    kredi: 600
    etiketler: ["kadim", "boss"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Telsizler ölüyor, ışıklar titriyor. Boşluk genişliyor ve odanın kenarlarını yemeye başlıyor.", en: "The radios die and the lights flicker. The hollow widens and starts eating the edges of the room." }
        guclenme: { wil: 6, int: 4 }
        saldiri:
          id: "kayit_yutma"
          ad: { tr: "Kayıt Yutma", en: "Archive Swallow" }
          stat: "int"
          taban: 18
          kat: 0.9
          etiketler: ["zihin", "alan"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} odadaki bütün kayıtları içine çekiyor; seninkileri de. Bir an adını hatırlamıyorsun.", en: "{dusman} pulls every record in the room into itself. Yours too. For a second, you can't remember your own name." }
      - esik: 40
        metin: { tr: "Gövdesi bulanıklaşıyor; artık neredeyse görünmez. Yalnızca etrafındaki sessizliğin kenarı yerini belli ediyor.", en: "Its body blurs until it's almost invisible. Only the edge of the silence around it gives it away." }
        guclenme: { agi: 8 }
        saldiri:
          id: "gorunmez"
          ad: { tr: "Görünmez Pençe", en: "Unseen Claw" }
          stat: "agi"
          taban: 19
          kat: 1.0
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "kor", sans: 0.35, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} hiç görmediğin bir yerden vuruyor; nereden geldiğini yalnızca acıdan anlıyorsun.", en: "{dusman} hits you from somewhere you never saw. The only way you know where it came from is the pain." }
      - esik: 15
        metin: { tr: "Boşluk çatlıyor ve içinden yutulmuş sesler sızıyor: çığlıklar, şarkılar, telsiz cızırtıları. Avcı onları geri tutmak için çırpınıyor.", en: "The hollow cracks and swallowed sounds start leaking out: screams, songs, radio static. The Silencer thrashes to hold them in." }
        guclenme: { str: 6, end: 6, wil: 6 }
        saldiri:
          id: "son_ses"
          ad: { tr: "Son Ses", en: "Last Sound" }
          stat: "wil"
          taban: 22
          kat: 1.0
          etiketler: ["zihin", "ses"]
          durum: { etki: "korku", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} yuttuğu bütün sesleri aynı anda üstüne boşaltıyor.", en: "{dusman} dumps every sound it ever swallowed on you at once." }

  demir_yemin_muhafizi:
    ad: { tr: "Demir Yemin Muhafızı", en: "Iron Oath Guard" }
    aciklama: { tr: "Demir Lonca'nın seçkin muhafızı. Disiplinli, sessiz ve emre itaatkâr; emir kimden gelirse gelsin.", en: "One of the Iron Guild's elite guards. Disciplined, quiet, and obedient to orders, no matter whose." }
    kanca: { tr: "Muhafız kalkanını kaldırıp yerini alıyor; yüzünde ne öfke var ne korku, yalnızca emir.", en: "The guard brings up a shield and takes position. No anger on its face, no fear. Just orders." }
    seviye: 40
    can: 900
    statlar: { str: 50, agi: 40, end: 52, int: 30, wis: 34, per: 42, wil: 46, cha: 26 }
    davranis: "suru"
    zeki: true
    zaaf: "goz"
    zaaf_metin: { tr: "Kaskının göz yarığı dar; yandan gelen hiçbir şeyi görmüyor.", en: "The eye slit in its helmet is narrow. It can't see anything coming from the side." }
    saldirilar:
      - id: "sungu"
        ad: { tr: "Süngü Hamlesi", en: "Bayonet Thrust" }
        stat: "str"
        taban: 13
        kat: 0.9
        etiketler: ["fiziksel", "yakin", "delici"]
        durum: { etki: "kanama", sans: 0.2, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} talimdeki gibi öne atılıyor; süngü kaburgalarının arasını arıyor.", en: "{dusman} lunges like it's on the drill field, bayonet hunting for the gap in your ribs." }
      - id: "kalkan_duvari"
        ad: { tr: "Kalkan Duvarı", en: "Shield Wall" }
        stat: "end"
        taban: 0
        kat: 0.0
        etiketler: ["savunma"]
        durum: { etki: "kalkan", sans: 1.0, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} kalkanını yere çakıyor ve arkasına çekiliyor.", en: "{dusman} plants its shield and tucks in behind it." }
    xp: 2200
    kredi: 140
    etiketler: ["insan", "lonca"]
    boss: false

  muhurlu_cekirdek:
    ad: { tr: "Mühürlü Çekirdek", en: "The Sealed Core" }
    aciklama: { tr: "Kasaba Çekirdeği'nin muhafızı, Lonca'nın demir mührüyle bir insana bağlanmış. Mavi camdan, unutulmuş sokak adlarından ve tahliye haritalarından örülmüş.", en: "The Town Core's guardian, bound to a human by the Guild's iron seal. Woven from blue glass, forgotten street names, and evacuation maps." }
    kanca: { tr: "Çekirdek'in kırmızı ışığı ayağa kalkıyor; gövdesinde şehrin her mahallesi bir yara gibi parlıyor.", en: "The Core's red light gets to its feet, every neighborhood in the city glowing on its body like a wound." }
    seviye: 40
    can: 3000
    statlar: { str: 60, agi: 34, end: 64, int: 50, wis: 46, per: 44, wil: 56, cha: 10 }
    davranis: "agresif"
    zeki: false
    zaaf: "zihin"
    zaaf_metin: { tr: "Bağlayanın iradesiyle hareket ediyor; o iradeyi sarsan her şey muhafızı da sarsar.", en: "It moves on its binder's will. Anything that shakes that will shakes the guardian too." }
    saldirilar:
      - id: "cam_yumruk"
        ad: { tr: "Cam Yumruk", en: "Glass Fist" }
        stat: "str"
        taban: 16
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.2, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} mavi camdan yumruğunu indiriyor; zemin senin altında çatlıyor.", en: "{dusman} brings down a fist of blue glass, and the floor cracks under you." }
      - id: "tahliye"
        ad: { tr: "Tahliye Haritası", en: "Evacuation Map" }
        stat: "int"
        taban: 14
        kat: 0.9
        etiketler: ["isik", "alan"]
        durum: { etki: "kor", sans: 0.3, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gövdesindeki haritaları bir flaş gibi yakıyor; gözlerin kamaşıyor.", en: "{dusman} flares the maps on its body like a camera flash, and your eyes white out." }
    xp: 9000
    kredi: 500
    etiketler: ["boss", "kasaba_cekirdegi"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Gövdesindeki mahalle adları yanıp sönüyor; bağlayanın burnundan kan geliyor.", en: "The neighborhood names on its body flicker, and its binder's nose starts to bleed." }
        guclenme: { str: 6, end: 4 }
        saldiri:
          id: "sokak_adlari"
          ad: { tr: "Sokak Adları", en: "Street Names" }
          stat: "wil"
          taban: 18
          kat: 0.9
          etiketler: ["zihin"]
          durum: { etki: "korku", sans: 0.3, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} şehrin ölmüş sokaklarının adlarını fısıldıyor; her biri bir ağırlık gibi omzuna çöküyor.", en: "{dusman} whispers the names of the city's dead streets, and each one settles on your shoulders like a weight." }
      - esik: 40
        metin: { tr: "Kristal kırmızıdan beyaza dönüyor. Muhafız artık bağlayanını değil, şehri koruyor; ya da öyle sanıyor.", en: "The crystal goes from red to white. The guardian's not protecting its binder anymore. It's protecting the city. Or thinks it is." }
        guclenme: { wil: 8, int: 4 }
        saldiri:
          id: "kalkan_sehir"
          ad: { tr: "Şehir Kalkanı", en: "City Shield" }
          stat: "end"
          taban: 0
          kat: 0.0
          etiketler: ["savunma"]
          durum: { etki: "kalkan", sans: 1.0, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} kollarını açıyor ve şehrin kalkanını kendi üstüne çekiyor.", en: "{dusman} spreads its arms and pulls the city's shield over itself." }
      - esik: 15
        metin: { tr: "Cam çatlıyor; içinden tahliye sirenlerinin sesi geliyor. Muhafız son bir kez ayağa kalkıyor.", en: "The glass cracks, and evacuation sirens wail from inside it. The guardian gets up one last time." }
        guclenme: { str: 8, end: 8 }
        saldiri:
          id: "siren"
          ad: { tr: "Tahliye Sireni", en: "Evacuation Siren" }
          stat: "str"
          taban: 22
          kat: 1.0
          etiketler: ["ses", "alan"]
          durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
          bekleme: 3
          metin: { tr: "{dusman} bütün sirenleri aynı anda çalıyor; ses dalgası seni duvara yapıştırıyor.", en: "{dusman} sounds every siren at once, and the shockwave pins you to the wall." }

  kadim_infazci:
    ad: { tr: "Kadim İnfazcısı", en: "Ancient Enforcer" }
    aciklama: { tr: "Kadim filosunun ağır piyadesi. Maske, zırh ve sabır; aceleleri yok, çünkü hiç kaybetmediler.", en: "Heavy infantry from the Ancient fleet. Mask, armor, and patience. They're in no hurry. They've never lost." }
    kanca: { tr: "Maskeli bir figür geçitten çıkıp yerini alıyor; zırhının üstünde başka dünyaların tozu.", en: "A masked figure steps out of the gate and takes position, the dust of other worlds on its armor." }
    seviye: 40
    can: 950
    statlar: { str: 54, agi: 40, end: 56, int: 36, wis: 36, per: 44, wil: 48, cha: 12 }
    davranis: "agresif"
    zeki: true
    zaaf: "simsek"
    zaaf_metin: { tr: "Zırhı başka bir dünyanın metalinden; bu dünyanın şimşeği onu tanımıyor ve içinden geçiyor.", en: "Its armor is metal from another world. This world's lightning doesn't recognize it and goes straight through." }
    saldirilar:
      - id: "teber"
        ad: { tr: "Teber", en: "Halberd" }
        stat: "str"
        taban: 14
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.25, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} teberini geniş bir yay çizerek savuruyor.", en: "{dusman} swings its halberd in a wide arc." }
      - id: "hukum"
        ad: { tr: "Hüküm Damgası", en: "Verdict Brand" }
        stat: "wil"
        taban: 12
        kat: 0.9
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.25, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} maskesinin ardından tek bir kelime söylüyor; dizlerin bir an çözülüyor.", en: "{dusman} says a single word from behind its mask, and your knees give for a second." }
    xp: 2400
    kredi: 150
    etiketler: ["kadim"]
    boss: false

  taht_cellati:
    ad: { tr: "Taht Cellâdı", en: "Throne Headsman" }
    aciklama: { tr: "Kadimler'in hainleri karşılamak için yolladığı tören giysili infaz memuru. Kılıcı kendi boyundan uzun; işini hiç yarıda bırakmadı.", en: "The ceremonial executioner the Ancients send to greet traitors. Its sword is longer than it is tall. It has never left a job half done." }
    kanca: { tr: "Işık sütununun içinden maskeli bir figür iniyor; kılıcının ucu taşlara değdiğinde taşlar susuyor.", en: "A masked figure descends inside the column of light. When the tip of its sword touches the paving stones, the stones go quiet." }
    seviye: 40
    can: 2800
    statlar: { str: 62, agi: 50, end: 58, int: 44, wis: 46, per: 54, wil: 62, cha: 20 }
    davranis: "agresif"
    zeki: true
    zaaf: "isik"
    zaaf_metin: { tr: "Maskesi ışık geçirmez; parlak bir ışık onu bir an kör eder ve tören adımları şaşar.", en: "Its mask lets no light through. A bright flash blinds it for a moment and throws off its ceremonial footwork." }
    saldirilar:
      - id: "infaz"
        ad: { tr: "İnfaz Darbesi", en: "Execution Stroke" }
        stat: "str"
        taban: 17
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kılıcını bir tören hareketiyle kaldırıp indiriyor; havanın kendisi ikiye ayrılıyor.", en: "{dusman} raises its sword in a ceremonial sweep and brings it down. The air itself splits in two." }
      - id: "hukum_okuma"
        ad: { tr: "Hüküm Okuma", en: "Reading of the Sentence" }
        stat: "wil"
        taban: 15
        kat: 0.9
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.3, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} hükmü okuyor; adını, suçunu, cezanı. Hepsi doğru gibi geliyor.", en: "{dusman} reads the sentence: your name, your crime, your punishment. All of it sounds true." }
    xp: 9500
    kredi: 700
    etiketler: ["kadim", "boss"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Cellat kılıcını yere saplayıp bir dua okuyor; kılıç ağzından gümüş bir alev yükseliyor.", en: "The headsman plants its sword and reads a prayer, and silver flame climbs the blade." }
        guclenme: { str: 6, wil: 4 }
        saldiri:
          id: "gumus_alev"
          ad: { tr: "Gümüş Alev", en: "Silver Flame" }
          stat: "wil"
          taban: 19
          kat: 0.9
          etiketler: ["ates", "alan"]
          durum: { etki: "yanma", sans: 0.4, sure: 3 }
          bekleme: 2
          metin: { tr: "{dusman} alev alan kılıcını savuruyor; gümüş ateş meydanı yalıyor.", en: "{dusman} swings the burning blade, and silver fire licks across the square." }
      - esik: 40
        metin: { tr: "Maskesi çatlıyor. Altında bir yüz yok; yalnızca sayısız hükmün yazılı olduğu bir levha.", en: "Its mask cracks. There's no face under it. Just a plate engraved with countless sentences." }
        guclenme: { agi: 8, per: 4 }
        saldiri:
          id: "hizli_hukum"
          ad: { tr: "Ani Hüküm", en: "Summary Judgment" }
          stat: "agi"
          taban: 20
          kat: 1.0
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} tören adımlarını bırakıp doğrudan sana atılıyor; artık acelesi var.", en: "{dusman} drops the ceremonial footwork and comes straight at you. Now it's in a hurry." }
      - esik: 15
        metin: { tr: "Levhadaki hükümler birer birer siliniyor. Cellat ilk kez işini bitiremeyeceğini anlıyor ve bu onu çılgına çeviriyor.", en: "The sentences on the plate erase one by one. For the first time, the headsman realizes it won't finish the job, and it goes berserk." }
        guclenme: { str: 8, end: 6, wil: 6 }
        saldiri:
          id: "son_hukum"
          ad: { tr: "Son Hüküm", en: "Final Sentence" }
          stat: "str"
          taban: 24
          kat: 1.0
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "kanama", sans: 0.45, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} kılıcını iki eliyle kaldırıp bütün ağırlığını tek bir darbeye veriyor.", en: "{dusman} lifts the sword two-handed and puts its whole weight into a single blow." }

