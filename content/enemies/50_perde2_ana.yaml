# Parti A — Perde 2 ana yay düşmanları (events/50_perde2_ana.yaml). Tasarım seviyesi 22–30; olaylarda ölçeklenir:
# hikaye bossları "@oyuncu+N", sokaktaki tehditler "@dunya", Kadim gözcüsü bilinçli olarak "@oyuncu+40" (yeni tavan).
dusmanlar:
  liman_kancasi:
    ad: { tr: "Liman Kancası", en: "Harbor Hook" }
    aciklama: { tr: "Limanın dibinde, batık teknelerin arasında büyümüş bir müren. Dili, ucunda kemikten bir kanca olan sarkık bir halat; iskeleden düşeni kancalayıp aşağı çekiyor.", en: "A moray that grew fat on the bottom of the harbor, between the sunken hulls. Its tongue is a slack rope with a bone hook on the end, and it reels in anything that falls off the pier." }
    kanca: { tr: "Su, iskelenin dibinde yağ gibi kabarıyor. Önce kanca çıkıyor; sonra kancanın sahibi.", en: "The water by the pier swells like oil. The hook comes up first. Then whatever owns it." }
    seviye: 24
    can: 380
    statlar:
      str: 30
      agi: 22
      end: 26
      int: 6
      wis: 12
      per: 20
      wil: 16
      cha: 3
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Derisi ıslak ve tuzlu; her yerinden su damlıyor. Bir kıvılcım bütün gövdesinde dolaşır.", en: "Its skin is wet and briny, dripping everywhere. One spark would run the whole length of it." }
    saldirilar:
      - id: "kanca_dil"
        ad: { tr: "Kanca Dil", en: "Hook Tongue" }
        stat: "str"
        taban: 12
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} dilini kamçı gibi savuruyor; kemik kanca omzuna takılıp eti yırtıyor.", en: "{dusman} cracks its tongue like a whip, and the bone hook catches your shoulder and tears." }
      - id: "dibe_cek"
        ad: { tr: "Dibe Çek", en: "Drag Under" }
        stat: "str"
        taban: 15
        kat: 0.9
        etiketler: ["fiziksel", "su"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} bileğine dolanıyor ve seni tek hamlede iskelenin kenarından suya sürüklüyor.", en: "{dusman} wraps around your ankle and hauls you off the edge of the pier in one pull." }
    xp: 3000
    kredi: 30
    ganimet: { kanca_disi: 0.6, canavar_cekirdegi: 0.3 }
    etiketler: ["deniz", "canavar"]
    boss: false

  tasma_yavrusu:
    ad: { tr: "Köpük Yavrusu", en: "Foamling" }
    aciklama: { tr: "Taşan kapıdan sürüyle dökülen, köpükten ve kabuktan yapılmış küçük şeyler. Tek başına bir kedi kadar tehlikeli; yüzü bir arada, bir sel kadar.", en: "Little things of foam and shell that pour out of an overflowing Gate by the hundred. One is about as dangerous as an angry cat. A hundred is a flood." }
    kanca: { tr: "Kaldırım taşlarının arasından köpük fışkırıyor ve köpüğün içinde yüzlerce küçük bacak tıkırdıyor.", en: "Foam bubbles up between the paving stones, and inside it, hundreds of little legs go tick-tick-tick." }
    seviye: 22
    can: 160
    statlar:
      str: 18
      agi: 26
      end: 14
      int: 4
      wis: 8
      per: 18
      wil: 10
      cha: 2
    davranis: "suru"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Köpükten yapılmışlar; ateş onları tıslayarak buhara çevirir.", en: "They're mostly foam. Fire turns them into hissing steam." }
    saldirilar:
      - id: "kabuk_makas"
        ad: { tr: "Kabuk Makas", en: "Shell Snip" }
        stat: "agi"
        taban: 8
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} bacağına tırmanıyor ve keskin kabuğuyla bir parça et koparıyor.", en: "{dusman} scrambles up your leg and snips off a piece of you with its razor shell." }
      - id: "tuzlu_kopuk"
        ad: { tr: "Tuzlu Köpük", en: "Brine Spray" }
        stat: "agi"
        taban: 6
        kat: 0.7
        etiketler: ["su", "alan"]
        durum: { etki: "kor", sans: 0.25, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} patlıyor ve gözlerine yakıcı bir tuzlu köpük bulutu savruluyor.", en: "{dusman} pops, and a cloud of stinging brine sprays right into your eyes." }
    xp: 2400
    kredi: 10
    ganimet: { kaya_tuzu: 0.5 }
    etiketler: ["deniz", "kapi", "suru"]
    boss: false

  odul_avcisi:
    ad: { tr: "Pano Avcısı", en: "Bounty Hunter" }
    aciklama: { tr: "Kule Dibi'ndeki ödül panosundan iş alan insan avcılar. Canavarlardan para kazanmayı bıraktılar; artık insanlardan kazanıyorlar ve buna daha çok yakıştılar.", en: "Human hunters who take jobs off the bounty board at Spire Plaza. They quit making money off monsters and started making it off people, and honestly, it suits them better." }
    kanca: { tr: "Dürbünün camı bir an parlıyor. Seni ilk gören o değil; sana ilk ulaşmak isteyen o.", en: "A scope lens catches the light for half a second. Not the first one to spot you. The first one who wants to get paid for it." }
    seviye: 26
    can: 330
    statlar:
      str: 24
      agi: 30
      end: 22
      int: 18
      wis: 18
      per: 32
      wil: 20
      cha: 12
    davranis: "temkinli"
    zeki: true
    zaaf: "goz"
    zaaf_metin: { tr: "Her şeyi dürbünüyle yapıyor; ona güveniyor. Gözünü al, elinde yalnızca bir bıçak kalır.", en: "He does everything through that scope. Trusts it more than himself. Take his eyes and all he's got left is a knife." }
    saldirilar:
      - id: "nisan"
        ad: { tr: "Nişan", en: "Called Shot" }
        stat: "per"
        taban: 13
        kat: 0.85
        etiketler: ["delici", "menzil"]
        bekleme: 0
        metin: { tr: "{dusman} tetiği nefesinin tam arasında çekiyor; mermi tam da adım atacağın yere geliyor.", en: "{dusman} squeezes the trigger between breaths, and the round lands exactly where you were about to step." }
      - id: "ag_atar"
        ad: { tr: "Ağ Atar", en: "Net Launcher" }
        stat: "agi"
        taban: 8
        kat: 0.7
        etiketler: ["fiziksel", "menzil"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} çelik telli bir ağ fırlatıyor; ağ üstüne kapanıp seni yere çiviliyor.", en: "{dusman} fires a steel-mesh net that drops over you and pins you to the ground." }
    xp: 3300
    kredi: 60
    ganimet: { buyuk_iyilesme_iksiri: 0.3, kucuk_iyilesme_iksiri: 0.6 }
    etiketler: ["insan", "avci"]
    boss: false

  kule_habercisi:
    ad: { tr: "Çan Başlı Haberci", en: "The Bellhead Herald" }
    aciklama: { tr: "Kule yükseldiği sabah ilk kapısından inen şey. Kara camdan uzun bir gövde, başının yerinde bronz bir çan. Her vuruşunda Kule bir kat daha uyanıyor.", en: "The thing that walked out of the Spire's first door on the morning it rose. A tall body of black glass with a bronze bell where its head should be. Every time it tolls, another floor of the Spire wakes up." }
    kanca: { tr: "Çan bir kez çalıyor. Meydandaki herkesin dişleri aynı anda sızlıyor.", en: "The bell tolls once. Every tooth in the square aches at the same time." }
    seviye: 26
    kademe: "E"
    can: 900
    statlar:
      str: 30
      agi: 20
      end: 32
      int: 28
      wis: 24
      per: 22
      wil: 30
      cha: 8
    davranis: "agresif"
    zeki: true
    zaaf: "isik"
    zaaf_metin: { tr: "Kara camı ışığı yutuyor ama sindiremiyor. Çok fazla ışık, camın içinde çatlak çatlak birikir.", en: "Its black glass swallows light but can't digest it. Too much light and it piles up inside the glass in cracks." }
    saldirilar:
      - id: "cam_kol"
        ad: { tr: "Cam Kol", en: "Glass Arm" }
        stat: "str"
        taban: 13
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kara camdan kolunu bir kılıç gibi savuruyor; kenarı havayı ıslık çalarak yarıyor.", en: "{dusman} swings a black-glass arm like a blade, and the edge whistles through the air." }
      - id: "cagri_cani"
        ad: { tr: "Çağrı Çanı", en: "Summoning Toll" }
        stat: "wil"
        taban: 11
        kat: 0.9
        etiketler: ["ses", "zihin", "alan"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} başını sallıyor ve çan çalıyor; ses kemiklerinin içinde çınlayıp dizlerini büküyor.", en: "{dusman} shakes its head and the bell rings. The sound hums inside your bones and buckles your knees." }
    xp: 3500
    kredi: 120
    ganimet: { haberci_cani: 1.0, canavar_cekirdegi: 1.0 }
    etiketler: ["boss", "kule"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Çan kendi kendine çalmaya başlıyor. Arkasında Kule'nin ilk dokuz katının pencereleri sırayla yanıyor; bir şey aşağı iniyor.", en: "The bell starts ringing on its own. Behind it, the windows of the Spire's first nine floors light up one after another. Something is coming down." }
        guclenme: { str: 3, wil: 3 }
        saldiri:
          id: "kat_cagrisi"
          ad: { tr: "Kat Çağrısı", en: "Floor Call" }
          stat: "int"
          taban: 14
          kat: 0.8
          etiketler: ["ses", "alan"]
          durum: { etki: "korku", sans: 0.35, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} dokuz kez çalıyor. Her vuruşta bir kat cevap veriyor ve meydan sarsılıyor.", en: "{dusman} tolls nine times. Every toll, a floor answers, and the whole square shakes." }
      - esik: 40
        metin: { tr: "Kara cam çatlıyor ve çatlaklardan yutmuş olduğu bütün sabah ışığı sızıyor. Gövdesi artık bir kandil gibi yanıyor; daha hızlı.", en: "The black glass cracks, and all the morning light it swallowed leaks out of the seams. It burns like a lantern now. Faster." }
        guclenme: { agi: 5, int: 4 }
        saldiri:
          id: "isik_kusmasi"
          ad: { tr: "Işık Kusması", en: "Lightspill" }
          stat: "int"
          taban: 15
          kat: 0.85
          etiketler: ["isik", "alan"]
          durum: { etki: "kor", sans: 0.45, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} çatlaklarından biriktirdiği ışığı bir sel gibi boşaltıyor; dünya beyaza kesiyor.", en: "{dusman} dumps all its hoarded light out of the cracks in one flood, and the world goes white." }
      - esik: 15
        metin: { tr: "Çan yarılıyor. Yarığın içinden yalnızca senin okuyabileceğin bir satır akıyor: [Davetiye teslim edildi. Alıcı: anomali.]", en: "The bell splits. Out of the crack runs a line only you can read: [Invitation delivered. Recipient: the anomaly.]" }
        guclenme: { str: 4, end: 4, wil: 4 }
        saldiri:
          id: "son_cagri"
          ad: { tr: "Son Çağrı", en: "Last Call" }
          stat: "wil"
          taban: 17
          kat: 0.9
          etiketler: ["ses", "zihin"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} kırık çanını tam yüzüne çalıyor; ses kafatasının içinde adını heceliyor.", en: "{dusman} rings the broken bell right in your face, and the sound spells out your name inside your skull." }

  cekirdek_muhafizi:
    ad: { tr: "Saat Taşı Muhafızı", en: "The Clockstone Warden" }
    aciklama: { tr: "Kasaba Çekirdeği'yle birlikte toprağın altından çıkan muhafız. Eski hükümet konağının taşlarından ve saat kulesinin dişlilerinden kendine bir gövde örmüş; göğsünde kristal bir sarkaç sallanıyor.", en: "The guardian that clawed up out of the ground along with the Town Core. It built itself a body out of the old courthouse's stone and the clock tower's gears, and a crystal pendulum swings in its chest." }
    kanca: { tr: "Saat kulesi on üçü vuruyor. Meydanın taşları kalkıyor, birleşiyor ve ayağa kalkıyor.", en: "The clock tower strikes thirteen. The paving stones in the square lift, lock together and stand up." }
    seviye: 28
    kademe: "E"
    can: 1100
    statlar:
      str: 36
      agi: 14
      end: 40
      int: 22
      wis: 24
      per: 20
      wil: 32
      cha: 4
    davranis: "temkinli"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Göğsündeki sarkaç kristal; doğru frekansta bir ses onu çatlatır ve bütün dişliler bir an durur.", en: "The pendulum in its chest is crystal. Hit the right frequency and it cracks, and every gear in the thing stops for a beat." }
    saldirilar:
      - id: "dislici_yumruk"
        ad: { tr: "Dişli Yumruk", en: "Geared Fist" }
        stat: "str"
        taban: 14
        kat: 0.85
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} dişlilerle kaplı yumruğunu indiriyor; dişler etini kapıp çeviriyor.", en: "{dusman} brings down a fist wrapped in gears, and the teeth catch you and grind." }
      - id: "zaman_siniri"
        ad: { tr: "Mesai Bitti", en: "Closing Time" }
        stat: "wil"
        taban: 10
        kat: 0.9
        etiketler: ["zihin", "alan"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} sarkacını durduruyor ve bir an her şey duruyor; sen de.", en: "{dusman} stops its pendulum, and for one moment everything stops. You included." }
    xp: 4000
    kredi: 150
    ganimet: { saat_tasi: 1.0, canavar_cekirdegi: 1.0, buyuk_iyilesme_iksiri: 0.5 }
    etiketler: ["boss", "cekirdek"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Saat kulesi deli gibi çalmaya başlıyor ve muhafızın dişlileri ters dönüyor. Taşları birbirinden ayrılıp onu çevreleyen bir duvar örüyor.", en: "The clock tower starts ringing like it's lost its mind, and the Warden's gears spin backward. Its stones peel apart and build a wall around it." }
        guclenme: { end: 4, wil: 3 }
        saldiri:
          id: "tas_duvar"
          ad: { tr: "Konak Duvarı", en: "Courthouse Wall" }
          stat: "end"
          taban: 13
          kat: 0.8
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "kalkan", sans: 1.0, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} meydanın taşlarını kaldırıp bir duvar gibi üstüne yıkıyor, sonra arkasına saklanıyor.", en: "{dusman} rips up the square and drops it on you like a wall, then ducks behind what's left." }
      - esik: 40
        metin: { tr: "Sarkaç hızlanıyor. Muhafız artık bir saat gibi değil, kurulmuş bir bomba gibi tıkırdıyor.", en: "The pendulum speeds up. The Warden doesn't tick like a clock anymore. It ticks like something with a fuse." }
        guclenme: { agi: 6, str: 3 }
        saldiri:
          id: "sarkac_vurusu"
          ad: { tr: "Sarkaç Vuruşu", en: "Pendulum Swing" }
          stat: "str"
          taban: 16
          kat: 0.9
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} göğsündeki sarkacı söküp bir gürz gibi savuruyor.", en: "{dusman} tears the pendulum out of its own chest and swings it like a mace." }
      - esik: 15
        metin: { tr: "Dişliler dökülüyor. Taşların arasından Çekirdek'in mavi ışığı sızıyor ve ışıkta bir satır titriyor: [Bağlantı adayı tespit edildi.]", en: "Gears spill out of it. The Core's blue light leaks between the stones, and a line flickers in the glow: [Binding candidate detected.]" }
        guclenme: { str: 4, end: 4, wil: 4 }
        saldiri:
          id: "on_ucuncu_vurus"
          ad: { tr: "On Üçüncü Vuruş", en: "The Thirteenth Stroke" }
          stat: "wil"
          taban: 18
          kat: 0.9
          etiketler: ["ses", "alan"]
          durum: { etki: "korku", sans: 0.45, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} son kez çalıyor ve on üçüncü vuruş göğsünün tam ortasına iniyor.", en: "{dusman} strikes one last time, and the thirteenth stroke lands dead center in your chest." }

  tasma_anasi:
    ad: { tr: "Dalga Ana", en: "The Brood Tide" }
    aciklama: { tr: "Kordon'daki kapının kırk dokuz gün boyunca içinde büyüttüğü şey. Bir yengecin kabuğu, bir denizanasının etekleri ve bir binanın boyu; sırtında taşıdığı köpüğün içinde binlerce yavrusu var.", en: "The thing the Esplanade Gate spent forty-nine days growing. A crab's shell, a jellyfish's skirts and the height of an apartment building, with thousands of its brood riding the foam on its back." }
    kanca: { tr: "Kapı patlıyor ve deniz ters akıyor: dalga sahile değil, sahilden kapıya doğru çekiliyor. Sonra geri geliyor; içinde o var.", en: "The Gate bursts and the sea runs backward, the wave pulling off the beach toward the Gate instead of in. Then it comes back. With her in it." }
    seviye: 30
    kademe: "E"
    can: 1500
    statlar:
      str: 40
      agi: 18
      end: 42
      int: 24
      wis: 22
      per: 24
      wil: 30
      cha: 4
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Eteklerinden durmadan deniz suyu süzülüyor; tuzlu su elektriği bir otoban gibi taşır.", en: "Seawater never stops running off her skirts, and salt water carries current like a freeway." }
    saldirilar:
      - id: "kiskac"
        ad: { tr: "Rıhtım Kıskacı", en: "Seawall Claw" }
        stat: "str"
        taban: 15
        kat: 0.85
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} rıhtım boyunda bir kıskaç indiriyor; beton ve sen aynı anda ezilip yarılıyorsunuz.", en: "{dusman} brings down a claw as long as the seawall, and you and the concrete split at the same time." }
      - id: "zehirli_etek"
        ad: { tr: "Yakıcı Etekler", en: "Stinging Skirts" }
        stat: "int"
        taban: 12
        kat: 0.8
        etiketler: ["zehir", "alan"]
        durum: { etki: "zehir", sans: 0.45, sure: 3 }
        bekleme: 2
        metin: { tr: "{dusman} eteklerini sahile seriyor; her iplik derine yapışıp yakıyor.", en: "{dusman} spreads her skirts across the beach, and every strand that touches you sticks and burns." }
    xp: 4500
    kredi: 200
    ganimet: { tasma_kalbi: 1.0, canavar_cekirdegi: 1.0, buyuk_iyilesme_iksiri: 0.6 }
    etiketler: ["boss", "kapi", "deniz"]
