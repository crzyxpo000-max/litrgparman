    fazlar:
      - esik: 70
        metin: { tr: "Sırtındaki köpük kaynamaya başlıyor ve yavrular sel gibi rıhtıma dökülüyor. Arkanda biri çığlık atıyor.", en: "The foam on her back starts to boil and the brood spills onto the seawall like a flash flood. Somebody behind you screams." }
        guclenme: { agi: 3, int: 3 }
        saldiri:
          id: "yavru_seli"
          ad: { tr: "Yavru Seli", en: "Broodflood" }
          stat: "agi"
          taban: 13
          kat: 0.8
          etiketler: ["fiziksel", "alan"]
          durum: { etki: "kanama", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} sırtını silkeliyor ve yüzlerce köpük yavrusu üstüne yağıyor.", en: "{dusman} shrugs her back, and hundreds of foamlings rain down on you." }
      - esik: 40
        metin: { tr: "Deniz bir kez daha ters akıyor. Kordon'un yarısı suya gömülüyor ve o, suyun içinde çok daha hızlı.", en: "The sea runs backward again. Half the Esplanade goes under, and she is a whole lot faster in the water." }
        guclenme: { agi: 6, str: 3 }
        saldiri:
          id: "geri_dalga"
          ad: { tr: "Ters Dalga", en: "Backwash" }
          stat: "str"
          taban: 17
          kat: 0.9
          etiketler: ["su", "alan"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} bütün denizi arkasına alıp üstüne bir duvar gibi boşaltıyor.", en: "{dusman} puts the whole sea behind her and drops it on you like a wall." }
      - esik: 15
        metin: { tr: "Kabuğu yarılıyor. İçinde, kapının kalbi gibi atan mavi bir ışık var ve ışıkta bir sayaç: [Taşma: %100. Sıradaki bölge hesaplanıyor.]", en: "Her shell splits open. Inside, a blue light pulses like the Gate's own heart, with a counter in it: [Overflow: 100%. Calculating next district.]" }
        guclenme: { str: 5, end: 4, wil: 4 }
        saldiri:
          id: "son_gelgit"
          ad: { tr: "Son Gelgit", en: "Last Tide" }
          stat: "str"
          taban: 19
          kat: 0.95
          etiketler: ["fiziksel", "su"]
          durum: { etki: "korku", sans: 0.45, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} kalan bütün gücüyle kabuğunu üstüne kapatıyor; içerisi tuzlu ve karanlık.", en: "{dusman} slams her shell shut over you with everything she has left. Inside, it's salt and dark." }

  duzeltici:
    ad: { tr: "Düzeltici", en: "The Corrector" }
    aciklama: { tr: "Öğretici'de adını harf harf arayan rünlü kabuğun büyümüş hâli. Bu kez kabuk değil, bir insan siluetinde; rünleri artık adını biliyor.", en: "The rune-shell that hunted for your name letter by letter in the Tutorial, all grown up. This time it isn't a shell. It's shaped like a person, and its runes know your name now." }
    kanca: { tr: "Sokak lambası sönüyor. Altında, yüzünün yerinde senin adın yazan biri duruyor.", en: "The streetlight goes out. Under it stands someone with your name written where their face should be." }
    seviye: 28
    kademe: "E"
    can: 1000
    statlar:
      str: 26
      agi: 30
      end: 28
      int: 36
      wis: 30
      per: 34
      wil: 30
      cha: 2
    davranis: "agresif"
    zeki: true
    zaaf: "karanlik"
    zaaf_metin: { tr: "Sistem'in kendi ışığıyla yazılmış. Karanlıkta rünleri bulanıklaşıyor ve adını bir an unutuyor.", en: "It's written in the System's own light. In the dark its runes blur, and for a second it forgets your name." }
    saldirilar:
      - id: "satir_sil"
        ad: { tr: "Satır Sil", en: "Line Delete" }
        stat: "int"
        taban: 13
        kat: 0.85
        etiketler: ["zihin", "glitch"]
        bekleme: 0
        metin: { tr: "{dusman} parmağını havada bir çizgi gibi çekiyor ve penceren titriyor; bir satır, bir an için, yok.", en: "{dusman} draws a line through the air with one finger and your window flickers. One line of you is just gone, for a second." }
      - id: "geri_yukle"
        ad: { tr: "Geri Yükle", en: "Restore Point" }
        stat: "wis"
        taban: 10
        kat: 0.8
        etiketler: ["zihin"]
        durum: { etki: "kalkan", sans: 1.0, sure: 2 }
        bekleme: 3
        metin: { tr: "{dusman} kendini birkaç saniye geriye sarıyor; açtığın yara kendiliğinden kapanıyor.", en: "{dusman} rewinds itself a few seconds, and the wound you just opened closes on its own." }
    xp: 4000
    kredi: 0
    ganimet: { duzeltme_kalintisi: 1.0 }
    etiketler: ["boss", "sistem"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Rünler yüzünde hızla akıyor ve adın tamamlanıyor. Gökyüzünde herkese açık bir pencere beliriyor: [Düzeltme sürüyor. Lütfen uzak durun.]", en: "The runes race across its face and your name fills in. A public window opens in the sky: [Correction in progress. Please stand clear.]" }
        guclenme: { int: 4, per: 3 }
        saldiri:
          id: "ad_cagri"
          ad: { tr: "Adını Çağır", en: "Call by Name" }
          stat: "int"
          taban: 15
          kat: 0.85
          etiketler: ["zihin", "glitch"]
          durum: { etki: "korku", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} adını yüksek sesle okuyor. Bir an, kim olduğundan emin olamıyorsun.", en: "{dusman} reads your name out loud. For a second, you're not sure who you are." }
      - esik: 40
        metin: { tr: "Siluet ikiye bölünüyor; biri sana saldırıyor, öbürü ne yapacağını önceden yazıyor.", en: "The silhouette splits in two. One comes at you. The other writes down what you're going to do before you do it." }
        guclenme: { agi: 5, wis: 4 }
        saldiri:
          id: "on_yazim"
          ad: { tr: "Ön Yazım", en: "Prewrite" }
          stat: "per"
          taban: 16
          kat: 0.9
          etiketler: ["zihin", "delici"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} senin bir sonraki hamleni okuyup o hamlenin tam ortasına vuruyor.", en: "{dusman} reads your next move off the page and hits you right in the middle of it." }
      - esik: 15
        metin: { tr: "Rünler kararıyor. Bozuk satırlarının arasından tanıdık bir ses fısıldıyor; seninle değil, onunla konuşuyor: geri çekil. bu benim.", en: "The runes go dark. Through its broken lines a familiar voice whispers, not to you, to it: back off. this one's mine." }
        guclenme: { int: 5, wil: 5, agi: 3 }
        saldiri:
          id: "tam_duzeltme"
          ad: { tr: "Tam Düzeltme", en: "Full Correction" }
          stat: "int"
          taban: 19
          kat: 0.95
          etiketler: ["zihin", "glitch", "alan"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} iki elini göğsüne bastırıyor ve seni baştan yazmaya başlıyor.", en: "{dusman} presses both hands to your chest and starts writing you over from scratch." }

  kadim_gozcusu:
    ad: { tr: "Kadim Gözcüsü", en: "The Ancient Watcher" }
    aciklama: { tr: "Öğretici'de sırtın üstünden seni izleyen, insan olmayan şey. Uzun, ince ve sabırlı; gövdesi bir pelerin değil, katlanmış bir harita. Ölçmeye geldi, öldürmeye değil; ama ikisini ayırmıyor.", en: "The thing that watched you from the ridge in the Tutorial. Tall, thin and patient, its body not a cloak but a folded map. It came to measure, not to kill. It just doesn't see much of a difference." }
    kanca: { tr: "Rüzgâr kesiliyor. Havada, yıldızların arasında katlanmış bir kâğıt gibi açılan bir şey var.", en: "The wind dies. Up between the stars, something is unfolding like a piece of paper." }
    seviye: 30
    kademe: "E"
    can: 1300
    statlar:
      str: 32
      agi: 34
      end: 30
      int: 40
      wis: 40
      per: 40
      wil: 36
      cha: 20
    davranis: "temkinli"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Her şeyi ölçüyor ve ölçemediğinden rahatsız. Beklenmedik bir şey yap; bir an duraksar.", en: "It measures everything, and anything it can't measure bothers it. Do something it didn't see coming and it hesitates." }
    saldirilar:
      - id: "olcu_cizgisi"
        ad: { tr: "Ölçü Çizgisi", en: "Measuring Line" }
        stat: "per"
        taban: 14
        kat: 0.85
        etiketler: ["delici", "menzil"]
        bekleme: 0
        metin: { tr: "{dusman} havaya ince bir çizgi çekiyor; çizgi derinden geçerken seni santim santim ölçüyor.", en: "{dusman} draws a thin line in the air, and as it passes through you it measures you inch by inch." }
      - id: "katlama"
        ad: { tr: "Katlama", en: "Fold" }
        stat: "int"
        taban: 12
        kat: 0.9
        etiketler: ["zihin", "alan"]
        durum: { etki: "sersemleme", sans: 0.4, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} etrafındaki sokağı bir harita gibi katlıyor; bir an kendini iki yerde birden buluyorsun.", en: "{dusman} folds the street around you like a map, and for a moment you're standing in two places at once." }
    xp: 4500
    kredi: 0
    ganimet: { kadim_pulu: 1.0 }
    etiketler: ["boss", "kadim"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Gözcü ilk kez sesini çıkarıyor; anlamadığın bir dilde, bir notu okur gibi. Sonra harita gövdesini açıyor.", en: "The Watcher makes a sound for the first time, in a language you don't know, like it's reading a note aloud. Then it unfolds its map of a body." }
        guclenme: { int: 4, per: 4 }
        saldiri:
          id: "harita_acilir"
          ad: { tr: "Harita Açılır", en: "Map Unfolds" }
          stat: "int"
          taban: 15
          kat: 0.9
          etiketler: ["zihin", "alan"]
          durum: { etki: "kor", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} gövdesini sonuna kadar açıyor; üstünde bin dünya, hepsinin üstü çizilmiş.", en: "{dusman} opens its body all the way. A thousand worlds are drawn on it, and every one has been crossed out." }
      - esik: 40
        metin: { tr: "Gözcü artık ölçmüyor. Bir şeyi not etmiş: ölçeğin yetmediğini.", en: "The Watcher has stopped measuring. It's made a note of something: the scale isn't big enough." }
        guclenme: { agi: 5, wil: 4 }
        saldiri:
          id: "uzaktan_el"
          ad: { tr: "Uzaktan El", en: "Long Hand" }
          stat: "str"
          taban: 17
          kat: 0.9
          etiketler: ["fiziksel", "menzil"]
          durum: { etki: "korku", sans: 0.35, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} göğün öbür ucundan uzanan bir elle seni yakalayıp yere çarpıyor.", en: "{dusman} reaches down with a hand from the far end of the sky and slams you into the street." }
      - esik: 15
        metin: { tr: "Haritanın bir köşesi yanıyor. Gözcü yanan köşeye bakıyor; ilk kez, sana değil.", en: "One corner of the map catches fire. The Watcher looks at the burning corner, and for the first time, not at you." }
        guclenme: { int: 5, wis: 5, wil: 4 }
        saldiri:
          id: "ustunu_ciz"
          ad: { tr: "Üstünü Çiz", en: "Strike Through" }
          stat: "int"
          taban: 19
          kat: 0.95
          etiketler: ["zihin", "delici"]
          durum: { etki: "kanama", sans: 0.45, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} bir kalem gibi tek bir çizgi çekiyor; çizgi, tam üstünden geçiyor.", en: "{dusman} draws one stroke like a pen, and the stroke runs straight through you." }
