    etiketler: ["insan"]
    boss: false

  demir_bascavus:
    ad: { tr: "Demir Lonca'nın Başçavuşu", en: "The Iron Guild's Gunny" }
    aciklama: { tr: "Yirmi yıl üniforma giymiş, kıyamete herkesten önce hazırlanmış adam. Şimdi Haddehane'nin ortasında, Lonca'nın zırhçılarının ona özel döktüğü sac koşumun içinde duruyor. Süngüsü yine o eski süngü.", en: "Twenty years in uniform, ready for the end of the world before anyone else. Now he's standing in the middle of the rolling mill in a steel rig the Guild's armorers poured just for him. Same bayonet as always." }
    kanca: { tr: "Başçavuş miğferini takmıyor; koltuğunun altına alıyor. \"Talimdeymişiz gibi,\" diyor. \"Hazır olduğunda.\"", en: "The Gunny doesn't put his helmet on. He tucks it under his arm. \"Like it's a drill,\" he says. \"Whenever you're ready.\"" }
    seviye: 30
    can: 2400
    statlar:
      str: 42
      agi: 24
      end: 40
      int: 16
      wis: 22
      per: 30
      wil: 40
      cha: 22
    davranis: "temkinli"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Bedeni saat gibi işler, aklı ise şehirdedir. Ona haklı olmadığını gösterirsen eli bir an duraklar.", en: "His body runs like clockwork. His mind's out in the city. Show him he might be wrong and his hand hesitates, just for a beat." }
    saldirilar:
      - id: "sungu"
        ad: { tr: "Süngü Disiplini", en: "Bayonet Drill" }
        stat: "str"
        taban: 17
        kat: 0.9
        etiketler: ["delici", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} hiç acele etmeden adım alıp kısa, tutumlu iki vuruş indiriyor. Üçüncüsünü ancak sana indikten sonra görüyorsun.", en: "{dusman} steps in without hurrying. Two short, economical strikes. You only see the third one after it lands." }
      - id: "dipcik"
        ad: { tr: "Dipçik", en: "Butt Stroke" }
        stat: "end"
        taban: 13
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} tüfeği ters çevirip dipçiği çenene oturtuyor.", en: "{dusman} flips the rifle and plants the butt stock on your jaw." }
    xp: 9500
    kredi: 300
    ganimet: { demir_muhur: 1.0, lonca_tayini: 1.0 }
    etiketler: ["insan", "boss"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Başçavuş sonunda miğferini takıyor. Koşumun omuzlarındaki pistonlar tıslıyor; bu artık talim değil.", en: "The Gunny finally puts his helmet on. The pistons in the shoulders of his rig hiss. This isn't a drill anymore." }
        guclenme: { str: 6, end: 6 }
        saldiri:
          id: "piston"
          ad: { tr: "Piston Yumruğu", en: "Piston Punch" }
          stat: "str"
          taban: 19
          kat: 0.9
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} koşumun kolundaki pistonu ateşliyor; yumruğu bir pres gibi göğsüne iniyor.", en: "{dusman} fires the piston in his rig's arm and his fist hits your chest like a hydraulic press." }
      - esik: 40
        metin: { tr: "Sağ dizindeki eski yara sonunda sesini çıkarıyor, Başçavuş topallamaya başlıyor. Ama ne duruşu değişiyor ne sesi: \"Daha bitmedi, asker.\"", en: "The old wound in his right knee finally speaks up, and the Gunny starts to limp. His stance doesn't change. Neither does his voice: \"Not done yet, kid.\"" }
        guclenme: { wil: 8, per: 6 }
        saldiri:
          id: "emir"
          ad: { tr: "Komuta Sesi", en: "Command Voice" }
          stat: "wil"
          taban: 15
          kat: 0.8
          etiketler: ["ses", "zihin"]
          durum: { etki: "korku", sans: 0.35, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} yirmi yıllık talim alanlarının bütün ağırlığını tek bir sözcüğe yüklüyor: \"Dur.\" Bacakların bir an söz dinliyor.", en: "{dusman} says one word, with twenty years of parade decks behind it: \"Halt.\" For a second, your legs obey." }
      - esik: 15
        metin: { tr: "Koşumun pistonlarından biri kopuyor; Başçavuş onu söküp fırlatıyor, elinde yalnız süngüsü kalıyor. Yüzünde korku da öfke de yok, yalnızca dikkat var.", en: "One of the rig's pistons snaps. The Gunny rips it out, tosses it aside, and keeps only the bayonet. There's no fear on his face and no anger. Just focus." }
        guclenme: { agi: 10, str: 6 }
        saldiri:
          id: "son_hucum"
          ad: { tr: "Süngü Hücumu", en: "Bayonet Charge" }
          stat: "agi"
          taban: 22
          kat: 1.0
          etiketler: ["delici", "yakin"]
          durum: { etki: "kanama", sans: 0.45, sure: 3 }
          bekleme: 3
          metin: { tr: "{dusman} yirmi yıllık bir askerin bütün hızını tek bir hücuma koyuyor; süngünün ucu kalbini arıyor.", en: "{dusman} pours every ounce of speed a twenty-year soldier has into one charge, the tip of the bayonet hunting for your heart." }

  kadim_hat_yarici:
    ad: { tr: "Kadim Hat Yarıcı", en: "Ancient Line-Breaker" }
    aciklama: { tr: "Kadim filosunun öncü dalgasıyla inen, savaş için yetiştirilmiş bir yaratık: üç katlı bir bina boyunda, sırtında Kadim nişancıların yuvaları. Siperleri yarıp piyadeye yol açmak için yaratılmış.", en: "A war-bred creature dropped with the Ancient fleet's first wave: three stories tall, with nests for Ancient marksmen on its back. Built to split a defensive line open so the infantry can pour through." }
    kanca: { tr: "Körfezin üstünde gök yırtılıyor; sırtında ışıklar yanıp sönen bir şey kıyıya iniyor. Yer üç kez sarsılıyor, dördüncüde siper çöküyor.", en: "The sky over the bay rips open and something comes down on the shoreline with lights blinking across its back. The ground shakes three times. On the fourth, the trench caves in." }
    seviye: 30
    can: 2300
    statlar:
      str: 44
      agi: 16
      end: 44
      int: 18
      wis: 16
      per: 26
      wil: 34
      cha: 4
    davranis: "agresif"
    zeki: true
    zaaf: "goz"
    zaaf_metin: { tr: "Sırtındaki nişancılar onun gözleridir. Yuvaları susturursan kör bir boğa gibi döner durur.", en: "The marksmen on its back are its eyes. Shut the nests down and the giant just wheels around like a blind bull." }
    saldirilar:
      - id: "yarma"
        ad: { tr: "Hat Yarma", en: "Breach" }
        stat: "str"
        taban: 18
        kat: 0.9
        etiketler: ["fiziksel", "alan"]
        durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} başını indirip siperin içinden geçiyor; kum torbalarıyla, kalaslarla birlikte sen de havaya savruluyorsun.", en: "{dusman} drops its head and plows straight through the trench. Sandbags, timbers and you all go flying." }
      - id: "yuva_atesi"
        ad: { tr: "Yuva Ateşi", en: "Nest Fire" }
        stat: "per"
        taban: 14
        kat: 0.8
        etiketler: ["isik", "menzilli"]
        durum: { etki: "yanma", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} sırtındaki yuvalardan soluk mavi ışınlar yağdırıyor; ışınların değdiği çamur camlaşıyor.", en: "{dusman} rains pale blue beams from the nests on its back, and the mud turns to glass wherever they hit." }
    xp: 9000
    kredi: 300
    ganimet: { canavar_cekirdegi: 1.0, buyuk_iyilesme_iksiri: 0.6 }
    etiketler: ["kadim", "boss"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Sırttaki nişancılar çığlık çığlığa bağırırken dev şaha kalkıyor; karnındaki zırh plakaları birer birer açılıyor.", en: "The marksmen on its back start shrieking, and the giant rears up as the armor plates on its belly peel open one by one." }
        guclenme: { str: 6, per: 4 }
        saldiri:
          id: "karin_topu"
          ad: { tr: "Karın Topu", en: "Belly Cannon" }
          stat: "int"
          taban: 17
          kat: 0.9
          etiketler: ["isik", "alan"]
          durum: { etki: "yanma", sans: 0.4, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} karnındaki açıklıktan beyaz bir ışık topu kusuyor; patlama siperin yarısını götürüyor.", en: "{dusman} vomits a ball of white light out of the opening in its belly, and the blast takes out half the trench." }
      - esik: 40
        metin: { tr: "Yuvalardan biri susuyor. Yarı kör kalan dev öfkeyle dönüp duruyor; sağa sola savurduğu kuyruğu bir mahalleyi silecek uzunlukta.", en: "One of the nests goes quiet. The giant's half blind now and spinning in a rage, swinging a tail long enough to wipe out a city block." }
        guclenme: { str: 8, agi: 6 }
        saldiri:
          id: "kuyruk"
          ad: { tr: "Kuyruk Savurma", en: "Tail Sweep" }
          stat: "str"
          taban: 20
          kat: 0.9
          etiketler: ["fiziksel", "alan"]
          bekleme: 2
          metin: { tr: "{dusman} kuyruğunu yerin bir karış üstünden savuruyor; önünde ne varsa biçiliyor.", en: "{dusman} sweeps its tail a few inches off the ground and mows down everything in front of it." }
      - esik: 15
        metin: { tr: "Dev dizlerinin üstüne çöküyor. Sırtındaki son nişancı gökyüzüne bir ışık fırlatıyor: filoya bir çağrı ya da bir veda.", en: "The giant drops to its knees. The last marksman on its back fires a light into the sky. A call to the fleet, or a goodbye." }
        guclenme: { wil: 8, end: 8 }
        saldiri:
          id: "son_cagri"
          ad: { tr: "Filo Çağrısı", en: "Fleet Call" }
          stat: "wil"
          taban: 22
          kat: 1.0
          etiketler: ["isik", "alan"]
          durum: { etki: "korku", sans: 0.35, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} başını göğe kaldırıp uluyor; gök de bir ışık sütunuyla cevap veriyor, tam üstüne.", en: "{dusman} throws its head back and howls, and the sky answers with a column of light. Straight down on top of you." }
