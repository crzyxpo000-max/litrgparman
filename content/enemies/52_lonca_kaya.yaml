      str: 22
      agi: 22
      end: 20
      int: 10
      wis: 12
      per: 20
      wil: 18
      cha: 10
    davranis: "suru"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Hepsi gözü Reis'te savaşır. Reis sarsılırsa onlar da sarsılır.", en: "They all fight with one eye on the Harbormaster. Shake him and they shake too." }
    saldirilar:
      - id: "zipkin"
        ad: { tr: "Zıpkın", en: "Harpoon Thrust" }
        stat: "agi"
        taban: 11
        kat: 0.8
        etiketler: ["delici", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} zıpkını bir balina avcısı gibi kısa ve sert saplıyor.", en: "{dusman} drives the harpoon in short and hard, like a whaler." }
      - id: "yuk_kancasi"
        ad: { tr: "Yük Kancası", en: "Cargo Hook" }
        stat: "str"
        taban: 9
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.2, sure: 1 }
        bekleme: 1
        metin: { tr: "{dusman} yük kancasını bileğine takıp seni yere çekmeye çalışıyor.", en: "{dusman} hooks your wrist with a cargo hook and tries to drag you down." }
    xp: 4600
    kredi: 40
    ganimet: { hurda: 0.4, kucuk_iyilesme_iksiri: 0.3 }
    etiketler: ["insan"]
    boss: false

  liman_reisi:
    ad: { tr: "Liman Reisi", en: "The Harbormaster" }
    aciklama: { tr: "Mavi Çapa'nın başındaki eski römorkör kaptanı. Elli yılını körfezde gemi iterek geçirmiş, şimdi de Lonca'yı itiyor. Penceresini olduğundan küçük gösterecek kadar akıllıdır.", en: "The old tugboat captain who runs the Blue Anchor. Fifty years pushing ships around the bay, and now he's pushing back on the Guild. Smart enough to keep his window dialed down." }
    kanca: { tr: "Mezat kürsüsünün arkasından iri, sakallı bir adam kalkıyor; omzunda bir römorkör halatı, elinde gemi zinciri. \"Kaptanınıza söyleyin, bu limanın tek bir kaptanı var.\"", en: "A big bearded man gets up from behind the auction podium, a tug line over his shoulder and a length of anchor chain in his fist. \"Tell your captain this harbor's only got room for one.\"" }
    seviye: 30
    can: 2000
    statlar:
      str: 36
      agi: 20
      end: 36
      int: 14
      wis: 22
      per: 24
      wil: 32
      cha: 26
    davranis: "temkinli"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Bütün loncası ona bakıyor; ölmekten değil, onların gözü önünde diz çökmekten korkuyor.", en: "His whole guild is watching him. He isn't scared of dying. He's scared of going to his knees in front of them." }
    saldirilar:
      - id: "zincir"
        ad: { tr: "Çapa Zinciri", en: "Anchor Chain" }
        stat: "str"
        taban: 16
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} gemi zincirini başının üstünde çevirip bir çapa gibi bırakıyor.", en: "{dusman} whirls the anchor chain over his head and lets it drop like an anchor." }
      - id: "dalga"
        ad: { tr: "Körfez Dalgası", en: "Bay Swell" }
        stat: "wis"
        taban: 12
        kat: 0.8
        etiketler: ["su", "alan"]
        bekleme: 2
        metin: { tr: "{dusman} yumruğunu iskelenin tahtalarına indiriyor; altındaki körfez kabarıp salonun içine taşıyor.", en: "{dusman} drives his fist into the dock planks, and the bay underneath heaves up and floods into the hall." }
    xp: 7500
    kredi: 180
    ganimet: { canavar_cekirdegi: 0.8, buyuk_iyilesme_iksiri: 0.5 }
    etiketler: ["insan", "elit"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Reis penceresinin ayarını açıyor; görünen seviyesi gözlerinin önünde tırmanıyor. Kendi avcıları bile bir adım geri çekiliyor.", en: "The Harbormaster opens his window back up, and his displayed level climbs right in front of you. Even his own hunters take a step back." }
        guclenme: { str: 6, end: 6 }
        saldiri:
          id: "halat"
          ad: { tr: "Römorkör Halatı", en: "Tug Line" }
          stat: "str"
          taban: 17
          kat: 0.9
          etiketler: ["fiziksel"]
          durum: { etki: "sersemleme", sans: 0.3, sure: 1 }
          bekleme: 2
          metin: { tr: "{dusman} halatı beline dolayıp seni bir mavna gibi kendine çekiyor.", en: "{dusman} loops the tug line around your waist and hauls you in like a barge." }
      - esik: 40
        metin: { tr: "Salonun camları patlıyor, körfezin soğuk suyu dizlerinize kadar yükseliyor. Reis gücünü bu sudan alıyor; elli yıldır da hep öyle olmuş.", en: "The hall windows blow out and cold bay water rises to your knees. The Harbormaster draws strength from it. He has for fifty years." }
        guclenme: { wis: 8, wil: 6 }
        saldiri:
          id: "gelgit"
          ad: { tr: "Gelgit", en: "Riptide" }
          stat: "wis"
          taban: 16
          kat: 0.9
          etiketler: ["su", "alan"]
          durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
          bekleme: 3
          metin: { tr: "{dusman} kollarını açınca ayağının altındaki su anafor gibi seni dibe çekiyor.", en: "{dusman} spreads his arms and the water at your feet turns into an undertow that drags you down." }
      - esik: 15
        metin: { tr: "Reis bir dizinin üstüne çöküyor ama zinciri bırakmıyor. Arkasında avcıları bekliyor; o diz çökerse onlar da çökecek.", en: "The Harbormaster goes down on one knee but doesn't let go of the chain. His hunters are waiting behind him. If he kneels, they all kneel." }
        guclenme: { str: 8, wil: 8 }
        saldiri:
          id: "son_demir"
          ad: { tr: "Son Demir", en: "Let Go the Anchor" }
