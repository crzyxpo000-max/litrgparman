# Parti B2 düşmanları. Tasarım seviyesi 30; içerikte hep göreli başvuruyla kullanılır (@dunya, @oyuncu+N).
dusmanlar:
  percin_kurdu:
    ad: { tr: "Perçin Kurdu", en: "Rivet Grub" }
    aciklama: { tr: "Kapının öbür yanından taşan, kol boyunda soluk bir kurtçuk. Demir yer; perçinleri söküp yutar, sonra midesinde eritip kabuğuna sıvar.", en: "A pale grub as long as your forearm that spills out of the Gate. It eats iron: pulls rivets loose, swallows them, melts them down in its gut and plasters them onto its own shell." }
    kanca: { tr: "Havuzun dibindeki sac levhalar kendiliğinden tıkırdamaya başlıyor; her perçin deliğinden soluk bir baş uzanıyor.", en: "The steel plates at the bottom of the basin start ticking on their own, and a pale head pokes out of every rivet hole." }
    seviye: 30
    can: 260
    statlar:
      str: 18
      agi: 20
      end: 22
      int: 4
      wis: 6
      per: 14
      wil: 10
      cha: 2
    davranis: "suru"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Kabuğu eritilmiş demirdendir ama içi hâlâ yumuşak ve kurudur. Alev kabuğun altına girerse kurt kendi demirinin içinde pişer.", en: "Its shell is melted-down iron, but the inside is still soft and dry. Get fire under that shell and it cooks in its own armor." }
    saldirilar:
      - id: "matkap_agiz"
        ad: { tr: "Matkap Ağız", en: "Drill Mouth" }
        stat: "str"
        taban: 9
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} halka halka dişlerini döndürerek baldırına gömülüyor.", en: "{dusman} spins its rings of teeth and bores into your calf." }
      - id: "pas_tukurugu"
        ad: { tr: "Pas Tükürüğü", en: "Rust Spit" }
        stat: "end"
        taban: 7
        kat: 0.7
        etiketler: ["zehir", "menzilli"]
        durum: { etki: "zehir", sans: 0.35, sure: 3 }
        bekleme: 2
        metin: { tr: "{dusman} gövdesini kasıp yüzüne turuncu, ılık bir pas çamuru püskürtüyor.", en: "{dusman} clenches and sprays a warm orange sludge of rust right in your face." }
    xp: 4600
    kredi: 30
    ganimet: { hurda: 0.7, canli_bakir: 0.3 }
    etiketler: ["bocek", "kapi"]
    boss: false

  kizak_kralicesi:
    ad: { tr: "Kızak Kraliçesi", en: "The Slipway Queen" }
    aciklama: { tr: "Tersanenin kızağında yarım kalmış bir yük gemisinin gövdesini kabuk diye giymiş dev bir kapı yaratığı. Perçin kurtlarının annesi; gemiyi içten yiyerek büyümüş.", en: "A massive Gate creature wearing the hull of a half-built freighter off the shipyard slipway like a hermit crab's shell. Mother of the rivet grubs. It grew by eating the ship from the inside out." }
    kanca: { tr: "Kuru havuzun dibindeki gemi gövdesi inleyerek yan yatıyor; kaburgalarının arasında iki kırmızı göz açılıyor.", en: "The ship's hull at the bottom of the dry dock groans and rolls onto its side, and two red eyes open between its ribs." }
    seviye: 30
    can: 2100
    statlar:
      str: 38
      agi: 14
      end: 42
      int: 12
      wis: 16
      per: 22
      wil: 30
      cha: 6
    davranis: "agresif"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Gövdesi gemi sacıyla kaynaşmıştır, sac da elektriği iletir. Kabuğa inen yıldırım içerideki yumuşak eti doğrudan bulur.", en: "Its body's fused into ship steel, and ship steel conducts. Lightning that hits the shell goes straight into the soft meat inside." }
    saldirilar:
      - id: "omurga_ezmesi"
        ad: { tr: "Omurga Ezmesi", en: "Keel Crush" }
        stat: "str"
        taban: 16
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} gövdesini yana yatırıyor; geminin omurgası balyoz gibi üstüne iniyor.", en: "{dusman} rolls its hull and the ship's keel comes down on you like a sledgehammer." }
      - id: "kurt_dogumu"
        ad: { tr: "Kurt Doğumu", en: "Brood Burst" }
        stat: "end"
        taban: 11
        kat: 0.8
        etiketler: ["alan", "zehir"]
        durum: { etki: "zehir", sans: 0.4, sure: 3 }
        bekleme: 2
        metin: { tr: "{dusman} kaburgalarının arasından bir avuç perçin kurdu kusuyor; kurtlar düştükleri yerde sana doğru kıvrılıyor.", en: "{dusman} heaves a fistful of rivet grubs out from between its ribs, and they hit the ground squirming toward you." }
    xp: 9000
    kredi: 260
    ganimet: { kizak_kabugu: 1.0, canavar_cekirdegi: 1.0, canli_bakir: 0.6 }
    etiketler: ["boss", "kapi"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Gemi gövdesi çatırdarken kraliçe sacları kalkan gibi önüne çekiyor. Kaynak dikişlerinden turuncu buhar fışkırıyor.", en: "The hull cracks and the queen drags its plating forward like a shield. Orange steam hisses out of every weld seam." }
        guclenme: { end: 8, wil: 4 }
        saldiri:
          id: "sac_kalkan"
          ad: { tr: "Sac Duvar", en: "Plate Wall" }
          stat: "end"
          taban: 13
          kat: 0.8
          etiketler: ["fiziksel", "alan"]
          bekleme: 2
          metin: { tr: "{dusman} kocaman bir sac levhayı havuzun dibinde sürükleyip seni duvara sıkıştırıyor.", en: "{dusman} drags a huge steel plate across the basin floor and pins you against the wall." }
      - esik: 40
        metin: { tr: "Kraliçe kabuğunun yarısını söküp atıyor; altından soluk, titreyen bir et çıkıyor. Artık daha hafif ve çok daha hızlı.", en: "The queen tears off half its shell and throws it aside. Underneath is pale, quivering meat. It's lighter now, and a lot faster." }
        guclenme: { agi: 10, str: 4 }
        saldiri:
          id: "kizak_hucumu"
          ad: { tr: "Kızak Hücumu", en: "Slipway Charge" }
          stat: "agi"
          taban: 15
          kat: 0.9
          etiketler: ["fiziksel", "yakin"]
          durum: { etki: "kanama", sans: 0.4, sure: 2 }
          bekleme: 2
          metin: { tr: "{dusman} havuzun eğimini kızak gibi kullanıp bütün ağırlığıyla üstüne kayıyor.", en: "{dusman} uses the slope of the basin like a launch ramp and slides down on you with its full weight." }
      - esik: 15
        metin: { tr: "Kraliçe havuzun ortasına çöküyor, kapının ışığı içine akmaya başlıyor. Son bir kez doğuracak; bütün perçin delikleri birden kıpırdanıyor.", en: "The queen collapses in the middle of the basin, and the Gate's light starts pouring into it. It's going to brood one last time. Every rivet hole in the dock twitches at once." }
        guclenme: { str: 6, end: 6, wil: 6 }
        saldiri:
          id: "son_kulucka"
          ad: { tr: "Son Kuluçka", en: "Final Clutch" }
          stat: "wil"
          taban: 18
          kat: 0.9
          etiketler: ["alan", "zehir"]
          durum: { etki: "korku", sans: 0.35, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} havuzun bütün tabanını kurtla dolduruyor; zemin canlı, kıpır kıpır bir halıya dönüşüyor.", en: "{dusman} floods the entire dock floor with grubs until the ground turns into a living, writhing carpet." }

  ors_bascavus:
    ad: { tr: "Örs · Lonca'nın Birinci Çavuşu", en: "Anvil · The Guild's First Sergeant" }
    aciklama: { tr: "Entegrasyon Günü tersanenin kapısını bir balyozla tutan eski bir kaynakçı. O günden beri Lonca'nın Pano'sunda en üst basamakta duruyor; yerini bırakmaya hiç niyeti yok.", en: "An old shipyard welder who held the yard gate with a sledgehammer on Integration Day. He's sat on the top rung of the Guild Board ever since, and he's got no plans to come down." }
    kanca: { tr: "Örs balyozunu omzundan indiriyor, eldivenlerini sıkıyor ve Haddehane'nin ortasına, tebeşirle çizilmiş çemberin içine adım atıyor.", en: "Anvil lowers the sledge off his shoulder, tightens his gloves, and steps into the chalk circle in the middle of the rolling mill." }
    seviye: 30
    can: 1900
    statlar:
      str: 40
      agi: 18
      end: 38
      int: 10
      wis: 18
      per: 22
      wil: 34
      cha: 14
    davranis: "temkinli"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Kollarında yirmi yılın gücü var ama dizleri yalan söylemez. Ailesinin tayın kartı hiç gözünün önünden gitmez; kafası dağılırsa savunması da dağılır.", en: "Twenty years of strength in his arms, but his knees don't lie. His family's ration card is never far from his mind. Rattle his head and his guard goes with it." }
    saldirilar:
      - id: "balyoz"
        ad: { tr: "Kaynakçı Balyozu", en: "Welder's Sledge" }
        stat: "str"
        taban: 17
        kat: 0.9
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} balyozu örse vurur gibi kısa ve dümdüz indiriyor.", en: "{dusman} brings the sledge down short and straight, like he's working an anvil." }
      - id: "kivilcim"
        ad: { tr: "Kıvılcım Perdesi", en: "Spark Curtain" }
        stat: "per"
        taban: 11
        kat: 0.7
        etiketler: ["ates", "alan"]
        durum: { etki: "kor", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} balyozu zemindeki çeliğe sürtüyor; yüzüne bir kıvılcım duvarı fışkırıyor.", en: "{dusman} drags the sledge across the steel floor and throws a wall of sparks into your face." }
    xp: 7000
    kredi: 120
    ganimet: { turuncu_yama: 1.0, lonca_tayini: 0.6 }
    etiketler: ["insan", "elit"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Örs kaskını çıkarıp yere atıyor. Seyirciler susuyor; bunu son kez Entegrasyon Günü yaptığını herkes biliyor.", en: "Anvil pulls his helmet off and drops it on the floor. The crowd goes quiet. Everybody knows the last time he did that was Integration Day." }
        guclenme: { str: 6, wil: 4 }
        saldiri:
          id: "orse_vurus"
          ad: { tr: "Örse Vuruş", en: "Anvil Strike" }
          stat: "str"
          taban: 19
          kat: 0.9
          etiketler: ["fiziksel", "yakin"]
          bekleme: 2
          metin: { tr: "{dusman} iki eliyle sapı kavrayıp balyozu omzunun arkasından, bütün gövdesiyle savuruyor.", en: "{dusman} grips the handle two-handed and swings the sledge from behind his shoulder with his whole body." }
      - esik: 40
        metin: { tr: "Dizi bir an titriyor. Örs dişlerini sıkıp doğruluyor; kalabalığın kıyısından bir çocuk babasını çağırıyor.", en: "His knee buckles for a second. Anvil grits his teeth and straightens up, and somewhere at the edge of the crowd a kid's voice yells for his dad." }
        guclenme: { wil: 8, end: 4 }
        saldiri:
          id: "inat"
          ad: { tr: "Kaynakçı İnadı", en: "Welder's Grit" }
          stat: "wil"
          taban: 15
          kat: 0.8
          etiketler: ["fiziksel"]
          durum: { etki: "kalkan", sans: 1.0, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} yerinden kıpırdamıyor; darbeni omzuyla karşılayıp geri itiyor.", en: "{dusman} doesn't give an inch. He takes your hit on the shoulder and shoves it right back." }
      - esik: 15
        metin: { tr: "Örs'ün nefesi hırıltıya dönüyor ama balyozu hâlâ elinde. Kaybedeceğini biliyor; yine de çemberden çıkmıyor.", en: "Anvil's breathing turns into a rattle, but the sledge is still in his hands. He knows he's going to lose. He still won't step out of the circle." }
        guclenme: { str: 8 }
        saldiri:
          id: "son_darbe"
          ad: { tr: "Son Vardiya", en: "Last Shift" }
          stat: "str"
          taban: 22
          kat: 1.0
          etiketler: ["fiziksel", "yakin"]
          bekleme: 3
          metin: { tr: "{dusman} kalan her şeyini tek bir darbeye koyuyor; balyoz havayı bir kepenk gibi yırtıyor.", en: "{dusman} puts everything he's got left into one swing. The sledge rips through the air like a slammed steel shutter." }

  capa_avcisi:
    ad: { tr: "Mavi Çapa Avcısı", en: "Blue Anchor Hunter" }
    aciklama: { tr: "Limanın eski rıhtım işçilerinden, gemicilerinden ve balıkçılarından kurulmuş avcı loncasının bir üyesi. Zıpkını, kancası ve kendi limanı uğruna ölmeyi göze alan bir inadı var.", en: "A member of the hunting guild the old longshoremen, deckhands and fishermen built on the waterfront. Harpoon, cargo hook, and the kind of stubborn that dies for its own docks." }
    kanca: { tr: "Balık mezatının sundurmaları altından biri mavi çapa dövmeli bileğini kaldırıyor: \"Bu salon Lonca'nın değil, bizim.\"", en: "Somebody under the fish-auction awnings raises a wrist with a blue anchor tattoo on it. \"This hall isn't the Guild's. It's ours.\"" }
