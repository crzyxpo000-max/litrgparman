        metin: { tr: "Ossiran'ın derisi çatlıyor. Çatlaklardan üç dünyanın ışığı sızıyor ve bir an, yalnızca bir an, o ışığın içinde küçük, şaşkın yüzlerden oluşan bir kalabalık görüyorsun.", en: "Ossiran's skin starts to crack. Light from three worlds leaks out of the seams, and for a moment, just a moment, you see a crowd of small, confused faces inside it." }
