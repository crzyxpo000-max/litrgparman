        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} açılıyor ve ışığı seni, o akşam iskeledeki herkesi yuttuğu gibi, yutuyor. Bedenin yok, ağırlığın yok; yalnızca bir nefes sesi.", en: "{dusman} opens and its light swallows you the way it swallowed everyone on the pier that evening. No body, no weight. Just the sound of a breath." }
      - id: "hayatta_kalma_esigi"
        ad: { tr: "Hayatta Kalma Eşiği", en: "Survival Threshold" }
        stat: "wil"
        taban: 18
        kat: 0.9
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.45, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} üstüne bir satır yazıyor: [Hayatta kalma eşiği: belirlendi.] Rakamı göremiyorsun. Altında olduğunu hissediyorsun.", en: "{dusman} writes one line across you: [Survival threshold: set.] You can't see the number. You can feel that you're under it." }
      - id: "seni_buldum"
        ad: { tr: "Seni Buldum", en: "Found You" }
        stat: "int"
        taban: 17
        kat: 0.9
        etiketler: ["zihin", "glitch"]
        durum: { etki: "sersemleme", sans: 0.45, sure: 1 }
        bekleme: 3
        metin: { tr: "{dusman} kenarında küçük, kırmızı bir satır yakıyor: [Seni buldum.] Sonra satır kendini düzeltiyor: [Seni yine buldum.]", en: "{dusman} lights a small red line along its edge: [Found you.] Then the line corrects itself: [Found you again.]" }
    xp: 4500
    kredi: 250
    ganimet: { canavar_cekirdegi: 1.0, kule_ilk_pencere_parcasi: 1.0 }
    etiketler: ["kule", "boss"]
    boss: true
    fazlar:
      - esik: 70
        metin: { tr: "Pencerenin kenarı çatlıyor. Çatlağın içinden, gökyüzünü ilk gün yaran o incecik çizgi görünüyor; ama bu sefer içeriden.", en: "The window's edge cracks. Through the crack you can see that hairline seam that split the sky on the first day. Except this time, from the inside." }
        guclenme: { int: 5, wil: 5 }
        saldiri:
          id: "geri_sarim"
          ad: { tr: "Gün Sıfıra", en: "Rewind to Zero" }
          stat: "int"
          taban: 24
          kat: 0.9
          etiketler: ["zihin", "alan"]
          durum: { etki: "sersemleme", sans: 0.45, sure: 1 }
          bekleme: 3
          metin: { tr: "{dusman} seni Gün 0'a geri sarmaya çalışıyor. Bir an simit kokusu, martı sesi, geciken akşam vapuru. Sonra yine buradasın, yine kanıyorsun.", en: "{dusman} tries to rewind you to Day 0. For a second: soft pretzels, gulls, the evening ferry running late. Then you're back here, bleeding again." }
      - esik: 40
        metin: { tr: "Pencere ikiye bölünüyor. Bir yarısında Kıyıkent var, sabah güneşinde. Öbür yarısında, aynı Kıyıkent; ama yüzlerce kez üst üste çizilmiş.", en: "The window splits in two. One half shows Port Harlow in the morning sun. The other half shows the same Port Harlow, drawn over itself hundreds of times." }
        guclenme: { str: 6, agi: 6, end: 6 }
        saldiri:
          id: "dongu"
          ad: { tr: "Döngü", en: "The Loop" }
          stat: "wil"
          taban: 27
          kat: 0.9
          etiketler: ["zihin", "karanlik"]
          durum: { etki: "korku", sans: 0.5, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} sana bütün tırmanışlarını gösteriyor; bu tırmanışı değil. Hepsini. Sayamıyorsun.", en: "{dusman} shows you every climb you've ever made. Not this one. All of them. You can't count them." }
      - esik: 15
        metin: { tr: "Pencerenin tek düğmesi yanıp sönmeye başlıyor. Basılması için bir parmak gerekmiyor; yalnızca birinin vazgeçmesi gerekiyor.", en: "The window's one button starts to blink. Pressing it doesn't take a finger. It only takes somebody giving up." }
        guclenme: { int: 6, wis: 6, wil: 6 }
        saldiri:
          id: "evet"
          ad: { tr: "Evet", en: "Yes" }
          stat: "wil"
          taban: 30
          kat: 0.9
          etiketler: ["zihin", "isik", "alan"]
          durum: { etki: "korku", sans: 0.55, sure: 2 }
          bekleme: 3
          metin: { tr: "{dusman} senin yerine evet demeye çalışıyor. Yorgunluğun ona katılıyor. Sen katılmıyorsun; daha değil.", en: "{dusman} tries to say yes for you. Your exhaustion agrees with it. You don't. Not yet." }
