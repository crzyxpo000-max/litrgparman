# Parti L2 — Kule (100 kat) düşmanları. Tasarım seviyesi 20–40; motor kat seviyesine ölçekler (20 · 1,0385^kat).
# Bant düşmanları (prosedürel katlar) + her 10. katın hikaye bossu (events/72_kule.yaml, `@oyuncu+N` ile çağrılır).
# Bantlar: 1–9 Kıyıkent'in Yankısı · 11–19 İçerideki Deniz · 21–29 Cam · 31–39 Saat · 41–49 Sessizlik ·
# 51–59 Başka Dünyaların Kalıntıları · 61–69 Yanık Arşiv · 71–79 Tohumluk · 81–89 Ters Gök · 91–99 Taslak.
dusmanlar:
  # ================================================================== BANT 1–9: KIYIKENT'İN YANKISI
  kule_yolcu_golgesi:
    ad: { tr: "Yolcu Gölgesi", en: "Commuter Shade" }
    aciklama: { tr: "Entegrasyon Günü iskelede bekleyenlerin gri kopyaları. Ellerinde hâlâ simit poşetleri, kulaklarında hâlâ kulaklık var; yüzleri yok. Kule onları o akşamdan kaydetmiş ve yanlış yerden oynatıyor.", en: "Gray copies of the people who were waiting at the ferry terminal on Integration Day. Still holding pretzel bags, still wearing earbuds. No faces. The Spire recorded them that evening and keeps playing them back from the wrong spot." }
    kanca: { tr: "Uzaktan vapur düdüğü geliyor. Merdivenin başında bir sıra gri insan, hep birlikte, sana dönüyor.", en: "A ferry horn sounds somewhere far off. At the top of the stairs, a line of gray people turns toward you, all at once." }
    seviye: 20
    can: 260
    statlar:
      str: 16
      agi: 14
      end: 16
      int: 8
      wis: 8
      per: 12
      wil: 14
      cha: 4
    davranis: "suru"
    zeki: false
    zaaf: "isik"
    zaaf_metin: { tr: "Kayıttan oynatılan şeyler ışığı sevmez; sert bir parıltı onları bir kare geri sarar ve o karede savunmasızdırlar.", en: "Things played back from a recording hate light. A hard flash rewinds them a frame, and in that frame they're wide open." }
    saldirilar:
      - id: "binis"
        ad: { tr: "Biniş", en: "Boarding Call" }
        stat: "str"
        taban: 9
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "sersemleme", sans: 0.2, sure: 1 }
        bekleme: 0
        metin: { tr: "{dusman} koluna yapışıyor ve seni, hiç var olmayan bir vapura doğru, kalabalığın içine çekiyor.", en: "{dusman} latches onto your arm and drags you into the crowd, toward a ferry that isn't there." }
      - id: "son_anons"
        ad: { tr: "Son Anons", en: "Last Call" }
        stat: "wil"
        taban: 8
        kat: 0.8
        etiketler: ["ses", "zihin"]
        durum: { etki: "korku", sans: 0.3, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} ağzı olmayan yüzünden bir anons cızırdatıyor: o akşamın son seferi, o akşamın son dakikası.", en: "{dusman} crackles an announcement out of a face with no mouth: that evening's last sailing, that evening's last minute." }
    xp: 420
    kredi: 22
    ganimet: { cam_sise: 0.3, canavar_cekirdegi: 0.25 }
    etiketler: ["kule", "kukla"]
    boss: false
  kule_ters_marti:
    ad: { tr: "Ters Martı", en: "Backwards Gull" }
    aciklama: { tr: "Havada asılı kalmış, geriye doğru uçan martılar. Kanat çırpışları bir kaydın geri sarılışı gibi; gagaları ise fazlasıyla gerçek.", en: "Gulls hanging in midair, flying in reverse. Their wingbeats look like a tape rewinding. Their beaks are very, very real." }
    kanca: { tr: "Tepende bir martı çığlığı başlıyor ve sondan başa doğru, ters çalıyor.", en: "A gull's cry starts up overhead, and it plays from the end back to the beginning." }
    seviye: 21
    can: 210
    statlar:
      str: 12
      agi: 22
      end: 10
      int: 6
      wis: 8
      per: 18
      wil: 10
      cha: 3
    davranis: "suru"
    zeki: false
    zaaf: "ruzgar"
    zaaf_metin: { tr: "Kanatları zamana karşı çırpıyor, havaya karşı değil. Sert bir rüzgâr onları zamanın içine geri iter ve yere çakılırlar.", en: "Their wings beat against time, not air. A hard gust shoves them back into the timeline, and they drop like stones." }
    saldirilar:
      - id: "geri_dalis"
        ad: { tr: "Geri Dalış", en: "Reverse Dive" }
        stat: "agi"
        taban: 9
        kat: 0.8
        etiketler: ["fiziksel", "delici"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} sana dalmıyor; daldığı andan geri geliyor. Gagası omzundan çıkıyor, girmeden önce.", en: "{dusman} doesn't dive at you. It un-dives. Its beak comes out of your shoulder before it ever went in." }
      - id: "tersten_ciglik"
        ad: { tr: "Tersten Çığlık", en: "Backmasked Shriek" }
        stat: "per"
        taban: 7
        kat: 0.7
        etiketler: ["ses"]
        durum: { etki: "sersemleme", sans: 0.25, sure: 1 }
        bekleme: 2
        metin: { tr: "{dusman} tersten çığlık atıyor; kulağın sesi önce bitiriyor, sonra başlatıyor ve başın dönüyor.", en: "{dusman} shrieks backwards. Your ears hear the end of it first, then the start, and your head spins." }
    xp: 380
    kredi: 14
    ganimet: { karga_tuyu: 0.4 }
    etiketler: ["kule", "hayvan"]
    boss: false
  kule_asfalt_agzi:
    ad: { tr: "Asfalt Ağzı", en: "Pavement Maw" }
    aciklama: { tr: "Kordon'un bir parçası gibi görünen kaldırım. Bir rögar kapağı göz, bir yaya geçidi diş sırası. Kule şehri kopyalarken yanlışlıkla aç bir şehir kopyalamış.", en: "A stretch of sidewalk that looks like a piece of the Esplanade. A manhole cover for an eye, a crosswalk for teeth. When the Spire copied the city, it copied a hungry one by mistake." }
    kanca: { tr: "Ayağının altındaki yaya geçidinin beyaz çizgileri birer birer kalkıyor. Diş gibi.", en: "Under your boots, the white stripes of the crosswalk lift one by one. Like teeth." }
    seviye: 23
    can: 360
    statlar:
      str: 24
      agi: 8
      end: 26
      int: 6
      wis: 8
      per: 12
      wil: 16
      cha: 2
    davranis: "temkinli"
    zeki: false
    zaaf: "ates"
    zaaf_metin: { tr: "Asfaltın içinde hâlâ katran var. Ateş onu yumuşatır; yumuşayan bir ağız ısıramaz.", en: "There's still tar in that asphalt. Fire softens it, and a soft mouth can't bite." }
    saldirilar:
      - id: "kaldirim_isirigi"
        ad: { tr: "Kaldırım Isırığı", en: "Curb Bite" }
        stat: "str"
        taban: 12
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.3, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} altında açılıyor; kaldırım taşları bileğine kapanıyor, beton gibi soğuk ve çene gibi sıkı.", en: "{dusman} opens up under you. The curbstones snap shut on your ankle, cold as concrete, tight as a jaw." }
      - id: "rogar_nefesi"
        ad: { tr: "Rögar Nefesi", en: "Manhole Breath" }
        stat: "end"
        taban: 10
        kat: 0.7
        etiketler: ["alan", "zehir"]
        durum: { etki: "zehir", sans: 0.4, sure: 3 }
        bekleme: 2
        metin: { tr: "{dusman} rögar kapağını bir göz kapağı gibi aralıyor ve altından şehrin bütün eski kanalizasyon kokusu yüzüne vuruyor.", en: "{dusman} cracks its manhole cover open like an eyelid, and every old sewer smell in the city hits you in the face." }
    xp: 520
    kredi: 26
    ganimet: { hurda: 0.5, kaya_tuzu: 0.2 }
    etiketler: ["kule", "yaratik"]
    boss: false

  # ================================================================== BANT 11–19: İÇERİDEKİ DENİZ
  kule_tuz_kancasi:
    ad: { tr: "Tuz Kancası", en: "Salt Hook" }
    aciklama: { tr: "Kule'nin içindeki denizde yaşayan, kolları olta iğnesiyle biten şeffaf bir yaratık. Ağzı yok; yakaladığını tuza çevirip yavaşça eritiyor.", en: "A transparent thing that lives in the sea inside the Spire, every limb ending in a fishhook. It has no mouth. It turns what it catches into salt and dissolves it, slowly." }
    kanca: { tr: "Bileğe kadar gelen suyun içinde ince bir misina gerginleşiyor. Ucunda bir şey seni tartıyor.", en: "In the ankle-deep water, a thin line goes taut. Something on the other end is weighing you." }
    seviye: 24
    can: 330
    statlar:
      str: 18
      agi: 18
      end: 18
      int: 8
      wis: 12
      per: 20
      wil: 12
      cha: 2
    davranis: "temkinli"
    zeki: false
    zaaf: "simsek"
    zaaf_metin: { tr: "Bedeni neredeyse saf tuzlu su; bir kıvılcım bütün kollarına aynı anda yayılır ve kancalar çözülür.", en: "Its body is basically pure brine. One spark runs through every limb at once, and the hooks let go." }
    saldirilar:
      - id: "olta"
        ad: { tr: "Olta", en: "Cast Line" }
        stat: "per"
        taban: 11
        kat: 0.8
        etiketler: ["menzilli", "delici"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} kollarından birini suyun içinden fırlatıyor; kanca yakana takılıyor ve seni dizlerinin üstüne çekiyor.", en: "{dusman} whips a limb out of the water. The hook catches your collar and yanks you to your knees." }
      - id: "tuzlama"
        ad: { tr: "Tuzlama", en: "Cure" }
        stat: "wis"
        taban: 9
        kat: 0.8
        etiketler: ["zehir"]
        durum: { etki: "zehir", sans: 0.4, sure: 3 }
        bekleme: 2
        metin: { tr: "{dusman} sana dolanıyor ve tenin kuruyup beyazlaşmaya başlıyor; dudaklarında tuz tadı var.", en: "{dusman} wraps around you, and your skin starts drying out and going white. You can taste salt on your lips." }
    xp: 540
    kredi: 24
    ganimet: { kaya_tuzu: 0.6, mavi_yosun: 0.3 }
    etiketler: ["kule", "yaratik"]
    boss: false
  kule_derin_feneri:
    ad: { tr: "Derin Feneri", en: "Deep Lantern" }
    aciklama: { tr: "Kule'nin karanlık sularında süzülen dev bir fener balığı. Alnından sarkan yem, mavi bir Analiz penceresi: yaklaşanlara yalan söylüyor.", en: "A giant anglerfish drifting through the Spire's dark water. The lure hanging off its forehead is a blue Analysis window, and it lies to anyone who swims close." }
    kanca: { tr: "Karanlık suyun ortasında küçük, tanıdık bir mavi pencere açılıyor: [Tehlike: yok]. Pencere sallanıyor. Bir şey onu tutuyor.", en: "A small, familiar blue window opens in the middle of the black water: [Threat: none]. The window bobs. Something is holding it." }
    seviye: 25
    can: 380
    statlar:
      str: 22
      agi: 12
      end: 22
      int: 16
      wis: 14
      per: 14
      wil: 18
      cha: 8
    davranis: "temkinli"
    zeki: true
    zaaf: "karanlik"
    zaaf_metin: { tr: "Bütün avı ışığına güveniyor. Işığı söndürülen bir fener balığı kördür ve bunu ilk kez öğrenir.", en: "Its whole hunt rides on that light. Snuff the lure and an anglerfish is blind, and it's finding that out for the first time." }
    saldirilar:
      - id: "yalanci_analiz"
        ad: { tr: "Yalancı Analiz", en: "False Readout" }
        stat: "int"
        taban: 10
        kat: 0.8
        etiketler: ["zihin", "isik"]
        durum: { etki: "kor", sans: 0.35, sure: 2 }
        bekleme: 1
        metin: { tr: "{dusman} yemini önüne sallıyor: [Hedef savunmasız. Saldır.] Saldırıyorsun ve hedef orada değil.", en: "{dusman} dangles its lure in front of you: [Target defenseless. Engage.] You engage, and the target isn't there." }
      - id: "derin_cene"
        ad: { tr: "Derin Çene", en: "Abyssal Jaw" }
        stat: "str"
        taban: 13
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        durum: { etki: "kanama", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} karanlığın içinden açılıyor; ağzı göründüğünden üç kat büyük ve dişleri içe doğru eğik.", en: "{dusman} opens out of the dark. Its mouth is three times bigger than it looked, and the teeth all angle inward." }
    xp: 580
    kredi: 30
    ganimet: { goz_cicegi: 0.4, canavar_cekirdegi: 0.3 }
    etiketler: ["kule", "hayvan"]
    boss: false

  # ================================================================== BANT 21–29: CAM
  kule_cam_orumcek:
    ad: { tr: "Cam Örümcek", en: "Glass Spider" }
    aciklama: { tr: "Kırık pencere camından örülmüş bir örümcek. Ağları ışığı kırarak gizleniyor; içine yürüyene kadar orada olduklarını bilmiyorsun.", en: "A spider spun out of broken window glass. Its webs hide by bending the light, so you never know they're there until you walk into one." }
    kanca: { tr: "Önündeki boş koridor bir an gökkuşağı gibi kırılıyor. Boş değil.", en: "The empty hallway in front of you splits into a rainbow for a second. It isn't empty." }
    seviye: 26
    can: 340
    statlar:
      str: 16
      agi: 26
      end: 14
      int: 12
      wis: 12
      per: 24
      wil: 12
      cha: 2
    davranis: "agresif"
    zeki: false
    zaaf: "ses"
    zaaf_metin: { tr: "Camdan yapılmış her şey gibi doğru notada titrer. Yüksek, keskin bir ses onu içten çatlatır.", en: "Like anything made of glass, it rings at the right note. A sharp, high sound cracks it from the inside." }
    saldirilar:
      - id: "kirik_bacak"
        ad: { tr: "Kırık Bacak", en: "Shard Leg" }
        stat: "agi"
        taban: 11
        kat: 0.8
        etiketler: ["fiziksel", "delici"]
        durum: { etki: "kanama", sans: 0.45, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} sekiz cam bacağını birden savuruyor; her biri bir bıçak kadar ince ve bir pencere kadar soğuk.", en: "{dusman} swings all eight glass legs at once, each one thin as a knife and cold as a windowpane." }
      - id: "kirilan_isik"
        ad: { tr: "Kırılan Işık", en: "Refraction" }
        stat: "per"
        taban: 9
        kat: 0.7
        etiketler: ["isik"]
        durum: { etki: "kor", sans: 0.4, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gövdesini döndürüyor ve koridorun bütün ışığı gözlerine kırılıyor.", en: "{dusman} turns its body, and every bit of light in the hallway refracts straight into your eyes." }
    xp: 600
    kredi: 26
    ganimet: { cam_sise: 0.6, ag_ipegi: 0.3 }
    etiketler: ["kule", "bocek"]
    boss: false
  kule_ayna_ikiz:
    ad: { tr: "Ayna İkizi", en: "Mirror Twin" }
    aciklama: { tr: "Senin hareketlerini senden yarım an sonra yapan bir yansıma. Sonra yarım an önce. Kule'nin camı, yansıttığı şeyi öğreniyor.", en: "A reflection that moves half a beat after you. Then half a beat before you. The Spire's glass learns whatever it reflects." }
    kanca: { tr: "Koridorun sonundaki camda sen varsın. Sen duruyorsun. O durmuyor.", en: "You're in the glass at the end of the hallway. You stop. It doesn't." }
    seviye: 27
    can: 400
    statlar:
      str: 20
      agi: 20
      end: 20
      int: 20
      wis: 16
      per: 20
      wil: 18
      cha: 10
    davranis: "agresif"
    zeki: true
    zaaf: "karanlik"
    zaaf_metin: { tr: "Işık olmadan yansıma olmaz. Karanlığa sürüklenen bir ayna ikizi bir an için hiçbir şeydir.", en: "No light, no reflection. Drag a mirror twin into the dark and for a moment it's nothing at all." }
    saldirilar:
      - id: "senin_hamlen"
        ad: { tr: "Senin Hamlen", en: "Your Move" }
        stat: "agi"
        taban: 12
        kat: 0.8
        etiketler: ["fiziksel", "yakin"]
        bekleme: 0
        metin: { tr: "{dusman} senin en sevdiğin hamleyi yapıyor; senden daha temiz.", en: "{dusman} uses your favorite move on you. Cleaner than you do it." }
      - id: "ters_yuz"
        ad: { tr: "Ters Yüz", en: "Wrong Face" }
        stat: "wil"
        taban: 10
        kat: 0.8
        etiketler: ["zihin"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 2
        metin: { tr: "{dusman} gülümsüyor. Senin yüzün hiç böyle gülümsemedi; ya da gülümsedi ve sen hiç görmedin.", en: "{dusman} smiles. Your face has never smiled like that. Or it has, and you just never saw it." }
    xp: 640
    kredi: 30
    ganimet: { cam_sise: 0.5, canavar_cekirdegi: 0.35 }
    etiketler: ["kule", "kukla"]
    boss: false

  # ================================================================== BANT 31–39: SAAT
  kule_sarkac:
    ad: { tr: "Sarkaç", en: "The Pendulum" }
    aciklama: { tr: "Görünmez bir tavandan sarkan, ucu bir bina kolonu kadar kalın, pirinç bir sarkaç. Kendi kendine sallanmıyor; birini arıyor.", en: "A brass pendulum hanging from a ceiling you can't see, its bob as thick as a support column. It doesn't swing on its own. It's looking for someone." }
    kanca: { tr: "Karanlıkta derin bir tik sesi. Sonra bir tak. İkisinin arasında havanın yarıldığını duyuyorsun.", en: "A deep tick in the dark. Then a tock. Between them, you hear the air split." }
    seviye: 28
    can: 520
    statlar:
      str: 32
      agi: 10
      end: 30
      int: 6
      wis: 10
      per: 14
      wil: 20
      cha: 2
    davranis: "temkinli"
    zeki: false
    zaaf: "buz"
    zaaf_metin: { tr: "Pirinç soğukta büzülür; donmuş bir mafsal sarkacı yarım tur kilitler. O yarım tur senin.", en: "Brass contracts in the cold. A frozen pivot locks the pendulum for half a swing, and that half a swing is yours." }
    saldirilar:
      - id: "salinim"
        ad: { tr: "Salınım", en: "The Swing" }
        stat: "str"
        taban: 15
        kat: 0.8
        etiketler: ["fiziksel", "alan"]
        durum: { etki: "sersemleme", sans: 0.35, sure: 1 }
        bekleme: 1
        metin: { tr: "{dusman} tam kalbinin attığı anda iniyor; sanki zamanlamayı kalbinden öğrenmiş.", en: "{dusman} comes down right on your heartbeat, like it learned its timing from your pulse." }
      - id: "geri_salinim"
        ad: { tr: "Geri Salınım", en: "Backswing" }
        stat: "str"
        taban: 11
        kat: 0.7
        etiketler: ["fiziksel"]
        bekleme: 0
        metin: { tr: "Kaçtığını sanıyorsun. {dusman} geri geliyor; sarkaçlar her zaman geri gelir.", en: "You think you dodged it. {dusman} comes back. Pendulums always come back." }
    xp: 700
    kredi: 34
    ganimet: { canli_bakir: 0.5, hurda: 0.4 }
    etiketler: ["kule", "mekanik"]
    boss: false
