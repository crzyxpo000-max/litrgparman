    aciklama: { tr: "Kırmızı rakamlardan oluşan, insan biçimli bir bulut. Her saniye bir sayı düşürüyor. Sıfıra geldiğinde ne olacağını hiçbir tırmanıcı anlatmamış.", en: "A man-shaped cloud of red digits, dropping one number every second. No climber has ever said what happens when it hits zero." }
    kanca: { tr: "Önünde havada kırmızı bir sayı beliriyor: 60. Sonra 59.", en: "A red number appears in the air in front of you: 60. Then 59." }
    seviye: 29
    can: 360
    statlar:
      str: 12
      agi: 24
      end: 14
      int: 28
      wis: 20
      per: 18
      wil: 22
      cha: 4
    davranis: "agresif"
    zeki: true
    zaaf: "zihin"
    zaaf_metin: { tr: "Yalnızca saymayı biliyor. Zihnine karışık bir sayı itersen saymayı şaşırır ve bir an kendini başa sarar.", en: "All it knows how to do is count. Shove a scrambled number into its head and it loses its place and resets itself for a second." }
    saldirilar:
      - id: "son_saniye"
        ad: { tr: "Son Saniye", en: "The Last Second" }
        stat: "int"
        taban: 12
        kat: 0.9
        etiketler: ["zihin", "alan"]
        durum: { etki: "korku", sans: 0.35, sure: 2 }
        bekleme: 0
        metin: { tr: "{dusman} senin önünde 3'e, 2'ye, 1'e iniyor ve bedenin, ne geleceğini bilmeden, kendini kasıyor.", en: "{dusman} drops to 3, 2, 1 right in front of you, and your body braces without knowing what for." }
      - id: "sifir"
        ad: { tr: "Sıfır", en: "Zero" }
        stat: "int"
        taban: 18
        kat: 0.9
        etiketler: ["ates", "alan"]
        durum: { etki: "yanma", sans: 0.4, sure: 2 }
        bekleme: 4
        metin: { tr: "{dusman} sıfıra ulaşıyor. Olan şey bir patlama değil; bir saniyenin, içindeki her şeyle birlikte, yanması.", en: "{dusman} hits zero. What happens isn't an explosion. It's a whole second burning, with everything inside it." }
    xp: 720
    kredi: 32
    ganimet: { canavar_cekirdegi: 0.4, ates_bezesi: 0.3 }
    etiketler: ["kule", "glitch"]
    boss: false

  # ================================================================== BANT 41–49: SESSİZLİK
