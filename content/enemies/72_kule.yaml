    kanca: { tr: "Zirvenin ortasında bir pencere açılıyor, üstünde tek satır: [Entegrasyon başlatılsın mı?] Altında iki düğme yok; yalnızca bir tane var.", en: "A window opens in the middle of the summit. One line on it: [Initiate Integration?] There aren't two buttons underneath. There's one." }
