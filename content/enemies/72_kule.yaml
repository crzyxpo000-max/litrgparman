    kanca: { tr: "Aynadaki sen elini camın üstüne koyuyor; cam ısınmış bir pencere gibi içeri doğru bükülüyor.", en: "The you in the mirror lays its hand flat on the glass. The glass bows inward, like a window gone warm." }
