esyalar:
  kirmizi_ot:
    ad: { tr: "Kızıl Yaprak", en: "Bloodleaf" }
    aciklama: { tr: "Entegrasyon'dan sonra her yanı saran kırmızı damarlı bir ot. Ezilince yaraları uyuşturur.", en: "A red-veined weed that sprang up everywhere after Integration. Crushed, it numbs wounds." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 3
  mavi_yosun:
    ad: { tr: "Mavi Yosun", en: "Bluecap Moss" }
    aciklama: { tr: "Kapı yarıklarının çevresinde biten, hafif hafif parlayan bir yosun. Manayı içinde tutar.", en: "A faintly glowing moss that grows around Gate rifts. It holds onto mana." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 5
  aci_kok:
    ad: { tr: "Acı Kök", en: "Bitterroot" }
    aciklama: { tr: "Tadı berbattır ama panzehirlerin çoğu bundan yapılır.", en: "Tastes awful. Also the base of most antidotes." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 4
  goz_cicegi:
    ad: { tr: "Göz Çiçeği", en: "Eyebright" }
    aciklama: { tr: "Geceleri açan beyaz bir çiçek. Özütü bulanık görmeyi netleştirir.", en: "A white flower that blooms at night. Its extract clears blurred vision." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 8
  yabani_mantar:
    ad: { tr: "Yabani Mantar", en: "Wild Mushroom" }
    aciklama: { tr: "Çoğunlukla yenir. Sistem 'çoğunlukla' sözcüğünün altını özellikle çiziyor.", en: "Mostly edible. The System would like to underline \"mostly.\"" }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 2
  kaynak_suyu:
    ad: { tr: "Kaynak Suyu", en: "Spring Water" }
    aciklama: { tr: "Temiz su. Kıyametten sonra bundan değerlisi pek azdır.", en: "Clean water. After the end of the world, few things are worth more." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 2
  cam_sise:
    ad: { tr: "Cam Şişe", en: "Glass Vial" }
    aciklama: { tr: "Boş, temiz, ağzı mantarla tıkalı bir şişe. Her simyacı işe bununla başlar.", en: "An empty, clean, corked vial. Every alchemist's first need." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 3
  kul:
    ad: { tr: "Kül", en: "Ash" }
    aciklama: { tr: "Yanmış bir canavardan kalan kül; hâlâ ılık.", en: "Ash from a burned monster. Still faintly warm." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 2
  ates_bezesi:
    ad: { tr: "Ateş Bezesi", en: "Fire Gland" }
    aciklama: { tr: "Kor kertenkelesinin boğazından çıkarılan bez. Sıkarsan patlar; sıkma.", en: "A gland cut from an ember lizard's throat. Squeeze it and it pops. Don't squeeze it." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 12
  orumcek_zehri:
    ad: { tr: "Örümcek Zehri", en: "Spider Venom" }
    aciklama: { tr: "Dev bir örümceğin zehir kesesi. Seyreltilince kendi zehrinin ilacı olur.", en: "A giant spider's venom sac. Diluted, it treats its own poison." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 10
  diken_domuzu_eti:
    ad: { tr: "Diken Domuzu Eti", en: "Thornboar Meat" }
    aciklama: { tr: "Sert ve liflidir ama insanı şaşırtacak kadar besler. Dikenlerini önce ayıkla.", en: "Tough, stringy and surprisingly nutritious. Pull the spines out first." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 6
  canavar_cekirdegi:
    ad: { tr: "Canavar Çekirdeği Parçası", en: "Monster Core Shard" }
    aciklama: { tr: "Canavarların göğsünden çıkan kristal parçası. Simyacılar onu güç katalizörü olarak kullanır.", en: "A crystal shard pulled from a monster's chest. Alchemists use it as a power catalyst." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 15
  kaya_tuzu:
    ad: { tr: "Kaya Tuzu", en: "Rock Salt" }
    aciklama: { tr: "Kaba, gri tuz kristalleri. Et korur, tat verir, bazı ruhları uzak tutar.", en: "Coarse gray salt crystals. Preserves meat, adds flavor, keeps some spirits at bay." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 2
  pas_dis:
    ad: { tr: "Paslı Diş", en: "Rusted Fang" }
    aciklama: { tr: "Kanal faresinin dişi. Demir kadar serttir; ok ucuna da bıçak sapına da yarar.", en: "A sewer rat's tooth, hard as iron. Makes a decent arrowhead or knife grip." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 3
  sis_postu:
    ad: { tr: "Sis Postu", en: "Fog Pelt" }
    aciklama: { tr: "Sis tazısının postu. Elinde ince ince buharlaşır ama hiçbir zaman büsbütün yok olmaz.", en: "A fog hound's pelt. It steams a little in your hands but never quite disappears." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 7
  ag_ipegi:
    ad: { tr: "Dokuyucu İpeği", en: "Weaver Silk" }
    aciklama: { tr: "Sis dokuyucusunun ipeği; çelik tel kadar sağlam, tüy kadar hafiftir. Bandaj da olur, yay kirişi de.", en: "Fog weaver silk. Strong as steel wire, light as a feather. Good for bandages and bowstrings." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 8
  karga_tuyu:
    ad: { tr: "Fısıltı Tüyü", en: "Rumor Feather" }
    aciklama: { tr: "Fısıldayan karganın tüyü. Kulağına tutarsan birinin son sözlerini belli belirsiz duyarsın.", en: "A rumor crow's feather. Hold it to your ear and you can just barely hear someone's last words." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 12
  hurda:
    ad: { tr: "Hurda", en: "Scrap" }
    aciklama: { tr: "Vida, tel, kırık plastik, paslı yaylar. Usta elde her şeye dönüşebilir.", en: "Screws, wire, cracked plastic and rusty springs. In the right hands, it can become anything." }
    tur: "malzeme"
    nadirlik: "siradan"
    deger: 2
  canli_bakir:
    ad: { tr: "Canlı Bakır", en: "Live Copper" }
    aciklama: { tr: "Hâlâ hafif hafif vızıldayan, kendi kendine kıvrılan bakır tel. Rün ustaları onu iletken olarak kullanır.", en: "Copper wire that still hums faintly and curls on its own. Rune crafters use it as a conductor." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 14
  run_kabugu:
    ad: { tr: "Rün Kabuğu Parçası", en: "Runeshell Fragment" }
    aciklama: { tr: "İçinde sönük bir rünün hâlâ parladığı kabuk parçası. Kalkan yapımında değerlidir.", en: "A shell fragment with a faint rune still glowing inside. Valuable for making shields." }
    tur: "malzeme"
    nadirlik: "nadir"
    deger: 18
  kemik_boynuz:
    ad: { tr: "Kemik Taç Boynuzu", en: "Bonecrown Antler" }
    aciklama: { tr: "Kemik taçlı geyiğin boynuzu. Elinde tuttukça orman susmuş gibi gelir.", en: "An antler from the bonecrown stag. While you hold it, the forest seems to hold its breath." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 120
  kepenk_disi:
    ad: { tr: "Kepenk Dişi", en: "Shutter Tooth" }
    aciklama: { tr: "Kepenk çenesinin ağzından sökülmüş, kenarı jilet gibi bir çelik levha.", en: "A razor-edged slat of steel pried out of the shutterjaw's mouth." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 110
  bekci_parcasi:
    ad: { tr: "Bekçi Penceresi", en: "Warden's Pane" }
    aciklama: { tr: "Öğretici Bekçisi'nden kalan tek sağlam mavi pencere. Üstünde hâlâ bir bildirim yanıp sönüyor ama satırı okunamıyor.", en: "The one intact blue window left from the Tutorial Warden. A notification still blinks on it, but the line won't resolve." }
    tur: "malzeme"
    nadirlik: "epik"
    deger: 200
  kucuk_iyilesme_iksiri:
    ad: { tr: "Küçük İyileşme İksiri", en: "Minor Healing Potion" }
    aciklama: { tr: "Kırmızı, hafif köpüklü ve metal tadında. Kesikleri kapatır, kırıkları kapatmaz.", en: "Red, a little fizzy, tastes like pennies. Closes cuts. Not broken bones." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 20
    kullan: { hp: 40 }
  buyuk_iyilesme_iksiri:
    ad: { tr: "Büyük İyileşme İksiri", en: "Greater Healing Potion" }
    aciklama: { tr: "Çekirdek kristaliyle güçlendirilmiş koyu kırmızı bir iksir. Kırıkları da kapatır ama acıyı dindirmez.", en: "A deep red potion fortified with core crystal. Closes broken bones too. Doesn't do much for the pain." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 60
    kullan: { hp: 120 }
  mana_iksiri:
    ad: { tr: "Mana İksiri", en: "Mana Potion" }
    aciklama: { tr: "Hafifçe parlayan mavi bir sıvı. İçince önce başın döner, sonra büyün yerine gelir.", en: "A softly glowing blue liquid. Head spins for a second, then your magic comes rushing back." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 25
    kullan: { hp: 0, mp: 35 }
  panzehir:
    ad: { tr: "Panzehir", en: "Antidote" }
    aciklama: { tr: "Acı, bulanık ve hayat kurtarıcı. Burnunu tıkayıp iç.", en: "Bitter, cloudy and lifesaving. Hold your nose and chug." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 18
    kullan:
      hp: 10
      temizle: ["zehir"]
  ates_sisesi:
    ad: { tr: "Ateş Şişesi", en: "Fire Flask" }
    aciklama: { tr: "Fırlatmak için yapılmış bir şişe. İçilmesi kesinlikle önerilmez.", en: "A flask made for throwing. Drinking it is strongly discouraged." }
    tur: "tuketim"
    nadirlik: "nadir"
    deger: 30
    kullan: { hasar: 30, durum: "yanma" }
  goz_damlasi:
    ad: { tr: "Göz Damlası", en: "Clearsight Drops" }
    aciklama: { tr: "İki damla, bir göz kırpması: duman olsun, ışık ya da büyü olsun, görüşün geri gelir.", en: "Two drops, one blink. Smoke, glare or spell, doesn't matter. Your sight comes back." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 15
    kullan:
      temizle: ["kor"]
  kizarmis_et:
    ad: { tr: "Közde Domuz Eti", en: "Fire-Roasted Thornboar" }
    aciklama: { tr: "Tuzla ovulup közde pişirilmiş et. Kıyamette bile insana biraz insan olduğunu hatırlatır.", en: "Salt-rubbed and roasted over coals. Even at the end of the world, it makes you feel a little human." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 14
    kullan: { hp: 25 }
  mantar_corbasi:
    ad: { tr: "Mantar Çorbası", en: "Mushroom Stew" }
    aciklama: { tr: "Sıcak, koyu, doyurucu. Mavi yosun katılınca hafifçe parlar; bu normaldir.", en: "Hot, thick and filling. It glows a little with the moss in it. That's normal." }
    tur: "tuketim"
    nadirlik: "siradan"
    deger: 16
    kullan: { hp: 15, mp: 15 }
