# Bölge olayları · Perde 2, Bölüm 5–7 (events/58_bolge_p2a.yaml) bayrakları.
bayraklar:
  # ---- Bölüm 5 · Kule Dibi: boş gişe
  bl5_ucuncu_kat_toplandi: "Kule'nin kapısı bedava kaldığı gün üçüncü katta geride kalanlar toplanıp indirildi."
  bl5_kacan_cocuk_kurtarildi: "İpten çözülüp dördüncü kata kaçan çocuk geri getirildi."
  bl5_kule_defteri: "Konsey gönüllüleri Kule'nin kapısında giriş defteri tutmaya başladı."
  # ---- Bölüm 6 · Kule Dibi: yürüyen bekçi
  bl6_bekci_olduruldu: "Kule'den inen Kat 7 bekçisi Kule Dibi'nde öldürüldü."
  bl6_toplanma_noktasi: "Bekçinin zırhındaki yazı okundu: Kule döküntülerinin toplanma noktası Kordon mendireği."
  bl6_bekci_mendirekte: "Kat 7 bekçisi Kordon mendireğinde kapıya dönük diz çöktü; ışığı kapının nabzını tutuyor."
  bl6_bekci_kordona_vardi: "Kat 7 bekçisi durdurulamadan Kordon'a vardı."
  # ---- Bölüm 6 · Kule Dibi kampı: Aras
  bl6_aras_sabah_yarisi: "Aras'la Kule'nin bir sonraki katına aynı saatte çıkmak üzere sözleşildi."
  bl6_aras_yama: "Aras ceketindeki sökülmüş yamanın eski bir üniformadan kaldığını anlattı."
  # ---- Bölüm 7 · Kule Dibi: dokuzuncu kat / karantina
  bl7_bora_serbest: "Dokuzuncu kattan inen tabelacı Bora, Lonca'nın karantinasından çıkarıldı."
  bl7_bora_sustu: "Bora'ya gördüğünü kimseye anlatmaması söylendi (ya da sorusu inkârla geçiştirildi)."
  bl7_bora_tepeye: "Lonca memuruna hak verildi; Bora Yükselenler'e verilmek üzere karantinada kaldı."
  bl7_bora_biliyor: "Bora masadaki yarım satırı oyuncunun okuduğunu ve sesin kimde olduğunu sezdi."
  bl7_bora_susturuldu: "Bora sonunda sustu; Kule Dibi'nde dokuzuncu katı anlatmıyor."
  bl7_bora_vaiz: "Bora Kule Dibi'nde dokuzuncu katı anlatmayı sürdürüyor; kuyruk kısaldı."
  bl7_bora_yukselenlerde: "Bora Yükselenler'in yanında kaldı ve beyaz cüppe giydi."
  bl7_bora_siginakta: "Bora Sığınak'ın sahra çadırına yerleşti."
  # ---- Bölüm 7 · Kule Dibi: ses avcıları / işaretli çocuk
  bl7_efe_isaretli: "Ses avcılarının telsizi Efe'ye öttü; çocuk Kule Dibi'nde sesin taşıyıcısı sanılıyor."
  bl7_efe_goturuldu: "Ses avcıları Efe'yi Eski Şehir'e götürüp bir gece tuttu."
  bl7_avcilar_dagildi: "Kule Dibi'ndeki ses avcıları dağıtıldı."
  bl7_efe_yem: "Efe'nin sesin taşıyıcısı sanılmasına göz yumuldu; gözler oyuncudan uzak kaldı."
  bl7_efe_kurtuldu: "Efe'nin sesin taşıyıcısı olmadığı ortaya kondu ya da tehlikeden kurtuldu."
  bl7_efe_siginakta: "Efe Sığınak'a götürüldü."
  bl7_efe_korundu: "Zincirli ekip Efe'nin durağında yenildi."
  # ---- Bölüm 7 · Kule Dibi kampı: Elif
  bl7_elif_ses_anlatildi: "Kule Dibi kampında Elif'e sesin bütün hikayesi anlatıldı."
  bl7_elif_yankiyi_gordu: "Yankı Elif'in saatinden ona doğrudan yazdı."
  # ---- Bölüm 7 · Üs: Nehir'in defteri
  bl7_nehir_sayfa_koptu: "Nehir'in defterinden titreyen satırları içeren sayfa koparıldı."
  bl7_nehir_yaziyor: "Nehir bülteni ve titreyen satırları defterine yazmayı sürdürüyor."
  bl7_nehir_konseyde: "Nehir'in defteri Konsey'e (Elif'e) emanet edildi."
  bl7_defter_nehirde: "Yankı'nın teşekkür satırını taşıyan defter Nehir'de kaldı."
  bl7_defter_sende: "Nehir'in defteri oyuncuda."
  bl7_defter_yakildi: "Nehir'in defteri sobada yakıldı."
  bl7_defter_tepede: "Nehir'in defteri Yükselenler'e, Vahit'e verildi."
  # ---- Bölüm 7 · Üs: pencere yoklaması / Kordon: Yusuf
  bl7_yoklama_durdu: "Sığınak'taki haftalık pencere yoklaması önerisi durduruldu."
  bl7_yusuf_kurtarildi: "Balıkçı Yusuf pencere yoklamasında kalabalığa ezdirilmedi."
  bl7_yusuf_kovuldu: "Balıkçı Yusuf'un takılan penceresi yüzünden Sığınak'tan kovuldu."
  bl7_yusuf_siginakta: "Yusuf Kordon'dan kaçırılıp Konsey'in hastane çadırına yerleşti."
  bl7_yusuf_acikta: "Yusuf kayığıyla bir süre açık denizde kalıyor."
  bl7_yusuf_kordonda: "Yusuf ses avcılarından sonra Kordon'da kaldı."
  bl7_kordon_tekerleme: "Kordon çocukları tekerlemeyi 'herkesin içinde' diye değiştirdi."
  bl7_kordon_komsular: "Deniz'in balkon listesindeki aileler Yusuf için mendirekte toplandı."
  # ---- Bölüm 7 · Sanayi: matbaa / Üs: dizgi kasası
  bl7_matbaa_yakildi: "Küçük harfli baskılar yakıldı (ya da harfler potaya atıldı); matbaa mühürlendi."
  bl7_matbaa_korundu: "Matbaa ve dizgici Halit Usta Lonca ustabaşına karşı korundu."
  bl7_matbaa_kaya: "Kaya matbaayı kapattırmadı; kapıya nöbetçi koyup baskıların kopyasını istedi."
  bl7_harfler_sende: "Kendiliğinden beliren küçük kurşun harflerin kutusu oyuncuda."
  bl7_harfler_denizde: "Küçük kurşun harfler Liman'da denize atıldı."
  bl7_harfler_mertte: "Küçük kurşun harfler incelenmek üzere Mert'e verildi."
  bl7_harfler_ustada: "Halit Usta harfleri son bir kez dizdi; Yankı'nın teşekkürü kutuda duruyor."
  # ---- Bölüm 7 · Sanayi kampı: Mert
  bl7_mert_kayit_tuttu: "Mert titreyen satırın gönderen alanını (oyuncunun kimliği) kayda geçirdi."
  bl7_mert_kayit_sildi: "Mert gönderen alanının kaydını oyuncu için sildi."
  bl7_mert_kayit_sifreli: "Mert'in kaydı anahtarı oyuncuda olan bir şifreyle kilitlendi."
  # ---- Bölüm 7 · Tepe: dinleme gecesi / Üs: kaçak mürit
  bl7_sevgi_kurtarildi: "Tepe'deki dinleme ayini durduruldu; 'kap' seçilen Sevgi sahneden indirildi."
  bl7_tepe_ses_sende: "Oyuncu Tepe'deki ayinde sesin kendisinde olduğunu söyledi."
  bl7_sevgi_kacirildi: "Sevgi ayinden gizlice kaçırıldı; müritler sesin onu aldığını sanıyor."
  bl7_tepe_vahit_durdurdu: "Vahit gelip dinleme ayinini kendisi durdurdu."
  bl7_sevgi_kaldi: "Oyuncu ayine karışmadı; Sevgi dördüncü gece bayıldı."
  bl7_sevgi_siginakta: "Sevgi Sığınak'ta kaldı."
  bl7_tepe_yardimci_uyarildi: "Vahit'e yazılarak yardımcısının yeni bir kap araması durduruldu."
  bl7_sevgi_evde: "Sevgi cüppesini bırakıp annesinin yanına gitti."
  bl7_sevgi_tepeye_dondu: "Sevgi müritlere teslim edildi; Tepe'ye döndü."
