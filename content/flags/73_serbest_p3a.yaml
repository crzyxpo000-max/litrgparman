# Perde 3 serbest gün olayları, Bölüm 12–13 (events/73_serbest_p3a.yaml) bayrakları.
bayraklar:
  # ---- Bölüm 12 · Deniz: çapa
  sb12_deniz_capa_ani: "Yol'dan önce Deniz'le çapa kelimesi seçildi: vapurdaki teyzenin çantası."
  sb12_deniz_capa_durust: "Yol'dan önce Deniz'e ne olacağını bilmediğin söylendi; çapa yarım simit oldu."
  sb12_deniz_capa_kardes: "Yol'dan önce Deniz'in kardeşi çapa olarak bir martı çizdi."
  sb12_deniz_capa_yok: "Deniz'in çapa isteği geçiştirildi; kelimeyi kendisi seçip saklıyor."
  # ---- Bölüm 12 · Mert: Yol kaydı
  sb12_mert_yol_kaydi: "Mert Yol oluşumunun öncesini oyuncunun izniyle kaydetti."
  sb12_mert_reddedildi: "Oyuncu Mert'in Yol kaydı isteğini reddetti."
  sb12_mert_sinandi: "Oyuncu Mert'e yanlış bir Yol gecesi söyleyip onu sınadı."
  sb12_mert_ortu: "Mert'in kurşunlu örtüsüyle Yol imzası yabancı alıcıdan gizlendi."
  sb12_mert_iz: "Yol imzasını dinleyen yabancı alıcının izi Mert'le Kadim pazarındaki gri çadıra sürüldü."
  sb12_mert_yayin: "Oyuncu Yol imzasını bilerek açık bıraktı; dinleyen alıcı sustu."
  sb12_mert_suphe: "Sınavda Gümrük çatısına Mert değil bir Kadim gözcüsü geldi; oyuncu Mert'ten şüpheleniyor."
  # ---- Bölüm 12 · Yan zincir: Yol taşı
  sb12_tas_cekildi: "Yol taşı yutan Emre'nin buz Öz'ü oyuncunun içine çekildi (yabancı bir iplik)."
  sb12_tas_sondu: "Emre'nin iki Öz'ü birden söndürüldü; yaşıyor ama seviyesi kilitli."
  sb12_tas_yanik: "Emre'nin Özleri söndürülürken sol kolu yandı."
  sb12_tas_hastane: "Emre buzla hastaneye taşındı; Duru satıcıyı tarif etti."
  sb12_defter_alindi: "Yol taşı satıcısının Kadim defteri alındı, taşlar denize döküldü."
  sb12_defter_kopya: "Yol taşı satıcısı satmaya devam ediyor; sayfaları önce oyuncuya getiriyor."
  sb12_defter_sayfa: "Duru satıcının defterinden tek bir sayfa kopardı; sayfa oyuncuda."
  sb12_liste_uyarildi: "Yol taşı listesindeki sağ kalanlar tek tek uyarıldı."
  sb12_sayfa_yakildi: "Kadimler'in kontrol grubu kâğıdındaki oyuncu satırı yakıldı."
  sb12_defter_iade: "Defter 'Ölçeceksen yüzüme ölç' notuyla gri yazıcıya geri yollandı."
  sb12_defter_aga: "Kadim yazılı defter çözülmek üzere Sessiz Ağ'a verildi."
  # ---- Bölüm 13 · Aras: vinç
  sb13_aras_bahis: "Fırtına gecesi için Aras'la kim çok kapı kapatır bahsine girildi."
  sb13_aras_paylasim: "Fırtına gecesi için şehir Aras'la ikiye bölündü (batı ve doğu)."
  sb13_aras_gonderildi: "Vinçteki Aras uyumaya gönderildi."
  sb13_aras_cekirdek_soz: "Aras'ın göğsündeki Kadim çekirdeği onu alırsa söküp atma sözü verildi."
  sb13_aras_cekirdek_kullan: "Aras'a göğsündeki Kadim çekirdeğini fırtına gecesi kullanması söylendi."
  sb13_aras_cekirdek_anlatildi: "Aras'a çekirdeğindeki 'eve dön' çekişi anlatıldı."
  # ---- Bölüm 13 · Elif: bileklikler
  sb13_elif_bileklik: "Elif'in fırtına gecesi bilekliği takıldı; en yakını satırı boş kaldı."
  sb13_elif_bileklik_ret: "Elif'in bilekliği reddedildi; Elif onu cebinde saklıyor."
  sb13_elif_satir_adin: "Elif'in bilekliğinin en yakını satırına oyuncu kendi adını yazdı."
  sb13_elif_gece: "Elif'le bütün gece bileklik yazıldı; son bilekliği oyuncu yazdı."
  # ---- Bölüm 13 · Yan zincir: tebeşir daireleri
  sb13_kiz_yaninda: "Oyuncu kapıları duyan kızın tebeşir dairesine girip yanında bekledi."
  sb13_kiz_annede: "Kapıları duyan kız kalabalıktan kurtarılıp annesine bırakıldı."
  sb13_kiz_teslim: "Kapıları duyan kız fraksiyon yetkililerine teslim edildi."
  sb13_kiz_korundu: "Kapıları duyan kız korundu; kimseye ödünç verilmedi."
  sb13_kiz_nobet: "Kapıları duyan kızın çadırına nöbetçi kondu."
  sb13_kiz_kayit: "Kapıları duyan kızın ritmi Sessiz Ağ'a kaydettirildi."
  sb13_kiz_odunc: "Kapıları duyan kız bir geceliğine gri yazıcıya ödünç gitti."
  sb13_yerine_olculdu: "Oyuncu kızın yerine kendini gri yazıcıya ölçtürdü."
  sb13_harita_dagitildi: "Kızın fırtına haritası dört kampa dağıtıldı."
  sb13_harita_sakli: "Kızın fırtına haritası yalnız oyuncuda kaldı."
  sb13_harita_silindi: "Kızın fırtına haritası silindi; kız dinlemeyi bıraktı."
