# Paket 3 — Perde 1 keşif olayları (events/31_kesif_p1.yaml). Önek k1_. Bayrak → açıklama.
bayraklar:
  # ---- vitrindeki aile (çarşı)
  k1_vitrin_gercek: "Vitrinde sofra kuran adama mankenlerin ne olduğu söylendi; adam zaten bildiğini itiraf etti."
  k1_vitrin_kovuldu: "Vitrinci gerçeği duymak istemedi; oyuncuyu 'çocuklarının önünde' kovdu."
  k1_vitrin_kirildi: "Vitrindeki küçük manken (uyanmaya başlayan) adamın gözü önünde kırıldı."
  k1_vitrin_nobet: "Vitrinci uyuyabilsin diye küçük mankenin başında gece nöbeti tutuldu (içeriden ya da camın dışından)."
  k1_vitrin_bosaltildi: "Vitrindeki mankenler adamla birlikte konteynere taşındı; vitrine BOŞ yazıldı."
  k1_vitrinci_kampta: "Vitrinci (sahte kalabalık ustası) oyuncunun kampına alındı."
  # ---- tek yöne işleyen merdiven (çarşı)
  k1_merdiven_sokuldu: "Tek yöne işleyen merdivenin kontrol paneli söküldü; merdiven durdu, Sistem penceresi söndü."
  k1_ucuncu_kat_goruldu: "Kepenk kaldırılıp üçüncü kattaki etiketli 'teşhir alanı' görüldü (ziyaretçi: 1)."
  k1_ucuncu_kat_alindi: "Üçüncü kattaki teşhir alanından 'dokunmayın' uyarısına karşın bir eşya alındı."
  k1_anahtar_117: "Merdivenden inen 117 numaralı istasyon emanet anahtarı kızdan alındı (emanet dolapları olayında kullanılır)."
  # ---- yüksek skor tablosu (çarşı)
  k1_skor_kirildi: "Gerçek seviyeleri gösteren oyun kabini kırıldı (çarşıdaki 'dürüst tek şey')."
  k1_skor_goruldu: "Skor tablosundaki gerçek seviye bir avcının önünde açıkça kabul edildi (açığa vurma)."
  k1_skor_ezber: "Skor tablosundaki sekiz ad ve gerçek seviyeleri ezberlendi (41'lik bilinmeyen ad, boş dokuzuncu satır)."
  # ---- batık vagondaki çocuk (istasyon)
  k1_telefon_bulundu: "Batık vagondan çocuğun ablasının telefonu çıkarıldı (ekranı ölü, suya doymuş)."
  k1_telefon_kurtuldu: "Telefonun kaya tuzuyla kurutulması çocuğa gösterildi."
  k1_cocuk_kurtarildi: "Batık vagona dalan çocuk dalmaktan vazgeçirildi ya da sudan çıkarıldı."
  k1_cocuk_daldi: "Çocuk uyarıya karşın yosun sırtlının bulunduğu suya yeniden daldı."
  # ---- sefer tahtası (istasyon)
  k1_tahta_iptal: "Sefer tahtasında adı geçen adam cam köprüde vaktinde durduruldu; satırı İPTAL oldu."
  k1_tahta_uyarilan_yarali: "Sefer tahtasındaki adama geç kalındı; köprüden düştü, yaralı olarak taşındı (RÖTAR)."
  k1_tahta_cocuk_korundu: "Tahtada adı çıkan çocuk annesiyle gişeye kapatılıp korundu; kopan kablo boşa düştü."
  k1_tahta_sokuldu: "Sefer tahtası çerçevesinden söküldü; kalabalık ikiye bölündü."
  k1_tahta_kendi: "Oyuncu tahtada kendi satırını buldu: saati yok, durum kanadı yarım dönmüş."
  # ---- emanet dolapları (istasyon)
  k1_dolap_acildi: "117 numaralı dolap kadın için açıldı (anahtarla ya da levyeyle); oğlunun iskeleye gittiğini yazan not bulundu."
  k1_dolap_paylasildi: "117 numaralı dolabı hurdacılar kırdı; saati aldılar, çizimler kadında kaldı."
  k1_dolap_sahibi_soylendi: "Kadına 117'nin penceresi okundu: sahibi (oğlu) hayatta."
  k1_dolap_yagma: "Oyuncu hurdacılara katılıp emanet dolaplarının yarısını kırdı."
