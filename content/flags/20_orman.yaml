# Parti B — Orman ve genel olaylar (events/20_orman.yaml) bayrakları.
bayraklar:
  # yarali_avci / avci_haberi
  avci_kurtarildi: "Yaralı avcı kurtarıldı (borç tohumu: avci_haberi)."
  avci_yagmalandi: "Yaralı avcının çantası alınıp o kaderine bırakıldı (hesap tohumu: avci_haberi)."
  avci_birakildi: "Yaralı avcı tazılara bırakıldı; öldü."
  avci_ucret: "Yaralı avcıdan kurtarmanın bedeli hemen istendi."
  avci_dusman: "Soyulan avcı ve tayfası oyuncuya kin besliyor (gece_baskini'nda geri dönebilirler)."
  # yabanci_geri_donus
  yabanci_affetti: "Açılışta bırakılan yabancıyla hesap kapandı (özür, diz çökme ya da paylaşılan av)."
  yabanci_dusman: "Açılışta bırakılan yabancı ve Yükselenler'deki arkadaşları oyuncuya düşman."
  yabanci_tapiyor: "Açılışta bırakılan yabancı, oyuncunun gücünü görüp ona tapmaya başladı."
  # yabanci_minnet
  minnet_grubu: "Kurtarılan yabancının yağmur kanalındaki grubu Sığınak'a götürüldü."
  # kayip_cocuk
  cocuk_kurtarildi: "Sisteki kayıp çocuk annesine geri getirildi."
  cocuk_kayboldu: "Sisteki kayıp çocuk aranmadı; annesi tek başına sise girdi."
  tavsan_bagislandi: "Çocuğun kurtardığı iğne tavşanı bağışlandı; çocukla kaldı."
  tavsan_yendi: "Çocuğun kurtardığı iğne tavşanı yemek yapıldı."
  # zehirli_bereket
  bereket_uyarildi: "Meyve korusundaki zehir aç kampa zamanında gösterildi."
  bereket_kamp: "Aç kamp meyve korusunun dibinde kaldı (geceleri canavar çeker)."
  bereket_saklandi: "Korunun zehri bilinip saklandı; güvenli meyveler yalnızca oyuncuya kaldı."
  bereket_bebek: "Zehirlenen bebeğe panzehir verildi."
  # isaretli_agaclar
  dokuyucu_olduruldu: "Ağaçlara sahte ok kazıyan Sis Dokuyucu öldürüldü."
  ag_mesaji_birakildi: "Sessiz Ağ'ın daireli oklarına cevap bırakıldı."
  # gece_baskini
  baskin_cocuklar: "Gece baskınında çocukların çadırı korundu."
  baskin_kacti: "Gece baskınında oyuncu kampı bırakıp karanlığa kaçtı."
  # siralama_gunu
  sirala_gizlendi: "İlk Küresel Sıralama'da gerçek seviye daha da derine gizlendi."
  sirala_acildi: "İlk Küresel Sıralama'da gerçek seviye herkese açıldı."
  # sahte_seviye
  sahte_ifsa: "Çarşıda seviyesini şişiren adamın gerçek seviyesi açığa çıkarıldı."
  sahte_kacti: "Sahte seviyeli adam linçten kaçtı; çarşının o köşesi korumasız kaldı."
  sahte_ortak: "Sahte seviyeli adamın koruma haracına ortak olundu."
  sahte_dost: "Sahte seviyeli adamla çeteye karşı gizlice anlaşıldı."
