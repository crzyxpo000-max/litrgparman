# Demir Gece uyarısı ve hazırlıkları (DECISIONS #150).
bayraklar:
  demir_gece_uyarildi: "Demir Gece'den önceki uyarı sahnesi görüldü (Lonca adamları Gümrük'ü ölçüyordu); gece ancak bundan sonra gelir."
  demir_gece_nobet: "Hazırlık: Konsey'den Gümrük'e nöbetçi istendi; İskele'den sonra Gümrük'e yetişilebilir."
  demir_gece_isaret: "Hazırlık: Elif'e işaret fişeği verildi; İskele'den sonra yeterince hızlıysan Gümrük'e yetişilebilir."
  demir_gece_seviye: "Demir Gece'de Elif'i kurtarmak için gerçek seviye herkesin önünde açıldı."
