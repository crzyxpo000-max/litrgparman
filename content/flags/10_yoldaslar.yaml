# Parti A — Yoldaş yayları (events/10_yoldaslar.yaml) bayrakları.
bayraklar:
  deniz_yankiyi_biliyor: "Deniz'e kafadaki ses (Yankı) anlatıldı; Yankı bunu sırrının ifşası sayar."
  deniz_kardese_soz_verildi: "Ateş başında Deniz'e kız kardeşini bulma sözü verildi."
  kardes_izi_bulundu: "Kırık İstasyon'da Deniz'in kız kardeşinin duvara kazıdığı not (ördeğe benzeyen martı) bulundu."
  kardes_notu_saklandi: "Kardeşle ilgili bir bilgi (duvardaki satır ya da Sistem kaydı) Deniz'den saklandı; itiraf edilirse kalkar."
  deniz_guveni_yarali: "Deniz kaldı ama güveni yaralandı (Yaralı Güven izi); vaizler kovuldu ya da saklanan satır itiraf edildi."
  deniz_yukselenlere_gitti: "Deniz, kardeşini bulma vaadiyle Yükselenler'e gitti (fraksiyonu yukselenler; Perde 1 sonu durumu)."
  aras_tanisildi: "Aras Kurt ile tanışıldı (rakip_iz); Aras yayının sonraki düğümlerini açar."
  aras_yarisi_kazanildi: "Kuzey sırtındaki kapı yarışında Aras'tan önce varıldı."
  aras_yarisi_birakildi: "Kuzey sırtındaki kapı yarışı otobüs için ya da bilerek Aras'a bırakıldı."
  aras_yarisi_kaybedildi: "Kuzey sırtındaki kapı yarışı Aras'a kaybedildi."
  sinyal_cevaplandi: "Kırık İstasyon'daki anons mikrofonuna cevap verildi; Sistem oyuncuyu dinliyor."
  sinyal_susturuldu: "Kırık İstasyon'daki sinyal hoparlörü kırıldı ya da bastırıldı."
