# Bölüm 12 (Yol) bölge olayları ve saha kampı sahneleri bayrakları (events/75_bolge_p3b.yaml).
bayraklar:
  # ---- Kule Dibi: kaçak bekçi ve iz ----
  bl12_bekci_dinlendi: "Kule Dibi'nde diz çöken kaçak bekçinin oyuğuna el kondu; bekçi Kule'ye kendisi döndü."
  bl12_bekci_serbest: "Kaçak bekçi avcılardan korunup Kule'nin kapısına yürütüldü; kapının yanına avuç izi bıraktı."
  bl12_bekci_olduruldu: "Kaçak bekçi ödül için tek darbede öldürüldü (Lonca ödülü)."
  bl12_bekci_lonca: "Kaçak bekçi Lonca avcılarına bırakıldı; kurşunlar altında oyuncuya doğru yürüyüp öldü."
  bl12_iz_paylasildi: "Kule'nin dış cephesindeki ışıklı iz tırmanıcılarla birlikte çıkıldı."
  bl12_iz_tirmanildi: "Kule'nin dış cephesindeki ışıklı iz tek başına sonuna kadar tırmanıldı."
  bl12_iz_silindi: "Kule'nin dış cephesindeki ışıklı izin ilk on katı kazındı."
  # ---- Kule Dibi: senetçi ----
  bl12_senet_okundu: "Kule'nin önündeki Tavvar senet kuyruğunda senedin maddeleri yüksek sesle okundu (ya da Elif muayene etti)."
  bl12_senet_yirtildi: "Oyuncu kendi adına yazılmış senet levhalarını kırdı."
  bl12_senet_kovuldu: "Tavvar senetçi Kule'nin önünden kovuldu."
  bl12_senet_imzalandi: "Oyuncu senet kuyruğunun yanından sesini çıkarmadan geçti."
  bl12_donen_kurtarildi: "Senetle Kervan'a gidip kaçan Ferhat, Gümrük Muhafızı'ndan kurtarıldı."
  bl12_donen_teslim: "Kaçan Ferhat Gümrük Muhafızı'na bırakıldı ya da muhafız onu geri götürdü."
  # ---- Batık Takımada / Kule Dibi: kemik suyu ve tuzlu taş ----
  bl12_dalis_yapildi: "Kemik suyu günü Nehha dalgıçlarına suyun altında ışık tutuldu."
  bl12_resif_kirildi: "Batık meydanı saran mercan çobanları ve resif oyuncu tarafından söküldü."
  bl12_dalis_birakildi: "Yaşlı Moru dinlenip dalgıçlar sallarda tutuldu; Vael-Sa tek başına daldı."
  bl12_heykel_dokunuldu: "Batık meydandaki göğsü oyuk Nehha heykelinin taşına dokunuldu."
  bl12_nehha_tasi: "Vael-Sa'nın Kule Dibi'ne getirdiği heykel taşı (Dönen'in taşı) kabul edildi."
  bl12_nehha_tasi_iade: "Heykel taşı Vael-Sa ile Batık Takımada'ya geri gönderildi."
  # ---- Pirinç Kervan / üs: kazan ve Kervan'ın borcu ----
  bl12_kazan_yakildi: "Oyuncu göğsündeki ısıyı Kervan'ın kazanına verdi; ateşçiler pullarını yakmayı bıraktı."
  bl12_kazan_temizlendi: "Kervan'ın kazan borusundaki kazan böcekleri temizlendi."
  bl12_kazan_kadim: "Thessar aracılığıyla Kervan'a Kadim mühürlü yakıt gönderildi."
  bl12_kazan_pul: "Kervan'ın ateşçileri hece pullarını kazana yakmaya devam etti."
  bl12_kervan_pulu: "Kervan'ın oyuncu için döktüğü hece pulu (\"kazanı ısıtan\") boyna asıldı."
  bl12_tavvar_siginakta: "Kapıya gelen Tavvar ateşçi Sığınak'ta kaldı (aşevi ya da Elif'in reviri)."
  # ---- Tepe / üs: göz çiçeği tarlası ve ağrı kesici sandığı ----
  bl12_tarla_nobet: "Tepe'deki göz çiçeği tarlasında gece geçirildi; uyurgezerler oyuncunun çevresinde döndü, hasadın yarısı kaybedildi."
  bl12_tarla_hasat: "Göz çiçekleri kapanıp hasat kurtarıldı (oyuncu ışığını bastırdı ya da Elif ıslak bezle yürüyüşü durdurdu)."
  bl12_tarla_yandi: "Tepe'deki göz çiçeği tarlası oyuncu tarafından yakıldı; revirin ağrı kesicisi kayboldu."
  bl12_tarla_birakildi: "Oyuncu uyurgezerleri Şükran Nine'ye bıraktı; biri uçurumdan düştü."
  bl12_cicek_revire: "Göz çiçeği sandığı Sığınak revirine verildi."
  bl12_cicek_lonca: "Göz çiçeği sandığı Lonca'ya satıldı; kristal Şükran Nine'ye gitti."
  bl12_cicek_bolundu: "Göz çiçeği sandığı revir, Kapı cerrahı ve Nine arasında bölündü (oyuncu ya da Elif)."
  # ---- Sanayi / Kule Dibi: susturucu halkalar ----
  bl12_halka_defter: "Sanayi'deki susturucu halka siparişlerinin teslim yeri okundu (balık hali deposu / Gümrük bodrumu)."
  bl12_halka_ornek: "Oyuncu bir susturucu halkayı cebine attı."
  bl12_halka_ocagi_sondu: "Susturucu halka döven ocak oyuncu tarafından söndürüldü (Sanayi'de tehlike arttı)."
  bl12_halka_inanildi: "Oyuncu ustanın halkaların yalnızca Yol taşı kurbanları için olduğu sözüne inandı."
  bl12_halka_takildi: "Oyuncu Kule Dibi'ndeki Yol Denetimi'nde susturucu halkayı herkesin önünde taktı."
  bl12_halka_reddedildi: "Oyuncu Yol Denetimi'nde halkayı reddedip bariyeri geçti."
  bl12_halka_noktasi_dagildi: "Yol Denetimi noktası dağıldı; avcıların halkaları kırıldı ya da açıldı."
  # ---- Eski Şehir / Kordon: saatçi ----
  bl12_saatler_geri: "Hayri Usta'nın dükkânında saatler geri işledi; gölgeler Eski Şehir'in sokaklarına dağıldı."
  bl12_golgeler_dagitildi: "Saatçi dükkânındaki çıkmaz gölgeleri dağıtıldı."
  bl12_saat_alindi: "Nermin'in dördü on iki geçe durmuş saati Kordon'a götürülmek üzere alındı."
  bl12_saatci_birakildi: "Oyuncu saatçi dükkânından çıktı; Hayri Usta saati Kordon'a kendisi götürdü."
  bl12_saat_denizde: "Nermin'in saati Kordon'da denize karıştı."
  bl12_saat_son_soz: "Yankı köpük ruhundan Nermin'in son cümlesini çıkarıp söyledi."
  bl12_saat_hayride: "Nermin'in saati Hayri Usta'da ya da Elif'te kaldı."
  # ---- Saha kampı sahneleri ----
  bl12_kamp_aras_durust: "Kule Dibi kampında Aras'a Yol'un acıttığı dürüstçe söylendi."
  bl12_kamp_aras_yaris: "Kule Dibi kampında Aras'a Kadim çekirdeğini yutup Kule'nin tepesinde yarışma teklif edildi."
  bl12_kamp_aras_ates: "Kule Dibi kampında Aras'a Kadim çekirdeğini ateşe atması söylendi (atamadı)."
  bl12_kamp_elif_dosya: "Kule Dibi kampında Elif oyuncunun iki nabzını defterine kaydetti."
  bl12_kamp_deniz_sen: "Tepe kampında Deniz'e 'sen buradasın' cevabı verildi."
  bl12_kamp_deniz_yildiz: "Tepe kampında bir yıldıza Deniz'in kız kardeşinin adı verildi."
