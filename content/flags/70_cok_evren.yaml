  batik_fener_goruldu: "Son Fener ve bekçisi Oru-Venn görüldü."
  batik_lamba_yakildi: "Son Fener'in lambası oyuncunun manasıyla yakıldı (Başakçı'yı çekti)."
  batik_cocuklar_dunyada: "Son Fener'in otuz yedi çocuğu Dünya'ya taşındı."
  batik_basakci_sozu: "Oru-Venn'e Başakçı'yı öldürme sözü verildi."
  batik_gorunur: "Yankı Sönükleri Sistem'e yeniden görünür kıldı (Seviye 1)."
  batik_fener_soyuldu: "Son Fener'in merceği söküldü; lamba söndü."
  batik_fener_dustu: "Son Fener Başakçı'ya düştü."
  basakci_olduruldu: "Son Başakçı savaşta yok edildi."
