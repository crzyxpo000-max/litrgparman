# Parti I — Çok-evren bayrakları (ortak bayraklar cok_evren_acik, yedi_taht_davet: flags/00_sozlesme.yaml).
bayraklar:
  # ---- Geçit (cok_evren_kapisi) ----
  gecit_ilk_giren: "Oyuncu ellinci kata dış cepheden koşarak geçide herkesten önce girdi (İlk Katman Gezgini)."
  gecit_herkese_acik: "Geçit herkese açık bırakıldı (kadim_tehdit +3)."
  gecit_denetimli: "Geçit Lonca nöbeti ve izinle denetleniyor."
  gecit_oyuncunun: "Geçit mühürlendi; yalnızca oyuncu geçebiliyor."
  tilu_korundu: "Geçitten gelen Nehha çocuğu Tilu silahlardan korundu."
  tilu_ag_teslim: "Tilu incelenmek üzere Sessiz Ağ'a teslim edildi."
  tilu_vuruldu: "Tilu geçitte Lonca avcılarınca vuruldu; Nehhalar bunu biliyor."
  tilu_eve_dondu: "Tilu Batık Takımada'ya, annesine götürüldü."
  tilu_ag_tutsak: "Tilu Sessiz Ağ'da tutulmaya devam ediyor."
