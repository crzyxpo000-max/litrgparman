  bl13_sac_defter: "Zırhlı kamyonların sevkiyat defterinde varış yeri okundu: Liman, Konsey binası, Gün 292 şafak öncesi."
  bl13_sac_gevsek: "Zırhlı kamyonlardan birinin koçbaşı kaynağı gizlice zayıflatıldı."
  bl13_sac_yakalandi: "Oyuncu kamyonun kaynağını bozarken vardiya amirine yakalandı."
  bl13_sac_sustu: "Kaynakçıya gördüğünü unutması söylendi."
