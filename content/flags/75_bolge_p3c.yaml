  bl13_tas_alindi: "Oyuncu Kervan'dan bir ayar taşı aldı."
  bl13_taslar_kirildi: "Kervandaki ayar taşı sandığı devrilip taşlar ezildi."
  bl13_tasu_cezalandi: "Kırılan taşların bedeli Tasu'nun adına yazıldı."
  bl13_muhafiz_yenildi: "Taşın peşinden Kule Dibi'ne gelen Gümrük Muhafızı yenildi."
  bl13_tas_geri_alindi: "Gümrük Muhafızı ayar taşını oyuncudan geri aldı."
  bl13_tas_agda: "Ayar taşı Sessiz Ağ'a verildi; içindeki frekans çözülüyor."
  bl13_tasu_siginakta: "Tasu Sığınak'ta Konsey'in koruması altına alındı."
  bl13_oymaci_teslim: "Kaçak oymacı ya da taş Kadimler'e teslim edildi."
  bl13_tas_susturma: "Ayar taşlarının akordunu bozmanın yolu öğrenildi: esin ortasına vurmak."
  # ---- Sanayi · saclar
