# Bölüm 13 (Kapı Fırtınası) bölge olayları, üs olayları ve saha kampı sahneleri (events/75_bolge_p3c.yaml) bayrakları.
bayraklar:
  # ---- Kule Dibi · fırtına poliçesi
  bl13_police_ifsa: "Kule Dibi'ndeki fırtına poliçecisinin avcı listesindeki dönmeyen tırmanıcı adları yüksek sesle okundu."
  bl13_police_ustlenildi: "Oyuncu Kule Dibi'nde satılan 412 fırtına poliçesini kendisi karşılamayı üstlendi."
  bl13_police_lonca: "Fırtına poliçecisi Lonca'ya teslim edildi; kartları Lonca damgaladı (karşılanır/karşılanmaz)."
  bl13_police_ortak: "Oyuncu fırtına poliçecisinden pay aldı; kartlara onun adı yıldızlı basıldı."
  bl13_liste_sokak: "Poliçe kartları sokak sokak ayrıldı; her sokağa bir kart sahibi nöbetçi kondu."
  bl13_liste_elifte: "Poliçe sahiplerinin adres kutusu Elif'in sedye ekiplerine verildi."
  bl13_liste_sende: "Oyuncu poliçe sahiplerinin adres kutusunu fırtına gecesi kendisi dolaşmak için sakladı."
  bl13_liste_durust: "Oyuncu poliçe sahiplerine hepsine yetişemeyeceğini açıkça söyledi."
  # ---- Kule Dibi · kaçak bekçiler
  bl13_bekci_izlendi: "Kule'den inen kaçak kat bekçileri tramvay deposuna kadar izlendi; yüzleri Sanayi'ye dönük."
  bl13_bekci_kural: "Kaçak bekçinin penceresinde yabancı elle yazılmış yeni kural okundu: Merkeze yürünür."
  bl13_bekci_ag: "Kaçak bekçiler Sessiz Ağ'ın vericileriyle işaretlendi."
  bl13_bekci_parca: "Oyuncu öldürdüğü kaçak bekçiden ritimle atan gri bir parça aldı."
  bl13_merkez_duyuldu: "Bekçi halkasının ortasında fırtınanın merkezi (Sanayi'deki fırın) duyuldu."
  bl13_halka_dagildi: "Tramvay deposundaki bekçi halkası dağıtıldı."
  bl13_halka_geri: "Bekçi halkası oyuncunun koyduğu kuralla Kule'ye geri yollandı."
  bl13_halka_kaldi: "Bekçi halkasına dokunulmadı; büyümeye devam ediyor."
  # ---- Kule Dibi · çatı kedileri
  bl13_kediler_haberci: "Çatı Kedileri (Fare'nin çetesi) fırtına gecesi oyuncunun habercisi olmayı kabul etti."
  bl13_kediler_uyarildi: "Çatı Kedileri fırtına gecesi çatıların tehlikesine karşı uyarıldı."
  bl13_kediler_ihbar: "Çatı Kedileri Konsey nöbetine teslim edildi."
  bl13_kediler_kovuldu: "Çatı Kedilerinin yağma haritası silindi, çocuklar kovuldu."
  bl13_kediler_serbest: "Nezarethanedeki Çatı Kedileri oyuncunun kefaletiyle bırakıldı."
  # ---- Tepe · kapı provası / Kule Dibi · beyaz alay
  bl13_prova_anne: "Tepe'deki kapı provasında oğlunu kapıya kaptıran kadınla konuşuldu."
  bl13_prova_kapandi: "Tepe'deki çay bahçesinde prova kapısı oyuncunun eliyle kapatıldı."
  bl13_prova_yonetildi: "Tepe'deki kapı provasını oyuncu devraldı; kimse ışığa dokunmadı."
  bl13_prova_sayildi: "Tepe'deki kapı provası karışılmadan izlendi."
  bl13_alay_kurtarildi: "Kule Dibi'ndeki beyaz alay akbabadan korundu; dağıtıldı."
  bl13_alay_dagildi: "Beyaz alayın sayımı kesildi; kapı kendi içine çöktü."
  bl13_alay_yonetildi: "Oyuncu beyaz alayın ortasında kapının önünde durdu."
  bl13_alay_seyredildi: "Beyaz alaya karışılmadı; akbaba birini aldı."
  bl13_alay_kayip: "Beyaz alaydan biri (ayakkabılı kadın) akbabaya kaybedildi."
  # ---- Pirinç Kervan · ayar taşları / Kule Dibi · pirinç pullu konuk
