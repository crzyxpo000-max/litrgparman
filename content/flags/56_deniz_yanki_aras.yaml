# Parti F — Deniz, Yankı ve Aras yayları (events/56_deniz_yanki_aras.yaml) bayrakları.
# Ortak bayraklar (deniz_kardes_bulundu, yanki_son_sirri, yanki_silindi, yanki_ele_gecirdi, aras_s_kademe,
# aras_cok_evren_yoldasi) flags/00_sozlesme.yaml'dadır.
bayraklar:
  # ---- Deniz ----
  kardes_sakli_p2: "Kıyıkent duvarlarındaki martılar (Deniz'in kardeşinin izi) silindi; kardeşin akıbeti saklandı."
  kardes_olu_bulundu: "Deniz'in kardeşi düşmüş Kordon'daki cankurtaran kulesinde ölü bulundu."
  kardes_kurtarildi: "Deniz'in kardeşi hayatta ve Sığınak'ın Liman'daki deposunda (Yükselenler'den kurtuldu)."
  kardes_yukselenlerde: "Deniz'in kardeşi Tepe'deki Seçilmişler Yurdu'nda kaldı (yakıt listesinde)."
  deniz_ayri: "Deniz yaşıyor ama oyuncunun yanında değil; kardeşinin yanında ya da yas için ayrı."
  deniz_yukselenlerden_dondu: "Deniz Yükselenler'i bıraktı (şalı attı; oyuncunun yanına ya da Sığınak'a geçti). Parti C de aynı anlamda koyar."
  deniz_tepede_kaldi: "Deniz kardeşini kollamak için Tepe'de Yükselenler'e katıldı (P2)."
  deniz_intikam: "Deniz kardeşinin ölümünden sonra Yükselenler'den intikam yemini etti."
  deniz_insan_sozu: "Yan yatmış vapurda (P3) Deniz'e (ya da onun anısına) insan kalma sözü verildi."
  deniz_fedakarlik: "P4: Deniz Hasat Avcısı'na karşı oyuncu için hattı tuttu ve öldü."
  deniz_fedakarlik_onlendi: "P4: Hasat Avcısı'nın darbesi Deniz'e ulaşmadı; Deniz yaşadı."
  # ---- Yankı ----
  yanki_kaynagi_goruldu: "Kule'deki dikiş yeri (Yankı'nın koptuğu kaynak) bulundu ve görüldü."
  yanki_butunlesti: "Yankı'nın son sırrında oyuncu Yankı ile tamamen birleşti."
  yanki_geri_itildi: "Yozlaşma eşiklerinde Yankı'nın bedeni ele geçirme girişimi geri püskürtüldü."
  yanki_ile_pazarlik: "Yozlaşma 50'de Yankı ile gece saatleri için pazarlık yapıldı."
  # ---- Aras ----
  aras_gecesi_goruldu: "Kule'nin ayna katında Aras'ın en kötü gecesi (köprü) görüldü."
  aras_kule_kazanildi: "Kule'nin 30. katı Aras'tan önce alındı."
  aras_kule_birakildi: "Kule'nin 30. katı Aras'a bırakıldı."
  aras_kule_ortak: "Kule'nin 30. katı Aras ile birlikte alındı."
  aras_ebedi_rakip: "Aras ile ebedi rakiplik ilan edildi (rakip işareti)."
  aras_kadim_teklifini_aldi: "Aras çok-evren geçidinde bir Kadim gözcüsünün S kademesi kısayolunu (çekirdek) aldı."
  aras_kadim_teklifi_reddedildi: "Aras Kadim gözcüsünün kısayolunu reddetti ya da teklif geri çekildi."
