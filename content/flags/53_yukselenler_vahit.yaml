# Parti C — Yükselenler zinciri, Vahit'in yayı, Deniz'in Yükselenler dalı (events/53_yukselenler_vahit.yaml).
# Ortak bayraklar (vahit_hakli, vahit_sahtekar, uye_*, ihanet_deniz …) flags/00_sozlesme.yaml'dadır.
bayraklar:
  # ---- zincir
  vahit_yakin_takip: "Vahit Perde 2'de yakından tanındı (Çağrı ya da Seçilmişler); mucize sınavı ve maske düşer bunu ister."
  yukselenler_ilk_yakit: "Çağrı'da oyuncu ilk yakıtını kendi ağzıyla adlandırdı."
  yakit_reddi_goruldu: "Çağrı'da oyuncu elini sarnıcın zarına soktu; Sistem onu yakmayı reddetti (Tepe'nin mucizesi)."
  yukselenler_ikircikli: "Çağrı'da beyaz giyildi ama kimse adlandırılmadı."
  yukselenler_casus: "Oyuncu Yükselenler'e casus olarak katıldı (Sığınak/Sessiz Ağ için)."
  yukselenler_reddedildi: "Yükselenler'in Çağrı'sı reddedildi (Seçilmişler sahnesinde geri alınabilir)."
  sarnic_yemini: "Oyuncu Vahit'e Tepe'nin sarnıcını kapatacağına yemin etti."
  yakit_sarti: "Oyuncu katılmak için yakıt sırasının kalkmasını şart koştu (Vahit söz verdi, tutmadı)."
  yukselenler_2_tamam: "Zincir 2: yakıt defteri imzalandı, gönüllülere ya da mahkûmlara indirildi ya da sızdırıldı (zincir sürer)."
  yakit_listesi_imzalandi: "Büyük Ayin'in 300 kişilik yakıt defteri oyuncunun imzasıyla onaylandı."
  yakit_gonulluler: "Yakıt defteri yalnızca gönüllülere indirildi."
  yakit_mahkumlar: "Yakıt defterindeki masumların yerine şehrin mahkûmları yazıldı."
  yakit_defteri_bozuldu: "Yakıt defteri yakıldı ya da hesabı ifşa edilip kapatıldı (zincir başarısız)."
  yakit_defteri_sizdi: "Yakıt defterinin kopyası Sığınak'a sızdırıldı; yüzlerce kişi ayinden önce kaçırıldı."
  on_ucuncu_cizildi: "On Üç'ün (Öğretici'deki mürit) satırı yakıt defterinden çizildi ya da adı dışarı taşındı."
  on_ucuncu_kacti: "On Üç Tepe'den kaçtı."
  on_ucuncu_yaninda: "On Üç oyuncunun yanında kaldı (kurban sahnesinde sunulabilir)."
  on_ucuncu_yandi: "On Üç mevsimin son yakıtı olarak yandı."
  on_ucuncu_adini_aldi: "On Üç listeden önceki gerçek adını geri aldı."
  on_ucuncu_kurban: "On Üç kurban olarak Ocak'a sunuldu."
  yukselenler_3_tamam: "Zincir 3: Büyük Ayin tamamlandı (katkı alındı, dağıtıldı ya da oyuncu kendini sundu)."
  ayin_alindi: "Büyük Ayin'in bütün katkısını oyuncu aldı."
  ayin_kendini_yakti: "Büyük Ayin'de oyuncu yakıt yerine zara kendi girdi; zar onu ve dokuz kişiyi geri kustu."
  sarnic_kapandi: "Tepe'nin sarnıç Kapısı ya da Son Ocak mühürlendi."
  yukselenler_4_tamam: "Zincir 4: kurban sunuldu (On Üç, oyuncunun kendisi, bir hayran, Vahit ya da Deniz)."
  kurban_kendisi: "Kurbanda oyuncu kendini sundu ve Ocak onu ikinci kez reddetti (Yanmayan)."
  vahit_ocaktan_cekildi: "Kurbanda Ocak'a yürüyen Vahit son adımda geri çekildi."
  deniz_ocakta: "Kurbanda Deniz oyuncu tarafından Ocak'a itildi (Deniz öldü)."
  deniz_kurbandan_kurtuldu: "Kurbanda yenilen Deniz bağışlandı; zincir başarısız oldu."
  yukselis_sadakati: "Zincir 5: oyuncu Son Ocak'ta diz çöküp kendini Sistem'e yazdırdı (Yükseliş yolu)."
  yukselenler_oyuncuya_bagli: "Zincir 5: Yükselenler'in mutlak sadakati oyuncuya bağlandı (Sistem'e değil)."
  yukselenler_yakitsiz: "Zincir 5: mutlak sadakat kimse yakılmadan alındı."
  # ---- Vahit
  vahit_yankiyi_biliyor: "Vahit Yankı'nın bir satırını oyuncunun ağzından duydu."
  vahit_itibar_sarsildi: "Mucize sınavında Vahit'in kehaneti çöktü ya da ifşa edildi."
  vahit_mucizesi_verildi: "Oyuncu kapıyı kapatıp mucizeyi Vahit'e verdi (Vahit borçlu)."
  mucize_calindi: "Oyuncu kapıyı herkesin önünde kapatıp mucizeyi kendine aldı."
  vahit_borclu: "Vahit mucize karşılığında sürüsünü oyuncuya vaat etti."
  vahit_maskesi_dustu: "Vahit'in Dinleme Odası açıldı; hakli ya da sahtekar olduğu belli oldu (Yükseliş Kapısı'nı açar)."
  secici_yetkisi: "Oyuncu hasadın ön seçim yetkisini Vahit'ten devraldı (vahit_hakli)."
  vahit_kanaldan_koptu: "Hasadın kancası Vahit'in kafasından söküldü."
  vahit_sirri_saklandi: "Vahit'in hasat kanalı açık kaldı ve sır saklandı."
  vahit_kukla: "Vahit'in sesi artık oyuncunun ağzından konuşuyor (sahtekâr peygamber ya da kancası sökülmüş peygamber)."
  vahit_affedildi: "Sahtekâr Vahit affedildi."
  vahit_kacti: "İfşa edilen Vahit şehirden kaçtı (npc_gitti; hayatta)."
  yukselis_kapisi_acildi: "Yükseliş Kapısı açıldı: oyuncu geçecek, insanlık onu taşıyacak (son_yukselis sahnesi okuyabilir)."
  yukselis_kapisi_muhurlendi: "Yükseliş Kapısı mühürlendi ya da kırıldı."
  # ---- Deniz (Yükselenler dalı)
  deniz_rakip_oldu: "Deniz Yükselenler'in Beyaz Kalkanı olarak oyuncunun rakibi oldu (J'nin buyuk_ihanet'i okuyabilir)."
  deniz_kalkanin_oldu: "Oyuncu Deniz'in peşinden Tepe'ye çıktı; Beyaz Kalkan oyuncunun kalkanı oldu."
  # deniz_yukselenlerden_dondu: Parti F (flags/56) tanımlar; bu dosyadaki olaylar da aynı anlamda koyar (Deniz Yükselenler'i bıraktı; burada Sığınak'a geçer).
