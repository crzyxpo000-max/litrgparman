# Bölge olayları · Perde 3 (Bölüm 10, 11, 14) ve Perde 4 (Bölüm 18): events/75_bolge_p3a.yaml.
bayraklar:
  # ---- Bölüm 10 · Kule Dibi ----
  bl10_kaziklar_okundu: "Kadimlerin pirinç kazık halkasının geçidi körfezdeki gemiye döndürdüğü anlaşıldı."
  bl10_kazik_bukuldu: "Oyuncu halkanın bir kazığını büküp düğüm etti; halka eksik kaldı."
  bl10_kazik_kaydirildi: "Oyuncu bir kazığın bir adım kaydırılmasını istedi; geçit bir derece kaydı."
  bl10_cadir_tasindi: "Kazık halkası yüzünden yaşlı adamın çadırı bir blok öteye taşındı."
  # ---- Bölüm 11 · Kule Dibi / Batık Takımada (çan) ----
  bl11_can_alindi: "Kule Dibi pazarındaki Nehha çanı oyuncu tarafından satın alındı."
  bl11_can_el_konuldu: "Oyuncu Nehha çanına Lonca kurtarıcısının elinden el koydu."
  bl11_can_satildi: "Nehha çanı Kule Dibi pazarında başkasına satıldı."
  bl11_can_asildi: "Oyuncu Kule Dibi'nden getirdiği çanı Batık Takımada'daki kulesine geri astı."
  bl11_canlar_kaldi: "Batık Takımada'daki çan sökme işi durduruldu; çanlar kulelerinde (kırpıntılar uzak)."
  bl11_canlar_sokuldu: "Kurtarıcılar Batık Takımada'daki bir kulenin çanını söktü; kule boşaldı."
  # ---- Bölüm 11 · Kule Dibi (kırpıntı, hamallar) ----
  bl11_kirpinti_olduruldu: "Kule Dibi'ne sızan Hasat Kırpıntısı savaşta dağıtıldı."
  bl11_kirpinti_adlandi: "Kule Dibi'ndeki Hasat Kırpıntısı kimsenin olmayan bir adla dindirildi."
  bl11_hamal_ucreti: "Kule hamallarının kat başı ücreti oyuncunun baskısıyla beş bakıra çıktı."
  bl11_tuz_anlasildi: "Kule'den indirilen tuzun hasat edilmiş Nehha seviyelerinin kalıntısı olduğu anlaşıldı."
  # ---- Bölüm 11 · Sanayi (tuz kazanı) ----
  bl11_tuz_kazani_kapandi: "Sanayi'deki tuz kazanlarının ateşi söndürüldü."
  bl11_tuz_kazani_loncada: "Tuz kazanlarına Lonca adına el konuldu; kalıplar avcılara tayın oldu."
  bl11_tuz_anlatildi: "Oyuncu boyahanenin kuyruğuna tuzun ne olduğunu anlattı."
  # ---- Bölüm 11 · Kordon / Pirinç Kervan / üs (Tavvar ailesi) ----
  bl11_katip_pulu: "Kordon'daki Tavvar kâtip oyuncuya Kervan'daki ailesini emanet eden pulu verdi."
  bl11_kutuk_denizde: "Kâtibin Dünya kütüğü pulları denize saçıldı."
  bl11_kutuk_bos: "Oyuncunun dağıttığı ekmek yüzünden o gün kütüğe kimse ad yazdırmadı."
  bl11_adin_kutukte: "Oyuncu adını Tavvar kâtibin kütüğüne yazdırmayı denedi; pul adı taşıyamadı."
  bl11_aile_kacti: "Karşı ağırlığa saklanan Tavvar aile Kervan'dan geçide kaçırıldı."
  bl11_aile_yakalandi: "Karşı ağırlığa saklanan Tavvar aile gümrük muhafızlarına yakalandı."
  bl11_tavvar_aile_kaldi: "Kaçan Tavvar aile Sığınak'ta (Gümrük) kaldı."
  bl11_tavvar_aile_dondu: "Kaçan Tavvar aile Kervan'a geri gönderildi."
  # ---- Bölüm 11 · Eski Şehir (hamam) ----
  bl11_hamam_korundu: "Eski Şehir hamamındaki Sönük Nehha kadın avcılardan korundu."
  bl11_hamam_avlandi: "Hamamdaki Sönük kadın avcılara bırakıldı; Sistem ödülü onaylamadı."
  bl11_hamam_kadini_eve: "Oyuncu hamamdaki Nehha kadını Batık Takımada'ya götürmeye söz verdi."
  bl11_ilan_silindi: "Mert seviyesiz varlık ilanını Lonca'nın ilan tahtasından sildi."
  # ---- Bölüm 11 · üs (soluk hasta) ----
  bl11_soluk_kurtuldu: "Rengi çekilen hasta adı söylenerek (ya da oyuncunun penceresinde) kurtarıldı."
  bl11_soluk_yarim: "Rengi çekilen hasta omuzlarına kadar gri kalarak yaşadı."
  bl11_soluk_kayboldu: "Ayrı odaya alınan soluk hasta kırpıntıya dönüşüp kayboldu."
  # ---- Bölüm 11 · saha kampı (Deniz) ----
  bl11_deniz_kamp_birlikte: "Kule Dibi kampında Deniz'e geçitten birlikte geçme sözü verildi."
  bl11_deniz_kamp_durust: "Kule Dibi kampında Deniz'e herkesin kurtarılamayacağı söylendi."
  # ---- Bölüm 14 · Kule Dibi / Tepe / üs ----
  bl14_sahte_takvim: "Kule Dibi'nde satılan takvime oyuncu sahte bir buluşma ekletti."
  bl14_takvim_yakildi: "Oyuncu Kule Dibi'nde takvim destelerini yaktı."
  bl14_cevap_cekirdekten: "Gemiye verilen ışık cevabının Kasaba Çekirdeği'nin karşısındaki otel çatısından geldiği görüldü."
  bl14_gemiye_yanlis_gun: "Oyuncu rasathaneden Kadim gemisine yanlış bir gün yolladı."
  bl14_defter_yakildi: "Rasathanedeki gökbilimcinin ışık defteri yakıldı."
  bl14_mektup_kusuru: "Oyuncunun el yazısıyla yazılmış sahte mektuptaki kusur (ğ harfi) bulundu."
  bl14_mektup_duyuruldu: "Sahte mektubun kopyaları dört kampa önceden yollandı."
  bl14_mektup_yakildi: "Sahte mektup yakıldı, kimseye söylenmedi."
  bl14_aras_kamp_zirve: "Kule Dibi kampında Aras'a zirveye sandalyeyle çıkılmayacağı söylendi."
