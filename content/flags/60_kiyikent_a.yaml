# Parti G — Perde 2 Kıyıkent: Liman, Kordon, Eski Şehir (events/60_kiyikent_a.yaml) bayrakları.
# Okunan ortak bayraklar (00_sozlesme): cekirdek_*, kordon_dustu, kordon_kurtarildi, kule_acik, yanki_gorundu.
# Parti A'nın vapur_dogrultuldu bayrağı okunur ve ayrıca liman_yan_yatmis_vapur'da set edilir (aynı anlam).
bayraklar:
  # ---- Kayıplar Duvarı / saklanan adam
  kayip_koca_yasiyor: "Kayıplar Duvarı'ndaki balıkçının gizli satırı okundu: yaşıyor ve saklanıyor."
  kayip_duvar_okundu: "Kayıplar Duvarı'nın tamamı herkesin önünde okundu (Toplu Analiz, açığa vurma)."
  kayip_umut_verildi: "Gişe yelekli kadına satır okunmadan umut verildi."
  kayip_balikhaneye: "Gişe yelekli kadın balıkhanedeki kayıt satıcılarına gönderildi."
  kayip_gercek_soylendi: "Kadına kocasının yaşadığı ve saklandığı söylendi."
  kayip_yarim_gercek: "Kadına yalnızca kocasının yaşadığı söylendi."
  kayip_olu_dendi: "Kadına yaşayan kocasının öldüğü söylendi."
  kayip_soz: "Kadına kocasını bulup getirme sözü verildi (duvardaki_isim görevi)."
  deniz_annesi_bildi: "Deniz öldüyse: annesine Kayıplar Duvarı'nda son anı anlatıldı."
  deniz_annesi_bekliyor: "Deniz öldüyse: annesine 'Öğretici'de kaybolduk' yalanı söylendi; hâlâ bekliyor."
  mektup_kadin_geldi: "Saklanan balıkçıyla buluşmaya karısı da getirildi."
  kayip_aile_birlesti: "Saklanan balıkçı ([Ölüden Alan] unvanıyla ya da Yankı'nın maskesiyle) karısına döndü."
  kayip_maske: "Balıkçının görünür unvanı Yankı'ya yedirilerek örtüldü."
  kayip_koca_secti: "Balıkçıya karısının fotoğrafı verildi, karar ona bırakıldı."
  kayip_koca_birakildi: "Balıkçı rıhtımda bırakıldı; karısına öldüğü söylendi."
  # ---- Balıkhane karaborsası
  balikhane_goruldu: "Balıkhane karaborsasına girildi (olay görüldü; tohum koşulu)."
  balikhane_korkutuldu: "Kantarcı gösterişle korkutuldu; Mezat Sesi yanılsaması düştü."
  balikhane_kapatildi: "Balıkhane karaborsası kapatıldı (zorla, açığa vurarak ya da sonradan)."
  balikhane_kayit_defteri: "Balıkhanede satılan her ölü kristalinin sahibinin adı deftere ve panoya yazılıyor."
  balikhane_ele_gecirildi: "Oyuncu balıkhaneyi kendine aldı."
  balikhane_ortak: "Oyuncu kantarcıyla onda üç paya ortak oldu."
  balikhane_pay: "Oyuncu balıkhaneden pay alıyor (ortaklık ya da sahiplik)."
  balikhane_ihbar_lonca: "Balıkhane Lonca'ya ihbar edildi; Lonca vergilendirdi."
  balikhane_ihbar_siginak: "Balıkhane Konsey'e ihbar edildi; mühürlendi, oylama bekliyor."
  balikhane_ihbar: "Balıkhane bir fraksiyona ihbar edildi (Lonca ya da Konsey)."
  balikhane_stok_hastanede: "Kapanan balıkhanenin iksirleri Konsey hastanesine taşındı."
  balikhane_dalgiclara: "Kapanan balıkhanenin stokları satılıp parası dalgıçlara dağıtıldı."
  balikhane_dalgic_mezar: "Dalgıçlara ölüleri gömmek için sudan çıkarma işi verildi."
  # ---- Akşam vapuru
  vapur_lonca: "Doğrultulan vapur Lonca'ya verildi (kapılara avcı taşır)."
  vapur_siginak: "Doğrultulan vapur Konsey'e verildi (erzak seferi)."
  vapur_halk: "Doğrultulan vapur kaptana verildi; biletsiz, herkese açık."
  vapur_oyuncu: "Doğrultulan vapurun tarifesini oyuncu yazıyor."
  vapur_sefer_tamam: "Vapurun adalara ilk seferi tamamlandı."
  # ---- Karantina gemisi
  karantina_patlayici_atildi: "Karantina gemisini batıracak patlayıcılar denize atıldı ya da emir iptal edildi."
  karantina_korundu: "Karantina gemisi rıhtımda beklenerek korundu."
  karantina_tasindi: "Karantina gemisi adaların koyuna çekildi."
  karantina_triyaj: "Karantina gemisinde triyaj: 28 kişi indi, en kötü üçüyle gemi battı."
  karantina_batti: "Karantina gemisi hastalarla birlikte batırıldı."
  karantina_bir_cocuk: "Yankı bir çocuğun kristalini yedi; oyuncu onu orada durdurdu."
  karantina_herkes_yanki: "Yankı karantina gemisindeki otuz bir hastanın kristalini yedi."
  # ---- Konteyner labirenti / Çakallar
  konteyner_uyarildi: "Konteyner limanında herkes taklitçiye karşı uyarıldı."
  konteyner_lonca_tuzak: "Lonca ekibi bilerek taklitçi konteynere yönlendirildi."
  cakallar_tanisildi: "Genç kapı avcısı ekibi Çakallar'la tanışıldı."
  cakallar_hafife_aldi: "Çakallar oyuncuyu taşıyıcı sandı."
  cakallara_sandik: "Konteyner limanındaki ikmal sandığı Çakallar'a bırakıldı."
  cakallar_tasiyici: "Hamam kapısında Çakallar'a taşıyıcı olarak katılındı (gizle)."
  cakallar_onunde: "Hamam kapısında gerçek seviye gösterilip Çakallar'ın önünde girildi."
  cakallar_ihbar: "Hamamdaki kapı Lonca'ya ihbar edildi; Çakallar kapıyı kaybetti (sonra Lonca'ya katıldılar)."
  cakallar_ogrendi: "Çakallar göbek taşını oyuncunun yönlendirmesiyle kendileri devirdi."
  cakallar_ganimet_onlarda: "Hamam kapısının ganimeti tamamen Çakallar'a bırakıldı."
  cakallar_sancakta: "Çakallar oyuncunun sancağının altına girdi (ordu)."
  # ---- Kordon: taşmadan önce
  kordon_tahliye: "Taşmadan önce Kordon (kısmen) boşaltıldı."
  kordon_balikci_ikna: "Kordon'un en yaşlı balıkçısı ikna edildi; kafesiyle taşındı."
  kordon_zorla_tahliye: "Kordon'dan gitmek istemeyenler zorla çıkarıldı."
  kordon_barikat: "Taşmadan önce mendireğe barikat kuruldu."
  kordon_muhur_yumruklandi: "Kordon kapısının mührü yumruklandı (Sistem kaydı)."
  # ---- Fener Balığı Ana / yavrular / fenerin sesi
  fenerci_olduruldu: "Fener Balığı Ana öldürüldü (kordon_fener_baligi ya da vapur_ilk_sefer)."
  fener_yumurtalar_ezildi: "Fener Balığı Ana'nın yumurtaları ezildi."
  fener_yumurtalar_birakildi: "Fener Balığı Ana'nın yumurtalarına dokunulmadı (fener_yavrulari tohumu)."
  fener_yumurtalar_alindi: "Fener Balığı Ana'nın yumurtalarından bir avuç alındı (fener_yavrulari tohumu)."
  fener_yavrulari_bagli: "Fener yavruları oyuncuya bağlandı (ordu)."
  fener_kayit_mertte: "Fenerin geri sayım kaydı Mert'e bırakıldı."
  fener_cevap_verildi: "Fenerin ikinci, küçük harfli sesine cevap verildi ('geç kaldın')."
  fener_kirildi: "Fenerdeki Sistem penceresi Yankı'nın isteğiyle kırıldı."
  fener_yukselenlere: "Fenerin sesi Yükselenler'e 'Sistem'in sesi' diye bildirildi."
  # ---- Kordon: taşmadan sonra
  balkon_oglu_bildi: "Balkondaki yaşlı kadına Öğretici'den dönmeyen oğlunun öldüğü söylendi."
  balkon_tasindi: "Düşmüş Kordon'un son sakini balkonundan indirildi."
  balkon_sokak_temiz: "Düşmüş Kordon'da balkonun sokağı tek başına temizlendi (bölge içinde bir ada)."
  balkon_yavru_kaldi: "Kurtarılan Kordon'da kıskaç yavrusu yaşlı kadınla kaldı."
  heykel_isimler: "Kordon'daki heykelin yüzü silinip taşma ölülerinin adları kazındı."
  heykel_kabul: "Kordon'daki heykel kabul edildi; oyuncu yanında durdu."
  heykel_sunak: "Kordon'daki heykelin önüne Yükselenler'in sunağı kuruldu."
  heykel_yikildi: "Kordon'daki heykel bitmeden indirildi."
  olu_bolge_kasa: "Düşmüş Kordon'daki otel seferinde önce Lonca'nın kasasına gidildi."
  olu_bolge_ikisi: "Düşmüş Kordon'daki otelden hem insanlar hem kasa tek başına çıkarıldı."
  olu_bolge_gec: "Otel kasasından pay alındıktan sonra çatıya geç kalındı; bir kişi öldü."
  olu_bolge_herkes: "Otelin çatısındaki on iki kişinin on ikisi de indirildi."
  # ---- Eski Şehir: fırın ve seviye birler
  ekmek_kural_kirildi: "Kasaba Çekirdeği'nin kural penceresi fırının önünde yetkisizce parçalandı."
  ekmek_kurali_cocuk: "Çekirdek oyuncunun: ilk kural 'on dört yaşından küçüklere ekmek ücretsiz'."
  ekmek_kurali_sert: "Çekirdek oyuncunun: ilk kural 'hırsızlık: bir ay kapı hamallığı'."
  ekmek_firin_buyudu: "Eski Şehir'in taş fırınına ikinci bir ağız açıldı."
  seviye_birler_ders: "Seviye birlere meslek seviyesinin tavanı olmadığı öğretildi."
  seviye_birler_vurus: "On dört yaşındaki öğrenciye bir canavar tutularak ilk öldürmesi yaptırıldı."
  seviye_birler_korunuyor: "Seviye birlerin okulunun kapısına oyuncunun adı yazıldı."
  seviye_birler_mahzen_bos: "Yükselenler'in seviye sattığı mahzen boşaltıldı."
