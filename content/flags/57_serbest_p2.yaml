# Serbest günler · Perde 2 (events/57_serbest_p2.yaml) bayrakları: Bölüm 6 ve Bölüm 9 üs olayları.
bayraklar:
  # ---- Bölüm 6 · Deniz: balkon listesi
  sb6_deniz_soz: "Deniz'e taşma günü Kordon balkonlarındaki her çocuğu indirme sözü verildi."
  sb6_deniz_durust: "Deniz'e herkesi kurtaramayabileceği dürüstçe söylendi."
  sb6_deniz_kardes_konustu: "Deniz'le balkon listesinin başındaki kardeş satırı üstüne konuşuldu."
  # ---- Bölüm 6 · Kaya: mendirekte talim
  sb6_kaya_cocuk_eve: "Kaya'nın hattındaki on altı yaşındaki gönüllü, annesini Kordon'dan indirmeye ikna edildi."
  sb6_kaya_cocuk_hatta: "On altı yaşındaki gönüllü ikna edilemedi; Kaya'nın ön safında kaldı."
  sb6_kaya_on_saf: "Oyuncu Kaya'nın hattında ön safta duracağına söz verdi."
  sb6_kaya_gosteri: "Oyuncu Kaya'nın yüz kişilik hattının hücumunu kıpırdamadan karşıladı (gösteriş)."
  # ---- Bölüm 9 · Elif: uyku ilacı
  sb9_elif_baba_ikna: "Uyku ilacı isteyen altı numaralı yataktaki baba ikna edildi; reçeteyi verdi."
  sb9_elif_baba_gitti: "Altı numaralı yataktaki baba ikna edilemedi; gece Liman'a yürüyüp gitti."
  sb9_elif_ilac_dagitildi: "Elif uyku ilaçlarını yarım dozla, herkese bir gecelik dağıttı."
  sb9_elif_stok_kilit: "Elif ilaç dolabını kilitledi; anahtar oyuncuda."
  # ---- Bölüm 9 · Mert: yedi ışığın kaydı
  sb9_mert_log_silindi: "Mert'in yedi ışık kaydındaki oyuncuya ait satırlar silindi."
  sb9_mert_log_paylasildi: "Mert yedi ışık kaydını tutmayı sürdürüyor; bir kopyası oyuncuda."
  sb9_mert_yem: "Mert ile yan yatmış vapurun direğine oyuncunun izini taşıyan bir yem verici kuruldu."
  sb9_mert_yem_bozuldu: "Yem verici fazla güçlü çıktı; yedi ışık bir anlığına Liman'a döndü."
  # ---- Bölüm 9 · Yan zincir: mendirekteki fener
  sb9_ayna_fener_alindi: "Mendirekteki kızın el feneri oyuncu tarafından alındı."
  sb9_ayna_izledi: "Oyuncu mendirekteki kızın yanında oturup ışıkların cevabını birlikte izledi."
  sb9_ayna_sen: "Oyuncu kızın feneriyle ışıklara mana işareti verdi; yedi ışık birden cevap verdi."
  sb9_ayna_gercek: "Işıkların şehri okuyup tekrarladığı (babası olmadığı) kıza ya da kalabalığa söylendi."
  sb9_ayna_umut: "Kıza gerçek söylenmedi; ışığın babası olduğuna inanmayı sürdürüyor."
  sb9_ayna_yanki: "Yankı mendireğin üstünü ışıklardan sakladı; kızın işaretine artık cevap gelmiyor."
  sb9_ayna_korundu: "Yurdun kapısına dayanan kalabalık konuşarak dağıtıldı; kız korundu."
  sb9_ayna_kirik: "Kalabalık dağıtılamadan yurdun camı kırıldı; kız kömürlüğe saklandı."
  sb9_ayna_yasak: "Mendirekte ışık yakmak yasaklandı; fenerler toplandı."
  sb9_ayna_panel: "Oyuncu Çekirdek'ten bütün panellere 'ışıklar herkesi okuyor' satırını yazdı."
  sb9_ayna_birlikte: "Son gece kızla feneri birlikte tutup ışıklara işaret verildi."
  sb9_ayna_saklandi: "Kıza ışıklar indiği gün fenerini saklaması söylendi."
  sb9_ayna_gorev: "Kıza ışıklar indiği gün vapur düdüğü işaretiyle insanları ambarlara çağırma işi verildi."
  sb9_ayna_bitti: "Mendirekteki fener zinciri tamamlandı."
  sb9_ayna_deniz: "Deniz mendirekteki kıza o sabah vapurda olduğunu ve düdüğü duyduğunu anlattı."
  sb9_ayna_aras: "Yurdun kapısındaki kalabalığı Aras zorla dağıttı."
  sb9_ayna_deniz_anlatti: "Son gece Deniz kıza babasının vapuru nasıl yanaştırdığını anlattı."
  # ---- Ek seçimler ve devam olayları
  sb6_deniz_ilk_sayfa: "Oyuncu ateş başındaki sözünü hatırlatıp Deniz'in listesinin ilk sayfasını (kardeş) kendi işi saydı."
  sb6_kaya_emir: "Oyuncu Lonca halkasıyla Kaya'nın hattına emir verip oğlanı hattan çıkardı."
  sb9_elif_ayiklandi: "Oyuncu uyku kuyruğunu tek tek dinleyip gerçekten ilaca ihtiyacı olan yedi kişiyi ayırdı."
  sb9_mert_korundu: "İşaretlenmiş Mert o gece oyuncunun yanında kaldı."
  sb6_liste_lonca: "Deniz'in Kordon balkon listesi Kaya'ya (Lonca hattına) verildi."
  sb6_liste_konsey: "Deniz'in Kordon balkon listesi Konsey'e (Elif'in tahliye planına) verildi."
  sb6_liste_biz: "Yürüyemeyen dokuz kişiyi taşma sabahı oyuncu ve Deniz kendileri taşıyacak."
  sb6_liste_harita: "Deniz'in listesi kampların ortak taşma haritasına işlendi."
  sb6_anne_siginak: "Ön saftaki oğlanın annesine Sığınak'ta yatak bulundu."
  sb6_anne_kaya: "Oğlanın hatta kalıp kalmayacağı kararı Kaya'ya bırakıldı."
  sb6_anne_sedye: "Oğlanın annesi (eski ameliyathane hemşiresi) hattın arkasındaki çadıra alındı."
  sb9_elif_sabah_nobet: "Elif uyurken koğuşa oyuncu baktı."
  sb9_elif_sabah_ambar: "Elif'le ambarlar dolaşılıp gemi günü için hasta yerleşimi çıkarıldı."
  sb9_elif_sabah_cati: "Gümrük'ün çatısında Elif oyuncunun omzunda bir saat uyudu."
  sb9_ag_uyarildi: "Sessiz Ağ uyarıldı; ışıklar dinlediği için yayın kesildi."
  sb9_ag_yanlis_veri: "Mert ile Sessiz Ağ frekansından ışıklara sahte trafik basılıyor."
  sb9_ag_sir: "Işıkların Sessiz Ağ frekansını dinlediği Mert ile oyuncu arasında sır kaldı."
