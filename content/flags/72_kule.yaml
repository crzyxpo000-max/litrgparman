bayraklar:
  # ---- Kat 10 · Vapur
  kule_kayit_durduruldu: "Kat 10: İskele kaydı bir saniyeliğine durduruldu; gri yolculara bir an verildi."
  kule_kayit_okundu: "Kat 10: Aktarım Bekçisi'nin pencerelerinden Kule'nin dizini okundu (Kat 11+ önceki kayıtlar)."
  # ---- Kat 20 · Fener
