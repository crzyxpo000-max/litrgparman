  # ---- Kat 100 · Zirve
  kule_zirve_hayir: "Kat 100: İlk Pencere düğmesiz bir hayırla, elle kapatıldı."
  kule_dongu_sayisi: "Kat 100: Döngü sayacının kapalı rakamı (7) ve altındaki sayılamayan deneme yığını okundu."
