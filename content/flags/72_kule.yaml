  kule_thessar_sorusu: "Kat 80: Oyuncu, Thessar'a ırkının bir zamanlar bir Katman olduğunu soracağına yemin etti."
  # ---- Kat 90 · Taslak
  kule_yanki_secti: "Kat 90: Yankı'ya önceki taşıyıcısıyla kalmak isteyip istemediği soruldu; Yankı oyuncuyu seçti."
