  kule_kadina_soz: "Kat 40: Donmuş kadına \"Ben bitireceğim\" diye söz verildi."
  kule_rozet_alindi: "Kat 40: Donmuş kadının \"bu sefer\" rozeti alındı."
  kule_kum_saati: "Kat 40: Saat Ustası'nın kum saati çevrildi; son tanecik Gün 0."
  # ---- Kat 50 · Eşik
  kule_esik_gomuldu: "Kat 50: Eşik Muhafızı gömüldü; yamaçta bir mezar taşı var."
