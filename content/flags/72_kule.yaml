  # ---- Kat 60 · Yanık arşiv
  kule_dosyalar_kurtarildi: "Kat 60: Yanan arşivden dosyalar kurtarıldı."
  kule_son_sayfa_yirtildi: "Kat 60: Oyuncunun kendi dosyasının son sayfası yırtılıp yakıldı."
  kule_son_sayfa_saklandi: "Kat 60: Oyuncunun kendi dosyasının son sayfası (\"Taşıyıcı devredildi\") saklandı."
  kule_tasiyici_izi: "Kat 60: \"Taşıyıcı hariç\" satırının izi doksanıncı kata kadar sürüldü."
  # ---- Kat 70 · Tohumluk
  kule_tohumluk_uyandi: "Kat 70: Bir önceki döngüden bir Kıyıkentli kozasından uyandırılıp aşağı gönderildi."
  kule_tohumluk_adlandi: "Kat 70: Kıyıkent kozalarına ad yazıldı."
  kule_damar_izlendi: "Kat 70: Kozalardaki Öz damarlarının zirveyi beslediği görüldü."
  # ---- Kat 80 · Ters gök
  kule_kabul_damgasi: "Kat 80: Gök Gözcüsü'nün erken kabul damgası alındı (Kadimler'e yakınlık)."
