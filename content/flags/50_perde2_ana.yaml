# Parti A — Perde 2 ana yay (events/50_perde2_ana.yaml) bayrakları. Ortak bayraklar 00_sozlesme.yaml'dadır.
bayraklar:
  # ---- perde2_donus
  donus_iskele_kurtarildi: "Dönüş günü iskeleden suya düşenler çıkarıldı (dalarak, ip tutarak ya da gizlice)."
  donus_liman_yaratigi: "Dönüş günü Liman Kancası herkesin gözü önünde sudan çekildi ya da leşi iskeleye fırlatıldı."
  donus_gizlendi: "Dönüş günü yardım gizlice yapıldı; bir balıkçı gördü ve sustu."
  kayip_duvari_not: "Terminaldeki Kayıp Duvarı'na not bırakıldı (cevap tohumu: kayip_duvari_cevap)."
  deniz_anildi: "Deniz öldüyse: dönüş günü yan yatmış vapurun yanında anıldı."
  deniz_donuste_bulundu: "Öğretici'de hiç bulunamayan Deniz, dönüşte Kayıp Duvarı'ndaki martıyla bulundu (deniz_bulundu da konur)."
  # ---- kule_yukselisi
  kule_siviller_korundu: "Kule yükselirken çöken balkonların ve cephenin altındakiler kurtarıldı."
  kule_cephe_tutuldu: "Kule yükselirken devrilen dört katlı cephe oyuncunun sırtında tutuldu (gemi_bakis geri çağrısı)."
  kule_ilk_adim: "Kule'ye ilk adım atıldı (İlk unvanı; bütün gezegen duyurusu)."
  kule_kapi_nobeti: "Haberci devrildikten sonra Kule kapısında nöbet tutulup giren herkes uyarıldı."
  kule_gizli_tirmanis: "Kule'ye gece, taşa dokunmadan, kimse görmeden girildi."
  # ---- fraksiyon_secimi
  secim_dort_masa: "Fraksiyon seçiminde dört lider aynı masaya oturtuldu; oyuncu hiçbirine katılmadan ateşkes kurdu."
  lonca_kordon_hatti: "Kaya, Kordon kapısı için oyuncuya Lonca'nın yüz kişilik hattını verdi."
  # ---- ilk_tasma
  tasma_apartman: "Taşmada sahildeki Mavi Apartman'daki altmış kişi tahliye edildi."
  tasma_tekne: "Taşmada Sığınak'ın iskeledeki hastane teknesi kurtarıldı."
  tasma_komuta: "Taşmada dört kampa birden emir verildi; şehir tek bir el gibi çalıştı."
  # ---- yanki_ortaya_cikis
  yanki_sahiplenildi: "Yankı bütün şehre göründüğünde oyuncu onu açıkça sahiplendi (İki Sesli)."
  yanki_inkar_edildi: "Yankı'nın yayını 'Sistem arızası' diye inkâr edildi."
  yanki_susturuldu: "Yankı'nın yayını oyuncunun iradesiyle bastırıldı."
  # ---- sistem_gercegi
  baslik_tanikli: "Başlığa inerken bir tanık on birinci basamağa kadar geldi; gördüğünü anlattı."
  # ---- dikkat eşikleri
  dikkat75_kurban: "Perde 2 düzeltmesi Yankı'nın yardımıyla sokakta uyuyan bir adama yıkıldı."
  # ---- tohum olayları
  vapur_dogrultuldu: "Yan yatmış yedi kırk vapuru kaptanla birlikte doğrultuldu."
  kule_baba_kurtarildi: "Kule'nin 7. katında sıkışan baba kurtarıldı; kızı kapıda bekliyordu."
