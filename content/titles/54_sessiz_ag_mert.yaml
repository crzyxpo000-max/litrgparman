# Parti D (Aşama 7) — Sessiz Ağ zinciri unvanları. (Mert'in kişisel ödülü "arka_kapi" titles.yaml'dadır.)
kaynak_avcisi:
  ad: { tr: "Kaynak Avcısı", en: "Source Hunter" }
  aciklama: { tr: "Bir kapının çekirdeğine indin ve Sistem'in kendi bekçisinin elinden çıplak kodu aldın. Sistem bunu bir hata olarak kaydetti.", en: "You went down into a Gate's core and took raw code out of the System's own guard's hands. The System logged it as a bug." }
  nadirlik: "epik"
  bonus: { int: 3, per: 2, wil: 1 }
satir_okuyan:
  ad: { tr: "Satır Arası Okuyan", en: "Reads Between the Lines" }
  aciklama: { tr: "Kule'nin iki katı arasındaki kodu okudun. Artık hiçbir bildirimi yalnızca yazdığı kadar okumuyorsun.", en: "You read the code hidden between two of the Spire's floors. Now you never read a notice for just what it says." }
  nadirlik: "efsanevi"
  bonus: { int: 4, wis: 3, per: 3 }
kok_bekcisini_kiran:
  ad: { tr: "Kök Bekçisini Kıran", en: "Root Breaker" }
  aciklama: { tr: "Sistem'in kaynağını koruyan son bekçiyi devirdin ve arkasındaki kapıyı açık bıraktın. Hiçbir bildirim bunu duyurmadı; duyurmaya cesaret edemedi.", en: "You brought down the last warden guarding the System's source and left the door behind it open. No notice announced it. Nothing dared." }
  nadirlik: "mitik"
  bonus: { int: 6, wil: 5, per: 4, wis: 4 }
