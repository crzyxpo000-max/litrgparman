# Parti C unvanları (Yükselenler zinciri, Vahit'in yayı).
secilmislerin_secilmisi:
  ad: { tr: "Seçilmişlerin Seçilmişi", en: "Chosen of the Chosen" }
  aciklama: { tr: "Bir peygamber sana kendi cübbesini giydirdi. Tepe'de senden yukarıda yalnızca gök var; gökte de kimse yok.", en: "A prophet put his own robe on your shoulders. On the hill there's nothing above you but the sky, and there's nobody in the sky." }
  nadirlik: "epik"
  bonus: { cha: 4, wil: 3, wis: -1 }
ocak_kirici:
  ad: { tr: "Ocak Kırıcı", en: "Kiln Breaker" }
  aciklama: { tr: "Yakıttan doğan ağzı yendin ya da Ocak'ı söndürdün. Yükselenler adını bir lanet gibi fısıldıyor.", en: "You beat the mouth born from fuel, or put out the Kiln. The Ascended whisper your name like a curse." }
  nadirlik: "epik"
  bonus: { wil: 3, end: 2 }
  itibar_tavani: { yukselenler: 30 }
kendi_yakiti:
  ad: { tr: "Yanmayan", en: "The Unburnable" }
  aciklama: { tr: "Ocak seni iki kez tartıp iki kez geri tükürdü. Sistem sana sahip olamıyor; bunu herkes gördü.", en: "The Kiln weighed you twice and spat you out twice. The System can't own you, and everyone saw it." }
  nadirlik: "efsanevi"
  bonus: { end: 5, wil: 3 }
sesin_ta_kendisi:
  ad: { tr: "Sesin Ta Kendisi", en: "The Voice Itself" }
  aciklama: { tr: "Bir peygamber yıllarca bir sesi bekledi. Sonunda o ses sen oldun.", en: "A prophet spent years waiting for a voice. In the end, the voice was you." }
  nadirlik: "efsanevi"
  bonus: { wil: 5, cha: 5, wis: -2 }
  itibar_tavani: { siginak: -30 }
maskeyi_indiren:
  ad: { tr: "Maskeyi İndiren", en: "Unmasker" }
  aciklama: { tr: "Bir peygamberin maskesini indirdin ve altındaki yüze baktın. Hangisinin daha korkunç olduğunu hâlâ bilmiyorsun.", en: "You pulled down a prophet's mask and looked at the face underneath. You still don't know which one was scarier." }
  nadirlik: "nadir"
  bonus: { per: 3, wis: 2 }
