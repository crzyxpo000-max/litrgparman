# Parti K1 — Perde 4 unvanları.
kiyikent_kalkani:
  ad: { tr: "Kıyıkent'in Kalkanı", en: "Shield of Port Harlow" }
  aciklama: { tr: "Kadim istilasını bir şehrin önünde durdurdun. O şehrin çocukları adını bir sokak adı gibi ezbere biliyor.", en: "You stopped the Ancient invasion in front of a whole city. The kids there know your name by heart, like a street name." }
  nadirlik: "mitik"
  bonus: { end: 15, wil: 15, cha: 10 }
vali_deviren:
  ad: { tr: "Valiyi Deviren", en: "Prefect-Breaker" }
  aciklama: { tr: "Bin dünyayı biçmiş bir Hasat Valisi'ni yere indirdin. Zırhındaki boş satır boş kaldı.", en: "You put down a Harvest Prefect that had reaped a thousand worlds. The blank line on its armor stayed blank." }
  nadirlik: "mitik"
  bonus: { str: 15, agi: 10, wil: 10 }
  ilk: true
antlasmanin_imzasi:
  ad: { tr: "Antlaşmanın İmzası", en: "The Signatory" }
  aciklama: { tr: "Dünya'yı Kadimler'e bağlayan antlaşmanın altında senin adın var. Bazıları bunu kurtuluş diye anıyor, bazılarıysa hiç anmıyor.", en: "Your name is at the bottom of the treaty that bound Earth to the Ancients. Some people call it salvation. Some won't say it at all." }
  nadirlik: "efsanevi"
  bonus: { cha: 15, wis: 10 }
cekirdege_ilk_inen:
  ad: { tr: "Çekirdeğe İlk İnen", en: "First Into the Core" }
  aciklama: { tr: "Sistem Çekirdeği'nin köküne ayak basan ilk insan sensin. Sistem bu unvanı verirken bir saniye gecikti.", en: "You're the first human to set foot at the root of the System Core. The System hesitated for a second before it handed this one out." }
  nadirlik: "mitik"
  bonus: { int: 15, wis: 15, wil: 10 }
  ilk: true
son_kapiyi_kapatan:
  ad: { tr: "Son Kapıyı Kapatan", en: "Last Gate Closer" }
  aciklama: { tr: "Dünya'da açılan son S kademe Kapı'yı sen kapattın. İlk Kapı'yı kim kapatmış olursa olsun, bu yılın kitabını kapatan sensin.", en: "You closed the last S-Grade Gate to open on Earth. Whoever closed the first one, you closed the book on this year." }
  nadirlik: "efsanevi"
  bonus: { str: 10, end: 10, per: 10 }
  ilk: true
zirvedeki:
  ad: { tr: "Zirvedeki", en: "Top of the Board" }
  aciklama: { tr: "Küresel Sıralama'nın tepesinde artık kimse sana meydan okumuyor. Son meydan okuyan, sonucunu herkesin önünde gördü.", en: "Nobody challenges you for the top of the Global Ranking anymore. The last one who tried got the result in front of everybody." }
  nadirlik: "efsanevi"
  bonus: { agi: 10, per: 10, cha: 10 }
makasi_kiran:
  ad: { tr: "Makası Kıran", en: "Shear-Breaker" }
  aciklama: { tr: "Kadim Meclisi bir sapmayı kesmek için makasını gönderdi. Makas eksik döndü.", en: "The Ancient Conclave sent its shears to cut a deviation. The shears came back short." }
  nadirlik: "mitik"
  bonus: { str: 10, agi: 10, end: 10, wil: 10 }
