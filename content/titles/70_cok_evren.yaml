# Parti I — Çok-evren unvanları (titles.yaml biçimi: düz eşlem).
ilk_katman_gezgini:
  ad: { tr: "İlk Katman Gezgini", en: "First Layer-Walker" }
  aciklama: { tr: "Kule'nin ellinci katının ardındaki geçitten başka bir dünyaya adım atan ilk insansın. Sistem bunu bütün gezegene duyurdu; bazıları sevindi, çoğu korktu.", en: "You're the first human to step through the gate behind the Spire's fiftieth floor into another world. The System announced it to the whole planet. Some people cheered. Most of them got scared." }
  nadirlik: "efsanevi"
  bonus: { per: 12, wil: 12, agi: 8 }
  ilk: true
basakci_kiran:
  ad: { tr: "Başakçı'yı Kıran", en: "Gleaner-Breaker" }
  aciklama: { tr: "Hasat edilmiş bir dünyanın dibinde, Hasat'ın geride bıraktığı son şeyi yendin. Batık Takımada'nın çanları artık senin adını çalıyor.", en: "At the bottom of a harvested world, you put down the last thing the Harvest left behind. The bells of the Drowned Reach ring your name now." }
  nadirlik: "efsanevi"
  bonus: { str: 15, end: 15, wil: 10 }
muhur_kiran:
  ad: { tr: "Mühür Kıran", en: "Sealbreaker" }
  aciklama: { tr: "Dört yüz yıllık Boyun Senedi'ni bekçisiyle birlikte kırdın. Pirinç Kervan özgür; özgürlüğün bedelini de artık kendisi ödeyecek.", en: "You broke a four-hundred-year-old Neckbond and the thing guarding it. The Brass Caravan is free, and now it gets to pay for its own freedom." }
  nadirlik: "efsanevi"
  bonus: { str: 10, int: 15, cha: 10 }
senet_koruyucu:
  ad: { tr: "Senedin Koruyucusu", en: "Keeper of the Bond" }
  aciklama: { tr: "Pirinç Kervan'ın Boyun Senedi'ni isyana karşı korudun. Kadimler bunu not etti; Tavvarlar ise unutmayacak.", en: "You protected the Brass Caravan's Neckbond from the uprising. The Ancients took note. The Tavvari won't forget either." }
  nadirlik: "epik"
  bonus: { end: 12, wil: 12 }
yedinci_koltuk:
  ad: { tr: "Yedinci Koltukta Oturan", en: "Who Sat the Seventh Seat" }
  aciklama: { tr: "Yedi Taht'ın boş koltuğuna oturdun ve bir dünyanın bütün seviyelerinin derinin altına akmaya hazır olduğunu hissettin. Kalktın; ama koltuk seni hatırlıyor.", en: "You sat in the empty seat of the Sevenfold Court and felt a whole world's levels waiting to pour in under your skin. You got up. The seat remembers you anyway." }
  nadirlik: "mitik"
  bonus: { int: 15, wil: 20, cha: 15 }
taht_reddeden:
  ad: { tr: "Tahtı Reddeden", en: "Throne-Refuser" }
  aciklama: { tr: "Kadimler sana bir tanrının koltuğunu gösterdi; sırtını döndün. Yedi Taht'ın tarihinde bunu yapan ilk ölümlüsün.", en: "The Ancients showed you a god's chair, and you turned your back on it. You're the first mortal in the Sevenfold Court's history to do that." }
  nadirlik: "efsanevi"
  bonus: { wil: 15, wis: 12, cha: 8 }
varis_katili:
  ad: { tr: "Varis Katili", en: "Heirslayer" }
  aciklama: { tr: "Yedinci Taht'ın talibi {npc:ossiran|i} kendi sarayında, altı tahtın gözü önünde yendin. Kadimler seni artık bir hasat olarak değil, bir hesap hatası olarak anıyor.", en: "You beat {npc:ossiran}, claimant to the Seventh Throne, in his own court, in front of all six thrones. The Ancients don't talk about you as a crop anymore. They talk about you as a rounding error." }
  nadirlik: "mitik"
  bonus: { str: 18, agi: 15, wil: 15 }
