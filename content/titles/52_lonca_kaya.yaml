# Parti B2 unvanları (Demir Lonca zinciri + Kaya Demir).
havuz_temizleyen:
  ad: { tr: "Kuru Havuzun Süpürgesi", en: "Dry Dock Sweeper" }
  aciklama: { tr: "Lonca'nın on iki kişilik bir mangayla ve önden giden taşıyıcılarla kapatmayı planladığı kapıyı tek başına, on dakikada kapattın. Pano'daki adının yanına bir kronometre çizdiler.", en: "The Guild planned to close that Gate with a twelve-man squad and a line of carriers out front. You did it alone, in ten minutes. Somebody drew a stopwatch next to your name on the Board." }
  nadirlik: "epik"
  bonus: { str: 4, agi: 4, end: 2 }
bascavusun_ogrencisi:
  ad: { tr: "Başçavuşun Öğrencisi", en: "The Gunny's Student" }
  aciklama: { tr: "Yirmi yıl asker yetiştirmiş bir adam sana komuta etmeyi öğretiyor: kimin öleceğini seçmeyi, sonra o seçimle yaşamayı. Sesin emir verirken artık titremiyor.", en: "A man who spent twenty years training troops is teaching you how to command: how to choose who dies, and then how to live with it. Your voice doesn't shake anymore when you give an order." }
  nadirlik: "epik"
  bonus: { wil: 5, cha: 5 }
merdivenin_tepesi:
  ad: { tr: "Merdivenin Tepesi", en: "Top of the Ladder" }
  aciklama: { tr: "Merdiven Günü'nde Lonca'nın rütbe basamaklarını bir öğleden sonrada çıktın. Haddehane'deki herkes artık sana bakarak kendi basamağını ölçüyor.", en: "On Ladder Day you climbed the Guild's whole rank ladder in one afternoon. Everyone in the rolling mill measures their own rung by looking up at you now." }
  nadirlik: "epik"
  bonus: { str: 5, wil: 3, cha: 4 }
demir_yasa_kalemi:
  ad: { tr: "Demir Yasa'nın Kalemi", en: "The Pen of the Iron Law" }
  aciklama: { tr: "{yer:kiyikent|in} sıkıyönetim yasasının altında senin adın var. Sokaklarda insanlar yasayı onu yazan elin gücü yüzünden tanıyor; yasanın kendisi yüzünden değil.", en: "Your name is at the bottom of {yer:kiyikent|pos} martial law. People on the street honor the law because of the hand that signed it, not because of what it says." }
  nadirlik: "efsanevi"
  bonus: { int: 8, wil: 8, cha: 6 }
demir_deviren:
  ad: { tr: "Demiri Deviren", en: "The One Who Toppled Iron" }
  aciklama: { tr: "{yer:kiyikent|in} en güçlü adamını kendi Haddehanesinde, kendi askerlerinin önünde devirdin. Lonca'da artık kimse sana 'asker' demiyor.", en: "You took down the strongest man in {yer:kiyikent} in his own rolling mill, in front of his own troops. Nobody in the Guild calls you 'kid' anymore." }
  nadirlik: "efsanevi"
  bonus: { str: 10, end: 6, wil: 8 }
hattin_mizragi:
  ad: { tr: "Hattın Mızrağı", en: "Spearhead of the Line" }
  aciklama: { tr: "Kadim filosu göğü kararttığında kara hattını bir general tuttu; o hattın önünde ise tek bir mızrak vardı. Sendin.", en: "When the Ancient fleet blacked out the sky, a general held the ground line. Out in front of that line there was a single spearhead. It was you." }
  nadirlik: "efsanevi"
  bonus: { str: 14, agi: 10, wil: 12 }
demir_tahtin_sahibi:
  ad: { tr: "Demir Tahtın Sahibi", en: "Holder of the Iron Chair" }
  aciklama: { tr: "Haddehane'nin ortasındaki kaynaklı sandalyeye oturdun. Lonca'nın her silahı, her kolluğu ve Pano'daki her isim artık senin tek bir sözüne bakıyor.", en: "You sat down in the welded chair in the middle of the rolling mill. Every weapon in the Guild, every armband, every name on the Board now waits on a single word from you." }
  nadirlik: "efsanevi"
  bonus: { str: 15, wil: 18, cha: 18 }
