# Parti F — Deniz, Yankı ve Aras yaylarının unvanları (titles.yaml biçimi; düz eşlem).
vapur_yoldasi:
  ad: { tr: "Vapur Yoldaşı", en: "Ferry Mate" }
  aciklama: { tr: "Yan yatmış bir vapurun güvertesinde bir arkadaşa insan kalacağına söz verdin. Sistem bu sözü ölçemiyor; yine de kaydetti.", en: "On the deck of a capsized ferry, you promised a friend you'd stay human. The System can't measure that promise. It logged it anyway." }
  nadirlik: "epik"
  bonus: { wis: 6, cha: 6, wil: 4 }
kalkanin_varisi:
  ad: { tr: "Kalkanın Varisi", en: "Heir to the Shield" }
  aciklama: { tr: "Senin için hattı tutan birinin kalkanını taşıyorsun. Darbeler hâlâ önce ona çarpıyor gibi.", en: "You carry the shield of someone who held the line for you. Every hit still feels like it lands on them first." }
  nadirlik: "efsanevi"
  bonus: { end: 12, wil: 8 }
kaynagi_goren:
  ad: { tr: "Kaynağı Gören", en: "Saw the Source" }
  aciklama: { tr: "Sistem'in dikiş yerinden içeri baktın. Gördüğün şey bir makine değildi; bir yaraydı.", en: "You looked in through the System's seam. What you saw wasn't a machine. It was a wound." }
  nadirlik: "epik"
  bonus: { int: 6, per: 6 }
dongu_tanigi:
  ad: { tr: "Döngünün Tanığı", en: "Witness to the Loop" }
  aciklama: { tr: "Sayacı gördün. Bu ilk Entegrasyon değil ve büyük ihtimalle son da olmayacak.", en: "You saw the counter. This isn't the first Integration, and odds are it won't be the last." }
  nadirlik: "mitik"
  bonus: { int: 10, wis: 10, wil: 10 }
yankisiz:
  ad: { tr: "Yankısız", en: "Echoless" }
  aciklama: { tr: "Kafanın içi ilk kez sessiz. Bunun özgürlük mü yoksa yalnızlık mı olduğuna henüz karar vermedin.", en: "For the first time, the inside of your head is quiet. You haven't decided yet whether that's freedom or loneliness." }
  nadirlik: "efsanevi"
  bonus: { wil: 14, wis: 6 }
ebedi_rakip:
  ad: { tr: "Ebedi Rakip", en: "Eternal Rival" }
  aciklama: { tr: "Sıralamada adının hemen altında ya da hemen üstünde hep aynı isim var. Takvim işliyor.", en: "There's always the same name right under yours on the Ranking, or right above it. The schedule's still running." }
  nadirlik: "epik"
  bonus: { agi: 8, per: 4 }
iki_kisilik_zirve:
  ad: { tr: "İki Kişilik Zirve", en: "A Summit for Two" }
  aciklama: { tr: "Zirveye tek başına çıkılır derler. Sen birini yanında götürdün.", en: "They say you climb to the top alone. You brought somebody with you." }
  nadirlik: "efsanevi"
  bonus: { agi: 6, str: 6, cha: 6 }
