# Parti G — Perde 2 Kıyıkent (Liman, Kordon, Eski Şehir) unvanları.
vapuru_dogrultan:
  ad: { tr: "Vapuru Doğrultan", en: "Ferry Lifter" }
  aciklama: { tr: "Kıyıkent'in akşam vapurunu sudan omzunla kaldırdın. Sekiz yüz ton; iki yüz on dört tanık.", en: "You lifted Port Harlow's evening ferry out of the water with your shoulder. Eight hundred tons. Two hundred fourteen witnesses." }
  nadirlik: "epik"
  bonus: { str: 3, end: 2 }
fenerci_avcisi:
  ad: { tr: "Fener Söndüren", en: "Lightbreaker" }
  aciklama: { tr: "Kordon'un kayıklarını sahte bir fenerle yutan Fener Balığı Ana'yı öldürdün. Körfezin ışığı artık yalan söylemiyor.", en: "You killed the Lamplighter, the thing that swallowed the Esplanade's boats with a fake lighthouse. The light on the sound doesn't lie anymore." }
  nadirlik: "epik"
  bonus: { per: 2, wil: 2, end: 1 }
kordonun_kalkani:
  ad: { tr: "Kordon'un Kalkanı", en: "Shield of the Esplanade" }
  aciklama: { tr: "Sana dikilen heykelin yüzünü sildin ve yerine taşma gecesi ölenlerin adlarını kazıdın. Sistem bunu nereye yazacağını bilemedi.", en: "You wiped your face off the statue raised to you and carved the names of the gate-break dead in its place. The System wasn't sure where to file this." }
  nadirlik: "efsanevi"
  bonus: { wil: 3, cha: 3, str: 1 }
