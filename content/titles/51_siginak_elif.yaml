# Parti B1 — Sığınak zinciri unvanları (düz eşlem, titles.yaml biçimi).
mendirek_bekcisi:
  ad: { tr: "Mendirek Bekçisi", en: "Keeper of the Harbor Light" }
  aciklama: { tr: "Bir limanın sönmüş fenerini yeniden yaktın. Balıkçılar o yeşil ışığa senin adını verdi.", en: "You relit a harbor's dead light. The fishermen named that green glow after you." }
  nadirlik: "nadir"
  bonus: { end: 3, wil: 2 }
su_getiren:
  ad: { tr: "Su Getiren", en: "Water-Bringer" }
  aciklama: { tr: "Bir şehrin susuzluğunu sona erdirdin. Sistem bunu 'beklenmedik kaynak tahsisi' diye kaydetti; şehir başka bir şey diye.", en: "You ended a city's thirst. The System logged it as \"unexpected resource allocation.\" The city called it something else." }
  nadirlik: "epik"
  bonus: { wis: 4, end: 3, cha: 3 }
son_siginagin_mimari:
  ad: { tr: "Son Sığınağın Mimarı", en: "Architect of the Last Haven" }
  aciklama: { tr: "Bir şehri taşın içine sakladın; duvarlarında senden önce sayan birinin çentikleri vardı.", en: "You hid a city inside the rock. Someone who counted before you left tally marks on its walls." }
  nadirlik: "epik"
  bonus: { end: 10, wil: 8, str: 6 }
kalkan_yeminli:
  ad: { tr: "Kalkan Yeminli", en: "Shield-Sworn" }
  aciklama: { tr: "Bir şehir arkanda durdu, sen de önünde. Yanındaki herkes biraz daha uzun dayanıyor.", en: "A city stood behind you, and you stood in front of it. Everyone beside you holds out a little longer." }
  nadirlik: "efsanevi"
  bonus: { end: 25, wil: 20, cha: 15 }
