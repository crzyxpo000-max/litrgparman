# Parti A — Perde 2 ana yay unvanları (titles.yaml biçimi; düz eşlem).
ilk_kule_adimi:
  ad: { tr: "Kule'ye Adım Atan İlk", en: "First Through the Spire's Door" }
  aciklama: { tr: "Kule'nin yükseldiği sabah, kimse cesaret edemezken ilk kapısından sen geçtin. Bütün gezegen bu bildirimi aldı ve bir an sustu.", en: "On the morning the Spire rose, while nobody else had the nerve, you were the first one through its door. The whole planet got the notification and went quiet for a second." }
  nadirlik: "efsanevi"
  bonus: { str: 3, agi: 3, wil: 3 }
  ilk: true
cani_susturan:
  ad: { tr: "Çanı Susturan", en: "Bellbreaker" }
  aciklama: { tr: "Kule'nin habercisini meydanın ortasında devirdin. Kıyıkent'te çan sesi duyan herkes artık önce sana bakıyor.", en: "You dropped the Spire's herald in the middle of the square. Anybody in Port Harlow who hears a bell now looks at you first." }
  nadirlik: "epik"
  bonus: { str: 2, end: 2, wil: 2 }
cekirdek_efendisi:
  ad: { tr: "Çekirdeğin Efendisi", en: "Master of the Core" }
  aciklama: { tr: "Kasaba Çekirdeği hiçbir konseye, loncaya ya da tarikata değil, yalnızca sana bağlandı. Şehrin kalbi senin nabzınla atıyor.", en: "The Town Core didn't bind to a council, a guild or a cult. It bound to you. The city's heart beats on your pulse now." }
  nadirlik: "efsanevi"
  bonus: { wis: 3, wil: 3, cha: 3 }
kordon_kalkani:
  ad: { tr: "Kordon'un Kalkanı", en: "Shield of the Esplanade" }
  aciklama: { tr: "İlk kapı taşmasında Kordon'u sen tuttun. Sahildeki her balkonda, o gece dalganın senin önünde durduğunu anlatan biri var.", en: "You held the Esplanade through the first Gate overflow. On every balcony along the waterfront, somebody's telling the story of the night the tide stopped in front of you." }
  nadirlik: "efsanevi"
  bonus: { end: 4, wil: 2, str: 2 }
iki_sesli:
  ad: { tr: "İki Sesli", en: "Two-Voiced" }
  aciklama: { tr: "Bütün şehir kafandaki sesi duydu ve sen onu inkâr etmedin. Artık sokaklarda adının yanında hep bir ikincisi anılıyor.", en: "The whole city heard the voice in your head, and you didn't deny it. On the street, your name never gets said alone anymore." }
  nadirlik: "epik"
  bonus: { int: 2, wis: 2, per: 2 }
basligi_okuyan:
  ad: { tr: "Başlığı Okuyan", en: "Reader of the Header" }
  aciklama: { tr: "Sistem'in kendi adını, kendi elinle, kendi gözlerinle okudun. O satırı okuyan başka kimse yok; okuduğunu söyleyen çok.", en: "You read the System's own name with your own eyes. Nobody else has read that line. Plenty of people claim they have." }
  nadirlik: "efsanevi"
  bonus: { int: 3, wis: 3, per: 2 }
golgede_duran:
  ad: { tr: "Gölgenin Altında Duran", en: "The One Who Stood in the Shadow" }
  aciklama: { tr: "Kadim gemisi körfezin üstüne gölgesini düşürdüğünde herkes kaçtı ya da diz çöktü. Sen o gölgenin tam ortasında ayakta kaldın.", en: "When the Ancient ship threw its shadow over the bay, everybody ran or knelt. You stayed on your feet, right in the middle of it." }
  nadirlik: "efsanevi"
  bonus: { wil: 4, cha: 3, end: 2 }
