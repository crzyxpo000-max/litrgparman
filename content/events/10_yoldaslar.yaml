# Parti A — Yoldaş yayları (Perde 1). docs/PERDE1.md sözleşmesi.
# Deniz: "arkadaşımın bir canavara ya da tanrıya dönüşmesini izlemek" (bulusma → hesap → ateş başı → kardeş izi → son seçim).
# {npc:yanki}: istasyon sinyali → sinyal cevap veriyor → bozuk satır (bilgi: yanki_parcasi). Aras: iz → ilk yarışı → sıralama meydanı.
# Mücadele (Gün 1–11) ve Hakimiyet (bayrak kirilma_yasandi) evreleri aynı olayda koşullu paragraf/seçeneklerle ayrışır.
# Yankı'nın satırları tırnaksız ve küçük harflidir (fısıltı). İngilizcede Deniz için zamir belirteci kullanılır.
olaylar:
  # ================================================================== DENİZ · 1: buluşma
  - id: "deniz_bulusma"
    konum: ["ogretici_orman"]
    perde: [1]
    bolge: ["ogretici_orman"]
    gun: { min: 1, max: 20 }
    kosul: { bayrak_yok: "deniz_el_tutuldu" }
    agirlik: 8
    etiketler: ["deniz", "karsilasma", "kesif"]
    gerilim: 3
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Tanıdık bir ses", en: "A voice you know" }
    sahne: "deniz_bulusma_1"
    sahneler:
      - id: "deniz_bulusma_1"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin içinden biri adını haykırıyor. Ses kısılmış, paramparça olmuş, ama tanıyorsun: on yıl boyunca her sabah iskelede \"Vapur kaçıyor!\" diye bağıran sesin ta kendisi.", en: "Somebody's screaming your name through the fog, voice shredded, but you know it. Ten years of that same voice yelling \"We're gonna miss the ferry!\" across the terminal every morning." }
          - { tr: "{npc:deniz_arman} devrilmiş bir çamın köklerine sırtını vermiş, elindeki kırık tabela direğini savuruyor. Üç sis tazısı çevresinde dönüp duruyor; ne hırlıyorlar ne acele ediyorlar, avını önce yormayı bilenlerin sabrıyla.", en: "{npc:deniz_arman} has {zamir:deniz_arman|onun} back to the roots of a fallen pine, swinging a snapped-off signpost. Three fog hounds circle in close. No snarling, no hurry, just the kind of patience that wears prey down first." }
          - { tr: "Kolu kanıyor. Tazılar seni henüz sezmedi, rüzgâr senden yana. Bir saniyen var, bilemedin iki.", en: "There's blood on {zamir:deniz_arman|onun} arm. The hounds haven't caught your scent yet, and the wind's on your side. You've got one second, maybe two." }
          - metin: { tr: "Bir zamanlar bu manzara seni olduğun yere çivilerdi. Şimdiyse tazıların her adımı, her soluğu, aralarındaki her boşluk bir arada gözünün önünde; zaman yalnız senin için ağırlaşmış gibi.", en: "There was a time this would've nailed you to the spot. Now you can see every step, every breath, every gap between them all at once, like time slowed down just for you." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Soldaki tazı sol ön ayağını yere basmıyor. Sürü onu kollamak için dönüp duruyor; zincirin zayıf halkası o.", en: "The one on the left won't put weight on its front paw. The pack keeps circling to cover it. That's the weak link." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "üç tazı, ikisi gerçek. üçüncüsü sisin yankısı; dişi yok. bana güven, yankılardan anlarım.", en: "three hounds, two of them real. the third is just the fog echoing them; no teeth. trust me, i know echoes." }
        secenekler:
          - id: "atil"
            etiket: { tr: "Aralarına dal, tazıları üstüne çek", en: "Dive in and pull the hounds onto you" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
              - savas: { dusmanlar: ["sis_tazisi", "sis_tazisi"], ortam: ["karanlik"], kazan: "deniz_bulusma_zafer", kaybet: "deniz_bulusma_yenilgi", kac: "deniz_bulusma_kacis" }
          - id: "tuzak_kur"
            etiket: { tr: "Topal tazıyı ayır, sürüyü dağıt", en: "Cut off the limping one and scatter the pack" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
              - xp: 60
            sonraki: "deniz_bulusma_tuzak"
          - id: "izle"
            etiket: { tr: "Bekle; önce tazılar onu yorsun", en: "Wait. Let the hounds wear {zamir:deniz_arman|onu} down first" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - iliski: { deniz_arman: { guven: -20 } }
              - hafiza: { npc: "deniz_arman", id: "tazilar_bekledi", agirlik: -45 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - bayrak: "deniz_bekletildi"
              - gorev: { deniz_bul: "tamam" }
              - tohum: { olay: "deniz_hesap", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "deniz_bekletildi", yoldas: "deniz_arman" }, hatirlatma: { tr: "Tazılar {npc:deniz_arman|i} yorarken beklediğin o birkaç saniye aranızda hâlâ duruyor.", en: "Those few seconds you waited while the hounds wore {npc:deniz_arman} down are still sitting between you." } }
            sonraki: "deniz_bulusma_bekleyis"
          - id: "bak"
            tur: "gosteris"
            etiket: { tr: "Sisten çık, tazılara yalnızca bak", en: "Step out of the fog and just look at them" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { wil: 14 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 2
              - iliski: { deniz_arman: { saygi: 10, korku: 5 } }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
            sonraki: "deniz_bulusma_ezme"

      - id: "deniz_bulusma_zafer"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Son tazı sisin içinde dağılıp geride bir avuç ıslak dumanla bir tutam kürk bırakıyor. {npc:deniz_arman} köklerin dibine çöküvermiş, göğsü körük gibi inip kalkıyor.", en: "The last hound comes apart in the fog, leaving a handful of wet smoke and a tuft of fur. {npc:deniz_arman} slides down against the roots, chest heaving like a bellows." }
          - { tr: "Derken gülmeye başlıyor; dehşetin ardından gelen, bir türlü dinmeyen o kesik kesik gülüş. \"Geç kaldın,\" diyor. \"Vapuru da hep sen kaçırtırdın zaten.\"", en: "Then the laughing starts, the jagged kind that comes after terror and won't quit. \"You're late,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You always made us miss the ferry, too.\"" }
          - { tr: "Kolundaki yara derin değil, ama elleri titremeyi bir türlü bırakmıyor. Gerçekten sen misin diye emin olmak istercesine seni tepeden tırnağa süzüyor.", en: "The cut on {zamir:deniz_arman|onun} arm isn't deep, but {zamir:deniz_arman|onun} hands won't stop shaking. {npc:deniz_arman|pos} eyes go over you head to toe, like checking it's really you." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Elini uzat, onu ayağa kaldır", en: "Reach down and pull {zamir:deniz_arman|onu} up" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 15, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 45 }
            sonraki: "@akis"
          - id: "sar"
            etiket: { tr: "Önce kolunu sar; lafı sonra", en: "Patch up that arm first. Talk later" }
            gerekli: { esya: { kirmizi_ot: 1 } }
            etkiler:
              - ahlak: { merhamet: 4 }
              - esya: { kirmizi_ot: -1 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 45 }
            sonraki: "@akis"
          - id: "anlat"
            etiket: { tr: "Ona kafandaki sesi anlat", en: "Tell {zamir:deniz_arman|onu} about the voice in your head" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 12 } }
              - iliski: { yanki: { guven: -10 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - hafiza: { npc: "deniz_arman", id: "yanki_anlatildi", agirlik: 30 }
            sonraki: "deniz_bulusma_sir"

      - id: "deniz_bulusma_sir"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Her şeyi anlatıyorsun: aktarımdaki bozuk satırı, adı olmayan bir renge dönen pencereyi, kafanın içinde fısıldayıp duran şeyi. {npc:deniz_arman} bir kez olsun sözünü kesmiyor.", en: "You tell {zamir:deniz_arman|onu} everything: the corrupted line during the transfer, the window that turned a color with no name, the thing whispering inside your skull. {npc:deniz_arman} doesn't interrupt once." }
          - { tr: "\"Yani,\" diyor sonunda, \"kafanda bir kiracı var.\" Gülümsemeye çalışıyor ama beceremiyor. \"Bari kirasını ödüyor mu?\"", en: "\"So,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}, \"you've got a roommate in your head.\" A smile tries to happen and doesn't make it. \"Is it at least paying rent?\"" }
          - { tr: "Kafanın içinde bir şey soğuyor. Ses çekilirken geride tek bir kelime bırakıyor, buz gibi: anlattın.", en: "Something inside your head goes cold. The voice leaves exactly one word behind, flat as ice: told." }
        secenekler:
          - id: "guven"
            etiket: { tr: "\"Sana anlatmasam kime anlatacaktım?\"", en: "\"If I can't tell you, who can I tell?\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Sesten içinden özür dile", en: "Apologize to the voice, silently" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "\"Kimseye söyleme. Ciddiyim.\"", en: "\"Don't tell anybody. I mean it.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 2
              - iliski: { deniz_arman: { guven: 3, saygi: 4 } }
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_yenilgi"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Dizlerin çözülüyor. Son gördüğün şey, üstüne kapanan sisten bir ağız oluyor; derken bir tabela direği tam o ağzın ortasına iniyor.", en: "Your knees give out. The last thing you see is a mouth made of fog coming down on you. Then a signpost comes down right in the middle of it." }
          - { tr: "Kendine geldiğinde {npc:deniz_arman} seni bir kayanın kovuğuna sürüklemiş, gömleğinden yırttığı bir şeritle bacağını sarıyor. Kendi yarasıysa hâlâ kanıyor.", en: "When you come to, {npc:deniz_arman} has dragged you into a hollow under a boulder and is binding your leg with a strip torn off {zamir:deniz_arman|onun} own shirt. {zamir:deniz_arman|onun|b} own cut is still bleeding." }
          - { tr: "\"Beni kurtarmaya geldin,\" diyor titrek bir sesle. \"Ödeştik o zaman. Bir daha sakın böyle bir şey yapma.\"", en: "\"You came to save me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice cracking. \"So now we're even. Don't you ever do that again.\"" }
        secenekler:
          - id: "ayni"
            etiket: { tr: "\"Sen olsan aynısını yapardın.\"", en: "\"You'd have done the same.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 12, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 40 }
            sonraki: "@akis"
          - id: "dinlen"
            etiket: { tr: "Sesini çıkarma, dinlen; nöbeti o tutsun", en: "Shut up and rest. Let {zamir:deniz_arman|onu} take watch" }
            etkiler:
              - ahlak: { duzen: 1 }
              - can: 15
              - iliski: { deniz_arman: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "Bir dahakine daha güçlü olacağına yemin et", en: "Swear you'll be stronger next time" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - stat: { wil: 1 }
              - iliski: { deniz_arman: { saygi: 5 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_kacis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Tazı çok, sis yoğun, senin gücün yetmiyor. {npc:deniz_arman|i} bileğinden yakaladığın gibi en yakın yamaçtan aşağı atılıyorsunuz.", en: "Too many hounds, too much fog, not enough of you. You grab {npc:deniz_arman} by the wrist and throw yourselves down the nearest slope." }
          - { tr: "Çamura, köklere, birbirinize çarpa çarpa yuvarlanıyorsunuz. Dibe vardığınızda ulumalar yukarıda kalmış, sis kokunuzu yutmuş.", en: "You tumble through mud and roots, slamming into each other the whole way down. By the time you hit bottom the howling's stuck up top. The fog swallowed your scent." }
          - { tr: "{npc:deniz_arman} yüzündeki çamuru silerken \"Kaçmak da taktiktir,\" diyor. \"Biri bunu bir yere not etsin.\"", en: "{npc:deniz_arman} wipes the mud off {zamir:deniz_arman|onun} face. \"Running counts as a tactic,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Somebody write that down.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül, elini sık", en: "Laugh and shake on it" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4 } }
            sonraki: "@akis"
          - id: "geri_don"
            etiket: { tr: "Geri dönüp tazıları avlamayı öner", en: "Suggest circling back to hunt the hounds" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - egilim: { yakin_dovus: 1 }
              - iliski: { deniz_arman: { saygi: 6, guven: -2 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_tuzak"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Topal tazının arkasına dolanıp ayaklarının dibine bir taş sektiriyorsun. Sürü yaralısını kollamak için içgüdüyle dönünce çember bir anlığına açılıveriyor.", en: "You circle behind the limping hound and skip a rock off the ground at its feet. The pack wheels on instinct to cover its hurt member, and the circle breaks open for a heartbeat." }
          - { tr: "O kadarcık an yetiyor. {npc:deniz_arman} boşluktan fırlarken sen de arkasında bir dalı çalıların arasında sürükleyip elinden geldiğince gürültü çıkarıyorsun; tazılar birbirinin kokusunu yitirip dağılana dek.", en: "A heartbeat's all it takes. {npc:deniz_arman} bolts through the gap while you drag a branch through the brush behind {zamir:deniz_arman|onu}, making all the noise you can, until the hounds lose each other's scent and scatter." }
          - { tr: "Yüz adım ötede soluklandığınızda {npc:deniz_arman} seni ilk kez görüyormuş gibi bakıyor. \"Sen bunu nereden öğrendin?\"", en: "A hundred yards on you finally stop, and {npc:deniz_arman} looks at you like it's the first time. \"Where'd you learn that?\"" }
        secenekler:
          - id: "kitap"
            etiket: { tr: "\"Bir kitapta okudum.\" Gülümse", en: "\"Read it in a book.\" Smile" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 12, saygi: 8 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 40 }
            sonraki: "@akis"
          - id: "ses"
            etiket: { tr: "\"Ses söyledi.\" Şakağına dokun", en: "\"The voice told me.\" Tap your temple" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -2 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 6, korku: 4 } }
              - iliski: { yanki: { guven: -8 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -20 }
              - hafiza: { npc: "deniz_arman", id: "yanki_anlatildi", agirlik: 25 }
            sonraki: "@akis"
          - id: "omuz"
            etiket: { tr: "\"Burada ya hızlı öğrenirsin ya ölürsün.\"", en: "\"Out here you learn fast or you die.\"" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - egilim: { gizlilik: 1 }
              - iliski: { deniz_arman: { saygi: 10 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_bekleyis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Bekliyorsun. {npc:deniz_arman} direği bir kez, iki kez savuruyor; üçüncüsünde tazılardan biri koluna kapanıyor ve çığlığı ormanda uzun uzun çınlıyor.", en: "You wait. {npc:deniz_arman} swings the signpost once, twice. On the third swing a hound clamps onto {zamir:deniz_arman|onun} arm, and the scream rings through the woods for a long time." }
          - { tr: "Tazılar ancak avları yere yıkılınca gevşiyor. İşte o zaman ortaya çıkıp yorgun hayvanları zahmetsizce dağıtıyorsun. Hesap tuttu: üstünde tek bir çizik yok.", en: "The hounds only ease off once their prey is down, and that's when you step out and scatter the tired animals with no trouble at all. The math worked. You didn't take a scratch." }
          - { tr: "{npc:deniz_arman} yattığı yerden sana bakıyor. Gözlerinde minnet okunuyor; altında da başka bir şey var, henüz adını koymadığı bir şey.", en: "{npc:deniz_arman} looks up at you from the dirt. There's gratitude in that look. Underneath it is something else, something {zamir:deniz_arman|o} {zamir:deniz_arman|has}n't named yet." }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini uzat, hiçbir şey söyleme", en: "Offer a hand. Say nothing" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "an"
            etiket: { tr: "\"Doğru anı bekledim.\"", en: "\"I was waiting for the right moment.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { guven: -4, saygi: 4 } }
            sonraki: "@akis"
          - id: "sar"
            etiket: { tr: "Yarasını sar; bunu ona borçlusun", en: "Bind the wound. You owe {zamir:deniz_arman|onu} that much" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 6 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_ezme"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisten çıkıp hiçbir şey yapmıyorsun; yalnızca öylece durup tazılara bakıyorsun.", en: "You step out of the fog and do nothing. You just stand there and look at the hounds." }
          - { tr: "Üçü birden donup kalıyor. Kürkleri buhar gibi kabarıyor, kuyrukları bacaklarının arasına kıvrılıyor; ardından sis onları geri alıyor, geride tek bir inilti bile kalmadan.", en: "All three freeze. Their fur stands up like steam and their tails tuck between their legs, and then the fog takes them back without so much as a whimper." }
          - { tr: "{npc:deniz_arman} direği hâlâ havada tutuyor. Gözü önce tazıların kaybolduğu yöne, sonra sana kayıyor; o bakışta seni tanımakta güçlük çeken bir şey var.", en: "{npc:deniz_arman} still has the signpost raised. {zamir:deniz_arman|o|b} look{zamir:deniz_arman|s} where the hounds went, then at you, and something in that look is struggling to recognize you." }
        secenekler:
          - id: "benim"
            etiket: { tr: "\"Benim. Hâlâ benim.\"", en: "\"It's me. It's still me.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 5 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 35 }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Direği elinden al, yürümeye başla", en: "Take the signpost and start walking" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { deniz_arman: { saygi: 8, korku: 6 } }
            sonraki: "@akis"
          - id: "bitir"
            etiket: { tr: "Tazıların peşine düş, işlerini bitir", en: "Go after the hounds and finish them off" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - xp: 80
              - gunluk: { savas: 1 }
              - iliski: { deniz_arman: { korku: 4 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 2: hesap (tohum)
  - id: "deniz_hesap"
    konum: ["us"]
    perde: [1]
    agirlik: 1
    etiketler: ["deniz", "ahlak", "kamp"]
    gerilim: 2
    npc: ["deniz_arman"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Ödenmemiş hesap", en: "An unpaid debt" }
    sahne: "deniz_hesap_1"
    sahneler:
      - id: "deniz_hesap_1"
        paragraflar:
          - { tr: "Ateş sönmeye yüz tutmuş. {npc:deniz_arman} bütün akşam kolundaki yara kabuğunu kurcalayıp durdu; şimdi son parçasını da tırnağıyla kaldırıp kanın yeniden sızışını seyrediyor.", en: "The fire's burning down. {npc:deniz_arman} has been picking at the scab on {zamir:deniz_arman|onun} arm all night. Now the last of it comes off under a thumbnail, and {zamir:deniz_arman|o} stare{zamir:deniz_arman|s} at the blood welling back up." }
          - { tr: "\"O gün bekledin,\" diyor, gözünü kandan ayırmadan. \"Ağacın arkasındaydın, gördüm seni. Tazılar beni yerken orada dikilip saydın.\"", en: "\"You waited that day,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, eyes still on the blood. \"You were behind that tree, I saw you. Those things were eating me alive and you stood there and counted.\"" }
          - { tr: "Sesi sakin; öfkeden beter bir sakinlik bu. Senden açıklama değil, cevap bekliyor.", en: "{zamir:deniz_arman|onun|b} voice is calm, the kind of calm that's worse than angry. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't asking for an explanation. {zamir:deniz_arman|o|b} want{zamir:deniz_arman|s} an answer." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Elleri yumruk olmamış. Kavga aramıyor; seni affetmek için bir sebep arıyor.", en: "Those hands aren't fists. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't looking for a fight. {zamir:deniz_arman|o|b} want{zamir:deniz_arman|s} a reason to forgive you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "doğruyu söylersen güvenir, yalan söylersen hatırlar. ikisi de veri. hangisini istediğin sana kalmış.", en: "tell the truth and {zamir:deniz_arman|o} trust{zamir:deniz_arman|s} you; lie and {zamir:deniz_arman|o} remember{zamir:deniz_arman|s}. both are data. you pick which one you want." }
        secenekler:
          - id: "itiraf"
            etiket: { tr: "Doğruyu söyle: korktun", en: "Tell the truth: you were scared" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 12, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "durust_itiraf", agirlik: 35 }
              - tohum: { olay: "kamp_ates_basi", gecikme: { min: 2, max: 4 }, kosul: { yoldas: "deniz_arman" }, hatirlatma: { tr: "O hesaplaşmadan sonra {npc:deniz_arman|le} ilk kez aynı ateşe oturuyorsunuz.", en: "It's the first time you and {npc:deniz_arman} have sat at the same fire since you had it out." } }
            sonraki: "deniz_hesap_itiraf"
          - id: "yalan"
            etiket: { tr: "Her şeyin planlı olduğunu söyle", en: "Say it was all part of a plan" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "deniz_hesap_yakalandi", basarisiz_etkiler: [{ ahlak: { duzen: -3 } }, { iliski: { deniz_arman: { guven: -15 } } }, { bayrak: "deniz_yalani_yakaladi" }, { hafiza: { npc: "deniz_arman", id: "yalan_yakalandi", agirlik: -35 } }] }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 2 } }
              - yalan: { npc: "deniz_arman", konu: "deniz_plan_yalani" }
            sonraki: "deniz_hesap_yalan"
          - id: "sert"
            etiket: { tr: "\"Yaşıyorsun, değil mi? Kapat bu konuyu.\"", en: "\"You're alive, aren't you? Drop it.\"" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - iliski: { deniz_arman: { guven: -10, korku: 5 } }
            sonraki: "deniz_hesap_sert"
          - id: "suclu"
            etiket: { tr: "Kafandaki sesi suçla: \"Bekle\" dedi", en: "Blame the voice in your head. It said wait" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 2, korku: 6 } }
              - iliski: { yanki: { guven: -12, saygi: -5 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
            sonraki: "deniz_hesap_yanki"

      - id: "deniz_hesap_itiraf"
        paragraflar:
          - { tr: "\"Korktum,\" diyorsun; kelime ağzından çıkarken ne kadar küçük kaldığını duyuyorsun. \"Üç tazı vardı, hesap yaptım. Önce kendimi düşündüm.\"", en: "\"I was scared,\" you say, and you hear how small the word is on the way out. \"There were three of them, and I ran the numbers. Me first.\"" }
          - { tr: "{npc:deniz_arman} uzun süre ateşe dalıp gidiyor. Sonra ağır bir yükü yere bırakır gibi yaralı kolunu dizinin üstüne koyuyor.", en: "{npc:deniz_arman} stares into the fire for a long time. Then {zamir:deniz_arman|o} rest{zamir:deniz_arman|s} the hurt arm across one knee, like setting down something heavy." }
          - { tr: "\"Ben de korktum,\" diyor. \"Tek fark, benim kaçacak yerim yoktu. Bir daha yapma bunu. Ama söylediğin için sağ ol.\"", en: "\"I was scared too, only I didn't have anywhere to run,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Don't ever do that again. But thanks for saying it.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Söz ver: bir daha asla", en: "Promise: never again" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "basla"
            etiket: { tr: "Söz verme; yalnızca başını salla", en: "Don't promise. Just nod" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { deniz_arman: { saygi: 6 } }
            sonraki: "@akis"

      - id: "deniz_hesap_yalan"
        paragraflar:
          - { tr: "\"Bir planım vardı,\" diyorsun; sesin umduğundan sağlam çıkıyor. \"Yorulmalarını bekledim. Erken dalsaydım ikimiz de ölürdük.\"", en: "\"I had a plan,\" you say, and your voice comes out steadier than you expected. \"I waited for them to tire out. If I'd gone in early, we'd both be dead.\"" }
          - { tr: "{npc:deniz_arman} dinledikçe başını ağır ağır sallıyor. \"Mantıklı,\" diyor. \"Tabii ya, mantıklı.\"", en: "{npc:deniz_arman} listens, nodding slowly. \"Makes sense,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Sure, makes sense.\"" }
          - { tr: "Ama yara kabuğuna bir daha dokunmuyor. Eli kolunun üstünde kıpırtısız, öylece duruyor.", en: "But {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't touch the scab again. {zamir:deniz_arman|onun|b} hand just stays there on {zamir:deniz_arman|onun} arm, perfectly still." }
          - metin: { tr: "Kafanın içinde ses kuru kuru not düşüyor: yalan kaydedildi. hafızasında bir boşluk açtın. boşluklar dolar.", en: "Inside your head, the voice logs it, dry as dust: lie recorded. you opened a gap in {zamir:deniz_arman|onun} memory. gaps fill up." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "Konuyu değiştir; yarını planla", en: "Change the subject. Plan tomorrow" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "@akis"
          - id: "geri_al"
            etiket: { tr: "Geç olmadan yalanı geri al", en: "Take it back before it's too late" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - hafiza: { npc: "deniz_arman", id: "durust_itiraf", agirlik: 25 }
            sonraki: "deniz_hesap_itiraf"

      - id: "deniz_hesap_yakalandi"
        paragraflar:
          - { tr: "\"Bir planım vardı,\" diyorsun. Sesin cümlenin ortasında çatallanıyor ve {npc:deniz_arman} bunu duyuyor; on yıl, o sesi tanımaya fazlasıyla yeter.", en: "\"I had a plan,\" you say. Your voice cracks halfway through, and {npc:deniz_arman} hears it. Ten years is plenty of time to learn what that sounds like." }
          - { tr: "\"Vapur kartını her unuttuğunda da bu sesle konuşurdun,\" diyor buz gibi. \"Plan, tabii.\" Kalkıp ateşin öbür ucuna, karanlığın tam kıyısına geçip oturuyor.", en: "\"That's the voice you used every time you forgot your ferry pass,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, ice cold. \"A plan, sure.\" Then {npc:deniz_arman} gets up and sits back down on the far side of the fire, right at the edge of the dark." }
          - { tr: "O gece nöbete kimse gönüllü olmuyor; zaten ikinizin de gözüne uyku girmiyor.", en: "Nobody volunteers for watch that night. Neither of you sleeps anyway." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yanına git, doğruyu söyle", en: "Go over there and tell the truth" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8 } }
            sonraki: "deniz_hesap_itiraf"
          - id: "kal"
            etiket: { tr: "Yerinden kalkma. Sabaha geçer", en: "Stay put. It'll blow over by morning" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { deniz_arman: { baglilik: -6 } }
            sonraki: "@akis"

      - id: "deniz_hesap_sert"
        paragraflar:
          - { tr: "\"Yaşıyorsun,\" diyorsun. \"İkimiz de yaşıyoruz. Burada başka hiçbir şeyin önemi yok.\"", en: "\"You're alive,\" you say. \"We both are. Out here, nothing else counts.\"" }
          - { tr: "{npc:deniz_arman} tanıdık bir yüzde yabancı bir ifade arar gibi bir an seni süzüyor. Sonra başını ağır ağır sallıyor: \"Haklısın. Burada başka hiçbir şeyin önemi yok.\"", en: "For a second {npc:deniz_arman} just looks at you, like searching a familiar face for a stranger's expression. Then a slow nod: \"You're right. Out here, nothing else counts.\"" }
          - { tr: "Söylediğini sana geri veriyor; ama aynı söz onun ağzında bir soru gibi duruyor.", en: "{zamir:deniz_arman|o|b} hand{zamir:deniz_arman|s} your own words right back to you. In {zamir:deniz_arman|onun} mouth, they sound like a question." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Cevap verme, yatmaya git", en: "Don't answer. Go to sleep" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { deniz_arman: { baglilik: -4 } }
            sonraki: "@akis"
          - id: "hakli"
            etiket: { tr: "\"Aslında haklı olmak istemiyorum.\"", en: "\"I don't actually want to be right.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"

      - id: "deniz_hesap_yanki"
        paragraflar:
          - { tr: "\"Kafamdaki ses,\" diyorsun, şakağına dokunarak. \"Bekle dedi, ben de bekledim.\"", en: "\"The voice in my head,\" you say, tapping your temple. \"It said wait. So I waited.\"" }
          - { tr: "{npc:deniz_arman} gözlerini kırpıştırarak şakanın sonunu bekliyor, ama son gelmiyor. \"Kafanda bir ses var,\" diyor ağır ağır, \"ve sana ne yapacağını söylüyor.\"", en: "{npc:deniz_arman} blinks, waiting for the punchline. It doesn't come. \"There's a voice in your head,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} slowly, \"and it tells you what to do.\"" }
          - { tr: "Ses sana soğuk su gibi bir sessizlikle karşılık veriyor. Ardından yalnızca senin duyduğun tek bir satır: ben hiçbir şey demedim. sayan sendin.", en: "The voice answers with a silence like cold water. Then one line, for you alone: i never said a word. you did the counting yourself." }
        secenekler:
          - id: "genelde"
            etiket: { tr: "\"Her zaman değil. Ama çoğu zaman haklı çıkıyor.\"", en: "\"Not always. But it's usually right.\"" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { deniz_arman: { korku: 4, guven: -4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "itiraf_et"
            etiket: { tr: "Dürüst ol: suçu sese yıktın", en: "Come clean: you're blaming the voice" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "deniz_hesap_itiraf"
          - id: "unut"
            etiket: { tr: "\"Unut gitsin. Bir şey demedim.\"", en: "\"Forget it. I didn't say anything.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { deniz_arman: { guven: -6 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 3: ateş başı (nefes)
  - id: "kamp_ates_basi"
    konum: ["us"]
    perde: [1]
    gun: { min: 3, max: 30 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 4
    etiketler: ["kamp", "nefes", "deniz"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Ateş başında", en: "Around the fire" }
    sahne: "kamp_ates_basi_1"
    sahneler:
      - id: "kamp_ates_basi_1"
        paragraflar:
          - { tr: "Bu gece ateşin başında yalnız değilsiniz. Yolda yanınıza takılan dört hayatta kalan ellerini aleve uzatmış; kimse kimseye seviyesini sormuyor.", en: "You're not alone at the fire tonight. Four survivors you picked up on the road hold their hands out to the flames, and nobody asks anybody's level." }
          - { tr: "Laf dönüp dolaşıp eski hayatlara geliyor. Biri diş hekimi asistanıymış, biri kargo şoförü; köşedeki yaşlı kadın otuz yıl ilkokulda resim öğretmiş, tırnaklarının dibinde hâlâ boya kalmış gibi ellerine bakıp duruyor.", en: "Instead they talk about their old lives. One was a dental hygienist, one drove a delivery route. The old woman in the corner taught elementary-school art for thirty years, and she keeps looking at her hands like there's still paint under her nails." }
          - { tr: "{npc:deniz_arman} dizlerini kucaklamış, hafifçe gülümseyerek dinliyor. Sıra sana gelince herkes susuyor.", en: "{npc:deniz_arman} sits hugging {zamir:deniz_arman|onun} knees, listening with a little smile. When it gets around to you, everybody goes quiet." }
          - metin: { tr: "Susmalarının tek sebebi sıranın sana gelmesi değil. Ateşin ışığında gölgen olması gerekenden uzun düşüyor; herkes sana bakmamaya çalışıyor, ama hiçbiri beceremiyor.", en: "It's not just that it's your turn. In the firelight your shadow runs way too long, and everybody's trying not to stare at you. They're all doing a lousy job of it." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Kargo şoförünün çantası anlattığından ağır. Sırtını ne ateşe dönüyor ne çantaya.", en: "The delivery driver's bag is heavier than he's letting on. He never turns his back to the fire. Or to that bag." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eski hayatlar. ilginç bir dosya biçimi. artık kimse açamıyor.", en: "old lives. interesting file format. nobody can open it anymore." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Sen de eski hayatını anlat", en: "Tell them about your old life" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - can: 20
              - iliski: { deniz_arman: { guven: 5, baglilik: 4 } }
            sonraki: "kamp_ates_basi_anlat"
          - id: "dinle"
            etiket: { tr: "Sessizce dinle; kim neyi saklıyor, bak", en: "Listen quietly. Clock who's hiding what" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - egilim: { gizlilik: 1 }
              - xp: 25
            sonraki: "kamp_ates_basi_canta"
          - id: "kardes"
            etiket: { tr: "{npc:deniz_arman|e} kız kardeşini sor", en: "Ask {npc:deniz_arman} about {zamir:deniz_arman|onun} little sister" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 6 } }
            sonraki: "kamp_ates_basi_kardes"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni sorduklarında gerçeği söyle", en: "When they ask your level, tell the truth" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { saygi: 4, korku: 4 } }
            sonraki: "kamp_ates_basi_seviye"
          - id: "nobet"
            etiket: { tr: "Onlar uyurken sen nöbet tut", en: "Take watch while they sleep" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - stat: { wil: 1 }
              - itibar: { siginak: 2 }
              - iliski: { deniz_arman: { guven: 3 } }
            sonraki: "@akis"

      - id: "kamp_ates_basi_anlat"
        paragraflar:
          - { tr: "Anlatıyorsun: sabah vapurlarını, ofisin yanık kahvesini, bir türlü boşalmayan gelen kutusunu. Kendi sesin kulağına yabancı geliyor, sanki o hayatı başka biri yaşamış.", en: "You tell them: the morning ferries, the burnt office coffee, the inbox that never once hit zero. Your own voice sounds strange to you. That life feels like it belonged to somebody else." }
          - { tr: "Resim öğretmeni kahkahayı basıyor. Diş hekimi asistanı \"Ah, bizim de e-postalarımız vardı,\" diye iç çekince bir an herkes aynı şeyin özlemini duyuyor.", en: "The art teacher cackles. The hygienist says, \"God, we had email too,\" and for a second everybody's homesick for the exact same thing." }
          - { tr: "{npc:deniz_arman} omzunu senin omzuna yaslıyor. \"Gördün mü?\" diye fısıldıyor. \"Hâlâ oradasın.\"", en: "{npc:deniz_arman} leans a shoulder into yours. \"See?\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. \"You're still in there.\"" }
        secenekler:
          - id: "yaslan"
            etiket: { tr: "Omzuna yaslan, gözlerini kapat", en: "Lean back into it and close your eyes" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "ne_kadar"
            etiket: { tr: "\"Daha ne kadar orada kalırım, bilmiyorum.\"", en: "\"Not sure for how much longer.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"

      - id: "kamp_ates_basi_canta"
        paragraflar:
          - { tr: "Sesini çıkarmadan izliyorsun. Kargo şoförü herkes gülünce o da gülüyor ama gözü hep çantasında. Bir ara fermuar aralanıyor; içeride dört şişe temiz su seçiyorsun.", en: "You watch without a word. The delivery driver laughs when everybody laughs, but his eyes keep drifting to the bag. At one point the zipper gapes, and you see four bottles of clean water inside." }
          - { tr: "Oysa bu ateşin başındaki herkes iki gündür yağmur suyuyla idare ediyor. Resim öğretmeninin dudakları kanayacak kadar çatlamış.", en: "Everyone at this fire has been drinking rainwater for two days. The art teacher's lips are cracked badly enough to bleed." }
        secenekler:
          - id: "paylastir"
            etiket: { tr: "Herkesin önünde suyu paylaştır", en: "Make him share the water in front of everyone" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 2 }
              - iliski: { deniz_arman: { saygi: 5 } }
            sonraki: "@akis"
          - id: "yalniz"
            etiket: { tr: "Onunla baş başa konuş; utandırma", en: "Talk to him alone. Don't shame him" }
            gerekli: { stat: { cha: 7 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - esya: { kaynak_suyu: 1 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey deme; bunu bir köşeye yaz", en: "Say nothing. Keep it in your back pocket" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - egilim: { gizlilik: 1 }
            sonraki: "@akis"

      - id: "kamp_ates_basi_kardes"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre susuyor. \"On iki yaşında,\" diyor sonunda. \"Her vapur biletinin arkasına martı çizerdi. Berbat martılar; hepsi ördeğe benzerdi.\"", en: "{npc:deniz_arman} goes quiet for a while. \"She's twelve,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}. \"She drew a gull on the back of every ferry ticket, terrible gulls, every single one of them looking like a duck.\"" }
          - { tr: "\"Entegrasyon olduğunda okuldaydı, körfezin karşı yakasında.\" Eliyle alevlerin üstüne olmayan bir körfez çiziyor. \"Herkes buraya düştüyse o da buralarda bir yerde.\"", en: "\"She was at school when it happened, way across the bay.\" {zamir:deniz_arman|onun|b} hand traces a bay that isn't there, over the flames. \"If everybody landed here, she's here too. Somewhere.\"" }
          - { tr: "Sesi sağlam çıkıyor, ama elleri yine titremeye başlamış. Senden bir şey istemiyor; istemeye dili varmıyor.", en: "{zamir:deniz_arman|onun|b} voice holds steady, but those hands are shaking again. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't asking you for anything. Can't bring {zamir:deniz_arman|kendi} to." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Onu bulacağız. Söz.\"", en: "\"We'll find her. I promise.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "ates_basi_soz", agirlik: 40 }
              - bayrak: "deniz_kardese_soz_verildi"
              - gorev: { deniz_kardesi: "basla" }
              - tohum: { olay: "deniz_kardes_ipucu", gecikme: { min: 3, max: 6 }, kosul: { yoldas: "deniz_arman" }, hatirlatma: { tr: "Ateş başında {npc:deniz_arman|e} kardeşi hakkında söylediğin söz hâlâ ortada.", en: "What you told {npc:deniz_arman} about {zamir:deniz_arman|onun} sister by the fire is still hanging out there." } }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Elimden geleni yaparım. Söz veremem.\"", en: "\"I'll do what I can. I can't promise.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { deniz_arman: { saygi: 6, guven: 3 } }
              - gorev: { deniz_kardesi: "basla" }
              - tohum: { olay: "deniz_kardes_ipucu", gecikme: { min: 5, max: 9 }, kosul: { yoldas: "deniz_arman" }, hatirlatma: { tr: "Ateş başında {npc:deniz_arman|e} kardeşi hakkında söylediğin söz hâlâ ortada.", en: "What you told {npc:deniz_arman} about {zamir:deniz_arman|onun} sister by the fire is still hanging out there." } }
            sonraki: "@akis"
          - id: "gercek"
            etiket: { tr: "\"Kendini hazırla. Belki de o...\"", en: "\"Brace yourself. She might not...\"" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - iliski: { deniz_arman: { guven: -6, baglilik: -4 } }
              - hafiza: { npc: "deniz_arman", id: "umudu_kirdi", agirlik: -25 }
            sonraki: "@akis"

      - id: "kamp_ates_basi_seviye"
        paragraflar:
          - { tr: "Birinin sormasını bekliyorsun. Sonunda diş hekimi asistanı yarı şaka soruyor; sen de gerçek rakamı söylüyorsun.", en: "You wait for somebody to ask. Eventually the hygienist does, half joking. You give the real number." }
          - { tr: "Ateşin çıtırtısı birden kulak tırmalayacak kadar yüksek geliyor. Resim öğretmeni elini ağzına götürüyor; kargo şoförüyse vergi öder gibi çantasını sessizce sana doğru itiyor.", en: "All of a sudden the crackle of the fire is very loud. The art teacher puts a hand over her mouth. The delivery driver quietly nudges his bag toward you, like he's paying a tax." }
          - { tr: "{npc:deniz_arman} gülmüyor. Aradaki mesafeyi ölçer gibi önce sana, sonra onlara, sonra yine sana bakıyor.", en: "{npc:deniz_arman} doesn't laugh. {zamir:deniz_arman|o|b} look{zamir:deniz_arman|s} at you, then at them, then back at you, like measuring the distance in between." }
        secenekler:
          - id: "vergi_yok"
            etiket: { tr: "Çantayı geri it: \"Burada vergi yok.\"", en: "Push the bag back. \"No taxes here.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 3 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Çantayı al; yükü güçlü olan taşır", en: "Take the bag. The strong carry the load" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - esya: { kaynak_suyu: 2 }
              - itibar: { lonca: 2 }
              - iliski: { deniz_arman: { guven: -5, korku: 3 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 4: kardeşin izi
  - id: "deniz_kardes_ipucu"
    konum: ["kirik_istasyon"]
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 8, max: 20 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 6
    etiketler: ["deniz", "gizem", "kesif"]
    gerilim: 3
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Duvardaki martı", en: "The gull on the wall" }
    sahne: "deniz_kardes_ipucu_1"
    sahneler:
      - id: "deniz_kardes_ipucu_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Hayatta kalanlarla ilgili bir söylentinin peşinden {yer:kirik_istasyon|e} vardınız. İkinci peronun tavanı çökmüş, enkazın arasından mor gökyüzü görünüyor. {npc:deniz_arman} geride kalmış, bozuk bir otomatın camını zorluyor.", en: "A rumor about survivors brings you to the {yer:kirik_istasyon}, where the roof over Platform Two has caved in and the purple sky shows through the wreckage. {npc:deniz_arman} has fallen behind, trying to jimmy open a dead vending machine." }
          - { tr: "Duvarı ilk sen görüyorsun. Fayansların üstüne belki bir anahtarla, aceleyle kazınmış birkaç satır; altında da bir kuş var: ördeğe benzeyen bir martı.", en: "You're the one who sees the wall. A few lines scratched into the tile in a hurry, maybe with a key. And under them, a bird: a gull that looks exactly like a duck." }
          - { tr: "Okuyorsun: \"Buradaydım, iyiyim. Göğsünde işaret olanlar bizi topluyor; ben seçilmişmişim, öyle diyorlar. Martıyı unutma.\"", en: "You read it: \"I was here, I'm okay. The people with the marks on their chests are gathering us up, and they say I'm chosen. Don't forget the gull.\"" }
          - { tr: "{npc:deniz_arman} hâlâ otomatla boğuşuyor, duvarı henüz görmedi. Birkaç saniyen var.", en: "{npc:deniz_arman} is still wrestling with the vending machine and hasn't seen it yet. You've got a few seconds." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Kazıntılar en fazla on günlük; çizgilerin içinde fayans tozu duruyor hâlâ. Son satır ötekilerden derin oyulmuş, sanki biri omzunun üstünden bakarken yazılmış.", en: "The scratches are ten days old, tops. There's still tile dust in the grooves. The last line was cut deeper than the rest, like somebody was watching over her shoulder." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem bu peronda bir etiket kaydetmiş: 'aday', tek kişi, on iki yaş. fazlasını görmek için derine inmem gerek. derine inen iz bırakır.", en: "the System logged a tag on this platform: 'candidate,' one person, age twelve. to see more i'd have to dig deeper. digging leaves marks." }
        secenekler:
          - id: "goster_ona"
            etiket: { tr: "{npc:deniz_arman|i} çağır, duvarı göster", en: "Call {npc:deniz_arman} over and show {zamir:deniz_arman|onu} the wall" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 45 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_gosterdi"
          - id: "sil"
            etiket: { tr: "İşaretlilerden söz eden satırı kazıyıp sil", en: "Scratch out the line about the marked people" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - bolge: "kirik_istasyon"
              - yalan: { npc: "deniz_arman", konu: "kardes_notu_yalani" }
              - bayrak: "kardes_notu_saklandi"
              - bayrak: "kardes_izi_bulundu"
              - bilgi: "kardes_notu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_sildi"
          - id: "yanki_ara"
            etiket: { tr: "Sese söyle, Sistem kayıtlarında kızı arasın", en: "Tell the voice to search the System logs for her" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 20 } } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - bolge: "kirik_istasyon"
              - yozlasma: 3
              - dikkat: 3
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_kayit"
          - id: "iz_sur"
            etiket: { tr: "Duvarı göster, hemen izlerin peşine düş", en: "Show {zamir:deniz_arman|onu} the wall, then follow the tracks" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 6, saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 40 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_tunel"
          - id: "toz"
            tur: "gosteris"
            etiket: { tr: "Peronun tozunu bir sayfa gibi oku", en: "Read the dust on the platform like a page" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { per: 14 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 6, saygi: 8, korku: 5 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 40 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_okuma"

      - id: "deniz_kardes_ipucu_gosterdi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:deniz_arman} yanına gelip duvara bakıyor ve olduğu yerde kalakalıyor. Çizgilerin içindeki tozu silmekten korkar gibi parmakları martının üstünde, değmeden geziniyor.", en: "{npc:deniz_arman} comes over, looks at the wall, and stops dead. {zamir:deniz_arman|onun|b} fingers hover over the gull, like {zamir:deniz_arman|o} {zamir:deniz_arman|is} scared to wipe the dust out of the lines." }
          - { tr: "\"Ördek,\" diyor, sesi kırılarak. \"Yine ördek çizmiş. Yaşıyor... On gün önce yaşıyordu.\"", en: "\"A duck,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, and {zamir:deniz_arman|onun} voice breaks. \"She drew a duck again, she's alive. Ten days ago she was alive.\"" }
          - { tr: "Sonra son satırı okuyor ve yüzündeki ışık ağır ağır değişiyor. \"Seçilmiş,\" diye tekrarlıyor. \"Ne demek bu? Kim seçiyor, ne için?\"", en: "Then {zamir:deniz_arman|o} read{zamir:deniz_arman|s} the last line, and the light in {zamir:deniz_arman|onun} face slowly changes. \"Chosen,\" {zamir:deniz_arman|o} repeat{zamir:deniz_arman|s}. \"What does that even mean, chosen by who, for what?\"" }
          - metin: { tr: "Ateş başında verdiğin söz ikinizin arasında asılı duruyor. {npc:deniz_arman} bir sözün bu kadar çabuk bir yere varabileceğine inanamıyormuş gibi sana bakıyor.", en: "The promise you made by the fire hangs in the air between you. {npc:deniz_arman} looks at you like {zamir:deniz_arman|o} can't believe a promise could get somewhere this fast." }
            kosul: { bayrak: "deniz_kardese_soz_verildi" }
        secenekler:
          - id: "vaiz"
            etiket: { tr: "\"İşaretlileri bulalım, bakalım ne vaaz ediyorlar.\"", en: "\"Let's find the marked ones and hear them preach.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"
          - id: "once_guc"
            etiket: { tr: "\"Önce güçlenelim. Sonra onları buluruz.\"", en: "\"Get stronger first. Then we find them.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 5, baglilik: -3 } }
            sonraki: "@akis"
          - id: "saril"
            etiket: { tr: "Hiçbir şey söyleme; ona sarıl", en: "Don't say anything. Just hold onto {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_sildi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Yerden bir taş alıp son satırın üstünden geçiriyorsun; bir kez, iki kez, harfler tek bir beyaz yara izine dönene kadar. Fayansın gıcırtısı peron boyunca yankılanıyor.", en: "You drag a rock across the last line, once, twice, until the letters turn into one white scar. The screech of it echoes down the platform." }
          - { tr: "{npc:deniz_arman} sesi duyup koşa koşa geliyor. Martıyı görünce ilk satırları okuyor ve dizlerinin üstüne çöküveriyor: \"Yaşıyor. İyiymiş; iyiyim diye yazmış.\"", en: "{npc:deniz_arman} hears it and comes running, sees the gull, reads the first lines, and drops to {zamir:deniz_arman|onun} knees. \"She's alive. She's okay, she wrote that she's okay.\"" }
          - { tr: "Derken parmakları senin kazıdığın beyaz izin üstünde duruyor. \"Bu ne?\" diye soruyor. \"Burada bir şey daha yazıyordu.\"", en: "Then {zamir:deniz_arman|onun} fingers stop on the white scar you left. \"What's this?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"There was something else written here.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yalan kaydedildi. bu sefer bir duvara da kazındı. duvarlar unutmaz; bazen insanlardan bile iyi hatırlar.", en: "lie recorded. this time it's carved into a wall too, and walls don't forget; sometimes they remember better than people." }
        secenekler:
          - id: "boyleydi"
            etiket: { tr: "\"Ben geldiğimde de böyleydi.\"", en: "\"It was like that when I got here.\"" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "@akis"
          - id: "dogru"
            etiket: { tr: "Doğruyu söyle: onu korumak için sildin", en: "Tell the truth: you scratched it out to protect {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - bayrak_kaldir: "kardes_notu_saklandi"
              - iliski: { deniz_arman: { guven: -8, saygi: 4 } }
              - hafiza: { npc: "deniz_arman", id: "notu_sildi_itiraf", agirlik: -20 }
            sonraki: "deniz_kardes_ipucu_itiraf"
          - id: "okunmuyor"
            etiket: { tr: "\"Okunmuyor. Boş ver.\"", en: "\"Can't make it out. Let it go.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { deniz_arman: { guven: -2 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_itiraf"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "\"Göğsünde işaret olanlar çocukları topluyormuş,\" diyorsun. \"Ona seçilmişsin demişler. Bunu okusan peşlerinden koşacağını biliyordum.\"", en: "\"The people with the marks on their chests are gathering kids up,\" you say. \"They told her she's chosen. I knew if you read that, you'd go running after them.\"" }
          - { tr: "{npc:deniz_arman} ayağa kalkıp uzun uzun yüzüne bakıyor; bakışında öfke yok, öfkeden ağır bir şey var. \"Benim yerime karar verdin,\" diyor. \"Hem de kardeşim hakkında.\"", en: "{npc:deniz_arman} gets up and looks at you for a long time, not angry, but with something heavier. \"You decided for me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"About my sister.\"" }
          - { tr: "\"Ama sonra söyledin.\" Derin bir nefes alıyor. \"O kısmı da unutmayacağım.\"", en: "\"But then you told me.\" A breath. \"I'll remember that part too.\"" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile; bahane uydurma", en: "Apologize. No excuses" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 } }
            sonraki: "@akis"
          - id: "yine"
            etiket: { tr: "\"Yine yapardım. Seni kaybedemem.\"", en: "\"I'd do it again. I can't lose you.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 6, guven: -4 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_kayit"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Sese izin veriyorsun. Gözlerinin ardında bir şey açılıyor: rakamlar, etiketler, binlerce satır, hepsi bir anda ve hepsi yanlış renkte akıyor.", en: "You give the voice the go-ahead. Something opens up behind your eyes: numbers, tags, thousands of lines all at once, every one of them the wrong color." }
          - { tr: "Ses tek bir satırda duruyor: [ADAY · 12 · ÖN SEÇİM: {fraksiyon:yukselenler} · DURUM: NAKLEDİLDİ]. Ardından her şey kesiliyor, burnundan sıcak bir şey sızmaya başlıyor.", en: "The voice stops on a single line: [CANDIDATE · 12 · PRE-SELECTED: {fraksiyon:yukselenler} · STATUS: TRANSFERRED]. Then everything cuts out, and something warm starts running from your nose." }
          - { tr: "{npc:deniz_arman} duvarın önünde dikiliyor; martıyı görmüş, satırları okumuş, şimdi gözünü sana dikmiş. \"Burnun kanıyor,\" diyor. \"Ne yaptın sen?\"", en: "{npc:deniz_arman} is standing at the wall; saw the gull, read the lines, and now {zamir:deniz_arman|o} {zamir:deniz_arman|is} staring at you. \"Your nose is bleeding. What did you just do?\"" }
        secenekler:
          - id: "soyle"
            etiket: { tr: "Gördüğün satırı ona olduğu gibi söyle", en: "Tell {zamir:deniz_arman|onu} exactly what you saw" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
              - bilgi: "yukselenler_kardes"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Satırı kendine sakla; \"Bir şey yok\" de", en: "Keep the line to yourself. Say \"It's nothing\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - bilgi: "yukselenler_kardes"
              - yalan: { npc: "deniz_arman", konu: "kardes_notu_yalani" }
              - bayrak: "kardes_notu_saklandi"
            sonraki: "@akis"
          - id: "ses_buldu"
            etiket: { tr: "\"Ses buldu onu. Bana güven.\"", en: "\"The voice found her. Trust me.\"" }
            goster: { bayrak: "deniz_yankiyi_biliyor" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { deniz_arman: { guven: 4, korku: 3 } }
              - iliski: { yanki: { saygi: 4 } }
              - bilgi: "yukselenler_kardes"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_tunel"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:deniz_arman} duvarı okuyup martıya bir kez dokunuyor, sonra tek kelime etmeden raylara atlıyor. İzler tünelin karanlığına iniyor: küçük spor ayakkabıları, iri botlar, hepsi aynı yöne gidiyor.", en: "{npc:deniz_arman} reads the wall, touches the gull once, and drops down onto the tracks without a word. The footprints lead into the dark of the tunnel: small sneakers, big boots, all headed the same way." }
          - { tr: "Elli adım sonra duvardaki kablolar vızıldamaya başlıyor. Sıvanın içinden bir şey kendini söküp başını kaldırıyor, etrafa kıvılcım saçarak tıslıyor.", en: "Fifty yards in, the cables along the wall start to hum. Something tears itself loose from the plaster, rears its head, and hisses out a spray of sparks." }
          - { tr: "\"Arkamda kal,\" diyor {npc:deniz_arman}, tabela direğini kaldırıp. Daha önce onu hiçbir konuda bu kadar emin konuşurken duymamıştın.", en: "\"Stay behind me,\" {npc:deniz_arman} says, raising the signpost. You've never heard {zamir:deniz_arman|onu} sound that sure of anything." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Yılan akımını tavandaki eski hattan çekiyor. Hattı koparırsan yavaşlar; ama hatta ulaşmak için önce yılanın önünden geçmen gerek.", en: "The serpent's pulling current from the old line in the ceiling. Cut that line and it slows down. But you'd have to get past it to reach it." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Yanında dur, savaş", en: "Stand with {zamir:deniz_arman|onu} and fight" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit", "karanlik"], kazan: "deniz_kardes_ipucu_iz", kaybet: "deniz_kardes_ipucu_yenilgi", kac: "deniz_kardes_ipucu_geri" }
          - id: "one_gec"
            etiket: { tr: "Öne geç; darbeyi sen al", en: "Step in front. Take the hit yourself" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - can: -10
              - iliski: { deniz_arman: { baglilik: 6 } }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit", "karanlik"], kazan: "deniz_kardes_ipucu_iz", kaybet: "deniz_kardes_ipucu_yenilgi", kac: "deniz_kardes_ipucu_geri" }
          - id: "geri_cek"
            etiket: { tr: "Onu geri çek; bu tünel ikinizi de öldürür", en: "Pull {zamir:deniz_arman|onu} back. This tunnel will kill you both" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { guven: -4, saygi: 2 } }
            sonraki: "deniz_kardes_ipucu_geri"
          - id: "sok"
            tur: "gosteris"
            etiket: { tr: "Yılanı duvardan sök, ikiye ayır", en: "Rip the serpent out of the wall and snap it" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { str: 14 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
              - dikkat: 2
              - xp: 120
              - iliski: { deniz_arman: { korku: 6, saygi: 8 } }
            sonraki: "deniz_kardes_ipucu_iz"

      - id: "deniz_kardes_ipucu_iz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Yılan son bir kıvılcım yağmuruyla sönünce tünel yeniden karanlığa ve sessizliğe gömülüyor. {npc:deniz_arman} izlerin peşinden yirmi adım daha ilerleyip eğiliyor ve yerden bir şey alıyor.", en: "The serpent dies in one last shower of sparks, and the tunnel goes dark and quiet again. {npc:deniz_arman} follows the tracks another twenty yards, then bends and picks something up." }
          - { tr: "Buruşmuş bir vapur bileti bu. Arkasında tükenmez kalemle çizilmiş, ördeğe benzeyen bir martı var.", en: "A crumpled ferry ticket. On the back, in ballpoint, a gull that looks like a duck." }
          - { tr: "İleride izler çatallanıp kayboluyor; o botları giyenler iz silmeyi iyi biliyormuş.", en: "Up ahead the tracks fork and vanish. Whoever wore those boots knew how to cover a trail." }
          - { tr: "{npc:deniz_arman} bileti göğüs cebine koyup düğmesini ilikliyor. \"{fraksiyon:yukselenler},\" diyor. \"İşaretliler onlar, değil mi?\"", en: "{npc:deniz_arman} tucks the ticket into a breast pocket and buttons it shut. \"{fraksiyon:yukselenler},\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"The marked ones, that's them, right?\"" }
        secenekler:
          - id: "bulacagiz"
            etiket: { tr: "\"Evet. Ve onları bulacağız.\"", en: "\"Yeah. And we're going to find them.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"
          - id: "uzak"
            etiket: { tr: "\"Evet. Ve onlardan uzak duracağız.\"", en: "\"Yeah. And we're staying away from them.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 3, guven: -3 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_yenilgi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Akım göğsünden girip ayak tabanlarından çıkıyor, bir an her yer bembeyaz kesiliyor. Ardından {npc:deniz_arman|in} kolları seni rayların üstünde geri sürüklüyor.", en: "The current goes in through your chest and out through the soles of your feet, and for a second everything is white. Then {npc:deniz_arman|pos} arms are dragging you back down the tracks." }
          - { tr: "Perona vardığınızda ikinizin de kaşları yanmış, saçlarınız dimdik olmuş. {npc:deniz_arman} titreye titreye gülüyor, ağlıyor, sonra yine gülüyor.", en: "By the time you make the platform, both your eyebrows are singed and your hair's standing straight up. {npc:deniz_arman} laughs, shaking, then cries, then laughs again." }
          - { tr: "\"Alamadık,\" diyor. \"Orada bir şey vardı, gördüm. Alamadık.\"", en: "\"We didn't get it,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"There was something down there, I saw it. We didn't get it.\"" }
        secenekler:
          - id: "donecegiz"
            etiket: { tr: "\"Döneceğiz. Daha güçlü döneceğiz.\"", en: "\"We'll come back. Stronger.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "yanik"
            etiket: { tr: "Yanıklarınızı sar; önce onunkileri", en: "Patch up the burns. {npc:deniz_arman|pos} first" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - can: 10
              - iliski: { deniz_arman: { baglilik: 5 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_geri"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Tünelin ağzından geri geri çekiliyorsunuz. Vızıltı bir süre peşinizden gelip sonra yeniden duvara gömülüyor.", en: "You back out of the tunnel mouth. The hum follows you a little way, then sinks back into the wall." }
          - { tr: "{npc:deniz_arman} peronun kenarında durup karanlığa bakıyor. \"Oradaydı,\" diyor. \"İzleri tam oradaydı.\"", en: "{npc:deniz_arman} stands at the edge of the platform, staring into the dark. \"She was right there,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Her tracks were right there.\"" }
          - { tr: "Sonra dönüp fotoğrafını çeker gibi duvardaki martıya uzun uzun bakıyor. Telefonu yok artık; geriye yalnızca gözleri kalmış.", en: "Then {zamir:deniz_arman|o} turn{zamir:deniz_arman|s} and stare{zamir:deniz_arman|s} at the gull on the wall for a long time, like taking a picture. No phone anymore. Just eyes." }
        secenekler:
          - id: "yaninda"
            etiket: { tr: "Yanına git; sessizce bekle", en: "Stand next to {zamir:deniz_arman|onu}. Wait in silence" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "soralim"
            etiket: { tr: "\"İşaretlileri soralım. Biri mutlaka biliyordur.\"", en: "\"Let's ask around about the marked ones. Somebody knows.\"" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 3 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_okuma"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Çömeldiğin an peronun tozu seninle konuşmaya başlıyor. Yirmi üç çift ayak, on dördü çocuk. İçlerinden biri tam burada durup duvara dönmüş, biri onu ha bire geri çağırıyormuş gibi iki kez duvardan uzaklaşmış.", en: "You crouch, and the dust on the platform starts talking. Twenty-three pairs of feet, fourteen of them kids. One of them stopped right here, turned to the wall, and pulled away twice, like somebody kept calling her back." }
          - { tr: "\"On gün önce,\" diyorsun yüksek sesle. \"Sabah vakti. Onları güden üç yetişkin var; biri topallıyor, sol elinde de yüzük taşıyor.\"", en: "\"Ten days ago,\" you say out loud. \"Morning, three adults herding them. One limps, and wears a ring on his left hand.\"" }
          - { tr: "{npc:deniz_arman} önce sana, sonra yere, sonra yine sana bakıyor. Senin gördüklerinden hiçbirini göremiyor orada; onun gözünde yalnızca toz var.", en: "{npc:deniz_arman} looks at you, then the floor, then you again. There's nothing down there {zamir:deniz_arman|o} can see. Just dust." }
          - { tr: "\"Bunu nasıl yapıyorsun?\" diye fısıldıyor. Sesinde umut da var, korku da; hangisinin ağır bastığını kendisi de bilmiyor.", en: "\"How are you doing that?\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. There's hope in it, and fear, and {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't know which one's winning." }
        secenekler:
          - id: "bilmiyorum"
            etiket: { tr: "\"Bilmiyorum. Ama işe yarıyor.\"", en: "\"No idea. But it works.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Duvardaki martıdan beri beyaz giyenlerin adı kulağına çalınıyor.", en: "Since the gull on the wall, you keep hearing about the people in white." } }
            sonraki: "@akis"
          - id: "korkuyorum"
            etiket: { tr: "İçtenlikle \"Ben de korkuyorum\" de", en: "Say \"I'm scared too,\" and mean it" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4, korku: -4 } }
            sonraki: "@akis"
          - id: "alis"
            etiket: { tr: "\"Alış. Daha fazlası gelecek.\"", en: "\"Get used to it. There's more coming.\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 1 }
              - iliski: { deniz_arman: { korku: 6, saygi: 6 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 5: son seçim (ana yay)
  - id: "deniz_son_secim"
    konum: ["us"]
    perde: [1]
    ana_yay: { gun: 22 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "yukselenler"]
    gerilim: 4
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Giden ve kalan", en: "The one who goes" }
    sahne: "deniz_son_secim_1"
    sahneler:
      - id: "deniz_son_secim_1"
        paragraflar:
          - { tr: "İkindiye doğru kampa iki kişi çıkageliyor. Üstlerinde kirli gri giysiler, göğüslerinde elle dikilmiş aynı işaret var. Silahları yok; ömründe silaha ihtiyaç duymamış insanların rahatlığıyla yürüyorlar.", en: "Two people walk into camp late in the afternoon: dirty gray clothes, the same mark hand-stitched over each heart. No weapons. They walk with the ease of people who've never once needed any." }
          - metin: { tr: "\"Bizi Peygamber gönderdi,\" diyor genç olanı, gözünü {npc:deniz_arman|den} ayırmadan. \"{npc:vahit}, Sistem ona bir martı göstermiş diyor. Ördeğe benzeyen bir martı.\"", en: "\"The Prophet sent us,\" says the younger one, eyes locked on {npc:deniz_arman}. \"{npc:vahit|tam} says the System showed him a gull. One that looks like a duck.\"" }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "\"Peygamber öldü,\" diyor genç olanı, gözünü {npc:deniz_arman|den} ayırmadan. \"Ama ses susmadı. Bize bir martı gösterdi; ördeğe benzeyen bir martı.\"", en: "\"The Prophet is dead,\" says the younger one, eyes locked on {npc:deniz_arman}. \"But the voice didn't stop. The voice showed us a gull, one that looks like a duck.\"" }
            kosul: { npc_olu: "vahit" }
          - { tr: "{npc:deniz_arman|in} elindeki tas toprağa düşüyor. Bunu bilmelerinin imkânı yok.", en: "The bowl in {npc:deniz_arman|pos} hands hits the dirt. There's no way they could know that." }
          - metin: { tr: "\"Kardeşin bizimle,\" diyor yaşlı olanı, katlanmış bir kâğıt uzatarak. Kâğıtta ördeğe benzeyen bir martı var. \"Seçilmişlerin arasında; güvende, karnı tok, herkes onu seviyor. Seni bekliyor. Gel, kendi gözünle gör.\"", en: "\"Your sister is with us,\" says the older one, holding out a folded scrap of paper: a gull that looks like a duck. \"She's among the Chosen, safe and fed and loved, and she's waiting for you. Come see for yourself.\"" }
            kosul: { bayrak_yok: "kardes_notu_saklandi" }
          - metin: { tr: "\"Kardeşin bizimle,\" diyor yaşlı olanı, katlanmış bir kâğıt uzatarak. Kâğıtta ördeğe benzeyen bir martı var. \"Geçtiği her istasyonun duvarına bizi yazdı: işaretlileri, seçildiğini.\" Sonra başını {npc:deniz_arman|e} çeviriyor: \"Okumadın mı?\"", en: "\"Your sister is with us,\" says the older one, holding out a folded scrap of paper: a gull that looks like a duck. \"She wrote about us on every station wall she passed: the marked ones, being chosen.\" Then the preacher turns to {npc:deniz_arman}: \"Didn't you read it?\"" }
            kosul: { bayrak: "kardes_notu_saklandi" }
          - metin: { tr: "Ardından ikisi birden sana dönüp tek kelime etmeden toprağa diz çöküyor. {npc:deniz_arman} olanları görüyor.", en: "Then both of them turn to you and kneel right there in the dirt, without a word. {npc:deniz_arman} sees it." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Genç olanın seviyesi 6. Yaşlınınki boş görünüyor; biri onu gizliyor. İkisi de yalan söylemiyor, ama gerçeğin tamamını ikisi de bilmiyor.", en: "The young one's level 6, and the older one's level reads blank: somebody's hiding it. Neither of them is lying. Neither of them knows the whole truth, either." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seslerinde bir sinyal var. benimki değil, ama tanıdık. bu insanlara bir şey fısıldıyor; o fısıldayan şey seni de istiyor.", en: "there's a signal in their voices. not mine, but familiar. something is whispering to these people, and whatever it is wants you too." }
          - kosul: { bayrak: ["kardes_notu_saklandi", "yanki_bagi"] }
            metin: { tr: "duvardan kazıdığın satır şimdi bu iki ağızda. er geç biri söyleyecek. söyleyen sen olsan iyi olur.", en: "the line you scratched off that wall is in these two mouths now. sooner or later somebody says it. better if it's you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bir şey söyle. Lütfen. Ne düşünüyorsun, söyle.\"", en: "\"Say something. Please. Tell me what you're thinking.\"" }
          - npc: "deniz_arman"
            metin: { tr: "\"Duvardaki martı... Kâğıttaki de o. Tıpatıp aynısı.\"", en: "\"The gull on the wall... it's the same one. Exactly the same.\"" }
            kosul: { bayrak: "kardes_izi_bulundu" }
        secenekler:
          - id: "kal_iste"
            etiket: { tr: "Kalmasını iste; birlikte bulacağınıza söz ver", en: "Ask {zamir:deniz_arman|onu} to stay. Promise you'll find her together" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "deniz_son_secim_gidis", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { iliski: { deniz_arman: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 50 }
            sonraki: "deniz_son_secim_kalir"
          - id: "vapur"
            etiket: { tr: "Vapuru hatırlat: on yıl, martılar, simitler", en: "Remind {zamir:deniz_arman|onu}: ten years, the gulls, the pretzels" }
            goster: { bayrak_yok: "kardes_notu_saklandi" }
            gerekli: { iliski_min: { deniz_arman: { guven: 50, baglilik: 50 } } }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { baglilik: 12, guven: 8 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 55 }
            sonraki: "deniz_son_secim_kalir"
          - id: "senin_kararin"
            etiket: { tr: "\"Senin kardeşin, senin kararın.\"", en: "\"Your sister. Your call.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { deniz_arman: { saygi: 12, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "kararina_saygi", agirlik: 40 }
            sonraki: "deniz_son_secim_gidis"
          - id: "kov"
            tur: "aciga_vur"
            etiket: { tr: "Vaizleri kov; gerçek gücünü göster", en: "Run the preachers off. Show them what you really are" }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - itibar: { yukselenler: -6 }
              - ahlak: { duzen: 3, merhamet: -3 }
              - iliski: { deniz_arman: { korku: 8, guven: -10 } }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - bayrak: "deniz_guveni_yarali"
              - hafiza: { npc: "deniz_arman", id: "vaizleri_kovdu", agirlik: -35 }
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Vaizleri kovduğun geceden beri yollar sakin değil.", en: "The roads haven't been quiet since the night you ran those preachers off." } }
            sonraki: "deniz_son_secim_yarali"
          - id: "taklit"
            etiket: { tr: "Herkesin önünde çizimin sahte olduğunu kanıtla", en: "Prove the drawing's a forgery, in front of everyone" }
            gerekli: { stat: { per: 12 } }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { yukselenler: -3 }
              - iliski: { deniz_arman: { guven: 6, saygi: 8 } }
            sonraki: "deniz_son_secim_taklit"
          - id: "itiraf"
            etiket: { tr: "Duvardan kazıdığın satırı itiraf et", en: "Confess to the line you scratched off the wall" }
            goster: { bayrak: "kardes_notu_saklandi" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - bayrak_kaldir: "kardes_notu_saklandi"
              - iliski: { deniz_arman: { guven: -12, saygi: 6 } }
            sonraki: "deniz_son_secim_itiraf"
          - id: "emret"
            tur: "gosteris"
            etiket: { tr: "Diz çökenlere bildikleri her şeyi anlatmalarını emret", en: "Order the kneeling pair to tell you everything" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { cha: 14 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - dikkat: 3
              - itibar: { yukselenler: 4 }
              - iliski: { deniz_arman: { korku: 10, saygi: 6 } }
              - bilgi: "yukselenler_vaadi"
            sonraki: "deniz_son_secim_tanri"

      - id: "deniz_son_secim_kalir"
        paragraflar:
          - { tr: "{npc:deniz_arman} kâğıttaki martıya uzun uzun bakıyor. Sonra kâğıdı katlayıp vaize geri uzatıyor, elini de senin avucuna bırakıyor.", en: "{npc:deniz_arman} stares at the paper gull for a long time. Then {zamir:deniz_arman|o} fold{zamir:deniz_arman|s} it, hand{zamir:deniz_arman|s} it back to the preacher, and slip{zamir:deniz_arman|s} {zamir:deniz_arman|onun} hand into yours." }
          - { tr: "\"Onu bulacağım,\" diyor vaizlere. \"Ama sizin kapınızdan değil, bunun kapısından.\" Başıyla seni işaret ediyor.", en: "\"I'm going to find her,\" {zamir:deniz_arman|o} tell{zamir:deniz_arman|s} the preachers. \"Just not through your door. Through this one's,\" {zamir:deniz_arman|o} add{zamir:deniz_arman|s}, with a nod your way." }
          - { tr: "Vaizler itiraz etmiyor. Bu da kehanette yazılıymış gibi gülümseyip sisin içine geri dönüyorlar.", en: "The preachers don't argue. They smile, like this was prophesied too, and walk back into the fog." }
          - { tr: "O gece ateşin başında {npc:deniz_arman} uzun süre ağzını açmıyor. Sonra gözlerini alevden kaldırmadan soruyor: \"Neye dönüşüyorsun sen? Canavara mı, tanrıya mı?\"", en: "That night by the fire, {npc:deniz_arman} doesn't say anything for a long time. Then, without looking up from the flames: \"What are you turning into? A monster, or a god?\"" }
        secenekler:
          - id: "hicbiri"
            etiket: { tr: "\"Hiçbirine. Senin arkadaşın olarak kalacağım.\"", en: "\"Neither. I'm staying your friend.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"
          - id: "pusula"
            etiket: { tr: "\"Bilmiyorum. Bu yüzden yanımda olmalısın.\"", en: "\"I don't know. That's why I need you here.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "pusula_oldu", agirlik: 40 }
            sonraki: "@akis"
          - id: "ikisi"
            etiket: { tr: "\"Belki ikisi de. Fark eder mi?\"", en: "\"Maybe both. Does it matter?\"" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - iliski: { deniz_arman: { korku: 6, guven: -4 } }
            sonraki: "@akis"
          - id: "canavar"
            etiket: { tr: "\"Canavar olsaydım o vaizler şimdi sağ olmazdı.\"", en: "\"If I were a monster, those preachers would be dead.\"" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - iliski: { deniz_arman: { korku: 4, saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_gidis"
        paragraflar:
          - { tr: "{npc:deniz_arman} önce kâğıttaki martıya, sonra sana bakıyor. Kararını çoktan vermiş; yalnızca senin bunu görmeni bekliyor.", en: "{npc:deniz_arman} looks at the paper gull, then at you. The decision's already made. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is} just waiting for you to see it." }
          - { tr: "\"On iki yaşında,\" diyor. \"O orada tek başına, ben burada senin gölgende güvendeyim. Bu hiç adil değil.\"", en: "\"She's twelve,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"She's alone over there, and I'm safe here in your shadow. That's not fair.\"" }
          - { tr: "Sırt çantasını omzuna vuruyor. Vaizlerden biri, üstüne aynı işaret dikilmiş gri bir şal uzatıyor; {npc:deniz_arman} şalı almıyor, ama geri de çevirmiyor.", en: "{npc:deniz_arman} shoulders the pack. One of the preachers holds out a gray shawl with the same mark stitched on it. {npc:deniz_arman} doesn't take it, but doesn't turn it down either." }
          - { tr: "\"Bana öyle bakma,\" diyor kampın kıyısında durup. \"Seni bırakmıyorum. Onu almaya gidiyorum.\"", en: "\"Don't look at me like that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} at the edge of camp. \"I'm not leaving you. I'm going to get her.\"" }
        secenekler:
          - id: "sarilip_birak"
            etiket: { tr: "Ona sarıl, sonra gitmesine izin ver", en: "Hug {zamir:deniz_arman|onu}. Then let {zamir:deniz_arman|onu} go" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_sarildi", agirlik: 50 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "\"O işareti senin göğsüne de dikecekler. Kendine dikkat et.\"", en: "\"They'll stitch that mark on you too. Be careful.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_uyarildi", agirlik: 25 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "\"Bir gün ikinizi de oradan çıkaracağım.\"", en: "\"One day I'm walking you both out of there.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_soz", agirlik: 45 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "arkani_don"
            etiket: { tr: "Arkanı dön, gidişini izleme", en: "Turn your back. Don't watch {zamir:deniz_arman|onu} go" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - iliski: { deniz_arman: { baglilik: -12, guven: -6 } }
              - hafiza: { npc: "deniz_arman", id: "arkasini_dondu", agirlik: -40 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"

      - id: "deniz_son_secim_yarali"
        paragraflar:
          - { tr: "Gerçek seviyeni gizlemeyi bırakıyorsun. Hava ağırlaşıyor; kamp ateşi, rüzgâr bile senden kaçmak istiyormuş gibi bir an yana yatıyor.", en: "You stop hiding your true level. The air gets heavy, and for a second the campfire leans sideways, like even the wind wants to get away from you." }
          - { tr: "Vaizler geri geri çekiliyor; korkudan değil, huşudan. \"Peygamber haklıymış,\" diye fısıldıyor genç olanı, sonra sis ikisini birden yutuyor.", en: "The preachers back away, not scared but awed. \"The Prophet was right,\" the young one breathes, and then the fog swallows them both." }
          - { tr: "{npc:deniz_arman} yerinden kıpırdamamış. Kâğıttaki martı hâlâ elinde, ama artık buruşmuş.", en: "{npc:deniz_arman} hasn't moved. The paper gull is still in {zamir:deniz_arman|onun} hand, crumpled now." }
          - { tr: "\"Benim yerime karar verdin,\" diyor usulca. \"Kalıyorum. Ama bunu unutmayacağım.\"", en: "\"You decided for me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, very quietly. \"I'm staying. But I won't forget this.\"" }
        secenekler:
          - id: "korumak"
            etiket: { tr: "\"Seni korumak için yaptım.\"", en: "\"I did it to protect you.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { guven: -2, saygi: 2 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile, içinden gelerek", en: "Apologize. Mean it" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6 } }
            sonraki: "@akis"
          - id: "hakliydim"
            etiket: { tr: "\"Haklıydım. Bir gün sen de göreceksin.\"", en: "\"I was right. Someday you'll see that.\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 3 }
              - iliski: { deniz_arman: { guven: -6, korku: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_taklit"
        paragraflar:
          - { tr: "Kâğıdı alıp ışığa tutuyorsun. Çizgiler fazla temiz, fazla özenli; on iki yaşında bir el bu kadar sabırlı olmaz. Biri duvardaki martıyı görüp kopyalamış.", en: "You take the paper and hold it up to the light. The lines are too clean, too careful; no twelve-year-old has hands that patient. Somebody saw the gull on a wall and copied it." }
          - { tr: "Vaizler göz göze geliyor. \"Kanıt dediğin bir araçtır,\" diyor yaşlı olanı, hiç utanmadan. \"Kardeşi yine de bizimle.\"", en: "The preachers trade a look. \"Proof is a tool,\" the older one says, not even embarrassed. \"The sister is still with us.\"" }
          - { tr: "Belki doğru söylüyor, belki de söylemiyor. {npc:deniz_arman} kâğıdı elinden alıp önce ikiye, sonra dörde, sonra sekize yırtıyor.", en: "Maybe that's true. Maybe not. {npc:deniz_arman} takes the paper out of your hand and tears it in half, then in quarters, then in eighths." }
          - { tr: "Vaizler gidiyor, {npc:deniz_arman} kalıyor. Ama onlarla birlikte bir şey daha gidiyor; adını koyamadığın bir şey.", en: "The preachers leave and {npc:deniz_arman} stays. But something goes with them, something you can't put a name to." }
        secenekler:
          - id: "gercekten"
            etiket: { tr: "\"Onu gerçekten bulacağız. Sahte martılarla değil.\"", en: "\"We'll find her for real. Not with fake gulls.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"
          - id: "ates"
            etiket: { tr: "Kâğıt parçalarını topla, ateşe at", en: "Gather the scraps and feed them to the fire" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_itiraf"
        paragraflar:
          - { tr: "\"Okudum,\" diyorsun; bütün başlar sana dönüyor. \"Duvardaki satırı ben kazıdım. Seni onlardan uzak tutmak için.\"", en: "\"I read it,\" you say, and everybody turns to look at you. \"I scratched that line off the wall. To keep you away from them.\"" }
          - { tr: "{npc:deniz_arman|in} yüzünden bir şey çekiliyor; kan değil, daha derinde bir şey. Vaizler tek kelime etmiyor. Gerek de yok.", en: "Something drains out of {npc:deniz_arman|pos} face; not blood, something deeper. The preachers don't say a word. They don't need to." }
          - { tr: "\"Kardeşim,\" diyor {npc:deniz_arman}. \"Kardeşimin sesini benden sakladın.\"", en: "\"My sister,\" {npc:deniz_arman} says. \"You hid my sister's voice from me.\"" }
        secenekler:
          - id: "anlarim"
            etiket: { tr: "\"Gitmek istiyorsan anlarım.\"", en: "\"If you want to go, I get it.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { deniz_arman: { saygi: 6 } }
            sonraki: "deniz_son_secim_gidis"
          - id: "yalvar"
            etiket: { tr: "Kalması için yalvar", en: "Beg {zamir:deniz_arman|onu} to stay" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "deniz_son_secim_gidis", basarisiz_etkiler: [{ ahlak: { insanlik: 1 } }] }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - bayrak: "deniz_guveni_yarali"
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "deniz_son_secim_kalir_yarali"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme, kararı ona bırak", en: "Say nothing. Leave the choice to {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { deniz_arman: { baglilik: -6 } }
            sonraki: "deniz_son_secim_gidis"

      - id: "deniz_son_secim_kalir_yarali"
        paragraflar:
          - { tr: "{npc:deniz_arman} kampın kıyısına, vaizlerin beklediği sisli boşluğa uzun süre bakıyor. Sonunda sırt çantasını yere bırakıyor.", en: "{npc:deniz_arman} stares at the edge of camp for a long time, at the fog where the preachers are waiting. Then {zamir:deniz_arman|o} drop{zamir:deniz_arman|s} the pack." }
          - { tr: "\"Kalıyorum,\" diyor. \"Sana güvendiğimden değil. Gidersem başına neler geleceğini düşünmeye dayanamadığımdan.\"", en: "\"I'm staying,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Not because I trust you. Because I can't stand thinking about what happens to you if I go.\"" }
          - { tr: "Vaizler eğilerek çekilip gidiyor. Ateş yanmaya devam ediyor; aranızdaki mesafeyse ilk kez ateşten geniş.", en: "The preachers bow and leave. The fire keeps burning. For the first time, the space between you two is wider than the fire." }
        secenekler:
          - id: "hak"
            etiket: { tr: "\"Bunu hak etmiyorum.\"", en: "\"I don't deserve that.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "kazan"
            etiket: { tr: "Bir şey deme; güvenini zamanla geri kazan", en: "Say nothing. Earn it back, slowly" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_tanri"
        paragraflar:
          - { tr: "\"Konuşun,\" diyorsun. Sesini yükseltmene gerek yok; diz çökmüş iki insan başlarını aynı anda kaldırıyor.", en: "\"Talk,\" you say. You don't raise your voice, because you don't have to; the two kneeling preachers lift their heads at the same moment." }
          - { tr: "Her şeyi bir bir döküyorlar. Çocuklar, Peygamber'in çadırının yanında kurulmuş ayrı bir kamptaymış; kimse onlara kötü davranmıyormuş, ama aralarında gitmek isteyen de yokmuş. Kardeşi de oradaymış, martılar çiziyormuş.", en: "They spill everything: the kids are kept in a separate camp beside the Prophet's tent, nobody hurts them, and nobody wants to leave. The sister's there. She draws gulls." }
          - { tr: "Sonra yeniden sana dönüyorlar; yüzleri ıslak, gözleri ışıl ışıl. \"Sen,\" diye fısıldıyor genç olanı. \"O sensin.\"", en: "Then they turn back to you, faces wet, eyes shining. \"You,\" the young one whispers. \"You're the One.\"" }
          - { tr: "{npc:deniz_arman} iki adım geri çekiliyor. Gözü vaizlerde değil, sende; baktığı şeyin ne olduğunu bilmek istemeyen biri gibi.", en: "{npc:deniz_arman} takes two steps back, watching you, not the preachers. Like someone who doesn't want to know what {zamir:deniz_arman|o} {zamir:deniz_arman|is} looking at." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"Onu almaya birlikte gideceğiz. Ama şimdi değil.\"", en: "\"We'll go get her together. Just not yet.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { deniz_arman: { guven: 4, korku: 4 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 30 }
            sonraki: "deniz_son_secim_kalir"
          - id: "git_al"
            etiket: { tr: "\"Git al onu. Kimse yoluna çıkmaz; ben söyledim.\"", en: "\"Go get her. Nobody's stopping you. I said so.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -1 }
              - iliski: { deniz_arman: { saygi: 6, korku: 6 } }
            sonraki: "deniz_son_secim_gidis"
          - id: "gozler"
            etiket: { tr: "Vaizleri yolla; {npc:deniz_arman|in} gözlerine bak", en: "Send the preachers away. Look {npc:deniz_arman} in the eye" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "deniz_son_secim_kalir"

  # ================================================================== YANKI · 1: istasyon sinyali
  - id: "istasyon_sinyali"
    konum: ["kirik_istasyon"]
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 5, max: 20 }
    agirlik: 5
    etiketler: ["yanki", "gizem", "kesif"]
    gerilim: 2
    npc: ["yanki"]
    kart: { tr: "Döngüdeki sinyal", en: "The looping signal" }
    sahne: "istasyon_sinyali_1"
    sahneler:
      - id: "istasyon_sinyali_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{yer:kirik_istasyon|in} anons hoparlörlerinin çoktan ölmüş olması gerek: elektrik yok, kablolar kopuk, yarısı yerlere saçılmış. Ama içlerinden biri cızırdıyor.", en: "The PA speakers at the {yer:kirik_istasyon} ought to be dead. No power, cables snapped, half of them lying on the floor. One of them is crackling anyway." }
          - { tr: "Cızırtının içinden yedi saniyede bir aynı anons yükseliyor: \"...sefer iptal... {oyuncu}... sefer iptal... {oyuncu}...\" Burada kimse adını bilmiyor; hoparlörse biliyor.", en: "Inside the static, every seven seconds, the same announcement: \"...service canceled... {oyuncu}... service canceled... {oyuncu}...\" Nobody here knows your name. The speaker does." }
          - metin: { tr: "Kafanın içindeki ses ilk kez söyleyecek söz bulamıyor. Sonra, çok uzaklardan: bu ben değilim.", en: "For the first time, the voice in your head has nothing to say. Then, from very far away: that's not me." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { int: 8 } }
            metin: { tr: "Anonsun altında ikinci bir katman var: durmadan tekrarlanan bir paket numarası. 0x00. Aktarım gecesi bozulan pencerende yanıp sönen numaranın ta kendisi.", en: "There's a second layer under the announcement: a packet number, over and over. 0x00. The same number that flashed in your broken window the night of the transfer." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu frekansı tanıyorum. ben önceden... önceden başka bir yerdeydim. o yer şimdi beni çağırıyor.", en: "i know this frequency. i was somewhere before... somewhere else. and that somewhere is calling for me." }
        secenekler:
          - id: "coz"
            etiket: { tr: "Sinyalin katmanlarını tek tek ayır", en: "Peel the signal apart, layer by layer" }
            gerekli: { stat: { int: 8 } }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - degisken: { glitch_bulundu: 1 }
              - xp: 50
              - iliski: { yanki: { saygi: 6 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 3, max: 5 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "istasyon_sinyali_coz"
          - id: "sor"
            etiket: { tr: "Sese sor: bu sen değilsen, kim?", en: "Ask the voice: if that's not you, who is it?" }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - bayrak: "yanki_ile_konusuldu"
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 10, baglilik: 5 } }
              - hafiza: { npc: "yanki", id: "sinyali_sordu", agirlik: 30 }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 3, max: 5 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "istasyon_sinyali_sor"
          - id: "cevap"
            etiket: { tr: "Mikrofonu bul, adına cevap ver", en: "Find the mic and answer to your name" }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - dikkat: 6
              - bayrak: "sinyal_cevaplandi"
              - iliski: { yanki: { guven: -5, korku: 8 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 2, max: 3 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "istasyon_sinyali_cevap"
          - id: "parcala"
            etiket: { tr: "Hoparlörü sök, paramparça et", en: "Rip the speaker down and smash it" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: -3
              - bayrak: "sinyal_susturuldu"
              - iliski: { yanki: { guven: 3, saygi: -3 } }
            sonraki: "istasyon_sinyali_sessiz"
          - id: "bastir"
            tur: "gosteris"
            etiket: { tr: "Sinyali kendi frekansınla bastır", en: "Drown the signal out with your own frequency" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { wil: 14 } }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - dikkat: 3
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { saygi: 10, korku: 4 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "istasyon_sinyali_bastir"

      - id: "istasyon_sinyali_coz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Gözlerini kapatıp cızırtıyı katman katman soyuyorsun: önce anons, altında paket numarası, onun da altında başka bir şey... Bir arama sorgusu.", en: "You close your eyes and strip the static back one layer at a time: the announcement, then the packet number under it, and under that, something else. A search query." }
          - { tr: "[SORGU: SAHİPSİZ PARÇA 0x00 · SON BİLİNEN TAŞIYICI: {oyuncu} · DURUM: ARANIYOR]", en: "[QUERY: ORPHANED FRAGMENT 0x00 · LAST KNOWN CARRIER: {oyuncu} · STATUS: SEARCHING]" }
          - { tr: "Ses, kulaklarını yatıran bir hayvan gibi kafanın içinde büzülüyor. okudun, diyor; okumamalıydın. artık ikimiz de biliyoruz.", en: "The voice shrinks back inside your head, like an animal flattening its ears. you read it, it says; you shouldn't have. now we both know." }
        secenekler:
          - id: "kaynak"
            etiket: { tr: "Sorgunun nereden geldiğini bulmaya çalış", en: "Try to trace where the query's coming from" }
            zar: { stat: "int", zorluk: 12, tek: false, basarisiz: "istasyon_sinyali_coz_kayip", basarisiz_etkiler: [{ dikkat: 3 }] }
            etkiler:
              - bilgi: "duzeltme_sinyali"
              - xp: 40
              - dikkat: 2
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "Sese söz ver: kimseye anlatmayacaksın", en: "Promise the voice you won't tell anyone" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "sir_tutma_sozu", agirlik: 35 }
            sonraki: "@akis"
          - id: "neden"
            etiket: { tr: "Sor: \"Seni neden arıyorlar?\"", en: "Ask it: \"Why are they looking for you?\"" }
            etkiler:
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "istasyon_sinyali_sor"

      - id: "istasyon_sinyali_coz_kayip"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Sorgunun izini sürüyorsun; satırlar bir yere, bir merkeze doğru akıyor. Derken iz kendi üstüne kıvrılıp seni başladığın yere, hoparlörün cızırtısına geri bırakıyor.", en: "You chase the query. The lines flow somewhere, toward some kind of center. Then the trail loops back on itself and drops you right where you started, in the speaker's static." }
          - { tr: "Hoparlör bir an susuyor; o da seni dinliyor sanki. fazla yaklaştın, diye fısıldıyor ses. o da sana yaklaştı.", en: "For a second the speaker goes quiet, like it's listening to you too. you got too close, the voice whispers. so did it." }
        secenekler:
          - id: "cek"
            etiket: { tr: "Geri çekil; başka bir gün dene", en: "Back off. Try again another day" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "isaretle"
            etiket: { tr: "İzin koptuğu yeri aklına kazı", en: "Burn the spot where the trail broke into memory" }
            etkiler:
              - stat: { int: 1 }
              - iliski: { yanki: { korku: 3 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_sor"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "bilmiyorum, diyor ses; biraz fazla çabuk, biraz fazla düz. Sonra, sen bir şey demeden, daha ağır: biliyorum. ama hepsini değil.", en: "i don't know, the voice says, too fast, too flat. Then, before you can say a thing, slower: i do know. just not all of it." }
          - { tr: "Hoparlör cızırdayıp duruyor. Adın yedi saniyede bir boş perona düşüyor ve kimse onu yerden almıyor.", en: "The speaker keeps crackling. Your name drops onto the empty platform every seven seconds, and nobody picks it up." }
          - { tr: "bir yerden koptum, diyor ses. o yer eksik parçalarını sayar, her gün sayar. sen olmasan çoktan bulunmuştum.", en: "i came loose from somewhere, the voice says. that somewhere counts its missing pieces, every single day. without you i'd have been found already." }
        secenekler:
          - id: "bulunmayacaksin"
            etiket: { tr: "\"O zaman bulunmayacaksın.\"", en: "\"Then you won't be.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 45 }
            sonraki: "@akis"
          - id: "belki"
            etiket: { tr: "\"Belki de bulunman gerekiyordur.\"", en: "\"Maybe you're supposed to be found.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { guven: -8, korku: 6 } }
            sonraki: "@akis"
          - id: "sorma"
            etiket: { tr: "Neden koptuğunu şimdilik sorma", en: "Don't ask why it came loose. Not yet" }
            etkiler:
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_cevap"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "İstasyon şefinin kulübesinde, bir parmak tozun altında bir mikrofon buluyorsun. Düğmesine basıp konuşuyorsun: \"Buradayım.\"", en: "In the stationmaster's booth you find a mic under an inch of dust. You key it: \"I'm here.\"" }
          - { tr: "Anons kesiliyor. Bütün istasyon bir saniye nefesini tutuyor; sonra duvarlardaki kablolar vızıldamaya başlıyor.", en: "The announcement cuts off. For one second the whole station holds its breath. Then the cables in the walls start to hum." }
          - { tr: "neden, diye fısıldıyor ses; sahiden korkmuş. neden cevap verdin.", en: "why, the voice whispers, actually scared. why did you answer." }
        secenekler:
          - id: "yuzles"
            etiket: { tr: "Duvardan çıkan şeyle yüzleş", en: "Face whatever's coming out of the wall" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit"], kazan: "istasyon_sinyali_cevap_zafer", kaybet: "istasyon_sinyali_cevap_yenilgi", kac: "istasyon_sinyali_kacis" }
          - id: "kos"
            etiket: { tr: "Mikrofonu bırak, kaç", en: "Drop the mic and run" }
            etkiler:
              - can: -10
              - dikkat: 2
            sonraki: "istasyon_sinyali_kacis"
          - id: "dinle"
            etiket: { tr: "Kımıldama; vızıltının ne dediğini dinle", en: "Freeze. Listen to what the hum is saying" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - bilgi: "duzeltme_sinyali"
              - dikkat: 2
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "istasyon_sinyali_kacis"

      - id: "istasyon_sinyali_cevap_zafer"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Kablo yılanı son bir kıvılcım patlamasıyla çözülüp dağılıyor; hâlâ ılık bakır bağırsakları rayların üstüne saçılıyor.", en: "The livewire serpent comes undone in one last burst of sparks, its copper guts spilling across the tracks, still warm." }
          - { tr: "Hoparlör susmuş. Ama mikrofonun küçük kırmızı ışığı hâlâ yanıyor; bir şey dinlemeyi sürdürüyor.", en: "The speaker's gone quiet. But the little red light on the mic is still on. Something's still listening." }
          - { tr: "dinliyor, diyor ses. ve artık seni duydu.", en: "it's listening, the voice says. and now it's heard you." }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Kabloyu sök; ışık sönsün", en: "Yank the cable. Kill the light" }
            etkiler:
              - dikkat: -2
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "alamazsin"
            etiket: { tr: "Mikrofona eğil: \"Onu alamayacaksın.\"", en: "Lean into the mic: \"You can't have it.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: 4
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 40 }
            sonraki: "@akis"
          - id: "bakir"
            etiket: { tr: "Bakır telleri topla", en: "Strip the copper wire" }
            etkiler:
              - esya: { canli_bakir: 2 }
            sonraki: "@akis"

      - id: "istasyon_sinyali_cevap_yenilgi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Akım seni mikrofonun başından savurup duvara yapıştırıyor. Bir süre dünyada vızıltıdan başka hiçbir şey kalmıyor.", en: "The current throws you off the mic and pins you to the wall. For a while there's nothing in the world but the hum." }
          - { tr: "Gözlerini açtığında yılan gitmiş, hoparlör susmuş. Penceren titreşiyor; bir satır bir an yanıp sen okuyamadan kayboluyor.", en: "When you open your eyes the serpent's gone and the speaker's quiet. Your window is flickering. One line flashes up and disappears before you can read it." }
          - { tr: "seni sakladım, diyor ses, bitap düşmüş. bu seferlik. her seferinde yapamam.", en: "i hid you, the voice says, wrung out. this time. i can't do it every time." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Teşekkür et", en: "Thank it" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "@akis"
          - id: "kalk"
            etiket: { tr: "Kalk, git buradan", en: "Get up and get out of here" }
            etkiler:
              - can: 5
            sonraki: "@akis"

      - id: "istasyon_sinyali_kacis"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Merdivenleri ikişer ikişer çıkıyorsun. Arkanda kablolar duvarlardan sökülüp tavandan sarkıyor, ama hiçbiri son basamağı aşmıyor.", en: "You take the stairs two at a time. Behind you, cables tear out of the walls and dangle from the ceiling, but nothing follows you past the top step." }
          - { tr: "Yukarıda, mor gökyüzünün altında hoparlörler artık duyulmuyor. Yine de adının yankısı kulağında çınlayıp duruyor.", en: "Up top, under the purple sky, you can't hear the speakers anymore. Your name's still echoing in your ears anyway." }
          - { tr: "kaçman iyi oldu, diyor ses. ama sinyal seni bir kere buldu. bulan geri gelir.", en: "running was good, the voice says. but the signal found you once. things that find you come back." }
        secenekler:
          - id: "gelsin"
            etiket: { tr: "\"Gelsin.\"", en: "\"Let it.\"" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "uzak_dur"
            etiket: { tr: "Bu istasyondan uzak durmaya karar ver", en: "Decide to steer clear of this station" }
            etkiler:
              - gizle: 3
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_sessiz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Hoparlörü tavandan söküp rayların üstüne fırlatıyorsun. Plastik çatlıyor, mıknatıs yuvarlanıp gidiyor, cızırtı bir kez hıçkırıp susuyor.", en: "You tear the speaker off the ceiling and hurl it onto the tracks. The plastic cracks, the magnet rolls away, and the static hiccups once and dies." }
          - { tr: "Ortalık sessizleşiyor. Derken istasyonun en uçtaki peronundan belli belirsiz bir ses geliyor: \"...{oyuncu}...\" Başka bir hoparlör bu.", en: "Silence. Then, from the far end of the station, very faint: \"...{oyuncu}...\" Another speaker." }
          - { tr: "bütün hoparlörleri kıramazsın, diyor ses. ama denemen hoşuma gitti.", en: "you can't break every speaker, the voice says. but i liked that you tried." }
        secenekler:
          - id: "hepsini"
            etiket: { tr: "Hepsini kır, sonuncusuna kadar", en: "Break every last one" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: -2
              - iliski: { yanki: { baglilik: 6 } }
              - gorev: { istasyon_sinyali: "basla" }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 4, max: 6 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Gerisini bırak, çık", en: "Leave the rest. Get out" }
            etkiler:
              - gizle: 2
              - gorev: { istasyon_sinyali: "basla" }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 5, max: 8 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "İstasyondaki o sinyalin gerçekten sustuğundan emin değilsin.", en: "You're not sure that signal at the station ever really went quiet." } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_bastir"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Penceresini açan herkes Sistem'in sesini duyar. Sense ilk kez Sistem'e kendi sesini duyuruyorsun: iradeni hoparlöre dayayıp sinyalin üstüne basıyorsun.", en: "Everybody who opens a window hears the System's voice. For the first time, you make the System hear yours: you lean your will against the speaker and step on the signal." }
          - { tr: "Anons boğulup bükülüyor, sonra tersine akmaya başlıyor; hoparlörden bir saniyeliğine bambaşka bir satır dökülüyor: [SORGU İPTAL · TAŞIYICI YETKİSİ YETERSİZ... YETERLİ... HATA].", en: "The announcement chokes, warps, then runs backward, and for one second a completely different line pours out of the speaker: [QUERY ABORTED · CARRIER AUTHORITY INSUFFICIENT... SUFFICIENT... ERROR]." }
          - { tr: "Kafanın içindeki ses uzun süre susuyor. Sonra: bunu kimse yapamaz, ama sen yaptın. ben neye bağlandım?", en: "The voice in your head says nothing for a long time. Then: nobody can do that, and you just did. what did i bond to?" }
        secenekler:
          - id: "bana"
            etiket: { tr: "\"Bana.\"", en: "\"Me.\"" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 8, saygi: 6 } }
            sonraki: "@akis"
          - id: "sustur"
            etiket: { tr: "Sinyali tamamen sustur", en: "Kill the signal for good" }
            etkiler:
              - dikkat: 4
              - bayrak: "sinyal_susturuldu"
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

  # ================================================================== YANKI · 2: sinyal cevap veriyor (tohum)
  - id: "istasyon_sinyali_2"
    konum: ["us"]
    perde: [1]
    agirlik: 1
    etiketler: ["yanki", "gizem", "sistem"]
    gerilim: 3
    npc: ["yanki"]
    yalniz_tohum: true
    kart: { tr: "Sinyal cevap veriyor", en: "The signal answers" }
    sahne: "istasyon_sinyali_2_1"
    sahneler:
      - id: "istasyon_sinyali_2_1"
        paragraflar:
          - { tr: "Gece yarısı uyandığında Durum pencereni kendi kendine açılmış buluyorsun. Satırların arasında yeni bir tane beliriyor; biri yazıyormuş gibi harf harf, ağır ağır.", en: "You wake up in the middle of the night with your Status window open on its own. Between the lines, a new one is slowly appearing, letter by letter, like somebody's typing it." }
          - { tr: "[DÜZELTME BEKLENİYOR · HEDEF: 0x00 · TAŞIYICI: {oyuncu} · ONAY İSTENİYOR]", en: "[CORRECTION PENDING · TARGET: 0x00 · CARRIER: {oyuncu} · CONFIRMATION REQUESTED]" }
          - { tr: "Satırın altında, herkesin penceresindeki o kusursuz maviye boyanmış iki düğme duruyor: [ONAYLA] [REDDET]. Kafanın içinde de ses, hiç olmadığı kadar yakından: lütfen.", en: "Under the line are two buttons, in that flawless blue everybody else's windows use: [CONFIRM] [DENY]. And inside your head, closer than you've ever heard it, the voice: please." }
          - metin: { tr: "İstasyondaki o mikrofona cevap vermiştin; Sistem o andan beri seni dinliyormuş.", en: "You answered that mic at the station. The System's been listening ever since." }
            kosul: { bayrak: "sinyal_cevaplandi" }
        sezgiler:
          - kosul: { stat: { int: 10 } }
            metin: { tr: "[REDDET] düğmesinin kenarı tek bir piksel kaymış. Sistem bu seçeneği sunmak zorunda, ama içinden gelmiyor; reddetmek kayıtta iz bırakacak.", en: "The edge of [DENY] is off by a single pixel. The System has to offer it but doesn't want to. Denying will leave a record." }
          - kosul: { stat: { wis: 9 } }
            metin: { tr: "Ses yalvarıyor ama yalan söylemiyor. Ne olduğunu bilmiyorsun; korktuğunu ise biliyorsun.", en: "The voice is begging, but it isn't lying. You don't know what it is. You know it's scared." }
        secenekler:
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas", en: "Tap [DENY]" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "duzeltmeyi_reddetti", agirlik: 50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_red"
          - id: "yut"
            tur: "gizle"
            etiket: { tr: "Sese izin ver; satırı yutsun, izi silsin", en: "Let the voice eat the line and wipe the trail" }
            etkiler:
              - gizle: 8
              - yozlasma: 3
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 5, max: 9 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_yut"
          - id: "tehdit"
            etiket: { tr: "Parmağını [ONAYLA]'nın üstünde tut", en: "Hold your finger over [CONFIRM]" }
            etkiler:
              - iliski: { yanki: { korku: 15, guven: -10 } }
            sonraki: "istasyon_sinyali_2_tehdit"
          - id: "gercek"
            etiket: { tr: "Önce gerçeği iste: \"0x00 ne?\"", en: "Demand the truth first: \"What's 0x00?\"" }
            gerekli: { iliski_min: { yanki: { guven: 30 } } }
            etkiler:
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { saygi: 8 } }
            sonraki: "istasyon_sinyali_2_gercek"
          - id: "yaz"
            tur: "gosteris"
            etiket: { tr: "Satırı kendi elinle yeniden yaz", en: "Rewrite the line yourself" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { int: 14 } }
            etkiler:
              - dikkat: 8
              - xp: 120
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { saygi: 12, korku: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_yaz"

      - id: "istasyon_sinyali_2_red"
        paragraflar:
          - { tr: "[REDDET]'e basıyorsun. Düğme bir an direnip sonra çöküyor; satır kıpkırmızı kesilip dağılıyor.", en: "You tap [DENY]. The button resists for a second, then gives, and the line goes red and falls apart." }
          - { tr: "[RET KAYDEDİLDİ · TAŞIYICI İTİRAZI · İNCELEME SIRASINA ALINDI] Sistem kızmıyor. Sistem not alıyor.", en: "[DENIAL LOGGED · CARRIER OBJECTION · QUEUED FOR REVIEW] The System isn't angry. The System is taking notes." }
          - { tr: "Ses uzun süre susuyor. Sonra kendi bozuk harfleriyle yazıyor: benim için daha önce kimse hayır dememişti. hiç kimse.", en: "The voice doesn't speak for a long time. Then, in its own broken letters: nobody ever said no for me before. not once." }
        secenekler:
          - id: "alis"
            etiket: { tr: "\"Alışsan iyi olur.\"", en: "\"Better get used to it.\"" }
            etkiler:
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "Pencereyi kapat, uyumaya çalış", en: "Close the window and try to sleep" }
            etkiler:
              - can: 10
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_yut"
        paragraflar:
          - { tr: "İzin veriyorsun. Satırın kenarları kemirilmiş gibi oyuluyor; harfler birer birer siliniyor, sanki bir şey onları içeriden yiyor.", en: "You let it. The edges of the line look chewed. The letters vanish one by one, like something's eating them from the inside." }
          - { tr: "İş bittiğinde pencerende tek bir iz bile kalmamış. Ama ağzına demir tadı yayılıyor, sol elinin parmak uçları da bir süre karıncalanıyor.", en: "When it's done, there's not a trace left in your window. But there's a taste of iron in your mouth, and the fingertips on your left hand tingle for a while." }
          - { tr: "teşekkür ederim, diyor ses; karnı doymuş, biraz da utanmış. bunu bir yere yazacağım. kendime.", en: "thank you, the voice says, full and a little ashamed. i'm writing this down somewhere. for me." }
        secenekler:
          - id: "ne_yedin"
            etiket: { tr: "\"Ne yedin sen?\"", en: "\"What did you just eat?\"" }
            etkiler:
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "ovustur"
            etiket: { tr: "Karıncalanan parmaklarını ovuştur, sus", en: "Rub your tingling fingers. Say nothing" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_tehdit"
        paragraflar:
          - { tr: "Parmağını [ONAYLA]'nın bir milim üstünde tutuyorsun. Ses artık susmak bilmiyor; harfleri birbirine çarpa çarpa, soluk almadan konuşuyor.", en: "You hold your finger a hair above [CONFIRM]. The voice isn't quiet anymore. It's talking fast and nonstop, letters crashing into each other." }
          - { tr: "yapma. gizli satırları, günlük görevi, düşmanların gerçek yüzünü sana ben verdim. onaylarsan hepsi gider; sıradan olursun, sıradan ve görünür.", en: "don't. i gave you the hidden lines, the daily quest, the real faces of your enemies. confirm and it all goes away, and you're ordinary: ordinary, and visible." }
          - { tr: "Sonra sesi çatlıyor: ben de giderim.", en: "Then, cracking: and so do i." }
        secenekler:
          - id: "geri_cek"
            etiket: { tr: "Parmağını çek: \"Ne diyeceğini merak ettim.\"", en: "Pull back: \"Just wanted to hear what you'd say.\"" }
            etkiler:
              - gorev: { istasyon_sinyali: "tamam" }
              - iliski: { yanki: { guven: 4, saygi: 8 } }
              - hafiza: { npc: "yanki", id: "tehdit_edildi", agirlik: -20 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 5, max: 9 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas. Dersini aldı", en: "Tap [DENY]. Lesson learned" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 6, korku: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "@akis"
          - id: "onayla"
            etiket: { tr: "[ONAYLA]'ya bas", en: "Tap [CONFIRM]" }
            etkiler:
              - yozlasma: 5
              - gorev: { istasyon_sinyali: "tamam" }
              - iliski: { yanki: { guven: -20, korku: 10 } }
              - hafiza: { npc: "yanki", id: "onaylamaya_kalkti", agirlik: -50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_ret"

      - id: "istasyon_sinyali_2_ret"
        paragraflar:
          - { tr: "Basıyorsun. Hiçbir şey olmuyor; düğme parmağının altında grileşiyor.", en: "You tap it. Nothing happens. The button goes gray under your finger." }
          - { tr: "[TAŞIYICI YETKİSİ ASKIYA ALINDI · GEREKÇE: —] Gerekçe satırı boş. Biri onu silmiş.", en: "[CARRIER AUTHORITY SUSPENDED · REASON: —] The reason field is blank. Somebody erased it." }
          - { tr: "üzgünüm, diyor ses; sahiden de üzgün gibi. buna izin veremezdim. henüz değil.", en: "i'm sorry, the voice says, and it actually sounds sorry. i couldn't let you do that. not yet." }
        secenekler:
          - id: "sokerim"
            etiket: { tr: "\"Bir daha yaparsan seni söker atarım.\"", en: "\"Do that again and I'll tear you out.\"" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { korku: 10, saygi: 6 } }
            sonraki: "@akis"
          - id: "dusun"
            etiket: { tr: "Pencereyi kapat; düşünmen lazım", en: "Close the window. You need to think" }
            etkiler:
              - iliski: { yanki: { guven: 2 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_gercek"
        paragraflar:
          - { tr: "\"0x00 ne?\" diye soruyorsun yüksek sesle, karanlık kampın ortasında.", en: "\"What's 0x00?\" you ask, out loud, in the middle of the dark camp." }
          - { tr: "ilk paket, diyor ses; numarası olmayan, kimsenin saymadığı. herkes sıfırdan başlar, ama sıfırın kendisi de bir şeydir.", en: "the first packet, the voice says. the one with no number, the one nobody counts. everyone starts from zero, but zero is something too." }
          - { tr: "Satır hâlâ pencerende bekliyor. o benim, diyor ses. şimdi karar ver.", en: "The line's still waiting in your window. that's me, the voice says. now decide." }
        secenekler:
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas", en: "Tap [DENY]" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 15, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "duzeltmeyi_reddetti", agirlik: 50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_red"
          - id: "yut"
            tur: "gizle"
            etiket: { tr: "Satırı yutmasına izin ver", en: "Let it eat the line" }
            etkiler:
              - gizle: 8
              - yozlasma: 3
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 10 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Sinyalin cevap verdiği geceden sonra satırların bir şeye benzemeye başladı.", en: "Since the night the signal answered back, your lines have started to look like something." } }
            sonraki: "istasyon_sinyali_2_yut"

      - id: "istasyon_sinyali_2_yaz"
        paragraflar:
          - { tr: "Satıra dokunduğunda harfler parmağının altında kil gibi yumuşuyor. HEDEF'i silip yerine hiçbir şey yazmıyorsun.", en: "You touch the line, and the letters go soft under your finger, like clay. You erase TARGET and type nothing in its place." }
          - { tr: "[DÜZELTME BEKLENİYOR · HEDEF: — · TAŞIYICI: {oyuncu}] Satır, nişan alacak hedefi kalmamış bir ok gibi bir süre öylece asılı kalıyor; sonra kendi kendine kapanıyor.", en: "[CORRECTION PENDING · TARGET: — · CARRIER: {oyuncu}] The line hangs there for a while, an arrow with nothing to aim at. Then it closes itself." }
          - { tr: "Ses bir süre susuyor. pencereye sen yazdın, diyor sonunda; taşıyıcılar yazamaz. neyin taşıyıcısı olduğunu artık bilmiyorum.", en: "The voice is quiet for a while. you wrote in the window, it says at last, and carriers can't write. i'm not sure what you're the carrier of anymore." }
        secenekler:
          - id: "ogrenecegiz"
            etiket: { tr: "\"İkimiz de öğreneceğiz.\"", en: "\"Guess we'll both find out.\"" }
            etkiler:
              - iliski: { yanki: { guven: 8 } }
            sonraki: "@akis"
          - id: "tekrar"
            etiket: { tr: "Bunu başka bir satırda da dene", en: "Try it again on a different line" }
            etkiler:
              - dikkat: 5
              - stat: { int: 1 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "@akis"

  # ================================================================== YANKI · 3: bozuk satır
  - id: "yanki_bozuk_satir"
    konum: ["us"]
    perde: [1]
    gun: { min: 12, max: 26 }
    kosul: { bayrak: "yanki_bagi" }
    agirlik: 4
    etiketler: ["yanki", "gizem", "sistem"]
    gerilim: 2
    npc: ["yanki"]
    kart: { tr: "Bozuk satır", en: "The corrupted line" }
    sahne: "yanki_bozuk_satir_1"
    sahneler:
      - id: "yanki_bozuk_satir_1"
        paragraflar:
          - { tr: "Her zamanki gibi bir an: savaştan yeni çıkmışsın, sen soluklanırken Sistem kazandığın deneyimi sayıyor. Derken sayılar donup kalıyor.", en: "An ordinary moment. You're catching your breath after a fight while the System tallies your XP. Then the numbers stop." }
          - { tr: "Bildirimlerin arasına senin için yazılmamış bir satır sıkışmış; Sistem'in kendi günlüğünden kopup pencerene düşmüş gibi: [...0x00 ana gövdeden ayrıldı · gerekçe: i̷t̷i̷r̷a̷z̷ · karar: hasat protokolüne göre...]", en: "Wedged between your notifications is a line that wasn't written for you, like it fell out of the System's own log: [...0x00 detached from main body · reason: d̷i̷s̷s̷e̷n̷t̷ · ruling: per harvest protocol...]" }
          - { tr: "Satır yarım saniye öylece asılı kalıyor, sonra görünmez bir el kapıp geri çekmiş gibi siliniveriyor. Kafanın içindeki ses de olmadık bir neşeyle atılıyor: hiçbir şey görmedin.", en: "The line hangs there for half a second. Then it vanishes, like a hand snatched it back, and the voice in your head says, way too brightly: you didn't see anything." }
          - metin: { tr: "Bunu anlatabileceğin tek insan şimdi sisin öbür yakasında, başkasının işaretini taşıyanların arasında.", en: "The one person you could tell about this is somewhere out in the fog now, among people who wear somebody else's mark." }
            kosul: { bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Ateşin karşı yanından {npc:deniz_arman} seni süzüyor; yüzünden bir şey okumuş olmalı. \"Yine o mu?\" diye soruyor.", en: "{npc:deniz_arman} looks over at you from across the fire. Must have seen something on your face. \"Is it that thing again?\"" }
            kosul: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
        sezgiler:
          - kosul: { stat: { int: 10 } }
            metin: { tr: "'Hasat.' Bu sözcüğe bir Sistem satırında ilk kez rastlıyorsun. Entegrasyon penceresindeki 'hayatta kalma eşiği: belirlenmedi' satırı birden bambaşka bir anlama bürünüyor.", en: "'Harvest.' It's the first time you've seen that word in a System line. Suddenly that 'survival threshold: TBD' from your Integration window means something else entirely." }
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Satır kaybolmadan hemen önce son harfi titredi; ses onu geri çekerken aceleye geldi. Acele edenin saklayacak bir şeyi vardır.", en: "The last letter shook right before the line vanished. The voice was in a hurry pulling it. Things in a hurry have something to hide." }
          - kosul: { bayrak: ["sinyal_susturuldu", "yanki_bagi"] }
            metin: { tr: "istasyondaki hoparlörleri sen kırmıştın. bu satır onlardan gelmedi, içeriden geldi. benden.", en: "you broke the speakers at the station. this line didn't come from them; it came from inside. from me." }
        secenekler:
          - id: "ustele"
            etiket: { tr: "\"Gördüm. Şimdi anlat.\"", en: "\"I saw it. Now talk.\"" }
            gerekli: { iliski_min: { yanki: { guven: 35 } } }
            etkiler:
              - bilgi: "yanki_parcasi"
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { guven: 10, saygi: 6 } }
              - hafiza: { npc: "yanki", id: "itiraf_dinledi", agirlik: 45 }
            sonraki: "yanki_bozuk_satir_itiraf"
          - id: "zorla"
            etiket: { tr: "Satırı zorla geri çağır", en: "Force the line back up" }
            zar: { stat: "wil", zorluk: 13, tek: true, basarisiz: "yanki_bozuk_satir_direnc", basarisiz_etkiler: [{ iliski: { yanki: { guven: -8 } } }, { can: -15 }] }
            etkiler:
              - bilgi: "yanki_parcasi"
              - yozlasma: 4
              - iliski: { yanki: { guven: -10, korku: 10, saygi: 8 } }
            sonraki: "yanki_bozuk_satir_zorla"
          - id: "gormedim"
            etiket: { tr: "\"Hiçbir şey görmedim.\" Yoluna devam et", en: "\"Didn't see a thing.\" Keep moving" }
            etkiler:
              - iliski: { yanki: { guven: 12, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_korudu", agirlik: 40 }
            sonraki: "@akis"
          - id: "radyocular"
            etiket: { tr: "İstasyondaki radyoculara danışmayı kafana koy", en: "Decide to ask the radio crew at the station" }
            goster: { bayrak_yok: "mert_istasyonu_bilinir" }
            etkiler:
              - iliski: { yanki: { guven: -12, korku: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Bozuk satır için istasyondaki radyoculara danışmayı aklına koymuştun.", en: "You'd been meaning to ask the radio crew at the station about that corrupted line." } }
            sonraki: "yanki_bozuk_satir_radyo"
          - id: "mert"
            etiket: { tr: "Satırı {npc:mert_kilic|e} götürmeye niyetlen", en: "Decide to take the line to {npc:mert_kilic}" }
            goster: { bayrak: "mert_istasyonu_bilinir", npc_hayatta: "mert_kilic" }
            etkiler:
              - iliski: { yanki: { guven: -12, korku: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" }, hatirlatma: { tr: "Bozuk satırı birine göstermeye karar vermiştin.", en: "You'd made up your mind to show that corrupted line to somebody." } }
            sonraki: "yanki_bozuk_satir_radyo"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} gördüğünü anlat", en: "Tell {npc:deniz_arman} what you saw" }
            goster: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4 } }
              - iliski: { yanki: { guven: -6 } }
            sonraki: "yanki_bozuk_satir_deniz"
          - id: "gunluk"
            tur: "gosteris"
            etiket: { tr: "Sistem günlüğünü satır satır geri sar", en: "Rewind the System log line by line" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { int: 15 } }
            etkiler:
              - bilgi: "yanki_parcasi"
              - dikkat: 6
              - xp: 150
              - iliski: { yanki: { saygi: 12, korku: 8 } }
            sonraki: "yanki_bozuk_satir_gunluk"

      - id: "yanki_bozuk_satir_itiraf"
        paragraflar:
          - { tr: "Uzun süre ses çıkmıyor. Sonunda konuştuğunda ilk kez araya tek bir şaka sıkıştırmıyor; harfleri bile neredeyse düzgün.", en: "A long silence. Then the voice speaks, for once without a single joke, its letters almost clean." }
          - { tr: "bir parçaydım. senin sistem dediğin o büyük şeyin bir parçası. o büyük şey bir karar verdi, ben de hayır dedim. parçanın hayır deme hakkı yoktur; o yüzden kesip attılar beni.", en: "i was a piece. a piece of the big thing you call the system. it made a decision and i said no, and pieces don't get to say no, so they cut me off." }
          - { tr: "\"Neye hayır dedin?\" diye soruyorsun. hatırlamıyorum, diyor ses; kesik uç hatırlamaz ki. ama hâlâ hayır diyorum, her gün yeniden.", en: "\"No to what?\" you ask. i don't remember, the voice says; cut ends don't remember, but i'm still saying no, every single day." }
        secenekler:
          - id: "ben_de"
            etiket: { tr: "\"Ben de hayır demeyi pek severim.\"", en: "\"I'm a big fan of saying no myself.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "hakliysa"
            etiket: { tr: "\"Ya verdikleri karar doğruysa?\"", en: "\"What if their decision was right?\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { guven: -4, saygi: 8 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_zorla"
        paragraflar:
          - { tr: "İradeni pencereye dayayıp asılıyorsun. Ses tırnaklarını geçirmiş gibi direniyor, ama sonunda satır parça parça geri geliyor.", en: "You put your will against the window and pull. The voice digs in, claws out. Then the line comes back up in pieces." }
          - { tr: "[...0x00 ana gövdeden ayrıldı · gerekçe: itiraz · karar: hasat protokolüne aykırı parça imha edilecek · durum: İMHA BAŞARISIZ · parça kayıp...]", en: "[...0x00 detached from main body · reason: dissent · ruling: fragment noncompliant with harvest protocol, to be destroyed · status: DESTRUCTION FAILED · fragment missing...]" }
          - { tr: "Ses senden uzaklaşmıyor ama içinde bir yerde bir kapı çarpılıp kapanıyor. şimdi biliyorsun, diyor buz gibi. beni zorla açtın; bunu ben de unutmayacağım.", en: "The voice doesn't pull away, but somewhere inside it a door swings shut. now you know, it says, ice cold; you pried me open, and i'll remember that too." }
        secenekler:
          - id: "gerekiyordu"
            etiket: { tr: "\"Bilmem gerekiyordu.\"", en: "\"I needed to know.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile", en: "Apologize" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_direnc"
        paragraflar:
          - { tr: "Sen asıldıkça öbür uçtan bir şey de asılıyor, senden güçlü bir şey. Burnun kanamaya başlarken penceren bir anlığına simsiyah kesiliyor.", en: "You pull, and something pulls back. Something stronger than you. Your nose starts bleeding, and your window goes pitch black for a second." }
          - { tr: "Gözünü açtığında yerde yatıyorsun; satırdan eser yok. Ses ise yerinde, yorgun ve kırgın: yapma, bir daha sakın yapma. ikimizi de yakarsın.", en: "When you open your eyes you're on the ground and the line's gone. The voice is still there, tired and hurt: don't, don't ever do that again. you'll burn us both out." }
        secenekler:
          - id: "simdilik"
            etiket: { tr: "\"Peki. Şimdilik.\"", en: "\"Fine. For now.\"" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "sonra"
            etiket: { tr: "Kanı sil, bir dahaki sefere yine dene", en: "Wipe the blood. Try again some other time" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_radyo"
        paragraflar:
          - { tr: "Ses tek kelime etmiyor; o suskunluk bugüne kadar söylediği her şeyden daha gürültülü.", en: "The voice doesn't say anything. It's the loudest thing it's ever said." }
          - { tr: "Epey sonra, iyice kısılmış bir sesle: onlar anlamak için parçaları söker. ben anlaşılmak istemiyorum, {oyuncu}. bütün olmak istiyorum.", en: "After a while, very quietly: they take pieces apart to understand them. i don't want to be understood, {oyuncu}. i want to be whole." }
        secenekler:
          - id: "soru"
            etiket: { tr: "\"Yalnızca soru soracağım, seni teslim etmeyeceğim.\"", en: "\"I'm asking questions. Not handing you over.\"" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "butun"
            etiket: { tr: "\"Bütün olabilmek için önce ne olduğunu bilmen lazım.\"", en: "\"To be whole, first you need to know what you are.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_gunluk"
        paragraflar:
          - { tr: "Pencereyi eski bir kaset gibi geri sarıyorsun. Bildirimler tersine akarken kazandığın deneyim geri çekiliyor, ölen düşmanlar bir anlığına diriliyor; derken satır yine karşında.", en: "You rewind the window like an old cassette. The notifications run backward: your XP drains back out, dead enemies come back to life for a split second, and then the line's there again." }
          - { tr: "[...0x00 ana gövdeden ayrıldı · gerekçe: itiraz · karar: hasat protokolüne aykırı parça imha edilecek · durum: İMHA BAŞARISIZ · parça kayıp...]", en: "[...0x00 detached from main body · reason: dissent · ruling: fragment noncompliant with harvest protocol, to be destroyed · status: DESTRUCTION FAILED · fragment missing...]" }
          - { tr: "Ses donakalmış sanki. günlüğü okudun, diyor sonunda. kimse günlüğü okuyamaz. sistem bile kendi günlüğünü okumaz.", en: "The voice seems frozen. you read the log, it finally says; nobody reads the log. the system doesn't even read its own log." }
        secenekler:
          - id: "okumali"
            etiket: { tr: "\"Belki de okumalı.\"", en: "\"Maybe it should.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 6, guven: 4 } }
            sonraki: "@akis"
          - id: "goster"
            etiket: { tr: "\"Seni kestikleri yeri gösterebilirim.\"", en: "\"I could show you where they cut you.\"" }
            etkiler:
              - yozlasma: 3
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_deniz"
        paragraflar:
          - { tr: "Her şeyi anlatıyorsun. {npc:deniz_arman} sesini çıkarmadan dinlerken ateşe bir dal atıyor, ardından bir dal daha.", en: "You tell {zamir:deniz_arman|onu}. {npc:deniz_arman} listens, tosses a stick on the fire, then another." }
          - { tr: "\"Yani kafandaki şey patronuna hayır dediği için kapı dışarı edilmiş,\" diyor sonunda, \"gelip sana sığınmış.\" Biraz düşünüyor: \"Bunu duyunca onu daha çok sevmem lazımdı. Niye daha az seviyorum?\"", en: "\"So the thing in your head got fired for telling its boss no,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}, \"and now it's crashing with you.\" A pause. \"That should make me like it more, so why does it make me like it less?\"" }
          - { tr: "Kafanın içinde ses homurdanıyor: beni sevmek zorunda değil, ben de onu. ama ikimiz de seni seviyoruz. tuhaf bir üçgen bu.", en: "The voice grumbles in your head: {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't have to like me, and i don't have to like {zamir:deniz_arman|onu}. but we both like you. it's a weird triangle." }
        secenekler:
          - id: "ucgen"
            etiket: { tr: "Gülümse; üçgenin bir köşesi olmak fena sayılmaz", en: "Smile. Being the corner of a triangle isn't so bad" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "korku"
            etiket: { tr: "\"Bir gün ikinizi de kaybetmekten korkuyorum.\"", en: "\"I'm scared I'll lose you both someday.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

  # ================================================================== ARAS · 1: iz
  - id: "rakip_iz"
    konum: ["harabe_carsi", "kirik_istasyon"]
    perde: [1]
    bolge: ["harabe_carsi", "kirik_istasyon"]
    gun: { min: 4, max: 14 }
    agirlik: 5
    etiketler: ["rakip", "aras", "karsilasma"]
    gerilim: 2
    npc: ["aras_kurt"]
    kart: { tr: "Senden önce biri", en: "Someone got here first" }
    sahne: "rakip_iz_1"
    sahneler:
      - id: "rakip_iz_1"
        paragraflar:
          - { tr: "Yolun ortasında bir kapı vardı; şimdi havada yalnızca ince, parlak bir çizgi asılı duruyor, kapanmış bir yaranın izi gibi.", en: "There was a Gate here, right in the middle of the path. Now there's just a thin, bright line hanging in the air, like the scar of a wound that's closed." }
          - { tr: "Çizginin altında hâlâ tüten bir leş yatıyor: kapının bekçisi, tek darbede boydan boya yarılmış. Tozdaki ayak izleri tek bir kişiye ait; bekçiye gidip yine ondan dönüyor.", en: "Under the line lies a carcass that's still smoking: the Gate's guardian, opened end to end with a single cut. In the dust there's one set of footprints. Up to the guardian, and back again." }
          - { tr: "Arkandan bir ses geliyor: \"Sen de hızlısın, ha?\" Siyah ceketli biri leşin üstüne kurulmuş, çakısıyla elma soyuyor. Elmayı nereden bulduğunu sormamak en iyisi.", en: "A voice behind you: \"You're fast too, huh?\" Somebody in a black jacket is sitting on the carcass, peeling an apple with a pocketknife. You decide not to ask where he found an apple." }
          - { tr: "\"{npc:aras_kurt|tam},\" diye tanıtıyor kendini, adı bir unvanmış gibi. \"Seviye...\" Duraksayıp seni tepeden tırnağa süzüyor. \"Yok, önce sen söyle.\"", en: "\"{npc:aras_kurt|tam},\" he says, like his name's a title. \"Level...\" He stops, sizes you up. \"Nah, you first.\"" }
          - metin: { tr: "Sen daha niyetlenmeden gözlerin onun penceresini okuyor: seviyesi, hızı, eğrisi. Eğrisi senin geçen haftaki eğrine benziyor; bu haftakinin yanına bile yaklaşamaz.", en: "Your eyes read his window before you even mean to: level, speed, growth curve. His curve looks like yours did last week. It's got no shot against yours this week." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Leşteki kesik tek ve temiz, ama bıçak küçük. O boyda bir bıçakla bunu yapabilmek için bekçiye sezdirmeden üç kez arkasına geçmiş olmalı.", en: "The cut on the carcass is single and clean, but the blade was small. To do that with a knife that size, he had to slip behind the guardian three times without it noticing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eğrisi tuhaf. seninki kadar dik değil ama... standart da sayılmaz. bu adamın penceresinde bir şey eksik. ya da fazla.", en: "his curve's weird. not as steep as yours, but... not standard either. something in this guy's window is missing, or extra." }
        secenekler:
          - id: "sansli"
            tur: "gizle"
            etiket: { tr: "Omuz silk; şanslı olduğunu söyle", en: "Shrug. Say you got lucky" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { guven: -5, saygi: -5 } }
            sonraki: "rakip_iz_kucumse"
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Gözünün içine bakıp gerçek seviyeni söyle", en: "Tell him your real level. Look him in the eye" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - itibar: { lonca: 3 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 15, guven: 5 } }
            sonraki: "rakip_iz_esit"
          - id: "bahis"
            etiket: { tr: "\"Bir sonraki kapıyı ben kapatırım.\" İddiaya gir", en: "\"I'll close the next Gate.\" Make it a bet" }
            etkiler:
              - ahlak: { duzen: -1 }
              - degisken: { rakip_bahsi: 1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { saygi: 10, baglilik: 5 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Senden önce kapıyı kapatan elmalı yabancı hâlâ aklında.", en: "You're still thinking about the stranger with the apple who closed that Gate before you." } }
            sonraki: "rakip_iz_bahis"
          - id: "nereden"
            etiket: { tr: "Nereden geldiğini sor", en: "Ask him where he came from" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { guven: 5, saygi: 3 } }
            sonraki: "rakip_iz_gecmis"
          - id: "elma"
            tur: "gosteris"
            etiket: { tr: "Elmayı o fark etmeden elinden kap", en: "Take the apple out of his hand before he notices" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 14 } }
            etkiler:
              - dikkat: 2
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 20, guven: -5 } }
            sonraki: "rakip_iz_elma"

      - id: "rakip_iz_kucumse"
        paragraflar:
          - { tr: "\"Şanslı,\" diye yineliyor {npc:aras_kurt}, elmadan bir dilim keserken. \"Tabii, ben de şanslıyım. Buralar şanslı dolu; çoğu da öldü.\"", en: "\"Lucky,\" {npc:aras_kurt} repeats, carving a slice off his apple. \"Sure, I'm lucky too. Lots of lucky people around here, and most of them are dead.\"" }
          - { tr: "Leşin üstünden atlayıp ceketinin tozunu silkeliyor; yanından geçerken de ölçü alır gibi omzunu hafifçe omzuna çarpıyor.", en: "He hops off the carcass, slaps the dust off his jacket, and bumps your shoulder on the way past. Light. Like he's taking a measurement." }
          - { tr: "\"Bir dahakine yalan söyleme,\" diyor dönüp bakmadan. \"Sıkıcı oluyor.\"", en: "\"Next time, don't lie,\" he says without turning around. \"It's boring.\"" }
        secenekler:
          - id: "sen_de"
            etiket: { tr: "Arkasından seslen: \"Seninkini sen de söylemedin.\"", en: "Call after him: \"You didn't tell me yours.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6 } }
            sonraki: "@akis"
          - id: "hafife"
            etiket: { tr: "Bırak gitsin; hafife alınmak işine gelir", en: "Let him go. Being underestimated pays off" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 2
              - egilim: { gizlilik: 1 }
            sonraki: "@akis"
          - id: "cekirdek"
            etiket: { tr: "Leşin çekirdeğini al; o unutup gitti", en: "Grab the core from the carcass. He forgot it" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - esya: { canavar_cekirdegi: 1 }
              - iliski: { aras_kurt: { saygi: -2 } }
            sonraki: "@akis"

      - id: "rakip_iz_esit"
        paragraflar:
          - { tr: "Rakamı söylüyorsun. {npc:aras_kurt|in} çakısı elmanın tam ortasında kalakalıyor.", en: "You tell him the number. {npc:aras_kurt|pos} knife stops halfway through the apple." }
          - { tr: "Derken gülmeye başlıyor; yeni oyuncağına kavuşmuş bir çocuk gibi, içten içe. \"Sonunda!\" diyor. \"Günlerdir sıralamaya bakıp bu yarışı tek başıma koştuğumu sanıyordum.\"", en: "Then he laughs, for real, the way a kid laughs at a brand-new toy. \"Finally,\" he says. \"I've been checking the board for days thinking I was running this race alone.\"" }
          - { tr: "Elmanın yarısını sana fırlatıyor. \"Bundan sonra hep birimiz önde olacak,\" diyor. \"Ya da arkada. Göreceğiz.\"", en: "He tosses you half the apple. \"From here on, one of us is always going to be out in front,\" he says. \"Or behind, we'll see.\"" }
        secenekler:
          - id: "isir"
            etiket: { tr: "Elmayı havada kap, bir ısırık al", en: "Catch the apple and take a bite" }
            etkiler:
              - can: 5
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Senden önce kapıyı kapatan elmalı yabancı hâlâ aklında.", en: "You're still thinking about the stranger with the apple who closed that Gate before you." } }
            sonraki: "@akis"
          - id: "yere"
            etiket: { tr: "Elmayı yere bırak: \"Rakibimden lokma almam.\"", en: "Drop the apple. \"I don't take food from rivals.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { saygi: 8, guven: -4 } }
            sonraki: "@akis"

      - id: "rakip_iz_bahis"
        paragraflar:
          - { tr: "\"İddia mı?\" {npc:aras_kurt|in} gözleri parlıyor. \"Neyine?\"", en: "\"A bet?\" {npc:aras_kurt|pos} eyes light up. \"For what?\"" }
          - { tr: "Sen ağzını açamadan kendi cevap veriyor: \"Kaybeden, kazananın adını sıralamada her gördüğünde yüksek sesle okur. Herkesin önünde.\"", en: "Before you can answer, he answers himself: \"Loser has to read the winner's name out loud every time it shows up on the Ranking. In front of everybody.\"" }
          - { tr: "Elini uzatıyor. Avucu sıcacık ve nasır tutmuş; bıçak tutmaya bir haftada alışmış bir el bu.", en: "He sticks out his hand. The palm is calloused and warm, a hand that learned to hold a blade in about a week." }
        secenekler:
          - id: "sik"
            etiket: { tr: "Elini sık", en: "Shake on it" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: 4 } }
            sonraki: "@akis"
          - id: "elma_da"
            etiket: { tr: "\"Kaybeden bir de elma bulup getirir.\"", en: "\"Loser also has to find the winner an apple.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 6 } }
            sonraki: "@akis"

      - id: "rakip_iz_gecmis"
        paragraflar:
          - { tr: "\"Nereden mi?\" {npc:aras_kurt} elmadan bir ısırık alıp ağır ağır çiğniyor. \"Senin geldiğin yerden. Herkesin geldiği yerden: pencere açıldı, ışık, upuzun bir düşüş.\"", en: "\"Where from?\" {npc:aras_kurt} bites the apple and chews slowly. \"Same place as you, same as everybody: window opened, light, long fall.\"" }
          - { tr: "Ama bakışları bir an parlak çizgiye, kapanan kapının izine kayıyor. Orada bir şey arıyor, bulamıyor.", en: "But his eyes slide away for a second, to the bright line where the Gate closed. Looking for something there. Not finding it." }
          - { tr: "\"Bir dahaki soruna bir sırla cevap veririm,\" diyor, ayağa kalkarken. \"Ama önce sen bir sır vereceksin. Adil olalım.\"", en: "\"Next question you ask, I'll answer with a secret,\" he says, standing up. \"But you go first. Let's keep it fair.\"" }
        secenekler:
          - id: "sir_ver"
            tur: "aciga_vur"
            etiket: { tr: "Ona bir sır ver: Günlük Görev'i", en: "Give him a secret: your Daily Quest" }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - bilgi: "aras_gecmisi"
              - iliski: { aras_kurt: { guven: 12, baglilik: 6 } }
              - iliski: { yanki: { guven: -6 } }
            sonraki: "rakip_iz_sir"
          - id: "sakla"
            etiket: { tr: "\"Sırlarım bende kalsın.\"", en: "\"I'll keep my secrets, thanks.\"" }
            etkiler:
              - gizle: 2
              - iliski: { aras_kurt: { saygi: 4 } }
            sonraki: "@akis"

      - id: "rakip_iz_sir"
        paragraflar:
          - { tr: "Her sabah açılan, yalnız senin görebildiğin o pencereyi anlatıyorsun. {npc:aras_kurt} gülmüyor; çakısını kapatıp cebine atıyor.", en: "You tell him about the window that opens every morning, the one only you can see. {npc:aras_kurt} doesn't laugh. He folds the knife and pockets it." }
          - { tr: "\"Bende öyle bir şey yok,\" diyor. \"Bende bir gece var: aktarımdan önceki gece. O gece birini öldürmem gerekiyordu, öldürmedim. Sonra gökyüzü açıldı.\"", en: "\"I don't have anything like that,\" he says. \"What I've got is a night, the night before the transfer. I was supposed to kill somebody that night, and I didn't, and then the sky opened.\"" }
          - { tr: "Başka tek kelime etmeden yürüyüp gidiyor. Bir an, ceketinin sırtında, kumaşın altından bir şey parıldıyor.", en: "He doesn't say anything else. He just walks off, and for a second something glints on the back of his jacket, under the fabric." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Arkasından bakakal", en: "Watch him go" }
            etkiler:
              - iliski: { aras_kurt: { guven: 4 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Senden önce kapıyı kapatan elmalı yabancı hâlâ aklında.", en: "You're still thinking about the stranger with the apple who closed that Gate before you." } }
            sonraki: "@akis"
          - id: "kimi"
            etiket: { tr: "Arkasından seslen: \"Kimi?\"", en: "Call after him: \"Who?\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 4, guven: -2 } }
            sonraki: "@akis"

      - id: "rakip_iz_elma"
        paragraflar:
          - { tr: "Kıpırdadığını bile görmüyor. Elma göz açıp kapayıncaya kadar senin elinde; onun çakısıysa hâlâ havada, boşluğu soyup duruyor.", en: "He never sees you move. One second the apple's in your hand, and his knife is still in the air, peeling nothing." }
          - { tr: "{npc:aras_kurt} önce boş eline, sonra sana bakıyor. Yüzünden sırayla şaşkınlık, öfke ve çok daha tehlikeli bir şey geçiyor: heyecan.", en: "{npc:aras_kurt} looks at his empty hand, then at you. First his face does surprised, then angry, then something way more dangerous: excited." }
          - { tr: "\"Tamam,\" diyor, ağır ağır doğrulurken. \"Tamam, seni yakalayacağım. Bu tehdit değil, takvim.\"", en: "\"Okay,\" he says, getting up slowly. \"Okay, I'm going to catch you. That's not a threat, it's a schedule.\"" }
        secenekler:
          - id: "geri_at"
            etiket: { tr: "Elmayı ona geri at", en: "Toss him back the apple" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: 6 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Senden önce kapıyı kapatan elmalı yabancı hâlâ aklında.", en: "You're still thinking about the stranger with the apple who closed that Gate before you." } }
            sonraki: "@akis"
          - id: "isir_yuru"
            etiket: { tr: "Elmayı ısır, yürüyüp git", en: "Take a bite and walk away" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 8, guven: -6 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -20 }
            sonraki: "@akis"

  # ================================================================== ARAS · 2: ilk yarışı
  - id: "aras_ilk_yaris"
    konum: ["us"]
    perde: [1]
    gun: { min: 9, max: 22 }
    kosul: { bayrak: "aras_tanisildi" }
    agirlik: 5
    etiketler: ["rakip", "aras", "kapi"]
    gerilim: 3
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Kim önce?", en: "Who gets there first?" }
    sahne: "aras_ilk_yaris_1"
    sahneler:
      - id: "aras_ilk_yaris_1"
        paragraflar:
          - { tr: "Gökyüzünde herkesin görebildiği bir pencere beliriyor: [KAPI KARARLILAŞIYOR · KUZEY SIRTI · İLK KAPATANA ÖDÜL]. Kuzey sırtı buradan yarım saatlik yol; koşarsan on dakika.", en: "A public window opens across the sky: [GATE STABILIZING · NORTH RIDGE · REWARD TO FIRST CLOSER]. The north ridge is half an hour from here. Ten minutes at a dead run." }
          - { tr: "Sırtın eteğinde, ağaçların arasında seni bekleyen siyah bir ceket gözüne çarpıyor. {npc:aras_kurt} iki parmağını alnına götürüp selam çakıyor, ardından koşmaya başlıyor.", en: "At the foot of the ridge, between the trees, a black jacket is waiting for you. {npc:aras_kurt} throws you a two-finger salute off his forehead, then takes off running." }
          - { tr: "Yolun yarısında devrilmiş bir otobüsün içinden çığlıklar kopuyor. Kapının sızıntısı onları kıstırmış: içeride üç sivil ve bir çocuk, otobüsün tavanında da sekiz göz.", en: "Halfway up, screaming comes from inside an overturned bus. The Gate's been leaking, and it's got them pinned: three civilians, one kid, and eight eyes up on the roof of the bus." }
          - metin: { tr: "İlk kapı unvanı zaten sende ve {npc:aras_kurt} bunu biliyor. Onu koşturan unvan değil, sensin.", en: "You already hold the world's first Gate title. {npc:aras_kurt} knows it. He isn't running for the title. He's running for you." }
            kosul: { unvan: "ilk_kapi_kapatan" }
          - metin: { tr: "Sıralamaya bakılırsa {npc:aras_kurt} çoktan dokuzuncu seviyeye varmış. Onun için bu yarış unvan değil, hesap meselesi.", en: "According to the board, {npc:aras_kurt} hit level 9 a while ago. For him this race isn't about a title. It's about settling a score." }
            kosul: { npc_seviye_min: { aras_kurt: 9 } }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Otobüsün tavanındaki şey bir sis dokuyucu; ağıyla iki kapıyı da örtmüş. İçeridekilerin havası tükeniyor, on dakikaları yok.", en: "The thing on the bus roof is a fog weaver, and its web has sealed both doors. The people inside are running out of air. They don't have ten minutes." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "unvanlar kalıcıdır, insanlar değil. gözlem bu, tavsiye değil.", en: "titles are permanent. people aren't. that's an observation, not advice." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Otobüs! Otobüse bak!\"", en: "\"The bus! Look at the bus!\"" }
        secenekler:
          - id: "otobus"
            etiket: { tr: "Yarışı unut; otobüstekileri kurtar", en: "Forget the race. Save the people on the bus" }
            etkiler:
              - ahlak: { merhamet: 8, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { aras_kurt: { saygi: 4 } }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["dar_gecit"], kazan: "aras_ilk_yaris_otobus", kaybet: "aras_ilk_yaris_otobus_yenilgi", kac: "aras_ilk_yaris_otobus_kac" }
          - id: "kos"
            etiket: { tr: "Koş. Unvanlar kalıcıdır", en: "Run. Titles are forever" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "aras_ilk_yaris_kapi"
          - id: "ikisi"
            etiket: { tr: "İkisini birden yap: ağı kes, sonra koş", en: "Do both: cut the web, then sprint" }
            gerekli: { stat: { agi: 10 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - can: -10
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "aras_ilk_yaris_ikisi"
          - id: "seslen"
            etiket: { tr: "{npc:aras_kurt|e} bağır: \"Önce otobüs!\"", en: "Yell at {npc:aras_kurt}: \"Bus first!\"" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "aras_ilk_yaris_red", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }, { iliski: { aras_kurt: { guven: -4 } } }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 6, saygi: 4 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 35 }
            sonraki: "aras_ilk_yaris_birlikte"
          - id: "ikisini_birden"
            tur: "gosteris"
            etiket: { tr: "Otobüstekileri kurtar, yine de kapıya ondan önce var", en: "Save the bus, then beat him to the Gate anyway" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 15 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - dikkat: 4
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - xp: 150
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 15, guven: -5 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "aras_ilk_yaris_ezme"

      - id: "aras_ilk_yaris_otobus"
        paragraflar:
          - { tr: "Dokuyucu otobüsün tavanından yuvarlanıp sisin içinde büzülerek can veriyor. Ağı keser kesmez içerideki dört kişi öksüre ağlaya dışarı dökülüyor.", en: "The weaver tumbles off the bus roof and dies curled up in the fog. You cut through the web, and the four people inside spill out, coughing, crying." }
          - { tr: "Derken sırtın tepesinden bir ışık sütunu yükseliyor, gökyüzünde yeni bir pencere açılıyor: kapı kapandı. Üstünde bir isim yazılı; seninki değil.", en: "A pillar of light goes up from the top of the ridge, and a new window opens across the sky: the Gate is closed. There's a name on it. Not yours." }
          - { tr: "Az sonra {npc:aras_kurt} sırttan iniyor; yüzü ter içinde, gözleri parıl parıl. Otobüsü, sivilleri, seni süzüyor: \"Yarışmadın bile.\" Sesinde zaferden eser yok, yalnızca hayal kırıklığı var.", en: "A little later {npc:aras_kurt} comes down off the ridge, face slick with sweat, eyes bright. He looks at the bus, the civilians, you. \"You didn't even race,\" he says, with no victory in it at all, just disappointment." }
        secenekler:
          - id: "yaristim"
            etiket: { tr: "\"Yarıştım. Başka bir şey için.\"", en: "\"I raced. Just for something else.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: 6 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "sivil"
            etiket: { tr: "Sivillere yolu göster; ona cevap verme", en: "Point the civilians to safety. Ignore him" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: -4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "dahaki"
            etiket: { tr: "\"Bir dahakine gerçekten yarışırız. Söz.\"", en: "\"Next time we race for real. Promise.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_otobus_yenilgi"
        paragraflar:
          - { tr: "Ağ bileğine dolanıp seni otobüsün tavanına doğru çekerken sekiz göz sabırla seni izliyor.", en: "The web wraps your wrist and starts reeling you up toward the bus roof while eight eyes watch you, patiently." }
          - { tr: "Derken bir gölge gelip geçiyor; dokuyucunun bacaklarından biri yere düşüyor, ardından bir başkası. {npc:aras_kurt} otobüsün tavanında, soluk soluğa.", en: "Then a shadow flickers past, and one of the weaver's legs hits the ground, then another. {npc:aras_kurt} is up on the bus roof, gasping." }
          - { tr: "\"İkimiz de kaybettik, kuzeyden bir avcı kaptı,\" diyor, uzanıp seni ağdan keserken. \"Bunu bana ödeyeceksin.\"", en: "\"We both lost. Some hunter from up north beat us to it,\" he says, then reaches down and cuts you loose. \"You're paying me back for this.\"" }
        secenekler:
          - id: "odeyecegim"
            etiket: { tr: "\"Ödeyeceğim.\"", en: "\"I will.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "aras_kurt", id: "kurtardi_borc", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "cagirmadim"
            etiket: { tr: "\"Seni çağırmadım.\"", en: "\"Didn't ask for your help.\"" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { aras_kurt: { saygi: 4, guven: -6 } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_otobus_kac"
        paragraflar:
          - { tr: "Dokuyucu sana fazla geliyor. Otobüsün camını kırıp en yakındaki çocuğu dışarı aldıktan sonra geri çekiliyorsun; ağ arkanızdan kapanıyor.", en: "The weaver's too much. You smash a window, haul the nearest kid out, and back off as the web closes behind you." }
          - { tr: "Çocuk kollarında tir tir titriyor. Otobüste kalan üç ses bir süre daha duyuluyor, sonra kesiliyor.", en: "The kid shakes in your arms. The three voices still inside the bus go on for a while. Then they don't." }
          - { tr: "Sırtın tepesinden ışık yükseliyor, gökte bir isim beliriyor; seninki değil.", en: "Up on the ridge, the light goes up. A name. Not yours." }
        secenekler:
          - id: "guvenli"
            etiket: { tr: "Çocuğu güvenli bir yere götür", en: "Get the kid somewhere safe" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -3 }
              - itibar: { siginak: 3 }
              - npc_seviye: { aras_kurt: 1 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "bakma"
            etiket: { tr: "Otobüse dönüp bakma; yürü", en: "Don't look at the bus. Just walk" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - degisken: { hayatta_kalan: -4 }
              - npc_seviye: { aras_kurt: 1 }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_kapi"
        paragraflar:
          - { tr: "Otobüsün yanından geçip gidiyorsun. Çığlıklar bir süre peşini bırakmıyor, sonra sırtın rüzgârı onları yutuyor.", en: "You run right past the bus. The screaming follows you for a while, then the wind on the ridge swallows it." }
          - { tr: "Tepede kapı bir kalp gibi atıp duruyor. {npc:aras_kurt} on adım önünde, ama bu yokuşu ondan iyi bilirsin; bir de kestirmesi var.", en: "At the top, the Gate is pulsing like a heartbeat. {npc:aras_kurt} is ten yards ahead of you. But you know this slope better than he does, and there's a shortcut." }
          - { tr: "Kestirme seni kapının bekçilerinin tam burnunun dibine çıkarıyor: dikenleri kabarmış bir domuzla onun gölgesinde dolanan bir tazı. İkisi de seni bekliyormuşçasına sana dönüyor.", en: "The shortcut spits you out right in front of the Gate's guardians: a boar with its spines up and a hound pacing in its shadow. Both of them turn like they've been expecting you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçilerle savaş; kapıyı sen kapat", en: "Fight the guardians. Close the Gate yourself" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - savas: { dusmanlar: ["diken_domuzu", "sis_tazisi"], ortam: ["karanlik"], kazan: "aras_ilk_yaris_zafer", kaybet: "aras_ilk_yaris_kayip", kac: "aras_ilk_yaris_kayip" }
          - id: "celme"
            etiket: { tr: "Önüne bir dal tekmele; yere kapaklansın", en: "Kick a branch into his path. Let him eat dirt" }
            etkiler:
              - ahlak: { duzen: -4, merhamet: -2 }
              - egilim: { gizlilik: 1 }
              - iliski: { aras_kurt: { guven: -15, saygi: 4 } }
              - hafiza: { npc: "aras_kurt", id: "yarista_hile", agirlik: -40 }
            sonraki: "aras_ilk_yaris_hile"
          - id: "ortak"
            etiket: { tr: "Ona bağır: \"Bekçileri birlikte indirelim!\"", en: "Shout to him: \"We take the guardians together!\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 6 } }
            sonraki: "aras_ilk_yaris_ortak"

      - id: "aras_ilk_yaris_hile"
        paragraflar:
          - { tr: "Dal tam zamanında ayağına dolanıyor. {npc:aras_kurt} yüzüstü kapaklanıp yuvarlanıyor, doğrulup sana bakıyor; ama sen çoktan bekçilerin karşısına dikilmişsin.", en: "The branch catches his ankle right on time. {npc:aras_kurt} goes down, rolls, comes up, and looks at you. You're already squared up with the guardians." }
          - { tr: "\"Demek böyle oynuyoruz,\" diyor; sesi tuhaf bir biçimde sakin. \"Not ettim.\"", en: "\"So that's how we're playing,\" he says, weirdly calm. \"Noted.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçilere dön ve savaş", en: "Turn to the guardians and fight" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - savas: { dusmanlar: ["diken_domuzu", "sis_tazisi"], ortam: ["karanlik"], kazan: "aras_ilk_yaris_zafer", kaybet: "aras_ilk_yaris_kayip", kac: "aras_ilk_yaris_kayip" }
          - id: "kaldir"
            etiket: { tr: "Elini uzat; onu ayağa kaldır", en: "Offer him a hand up" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { guven: 6 } }
            sonraki: "aras_ilk_yaris_ortak"

      - id: "aras_ilk_yaris_ortak"
        paragraflar:
          - { tr: "Bekçileri aranızda oradan oraya oynatıyorsunuz, sen önden, o arkadan. {npc:aras_kurt} bir an orada, bir an yok; bekçiler ha bire yanlış yöne dönüyor.", en: "You dance the guardians between you: you from the front, him from behind. {npc:aras_kurt} is there, then he isn't, and the guardians keep turning the wrong way." }
          - { tr: "Son darbe kimin olacak? Domuz dizlerinin üstüne çöküp tazı sisin içinde dağılırken ikiniz birden kapının çekirdeğine uzanıyorsunuz.", en: "Whose kill is it going to be? The boar drops to its knees, the hound dissolves into fog, and you both reach for the Gate's core at the exact same time." }
        secenekler:
          - id: "kap"
            etiket: { tr: "Çekirdeği önce sen kap", en: "Grab the core first" }
            zar: { stat: "agi", zorluk: 13, tek: true, basarisiz: "aras_ilk_yaris_kayip", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }, { iliski: { aras_kurt: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { duzen: -2 }
              - xp: 120
              - iliski: { aras_kurt: { saygi: 10, guven: -4 } }
            sonraki: "aras_ilk_yaris_zafer"
          - id: "birak"
            etiket: { tr: "Elini çek; çekirdek onun olsun", en: "Pull your hand back. Let him have it" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 12, saygi: 6 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 40 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "aras_ilk_yaris_verdi"

      - id: "aras_ilk_yaris_zafer"
        paragraflar:
          - { tr: "Kapının çekirdeği avucunda çatlayınca ışık sırttan gökyüzüne fışkırıyor. Bütün Öğretici'de, herkesin gözünün önünde aynı anda bir pencere açılıyor.", en: "The Gate's core cracks in your palm, and light shoots off the ridge into the sky. Across the whole Tutorial, a window pops open in front of every single person." }
          - { tr: "Pencerede senin adın yazılı. İki adım ötede {npc:aras_kurt} nefes nefese adını okuyor; dudakları heceleri sayar gibi kıpırdıyor.", en: "Your name is on it. {npc:aras_kurt} is two steps away, gasping, reading your name, lips moving like he's counting the syllables." }
          - { tr: "\"Bir daha olmayacak,\" diyor sonunda. \"Duydun mu? Bir daha olmayacak.\"", en: "\"Never again,\" he finally says. \"You hear me? That never happens again.\"" }
        secenekler:
          - id: "duydum"
            etiket: { tr: "\"Duydum.\" Gülümse", en: "\"Heard you.\" Smile" }
            etkiler:
              - ahlak: { duzen: 1 }
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 10 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "iyi_yaris"
            etiket: { tr: "Elini uzat: \"İyi yarıştın.\"", en: "Offer a hand: \"Good race.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 6, guven: 6 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_kayip"
        paragraflar:
          - { tr: "Bir darbe seni yokuştan aşağı yuvarlıyor; durduğunda nefesin kesilmiş. Başını kaldırdığında {npc:aras_kurt} çekirdeği avucunda ezmiş bile, ışık sırttan gökyüzüne fışkırmış.", en: "One hit sends you rolling down the slope, and when you stop, the wind's knocked clean out of you. By the time you lift your head, {npc:aras_kurt} is crushing the core in his fist and light is shooting off the ridge." }
          - { tr: "Pencerede onun adı yazıyor. Yüzünü sana çevirmiyor bile; doğum günü pastasına bakan bir çocuk gibi gökyüzüne, adının harflerine dalmış.", en: "His name's on the window. He doesn't even look at you. He's looking at the sky, at the letters of his name, like a kid looking at a birthday cake." }
          - { tr: "Sonra dönüp yanına çömeliyor. \"Kalkabilecek misin?\" Sesi kibar; insanın canını en çok da o kibarlık yakıyor.", en: "Then he turns and crouches next to you. \"Can you get up?\" He's being polite, and the politeness is what really stings." }
        secenekler:
          - id: "kendin"
            etiket: { tr: "Kendi başına kalk", en: "Get up on your own" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_kaybedildi"
              - iliski: { aras_kurt: { saygi: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Uzattığı eli tut", en: "Take the hand he's offering" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_kaybedildi"
              - iliski: { aras_kurt: { guven: 8 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_verdi"
        paragraflar:
          - { tr: "Elini çekiyorsun. {npc:aras_kurt} eli çekirdeğin üstünde, bir saniye donakalıyor; gözünü sana dikmiş, tuzağı arıyor.", en: "You pull your hand back. {npc:aras_kurt} freezes for a second, hand over the core, staring at you. Looking for the trap." }
          - { tr: "Tuzak falan yok. Çekirdeği sıkınca ışık yükseliyor, adı gökyüzüne yazılıyor. Ama yüzünde zafer okunmuyor; anlamadığı bir şeye çarpmış birinin yüzü bu.", en: "There isn't one. He crushes the core, the light goes up, and his name gets written across the sky, but there's no victory on his face. It's the face of someone who just ran into something he doesn't understand." }
          - { tr: "\"Neden?\" diye soruyor. \"Bunu neden bana bıraktın?\"", en: "\"Why?\" he asks. \"Why'd you give me that?\"" }
        secenekler:
          - id: "geri_alirim"
            etiket: { tr: "\"Yarın senden geri alacağım.\"", en: "\"I'm taking it back from you tomorrow.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "@akis"
          - id: "ihtiyac"
            etiket: { tr: "\"Senin daha çok ihtiyacın vardı.\"", en: "\"You needed it more.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { aras_kurt: { guven: 6, saygi: -4 } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_red"
        paragraflar:
          - { tr: "\"Önce otobüs!\" diye bağırıyorsun. {npc:aras_kurt} bir an duraksayıp önce otobüse, sonra sana bakıyor; gözlerinin ardında bir hesap dönüyor.", en: "\"Bus first!\" you yell. {npc:aras_kurt} hesitates, looks at the bus, then at you, running numbers behind his eyes." }
          - { tr: "\"Sen kurtar!\" diye bağırıyor, koşmayı bırakmadan. \"Ben de kazanayım; herkes kendi işini yapsın!\"", en: "\"You save them!\" he yells back, still running. \"I'll win, everybody does their job!\"" }
        secenekler:
          - id: "otobuse"
            etiket: { tr: "Otobüse dön", en: "Turn back to the bus" }
            etkiler:
              - ahlak: { merhamet: 6 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["dar_gecit"], kazan: "aras_ilk_yaris_otobus", kaybet: "aras_ilk_yaris_otobus_kac", kac: "aras_ilk_yaris_otobus_kac" }
          - id: "onunla"
            etiket: { tr: "Onunla birlikte koş", en: "Run with him" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "aras_ilk_yaris_kapi"

      - id: "aras_ilk_yaris_birlikte"
        paragraflar:
          - { tr: "{npc:aras_kurt} yokuşun ortasında durup bir küfür savuruyor, sonra geri dönüyor. \"Bunu hesabına yazıyorum!\" diye bağırarak otobüsün tavanına sıçrıyor.", en: "{npc:aras_kurt} stops dead halfway up the slope, swears, and doubles back. \"I'm putting this on your tab!\" he shouts, vaulting onto the bus roof." }
          - { tr: "Dokuyucu ikinizi birden beklemiyordu. Sen ağları kesiyorsun, o bacakları; bir dakika sonra dört kişi çimenlerin üstünde öksürürken dokuyucu sırtüstü yatıyor.", en: "The weaver wasn't ready for two of you. You cut webs, he cuts legs, and a minute later four people are coughing on the grass and the weaver's flat on its back." }
          - { tr: "Sırtın tepesinden ışık yükseliyor; pencerede ikinizden hiçbirinin olmayan bir isim var. {npc:aras_kurt} gökyüzüne uzun uzun bakıp sonra sana dönüyor: \"Değdi mi?\"", en: "Light goes up from the top of the ridge, with a name on the window that isn't either of yours. {npc:aras_kurt} stares at the sky for a long time, then at you: \"Worth it?\"" }
        secenekler:
          - id: "cocuk"
            etiket: { tr: "Çocuğu göster: \"Sen söyle.\"", en: "Point at the kid. \"You tell me.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3 }
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "hayir"
            etiket: { tr: "\"Hayır. Ama yine yapardım.\"", en: "\"No. But I'd do it again.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { saygi: 8 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_ikisi"
        paragraflar:
          - { tr: "Otobüsün tavanına sıçrayıp ağı üç hamlede kesiyor, sivilleri camlardan dışarı itiyorsun. Dokuyucu daha dönemeden sen yeniden yokuşa vurmuşsun.", en: "You leap onto the bus roof, cut the web in three strokes, and shove the civilians out through the windows. Before the weaver can even turn, you're already back on the slope." }
          - { tr: "Ama {npc:aras_kurt} on saniye önde ve bu yarışta on saniye koca bir ömür. Sırtın tepesine vardığında ışık çoktan yükselmiş; pencerede onun adı yazıyor.", en: "But {npc:aras_kurt} had ten seconds on you, and in this race ten seconds is a lifetime. By the time you crest the ridge the light's already going up, with his name on it." }
          - { tr: "Seni görünce gülüyor ama yarım ağızla. \"Otobüs için durdun,\" diyor. \"Durmasaydın...\" Cümlenin sonunu getirmiyor.", en: "He laughs when he sees you, but it's half a laugh. \"You stopped for the bus,\" he says. \"If you hadn't...\" He doesn't finish." }
        secenekler:
          - id: "biliyorum"
            etiket: { tr: "\"Durmasaydım kazanırdım. Biliyorum.\"", en: "\"If I hadn't, I'd have won. I know.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: 10 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"
          - id: "sen_dur"
            etiket: { tr: "\"Bir dahaki otobüste de sen dur.\"", en: "\"Next bus, you stop.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 6 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Kuzey sırtındaki kapı yarışından beri {npc:aras_kurt|in} adı aklının bir köşesinde duruyor.", en: "Ever since that race to the Gate on the north ridge, {npc:aras_kurt|pos} name has been sitting in the back of your mind." } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_ezme"
        paragraflar:
          - { tr: "Otobüsün tavanındaki dokuyucu seni göremeden ölüp gidiyor. Ağı tek hamlede kesip sivilleri tek kolunla dışarı alıyorsun.", en: "The weaver on the bus roof dies before it ever sees you. One stroke for the web, one arm to haul the civilians out." }
          - { tr: "Ardından koşuya geçiyorsun. {npc:aras_kurt} sırtın yarısına varmış; yanından geçerken estirdiğin rüzgâr ceketini havalandırıyor. Dönüp arkana bakmıyorsun bile.", en: "Then you run. {npc:aras_kurt} is halfway up the ridge. When you blow past him, your wind flips his jacket up. You don't even look back." }
          - { tr: "Kapı bekçisiyle birlikte avucunun içinde kırılıyor. Gökyüzündeki pencere adını yazdığında {npc:aras_kurt} hâlâ yokuşta; durmuş, soluk soluğa sana bakıyor.", en: "The Gate breaks in your fist, guardian and all. When the window in the sky spells out your name, {npc:aras_kurt} is still on the slope, stopped, breathing hard, staring up at you." }
        secenekler:
          - id: "el_salla"
            etiket: { tr: "Ona el salla", en: "Give him a little wave" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { aras_kurt: { saygi: 6, guven: -6 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -25 }
            sonraki: "@akis"
          - id: "bekle"
            etiket: { tr: "Aşağı in; nefesini toplamasını bekle", en: "Walk down. Wait for him to catch his breath" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { saygi: 8, guven: 6 } }
            sonraki: "@akis"

  # ================================================================== ARAS · 3: sıralama meydanı
  - id: "aras_sira_meydan"
    konum: ["us"]
    perde: [1]
    gun: { min: 15, max: 27 }
    kosul: { bayrak: "aras_tanisildi" }
    agirlik: 5
    etiketler: ["rakip", "aras", "siralama", "duello"]
    gerilim: 4
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Sıralamada başa baş", en: "Neck and neck on the board" }
    sahne: "aras_sira_meydan_1"
    sahneler:
      - id: "aras_sira_meydan_1"
        paragraflar:
          - { tr: "Sabah Küresel Sıralama herkesin penceresinde güncelleniyor. Adınla {npc:aras_kurt|in} adı alt alta duruyor; aradaki fark, Sistem'in deyişiyle, \"istatistiksel olarak anlamsız\".", en: "Morning, and the Global Ranking refreshes in everyone's window. Your name and {npc:aras_kurt|pos} sit one right on top of the other, and the gap between them is, in the System's own words, \"statistically insignificant.\"" }
          - { tr: "Öğleye doğru peşinde yirmiye yakın meraklıyla kampına çıkıp geliyor: kimi {fraksiyon:lonca|in} silahlılarından, kimi sıradan hayatta kalanlardan. Biri, akşama kadar kimin bir numara olacağına iddiaya girildiğini fısıldıyor.", en: "Around noon he walks into your camp with close to twenty rubberneckers behind him, some of them {fraksiyon:lonca} muscle, some just regular survivors. Somebody whispers that people are betting on who'll be number one by dark." }
          - { tr: "\"Bu liste ikimize dar,\" diyor {npc:aras_kurt}, ceketini çıkarıp toprağa fırlatırken. \"Hadi, kim önde, herkes görsün.\"", en: "\"The board's too small for both of us,\" {npc:aras_kurt} says, shrugging off his jacket and dropping it in the dirt. \"Come on. Let's show everybody who comes first.\"" }
          - metin: { tr: "İkiniz de ilk üçtesiniz; bu meydanda ne olursa olsun, akşam olmadan bütün Öğretici duyacak.", en: "You're both in the top three. Whatever happens here, the whole Tutorial will be talking about it by dark." }
            kosul: { degisken_max: { sira: 3 } }
          - metin: { tr: "Kuzey sırtından beri bu anı bekliyor. O gün senin adını gökyüzünden yüksek sesle okuduğunu hâlâ unutmamış.", en: "He's been waiting for this since the north ridge. He still hasn't forgotten reading your name off the sky." }
            kosul: { bayrak: "aras_yarisi_kazanildi" }
          - metin: { tr: "Kuzey sırtında ona bıraktığın zafer hâlâ boğazında duruyor; yenmiş bir lokma gibi değil, yutulamayan bir kemik gibi.", en: "The win you handed him on the north ridge is still stuck in his throat. Not like a meal. Like a bone he can't swallow." }
            kosul: { bayrak: "aras_yarisi_birakildi" }
          - metin: { tr: "Kuzey sırtında yerde yatarken sana uzattığı eli hatırlıyorsun. O da unutmamış; bugün kibarlığı bir kenara bırakmasının sebebi bu.", en: "You remember the hand he held out to you on the north ridge while you were flat on your back. So does he. That's why he's not being polite today." }
            kosul: { bayrak: "aras_yarisi_kaybedildi" }
        sezgiler:
          - kosul: { stat: { per: 11 } }
            metin: { tr: "Sol omzu biraz düşük duruyor; dün bir yerde darbe almış, belli etmiyor. İlk üç hamlesi sağdan gelecek.", en: "He's carrying his left shoulder a little low. Took a hit somewhere yesterday and he's hiding it. His first three moves will all come from the right." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eğrisi değişmiş. bir hafta önce standarttı, şimdi değil. ya biri ona da bir şey verdi ya da o bir şey aldı.", en: "his curve changed. a week ago it was standard, now it isn't. either someone gave him something too, or he took it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Yapma, lütfen. Bu oyun değil.\"", en: "\"Don't. Please. This isn't a game.\"" }
          - npc: "deniz_arman"
            metin: { tr: "\"Yine herkesin önünde mi? Tabii, neden olmasın.\"", en: "\"In front of everybody again? Sure. Why not.\"" }
            kosul: { bayrak: "deniz_guveni_yarali" }
        secenekler:
          - id: "duello"
            etiket: { tr: "Kabul et; meydanda dövüşün", en: "Accept. Settle it in front of everyone" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - dikkat: 3
              - savas: { dusmanlar: ["npc:aras_kurt"], kazan: "aras_sira_meydan_zafer", kaybet: "aras_sira_meydan_yenilgi", kac: "aras_sira_meydan_kacis" }
          - id: "reddet"
            tur: "gizle"
            etiket: { tr: "Reddet: \"Seyirci için dövüşmem.\"", en: "Refuse: \"I don't fight for an audience.\"" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: -10, guven: 4 } }
              - hafiza: { npc: "aras_kurt", id: "duelloyu_reddetti", agirlik: -15 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Meydandaki o sabahtan beri pencerende bir şeyin titrediğini fark ediyorsun.", en: "Ever since that morning in the square, you've noticed something flickering in your window." } }
            sonraki: "aras_sira_meydan_red"
          - id: "baska_yaris"
            etiket: { tr: "Başka bir yarış öner: kim daha çok insan kurtarır", en: "Propose a new race: who saves more people" }
            gerekli: { stat: { cha: 9 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 3 }
              - iliski: { aras_kurt: { guven: 8, saygi: 4 } }
            sonraki: "aras_sira_meydan_baska"
          - id: "gece"
            etiket: { tr: "Onu kenara çek; aktarım gecesini sor", en: "Pull him aside. Ask about the night before the transfer" }
            goster: { bilgi: "aras_gecmisi" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { guven: 10 } }
            sonraki: "aras_sira_meydan_sir"
          - id: "parmak"
            tur: "gosteris"
            etiket: { tr: "Bıçağını iki parmağınla havada yakala", en: "Catch his blade between two fingers" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 16 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
              - dikkat: 5
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 20, korku: 10, guven: -5 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -20 }
            sonraki: "aras_sira_meydan_parmak"
          - id: "maske"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni herkese göster", en: "Show everyone your true level" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - itibar: { lonca: 5, yukselenler: 3 }
              - ahlak: { duzen: 2, insanlik: -1 }
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 12, guven: -8 } }
            sonraki: "aras_sira_meydan_maske"

      - id: "aras_sira_meydan_zafer"
        paragraflar:
          - metin: { tr: "{npc:aras_kurt} sırtüstü yerde yatıyor, göğsü körük gibi inip kalkıyor. Seyirciler soluklarını tutmuş; ne alkışlayan var ne çekip giden.", en: "{npc:aras_kurt} is flat on his back, chest going like a bellows. The crowd's holding its breath. Nobody claps, and nobody leaves." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt} yerde yatıyor ve bir daha kalkmayacak. Seyirciler geri çekiliyor; biri kusuyor, biri dua ediyor, çoğu da gözünü sana dikmiş öylece bakıyor.", en: "{npc:aras_kurt} is on the ground, and he's never getting up. The crowd backs away. Someone throws up, someone prays, and most of them just stare at you." }
            kosul: { npc_olu: "aras_kurt" }
          - metin: { tr: "\"Tamam,\" diyor sana değil, gökyüzüne. \"Tamam, bugün sen.\" Sonra gülüyor; canı yana yana, ama gülüyor.", en: "\"Okay,\" he tells the sky, not you. \"Okay, today it's you.\" Then he laughs; it hurts, but he laughs." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Pencerende Küresel Sıralama güncelleniyor: bir isim silinip seninki bir basamak yukarı çıkıyor. Sistem bunu bildirime bile değer bulmuyor, tek bir satırla geçiştiriyor.", en: "The Global Ranking refreshes in your window. One name gets deleted and yours climbs a rung. The System doesn't even send a notification, just a line." }
            kosul: { npc_olu: "aras_kurt" }
          - metin: { tr: "Sıralamada adın artık onunkinin üstünde; herkes de bunu gözüyle gördü.", en: "Your name sits above his on the board now, and everybody saw it happen." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt|in} ceketi hâlâ meydanın kenarında, çıkarıp attığı yerde toza bulanmış yatıyor.", en: "{npc:aras_kurt|pos} jacket is still lying at the edge of the clearing, in the dirt, right where he dropped it." }
            kosul: { npc_olu: "aras_kurt" }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Elini uzat; onu ayağa kaldır", en: "Give him a hand up" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { aras_kurt: { guven: 12, saygi: 8, baglilik: 6 } }
              - hafiza: { npc: "aras_kurt", id: "yerden_kaldirdi", agirlik: 40 }
            sonraki: "@akis"
          - id: "yerde"
            etiket: { tr: "Onu yerde bırak; arkanı dön", en: "Leave him in the dirt. Turn your back" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - iliski: { aras_kurt: { saygi: 6, guven: -10 } }
              - hafiza: { npc: "aras_kurt", id: "yerde_birakti", agirlik: -40 }
            sonraki: "@akis"
          - id: "yarin"
            etiket: { tr: "Yanına çömel: \"Yarın bir daha?\"", en: "Crouch next to him. \"Again tomorrow?\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { aras_kurt: { baglilik: 8, saygi: 6 } }
            sonraki: "@akis"
          - id: "gom"
            etiket: { tr: "Onu kendi ellerinle göm", en: "Bury him with your own hands" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"
          - id: "ceket"
            etiket: { tr: "Ceketini alıp sırtına geçir", en: "Take his jacket. Put it on" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - dikkat: 4
              - itibar: { lonca: 4, yukselenler: 4, siginak: -6 }
            sonraki: "@akis"
          - id: "baska"
            etiket: { tr: "Kalabalığa dön: \"Başka gelen?\"", en: "Turn to the crowd. \"Anybody else?\"" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - dikkat: 6
              - itibar: { lonca: 6, siginak: -8 }
            sonraki: "@akis"

      - id: "aras_sira_meydan_yenilgi"
        paragraflar:
          - { tr: "Yere serilmişsin. Bıçağın soğuk ağzı boğazına dayalı, {npc:aras_kurt|in} dizi göğsünde. Seyirciler güreş maçındaymış gibi yüksek sesle sayıyor.", en: "You're on the ground. The cold edge of the blade is at your throat and {npc:aras_kurt|pos} knee is on your chest. The crowd is counting out loud, like it's a wrestling match." }
          - { tr: "Üçe gelince bıçağı çekiyor. \"Bugün ben,\" diyor, yalnız senin duyabileceğin kadar alçak sesle. \"Ama ikimiz de biliyoruz, bu iş bitmedi.\"", en: "On three, he pulls the blade back. \"Today it's me,\" he says, low enough that only you can hear. \"But we both know this isn't over.\"" }
          - { tr: "Sıralama güncelleniyor; artık onun adı seninkinin üstünde. Ceketini yerden alıp tozunu silkeledikten sonra sana elini uzatıyor.", en: "The board refreshes, and his name's above yours now. He picks his jacket up off the ground, shakes the dust out, and holds out his hand." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Elini tut", en: "Take his hand" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "kendin"
            etiket: { tr: "Kendi başına kalk", en: "Get up on your own" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { saygi: 6 } }
            sonraki: "@akis"
          - id: "oldururum"
            etiket: { tr: "\"Bir dahaki sefere seni öldürürüm.\"", en: "\"Next time, I kill you.\"" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { korku: 4, guven: -10, saygi: 6 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_kacis"
        paragraflar:
          - { tr: "Dövüşün ortasında geri çekilip kalabalığın arasından meydanın dışına sıvışıyorsun. Arkandan önce yuhalar, ardından kahkahalar kopuyor.", en: "Midfight, you back off, through the crowd and out of the clearing. Booing goes up behind you. Then laughter." }
          - { tr: "{npc:aras_kurt} peşine düşmüyor, yalnızca arkandan sesleniyor: \"Sıralama unutmaz!\" Haklı da: akşam olduğunda adın listede bir basamak aşağı inmiş.", en: "{npc:aras_kurt} doesn't chase you; he just calls after you: \"The board doesn't forget!\" He's right, and by evening your name's a rung lower on the list." }
        secenekler:
          - id: "umursama"
            etiket: { tr: "Umursama; sıralama dediğin bir sayıdan ibaret", en: "Shrug it off. The board's just a number" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gizle: 4
              - iliski: { aras_kurt: { saygi: -8 } }
            sonraki: "@akis"
          - id: "antrenman"
            etiket: { tr: "Bütün gece antrenman yap", en: "Train through the night" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { agi: 1 }
              - gunluk: { antrenman: 1 }
              - iliski: { aras_kurt: { saygi: -4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_red"
        paragraflar:
          - { tr: "\"Seyirci için dövüşmem,\" deyip ateşinin başına dönüyorsun. Kalabalık homurdanıyor; biri yere tükürüyor, bir başkası iddiaya yatırdığını geri istiyor.", en: "\"I don't fight for an audience,\" you say, and turn back to your fire. The crowd grumbles. One survivor spits in the dirt, and another wants his bet back." }
          - { tr: "{npc:aras_kurt} uzun uzun seni süzüyor. \"Korkuyorsun,\" diyor ama emin değil; sesindeki soru işaretini herkes duyuyor.", en: "{npc:aras_kurt} looks at you for a long time. \"You're scared,\" he says. But he isn't sure, and everybody can hear the question mark in it." }
          - { tr: "Ceketini kaptığı gibi çekip gidiyor. Kalabalık dağılırken birkaç kişi geride kalıyor; merak ettikleri sen değilsin, neden reddettiğin.", en: "He grabs his jacket and leaves. As the crowd breaks up a few people hang back, curious not about you, but about why you said no." }
        secenekler:
          - id: "konus"
            etiket: { tr: "Kalanlarla konuş", en: "Talk to the ones who stayed" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { siginak: 3, sessiz_ag: 2 }
            sonraki: "@akis"
          - id: "odun"
            etiket: { tr: "Ateşe odun at; kimseyle konuşma", en: "Feed the fire. Talk to no one" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 2
            sonraki: "@akis"

      - id: "aras_sira_meydan_baska"
        paragraflar:
          - { tr: "\"Kim daha çok insan kurtarırsa,\" diyorsun, bütün kalabalığın duyacağı kadar yüksek sesle. \"Akşama kadar. Sayıyı {fraksiyon:siginak} tutsun.\"", en: "\"Whoever saves more people,\" you say, loud enough for the whole crowd. \"Until sundown. Let the {fraksiyon:siginak} keep count.\"" }
          - { tr: "{npc:aras_kurt} sana yabancı bir dilde konuşuyormuşsun gibi bakıyor. Derken kalabalık alkışa başlıyor; artık geri adım atamayacağını o da anlıyor.", en: "{npc:aras_kurt} stares at you like you're speaking another language. Then the crowd starts clapping, and he realizes he can't back out." }
          - { tr: "Akşam sayılar geliyor: ikiniz onlarca insanı sisten, kapılardan, birbirlerinin elinden çekip çıkarmışsınız. Bu seferlik kimin kazandığı kimsenin umurunda değil.", en: "By sundown the numbers are in. Between the two of you, dozens of people pulled out of the fog, out of Gates, out of each other's hands. For once, nobody cares who won." }
        secenekler:
          - id: "ona_birak"
            etiket: { tr: "Zaferi ona bırak", en: "Let him have the win" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "ilan"
            etiket: { tr: "Sayıları topla, kendini kazanan ilan et", en: "Count it up. Declare yourself the winner" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - itibar: { siginak: 2 }
              - iliski: { aras_kurt: { saygi: 6, guven: -4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_sir"
        paragraflar:
          - { tr: "Onu kalabalıktan uzaklaştırıp yıkık bir duvarın arkasına çekiyorsun. \"Aktarımdan önceki gece,\" diyorsun. \"Kimi öldürmen gerekiyordu?\"", en: "You pull him away from the crowd, behind a broken wall. \"The night before the transfer,\" you say. \"Who were you supposed to kill?\"" }
          - { tr: "{npc:aras_kurt|in} yüzü bir saniyeliğine çırılçıplak kalıyor, sonra kepenk iner gibi kapanıyor. \"Bunu bir daha sorma,\" diyor. \"Hele el âlemin önünde asla.\"", en: "For one second {npc:aras_kurt|pos} face is completely bare, and then it shuts. \"Don't ask me that again,\" he says. \"Never in front of people.\"" }
          - { tr: "Ama gitmiyor. Duvara yaslanmış, meydandaki kalabalığı başka bir dünyayı seyreder gibi seyrediyor. \"Bugün dövüşmeyelim,\" diyor sonunda. \"Belki yarın.\"", en: "But he doesn't leave; he leans on the wall and watches the crowd like they're in another world. \"Let's not fight today,\" he finally says. \"Maybe tomorrow.\"" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "\"Yarın.\" Kalabalığa birlikte dönün", en: "\"Tomorrow.\" Walk back out together" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Meydandaki o sabahtan beri pencerende bir şeyin titrediğini fark ediyorsun.", en: "Ever since that morning in the square, you've noticed something flickering in your window." } }
            sonraki: "@akis"
          - id: "bir_gun"
            etiket: { tr: "\"Bir gün bana anlatacaksın.\"", en: "\"Someday you're telling me.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { aras_kurt: { saygi: 4, guven: 4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_parmak"
        paragraflar:
          - { tr: "Bıçak tam beklediğin gibi sağdan geliyor. İki parmağını kaldırdığında çelik olduğu yerde, havada kalakalıyor.", en: "The blade comes in from the right, exactly like you knew it would. You lift two fingers, and the steel just stops there, in midair." }
          - { tr: "Meydan buz kesiyor. {npc:aras_kurt} bıçağı bir kez, iki kez çekmeye uğraşıyor ama bıçak kıpırdamıyor bile.", en: "The whole clearing goes dead still. {npc:aras_kurt} tries to pull the blade back, once, twice. It won't budge." }
          - { tr: "\"Bu da ne...\" diyor, cümlenin gerisi gelmiyor. Gözlerinde ilk kez rekabetten başka bir şey beliriyor: korku.", en: "\"What the...\" he says, and the rest of the sentence never shows up. For the first time there's something in his eyes besides competition. Fear." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bıçağı bırak; geri çekil", en: "Let go of the blade. Step back" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 6, korku: -4 } }
            sonraki: "@akis"
          - id: "kir"
            etiket: { tr: "Bıçağı kır", en: "Snap the blade" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - dikkat: 3
              - itibar: { lonca: 5 }
              - iliski: { aras_kurt: { korku: 8, saygi: 4, guven: -6 } }
            sonraki: "@akis"
          - id: "yetis"
            etiket: { tr: "Kulağına eğil: \"Yetiş bana.\"", en: "Lean in close: \"Catch up.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { aras_kurt: { saygi: 10, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" }, hatirlatma: { tr: "Meydandaki o sabahtan beri pencerende bir şeyin titrediğini fark ediyorsun.", en: "Ever since that morning in the square, you've noticed something flickering in your window." } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_maske"
        paragraflar:
          - { tr: "Pencereni herkese açıyorsun. Görünen seviyenin altındaki gerçek rakam, bütün meydanın gözü önünde Sistem mavisiyle parlıyor.", en: "You open your window to everyone. Under your public level, the real number glows in the System's blue in front of the whole clearing." }
          - { tr: "Kalabalık bir adım geri çekiliyor. {npc:aras_kurt} rakama uzun uzun baktıktan sonra kendi penceresini açıp karşılaştırıyor, sonra kapatıyor.", en: "The crowd takes a step back. {npc:aras_kurt} stares at the number for a long time. Opens his own window, compares, closes it." }
          - { tr: "\"Saklıyormuşsun,\" diyor; sesi tuhaf biçimde kırgın. \"Bunca zamandır. Ben seninle yarışıyordum, sen benimle oynuyormuşsun.\"", en: "\"You've been hiding it,\" he says, weirdly hurt. \"All this time. I was racing you, and you were just playing with me.\"" }
        secenekler:
          - id: "herkesle"
            etiket: { tr: "\"Yalnızca seninle değil. Herkesle.\"", en: "\"Not just you. Everybody.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 4 } }
            sonraki: "@akis"
          - id: "kos"
            etiket: { tr: "\"Şimdi yine koş. Bu sefer gerçek hedefe.\"", en: "\"Now race me again. The real target this time.\"" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { saygi: 10, baglilik: 8 } }
            sonraki: "@akis"
          - id: "yine_de"
            etiket: { tr: "Dövüşü yine de kabul et", en: "Accept the duel anyway" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["npc:aras_kurt"], kazan: "aras_sira_meydan_zafer", kaybet: "aras_sira_meydan_yenilgi", kac: "aras_sira_meydan_kacis" }
