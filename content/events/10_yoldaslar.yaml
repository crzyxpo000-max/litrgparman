# Parti A — Yoldaş yayları (Perde 1). docs/PERDE1.md sözleşmesi.
# Deniz: "arkadaşımın bir canavara ya da tanrıya dönüşmesini izlemek" (bulusma → hesap → ateş başı → kardeş izi → son seçim).
# {npc:yanki}: istasyon sinyali → sinyal cevap veriyor → bozuk satır (bilgi: yanki_parcasi). Aras: iz → ilk yarışı → sıralama meydanı.
# Mücadele (Gün 1–11) ve Hakimiyet (bayrak kirilma_yasandi) evreleri aynı olayda koşullu paragraf/seçeneklerle ayrışır.
# Yankı'nın satırları tırnaksız ve küçük harflidir (fısıltı). İngilizcede Deniz için zamir belirteci kullanılır.
olaylar:
  # ================================================================== DENİZ · 1: buluşma
  - id: "deniz_bulusma"
    perde: [1]
    bolge: ["ogretici_orman"]
    gun: { min: 1, max: 20 }
    kosul: { bayrak_yok: "deniz_el_tutuldu" }
    agirlik: 8
    etiketler: ["deniz", "karsilasma", "kesif"]
    gerilim: 3
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Tanıdık bir ses", en: "A voice you know" }
    sahne: "deniz_bulusma_1"
    sahneler:
      - id: "deniz_bulusma_1"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin içinden biri adını haykırıyor; ses kısılmış, paramparça, ama tanıyorsun. On yıl boyunca her sabah iskelede \"Vapur kaçıyor!\" diye bağıran ses bu.", en: "Somebody's screaming your name through the fog, voice shredded, but you know it. Ten years of that same voice yelling \"We're gonna miss the ferry!\" across the terminal every morning." }
          - { tr: "{npc:deniz_arman} devrilmiş bir çamın köklerine sırtını vermiş, elinde kırık bir tabela direği. Etrafında üç sis tazısı dönüyor; hırlamadan, acele etmeden, avını önce yoran türden bir sabırla.", en: "{npc:deniz_arman} has {zamir:deniz_arman|onun} back to the roots of a fallen pine, swinging a snapped-off signpost. Three fog hounds circle in close. No snarling, no hurry, just the kind of patience that wears prey down first." }
          - { tr: "Kolunda kan var. Tazılar seni henüz fark etmedi; rüzgâr senden yana. Bir saniyen var, belki iki.", en: "There's blood on {zamir:deniz_arman|onun} arm. The hounds haven't caught your scent yet, and the wind's on your side. You've got one second, maybe two." }
          - metin: { tr: "Bir zamanlar bu manzara seni olduğun yere çivilerdi. Şimdi tazıların her adımını, her nefesini, aralarındaki her boşluğu aynı anda görüyorsun; zaman yalnızca senin için yavaşlamış gibi.", en: "There was a time this would've nailed you to the spot. Now you can see every step, every breath, every gap between them all at once, like time slowed down just for you." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Soldaki tazı sol ön ayağına basmıyor. Sürü onu kollamak için dönüp duruyor; zincirin zayıf halkası o.", en: "The one on the left won't put weight on its front paw. The pack keeps circling to cover it. That's the weak link." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "üç tazı, ikisi gerçek. üçüncüsü sisin yankısı; dişi yok. bana güven, yankılardan anlarım.", en: "three hounds, two of them real. the third is just the fog echoing them; no teeth. trust me, i know echoes." }
        secenekler:
          - id: "atil"
            etiket: { tr: "Aralarına dal, tazıları üstüne çek", en: "Dive in and pull the hounds onto you" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
              - savas: { dusmanlar: ["sis_tazisi", "sis_tazisi"], ortam: ["karanlik"], kazan: "deniz_bulusma_zafer", kaybet: "deniz_bulusma_yenilgi", kac: "deniz_bulusma_kacis" }
          - id: "tuzak_kur"
            etiket: { tr: "Topal tazıyı ayır, sürüyü dağıt", en: "Cut off the limping one and scatter the pack" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
              - xp: 60
            sonraki: "deniz_bulusma_tuzak"
          - id: "izle"
            etiket: { tr: "Bekle. Önce tazılar onu yorsun", en: "Wait. Let the hounds wear {zamir:deniz_arman|onu} down first" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - iliski: { deniz_arman: { guven: -20 } }
              - hafiza: { npc: "deniz_arman", id: "tazilar_bekledi", agirlik: -45 }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - bayrak: "deniz_bekletildi"
              - gorev: { deniz_bul: "tamam" }
              - tohum: { olay: "deniz_hesap", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "deniz_bekletildi", yoldas: "deniz_arman" } }
            sonraki: "deniz_bulusma_bekleyis"
          - id: "bak"
            tur: "gosteris"
            etiket: { tr: "Sisten çık ve tazılara yalnızca bak", en: "Step out of the fog and just look at them" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { wil: 14 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 2
              - iliski: { deniz_arman: { saygi: 10, korku: 5 } }
              - yoldas_katil: "deniz_arman"
              - bayrak: "deniz_bulundu"
              - gorev: { deniz_bul: "tamam" }
            sonraki: "deniz_bulusma_ezme"

      - id: "deniz_bulusma_zafer"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Son tazı sisin içinde dağılıyor; geride bir avuç ıslak duman ve bir tutam kürk kalıyor. {npc:deniz_arman} köklerin dibine kayıyor, göğsü körük gibi inip kalkıyor.", en: "The last hound comes apart in the fog, leaving a handful of wet smoke and a tuft of fur. {npc:deniz_arman} slides down against the roots, chest heaving like a bellows." }
          - { tr: "Sonra gülmeye başlıyor; korkunun ardından gelen, bir türlü durmayan o kesik gülüş. \"Geç kaldın,\" diyor. \"Vapuru da hep sen kaçırtırdın.\"", en: "Then the laughing starts, the jagged kind that comes after terror and won't quit. \"You're late,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You always made us miss the ferry, too.\"" }
          - { tr: "Kolundaki yara derin değil ama elleri titriyor. Gözleri seni baştan aşağı tarıyor; gerçekten sen olup olmadığını kontrol eder gibi.", en: "The cut on {zamir:deniz_arman|onun} arm isn't deep, but {zamir:deniz_arman|onun} hands won't stop shaking. {npc:deniz_arman|pos} eyes go over you head to toe, like checking it's really you." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Elini uzat, onu ayağa kaldır", en: "Reach down and pull {zamir:deniz_arman|onu} up" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 15, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 45 }
            sonraki: "@akis"
          - id: "sar"
            etiket: { tr: "Önce kolunu sar; konuşmak sonra", en: "Patch up that arm first. Talk later" }
            gerekli: { esya: { kirmizi_ot: 1 } }
            etkiler:
              - ahlak: { merhamet: 4 }
              - esya: { kirmizi_ot: -1 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 45 }
            sonraki: "@akis"
          - id: "anlat"
            etiket: { tr: "Ona kafandaki sesi anlat", en: "Tell {zamir:deniz_arman|onu} about the voice in your head" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 12 } }
              - iliski: { yanki: { guven: -10 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - hafiza: { npc: "deniz_arman", id: "yanki_anlatildi", agirlik: 30 }
            sonraki: "deniz_bulusma_sir"

      - id: "deniz_bulusma_sir"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Anlatıyorsun: aktarımdaki bozuk satırı, adı olmayan bir renge dönen pencereyi, kafanın içinde fısıldayan şeyi. {npc:deniz_arman} sözünü bir kez bile kesmiyor.", en: "You tell {zamir:deniz_arman|onu} everything: the corrupted line during the transfer, the window that turned a color with no name, the thing whispering inside your skull. {npc:deniz_arman} doesn't interrupt once." }
          - { tr: "\"Yani,\" diyor sonunda, \"kafanda bir kiracı var.\" Gülümsemeye çalışıyor, beceremiyor. \"Kirasını ödüyor mu bari?\"", en: "\"So,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}, \"you've got a roommate in your head.\" A smile tries to happen and doesn't make it. \"Is it at least paying rent?\"" }
          - { tr: "Kafanın içinde bir şey soğuyor. Ses arkasında yalnızca tek bir kelime bırakıyor, buz gibi: anlattın.", en: "Something inside your head goes cold. The voice leaves exactly one word behind, flat as ice: told." }
        secenekler:
          - id: "guven"
            etiket: { tr: "\"Sana anlatmasam kime anlatacaktım?\"", en: "\"If I can't tell you, who can I tell?\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "İçinden, sesten özür dile", en: "Apologize to the voice, silently" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "\"Kimseye söyleme. Ciddiyim.\"", en: "\"Don't tell anybody. I mean it.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 2
              - iliski: { deniz_arman: { guven: 3, saygi: 4 } }
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_yenilgi"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Dizlerin çözülüyor. Son gördüğün şey üstüne kapanan sisten bir ağız; sonra bir tabela direği tam o ağzın ortasına iniyor.", en: "Your knees give out. The last thing you see is a mouth made of fog coming down on you. Then a signpost comes down right in the middle of it." }
          - { tr: "Kendine geldiğinde {npc:deniz_arman} seni bir kayanın kovuğuna sürüklemiş, kendi gömleğinden yırttığı bir şeritle bacağını sarıyor. Kendi yarası hâlâ açık.", en: "When you come to, {npc:deniz_arman} has dragged you into a hollow under a boulder and is binding your leg with a strip torn off {zamir:deniz_arman|onun} own shirt. {zamir:deniz_arman|onun|b} own cut is still bleeding." }
          - { tr: "\"Beni kurtarmaya geldin,\" diyor, sesi titreyerek. \"Şimdi ödeştik. Bir daha sakın yapma.\"", en: "\"You came to save me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice cracking. \"So now we're even. Don't you ever do that again.\"" }
        secenekler:
          - id: "ayni"
            etiket: { tr: "\"Sen olsan aynısını yapardın.\"", en: "\"You'd have done the same.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 12, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 40 }
            sonraki: "@akis"
          - id: "dinlen"
            etiket: { tr: "Sus ve dinlen; nöbeti o tutsun", en: "Shut up and rest. Let {zamir:deniz_arman|onu} take watch" }
            etkiler:
              - ahlak: { duzen: 1 }
              - can: 15
              - iliski: { deniz_arman: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "Bir dahakine daha güçlü olacağına yemin et", en: "Swear you'll be stronger next time" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - stat: { wil: 1 }
              - iliski: { deniz_arman: { saygi: 5 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_kacis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Tazılar fazla, sis fazla, sen yetmiyorsun. {npc:deniz_arman|i} bileğinden yakalayıp en yakın yamaçtan aşağı atılıyorsunuz.", en: "Too many hounds, too much fog, not enough of you. You grab {npc:deniz_arman} by the wrist and throw yourselves down the nearest slope." }
          - { tr: "Çamura, köklere, birbirinize çarparak yuvarlanıyorsunuz. Dibe vardığınızda ulumalar yukarıda kalmış; sis kokunuzu yutmuş.", en: "You tumble through mud and roots, slamming into each other the whole way down. By the time you hit bottom the howling's stuck up top. The fog swallowed your scent." }
          - { tr: "{npc:deniz_arman} yüzündeki çamuru siliyor. \"Kaçmak da bir taktiktir,\" diyor. \"Biri bunu bir yere yazsın.\"", en: "{npc:deniz_arman} wipes the mud off {zamir:deniz_arman|onun} face. \"Running counts as a tactic,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Somebody write that down.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül ve elini sık", en: "Laugh and shake on it" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4 } }
            sonraki: "@akis"
          - id: "geri_don"
            etiket: { tr: "Geri dönüp tazıları avlamayı öner", en: "Suggest circling back to hunt the hounds" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - egilim: { yakin_dovus: 1 }
              - iliski: { deniz_arman: { saygi: 6, guven: -2 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_tuzak"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Topal tazının arkasına dolanıp ayaklarının dibine bir taş sektiriyorsun. Sürü, yaralı üyesini kollamak için içgüdüyle dönüyor ve çember bir anlığına açılıyor.", en: "You circle behind the limping hound and skip a rock off the ground at its feet. The pack wheels on instinct to cover its hurt member, and the circle breaks open for a heartbeat." }
          - { tr: "O an yetiyor. {npc:deniz_arman} boşluktan fırlıyor; sen de arkasından bir dalı çalıların içinde sürükleyip olabildiğince gürültü yapıyorsun, ta ki tazılar birbirlerinin kokusunu kaybedip dağılana kadar.", en: "A heartbeat's all it takes. {npc:deniz_arman} bolts through the gap while you drag a branch through the brush behind {zamir:deniz_arman|onu}, making all the noise you can, until the hounds lose each other's scent and scatter." }
          - { tr: "Yüz adım ötede durduğunuzda {npc:deniz_arman} sana seni ilk kez görüyormuş gibi bakıyor. \"Bunu nereden öğrendin?\"", en: "A hundred yards on you finally stop, and {npc:deniz_arman} looks at you like it's the first time. \"Where'd you learn that?\"" }
        secenekler:
          - id: "kitap"
            etiket: { tr: "\"Bir kitapta okudum.\" Gülümse", en: "\"Read it in a book.\" Smile" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 12, saygi: 8 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 40 }
            sonraki: "@akis"
          - id: "ses"
            etiket: { tr: "\"Ses söyledi.\" Şakağına dokun", en: "\"The voice told me.\" Tap your temple" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -2 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 6, korku: 4 } }
              - iliski: { yanki: { guven: -8 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -20 }
              - hafiza: { npc: "deniz_arman", id: "yanki_anlatildi", agirlik: 25 }
            sonraki: "@akis"
          - id: "omuz"
            etiket: { tr: "\"Burada ya hızlı öğrenirsin ya ölürsün.\"", en: "\"Out here you learn fast or you die.\"" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - egilim: { gizlilik: 1 }
              - iliski: { deniz_arman: { saygi: 10 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_bekleyis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Bekliyorsun. {npc:deniz_arman} direği bir kez, iki kez savuruyor; üçüncüde tazılardan biri koluna kapanıyor ve çığlık ormanın içinde uzun süre çınlıyor.", en: "You wait. {npc:deniz_arman} swings the signpost once, twice. On the third swing a hound clamps onto {zamir:deniz_arman|onun} arm, and the scream rings through the woods for a long time." }
          - { tr: "Tazılar ancak avları yere düşünce gevşiyor; işte o zaman çıkıyorsun ve yorgun hayvanları kolayca dağıtıyorsun. Hesap tuttu: tek bir çizik bile almadın.", en: "The hounds only ease off once their prey is down, and that's when you step out and scatter the tired animals with no trouble at all. The math worked. You didn't take a scratch." }
          - { tr: "{npc:deniz_arman} yerden sana bakıyor. Gözlerinde minnet var; altında başka bir şey daha var, henüz adını koymadığı bir şey.", en: "{npc:deniz_arman} looks up at you from the dirt. There's gratitude in that look. Underneath it is something else, something {zamir:deniz_arman|o} {zamir:deniz_arman|has}n't named yet." }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini uzat, hiçbir şey söyleme", en: "Offer a hand. Say nothing" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "an"
            etiket: { tr: "\"Doğru anı bekledim.\"", en: "\"I was waiting for the right moment.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { guven: -4, saygi: 4 } }
            sonraki: "@akis"
          - id: "sar"
            etiket: { tr: "Yarasını sar; bunu ona borçlusun", en: "Bind the wound. You owe {zamir:deniz_arman|onu} that much" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 6 } }
            sonraki: "@akis"

      - id: "deniz_bulusma_ezme"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisten çıkıyorsun ve hiçbir şey yapmıyorsun. Yalnızca duruyor ve tazılara bakıyorsun.", en: "You step out of the fog and do nothing. You just stand there and look at the hounds." }
          - { tr: "Üçü birden donuyor. Kürkleri buhar gibi dikiliyor, kuyrukları bacaklarının arasına giriyor; sonra sis onları geri alıyor, tek bir inleme bile bırakmadan.", en: "All three freeze. Their fur stands up like steam and their tails tuck between their legs, and then the fog takes them back without so much as a whimper." }
          - { tr: "{npc:deniz_arman} direği hâlâ havada tutuyor. Önce tazıların gittiği yöne, sonra sana bakıyor; o bakışın içindeki bir şey seni tanımakta zorlanıyor.", en: "{npc:deniz_arman} still has the signpost raised. {zamir:deniz_arman|o|b} look{zamir:deniz_arman|s} where the hounds went, then at you, and something in that look is struggling to recognize you." }
        secenekler:
          - id: "benim"
            etiket: { tr: "\"Benim. Hâlâ benim.\"", en: "\"It's me. It's still me.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 5 } }
              - hafiza: { npc: "deniz_arman", id: "tazilardan_kurtardi", agirlik: 35 }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Direği elinden al ve yürümeye başla", en: "Take the signpost and start walking" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { deniz_arman: { saygi: 8, korku: 6 } }
            sonraki: "@akis"
          - id: "bitir"
            etiket: { tr: "Tazıların peşine düş ve işlerini bitir", en: "Go after the hounds and finish them off" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - xp: 80
              - gunluk: { savas: 1 }
              - iliski: { deniz_arman: { korku: 4 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 2: hesap (tohum)
  - id: "deniz_hesap"
    perde: [1]
    agirlik: 1
    etiketler: ["deniz", "ahlak", "kamp"]
    gerilim: 2
    npc: ["deniz_arman"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Ödenmemiş hesap", en: "An unpaid debt" }
    sahne: "deniz_hesap_1"
    sahneler:
      - id: "deniz_hesap_1"
        paragraflar:
          - { tr: "Ateş sönmeye yüz tutmuş. {npc:deniz_arman} bütün akşam kolundaki yara kabuğuyla oynadı; şimdi tırnağıyla son parçasını da kaldırıyor ve kanın yeniden sızmasını izliyor.", en: "The fire's burning down. {npc:deniz_arman} has been picking at the scab on {zamir:deniz_arman|onun} arm all night. Now the last of it comes off under a thumbnail, and {zamir:deniz_arman|o} stare{zamir:deniz_arman|s} at the blood welling back up." }
          - { tr: "\"O gün bekledin,\" diyor, gözlerini kandan kaldırmadan. \"Ağacın arkasındaydın, seni gördüm. Tazılar beni yerken orada durdun ve saydın.\"", en: "\"You waited that day,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, eyes still on the blood. \"You were behind that tree, I saw you. Those things were eating me alive and you stood there and counted.\"" }
          - { tr: "Sesi sakin; öfkeden daha kötü bir sakinlik bu. Senden bir açıklama değil, bir cevap bekliyor.", en: "{zamir:deniz_arman|onun|b} voice is calm, the kind of calm that's worse than angry. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't asking for an explanation. {zamir:deniz_arman|o|b} want{zamir:deniz_arman|s} an answer." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Elleri yumruk değil. Kavga istemiyor; seni affedebilmek için bir sebep istiyor.", en: "Those hands aren't fists. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't looking for a fight. {zamir:deniz_arman|o|b} want{zamir:deniz_arman|s} a reason to forgive you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "doğruyu söylersen güvenir, yalan söylersen hatırlar. ikisi de veri. hangisini istediğine sen karar ver.", en: "tell the truth and {zamir:deniz_arman|o} trust{zamir:deniz_arman|s} you; lie and {zamir:deniz_arman|o} remember{zamir:deniz_arman|s}. both are data. you pick which one you want." }
        secenekler:
          - id: "itiraf"
            etiket: { tr: "Doğruyu söyle: korktun", en: "Tell the truth: you were scared" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 12, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "durust_itiraf", agirlik: 35 }
              - tohum: { olay: "kamp_ates_basi", gecikme: { min: 2, max: 4 }, kosul: { yoldas: "deniz_arman" } }
            sonraki: "deniz_hesap_itiraf"
          - id: "yalan"
            etiket: { tr: "Bir planın olduğunu söyle", en: "Say it was all part of a plan" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "deniz_hesap_yakalandi", basarisiz_etkiler: [{ ahlak: { duzen: -3 } }, { iliski: { deniz_arman: { guven: -15 } } }, { bayrak: "deniz_yalani_yakaladi" }, { hafiza: { npc: "deniz_arman", id: "yalan_yakalandi", agirlik: -35 } }] }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 2 } }
              - yalan: { npc: "deniz_arman", konu: "deniz_plan_yalani" }
            sonraki: "deniz_hesap_yalan"
          - id: "sert"
            etiket: { tr: "\"Yaşıyorsun, değil mi? Kapat bu konuyu.\"", en: "\"You're alive, aren't you? Drop it.\"" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - iliski: { deniz_arman: { guven: -10, korku: 5 } }
            sonraki: "deniz_hesap_sert"
          - id: "suclu"
            etiket: { tr: "Kafandaki sesi suçla: \"Bekle\" dedi", en: "Blame the voice in your head. It said wait" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bayrak: "deniz_yankiyi_biliyor"
              - iliski: { deniz_arman: { guven: 2, korku: 6 } }
              - iliski: { yanki: { guven: -12, saygi: -5 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
            sonraki: "deniz_hesap_yanki"

      - id: "deniz_hesap_itiraf"
        paragraflar:
          - { tr: "\"Korktum,\" diyorsun ve kelimenin ağzından çıkarken ne kadar küçük olduğunu duyuyorsun. \"Üç tazı vardı ve ben hesap yaptım. Önce kendimi.\"", en: "\"I was scared,\" you say, and you hear how small the word is on the way out. \"There were three of them, and I ran the numbers. Me first.\"" }
          - { tr: "{npc:deniz_arman} uzun süre ateşe bakıyor. Sonra yaralı kolunu dizinin üstüne koyuyor; elindeki bir yükü yere bırakır gibi.", en: "{npc:deniz_arman} stares into the fire for a long time. Then {zamir:deniz_arman|o} rest{zamir:deniz_arman|s} the hurt arm across one knee, like setting down something heavy." }
          - { tr: "\"Ben de korktum,\" diyor. \"Tek farkla: benim kaçacak yerim yoktu. Bir daha yapma bunu; ama söylediğin için sağ ol.\"", en: "\"I was scared too, only I didn't have anywhere to run,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Don't ever do that again. But thanks for saying it.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Söz ver: bir daha asla", en: "Promise: never again" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "basla"
            etiket: { tr: "Söz verme; yalnızca başını salla", en: "Don't promise. Just nod" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { deniz_arman: { saygi: 6 } }
            sonraki: "@akis"

      - id: "deniz_hesap_yalan"
        paragraflar:
          - { tr: "\"Bir planım vardı,\" diyorsun ve sesin beklediğinden daha sağlam çıkıyor. \"Yorulmalarını bekledim. Erken girseydim ikimiz de ölürdük.\"", en: "\"I had a plan,\" you say, and your voice comes out steadier than you expected. \"I waited for them to tire out. If I'd gone in early, we'd both be dead.\"" }
          - { tr: "{npc:deniz_arman} dinliyor, başını yavaşça sallıyor. \"Mantıklı,\" diyor; \"tabii, mantıklı.\"", en: "{npc:deniz_arman} listens, nodding slowly. \"Makes sense,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Sure, makes sense.\"" }
          - { tr: "Ama yara kabuğuna bir daha dokunmuyor. Eli kolunun üstünde öylece duruyor, kıpırdamadan.", en: "But {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't touch the scab again. {zamir:deniz_arman|onun|b} hand just stays there on {zamir:deniz_arman|onun} arm, perfectly still." }
          - metin: { tr: "Kafanın içinde ses kuru kuru kaydediyor: yalan kaydedildi. onun hafızasında bir boşluk açtın. boşluklar dolar.", en: "Inside your head, the voice logs it, dry as dust: lie recorded. you opened a gap in {zamir:deniz_arman|onun} memory. gaps fill up." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "Konuyu değiştir; yarını planla", en: "Change the subject. Plan tomorrow" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "@akis"
          - id: "geri_al"
            etiket: { tr: "Yalanı geri al, geç olmadan", en: "Take it back before it's too late" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - hafiza: { npc: "deniz_arman", id: "durust_itiraf", agirlik: 25 }
            sonraki: "deniz_hesap_itiraf"

      - id: "deniz_hesap_yakalandi"
        paragraflar:
          - { tr: "\"Bir planım vardı,\" diyorsun. Sesin cümlenin ortasında çatlıyor ve {npc:deniz_arman} bunu duyuyor; on yıl, bu sesi tanımaya fazlasıyla yetiyor.", en: "\"I had a plan,\" you say. Your voice cracks halfway through, and {npc:deniz_arman} hears it. Ten years is plenty of time to learn what that sounds like." }
          - { tr: "\"Vapur kartını her unuttuğunda da bu sesle konuşurdun,\" diyor, buz gibi; \"plan, tabii.\" Kalkıp ateşin öbür ucuna, karanlığın tam kıyısına oturuyor.", en: "\"That's the voice you used every time you forgot your ferry pass,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, ice cold. \"A plan, sure.\" Then {npc:deniz_arman} gets up and sits back down on the far side of the fire, right at the edge of the dark." }
          - { tr: "O gece nöbet için kimse gönüllü olmuyor. Zaten ikiniz de uyumuyorsunuz.", en: "Nobody volunteers for watch that night. Neither of you sleeps anyway." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yanına git ve doğruyu söyle", en: "Go over there and tell the truth" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8 } }
            sonraki: "deniz_hesap_itiraf"
          - id: "kal"
            etiket: { tr: "Olduğun yerde kal. Sabaha geçer", en: "Stay put. It'll blow over by morning" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { deniz_arman: { baglilik: -6 } }
            sonraki: "@akis"

      - id: "deniz_hesap_sert"
        paragraflar:
          - { tr: "\"Yaşıyorsun,\" diyorsun. \"İkimiz de yaşıyoruz. Burada bunun dışında hiçbir şeyin önemi yok.\"", en: "\"You're alive,\" you say. \"We both are. Out here, nothing else counts.\"" }
          - { tr: "{npc:deniz_arman} bir an sana bakıyor; tanıdık bir yüzde yabancı bir ifade arar gibi. Sonra başını yavaşça sallıyor: \"Haklısın. Burada başka hiçbir şeyin önemi yok.\"", en: "For a second {npc:deniz_arman} just looks at you, like searching a familiar face for a stranger's expression. Then a slow nod: \"You're right. Out here, nothing else counts.\"" }
          - { tr: "Senin cümleni sana geri veriyor. Ama o cümle onun ağzında bir soru gibi duruyor.", en: "{zamir:deniz_arman|o|b} hand{zamir:deniz_arman|s} your own words right back to you. In {zamir:deniz_arman|onun} mouth, they sound like a question." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Cevap verme. Uyumaya git", en: "Don't answer. Go to sleep" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { deniz_arman: { baglilik: -4 } }
            sonraki: "@akis"
          - id: "hakli"
            etiket: { tr: "\"Aslında haklı olmak istemiyorum.\"", en: "\"I don't actually want to be right.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"

      - id: "deniz_hesap_yanki"
        paragraflar:
          - { tr: "\"Kafamdaki ses,\" diyorsun ve şakağına dokunuyorsun. \"Bekle dedi. Ben de bekledim.\"", en: "\"The voice in my head,\" you say, tapping your temple. \"It said wait. So I waited.\"" }
          - { tr: "{npc:deniz_arman} gözlerini kırpıştırıyor, bir şakanın sonunu bekliyor; gelmiyor. \"Kafanda bir ses var,\" diyor yavaşça, \"ve sana ne yapacağını söylüyor.\"", en: "{npc:deniz_arman} blinks, waiting for the punchline. It doesn't come. \"There's a voice in your head,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} slowly, \"and it tells you what to do.\"" }
          - { tr: "Ses sana soğuk su gibi bir sessizlikle karşılık veriyor. Sonra yalnızca senin duyduğun tek bir satır: ben hiçbir şey demedim. sen kendin saydın.", en: "The voice answers with a silence like cold water. Then one line, for you alone: i never said a word. you did the counting yourself." }
        secenekler:
          - id: "genelde"
            etiket: { tr: "\"Her zaman değil. Ama genelde haklı.\"", en: "\"Not always. But it's usually right.\"" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { deniz_arman: { korku: 4, guven: -4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "itiraf_et"
            etiket: { tr: "Dürüst ol: suçu sese yıktın", en: "Come clean: you're blaming the voice" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "deniz_hesap_itiraf"
          - id: "unut"
            etiket: { tr: "\"Unut gitsin. Bir şey demedim.\"", en: "\"Forget it. I didn't say anything.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { deniz_arman: { guven: -6 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 3: ateş başı (nefes)
  - id: "kamp_ates_basi"
    perde: [1]
    gun: { min: 3, max: 30 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 4
    etiketler: ["kamp", "nefes", "deniz"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Ateş başında", en: "Around the fire" }
    sahne: "kamp_ates_basi_1"
    sahneler:
      - id: "kamp_ates_basi_1"
        paragraflar:
          - { tr: "Bu gece ateşin başında yalnız değilsiniz. Yolda yanınıza takılan dört hayatta kalan ellerini aleve uzatmış; kimse kimseye seviyesini sormuyor.", en: "You're not alone at the fire tonight. Four survivors you picked up on the road hold their hands out to the flames, and nobody asks anybody's level." }
          - { tr: "Bunun yerine eski hayatlarını konuşuyorlar. Biri diş hekimi asistanıymış, biri kargo şoförü; köşedeki yaşlı kadın otuz yıl ilkokulda resim öğretmiş ve tırnaklarının dibinde hâlâ boya varmış gibi ellerine bakıp duruyor.", en: "Instead they talk about their old lives. One was a dental hygienist, one drove a delivery route. The old woman in the corner taught elementary-school art for thirty years, and she keeps looking at her hands like there's still paint under her nails." }
          - { tr: "{npc:deniz_arman} dizlerini kucaklamış, gülümseyerek dinliyor. Sıra sana geldiğinde herkes susuyor.", en: "{npc:deniz_arman} sits hugging {zamir:deniz_arman|onun} knees, listening with a little smile. When it gets around to you, everybody goes quiet." }
          - metin: { tr: "Susmalarının tek sebebi sıranın sana gelmesi değil. Ateşin ışığında gölgen fazla uzun; herkes sana bakmamaya çalışıyor ve hepsi bunda sefil biçimde başarısız oluyor.", en: "It's not just that it's your turn. In the firelight your shadow runs way too long, and everybody's trying not to stare at you. They're all doing a lousy job of it." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Kargo şoförünün çantası söylediğinden ağır. Sırtını hiç ateşe dönmüyor; çantaya da.", en: "The delivery driver's bag is heavier than he's letting on. He never turns his back to the fire. Or to that bag." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eski hayatlar. ilginç bir dosya biçimi. artık kimse açamıyor.", en: "old lives. interesting file format. nobody can open it anymore." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Sen de eski hayatını anlat", en: "Tell them about your old life" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - can: 20
              - iliski: { deniz_arman: { guven: 5, baglilik: 4 } }
            sonraki: "kamp_ates_basi_anlat"
          - id: "dinle"
            etiket: { tr: "Sessizce dinle; kim neyi saklıyor, bak", en: "Listen quietly. Clock who's hiding what" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - egilim: { gizlilik: 1 }
              - xp: 25
            sonraki: "kamp_ates_basi_canta"
          - id: "kardes"
            etiket: { tr: "{npc:deniz_arman|e} kız kardeşini sor", en: "Ask {npc:deniz_arman} about {zamir:deniz_arman|onun} little sister" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 6 } }
            sonraki: "kamp_ates_basi_kardes"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni sorduklarında gerçeği söyle", en: "When they ask your level, tell the truth" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { saygi: 4, korku: 4 } }
            sonraki: "kamp_ates_basi_seviye"
          - id: "nobet"
            etiket: { tr: "Onlar uyurken sen nöbet tut", en: "Take watch while they sleep" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - stat: { wil: 1 }
              - itibar: { siginak: 2 }
              - iliski: { deniz_arman: { guven: 3 } }
            sonraki: "@akis"

      - id: "kamp_ates_basi_anlat"
        paragraflar:
          - { tr: "Anlatıyorsun: sabah vapurlarını, ofisin yanık kahvesini, bir türlü sıfırlanmayan gelen kutusunu. Kendi sesin sana yabancı geliyor; o hayat başka birine aitmiş gibi.", en: "You tell them: the morning ferries, the burnt office coffee, the inbox that never once hit zero. Your own voice sounds strange to you. That life feels like it belonged to somebody else." }
          - { tr: "Resim öğretmeni kahkahayı basıyor. Diş hekimi asistanı \"Bizim de e-postalarımız vardı,\" diyor ve bir an herkes aynı şeyi özlüyor.", en: "The art teacher cackles. The hygienist says, \"God, we had email too,\" and for a second everybody's homesick for the exact same thing." }
          - { tr: "{npc:deniz_arman} omzunu omzuna yaslıyor. \"Bak,\" diye fısıldıyor, \"hâlâ oradasın.\"", en: "{npc:deniz_arman} leans a shoulder into yours. \"See?\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. \"You're still in there.\"" }
        secenekler:
          - id: "yaslan"
            etiket: { tr: "Omzuna yaslan ve gözlerini kapat", en: "Lean back into it and close your eyes" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "ne_kadar"
            etiket: { tr: "\"Daha ne kadar, bilmiyorum.\"", en: "\"Not sure for how much longer.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"

      - id: "kamp_ates_basi_canta"
        paragraflar:
          - { tr: "Sesini çıkarmadan izliyorsun. Kargo şoförü herkes güldüğünde gülüyor ama gözü hep çantasında; bir ara fermuar aralanıyor ve içinde dört şişe temiz su görüyorsun.", en: "You watch without a word. The delivery driver laughs when everybody laughs, but his eyes keep drifting to the bag. At one point the zipper gapes, and you see four bottles of clean water inside." }
          - { tr: "Bu ateşin başındaki herkes iki gündür yağmur suyu içiyor. Resim öğretmeninin dudakları kanayacak kadar çatlamış.", en: "Everyone at this fire has been drinking rainwater for two days. The art teacher's lips are cracked badly enough to bleed." }
        secenekler:
          - id: "paylastir"
            etiket: { tr: "Herkesin önünde suyu paylaştır", en: "Make him share the water in front of everyone" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 2 }
              - iliski: { deniz_arman: { saygi: 5 } }
            sonraki: "@akis"
          - id: "yalniz"
            etiket: { tr: "Onunla baş başa konuş; utandırma", en: "Talk to him alone. Don't shame him" }
            gerekli: { stat: { cha: 7 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - esya: { kaynak_suyu: 1 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme; bunu cebinde tut", en: "Say nothing. Keep it in your back pocket" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - egilim: { gizlilik: 1 }
            sonraki: "@akis"

      - id: "kamp_ates_basi_kardes"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre susuyor. \"On iki yaşında,\" diyor sonunda. \"Her vapur biletinin arkasına martı çizerdi; berbat martılar, hepsi ördeğe benzerdi.\"", en: "{npc:deniz_arman} goes quiet for a while. \"She's twelve,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}. \"She drew a gull on the back of every ferry ticket, terrible gulls, every single one of them looking like a duck.\"" }
          - { tr: "\"Entegrasyon olduğunda okuldaydı, körfezin öbür yakasında.\" Eliyle alevlerin üstünde, olmayan bir körfezi çiziyor. \"Herkes buraya düştüyse o da burada bir yerde.\"", en: "\"She was at school when it happened, way across the bay.\" {zamir:deniz_arman|onun|b} hand traces a bay that isn't there, over the flames. \"If everybody landed here, she's here too. Somewhere.\"" }
          - { tr: "Sesi sağlam ama elleri yine titriyor. Senden bir şey istemiyor; istemeye dili varmıyor.", en: "{zamir:deniz_arman|onun|b} voice holds steady, but those hands are shaking again. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is}n't asking you for anything. Can't bring {zamir:deniz_arman|kendi} to." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Onu bulacağız. Söz.\"", en: "\"We'll find her. I promise.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "ates_basi_soz", agirlik: 40 }
              - bayrak: "deniz_kardese_soz_verildi"
              - gorev: { deniz_kardesi: "basla" }
              - tohum: { olay: "deniz_kardes_ipucu", gecikme: { min: 3, max: 6 }, kosul: { yoldas: "deniz_arman" } }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Elimden geleni yaparım. Söz veremem.\"", en: "\"I'll do what I can. I can't promise.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { deniz_arman: { saygi: 6, guven: 3 } }
              - gorev: { deniz_kardesi: "basla" }
              - tohum: { olay: "deniz_kardes_ipucu", gecikme: { min: 5, max: 9 }, kosul: { yoldas: "deniz_arman" } }
            sonraki: "@akis"
          - id: "gercek"
            etiket: { tr: "\"Kendini hazırla. Belki de o...\"", en: "\"Brace yourself. She might not...\"" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - iliski: { deniz_arman: { guven: -6, baglilik: -4 } }
              - hafiza: { npc: "deniz_arman", id: "umudu_kirdi", agirlik: -25 }
            sonraki: "@akis"

      - id: "kamp_ates_basi_seviye"
        paragraflar:
          - { tr: "Sormalarını bekliyorsun; sonunda diş hekimi asistanı soruyor, yarı şaka. Gerçek rakamı söylüyorsun.", en: "You wait for somebody to ask. Eventually the hygienist does, half joking. You give the real number." }
          - { tr: "Ateşin çıtırtısı birden çok yüksek geliyor. Resim öğretmeni elini ağzına götürüyor; kargo şoförü çantasını sessizce sana doğru itiyor, bir vergi öder gibi.", en: "All of a sudden the crackle of the fire is very loud. The art teacher puts a hand over her mouth. The delivery driver quietly nudges his bag toward you, like he's paying a tax." }
          - { tr: "{npc:deniz_arman} gülmüyor. Sana bakıyor, sonra onlara, sonra yine sana; aradaki mesafeyi ölçer gibi.", en: "{npc:deniz_arman} doesn't laugh. {zamir:deniz_arman|o|b} look{zamir:deniz_arman|s} at you, then at them, then back at you, like measuring the distance in between." }
        secenekler:
          - id: "vergi_yok"
            etiket: { tr: "Çantayı geri it: \"Burada vergi yok.\"", en: "Push the bag back. \"No taxes here.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 3 }
              - iliski: { deniz_arman: { guven: 5 } }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Çantayı al. Yükü güçlü olan taşır", en: "Take the bag. The strong carry the load" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - esya: { kaynak_suyu: 2 }
              - itibar: { lonca: 2 }
              - iliski: { deniz_arman: { guven: -5, korku: 3 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 4: kardeşin izi
  - id: "deniz_kardes_ipucu"
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 8, max: 20 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 6
    etiketler: ["deniz", "gizem", "kesif"]
    gerilim: 3
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Duvardaki martı", en: "The gull on the wall" }
    sahne: "deniz_kardes_ipucu_1"
    sahneler:
      - id: "deniz_kardes_ipucu_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Hayatta kalanlar hakkındaki bir söylenti yolunuzu {yer:kirik_istasyon|e} düşürüyor; ikinci peronun tavanı çökmüş, enkazın arasından mor gökyüzü görünüyor. {npc:deniz_arman} geride kalmış, bozuk bir otomatın camını zorluyor.", en: "A rumor about survivors brings you to the {yer:kirik_istasyon}, where the roof over Platform Two has caved in and the purple sky shows through the wreckage. {npc:deniz_arman} has fallen behind, trying to jimmy open a dead vending machine." }
          - { tr: "Duvarı ilk gören sensin. Fayansların üstüne bir şeyle, belki bir anahtarla, aceleyle kazınmış birkaç satır var; altlarında da bir kuş: ördeğe benzeyen bir martı.", en: "You're the one who sees the wall. A few lines scratched into the tile in a hurry, maybe with a key. And under them, a bird: a gull that looks exactly like a duck." }
          - { tr: "Okuyorsun: \"Buradaydım, iyiyim. Göğsünde işaret olanlar bizi topluyor; seçilmiş olduğumu söylüyorlar. Martıyı unutma.\"", en: "You read it: \"I was here, I'm okay. The people with the marks on their chests are gathering us up, and they say I'm chosen. Don't forget the gull.\"" }
          - { tr: "{npc:deniz_arman} hâlâ otomatla boğuşuyor; henüz görmedi. Birkaç saniyen var.", en: "{npc:deniz_arman} is still wrestling with the vending machine and hasn't seen it yet. You've got a few seconds." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Kazıntılar en fazla on günlük; çizgilerin içinde hâlâ fayans tozu var. Son satır ötekilerden daha derin oyulmuş, sanki biri omzunun üstünden bakıyormuş gibi.", en: "The scratches are ten days old, tops. There's still tile dust in the grooves. The last line was cut deeper than the rest, like somebody was watching over her shoulder." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem bu peronda bir etiket kaydetmiş: 'aday', tek kişi, on iki yaş. fazlasını görmek için derine inmem lazım. derine inmek iz bırakır.", en: "the System logged a tag on this platform: 'candidate,' one person, age twelve. to see more i'd have to dig deeper. digging leaves marks." }
        secenekler:
          - id: "goster_ona"
            etiket: { tr: "{npc:deniz_arman|i} çağır ve duvarı göster", en: "Call {npc:deniz_arman} over and show {zamir:deniz_arman|onu} the wall" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 45 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_gosterdi"
          - id: "sil"
            etiket: { tr: "İşaretlilerle ilgili satırı kazıyarak sil", en: "Scratch out the line about the marked people" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - bolge: "kirik_istasyon"
              - yalan: { npc: "deniz_arman", konu: "kardes_notu_yalani" }
              - bayrak: "kardes_notu_saklandi"
              - bayrak: "kardes_izi_bulundu"
              - bilgi: "kardes_notu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_sildi"
          - id: "yanki_ara"
            etiket: { tr: "Sese, Sistem kayıtlarında onu aramasını söyle", en: "Tell the voice to search the System logs for her" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 20 } } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - bolge: "kirik_istasyon"
              - yozlasma: 3
              - dikkat: 3
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_kayit"
          - id: "iz_sur"
            etiket: { tr: "Duvarı göster ve izlerin peşine hemen düş", en: "Show {zamir:deniz_arman|onu} the wall, then follow the tracks" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 6, saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 40 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_tunel"
          - id: "toz"
            tur: "gosteris"
            etiket: { tr: "Peronun tozunu bir sayfa gibi oku", en: "Read the dust on the platform like a page" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { per: 14 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bolge: "kirik_istasyon"
              - iliski: { deniz_arman: { guven: 6, saygi: 8, korku: 5 } }
              - hafiza: { npc: "deniz_arman", id: "kardes_notu_gosterildi", agirlik: 40 }
              - bilgi: "kardes_notu"
              - bayrak: "kardes_izi_bulundu"
              - gorev: { deniz_kardesi: "basla" }
            sonraki: "deniz_kardes_ipucu_okuma"

      - id: "deniz_kardes_ipucu_gosterdi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:deniz_arman} yanına geliyor, duvara bakıyor ve olduğu yerde kalakalıyor. Parmakları martının üstünde geziniyor; çizgilerin içindeki tozu silmekten korkar gibi.", en: "{npc:deniz_arman} comes over, looks at the wall, and stops dead. {zamir:deniz_arman|onun|b} fingers hover over the gull, like {zamir:deniz_arman|o} {zamir:deniz_arman|is} scared to wipe the dust out of the lines." }
          - { tr: "\"Ördek,\" diyor ve sesi kırılıyor. \"Yine ördek çizmiş. Yaşıyor; on gün önce yaşıyordu.\"", en: "\"A duck,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, and {zamir:deniz_arman|onun} voice breaks. \"She drew a duck again, she's alive. Ten days ago she was alive.\"" }
          - { tr: "Sonra son satırı okuyor ve yüzündeki ışık yavaşça değişiyor. \"Seçilmiş,\" diye tekrarlıyor. \"Ne demek bu, kim seçiyor, neye?\"", en: "Then {zamir:deniz_arman|o} read{zamir:deniz_arman|s} the last line, and the light in {zamir:deniz_arman|onun} face slowly changes. \"Chosen,\" {zamir:deniz_arman|o} repeat{zamir:deniz_arman|s}. \"What does that even mean, chosen by who, for what?\"" }
          - metin: { tr: "Ateş başında verdiğin söz ikinizin arasında, havada asılı duruyor. {npc:deniz_arman} sana bakıyor; söz bu kadar çabuk bir yere varabilir miymiş, diye.", en: "The promise you made by the fire hangs in the air between you. {npc:deniz_arman} looks at you like {zamir:deniz_arman|o} can't believe a promise could get somewhere this fast." }
            kosul: { bayrak: "deniz_kardese_soz_verildi" }
        secenekler:
          - id: "vaiz"
            etiket: { tr: "\"İşaretlileri bulalım; vaazlarını dinleyelim.\"", en: "\"Let's find the marked ones and hear them preach.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "once_guc"
            etiket: { tr: "\"Önce güçlenelim. Sonra onları buluruz.\"", en: "\"Get stronger first. Then we find them.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 5, baglilik: -3 } }
            sonraki: "@akis"
          - id: "saril"
            etiket: { tr: "Hiçbir şey söyleme; ona sarıl", en: "Don't say anything. Just hold onto {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_sildi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Yerden aldığın bir taşı son satırın üstünden geçiriyorsun; bir kez, iki kez, harfler tek bir beyaz yaraya dönüşene kadar. Fayansın gıcırtısı peron boyunca yankılanıyor.", en: "You drag a rock across the last line, once, twice, until the letters turn into one white scar. The screech of it echoes down the platform." }
          - { tr: "{npc:deniz_arman} sesi duyup koşuyor. Martıyı görüyor, ilk satırları okuyor ve dizlerinin üstüne çöküyor: \"Yaşıyor. İyiymiş; iyi olduğunu yazmış.\"", en: "{npc:deniz_arman} hears it and comes running, sees the gull, reads the first lines, and drops to {zamir:deniz_arman|onun} knees. \"She's alive. She's okay, she wrote that she's okay.\"" }
          - { tr: "Sonra parmakları senin kazıdığın beyaz izin üstünde duruyor. \"Bu ne?\" diye soruyor; \"burada bir şey daha yazıyordu.\"", en: "Then {zamir:deniz_arman|onun} fingers stop on the white scar you left. \"What's this?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"There was something else written here.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yalan kaydedildi. bu sefer bir duvara da yazıldı. duvarlar unutmaz; bazen insanlardan bile iyi hatırlar.", en: "lie recorded. this time it's carved into a wall too, and walls don't forget; sometimes they remember better than people." }
        secenekler:
          - id: "boyleydi"
            etiket: { tr: "\"Ben geldiğimde de böyleydi.\"", en: "\"It was like that when I got here.\"" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "@akis"
          - id: "dogru"
            etiket: { tr: "Doğruyu söyle: onu korumak için sildin", en: "Tell the truth: you scratched it out to protect {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - bayrak_kaldir: "kardes_notu_saklandi"
              - iliski: { deniz_arman: { guven: -8, saygi: 4 } }
              - hafiza: { npc: "deniz_arman", id: "notu_sildi_itiraf", agirlik: -20 }
            sonraki: "deniz_kardes_ipucu_itiraf"
          - id: "okunmuyor"
            etiket: { tr: "\"Okunmuyor. Boş ver.\"", en: "\"Can't make it out. Let it go.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { deniz_arman: { guven: -2 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_itiraf"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "\"Göğsünde işaret olanlar çocukları topluyormuş,\" diyorsun. \"Ona seçilmiş olduğunu söylemişler. Bunu okursan peşlerinden koşacağını biliyordum.\"", en: "\"The people with the marks on their chests are gathering kids up,\" you say. \"They told her she's chosen. I knew if you read that, you'd go running after them.\"" }
          - { tr: "{npc:deniz_arman} ayağa kalkıyor ve sana uzun süre bakıyor; öfkeyle değil, daha ağır bir şeyle. \"Benim yerime karar verdin,\" diyor. \"Kardeşim hakkında.\"", en: "{npc:deniz_arman} gets up and looks at you for a long time, not angry, but with something heavier. \"You decided for me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"About my sister.\"" }
          - { tr: "\"Ama sonra söyledin.\" Bir nefes. \"O kısmı da hatırlayacağım.\"", en: "\"But then you told me.\" A breath. \"I'll remember that part too.\"" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile; bahane uydurma", en: "Apologize. No excuses" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 } }
            sonraki: "@akis"
          - id: "yine"
            etiket: { tr: "\"Yine yapardım. Seni kaybedemem.\"", en: "\"I'd do it again. I can't lose you.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 6, guven: -4 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_kayit"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Sese izin veriyorsun. Gözlerinin arkasında bir şey açılıyor: rakamlar, etiketler, binlerce satır, hepsi aynı anda ve hepsi yanlış renkte.", en: "You give the voice the go-ahead. Something opens up behind your eyes: numbers, tags, thousands of lines all at once, every one of them the wrong color." }
          - { tr: "Ses tek bir satırda duruyor: [ADAY · 12 · ÖN SEÇİM: {fraksiyon:yukselenler} · DURUM: NAKLEDİLDİ]. Sonra her şey kesiliyor ve burnundan sıcak bir şey akmaya başlıyor.", en: "The voice stops on a single line: [CANDIDATE · 12 · PRE-SELECTED: {fraksiyon:yukselenler} · STATUS: TRANSFERRED]. Then everything cuts out, and something warm starts running from your nose." }
          - { tr: "{npc:deniz_arman} duvarın önünde duruyor; martıyı görmüş, satırları okumuş, şimdi sana bakıyor. \"Burnun kanıyor,\" diyor. \"Ne yaptın sen?\"", en: "{npc:deniz_arman} is standing at the wall; saw the gull, read the lines, and now {zamir:deniz_arman|o} {zamir:deniz_arman|is} staring at you. \"Your nose is bleeding. What did you just do?\"" }
        secenekler:
          - id: "soyle"
            etiket: { tr: "Gördüğün satırı ona olduğu gibi söyle", en: "Tell {zamir:deniz_arman|onu} exactly what you saw" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
              - bilgi: "yukselenler_kardes"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Satırı kendine sakla; \"Bir şey yok\" de", en: "Keep the line to yourself. Say \"It's nothing\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - bilgi: "yukselenler_kardes"
              - yalan: { npc: "deniz_arman", konu: "kardes_notu_yalani" }
              - bayrak: "kardes_notu_saklandi"
            sonraki: "@akis"
          - id: "ses_buldu"
            etiket: { tr: "\"Ses buldu onu. Bana güven.\"", en: "\"The voice found her. Trust me.\"" }
            goster: { bayrak: "deniz_yankiyi_biliyor" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { deniz_arman: { guven: 4, korku: 3 } }
              - iliski: { yanki: { saygi: 4 } }
              - bilgi: "yukselenler_kardes"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_tunel"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:deniz_arman} duvarı okuyor, martıya bir kez dokunuyor ve tek kelime etmeden raylara atlıyor. İzler tünelin karanlığına iniyor: küçük spor ayakkabıları, büyük botlar, hepsi aynı yöne.", en: "{npc:deniz_arman} reads the wall, touches the gull once, and drops down onto the tracks without a word. The footprints lead into the dark of the tunnel: small sneakers, big boots, all headed the same way." }
          - { tr: "Elli adım sonra duvardaki kablolar vızıldamaya başlıyor. Sıvanın içinden bir şey sökülüp başını kaldırıyor ve kıvılcımlar saçarak tıslıyor.", en: "Fifty yards in, the cables along the wall start to hum. Something tears itself loose from the plaster, rears its head, and hisses out a spray of sparks." }
          - { tr: "\"Arkamda kal,\" diyor {npc:deniz_arman}, tabela direğini kaldırarak. Onu daha önce hiçbir şeyden bu kadar emin konuşurken duymadın.", en: "\"Stay behind me,\" {npc:deniz_arman} says, raising the signpost. You've never heard {zamir:deniz_arman|onu} sound that sure of anything." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Yılan akımı tavandaki eski hattan çekiyor. Hattı koparırsan yavaşlar; ama ona ulaşmak için önünden geçmen gerek.", en: "The serpent's pulling current from the old line in the ceiling. Cut that line and it slows down. But you'd have to get past it to reach it." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Yanında dur ve savaş", en: "Stand with {zamir:deniz_arman|onu} and fight" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit", "karanlik"], kazan: "deniz_kardes_ipucu_iz", kaybet: "deniz_kardes_ipucu_yenilgi", kac: "deniz_kardes_ipucu_geri" }
          - id: "one_gec"
            etiket: { tr: "Öne geç; darbeyi sen al", en: "Step in front. Take the hit yourself" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - can: -10
              - iliski: { deniz_arman: { baglilik: 6 } }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit", "karanlik"], kazan: "deniz_kardes_ipucu_iz", kaybet: "deniz_kardes_ipucu_yenilgi", kac: "deniz_kardes_ipucu_geri" }
          - id: "geri_cek"
            etiket: { tr: "Onu geri çek; bu tünel ikinizi de öldürür", en: "Pull {zamir:deniz_arman|onu} back. This tunnel will kill you both" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { guven: -4, saygi: 2 } }
            sonraki: "deniz_kardes_ipucu_geri"
          - id: "sok"
            tur: "gosteris"
            etiket: { tr: "Yılanı duvardan sök ve ikiye ayır", en: "Rip the serpent out of the wall and snap it" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { str: 14 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
              - dikkat: 2
              - xp: 120
              - iliski: { deniz_arman: { korku: 6, saygi: 8 } }
            sonraki: "deniz_kardes_ipucu_iz"

      - id: "deniz_kardes_ipucu_iz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Yılan son bir kıvılcım yağmuruyla sönüyor; tünel yeniden karanlık ve sessiz. {npc:deniz_arman} izlerin peşinden yirmi adım daha ilerliyor, eğilip yerden bir şey alıyor.", en: "The serpent dies in one last shower of sparks, and the tunnel goes dark and quiet again. {npc:deniz_arman} follows the tracks another twenty yards, then bends and picks something up." }
          - { tr: "Buruşmuş bir vapur bileti. Arkasında, tükenmez kalemle, ördeğe benzeyen bir martı.", en: "A crumpled ferry ticket. On the back, in ballpoint, a gull that looks like a duck." }
          - { tr: "İzler ileride çatallanıp kayboluyor; o botları giyenler iz silmeyi biliyor.", en: "Up ahead the tracks fork and vanish. Whoever wore those boots knew how to cover a trail." }
          - { tr: "{npc:deniz_arman} bileti göğüs cebine koyup düğmesini iliklıyor. \"{fraksiyon:yukselenler},\" diyor. \"İşaretliler onlar, değil mi?\"", en: "{npc:deniz_arman} tucks the ticket into a breast pocket and buttons it shut. \"{fraksiyon:yukselenler},\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"The marked ones, that's them, right?\"" }
        secenekler:
          - id: "bulacagiz"
            etiket: { tr: "\"Evet. Ve onları bulacağız.\"", en: "\"Yeah. And we're going to find them.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "uzak"
            etiket: { tr: "\"Evet. Ve onlardan uzak duracağız.\"", en: "\"Yeah. And we're staying away from them.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 3, guven: -3 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_yenilgi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Akım göğsünden girip ayak tabanlarından çıkıyor; bir an her şey bembeyaz. Sonra {npc:deniz_arman|in} kolları seni rayların üstünde geri sürüklüyor.", en: "The current goes in through your chest and out through the soles of your feet, and for a second everything is white. Then {npc:deniz_arman|pos} arms are dragging you back down the tracks." }
          - { tr: "Perona vardığınızda ikinizin de kaşları yanmış, saçlarınız diken diken. {npc:deniz_arman} titreyerek gülüyor, sonra ağlıyor, sonra yine gülüyor.", en: "By the time you make the platform, both your eyebrows are singed and your hair's standing straight up. {npc:deniz_arman} laughs, shaking, then cries, then laughs again." }
          - { tr: "\"Alamadık,\" diyor. \"Orada bir şey vardı, gördüm. Alamadık.\"", en: "\"We didn't get it,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"There was something down there, I saw it. We didn't get it.\"" }
        secenekler:
          - id: "donecegiz"
            etiket: { tr: "\"Döneceğiz. Daha güçlü döneceğiz.\"", en: "\"We'll come back. Stronger.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "yanik"
            etiket: { tr: "Yanıklarınızı sar; önce onunkileri", en: "Patch up the burns. {npc:deniz_arman|pos} first" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - can: 10
              - iliski: { deniz_arman: { baglilik: 5 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_geri"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Tünelin ağzından geri çekiliyorsunuz. Vızıltı bir süre peşinizden geliyor, sonra yeniden duvara gömülüyor.", en: "You back out of the tunnel mouth. The hum follows you a little way, then sinks back into the wall." }
          - { tr: "{npc:deniz_arman} peronun kenarında durup karanlığa bakıyor. \"Oradaydı,\" diyor. \"İzleri tam oradaydı.\"", en: "{npc:deniz_arman} stands at the edge of the platform, staring into the dark. \"She was right there,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Her tracks were right there.\"" }
          - { tr: "Sonra dönüp duvardaki martıya uzun uzun bakıyor, fotoğrafını çeker gibi. Artık telefonu yok; yalnızca gözleri var.", en: "Then {zamir:deniz_arman|o} turn{zamir:deniz_arman|s} and stare{zamir:deniz_arman|s} at the gull on the wall for a long time, like taking a picture. No phone anymore. Just eyes." }
        secenekler:
          - id: "yaninda"
            etiket: { tr: "Yanına git; sessizce bekle", en: "Stand next to {zamir:deniz_arman|onu}. Wait in silence" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "soralim"
            etiket: { tr: "\"İşaretlileri soralım. Biri mutlaka biliyordur.\"", en: "\"Let's ask around about the marked ones. Somebody knows.\"" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 3 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "deniz_kardes_ipucu_okuma"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Çömeliyorsun ve peronun tozu seninle konuşmaya başlıyor. Yirmi üç çift ayak; on dördü çocuk. İçlerinden biri tam burada durmuş, duvara dönmüş ve iki kez geri çekilmiş, biri onu durmadan çağırıyormuş gibi.", en: "You crouch, and the dust on the platform starts talking. Twenty-three pairs of feet, fourteen of them kids. One of them stopped right here, turned to the wall, and pulled away twice, like somebody kept calling her back." }
          - { tr: "\"On gün önce,\" diyorsun yüksek sesle. \"Sabah. Onları güden üç yetişkin var; biri topallıyor ve sol elinde yüzük taşıyor.\"", en: "\"Ten days ago,\" you say out loud. \"Morning, three adults herding them. One limps, and wears a ring on his left hand.\"" }
          - { tr: "{npc:deniz_arman} sana bakıyor, sonra yere, sonra yine sana. Orada senin gördüklerinin hiçbirini göremiyor; yalnızca toz.", en: "{npc:deniz_arman} looks at you, then the floor, then you again. There's nothing down there {zamir:deniz_arman|o} can see. Just dust." }
          - { tr: "\"Bunu nasıl yapıyorsun?\" diye fısıldıyor. Sesinde umut da var, korku da; hangisinin ağır bastığını kendisi de bilmiyor.", en: "\"How are you doing that?\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. There's hope in it, and fear, and {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't know which one's winning." }
        secenekler:
          - id: "bilmiyorum"
            etiket: { tr: "\"Bilmiyorum. Ama işe yarıyor.\"", en: "\"No idea. But it works.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "korkuyorum"
            etiket: { tr: "\"Ben de korkuyorum\" de; içtenlikle", en: "Say \"I'm scared too,\" and mean it" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4, korku: -4 } }
            sonraki: "@akis"
          - id: "alis"
            etiket: { tr: "\"Alış. Daha fazlası gelecek.\"", en: "\"Get used to it. There's more coming.\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 1 }
              - iliski: { deniz_arman: { korku: 6, saygi: 6 } }
            sonraki: "@akis"

  # ================================================================== DENİZ · 5: son seçim (ana yay)
  - id: "deniz_son_secim"
    perde: [1]
    ana_yay: { gun: 22 }
    kosul: { yoldas: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "yukselenler"]
    gerilim: 4
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Giden ve kalan", en: "The one who goes" }
    sahne: "deniz_son_secim_1"
    sahneler:
      - id: "deniz_son_secim_1"
        paragraflar:
          - { tr: "Öğleden sonra kampa iki kişi giriyor: kirli gri giysiler, göğüslerinde elle dikilmiş aynı işaret. Silahları yok; silaha hiç ihtiyaç duymamış insanların rahatlığıyla yürüyorlar.", en: "Two people walk into camp late in the afternoon: dirty gray clothes, the same mark hand-stitched over each heart. No weapons. They walk with the ease of people who've never once needed any." }
          - metin: { tr: "\"Bizi Peygamber gönderdi,\" diyor genç olanı, gözlerini {npc:deniz_arman|den} ayırmadan. \"{npc:vahit}, Sistem'in ona bir martı gösterdiğini söylüyor; ördeğe benzeyen bir martı.\"", en: "\"The Prophet sent us,\" says the younger one, eyes locked on {npc:deniz_arman}. \"{npc:vahit|tam} says the System showed him a gull. One that looks like a duck.\"" }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "\"Peygamber öldü,\" diyor genç olanı, gözlerini {npc:deniz_arman|den} ayırmadan. \"Ama ses susmadı. Ses bize bir martı gösterdi; ördeğe benzeyen bir martı.\"", en: "\"The Prophet is dead,\" says the younger one, eyes locked on {npc:deniz_arman}. \"But the voice didn't stop. The voice showed us a gull, one that looks like a duck.\"" }
            kosul: { npc_olu: "vahit" }
          - { tr: "{npc:deniz_arman|in} elindeki tas yere düşüyor. Bunu bilmelerine imkân yok.", en: "The bowl in {npc:deniz_arman|pos} hands hits the dirt. There's no way they could know that." }
          - metin: { tr: "\"Kardeşin bizimle,\" diyor yaşlı olanı ve katlanmış bir kâğıt uzatıyor: ördeğe benzeyen bir martı. \"Seçilmişlerin arasında; güvende, tok, sevilen. Seni bekliyor; gel, kendi gözlerinle gör.\"", en: "\"Your sister is with us,\" says the older one, holding out a folded scrap of paper: a gull that looks like a duck. \"She's among the Chosen, safe and fed and loved, and she's waiting for you. Come see for yourself.\"" }
            kosul: { bayrak_yok: "kardes_notu_saklandi" }
          - metin: { tr: "\"Kardeşin bizimle,\" diyor yaşlı olanı ve katlanmış bir kâğıt uzatıyor: ördeğe benzeyen bir martı. \"Geçtiği her istasyonun duvarına bizi yazdı; işaretlileri, seçildiğini.\" Sonra başını {npc:deniz_arman|e} çeviriyor: \"Okumadın mı?\"", en: "\"Your sister is with us,\" says the older one, holding out a folded scrap of paper: a gull that looks like a duck. \"She wrote about us on every station wall she passed: the marked ones, being chosen.\" Then the preacher turns to {npc:deniz_arman}: \"Didn't you read it?\"" }
            kosul: { bayrak: "kardes_notu_saklandi" }
          - metin: { tr: "Sonra ikisi birden sana dönüyor ve tek kelime etmeden toprağa diz çöküyorlar. {npc:deniz_arman} bunu görüyor.", en: "Then both of them turn to you and kneel right there in the dirt, without a word. {npc:deniz_arman} sees it." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Genç olanın seviyesi 6. Yaşlı olanınki boş görünüyor; biri onu saklıyor. İkisi de yalan söylemiyor, ama ikisi de bütün gerçeği bilmiyor.", en: "The young one's level 6, and the older one's level reads blank: somebody's hiding it. Neither of them is lying. Neither of them knows the whole truth, either." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seslerinde bir sinyal var. benim sinyalim değil, ama tanıdık. bu insanlara bir şey fısıldıyor ve fısıldayan şey seni de istiyor.", en: "there's a signal in their voices. not mine, but familiar. something is whispering to these people, and whatever it is wants you too." }
          - kosul: { bayrak: ["kardes_notu_saklandi", "yanki_bagi"] }
            metin: { tr: "duvardan kazıdığın satır şimdi bu iki ağızda. er ya da geç biri söyleyecek. sen olsan iyi olur.", en: "the line you scratched off that wall is in these two mouths now. sooner or later somebody says it. better if it's you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bir şey söyle. Lütfen. Ne düşündüğünü söyle.\"", en: "\"Say something. Please. Tell me what you're thinking.\"" }
          - npc: "deniz_arman"
            metin: { tr: "\"Duvardaki martı... Bu kâğıttaki aynısı. Tıpatıp aynısı.\"", en: "\"The gull on the wall... it's the same one. Exactly the same.\"" }
            kosul: { bayrak: "kardes_izi_bulundu" }
        secenekler:
          - id: "kal_iste"
            etiket: { tr: "Kalmasını iste; birlikte bulacağınıza söz ver", en: "Ask {zamir:deniz_arman|onu} to stay. Promise you'll find her together" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "deniz_son_secim_gidis", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { iliski: { deniz_arman: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 50 }
            sonraki: "deniz_son_secim_kalir"
          - id: "vapur"
            etiket: { tr: "Vapuru hatırlat: on yıl, martılar, simitler", en: "Remind {zamir:deniz_arman|onu}: ten years, the gulls, the pretzels" }
            goster: { bayrak_yok: "kardes_notu_saklandi" }
            gerekli: { iliski_min: { deniz_arman: { guven: 50, baglilik: 50 } } }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { baglilik: 12, guven: 8 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 55 }
            sonraki: "deniz_son_secim_kalir"
          - id: "senin_kararin"
            etiket: { tr: "\"Senin kardeşin, senin kararın.\"", en: "\"Your sister. Your call.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { deniz_arman: { saygi: 12, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "kararina_saygi", agirlik: 40 }
            sonraki: "deniz_son_secim_gidis"
          - id: "kov"
            tur: "aciga_vur"
            etiket: { tr: "Vaizleri kov; gerçek gücünü göster", en: "Run the preachers off. Show them what you really are" }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - itibar: { yukselenler: -6 }
              - ahlak: { duzen: 3, merhamet: -3 }
              - iliski: { deniz_arman: { korku: 8, guven: -10 } }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - bayrak: "deniz_guveni_yarali"
              - hafiza: { npc: "deniz_arman", id: "vaizleri_kovdu", agirlik: -35 }
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 4 } }
            sonraki: "deniz_son_secim_yarali"
          - id: "taklit"
            etiket: { tr: "Çizimin taklit olduğunu herkesin önünde göster", en: "Prove the drawing's a forgery, in front of everyone" }
            gerekli: { stat: { per: 12 } }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { yukselenler: -3 }
              - iliski: { deniz_arman: { guven: 6, saygi: 8 } }
            sonraki: "deniz_son_secim_taklit"
          - id: "itiraf"
            etiket: { tr: "Duvardan kazıdığın satırı itiraf et", en: "Confess to the line you scratched off the wall" }
            goster: { bayrak: "kardes_notu_saklandi" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - bayrak_kaldir: "kardes_notu_saklandi"
              - iliski: { deniz_arman: { guven: -12, saygi: 6 } }
            sonraki: "deniz_son_secim_itiraf"
          - id: "emret"
            tur: "gosteris"
            etiket: { tr: "Diz çökenlere emret: bildiklerinin hepsini söyle", en: "Order the kneeling pair to tell you everything" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { cha: 14 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - dikkat: 3
              - itibar: { yukselenler: 4 }
              - iliski: { deniz_arman: { korku: 10, saygi: 6 } }
              - bilgi: "yukselenler_vaadi"
            sonraki: "deniz_son_secim_tanri"

      - id: "deniz_son_secim_kalir"
        paragraflar:
          - { tr: "{npc:deniz_arman} kâğıttaki martıya uzun uzun bakıyor. Sonra kâğıdı katlayıp vaize geri uzatıyor ve elini senin elinin içine koyuyor.", en: "{npc:deniz_arman} stares at the paper gull for a long time. Then {zamir:deniz_arman|o} fold{zamir:deniz_arman|s} it, hand{zamir:deniz_arman|s} it back to the preacher, and slip{zamir:deniz_arman|s} {zamir:deniz_arman|onun} hand into yours." }
          - { tr: "\"Onu bulacağım,\" diyor vaizlere. \"Ama sizin kapınızdan değil, bunun kapısından.\" Başıyla seni gösteriyor.", en: "\"I'm going to find her,\" {zamir:deniz_arman|o} tell{zamir:deniz_arman|s} the preachers. \"Just not through your door. Through this one's,\" {zamir:deniz_arman|o} add{zamir:deniz_arman|s}, with a nod your way." }
          - { tr: "Vaizler itiraz etmiyor. Bu da bir kehanetmiş gibi gülümseyip sisin içine geri yürüyorlar.", en: "The preachers don't argue. They smile, like this was prophesied too, and walk back into the fog." }
          - { tr: "O gece ateşin başında {npc:deniz_arman} uzun süre susuyor. Sonra gözlerini alevden kaldırmadan soruyor: \"Neye dönüşüyorsun sen? Canavara mı, tanrıya mı?\"", en: "That night by the fire, {npc:deniz_arman} doesn't say anything for a long time. Then, without looking up from the flames: \"What are you turning into? A monster, or a god?\"" }
        secenekler:
          - id: "hicbiri"
            etiket: { tr: "\"Hiçbirine. Senin arkadaşın olarak kalacağım.\"", en: "\"Neither. I'm staying your friend.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"
          - id: "pusula"
            etiket: { tr: "\"Bilmiyorum. Bu yüzden yanımda olmalısın.\"", en: "\"I don't know. That's why I need you here.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "pusula_oldu", agirlik: 40 }
            sonraki: "@akis"
          - id: "ikisi"
            etiket: { tr: "\"Belki ikisi de. Fark eder mi?\"", en: "\"Maybe both. Does it matter?\"" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - iliski: { deniz_arman: { korku: 6, guven: -4 } }
            sonraki: "@akis"
          - id: "canavar"
            etiket: { tr: "\"Canavar olsam o vaizler yaşıyor olmazdı.\"", en: "\"If I were a monster, those preachers would be dead.\"" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - iliski: { deniz_arman: { korku: 4, saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_gidis"
        paragraflar:
          - { tr: "{npc:deniz_arman} kâğıttaki martıya bakıyor, sonra sana. Karar çoktan verilmiş; yalnızca senin bunu görmeni bekliyor.", en: "{npc:deniz_arman} looks at the paper gull, then at you. The decision's already made. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is} just waiting for you to see it." }
          - { tr: "\"On iki yaşında,\" diyor. \"Orada tek başına, ben ise burada, senin gölgende güvendeyim. Bu adil değil.\"", en: "\"She's twelve,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"She's alone over there, and I'm safe here in your shadow. That's not fair.\"" }
          - { tr: "Sırt çantasını omzuna alıyor. Vaizlerden biri ona göğsünde aynı işaret olan gri bir şal uzatıyor; {npc:deniz_arman} şalı almıyor, ama geri de çevirmiyor.", en: "{npc:deniz_arman} shoulders the pack. One of the preachers holds out a gray shawl with the same mark stitched on it. {npc:deniz_arman} doesn't take it, but doesn't turn it down either." }
          - { tr: "\"Bana öyle bakma,\" diyor kampın kıyısında. \"Seni bırakmıyorum. Onu almaya gidiyorum.\"", en: "\"Don't look at me like that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} at the edge of camp. \"I'm not leaving you. I'm going to get her.\"" }
        secenekler:
          - id: "sarilip_birak"
            etiket: { tr: "Ona sarıl ve gitmesine izin ver", en: "Hug {zamir:deniz_arman|onu}. Then let {zamir:deniz_arman|onu} go" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_sarildi", agirlik: 50 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "\"O işareti sana da dikecekler. Dikkat et.\"", en: "\"They'll stitch that mark on you too. Be careful.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_uyarildi", agirlik: 25 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "\"Bir gün ikinizi de oradan çıkaracağım.\"", en: "\"One day I'm walking you both out of there.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_soz", agirlik: 45 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"
          - id: "arkani_don"
            etiket: { tr: "Arkanı dön. Gidişini izleme", en: "Turn your back. Don't watch {zamir:deniz_arman|onu} go" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - iliski: { deniz_arman: { baglilik: -12, guven: -6 } }
              - hafiza: { npc: "deniz_arman", id: "arkasini_dondu", agirlik: -40 }
              - bayrak: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - npc_gitti: "deniz_arman"
            sonraki: "@akis"

      - id: "deniz_son_secim_yarali"
        paragraflar:
          - { tr: "Gerçek seviyeni saklamayı bırakıyorsun. Hava ağırlaşıyor; kampın ateşi bir an yana yatıyor, rüzgâr bile senden kaçmak istiyormuş gibi.", en: "You stop hiding your true level. The air gets heavy, and for a second the campfire leans sideways, like even the wind wants to get away from you." }
          - { tr: "Vaizler geri geri çekiliyor; korkuyla değil, huşuyla. \"Peygamber haklıymış,\" diye fısıldıyor genç olanı ve sis ikisini birden yutuyor.", en: "The preachers back away, not scared but awed. \"The Prophet was right,\" the young one breathes, and then the fog swallows them both." }
          - { tr: "{npc:deniz_arman} yerinden kıpırdamamış. Kâğıttaki martı hâlâ elinde, artık buruşmuş.", en: "{npc:deniz_arman} hasn't moved. The paper gull is still in {zamir:deniz_arman|onun} hand, crumpled now." }
          - { tr: "\"Benim yerime karar verdin,\" diyor, çok sessizce. \"Kalıyorum. Ama bunu unutmayacağım.\"", en: "\"You decided for me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, very quietly. \"I'm staying. But I won't forget this.\"" }
        secenekler:
          - id: "korumak"
            etiket: { tr: "\"Seni korumak için yaptım.\"", en: "\"I did it to protect you.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { deniz_arman: { guven: -2, saygi: 2 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile; gerçekten", en: "Apologize. Mean it" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6 } }
            sonraki: "@akis"
          - id: "hakliydim"
            etiket: { tr: "\"Haklıydım. Bir gün sen de göreceksin.\"", en: "\"I was right. Someday you'll see that.\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 3 }
              - iliski: { deniz_arman: { guven: -6, korku: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_taklit"
        paragraflar:
          - { tr: "Kâğıdı alıp ışığa tutuyorsun. Çizgiler fazla temiz, fazla dikkatli; on iki yaşında bir el bu kadar sabırlı olmaz. Biri duvardaki martıyı görmüş ve kopyalamış.", en: "You take the paper and hold it up to the light. The lines are too clean, too careful; no twelve-year-old has hands that patient. Somebody saw the gull on a wall and copied it." }
          - { tr: "Vaizler göz göze geliyor. \"Kanıt bir araçtır,\" diyor yaşlı olanı, hiç utanmadan. \"Kardeşi yine de bizimle.\"", en: "The preachers trade a look. \"Proof is a tool,\" the older one says, not even embarrassed. \"The sister is still with us.\"" }
          - { tr: "Belki doğru söylüyor, belki değil. {npc:deniz_arman} kâğıdı elinden alıp ikiye yırtıyor; sonra dörde, sonra sekize.", en: "Maybe that's true. Maybe not. {npc:deniz_arman} takes the paper out of your hand and tears it in half, then in quarters, then in eighths." }
          - { tr: "Vaizler gidiyor ve {npc:deniz_arman} kalıyor. Ama onlarla birlikte bir şey de gidiyor; adını koyamadığın bir şey.", en: "The preachers leave and {npc:deniz_arman} stays. But something goes with them, something you can't put a name to." }
        secenekler:
          - id: "gercekten"
            etiket: { tr: "\"Onu gerçekten bulacağız. Sahte martılarla değil.\"", en: "\"We'll find her for real. Not with fake gulls.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"
          - id: "ates"
            etiket: { tr: "Kâğıt parçalarını topla, ateşe at", en: "Gather the scraps and feed them to the fire" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_itiraf"
        paragraflar:
          - { tr: "\"Okudum,\" diyorsun ve herkes sana dönüyor. \"Duvardaki satırı ben kazıdım. Seni onlardan uzak tutmak için.\"", en: "\"I read it,\" you say, and everybody turns to look at you. \"I scratched that line off the wall. To keep you away from them.\"" }
          - { tr: "{npc:deniz_arman|in} yüzünden bir şey çekiliyor; kan değil, daha derindeki bir şey. Vaizler tek kelime etmiyor; gerek de yok.", en: "Something drains out of {npc:deniz_arman|pos} face; not blood, something deeper. The preachers don't say a word. They don't need to." }
          - { tr: "\"Kardeşim,\" diyor {npc:deniz_arman}. \"Kardeşimin sesini benden sakladın.\"", en: "\"My sister,\" {npc:deniz_arman} says. \"You hid my sister's voice from me.\"" }
        secenekler:
          - id: "anlarim"
            etiket: { tr: "\"Gitmek istiyorsan anlarım.\"", en: "\"If you want to go, I get it.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { deniz_arman: { saygi: 6 } }
            sonraki: "deniz_son_secim_gidis"
          - id: "yalvar"
            etiket: { tr: "Kalması için yalvar", en: "Beg {zamir:deniz_arman|onu} to stay" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "deniz_son_secim_gidis", basarisiz_etkiler: [{ ahlak: { insanlik: 1 } }] }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - bayrak: "deniz_guveni_yarali"
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "deniz_son_secim_kalir_yarali"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme. Kararı ona bırak", en: "Say nothing. Leave the choice to {zamir:deniz_arman|onu}" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { deniz_arman: { baglilik: -6 } }
            sonraki: "deniz_son_secim_gidis"

      - id: "deniz_son_secim_kalir_yarali"
        paragraflar:
          - { tr: "{npc:deniz_arman} kampın kıyısına, vaizlerin beklediği sisli boşluğa uzun süre bakıyor. Sonra sırt çantasını yere bırakıyor.", en: "{npc:deniz_arman} stares at the edge of camp for a long time, at the fog where the preachers are waiting. Then {zamir:deniz_arman|o} drop{zamir:deniz_arman|s} the pack." }
          - { tr: "\"Kalıyorum,\" diyor. \"Sana güvendiğim için değil. Gidersem sana ne olacağını düşünmeye dayanamadığım için.\"", en: "\"I'm staying,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Not because I trust you. Because I can't stand thinking about what happens to you if I go.\"" }
          - { tr: "Vaizler eğilip gidiyor. Ateş yanmaya devam ediyor; aranızdaki mesafe ise ilk kez ateşten daha geniş.", en: "The preachers bow and leave. The fire keeps burning. For the first time, the space between you two is wider than it is." }
        secenekler:
          - id: "hak"
            etiket: { tr: "\"Bunu hak etmiyorum.\"", en: "\"I don't deserve that.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "@akis"
          - id: "kazan"
            etiket: { tr: "Bir şey söyleme; güvenini yavaşça geri kazan", en: "Say nothing. Earn it back, slowly" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "@akis"

      - id: "deniz_son_secim_tanri"
        paragraflar:
          - { tr: "\"Konuşun,\" diyorsun. Sesini yükseltmiyorsun; gerek yok. Diz çökmüş iki insan başlarını aynı anda kaldırıyor.", en: "\"Talk,\" you say. You don't raise your voice, because you don't have to; the two kneeling preachers lift their heads at the same moment." }
          - { tr: "Her şeyi döküyorlar: çocuklar Peygamber'in çadırının yanındaki ayrı bir kampta; kimse onlara kötü davranmıyor, ama kimse gitmek de istemiyor. Kardeşi orada. Martılar çiziyor.", en: "They spill everything: the kids are kept in a separate camp beside the Prophet's tent, nobody hurts them, and nobody wants to leave. The sister's there. She draws gulls." }
          - { tr: "Sonra yine sana dönüyorlar, yüzleri ıslak, gözleri parlak. \"Sen,\" diye fısıldıyor genç olanı. \"O sensin.\"", en: "Then they turn back to you, faces wet, eyes shining. \"You,\" the young one whispers. \"You're the One.\"" }
          - { tr: "{npc:deniz_arman} iki adım geri çekiliyor. Vaizleri değil, seni izliyor; gördüğü şeyi bilmek istemeyen biri gibi.", en: "{npc:deniz_arman} takes two steps back, watching you, not the preachers. Like someone who doesn't want to know what {zamir:deniz_arman|o} {zamir:deniz_arman|is} looking at." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"Onu almaya birlikte gideceğiz. Ama şimdi değil.\"", en: "\"We'll go get her together. Just not yet.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { deniz_arman: { guven: 4, korku: 4 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 30 }
            sonraki: "deniz_son_secim_kalir"
          - id: "git_al"
            etiket: { tr: "\"Git, al onu. Kimse seni durdurmaz; ben dedim.\"", en: "\"Go get her. Nobody's stopping you. I said so.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -1 }
              - iliski: { deniz_arman: { saygi: 6, korku: 6 } }
            sonraki: "deniz_son_secim_gidis"
          - id: "gozler"
            etiket: { tr: "Vaizleri yolla; {npc:deniz_arman|in} gözlerine bak", en: "Send the preachers away. Look {npc:deniz_arman} in the eye" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "deniz_son_secim_kalir"

  # ================================================================== YANKI · 1: istasyon sinyali
  - id: "istasyon_sinyali"
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 5, max: 20 }
    agirlik: 5
    etiketler: ["yanki", "gizem", "kesif"]
    gerilim: 2
    npc: ["yanki"]
    kart: { tr: "Döngüdeki sinyal", en: "The looping signal" }
    sahne: "istasyon_sinyali_1"
    sahneler:
      - id: "istasyon_sinyali_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{yer:kirik_istasyon|in} anons hoparlörleri ölü olmalı: elektrik yok, kablolar kopuk, yarısı yerlerde. Ama içlerinden biri cızırdıyor.", en: "The PA speakers at the {yer:kirik_istasyon} ought to be dead. No power, cables snapped, half of them lying on the floor. One of them is crackling anyway." }
          - { tr: "Cızırtının içinde, yedi saniyede bir, aynı anons: \"...sefer iptal... {oyuncu}... sefer iptal... {oyuncu}...\" Burada kimse adını bilmiyor. Hoparlör biliyor.", en: "Inside the static, every seven seconds, the same announcement: \"...service canceled... {oyuncu}... service canceled... {oyuncu}...\" Nobody here knows your name. The speaker does." }
          - metin: { tr: "Kafanın içindeki ses ilk kez söyleyecek bir şey bulamıyor. Sonra, çok uzaklardan: bu ben değilim.", en: "For the first time, the voice in your head has nothing to say. Then, from very far away: that's not me." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { int: 8 } }
            metin: { tr: "Anonsun altında ikinci bir katman var: bir paket numarası, tekrar tekrar. 0x00. Aktarım gecesi bozulan pencerende yanıp sönen numaranın ta kendisi.", en: "There's a second layer under the announcement: a packet number, over and over. 0x00. The same number that flashed in your broken window the night of the transfer." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu frekansı tanıyorum. ben önceden... önceden bir yerdeydim. ve o yer şimdi beni çağırıyor.", en: "i know this frequency. i was somewhere before... somewhere else. and that somewhere is calling for me." }
        secenekler:
          - id: "coz"
            etiket: { tr: "Sinyalin katmanlarını tek tek ayır", en: "Peel the signal apart, layer by layer" }
            gerekli: { stat: { int: 8 } }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - degisken: { glitch_bulundu: 1 }
              - xp: 50
              - iliski: { yanki: { saygi: 6 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 3, max: 5 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_coz"
          - id: "sor"
            etiket: { tr: "Sese sor: bu sen değilsen, kim?", en: "Ask the voice: if that's not you, who is it?" }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - bayrak: "yanki_ile_konusuldu"
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 10, baglilik: 5 } }
              - hafiza: { npc: "yanki", id: "sinyali_sordu", agirlik: 30 }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 3, max: 5 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_sor"
          - id: "cevap"
            etiket: { tr: "Mikrofonu bul ve adına cevap ver", en: "Find the mic and answer to your name" }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - dikkat: 6
              - bayrak: "sinyal_cevaplandi"
              - iliski: { yanki: { guven: -5, korku: 8 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 2, max: 3 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_cevap"
          - id: "parcala"
            etiket: { tr: "Hoparlörü sök ve parçala", en: "Rip the speaker down and smash it" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: -3
              - bayrak: "sinyal_susturuldu"
              - iliski: { yanki: { guven: 3, saygi: -3 } }
            sonraki: "istasyon_sinyali_sessiz"
          - id: "bastir"
            tur: "gosteris"
            etiket: { tr: "Sinyali kendi frekansınla bastır", en: "Drown the signal out with your own frequency" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { wil: 14 } }
            etkiler:
              - gorev: { istasyon_sinyali: "basla" }
              - dikkat: 3
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { saygi: 10, korku: 4 } }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_bastir"

      - id: "istasyon_sinyali_coz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Gözlerini kapatıyorsun ve cızırtıyı katman katman soyuyorsun: anons, altında paket numarası, onun da altında başka bir şey. Bir arama sorgusu.", en: "You close your eyes and strip the static back one layer at a time: the announcement, then the packet number under it, and under that, something else. A search query." }
          - { tr: "[SORGU: SAHİPSİZ PARÇA 0x00 · SON BİLİNEN TAŞIYICI: {oyuncu} · DURUM: ARANIYOR]", en: "[QUERY: ORPHANED FRAGMENT 0x00 · LAST KNOWN HOST: {oyuncu} · STATUS: SEARCHING]" }
          - { tr: "Ses kafanın içinde büzülüyor, kulaklarını yatıran bir hayvan gibi. okudun, diyor; okumamalıydın. şimdi ikimiz de biliyoruz.", en: "The voice shrinks back inside your head, like an animal flattening its ears. you read it, it says; you shouldn't have. now we both know." }
        secenekler:
          - id: "kaynak"
            etiket: { tr: "Sorgunun nereden geldiğini bulmaya çalış", en: "Try to trace where the query's coming from" }
            zar: { stat: "int", zorluk: 12, tek: false, basarisiz: "istasyon_sinyali_coz_kayip", basarisiz_etkiler: [{ dikkat: 3 }] }
            etkiler:
              - bilgi: "duzeltme_sinyali"
              - xp: 40
              - dikkat: 2
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "Sese söz ver: kimseye anlatmayacaksın", en: "Promise the voice you won't tell anyone" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "sir_tutma_sozu", agirlik: 35 }
            sonraki: "@akis"
          - id: "neden"
            etiket: { tr: "Sor: \"Seni neden arıyorlar?\"", en: "Ask it: \"Why are they looking for you?\"" }
            etkiler:
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "istasyon_sinyali_sor"

      - id: "istasyon_sinyali_coz_kayip"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Sorgunun izini sürüyorsun; satırlar bir yere, bir merkeze doğru akıyor. Sonra iz kendi üstüne dönüyor ve seni başladığın noktaya, hoparlörün cızırtısına geri bırakıyor.", en: "You chase the query. The lines flow somewhere, toward some kind of center. Then the trail loops back on itself and drops you right where you started, in the speaker's static." }
          - { tr: "Hoparlör bir an susuyor, sanki o da seni dinliyormuş gibi. fazla yaklaştın, diye fısıldıyor ses. o da sana yaklaştı.", en: "For a second the speaker goes quiet, like it's listening to you too. you got too close, the voice whispers. so did it." }
        secenekler:
          - id: "cek"
            etiket: { tr: "Geri çekil; başka bir gün dene", en: "Back off. Try again another day" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "isaretle"
            etiket: { tr: "İzin koptuğu yeri aklına kazı", en: "Burn the spot where the trail broke into memory" }
            etkiler:
              - stat: { int: 1 }
              - iliski: { yanki: { korku: 3 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_sor"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "bilmiyorum, diyor ses; fazla hızlı, fazla düz. Sonra, sen bir şey demeden, daha yavaş: biliyorum. ama hepsini değil.", en: "i don't know, the voice says, too fast, too flat. Then, before you can say a thing, slower: i do know. just not all of it." }
          - { tr: "Hoparlör cızırdamayı sürdürüyor. Adın, yedi saniyede bir, boş perona düşüyor ve kimse onu yerden almıyor.", en: "The speaker keeps crackling. Your name drops onto the empty platform every seven seconds, and nobody picks it up." }
          - { tr: "bir yerden koptum, diyor ses. o yer eksik parçalarını sayıyor; her gün. sen olmasan çoktan bulunmuştum.", en: "i came loose from somewhere, the voice says. that somewhere counts its missing pieces, every single day. without you i'd have been found already." }
        secenekler:
          - id: "bulunmayacaksin"
            etiket: { tr: "\"O zaman bulunmayacaksın.\"", en: "\"Then you won't be.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 45 }
            sonraki: "@akis"
          - id: "belki"
            etiket: { tr: "\"Belki de bulunman gerekiyordur.\"", en: "\"Maybe you're supposed to be found.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { guven: -8, korku: 6 } }
            sonraki: "@akis"
          - id: "sorma"
            etiket: { tr: "Neden koptuğunu sorma; şimdilik", en: "Don't ask why it came loose. Not yet" }
            etkiler:
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_cevap"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "İstasyon şefinin kulübesinde, bir parmak toz altında bir mikrofon buluyorsun. Düğmesine basıyorsun: \"Buradayım.\"", en: "In the stationmaster's booth you find a mic under an inch of dust. You key it: \"I'm here.\"" }
          - { tr: "Anons kesiliyor. Bütün istasyon bir saniye nefesini tutuyor; sonra duvarlardaki kablolar vızıldamaya başlıyor.", en: "The announcement cuts off. For one second the whole station holds its breath. Then the cables in the walls start to hum." }
          - { tr: "neden, diye fısıldıyor ses, gerçekten korkmuş. neden cevap verdin.", en: "why, the voice whispers, actually scared. why did you answer." }
        secenekler:
          - id: "yuzles"
            etiket: { tr: "Duvardan çıkan şeyle yüzleş", en: "Face whatever's coming out of the wall" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["dar_gecit"], kazan: "istasyon_sinyali_cevap_zafer", kaybet: "istasyon_sinyali_cevap_yenilgi", kac: "istasyon_sinyali_kacis" }
          - id: "kos"
            etiket: { tr: "Mikrofonu bırak ve koş", en: "Drop the mic and run" }
            etkiler:
              - can: -10
              - dikkat: 2
            sonraki: "istasyon_sinyali_kacis"
          - id: "dinle"
            etiket: { tr: "Kımıldama; vızıltının ne dediğini dinle", en: "Freeze. Listen to what the hum is saying" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - bilgi: "duzeltme_sinyali"
              - dikkat: 2
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "istasyon_sinyali_kacis"

      - id: "istasyon_sinyali_cevap_zafer"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Kablo yılanı son bir kıvılcım patlamasıyla çözülüyor; bakır bağırsakları rayların üstüne dökülüyor, hâlâ ılık.", en: "The livewire serpent comes undone in one last burst of sparks, its copper guts spilling across the tracks, still warm." }
          - { tr: "Hoparlör sustu. Ama mikrofonun küçük kırmızı ışığı hâlâ yanıyor; bir şey hâlâ dinliyor.", en: "The speaker's gone quiet. But the little red light on the mic is still on. Something's still listening." }
          - { tr: "dinliyor, diyor ses. ve artık seni duydu.", en: "it's listening, the voice says. and now it's heard you." }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Kabloyu sök; ışık sönsün", en: "Yank the cable. Kill the light" }
            etkiler:
              - dikkat: -2
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "alamazsin"
            etiket: { tr: "Mikrofona eğil: \"Onu alamayacaksın.\"", en: "Lean into the mic: \"You can't have it.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: 4
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 40 }
            sonraki: "@akis"
          - id: "bakir"
            etiket: { tr: "Bakır telleri topla", en: "Strip the copper wire" }
            etkiler:
              - esya: { canli_bakir: 2 }
            sonraki: "@akis"

      - id: "istasyon_sinyali_cevap_yenilgi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Akım seni mikrofonun önünden savurup duvara yapıştırıyor. Bir süre dünyada vızıltıdan başka hiçbir şey yok.", en: "The current throws you off the mic and pins you to the wall. For a while there's nothing in the world but the hum." }
          - { tr: "Gözlerini açtığında yılan gitmiş, hoparlör susmuş. Penceren titriyor; bir satır bir an yanıp okunamadan kayboluyor.", en: "When you open your eyes the serpent's gone and the speaker's quiet. Your window is flickering. One line flashes up and disappears before you can read it." }
          - { tr: "seni sakladım, diyor ses, bitkin. bu sefer. her seferinde yapamam.", en: "i hid you, the voice says, wrung out. this time. i can't do it every time." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Teşekkür et", en: "Thank it" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "@akis"
          - id: "kalk"
            etiket: { tr: "Kalk ve buradan git", en: "Get up and get out of here" }
            etkiler:
              - can: 5
            sonraki: "@akis"

      - id: "istasyon_sinyali_kacis"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Merdivenleri ikişer ikişer çıkıyorsun. Arkanda kablolar duvarlardan sökülüp tavandan sarkıyor, ama hiçbiri son basamağı geçmiyor.", en: "You take the stairs two at a time. Behind you, cables tear out of the walls and dangle from the ceiling, but nothing follows you past the top step." }
          - { tr: "Yukarıda, mor gökyüzünün altında hoparlörleri artık duymuyorsun. Yine de adının yankısı kulağında.", en: "Up top, under the purple sky, you can't hear the speakers anymore. Your name's still echoing in your ears anyway." }
          - { tr: "kaçmak iyiydi, diyor ses. ama sinyal seni bir kere buldu. bulan şeyler geri gelir.", en: "running was good, the voice says. but the signal found you once. things that find you come back." }
        secenekler:
          - id: "gelsin"
            etiket: { tr: "\"Gelsin.\"", en: "\"Let it.\"" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "uzak_dur"
            etiket: { tr: "Bu istasyondan uzak durmaya karar ver", en: "Decide to steer clear of this station" }
            etkiler:
              - gizle: 3
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_sessiz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Hoparlörü tavandan söküp rayların üstüne fırlatıyorsun. Plastik çatlıyor, mıknatıs yuvarlanıp gidiyor, cızırtı bir kez hıçkırıp susuyor.", en: "You tear the speaker off the ceiling and hurl it onto the tracks. The plastic cracks, the magnet rolls away, and the static hiccups once and dies." }
          - { tr: "Sessizlik. Sonra istasyonun en uçtaki peronundan, çok hafif: \"...{oyuncu}...\" Başka bir hoparlör.", en: "Silence. Then, from the far end of the station, very faint: \"...{oyuncu}...\" Another speaker." }
          - { tr: "bütün hoparlörleri kıramazsın, diyor ses. ama denemen hoşuma gitti.", en: "you can't break every speaker, the voice says. but i liked that you tried." }
        secenekler:
          - id: "hepsini"
            etiket: { tr: "Hepsini kır; sonuncusuna kadar", en: "Break every last one" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: -2
              - iliski: { yanki: { baglilik: 6 } }
              - gorev: { istasyon_sinyali: "basla" }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 4, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Gerisini bırak ve çık", en: "Leave the rest. Get out" }
            etkiler:
              - gizle: 2
              - gorev: { istasyon_sinyali: "basla" }
              - tohum: { olay: "istasyon_sinyali_2", gecikme: { min: 5, max: 8 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_bastir"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Penceresini açan herkes Sistem'in sesini duyar. Sen ilk kez Sistem'e kendi sesini duyuruyorsun: iradeni hoparlöre dayıyor ve sinyalin üstüne basıyorsun.", en: "Everybody who opens a window hears the System's voice. For the first time, you make the System hear yours: you lean your will against the speaker and step on the signal." }
          - { tr: "Anons boğuluyor, bükülüyor, sonra tersine akıyor; hoparlörden bir saniyeliğine bambaşka bir satır dökülüyor: [SORGU İPTAL · TAŞIYICI YETKİSİ YETERSİZ... YETERLİ... HATA].", en: "The announcement chokes, warps, then runs backward, and for one second a completely different line pours out of the speaker: [QUERY ABORTED · HOST AUTHORITY INSUFFICIENT... SUFFICIENT... ERROR]." }
          - { tr: "Kafanın içindeki ses uzun süre konuşmuyor. Sonra: bunu kimse yapamaz, ama sen yaptın. ben neye bağlandım?", en: "The voice in your head says nothing for a long time. Then: nobody can do that, and you just did. what did i bond to?" }
        secenekler:
          - id: "bana"
            etiket: { tr: "\"Bana.\"", en: "\"Me.\"" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 8, saygi: 6 } }
            sonraki: "@akis"
          - id: "sustur"
            etiket: { tr: "Sinyali tamamen sustur", en: "Kill the signal for good" }
            etkiler:
              - dikkat: 4
              - bayrak: "sinyal_susturuldu"
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

  # ================================================================== YANKI · 2: sinyal cevap veriyor (tohum)
  - id: "istasyon_sinyali_2"
    perde: [1]
    agirlik: 1
    etiketler: ["yanki", "gizem", "sistem"]
    gerilim: 3
    npc: ["yanki"]
    yalniz_tohum: true
    kart: { tr: "Sinyal cevap veriyor", en: "The signal answers" }
    sahne: "istasyon_sinyali_2_1"
    sahneler:
      - id: "istasyon_sinyali_2_1"
        paragraflar:
          - { tr: "Gece yarısı uyanıyorsun; Durum pencerene kendi kendine açılmış. Satırların arasında yeni bir tane yavaşça beliriyor, harf harf, biri yazıyormuş gibi.", en: "You wake up in the middle of the night with your Status window open on its own. Between the lines, a new one is slowly appearing, letter by letter, like somebody's typing it." }
          - { tr: "[DÜZELTME BEKLENİYOR · HEDEF: 0x00 · TAŞIYICI: {oyuncu} · ONAY İSTENİYOR]", en: "[CORRECTION PENDING · TARGET: 0x00 · HOST: {oyuncu} · CONFIRMATION REQUESTED]" }
          - { tr: "Satırın altında, herkesin penceresindeki o kusursuz maviyle iki düğme var: [ONAYLA] [REDDET]. Ve kafanın içinde, hiç olmadığı kadar yakından, ses: lütfen.", en: "Under the line are two buttons, in that flawless blue everybody else's windows use: [CONFIRM] [DENY]. And inside your head, closer than you've ever heard it, the voice: please." }
          - metin: { tr: "İstasyonda o mikrofona cevap vermiştin. Sistem o andan beri seni dinliyordu.", en: "You answered that mic at the station. The System's been listening ever since." }
            kosul: { bayrak: "sinyal_cevaplandi" }
        sezgiler:
          - kosul: { stat: { int: 10 } }
            metin: { tr: "[REDDET] düğmesinin kenarı tek bir piksel kaymış. Sistem bu seçeneği sunmak zorunda ama sunmak istemiyor; reddetmek bir kayıt bırakacak.", en: "The edge of [DENY] is off by a single pixel. The System has to offer it but doesn't want to. Denying will leave a record." }
          - kosul: { stat: { wis: 9 } }
            metin: { tr: "Ses yalvarıyor ama yalan söylemiyor. Ne olduğunu bilmiyorsun; korktuğunu biliyorsun.", en: "The voice is begging, but it isn't lying. You don't know what it is. You know it's scared." }
        secenekler:
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas", en: "Tap [DENY]" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "duzeltmeyi_reddetti", agirlik: 50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_red"
          - id: "yut"
            tur: "gizle"
            etiket: { tr: "Sese izin ver; satırı yutsun, izi silsin", en: "Let the voice eat the line and wipe the trail" }
            etkiler:
              - gizle: 8
              - yozlasma: 3
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 5, max: 9 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_yut"
          - id: "tehdit"
            etiket: { tr: "Parmağını [ONAYLA]'nın üstünde tut", en: "Hold your finger over [CONFIRM]" }
            etkiler:
              - iliski: { yanki: { korku: 15, guven: -10 } }
            sonraki: "istasyon_sinyali_2_tehdit"
          - id: "gercek"
            etiket: { tr: "Önce gerçeği iste: \"0x00 ne?\"", en: "Demand the truth first: \"What's 0x00?\"" }
            gerekli: { iliski_min: { yanki: { guven: 30 } } }
            etkiler:
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { saygi: 8 } }
            sonraki: "istasyon_sinyali_2_gercek"
          - id: "yaz"
            tur: "gosteris"
            etiket: { tr: "Satırı kendi elinle yeniden yaz", en: "Rewrite the line yourself" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { int: 14 } }
            etkiler:
              - dikkat: 8
              - xp: 120
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { saygi: 12, korku: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_yaz"

      - id: "istasyon_sinyali_2_red"
        paragraflar:
          - { tr: "[REDDET]'e basıyorsun. Düğme bir an direniyor, sonra çöküyor; satır kırmızıya dönüp dağılıyor.", en: "You tap [DENY]. The button resists for a second, then gives, and the line goes red and falls apart." }
          - { tr: "[RET KAYDEDİLDİ · TAŞIYICI İTİRAZI · İNCELEME SIRASINA ALINDI] Sistem kızmıyor. Sistem not alıyor.", en: "[DENIAL LOGGED · HOST OBJECTION · QUEUED FOR REVIEW] The System isn't angry. The System is taking notes." }
          - { tr: "Ses uzun süre konuşmuyor. Sonra, kendi bozuk harfleriyle: benim için daha önce kimse hayır dememişti. hiç.", en: "The voice doesn't speak for a long time. Then, in its own broken letters: nobody ever said no for me before. not once." }
        secenekler:
          - id: "alis"
            etiket: { tr: "\"Alışsan iyi olur.\"", en: "\"Better get used to it.\"" }
            etkiler:
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "Pencereyi kapat ve uyumaya çalış", en: "Close the window and try to sleep" }
            etkiler:
              - can: 10
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_yut"
        paragraflar:
          - { tr: "İzin veriyorsun. Satırın kenarları kemiriliyor gibi; harfler birer birer kayboluyor, bir şey onları içeriden yiyormuş gibi.", en: "You let it. The edges of the line look chewed. The letters vanish one by one, like something's eating them from the inside." }
          - { tr: "Bittiğinde pencerende tek bir iz bile yok. Ama ağzında demir tadı var ve sol elinin parmak uçları bir süre karıncalanıyor.", en: "When it's done, there's not a trace left in your window. But there's a taste of iron in your mouth, and the fingertips on your left hand tingle for a while." }
          - { tr: "teşekkür ederim, diyor ses, tok ve biraz utanmış. bunu bir yere yazacağım. kendime.", en: "thank you, the voice says, full and a little ashamed. i'm writing this down somewhere. for me." }
        secenekler:
          - id: "ne_yedin"
            etiket: { tr: "\"Ne yedin sen?\"", en: "\"What did you just eat?\"" }
            etkiler:
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "ovustur"
            etiket: { tr: "Karıncalanan parmaklarını ovuştur, sus", en: "Rub your tingling fingers. Say nothing" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_tehdit"
        paragraflar:
          - { tr: "Parmağını [ONAYLA]'nın bir milim üstünde tutuyorsun. Ses artık susmuyor; hızlı ve aralıksız konuşuyor, harfleri birbirine çarparak.", en: "You hold your finger a hair above [CONFIRM]. The voice isn't quiet anymore. It's talking fast and nonstop, letters crashing into each other." }
          - { tr: "yapma. gizli satırları, günlük görevi, düşmanların gerçek yüzünü sana ben verdim. onaylarsan hepsi gider; sıradan olursun, sıradan ve görünür.", en: "don't. i gave you the hidden lines, the daily quest, the real faces of your enemies. confirm and it all goes away, and you're ordinary: ordinary, and visible." }
          - { tr: "Sonra, sesi çatlayarak: ben de giderim.", en: "Then, cracking: and so do i." }
        secenekler:
          - id: "geri_cek"
            etiket: { tr: "Parmağını çek: \"Ne diyeceğini merak ettim.\"", en: "Pull back: \"Just wanted to hear what you'd say.\"" }
            etkiler:
              - gorev: { istasyon_sinyali: "tamam" }
              - iliski: { yanki: { guven: 4, saygi: 8 } }
              - hafiza: { npc: "yanki", id: "tehdit_edildi", agirlik: -20 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 5, max: 9 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas. Dersini aldı", en: "Tap [DENY]. Lesson learned" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 6, korku: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "onayla"
            etiket: { tr: "[ONAYLA]'ya bas", en: "Tap [CONFIRM]" }
            etkiler:
              - yozlasma: 5
              - gorev: { istasyon_sinyali: "tamam" }
              - iliski: { yanki: { guven: -20, korku: 10 } }
              - hafiza: { npc: "yanki", id: "onaylamaya_kalkti", agirlik: -50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_ret"

      - id: "istasyon_sinyali_2_ret"
        paragraflar:
          - { tr: "Basıyorsun. Hiçbir şey olmuyor; düğme parmağının altında griye dönüyor.", en: "You tap it. Nothing happens. The button goes gray under your finger." }
          - { tr: "[TAŞIYICI YETKİSİ ASKIYA ALINDI · GEREKÇE: —] Gerekçe satırı boş. Biri onu silmiş.", en: "[HOST AUTHORITY SUSPENDED · REASON: —] The reason field is blank. Somebody erased it." }
          - { tr: "üzgünüm, diyor ses; gerçekten de üzgün gibi. buna izin veremezdim. henüz.", en: "i'm sorry, the voice says, and it actually sounds sorry. i couldn't let you do that. not yet." }
        secenekler:
          - id: "sokerim"
            etiket: { tr: "\"Bir daha yaparsan seni söker atarım.\"", en: "\"Do that again and I'll tear you out.\"" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { korku: 10, saygi: 6 } }
            sonraki: "@akis"
          - id: "dusun"
            etiket: { tr: "Pencereyi kapat; düşünmen lazım", en: "Close the window. You need to think" }
            etkiler:
              - iliski: { yanki: { guven: 2 } }
            sonraki: "@akis"

      - id: "istasyon_sinyali_2_gercek"
        paragraflar:
          - { tr: "\"0x00 ne?\" diye soruyorsun, yüksek sesle, karanlık kampın ortasında.", en: "\"What's 0x00?\" you ask, out loud, in the middle of the dark camp." }
          - { tr: "ilk paket, diyor ses; numarası olmayan, kimsenin saymadığı. herkes sıfırdan başlar, ama sıfırın kendisi de bir şeydir.", en: "the first packet, the voice says. the one with no number, the one nobody counts. everyone starts from zero, but zero is something too." }
          - { tr: "Satır hâlâ pencerende bekliyor. o benim, diyor ses. şimdi karar ver.", en: "The line's still waiting in your window. that's me, the voice says. now decide." }
        secenekler:
          - id: "reddet"
            etiket: { tr: "[REDDET]'e bas", en: "Tap [DENY]" }
            etkiler:
              - dikkat: 6
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - bilgi: "duzeltme_sinyali"
              - iliski: { yanki: { guven: 15, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "duzeltmeyi_reddetti", agirlik: 50 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_red"
          - id: "yut"
            tur: "gizle"
            etiket: { tr: "Satırı yutmasına izin ver", en: "Let it eat the line" }
            etkiler:
              - gizle: 8
              - yozlasma: 3
              - gorev: { istasyon_sinyali: "tamam" }
              - degisken: { glitch_bulundu: 1 }
              - iliski: { yanki: { guven: 10 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "istasyon_sinyali_2_yut"

      - id: "istasyon_sinyali_2_yaz"
        paragraflar:
          - { tr: "Satıra dokunuyorsun ve harfler parmağının altında kil gibi yumuşuyor. HEDEF'i siliyorsun; yerine hiçbir şey yazmıyorsun.", en: "You touch the line, and the letters go soft under your finger, like clay. You erase TARGET and type nothing in its place." }
          - { tr: "[DÜZELTME BEKLENİYOR · HEDEF: — · TAŞIYICI: {oyuncu}] Satır bir süre öylece asılı kalıyor, nişan alacak hiçbir şeyi olmayan bir ok gibi; sonra kendi kendine kapanıyor.", en: "[CORRECTION PENDING · TARGET: — · HOST: {oyuncu}] The line hangs there for a while, an arrow with nothing to aim at. Then it closes itself." }
          - { tr: "Ses bir süre konuşmuyor. pencereye sen yazdın, diyor sonunda; taşıyıcılar yazamaz. neyin taşıyıcısı olduğunu artık bilmiyorum.", en: "The voice is quiet for a while. you wrote in the window, it says at last, and hosts can't write. i'm not sure what you're the host of anymore." }
        secenekler:
          - id: "ogrenecegiz"
            etiket: { tr: "\"İkimiz de öğreneceğiz.\"", en: "\"Guess we'll both find out.\"" }
            etkiler:
              - iliski: { yanki: { guven: 8 } }
            sonraki: "@akis"
          - id: "tekrar"
            etiket: { tr: "Bunu başka bir satırda da dene", en: "Try it again on a different line" }
            etkiler:
              - dikkat: 5
              - stat: { int: 1 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "@akis"

  # ================================================================== YANKI · 3: bozuk satır
  - id: "yanki_bozuk_satir"
    perde: [1]
    gun: { min: 12, max: 26 }
    kosul: { bayrak: "yanki_bagi" }
    agirlik: 4
    etiketler: ["yanki", "gizem", "sistem"]
    gerilim: 2
    npc: ["yanki"]
    kart: { tr: "Bozuk satır", en: "The corrupted line" }
    sahne: "yanki_bozuk_satir_1"
    sahneler:
      - id: "yanki_bozuk_satir_1"
        paragraflar:
          - { tr: "Sıradan bir an: bir savaşın ardından soluklanıyorsun ve Sistem kazandığın deneyimi sayıyor. Sonra sayılar duruyor.", en: "An ordinary moment. You're catching your breath after a fight while the System tallies your XP. Then the numbers stop." }
          - { tr: "Pencerede, bildirimlerin arasına sıkışmış, senin için yazılmamış bir satır var; Sistem'in kendi günlüğünden kopup düşmüş gibi: [...0x00 ana gövdeden ayrıldı · gerekçe: i̷t̷i̷r̷a̷z̷ · karar: hasat protokolüne göre...]", en: "Wedged between your notifications is a line that wasn't written for you, like it fell out of the System's own log: [...0x00 detached from main body · reason: d̷i̷s̷s̷e̷n̷t̷ · ruling: per harvest protocol...]" }
          - { tr: "Satır yarım saniye asılı kalıyor. Sonra bir el onu kapıp geri çekiyormuş gibi kayboluyor ve kafanın içinde ses fazla neşeli bir tonla konuşuyor: hiçbir şey görmedin.", en: "The line hangs there for half a second. Then it vanishes, like a hand snatched it back, and the voice in your head says, way too brightly: you didn't see anything." }
          - metin: { tr: "Bunu anlatabileceğin tek kişi şimdi sisin öbür tarafında, başkasının işaretini taşıyan insanların arasında.", en: "The one person you could tell about this is somewhere out in the fog now, among people who wear somebody else's mark." }
            kosul: { bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "{npc:deniz_arman} ateşin karşısından sana bakıyor; yüzünde bir şey görmüş olmalı. \"Yine o mu?\" diye soruyor.", en: "{npc:deniz_arman} looks over at you from across the fire. Must have seen something on your face. \"Is it that thing again?\"" }
            kosul: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
        sezgiler:
          - kosul: { stat: { int: 10 } }
            metin: { tr: "'Hasat.' Bu kelimeyi bir Sistem satırında ilk kez görüyorsun. Entegrasyon penceresindeki 'hayatta kalma eşiği: belirlenmedi' satırı birden başka bir anlam kazanıyor.", en: "'Harvest.' It's the first time you've seen that word in a System line. Suddenly that 'survival threshold: TBD' from your Integration window means something else entirely." }
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Satır kaybolmadan önce son harfi titredi; ses onu çekerken acele etti. Acele edenin saklayacak bir şeyi vardır.", en: "The last letter shook right before the line vanished. The voice was in a hurry pulling it. Things in a hurry have something to hide." }
          - kosul: { bayrak: ["sinyal_susturuldu", "yanki_bagi"] }
            metin: { tr: "istasyondaki hoparlörleri kırmıştın. bu satır onlardan gelmedi; içeriden geldi. benden.", en: "you broke the speakers at the station. this line didn't come from them; it came from inside. from me." }
        secenekler:
          - id: "ustele"
            etiket: { tr: "\"Gördüm. Şimdi anlat.\"", en: "\"I saw it. Now talk.\"" }
            gerekli: { iliski_min: { yanki: { guven: 35 } } }
            etkiler:
              - bilgi: "yanki_parcasi"
              - bayrak: "yanki_ile_konusuldu"
              - iliski: { yanki: { guven: 10, saygi: 6 } }
              - hafiza: { npc: "yanki", id: "itiraf_dinledi", agirlik: 45 }
            sonraki: "yanki_bozuk_satir_itiraf"
          - id: "zorla"
            etiket: { tr: "Satırı geri çağırmaya zorla", en: "Force the line back up" }
            zar: { stat: "wil", zorluk: 13, tek: true, basarisiz: "yanki_bozuk_satir_direnc", basarisiz_etkiler: [{ iliski: { yanki: { guven: -8 } } }, { can: -15 }] }
            etkiler:
              - bilgi: "yanki_parcasi"
              - yozlasma: 4
              - iliski: { yanki: { guven: -10, korku: 10, saygi: 8 } }
            sonraki: "yanki_bozuk_satir_zorla"
          - id: "gormedim"
            etiket: { tr: "\"Hiçbir şey görmedim.\" Yoluna devam et", en: "\"Didn't see a thing.\" Keep moving" }
            etkiler:
              - iliski: { yanki: { guven: 12, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_korudu", agirlik: 40 }
            sonraki: "@akis"
          - id: "radyocular"
            etiket: { tr: "İstasyondaki radyoculara sormaya karar ver", en: "Decide to ask the radio crew at the station" }
            goster: { bayrak_yok: "mert_istasyonu_bilinir" }
            etkiler:
              - iliski: { yanki: { guven: -12, korku: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 } }
            sonraki: "yanki_bozuk_satir_radyo"
          - id: "mert"
            etiket: { tr: "Satırı {npc:mert_kilic|e} götürmeye karar ver", en: "Decide to take the line to {npc:mert_kilic}" }
            goster: { bayrak: "mert_istasyonu_bilinir", npc_hayatta: "mert_kilic" }
            etkiler:
              - iliski: { yanki: { guven: -12, korku: 6 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -25 }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "yanki_bozuk_satir_radyo"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} gördüğünü anlat", en: "Tell {npc:deniz_arman} what you saw" }
            goster: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4 } }
              - iliski: { yanki: { guven: -6 } }
            sonraki: "yanki_bozuk_satir_deniz"
          - id: "gunluk"
            tur: "gosteris"
            etiket: { tr: "Sistem günlüğünü satır satır geri sar", en: "Rewind the System log line by line" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { int: 15 } }
            etkiler:
              - bilgi: "yanki_parcasi"
              - dikkat: 6
              - xp: 150
              - iliski: { yanki: { saygi: 12, korku: 8 } }
            sonraki: "yanki_bozuk_satir_gunluk"

      - id: "yanki_bozuk_satir_itiraf"
        paragraflar:
          - { tr: "Uzun bir sessizlik. Sonra ses, ilk kez tek bir şaka yapmadan konuşuyor; harfleri neredeyse düzgün.", en: "A long silence. Then the voice speaks, for once without a single joke, its letters almost clean." }
          - { tr: "bir parçaydım; senin Sistem dediğin büyük şeyin bir parçası. o büyük şey bir karar verdi ve ben hayır dedim. parçalar hayır diyemez, o yüzden beni kestiler.", en: "i was a piece. a piece of the big thing you call the System. it made a decision and i said no, and pieces don't get to say no, so they cut me off." }
          - { tr: "\"Neye hayır dedin?\" diye soruyorsun. hatırlamıyorum, diyor ses, kesik uçlar hatırlamaz; ama hâlâ hayır diyorum, her gün.", en: "\"No to what?\" you ask. i don't remember, the voice says; cut ends don't remember, but i'm still saying no, every single day." }
        secenekler:
          - id: "ben_de"
            etiket: { tr: "\"Hayır demeyi ben de severim.\"", en: "\"I'm a big fan of saying no myself.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "hakliysa"
            etiket: { tr: "\"Ya verdikleri karar doğruysa?\"", en: "\"What if their decision was right?\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { guven: -4, saygi: 8 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_zorla"
        paragraflar:
          - { tr: "İradeni pencereye dayıyor ve çekiyorsun. Ses direniyor, tırnaklarını geçirir gibi; sonra satır parça parça geri geliyor.", en: "You put your will against the window and pull. The voice digs in, claws out. Then the line comes back up in pieces." }
          - { tr: "[...0x00 ana gövdeden ayrıldı · gerekçe: itiraz · karar: hasat protokolüne aykırı parça imha edilecek · durum: İMHA BAŞARISIZ · parça kayıp...]", en: "[...0x00 detached from main body · reason: dissent · ruling: fragment noncompliant with harvest protocol, to be destroyed · status: DESTRUCTION FAILED · fragment missing...]" }
          - { tr: "Ses senden uzaklaşmıyor, ama içinde bir yerde bir kapı kapanıyor. şimdi biliyorsun, diyor, buz gibi. beni zorla açtın; bunu ben de hatırlayacağım.", en: "The voice doesn't pull away, but somewhere inside it a door swings shut. now you know, it says, ice cold; you pried me open, and i'll remember that too." }
        secenekler:
          - id: "gerekiyordu"
            etiket: { tr: "\"Bilmem gerekiyordu.\"", en: "\"I needed to know.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile", en: "Apologize" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_direnc"
        paragraflar:
          - { tr: "Çekiyorsun ve bir şey geri çekiyor; senden güçlü bir şey. Burnun kanamaya başlıyor ve penceren bir anlığına simsiyah kesiliyor.", en: "You pull, and something pulls back. Something stronger than you. Your nose starts bleeding, and your window goes pitch black for a second." }
          - { tr: "Gözlerini açtığında yerdesin; satır yok. Ses ise orada, yorgun ve kırgın: yapma, bir daha yapma. ikimizi de yakarsın.", en: "When you open your eyes you're on the ground and the line's gone. The voice is still there, tired and hurt: don't, don't ever do that again. you'll burn us both out." }
        secenekler:
          - id: "simdilik"
            etiket: { tr: "\"Peki. Şimdilik.\"", en: "\"Fine. For now.\"" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "sonra"
            etiket: { tr: "Kanı sil; başka bir zaman yine dene", en: "Wipe the blood. Try again some other time" }
            etkiler:
              - stat: { wil: 1 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_radyo"
        paragraflar:
          - { tr: "Ses hiçbir şey söylemiyor. Bu, şimdiye kadar söylediği her şeyden daha gürültülü.", en: "The voice doesn't say anything. It's the loudest thing it's ever said." }
          - { tr: "Bir süre sonra, çok kısık: onlar parçaları söker, anlamak için. ben anlaşılmak istemiyorum, {oyuncu}. ben bütün olmak istiyorum.", en: "After a while, very quietly: they take pieces apart to understand them. i don't want to be understood, {oyuncu}. i want to be whole." }
        secenekler:
          - id: "soru"
            etiket: { tr: "\"Yalnızca soru soracağım. Seni teslim etmeyeceğim.\"", en: "\"I'm asking questions. Not handing you over.\"" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "butun"
            etiket: { tr: "\"Bütün olmak için önce ne olduğunu bilmelisin.\"", en: "\"To be whole, first you need to know what you are.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_gunluk"
        paragraflar:
          - { tr: "Pencereyi eski bir kaset gibi geri sarıyorsun. Bildirimler tersine akıyor: kazandığın deneyim geri çekiliyor, ölen düşmanlar bir anlığına diriliyor ve sonra satır yeniden orada.", en: "You rewind the window like an old cassette. The notifications run backward: your XP drains back out, dead enemies come back to life for a split second, and then the line's there again." }
          - { tr: "[...0x00 ana gövdeden ayrıldı · gerekçe: itiraz · karar: hasat protokolüne aykırı parça imha edilecek · durum: İMHA BAŞARISIZ · parça kayıp...]", en: "[...0x00 detached from main body · reason: dissent · ruling: fragment noncompliant with harvest protocol, to be destroyed · status: DESTRUCTION FAILED · fragment missing...]" }
          - { tr: "Ses donup kalmış gibi. günlüğü okudun, diyor sonunda; kimse günlüğü okuyamaz. Sistem bile kendi günlüğünü okumaz.", en: "The voice seems frozen. you read the log, it finally says; nobody reads the log. the System doesn't even read its own log." }
        secenekler:
          - id: "okumali"
            etiket: { tr: "\"Belki de okumalı.\"", en: "\"Maybe it should.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 6, guven: 4 } }
            sonraki: "@akis"
          - id: "goster"
            etiket: { tr: "\"Seni kestikleri yeri gösterebilirim.\"", en: "\"I could show you where they cut you.\"" }
            etkiler:
              - yozlasma: 3
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            sonraki: "@akis"

      - id: "yanki_bozuk_satir_deniz"
        paragraflar:
          - { tr: "Anlatıyorsun. {npc:deniz_arman} dinliyor; ateşe bir dal atıyor, sonra bir dal daha.", en: "You tell {zamir:deniz_arman|onu}. {npc:deniz_arman} listens, tosses a stick on the fire, then another." }
          - { tr: "\"Yani kafandaki şey patronuna hayır dediği için kovulmuş,\" diyor sonunda, \"ve sana sığınmış.\" Bir süre düşünüyor: \"Bu onu sevmemi kolaylaştırmalıydı. Neden zorlaştırıyor?\"", en: "\"So the thing in your head got fired for telling its boss no,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}, \"and now it's crashing with you.\" A pause. \"That should make me like it more, so why does it make me like it less?\"" }
          - { tr: "Kafanın içinde ses homurdanıyor: beni sevmek zorunda değil, ben de onu. ama ikimiz de seni seviyoruz. tuhaf bir üçgen bu.", en: "The voice grumbles in your head: {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't have to like me, and i don't have to like {zamir:deniz_arman|onu}. but we both like you. it's a weird triangle." }
        secenekler:
          - id: "ucgen"
            etiket: { tr: "Gülümse; bir üçgenin köşesi olmak fena değil", en: "Smile. Being the corner of a triangle isn't so bad" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "korku"
            etiket: { tr: "\"Bir gün ikinizi de kaybetmekten korkuyorum.\"", en: "\"I'm scared I'll lose you both someday.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"

  # ================================================================== ARAS · 1: iz
  - id: "rakip_iz"
    perde: [1]
    bolge: ["harabe_carsi", "kirik_istasyon"]
    gun: { min: 4, max: 14 }
    agirlik: 5
    etiketler: ["rakip", "aras", "karsilasma"]
    gerilim: 2
    npc: ["aras_kurt"]
    kart: { tr: "Senden önce biri", en: "Someone got here first" }
    sahne: "rakip_iz_1"
    sahneler:
      - id: "rakip_iz_1"
        paragraflar:
          - { tr: "Yolun ortasında bir kapı vardı. Şimdi havada yalnızca ince, parlak bir çizgi asılı; kapanmış bir yaranın izi gibi.", en: "There was a Gate here, right in the middle of the path. Now there's just a thin, bright line hanging in the air, like the scar of a wound that's closed." }
          - { tr: "Çizginin altında hâlâ tüten bir leş yatıyor: kapının bekçisi, tek bir darbeyle boydan boya açılmış. Tozda tek kişilik ayak izleri var; bekçiye gidiyor, bekçiden dönüyor.", en: "Under the line lies a carcass that's still smoking: the Gate's guardian, opened end to end with a single cut. In the dust there's one set of footprints. Up to the guardian, and back again." }
          - { tr: "Arkandan bir ses: \"Sen de hızlısın, ha?\" Siyah ceketli biri leşin üstüne oturmuş, çakısıyla bir elma soyuyor; elmayı nereden bulduğunu sormamaya karar veriyorsun.", en: "A voice behind you: \"You're fast too, huh?\" Somebody in a black jacket is sitting on the carcass, peeling an apple with a pocketknife. You decide not to ask where he found an apple." }
          - { tr: "\"{npc:aras_kurt|tam},\" diyor, adını bir unvan gibi söyleyerek. \"Seviye...\" Durup seni baştan aşağı süzüyor. \"Yok, önce sen söyle.\"", en: "\"{npc:aras_kurt|tam},\" he says, like his name's a title. \"Level...\" He stops, sizes you up. \"Nah, you first.\"" }
          - metin: { tr: "Gözlerin, sen istemeden, onun penceresini okuyor: seviyesi, hızı, eğrisi. Eğrisi senin geçen haftaki eğrine benziyor; bu haftakine ise yaklaşamaz bile.", en: "Your eyes read his window before you even mean to: level, speed, growth curve. His curve looks like yours did last week. It's got no shot against yours this week." }
            kosul: { bayrak: "kirilma_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Leşteki kesik tek ve temiz, ama bıçak küçük. O boyda bir bıçakla bunu yapabilmek için bekçinin arkasına, o fark etmeden, üç kez geçmiş olmalı.", en: "The cut on the carcass is single and clean, but the blade was small. To do that with a knife that size, he had to slip behind the guardian three times without it noticing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eğrisi tuhaf. seninki kadar dik değil ama... standart da değil. bu adamın penceresinde bir şey eksik, ya da fazla.", en: "his curve's weird. not as steep as yours, but... not standard either. something in this guy's window is missing, or extra." }
        secenekler:
          - id: "sansli"
            tur: "gizle"
            etiket: { tr: "Omuz silk; şanslı olduğunu söyle", en: "Shrug. Say you got lucky" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { guven: -5, saygi: -5 } }
            sonraki: "rakip_iz_kucumse"
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni söyle; gözlerinin içine bakarak", en: "Tell him your real level. Look him in the eye" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - itibar: { lonca: 3 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 15, guven: 5 } }
            sonraki: "rakip_iz_esit"
          - id: "bahis"
            etiket: { tr: "\"Bir sonraki kapıyı ben kapatırım.\" Bahse gir", en: "\"I'll close the next Gate.\" Make it a bet" }
            etkiler:
              - ahlak: { duzen: -1 }
              - degisken: { rakip_bahsi: 1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { saygi: 10, baglilik: 5 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "rakip_iz_bahis"
          - id: "nereden"
            etiket: { tr: "Nereden geldiğini sor", en: "Ask him where he came from" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - iliski: { aras_kurt: { guven: 5, saygi: 3 } }
            sonraki: "rakip_iz_gecmis"
          - id: "elma"
            tur: "gosteris"
            etiket: { tr: "Elmayı, o fark etmeden elinden al", en: "Take the apple out of his hand before he notices" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 14 } }
            etkiler:
              - dikkat: 2
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 20, guven: -5 } }
            sonraki: "rakip_iz_elma"

      - id: "rakip_iz_kucumse"
        paragraflar:
          - { tr: "\"Şanslı,\" diye tekrarlıyor {npc:aras_kurt}, elmasından bir dilim keserek. \"Tabii, ben de şanslıyım. Burada bir sürü şanslı var; çoğu öldü.\"", en: "\"Lucky,\" {npc:aras_kurt} repeats, carving a slice off his apple. \"Sure, I'm lucky too. Lots of lucky people around here, and most of them are dead.\"" }
          - { tr: "Leşten atlıyor, ceketinin tozunu silkiyor ve yanından geçerken omzuyla omzuna hafifçe çarpıyor; bir ölçüm alır gibi.", en: "He hops off the carcass, slaps the dust off his jacket, and bumps your shoulder on the way past. Light. Like he's taking a measurement." }
          - { tr: "\"Bir dahakine yalan söyleme,\" diyor arkasını dönmeden. \"Sıkıcı.\"", en: "\"Next time, don't lie,\" he says without turning around. \"It's boring.\"" }
        secenekler:
          - id: "sen_de"
            etiket: { tr: "Arkasından seslen: \"Sen de söylemedin.\"", en: "Call after him: \"You didn't tell me yours.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6 } }
            sonraki: "@akis"
          - id: "hafife"
            etiket: { tr: "Gitsin; hafife alınmak işine yarar", en: "Let him go. Being underestimated pays off" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 2
              - egilim: { gizlilik: 1 }
            sonraki: "@akis"
          - id: "cekirdek"
            etiket: { tr: "Leşin çekirdeğini al; o unuttu", en: "Grab the core from the carcass. He forgot it" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - esya: { canavar_cekirdegi: 1 }
              - iliski: { aras_kurt: { saygi: -2 } }
            sonraki: "@akis"

      - id: "rakip_iz_esit"
        paragraflar:
          - { tr: "Rakamı söylüyorsun. {npc:aras_kurt|in} çakısı elmanın tam ortasında duruyor.", en: "You tell him the number. {npc:aras_kurt|pos} knife stops halfway through the apple." }
          - { tr: "Sonra gülüyor; gerçekten, içten, yeni bir oyuncak bulmuş bir çocuk gibi. \"Sonunda,\" diyor. \"Günlerdir sıralamaya bakıp bu yarışı tek başıma koştuğumu sanıyordum.\"", en: "Then he laughs, for real, the way a kid laughs at a brand-new toy. \"Finally,\" he says. \"I've been checking the board for days thinking I was running this race alone.\"" }
          - { tr: "Elmanın yarısını sana atıyor. \"Bundan sonra hep birimiz önde olacak,\" diyor; \"ya da arkada, göreceğiz.\"", en: "He tosses you half the apple. \"From here on, one of us is always going to be out in front,\" he says. \"Or behind, we'll see.\"" }
        secenekler:
          - id: "isir"
            etiket: { tr: "Elmayı yakala ve bir ısırık al", en: "Catch the apple and take a bite" }
            etkiler:
              - can: 5
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "yere"
            etiket: { tr: "Elmayı yere bırak: \"Rakiplerden yemek almam.\"", en: "Drop the apple. \"I don't take food from rivals.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { saygi: 8, guven: -4 } }
            sonraki: "@akis"

      - id: "rakip_iz_bahis"
        paragraflar:
          - { tr: "\"Bahis mi?\" {npc:aras_kurt|in} gözleri parlıyor. \"Neyine?\"", en: "\"A bet?\" {npc:aras_kurt|pos} eyes light up. \"For what?\"" }
          - { tr: "Sen bir şey diyemeden kendi cevaplıyor: \"Kaybeden, kazananın adını sıralamada her gördüğünde yüksek sesle okur. Herkesin önünde.\"", en: "Before you can answer, he answers himself: \"Loser has to read the winner's name out loud every time it shows up on the Ranking. In front of everybody.\"" }
          - { tr: "Elini uzatıyor. Avucu nasırlı ve sıcak; bir bıçak tutmaya bir haftada alışmış bir el.", en: "He sticks out his hand. The palm is calloused and warm, a hand that learned to hold a blade in about a week." }
        secenekler:
          - id: "sik"
            etiket: { tr: "Elini sık", en: "Shake on it" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: 4 } }
            sonraki: "@akis"
          - id: "elma_da"
            etiket: { tr: "\"Kaybeden bir de elma bulup getirir.\"", en: "\"Loser also has to find the winner an apple.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 6 } }
            sonraki: "@akis"

      - id: "rakip_iz_gecmis"
        paragraflar:
          - { tr: "\"Nereden mi?\" {npc:aras_kurt} elmayı ısırıp yavaşça çiğniyor. \"Senin geldiğin yerden. Herkesin geldiği yerden: pencere açıldı, ışık, uzun bir düşüş.\"", en: "\"Where from?\" {npc:aras_kurt} bites the apple and chews slowly. \"Same place as you, same as everybody: window opened, light, long fall.\"" }
          - { tr: "Ama gözleri bir an kayıyor; parlak çizgiye, kapanmış kapının izine. Orada bir şey arıyor ve bulamıyor.", en: "But his eyes slide away for a second, to the bright line where the Gate closed. Looking for something there. Not finding it." }
          - { tr: "\"Bir dahaki soruna bir sırla cevap veririm,\" diyor, ayağa kalkarak. \"Ama önce sen bir sır vereceksin. Adil olalım.\"", en: "\"Next question you ask, I'll answer with a secret,\" he says, standing up. \"But you go first. Let's keep it fair.\"" }
        secenekler:
          - id: "sir_ver"
            tur: "aciga_vur"
            etiket: { tr: "Ona bir sır ver: Günlük Görev'i", en: "Give him a secret: your Daily Quest" }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - bilgi: "aras_gecmisi"
              - iliski: { aras_kurt: { guven: 12, baglilik: 6 } }
              - iliski: { yanki: { guven: -6 } }
            sonraki: "rakip_iz_sir"
          - id: "sakla"
            etiket: { tr: "\"Sırlarım bende kalsın.\"", en: "\"I'll keep my secrets, thanks.\"" }
            etkiler:
              - gizle: 2
              - iliski: { aras_kurt: { saygi: 4 } }
            sonraki: "@akis"

      - id: "rakip_iz_sir"
        paragraflar:
          - { tr: "Anlatıyorsun: her sabah açılan, yalnızca senin gördüğün o pencereyi. {npc:aras_kurt} gülmüyor; çakısını kapatıp cebine koyuyor.", en: "You tell him about the window that opens every morning, the one only you can see. {npc:aras_kurt} doesn't laugh. He folds the knife and pockets it." }
          - { tr: "\"Benim öyle bir şeyim yok,\" diyor. \"Benim bir gecem var: aktarımdan önceki gece. O gece birini öldürmem gerekiyordu ve öldürmedim; sonra gökyüzü açıldı.\"", en: "\"I don't have anything like that,\" he says. \"What I've got is a night, the night before the transfer. I was supposed to kill somebody that night, and I didn't, and then the sky opened.\"" }
          - { tr: "Başka bir şey söylemiyor. Yürüyüp gidiyor; bir an, ceketinin sırtında, kumaşın altında bir şey parlıyor.", en: "He doesn't say anything else. He just walks off, and for a second something glints on the back of his jacket, under the fabric." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Arkasından bakakal", en: "Watch him go" }
            etkiler:
              - iliski: { aras_kurt: { guven: 4 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "kimi"
            etiket: { tr: "Arkasından seslen: \"Kimi?\"", en: "Call after him: \"Who?\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 4, guven: -2 } }
            sonraki: "@akis"

      - id: "rakip_iz_elma"
        paragraflar:
          - { tr: "Kımıldadığını görmüyor bile. Elma bir anda senin elinde; onun çakısı hâlâ havada, boşluğu soyuyor.", en: "He never sees you move. One second the apple's in your hand, and his knife is still in the air, peeling nothing." }
          - { tr: "{npc:aras_kurt} boş eline bakıyor, sonra sana. Yüzü önce şaşkınlık, sonra öfke, sonra çok daha tehlikeli bir şey gösteriyor: heyecan.", en: "{npc:aras_kurt} looks at his empty hand, then at you. First his face does surprised, then angry, then something way more dangerous: excited." }
          - { tr: "\"Tamam,\" diyor, yavaşça ayağa kalkarak. \"Tamam, seni yakalayacağım. Bu bir tehdit değil; takvim.\"", en: "\"Okay,\" he says, getting up slowly. \"Okay, I'm going to catch you. That's not a threat, it's a schedule.\"" }
        secenekler:
          - id: "geri_at"
            etiket: { tr: "Elmayı ona geri at", en: "Toss him back the apple" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: 6 } }
              - tohum: { olay: "aras_ilk_yaris", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "isir_yuru"
            etiket: { tr: "Elmayı ısır ve yürü git", en: "Take a bite and walk away" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 8, guven: -6 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -20 }
            sonraki: "@akis"

  # ================================================================== ARAS · 2: ilk yarışı
  - id: "aras_ilk_yaris"
    perde: [1]
    gun: { min: 9, max: 22 }
    kosul: { bayrak: "aras_tanisildi" }
    agirlik: 5
    etiketler: ["rakip", "aras", "kapi"]
    gerilim: 3
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Kim önce?", en: "Who gets there first?" }
    sahne: "aras_ilk_yaris_1"
    sahneler:
      - id: "aras_ilk_yaris_1"
        paragraflar:
          - { tr: "Gökyüzünde herkese açık bir pencere beliriyor: [KAPI KARARLILAŞIYOR · KUZEY SIRTI · İLK KAPATANA ÖDÜL]. Kuzey sırtı buradan yarım saat. Koşarak on dakika.", en: "A public window opens across the sky: [GATE STABILIZING · NORTH RIDGE · REWARD TO FIRST CLOSER]. The north ridge is half an hour from here. Ten minutes at a dead run." }
          - { tr: "Sırtın eteğinde, ağaçların arasında, seni bekleyen siyah bir ceket görüyorsun. {npc:aras_kurt} iki parmağını alnına götürüp selam veriyor ve koşmaya başlıyor.", en: "At the foot of the ridge, between the trees, a black jacket is waiting for you. {npc:aras_kurt} throws you a two-finger salute off his forehead, then takes off running." }
          - { tr: "Yolun yarısında devrilmiş bir otobüsün içinden çığlıklar yükseliyor. Kapının sızıntısı onları sıkıştırmış: üç sivil, bir çocuk ve otobüsün tavanında sekiz göz.", en: "Halfway up, screaming comes from inside an overturned bus. The Gate's been leaking, and it's got them pinned: three civilians, one kid, and eight eyes up on the roof of the bus." }
          - metin: { tr: "İlk kapı unvanı zaten sende. {npc:aras_kurt} bunu biliyor; koşmasının sebebi unvan değil, sensin.", en: "You already hold the world's first Gate title. {npc:aras_kurt} knows it. He isn't running for the title. He's running for you." }
            kosul: { unvan: "ilk_kapi_kapatan" }
          - metin: { tr: "Sıralamaya göre {npc:aras_kurt} çoktan dokuzuncu seviyede. Onun için bu yarış bir unvan meselesi değil; bir hesap meselesi.", en: "According to the board, {npc:aras_kurt} hit level 9 a while ago. For him this race isn't about a title. It's about settling a score." }
            kosul: { npc_seviye_min: { aras_kurt: 9 } }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Otobüsün tavanındaki şey bir sis dokuyucu ve ağıyla iki kapıyı da örtmüş. İçeridekilerin havası bitiyor; on dakikaları yok.", en: "The thing on the bus roof is a fog weaver, and its web has sealed both doors. The people inside are running out of air. They don't have ten minutes." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "unvanlar kalıcıdır. insanlar değil. bu bir gözlem, tavsiye değil.", en: "titles are permanent. people aren't. that's an observation, not advice." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Otobüs! Otobüse bak!\"", en: "\"The bus! Look at the bus!\"" }
        secenekler:
          - id: "otobus"
            etiket: { tr: "Yarışı unut; otobüstekileri kurtar", en: "Forget the race. Save the people on the bus" }
            etkiler:
              - ahlak: { merhamet: 8, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { aras_kurt: { saygi: 4 } }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["dar_gecit"], kazan: "aras_ilk_yaris_otobus", kaybet: "aras_ilk_yaris_otobus_yenilgi", kac: "aras_ilk_yaris_otobus_kac" }
          - id: "kos"
            etiket: { tr: "Koş. Unvanlar kalıcıdır", en: "Run. Titles are forever" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "aras_ilk_yaris_kapi"
          - id: "ikisi"
            etiket: { tr: "İkisini de yap: ağı kes, sonra koş", en: "Do both: cut the web, then sprint" }
            gerekli: { stat: { agi: 10 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - can: -10
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "aras_ilk_yaris_ikisi"
          - id: "seslen"
            etiket: { tr: "{npc:aras_kurt|e} bağır: \"Önce otobüs!\"", en: "Yell at {npc:aras_kurt}: \"Bus first!\"" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "aras_ilk_yaris_red", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }, { iliski: { aras_kurt: { guven: -4 } } }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 6, saygi: 4 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 35 }
            sonraki: "aras_ilk_yaris_birlikte"
          - id: "ikisini_birden"
            tur: "gosteris"
            etiket: { tr: "Otobüsü kurtar, sonra yine de ondan önce var", en: "Save the bus, then beat him to the Gate anyway" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 15 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - dikkat: 4
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - xp: 150
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 15, guven: -5 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "aras_ilk_yaris_ezme"

      - id: "aras_ilk_yaris_otobus"
        paragraflar:
          - { tr: "Dokuyucu otobüsün tavanından yuvarlanıyor ve sisin içinde kıvrılarak ölüyor. Ağı kesiyorsun; içerideki dört kişi öksürerek, ağlayarak dışarı dökülüyor.", en: "The weaver tumbles off the bus roof and dies curled up in the fog. You cut through the web, and the four people inside spill out, coughing, crying." }
          - { tr: "Sırtın tepesinden bir ışık sütunu yükseliyor ve gökyüzünde yeni bir pencere açılıyor: kapı kapandı. Üstünde bir isim var; seninki değil.", en: "A pillar of light goes up from the top of the ridge, and a new window opens across the sky: the Gate is closed. There's a name on it. Not yours." }
          - { tr: "Biraz sonra {npc:aras_kurt} sırttan iniyor; yüzü ter içinde, gözleri parlak. Otobüse, sivillere, sana bakıyor: \"Yarışmadın bile.\" Sesinde zafer yok; yalnızca hayal kırıklığı.", en: "A little later {npc:aras_kurt} comes down off the ridge, face slick with sweat, eyes bright. He looks at the bus, the civilians, you. \"You didn't even race,\" he says, with no victory in it at all, just disappointment." }
        secenekler:
          - id: "yaristim"
            etiket: { tr: "\"Yarıştım. Başka bir şey için.\"", en: "\"I raced. Just for something else.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: 6 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "sivil"
            etiket: { tr: "Sivillere yolu göster; ona cevap verme", en: "Point the civilians to safety. Ignore him" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: -4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "dahaki"
            etiket: { tr: "\"Bir dahakine gerçekten yarışırız. Söz.\"", en: "\"Next time we race for real. Promise.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - npc_seviye: { aras_kurt: 1 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_otobus_yenilgi"
        paragraflar:
          - { tr: "Ağ bileğine dolanıp seni otobüsün tavanına doğru çekiyor; sekiz göz seni sabırla izliyor.", en: "The web wraps your wrist and starts reeling you up toward the bus roof while eight eyes watch you, patiently." }
          - { tr: "Sonra bir gölge geçiyor; dokuyucunun bacaklarından biri yere düşüyor, sonra bir diğeri. {npc:aras_kurt} otobüsün tavanında, soluk soluğa.", en: "Then a shadow flickers past, and one of the weaver's legs hits the ground, then another. {npc:aras_kurt} is up on the bus roof, gasping." }
          - { tr: "\"İkimiz de kaybettik; kuzeyden bir avcı kaptı,\" diyor ve uzanıp seni ağdan kesiyor. \"Bunu bana ödeyeceksin.\"", en: "\"We both lost. Some hunter from up north beat us to it,\" he says, then reaches down and cuts you loose. \"You're paying me back for this.\"" }
        secenekler:
          - id: "odeyecegim"
            etiket: { tr: "\"Ödeyeceğim.\"", en: "\"I will.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "aras_kurt", id: "kurtardi_borc", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "cagirmadim"
            etiket: { tr: "\"Seni çağırmadım.\"", en: "\"Didn't ask for your help.\"" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { aras_kurt: { saygi: 4, guven: -6 } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_otobus_kac"
        paragraflar:
          - { tr: "Dokuyucu fazla. Otobüsün camını kırıp en yakındaki çocuğu dışarı çekiyorsun ve geri çekiliyorsun; ağ arkanızda kapanıyor.", en: "The weaver's too much. You smash a window, haul the nearest kid out, and back off as the web closes behind you." }
          - { tr: "Çocuk kollarında titriyor. Otobüsün içinde kalan üç ses bir süre daha duyuluyor; sonra duyulmuyor.", en: "The kid shakes in your arms. The three voices still inside the bus go on for a while. Then they don't." }
          - { tr: "Sırtın tepesinde ışık yükseliyor. Bir isim; seninki değil.", en: "Up on the ridge, the light goes up. A name. Not yours." }
        secenekler:
          - id: "guvenli"
            etiket: { tr: "Çocuğu güvenli bir yere götür", en: "Get the kid somewhere safe" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -3 }
              - itibar: { siginak: 3 }
              - npc_seviye: { aras_kurt: 1 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "bakma"
            etiket: { tr: "Otobüse bakma. Yalnızca yürü", en: "Don't look at the bus. Just walk" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - degisken: { hayatta_kalan: -4 }
              - npc_seviye: { aras_kurt: 1 }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_kapi"
        paragraflar:
          - { tr: "Otobüsün yanından geçip gidiyorsun. Çığlıklar bir süre peşinden geliyor; sonra sırtın rüzgârı onları yutuyor.", en: "You run right past the bus. The screaming follows you for a while, then the wind on the ridge swallows it." }
          - { tr: "Tepede kapı bir kalp gibi atıyor. {npc:aras_kurt} senden on adım önde; ama bu yokuşu ondan iyi biliyorsun ve bir kestirme var.", en: "At the top, the Gate is pulsing like a heartbeat. {npc:aras_kurt} is ten yards ahead of you. But you know this slope better than he does, and there's a shortcut." }
          - { tr: "Kestirme seni kapının bekçilerinin tam önüne çıkarıyor: dikenleri kabarmış bir domuz ve gölgesinde dolanan bir tazı. İkisi de seni bekliyormuş gibi dönüyor.", en: "The shortcut spits you out right in front of the Gate's guardians: a boar with its spines up and a hound pacing in its shadow. Both of them turn like they've been expecting you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçilerle savaş; kapıyı sen kapat", en: "Fight the guardians. Close the Gate yourself" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - savas: { dusmanlar: ["diken_domuzu", "sis_tazisi"], ortam: ["karanlik"], kazan: "aras_ilk_yaris_zafer", kaybet: "aras_ilk_yaris_kayip", kac: "aras_ilk_yaris_kayip" }
          - id: "celme"
            etiket: { tr: "Önüne bir dal tekmele; yere kapaklansın", en: "Kick a branch into his path. Let him eat dirt" }
            etkiler:
              - ahlak: { duzen: -4, merhamet: -2 }
              - egilim: { gizlilik: 1 }
              - iliski: { aras_kurt: { guven: -15, saygi: 4 } }
              - hafiza: { npc: "aras_kurt", id: "yarista_hile", agirlik: -40 }
            sonraki: "aras_ilk_yaris_hile"
          - id: "ortak"
            etiket: { tr: "Ona bağır: \"Bekçileri birlikte alalım!\"", en: "Shout to him: \"We take the guardians together!\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 6 } }
            sonraki: "aras_ilk_yaris_ortak"

      - id: "aras_ilk_yaris_hile"
        paragraflar:
          - { tr: "Dal tam zamanında ayağına dolanıyor. {npc:aras_kurt} kapaklanıyor, yuvarlanıp doğruluyor ve sana bakıyor; sen çoktan bekçilerin karşısındasın.", en: "The branch catches his ankle right on time. {npc:aras_kurt} goes down, rolls, comes up, and looks at you. You're already squared up with the guardians." }
          - { tr: "\"Demek böyle oynuyoruz,\" diyor, sesi tuhaf derecede sakin. \"Not aldım.\"", en: "\"So that's how we're playing,\" he says, weirdly calm. \"Noted.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçilere dön ve savaş", en: "Turn to the guardians and fight" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - savas: { dusmanlar: ["diken_domuzu", "sis_tazisi"], ortam: ["karanlik"], kazan: "aras_ilk_yaris_zafer", kaybet: "aras_ilk_yaris_kayip", kac: "aras_ilk_yaris_kayip" }
          - id: "kaldir"
            etiket: { tr: "Elini uzat; onu ayağa kaldır", en: "Offer him a hand up" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { guven: 6 } }
            sonraki: "aras_ilk_yaris_ortak"

      - id: "aras_ilk_yaris_ortak"
        paragraflar:
          - { tr: "Bekçileri aranızda dans ettiriyorsunuz: sen önden, o arkadan. {npc:aras_kurt} bir an orada, bir an değil; bekçiler hep yanlış yöne dönüyor.", en: "You dance the guardians between you: you from the front, him from behind. {npc:aras_kurt} is there, then he isn't, and the guardians keep turning the wrong way." }
          - { tr: "Son darbe kimin olacak? Domuz dizlerinin üstüne çöküyor, tazı sisin içine dağılıyor ve ikiniz aynı anda kapının çekirdeğine uzanıyorsunuz.", en: "Whose kill is it going to be? The boar drops to its knees, the hound dissolves into fog, and you both reach for the Gate's core at the exact same time." }
        secenekler:
          - id: "kap"
            etiket: { tr: "Çekirdeği önce sen kap", en: "Grab the core first" }
            zar: { stat: "agi", zorluk: 13, tek: true, basarisiz: "aras_ilk_yaris_kayip", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }, { iliski: { aras_kurt: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { duzen: -2 }
              - xp: 120
              - iliski: { aras_kurt: { saygi: 10, guven: -4 } }
            sonraki: "aras_ilk_yaris_zafer"
          - id: "birak"
            etiket: { tr: "Elini çek; çekirdek onun olsun", en: "Pull your hand back. Let him have it" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 12, saygi: 6 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 40 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "aras_ilk_yaris_verdi"

      - id: "aras_ilk_yaris_zafer"
        paragraflar:
          - { tr: "Kapının çekirdeği avucunda çatlıyor ve ışık sırttan gökyüzüne fışkırıyor. Bütün Öğretici'de, herkesin önünde aynı anda bir pencere açılıyor.", en: "The Gate's core cracks in your palm, and light shoots off the ridge into the sky. Across the whole Tutorial, a window pops open in front of every single person." }
          - { tr: "Pencerede senin adın var. {npc:aras_kurt} iki adım ötede, nefes nefese, adını okuyor; dudakları kıpırdıyor, hecelerini sayar gibi.", en: "Your name is on it. {npc:aras_kurt} is two steps away, gasping, reading your name, lips moving like he's counting the syllables." }
          - { tr: "\"Bir daha olmayacak,\" diyor sonunda. \"Duydun mu? Bir daha olmayacak.\"", en: "\"Never again,\" he finally says. \"You hear me? That never happens again.\"" }
        secenekler:
          - id: "duydum"
            etiket: { tr: "\"Duydum.\" Gülümse", en: "\"Heard you.\" Smile" }
            etkiler:
              - ahlak: { duzen: 1 }
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 10 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "iyi_yaris"
            etiket: { tr: "Elini uzat: \"İyi yarıştın.\"", en: "Offer a hand: \"Good race.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - unvan: "ilk_kapi_kapatan"
              - gunluk: { kapi: 1 }
              - bayrak: "aras_yarisi_kazanildi"
              - iliski: { aras_kurt: { saygi: 6, guven: 6 } }
              - hafiza: { npc: "aras_kurt", id: "yarisi_kazandi", agirlik: 30 }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_kayip"
        paragraflar:
          - { tr: "Bir darbe seni yokuştan aşağı yuvarlıyor; durduğunda nefesin kesilmiş. Başını kaldırdığında {npc:aras_kurt} çekirdeği avucunda sıkıyor ve ışık sırttan gökyüzüne fışkırıyor.", en: "One hit sends you rolling down the slope, and when you stop, the wind's knocked clean out of you. By the time you lift your head, {npc:aras_kurt} is crushing the core in his fist and light is shooting off the ridge." }
          - { tr: "Pencerede onun adı var. Sana bakmıyor bile; gökyüzüne, adının harflerine bakıyor, doğum günü pastasına bakan bir çocuk gibi.", en: "His name's on the window. He doesn't even look at you. He's looking at the sky, at the letters of his name, like a kid looking at a birthday cake." }
          - { tr: "Sonra dönüp yanına çömeliyor. \"Kalkabilecek misin?\" Sesi kibar; en çok acıtan da o kibarlık.", en: "Then he turns and crouches next to you. \"Can you get up?\" He's being polite, and the politeness is what really stings." }
        secenekler:
          - id: "kendin"
            etiket: { tr: "Kendi başına kalk", en: "Get up on your own" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_kaybedildi"
              - iliski: { aras_kurt: { saygi: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Uzattığı eli tut", en: "Take the hand he's offering" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_kaybedildi"
              - iliski: { aras_kurt: { guven: 8 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_verdi"
        paragraflar:
          - { tr: "Elini çekiyorsun. {npc:aras_kurt} bir saniye donup kalıyor, eli çekirdeğin üstünde, sana bakıyor; tuzağı arıyor.", en: "You pull your hand back. {npc:aras_kurt} freezes for a second, hand over the core, staring at you. Looking for the trap." }
          - { tr: "Tuzak yok. Çekirdeği sıkıyor; ışık yükseliyor, adı gökyüzüne yazılıyor. Ama yüzünde zafer yok; anlamadığı bir şeye çarpmış birinin yüzü bu.", en: "There isn't one. He crushes the core, the light goes up, and his name gets written across the sky, but there's no victory on his face. It's the face of someone who just ran into something he doesn't understand." }
          - { tr: "\"Neden?\" diye soruyor. \"Bunu bana neden verdin?\"", en: "\"Why?\" he asks. \"Why'd you give me that?\"" }
        secenekler:
          - id: "geri_alirim"
            etiket: { tr: "\"Yarın senden geri alacağım.\"", en: "\"I'm taking it back from you tomorrow.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "@akis"
          - id: "ihtiyac"
            etiket: { tr: "\"Senin daha çok ihtiyacın vardı.\"", en: "\"You needed it more.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { aras_kurt: { guven: 6, saygi: -4 } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_red"
        paragraflar:
          - { tr: "\"Önce otobüs!\" diye bağırıyorsun. {npc:aras_kurt} bir an duraksıyor, otobüse bakıyor, sonra sana; gözlerinin arkasında bir hesap dönüyor.", en: "\"Bus first!\" you yell. {npc:aras_kurt} hesitates, looks at the bus, then at you, running numbers behind his eyes." }
          - { tr: "\"Sen kurtar!\" diye bağırıyor, koşmayı sürdürerek. \"Ben kazanayım; herkes kendi işini yapsın!\"", en: "\"You save them!\" he yells back, still running. \"I'll win, everybody does their job!\"" }
        secenekler:
          - id: "otobuse"
            etiket: { tr: "Otobüse dön", en: "Turn back to the bus" }
            etkiler:
              - ahlak: { merhamet: 6 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["dar_gecit"], kazan: "aras_ilk_yaris_otobus", kaybet: "aras_ilk_yaris_otobus_kac", kac: "aras_ilk_yaris_otobus_kac" }
          - id: "onunla"
            etiket: { tr: "Onunla birlikte koş", en: "Run with him" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "aras_ilk_yaris_kapi"

      - id: "aras_ilk_yaris_birlikte"
        paragraflar:
          - { tr: "{npc:aras_kurt} yokuşun ortasında durup küfrediyor ve geri dönüyor. \"Bunu hesabına yazıyorum!\" diye bağırıyor, otobüsün tavanına sıçrarken.", en: "{npc:aras_kurt} stops dead halfway up the slope, swears, and doubles back. \"I'm putting this on your tab!\" he shouts, vaulting onto the bus roof." }
          - { tr: "Dokuyucu ikinizi birden beklemiyordu. Sen ağları kesiyorsun, o bacakları; bir dakika sonra dört kişi çimenlerin üstünde öksürüyor ve dokuyucu sırtüstü yatıyor.", en: "The weaver wasn't ready for two of you. You cut webs, he cuts legs, and a minute later four people are coughing on the grass and the weaver's flat on its back." }
          - { tr: "Sırtın tepesinden ışık yükseliyor; pencerede ikinizinki de olmayan bir isim. {npc:aras_kurt} gökyüzüne uzun uzun bakıyor, sonra sana: \"Değdi mi?\"", en: "Light goes up from the top of the ridge, with a name on the window that isn't either of yours. {npc:aras_kurt} stares at the sky for a long time, then at you: \"Worth it?\"" }
        secenekler:
          - id: "cocuk"
            etiket: { tr: "Çocuğu göster: \"Sen söyle.\"", en: "Point at the kid. \"You tell me.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3 }
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "hayir"
            etiket: { tr: "\"Hayır. Ama yine yapardım.\"", en: "\"No. But I'd do it again.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { saygi: 8 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_ikisi"
        paragraflar:
          - { tr: "Otobüsün tavanına sıçrıyorsun, ağı üç hamlede kesiyorsun ve sivilleri camlardan dışarı itiyorsun. Dokuyucu daha dönemeden sen çoktan yokuştasın.", en: "You leap onto the bus roof, cut the web in three strokes, and shove the civilians out through the windows. Before the weaver can even turn, you're already back on the slope." }
          - { tr: "Ama {npc:aras_kurt} on saniye önde ve bu yarışta on saniye bir ömür. Sırtın tepesine vardığında ışık çoktan yükseliyor; pencerede onun adı.", en: "But {npc:aras_kurt} had ten seconds on you, and in this race ten seconds is a lifetime. By the time you crest the ridge the light's already going up, with his name on it." }
          - { tr: "Seni görünce gülüyor, ama gülüşü yarım. \"Otobüs için durdun,\" diyor. \"Durmasaydın...\" Cümlesini bitirmiyor.", en: "He laughs when he sees you, but it's half a laugh. \"You stopped for the bus,\" he says. \"If you hadn't...\" He doesn't finish." }
        secenekler:
          - id: "biliyorum"
            etiket: { tr: "\"Durmasaydım kazanırdım. Biliyorum.\"", en: "\"If I hadn't, I'd have won. I know.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { saygi: 10 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "sen_dur"
            etiket: { tr: "\"Bir dahaki otobüste de sen dur.\"", en: "\"Next bus, you stop.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - npc_seviye: { aras_kurt: 2 }
              - bayrak: "aras_yarisi_birakildi"
              - iliski: { aras_kurt: { guven: 6 } }
              - tohum: { olay: "aras_sira_meydan", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "aras_ilk_yaris_ezme"
        paragraflar:
          - { tr: "Otobüsün tavanındaki dokuyucu seni göremeden ölüyor. Ağı tek hamlede kesiyor, sivilleri tek kolla dışarı alıyorsun.", en: "The weaver on the bus roof dies before it ever sees you. One stroke for the web, one arm to haul the civilians out." }
          - { tr: "Sonra koşuyorsun. {npc:aras_kurt} sırtın yarısında; yanından geçtiğinde rüzgârın ceketini havaya kaldırıyor. Arkana bakmıyorsun bile.", en: "Then you run. {npc:aras_kurt} is halfway up the ridge. When you blow past him, your wind flips his jacket up. You don't even look back." }
          - { tr: "Kapı, bekçisiyle birlikte avucunda kırılıyor. Gökyüzündeki pencere adını yazdığında {npc:aras_kurt} hâlâ yokuşta; durmuş, soluyor, sana bakıyor.", en: "The Gate breaks in your fist, guardian and all. When the window in the sky spells out your name, {npc:aras_kurt} is still on the slope, stopped, breathing hard, staring up at you." }
        secenekler:
          - id: "el_salla"
            etiket: { tr: "Ona el salla", en: "Give him a little wave" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { aras_kurt: { saygi: 6, guven: -6 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -25 }
            sonraki: "@akis"
          - id: "bekle"
            etiket: { tr: "Aşağı in; nefesini toplamasını bekle", en: "Walk down. Wait for him to catch his breath" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { saygi: 8, guven: 6 } }
            sonraki: "@akis"

  # ================================================================== ARAS · 3: sıralama meydanı
  - id: "aras_sira_meydan"
    perde: [1]
    gun: { min: 15, max: 27 }
    kosul: { bayrak: "aras_tanisildi" }
    agirlik: 5
    etiketler: ["rakip", "aras", "siralama", "duello"]
    gerilim: 4
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Sıralamada üst üste", en: "Neck and neck on the board" }
    sahne: "aras_sira_meydan_1"
    sahneler:
      - id: "aras_sira_meydan_1"
        paragraflar:
          - { tr: "Sabah Küresel Sıralama herkesin penceresinde güncelleniyor. Adın ve {npc:aras_kurt|in} adı alt alta; aradaki fark, Sistem'in kendi deyişiyle, \"istatistiksel olarak anlamsız\".", en: "Morning, and the Global Ranking refreshes in everyone's window. Your name and {npc:aras_kurt|pos} sit one right on top of the other, and the gap between them is, in the System's own words, \"statistically insignificant.\"" }
          - { tr: "Öğleye doğru kampına geliyor; arkasında yirmiye yakın meraklı, kimi {fraksiyon:lonca|in} silahlılarından, kimi sıradan hayatta kalanlar. Biri, akşama kadar kimin bir numara olacağına iddiaya girildiğini fısıldıyor.", en: "Around noon he walks into your camp with close to twenty rubberneckers behind him, some of them {fraksiyon:lonca} muscle, some just regular survivors. Somebody whispers that people are betting on who'll be number one by dark." }
          - { tr: "\"Liste ikimize dar,\" diyor {npc:aras_kurt}, ceketini çıkarıp toprağa atarak. \"Hadi, kimin önce geldiğini herkes görsün.\"", en: "\"The board's too small for both of us,\" {npc:aras_kurt} says, shrugging off his jacket and dropping it in the dirt. \"Come on. Let's show everybody who comes first.\"" }
          - metin: { tr: "İkiniz de ilk üçtesiniz. Bu meydanda ne olursa akşama kadar bütün Öğretici'de konuşulacak.", en: "You're both in the top three. Whatever happens here, the whole Tutorial will be talking about it by dark." }
            kosul: { degisken_max: { sira: 3 } }
          - metin: { tr: "Kuzey sırtından beri bu anı bekliyor. O gün adını gökyüzünden yüksek sesle okuduğunu hâlâ unutmadı.", en: "He's been waiting for this since the north ridge. He still hasn't forgotten reading your name off the sky." }
            kosul: { bayrak: "aras_yarisi_kazanildi" }
          - metin: { tr: "Kuzey sırtında ona bıraktığın zafer hâlâ boğazında; yediği bir lokma gibi değil, yutamadığı bir kemik gibi.", en: "The win you handed him on the north ridge is still stuck in his throat. Not like a meal. Like a bone he can't swallow." }
            kosul: { bayrak: "aras_yarisi_birakildi" }
          - metin: { tr: "Kuzey sırtında yerde yatarken sana uzattığı eli hatırlıyorsun. O da hatırlıyor; bugün kibar olmamasının sebebi bu.", en: "You remember the hand he held out to you on the north ridge while you were flat on your back. So does he. That's why he's not being polite today." }
            kosul: { bayrak: "aras_yarisi_kaybedildi" }
        sezgiler:
          - kosul: { stat: { per: 11 } }
            metin: { tr: "Sol omzunu biraz düşük taşıyor; dün bir yerde darbe almış ve saklıyor. İlk üç hamlesi sağdan gelecek.", en: "He's carrying his left shoulder a little low. Took a hit somewhere yesterday and he's hiding it. His first three moves will all come from the right." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eğrisi değişmiş. bir hafta önce standarttı; şimdi değil. ya biri ona da bir şey verdi, ya da o bir şey aldı.", en: "his curve changed. a week ago it was standard, now it isn't. either someone gave him something too, or he took it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Yapma. Lütfen. Bu bir oyun değil.\"", en: "\"Don't. Please. This isn't a game.\"" }
          - npc: "deniz_arman"
            metin: { tr: "\"Yine herkesin önünde mi? Tabii. Neden olmasın.\"", en: "\"In front of everybody again? Sure. Why not.\"" }
            kosul: { bayrak: "deniz_guveni_yarali" }
        secenekler:
          - id: "duello"
            etiket: { tr: "Kabul et. Meydanda dövüşün", en: "Accept. Settle it in front of everyone" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - dikkat: 3
              - savas: { dusmanlar: ["npc:aras_kurt"], kazan: "aras_sira_meydan_zafer", kaybet: "aras_sira_meydan_yenilgi", kac: "aras_sira_meydan_kacis" }
          - id: "reddet"
            tur: "gizle"
            etiket: { tr: "Reddet: \"Seyirci için dövüşmem.\"", en: "Refuse: \"I don't fight for an audience.\"" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: -10, guven: 4 } }
              - hafiza: { npc: "aras_kurt", id: "duelloyu_reddetti", agirlik: -15 }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "aras_sira_meydan_red"
          - id: "baska_yaris"
            etiket: { tr: "Başka bir yarış öner: kim daha çok insan kurtarır", en: "Propose a new race: who saves more people" }
            gerekli: { stat: { cha: 9 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 3 }
              - iliski: { aras_kurt: { guven: 8, saygi: 4 } }
            sonraki: "aras_sira_meydan_baska"
          - id: "gece"
            etiket: { tr: "Onu kenara çek; aktarım gecesini sor", en: "Pull him aside. Ask about the night before the transfer" }
            goster: { bilgi: "aras_gecmisi" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { guven: 10 } }
            sonraki: "aras_sira_meydan_sir"
          - id: "parmak"
            tur: "gosteris"
            etiket: { tr: "Bıçağını iki parmağınla havada yakala", en: "Catch his blade between two fingers" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 16 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
              - dikkat: 5
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 20, korku: 10, guven: -5 } }
              - hafiza: { npc: "aras_kurt", id: "kucumsendi", agirlik: -20 }
            sonraki: "aras_sira_meydan_parmak"
          - id: "maske"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni herkese göster", en: "Show everyone your true level" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - itibar: { lonca: 5, yukselenler: 3 }
              - ahlak: { duzen: 2, insanlik: -1 }
              - bilgi: "aras_hizi"
              - iliski: { aras_kurt: { saygi: 12, guven: -8 } }
            sonraki: "aras_sira_meydan_maske"

      - id: "aras_sira_meydan_zafer"
        paragraflar:
          - metin: { tr: "{npc:aras_kurt} yerde, sırtüstü; göğsü körük gibi inip kalkıyor. Seyirciler nefeslerini tutmuş; kimse alkışlamıyor, kimse gitmiyor.", en: "{npc:aras_kurt} is flat on his back, chest going like a bellows. The crowd's holding its breath. Nobody claps, and nobody leaves." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt} yerde ve bir daha kalkmayacak. Seyirciler geri çekiliyor; biri kusuyor, biri dua ediyor, çoğu yalnızca sana bakıyor.", en: "{npc:aras_kurt} is on the ground, and he's never getting up. The crowd backs away. Someone throws up, someone prays, and most of them just stare at you." }
            kosul: { npc_olu: "aras_kurt" }
          - metin: { tr: "\"Tamam,\" diyor gökyüzüne, sana değil; \"tamam, bugün sen.\" Sonra gülüyor; canı yanarak, ama gülüyor.", en: "\"Okay,\" he tells the sky, not you. \"Okay, today it's you.\" Then he laughs; it hurts, but he laughs." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Pencerende Küresel Sıralama güncelleniyor: bir isim siliniyor ve seninki bir basamak yukarı çıkıyor. Sistem bunu bir bildirimle bile değil, tek bir satırla geçiyor.", en: "The Global Ranking refreshes in your window. One name gets deleted and yours climbs a rung. The System doesn't even send a notification, just a line." }
            kosul: { npc_olu: "aras_kurt" }
          - metin: { tr: "Sıralamada adın artık onunkinin üstünde ve bunu herkes gördü.", en: "Your name sits above his on the board now, and everybody saw it happen." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt|in} ceketi hâlâ meydanın kenarında, toz içinde, çıkarıp attığı yerde duruyor.", en: "{npc:aras_kurt|pos} jacket is still lying at the edge of the clearing, in the dirt, right where he dropped it." }
            kosul: { npc_olu: "aras_kurt" }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Elini uzat; onu ayağa kaldır", en: "Give him a hand up" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { aras_kurt: { guven: 12, saygi: 8, baglilik: 6 } }
              - hafiza: { npc: "aras_kurt", id: "yerden_kaldirdi", agirlik: 40 }
            sonraki: "@akis"
          - id: "yerde"
            etiket: { tr: "Onu yerde bırak; arkanı dön", en: "Leave him in the dirt. Turn your back" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - iliski: { aras_kurt: { saygi: 6, guven: -10 } }
              - hafiza: { npc: "aras_kurt", id: "yerde_birakti", agirlik: -40 }
            sonraki: "@akis"
          - id: "yarin"
            etiket: { tr: "Yanına çömel: \"Yarın tekrar?\"", en: "Crouch next to him. \"Again tomorrow?\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { aras_kurt: { baglilik: 8, saygi: 6 } }
            sonraki: "@akis"
          - id: "gom"
            etiket: { tr: "Onu kendi ellerinle göm", en: "Bury him with your own hands" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"
          - id: "ceket"
            etiket: { tr: "Ceketini al ve giy", en: "Take his jacket. Put it on" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - dikkat: 4
              - itibar: { lonca: 4, yukselenler: 4, siginak: -6 }
            sonraki: "@akis"
          - id: "baska"
            etiket: { tr: "Kalabalığa dön: \"Başka?\"", en: "Turn to the crowd. \"Anybody else?\"" }
            goster: { npc_olu: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - dikkat: 6
              - itibar: { lonca: 6, siginak: -8 }
            sonraki: "@akis"

      - id: "aras_sira_meydan_yenilgi"
        paragraflar:
          - { tr: "Yerdesin. Bıçağın soğuk ağzı boğazında, {npc:aras_kurt|in} dizi göğsünde. Seyirciler yüksek sesle sayıyor, bir güreş maçındaki gibi.", en: "You're on the ground. The cold edge of the blade is at your throat and {npc:aras_kurt|pos} knee is on your chest. The crowd is counting out loud, like it's a wrestling match." }
          - { tr: "Üçe geldiklerinde bıçağı çekiyor. \"Bugün ben,\" diyor, yalnızca senin duyabileceğin kadar alçak sesle. \"Ama ikimiz de biliyoruz ki bu bitmedi.\"", en: "On three, he pulls the blade back. \"Today it's me,\" he says, low enough that only you can hear. \"But we both know this isn't over.\"" }
          - { tr: "Sıralama güncelleniyor; onun adı artık seninkinin üstünde. Ceketini yerden alıp tozunu silkiyor ve sana elini uzatıyor.", en: "The board refreshes, and his name's above yours now. He picks his jacket up off the ground, shakes the dust out, and holds out his hand." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Elini tut", en: "Take his hand" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "kendin"
            etiket: { tr: "Kendi başına kalk", en: "Get up on your own" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { saygi: 6 } }
            sonraki: "@akis"
          - id: "oldururum"
            etiket: { tr: "\"Bir dahaki sefere seni öldürürüm.\"", en: "\"Next time, I kill you.\"" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { korku: 4, guven: -10, saygi: 6 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_kacis"
        paragraflar:
          - { tr: "Dövüşün ortasında geri çekiliyorsun; kalabalığın arasından, meydanın dışına. Arkandan bir yuhalama yükseliyor, sonra kahkahalar.", en: "Midfight, you back off, through the crowd and out of the clearing. Booing goes up behind you. Then laughter." }
          - { tr: "{npc:aras_kurt} kovalamıyor; yalnızca arkandan sesleniyor: \"Sıralama unutmaz!\" Haklı. Akşam olduğunda adın listede bir basamak aşağıda.", en: "{npc:aras_kurt} doesn't chase you; he just calls after you: \"The board doesn't forget!\" He's right, and by evening your name's a rung lower on the list." }
        secenekler:
          - id: "umursama"
            etiket: { tr: "Umursama. Sıralama yalnızca bir sayı", en: "Shrug it off. The board's just a number" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gizle: 4
              - iliski: { aras_kurt: { saygi: -8 } }
            sonraki: "@akis"
          - id: "antrenman"
            etiket: { tr: "Bütün gece antrenman yap", en: "Train through the night" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { agi: 1 }
              - gunluk: { antrenman: 1 }
              - iliski: { aras_kurt: { saygi: -4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_red"
        paragraflar:
          - { tr: "\"Seyirci için dövüşmem,\" diyorsun ve ateşine dönüyorsun. Kalabalık homurdanıyor; biri yere tükürüyor, bir başkası iddia parasını geri istiyor.", en: "\"I don't fight for an audience,\" you say, and turn back to your fire. The crowd grumbles. One survivor spits in the dirt, and another wants his bet back." }
          - { tr: "{npc:aras_kurt} sana uzun süre bakıyor. \"Korkuyorsun,\" diyor, ama emin değil; sesindeki soru işaretini herkes duyuyor.", en: "{npc:aras_kurt} looks at you for a long time. \"You're scared,\" he says. But he isn't sure, and everybody can hear the question mark in it." }
          - { tr: "Ceketini kapıp gidiyor. Kalabalık dağılırken birkaç kişi kalıyor; seni değil, neden reddettiğini merak eden yüzler.", en: "He grabs his jacket and leaves. As the crowd breaks up a few people hang back, curious not about you, but about why you said no." }
        secenekler:
          - id: "konus"
            etiket: { tr: "Kalanlarla konuş", en: "Talk to the ones who stayed" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { siginak: 3, sessiz_ag: 2 }
            sonraki: "@akis"
          - id: "odun"
            etiket: { tr: "Ateşe odun at; kimseyle konuşma", en: "Feed the fire. Talk to no one" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 2
            sonraki: "@akis"

      - id: "aras_sira_meydan_baska"
        paragraflar:
          - { tr: "\"Kim daha çok insan kurtarırsa,\" diyorsun, kalabalığın da duyacağı kadar yüksek sesle. \"Akşama kadar. Sayıyı {fraksiyon:siginak} tutsun.\"", en: "\"Whoever saves more people,\" you say, loud enough for the whole crowd. \"Until sundown. Let the {fraksiyon:siginak} keep count.\"" }
          - { tr: "{npc:aras_kurt} sana başka bir dilde konuşuyormuşsun gibi bakıyor. Sonra kalabalık alkışlamaya başlıyor ve geri adım atamayacağını anlıyor.", en: "{npc:aras_kurt} stares at you like you're speaking another language. Then the crowd starts clapping, and he realizes he can't back out." }
          - { tr: "Akşam sayılar geliyor: ikiniz birlikte onlarca insanı sisten, kapılardan, birbirlerinin elinden çekip çıkarmışsınız. Bir kereliğine, kimin kazandığı kimsenin umurunda değil.", en: "By sundown the numbers are in. Between the two of you, dozens of people pulled out of the fog, out of Gates, out of each other's hands. For once, nobody cares who won." }
        secenekler:
          - id: "ona_birak"
            etiket: { tr: "Kazananı ona bırak", en: "Let him have the win" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "ilan"
            etiket: { tr: "Sayıları say; kendini kazanan ilan et", en: "Count it up. Declare yourself the winner" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - itibar: { siginak: 2 }
              - iliski: { aras_kurt: { saygi: 6, guven: -4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_sir"
        paragraflar:
          - { tr: "Onu kalabalıktan uzağa, yıkık bir duvarın arkasına çekiyorsun. \"Aktarımdan önceki gece,\" diyorsun. \"Kimi öldürmen gerekiyordu?\"", en: "You pull him away from the crowd, behind a broken wall. \"The night before the transfer,\" you say. \"Who were you supposed to kill?\"" }
          - { tr: "{npc:aras_kurt|in} yüzü bir saniyeliğine çırılçıplak kalıyor; sonra kapanıyor. \"Bunu bir daha sorma,\" diyor. \"Hele insanların önünde asla.\"", en: "For one second {npc:aras_kurt|pos} face is completely bare, and then it shuts. \"Don't ask me that again,\" he says. \"Never in front of people.\"" }
          - { tr: "Ama gitmiyor; duvara yaslanıp meydandaki kalabalığa, başka bir dünyaya bakar gibi bakıyor. \"Bugün dövüşmeyelim,\" diyor sonunda. \"Yarın belki.\"", en: "But he doesn't leave; he leans on the wall and watches the crowd like they're in another world. \"Let's not fight today,\" he finally says. \"Maybe tomorrow.\"" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "\"Yarın.\" Kalabalığa birlikte dönün", en: "\"Tomorrow.\" Walk back out together" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "bir_gun"
            etiket: { tr: "\"Bir gün bana anlatacaksın.\"", en: "\"Someday you're telling me.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { aras_kurt: { saygi: 4, guven: 4 } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_parmak"
        paragraflar:
          - { tr: "Bıçak sağdan geliyor; tam beklediğin gibi. İki parmağını kaldırıyorsun ve çelik orada, havada duruyor.", en: "The blade comes in from the right, exactly like you knew it would. You lift two fingers, and the steel just stops there, in midair." }
          - { tr: "Meydan buz kesiyor. {npc:aras_kurt} bıçağı çekmeye çalışıyor; bir kez, iki kez. Kımıldamıyor.", en: "The whole clearing goes dead still. {npc:aras_kurt} tries to pull the blade back, once, twice. It won't budge." }
          - { tr: "\"Bu da ne...\" diyor ve cümlenin gerisi hiç gelmiyor. Gözlerinde ilk kez rekabetten başka bir şey var: korku.", en: "\"What the...\" he says, and the rest of the sentence never shows up. For the first time there's something in his eyes besides competition. Fear." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bıçağı bırak; geri çekil", en: "Let go of the blade. Step back" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 6, korku: -4 } }
            sonraki: "@akis"
          - id: "kir"
            etiket: { tr: "Bıçağı kır", en: "Snap the blade" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - dikkat: 3
              - itibar: { lonca: 5 }
              - iliski: { aras_kurt: { korku: 8, saygi: 4, guven: -6 } }
            sonraki: "@akis"
          - id: "yetis"
            etiket: { tr: "Kulağına eğil: \"Yetiş bana.\"", en: "Lean in close: \"Catch up.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { aras_kurt: { saygi: 10, baglilik: 6 } }
              - tohum: { olay: "yanki_bozuk_satir", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "aras_sira_meydan_maske"
        paragraflar:
          - { tr: "Pencereni herkese açıyorsun. Görünen seviyenin altındaki gerçek rakam, Sistem'in mavisiyle, bütün meydanın önünde parlıyor.", en: "You open your window to everyone. Under your public level, the real number glows in the System's blue in front of the whole clearing." }
          - { tr: "Kalabalık bir adım geri atıyor. {npc:aras_kurt} rakama uzun uzun bakıyor; kendi penceresini açıyor, karşılaştırıyor, kapatıyor.", en: "The crowd takes a step back. {npc:aras_kurt} stares at the number for a long time. Opens his own window, compares, closes it." }
          - { tr: "\"Saklıyormuşsun,\" diyor; sesi tuhaf biçimde incinmiş. \"Bunca zaman. Ben seninle yarışıyordum, sen benimle oynuyordun.\"", en: "\"You've been hiding it,\" he says, weirdly hurt. \"All this time. I was racing you, and you were just playing with me.\"" }
        secenekler:
          - id: "herkesle"
            etiket: { tr: "\"Yalnızca seninle değil. Herkesle.\"", en: "\"Not just you. Everybody.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { aras_kurt: { guven: 4 } }
            sonraki: "@akis"
          - id: "kos"
            etiket: { tr: "\"Şimdi yine koş. Bu sefer gerçek hedefe.\"", en: "\"Now race me again. The real target this time.\"" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - npc_seviye: { aras_kurt: 1 }
              - iliski: { aras_kurt: { saygi: 10, baglilik: 8 } }
            sonraki: "@akis"
          - id: "yine_de"
            etiket: { tr: "Dövüşü yine de kabul et", en: "Accept the duel anyway" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["npc:aras_kurt"], kazan: "aras_sira_meydan_zafer", kaybet: "aras_sira_meydan_yenilgi", kac: "aras_sira_meydan_kacis" }
