        yer: "kule"
        paragraflar:
          - { tr: "Sessizliğin içinde bir pencere açılıyor; kenarları titremiyor, açılış sesi gelmiyor. Harfler bile parmak uçlarında yürüyormuş gibi birer birer beliriyor.", en: "A window opens in the silence. The edges don't flicker, and there's no chime. Even the letters seem to tiptoe onto the screen, one at a time." }
