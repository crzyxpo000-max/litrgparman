            sonraki: "kule_an_yorum_8_a"
          - id: "ort"
            etiket: { tr: "Elini aşağı uzat, Dünya'yı avucunla ört", en: "Reach down and cover Earth with your palm" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "kule_an_yorum_8_b"

