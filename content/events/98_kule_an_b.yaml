          - tur: "sistem"
            baslik: { tr: "[SESSİZ MOD ETKİN]", en: "[SILENT MODE ON]" }
            satirlar:
              - { tr: "Bu bildirimi okuyorsanız lütfen daha sessiz okuyunuz.", en: "If you are reading this notification, please read it more quietly." }
              - { tr: "Kalp atışınız şu an duyulabilir düzeydedir.", en: "Your heartbeat is currently audible." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kalbin gerçekten gürültülü. ben hep duyuyorum, hiç söylemedim.", en: "your heart really is loud. i always hear it. i just never said." }
        secenekler:
          - id: "kis"
            etiket: { tr: "Nefesini tut, kalbini yavaşlatmaya çalış", en: "Hold your breath and try to slow your heart" }
            etkiler:
              - egilim: { gizlilik: 1 }
              - gizle: 2
            sonraki: "kule_an_yorum_4_a"
          - id: "konus"
            etiket: { tr: "Bilerek, yüksek sesle bir şey söyle", en: "Say something out loud, on purpose" }
            etkiler:
              - dikkat: 2
            sonraki: "kule_an_yorum_4_b"

      - id: "kule_an_yorum_4_a"
        yer: "kule"
        paragraflar:
          - { tr: "Nefesini tutup kalp atışlarını saymaya başlıyorsun; her sayışta biraz daha seyrekleşiyorlar. Pencere bir süre bekliyor.", en: "You hold your breath and start counting your heartbeats, and with every count they come a little farther apart. The window waits for a while." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[SESSİZ MOD ETKİN]", en: "[SILENT MODE ON]" }
            satirlar:
              - { tr: "Teşekkür ederiz. Kalp atışınız hâlâ duyulabilir düzeydedir, ama daha kibar.", en: "Thank you. Your heartbeat is still audible. But more polite." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalbini kısık tutarak yürü", en: "Keep your heartbeat down and move" }
            sonraki: "@akis"

      - id: "kule_an_yorum_4_b"
        yer: "kule"
        paragraflar:
          - { tr: "Ağzını açıp bir şey söylüyorsun, ne söylediğini kendin bile duymuyorsun. Ama karşı duvarda, kazınmış binlerce \"sus\" arasına yenisi ekleniyor; taş tozu hâlâ havada.", en: "You open your mouth and say something. You can't even hear what. But on the wall across from you, among the thousands of carved reminders to hush, a new one appears, stone dust still hanging in the air." }
