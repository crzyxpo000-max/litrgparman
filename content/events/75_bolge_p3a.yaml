# Bölge olayları, üs olayları ve saha kampı sahneleri — Perde 3 (Bölüm 10, 11, 14) ve Perde 4 (Bölüm 18).
# docs/STORY_FLOW.md "Yeni ölçüt: hikayesiz gün", DECISIONS #144: keşif görevindeki boş günlere yerel olaylar.
#   Bölüm 10 (İniş, Gün 181–199; geçit henüz açılmadı):
#     bl10_kule_dibi_kaziklar (Kule Dibi: Kadimlerin pirinç kazık halkası) → tohum p3_ellinciler
#   Bölüm 11 (İlk Dünya, Gün 206–229; Batık Takımada ya da Pirinç Kervan):
#     bl11_kule_dibi_can (Kule Dibi: Batık Takımada'dan sökülmüş çanın açık artırması) ⇄ bl11_batik_cancilar
#     bl11_batik_cancilar (Batık Takımada: kulelerden çan söken kurtarıcılar) ⇄ bl11_kule_dibi_can
#     bl11_kule_dibi_kirpinti (Kule Dibi: geçitten sızan Hasat Kırpıntısı, savaş) → bl11_us_soluk_hasta
#     bl11_kule_dibi_hamallar (Kule Dibi: ellinci kata yük taşıyan hamallar) → bl11_sanayi_tuz_kazani
#     bl11_sanayi_tuz_kazani (Sanayi: Batık Takımada tuzundan seviye damıtan kazan) → bl11_us_soluk_hasta
#     bl11_kordon_pul_yazici (Kordon: Dünya'nın adlarını pula yazan Tavvar kâtip) → bl11_kervan_karsi_agirlik
#     bl11_kervan_karsi_agirlik (Pirinç Kervan: karşı ağırlıkta saklanan aile, savaş) → bl11_us_tavvar_ailesi
#     bl11_eski_sehir_hamam (Eski Şehir: hamamda çan türküsü söyleyen Sönük kadın) → bl11_batik_cancilar
#     bl11_us_soluk_hasta (üs, tohum: renk kaybeden hasta)
#     bl11_us_tavvar_ailesi (üs, tohum: Kervan'dan kaçan aile limanda)
#     bl11_kule_dibi_kamp_deniz (saha kampı · Deniz: ellinci katın ışığı altında)
#   Bölüm 14 (Ortak Masa, Gün 293–299; masadan önce, hain açık edilmez):
#     bl14_kule_dibi_takvim (Kule Dibi: pazarda satılan "senin takvimin") → bl14_us_kendi_el_yazin
#     bl14_tepe_isik_cevabi (Tepe: rasathaneden görülen gemi işaretine şehirden verilen cevap) → bl14_us_kendi_el_yazin
#     bl14_us_kendi_el_yazin (üs, tohum: senin el yazınla yazılmış bir teklif mektubu)
#     bl14_kule_dibi_kamp_aras (saha kampı · Aras: zirve teklifi)
#   Bölüm 18 (Son Karar, Gün 353–357):
#     bl18_kule_dibi_tebesir (Kule Dibi: Kule'nin dibine tebeşirle yazılan adlar)
# Bu dosyanın bayrakları: flags/75_bolge_p3a.yaml.
olaylar:
  # ================================================================== PİRİNÇ KAZIKLAR (Bölüm 10 · Kule Dibi)
  - id: "bl10_kule_dibi_kaziklar"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 181, max: 199 }
    kosul: { bolum: 10, bayrak: "thessar_indi" }
    agirlik: 6
    etiketler: ["kule", "kadimler", "kesif"]
    gerilim: 2
    kart: { tr: "Pirinç kazıklar", en: "The brass stakes" }
    sahne: "bl10_kule_dibi_kaziklar_1"
    sahneler:
      - id: "bl10_kule_dibi_kaziklar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|e} vardığında ilk gözüne çarpan, kaldırım taşlarının arasına çakılmış bir kazık oluyor: diz boyunda, pirinçten, tepesi kuş gagası gibi kıvrık. Biraz ötede bir tane daha duruyor, onun ötesinde bir tane daha. Biri Kule'nin çevresine, adımları sayılmış gibi eşit aralıklarla koca bir halka çizmiş.", en: "The first thing you notice when you reach {yer:kule_dibi} is a stake driven between the paving stones: knee-high, brass, its top curled over like a bird's beak. There's another one a little farther on, and another past that. Somebody has laid a huge ring around the Spire, every stake the same number of paces apart." }
          - { tr: "Halkayı çakanlar hâlâ iş başında. İki uzun boylu, solgun Kadim önden yürüyor, arkalarında Lonca yeleği giymiş altı hamal balyoz taşıyor. Kadimlerden biri her kazığın başında eğilip kulağını pirince dayıyor, bir şey duymuş gibi başını sallayıp hamallara bir sonraki yeri gösteriyor.", en: "The crew that laid it is still at work. Two tall, pale Ancients walk in front, six porters in Guild vests trailing behind with sledgehammers. At every stake one of the Ancients bends down and presses an ear to the brass, nods like it heard something, and points the porters to the next spot." }
          - { tr: "Bir sonraki yer, yarı yıkık bir apartmanın dibine kurulmuş yamalı bir çadırın tam ortasına denk geliyor. Çadırın önünde yaşlı bir adam oturmuş, kucağında torunu var. Hamallar balyozlarına dayanmış bekleşiyor; adam yerinden kıpırdamıyor.", en: "The next spot lands smack in the middle of a patched-up tent pitched against a half-collapsed apartment block. An old man sits out front with his grandkid in his lap. The porters lean on their sledgehammers and wait. He doesn't budge." }
          - metin: { tr: "Kadimlerden biri seni görünce elini göğsüne koyup başını hafifçe eğiyor. Elçinin önünde eğildiğini o da duymuş; şimdi bu selamın karşılığını bekliyor.", en: "One of the Ancients spots you, lays a hand on its chest, and dips its head. It heard you bowed to the envoy too, and now it's waiting for you to return the courtesy." }
            kosul: { bayrak: "thessar_inis_egildi" }
          - metin: { tr: "Kadimler seni görünce bir an işi bırakıp birbirlerine bakıyor. Elçiye el kaldıranı tanıyorlar. Bunu gören hamallar da balyozlarını biraz daha sıkı kavrıyor.", en: "The Ancients see you and stop for a second to look at each other. They know who raised a hand to the envoy. The porters catch that and grip their sledgehammers a little tighter." }
            kosul: { bayrak: "thessar_inis_saldiri" }
          - metin: { tr: "Hamalların yeleklerinde, parmağındaki yüzükle aynı demir halka var. Lonca bu işi Kadimlerden götürü almış, sana da haber vermemiş.", en: "The porters' vests carry the same iron ring that's on your finger. The Guild took this job off the Ancients' hands for a flat fee, and nobody bothered to tell you." }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 160 } }
            metin: { tr: "Her kazık başka bir perdeden uğulduyor. Bu halka bir şey ölçmüyor, bir şeyi akort ediyor.", en: "Each stake hums a slightly different note. This ring isn't measuring anything. It's tuning something." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu sesi ellinci kattaki kapı dinliyor. ona hangi yöne açılacağını söylüyorlar. bizim yönümüz değil o.", en: "the door on the fiftieth floor is listening to that sound. they're telling it which way to open. it isn't our way." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kucaktaki çocuk hırıltıyla soluyor. Bu çadırdan çıkarlarsa bu gece nerede yatacaklar?\"", en: "\"That kid in his lap is wheezing. If they get pushed out of that tent, where are they sleeping tonight?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir anten dizisi. Kazıklar tam bir anten dizisi gibi dizilmiş. Kime yayın yaptıklarını bilmek isterdim.\"", en: "\"That's an antenna array. Those stakes are laid out exactly like an antenna array. I'd love to know who they're broadcasting to.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Herkes ellinci kata kimin önce gireceğini tartışırken bunlar kapının yönünü ayarlıyor. Akıllıca. Sinir bozucu ama akıllıca.\"", en: "\"Everybody's arguing about who gets to the fiftieth floor first, and these guys are adjusting which way the door faces. Smart. Annoying, but smart.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Kulağını bir kazığa daya, neyi dinlediklerini anla", en: "Put your ear to a stake. Figure out what they're listening to" }
            gerekli: { stat: { int: 160 } }
            etkiler:
              - bayrak: "bl10_kaziklar_okundu"
              - tohum: { olay: "p3_ellinciler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 10 }, hatirlatma: { tr: "Kazıkların çizdiği halka yerde kalmıyordu; uğultusu Kule'nin içinden yukarı, elli birinci kata kadar tırmanıyordu. Oradakilerin bundan haberi var mı diye merdivene düştün.", en: "The ring of stakes didn't stay on the ground. Its hum climbed up through the Spire, all the way to the fifty-first floor. You hit the stairs to see if anybody up there knew." } }
            sonraki: "bl10_kule_dibi_kaziklar_oku"
          - id: "buk"
            etiket: { tr: "Çadıra çakılacak kazığı kap, büküp düğüm et", en: "Grab the stake meant for the tent and bend it into a knot" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { kadimler: -3 }
              - iliski: { thessar: { guven: -4, korku: 2 } }
              - dikkat: 2
              - bayrak: "bl10_kazik_bukuldu"
            sonraki: "bl10_kule_dibi_kaziklar_buk"
          - id: "tasi"
            etiket: { tr: "Yaşlı adamın çadırını taşımasına yardım et", en: "Help the old man move his tent" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "bl10_cadir_tasindi"
            sonraki: "bl10_kule_dibi_kaziklar_tasi"
          - id: "pazarlik"
            etiket: { tr: "Kadime kazığı bir adım öteye çakmasını söyle", en: "Tell the Ancient to put the stake one step over" }
            goster: { bayrak_yok: "thessar_dusman" }
            etkiler:
              - iliski: { thessar: { saygi: 3 } }
            sonraki: "bl10_kule_dibi_kaziklar_pazarlik"

      - id: "bl10_kule_dibi_kaziklar_oku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hamallar sana yol açıyor. Diz çöküp yanağını soğuk pirince dayadığında uğultu kemiklerine yürüyor; kulağınla değil, dişlerinle duyuyorsun.", en: "The porters make way for you. When you kneel and lay your cheek against the cold brass, the hum walks straight into your bones. You don't hear it with your ears. You hear it with your teeth." }
          - { tr: "Halka ölçmüyor, yön veriyor. Kazıkların her biri tek bir notayı tutuyor; hepsi bir araya gelince ellinci kattaki kapıya tek bir sözcük fısıldıyorlar: körfez. Geçit açıldığında ağzını körfezin üstünde asılı duran gemiye dönecek.", en: "The ring isn't measuring. It's steering. Every stake holds a single note, and together they whisper one word to the door on the fiftieth floor: bay. When the passage opens, its mouth is going to face the ship hanging over the bay." }
          - { tr: "Uğultunun bir kolu da yukarı kıvrılıyor. Kule'nin gövdesi boyunca tırmanıp elli birinci katta bir yere çarpıyor, orada titreşip duruyor; orası insanların yaşadığı bir yer.", en: "One strand of the hum curls upward, too. It climbs the body of the Spire and hits something on the fifty-first floor, and it stays there, trembling. Somewhere people live." }
          - { tr: "Kalktığında Kadimlerden biri hemen başucunda dikiliyor. \"Kapı nasılsa bir yöne açılacak,\" diyor yumuşacık bir sesle. \"Biz ona yalnızca hangi yöne olduğunu hatırlatıyoruz.\"", en: "When you stand up, one of the Ancients is right there beside you. \"The door will open in some direction regardless,\" it says, very gently. \"We are only reminding it which one.\"" }
        secenekler:
          - id: "akil"
            etiket: { tr: "Duyduğunu aklına yaz, bir şey belli etme", en: "File away what you heard. Don't let it show" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "soyle"
            etiket: { tr: "\"Kimse size kapının yönünü sormadı.\"", en: "\"Nobody asked you which way the door should face.\"" }
            etkiler:
              - itibar: { kadimler: -1 }
              - ahlak: { insanlik: 1 }
              - xp_seviye: 9
            sonraki: "bl10_kule_dibi_kaziklar_soyle"

      - id: "bl10_kule_dibi_kaziklar_soyle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kadim sana uzun uzun bakıyor; gözlerinde ne öfke var ne alay. Bir çocuğun neden yağmur yağdığını sormasını dinler gibi dinliyor seni.", en: "The Ancient looks at you a long time. There's no anger in its eyes, no mockery either. It listens the way you'd listen to a kid asking why it rains." }
          - { tr: "\"Doğru,\" diyor sonunda. \"Kimse sormadı.\" Sonra dönüp hamallara bir sonraki yeri gösteriyor ve balyozlar yeniden inmeye başlıyor.", en: "\"True,\" it says at last. \"Nobody did.\" Then it turns and points the porters to the next spot, and the sledgehammers start coming down again." }
        secenekler:
          - id: "git"
            etiket: { tr: "Balyoz seslerini arkanda bırak", en: "Leave the sound of the hammers behind you" }
            sonraki: "@akis"

      - id: "bl10_kule_dibi_kaziklar_buk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kazığı hamalın elinden çekip alıyorsun. Pirinç avucunda bir an direniyor, sonra mum gibi eğiliyor; iki büklüm edip bir düğüm atıyorsun. Uğultu birden tiz bir çığlığa dönüşüyor, halkadaki bütün kazıklar bir ağızdan susuyor.", en: "You yank the stake out of the porter's hands. The brass fights you for a second, then bends like warm wax. You fold it double and tie it in a knot. The hum jumps to a shriek, and every stake in the ring goes silent at once." }
          - { tr: "Kadim ağır ağır doğruluyor. İnce, soluk bir deri tabletin üstüne bir şey yazıp tableti cübbesinin içine sokuyor. \"Halka eksik kaldı,\" diyor yalnızca. Bir uyarı mı, bir tespit mi, anlaşılmıyor.", en: "The Ancient straightens up slowly. It writes something on a thin, pale slate of hide and tucks the slate into its robe. \"The ring is incomplete,\" is all it says. Could be a warning. Could just be a note." }
          - { tr: "Hamallar geri çekiliyor. Yaşlı adam torununu göğsüne bastırıp sana başıyla bir selam veriyor; teşekkür etmiyor, çünkü bunun bedelini kimin ödeyeceğini o da bilmiyor.", en: "The porters back off. The old man hugs his grandkid to his chest and gives you a nod. He doesn't thank you. He doesn't know who's going to pay for this either." }
          - metin: { tr: "Gece Kule'nin gövdesindeki ışık halkası her zamankinden düzensiz tırmanıyor, ellinci katta bir süre titreşip sönüyor. Kapıya yönünü söyleyecek ses artık eksik.", en: "That night, the ring of light on the Spire climbs more raggedly than usual, flickers at the fiftieth floor for a while, and goes out. The voice that was going to tell the door which way to face is missing a note." }
            kosul: { stat: { per: 160 } }
        secenekler:
          - id: "birak"
            etiket: { tr: "Düğümlü pirinci yaşlı adamın kapısına bırak", en: "Leave the knotted brass at the old man's door" }
            etkiler:
              - tehlike: { kule_dibi: 3 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl10_kule_dibi_kaziklar_tasi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çadırın direklerini söküp bezini katlıyorsunuz; adamın bütün varlığı iki bohçaya, bir gaz ocağına, bir de çerçevesi kırık bir fotoğrafa sığıyor. Hamallar siz bitirene kadar bekliyor, sonra kazığı tam çadırın durduğu yere çakıyorlar.", en: "You pull the tent poles and fold the canvas. Everything the old man owns fits in two bundles, a camp stove, and a photo in a cracked frame. The porters wait till you're done, then drive the stake right where the tent stood." }
          - { tr: "Yeni yer bir blok ötede, rüzgâr almayan bir köşe. Adam fotoğrafı çadırın direğine asarken parmağıyla içindeki genç adamı gösteriyor. \"Oğlum,\" diyor. \"Elli birinci kata çıktı, Ellincilerin yanına. Aşağı inmiyor artık. Orada su temizmiş.\"", en: "The new spot is a block over, a corner out of the wind. As the old man hangs the photo on the tent pole, he taps the young man in it. \"My son,\" he says. \"Went up to the fifty-first floor, with the Fifties. Doesn't come down anymore. Water's clean up there, he says.\"" }
          - { tr: "\"Yukarı çıkarsan ona söyle,\" diyor. \"Babası taşındı de. Adresimi bilsin, o kadar.\"", en: "\"If you go up, tell him,\" he says. \"Tell him his dad moved. So he's got the address. That's all.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söylerim.\"", en: "\"I'll tell him.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "p3_ellinciler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 10 }, hatirlatma: { tr: "{yer:kule_dibi|de}ki yaşlı adamın sözü aklından çıkmadı: oğlu elli birinci kattaydı ve babasının taşındığını bilmiyordu.", en: "You couldn't shake what the old man at {yer:kule_dibi} said. His son was up on the fifty-first floor and didn't know his dad had moved." } }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "ocak"
            etiket: { tr: "Söz verme; gaz ocağını yak, çay koy", en: "Don't promise. Light the stove and put on some tea" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl10_kule_dibi_kaziklar_pazarlik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kadim seni sonuna kadar dinliyor, sözünü bir kez bile kesmeden. Sonra kazığın yerini gösteren taşa eğilip parmağını pirincin değeceği noktaya koyuyor.", en: "The Ancient hears you out without interrupting once. Then it bends over the paving stone where the stake is marked and sets a finger on the spot the brass will touch." }
          - { tr: "\"Kazık bir adım kayarsa kapı bir derece kayar,\" diyor. \"Bir derece burada bir adım eder. Öbür tarafta bir şehir eder. Hangi şehir olduğunu bilmiyorum. Yine de istiyor musun?\"", en: "\"If the stake moves one step, the door moves one degree,\" it says. \"Here, one degree is one step. On the other side it is a city. I do not know which city. Do you still want it?\"" }
          - metin: { tr: "Elçinin adamlarından biri sana bunu sorduğuna göre, demek ki {npc:thessar} isteğini ciddiye almış.", en: "If one of the envoy's people is asking you this, then {npc:thessar} decided your wishes count for something." }
            kosul: { bayrak: "thessar_okuma_izni" }
        secenekler:
          - id: "kaydir"
            etiket: { tr: "\"Bir derece olsun.\"", en: "\"One degree. Do it.\"" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: -1 }
              - itibar: { kadimler: 1 }
              - bayrak: "bl10_kazik_kaydirildi"
              - xp_seviye: 9
            sonraki: "bl10_kule_dibi_kaziklar_kaydi"
          - id: "vazgec"
            etiket: { tr: "Vazgeç; çadırı birlikte taşıyın", en: "Forget it. Move the tent together" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - bayrak: "bl10_cadir_tasindi"
            sonraki: "bl10_kule_dibi_kaziklar_tasi"

      - id: "bl10_kule_dibi_kaziklar_kaydi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hamallar balyozu bir adım öteye indiriyor. Kazık taşın arasına gömülürken uğultunun perdesi bir parça değişiyor, belli belirsiz.", en: "The porters bring the sledgehammer down one step over. As the stake sinks between the stones, the pitch of the hum shifts, just barely." }
          - { tr: "Yaşlı adam çadırında kalıyor. Torun uykuya dalmış, hiçbir şeyden haberi yok. Öbür taraftaki o bilinmeyen şehirde kimin uyuyup kimin uyumadığını ise hiçbir zaman öğrenemeyeceksin.", en: "The old man keeps his tent. The grandkid's fallen asleep and doesn't know a thing about any of it. Who's sleeping and who isn't in that unknown city on the other side, you'll never find out." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kazığa son bir kez bak, yürü", en: "Take one last look at the stake and walk" }
            sonraki: "@akis"

  # ================================================================== BOĞULMUŞ ÇAN (Bölüm 11 · Kule Dibi)
  - id: "bl11_kule_dibi_can"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 206, max: 229 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Boğulmuş çan", en: "The drowned bell" }
    sahne: "bl11_kule_dibi_can_1"
    sahneler:
      - id: "bl11_kule_dibi_can_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi} pazarının ortasında üst üste yığılmış sandıkların tepesine bir çan oturtmuşlar. Bir insan boyunda, yosundan yeşile kesmiş; ağzının kenarındaki tuz kabukları daha kurumamış. Bir Lonca kurtarıcısı sandığa çıkmış, avazı çıktığı kadar bağırıyor: \"Öbür dünyadan! {yer:batik_takimada|den}! İki yüz yıllık tunç!\"", en: "Right in the middle of the {yer:kule_dibi} market, somebody's set a bell on top of a stack of crates. It's as tall as a man and moss-green all over, and the salt crust around its lip hasn't even dried yet. A Guild salvager is standing on a crate yelling his lungs out: \"From the other world! From {yer:batik_takimada}! Two-hundred-year-old bronze!\"" }
          - { tr: "Kimse dokunmadığı hâlde çan arada bir kendiliğinden çalıyor. Sesi ağır ve boğuk; hâlâ suyun dibinden geliyormuş gibi. Her çalışında kalabalık bir adım geri çekilip yeniden sokuluyor.", en: "Nobody's touching it, but every so often the bell rings on its own. The sound is heavy and muffled, like it's still coming up from the bottom of the sea. Every time it rings, the crowd takes a step back, then edges in again." }
          - { tr: "Çanın gövdesine baştan aşağı ince, kıvrık harfler kazınmış. Kalabalığın en gerisinde, bir direğe yaslanmış biri o harfleri okur gibi dudaklarını kıpırdatıyor. Parmakları perdeli, teni tuzdan çatlamış; başının üstünde hiçbir sayı yanmıyor.", en: "Thin, curling letters are carved all the way down the bell. At the very back of the crowd, a man leaning on a post moves his lips like he's reading them. Webbed fingers, skin cracked by salt, and no number burning over his head." }
          - metin: { tr: "O yüzü tanımıyorsun ama o teni tanıyorsun. Bu bir Nehha, bir Sönük; Hasat'tan arta kalanlardan, Sistem'in artık göremediklerinden biri.", en: "You don't know the face, but you know that skin. He's a Nehha, one of the Dimmed: the ones the Harvest left behind, the ones the System can't see anymore." }
            kosul: { bayrak: "batik_varildi" }
          - metin: { tr: "Kurtarıcının sandığına geçit izni çivilenmiş: Lonca mührü, Lonca imzası. Ellinci kattan ne inerse önce o tezgâha uğruyor.", en: "There's a passage permit nailed to the salvager's crate: Guild seal, Guild signature. Whatever comes down from the fiftieth floor stops at that table first." }
            kosul: { bayrak: "gecit_denetimli" }
          - metin: { tr: "Geçit herkese açık olunca öbür dünyalardan getirilen her şey de bu pazara akmaya başladı. Çan bu haftanın en büyük parçası, son parçası olmayacağı belli.", en: "Ever since the passage opened to everybody, anything you can carry out of the other worlds ends up in this market. The bell's the biggest piece this week. It's obviously not going to be the last." }
            kosul: { bayrak: "gecit_herkese_acik" }
          - metin: { tr: "Geçidin anahtarı sende; demek bu adam senin izninle geçen birinden almış çanı. Belki senin kuyruğundan geçen birinden.", en: "The passage key is yours, which means this guy got the bell from somebody you let through. Maybe somebody out of your own line." }
            kosul: { bayrak: "gecit_oyuncunun" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Harfler süs değil, ad. Her satıra başka bir el kazımış; en alttaki satır en yeni, kenarları daha keskin.", en: "The letters aren't decoration. They're names. A different hand carved each line, and the bottom line is the newest, its edges still sharp." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dalga her vurduğunda o adları söylüyormuş. iki yüz yıl boyunca. şimdi dalga yok, kendi kendine söylüyor.", en: "every time a wave hit, it said those names. for two hundred years. now there are no waves, so it says them by itself." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Arkadaki adam ağlıyor mu? Ağlamıyor. Ağlamayı da unutmuş gibi.\"", en: "\"Is that guy in the back crying? He's not. It's like he forgot how.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Çanın içinde ölçülebilir bir Öz kalıntısı var. Çok az. Ama var. Hasat bunu atlamış.\"", en: "\"There's a measurable trace of Essence inside that bell. Tiny. But it's there. The Harvest missed it.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Açık artırmaya gir, çanı sen al", en: "Get in on the auction. Buy the bell yourself" }
            etkiler:
              - kredi: -500
              - ahlak: { merhamet: 2 }
              - bayrak: "bl11_can_alindi"
            sonraki: "bl11_kule_dibi_can_al"
          - id: "el"
            tur: "gosteris"
            etiket: { tr: "Sandığa çık, çanı tek elinle kaldır: \"Satış bitti.\"", en: "Climb up and lift the bell one-handed. \"Sale's over.\"" }
            gerekli: { stat: { str: 220 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 1, duzen: -2 }
              - itibar: { lonca: -3 }
              - bayrak: "bl11_can_el_konuldu"
            sonraki: "bl11_kule_dibi_can_el"
          - id: "sor"
            etiket: { tr: "Direğe yaslanan adamın yanına git", en: "Go stand by the man leaning on the post" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "bl11_kule_dibi_can_sor"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} kalabalığı yarsın, sen adama ulaş", en: "Let {npc:deniz_arman} part the crowd while you get to the man" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
            sonraki: "bl11_kule_dibi_can_sor"
          - id: "gec"
            etiket: { tr: "Pazarın gürültüsünde yürüyüp git", en: "Keep walking through the market noise" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - bayrak: "bl11_can_satildi"
              - tohum: { olay: "bl11_batik_cancilar", gecikme: { min: 1, max: 3 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "{yer:kule_dibi|de} satılan çan aklından çıkmadı. Kurtarıcıların daha fazlası için yeniden {yer:batik_takimada|e} geçtiğini duydun.", en: "You couldn't get the bell at {yer:kule_dibi} out of your head. Then you heard the salvagers had gone back through to {yer:batik_takimada} for more." } }
            sonraki: "bl11_kule_dibi_can_gec"

      - id: "bl11_kule_dibi_can_al"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk teklifini duyunca kurtarıcının gözleri parlıyor; ikincisinde kalabalık susuyor. Üçüncüde kimse elini kaldırmıyor. Adam tokmağı sandığa vurduğunda çan bir kez, kısacık çalıyor.", en: "The salvager's eyes light up at your first bid. At your second, the crowd goes quiet. At your third, nobody raises a hand. When he bangs the gavel on the crate, the bell rings once, short." }
          - { tr: "Direğe yaslanan Nehha yanına geliyor. Konuşmuyor, perdeli elini çanın gövdesine koyup en alttaki satırın üstünde gezdiriyor. Parmağı bir adın üstünde durup kalıyor.", en: "The Nehha from the post comes over. He doesn't speak. He lays a webbed hand on the bell and runs it along the bottom line, and his finger stops on one name and stays there." }
          - { tr: "Sistem ancak o zaman bir satır çeviriyor, bulanık ve kesik kesik: [Kızım. Dalga onu aldı. Çan onu söyler.]", en: "Only then does the System translate a line, blurry and broken: [My daughter. The wave took her. The bell says her.]" }
        secenekler:
          - id: "gotur"
            etiket: { tr: "\"Çanı kendi kulesine geri götüreceğiz.\"", en: "\"We'll take the bell home. Back to its tower.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "bl11_batik_cancilar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Satın aldığın çan sandıkların arasında bekliyordu. Nehha her sabah gelip ona dokunuyordu.", en: "The bell you bought sat waiting among the crates. Every morning the Nehha came by to touch it." } }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Çanı ona bırak; ne yapacağına o karar versin", en: "Leave the bell with him. Let him decide what to do with it" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_kule_dibi_can_el"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çanın kulpunu kavrayıp kaldırıyorsun. Yarım ton tunç, bir kova su kaldırır gibi omuz hizana çıkıyor. Kurtarıcının sesi boğazında kalıyor; kalabalıktan biri istavroz çıkarıyor, biri de penceresini açıp satırına bakıyor.", en: "You get a grip on the bell's crown and lift. Half a ton of bronze comes up to shoulder height like a bucket of water. The salvager's voice dies in his throat. Somebody in the crowd crosses himself. Somebody else pulls up their System window to check your level." }
          - { tr: "\"Bu Lonca'nın malı,\" diyor kurtarıcı sonunda, ama sesi pazarlık eden birinin sesi değil artık.", en: "\"That's Guild property,\" the salvager says finally, but he doesn't sound like he's negotiating anymore." }
          - { tr: "Direğe yaslanan Nehha yaklaşıp çanın ağzına, elinin hemen altına başını yaslıyor. Çan onun için bir kez çalıyor.", en: "The Nehha from the post comes over and rests his forehead against the bell's lip, right under your hand. The bell rings once for him." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Çanı omzuna al; kulesine dönecek", en: "Shoulder the bell. It's going home to its tower" }
            etkiler:
              - tohum: { olay: "bl11_batik_cancilar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "El koyduğun çan Sığınak'ın deposunda bekliyordu. Lonca iki kez sordu; ikisinde de cevap vermedin.", en: "The bell you took was waiting in the Haven's storeroom. The Guild asked about it twice. Both times you didn't answer." } }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kule_dibi_can_sor"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Nehha seni görünce irkilmiyor. Kendisini görebilen birine alışkın değil; senin bakışını, karanlıkta yanan bir kibriti izler gibi izliyor.", en: "The Nehha doesn't flinch when you come up. He isn't used to anyone being able to see him. He watches you looking at him the way you'd watch a match burning in the dark." }
          - { tr: "Perdeli elini havaya kaldırıp çanın yönünü gösteriyor, sonra yere eğilip tozun üstüne bir dalga çiziyor, dalganın altına da bir kule. Sistem araya giriyor, bulanık ve kesik kesik: [Bizim kule. Çan kızımı söyler. Satarlarsa kim söyleyecek?]", en: "He raises a webbed hand toward the bell, then crouches and draws a wave in the dust, with a tower underneath it. The System cuts in, blurry and broken: [Our tower. Bell says my daughter. If they sell it, who says her?]" }
          - metin: { tr: "{npc:deniz_arman} kalabalığı omzuyla yarıp arkanızda durmuş, kimsenin yaklaşmasına izin vermiyor. \"Sen dinle,\" diyor sana. \"Ben buradayım.\"", en: "{npc:deniz_arman} has shouldered through the crowd and planted themselves behind you two, not letting anybody close. \"You listen,\" they tell you. \"I've got this.\"" }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "al"
            etiket: { tr: "Kurtarıcıya dön, çanı satın al", en: "Turn back to the salvager and buy the bell" }
            etkiler:
              - kredi: -500
              - ahlak: { merhamet: 2 }
              - bayrak: "bl11_can_alindi"
            sonraki: "bl11_kule_dibi_can_al"
          - id: "iz"
            etiket: { tr: "\"Çanı kim söktü? Bana yerini göster.\"", en: "\"Who took the bell? Show me where.\"" }
            etkiler:
              - bayrak: "bl11_can_satildi"
              - tohum: { olay: "bl11_batik_cancilar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Nehha'nın tozun üstüne çizdiği kule aklındaydı. Kurtarıcılar oraya, daha fazlası için dönmüştü.", en: "You still had the tower the Nehha drew in the dust in your head. The salvagers had gone back there for more." } }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_kule_dibi_can_gec"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tokmak arkandan sandığa iniyor. Çanı {yer:tepe|den} gelmiş bir Yükselen alıyor; Kule'nin dibinde bir ibadet yeri kuracaklarmış, bir çan lazımmış.", en: "Behind you the gavel comes down. The bell goes to one of the Ascended up from {yer:tepe}. They're building a place of worship at the foot of the Spire, apparently, and they need a bell." }
          - { tr: "Pazarın öbür ucuna vardığında çan bir kez daha çalıyor, bu kez daha uzaktan. Direğe yaslanan adamın yeri boş.", en: "By the time you reach the far end of the market, the bell rings once more, farther off now. The spot by the post is empty." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== ÇAN SÖKÜCÜLER (Bölüm 11 · Batık Takımada)
  - id: "bl11_batik_cancilar"
    konum: ["batik_takimada"]
    perde: [3]
    bolge: ["batik_takimada"]
    gun: { min: 206, max: 229 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Çan sökücüler", en: "The bell strippers" }
    sahne: "bl11_batik_cancilar_1"
    sahneler:
      - id: "bl11_batik_cancilar_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Takımadanın doğu ucunda, sudan beline kadar çıkmış bir çan kulesinin dibine yamalı bir mavna bağlanmış. Güvertedeki vinç gıcırdayıp duruyor; zincirleri kulenin kemerinden içeri, karanlığa uzanıyor.", en: "At the eastern end of {yer:batik_takimada}, a patched-up barge is tied to a bell tower that stands waist-deep in the water. The winch on deck creaks and creaks, its chains running in through the tower's arch and into the dark." }
          - { tr: "Kurtarıcılar {yer:kiyikent|den} gelmiş; ceplerinde Lonca'nın sarı geçit kâğıdı, bellerinde çekiç. Ustabaşı vincin kolunu çevirirken bir yandan da bağırıyor: \"Yavaş! Çatlarsa yarı fiyat!\"", en: "The salvagers came over from {yer:kiyikent}, Guild passage papers in their pockets, hammers on their belts. The foreman cranks the winch and yells the whole time: \"Easy! It cracks, it's half price!\"" }
          - { tr: "Yandaki kulenin pervazına beş Nehha tünemiş, onları seyrediyor. Hepsi yaşlı, hepsi suskun. İçlerinden bir kadın çanın halatının ucunu iki eliyle sımsıkı tutmuş; vinç her asıldığında halat avuçlarından biraz daha sıyrılıyor.", en: "Five Nehha are perched on the ledge of the next tower over, watching. All of them old, all of them silent. One woman has the end of the bell rope in both fists, and every time the winch hauls, a little more of it slides through her palms." }
          - { tr: "Ustabaşı seni görünce elini kaldırıp selam veriyor. \"Burası boş dünya, usta,\" diyor. \"Sistem tek bir can göstermiyor. Göstermiyorsa yoktur. Olmayanın malı da sahipsizdir.\"", en: "The foreman spots you and throws you a wave. \"Empty world, boss,\" he says. \"System doesn't show a single soul. If it doesn't show 'em, they ain't here. And if they ain't here, the stuff's nobody's.\"" }
          - metin: { tr: "{yer:kule_dibi|den} getirdiğin çan mavnanın yanındaki salda, ağzı göğe dönük yatıyor. Pervazdaki kadın onu görünce halatı bir an bırakacak gibi oluyor.", en: "The bell you brought from {yer:kule_dibi} is lying on the raft beside the barge, mouth to the sky. When the woman on the ledge sees it, she almost lets go of the rope." }
            kosul: { herhangi: [{ bayrak: "bl11_can_alindi" }, { bayrak: "bl11_can_el_konuldu" }] }
          - metin: { tr: "Bu çan, {yer:kule_dibi|de} satılan çanın kardeşi. Ustabaşı fiyatını şimdiden biçmiş: \"Öteki Yükselenlere gitti. Bu Lonca'ya. Tunç tunçtur.\"", en: "This one's the sister of the bell they sold at {yer:kule_dibi}. The foreman's already priced it. \"The other one went to the Ascended. This one's for the Guild. Bronze is bronze.\"" }
            kosul: { bayrak: "bl11_can_satildi" }
          - metin: { tr: "Pervazdakilerin başlarının üstünde, {npc:yanki|in} onlara verdiği [Seviye 1] yazıları titreşiyor. Kurtarıcılar onları görüyor; görüp görmezden geliyor.", en: "Over the heads of the ones on the ledge, the [Level 1] tags {npc:yanki} gave them are flickering. The salvagers can see them fine. They're just choosing not to." }
            kosul: { bayrak: "batik_gorunur" }
          - metin: { tr: "Son Fener düştüğünden beri sallardakiler dağılmış. Kulelerin tepesine tünemiş bir avuç yaşlıdan başka kimse kalmamış.", en: "Since the Last Light fell, the raft people have scattered. There's nobody left but a handful of old folks perched on top of the towers." }
            kosul: { bayrak: "batik_fener_dustu" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Kulenin dibindeki su kıpırdıyor. Çan yerinden her oynadığında aşağıdaki gri gölgeler bir parça daha yukarı tırmanıyor.", en: "The water at the foot of the tower is stirring. Every time the bell shifts, the gray shapes down there climb a little higher." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çanlar susarsa kırpıntılar adları duymaz. adları duymayınca da kulelere tırmanırlar. kadın bunu biliyor. adam bilmiyor.", en: "if the bells go quiet, the chaff can't hear the names. and when they can't hear the names, they climb the towers. the woman knows that. the man doesn't." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Adam haksız sayılmaz, biliyor musun? Sistem göstermiyorsa yoklar. En azından Sistem'in gözünde.\"", en: "\"He's not totally wrong, you know. If the System doesn't show them, they don't exist. In the System's eyes, anyway.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Halatı tutan kadının avuçları kanıyor. Yine de bırakmıyor.\"", en: "\"That woman's palms are bleeding on the rope. She's still not letting go.\"" }
        secenekler:
          - id: "durdur"
            etiket: { tr: "Vincin kolunu tut: \"Çan yerinde kalıyor.\"", en: "Grab the winch handle. \"The bell stays.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -4 }
            sonraki: "bl11_batik_cancilar_durdur"
          - id: "goster"
            etiket: { tr: "Ustabaşına halatın ucundaki elleri göster", en: "Show the foreman the hands on the other end of the rope" }
            zar: { stat: "cha", zorluk: 300, tek: true, basarisiz: "bl11_batik_cancilar_goster_yok", basarisiz_etkiler: [{ ahlak: { insanlik: 1 } }] }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl11_batik_cancilar_goster"
          - id: "as"
            etiket: { tr: "Getirdiğin çanı kulesine geri as", en: "Hang the bell you brought back in its tower" }
            goster: { herhangi: [{ bayrak: "bl11_can_alindi" }, { bayrak: "bl11_can_el_konuldu" }] }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - bayrak: "bl11_can_asildi"
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -6 }
            sonraki: "bl11_batik_cancilar_as"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} pervaza çıkıp kadının ellerini sarsın", en: "Have {npc:elif_sari} climb up and bandage the woman's hands" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { saygi: 3, guven: 2 } }
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -4 }
            sonraki: "bl11_batik_cancilar_elif"
          - id: "birak"
            etiket: { tr: "Karışma; Sistem'in boş dediği yerin malı sahipsizdir", en: "Stay out of it. If the System says it's empty, it's nobody's" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
              - bayrak: "bl11_canlar_sokuldu"
              - tehlike: { batik_takimada: 5 }
              - tohum: { olay: "bl11_kule_dibi_can", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Mavnanın yükü {yer:kule_dibi|e} inmişti. Pazarda bir çan açık artırmaya çıkacaktı.", en: "The barge's load had come down to {yer:kule_dibi}. There was going to be a bell up for auction at the market." } }
            sonraki: "bl11_batik_cancilar_birak"

      - id: "bl11_batik_cancilar_durdur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Vincin kolunu avucunun içine alıp sıkıyorsun. Motor homurdanıyor, zincir gerildikçe geriliyor, ama kol yerinden kıpırdamıyor. Sonunda motor bir öksürük koparıp susuyor.", en: "You close your hand around the winch handle and squeeze. The motor growls, the chain pulls tighter and tighter, and the handle doesn't move an inch. Finally the motor coughs and dies." }
          - { tr: "\"Bunu Lonca'ya yazacağım,\" diyor ustabaşı, ama zinciri kendi eliyle gevşetiyor. Çan kulenin karanlığına geri iniyor. İlk dalga vurduğunda yeniden çalıyor; ağır, boğuk, sanki hiçbir şey olmamış gibi.", en: "\"I'm reporting this to the Guild,\" the foreman says, but he's the one who lets the chain out. The bell sinks back into the dark of the tower. When the first wave hits, it rings again, heavy and muffled, like nothing ever happened." }
          - { tr: "Pervazdaki kadın halatı bırakıp kanayan avuçlarını yüzüne kapatıyor. Kulenin dibindeki gri gölgeler suyun derinine çekiliyor.", en: "The woman on the ledge lets go of the rope and presses her bleeding palms to her face. Down at the foot of the tower, the gray shapes sink back into the deep." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Mavna çekip gidene kadar orada bekle", en: "Wait there until the barge pulls out" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_batik_cancilar_goster"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ustabaşının omzunu tutup başını halata çeviriyorsun. Gözü ipin üstünde geziniyor, kulenin pervazına kadar tırmanıyor ve orada, ipi tutan iki elde duruyor. Bir seviye görmüyor; kan görüyor.", en: "You take the foreman by the shoulder and turn his head toward the rope. His eyes travel along it, climb all the way up to the ledge, and stop on the two hands holding it. He doesn't see a level. He sees blood." }
          - { tr: "Bir süre ağzını açmıyor. Sonra küfredip adamlarına zinciri gevşetmelerini söylüyor. \"Sistem göstermiyor diye...\" diye başlıyor, cümlenin sonunu getiremiyor.", en: "For a while he doesn't say a word. Then he swears and tells his crew to let out the chain. \"Just 'cause the System doesn't show 'em...\" he starts, and can't finish it." }
          - { tr: "\"Peki bu seferin parasını kim ödeyecek?\" diye soruyor sonunda, gözünü kulelerden ayırmadan.", en: "\"So who's paying for this trip?\" he asks finally, still not taking his eyes off the towers." }
        secenekler:
          - id: "ad"
            etiket: { tr: "\"Lonca'ya benim adımı ver.\"", en: "\"Give the Guild my name.\"" }
            etkiler:
              - itibar: { lonca: -1 }
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -4 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Cevap verme; zincirin gevşemesini izle", en: "Don't answer. Watch the chain go slack" }
            etkiler:
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -4 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_batik_cancilar_goster_yok"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ustabaşı gösterdiğin yere bakıp gülüyor. \"Ben ip görüyorum usta, el görmüyorum,\" diyor. \"Senin gözün başka, benimki başka.\" Vincin kolunu bir tur daha çeviriyor.", en: "The foreman looks where you're pointing and laughs. \"I see a rope, boss. I don't see any hands,\" he says. \"Your eyes are your eyes, mine are mine.\" He gives the winch handle another turn." }
          - { tr: "Halat kadının avuçlarından bir karış daha kayıyor.", en: "The rope slides another hand's width through the woman's palms." }
        secenekler:
          - id: "zorla"
            etiket: { tr: "Kolu zorla durdur", en: "Stop the handle by force" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - bayrak: "bl11_canlar_kaldi"
              - tehlike: { batik_takimada: -4 }
            sonraki: "bl11_batik_cancilar_durdur"
          - id: "birak"
            etiket: { tr: "Bırak, çeksinler", en: "Let them haul it" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - bayrak: "bl11_canlar_sokuldu"
              - tehlike: { batik_takimada: 5 }
            sonraki: "bl11_batik_cancilar_birak"

      - id: "bl11_batik_cancilar_as"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sal kulenin dibine yanaşıyor; çanı zincirlerle kemerin içindeki kirişe çekiyorsun. Kurtarıcılar ağızları açık seyrediyor: biri söküyor, öbürü geri takıyor.", en: "You bring the raft in under the tower and haul the bell up onto the beam inside the arch with chains. The salvagers watch with their mouths hanging open. One crew takes bells down, another hangs them back up." }
          - { tr: "Pervazdaki kadın aşağı inip alnını çanın soğuk gövdesine dayıyor. İlk dalga vurduğunda iki çan birden çalıyor, biri bu kulede, biri yandakinde. Sistem tek bir sözcük çeviriyor: [Söylüyor.]", en: "The woman on the ledge climbs down and rests her forehead on the cold bronze. When the first wave hits, two bells ring at once, one in this tower and one in the next. The System translates a single word: [Saying.]" }
          - { tr: "Ustabaşı başını kaşıyıp vincin zincirini topluyor. \"Biri söktü, biri taktı,\" diyor. \"Ödeştik sayılır.\" Mavna öteki çana dokunmadan çekip gidiyor.", en: "The foreman scratches his head and starts reeling in the winch chain. \"One got taken down, one got put back,\" he says. \"Call it even.\" The barge pulls out without touching the other bell." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Dalgaların iki çanı birlikte çalmasını dinle", en: "Listen to the waves ring both bells together" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_batik_cancilar_elif"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:elif_sari} çantasını sırtına vurup kulenin yosunlu taşlarına tırmanıyor, pervaza varınca kadının yanına çöküyor. Halatı bırakmasını istemiyor; avuçlarını halatla birlikte sarıyor.", en: "{npc:elif_sari} slings her bag over her shoulder and climbs the mossy stones of the tower. When she reaches the ledge, she kneels beside the woman. She doesn't ask her to let go of the rope. She bandages her palms with the rope still in them." }
          - { tr: "Ustabaşı vinci durdurup gözlerini kısıyor. \"Doktor kime sargı yapıyor?\" diye soruyor. {npc:elif_sari} başını kaldırmadan cevap veriyor: \"Kanayan birine.\"", en: "The foreman stops the winch and squints. \"Who's the doc bandaging?\" he asks. {npc:elif_sari} doesn't look up. \"Somebody who's bleeding.\"" }
          - { tr: "Adam bir süre pervaza bakıp zinciri gevşetiyor. Çan karanlığına geri inerken pervazdaki beş yaşlı aynı anda başlarını eğiyor; kurtarıcılara değil, kendilerini gören o kadına.", en: "He stares at the ledge a while, then lets the chain out. As the bell sinks back into its dark, all five old Nehha bow their heads at once. Not to the salvagers. To the woman who could see them." }
        secenekler:
          - id: "in"
            etiket: { tr: "{npc:elif_sari|in} inmesine yardım et", en: "Help {npc:elif_sari} climb down" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_batik_cancilar_birak"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Vinç son kez asılıyor, çan kemerin içinden sıyrılıp günışığına çıkıyor. Gövdesinden şırıl şırıl su akarken havada bir an asılı kalıyor; iki yüz yıldır ilk kez, bir dalganın ortasında sessiz.", en: "The winch hauls one last time and the bell slides out of the arch into daylight. Water streams off it as it hangs in the air, and for the first time in two hundred years it's silent in the middle of a wave." }
          - { tr: "Pervazdaki kadın halatı bırakıyor. Halat suya düşüp ağır ağır batarken öbür yaşlılar onu kollarından tutup bir sonraki kuleye götürüyor.", en: "The woman on the ledge lets go of the rope. As it drops into the water and slowly sinks, the other old ones take her by the arms and lead her to the next tower." }
          - { tr: "Akşam mavna yola koyulurken dönüp bakıyorsun. Boşalan kulenin yosunlu duvarlarına gri, rengi çekilmiş şekiller tırmanıyor.", en: "That evening, as the barge gets underway, you look back. Gray, colorless shapes are climbing the mossy walls of the empty tower." }
        secenekler:
          - id: "don"
            etiket: { tr: "Arkanı dön", en: "Turn your back on it" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== RENGİ ÇEKİLMİŞ ADAM (Bölüm 11 · Kule Dibi)
  - id: "bl11_kule_dibi_kirpinti"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 207, max: 229 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "savas", "kesif"]
    gerilim: 3
    kart: { tr: "Rengi çekilmiş adam", en: "The man with no color" }
    sahne: "bl11_kule_dibi_kirpinti_1"
    sahneler:
      - id: "bl11_kule_dibi_kirpinti_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın kenarındaki çay ocağında bir adam oturuyor; tepeden tırnağa gri. Saçı, teni, üstündeki sefer ceketi, hatta gözlerinin akı bile eski bir fotoğraf gibi solmuş. Önündeki çay bardağı dolu ama dumanı tütmüyor.", en: "There's a man sitting at the tea stall on the edge of the market, gray from head to toe. His hair, his skin, the expedition jacket he's wearing, even the whites of his eyes, all faded like an old photograph. The cup of tea in front of him is full, and it isn't steaming." }
          - { tr: "Önünden geçen herkese aynı soruyu soruyor, kibar ve yorgun bir sesle: \"Adın ne?\" Kimi cevap vermeden geçip gidiyor. Cevap verenlerse birkaç adım sonra duraklayıp parmak uçlarına bakıyor; renkleri biraz atmış.", en: "He asks everyone who walks by the same question, in a polite, tired voice: \"What's your name?\" Some people walk on without answering. The ones who do answer stop a few steps later and look at their fingertips. A little of the color's gone out of them." }
          - { tr: "Çay ocağının dibinde üç çocuk çömelmiş, şeker bekliyor. Adam tam onlara dönüp aynı soruyu soruyor.", en: "Three kids are squatting at the foot of the stall, waiting for candy. The man turns to ask them the same question." }
          - metin: { tr: "Bunun benzerini daha önce görmüştün: {yer:batik_takimada|de}, kulelerin dibinde suyun içinde dikilen gri kabuklar. Karşındaki de geçitten birinin sırtına tutunup gelmiş olmalı.", en: "You've seen these before: the gray husks standing in the water at the foot of the towers in {yer:batik_takimada}. This one hitched a ride through the passage on somebody's back." }
            kosul: { bayrak: "batik_varildi" }
          - metin: { tr: "Geçit herkese açık olduğundan beri kimin geçip kimin döndüğünü sayan yok. Bu da öyle dönenlerden biri gibi gelmiş.", en: "Since the passage opened to everybody, nobody's counting who goes through and who comes back. This thing just walked in like one more returnee." }
            kosul: { bayrak: "gecit_herkese_acik" }
          - metin: { tr: "Lonca nöbeti onu, ceketinin cebinde geçit kâğıdı var diye geçirmiş. Kâğıdın sahibi ise cebin değil.", en: "The Guild checkpoint let it through because there was a passage paper in its jacket pocket. The paper didn't belong to whatever was wearing the jacket." }
            kosul: { bayrak: "gecit_denetimli" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Adamın gölgesi yok. Güneş tepede, çay ocağının direği bile yere gölge düşürüyor; o düşürmüyor.", en: "The man has no shadow. The sun's overhead, and even the tea stall's pole throws one on the ground. He doesn't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "adını söyleme. o ad ister. verirsen bir parçanı alır, sonra bir parça daha. ben de bir zamanlar böyle miydim, bilmiyorum.", en: "don't tell it your name. it wants names. give it one and it takes a piece of you, then another piece. i don't know if i was like that once." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu şey bir emici. Ad, kimlik, Sistem kaydı... Ne verirsen onu çekiyor. Bana bakma, ben kesinlikle adımı söylemiyorum.\"", en: "\"That thing's a drain. Name, identity, System record... whatever you hand it, it pulls in. Don't look at me, I am definitely not telling it my name.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklar! Çocuklar dibinde. Önce onları çekelim.\"", en: "\"The kids. The kids are right there. Get them out first.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Adının yerine kılıcını uzat", en: "Offer it your blade instead of your name" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["hasat_kirpintisi@dunya", "hasat_kirpintisi@dunya-20"], ortam: ["tavan"], kazan: "bl11_kule_dibi_kirpinti_zafer", kaybet: "bl11_kule_dibi_kirpinti_yenilgi", kac: "bl11_kule_dibi_kirpinti_kacis" }
          - id: "cocuk"
            etiket: { tr: "Önce çocukları ocağın dibinden çek", en: "Pull the kids away from the stall first" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "bl11_kule_dibi_kirpinti_cocuk"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} çocukları kalkanının ardına alsın", en: "Have {npc:deniz_arman} get the kids behind their shield" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { deniz_arman: { guven: 3, saygi: 2 } }
            sonraki: "bl11_kule_dibi_kirpinti_cocuk"
          - id: "ad"
            etiket: { tr: "Ona kimsenin olmayan bir ad ver", en: "Give it a name that belongs to nobody" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl11_kule_dibi_kirpinti_ad"
          - id: "lonca"
            etiket: { tr: "Pazarın Lonca avcılarına haber ver, çekil", en: "Tip off the Guild hunters at the market and step back" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Ağlarla şeyi bastıran Lonca avcılarından biri o günden beri parmak uçlarını ovuşturup duruyordu.", en: "One of the Guild hunters who netted that thing had been rubbing his fingertips ever since." } }
            sonraki: "bl11_kule_dibi_kirpinti_lonca"

      - id: "bl11_kule_dibi_kirpinti_cocuk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çocukları kollarından kapıp tezgâhların arasına itiyorsun; şekerlerini unutup koşuşturuyorlar. Gri adam arkalarından bakmıyor bile, başını ağır ağır sana çeviriyor.", en: "You grab the kids by the arms and shove them in between the stalls. They forget the candy and run. The gray man doesn't even watch them go. He turns his head, slowly, toward you." }
          - metin: { tr: "{npc:deniz_arman} kalkanını çocuklarla gri adamın arasına dikmiş, geri adım atmıyor. \"Bu taraf kapalı,\" diyor. \"Konuşacaksan onunla konuş.\"", en: "{npc:deniz_arman} has planted their shield between the kids and the gray man and isn't giving an inch. \"This side's closed,\" they say. \"You want to talk, talk to that one.\"" }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "\"Adın ne?\" diye soruyor. Sesi sabırlı; ne öfkeli ne aç. Uzun bir yoldan gelmiş biri, yol sorar gibi soruyor.", en: "\"What's your name?\" it asks. Its voice is patient. Not angry, not hungry. Like somebody who's come a long way, asking for directions." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Cevap olarak kılıcını çek", en: "Answer by drawing your blade" }
            etkiler:
              - savas: { dusmanlar: ["hasat_kirpintisi@dunya", "hasat_kirpintisi@dunya-20"], ortam: ["tavan"], kazan: "bl11_kule_dibi_kirpinti_zafer", kaybet: "bl11_kule_dibi_kirpinti_yenilgi", kac: "bl11_kule_dibi_kirpinti_kacis" }
          - id: "ad"
            etiket: { tr: "Ona kimsenin olmayan bir ad ver", en: "Give it a name that belongs to nobody" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl11_kule_dibi_kirpinti_ad"
          - id: "lonca"
            etiket: { tr: "Lonca avcılarına seslen", en: "Shout for the Guild hunters" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Ağlarla şeyi bastıran Lonca avcılarından biri o günden beri parmak uçlarını ovuşturup duruyordu.", en: "One of the Guild hunters who netted that thing had been rubbing his fingertips ever since." } }
            sonraki: "bl11_kule_dibi_kirpinti_lonca"

      - id: "bl11_kule_dibi_kirpinti_ad"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Karşısına oturup gözlerinin içine bakıyorsun, aklına gelen ilk sesleri yan yana diziyorsun. Ne bu dünyada ne öbüründe kimsenin taşımadığı, hiçbir pencereye yazılmamış bir ad.", en: "You sit down across from it, look it in the eye, and string together the first sounds that come to you. A name nobody carries, in this world or the other one. A name that's never been written in any window." }
          - { tr: "Gri adam adı bir kez, sonra bir kez daha tekrarlıyor, tadına bakar gibi. Sonra omuzları gevşiyor. Bardağı iki eliyle kavrayıp kalkmayan dumana uzun uzun bakıyor ve oturduğu yerde, sessizce kül olup dağılıyor.", en: "The gray man says the name once, then once more, like he's tasting it. Then his shoulders loosen. He wraps both hands around the cup, stares a long time at the steam that isn't rising, and right there in his seat, quietly, crumbles into ash." }
          - { tr: "Çaycı ellerini önlüğüne silip bardağı alıyor. Çay hâlâ ılık.", en: "The tea seller wipes his hands on his apron and picks up the cup. The tea's still warm." }
        secenekler:
          - id: "kul"
            etiket: { tr: "Külleri avucuna alıp Kule'nin dibine savur", en: "Scoop up the ash and scatter it at the foot of the Spire" }
            etkiler:
              - bayrak: "bl11_kirpinti_adlandi"
              - tehlike: { kule_dibi: -3 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "{yer:kule_dibi|de}ki gri adamın giydiği sefer ceketinin asıl sahibi o hafta Sığınak'ın koğuşuna taşındı.", en: "That week, the real owner of the expedition jacket the gray man had been wearing turned up at the Haven ward." } }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kirpinti_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Son darbende şey bir torba un gibi patlayıp gri bir toza dönüşüyor; toz çay ocağının tentesine, tezgâhlara, senin omuzlarına iniyor. Geriye boş bir sefer ceketi kalıyor.", en: "At your last hit the thing bursts like a sack of flour into gray dust. It settles on the tea stall's awning, the counters, your shoulders. What's left is an empty expedition jacket." }
          - { tr: "Ceketin göğsüne dikilmiş künyede bir ad yazıyor; Sığınak'ın sefer listesinden, geçen hafta geçide girenlerden biri. Çaycı parmak uçlarına bakıp duruyor; adını söylediği o ilk müşteriden beri renkleri biraz soluk.", en: "There's a name on the tag sewn to the jacket's chest, one off the Haven's expedition list, somebody who went through the passage last week. The tea seller keeps staring at his fingertips. They've been a little pale ever since he gave the thing his name as its first customer." }
        secenekler:
          - id: "kunye"
            etiket: { tr: "Künyeyi al; sahibini bul", en: "Take the tag. Find its owner" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl11_kirpinti_olduruldu"
              - tehlike: { kule_dibi: -3 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Künyenin sahibi Sığınak'ın koğuşundaydı. Geçitten dönmüştü, ama hepsi dönmemişti.", en: "The tag's owner was in the Haven ward. He'd come back through the passage. Not all of him had." } }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "supur"
            etiket: { tr: "Tozu çaycıyla birlikte süpür", en: "Sweep up the dust with the tea seller" }
            etkiler:
              - bayrak: "bl11_kirpinti_olduruldu"
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kirpinti_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gri parmaklar bileğine değdiği an içinden bir şey çekilip gidiyor; adın değil, adının sıcaklığı. Dizlerin bükülüyor, dünya rengini yitiriyor.", en: "The second those gray fingers touch your wrist, something drains out of you. Not your name. The warmth of your name. Your knees buckle and the world loses its color." }
          - { tr: "Kendine geldiğinde Lonca avcıları şeyi ağlarla tezgâhların arasına sıkıştırmış, zıpkınlarla deşip duruyor. Çaycı dirseklerine kadar gri; seni ilk o kaldırıyor.", en: "When you come to, the Guild hunters have it pinned between the stalls under their nets and are stabbing at it with harpoons. The tea seller is gray to the elbows. He's the first one to help you up." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Doğrul, parmak uçlarına bak", en: "Get up. Look at your fingertips" }
            etkiler:
              - can: 20
              - tehlike: { kule_dibi: 2 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "{yer:kule_dibi|de}ki çaycı o günden beri her sabah biraz daha soluk uyanıyordu. Sonunda onu Sığınak'ın koğuşuna getirdiler.", en: "Every morning since, the tea seller at {yer:kule_dibi} woke up a little paler. Finally they brought him to the Haven ward." } }
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kirpinti_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Gri adam peşinden gelmiyor; bardağını bırakıp ağır ağır kalkıyor ve pazarın arka sokaklarına doğru yürüyor, önüne çıkan herkese aynı soruyu sorarak.", en: "You pull back. The gray man doesn't follow. He sets down his cup, gets up slowly, and walks off into the market's back alleys, asking everybody in his way the same question." }
          - { tr: "Akşama kadar Lonca avcıları onu arıyor. Bulduklarında arka sokaklarda yedi kişi parmak uçlarına bakıyor olacak.", en: "The Guild hunters spend the rest of the day looking for it. By the time they find it, seven people in those back alleys will be staring at their fingertips." }
        secenekler:
          - id: "git"
            etiket: { tr: "Pazardan ayrıl", en: "Leave the market" }
            etkiler:
              - tehlike: { kule_dibi: 3 }
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kirpinti_lonca"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avcılar ağlarla, zıpkınlarla çıkıp geliyor. Gri adam ağın altında hiç direnmiyor; yalnızca elini uzatıp kendisini bastıran adamın bileğini tutuyor ve sesini alçaltmadan soruyor: \"Adın ne?\"", en: "The hunters show up with nets and harpoons. The gray man doesn't fight the net at all. He just reaches out, takes hold of the wrist of the man pinning him down, and asks, without lowering his voice: \"What's your name?\"" }
          - { tr: "Avcı küfürle karışık adını haykırıyor, zıpkını şeyin göğsüne saplıyor. Şey dağılıyor. Avcı ise bir süre olduğu yerde kalıp avucunu açıyor, kapatıyor; parmaklarının ucu kül rengi.", en: "The hunter bellows his name along with a few curses and drives his harpoon into the thing's chest. It comes apart. The hunter stays where he is a while, opening and closing his hand. His fingertips are the color of ash." }
        secenekler:
          - id: "git"
            etiket: { tr: "Avcının yanına git", en: "Go over to the hunter" }
            etkiler:
              - tehlike: { kule_dibi: 2 }
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== ELLİ KAT YÜK (Bölüm 11 · Kule Dibi)
  - id: "bl11_kule_dibi_hamallar"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 206, max: 228 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["kule", "lonca", "kesif"]
    gerilim: 2
    kart: { tr: "Elli kat yük", en: "Fifty floors of freight" }
    sahne: "bl11_kule_dibi_hamallar_1"
    sahneler:
      - id: "bl11_kule_dibi_hamallar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin merdiven ağzında hamallar sıraya girmiş. Sırtlarına kendi boylarında çuvallar bağlanmış; ellinci kattan aşağı iniyor, tartıya bırakıp yeniden yukarı tırmanıyorlar. Çuvallardan ince ince beyaz bir toz sızıyor ve merdivenin her basamağını tuz kabuğu kaplamış.", en: "The porters are lined up at the mouth of the Spire's stairwell. Each one has a sack as tall as he is strapped to his back. They come down from the fiftieth floor, drop the load on the scale, and climb back up. A fine white powder leaks from the sacks, and every step on the stairs is crusted with salt." }
          - { tr: "Tartının başında Lonca yeleği giymiş bir hamal başı oturuyor, kat başına ödenen bakırları sayıyor. \"Tuz {yer:sanayi|e} gidiyor,\" diyor merakla bakana. \"Ocak sahipleri kilosuna altın veriyor. Neden mi? Sormadım, sormam da.\"", en: "Sitting by the scale is a porter boss in a Guild vest, counting out the coppers they pay by the floor. \"Salt goes to {yer:sanayi},\" he tells anybody who looks curious. \"Forge owners pay gold by the pound. Why? Didn't ask. Not gonna.\"" }
          - { tr: "Sıranın ortasında on beşinde bir oğlan var. Çuval ona fazla büyük; kayışlar omuzlarını kesmiş. Babası dün otuz birinci katta yığılıp kalmış, oğlan bu sabah onun yerine sıraya girmiş.", en: "In the middle of the line is a fifteen-year-old kid. The sack is too big for him and the straps have cut into his shoulders. His dad collapsed on the thirty-first floor yesterday, and the kid took his spot in line this morning." }
          - metin: { tr: "Hamalların ellerine dikkat ediyorsun: parmak uçları gri, tırnak diplerine kadar. İçlerinde en eskileri ellerini cebinden çıkarmıyor.", en: "You notice the porters' hands. Their fingertips are gray, right down to the nail beds. The ones who've been at it longest keep their hands in their pockets." }
            kosul: { herhangi: [{ bayrak: "bl11_kirpinti_olduruldu" }, { bayrak: "bl11_kirpinti_adlandi" }, { bayrak: "batik_varildi" }] }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Tuzun içinde ışık var. Pek az, kum tanesi kadar; bir kapı kristalinin kırıntısı gibi atıp duruyor.", en: "There's light in that salt. Not much, grains of it, pulsing like crumbs off a Gate crystal." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu tuz değil. bu, öbür taraftakilerin seviyesinden geriye kalan. biri onları toplamış, biri de çuvala koyup taşıtıyor.", en: "that isn't salt. that's what's left of the levels of the people on the other side. somebody collected them, and somebody else is bagging them up and having them hauled." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Elli kat, sırtında çuvalla. Antrenman diye para versinler bari.\"", en: "\"Fifty floors with a sack on your back. Call it training and they should pay extra.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çocuğun omuzları. Bak, kayış etine gömülmüş. Bir tur daha çıkarsa babasının yanına yatacak.\"", en: "\"Look at that kid's shoulders. The straps are buried in the skin. One more trip up and he'll be lying next to his father.\"" }
        secenekler:
          - id: "tasi"
            tur: "gosteris"
            etiket: { tr: "Oğlanın çuvalını sen al, elli katı bir solukta çık", en: "Take the kid's sack and climb all fifty floors in one go" }
            gerekli: { stat: { str: 220 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 2 }
            sonraki: "bl11_kule_dibi_hamallar_tasi"
          - id: "ucret"
            etiket: { tr: "Hamal başıyla kat başı ücreti konuş", en: "Talk to the porter boss about the per-floor rate" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "bl11_kule_dibi_hamallar_ucret"
          - id: "tuz"
            etiket: { tr: "Çuvaldan sızan tuzu avucuna al, yakından bak", en: "Catch some of the leaking salt and take a close look" }
            gerekli: { stat: { int: 220 } }
            etkiler:
              - bayrak: "bl11_tuz_anlasildi"
              - tohum: { olay: "bl11_sanayi_tuz_kazani", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Kule'nin merdivenlerinden indirilen tuzun peşine düştün; çuvallar {yer:sanayi|in} eski boyahanesine gidiyordu.", en: "You followed the salt coming down the Spire stairs. The sacks were going to the old dye works in {yer:sanayi}." } }
            sonraki: "bl11_kule_dibi_hamallar_tuz"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} tuzu ölçsün", en: "Have {npc:mert_kilic} run a reading on the salt" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 3 } }
              - bayrak: "bl11_tuz_anlasildi"
              - tohum: { olay: "bl11_sanayi_tuz_kazani", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "{npc:mert_kilic|in} ölçüm cihazı o tuzdan sonra iki gün susmadı. Çuvallar {yer:sanayi|in} eski boyahanesine gidiyordu.", en: "{npc:mert_kilic|pos} meter didn't shut up for two days after that salt. The sacks were going to the old dye works in {yer:sanayi}." } }
            sonraki: "bl11_kule_dibi_hamallar_tuz"
          - id: "lonca"
            etiket: { tr: "Halkanı göster; çocuğu sıradan çıkart", en: "Show your ring. Get the kid pulled from the line" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 1 }
            sonraki: "bl11_kule_dibi_hamallar_lonca"

      - id: "bl11_kule_dibi_hamallar_tasi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kayışları oğlanın omzundan çözüp çuvalı sırtına vuruyorsun. Elli kat merdiven, rüzgâr yiyen sahanlıklar, tuz kaplı basamaklar... Hamallar bir turu yarım günde atıyor. Sen merdivenin ağzına geri döndüğünde hamal başının bakırları saymayı bitirmemiş.", en: "You unbuckle the straps from the kid's shoulders and sling the sack onto your back. Fifty floors of stairs, wind-blasted landings, salt-crusted steps... the porters make one round trip in half a day. When you get back down to the bottom, the porter boss hasn't finished counting his coppers." }
          - { tr: "Yol boyunca çuvalın değdiği yerde tenin karıncalanıp duruyor. Pencerenin kenarında bir satır yanıp sönüyor: [Öz kalıntısı emildi.] Sonra bir tane daha.", en: "All the way up, your skin prickled wherever the sack touched it. A line kept flickering at the edge of your window: [Essence residue absorbed.] Then another one." }
          - { tr: "Oğlan sana bakıyor; teşekkür etmesi gerektiğini biliyor, ama ağzından çıkan şu oluyor: \"Babam kırk yıl taşıdı bunları. Hiç bir solukta çıkmadı.\"", en: "The kid stares at you. He knows he's supposed to say thanks, but what comes out is: \"My dad hauled these for forty years. He never made it up in one go.\"" }
        secenekler:
          - id: "tuz"
            etiket: { tr: "Tuzun nereye gittiğini öğren", en: "Find out where the salt goes" }
            etkiler:
              - tohum: { olay: "bl11_sanayi_tuz_kazani", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Sırtına değdikçe pencereni çınlatan o tuzun peşine düştün; çuvallar {yer:sanayi|in} eski boyahanesine gidiyordu.", en: "You went looking for that salt, the stuff that set your window chiming every time it touched your back. The sacks were going to the old dye works in {yer:sanayi}." } }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "para"
            etiket: { tr: "Kazandığın bakırları oğlanın avucuna koy", en: "Press the coppers you earned into the kid's hand" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kule_dibi_hamallar_ucret"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hamal başı seni dinlerken bakırları saymayı bırakmıyor. \"Kat başı üç bakır,\" diyor. \"Lonca böyle yazmış. Ben yazmadım, ben ödüyorum.\"", en: "The porter boss keeps counting coppers while you talk. \"Three coppers a floor,\" he says. \"That's what the Guild wrote down. I didn't write it. I just pay it.\"" }
          - { tr: "Sıradaki hamallar susmuş, sizi dinliyor. Birinin elindeki su şişesi yarı yolda kalmış.", en: "The porters in line have gone quiet, listening. One of them has a water bottle stopped halfway to his mouth." }
        secenekler:
          - id: "baski"
            etiket: { tr: "\"Kat başı beş. Yoksa bugün kimse çıkmıyor.\"", en: "\"Five a floor. Or nobody climbs today.\"" }
            zar: { stat: "cha", zorluk: 300, tek: true, basarisiz: "bl11_kule_dibi_hamallar_ret", basarisiz_etkiler: [{ itibar: { lonca: -1 } }] }
            etkiler:
              - itibar: { lonca: -2 }
              - bayrak: "bl11_hamal_ucreti"
            sonraki: "bl11_kule_dibi_hamallar_kabul"
          - id: "ode"
            etiket: { tr: "Bugünkü farkı kendi cebinden öde", en: "Cover today's difference out of your own pocket" }
            etkiler:
              - kredi: -300
              - ahlak: { merhamet: 2 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_kule_dibi_hamallar_kabul"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hamal başı bakırları bırakıp sıraya bakıyor. Elli çift gri parmak, elli çift yorgun göz ona dikilmiş. \"Beş,\" diyor sonunda, dişlerinin arasından. \"Lonca'ya ben söylemem. Sen söylersin.\"", en: "The porter boss puts down his coppers and looks at the line. Fifty pairs of gray fingers, fifty pairs of tired eyes, all on him. \"Five,\" he says at last, through his teeth. \"I'm not the one telling the Guild. You are.\"" }
          - { tr: "Sıra kıpırdanıyor. On beşindeki oğlan, babasının yarım kalan turunu tamamlamak için çuvalını yeniden sırtına alıyor; bu kez kayışların altına birisi bir bez parçası sıkıştırmış.", en: "The line starts moving. The fifteen-year-old shoulders his sack again to finish the trip his dad couldn't. This time somebody's stuffed a rag under the straps." }
        secenekler:
          - id: "git"
            etiket: { tr: "Oğlanın merdivende kayboluşunu izle", en: "Watch the kid disappear up the stairs" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kule_dibi_hamallar_ret"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hamal başı gülüp başını sallıyor. \"Bugün kimse çıkmazsa yarın başkaları çıkar,\" diyor. \"Pazarda çuval taşımaya can atan bin kişi var.\"", en: "The porter boss laughs and shakes his head. \"Nobody climbs today, somebody else climbs tomorrow,\" he says. \"There's a thousand people in that market dying to haul a sack.\"" }
          - { tr: "Sıradakiler bakışlarını yere indiriyor. Su şişesi sonunda dudaklara varıyor. Oğlan ağzını açmadan merdivene yürüyor.", en: "The porters drop their eyes. The water bottle finally makes it to a mouth. The kid walks to the stairs without a word." }
        secenekler:
          - id: "git"
            etiket: { tr: "Merdivenin ağzından çekil", en: "Step away from the stairwell" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl11_kule_dibi_hamallar_tuz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tuz avucunda serin; ama serinliğin altında başka bir şey kıpırdıyor, nabız gibi. Taneleri parmak uçlarında ezdikçe pencerenin kenarında soluk bir satır beliriyor: [Öz kalıntısı: tanımsız Katman.]", en: "The salt is cool in your palm, but under the cool something stirs, like a pulse. Every time you crush a grain between your fingertips, a faint line shows up at the edge of your window: [Essence residue: unidentified Layer.]" }
          - metin: { tr: "{npc:mert_kilic} cihazını tuza yaklaştırır yaklaştırmaz ekran kıpkırmızı kesiliyor. \"Bu tuz değil,\" diyor fısıltıyla. \"Bu bir veri tabanı. Sıkıştırılmış. Birilerinin seviyeleri... kilo kilo.\"", en: "The second {npc:mert_kilic} brings his meter near the salt, the screen goes solid red. \"This isn't salt,\" he whispers. \"It's a database. Compressed. Somebody's levels... by the pound.\"" }
            kosul: { yoldas: "mert_kilic" }
          - { tr: "Hamal başı seni süzüyor. \"Bir avuç tuzla bu kadar ilgilenen olmamıştı,\" diyor. \"Merak ediyorsan {yer:sanayi|e} git, eski boyahaneye. Kazanları orada.\"", en: "The porter boss is sizing you up. \"Never had anybody this interested in a handful of salt,\" he says. \"You're curious, go to {yer:sanayi}. The old dye works. That's where the vats are.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Tuzu bir beze sarıp cebine koy", en: "Wrap the salt in a rag and pocket it" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kule_dibi_hamallar_lonca"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halkanı görünce hamal başı ayağa fırlıyor. Oğlanın çuvalını çözdürüp adını defterden siliyor; \"Usta öyle diyorsa öyle,\" diye mırıldanıyor.", en: "The porter boss jumps to his feet when he sees your ring. He has the kid's sack unbuckled and crosses his name out of the ledger. \"If the boss says so, the boss says so,\" he mutters." }
          - { tr: "Oğlan sevinmiyor. Kayışların bıraktığı kırmızı izleri ovuştururken sana bakıyor. \"Babam bu ay çalışamaz,\" diyor. \"Şimdi kim taşıyacak?\"", en: "The kid doesn't look happy. He rubs the red marks the straps left and looks at you. \"My dad can't work this month,\" he says. \"So who's hauling now?\"" }
        secenekler:
          - id: "is"
            etiket: { tr: "\"Sığınak'ın deposuna git, adımı ver.\"", en: "\"Go to the Haven storeroom. Give them my name.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey diyemeden uzaklaş", en: "Walk away without an answer" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== TUZ KAZANI (Bölüm 11 · Sanayi)
  - id: "bl11_sanayi_tuz_kazani"
    konum: ["sanayi"]
    perde: [3]
    bolge: ["sanayi"]
    gun: { min: 206, max: 229 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["sanayi", "lonca", "cok_evren", "kesif"]
    gerilim: 2
    kart: { tr: "Tuz kazanı", en: "The salt vats" }
    sahne: "bl11_sanayi_tuz_kazani_1"
    sahneler:
      - id: "bl11_sanayi_tuz_kazani_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "{yer:sanayi|in} eski boyahanesinde boya kazanları yeniden yanıyor, ama içlerinde boya kaynamıyor. Kazanların ağzından ağır, tuzlu bir buhar yükseliyor; tavana çarpıp yoğuşuyor, soluk mavi damlalar halinde tahta oluklara süzülüyor.", en: "At the old dye works in {yer:sanayi}, the dye vats are lit again, but there's no dye in them. A heavy, salty steam rolls off the top, hits the ceiling, condenses, and drips pale blue into wooden troughs." }
          - { tr: "Olukların sonunda, kurumuş tuz kalıpları küçük küçük kesilip tezgâha diziliyor. Önünde bir kuyruk: liman işçileri, yaşlılar, okul önlüklü çocuklar. Her biri bir bakır uzatıp bir kalıp alıyor, diliyle bir kez yalıyor ve penceresine bakıyor. [+3 XP]", en: "At the end of the troughs, the dried salt gets cut into little cakes and lined up on a counter. There's a line in front of it: dockworkers, old folks, kids in school uniforms. Each one hands over a copper, takes a cake, licks it once, and checks their window. [+3 XP]" }
          - { tr: "Tezgâhın arkasında kolları bileklerine kadar mavi lekeli eski bir boya ustası kadın duruyor. Kazanları o yakmış, Lonca da ruhsatını vermiş. \"Seviye şekeri,\" diyor gülerek. \"Kapıya girmeden, kan dökmeden. Kim istemez?\"", en: "Behind the counter stands an old dye master, a woman with blue stains up to her wrists. She lit the vats, and the Guild gave her the permit. \"Level candy,\" she says, grinning. \"No Gates, no bloodshed. Who wouldn't want some?\"" }
          - metin: { tr: "Kuyruğun başındaki işçilerin dudakları gri. En öndeki adamın dili de; konuşurken bunu saklamaya uğraşmıyor bile.", en: "The workers at the front of the line have gray lips. The guy at the very front has a gray tongue too, and he's not even trying to hide it when he talks." }
            kosul: { stat: { per: 180 } }
          - metin: { tr: "Bu tuzu Kule'nin merdivenlerinde görmüştün; hamalların sırtında, elli kat aşağı inerken.", en: "You saw this salt on the Spire stairs, on the porters' backs, coming down fifty floors." }
            kosul: { bayrak: "bl11_tuz_anlasildi" }
          - metin: { tr: "Kazanların üstündeki yağlı tabelada Lonca'nın demir halkası var; altında yeni boyanmış bir satır: Sanayi Odası ruhsatıyla.", en: "On the greasy sign over the vats is the Guild's iron ring, and under it a freshly painted line: Licensed by the Ironworks Board." }
            kosul: { bayrak: "cekirdek_lonca" }
        sezgiler:
          - kosul: { stat: { int: 220 } }
            metin: { tr: "Buharın tadında bir şey var: bir sesin, bir adın kırıntısı. Kalıpları yalayanlar seviye değil, başkalarının seviyesinden arta kalanı yalıyor.", en: "There's something in the taste of that steam: a crumb of a voice, of a name. The people licking those cakes aren't getting levels. They're getting what's left of somebody else's." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "nehhaların seviyelerini başakçı topladı. başakçının düşürdüklerini de biri tuzla birlikte buraya taşıdı. hasat bitmemiş. el değiştirmiş.", en: "the gleaner collected the nehha's levels. somebody hauled what it dropped back here with the salt. the harvest isn't over. it just changed hands." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kalıbı kaç? Şaka, şaka. Ama kaç?\"", en: "\"How much for a cake? Kidding, kidding. But how much?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Şu dudaklara bak. Siyanoz değil bu. Hiç böyle bir şey görmedim.\"", en: "\"Look at those lips. That's not cyanosis. I've never seen anything like it.\"" }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Kazanların altındaki ateşi söndür", en: "Put out the fires under the vats" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -2 }
              - itibar: { lonca: -3 }
              - bayrak: "bl11_tuz_kazani_kapandi"
              - tehlike: { sanayi: -3 }
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Boyahanenin kuyruğunun başındaki işçiyi Sığınak'ın koğuşuna taşıdılar; dudaklarından başlayan gri artık boynundaydı.", en: "They carried the worker from the front of the dye-works line into the Haven ward. The gray that started on his lips was down to his neck now." } }
            sonraki: "bl11_sanayi_tuz_kazani_sondur"
          - id: "anlat"
            etiket: { tr: "Kuyruktakilere tuzun ne olduğunu anlat", en: "Tell the people in line what the salt really is" }
            goster: { herhangi: [{ bayrak: "bl11_tuz_anlasildi" }, { bayrak: "batik_varildi" }, { stat: { int: 220 } }] }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "bl11_tuz_anlatildi"
              - tohum: { olay: "bl11_us_soluk_hasta", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229, npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Boyahanenin kuyruğunun başındaki işçiyi Sığınak'ın koğuşuna taşıdılar; dudaklarından başlayan gri artık boynundaydı.", en: "They carried the worker from the front of the dye-works line into the Haven ward. The gray that started on his lips was down to his neck now." } }
            sonraki: "bl11_sanayi_tuz_kazani_anlat"
          - id: "tat"
            etiket: { tr: "Bir kalıp al, sen de yala", en: "Buy a cake and lick it yourself" }
            etkiler:
              - yozlasma: 2
              - ahlak: { insanlik: -1 }
            sonraki: "bl11_sanayi_tuz_kazani_tat"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|in} uzandığı kalıbı elinden al", en: "Take the cake out of {npc:aras_kurt|pos} hand" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 2, guven: -1 } }
            sonraki: "bl11_sanayi_tuz_kazani_aras"
          - id: "lonca"
            etiket: { tr: "Kazana Lonca adına el koy", en: "Seize the vats in the Guild's name" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { lonca: 2 }
              - bayrak: "bl11_tuz_kazani_loncada"
            sonraki: "bl11_sanayi_tuz_kazani_lonca"

      - id: "bl11_sanayi_tuz_kazani_sondur"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kazanların altındaki kömürü kürekle dışarı saçıp üstüne kova kova su döküyorsun. Boyahane bir anda tısırtılı bir buhara boğuluyor; buhar dağıldığında olukların ucundaki mavi damlalar kesilmiş.", en: "You shovel the coal out from under the vats and dump bucket after bucket of water on it. The dye works chokes on hissing steam, and when it clears, the blue drips at the ends of the troughs have stopped." }
          - { tr: "Boya ustası kadın kollarını kavuşturmuş, ağzını açmadan seni izliyor. Kuyruktakiler kimi söylene söylene, kimi rahatlamış gibi dağılırken en öndeki gri dudaklı adam olduğu yerde kalıyor. \"Ben şimdi ne yapacağım?\" diye soruyor. \"Yarısını yaladım. Ya geri kalanı?\"", en: "The dye master has her arms crossed and watches you without a word. The line breaks up, some people grumbling, some looking relieved. The gray-lipped man at the front stays put. \"So what do I do now?\" he asks. \"I already licked half of it. What about the rest?\"" }
        secenekler:
          - id: "kogus"
            etiket: { tr: "\"Sığınak'ın koğuşuna git. Ben de geleceğim.\"", en: "\"Go to the Haven ward. I'll be there too.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_sanayi_tuz_kazani_anlat"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tezgâhın önüne çıkıp anlatıyorsun: başka bir dünyayı, oranın denize gömülmüş kulelerini, Sistem'in artık göremediği insanları, onların seviyelerini toplayan şeyi. Bu tuzun, o şeyin elinden dökülenler olduğunu.", en: "You step up in front of the counter and tell them. About another world, its drowned towers, the people the System can't see anymore, the thing that collected their levels. About how this salt is what fell out of that thing's hands." }
          - { tr: "Kuyruk yarıya iniyor. Kalanlar gözlerini kaçırıp yerlerinden kıpırdamıyor; okul önlüklü bir çocuk kalıbı ağzına götürmeden önce bir an duraksıyor, sonra yine de yalıyor.", en: "The line drops by half. The ones who stay won't look at you and don't move. A kid in a school uniform stops for a second before bringing the cake to his mouth, then licks it anyway." }
          - { tr: "Boya ustası omuz silkiyor. \"Kapıdan gelen kristalin içinde ne var sanıyorsun?\" diyor. \"Onu da birileri ölürken bırakıyor. Kimse sormuyor.\"", en: "The dye master shrugs. \"What do you think's in the crystals that come out of the Gates?\" she says. \"Somebody leaves those behind when they die too. Nobody asks.\"" }
        secenekler:
          - id: "cevap"
            etiket: { tr: "\"Artık biri sordu.\"", en: "\"Well, now somebody's asking.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Cevap vermeden çık", en: "Leave without answering" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_sanayi_tuz_kazani_tat"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kalıbı diline değdirdiğin an ağzının içi denizle doluyor. Sonra bir ses geliyor, uzaktan: bir kadın, bir çocuğu adıyla çağırıyor. Ad dilinin ucunda eriyip yok oluyor, yerinde bir sıcaklık kalıyor.", en: "The second the cake touches your tongue, your mouth fills with the sea. Then a voice, far off: a woman calling a child by name. The name melts on the tip of your tongue and is gone, and a warmth is left where it was." }
          - { tr: "Pencerende bir satır yanıyor: [+3 XP]. Senin seviyende bu bir damla bile değil. Yine de o kadının sesi kulağında kalıyor ve çocuğun adını hatırlayamıyorsun.", en: "A line lights up in your window: [+3 XP]. At your level that isn't even a drop. But the woman's voice stays in your ear, and you can't remember the child's name." }
          - metin: { tr: "{npc:yanki} hiç susmadığı kadar susuyor. Sonra fısıldıyor: bunu bir daha yapma. lütfen. o adlar benim gibi kalıyor sonra. yarım.", en: "{npc:yanki} goes quieter than it has ever been. Then it whispers: don't do that again. please. those names end up like me after. half." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "tukur"
            etiket: { tr: "Kalanını yere tükür", en: "Spit the rest on the floor" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "bitir"
            etiket: { tr: "Kalıbı sonuna kadar bitir", en: "Finish the whole cake" }
            etkiler:
              - yozlasma: 2
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_sanayi_tuz_kazani_aras"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:aras_kurt} parmaklarını kalıba kapattığı anda bileğini yakalıyorsun. Kaşlarını kaldırıp sana bakıyor. \"Herkes yalıyor,\" diyor. \"Bir ben mi yalamayayım?\"", en: "Right as {npc:aras_kurt} closes his fingers on the cake, you catch his wrist. He raises an eyebrow at you. \"Everybody's licking them,\" he says. \"I'm the only one who doesn't get to?\"" }
          - { tr: "Ona tuzun nereden geldiğini, kimin olduğunu söylüyorsun. Kalıbı bir süre avucunda tartıyor, sonra tezgâha geri bırakıyor. \"Başkasının merdiveninden çıkmam,\" diyor. \"Zirveye kendi basamağımla varacağım. Ama bunu bana senin söylemen sinirimi bozdu, bilesin.\"", en: "You tell him where the salt came from, whose it was. He weighs the cake in his palm a while, then sets it back on the counter. \"I don't climb anybody else's ladder,\" he says. \"I'm getting to the top on my own rungs. But it bugs me that you're the one who had to tell me. Just so you know.\"" }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Birlikte kazanların ateşini söndürün", en: "Put out the fires under the vats together" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -2 }
              - itibar: { lonca: -3 }
              - bayrak: "bl11_tuz_kazani_kapandi"
              - tehlike: { sanayi: -3 }
              - iliski: { aras_kurt: { saygi: 2 } }
            sonraki: "bl11_sanayi_tuz_kazani_sondur"
          - id: "git"
            etiket: { tr: "Boyahaneden çıkın", en: "Walk out of the dye works" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_sanayi_tuz_kazani_lonca"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halkanı tezgâha vurunca boya ustası gülmeyi kesiyor. Ruhsatı Lonca vermiş, Lonca geri de alır; bunu ikiniz de biliyorsunuz.", en: "When you rap your ring on the counter, the dye master stops grinning. The Guild gave her the permit, the Guild can take it back, and you both know it." }
          - { tr: "Kazanlar sönmüyor; yalnızca sahipleri değişiyor. Ertesi sabah tezgâhın önündeki kuyruk dağılmış, kalıplar sandıklara doluyor. Artık bakır karşılığı değil, Lonca'nın avcılarına tayın olarak dağıtılacaklar.", en: "The vats don't go out. They just change owners. By the next morning the line in front of the counter is gone and the cakes are going into crates. They're not for sale for coppers anymore. They'll be handed out to Guild hunters as rations." }
          - { tr: "Hangisinin daha iyi olduğunu kestiremiyorsun. Boyahanenin kapısından çıkarken gri dudaklı adam hâlâ kapının önünde bekliyor.", en: "You can't tell which is better. On your way out of the dye works, the gray-lipped man is still waiting outside the door." }
        secenekler:
          - id: "git"
            etiket: { tr: "Adamın yanından geç", en: "Walk past him" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== PUL YAZICI (Bölüm 11 · Kordon)
  - id: "bl11_kordon_pul_yazici"
    konum: ["kordon"]
    perde: [3]
    bolge: ["kordon"]
    gun: { min: 206, max: 228 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "kervan", "kadimler", "kesif"]
    gerilim: 2
    kart: { tr: "Pul yazıcı", en: "The chit scribe" }
    sahne: "bl11_kordon_pul_yazici_1"
    sahneler:
      - id: "bl11_kordon_pul_yazici_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Lodos {yer:kordon|in} kırık iskelesini dövüp duruyor. İskelenin ucuna katlanır, pirinç bir masa kurulmuş; başında uzun boylu, ince, altı parmaklı bir kadın oturuyor. Derisi pirinç pullarla kaplı, ama pulların arasında yer yer boş yuvalar göze çarpıyor; sökülmüş dişlerin yeri gibi.", en: "The southwest wind keeps pounding the broken pier on {yer:kordon}. Out at the end of it, someone's set up a folding brass table. At it sits a tall, thin, six-fingered woman, her skin covered in brass chits, with empty sockets here and there between them, like the gaps where teeth got pulled." }
          - { tr: "Önünde bir kuyruk var: {yer:kordon|in} harabelerinde yaşayanlar, kayıkçılar, bir iki çocuklu kadın. Kâtip her birinin adını sorup ince bir kalemle boş bir pirinç pula kazıyor, pulu bir sandığa atıyor, sonra yanındaki çuvaldan bir somun ekmek uzatıyor. Ad başına bir somun.", en: "There's a line in front of her: people who live in the ruins of {yer:kordon}, boatmen, a couple of women with kids. The scribe asks each one their name, scratches it onto a blank brass chit with a fine stylus, drops the chit in a chest, and hands over a loaf from the sack beside her. One loaf per name." }
          - { tr: "Masanın arkasında, pirinç zırhlı bir muhafız heykel gibi dikiliyor. Yüzü yok; yüzünün yerinde dalgaları yansıtan cilalı bir levha var.", en: "Behind the table, a guard in brass armor stands like a statue. It has no face, just a polished plate where a face should be, reflecting the waves." }
          - { tr: "Sıra sana gelince kâtip kalemini bırakıyor. Konuşmadan önce, kendi halkının adetince, sana küçük bir pul uzatıyor.", en: "When it's your turn, the scribe puts down her stylus. Before she says anything, the way her people do, she hands you a little chit." }
          - metin: { tr: "O ellerin, o pulların nereden geldiğini biliyorsun: {yer:pirinc_kervan}. Her pul bir hece; her boş yuva satılmış bir hece.", en: "You know where hands like those, chits like those, come from: {yer:pirinc_kervan}. Every chit's a syllable. Every empty socket is a syllable that got sold." }
            kosul: { bayrak: "kervan_varildi" }
          - metin: { tr: "{yer:kordon} düştüğünden beri buralarda ekmek bulmak zor. Kuyruğun bu kadar uzun olmasının nedeni de bu.", en: "Ever since {yer:kordon} fell, bread's been hard to come by around here. That's why the line is this long." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { int: 220 } }
            metin: { tr: "Kâtip pullara yalnızca ad yazmıyor; her adın yanına iki küçük işaret ekliyor: biri yaş, biri kademe. Bu bir defter değil, bir envanter.", en: "The scribe isn't just writing names on those chits. Next to each one she adds two little marks: an age and a Grade. That's not a ledger. That's an inventory." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu bir sayım. sayılan şey er geç satılır. pirinç kervanda da böyle başlamış. bir somun ekmekle.", en: "this is a census. whatever gets counted gets sold, sooner or later. that's how it started on the brass caravan too. with a loaf of bread." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Veri toplama. Ekmek karşılığında. Ders kitabı örneği. İnsanlık kendi kaydını bir somuna satıyor.\"", en: "\"Data harvesting. In exchange for bread. Textbook case. Humanity's selling its own records for a loaf.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ama ekmek veriyor. İnsanlar aç. Bunu da unutma.\"", en: "\"She's handing out bread, though. People are hungry. Don't forget that part.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Kâtibin uzattığı pulu oku", en: "Read the chit the scribe handed you" }
            gerekli: { stat: { int: 220 } }
            etkiler:
              - bayrak: "bl11_katip_pulu"
              - tohum: { olay: "bl11_kervan_karsi_agirlik", gecikme: { min: 1, max: 3 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "{yer:kordon|in} kâtibinin pulu cebinde, Kule'nin ellinci katına tırmandın. {yer:pirinc_kervan|in} kıç güvertelerinde bir aile kurtarılmayı bekliyordu.", en: "With the chit from the scribe on {yer:kordon} in your pocket, you climbed to the Spire's fiftieth floor. Down on {yer:pirinc_kervan|pos} stern decks, a family was waiting to be pulled out." } }
            sonraki: "bl11_kordon_pul_yazici_oku"
          - id: "devir"
            tur: "gosteris"
            etiket: { tr: "Masayı devir, pulları denize saç", en: "Flip the table. Scatter the chits into the sea" }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: -2, merhamet: -1 }
              - itibar: { kadimler: -3 }
              - iliski: { thessar: { guven: -3 } }
              - bayrak: "bl11_kutuk_denizde"
            sonraki: "bl11_kordon_pul_yazici_devir"
          - id: "ekmek"
            etiket: { tr: "Kuyruğa kendi ekmeğini dağıt; kimse adını vermesin", en: "Hand out bread of your own. Nobody gives up a name" }
            etkiler:
              - kredi: -300
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "bl11_kutuk_bos"
            sonraki: "bl11_kordon_pul_yazici_ekmek"
          - id: "yazdir"
            etiket: { tr: "Sen de sıraya gir, adını yazdır", en: "Get in line and have your name written down too" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl11_adin_kutukte"
            sonraki: "bl11_kordon_pul_yazici_yazdir"

      - id: "bl11_kordon_pul_yazici_oku"
        yer: "kordon"
        paragraflar:
          - { tr: "Pulun üstündeki tek hece avucunda ısınıyor. Sistem çeviriyor, ama cümleyi değil, bir sesi: kâtibin sesini, muhafızın duyamayacağı kadar alçak. [Bu bir sayım. Boyun Senedi'nin sizin için yazılacak satırları.]", en: "The single syllable on the chit warms in your palm. The System translates it, but not as a sentence. As a voice: the scribe's, too low for the guard to hear. [This is a census. The lines of the Neckbond that will be written for you.]" }
          - { tr: "Kâtip başını kaldırmadan sana ikinci bir pul uzatıyor, üçüncüsünü de. [Kız kardeşim ve iki çocuğu kıç güvertelerde. Karşı ağırlığın içinde. Gümrük sayımı yarın.]", en: "Without looking up, the scribe slides you a second chit, then a third. [My sister and her two children are on the stern decks. Inside the counterweight. The customs count is tomorrow.]" }
          - { tr: "Sonuncusunu verirken altı parmağı bir an seninkilere değiyor. Pul boş; üstünde tek bir hece bile yok. Kendi adından söktüğü son pul bu.", en: "As she hands you the last one, her six fingers brush yours for a second. The chit is blank. Not a single syllable on it. It's the last chit pried off her own name." }
        secenekler:
          - id: "al"
            etiket: { tr: "Boş pulu cebine koy, başınla \"tamam\" de", en: "Pocket the blank chit. Nod" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kordon_pul_yazici_devir"
        yer: "kordon"
        paragraflar:
          - { tr: "Masayı tek tekmeyle deviriyorsun. Sandık iskelenin kenarından aşağı yuvarlanıyor, yüzlerce pirinç pul güneşte bir an parlayıp lodosun kabarttığı dalgalara saçılıyor.", en: "You kick the table over. The chest tumbles off the edge of the pier, and hundreds of brass chits flash in the sun for an instant before they scatter into the wind-whipped waves." }
          - { tr: "Kuyruktakilerden biri küfrediyor; ekmek çuvalı da devrilmiş, somunlar denize kaçmış. Muhafız ağır bir adım öne çıkıp kâtibi kolundan yakalıyor. Kâtip direnmiyor; sana dönüp bakıyor, ama gözlerinde korkudan başka bir şey de var.", en: "Somebody in line swears. The bread sack went over too, and the loaves are bobbing out to sea. The guard takes one heavy step forward and grabs the scribe by the arm. She doesn't fight it. She turns to look at you, and there's something in her eyes besides fear." }
          - { tr: "Muhafız onu sürükleyip götürürken kâtip bileğinden bir pul söküp ayağının dibine fırlatıyor.", en: "As the guard drags her off, the scribe tears a chit from her wrist and flicks it at your feet." }
        secenekler:
          - id: "pul"
            etiket: { tr: "Pulu yerden al", en: "Pick up the chit" }
            etkiler:
              - bayrak: "bl11_katip_pulu"
              - tohum: { olay: "bl11_kervan_karsi_agirlik", gecikme: { min: 1, max: 3 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Kâtibin iskelede ayağının dibine fırlattığı pulda tek bir hece vardı: kıç. {yer:pirinc_kervan|in} kıç güvertelerinde birileri bekliyordu.", en: "The chit the scribe flicked at your feet on the pier had one syllable on it: stern. Somebody was waiting on {yer:pirinc_kervan|pos} stern decks." } }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_kordon_pul_yazici_ekmek"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon|in} ağzındaki fırından üç çuval ekmek aldırıp iskelenin başına yığdırıyorsun. Kuyruk kıpırdanıyor; önce birkaç kişi, sonra herkes kâtibin masasını bırakıp senin çuvallarına yürüyor.", en: "You have three sacks of bread brought over from the bakery at the head of {yer:kordon} and stacked at the foot of the pier. The line wavers. First a few people, then everyone, leave the scribe's table and walk over to your sacks." }
          - { tr: "Kâtip boş kalan masasına bakıyor, sonra sana. Kalemini kutusuna koyarken dudaklarının kenarında belli belirsiz bir şey kıpırdıyor. Muhafız hiçbir şey yapmıyor; böyle bir durum için talimatı yok.", en: "The scribe looks at her empty table, then at you. As she puts her stylus away, something faint moves at the corner of her mouth. The guard does nothing. It has no instructions for this." }
          - metin: { tr: "Ama yarın ekmek bittiğinde kuyruk yeniden kurulacak. Bunu sen de biliyorsun, o da.", en: "But tomorrow, when the bread runs out, the line will form again. You know it. So does she." }
            kosul: { stat: { wis: 180 } }
        secenekler:
          - id: "git"
            etiket: { tr: "Son somunu kâtibe uzat", en: "Hand the last loaf to the scribe" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_kordon_pul_yazici_yazdir"
        yer: "kordon"
        paragraflar:
          - { tr: "Adını söylüyorsun. Kâtip kalemi pula dayayıp ilk heceyi kazımaya başlıyor; kalem kayıyor, bir daha deniyor, bu kez ucu kırılıyor. Pul elinde ısınıp yumuşuyor, sonra ortasından çatlıyor.", en: "You tell her your name. The scribe sets the stylus to the chit and starts scratching the first syllable. The stylus slips. She tries again, and this time the tip snaps. The chit warms and softens in her hand, then cracks down the middle." }
          - { tr: "Muhafızın yüzündeki cilalı levha ilk kez sana dönüyor. Kâtip çatlak pulu sandığa değil, cebine atıyor. \"Senet seni taşımaz,\" diyor Sistem'in bulanık çevirisiyle. \"Bunu bir yere yazacaklar. Yazan ben olmak istemem.\"", en: "For the first time, the polished plate on the guard's face turns toward you. The scribe drops the cracked chit into her pocket, not the chest. \"The Bond cannot carry you,\" she says, in the System's blurry translation. \"They will write that down somewhere. I would rather it not be me.\"" }
        secenekler:
          - id: "ekmek"
            etiket: { tr: "Ekmeğini al, arkandakine ver", en: "Take your loaf and give it to the person behind you" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== KARŞI AĞIRLIK (Bölüm 11 · Pirinç Kervan)
  - id: "bl11_kervan_karsi_agirlik"
    konum: ["pirinc_kervan"]
    perde: [3]
    bolge: ["pirinc_kervan"]
    gun: { min: 207, max: 229 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "kervan", "savas", "kesif"]
    gerilim: 3
    kart: { tr: "Karşı ağırlık", en: "The counterweight" }
    sahne: "bl11_kervan_karsi_agirlik_1"
    sahneler:
      - id: "bl11_kervan_karsi_agirlik_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{yer:pirinc_kervan|in} kıç güvertelerinde makineler sözleri yutuyor; burada bağırsan bile sesin üç adım öteye varmıyor. Tavandan bir evin genişliğinde bir terazi sarkıyor. Bir kefesinde Kadimlere gidecek haraç sandıkları, öbüründe dökme pirinçten, oda büyüklüğünde karşı ağırlıklar duruyor.", en: "On {yer:pirinc_kervan|pos} stern decks the machines swallow words. Even if you yell, your voice doesn't carry three steps. A scale as wide as a house hangs from the ceiling. In one pan sit the tribute crates bound for the Ancients. In the other, room-sized counterweights of cast brass." }
          - { tr: "Pirinç zırhlı iki muhafız karşı ağırlıkların arasında dolaşıyor, her bloğa uzun bir değnekle vuruyor. Bloklar dolu ve ağır bir sesle cevap veriyor. Biri hariç: köşedeki bloğa değnek inince ses bir an boşlukta yankılanıyor, sonra içeriden biri nefesini tutmuş gibi kesiliyor.", en: "Two guards in brass armor walk among the counterweights, rapping each block with a long rod. The blocks answer with a solid, heavy sound. All but one. When the rod hits the block in the corner, the sound echoes in something hollow for a second, then cuts off, like somebody inside just held their breath." }
          - { tr: "Muhafızlar daha o bloğa varmamış. Teraziyi yağlayan yaşlı bir Tavvar sana doğru sessizce bir pul kaydırıyor. Sistem çeviriyor: [Üç kişi. Bir kadın, iki çocuk. Geçide giden yük asansörü gece kalkıyor.]", en: "The guards haven't gotten to that block yet. An old Tavvari oiling the scale quietly slides a chit your way. The System translates: [Three. One woman, two children. The freight elevator to the passage leaves tonight.]" }
          - metin: { tr: "Cebindeki boş pul ısınmaya başlıyor. {yer:kordon|in} kâtibinin ailesi bu bloğun içinde.", en: "The blank chit in your pocket starts to warm. The family of the scribe on {yer:kordon} is inside that block." }
            kosul: { bayrak: "bl11_katip_pulu" }
          - metin: { tr: "Senet kırıldığından beri muhafızların sayısı azaldı, ama alışkanlıklar kırılmadı. Değnekler hâlâ iniyor.", en: "Since the Bond broke there are fewer guards, but the habits didn't break with it. The rods still come down." }
            kosul: { bayrak: "kervan_ozgur" }
          - metin: { tr: "Senet artık senin adına yazılı; muhafızlar seni görünce değneklerini yere indirip bekliyor.", en: "The Bond's written in your name now. When the guards see you, they lower their rods and wait." }
            kosul: { bayrak: "kervan_sahibi" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Bloğun dibinde, pirincin üstünde, altı parmaklı küçük bir elin terli izi var. İçeriden, dışarıyı yoklamış.", en: "Down at the bottom of the block there's a sweaty little six-fingered handprint on the brass. Somebody inside was feeling for the outside." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burada insanlar yük diye kaçırılıyor, çünkü yük olmak insan olmaktan daha güvenli. bunu bir yerden hatırlıyorum.", en: "people here get smuggled as freight, because being freight is safer than being a person. i remember that from somewhere." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İki muhafız. Dar koridor. Ben solundakini alırım. Şaka değil, gerçekten alırım.\"", en: "\"Two guards. Narrow corridor. I'll take the one on the left. Not kidding, I really will.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O blokta ne kadar hava var? Çocuklar o kadar hava ile ne kadar dayanır?\"", en: "\"How much air is in that block? How long can kids last on that much air?\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Muhafızlarla bloğun arasına gir", en: "Step between the guards and the block" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { kadimler: -2 }
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya", "gumruk_muhafizi@dunya-15"], ortam: ["dar_gecit"], kazan: "bl11_kervan_karsi_agirlik_zafer", kaybet: "bl11_kervan_karsi_agirlik_yenilgi", kac: "bl11_kervan_karsi_agirlik_kacis" }
          - id: "defter"
            tur: "gizle"
            etiket: { tr: "Muhafızların sayım levhasında bloğun sırasını değiştir", en: "Swap the block's number on the guards' tally plate" }
            gerekli: { stat: { agi: 220 } }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: 2 }
            sonraki: "bl11_kervan_karsi_agirlik_gizli"
          - id: "emir"
            etiket: { tr: "Muhafızlara emret: bu blok sayılmadan geçecek", en: "Order the guards: this block goes through uncounted" }
            goster: { bayrak: "kervan_sahibi" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "bl11_kervan_karsi_agirlik_gizli"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt} muhafızların dikkatini dağıtsın", en: "Have {npc:aras_kurt} draw the guards off" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, guven: 2 } }
              - ahlak: { merhamet: 1 }
            sonraki: "bl11_kervan_karsi_agirlik_aras"
          - id: "karisma"
            etiket: { tr: "Karışma; burada her şey tartılıyor", en: "Stay out of it. Everything gets weighed here" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - tehlike: { pirinc_kervan: 3 }
            sonraki: "bl11_kervan_karsi_agirlik_karisma"

      - id: "bl11_kervan_karsi_agirlik_gizli"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Muhafızlar levhadaki listeyi sırayla yürüyor; köşedeki bloğa geldiklerinde levhada o yok. Değnekler bir sonraki bloğa iniyor, dolu ve ağır bir ses yükseliyor.", en: "The guards work down the list on the tally plate. When they get to the corner block, it isn't on the list anymore. The rods come down on the next block over, and it answers solid and heavy." }
          - { tr: "Gece yük asansörü kalktığında köşedeki blok da üstünde. Yaşlı Tavvar asansörün kapısını kapatmadan önce sana bir pul fırlatıyor. Bu kez çevirisi tek bir sözcük: [Hafif.]", en: "When the freight elevator goes up that night, the corner block's on it. Before he shuts the elevator gate, the old Tavvari flicks you a chit. This time the translation is a single word: [Light.]" }
        secenekler:
          - id: "gec"
            etiket: { tr: "Bloğun ardından geçide sen de geç", en: "Follow the block through the passage" }
            etkiler:
              - bayrak: "bl11_aile_kacti"
              - tehlike: { pirinc_kervan: -3 }
              - tohum: { olay: "bl11_us_tavvar_ailesi", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Pirinç bir blok, ellinci kattan Kule'nin merdivenlerine indirilip {yer:kiyikent_liman|e} taşındı. İçinden çıkanları kimse beklemiyordu.", en: "A brass block was lowered from the fiftieth floor down the Spire stairs and hauled to {yer:kiyikent_liman}. Nobody was expecting what came out of it." } }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_kervan_karsi_agirlik_aras"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:aras_kurt} gülümseyip ellerini cebine sokuyor, muhafızların tam önünden ıslık çalarak geçip haraç sandıklarından birini tekmeliyor. Sandık devriliyor, içindeki kristaller güverteye saçılmış.", en: "{npc:aras_kurt} grins, shoves his hands in his pockets, walks right past the guards whistling, and kicks over one of the tribute crates. The crystals inside go skittering across the deck." }
          - { tr: "İki muhafız birden ona dönüyor. {npc:aras_kurt} geri geri çekilirken sana göz kırpıyor: \"Ne duruyorsun? Ben bunlarla bütün gece oynarım.\"", en: "Both guards turn on him at once. As {npc:aras_kurt} backs away, he throws you a wink. \"What are you waiting for? I can play with these guys all night.\"" }
          - { tr: "Muhafızlar onu koridorun öbür ucuna kovalarken köşedeki bloğu itip yük asansörüne yanaştırıyorsun. Bloğun içinden üç yavaş vuruş geliyor.", en: "While the guards chase him to the far end of the corridor, you shove the corner block over to the freight elevator. Somebody inside knocks three times, slowly." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Asansörü yukarı gönder", en: "Send the elevator up" }
            etkiler:
              - bayrak: "bl11_aile_kacti"
              - tehlike: { pirinc_kervan: -3 }
              - tohum: { olay: "bl11_us_tavvar_ailesi", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Pirinç bir blok, ellinci kattan Kule'nin merdivenlerine indirilip {yer:kiyikent_liman|e} taşındı. İçinden çıkanları kimse beklemiyordu.", en: "A brass block was lowered from the fiftieth floor down the Spire stairs and hauled to {yer:kiyikent_liman}. Nobody was expecting what came out of it." } }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_kervan_karsi_agirlik_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "İkinci muhafız da devrilince zırhının içinden yalnızca bir avuç pirinç tozu dökülüyor. İçlerinde kimse yokmuş, bir görevden başka.", en: "When the second guard goes down, all that spills out of its armor is a handful of brass dust. There was nobody inside. Just a job." }
          - { tr: "Köşedeki bloğun yan kapağını sökünce içeriden önce sıcak, ekşi bir hava çıkıyor, sonra iki çocuk, sonra anneleri. Çocuklar gözlerini kısıp ışığa bakıyor; anne konuşmadan önce, adet olduğu üzere, sana bir pul uzatıyor. Elleri o kadar titriyor ki pul yere düşüyor.", en: "When you pry the side panel off the corner block, the first thing out is a gust of hot, sour air, then two kids, then their mother. The kids squint into the light. Before she speaks, as is the custom, the mother holds out a chit to you. Her hands are shaking so hard it falls on the floor." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Pulu yerden alıp onu geri ver; asansöre yürüyün", en: "Pick up the chit, give it back to her, and walk them to the elevator" }
            etkiler:
              - bayrak: "bl11_aile_kacti"
              - tehlike: { pirinc_kervan: -3 }
              - tohum: { olay: "bl11_us_tavvar_ailesi", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "{yer:pirinc_kervan|den} çıkardığın aile Kule'nin merdivenlerinden inip {yer:kiyikent_liman|e} vardı. Kimse onları beklemiyordu.", en: "The family you got off {yer:pirinc_kervan} came down the Spire stairs and made it to {yer:kiyikent_liman}. Nobody was expecting them." } }
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl11_kervan_karsi_agirlik_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Değnek şakağına indiğinde kulaklarında bir terazi çınlıyor; sonra hiçbir şey. Kıç güvertesinin soğuk pirinci yanağına yapışmış halde kendine geliyorsun.", en: "When the rod catches you in the temple, a scale rings in your ears, and then nothing. You come to with your cheek stuck to the cold brass of the stern deck." }
          - { tr: "Köşedeki bloğun kapağı sökülmüş, içi boş. Yaşlı Tavvar teraziyi yağlamayı sürdürüyor, gözlerini senden kaçırarak. Sana bu kez hiçbir pul uzatmıyor.", en: "The corner block's panel has been pried off, and it's empty. The old Tavvari keeps oiling the scale and won't meet your eyes. This time he doesn't slide you any chit at all." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Doğrulup güverteden çık", en: "Pick yourself up and get off the deck" }
            etkiler:
              - can: 20
              - tehlike: { pirinc_kervan: 3 }
              - bayrak: "bl11_aile_yakalandi"
            sonraki: "@akis"

      - id: "bl11_kervan_karsi_agirlik_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Muhafızlar seni kovalamıyor; dönüp köşedeki bloğa yürüyorlar ve değneklerini kaldırıyorlar.", en: "You pull back. The guards don't chase you. They turn and walk to the corner block and raise their rods." }
          - { tr: "Makineler sözleri yuttuğu için çığlığı duymuyorsun. Yalnızca yaşlı Tavvar'ın elinden yağdanlığın düştüğünü görüyorsun.", en: "The machines swallow words, so you don't hear the scream. You only see the oil can fall out of the old Tavvari's hand." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kıç güvertesinden ayrıl", en: "Leave the stern deck" }
            etkiler:
              - tehlike: { pirinc_kervan: 3 }
              - bayrak: "bl11_aile_yakalandi"
            sonraki: "@akis"

      - id: "bl11_kervan_karsi_agirlik_karisma"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Yaşlı Tavvar'ın pulunu masaya geri bırakıyorsun. Bir süre pula bakıyor, sonra yağdanlığı alıp teraziyi yağlamaya dönüyor.", en: "You set the old Tavvari's chit back down on the table. He looks at it a while, then picks up the oil can and goes back to oiling the scale." }
          - { tr: "Değnek köşedeki bloğa iniyor, boşlukta yankılanıyor ve muhafızlar duruyor. Kıç güvertesinden çıkarken arkana bakmıyorsun. Makineler o çığlığı da yutuyor.", en: "The rod comes down on the corner block, echoes in the hollow, and the guards stop. You don't look back on your way off the stern deck. The machines swallow that scream too." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - bayrak: "bl11_aile_yakalandi"
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== HAMAMDAKİ TÜRKÜ (Bölüm 11 · Eski Şehir)
  - id: "bl11_eski_sehir_hamam"
    konum: ["eski_sehir"]
    perde: [3]
    bolge: ["eski_sehir"]
    gun: { min: 206, max: 228 }
    kosul: { bolum: 11, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Hamamdaki türkü", en: "The song in the bathhouse" }
    sahne: "bl11_eski_sehir_hamam_1"
    sahneler:
      - id: "bl11_eski_sehir_hamam_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} dar bir sokağında, kubbesi çökmüş eski bir hamamın önünde mahallenin çocukları toplanmış. İçeriden bir ses geliyor: dalgaların inip kalkışına uyan, sözleri anlaşılmayan, uzun ve ağır bir türkü.", en: "On a narrow street in {yer:eski_sehir}, the neighborhood kids have gathered outside an old bathhouse with a caved-in dome. A voice is coming from inside: a long, heavy song that rises and falls like waves, the words impossible to make out." }
          - { tr: "\"Hamamda hayalet var,\" diyor çocuklardan biri, gözleri parlayarak. \"Penceresi yok. Sayısı yok. Annem yaklaşma dedi.\"", en: "\"There's a ghost in the bathhouse,\" one of the kids says, eyes shining. \"It doesn't have a window. Doesn't have a number. My mom said stay away.\"" }
          - { tr: "Sokağın başından dört avcı çıkageliyor. En öndeki, Lonca'nın ilan tahtasından kopardığı bir kâğıdı sallıyor: [Tanımsız varlık. Seviye okunamıyor. Ödül: 800 kredi.] \"Geçitten bir şey sızmış,\" diyor. \"{yer:kule_dibi|de} birinin rengini emmiş. Bu da onlardan.\"", en: "Four hunters come around the corner at the top of the street. The one in front is waving a sheet he tore off the Guild bounty board: [Unidentified entity. Level unreadable. Reward: 800 credits.] \"Something leaked through the passage,\" he says. \"Sucked the color out of somebody down at {yer:kule_dibi}. This is one of those.\"" }
          - metin: { tr: "O türküyü tanıyorsun. {yer:batik_takimada|de} her dalga vurduğunda çan kuleleri aynı ezgiyi çalıyordu.", en: "You know that song. In {yer:batik_takimada}, every time a wave hit, the bell towers rang that same tune." }
            kosul: { bayrak: "batik_varildi" }
          - metin: { tr: "{yer:kule_dibi|de}ki gri adamı sen dağıtmıştın. Bu ses ona hiç benzemiyor: o soru soruyordu, bu türkü söylüyor.", en: "You're the one who dealt with the gray man at {yer:kule_dibi}. This voice sounds nothing like it. That thing asked questions. This one sings." }
            kosul: { herhangi: [{ bayrak: "bl11_kirpinti_olduruldu" }, { bayrak: "bl11_kirpinti_adlandi" }] }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Türküde aynı birkaç ses dönüp duruyor; her dizenin sonunda başka bir ad. Kubbenin çöken yarısı sesi bir çan kulesi gibi büyütüyor.", en: "The same few sounds keep coming around in the song, and every verse ends on a different name. The collapsed half of the dome amplifies the voice like a bell tower." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çanı yok, o yüzden kendisi çalıyor. adları unutmasın diye. sayısı yok diye avlanacak.", en: "she has no bell, so she rings herself. so the names don't get forgotten. and they're going to hunt her because she doesn't have a number." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Okunamayan seviye, tanımsız varlık demek değil. Okuyan sistemin sınırı demek. Bunu Lonca'ya kim anlatacak?\"", en: "\"Unreadable level doesn't mean unidentified entity. It means the reader's got a limit. Who's gonna explain that to the Guild?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O ses yaşlı bir kadının sesi. Akciğerleri zorlanıyor. Kapı canavarı böyle nefes almaz.\"", en: "\"That's an old woman's voice. Her lungs are struggling. Gate monsters don't breathe like that.\"" }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Hamamın kapısına dikil: \"İçeride avlanacak bir şey yok.\"", en: "Plant yourself in the bathhouse door. \"Nothing in here to hunt.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -1 }
              - bayrak: "bl11_hamam_korundu"
            sonraki: "bl11_eski_sehir_hamam_kapi"
          - id: "goster"
            etiket: { tr: "Avcıları içeri al; kendi gözleriyle görsünler", en: "Bring the hunters inside. Let them see for themselves" }
            zar: { stat: "cha", zorluk: 300, tek: true, basarisiz: "bl11_eski_sehir_hamam_ret", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }] }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "bl11_hamam_korundu"
            sonraki: "bl11_eski_sehir_hamam_goster"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} ilanı Lonca'nın tahtasından silsin", en: "Have {npc:mert_kilic} wipe the listing off the Guild board" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 3, guven: 2 } }
              - ahlak: { merhamet: 1, duzen: -2 }
              - bayrak: "bl11_hamam_korundu"
              - bayrak: "bl11_ilan_silindi"
            sonraki: "bl11_eski_sehir_hamam_mert"
          - id: "ic"
            etiket: { tr: "Önce sen gir; kadına eve dönmek isteyip istemediğini sor", en: "Go in first. Ask her if she wants to go home" }
            goster: { herhangi: [{ bayrak: "batik_varildi" }, { stat: { per: 220 } }] }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - bayrak: "bl11_hamam_korundu"
            sonraki: "bl11_eski_sehir_hamam_ic"
          - id: "avci"
            etiket: { tr: "Avcılara bırak; ödül onların", en: "Leave it to the hunters. It's their bounty" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2 }
              - bayrak: "bl11_hamam_avlandi"
            sonraki: "bl11_eski_sehir_hamam_avci"

      - id: "bl11_eski_sehir_hamam_kapi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kapının mermer eşiğine çıkıp kollarını kavuşturuyorsun. Avcılar duruyor. En öndeki ilan kâğıdına, sonra sana, sonra da başının üstündeki satıra bakıyor.", en: "You step up onto the marble threshold and fold your arms. The hunters stop. The one in front looks at his bounty sheet, then at you, then at the line over your head." }
          - { tr: "\"Sekiz yüz kredi,\" diyor. \"Senin için hiçbir şey, biliyorum. Bizim için bir aylık ekmek.\" Kâğıdı katlayıp cebine sokuyor, ama sokağın başına çekildikten sonra da gözünü kapıdan ayırmıyor.", en: "\"Eight hundred credits,\" he says. \"Nothing to you, I get it. A month of bread for us.\" He folds the sheet and pockets it, but even after they fall back to the top of the street, he doesn't take his eyes off the door." }
          - { tr: "Arkandaki türkü bir an susuyor, sonra yeniden başlıyor. Bu kez daha alçak sesle.", en: "Behind you the song stops for a moment, then starts up again. Softer this time." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Avcılar dağılana kadar eşikte bekle", en: "Wait on the threshold till the hunters clear off" }
            etkiler:
              - tehlike: { eski_sehir: -2 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "ic"
            etiket: { tr: "İçeri gir, kadının yanına otur", en: "Go inside and sit with her" }
            sonraki: "bl11_eski_sehir_hamam_ic"

      - id: "bl11_eski_sehir_hamam_goster"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Avcıları birer birer içeri alıyorsun. Göbek taşının üstünde, kubbenin çökük yarısından süzülen ışığın altında, perdeli parmaklı yaşlı bir kadın oturuyor. Türküsünü kesmiyor; gözleri kapalı.", en: "You lead the hunters in one by one. On the heated marble slab, under the light coming down through the broken half of the dome, sits an old woman with webbed fingers. She doesn't stop singing. Her eyes are closed." }
          - { tr: "En öndeki avcı penceresini açıp kadına çeviriyor; pencere boş kalıyor. Pencereyi kapatıp yeniden açıyor, yine boş. Sonunda kapatıp bir daha açmıyor.", en: "The lead hunter opens his window and points it at her. It stays blank. He closes it, opens it again. Blank. Finally he closes it and doesn't open it again." }
          - { tr: "\"Babaannem de böyle söylerdi,\" diyor arkadaki avcı, kimseye bakmadan. \"Sözlerini anlamazdık.\" İlan kâğıdı kadının ayaklarının dibine düşüyor.", en: "\"My grandma used to sing like that,\" the hunter in back says, not looking at anyone. \"We never understood the words.\" The bounty sheet drops at the woman's feet." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Avcılarla birlikte sessizce dışarı çık", en: "Walk out quietly with the hunters" }
            etkiler:
              - tehlike: { eski_sehir: -2 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_eski_sehir_hamam_ret"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Avcı başı kâğıdını sallıyor. \"İçeri girmemi mi istiyorsun? Gireyim tabii,\" diyor. \"Ama elimde zıpkınla girerim. Sayısı olmayanın ne olduğu belli olmaz.\"", en: "The lead hunter waves his sheet. \"You want me to go in? Sure, I'll go in,\" he says. \"With my harpoon. You never know what something without a number is.\"" }
          - { tr: "Arkadakiler zıpkınlarını kavrıyor. Hamamın içindeki türkü susuyor; ses kesilince sokak birden çok sessiz geliyor kulağına.", en: "The ones behind him tighten their grip on their harpoons. The song inside the bathhouse stops, and with it gone, the street suddenly seems very quiet." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Kapıya geç, yolu kapat", en: "Get in the doorway and block it" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { lonca: -1 }
              - bayrak: "bl11_hamam_korundu"
            sonraki: "bl11_eski_sehir_hamam_kapi"
          - id: "cekil"
            etiket: { tr: "Kenara çekil", en: "Step aside" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - bayrak: "bl11_hamam_avlandi"
            sonraki: "bl11_eski_sehir_hamam_avci"

      - id: "bl11_eski_sehir_hamam_mert"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{npc:mert_kilic} bir duvarın dibine çömelip cihazını açıyor; parmakları ekranın üstünde uçuşuyor. \"Lonca'nın ilan tahtası Sessiz Ağ'ın eski bir sunucusunda,\" diye mırıldanıyor. \"Bunu onlara hiç söylemedik. Tamam... yok oldu.\"", en: "{npc:mert_kilic} squats against a wall and flips open his device, fingers flying over the screen. \"The Guild's bounty board runs on an old Network server,\" he mutters. \"We never told them that. Okay... gone.\"" }
          - { tr: "Sokağın başında avcı başının penceresi bir kez öterek kapanıyor. Kâğıdına bakıyor, sonra penceresine; ilan silinmiş, ödül sıfırlanmış. Küfrederek kâğıdı buruşturup geldiği yoldan geri dönüyor.", en: "At the top of the street, the lead hunter's window chimes once and closes. He looks at his sheet, then at his window. The listing's gone, the reward zeroed out. He swears, crumples the paper, and heads back the way he came." }
          - { tr: "\"Bir sonraki ilanı da silerim,\" diyor {npc:mert_kilic}, cihazını kapatırken. \"Ondan sonrakini de. Ama bunun bir sonu yok, biliyorsun. Sayısı olmayan her şeyin bir ilanı olacak.\"", en: "\"I'll wipe the next listing too,\" {npc:mert_kilic} says, shutting his device. \"And the one after that. But there's no end to it, you know. Everything without a number is gonna get a listing.\"" }
        secenekler:
          - id: "ic"
            etiket: { tr: "Hamama gir, kadına eve dönmek isteyip istemediğini sor", en: "Go into the bathhouse. Ask her if she wants to go home" }
            sonraki: "bl11_eski_sehir_hamam_ic"
          - id: "git"
            etiket: { tr: "Türküyü arkanda bırakıp yürü", en: "Leave the song behind you and walk" }
            etkiler:
              - tehlike: { eski_sehir: -2 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_eski_sehir_hamam_ic"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "İçerisi serin ve nemli. Göbek taşının üstünde perdeli parmaklı yaşlı bir kadın oturuyor; tuzdan çatlamış teni yosun kokuyor. Seni görünce türküyü kesmiyor, yalnızca bir dizeyi yarıda bırakıp bekliyor.", en: "It's cool and damp inside. On the heated marble slab sits an old woman with webbed fingers, her salt-cracked skin smelling of seaweed. When she sees you she doesn't stop singing. She just leaves one line hanging and waits." }
          - { tr: "Islak parmağıyla mermerin üstüne bir dalga çiziyor, dalganın altına bir kule, kulenin içine de bir çan. Sonra çanın içini küçük, kıvrık harflerle dolduruyor. Sistem çeviriyor: [Kurtarıcıların yüküne saklandım. Çanımı aradım. Burada çan yok. Ben söylüyorum.]", en: "With a wet finger she draws a wave on the marble, a tower under the wave, and a bell inside the tower. Then she fills in the bell with small, curling letters. The System translates: [I hid in the salvagers' cargo. I came looking for my bell. There are no bells here. So I sing.]" }
          - metin: { tr: "Çizdiği kulenin biçimini tanıyorsun; kurtarıcıların mavnasını bağladığı kule. Çanı o kuleden sökülmüş.", en: "You recognize the shape of the tower she's drawing: the one the salvagers tied their barge to. Her bell came out of that tower." }
            kosul: { herhangi: [{ bayrak: "bl11_canlar_sokuldu" }, { bayrak: "bl11_can_satildi" }] }
        secenekler:
          - id: "eve"
            etiket: { tr: "\"Seni eve, kulene götüreceğim.\"", en: "\"I'll take you home. Back to your tower.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "bl11_hamam_kadini_eve"
              - tohum: { olay: "bl11_batik_cancilar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 11, gun_max: 229 }, hatirlatma: { tr: "Hamamdaki kadın Kule'nin ellinci katına kadar senin sırtında çıktı. Öbür tarafa geçerken türküsünü yeniden söylemeye başladı.", en: "The woman from the bathhouse rode on your back all the way up to the Spire's fiftieth floor. As you stepped through to the other side, she started singing again." } }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Bir şey söyleme; türkünün sonunu dinle", en: "Don't say anything. Listen to the end of the song" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_eski_sehir_hamam_avci"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kenara çekiliyorsun. Avcılar zıpkınlarını önlerine tutup kubbenin altına giriyor. Türkü bir dizenin ortasında kesiliyor.", en: "You step aside. The hunters go in under the dome with their harpoons out in front of them. The song cuts off in the middle of a line." }
          - { tr: "Biraz sonra avcı başı dışarı çıkıyor, penceresine bakarak. Yüzü bembeyaz. \"Ödülü onaylamıyor,\" diyor. \"Sistem... seviyesi olmayan bir şeyi öldürmenin ödülünü vermiyor. Hiçbir şey öldürmemişim gibi.\"", en: "A little later the lead hunter comes out staring at his window. His face is white. \"It won't approve the bounty,\" he says. \"The System... won't pay out for killing something with no level. Like I didn't kill anything at all.\"" }
          - { tr: "Çocuklar çoktan dağılmış. Sokakta artık hiçbir ses yok.", en: "The kids are long gone. There isn't a sound left on the street." }
        secenekler:
          - id: "git"
            etiket: { tr: "Sokaktan çık", en: "Leave the street" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== SOLUK HASTA (Bölüm 11 · üs · tohum)
  - id: "bl11_us_soluk_hasta"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 11, npc_hayatta: "elif_sari" }
    etiketler: ["cok_evren", "siginak", "elif"]
    gerilim: 2
    npc: ["elif_sari"]
    kart: { tr: "Soluk hasta", en: "The fading patient" }
    sahne: "bl11_us_soluk_hasta_1"
    sahneler:
      - id: "bl11_us_soluk_hasta_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'teki koğuşun en dip yatağının çevresine bir paravan çekilmiş. {npc:elif_sari} seni paravanın arkasına alıp örtüyü kaldırıyor: yatan adamın parmak uçlarından dirseklerine kadar her yeri kül rengi. Yara yok, ateş yok, nabız düzenli; renk yalnızca çekilip gidiyor.", en: "A screen's been pulled around the last bed in the ward at the Customs House. {npc:elif_sari} brings you behind it and lifts the sheet. The man lying there is ash-gray from his fingertips to his elbows. No wound, no fever, steady pulse. The color is just draining away." }
          - metin: { tr: "Sefer künyesinin sahibi bu. Geçitten döneli dokuz gün olmuş; {yer:kule_dibi|de} senin dağıttığın şey onun ceketini giyiyordu.", en: "This is the owner of the expedition tag. He's been back through the passage nine days. The thing you took apart at {yer:kule_dibi} was wearing his jacket." }
            kosul: { herhangi: [{ bayrak: "bl11_kirpinti_olduruldu" }, { bayrak: "bl11_kirpinti_adlandi" }] }
          - metin: { tr: "Boyahanenin kuyruğundaki gri dudaklı işçi bu. Gri artık boynunu aşmış, çenesine tırmanıyor.", en: "It's the gray-lipped worker from the dye-works line. The gray's past his neck now, climbing toward his jaw." }
            kosul: { herhangi: [{ bayrak: "bl11_tuz_kazani_kapandi" }, { bayrak: "bl11_tuz_kazani_loncada" }, { bayrak: "bl11_tuz_anlatildi" }], bayrak_yok: ["bl11_kirpinti_olduruldu", "bl11_kirpinti_adlandi"] }
          - { tr: "{npc:elif_sari} hastanın Sistem penceresini açtırmış. Adının harfleri birer birer soluyor; sonuncusu neredeyse okunmuyor. \"Teşhis koyamıyorum,\" diyor. \"Ne enfeksiyon ne zehir. Sanki adamı bir yerden siliyorlar ve ben silgiyi göremiyorum.\"", en: "{npc:elif_sari} has had the patient open his System window. The letters of his name are fading one at a time, and the last one is barely legible. \"I can't make the diagnosis,\" she says. \"Not an infection, not a poison. It's like somebody's erasing him from somewhere, and I can't see the eraser.\"" }
          - { tr: "\"Öbür tarafa geçen sendin,\" diye ekliyor. \"Orada böyle bir şey gördün mü?\"", en: "\"You're the one who's been to the other side,\" she adds. \"Did you see anything like this over there?\"" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Adamın dudakları kıpırdıyor. Kendi adını mırıldanmaya çalışıyor; her seferinde bir hecesi eksik.", en: "The man's lips are moving. He's trying to mumble his own name, and every time, a syllable's missing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "adı gidiyor. adı giden şey neye dönüşür, biliyorum. ben oldum. biri onun adını söylemeli. durmadan.", en: "his name is going. i know what something turns into when its name goes. i turned into it. somebody has to say his name. over and over." }
        secenekler:
          - id: "soyle"
            etiket: { tr: "\"Adını söyleyin. Hepiniz, sırayla, durmadan.\"", en: "\"Say his name. All of you, in shifts, without stopping.\"" }
            goster: { herhangi: [{ bayrak: "batik_varildi" }, { bayrak: "bl11_canlar_kaldi" }, { bayrak: "bl11_can_alindi" }, { bayrak: "bl11_can_el_konuldu" }, { bayrak: "bl11_hamam_korundu" }, { bayrak: "yanki_bagi" }] }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { saygi: 4, guven: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl11_us_soluk_hasta", agirlik: 25 }
              - bayrak: "bl11_soluk_kurtuldu"
            sonraki: "bl11_us_soluk_hasta_soyle"
          - id: "pencere"
            etiket: { tr: "Adını kendi pencerene yaz; yükü sen taşı", en: "Write his name into your own window. Carry the weight yourself" }
            goster: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            etkiler:
              - yozlasma: 2
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 3, korku: 2 } }
              - bayrak: "bl11_soluk_kurtuldu"
            sonraki: "bl11_us_soluk_hasta_pencere"
          - id: "anlat"
            etiket: { tr: "Bildiğin her şeyi anlat, kararı ona bırak", en: "Tell her everything you know and leave the call to her" }
            etkiler:
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "bl11_us_soluk_hasta_anlat"
          - id: "ayir"
            etiket: { tr: "\"Onu koğuştan ayırın. Ne olduğunu bilmiyoruz.\"", en: "\"Get him out of the ward. We don't know what this is.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - iliski: { elif_sari: { guven: -2, saygi: 1 } }
            sonraki: "bl11_us_soluk_hasta_ayir"

      - id: "bl11_us_soluk_hasta_soyle"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} bir an sana bakıyor, sonra hemşireleri çağırıp nöbet çizelgesi yapıyor: her biri on dakika. Adı yatağın başında, alçak sesle, durmadan söyleyecekler.", en: "{npc:elif_sari} looks at you for a second, then calls the nurses over and draws up a schedule: ten minutes each. They'll say his name at the head of the bed, quietly, without stopping." }
          - { tr: "Gece yarısına doğru koğuştaki öbür hastalar da katılıyor; kimi yatağından, kimi uykusunun arasından. Bütün bir koğuş, hiç tanımadığı bir adamın adını bir çan gibi söyleyip duruyor.", en: "Toward midnight the other patients join in, some from their beds, some half asleep. A whole ward saying the name of a man none of them know, over and over, like a bell." }
          - { tr: "Sabaha karşı adamın bileklerine renk dönüyor. Penceresindeki son harf yeniden parlıyor. {npc:elif_sari} sandalyesine çöküp gözlerini ovuşturuyor. \"Fakültede bunu öğretmediler,\" diyor. \"Öğretmeleri gerekirdi.\"", en: "Near dawn, color comes back into the man's wrists. The last letter in his window brightens again. {npc:elif_sari} drops into her chair and rubs her eyes. \"They didn't teach us this in med school,\" she says. \"They should have.\"" }
        secenekler:
          - id: "sira"
            etiket: { tr: "Sıradaki on dakikayı sen al", en: "Take the next ten minutes yourself" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_us_soluk_hasta_pencere"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pencereni açıp kendi adının altına onunkini yazıyorsun. Sistem itiraz ediyor: [Uyarı: kayıt çakışması.] Sonra itirazı biri susturuyor ve satır yerine oturuyor.", en: "You open your window and write his name under yours. The System objects: [Warning: record conflict.] Then somebody shuts the objection up, and the line settles into place." }
          - { tr: "Sol elinin işaret parmağının ucu bir an griye kesiyor, sonra rengi geri geliyor. Yataktaki adamın dirseklerinden bileklerine doğru sıcak bir pembelik yürüyor.", en: "The tip of your left index finger goes gray for a moment, then its color comes back. A warm pink creeps from the man's elbows down to his wrists." }
          - { tr: "{npc:elif_sari} parmağın da dahil her şeyi görüyor, ama bir şey söylemiyor. Koğuştan çıkarken kolunu tutup seni bir an durduruyor. \"Bunun bedelini kim ödüyor?\" diye soruyor. \"Sen mi, içindeki o şey mi?\"", en: "{npc:elif_sari} sees all of it, your finger included. She doesn't say anything. But on your way out of the ward she catches your arm and stops you for a second. \"Who pays for that?\" she asks. \"You, or that thing inside you?\"" }
          - metin: { tr: "{npc:yanki} fısıldıyor: ikimiz. ama onun adı artık bizde güvende. benimki de bir zamanlar biri yazsın diye beklemişti.", en: "{npc:yanki} whispers: both of us. but his name's safe with us now. mine waited for somebody to write it down once too." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "cevap"
            etiket: { tr: "\"İkimiz.\"", en: "\"Both of us.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_us_soluk_hasta_anlat"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ona her şeyi anlatıyorsun: boğulmuş kuleleri, çanları, Sistem'in göremediği insanları, adları emen gri şeyleri. {npc:elif_sari} not almıyor; dinledikçe yüzü sertleşiyor.", en: "You tell her everything: the drowned towers, the bells, the people the System can't see, the gray things that soak up names. {npc:elif_sari} doesn't take notes. Her face just gets harder the longer she listens." }
          - { tr: "Gece boyunca elindeki her şeyi deniyor: sıcak, serum, adamla konuşmak, uyanık tutmak. Sabaha doğru gri, adamın omuzlarında durmuş; ileri gitmiyor, geri de dönmüyor.", en: "All night she tries everything she's got: warmth, IV fluids, talking to him, keeping him awake. By morning the gray has stopped at his shoulders. It isn't spreading. It isn't going back either." }
          - { tr: "\"Yaşayacak,\" diyor yorgun bir sesle. \"Yarısı griyle. Ama yaşayacak. Bir dahakine nereden başlayacağımı biliyorum hiç değilse.\"", en: "\"He'll live,\" she says, worn out. \"Half gray. But he'll live. At least next time I'll know where to start.\"" }
        secenekler:
          - id: "otur"
            etiket: { tr: "Bir süre onunla birlikte otur", en: "Sit with her for a while" }
            etkiler:
              - bayrak: "bl11_soluk_yarim"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl11_us_soluk_hasta_ayir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} itiraz etmiyor, ama yüzü itiraz ediyor. Adamı Gümrük'ün arkasındaki eski arşiv odasına taşıyorlar; kapıya bir nöbetçi dikiliyor. Kimse içeri girmiyor, kimse adını söylemiyor.", en: "{npc:elif_sari} doesn't argue, but her face does. They move the man to the old records room behind the Customs House and post a guard on the door. Nobody goes in. Nobody says his name." }
          - { tr: "Sabah nöbetçi kapıyı açtığında yatak boş. Çarşafın üstünde ince, gri bir toz tabakası var; pencere içeriden sürgülü.", en: "In the morning, when the guard opens the door, the bed is empty. There's a thin layer of gray dust on the sheet, and the window is bolted from the inside." }
          - { tr: "Bir haber geliyor: gece liman yolunda biri gelip geçenlere adlarını sormuş.", en: "Word comes in that somebody was out on the waterfront road last night, asking passersby their names." }
        secenekler:
          - id: "git"
            etiket: { tr: "Liman yoluna çık", en: "Head out to the waterfront road" }
            etkiler:
              - tehlike: { kiyikent_liman: 2 }
              - bayrak: "bl11_soluk_kayboldu"
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== PİRİNÇ BLOKTAN ÇIKANLAR (Bölüm 11 · üs · tohum)
  - id: "bl11_us_tavvar_ailesi"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 11 }
    etiketler: ["cok_evren", "kervan", "siginak"]
    gerilim: 2
    kart: { tr: "Pirinç bloktan çıkanlar", en: "Out of the brass block" }
    sahne: "bl11_us_tavvar_ailesi_1"
    sahneler:
      - id: "bl11_us_tavvar_ailesi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pirinç blok {yer:kiyikent_liman|in} balık halinin önüne bırakılmış, kapağı açık. İçinden çıkan üç kişi halin saçağının altına sığınmış: altı parmaklı, derisi pullarla kaplı bir kadın ve iki çocuk. Çevrelerinde balıkçılardan, Sığınak nöbetçilerinden, meraklılardan bir halka oluşmuş. Kimse yaklaşmıyor.", en: "The brass block's been left outside the fish market on {yer:kiyikent_liman}, lid open. The three people who came out of it are huddled under the market's eaves: a six-fingered woman with chits all over her skin, and two kids. A ring has formed around them: fishermen, Haven guards, gawkers. Nobody's getting close." }
          - { tr: "\"Kadimler bunlar,\" diyor biri. \"Kadimlerin uşakları. Arkalarından ötekiler de gelir.\" Nöbetçilerden biri tüfeğinin kayışını omzundan indiriyor.", en: "\"Those are Ancients,\" somebody says. \"The Ancients' servants. The rest'll come after them.\" One of the guards slips his rifle strap off his shoulder." }
          - { tr: "Kadın halkaya bir pul uzatıyor; kendi dilinde söz, pulsuz başlamaz. Kimse almıyor. Pul, uzattığı elinde titreyip duruyor.", en: "The woman holds out a chit to the crowd. Where she comes from, nobody speaks without paying first. Nobody takes it. The chit trembles in her outstretched hand." }
          - metin: { tr: "Yüzündeki ince çizgi {yer:kordon|in} kâtibindekinin aynısı. Kız kardeşi bu.", en: "She has the same thin line in her face as the scribe on {yer:kordon}. This is her sister." }
            kosul: { bayrak: "bl11_katip_pulu" }
          - metin: { tr: "{yer:pirinc_kervan|b} özgür kaldı ama Karanlık Rota'ya giriyor; nereye çıkacağını kimse bilmiyor. Bu aile o karanlığa girmek istememiş.", en: "{yer:pirinc_kervan|b} is free now, but it's heading into the Dark Route, and nobody knows where it comes out. This family didn't want to go into that dark." }
            kosul: { bayrak: "kervan_ozgur" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Çocukların derisindeki boş pul yuvaları parlatılmış. İkisi de seçilme yaşına yaklaşmış; ondalık günü yakında.", en: "The empty chit sockets on the kids' skin have been polished. They're both getting close to selection age. Tithe Day's coming." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "pullarla konuşuyorlar, çünkü orada her söz bir bedel. burada söz bedava. bunu onlara nasıl anlatacaksın?", en: "they talk in chits because over there every word costs something. here words are free. how are you going to explain that to them?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocukların ayakkabısı yok. Pirinç güverteden çıplak ayakla gelmişler.\"", en: "\"The kids don't have shoes. They came off that brass deck barefoot.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kadının dudakları çatlamış. Kaç gündür o bloğun içindeymiş acaba?\"", en: "\"Her lips are cracked. How many days was she in that block?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kadimlerin bunu bir sınır ihlali sayma olasılığı... bilmiyorum. Yüksek. Çok yüksek.\"", en: "\"Odds the Ancients call this a border violation... I don't know. High. Really high.\"" }
        secenekler:
          - id: "pul"
            etiket: { tr: "Kadının uzattığı pulu al", en: "Take the chit the woman's holding out" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl11_tavvar_aile_kaldi"
            sonraki: "bl11_us_tavvar_ailesi_pul"
          - id: "katip"
            etiket: { tr: "Kâtibin boş pulunu kız kardeşine ver", en: "Give the scribe's blank chit to her sister" }
            goster: { bayrak: "bl11_katip_pulu" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - itibar: { siginak: 1 }
              - bayrak: "bl11_tavvar_aile_kaldi"
            sonraki: "bl11_us_tavvar_ailesi_katip"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} çocukların yanına çömelsin", en: "Let {npc:deniz_arman} crouch down with the kids" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 3, guven: 2 } }
              - bayrak: "bl11_tavvar_aile_kaldi"
            sonraki: "bl11_us_tavvar_ailesi_deniz"
          - id: "nobet"
            etiket: { tr: "Nöbetçiye tüfeğini indirt, aileyi Gümrük'e götür", en: "Make the guard lower his rifle. Take the family to the Customs House" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl11_tavvar_aile_kaldi"
            sonraki: "bl11_us_tavvar_ailesi_gumruk"
          - id: "geri"
            etiket: { tr: "Kadimler peşlerinden gelmeden {yer:pirinc_kervan|e} geri gönder", en: "Send them back to {yer:pirinc_kervan} before the Ancients come looking" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -3 }
              - itibar: { kadimler: 1 }
              - bayrak: "bl11_tavvar_aile_dondu"
            sonraki: "bl11_us_tavvar_ailesi_geri"

      - id: "bl11_us_tavvar_ailesi_pul"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pulu alınca halkadan bir uğultu yükseliyor. Kadın gözlerini kırpıştırıyor; sanki biri ona ilk kez kapıyı açmış. Konuşmaya başlıyor ve Sistem çeviriyor: [Sığınmak istiyoruz. Bedelini ödeyecek pulumuz kalmadı. Bu son pulumdu.]", en: "When you take the chit, a murmur goes through the ring. The woman blinks like somebody's opened a door for her for the first time. She starts to talk, and the System translates: [We want shelter. We have no chits left to pay for it. That was my last one.]" }
          - { tr: "Pulu ona geri uzatıyorsun. \"Burada konuşmak için pul gerekmiyor,\" diyorsun. Sistem bunu çeviriyor mu bilmiyorsun; ama kadın pulu avucuna kapatıp iki çocuğunu birden göğsüne çekiyor ve ağlamaya başlıyor.", en: "You hand the chit back to her. \"You don't need chits to talk here,\" you say. You don't know if the System translates that. But the woman closes her fist around the chit, pulls both kids to her chest, and starts to cry." }
        secenekler:
          - id: "gumruk"
            etiket: { tr: "Onları Gümrük'e götür", en: "Take them to the Customs House" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_us_tavvar_ailesi_katip"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Boş pulu kadının avucuna bırakıyorsun. Kadın pula bakıp parmaklarıyla kenarlarını yokluyor; birden yüzü değişiyor. Bu pulun kimin derisinden söküldüğünü biliyor.", en: "You set the blank chit in the woman's palm. She looks at it, runs her fingers along the edges, and suddenly her face changes. She knows whose skin this chit was pried off." }
          - { tr: "Pulu kolundaki boş yuvalardan birine bastırıyor. Pul yerine oturuyor, sanki hep oradaymış gibi. Sistem bir satır çeviriyor: [Kardeşim bana son hecesini göndermiş. Artık onu ben söylerim.]", en: "She presses the chit into one of the empty sockets on her arm. It settles in like it was always there. The System translates a line: [My sister sent me her last syllable. Now I will say it for her.]" }
          - { tr: "Halkadakiler birbirine bakıyor. Nöbetçi tüfeğini yeniden omzuna asıyor.", en: "The people in the ring glance at each other. The guard slings his rifle back over his shoulder." }
        secenekler:
          - id: "gumruk"
            etiket: { tr: "Aileyi Gümrük'e götür", en: "Take the family to the Customs House" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl11_us_tavvar_ailesi_deniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:deniz_arman} kalkanını yere bırakıp çocukların önüne çömeliyor. Cebinden bir şişe kapağı çıkarıp küçüğe uzatıyor. Çocuk kapağı alıp evirip çeviriyor, sonra kolundan bir pul söküp karşılığında {npc:deniz_arman|e} veriyor.", en: "{npc:deniz_arman} sets down their shield and crouches in front of the kids. They pull a bottle cap out of their pocket and hold it out to the little one. The kid takes it, turns it over and over, then pries a chit off his arm and gives it to {npc:deniz_arman} in exchange." }
          - { tr: "\"Hayır hayır, sökme onu!\" diyor {npc:deniz_arman} telaşla. \"Bedava. Hediye. Bedava ne demek, biliyor musun?\" Çocuk anlamıyor. Ama halkadakilerden biri gülüyor, sonra bir başkası; balıkçılardan biri gidip iki somun ekmek getiriyor.", en: "\"No, no, don't pull those off!\" {npc:deniz_arman} says, flustered. \"It's free. A gift. You know what free means?\" The kid doesn't. But somebody in the ring laughs, then somebody else, and one of the fishermen goes and comes back with two loaves of bread." }
        secenekler:
          - id: "gumruk"
            etiket: { tr: "Aileyi Gümrük'e götürün", en: "Take the family to the Customs House together" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_us_tavvar_ailesi_gumruk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nöbetçiye başınla bir işaret ediyorsun; tüfeğini indiriyor. Halka açılıyor. Kadın çocuklarının ellerinden tutup senin peşinden yürüyor, her adımda başını eğerek.", en: "You give the guard a look. He lowers his rifle. The ring opens. The woman takes her kids by the hand and follows you, bowing her head with every step." }
          - { tr: "Gümrük'ün kapısında durup sana bir pul daha uzatıyor; teşekkürün bedeli. Bu kez alıyorsun, çünkü almazsan o teşekkür ona borç olarak kalacak.", en: "At the Customs House door she stops and holds out one more chit: the price of a thank-you. This time you take it, because if you don't, that thank-you stays on her books as a debt." }
        secenekler:
          - id: "git"
            etiket: { tr: "Pulu cebine koy", en: "Pocket the chit" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl11_us_tavvar_ailesi_geri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kadına geri dönmeleri gerektiğini söylüyorsun. Sistem çevirince kadının uzattığı pul elinden düşüyor; itiraz etmiyor. Orada hiç kimse bedava itiraz edemez.", en: "You tell the woman they have to go back. The System translates, and the chit drops out of her hand. She doesn't argue. Over there, nobody gets to argue for free." }
          - { tr: "Akşam iki nöbetçi aileyi Kule'nin merdivenlerine götürüyor. Çocuklardan büyüğü merdivenin ağzında dönüp bakıyor. Halkanın dağıldığı yerde, düşen pul hâlâ kaldırımın üstünde parlıyor.", en: "That evening two guards walk the family to the Spire stairs. The older kid turns at the mouth of the stairwell and looks back. Where the ring broke up, the dropped chit is still shining on the sidewalk." }
        secenekler:
          - id: "git"
            etiket: { tr: "Pulu orada bırak", en: "Leave the chit where it is" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · DENİZ (Bölüm 11 · Kule Dibi)
  - id: "bl11_kule_dibi_kamp_deniz"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 206, max: 229 }
    kosul: { bolum: 11 }
    kamp: true
    etiketler: ["kamp", "yoldas", "deniz"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Ellinci katın ışığı", en: "The light on the fiftieth floor" }
    sahne: "bl11_kule_dibi_kamp_deniz_1"
    sahneler:
      - id: "bl11_kule_dibi_kamp_deniz_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tırmanıcıların çadırları arasında yaktığınız ateş çıtırdıyor. Başınızın çok üstünde, Kule'nin gövdesinde ellinci kat solgun bir halka gibi yanıyor; geçit orada, gece gündüz açık.", en: "The fire you built among the climbers' tents crackles. High over your heads, the fiftieth floor glows on the body of the Spire like a pale ring. The passage is up there, open day and night." }
          - { tr: "{npc:deniz_arman} kalkanının iç kayışını onarıyor. İğneyi deriden her geçirişinde gözü bir an yukarı kayıyor. Sonunda iğneyi bırakıp anlatmaya başlıyor, sana bakmadan.", en: "{npc:deniz_arman} is mending the inner strap on their shield. Every time they push the needle through the leather, their eyes drift up for a second. Finally they put the needle down and start talking, without looking at you." }
          - { tr: "\"Dün gece yukarı çıktım,\" diyor. \"Tek başıma. Geçidin önünde bir saat durdum. Öbür tarafta birinin bağırdığını duydum, belki de duyduğumu sandım. Adım atamadım. Öbür tarafta birini kurtarırsam burada birini bırakmış olmaz mıyım diye düşündüm durdum.\"", en: "\"I went up last night,\" they say. \"By myself. Stood in front of the passage for an hour. I heard somebody yelling on the other side. Or I thought I did. I couldn't take the step. I kept thinking, if I save somebody over there, doesn't that mean I'm leaving somebody here?\"" }
          - metin: { tr: "\"Sen {yer:batik_takimada|e} gittin,\" diye ekliyor. \"Kulelere, çanlara. Peki öbür dünyadakiler? O pirinç gemidekiler? Onlar ne olacak?\"", en: "\"You went to {yer:batik_takimada},\" they add. \"The towers, the bells. So what about the other world? The people on that brass ship? What happens to them?\"" }
            kosul: { bayrak: "batik_varildi", bayrak_yok: "kervan_varildi" }
          - metin: { tr: "\"Sen {yer:pirinc_kervan|e} gittin,\" diye ekliyor. \"Teraziler, pullar. Peki öbür dünyadakiler? Boğulan kulelerdekiler? Onlar ne olacak?\"", en: "\"You went to {yer:pirinc_kervan},\" they add. \"The scales, the chits. So what about the other world? The people in those drowning towers? What happens to them?\"" }
            kosul: { bayrak: "kervan_varildi", bayrak_yok: "batik_varildi" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Kalkanın kenarına, iç tarafa, çentikler atılmış. Kimisi eski, kimisi yeni. Kurtaramadıklarını sayıyor.", en: "There are notches cut along the inside edge of the shield. Some old, some new. They're counting the ones they couldn't save." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o geçidin önünde bir saat durmuş. ben de bir zamanlar bir kapının önünde durmuştum. adım attım. pişman mıyım, hâlâ bilmiyorum.", en: "they stood in front of that passage for an hour. i stood in front of a door once too. i took the step. i still don't know if i regret it." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"Bir dahakine birlikte geçeriz. Kapıyı sen tut.\"", en: "\"Next time we go through together. You hold the door.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 4, baglilik: 2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl11_kule_dibi_kamp_deniz", agirlik: 25 }
              - bayrak: "bl11_deniz_kamp_birlikte"
            sonraki: "bl11_kule_dibi_kamp_deniz_birlikte"
          - id: "durust"
            etiket: { tr: "\"Herkesi kurtaramazsın. Ben de kurtaramıyorum.\"", en: "\"You can't save everybody. I can't either.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 3, guven: 1 } }
              - bayrak: "bl11_deniz_kamp_durust"
            sonraki: "bl11_kule_dibi_kamp_deniz_durust"
          - id: "kayis"
            etiket: { tr: "Bir şey söyleme; iğneyi al, kayışı sen bitir", en: "Don't say anything. Take the needle and finish the strap yourself" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 3 } }
            sonraki: "bl11_kule_dibi_kamp_deniz_kayis"
          - id: "centik"
            etiket: { tr: "Kalkanın içindeki çentiklere dokun", en: "Touch the notches on the inside of the shield" }
            goster: { stat: { per: 200 } }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, korku: 1 } }
            sonraki: "bl11_kule_dibi_kamp_deniz_centik"

      - id: "bl11_kule_dibi_kamp_deniz_birlikte"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre ateşe bakıyor, sonra başını sallıyor. \"Kapıyı tutarım,\" diyor. \"Kapı tutmayı iyi bilirim. Vapurda da hep kapının yanında dururdum, hatırlıyor musun? Sen pencereden martılara simit atardın.\"", en: "{npc:deniz_arman} stares into the fire a while, then nods. \"I'll hold the door,\" they say. \"I'm good at holding doors. On the ferry I always stood by the door, remember? You'd be at the window throwing pretzel bits to the gulls.\"" }
          - { tr: "Kayışın son dikişini atıp kalkanı yanına, senin tarafına yaslıyor. Gece boyunca ellinci katın ışığı başınızın üstünde yanıp duruyor; ikiniz de bir daha ona bakmıyorsunuz.", en: "They put the last stitch in the strap and lean the shield up beside them, on your side. All night the fiftieth-floor light burns over your heads. Neither of you looks up at it again." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşi küçült, uyu", en: "Bank the fire and sleep" }
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kamp_deniz_durust"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} acı acı gülüyor. \"Senden duymak tuhaf,\" diyor. \"Herkes senin herkesi kurtarabileceğini sanıyor. Ben de sanıyordum galiba.\"", en: "{npc:deniz_arman} laughs, bitter. \"Weird hearing that from you,\" they say. \"Everybody thinks you can save everybody. I guess I did too.\"" }
          - { tr: "İğneyi yeniden eline alıyor. \"Ama söylediğin iyi oldu. Biri söylemeliydi. Yine de yarın geçidin önünde durmayacağım demek değil bu.\"", en: "They pick the needle back up. \"But it's good you said it. Somebody had to. Doesn't mean I won't be standing in front of that passage again tomorrow, though.\"" }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşin başında sabahı bekle", en: "Wait for morning by the fire" }
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kamp_deniz_kayis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İğneyi elinden alıp kayışı dikmeye başlıyorsun. Dikişlerin çarpık çurpuk; {npc:deniz_arman} bir an itiraz edecek gibi oluyor, sonra vazgeçip sırtını bir sandığa yaslıyor ve gözlerini kapatıyor.", en: "You take the needle from them and start stitching the strap. Your stitches are all over the place. {npc:deniz_arman} looks about to object, then gives up, leans back against a crate, and closes their eyes." }
          - { tr: "Bir süre sonra soluğu düzene giriyor. Ellinci katın ışığına sırtını dönmüş halde uyuyor; ışık yandığından beri ilk kez.", en: "After a while their breathing evens out. They're asleep with their back to the fiftieth-floor light, for the first time since it came on." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Kalkanı onun yanına bırak", en: "Leave the shield beside them" }
            sonraki: "@akis"

      - id: "bl11_kule_dibi_kamp_deniz_centik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Parmağını çentiklerin üstünde gezdiriyorsun. {npc:deniz_arman} kalkanı geri çekmiyor ama bütün bedeni geriliyor.", en: "You run a finger along the notches. {npc:deniz_arman} doesn't pull the shield away, but their whole body goes tight." }
          - { tr: "\"Öğretici'den beri,\" diyor alçak sesle. \"Kurtaramadığım her biri için bir tane. Kimse görmesin diye iç yüze oydum. Sen gördün işte.\" Durup yutkunuyor. \"Senin kalkanın olsa kaç çentik olurdu, hiç düşündün mü?\"", en: "\"Since the Tutorial,\" they say quietly. \"One for every one I couldn't save. I cut them on the inside so nobody'd see. Well, you saw.\" They stop and swallow. \"If you had a shield, how many notches would it have? You ever think about that?\"" }
        secenekler:
          - id: "sus"
            etiket: { tr: "Cevap verme; elini kalkandan çekme", en: "Don't answer. Keep your hand on the shield" }
            sonraki: "@akis"

  # ================================================================== SENİN TAKVİMİN (Bölüm 14 · Kule Dibi)
  - id: "bl14_kule_dibi_takvim"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 293, max: 298 }
    kosul: { bolum: 14 }
    agirlik: 6
    etiketler: ["ihanet", "kule", "kesif"]
    gerilim: 3
    kart: { tr: "Senin takvimin", en: "Your calendar" }
    sahne: "bl14_kule_dibi_takvim_1"
    sahneler:
      - id: "bl14_kule_dibi_takvim_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi} pazarının arka sıralarında on dört on beş yaşlarında bir kız, ters çevrilmiş bir kasanın üstüne destelerle kâğıt dizmiş. Bağırmıyor; müşterisi zaten kendiliğinden geliyor.", en: "In the back rows of the {yer:kule_dibi} market, a girl of fourteen or fifteen has stacks of paper laid out on an upturned crate. She isn't calling out. Her customers find her on their own." }
          - { tr: "Bir desteyi eline alıyorsun. Elle yazılmış bir takvim bu; son otuz günün, gün gün. Hangi gece nerede uyuduğun, kiminle konuştuğun, hangi kapıdan çıkıp hangisinden girdiğin: senin takvimin.", en: "You pick up a stack. It's a handwritten calendar of the last thirty days, day by day. Which night you slept where, who you talked to, which door you went out and which one you came back in. Your calendar." }
          - { tr: "Kızın önünden geçenlerin yarısı tanıdık yüzler: Lonca'nın habercileri, Konsey'in kâtipleri, {yer:tepe|den} inmiş beyaz cüppeli biri, bir de hiçbir kampın rengini taşımayan, şapkasını gözlerine indirmiş bir adam. Her biri bir deste alıp hiçbir şey sormadan uzaklaşıyor.", en: "Half the people walking past her are faces you know: Guild runners, Council clerks, somebody in white robes down from {yer:tepe}, and a man in no camp's colors with his hat pulled low. Each one buys a stack and walks off without asking a thing." }
          - { tr: "Destelerin her biri başka bir el yazısıyla yazılmış. Biri kopyalamış, öbürü kopyanın kopyasını çıkarmış. Ama içlerinden birinde, otuz gün önceki bir gecenin altında, Sığınak'ın yemekhanesinde alçak sesle söylediğin bir cümle bile yazılı; o gece yemekhane tıklım tıklımdı.", en: "Every stack is in a different handwriting. Somebody copied it, somebody else copied the copy. But in one of them, under a night thirty days back, there's a sentence you said under your breath in the Haven mess hall. That night the hall was packed." }
        sezgiler:
          - kosul: { stat: { int: 300 } }
            metin: { tr: "Kopyaların hepsinde aynı yanlış var: bir gün iki kez yazılmış. Asıl metni yazan da yanılmış; ya da yanılmış gibi yapmış.", en: "Every copy has the same mistake: one day written down twice. Whoever wrote the original made the mistake too. Or made it look like a mistake." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o cümleyi ben de duydum. yemekhanede yüz kişi vardı. biri duymuş, biri yazmış, biri kopyalamış. sayma beni. kimse beni duymaz zaten.", en: "i heard that sentence too. there were a hundred people in that mess hall. somebody heard it, somebody wrote it, somebody copied it. don't count me. nobody can hear me anyway." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bana öyle bakma. Bak, benim gecelerim de yazıyor burada. Şuraya bak: 'Sessiz Ağ'ın adamı sabaha kadar odasından çıkmadı.' Çıkmadım, doğru. Ama bunu kim biliyor?\"", en: "\"Don't look at me like that. Look, my nights are in here too. Right there: 'The Network guy didn't leave his room till morning.' I didn't. True. But who knows that?\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu iğrenç. Bu... gerçekten iğrenç. Kimin elinden çıktığını bulacağız, değil mi?\"", en: "\"This is disgusting. This is... seriously disgusting. We're gonna find out who wrote it, right?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Benim adım hiç geçmiyor mu? Ya bu bir hakaret ya da bir mazeret. Hangisi, karar veremedim.\"", en: "\"My name's not in here at all? That's either an insult or an alibi. I can't decide which.\"" }
        secenekler:
          - id: "satin"
            etiket: { tr: "Kızın elindeki bütün desteleri satın al", en: "Buy every stack the girl has" }
            etkiler:
              - kredi: -400
              - ahlak: { duzen: 1 }
              - tohum: { olay: "bl14_us_kendi_el_yazin", gecikme: { min: 1, max: 2 }, kosul: { bolum: 14, gun_max: 299 }, hatirlatma: { tr: "{yer:kule_dibi|den} aldığın desteleri bir gece boyunca okudun. Sabah kapının altında başka bir kâğıt vardı.", en: "You spent a whole night reading the stacks from {yer:kule_dibi}. In the morning there was another piece of paper under your door." } }
            sonraki: "bl14_kule_dibi_takvim_satin"
          - id: "kiz"
            etiket: { tr: "Kıza sayfaları kimden aldığını sor", en: "Ask the girl where she got the pages" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - tohum: { olay: "bl14_us_kendi_el_yazin", gecikme: { min: 1, max: 2 }, kosul: { bolum: 14, gun_max: 299 }, hatirlatma: { tr: "Pazardaki kızın anlattığı taşın altına bir gece daha kâğıt bırakılmıştı. Bu kez sana yazılmıştı.", en: "Another night, more paper had turned up under the stone the girl at the market told you about. This time it was addressed to you." } }
            sonraki: "bl14_kule_dibi_takvim_kiz"
          - id: "sahte"
            tur: "gizle"
            etiket: { tr: "Destelere sahte bir gün ekletip öyle sattır", en: "Have a fake day slipped into the stacks before she sells them" }
            gerekli: { stat: { int: 300 } }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -1 }
              - bayrak: "bl14_sahte_takvim"
            sonraki: "bl14_kule_dibi_takvim_sahte"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} kâğıdın nereden geldiğini incelesin", en: "Have {npc:mert_kilic} figure out where the paper came from" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2, saygi: 1 } }
            sonraki: "bl14_kule_dibi_takvim_mert"
          - id: "yak"
            tur: "gosteris"
            etiket: { tr: "Kasanın üstündeki kâğıtları tutuştur", en: "Set the papers on the crate on fire" }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: -2 }
              - bayrak: "bl14_takvim_yakildi"
            sonraki: "bl14_kule_dibi_takvim_yak"

      - id: "bl14_kule_dibi_takvim_satin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kız parayı sayıp desteleri bir çuvala dolduruyor. \"Yarın yine gelir,\" diyor omuz silkerek. \"Her sabah yenisi geliyor. Bir gün eksik kalmadı.\"", en: "The girl counts the money and stuffs the stacks into a sack. \"There'll be more tomorrow,\" she says with a shrug. \"New ones every morning. Hasn't missed a day.\"" }
          - { tr: "O gece desteleri yan yana dizip okuyorsun; her şey en küçük ayrıntısına kadar doğru. Yemekhanedeki o cümleyi duymuş olabilecekleri saymaya kalkıyorsun, ama sayı yüzü geçince bırakıyorsun.", en: "That night you lay the stacks out side by side and read them. Every bit of it is accurate, down to the smallest detail. You try counting the people who could have overheard that sentence in the mess hall, and give up once you pass a hundred." }
          - { tr: "Hem kim olduğunu bilmek istiyorsun hem bilmemek.", en: "You want to know who it was. You also want to not know. Both at once." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Desteleri sandığa kilitle", en: "Lock the stacks in a chest" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl14_kule_dibi_takvim_kiz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kız bir süre seni süzüyor, sonra kasanın arkasındaki duvarı gösteriyor. \"Şu taşın altına bırakıyor,\" diyor. \"Her gece. Ben sabah alıp çoğaltıyorum, satıyorum. Parası da taşın altında oluyor. Kristal.\"", en: "The girl looks you over for a while, then points at the wall behind the crate. \"Leaves it under that stone,\" she says. \"Every night. I pick it up in the morning, copy it, sell it. The money's under the stone too. Crystals.\"" }
          - { tr: "\"Yüzünü hiç görmedim. Bir kere beklemiştim; eldiven gördüm, o kadar. Sağ eli miydi sol eli mi, onu bile hatırlamıyorum.\" Durup sana bakıyor. \"Sen o musun? Takvimdeki?\"", en: "\"Never saw a face. I waited up once. Saw a glove, that's it. Can't even remember if it was the right hand or the left.\" She stops and looks at you. \"Is that you? The one in the calendar?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Benim.\"", en: "\"That's me.\"" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "hayir"
            etiket: { tr: "\"Değilim.\" Taşı bir kez kaldırıp bak", en: "\"Nope.\" Lift the stone once and look" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl14_kule_dibi_takvim_sahte"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kıza iki katı para verip bir gece ekletiyorsun: yarın, gece yarısı, {yer:kordon|in} kırık iskelesi, yalnız. Hiç gitmeyeceğin bir yer, hiç olmayacak bir buluşma.", en: "You pay the girl double to add one night: tomorrow, midnight, the broken pier on {yer:kordon}, alone. A place you'll never go, a meeting that'll never happen." }
          - { tr: "Destelerin yarısı öğleye kadar satılıyor. Kimin hangisini aldığını aklında tutmaya çalışıyorsun. Masaya kim o geceden haberdar oturursa, o takvimi okumuş olacak.", en: "Half the stacks are gone by noon. You try to keep track of who bought which. Whoever sits down at that table knowing about that night will have read the calendar." }
          - metin: { tr: "Ama hepsi okumuş. Bunu da biliyorsun.", en: "But they all read it. You know that too." }
            kosul: { stat: { wis: 300 } }
        secenekler:
          - id: "git"
            etiket: { tr: "Pazardan sessizce çık", en: "Slip out of the market" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl14_kule_dibi_takvim_mert"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} bir sayfayı ışığa tutup parmağıyla kâğıdın dokusunu yokluyor, cihazını mürekkebin üstünde gezdiriyor. \"Kâğıt pazarın kâğıdı,\" diyor. \"Kalem pazarın kalemi. Mürekkep... herkesin mürekkebi. Bunu yazan iz bırakmamak için uğraşmış. Çok uğraşmış.\"", en: "{npc:mert_kilic} holds a page up to the light, runs a finger over the grain, and sweeps his device across the ink. \"Market paper,\" he says. \"Market pen. The ink is... everybody's ink. Whoever wrote this worked hard not to leave a trace. Really hard.\"" }
          - { tr: "Sayfayı geri verirken omuz silkiyor. \"İz bırakmamayı bilen biri yazmış. Lonca'da da var böyleleri, Konsey'de de, {yer:tepe|de} de. Bu bir şeyi daraltmıyor; belki amaç da bu.\"", en: "He shrugs as he hands the page back. \"Somebody who knows how not to leave a trace wrote this. The Guild's got people like that. So does the Council. So does {yer:tepe}. Doesn't narrow anything down. Maybe that's the point.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Söylediğin için sağ ol.\"", en: "\"Thanks for saying it.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2 } }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey deme; sayfayı katla", en: "Don't say anything. Fold the page" }
            etkiler:
              - iliski: { mert_kilic: { korku: 2 } }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl14_kule_dibi_takvim_yak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kâğıtlar kasanın üstünde bir anda alev alıyor. Kız geri sıçrıyor; pazarın arka sıraları bir an susuyor, sonra her zamankinden yüksek bir uğultu kopuyor.", en: "The papers on the crate go up all at once. The girl jumps back. The back rows of the market go quiet for a second, then the noise comes back louder than ever." }
          - { tr: "Yanan desteler bitiyor, ama habercilerin çantalarındakiler bitmiyor. Akşama kadar herkes takvimden çok senin onu yaktığını konuşuyor. Neden yaktığını da kendince yorumluyor.", en: "The stacks on the crate burn up, but the ones already in the runners' bags don't. By evening everybody's talking less about the calendar and more about you burning it. And everybody has a theory about why." }
        secenekler:
          - id: "git"
            etiket: { tr: "Külleri ayağınla dağıt", en: "Kick the ashes apart" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== IŞIĞA CEVAP (Bölüm 14 · Tepe)
  - id: "bl14_tepe_isik_cevabi"
    konum: ["tepe"]
    perde: [3]
    bolge: ["tepe"]
    gun: { min: 293, max: 298 }
    kosul: { bolum: 14 }
    agirlik: 6
    etiketler: ["ihanet", "yukselenler", "kesif"]
    gerilim: 3
    kart: { tr: "Işığa cevap", en: "Answering light" }
    sahne: "bl14_tepe_isik_cevabi_1"
    sahneler:
      - id: "bl14_tepe_isik_cevabi_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} doruğundaki eski rasathanenin kubbesi yarı açık. İçeride, pirinç teleskobun başında yirmisinde bir kız oturuyor; beyaz bir Yükselen cüppesi giymiş, ama cüppenin altından üniversite tişörtü görünüyor. Gece yarısını üç saat geçmiş.", en: "The dome of the old observatory at the top of {yer:tepe} is half open. Inside, at the brass telescope, sits a girl of about twenty in white Ascended robes, a college T-shirt showing underneath. It's three hours past midnight." }
          - { tr: "\"Her gece bu saatte,\" diyor, kısa ve uzun çizgilerle dolu defterini sana uzatarak. \"Körfezdeki gemi bir düzenle ışık yakıp söndürüyor, altı gecedir de şehirden biri ona cevap veriyor. Dinleyiciler bunun Sistem'in sesi olduğunu söylüyor; ben öyle düşünmüyorum.\"", en: "\"Every night, this exact time,\" she says, handing you her notebook. The pages are full of short and long dashes. \"The ship over the bay flashes a light on and off, and there's a pattern. And for six nights, somebody in the city's been answering it. The Listeners say it's the voice of the System. I don't think so.\"" }
          - { tr: "Teleskobu körfeze çevirince ters kulenin karnında küçük, beyaz bir ışık yanıp sönmeye başlıyor. Kız saatine bakıyor. \"Şimdi,\" diye fısıldıyor. \"Şehre bak.\"", en: "She swings the telescope toward the bay. A small white light starts blinking in the belly of the upside-down tower. The girl checks her watch. \"Now,\" she whispers. \"Watch the city.\"" }
          - metin: { tr: "Yükselenlerin rasathanesi bu; seni burada görmek kızı hiç şaşırtmıyor. \"Kardeşlerimden biri olduğunu biliyorum,\" diyor. \"Yine de Dinleyicilere söylemedim.\"", en: "This is the Ascended's observatory, and seeing you here doesn't surprise the girl at all. \"I know you're one of us,\" she says. \"I still didn't tell the Listeners.\"" }
            kosul: { bayrak: "uye_yukselenler" }
        sezgiler:
          - kosul: { stat: { int: 300 } }
            metin: { tr: "Defterdeki çizgiler bir dil değil, bir saat. Gemi bir zaman soruyor, şehirdeki ışık bir zaman veriyor. Altı gece boyunca hep aynı cevap: Gün 300.", en: "The dashes in the notebook aren't a language. They're a clock. The ship asks for a time, the light in the city gives one. Six nights running, the same answer: Day 300." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ışığı yakan eli göremezsin. ben de göremiyorum. ama üç yüzüncü günü bilen herkes o eli tutabilirdi. bu kadar çok kişi bilmemeliydi.", en: "you can't see the hand that lights it. neither can i. but anyone who knows about day 300 could be that hand. too many people know." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Saat üç. Kim saat üçte uyanık kalıp gemiyle konuşur ki? Ben uyuyamıyorum diye kalkıyorum, o kadar.\"", en: "\"Three a.m. Who stays up at three in the morning to talk to a ship? I'm only up because I can't sleep.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Altı gece. Masaya altı gece kala başlamış. Tesadüf olamaz.\"", en: "\"Six nights. It started six nights before the table. That's no coincidence.\"" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Teleskoba eğil, şehirdeki ışığı yakala", en: "Lean into the telescope and catch the light in the city" }
            zar: { stat: "per", zorluk: 300, tek: true, basarisiz: "bl14_tepe_isik_cevabi_bulut", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }] }
            etkiler:
              - bayrak: "bl14_cevap_cekirdekten"
            sonraki: "bl14_tepe_isik_cevabi_izle"
          - id: "cevap"
            etiket: { tr: "Gemiye sen cevap ver; yanlış bir gün yolla", en: "Answer the ship yourself. Send it the wrong day" }
            gerekli: { stat: { int: 300 } }
            etkiler:
              - ahlak: { duzen: -1 }
              - itibar: { kadimler: -2 }
              - bayrak: "bl14_gemiye_yanlis_gun"
              - tohum: { olay: "bl14_us_kendi_el_yazin", gecikme: { min: 1, max: 2 }, kosul: { bolum: 14, gun_max: 299 }, hatirlatma: { tr: "Rasathanede gemiye yanlış bir gün yollamıştın. Ertesi gece şehirdeki ışık yanmadı. Onun yerine kapının altına bir zarf bırakıldı.", en: "At the observatory you'd sent the ship the wrong day. The next night, the light in the city didn't come on. Instead, an envelope turned up under your door." } }
            sonraki: "bl14_tepe_isik_cevabi_cevap"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} nöbeti seninle tutsun", en: "Have {npc:deniz_arman} keep watch with you" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 3, guven: 1 } }
            sonraki: "bl14_tepe_isik_cevabi_deniz"
          - id: "kapat"
            etiket: { tr: "Kıza defteri yakmasını söyle; bunu kimse bilmemeli", en: "Tell the girl to burn the notebook. Nobody can know about this" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - bayrak: "bl14_defter_yakildi"
            sonraki: "bl14_tepe_isik_cevabi_kapat"

      - id: "bl14_tepe_isik_cevabi_izle"
        yer: "tepe"
        paragraflar:
          - { tr: "Merceği şehrin karanlığında gezdiriyorsun: çatılar, sönük bacalar, Liman'ın fenerleri. Derken bir yerde, iki saniyeliğine, küçük bir ışık yanıp sönüyor. Kısa, uzun, kısa.", en: "You sweep the lens across the dark city: rooftops, dead chimneys, the waterfront lights. Then, somewhere, for two seconds, a little light blinks. Short, long, short." }
          - { tr: "Yerini hemen buluyorsun: {yer:kasaba_cekirdegi|in} karşısındaki yarı yıkık otelin çatısı; masanın kurulacağı salonun tam karşısında.", en: "You find the spot right away: the roof of the half-gutted hotel across from {yer:kasaba_cekirdegi}. Directly across from the hall where the table's being set." }
          - { tr: "Kız defterine bir not düşüyor. \"Otelin çatısına herkes çıkabilir,\" diyor, sesinde bir parça hayal kırıklığı. \"İçeride merdiven bile yok, dışarıdaki demir yangın merdiveninden çıkılıyor. Bu bize bir şey söylemiyor, değil mi?\"", en: "The girl jots a note in her notebook. \"Anybody can get up on that roof,\" she says, a little disappointed. \"There's not even a stairway, you go up the fire escape. That doesn't tell us anything, does it?\"" }
        secenekler:
          - id: "soyle"
            etiket: { tr: "\"Kimin olduğunu söylemiyor. Nerede olacağını söylüyor.\"", en: "\"It doesn't say who. It says where.\"" }
            etkiler:
              - tohum: { olay: "bl14_us_kendi_el_yazin", gecikme: { min: 1, max: 2 }, kosul: { bolum: 14, gun_max: 299 }, hatirlatma: { tr: "Rasathaneden döndüğün sabah kapının altına bir zarf bırakılmıştı.", en: "The morning you got back from the observatory, an envelope had been slipped under your door." } }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl14_tepe_isik_cevabi_bulut"
        yer: "tepe"
        paragraflar:
          - { tr: "Tam merceği şehre indirdiğin anda körfezden bir sis bulutu kalkıp şehrin üstüne yayılıyor. Çatılar, bacalar, fenerler bir bir siliniyor.", en: "Right as you bring the lens down on the city, a bank of fog rolls up off the bay and spreads over it. Rooftops, chimneys, lights, wiped out one by one." }
          - { tr: "Sisin içinde bir yerde bir ışığın yanıp söndüğünü görür gibi oluyorsun; belki de görmüyorsun. Kız defterine yalnızca bir soru işareti koyuyor.", en: "Somewhere in the fog you think you see a light blink. Maybe you don't. The girl puts nothing in her notebook but a question mark." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Sabaha kadar bekle", en: "Wait till morning" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Rasathaneden in", en: "Head down from the observatory" }
            sonraki: "@akis"

      - id: "bl14_tepe_isik_cevabi_cevap"
        yer: "tepe"
        paragraflar:
          - { tr: "Kızın el fenerini alıp kubbenin açık yarısına çıkıyorsun. Gemi sorusunu bir kez daha soruyor; sen de defterdeki düzenle, ama başka bir günle cevap veriyorsun.", en: "You take the girl's flashlight and climb up into the open half of the dome. The ship asks its question one more time, and you answer in the notebook's pattern, but with a different day." }
          - { tr: "Gemi bir süre susuyor. Sonra aynı soruyu iki kez üst üste soruyor; ardından ışık sönüyor ve bir daha yanmıyor. Şehirdeki ışık da o gece cevap vermiyor.", en: "The ship goes quiet for a while. Then it asks the same question twice in a row, and then its light goes out and doesn't come back on. The light in the city doesn't answer that night either." }
          - { tr: "Kız fenerini geri alırken elleri titriyor. \"Şimdi biri, birinin yalan söylediğini düşünüyor,\" diyor. \"Umarım sen değilsindir.\"", en: "The girl's hands are shaking as she takes her flashlight back. \"So now somebody thinks somebody's lying,\" she says. \"I hope it's not you.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Feneri ona ver, rasathaneden in", en: "Give her the flashlight and head down" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl14_tepe_isik_cevabi_deniz"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} kubbenin dibine bir battaniye serip yanına oturuyor. Kız ışıkları sayarken siz de sırayla teleskoba eğiliyorsunuz; biriniz izlerken öbürünüz uykuyla boğuşmakta.", en: "{npc:deniz_arman} spreads a blanket at the foot of the dome and sits down next to you. While the girl counts the lights, you two take turns at the telescope, one watching while the other tries not to fall asleep." }
          - { tr: "Şehirdeki ışık o gece yanmıyor. Gün ağarırken {npc:deniz_arman} başını senin omzuna yaslamış halde mırıldanıyor: \"Masada yanında oturacağım. Kimse bana başka bir yer göstermesin.\"", en: "The light in the city doesn't come on that night. As the sky starts to lighten, {npc:deniz_arman} mumbles with their head on your shoulder: \"I'm sitting next to you at that table. Nobody better try to give me another seat.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Battaniyeyi toplayın", en: "Fold up the blanket" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl14_tepe_isik_cevabi_kapat"
        yer: "tepe"
        paragraflar:
          - { tr: "Kız defterine uzun uzun bakıyor, sonra sayfaları birer birer koparıp mangalın içine atıyor. Altı gecenin notları kubbenin altında kısa bir süre parlayıp kararıyor.", en: "The girl looks at her notebook a long time, then tears out the pages one by one and drops them into the brazier. Six nights of notes flare briefly under the dome and go dark." }
          - { tr: "\"Dinleyiciler sorarsa bulutlu olduğunu söylerim,\" diyor. \"Ama ışık yine yanacak. Ben görmesem de.\"", en: "\"If the Listeners ask, I'll say it was cloudy,\" she says. \"But the light'll come on again. Even if I'm not watching.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Rasathaneden in", en: "Head down from the observatory" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== KENDİ EL YAZIN (Bölüm 14 · üs · tohum)
  - id: "bl14_us_kendi_el_yazin"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 14, gun_max: 299 }
    etiketler: ["ihanet", "siginak"]
    gerilim: 3
    kart: { tr: "Kendi el yazın", en: "Your own handwriting" }
    sahne: "bl14_us_kendi_el_yazin_1"
    sahneler:
      - id: "bl14_us_kendi_el_yazin_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Zarfın üstünde ad yok. İçinden tek bir sayfa çıkıyor ve daha ilk satırda elin donup kalıyor: bu senin el yazın. Harflerin eğimi, satır sonunda yukarı kıvrılan kuyruklar, hepsi seninki.", en: "There's no name on the envelope. A single page comes out of it, and at the very first line your hand freezes. It's your handwriting. The slant of the letters, the tails that curl up at the end of each line, all of it yours." }
          - { tr: "Mektup Kadimlere yazılmış. Ortak Masa'daki yerini, dört kampın oturma düzenini, Çekirdek salonunun kapılarını teklif ediyor; karşılığında Hasat'tan sonra bir koltuk istiyor. Altında senin imzan, üstünde yarının tarihi var.", en: "The letter's addressed to the Ancients. It offers them your seat at the Common Table, the seating plan for all four camps, the doors to the Core hall. In return it asks for a seat after the Harvest. Your signature's at the bottom. It's dated tomorrow." }
          - { tr: "Sen yazmadın. Ama masada biri çıkarıp ortaya koysa, yazmadığını kim kanıtlayacak?", en: "You didn't write this. But if somebody pulls it out at that table and slaps it down in front of everyone, who's going to prove you didn't?" }
          - metin: { tr: "Kâğıt pazarın kâğıdı; {yer:kule_dibi|de} kızın kasasının üstünde gördüğün desteler de bu kâğıttandı.", en: "It's market paper. The stacks on the girl's crate at {yer:kule_dibi} were the same stuff." }
            kosul: { herhangi: [{ bayrak: "bl14_takvim_yakildi" }, { bayrak: "bl14_sahte_takvim" }] }
          - metin: { tr: "Mektupta dört kampın oturma düzeni yazılı ve düzen doğru. {npc:elif_sari|in} kaybolan planını kim aldıysa, düzeni buraya da o kopyalamış.", en: "The letter has the seating plan for all four camps, and the plan is correct. Whoever took {npc:elif_sari|pos} missing chart copied it in here too." }
            kosul: { bayrak: "sb14_masa_aramasi" }
        sezgiler:
          - kosul: { stat: { int: 300 } }
            metin: { tr: "Harfler senin, ama sabır senin değil. Sen hep aceleyle yazarsın; bu mektubu yazan her harfi tek tek, bir resim çizer gibi çizmiş.", en: "The letters are yours, but the patience isn't. You always write in a hurry. Whoever wrote this drew every letter one at a time, like copying a picture." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "el yazın şehrin her yerinde: imzaladığın her izin, her liste, her duyuru. ezberlemek isteyene yeter de artar. bu kimseyi daraltmıyor. belki amaç da bu.", en: "your handwriting is all over the city: every permit you signed, every list, every notice. more than enough for anyone who wants to learn it. that doesn't narrow it down. maybe that's the point." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu bir tuzak değil, bir teşhis. Seni masada hasta gösterecekler; ilacı da kendileri yazacak.\"", en: "\"This isn't a trap. It's a diagnosis. They're going to make you look sick at that table, and then prescribe the cure themselves.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"El yazın berbatmış, biliyor musun? Bunu taklit eden kim olduysa gerçekten uğraşmış.\"", en: "\"Your handwriting's terrible, you know that? Whoever forged this really put in the work.\"" }
        secenekler:
          - id: "kusur"
            etiket: { tr: "Mektubu harf harf incele; sahtecinin hatasını bul", en: "Go over the letter stroke by stroke. Find the forger's mistake" }
            gerekli: { stat: { int: 300 } }
            etkiler:
              - bayrak: "bl14_mektup_kusuru"
            sonraki: "bl14_us_kendi_el_yazin_kusur"
          - id: "duyur"
            etiket: { tr: "Dört kampa kopya yolla: \"Aslı masada çıkarsa sahtedir.\"", en: "Send a copy to all four camps. \"If the original shows up at the table, it's fake.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - bayrak: "bl14_mektup_duyuruldu"
            sonraki: "bl14_us_kendi_el_yazin_duyur"
          - id: "elif"
            etiket: { tr: "Mektubu {npc:elif_sari|e} göster", en: "Show the letter to {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl14_us_kendi_el_yazin", agirlik: 25 }
            sonraki: "bl14_us_kendi_el_yazin_elif"
          - id: "yak"
            etiket: { tr: "Mektubu yak; kimseye söyleme", en: "Burn the letter. Tell no one" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bayrak: "bl14_mektup_yakildi"
            sonraki: "bl14_us_kendi_el_yazin_yak"

      - id: "bl14_us_kendi_el_yazin_kusur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Lambayı yaklaştırıp her harfin üstünden tek tek geçiyorsun; uzun süre bir şey bulamıyorsun. Sonra buluyorsun: \"ğ\" harfleri. Sen ğ'nin şapkasını hep harfle birlikte, kalemi kaldırmadan atarsın. Mektuptakiler sonradan, ayrı birer çizgiyle eklenmiş.", en: "You pull the lamp close and go over every letter one at a time. For a long time you find nothing. Then you find it: the i's. You always dot an i in one flick without lifting the pen. In the letter the dots were added afterward, each with its own separate tap." }
          - { tr: "Bunu yazan, el yazını sakin, düzgün yazdığın sayfalardan öğrenmiş; aceleyle karaladıklarından değil. Masada bu ayrıntıyı gösterebilirsin, ama inanan çıkar mı, o ayrı.", en: "Whoever wrote this learned your hand from pages you wrote slow and neat, not from the stuff you scrawl in a hurry. You can point to that detail at the table. Whether anybody believes it is another story." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Mektubu katlayıp iç cebine koy", en: "Fold the letter and put it in your inside pocket" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl14_us_kendi_el_yazin_duyur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Dört kopya çıkartıp dört habercinin eline veriyorsun: Konsey'e, Lonca'ya, {yer:tepe|e}, bir de Sessiz Ağ'ın {yer:kiyikent_liman|de}ki ölü posta kutusuna. Her birinin altına kendi elinle, aceleyle bir satır ekliyorsun.", en: "You have four copies made and hand them to four runners: one for the Council, one for the Guild, one for {yer:tepe}, one for the Network's dead drop on {yer:kiyikent_liman}. At the bottom of each you add a line in your own hurried hand." }
          - { tr: "Akşama kadar dört kamptan dört cevap geliyor. Hiçbiri sana inandığını söylemiyor; hiçbiri inanmadığını da. Ama mektubu masaya koymayı düşünen her kimse, artık bunu herkesin beklediğini biliyor.", en: "By evening four answers come back from four camps. None of them says they believe you. None of them says they don't. But whoever was planning to put that letter on the table knows now that everybody's expecting it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Habercilerin ardından kapıyı kapat", en: "Shut the door behind the runners" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl14_us_kendi_el_yazin_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} mektubu iki kez okuyor. İkincisinde dudakları kıpırdıyor; her cümleyi bir hastanın şikâyetini dinler gibi tek tek tartıyor.", en: "{npc:elif_sari} reads the letter twice. The second time her lips move, weighing every sentence like she's listening to a patient describe their symptoms." }
          - { tr: "\"Bunu sen yazmadın,\" diyor sonunda. Soru değil bu. \"Sana inanıyorum, çünkü sen yazsaydın bu kadar düzgün yazmazdın. Bu benim kanıtım; masada kimseyi ikna etmez. Ama beni ikna etti.\"", en: "\"You didn't write this,\" she says finally. Not a question. \"I believe you, because if you'd written it, it wouldn't be this neat. That's my proof. It won't convince anybody at the table. But it convinced me.\"" }
          - { tr: "Mektubu sana geri verirken parmakları bir an seninkilerin üstünde kalıyor. \"Masada bunu çıkaran olursa ilk ben konuşurum.\"", en: "As she hands the letter back, her fingers rest on yours for a second. \"If anybody pulls this out at the table, I'm the first one talking.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "\"Sağ ol.\"", en: "\"Thank you.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl14_us_kendi_el_yazin_yak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mektubu lambanın alevine tutuyorsun. Kâğıt kıvrılıp kararırken senin imzan en son yanıyor.", en: "You hold the letter to the lamp flame. As the paper curls and blackens, your signature is the last thing to burn." }
          - { tr: "Külü pencereden savururken aklından tek bir şey geçiyor: kopyasını saklamayan sahteci görülmüş şey değil.", en: "As you toss the ashes out the window, one thing keeps going through your head: nobody forges a letter without keeping a copy." }
        secenekler:
          - id: "git"
            etiket: { tr: "Pencereyi kapat", en: "Close the window" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · ARAS (Bölüm 14 · Kule Dibi)
  - id: "bl14_kule_dibi_kamp_aras"
    konum: ["kule_dibi"]
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 293, max: 299 }
    kosul: { bolum: 14 }
    kamp: true
    etiketler: ["kamp", "yoldas", "aras"]
    gerilim: 2
    npc: ["aras_kurt"]
    kart: { tr: "Zirve teklifi", en: "An offer from the top" }
    sahne: "bl14_kule_dibi_kamp_aras_1"
    sahneler:
      - id: "bl14_kule_dibi_kamp_aras_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateşin başında {npc:aras_kurt} yerden çakıl toplayıp Kule'nin gövdesine fırlatıyor; taşlar karanlıkta tık tık sekiyor. Bir süre konuşmuyor. Sonra elindeki son çakılı avucunda tartıp sana dönüyor.", en: "At the fire, {npc:aras_kurt} picks pebbles up off the ground and throws them at the Spire. They tick off it in the dark. He doesn't talk for a while. Then he weighs the last pebble in his palm and turns to you." }
          - { tr: "\"Bana da bir davetiye geldi,\" diyor. \"Masaya değil. Zirveye. Biri bana, ilk S kademesinin ben olacağımı söyledi. Karşılığında masada yalnızca bir sandalye değiştirmemi istedi. Bir sandalye. Komik, değil mi?\"", en: "\"I got an invitation too,\" he says. \"Not to the table. To the top. Somebody told me I'd be the first S-Grade. All I had to do in return was switch one chair at the table. One chair. Funny, right?\"" }
          - { tr: "Kimin teklif ettiğini de, ne cevap verdiğini de söylemiyor. Çakılı ateşe atıp yüzüne bakıyor. \"Biri sana zirveyi teklif etse, karşılığında yalnızca bir sandalye değiştirmeni istese, ne yapardın?\"", en: "He doesn't say who made the offer, or what he said back. He tosses the pebble into the fire and looks you in the face. \"If somebody offered you the top, and all they wanted was for you to move one chair, what would you do?\"" }
          - metin: { tr: "Davetiyendeki not aklına geliyor: Arkanı duvara ver. {npc:aras_kurt} şu an duvarla senin aranda oturuyor.", en: "You think of the note on your invitation: Keep your back to the wall. Right now, {npc:aras_kurt} is sitting between you and the wall." }
            kosul: { stat: { per: 300 } }
        sezgiler:
          - kosul: { stat: { wis: 300 } }
            metin: { tr: "Sesinde övünç yok, öfke de yok. Bir rakibin hamlesini anlatır gibi anlatıyor; hamleyi kimin yaptığını kendisi de çözememiş gibi.", en: "There's no bragging in his voice, no anger either. He tells it like he's describing an opponent's move, like he hasn't figured out who made it either." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu soruyu sana mı soruyor, kendine mi? ikisi de olabilir. ikisi de tehlikeli.", en: "is he asking you that, or himself? could be both. both are dangerous." }
        secenekler:
          - id: "kim"
            etiket: { tr: "\"Kim teklif etti?\"", en: "\"Who made the offer?\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: -1, saygi: 1 } }
            sonraki: "bl14_kule_dibi_kamp_aras_kim"
          - id: "sandalye"
            etiket: { tr: "\"Zirveye sandalyeyle çıkılmaz.\"", en: "\"You don't get to the top on a chair.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { aras_kurt: { saygi: 3 } }
              - bayrak: "bl14_aras_kamp_zirve"
            sonraki: "bl14_kule_dibi_kamp_aras_sandalye"
          - id: "alirdim"
            etiket: { tr: "\"Ben olsam alırdım.\"", en: "\"I'd take it.\"" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { aras_kurt: { saygi: -2, guven: 1 } }
            sonraki: "bl14_kule_dibi_kamp_aras_alirdim"
          - id: "sirt"
            etiket: { tr: "\"Arkanı kimin kolladığını unutma.\"", en: "\"Don't forget who's had your back.\"" }
            goster: { hafiza: { aras_kurt: "sirtini_kolladi" } }
            etkiler:
              - iliski: { aras_kurt: { guven: 4, baglilik: 2 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl14_kule_dibi_kamp_aras", agirlik: 25 }
            sonraki: "bl14_kule_dibi_kamp_aras_sirt"

      - id: "bl14_kule_dibi_kamp_aras_kim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} gülüyor. \"Teklif edenin adı önemli değil,\" diyor. \"Önemli olan, bana teklif edilmiş olması. Demek ki biri benim satılık olduğumu düşünüyor. Ya da senin, beni satın alacak kadar değerli olduğunu.\"", en: "{npc:aras_kurt} laughs. \"The name doesn't matter,\" he says. \"What matters is that somebody offered. Means somebody thinks I'm for sale. Or that you're worth buying me for.\"" }
          - { tr: "Battaniyesine uzanıp sırtını sana dönüyor. \"Masada görüşürüz,\" diyor. Uyuyup uyumadığını sabaha kadar anlayamıyorsun.", en: "He stretches out on his blanket and turns his back to you. \"See you at the table,\" he says. All night long, you can't tell if he's asleep." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşi söndür", en: "Put out the fire" }
            sonraki: "@akis"

      - id: "bl14_kule_dibi_kamp_aras_sandalye"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} bir an sana bakıyor, sonra başını Kule'ye kaldırıyor. \"Doğru,\" diyor. \"Merdivenle çıkılır. Basamak basamak. Herkes görürken.\"", en: "{npc:aras_kurt} looks at you for a second, then tips his head back toward the Spire. \"Right,\" he says. \"You take the stairs. One step at a time. With everybody watching.\"" }
          - { tr: "Bir çakıl daha alıp atıyor; bu kez çok yükseğe, karanlığın içine. Düştüğünü duymuyorsunuz. \"Masada görüşürüz,\" diyor.", en: "He picks up one more pebble and throws it, really high this time, up into the dark. You never hear it land. \"See you at the table,\" he says." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşin başında uyu", en: "Sleep by the fire" }
            sonraki: "@akis"

      - id: "bl14_kule_dibi_kamp_aras_alirdim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} bir kahkaha atıyor, ama gözleri gülmüyor. \"Ben de öyle sanmıştım,\" diyor. \"Yani senin öyle diyeceğini.\"", en: "{npc:aras_kurt} lets out a laugh, but his eyes don't join in. \"Figured,\" he says. \"That you'd say that, I mean.\"" }
          - { tr: "\"Bu işi kolaylaştırıyor mu, zorlaştırıyor mu, bilmiyorum.\" Battaniyesini çekip ateşin öbür yanına geçiyor. \"Masada görüşürüz.\"", en: "\"Don't know if that makes this easier or harder.\" He grabs his blanket and moves to the other side of the fire. \"See you at the table.\"" }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşe bir odun daha at", en: "Throw another log on the fire" }
            sonraki: "@akis"

      - id: "bl14_kule_dibi_kamp_aras_sirt"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} uzun süre bir şey söylemiyor. Sonra elindeki çakılı ateşe değil, senin avucuna bırakıyor.", en: "{npc:aras_kurt} doesn't say anything for a long time. Then he drops the pebble he's holding, not into the fire, but into your palm." }
          - { tr: "\"Unutmadım,\" diyor. \"Bu beni hâlâ sinir ediyor, biliyor musun? Bir şey istemeden arkamı kolladın. Ben öyle şeyleri unutmam.\" Gözlerini ateşten ayırmıyor. \"Masada görüşürüz.\"", en: "\"I didn't forget,\" he says. \"Still bugs me, you know that? You had my back and didn't want anything for it. I don't forget stuff like that.\" He keeps his eyes on the fire. \"See you at the table.\"" }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Çakılı cebine koy", en: "Pocket the pebble" }
            sonraki: "@akis"

  # ================================================================== TEBEŞİR HALKASI (Bölüm 18 · Kule Dibi)
  - id: "bl18_kule_dibi_tebesir"
    konum: ["kule_dibi"]
    perde: [4]
    bolge: ["kule_dibi"]
    gun: { min: 353, max: 357 }
    kosul: { bolum: 18 }
    agirlik: 6
    etiketler: ["kule", "son", "kesif"]
    gerilim: 2
    kart: { tr: "Tebeşir halkası", en: "The chalk ring" }
    sahne: "bl18_kule_dibi_tebesir_1"
    sahneler:
      - id: "bl18_kule_dibi_tebesir_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yılın son haftasında {yer:kule_dibi|de} kimse bir şey satmıyor. Tezgâhlar boş; insanlar ellerinde tebeşirle Kule'nin dibine dizilmiş. Kaybettiklerinin adlarını yazıyorlar.", en: "In the last week of the year, nobody at {yer:kule_dibi} is selling anything. The stalls are empty. People stand in a line at the foot of the Spire with chalk in their hands, writing the names of the ones they lost." }
          - { tr: "Adlar Kule'nin gövdesini bir halka gibi sarmış ve halka bir insanın uzanabileceği yüksekliğe varmış. Babalar çocuklarını omuzlarına alıyor, çocuklar biraz daha yukarı yazıyor. Daha yukarısı boş.", en: "The names wrap the body of the Spire like a ring, and the ring has reached as high as a person can reach. Dads put their kids on their shoulders and the kids write a little higher. Above that, nothing." }
          - { tr: "Yaşlı bir kadın elindeki tebeşiri sana uzatıyor. \"Kocamın adını yukarı yaz,\" diyor. \"Kimsenin uzanamayacağı yere. Kule görsün.\"", en: "An old woman holds out her chalk to you. \"Write my husband's name up high,\" she says. \"Where nobody can reach. So the Spire sees it.\"" }
          - metin: { tr: "Meydanda Kadim muhafızları dolaşıyor. Tebeşire ses etmiyorlar; adları da okumuyorlar. Şehir düştüğünden beri insanlar muhafızların sırtı dönükken yazıyor.", en: "Ancient guards patrol the plaza. They don't stop the chalk, and they don't read the names. Since the city fell, people write when the guards' backs are turned." }
            kosul: { bayrak: "kiyikent_dustu" }
          - metin: { tr: "Adların en yenileri istilada düşenlerin. Halkanın bir yerinde, birinin büyük harflerle yazdığı tek bir sözcük duruyor: KAZANDIK. Altına başka biri ince ince eklemiş: kim?", en: "The newest names belong to the ones who fell in the invasion. Somewhere in the ring, someone has written a single word in big capitals: WE WON. Underneath, someone else has added, in small letters: who?" }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Anlaşmadan beri meydanın köşesinde bir Kadim memuru oturuyor; tebeşirle yazılan her adı ince bir deriye geçiriyor. Ne için yazdığını soran olmuyor.", en: "Since the agreement, an Ancient clerk has been sitting in the corner of the plaza, copying every chalked name onto a thin piece of hide. Nobody asks what for." }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "Kalabalığın arasında bir yüz tanıyorsun: bir zamanlar çadırını bir blok öteye taşıdığın yaşlı adam. Torununu omzuna almış, kendi adını yazdırıyor. \"Benim adımı kimse yazmaz,\" diyor sana gülerek. \"Ben de kendim yazdırayım dedim.\"", en: "You recognize a face in the crowd: the old man whose tent you helped move a block over, back when. He's got his grandkid on his shoulders, writing his own name. \"Nobody's gonna write mine,\" he tells you, laughing. \"So I figured I'd get it done myself.\"" }
            kosul: { bayrak: "bl10_cadir_tasindi" }
          - metin: { tr: "Merdiven ağzındaki hamallar kendi adlarını değil, Kule'de düşenlerin adlarını yazıyor. Tartının üstündeki tahtada solmuş bir tebeşirle hâlâ okunuyor: Kat başı beş.", en: "The porters at the mouth of the stairwell aren't writing their own names. They're writing the names of the ones who fell on the Spire. On the board over the scale, in faded chalk, you can still read: Five a floor." }
            kosul: { bayrak: "bl11_hamal_ucreti" }
        sezgiler:
          - kosul: { stat: { per: 400 } }
            metin: { tr: "Halkanın bir yerinde, bir çocuk boyunda, senin adın yazılı. Kimin yazdığını bilmiyorsun. Ölmedin; demek ki biri seni de kaybetmiş sayıyor.", en: "Somewhere in the ring, about a kid's height off the ground, your name is written. You don't know who wrote it. You're not dead. So somebody counts you as lost too." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_silindi" }
            metin: { tr: "benim adımı kimse yazmaz. yazmasınlar da. ben senin içinde yazılıyım. bu yeter. herhalde.", en: "nobody's going to write my name. good. i'm written inside you. that's enough. i think." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak_yok: "deniz_kardes_bulundu" }
            metin: { tr: "\"Kardeşimin adını yazmayacağım. Henüz değil. Yazarsam bitmiş olur.\"", en: "\"I'm not writing my sister's name. Not yet. If I write it, it's over.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kaybettiğim hastaların hepsini hatırlıyorum, biliyor musun? Adlarını değil. Yüzlerini.\"", en: "\"I remember every patient I lost, you know. Not their names. Their faces.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bütün bu adlar bir veri tabanında bile değil. Yağmur yağsa silinecek. Belki de doğrusu bu.\"", en: "\"None of these names are in a database. One good rain and they're gone. Maybe that's how it should be.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bak, en tepedeki ad hâlâ bir çocuğun boyunda. Kimse zirveye çıkamamış. Şimdilik.\"", en: "\"Look, the highest name's still at a kid's height. Nobody's made it to the top. Yet.\"" }
        secenekler:
          - id: "tirman"
            tur: "gosteris"
            etiket: { tr: "Dış cepheye tırman; adı kimsenin uzanamayacağı yere yaz", en: "Climb the outside. Write the name where nobody can reach" }
            gerekli: { stat: { agi: 400 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
            sonraki: "bl18_kule_dibi_tebesir_tirman"
          - id: "kadin"
            etiket: { tr: "Kadının yanına çömel; kocasını anlatsın", en: "Crouch down next to the woman. Let her tell you about her husband" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "bl18_kule_dibi_tebesir_kadin"
          - id: "kendi"
            etiket: { tr: "Bir tebeşir al, kendi adını yaz", en: "Take a piece of chalk and write your own name" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl18_kule_dibi_tebesir_kendi"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} omuzlarına çıkıp yazsın", en: "Let {npc:deniz_arman} climb on your shoulders and write" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 4, guven: 2 } }
            sonraki: "bl18_kule_dibi_tebesir_deniz"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} bir tebeşir uzat", en: "Hand {npc:elif_sari} a piece of chalk" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 3, guven: 2 } }
            sonraki: "bl18_kule_dibi_tebesir_elif"

      - id: "bl18_kule_dibi_tebesir_tirman"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tebeşiri dişlerinin arasına alıp Kule'nin dış cephesine tutununca aşağıdaki uğultu birden kesiliyor. Bir kat, iki kat, beş kat... Adların halkası ayaklarının altında incecik bir çizgiye dönüşüyor.", en: "You clamp the chalk in your teeth and grab hold of the Spire's outer wall. The noise below cuts off all at once. One floor, two floors, five... The ring of names shrinks to a thin line under your feet." }
          - { tr: "Onuncu katın hizasında durup kadının söylediği adı yazıyorsun, büyük harflerle. Aşağı baktığında halkayı bütünüyle görüyorsun: Kule'nin beline sarılmış beyaz bir ip gibi. Şehir onu tutup bırakmıyor.", en: "Level with the tenth floor, you stop and write the name the woman gave you, in big capitals. When you look down you can see the whole ring: like a white rope tied around the Spire's waist. The city's holding on to it and not letting go." }
          - { tr: "İndiğinde kadın ellerini birbirine kenetlemiş, yukarı bakıyor. Bir şey söylemiyor. Arkasındakiler sıraya girmiş bile; her birinin elinde bir ad.", en: "When you come down, the woman has her hands clasped together, looking up. She doesn't say anything. The people behind her have already lined up, every one of them holding a name." }
        secenekler:
          - id: "yine"
            etiket: { tr: "Sıradaki adı al, yeniden tırman", en: "Take the next name and climb again" }
            etkiler:
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl18_kule_dibi_tebesir_kadin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kadının yanına çömeliyorsun. Anlatıyor: tramvay vatmanıymış kocası, otuz yıl aynı hatta çalışmış. Entegrasyon sabahı tramvayı durdurup yolcuları indirmiş, sonuncusu inene kadar direksiyondan kalkmamış.", en: "You crouch down beside her. She tells you about him: a streetcar operator, thirty years on the same line. On Integration Day morning he stopped the car and got the passengers off, and he didn't get off himself till the last one was out." }
          - { tr: "\"Adını herkes unuttu,\" diyor. \"Ama o sabah o tramvaydaki kırk kişi yaşıyor. Belki onlar da buraya gelip bir ad yazıyordur, kimin adını yazdıklarını bilmeden.\"", en: "\"Everybody's forgotten his name,\" she says. \"But the forty people on that car that morning are alive. Maybe they come here and write a name too, not knowing whose they ought to write.\"" }
          - { tr: "Tebeşiri sana uzatıyor. Bu kez yukarıya değil, halkanın ortasına, bir insan boyuna yazıyorsun. Kadın başını sallıyor; yeterince yüksek.", en: "She hands you the chalk. This time you don't write it up high, but in the middle of the ring, at a person's height. The woman nods. High enough." }
        secenekler:
          - id: "git"
            etiket: { tr: "Tebeşiri ona geri ver", en: "Give her back the chalk" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl18_kule_dibi_tebesir_kendi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halkada boş bir yer bulup adını yazıyorsun. Ölmedin; ama bu hafta bitince ne olacağını da bilmiyorsun. Ad orada dursun.", en: "You find an empty spot in the ring and write your name. You're not dead. But you don't know what happens when this week's over either. Let the name be there." }
          - { tr: "Arkandaki biri durup okuyor, sonra bir başkası. Fısıltılar kalabalığın içinde dalga dalga yayılıyor. Biraz sonra kimse sormadan, insanlar senin adının çevresine kendi adlarını yazmaya başlıyor; ölülerin değil, kendi adlarını.", en: "Someone behind you stops to read it, then someone else. Whispers ripple out through the crowd. A little later, without anybody asking, people start writing their own names around yours. Not the names of their dead. Their own." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalabalığın arasından sessizce çık", en: "Slip quietly out through the crowd" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl18_kule_dibi_tebesir_deniz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çömeliyorsun, {npc:deniz_arman} omuzlarına tırmanıyor. Ağırlığını sırtında duyuyorsun. Hep o seni korurdu; şimdi sen onu taşıyorsun.", en: "You crouch down and {npc:deniz_arman} climbs onto your shoulders. You feel their weight settle on you. They were always the one protecting you. Now you're the one carrying them." }
          - { tr: "{npc:deniz_arman} yukarıda uzun süre duruyor. Sonra bir ad yazmıyor, bir çizgi çekiyor: halkanın en tepesine, boydan boya. \"Bundan sonra kimse daha yukarı yazmak zorunda kalmasın,\" diyor. \"Bu çizginin üstü boş kalsın.\"", en: "Up there, {npc:deniz_arman} stays still for a long time. Then, instead of a name, they draw a line: across the very top of the ring, end to end. \"After this, nobody should have to write any higher,\" they say. \"Leave everything above this line empty.\"" }
        secenekler:
          - id: "indir"
            etiket: { tr: "Onu yavaşça yere indir", en: "Lower them slowly to the ground" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl18_kule_dibi_tebesir_elif"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} tebeşiri alıp bir süre halkanın önünde dikiliyor. Sonra ad yazmaya başlıyor; bir tane, iki tane, on tane. Kimisini yarıda bırakıp \"soyadını bilmiyorum\" diye mırıldanıyor.", en: "{npc:elif_sari} takes the chalk and stands in front of the ring a while. Then she starts writing names. One, two, ten. Some she leaves half finished, muttering, \"I never knew the last name.\"" }
          - { tr: "Tebeşir bitince elini tozlu önlüğüne siliyor. \"Hepsini yazamadım,\" diyor. \"Ama çoğunu. Yıllar önce biri bana bu kadar hasta kaybedeceğimi söyleseydi tıp okumazdım. İyi ki söylememişler.\"", en: "When the chalk runs out she wipes her hand on her dusty lab coat. \"I couldn't write all of them,\" she says. \"But most. If somebody'd told me years ago I'd lose this many patients, I'd never have gone to med school. Good thing nobody told me.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Ona yeni bir tebeşir bul", en: "Find her another piece of chalk" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"
