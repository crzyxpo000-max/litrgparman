# Perde 3 bölge olayları ve saha kampı sahneleri, Bölüm 12 (Yol). DECISIONS #144: keşif görevindeki hikayesiz günler.
# Kule Dibi: bl12_kd_bekci → bl12_kd_bekci_iz (kaçak kat bekçisi ve Kule'nin dış cephesindeki iz) · bl12_kd_senet → bl12_kd_senet_donen
#   (geçit dibinde Tavvar senetçisi; senetle giden biri geri kaçar) · tohum karşılıkları: bl12_kd_tuz_dalgici (← bl12_bt_dalgiclar),
#   bl12_kd_halka (← bl12_sn_halka_ocagi) · kamp: bl12_kd_kamp_aras, bl12_kd_kamp_elif.
# Tepe: bl12_tp_goz_cicegi → bl12_us_goz_cicegi (üs; uyurgezerler ve ağrı kesici sandığı) · kamp: bl12_tp_kamp_deniz. Pirinç Kervan: bl12_pk_kazan → bl12_us_kervan_borcu (üs).
# Eski Şehir: bl12_es_saatci → bl12_ko_saat (Kordon). Sanayi: bl12_sn_halka_ocagi → bl12_kd_halka. Batık Takımada: bl12_bt_dalgiclar → bl12_kd_tuz_dalgici.
# Takip düğümleri yalniz_tohum'dur ve yalnızca bu dosyadaki olaylar tarafından tohumlanır. Yankı'nın sözleri küçük harfli ve tırnaksız.
olaylar:
  # ================================================================== KULE DİBİ · KAÇAK BEKÇİ
  - id: "bl12_kd_bekci"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak_yok: "yol_olustu" }
    agirlik: 5
    etiketler: ["kule", "yol", "kesif"]
    gerilim: 2
    kart: { tr: "Diz çöken bekçi", en: "The Kneeling Warden" }
    sahne: "bl12_kd_bekci_1"
    sahneler:
      - id: "bl12_kd_bekci_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|de}, Kule'nin gölgesinin en koyu düştüğü yerde bir kat bekçisi diz çökmüş. İki adam boyunda; zırhı Kule'nin duvarıyla aynı pürüzsüz, kemik rengi taştan.", en: "Out on {yer:kule_dibi}, right where the Spire's shadow falls darkest, a floorwarden is down on one knee. It's two men tall, and its armor is the same smooth, bone-colored stone as the Spire's wall." }
          - { tr: "Kule'den kaçan bekçiler aşağı inince önüne çıkanı paramparça eder; bu üç gündür kıpırdamıyor. {fraksiyon:lonca} avcıları çevresine halat germiş, ödül tahtasına da tebeşirle yazmışlar: Kafasına bin kristal.", en: "Runaway wardens tear apart whatever's in front of them when they come down. This one hasn't moved in three days. {fraksiyon:lonca} hunters have roped it off, and the bounty board says, in chalk: A thousand crystals for the head." }
          - { tr: "Halata yaklaştığında bekçinin başı ağır ağır dönüyor. Yüzü yok; göğsünün ortasında yarığa benzer bir oyuk var yalnızca. Oyuk göğsündeki ışığın hizasına gelince içinde soluk bir ışık yanıyor, bekçi de taş ellerini yere koyup alnını kaldırıma değdiriyor.", en: "When you get near the rope, the warden's head turns, slow. It has no face, only a slit-shaped hollow in the middle of its chest. When that hollow lines up with yours, a faint light comes on inside it, and the warden lays its stone hands flat and touches its brow to the pavement." }
          - { tr: "Avcılardan biri tüfeğini indiriyor. \"Üç gündür ilk kez kıpırdadı,\" diyor. \"Gördünüz mü? Ona eğildi.\"", en: "One of the hunters lowers his rifle. \"First time it's moved in three days,\" he says. \"You see that? It bowed. To that one.\"" }
          - metin: { tr: "Avcı başı kolundaki Lonca halkasını görüyor, çenesiyle ödül tahtasını gösteriyor: istersen kafa senin, kristalin yarısı da.", en: "The lead hunter clocks the Guild ring on your arm and tips his head at the bounty board. The head's yours if you want it. Half the crystals too." }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Cebindeki telsiz cızırdıyor. {npc:mert_kilic|in} alıcıları, bekçi eğildiği an göğsündeki sinyalin iki katına çıktığını yakalamış.", en: "The radio in your pocket crackles. {npc:mert_kilic|pos} receivers just caught the signal in your chest doubling the second the warden bowed." }
            kosul: { bayrak: "sb12_mert_yol_kaydi" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Oyuktaki ışık göğsündekiyle aynı aralıklarla atıyor. Kule senin içinde olup biteni duyuyor; bu bekçi o haberi taşıyan bir ulak.", en: "The light in the hollow pulses on the same beat as the one in your chest. The Spire can hear what's happening inside you. This warden is just the messenger." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule herkesi sayar. bu sayılardan biri kaçmış, sana selam vermeye inmiş. kibarlık bu. kulede kibarlık hiç görmedim.", en: "the spire counts everybody. one of its numbers ran off and came down to say hello to you. that's manners. i've never seen manners in that place." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Otuz kat çıktım. Bana bir kere bile eğilmediler.\"", en: "\"I climbed thirty floors. Not one of them ever bowed to me.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dizlerinde çatlak var. Buraya oturmamış; düşmüş, kalkamıyor.\"", en: "\"Its knees are cracked. It didn't sit down here. It fell, and it can't get up.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bin kristal... Kafasında ne var ki bu kadar ediyor?\"", en: "\"A thousand crystals... What's in that head that's worth so much?\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Halatı aş, elini oyuğa koy", en: "Step over the rope. Put your hand in the hollow" }
            gerekli: { stat: { wis: 230 } }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - bayrak: "bl12_bekci_dinlendi"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_bekci_iz", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Geceleri uyandığında göğsündeki ışık hep Kule'ye dönük oluyor; bekçinin oyuğuna elini koyduğundan bu yana böyle.", en: "When you wake up at night, the light in your chest is always facing the Spire. It's been that way since you put your hand in the warden's hollow." } }
            sonraki: "bl12_kd_bekci_dinle"
          - id: "geri"
            etiket: { tr: "Avcıları durdur, bekçiyi Kule'nin kapısına yürüt", en: "Hold off the hunters. Walk the warden back to the Spire" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl12_bekci_serbest"
              - xp_seviye: 8
              - tohum: { olay: "bl12_kd_bekci_iz", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Bekçiyi Kule'ye geri yürüttüğün gün kapının yanındaki duvarda bıraktığı avuç izi hâlâ aklında.", en: "You still remember the handprint the warden left on the wall by the door the day you walked it back into the Spire." } }
            sonraki: "bl12_kd_bekci_geri"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|le} birlikte bekçiyi yukarı geri götürün", en: "Take the warden back up together with {npc:aras_kurt}" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - tehlike: { kule_dibi: -2 }
              - iliski: { aras_kurt: { saygi: 4, guven: 2 } }
              - bayrak: "bl12_bekci_serbest"
              - xp_seviye: 8
              - tohum: { olay: "bl12_kd_bekci_iz", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Bekçiyi Kule'ye geri yürüttüğün gün kapının yanındaki duvarda bıraktığı avuç izi hâlâ aklında.", en: "You still remember the handprint the warden left on the wall by the door the day you walked it back into the Spire." } }
            sonraki: "bl12_kd_bekci_geri"
          - id: "oldur"
            tur: "gosteris"
            etiket: { tr: "Ödülü al: bekçiyi tek darbede indir", en: "Take the bounty. Drop the warden in one hit" }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: -2 }
              - itibar: { lonca: 2 }
              - bayrak: "bl12_bekci_olduruldu"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_bekci_iz", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:kule_dibi|de} öldürdüğün bekçinin oyuğu söndüğünde göğsündeki ışık da bir an tekleyip durmuştu.", en: "When the light went out in the warden's hollow on {yer:kule_dibi}, the one in your chest skipped a beat too." } }
            sonraki: "bl12_kd_bekci_oldur"
          - id: "birak"
            tur: "gizle"
            etiket: { tr: "Geri çekil; bekçi Lonca'nın ödülü", en: "Back off. The warden's the Guild's bounty" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -1 }
              - tehlike: { kule_dibi: 2 }
              - bayrak: "bl12_bekci_lonca"
              - tohum: { olay: "bl12_kd_bekci_iz", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Avcıların kurşunları altında sana doğru yürüyen bekçiyi unutmadın.", en: "You haven't forgotten the warden walking toward you through the hunters' bullets." } }
            sonraki: "bl12_kd_bekci_avci"

      - id: "bl12_kd_bekci_dinle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halatı aştığında avcılar nefeslerini tutuyor. Oyuğun içi taş değil, ılık; elini koyar koymaz Kule'nin içi gözünün önünde kat kat açılıyor.", en: "When you step over the rope, the hunters hold their breath. The inside of the hollow isn't stone. It's warm. The second your hand's in, the inside of the Spire unfolds in front of your eyes, floor after floor." }
          - { tr: "Bekçinin katını görüyorsun: kırık bir taht, boş bir salon, duvarlarda sökülmüş zincirler. Katın efendisi çoktan gitmiş, bekçi de beklenecek kimse kalmayınca aşağı inmiş. Seni bulmasına bakılırsa aradığı şey yeni bir efendi değil; yön.", en: "You see the warden's floor. A broken throne, an empty hall, chains ripped out of the walls. Whoever ruled that floor is long gone, and when there was nobody left to wait for, the warden came down. Going by the fact that it found you, it isn't looking for a new master. It's looking for a direction." }
          - { tr: "Elini çektiğinde bekçi doğruluyor. Ağır adımlarla Kule'nin kapısına yürüyüp içeri giriyor; avcılardan çıt çıkmıyor.", en: "When you pull your hand back, the warden stands. It walks to the Spire's door with heavy steps and goes inside. Not a peep from the hunters." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yön istedi, sen de verdin. yukarıyı gösterdin. farkında değilsin ama gösterdin.", en: "it wanted a direction and you gave it one. you pointed up. you didn't notice, but you did." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kapı kapanana kadar arkasından bak", en: "Watch it go until the door closes" }
            sonraki: "@akis"
          - id: "avcilar"
            etiket: { tr: "Avcılara ödül tahtasını silmelerini söyle", en: "Tell the hunters to wipe the bounty board" }
            etkiler:
              - itibar: { lonca: -1 }
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_geri"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avcılarla bekçinin arasına girdiğinde tüfekler bir an sana dönüyor, sonra teker teker iniyor. \"Bin kristal,\" diye homurdanıyor biri. \"Bin kristal yürüyüp gidiyor.\"", en: "When you step between the hunters and the warden, the rifles swing toward you for a second, then come down one by one. \"A thousand crystals,\" one of them grumbles. \"A thousand crystals, just walking off.\"" }
          - { tr: "Bekçi peşine takılıyor. Meydanı geçerken attığı her adımda kaldırım taşları biraz çöker; kapının eşiğinde durup taş avucunu duvara bastırıyor. Avucunu çektiğinde duvarda soluk ışıklı bir iz kalmış.", en: "The warden follows you. Every step across the plaza sinks the paving stones a little. At the threshold it stops and presses its stone palm to the wall, and when it pulls away, there's a faintly glowing print left behind." }
          - metin: { tr: "{npc:aras_kurt} bekçinin öbür yanında yürüyor, elini kılıcının kabzasından hiç ayırmadan. Kapıda sana dönüyor: \"Bunu kimseye anlatmayacağız. Kule'nin bekçisini eve kadar götürdük diye gülerler.\" Gülümsüyor ama.", en: "{npc:aras_kurt} walks on the warden's other side, hand never leaving his sword hilt. At the door he turns to you. \"We're not telling anybody about this. They'd laugh. We walked a Spire warden home.\" He's smiling, though." }
            kosul: { yoldas: "aras_kurt" }
        secenekler:
          - id: "iz"
            etiket: { tr: "Duvardaki ize dokun", en: "Touch the print on the wall" }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Avcılara kristal yerine bir tur içki ısmarla", en: "Buy the hunters a round instead of the crystals" }
            etkiler:
              - itibar: { lonca: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_oldur"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tek darbe yetiyor. Bekçi karşı koymuyor; başını eğik tutuyor, taş göğsü ortadan yarılırken bile.", en: "One hit is all it takes. The warden doesn't fight back. It keeps its head bowed, even as its stone chest splits down the middle." }
          - { tr: "Oyuktaki ışık söndüğü anda seninki de tekliyor; göğsünde bir vuruş boşa düşüyor, sonra her şey yerine oturuyor. Avcılar alkışlıyor, ödül tahtasındaki rakamı biri siliyor bile.", en: "The instant the light in the hollow goes out, yours stutters. One beat in your chest just drops, and then everything settles back. The hunters are clapping. Somebody's already wiping the number off the bounty board." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "haberciyi vurdun. haber yine gelecek, yalnız bu sefer kapını kimse çalmayacak.", en: "you shot the messenger. the message is still coming. it just won't knock this time." }
        secenekler:
          - id: "odul"
            etiket: { tr: "Ödülü avcılarla paylaş", en: "Split the bounty with the hunters" }
            etkiler:
              - itibar: { lonca: 1 }
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Ödülü almadan yürü git", en: "Walk away without the bounty" }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_avci"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekildiğin an ilk kurşun patlıyor. Bekçi sonunda ayağa kalkıyor; ama avcılara değil, sana doğru yürüyor, kurşunlar zırhında kıvılcım saçarken bile.", en: "The moment you step back, the first shot goes off. The warden finally gets to its feet, but it doesn't go for the hunters. It walks toward you, sparks flying off its armor as the rounds hit." }
          - { tr: "İki avcı panikleyip halatın önünde birbirine çarpıyor, biri dizini kırıyor. Bekçi halata bir adım kala yığılıyor; taş eli sana uzanmış, oyuğu karanlık.", en: "Two hunters panic and slam into each other at the rope, and one of them busts a knee. The warden goes down one step short of the rope, stone hand reaching for you, its hollow dark." }
          - { tr: "O gece Kule'nin alt katlarından inen kırıntılar ikiye katlanıyor. Kapıyı tutan bir bekçi eksilmiş; bunu herkes ancak sonradan anlayacak.", en: "That night, twice as many shards come down from the Spire's lower floors. One less warden holding a door. Everybody will figure that out later." }
        secenekler:
          - id: "yarali"
            etiket: { tr: "Dizini kıran avcıyı sırtlayıp revire taşı", en: "Carry the hunter with the busted knee to the aid station" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Bekçinin uzanmış eline bir süre bak", en: "Look at the warden's outstretched hand for a while" }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule Dibi: bekçinin izi (tohum)
  - id: "bl12_kd_bekci_iz"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["kule", "yol"]
    gerilim: 2
    kart: { tr: "Duvardaki iz", en: "Marks on the Wall" }
    sahne: "bl12_kd_bekci_iz_1"
    sahneler:
      - id: "bl12_kd_bekci_iz_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bu sabah Kule'nin dış cephesinde, kapının hemen yanından başlayan bir iz var. Avuç büyüklüğünde, soluk ışıklı izler taşın üstünde merdiven gibi yukarı tırmanıyor ve bulutun içinde kayboluyor.", en: "This morning there's a trail on the Spire's outer face, starting right next to the door. Palm-sized marks, faintly glowing, climbing the stone like a ladder until they disappear into the clouds." }
          - { tr: "Tırmanıcılar dibinde toplanmış. İzler yalnızca sen yaklaşınca parlıyor; sen uzaklaştıkça sönüp sıradan taşa dönüyorlar. Dün gece biri sensiz denemiş, on kat yukarıda tutunacak yer bulamayıp halatına asılı kalmış.", en: "Climbers are gathered at the bottom. The marks only light up when you get close. Walk away and they fade back into plain stone. Somebody tried it last night without you, ran out of holds ten floors up, and ended up dangling from his rope." }
          - metin: { tr: "İzler tanıdık. Bekçinin oyuğuna elini koyduğunda gördüğün katın yönünü gösteriyorlar.", en: "You know these marks. They point toward the floor you saw when you put your hand in the warden's hollow." }
            kosul: { bayrak: "bl12_bekci_dinlendi" }
          - metin: { tr: "İlk iz, bekçinin kapının yanına bastırdığı avucun ta kendisi. Ötekiler ondan yukarı uzanıyor.", en: "The first mark is the very handprint the warden pressed by the door. The rest climb up from there." }
            kosul: { bayrak: "bl12_bekci_serbest" }
          - metin: { tr: "Bekçiyi öldürdüğün yerden başlıyorlar; kaldırımda hâlâ taş tozu var. Kule haberini başka yoldan yollamış.", en: "They start right where you killed the warden. There's still stone dust on the pavement. The Spire found another way to send its message." }
            kosul: { bayrak: "bl12_bekci_olduruldu" }
          - metin: { tr: "{fraksiyon:lonca} avcıları ize çoktan el koymuş. Dibine bir masa kurmuşlar; masada bir tabela: Kule Kestirmesi, kat başına beş kristal.", en: "The {fraksiyon:lonca} hunters have already claimed the trail. They've set up a table at the bottom with a sign on it: Spire Shortcut, five crystals a floor." }
            kosul: { bayrak: "bl12_bekci_lonca" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Her iz bir öncekinden biraz daha sıcak. En üsttekini göremiyorsun ama kokusunu alıyorsun: yanık taş ve seninkine benzeyen bir ışık.", en: "Every mark is a little warmer than the one below it. You can't see the top one, but you can smell it. Scorched stone, and a light a lot like yours." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule sana yol çiziyor. sen yol olurken. komik değil mi? bence çok komik.", en: "the spire is drawing you a path. right while you're turning into one. isn't that funny? i think it's very funny." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kestirme mi? Kule'de kestirme olmaz. Kule'de bedel olur.\"", en: "\"A shortcut? There's no such thing in the Spire. There's only the price.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"İzler senin sinyalinle aynı frekansta yanıyor. Kule seni duyuyor. Bu... bu kötü bir şey mi, onu da bilmiyorum.\"", en: "\"The marks are lighting up on your frequency. The Spire can hear you. Is that... bad? I genuinely don't know.\"" }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Tırmanıcıları arkana al, izi birlikte çıkın", en: "Bring the climbers along. Climb the trail together" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl12_iz_paylasildi"
              - xp_seviye: 10
            sonraki: "bl12_kd_bekci_iz_paylas"
          - id: "tek"
            etiket: { tr: "İzi tek başına, sonuna kadar tırman", en: "Climb the trail alone, all the way up" }
            gerekli: { stat: { agi: 240 } }
            etkiler:
              - bayrak: "bl12_iz_tirmanildi"
              - xp_seviye: 14
            sonraki: "bl12_kd_bekci_iz_tek"
          - id: "sil"
            etiket: { tr: "İzleri kazı; peşinden kimse gelmesin", en: "Scrape the marks off. Nobody follows you up there" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - bayrak: "bl12_iz_silindi"
            sonraki: "bl12_kd_bekci_iz_sil"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} yarış teklif et: senin izin, onun ezberi", en: "Race {npc:aras_kurt} thirty floors: your trail vs. his memory" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, baglilik: 2 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl12_kd_bekci_iz", agirlik: 20 }
              - xp_seviye: 9
            sonraki: "bl12_kd_bekci_iz_yaris"

      - id: "bl12_kd_bekci_iz_paylas"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Önde sen, arkanda on bir tırmanıcı. Elin değdikçe izler parlıyor, arkandakiler de ışık sönmeden yetişmeye çalışıyor. Yirminci katın hizasında bir kırıntı yuvasına denk geliyorsunuz; yuvayı sen dağıtıyorsun, öbürleri ayıklıyor.", en: "You up front, eleven climbers behind you. Every mark lights when your hand touches it, and the ones below scramble to reach it before it fades. Level with the twentieth floor, you run into a shard nest. You break it up. They clean out what's left." }
          - { tr: "Akşam aşağı indiğinizde tırmanıcılardan biri izin dibine tebeşirle küçük bir ok çiziyor, yanına da bir tarih. \"Buradan biri yol açtı,\" diyor. \"Unutulmasın.\"", en: "When you come down that evening, one of the climbers chalks a little arrow at the foot of the trail and writes the date next to it. \"Somebody opened a road here,\" she says. \"So nobody forgets.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Tebeşiri al, okun yanına bir çizgi daha çek", en: "Take the chalk and add a line next to the arrow" }
            sonraki: "@akis"
          - id: "dinlen"
            etiket: { tr: "Tırmanıcılarla meydanda soluklan", en: "Catch your breath on the plaza with the climbers" }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_iz_tek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bulutun içinden geçiyorsun. İzler seni rüzgârın ıslığından başka sesin olmadığı bir çıkıntıya getiriyor; Kule'nin dış cephesinde, hiçbir katın penceresinin açılmadığı bir yere.", en: "You climb up through the cloud. The marks bring you to a ledge where the only sound is the wind whistling, somewhere on the Spire's outer face where no floor has a window." }
          - metin: { tr: "Çıkıntıda bekçi oturuyor. Seni görünce başını eğiyor, oyuğundaki ışığı avucuna alıp sana uzatıyor. Işık eline değince göğsündeki düğüm bir an gevşiyor; yön değil bu, bir onay.", en: "The warden is sitting on the ledge. When it sees you, it bows its head, scoops the light out of its hollow, and holds it out. When the light touches your hand, the knot in your chest loosens for a second. It isn't a direction. It's a yes." }
            kosul: { herhangi: [{ bayrak: "bl12_bekci_dinlendi" }, { bayrak: "bl12_bekci_serbest" }] }
          - metin: { tr: "Çıkıntı boş. Yalnızca taşa oyulmuş bir oturak var, bekçinin boyutunda. Üstünde ince bir toz tabakası; kimse oturmamış, kimse de oturmayacak.", en: "The ledge is empty. There's just a seat cut into the stone, warden-sized. A thin layer of dust on it. Nobody's sat there, and nobody's going to." }
            kosul: { bayrak_yok: ["bl12_bekci_dinlendi", "bl12_bekci_serbest"] }
          - { tr: "Aşağıda şehir küçücük. {yer:kiyikent_liman}, {yer:kordon}, {yer:tepe}; gece olunca bunların hepsi göğsünden yayılan ışığı görecek.", en: "The city's tiny down there. {yer:kiyikent_liman|b}, {yer:kordon}, {yer:tepe}. When night falls, every one of them is going to see the light coming off your chest." }
        secenekler:
          - id: "in"
            etiket: { tr: "Rüzgâr dinene kadar otur, sonra in", en: "Sit until the wind dies down, then climb down" }
            sonraki: "@akis"
          - id: "isaret"
            etiket: { tr: "Çıkıntıya kendi avuç izini bırak", en: "Leave your own handprint on the ledge" }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_iz_sil"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bıçağının sırtıyla ilk izi kazıyorsun; taş tozu dökülürken iz bir kez parlayıp sönüyor. Tırmanıcılar sesini çıkarmıyor ama yüzleri her şeyi söylüyor.", en: "You scrape the first mark with the back of your blade. As the stone dust falls, it flares once and goes out. The climbers don't say anything. Their faces say plenty." }
          - { tr: "Öğlene kadar ilk on katın izlerini kazıyorsun. Gerisine elin yetişmiyor. Gece bakıyorsun: yukarıdakiler hâlâ yanıyor, bulutun içinde, yalnızca senin görebileceğin kadar.", en: "By noon you've scraped off the first ten floors' worth. You can't reach the rest. That night you look up, and the ones higher up are still burning in the cloud, just bright enough for you to see." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bıçağını kına sok", en: "Sheathe your blade" }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Tırmanıcılara neden yaptığını anlat", en: "Tell the climbers why you did it" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_bekci_iz_yaris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} kılıcını sırtına bağlarken sırıtıyor. \"Senin izin var, benim de otuz katlık ezberim. Hile değil mi bu?\" Cevabını beklemeden duvara atılıyor.", en: "{npc:aras_kurt} grins as he straps his sword to his back. \"You've got a glowing trail. I've got thirty floors memorized. Isn't that cheating?\" He doesn't wait for an answer before he jumps at the wall." }
          - { tr: "Otuzuncu katın hizasına aynı anda varıyorsunuz, nefes nefese. {npc:aras_kurt} başını taşa yaslıyor. \"Berabere. Yazmıyoruz bunu. Bir dahakine izin falan olmayacak.\"", en: "You hit the thirtieth floor at the same time, both of you wheezing. {npc:aras_kurt} rests his head against the stone. \"Tie. We're not counting it. And next time, no glowing trail.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Bir dahakine.\"", en: "\"Next time.\"" }
            sonraki: "@akis"
          - id: "takil"
            etiket: { tr: "\"Ben bir adım öndeydim.\"", en: "\"I was a step ahead.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · SENETÇİ
  - id: "bl12_kd_senet"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["cok_evren", "kervan", "kesif"]
    gerilim: 3
    kart: { tr: "Pirinç kuyruk", en: "The Brass Line" }
    sahne: "bl12_kd_senet_1"
    sahneler:
      - id: "bl12_kd_senet_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısının önünde bir kuyruk var: kırk, belki elli kişi. Bavullar, bebek arabaları, bir kafeste iki tavuk. Kuyruğun başında, katlanır bir masanın ardında uzun boylu, altı parmaklı bir Tavvar oturuyor.", en: "There's a line in front of the Spire's door. Forty people, maybe fifty. Suitcases, strollers, two chickens in a cage. At the head of the line, behind a folding table, sits a tall, six-fingered Tavvari." }
          - { tr: "Masada pirinç levhalar dizili. Tavvar her imza için bir pul uzatıyor, pulu da imzalayanın boynuna dikiyor. \"Kadim kaydına geçen hasat edilmez,\" diye tekrarlıyor kırık bir Türkçeyle. \"Mal hasat edilmez. Mal korunur. Ellinci kata taşınmak da dahil.\"", en: "Brass plates are lined up on the table. For every signature, the Tavvari hands over a chit and stitches it into the signer's neck. \"Recorded in an Ancient ledger, not harvested,\" it keeps saying in broken English. \"Property is not harvested. Property is protected. Carry to fiftieth floor included.\"" }
          - { tr: "Kuyruğun ortasında iki çocuğunun yakasını düzelten bir kadın seni görünce gözlerini kaçırıyor. \"Bakma öyle,\" diyor. \"Sen ne yapacaksın, bizi Hasat'tan sen mi koruyacaksın?\"", en: "In the middle of the line, a woman is straightening her two kids' collars. When she sees you, she looks away. \"Don't look at me like that,\" she says. \"What are you gonna do, protect us from the Harvest yourself?\"" }
          - metin: { tr: "Levhaların altındaki imza tanıdık: senin adın. Senet senin adına yeniden yazıldığından beri Kervan'a kim girerse senin malın olarak giriyor.", en: "The signature at the bottom of the plates looks familiar. It's your name. Ever since the bond was rewritten in your name, anybody who boards the Caravan boards as your property." }
            kosul: { bayrak: "kervan_sahibi" }
          - metin: { tr: "Kervan özgür ve Karanlık Rota'da; senetçinin kime çalıştığı belli değil. Pirinç levhaların köşesinde eski Senet Kulesi'nin mührü duruyor, kazınmaya çalışılmış.", en: "The Caravan is free and out on the Dark Route, so who this broker works for is anybody's guess. In the corner of every brass plate is the old Bond Tower's seal, half scraped off." }
            kosul: { bayrak: "kervan_ozgur" }
          - metin: { tr: "Levhaların köşesindeki mühür taze: Senet Kulesi hâlâ ayakta, Mühürdar da yeni mal topluyor.", en: "The seal in the corner of the plates is fresh. The Bond Tower's still standing, and the Sealkeeper is shopping for new property." }
            kosul: { bayrak: "kervan_muhur_korundu" }
        sezgiler:
          - kosul: { stat: { int: 230 } }
            metin: { tr: "Levhalardaki Tavvar hecelerini okuyabiliyorsun. Süre: dört yüz on iki yıl. Mirasçılara geçer.", en: "You can read the Tavvari syllables on the plates. Term: four hundred and twelve years. Passes to heirs." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hasattan kaçmak için birinin malı oluyorlar. bunu ilk akıl eden onlar değil. sonuncu da olmayacaklar.", en: "they're becoming somebody's property to dodge the harvest. they're not the first to think of it. they won't be the last." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklara da pul dikiyor. Çocuklara.\"", en: "\"It's stitching chits into the kids too. The kids.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Mantıklı aslında. Korkunç ama mantıklı. Ben de düşündüm, yalan yok.\"", en: "\"It actually makes sense. Horrible, but it makes sense. I thought about it too, not gonna lie.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Senedi yüksek sesle oku; ne imzaladıklarını duysunlar", en: "Read the bond out loud. Let them hear what they're signing" }
            gerekli: { stat: { int: 230 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - itibar: { kadimler: -2 }
              - bayrak: "bl12_senet_okundu"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_senet_donen", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kule'nin önündeki senet kuyruğunu dağıttın ama aklın hâlâ ellinci katta: oradan aşağı ne inecek?", en: "You broke up the bond line in front of the Spire, but your mind's still on the fiftieth floor. What's going to come back down?" } }
            sonraki: "bl12_kd_senet_oku"
          - id: "yirt"
            etiket: { tr: "Senetler senin adına; levhaları masada kır", en: "The bonds are in your name. Break the plates on the table" }
            goster: { bayrak: "kervan_sahibi" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { kadimler: -3 }
              - bayrak: "bl12_senet_yirtildi"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_senet_donen", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kule'nin önünde kırdığın pirinç levhalar hâlâ aklında; kırılmadan önce imzalananlar da.", en: "You still think about the brass plates you broke in front of the Spire. And the ones that got signed before you broke them." } }
            sonraki: "bl12_kd_senet_yirt"
          - id: "kov"
            etiket: { tr: "Senetçiyi meydandan kov", en: "Run the broker off the plaza" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 1 }
              - itibar: { kadimler: -3 }
              - dikkat: 1
              - bayrak: "bl12_senet_kovuldu"
              - tohum: { olay: "bl12_kd_senet_donen", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Senetçiyi Kule'nin önünden kovduğunda kuyruktaki kadının söylediği hâlâ kulağında.", en: "What the woman in the line said when you ran the broker off is still ringing in your ears." } }
            sonraki: "bl12_kd_senet_kov"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} kuyruktakileri muayene ettir", en: "Have {npc:elif_sari} check the people in line" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - bayrak: "bl12_senet_okundu"
              - xp_seviye: 8
              - tohum: { olay: "bl12_kd_senet_donen", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kule'nin önündeki senet kuyruğunu dağıttın ama aklın hâlâ ellinci katta: oradan aşağı ne inecek?", en: "You broke up the bond line in front of the Spire, but your mind's still on the fiftieth floor. What's going to come back down?" } }
            sonraki: "bl12_kd_senet_elif"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "Kuyruğun yanından geç; onların seçimi", en: "Walk past the line. Their choice" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -1 }
              - bayrak: "bl12_senet_imzalandi"
              - tohum: { olay: "bl12_kd_senet_donen", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kule'nin önündeki senet kuyruğunun yanından sesini çıkarmadan geçmiştin.", en: "You walked right past the bond line in front of the Spire without saying a word." } }
            sonraki: "bl12_kd_senet_sus"

      - id: "bl12_kd_senet_oku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Levhayı masadan alıp heceleri tek tek okuyorsun. Dört yüz on iki yıl. Mirasçılara geçer. Malın değeri sahibince belirlenir. Kuyruk her cümlede biraz daha susuyor.", en: "You pick a plate up off the table and read it out, syllable by syllable. Four hundred and twelve years. Passes to heirs. Value of property set by owner. The line gets a little quieter with every sentence." }
          - { tr: "Tavvar itiraz etmiyor; yalnızca bir pul daha uzatıyor, bu kez sana. \"Doğru okudun,\" diyor. \"Biz yalan söylemeyiz. Biz satarız.\" Kuyruğun yarısı dağılıyor. Öbür yarısı kıpırdamıyor.", en: "The Tavvari doesn't argue. It just holds out another chit, to you this time. \"You read it right,\" it says. \"We don't lie. We sell.\" Half the line breaks up. The other half doesn't budge." }
          - { tr: "İki çocuklu kadın yerinde kalanlardan. \"Dört yüz yıl köle,\" diyor, \"ya da yıl sonunda hiç. Sen olsan hangisini seçerdin?\"", en: "The woman with two kids is one of the ones who stayed. \"Four hundred years a slave,\" she says, \"or nothing at all by the end of the year. Which one would you pick?\"" }
        secenekler:
          - id: "cevap"
            etiket: { tr: "\"Yıl sonuna kadar beni bekle.\"", en: "\"Give me till the end of the year.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Cevap verme; levhayı masaya bırak", en: "Don't answer. Put the plate back on the table" }
            sonraki: "@akis"

      - id: "bl12_kd_senet_yirt"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk levha avucunda ikiye ayrılıyor. Tavvar ayağa fırlıyor, sonra adını levhalarda görüp yerine oturuyor. Malın sahibi malını istediği gibi kullanır; Tavvar kanunu da bu.", en: "The first plate snaps in half in your hand. The Tavvari shoots to its feet, then sees your name on the plates and sits back down. An owner does what they like with their property. That's Tavvari law too." }
          - { tr: "Kırk levhayı kırıyorsun. Boyunlara dikilmiş pullar bir bir kararıp düşüyor. Ancak masanın altındaki sandıkta, bu sabah imzalanıp yukarı taşınmış on bir kişinin levhası yok. Onlar çoktan gitmiş.", en: "You break forty plates. One by one, the chits stitched into people's necks go dark and drop off. But the chest under the table is missing eleven plates: the ones signed this morning and carried upstairs. Those people are already gone." }
        secenekler:
          - id: "sor"
            etiket: { tr: "Senetçiye o on bir kişinin nereye gittiğini sor", en: "Ask the broker where those eleven went" }
            sonraki: "@akis"
          - id: "dagit"
            etiket: { tr: "Kuyruktakileri evlerine gönder", en: "Send the people in line home" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_senet_kov"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Masayı devirdiğinde pirinç levhalar kaldırıma saçılıyor. Tavvar onları telaşsızca toplarken pullarından biri senin dilinde tek bir hece fısıldıyor: borç.", en: "When you flip the table, the brass plates scatter across the pavement. The Tavvari gathers them up without any hurry, and one of its chits whispers a syllable in your language: debt." }
          - { tr: "Kuyruk dağılıyor ama kimse sana teşekkür etmiyor. İki çocuklu kadın bavulunu sürükleyerek yanından geçerken başını bile çevirmiyor. \"Yarın başka bir yerde kurar,\" diyor biri arkadan. \"Sen her gün burada olamazsın.\"", en: "The line breaks up, but nobody thanks you. The woman with two kids drags her suitcase past without so much as turning her head. \"It'll set up somewhere else tomorrow,\" somebody says behind you. \"You can't be here every day.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Devrilen masayı kaldır", en: "Set the table back up" }
            sonraki: "@akis"
          - id: "seslen"
            etiket: { tr: "Kadının arkasından seslen: \"Bir yol bulacağım.\"", en: "Call after the woman. \"I'll find a way.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_senet_elif"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} çantasını masanın kenarına koyup kuyruktakilerin ensesine tek tek bakıyor. Pulların dikildiği yerin çevresi morarmış; deriyle pirinç birbirine kaynamaya başlamış.", en: "{npc:elif_sari} sets her bag on the edge of the table and checks the back of every neck in line. The skin around the stitched chits is bruising. Flesh and brass are starting to fuse." }
          - { tr: "\"Bu pul söküldüğünde iz bırakır,\" diyor yüksek sesle, herkes duysun diye. \"Bir hafta sonra sökülmez. Bir ay sonra bu pul sizsiniz.\" Sesi titremiyor; acil serviste kötü haber vermeye alışkın.", en: "\"This chit will scar when it comes out,\" she says, loud enough for everybody to hear. \"After a week, it won't come out. After a month, the chit is you.\" Her voice doesn't shake. She's used to delivering bad news in the ER." }
          - { tr: "Kuyruğun yarısı dağılıyor. {npc:elif_sari} çantasını kapatırken sana dönüyor: \"Öbür yarısını ikna edemem. Hasat'tan korkmak hastalık değil.\"", en: "Half the line breaks up. As {npc:elif_sari} snaps her bag shut, she turns to you. \"I can't talk the other half out of it. Being scared of the Harvest isn't a disease.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Sağ ol, doktor.\"", en: "\"Thanks, Doc.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 2 } }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Kalanlarla biraz daha konuş", en: "Talk to the ones who stayed a little longer" }
            sonraki: "@akis"

      - id: "bl12_kd_senet_sus"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yanlarından geçerken kimse sana bakmıyor. Tavvar bir pul daha dikiyor, sonra bir tane daha; iğnesi deriden geçerken çocuklardan biri ağlamıyor bile.", en: "Nobody looks at you as you go by. The Tavvari stitches in another chit, then another. One of the kids doesn't even cry when the needle goes through." }
          - { tr: "Akşamüstü kuyruk bitmiş. Taşıyıcılar sırtlarında imzalayanları Kule'nin içine, ellinci kata doğru taşıyor. Meydanda yalnızca iki tavuklu kafes kalmış; senet hayvanları kabul etmiyormuş.", en: "By late afternoon the line's gone. Porters carry the signers up into the Spire on their backs, toward the fiftieth floor. All that's left on the plaza is the cage with the two chickens. Turns out the bond doesn't take animals." }
        secenekler:
          - id: "tavuk"
            etiket: { tr: "Kafesi alıp aşevine götür", en: "Take the cage to the soup kitchen" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Meydandan ayrıl", en: "Leave the plaza" }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule Dibi: geri dönen (tohum)
  - id: "bl12_kd_senet_donen"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["cok_evren", "kervan"]
    gerilim: 3
    kart: { tr: "Boynundaki pul", en: "The Chit in His Neck" }
    sahne: "bl12_kd_senet_donen_1"
    sahneler:
      - id: "bl12_kd_senet_donen_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısından bir adam fırlıyor, yalınayak, gömleği yırtık. Ensesindeki pirinç pul kararmış, çevresi kabuk bağlamış. Seni görünce dizlerinin üstüne çöküyor.", en: "A man bursts out of the Spire's door, barefoot, shirt torn. The brass chit in the back of his neck has gone dark, and the skin around it has scabbed over. When he sees you, he drops to his knees." }
          - { tr: "\"Ferhat,\" diyor, adını sormadığın halde. \"Kuyruktaydım. Orada kimse hasat edilmiyor, doğru. Kimse uyumuyor da. Kazanın başında, yemek yerine pul veriyorlar.\" Arkasından, kapının karanlığından pirinç bir ses tıkırdıyor.", en: "\"Frank,\" he says, though you didn't ask. \"I was in line. Nobody gets harvested up there, that's true. Nobody sleeps either. They keep you at the boilers and pay you in chits instead of food.\" Behind him, from the dark of the doorway, comes a brass clicking." }
          - { tr: "Kapıdan bir Gümrük Muhafızı çıkıyor. Kalkanında Kervan'ın terazisi, elinde bir pirinç levha: Ferhat'ın senedi. \"Mal kaçtı,\" diyor, sesi dümdüz. \"Mal geri gelir.\"", en: "A Tariff Warden steps out of the door, the Caravan's scale on its shield and a brass plate in its hand: Frank's bond. \"Property ran,\" it says, flat. \"Property comes back.\"" }
          - metin: { tr: "Senedi yüksek sesle okuduğun gün kuyrukta kalanlardandı Ferhat. Şimdi sana öyle bakıyor ki ne diyeceğini bilemiyorsun.", en: "Frank was one of the ones who stayed in line the day you read the bond out loud. The way he's looking at you now, you don't know what to say." }
            kosul: { bayrak: "bl12_senet_okundu" }
          - metin: { tr: "Ferhat sabah taşınan on bir kişiden biri; levhalarını kırdığın gün çoktan yukarıdaydı.", en: "Frank is one of the eleven who got carried up that morning. He was already upstairs the day you broke the plates." }
            kosul: { bayrak: "bl12_senet_yirtildi" }
          - metin: { tr: "Senetçiyi kovduğun gün ertesi sabah {yer:eski_sehir|de} bir avluda masa açmış; Ferhat da o avlunun kuyruğundaymış.", en: "The day after you ran the broker off, it set up its table in a courtyard in {yer:eski_sehir}. Frank was in that line." }
            kosul: { bayrak: "bl12_senet_kovuldu" }
          - metin: { tr: "Ferhat'ı hatırlıyorsun: yanından geçtiğin kuyrukta, iki tavuklu kafesin hemen önündeydi.", en: "You remember Frank. He was in the line you walked past, right in front of the chicken cage." }
            kosul: { bayrak: "bl12_senet_imzalandi" }
        sezgiler:
          - kosul: { stat: { per: 230 } }
            metin: { tr: "Muhafızın zırhı Kervan'dan beri onarılmamış; sol omzunun altında bir çatlak var. Kalkanı o yüzden sağ elinde.", en: "The warden's armor hasn't been patched since the Caravan. There's a crack under its left shoulder. That's why the shield's in its right hand." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "malın sahibine dönmesi kanundur, diyor. ben de bir zamanlar biriydim. kimin malıydım, onu hatırlamıyorum.", en: "property returns to its owner, it says. i was somebody's once. i don't remember whose." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Çatlağı görüyor musun? Sol omuz. Ben hallederim, sen adamı tut.\"", en: "\"See that crack? Left shoulder. I'll handle it, you hold onto the guy.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "{npc:deniz_arman} hiçbir şey söylemeden Ferhat'ın önüne geçiyor.", en: "{npc:deniz_arman} steps in front of Frank without a word." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Muhafızın önüne dikil", en: "Plant yourself in front of the warden" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya"], ortam: ["tavan"], kazan: "bl12_kd_senet_donen_kazan", kaybet: "bl12_kd_senet_donen_yenilgi" }
          - id: "sahip"
            etiket: { tr: "\"Kervan'ın senedi bende. Bu adamı azat ediyorum.\"", en: "\"I hold the Caravan's bond. I'm setting this man free.\"" }
            goster: { bayrak: "kervan_sahibi" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "bl12_donen_kurtarildi"
              - xp_seviye: 9
            sonraki: "bl12_kd_senet_donen_azat"
          - id: "kanun"
            etiket: { tr: "Kervan'ın kanunu: borcunu kendi kristalinle öde", en: "Caravan law: pay off his debt with your own crystals" }
            gerekli: { stat: { cha: 240 } }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { kadimler: 1 }
              - bayrak: "bl12_donen_kurtarildi"
              - xp_seviye: 8
            sonraki: "bl12_kd_senet_donen_azat"
          - id: "teslim"
            etiket: { tr: "Kenara çekil; imzayı kendi attı", en: "Step aside. He signed it himself" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - itibar: { kadimler: 2 }
              - bayrak: "bl12_donen_teslim"
            sonraki: "bl12_kd_senet_donen_teslim"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} adamı limana kaçırsın; muhafızı sen oyala", en: "Let {npc:deniz_arman} sneak him down to the docks. You stall the warden" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
              - itibar: { kadimler: -2 }
              - bayrak: "bl12_donen_kurtarildi"
              - xp_seviye: 8
            sonraki: "bl12_kd_senet_donen_kacis"

      - id: "bl12_kd_senet_donen_kazan"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Muhafız pirinç bir gümbürtüyle kaldırıma yığılıyor. Elindeki levha yuvarlanıp ayağının dibinde duruyor; Ferhat'ın adı üstünde hâlâ parlıyor.", en: "The warden crashes to the pavement with a brass clang. The plate rolls out of its hand and stops at your feet, Frank's name still shining on it." }
          - { tr: "Levhayı kırdığında Ferhat'ın ensesindeki pul düşüyor; yerinde parmak boğumu kadar bir yara kalıyor. Ferhat elini oraya götürüp ağlamaya başlıyor, sessizce, yüzünü kimseye göstermeden.", en: "When you break the plate, the chit drops out of Frank's neck and leaves a wound the size of a knuckle. He reaches back to touch it and starts crying, quietly, keeping his face to himself." }
        secenekler:
          - id: "liman"
            etiket: { tr: "Ferhat'ı revire yolla", en: "Send Frank to the aid station" }
            etkiler:
              - bayrak: "bl12_donen_kurtarildi"
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Kazanın başında kalanları sor", en: "Ask about the ones still at the boilers" }
            etkiler:
              - bayrak: "bl12_donen_kurtarildi"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl12_kd_senet_donen_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kaldırımda gözlerini açtığında muhafız gitmiş, Ferhat da. Yalnızca kapının eşiğinde kırık bir tırnak duruyor; içeri sürüklenirken taşa tutunmaya çalışmış.", en: "When you open your eyes on the pavement, the warden's gone. So is Frank. All that's left is a broken fingernail on the threshold, where he tried to grab the stone as he got dragged inside." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve tırnağı cebine koy", en: "Get up and put the fingernail in your pocket" }
            etkiler:
              - bayrak: "bl12_donen_teslim"
            sonraki: "@akis"
          - id: "yaz"
            etiket: { tr: "Ferhat'ın adını bir yere yaz; unutma", en: "Write Frank's name down. Don't forget it" }
            etkiler:
              - bayrak: "bl12_donen_teslim"
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_senet_donen_azat"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Muhafız levhayı sana uzatıyor; pirinç parmakları bir an duraksıyor, sonra bırakıyor. Kanun kanundur. Levha avucunda ısınıp kararıyor, Ferhat'ın ensesindeki pul da yere düşüyor.", en: "The warden holds the plate out to you. Its brass fingers hesitate for a second, then let go. Law is law. The plate goes warm in your palm and dark, and the chit in Frank's neck drops to the ground." }
          - { tr: "Muhafız dönüp Kule'nin karanlığına yürüyor. Ferhat ensesini ovuşturarak arkasından bakakalmış. \"Kazanda otuz kişi daha var,\" diyor. \"Hepsinin adını biliyorum.\"", en: "The warden turns and walks back into the dark of the Spire. Frank watches it go, rubbing the back of his neck. \"There are thirty more at the boilers,\" he says. \"I know every one of their names.\"" }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adları bir kâğıda yazdır", en: "Have him write the names down" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Ferhat'ı evine yolla", en: "Send Frank home" }
            sonraki: "@akis"

      - id: "bl12_kd_senet_donen_teslim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kenara çekildiğinde Ferhat sana inanamıyormuş gibi bakıyor. Muhafız onu kolundan tutup kaldırıyor; nazikçe, kırılacak bir malı taşır gibi.", en: "When you step aside, Frank stares at you like he can't believe it. The warden lifts him by the arm. Gently, the way you'd handle fragile merchandise." }
          - { tr: "Kapının eşiğinde Ferhat bir kez dönüp bakıyor, tek kelime etmeden. Pirincin tıkırtısı merdivenlerde uzaklaşırken meydandaki tırmanıcılar da seninle göz göze gelmemeye çalışıyor.", en: "At the threshold, Frank turns around once. He doesn't say anything. As the clicking of brass fades up the stairs, the climbers on the plaza try hard not to meet your eyes." }
        secenekler:
          - id: "git"
            etiket: { tr: "Meydandan ayrıl", en: "Leave the plaza" }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Kapı kapanana kadar bekle", en: "Wait until the door closes" }
            sonraki: "@akis"

      - id: "bl12_kd_senet_donen_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Muhafızın önüne geçip senedin hecelerini tek tek sorgulamaya başlıyorsun: hangi tarihte, hangi tanıkla, hangi mühürle. Kervan'ın kanunu soruyu cevapsız bırakmaz; muhafız her heceyi sabırla açıklıyor.", en: "You plant yourself in front of the warden and start questioning the bond syllable by syllable. What date, what witness, what seal. Caravan law doesn't leave a question unanswered, and the warden patiently explains every one." }
          - { tr: "Onuncu hecede başını kaldırdığında Ferhat da {npc:deniz_arman} da çoktan gitmiş. Muhafız meydanı süzüyor, sonra levhayı göğsüne bastırıyor. \"Mal kaçtı,\" diyor. \"Kayda geçti.\"", en: "When it looks up on the tenth syllable, Frank and {npc:deniz_arman} are long gone. The warden scans the plaza, then presses the plate to its chest. \"Property ran,\" it says. \"It's in the record.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gülümse ve meydandan çık", en: "Smile and walk off the plaza" }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "\"Kayda benim adımı da geçir.\"", en: "\"Put my name in the record too.\"" }
            etkiler:
              - dikkat: 1
            sonraki: "@akis"

  # ================================================================== BATIK TAKIMADA · KEMİK SUYU
  - id: "bl12_bt_dalgiclar"
    konum: ["batik_takimada"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak: "batik_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Kemik suyu", en: "Bone Water" }
    sahne: "bl12_bt_dalgiclar_1"
    sahneler:
      - id: "bl12_bt_dalgiclar_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çanlar bu sabah başka çalıyor: iki kısa, bir uzun. Nehhalar buna kemik suyu diyor. Yılda bir kez deniz çekiliyor, boğulmuş sokakların üstündeki su bir kulaç sığlaşıyor.", en: "The bells are ringing differently this morning. Two short, one long. The Nehha call it bone water. Once a year the sea pulls back, and the water over the drowned streets gets one fathom shallower." }
          - { tr: "Sallarda genç dalgıçlar bellerine taş bağlıyor. Mercan çobanları her yıl atalarının kemiklerini biraz daha örtüyor; dalgıçlar da mercan yutmadan kemikleri çıkarmak istiyor.", en: "Out on the rafts, young divers are tying stones around their waists. Every year the Reef Shepherds grow a little more coral over their ancestors' bones, and these kids want to bring the bones up before the reef swallows them." }
          - { tr: "Dalgıç başı, Vael-Sa adında bir kız, sana dönüyor. \"Aşağısı karanlık,\" diyor. \"Senin ışığın bu dünyadaki tek ışık. Bizimle dal.\" Arkasındaki salda yaşlı bir Nehha başını iki yana sallıyor.", en: "The divers' leader, a girl named Vael-Sa, turns to you. \"It's dark down there,\" she says. \"Your light is the only light in this world. Dive with us.\" On the raft behind her, an old Nehha shakes his head." }
          - { tr: "\"Mercan da mezardır,\" diyor yaşlı adam. Adı Moru. \"İki yüz yıldır deniz onları sarıyor. Bırakın sarsın.\"", en: "\"Coral is a grave too,\" the old man says. His name's Moru. \"The sea's been wrapping them up for two hundred years. Let it finish.\"" }
          - metin: { tr: "Sallardan biri \"Dönen\" diye fısıldıyor. Kimse onu susturmuyor.", en: "Somebody on the rafts whispers \"the Returner.\" Nobody tells them to hush." }
            kosul: { bayrak: "batik_tanri_sanildi" }
          - metin: { tr: "Son Başakçı gittiğinden beri mercan iki kat hızlı büyüyor. Sanki hasat bitince deniz, topladığı ne varsa geri istiyor.", en: "Ever since the Last Gleaner went down, the coral's been growing twice as fast. As if, with the Harvest over, the sea wants back everything it collected." }
            kosul: { herhangi: [{ bayrak: "basakci_olduruldu" }, { bayrak: "basakci_saldi" }] }
          - metin: { tr: "Birkaç Nehha senden uzak duruyor. Başakçı'nın topladığı seviyeleri sen yuttun; onlar bunu unutmadı.", en: "A few of the Nehha keep their distance. You swallowed the levels the Gleaner had gathered. They haven't forgotten." }
            kosul: { bayrak: "batik_hasat_yutuldu" }
          - metin: { tr: "Dalgıçların başlarının üstünde minicik [Seviye 1] yazıları yanıyor. İki yüz yıl sonra ilk kez sayılan çocuklar bunlar.", en: "Tiny [Level 1] tags glow over the divers' heads. These are the first kids in two hundred years to be counted." }
            kosul: { bayrak: "batik_gorunur" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Mercan senin ışığına doğru kıpırdıyor. Işıkla besleniyor; sen daldıkça daha hızlı büyüyecek.", en: "The coral is stirring toward your light. It feeds on light. The deeper you go, the faster it'll grow." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aşağıda biri var. taştan, eski. göğsü seninki gibi oyuk. seni bekliyormuş gibi duruyor, ama taşlar beklemez, değil mi?", en: "there's someone down there. stone. old. chest hollow like yours. standing like it's been waiting for you. but stones don't wait, right?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kemiklerini çıkarmak istiyorlar... Ben de olsam isterdim.\"", en: "\"They want to bring the bones up... I would too.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu çocukların ciğerleri tuzdan yanmış. Bir kulaç fazla dalsalar çıkamazlar.\"", en: "\"These kids' lungs are scarred from the salt. One fathom deeper and they won't come back up.\"" }
        secenekler:
          - id: "dal"
            etiket: { tr: "Dalgıçlarla dal, yolu aydınlat", en: "Dive with them. Light the way" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - bayrak: "bl12_dalis_yapildi"
              - xp_seviye: 10
              - tohum: { olay: "bl12_kd_tuz_dalgici", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kemik suyu günü {yer:batik_takimada|de} dalgıçlara yol göstermiştin. Tuzun kokusu hâlâ üstünde.", en: "On bone-water day you lit the way for the divers in {yer:batik_takimada}. You still smell like salt." } }
            sonraki: "bl12_bt_dalgiclar_dal"
          - id: "temizle"
            tur: "gosteris"
            etiket: { tr: "Önce mercan çobanlarını tek başına sök", en: "Rip out the Reef Shepherds yourself first" }
            gerekli: { stat: { str: 240 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 1, insanlik: -1 }
              - tehlike: { batik_takimada: -3 }
              - bayrak: "bl12_resif_kirildi"
              - xp_seviye: 12
              - tohum: { olay: "bl12_kd_tuz_dalgici", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:batik_takimada|de} söktüğün mercanın kırıntıları hâlâ tırnaklarının arasında.", en: "There are still bits of the coral you tore up in {yer:batik_takimada} under your fingernails." } }
            sonraki: "bl12_bt_dalgiclar_temizle"
          - id: "yasli"
            etiket: { tr: "Yaşlıyı dinle: mercan da bir mezar", en: "Listen to the old man. Coral is a grave too" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tehlike: { batik_takimada: 1 }
              - bayrak: "bl12_dalis_birakildi"
              - xp_seviye: 8
              - tohum: { olay: "bl12_kd_tuz_dalgici", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kemik suyu günü {yer:batik_takimada|de} dalgıçları sallarda tuttuğundan beri Vael-Sa'nın yüzü aklından çıkmıyor.", en: "You can't stop thinking about Vael-Sa's face the day you kept the divers on the rafts in {yer:batik_takimada}." } }
            sonraki: "bl12_bt_dalgiclar_yasli"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} sor: kemikler çıksın mı, kalsın mı?", en: "Ask {npc:deniz_arman}: bring the bones up, or leave them?" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl12_bt_dalgiclar", agirlik: 20 }
              - bayrak: "bl12_dalis_yapildi"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_tuz_dalgici", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Kemik suyu günü {yer:batik_takimada|de} dalgıçlara yol göstermiştin. Tuzun kokusu hâlâ üstünde.", en: "On bone-water day you lit the way for the divers in {yer:batik_takimada}. You still smell like salt." } }
            sonraki: "bl12_bt_dalgiclar_deniz"

      - id: "bl12_bt_dalgiclar_dal"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Suyun altında ışığın önünden yayılıyor. Boğulmuş bir sokak, kapıları açık evler, bir okulun merdiveni; dalgıçlar arkandan, ışığın kenarında kalmaya çalışarak yüzüyor.", en: "Underwater, your light spreads out ahead of you. A drowned street, houses with their doors open, a school's front steps. The divers swim behind you, trying to stay at the edge of the glow." }
          - { tr: "Eski bir meydanda bir heykel duruyor: bir Nehha, kollarını iki yana açmış. Göğsünün ortası oyuk; oyuğun içinde tuz kabuğuna bürünmüş bir taş var. Işığın ona değdiğinde taş da yanıyor, seninkiyle aynı ritimde.", en: "In an old square stands a statue. A Nehha, arms spread wide, with a hollow in the middle of its chest. Inside the hollow is a stone crusted over with salt. When your light touches it, the stone lights up too, on the same beat as yours." }
          - { tr: "Vael-Sa heykelin kaidesindeki yazıya parmağını sürüyor, yüzeye çıkınca da okuyor: \"Yolu olan gider. Yolu olan döner.\" Sonra sana uzun uzun bakıyor.", en: "Vael-Sa runs her finger over the writing on the pedestal, and when you surface she reads it out. \"The one with a Path goes. The one with a Path returns.\" Then she gives you a long look." }
        secenekler:
          - id: "kemik"
            etiket: { tr: "Kemikleri sallara çıkarmalarına ışık tut", en: "Light their way while they bring the bones up" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
          - id: "tas"
            etiket: { tr: "Bir daha dal; heykelin taşına dokun", en: "Dive again. Touch the statue's stone" }
            etkiler:
              - bayrak: "bl12_heykel_dokunuldu"
            sonraki: "@akis"

      - id: "bl12_bt_dalgiclar_temizle"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Mercan çobanları seni görünce dikenlerini kabartıyor. Biri, iki, beş; meydanın üstünü saran resifi parça parça söküyorsun, su bulanık bir pembeye kesiliyor.", en: "When the Reef Shepherds see you, they bristle their spines. One, two, five. You tear the reef off the square piece by piece, and the water goes a cloudy pink." }
          - { tr: "Resifin altından kemikler çıkıyor, yanlarında da iki yüz yıllık bir kentin bütün küçük eşyası: bir tarak, bir oyuncak, bir çan dili. Dalgıçlar sevinçle dalıyor.", en: "Bones come out from under the reef, and with them all the small things of a two-hundred-year-old town. A comb, a toy, a bell clapper. The divers dive in, overjoyed." }
          - { tr: "Moru salın kenarında oturmuş, başını ellerinin arasına almış. Mercanla birlikte söktüğün şeyin ne olduğunu sana söylemiyor; söylemesine gerek de yok.", en: "Moru is sitting on the edge of the raft with his head in his hands. He doesn't tell you what you tore up along with the coral. He doesn't have to." }
        secenekler:
          - id: "moru"
            etiket: { tr: "Moru'nun yanına otur", en: "Sit down next to Moru" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "dalgic"
            etiket: { tr: "Dalgıçlarla birlikte kemikleri topla", en: "Help the divers gather the bones" }
            sonraki: "@akis"

      - id: "bl12_bt_dalgiclar_yasli"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Işığını söndürüp salın üstüne oturuyorsun. Dalgıçlar bir süre sana, bir süre Moru'ya bakıyor; sonra bellerindeki taşları çözüyorlar.", en: "You dim your light and sit down on the raft. The divers look at you, then at Moru, for a while. Then they untie the stones from their waists." }
          - { tr: "Bir tek Vael-Sa taşını çözmemiş. Gözünü senden ayırmadan tek başına karanlığa dalıyor. Dakikalar geçer, su durulur; çıktığında elinde tuzla kaplı bir şey var, kimseye göstermiyor.", en: "Vael-Sa doesn't. Without taking her eyes off you, she dives into the dark alone, the stone still tied at her waist. She stays down a long time, and the water settles. When she comes up there's something salt-crusted in her hand, and she doesn't show it to anybody." }
        secenekler:
          - id: "sor"
            etiket: { tr: "Ne bulduğunu sorma; bekle", en: "Don't ask what she found. Wait" }
            sonraki: "@akis"
          - id: "moru"
            etiket: { tr: "Moru'ya teşekkür et", en: "Thank Moru" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_bt_dalgiclar_deniz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:deniz_arman} uzun süre suya bakıyor. \"Kardeşimi aradığım günlerde biri bana 'bırak artık' deseydi,\" diyor sonunda, \"suratına yumruğu çakardım.\"", en: "{npc:deniz_arman} stares at the water for a long time. \"Back when I was looking for my sister,\" {npc:deniz_arman} says at last, \"if anybody had told me to just let it go, I'd have punched them in the face.\"" }
          - { tr: "Birlikte dalıyorsunuz. Sen ışığı tutuyorsun, {npc:deniz_arman} de dalgıçların kucakladığı kemikleri sallara taşıyor, tek tek, hiçbirini düşürmeden. Eski bir meydanda göğsü oyuk bir heykelin yanından geçerken taşı seninle birlikte yanıyor.", en: "You dive together. You hold the light while {npc:deniz_arman} carries the bones the divers hand over up to the rafts, one by one, never dropping any. As you pass a statue with a hollow chest in an old square, its stone lights up along with you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Son kemiği birlikte çıkarın", en: "Bring up the last bone together" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "heykel"
            etiket: { tr: "Heykelin taşına dokun", en: "Touch the statue's stone" }
            etkiler:
              - bayrak: "bl12_heykel_dokunuldu"
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule Dibi: tuzlu taş (tohum)
  - id: "bl12_kd_tuz_dalgici"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["cok_evren", "batik"]
    gerilim: 2
    kart: { tr: "Tuzlu taş", en: "The Salt Stone" }
    sahne: "bl12_kd_tuz_dalgici_1"
    sahneler:
      - id: "bl12_kd_tuz_dalgici_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısından sırılsıklam bir kız çıkıyor. Sırtında ağdan bir torba, ayaklarının dibinde küçük bir tuz gölü birikiyor. Meydandakiler durup bakıyor: başka bir dünyadan gelen biri, {yer:kiyikent|in} ortasında.", en: "A soaking-wet girl comes out of the Spire's door, a net bag on her back and a little puddle of salt water collecting at her feet. Everybody on the plaza stops to stare. Somebody from another world, right in the middle of {yer:kiyikent}." }
          - { tr: "Vael-Sa. Seni kalabalığın içinden bulup torbayı açıyor: tuz kabuğuna bürünmüş, yumruk büyüklüğünde bir taş. Heykelin göğsündeki taş bu.", en: "It's Vael-Sa. She picks you out of the crowd and opens the bag: a fist-sized stone, crusted in salt. The one from the statue's chest." }
          - { tr: "\"Yaşlılar kararını verdi,\" diyor. \"Dönen'in taşı Dönen'de durur. Ben de getirdim. Elli kat çıktım, elli kat indim.\" Bacakları titriyor ama sesi değil.", en: "\"The elders decided,\" she says. \"The Returner's stone stays with the Returner. So I brought it. I climbed fifty floors and came down fifty more.\" Her legs are shaking. Her voice isn't." }
          - metin: { tr: "Heykelin taşına dokunduğun an kırılan bir şey vardı; taşın tuz kabuğunda o yerde hâlâ senin parmak izin duruyor.", en: "Something cracked the moment you touched the statue's stone. Your fingerprint is still there in the salt crust." }
            kosul: { bayrak: "bl12_heykel_dokunuldu" }
          - metin: { tr: "Kemik suyu günü tek başına dalıp çıkardığı şey buymuş.", en: "So that's what she brought up when she dove alone on bone-water day." }
            kosul: { bayrak: "bl12_dalis_birakildi" }
          - metin: { tr: "Taşın bir yanında senin söktüğün mercandan kalma pembe bir iz var. Vael-Sa onu kazımamış.", en: "There's a pink streak on one side of the stone, left from the coral you tore up. Vael-Sa didn't scrape it off." }
            kosul: { bayrak: "bl12_resif_kirildi" }
          - metin: { tr: "Geçidin {fraksiyon:lonca} nöbetçileri kalabalığın arkasında toplanıyor. Kayıtsız geçiş yasak; tüfekler henüz inik.", en: "The {fraksiyon:lonca|pos} gate guards are gathering at the back of the crowd. Unregistered crossings are banned. The rifles are still pointed down. For now." }
            kosul: { bayrak: "gecit_denetimli" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Bilinmeyen Katman yerlisi", en: "[ANALYSIS] Unknown Layer native" }
            satirlar:
              - { tr: "Seviye: tespit edilemedi. Taşıdığı nesne: Öz izi içeriyor.", en: "Level: not detected. Carried object: contains Essence trace." }
        sezgiler:
          - kosul: { stat: { wis: 230 } }
            metin: { tr: "Taş göğsündeki düğümle konuşuyor. İkisi aynı dili biliyor; biri çok eski, biri yeni.", en: "The stone is talking to the knot in your chest. They speak the same language. One of them is very old. The other one's new." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu taş bir kez yol olmuş. sonra geri dönmüş, taş olmuş. dönen, dediler. dönen her zaman aynı şey olarak dönmez.", en: "this stone was a path once. then it came back and became a stone. returner, they said. what returns doesn't always come back the same." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bacaklarına kramp girmiş. Önce otursun, sonra ne isterseniz konuşun.\"", en: "\"Her legs are cramping. Let her sit first. Then talk all you want.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Elli kat? Seviyesiz? Tek başına?\" Bir süre susuyor. \"Saygı duydum.\"", en: "\"Fifty floors? No level? By herself?\" He's quiet for a second. \"Respect.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Taşı iki elinle al", en: "Take the stone in both hands" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl12_nehha_tasi"
              - xp_seviye: 15
            sonraki: "bl12_kd_tuz_dalgici_al"
          - id: "iade"
            etiket: { tr: "\"O taş sizin. Ataların yanına geri götür.\"", en: "\"That stone is yours. Take it back to your ancestors.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - bayrak: "bl12_nehha_tasi_iade"
              - xp_seviye: 9
            sonraki: "bl12_kd_tuz_dalgici_iade"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} taşı okusun", en: "Let {npc:yanki} read the stone" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "bl12_nehha_tasi"
              - xp_seviye: 12
            sonraki: "bl12_kd_tuz_dalgici_yanki"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} kızı ve taşı ölçsün", en: "Have {npc:mert_kilic} take readings on the girl and the stone" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 3, guven: 2 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl12_kd_tuz_dalgici", agirlik: 20 }
              - bayrak: "bl12_nehha_tasi"
              - xp_seviye: 12
            sonraki: "bl12_kd_tuz_dalgici_mert"

      - id: "bl12_kd_tuz_dalgici_al"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Taş avucuna değdiği an tuz kabuğu çatlayıp dökülüyor. Altındaki yüzey cam gibi; içinde, çok derinde, seninkine benzeyen bir ışık bir kez yanıp sönüyor.", en: "The second the stone touches your palm, the salt crust cracks and falls away. The surface underneath is like glass, and deep inside it a light a lot like yours flickers once." }
          - { tr: "Göğsündeki düğüm bir anlığına susuyor, sanki birinin elini omzunda hissetmiş. Vael-Sa başını eğip geri dönüyor; Kule'nin kapısında bir kez dönüp bakıyor, sonra elli kat yeniden çıkmak için karanlığa giriyor.", en: "The knot in your chest goes quiet for a moment, like it felt a hand on its shoulder. Vael-Sa bows her head and turns back. At the Spire's door she looks around once, then steps into the dark to climb those fifty floors all over again." }
        secenekler:
          - id: "cep"
            etiket: { tr: "Taşı göğsüne yakın bir cebe koy", en: "Put the stone in a pocket close to your chest" }
            sonraki: "@akis"
          - id: "ugurla"
            etiket: { tr: "Kızı ellinci kata kadar uğurla", en: "See her all the way to the fiftieth floor" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_tuz_dalgici_iade"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Vael-Sa şaşkın şaşkın torbayı yeniden bağlıyor. \"Yaşlılar kızacak.\" Sonra, ilk kez, gülümsüyor. \"Moru kızmaz ama. Moru zaten böyle olacağını söylemişti.\"", en: "Vael-Sa, confused, ties the bag back up. \"The elders will be mad,\" she says. Then, for the first time, she smiles. \"Moru won't be, though. Moru said this would happen.\"" }
          - { tr: "Kalabalık dağılırken bir çocuk koşup kıza bir simit uzatıyor. Vael-Sa simidi tuzlu sudan ıslanmış eliyle alıyor, kokluyor, ne olduğunu bilmeden bir ısırık alıyor.", en: "As the crowd breaks up, a kid runs over and hands the girl a pretzel. Vael-Sa takes it with her salt-wet hand, sniffs it, and takes a bite without any idea what it is." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gülümse ve el salla", en: "Smile and wave" }
            sonraki: "@akis"
          - id: "ugurla"
            etiket: { tr: "Kızı ellinci kata kadar uğurla", en: "See her all the way to the fiftieth floor" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_tuz_dalgici_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Taşı avucuna aldığında penceren kendiliğinden açılıyor, satırlar bozuk harflerle akıyor. {npc:yanki} taşı okurken sesi her zamankinden yavaş.", en: "When you take the stone, your window opens on its own and the lines come in broken letters. {npc:yanki} reads it slower than usual." }
          - { tr: "bunu taşıyan da senin gibiymiş. iki öz, bir düğüm, geceleri parlayan bir göğüs. gitmiş, dönmüş. döndüğünde kimseyi tanımamış. onu da kimse tanımamış. sonra taş olmuş.", en: "whoever carried this was like you. two essences, one knot, a chest that glowed at night. went away, came back. when it came back it didn't know anybody. nobody knew it either. then it turned to stone." }
          - { tr: "Pencere kapanıyor. Vael-Sa hiçbir şey duymamış; yalnızca senin yüzündeki ifadeyi görüyor ve bir adım geri çekiliyor.", en: "The window closes. Vael-Sa didn't hear any of it. All she sees is the look on your face, and she takes a step back." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Taşı sıkıca tut", en: "Hold the stone tight" }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "Vael-Sa'ya teşekkür et, onu yolcu et", en: "Thank Vael-Sa and see her off" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_tuz_dalgici_mert"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} alıcılarından birini kıza, öbürünü taşa tutuyor. Kızınki susuyor; ne seviye var ne sinyal. Taşınki ise öyle bir çığlık atıyor ki {npc:mert_kilic} kulaklığını fırlatıp atıyor.", en: "{npc:mert_kilic} points one receiver at the girl and another at the stone. The girl's stays silent. No level, no signal. The stone's lets out a shriek so loud that {npc:mert_kilic} rips his headphones off." }
          - { tr: "\"Bu... bu senin imzan,\" diyor, ekrana bakarak. \"Neredeyse. Aynı frekans, yalnızca çok eski. İki yüz yıldan da eski.\" Sesini alçaltıyor. \"{fraksiyon:sessiz_ag} bunu görmemeli. Görürse taşı da kızı da ister.\"", en: "\"That's... that's your signature,\" he says, staring at the screen. \"Almost. Same frequency, just really old. Older than two hundred years.\" He lowers his voice. \"{fraksiyon:sessiz_ag} can't see this. If they do, they'll want the stone. And the girl.\"" }
        secenekler:
          - id: "sil"
            etiket: { tr: "\"Kaydı sil.\"", en: "\"Delete the reading.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2 } }
            sonraki: "@akis"
          - id: "tut"
            etiket: { tr: "\"Kaydı tut, ama yalnızca sende kalsın.\"", en: "\"Keep it. But it stays with you.\"" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 1 } }
            sonraki: "@akis"

  # ================================================================== PİRİNÇ KERVAN · KAZAN
  - id: "bl12_pk_kazan"
    konum: ["pirinc_kervan"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak: "kervan_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "kervan", "kesif"]
    gerilim: 3
    kart: { tr: "Aç kazan", en: "The Hungry Boiler" }
    sahne: "bl12_pk_kazan_1"
    sahneler:
      - id: "bl12_pk_kazan_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kervan'ın karnında, kazan dairesinde hava pirinç tozundan ağırlaşmış. Ortada ev büyüklüğünde bir kazan homurdanıyor; her homurtuda bütün güverte bir parmak sarsılıyor.", en: "Down in the Caravan's belly, the air in the boiler hall is heavy with brass dust. In the middle, a boiler the size of a house grumbles, and every grumble shakes the whole deck an inch." }
          - { tr: "Ateşçiler kazanın kapağına kömür kürümüyor. Derilerindeki pirinç pulları tek tek söküp ateşe atıyorlar; her pul bir hece. Söktükleri yerden ince bir kan sızıyor.", en: "The stokers aren't shoveling coal into the firebox. They're prying the brass chits out of their skin one at a time and tossing them in. Every chit is a syllable. Where they pull them out, a thin line of blood runs." }
          - { tr: "Ateşçibaşı yaşlı bir kadın: Hezzet. Pullarının çoğunu yakmış, konuşurken kelimeler arasında boşluk kalıyor. \"Kazan. Aç. Biz. Besliyoruz.\" Bir pul daha söküp ateşe atıyor. \"Söz. Az kaldı.\"", en: "The head stoker is an old woman named Hezzet. She's burned most of her chits, and there are gaps between her words when she talks. \"Boiler. Hungry. We. Feed it.\" She pries out another chit and throws it in. \"Words. Running out.\"" }
          - metin: { tr: "Mühür makinesi kırıldığından beri Kadim yakıtı gelmiyor. Karanlık Rota'da durak yok; Kervan'ı yalnızca kendi sözleri itiyor.", en: "No Ancient fuel has come since the seal engine broke. There are no depots on the Dark Route. The only thing pushing the Caravan now is its own words." }
            kosul: { bayrak: "kervan_ozgur" }
          - metin: { tr: "Senet senin adına yazıldığından beri kazan senin seviyene ayarlı. Sen uzaktayken sönmeye yüz tutmuş; ateşçiler aradaki açığı kendi pullarıyla kapatıyor.", en: "Ever since the bond was written in your name, the boiler's been tuned to your level. When you're away it starts to die, and the stokers make up the difference with their own chits." }
            kosul: { bayrak: "kervan_sahibi" }
          - metin: { tr: "Kadim yakıt kervanı iki haftadır gecikiyor. Mühürdar tayını kısmış, ateşçilere de pullarını yakmalarını emretmiş.", en: "The Ancient fuel convoy is two weeks late. The Sealkeeper cut the ration and told the stokers to burn their chits." }
            kosul: { bayrak: "kervan_muhur_korundu" }
          - metin: { tr: "Yakıt kuyusu kurumuş, kimse nedenini söylemiyor. Ateşçiler de soru sormuyor; pullarını yakıyor.", en: "The fuel well's dry, and nobody's saying why. The stokers aren't asking questions either. They're burning their chits." }
            kosul: { bayrak_yok: ["kervan_ozgur", "kervan_sahibi", "kervan_muhur_korundu"] }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Borulardan biri tıkalı. İçinden bir şeyin kemirme sesi geliyor: kazan böcekleri yakıtı borunun içinde yiyor.", en: "One of the pipes is clogged. You can hear something gnawing inside it. Boilerbugs, eating the fuel right in the line." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kendi sözlerini yakıyorlar ki yolları bitmesin. sen de kendi sözlerinden bir yol yapıyorsun. ikiniz de aynı kazanın başındasınız.", en: "they're burning their own words so the road doesn't end. you're making a path out of yours. same boiler, both of you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Pulları sökülen yerler iltihap kapmış. Bir hafta daha böyle giderse ateşçilerin yarısı yüksek ateşle yatacak.\"", en: "\"Where they're pulling the chits out, it's infected. Another week like this and half these stokers will be burning up with fever.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Konuşmak için para ödüyorlar, yürümek için de konuşmayı. Ne biçim bir yer burası?\"", en: "\"They pay money to talk, and now they pay in talk to get anywhere. What kind of place is this?\"" }
        secenekler:
          - id: "isi"
            etiket: { tr: "Göğsündeki ısıyı kazana ver", en: "Give the boiler the heat in your chest" }
            gerekli: { stat: { wil: 240 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - tehlike: { pirinc_kervan: -2 }
              - bayrak: "bl12_kazan_yakildi"
              - xp_seviye: 12
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|in} kazanına avuçlarını bastırdın bastıralı ellerin sabahları ılık uyanıyor.", en: "Your hands wake up warm every morning now, ever since you pressed them to the boiler in {yer:pirinc_kervan|pos} boiler hall." } }
            sonraki: "bl12_pk_kazan_isi"
          - id: "boru"
            etiket: { tr: "Tıkalı boruya gir, kazan böceklerini temizle", en: "Crawl into the clogged pipe. Clear out the Boilerbugs" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["kazan_bocegi@dunya", "kazan_bocegi@dunya"], ortam: ["dar_gecit"], kazan: "bl12_pk_kazan_boru", kaybet: "bl12_pk_kazan_yenilgi" }
          - id: "kadim"
            etiket: { tr: "{npc:thessar|e} haber yolla: Kervan'a yakıt gönderilsin", en: "Send word to {npc:thessar}: get the Caravan some fuel" }
            goster: { npc_hayatta: "thessar", bayrak: "thessar_indi" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { kadimler: 3 }
              - iliski: { thessar: { saygi: 3 } }
              - bayrak: "bl12_kazan_kadim"
              - xp_seviye: 9
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|e} Kadim yakıtı gönderteli birkaç gün oldu.", en: "It's been a few days since you got Ancient fuel sent to {yer:pirinc_kervan}." } }
            sonraki: "bl12_pk_kazan_kadim"
          - id: "karisma"
            tur: "gizle"
            etiket: { tr: "Karışma; Kervan'ın derdi Kervan'ın", en: "Stay out of it. The Caravan's problems are its own" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -2 }
              - bayrak: "bl12_kazan_pul"
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|in} kazan dairesinde pullarını ateşe atan ateşçileri arkanda bırakmıştın.", en: "You left the stokers in {yer:pirinc_kervan|pos} boiler hall throwing their chits into the fire." } }
            sonraki: "bl12_pk_kazan_pul"

      - id: "bl12_pk_kazan_isi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Avuçlarını kazanın sıcak pirincine bastırıyorsun. Göğsündeki düğüm önce direniyor, sonra bir kapı açılır gibi gevşiyor; içindeki ısı kollarından akıp kazana geçiyor.", en: "You press your palms to the boiler's hot brass. The knot in your chest resists at first, then loosens like a door swinging open, and the heat inside you runs down your arms and into the boiler." }
          - { tr: "Kazan bir kez öksürüp gürlemeye başlıyor. Güverte susmuş, Kervan ağır ağır hız almış bile. Ateşçiler ellerindeki pulları ateşe atmak yerine derilerine geri bastırıyor.", en: "The boiler coughs once and starts to roar. The deck stops shaking, and the Caravan slowly picks up speed. The stokers press the chits in their hands back into their skin instead of throwing them in." }
          - { tr: "Hezzet sana bir pul uzatıyor, kendi derisinden sökmediği son pullardan birini. \"Sende kalsın,\" diyor. Bu kez kelimeleri arasında boşluk yok.", en: "Hezzet holds out a chit to you, one of the last she never pried from her own skin. \"Keep it,\" she says. This time there's no gap between her words." }
        secenekler:
          - id: "al"
            etiket: { tr: "Pulu al", en: "Take the chit" }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Pulu kibarca geri ver; onun sözü o", en: "Politely hand it back. It's one of her words" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_pk_kazan_boru"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Borudan çıktığında üstün başın kurum ve böcek kabuğu. Arkanda tıkaç açılmış; yakıt hırıldayarak kazana akmaya başlıyor, kazan da homurtusunu bir derece yumuşatıyor.", en: "When you crawl out of the pipe you're covered in soot and bug shell. Behind you, the clog's cleared. The fuel starts gurgling into the boiler, and the boiler's grumble eases a notch." }
          - { tr: "Hezzet borunun ağzına eğilip içine bakıyor, sonra sana. Konuşmak yerine elini kendi göğsüne, sonra seninkine koyuyor. Tavvarlar arasında bunun ne anlama geldiğini bilmiyorsun ama tahmin edebiliyorsun.", en: "Hezzet leans in and looks down the pipe, then at you. Instead of talking, she puts her hand on her own chest, then on yours. You don't know what that means to the Tavvari. You can guess." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kurumu sil, kazanın sesini dinle", en: "Wipe off the soot and listen to the boiler" }
            etkiler:
              - bayrak: "bl12_kazan_temizlendi"
              - tehlike: { pirinc_kervan: -2 }
              - xp_seviye: 10
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|in} kazan borusundan çıktığından beri üstündeki kurum kokusu gitmedi.", en: "You crawled out of {yer:pirinc_kervan|pos} boiler pipe days ago, and you still smell like soot." } }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Karşılık ver: sen de elini onun göğsüne koy", en: "Return the gesture: press your hand to her chest" }
            etkiler:
              - bayrak: "bl12_kazan_temizlendi"
              - tehlike: { pirinc_kervan: -2 }
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|in} kazan borusundan çıktığından beri üstündeki kurum kokusu gitmedi.", en: "You crawled out of {yer:pirinc_kervan|pos} boiler pipe days ago, and you still smell like soot." } }
            sonraki: "@akis"

      - id: "bl12_pk_kazan_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kendine geldiğinde kazanın dibinde, kömür yığınının üstündesin. Ateşçiler seni borudan çekip çıkarmış. Hezzet başında, eline bir pul daha almış; ateşe atmak üzere.", en: "When you come to, you're at the foot of the boiler on a pile of coal. The stokers dragged you out of the pipe. Hezzet's standing over you with another chit in her hand, about to throw it in." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; pulu onun elinden al", en: "Get up. Take the chit out of her hand" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl12_kazan_pul"
              - tohum: { olay: "bl12_us_kervan_borcu", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:pirinc_kervan|in} kazan dairesinde böceklere yenildiğin gün ateşçiler pullarını yakmaya devam ediyordu.", en: "The day the Boilerbugs beat you in {yer:pirinc_kervan|pos} boiler hall, the stokers were still burning their chits." } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kalk ve kazan dairesinden çık", en: "Get up and leave the boiler hall" }
            etkiler:
              - bayrak: "bl12_kazan_pul"
            sonraki: "@akis"

      - id: "bl12_pk_kazan_kadim"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Haberin {npc:thessar|e} ulaşması bir gün sürüyor. Ertesi akşam Kervan'ın yanına gri bir mavna yanaşıyor; ambarı yakıt dolu, pruvasında da Kadimler'in mührü.", en: "It takes a day for word to reach {npc:thessar}. The next evening a gray barge pulls up alongside the Caravan, its hold full of fuel and the Ancients' seal on its bow." }
          - metin: { tr: "Kervan'ın halkı mavnayı sessizce izliyor. Özgürlüklerini oylayıp mührü kırdıkları gemiye şimdi o mühürle yakıt geliyor; kimse teşekkür etmiyor, kimse de geri çevirmiyor.", en: "The Caravan's people watch the barge in silence. They voted for their freedom and broke the seal, and now the fuel's coming in under that same seal. Nobody says thank you. Nobody sends it back either." }
            kosul: { bayrak: "kervan_ozgur" }
          - { tr: "Hezzet yakıtı kazana kendi elleriyle döküyor. Sonra mavnanın mührüne uzun uzun bakıyor ve derisinde kalan son birkaç pula dokunuyor, onları sayar gibi.", en: "Hezzet pours the fuel into the boiler with her own hands. Then she looks at the barge's seal for a long time and touches the last few chits left in her skin, like she's counting them." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Mavnanın boşaltılmasına yardım et", en: "Help unload the barge" }
            sonraki: "@akis"
          - id: "hezzet"
            etiket: { tr: "Hezzet'e bunun bir borç olmadığını söyle", en: "Tell Hezzet this isn't a debt" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_pk_kazan_pul"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kazan dairesinden çıkarken arkanda pulların ateşe düşüşünü duyuyorsun: tık, tık, tık. Her tıkırtı bir hece.", en: "As you leave the boiler hall, you can hear the chits dropping into the fire behind you. Tick, tick, tick. Every tick a syllable." }
          - { tr: "Merdivenin başında genç bir ateşçi seni durduruyor, ağzını açıyor ama ses çıkmıyor. Derisinde tek bir pul bile kalmamış.", en: "At the top of the stairs a young stoker stops you and opens his mouth, but nothing comes out. There isn't a single chit left in his skin." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yanından geçip git", en: "Walk on past him" }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Bir süre yüzüne bak", en: "Look at his face for a while" }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Üs: Kervan'ın borcu (tohum)
  - id: "bl12_us_kervan_borcu"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["cok_evren", "kervan"]
    gerilim: 2
    kart: { tr: "Kapıdaki Tavvar", en: "A Tavvari at the Gate" }
    sahne: "bl12_us_kervan_borcu_1"
    sahneler:
      - id: "bl12_us_kervan_borcu_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah nöbetçi seni Sığınak'ın kapısına çağırıyor. \"Biri seni soruyor. Yani... sormuyor. İşaret ediyor.\" Kapının önünde, rıhtımın tuzlu rüzgârında altı parmaklı, uzun boylu bir Tavvar: dimdik, sabırlı.", en: "In the morning the sentry calls you down to the Haven gate. \"Somebody's asking for you. I mean... not asking. Pointing.\" Out front, in the salt wind off the quay, stands a six-fingered Tavvari, tall, upright and patient." }
          - metin: { tr: "Kazan dairesindeki genç ateşçilerden biri. Derisi pullarla dolu, hiçbirini sökmemiş. Bir kesenin ağzını açıp sana uzatıyor: içinde tek bir pul, pirinci yeni dökülmüş, hâlâ ılık.", en: "It's one of the young stokers from the boiler hall. His skin is full of chits, not one of them pried out. He opens a pouch and holds it out to you. Inside is a single chit, the brass freshly poured and still warm." }
            kosul: { herhangi: [{ bayrak: "bl12_kazan_yakildi" }, { bayrak: "bl12_kazan_temizlendi" }, { bayrak: "bl12_kazan_kadim" }] }
          - metin: { tr: "\"Kervan senin için bir hece döktü,\" diyor. \"Daha önce hiçbir dilde olmayan bir hece. Anlamı: kazanı ısıtan.\" Pulu avucuna bırakınca pirinç kendi kendine bir kez fısıldıyor: senin adın, Tavvar dilinde.", en: "\"The Caravan cast a syllable for you,\" he says. \"A syllable that's never been in any language before. It means: the one who warmed the boiler.\" When he drops the chit into your palm, the brass whispers once on its own. Your name, in Tavvari." }
            kosul: { herhangi: [{ bayrak: "bl12_kazan_yakildi" }, { bayrak: "bl12_kazan_temizlendi" }, { bayrak: "bl12_kazan_kadim" }] }
          - metin: { tr: "Kazan dairesinde gördüğün genç ateşçi bu. Derisinde tek pul yok; ağzını açıyor, ses çıkmıyor. Parmaklarıyla havaya bir şeyler çiziyor: bir kazan, bir kapı, sonra Sığınak'ın kendisi.", en: "It's the young stoker you saw in the boiler hall. There isn't a single chit in his skin. He opens his mouth and nothing comes out. With his fingers he draws in the air: a boiler, a door, then the Haven itself." }
            kosul: { bayrak_yok: ["bl12_kazan_yakildi", "bl12_kazan_temizlendi", "bl12_kazan_kadim"] }
          - metin: { tr: "Sözü kalmayan bir Tavvar Kervan'da hiçbir şey alıp satamaz. Kervan'dan sana kadar gelmiş; buraya kalmaya gelmiş.", en: "A Tavvari with no words left can't buy or sell anything on the Caravan. He came all the way from the Caravan to find you. He's come here to stay." }
            kosul: { bayrak_yok: ["bl12_kazan_yakildi", "bl12_kazan_temizlendi", "bl12_kazan_kadim"] }
        sezgiler:
          - kosul: { stat: { cha: 220 } }
            metin: { tr: "Rıhtımdakiler Tavvar'ı süzüyor ama kimse yaklaşmıyor. Ne yapacağına bakıp ona göre davranacaklar.", en: "Everybody on the quay is sizing up the Tavvari, but nobody comes near. They're waiting to see what you do, and they'll take their cue from you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "biri sana bir hece verdi. ben sana aylardır cümle veriyorum. kimse bana pul dökmedi.", en: "somebody gave you a syllable. i've been giving you whole sentences for months. nobody ever cast me a chit." }
        secenekler:
          - id: "pul"
            etiket: { tr: "Pulu boynuna as", en: "Hang the chit around your neck" }
            goster: { herhangi: [{ bayrak: "bl12_kazan_yakildi" }, { bayrak: "bl12_kazan_temizlendi" }, { bayrak: "bl12_kazan_kadim" }] }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl12_kervan_pulu"
              - xp_seviye: 9
            sonraki: "bl12_us_kervan_borcu_pul"
          - id: "yatak"
            etiket: { tr: "Ona Sığınak'ta bir yatak bul", en: "Find him a bed in the Haven" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 2 }
              - bayrak: "bl12_tavvar_siginakta"
              - xp_seviye: 8
            sonraki: "bl12_us_kervan_borcu_kal"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} revirine götür", en: "Take him to {npc:elif_sari|pos} aid station" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2, saygi: 2 } }
              - bayrak: "bl12_tavvar_siginakta"
              - xp_seviye: 8
            sonraki: "bl12_us_kervan_borcu_elif"
          - id: "gonder"
            etiket: { tr: "Kervan'a geri dönmesini söyle", en: "Tell him to go back to the Caravan" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: 1 }
            sonraki: "bl12_us_kervan_borcu_gonder"

      - id: "bl12_us_kervan_borcu_pul"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pulu bir ipe geçirip boynuna asıyorsun. Göğsündeki düğümün hemen üstünde duruyor; düğüm her attığında pul da bir kez ısınıyor.", en: "You thread the chit onto a string and hang it around your neck. It sits right over the knot in your chest, and every time the knot pulses, the chit warms once." }
          - { tr: "Tavvar başını eğip rıhtımdan uzaklaşıyor. Arkasından, konteynerlerin arasından iki çocuk koşup senin boynundaki pula bakıyor. \"Ne o?\" diye soruyor biri. Cevap verirken kendi adını yabancı bir dilde duyuyorsun.", en: "The Tavvari bows his head and heads off down the quay. Behind him, two kids dart out from between the containers to look at the chit around your neck. \"What's that?\" one asks. When you answer, you hear your own name in a foreign language." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pulu gömleğinin içine sok", en: "Tuck the chit inside your shirt" }
            sonraki: "@akis"
          - id: "goster"
            etiket: { tr: "Çocuklara pulu dinlet", en: "Let the kids listen to the chit" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_us_kervan_borcu_kal"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sığınak'ın aşevinde, mutfağın yanındaki depoda boş bir ranza buluyorsun. Tavvar ranzaya oturup altı parmağıyla battaniyenin kumaşını uzun uzun okşuyor, pirinçten olmayan bir şeye ilk kez dokunuyormuş gibi.", en: "In the Haven's soup kitchen, in the storeroom off the kitchen, you find an empty bunk. The Tavvari sits down on it and runs his six fingers over the blanket for a long time, like it's the first thing he's ever touched that isn't brass." }
          - { tr: "Akşam aşçı kadın sana geliyor. \"Senin Tavvar bütün gün patates soydu,\" diyor. \"Tek kelime etmeden. En iyi çırağım.\"", en: "That evening the cook comes to find you. \"Your Tavvari peeled potatoes all day,\" she says. \"Didn't say a word. Best help I've ever had.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül", en: "Laugh" }
            sonraki: "@akis"
          - id: "isim"
            etiket: { tr: "Aşçıya ona bir isim bulmasını söyle", en: "Tell the cook to come up with a name for him" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_us_kervan_borcu_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} Tavvar'ın derisindeki yaralara bakıp dudaklarını büzüyor. \"Bunları kim dikti, kim söktü, umurumda değil,\" diyor, pansuman bezini açarken. \"Burada kimse kimsenin malı değil.\"", en: "{npc:elif_sari} looks at the wounds in the Tavvari's skin and purses her lips. \"I don't care who stitched these in or who pulled them out,\" she says, unrolling a bandage. \"Nobody here is anybody's property.\"" }
          - { tr: "Tavvar bir şey söylemek istiyor ama sesi yok ki. Bunun yerine {npc:elif_sari|in} elini tutup kendi göğsüne bastırıyor. {npc:elif_sari} elini çekmiyor; pansumanı tek elle bitiriyor.", en: "The Tavvari wants to say something and can't. So he takes {npc:elif_sari|pos} hand and presses it to his chest. She doesn't pull away. She finishes the bandage one-handed." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Revirden sessizce çık", en: "Slip quietly out of the aid station" }
            sonraki: "@akis"
          - id: "yardim"
            etiket: { tr: "Pansuman bezini sen tut", en: "Hold the bandage for her" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"

      - id: "bl12_us_kervan_borcu_gonder"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tavvar seni dinleyip başını eğiyor, geldiği yoldan dönüyor. Rıhtımdakiler rahatlamış; biri arkasından taş atıyor ama tutturamıyor.", en: "The Tavvari listens, bows his head, and goes back the way he came. The people on the quay look relieved. One of them throws a rock after him and misses." }
          - { tr: "Kule'ye giden yolda bir kez duruyor, dönüp Sığınak'a bakıyor. Sonra yürümeye devam ediyor.", en: "On the road to the Spire he stops once and looks back at the Haven. Then he keeps walking." }
        secenekler:
          - id: "tas"
            etiket: { tr: "Taşı atana bir daha yapmamasını söyle", en: "Tell whoever threw the rock not to do it again" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "İçeri dön", en: "Go back inside" }
            sonraki: "@akis"

  # ================================================================== TEPE · GÖZ ÇİÇEĞİ
  - id: "bl12_tp_goz_cicegi"
    konum: ["tepe"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak_yok: "yol_olustu" }
    agirlik: 5
    etiketler: ["tepe", "yol", "kesif"]
    gerilim: 3
    kart: { tr: "Uyurgezerler", en: "The Sleepwalkers" }
    sahne: "bl12_tp_goz_cicegi_1"
    sahneler:
      - id: "bl12_tp_goz_cicegi_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} yamacındaki göz çiçeği tarlası gece yarısı bile açık. Gündüz güneşe dönen bu çiçekler artık geceleri de aşağıya, {yer:kiyikent_liman|e}, uyuduğun yere dönüyor.", en: "The eyeflower field on the slope of {yer:tepe} is wide open, even at midnight. These flowers turn to face the sun by day. Now they turn at night too, downhill toward {yer:kiyikent_liman}, toward where you sleep." }
          - { tr: "Çiçekler açık kaldıkça poleni havaya karışıyor. Üç gecedir mahallenin yarısı uykusunda kalkıp yokuştan aşağı yürüyor; gözleri açık, kolları iki yanında, hepsi aynı yöne.", en: "As long as the flowers stay open, their pollen hangs in the air. For three nights now, half the neighborhood has been getting up in their sleep and walking downhill. Eyes open, arms at their sides, all of them headed the same way." }
          - { tr: "Tarlanın sahibi otacı Şükran Nine, elinde fenerle yokuşun başında bekliyor. \"Dün gece ikisi uçurumun kenarından döndü,\" diyor. \"Bu gece dönmeyebilirler. Çiçek revirin ağrı kesicisi, yakamam; ama açan sensin evladım, sen buradayken kapanmıyorlar.\"", en: "The field belongs to an herb woman everybody calls Old Mae. She's waiting at the top of the slope with a lantern. \"Last night two of them turned back right at the cliff edge,\" she says. \"Tonight they might not. These flowers are the aid station's painkiller. I can't burn them. But you're the one keeping them open, hon. While you're here, they never close.\"" }
          - { tr: "Arkasındaki evlerden birinin kapısı açılıyor. Pijamalı bir çocuk, gözleri kocaman açık, çıplak ayakla yokuşun başına adım atıyor. Ardından annesi, ardından komşu.", en: "Behind her, a front door swings open. A kid in pajamas, eyes wide open, steps barefoot onto the slope. Then his mother. Then the neighbor." }
          - metin: { tr: "{fraksiyon:yukselenler} bu yürüyüşe Çağrı diyor. Beyaz giysili birkaç kişi uyurgezerlerin peşinden ilahi mırıldanarak yürüyor; uyandırmaya kalkan olursa önüne geçiyorlar.", en: "{fraksiyon:yukselenler} are calling this the Summons. A few of them in white are walking behind the sleepwalkers, humming a hymn, and they step in front of anybody who tries to wake them." }
            kosul: { herhangi: [{ bayrak: "vahit_hakli" }, { bayrak: "cekirdek_yukselenler" }, { bayrak: "uye_yukselenler" }] }
          - metin: { tr: "Tarlanın çitinde Konsey'in mührü var: Sığınak'ın reviri bu çiçeklerle ayakta duruyor.", en: "There's a Council seal on the field's fence. The Haven's aid station runs on these flowers." }
            kosul: { bayrak: "uye_siginak" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Uyurgezerler yolu değil ışığı izliyor; yokuşun dibindeki uçurum da tam o hatta. Işık onları, sen uzaktayken bile, senin yattığın yöne çekiyor.", en: "The sleepwalkers aren't following the road. They're following the light, and the cliff at the bottom of the slope is right on that line. Even when you're far away, your light pulls them toward where you sleep." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sana yürüyorlar. uykularında bile. uyanıkken de yürüyecekler, biliyorsun. bu yalnızca prova.", en: "they're walking to you. even in their sleep. they'll walk to you awake too, you know. this is just the rehearsal." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Göz çiçeği poleni... Islak bezle maske yapsak durur. Ama bu kadar insana yetecek bez yok.\"", en: "\"Eyeflower pollen... A wet cloth over the face would stop it. But there isn't that much cloth on this whole hill.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "{npc:deniz_arman} pijamalı çocuğun önüne geçip yolunu kesiyor; çocuk dönüp etrafından dolanıyor, yürümeye devam ediyor.", en: "{npc:deniz_arman} steps into the pajama kid's path. The kid turns, walks around, and keeps going." }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Geceyi tarlada geçir; uyurgezerler sana gelsin", en: "Spend the night in the field. Let them come to you" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - tehlike: { tepe: -2 }
              - bayrak: "bl12_tarla_nobet"
              - xp_seviye: 9
              - tohum: { olay: "bl12_us_goz_cicegi", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:tepe|de} göz çiçeği tarlasında bir gece geçirdin; polenin acı kokusu hâlâ burnunda.", en: "You spent a night in the eyeflower field in {yer:tepe}, and you can still smell the bitter pollen." } }
            sonraki: "bl12_tp_goz_cicegi_nobet"
          - id: "bastir"
            tur: "gizle"
            etiket: { tr: "Sabaha kadar ışığını bastır; çiçekler kapansın", en: "Hold your light down till dawn. Let the flowers close" }
            gerekli: { stat: { wil: 230 } }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: 1, merhamet: 1 }
              - tehlike: { tepe: -1 }
              - bayrak: "bl12_tarla_hasat"
              - xp_seviye: 10
              - tohum: { olay: "bl12_us_goz_cicegi", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:tepe|de} bütün gece ışığını bastırdığından beri göğsün hâlâ ağrıyor.", en: "Your chest still aches from holding your light down all night in {yer:tepe}." } }
            sonraki: "bl12_tp_goz_cicegi_bastir"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} poleni incelesin, bir çare bulsun", en: "Have {npc:elif_sari} look at the pollen and find a fix" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { saygi: 3, guven: 1 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl12_tp_goz_cicegi", agirlik: 20 }
              - ahlak: { merhamet: 1 }
              - tehlike: { tepe: -2 }
              - bayrak: "bl12_tarla_hasat"
              - xp_seviye: 9
              - tohum: { olay: "bl12_us_goz_cicegi", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:tepe|de} {npc:elif_sari|le} bütün gece bez ıslattığınız o tarlayı düşünüp duruyorsun.", en: "You keep thinking about that field in {yer:tepe}, wetting rags all night with {npc:elif_sari}." } }
            sonraki: "bl12_tp_goz_cicegi_elif"
          - id: "yak"
            tur: "gosteris"
            etiket: { tr: "Tarlayı yak; yürüyüş bu gece bitsin", en: "Burn the field. The walking ends tonight" }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 1, duzen: -1 }
              - itibar: { siginak: -2 }
              - tehlike: { tepe: -2 }
              - bayrak: "bl12_tarla_yandi"
              - xp_seviye: 8
              - tohum: { olay: "bl12_us_goz_cicegi", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:tepe|de} yaktığın göz çiçeği tarlasının dumanı günlerce şehrin üstünde asılı kaldı.", en: "The smoke from the eyeflower field you burned in {yer:tepe} hung over the city for days." } }
            sonraki: "bl12_tp_goz_cicegi_yak"
          - id: "birak"
            etiket: { tr: "Uzak dur; bu senin derdin değil", en: "Stay out of it. Not your problem" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - tehlike: { tepe: 2 }
              - bayrak: "bl12_tarla_birakildi"
              - tohum: { olay: "bl12_us_goz_cicegi", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:tepe|den} döndüğün gece yokuştan inen uyurgezerleri arkanda bırakmıştın.", en: "The night you left {yer:tepe}, you left the sleepwalkers on the slope behind you." } }
            sonraki: "bl12_tp_goz_cicegi_birak"

      - id: "bl12_tp_goz_cicegi_nobet"
        yer: "tepe"
        paragraflar:
          - { tr: "Tarlanın ortasına oturuyorsun. Uyurgezerler yokuştan dönüp sana doğru geliyor; uçurumun kenarından değil, çiçeklerin arasından. Çevrende halka olup ağır ağır dönüyorlar, gözleri açık, yüzleri huzurlu.", en: "You sit down in the middle of the field. The sleepwalkers turn back from the slope and come toward you, through the flowers instead of along the cliff edge. They form a ring around you and circle slowly, eyes open, faces peaceful." }
          - { tr: "Şafak sökünce teker teker uyanıyorlar. Kimi ağlıyor, kimi gülüyor, pijamalı çocuk annesinin kucağına tırmanıyor. Çiçekler hâlâ açık; Şükran Nine hasadın yarısını kaybettiğini söylüyor, ama kimseyi kaybetmemiş.", en: "When dawn breaks they wake up one by one. Some cry, some laugh. The pajama kid climbs into his mother's arms. The flowers are still open. Old Mae says she's lost half the harvest. She hasn't lost anybody, though." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Kalan çiçekleri toplamasına yardım et", en: "Help her gather what's left of the flowers" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Uyuşan bacaklarını ovuşturup yokuştan in", en: "Rub the stiffness out of your legs and head downhill" }
            sonraki: "@akis"

      - id: "bl12_tp_goz_cicegi_bastir"
        yer: "tepe"
        paragraflar:
          - { tr: "Işığı içeri, göğsünün en dibine itiyorsun. Düğüm buna razı değil; bütün gece dişlerini sıkıp onu bir yumruk gibi kapalı tutuyorsun. Sırtın sırılsıklam ama çiçekler birer birer kapanıyor.", en: "You shove the light inward, down to the very bottom of your chest. The knot fights you. All night you grit your teeth and keep it clenched shut like a fist. You're drenched in sweat, but the flowers close one by one." }
          - { tr: "Uyurgezerler yokuşun ortasında durup gözlerini kırpıştırıyor, sokakta ne aradıklarını birbirlerine soruyorlar. Sabaha Şükran Nine sepetleri kapalı çiçeklerle doldurmuş. \"Bir yıllık ağrı kesici,\" diyor. \"Senin bir gecelik ağrına.\"", en: "The sleepwalkers stop halfway down the slope, blink, and ask each other what they're doing out in the street. In the morning Old Mae gathers the closed flowers by the basketful. \"A year's worth of painkiller,\" she says. \"For one night of your pain.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bir sepeti sen taşı", en: "Carry one of the baskets yourself" }
            sonraki: "@akis"
          - id: "dinlen"
            etiket: { tr: "Çitin dibine çöküp soluklan", en: "Collapse against the fence and catch your breath" }
            sonraki: "@akis"

      - id: "bl12_tp_goz_cicegi_elif"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:elif_sari} bir çiçeği koparıp fenerin ışığında inceliyor, sonra montunu yırtıp şeritler halinde kesmeye başlıyor. \"Islak bez, burun ve ağız,\" diyor. \"Herkese. Önce çocuklara.\"", en: "{npc:elif_sari} picks a flower, studies it in the lantern light, then rips up her jacket and starts cutting it into strips. \"Wet cloth, over the nose and mouth,\" she says. \"Everybody. Kids first.\"" }
          - { tr: "Bütün gece yokuşta koşuyorsunuz, ıslak bezleri uyurgezerlerin yüzüne bağlayarak. Bez değen ilk on dakikada uyanıyor. Şafakta tarla hâlâ açık ama yürüyen kimse yok; Şükran Nine de {npc:elif_sari|e} kendi el yazısıyla bir ilaç tarifi veriyor.", en: "You spend the whole night running up and down that slope, tying wet rags over the sleepwalkers' faces. Every one wakes within ten minutes. By dawn the field's still open, but nobody's walking, and Old Mae hands {npc:elif_sari} a remedy recipe in her own handwriting." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "{npc:elif_sari|in} yırtık montuna kendi montunu ver", en: "Give {npc:elif_sari} your jacket for the one she tore up" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Yokuştan birlikte inin", en: "Head down the slope together" }
            sonraki: "@akis"

      - id: "bl12_tp_goz_cicegi_yak"
        yer: "tepe"
        paragraflar:
          - { tr: "Avucunu tarlaya doğru açtığında alev çiçeklerin arasından bir dalga gibi geçiyor. Şükran Nine'nin feneri yerde. Uyurgezerler yokuşun ortasında olduğu yerde kalakalmış; dumanı soludukça öksürerek uyanıyorlar.", en: "When you open your palm toward the field, the fire sweeps through the flowers like a wave. Old Mae drops her lantern. The sleepwalkers freeze halfway down the slope, breathe in the smoke, and wake up coughing." }
          - { tr: "Sabah tarladan geriye kara bir yamaç kalıyor. Kimse uçurumdan düşmemiş. Revirin bir yıllık ağrı kesicisi de bu yamaçta, külün içinde.", en: "By morning the field is just a black hillside. Nobody went over the cliff. And the aid station's year of painkiller is up here too, in the ash." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Şükran Nine'den özür dile", en: "Apologize to Old Mae" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Dumanın içinden yürüyüp git", en: "Walk off through the smoke" }
            sonraki: "@akis"

      - id: "bl12_tp_goz_cicegi_birak"
        yer: "tepe"
        paragraflar:
          - { tr: "Arkanı dönüp yokuştan iniyorsun. Arkanda Şükran Nine'nin feneri bir aşağı bir yukarı sallanıyor; tek başına, uyurgezerlerin arasında koşturuyor.", en: "You turn your back and head down the hill. Behind you, Old Mae's lantern swings back and forth. She's running between the sleepwalkers by herself." }
          - { tr: "Sabah haberi duyuyorsun: biri uçurumdan döndü, biri dönmedi.", en: "In the morning you hear the news. One of them turned back at the cliff. One didn't." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            sonraki: "@akis"
          - id: "dur"
            etiket: { tr: "Dur ve kimin düştüğünü sor", en: "Stop and ask who fell" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Üs: göz çiçeği sandığı (tohum)
  - id: "bl12_us_goz_cicegi"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["tepe", "siginak", "lonca"]
    gerilim: 2
    kart: { tr: "Ağrı kesici sandığı", en: "The Painkiller Crate" }
    sahne: "bl12_us_goz_cicegi_1"
    sahneler:
      - id: "bl12_us_goz_cicegi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sığınak'ın kapısına bir katır arabası yanaşıyor. Arabada tek bir sandık var, üstünde kömürle yazılmış adın. İçinde kurutulmuş göz çiçekleri: {yer:tepe|den}, Şükran Nine'den.", en: "A mule cart pulls up to the Haven gate. There's one crate in the back with your name written on it in charcoal. Inside are dried eyeflowers, from {yer:tepe}, from Old Mae." }
          - metin: { tr: "Sandık ağzına kadar dolu. Kapağın içine bir not iliştirilmiş: \"Bir gecelik ağrın için, bir yıllık ağrı kesici.\"", en: "The crate is full to the brim. There's a note tucked inside the lid: \"A year of painkiller, for one night of your pain.\"" }
            kosul: { bayrak: "bl12_tarla_hasat" }
          - metin: { tr: "Sandık yarı yarıya dolu. Not kısa: \"Hasadın yarısı gitti, kimse gitmedi. Hakkını helal et.\"", en: "The crate's half full. The note is short: \"Half the harvest is gone. Nobody else is. Forgive the shortfall.\"" }
            kosul: { bayrak: "bl12_tarla_nobet" }
          - metin: { tr: "Tarla yanmış ama Nine'nin kilerinde geçen yıldan kalma kuru çiçekler varmış; sandığın dibi ancak örtülüyor. Not yok.", en: "The field's gone, but Old Mae had some of last year's dried flowers in her cellar. There's barely enough to cover the bottom of the crate. No note." }
            kosul: { bayrak: "bl12_tarla_yandi" }
          - metin: { tr: "Sandık yarı yarıya dolu. Notta tek bir satır var: \"Biri döndü, biri dönmedi. Bunlar da dönenin payı.\"", en: "The crate's half full. The note has one line on it: \"One came back, one didn't. This is the share for the one who came back.\"" }
            kosul: { bayrak: "bl12_tarla_birakildi" }
          - { tr: "Arabanın iki yanında iki kişi bekliyor: biri Sığınak revirinin hemşiresi, önlüğünün cebinde boş ilaç şişeleri; öbürü {fraksiyon:lonca|in} levazımcısı, elinde bir kese kristal. \"Kapı avcıları ağrı kesicisiz ameliyata giriyor,\" diyor levazımcı. \"Revirde kadınlar ağrı kesicisiz doğuruyor,\" diyor hemşire.", en: "Two people are waiting on either side of the cart. One is a nurse from the Haven aid station, empty pill bottles in her scrubs pocket. The other is the {fraksiyon:lonca} quartermaster with a pouch of crystals. \"Gate hunters are going into surgery without painkillers,\" the quartermaster says. \"Women are giving birth in the aid station without painkillers,\" the nurse says." }
        sezgiler:
          - kosul: { stat: { cha: 220 } }
            metin: { tr: "İkisi de doğru söylüyor. Levazımcının kesesi Şükran Nine'nin yanan tarlasını yeniden ektirmeye yeter.", en: "They're both telling the truth. The quartermaster's pouch would be enough to replant Old Mae's field." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "acı hep birilerine düşer. sen kime düşeceğini seçiyorsun. sistemin yaptığı da bu, yalnız onun elinde sandık yok.", en: "pain always lands on somebody. you're picking who. that's what the system does too. it just doesn't have a crate." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kapı avcısı olarak söylüyorum: dikişi ağrı kesicisiz de atarsın. Doğumu bilmem.\"", en: "\"Speaking as a Gate hunter, you can do stitches without painkillers. Can't speak to childbirth.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Revire ver. Lonca her zaman bir yolunu bulur.\"", en: "\"Give it to the aid station. The Guild always finds a way.\"" }
        secenekler:
          - id: "revir"
            etiket: { tr: "Sandığı revire ver", en: "Give the crate to the aid station" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 2, lonca: -1 }
              - bayrak: "bl12_cicek_revire"
              - xp_seviye: 8
            sonraki: "bl12_us_goz_cicegi_revir"
          - id: "lonca"
            etiket: { tr: "Lonca'ya sat; kristali Şükran Nine'ye yolla", en: "Sell it to the Guild. Send the crystals to Old Mae" }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { lonca: 2, siginak: -1 }
              - bayrak: "bl12_cicek_lonca"
              - xp_seviye: 8
            sonraki: "bl12_us_goz_cicegi_lonca"
          - id: "bol"
            etiket: { tr: "İkisini aynı masaya oturt; sandığı bölün", en: "Sit them both down at one table. Split the crate" }
            gerekli: { stat: { cha: 230 } }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - itibar: { siginak: 1, lonca: 1 }
              - bayrak: "bl12_cicek_bolundu"
              - xp_seviye: 10
            sonraki: "bl12_us_goz_cicegi_bol"
          - id: "elif"
            etiket: { tr: "Paylaştırmayı {npc:elif_sari|e} bırak", en: "Let {npc:elif_sari} decide who gets what" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 2, saygi: 2 } }
              - ahlak: { merhamet: 1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl12_cicek_bolundu"
              - xp_seviye: 9
            sonraki: "bl12_us_goz_cicegi_elif"

      - id: "bl12_us_goz_cicegi_revir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hemşire sandığı kucaklıyor; ağır ama bırakacak değil. Levazımcı kesesini kemerine geri asıp omuz silkiyor. \"Kapıda biri bağırarak ölürse adını sana yollarım,\" diyor ve gidiyor.", en: "The nurse hugs the crate to her chest. It's heavy, but she doesn't let go. The quartermaster hangs the pouch back on his belt and shrugs. \"Somebody dies screaming in a Gate, I'll send you the name,\" he says, and leaves." }
          - { tr: "Akşam revirden bir bebek ağlaması geliyor. Hemşire kapıdan başını uzatıp sana el sallıyor.", en: "That evening a baby's cry comes from the aid station. The nurse sticks her head out the door and waves to you." }
        secenekler:
          - id: "el"
            etiket: { tr: "El salla", en: "Wave back" }
            sonraki: "@akis"
          - id: "levazimci"
            etiket: { tr: "Levazımcının sözünü düşün", en: "Think about what the quartermaster said" }
            sonraki: "@akis"

      - id: "bl12_us_goz_cicegi_lonca"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Levazımcı kesesini uzatıyor, sandığı iki adamına taşıtıyor. Hemşire bir şey demiyor; boş şişeleri cebinde şıngırdatarak revire dönüyor.", en: "The quartermaster hands over the pouch and has two of his men carry the crate off. The nurse doesn't say anything. She heads back to the aid station, empty bottles clinking in her pocket." }
          - { tr: "Keseyi katır arabacısına veriyorsun. Ertesi hafta {yer:tepe|den} bir haber geliyor: Şükran Nine yamaca yeni tohum ekmiş, çitin kapısına da senin adını kazımış.", en: "You give the pouch to the mule driver. The next week word comes down from {yer:tepe}: Old Mae has sown new seed on the slope and carved your name into the fence gate." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gülümse", en: "Smile" }
            sonraki: "@akis"
          - id: "revir"
            etiket: { tr: "Revire uğrayıp hemşireye bir şey getir", en: "Stop by the aid station and bring the nurse something" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_us_goz_cicegi_bol"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Aşevinin bir masasına oturtuyorsun ikisini. Önce bakışmıyorlar bile. Sonra hemşire doğum sayısını söylüyor, levazımcı ameliyat sayısını; rakamları yan yana yazınca ikisi de susuyor.", en: "You sit them down at a table in the soup kitchen. At first they won't even look at each other. Then the nurse gives her number of births and the quartermaster gives his number of surgeries. Once the numbers are side by side on paper, they both go quiet." }
          - { tr: "Sandık üçe bölünüyor: revire, Kapı cerrahına, bir payı da Şükran Nine'nin yeni tohumuna. Levazımcı kesesinin yarısını masaya bırakıp kalkıyor. Kapıda dönüp hemşireye başıyla selam veriyor.", en: "The crate gets split three ways: the aid station, the Gate surgeon, and a share toward Old Mae's new seed. The quartermaster leaves half his pouch on the table and gets up. At the door he turns and nods to the nurse." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Masayı topla", en: "Clear the table" }
            sonraki: "@akis"
          - id: "not"
            etiket: { tr: "Rakamların yazdığı kâğıdı sakla", en: "Hang onto the paper with the numbers on it" }
            sonraki: "@akis"

      - id: "bl12_us_goz_cicegi_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} sandığın başına geçip çiçekleri avuç avuç ayırıyor, hiç duraksamadan. \"Doğum, revir. Kırık kemik, Kapı cerrahı. Kanser hastası, ikisinden de önce.\" Levazımcı itiraz etmeye kalkıyor, sonra {npc:elif_sari|in} yüzüne bakıp vazgeçiyor.", en: "{npc:elif_sari} steps up to the crate and starts sorting the flowers by the handful without a moment's hesitation. \"Childbirth, aid station. Broken bones, Gate surgeon. Cancer patients, ahead of both.\" The quartermaster starts to object, then takes one look at {npc:elif_sari|pos} face and drops it." }
          - { tr: "İş bitince {npc:elif_sari} ellerini önlüğüne siliyor. \"Triyaj,\" diyor sana. \"Kimseyi mutlu etmez. Ama kimse de ağrı kesicisiz ölmez.\"", en: "When it's done, {npc:elif_sari} wipes her hands on her scrubs. \"Triage,\" she tells you. \"Doesn't make anybody happy. But nobody dies without painkillers either.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Sende iş var, doktor.\"", en: "\"You're good at this, Doc.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "tamam"
            etiket: { tr: "Sandığı revire taşı", en: "Carry the crate to the aid station" }
            sonraki: "@akis"

  # ================================================================== SANAYİ · SUSTURUCU HALKALAR
  - id: "bl12_sn_halka_ocagi"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12 }
    agirlik: 5
    etiketler: ["lonca", "yol", "kesif"]
    gerilim: 3
    kart: { tr: "Susturucu halka", en: "The Silencer Ring" }
    sahne: "bl12_sn_halka_ocagi_1"
    sahneler:
      - id: "bl12_sn_halka_ocagi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "{yer:sanayi|in} gece vardiyasında bir ocak hiç sönmüyor. İçeride on iki örs, on iki çekiç; hepsi aynı şeyi dövüyor: bilek kalınlığında demir halkalar. Her birinin iç yüzüne ölü bir Kapı çekirdeği gömülmüş.", en: "On the night shift in {yer:sanayi}, one forge never goes out. Twelve anvils inside, twelve hammers, all pounding out the same thing: iron rings as thick as a wrist, each with a dead Gate core sunk into the inner face." }
          - { tr: "Eşikten adım attığın an göğsündeki düğüm susuyor. Haftalardır ilk kez ne sıcaklık var ne çekiş; biri göğsüne kalın bir battaniye örtmüş sanki.", en: "The moment you step through the door, the knot in your chest goes quiet. For the first time in weeks, there's no heat, no pull. Like somebody threw a heavy blanket over your chest." }
          - { tr: "Ocağın ustası kır bıyıklı, kolları yanık izli bir adam. Seni görünce çekici bırakıyor. \"Susturucu halka,\" diyor, sen sormadan. \"Yol taşı yutup kendini yakan çocuklar için. Takınca Özler susar, çocuk yaşar. {fraksiyon:lonca|in} siparişi.\"", en: "The forge boss is a man with a gray mustache and burn-scarred arms. When he sees you, he sets his hammer down. \"Silencer ring,\" he says, before you can ask. \"For the kids who swallow Path Stones and burn themselves up. Put one on and the Essences go quiet, and the kid lives. Order from the {fraksiyon:lonca}.\"" }
          - metin: { tr: "Ocağın kabloları {yer:kasaba_cekirdegi|in} mavi ışığıyla yanıyor. Lonca bu halkaları kimsenin durduramayacağı bir hızla döküyor.", en: "The forge cables are lit with {yer:kasaba_cekirdegi|pos} blue glow. The Guild is turning out these rings faster than anybody could stop it." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Usta kolundaki Lonca halkasını görünce sesini alçaltıyor. \"Sana bir şey söylemem gerekir mi, bilmiyorum,\" diyor. \"Sen de Lonca'dansın. Ama bir de... parlıyorsun.\"", en: "When the boss sees the Guild ring on your arm, he drops his voice. \"Don't know if I ought to tell you anything,\" he says. \"You're Guild too. But you're also... glowing.\"" }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Demir Gece'den beri ocağın kapısında Pala'nın adamları nöbet tutuyor. İçeri girerken seni süzüyorlar ama durdurmuyorlar.", en: "Since Iron Night, Cleaver's men have been standing guard at the forge door. They size you up on the way in, but they don't stop you." }
            kosul: { bayrak: "elif_darbe_yasandi" }
        sezgiler:
          - kosul: { stat: { per: 230 } }
            metin: { tr: "Halkaların yarısı çocuk bileğine göre dövülmemiş. Yetişkin bileğine, hatta bir avcının zırhlı koluna göre.", en: "Half these rings weren't made for a kid's wrist. They're sized for grown-ups. Some of them, for a hunter's armored forearm." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷uradayım. sesim kısılıyor. bu halka beni de susturur, biliyorsun değil mi? beni de, seni de.", en: "i̷'m here. my voice is fading. this ring would shut me up too, you know that, right? me and you both." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Alıcılarım çıldırdı. Bu oda bir sinyal kuyusu; giren her şeyi yutuyor. Seninkini de.\"", en: "\"My receivers are freaking out. This room is a signal sink. It eats everything that comes in. Yours too.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yol taşı yutan çocuğa bir tane takabilirdim, evet. Ama üç yüz tane mi? Bu kadar çocuk yok.\"", en: "\"Would I put one on a kid who swallowed a Path Stone? Sure. But three hundred of them? There aren't that many kids.\"" }
        secenekler:
          - id: "defter"
            etiket: { tr: "Sipariş fişlerine göz at", en: "Take a look at the order slips" }
            gerekli: { stat: { per: 230 } }
            etkiler:
              - bayrak: "bl12_halka_defter"
              - bilgi: "demir_gece_plani"
              - ahlak: { duzen: 1 }
              - xp_seviye: 10
              - tohum: { olay: "bl12_kd_halka", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:sanayi|de} gördüğün sipariş fişlerindeki rakam aklından çıkmıyor: üç yüz halka.", en: "The number on the order slips you saw in {yer:sanayi} won't leave you alone. Three hundred rings." } }
            sonraki: "bl12_sn_halka_ocagi_defter"
          - id: "ornek"
            tur: "gizle"
            etiket: { tr: "Bir halkayı sessizce cebine at", en: "Quietly pocket one of the rings" }
            etkiler:
              - gizle: 1
              - bayrak: "bl12_halka_ornek"
              - xp_seviye: 8
              - tohum: { olay: "bl12_kd_halka", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Cebindeki susturucu halka her dokunduğunda göğsünü bir an susturuyor.", en: "Every time you touch the silencer ring in your pocket, your chest goes quiet for a second." } }
            sonraki: "bl12_sn_halka_ocagi_ornek"
          - id: "sondur"
            tur: "gosteris"
            etiket: { tr: "Ocağı söndür; bu halkalar dövülmeyecek", en: "Put out the forge. These rings don't get made" }
            etkiler:
              - dikkat: 3
              - itibar: { lonca: -4 }
              - ahlak: { duzen: -2 }
              - tehlike: { sanayi: 3 }
              - bayrak: "bl12_halka_ocagi_sondu"
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_halka", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:sanayi|de} söndürdüğün ocağın yerine Lonca'nın başka bir ocak yaktığını duydun.", en: "You heard the Guild lit another forge to replace the one you put out in {yer:sanayi}." } }
            sonraki: "bl12_sn_halka_ocagi_sondur"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|e} haber yolla: bu sipariş kimin?", en: "Send word to {npc:kaya_demir}: whose order is this?" }
            goster: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 2, guven: 2 } }
              - ahlak: { duzen: 1 }
              - xp_seviye: 9
              - tohum: { olay: "bl12_kd_halka", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Halkaları {npc:kaya_demir|e} sormuştun; aldığın cevap pek içini rahatlatmadı.", en: "You asked {npc:kaya_demir} about the rings. The answer didn't exactly put your mind at ease." } }
            sonraki: "bl12_sn_halka_ocagi_kaya"
          - id: "inan"
            etiket: { tr: "Ustaya inan; işine karışma", en: "Take the boss at his word. Don't interfere" }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { lonca: 1 }
              - bayrak: "bl12_halka_inanildi"
              - tohum: { olay: "bl12_kd_halka", gecikme: { min: 3, max: 5 }, kosul: { bolum: 12 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen susturucu halkaların kime gideceğini sormamıştın.", en: "You never asked who those silencer rings in {yer:sanayi} were going to." } }
            sonraki: "bl12_sn_halka_ocagi_inan"

      - id: "bl12_sn_halka_ocagi_defter"
        yer: "sanayi"
        paragraflar:
          - { tr: "Usta arkasını döndüğünde duvardaki çiviye takılı fişleri karıştırıyorsun. Üç yüz halka, hepsinin altında {fraksiyon:lonca} levazımcısının imzası. Teslim yeri her fişte aynı:", en: "When the boss turns his back, you flip through the slips hanging off a nail on the wall. Three hundred rings, every one signed by the {fraksiyon:lonca} quartermaster. Same delivery point on every slip:" }
          - metin: { tr: "Balık halinin arkasındaki depo. Gümrük'e, Konsey'in koğuşuna iki sokak. Fişin köşesine biri kurşun kalemle iki kelime karalamış: Demir Gece.", en: "The warehouse behind the fish market. Two blocks from the Customs House, from the Council ward. Somebody's penciled two words in the corner of the slip: Iron Night." }
            kosul: { bayrak_yok: "elif_darbe_yasandi" }
          - metin: { tr: "Gümrük'ün bodrumu. Demir Gece'de alınan tutuklular orada; halkalar onların bileklerine gidiyor.", en: "The Customs House basement. That's where they're holding the people they took on Iron Night. The rings are going on their wrists." }
            kosul: { bayrak: "elif_darbe_yasandi" }
          - { tr: "Fişi yerine takıyorsun. Örslerin başındaki on iki adamdan hiçbiri teslim yerini okumamış; ya da okuyup çekici indirmeye devam etmiş.", en: "You hang the slip back up. None of the twelve men at the anvils has read the delivery point. Or they read it and kept swinging." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Bir şey belli etmeden çık", en: "Walk out without letting on" }
            sonraki: "@akis"
          - id: "usta"
            etiket: { tr: "Ustaya teslim yerini göster", en: "Show the boss the delivery point" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - itibar: { lonca: -1 }
            sonraki: "@akis"

      - id: "bl12_sn_halka_ocagi_ornek"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halka cebine düştüğü an göğsün bir kez daha, iyice susuyor. Ocaktan çıkıp sokağa adım attığında bile ses yok, sıcaklık yok, çekiş yok.", en: "The second the ring drops into your pocket, your chest goes quiet again, all the way. Even when you step out of the forge onto the street. No sound, no heat, no pull." }
          - { tr: "Haftalardır ilk kez kendi soluğunu duyuyorsun. Rahatlık tuhaf, bir o kadar da korkutucu: elini cebinden çıkarana kadar ne olduğunu bilemiyorsun.", en: "For the first time in weeks you can hear your own breathing. It's a strange kind of relief, and just as frightening. Until you take your hand out of your pocket, you don't know what you are." }
        secenekler:
          - id: "cikar"
            etiket: { tr: "Elini cebinden çıkar", en: "Take your hand out of your pocket" }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Bir süre daha sessizliği dinle", en: "Listen to the quiet a little longer" }
            sonraki: "@akis"

      - id: "bl12_sn_halka_ocagi_sondur"
        yer: "sanayi"
        paragraflar:
          - { tr: "Avucunu ocağın ağzına tuttuğunda ateş geri çekiliyor, kömürler sönüp griye dönüyor. On iki çekiç aynı anda havada kalıyor.", en: "When you hold your palm to the mouth of the forge, the fire shrinks back and the coals go out and turn gray. Twelve hammers stop in midair at once." }
          - { tr: "Usta yüzüne uzun uzun bakıyor. \"Yarın başka bir ocakta dövülür,\" diyor. \"Ama bu gece cüruf itleri sıcak arayıp mahalleye inecek. Sönmüş bir ocak onları çağırır.\"", en: "The boss gives you a long look. \"They'll make them at another forge tomorrow,\" he says. \"But tonight the Slag Hounds come down into the neighborhood looking for heat. A dead forge calls them.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "Gece boyunca mahallede nöbet tut", en: "Stand watch in the neighborhood all night" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Omuz silk ve çık", en: "Shrug and walk out" }
            sonraki: "@akis"

      - id: "bl12_sn_halka_ocagi_kaya"
        yer: "sanayi"
        paragraflar:
          - { tr: "Cevap bir saat sonra, {npc:kaya_demir|in} kurye çocuğunun ağzından geliyor. \"Diyor ki: 'Benim siparişim değil. Kimin olduğunu da biliyorum. Bu işe karışma.'\"", en: "The answer comes an hour later, out of the mouth of {npc:kaya_demir|pos} courier kid. \"He says: 'Not my order. I know whose it is, too. Stay out of it.'\"" }
          - { tr: "Çocuk bir an duraksıyor, sonra ekliyor: \"Bir de şunu dedi: 'Sorduğu için sağ olsun.'\"", en: "The kid hesitates, then adds, \"He also said: 'Thanks for asking.'\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kurye çocuğa bir kristal ver", en: "Give the courier kid a crystal" }
            sonraki: "@akis"
          - id: "dusun"
            etiket: { tr: "Kimin siparişi olduğunu düşün", en: "Think about whose order it could be" }
            sonraki: "@akis"

      - id: "bl12_sn_halka_ocagi_inan"
        yer: "sanayi"
        paragraflar:
          - { tr: "Başını sallayıp ocaktan çıkıyorsun. Kapıdan uzaklaştıkça göğsündeki düğüm geri geliyor, önce bir sızı, sonra o tanıdık sıcaklık.", en: "You nod and walk out of the forge. The farther you get from the door, the more the knot in your chest comes back. First an ache, then that familiar heat." }
          - { tr: "Köşeyi dönerken arkanda çekiçler yeniden başlıyor. Ritimleri kalbinkiyle aynı.", en: "As you turn the corner, the hammers start up again behind you. Their rhythm matches your heartbeat." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Keep walking" }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Bir kez dönüp ocağa bak", en: "Turn around once and look at the forge" }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule Dibi: halka noktası (tohum)
  - id: "bl12_kd_halka"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["lonca", "yol"]
    gerilim: 3
    kart: { tr: "Yol denetimi", en: "Path Checkpoint" }
    sahne: "bl12_kd_halka_1"
    sahneler:
      - id: "bl12_kd_halka_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısının önüne bir bariyer çekilmiş, yanına da bir tabela: Yol Denetimi. {fraksiyon:lonca|in} gri yelekli memurları Kule'den inen her avcının bileğine bir alet tutuyor; alet ötünce bileğe bir halka takılıyor.", en: "Somebody's set up a barrier in front of the Spire's door with a sign next to it: Path Checkpoint. {fraksiyon:lonca} officers in gray vests hold a gadget to the wrist of every hunter coming down from the Spire. When it beeps, a ring goes on the wrist." }
          - { tr: "Halka takılan avcılar bir kenarda toplanmış. Kimi bileğini ovuşturuyor, kimi boşluğa bakıyor. Biri küfrediyor ama fısıltıyla; Öz'ü sustuğundan beri sesi kısılmış.", en: "The ringed hunters are bunched up off to one side. Some are rubbing their wrists, some are staring into space. One's swearing up a storm, but in a hoarse whisper. Since his Essence went quiet, so has his voice." }
          - { tr: "Amir seni görünce halka elinde yaklaşıyor. \"Şehrin en yüksek sinyali sensin,\" diyor, kibarca. \"Kendi güvenliğin için. Herkes görsün diye.\"", en: "The officer in charge spots you and comes over, a ring in hand. \"You're the highest signal in the city,\" he says, politely. \"For your own safety. So everybody can see.\"" }
          - metin: { tr: "Cebindeki halkayı elinle buluyorsun. Bunlar ondan; iç yüzlerinde aynı ölü çekirdek.", en: "Your hand finds the ring in your pocket. These are the same kind, the same dead core on the inner face." }
            kosul: { bayrak: "bl12_halka_ornek" }
          - metin: { tr: "Söndürdüğün ocak işe yaramamış; bu halkalar daha kaba, başka bir ocakta, aceleyle dövülmüş. Memurlar sana kötü kötü bakıyor.", en: "Putting out that forge didn't help. These rings are cruder, rushed out at some other forge. The officers are giving you dirty looks." }
            kosul: { bayrak: "bl12_halka_ocagi_sondu" }
          - metin: { tr: "Sipariş fişlerini okudun. Üç yüz halkanın kaçının buraya, kaçının balık halinin arkasına gittiğini merak ediyorsun.", en: "You read the order slips. You wonder how many of those three hundred rings came here and how many went to the warehouse behind the fish market." }
            kosul: { bayrak: "bl12_halka_defter" }
        sezgiler:
          - kosul: { stat: { per: 230 } }
            metin: { tr: "Halkanın kilidi basit: iki diş, bir yay. Kilidi değil, içindeki çekirdeği korkutan şey senin ışığın.", en: "The lock on the ring is simple. Two teeth, one spring. It's not the lock that matters. It's the core inside, and what scares it is your light." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "takarsan susarım. sen de susarsın. kimse ne olduğumuzu görmez. bazen bunu istediğini biliyorum.", en: "put it on and i go quiet. so do you. nobody sees what we are. i know part of you wants that sometimes." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bana o şeyi takmaya kalkan elini kaybeder.\" Memur hemen bir adım geri çekiliyor.", en: "\"Anybody who tries to put that thing on me loses a hand.\" The officer takes a quick step back." }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Alet sinyal ölçmüyor, kayıt alıyor. Kimin bileğine ne zaman halka takıldığı bir yere yazılıyor.\"", en: "\"That gadget isn't measuring signals. It's logging. Whose wrist got ringed and when, it's all getting written down somewhere.\"" }
        secenekler:
          - id: "tak"
            etiket: { tr: "Halkayı herkesin önünde bileğine tak", en: "Put the ring on in front of everybody" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
              - bayrak: "bl12_halka_takildi"
              - xp_seviye: 8
            sonraki: "bl12_kd_halka_tak"
          - id: "reddet"
            etiket: { tr: "\"Hayır.\" Bariyerin yanından geç", en: "\"No.\" Walk around the barrier" }
            etkiler:
              - dikkat: 2
              - itibar: { lonca: -1 }
              - bayrak: "bl12_halka_reddedildi"
              - xp_seviye: 8
            sonraki: "bl12_kd_halka_reddet"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Takılı halkaların hepsini bir anda kır", en: "Snap every ring on every wrist at once" }
            gerekli: { stat: { str: 250 } }
            etkiler:
              - dikkat: 3
              - itibar: { lonca: -3 }
              - ahlak: { duzen: -2, merhamet: 2 }
              - bayrak: "bl12_halka_noktasi_dagildi"
              - xp_seviye: 10
            sonraki: "bl12_kd_halka_kir"
          - id: "kilit"
            etiket: { tr: "Cebindeki halkayla kilidin nasıl açıldığını göster", en: "Use the ring in your pocket to show how the lock opens" }
            goster: { bayrak: "bl12_halka_ornek" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - bayrak: "bl12_halka_noktasi_dagildi"
              - xp_seviye: 10
            sonraki: "bl12_kd_halka_kilit"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|le} omuz omuza bariyeri geç", en: "Walk through the barrier shoulder to shoulder with {npc:aras_kurt}" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, baglilik: 2 } }
              - dikkat: 2
              - itibar: { lonca: -1 }
              - bayrak: "bl12_halka_reddedildi"
              - xp_seviye: 8
            sonraki: "bl12_kd_halka_aras"

      - id: "bl12_kd_halka_tak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halka bileğine kapandığı an dünya bir ton kararıyor. Düğüm susuyor, {npc:yanki} susuyor, kulaklarında yalnızca martıların ve meydanın uğultusu kalıyor.", en: "The second the ring snaps shut on your wrist, the world goes a shade darker. The knot goes silent, {npc:yanki} goes silent, and all that's left in your ears is the gulls and the hum of the plaza." }
          - { tr: "Memur memnun, alete bakıyor: sıfır. Halka takılan avcılar sana bakıyor; kimisi rahatlamış, kimisi hayal kırıklığına uğramış. Akşam kimse görmezken halkayı çıkarıyorsun ve göğsün bir anda öyle bir yanıyor ki dizlerinin üstüne çöküyorsun.", en: "The officer checks his gadget, pleased. Zero. The ringed hunters are looking at you. Some look relieved, some let down. That evening, when nobody's watching, you take the ring off, and your chest flares up so hard you drop to your knees." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Soluklanıp ayağa kalk", en: "Catch your breath and get up" }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Halkayı bir çekmeceye kilitle", en: "Lock the ring away in a drawer" }
            sonraki: "@akis"

      - id: "bl12_kd_halka_reddet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bariyerin yanından geçerken memur bir şey söylemeye kalkıyor, sonra vazgeçiyor. Aleti sana doğru tutuyor; alet ötmeye başlıyor ve susmuyor.", en: "As you walk around the barrier, the officer starts to say something, then thinks better of it. He points the gadget at you, and it starts beeping and won't stop." }
          - { tr: "Halka takılan avcılardan biri bileğini havaya kaldırıp alkışlıyor; tek eliyle, öbürüne halka takılı olduğu için. Birkaç kişi ona katılıyor.", en: "One of the ringed hunters raises his wrist and starts clapping, one-handed because the ring's on the other one. A few others join in." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan yürü", en: "Keep walking without looking back" }
            sonraki: "@akis"
          - id: "selam"
            etiket: { tr: "Alkışlayan avcıya başınla selam ver", en: "Nod to the hunter who's clapping" }
            sonraki: "@akis"

      - id: "bl12_kd_halka_kir"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Göğsündeki ışığı bir anda dışarı salıyorsun. Ölü çekirdekler o ışığa dayanamıyor; meydandaki bütün halkalar aynı anda çatlayıp bileklerden düşüyor, kaldırımda tıngırdıyor.", en: "You let the light in your chest out all at once. The dead cores can't take it. Every ring on the plaza cracks at the same moment and drops off its wrist, clattering on the pavement." }
          - { tr: "Avcılar bileklerini ovuşturarak sana bakıyor. Küfreden adamın sesi geri gelmiş; ilk kelimesi yine bir küfür, bu sefer avazı çıktığı kadar bağırarak. Memur aletine bakıyor, alet de kararıp sönüyor.", en: "The hunters rub their wrists and stare at you. The swearing guy's voice is back. His first word is another curse, this time at the top of his lungs. The officer looks down at his gadget, and it flickers and dies." }
        secenekler:
          - id: "git"
            etiket: { tr: "Bariyeri kenara itip içeri gir", en: "Shove the barrier aside and go in" }
            sonraki: "@akis"
          - id: "toplama"
            etiket: { tr: "Kırık halkaları toplayıp memura ver", en: "Gather up the broken rings and hand them to the officer" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "bl12_kd_halka_kilit"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Cebindeki halkayı çıkarıp avcılara kilidi gösteriyorsun: iki diş, bir yay, bir bıçak ucu. Birinin bileğindekini açıyorsun, sonra bir başkasınınkini. Üçüncüyü avcılar kendileri açıyor.", en: "You take the ring out of your pocket and show the hunters the lock. Two teeth, one spring, the tip of a knife. You open one guy's ring, then another's. The hunters open the third one themselves." }
          - { tr: "Memurlar yetişemiyor. Yarım saat sonra bariyerin önünde açılmış halkalardan bir yığın birikmiş, avcılar da bıçaklarını bileyip kilidin püf noktasını birbirine öğretiyor.", en: "The officers can't keep up. Half an hour later there's a pile of opened rings in front of the barrier, and the hunters are sharpening their knives and showing each other the trick." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kendi halkanı da yığına at", en: "Toss your own ring on the pile" }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kendi halkanı cebinde tut", en: "Keep your ring in your pocket" }
            sonraki: "@akis"

      - id: "bl12_kd_halka_aras"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} bariyerin önünde bir an duruyor, memurun gözünün içine bakıyor ve bariyeri bir parmağıyla kenara itiyor. Siz geçerken alet ikinize de ötüyor.", en: "{npc:aras_kurt} stops at the barrier for a second, looks the officer dead in the eye, and nudges the barrier aside with one finger. The gadget beeps for both of you as you go through." }
          - { tr: "Kapının içinde {npc:aras_kurt} sana dönüyor. \"İkimiz de yeterince yüksek ötüyoruz demek,\" diyor. Sesinde ilk kez kıskançlık yok, yalnızca gurur var.", en: "Inside the door, {npc:aras_kurt} turns to you. \"Guess we both beep loud enough,\" he says. For once there's no jealousy in his voice. Just a kind of pride." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gülümse", en: "Smile" }
            sonraki: "@akis"
          - id: "takil"
            etiket: { tr: "\"Benimki daha yüksek öttü.\"", en: "\"Mine beeped louder.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"

  # ================================================================== ESKİ ŞEHİR · SAATÇİ
  - id: "bl12_es_saatci"
    konum: ["eski_sehir"]
    perde: [3]
    gun: { min: 231, max: 252 }
    kosul: { bolum: 12, bayrak_yok: "yol_olustu" }
    agirlik: 5
    etiketler: ["eski_sehir", "yol", "kesif"]
    gerilim: 2
    kart: { tr: "Geri işleyen saatler", en: "Clocks Running Backward" }
    sahne: "bl12_es_saatci_1"
    sahneler:
      - id: "bl12_es_saatci_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} kapalı çarşısında, bedestenin en dip köşesinde bir saatçi dükkânı var. Duvarlar tavana kadar saatle kaplı, hiçbiri çalışmıyor.", en: "Deep in the covered bazaar of {yer:eski_sehir}, in the farthest corner, there's a clock shop. The walls are covered in clocks up to the ceiling, and not one of them is running." }
          - { tr: "Saatçi seksenini geçmiş, iki büklüm bir adam: Hayri Usta. \"Kayıpların saatleri,\" diyor. \"Herkes bir tane getirdi. Sahibi ölünce saat de durur, bilirsin. Ben tamir etmem, yalnızca saklarım.\"", en: "The clockmaker is a stooped man well past eighty. Everybody calls him Old Harlan. \"Clocks of the missing,\" he says. \"Everybody brought one in. When the owner dies, the clock stops, you know. I don't fix them. I just keep them.\"" }
          - { tr: "Eşikten adım attığın an bütün saatler aynı anda tıkırdamaya başlıyor. İleri değil, geri.", en: "The second you step over the threshold, every clock starts ticking at once. Not forward. Backward." }
          - { tr: "Köşelerdeki gölgeler kalınlaşıyor; her saatin altında insan biçimli bir gölge beliriyor. Tezgâhın arkasında dördü on iki geçe durmuş küçük bir duvar saati de geri sayıyor, önündeki gölge önlüklü bir kadın. \"Nermin,\" diyor usta, sesi kırılarak. \"{yer:kordon|de}... ilk gece, deniz geldiğinde.\"", en: "The shadows in the corners thicken, and under every clock a person-shaped shade appears. Behind the counter, a little wall clock stopped at 4:12 is counting backward too, and the shade in front of it is a woman in an apron. \"Nell,\" the old man says, his voice cracking. \"On {yer:kordon}... the first night, when the sea came in.\"" }
          - metin: { tr: "{npc:deniz_arman} duvardaki saatlerden birine, plastik kayışlı, üstünde çizgi film kahramanı olan bir çocuk saatine uzun uzun bakıyor.", en: "{npc:deniz_arman} stares for a long time at one of the clocks on the wall: a kid's watch with a plastic band and a cartoon character on the face." }
            kosul: { yoldas: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Gölgeler saatlere değil, sana dönük. Saatleri geri çeviren göğsündeki düğüm; uzaklaşırsan dururlar.", en: "The shades aren't facing the clocks. They're facing you. It's the knot in your chest that's turning the clocks back. Walk away and they'll stop." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar ölüler değil. ölülerin bıraktığı boşluğun biçimi. ben bunu iyi bilirim.", en: "these aren't the dead. they're the shape of the hole the dead left behind. i'd know." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Adamın nabzı yüz kırk. Bu gece ya kalbi duracak ya da hayatının en güzel gecesi olacak.\"", en: "\"His pulse is at a hundred and forty. Tonight's either going to stop his heart or be the best night of his life.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Çıkmaz gölgeleri bunlar. Kalabalıklaşırlarsa çarşının yarısını boşaltırız.\"", en: "\"Those are Alley Shades. If they get any thicker, we'll be clearing out half this bazaar.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "Dükkânda kal; saatler geri işlesin", en: "Stay in the shop. Let the clocks run backward" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - tehlike: { eski_sehir: 3 }
              - bayrak: "bl12_saatler_geri"
              - xp_seviye: 9
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Hayri Usta'nın dükkânındaki saatlerin geri tıkırtısı hâlâ kulağında. Bu gece saat dördü on iki geçe {yer:kordon|de} olmalısın.", en: "The backward ticking of Old Harlan's clocks is still in your ears. Tonight at 4:12 you need to be on {yer:kordon}." } }
            sonraki: "bl12_es_saatci_kal"
          - id: "dagit"
            etiket: { tr: "Gölgeler sokağa taşmadan onları dağıt", en: "Break up the shades before they spill into the street" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["sokak_golgesi@dunya", "sokak_golgesi@dunya"], ortam: ["dar_gecit"], kazan: "bl12_es_saatci_dagit", kaybet: "bl12_es_saatci_yenilgi" }
          - id: "yanki"
            etiket: { tr: "Ustaya anlat: o gölge Nermin değil, bir yankı", en: "Tell the old man: that shade isn't Nell, it's an echo" }
            gerekli: { stat: { wis: 230 } }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - bayrak: "bl12_saat_alindi"
              - xp_seviye: 10
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Nermin'in saati cebinde, geri geri tıkırdıyor. Bu gece saat dördü on iki geçe {yer:kordon|de} olmalısın.", en: "Nell's clock is in your pocket, ticking backward. Tonight at 4:12 you need to be on {yer:kordon}." } }
            sonraki: "bl12_es_saatci_yanki"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} saatlerin tıkırtısını ölçsün", en: "Have {npc:mert_kilic} take readings on the ticking" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 3, guven: 1 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl12_es_saatci", agirlik: 20 }
              - bayrak: "bl12_saat_alindi"
              - xp_seviye: 9
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Nermin'in saati cebinde, geri geri tıkırdıyor. Bu gece saat dördü on iki geçe {yer:kordon|de} olmalısın.", en: "Nell's clock is in your pocket, ticking backward. Tonight at 4:12 you need to be on {yer:kordon}." } }
            sonraki: "bl12_es_saatci_mert"
          - id: "cik"
            etiket: { tr: "Dükkândan çık; saatler dursun", en: "Leave the shop. Let the clocks stop" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bayrak: "bl12_saatci_birakildi"
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Hayri Usta'nın elinde saatle çarşıdan denize doğru yürüdüğünü duydun. Bu gece saat dördü on iki geçe {yer:kordon|de} olacakmış.", en: "You heard Old Harlan was seen walking from the bazaar toward the sea with that clock in his hands. He's going to be on {yer:kordon} tonight at 4:12." } }
            sonraki: "bl12_es_saatci_cik"

      - id: "bl12_es_saatci_kal"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Tezgâhın yanında, saatlerin geri tıkırtısının ortasındasın. Gölgeler gitgide keskinleşmiş; birinin saçı, birinin gözlüğü, birinin topalladığı ayağı seçiliyor. Hayri Usta önlüklü gölgenin önünde, ellerini uzatmış, dokunmaya cesaret edemiyor.", en: "You stand by the counter in the backward ticking. The shades sharpen. You can make out one's hair, another's glasses, another's limp. Old Harlan stands in front of the shade in the apron with his hands out, not daring to touch." }
          - { tr: "Derken önlüklü gölge dönüp kapıya yürüyor, çarşının karanlık koridorlarından geçip denize doğru gidiyor; öbür gölgeler de peşi sıra dağılıyor, kimi sağa, kimi sola. Usta saati duvardan kapıp peşine düşüyor.", en: "Then the shade in the apron turns and walks to the door. It heads off through the bazaar's dark corridors toward the sea, and the other shades scatter into the streets behind it. The old man grabs the clock off the wall and goes after it." }
          - { tr: "O gece {yer:eski_sehir|in} dar sokaklarında gölgeler dolaşıyor. Kimseye saldırmıyorlar; yalnızca eski evlerinin kapılarını çalıp bekliyorlar.", en: "That night shades roam the narrow streets of {yer:eski_sehir}. They don't attack anybody. They just knock on the doors of the houses they used to live in, and wait." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kapıları çalıyorlar. açan olursa ne diyecekler? hiçbir şey. ağızları yok. ama yine de çalıyorlar.", en: "they're knocking. if somebody answers, what will they say? nothing. no mouths. they knock anyway." }
        secenekler:
          - id: "pesi"
            etiket: { tr: "Ustayı uzaktan izle", en: "Follow the old man from a distance" }
            sonraki: "@akis"
          - id: "kapilar"
            etiket: { tr: "Kapılarını çalan gölgelerin evlerine uğra", en: "Stop by the houses where the shades are knocking" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_es_saatci_dagit"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Son gölge de dağıldığında saatler bir anda susuyor. Dükkân, kayıpların durmuş saatleriyle yine eskisi gibi; yalnızca daha soğuk.", en: "When the last shade breaks apart, the clocks go silent all at once. The shop is just like it was, full of the stopped clocks of the missing. Only colder." }
          - { tr: "Hayri Usta tezgâhın arkasındaki saati duvardan indirip sana uzatıyor. \"Sen gidince yine geri işler mi, bilmiyorum,\" diyor. \"Onu yerine götür. {yer:kordon|e}, dördü on iki geçe. Orada dursun.\"", en: "Old Harlan takes the clock behind the counter down off the wall and holds it out to you. \"I don't know if it'll run backward again once you're gone,\" he says. \"Take it home for me. To {yer:kordon}, at 4:12. Let it stop there.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Saati al", en: "Take the clock" }
            etkiler:
              - bayrak: "bl12_golgeler_dagitildi"
              - tehlike: { eski_sehir: -2 }
              - xp_seviye: 10
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Nermin'in saati cebinde, geri geri tıkırdıyor. Bu gece saat dördü on iki geçe {yer:kordon|de} olmalısın.", en: "Nell's clock is in your pocket, ticking backward. Tonight at 4:12 you need to be on {yer:kordon}." } }
            sonraki: "@akis"
          - id: "birlikte"
            etiket: { tr: "\"Birlikte götürelim.\"", en: "\"We'll take it together.\"" }
            etkiler:
              - bayrak: "bl12_golgeler_dagitildi"
              - tehlike: { eski_sehir: -2 }
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Hayri Usta'yla sözleştiniz: bu gece saat dördü on iki geçe, {yer:kordon|de}.", en: "You and Old Harlan agreed to meet. Tonight, 4:12, on {yer:kordon}." } }
            sonraki: "@akis"

      - id: "bl12_es_saatci_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Gözlerini açtığında dükkânın tozlu zeminindesin. Hayri Usta alnına ıslak bir bez bastırıyor. Gölgeler gitmiş; dükkândan değil, çarşıdan da çıkıp sokaklara dağılmışlar.", en: "When you open your eyes, you're on the shop's dusty floor and Old Harlan is pressing a wet rag to your forehead. The shades are gone. Not just out of the shop: out of the bazaar, scattered into the streets." }
          - { tr: "\"Nermin de gitti,\" diyor usta. \"Denize doğru. Saati dördü on iki geçe orada olacak, biliyorum. Ben de olacağım.\"", en: "\"Nell's gone too,\" the old man says. \"Down toward the sea. Her clock'll be there at 4:12, I know it. So will I.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Doğrul; \"Ben de geleceğim.\"", en: "Sit up. \"I'll be there too.\"" }
            etkiler:
              - bayrak: "bl12_saatler_geri"
              - tehlike: { eski_sehir: 2 }
              - tohum: { olay: "bl12_ko_saat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 12 }, hatirlatma: { tr: "Hayri Usta'ya söz verdin: bu gece saat dördü on iki geçe {yer:kordon|de} olacaksın.", en: "You promised Old Harlan. Tonight at 4:12, you'll be on {yer:kordon}." } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kalk ve çarşıdan çık", en: "Get up and leave the bazaar" }
            etkiler:
              - bayrak: "bl12_saatler_geri"
              - tehlike: { eski_sehir: 2 }
            sonraki: "@akis"

      - id: "bl12_es_saatci_yanki"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Ustanın koluna dokunup anlatıyorsun: gölge Nermin değil, Nermin'in bıraktığı boşluğun biçimi. Saati geri çeviren de o değil, senin göğsündeki düğüm. Sen gidince gölge de gidecek.", en: "You touch the old man's arm and explain. That shade isn't Nell. It's the shape of the space she left. And she isn't the one turning the clock back. It's the knot in your chest. When you go, the shade goes too." }
          - { tr: "Hayri Usta'dan uzun süre ses yok. Sonra saati duvardan indirip avucuna bırakıyor. \"O zaman götür onu,\" diyor. \"{yer:kordon|e}, dördü on iki geçe. Bir kere de doğru yerde dursun.\"", en: "Old Harlan is quiet for a long time. Then he takes the clock off the wall and sets it in your palm. \"Then take it,\" he says. \"To {yer:kordon}, at 4:12. Let it stop in the right place for once.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Saati cebine koy", en: "Put the clock in your pocket" }
            sonraki: "@akis"
          - id: "sar"
            etiket: { tr: "Ustanın elini sık", en: "Squeeze the old man's hand" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bl12_es_saatci_mert"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{npc:mert_kilic} alıcısını saatlerden birine dayıyor, sonra sana çeviriyor, sonra yine saate. \"Aynı frekans,\" diyor fısıltıyla. \"Saatler senin göğsünün yankısını tıkırdatıyor. Gölgeler de... onu izliyor. Sana bakıyorlar.\"", en: "{npc:mert_kilic} holds his receiver up to one of the clocks, then swings it toward you, then back to the clock. \"Same frequency,\" he whispers. \"The clocks are ticking out an echo of your chest. And the shades are... following it. They're looking at you.\"" }
          - { tr: "Hayri Usta bunu duyunca saati duvardan indirip sana uzatıyor. \"Madem öyle, götür onu. {yer:kordon|e}, dördü on iki geçe; bir kere de doğru yerde dursun.\"", en: "When Old Harlan hears that, he takes the clock down and holds it out to you. \"If that's how it is, take it. To {yer:kordon}, at 4:12. Let it stop in the right place for once.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Saati al", en: "Take the clock" }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "{npc:mert_kilic|e} kaydı silmesini söyle", en: "Tell {npc:mert_kilic} to delete the reading" }
            etkiler:
              - iliski: { mert_kilic: { guven: 1 } }
            sonraki: "@akis"

      - id: "bl12_es_saatci_cik"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Geri adım atıp dükkândan çıktığında saatler bir bir susuyor. Arkandan ustanın tek hıçkırığı geliyor, sonra hiçbir ses.", en: "When you step back out of the shop, the clocks go quiet one by one. Behind you, the old man sobs once. Then nothing." }
          - { tr: "Bir saat sonra çarşının çıkışında yanından geçiyor. Kollarının arasında bir bez parçasına sarılmış küçük bir saat, gözü denizde.", en: "An hour later he passes you at the bazaar exit, a little clock wrapped in a scrap of cloth in his arms, his eyes on the sea." }
        secenekler:
          - id: "git"
            etiket: { tr: "Bırak gitsin", en: "Let him go" }
            sonraki: "@akis"
          - id: "seslen"
            etiket: { tr: "Arkasından seslen; nereye gittiğini sor", en: "Call after him. Ask where he's going" }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kordon: dört on iki (tohum)
  - id: "bl12_ko_saat"
    konum: ["kordon"]
    perde: [3]
    yalniz_tohum: true
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12 }
    etiketler: ["kordon", "yol"]
    gerilim: 2
    kart: { tr: "Dördü on iki geçe", en: "4:12" }
    sahne: "bl12_ko_saat_1"
    sahneler:
      - id: "bl12_ko_saat_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece dört. {yer:kordon|de} rüzgâr yok, deniz yağ gibi düz. Yıkık korkuluğun dibinde yosun tutmuş bir bank, bankın üstünde Hayri Usta; paltosunun yakasını kaldırmış, bekliyor.", en: "Four in the morning. Not a breath of wind on {yer:kordon}, and the sea's flat as oil. At the foot of the broken railing there's a moss-covered bench, and on it sits Old Harlan, coat collar turned up, waiting." }
          - metin: { tr: "Usta evde oturamamış, o da gelmiş.", en: "The old man couldn't sit at home, so he came too." }
            kosul: { herhangi: [{ bayrak: "bl12_saat_alindi" }, { bayrak: "bl12_golgeler_dagitildi" }] }
          - metin: { tr: "Korkuluğun dibinde, denize bakan soluk bir iz var. Usta saati kucağında tutuyor; o ize birkaç adımdan fazla yaklaşamıyor.", en: "At the foot of the railing there's a faint trace of her, looking out at the sea. The old man holds the clock in his lap. He can't get closer to it than a few steps." }
            kosul: { bayrak: "bl12_saatler_geri" }
          - metin: { tr: "Saat ustanın kucağında. Seni görünce şaşırmış gibi değil. \"Geleceğini biliyordum,\" diyor. \"Sen yanındayken geri işliyor. Sensiz kımıldamıyor bile.\"", en: "The clock's in the old man's lap. He isn't surprised to see you. \"Knew you'd come,\" he says. \"It runs backward when you're around. Without you it won't even budge.\"" }
            kosul: { bayrak: "bl12_saatci_birakildi" }
          - { tr: "Dördü on iki geçe deniz kıpırdıyor. Dalgasız denizde bir köpük öbeği kabarıp kabarıp sonunda kadın boyuna ulaşıyor. Köpükten bir önlük, köpükten iki el.", en: "At 4:12 the sea moves. On a sea without a single wave, a patch of foam swells and swells until it's as tall as a woman. An apron of foam. Two hands of foam." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Köpük Ruhu", en: "[ANALYSIS] Spindrift" }
            satirlar:
              - { tr: "Kaynak: boğulma anında kalan iz. Tetikleyici: yakındaki yüksek Öz yoğunluğu.", en: "Source: residue from the moment of drowning. Trigger: high Essence density nearby." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Köpük ruhu kıyıya değil, saate doğru uzanıyor. Ona dokunursa saat de, kendisi de bitecek.", en: "The Spindrift isn't reaching for the shore. It's reaching for the clock. If it touches it, the clock and the Spindrift will both be finished." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "son cümlesi hâlâ suyun içinde. istersen duyarım. sen de duyarsın. o da.", en: "her last sentence is still in the water. i can hear it if you want. so can you. so can he." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "{npc:deniz_arman} korkuluğa tutunuyor, gözlerini köpükten ayıramıyor.", en: "{npc:deniz_arman} grips the railing and can't look away from the foam." }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Saldırmıyor,\" diyor {npc:aras_kurt}, kılıcını yarıya kadar çekmişken. \"Neden saldırmıyor?\"", en: "\"It's not attacking,\" {npc:aras_kurt} says, sword half drawn. \"Why isn't it attacking?\"" }
        secenekler:
          - id: "deniz"
            etiket: { tr: "Saati denize bırak", en: "Let the clock go into the sea" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - tehlike: { kordon: -2 }
              - bayrak: "bl12_saat_denizde"
              - xp_seviye: 10
            sonraki: "bl12_ko_saat_deniz"
          - id: "dagit"
            etiket: { tr: "Köpük ruhunu dağıt; o artık o kadın değil", en: "Break up the Spindrift. It isn't her anymore" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kopuk_ruhu@dunya"], ortam: ["su"], kazan: "bl12_ko_saat_dagit", kaybet: "bl12_ko_saat_yenilgi" }
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} kadının son cümlesini sor", en: "Ask {npc:yanki} for her last sentence" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - tehlike: { kordon: -1 }
              - bayrak: "bl12_saat_son_soz"
              - xp_seviye: 12
            sonraki: "bl12_ko_saat_yanki"
          - id: "usta"
            etiket: { tr: "Kararı ustaya bırak", en: "Leave it up to the old man" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl12_saat_hayride"
              - xp_seviye: 9
            sonraki: "bl12_ko_saat_usta"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} ustanın yanına otursun", en: "Have {npc:elif_sari} sit with the old man" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 2, baglilik: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl12_ko_saat", agirlik: 20 }
              - bayrak: "bl12_saat_hayride"
              - xp_seviye: 9
            sonraki: "bl12_ko_saat_elif"

      - id: "bl12_ko_saat_deniz"
        yer: "kordon"
        paragraflar:
          - { tr: "Saati korkuluğun üstünden suya bırakıyorsun. Köpük ellerini uzatıp onu yakalıyor; saat bir an köpüğün içinde parlıyor, sonra tıkırtı kesiliyor.", en: "You drop the clock over the railing into the water. The foam reaches out and catches it. For a second the clock glows inside the foam. Then the ticking stops." }
          - { tr: "Köpük ağır ağır çöküyor, denize karışıyor. Hayri Usta bir süre hiçbir şey demiyor. Sonra şapkasını çıkarıp denize doğru hafifçe eğiliyor, bir evden çıkarken yapıldığı gibi.", en: "The foam sinks slowly back into the sea. Old Harlan doesn't say anything for a while. Then he takes off his hat and bows slightly toward the water, the way you would when leaving a house." }
          - { tr: "Sonraki gecelerde {yer:kordon|de} köpük ruhları seyreliyor. Balıkçılar nedenini bilmiyor.", en: "Over the next few nights, there are fewer Spindrifts on {yer:kordon}. The fishermen don't know why." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Ustayla birlikte sabahı bekle", en: "Wait for morning with the old man" }
            sonraki: "@akis"
          - id: "eve"
            etiket: { tr: "Ustayı evine kadar götür", en: "Walk the old man home" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_ko_saat_dagit"
        yer: "kordon"
        paragraflar:
          - { tr: "Köpük dağılırken bir an önlüğün biçimi havada asılı kalıyor, sonra tuzlu bir serpinti olup yüzüne vuruyor. Saat duruyor, bu kez sonsuza kadar.", en: "As the foam breaks apart, the shape of the apron hangs in the air for a second, then turns into a salty spray that hits you in the face. The clock stops. For good this time." }
          - { tr: "Hayri Usta saati alıp camını paltosunun ucuyla siliyor. \"Haklıydın belki,\" diyor. \"O değildi.\" Ama gözü hâlâ suyun yüzünde.", en: "Old Harlan takes the clock and wipes its face with the corner of his coat. \"Maybe you were right,\" he says. \"It wasn't her.\" His eyes are still on the water, though." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ustanın omzuna elini koy", en: "Put a hand on the old man's shoulder" }
            etkiler:
              - tehlike: { kordon: -3 }
              - bayrak: "bl12_saat_hayride"
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kılıcını silip uzaklaş", en: "Wipe off your blade and walk away" }
            etkiler:
              - tehlike: { kordon: -3 }
              - bayrak: "bl12_saat_hayride"
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl12_ko_saat_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Tuzlu suyu öksürerek kendine geldiğinde korkuluğun dibindesin. Hayri Usta seni sudan çekmiş; nasıl, bilmiyorsun. Köpük gitmiş, saat de onunla.", en: "You come to coughing up salt water at the foot of the railing. Old Harlan pulled you out of the sea. You have no idea how. The foam's gone, and the clock went with it." }
          - { tr: "\"Kendi aldı,\" diyor usta. \"Sana çarpmadan önce saati aldı. Belki de istediği buydu.\"", en: "\"She took it herself,\" the old man says. \"Took the clock before she hit you. Maybe that's all she wanted.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Doğrul ve ustaya teşekkür et", en: "Sit up and thank the old man" }
            etkiler:
              - bayrak: "bl12_saat_denizde"
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Suya bak", en: "Look at the water" }
            etkiler:
              - bayrak: "bl12_saat_denizde"
            sonraki: "@akis"

      - id: "bl12_ko_saat_yanki"
        yer: "kordon"
        paragraflar:
          - { tr: "Penceren açılıyor; satırlar bozuk harflerle, suyun ritmiyle akıyor. {npc:yanki} köpüğün içinden bir şey çekip çıkarıyor ve senin ağzından söylüyor:", en: "Your window opens and the lines come through in broken letters, on the rhythm of the water. {npc:yanki} pulls something out of the foam and says it through your mouth:" }
          - { tr: "hayri. ocağın altını kapat. yine unuttun.", en: "harlan. turn off the stove. you forgot again." }
          - { tr: "Hayri Usta gülmeye başlıyor; ağlamakla gülmek arasında bir şey. \"Kapatmıştım,\" diyor köpüğe. \"O gece kapatmıştım, Nermin. Yemin ederim kapatmıştım.\" Köpük çöküyor, saat de susuyor.", en: "Old Harlan starts to laugh, somewhere between laughing and crying. \"I did turn it off,\" he tells the foam. \"I turned it off that night, Nell. I swear I did.\" The foam sinks, and the clock goes quiet." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Ustanın yanına otur", en: "Sit down beside the old man" }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} içinden teşekkür et", en: "Thank {npc:yanki} silently" }
            sonraki: "@akis"

      - id: "bl12_ko_saat_usta"
        yer: "kordon"
        paragraflar:
          - { tr: "Saati ustanın avucuna bırakıp bir adım geri çekiliyorsun. Hayri Usta köpüğe bakıyor, sonra saate. Uzun süre öyle kalıyor.", en: "You set the clock in the old man's hands and step back. Old Harlan looks at the foam, then at the clock. He stays like that for a long time." }
          - { tr: "Sonunda saati kurup cebine koyuyor. \"Bir gün daha,\" diyor köpüğe. \"Yarın yine gelirim.\" Köpük kıpırdamadan bekliyor, sonra denize karışıyor. Usta kalkıp ağır ağır yürüyor; senin göğsünden uzaklaştıkça saatin tıkırtısı da azalıyor.", en: "Finally he winds the clock and puts it in his pocket. \"One more day,\" he tells the foam. \"I'll come back tomorrow.\" The foam waits, perfectly still, then sinks into the sea. The old man gets up and walks slowly off, and the farther he gets from your chest, the fainter the ticking gets." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Uzaklaşmasını izle", en: "Watch him go" }
            sonraki: "@akis"
          - id: "seslen"
            etiket: { tr: "\"Yarın ben de gelirim.\"", en: "\"I'll come tomorrow too.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

      - id: "bl12_ko_saat_elif"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:elif_sari} ustanın yanına oturup bileğini tutuyor; nabzını saymıyor, yalnızca tutuyor. \"Çok hasta gördüm,\" diyor alçak sesle. \"Hepsi son anda aynı şeyi ister: yanlarında biri olsun. Saat değil, biri.\"", en: "{npc:elif_sari} sits down beside the old man and takes his wrist. She isn't counting his pulse. She's just holding it. \"I've seen a lot of patients,\" she says quietly. \"At the end they all want the same thing. Somebody next to them. Not a clock. Somebody.\"" }
          - { tr: "Hayri Usta başını sallıyor. Köpük çökene kadar ikisi de konuşmuyor. Sonra usta saati {npc:elif_sari|e} uzatıyor: \"Sen sakla, kızım. Ben her gün bakmaya dayanamam.\"", en: "Old Harlan nods. Neither of them talks until the foam sinks. Then he holds the clock out to {npc:elif_sari}. \"You keep it, sweetheart. I can't stand to look at it every day.\"" }
        secenekler:
          - id: "bak"
            etiket: { tr: "İkisini kendi hallerine bırak", en: "Give the two of them some space" }
            sonraki: "@akis"
          - id: "otur"
            etiket: { tr: "Onların yanına otur", en: "Sit down with them" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · KULE DİBİ · ARAS
  - id: "bl12_kd_kamp_aras"
    kamp: true
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12, yoldas: "aras_kurt" }
    etiketler: ["kamp", "npc", "yoldas"]
    gerilim: 1
    npc: ["aras_kurt"]
    kart: { tr: "Kule'nin dibinde ateş", en: "A Fire Under the Spire" }
    sahne: "bl12_kd_kamp_aras_1"
    sahneler:
      - id: "bl12_kd_kamp_aras_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin gölgesinde, kırık sandıklardan yakılmış bir ateş. {npc:aras_kurt} kılıcını bileyliyor, her sürtüşte gözü bir an senin göğsüne kayıyor. Karanlık çöktükçe oradaki ışık belirginleşiyor.", en: "A fire of broken crates in the Spire's shadow. {npc:aras_kurt} is sharpening his sword, and with every stroke his eyes slide to your chest for a second. The darker it gets, the clearer the light there shows." }
          - { tr: "\"Acıyor mu?\" diye soruyor sonunda, bileği taşını bırakmadan. \"Şu ışık. Yol mu ne diyorlar. Acıyor mu?\"", en: "\"Does it hurt?\" he finally asks, without putting down the whetstone. \"That light. The Path, or whatever they're calling it. Does it hurt?\"" }
          - metin: { tr: "Cebinden bez parçasına sarılı bir şey çıkarıyor: gri, pürüzsüz, ceviz büyüklüğünde bir çekirdek. Geçitte Kadim gözcüsünün verdiği kısayol. \"Bunu yutarsam S olurmuşum,\" diyor. \"Senin şu ışığın gibi bir şey bende de olur yani. Hâlâ yutmadım. Neden yutmadım, onu da bilmiyorum.\"", en: "He pulls something wrapped in a scrap of cloth out of his pocket. A gray, smooth core the size of a walnut. The shortcut the Ancient scout gave him at the gate. \"Swallow this and I'm S-Grade, supposedly,\" he says. \"I'd get something like that light of yours. Still haven't swallowed it. Don't know why I haven't, either.\"" }
            kosul: { bayrak: "aras_kadim_teklifini_aldi" }
          - metin: { tr: "\"Kadim'in kısayolunu geri çevirmiştim,\" diyor. \"Şimdi sana bakıyorum da... aptallık mı ettim, bilmiyorum.\"", en: "\"I turned down the Ancient's shortcut,\" he says. \"Now I look at you and... I don't know if I was an idiot.\"" }
            kosul: { bayrak: "aras_kadim_teklifi_reddedildi" }
          - metin: { tr: "\"Ebedi rakip, demiştik,\" diye ekliyor, sırıtmadan. \"Sen yol oluyorsun, ben hâlâ merdiven çıkıyorum. Rakiplik böyle olmaz.\"", en: "\"Eternal rivals, we said,\" he adds, not grinning. \"You're turning into a Path and I'm still climbing stairs. That's not how rivalry works.\"" }
            kosul: { bayrak: "aras_ebedi_rakip" }
        sezgiler:
          - kosul: { stat: { cha: 220 } }
            metin: { tr: "Kıskançlık değil sesindeki. Korku. Seni geride bırakmaktan değil, senin onu geride bırakmandan.", en: "That isn't jealousy in his voice. It's fear. Not of leaving you behind. Of you leaving him behind." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "soruyu doğru sordu. acıyor mu. kimse sormadı bunu. ben bile.", en: "he asked the right question. does it hurt. nobody's asked that. not even me." }
        secenekler:
          - id: "durust"
            etiket: { tr: "\"Acıyor. Ama benim acım.\"", en: "\"It hurts. But it's mine.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 3, saygi: 2 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl12_kd_kamp_aras", agirlik: 20 }
              - bayrak: "bl12_kamp_aras_durust"
            sonraki: "bl12_kd_kamp_aras_durust"
          - id: "yaris"
            etiket: { tr: "\"Yut onu. Yukarıda yarışalım.\"", en: "\"Swallow it. We'll race up top.\"" }
            goster: { bayrak: "aras_kadim_teklifini_aldi" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 2, baglilik: 2 } }
              - ahlak: { insanlik: -1 }
              - bayrak: "bl12_kamp_aras_yaris"
            sonraki: "bl12_kd_kamp_aras_yaris"
          - id: "ates"
            etiket: { tr: "\"At onu ateşe.\"", en: "\"Throw it in the fire.\"" }
            goster: { bayrak: "aras_kadim_teklifini_aldi" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2, saygi: -1 } }
              - ahlak: { insanlik: 1 }
              - bayrak: "bl12_kamp_aras_ates"
            sonraki: "bl12_kd_kamp_aras_ates"
          - id: "merdiven"
            etiket: { tr: "\"Sende ışık yok ama tırmanış var. O bende yok.\"", en: "\"You don't have the light. You have the climb. I don't.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl12_kd_kamp_aras", agirlik: 20 }
            sonraki: "bl12_kd_kamp_aras_merdiven"
          - id: "uyu"
            etiket: { tr: "Cevap verme; sırtını dön, uyu", en: "Don't answer. Roll over and sleep" }
            etkiler:
              - iliski: { aras_kurt: { guven: -2 } }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_aras_durust"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} bileği taşını bırakıp ateşe bakıyor. \"İyi,\" diyor. \"Acımasaydı sana güvenmezdim.\" Bir süre sonra kılıcını yanına koyup sırtüstü uzanıyor, Kule'nin karanlık tepesine bakarak.", en: "{npc:aras_kurt} sets the whetstone down and looks into the fire. \"Good,\" he says. \"If it didn't hurt, I wouldn't trust you.\" After a while he lays his sword beside him and stretches out on his back, staring up at the dark top of the Spire." }
          - { tr: "\"Bir gün ben de bir şeye dönüşürsem,\" diyor, sana bakmadan, \"acıyor mu diye sen sor. Başka kimse sormaz.\"", en: "\"If I ever turn into something,\" he says, not looking at you, \"you ask me if it hurts. Nobody else will.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Sorarım.\"", en: "\"I'll ask.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 2 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Ateşe bir sandık tahtası daha at", en: "Toss another crate slat on the fire" }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_aras_yaris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} çekirdeği avucunda tartıyor, sonra gülüyor; uzun zamandır ondan duymadığın türden bir gülüş. \"Yut diyorsun ha. Senden başka kimse demezdi.\"", en: "{npc:aras_kurt} weighs the core in his palm, then laughs, the kind of laugh you haven't heard from him in a long time. \"Swallow it, you say. Nobody but you would say that.\"" }
          - { tr: "Çekirdeği yeniden beze sarıp cebine koyuyor. \"Bu gece değil,\" diyor. \"Ama yarış teklifini kaydettim. Kule'nin tepesinde. Unutma.\"", en: "He wraps the core back up and pockets it. \"Not tonight,\" he says. \"But I'm logging that challenge. Top of the Spire. Don't forget.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Unutmam.\"", en: "\"I won't.\"" }
            sonraki: "@akis"
          - id: "takil"
            etiket: { tr: "\"Korktun mu yoksa?\"", en: "\"What, scared?\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_aras_ates"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} çekirdeği ateşin üstünde tutuyor. Alevler grinin yüzeyinde yansıyor ama çekirdek ısınmıyor bile. Uzun süre öyle bekliyor.", en: "{npc:aras_kurt} holds the core out over the fire. The flames reflect off its gray surface, but it doesn't even get warm. He holds it there a long time." }
          - { tr: "Sonra elini geri çekiyor. \"Yapamadım,\" diyor, bezi yeniden sararken. \"Ama söylediğin için sağ ol. Birinin söylemesi gerekiyordu.\"", en: "Then he pulls his hand back. \"Can't do it,\" he says, wrapping the cloth around it again. \"But thanks for saying it. Somebody had to.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Başınla onayla", en: "Nod" }
            sonraki: "@akis"
          - id: "israr"
            etiket: { tr: "\"Bir dahakine ben atarım.\"", en: "\"Next time I'll throw it in myself.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 1 } }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_aras_merdiven"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} sana uzun uzun bakıyor, alay edip etmediğini anlamaya çalışarak. Etmediğini görünce bileği taşını bir kenara bırakıyor.", en: "{npc:aras_kurt} gives you a long look, trying to tell if you're making fun of him. When he sees you aren't, he puts the whetstone aside." }
          - { tr: "\"Otuz kat,\" diyor. \"Her basamağı ben çıktım. Kimse bana bir şey vermedi.\" Ateşin ışığında yüzü bir an çocukluğundaki gibi duruyor. \"Doğru. Bu benim.\"", en: "\"Thirty floors,\" he says. \"I climbed every step. Nobody handed me anything.\" In the firelight his face looks like a kid's for a second. \"You're right. That's mine.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşi canlandır", en: "Stoke the fire" }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "\"İyi geceler, rakip.\"", en: "\"Night, rival.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 1 } }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · KULE DİBİ · ELİF
  - id: "bl12_kd_kamp_elif"
    kamp: true
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12, yoldas: "elif_sari" }
    etiketler: ["kamp", "npc", "yoldas"]
    gerilim: 1
    npc: ["elif_sari"]
    kart: { tr: "İki nabız", en: "Two Pulses" }
    sahne: "bl12_kd_kamp_elif_1"
    sahneler:
      - id: "bl12_kd_kamp_elif_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|e} yakın, çökmüş bir üst geçidin altında kamp kurmuşsunuz. {npc:elif_sari} ateşin başında bileğini tutuyor, gözünü saatinden ayırmadan sayıyor. Bir kez sayıyor, sonra bir kez daha.", en: "You've made camp under a collapsed overpass near {yer:kule_dibi}. By the fire, {npc:elif_sari} is holding your wrist, counting, eyes on her watch. She counts once, then again." }
          - { tr: "\"İki nabız,\" diyor sonunda. \"Biri seninki. Öbürü onun yarım saniye gerisinden geliyor, yetişmeye çalışıyor gibi. Bunu tıp kitabında okumadım.\" Cebinden küçük, köşeleri kıvrılmış bir defter çıkarıyor.", en: "\"Two pulses,\" she says at last. \"One's yours. The other comes in half a second behind, like it's trying to catch up. That's not in any medical textbook I ever read.\" She pulls a small, dog-eared notebook out of her pocket." }
          - metin: { tr: "Demir Gece'den beri Gümrük'teki revirin kapısında kurşun delikleri var. {npc:elif_sari} bu gece de neşteri yastığının altına koyacak; bunu sana söylemiyor ama sen biliyorsun.", en: "Since Iron Night, there have been bullet holes in the door of the Customs House aid station. {npc:elif_sari} will sleep with a scalpel under her pillow again tonight. She doesn't tell you, but you know." }
            kosul: { bayrak: "elif_darbe_yasandi" }
          - metin: { tr: "Gözlerinin altı mor. Son haftalarda {fraksiyon:lonca|in} adamları revirin önünden fazla sık geçiyor; {npc:elif_sari} de uyumuyor.", en: "There are dark circles under her eyes. The last few weeks, the {fraksiyon:lonca|pos} men have been walking past the aid station a little too often, and {npc:elif_sari} hasn't been sleeping." }
            kosul: { bayrak_yok: "elif_darbe_yasandi" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Defteri tutarken eli titremiyor ama kalemi kâğıda bastırıyor; sayfanın arkasına iz çıkıyor. Seni kaybetmekten korktuğunu yazıyla tutuyor.", en: "Her hand isn't shaking, but she presses so hard the pen shows through on the back of the page. She's putting her fear of losing you down in ink." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yarım saniye geriden gelen benim. yetişmeye çalışıyorum. hep çalıştım.", en: "the one half a second behind is me. trying to catch up. always have been." }
        secenekler:
          - id: "defter"
            etiket: { tr: "Defterine her şeyi yazmasına izin ver", en: "Let her write everything down in her notebook" }
            etkiler:
              - iliski: { elif_sari: { guven: 3, saygi: 1 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl12_kd_kamp_elif", agirlik: 20 }
              - bayrak: "bl12_kamp_elif_dosya"
            sonraki: "bl12_kd_kamp_elif_defter"
          - id: "uyku"
            etiket: { tr: "\"En son ne zaman uyudun, doktor?\"", en: "\"When's the last time you slept, Doc?\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 3 } }
            sonraki: "bl12_kd_kamp_elif_uyku"
          - id: "konsey"
            etiket: { tr: "\"Konsey'de neler oluyor, anlat.\"", en: "\"Tell me what's going on with the Council.\"" }
            etkiler:
              - iliski: { elif_sari: { saygi: 2, guven: 1 } }
            sonraki: "bl12_kd_kamp_elif_konsey"
          - id: "omuz"
            etiket: { tr: "Yanına geç; omzunu ver", en: "Move over beside her. Offer your shoulder" }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl12_kd_kamp_elif", agirlik: 25 }
            sonraki: "bl12_kd_kamp_elif_omuz"

      - id: "bl12_kd_kamp_elif_defter"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} yazıyor: tarih, saat, iki nabız, aralarındaki fark, göğüsteki ışığın rengi. Sonra kalemi bırakıp defteri kapatıyor.", en: "{npc:elif_sari} writes it all down. Date, time, two pulses, the gap between them, the color of the light in your chest. Then she puts down the pen and closes the notebook." }
          - { tr: "\"Bir gün biri seni anlamak isterse,\" diyor, \"elinde senden kalan bir şey olsun. Ne olursan ol, bu defterde insansın. Nabzın var, yaşın var, kan grubun var.\"", en: "\"If anybody ever wants to understand you someday,\" she says, \"they should have something of you to go on. Whatever you turn into, in this notebook you're a person. You've got a pulse, an age, a blood type.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Kan grubumu ben bile bilmiyordum.\"", en: "\"I didn't even know my blood type.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Ateşe bakıp sus", en: "Look into the fire and say nothing" }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_elif_uyku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} bir an durup gülüyor, yorgun bir gülüş. \"Dürüst cevap mı istiyorsun, doktor cevabı mı?\" Parmaklarıyla sayıyor, üçte bırakıyor. \"Üç gün. Arada yarım saat, bir koltukta.\"", en: "{npc:elif_sari} pauses, then laughs, a tired laugh. \"You want the honest answer or the doctor answer?\" She counts on her fingers and stops at three. \"Three days. A half hour in a chair somewhere in there.\"" }
          - { tr: "Nöbet sende. {npc:elif_sari} itiraz etmeye kalkıyor, sonra vazgeçip montunu başının altına yastık yapıyor. Beş dakika geçmeden uyuyor; uykusunda bile elini çantasının üstünden çekmiyor.", en: "You take the watch. {npc:elif_sari} starts to argue, then gives up and balls her jacket under her head for a pillow. She's out in under five minutes. Even asleep, she keeps a hand on her bag." }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Sabaha kadar nöbet tut", en: "Keep watch until morning" }
            sonraki: "@akis"
          - id: "ortu"
            etiket: { tr: "Üstüne bir battaniye ört", en: "Put a blanket over her" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_elif_konsey"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} bir süre ateşi karıştırıyor. \"Konsey bir hasta gibi,\" diyor sonunda. \"Yatağa bağlı, dışarıdan iyi görünüyor, içeride ateşi kırk. Herkes başında bekliyor; kimi iyileşsin diye, kimi ölsün diye.\"", en: "{npc:elif_sari} pokes at the fire for a while. \"The Council's like a patient,\" she says finally. \"Stuck in bed, looks fine from the outside, running a hundred and four on the inside. Everybody's standing around the bed. Some want it to get better. Some want it to die.\"" }
          - { tr: "Sesini alçaltıyor. \"Bir şey olursa revirdeki ilaçları kimseye vermem. Kimseye. Bunu bil yeter.\"", en: "She lowers her voice. \"If something happens, I'm not handing the aid-station meds over to anybody. Anybody. That's all you need to know.\"" }
        secenekler:
          - id: "yanindayim"
            etiket: { tr: "\"Bir şey olursa yanında olurum.\"", en: "\"If something happens, I'll be there.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: 2 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Başınla onayla", en: "Nod" }
            sonraki: "@akis"

      - id: "bl12_kd_kamp_elif_omuz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yanına geçip oturuyorsun. {npc:elif_sari|den} tek söz yok; defteri dizinin üstüne bırakıp başını omzuna yaslıyor. Senin göğsünden vuran ışık saçlarının üstünde.", en: "You move over and sit down beside her. {npc:elif_sari} doesn't say anything. She sets the notebook on her knee and leans her head on your shoulder. The light from your chest falls across her hair." }
          - { tr: "\"Sıcak,\" diyor, gözleri kapalı. \"Işığın. Hiç düşünmemiştim sıcak olabileceğini.\" Bir saat öyle kalıyorsunuz, Gümrük'ün çatısındaki o geceki gibi. Hiçbiriniz adını koymuyor.", en: "\"It's warm,\" she says, eyes closed. \"Your light. I never thought it might be warm.\" You stay like that for an hour, like that night on the Customs House roof. Neither of you puts a name to it." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Kımıldama", en: "Don't move" }
            sonraki: "@akis"
          - id: "fisilda"
            etiket: { tr: "\"Uyu biraz.\"", en: "\"Get some sleep.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 1 } }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · TEPE · DENİZ
  - id: "bl12_tp_kamp_deniz"
    kamp: true
    konum: ["tepe"]
    perde: [3]
    gun: { min: 231, max: 260 }
    kosul: { bolum: 12, yoldas: "deniz_arman" }
    etiketler: ["kamp", "npc", "yoldas"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Tepede yıldızlar", en: "Stars Over the Ridge" }
    sahne: "bl12_tp_kamp_deniz_1"
    sahneler:
      - id: "bl12_tp_kamp_deniz_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} sırtında, elektriği bir daha gelmemiş bir mahallenin üstünde kamp kurmuşsunuz. Burası karanlık; o kadar karanlık ki yıldızlar Öğretici'den beri ilk kez bu kadar çok.", en: "You've made camp on the ridge of {yer:tepe}, above a neighborhood where the power never came back. It's dark up here. So dark there are more stars than you've seen since the Tutorial." }
          - { tr: "{npc:deniz_arman} sırtüstü uzanmış, ellerini başının altına koymuş. \"Aşağıda, limanda bunlar görünmüyor,\" diyor. \"Senin ışığından.\" Bir süre susuyor. \"Sence yukarıda biri var mı? Sistem değil. Biri.\"", en: "{npc:deniz_arman} is lying on their back, hands behind their head. \"You can't see these from {yer:kiyikent_liman},\" {npc:deniz_arman} says. \"Because of your light.\" A long pause. \"You think there's anybody up there? Not the System. Somebody.\"" }
          - metin: { tr: "\"Burada dua ederdim,\" diyor {npc:deniz_arman}, sesini alçaltarak. \"{fraksiyon:yukselenler|le} olduğum zaman. Her gece, şu çıkıntıda. Kimseye söylemedim.\"", en: "\"I used to pray up here,\" {npc:deniz_arman} says, voice low. \"Back when I was with {fraksiyon:yukselenler|k}. Every night, on that ledge right there. Never told anybody.\"" }
            kosul: { herhangi: [{ bayrak: "deniz_tepede_kaldi" }, { bayrak: "deniz_yukselenlere_gitti" }] }
          - metin: { tr: "\"Kardeşim şimdi aşağıda uyuyordur,\" diye ekliyor. \"Ağzı açık, bir bacağı yataktan sarkık. Hep öyle uyur.\"", en: "\"My sister's probably asleep down there right now,\" {npc:deniz_arman} adds. \"Mouth open, one leg hanging off the bed. Always sleeps like that.\"" }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "{npc:deniz_arman} parmağıyla bir yıldızı gösteriyor, sonra elini indiriyor. Kimi düşündüğünü sormana gerek yok.", en: "{npc:deniz_arman} points at a star, then lets the hand drop. You don't need to ask who's on their mind." }
            kosul: { bayrak: "kardes_olu_bulundu" }
          - { tr: "Uzakta, tepenin öbür yanında {fraksiyon:yukselenler|in} mumları titreşiyor.", en: "Far off, on the other side of the hill, {fraksiyon:yukselenler|k|pos} candles are flickering." }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Soruyu sana değil, kendine soruyor. Senden bir cevap değil, yanında kalmanı istiyor.", en: "That question isn't for you. It's for {npc:deniz_arman}. What's wanted isn't an answer. It's for you to stay." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yukarıda biri var mı. ben yukarıdan geldim. orada kimse yoktu. ama bunu ona söyleme.", en: "is anybody up there. i came from up there. there was nobody. but don't tell them that." }
        secenekler:
          - id: "sen"
            etiket: { tr: "\"Bilmiyorum. Ama sen buradasın.\"", en: "\"I don't know. But you're here.\"" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 3, guven: 2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl12_tp_kamp_deniz", agirlik: 20 }
              - bayrak: "bl12_kamp_deniz_sen"
            sonraki: "bl12_tp_kamp_deniz_sen"
          - id: "yok"
            etiket: { tr: "\"Biri varsa bile bize bakmıyor.\"", en: "\"If there is, they're not looking at us.\"" }
            etkiler:
              - iliski: { deniz_arman: { saygi: 2, guven: 1 } }
            sonraki: "bl12_tp_kamp_deniz_yok"
          - id: "yildiz"
            etiket: { tr: "O yıldıza {npc:deniz_arman|in} kardeşinin adını ver", en: "Name that star after {npc:deniz_arman|pos} sister" }
            goster: { bayrak: "kardes_olu_bulundu" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 4, guven: 2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl12_tp_kamp_deniz", agirlik: 25 }
              - ahlak: { insanlik: 1 }
              - bayrak: "bl12_kamp_deniz_yildiz"
            sonraki: "bl12_tp_kamp_deniz_yildiz"
          - id: "say"
            etiket: { tr: "Bir şey deme; birlikte yıldız sayın", en: "Don't say anything. Count stars together" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "bl12_tp_kamp_deniz_say"

      - id: "bl12_tp_kamp_deniz_sen"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} başını çevirip sana bakıyor, yüzü senin göğsünden vuran ışıkla aydınlanmış. \"Bu ucuz bir cevaptı,\" diyor. Ama gülümsüyor.", en: "{npc:deniz_arman} turns to look at you, the light from your chest falling across their face. \"That was a cheap answer,\" {npc:deniz_arman} says. But there's a smile there." }
          - { tr: "\"Yine de alıyorum. Ucuz cevapları severim. Pahalıları hep yalan çıktı.\"", en: "\"I'll take it, though. I like cheap answers. The expensive ones always turned out to be lies.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül", en: "Laugh" }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "Ateşi küllere göm, uyu", en: "Bank the fire and go to sleep" }
            sonraki: "@akis"

      - id: "bl12_tp_kamp_deniz_yok"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre düşünüyor. \"Olabilir,\" diyor. \"O zaman birbirimize bakarız. Daha az yorucu, en azından cevap veriyorsun.\"", en: "{npc:deniz_arman} thinks about that for a while. \"Could be,\" {npc:deniz_arman} says. \"Then we just keep an eye on each other. Less exhausting. At least you answer back.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Her zaman.\"", en: "\"Always.\"" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "Ateşi küllere göm, uyu", en: "Bank the fire and go to sleep" }
            sonraki: "@akis"

      - id: "bl12_tp_kamp_deniz_yildiz"
        yer: "tepe"
        paragraflar:
          - { tr: "Parmağını kaldırıp {npc:deniz_arman|in} gösterdiği yıldızı buluyorsun, kız kardeşinin adını yüksek sesle söylüyorsun. {npc:deniz_arman} uzun süre hiçbir şey demiyor.", en: "You raise your finger, find the star {npc:deniz_arman} pointed to, and say {npc:deniz_arman|pos} sister's name out loud. {npc:deniz_arman} doesn't say anything for a long time." }
          - { tr: "Sonra, çok sessizce: \"O hep en parlağı isterdi. Bu en parlağı değil.\" Bir nefes. \"Ama en inatçısı. Bak, hiç kırpışmıyor.\"", en: "Then, very quietly: \"She always wanted the brightest one. That's not the brightest one.\" A breath. \"But it's the most stubborn. Look. It doesn't even twinkle.\"" }
        secenekler:
          - id: "bak"
            etiket: { tr: "Yıldıza birlikte bakın", en: "Look at the star together" }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Elini {npc:deniz_arman|in} elinin üstüne koy", en: "Rest your hand on top of {npc:deniz_arman|pos} hand" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 1 } }
            sonraki: "@akis"

      - id: "bl12_tp_kamp_deniz_say"
        yer: "tepe"
        paragraflar:
          - { tr: "Sayıyorsunuz. Yüze geldiğinizde {npc:deniz_arman} şaşırıyor, iki yüzde gülmeye başlıyor, üç yüz kırk yedide uyuyakalıyor.", en: "You count. When you hit a hundred, {npc:deniz_arman} is surprised. At two hundred, the laughing starts. Somewhere around three hundred forty-seven, {npc:deniz_arman} falls asleep." }
          - { tr: "Sen saymaya devam ediyorsun. Göğsündeki ışık yıldızların yarısını siliyor; kalanları tek başına sayıyorsun.", en: "You keep counting. The light in your chest washes out half the stars, so you count the rest alone." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sabaha kadar say", en: "Count until morning" }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "Sen de uyu", en: "Get some sleep too" }
            sonraki: "@akis"
