# Parti B2 — Demir Lonca zinciri + Kaya Demir'in yayı (docs/PERDE2_4.md "Parti B2").
# Zincir (zincir_lonca): lonca_1_kapi_temizligi (P2) → lonca_2_rutbe (P2) → lonca_3_rakip_bastirma (P3) → lonca_4_demir_yasa (P3)
#   → lonca_5_taht (P4, AY 346; lonca_hakimiyeti + gorev zincir_lonca tamam).
# Kaya yayı: kaya_lonca_teklifi (P2) → kaya_sert_ders (P2) → kaya_darbe_gecesi (P3, AY 292; kaya_devrildi / darbe hazırlığı)
#   → kaya_son_savas_generali (P4, AY 337; kaya_general).
# Kaya'nın kaderleri: akıl hocası (kaya_akil_hocasi, lonca_kayaya_birakildi) · devrilen diktatör (kaya_devrildi: darbe gecesinde,
#   generallik sahnesinde ya da tahtta) · son savaşın generali (kaya_general).
# Lonca rütbesi değişkeni: lonca_rutbe (0 Destek · 1 Avcı · 2 Çavuş · 3 Komutan Yardımcısı · 4 Komutan).
# Yan karakterlere isim verilmez; lakap kullanılır: Örs (EN Anvil), Defterdar (EN the Ledger), Liman Reisi (EN the Harbormaster).
olaylar:
  # ================================================================== KAYA — LONCA TEKLİFİ (P2)
  - id: "kaya_lonca_teklifi"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 33, max: 80 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 9
    etiketler: ["lonca", "npc", "karsilasma", "sanayi"]
    gerilim: 2
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Haddehanedeki masa", en: "The table in the rolling mill" }
    sahne: "kaya_lonca_teklifi_1"
    sahneler:
      - id: "kaya_lonca_teklifi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kolunda turuncu yama olan bir koşucu çıkageliyor. Seni nereden bulduğunu sormana fırsat vermeden \"Başçavuş bekliyor\" deyip önüne düşüyor. Yarım saat geçmeden {yer:sanayi|in} kızgın çelik kokan sokaklarındasın.", en: "A runner with an orange patch on his sleeve finds you. Before you can ask how he knew where you'd be, he says, \"Gunny's waiting,\" and starts walking. Half an hour later you're in the streets of {yer:sanayi}, where everything smells like hot steel." }
          - { tr: "Eski haddehane artık bir kale: kapılarına tersaneden sökülen sac levhalar kaynatılmış, çatıya projektörler ve kum torbalı nöbet yerleri kurulmuş. İçeride, vinçlerin altında yüzlerce insan çalışıyor; hepsinin kolunda aynı turuncu yama.", en: "The old rolling mill is a fortress now: steel plate cut off the shipyard welded over its doors, searchlights and sandbagged posts up on the roof. Inside, hundreds of people work under the gantry cranes, and every one of them wears the same orange patch." }
          - { tr: "Haddehanenin ortasına, bir geminin ambar kapağından yapılma bir masa kurulmuş. Arkasında kır saçları hâlâ kısacık, sırtı hâlâ bayrak direği gibi dimdik bir adam haritanın üstüne eğilmiş.", en: "In the middle of the mill sits a table made from a ship's hatch cover. Behind it, gray hair still buzzed short, spine still straight as a flagpole, a man is bent over a map." }
          - metin: { tr: "{npc:kaya_demir} başını kaldırıp seni görünce bir kez, kısaca başını sallıyor. \"İkinci adamım,\" diyor. \"Yerin hâlâ boş. Kimseyi oturtmadım.\"", en: "{npc:kaya_demir} looks up, and when he sees you, gives one nod. \"My number two,\" he says. \"Your spot's still open. I never filled it.\"" }
            kosul: { bayrak: "lonca_ikinci_adam" }
          - metin: { tr: "{npc:kaya_demir} başını kaldırdığı anda muhafızlarından ikisi, sanki sen görmeyecekmişsin gibi, ellerini usulca silahlarına götürüyor. \"Rahat,\" diyor onlara. \"Son karşılaşmamızda kampımı elimden aldı. Bugün alamayacak.\"", en: "{npc:kaya_demir} looks up, and two of his guards drift their hands to their weapons like you won't notice. \"At ease,\" he tells them. \"Last time we met, this one took my camp out from under me. Not happening today.\"" }
            kosul: { bayrak: "lonca_komutasi_alindi" }
          - metin: { tr: "\"Bir kere bandımı geri verdin,\" diyor {npc:kaya_demir}, gözünü haritadan ayırmadan. \"Bir daha soruyorum. Üçüncüsü yok.\"", en: "\"You handed my tape back once,\" {npc:kaya_demir} says, without looking up from the map. \"I'm asking again. I don't ask three times.\"" }
            kosul: { hafiza: { kaya_demir: "rutbeyi_reddetti" } }
          - metin: { tr: "Adam doğrulup elini uzatmadan konuşuyor: \"{npc:kaya_demir|tam}. {fraksiyon:lonca}. Adını duydum, duymayan kalmadı. Önce pencerene bakacağım, sonra konuşuruz.\"", en: "The man straightens up and talks without offering a hand. \"{npc:kaya_demir|tam}. {fraksiyon:lonca}. I've heard your name. Everybody has. Now I'm going to look at your window, and then we'll talk.\"" }
            kosul: { degisken_max: { kaya_tanidik: 0 } }
          - { tr: "Pencerene yalnızca bir kez bakıyor, tıpkı o rampadaki gibi. Ardından masaya kenarı çelik telle örülmüş turuncu bir yama bırakıyor. \"Çavuş. İlk günden. Kendi mangan olur, kapı sözleşmelerinde ilk seçim senin.\"", en: "He looks at your window exactly once. Then he sets an orange patch on the table, its edge stitched with steel wire. \"Sergeant. Day one. Your own squad and first pick on every Gate contract.\"" }
          - metin: { tr: "\"Doktorun konseyine yazılmışsın, duydum,\" diye ekliyor. \"Umurumda değil. Güç parti kartı değildir; nereye gitse orada iş görür.\"", en: "\"Heard you signed up with the doctor's council,\" he adds. \"Don't care. Strength isn't a party card. It works wherever it goes.\"" }
            kosul: { bayrak: "uye_siginak" }
          - metin: { tr: "\"Fraksiyon günü bizi seçtin,\" diyor. \"Güzel. Şimdi de seçtiğin tarafta sana gerçek bir yer açalım.\"", en: "\"You picked us on faction day,\" he says. \"Good. Now let's give you an actual place inside what you picked.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Penceresindeki rakam yine gerçek; bu şehirde rakamını hâlâ şişirmeyen tek güçlü adam o. Ama her adımda sağ dizine biraz daha az yükleniyor. Eski yara ilerliyor.", en: "The number in his window is real again. Still the only strong man in this city who doesn't pad it. But he's putting a little less weight on his right knee with every step. The old wound's getting worse." }
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Masadaki haritada {yer:kasaba_cekirdegi} kırmızı kalemle daire içine alınmış. Yanına küçük, düzgün harflerle tek bir sözcük yazılmış: 'Sonra.'", en: "On the map, {yer:kasaba_cekirdegi} is circled in red. Next to it, in small neat handwriting: 'Later.'" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷ama büyümüş, tasma da. ama bak, sana çavuşluk veriyor, kendine istediğini değil. bu adam seni neye harcayacağını çoktan hesaplamış.", en: "t̷he tape grew up. so did the leash. but look, he's offering you sergeant, not what he wants for himself. this man already worked out what he's going to spend you on." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Burası düzenli. Fazla düzenli. Kollarına bak: herkeste aynı yama, kimsenin yüzü gülmüyor.\"", en: "\"It's organized in here. Too organized. Look at their sleeves. Same patch on everybody, and nobody's smiling.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Revirine bak, Konsey'inkinden iyi donanımlı. Bunu yüksek sesle söylediğimi sakın kimseye anlatma.\"", en: "\"Check out his infirmary. Better stocked than the Council's. Don't tell anybody I said that out loud.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Duvardaki şu pano... sıralama bu. Kendi Küresel Sıralama'sını kurmuş adam. Kafası tam veritabanı, söylemiştim.\"", en: "\"That board on the wall is a leaderboard. He built his own Global Ranking. The guy's head is a database, I told you.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Yamayı al, koluna dik", en: "Take the patch and sew it on" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 2 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 5 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 4, baglilik: 6, guven: 3 } }
              - esya: { turuncu_yama: 1 }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "{npc:kaya_demir|in} verdiği turuncu yamayı koluna diktin. Lonca'nın merdiveninde ilk basamağın buydu.", en: "You sewed {npc:kaya_demir|pos} orange patch onto your sleeve. It was the first rung on the Guild's ladder." }
            sonraki: "kaya_lonca_teklifi_pano"
          - id: "sozlesme"
            etiket: { tr: "\"Rütbe istemem. Sözleşme yapalım; kapı başına ödersin.\"", en: "\"Not rank. A contract. Pay me per Gate.\"" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "kaya_teklifi_sozlesme"
              - ahlak: { duzen: -2, insanlik: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 5, guven: -2 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "{npc:kaya_demir|e} rütbe yerine fiyatını söyledin. Lonca da seni defterine asker olarak değil, kiralık silah olarak yazdı.", en: "You named {npc:kaya_demir} a price instead of taking a rank. The Guild wrote you into its ledger as a hired gun, not a soldier." }
            sonraki: "kaya_lonca_teklifi_sozlesme"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni sonuna kadar aç, rütbeyi o biçsin", en: "Open your window all the way. Let him pick the rank" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - aciga_vur: true
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 12 }
              - iliski: { kaya_demir: { saygi: 12, korku: 6 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 35, max: 55 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "Haddehanenin ortasında gerçek pencereni açtın. Lonca'nın merdivenine o gün alttan değil, tepeden baktın.", en: "You opened your real window in the middle of the rolling mill. That day you met the Guild's ladder from the top, not the bottom." }
            sonraki: "kaya_lonca_teklifi_acik"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Seviyeni düşük göster, sıradan bir avcı ol", en: "Play your level down. Be a regular hunter" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "lonca_hafife_aldi"
              - gizle: 4
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: -3 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "Lonca'ya sıradan bir avcı kılığında girdin. Çavuşları sana tepeden baktı; sen sesini çıkarmadın.", en: "You walked into the Guild as an ordinary hunter. Its sergeants looked down on you, and you let them." }
            sonraki: "kaya_lonca_teklifi_gizli"
          - id: "konsey_hatti"
            etiket: { tr: "Konsey'le ortak bir savunma hattı öner", en: "Propose a joint defense line with the Council" }
            goster: { bayrak: ["kaya_elif_koprusu"] }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "lonca_siginak_hatti"
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { lonca: 3, siginak: 5 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 }, elif_sari: { saygi: 4 } }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 5, max: 10 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "{npc:kaya_demir|in} masasında Konsey'le ortak bir hat kurulmasını savundun. {yer:sanayi} ile {yer:kiyikent_liman} arasındaki sınır o gün biraz inceldi.", en: "At {npc:kaya_demir|pos} table you argued for a joint line with the Council. The border between {yer:sanayi} and {yer:kiyikent_liman} got a little thinner that day." }
            sonraki: "kaya_lonca_teklifi_pano"
          - id: "reddet"
            etiket: { tr: "\"Ben kimsenin askeri değilim.\"", en: "\"I'm nobody's soldier.\"" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - ahlak: { duzen: -4, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 30 }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 45, max: 65 }, kosul: { npc_hayatta: "kaya_demir" }, hatirlatma: { tr: "Haddehanedeki masada {npc:kaya_demir|le} konuştuklarınız aklında.", en: "You still remember what you and {npc:kaya_demir} said at that table in the rolling mill." } }
            kronik: { tr: "Yamayı {npc:kaya_demir|in} masasında, durduğu yerde bıraktın. O gün seni asker hanesine değil, hesaba katılacak kuvvetler hanesine yazdı.", en: "You left {npc:kaya_demir|pos} patch on the table. That day he stopped thinking of you as a soldier and started thinking of you as a force to plan around." }
            sonraki: "kaya_lonca_teklifi_red"

      - id: "kaya_lonca_teklifi_pano"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} seni haddehanenin doğu duvarına götürüyor. Duvarı baştan başa eski bir gemi bordasından kesilmiş çelik bir levha kaplıyor: Pano. Üstüne tebeşirle yüzlerce isim yazılmış, her birinin yanında bir sayı var.", en: "{npc:kaya_demir} walks you over to the east wall of the mill. The whole wall is a single steel plate cut from an old ship's side: the Board. Hundreds of names are chalked on it, each one with a number next to it." }
          - { tr: "\"Katkı,\" diyor. \"Kapattığın kapı, indirdiğin canavar, nöbette geçirdiğin saat. Tayın da rütbe de bu sayıya göre verilir. Kimseye babasının kim olduğu sorulmaz.\"", en: "\"Contribution,\" he says. \"Gates closed, monsters dropped, hours on watch. Rations go out by this number. Rank goes out by this number. Nobody gets asked who their daddy is.\"" }
          - { tr: "Pano'nun en altında ayrı bir sütun var: DESTEK. Hepsinin en uzunu bu. Buradaki isimlerin yanında sayı yok, yalnızca küçük birer nokta konmuş.", en: "At the very bottom of the Board there's a separate column: SUPPORT. It's the longest one. The names there don't have numbers next to them, just small dots." }
          - metin: { tr: "Sütunların adı değişmiş ama kendileri aynı kalmış. Rampadaki listeyi hatırlıyorsun: ÇEKİRDEK, YÜK, AĞIZ.", en: "The columns got new names. The columns themselves didn't change. You remember the list from the loading dock: CORE, LOAD, MOUTHS." }
            kosul: { bilgi: "kaya_listesi" }
          - metin: { tr: "Destek sütununun başına elle küçük bir not düşülmüş: 'Çocuklar ve yaşlılar tam tayın.' {npc:kaya_demir} notu okuduğunu görüyor. Tek söylediği şu: \"Sözümü tutarım.\"", en: "At the head of the Support column there's a small handwritten note: 'Kids and elderly: full rations.' {npc:kaya_demir} sees you notice it. \"I keep my word,\" is all he says." }
            kosul: { bayrak: "lonca_muafiyet" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Destek sütunundaki bazı noktaların yanına ince birer çarpı atılmış. Tebeşir taze; bu hafta çizilmişler.", en: "Some of the dots in the Support column have a thin X next to them. Fresh chalk. Somebody added those this week." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ayılar. sistem de seni sayılarla ölçüyor. bu adamınki yalnızca kendi kurduğu bir sistem: daha dürüst, daha küçük.", en: "n̷umbers. the system measures you in numbers too. this man just built his own system. more honest. smaller." }
        secenekler:
          - id: "en_uste"
            tur: "gosteris"
            etiket: { tr: "Adını Pano'nun en üstüne yazdır", en: "Have your name chalked at the very top" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - dikkat: 2
              - itibar: { lonca: 6 }
              - xp_seviye: 15
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
            kronik: { tr: "İlk gününde adını Pano'nun en tepesine yazdırdın. O tebeşiri silmek isteyen artık önce seni geçmek zorundaydı.", en: "On your first day you had your name put at the top of the Board. Anyone who wanted to wipe it would have to get past you first." }
            sonraki: "kaya_lonca_teklifi_en_ust"
          - id: "destek"
            etiket: { tr: "Destek sütununu ve çarpıları sor", en: "Ask about the Support column and the X's" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "{npc:kaya_demir|e} Destek sütununu ve çarpıları sordun; o da sana bir aritmetik dersi verdi.", en: "You asked {npc:kaya_demir} about the Support column and the X's. He answered like he was teaching arithmetic." }
            sonraki: "kaya_lonca_teklifi_destek"
          - id: "selam"
            etiket: { tr: "Başını salla, işe koyul", en: "Nod and get to work" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { guven: 3 } }
              - esya: { lonca_tayini: 2 }
            kronik: { tr: "Pano'ya bir kez bakıp işe koyuldun. Lonca'dakiler bunu soru sormamak diye değil, işini bilmek diye yorumladı.", en: "You looked at the Board once and got to work. In the Guild they read that as knowing the job, not as not asking questions." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_en_ust"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} bir an seni süzüyor, sonra Pano'nun yanındaki çivi kutusundan tebeşiri alıp uzatıyor. \"Kendin yaz,\" diyor. \"Yarın biri silerse yine kendin yazarsın.\"", en: "{npc:kaya_demir} looks at you for a second. Then he takes the chalk out of the nail box by the Board and holds it out. \"Write it yourself,\" he says. \"And if somebody wipes it tomorrow, you write it again yourself.\"" }
          - { tr: "Adını en üste, herkesin Örs diye çağırdığı iri yarı bir kaynakçının adının üstüne yazıyorsun. Haddehanenin gürültüsü bir anlığına kesiliyor; vinçler bile durmuş gibi.", en: "You write your name at the top, right above the name of a big welder everybody calls Anvil. The noise in the mill cuts out for a second. Even the cranes seem to stop." }
          - { tr: "Pano'nun dibinde Örs kollarını kavuşturmuş, seni izliyor. Yüzünde öfke yok; bir dikişin tutup tutmayacağını tartan bir kaynakçı nasıl bakarsa öyle bakıyor.", en: "At the foot of the Board, Anvil stands with his arms crossed, watching you. There's no anger on his face. It's the look a welder gets when he's deciding whether a seam's going to hold." }
        secenekler:
          - id: "ors_selam"
            etiket: { tr: "Örs'e başınla selam ver", en: "Give Anvil a nod" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Pano'nun tepesinden, adının üstüne yazdığın Örs'e başınla selam verdin.", en: "From the top of the Board you gave a nod to Anvil, the man whose name you'd just written over." }
            sonraki: "@akis"
          - id: "ors_bak"
            etiket: { tr: "Tebeşiri ona uzat: \"Silmek istersen buyur.\"", en: "Hold the chalk out to him. \"If you want to wipe it.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "Tebeşiri Örs'e uzatıp adını silmeye davet ettin; koca kaynakçı tebeşire elini bile sürmedi.", en: "You held the chalk out and dared Anvil to wipe your name. The big welder didn't even reach for it." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_destek"
        yer: "sanayi"
        paragraflar:
          - { tr: "\"Destek, katkısı sıfır olanlar,\" diyor {npc:kaya_demir}. \"Çalışamayan, çalışmak istemeyen, çalışmayı daha öğrenmemiş olan. Hepsi yer, hepsi uyur, hepsi korunur. Yarım tayınla.\"", en: "\"Support is everybody whose contribution is zero,\" {npc:kaya_demir} says. \"Can't work, won't work, hasn't learned how yet. All of them eat, all of them sleep, all of them get protected. On half rations.\"" }
          - { tr: "\"Çarpılar da kapı işine gönüllü yazılanlar. Kapıya giren Destek'li o hafta tam tayın alır.\" Bir an duraksıyor. \"Bazıları dönmüyor. Ama gönüllü olduklarını da unutma.\"", en: "\"The X's are the ones who volunteered for Gate work. Support who goes through a Gate gets full rations that week.\" He pauses. \"Some of them don't come back. Don't forget they volunteered.\"" }
          - { tr: "\"Buna acımasızlık denmez asker, aritmetik denir. Bir haftalık tam tayın bir aileyi bir hafta daha ayakta tutar. Ben onlara bir seçenek sunuyorum; şehrin geri kalanı onu bile sunmuyor.\"", en: "\"That's not cruelty, kid. That's arithmetic. A week of full rations keeps a family on its feet another week. I'm giving them a choice. The rest of this city isn't.\"" }
        secenekler:
          - id: "aritmetik"
            etiket: { tr: "\"Aritmetiğin doğru.\"", en: "\"Your math checks out.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, baglilik: 3 } }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "{npc:kaya_demir|in} aritmetiğine onay verdin. O gün Destek sütunundaki çarpılara senin imzan da karıştı.", en: "You signed off on {npc:kaya_demir|pos} arithmetic. From that day on, the X's in the Support column carried your name too." }
            sonraki: "@akis"
          - id: "mangama"
            etiket: { tr: "Destek'ten on kişiyi kendi mangana al", en: "Take ten people from Support into your squad" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 3, guven: -1 } }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "Destek sütunundan on kişiyi kendi mangana yazdırdın. Pano'da onların adlarının yanına ilk kez bir sayı düştü.", en: "You wrote ten people from the Support column into your own squad. For the first time, the Board put a number next to their names." }
            sonraki: "kaya_lonca_teklifi_manga"
          - id: "cocuklar"
            etiket: { tr: "\"Çocukları kapıya gönüllü yazdırmayacaksın.\"", en: "\"No kids volunteer for Gates. Ever.\"" }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 2, siginak: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 3 } }
              - bayrak: "lonca_muafiyet"
            kronik: { tr: "{npc:kaya_demir|e} bir kural daha yazdırdın: bundan böyle hiçbir çocuk kapıya gönüllü diye yazılmayacaktı.", en: "You got {npc:kaya_demir} to write one more rule: from now on, no kid would be signed up for a Gate as a 'volunteer.'" }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_manga"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} omuz silkiyor. \"Mangan senin, tayını senin,\" diyor. \"Kapıda ölürlerse benim defterime değil, seninkine yazılır.\"", en: "{npc:kaya_demir} shrugs. \"Your squad, your rations,\" he says. \"They die in a Gate, it goes in your ledger, not mine.\"" }
          - { tr: "On kişi önünde sıraya diziliyor: iki yaşlı kadın, kekeme bir lise öğrencisi, eski bir muhasebeci, ellerini nereye koyacağını bilemeyen bir aşçı... Hiçbiri teşekkür etmiyor; teşekkür etmeyi unuttukları belli.", en: "Ten people line up in front of you: two old women, a high school kid with a stutter, an ex-accountant, a cook who doesn't know what to do with his hands. None of them thanks you. It's obvious they've forgotten how." }
        secenekler:
          - id: "egit"
            etiket: { tr: "Onlara ilk talimi kendin ver", en: "Run their first drill yourself" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 10
            kronik: { tr: "Destek'ten aldığın on kişiye ilk talimi kendi ellerinle verdin; onlara yük gibi değil, manga gibi davrandın.", en: "You ran the first drill for the ten you pulled out of Support yourself, and treated them like a squad, not a load." }
            sonraki: "@akis"
          - id: "doyur"
            etiket: { tr: "Önce onları kendi tayınından doyur", en: "Feed them out of your own rations first" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - can: -20
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Mangana aldığın Destek'lileri önce kendi tayınından doyurdun. O akşam haddehanede ilk kez birinin güldüğü duyuldu.", en: "You fed the people you'd pulled out of Support from your own rations first. That night, somebody in the mill laughed for the first time." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_sozlesme"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir|in} yüzünde bir şey kıpırdıyor; hayal kırıklığı mı, saygı mı, kestiremiyorsun. \"Paralı asker,\" diyor. \"İyi paralı askerler tanıdım. Her birinin bir fiyatı vardı ve hepsi o fiyatı kuruşu kuruşuna bilirdi.\"", en: "Something moves on {npc:kaya_demir|pos} face. Maybe disappointment, maybe respect. \"A contractor,\" he says. \"I've known good contractors. Every one of them had a price, and every one of them knew it to the penny.\"" }
          - { tr: "\"Kapı başına kristal, tayın, bir de ganimetin üçte biri. Tek şartım var: sahada emri ben veririm. Sözleşmen biterse emrim de biter.\"", en: "\"Crystals per Gate, rations, and a third of the loot. One condition: in the field, I give the orders. Your contract ends, my orders end.\"" }
        secenekler:
          - id: "uc_te_bir"
            etiket: { tr: "\"Üçte bir az. Yarısını isterim.\"", en: "\"A third's light. Half.\"" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { insanlik: -3 }
              - oz_kristali: 20
              - iliski: { kaya_demir: { saygi: 4, guven: -2 } }
            kronik: { tr: "{npc:kaya_demir|le} ganimetin yarısı için pazarlığa oturdun ve kazandın. Lonca'nın defterinde adının yanına kırmızı mürekkeple bir not düşüldü.", en: "You haggled {npc:kaya_demir} up to half the loot and won. In the Guild's books, your name got a note in red ink." }
            sonraki: "@akis"
          - id: "emir_yok"
            etiket: { tr: "\"Sahada emir almam.\"", en: "\"I don't take orders in the field.\"" }
            etkiler:
              - ahlak: { duzen: -4 }
              - iliski: { kaya_demir: { saygi: 2, guven: -4 } }
            kronik: { tr: "{npc:kaya_demir|in} tek şartını geri çevirdin. Artık aynı kapının önünde iki komutan duracaktı.", en: "You turned down {npc:kaya_demir|pos} one condition. From then on, any Gate you worked would have two commanders standing at it." }
            sonraki: "@akis"
          - id: "tamam"
            etiket: { tr: "El sıkış, anlaşmayı kabul et", en: "Shake on it" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
              - esya: { lonca_tayini: 2 }
            kronik: { tr: "{npc:kaya_demir|le} el sıkıştın. Sözleşme kâğıda dökülmedi; ikinize de bir el sıkışma yetti.", en: "You shook {npc:kaya_demir|pos} hand. Nothing got written down. A handshake was enough for both of you." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pencereni sonuna kadar açtığın anda haddehane susuyor. Vinçler duruyor, masanın çevresindeki subaylardan biri farkında olmadan bir adım geri çekiliyor.", en: "When you open your window all the way, the rolling mill goes silent. The cranes stop. One of the officers around the table steps back without meaning to." }
          - { tr: "{npc:kaya_demir} rakamları okurken yüzünde tek bir kas oynamıyor. Ama sağ eli, tıpkı o rampadaki gibi, kendiliğinden yarıya kadar kalkıp orada asılı kalıyor.", en: "{npc:kaya_demir} reads the numbers. Nothing on his face moves. But his right hand, just like on the loading dock, comes halfway up on its own and stops there." }
          - { tr: "Sonunda elini indirip konuşuyor: \"Sana çavuşluk vermek hakaret olur. Komutan yardımcım ol. Benden sonra bu masaya kimin oturacağını yazdığım bir kâğıt var; o kâğıtta senin adın duracak.\"", en: "\"Sergeant would be an insult,\" he finally says, lowering the hand. \"Be my XO. There's a piece of paper with the name of whoever sits at this table after me. Your name goes on it.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "h̷alef. bu sözcüğü ilk kez kendine söylüyor. dikkat et: bir askerin halefi aynı zamanda en büyük tehdididir.", en: "s̷uccessor. first time he's ever said that word to himself. careful. a soldier's successor is also his biggest threat." }
        secenekler:
          - id: "sag_kol"
            etiket: { tr: "Kabul et, sağ kolu ol", en: "Accept. Be his right hand" }
            etkiler:
              - degisken: { lonca_rutbe: 3 }
              - bayrak: "kaya_sag_kol"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 5 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { baglilik: 8, guven: 5 } }
              - esya: { turuncu_yama: 1 }
              - dikkat: 2
            kronik: { tr: "{npc:kaya_demir|in} komutan yardımcısı oldun. Lonca'nın halef kâğıdına adını o kendi eliyle yazdı.", en: "You became {npc:kaya_demir|pos} XO. Your name went onto the Guild's succession paper in his own handwriting." }
            sonraki: "@akis"
          - id: "yaninda"
            tur: "gosteris"
            etiket: { tr: "\"Altında değil. Yanında.\"", en: "\"Not under you. Next to you.\"" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - degisken: { lonca_rutbe: 3 }
              - bayrak: "kaya_sag_kol"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 8, korku: 6, guven: -4 } }
              - dikkat: 3
            kronik: { tr: "{npc:kaya_demir|in} masasına altında değil, yanında oturdun. O gün Lonca iki başlı bir kartala döndü.", en: "You sat at {npc:kaya_demir|pos} table beside him, not under him. That day the Guild became a two-headed eagle." }
            sonraki: "@akis"
          - id: "sadece_kapi"
            etiket: { tr: "\"Rütbe istemem. Bana en zor kapıları ver.\"", en: "\"Keep the rank. Give me the worst Gates.\"" }
            etkiler:
              - degisken: { lonca_rutbe: 2 }
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 3 } }
              - xp_seviye: 10
            kronik: { tr: "{npc:kaya_demir|in} halefi olmayı geri çevirip en zor kapıları istedin. Lonca'nın en kötü sözleşmeleri bundan böyle önce senin masana gelecekti.", en: "You passed on being {npc:kaya_demir|pos} successor and asked for the worst Gates instead. From then on, the Guild's ugliest contracts would hit your desk first." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_gizli"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} pencerene bir kez daha bakıyor; bu sefer gözlerini kısmıyor. \"Avcı,\" diyor. \"Kapı mangalarında taşıyıcıların bir üstü. Kendini kanıtlarsan basamak basamak çıkarsın.\"", en: "{npc:kaya_demir} looks at your window one more time. This time his eyes don't narrow. \"Hunter,\" he says. \"One step above the carriers on the Gate squads. Prove yourself and you climb.\"" }
          - { tr: "Haddehanenin kantininde iki çavuş sana bakıp kıs kıs gülüşüyor. Biri, yeni avcıların ilk kapıda neden ağladığını tam senin duyacağın yükseklikte anlatmaya başlamış bile. Sesini çıkarmıyorsun.", en: "In the mill's mess hall, two sergeants look at you and snicker. One of them tells a story, loud enough for you to hear, about why new hunters always cry in their first Gate. You don't say a word." }
          - { tr: "Akşam Pano'nun önünden geçerken adını Destek sütununun hemen üstünde, küçücük harflerle yazılmış buluyorsun. Bir gün o tebeşirin silinişini izlemek eğlenceli olacak.", en: "Walking past the Board that evening, you find your name just above the Support column, in small letters. Someday it's going to be fun watching that chalk get wiped." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ırak gülsünler. hafife alınmak zırh gibidir, üstelik hiç ağırlığı yoktur.", en: "l̷et them laugh. being underestimated is armor. and it doesn't weigh a thing." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Ağzını açma; tayınını al, yat", en: "Say nothing. Take your ration and turn in" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 1
              - esya: { lonca_tayini: 1 }
            kronik: { tr: "Lonca'nın kantininde sana gülen çavuşlara tek kelime etmedin; tayınını alıp yattın.", en: "You didn't say one word to the sergeants laughing at you in the Guild's mess. You took your ration and turned in." }
            sonraki: "@akis"
          - id: "hikaye"
            etiket: { tr: "Çavuşun hikâyesini sen bitir", en: "Finish the sergeant's story for him" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - itibar: { lonca: 2 }
            kronik: { tr: "Kantinde sana gülen çavuşun hikâyesini onun yerine sen bitirdin. Bütün masa kahkahaya boğuldu, çavuş da o gece başka masaya geçti.", en: "In the mess hall you finished the sergeant's story for him. The whole table laughed, and he ate at a different table that night." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} yamayı masadan geri almıyor; ambar kapağının paslı perçinleri arasında, sen fikrini değiştirene dek orada bekleyecekmiş gibi bırakıyor.", en: "{npc:kaya_demir} doesn't pick the patch back up. He leaves it right there between the rusty rivets of the hatch cover, like it's going to wait for you to change your mind." }
          - { tr: "\"Askerim değilsin,\" diyor. \"O zaman hesaba katmam gereken bir şeysin. Hava durumu gibi. Ya da bir kapı gibi.\" Yeniden haritaya dönüyor. \"Çıkışı biliyorsun.\"", en: "\"Not my soldier,\" he says. \"Then you're something I plan around. Like weather. Or a Gate.\" He turns back to the map. \"You know the way out.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan çık", en: "Walk out without looking back" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "{npc:kaya_demir|in} haddehanesinden dönüp bakmadan çıktın. Lonca'nın haritasında artık bir hava durumu işaretiydin.", en: "You walked out of {npc:kaya_demir|pos} rolling mill without looking back. On the Guild's map, you were marked with a weather symbol." }
            sonraki: "@akis"
          - id: "kapi_isi"
            etiket: { tr: "\"Yine de kapı sözleşmelerine açığım.\"", en: "\"I'm still open to Gate contracts.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - degisken: { lonca_rutbe: 1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 1 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 6, max: 12 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Haddehanedeki masadan sonra Lonca'nın sana bir işi var.", en: "After that table in the rolling mill, the Guild's got a job for you." } }
            kronik: { tr: "{npc:kaya_demir|in} askeri olmayı reddettin ama kapılarını kapatmaya razı oldun. Şimdilik aranızdaki tek köprü kapılardı.", en: "You wouldn't be {npc:kaya_demir|pos} soldier, but you'd close his Gates. For now, the Gates were all you had between you." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 1 — KURU HAVUZ KAPISI (P2)
  - id: "lonca_1_kapi_temizligi"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 45, max: 150 }
    kosul: { bayrak: "perde2_basladi", itibar_min: { lonca: -15 }, bayrak_yok: "lonca_dusmani" }
    agirlik: 8
    etiketler: ["lonca", "kapi", "zincir", "sanayi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kuru havuzdaki kapı", en: "The Gate in the dry dock" }
    sahne: "lonca_1_kapi_temizligi_1"
    sahneler:
      - id: "lonca_1_kapi_temizligi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lonca'nın sözleşmesi seni tersanenin en dibine, kuru havuza getiriyor. Havuzun suyu aylar önce boşaltılmış. Dipte, kızağın üstünde yarım kalmış bir yük gemisinin gövdesi yan yatmış; kaburgaları göğe açılmış.", en: "The Guild contract brings you to the very bottom of the shipyard, to the dry dock. The basin was pumped dry months ago. At the bottom, the hull of a half-built freighter lies on its side on the slipway, ribs open to the sky." }
          - { tr: "Gövdenin içinde, kaburgaların arasında bir kapı nabız gibi atıyor. Kenarındaki perçinler kendiliğinden sökülüp yere düştükçe havuzun dibinden bir tıkırtı yükseliyor.", en: "Inside the hull, between the ribs, a Gate is pulsing like a heartbeat. The rivets around its edge keep popping loose on their own and dropping to the floor, and every time one does, a ticking sound comes up from the bottom of the basin." }
          - { tr: "Havuzun kenarında numaralı turuncu yelekler giymiş, sırtlarında halat ve sandık taşıyan on iki kişi bekliyor; arkalarında silahlı altı avcı var. Lonca'nın Defterdar dediği kısa boylu levazımcı kadın, yazı altlığından planı okuyor: \"Yük önden iner, tuzakları ve sürüyü üstüne çeker. Avcılar arkadan temizler. Yükün katkısı bu hafta iki kat.\"", en: "Twelve people wait at the edge of the basin in numbered orange vests, rope and crates on their backs. Six armed hunters stand behind them. A short woman with a clipboard, the quartermaster the Guild calls the Ledger, reads you the plan: \"Load goes down first and draws the traps and the swarm. Hunters clean up behind them. Load gets double contribution this week.\"" }
          - metin: { tr: "Avcılardan biri görünen seviyene göz atıp dirseğiyle yanındakini dürtüyor. \"Bizim çavuş bu mu? Yükün arasına katsak kimse fark etmez.\"", en: "One of the hunters checks your displayed level and elbows the guy next to him. \"This is our sergeant? Stick 'em in with the load, nobody'd notice.\"" }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Rütben gereği bu manga senin. Defterdar planı okumayı bitirince sana dönüp bekliyor, avcılar da öyle.", en: "Your rank makes this squad yours. When the Ledger finishes reading the plan, she turns and waits on you. So do the hunters." }
            kosul: { degisken_min: { lonca_rutbe: 2 } }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kapı · Kuru Havuz · Taşmaya 2 gün", en: "[ANALYSIS] Gate · Dry Dock · Break in 2 days" }
            satirlar:
              - { tr: "İçeride: Perçin Kurdu sürüsü, bir kraliçe.", en: "Inside: Rivet Grub swarm, one queen." }
              - { tr: "Not: Kraliçe yalnızca sürü azalınca yüzeye çıkar.", en: "Note: The queen only surfaces once the swarm thins out." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Yük yeleklerinden birinin içindeki çocuk on ikisinde bile yok. Yelek ona iki beden büyük geliyor; numara sırtına değil, karnına denk düşmüş.", en: "The kid inside one of those load vests can't even be twelve. The vest's two sizes too big. The number sits on his belly instead of his back." }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Havuzun dibindeki sacların altında yüzlerce küçük ısı izi seçiliyor. Önden inen ilk dört kişi yere bastığı anda sürü uyanacak.", en: "There are hundreds of small heat signatures under the plates at the bottom. The first four people to step down there are going to wake the whole swarm." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷em. adına yük diyorlar. eskiden bunun için bir sözcük vardı, hatırlıyor musun? biz de unuttuk.", en: "b̷ait. they call it load. there used to be a word for this, remember? we forgot it too." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Şu çocuğu görüyor musun? Bunu yapmayacağız. Yapmayacağımızı söyle bana.\"", en: "\"You see that kid? We're not doing this. Tell me we're not doing this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kapının sinyali tuhaf. Kalp atışına değil, geri sayıma benziyor. Hangisi, birazdan öğreniriz.\"", en: "\"The Gate's signal is weird. Not like a heartbeat, more like a countdown. We're about to find out which.\"" }
        secenekler:
          - id: "ben_onde"
            etiket: { tr: "Yükü geri çek, önden sen in", en: "Pull the load back. You go down first" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { merhamet: 5, duzen: -1 }
              - bayrak: "lonca_yuk_korundu"
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuza taşıyıcılardan önce sen indin; numaralı yelekleri yukarıda, halatların başında bıraktın.", en: "You went down into the dry dock ahead of the carriers and left the numbered vests up top on the ropes." }
          - id: "plan"
            etiket: { tr: "Planı uygula, yük önden insin", en: "Run the plan. Load goes first" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 5, merhamet: -6, insanlik: -2 }
              - bayrak: "lonca_yuk_onde"
              - itibar: { lonca: 4 }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "Numaralı yelekleri kuru havuza önden gönderdin; onları sürüye yem eden plana adını koydun.", en: "You sent the numbered vests into the dry dock first, and put your name to a plan that used them as bait." }
            sonraki: "lonca_1_yuk_onde"
          - id: "yalniz"
            tur: "gosteris"
            etiket: { tr: "Herkes yukarıda kalsın, bana on dakika verin", en: "Everybody stays topside. Give me ten minutes" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { merhamet: 3, insanlik: -2 }
              - bayrak: "havuz_yalniz_temizlendi"
              - bayrak: "lonca_yuk_korundu"
              - efsane: "kapiyi_yalniz_kapatti"
              - unvan: "havuz_temizleyen"
              - dikkat: 4
              - xp_seviye: 60
              - esya: { kizak_kabugu: 1 }
            kronik: { tr: "Lonca'nın on sekiz kişiyle kapatmayı planladığı kapıyı on dakikada, tek başına kapattın. Pano'da adının yanına bir kronometre çizildi.", en: "You closed alone, in ten minutes, a Gate the Guild had planned to close with eighteen people. Somebody drew a stopwatch next to your name on the Board." }
            sonraki: "lonca_1_yalniz"
          - id: "duzen"
            etiket: { tr: "Mangayı yeniden diz: avcılar önde, yük arkada", en: "Rearrange the squad: hunters up front, load in back" }
            goster: { degisken_min: { lonca_rutbe: 2 } }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 4, merhamet: 3 }
              - bayrak: "lonca_yuk_korundu"
              - itibar: { lonca: 3 }
            kronik: { tr: "Kuru havuzda Lonca'nın planını baştan yazdın: avcılar öne, taşıyıcılar arkaya. Defterdar yeni planı yazı altlığına geçirdi.", en: "In the dry dock you rewrote the Guild's plan: hunters first, carriers behind. The Ledger copied it onto her clipboard." }
            sonraki: "lonca_1_duzen"
          - id: "arkada"
            tur: "gizle"
            etiket: { tr: "Sıradan bir avcı gibi arkada kal", en: "Hang back like any other hunter" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - gizle: 3
              - ahlak: { duzen: 2, merhamet: -1 }
            kronik: { tr: "Gücünü saklayıp kuru havuzda sıradan bir avcı gibi geride durdun.", en: "In the dry dock you hid what you were and hung back like any other hunter." }
            sonraki: "lonca_1_gizli"

      - id: "lonca_1_yuk_onde"
        yer: "sanayi"
        paragraflar:
          - { tr: "Numaralı yelekler halatlara tutunup havuzun dibine iniyor. İlk dört kişi saclara basar basmaz zemin önce tıkırdamaya, ardından kaynamaya başlıyor.", en: "The numbered vests climb down the ropes to the bottom of the basin. The second the first four set foot on the plates, the floor starts ticking. Then it starts boiling." }
          - { tr: "Perçin kurtları sacların altından yüzlercesi birden fışkırıyor. Bir sandık devrilip bir halat kopuyor, derken çığlıklar başlıyor. Defterdar yazı altlığına bir şey işaretlerken kalemi bir an bile titremiyor.", en: "Rivet grubs burst out from under the plates by the hundreds. A crate tips over, a rope snaps, and then the screaming starts. The Ledger checks something off on her clipboard, and her pen doesn't shake once." }
          - metin: { tr: "Büyük beden yelekli çocuk havuzun ortasında donup kalmış; çevresindeki zemin kıpır kıpır.", en: "The kid in the oversized vest is frozen in the middle of the basin. The floor around him is moving." }
            kosul: { stat: { per: 35 } }
        secenekler:
          - id: "atla"
            etiket: { tr: "Havuza atla, yükü çıkar", en: "Jump in and get the load out" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Yükü önden gönderdin, sonra pişman olup ardından havuza atladın.", en: "You sent the load in first, then regretted it and jumped in after them." }
          - id: "bekle"
            etiket: { tr: "Bekle, sürü dağılınca in", en: "Wait. Go down once the swarm spreads out" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -5 }
              - degisken: { hayatta_kalan: -3 }
              - itibar: { lonca: 3 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Sürünün yükü yemesini havuzun kenarında bekledin; ancak sürü dağılınca aşağı indin.", en: "You waited at the edge of the dry dock while the swarm fed on the load, and only went down once it spread out." }
          - id: "cocuk"
            tur: "gosteris"
            etiket: { tr: "Havuzu tek sıçrayışta aş, çocuğu kap", en: "Clear the basin in one leap. Grab the kid" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - dikkat: 2
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzu tek sıçrayışta aşıp büyük beden yelekli çocuğu kaptın. Defterdar o gün ilk kez kalemini elinden bıraktı.", en: "You cleared the dry dock in one leap and grabbed the kid in the oversized vest. That was the first time anyone saw the Ledger put her pen down." }

      - id: "lonca_1_duzen"
        yer: "sanayi"
        paragraflar:
          - { tr: "Yük yeleklilerini havuzun kenarına, halatların başına dizip avcıları önden indiriyorsun. Defterdar kaşlarını kaldırsa da planın yeni hâlini yazı altlığına geçiriyor.", en: "You line the load vests up at the edge of the basin, on the ropes, and send the hunters down first. The Ledger raises an eyebrow, but she copies the new plan onto her clipboard." }
          - { tr: "Sürü uyandığında karşısında ilk olarak zıpkınları ve kalkanları buluyor. Yukarıdaki taşıyıcılar halatları çekip yaralı avcıları birer birer yukarı alıyor; gerçek bir lonca işte böyle çalışır.", en: "When the swarm wakes up, the first thing it runs into is harpoons and shields. Topside, the carriers haul on the ropes and pull wounded hunters up one at a time. They work like an actual guild." }
        secenekler:
          - id: "in"
            etiket: { tr: "Avcıların arasına in", en: "Drop down with your hunters" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kendi kurduğun hattın içine, avcılarının arasına indin.", en: "You dropped into the line you'd built yourself, right alongside your hunters." }
          - id: "yukari"
            etiket: { tr: "Yukarıdan komuta et, halatları sen yönet", en: "Command from the top. Run the ropes yourself" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -1 }
              - itibar: { lonca: 2 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Bir mangayı ilk kez yukarıdan, bir komutan gibi yönettin; yine de sonunda kuru havuza inmen gerekti.", en: "In the dry dock you ran a squad from above for the first time, like a commander. Then you had to go down there anyway." }

      - id: "lonca_1_gizli"
        yer: "sanayi"
        paragraflar:
          - { tr: "Elinde sıradan bir silah, avcıların en arkasında herhangi bir avcı gibi duruyorsun. Yük önden iner inmez sürü uyanıyor ve plan kâğıttaki kadar düzgün işlemiyor.", en: "You stand at the very back of the hunters with an ordinary weapon, like any ordinary hunter. The load goes down first, the swarm wakes up, and the plan doesn't run anywhere near as clean as it looked on paper." }
          - { tr: "Sana gülen avcı öne atıldığı anda iki kurt birden bacağına gömülüyor. Kimse bakmıyorken uzanıp yakasına yapışıyorsun ve onu bir halat gibi geri çekiyorsun.", en: "The hunter who laughed at you charges forward, and two grubs bore into his leg at the same time. While nobody's looking, you reach out, grab his collar, and yank him back like a rope." }
        secenekler:
          - id: "sessiz"
            etiket: { tr: "Kimse görmeden sürünün içine dal", en: "Slip into the swarm where nobody can see" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - gizle: 2
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit", "karanlik"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Sürünün içine kimseye görünmeden daldın; sana gülen avcı hayatını kime borçlu olduğunu göremedi.", en: "In the dry dock you slipped into the swarm without anybody seeing. The hunter who'd laughed at you never saw who he owed his life to." }
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Saklanmayı bırak, öne çık", en: "Quit hiding. Step up" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - aciga_vur: true
              - itibar: { lonca: 4 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzun ortasında saklanmayı bıraktın. Sana gülen avcılar gerçek pencereni sürünün ışığında okudu.", en: "Halfway down the dry dock you quit hiding. The hunters who'd laughed at you read your real window by the light of the swarm." }

      - id: "lonca_1_kralice"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kurtlar havuzun dibinde kıvrılıp kalıyor; tek bir yarıkta bile kıpırtı yok. Yukarıdan bakan avcıların ağzını bıçak açmıyor, saymaya yetişemedikleri belli.", en: "The grubs curl up dead on the basin floor. Not a twitch left in any of the cracks. The hunters watching from above don't say anything. They clearly lost count." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son kurt da sacın üstünde kıvrılıp kalıyor. Kolunda iki matkap yarası açılmış, nefesin pas kokuyor; ama ayaktasın.", en: "The last grub curls up dead on the plate. You've got two drill wounds in your arm and your breath tastes like rust, but you're on your feet." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Derken gemi gövdesi inlemeye başlıyor. Kızaktaki yarım gemi ağır ağır yana yatarken kaburgalarının arasında iki kırmızı göz açılıyor.", en: "Then the hull groans. The half-built ship on the slipway slowly rolls onto its side, and two red eyes open between its ribs." }
          - { tr: "Kızak Kraliçesi geminin ta kendisi: gemiyi içten içe yiyerek büyümüş, sacını da kabuk diye üstüne geçirmiş. Kapı arkasında, karnından vuran ışıkta atıyor.", en: "The Slipway Queen is the ship. It grew by eating the ship from the inside out, and now it wears the steel as a shell. The Gate pulses behind it, in the light from its belly." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[ANALİZ] Kızak Kraliçesi · Kapı Bekçisi", en: "[ANALYSIS] Slipway Queen · Gate Boss" }
            satirlar:
              - { tr: "Zayıf nokta: iletken kabuk.", en: "Weak point: conductive shell." }
              - { tr: "Lonca için tahmini kayıp: 3–5 avcı. Senin için tahmin: hesaplanamadı.", en: "Guild casualty estimate: 3–5 hunters. Estimate for you: could not be calculated." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kraliçenin üstüne yürü", en: "Go straight at the queen" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kızak Kraliçesi'nin üstüne tek başına yürüdün; avcılar yukarıdan nefeslerini tutup izledi.", en: "You walked straight at the Slipway Queen alone while the hunters watched from above, holding their breath." }
          - id: "vinc"
            etiket: { tr: "Vinci indirt, kabuğu yere çivile", en: "Bring the crane down. Pin its shell" }
            gerekli: { stat: { int: 35 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - itibar: { lonca: 2 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Tersanenin eski vincini indirtip Kızak Kraliçesi'nin kabuğunu kendi gemisine çiviledin.", en: "You brought the shipyard's old crane down and pinned the Slipway Queen's shell to its own ship." }
          - id: "avcilar"
            etiket: { tr: "Avcıları çağır, birlikte kuşatın", en: "Call the hunters down. Surround it together" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { hayatta_kalan: -1 }
              - itibar: { lonca: 3 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kızak Kraliçesi'ne Lonca'nın avcılarıyla birlikte girdin; o kavgayı bir manganın kavgası yaptın.", en: "You took on the Slipway Queen together with the Guild's hunters and made it a squad's fight." }

      - id: "lonca_1_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kraliçe havuzun dibine çöküyor, kapı da sönen bir mum gibi sessizce kapanıyor. Yukarıdan bakan on sekiz kişi tek söz etmiyor; söyleyecek söz bulamıyorlar.", en: "The queen collapses at the bottom of the basin and the Gate goes out quietly, like a candle. The eighteen people watching from above don't say anything. They can't think of anything to say." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Kraliçe son bir kez kıvranıp havuzun dibine yığılıyor, kapı titreye titreye kapanıyor. Dizlerinin bağı bir an çözülüyor ama düşmüyorsun.", en: "The queen thrashes one last time and slumps to the bottom of the basin, and the Gate shudders closed. Your knees give for a second, but you don't go down." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Numaralı yeleklerden dördü havuzun kenarında boş yatıyor. Defterdar onları tek tek sayıp bir sütuna bir şey yazıyor.", en: "At the edge of the basin, four numbered vests lie empty. The Ledger counts them, then writes something in a column." }
            kosul: { bayrak: "lonca_yuk_onde" }
          - metin: { tr: "Numaralı yeleklerin on ikisi de havuzun kenarında, içlerinde insanlarla. Büyük beden yelekli çocuk ağlamıyor; gözlerini sana dikmiş.", en: "All twelve numbered vests are standing at the edge of the basin with people in them. The kid in the oversized vest isn't crying. He's looking at you." }
            kosul: { bayrak: "lonca_yuk_korundu" }
          - { tr: "Defterdar ganimeti sayıyor: kraliçenin kabuğu, çekirdeği, havuzun dibindeki canlı bakır. \"Kural belli,\" diyor. \"Yüzde yetmişi Lonca'nın, otuzu manganın. Yük tayın alır, ganimet almaz.\"", en: "The Ledger tallies the loot: the queen's shell, its core, the live copper at the bottom of the dock. \"The rule's clear,\" she says. \"Seventy percent Guild, thirty squad. Load gets rations, not loot.\"" }
          - metin: { tr: "Telsiz cızırdıyor; haddehaneden {npc:kaya_demir|in} sesi geliyor: \"Kapı kapandı mı?\" Defterdar doğruluyor. Kısa bir sessizlikten sonra ses yeniden duyuluyor: \"Pano'ya yaz. Çavuşa da söyle, ganimeti nasıl bölecek, izliyorum.\"", en: "A radio crackles from the rolling mill. It's {npc:kaya_demir|pos} voice: \"Gate closed?\" The Ledger confirms. After a short silence, the voice comes back: \"Put it on the Board. And tell the sergeant I'm watching how the loot gets split.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "yuke_pay"
            etiket: { tr: "Kendi payını taşıyıcılara dağıt", en: "Hand your cut out to the carriers" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: -2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - xp_seviye: 30
              - esya: { kizak_kabugu: 1 }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kuru havuzdan düşen payını numaralı yeleklere dağıttın. O hafta Destek sütunundaki çarpıların yanına ilk kez kristal yazıldı.", en: "You split your cut of the dry dock loot among the numbered vests. That week, for the first time, the X's in the Support column had crystals written next to them." }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kuralı uygula: yetmişe otuz", en: "Go by the rule. Seventy-thirty" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 5 }
              - oz_kristali: 15
              - esya: { kizak_kabugu: 1 }
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Ganimeti Lonca'nın kuralına göre, yetmişe otuz böldün; Defterdar da adını 'güvenilir' sütununa geçirdi.", en: "You split the dry dock loot by the Guild's rule. The Ledger wrote your name in her 'reliable' column." }
            sonraki: "@akis"
          - id: "hepsi"
            etiket: { tr: "\"Kapıyı ben kapattım. Hepsi benim.\"", en: "\"I closed the Gate. It's all mine.\"" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -4, duzen: -2 }
              - itibar: { lonca: 4 }
              - oz_kristali: 40
              - esya: { kizak_kabugu: 1, canli_bakir: 3 }
              - iliski: { kaya_demir: { saygi: 5, korku: 4, guven: -3 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kraliçeden ve havuzdan ne çıktıysa hepsine el koydun. Lonca'da bunu açgözlülük diye değil, güçlünün hakkı diye anlattılar.", en: "You took the whole dry dock haul. The Guild didn't tell it as greed. They told it as the strong taking what's theirs." }
            sonraki: "@akis"
          - id: "kurali_degistir"
            etiket: { tr: "Katkı kuralını değiştir: yük de pay alsın", en: "Change the rule: the load gets a cut too" }
            goster: { degisken_min: { lonca_rutbe: 2 } }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 4 }
              - bayrak: "lonca_yuk_payi"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 3, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Lonca'nın katkı kuralına bir satır ekledin: kapıya giren taşıyıcı da bundan böyle ganimetten pay alacaktı.", en: "You added a line to the Guild's contribution rule: carriers who went through a Gate would get a share of the loot too." }
            sonraki: "@akis"

      - id: "lonca_1_yalniz"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halata elini bile sürmeden havuzun kenarından dosdoğru aşağı atlıyorsun. Yukarıdakiler önce sacların tıkırdadığını, sonra kısacık bir süre bir şeylerin kırıldığını duyuyor.", en: "You don't bother with the rope. You just jump off the edge of the basin. The people up top hear the plates start ticking, and then, very briefly, the sound of things breaking." }
          - { tr: "Derken gemi gövdesi inleyerek yana yatıyor, kaburgaların arasında iki kırmızı göz açılıyor. Bir saniye sonra o gözler kapanıyor; gemi bir daha kıpırdamayacak.", en: "Then the hull groans and rolls, and two red eyes open between the ribs. One second later they close, and the ship never moves again." }
          - { tr: "Defterdar saatine bakıyor: dokuz dakika kırk saniye. Yazı altlığındaki planı ağır ağır ikiye katlayıp cebine koyuyor.", en: "The Ledger checks her watch: nine minutes, forty seconds. She slowly folds the plan on her clipboard in half and puts it in her pocket." }
          - metin: { tr: "Sana gülen avcı havuzun kenarında ağzı açık kalmış. Bir şey söylemeye çalışıyor ama sesi çıkmıyor.", en: "The hunter who laughed at you is standing at the edge of the basin with his mouth open. He's trying to say something. Nothing's coming out." }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Telsiz cızırdıyor. {npc:kaya_demir} uzun bir sessizliğin ardından yalnızca \"Pano'ya yaz,\" diyor. Sesinde hayranlık mı var, endişe mi, kestirmek zor.", en: "The radio crackles. {npc:kaya_demir} doesn't say anything for a long time. Then just: \"Put it on the Board.\" Admiration or worry in his voice, you can't decide which." }
            kosul: { npc_hayatta: "kaya_demir" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı kapatıldı: Kuru Havuz]", en: "[Gate closed: Dry Dock]" }
            satirlar:
              - { tr: "Süre: 9 dk 40 sn. Bölge rekoru.", en: "Time: 9 min 40 sec. Regional record." }
              - { tr: "Not: Lonca planında öngörülen süre 3 saatti.", en: "Note: The Guild's plan estimated 3 hours." }
        secenekler:
          - id: "yuke"
            etiket: { tr: "Ganimeti taşıyıcılara bırak", en: "Leave the loot to the carriers" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Tek başına kapattığın kapının ganimetini numaralı yeleklere bıraktın; adın Lonca'da ilk kez bir yardım listesine geçti.", en: "You left the loot from the Gate you'd closed alone to the numbered vests. It was the first time your name showed up on a Guild charity list." }
            sonraki: "@akis"
          - id: "pano"
            etiket: { tr: "Kraliçenin başını omzuna vur, haddehaneye yürü", en: "Shoulder the queen's head. Walk it to the mill" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 8, korku: 3 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kızak Kraliçesi'nin başı omzunda, {yer:sanayi|in} tam ortasından yürüdün. O yürüyüşü gören hiç kimse Lonca'nın merdiveninin tepesinde senden başkasını düşünemedi.", en: "You carried the Slipway Queen's head on your shoulder straight through the middle of {yer:sanayi}. Nobody who saw that walk could picture anyone else at the top of the Guild's ladder." }
            sonraki: "@akis"

      - id: "lonca_1_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kraliçenin omurgası üstüne iniyor, dünya pas rengine kesiyor. Gözünü açtığında haddehanenin revirinde yatıyorsun; kolunda serum, başucunda Defterdar.", en: "The queen's keel comes down on you and the world goes rust-colored. When you open your eyes you're in the rolling mill's infirmary, an IV in your arm and the Ledger at your bedside." }
          - { tr: "\"Ağır manga indi,\" diyor. \"Kapıyı kapattılar. Üç avcı kaybettik. Senin yüzünden değil; senin sayende yalnızca üç. Planda beş yazıyordu.\"", en: "\"The heavy squad went in,\" she says. \"They closed it. We lost three hunters. Not because of you. Thanks to you, only three. The plan said five.\"" }
          - metin: { tr: "Kapının eşiğinde {npc:kaya_demir} dikiliyor. \"Bugün değil,\" diyor, tıpkı o çatıdan düştüğün gün dediği gibi. \"Bugün değil demek, hiçbir zaman demek değildir.\"", en: "{npc:kaya_demir} is standing in the doorway. \"Not today,\" he says, just like the day you fell off that roof. \"Not today doesn't mean never.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Serumu çek, kalk", en: "Pull the IV and get up" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - stat: { wil: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "lonca_1_tamam"
              - itibar: { lonca: 2 }
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kızak Kraliçesi seni yere serdi; ertesi sabah serumu söküp nöbete çıktın. Lonca'nın aklında yenilgin değil, bu kaldı.", en: "The queen in the dry dock put you down, and the next morning you pulled your IV and reported for watch. The Guild remembered that better than the loss." }
            sonraki: "@akis"
          - id: "isimler"
            etiket: { tr: "Ölen üç avcının adını sor", en: "Ask for the names of the three hunters" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { kaya_demir: { guven: 4 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kuru havuzda ölen üç avcının adını sorup ezberledin; o adlar artık senin de yükündü.", en: "You asked for the names of the three hunters who died in the dry dock and learned them by heart. They were yours to carry now." }
            sonraki: "@akis"

      - id: "lonca_1_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Arkanda saclar kaynarken halata tutunup havuzdan dışarı tırmanıyorsun. Kenara vardığında Defterdar yazı altlığına bir şey karalayıp telsizi ağzına götürüyor: \"Ağır mangayı gönderin.\"", en: "You grab the rope and climb out of the basin with the plates boiling behind you. When you make the edge, the Ledger writes something on her clipboard, then lifts the radio: \"Send the heavy squad.\"" }
          - { tr: "Ağır manga yirmi dakika sonra çıkageliyor. Bu arada havuzdan taşan kurtlardan biri tersanenin trafosunu kemirmiş; {yer:sanayi|in} yarısı bu gece karanlıkta kalacak.", en: "The heavy squad shows up twenty minutes later. One of the grubs that spilled out of the basin has chewed through the shipyard's transformer. Half {yer:sanayi} is going to be dark tonight." }
        secenekler:
          - id: "geri_in"
            etiket: { tr: "Ağır mangayla birlikte geri in", en: "Go back down with the heavy squad" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi" }
            kronik: { tr: "Kuru havuzdan bir kez çekildin, sonra ağır mangayla birlikte yeniden aşağı indin.", en: "You pulled out of the dry dock once, then went back down with the heavy squad." }
          - id: "trafo"
            etiket: { tr: "Kapıyı onlara bırak, trafoyu onar", en: "Leave the Gate to them. Fix the transformer" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { lonca: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 }, hatirlatma: { tr: "Kuru havuzdaki kapıdan bu yana Lonca seni tartıyor.", en: "Since the Gate in the dry dock, the Guild has been sizing you up." } }
            kronik: { tr: "Kapıyı ağır mangaya bırakıp {yer:sanayi|in} trafosunu onardın. O gece Lojmanlar'da ışıklar senin sayende yandı.", en: "You left the dry dock Gate to the heavy squad and fixed the {yer:sanayi} transformer instead. That night, the lights in the company houses were on because of you." }
            sonraki: "@akis"

  # ================================================================== KAYA — SERT DERS (P2)
  - id: "kaya_sert_ders"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 95, max: 175 }
    kosul: { bayrak: "kaya_teklifi_goruldu" }
    agirlik: 7
    etiketler: ["lonca", "npc", "ahlak", "tasma"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Lojmanlar gecesi", en: "The night of the company houses" }
    sahne: "kaya_sert_ders_1"
    sahneler:
      - id: "kaya_sert_ders_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısını az geçe {yer:sanayi|in} bütün sirenleri birden ötmeye başlıyor. Nerede olursan ol, turuncu yamalı bir koşucu seni yine buluyor; bu kez soluk soluğa: \"Cüruf Tepesi'ndeki kapı taştı. Başçavuş seni haddehanede istiyor. Hemen.\"", en: "It's just past midnight when every siren in {yer:sanayi} goes off at once. Wherever you are, an orange-patched runner finds you again, out of breath this time: \"The Gate on the slag heap broke. Gunny wants you at the mill. Now.\"" }
          - { tr: "{npc:kaya_demir} tek bir lambanın altında, ambar kapağından yapılma masanın başında bekliyor. Haritada iki kırmızı nokta var. Kuzeyde Döküm Atölyesi: Lonca'nın bütün silahlarını döktüğü, şehrin yarısının kapı zırhını onardığı yer. Güneyde Lojmanlar: çelik fabrikasının eski işçi evleri; iki yüz kişi, çoğu Destek sütunundan.", en: "{npc:kaya_demir} is at the hatch-cover table under a single lamp. There are two red dots on the map. North: the Foundry, where the Guild casts every weapon it has and patches the Gate armor for half the city. South: the company houses, the steel plant's old worker row homes. Two hundred people, most of them from the Support column." }
          - { tr: "\"Sürü ikiye bölündü,\" diyor, yüzüne bakmadan. \"İki hattı birden tutacak adamım yok. Döküm düşerse şehir bir ay silahsız kalır, bir ay silahsız kalan şehir de kışı göremez. Lojmanlar iki yüz kişi. Döküm yirmi bin.\"", en: "\"The swarm split in two,\" he says, without looking at you. \"I don't have the bodies to hold both lines. Foundry falls, the city goes a month without weapons, and a city that goes a month without weapons doesn't see winter. The houses are two hundred people. The Foundry's twenty thousand.\"" }
          - { tr: "Ardından başını kaldırıyor. \"Döküm'ü sen tutacaksın. Bu bir emir. Bu gece komutanlığın ne olduğunu da öğreneceksin: kimin öleceğine karar vermek.\"", en: "Then he looks up. \"You're holding the Foundry. That's an order. And tonight you're going to learn what command actually is: choosing who dies.\"" }
          - metin: { tr: "\"Konsey üç saat oylama yaparken {yer:kordon|i} kaybettik,\" diye ekliyor. \"Ben oylama yapmam.\"", en: "\"We lost {yer:kordon} while the Council spent three hours voting,\" he adds. \"I don't vote.\"" }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "\"{yer:kordon|i} tuttun, aferin,\" diye ekliyor. \"Ama bu gece başka. Bu gece herkesin kurtulduğu bir seçenek yok.\"", en: "\"You held {yer:kordon}. Good work,\" he adds. \"Tonight's different. Tonight there's no option where everybody makes it.\"" }
            kosul: { bayrak: "kordon_kurtarildi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[KAPI TAŞMASI] {yer:sanayi} · Cüruf Tepesi", en: "[GATE BREAK] Ironworks · Slag Heap" }
            satirlar:
              - { tr: "Sürü ikiye bölündü. Kuzey kolu: Döküm Atölyesi. Güney kolu: Lojmanlar.", en: "Swarm has split. North column: the Foundry. South column: the company houses." }
              - { tr: "Tahmini temas: 14 dakika.", en: "Estimated contact: 14 minutes." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Kuzey kolu güneydekinden yavaş ilerliyor. Senin bacakların iki hattın arasını koşup yetişebilir; bir insanınkiler yetişemez. Gerçi bacaklarının hâlâ ne kadar insan olduğundan emin değilsin.", en: "The north column is slower than the south one. Your legs could run both lines. Human legs couldn't. You're not sure how human your legs are anymore." }
          - kosul: { stat: { int: 45 } }
            metin: { tr: "Döküm'ün döküm çukurları yüz kişiyi alır. Lojmanlar'dan Döküm'e on iki dakikalık yol var, sürü ise on dört dakikada gelir.", en: "The Foundry's casting pits could hold a hundred people. It's twelve minutes from the houses to the Foundry. The swarm hits in fourteen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷imin öleceğini seçmek. sistem de bunu yapıyor, biliyorsun, hem de her gün. bu adam hiç değilse yüzüne söylüyor.", en: "c̷hoosing who dies. the system does that too, you know. every day. at least he says it to your face." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İki yüz kişi. Sanki bir sayıymış gibi söyledi. Bunun sadece bir sayı olmadığını söyle bana.\"", en: "\"Two hundred people. He said it like a number. Tell me it's not just a number.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Lojmanlar'da üç hamile kadın var; üçünü de ben muayene ettim. Seçeceksen bunu bilerek seç.\"", en: "\"There are three pregnant women in those houses. I've examined every one of them. If you're going to choose, choose knowing that.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Hesap doğru. İşin en kötüsü de bu. Hesap hep doğru çıkıyor.\"", en: "\"The math's right. That's the worst part. The math's always right.\"" }
        secenekler:
          - id: "emir"
            etiket: { tr: "Emre uy, Döküm'ü tut", en: "Follow the order. Hold the Foundry" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -6, insanlik: -2 }
              - bayrak: "sert_ders_emre_uyuldu"
              - iliski: { kaya_demir: { saygi: 6, guven: 6, baglilik: 4 } }
            kronik: { tr: "{npc:kaya_demir|in} emrine uyup Döküm'ün başına geçtin; Lojmanlar'daki iki yüz kişiyi sürüye bıraktığını bile bile.", en: "You followed {npc:kaya_demir|pos} order and took the Foundry, knowing you were leaving the two hundred in the company houses to the swarm." }
            sonraki: "kaya_sert_ders_dokum"
          - id: "cigne"
            etiket: { tr: "Emri çiğne, Lojmanlar'a koş", en: "Break the order. Run for the houses" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -5 }
              - bayrak: "sert_ders_emir_cignendi"
              - iliski: { kaya_demir: { saygi: 2, guven: -4 } }
            kronik: { tr: "Cüruf Tepesi'nin taştığı gece {npc:kaya_demir|in} emrini çiğneyip Lojmanlar'daki iki yüz kişinin yanına koştun; Döküm'ü onun kendi elleriyle tutmasına bıraktın.", en: "The night the slag heap broke, you defied {npc:kaya_demir|pos} order and ran to the two hundred. You left him to hold the Foundry with his own hands." }
            sonraki: "kaya_sert_ders_lojman"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "\"İkisini birden tutacağım.\"", en: "\"I'll hold them both.\"" }
            gerekli: { stat: { agi: 60 } }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2, merhamet: 3 }
              - bayrak: "kaya_doktrin_kirildi"
              - bayrak: "lojmanlar_kurtarildi"
              - efsane: "tek_basina_suru"
              - dikkat: 5
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 4 }
              - iliski: { kaya_demir: { saygi: 10, korku: 6, guven: -3 } }
            kronik: { tr: "Lojmanlar'la Döküm'ü aynı gece, ikisini birden tuttun; {npc:kaya_demir|in} 'herkesi kurtaramazsın' doktrini bacaklarının altında kırıldı.", en: "You held the Foundry and the company houses in the same night. {npc:kaya_demir|pos} whole 'you can't save everyone' doctrine broke under your feet." }
            sonraki: "kaya_sert_ders_ikisi"
          - id: "plan"
            etiket: { tr: "Lojmanlar'ı Döküm'ün çukurlarına taşımayı öner", en: "Propose moving the houses into the Foundry pits" }
            gerekli: { stat: { int: 40 } }
            zar: { stat: "cha", zorluk: 40, tek: true, basarisiz: "kaya_sert_ders_plan_red", basarisiz_etkiler: [{ iliski: { kaya_demir: { saygi: -2 } } }, { ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 4 }
              - iliski: { kaya_demir: { saygi: 8, guven: 4 } }
            kronik: { tr: "{npc:kaya_demir|e} üçüncü bir yol önerdin: iki yüz kişiyi Döküm'ün döküm çukurlarına taşıyıp tek bir hat tutmak.", en: "You offered {npc:kaya_demir} a third way: move the two hundred into the Foundry's casting pits and hold a single line." }
            sonraki: "kaya_sert_ders_plan"

      - id: "kaya_sert_ders_dokum"
        yer: "sanayi"
        paragraflar:
          - { tr: "Döküm Atölyesi'nin kapısında, ergimiş metalin turuncu ışığında bekliyorsun. Arkanda Lonca'nın döküm ustaları kalıpları yere yatırmış, kepenkleri indiriyor.", en: "You stand at the Foundry doors in the orange light of molten metal. Behind you, the Guild's casters lay their molds flat and drop the shutters." }
          - { tr: "Güneyden, Lojmanlar yönünden ilk çığlıklar geliyor. Rüzgâr onları buraya kadar taşıyor; sanki biri senin duyduğundan emin olmak istemiş.", en: "From the south, from the houses, the first screams carry. The wind brings them all the way here, like somebody wanted to make sure you heard." }
          - { tr: "Derken kuzey kolu çıkageliyor: hurdadan gövdeler, çelik çeneler, Cüruf Tepesi'nin pasından doğmuş şeyler.", en: "Then the north column hits: bodies made of scrap, steel jaws, things born out of the rust on the slag heap." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Kapıyı tut", en: "Hold the door" }
            etkiler:
              - ahlak: { duzen: 3 }
              - savas: { dusmanlar: ["hurdacik@dunya+10", "hurdacik@dunya+10", "kepenk_cenesi@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_dokum_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Döküm'ün kapısında yerini aldın; güneyden gelen çığlıklar sırtına yüklendi.", en: "You took your place at the Foundry door with the screams from the south on your back." }
          - id: "kulak_tika"
            etiket: { tr: "Çığlıkları duymamak için kendini savaşa ver", en: "Throw yourself into the fight so you can't hear them" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - savas: { dusmanlar: ["hurdacik@dunya+10", "hurdacik@dunya+10", "kepenk_cenesi@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_dokum_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Güneyden gelen çığlıklar duyulmasın diye Döküm'ün kapısında kendini savaşın gürültüsüne bıraktın.", en: "At the Foundry door you threw yourself into the noise of the fight to drown out the screams from the south." }

      - id: "kaya_sert_ders_dokum_sonu"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kuzey kolu Döküm'ün kapısına bile varamıyor. Hurdadan gövdeler, çelik çeneler, ne varsa önünde dağılıp gidiyor; döküm ustaları da kepenklerin aralığından olanları seyrediyor.", en: "The north column doesn't even make it to the Foundry door. Scrap bodies, steel jaws, all of it comes apart in front of you while the casters watch through the gaps in the shutters." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Kuzey kolu ergimiş metalin ışığında, kapının önünde paramparça oluyor. Kolundan kan sızıyor ama Döküm ayakta.", en: "The north column breaks apart in front of the doors, in the light of the molten metal. Your arm's bleeding, but the Foundry's standing." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Güneyden artık ses gelmiyor. Lojmanlar'ın üstünden şafağa doğru tek bir kara duman sütunu yükseliyor.", en: "No more sound from the south. Above the company houses, rising toward the dawn, there's a single column of black smoke." }
        secenekler:
          - id: "lojmanlara"
            etiket: { tr: "Lojmanlar'a yürü, geriye ne kaldığını gör", en: "Walk to the houses. See what's left" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -4 }
            kronik: { tr: "Döküm'ü tuttuktan sonra Lojmanlar'ın külleri arasında yürüyüp geriye ne kaldığını kendi gözünle gördün.", en: "After you held the Foundry, you walked through the ashes of the company houses and saw for yourself what was left." }
            sonraki: "kaya_sert_ders_safak"
          - id: "kayaya"
            etiket: { tr: "Doğruca haddehaneye, {npc:kaya_demir|e} git", en: "Go straight to the mill, to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -1 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -4 }
            kronik: { tr: "Lojmanlar'a dönüp bakmadan doğruca haddehaneye yürüdün; Döküm'ün raporunu bir asker gibi verdin.", en: "You walked straight to the mill without a look at the houses and reported in on the Foundry like a soldier." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_lojman"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lojmanlar'ın dar sokaklarına vardığında sürünün güney kolu çoktan ilk sıradaki evlere dalmış. İnsanlar çatılara çıkmış, ellerinde süpürgeler, tava sapları.", en: "When you reach the narrow streets of the company houses, the swarm's south column is already into the first row. People are up on the roofs holding brooms and frying pans." }
          - { tr: "Arkanda, kuzeyde Döküm'ün sirenleri hâlâ ötüyor. {npc:kaya_demir} oraya kendi adamlarıyla gitti; sensiz.", en: "Behind you, to the north, the Foundry sirens are still going. {npc:kaya_demir} went there with his own people. Without you." }
          - { tr: "Çatılardan birinin kenarında kucağı bebekli bir kadın sana bir şeyler bağırıyor. Ne dediğini duyamıyorsun; duymana da gerek yok.", en: "At the edge of a roof, a woman with a baby in her arms is yelling at you. You can't hear what she's saying. You don't need to." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Sürünün ortasına dal", en: "Dive into the middle of the swarm" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["kepenk_cenesi@oyuncu+2", "hurdacik@dunya+10", "hurdacik@dunya+10"], ortam: ["dar_gecit", "karanlik"], kazan: "kaya_sert_ders_lojman_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Lojmanlar'ın dar sokaklarında, çatılardakilerin gözü önünde sürünün tam ortasına daldın.", en: "In the narrow streets of the company houses you dove into the middle of the swarm, right under the eyes of the people on the roofs." }
          - id: "tahliye"
            etiket: { tr: "Önce çatılardakileri Döküm'e doğru tahliye et", en: "Get the roof people moving toward the Foundry first" }
            gerekli: { stat: { cha: 45 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["kepenk_cenesi@oyuncu+1", "hurdacik@dunya+10"], ortam: ["dar_gecit"], kazan: "kaya_sert_ders_lojman_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Lojmanlar'da önce iki yüz kişiyi yola çıkardın, sonra sürüyle onların arasına kendin girdin.", en: "In the company houses you got the two hundred moving first, then put yourself between them and the swarm." }

      - id: "kaya_sert_ders_lojman_sonu"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şafak söktüğünde Lojmanlar'ın sokakları hurdadan gövdelerle dolmuş. Çatılardakiler birer birer aşağı iniyor. Kucağı bebekli kadın yanından geçerken eline dokunup tek söz etmeden yürüyüp gidiyor.", en: "When dawn breaks, the streets of the company houses are piled with scrap bodies. The people on the roofs climb down one by one. The woman with the baby touches your hand as she passes and keeps walking without a word." }
          - { tr: "Kuzeyden bir koşucu geliyor. Döküm ayakta, diyor, ama Başçavuş yaralı. Kuzey kolunu dokuz adamla, kendi süngüsüyle tutmuş. Dokuz kişiden üçü ölmüş.", en: "A runner comes in from the north. The Foundry held, he says. But the Gunny's hurt. He held the north column with his own bayonet and nine people. Three of the nine are dead." }
        secenekler:
          - id: "kayaya_kos"
            etiket: { tr: "{npc:kaya_demir|in} yanına koş", en: "Run to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 4 }
              - hafiza: { npc: "kaya_demir", id: "emri_cignedi", agirlik: 40 }
              - npc_iz: { kaya_demir: "yara_izi" }
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "Lojmanlar'ı kurtarınca Döküm'e koştun. {npc:kaya_demir} seni süngüsünü elinden bırakmadan karşıladı; yarası yeni ve derindi.", en: "After you saved the company houses, you ran to the Foundry. {npc:kaya_demir} met you without letting go of his bayonet, his wound fresh and deep." }
            sonraki: "kaya_sert_ders_safak"
          - id: "kal"
            etiket: { tr: "Lojmanlar'da kal, yaralıları topla", en: "Stay at the houses. Gather the wounded" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 5 }
              - hafiza: { npc: "kaya_demir", id: "emri_cignedi", agirlik: 40 }
              - npc_iz: { kaya_demir: "yara_izi" }
              - iliski: { kaya_demir: { guven: -2 } }
            kronik: { tr: "Sabaha kadar Lojmanlar'da kalıp yaralıları topladın; {npc:kaya_demir} yarasını sensiz sardı.", en: "You saved the company houses and gathered their wounded until morning. {npc:kaya_demir} dressed his own wound without you." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_ikisi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehaneden çıktığın anda {yer:sanayi|in} sokakları bir an bulanıklaşıyor. Döküm'ün kapısında kuzey kolunun ilk sırası yere seriliyor; dört dakika sonra Lojmanlar'ın çatılarındakiler güney kolunun ön saflarının dağıldığını görüyor.", en: "You walk out of the mill and the streets of {yer:sanayi} blur for a second. At the Foundry door, the first rank of the north column hits the ground. Four minutes later, the people on the roofs of the company houses watch the front of the south column fall apart." }
          - { tr: "Gece boyunca iki hat arasında mekik dokuyorsun. Döküm ustaları seni kuzeyde, çatılardakiler güneyde görüyor. Sabah olduğunda iki taraf da senin bütün gece yanlarında olduğuna inanmış.", en: "All night you go back and forth between the two lines. The casters see you in the north. The people on the roofs see you in the south. By morning, both sides think you were with them all night." }
          - { tr: "Şafakta {npc:kaya_demir} Döküm'ün kapısında, süngüsü tertemiz, haritası elinde duruyor. Haritanın artık hiçbir anlamı kalmadı; bunu o da biliyor.", en: "At dawn, {npc:kaya_demir} is standing at the Foundry door with a clean bayonet and his map in his hand. The map doesn't mean anything anymore, and he knows it." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı taşması bastırıldı: Cüruf Tepesi]", en: "[Gate break suppressed: Slag Heap]" }
            satirlar:
              - { tr: "Sivil kayıp: 0. Lonca kaybı: 0.", en: "Civilian losses: 0. Guild losses: 0." }
              - { tr: "Not: Bu sonuç bölge komutanının planında yer almıyordu.", en: "Note: This outcome was not in the area commander's plan." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Bir şey söyleme, yalnızca yanında dur", en: "Don't say anything. Just stand next to him" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { kaya_demir: { guven: 3 } }
            kronik: { tr: "İki hattı birden tuttuğun gecenin şafağında {npc:kaya_demir|in} yanında sessizce durdun. İkiniz de haritaya bakmadınız.", en: "On the dawn after you held both lines, you stood quietly next to {npc:kaya_demir}. Neither of you looked at the map." }
            sonraki: "kaya_sert_ders_safak"
          - id: "ders"
            etiket: { tr: "\"Bu gece kimse ölmedi. Dersin neydi?\"", en: "\"Nobody died tonight. What was the lesson?\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 3, guven: -4, korku: 3 } }
              - bayrak: "kaya_rakip_gordu"
            kronik: { tr: "Şafakta {npc:kaya_demir|e} gecenin dersinin ne olduğunu sordun; o gece ders alanın kendisi olduğunu ikiniz de biliyordunuz.", en: "At dawn you asked {npc:kaya_demir} what the lesson was supposed to be. You both knew he was the one who'd learned something that night." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_plan"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} haritaya uzun uzun bakıyor, sonra kalemi alıp Lojmanlar'dan Döküm'e bir ok çiziyor. \"On dört dakika,\" diyor. \"On ikisi yolda geçer. İki dakikalık payın var.\"", en: "{npc:kaya_demir} stares at the map for a long time. Then he takes a pencil and draws an arrow from the houses to the Foundry. \"Fourteen minutes,\" he says. \"Twelve of them on the road. That gives you two to spare.\"" }
          - { tr: "İki yüz kişi, kucaklarında battaniyeler ve çocuklarla gecenin içinden Döküm'e yürüyor. Sürünün güney kolu Lojmanlar'a vardığında evler bomboş. Kuzey kolu Döküm'ün kapısına dayandığında ise karşısına sen ve {npc:kaya_demir} dikiliyorsunuz.", en: "Two hundred people walk through the night to the Foundry, carrying blankets and kids. When the south column hits the company houses, they're empty. When the north column hits the Foundry door, it finds you and {npc:kaya_demir} waiting." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Onunla omuz omuza dur", en: "Stand shoulder to shoulder with him" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 5 }
              - hafiza: { npc: "kaya_demir", id: "hatti_tuttu", agirlik: 45 }
              - savas: { dusmanlar: ["kepenk_cenesi@dunya+10", "hurdacik@dunya+10", "hurdacik@dunya+10", "hurdacik@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_safak", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "{npc:kaya_demir|le} Döküm'ün kapısında omuz omuza durdun; iki yüz kişi arkanızda, döküm çukurlarındaydı.", en: "You stood shoulder to shoulder with {npc:kaya_demir} at the Foundry door, with two hundred people in the casting pits behind you." }

      - id: "kaya_sert_ders_plan_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} başını iki yana sallıyor. \"Karanlıkta on iki dakikalık yol, iki yüz sivil,\" diyor. \"Planın kâğıt üstünde güzel. Sahada yarısını yolda kaybederiz.\"", en: "{npc:kaya_demir} shakes his head. \"Twelve minutes on the road, two hundred civilians, in the dark,\" he says. \"Your plan looks great on paper. In the field we lose half of them on the way.\"" }
          - { tr: "\"Vakit yok. Emrimi verdim.\" Sirenler hâlâ susmuyor.", en: "\"No time. You have your order.\" The sirens are still going." }
        secenekler:
          - id: "uy"
            etiket: { tr: "Emre uy, Döküm'ü tut", en: "Follow the order. Hold the Foundry" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - bayrak: "sert_ders_emre_uyuldu"
              - iliski: { kaya_demir: { saygi: 4, guven: 4 } }
            kronik: { tr: "Planın reddedilince {npc:kaya_demir|in} emrine boyun eğip Döküm'e gittin; Lojmanlar'ı sürüye bıraktın.", en: "When he shot down your plan, you followed {npc:kaya_demir|pos} order, went to the Foundry and left the houses to the swarm." }
            sonraki: "kaya_sert_ders_dokum"
          - id: "cigne"
            etiket: { tr: "Yine de Lojmanlar'a koş", en: "Run for the houses anyway" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -6 }
              - bayrak: "sert_ders_emir_cignendi"
              - iliski: { kaya_demir: { guven: -5 } }
            kronik: { tr: "{npc:kaya_demir} planını reddetse de geri durmadın; emrini çiğneyip Lojmanlar'a koştun.", en: "Even after he shot your plan down, you broke {npc:kaya_demir|pos} order and ran for the houses." }
            sonraki: "kaya_sert_ders_lojman"

      - id: "kaya_sert_ders_yara"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çelik bir çene omzuna kapanıyor, dünya kıvılcımlara boğuluyor. Gözünü açtığında döküm ustalarından biri seni kepenklerin arkasına sürüklemiş. Dışarıda savaş sürüp gidiyor ama artık senin savaşın değil.", en: "A steel jaw clamps down on your shoulder and the world drowns in sparks. When you open your eyes, one of the casters has dragged you behind the shutters. The fight's still going outside, but it isn't yours anymore." }
          - { tr: "Şafakta {npc:kaya_demir|in} ağır mangası kapıyı kapatıyor. Herkes gecenin kimleri aldığını sayarken Başçavuş seni yerden kaldırıyor.", en: "At dawn, {npc:kaya_demir|pos} heavy squad closes the Gate. While everyone's counting who the night took, the Gunny pulls you up off the floor." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Elini tut, kalk", en: "Take his hand and get up" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -3 }
              - iliski: { kaya_demir: { guven: 4 } }
              - stat: { wil: 2 }
            kronik: { tr: "Lojmanlar gecesi seni yere serdi; {npc:kaya_demir} elini uzattı, sen de tutup kalktın. Eli sıcaktı.", en: "The night of the company houses put you on the floor. {npc:kaya_demir} held out his hand, and you took it and got up. His hand was warm." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_safak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Güneş Cüruf Tepesi'nin ardından yükselirken {npc:kaya_demir} Döküm'ün basamaklarına oturmuş, botlarının bağcıklarını sıkıyor. Bir şey söyleyeceği zaman hep bunu yapar.", en: "The sun comes up behind the slag heap. {npc:kaya_demir} is sitting on the Foundry steps, tightening his bootlaces. He always does that before he says something." }
          - metin: { tr: "\"Lojmanlar'ı ben yaktım,\" diyor. \"Sen değil. Emri ben verdim. Bunu kendi defterine yazma; benimkinde yeterince yer var.\"", en: "\"I burned those houses,\" he says. \"Not you. I gave the order. Don't put it in your ledger. Mine's got plenty of room.\"" }
            kosul: { bayrak: "lojmanlar_yandi" }
          - metin: { tr: "\"Haklı çıktın,\" diyor, yüzüne bakmadan. \"Emrimi çiğnedin ve haklı çıktın. Asıl canımı sıkan da emrin çiğnenmesi değil, bu.\" Gözü bacağındaki yeni sargıya kayıyor. \"Ama haklı çıktın.\"", en: "\"You were right,\" he says, not looking at you. \"You broke my order and you were right. That bothers me more than the breaking.\" He looks down at the fresh bandage on his leg. \"But you were right.\"" }
            kosul: { bayrak: "sert_ders_emir_cignendi", bayrak_yok: "lojmanlar_yandi" }
          - metin: { tr: "\"Yirmi yıl herkese aynı şeyi öğrettim: herkesi kurtaramazsın,\" diyor. \"Bu gece sen kurtardın. Şimdi ben sana ne öğreteyim?\" Bir an susuyor. \"Sana kim 'dur' diyecek, hiç düşündün mü? Çünkü ben artık diyemiyorum.\"", en: "\"Twenty years, I taught everybody the same thing: you can't save everyone,\" he says. \"Tonight you did. So what am I supposed to teach you now?\" He goes quiet for a second. \"Ever wonder who gets to tell you to stand down? Because I can't anymore.\"" }
            kosul: { bayrak: "kaya_doktrin_kirildi" }
          - metin: { tr: "\"Üçüncü bir yol buldun,\" diyor. \"Ben bulamadım. Yirmi yıl boyunca hep iki yol gördüm.\" Bağcığı bırakıyor. \"Yaşlanıyorum galiba.\"", en: "\"You found a third way,\" he says. \"I didn't. Twenty years, I only ever saw two.\" He lets go of the lace. \"Maybe I'm getting old.\"" }
            kosul: { bayrak: "lojmanlar_kurtarildi", bayrak_yok: ["kaya_doktrin_kirildi", "sert_ders_emir_cignendi"] }
          - { tr: "Sonunda konuşuyor: \"Bir kere bir emri yırtmıştım. Hangisi olduğunu sana hiç anlatmadım.\"", en: "\"I tore up an order once,\" he finally says. \"I never told you which one.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ş̷imdi sana bir şey verecek: ya bir hikâye ya bir rütbe. ikisi de aynı kapıya açılır, onun yerine.", en: "h̷e's about to hand you something. a story or a rank. both open the same door: his place." }
        secenekler:
          - id: "sor"
            etiket: { tr: "\"Anlat.\"", en: "\"Tell me.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bilgi: "kaya_yirtilan_emir"
              - iliski: { kaya_demir: { guven: 8, baglilik: 4 } }
            kronik: { tr: "Döküm'ün basamaklarında {npc:kaya_demir|den} yırttığı emrin hikâyesini istedin, o da anlattı.", en: "On the Foundry steps you asked {npc:kaya_demir} about the order he'd torn up, and he told you." }
            sonraki: "kaya_sert_ders_hikaye"
          - id: "ogret"
            etiket: { tr: "\"Bana komuta etmeyi öğret.\"", en: "\"Teach me how to command.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "kaya_akil_hocasi"
              - unvan: "bascavusun_ogrencisi"
              - iliski: { kaya_demir: { baglilik: 10, guven: 6, saygi: 4 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 2, max: 5 }, kosul: { bayrak_yok: "lonca_1_tamam" }, hatirlatma: { tr: "Lojmanlardaki o geceden sonra {npc:kaya_demir} sözünü tutuyor.", en: "After that night at the barracks, {npc:kaya_demir} is keeping {zamir:kaya_demir|onun} word." } }
            kronik: { tr: "Lojmanlar gecesinin şafağında {npc:kaya_demir|den} sana komuta etmeyi öğretmesini istedin. O gün sen onun öğrencisi oldun, o da senin akıl hocan.", en: "On the dawn after the company houses, you asked {npc:kaya_demir} to teach you how to command. That day you became a student, and he became a mentor." }
            sonraki: "@akis"
          - id: "ben_veririm"
            etiket: { tr: "\"Bir dahaki sefere emri ben veririm.\"", en: "\"Next time, I give the orders.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - bayrak: "kaya_rakip_gordu"
              - iliski: { kaya_demir: { korku: 6, saygi: 4, guven: -6 } }
              - dikkat: 2
            kronik: { tr: "{npc:kaya_demir|e} bir dahaki sefere emri senin vereceğini söyledin. O gün seni ilk kez halefi olarak değil, rakibi olarak gördü.", en: "On the Foundry steps you told {npc:kaya_demir} that next time, you'd be giving the orders. That day he saw you as a rival instead of an heir for the first time." }
            sonraki: "@akis"
          - id: "benim_yolum_degil"
            etiket: { tr: "\"Bu senin yolun. Benim değil.\"", en: "\"This is your road. Not mine.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -3 }
              - iliski: { kaya_demir: { saygi: 3, guven: -2 } }
            kronik: { tr: "{npc:kaya_demir|e} onun yolunun senin yolun olmadığını söyledin. Döküm'ün basamaklarında ikiniz de ayrı yönlere bakarak oturdunuz.", en: "You told {npc:kaya_demir} his road wasn't yours. On the Foundry steps, the two of you sat looking in different directions." }
            sonraki: "@akis"

      - id: "kaya_sert_ders_hikaye"
        yer: "sanayi"
        paragraflar:
          - { tr: "\"Büyük bir depremdi,\" diyor. \"Bir spor salonunu çadırkente çevirmiştik. Gece yağmur bastırdı, artçılar da durmuyordu. Salon dolunca telsizden emir geldi: kapasite doldu, kapıları kilitleyin.\"", en: "\"A hurricane,\" he says. \"Big one, on the Gulf. We'd turned a high school gym into a shelter. That night the water kept coming up. The gym filled, and the order came over the radio: capacity reached, lock the doors.\"" }
          - { tr: "\"Dışarıda kırk iki kişi vardı. Tek tek saydım. Emri yazılı istedim, yazılı geldi. Yırtıp kapıyı açık tuttum.\" Elleriyle havada bir kâğıdı ikiye ayırıyor. \"Rütbemi söktüler. Kırk ikisi de sabahı gördü.\"", en: "\"There were forty-two people outside. I counted. I asked for the order in writing, and it came in writing. I tore it in half and kept the doors open.\" His hands make the motion of ripping paper. \"They busted me down a rank. All forty-two saw morning.\"" }
          - { tr: "\"O günden beri hangi kuralı yazsam bir köşesini yırtılabilir bırakırım,\" diyor. \"Ama iş şurada düğümleniyor asker: o köşeyi kimin yırtacağına kim karar verecek? Ben mi? Sen mi?\"", en: "\"Ever since, every rule I write, I leave one corner that can tear,\" he says. \"Here's the problem, kid. Who decides who gets to tear it? Me? You?\"" }
        secenekler:
          - id: "sen"
            etiket: { tr: "\"Sen. Şimdilik.\"", en: "\"You. For now.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "kaya_akil_hocasi"
              - unvan: "bascavusun_ogrencisi"
              - iliski: { kaya_demir: { baglilik: 8, guven: 4 } }
            kronik: { tr: "Kuralın köşesini şimdilik {npc:kaya_demir|in} yırtacağını söyledin. O gün akıl hocan oldu; 'şimdilik' sözünü de duymazdan gelmedi.", en: "You told {npc:kaya_demir} he'd decide who tears the corner, for now. That day he became your mentor, and he didn't miss the 'for now.'" }
            sonraki: "@akis"
          - id: "en_guclu"
            etiket: { tr: "\"En güçlü olan.\"", en: "\"Whoever's strongest.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -4 }
              - iliski: { kaya_demir: { saygi: 5, korku: 3, guven: -2 } }
              - bayrak: "kaya_rakip_gordu"
            kronik: { tr: "{npc:kaya_demir|e} o köşeyi en güçlü olanın yırtacağını söyledin. En güçlünün kim olduğunu ikiniz de biliyordunuz.", en: "You told {npc:kaya_demir} the strongest one decides who tears the corner. Both of you knew exactly who that was." }
            sonraki: "@akis"
          - id: "insanlar"
            etiket: { tr: "\"Kapının dışında bekleyen kırk iki kişi.\"", en: "\"The forty-two people waiting outside.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 3, duzen: -2 }
              - iliski: { kaya_demir: { guven: 6, saygi: 4 } }
            kronik: { tr: "O köşeyi kapı dışında bekleyenlerin yırtacağını söyledin; {npc:kaya_demir} uzun süre sustu, sonra başını salladı.", en: "You told {npc:kaya_demir} the people waiting outside the door decide who tears the corner. He was quiet a long time. Then he nodded." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 2 — MERDİVEN GÜNÜ (P2)
  - id: "lonca_2_rutbe"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 95, max: 180 }
    kosul: { bayrak: "lonca_1_tamam", bayrak_yok: ["lonca_dusmani", "lonca_2_tamam"] }
    agirlik: 8
    etiketler: ["lonca", "zincir", "duello", "sanayi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Merdiven Günü", en: "Ladder Day" }
    sahne: "lonca_2_rutbe_1"
    sahneler:
      - id: "lonca_2_rutbe_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lonca üç ayda bir haddehanenin zeminini boşaltıp ortasına tebeşirle bir çember çizer. Buna Merdiven Günü denir: Pano'daki herkes bir üstündeki basamağa meydan okuyabilir. Kazanan basamağı alır, kaybeden ise basamağıyla birlikte onun tayınını da yitirir.", en: "Once every three months, the Guild clears the floor of the rolling mill and chalks a circle in the middle. Ladder Day: anyone on the Board can challenge the rung right above them. Win and you take the rung. Lose, and you lose the rung and the rations that come with it." }
          - { tr: "Vinçlerin üstüne, kirişlere, kızgın döküm kalıplarının kenarlarına kadar yüzlerce insan doluşmuş. Pano'nun en üstündeki isim ilk günden beri değişmemiş: Örs. Entegrasyon Günü tersanenin kapısını balyozla tutan, kolları vinç halatı kalınlığında eski bir kaynakçı.", en: "Hundreds of people are packed onto the cranes, the girders, all the way to the edges of the hot casting molds. The name at the top of the Board hasn't changed in a long time: Anvil. An old welder with arms as thick as crane cable who held the shipyard gate with a sledgehammer on Integration Day." }
          - { tr: "Defterdar meydan okumaları yazı altlığından tek tek okuyor. Sıra sana gelince sesi bir an takılıyor. \"Katkı puanı... Pano'nun tamamından yüksek,\" diyor. \"Kural gereği yalnızca bir üst basamağa değil, istediğin basamağa meydan okuyabilirsin.\"", en: "The Ledger reads the challenges off her clipboard. When she gets to you, her voice stalls for a second. \"Contribution score... higher than the whole rest of the Board,\" she says. \"By the rules, you don't challenge one rung. You challenge any rung you want.\"" }
          - metin: { tr: "{npc:kaya_demir} haddehanenin balkonunda, kollarını parmaklığa dayamış izliyor. Göz göze geldiğinizde belli belirsiz bir baş hareketiyle Örs'ü gösteriyor.", en: "{npc:kaya_demir} is up on the mill's balcony, arms resting on the rail, watching. When your eyes meet, he tips his head toward Anvil. Just barely." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Haddehanenin balkonu boş. Lonca'nın subay konseyi onun yerine sıra sıra dizilmiş sandalyelere oturmuş; hepsinin gözü Örs'te.", en: "The mill's balcony is empty. The Guild's officer council sits in a row of chairs where he used to stand, and every one of them is looking at Anvil." }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Zeminin altından {yer:kasaba_cekirdegi|in} uğultusu yükseliyor. Lonca'nın rütbeleri artık Sistem'e işleniyor: kazanacağın basamak herkesin penceresinde adının yanında yazacak.", en: "The Town Core is humming under the floor. The Guild's ranks get written into the System now: whatever rung you win will show up next to your name in everybody's window." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kalabalığın arasında fısıltılar dolaşıyor: bozuk pencere, ikinci ses, Sistem'in bile okuyamadığı satırlar. Ama burada kimse bunları korkuyla değil, merakla söylüyor. Lonca'da anomali kusur sayılmaz, üstünlük sayılır.", en: "Whispers move through the crowd: the broken window, the second voice, lines even the System can't read. But here, nobody says them like they're scared. In the Guild, an anomaly isn't a defect. It's an edge." }
            kosul: { bayrak: "yanki_gorundu" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Örs'ün sol dizi sargılı; sargının altında eski bir kırık seçiliyor. Kalabalığın ön sırasındaki bir kadınla iki çocuğun elinde turuncu bir tayın kartı var: en üst basamağın kartı.", en: "Anvil's left knee is wrapped, and there's an old break under the wrap. In the front row of the crowd, a woman and two kids are holding an orange ration card. It's a top-rung card." }
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Örs'ün görünen seviyesi gerçeğiyle aynı; o da şişirmiyor. Bu haddehanede rakamını şişirmeyen ikinci adam.", en: "Anvil's displayed level matches his real one. He doesn't pad either. He's the second man in this mill who doesn't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷erdiven. sistemin de bir merdiveni var, sen onun basamaklarını üçer üçer çıkıyorsun. bu adamınki yalnızca daha kısa.", en: "l̷adder. the system has one too, and you take its rungs three at a time. this man's is just shorter." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklarına bak. O kart, onların ısıtmalı odası demek. Biliyorsun, değil mi?\"", en: "\"Look at his kids. That card is their heated room. You know that, right?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O diz bir darbe daha kaldırmaz. Bunu hekim olarak söylüyorum, rakip olarak değil.\"", en: "\"That knee won't take another hit. I'm saying that as a doctor, not as your second.\"" }
        secenekler:
          - id: "meydan"
            etiket: { tr: "Örs'e meydan oku", en: "Challenge Anvil" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Merdiven Günü geldiğinde Lonca'nın en üst basamağındaki adama, Örs'e meydan okudun.", en: "On Ladder Day you challenged the man on the top rung of the Guild's ladder." }
            sonraki: "lonca_2_cember"
          - id: "hepsi"
            tur: "gosteris"
            etiket: { tr: "Bütün basamakları birden çembere çağır", en: "Call every rung into the circle at once" }
            gerekli: { stat: { str: 65 } }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - dikkat: 5
              - itibar: { lonca: 12 }
              - efsane: "tek_basina_suru"
              - iliski: { kaya_demir: { saygi: 8, korku: 6 } }
            kronik: { tr: "Merdiven Günü Lonca'nın bütün subaylarını birden çembere çağırdın; merdivenin tamamına tek başına meydan okudun.", en: "On Ladder Day you called every officer in the Guild into the circle at once. You took on the whole ladder by yourself." }
            sonraki: "lonca_2_hepsi"
          - id: "yeni_basamak"
            etiket: { tr: "\"Onun yerini istemiyorum. Üstüne yeni bir basamak koy.\"", en: "\"I don't want his spot. Add a rung above it.\"" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - bayrak: "ors_borclu"
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
            kronik: { tr: "Örs'ün basamağını almak yerine Lonca'dan onun üstüne yeni bir basamak açmasını istedin; adamın çocuklarının ısıtmalı odasına dokunmadın.", en: "Instead of taking Anvil's rung, you asked the Guild to add a new one above it. You left his kids' heated room alone." }
            sonraki: "lonca_2_yeni"
          - id: "bilerek"
            tur: "gizle"
            etiket: { tr: "Meydan oku ama bilerek kaybet", en: "Challenge him. Lose on purpose" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - gizle: 3
              - bayrak: "ors_borclu"
            kronik: { tr: "Merdiven Günü Örs'e meydan okudun ama yenilmeye baştan karar vermiştin.", en: "On Ladder Day you challenged Anvil, but you'd already made up your mind to lose." }
            sonraki: "lonca_2_bilerek"
          - id: "red"
            etiket: { tr: "\"Ben bu oyunu oynamam.\"", en: "\"I don't play this game.\"" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - iliski: { kaya_demir: { saygi: -2, guven: -2 } }
            kronik: { tr: "Merdiven Günü çemberin kenarında durdun ve rütbe oyununa girmeyi reddettin.", en: "On Ladder Day you stood at the edge of the circle and refused to play the rank game." }
            sonraki: "lonca_2_red"

      - id: "lonca_2_cember"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs balyozunu omzundan indirip eldivenlerini sıkıyor, çemberin içine adım atıyor. Sana bakarken yüzünde öfke yok; bir dikişin tutup tutmayacağını tartan bir kaynakçının yüzü bu.", en: "Anvil lowers the sledge off his shoulder, tightens his gloves, and steps into the circle. There's no anger on his face when he looks at you. It's the look a welder gets deciding whether a seam's going to hold." }
          - { tr: "\"Kazanacağını biliyorum,\" diyor, yalnızca senin duyabileceğin bir sesle. \"Herkes biliyor. Yine de çemberden çıkmam. Çocuklarım izliyor.\"", en: "\"I know you're going to win,\" he says, low enough that only you can hear. \"Everybody knows. I'm still not stepping out of this circle. My kids are watching.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ona hak ettiği dövüşü ver", en: "Give him the fight he's earned" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - savas: { dusmanlar: ["ors_bascavus@oyuncu+2"], ortam: [], kazan: "lonca_2_zafer", kaybet: "lonca_2_yenilgi", kac: "lonca_2_yenilgi" }
            kronik: { tr: "Örs'e hak ettiği dövüşü verdin. O çemberde ikiniz de bir şey kanıtladınız.", en: "You gave Anvil the fight he'd earned. Both of you proved something in that circle." }
          - id: "tek"
            tur: "gosteris"
            etiket: { tr: "Tek hamlede bitir, acı çekmesin", en: "End it in one move. Spare him the pain" }
            gerekli: { stat: { agi: 70 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -2 }
              - dikkat: 3
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
            kronik: { tr: "Örs'ü daha balyozunu kaldıramadan tek hamlede yere serdin. O dövüşü kimse anlatamadı, çünkü kimse görmedi.", en: "You put Anvil down in one move before he could even lift the sledge. Nobody could tell the story of that fight, because nobody saw it." }
            sonraki: "lonca_2_zafer"

      - id: "lonca_2_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Örs'ün balyozu çelik zemine düşüyor, sesi haddehanenin çatısında uzun uzun çınlıyor. Örs dizlerinin üstüne çökmüş, nefes nefese; kalkmaya çalışmıyor.", en: "Anvil's sledge hits the steel floor and the sound rings around the mill roof for a long time. Anvil's on his knees, breathing hard. He doesn't try to get up." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Dövüş daha başlamadan bitmiş gibi. Örs sırtüstü yatıyor, balyozu iki adım ötede; kalabalık neyi kaçırdığını anlamaya çalışıyor.", en: "The fight's over like it never started. Anvil's flat on his back, his sledge six feet away, and the crowd's trying to figure out what they missed." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Haddehanede çıt çıkmıyor. Ön sırada Örs'ün küçük oğlu turuncu tayın kartını annesinin elinden alıp sımsıkı göğsüne bastırıyor.", en: "The whole mill has gone dead silent. In the front row, Anvil's younger kid takes the orange ration card out of his mom's hand and clutches it tight against his chest." }
          - { tr: "Defterdar tebeşiri sana uzatıyor. Kural belli: Örs'ün adını sil, kendi adını yaz.", en: "The Ledger holds out the chalk. The rule's clear: wipe Anvil's name and write yours." }
        secenekler:
          - id: "el"
            etiket: { tr: "Örs'e elini uzat, çavuşun olarak kalsın", en: "Offer Anvil a hand. Keep him as your sergeant" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - bayrak: "ors_borclu"
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "Merdiven Günü yendiğin Örs'ü yerden kaldırıp çavuşun olarak yanında tuttun.", en: "On Ladder Day you pulled the beaten Anvil up off the floor and kept him on as your sergeant." }
            sonraki: "lonca_2_son"
          - id: "sok"
            etiket: { tr: "Yamasını herkesin önünde sök", en: "Rip his patch off in front of everyone" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5, insanlik: -3 }
              - bayrak: "ors_kin"
              - itibar: { lonca: 8 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
              - tohum: { olay: "ors_soguk_oda", gecikme: { min: 12, max: 22 }, kosul: { bayrak: "ors_kin" }, hatirlatma: { tr: "Merdiven Günü'nde yaptığın şey Lonca'nın defterine geçti.", en: "What you did on Ladder Day went into the Guild's books." } }
            kronik: { tr: "Örs'ün yamasını herkesin gözü önünde söktün. Lonca alkışladı; adamın çocuklarının ısıtmalı odası o hafta başkasına verildi.", en: "On Ladder Day you ripped Anvil's patch off in front of everyone. The Guild cheered, and that week his kids' heated room went to someone else." }
            sonraki: "lonca_2_son"
          - id: "reform"
            tur: "gosteris"
            etiket: { tr: "\"Bugünden sonra basamak kaybeden aç kalmayacak.\"", en: "\"From today on, nobody who loses a rung goes hungry.\"" }
            gerekli: { stat: { cha: 55 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 4 }
              - bayrak: "ors_borclu"
              - bayrak: "lonca_rutbe_reformu"
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 6, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 6, guven: -1 } }
            kronik: { tr: "Merdiven Günü'nün kuralını yeniden yazdın: bundan böyle basamak kaybeden aç kalmayacaktı.", en: "You rewrote the rule of Ladder Day: from then on, losing a rung wouldn't mean going hungry." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_hepsi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çemberin ortasına yürüyüp Pano'daki bütün subayların adını tek tek okuyorsun. Kalabalık önce gülüyor; derken Örs balyozunu kapıp çembere giriyor ve gülüşmeler kesiliyor.", en: "You walk into the middle of the circle and read off the name of every officer on the Board, one by one. The crowd laughs at first. Then Anvil picks up his sledge and steps into the circle, and the laughing stops." }
          - { tr: "Çemberin içinde on bir kişi var; balyozlar, zıpkınlar, kapı zırhları... Bir dakika sonra on biri de tebeşir çizgisinin dışında, yerde.", en: "Eleven people in the circle. Sledges, harpoons, Gate armor. One minute later, all eleven are on the floor outside the chalk line." }
          - metin: { tr: "Kantinde sana gülen iki çavuş da o on bir kişinin arasında. Kalkarken ikisi de gözünü yerden ayırmıyor.", en: "The two sergeants who laughed at you in the mess hall are part of that eleven. Neither of them looks up off the floor as they get to their feet." }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Balkonda {npc:kaya_demir|in} elleri parmaklığı kavramış. Yüzünde hayranlık var, ama altında ilk kez başka bir şey de beliriyor: zapt edemeyeceği bir silahı ilk kez gören bir askerin bakışı.", en: "Up on the balcony, {npc:kaya_demir|pos} hands tighten on the rail. There's admiration on his face. But under it, for the first time, something else: the look of a soldier seeing a weapon he can't control." }
            kosul: { npc_hayatta: "kaya_demir" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Merdiven: 11 meydan okuma · 11 galibiyet]", en: "[Ladder: 11 challenges · 11 wins]" }
            satirlar:
              - { tr: "Toplam süre: 58 saniye.", en: "Total time: 58 seconds." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Örs'ü yerden kaldır", en: "Pull Anvil up off the floor" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - bayrak: "ors_borclu"
              - iliski: { kaya_demir: { guven: 2 } }
            kronik: { tr: "On bir subayı yere serdikten sonra eğilip Örs'ü yerden kaldırdın; o eli bütün haddehane gördü.", en: "After you put eleven officers on the floor, you bent down and pulled Anvil back up. The whole mill saw that hand." }
            sonraki: "lonca_2_son"
          - id: "birak"
            etiket: { tr: "Hepsini yerde bırak, Pano'ya yürü", en: "Leave them all on the floor. Walk to the Board" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - bayrak: "ors_kin"
              - itibar: { lonca: 4 }
              - tohum: { olay: "ors_soguk_oda", gecikme: { min: 12, max: 22 }, kosul: { bayrak: "ors_kin" }, hatirlatma: { tr: "Merdiven Günü'nde yaptığın şey Lonca'nın defterine geçti.", en: "What you did on Ladder Day went into the Guild's books." } }
            kronik: { tr: "On bir subayı yerde bırakıp Pano'ya yürüdün. Lonca o yürüyüşü hayranlıkla, Örs ise kinle izledi.", en: "You left eleven officers on the floor and walked to the Board. The Guild remembered that walk with awe. Anvil remembered it with a grudge." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_yeni"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehane bir an ne yapacağını bilemiyor. Bugüne kadar Merdiven Günü'nde kimse yeni bir basamak istememiş, herkes hep birinin basamağını almış.", en: "For a second, the whole mill doesn't know what to do. Nobody on Ladder Day has ever asked for a rung before. Everybody's always just taken somebody else's." }
          - metin: { tr: "Balkondan {npc:kaya_demir|in} sesi geliyor: \"Defterdar. Pano'ya, Örs'ün üstüne bir satır çiz.\" Kalabalıktan bir uğultu yükseliyor. \"Komutan Yardımcısı. Benimle o satırın arasında kimse yok.\"", en: "{npc:kaya_demir|pos} voice comes down from the balcony: \"Ledger. Draw a line on the Board above Anvil.\" A murmur goes through the crowd. \"Executive Officer. There's nobody between me and that line.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyi bir süre fısıldaşıyor; ardından en yaşlıları ayağa kalkıp Defterdar'a Pano'ya yeni bir satır çizmesini söylüyor.", en: "The officer council whispers for a minute. Then the oldest of them stands up and tells the Ledger to draw a new line on the Board." }
            kosul: { npc_olu: "kaya_demir" }
          - { tr: "Örs çemberin kenarında, balyozu hâlâ omzunda, sana bakıyor. Sonra bir dikişin tuttuğuna kanaat getiren bir kaynakçı gibi ağır ağır başını sallıyor.", en: "Anvil stands at the edge of the circle, sledge still on his shoulder. He looks at you. Then, very slowly, the way a welder decides a seam is going to hold, he nods." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Örs'e selam ver", en: "Salute Anvil" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { kaya_demir: { guven: 2 } }
            kronik: { tr: "Merdiven Günü kimsenin basamağını almadan zirveye çıkıp Örs'e selam verdin; o selamı haddehanede görmeyen kalmadı.", en: "On Ladder Day you made the top without taking anybody's rung, and you saluted Anvil. Everybody in the mill saw it." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_bilerek"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs'ün balyozu üçüncü kez geldiğinde karşılamıyorsun. Darbe omzuna inince tebeşir çizgisinin dışına, çeliğin üstüne yuvarlanıyorsun. Kalabalıktan bir uğultu kopuyor; çoğu sevinç, biraz da hayal kırıklığı.", en: "The third time Anvil's sledge comes in, you don't meet it. It hits your shoulder and you roll out of the chalk circle onto the steel floor. The crowd roars, mostly joy, a little disappointment." }
          - { tr: "Örs başucunda durup elini uzatıyor. Seni yerden kaldırırken kulağına eğiliyor: \"Gördüm,\" diyor. \"Bunu unutmam.\"", en: "Anvil stands over you and holds out a hand. As he pulls you up, he leans in to your ear. \"I saw that,\" he says. \"I won't forget it.\"" }
          - metin: { tr: "Balkonda {npc:kaya_demir} kollarını kavuşturmuş. Kalabalık dağılırken seni yukarı çağırıyor. \"Bilerek kaybettin,\" diyor. \"Güzel. Senden gördüğüm ilk subay kararı bu.\"", en: "Up on the balcony, {npc:kaya_demir} has his arms crossed. As the crowd breaks up, he waves you up. \"You lost on purpose,\" he says. \"Good. That's the first officer's decision I've ever seen you make.\"" }
            kosul: { npc_hayatta: "kaya_demir", iliski_min: { kaya_demir: { saygi: 25 } } }
          - metin: { tr: "Kalabalık dağılırken Defterdar seni bir kenara çekip Pano'yu gösteriyor. Örs'ün adı yine en üstte, ama hemen altına yeni bir satır çizilmiş: KAPI KOMUTANI. Yanında senin adın yazıyor. \"Katkı da sayılır,\" diyor.", en: "As the crowd breaks up, the Ledger pulls you aside and points at the Board. Anvil's name is still on top, but right under it there's a new line: GATE COMMANDER. Your name's on it. \"Contribution counts too,\" she says." }
            kosul: { iliski_max: { kaya_demir: { saygi: 24 } } }
        secenekler:
          - id: "sus"
            etiket: { tr: "Bir şey söyleme, omzunu ovuştur", en: "Say nothing. Rub your shoulder" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - itibar: { lonca: 4 }
            kronik: { tr: "Örs'e bilerek yenildin ve Kapı Komutanı rütbesini sesini çıkarmadan taktın. Adamın çocukları ısıtmalı odalarında kaldı.", en: "On Ladder Day you lost on purpose and quietly pinned on the Gate Commander rank. Anvil's kids kept their heated room." }
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "\"Onun çocuklarının odası benim rütbemden önemli.\"", en: "\"His kids' room matters more than my rank.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2, duzen: -1 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
            kronik: { tr: "Merdiven Günü'nden sonra {npc:kaya_demir|e} neden kaybettiğini açık açık söyledin. Lonca'nın meritokrasisi o gün ilk kez bir çocuğun odasını hesaba kattı.", en: "After Ladder Day you told {npc:kaya_demir} straight out why you'd lost. That day, for the first time, the Guild's meritocracy made room for a kid's bedroom." }
            sonraki: "@akis"

      - id: "lonca_2_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs'ün balyozu göğsüne inince çemberin dışına, çeliğin üstüne savruluyorsun. Bu kez rol yapmıyorsun; haddehanenin çatısı bir an başının üstünde dönüyor.", en: "Anvil's sledge lands on your chest and throws you out of the circle onto the steel floor. This time you're not faking it. The mill roof spins for a second." }
          - { tr: "Örs nefes nefese başucunda durup elini uzatıyor. \"Bugün değil,\" diyor. Bu sözü kimden öğrendiği belli.", en: "Anvil stands over you, breathing hard. He holds out a hand. \"Not today,\" he says. You can tell exactly who he learned that line from." }
          - { tr: "Defterdar Pano'da Örs'ün hemen altına yeni bir satır çiziyor: KAPI KOMUTANI. \"Merdivende kaybettin,\" diyor. \"Ama kapılarda hiç kaybetmedin. Katkı da sayılır.\"", en: "The Ledger draws a new line on the Board, just under Anvil: GATE COMMANDER. \"You lost on the ladder,\" she says. \"You never lost in a Gate. Contribution counts too.\"" }
        secenekler:
          - id: "el_tut"
            etiket: { tr: "Örs'ün elini tut, kalk", en: "Take Anvil's hand and get up" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - degisken: { lonca_rutbe: 1 }
              - bayrak: "ors_borclu"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
            kronik: { tr: "Merdiven Günü çemberde Örs'e yenildin; seni yere seren adamın uzattığı eli tutup ayağa kalktın.", en: "On Ladder Day Anvil beat you, and you took the hand he held out and got up." }
            sonraki: "@akis"
          - id: "rovans"
            etiket: { tr: "\"Bir sonraki Merdiven Günü'nde görüşürüz.\"", en: "\"See you next Ladder Day.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - degisken: { lonca_rutbe: 1 }
              - stat: { str: 3 }
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - itibar: { lonca: 3 }
            kronik: { tr: "Merdiven Günü çemberde Örs'e yenildin; kalkarken ona bir sonraki Merdiven Günü için rövanş sözü verdin.", en: "Anvil beat you, and you promised him a rematch next Ladder Day." }
            sonraki: "@akis"

      - id: "lonca_2_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çemberin kenarında durup içeri adım atmıyorsun. Haddehane uğulduyor; birkaç kişi ıslık çalıyor, birkaçı da gülüyor.", en: "You stand at the edge of the circle and don't step in. The mill starts buzzing. A few people whistle. A few laugh." }
          - metin: { tr: "{npc:kaya_demir} balkondan inip yanına geliyor. \"Rütbe oyun değildir,\" diyor alçak sesle. \"Rütbe, insanların kimin uğruna ölmeye razı olduğudur. Bu çemberden çıkarsan bu insanlar senin için ölmez.\"", en: "{npc:kaya_demir} comes down from the balcony and walks up next to you. \"Rank isn't a game,\" he says quietly. \"Rank is who people are willing to die for. Walk away from this circle, and these people won't die for you.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Defterdar yazı altlığını indiriyor. \"Rütbe oyun değildir,\" diyor. \"Başçavuş hep böyle derdi. Rütbe, insanların kimin uğruna ölmeye razı olduğudur.\"", en: "The Ledger lowers her clipboard. \"Rank isn't a game,\" she says. \"The Gunny always used to say that. Rank is who people are willing to die for.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "gir"
            etiket: { tr: "Çembere gir", en: "Step into the circle" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Merdiven Günü önce geri durdun, sonra çembere girdin. Lonca'nın aklında tereddüdün değil, o adım kaldı.", en: "On Ladder Day you refused once, then stepped into the circle. The Guild remembered the step, not the hesitation." }
            sonraki: "lonca_2_cember"
          - id: "git"
            etiket: { tr: "Haddehaneden çık", en: "Walk out of the mill" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_merdiven_reddi"
              - itibar: { lonca: -8 }
              - iliski: { kaya_demir: { saygi: -3, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 35 }
            kronik: { tr: "Merdiven Günü haddehaneden çıkıp gittin; Lonca'nın merdiveni senin için orada bitti.", en: "On Ladder Day you walked out of the rolling mill, and the Guild's ladder ended for you right there." }
            sonraki: "@akis"

      - id: "lonca_2_son"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:kaya_demir} balkondan inerken kalabalık ona yol açıyor. Cebinden bir rütbe işareti çıkarıyor, turuncu yamanın üstüne dikilecek iki çelik çizgi. İşareti kendi eliyle omzuna tutturuyor.", en: "{npc:kaya_demir} comes down off the balcony and the crowd parts for him. He pulls a rank insignia out of his pocket, two steel bars to go on top of the orange patch, and pins it to your shoulder with his own hand." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Komutan Yardımcısı,\" diyor, bütün haddehane duysun diye. Ardından yalnızca senin duyabileceğin bir sesle ekliyor: \"Benden sonra bu masa senin. Ama benden sonra asker, benden önce değil.\"", en: "\"Executive Officer,\" he says, loud enough for the whole mill to hear. Then, low enough that only you can hear: \"After me, this table's yours. After me, kid. Not before.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyinin en yaşlısı rütbe işaretini sana getiriyor. \"Başçavuş burada olsaydı bunu kendi eliyle takardı,\" diyor. \"Bizim işimiz yalnızca uzatmak.\"", en: "The oldest officer on the council brings you the insignia. \"If the Gunny were here, he'd pin it on you himself,\" she says. \"We're just handing it over.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - { tr: "Defterdar Pano'nun en üst satırını silip tebeşiri sana uzatıyor.", en: "The Ledger wipes the top line of the Board clean and holds the chalk out to you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "'b̷enden sonra.' bunu söyleyen herkes o an biraz daha uzun yaşamayı planlıyordur.", en: "'a̷fter me.' everybody who says that is planning to live a little longer while they say it." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını yaz", en: "Write your name" }
            etkiler:
              - ahlak: { duzen: 4 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 8 }
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { baglilik: 5, guven: 3 } }
            kronik: { tr: "Merdiven Günü'nün sonunda adını Pano'nun en üstüne kendi elinle yazdın; Lonca o gün bir komutan yardımcısı kazandı.", en: "At the end of Ladder Day you wrote your name at the top of the Board with your own hand. That day the Guild got itself an XO." }
            sonraki: "@akis"
          - id: "pano_yeniden"
            etiket: { tr: "Pano'nun tamamını sil, yeniden diz", en: "Wipe the whole Board and rank it yourself" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 10 }
              - dikkat: 2
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 5, korku: 4, guven: -4 } }
            kronik: { tr: "Pano'nun tamamını silip Lonca'yı kendi elinle yeniden sıraladın; o gün Lonca'nın rütbeleri {npc:kaya_demir|in} değil, senin tebeşirinle yazıldı.", en: "On Ladder Day you wiped the whole Board and re-ranked the Guild yourself. That day the Guild's ranks were written in your chalk, not {npc:kaya_demir|pos}." }
            sonraki: "@akis"
          - id: "destege"
            etiket: { tr: "Adını yaz, altına Destek sütununu taşı", en: "Write your name. Move the Support column right under it" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { lonca_rutbe: 1, hayatta_kalan: 2 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 4, siginak: 3 }
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Adını Pano'nun tepesine, Destek sütununu da hemen altına yazdın. Lonca o gün en zayıflarını en güçlüsünün gölgesine aldı.", en: "You put your name at the top of the Board and the Support column right underneath it. That day the Guild took its weakest under the shadow of its strongest." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 3 — MAVİ ÇAPA (P3)
  - id: "lonca_3_rakip_bastirma"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 181, max: 275 }
    kosul: { bayrak: "lonca_2_tamam", bayrak_yok: ["lonca_dusmani", "lonca_3_tamam"] }
    agirlik: 9
    etiketler: ["lonca", "zincir", "ahlak", "liman"]
    gerilim: 4
    onemli: true
    kart: { tr: "Tek Bayrak", en: "One Banner" }
    sahne: "lonca_3_rakip_bastirma_1"
    sahneler:
      - id: "lonca_3_rakip_bastirma_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin harekât odası eski kontrol kabininin camlarının ardında. Duvardaki {yer:kiyikent} haritasının üstüne yeni bir kararname iğnelenmiş: TEK BAYRAK. Şehirdeki her avcı Lonca'ya kayıt olacak, Kule'nin otuzuncu katından yukarısına ancak Lonca'nın izniyle tırmanılacak.", en: "The mill's operations room sits behind the glass of the old control booth. On the wall: a map of {yer:kiyikent} and, pinned over it, a new decree. ONE BANNER. Every hunter in the city registers with the Guild. Anything above the Spire's thirtieth floor gets climbed with Guild permission, or not at all." }
          - { tr: "İmzalamayan tek lonca Mavi Çapa. {yer:kiyikent_liman|in} eski hamallarından, römorkörcülerinden ve balıkçılarından kurulmuş bu avcı loncası kendi kapısını kendi kapatır, ölüsünü kendi gömer. Masadaki ihbara göre Çapa, Kadim simsarlarına kule kristali satıyormuş.", en: "One guild didn't sign: the Blue Anchor. Longshoremen, tug crews and fishermen off {yer:kiyikent_liman} who close their own Gates and bury their own dead. There's a tip on the table: the Anchor's been selling Spire crystals to Ancient brokers." }
          - metin: { tr: "{npc:kaya_demir} ihbarı önüne itiyor. \"Kadimler körfezde demirlemiş, bu adamlar da onlara kristal satıyor,\" diyor. \"Reis'i bu gece getir, Çapa'yı dağıt. Nasıl yapacağın seni ilgilendirir; yapılıp yapılmadığı beni.\"", en: "{npc:kaya_demir} slides the tip across to you. \"The Ancients are anchored in the bay and these people are selling them crystals,\" he says. \"Bring me the Harbormaster tonight. Break up the Anchor. How you do it is your business. That it gets done is mine.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Emri subay konseyi oy birliğiyle vermiş, Defterdar yüksek sesle okuyor: \"Bu gece. Reis'i getir, Çapa'yı dağıt. Başçavuş olsa beklemezdi.\"", en: "The officer council voted the order unanimously, and the Ledger reads it out. \"Tonight. Bring in the Harbormaster, break up the Anchor. The Gunny wouldn't have waited.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Kabinin camından körfez görünüyor. {npc:thessar|in} gemisi hâlâ orada, suyun üstünde kıpırtısız duruyor; ışıkları kirpik kırpan bir göz gibi açılıp kapanıyor.", en: "Through the booth glass you can see the bay. {npc:thessar|pos} ship is still out there, sitting on the water without moving an inch, its lights opening and closing like an eyelid." }
            kosul: { bayrak: "thessar_indi" }
        sezgiler:
          - kosul: { stat: { per: 100 } }
            metin: { tr: "İhbarın mürekkebi Defterdar'ın kaleminden, kâğıdı Lonca'nın kendi kâğıdı. On dört ismin yalnız birinin yanındaki tarih gerçek bir kristal satışıyla örtüşüyor.", en: "The ink on the tip matches the Ledger's pen. The paper is Guild paper. Of the fourteen names on it, only one has a date next to it that lines up with a real crystal sale." }
          - kosul: { stat: { wil: 130 } }
            metin: { tr: "Mavi Çapa'nın bütün avcılarını tek bir salonda gözünün önüne getiriyorsun. Hepsini birden yere sermek için silah çekmen bile gerekmez. Bunu biliyorsun ve bilmek, yapmaktan da korkutucu.", en: "You picture every hunter the Blue Anchor has, all in one room. You wouldn't even need to draw a weapon to put them all on the floor. You know that. Knowing it is scarier than doing it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "t̷ek bayrak. bir avcı loncası daha yutulacak. yutulan her şey yutanı biraz daha büyütür; sonunda yutacak bir şey kalmaz.", en: "o̷ne banner. one more guild gets swallowed. everything that gets swallowed makes the swallower a little bigger. eventually there's nothing left to eat." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bunlar liman işçileri. Babam onlarla çay içerdi. Bunu yapma.\"", en: "\"These are dockworkers. My dad used to drink coffee with these guys. Don't do this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Şu ihbara bir bakayım. Kâğıt fazla temiz; gerçek ihbar kirli olur.\"", en: "\"Let me look at that tip. Paper's too clean. Real tips are always dirty.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çapa'nın revirine her hafta ilaç yolluyorum. Kadimler'e kristal satsalardı benden ilaç istemezlerdi.\"", en: "\"I send medicine to the Anchor's infirmary every week. If they were selling to the Ancients, they wouldn't need it from me.\"" }
        secenekler:
          - id: "bas"
            etiket: { tr: "Salonu bas; Çapa'yı zorla dağıt", en: "Raid the hall. Break the Anchor by force" }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 6, merhamet: -6, insanlik: -3 }
              - itibar: { lonca: 6, siginak: -4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "İhbarı kimin yazdığını sormadan {yer:kiyikent_liman|e} indin ve Mavi Çapa'nın salonunu Lonca'nın bayrağıyla bastın.", en: "You raided the Blue Anchor's hall under the Guild's banner and never asked who wrote the tip." }
            sonraki: "lonca_3_baskin"
          - id: "duello"
            etiket: { tr: "Reis'e düello teklif et: kazanan bayrağı seçer", en: "Offer the Harbormaster a duel. Winner picks the banner" }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Mavi Çapa'yla savaşa girmek yerine Reis'ini {yer:kiyikent_liman|in} gözü önünde bire bir düelloya çağırdın; dökülecek kan varsa yalnız ikinizin olacaktı.", en: "Instead of going to war with the Blue Anchor, you called its Harbormaster out for a one-on-one duel. If blood had to spill, it would be only his and yours." }
            sonraki: "lonca_3_duello"
          - id: "aura"
            tur: "gosteris"
            etiket: { tr: "Salona tek başına gir; kimse silah çekemesin", en: "Walk into the hall alone. Nobody gets to draw" }
            gerekli: { stat: { wil: 130 } }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 5, insanlik: -4 }
              - dikkat: 5
              - iliski: { kaya_demir: { saygi: 6, korku: 5 } }
            kronik: { tr: "Mavi Çapa'nın salonuna tek başına, silahsız girdin; kimse silah çekemedi ve koca bir lonca tek damla kan akmadan diz çöktü.", en: "You walked into the Blue Anchor's hall alone and unarmed, and nobody could draw on you. A whole guild went to its knees without a drop of blood spilled." }
            sonraki: "lonca_3_aura"
          - id: "arastir"
            etiket: { tr: "Önce ihbarı araştır", en: "Look into the tip first" }
            gerekli: { stat: { per: 100 } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - bilgi: "capa_sahte_ihbar"
              - iliski: { kaya_demir: { guven: -2 } }
            kronik: { tr: "Mavi Çapa'ya gitmeden önce ihbarın kâğıdını, mürekkebini, tarihlerini tek tek okudun ve içinde Lonca'nın kendi kalemini buldun.", en: "Before you went anywhere near the Blue Anchor, you read the tip's paper, its ink and its dates. You found the Guild's own pen in it." }
            sonraki: "lonca_3_ihbar"
          - id: "uyar"
            tur: "gizle"
            etiket: { tr: "Reis'i gizlice uyar; şehirden kaçsınlar", en: "Quietly warn the Harbormaster. Get them out of town" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -5 }
              - gizle: 2
            kronik: { tr: "Lonca baskına gelmeden Mavi Çapa'yı gizlice uyardın; {yer:kiyikent_liman|in} tekneleri şafaktan önce ışıklarını yakmadan açıldı.", en: "You quietly tipped off the Blue Anchor before the Guild could hit them. The Waterfront's boats slipped out before dawn with their lights off." }
            sonraki: "lonca_3_uyari"
          - id: "reddet"
            etiket: { tr: "\"Bu emri uygulamayacağım.\"", en: "\"I'm not carrying out this order.\"" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 3 }
              - iliski: { kaya_demir: { saygi: 2, guven: -5 } }
            kronik: { tr: "Mavi Çapa'yı dağıtma emrini subayların gözünün içine bakarak reddettin.", en: "You refused the order to break up the Blue Anchor to their faces." }
            sonraki: "lonca_3_red"

      - id: "lonca_3_baskin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mavi Çapa'nın salonu eski balık mezatı: tuz kokan sundurmalar, yükleme kancaları, suyun üstüne çakılmış tahta iskeleler. Lonca'nın zırhlı mangası arkanda. Kapılar kırılınca içeride zıpkınlarını hazır tutan elli avcıyla karşılaşıyorsun.", en: "The Blue Anchor's hall is the old fish auction: salt-stained awnings, loading hooks, wooden piers built out over the water. The Guild's armored squad is right behind you. When the doors come down, fifty hunters are waiting inside with harpoons." }
          - { tr: "Mezat kürsüsünün ardından iri, sakallı bir adam doğruluyor; omzunda römorkör halatı, elinde gemi zinciri. \"Kaptanınıza söyleyin,\" diyor, \"bu limanın zaten bir kaptanı var.\"", en: "A big bearded man gets up from behind the auction podium, tug line over his shoulder, anchor chain in his fist. \"Tell your captain,\" he says, \"this harbor's only got room for one.\"" }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Saldır", en: "Attack" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - savas: { dusmanlar: ["capa_avcisi@dunya", "capa_avcisi@dunya", "liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Mavi Çapa'nın mezat salonunda Reis'in avcılarının üstüne yürüdün; Lonca'nın zırhlarıyla Çapa'nın zıpkınları suyun üstündeki iskelelerde karşılaştı.", en: "You went at the Harbormaster's hunters in the Blue Anchor's auction hall. Guild armor met Anchor harpoons out on the piers over the water." }
          - id: "son_sans"
            etiket: { tr: "Son bir kez teslim olmalarını iste", en: "Give them one last chance to surrender" }
            gerekli: { stat: { cha: 110 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Baskının ortasında Mavi Çapa'nın avcılarına son bir şans tanıdın; çoğu zıpkınını yere bıraktı, bir tek Reis bırakmadı.", en: "In the middle of the raid you gave the Blue Anchor's hunters one last chance. Most of them dropped their harpoons. Only the Harbormaster didn't." }

      - id: "lonca_3_baskin_sonu"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Reis zincirini elinden bırakmadan mezat salonunun ıslak tahtalarına yığılıyor. Avcılarından kıpırdayan yok. Sundurmaların altında denizin sesinden başka ses kalmamış.", en: "The Harbormaster slumps onto the wet boards of the auction hall, chain still in his hand. His hunters don't move. Under the awnings there's nothing but the sound of the sea." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Lonca'nın mangası daha kapıdan adımını atmadan dövüş bitiyor. Reis bir dizinin üstüne çökmüş, şaşkın. Zıpkınlarını yere bırakan avcıları sana bir insana değil de bir hava olayına bakar gibi bakıyor.", en: "The fight's over before the Guild squad gets through the door. The Harbormaster's down on one knee, stunned, and his hunters have dropped their harpoons. They're looking at you like you're weather, not a person." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Lonca'nın zırhlıları salona doluşuyor. Mangadan biri Reis'i ensesinden kavrayıp dizüstü çöktürüyor, sonra emir bekleyerek sana dönüyor.", en: "The Guild's armored squad floods the hall. One of them grabs the Harbormaster by the back of the neck, forces him onto his knees, and looks at you. Waiting for the order." }
        secenekler:
          - id: "infaz"
            etiket: { tr: "Kadimler'e satanların cezasını ver: infaz et", en: "Give him a traitor's sentence. Execute him" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4, insanlik: -5 }
              - bayrak: "capa_ezildi"
              - bayrak: "capa_reisi_infaz"
              - efsane: "acimasiz_infaz_tanikli"
              - degisken: { hayatta_kalan: -2, kadim_tehdit: -3 }
              - itibar: { lonca: 10, siginak: -8 }
              - iliski: { kaya_demir: { saygi: 6, korku: 6 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'nın Reis'ini kendi mezat salonunda, avcılarının gözü önünde infaz ettin; o gece {yer:kiyikent_liman} başını öne eğdi.", en: "You executed the Blue Anchor's Harbormaster in his own auction hall, in front of his hunters. That night {yer:kiyikent_liman} bowed its head." }
            sonraki: "@akis"
          - id: "hapis"
            etiket: { tr: "Zincire vur, haddehaneye götür", en: "Put him in irons. Take him to the mill" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -2 }
              - bayrak: "capa_ezildi"
              - itibar: { lonca: 6, siginak: -3 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Reis'i kendi zinciriyle bağlayıp Lonca'ya teslim ettin; Mavi Çapa dağıldı, Reis canını kurtardı ama haddehanenin hücresine girdi.", en: "You bound the Blue Anchor's Harbormaster in his own chain and handed him to the Guild. The Anchor broke up. The Harbormaster kept his life and lost his freedom." }
            sonraki: "@akis"
          - id: "yut"
            etiket: { tr: "\"Bundan sonra benim bayrağımın altındasınız.\"", en: "\"From now on, you're under my banner.\"" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2, merhamet: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 15 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 5, guven: -2 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'yı yendikten sonra dağıtmayıp kendi bayrağının altına aldın; o avcılar artık Lonca'nın değil, senindi.", en: "After you beat the Blue Anchor, you didn't break it up. You took it under your own banner. They became your hunters, not the Guild's." }
            sonraki: "@akis"

      - id: "lonca_3_duello"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis teklifini mezat kürsüsünün başında, bütün loncasının önünde dinliyor. Sonra kahkahayı basıyor: elli yıl körfezde gemi itmiş bir adamın kocaman, tuzlu kahkahası.", en: "The Harbormaster hears your offer standing at the auction podium, in front of his whole guild. Then he laughs, a big salty laugh from a man who's spent fifty years shoving ships around a bay." }
          - { tr: "\"Ben kazanırsam Lonca {yer:kiyikent_liman|e} bir daha ayak basmaz,\" diyor. \"Sen kazanırsan Çapa senin bayrağını taşır. Bak, senin bayrağını; kaptanınınkini değil.\" Sonra iskelenin en ucuna yürüyor. Altında kapkara, buz gibi su.", en: "\"I win, the Guild never sets foot on {yer:kiyikent_liman} again,\" he says. \"You win, the Anchor flies your banner. Yours, mind you. Not your captain's.\" He walks out to the very end of the pier, black cold water underneath." }
        sezgiler:
          - kosul: { stat: { per: 90 } }
            metin: { tr: "Penceresini olduğundan çok daha küçük gösteriyor. Lonca onu hiç ciddiye almamış; sen alıyorsun. Yine de senin yanında çocuk sayılır.", en: "His window is dialed way down. The Guild never took him seriously. You do. Next to you, he's still a kid." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "İskelenin ucuna yürü", en: "Walk out to the end of the pier" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bilgi: "liman_reisi_seviyesi"
              - savas: { dusmanlar: ["liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_duello_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Mavi Çapa'nın Reis'iyle körfeze uzanan iskelenin ucunda dövüştün; bütün {yer:kiyikent_liman} sundurmaların altından seyretti.", en: "You fought the Blue Anchor's Harbormaster at the end of the pier over the bay, with the whole Waterfront watching from under the awnings." }

      - id: "lonca_3_duello_sonu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis iskelenin tahtalarına çöküyor, zinciri kayıp suya düşüyor. Bir süre denize bakıyor, sonra yine gülüyor; bu kez sesi daha alçak.", en: "The Harbormaster sinks onto the pier planks and his chain slides off into the water. He stares at the sea for a while. Then he laughs again, quieter this time." }
          - { tr: "\"Elli yıl,\" diyor. \"Elli yıl gemi ittim, bir kere de beni ittiler.\" Ayağa kalkıp loncasına dönüyor. \"Duydunuz. Bayrak değiştiriyoruz.\"", en: "\"Fifty years,\" he says. \"Fifty years I pushed ships. Once, I got pushed.\" He gets up and turns to his guild. \"You heard. We're changing flags.\"" }
        secenekler:
          - id: "subayim"
            etiket: { tr: "Reis'i kendi subayın yap", en: "Make the Harbormaster one of your officers" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 20 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Yendiğin Reis'i kendi subayın yaptın; Mavi Çapa Lonca'ya katıldı ama selamını önce sana verdi.", en: "You made the Harbormaster you'd beaten one of your officers. The Blue Anchor joined the Guild, but it saluted you first." }
            sonraki: "@akis"
          - id: "limani_birak"
            etiket: { tr: "\"{yer:kiyikent_liman} sizde kalsın; siz yalnız kayıt olun.\"", en: "\"Keep your docks. Just register.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1, insanlik: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 10 }
              - itibar: { lonca: 4, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -2 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Düelloyu kazandın ama {yer:kiyikent_liman|i} Çapa'ya bıraktın; Tek Bayrak kâğıtta yazılı kaldı, {yer:kiyikent_liman|de} eski bayrak inmedi.", en: "You won the duel but left the docks to the Anchor. One Banner got written down on paper. Down on {yer:kiyikent_liman}, the old flag kept flying." }
            sonraki: "@akis"

      - id: "lonca_3_aura"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mezat salonunun kapısını kırmadan açıyorsun. Elli avcının zıpkınları havaya kalkıyor; sen bir adım atınca uçları, birden ağırlaşmışçasına teker teker aşağı iniyor.", en: "You don't break the auction hall doors. You open them. Fifty hunters raise their harpoons. You take one step, and the harpoon points start dipping one by one, like they've suddenly gotten too heavy to hold." }
          - { tr: "Kimse silahını çekemiyor. Reis kürsünün ardında ayakta kalmaya çalışıyor ama dizleri söz dinlemiyor. Salonda denizin sesiyle avcıların soluklarından başka ses yok.", en: "Nobody can draw. The Harbormaster's trying to stay on his feet behind the podium, and his knees won't listen. The only sounds in the hall are the sea and their own breathing." }
          - { tr: "Mezat kürsüsüne yürüyüp üstüne Lonca'nın turuncu yamasını bırakıyorsun. Tek söz etmene gerek yok.", en: "You walk up to the auction podium and set the Guild's orange patch on top of it. You don't need to say a thing." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Mavi Çapa: teslim oldu]", en: "[The Blue Anchor: surrendered]" }
            satirlar:
              - { tr: "Çatışma: 0. Kayıp: 0. Gözlemlenen tepki: korku (%94).", en: "Engagements: 0. Casualties: 0. Observed response: fear (94%)." }
        secenekler:
          - id: "yama"
            etiket: { tr: "Hepsinin koluna yamayı diktir", en: "Have every one of them sew on the patch" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 25 }
              - itibar: { lonca: 12 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
              - xp_seviye: 90
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'nın elli avcısının koluna turuncu yamayı diktirdin; o günden sonra Çapa'nın değil, senin askerlerindi.", en: "You had every one of the Blue Anchor's fifty hunters sew on the orange patch. From that day on they weren't the Anchor's. They were yours." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Yamayı kürsüde bırakıp çık", en: "Leave the patch on the podium and walk out" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2, insanlik: -1 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 15 }
              - itibar: { lonca: 8 }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Yamayı Mavi Çapa'nın kürsüsünde bırakıp çıktın; ertesi sabah {yer:kiyikent_liman|in} bütün avcıları haddehanenin önünde sıraya girmişti.", en: "You left the patch on the Blue Anchor's podium and walked out. The next morning, every hunter on {yer:kiyikent_liman} was lined up outside the rolling mill." }
            sonraki: "@akis"

      - id: "lonca_3_ihbar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Mürekkep Defterdar'ın kaleminden, kâğıt Lonca'nın kendi kâğıdı. On dört ismin yalnız birinin satışı gerçek: kule kristallerini bir Kadim simsarına satan, borca batmış bir zıpkıncı.", en: "The ink is the Ledger's pen, and the paper is Guild paper. Of the fourteen names, only one sale is real: a single harpooner, buried in debt, who sold Spire crystals to an Ancient broker." }
          - metin: { tr: "Defterdar'ı arşivde buluyorsun; başını kaldırmadan konuşuyor. \"Emri Başçavuş verdi. 'Bir loncayı dağıtmaya tek adam yetmez,' dedi. 'On dört adam yeter.'\"", en: "You find the Ledger in the archive. She doesn't look up. \"The Gunny gave the order,\" she says. \"One man isn't enough to break a guild, he said. Fourteen is.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Defterdar'ı arşivde buluyorsun; başını kaldırmadan konuşuyor. \"Konsey istedi. Bir loncayı dağıtmaya tek adam yetmez, on dört adam yeter.\"", en: "You find the Ledger in the archive. She doesn't look up. \"The council wanted it,\" she says. \"One man isn't enough to break a guild. Fourteen is.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Sahte ihbarı Pano'nun önünde ifşa et", en: "Expose the forged tip in front of the Board" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2, merhamet: 2 }
              - bayrak: "capa_adalet"
              - itibar: { lonca: 2, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: -6 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Lonca'nın sahte ihbarını Pano'nun önünde açığa çıkardın; 'Pano'da yalan olmaz' kuralı ilk kez onu yazanların aleyhine işledi.", en: "You exposed the Guild's forged tip in front of the Board. The meritocracy's own rule, 'no lies on the Board,' worked against the people who wrote it for the first time." }
            sonraki: "lonca_3_adalet"
          - id: "koz"
            etiket: { tr: "Bunu sakla; kozun olsun", en: "Keep it to yourself. Hold it as leverage" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - bayrak: "kaya_sirri_elde"
              - bayrak: "capa_adalet"
              - itibar: { lonca: 4 }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Sahte ihbarı kimseye göstermedin, bir koz olarak cebine koydun; günü gelince masaya sürecektin.", en: "You didn't show the forged tip to anyone. You pocketed it as leverage, to play when the time came." }
            sonraki: "lonca_3_adalet"
          - id: "yalniz_suclu"
            etiket: { tr: "Yalnızca gerçek satıcıyı tutukla", en: "Arrest only the man who actually sold" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "capa_adalet"
              - degisken: { kadim_tehdit: -2 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "On dört isimlik ihbardan yalnız gerçekten suçlu olan adamı tutukladın; Lonca bir loncayı yutamadı ama bir haini yakaladı.", en: "Out of fourteen names on the tip, you arrested only the one man who was actually guilty. The Guild didn't get to swallow a guild, but it did catch a traitor." }
            sonraki: "lonca_3_adalet"

      - id: "lonca_3_adalet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ertesi gün Reis haddehaneye kendi ayağıyla geliyor. Omzunda halat yok bu kez, elinde Mavi Çapa'nın kayıt defteri. \"Duyduk,\" diyor. \"Bir adamımızı sattınız, on üçünü kurtardınız.\"", en: "The next day the Harbormaster shows up at the mill himself. No tug line on his shoulder this time, just the Blue Anchor's register in his hand. \"We heard,\" he says. \"You gave up one of ours. You saved thirteen.\"" }
          - { tr: "Defteri masaya bırakıyor. \"Tek Bayrak'a imza atıyoruz. Ama Lonca'nın değil, senin imzanın altına.\"", en: "He sets the register on the table. \"We'll sign One Banner. Under your signature. Not the Guild's.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Defteri kabul et", en: "Accept the register" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 20 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Mavi Çapa kayıt defterini kendi eliyle sana getirdi; {yer:kiyikent_liman} Lonca'ya korkudan değil, sana güvendiği için katıldı.", en: "The Blue Anchor brought you its own register. The Waterfront joined the Guild out of trust in you, not fear." }
            sonraki: "@akis"

      - id: "lonca_3_uyari"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı {yer:kiyikent_liman|e} tek başına iniyorsun. Reis seni mezat salonunun arka kapısında karşılıyor ve sen konuşurken ağzını açmıyor.", en: "At midnight you go down to {yer:kiyikent_liman} alone. The Harbormaster meets you at the back door of the auction hall and doesn't say a word while you talk." }
          - { tr: "Şafak sökmeden Mavi Çapa'nın bütün tekneleri ışıklarını yakmadan, sessizce körfezden süzülüp gidiyor. Sabah salona dalan Lonca mangası içeride tuzdan, ağlardan ve boş bir kürsüden başka şey bulamıyor.", en: "Before dawn, every one of the Blue Anchor's boats slips out of the bay, lights off, dead quiet. When the Guild squad hits the hall in the morning, all they find is salt, nets and an empty podium." }
          - { tr: "{npc:kaya_demir} boş salonun ortasında durmuş, gözünü sana dikiyor. \"Birileri geldiğimizi önceden duymuş,\" diyor.", en: "{npc:kaya_demir} stands in the middle of the empty hall and looks at you. \"Somebody heard us coming,\" he says." }
        secenekler:
          - id: "yalan"
            etiket: { tr: "\"Ben vardığımda salon zaten boştu.\"", en: "\"The hall was already empty when I got here.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2, insanlik: -1 }
              - yalan: { npc: "kaya_demir", konu: "capa_kacis_yalani" }
              - bayrak: "capa_kacti"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'yı kurtarmak için {npc:kaya_demir|in} yüzüne baka baka yalan söyledin; o yalanı artık sen taşıyacaktın.", en: "To save the Blue Anchor you lied to {npc:kaya_demir|pos} face. From then on, that lie was yours to carry." }
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "\"Onları ben uyardım.\"", en: "\"I warned them.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - bayrak: "capa_kacti"
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { guven: 4, saygi: 4, baglilik: -4 } }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'yı senin uyardığını {npc:kaya_demir|e} açık açık söyledin; sana uzun uzun baktı, sonra 'Hiç değilse yalan söylemedin' dedi.", en: "You told {npc:kaya_demir} straight out that you'd warned the Blue Anchor. He stared at you a long time, then said, 'At least you didn't lie.'" }
            sonraki: "@akis"

      - id: "lonca_3_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kontrol kabininde çıt çıkmıyor. Subayların kimi sana, kimi haritaya bakıyor; Defterdar kalemini masaya bırakmış.", en: "Nobody in the control booth says a word. Some of the officers look at you, some at the map. The Ledger's set her pen down." }
          - metin: { tr: "Sonunda {npc:kaya_demir} sesini yükseltmeden konuşuyor: \"Meritokraside emri en güçlü verir. Sen emir vermiyorsun, emir reddediyorsun. Ya bu Lonca'yı yönetmeye hazırsındır ya da onun dışındasındır.\"", en: "\"In a meritocracy, the strongest gives the orders,\" {npc:kaya_demir} finally says, without raising his voice. \"You're not giving orders. You're refusing them. Either you're ready to run this Guild, or you're outside it.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyinin en yaşlısı ağır ağır ayağa kalkıyor. \"Başçavuş derdi ki: güçlü olan ya emir verir ya kenara çekilir.\"", en: "The oldest officer on the council slowly stands up. \"The Gunny used to say: the strong either give orders or get out of the way.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "capa_yaninda"
            etiket: { tr: "{yer:kiyikent_liman|e} in, Çapa'nın yanında dur", en: "Go to {yer:kiyikent_liman}. Stand with the Anchor" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: 4, insanlik: 3 }
              - bayrak: "lonca_dusmani"
              - bayrak: "capa_kacti"
              - itibar: { lonca: -25, siginak: 6 }
              - iliski: { kaya_demir: { guven: -10, saygi: 4 } }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "Lonca'nın emrini reddedip Mavi Çapa'nın yanında durdun; o günden sonra {yer:sanayi|in} kapıları sana kapandı, {yer:kiyikent_liman|in} kapıları açıldı.", en: "You refused the Guild's order and stood with the Blue Anchor. After that, {yer:sanayi}' doors closed to you and {yer:kiyikent_liman|pos} opened." }
            sonraki: "@akis"
          - id: "geri_don"
            etiket: { tr: "\"Peki. O zaman emri ben veririm.\"", en: "\"Fine. Then I'll give the order.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Mavi Çapa emrini önce reddettin, sonra emri kendin vermek için geri döndün.", en: "You refused the Blue Anchor order once, then came back to give the order yourself." }
            sonraki: "lonca_3_rakip_bastirma_1"

      - id: "lonca_3_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis'in çapası iskelenin tahtalarını paramparça edince körfezin buz gibi suyuna gömülüyorsun. Seni sudan Lonca'nın zırhlıları çekip çıkarıyor.", en: "The Harbormaster's anchor smashes through the pier planks and you go under into the cold bay. It's the Guild's armored squad that fishes you out." }
          - { tr: "Reis kıyıda, zinciri omzunda bekliyor. \"{yer:kiyikent_liman} bugün bizim,\" diyor. \"Ama sen buraya sıradan bir asker gibi gelmedin, gördüm. Gel, masaya oturalım.\"", en: "The Harbormaster's waiting on the shore, chain over his shoulder. \"Waterfront's ours today,\" he says. \"But you came down here as more than a soldier. I saw that. We'll sit down and talk.\"" }
        secenekler:
          - id: "masa"
            etiket: { tr: "Masaya otur", en: "Sit down and talk" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - bayrak: "capa_adalet"
              - itibar: { lonca: 2, siginak: 2 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'nın Reis'ine yenilip onunla masaya oturdun; {yer:kiyikent_liman} Lonca'ya kendi şartlarıyla, bir anlaşmayla katıldı.", en: "The Blue Anchor's Harbormaster beat you, and you sat down at the table with him. The Waterfront joined the Guild by treaty, on its own terms." }
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "Mangayı topla, gece yeniden saldır", en: "Regroup the squad and hit them again tonight" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -4 }
              - savas: { dusmanlar: ["capa_avcisi@dunya", "liman_reisi@oyuncu+1"], ortam: ["su", "karanlik"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi_son" }
            kronik: { tr: "Mavi Çapa'ya yenildiğin gece mangayı toplayıp yeniden saldırdın.", en: "The same night the Blue Anchor beat you, you regrouped the squad and went back in." }

      - id: "lonca_3_yenilgi_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İkinci kez de suyu boyluyorsun. Bu sefer seni Reis kendi eliyle çıkarıp iskeleye bırakıyor.", en: "You go under a second time. This time it's the Harbormaster himself who pulls you out and drops you on the pier." }
          - { tr: "\"Yeter,\" diyor. \"Kayıt olacağız. Ama sana değil, şu inadına boyun eğiyoruz.\"", en: "\"Enough,\" he says. \"We'll register. But not because of you. Because of how damn stubborn you are.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 10 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 }, hatirlatma: { tr: "Tek Bayrak'tan sonra Lonca kurallarını çeliğe kazımaya hazırlanıyor.", en: "After the One Flag, the Guild is getting ready to carve its rules into steel." } }
            kronik: { tr: "Mavi Çapa'ya iki kez yenildin ama sonunda inadın kazandı; {yer:kiyikent_liman|de} o gün sana 'suya iki kez giren subay' adını taktılar.", en: "The Blue Anchor beat you twice, and your stubbornness won anyway. That day on {yer:kiyikent_liman}, they started calling you 'the officer who went into the water twice.'" }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 4 — DEMİR YASA (P3)
  - id: "lonca_4_demir_yasa"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 205, max: 318 }
    kosul: { bayrak: "lonca_3_tamam", bayrak_yok: ["lonca_dusmani", "lonca_4_tamam"] }
    agirlik: 9
    etiketler: ["lonca", "zincir", "ahlak", "yasa"]
    gerilim: 3
    onemli: true
    kart: { tr: "Demir Yasa", en: "The Iron Law" }
    sahne: "lonca_4_demir_yasa_1"
    sahneler:
      - id: "lonca_4_demir_yasa_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Harekât odasının masasında kâğıt değil, çelik bir levha duruyor. Üstüne yedi madde kazınmış; döküm ustaları her harfi tek tek çekiçle işlemiş. Başlıkta iki kelime: DEMİR YASA.", en: "On the operations room table there's no sheet of paper. There's a steel plate, with seven articles stamped into it, every letter hammered in by the casters. Two words across the top: IRON LAW." }
          - { tr: "Bir: seviyesi ellinin üstündeki her uyanmış Lonca'nın Kule ve kapı nöbetine yazılır. İki: bütün mahallelerde tayın katkıya göre dağıtılır. Üç: sokağa çıkma yasağı. Dört: Konsey'in oylamaları 'savaş süresince' askıya alınır. Beş: Kadimler'le ticaret ihanettir.", en: "One: every awakened person above level fifty gets assigned to the Guild's Spire and Gate rotation. Two: rations in every district go out by contribution. Three: curfew. Four: Council votes are suspended 'for the duration.' Five: trading with the Ancients is treason." }
          - { tr: "Altıncı madde boş bırakılmış. Yedinci ise ötekilerden küçük harflerle kazınmış: 'Bu yasanın herhangi bir maddesi en güçlünün kararıyla askıya alınabilir.'", en: "Six has been left blank. The seventh article is stamped in smaller letters than the rest: 'Any one article of this law may be suspended by decision of the strongest.'" }
          - metin: { tr: "{npc:kaya_demir} levhayı sana doğru çeviriyor. \"Bu şehir benim adıma değil, senin adına itaat eder,\" diyor. \"Altına senin adın kazınacak. Bu yasanın kalemi sen olacaksın.\"", en: "{npc:kaya_demir} turns the plate toward you. \"This city won't obey my name,\" he says. \"It'll obey yours. Your name goes on the bottom. You're the pen of this law.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Altıncı madde senin,\" diye ekliyor. \"Lojmanlar gecesinde bana bir şey öğrettin. Onu yaz.\"", en: "\"Article six is yours,\" he adds. \"You taught me something the night of the company houses. Write it down.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak: "kaya_akil_hocasi" }
          - metin: { tr: "Subay konseyi levhayı önüne sürüyor. \"Bu şehir bizim adımıza değil, senin adına itaat eder,\" diyor en yaşlıları. \"Altına senin adın kazınacak.\"", en: "The officer council slides the plate over to you. \"This city won't obey us,\" the oldest of them says. \"It'll obey you. Your name goes on the bottom.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Kule'nin ellinci katının ardında açılan geçitten her gün yeni bir şey çıkıyor: yabancı tüccarlar, yabancı hastalıklar, yabancı canavarlar. Şehir bir kural istiyor; hangisi olursa olsun.", en: "Every day something new comes through the passage past the Spire's fiftieth floor: foreign traders, foreign diseases, foreign monsters. The city wants a rule. Any rule." }
            kosul: { bayrak: "cok_evren_acik" }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Yedinci madde bir boşluk değil, bir anahtar. Bütün yasa en güçlünün iznine bağlanmış. En güçlünün kim olduğu yasada yazmıyor; yazmasına gerek de yok.", en: "The seventh article isn't a loophole. It's a key. The whole law hangs on the strongest one's say-so. The law never says who the strongest is. It doesn't need to." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷edinci madde. yırtılabilir köşe. senin için bırakıldı, biliyorsun. bütün yasa sen istisna olasın diye yazılmış.", en: "a̷rticle seven. the corner that tears. it was left for you, you know that. the whole law was written so that you could be the exception." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dördüncü madde benim konseyim demek. Bunu imzalarsan bana yapmış olursun.\"", en: "\"Article four is my council. Sign this, and you're doing it to me.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Seviye elli, öyle mi? Ben ellinin üstündeyim. Beni de yazacaklar, değil mi?\"", en: "\"Level fifty. I'm over fifty. They'd draft me too, wouldn't they?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu yasaya göre telsiz yayını 'izinsiz iletişim' sayılıyor. Yani biz artık yasa dışıyız.\"", en: "\"Under this, radio broadcasts count as 'unauthorized communication.' We're not legal anymore.\"" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "Yasayı olduğu gibi imzala", en: "Sign the law as written" }
            etkiler:
              - ahlak: { duzen: 8, insanlik: -4, merhamet: -3 }
              - bayrak: "demir_yasa_yururlukte"
              - itibar: { lonca: 8, siginak: -8, sessiz_ag: -4 }
              - iliski: { kaya_demir: { saygi: 5, baglilik: 5 } }
            kronik: { tr: "Demir Yasa'yı tek harfine dokunmadan imzaladın; {yer:kiyikent} sıkıyönetimle tanıştı, sokakları senin adınla kapanıp açılmaya başladı.", en: "You signed the Iron Law as written. {yer:kiyikent} met martial law, and its streets opened and closed in your name." }
            sonraki: "lonca_4_ilan"
          - id: "sert"
            etiket: { tr: "Daha sert yaz: ihanetin cezası ölüm, istisnasız", en: "Make it harder: death for treason, no exceptions" }
            etkiler:
              - ahlak: { duzen: 10, merhamet: -8, insanlik: -6 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_sert"
              - unvan: "demir_yasa_kalemi"
              - degisken: { kadim_tehdit: -4 }
              - itibar: { lonca: 12, siginak: -12, sessiz_ag: -6 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
            kronik: { tr: "Yasayı kendi elinle sertleştirdin: ihanetin cezası istisnasız ölümdü ve meydana darağacı kuruldu.", en: "You made the Iron Law harder with your own hand: death for treason, no exceptions. A gallows went up on the square." }
            sonraki: "lonca_4_ilan"
          - id: "muafiyet"
            etiket: { tr: "Altıncı maddeyi yaz: çocuklar, yaşlılar, hekimler muaf", en: "Write article six: kids, elderly and medics exempt" }
            gerekli: { stat: { cha: 120 } }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 5 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_muafiyet"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 6, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 }, elif_sari: { saygi: 4 } }
            kronik: { tr: "Boş bırakılan altıncı maddeye bir muafiyet kazıttın; yasa sertti ama çocukları, yaşlıları ve hekimleri dışarıda tuttu.", en: "You had an exemption stamped into the blank sixth article. The law was hard, but it left kids, the elderly and medics out of it." }
            sonraki: "lonca_4_ilan"
          - id: "cekirdek"
            tur: "gosteris"
            etiket: { tr: "Yasayı Kasaba Çekirdeği'ne kendi elinle yaz", en: "Write the law into {yer:kasaba_cekirdegi} yourself" }
            goster: { bayrak: "cekirdek_lonca" }
            gerekli: { stat: { int: 160 } }
            etkiler:
              - ahlak: { duzen: 8, insanlik: -6 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_sistemde"
              - unvan: "demir_yasa_kalemi"
              - dikkat: 6
              - itibar: { lonca: 12, siginak: -6 }
              - iliski: { kaya_demir: { saygi: 8, korku: 6 }, yanki: { guven: 4 } }
            kronik: { tr: "Kasaba Çekirdeği'ne Demir Yasa'yı kendi elinle yazdın; artık onu insanlar değil Sistem uygulayacaktı ve Sistem'e itiraz edilmezdi.", en: "With your own hand you wrote the Iron Law into {yer:kasaba_cekirdegi}. From then on the System would enforce it, not people, and nobody appeals to the System." }
            sonraki: "lonca_4_sistem"
          - id: "yirt"
            etiket: { tr: "Taslağı al, gözünün önünde yırt", en: "Take the draft and tear it in front of him" }
            goster: { bilgi: "kaya_yirtilan_emir", npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: -8, insanlik: 4, merhamet: 2 }
              - bayrak: "kaya_yasa_yirtildi"
              - iliski: { kaya_demir: { saygi: 8, guven: -6 } }
            kronik: { tr: "Yasanın kâğıt taslağını {npc:kaya_demir|in} gözü önünde ikiye yırttın; tıpkı onun yıllar önce bir emri yırttığı gibi.", en: "You tore the paper draft of the Iron Law in half in front of {npc:kaya_demir}, the same way he once tore up an order." }
            sonraki: "lonca_4_yirt"
          - id: "reddet"
            etiket: { tr: "\"Adımı bunun altına koymam.\"", en: "\"My name doesn't go on this.\"" }
            etkiler:
              - ahlak: { duzen: -6, insanlik: 4 }
              - iliski: { kaya_demir: { saygi: -2, guven: -4 } }
            kronik: { tr: "Adını Demir Yasa'nın altına koymayı reddettin.", en: "You refused to put your name on the Iron Law." }
            sonraki: "lonca_4_red"

      - id: "lonca_4_sistem"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "{yer:kasaba_cekirdegi|in} önünde elini ışığa daldırınca Sistem'in satırları parmaklarının arasından akmaya başlıyor. Demir Yasa'nın yedi maddesini birer birer yazdıkça her biri şehrin bütün pencerelerinde aynı anda beliriyor.", en: "In front of {yer:kasaba_cekirdegi}, you push your hand into the light. The System's lines flow around your fingers, and you write the seven articles of the Iron Law one by one. Each one shows up in every window in the city at the same time." }
          - { tr: "{yer:kiyikent|in} sokaklarında yüz binlerce insan aynı anda olduğu yerde kalıp önünde açılan pencereyi okuyor.", en: "On the streets of {yer:kiyikent}, hundreds of thousands of people stop at the same moment and read the window that just opened in front of them." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bölge yasası güncellendi: DEMİR YASA]", en: "[District law updated: IRON LAW]" }
            satirlar:
              - { tr: "Yetki: {yer:kasaba_cekirdegi} · Yazan: {oyuncu}", en: "Authority: Town Core · Author: {oyuncu}" }
              - { tr: "Madde 7 yetkilisi: {oyuncu}", en: "Article 7 authority: {oyuncu}" }
          - tur: "yanki"
            baslik: { tr: "b̷unu sistemin diliyle yazdın.", en: "y̷ou wrote this in the system's language." }
            satirlar:
              - { tr: "çok iyi yazdın. bu beni korkutuyor.", en: "you wrote it very well. that scares me." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kule Dibi'ne in; ilanı izle", en: "Go down to {yer:kule_dibi}. Watch it land" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
            kronik: { tr: "Yasayı Sistem'e yazdıktan sonra Kule Dibi'ne inip şehrin onu okuyuşunu izledin.", en: "After you wrote the law into the System, you went down to {yer:kule_dibi} to watch the city read it." }
            sonraki: "lonca_4_ilan"

      - id: "lonca_4_ilan"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Demir Yasa {yer:kule_dibi|in} meydanında, Kule'nin gölgesinde okunuyor. Kalabalıktan ses çıkmıyor; ne alkışlayan var ne yuhalayan. Lonca'nın zırhlıları meydanın dört köşesini tutmuş.", en: "The Iron Law gets read out on {yer:kule_dibi}, in the shadow of the Spire. The crowd is quiet. Nobody cheers. Nobody boos. Guild armor stands at all four corners of the square." }
          - { tr: "Yasa hemen işlemeye başlıyor. Seferberlik listesinin ilk adı Seviye 52 bir lise öğrencisi. Annesi oğlunun kolunu sımsıkı tutmuş, Lonca'nın çavuşuna bırakmıyor. Sonra sana dönüyor; herkes sana döndüğü için.", en: "The first enforcement comes right away. The first name on the draft list is a level fifty-two high school kid. His mother has hold of his arm and won't let the Guild sergeant take him. Then she turns to you, because everybody turns to you." }
          - metin: { tr: "Meydanın kenarındaki darağacı yeni; tahtası henüz kurumamış.", en: "The gallows at the edge of the square is new. The wood hasn't even dried yet." }
            kosul: { bayrak: "demir_yasa_sert" }
          - metin: { tr: "Meydandaki herkesin önünde aynı pencere açık: [DEMİR YASA · Madde 1]. Çocuğunkinde bir satır daha var: [Görev atandı: Kule nöbeti].", en: "Everyone on the square has the same window open: [IRON LAW · Article 1]. The kid's window has one more line: [Assignment: Spire rotation]." }
            kosul: { bayrak: "demir_yasa_sistemde" }
        secenekler:
          - id: "uygula"
            etiket: { tr: "\"Yasa yasadır.\" Çocuğu nöbete yaz", en: "\"The law is the law.\" Put the kid on rotation" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 }, hatirlatma: { tr: "Demir Yasa'nın yedinci maddesi Lonca'nın içinde bir şeyi kıpırdattı.", en: "The seventh article of the Iron Law stirred something up inside the Guild." } }
            kronik: { tr: "Bir annenin elinden oğlunu alıp Kule nöbetine yazdın; Demir Yasa ilk gününden kimseyi ayırmadı.", en: "You took a boy out of his mother's hands and put him on Spire rotation. From day one, the Iron Law spared no one." }
            sonraki: "@akis"
          - id: "istisna"
            etiket: { tr: "Yedinci maddeyi kullan: çocuğu muaf tut", en: "Use article seven. Exempt the kid" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2, insanlik: -2 }
              - itibar: { lonca: 2, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -2 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 }, hatirlatma: { tr: "Demir Yasa'nın yedinci maddesi Lonca'nın içinde bir şeyi kıpırdattı.", en: "The seventh article of the Iron Law stirred something up inside the Guild." } }
            kronik: { tr: "Yedinci maddeyi daha ilk gün kullanıp bir çocuğu muaf tuttun; şehir o gün yasanın tek gerçek istisnasının sen olduğunu öğrendi.", en: "You used article seven on the very first day to exempt a kid. That day the city learned the law had only one real exception: you." }
            sonraki: "@akis"
          - id: "nutuk"
            tur: "gosteris"
            etiket: { tr: "Meydana konuş; gönüllüleri sen çağır", en: "Address the square. Call for volunteers yourself" }
            gerekli: { stat: { cha: 140 } }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3, merhamet: 2 }
              - ordu: { lonca_avcisi: 30 }
              - degisken: { hayatta_kalan: 2 }
              - dikkat: 4
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
              - xp_seviye: 100
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 }, hatirlatma: { tr: "Demir Yasa'nın yedinci maddesi Lonca'nın içinde bir şeyi kıpırdattı.", en: "The seventh article of the Iron Law stirred something up inside the Guild." } }
            kronik: { tr: "Seferberliğin ilk gününde meydana kendin seslendin; liste gönüllülerle öyle hızlı doldu ki o çocuğun adı en alta düştü.", en: "On the first day of the draft you called to the square yourself. The list filled with volunteers so fast that the kid's name sank to the bottom." }
            sonraki: "@akis"

      - id: "lonca_4_yirt"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çelik levhanın yanındaki kâğıt taslağı alıp ağır ağır ikiye yırtıyorsun. Odada çıkan ses bir silah patlaması kadar yüksek.", en: "You pick up the paper draft sitting next to the steel plate and slowly tear it in half. In that room, it sounds as loud as a gunshot." }
          - metin: { tr: "{npc:kaya_demir} yırtılan kâğıda bakarken yüzünde bir şey çöküyor. Öfke değil bu; kendi gençliğini karşısında gören bir adamın yüzü. \"Kırk iki kişi,\" diyor iyice alçalmış bir sesle. \"Senin kırk iki kişin kim?\"", en: "{npc:kaya_demir} stares at the torn paper and something on his face caves in. Not anger. A man looking at his own younger self. \"Forty-two people,\" he says, very quietly. \"Who are your forty-two?\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyi donakalıyor. Defterdar yırtık kâğıdın iki yarısını yerden alıp masaya yan yana diziyor; birbirine uyup uymayacaklarını görmek ister gibi.", en: "The officer council freezes. The Ledger picks both halves of the paper up off the floor and lays them side by side on the table, like she wants to see if they'll fit back together." }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "\"Yeniden yazalım. Bu sefer köşesi şehrin olsun.\"", en: "\"Let's rewrite it. This time the city holds the corner.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 4, insanlik: 2 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_muafiyet"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 6, siginak: 6 }
              - iliski: { kaya_demir: { guven: 8, baglilik: 6 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 }, hatirlatma: { tr: "Demir Yasa'nın yedinci maddesi Lonca'nın içinde bir şeyi kıpırdattı.", en: "The seventh article of the Iron Law stirred something up inside the Guild." } }
            kronik: { tr: "Yırttığın Demir Yasa'yı {npc:kaya_demir|le} birlikte baştan yazdın; yedinci maddenin yırtılabilir köşesi artık en güçlünün değil, şehrin elindeydi.", en: "You tore up the Iron Law and rewrote it with {npc:kaya_demir}. From then on, article seven's tearable corner belonged to the city, not to the strongest." }
            sonraki: "@akis"
          - id: "cik"
            etiket: { tr: "Yırtık kâğıdı masada bırakıp çık", en: "Leave the torn paper on the table and walk out" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_yasa_reddedildi"
              - itibar: { lonca: -12, siginak: 6 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
            kronik: { tr: "Taslağı yırtıp Lonca'dan çıktın; yasaya ne olursa olsun, altında senin adın olmayacaktı.", en: "You tore up the draft and walked out of the Guild. Whatever became of the law, your name would never be on it." }
            sonraki: "@akis"

      - id: "lonca_4_red"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "\"O zaman ben imzalarım,\" diyor {npc:kaya_demir}. \"Şehir bana altında neden senin adın olmadığını sorarsa da anlatırım.\" Kalemi alıp bir an bekliyor; belki fikrini değiştirirsin diye.", en: "\"Then I sign it,\" {npc:kaya_demir} says. \"And when this city asks me why your name isn't on it, I'll tell them.\" He picks up the stylus and waits a beat. Maybe you'll change your mind." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"O zaman konsey imzalar,\" diyor en yaşlı subay. \"Ama şehir bize değil, sana bakıyor. Senin adın olmadan bu yasa bir kâğıttan ibaret.\"", en: "\"Then the council signs,\" the oldest officer says. \"But the city isn't looking at us. It's looking at you. Without your name, this law is just a piece of paper.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "Kalemi al ve imzala", en: "Take the stylus and sign" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - bayrak: "demir_yasa_yururlukte"
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Demir Yasa'yı önce geri çevirdin, sonra kalemi alıp imzaladın.", en: "You refused the Iron Law once, then took the stylus and signed it." }
            sonraki: "lonca_4_ilan"
          - id: "git"
            etiket: { tr: "\"İmzala. Ben gidiyorum.\"", en: "\"Sign it. I'm leaving.\"" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_yasa_reddedildi"
              - itibar: { lonca: -10, siginak: 4 }
              - iliski: { kaya_demir: { guven: -4, saygi: -2 } }
            kronik: { tr: "İmzanı esirgeyip Lonca'yı bıraktın; Demir Yasa yürürlüğe girecekse de senin adın olmadan girecekti.", en: "You wouldn't sign the Iron Law, and you left the Guild behind. If it ever went into effect, it would go without your name." }
            sonraki: "@akis"

  # ================================================================== KAYA — DARBE GECESİ (P3, AY 292)
  - id: "kaya_darbe_gecesi"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 240, max: 299 }
    ana_yay: { gun: 292 }
    kosul: { bayrak_yok: ["kaya_devrildi", "lonca_cozuldu"], degisken_min: { kaya_tanidik: 1 }, gun_max: 299 }
    agirlik: 9
    etiketler: ["lonca", "npc", "ahlak", "darbe"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Darbe arifesi", en: "The night before the coup" }
    sahne: "kaya_darbe_gecesi_1"
    sahneler:
      - id: "kaya_darbe_gecesi_1"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Gece yarısı kapın çalınıyor. Gelen Örs; balyozu omzunda, sesini alçaltıyor: \"Başçavuş bir şey hazırlıyor, görmen lazım. Bunu sana borçluydum.\"", en: "Somebody knocks at midnight. It's Anvil, sledge on his shoulder, keeping his voice down. \"Gunny's getting something ready. You need to see it. I owed you this.\"" }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Gece yarısı turuncu yamalı bir koşucu seni buluyor. Bu kez soluk soluğa değil, sakin ve resmî: \"Başçavuş sizi haddehanede bekliyor. Yalnız gelin.\"", en: "At midnight, an orange-patched runner finds you. Not out of breath this time. Calm. Formal. \"The Gunny's expecting you at the mill. Come alone.\"" }
            kosul: { bayrak_yok: "ors_borclu" }
          - { tr: "Haddehane ışıl ışıl. Vinçlerin altında iki zırhlı kol hazır bekliyor: kapı zırhı kuşanmış avcılar, Döküm'den yeni çıkmış tüfekler, sacla kaplanmış kamyonlar. Kimsenin ağzını bıçak açmıyor; herkes bir emre kulak kesilmiş.", en: "The mill's lit up like a stadium. Under the cranes, two armored columns stand ready: hunters in Gate armor, rifles fresh out of the Foundry, trucks plated in ship steel. Nobody's talking. Everybody's waiting on an order." }
          - { tr: "{npc:kaya_demir} ambar kapağı masanın başında, haritanın üstüne eğilmiş. Harita değişmiş: {yer:kasaba_cekirdegi} hâlâ kırmızı bir daire içinde ama yanında artık 'Sonra' değil, 'Şafak' yazıyor. Konsey binasının üstünde de bir çarpı var.", en: "{npc:kaya_demir} is at the hatch-cover table, over the map. The map's changed. {yer:kasaba_cekirdegi} is still circled in red, but next to it, it doesn't say 'Later' anymore. It says 'Dawn.' There's an X over the Council building." }
          - { tr: "\"Şafak dediğim, Sistem'in geri sayımının altmış beşe düştüğü sabahın şafağı,\" diyor. \"Kadimler körfezde, Konsey de onlarla masaya oturup oturmamayı oyluyor. O sabah elimizde altmış beş gün kalacak ve ben bu şehri bir komiteye bırakmayacağım.\" Başını kaldırıyor. \"Kan dökülmeyecek. Gerekmedikçe.\"", en: "\"The morning the System countdown hits sixty-five,\" he says. \"The Ancients are in the bay. The Council's voting on whether to sit down at a table with them. We've got sixty-five days, and I'm not leaving this city to a committee.\" He looks up. \"No bloodshed. Unless necessary.\"" }
          - metin: { tr: "Sonra sesini alçaltıyor: \"Yanıldığımı söyle bana. Sen söylersen inanırım; başkası söylerse inanmam.\"", en: "\"Tell me I'm wrong,\" he says then, lower. \"If you say it, I'll believe it. Anybody else says it, I won't.\"" }
            kosul: { bayrak: "kaya_akil_hocasi" }
          - metin: { tr: "\"İkinci kolu sen yöneteceksin,\" diyor. \"Konsey binası senin. Bu masa benden sonra zaten senin olacaktı; belki biraz erken oluyor.\"", en: "\"You're leading the second column,\" he says. \"The Council building is yours. This table was going to be yours after me. Maybe it comes a little early.\"" }
            kosul: { degisken_min: { lonca_rutbe: 3 }, bayrak_yok: "kaya_akil_hocasi" }
          - metin: { tr: "Örs Başçavuş'un arkasında, balyozunu iki eliyle kavramış duruyor; gözünü senden kaçırıyor.", en: "Anvil stands behind the Gunny, both hands on his sledge, not looking at you." }
            kosul: { bayrak: "ors_kin" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Zırhlı kollardaki avcıların yarısı Başçavuş'a değil, sana bakıyor. Sen bir emir verirsen hangisine uyacaklarını kendileri de bilmiyor.", en: "Half the hunters in those armored columns are looking at you, not the Gunny. If you give an order, they don't know which one they'd follow either." }
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Başçavuş'un sağ dizi artık eklem değil, yara. Bu gece dövüşürse o diz onu yarı yolda bırakacak ve bunu kendisi de biliyor.", en: "The Gunny's right knee isn't a joint anymore. It's a wound. If he fights tonight, that knee is going to quit on him halfway through, and he knows it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷şte o köşe. yasanın yırtılabilir köşesi. bu gece ya o yırtacak ya sen. üçüncü bir el yok.", en: "t̷here it is. the corner of the law that tears. tonight either he tears it or you do. there's no third hand." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Konsey binası benim insanlarımla dolu. Sor ona, 'gerekmedikçe' ne demek?\"", en: "\"The Council building is full of my people. Ask him what 'unless necessary' means.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu adamın başına ne geldiğini biliyorum. Senin de başına gelmesinden korktuğum şey bu.\"", en: "\"I know what happened to this man. It's the thing I'm scared is going to happen to you.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Konsey'in telsiz frekansını biliyorum. Bir cümle, beş saniye. Söyle yeter.\"", en: "\"I know the Council's radio frequency. One sentence, five seconds. Just say the word.\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "İkinci kolu al; darbeye katıl", en: "Take the second column. Join the coup" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_darbe_ortagi"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { duzen: 6, merhamet: -4, insanlik: -3 }
              - itibar: { lonca: 10, siginak: -15 }
              - iliski: { kaya_demir: { baglilik: 10, guven: 8 } }
            kronik: { tr: "{npc:kaya_demir|in} ikinci kolunu üstlendin; Konsey binasına yürüyecek zırhlıların başı artık sendin.", en: "You took command of {npc:kaya_demir|pos} second column. The armor that would roll on the Council building was yours to lead." }
            sonraki: "kaya_darbe_gecesi_ortak"
          - id: "devir"
            etiket: { tr: "\"O şafağa kimse yürümeyecek.\" Onu durdur", en: "\"Nobody marches at dawn.\" Stop him" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { guven: -10, saygi: 6 } }
            kronik: { tr: "Haritanın başında {npc:kaya_demir|in} önüne dikildin; onu kendi haddehanesinde durdurmaya kalktın.", en: "You planted yourself in front of {npc:kaya_demir} over his map and tried to stop him in his own rolling mill." }
            sonraki: "kaya_darbe_gecesi_devir"
          - id: "tek_darbe"
            tur: "gosteris"
            etiket: { tr: "Tek hamlede indir; kimse silah çekmesin", en: "Put him down in one move. Nobody draws" }
            gerekli: { stat: { str: 220 } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 4, insanlik: -4 }
              - dikkat: 5
              - iliski: { kaya_demir: { korku: 12, saygi: 10, guven: -10 } }
            kronik: { tr: "{npc:kaya_demir|i} kendi askerlerinin önünde tek hamlede yere serdin; haddehanede kimse silahına uzanamadı.", en: "In front of his own troops, you put {npc:kaya_demir} on the floor in one move. Nobody in the mill could even reach for a weapon." }
            sonraki: "kaya_darbe_gecesi_ezme"
          - id: "vazgecir"
            etiket: { tr: "\"Yanılıyorsun. Bunu sen de biliyorsun.\"", en: "\"You're wrong. And you know it.\"" }
            gerekli: { iliski_min: { kaya_demir: { guven: 30 } } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { insanlik: 4, duzen: 2, merhamet: 2 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 6 } }
            kronik: { tr: "{npc:kaya_demir|e} yanıldığını yüzüne söyledin; bunu ona söyleyebilecek tek kişi sendin.", en: "You told {npc:kaya_demir} to his face that he was wrong. You were the only person alive who could." }
            sonraki: "kaya_darbe_gecesi_vazgecti"
          - id: "koz"
            etiket: { tr: "Mavi Çapa'nın sahte ihbarını masaya koy", en: "Put the forged Blue Anchor tip on the table" }
            goster: { bayrak: "kaya_sirri_elde" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { guven: -12, korku: 6 } }
            kronik: { tr: "Mavi Çapa'dan beri cebinde taşıdığın sahte ihbarı Lonca'nın subaylarının önüne koydun; 'Pano'da yalan olmaz' kuralı onu yazanı devirdi.", en: "You laid the forged tip you'd carried since the Blue Anchor in front of the Guild's officers. 'No lies on the Board' brought down the man who wrote it." }
            sonraki: "kaya_darbe_gecesi_subaylar"
          - id: "subaylar"
            tur: "gosteris"
            etiket: { tr: "Subaylara dön: \"Kimi izliyorsunuz?\"", en: "Turn to the officers. \"Who are you following?\"" }
            goster: { degisken_min: { lonca_rutbe: 3 } }
            gerekli: { stat: { cha: 160 } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 4, insanlik: -3 }
              - dikkat: 3
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { guven: -8, saygi: 8 } }
            kronik: { tr: "Lonca'nın subaylarına kimin peşinden gittiklerini sordun; hepsi sana döndü, {npc:kaya_demir} haddehanenin ortasında yalnız kaldı.", en: "You asked the Guild's officers who they were following. Every one of them turned to you, and {npc:kaya_demir} was left standing alone in the middle of the mill." }
            sonraki: "kaya_darbe_gecesi_subaylar"
          - id: "ihbar"
            etiket: { tr: "Sessizce çık; Konsey'i uyar", en: "Slip out. Warn the Council" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_ihbar_edildi"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { siginak: 10, lonca: -10 }
              - iliski: { kaya_demir: { guven: -12 }, elif_sari: { guven: 6 } }
            kronik: { tr: "{npc:kaya_demir|in} planını gece yarısı Konsey'e taşıdın; Konsey binasının lambaları birer birer yandı.", en: "You carried {npc:kaya_demir|pos} plan to the Council after midnight. One by one, the lamps in the Council building came on." }
            sonraki: "kaya_darbe_gecesi_ihbar"
          - id: "kenarda"
            etiket: { tr: "\"Bu benim savaşım değil.\"", en: "\"This isn't my fight.\"" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { kaya_demir: { saygi: -2 } }
            kronik: { tr: "Haritadaki çarpıyı gördün ve 'Bu benim savaşım değil' deyip kenara çekildin.", en: "You saw the X on the map, said it wasn't your fight, and stepped aside." }
            sonraki: "kaya_darbe_gecesi_kenarda"

      - id: "kaya_darbe_gecesi_devir"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun uzun yüzüne bakıyor. Sonra masanın arkasından çıkıp ceketini sandalyeye asıyor; Döküm'ün zırhçılarının ona özel döktüğü sac koşum gömleğinin altından parıldıyor.", en: "{npc:kaya_demir} looks at you for a long time. Then he comes around the table, takes off his jacket and hangs it on the chair. The steel rig the Foundry's armorers poured for him gleams under his shirt." }
          - { tr: "\"Talimdeymişiz gibi,\" diyor. Miğferini takmayıp koltuğunun altına alıyor. \"Hazır olduğunda.\" Muhafızlarından ikisi kalkanlarını kenetleyerek yanında yer alıyor.", en: "\"Like it's a drill,\" he says. He doesn't put his helmet on. He tucks it under his arm. \"Whenever you're ready.\" Two of his enforcers lock shields and step up beside him." }
          - metin: { tr: "Örs balyozunu kaldırıp muhafızların önünden geçerek senin yanında duruyor. \"Borcumu ödüyorum,\" diyor.", en: "Anvil lifts his sledge and steps out in front of the enforcers, next to you. \"Paying my debt,\" he says." }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Başçavuş'un arkasında Örs balyozunu kaldırıyor. Merdiven Günü'nün hesabı bu gece kapanacak.", en: "Behind the Gunny, Anvil raises his sledge. Ladder Day's bill comes due tonight." }
            kosul: { bayrak: "ors_kin" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Hazırım", en: "Ready" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+4", "lonca_muhafizi@dunya", "lonca_muhafizi@dunya"], ortam: ["yanici"], kazan: "kaya_darbe_gecesi_kader", kaybet: "kaya_darbe_gecesi_yenilgi" }
            kronik: { tr: "Haddehanenin ortasında {npc:kaya_demir|le} gerçek bir dövüşe tutuştun; o gece ikinizden biri kendi askerlerinin önünde yere düşecekti.", en: "In the middle of the mill you went into a real fight with {npc:kaya_demir}. One of you was going down in front of your own troops that night." }
          - id: "yalniz_o"
            etiket: { tr: "\"Muhafızlar karışmasın. Sen ve ben, o kadar.\"", en: "\"Keep the enforcers out. Just you and me.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+5"], ortam: ["yanici"], kazan: "kaya_darbe_gecesi_kader", kaybet: "kaya_darbe_gecesi_yenilgi" }
            kronik: { tr: "{npc:kaya_demir|le} muhafızsız, bire bir dövüştün; Lonca o gece iki askerin hesabını kendi aralarında görmesini izledi.", en: "You fought {npc:kaya_demir} one on one, no enforcers. That night the Guild watched two soldiers settle something between themselves." }

      - id: "kaya_darbe_gecesi_ezme"
        yer: "sanayi"
        paragraflar:
          - { tr: "Masanın etrafından dolaşma zahmetine bile girmiyorsun. Bir an masanın bu yanındasın, bir sonraki an {npc:kaya_demir} haddehanenin çelik zemininde sırtüstü yatıyor; süngüsü üç adım ötede, miğferi yuvarlanıp gidiyor.", en: "You don't even go around the table. One second you're on this side of it. The next, {npc:kaya_demir} is flat on his back on the mill floor, his bayonet ten feet away, his helmet rolling." }
          - { tr: "Zırhlı kollardaki yüzlerce avcıdan kıpırdayan yok. Ne bir silah sesi duyuluyor ne de bir tüfek emniyetinin tıkırtısı.", en: "Not one of the hundreds of hunters in those armored columns moves. You don't hear a shot. You don't even hear a safety click off." }
          - { tr: "{npc:kaya_demir} gözünü tavana dikiyor, sonra gülüyor: kısa, kuru, neredeyse rahatlamış bir gülüş. \"Yirmi yıl asker yetiştirdim,\" diyor. \"Senin gibisini görmedim.\"", en: "{npc:kaya_demir} stares up at the ceiling. Then he laughs, short and dry, almost relieved. \"Twenty years training troops,\" he says. \"Never seen one like you.\"" }
        secenekler:
          - id: "kader"
            etiket: { tr: "Başında dikil, kararını ver", en: "Stand over him and decide" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "{npc:kaya_demir|i} tek hamlede devirdikten sonra başında dikilip kaderini tarttın.", en: "After you toppled {npc:kaya_demir} in one move, you stood over him and weighed what happened to him next." }
            sonraki: "kaya_darbe_gecesi_kader"

      - id: "kaya_darbe_gecesi_subaylar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehaneye bir sessizlik çöküyor. Derken kollardan birinin başındaki subay miğferini çıkarıp yere bırakıyor. Ardından bir başkası, sonra bir başkası daha. Kimse tek söz etmiyor; gerek de yok.", en: "The mill goes silent. Then the officer at the head of one column takes his helmet off and sets it on the floor. Then another. Then another. Nobody says a word. Nobody has to." }
          - { tr: "{npc:kaya_demir} masanın başında, haritasının üstünde yapayalnız kalmış. Uzun uzun yerdeki miğferlere bakıp sonunda kalemi bırakıyor.", en: "{npc:kaya_demir} stands alone at the table, over his map. He looks at the helmets on the floor for a long time. Then he puts down his pencil." }
          - { tr: "\"Meritokrasi,\" diyor. Sesinde ne öfke var ne alay. \"Kendi kuralımla. Başka nasıl olabilirdi ki?\"", en: "\"Meritocracy,\" he says. There's no anger in it. No mockery either. \"By my own rule. How else was it ever going to go?\"" }
        secenekler:
          - id: "kader"
            etiket: { tr: "Ona yaklaş, kararını ver", en: "Walk up to him and decide" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "{npc:kaya_demir|i} tek damla kan dökmeden, kendi subaylarının miğferleriyle devirdin.", en: "You toppled {npc:kaya_demir} without spilling a drop of blood, with nothing but his own officers' helmets." }
            sonraki: "kaya_darbe_gecesi_kader"

      - id: "kaya_darbe_gecesi_kader"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:kaya_demir} haddehanenin zemininde bir dizinin üstüne çökmüş. Sağ dizi sonunda onu yüzüstü bırakmış ama o süngüsünü bırakmıyor. Soluğu hırıltılı, gözleri sakin.", en: "{npc:kaya_demir} is down on one knee on the mill floor. His right knee finally quit on him, but he hasn't let go of the bayonet. His breathing's ragged. His eyes are calm." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Zırhlı kolların yüzlerce avcısı gözünü sana dikmiş. Defterdar yazı altlığını göğsüne bastırmış. Lonca bu gece bir komutan kaybedip bir komutan kazandı; geriye eskisiyle ne yapılacağı kaldı.", en: "Hundreds of hunters in the armored columns are looking at you. The Ledger has her clipboard pressed to her chest. Tonight the Guild lost a commander and gained one. All that's left is deciding what to do with the old one." }
          - { tr: "\"Kural belli,\" diyor {npc:kaya_demir} başını kaldırıp. \"Devrilen komutan ya ölür ya gider. Hangisine sen karar verirsin. Bunu da ben yazdım.\"", en: "\"The rule's clear,\" {npc:kaya_demir} says, looking up at you. \"A toppled commander either dies or goes. You decide which. I wrote that one too.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ö̷lür ya da gider. ama üçüncü bir yol da var, değil mi? hep vardı. o yazmadı diye yok sayılmaz.", en: "d̷ies or goes. but there's a third way, isn't there? there always was. just because he didn't write it doesn't mean it isn't there." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Kural kuraldır", en: "A rule is a rule" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - npc_ol: "kaya_demir"
              - ahlak: { merhamet: -8, duzen: 5, insanlik: -5 }
              - itibar: { lonca: 12, siginak: -10 }
              - efsane: "acimasiz_infaz_tanikli"
              - ordu: { lonca_avcisi: 40 }
              - xp_seviye: 150
            kronik: { tr: "{npc:kaya_demir|i} kendi yazdığı kurala göre, kendi haddehanesinde öldürdün; o gece Lonca'nın bütün silahları sana döndü.", en: "You killed {npc:kaya_demir} by his own rule, in his own rolling mill. After that night, every weapon in the Guild looked to you and only you." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "hapis"
            etiket: { tr: "Soğuk fırına kapat; şafak geçsin", en: "Lock him in the cold furnace. Let the dawn pass" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { lonca: 8 }
              - ordu: { lonca_avcisi: 35 }
              - xp_seviye: 150
              - iliski: { kaya_demir: { korku: 6, guven: -4 } }
              - tohum: { olay: "kaya_soguk_firin", gecikme: { min: 8, max: 14 }, kosul: { bayrak: "kaya_hapiste", npc_hayatta: "kaya_demir", perde: 3 }, hatirlatma: { tr: "Darbe arifesindeki soğuk fırın hâlâ aklında.", en: "You're still thinking about the cold furnace from the night before the coup." } }
            kronik: { tr: "{npc:kaya_demir|i} devirip haddehanenin soğuk fırınına kapattın; şafağı orada bekleyecekti, Lonca ise artık senindi.", en: "You toppled {npc:kaya_demir} and locked him in the mill's cold furnace. He'd wait out the dawn in there, and the Guild was yours." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "surgun"
            etiket: { tr: "\"Git. Bir daha bu şehre dönme.\"", en: "\"Go. Don't ever come back to this city.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_surgun"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - npc_gitti: "kaya_demir"
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { lonca: 6 }
              - ordu: { lonca_avcisi: 30 }
              - xp_seviye: 150
            kronik: { tr: "{npc:kaya_demir|i} devirip şehirden sürdün; {yer:sanayi|in} kapısından topallayarak çıktı ve bir daha {yer:kiyikent|de} görülmedi.", en: "You toppled {npc:kaya_demir} and exiled him. He limped out {yer:sanayi} gate and was never seen in {yer:kiyikent} again." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "yemin"
            etiket: { tr: "\"Üçüncü yol: bana yemin et, komutayı bırakma.\"", en: "\"Third way: swear to me and keep commanding.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 40 } } }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_yemin_etti"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 4, merhamet: 4 }
              - itibar: { lonca: 10 }
              - ordu: { lonca_avcisi: 40 }
              - xp_seviye: 150
              - iliski: { kaya_demir: { saygi: 10, baglilik: 8, guven: 4 } }
            kronik: { tr: "{npc:kaya_demir|i} devirdin ama ne öldürdün ne sürdün; sana yemin edip Lonca'nın sahadaki komutanı olarak kaldı, bu kez senin emrinde.", en: "You toppled {npc:kaya_demir} but didn't kill or exile him. He swore to you and stayed on as the Guild's field commander, under your orders this time." }
            sonraki: "kaya_darbe_gecesi_son"

      - id: "kaya_darbe_gecesi_son"
        yer: "sanayi"
        paragraflar:
          - { tr: "Zırhlı kollar dağılıyor. Kamyonların motorları susuyor; tüfekler rafına, kapı zırhları askısına dönüyor. Konsey binası bu gece olup biteni hiç bilmeden uyuyacak.", en: "The armored columns stand down. The trucks go quiet. Rifles go back on the racks, Gate armor back on the hooks. The Council building is going to sleep through tonight without ever knowing." }
          - { tr: "Defterdar Pano'ya yürüyüp en üstteki satırı siliyor, sonra tıpkı Merdiven Günü'ndeki gibi tebeşiri sana uzatıyor. Bu kez senin adının üstüne yazılacak başka bir isim yok.", en: "The Ledger walks over to the Board and wipes the top line. Then she holds the chalk out to you, same as on Ladder Day. This time there's no other name left to write above yours." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını yaz", en: "Write your name" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2 }
              - degisken: { lonca_rutbe: 1 }
            kronik: { tr: "Gecenin sonunda Pano'nun en üst satırına adını yazdın; Demir Lonca artık senindi.", en: "When the night was over, you wrote your name on the top line of the Board. The Iron Guild was yours." }
            sonraki: "@akis"
          - id: "bos_birak"
            etiket: { tr: "En üst satırı boş bırak", en: "Leave the top line blank" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
            kronik: { tr: "{npc:kaya_demir|i} devirdiğin gece Pano'nun en üst satırını boş bıraktın; Lonca o boşluğa adına göstereceğinden fazla saygı gösterdi.", en: "On the night you toppled {npc:kaya_demir}, you left the top line of the Board blank. The Guild respected that empty line more than it would have respected your name." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Dipçik çenene iniyor, haddehanenin çatısı bir kez fırıl dönüyor. Gözünü açtığında soğuk fırının içindesin; demir kapı kilitli, küçük penceresinden {npc:kaya_demir|in} yüzü görünüyor.", en: "The rifle butt lands on your jaw and the mill roof spins once. When you open your eyes you're inside the cold furnace. The iron door's locked, and {npc:kaya_demir|pos} face is in its little window." }
          - { tr: "\"Bugün değil,\" diyor. \"Seni öldürmeyeceğim. Bu şehrin sana ihtiyacı olacak; bana olduğundan da çok.\" Pencereyi kapatıyor. Dışarıda motorlar çalışmaya başlıyor.", en: "\"Not today,\" he says. \"I'm not going to kill you. This city's going to need you. More than it needs me.\" He shuts the window. Outside, engines start." }
        secenekler:
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Fırının kapısını menteşesinden sök", en: "Tear the furnace door off its hinges" }
            gerekli: { stat: { str: 200 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -2 }
              - bayrak: "kaya_darbe_hazirligi"
              - dikkat: 3
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "{npc:kaya_demir|in} seni kapattığı fırının kapısını menteşesinden söktün ama zırhlı kollar çoktan yola çıkmıştı.", en: "You tore the door off the furnace {npc:kaya_demir} had locked you in, but the armored columns were already on the road." }
            sonraki: "kaya_darbe_gecesi_kacis"
          - id: "bekle"
            etiket: { tr: "Karanlıkta otur ve bekle", en: "Sit in the dark and wait" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bayrak: "kaya_darbe_hazirligi"
              - iliski: { kaya_demir: { guven: 3 } }
            kronik: { tr: "{npc:kaya_demir|e} yenildin; onun fırınında karanlığa oturup şafağı bekledin.", en: "{npc:kaya_demir} beat you, and you sat in the dark of his furnace waiting for morning." }
            sonraki: "kaya_darbe_gecesi_kacis"

      - id: "kaya_darbe_gecesi_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehaneden çıktığında {yer:sanayi|in} sokakları bomboş, kamyonların izleri çamurda {yer:kiyikent_liman|e} doğru uzanıyor. Darbe bu gece değil, Sistem'in geri sayımının altmış beşe düştüğü sabah, şafakla birlikte gelecek; plan öyle diyordu. Önünde birkaç gün var.", en: "When you come out of the mill, the streets of {yer:sanayi} are empty, truck tracks in the mud running toward {yer:kiyikent_liman}. The coup isn't going down tonight. It's the morning the countdown hits sixty-five. The plan said so. You've got a few days." }
        secenekler:
          - id: "hazirlan"
            etiket: { tr: "O sabaha hazırlan", en: "Get ready for that morning" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - stat: { wil: 4 }
            kronik: { tr: "{npc:kaya_demir|in} fırınından çıkıp darbenin sabahına hazırlanmaya koyuldun.", en: "You got out of {npc:kaya_demir|pos} furnace and started getting ready for the morning of the coup." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_vazgecti"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun uzun haritaya bakıyor, sonra kırmızı kalemi alıp 'Şafak' kelimesinin üstünü çiziyor. Elinin titrediğini ilk kez görüyorsun.", en: "{npc:kaya_demir} stares at the map a long time. Then he picks up the red pencil and strikes through 'Dawn.' It's the first time you've ever seen his hand shake." }
          - { tr: "\"Kırk iki kişi,\" diyor. \"O gece kapıyı açık tuttum, çünkü emir yanlıştı. Bu gece emri veren de benim, yanlış olan da.\" Zırhlı kollara dönüp sesini yükseltiyor: \"Rahat! Kollar dağılsın.\"", en: "\"Forty-two people,\" he says. \"That night I held the door because the order was wrong. Tonight I'm the one giving the order, and I'm the one who's wrong.\" He turns to the armored columns and raises his voice. \"At ease! Columns, stand down.\"" }
          - { tr: "Haddehane bir an kulaklarına inanamıyor; sonra motorlar susuyor.", en: "For a second the mill doesn't believe it. Then the engines go quiet." }
        secenekler:
          - id: "ortak_masa"
            etiket: { tr: "\"Lonca'yı Konsey'in masasına götür. Birlikte.\"", en: "\"Take the Guild to the Council's table. Together.\"" }
            etkiler:
              - bayrak: "kaya_darbeden_vazgecti"
              - bayrak: "kaya_akil_hocasi"
              - ahlak: { duzen: 4, insanlik: 4, merhamet: 2 }
              - itibar: { lonca: 6, siginak: 10 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { kaya_demir: { guven: 10, baglilik: 10 }, elif_sari: { guven: 4 } }
              - xp_seviye: 120
            kronik: { tr: "{npc:kaya_demir|i} darbeden caydırdın; Lonca'yı Konsey'in masasına ikiniz birlikte götürdünüz.", en: "You talked {npc:kaya_demir} out of the coup, and the two of you took the Guild to the Council's table together." }
            sonraki: "@akis"
          - id: "planini_sakla"
            etiket: { tr: "\"Planı yakma. Ne olur ne olmaz.\"", en: "\"Don't burn the plan. Just in case.\"" }
            etkiler:
              - bayrak: "kaya_darbeden_vazgecti"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 4 } }
              - xp_seviye: 100
            kronik: { tr: "{npc:kaya_demir|i} darbeden vazgeçirdin ama planı yakmasına izin vermedin; harita ne olur ne olmaz diye bir çekmeceye kaldırıldı.", en: "You talked {npc:kaya_demir} out of the coup but wouldn't let him burn the plan. The map went into a drawer, just in case." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_ortak"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} ikinci kolun haritasını sana uzatıyor: Konsey binası, üç giriş, iki nöbetçi kulübesi, bir revir. Revirin üstüne biri kurşunkalemle küçük bir not düşmüş: 'Hekime dokunulmayacak.'", en: "{npc:kaya_demir} hands you the second column's map. The Council building, three entrances, two guard posts, an infirmary. Somebody's written a small note over the infirmary in pencil: 'Nobody touches the doctor.'" }
          - { tr: "\"Altmış beşinci sabah,\" diyor. \"O güne kadar kimseye tek kelime yok.\" Elini uzatıyor; bu kez gerçekten uzatıyor.", en: "\"Morning of sixty-five,\" he says. \"Not one word to anybody till then.\" He holds out his hand. This time he actually holds it out." }
        secenekler:
          - id: "sik"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { kaya_demir: { guven: 4 } }
              - xp_seviye: 80
            kronik: { tr: "{npc:kaya_demir|in} uzattığı eli sıktın; altmış beşinci sabaha kadar ağzını açmayacaktın.", en: "You shook the hand {npc:kaya_demir} held out. Not a word to anyone until the sixty-fifth morning." }
            sonraki: "@akis"
          - id: "hekim_sart"
            etiket: { tr: "\"Bir şartım var: Konsey'de kimse ölmeyecek.\"", en: "\"One condition. Nobody on the Council dies.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - xp_seviye: 80
            kronik: { tr: "Darbeye katıldın ama tek şartla: Konsey'de kimse ölmeyecekti. 'Gerekmedikçe' sözü o gece {npc:kaya_demir|in} haritasından silindi.", en: "You joined the coup on one condition: nobody on the Council dies. That night the words 'unless necessary' came off {npc:kaya_demir|pos} map." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_ihbar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısını geçe Konsey binasının kapısını çalıyorsun. İçeride lambalar birer birer yanarken seni dinleyen yüzler önce inanmıyor, sonra korkuya kapılıyor, en sonunda hesap yapmaya başlıyor.", en: "You knock on the Council building's door after midnight. Inside, lamps come on one at a time. The faces listening to you don't believe it at first. Then they're scared. Then they start doing math." }
          - metin: { tr: "{npc:elif_sari} haritaya eğilince revirin üstündeki notu görüyor: 'Hekime dokunulmayacak.' Bir süre sesini çıkarmıyor. \"Beni korumak istemiş,\" diyor sonunda. \"Bu daha da kötü.\"", en: "{npc:elif_sari} looks over the map and sees the note above the infirmary: 'Nobody touches the doctor.' She doesn't say anything for a while. \"He wanted to protect me,\" she finally says. \"That's worse.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "savun"
            etiket: { tr: "Konsey'in savunmasını sen kur", en: "Set up the Council's defense yourself" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
              - itibar: { siginak: 6 }
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 80
            kronik: { tr: "{npc:kaya_demir|in} darbesine karşı Konsey'in savunmasını kendi ellerinle kurdun; altmış beşinci sabaha hazırlıksız girmeyeceklerdi.", en: "You built the Council's defense against {npc:kaya_demir|pos} coup with your own hands. They wouldn't walk into the sixty-fifth morning unready." }
            sonraki: "@akis"
          - id: "arabulucu"
            etiket: { tr: "\"Hazırlanın. Ama onunla konuşmayı da deneyin.\"", en: "\"Get ready. But try talking to him too.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - itibar: { siginak: 4, lonca: 2 }
              - xp_seviye: 80
            kronik: { tr: "Konsey'i uyardın ama kapıyı büsbütün kapatmadın; {npc:kaya_demir|e} uzatılacak bir el bıraktın.", en: "You warned the Council but didn't slam the door. You left a hand they could still hold out to {npc:kaya_demir}." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_kenarda"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} başını sallıyor; hayal kırıklığı mı bu, rahatlama mı, çıkaramıyorsun. \"Hava durumu,\" diyor. \"Hep öyleydin zaten.\"", en: "{npc:kaya_demir} nods. Disappointment or relief, you can't tell which. \"Fair-weather,\" he says. \"Always were.\"" }
          - { tr: "Haddehaneden çıkarken arkanda bir motor çalışıyor, ardından bir tane daha. Altmış beşinci sabaha dek her gece bu sesi duyacaksın.", en: "As you walk out of the mill, an engine starts behind you. Then another. Every night until the morning of sixty-five, the same sound." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Keep walking" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            kronik: { tr: "{npc:kaya_demir|in} haddehanesinden çıkıp yürüdün; motorların sesi arkanda kaldı.", en: "You walked out of {npc:kaya_demir|pos} mill and left the sound of engines behind you." }
            sonraki: "@akis"

  # ================================================================== KAYA — SON SAVAŞIN GENERALİ (P4, AY 337)
  - id: "kaya_son_savas_generali"
    konum: ["kordon"]
    perde: [4]
    gun: { min: 331, max: 341 }
    ana_yay: { gun: 337 }
    kosul: { bayrak_yok: ["kaya_surgun", "kaya_general"], gun_max: 341 }
    agirlik: 9
    etiketler: ["lonca", "npc", "savas", "ordu"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "General", en: "The General" }
    sahne: "kaya_son_savas_generali_1"
    sahneler:
      - id: "kaya_son_savas_generali_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Körfezin üstünde gök artık mavi değil. Kadim filosu ufuktan ufka bir tavan gibi asılı duruyor; gemilerin karnındaki ışıklar her gece biraz daha alçalıyor. Sistem'in geri sayımı herkesin penceresinde aynı sayıyı gösteriyor, ama kimse ona bakmaya yanaşmıyor.", en: "The sky over the bay isn't blue anymore. The Ancient fleet hangs from horizon to horizon like a ceiling, and every night the lights in the ships' bellies come down a little lower. The System countdown shows the same number in everybody's window, and nobody wants to look at it." }
          - metin: { tr: "Haddehanenin soğuk fırınının kapısını açıyorsun. {npc:kaya_demir} karanlıkta sırtını duvara vermiş oturuyor; günlerdir göğün sesini dinlediği belli. \"Duydum,\" diyor. \"Filoyu. Kaç gün kaldı?\"", en: "You open the door of the mill's cold furnace. {npc:kaya_demir} is sitting in the dark with his back to the wall. You can tell he's been listening to the sky for days. \"I heard it,\" he says. \"The fleet. How many days?\"" }
            kosul: { bayrak: "kaya_hapiste" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde seni bekliyor; tepesinde sancak yerine beyaz bir bez dalgalanıyor. Darbeden beri şehri o yönetiyor ve bunu saklamıyor da. \"Düşman kapıda,\" diyor. \"Savaştan sonra beni asabilirsin. Önce savaş.\"", en: "{npc:kaya_demir} is waiting for you in {yer:kordon} trenches, under a white rag instead of a banner. He's run the city since the coup and he isn't pretending otherwise. \"Enemy's at the gate,\" he says. \"After the fight, you can hang me. Fight first.\"" }
            kosul: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde selam vermeden rapor veriyor; sana yemin ettiğinden beri hep böyle yapar. \"Sahra komutanı hazır,\" diyor. \"Emirlerinizi bekliyor.\"", en: "{npc:kaya_demir} reports to you in {yer:kordon} trenches without a salute. He's done it that way ever since he swore to you. \"Field commander's ready,\" he says. \"Awaiting your orders.\"" }
            kosul: { bayrak: "kaya_yemin_etti" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde elinde bir haritayla seni bekliyor. Kır saçları uzamış, sağ bacağı artık çelik bir desteğe yaslanıyor. Sırtıysa hâlâ bayrak direği gibi dimdik.", en: "{npc:kaya_demir} is waiting for you in {yer:kordon} trenches with a map in his hand. His gray hair's grown out, and his right leg rests in a steel brace now. His back is still straight as a flagpole." }
            kosul: { bayrak_yok: ["kaya_hapiste", "kaya_yemin_etti", "ihanet_kaya"] }
          - { tr: "\"Elimde tüfek tutabilen üç bin kişi var,\" diyor. \"Kapı tutabilen dört yüz. {yer:kordon|den} {yer:sanayi|e} bir kara hattı kurar, onu da tutarım. Ama göğü tutamam. Bu şehirde göğü tutabilecek tek bir şey var.\" Gözünü sana dikiyor.", en: "\"I've got three thousand people who can hold a rifle,\" he says. \"Four hundred who can hold a Gate. I can build a ground line from {yer:kordon} to {yer:sanayi}, and I can hold it. What I can't hold is the sky. There's exactly one thing in this city that can.\" He looks at you." }
          - metin: { tr: "Anlattığı hattı tanıyorsun: soğuk fırının isli duvarına çivi ucuyla kazıdığı hattın ta kendisi. Tek fark, artık her siperin yanında bir isim olması; isimlerin hiçbiri de onun değil.", en: "You know the line he's describing. It's the same one he scratched into the sooty wall of the cold furnace with the tip of a nail, with one difference: now there's a name next to every trench, and none of the names are his." }
            kosul: { bayrak: "kaya_firin_plani" }
        sezgiler:
          - kosul: { stat: { per: 350 } }
            metin: { tr: "Filonun öncü gemilerinden üçünün karnı açılmış. İçlerinde inmeye hazır, iri ve ağır bir şeyler kıpırdanıyor. İlk dalga yarın değil, bu gece gelecek.", en: "Three of the fleet's lead ships have their bellies open. Something big and slow is stirring inside them, ready to drop. The first wave isn't coming tomorrow. It's coming tonight." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u adam bütün hayatını bu ana hazırlanarak geçirdi. kıyamete herkesten önce hazırdı, hatırlıyor musun? işte geldi.", en: "t̷his man spent his whole life getting ready for this exact moment. he was ready for the end of the world before anybody, remember? well. here it is." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Onunla ne yaşadıysak yaşadık. Bu gece onu hatta istiyorum.\"", en: "\"Whatever's happened between us happened. Tonight I want him on that line.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sana bakıyorum, ona bakıyorum. İkiniz de bunun için yaratılmışsınız. Buna korkayım mı, rahatlayayım mı?\"", en: "\"Look at you. Look at him. You were both made for this. Should that scare me or make me feel better?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İhtiyar iyi general. Ama benden duymasın.\"", en: "\"Old man's a good general. Don't tell him I said so.\"" }
        secenekler:
          - id: "general"
            etiket: { tr: "\"Kara hattı senin. General sensin.\"", en: "\"The ground line is yours. You're the general.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 4, insanlik: 2 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { guven: 8, saygi: 6, baglilik: 6 } }
            kronik: { tr: "Kadim filosunun gölgesinde kara hattını {npc:kaya_demir|e} verdin; {yer:kordon|den} {yer:sanayi|e} her siper artık onun sesini dinleyecekti.", en: "Under the Ancient fleet you handed {npc:kaya_demir} the ground line. Every trench from {yer:kordon} to {yer:sanayi} would answer to his voice now." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "komuta_bende"
            etiket: { tr: "\"Komuta bende. Sen sahadaki generalimsin.\"", en: "\"I'm in command. You're my general in the field.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 5, insanlik: -3 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
            kronik: { tr: "Komutayı kendi elinde tutup {npc:kaya_demir|i} sahadaki generalin yaptın; ordunun bir beyni, iki eli vardı.", en: "You kept full command yourself and made {npc:kaya_demir} your general in the field. The army had one brain and two hands." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "tahliye"
            etiket: { tr: "\"Hattın yarısını sivillerin tahliyesine ayır.\"", en: "\"Put half the line on evacuating civilians.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 30 }
              - ahlak: { merhamet: 6, duzen: -2 }
              - degisken: { hayatta_kalan: 4 }
              - itibar: { siginak: 8, lonca: 2 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
            kronik: { tr: "{npc:kaya_demir|in} ordusunun yarısını sivillerin tahliyesine ayırdın; hattı inceltmeyi göze alıp evlerdeki insanları seçtin.", en: "You put half of {npc:kaya_demir|pos} army on evacuating civilians, and took a thinner line over leaving people in their homes." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "oncu_gosteris"
            tur: "gosteris"
            etiket: { tr: "Ordunun önünde öncü dalgayı tek başına indir", en: "Drop the first wave alone, in front of the army" }
            gerekli: { stat: { str: 400 } }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 80 }
              - unvan: "hattin_mizragi"
              - degisken: { kadim_tehdit: -5 }
              - dikkat: 6
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { lonca: 12, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 12, korku: 4 } }
              - xp_seviye: 150
            kronik: { tr: "Kadim filosunun ilk dalgasını üç bin askerin gözü önünde tek başına indirdin; o gece {yer:kiyikent|in} ordusu adını haykırdı.", en: "You took down the Ancient fleet's first wave alone, with three thousand soldiers watching. That night {yer:kiyikent|pos} army shouted your name." }
            sonraki: "kaya_son_savas_generali_gosteris"
          - id: "oncu_savas"
            etiket: { tr: "Öncü dalgayı hattın önünde karşıla", en: "Meet the first wave out in front of the line" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 3, merhamet: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - savas: { dusmanlar: ["kadim_hat_yarici@oyuncu+3"], ortam: ["su"], kazan: "kaya_son_savas_generali_zafer", kaybet: "kaya_son_savas_generali_yenilgi" }
            kronik: { tr: "İlk dalganın karşısına {npc:kaya_demir|in} hattının önünde çıktın; siperler arkanda dayandı.", en: "You met the Ancient fleet's first wave out in front of {npc:kaya_demir|pos} line. The trenches held behind you." }
          - id: "hesap"
            etiket: { tr: "\"Önce darbenin hesabını vereceksin.\"", en: "\"First you answer for the coup.\"" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { kaya_demir: { guven: -8, saygi: 4 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+3"], ortam: ["su"], kazan: "kaya_son_savas_generali_hesap", kaybet: "kaya_son_savas_generali_hesap_yenilgi" }
            kronik: { tr: "Kadim filosu tepedeyken {npc:kaya_demir|e} darbenin hesabını {yer:kordon|in} siperlerinde sordun.", en: "With the Ancient fleet overhead, you made {npc:kaya_demir} answer for the coup right there in {yer:kordon} trenches." }
          - id: "guvenme"
            etiket: { tr: "\"Sana ordu vermem. Bu savaşı sensiz veririz.\"", en: "\"You don't get an army. We fight this without you.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - iliski: { kaya_demir: { guven: -10, saygi: -4 } }
            kronik: { tr: "{npc:kaya_demir|e} ordu vermedin; yirmi yılını bu güne hazırlanarak geçirmiş adam haritasını katlayıp siperlerden çekildi.", en: "You wouldn't give {npc:kaya_demir} an army. The man who'd spent twenty years getting ready for that day folded his map and left the trenches." }
            sonraki: "kaya_son_savas_generali_pencere"

      - id: "kaya_son_savas_generali_gosteris"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece yarısı ilk Hat Yarıcı körfeze iniyor: üç katlı bina boyunda, sırtı nişancı yuvalarıyla dolu, her adımında yer sarsılıyor. Ardından iki tane daha geliyor. Siperlerde üç bin kişi soluğunu tutmuş.", en: "At midnight the first Line-Breaker drops into the bay: three stories tall, marksman nests on its back, the ground shaking with every step. Two more behind it. In the trenches, three thousand people hold their breath." }
          - { tr: "Siperden çıkıp silahına davranmadan kumsala yürüyorsun. İlki daha sana ulaşamadan çöküp kalıyor; ikincisi dönüp kaçmaya kalkarken yarı yolda yıkılıyor. Üçüncüsü mü? Gemisi onu inmeden geri çekmiş.", en: "You climb out of the trench and walk down onto the beach. You don't draw anything. The first one collapses before it reaches you. The second turns to run and goes down halfway. The third never lands at all. Its ship hauls it back up." }
          - { tr: "Arkandaki siperlerden önce bir uğultu, ardından bir haykırış kopuyor. Üç bin kişi adını bağırıyor.", en: "Behind you, a murmur comes up out of the trenches, then a roar. Three thousand people are shouting your name." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kadim öncü dalgası püskürtüldü]", en: "[Ancient vanguard repelled]" }
            satirlar:
              - { tr: "Düşman kaybı: 2 Hat Yarıcı. Dost kaybı: 0.", en: "Enemy losses: 2 Line-Breakers. Friendly losses: 0." }
              - { tr: "Not: Filo komuta frekansında adın 14 kez geçti.", en: "Note: Your name appeared 14 times on the fleet's command frequency." }
        secenekler:
          - id: "don"
            etiket: { tr: "Siperlere dön", en: "Head back to the trenches" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
            kronik: { tr: "Öncü dalgayı indirdikten sonra siperlere dönüp {npc:kaya_demir|in} yanında durdun.", en: "After you dropped the first wave, you went back to the trenches and stood next to {npc:kaya_demir}." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_zafer"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Hat Yarıcı kumsala yıkılırken sırtındaki son yuvanın ışığı da sönüyor. Ezilmiş bir siperden dönüp geriye bakıyorsun: hat yerinde duruyor.", en: "The Line-Breaker crashes onto the beach and the light in its last nest goes out. You look back from a crushed trench. The line's still there." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Hat Yarıcı kumsala bile ulaşamıyor. Siperlerdeki askerler nasıl düştüğünü birbirine anlatmaya çabalıyor, ama hiçbiri beceremiyor.", en: "The Line-Breaker never even makes the beach. The soldiers in the trenches keep trying to explain to each other how it went down, and none of them can." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Telsizden {npc:kaya_demir|in} sakin sesi geliyor: \"Kara hattı tutuyor. Gök senin.\"", en: "{npc:kaya_demir|pos} voice comes over the radio, calm: \"Ground line's holding. Sky's yours.\"" }
        secenekler:
          - id: "don"
            etiket: { tr: "Hatta dön", en: "Get back to the line" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { kadim_tehdit: -3 }
              - unvan: "hattin_mizragi"
              - xp_seviye: 120
            kronik: { tr: "Kadim öncüsünü indirip {npc:kaya_demir|in} hattına döndün; o gece göğü sen tuttun, yeri o.", en: "You took down the Ancient vanguard and went back to {npc:kaya_demir|pos} line. That night you held the sky and he held the ground." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Hat Yarıcı'nın kuyruğu seni siperin dibine gömüyor. Gözünü açtığında iki asker seni kumdan çıkarıyor; Hat Yarıcı ise yüzlerce mermiyle delik deşik olmuş, siperlerin önünde yatıyor.", en: "The Line-Breaker's tail buries you in the trench. When you open your eyes, two soldiers are digging you out of the sand, and the Line-Breaker lies in front of the trenches, shot full of holes by hundreds of rounds." }
          - { tr: "{npc:kaya_demir} başında dikilmiş: \"Sen onu yavaşlattın, gerisini hat halletti. Bu bir ordu, asker. Yalnız değilsin.\"", en: "\"You slowed it down,\" {npc:kaya_demir} says, standing over you. \"The line did the rest. This is an army, kid. You're not alone out here.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve hatta dön", en: "Get up and get back on the line" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - degisken: { kadim_tehdit: -2 }
              - iliski: { kaya_demir: { guven: 4 } }
            kronik: { tr: "Kadim öncüsü seni kuma gömdü, {npc:kaya_demir|in} hattı da işini senin yerine bitirdi; o gece yalnız olmadığını öğrendin.", en: "The Ancient vanguard buried you in the sand, and {npc:kaya_demir|pos} line finished it for you. That night you learned you weren't alone." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_hesap"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:kaya_demir} siperin çamuruna diz çöküyor; çelik destekli bacağı artık onu taşımıyor. Çevredeki askerler silahlarını indirmiş, kimin emrini bekleyeceklerini bilemiyorlar.", en: "{npc:kaya_demir} goes down on one knee in the trench mud. The braced leg won't hold him anymore. The soldiers around you have lowered their weapons, not sure whose order they're waiting on." }
          - { tr: "\"Devrildim,\" diyor. \"Kural belli. Ama düşman kapıda, senin de bir generale ihtiyacın var. Kararı sen ver.\"", en: "\"I'm toppled,\" he says. \"Rule's clear. But the enemy's at the gate, and you need a general. Your call.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        secenekler:
          - id: "zincirli_general"
            etiket: { tr: "\"Generalim ol. Savaştan sonra hesaplaşırız.\"", en: "\"Be my general. We settle up after.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_general"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 5, merhamet: 2 }
              - iliski: { kaya_demir: { saygi: 8, korku: 4 } }
              - xp_seviye: 150
            kronik: { tr: "{yer:kordon|in} siperlerinde {npc:kaya_demir|i} hem devirdin hem generalin yaptın; darbenin hesabı son savaştan sonraya kaldı.", en: "In {yer:kordon} trenches you toppled {npc:kaya_demir} and made him your general in the same breath. The bill for the coup got pushed past the last battle." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "tutukla"
            etiket: { tr: "Tutuklat; hattı kendin yönet", en: "Have him arrested. Run the line yourself" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ordu: { lonca_avcisi: 40 }
              - ahlak: { duzen: 6, merhamet: -3, insanlik: -3 }
              - itibar: { lonca: 8 }
              - xp_seviye: 150
            kronik: { tr: "{yer:kordon|in} siperlerinde {npc:kaya_demir|i} devirip zincire vurdurdun; son savaşa onun ordusuyla ama onsuz girecektin.", en: "In {yer:kordon} trenches you toppled {npc:kaya_demir} and had him put in irons. You'd go into the last battle with his army, and without him." }
            sonraki: "@akis"

      - id: "kaya_son_savas_generali_hesap_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Süngünün ucu gırtlağının bir parmak önünde duruyor. {npc:kaya_demir} soluk soluğa; çelik destekli bacağı titriyor ama eli titremiyor.", en: "The tip of the bayonet stops an inch from your throat. {npc:kaya_demir} is breathing hard, his braced leg shaking, but his hand isn't." }
          - { tr: "\"Bugün değil,\" diyor ve süngüyü indiriyor. \"Ne benim için ne senin için. Göğe bak. Hesabımız bekleyebilir; onlar beklemez.\"", en: "\"Not today,\" he says, and lowers the bayonet. \"Not for me, not for you. Look up. Our business can wait. They won't.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Elini tut; general o olsun", en: "Take his hand. Let him be the general" }
            etkiler:
              - bayrak: "kaya_general"
              - ordu: { lonca_avcisi: 50 }
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 } }
            kronik: { tr: "Darbenin hesabını sorduğun dövüşü {npc:kaya_demir} kazandı ve seni bağışladı; son savaşta generalliğini kabul ettin.", en: "{npc:kaya_demir} won the fight you picked over the coup, and spared you. In the last battle, you accepted him as general." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_pencere"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:kaya_demir} tek söz etmeden haritasını katlayıp cebine koyuyor. Sonra siperlerden çıkıp çelik destekli bacağıyla topallaya topallaya {yer:sanayi|e} doğru yürüyor.", en: "{npc:kaya_demir} folds his map and puts it in his pocket. He doesn't say a word. He climbs out of the trenches and limps off toward {yer:sanayi} on his braced leg." }
          - { tr: "O gece haddehanenin çatısında, Kadim gemilerinin ışığında yalnız bir karaltı seçiyorsun: elinde tüfek, kıpırdamadan göğü gözlüyor.", en: "That night, up on the roof of the rolling mill, you can make out a lone silhouette in the light of the Ancient ships, rifle in hand, watching the sky without moving." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bırak izlesin", en: "Let him watch" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            kronik: { tr: "{npc:kaya_demir|i} haddehanenin çatısında, elinde tek bir tüfekle göğü gözlerken kendi hâline bıraktın.", en: "You left {npc:kaya_demir} alone on the roof of the rolling mill, a single rifle in his hands, watching the sky." }
            sonraki: "@akis"
          - id: "cik"
            etiket: { tr: "Çatıya çık ve yanında dur", en: "Climb up to the roof and stand with him" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { kaya_demir: { guven: 6 } }
            kronik: { tr: "{npc:kaya_demir|e} ordu vermedin ama o gece çatısına çıkıp yanında durdun; ikiniz de ağzınızı açmadınız.", en: "You didn't give {npc:kaya_demir} an army, but that night you climbed up onto his roof and stood next to him. Neither of you said a word." }
            sonraki: "@akis"

      - id: "kaya_son_savas_generali_selam"
        yer: "kordon"
        paragraflar:
          - { tr: "Şafağa doğru siperlere bir sessizlik çöküyor. {npc:kaya_demir} haritayı katlayıp botlarının bağcıklarını sıkıyor; bir şey söyleyeceği zaman hep böyle yapar.", en: "Toward dawn, the trenches go quiet. {npc:kaya_demir} folds the map and tightens his bootlaces, the way he always does before he says something." }
          - metin: { tr: "Sonra doğrulup topuklarını birleştiriyor, sağ elini kaldırıyor. Bu kez el yarıda kalmıyor: kırk iki kişi için kapıyı tuttuğu geceden beri ilk kez tam bir asker selamı veriyor.", en: "Then he straightens up, brings his heels together and raises his right hand. This time it doesn't stop halfway. For the first time since the night he held that door for forty-two people, he gives a full salute." }
            kosul: { iliski_min: { kaya_demir: { saygi: 50 } } }
          - metin: { tr: "Cebinden eğri bir zincire geçirilmiş iki çelik plaka çıkarıp avucuna bırakıyor. \"Künyem,\" diyor. \"Benden sonra kimin taşıyacağına çoktan karar vermiştim. Söylemedim; söyleseydim itiraz ederdin.\"", en: "He pulls two steel tags on a bent chain out of his pocket and drops them into your palm. \"My dog tags,\" he says. \"I'd already decided who carries these after me. Didn't tell you, because you'd have made a fuss.\"" }
            kosul: { bayrak: "kaya_akil_hocasi" }
          - { tr: "\"Kara hattı tutacak,\" diyor. \"Sen göğü tut. Gerisi, asker, kendiliğinden gelir.\"", en: "\"The ground line will hold,\" he says. \"You hold the sky. The rest, kid, takes care of itself.\"" }
        secenekler:
          - id: "selam_ver"
            etiket: { tr: "Selamına selamla karşılık ver", en: "Return the salute" }
            etkiler:
              - bayrak: "kaya_selam_tam"
              - ahlak: { duzen: 3, insanlik: 2 }
              - esya: { kaya_kunyesi: 1 }
              - iliski: { kaya_demir: { baglilik: 8, guven: 4 } }
            kronik: { tr: "Son savaşın şafağında {npc:kaya_demir|e} topuklarını birleştirip tam bir asker selamı verdin.", en: "At dawn before the last battle you gave {npc:kaya_demir} a full salute." }
            sonraki: "@akis"
          - id: "el_sik"
            etiket: { tr: "Selam verme; elini sık", en: "Don't salute. Shake his hand" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - esya: { kaya_kunyesi: 1 }
              - iliski: { kaya_demir: { guven: 6, saygi: 2 } }
            kronik: { tr: "Selam vermedin; {npc:kaya_demir|in} elini bir asker gibi değil, bir eşit gibi sıktın.", en: "You didn't salute {npc:kaya_demir}. You shook his hand, not like a soldier, but like an equal." }
            sonraki: "@akis"
          - id: "emir"
            etiket: { tr: "\"Hatta dön, general. Bu bir emir.\"", en: "\"Back to the line, General. That's an order.\"" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -2 }
              - iliski: { kaya_demir: { saygi: 4 } }
            kronik: { tr: "Şafak sökerken {npc:kaya_demir|e} emir verdin; o da yirmi yıl boyunca başkalarından duyduğu sözle karşılık verdi: 'Emredersiniz.'", en: "As dawn broke you gave {npc:kaya_demir} an order, and he answered with words he'd spent twenty years hearing from other people: 'Yes, sir.'" }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 5 — TAHT (P4, AY 346)
  - id: "lonca_5_taht"
    konum: ["sanayi"]
    perde: [4]
    gun: { min: 331, max: 357 }
    ana_yay: { gun: 346 }
    kosul: { bayrak: "lonca_5_acik", bayrak_yok: ["lonca_cozuldu", "lonca_kayaya_birakildi"], gun_max: 357 }
    agirlik: 9
    etiketler: ["lonca", "zincir", "taht", "ahlak"]
    gerilim: 3
    onemli: true
    kart: { tr: "Demir Taht", en: "The Iron Chair" }
    sahne: "lonca_5_taht_1"
    sahneler:
      - id: "lonca_5_taht_1"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kadim istilası püskürtüldü. Körfezin üstündeki gökte gemi enkazları hâlâ yanıyor, dumanları {yer:sanayi|in} bacalarından yükselen dumana karışıyor. Şehir Entegrasyon'dan beri ilk kez zafer kokusu alıyor.", en: "The Ancient invasion's been thrown back. Wrecked ships are still burning in the sky over the bay, their smoke mixing with the smoke from {yer:sanayi} stacks, and for the first time in a year the city can smell a victory." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Kadim istilası bir anlaşmayla durdu. Filo hâlâ gökte asılı ama ateş etmiyor. Şehir Entegrasyon'dan beri ilk kez sessiz; bu sessizliğe ne bedel ödendiğini ise henüz kimse tam bilmiyor.", en: "The Ancient invasion stopped on a treaty. The fleet still hangs in the sky, but it isn't firing. For the first time in a year the city is quiet, and nobody's quite sure yet what that quiet cost." }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "{yer:kiyikent|in} yarısı düştü. {yer:kiyikent_liman} yanıyor, {yer:kordon} siper olmaktan bile çıkmış. {yer:sanayi|in} çelik duvarları hâlâ ayakta ve şehirden geriye kalanların çoğu bu duvarların ardına sığınmış.", en: "Half of {yer:kiyikent} fell. The Waterfront's burning and {yer:kordon} isn't even a trench anymore. The Ironworks' steel walls are still standing, and most of what's left of the city is packed in behind them." }
            kosul: { bayrak: "kiyikent_dustu" }
          - { tr: "Haddehanenin ortasında, eskiden ambar kapağı masasının durduğu yerde bir sandalye var. Lonca'nın döküm ustaları onu kaynakla çatmış: sırtı Kuru Havuz'un kraliçesinin kabuğundan, kolları inşaat demirinden, oturağı Pano'nun çelik levhasından. Kimse ona taht demiyor ama herkesin aklından bu geçiyor.", en: "In the middle of the rolling mill, where the hatch-cover table used to be, there's a chair. The Guild's casters welded it together: a back cut from the dry dock queen's shell, arms of rebar, a seat made from the steel plate of the Board itself. Nobody calls it a throne. Everybody's thinking it." }
          - { tr: "Lonca'nın bütün subayları çevresini sarmış. Defterdar yazı altlığını göğsüne bastırmış, Örs balyozunu yere dayamış. Hepsinin gözü sende, çünkü bu gezegende senden güçlü bir şey yok ve Lonca'nın tek kuralı bu.", en: "Every officer in the Guild is standing around it. The Ledger has her clipboard pressed to her chest. Anvil's leaning his sledge on the floor. They're all looking at you. There's nothing stronger than you on this planet, and that's the Guild's only rule." }
          - metin: { tr: "{npc:kaya_demir} çelik destekli bacağıyla sandalyenin yanında duruyor. \"Ben yaptırdım,\" diyor. \"Hiç oturmadım. 'Benden sonra' demiştim, hatırlıyor musun? İşte, benden sonrası bu.\"", en: "{npc:kaya_demir} is standing beside the chair, leg in its brace. \"I had it made,\" he says. \"Never sat in it. I said 'after me,' remember? This is after me.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_devrildi", "ihanet_kaya"] }
          - metin: { tr: "{npc:kaya_demir} sandalyede oturuyor; darbeden beri şehri buradan yönetiyor. Subaylarla birlikte o da sana bakıyor. Yüzünde ne meydan okuma var ne korku, yalnız hesap.", en: "{npc:kaya_demir} is sitting in the chair. He's run the city from it since the coup. While the officers look at you, he looks at you too. There's no challenge on his face and no fear. Just math." }
            kosul: { npc_hayatta: "kaya_demir", bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "Sandalyenin bir koluna eski, eğri bir süngü kaynatılmış. Lonca onu oraya anmak için koymuş; belki de uyarmak için.", en: "An old, bent bayonet has been welded to one arm of the chair. The Guild put it there as a memorial. Or as a warning." }
            kosul: { npc_olu: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { cha: 400 } }
            metin: { tr: "Bu oda yalnız Lonca demek değil: kapıdaki muhafızlar, sokaklardaki Demir Yasa, Kule'deki nöbetler, ordunun tamamı. Bu sandalyeye oturan şehrin başına oturur.", en: "This room isn't just the Guild. The guards at the door, the Iron Law on the streets, the Spire rotations, the whole army. Whoever sits in this chair sits on the city." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷tur. ya da oturma. ama bil ki sistem bu sandalyeyi zaten görüyor. tahta oturan her şeyi hasatta ayrıca tartar.", en: "s̷it. or don't. but know that the system can already see this chair. it weighs everything that sits on a throne separately, come harvest." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Oraya oturursan seni artık hekim olarak muayene edemem. Hükümdar olarak belki.\"", en: "\"Sit there, and I can't examine you as a doctor anymore. As a ruler, maybe.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bütün yıl seni izledim: canavar mı olacak, tanrı mı? Meğer üçüncü bir seçenek varmış: kral.\"", en: "\"I watched this all year. Monster or god, I kept asking. Turns out there was a third option: king.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir sandalye. Kod falan değil, düpedüz sandalye. Bazen en güçlü sistem en ilkel olandır.\"", en: "\"A chair. Not code. A chair. Sometimes the most powerful system is the most primitive one.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Sandalyeye yürü", en: "Walk to the chair" }
            goster: { bayrak_yok: "ihanet_kaya" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Haddehanenin ortasındaki kaynaklı sandalyeye yürüdün; Lonca'nın bütün subayları önünden çekildi.", en: "You walked toward the welded chair in the middle of the rolling mill, and every officer in the Guild stepped aside." }
            sonraki: "lonca_5_taht_otur"
          - id: "yuru_devrik"
            etiket: { tr: "Sandalyeye yürü", en: "Walk to the chair" }
            goster: { bayrak: ["ihanet_kaya", "kaya_devrildi"] }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Darbeyi yapan adamın boşalttığı sandalyeye doğru yürüdün.", en: "You walked toward the chair the man who led the coup had left empty." }
            sonraki: "lonca_5_taht_otur"
          - id: "yuru_anma"
            etiket: { tr: "Süngülü sandalyeye yürü", en: "Walk to the chair with the bayonet" }
            goster: { bayrak: "ihanet_kaya", npc_olu: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Ölmüş bir darbecinin süngüsü kaynatılmış sandalyeye doğru yürüdün.", en: "You walked toward the chair with a dead coup leader's bayonet welded to its arm." }
            sonraki: "lonca_5_taht_otur"
          - id: "indir"
            etiket: { tr: "\"Kalk.\" Onu tahttan zorla indir", en: "\"Get up.\" Drag him off the chair" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi", npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2 }
              - iliski: { kaya_demir: { guven: -8, saygi: 6 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+6"], ortam: ["yanici"], kazan: "lonca_5_taht_kader", kaybet: "lonca_5_taht_yenilgi" }
            kronik: { tr: "Şehri darbeyle alan {npc:kaya_demir|i} tahtından zorla indirdin; Lonca ikinizin dövüşünü haddehanenin ortasında izledi.", en: "You dragged {npc:kaya_demir}, who'd taken the city in a coup, off his own chair. The Guild watched the two of you fight it out in the middle of the rolling mill." }
          - id: "subaylar"
            tur: "gosteris"
            etiket: { tr: "Subaylara dön; kalkmasını onlar istesin", en: "Turn to the officers. Let them tell him to stand" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi", npc_hayatta: "kaya_demir" }
            gerekli: { stat: { cha: 420 } }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - dikkat: 3
              - iliski: { kaya_demir: { guven: -6, saygi: 8 } }
            kronik: { tr: "Lonca'nın subayları birer birer miğferlerini çıkarıp sana döndü; şehri darbeyle alan adam tahtından kendi ayağıyla indi.", en: "One by one, the Guild's officers took off their helmets and turned to you, and the man who'd taken the city in a coup stood up out of his own chair on his own two feet." }
            sonraki: "lonca_5_taht_kader"
          - id: "birak"
            etiket: { tr: "\"O sandalye senin. Hep senindi.\"", en: "\"That chair's yours. It always was.\"" }
            goster: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_devrildi", "ihanet_kaya"] }
            etkiler:
              - bayrak: "lonca_kayaya_birakildi"
              - bayrak: "kaya_akil_hocasi"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 4, duzen: 2 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { baglilik: 12, guven: 10, saygi: 8 } }
              - xp_seviye: 200
            kronik: { tr: "Demir Lonca'nın tahtını {npc:kaya_demir|e} bıraktın; yaptırıp hiç oturmadığı sandalyeye sonunda kendisi oturdu.", en: "You left the Iron Guild's chair to {npc:kaya_demir}. He finally sat in the chair he'd had made and never once used." }
            sonraki: "lonca_5_taht_hoca"
          - id: "erit"
            etiket: { tr: "\"Bu sandalyeyi eritin.\"", en: "\"Melt this chair down.\"" }
            etkiler:
              - bayrak: "lonca_cozuldu"
              - bayrak_kaldir: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 6, duzen: -2, merhamet: 3 }
              - itibar: { siginak: 15, lonca: -6 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: -2 } }
              - xp_seviye: 200
            kronik: { tr: "Demir tahtı Döküm'ün potasında erittirip Lonca'yı Konsey'e bağladın; şehrin en güçlü ordusu artık bir oyla yönetilecekti.", en: "You had the Iron Guild's chair melted down in the Foundry's crucible and folded the Guild into the Council. The strongest army in the city would answer to a vote now." }
            sonraki: "lonca_5_taht_erit"

      - id: "lonca_5_taht_kader"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} haddehanenin zemininde, sandalyenin dibinde yatıyor. Çelik desteği kırılmış; süngü elinde ama kaldırmıyor.", en: "{npc:kaya_demir} is on the mill floor at the foot of the chair. His brace is broken. The bayonet's in his hand, but he isn't raising it." }
          - { tr: "\"Kural belli,\" diyor. \"Bunu da ben yazdım. Devrilen komutan ya ölür ya gider.\"", en: "\"Rule's clear,\" he says. \"I wrote that one too. A toppled commander either dies or goes.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Kuralı uygula", en: "Apply the rule" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - unvan: "demir_deviren"
              - npc_ol: "kaya_demir"
              - ahlak: { merhamet: -8, duzen: 5, insanlik: -5 }
              - efsane: "acimasiz_infaz_tanikli"
            kronik: { tr: "Darbeyle şehri alan {npc:kaya_demir|i} kendi tahtının dibinde, kendi kuralıyla öldürdün.", en: "You killed {npc:kaya_demir}, who'd taken the city in a coup, at the foot of his own chair, by his own rule." }
            sonraki: "lonca_5_taht_otur"
          - id: "hapis"
            etiket: { tr: "Soğuk fırına kapat", en: "Lock him in the cold furnace" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 5, merhamet: 2 }
            kronik: { tr: "Darbeci {npc:kaya_demir|i} tahtından indirip haddehanenin soğuk fırınına kapattın; demir kapı arkasından kilitlendi.", en: "You pulled {npc:kaya_demir} off his throne and locked him in the mill's cold furnace. The iron door shut behind him." }
            sonraki: "lonca_5_taht_otur"
          - id: "surgun"
            etiket: { tr: "\"Git.\"", en: "\"Go.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_surgun"
              - unvan: "demir_deviren"
              - npc_gitti: "kaya_demir"
              - ahlak: { merhamet: 3, duzen: -2 }
            kronik: { tr: "{npc:kaya_demir|i} tahtından indirip şehirden sürdün; topallaya topallaya uzaklaştı ve nereye gittiğini kimse öğrenemedi.", en: "You pulled {npc:kaya_demir} off his throne and exiled him. He limped out, and in the world's last days nobody knew where he went." }
            sonraki: "lonca_5_taht_otur"

      - id: "lonca_5_taht_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Süngü gırtlağının bir parmak önünde duruyor. {npc:kaya_demir} kırık desteğine rağmen sandalyenin önünde dimdik ayakta. \"Bugün değil,\" diyor. \"Bunlar bu şehrin son günleri. Birbirimizi öldürerek harcamayacağız.\"", en: "The bayonet stops an inch from your throat. {npc:kaya_demir} is on his feet in front of the chair, broken brace and all. \"Not today,\" he says. \"These are this city's last days. We're not spending them killing each other.\"" }
          - { tr: "Subayların bakışları ikiniz arasında gidip geliyor. Lonca'nın kuralı açık: kazanan oturur. Kazanan da o.", en: "The officers look from one of you to the other. The Guild's rule is clear: winner sits. He won." }
        secenekler:
          - id: "diz"
            etiket: { tr: "Başını eğ; tahtı ona bırak", en: "Bow your head. Leave him the chair" }
            etkiler:
              - bayrak: "lonca_kayaya_birakildi"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { duzen: 4, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 8, guven: 4 } }
              - xp_seviye: 120
            kronik: { tr: "Demir Lonca'nın tahtı için {npc:kaya_demir|le} dövüşüp kaybettin; başını eğip sandalyeyi ona bıraktın.", en: "You fought {npc:kaya_demir} for the Iron Guild's chair and lost. You bowed your head and left him the seat." }
            sonraki: "@akis"
          - id: "erit"
            etiket: { tr: "\"O zaman kimse oturmasın. Eritin.\"", en: "\"Then nobody sits in it. Melt it.\"" }
            etkiler:
              - bayrak: "lonca_cozuldu"
              - bayrak_kaldir: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 5, duzen: -3 }
              - itibar: { siginak: 10, lonca: -8 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
              - xp_seviye: 120
            kronik: { tr: "Taht dövüşünü {npc:kaya_demir|e} kaybettin ama Lonca sandalyeyi eritme çağrına kulak verdi; sonunda tahtın kendisi kaybetti.", en: "You lost the fight for the chair to {npc:kaya_demir}, but the Guild heard your call to melt it down. In the end, the throne itself lost." }
            sonraki: "lonca_5_taht_erit"

      - id: "lonca_5_taht_otur"
        yer: "sanayi"
        paragraflar:
          - { tr: "Sandalyenin önünde duruyorsun. Kraliçenin kabuğundan kesilmiş sırtlık buz gibi. Pano'nun levhasından yapılmış oturakta kimsenin silmediği bir tebeşir izi kalmış: en üst satırda senin adın.", en: "You stand in front of the chair. The back, cut from the queen's shell, is cold. On the seat made from the Board's plate, there's still a chalk mark nobody wiped off: the top line. Your name." }
          - metin: { tr: "{npc:kaya_demir|in} künyesi cebinde ağırlaşıyor.", en: "{npc:kaya_demir|pos} dog tags get heavy in your pocket." }
            kosul: { esya: { kaya_kunyesi: 1 } }
          - { tr: "Haddehanede herkes soluğunu tutmuş. Vinçler durmuş, döküm kalıpları soğuyor. Şehrin bütün silahları bu sandalyeye çevrilmiş.", en: "Nobody in the mill is breathing. The cranes have stopped. The casting molds are cooling. Every weapon in the city is pointed at this chair, waiting." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Otur", en: "Sit down" }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 80 }
              - ahlak: { duzen: 8, insanlik: -6 }
              - itibar: { lonca: 20, siginak: -10 }
              - xp_seviye: 250
            kronik: { tr: "Haddehanenin ortasındaki demir tahta oturdun; o andan sonra şehrin bütün silahları, bütün yasaları, bütün sokakları tek bir sese, seninkine baktı.", en: "You sat down in the iron chair in the middle of the rolling mill. From that moment, every weapon, every law and every street in the city waited on a single voice. Yours." }
            sonraki: "lonca_5_taht_son"
          - id: "kuleye"
            tur: "gosteris"
            etiket: { tr: "Sandalyeyi tek elle kaldırıp Kule'ye çevir, otur", en: "Lift the chair one-handed. Turn it to the Spire. Sit" }
            gerekli: { stat: { str: 450 } }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 100 }
              - dikkat: 8
              - ahlak: { duzen: 10, insanlik: -8 }
              - itibar: { lonca: 25, siginak: -12 }
              - xp_seviye: 300
            kronik: { tr: "Demir tahtı tek elle kaldırıp Kule'ye, yani Sistem'in kendisine çevirdin ve öyle oturdun; Lonca bunu taç giyme töreni, gök ise meydan okuma diye okudu.", en: "You lifted the iron chair one-handed, turned it to face the Spire, the System itself, and sat down. The Guild read it as a coronation. The sky read it as a challenge." }
            sonraki: "lonca_5_taht_son"
          - id: "yumusak"
            etiket: { tr: "Otur; ilk emrin Demir Yasa'yı yumuşatmak olsun", en: "Sit. Make your first order softening the Iron Law" }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 70 }
              - ahlak: { duzen: 5, merhamet: 5 }
              - itibar: { lonca: 15, siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 250
            kronik: { tr: "Demir tahta oturur oturmaz verdiğin ilk emirle Demir Yasa'nın sokağa çıkma yasağını kaldırdın; şehir seni hükümdarı bildi ama geceleri yeniden sokağa çıktı.", en: "You sat down in the iron chair, and with your first order you lifted the Iron Law's curfew. The city knew you as its ruler, and started going out at night again." }
            sonraki: "lonca_5_taht_son"

      - id: "lonca_5_taht_son"
        yer: "sanayi"
        paragraflar:
          - { tr: "Oturduğun anda haddehanede bir ses yükseliyor: önce subaylardan, sonra vinçlerin üstünden, kirişlerden, kapılardan. Turuncu yamalı yüzlerce kol birden havaya kalkıyor.", en: "The moment you sit, a sound goes up in the mill: from the officers first, then from the cranes, the girders, the doorways. Hundreds of orange-patched arms go up at once." }
          - metin: { tr: "{npc:kaya_demir} çelik destekli bacağıyla kalabalığın en önünde dimdik duruyor. Topuklarını birleştirip sana tam bir selam veriyor.", en: "{npc:kaya_demir} stands at the very front of the crowd on his braced leg, straight as a rod. He brings his heels together and gives you a full salute." }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_hapiste", "kaya_surgun"] }
          - { tr: "Defterdar Pano'ya yürüyüp en üst satırın da üstüne tebeşirle tek bir kelime yazıyor. Ne rütbe ne unvan: yalnız senin adın.", en: "The Ledger walks to the Board and, above even the top line, writes a single thing in chalk. Not a rank. Not a title. Your name, and nothing else." }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[Fraksiyon kontrolü: Demir Lonca → {oyuncu}]", en: "[Faction control: Iron Guild → {oyuncu}]" }
            satirlar:
              - { tr: "{yer:kiyikent|in} silahlı gücünün %71'i artık tek bir komuta bağlı.", en: "71% of {yer:kiyikent|pos} armed strength now answers to a single command." }
              - { tr: "Not: Sistem bu durumu 'beklenmedik' olarak işaretledi.", en: "Note: The System has flagged this as 'unexpected.'" }
        secenekler:
          - id: "ilk_emir"
            etiket: { tr: "\"Hasat günü gelene kadar kimse hattı bırakmayacak.\"", en: "\"Nobody leaves the line until harvest day.\"" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -2 }
              - degisken: { kadim_tehdit: -3 }
            kronik: { tr: "Demir tahttan verdiğin ilk emir hattı tutmaktı: hasat gününe kadar kimse siperini bırakmayacaktı.", en: "Your first order from the iron chair was to hold the line: nobody leaves a trench until harvest day." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme; yalnızca otur", en: "Don't say anything. Just sit" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - dikkat: 2
            kronik: { tr: "Demir tahta oturduğunda tek kelime etmedin; Lonca sessizliğini bir emir gibi yerine getirdi.", en: "When you sat down in the iron chair, you didn't say a word. The Guild carried out your silence like an order." }
            sonraki: "@akis"

      - id: "lonca_5_taht_hoca"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun uzun önce sandalyeye, sonra sana bakıyor. \"Bunu ben yaptırdım,\" diyor. \"Senin için.\"", en: "{npc:kaya_demir} looks at the chair a long time. Then at you. \"I had this made for you,\" he says. \"For you.\"" }
          - { tr: "\"Biliyorum,\" diyorsun ve yirmi yıl başkalarını sandalyelere oturtmuş adam ilk kez kendisi oturuyor. Sana bakarken gözleri nemleniyor; bir asker gibi saklamaya da çalışmıyor.", en: "\"I know,\" you say. And after twenty years of putting other people in chairs, he sits down in one himself for the first time. He looks at you. Something in his eyes is wet, and for once he doesn't try to hide it like a soldier would." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Ona selam ver", en: "Salute him" }
            etkiler:
              - bayrak: "kaya_selam_tam"
              - ahlak: { duzen: 3, insanlik: 2 }
            kronik: { tr: "Başçavuş tahta oturduğunda ona selam verdin; bu kez selam aşağıdan yukarıya verildi.", en: "When the Gunny sat down in the chair, you saluted him. For once the salute went from the bottom up." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Bir şey söyleme; hatta dön", en: "Say nothing. Go back to the line" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
            kronik: { tr: "Tahtı {npc:kaya_demir|e} bırakıp tek kelime etmeden, sessizce hatta geri döndün.", en: "You left the chair to {npc:kaya_demir} and went back to the line without a word." }
            sonraki: "@akis"

      - id: "lonca_5_taht_erit"
        yer: "sanayi"
        paragraflar:
          - { tr: "Döküm ustaları sandalyeyi potaya taşıyor. Önce Pano'nun levhası eriyor, en üst satırdaki adın turuncu bir ışığın içinde kaybolup gidiyor; kraliçenin kabuğu ise en sona kalıyor.", en: "The casters haul the chair to the crucible. The queen's shell is the last thing to melt. The Board's plate goes first, and your name on the top line disappears into the orange light." }
          - { tr: "Ertesi sabah haddehanenin kapısına, Lonca'nın sancağının yanına Konsey'inki de asılıyor. İki bayrak, tek direk.", en: "The next morning the Council's banner goes up on the mill door, right beside the Guild's. Two flags, one pole." }
        secenekler:
          - id: "izle"
            etiket: { tr: "İki bayrağın dalgalanmasını izle", en: "Watch the two flags go up" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            kronik: { tr: "Lonca'nın ve Konsey'in bayraklarını haddehanenin kapısında aynı direkte dalgalanırken izledin; {yer:kiyikent|in} son günlerinde ilk kez tek bir şehir vardı.", en: "You watched the Guild's flag and the Council's fly from the same pole over the mill door. In {yer:kiyikent|pos} last days, for the first time, there was one city." }
            sonraki: "@akis"

  # ================================================================== ÖRS'ÜN SOĞUK ODASI (tohum: lonca_2_rutbe · ors_kin)
  - id: "ors_soguk_oda"
    konum: ["sanayi"]
    perde: [2, 3]
    agirlik: 1
    etiketler: ["lonca", "ahlak", "sanayi"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Soğuk oda", en: "The cold room" }
    sahne: "ors_soguk_oda_1"
    sahneler:
      - id: "ors_soguk_oda_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Defterdar nerede olursan ol seni buluyor; yazı altlığı koltuğunun altında, eldivenlerinin parmak uçları delinmiş. \"{yer:sanayi|e} gelmen lazım,\" diyor. \"Kural öyle istediği için değil.\"", en: "The Ledger finds you wherever you are, clipboard under her arm, the fingertips of her gloves worn through. \"You need to come to {yer:sanayi},\" she says. \"Not because of any rule.\"" }
          - { tr: "Döküm'ün rüzgâra açık arka tarafında basamaksızların barındığı bir konteyner sırası var. En sondakinin iç duvarlarını kırağı sarmış. Köşede Örs'ün balyozunu satıp aldığı gaz sobası buz gibi duruyor; gaz yağına verecek para kalmamış.", en: "Out back of the Foundry, where the wind hits hardest, there's a row of shipping containers for people with no rung. Frost has crept up the inside walls of the last one. In the corner sits the kerosene heater Anvil sold his sledge to buy, stone cold, because there was nothing left over for kerosene." }
          - { tr: "Portatif bir yatakta, üç battaniyenin altında, Merdiven Günü turuncu kartı göğsüne bastıran küçük oğlan öksürüp duruyor. Ters çevrilmiş bir kovanın üstünde oturan Örs yüzüne bakmadan konuşuyor: \"Seni buraya ben çağırmadım.\"", en: "On a cot under three blankets, the little boy who clutched the orange card on Ladder Day is coughing. Anvil sits on an upturned bucket and talks without looking at you. \"I didn't call you here.\"" }
          - { tr: "\"Ben çağırdım,\" diyor Defterdar. \"Kural rütbeyi korur. Çocuğu korumaz.\"", en: "\"I did,\" says the Ledger. \"The rule protects the rank. It doesn't protect the kid.\"" }
        sezgiler:
          - kosul: { stat: { per: 80 } }
            metin: { tr: "Çocuğun göğsünden ıslak bir hırıltı geliyor: zatürre. Bu soğukta üç gün daha kalırsa ateşi düşmeyecek.", en: "There's a wet rattle in the kid's chest: pneumonia. Three more days in this cold and that fever isn't coming down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ir basamak aldın. basamağın altında bu oda vardı. merdivenler hep bir şeyin üstüne kurulur; çoğu zaman birinin.", en: "y̷ou took a rung. this room was under it. ladders always get built on top of something. usually someone." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Zatürre. Bunu duymak için hekim olmaya gerek yok. Bir saat bile bekletme.\"", en: "\"That's pneumonia. You don't need a medical degree to hear it. Don't wait another hour.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O gün herkes alkışladı. Bugün burada kimse yok.\"", en: "\"Everybody cheered that day. Today there's nobody here.\"" }
        secenekler:
          - id: "kart"
            etiket: { tr: "Turuncu kartını yatağın üstüne bırak", en: "Leave your orange card on the cot" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - bayrak_kaldir: "ors_kin"
              - bayrak: "ors_borclu"
              - degisken: { hayatta_kalan: 1 }
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
              - xp_seviye: 15
            sonraki: "ors_soguk_oda_kart"
          - id: "revir"
            etiket: { tr: "Çocuğu sırtla; Sığınak'ın revirine taşı", en: "Carry the kid to the Haven clinic yourself" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - bayrak_kaldir: "ors_kin"
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - xp_seviye: 15
            sonraki: "ors_soguk_oda_revir"
          - id: "kural"
            etiket: { tr: "\"Kural kural. Gelecek Merdiven Günü geri alsın.\"", en: "\"Rules are rules. He can win it back next Ladder Day.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -5 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "ors_soguk_oda_kural"
          - id: "kapi"
            tur: "gosteris"
            etiket: { tr: "Bir kapıya gir; bütün sırayı ısıtacak kristal getir", en: "Clear a Gate tonight. Bring crystal for the whole row" }
            gerekli: { stat: { end: 80 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -2 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 4 }
              - xp_seviye: 20
            sonraki: "ors_soguk_oda_kapi"

      - id: "ors_soguk_oda_kart"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kartı cebinden çıkarıp battaniyenin üstüne bıraktığında Örs önce karta, sonra sana bakıyor; çene kası bir kez seğiriyor. \"Bunu almam,\" diyor.", en: "You take the card out of your pocket and set it on the blanket. Anvil looks at the card, then at you, and a muscle in his jaw jumps once. \"I'm not taking that,\" he says." }
          - { tr: "\"Senin için değil.\" Oğlanın eli battaniyenin altından çıkıp Merdiven Günü'ndeki gibi sımsıkı kartın üstüne kapanıyor. Örs o küçük ele uzun uzun baktıktan sonra yüzünü duvara çeviriyor.", en: "\"It's not for you.\" The boy's hand comes out from under the blanket and closes over the card, tight, same as on Ladder Day. Anvil stares at that small hand for a long time. Then he turns his face to the wall." }
          - metin: { tr: "Ertesi sabah kantinde, basamaksızların sırasında tepsinle beklerken {npc:kaya_demir} yanına geliyor. \"Komutan kendi tayınını çavuşuna verirse o çavuş komutanı için ölür,\" diyor alçak sesle. \"Kitapta yazmaz bu. Yazmalı.\"", en: "Next morning in the mess hall, while you're waiting with your tray in the no-rung line, {npc:kaya_demir} walks up next to you. \"An officer gives his rations to his sergeant, that sergeant will die for him,\" he says quietly. \"That's not in the book. It ought to be.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Ertesi sabah kantinde, basamaksızların sırasında tepsinle beklerken subay konseyinin en yaşlısı yanından geçiyor ve tek kelime etmeden sana başıyla selam veriyor.", en: "Next morning in the mess hall, while you wait with your tray in the no-rung line, the oldest officer on the council walks past and nods at you without a word." }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "sira"
            etiket: { tr: "Sıranı bekle; tepsini doldur", en: "Wait your turn. Fill your tray" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "cavus"
            etiket: { tr: "Örs'ün çavuşluğunu Pano'ya geri yazdır", en: "Get Anvil's sergeant stripes back on the Board" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"

      - id: "ors_soguk_oda_revir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Oğlanı battaniyesiyle birlikte sırtına alıp gece yarısı {yer:sanayi|den} {yer:kiyikent_liman|e} yürüyorsun. Örs eli boş, adımlarını seninkine uydurmaya çalışarak arkandan geliyor. Çocuğu taşımayı bir kez bile teklif etmiyor; teklif edecek yüzü yok.", en: "You hoist the boy onto your back, blanket and all, and walk from {yer:sanayi} to {yer:kiyikent_liman} in the middle of the night. Anvil follows, empty-handed, trying to match your stride. Not once does he offer to carry him. He doesn't have the face for it." }
          - { tr: "Gece üçte revirin lambası hâlâ yanıyor. {npc:elif_sari} çocuğun göğsünü dinledikten sonra sana dönüyor: \"İki gün daha gecikseydin konuşacak bir şeyimiz kalmazdı.\" Sığınak'ın son antibiyotik kutusundan bir şırınga dolduruyor.", en: "The clinic lamp is still on at three in the morning. {npc:elif_sari} listens to the boy's chest, then looks at you. \"Two more days and we wouldn't be having this conversation.\" She fills a syringe from the Haven's last box of antibiotics." }
          - { tr: "Şafağa doğru Örs revirin kapısında yanına çöküyor. \"Sana borçlu değilim,\" diyor gözünü duvardan ayırmadan. \"Ama kinim de kalmadı. Nereye gitti, bilmiyorum.\"", en: "Toward dawn, Anvil sits down next to you in the clinic doorway. \"I don't owe you,\" he says, staring at the wall. \"But the grudge is gone too. I don't know where it went.\"" }
        secenekler:
          - id: "cay"
            etiket: { tr: "Ona bir bardak çay ver", en: "Hand him a cup of coffee" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Çocuğun ateşi düşene kadar revirde kal", en: "Stay at the clinic till the kid's fever breaks" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
            sonraki: "@akis"

      - id: "ors_soguk_oda_kural"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs başını sallıyor. \"Kural kural,\" diyor; Defterdar'ın yüzünde bir şey kapanıyor. O gece Örs balyozsuz, elinde yalnız bir levyeyle, basamaksız birinin gidebileceği tek yere gidiyor: kimsenin almak istemediği bir D kademesi kapıya.", en: "Anvil nods. \"Rules are rules,\" he says, and something in the Ledger's face shuts. That night Anvil goes out with no sledge, just a crowbar, to the only place a man with no rung can go: a D-Grade Gate nobody else wanted." }
          - { tr: "Şafakta dönüyor; kolundaki sargı kana bulanmış, elinde bir bidon gaz yağı. Konteyner sırası boyunca yürürken yanından geçip gidiyor, sana bakmıyor bile.", en: "He comes back at dawn, the wrap on his arm soaked through with blood, a jerrycan of kerosene in his hand. Walking down the container row, he goes right past you and doesn't look." }
          - metin: { tr: "Balkondan izleyen {npc:kaya_demir} aşağı inmeden sesleniyor: \"Kural dayandı. Adam da dayandı. Bir gün ikisinden biri dayanmayacak.\"", en: "{npc:kaya_demir} watches from the balcony and doesn't come down. He just calls it out: \"The rule held. So did the man. One of these days, one of them won't.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürü", en: "Walk away" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"
          - id: "kolla"
            etiket: { tr: "Ertesi gece kapıda onu gizlice kolla", en: "Next night, shadow him through the Gate unseen" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
            sonraki: "@akis"

      - id: "ors_soguk_oda_kapi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şafakta kapıdan çıkıyorsun; sırtındaki çuvalda o D kademesi kapıdan ne kadar kristal çıktıysa hepsi var. Çuvalı konteyner sırasının ortasına boşaltınca kristaller kırağının üstünde mavi mavi parlıyor.", en: "You come out of the Gate at dawn with a sack on your back holding every crystal that D-Grade Gate had in it. You dump it out in the middle of the container row, and the crystals glow blue against the frost." }
          - { tr: "Konteynerlerin kapıları açılıyor; basamaksızlar birer birer dışarı çıkıp önce inanamadan bakıyor, sonra avuç avuç topluyor. Bu sıra bir ay boyunca ısınacak.", en: "Doors open. The no-rung families come out one at a time, not believing it at first, then scooping it up by the handful. This row is going to be warm for a month." }
          - { tr: "Örs kalabalığa karışmıyor. \"Ben bir kapıyı tek balyozla üç gün tuttum,\" diyor kristallere bakarak, \"sen koca bir geceyi bir çuvala doldurdun.\" Sesinde ne teşekkür var ne öfke; küçülmüş bir adamın sesi bu.", en: "Anvil doesn't join the crowd. \"I held a Gate for three days with a sledgehammer,\" he says, looking at the crystals, \"and you put a whole night in a sack.\" There's no thanks in it and no anger, just the voice of a man who got smaller." }
        secenekler:
          - id: "defterdar"
            etiket: { tr: "Kristalleri Defterdar dağıtsın; sırayla", en: "Let the Ledger hand it out. In order" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"
          - id: "avuc"
            etiket: { tr: "Bir avuç kristali Örs'ün eline kendin koy", en: "Put a handful in Anvil's hand yourself" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
            sonraki: "@akis"

  # ================================================================== SOĞUK FIRIN (tohum: kaya_darbe_gecesi · hapis)
  - id: "kaya_soguk_firin"
    konum: ["sanayi"]
    perde: [3]
    agirlik: 1
    etiketler: ["lonca", "npc", "hapis"]
    gerilim: 2
    yalniz_tohum: true
    npc: ["kaya_demir"]
    kart: { tr: "Soğuk fırın", en: "The cold furnace" }
    sahne: "kaya_soguk_firin_1"
    sahneler:
      - id: "kaya_soguk_firin_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Defterdar'ın notu nerede olursan ol seni buluyor. Tek satır: \"Fırına gelmen lazım.\" Haddehane gece vardiyasına göre bile sessiz; vinçler durmuş, yalnız soğuk fırının önünde bir fener yanıyor.", en: "A note from the Ledger finds you wherever you are, one line: \"Come to the furnace.\" The mill is quiet even for the night shift. The cranes are still, and the only light is a lantern outside the cold furnace." }
          - metin: { tr: "Nöbette Örs var. Anahtarı uzatırken sesini alçaltıyor: \"Başçavuş on gündür uyumuyor. Bir şey çiziyor.\"", en: "Anvil has the watch. He keeps his voice down as he hands over the key. \"Gunny hasn't slept in ten days. He's drawing something.\"" }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Fırının önündeki nöbetçi anahtarı uzatırken gözlerini kaçırıyor. \"On gündür uyumuyor,\" diyor. \"Bir şey çiziyor.\"", en: "The guard outside the furnace hands you the key and won't meet your eyes. \"Hasn't slept in ten days,\" he says. \"He's drawing something.\"" }
            kosul: { bayrak_yok: "ors_borclu" }
          - { tr: "İçeride {npc:kaya_demir} mum ışığında, sırtı kapıya dönük oturuyor. Fırının isli iç duvarları baştan başa çizgilerle dolu: çivi ucuyla kazınmış bir kıyı şeridi, {yer:kordon|den} {yer:sanayi|e} uzanan siperler, geri çekilme hatları. Köşelerde küçük rakamlar var: 3.000 tüfek, 400 kapı.", en: "Inside, {npc:kaya_demir} sits by a candle with his back to the door. The sooty inner walls of the furnace are covered end to end in lines: a coastline scratched in with the tip of a nail, trenches running from {yer:kordon} to {yer:sanayi}, fallback lines, little numbers in the corners. 3,000 rifles. 400 Gates." }
          - { tr: "\"Asker hapiste de askerdir,\" diyor arkasını dönmeden. \"Olduğum şeyi bırakamıyorum. Sen de bırakmamı istemedin; isteseydin beni öldürürdün.\"", en: "\"A soldier in a cell is still a soldier,\" he says without turning around. \"I can't stop being what I am. And you didn't want me to. If you had, you'd have killed me.\"" }
        sezgiler:
          - kosul: { stat: { per: 160 } }
            metin: { tr: "Plan iyi, hatta iyiden de öte: ikinci hat {yer:kordon|in} eski iskelesinin altından dolaşıyor; senin aklının ucundan bile geçmemiş bir yer.", en: "The plan's good. Better than good: the second line runs under {yer:kordon|pos} old pier, somewhere that never once crossed your mind." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷na dört duvar verdin; dördünü de kullanmış. böyle bir adamı kilitleyebilirsin. ne için yapıldığını kilitleyemezsin.", en: "y̷ou gave him four walls. he used all four. you can lock up a man like this. you can't lock up what he was made for." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu adam Konsey'i basacaktı. Şimdi Konsey'i nasıl koruyacağını çiziyor. İnsan ne tuhaf.\"", en: "\"This man was going to storm the Council. Now he's drawing how to defend it. People are strange.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ona bakınca ne görüyorum biliyor musun? Seni. Yirmi yıl sonra.\"", en: "\"You know what I see when I look at him? You. Twenty years from now.\"" }
        secenekler:
          - id: "kopya"
            etiket: { tr: "Duvarı kopyalat; planı subaylara götür", en: "Have the wall copied. Take it to the officers" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { duzen: 3, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
              - xp_seviye: 20
            sonraki: "kaya_soguk_firin_kopya"
          - id: "sil"
            etiket: { tr: "Duvarı sil. Sen tutuklusun, general değil", en: "Wipe the wall. You're a prisoner, not a general" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - iliski: { kaya_demir: { korku: 4, guven: -6 } }
            sonraki: "kaya_soguk_firin_sil"
          - id: "lamba"
            etiket: { tr: "Ona lamba, kâğıt ve sandalye getir", en: "Bring him a lamp, paper, and a chair" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { kaya_demir: { guven: 5, baglilik: 3 } }
              - xp_seviye: 20
            sonraki: "kaya_soguk_firin_lamba"
          - id: "ac"
            etiket: { tr: "Kapıyı açık bırak: \"Git, hattını kendin kur.\"", en: "Leave the door open. \"Go build your line yourself.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 30 } } }
            etkiler:
              - bayrak_kaldir: "kaya_hapiste"
              - bayrak: "kaya_firin_plani"
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { lonca: -2 }
              - iliski: { kaya_demir: { guven: 10, baglilik: 6, saygi: 4 } }
              - xp_seviye: 25
            sonraki: "kaya_soguk_firin_acik"

      - id: "kaya_soguk_firin_kopya"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısından sonra Defterdar iki çizerle geliyor. Fenerin ışığında duvarı siper siper kâğıda geçiriyorlar; {npc:kaya_demir} her yanlış çizgiyi sesini yükseltmeden düzeltiyor.", en: "After midnight the Ledger shows up with two draftsmen. By lantern light they copy the wall onto paper, trench by trench, and {npc:kaya_demir} corrects every wrong line without raising his voice." }
          - { tr: "Kopya şafakla birlikte bitiyor. Defterdar başlığa ne yazacağını sorunca {npc:kaya_demir} başını kaldırmadan cevap veriyor: \"Benim adımı yazmayın. Kimse bir tutuklunun planına uymaz.\"", en: "The copy's done by dawn. The Ledger asks what to put at the top, and {npc:kaya_demir} doesn't look up. \"Don't put my name on it. Nobody follows a prisoner's plan.\"" }
        secenekler:
          - id: "ad_yaz"
            etiket: { tr: "Adını yaz", en: "Put his name on it" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 2 } }
            sonraki: "@akis"
          - id: "adsiz"
            etiket: { tr: "Başlığı boş bırak", en: "Leave the top blank" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_sil"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir kova suyla bir bez istiyorsun. {npc:kaya_demir} kalkıp kenara çekiliyor ve çizgilerin teker teker silinişini izliyor: önce geri çekilme hatları, sonra siperler, en son kıyı.", en: "You ask for a bucket of water and a rag. {npc:kaya_demir} gets up, steps aside, and watches every line disappear: the fallback lines first, then the trenches, the coastline last." }
          - { tr: "Duvar yeniden isli ve bomboş kalınca başını sallıyor. \"Doğru,\" diyor. \"Ben de öyle yapardım.\"", en: "When the wall's black and blank again, he nods. \"Correct,\" he says. \"I'd have done the same.\"" }
          - { tr: "Kapıya dönerken arkandan sesleniyor: \"İkinci hat eski iskelenin altından geçmeli. Geçmezse {yer:kordon} bir gecede düşer.\"", en: "As you turn for the door, he calls after you. \"The second line has to run under the old pier. If it doesn't, {yer:kordon} falls in one night.\"" }
        secenekler:
          - id: "kilitle"
            etiket: { tr: "Hiçbir şey söyleme; kapıyı kilitle", en: "Say nothing. Lock the door" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
            sonraki: "@akis"
          - id: "iskele"
            etiket: { tr: "\"Eski iskele. Tamam.\"", en: "\"The old pier. Got it.\"" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_lamba"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir saat sonra fırının içinde bir gaz lambası, masa niyetine ters çevrilmiş bir sandık, bir sandalye ve bir deste kâğıt duruyor. {npc:kaya_demir} oturmadan önce sandalyeye bir süre bakıyor; sandalyenin bir teklif olduğunu anlamış gibi.", en: "An hour later the furnace has a kerosene lamp, an upturned crate for a desk, a chair, and a stack of paper. {npc:kaya_demir} looks at the chair a while before he sits, like he's figured out that a chair is an offer." }
          - { tr: "Sabaha kadar çiziyor, sen de kapının dibinde oturuyorsun. Bir ara kalemi bırakmadan konuşuyor: \"Bir daha yanlış emre uymayacağıma yemin etmiştim. Yanlış emri verenin ben olacağım hiç aklıma gelmedi.\"", en: "He draws all night while you sit by the door. At some point he talks without putting the pencil down. \"I swore I'd never follow a wrong order again. It never crossed my mind I'd be the one giving it.\"" }
          - { tr: "Şafakta sana otuz sayfa uzatıyor. Her sayfanın köşesinde bir numara, her siperin yanında bir isim yazılacak boşluk var.", en: "At dawn he hands you thirty pages, a number in the corner of every one, and next to every trench, a blank for a name." }
        secenekler:
          - id: "al"
            etiket: { tr: "Sayfaları al; subaylara götür", en: "Take the pages to the officers" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "\"Kendin vereceksin. Zamanı gelince.\"", en: "\"You'll hand them over yourself. When it's time.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { kaya_demir: { baglilik: 3 } }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Anahtarı kilitten çıkarıp ona fırlatıyorsun, kapıyı da ardına kadar açık bırakıyorsun. {npc:kaya_demir} anahtarı havada yakalamıyor; anahtar ayaklarının dibine düşüp uzun süre orada kalıyor.", en: "You pull the key out of the lock, toss it to him, and leave the door wide open. {npc:kaya_demir} doesn't catch it. It drops at his feet and stays there a long time." }
          - { tr: "\"Komutan değilim,\" diyor sonunda. \"Değilsin,\" diyorsun. \"Mühendisimsin. Hat senin, emir benim.\"", en: "\"I'm not a commander,\" he finally says. \"You're not,\" you say. \"You're my engineer. The line's yours. The orders are mine.\"" }
          - { tr: "Ayağa kalkarken sağ dizi bir kez kilitlenip açılıyor. Haddehaneden {yer:kordon|e} doğru topallayarak ama bayrak direği gibi dimdik yürüyor; nöbetçiler selam verip vermemeleri gerektiğini bilemeden kenara çekiliyor.", en: "When he stands, his right knee locks once, then gives. He walks out of the mill toward {yer:kordon}, limping but straight as a flagpole, and the guards step aside, not sure whether they're supposed to salute." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Arkasından bak", en: "Watch him go" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "selam"
            etiket: { tr: "Nöbetçilere selam vermelerini söyle", en: "Tell the guards to salute" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "@akis"
