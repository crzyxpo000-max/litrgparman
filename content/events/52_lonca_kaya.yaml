# Parti B2 — Demir Lonca zinciri + Kaya Demir'in yayı (docs/PERDE2_4.md "Parti B2").
# Zincir (zincir_lonca): lonca_1_kapi_temizligi (P2) → lonca_2_rutbe (P2) → lonca_3_rakip_bastirma (P3) → lonca_4_demir_yasa (P3)
#   → lonca_5_taht (P4, AY 346; lonca_hakimiyeti + gorev zincir_lonca tamam).
# Kaya yayı: kaya_lonca_teklifi (P2) → kaya_sert_ders (P2) → kaya_darbe_gecesi (P3, AY 292; kaya_devrildi / darbe hazırlığı)
#   → kaya_son_savas_generali (P4, AY 337; kaya_general).
# Kaya'nın kaderleri: akıl hocası (kaya_akil_hocasi, lonca_kayaya_birakildi) · devrilen diktatör (kaya_devrildi: darbe gecesinde,
#   generallik sahnesinde ya da tahtta) · son savaşın generali (kaya_general).
# Lonca rütbesi değişkeni: lonca_rutbe (0 Destek · 1 Avcı · 2 Çavuş · 3 Komutan Yardımcısı · 4 Komutan).
# Yan karakterlere isim verilmez; lakap kullanılır: Örs (EN Anvil), Defterdar (EN the Ledger), Liman Reisi (EN the Harbormaster).
olaylar:
  # ================================================================== KAYA — LONCA TEKLİFİ (P2)
  - id: "kaya_lonca_teklifi"
    perde: [2]
    gun: { min: 33, max: 80 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 9
    etiketler: ["lonca", "npc", "karsilasma", "sanayi"]
    gerilim: 2
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Haddehanedeki masa", en: "The table in the rolling mill" }
    sahne: "kaya_lonca_teklifi_1"
    sahneler:
      - id: "kaya_lonca_teklifi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Turuncu yamalı bir koşucu seni buluyor; nerede olduğunu nasıl bildiğini sormana fırsat vermeden \"Başçavuş bekliyor\" diyor ve önüne düşüyor. Yarım saat sonra {yer:sanayi|in} çelik kokulu sokaklarındasın.", en: "A runner with an orange patch on his sleeve finds you. Before you can ask how he knew where you'd be, he says, \"Gunny's waiting,\" and starts walking. Half an hour later you're in the streets of {yer:sanayi}, where everything smells like hot steel." }
          - { tr: "Eski haddehane şimdi bir kale: kapılarına tersaneden sökülmüş sac levhalar kaynatılmış, çatısında projektörler ve kum torbalı nöbet yerleri var. İçeride vinçlerin altında yüzlerce insan çalışıyor ve her birinin kolunda aynı turuncu yama.", en: "The old rolling mill is a fortress now: steel plate cut off the shipyard welded over its doors, searchlights and sandbagged posts up on the roof. Inside, hundreds of people work under the gantry cranes, and every one of them wears the same orange patch." }
          - { tr: "Haddehanenin ortasında, bir geminin ambar kapağından yapılmış bir masa duruyor. Arkasında, gri saçları hâlâ kısacık, sırtı hâlâ bayrak direği gibi dik bir adam bir haritanın üstüne eğilmiş.", en: "In the middle of the mill sits a table made from a ship's hatch cover. Behind it, gray hair still buzzed short, spine still straight as a flagpole, a man is bent over a map." }
          - metin: { tr: "{npc:kaya_demir} başını kaldırıyor ve seni görünce yalnızca bir kez başını sallıyor. \"İkinci adamım,\" diyor. \"Yerin hâlâ boş. Kimseyi oturtmadım.\"", en: "{npc:kaya_demir} looks up, and when he sees you, gives one nod. \"My number two,\" he says. \"Your spot's still open. I never filled it.\"" }
            kosul: { bayrak: "lonca_ikinci_adam" }
          - metin: { tr: "{npc:kaya_demir} başını kaldırıyor ve muhafızlarından ikisi, sen fark etmeyecekmişsin gibi, ellerini silahlarına götürüyor. \"Rahat,\" diyor onlara. \"Son karşılaştığımızda kampımı elimden aldı. Bugün almayacak.\"", en: "{npc:kaya_demir} looks up, and two of his guards drift their hands to their weapons like you won't notice. \"At ease,\" he tells them. \"Last time we met, this one took my camp out from under me. Not happening today.\"" }
            kosul: { bayrak: "lonca_komutasi_alindi" }
          - metin: { tr: "\"Bir kere bandımı geri verdin,\" diyor {npc:kaya_demir}, haritadan gözünü ayırmadan. \"Yine soruyorum. Üçüncü kez sormam.\"", en: "\"You handed my tape back once,\" {npc:kaya_demir} says, without looking up from the map. \"I'm asking again. I don't ask three times.\"" }
            kosul: { hafiza: { kaya_demir: "rutbeyi_reddetti" } }
          - metin: { tr: "Adam doğruluyor ve elini uzatmadan konuşuyor: \"{npc:kaya_demir|tam}. {fraksiyon:lonca}. Adını duydum; herkes duydu. Şimdi pencerene bakacağım, sonra konuşacağız.\"", en: "The man straightens up and talks without offering a hand. \"{npc:kaya_demir|tam}. {fraksiyon:lonca}. I've heard your name. Everybody has. Now I'm going to look at your window, and then we'll talk.\"" }
            kosul: { degisken_max: { kaya_tanidik: 0 } }
          - { tr: "Pencerene tek bir kez bakıyor; tıpkı o rampada yaptığı gibi. Sonra masanın üstüne turuncu bir yama koyuyor, kenarı çelik telle örülmüş. \"Çavuş. İlk günden. Kendi mangan, kapı sözleşmelerinde ilk seçim hakkı.\"", en: "He looks at your window exactly once. Then he sets an orange patch on the table, its edge stitched with steel wire. \"Sergeant. Day one. Your own squad and first pick on every Gate contract.\"" }
          - metin: { tr: "\"Doktorun konseyine yazıldığını duydum,\" diye ekliyor. \"Umurumda değil. Güç bir parti kartı değil; nereye giderse orada iş görür.\"", en: "\"Heard you signed up with the doctor's council,\" he adds. \"Don't care. Strength isn't a party card. It works wherever it goes.\"" }
            kosul: { bayrak: "uye_siginak" }
          - metin: { tr: "\"Fraksiyon gününde bizi seçtin,\" diyor. \"İyi. Şimdi seçtiğin şeyin içinde bir yerin olsun.\"", en: "\"You picked us on faction day,\" he says. \"Good. Now let's give you an actual place inside what you picked.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Penceresindeki rakam yine gerçek. Bu şehirde rakamını hâlâ şişirmeyen tek güçlü adam. Ama sağ dizine her adımda biraz daha az yük veriyor; eski yara ilerliyor.", en: "The number in his window is real again. Still the only strong man in this city who doesn't pad it. But he's putting a little less weight on his right knee with every step. The old wound's getting worse." }
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Masadaki haritada {yer:kasaba_cekirdegi} kırmızıyla daire içine alınmış. Yanında küçük, düzgün bir yazı: 'Sonra.'", en: "On the map, {yer:kasaba_cekirdegi} is circled in red. Next to it, in small neat handwriting: 'Later.'" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷ama büyümüş. tasma da. ama bak, sana çavuşluk veriyor; kendine istediğini değil. bu adam seni neye harcayacağını çoktan hesapladı.", en: "t̷he tape grew up. so did the leash. but look, he's offering you sergeant, not what he wants for himself. this man already worked out what he's going to spend you on." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Burası düzenli. Fazla düzenli. Kollarına bak; herkes aynı yamayı takıyor, kimse gülmüyor.\"", en: "\"It's organized in here. Too organized. Look at their sleeves. Same patch on everybody, and nobody's smiling.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Revirine bak; Konsey'inkinden iyi donanımlı. Bunu yüksek sesle söylediğimi kimseye anlatma.\"", en: "\"Check out his infirmary. Better stocked than the Council's. Don't tell anybody I said that out loud.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Duvardaki o pano bir sıralama. Kendi Küresel Sıralama'sını yapmış. Adamın kafası tam bir veritabanı, söylemiştim.\"", en: "\"That board on the wall is a leaderboard. He built his own Global Ranking. The guy's head is a database, I told you.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Yamayı al ve koluna dik", en: "Take the patch and sew it on" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 2 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 5 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 4, baglilik: 6, guven: 3 } }
              - esya: { turuncu_yama: 1 }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "{npc:kaya_demir|in} turuncu yamasını koluna diktin; Lonca'nın merdiveninin ilk basamağı oydu.", en: "You sewed {npc:kaya_demir|pos} orange patch onto your sleeve. It was the first rung on the Guild's ladder." }
            sonraki: "kaya_lonca_teklifi_pano"
          - id: "sozlesme"
            etiket: { tr: "\"Rütbe değil. Sözleşme. Kapı başına öde.\"", en: "\"Not rank. A contract. Pay me per Gate.\"" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "kaya_teklifi_sozlesme"
              - ahlak: { duzen: -2, insanlik: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 5, guven: -2 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "{npc:kaya_demir|e} rütbe yerine fiyat söyledin; Lonca seni bir asker değil, kiralık bir silah olarak defterine yazdı.", en: "You named {npc:kaya_demir} a price instead of taking a rank. The Guild wrote you into its ledger as a hired gun, not a soldier." }
            sonraki: "kaya_lonca_teklifi_sozlesme"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni sonuna kadar aç; rütbeyi o seçsin", en: "Open your window all the way. Let him pick the rank" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - aciga_vur: true
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 12 }
              - iliski: { kaya_demir: { saygi: 12, korku: 6 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 35, max: 55 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "Haddehanenin ortasında gerçek pencereni açtın; Lonca'nın merdivenini o gün aşağıdan değil, yukarıdan tanıdın.", en: "You opened your real window in the middle of the rolling mill. That day you met the Guild's ladder from the top, not the bottom." }
            sonraki: "kaya_lonca_teklifi_acik"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Seviyeni düşük göster; sıradan avcı ol", en: "Play your level down. Be a regular hunter" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "lonca_hafife_aldi"
              - gizle: 4
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: -3 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "Lonca'ya sıradan bir avcı gibi girdin; çavuşları sana yukarıdan baktı ve bunun bedelini sonra ödediler.", en: "You walked into the Guild as an ordinary hunter. Its sergeants looked down on you, and paid for it later." }
            sonraki: "kaya_lonca_teklifi_gizli"
          - id: "konsey_hatti"
            etiket: { tr: "Konsey'le ortak bir savunma hattı öner", en: "Propose a joint defense line with the Council" }
            goster: { bayrak: ["kaya_elif_koprusu"] }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1, lonca_rutbe: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - bayrak: "lonca_siginak_hatti"
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { lonca: 3, siginak: 5 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 }, elif_sari: { saygi: 4 } }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 5, max: 10 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "{npc:kaya_demir|in} masasında Konsey'le ortak bir hattı savundun; {yer:sanayi} ile {yer:kiyikent_liman} arasındaki sınır o gün biraz inceldi.", en: "At {npc:kaya_demir|pos} table you argued for a joint line with the Council. The border between {yer:sanayi} and {yer:kiyikent_liman} got a little thinner that day." }
            sonraki: "kaya_lonca_teklifi_pano"
          - id: "reddet"
            etiket: { tr: "\"Ben kimsenin askeri değilim.\"", en: "\"I'm nobody's soldier.\"" }
            etkiler:
              - bolge: "sanayi"
              - tanis: "kaya_demir"
              - degisken: { kaya_tanidik: 1 }
              - bayrak: "kaya_teklifi_goruldu"
              - ahlak: { duzen: -4, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 30 }
              - tohum: { olay: "kaya_sert_ders", gecikme: { min: 45, max: 65 }, kosul: { npc_hayatta: "kaya_demir" } }
            kronik: { tr: "{npc:kaya_demir|in} masasındaki yamayı orada bıraktın; o gün seni bir asker olarak değil, hesaba katılacak bir kuvvet olarak not etti.", en: "You left {npc:kaya_demir|pos} patch on the table. That day he stopped thinking of you as a soldier and started thinking of you as a force to plan around." }
            sonraki: "kaya_lonca_teklifi_red"

      - id: "kaya_lonca_teklifi_pano"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} seni haddehanenin doğu duvarına götürüyor. Duvarın tamamını kaplayan, eski bir gemi bordasından kesilmiş çelik bir levha: Pano. Üstünde tebeşirle yazılmış yüzlerce isim, her birinin yanında bir sayı.", en: "{npc:kaya_demir} walks you over to the east wall of the mill. The whole wall is a single steel plate cut from an old ship's side: the Board. Hundreds of names are chalked on it, each one with a number next to it." }
          - { tr: "\"Katkı,\" diyor. \"Kapattığın kapı, indirdiğin canavar, nöbette geçirdiğin saat. Tayın bu sayıya göre dağıtılır, rütbe bu sayıya göre verilir. Kimsenin babası kim diye sorulmaz.\"", en: "\"Contribution,\" he says. \"Gates closed, monsters dropped, hours on watch. Rations go out by this number. Rank goes out by this number. Nobody gets asked who their daddy is.\"" }
          - { tr: "Panonun en altında, ayrı bir sütun: DESTEK. En uzun sütun o. İsimlerin yanında sayı yok, yalnızca küçük birer nokta.", en: "At the very bottom of the Board there's a separate column: SUPPORT. It's the longest one. The names there don't have numbers next to them, just small dots." }
          - metin: { tr: "Sütunların adı değişmiş. Sütunların kendisi değişmemiş. Rampadaki listeyi hatırlıyorsun: ÇEKİRDEK, YÜK, AĞIZ.", en: "The columns got new names. The columns themselves didn't change. You remember the list from the loading dock: CORE, LOAD, MOUTHS." }
            kosul: { bilgi: "kaya_listesi" }
          - metin: { tr: "Destek sütununun başında küçük, el yazısıyla bir not var: 'Çocuklar ve yaşlılar tam tayın.' {npc:kaya_demir} notu gördüğünü görüyor. \"Sözümü tutarım,\" diyor yalnızca.", en: "At the head of the Support column there's a small handwritten note: 'Kids and elderly: full rations.' {npc:kaya_demir} sees you notice it. \"I keep my word,\" is all he says." }
            kosul: { bayrak: "lonca_muafiyet" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Destek sütunundaki bazı noktaların yanında ince bir çarpı işareti var. Tebeşir yeni; bu hafta atılmış.", en: "Some of the dots in the Support column have a thin X next to them. Fresh chalk. Somebody added those this week." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ayılar. sistem de seni sayılarla ölçüyor. bu adam sadece kendi sistemini kurmuş; daha dürüst, daha küçük.", en: "n̷umbers. the system measures you in numbers too. this man just built his own system. more honest. smaller." }
        secenekler:
          - id: "en_uste"
            tur: "gosteris"
            etiket: { tr: "Adını Pano'nun en üstüne yazdır", en: "Have your name chalked at the very top" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - dikkat: 2
              - itibar: { lonca: 6 }
              - xp_seviye: 15
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
            kronik: { tr: "İlk gününde adını Pano'nun en üstüne yazdırdın; Lonca'da kimse bir daha basamak saymayı senin adından başlatmadı.", en: "On your first day you had your name put at the top of the Board. Nobody in the Guild ever started counting rungs anywhere else again." }
            sonraki: "kaya_lonca_teklifi_en_ust"
          - id: "destek"
            etiket: { tr: "Destek sütununu ve çarpıları sor", en: "Ask about the Support column and the X's" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "{npc:kaya_demir|e} Destek sütununu sordun; aldığın cevabı hiç unutmadın.", en: "You asked {npc:kaya_demir} about the Support column. You never forgot the answer." }
            sonraki: "kaya_lonca_teklifi_destek"
          - id: "selam"
            etiket: { tr: "Başını salla ve işe başla", en: "Nod and get to work" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { guven: 3 } }
              - esya: { lonca_tayini: 2 }
            kronik: { tr: "Pano'ya bir kez baktın ve işe koyuldun; Lonca'da bunu soru sormamak diye değil, iş bilmek diye okudular.", en: "You looked at the Board once and got to work. In the Guild they read that as knowing the job, not as not asking questions." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_en_ust"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} bir an sana bakıyor; sonra tebeşiri Pano'nun yanındaki çivi kutusundan alıp sana uzatıyor. \"Kendin yaz,\" diyor. \"Ve yarın biri silerse, kendin yeniden yazacaksın.\"", en: "{npc:kaya_demir} looks at you for a second. Then he takes the chalk out of the nail box by the Board and holds it out. \"Write it yourself,\" he says. \"And if somebody wipes it tomorrow, you write it again yourself.\"" }
          - { tr: "Adını en üste yazıyorsun, Örs diye çağrılan iri bir kaynakçının adının üstüne. Haddehanenin gürültüsü bir anlığına kesiliyor; vinçler bile duruyor gibi.", en: "You write your name at the top, right above the name of a big welder everybody calls Anvil. The noise in the mill cuts out for a second. Even the cranes seem to stop." }
          - { tr: "Pano'nun dibinde, Örs kolunu kavuşturmuş seni izliyor. Yüzünde öfke yok; bir kaynakçının bir dikişin tutup tutmayacağını tartarken taktığı yüz var.", en: "At the foot of the Board, Anvil stands with his arms crossed, watching you. There's no anger on his face. It's the look a welder gets when he's deciding whether a seam's going to hold." }
        secenekler:
          - id: "ors_selam"
            etiket: { tr: "Örs'e başınla selam ver", en: "Give Anvil a nod" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Pano'nun tepesinden Örs'e selam verdin; o selamı Merdiven Günü'ne kadar sakladı.", en: "From the top of the Board you nodded to Anvil. He held onto that nod until Ladder Day." }
            sonraki: "@akis"
          - id: "ors_bak"
            etiket: { tr: "Tebeşiri ona uzat: \"Silmek istersen.\"", en: "Hold the chalk out to him. \"If you want to wipe it.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "Örs'e tebeşiri uzatıp adını silmeye davet ettin; koca kaynakçı uzanmadı ve bunu sana asla affetmedi.", en: "You held the chalk out and dared Anvil to wipe your name. The big welder didn't reach for it, and he never forgave you for that." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_destek"
        yer: "sanayi"
        paragraflar:
          - { tr: "\"Destek, katkısı sıfır olanlar,\" diyor {npc:kaya_demir}. \"Çalışamayanlar, çalışmak istemeyenler, henüz çalışmayı öğrenmemiş olanlar. Hepsi yer, hepsi uyur, hepsi korunur. Yarım tayınla.\"", en: "\"Support is everybody whose contribution is zero,\" {npc:kaya_demir} says. \"Can't work, won't work, hasn't learned how yet. All of them eat, all of them sleep, all of them get protected. On half rations.\"" }
          - { tr: "\"Çarpılar kapı işine gönüllü olanlar. Kapıya giren Destek, o hafta tam tayın alır.\" Bir an duruyor. \"Bazıları dönmüyor. Gönüllü olduklarını da unutma.\"", en: "\"The X's are the ones who volunteered for Gate work. Support who goes through a Gate gets full rations that week.\" He pauses. \"Some of them don't come back. Don't forget they volunteered.\"" }
          - { tr: "\"Bu acımasızlık değil asker, aritmetik. Bir haftalık tam tayın, bir aileyi bir hafta daha ayakta tutar. Ben onlara bir seçenek veriyorum; şehrin geri kalanı vermiyor.\"", en: "\"That's not cruelty, kid. That's arithmetic. A week of full rations keeps a family on its feet another week. I'm giving them a choice. The rest of this city isn't.\"" }
        secenekler:
          - id: "aritmetik"
            etiket: { tr: "\"Aritmetiğin doğru.\"", en: "\"Your math checks out.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, baglilik: 3 } }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "{npc:kaya_demir|in} aritmetiğini doğruladın; Destek sütunundaki çarpılar o gün senin de imzanı taşımaya başladı.", en: "You signed off on {npc:kaya_demir|pos} arithmetic. From that day on, the X's in the Support column carried your name too." }
            sonraki: "@akis"
          - id: "mangama"
            etiket: { tr: "Destek'ten on kişiyi kendi mangana al", en: "Take ten people from Support into your squad" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 3, guven: -1 } }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "Destek sütunundan on kişiyi kendi mangana yazdın; Pano'da onların adının yanına ilk kez bir sayı yazıldı.", en: "You wrote ten people from the Support column into your own squad. For the first time, the Board put a number next to their names." }
            sonraki: "kaya_lonca_teklifi_manga"
          - id: "cocuklar"
            etiket: { tr: "\"Çocukları kapıya gönüllü yazdırmayacaksın.\"", en: "\"No kids volunteer for Gates. Ever.\"" }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 2, siginak: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 3 } }
              - bayrak: "lonca_muafiyet"
            kronik: { tr: "{npc:kaya_demir|e} bir kural daha yazdırdın: Lonca'da hiçbir çocuk bir kapıya gönüllü olarak gönderilmedi.", en: "You got {npc:kaya_demir} to write one more rule: no kid in the Guild was ever sent through a Gate as a 'volunteer.'" }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_manga"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} omuz silkiyor. \"Senin mangan, senin tayının,\" diyor. \"Kapıda onlar ölürse defterime değil, senin defterine yazılır.\"", en: "{npc:kaya_demir} shrugs. \"Your squad, your rations,\" he says. \"They die in a Gate, it goes in your ledger, not mine.\"" }
          - { tr: "On kişi önünde sıraya giriyor: iki yaşlı kadın, kekeme bir lise öğrencisi, eski bir muhasebeci, ellerini nereye koyacağını bilemeyen bir aşçı. Hiçbiri sana teşekkür etmiyor; teşekkür etmeyi unuttukları belli.", en: "Ten people line up in front of you: two old women, a high school kid with a stutter, an ex-accountant, a cook who doesn't know what to do with his hands. None of them thanks you. It's obvious they've forgotten how." }
        secenekler:
          - id: "egit"
            etiket: { tr: "Onlara ilk talimi kendin ver", en: "Run their first drill yourself" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 10
            kronik: { tr: "Destek'ten aldığın on kişiye ilk talimi kendin verdin; ikisi sonradan Lonca'nın en iyi kapı avcıları oldu.", en: "You ran the first drill for the ten you pulled out of Support yourself. Two of them went on to become the best Gate hunters the Guild ever had." }
            sonraki: "@akis"
          - id: "doyur"
            etiket: { tr: "Önce onları kendi tayınından doyur", en: "Feed them out of your own rations first" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - can: -20
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Mangana aldığın Destek'lileri önce kendi tayınınla doyurdun; o akşam haddehanede ilk kez biri güldü.", en: "You fed the people you'd pulled out of Support from your own rations first. That night, somebody in the mill laughed for the first time." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_sozlesme"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir|in} yüzünde bir şey kıpırdıyor; belki hayal kırıklığı, belki saygı. \"Paralı asker,\" diyor. \"İyi paralı askerler tanıdım. Hepsinin bir fiyatı vardı ve hepsi o fiyatı tam olarak biliyordu.\"", en: "Something moves on {npc:kaya_demir|pos} face. Maybe disappointment, maybe respect. \"A contractor,\" he says. \"I've known good contractors. Every one of them had a price, and every one of them knew it to the penny.\"" }
          - { tr: "\"Kapı başına kristal, tayın ve ganimetin üçte biri. Bir şartla: sahadayken emri ben veririm. Sözleşmen biter, emrim biter.\"", en: "\"Crystals per Gate, rations, and a third of the loot. One condition: in the field, I give the orders. Your contract ends, my orders end.\"" }
        secenekler:
          - id: "uc_te_bir"
            etiket: { tr: "\"Üçte bir az. Yarısı.\"", en: "\"A third's light. Half.\"" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { insanlik: -3 }
              - oz_kristali: 20
              - iliski: { kaya_demir: { saygi: 4, guven: -2 } }
            kronik: { tr: "{npc:kaya_demir|le} ganimetin yarısına pazarlık ettin ve kazandın; Lonca'nın muhasebesinde adın hep kırmızı mürekkeple yazıldı.", en: "You haggled {npc:kaya_demir} up to half the loot and won. In the Guild's books, your name was always written in red ink." }
            sonraki: "@akis"
          - id: "emir_yok"
            etiket: { tr: "\"Sahada emir almam.\"", en: "\"I don't take orders in the field.\"" }
            etkiler:
              - ahlak: { duzen: -4 }
              - iliski: { kaya_demir: { saygi: 2, guven: -4 } }
            kronik: { tr: "{npc:kaya_demir|in} tek şartını reddettin; sahada aynı kapının önünde iki komutan durdu.", en: "You turned down {npc:kaya_demir|pos} one condition. In the field, two commanders stood in front of the same Gate." }
            sonraki: "@akis"
          - id: "tamam"
            etiket: { tr: "El sık ve anlaşmayı kabul et", en: "Shake on it" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
              - esya: { lonca_tayini: 2 }
            kronik: { tr: "{npc:kaya_demir|le} el sıkıştın; sözleşme kâğıda hiç dökülmedi ve ikiniz de bir harfini çiğnemediniz.", en: "You shook {npc:kaya_demir|pos} hand. The contract never got written down, and neither of you broke a word of it." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pencereni sonuna kadar açtığında haddehane susuyor. Vinçler duruyor; masanın etrafındaki subaylardan biri farkında olmadan bir adım geri atıyor.", en: "When you open your window all the way, the rolling mill goes silent. The cranes stop. One of the officers around the table steps back without meaning to." }
          - { tr: "{npc:kaya_demir} rakamları okuyor; yüzünde hiçbir şey kıpırdamıyor. Ama sağ eli, tıpkı o rampada olduğu gibi, kendiliğinden yarıya kadar kalkıyor ve orada duruyor.", en: "{npc:kaya_demir} reads the numbers. Nothing on his face moves. But his right hand, just like on the loading dock, comes halfway up on its own and stops there." }
          - { tr: "\"Çavuşluk bir hakaret olur,\" diyor sonunda, elini indirerek. \"Komutan yardımcım ol. Benden sonra bu masanın başında oturacak adı yazdığım kâğıt var; senin adın orada duracak.\"", en: "\"Sergeant would be an insult,\" he finally says, lowering the hand. \"Be my XO. There's a piece of paper with the name of whoever sits at this table after me. Your name goes on it.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "h̷alef. bu kelimeyi ilk kez kendine söylüyor. dikkat et; bir askerin halefi, aynı zamanda onun en büyük tehdididir.", en: "s̷uccessor. first time he's ever said that word to himself. careful. a soldier's successor is also his biggest threat." }
        secenekler:
          - id: "sag_kol"
            etiket: { tr: "Kabul et; sağ kolu ol", en: "Accept. Be his right hand" }
            etkiler:
              - degisken: { lonca_rutbe: 3 }
              - bayrak: "kaya_sag_kol"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 5 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { baglilik: 8, guven: 5 } }
              - esya: { turuncu_yama: 1 }
              - dikkat: 2
            kronik: { tr: "{npc:kaya_demir|in} komutan yardımcısı oldun; Lonca'nın halef kâğıdına adın onun eliyle yazıldı.", en: "You became {npc:kaya_demir|pos} XO. Your name went onto the Guild's succession paper in his own handwriting." }
            sonraki: "@akis"
          - id: "yaninda"
            tur: "gosteris"
            etiket: { tr: "\"Altında değil. Yanında.\"", en: "\"Not under you. Next to you.\"" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - degisken: { lonca_rutbe: 3 }
              - bayrak: "kaya_sag_kol"
              - bayrak: "kaya_teklifi_kabul"
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 8, korku: 6, guven: -4 } }
              - dikkat: 3
            kronik: { tr: "{npc:kaya_demir|in} masasına onun yanında oturdun, altında değil; Lonca o günden sonra iki başlı bir kartal gibi büyüdü.", en: "You sat at {npc:kaya_demir|pos} table beside him, not under him. From that day on the Guild grew like a two-headed eagle." }
            sonraki: "@akis"
          - id: "sadece_kapi"
            etiket: { tr: "\"Rütbe istemem. Bana en zor kapıları ver.\"", en: "\"Keep the rank. Give me the worst Gates.\"" }
            etkiler:
              - degisken: { lonca_rutbe: 2 }
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 3 } }
              - xp_seviye: 10
            kronik: { tr: "{npc:kaya_demir|in} halefliğini geri çevirip en zor kapıları istedin; Lonca'nın en kötü sözleşmeleri o günden sonra önce senin masana geldi.", en: "You passed on being {npc:kaya_demir|pos} successor and asked for the worst Gates instead. From then on the Guild's ugliest contracts hit your desk first." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_gizli"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} pencerene bir kez daha bakıyor; bu sefer gözleri daralmıyor. \"Avcı,\" diyor. \"Kapı mangalarında taşıyıcılardan bir üstte. Kendini kanıtlarsan basamak çıkarsın.\"", en: "{npc:kaya_demir} looks at your window one more time. This time his eyes don't narrow. \"Hunter,\" he says. \"One step above the carriers on the Gate squads. Prove yourself and you climb.\"" }
          - { tr: "Haddehanenin kantininde iki çavuş sana bakıp gülüşüyor; biri, senin duyacağın kadar yüksek sesle, yeni avcıların ilk kapıda neden ağladığını anlatıyor. Sesini çıkarmıyorsun.", en: "In the mill's mess hall, two sergeants look at you and snicker. One of them tells a story, loud enough for you to hear, about why new hunters always cry in their first Gate. You don't say a word." }
          - { tr: "Akşam Pano'nun önünden geçerken adını Destek sütununun hemen üstünde görüyorsun, küçük harflerle. Bir gün bu tebeşirin nasıl silindiğini görmek eğlenceli olacak.", en: "Walking past the Board that evening, you find your name just above the Support column, in small letters. Someday it's going to be fun watching that chalk get wiped." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ırak gülsünler. hafife alınmak bir zırhtır; hem de ağırlığı yok.", en: "l̷et them laugh. being underestimated is armor. and it doesn't weigh a thing." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Bir şey söyleme; tayınını al ve yat", en: "Say nothing. Take your ration and turn in" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 1
              - esya: { lonca_tayini: 1 }
            kronik: { tr: "Lonca'nın kantininde sana gülen çavuşlara tek kelime etmedin; Merdiven Günü geldiğinde ikisi de seninle göz göze gelemedi.", en: "You didn't say one word to the sergeants laughing at you in the Guild's mess. When Ladder Day came, neither of them could look you in the eye." }
            sonraki: "@akis"
          - id: "hikaye"
            etiket: { tr: "Çavuşun hikâyesinin sonunu sen anlat", en: "Finish the sergeant's story for him" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - itibar: { lonca: 2 }
            kronik: { tr: "Kantinde sana gülen çavuşun hikâyesini onun yerine bitirdin; bütün masa güldü ve çavuş o gece başka bir masaya oturdu.", en: "In the mess hall you finished the sergeant's story for him. The whole table laughed, and he ate at a different table that night." }
            sonraki: "@akis"

      - id: "kaya_lonca_teklifi_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} yamayı masadan almıyor. Orada, ambar kapağının paslı perçinlerinin arasında bırakıyor; sanki sen fikrini değiştirene kadar oradan kalkmayacakmış gibi.", en: "{npc:kaya_demir} doesn't pick the patch back up. He leaves it right there between the rusty rivets of the hatch cover, like it's going to wait for you to change your mind." }
          - { tr: "\"Askerim değilsin,\" diyor. \"O zaman hesaba kattığım bir şeysin. Hava durumu gibi. Ya da bir kapı gibi.\" Haritaya dönüyor. \"Çıkışı biliyorsun.\"", en: "\"Not my soldier,\" he says. \"Then you're something I plan around. Like weather. Or a Gate.\" He turns back to the map. \"You know the way out.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan çık", en: "Walk out without looking back" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "{npc:kaya_demir|in} haddehanesinden arkana bakmadan çıktın; Lonca'nın haritasında adın bir hava durumu işaretiyle gösterildi.", en: "You walked out of {npc:kaya_demir|pos} rolling mill without looking back. On the Guild's map, you were marked with a weather symbol." }
            sonraki: "@akis"
          - id: "kapi_isi"
            etiket: { tr: "\"Yine de kapı sözleşmelerine açığım.\"", en: "\"I'm still open to Gate contracts.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - degisken: { lonca_rutbe: 1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 1 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 6, max: 12 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
            kronik: { tr: "{npc:kaya_demir|in} askeri olmayı reddettin ama kapılarını kapatmayı kabul ettin; Lonca seninle hep kapıdan konuştu.", en: "You wouldn't be {npc:kaya_demir|pos} soldier, but you'd close his Gates. The Guild only ever talked to you through Gates." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 1 — KURU HAVUZ KAPISI (P2)
  - id: "lonca_1_kapi_temizligi"
    perde: [2]
    gun: { min: 45, max: 150 }
    kosul: { bayrak: "perde2_basladi", itibar_min: { lonca: -15 }, bayrak_yok: "lonca_dusmani" }
    agirlik: 8
    etiketler: ["lonca", "kapi", "zincir", "sanayi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kuru havuzdaki kapı", en: "The Gate in the dry dock" }
    sahne: "lonca_1_kapi_temizligi_1"
    sahneler:
      - id: "lonca_1_kapi_temizligi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lonca'nın sözleşmesi seni tersanenin en dibine, kuru havuza getiriyor. Havuzun suyu aylar önce boşaltılmış; dibinde yarım kalmış bir yük gemisinin gövdesi kızağın üstünde yan yatmış, kaburgaları göğe bakıyor.", en: "The Guild contract brings you to the very bottom of the shipyard, to the dry dock. The basin was pumped dry months ago. At the bottom, the hull of a half-built freighter lies on its side on the slipway, ribs open to the sky." }
          - { tr: "Gövdenin içinde, kaburgaların arasında bir kapı nabız gibi atıyor. Kenarındaki perçinler kendiliğinden sökülüp yere dökülüyor; her söküldüğünde havuzun dibinden bir tıkırtı yükseliyor.", en: "Inside the hull, between the ribs, a Gate is pulsing like a heartbeat. The rivets around its edge keep popping loose on their own and dropping to the floor, and every time one does, a ticking sound comes up from the bottom of the basin." }
          - { tr: "Havuzun kenarında on iki kişi bekliyor; numaralı turuncu yelekler giymişler, sırtlarında halat ve sandık. Arkalarında silahlı altı avcı. Elinde yazı altlığıyla kısa boylu bir kadın, Lonca'nın Defterdar dediği levazımcı, planı sana okuyor: \"Yük önden iner, tuzakları ve sürüyü üstüne çeker. Avcılar arkadan temizler. Yükün katkısı bu hafta iki katı.\"", en: "Twelve people wait at the edge of the basin in numbered orange vests, rope and crates on their backs. Six armed hunters stand behind them. A short woman with a clipboard, the quartermaster the Guild calls the Ledger, reads you the plan: \"Load goes down first and draws the traps and the swarm. Hunters clean up behind them. Load gets double contribution this week.\"" }
          - metin: { tr: "Avcılardan biri senin görünen seviyene bakıp dirseğiyle yanındakini dürtüyor. \"Bu mu bizim çavuş? Yükün arasına koysak kimse fark etmez.\"", en: "One of the hunters checks your displayed level and elbows the guy next to him. \"This is our sergeant? Stick 'em in with the load, nobody'd notice.\"" }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Rütben yüzünden bu manga senin. Defterdar planı okumayı bitirince sana dönüp bekliyor; avcılar da.", en: "Your rank makes this squad yours. When the Ledger finishes reading the plan, she turns and waits on you. So do the hunters." }
            kosul: { degisken_min: { lonca_rutbe: 2 } }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kapı · Kuru Havuz · Taşmaya 2 gün", en: "[ANALYSIS] Gate · Dry Dock · Break in 2 days" }
            satirlar:
              - { tr: "İçeride: Perçin Kurdu sürüsü, bir kraliçe.", en: "Inside: Rivet Grub swarm, one queen." }
              - { tr: "Not: Kraliçe yalnızca sürü azalınca yüzeye çıkar.", en: "Note: The queen only surfaces once the swarm thins out." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Yük yeleklerinden birinin içindeki çocuk on iki yaşında bile değil. Yeleği iki beden büyük; numarası sırtında değil, karnında duruyor.", en: "The kid inside one of those load vests can't even be twelve. The vest's two sizes too big. The number sits on his belly instead of his back." }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Havuzun dibindeki sacların altında yüzlerce küçük ısı izi var. Önden giren ilk dört kişi yere basar basmaz sürü uyanacak.", en: "There are hundreds of small heat signatures under the plates at the bottom. The first four people to step down there are going to wake the whole swarm." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷em. ona yük diyorlar. eskiden bunun için bir kelime vardı, hatırlıyor musun? biz de unuttuk.", en: "b̷ait. they call it load. there used to be a word for this, remember? we forgot it too." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O çocuğu görüyor musun? Bunu yapmayacağız. Söyle bana yapmayacağımızı.\"", en: "\"You see that kid? We're not doing this. Tell me we're not doing this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kapının sinyali tuhaf; bir kalp atışı gibi değil, bir geri sayım gibi. Hangisi olduğunu birazdan öğreniriz.\"", en: "\"The Gate's signal is weird. Not like a heartbeat, more like a countdown. We're about to find out which.\"" }
        secenekler:
          - id: "ben_onde"
            etiket: { tr: "Yükü geri çek; önden sen in", en: "Pull the load back. You go down first" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { merhamet: 5, duzen: -1 }
              - bayrak: "lonca_yuk_korundu"
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuza taşıyıcılardan önce sen indin; o gün numaralı yeleklerin hiçbiri boş dönmedi.", en: "You went down into the dry dock ahead of the carriers. That day, every numbered vest came back up with somebody in it." }
          - id: "plan"
            etiket: { tr: "Planı uygula; yük önden insin", en: "Run the plan. Load goes first" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 5, merhamet: -6, insanlik: -2 }
              - bayrak: "lonca_yuk_onde"
              - itibar: { lonca: 4 }
              - bilgi: "lonca_katki_defteri"
            kronik: { tr: "Kuru havuza önce numaralı yelekleri gönderdin; Defterdar'ın GERİ DÖNMEYEN sütununa o gün yeni adlar yazıldı.", en: "You sent the numbered vests into the dry dock first. That day, the Ledger added new names to her DIDN'T COME BACK column." }
            sonraki: "lonca_1_yuk_onde"
          - id: "yalniz"
            tur: "gosteris"
            etiket: { tr: "Herkes yukarıda kalsın; on dakika ver", en: "Everybody stays topside. Give me ten minutes" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { merhamet: 3, insanlik: -2 }
              - bayrak: "havuz_yalniz_temizlendi"
              - bayrak: "lonca_yuk_korundu"
              - efsane: "kapiyi_yalniz_kapatti"
              - unvan: "havuz_temizleyen"
              - dikkat: 4
              - xp_seviye: 60
              - esya: { kizak_kabugu: 1 }
            kronik: { tr: "Lonca'nın on sekiz kişiyle kapatmayı planladığı kapıyı on dakikada tek başına kapattın; Pano'da adının yanına bir kronometre çizildi.", en: "You closed alone, in ten minutes, a Gate the Guild had planned to close with eighteen people. Somebody drew a stopwatch next to your name on the Board." }
            sonraki: "lonca_1_yalniz"
          - id: "duzen"
            etiket: { tr: "Mangayı yeniden diz: avcılar önde, yük arkada", en: "Rearrange the squad: hunters up front, load in back" }
            goster: { degisken_min: { lonca_rutbe: 2 } }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 4, merhamet: 3 }
              - bayrak: "lonca_yuk_korundu"
              - itibar: { lonca: 3 }
            kronik: { tr: "Kuru havuzda Lonca'nın planını yeniden yazdın; avcılar önde, taşıyıcılar arkada indi ve bu düzen Lonca'nın kitabına girdi.", en: "In the dry dock you rewrote the Guild's plan: hunters first, carriers behind. That formation went into the Guild's book." }
            sonraki: "lonca_1_duzen"
          - id: "arkada"
            tur: "gizle"
            etiket: { tr: "Sıradan bir avcı gibi arkada kal", en: "Hang back like any other hunter" }
            etkiler:
              - gorev: { zincir_lonca: "basla" }
              - gizle: 3
              - ahlak: { duzen: 2, merhamet: -1 }
            kronik: { tr: "Kuru havuzda gücünü saklayıp arkada kaldın; kimin kimi kurtardığını kimse tam anlayamadı.", en: "In the dry dock you hid what you were and hung back. Nobody could quite figure out who saved who." }
            sonraki: "lonca_1_gizli"

      - id: "lonca_1_yuk_onde"
        yer: "sanayi"
        paragraflar:
          - { tr: "Numaralı yelekler halatlardan havuzun dibine iniyor. İlk dört kişi saclara basar basmaz zemin tıkırdamaya başlıyor; sonra kaynamaya.", en: "The numbered vests climb down the ropes to the bottom of the basin. The second the first four set foot on the plates, the floor starts ticking. Then it starts boiling." }
          - { tr: "Perçin kurtları sacların altından yüzlercesi birden fışkırıyor. Bir sandık devriliyor, bir halat kopuyor; sonra çığlıklar. Defterdar yazı altlığına bir şey işaretliyor ve kalemi bir an bile titremiyor.", en: "Rivet grubs burst out from under the plates by the hundreds. A crate tips over, a rope snaps, and then the screaming starts. The Ledger checks something off on her clipboard, and her pen doesn't shake once." }
          - metin: { tr: "Büyük beden yelekli çocuk havuzun ortasında donup kalmış. Etrafındaki zemin kıpırdıyor.", en: "The kid in the oversized vest is frozen in the middle of the basin. The floor around him is moving." }
            kosul: { stat: { per: 35 } }
        secenekler:
          - id: "atla"
            etiket: { tr: "Havuza atla ve yükü çıkar", en: "Jump in and get the load out" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Yükü önden gönderdin, sonra pişman olup peşinden atladın; çoğunu çıkardın, hepsini değil.", en: "You sent the load in first, then regretted it and jumped in after them. You got most of them out. Not all." }
          - id: "bekle"
            etiket: { tr: "Bekle; sürü dağılınca in", en: "Wait. Go down once the swarm spreads out" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -5 }
              - degisken: { hayatta_kalan: -3 }
              - itibar: { lonca: 3 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzun kenarında sürünün yükü yemesini bekledin; plan işledi ve dördü dönmedi.", en: "You waited at the edge of the dry dock while the swarm fed on the load. The plan worked. Four of them didn't come back." }
          - id: "cocuk"
            tur: "gosteris"
            etiket: { tr: "Havuzu tek sıçrayışta geç; çocuğu kap", en: "Clear the basin in one leap. Grab the kid" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - dikkat: 2
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzun üstünden tek sıçrayışla büyük beden yelekli çocuğu kaptın; Defterdar o gün ilk kez kalemini bıraktı.", en: "You cleared the dry dock in one leap and grabbed the kid in the oversized vest. That was the first time anyone saw the Ledger put her pen down." }

      - id: "lonca_1_duzen"
        yer: "sanayi"
        paragraflar:
          - { tr: "Yük yeleklilerini havuzun kenarına, halatların başına diziyorsun; avcıları önden indiriyorsun. Defterdar kaşlarını kaldırıyor ama planın yeni hâlini yazı altlığına geçiriyor.", en: "You line the load vests up at the edge of the basin, on the ropes, and send the hunters down first. The Ledger raises an eyebrow, but she copies the new plan onto her clipboard." }
          - { tr: "Sürü uyandığında karşısında ilk bulduğu şey zıpkınlar ve kalkanlar oluyor. Yukarıdaki taşıyıcılar halatları çekip yaralı avcıları birer birer yukarı alıyor; tam bir lonca gibi çalışıyorlar.", en: "When the swarm wakes up, the first thing it runs into is harpoons and shields. Topside, the carriers haul on the ropes and pull wounded hunters up one at a time. They work like an actual guild." }
        secenekler:
          - id: "in"
            etiket: { tr: "Avcıların arasına in", en: "Drop down with your hunters" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kendi kurduğun hattın içine indin; Lonca o günden sonra kapılara bu düzenle girdi.", en: "You dropped into the line you'd built yourself. After that, the Guild went into Gates that way." }
          - id: "yukari"
            etiket: { tr: "Yukarıdan komuta et; halatları sen yönet", en: "Command from the top. Run the ropes yourself" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -1 }
              - itibar: { lonca: 2 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzda ilk kez bir mangayı yukarıdan, bir komutan gibi yönettin; sonra yine de aşağı inmek zorunda kaldın.", en: "In the dry dock you ran a squad from above for the first time, like a commander. Then you had to go down there anyway." }

      - id: "lonca_1_gizli"
        yer: "sanayi"
        paragraflar:
          - { tr: "Avcıların en arkasında, sıradan bir silahla, sıradan bir avcı gibi duruyorsun. Yük önden iniyor; sürü uyanıyor ve plan, kâğıtta göründüğü kadar düzgün işlemiyor.", en: "You stand at the very back of the hunters with an ordinary weapon, like any ordinary hunter. The load goes down first, the swarm wakes up, and the plan doesn't run anywhere near as clean as it looked on paper." }
          - { tr: "Sana gülen avcı öne atılıyor ve iki kurt aynı anda bacağına gömülüyor. Kimse bakmıyorken uzanıp yakasından tutuyor ve onu bir halat gibi geri çekiyorsun.", en: "The hunter who laughed at you charges forward, and two grubs bore into his leg at the same time. While nobody's looking, you reach out, grab his collar, and yank him back like a rope." }
        secenekler:
          - id: "sessiz"
            etiket: { tr: "Kimse görmeden sürünün içine dal", en: "Slip into the swarm where nobody can see" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - gizle: 2
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit", "karanlik"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzda sürünün içine kimse görmeden daldın; sana gülen avcı hayatını kime borçlu olduğunu hiç öğrenemedi.", en: "In the dry dock you slipped into the swarm without anybody seeing. The hunter who'd laughed at you never found out who he owed his life to." }
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Artık saklama; öne çık", en: "Quit hiding. Step up" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - aciga_vur: true
              - itibar: { lonca: 4 }
              - savas: { dusmanlar: ["percin_kurdu@dunya", "percin_kurdu@dunya", "percin_kurdu@dunya"], ortam: ["dar_gecit"], kazan: "lonca_1_kralice", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kuru havuzun ortasında saklanmayı bıraktın; sana gülen avcılar gerçek pencereni sürünün ışığında okudu.", en: "Halfway down the dry dock you quit hiding. The hunters who'd laughed at you read your real window by the light of the swarm." }

      - id: "lonca_1_kralice"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kurtlar havuzun dibinde kıvrılıp kalıyor; tek bir yarığın içinde bile kıpırtı kalmıyor. Yukarıdan bakan avcılar hiçbir şey söylemiyor; sayıyı tutamadıkları belli.", en: "The grubs curl up dead on the basin floor. Not a twitch left in any of the cracks. The hunters watching from above don't say anything. They clearly lost count." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son kurt da sacın üstünde kıvrılıp kalıyor. Kolunda iki matkap izi var, nefesin pas kokuyor ama ayaktasın.", en: "The last grub curls up dead on the plate. You've got two drill wounds in your arm and your breath tastes like rust, but you're on your feet." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Sonra gemi gövdesi inliyor. Kızağın üstündeki yarım gemi yavaşça yana yatıyor ve kaburgalarının arasında iki kırmızı göz açılıyor.", en: "Then the hull groans. The half-built ship on the slipway slowly rolls onto its side, and two red eyes open between its ribs." }
          - { tr: "Kızak Kraliçesi geminin ta kendisi; geminin içini yiyerek büyümüş ve sacını kabuk diye giymiş. Kapı onun arkasında, karnının ışığında atıyor.", en: "The Slipway Queen is the ship. It grew by eating the ship from the inside out, and now it wears the steel as a shell. The Gate pulses behind it, in the light from its belly." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[ANALİZ] Kızak Kraliçesi · Kapı Bekçisi", en: "[ANALYSIS] Slipway Queen · Gate Boss" }
            satirlar:
              - { tr: "Zayıf nokta: iletken kabuk.", en: "Weak point: conductive shell." }
              - { tr: "Lonca tahmini kayıp: 3–5 avcı. Senin için tahmin: hesaplanamadı.", en: "Guild casualty estimate: 3–5 hunters. Estimate for you: could not be calculated." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kraliçenin üstüne yürü", en: "Go straight at the queen" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kızak Kraliçesi'nin üstüne tek başına yürüdün; Lonca'nın avcıları o kavgayı yıllarca anlattı.", en: "You walked straight at the Slipway Queen alone. The Guild's hunters told that fight for years." }
          - id: "vinc"
            etiket: { tr: "Vinci indirt; kabuğu yere çivile", en: "Bring the crane down. Pin its shell" }
            gerekli: { stat: { int: 35 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - itibar: { lonca: 2 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Tersanenin eski vincini indirip Kızak Kraliçesi'ni kendi gemisine çiviledin; Lonca o vinci o günden sonra 'Çavuş' diye çağırdı.", en: "You brought the shipyard's old crane down and pinned the Slipway Queen to its own ship. After that, the Guild called that crane 'Sarge.'" }
          - id: "avcilar"
            etiket: { tr: "Avcıları çağır; birlikte kuşatın", en: "Call the hunters down. Surround it together" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { hayatta_kalan: -1 }
              - itibar: { lonca: 3 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi", kac: "lonca_1_kacis" }
            kronik: { tr: "Kızak Kraliçesi'ne Lonca'nın avcılarıyla birlikte girdin; biri dönmedi, ama Lonca o kavgayı bir manganın kavgası olarak hatırladı.", en: "You took the Slipway Queen on with the Guild's hunters. One of them didn't come back, but the Guild remembered it as a squad's fight." }

      - id: "lonca_1_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kraliçe havuzun dibine çöküyor ve kapı, bir mumun sönmesi gibi sessizce kapanıyor. Yukarıdan bakan on sekiz kişi bir şey söylemiyor; söyleyecek bir şey bulamıyorlar.", en: "The queen collapses at the bottom of the basin and the Gate goes out quietly, like a candle. The eighteen people watching from above don't say anything. They can't think of anything to say." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Kraliçe son bir kez kıvranıp havuzun dibine yığılıyor; kapı titreyerek kapanıyor. Dizlerin bir an çözülüyor ama düşmüyorsun.", en: "The queen thrashes one last time and slumps to the bottom of the basin, and the Gate shudders closed. Your knees give for a second, but you don't go down." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Havuzun kenarında dört numaralı yelek boş duruyor. Defterdar onları sayıyor, sonra bir sütuna bir şey yazıyor.", en: "At the edge of the basin, four numbered vests lie empty. The Ledger counts them, then writes something in a column." }
            kosul: { bayrak: "lonca_yuk_onde" }
          - metin: { tr: "On iki numaralı yelek de havuzun kenarında, içlerinde insanlarla duruyor. Büyük beden yelekli çocuk ağlamıyor; sana bakıyor.", en: "All twelve numbered vests are standing at the edge of the basin with people in them. The kid in the oversized vest isn't crying. He's looking at you." }
            kosul: { bayrak: "lonca_yuk_korundu" }
          - { tr: "Defterdar ganimeti sayıyor: kraliçenin kabuğu, çekirdeği, havuzun dibindeki canlı bakır. \"Kural belli,\" diyor. \"Yüzde yetmiş Lonca, otuz manga. Yük tayın alır; ganimet almaz.\"", en: "The Ledger tallies the loot: the queen's shell, its core, the live copper at the bottom of the dock. \"The rule's clear,\" she says. \"Seventy percent Guild, thirty squad. Load gets rations, not loot.\"" }
          - metin: { tr: "Haddehaneden bir telsiz cızırdıyor; {npc:kaya_demir|in} sesi: \"Kapı kapandı mı?\" Defterdar doğruluyor. Kısa bir sessizlikten sonra ses yeniden geliyor: \"Panoya yaz. Çavuşa da söyle; ganimeti nasıl böleceğini izliyorum.\"", en: "A radio crackles from the rolling mill. It's {npc:kaya_demir|pos} voice: \"Gate closed?\" The Ledger confirms. After a short silence, the voice comes back: \"Put it on the Board. And tell the sergeant I'm watching how the loot gets split.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "yuke_pay"
            etiket: { tr: "Kendi payını taşıyıcılara dağıt", en: "Hand your cut out to the carriers" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: -2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - xp_seviye: 30
              - esya: { kizak_kabugu: 1 }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzun ganimetinden payını numaralı yeleklere dağıttın; o hafta Destek sütunundaki çarpıların yanına ilk kez kristal yazıldı.", en: "You split your cut of the dry dock loot among the numbered vests. That week, for the first time, the X's in the Support column had crystals written next to them." }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kuralı uygula; yetmişe otuz", en: "Go by the rule. Seventy-thirty" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 5 }
              - oz_kristali: 15
              - esya: { kizak_kabugu: 1 }
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzun ganimetini Lonca'nın kuralına göre böldün; Defterdar senin adını güvenilir sütununa yazdı.", en: "You split the dry dock loot by the Guild's rule. The Ledger wrote your name in her 'reliable' column." }
            sonraki: "@akis"
          - id: "hepsi"
            etiket: { tr: "\"Kapıyı ben kapattım. Hepsi benim.\"", en: "\"I closed the Gate. It's all mine.\"" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -4, duzen: -2 }
              - itibar: { lonca: 4 }
              - oz_kristali: 40
              - esya: { kizak_kabugu: 1, canli_bakir: 3 }
              - iliski: { kaya_demir: { saygi: 5, korku: 4, guven: -3 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzun bütün ganimetine el koydun; Lonca bunu açgözlülük diye değil, güçlünün hakkı diye anlattı.", en: "You took the whole dry dock haul. The Guild didn't tell it as greed. They told it as the strong taking what's theirs." }
            sonraki: "@akis"
          - id: "kurali_degistir"
            etiket: { tr: "Katkı kuralını değiştir: yük de pay alsın", en: "Change the rule: the load gets a cut too" }
            goster: { degisken_min: { lonca_rutbe: 2 } }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 4 }
              - bayrak: "lonca_yuk_payi"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 3, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - xp_seviye: 30
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Lonca'nın katkı kuralına bir satır ekledin: kapıya giren taşıyıcı da ganimetten pay aldı; Destek sütunu o kış ilk kez kısaldı.", en: "You added a line to the Guild's contribution rule: carriers who go through a Gate get a share of the loot. That winter, the Support column got shorter for the first time." }
            sonraki: "@akis"

      - id: "lonca_1_yalniz"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halatı kullanmıyorsun; havuzun kenarından düpedüz aşağı atlıyorsun. Yukarıdakiler önce sacların tıkırdamasını, sonra çok kısa bir süre boyunca bir şeylerin kırılmasını duyuyor.", en: "You don't bother with the rope. You just jump off the edge of the basin. The people up top hear the plates start ticking, and then, very briefly, the sound of things breaking." }
          - { tr: "Sonra gemi gövdesi inliyor, yana yatıyor ve kaburgaların arasında iki kırmızı göz açılıyor. Bir saniye sonra o gözler kapanıyor ve gemi bir daha kıpırdamıyor.", en: "Then the hull groans and rolls, and two red eyes open between the ribs. One second later they close, and the ship never moves again." }
          - { tr: "Defterdar saatine bakıyor: dokuz dakika kırk saniye. Yazı altlığındaki planı yavaşça ikiye katlıyor ve cebine koyuyor.", en: "The Ledger checks her watch: nine minutes, forty seconds. She slowly folds the plan on her clipboard in half and puts it in her pocket." }
          - metin: { tr: "Sana gülen avcı havuzun kenarında ağzı açık duruyor. Bir şey söylemeye çalışıyor; sesi çıkmıyor.", en: "The hunter who laughed at you is standing at the edge of the basin with his mouth open. He's trying to say something. Nothing's coming out." }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Telsiz cızırdıyor. {npc:kaya_demir} uzun süre bir şey söylemiyor; sonra yalnızca \"Panoya yaz,\" diyor. Sesinde hayranlık mı var, endişe mi, sen de karar veremiyorsun.", en: "The radio crackles. {npc:kaya_demir} doesn't say anything for a long time. Then just: \"Put it on the Board.\" Admiration or worry in his voice, you can't decide which." }
            kosul: { npc_hayatta: "kaya_demir" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı kapatıldı: Kuru Havuz]", en: "[Gate closed: Dry Dock]" }
            satirlar:
              - { tr: "Süre: 9 dk 40 sn. Bölge rekoru.", en: "Time: 9 min 40 sec. Regional record." }
              - { tr: "Not: Lonca planında öngörülen süre 3 saatti.", en: "Note: The Guild's plan estimated 3 hours." }
        secenekler:
          - id: "yuke"
            etiket: { tr: "Ganimeti taşıyıcılara bırak", en: "Leave the loot to the carriers" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Tek başına kapattığın kapının ganimetini numaralı yeleklere bıraktın; Lonca'da adın ilk kez bir yardım listesinde geçti.", en: "You left the loot from the Gate you'd closed alone to the numbered vests. It was the first time your name showed up on a Guild charity list." }
            sonraki: "@akis"
          - id: "pano"
            etiket: { tr: "Kraliçenin başını omzuna al; haddehaneye yürü", en: "Shoulder the queen's head. Walk it to the mill" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 8, korku: 3 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kızak Kraliçesi'nin başını omzunda {yer:sanayi|in} ortasından geçirdin; o yürüyüşü gören kimse Lonca'nın merdiveninin tepesinde senden başkasını düşünemedi.", en: "You carried the Slipway Queen's head on your shoulder straight through the middle of {yer:sanayi}. Nobody who saw that walk could picture anyone else at the top of the Guild's ladder." }
            sonraki: "@akis"

      - id: "lonca_1_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kraliçenin omurgası üstüne iniyor ve dünya pas rengine kesiyor. Gözünü açtığında haddehanenin revirindesin; kolunda bir serum, başucunda Defterdar.", en: "The queen's keel comes down on you and the world goes rust-colored. When you open your eyes you're in the rolling mill's infirmary, an IV in your arm and the Ledger at your bedside." }
          - { tr: "\"Ağır manga indi,\" diyor. \"Kapıyı kapattılar. Üç avcı kaybettik; senin yüzünden değil, senin sayende yalnızca üç. Planda beşti.\"", en: "\"The heavy squad went in,\" she says. \"They closed it. We lost three hunters. Not because of you. Thanks to you, only three. The plan said five.\"" }
          - metin: { tr: "Kapıda {npc:kaya_demir} duruyor. \"Bugün değil,\" diyor, tıpkı o çatıdan düştüğün gün gibi. \"Bugün değil, hiçbir zaman demek değil.\"", en: "{npc:kaya_demir} is standing in the doorway. \"Not today,\" he says, just like the day you fell off that roof. \"Not today doesn't mean never.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Serumu çek ve kalk", en: "Pull the IV and get up" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - stat: { wil: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "lonca_1_tamam"
              - itibar: { lonca: 2 }
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzda kraliçeye yenildin ve ertesi sabah serumu söküp nöbete çıktın; Lonca bunu yenilgiden daha iyi hatırladı.", en: "The queen in the dry dock put you down, and the next morning you pulled your IV and reported for watch. The Guild remembered that better than the loss." }
            sonraki: "@akis"
          - id: "isimler"
            etiket: { tr: "Ölen üç avcının adını sor", en: "Ask for the names of the three hunters" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { kaya_demir: { guven: 4 } }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzda ölen üç avcının adını sordun ve ezberledin; Lonca'da ölülerin adını soran ilk subay sendin.", en: "You asked for the names of the three hunters who died in the dry dock and learned them by heart. You were the first officer in the Guild to ask the names of the dead." }
            sonraki: "@akis"

      - id: "lonca_1_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halata tutunup havuzdan dışarı tırmanıyorsun; arkanda saclar kaynıyor. Kenara vardığında Defterdar yazı altlığına bir şey yazıyor, sonra telsizi ağzına götürüyor: \"Ağır mangayı gönderin.\"", en: "You grab the rope and climb out of the basin with the plates boiling behind you. When you make the edge, the Ledger writes something on her clipboard, then lifts the radio: \"Send the heavy squad.\"" }
          - { tr: "Ağır manga yirmi dakika sonra geliyor. Havuzdan taşan kurtlardan biri tersanenin trafosunu kemirmiş; {yer:sanayi|in} yarısı bu gece karanlıkta kalacak.", en: "The heavy squad shows up twenty minutes later. One of the grubs that spilled out of the basin has chewed through the shipyard's transformer. Half {yer:sanayi} is going to be dark tonight." }
        secenekler:
          - id: "geri_in"
            etiket: { tr: "Ağır mangayla birlikte geri in", en: "Go back down with the heavy squad" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - savas: { dusmanlar: ["kizak_kralicesi@oyuncu"], ortam: ["dar_gecit"], kazan: "lonca_1_zafer", kaybet: "lonca_1_yenilgi" }
            kronik: { tr: "Kuru havuzdan bir kez çekildin ve ağır mangayla geri indin; Lonca geri dönmeyi kaçmaktan daha uzun hatırladı.", en: "You pulled out of the dry dock once, then went back down with the heavy squad. The Guild remembered the coming back longer than the running." }
          - id: "trafo"
            etiket: { tr: "Kapıyı onlara bırak; trafoyu onar", en: "Leave the Gate to them. Fix the transformer" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { lonca: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "lonca_1_tamam"
              - tohum: { olay: "lonca_2_rutbe", gecikme: { min: 25, max: 40 }, kosul: { bayrak: "lonca_1_tamam", gun_max: 180 } }
            kronik: { tr: "Kuru havuzun kapısını ağır mangaya bırakıp {yer:sanayi|in} trafosunu onardın; o gece Lojmanlar'ın ışığı senin sayende yandı.", en: "You left the dry dock Gate to the heavy squad and fixed {yer:sanayi} transformer instead. That night, the lights in the company houses were on because of you." }
            sonraki: "@akis"

  # ================================================================== KAYA — SERT DERS (P2)
  - id: "kaya_sert_ders"
    perde: [2]
    gun: { min: 95, max: 175 }
    kosul: { bayrak: "kaya_teklifi_goruldu" }
    agirlik: 7
    etiketler: ["lonca", "npc", "ahlak", "tasma"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Lojmanlar gecesi", en: "The night of the company houses" }
    sahne: "kaya_sert_ders_1"
    sahneler:
      - id: "kaya_sert_ders_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısını geçiyor ki {yer:sanayi|in} bütün sirenleri birden ötüyor. Nerede olursan ol, turuncu yamalı bir koşucu seni yine buluyor; bu sefer soluk soluğa: \"Cüruf tepesindeki kapı taştı. Başçavuş seni haddehanede istiyor. Hemen.\"", en: "It's just past midnight when every siren in {yer:sanayi} goes off at once. Wherever you are, an orange-patched runner finds you again, out of breath this time: \"The Gate on the slag heap broke. Gunny wants you at the mill. Now.\"" }
          - { tr: "{npc:kaya_demir} ambar kapağı masasının başında, tek bir lambanın altında. Haritada iki kırmızı nokta var: kuzeyde Döküm Atölyesi, Lonca'nın bütün silahlarını döktüğü ve şehrin yarısının kapı zırhını onardığı yer. Güneyde Lojmanlar: çelik fabrikasının eski işçi evleri, iki yüz kişi, çoğu Destek sütunundan.", en: "{npc:kaya_demir} is at the hatch-cover table under a single lamp. There are two red dots on the map. North: the Foundry, where the Guild casts every weapon it has and patches the Gate armor for half the city. South: the company houses, the steel plant's old worker row homes. Two hundred people, most of them from the Support column." }
          - { tr: "\"Sürü ikiye ayrıldı,\" diyor, sana bakmadan. \"İki hattı birden tutacak adamım yok. Döküm düşerse şehir bir ay silahsız kalır; bir ay silahsız kalan şehir kışı görmez. Lojmanlar iki yüz kişi. Döküm yirmi bin.\"", en: "\"The swarm split in two,\" he says, without looking at you. \"I don't have the bodies to hold both lines. Foundry falls, the city goes a month without weapons, and a city that goes a month without weapons doesn't see winter. The houses are two hundred people. The Foundry's twenty thousand.\"" }
          - { tr: "Sonra başını kaldırıyor. \"Döküm'ü tutacaksın. Bu bir emir. Ve bu gece komutanlık nedir, onu öğreneceksin: kimin öleceğini seçmek.\"", en: "Then he looks up. \"You're holding the Foundry. That's an order. And tonight you're going to learn what command actually is: choosing who dies.\"" }
          - metin: { tr: "\"{yer:kordon|i} Konsey üç saat oy verirken kaybettik,\" diye ekliyor. \"Ben oy vermem.\"", en: "\"We lost {yer:kordon} while the Council spent three hours voting,\" he adds. \"I don't vote.\"" }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "\"{yer:kordon|i} tuttun. Aferin,\" diye ekliyor. \"Bu gece farklı. Bu gece herkesi kurtarmak diye bir seçenek yok.\"", en: "\"You held {yer:kordon}. Good work,\" he adds. \"Tonight's different. Tonight there's no option where everybody makes it.\"" }
            kosul: { bayrak: "kordon_kurtarildi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[KAPI TAŞMASI] {yer:sanayi} · Cüruf Tepesi", en: "[GATE BREAK] Ironworks · Slag Heap" }
            satirlar:
              - { tr: "Sürü ikiye bölündü. Kuzey kolu: Döküm Atölyesi. Güney kolu: Lojmanlar.", en: "Swarm has split. North column: the Foundry. South column: the company houses." }
              - { tr: "Tahmini temas: 14 dakika.", en: "Estimated contact: 14 minutes." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Kuzey kolu güney kolundan daha yavaş. Bacakların iki hattı birden koşabilir; bir insanın bacakları koşamaz. Senin bacakların artık ne kadar insan, emin değilsin.", en: "The north column is slower than the south one. Your legs could run both lines. Human legs couldn't. You're not sure how human your legs are anymore." }
          - kosul: { stat: { int: 45 } }
            metin: { tr: "Döküm'ün döküm çukurları yüz kişi alır. Lojmanlar'dan Döküm'e on iki dakika yol var. Sürü on dört dakikada gelir.", en: "The Foundry's casting pits could hold a hundred people. It's twelve minutes from the houses to the Foundry. The swarm hits in fourteen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷imin öleceğini seçmek. Sistem de bunu yapıyor, biliyorsun. her gün. o en azından yüzüne söylüyor.", en: "c̷hoosing who dies. the System does that too, you know. every day. at least he says it to your face." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İki yüz kişi. Bunu bir sayı gibi söyledi. Bana bunun bir sayı olmadığını söyle.\"", en: "\"Two hundred people. He said it like a number. Tell me it's not just a number.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Lojmanlar'da üç hamile kadın var, hepsini ben muayene ettim. Seçeceksen bunu bilerek seç.\"", en: "\"There are three pregnant women in those houses. I've examined every one of them. If you're going to choose, choose knowing that.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Hesap doğru, işin kötüsü bu. Hesap hep doğru çıkıyor.\"", en: "\"The math's right. That's the worst part. The math's always right.\"" }
        secenekler:
          - id: "emir"
            etiket: { tr: "Emre uy; Döküm'ü tut", en: "Follow the order. Hold the Foundry" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -6, insanlik: -2 }
              - bayrak: "sert_ders_emre_uyuldu"
              - iliski: { kaya_demir: { saygi: 6, guven: 6, baglilik: 4 } }
            kronik: { tr: "Lojmanlar gecesinde {npc:kaya_demir|in} emrine uyup Döküm'ü tuttun; şehir silahsız kalmadı, Lojmanlar ise sabahı görmedi.", en: "On the night of the company houses you followed {npc:kaya_demir|pos} order and held the Foundry. The city kept its weapons. The houses didn't see morning." }
            sonraki: "kaya_sert_ders_dokum"
          - id: "cigne"
            etiket: { tr: "Emri çiğne; Lojmanlar'a koş", en: "Break the order. Run for the houses" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -5 }
              - bayrak: "sert_ders_emir_cignendi"
              - iliski: { kaya_demir: { saygi: 2, guven: -4 } }
            kronik: { tr: "Lojmanlar gecesinde {npc:kaya_demir|in} emrini çiğneyip iki yüz kişinin yanına koştun; Döküm'ü onun kendi elleriyle tutmasına bıraktın.", en: "On the night of the company houses you broke {npc:kaya_demir|pos} order and ran to the two hundred. You left him to hold the Foundry with his own hands." }
            sonraki: "kaya_sert_ders_lojman"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "\"İkisini birden tutacağım.\"", en: "\"I'll hold them both.\"" }
            gerekli: { stat: { agi: 60 } }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2, merhamet: 3 }
              - bayrak: "kaya_doktrin_kirildi"
              - bayrak: "lojmanlar_kurtarildi"
              - efsane: "tek_basina_suru"
              - dikkat: 5
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 4 }
              - iliski: { kaya_demir: { saygi: 10, korku: 6, guven: -3 } }
            kronik: { tr: "Lojmanlar gecesinde iki hattı birden tuttun; {npc:kaya_demir|in} 'herkesi kurtaramazsın' doktrini o gece senin bacaklarının altında kırıldı.", en: "On the night of the company houses you held both lines at once. {npc:kaya_demir|pos} whole 'you can't save everyone' doctrine broke under your feet that night." }
            sonraki: "kaya_sert_ders_ikisi"
          - id: "plan"
            etiket: { tr: "Lojmanları Döküm'ün çukurlarına taşımayı öner", en: "Propose moving the houses into the Foundry pits" }
            gerekli: { stat: { int: 40 } }
            zar: { stat: "cha", zorluk: 40, tek: true, basarisiz: "kaya_sert_ders_plan_red", basarisiz_etkiler: [{ iliski: { kaya_demir: { saygi: -2 } } }, { ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 4 }
              - iliski: { kaya_demir: { saygi: 8, guven: 4 } }
            kronik: { tr: "Lojmanlar gecesinde {npc:kaya_demir|e} üçüncü bir yol gösterdin: iki yüz kişiyi Döküm'ün çukurlarına indirip tek bir hat tuttunuz.", en: "On the night of the company houses you showed {npc:kaya_demir} a third way: you moved the two hundred into the Foundry's casting pits and held a single line." }
            sonraki: "kaya_sert_ders_plan"

      - id: "kaya_sert_ders_dokum"
        yer: "sanayi"
        paragraflar:
          - { tr: "Döküm Atölyesi'nin kapısında, ergimiş metalin turuncu ışığında duruyorsun. Arkanda Lonca'nın döküm ustaları kalıpları yere yatırıp kepenkleri indiriyor.", en: "You stand at the Foundry doors in the orange light of molten metal. Behind you, the Guild's casters lay their molds flat and drop the shutters." }
          - { tr: "Güneyden, Lojmanlar'ın tarafından, ilk çığlıklar geliyor. Rüzgâr onları buraya taşıyor; sanki biri sana duyduğundan emin olmak istemiş.", en: "From the south, from the houses, the first screams carry. The wind brings them all the way here, like somebody wanted to make sure you heard." }
          - { tr: "Sonra kuzey kolu geliyor: hurdadan gövdeler, çelik çeneler, Cüruf Tepesi'nin pasından doğmuş şeyler.", en: "Then the north column hits: bodies made of scrap, steel jaws, things born out of the rust on the slag heap." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Kapıyı tut", en: "Hold the door" }
            etkiler:
              - ahlak: { duzen: 3 }
              - savas: { dusmanlar: ["hurdacik@dunya+10", "hurdacik@dunya+10", "kepenk_cenesi@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_dokum_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Döküm'ün kapısını tuttun ve güneyden gelen çığlıkları sırtında taşıdın.", en: "You held the Foundry door and carried the screams from the south on your back." }
          - id: "kulak_tika"
            etiket: { tr: "Çığlıkları duymamak için kendini savaşa ver", en: "Throw yourself into the fight so you can't hear them" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - savas: { dusmanlar: ["hurdacik@dunya+10", "hurdacik@dunya+10", "kepenk_cenesi@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_dokum_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Döküm'ün kapısında güneyden gelen çığlıkları bastırmak için kendini savaşa verdin; o geceden sonra savaşın sesi sana hep biraz sessizlik gibi geldi.", en: "At the Foundry door you threw yourself into the fight to drown out the screams from the south. After that night, the noise of a fight always felt a little like silence." }

      - id: "kaya_sert_ders_dokum_sonu"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kuzey kolu Döküm'ün kapısına bile ulaşamıyor. Hurdadan gövdeler, çelik çeneler, hepsi senin önünde dağılıyor; döküm ustaları kepenklerin aralığından izliyor.", en: "The north column doesn't even make it to the Foundry door. Scrap bodies, steel jaws, all of it comes apart in front of you while the casters watch through the gaps in the shutters." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Kuzey kolu kapının önünde, ergimiş metalin ışığında parçalanıyor. Kolundan kan akıyor ama Döküm ayakta.", en: "The north column breaks apart in front of the doors, in the light of the molten metal. Your arm's bleeding, but the Foundry's standing." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Güneyden artık ses gelmiyor. Lojmanlar'ın üstünde, şafağa doğru, tek bir siyah duman sütunu yükseliyor.", en: "No more sound from the south. Above the company houses, rising toward the dawn, there's a single column of black smoke." }
        secenekler:
          - id: "lojmanlara"
            etiket: { tr: "Lojmanlar'a yürü; ne kaldığını gör", en: "Walk to the houses. See what's left" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -4 }
            kronik: { tr: "Döküm'ü tuttuktan sonra Lojmanlar'ın küllerinin arasında yürüdün; o sabah ne gördüğünü kimseye anlatmadın.", en: "After you held the Foundry, you walked through the ashes of the company houses. You never told anyone what you saw there that morning." }
            sonraki: "kaya_sert_ders_safak"
          - id: "kayaya"
            etiket: { tr: "Doğruca haddehaneye, {npc:kaya_demir|e} git", en: "Go straight to the mill, to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -1 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -4 }
            kronik: { tr: "Döküm'ü tuttuktan sonra Lojmanlar'a bakmadan doğruca haddehaneye yürüdün; raporunu bir asker gibi verdin.", en: "After you held the Foundry, you walked straight to the mill without looking at the houses and reported in like a soldier." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_lojman"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lojmanlar'ın dar sokaklarına vardığında sürünün güney kolu çoktan ilk sıra evlere girmiş. Çatıların üstünde insanlar, ellerinde süpürgeler ve tava sapları.", en: "When you reach the narrow streets of the company houses, the swarm's south column is already into the first row. People are up on the roofs holding brooms and frying pans." }
          - { tr: "Arkanda, kuzeyde, Döküm'ün sirenleri hâlâ ötüyor. {npc:kaya_demir} oraya kendi adamlarıyla, sensiz gitti.", en: "Behind you, to the north, the Foundry sirens are still going. {npc:kaya_demir} went there with his own people. Without you." }
          - { tr: "Bir çatının kenarında, kucağında bebek olan bir kadın sana bağırıyor; ne dediğini duymuyorsun, duymana da gerek yok.", en: "At the edge of a roof, a woman with a baby in her arms is yelling at you. You can't hear what she's saying. You don't need to." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Sürünün ortasına dal", en: "Dive into the middle of the swarm" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["kepenk_cenesi@oyuncu+2", "hurdacik@dunya+10", "hurdacik@dunya+10"], ortam: ["dar_gecit", "karanlik"], kazan: "kaya_sert_ders_lojman_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Lojmanlar'ın dar sokaklarında sürünün ortasına daldın; o gece çatılardaki insanlar seni bir isimle değil, bir ışıkla hatırladı.", en: "In the narrow streets of the company houses you dove into the middle of the swarm. The people on those roofs didn't remember you by a name that night. They remembered a light." }
          - id: "tahliye"
            etiket: { tr: "Önce çatılardakileri Döküm'e doğru tahliye et", en: "Get the roof people moving toward the Foundry first" }
            gerekli: { stat: { cha: 45 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["kepenk_cenesi@oyuncu+1", "hurdacik@dunya+10"], ortam: ["dar_gecit"], kazan: "kaya_sert_ders_lojman_sonu", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Lojmanlar'da önce iki yüz kişiyi yola çıkardın, sonra arkalarında durdun; bir tek ev bile boş kalmadan boşaldı.", en: "In the company houses you got the two hundred moving first, then stood behind them. Every house emptied without a single one left empty-handed." }

      - id: "kaya_sert_ders_lojman_sonu"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şafak söktüğünde Lojmanlar'ın sokaklarında hurdadan gövdeler yığılı. Çatılardaki insanlar birer birer aşağı iniyor; kucağında bebek olan kadın yanından geçerken eline dokunuyor ve bir şey söylemeden yürüyor.", en: "When dawn breaks, the streets of the company houses are piled with scrap bodies. The people on the roofs climb down one by one. The woman with the baby touches your hand as she passes and keeps walking without a word." }
          - { tr: "Kuzeyden bir koşucu geliyor. Döküm ayakta, diyor; ama Başçavuş yaralı. Kuzey kolunu kendi süngüsüyle, dokuz adamla tutmuş. Dokuzundan üçü ölmüş.", en: "A runner comes in from the north. The Foundry held, he says. But the Gunny's hurt. He held the north column with his own bayonet and nine people. Three of the nine are dead." }
        secenekler:
          - id: "kayaya_kos"
            etiket: { tr: "{npc:kaya_demir|in} yanına koş", en: "Run to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 4 }
              - hafiza: { npc: "kaya_demir", id: "emri_cignedi", agirlik: 40 }
              - npc_iz: { kaya_demir: "yara_izi" }
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "Lojmanlar'ı kurtardıktan sonra Döküm'e koştun; {npc:kaya_demir} süngüsünü bırakmadan seni karşıladı, yarası yeni ve derin.", en: "After you saved the company houses, you ran to the Foundry. {npc:kaya_demir} met you without letting go of his bayonet, his wound fresh and deep." }
            sonraki: "kaya_sert_ders_safak"
          - id: "kal"
            etiket: { tr: "Lojmanlar'da kal; yaralıları topla", en: "Stay at the houses. Gather the wounded" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 5 }
              - hafiza: { npc: "kaya_demir", id: "emri_cignedi", agirlik: 40 }
              - npc_iz: { kaya_demir: "yara_izi" }
              - iliski: { kaya_demir: { guven: -2 } }
            kronik: { tr: "Lojmanlar'ı kurtardın ve sabaha kadar oradaki yaralıları topladın; {npc:kaya_demir} yarasını sensiz sardı.", en: "You saved the company houses and gathered their wounded until morning. {npc:kaya_demir} dressed his own wound without you." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_ikisi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehaneden çıkıyorsun ve {yer:sanayi|in} sokakları bir an bulanıklaşıyor. Döküm'ün kapısında kuzey kolunun ilk sırası yere seriliyor; dört dakika sonra Lojmanlar'ın çatılarındaki insanlar güney kolunun ön saflarının dağıldığını görüyor.", en: "You walk out of the mill and the streets of {yer:sanayi} blur for a second. At the Foundry door, the first rank of the north column hits the ground. Four minutes later, the people on the roofs of the company houses watch the front of the south column fall apart." }
          - { tr: "Gece boyunca iki hat arasında gidip geliyorsun. Döküm ustaları seni kuzeyde görüyor; çatılardakiler güneyde. Sabah iki taraf da seni bütün gece yanlarında sanıyor.", en: "All night you go back and forth between the two lines. The casters see you in the north. The people on the roofs see you in the south. By morning, both sides think you were with them all night." }
          - { tr: "Şafakta {npc:kaya_demir} Döküm'ün kapısında, süngüsü temiz, haritası elinde duruyor. Harita artık hiçbir şey anlatmıyor; o da bunu biliyor.", en: "At dawn, {npc:kaya_demir} is standing at the Foundry door with a clean bayonet and his map in his hand. The map doesn't mean anything anymore, and he knows it." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı taşması bastırıldı: Cüruf Tepesi]", en: "[Gate break suppressed: Slag Heap]" }
            satirlar:
              - { tr: "Sivil kayıp: 0. Lonca kaybı: 0.", en: "Civilian losses: 0. Guild losses: 0." }
              - { tr: "Not: Bu sonuç bölge komutanının planında yer almıyordu.", en: "Note: This outcome was not in the area commander's plan." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Bir şey söyleme; yanında dur", en: "Don't say anything. Just stand next to him" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { kaya_demir: { guven: 3 } }
            kronik: { tr: "İki hattı birden tuttuğun şafakta {npc:kaya_demir|in} yanında sessizce durdun; ikiniz de haritaya bakmadınız.", en: "On the dawn after you held both lines, you stood quietly next to {npc:kaya_demir}. Neither of you looked at the map." }
            sonraki: "kaya_sert_ders_safak"
          - id: "ders"
            etiket: { tr: "\"Bu gece kimse ölmedi. Dersin neydi?\"", en: "\"Nobody died tonight. What was the lesson?\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 3, guven: -4, korku: 3 } }
              - bayrak: "kaya_rakip_gordu"
            kronik: { tr: "Şafakta {npc:kaya_demir|e} bu gecenin dersini sordun; asıl dersi o gece alan oydu ve bunu sana hiç affetmedi.", en: "At dawn you asked {npc:kaya_demir} what the lesson was supposed to be. He was the one who learned something that night, and he never quite forgave you for it." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_plan"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} haritaya uzun uzun bakıyor. Sonra kalemi alıp Lojmanlar'dan Döküm'e bir ok çiziyor. \"On dört dakika,\" diyor. \"On ikisi yolda geçer. İki dakika payın var.\"", en: "{npc:kaya_demir} stares at the map for a long time. Then he takes a pencil and draws an arrow from the houses to the Foundry. \"Fourteen minutes,\" he says. \"Twelve of them on the road. That gives you two to spare.\"" }
          - { tr: "İki yüz kişi gecenin içinde, ellerinde battaniyeler ve çocuklarla Döküm'e yürüyor. Sürünün güney kolu Lojmanlar'a vardığında evler boş; kuzey kolu Döküm'ün kapısına vardığında karşısında sen ve {npc:kaya_demir} varsınız.", en: "Two hundred people walk through the night to the Foundry, carrying blankets and kids. When the south column hits the company houses, they're empty. When the north column hits the Foundry door, it finds you and {npc:kaya_demir} waiting." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Onunla omuz omuza dur", en: "Stand shoulder to shoulder with him" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bayrak: "lojmanlar_kurtarildi"
              - degisken: { hayatta_kalan: 5 }
              - hafiza: { npc: "kaya_demir", id: "hatti_tuttu", agirlik: 45 }
              - savas: { dusmanlar: ["kepenk_cenesi@dunya+10", "hurdacik@dunya+10", "hurdacik@dunya+10", "hurdacik@dunya+10"], ortam: ["yanici"], kazan: "kaya_sert_ders_safak", kaybet: "kaya_sert_ders_yara", kac: "kaya_sert_ders_yara" }
            kronik: { tr: "Lojmanlar gecesinde {npc:kaya_demir|le} Döküm'ün kapısında omuz omuza durdun; arkanızda iki yüz kişi döküm çukurlarında sabahı bekledi.", en: "On the night of the company houses you stood shoulder to shoulder with {npc:kaya_demir} at the Foundry door, and two hundred people waited out the night in the casting pits behind you." }

      - id: "kaya_sert_ders_plan_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} başını iki yana sallıyor. \"On iki dakika yol, iki yüz sivil, karanlıkta,\" diyor. \"Planın kâğıtta güzel. Sahada yarısını yolda kaybederiz.\"", en: "{npc:kaya_demir} shakes his head. \"Twelve minutes on the road, two hundred civilians, in the dark,\" he says. \"Your plan looks great on paper. In the field we lose half of them on the way.\"" }
          - { tr: "\"Zaman yok. Emrimi verdim.\" Sirenler hâlâ ötüyor.", en: "\"No time. You have your order.\" The sirens are still going." }
        secenekler:
          - id: "uy"
            etiket: { tr: "Emre uy; Döküm'ü tut", en: "Follow the order. Hold the Foundry" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - bayrak: "sert_ders_emre_uyuldu"
              - iliski: { kaya_demir: { saygi: 4, guven: 4 } }
            kronik: { tr: "Planın reddedilince {npc:kaya_demir|in} emrine uydun; Döküm ayakta kaldı, Lojmanlar kalmadı.", en: "When he turned down your plan, you followed {npc:kaya_demir|pos} order. The Foundry stood. The houses didn't." }
            sonraki: "kaya_sert_ders_dokum"
          - id: "cigne"
            etiket: { tr: "Yine de Lojmanlar'a koş", en: "Run for the houses anyway" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -6 }
              - bayrak: "sert_ders_emir_cignendi"
              - iliski: { kaya_demir: { guven: -5 } }
            kronik: { tr: "Planın reddedildiğinde bile {npc:kaya_demir|in} emrini çiğneyip Lojmanlar'a koştun.", en: "Even after he shot your plan down, you broke {npc:kaya_demir|pos} order and ran for the houses." }
            sonraki: "kaya_sert_ders_lojman"

      - id: "kaya_sert_ders_yara"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir çelik çene omzuna kapanıyor ve dünya kıvılcımlara boğuluyor. Gözünü açtığında bir döküm ustası seni kepenklerin arkasına sürüklemiş; dışarıda savaş hâlâ sürüyor ama artık senin savaşın değil.", en: "A steel jaw clamps down on your shoulder and the world drowns in sparks. When you open your eyes, one of the casters has dragged you behind the shutters. The fight's still going outside, but it isn't yours anymore." }
          - { tr: "Şafakta {npc:kaya_demir|in} ağır mangası kapıyı kapatıyor. Gece kimi kaybettiğinizi sayarken Başçavuş seni yerden kaldırıyor.", en: "At dawn, {npc:kaya_demir|pos} heavy squad closes the Gate. While everyone's counting who the night took, the Gunny pulls you up off the floor." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Elini tut ve kalk", en: "Take his hand and get up" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "lojmanlar_yandi"
              - degisken: { hayatta_kalan: -3 }
              - iliski: { kaya_demir: { guven: 4 } }
              - stat: { wil: 2 }
            kronik: { tr: "Lojmanlar gecesinde yere düştün ve seni {npc:kaya_demir} kaldırdı; o geceyi bir yenilgi olarak değil, onun elinin sıcaklığıyla hatırladın.", en: "On the night of the company houses you went down, and {npc:kaya_demir} pulled you back up. You didn't remember it as a loss. You remembered how warm his hand was." }
            sonraki: "kaya_sert_ders_safak"

      - id: "kaya_sert_ders_safak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Güneş Cüruf Tepesi'nin arkasından yükseliyor. {npc:kaya_demir} Döküm'ün basamaklarına oturmuş, botlarının bağcığını sıkıyor; bunu bir şey söylemeden önce yapıyor, hep.", en: "The sun comes up behind the slag heap. {npc:kaya_demir} is sitting on the Foundry steps, tightening his bootlaces. He always does that before he says something." }
          - metin: { tr: "\"Lojmanlar'ı ben yaktım,\" diyor. \"Sen değil. Emri ben verdim. Bunu senin defterine yazma; benimkinde yeterince yer var.\"", en: "\"I burned those houses,\" he says. \"Not you. I gave the order. Don't put it in your ledger. Mine's got plenty of room.\"" }
            kosul: { bayrak: "lojmanlar_yandi" }
          - metin: { tr: "\"Haklı çıktın,\" diyor, sana bakmadan. \"Emrimi çiğnedin ve haklı çıktın. Bu, emrimi çiğnemenden daha çok canımı sıkıyor.\" Bacağındaki yeni sargıya bakıyor. \"Ama haklı çıktın.\"", en: "\"You were right,\" he says, not looking at you. \"You broke my order and you were right. That bothers me more than the breaking.\" He looks down at the fresh bandage on his leg. \"But you were right.\"" }
            kosul: { bayrak: "sert_ders_emir_cignendi", bayrak_yok: "lojmanlar_yandi" }
          - metin: { tr: "\"Yirmi yıl boyunca herkese aynı şeyi öğrettim: herkesi kurtaramazsın,\" diyor. \"Bu gece sen kurtardın. Şimdi ben sana ne öğreteceğim?\" Bir an susuyor. \"Sana kim 'dur' diyecek, hiç düşündün mü? Çünkü ben artık diyemiyorum.\"", en: "\"Twenty years, I taught everybody the same thing: you can't save everyone,\" he says. \"Tonight you did. So what am I supposed to teach you now?\" He goes quiet for a second. \"Ever wonder who gets to tell you to stand down? Because I can't anymore.\"" }
            kosul: { bayrak: "kaya_doktrin_kirildi" }
          - metin: { tr: "\"Üçüncü bir yol buldun,\" diyor. \"Ben bulamadım. Yirmi yıl boyunca hep iki yol gördüm.\" Bağcığı bırakıyor. \"Belki de yaşlanıyorum.\"", en: "\"You found a third way,\" he says. \"I didn't. Twenty years, I only ever saw two.\" He lets go of the lace. \"Maybe I'm getting old.\"" }
            kosul: { bayrak: "lojmanlar_kurtarildi", bayrak_yok: ["kaya_doktrin_kirildi", "sert_ders_emir_cignendi"] }
          - { tr: "\"Bir kere bir emri yırttım,\" diyor sonunda. \"Sana hangisi olduğunu hiç anlatmadım.\"", en: "\"I tore up an order once,\" he finally says. \"I never told you which one.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ş̷imdi sana bir şey verecek. bir hikâye ya da bir rütbe. ikisi de aynı kapıya açılıyor: onun yerine.", en: "h̷e's about to hand you something. a story or a rank. both open the same door: his place." }
        secenekler:
          - id: "sor"
            etiket: { tr: "\"Anlat.\"", en: "\"Tell me.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bilgi: "kaya_yirtilan_emir"
              - iliski: { kaya_demir: { guven: 8, baglilik: 4 } }
            kronik: { tr: "Döküm'ün basamaklarında {npc:kaya_demir} sana yırttığı emri anlattı; o hikâyeyi ondan başka yalnızca sen bildin.", en: "On the Foundry steps, {npc:kaya_demir} told you about the order he tore up. Nobody but you and him ever knew that story." }
            sonraki: "kaya_sert_ders_hikaye"
          - id: "ogret"
            etiket: { tr: "\"Bana komuta etmeyi öğret.\"", en: "\"Teach me how to command.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "kaya_akil_hocasi"
              - unvan: "bascavusun_ogrencisi"
              - iliski: { kaya_demir: { baglilik: 10, guven: 6, saygi: 4 } }
              - tohum: { olay: "lonca_1_kapi_temizligi", gecikme: { min: 2, max: 5 }, kosul: { bayrak_yok: "lonca_1_tamam" } }
            kronik: { tr: "Lojmanlar'ın şafağında {npc:kaya_demir|den} sana komuta etmeyi öğretmesini istedin; o gün bir öğrenci, o da bir akıl hocası oldu.", en: "On the dawn after the company houses, you asked {npc:kaya_demir} to teach you how to command. That day you became a student, and he became a mentor." }
            sonraki: "@akis"
          - id: "ben_veririm"
            etiket: { tr: "\"Bir dahaki sefere emri ben veririm.\"", en: "\"Next time, I give the orders.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - bayrak: "kaya_rakip_gordu"
              - iliski: { kaya_demir: { korku: 6, saygi: 4, guven: -6 } }
              - dikkat: 2
            kronik: { tr: "Döküm'ün basamaklarında {npc:kaya_demir|e} bir dahaki sefere emri senin vereceğini söyledin; o gün seni ilk kez bir halef değil, bir rakip olarak gördü.", en: "On the Foundry steps you told {npc:kaya_demir} that next time, you'd be giving the orders. That day he saw you as a rival instead of an heir for the first time." }
            sonraki: "@akis"
          - id: "benim_yolum_degil"
            etiket: { tr: "\"Bu senin yolun. Benim değil.\"", en: "\"This is your road. Not mine.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -3 }
              - iliski: { kaya_demir: { saygi: 3, guven: -2 } }
            kronik: { tr: "{npc:kaya_demir|e} onun yolunun senin yolun olmadığını söyledin; Döküm'ün basamaklarında ikiniz ayrı yönlere bakarak oturdunuz.", en: "You told {npc:kaya_demir} his road wasn't yours. On the Foundry steps, the two of you sat looking in different directions." }
            sonraki: "@akis"

      - id: "kaya_sert_ders_hikaye"
        yer: "sanayi"
        paragraflar:
          - { tr: "\"Büyük bir deprem,\" diyor. \"Bir spor salonunu çadırkente çevirmiştik. Gece yağmur başladı, artçılar sürüyordu. Salon doldu ve telsizden emir geldi: kapasite tamam, kapıları kilitleyin.\"", en: "\"A hurricane,\" he says. \"Big one, on the Gulf. We'd turned a high school gym into a shelter. That night the water kept coming up. The gym filled, and the order came over the radio: capacity reached, lock the doors.\"" }
          - { tr: "\"Dışarıda kırk iki kişi vardı. Saydım. Emri yazılı istedim, yazılı geldi. Yırttım ve kapıyı açık tuttum.\" Elleriyle bir kâğıdı ikiye ayırıyormuş gibi yapıyor. \"Rütbemi söktüler. Kırk ikisi de sabahı gördü.\"", en: "\"There were forty-two people outside. I counted. I asked for the order in writing, and it came in writing. I tore it in half and kept the doors open.\" His hands make the motion of ripping paper. \"They busted me down a rank. All forty-two saw morning.\"" }
          - { tr: "\"O günden beri her kuralı yazarken bir köşesini yırtılabilir bırakıyorum,\" diyor. \"Sorun şu, asker: o köşeyi kimin yırtacağına kim karar verecek? Ben mi? Sen mi?\"", en: "\"Ever since, every rule I write, I leave one corner that can tear,\" he says. \"Here's the problem, kid. Who decides who gets to tear it? Me? You?\"" }
        secenekler:
          - id: "sen"
            etiket: { tr: "\"Sen. Şimdilik.\"", en: "\"You. For now.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "kaya_akil_hocasi"
              - unvan: "bascavusun_ogrencisi"
              - iliski: { kaya_demir: { baglilik: 8, guven: 4 } }
            kronik: { tr: "{npc:kaya_demir|e} kuralın köşesini şimdilik onun yırtacağını söyledin; o gün akıl hocan oldu ve 'şimdilik' kelimesini hiç unutmadı.", en: "You told {npc:kaya_demir} he'd decide who tears the corner, for now. That day he became your mentor, and he never forgot the words 'for now.'" }
            sonraki: "@akis"
          - id: "en_guclu"
            etiket: { tr: "\"En güçlü olan.\"", en: "\"Whoever's strongest.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -4 }
              - iliski: { kaya_demir: { saygi: 5, korku: 3, guven: -2 } }
              - bayrak: "kaya_rakip_gordu"
            kronik: { tr: "{npc:kaya_demir|e} kuralın köşesini en güçlü olanın yırtacağını söyledin; ikiniz de en güçlünün kim olduğunu biliyordunuz.", en: "You told {npc:kaya_demir} the strongest one decides who tears the corner. Both of you knew exactly who that was." }
            sonraki: "@akis"
          - id: "insanlar"
            etiket: { tr: "\"Kapının dışında bekleyen kırk iki kişi.\"", en: "\"The forty-two people waiting outside.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 3, duzen: -2 }
              - iliski: { kaya_demir: { guven: 6, saygi: 4 } }
            kronik: { tr: "{npc:kaya_demir|e} kuralın köşesini kapının dışında bekleyenlerin yırtacağını söyledin; uzun süre sustu, sonra başını salladı.", en: "You told {npc:kaya_demir} the people waiting outside the door decide who tears the corner. He was quiet a long time. Then he nodded." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 2 — MERDİVEN GÜNÜ (P2)
  - id: "lonca_2_rutbe"
    perde: [2]
    gun: { min: 95, max: 180 }
    kosul: { bayrak: "lonca_1_tamam", bayrak_yok: ["lonca_dusmani", "lonca_2_tamam"] }
    agirlik: 8
    etiketler: ["lonca", "zincir", "duello", "sanayi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Merdiven Günü", en: "Ladder Day" }
    sahne: "lonca_2_rutbe_1"
    sahneler:
      - id: "lonca_2_rutbe_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Üç ayda bir, Lonca haddehanenin zeminini boşaltır ve ortasına tebeşirle bir çember çizer. Merdiven Günü: Pano'daki herkes, bir üstündeki basamağa meydan okuyabilir. Kazanan basamağı alır; kaybeden, basamağıyla birlikte o basamağın tayınını da kaybeder.", en: "Once every three months, the Guild clears the floor of the rolling mill and chalks a circle in the middle. Ladder Day: anyone on the Board can challenge the rung right above them. Win and you take the rung. Lose, and you lose the rung and the rations that come with it." }
          - { tr: "Vinçlerin üstüne, kirişlere, kızgın döküm kalıplarının kenarına kadar yüzlerce insan doluşmuş. Pano'nun en üstündeki isim yıllardır değişmemiş: Örs. Entegrasyon Günü tersanenin kapısını bir balyozla tutan, kolları bir vinç halatı kadar kalın, eski bir kaynakçı.", en: "Hundreds of people are packed onto the cranes, the girders, all the way to the edges of the hot casting molds. The name at the top of the Board hasn't changed in a long time: Anvil. An old welder with arms as thick as crane cable who held the shipyard gate with a sledgehammer on Integration Day." }
          - { tr: "Defterdar meydan okumaları yazı altlığından okuyor. Sıra sana geliyor ve sesi bir an duraksıyor. \"Katkı puanı... Pano'nun tamamından yüksek,\" diyor. \"Kural gereği bir basamağa değil, istediğin basamağa meydan okuyabilirsin.\"", en: "The Ledger reads the challenges off her clipboard. When she gets to you, her voice stalls for a second. \"Contribution score... higher than the whole rest of the Board,\" she says. \"By the rules, you don't challenge one rung. You challenge any rung you want.\"" }
          - metin: { tr: "{npc:kaya_demir} haddehanenin balkonunda, kollarını parmaklığa dayamış izliyor. Göz göze geldiğinizde başıyla Örs'ü gösteriyor; çok hafifçe.", en: "{npc:kaya_demir} is up on the mill's balcony, arms resting on the rail, watching. When your eyes meet, he tips his head toward Anvil. Just barely." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Haddehanenin balkonu boş. Lonca'nın subay konseyi onun yerine, sıra sıra dizilmiş sandalyelerde oturuyor ve hepsi Örs'e bakıyor.", en: "The mill's balcony is empty. The Guild's officer council sits in a row of chairs where he used to stand, and every one of them is looking at Anvil." }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Zeminin altından, Kasaba Çekirdeği'nin uğultusu geliyor. Lonca'nın rütbeleri artık Sistem'e işleniyor: kazandığın basamak herkesin penceresinde adının yanında yazacak.", en: "The Town Core is humming under the floor. The Guild's ranks get written into the System now: whatever rung you win will show up next to your name in everybody's window." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kalabalığın arasında fısıltılar dolaşıyor: bozuk pencere, ikinci ses, Sistem'in bile okuyamadığı satırlar. Ama burada korkuyla değil, merakla söyleniyorlar. Lonca'da bir anomali bir kusur değil; bir avantaj.", en: "Whispers move through the crowd: the broken window, the second voice, lines even the System can't read. But here, nobody says them like they're scared. In the Guild, an anomaly isn't a defect. It's an edge." }
            kosul: { bayrak: "yanki_gorundu" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Örs'ün sol dizi sargılı ve sargının altında eski bir kırık var. Kalabalığın ön sırasında iki çocuk ve bir kadın, ellerinde turuncu bir tayın kartı tutuyor; kart ilk basamağın kartı.", en: "Anvil's left knee is wrapped, and there's an old break under the wrap. In the front row of the crowd, a woman and two kids are holding an orange ration card. It's a top-rung card." }
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Örs'ün görünen seviyesi gerçeğiyle aynı. O da şişirmiyor. Bu haddehanede şişirmeyen ikinci adam o.", en: "Anvil's displayed level matches his real one. He doesn't pad either. He's the second man in this mill who doesn't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷erdiven. Sistem'in de bir merdiveni var; sen onun basamaklarını üçer üçer çıkıyorsun. bu adamınki yalnızca daha kısa.", en: "l̷adder. the System has one too, and you take its rungs three at a time. this man's is just shorter." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklarına bak. O kart onların ısıtmalı odası. Bunu biliyorsun, değil mi?\"", en: "\"Look at his kids. That card is their heated room. You know that, right?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dizi bir darbe daha kaldırmaz. Hekim olarak söylüyorum, rakip olarak değil.\"", en: "\"That knee won't take another hit. I'm saying that as a doctor, not as your second.\"" }
        secenekler:
          - id: "meydan"
            etiket: { tr: "Örs'e meydan oku", en: "Challenge Anvil" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Merdiven Günü'nde Lonca'nın en üst basamağındaki adama meydan okudun.", en: "On Ladder Day you challenged the man on the top rung of the Guild's ladder." }
            sonraki: "lonca_2_cember"
          - id: "hepsi"
            tur: "gosteris"
            etiket: { tr: "Bütün basamakları aynı anda çembere çağır", en: "Call every rung into the circle at once" }
            gerekli: { stat: { str: 65 } }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - dikkat: 5
              - itibar: { lonca: 12 }
              - efsane: "tek_basina_suru"
              - iliski: { kaya_demir: { saygi: 8, korku: 6 } }
            kronik: { tr: "Merdiven Günü'nde Lonca'nın bütün subaylarını aynı anda çembere çağırdın; o günden sonra Pano'da tek bir basamak kaldı ve o basamak sendin.", en: "On Ladder Day you called every officer in the Guild into the circle at once. After that, the Board only really had one rung, and it was you." }
            sonraki: "lonca_2_hepsi"
          - id: "yeni_basamak"
            etiket: { tr: "\"Onun yerini istemiyorum. Üstüne yeni bir basamak koy.\"", en: "\"I don't want his spot. Add a rung above it.\"" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - bayrak: "ors_borclu"
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
            kronik: { tr: "Merdiven Günü'nde Örs'ün basamağını almak yerine Lonca'ya yeni bir basamak yazdırdın; o adamın çocukları o kış ısıtmalı odada uyudu.", en: "On Ladder Day, instead of taking Anvil's rung, you got the Guild to add a new one above it. His kids slept in a heated room that winter." }
            sonraki: "lonca_2_yeni"
          - id: "bilerek"
            tur: "gizle"
            etiket: { tr: "Meydan oku ama bilerek kaybet", en: "Challenge him. Lose on purpose" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - gizle: 3
              - bayrak: "ors_borclu"
            kronik: { tr: "Merdiven Günü'nde Örs'e bilerek yenildin; Lonca'da bunu bilen yalnızca iki kişi vardı ve ikisi de bunu hiç söylemedi.", en: "On Ladder Day you let Anvil beat you on purpose. Only two people in the Guild ever knew, and neither of them said a word." }
            sonraki: "lonca_2_bilerek"
          - id: "red"
            etiket: { tr: "\"Ben bu oyunu oynamam.\"", en: "\"I don't play this game.\"" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - iliski: { kaya_demir: { saygi: -2, guven: -2 } }
            kronik: { tr: "Merdiven Günü'nde çemberin önünde durup rütbe oyununu reddettin.", en: "On Ladder Day you stood at the edge of the circle and refused to play the rank game." }
            sonraki: "lonca_2_red"

      - id: "lonca_2_cember"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs balyozunu omzundan indiriyor, eldivenlerini sıkıyor ve çemberin içine adım atıyor. Sana bakarken yüzünde öfke yok; bir kaynakçının bir dikişin tutup tutmayacağını tartarkenki yüzü var.", en: "Anvil lowers the sledge off his shoulder, tightens his gloves, and steps into the circle. There's no anger on his face when he looks at you. It's the look a welder gets deciding whether a seam's going to hold." }
          - { tr: "\"Kazanacağını biliyorum,\" diyor, yalnızca senin duyacağın kadar alçak sesle. \"Herkes biliyor. Yine de çemberden çıkmayacağım. Çocuklarım izliyor.\"", en: "\"I know you're going to win,\" he says, low enough that only you can hear. \"Everybody knows. I'm still not stepping out of this circle. My kids are watching.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ona hak ettiği dövüşü ver", en: "Give him the fight he's earned" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - savas: { dusmanlar: ["ors_bascavus@oyuncu+2"], ortam: [], kazan: "lonca_2_zafer", kaybet: "lonca_2_yenilgi", kac: "lonca_2_yenilgi" }
            kronik: { tr: "Örs'e hak ettiği dövüşü verdin; çemberde ikiniz de bir şey kanıtladınız.", en: "You gave Anvil the fight he'd earned. Both of you proved something in that circle." }
          - id: "tek"
            tur: "gosteris"
            etiket: { tr: "Tek hamlede bitir; acı çekmesin", en: "End it in one move. Spare him the pain" }
            gerekli: { stat: { agi: 70 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -2 }
              - dikkat: 3
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
            kronik: { tr: "Örs'ü tek hamlede, balyozunu kaldıramadan yere indirdin; kimse o dövüşü anlatamadı çünkü kimse göremedi.", en: "You put Anvil down in one move before he could even lift the sledge. Nobody could tell the story of that fight, because nobody saw it." }
            sonraki: "lonca_2_zafer"

      - id: "lonca_2_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Örs'ün balyozu çeliğe çarpıyor ve sesi haddehanenin çatısında uzun süre çınlıyor. Örs dizlerinin üstünde, nefes nefese; kalkmaya çalışmıyor.", en: "Anvil's sledge hits the steel floor and the sound rings around the mill roof for a long time. Anvil's on his knees, breathing hard. He doesn't try to get up." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Dövüş, başlamadan bitmiş gibi. Örs sırtüstü yatıyor, balyozu iki adım ötede; kalabalık neyi kaçırdığını anlamaya çalışıyor.", en: "The fight's over like it never started. Anvil's flat on his back, his sledge six feet away, and the crowd's trying to figure out what they missed." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Haddehane tamamen susmuş. Ön sırada, Örs'ün çocuklarından küçük olanı turuncu tayın kartını annesinin elinden alıp sıkıca göğsüne bastırıyor.", en: "The whole mill has gone dead silent. In the front row, Anvil's younger kid takes the orange ration card out of his mom's hand and clutches it tight against his chest." }
          - { tr: "Defterdar tebeşiri uzatıyor. Kural belli: Örs'ün adını sil, kendininkini yaz.", en: "The Ledger holds out the chalk. The rule's clear: wipe Anvil's name and write yours." }
        secenekler:
          - id: "el"
            etiket: { tr: "Örs'e elini uzat; çavuşun olarak kalsın", en: "Offer Anvil a hand. Keep him as your sergeant" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - bayrak: "ors_borclu"
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "Merdiven Günü'nde yendiğin Örs'ü yerden kaldırıp çavuşun yaptın; o adam sonraki her kavgada senin sol yanında durdu.", en: "On Ladder Day you pulled the beaten Anvil off the floor and made him your sergeant. He stood on your left in every fight that came after." }
            sonraki: "lonca_2_son"
          - id: "sok"
            etiket: { tr: "Yamasını herkesin önünde sök", en: "Rip his patch off in front of everyone" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5, insanlik: -3 }
              - bayrak: "ors_kin"
              - itibar: { lonca: 8 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
              - tohum: { olay: "ors_soguk_oda", gecikme: { min: 12, max: 22 }, kosul: { bayrak: "ors_kin" } }
            kronik: { tr: "Merdiven Günü'nde Örs'ün yamasını herkesin önünde söktün; Lonca alkışladı ve çocuklarının ısıtmalı odası o hafta başkasına verildi.", en: "On Ladder Day you ripped Anvil's patch off in front of everyone. The Guild cheered, and that week his kids' heated room went to someone else." }
            sonraki: "lonca_2_son"
          - id: "reform"
            tur: "gosteris"
            etiket: { tr: "\"Bugünden itibaren rütbe kaybeden aç kalmaz.\"", en: "\"From today on, nobody who loses a rung goes hungry.\"" }
            gerekli: { stat: { cha: 55 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 4 }
              - bayrak: "ors_borclu"
              - bayrak: "lonca_rutbe_reformu"
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 6, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 6, guven: -1 } }
            kronik: { tr: "Merdiven Günü'nün kuralını yeniden yazdın: basamak kaybeden aç kalmadı; Lonca'nın merdiveni o günden sonra daha az kanlı ama daha uzun oldu.", en: "You rewrote the rule of Ladder Day: losing a rung no longer meant going hungry. After that, the Guild's ladder got longer and a lot less bloody." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_hepsi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çemberin ortasına yürüyorsun ve Pano'daki bütün subayların adını tek tek okuyorsun. Kalabalık önce gülüyor. Sonra Örs balyozunu alıp çembere giriyor ve gülüşler kesiliyor.", en: "You walk into the middle of the circle and read off the name of every officer on the Board, one by one. The crowd laughs at first. Then Anvil picks up his sledge and steps into the circle, and the laughing stops." }
          - { tr: "On bir kişi çemberin içinde. Balyozlar, zıpkınlar, kapı zırhları. Bir dakika sonra on birinin hepsi tebeşir çizgisinin dışında, yerde.", en: "Eleven people in the circle. Sledges, harpoons, Gate armor. One minute later, all eleven are on the floor outside the chalk line." }
          - metin: { tr: "Kantinde sana gülen iki çavuş da o on bir kişinin arasında. İkisi de kalkarken gözlerini yerden kaldırmıyor.", en: "The two sergeants who laughed at you in the mess hall are part of that eleven. Neither of them looks up off the floor as they get to their feet." }
            kosul: { bayrak: "lonca_hafife_aldi" }
          - metin: { tr: "Balkonda {npc:kaya_demir|in} elleri parmaklığı sıkıyor. Yüzünde hayranlık var; ama hayranlığın altında, ilk kez, başka bir şey: bir askerin, kontrol edemeyeceği bir silahı ilk gördüğü an.", en: "Up on the balcony, {npc:kaya_demir|pos} hands tighten on the rail. There's admiration on his face. But under it, for the first time, something else: the look of a soldier seeing a weapon he can't control." }
            kosul: { npc_hayatta: "kaya_demir" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Merdiven: 11 meydan okuma · 11 galibiyet]", en: "[Ladder: 11 challenges · 11 wins]" }
            satirlar:
              - { tr: "Toplam süre: 58 saniye.", en: "Total time: 58 seconds." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Örs'ü yerden kaldır", en: "Pull Anvil up off the floor" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - bayrak: "ors_borclu"
              - iliski: { kaya_demir: { guven: 2 } }
            kronik: { tr: "On bir subayı yere serdikten sonra Örs'ü yerden kaldırdın; o el, Lonca'da senin için ölmeye hazır ilk adamı kazandırdı.", en: "After you put eleven officers on the floor, you pulled Anvil back up. That one hand earned you the first man in the Guild willing to die for you." }
            sonraki: "lonca_2_son"
          - id: "birak"
            etiket: { tr: "Hepsini yerde bırak ve Pano'ya yürü", en: "Leave them all on the floor. Walk to the Board" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - bayrak: "ors_kin"
              - itibar: { lonca: 4 }
              - tohum: { olay: "ors_soguk_oda", gecikme: { min: 12, max: 22 }, kosul: { bayrak: "ors_kin" } }
            kronik: { tr: "On bir subayı yerde bırakıp Pano'ya yürüdün; Lonca o yürüyüşü hayranlıkla, Örs ise kinle hatırladı.", en: "You left eleven officers on the floor and walked to the Board. The Guild remembered that walk with awe. Anvil remembered it with a grudge." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_yeni"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehane bir an ne yapacağını bilemiyor. Merdiven Günü'nde kimse daha önce bir basamak istememişti; herkes birinin basamağını almıştı.", en: "For a second, the whole mill doesn't know what to do. Nobody on Ladder Day has ever asked for a rung before. Everybody's always just taken somebody else's." }
          - metin: { tr: "Balkondan {npc:kaya_demir|in} sesi geliyor: \"Defterdar. Pano'ya Örs'ün üstüne bir satır çiz.\" Kalabalıkta bir uğultu. \"Komutan Yardımcısı. Benimle o satırın arasında kimse yok.\"", en: "{npc:kaya_demir|pos} voice comes down from the balcony: \"Ledger. Draw a line on the Board above Anvil.\" A murmur goes through the crowd. \"Executive Officer. There's nobody between me and that line.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyi kısa bir süre fısıldaşıyor; sonra en yaşlıları ayağa kalkıp Defterdar'a Pano'ya yeni bir satır çizmesini söylüyor.", en: "The officer council whispers for a minute. Then the oldest of them stands up and tells the Ledger to draw a new line on the Board." }
            kosul: { npc_olu: "kaya_demir" }
          - { tr: "Örs çemberin kenarında duruyor, balyozu hâlâ omzunda. Sana bakıyor; sonra çok yavaş, bir kaynakçının bir dikişin tuttuğuna karar verdiği gibi, başını sallıyor.", en: "Anvil stands at the edge of the circle, sledge still on his shoulder. He looks at you. Then, very slowly, the way a welder decides a seam is going to hold, he nods." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Örs'e selam ver", en: "Salute Anvil" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { kaya_demir: { guven: 2 } }
            kronik: { tr: "Merdiven Günü'nde kimsenin basamağını almadan zirveye çıktın ve Örs'e selam verdin; o selamı haddehanede herkes gördü.", en: "On Ladder Day you made the top without taking anybody's rung, and you saluted Anvil. Everybody in the mill saw it." }
            sonraki: "lonca_2_son"

      - id: "lonca_2_bilerek"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs'ün balyozu üçüncü kez geldiğinde onu karşılamıyorsun. Darbe omzuna iniyor ve tebeşir çizgisinin dışına, çeliğin üstüne yuvarlanıyorsun. Kalabalık uğulduyor; çoğu sevinç, biraz hayal kırıklığı.", en: "The third time Anvil's sledge comes in, you don't meet it. It hits your shoulder and you roll out of the chalk circle onto the steel floor. The crowd roars, mostly joy, a little disappointment." }
          - { tr: "Örs başında duruyor ve elini uzatıyor. Seni yerden kaldırırken kulağına eğiliyor: \"Gördüm,\" diyor. \"Bunu unutmayacağım.\"", en: "Anvil stands over you and holds out a hand. As he pulls you up, he leans in to your ear. \"I saw that,\" he says. \"I won't forget it.\"" }
          - metin: { tr: "Balkonda {npc:kaya_demir} kollarını kavuşturmuş. Kalabalık dağılırken seni yukarı çağırıyor. \"Bilerek kaybettin,\" diyor. \"Güzel. Senden gördüğüm ilk subay kararı buydu.\"", en: "Up on the balcony, {npc:kaya_demir} has his arms crossed. As the crowd breaks up, he waves you up. \"You lost on purpose,\" he says. \"Good. That's the first officer's decision I've ever seen you make.\"" }
            kosul: { npc_hayatta: "kaya_demir", iliski_min: { kaya_demir: { saygi: 25 } } }
          - metin: { tr: "Kalabalık dağılırken Defterdar seni bir kenara çekiyor ve Pano'yu gösteriyor. Örs'ün adı yine en üstte; ama hemen altına yeni bir satır çizilmiş: KAPI KOMUTANI. Yanında senin adın. \"Katkı da sayılır,\" diyor.", en: "As the crowd breaks up, the Ledger pulls you aside and points at the Board. Anvil's name is still on top, but right under it there's a new line: GATE COMMANDER. Your name's on it. \"Contribution counts too,\" she says." }
            kosul: { iliski_max: { kaya_demir: { saygi: 24 } } }
        secenekler:
          - id: "sus"
            etiket: { tr: "Bir şey söyleme; omzunu ov", en: "Say nothing. Rub your shoulder" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - itibar: { lonca: 4 }
            kronik: { tr: "Merdiven Günü'nde bilerek kaybettin ve Kapı Komutanı rütbesini sessizce taktın; Örs'ün çocukları ısıtmalı odalarında kaldı.", en: "On Ladder Day you lost on purpose and quietly pinned on the Gate Commander rank. Anvil's kids kept their heated room." }
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "\"Onun çocuklarının odası benim rütbemden önemli.\"", en: "\"His kids' room matters more than my rank.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2, duzen: -1 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
            kronik: { tr: "Merdiven Günü'nden sonra {npc:kaya_demir|e} neden kaybettiğini açıkça söyledin; Lonca'nın meritokrasisi o gün ilk kez bir çocuğun odasını hesaba kattı.", en: "After Ladder Day you told {npc:kaya_demir} straight out why you'd lost. That day, for the first time, the Guild's meritocracy made room for a kid's bedroom." }
            sonraki: "@akis"

      - id: "lonca_2_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs'ün balyozu göğsüne iniyor ve çemberin dışına, çeliğin üstüne savruluyorsun. Bu sefer rol yapmıyorsun. Haddehanenin çatısı bir an dönüyor.", en: "Anvil's sledge lands on your chest and throws you out of the circle onto the steel floor. This time you're not faking it. The mill roof spins for a second." }
          - { tr: "Örs başında duruyor, nefes nefese. Elini uzatıyor. \"Bugün değil,\" diyor; bu cümleyi kimden öğrendiği belli.", en: "Anvil stands over you, breathing hard. He holds out a hand. \"Not today,\" he says. You can tell exactly who he learned that line from." }
          - { tr: "Defterdar Pano'ya yeni bir satır çiziyor, Örs'ün hemen altına: KAPI KOMUTANI. \"Merdivende kaybettin,\" diyor. \"Kapılarda kaybetmedin. Katkı da sayılır.\"", en: "The Ledger draws a new line on the Board, just under Anvil: GATE COMMANDER. \"You lost on the ladder,\" she says. \"You never lost in a Gate. Contribution counts too.\"" }
        secenekler:
          - id: "el_tut"
            etiket: { tr: "Örs'ün elini tut ve kalk", en: "Take Anvil's hand and get up" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - degisken: { lonca_rutbe: 1 }
              - bayrak: "ors_borclu"
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
            kronik: { tr: "Merdiven Günü'nde Örs'e yenildin ve elini tutup kalktın; o günden sonra Lonca'da iki komutan birbirine hiç yalan söylemedi.", en: "On Ladder Day Anvil beat you, and you took his hand and got up. After that, the Guild's two commanders never lied to each other once." }
            sonraki: "@akis"
          - id: "rovans"
            etiket: { tr: "\"Bir sonraki Merdiven Günü'nde görüşürüz.\"", en: "\"See you next Ladder Day.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - degisken: { lonca_rutbe: 1 }
              - stat: { str: 3 }
              - xp_seviye: 40
              - bayrak: "lonca_2_tamam"
              - itibar: { lonca: 3 }
            kronik: { tr: "Merdiven Günü'nde Örs'e yenildin ve rövanş sözü verdin; bir sonraki Merdiven Günü geldiğinde Örs çembere girmeden basamağını sana bıraktı.", en: "On Ladder Day Anvil beat you, and you promised him a rematch. When the next Ladder Day came, he handed over his rung without stepping into the circle." }
            sonraki: "@akis"

      - id: "lonca_2_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çemberin kenarında duruyorsun ve içine adım atmıyorsun. Haddehane uğulduyor; birkaç kişi ıslık çalıyor, birkaç kişi gülüyor.", en: "You stand at the edge of the circle and don't step in. The mill starts buzzing. A few people whistle. A few laugh." }
          - metin: { tr: "{npc:kaya_demir} balkondan aşağı iniyor ve yanına geliyor. \"Rütbe bir oyun değil,\" diyor alçak sesle. \"Rütbe, insanların kimin için ölmeye razı olduğudur. Bu çemberden çıkarsan, bu insanlar senin için ölmez.\"", en: "{npc:kaya_demir} comes down from the balcony and walks up next to you. \"Rank isn't a game,\" he says quietly. \"Rank is who people are willing to die for. Walk away from this circle, and these people won't die for you.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Defterdar yazı altlığını indiriyor. \"Rütbe bir oyun değil,\" diyor. \"Başçavuş bunu hep söylerdi. Rütbe, insanların kimin için ölmeye razı olduğudur.\"", en: "The Ledger lowers her clipboard. \"Rank isn't a game,\" she says. \"The Gunny always used to say that. Rank is who people are willing to die for.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "gir"
            etiket: { tr: "Çembere gir", en: "Step into the circle" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Merdiven Günü'nde bir kez reddettin, sonra çembere girdin; Lonca senin tereddüdünü değil, girişini hatırladı.", en: "On Ladder Day you refused once, then stepped into the circle. The Guild remembered the step, not the hesitation." }
            sonraki: "lonca_2_cember"
          - id: "git"
            etiket: { tr: "Haddehaneden çık", en: "Walk out of the mill" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_merdiven_reddi"
              - itibar: { lonca: -8 }
              - iliski: { kaya_demir: { saygi: -3, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 35 }
            kronik: { tr: "Merdiven Günü'nde haddehaneden çıkıp gittin; Lonca'nın merdiveni senin için orada bitti ve Pano'daki adın bir hafta sonra silindi.", en: "On Ladder Day you walked out of the rolling mill. The Guild's ladder ended for you right there, and a week later your name was wiped off the Board." }
            sonraki: "@akis"

      - id: "lonca_2_son"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:kaya_demir} balkondan iniyor; kalabalık ona yol açıyor. Cebinden bir rütbe işareti çıkarıyor: turuncu yamanın üstüne dikilecek iki çelik çizgi. Onu kendi eliyle omzuna tutturuyor.", en: "{npc:kaya_demir} comes down off the balcony and the crowd parts for him. He pulls a rank insignia out of his pocket, two steel bars to go on top of the orange patch, and pins it to your shoulder with his own hand." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Komutan Yardımcısı,\" diyor, haddehanenin tamamı duysun diye. Sonra yalnızca senin duyacağın kadar alçak sesle: \"Benden sonra bu masa senin. Ama benden sonra, asker. Benden önce değil.\"", en: "\"Executive Officer,\" he says, loud enough for the whole mill to hear. Then, low enough that only you can hear: \"After me, this table's yours. After me, kid. Not before.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyinin en yaşlısı rütbe işaretini sana getiriyor. \"Başçavuş olsa bunu kendi eliyle takardı,\" diyor. \"Biz yalnızca uzatıyoruz.\"", en: "The oldest officer on the council brings you the insignia. \"If the Gunny were here, he'd pin it on you himself,\" she says. \"We're just handing it over.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - { tr: "Defterdar Pano'daki en üst satırı siliyor ve tebeşiri sana uzatıyor.", en: "The Ledger wipes the top line of the Board clean and holds the chalk out to you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "'b̷enden sonra.' bunu söyleyen herkes, söylerken biraz daha uzun yaşamayı planlar.", en: "'a̷fter me.' everybody who says that is planning to live a little longer while they say it." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını yaz", en: "Write your name" }
            etkiler:
              - ahlak: { duzen: 4 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 8 }
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { baglilik: 5, guven: 3 } }
            kronik: { tr: "Merdiven Günü'nün sonunda adını Pano'nun en üstüne kendi elinle yazdın; Lonca o gün bir komutan yardımcısı kazandı.", en: "At the end of Ladder Day you wrote your name at the top of the Board with your own hand. That day the Guild got itself an XO." }
            sonraki: "@akis"
          - id: "pano_yeniden"
            etiket: { tr: "Pano'nun tamamını sil ve yeniden diz", en: "Wipe the whole Board and rank it yourself" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - degisken: { lonca_rutbe: 1 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 10 }
              - dikkat: 2
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 5, korku: 4, guven: -4 } }
            kronik: { tr: "Merdiven Günü'nde Pano'nun tamamını silip Lonca'yı kendi elinle yeniden sıraladın; o günden sonra Lonca'nın rütbeleri {npc:kaya_demir|in} değil, senin tebeşirinle yazıldı.", en: "On Ladder Day you wiped the whole Board and re-ranked the Guild yourself. From that day on, the Guild's ranks were written in your chalk, not {npc:kaya_demir|pos}." }
            sonraki: "@akis"
          - id: "destege"
            etiket: { tr: "Adını yaz; altına Destek sütununu taşı", en: "Write your name. Move the Support column right under it" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { lonca_rutbe: 1, hayatta_kalan: 2 }
              - unvan: "merdivenin_tepesi"
              - xp_seviye: 60
              - itibar: { lonca: 4, siginak: 3 }
              - bayrak: "lonca_2_tamam"
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Merdiven Günü'nde adını Pano'nun tepesine, Destek sütununu da hemen altına yazdın; Lonca o günden sonra en zayıflarını en güçlüsünün gölgesinde saydı.", en: "On Ladder Day you put your name at the top of the Board and the Support column right underneath it. After that, the Guild counted its weakest in the shadow of its strongest." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 3 — MAVİ ÇAPA (P3)
  - id: "lonca_3_rakip_bastirma"
    perde: [3]
    gun: { min: 181, max: 275 }
    kosul: { bayrak: "lonca_2_tamam", bayrak_yok: ["lonca_dusmani", "lonca_3_tamam"] }
    agirlik: 9
    etiketler: ["lonca", "zincir", "ahlak", "liman"]
    gerilim: 4
    onemli: true
    kart: { tr: "Tek Bayrak", en: "One Banner" }
    sahne: "lonca_3_rakip_bastirma_1"
    sahneler:
      - id: "lonca_3_rakip_bastirma_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin harekât odası, eski kontrol kabininin camlarının arkasında. Duvarda {yer:kiyikent|in} haritası ve üstünde yeni bir kararname: TEK BAYRAK. Şehirdeki her avcı Lonca'ya kayıt olacak; Kule'nin otuzuncu katından yukarısı Lonca'nın izniyle tırmanılacak.", en: "The mill's operations room sits behind the glass of the old control booth. On the wall: a map of {yer:kiyikent} and, pinned over it, a new decree. ONE BANNER. Every hunter in the city registers with the Guild. Anything above the Spire's thirtieth floor gets climbed with Guild permission, or not at all." }
          - { tr: "Bir lonca imzalamamış: Mavi Çapa. {yer:kiyikent_liman|in} eski hamalları, römorkörcüleri ve balıkçılarından kurulmuş, kendi kapılarını kendi kapatan, kendi ölülerini kendi gömen bir avcı loncası. Masada bir ihbar duruyor: Çapa'nın Kadim simsarlarına kule kristali sattığına dair.", en: "One guild didn't sign: the Blue Anchor. Longshoremen, tug crews and fishermen off {yer:kiyikent_liman} who close their own Gates and bury their own dead. There's a tip on the table: the Anchor's been selling Spire crystals to Ancient brokers." }
          - metin: { tr: "{npc:kaya_demir} ihbarı sana uzatıyor. \"Kadimler körfezde demirli ve bu adamlar onlara kristal satıyor,\" diyor. \"Bu gece Reis'i getir. Çapa'yı dağıt. Nasıl yapacağın senin işin; yapılmış olması benim işim.\"", en: "{npc:kaya_demir} slides the tip across to you. \"The Ancients are anchored in the bay and these people are selling them crystals,\" he says. \"Bring me the Harbormaster tonight. Break up the Anchor. How you do it is your business. That it gets done is mine.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyi emri oy birliğiyle vermiş; Defterdar okuyor. \"Bu gece. Reis'i getir, Çapa'yı dağıt. Başçavuş olsa beklemezdi.\"", en: "The officer council voted the order unanimously, and the Ledger reads it out. \"Tonight. Bring in the Harbormaster, break up the Anchor. The Gunny wouldn't have waited.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Kontrol kabininin camından körfez görünüyor. {npc:thessar|in} gemisi hâlâ orada, suyun üstünde hiç kıpırdamadan duruyor; ışıkları bir gözün kirpikleri gibi açılıp kapanıyor.", en: "Through the booth glass you can see the bay. {npc:thessar|pos} ship is still out there, sitting on the water without moving an inch, its lights opening and closing like an eyelid." }
            kosul: { bayrak: "thessar_indi" }
        sezgiler:
          - kosul: { stat: { per: 100 } }
            metin: { tr: "İhbarın mürekkebi Defterdar'ın kalemiyle aynı. Kâğıt Lonca'nın kâğıdı. İçindeki on dört isimden yalnızca birinin yanındaki tarih, bir kristal satışının gerçek tarihiyle tutuyor.", en: "The ink on the tip matches the Ledger's pen. The paper is Guild paper. Of the fourteen names on it, only one has a date next to it that lines up with a real crystal sale." }
          - kosul: { stat: { wil: 130 } }
            metin: { tr: "Mavi Çapa'nın bütün avcılarını bir arada düşünüyorsun. Hepsini aynı anda yere indirmek için silah çekmen bile gerekmez. Bunu biliyorsun; bilmek, bir şey yapmaktan daha korkutucu.", en: "You picture every hunter the Blue Anchor has, all in one room. You wouldn't even need to draw a weapon to put them all on the floor. You know that. Knowing it is scarier than doing it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "t̷ek bayrak. bir avcı loncası daha yutulacak. yutulan her şey yutanı biraz daha büyütür; sonunda yutacak bir şey kalmaz.", en: "o̷ne banner. one more guild gets swallowed. everything that gets swallowed makes the swallower a little bigger. eventually there's nothing left to eat." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bunlar liman işçileri. Babam onlarla çay içerdi. Bunu yapma.\"", en: "\"These are dockworkers. My dad used to drink coffee with these guys. Don't do this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"O ihbara bir bakayım. Kâğıt fazla temiz. Gerçek ihbarlar kirli olur.\"", en: "\"Let me look at that tip. Paper's too clean. Real tips are always dirty.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çapa'nın revirine her hafta ilaç gönderiyorum. Kadimler'e satsalardı, benden ilaç istemezlerdi.\"", en: "\"I send medicine to the Anchor's infirmary every week. If they were selling to the Ancients, they wouldn't need it from me.\"" }
        secenekler:
          - id: "bas"
            etiket: { tr: "Salonu bas; Çapa'yı zorla dağıt", en: "Raid the hall. Break the Anchor by force" }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 6, merhamet: -6, insanlik: -3 }
              - itibar: { lonca: 6, siginak: -4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "Mavi Çapa'nın salonunu Lonca'nın bayrağıyla bastın; {yer:kiyikent_liman} o geceyi bir kuşak boyunca anlattı.", en: "You raided the Blue Anchor's hall under the Guild's banner. The Waterfront told the story of that night for a generation." }
            sonraki: "lonca_3_baskin"
          - id: "duello"
            etiket: { tr: "Reis'e düello teklif et: kazanan bayrağı seçer", en: "Offer the Harbormaster a duel. Winner picks the banner" }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Mavi Çapa'yla savaşmak yerine Reis'ine bire bir düello teklif ettin; {yer:kiyikent_liman} bunu bir onur meselesi olarak hatırladı.", en: "Instead of going to war with the Blue Anchor, you offered its Harbormaster a one-on-one duel. The Waterfront remembered it as a matter of honor." }
            sonraki: "lonca_3_duello"
          - id: "aura"
            tur: "gosteris"
            etiket: { tr: "Salona tek başına gir; kimse silah çekemesin", en: "Walk into the hall alone. Nobody gets to draw" }
            gerekli: { stat: { wil: 130 } }
            etkiler:
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 5, insanlik: -4 }
              - dikkat: 5
              - iliski: { kaya_demir: { saygi: 6, korku: 5 } }
            kronik: { tr: "Mavi Çapa'nın salonuna silahsız, tek başına girdin ve kimse silah çekemedi; bir lonca, tek bir damla kan dökülmeden diz çöktü.", en: "You walked into the Blue Anchor's hall alone and unarmed, and nobody could draw on you. A whole guild went to its knees without a drop of blood spilled." }
            sonraki: "lonca_3_aura"
          - id: "arastir"
            etiket: { tr: "Önce ihbarı araştır", en: "Look into the tip first" }
            gerekli: { stat: { per: 100 } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - bilgi: "capa_sahte_ihbar"
              - iliski: { kaya_demir: { guven: -2 } }
            kronik: { tr: "Mavi Çapa'ya gitmeden önce ihbarın kâğıdını, mürekkebini ve tarihlerini okudun; Lonca'nın kendi kalemini orada buldun.", en: "Before you went anywhere near the Blue Anchor, you read the tip's paper, its ink and its dates. You found the Guild's own pen in it." }
            sonraki: "lonca_3_ihbar"
          - id: "uyar"
            tur: "gizle"
            etiket: { tr: "Reis'i gizlice uyar; şehirden kaçsınlar", en: "Quietly warn the Harbormaster. Get them out of town" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -5 }
              - gizle: 2
            kronik: { tr: "Mavi Çapa'yı Lonca'nın baskınından önce gizlice uyardın; {yer:kiyikent_liman|in} tekneleri gece yarısı ışıksız çıktı.", en: "You quietly tipped off the Blue Anchor before the Guild could hit them. The Waterfront's boats slipped out at midnight with their lights off." }
            sonraki: "lonca_3_uyari"
          - id: "reddet"
            etiket: { tr: "\"Bu emri uygulamayacağım.\"", en: "\"I'm not carrying out this order.\"" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 3 }
              - iliski: { kaya_demir: { saygi: 2, guven: -5 } }
            kronik: { tr: "Mavi Çapa'yı dağıtma emrini yüzlerine reddettin.", en: "You refused the order to break up the Blue Anchor to their faces." }
            sonraki: "lonca_3_red"

      - id: "lonca_3_baskin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mavi Çapa'nın salonu eski balık mezatı: tuz kokulu sundurmalar, yükleme kancaları, suyun üstüne kurulmuş tahta iskeleler. Lonca'nın zırhlı mangası arkanda; kapılar kırıldığında içeride elli avcı zıpkınlarıyla bekliyor.", en: "The Blue Anchor's hall is the old fish auction: salt-stained awnings, loading hooks, wooden piers built out over the water. The Guild's armored squad is right behind you. When the doors come down, fifty hunters are waiting inside with harpoons." }
          - { tr: "Mezat kürsüsünün arkasından iri, sakallı bir adam kalkıyor; omzunda bir römorkör halatı, elinde gemi zinciri. \"Kaptanınıza söyleyin,\" diyor, \"bu limanın tek bir kaptanı var.\"", en: "A big bearded man gets up from behind the auction podium, tug line over his shoulder, anchor chain in his fist. \"Tell your captain,\" he says, \"this harbor's only got room for one.\"" }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Saldır", en: "Attack" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - savas: { dusmanlar: ["capa_avcisi@dunya", "capa_avcisi@dunya", "liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Mavi Çapa'nın mezat salonunda Reis'in avcılarına saldırdın; suyun üstündeki iskeleler o gece kırmızıya boyandı.", en: "You attacked the Harbormaster's hunters in the Blue Anchor's auction hall. The piers over the water turned red that night." }
          - id: "son_sans"
            etiket: { tr: "Son bir kez teslim olmalarını iste", en: "Give them one last chance to surrender" }
            gerekli: { stat: { cha: 110 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Baskının ortasında Mavi Çapa'nın avcılarına son bir şans verdin; çoğu zıpkınını bıraktı, yalnızca Reis bırakmadı.", en: "In the middle of the raid you gave the Blue Anchor's hunters one last chance. Most of them dropped their harpoons. Only the Harbormaster didn't." }

      - id: "lonca_3_baskin_sonu"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Reis mezat salonunun ıslak tahtalarına yığılıyor; zinciri hâlâ elinde. Avcıları kıpırdamıyor. Sundurmaların altından denizin sesi geliyor, başka hiçbir şeyin değil.", en: "The Harbormaster slumps onto the wet boards of the auction hall, chain still in his hand. His hunters don't move. Under the awnings there's nothing but the sound of the sea." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Dövüş, Lonca'nın mangası kapıdan içeri adım atmadan bitiyor. Reis bir dizinin üstünde, şaşkın; avcıları zıpkınlarını yere bırakmış, sana bir insan gibi değil, bir hava olayı gibi bakıyor.", en: "The fight's over before the Guild squad gets through the door. The Harbormaster's down on one knee, stunned, and his hunters have dropped their harpoons. They're looking at you like you're weather, not a person." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Lonca'nın zırhlıları salonu dolduruyor. Mangadan biri Reis'i ensesinden yakalayıp dizlerinin üstüne çöktürüyor ve sana bakıyor. Emir bekliyor.", en: "The Guild's armored squad floods the hall. One of them grabs the Harbormaster by the back of the neck, forces him onto his knees, and looks at you. Waiting for the order." }
        secenekler:
          - id: "infaz"
            etiket: { tr: "Kadimler'e satanların cezasını ver: infaz et", en: "Give him a traitor's sentence. Execute him" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4, insanlik: -5 }
              - bayrak: "capa_ezildi"
              - bayrak: "capa_reisi_infaz"
              - efsane: "acimasiz_infaz_tanikli"
              - degisken: { hayatta_kalan: -2, kadim_tehdit: -3 }
              - itibar: { lonca: 10, siginak: -8 }
              - iliski: { kaya_demir: { saygi: 6, korku: 6 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'nın Reis'ini kendi mezat salonunda, avcılarının önünde infaz ettin; {yer:kiyikent_liman} o günden sonra Lonca'nın bayrağı altında, ama başını hiç kaldırmadan çalıştı.", en: "You executed the Blue Anchor's Harbormaster in his own auction hall, in front of his hunters. After that, {yer:kiyikent_liman} worked under the Guild's banner without ever lifting its head." }
            sonraki: "@akis"
          - id: "hapis"
            etiket: { tr: "Zincire vur ve haddehaneye götür", en: "Put him in irons. Take him to the mill" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -2 }
              - bayrak: "capa_ezildi"
              - itibar: { lonca: 6, siginak: -3 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'nın Reis'ini kendi zinciriyle bağlayıp Lonca'ya teslim ettin; Çapa dağıldı, Reis yaşadı ama bir daha denizi görmedi.", en: "You bound the Blue Anchor's Harbormaster in his own chain and handed him to the Guild. The Anchor broke up. The Harbormaster lived, but he never saw the sea again." }
            sonraki: "@akis"
          - id: "yut"
            etiket: { tr: "\"Bundan sonra benim bayrağımın altındasınız.\"", en: "\"From now on, you're under my banner.\"" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2, merhamet: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 15 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 5, guven: -2 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'yı yendikten sonra dağıtmadın, kendi bayrağının altına aldın; Lonca'nın değil, senin avcıların oldular.", en: "After you beat the Blue Anchor, you didn't break it up. You took it under your own banner. They became your hunters, not the Guild's." }
            sonraki: "@akis"

      - id: "lonca_3_duello"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis teklifini mezat kürsüsünün başında, bütün loncasının önünde dinliyor. Sonra gülüyor; elli yıldır körfezde gemi itmiş bir adamın kocaman, tuzlu gülüşü.", en: "The Harbormaster hears your offer standing at the auction podium, in front of his whole guild. Then he laughs, a big salty laugh from a man who's spent fifty years shoving ships around a bay." }
          - { tr: "\"Kazanırsam Lonca {yer:kiyikent_liman|e} bir daha adım atmaz,\" diyor. \"Kazanırsan Çapa senin bayrağını taşır. Ama benim bayrağımı değil; senin. Kaptanının değil.\" İskelenin en ucuna yürüyor; altında kara, soğuk su.", en: "\"I win, the Guild never sets foot on {yer:kiyikent_liman} again,\" he says. \"You win, the Anchor flies your banner. Yours, mind you. Not your captain's.\" He walks out to the very end of the pier, black cold water underneath." }
        sezgiler:
          - kosul: { stat: { per: 90 } }
            metin: { tr: "Penceresini olduğundan çok daha küçük gösteriyor. Lonca onu ciddiye almamış. Sen alıyorsun; ama yine de senin yanında bir çocuk.", en: "His window is dialed way down. The Guild never took him seriously. You do. Next to you, he's still a kid." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "İskelenin ucuna yürü", en: "Walk out to the end of the pier" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bilgi: "liman_reisi_seviyesi"
              - savas: { dusmanlar: ["liman_reisi@oyuncu+2"], ortam: ["su"], kazan: "lonca_3_duello_sonu", kaybet: "lonca_3_yenilgi", kac: "lonca_3_yenilgi" }
            kronik: { tr: "Mavi Çapa'nın Reis'iyle körfezin üstündeki iskelenin ucunda dövüştün; bütün {yer:kiyikent_liman} sundurmaların altından izledi.", en: "You fought the Blue Anchor's Harbormaster at the end of the pier over the bay, with the whole Waterfront watching from under the awnings." }

      - id: "lonca_3_duello_sonu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis iskelenin tahtalarına çöküyor, zinciri suya kayıyor. Bir süre denize bakıyor; sonra gülüyor, bu sefer daha sessiz.", en: "The Harbormaster sinks onto the pier planks and his chain slides off into the water. He stares at the sea for a while. Then he laughs again, quieter this time." }
          - { tr: "\"Elli yıl,\" diyor. \"Elli yıl gemi ittim. Bir kere de ben itildim.\" Ayağa kalkıp loncasına dönüyor. \"Duydunuz. Bayrağı değiştiriyoruz.\"", en: "\"Fifty years,\" he says. \"Fifty years I pushed ships. Once, I got pushed.\" He gets up and turns to his guild. \"You heard. We're changing flags.\"" }
        secenekler:
          - id: "subayim"
            etiket: { tr: "Reis'i kendi subayın yap", en: "Make the Harbormaster one of your officers" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 20 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Yendiğin Reis'i kendi subayın yaptın; Mavi Çapa Lonca'ya katıldı ama her zaman önce sana selam verdi.", en: "You made the Harbormaster you'd beaten one of your officers. The Blue Anchor joined the Guild, but it always saluted you first." }
            sonraki: "@akis"
          - id: "limani_birak"
            etiket: { tr: "\"{yer:kiyikent_liman} sizin kalsın; yalnızca kayıt olun.\"", en: "\"Keep your docks. Just register.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1, insanlik: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 10 }
              - itibar: { lonca: 4, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -2 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Düelloyu kazandın ama {yer:kiyikent_liman|i} Çapa'ya bıraktın; Tek Bayrak kâğıtta yazıldı, {yer:kiyikent_liman|de} ise eski bayrak dalgalanmaya devam etti.", en: "You won the duel but left the docks to the Anchor. One Banner got written down on paper. Down on {yer:kiyikent_liman}, the old flag kept flying." }
            sonraki: "@akis"

      - id: "lonca_3_aura"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mezat salonunun kapısını kırmıyorsun; açıyorsun. Elli avcı zıpkınlarını kaldırıyor. Bir adım atıyorsun ve zıpkınların uçları, sanki çok ağırlaşmış gibi, birer birer aşağı iniyor.", en: "You don't break the auction hall doors. You open them. Fifty hunters raise their harpoons. You take one step, and the harpoon points start dipping one by one, like they've suddenly gotten too heavy to hold." }
          - { tr: "Kimse silahını çekemiyor. Reis kürsünün arkasında ayakta durmaya çalışıyor; dizleri onu dinlemiyor. Salonun içinde yalnızca denizin ve kendi nefeslerinin sesi var.", en: "Nobody can draw. The Harbormaster's trying to stay on his feet behind the podium, and his knees won't listen. The only sounds in the hall are the sea and their own breathing." }
          - { tr: "Mezat kürsüsüne yürüyorsun ve üstüne Lonca'nın turuncu yamasını bırakıyorsun. Bir şey söylemene gerek yok.", en: "You walk up to the auction podium and set the Guild's orange patch on top of it. You don't need to say a thing." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Mavi Çapa: teslim oldu]", en: "[The Blue Anchor: surrendered]" }
            satirlar:
              - { tr: "Çatışma: 0. Kayıp: 0. Gözlemlenen tepki: korku (%94).", en: "Engagements: 0. Casualties: 0. Observed response: fear (94%)." }
        secenekler:
          - id: "yama"
            etiket: { tr: "Hepsinin koluna yamayı diktir", en: "Have every one of them sew on the patch" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 25 }
              - itibar: { lonca: 12 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
              - xp_seviye: 90
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'nın elli avcısının koluna turuncu yamayı diktirdin; hiçbiri bir daha senden başka birine bakarak savaşmadı.", en: "You had every one of the Blue Anchor's fifty hunters sew on the orange patch. None of them ever fought looking to anybody but you again." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Yamayı kürsüde bırak ve çık", en: "Leave the patch on the podium and walk out" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2, insanlik: -1 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 15 }
              - itibar: { lonca: 8 }
              - xp_seviye: 80
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Yamayı Mavi Çapa'nın kürsüsünde bırakıp çıktın; ertesi sabah {yer:kiyikent_liman|in} bütün avcıları haddehanenin önünde sıraya girmişti.", en: "You left the patch on the Blue Anchor's podium and walked out. The next morning, every hunter on {yer:kiyikent_liman} was lined up outside the rolling mill." }
            sonraki: "@akis"

      - id: "lonca_3_ihbar"
        yer: "sanayi"
        paragraflar:
          - { tr: "İhbarın mürekkebi Defterdar'ın kalemi; kâğıt Lonca'nın kâğıdı. On dört isimden yalnızca birinin satışı gerçek: kule kristallerini bir Kadim simsarına satan, borca batmış tek bir zıpkıncı.", en: "The ink is the Ledger's pen, and the paper is Guild paper. Of the fourteen names, only one sale is real: a single harpooner, buried in debt, who sold Spire crystals to an Ancient broker." }
          - metin: { tr: "Defterdar'ı arşivde buluyorsun. Yüzünü kaldırmıyor. \"Emri Başçavuş verdi,\" diyor. \"Tek bir adam bir loncayı dağıtmaya yetmez, dedi. On dört adam yeter.\"", en: "You find the Ledger in the archive. She doesn't look up. \"The Gunny gave the order,\" she says. \"One man isn't enough to break a guild, he said. Fourteen is.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Defterdar'ı arşivde buluyorsun. Yüzünü kaldırmıyor. \"Konsey istedi,\" diyor. \"Tek bir adam bir loncayı dağıtmaya yetmez. On dört adam yeter.\"", en: "You find the Ledger in the archive. She doesn't look up. \"The council wanted it,\" she says. \"One man isn't enough to break a guild. Fourteen is.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Sahte ihbarı Pano'nun önünde ifşa et", en: "Expose the forged tip in front of the Board" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2, merhamet: 2 }
              - bayrak: "capa_adalet"
              - itibar: { lonca: 2, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: -6 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Lonca'nın sahte ihbarını Pano'nun önünde ifşa ettin; meritokrasinin kendi kuralı, 'Pano'da yalan olmaz', ilk kez onu yazanlara karşı işledi.", en: "You exposed the Guild's forged tip in front of the Board. The meritocracy's own rule, 'no lies on the Board,' worked against the people who wrote it for the first time." }
            sonraki: "lonca_3_adalet"
          - id: "koz"
            etiket: { tr: "Bunu sakla; kozun olsun", en: "Keep it to yourself. Hold it as leverage" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - bayrak: "kaya_sirri_elde"
              - bayrak: "capa_adalet"
              - itibar: { lonca: 4 }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Lonca'nın sahte ihbarını kimseye söylemedin, cebinde bir koz olarak tuttun; bir gün o kâğıdı masaya koyacağını ikiniz de biliyordunuz.", en: "You didn't tell anyone about the Guild's forged tip. You kept it in your pocket as leverage. Both of you knew you'd put that paper on the table someday." }
            sonraki: "lonca_3_adalet"
          - id: "yalniz_suclu"
            etiket: { tr: "Yalnızca gerçek satıcıyı tutukla", en: "Arrest only the man who actually sold" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "capa_adalet"
              - degisken: { kadim_tehdit: -2 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 70
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "On dört isimlik ihbardan yalnızca suçlu olan tek adamı tutukladın; Lonca bir loncayı yutamadı ama bir haini yakaladı.", en: "Out of fourteen names on the tip, you arrested only the one man who was actually guilty. The Guild didn't get to swallow a guild, but it did catch a traitor." }
            sonraki: "lonca_3_adalet"

      - id: "lonca_3_adalet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ertesi gün Reis haddehaneye kendisi geliyor; omzunda halatı yok, elinde Mavi Çapa'nın kayıt defteri var. \"Duyduk,\" diyor. \"Bir adamımızı sattınız. On üçünü kurtardınız.\"", en: "The next day the Harbormaster shows up at the mill himself. No tug line on his shoulder this time, just the Blue Anchor's register in his hand. \"We heard,\" he says. \"You gave up one of ours. You saved thirteen.\"" }
          - { tr: "Defteri masaya koyuyor. \"Tek Bayrak'a imza atıyoruz. Lonca'nın değil, senin imzan altında.\"", en: "He sets the register on the table. \"We'll sign One Banner. Under your signature. Not the Guild's.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Defteri kabul et", en: "Accept the register" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 20 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Mavi Çapa kendi kayıt defterini sana getirdi; {yer:kiyikent_liman} Lonca'ya korkuyla değil, sana duyduğu güvenle katıldı.", en: "The Blue Anchor brought you its own register. The Waterfront joined the Guild out of trust in you, not fear." }
            sonraki: "@akis"

      - id: "lonca_3_uyari"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı {yer:kiyikent_liman|e} tek başına iniyorsun. Reis seni mezat salonunun arka kapısında karşılıyor ve seni dinlerken hiç konuşmuyor.", en: "At midnight you go down to {yer:kiyikent_liman} alone. The Harbormaster meets you at the back door of the auction hall and doesn't say a word while you talk." }
          - { tr: "Şafaktan önce Mavi Çapa'nın teknelerinin hepsi ışıksız, sessizce körfezden çıkıyor. Lonca'nın mangası sabah salona girdiğinde içeride yalnızca tuz, ağlar ve boş bir kürsü buluyor.", en: "Before dawn, every one of the Blue Anchor's boats slips out of the bay, lights off, dead quiet. When the Guild squad hits the hall in the morning, all they find is salt, nets and an empty podium." }
          - { tr: "{npc:kaya_demir} boş salonun ortasında duruyor ve sana bakıyor. \"Biri onları önceden duymuş,\" diyor.", en: "{npc:kaya_demir} stands in the middle of the empty hall and looks at you. \"Somebody heard us coming,\" he says." }
        secenekler:
          - id: "yalan"
            etiket: { tr: "\"Ben vardığımda salon zaten boştu.\"", en: "\"The hall was already empty when I got here.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2, insanlik: -1 }
              - yalan: { npc: "kaya_demir", konu: "capa_kacis_yalani" }
              - bayrak: "capa_kacti"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'yı kurtarmak için {npc:kaya_demir|e} yüzüne bakarak yalan söyledin; o yalan bir gün masaya geri döndü.", en: "To save the Blue Anchor you lied to {npc:kaya_demir|pos} face. Someday that lie came back to the table." }
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "\"Onları ben uyardım.\"", en: "\"I warned them.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - bayrak: "capa_kacti"
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { guven: 4, saygi: 4, baglilik: -4 } }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'yı uyardığını {npc:kaya_demir|e} açıkça söyledin; uzun süre baktı, sonra 'En azından yalan söylemedin' dedi.", en: "You told {npc:kaya_demir} straight out that you'd warned the Blue Anchor. He stared at you a long time, then said, 'At least you didn't lie.'" }
            sonraki: "@akis"

      - id: "lonca_3_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kontrol kabininde kimse konuşmuyor. Subayların bir kısmı sana, bir kısmı haritaya bakıyor; Defterdar kalemini bırakmış.", en: "Nobody in the control booth says a word. Some of the officers look at you, some at the map. The Ledger's set her pen down." }
          - metin: { tr: "\"Meritokraside en güçlü olan emir verir,\" diyor {npc:kaya_demir} sonunda, sesini yükseltmeden. \"Sen emir vermiyorsun, emir reddediyorsun. Ya bu Lonca'yı yönetmeye hazırsın ya da onun dışındasın.\"", en: "\"In a meritocracy, the strongest gives the orders,\" {npc:kaya_demir} finally says, without raising his voice. \"You're not giving orders. You're refusing them. Either you're ready to run this Guild, or you're outside it.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyinin en yaşlısı yavaşça ayağa kalkıyor. \"Başçavuş derdi ki: güçlü olan ya emir verir ya çekilir.\"", en: "The oldest officer on the council slowly stands up. \"The Gunny used to say: the strong either give orders or get out of the way.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "capa_yaninda"
            etiket: { tr: "{yer:kiyikent_liman|e} git ve Çapa'nın yanında dur", en: "Go to {yer:kiyikent_liman}. Stand with the Anchor" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: 4, insanlik: 3 }
              - bayrak: "lonca_dusmani"
              - bayrak: "capa_kacti"
              - itibar: { lonca: -25, siginak: 6 }
              - iliski: { kaya_demir: { guven: -10, saygi: 4 } }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "Lonca'nın emrini reddedip Mavi Çapa'nın yanında durdun; o günden sonra {yer:sanayi|in} kapıları sana kapandı ve {yer:kiyikent_liman} sana açıldı.", en: "You refused the Guild's order and stood with the Blue Anchor. After that, {yer:sanayi}' doors closed to you and {yer:kiyikent_liman|pos} opened." }
            sonraki: "@akis"
          - id: "geri_don"
            etiket: { tr: "\"Peki. O zaman emri ben veririm.\"", en: "\"Fine. Then I'll give the order.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Mavi Çapa emrini bir kez reddettin, sonra emri kendin vermek için geri döndün.", en: "You refused the Blue Anchor order once, then came back to give the order yourself." }
            sonraki: "lonca_3_rakip_bastirma_1"

      - id: "lonca_3_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Reis'in çapası iskelenin tahtalarını parçalıyor ve sen körfezin soğuk suyuna gömülüyorsun. Seni sudan Lonca'nın zırhlıları çıkarıyor.", en: "The Harbormaster's anchor smashes through the pier planks and you go under into the cold bay. It's the Guild's armored squad that fishes you out." }
          - { tr: "Kıyıda Reis bekliyor, zinciri omzunda. \"{yer:kiyikent_liman} bugün bizim,\" diyor. \"Ama sen buraya bir askerden fazlası olarak geldin; bunu gördüm. Masaya otururuz.\"", en: "The Harbormaster's waiting on the shore, chain over his shoulder. \"Waterfront's ours today,\" he says. \"But you came down here as more than a soldier. I saw that. We'll sit down and talk.\"" }
        secenekler:
          - id: "masa"
            etiket: { tr: "Masaya otur", en: "Sit down and talk" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - bayrak: "capa_adalet"
              - itibar: { lonca: 2, siginak: 2 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'nın Reis'ine yenildin ve onunla masaya oturdun; {yer:kiyikent_liman} Lonca'ya bir anlaşmayla, kendi şartlarıyla katıldı.", en: "The Blue Anchor's Harbormaster beat you, and you sat down at the table with him. The Waterfront joined the Guild by treaty, on its own terms." }
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "Mangayı topla ve gece yeniden saldır", en: "Regroup the squad and hit them again tonight" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -4 }
              - savas: { dusmanlar: ["capa_avcisi@dunya", "liman_reisi@oyuncu+1"], ortam: ["su", "karanlik"], kazan: "lonca_3_baskin_sonu", kaybet: "lonca_3_yenilgi_son" }
            kronik: { tr: "Mavi Çapa'ya yenildiğin gece mangayı toplayıp yeniden saldırdın.", en: "The same night the Blue Anchor beat you, you regrouped the squad and went back in." }

      - id: "lonca_3_yenilgi_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İkinci kez de suya gömülüyorsun. Bu sefer seni Reis'in kendisi çıkarıyor ve iskeleye bırakıyor.", en: "You go under a second time. This time it's the Harbormaster himself who pulls you out and drops you on the pier." }
          - { tr: "\"Yeter,\" diyor. \"Kayıt olacağız. Ama bunu senin yüzünden değil, bu inadın yüzünden yapıyoruz.\"", en: "\"Enough,\" he says. \"We'll register. But not because of you. Because of how damn stubborn you are.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bayrak: "capa_yutuldu"
              - ordu: { lonca_avcisi: 10 }
              - xp_seviye: 50
              - bayrak: "lonca_3_tamam"
              - tohum: { olay: "lonca_4_demir_yasa", gecikme: { min: 15, max: 30 }, kosul: { bayrak: "lonca_3_tamam", perde: 3 } }
            kronik: { tr: "Mavi Çapa'ya iki kez yenildin ve sonunda inadınla kazandın; {yer:kiyikent_liman|de} hâlâ 'o suya iki kez giren subay' diye anlatılırsın.", en: "The Blue Anchor beat you twice, and you won anyway on sheer stubbornness. On {yer:kiyikent_liman}, you're still 'the officer who went into the water twice.'" }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 4 — DEMİR YASA (P3)
  - id: "lonca_4_demir_yasa"
    perde: [3]
    gun: { min: 205, max: 318 }
    kosul: { bayrak: "lonca_3_tamam", bayrak_yok: ["lonca_dusmani", "lonca_4_tamam"] }
    agirlik: 9
    etiketler: ["lonca", "zincir", "ahlak", "yasa"]
    gerilim: 3
    onemli: true
    kart: { tr: "Demir Yasa", en: "The Iron Law" }
    sahne: "lonca_4_demir_yasa_1"
    sahneler:
      - id: "lonca_4_demir_yasa_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Harekât odasının masasında bir kâğıt değil, bir çelik levha duruyor. Üstüne yedi madde kazınmış; harfleri döküm ustaları tek tek çekiçle vurmuş. Başlıkta iki kelime: DEMİR YASA.", en: "On the operations room table there's no sheet of paper. There's a steel plate, with seven articles stamped into it, every letter hammered in by the casters. Two words across the top: IRON LAW." }
          - { tr: "Bir: seviyesi ellinin üstündeki her uyanmış, Lonca'nın Kule ve kapı nöbetine yazılır. İki: bütün mahallelerde tayın katkıya göre dağıtılır. Üç: sokağa çıkma yasağı. Dört: Konsey'in oylamaları 'savaş süresince' askıya alınır. Beş: Kadimler'le ticaret ihanettir.", en: "One: every awakened person above level fifty gets assigned to the Guild's Spire and Gate rotation. Two: rations in every district go out by contribution. Three: curfew. Four: Council votes are suspended 'for the duration.' Five: trading with the Ancients is treason." }
          - { tr: "Altı boş bırakılmış. Yedinci madde herkesinkinden küçük harflerle kazınmış: 'Bu yasanın bir maddesi, en güçlü olanın kararıyla askıya alınabilir.'", en: "Six has been left blank. The seventh article is stamped in smaller letters than the rest: 'Any one article of this law may be suspended by decision of the strongest.'" }
          - metin: { tr: "{npc:kaya_demir} levhayı sana çeviriyor. \"Bu şehir benim adıma değil, senin adına itaat eder,\" diyor. \"Altına senin adın kazınacak. Yasanın kalemi sen olacaksın.\"", en: "{npc:kaya_demir} turns the plate toward you. \"This city won't obey my name,\" he says. \"It'll obey yours. Your name goes on the bottom. You're the pen of this law.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Altıncı madde senin,\" diye ekliyor. \"Lojmanlar gecesinde bana bir şey öğrettin. Onu yaz.\"", en: "\"Article six is yours,\" he adds. \"You taught me something the night of the company houses. Write it down.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak: "kaya_akil_hocasi" }
          - metin: { tr: "Subay konseyi levhayı sana uzatıyor. \"Şehir bizim adımıza değil, senin adına itaat eder,\" diyor en yaşlıları. \"Altına senin adın kazınacak.\"", en: "The officer council slides the plate over to you. \"This city won't obey us,\" the oldest of them says. \"It'll obey you. Your name goes on the bottom.\"" }
            kosul: { npc_olu: "kaya_demir" }
          - metin: { tr: "Kule'nin elli katının ardında açılan geçitten her gün yeni bir şey geliyor; yabancı tüccarlar, yabancı hastalıklar, yabancı canavarlar. Şehir bir kuralı, herhangi bir kuralı istiyor.", en: "Every day something new comes through the passage past the Spire's fiftieth floor: foreign traders, foreign diseases, foreign monsters. The city wants a rule. Any rule." }
            kosul: { bayrak: "cok_evren_acik" }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Yedinci madde bir boşluk değil; bir anahtar. Yasanın tamamı, en güçlünün iznine bağlanmış. En güçlünün kim olduğu ise yasada yazmıyor; yazmasına gerek yok.", en: "The seventh article isn't a loophole. It's a key. The whole law hangs on the strongest one's say-so. The law never says who the strongest is. It doesn't need to." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷edinci madde. yırtılabilir köşe. senin için bırakılmış, biliyorsun. bütün yasa senin bir istisna olman için yazılmış.", en: "a̷rticle seven. the corner that tears. it was left for you, you know that. the whole law was written so that you could be the exception." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dördüncü madde benim konseyim. Bunu imzalarsan, bunu bana yaparsın.\"", en: "\"Article four is my council. Sign this, and you're doing it to me.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Elli seviye. Ben elli seviyenin üstündeyim. Beni de yazacaklar, değil mi?\"", en: "\"Level fifty. I'm over fifty. They'd draft me too, wouldn't they?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Telsiz yayınları bu yasaya göre 'izinsiz iletişim' sayılır. Biz burada yasal değiliz.\"", en: "\"Under this, radio broadcasts count as 'unauthorized communication.' We're not legal anymore.\"" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "Yasayı olduğu gibi imzala", en: "Sign the law as written" }
            etkiler:
              - ahlak: { duzen: 8, insanlik: -4, merhamet: -3 }
              - bayrak: "demir_yasa_yururlukte"
              - itibar: { lonca: 8, siginak: -8, sessiz_ag: -4 }
              - iliski: { kaya_demir: { saygi: 5, baglilik: 5 } }
            kronik: { tr: "Demir Yasa'yı olduğu gibi imzaladın; {yer:kiyikent} sıkıyönetimle tanıştı ve sokaklar senin adınla kapanıp açıldı.", en: "You signed the Iron Law as written. {yer:kiyikent} met martial law, and its streets opened and closed in your name." }
            sonraki: "lonca_4_ilan"
          - id: "sert"
            etiket: { tr: "Daha sert yaz: ihanetin cezası ölüm, istisnasız", en: "Make it harder: death for treason, no exceptions" }
            etkiler:
              - ahlak: { duzen: 10, merhamet: -8, insanlik: -6 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_sert"
              - unvan: "demir_yasa_kalemi"
              - degisken: { kadim_tehdit: -4 }
              - itibar: { lonca: 12, siginak: -12, sessiz_ag: -6 }
              - iliski: { kaya_demir: { saygi: 6, korku: 4 } }
            kronik: { tr: "Demir Yasa'yı kendi elinle daha sert yazdın: ihanete istisnasız ölüm; Kadimler'in simsarları körfezden çekildi, darağaçları ise kurulu kaldı.", en: "You rewrote the Iron Law harder with your own hand: death for treason, no exceptions. The Ancient brokers pulled out of the bay. The gallows stayed up." }
            sonraki: "lonca_4_ilan"
          - id: "muafiyet"
            etiket: { tr: "Altıncı maddeyi yaz: çocuklar, yaşlılar, hekimler muaf", en: "Write article six: kids, elderly and medics exempt" }
            gerekli: { stat: { cha: 120 } }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 5 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_muafiyet"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 6, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 }, elif_sari: { saygi: 4 } }
            kronik: { tr: "Demir Yasa'nın boş altıncı maddesine bir muafiyet kazıttın; yasa sertti ama çocuklara, yaşlılara ve hekimlere dokunmadı.", en: "You had an exemption stamped into the Iron Law's blank sixth article. The law was hard, but it never touched kids, the elderly or medics." }
            sonraki: "lonca_4_ilan"
          - id: "cekirdek"
            tur: "gosteris"
            etiket: { tr: "Yasayı Kasaba Çekirdeği'ne kendi elinle yaz", en: "Write the law into the Town Core yourself" }
            goster: { bayrak: "cekirdek_lonca" }
            gerekli: { stat: { int: 160 } }
            etkiler:
              - ahlak: { duzen: 8, insanlik: -6 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_sistemde"
              - unvan: "demir_yasa_kalemi"
              - dikkat: 6
              - itibar: { lonca: 12, siginak: -6 }
              - iliski: { kaya_demir: { saygi: 8, korku: 6 }, yanki: { guven: 4 } }
            kronik: { tr: "Demir Yasa'yı Kasaba Çekirdeği'ne kendi elinle yazdın; o günden sonra yasayı insanlar değil, Sistem uyguladı ve itiraz edecek kimse kalmadı.", en: "You wrote the Iron Law into the Town Core with your own hand. From then on the System enforced it, not people, and there was no one left to appeal to." }
            sonraki: "lonca_4_sistem"
          - id: "yirt"
            etiket: { tr: "Taslağı al ve onun önünde yırt", en: "Take the draft and tear it in front of him" }
            goster: { bilgi: "kaya_yirtilan_emir", npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: -8, insanlik: 4, merhamet: 2 }
              - bayrak: "kaya_yasa_yirtildi"
              - iliski: { kaya_demir: { saygi: 8, guven: -6 } }
            kronik: { tr: "Demir Yasa'nın kâğıt taslağını {npc:kaya_demir|in} önünde ikiye yırttın, tıpkı onun yıllar önce bir emri yırttığı gibi.", en: "You tore the paper draft of the Iron Law in half in front of {npc:kaya_demir}, the same way he once tore up an order." }
            sonraki: "lonca_4_yirt"
          - id: "reddet"
            etiket: { tr: "\"Adımı bunun altına koymam.\"", en: "\"My name doesn't go on this.\"" }
            etkiler:
              - ahlak: { duzen: -6, insanlik: 4 }
              - iliski: { kaya_demir: { saygi: -2, guven: -4 } }
            kronik: { tr: "Demir Yasa'nın altına adını koymayı reddettin.", en: "You refused to put your name on the Iron Law." }
            sonraki: "lonca_4_red"

      - id: "lonca_4_sistem"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Kasaba Çekirdeği'nin önünde elini ışığın içine sokuyorsun. Sistem'in satırları parmaklarının etrafında akıyor; Demir Yasa'nın yedi maddesini birer birer yazıyorsun ve her biri, şehrin her penceresinde aynı anda beliriyor.", en: "In front of the Town Core, you push your hand into the light. The System's lines flow around your fingers, and you write the seven articles of the Iron Law one by one. Each one shows up in every window in the city at the same time." }
          - { tr: "{yer:kiyikent|in} sokaklarında yüz binlerce insan aynı anda duruyor ve önlerinde açılan pencereyi okuyor.", en: "On the streets of {yer:kiyikent}, hundreds of thousands of people stop at the same moment and read the window that just opened in front of them." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bölge yasası güncellendi: DEMİR YASA]", en: "[District law updated: IRON LAW]" }
            satirlar:
              - { tr: "Yetki: Kasaba Çekirdeği · Yazan: {oyuncu}", en: "Authority: Town Core · Author: {oyuncu}" }
              - { tr: "Madde 7 yetkilisi: {oyuncu}", en: "Article 7 authority: {oyuncu}" }
          - tur: "yanki"
            baslik: { tr: "b̷unu sistemin diliyle yazdın.", en: "y̷ou wrote this in the system's language." }
            satirlar:
              - { tr: "çok iyi yazdın. bu beni korkutuyor.", en: "you wrote it very well. that scares me." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kule Dibi'ne in; ilanı izle", en: "Go down to {yer:kule_dibi}. Watch it land" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
            kronik: { tr: "Yasayı Sistem'e yazdıktan sonra Kule Dibi'ne inip şehrin onu okumasını izledin.", en: "After you wrote the law into the System, you went down to {yer:kule_dibi} to watch the city read it." }
            sonraki: "lonca_4_ilan"

      - id: "lonca_4_ilan"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Demir Yasa {yer:kule_dibi|in} meydanında, Kule'nin gölgesinde okunuyor. Kalabalık sessiz; kimse alkışlamıyor, kimse yuhalamıyor. Lonca'nın zırhlıları meydanın dört köşesinde.", en: "The Iron Law gets read out on {yer:kule_dibi}, in the shadow of the Spire. The crowd is quiet. Nobody cheers. Nobody boos. Guild armor stands at all four corners of the square." }
          - { tr: "İlk uygulama hemen geliyor. Seferberlik listesinin ilk adı, Seviye 52 bir lise öğrencisi. Annesi oğlunun kolunu tutmuş, Lonca'nın çavuşuna bırakmıyor; sonra sana dönüyor, çünkü herkes sana dönüyor.", en: "The first enforcement comes right away. The first name on the draft list is a level fifty-two high school kid. His mother has hold of his arm and won't let the Guild sergeant take him. Then she turns to you, because everybody turns to you." }
          - metin: { tr: "Meydanın kenarındaki darağacı yeni; tahtası henüz kurumamış.", en: "The gallows at the edge of the square is new. The wood hasn't even dried yet." }
            kosul: { bayrak: "demir_yasa_sert" }
          - metin: { tr: "Meydandaki herkesin önünde aynı pencere açık: [DEMİR YASA · Madde 1]. Çocuğun penceresinde ise bir satır daha: [Görev atandı: Kule nöbeti].", en: "Everyone on the square has the same window open: [IRON LAW · Article 1]. The kid's window has one more line: [Assignment: Spire rotation]." }
            kosul: { bayrak: "demir_yasa_sistemde" }
        secenekler:
          - id: "uygula"
            etiket: { tr: "\"Yasa yasadır.\" Çocuğu nöbete yaz", en: "\"The law is the law.\" Put the kid on rotation" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 } }
            kronik: { tr: "Demir Yasa'nın ilk gününde bir annenin elinden oğlunu alıp Kule nöbetine yazdın; o çocuk Kule'nin altmışıncı katına kadar çıktı.", en: "On the Iron Law's first day you took a boy from his mother's hands and put him on Spire rotation. That kid made it all the way to the sixtieth floor." }
            sonraki: "@akis"
          - id: "istisna"
            etiket: { tr: "Yedinci maddeyi kullan: çocuğu muaf tut", en: "Use article seven. Exempt the kid" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2, insanlik: -2 }
              - itibar: { lonca: 2, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -2 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 } }
            kronik: { tr: "Demir Yasa'nın ilk gününde yedinci maddeyi kullanıp bir çocuğu muaf tuttun; şehir o gün yasanın tek bir gerçek istisnası olduğunu öğrendi: sen.", en: "On the Iron Law's first day you used article seven to exempt one kid. That day the city learned the law only had one real exception: you." }
            sonraki: "@akis"
          - id: "nutuk"
            tur: "gosteris"
            etiket: { tr: "Meydana konuş; gönüllüleri sen çağır", en: "Address the square. Call for volunteers yourself" }
            gerekli: { stat: { cha: 140 } }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3, merhamet: 2 }
              - ordu: { lonca_avcisi: 30 }
              - degisken: { hayatta_kalan: 2 }
              - dikkat: 4
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
              - xp_seviye: 100
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 } }
            kronik: { tr: "Demir Yasa'nın ilk gününde meydana konuştun ve seferberlik listesi gönüllülerle doldu; o çocuğun adı listeye hiç yazılmadı, çünkü önünde üç yüz kişi vardı.", en: "On the Iron Law's first day you spoke to the square and the draft list filled up with volunteers. That kid's name never made the list. There were three hundred people ahead of him." }
            sonraki: "@akis"

      - id: "lonca_4_yirt"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çelik levhanın yanında duran kâğıt taslağı alıyorsun ve yavaşça, ikiye yırtıyorsun. Ses odanın içinde bir silah kadar yüksek.", en: "You pick up the paper draft sitting next to the steel plate and slowly tear it in half. In that room, it sounds as loud as a gunshot." }
          - metin: { tr: "{npc:kaya_demir} yırtılan kâğıda bakıyor ve yüzünde bir şey çöküyor; öfke değil. Bir adamın kendi gençliğini karşısında görmesi. \"Kırk iki kişi,\" diyor çok alçak sesle. \"Senin kırk iki kişin kim?\"", en: "{npc:kaya_demir} stares at the torn paper and something on his face caves in. Not anger. A man looking at his own younger self. \"Forty-two people,\" he says, very quietly. \"Who are your forty-two?\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Subay konseyi donup kalıyor. Defterdar yırtılan kâğıdın iki yarısını yerden alıp masaya, yan yana koyuyor; sanki birleşip birleşmeyeceğini görmek istiyor.", en: "The officer council freezes. The Ledger picks both halves of the paper up off the floor and lays them side by side on the table, like she wants to see if they'll fit back together." }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "\"Yeniden yazalım. Bu sefer köşesi şehrin olsun.\"", en: "\"Let's rewrite it. This time the city holds the corner.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 4, insanlik: 2 }
              - bayrak: "demir_yasa_yururlukte"
              - bayrak: "demir_yasa_muafiyet"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 6, siginak: 6 }
              - iliski: { kaya_demir: { guven: 8, baglilik: 6 } }
              - xp_seviye: 80
              - bayrak: "lonca_4_tamam"
              - bayrak: "lonca_5_acik"
              - tohum: { olay: "kaya_darbe_gecesi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi", perde: 3 } }
            kronik: { tr: "Demir Yasa'yı yırttın ve {npc:kaya_demir|le} birlikte yeniden yazdın; yedinci maddenin yırtılabilir köşesi o günden sonra en güçlünün değil, şehrin elindeydi.", en: "You tore up the Iron Law and rewrote it with {npc:kaya_demir}. From then on, article seven's tearable corner belonged to the city, not to the strongest." }
            sonraki: "@akis"
          - id: "cik"
            etiket: { tr: "Yırtık kâğıdı masada bırak ve çık", en: "Leave the torn paper on the table and walk out" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_yasa_reddedildi"
              - itibar: { lonca: -12, siginak: 6 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
            kronik: { tr: "Demir Yasa'yı yırtıp Lonca'dan çıktın; yasa yine de yürürlüğe girdi, ama altında senin adın yoktu.", en: "You tore up the Iron Law and walked out of the Guild. The law went into effect anyway, but your name was never on it." }
            sonraki: "@akis"

      - id: "lonca_4_red"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "\"O zaman ben imzalarım,\" diyor {npc:kaya_demir}. \"Ve bu şehir bana neden senin adının altında olmadığını sorduğunda, onlara söylerim.\" Kalemi alıyor ve bir an bekliyor; belki fikrini değiştirirsin diye.", en: "\"Then I sign it,\" {npc:kaya_demir} says. \"And when this city asks me why your name isn't on it, I'll tell them.\" He picks up the stylus and waits a beat. Maybe you'll change your mind." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"O zaman konsey imzalar,\" diyor en yaşlı subay. \"Ama şehir bize değil, sana bakıyor. Senin adın olmadan bu yasa bir kâğıttan ibaret.\"", en: "\"Then the council signs,\" the oldest officer says. \"But the city isn't looking at us. It's looking at you. Without your name, this law is just a piece of paper.\"" }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "Kalemi al ve imzala", en: "Take the stylus and sign" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - bayrak: "demir_yasa_yururlukte"
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "Demir Yasa'yı bir kez reddettin, sonra kalemi alıp imzaladın.", en: "You refused the Iron Law once, then took the stylus and signed it." }
            sonraki: "lonca_4_ilan"
          - id: "git"
            etiket: { tr: "\"İmzala. Ben gidiyorum.\"", en: "\"Sign it. I'm leaving.\"" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: 3 }
              - bayrak: "lonca_yasa_reddedildi"
              - itibar: { lonca: -10, siginak: 4 }
              - iliski: { kaya_demir: { guven: -4, saygi: -2 } }
            kronik: { tr: "Demir Yasa'yı imzalamayı reddedip Lonca'yı bıraktın; yasa senin adın olmadan yürürlüğe girdi ve şehir ona hiçbir zaman tam olarak inanmadı.", en: "You wouldn't sign the Iron Law, and you left the Guild. The law went into effect without your name, and the city never fully believed in it." }
            sonraki: "@akis"

  # ================================================================== KAYA — DARBE GECESİ (P3, AY 292)
  - id: "kaya_darbe_gecesi"
    perde: [3]
    gun: { min: 240, max: 299 }
    ana_yay: { gun: 292 }
    kosul: { bayrak_yok: ["kaya_devrildi", "lonca_cozuldu"], degisken_min: { kaya_tanidik: 1 }, gun_max: 299 }
    agirlik: 9
    etiketler: ["lonca", "npc", "ahlak", "darbe"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Darbe gecesi", en: "The night before the coup" }
    sahne: "kaya_darbe_gecesi_1"
    sahneler:
      - id: "kaya_darbe_gecesi_1"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Gece yarısı kapın çalınıyor. Örs, balyozu omzunda, sesini alçaltarak konuşuyor: \"Başçavuş bir şey hazırlıyor. Görmen lazım. Bunu sana borçluydum.\"", en: "Somebody knocks at midnight. It's Anvil, sledge on his shoulder, keeping his voice down. \"Gunny's getting something ready. You need to see it. I owed you this.\"" }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Gece yarısı turuncu yamalı bir koşucu seni buluyor. Bu sefer soluk soluğa değil; sakin, resmî. \"Başçavuş sizi haddehanede bekliyor. Yalnız gelin.\"", en: "At midnight, an orange-patched runner finds you. Not out of breath this time. Calm. Formal. \"The Gunny's expecting you at the mill. Come alone.\"" }
            kosul: { bayrak_yok: "ors_borclu" }
          - { tr: "Haddehane ışıl ışıl. Vinçlerin altında iki zırhlı kol hazır bekliyor: kapı zırhlı avcılar, Döküm'den yeni çıkmış tüfekler, sac kaplı kamyonlar. Kimse konuşmuyor. Herkes bir emir bekliyor.", en: "The mill's lit up like a stadium. Under the cranes, two armored columns stand ready: hunters in Gate armor, rifles fresh out of the Foundry, trucks plated in ship steel. Nobody's talking. Everybody's waiting on an order." }
          - { tr: "{npc:kaya_demir} ambar kapağı masasında, haritanın başında. Harita değişmiş: {yer:kasaba_cekirdegi} kırmızıyla daire içinde, yanında 'Sonra' yazmıyor artık. 'Şafak' yazıyor. Konsey binasının üstünde de bir çarpı.", en: "{npc:kaya_demir} is at the hatch-cover table, over the map. The map's changed. {yer:kasaba_cekirdegi} is still circled in red, but next to it, it doesn't say 'Later' anymore. It says 'Dawn.' There's an X over the Council building." }
          - { tr: "\"Sistem'in geri sayımı altmış beşi gösterdiği sabah,\" diyor. \"Kadimler körfezde. Konsey onlarla masaya oturmak için oylama yapıyor. Altmış beş günümüz var ve ben bu şehri bir komiteye bırakmayacağım.\" Başını kaldırıyor. \"Kan dökülmeyecek. Gerekmedikçe.\"", en: "\"The morning the System countdown hits sixty-five,\" he says. \"The Ancients are in the bay. The Council's voting on whether to sit down at a table with them. We've got sixty-five days, and I'm not leaving this city to a committee.\" He looks up. \"No bloodshed. Unless necessary.\"" }
          - metin: { tr: "\"Söyle bana yanıldığımı,\" diyor sonra, daha alçak sesle. \"Sen söylersen inanırım. Başka kimse söylerse inanmam.\"", en: "\"Tell me I'm wrong,\" he says then, lower. \"If you say it, I'll believe it. Anybody else says it, I won't.\"" }
            kosul: { bayrak: "kaya_akil_hocasi" }
          - metin: { tr: "\"İkinci kolu sen yöneteceksin,\" diyor. \"Konsey binası senin. Benden sonra bu masa senin olacaktı; belki biraz erken olur.\"", en: "\"You're leading the second column,\" he says. \"The Council building is yours. This table was going to be yours after me. Maybe it comes a little early.\"" }
            kosul: { degisken_min: { lonca_rutbe: 3 }, bayrak_yok: "kaya_akil_hocasi" }
          - metin: { tr: "Örs, Başçavuş'un arkasında duruyor. Balyozunu iki eliyle tutuyor ve sana bakmıyor.", en: "Anvil stands behind the Gunny, both hands on his sledge, not looking at you." }
            kosul: { bayrak: "ors_kin" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Zırhlı kollardaki avcıların yarısı sana bakıyor, Başçavuş'a değil. Bir emir verirsen hangisine uyacaklarını onlar da bilmiyor.", en: "Half the hunters in those armored columns are looking at you, not the Gunny. If you give an order, they don't know which one they'd follow either." }
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Başçavuş'un sağ dizi artık bir eklem değil, bir yara. Bu gece dövüşürse o dizi onu yarı yolda bırakacak; kendisi de biliyor.", en: "The Gunny's right knee isn't a joint anymore. It's a wound. If he fights tonight, that knee is going to quit on him halfway through, and he knows it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷şte o köşe. yasanın yırtılabilir köşesi. bu gece ya o yırtacak ya sen. üçüncü bir el yok.", en: "t̷here it is. the corner of the law that tears. tonight either he tears it or you do. there's no third hand." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Konsey binası benim insanlarımla dolu. 'Gerekmedikçe' ne demek, ona sor.\"", en: "\"The Council building is full of my people. Ask him what 'unless necessary' means.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu adama ne olduğunu biliyorum. Sana olmasından korktuğum şey bu.\"", en: "\"I know what happened to this man. It's the thing I'm scared is going to happen to you.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Konsey'in telsiz frekansını biliyorum. Bir cümle, beş saniye. Söyle yeter.\"", en: "\"I know the Council's radio frequency. One sentence, five seconds. Just say the word.\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "İkinci kolu al; darbeye katıl", en: "Take the second column. Join the coup" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_darbe_ortagi"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { duzen: 6, merhamet: -4, insanlik: -3 }
              - itibar: { lonca: 10, siginak: -15 }
              - iliski: { kaya_demir: { baglilik: 10, guven: 8 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|in} ikinci kolunu aldın; Konsey binasına giden zırhlı kolun başında sen vardın.", en: "On the night before the coup you took {npc:kaya_demir|pos} second column. You were at the head of the armor that rolled on the Council building." }
            sonraki: "kaya_darbe_gecesi_ortak"
          - id: "devir"
            etiket: { tr: "\"Bu gece kimse şafağa yürümüyor.\" Onu durdur", en: "\"Nobody marches at dawn.\" Stop him" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { guven: -10, saygi: 6 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|in} önüne dikildin ve onu kendi haddehanesinde durdurmaya kalktın.", en: "On the night before the coup you planted yourself in front of {npc:kaya_demir} and tried to stop him in his own rolling mill." }
            sonraki: "kaya_darbe_gecesi_devir"
          - id: "tek_darbe"
            tur: "gosteris"
            etiket: { tr: "Tek hamlede indir; kimse silah çekmesin", en: "Put him down in one move. Nobody draws" }
            gerekli: { stat: { str: 220 } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 4, insanlik: -4 }
              - dikkat: 5
              - iliski: { kaya_demir: { korku: 12, saygi: 10, guven: -10 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|i} kendi askerlerinin önünde tek hamlede yere indirdin; haddehanede kimse silahına uzanamadı.", en: "On the night before the coup you put {npc:kaya_demir} on the floor in one move, in front of his own troops. Nobody in the mill could even reach for a weapon." }
            sonraki: "kaya_darbe_gecesi_ezme"
          - id: "vazgecir"
            etiket: { tr: "\"Yanılıyorsun. Ve bunu biliyorsun.\"", en: "\"You're wrong. And you know it.\"" }
            gerekli: { iliski_min: { kaya_demir: { guven: 30 } } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { insanlik: 4, duzen: 2, merhamet: 2 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 6 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|e} yanıldığını söyledin; ona bunu söyleyebilecek tek kişi sendin.", en: "On the night before the coup you told {npc:kaya_demir} he was wrong. You were the only person alive who could." }
            sonraki: "kaya_darbe_gecesi_vazgecti"
          - id: "koz"
            etiket: { tr: "Mavi Çapa'nın sahte ihbarını masaya koy", en: "Put the forged Blue Anchor tip on the table" }
            goster: { bayrak: "kaya_sirri_elde" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { guven: -12, korku: 6 } }
            kronik: { tr: "Darbe gecesinde yıllardır cebinde taşıdığın sahte ihbarı Lonca'nın subaylarının önüne koydun; Pano'da yalan olmaz kuralı, onu yazanı devirdi.", en: "On the night before the coup you laid the forged tip you'd carried for months in front of the Guild's officers. 'No lies on the Board' brought down the man who wrote it." }
            sonraki: "kaya_darbe_gecesi_subaylar"
          - id: "subaylar"
            tur: "gosteris"
            etiket: { tr: "Subaylara dön: \"Kimi izliyorsunuz?\"", en: "Turn to the officers. \"Who are you following?\"" }
            goster: { degisken_min: { lonca_rutbe: 3 } }
            gerekli: { stat: { cha: 160 } }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - ahlak: { duzen: 4, insanlik: -3 }
              - dikkat: 3
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { guven: -8, saygi: 8 } }
            kronik: { tr: "Darbe gecesinde Lonca'nın subaylarına kimi izlediklerini sordun; hepsi sana döndü ve {npc:kaya_demir} haddehanenin ortasında yalnız kaldı.", en: "On the night before the coup you asked the Guild's officers who they were following. Every one of them turned to you, and {npc:kaya_demir} was left standing alone in the middle of the mill." }
            sonraki: "kaya_darbe_gecesi_subaylar"
          - id: "ihbar"
            etiket: { tr: "Sessizce çık; Konsey'i uyar", en: "Slip out. Warn the Council" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_ihbar_edildi"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { siginak: 10, lonca: -10 }
              - iliski: { kaya_demir: { guven: -12 }, elif_sari: { guven: 6 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|in} planını Konsey'e taşıdın; şafak geldiğinde zırhlı kollar onları bekleyen bir şehirle karşılaştı.", en: "On the night before the coup you carried {npc:kaya_demir|pos} plan to the Council. When dawn came, the armored columns found a city waiting for them." }
            sonraki: "kaya_darbe_gecesi_ihbar"
          - id: "kenarda"
            etiket: { tr: "\"Bu benim savaşım değil.\"", en: "\"This isn't my fight.\"" }
            etkiler:
              - bilgi: "kaya_darbe_plani"
              - bayrak: "kaya_darbe_hazirligi"
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { kaya_demir: { saygi: -2 } }
            kronik: { tr: "Darbe gecesinde kenarda durdun; şehir o şafağı sensiz yaşadı ve sonra sana neden bir şey yapmadığını sordu.", en: "On the night before the coup you stayed on the sidelines. The city lived through that dawn without you, then asked you why you'd done nothing." }
            sonraki: "kaya_darbe_gecesi_kenarda"

      - id: "kaya_darbe_gecesi_devir"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun süre sana bakıyor. Sonra masanın arkasından çıkıyor, ceketini çıkarıp sandalyeye asıyor; Döküm'ün zırhçılarının onun için döktüğü sac koşum, gömleğinin altından parlıyor.", en: "{npc:kaya_demir} looks at you for a long time. Then he comes around the table, takes off his jacket and hangs it on the chair. The steel rig the Foundry's armorers poured for him gleams under his shirt." }
          - { tr: "\"Talimdeymişiz gibi,\" diyor. Miğferini takmıyor; koltuğunun altına alıyor. \"Hazır olduğunda.\" Muhafızlarından ikisi kalkanlarını kenetleyip yanına geçiyor.", en: "\"Like it's a drill,\" he says. He doesn't put his helmet on. He tucks it under his arm. \"Whenever you're ready.\" Two of his enforcers lock shields and step up beside him." }
          - metin: { tr: "Örs balyozunu kaldırıyor ve muhafızların önüne, senin yanına geçiyor. \"Borcumu ödüyorum,\" diyor.", en: "Anvil lifts his sledge and steps out in front of the enforcers, next to you. \"Paying my debt,\" he says." }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Örs, Başçavuş'un arkasında balyozunu kaldırıyor. Merdiven Günü'nün hesabı bu gece kapanacak.", en: "Behind the Gunny, Anvil raises his sledge. Ladder Day's bill comes due tonight." }
            kosul: { bayrak: "ors_kin" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Hazırım", en: "Ready" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+4", "lonca_muhafizi@dunya", "lonca_muhafizi@dunya"], ortam: ["yanici"], kazan: "kaya_darbe_gecesi_kader", kaybet: "kaya_darbe_gecesi_yenilgi" }
            kronik: { tr: "Haddehanenin ortasında {npc:kaya_demir|le} gerçek bir dövüşe girdin; ikinizden biri o gece kendi askerlerinin önünde yere düşecekti.", en: "In the middle of the mill you went into a real fight with {npc:kaya_demir}. One of you was going down in front of your own troops that night." }
          - id: "yalniz_o"
            etiket: { tr: "\"Muhafızlar karışmasın. Sen ve ben.\"", en: "\"Keep the enforcers out. Just you and me.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+5"], ortam: ["yanici"], kazan: "kaya_darbe_gecesi_kader", kaybet: "kaya_darbe_gecesi_yenilgi" }
            kronik: { tr: "{npc:kaya_demir|le} muhafızsız, bire bir dövüştün; Lonca o gece iki askerin kendi aralarında bir hesabı kapattığını gördü.", en: "You fought {npc:kaya_demir} one on one, no enforcers. That night the Guild watched two soldiers settle something between themselves." }

      - id: "kaya_darbe_gecesi_ezme"
        yer: "sanayi"
        paragraflar:
          - { tr: "Masanın etrafından dolaşmıyorsun bile. Bir an masanın bu tarafındasın; sonraki an {npc:kaya_demir} sırtüstü haddehanenin çeliğinde, süngüsü üç adım ötede, miğferi yuvarlanıyor.", en: "You don't even go around the table. One second you're on this side of it. The next, {npc:kaya_demir} is flat on his back on the mill floor, his bayonet ten feet away, his helmet rolling." }
          - { tr: "Zırhlı kollardaki yüzlerce avcının hiçbiri kıpırdamıyor. Bir silah sesi duymuyorsun; bir tüfeğin emniyetinin açıldığını bile duymuyorsun.", en: "Not one of the hundreds of hunters in those armored columns moves. You don't hear a shot. You don't even hear a safety click off." }
          - { tr: "{npc:kaya_demir} tavana bakıyor. Sonra gülüyor; kısa, kuru, neredeyse rahatlamış. \"Yirmi yıl asker yetiştirdim,\" diyor. \"Senin gibisini görmedim.\"", en: "{npc:kaya_demir} stares up at the ceiling. Then he laughs, short and dry, almost relieved. \"Twenty years training troops,\" he says. \"Never seen one like you.\"" }
        secenekler:
          - id: "kader"
            etiket: { tr: "Başında dur ve karar ver", en: "Stand over him and decide" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "{npc:kaya_demir|i} tek hamlede devirdikten sonra başında durup kaderini tarttın.", en: "After you toppled {npc:kaya_demir} in one move, you stood over him and weighed what happened to him next." }
            sonraki: "kaya_darbe_gecesi_kader"

      - id: "kaya_darbe_gecesi_subaylar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehane susuyor. Sonra zırhlı kollardan birinin başındaki subay miğferini çıkarıp yere koyuyor. Bir başkası. Sonra bir başkası. Kimse bir şey söylemiyor; söylemeye gerek yok.", en: "The mill goes silent. Then the officer at the head of one column takes his helmet off and sets it on the floor. Then another. Then another. Nobody says a word. Nobody has to." }
          - { tr: "{npc:kaya_demir} masanın başında, haritasının üstünde yalnız duruyor. Uzun süre miğferlere bakıyor. Sonra kalemi bırakıyor.", en: "{npc:kaya_demir} stands alone at the table, over his map. He looks at the helmets on the floor for a long time. Then he puts down his pencil." }
          - { tr: "\"Meritokrasi,\" diyor. Sesinde ne öfke var ne alay. \"Kendi kuralımla. Başka nasıl olabilirdi ki?\"", en: "\"Meritocracy,\" he says. There's no anger in it. No mockery either. \"By my own rule. How else was it ever going to go?\"" }
        secenekler:
          - id: "kader"
            etiket: { tr: "Ona yaklaş ve karar ver", en: "Walk up to him and decide" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "{npc:kaya_demir|i} kan dökmeden, kendi subaylarının miğferleriyle devirdin.", en: "You toppled {npc:kaya_demir} without spilling a drop of blood, with nothing but his own officers' helmets." }
            sonraki: "kaya_darbe_gecesi_kader"

      - id: "kaya_darbe_gecesi_kader"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:kaya_demir} haddehanenin zemininde, bir dizinin üstünde. Sağ dizi onu nihayet bırakmış; ama süngüsünü bırakmıyor. Nefesi hırıltılı, gözleri sakin.", en: "{npc:kaya_demir} is down on one knee on the mill floor. His right knee finally quit on him, but he hasn't let go of the bayonet. His breathing's ragged. His eyes are calm." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Zırhlı kolların yüzlerce avcısı sana bakıyor. Defterdar yazı altlığını göğsüne bastırmış. Lonca bu gece bir komutan kaybetti ve bir komutan kazandı; geriye yalnızca eskisiyle ne yapılacağı kaldı.", en: "Hundreds of hunters in the armored columns are looking at you. The Ledger has her clipboard pressed to her chest. Tonight the Guild lost a commander and gained one. All that's left is deciding what to do with the old one." }
          - { tr: "\"Kural belli,\" diyor {npc:kaya_demir}, sana bakarak. \"Devrilen komutan ya ölür ya gider. Hangisi olacağına sen karar verirsin. Bunu da ben yazdım.\"", en: "\"The rule's clear,\" {npc:kaya_demir} says, looking up at you. \"A toppled commander either dies or goes. You decide which. I wrote that one too.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ö̷lür ya da gider. ama bir üçüncü yol daha var, değil mi? hep vardı. o yazmadı diye yok değil.", en: "d̷ies or goes. but there's a third way, isn't there? there always was. just because he didn't write it doesn't mean it isn't there." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Kural kuraldır", en: "A rule is a rule" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - npc_ol: "kaya_demir"
              - ahlak: { merhamet: -8, duzen: 5, insanlik: -5 }
              - itibar: { lonca: 12, siginak: -10 }
              - efsane: "acimasiz_infaz_tanikli"
              - ordu: { lonca_avcisi: 40 }
              - xp_seviye: 150
            kronik: { tr: "{npc:kaya_demir|i} kendi yazdığı kurala göre, kendi haddehanesinde öldürdün; Lonca'nın bütün silahları o geceden sonra yalnızca sana baktı.", en: "You killed {npc:kaya_demir} by his own rule, in his own rolling mill. After that night, every weapon in the Guild looked to you and only you." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "hapis"
            etiket: { tr: "Soğuk fırına kapat; şafak geçsin", en: "Lock him in the cold furnace. Let the dawn pass" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { lonca: 8 }
              - ordu: { lonca_avcisi: 35 }
              - xp_seviye: 150
              - iliski: { kaya_demir: { korku: 6, guven: -4 } }
              - tohum: { olay: "kaya_soguk_firin", gecikme: { min: 8, max: 14 }, kosul: { bayrak: "kaya_hapiste", npc_hayatta: "kaya_demir", perde: 3 } }
            kronik: { tr: "{npc:kaya_demir|i} devirdin ve haddehanenin soğuk fırınına kapattın; şafak onsuz geldi, Lonca senin oldu.", en: "You toppled {npc:kaya_demir} and locked him in the mill's cold furnace. Dawn came without him, and the Guild was yours." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "surgun"
            etiket: { tr: "\"Git. Bir daha bu şehre dönme.\"", en: "\"Go. Don't ever come back to this city.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_surgun"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - npc_gitti: "kaya_demir"
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { lonca: 6 }
              - ordu: { lonca_avcisi: 30 }
              - xp_seviye: 150
            kronik: { tr: "{npc:kaya_demir|i} devirdin ve şehirden sürdün; topallayarak {yer:sanayi|in} kapısından çıktı ve bir daha {yer:kiyikent|de} görülmedi.", en: "You toppled {npc:kaya_demir} and exiled him. He limped out {yer:sanayi} gate and was never seen in {yer:kiyikent} again." }
            sonraki: "kaya_darbe_gecesi_son"
          - id: "yemin"
            etiket: { tr: "\"Üçüncü yol: bana yemin et ve komuta etmeye devam et.\"", en: "\"Third way: swear to me and keep commanding.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 40 } } }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_yemin_etti"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 4, merhamet: 4 }
              - itibar: { lonca: 10 }
              - ordu: { lonca_avcisi: 40 }
              - xp_seviye: 150
              - iliski: { kaya_demir: { saygi: 10, baglilik: 8, guven: 4 } }
            kronik: { tr: "{npc:kaya_demir|i} devirdin ama ne öldürdün ne sürdün; sana yemin etti ve Lonca'nın sahadaki komutanı olarak kaldı, bu sefer senin emrinle.", en: "You toppled {npc:kaya_demir} but didn't kill or exile him. He swore to you and stayed on as the Guild's field commander, under your orders this time." }
            sonraki: "kaya_darbe_gecesi_son"

      - id: "kaya_darbe_gecesi_son"
        yer: "sanayi"
        paragraflar:
          - { tr: "Zırhlı kollar dağılıyor. Kamyonların motorları susuyor; tüfekler rafa, kapı zırhları askıya dönüyor. Konsey binası bu gece hiçbir şey bilmeden uyuyacak.", en: "The armored columns stand down. The trucks go quiet. Rifles go back on the racks, Gate armor back on the hooks. The Council building is going to sleep through tonight without ever knowing." }
          - { tr: "Defterdar Pano'ya yürüyor ve en üstteki satırı siliyor. Sonra tebeşiri sana uzatıyor; Merdiven Günü'ndeki gibi. Bu sefer üstte yazacak başka bir isim yok.", en: "The Ledger walks over to the Board and wipes the top line. Then she holds the chalk out to you, same as on Ladder Day. This time there's no other name left to write above yours." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını yaz", en: "Write your name" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2 }
              - degisken: { lonca_rutbe: 1 }
            kronik: { tr: "Darbe gecesinin sonunda Pano'nun en üstüne adını yazdın; Demir Lonca artık senindi.", en: "At the end of the night before the coup, you wrote your name at the top of the Board. The Iron Guild was yours." }
            sonraki: "@akis"
          - id: "bos_birak"
            etiket: { tr: "En üst satırı boş bırak", en: "Leave the top line blank" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
            kronik: { tr: "{npc:kaya_demir|i} devirdiğin gece Pano'nun en üst satırını boş bıraktın; Lonca o boşluğa senin adından daha çok saygı gösterdi.", en: "On the night you toppled {npc:kaya_demir}, you left the top line of the Board blank. The Guild respected that empty line more than it would have respected your name." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Süngünün dipçiği çenene oturuyor ve haddehanenin çatısı bir kez dönüyor. Gözünü açtığında soğuk fırının içindesin; demir kapı kilitli, kapının küçük penceresinden {npc:kaya_demir|in} yüzü görünüyor.", en: "The rifle butt lands on your jaw and the mill roof spins once. When you open your eyes you're inside the cold furnace. The iron door's locked, and {npc:kaya_demir|pos} face is in its little window." }
          - { tr: "\"Bugün değil,\" diyor. \"Seni öldürmeyeceğim. Bu şehrin sana ihtiyacı olacak, bana olduğundan daha çok.\" Pencereyi kapatıyor. Dışarıda motorlar çalışıyor.", en: "\"Not today,\" he says. \"I'm not going to kill you. This city's going to need you. More than it needs me.\" He shuts the window. Outside, engines start." }
        secenekler:
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Fırının kapısını menteşesinden sök", en: "Tear the furnace door off its hinges" }
            gerekli: { stat: { str: 200 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -2 }
              - bayrak: "kaya_darbe_hazirligi"
              - dikkat: 3
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "{npc:kaya_demir|in} seni kapattığı fırının kapısını menteşesinden söktün ama zırhlı kollar çoktan yola çıkmıştı.", en: "You tore the door off the furnace {npc:kaya_demir} had locked you in, but the armored columns were already on the road." }
            sonraki: "kaya_darbe_gecesi_kacis"
          - id: "bekle"
            etiket: { tr: "Karanlıkta otur ve bekle", en: "Sit in the dark and wait" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bayrak: "kaya_darbe_hazirligi"
              - iliski: { kaya_demir: { guven: 3 } }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|e} yenildin ve onun fırınında karanlıkta oturup şafağı bekledin.", en: "On the night before the coup, {npc:kaya_demir} beat you, and you sat in his furnace in the dark waiting for dawn." }
            sonraki: "kaya_darbe_gecesi_kacis"

      - id: "kaya_darbe_gecesi_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehaneden çıktığında {yer:sanayi|in} sokakları boş; kamyonların izleri çamurda, {yer:kiyikent_liman|e} doğru uzanıyor. Darbe şafakta değil, Sistem'in geri sayımının altmış beşi gösterdiği sabah olacak; plan bunu söylüyordu. Önünde birkaç gün var.", en: "When you come out of the mill {yer:sanayi} streets are empty, truck tracks in the mud running toward {yer:kiyikent_liman}. The coup isn't going down tonight. It's the morning the countdown hits sixty-five. The plan said so. You've got a few days." }
        secenekler:
          - id: "hazirlan"
            etiket: { tr: "O sabaha hazırlan", en: "Get ready for that morning" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - stat: { wil: 4 }
            kronik: { tr: "{npc:kaya_demir|in} fırınından çıktın ve darbenin sabahına hazırlandın.", en: "You got out of {npc:kaya_demir|pos} furnace and started getting ready for the morning of the coup." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_vazgecti"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun süre haritaya bakıyor. Sonra kırmızı kalemi alıp 'Şafak' kelimesinin üstünü çiziyor. Elinin titrediğini ilk kez görüyorsun.", en: "{npc:kaya_demir} stares at the map a long time. Then he picks up the red pencil and strikes through 'Dawn.' It's the first time you've ever seen his hand shake." }
          - { tr: "\"Kırk iki kişi,\" diyor. \"O gece kapıyı açık tuttum çünkü emir yanlıştı. Bu gece emri veren benim ve yanlış olan benim.\" Zırhlı kollara dönüyor ve sesini yükseltiyor: \"Rahat! Kollar dağılsın.\"", en: "\"Forty-two people,\" he says. \"That night I held the door because the order was wrong. Tonight I'm the one giving the order, and I'm the one who's wrong.\" He turns to the armored columns and raises his voice. \"At ease! Columns, stand down.\"" }
          - { tr: "Haddehane bir an inanamıyor. Sonra motorlar susuyor.", en: "For a second the mill doesn't believe it. Then the engines go quiet." }
        secenekler:
          - id: "ortak_masa"
            etiket: { tr: "\"Lonca'yı Konsey'in masasına götür. Birlikte.\"", en: "\"Take the Guild to the Council's table. Together.\"" }
            etkiler:
              - bayrak: "kaya_darbeden_vazgecti"
              - bayrak: "kaya_akil_hocasi"
              - ahlak: { duzen: 4, insanlik: 4, merhamet: 2 }
              - itibar: { lonca: 6, siginak: 10 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { kaya_demir: { guven: 10, baglilik: 10 }, elif_sari: { guven: 4 } }
              - xp_seviye: 120
            kronik: { tr: "{npc:kaya_demir|i} darbeden vazgeçirdin ve Lonca'yı Konsey'in masasına birlikte götürdünüz; şehir son günlerine iki eli birden kullanarak girdi.", en: "You talked {npc:kaya_demir} out of the coup, and the two of you brought the Guild to the Council's table together. The city went into its last days using both hands." }
            sonraki: "@akis"
          - id: "planini_sakla"
            etiket: { tr: "\"Planı yakma. Gerekirse.\"", en: "\"Don't burn the plan. Just in case.\"" }
            etkiler:
              - bayrak: "kaya_darbeden_vazgecti"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 4 } }
              - xp_seviye: 100
            kronik: { tr: "{npc:kaya_demir|i} darbeden vazgeçirdin ama planı yakmasına izin vermedin; o harita, şehrin son günlerinde bir çekmecede beklemeye devam etti.", en: "You talked {npc:kaya_demir} out of the coup but wouldn't let him burn the plan. That map sat in a drawer through the city's last days, waiting." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_ortak"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} sana ikinci kolun haritasını uzatıyor. Konsey binası, üç giriş, iki nöbetçi kulübesi, bir revir. Revirin üstüne birisi kurşunkalemle küçük bir not yazmış: 'Hekime dokunulmayacak.'", en: "{npc:kaya_demir} hands you the second column's map. The Council building, three entrances, two guard posts, an infirmary. Somebody's written a small note over the infirmary in pencil: 'Nobody touches the doctor.'" }
          - { tr: "\"Altmış beşinci sabah,\" diyor. \"O güne kadar kimseye tek kelime yok.\" Elini uzatıyor; bu sefer gerçekten uzatıyor.", en: "\"Sixty-five morning,\" he says. \"Not one word to anybody till then.\" He holds out his hand. This time he actually holds it out." }
        secenekler:
          - id: "sik"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { kaya_demir: { guven: 4 } }
              - xp_seviye: 80
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|in} elini sıktın; ikiniz şehrin son kışına aynı zırhlı kolun başında girdiniz.", en: "On the night before the coup you shook {npc:kaya_demir|pos} hand. The two of you went into the city's last winter at the head of the same armored column." }
            sonraki: "@akis"
          - id: "hekim_sart"
            etiket: { tr: "\"Bir şartım var: Konsey'de kimse ölmeyecek.\"", en: "\"One condition. Nobody on the Council dies.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - xp_seviye: 80
            kronik: { tr: "{npc:kaya_demir|in} darbesine katıldın ama Konsey'de kimsenin ölmemesini şart koştun; 'gerekmedikçe' kelimesi o gece haritadan silindi.", en: "You joined {npc:kaya_demir|pos} coup on one condition: nobody on the Council dies. That night the words 'unless necessary' got erased from the map." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_ihbar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Konsey binasının kapısını gece yarısından sonra çalıyorsun. İçeride lambalar birer birer yanıyor; seni dinleyen yüzler önce inanmıyor, sonra korkuyor, sonra hesap yapmaya başlıyor.", en: "You knock on the Council building's door after midnight. Inside, lamps come on one at a time. The faces listening to you don't believe it at first. Then they're scared. Then they start doing math." }
          - metin: { tr: "{npc:elif_sari} haritaya bakıyor ve revirin üstündeki notu görüyor: 'Hekime dokunulmayacak.' Bir süre bir şey söylemiyor. \"Beni korumak istemiş,\" diyor sonunda. \"Bu daha kötü.\"", en: "{npc:elif_sari} looks over the map and sees the note above the infirmary: 'Nobody touches the doctor.' She doesn't say anything for a while. \"He wanted to protect me,\" she finally says. \"That's worse.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "savun"
            etiket: { tr: "Konsey'in savunmasını sen kur", en: "Set up the Council's defense yourself" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
              - itibar: { siginak: 6 }
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 80
            kronik: { tr: "{npc:kaya_demir|in} darbesine karşı Konsey'in savunmasını kendi ellerinle kurdun; altmış beşinci sabah onları hazır buldu.", en: "You built the Council's defense against {npc:kaya_demir|pos} coup with your own hands. The morning of sixty-five found them ready." }
            sonraki: "@akis"
          - id: "arabulucu"
            etiket: { tr: "\"Hazırlanın. Ama onunla konuşmayı da deneyin.\"", en: "\"Get ready. But try talking to him too.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - itibar: { siginak: 4, lonca: 2 }
              - xp_seviye: 80
            kronik: { tr: "Konsey'i uyardın ama kapıyı tamamen kapatmadın; {npc:kaya_demir|e} uzatılabilecek bir el bıraktın.", en: "You warned the Council but didn't slam the door. You left a hand they could still hold out to {npc:kaya_demir}." }
            sonraki: "@akis"

      - id: "kaya_darbe_gecesi_kenarda"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} başını sallıyor; hayal kırıklığı mı, rahatlama mı, ayırt edemiyorsun. \"Hava durumu,\" diyor. \"Hep öyleydin.\"", en: "{npc:kaya_demir} nods. Disappointment or relief, you can't tell which. \"Weather,\" he says. \"You always were.\"" }
          - { tr: "Haddehaneden çıkarken arkanda bir motor çalışıyor, sonra bir tane daha. Altmış beşinci sabaha kadar her gece aynı ses.", en: "As you walk out of the mill, an engine starts behind you. Then another. Every night until the morning of sixty-five, the same sound." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Keep walking" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            kronik: { tr: "Darbe gecesinde {npc:kaya_demir|in} haddehanesinden çıktın ve motorların sesini arkanda bıraktın.", en: "On the night before the coup you walked out of {npc:kaya_demir|pos} mill and left the sound of engines behind you." }
            sonraki: "@akis"

  # ================================================================== KAYA — SON SAVAŞIN GENERALİ (P4, AY 337)
  - id: "kaya_son_savas_generali"
    perde: [4]
    gun: { min: 331, max: 341 }
    ana_yay: { gun: 337 }
    kosul: { bayrak_yok: ["kaya_surgun", "kaya_general"], gun_max: 341 }
    agirlik: 9
    etiketler: ["lonca", "npc", "savas", "ordu"]
    gerilim: 4
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "General", en: "The General" }
    sahne: "kaya_son_savas_generali_1"
    sahneler:
      - id: "kaya_son_savas_generali_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Körfezin üstündeki gökyüzü artık mavi değil. Kadim filosu ufuktan ufka bir tavan gibi asılı; gemilerin karınlarındaki ışıklar her gece biraz daha aşağı iniyor. Sistem'in geri sayımı herkesin penceresinde aynı sayıyı gösteriyor ve kimse ona bakmak istemiyor.", en: "The sky over the bay isn't blue anymore. The Ancient fleet hangs from horizon to horizon like a ceiling, and every night the lights in the ships' bellies come down a little lower. The System countdown shows the same number in everybody's window, and nobody wants to look at it." }
          - metin: { tr: "Haddehanenin soğuk fırınının kapısını açıyorsun. {npc:kaya_demir} içeride, karanlıkta, sırtını duvara vermiş oturuyor; günlerdir göğün sesini dinlediği belli. \"Duydum,\" diyor. \"Filoyu. Kaç gün?\"", en: "You open the door of the mill's cold furnace. {npc:kaya_demir} is sitting in the dark with his back to the wall. You can tell he's been listening to the sky for days. \"I heard it,\" he says. \"The fleet. How many days?\"" }
            kosul: { bayrak: "kaya_hapiste" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde seni bekliyor; üstünde bir sancak değil, beyaz bir bez. Darbeden beri şehri o yönetiyor ve bunu saklamıyor. \"Düşman kapıda,\" diyor. \"Savaştan sonra beni asabilirsin. Önce savaş.\"", en: "{npc:kaya_demir} is waiting for you in {yer:kordon} trenches, under a white rag instead of a banner. He's run the city since the coup and he isn't pretending otherwise. \"Enemy's at the gate,\" he says. \"After the fight, you can hang me. Fight first.\"" }
            kosul: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde sana selam vermeden rapor veriyor; sana yemin ettiğinden beri hep böyle. \"Sahra komutanı hazır,\" diyor. \"Emirlerinizi bekliyor.\"", en: "{npc:kaya_demir} reports to you in {yer:kordon} trenches without a salute. He's done it that way ever since he swore to you. \"Field commander's ready,\" he says. \"Awaiting your orders.\"" }
            kosul: { bayrak: "kaya_yemin_etti" }
          - metin: { tr: "{npc:kaya_demir} {yer:kordon|in} siperlerinde, elinde bir harita, seni bekliyor. Gri saçları uzamış; sağ bacağını artık bir çelik desteğe yaslıyor. Sırtı hâlâ bir bayrak direği gibi dik.", en: "{npc:kaya_demir} is waiting for you in {yer:kordon} trenches with a map in his hand. His gray hair's grown out, and his right leg rests in a steel brace now. His back is still straight as a flagpole." }
            kosul: { bayrak_yok: ["kaya_hapiste", "kaya_yemin_etti", "ihanet_kaya"] }
          - { tr: "\"Elimde tüfek tutabilen üç bin kişi var,\" diyor. \"Kapı tutabilen dört yüz. {yer:kordon|den} {yer:sanayi|e} bir kara hattı kurabilirim ve onu tutabilirim. Ama göğü tutamam. Göğü tutabilecek tek bir şey var bu şehirde.\" Sana bakıyor.", en: "\"I've got three thousand people who can hold a rifle,\" he says. \"Four hundred who can hold a Gate. I can build a ground line from {yer:kordon} to {yer:sanayi}, and I can hold it. What I can't hold is the sky. There's exactly one thing in this city that can.\" He looks at you." }
          - metin: { tr: "Anlattığı hattı tanıyorsun. Soğuk fırının isli duvarına bir çivinin ucuyla kazıdığı hattın aynısı bu; tek farkla: artık her siperin yanında bir isim var ve isimlerin hiçbiri onunki değil.", en: "You know the line he's describing. It's the same one he scratched into the sooty wall of the cold furnace with the tip of a nail, with one difference: now there's a name next to every trench, and none of the names are his." }
            kosul: { bayrak: "kaya_firin_plani" }
        sezgiler:
          - kosul: { stat: { per: 350 } }
            metin: { tr: "Filonun öncü gemilerinden üçünün karnı açık. İçlerinde inmeye hazır, büyük, yavaş bir şeyler kıpırdıyor; ilk dalga yarın değil, bu gece.", en: "Three of the fleet's lead ships have their bellies open. Something big and slow is stirring inside them, ready to drop. The first wave isn't coming tomorrow. It's coming tonight." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u adam bütün hayatını bu ana hazırlanarak geçirdi. kıyamete herkesten önce hazırdı, hatırlıyor musun? işte geldi.", en: "t̷his man spent his whole life getting ready for this exact moment. he was ready for the end of the world before anybody, remember? well. here it is." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Onunla ne yaşadıysak yaşadık. Bu gece onu hatta istiyorum.\"", en: "\"Whatever's happened between us happened. Tonight I want him on that line.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sana bak, ona bak. İkiniz de bunun için yaratılmışsınız. Bu beni korkutmalı mı, rahatlatmalı mı?\"", en: "\"Look at you. Look at him. You were both made for this. Should that scare me or make me feel better?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İhtiyar iyi bir general. Bunu ondan duymasın.\"", en: "\"Old man's a good general. Don't tell him I said so.\"" }
        secenekler:
          - id: "general"
            etiket: { tr: "\"Kara hattı senin. General sensin.\"", en: "\"The ground line is yours. You're the general.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 4, insanlik: 2 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { guven: 8, saygi: 6, baglilik: 6 } }
            kronik: { tr: "Kadim filosunun altında {npc:kaya_demir|e} kara hattını verdin; {yer:kordon|den} {yer:sanayi|e} kadar her siper onun sesiyle tutuldu.", en: "Under the Ancient fleet you gave {npc:kaya_demir} the ground line. Every trench from {yer:kordon} to {yer:sanayi} held to the sound of his voice." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "komuta_bende"
            etiket: { tr: "\"Komuta bende. Sen sahadaki generalimsin.\"", en: "\"I'm in command. You're my general in the field.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 5, insanlik: -3 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 6, korku: 3 } }
            kronik: { tr: "Son savaşta bütün komutayı kendi elinde tuttun ve {npc:kaya_demir|i} sahadaki generalin yaptın; ordunun tek bir beyni, iki eli vardı.", en: "In the last battle you kept full command yourself and made {npc:kaya_demir} your general in the field. The army had one brain and two hands." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "tahliye"
            etiket: { tr: "\"Hattın yarısını sivillerin tahliyesine ayır.\"", en: "\"Put half the line on evacuating civilians.\"" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 30 }
              - ahlak: { merhamet: 6, duzen: -2 }
              - degisken: { hayatta_kalan: 4 }
              - itibar: { siginak: 8, lonca: 2 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
            kronik: { tr: "Son savaşta {npc:kaya_demir|in} ordusunun yarısını sivillerin tahliyesine ayırdın; hat inceldi ama arkasında boş evler değil, yaşayan insanlar kaldı.", en: "In the last battle you put half of {npc:kaya_demir|pos} army on evacuating civilians. The line got thinner, but what it left behind was living people, not empty houses." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "oncu_gosteris"
            tur: "gosteris"
            etiket: { tr: "Ordunun önünde öncü dalgayı tek başına indir", en: "Drop the first wave alone, in front of the army" }
            gerekli: { stat: { str: 400 } }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 80 }
              - unvan: "hattin_mizragi"
              - degisken: { kadim_tehdit: -5 }
              - dikkat: 6
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { lonca: 12, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 12, korku: 4 } }
              - xp_seviye: 150
            kronik: { tr: "Kadim filosunun ilk dalgasını üç bin askerin gözü önünde tek başına indirdin; o geceden sonra {yer:kiyikent|in} ordusu korkuyla değil, sana bakarak savaştı.", en: "You took down the Ancient fleet's first wave alone, with three thousand soldiers watching. After that night, {yer:kiyikent|pos} army didn't fight scared. It fought watching you." }
            sonraki: "kaya_son_savas_generali_gosteris"
          - id: "oncu_savas"
            etiket: { tr: "Öncü dalgayı hattın önünde karşıla", en: "Meet the first wave out in front of the line" }
            etkiler:
              - bayrak: "kaya_general"
              - bayrak_kaldir: "kaya_hapiste"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 3, merhamet: 2 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - savas: { dusmanlar: ["kadim_hat_yarici@oyuncu+3"], ortam: ["su"], kazan: "kaya_son_savas_generali_zafer", kaybet: "kaya_son_savas_generali_yenilgi" }
            kronik: { tr: "Kadim filosunun ilk dalgasını {npc:kaya_demir|in} hattının önünde karşıladın; siperler arkanda tutuldu.", en: "You met the Ancient fleet's first wave out in front of {npc:kaya_demir|pos} line. The trenches held behind you." }
          - id: "hesap"
            etiket: { tr: "\"Önce darbenin hesabını vereceksin.\"", en: "\"First you answer for the coup.\"" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { kaya_demir: { guven: -8, saygi: 4 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+3"], ortam: ["su"], kazan: "kaya_son_savas_generali_hesap", kaybet: "kaya_son_savas_generali_hesap_yenilgi" }
            kronik: { tr: "Kadim filosu tepedeyken {npc:kaya_demir|e} darbenin hesabını {yer:kordon|in} siperlerinde sordun.", en: "With the Ancient fleet overhead, you made {npc:kaya_demir} answer for the coup right there in {yer:kordon} trenches." }
          - id: "guvenme"
            etiket: { tr: "\"Sana ordu vermem. Bu savaşı sensiz veririz.\"", en: "\"You don't get an army. We fight this without you.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - iliski: { kaya_demir: { guven: -10, saygi: -4 } }
            kronik: { tr: "Son savaşta {npc:kaya_demir|e} ordu vermedin; yirmi yılını bu güne hazırlanarak geçirmiş adam o savaşı bir pencereden izledi.", en: "In the last battle you wouldn't give {npc:kaya_demir} an army. The man who'd spent twenty years getting ready for that day watched it through a window." }
            sonraki: "kaya_son_savas_generali_pencere"

      - id: "kaya_son_savas_generali_gosteris"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece yarısı ilk Hat Yarıcı körfeze iniyor: üç katlı bir bina boyunda, sırtında nişancı yuvaları, her adımında yer titriyor. Arkasında iki tane daha. Siperlerde üç bin kişi nefesini tutuyor.", en: "At midnight the first Line-Breaker drops into the bay: three stories tall, marksman nests on its back, the ground shaking with every step. Two more behind it. In the trenches, three thousand people hold their breath." }
          - { tr: "Siperden çıkıp kumsala yürüyorsun. Silah çekmiyorsun. İlki sana ulaşamadan çöküyor; ikincisi dönüp kaçmaya çalışıyor ve yarı yolda düşüyor. Üçüncüsü hiç inmiyor; gemisi onu geri çekiyor.", en: "You climb out of the trench and walk down onto the beach. You don't draw anything. The first one collapses before it reaches you. The second turns to run and goes down halfway. The third never lands at all. Its ship hauls it back up." }
          - { tr: "Arkanda, siperlerden önce bir uğultu, sonra bir haykırış yükseliyor. Üç bin kişi adını bağırıyor.", en: "Behind you, a murmur comes up out of the trenches, then a roar. Three thousand people are shouting your name." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kadim öncü dalgası püskürtüldü]", en: "[Ancient vanguard repelled]" }
            satirlar:
              - { tr: "Düşman kaybı: 2 Hat Yarıcı. Dost kaybı: 0.", en: "Enemy losses: 2 Line-Breakers. Friendly losses: 0." }
              - { tr: "Not: Filo komuta frekansında adın 14 kez geçti.", en: "Note: Your name appeared 14 times on the fleet's command frequency." }
        secenekler:
          - id: "don"
            etiket: { tr: "Siperlere dön", en: "Head back to the trenches" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
            kronik: { tr: "Öncü dalgayı indirdikten sonra siperlere döndün ve {npc:kaya_demir|in} yanında durdun.", en: "After you dropped the first wave, you went back to the trenches and stood next to {npc:kaya_demir}." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_zafer"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Hat Yarıcı kumsala çöküyor ve sırtındaki son yuvanın ışığı sönüyor. Ezilmiş bir siperden geriye bakıyorsun; hat yerinde.", en: "The Line-Breaker crashes onto the beach and the light in its last nest goes out. You look back from a crushed trench. The line's still there." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Hat Yarıcı kumsala bile ulaşamıyor. Siperlerdeki askerler onun nasıl düştüğünü birbirlerine anlatmaya çalışıyor ve hiçbiri anlatamıyor.", en: "The Line-Breaker never even makes the beach. The soldiers in the trenches keep trying to explain to each other how it went down, and none of them can." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "{npc:kaya_demir|in} sesi telsizden geliyor, sakin: \"Kara hattı tutuyor. Gök senin.\"", en: "{npc:kaya_demir|pos} voice comes over the radio, calm: \"Ground line's holding. Sky's yours.\"" }
        secenekler:
          - id: "don"
            etiket: { tr: "Hatta dön", en: "Get back to the line" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { kadim_tehdit: -3 }
              - unvan: "hattin_mizragi"
              - xp_seviye: 120
            kronik: { tr: "Kadim öncüsünü indirdin ve {npc:kaya_demir|in} hattına döndün; o gece göğü sen, yeri o tuttu.", en: "You took down the Ancient vanguard and went back to {npc:kaya_demir|pos} line. That night you held the sky and he held the ground." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Hat Yarıcı'nın kuyruğu seni siperin içine gömüyor. Gözünü açtığında iki asker seni kumdan çıkarıyor; Hat Yarıcı ise siperlerin önünde, yüzlerce mermiyle delik deşik, yatıyor.", en: "The Line-Breaker's tail buries you in the trench. When you open your eyes, two soldiers are digging you out of the sand, and the Line-Breaker lies in front of the trenches, shot full of holes by hundreds of rounds." }
          - { tr: "\"Sen onu yavaşlattın,\" diyor {npc:kaya_demir}, başında dikilirken. \"Gerisini hat yaptı. Bu bir ordu, asker. Yalnız değilsin.\"", en: "\"You slowed it down,\" {npc:kaya_demir} says, standing over you. \"The line did the rest. This is an army, kid. You're not alone out here.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve hatta dön", en: "Get up and get back on the line" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - degisken: { kadim_tehdit: -2 }
              - iliski: { kaya_demir: { guven: 4 } }
            kronik: { tr: "Kadim öncüsü seni kuma gömdü ve {npc:kaya_demir|in} hattı onu senin yerine bitirdi; o gece yalnız olmadığını öğrendin.", en: "The Ancient vanguard buried you in the sand, and {npc:kaya_demir|pos} line finished it for you. That night you learned you weren't alone." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_hesap"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:kaya_demir} siperin çamuruna diz çöküyor; çelik destekli bacağı onu taşımıyor artık. Etraftaki askerler silahlarını indirmiş, kimin emrini bekleyeceklerini bilmiyor.", en: "{npc:kaya_demir} goes down on one knee in the trench mud. The braced leg won't hold him anymore. The soldiers around you have lowered their weapons, not sure whose order they're waiting on." }
          - { tr: "\"Devrildim,\" diyor. \"Kural belli. Ama düşman kapıda ve senin bir generale ihtiyacın var. Kararı sen ver.\"", en: "\"I'm toppled,\" he says. \"Rule's clear. But the enemy's at the gate, and you need a general. Your call.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        secenekler:
          - id: "zincirli_general"
            etiket: { tr: "\"Generalim ol. Savaştan sonra hesaplaşırız.\"", en: "\"Be my general. We settle up after.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_general"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ordu: { lonca_avcisi: 60 }
              - ahlak: { duzen: 5, merhamet: 2 }
              - iliski: { kaya_demir: { saygi: 8, korku: 4 } }
              - xp_seviye: 150
            kronik: { tr: "{yer:kordon|in} siperlerinde {npc:kaya_demir|i} devirdin ve aynı anda generalin yaptın; darbenin hesabı son savaştan sonraya kaldı.", en: "In {yer:kordon} trenches you toppled {npc:kaya_demir} and made him your general in the same breath. The bill for the coup got pushed past the last battle." }
            sonraki: "kaya_son_savas_generali_selam"
          - id: "tutukla"
            etiket: { tr: "Tutuklat; hattı kendin yönet", en: "Have him arrested. Run the line yourself" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "lonca_5_acik"
              - unvan: "demir_deviren"
              - ordu: { lonca_avcisi: 40 }
              - ahlak: { duzen: 6, merhamet: -3, insanlik: -3 }
              - itibar: { lonca: 8 }
              - xp_seviye: 150
            kronik: { tr: "{yer:kordon|in} siperlerinde {npc:kaya_demir|i} devirip zincire vurdun ve son savaşı onun ordusuyla, onsuz verdin.", en: "In {yer:kordon} trenches you toppled {npc:kaya_demir}, had him put in irons, and fought the last battle with his army and without him." }
            sonraki: "@akis"

      - id: "kaya_son_savas_generali_hesap_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Süngünün ucu boğazının bir parmak önünde duruyor. {npc:kaya_demir} nefes nefese, çelik destekli bacağı titriyor; ama eli titremiyor.", en: "The tip of the bayonet stops an inch from your throat. {npc:kaya_demir} is breathing hard, his braced leg shaking, but his hand isn't." }
          - { tr: "\"Bugün değil,\" diyor ve süngüyü indiriyor. \"Ne benim için ne senin için. Göğe bak. Hesabımız bekleyebilir; onlar beklemez.\"", en: "\"Not today,\" he says, and lowers the bayonet. \"Not for me, not for you. Look up. Our business can wait. They won't.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Elini tut; generalin ol", en: "Take his hand. Let him be the general" }
            etkiler:
              - bayrak: "kaya_general"
              - ordu: { lonca_avcisi: 50 }
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 } }
            kronik: { tr: "Darbenin hesabını sorduğun dövüşü {npc:kaya_demir} kazandı ve seni bağışladı; son savaşta onun generalliğini kabul ettin.", en: "{npc:kaya_demir} won the fight you picked over the coup, and spared you. In the last battle, you accepted him as general." }
            sonraki: "kaya_son_savas_generali_selam"

      - id: "kaya_son_savas_generali_pencere"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:kaya_demir} haritasını katlayıp cebine koyuyor. Bir şey söylemiyor. Siperlerden çıkıp {yer:sanayi|e} doğru, çelik destekli bacağıyla topallayarak yürüyor.", en: "{npc:kaya_demir} folds his map and puts it in his pocket. He doesn't say a word. He climbs out of the trenches and limps off toward {yer:sanayi} on his braced leg." }
          - { tr: "O gece haddehanenin çatısında, Kadim gemilerinin ışığında tek başına bir siluet görüyorsun; elinde bir tüfek, hiç kıpırdamadan göğü izliyor.", en: "That night, up on the roof of the rolling mill, you can make out a lone silhouette in the light of the Ancient ships, rifle in hand, watching the sky without moving." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bırak izlesin", en: "Let him watch" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            kronik: { tr: "Son savaşı {npc:kaya_demir} haddehanenin çatısından, elinde tek bir tüfekle izledi.", en: "{npc:kaya_demir} watched the last battle from the roof of the rolling mill, a single rifle in his hands." }
            sonraki: "@akis"
          - id: "cik"
            etiket: { tr: "Çatıya çık ve yanında dur", en: "Climb up to the roof and stand with him" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { kaya_demir: { guven: 6 } }
            kronik: { tr: "{npc:kaya_demir|e} ordu vermedin ama son gece onun çatısına çıkıp yanında durdun; ikiniz de bir şey söylemediniz.", en: "You didn't give {npc:kaya_demir} an army, but on the last night you climbed up onto his roof and stood next to him. Neither of you said anything." }
            sonraki: "@akis"

      - id: "kaya_son_savas_generali_selam"
        yer: "kordon"
        paragraflar:
          - { tr: "Şafağa doğru siperler sessizleşiyor. {npc:kaya_demir} haritayı katlıyor, botlarının bağcıklarını sıkıyor; bir şey söylemeden önce hep yaptığı gibi.", en: "Toward dawn, the trenches go quiet. {npc:kaya_demir} folds the map and tightens his bootlaces, the way he always does before he says something." }
          - metin: { tr: "Sonra doğruluyor, topuklarını birleştiriyor ve sağ elini kaldırıyor. Bu sefer yarıda durmuyor. Kırk iki kişinin kapısını tuttuğu geceden beri ilk kez, tam bir asker selamı veriyor.", en: "Then he straightens up, brings his heels together and raises his right hand. This time it doesn't stop halfway. For the first time since the night he held that door for forty-two people, he gives a full salute." }
            kosul: { iliski_min: { kaya_demir: { saygi: 50 } } }
          - metin: { tr: "Cebinden iki çelik plakayı, eğri bir zincirle çıkarıyor ve avucuna bırakıyor. \"Künyem,\" diyor. \"Benden sonra kimin taşıyacağına karar vermiştim. Söylemedim, çünkü sorun çıkarırdın.\"", en: "He pulls two steel tags on a bent chain out of his pocket and drops them into your palm. \"My dog tags,\" he says. \"I'd already decided who carries these after me. Didn't tell you, because you'd have made a fuss.\"" }
            kosul: { bayrak: "kaya_akil_hocasi" }
          - { tr: "\"Kara hattı tutacak,\" diyor. \"Sen göğü tut. Gerisi, asker, kendiliğinden gelir.\"", en: "\"The ground line will hold,\" he says. \"You hold the sky. The rest, kid, takes care of itself.\"" }
        secenekler:
          - id: "selam_ver"
            etiket: { tr: "Selamına selamla karşılık ver", en: "Return the salute" }
            etkiler:
              - bayrak: "kaya_selam_tam"
              - ahlak: { duzen: 3, insanlik: 2 }
              - esya: { kaya_kunyesi: 1 }
              - iliski: { kaya_demir: { baglilik: 8, guven: 4 } }
            kronik: { tr: "Son savaşın şafağında {npc:kaya_demir|in} selamına selamla karşılık verdin; yarıda kalan bir selam nihayet tamamlandı.", en: "At dawn before the last battle you returned {npc:kaya_demir|pos} salute. A salute that had stopped halfway for a year finally got finished." }
            sonraki: "@akis"
          - id: "el_sik"
            etiket: { tr: "Selam verme; elini sık", en: "Don't salute. Shake his hand" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - esya: { kaya_kunyesi: 1 }
              - iliski: { kaya_demir: { guven: 6, saygi: 2 } }
            kronik: { tr: "Son savaşın şafağında {npc:kaya_demir|e} selam vermedin, elini sıktın; bir asker gibi değil, bir eşit gibi.", en: "At dawn before the last battle you didn't salute {npc:kaya_demir}. You shook his hand, not like a soldier, but like an equal." }
            sonraki: "@akis"
          - id: "emir"
            etiket: { tr: "\"Hatta dön, general. Bu bir emir.\"", en: "\"Back to the line, General. That's an order.\"" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -2 }
              - iliski: { kaya_demir: { saygi: 4 } }
            kronik: { tr: "Son savaşın şafağında {npc:kaya_demir|e} emir verdin ve o, yirmi yıl boyunca başkalarından duyduğu bir cümleyle karşılık verdi: 'Emredersiniz.'", en: "At dawn before the last battle you gave {npc:kaya_demir} an order, and he answered with words he'd spent twenty years hearing from other people: 'Yes, sir.'" }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 5 — TAHT (P4, AY 346)
  - id: "lonca_5_taht"
    perde: [4]
    gun: { min: 331, max: 357 }
    ana_yay: { gun: 346 }
    kosul: { bayrak: "lonca_5_acik", bayrak_yok: ["lonca_cozuldu", "lonca_kayaya_birakildi"], gun_max: 357 }
    agirlik: 9
    etiketler: ["lonca", "zincir", "taht", "ahlak"]
    gerilim: 3
    onemli: true
    kart: { tr: "Demir Taht", en: "The Iron Chair" }
    sahne: "lonca_5_taht_1"
    sahneler:
      - id: "lonca_5_taht_1"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kadim istilası püskürtüldü. Körfezin üstündeki gökyüzünde gemi enkazları hâlâ yanıyor; {yer:sanayi|in} bacalarından yükselen duman onlarla karışıyor ve şehir, bir yıldır ilk kez, bir zaferin kokusunu alıyor.", en: "The Ancient invasion's been thrown back. Wrecked ships are still burning in the sky over the bay, their smoke mixing with the smoke from {yer:sanayi} stacks, and for the first time in a year the city can smell a victory." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Kadim istilası bir anlaşmayla durdu. Filo gökte asılı duruyor ama ateş etmiyor; şehir bir yıldır ilk kez sessiz ve bu sessizliğin bedelini henüz kimse tam bilmiyor.", en: "The Ancient invasion stopped on a treaty. The fleet still hangs in the sky, but it isn't firing. For the first time in a year the city is quiet, and nobody's quite sure yet what that quiet cost." }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "{yer:kiyikent|in} yarısı düştü. {yer:kiyikent_liman} yanıyor, {yer:kordon} artık bir siper bile değil. {yer:sanayi|in} çelik duvarları hâlâ ayakta; şehirden geriye kalanların çoğu bu duvarların arkasına sığınmış.", en: "Half of {yer:kiyikent} fell. The Waterfront's burning and {yer:kordon} isn't even a trench anymore. The Ironworks' steel walls are still standing, and most of what's left of the city is packed in behind them." }
            kosul: { bayrak: "kiyikent_dustu" }
          - { tr: "Haddehanenin ortasında, ambar kapağı masasının yerinde, bir sandalye duruyor. Lonca'nın döküm ustaları onu kaynakla yapmış: Kuru Havuz'un kraliçesinin kabuğundan bir sırt, inşaat demirinden kollar, Pano'nun çelik levhasından bir oturak. Kimse ona taht demiyor. Herkes öyle düşünüyor.", en: "In the middle of the rolling mill, where the hatch-cover table used to be, there's a chair. The Guild's casters welded it together: a back cut from the dry dock queen's shell, arms of rebar, a seat made from the steel plate of the Board itself. Nobody calls it a throne. Everybody's thinking it." }
          - { tr: "Lonca'nın bütün subayları çevresinde. Defterdar yazı altlığını göğsüne bastırmış. Örs balyozunu yere dayamış. Hepsi sana bakıyor; çünkü bu gezegende senden daha güçlü bir şey yok ve Lonca'nın tek kuralı bu.", en: "Every officer in the Guild is standing around it. The Ledger has her clipboard pressed to her chest. Anvil's leaning his sledge on the floor. They're all looking at you. There's nothing stronger than you on this planet, and that's the Guild's only rule." }
          - metin: { tr: "{npc:kaya_demir} sandalyenin yanında duruyor, çelik destekli bacağıyla. \"Ben yaptırdım,\" diyor. \"Hiç oturmadım. Benden sonra demiştim, hatırlıyor musun? Bu benden sonra.\"", en: "{npc:kaya_demir} is standing beside the chair, leg in its brace. \"I had it made,\" he says. \"Never sat in it. I said 'after me,' remember? This is after me.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_devrildi", "ihanet_kaya"] }
          - metin: { tr: "{npc:kaya_demir} sandalyede oturuyor. Darbeden beri şehri buradan yönetiyor. Subaylar sana bakarken o da sana bakıyor; yüzünde ne meydan okuma var ne korku. Yalnızca hesap.", en: "{npc:kaya_demir} is sitting in the chair. He's run the city from it since the coup. While the officers look at you, he looks at you too. There's no challenge on his face and no fear. Just math." }
            kosul: { npc_hayatta: "kaya_demir", bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "Sandalyenin bir koluna eski, eğri bir süngü kaynakla tutturulmuş. Lonca onu bir anma olarak oraya koymuş; ya da bir uyarı olarak.", en: "An old, bent bayonet has been welded to one arm of the chair. The Guild put it there as a memorial. Or as a warning." }
            kosul: { npc_olu: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { cha: 400 } }
            metin: { tr: "Bu oda yalnızca Lonca değil. Kapıdaki muhafızlar, sokaklardaki Demir Yasa, Kule'deki nöbetler, ordunun tamamı. Bu sandalyeye oturan, şehre oturur.", en: "This room isn't just the Guild. The guards at the door, the Iron Law on the streets, the Spire rotations, the whole army. Whoever sits in this chair sits on the city." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷tur. ya da oturma. ama bil ki sistem bu sandalyeyi zaten görüyor. bir tahta oturan her şeyi, hasat sırasında ayrı tartıyor.", en: "s̷it. or don't. but know that the system can already see this chair. it weighs everything that sits on a throne separately, come harvest." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Oraya oturursan, artık seni bir hekim olarak muayene edemem. Bir hükümdar olarak edebilirim belki.\"", en: "\"Sit there, and I can't examine you as a doctor anymore. As a ruler, maybe.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bütün yıl bunu izledim. Canavar mı, tanrı mı diye. Meğer üçüncü bir seçenek varmış: kral.\"", en: "\"I watched this all year. Monster or god, I kept asking. Turns out there was a third option: king.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir sandalye. Kod değil, bir sandalye. Bazen en güçlü sistem en ilkel olanıdır.\"", en: "\"A chair. Not code. A chair. Sometimes the most powerful system is the most primitive one.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Sandalyeye yürü", en: "Walk to the chair" }
            goster: { bayrak_yok: "ihanet_kaya" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Haddehanenin ortasındaki kaynaklı sandalyeye doğru yürüdün; Lonca'nın bütün subayları sana yol açtı.", en: "You walked toward the welded chair in the middle of the rolling mill, and every officer in the Guild stepped aside." }
            sonraki: "lonca_5_taht_otur"
          - id: "yuru_devrik"
            etiket: { tr: "Sandalyeye yürü", en: "Walk to the chair" }
            goster: { bayrak: ["ihanet_kaya", "kaya_devrildi"] }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Darbeyi yapan adamın boşalttığı sandalyeye doğru yürüdün.", en: "You walked toward the chair the man who led the coup had left empty." }
            sonraki: "lonca_5_taht_otur"
          - id: "yuru_anma"
            etiket: { tr: "Süngülü sandalyeye yürü", en: "Walk to the chair with the bayonet" }
            goster: { bayrak: "ihanet_kaya", npc_olu: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Ölmüş bir darbecinin süngüsünün kaynaklandığı sandalyeye doğru yürüdün.", en: "You walked toward the chair with a dead coup leader's bayonet welded to its arm." }
            sonraki: "lonca_5_taht_otur"
          - id: "indir"
            etiket: { tr: "\"Kalk.\" Onu tahttan zorla indir", en: "\"Get up.\" Drag him off the chair" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi", npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2 }
              - iliski: { kaya_demir: { guven: -8, saygi: 6 } }
              - savas: { dusmanlar: ["demir_bascavus@oyuncu+6"], ortam: ["yanici"], kazan: "lonca_5_taht_kader", kaybet: "lonca_5_taht_yenilgi" }
            kronik: { tr: "Darbeyle şehri alan {npc:kaya_demir|i} kendi tahtından zorla indirdin; Lonca, devrilen diktatörün son dövüşünü haddehanenin ortasında izledi.", en: "You dragged {npc:kaya_demir}, who'd taken the city in a coup, off his own chair. The Guild watched the toppled strongman's last fight in the middle of the rolling mill." }
          - id: "subaylar"
            tur: "gosteris"
            etiket: { tr: "Subaylara dön; kalkmasını onlar istesin", en: "Turn to the officers. Let them tell him to stand" }
            goster: { bayrak: "ihanet_kaya", bayrak_yok: "kaya_devrildi", npc_hayatta: "kaya_demir" }
            gerekli: { stat: { cha: 420 } }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - dikkat: 3
              - iliski: { kaya_demir: { guven: -6, saygi: 8 } }
            kronik: { tr: "Lonca'nın subayları tek tek miğferlerini çıkarıp sana döndü ve darbeyle şehri alan adam, kendi tahtından kendi ayağıyla indi.", en: "One by one, the Guild's officers took off their helmets and turned to you, and the man who'd taken the city in a coup stood up out of his own chair on his own two feet." }
            sonraki: "lonca_5_taht_kader"
          - id: "birak"
            etiket: { tr: "\"O sandalye senin. Hep senindi.\"", en: "\"That chair's yours. It always was.\"" }
            goster: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_devrildi", "ihanet_kaya"] }
            etkiler:
              - bayrak: "lonca_kayaya_birakildi"
              - bayrak: "kaya_akil_hocasi"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 4, duzen: 2 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { baglilik: 12, guven: 10, saygi: 8 } }
              - xp_seviye: 200
            kronik: { tr: "Demir Lonca'nın tahtını {npc:kaya_demir|e} bıraktın; akıl hocan, yaptırdığı sandalyeye nihayet oturdu ve şehrin son günlerinde onu senin adına tuttu.", en: "You left the Iron Guild's chair to {npc:kaya_demir}. Your mentor finally sat in the chair he'd had made, and held it in your name through the city's last days." }
            sonraki: "lonca_5_taht_hoca"
          - id: "erit"
            etiket: { tr: "\"Bu sandalyeyi eritin.\"", en: "\"Melt this chair down.\"" }
            etkiler:
              - bayrak: "lonca_cozuldu"
              - bayrak_kaldir: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 6, duzen: -2, merhamet: 3 }
              - itibar: { siginak: 15, lonca: -6 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: -2 } }
              - xp_seviye: 200
            kronik: { tr: "Demir Lonca'nın tahtını Döküm'ün potasında erittirdin ve Lonca'yı Konsey'e bağladın; şehrin en güçlü ordusu, son günlerinde bir oyla yönetildi.", en: "You had the Iron Guild's chair melted down in the Foundry's crucible and folded the Guild into the Council. The strongest army in the city spent its last days answering to a vote." }
            sonraki: "lonca_5_taht_erit"

      - id: "lonca_5_taht_kader"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} haddehanenin zemininde, sandalyenin dibinde. Çelik destek kırılmış; süngüsü elinde ama kaldırmıyor.", en: "{npc:kaya_demir} is on the mill floor at the foot of the chair. His brace is broken. The bayonet's in his hand, but he isn't raising it." }
          - { tr: "\"Kural belli,\" diyor. \"Bunu da ben yazdım. Devrilen komutan ya ölür ya gider.\"", en: "\"Rule's clear,\" he says. \"I wrote that one too. A toppled commander either dies or goes.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Fraksiyon liderliği değişti: Demir Lonca]", en: "[Faction leadership changed: Iron Guild]" }
            satirlar:
              - { tr: "Yeni lider: {oyuncu}", en: "New leader: {oyuncu}" }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Kuralı uygula", en: "Apply the rule" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - unvan: "demir_deviren"
              - npc_ol: "kaya_demir"
              - ahlak: { merhamet: -8, duzen: 5, insanlik: -5 }
              - efsane: "acimasiz_infaz_tanikli"
            kronik: { tr: "Darbeyle şehri alan {npc:kaya_demir|i} kendi tahtının dibinde, kendi kuralıyla öldürdün.", en: "You killed {npc:kaya_demir}, who'd taken the city in a coup, at the foot of his own chair, by his own rule." }
            sonraki: "lonca_5_taht_otur"
          - id: "hapis"
            etiket: { tr: "Soğuk fırına kapat", en: "Lock him in the cold furnace" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_hapiste"
              - unvan: "demir_deviren"
              - ahlak: { duzen: 5, merhamet: 2 }
            kronik: { tr: "Darbeci {npc:kaya_demir|i} tahtından indirip haddehanenin soğuk fırınına kapattın; hasat gününü orada, karanlıkta bekledi.", en: "You pulled {npc:kaya_demir} off his throne and locked him in the mill's cold furnace. He waited for harvest day in there, in the dark." }
            sonraki: "lonca_5_taht_otur"
          - id: "surgun"
            etiket: { tr: "\"Git.\"", en: "\"Go.\"" }
            etkiler:
              - bayrak: "kaya_devrildi"
              - bayrak: "kaya_surgun"
              - unvan: "demir_deviren"
              - npc_gitti: "kaya_demir"
              - ahlak: { merhamet: 3, duzen: -2 }
            kronik: { tr: "Darbeci {npc:kaya_demir|i} tahtından indirip şehirden sürdün; topallayarak çıktı ve dünyanın son günlerinde nereye gittiğini kimse bilmedi.", en: "You pulled {npc:kaya_demir} off his throne and exiled him. He limped out, and in the world's last days nobody knew where he went." }
            sonraki: "lonca_5_taht_otur"

      - id: "lonca_5_taht_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Süngü boğazının bir parmak önünde duruyor. {npc:kaya_demir} kırık desteğine rağmen ayakta, sandalyenin önünde. \"Bugün değil,\" diyor. \"Bu şehrin son günleri. Birbirimizi öldürerek geçirmeyeceğiz.\"", en: "The bayonet stops an inch from your throat. {npc:kaya_demir} is on his feet in front of the chair, broken brace and all. \"Not today,\" he says. \"These are this city's last days. We're not spending them killing each other.\"" }
          - { tr: "Subaylar ikinize bakıyor. Lonca'nın kuralı açık: kazanan oturur. O kazandı.", en: "The officers look from one of you to the other. The Guild's rule is clear: winner sits. He won." }
        secenekler:
          - id: "diz"
            etiket: { tr: "Başını eğ; tahtı ona bırak", en: "Bow your head. Leave him the chair" }
            etkiler:
              - bayrak: "lonca_kayaya_birakildi"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { duzen: 4, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 8, guven: 4 } }
              - xp_seviye: 120
            kronik: { tr: "Demir Lonca'nın tahtı için {npc:kaya_demir|le} dövüştün ve kaybettin; başını eğdin ve son günlerde şehir onun sandalyesinden yönetildi.", en: "You fought {npc:kaya_demir} for the Iron Guild's chair and lost. You bowed your head, and the city's last days were run from his seat." }
            sonraki: "@akis"
          - id: "erit"
            etiket: { tr: "\"O zaman kimse oturmasın. Eritin.\"", en: "\"Then nobody sits in it. Melt it.\"" }
            etkiler:
              - bayrak: "lonca_cozuldu"
              - bayrak_kaldir: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - ahlak: { insanlik: 5, duzen: -3 }
              - itibar: { siginak: 10, lonca: -8 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
              - xp_seviye: 120
            kronik: { tr: "Taht dövüşünü {npc:kaya_demir|e} kaybettin ama sandalyeyi eritme çağrını Lonca duydu; tahtın kendisi kaybetti.", en: "You lost the fight for the chair to {npc:kaya_demir}, but the Guild heard your call to melt it down. In the end, the throne itself lost." }
            sonraki: "lonca_5_taht_erit"

      - id: "lonca_5_taht_otur"
        yer: "sanayi"
        paragraflar:
          - { tr: "Sandalyenin önünde duruyorsun. Kraliçenin kabuğundan kesilmiş sırt soğuk; Pano'nun levhasından yapılmış oturakta hâlâ silinmemiş bir tebeşir izi var: en üst satırda, senin adın.", en: "You stand in front of the chair. The back, cut from the queen's shell, is cold. On the seat made from the Board's plate, there's still a chalk mark nobody wiped off: the top line. Your name." }
          - metin: { tr: "{npc:kaya_demir|in} künyesi cebinde ağırlaşıyor.", en: "{npc:kaya_demir|pos} dog tags get heavy in your pocket." }
            kosul: { esya: { kaya_kunyesi: 1 } }
          - { tr: "Haddehanede kimse nefes almıyor. Vinçler durmuş; döküm kalıpları soğuyor. Şehrin bütün silahları bu sandalyeye bakıyor.", en: "Nobody in the mill is breathing. The cranes have stopped. The casting molds are cooling. Every weapon in the city is pointed at this chair, waiting." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Otur", en: "Sit down" }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 80 }
              - ahlak: { duzen: 8, insanlik: -6 }
              - itibar: { lonca: 20, siginak: -10 }
              - xp_seviye: 250
            kronik: { tr: "Haddehanenin ortasındaki demir tahta oturdun; şehrin bütün silahları, bütün yasaları ve bütün sokakları o andan sonra tek bir sese baktı: seninkine.", en: "You sat down in the iron chair in the middle of the rolling mill. From that moment, every weapon, every law and every street in the city waited on a single voice. Yours." }
            sonraki: "lonca_5_taht_son"
          - id: "kuleye"
            tur: "gosteris"
            etiket: { tr: "Sandalyeyi tek elle kaldır; Kule'ye çevir ve otur", en: "Lift the chair one-handed. Turn it to the Spire. Sit" }
            gerekli: { stat: { str: 450 } }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 100 }
              - dikkat: 8
              - ahlak: { duzen: 10, insanlik: -8 }
              - itibar: { lonca: 25, siginak: -12 }
              - xp_seviye: 300
            kronik: { tr: "Demir tahtı tek elle kaldırıp Kule'ye, Sistem'in kendisine çevirdin ve öyle oturdun; Lonca bunu bir taç giyme olarak, gökyüzü ise bir meydan okuma olarak okudu.", en: "You lifted the iron chair one-handed, turned it to face the Spire, the System itself, and sat down. The Guild read it as a coronation. The sky read it as a challenge." }
            sonraki: "lonca_5_taht_son"
          - id: "yumusak"
            etiket: { tr: "Otur; ilk emrin Demir Yasa'yı yumuşatmak olsun", en: "Sit. Make your first order softening the Iron Law" }
            etkiler:
              - bayrak: "lonca_hakimiyeti"
              - gorev: { zincir_lonca: "tamam" }
              - unvan: "demir_tahtin_sahibi"
              - esya: { demir_muhur: 1 }
              - ordu: { lonca_avcisi: 70 }
              - ahlak: { duzen: 5, merhamet: 5 }
              - itibar: { lonca: 15, siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 250
            kronik: { tr: "Demir tahta oturdun ve ilk emrinle Demir Yasa'nın sokağa çıkma yasağını kaldırdın; şehir seni bir hükümdar olarak tanıdı ama geceleri yeniden dışarı çıktı.", en: "You sat down in the iron chair, and with your first order you lifted the Iron Law's curfew. The city knew you as its ruler, and started going out at night again." }
            sonraki: "lonca_5_taht_son"

      - id: "lonca_5_taht_son"
        yer: "sanayi"
        paragraflar:
          - { tr: "Oturduğun an haddehanede bir ses yükseliyor; önce subaylardan, sonra vinçlerin üstünden, kirişlerden, kapılardan. Turuncu yamalı yüzlerce kol aynı anda kalkıyor.", en: "The moment you sit, a sound goes up in the mill: from the officers first, then from the cranes, the girders, the doorways. Hundreds of orange-patched arms go up at once." }
          - metin: { tr: "{npc:kaya_demir} kalabalığın en önünde, çelik destekli bacağıyla, dimdik duruyor. Topuklarını birleştiriyor ve tam bir selam veriyor.", en: "{npc:kaya_demir} stands at the very front of the crowd on his braced leg, straight as a rod. He brings his heels together and gives you a full salute." }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_hapiste", "kaya_surgun"] }
          - { tr: "Defterdar Pano'ya yürüyor ve tebeşirle, en üst satırın da üstüne, tek bir kelime yazıyor. Bir rütbe değil; bir unvan değil. Senin adın, başka hiçbir şey.", en: "The Ledger walks to the Board and, above even the top line, writes a single thing in chalk. Not a rank. Not a title. Your name, and nothing else." }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[Fraksiyon kontrolü: Demir Lonca → {oyuncu}]", en: "[Faction control: Iron Guild → {oyuncu}]" }
            satirlar:
              - { tr: "{yer:kiyikent|in} silahlı gücünün %71'i artık tek bir komuta bağlı.", en: "71% of {yer:kiyikent|pos} armed strength now answers to a single command." }
              - { tr: "Not: Sistem bu durumu 'beklenmedik' olarak işaretledi.", en: "Note: The System has flagged this as 'unexpected.'" }
        secenekler:
          - id: "ilk_emir"
            etiket: { tr: "\"Hasat günü gelene kadar kimse hattı bırakmayacak.\"", en: "\"Nobody leaves the line until harvest day.\"" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -2 }
              - degisken: { kadim_tehdit: -3 }
            kronik: { tr: "Demir tahttaki ilk emrin hattı tutmaktı; Lonca hasat gününe kadar tek bir siperi bile boş bırakmadı.", en: "Your first order from the iron chair was to hold the line. The Guild didn't leave a single trench empty until harvest day." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme; yalnızca otur", en: "Don't say anything. Just sit" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - dikkat: 2
            kronik: { tr: "Demir tahta oturduğunda tek kelime etmedin; Lonca sessizliğini bir emir gibi uyguladı.", en: "When you sat down in the iron chair, you didn't say a word. The Guild carried out your silence like an order." }
            sonraki: "@akis"

      - id: "lonca_5_taht_hoca"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} uzun süre sandalyeye bakıyor. Sonra sana. \"Ben bunu sana yaptırdım,\" diyor. \"Senin için.\"", en: "{npc:kaya_demir} looks at the chair a long time. Then at you. \"I had this made for you,\" he says. \"For you.\"" }
          - { tr: "\"Biliyorum,\" diyorsun. Ve o, yirmi yıl boyunca başkalarını oturttuğu bütün sandalyelerden sonra, ilk kez kendisi oturuyor. Sana bakıyor; gözlerinde bir şey yaşarıyor ve bir asker olarak bunu saklamaya çalışmıyor.", en: "\"I know,\" you say. And after twenty years of putting other people in chairs, he sits down in one himself for the first time. He looks at you. Something in his eyes is wet, and for once he doesn't try to hide it like a soldier would." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Ona selam ver", en: "Salute him" }
            etkiler:
              - bayrak: "kaya_selam_tam"
              - ahlak: { duzen: 3, insanlik: 2 }
            kronik: { tr: "Akıl hocan tahta oturduğunda ona selam verdin; Lonca'nın tarihindeki tek tam selam, yukarıdan aşağıya değil, aşağıdan yukarıya verildi.", en: "When your mentor sat down in the chair, you saluted him. The only full salute in the Guild's history was given from the bottom up, not the top down." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Bir şey söyleme; hatta dön", en: "Say nothing. Go back to the line" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
            kronik: { tr: "Tahtı {npc:kaya_demir|e} bırakıp sessizce hatta döndün; bir yıl boyunca ondan öğrendiğin her şeyi yanında götürdün.", en: "You left the chair to {npc:kaya_demir} and quietly went back to the line, carrying everything he'd taught you that year." }
            sonraki: "@akis"

      - id: "lonca_5_taht_erit"
        yer: "sanayi"
        paragraflar:
          - { tr: "Döküm ustaları sandalyeyi potaya taşıyor. Kraliçenin kabuğu son eriyen oluyor; Pano'nun levhası en önce. İçinde, en üst satırdaki adın, turuncu bir ışıkta kayboluyor.", en: "The casters haul the chair to the crucible. The queen's shell is the last thing to melt. The Board's plate goes first, and your name on the top line disappears into the orange light." }
          - { tr: "Ertesi sabah haddehanenin kapısına Konsey'in sancağı asılıyor, Lonca'nınkinin yanına. İki bayrak, bir direk.", en: "The next morning the Council's banner goes up on the mill door, right beside the Guild's. Two flags, one pole." }
        secenekler:
          - id: "izle"
            etiket: { tr: "İki bayrağın dalgalanmasını izle", en: "Watch the two flags go up" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            kronik: { tr: "Haddehanenin kapısında Lonca'nın ve Konsey'in bayraklarının aynı direkte dalgalanmasını izledin; {yer:kiyikent|in} son günlerinde ilk kez tek bir şehir vardı.", en: "You watched the Guild's flag and the Council's fly from the same pole over the mill door. In {yer:kiyikent|pos} last days, for the first time, there was one city." }
            sonraki: "@akis"

  # ================================================================== ÖRS'ÜN SOĞUK ODASI (tohum: lonca_2_rutbe · ors_kin)
  - id: "ors_soguk_oda"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["lonca", "ahlak", "sanayi"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Soğuk oda", en: "The cold room" }
    sahne: "ors_soguk_oda_1"
    sahneler:
      - id: "ors_soguk_oda_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Defterdar seni nerede olursan ol buluyor; yazı altlığı koltuğunun altında, eldivenlerinin parmak uçları delik. \"{yer:sanayi|e} gelmen lazım,\" diyor. \"Kural gereği değil.\"", en: "The Ledger finds you wherever you are, clipboard under her arm, the fingertips of her gloves worn through. \"You need to come to {yer:sanayi},\" she says. \"Not because of any rule.\"" }
          - { tr: "Döküm'ün rüzgâr alan arka tarafında basamaksızların kaldığı bir konteyner sırası var. En sondakinin iç duvarlarını kırağı tutmuş; köşede Örs'ün balyozunu satıp aldığı gaz sobası duruyor, buz gibi, çünkü gaz yağına para kalmamış.", en: "Out back of the Foundry, where the wind hits hardest, there's a row of shipping containers for people with no rung. Frost has crept up the inside walls of the last one. In the corner sits the kerosene heater Anvil sold his sledge to buy, stone cold, because there was nothing left over for kerosene." }
          - { tr: "Portatif bir yatakta, üç battaniyenin altında, Merdiven Günü turuncu kartı göğsüne bastıran küçük oğlan öksürüyor. Örs ters çevrilmiş bir kovanın üstünde oturuyor ve sana bakmadan konuşuyor: \"Seni buraya ben çağırmadım.\"", en: "On a cot under three blankets, the little boy who clutched the orange card on Ladder Day is coughing. Anvil sits on an upturned bucket and talks without looking at you. \"I didn't call you here.\"" }
          - { tr: "\"Ben çağırdım,\" diyor Defterdar. \"Kural rütbeyi korur. Çocuğu korumaz.\"", en: "\"I did,\" says the Ledger. \"The rule protects the rank. It doesn't protect the kid.\"" }
        sezgiler:
          - kosul: { stat: { per: 80 } }
            metin: { tr: "[ALG] Çocuğun göğsünden ıslak bir hırıltı geliyor: zatürre. Bu soğukta üç gün daha kalırsa ateşi düşmeyecek.", en: "[PER] There's a wet rattle in the kid's chest: pneumonia. Three more days in this cold and that fever isn't coming down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ir basamak aldın. basamağın altında bu oda vardı. merdivenler hep bir şeyin üstüne kurulur; çoğu zaman birinin.", en: "y̷ou took a rung. this room was under it. ladders always get built on top of something. usually someone." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Zatürre. Bunu duymak için hekim olmaya gerek yok. Bir saat bile bekletme.\"", en: "\"That's pneumonia. You don't need a medical degree to hear it. Don't wait another hour.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O gün herkes alkışladı. Bugün burada kimse yok.\"", en: "\"Everybody cheered that day. Today there's nobody here.\"" }
        secenekler:
          - id: "kart"
            etiket: { tr: "Turuncu kartını yatağın üstüne bırak", en: "Leave your orange card on the cot" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - bayrak_kaldir: "ors_kin"
              - bayrak: "ors_borclu"
              - degisken: { hayatta_kalan: 1 }
              - iliski: { kaya_demir: { saygi: 3, guven: 3 } }
              - xp_seviye: 15
            sonraki: "ors_soguk_oda_kart"
          - id: "revir"
            etiket: { tr: "Çocuğu sırtla; Sığınak'ın revirine taşı", en: "Carry the kid to the Haven clinic yourself" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - bayrak_kaldir: "ors_kin"
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - xp_seviye: 15
            sonraki: "ors_soguk_oda_revir"
          - id: "kural"
            etiket: { tr: "\"Kural kural. Gelecek Merdiven Günü geri alsın.\"", en: "\"Rules are rules. He can win it back next Ladder Day.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -5 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "ors_soguk_oda_kural"
          - id: "kapi"
            tur: "gosteris"
            etiket: { tr: "Bir kapıya gir; bütün sırayı ısıtacak kristal getir", en: "Clear a Gate tonight. Bring crystal for the whole row" }
            gerekli: { stat: { end: 80 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -2 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 4 }
              - xp_seviye: 20
            sonraki: "ors_soguk_oda_kapi"

      - id: "ors_soguk_oda_kart"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kartı cebinden çıkarıp battaniyenin üstüne bırakıyorsun. Örs karta bakıyor, sonra sana; çenesinin kası bir kez atıyor. \"Bunu almam,\" diyor.", en: "You take the card out of your pocket and set it on the blanket. Anvil looks at the card, then at you, and a muscle in his jaw jumps once. \"I'm not taking that,\" he says." }
          - { tr: "\"Senin için değil.\" Oğlanın eli battaniyenin altından çıkıp kartın üstüne kapanıyor; Merdiven Günü'ndeki gibi, sıkıca. Örs o küçük ele uzun süre bakıyor, sonra yüzünü duvara çeviriyor.", en: "\"It's not for you.\" The boy's hand comes out from under the blanket and closes over the card, tight, same as on Ladder Day. Anvil stares at that small hand for a long time. Then he turns his face to the wall." }
          - metin: { tr: "Ertesi sabah kantinde, basamaksızların sırasında tepsinle beklerken {npc:kaya_demir} yanına geliyor. \"Komutan kendi tayınını çavuşuna verirse, o çavuş komutan için ölür,\" diyor alçak sesle. \"Bu kitapta yazmaz. Yazmalı.\"", en: "Next morning in the mess hall, while you're waiting with your tray in the no-rung line, {npc:kaya_demir} walks up next to you. \"An officer gives his rations to his sergeant, that sergeant will die for him,\" he says quietly. \"That's not in the book. It ought to be.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Ertesi sabah kantinde, basamaksızların sırasında tepsinle beklerken subay konseyinin en yaşlısı yanından geçiyor ve tek kelime etmeden başını sallıyor.", en: "Next morning in the mess hall, while you wait with your tray in the no-rung line, the oldest officer on the council walks past and nods at you without a word." }
            kosul: { npc_olu: "kaya_demir" }
        secenekler:
          - id: "sira"
            etiket: { tr: "Sıranı bekle; tepsini doldur", en: "Wait your turn. Fill your tray" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "cavus"
            etiket: { tr: "Örs'ün çavuşluğunu Pano'ya geri yazdır", en: "Get Anvil's sergeant stripes back on the Board" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"

      - id: "ors_soguk_oda_revir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Oğlanı battaniyesiyle birlikte sırtına alıyorsun ve gece yarısı {yer:sanayi|den} {yer:kiyikent_liman|e} yürüyorsun. Örs arkandan geliyor, eli boş, adımlarını seninkine uydurmaya çalışarak. Bir kez bile çocuğu taşımayı teklif etmiyor; teklif edecek yüzü yok.", en: "You hoist the boy onto your back, blanket and all, and walk from {yer:sanayi} to {yer:kiyikent_liman} in the middle of the night. Anvil follows, empty-handed, trying to match your stride. Not once does he offer to carry him. He doesn't have the face for it." }
          - { tr: "Revirin lambası saat üçte hâlâ yanıyor. {npc:elif_sari} çocuğun göğsünü dinliyor, sonra sana bakıyor: \"İki gün daha geç kalsaydın bu konuşmayı yapmıyor olurduk.\" Sığınak'ın son antibiyotik kutusundan bir şırınga dolduruyor.", en: "The clinic lamp is still on at three in the morning. {npc:elif_sari} listens to the boy's chest, then looks at you. \"Two more days and we wouldn't be having this conversation.\" She fills a syringe from the Haven's last box of antibiotics." }
          - { tr: "Şafağa doğru Örs revirin kapısında yanına oturuyor. \"Sana borçlu değilim,\" diyor, duvara bakarak. \"Ama kinim de kalmadı. Nereye gittiğini bilmiyorum.\"", en: "Toward dawn, Anvil sits down next to you in the clinic doorway. \"I don't owe you,\" he says, staring at the wall. \"But the grudge is gone too. I don't know where it went.\"" }
        secenekler:
          - id: "cay"
            etiket: { tr: "Ona bir bardak çay ver", en: "Hand him a cup of coffee" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Çocuğun ateşi düşene kadar revirde kal", en: "Stay at the clinic till the kid's fever breaks" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
            sonraki: "@akis"

      - id: "ors_soguk_oda_kural"
        yer: "sanayi"
        paragraflar:
          - { tr: "Örs başını sallıyor. \"Kural kural,\" diyor ve Defterdar'ın yüzünde bir şey kapanıyor. O gece Örs balyozsuz, elinde bir levyeyle, basamaksız birinin gidebileceği tek yere gidiyor: kimsenin almak istemediği bir D kademesi kapıya.", en: "Anvil nods. \"Rules are rules,\" he says, and something in the Ledger's face shuts. That night Anvil goes out with no sledge, just a crowbar, to the only place a man with no rung can go: a D-Grade Gate nobody else wanted." }
          - { tr: "Şafakta geri dönüyor; kolundaki sargı kan içinde, elinde bir bidon gaz yağı. Konteyner sırasından aşağı yürürken yanından geçiyor ve sana bakmıyor.", en: "He comes back at dawn, the wrap on his arm soaked through with blood, a jerrycan of kerosene in his hand. Walking down the container row, he goes right past you and doesn't look." }
          - metin: { tr: "Balkondan izleyen {npc:kaya_demir} aşağı inmiyor; yalnızca sesleniyor: \"Kural tuttu. Adam da tuttu. Bir gün ikisinden biri tutmayacak.\"", en: "{npc:kaya_demir} watches from the balcony and doesn't come down. He just calls it out: \"The rule held. So did the man. One of these days, one of them won't.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürü", en: "Walk away" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"
          - id: "kolla"
            etiket: { tr: "Bir sonraki gece kapıda onu görünmeden kolla", en: "Next night, shadow him through the Gate unseen" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
            sonraki: "@akis"

      - id: "ors_soguk_oda_kapi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şafakta kapıdan çıkıyorsun; sırtında, bir D kademesi kapının içinde ne kristal varsa hepsiyle dolu bir çuval. Çuvalı konteyner sırasının ortasına boşaltıyorsun ve kristaller kırağının üstünde mavi mavi parlıyor.", en: "You come out of the Gate at dawn with a sack on your back holding every crystal that D-Grade Gate had in it. You dump it out in the middle of the container row, and the crystals glow blue against the frost." }
          - { tr: "Kapılar açılıyor; basamaksızlar birer birer dışarı çıkıyor, önce inanmadan, sonra avuç avuç. Bu sıra bir ay boyunca ısınacak.", en: "Doors open. The no-rung families come out one at a time, not believing it at first, then scooping it up by the handful. This row is going to be warm for a month." }
          - { tr: "Örs kalabalığa katılmıyor. \"Bir kapıyı bir balyozla üç gün tuttum,\" diyor kristallere bakarak, \"sen bir geceyi bir çuvala koydun.\" Sesinde ne teşekkür var ne öfke; yalnızca küçülmüş bir adamın sesi.", en: "Anvil doesn't join the crowd. \"I held a Gate for three days with a sledgehammer,\" he says, looking at the crystals, \"and you put a whole night in a sack.\" There's no thanks in it and no anger, just the voice of a man who got smaller." }
        secenekler:
          - id: "defterdar"
            etiket: { tr: "Kristalleri Defterdar dağıtsın; sırayla", en: "Let the Ledger hand it out. In order" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"
          - id: "avuc"
            etiket: { tr: "Bir avuç kristali Örs'ün eline kendin koy", en: "Put a handful in Anvil's hand yourself" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
            sonraki: "@akis"

  # ================================================================== SOĞUK FIRIN (tohum: kaya_darbe_gecesi · hapis)
  - id: "kaya_soguk_firin"
    perde: [3]
    agirlik: 1
    etiketler: ["lonca", "npc", "hapis"]
    gerilim: 2
    yalniz_tohum: true
    npc: ["kaya_demir"]
    kart: { tr: "Soğuk fırın", en: "The cold furnace" }
    sahne: "kaya_soguk_firin_1"
    sahneler:
      - id: "kaya_soguk_firin_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Defterdar'ın notu seni nerede olursan ol buluyor; tek satır: \"Fırına gelmen lazım.\" Haddehane gece vardiyasında bile sessiz; vinçler duruyor, yalnızca soğuk fırının önünde bir fener yanıyor.", en: "A note from the Ledger finds you wherever you are, one line: \"Come to the furnace.\" The mill is quiet even for the night shift. The cranes are still, and the only light is a lantern outside the cold furnace." }
          - metin: { tr: "Nöbette Örs var. Anahtarı uzatırken sesini alçaltıyor: \"Başçavuş on gündür uyumuyor. Bir şey çiziyor.\"", en: "Anvil has the watch. He keeps his voice down as he hands over the key. \"Gunny hasn't slept in ten days. He's drawing something.\"" }
            kosul: { bayrak: "ors_borclu" }
          - metin: { tr: "Fırının önündeki nöbetçi anahtarı sana uzatıyor ve gözlerini kaçırıyor. \"On gündür uyumuyor,\" diyor. \"Bir şey çiziyor.\"", en: "The guard outside the furnace hands you the key and won't meet your eyes. \"Hasn't slept in ten days,\" he says. \"He's drawing something.\"" }
            kosul: { bayrak_yok: "ors_borclu" }
          - { tr: "İçeride {npc:kaya_demir} bir mum ışığında, sırtı kapıya dönük oturuyor. Fırının isli iç duvarları baştan sona çizgilerle kaplı: bir çivinin ucuyla kazınmış bir kıyı, {yer:kordon|den} {yer:sanayi|e} uzanan siperler, geri çekilme hatları, köşelerde küçük rakamlar: 3.000 tüfek, 400 kapı.", en: "Inside, {npc:kaya_demir} sits by a candle with his back to the door. The sooty inner walls of the furnace are covered end to end in lines: a coastline scratched in with the tip of a nail, trenches running from {yer:kordon} to {yer:sanayi}, fallback lines, little numbers in the corners. 3,000 rifles. 400 Gates." }
          - { tr: "\"Bir asker hapiste de askerdir,\" diyor, dönmeden. \"Ne olduğumu bırakamıyorum. Sen de bırakmamı istemedin; isteseydin beni öldürürdün.\"", en: "\"A soldier in a cell is still a soldier,\" he says without turning around. \"I can't stop being what I am. And you didn't want me to. If you had, you'd have killed me.\"" }
        sezgiler:
          - kosul: { stat: { per: 160 } }
            metin: { tr: "[ALG] Plan iyi. İyiden de öte: ikinci hat {yer:kordon|in} eski iskelesinin altından geçiyor; senin hiç aklına gelmemiş bir yerden.", en: "[PER] The plan's good. Better than good: the second line runs under {yer:kordon|pos} old pier, somewhere that never once crossed your mind." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷na dört duvar verdin; dördünü de kullanmış. böyle bir adamı kilitleyebilirsin. ne için yapıldığını kilitleyemezsin.", en: "y̷ou gave him four walls. he used all four. you can lock up a man like this. you can't lock up what he was made for." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu adam Konsey'i basacaktı. Şimdi Konsey'i nasıl koruyacağını çiziyor. İnsanlar tuhaf.\"", en: "\"This man was going to storm the Council. Now he's drawing how to defend it. People are strange.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ona bakınca ne görüyorum biliyor musun? Seni. Yirmi yıl sonra.\"", en: "\"You know what I see when I look at him? You. Twenty years from now.\"" }
        secenekler:
          - id: "kopya"
            etiket: { tr: "Duvarı kopyalat; planı subaylara götür", en: "Have the wall copied. Take it to the officers" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { duzen: 3, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
              - xp_seviye: 20
            sonraki: "kaya_soguk_firin_kopya"
          - id: "sil"
            etiket: { tr: "Duvarı sil. Sen bir tutuklusun, general değil", en: "Wipe the wall. You're a prisoner, not a general" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - iliski: { kaya_demir: { korku: 4, guven: -6 } }
            sonraki: "kaya_soguk_firin_sil"
          - id: "lamba"
            etiket: { tr: "Ona bir lamba, kâğıt ve bir sandalye getir", en: "Bring him a lamp, paper, and a chair" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { kaya_demir: { guven: 5, baglilik: 3 } }
              - xp_seviye: 20
            sonraki: "kaya_soguk_firin_lamba"
          - id: "ac"
            etiket: { tr: "Kapıyı açık bırak: \"Git, hattını kendin kur.\"", en: "Leave the door open. \"Go build your line yourself.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 30 } } }
            etkiler:
              - bayrak_kaldir: "kaya_hapiste"
              - bayrak: "kaya_firin_plani"
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { lonca: -2 }
              - iliski: { kaya_demir: { guven: 10, baglilik: 6, saygi: 4 } }
              - xp_seviye: 25
            sonraki: "kaya_soguk_firin_acik"

      - id: "kaya_soguk_firin_kopya"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısından sonra Defterdar iki çizerle geliyor. Fenerin ışığında duvarı siper siper kâğıda geçiriyorlar; {npc:kaya_demir} her yanlış çizgiyi sesini yükseltmeden düzeltiyor.", en: "After midnight the Ledger shows up with two draftsmen. By lantern light they copy the wall onto paper, trench by trench, and {npc:kaya_demir} corrects every wrong line without raising his voice." }
          - { tr: "Şafakta kopya bitiyor. Defterdar başlığa ne yazacağını soruyor ve {npc:kaya_demir} başını kaldırmıyor: \"Benim adımı yazmayın. Kimse bir tutuklunun planını izlemez.\"", en: "The copy's done by dawn. The Ledger asks what to put at the top, and {npc:kaya_demir} doesn't look up. \"Don't put my name on it. Nobody follows a prisoner's plan.\"" }
        secenekler:
          - id: "ad_yaz"
            etiket: { tr: "Adını yaz", en: "Put his name on it" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 2 } }
            sonraki: "@akis"
          - id: "adsiz"
            etiket: { tr: "Başlığı boş bırak", en: "Leave the top blank" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_sil"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir kova su ve bir bez istiyorsun. {npc:kaya_demir} kalkıp kenara çekiliyor ve her çizginin kayboluşunu izliyor: önce geri çekilme hatları, sonra siperler, en son kıyı.", en: "You ask for a bucket of water and a rag. {npc:kaya_demir} gets up, steps aside, and watches every line disappear: the fallback lines first, then the trenches, the coastline last." }
          - { tr: "Duvar yeniden isli ve boş olduğunda başını sallıyor. \"Doğru,\" diyor. \"Ben de öyle yapardım.\"", en: "When the wall's black and blank again, he nods. \"Correct,\" he says. \"I'd have done the same.\"" }
          - { tr: "Kapıya dönerken arkandan sesleniyor: \"İkinci hat eski iskelenin altından geçmeli. Geçmezse {yer:kordon} bir gecede düşer.\"", en: "As you turn for the door, he calls after you. \"The second line has to run under the old pier. If it doesn't, {yer:kordon} falls in one night.\"" }
        secenekler:
          - id: "kilitle"
            etiket: { tr: "Hiçbir şey söyleme; kapıyı kilitle", en: "Say nothing. Lock the door" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
            sonraki: "@akis"
          - id: "iskele"
            etiket: { tr: "\"Eski iskele. Tamam.\"", en: "\"The old pier. Got it.\"" }
            etkiler:
              - bayrak: "kaya_firin_plani"
              - ahlak: { insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_lamba"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir saat sonra fırının içinde bir gaz lambası, masa yerine ters çevrilmiş bir sandık, bir sandalye ve bir deste kâğıt var. {npc:kaya_demir} oturmadan önce sandalyeye bir süre bakıyor; bir sandalyenin bir teklif olduğunu anlamış gibi.", en: "An hour later the furnace has a kerosene lamp, an upturned crate for a desk, a chair, and a stack of paper. {npc:kaya_demir} looks at the chair a while before he sits, like he's figured out that a chair is an offer." }
          - { tr: "Gece boyunca çiziyor; sen kapının dibinde oturuyorsun. Bir ara kalemi bırakmadan konuşuyor: \"Bir daha asla yanlış bir emre uymayacağım diye yemin etmiştim. Yanlış emri veren biri olacağım hiç aklıma gelmedi.\"", en: "He draws all night while you sit by the door. At some point he talks without putting the pencil down. \"I swore I'd never follow a wrong order again. It never crossed my mind I'd be the one giving it.\"" }
          - { tr: "Şafakta sana otuz sayfa uzatıyor; her sayfanın köşesinde bir numara, her siperin yanında bir isim için boşluk.", en: "At dawn he hands you thirty pages, a number in the corner of every one, and next to every trench, a blank for a name." }
        secenekler:
          - id: "al"
            etiket: { tr: "Sayfaları al; subaylara götür", en: "Take the pages to the officers" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "\"Kendin vereceksin. Zamanı gelince.\"", en: "\"You'll hand them over yourself. When it's time.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { kaya_demir: { baglilik: 3 } }
            sonraki: "@akis"

      - id: "kaya_soguk_firin_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Anahtarı kilitten çıkarıp ona atıyorsun ve kapıyı ardına kadar açık bırakıyorsun. {npc:kaya_demir} anahtarı havada yakalamıyor; anahtar ayaklarının dibine düşüyor ve uzun süre orada kalıyor.", en: "You pull the key out of the lock, toss it to him, and leave the door wide open. {npc:kaya_demir} doesn't catch it. It drops at his feet and stays there a long time." }
          - { tr: "\"Komutan değilim,\" diyor sonunda. \"Değilsin,\" diyorsun. \"Mühendisimsin. Hat senin, emir benim.\"", en: "\"I'm not a commander,\" he finally says. \"You're not,\" you say. \"You're my engineer. The line's yours. The orders are mine.\"" }
          - { tr: "Ayağa kalkarken sağ dizi bir kez kilitleniyor, sonra açılıyor. Haddehaneden {yer:kordon|e} doğru topallayarak ama bir bayrak direği kadar dik yürüyor; nöbetçiler selam mı vermeleri gerektiğini bilemeden kenara çekiliyor.", en: "When he stands, his right knee locks once, then gives. He walks out of the mill toward {yer:kordon}, limping but straight as a flagpole, and the guards step aside, not sure whether they're supposed to salute." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Arkasından bak", en: "Watch him go" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "selam"
            etiket: { tr: "Nöbetçilere selam vermelerini söyle", en: "Tell the guards to salute" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "@akis"
