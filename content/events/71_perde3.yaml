      - id: "buyuk_ihanet_ellinci"
        yer: "kule"
        paragraflar:
          - { tr: "Birkaç ay önce ellinci kata tırmanmak koca bir gününü alırdı; bu gece kırk saniye sürüyor. Kule'nin canavarları seni görünce duvarlara yapışıp yol veriyor.", en: "Climbing to the fiftieth floor used to take a whole day, a few months back. Tonight it takes forty seconds. The monsters inside the Spire see you coming and flatten themselves against the walls to let you by." }
          - { tr: "Çok-evren geçidinin önündeki salon yağmalanmış, nöbetçiler bayıltılmış ya da daha kötüsü. Ardına kadar açık geçitten Kadim öncüleri süzülüyor; telaşsız, davet edilmiş misafirler gibi.", en: "The hall in front of the multiverse gate has been ransacked, the guards knocked out or worse. The gate's wide open, and Ancient vanguard troops are filing through it. Not in a rush. Like they were invited." }
          - metin: { tr: "Geçidin hemen önünde siyah ceketli biri sırtını sana dönmüş duruyor. Başında kendisine ait olmayan bir taç var: ince, gümüş, Kadim işi ve ödünç. Arkasını dönmeden konuşuyor: \"Sen de hızlısın ha? Ama bu sefer ben daha hızlıyım.\"", en: "Right in front of the gate, back to you, stands somebody in a black jacket. On his head is a crown that isn't his: Ancient work, thin, silver, and borrowed. He talks without turning around. \"You're fast too, huh? This time I'm faster.\"" }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt|in} yeri boş. O öldükten sonra Küresel Sıralama'da yerine başka biri tırmandı; adını öğrenmeye kimse zahmet etmedi, herkes ona sırasıyla seslendi: İkinci. Şimdi geçidin önünde o duruyor, başında Kadim işi gümüş bir taçla.", en: "{npc:aras_kurt|pos} spot is empty. Since he died, somebody else climbed into it on the Global Ranking. Nobody bothered to learn her name; everybody just called her by her rank: Number Two. Now she's the one standing in front of the gate, a silver crown of Ancient make on her head." }
            kosul: { npc_olu: "aras_kurt" }
        secenekler:
          - id: "aras"
            etiket: { tr: "Ceketin sahibine seslen", en: "Call out to the man in the jacket" }
            goster: { npc_hayatta: "aras_kurt" }
            kronik: { tr: "Ellinci katta ebedi rakibinle yüz yüze geldin; başındaki taç ona ait değildi.", en: "On the fiftieth floor, you came face-to-face with your lifelong rival. The crown on his head wasn't his." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "ihanet_aras"
            sonraki: "ihanet_aras_1"
          - id: "ikinci"
            etiket: { tr: "Taçlı kadına yaklaş", en: "Walk toward the woman in the crown" }
            goster: { npc_olu: "aras_kurt" }
            kronik: { tr: "Taçlı kadına yürüdün: Sıralama'nın İkincisi'ne. Şehri, adını bile bilmediğin biri satmıştı.", en: "You walked up to the crowned woman, the Ranking's Number Two. The city had been sold by someone whose name you didn't even know." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "ihanet_ikinci_sira"
            sonraki: "ihanet_ikinci_1"

      # ---------------------------------------------------------------- Hain: Mert (Sessiz Ağ satıldı)
      - id: "ihanet_mert_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sinyal seni {yer:eski_sehir|in} altındaki eski telefon santraline götürüyor. Sessiz Ağ'ın arşivi üç kat aşağıda, duvarları kurşun levhalarla kaplı bir odada. Aylar boyunca burayı yalnızca on iki kişi bildi.", en: "The signal takes you under {yer:eski_sehir} to the old telephone exchange: the Quiet Network's archive, three floors down, in a room lined with lead sheeting. For months, exactly twelve people knew this place existed." }
          - { tr: "Kapı ardına kadar açık. Radyocular yerde yatıyor, kulaklarından ince bir kan sızmış; gözleri açık ama hiçbir şey görmüyor. Rafların arasında uzun boylu, yüzsüz üç gümüş figür, hiç acele etmeden ve bir kütüphanecinin özeniyle sürücüleri teker teker söküyor.", en: "The door's wide open. The radio crew is on the floor, thin blood trickling from their ears, eyes open and seeing nothing. Between the racks, three tall, faceless silver figures are pulling drives one at a time. No rush. The care of a librarian." }
          - metin: { tr: "{npc:mert_kilic} konsolun başında ekrana eğilmiş, parmakları klavyenin üstünde donup kalmış. Sana döndüğünde yüzü sırılsıklam: \"Bana kodu gösterdiler,\" diyor. \"Gerçek kodu, kaynağı. Karşılığında tek istedikleri bir listeydi.\"", en: "{npc:mert_kilic} is hunched over the console, fingers frozen above the keys. He turns toward you, face wet. \"They showed me the code,\" he says. \"The real code. The source. All they wanted was a list.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Konsolun başında kimse yok. Bir kayıt cihazı aynı tanıdık sesi döne döne çalıyor: \"Yetki kodu: sıfır, yedi, kırmızı.\" {npc:mert_kilic} anahtarlarını ölmeden önce teslim etmiş; kime, neden verdiğini artık kimse ona soramaz.", en: "Nobody's at the console. Just a recorder and a familiar voice on a loop: \"Authorization: zero, seven, red.\" {npc:mert_kilic} handed over his keys before he died. Who to, and why, nobody can ask him now." }
            kosul: { npc_olu: "mert_kilic" }
          - metin: { tr: "Onu bu masaya sen oturtmuştun. Kadim sözcüsüyle el sıkıştığın gün bu gecenin geleceğini biliyordun; bilmediğin tek şey, bu kadar çabuk geleceğiydi.", en: "You're the one who put him at that table. The day you shook hands with the Ancient spokesman, you knew this night was coming. You just didn't know it'd come this fast." }
            kosul: { bayrak: "mert_oyuncu_satti" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hükümsüzleştirici ×3 · Kadim öncüsü", en: "[ANALYSIS] Nullifier ×3 · Ancient vanguard" }
            satirlar:
              - { tr: "Görev: veri toplama. Tanık politikası: sıfır.", en: "Mission: data retrieval. Witness policy: zero." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Listede 312 isim var: Sessiz Ağ'ın bütün üyeleri, bütün muhbirleri, Sistem'i okumaya kalkışmış her insan. Kadimler'in hasat sırası bu.", en: "The list is 312 names. Every Quiet Network member, every informant, every human who ever tried to read the System. That's the Ancients' harvest order." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "listede senin adın yok. gördün mü? senin adın yok.", en: "your name isn't on the list. did you notice that? yours isn't on it." }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Gümüş figürlere dal", en: "Go straight at the silver figures" }
            kronik: { tr: "Sessiz Ağ'ın arşivinde Kadim öncülerinin üstüne yürüdün; kurşun duvarlı kütüphane bir anda savaş alanına döndü.", en: "You charged the Ancient vanguard in the Quiet Network's archive. In an instant, a lead-walled library became a battlefield." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "civile"
            tur: "gosteris"
            etiket: { tr: "Üçünü birden duvara çivile", en: "Pin all three to the wall at once" }
            gerekli: { stat: { str: 260 } }
            kronik: { tr: "Tek hamlede üç Kadim öncüsünü birden duvara çiviledin; Kadimler o odada ölçemedikleri bir şey gördü.", en: "In one move, you pinned all three of the Ancient vanguard to the wall. The Ancients saw something in that room they couldn't measure." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 40
              - dikkat: 4
            sonraki: "ihanet_mert_2"
          - id: "neden"
            etiket: { tr: "\"Neden, {npc:mert_kilic}?\"", en: "\"Why, {npc:mert_kilic}?\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Kadim öncüleri etrafını sarmışken {npc:mert_kilic|e} nedenini sordun; savaş bir cevabı bekleyebilirdi.", en: "With the Ancient vanguard all around you, you asked {npc:mert_kilic} why. The fight could wait for an answer." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { mert_kilic: { guven: 5 } }
            sonraki: "ihanet_mert_konus"
          - id: "kayit"
            etiket: { tr: "Önce ölü adamın sesini sustur", en: "Shut the dead man's voice up first" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|in} kayıtlı sesini paramparça ettin; ölü bir dostun sesi artık düşmana kapı açmayacaktı.", en: "You smashed the recording of {npc:mert_kilic|pos} voice. A dead friend's voice wasn't going to open any more doors for the enemy." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - itibar: { sessiz_ag: 3 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_konus"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "\"Üç yüz on iki isim,\" diyor {npc:mert_kilic}. \"Biliyorum. Hepsini ben yazdım; kimin hangi gece hangi frekansı dinlediğine varana kadar.\" Gözlüğünü çıkarıp siliyor, takıyor, sonra yine çıkarıyor.", en: "\"Three hundred twelve names,\" {npc:mert_kilic} says. \"I know. I wrote every one of them down, right down to who listened to what frequency on which night.\" He takes his glasses off, wipes them, puts them back on, takes them off again." }
          - { tr: "\"Ömrüm boyunca bir duvara baktım. Onlar bana duvarın arkasını gösterdi, kodun ilk satırlarını. Sen olsan...\" Cümlenin sonunu getirmiyor. \"Bir de korkuttular. Listeye senin adını yazmayacaklarına söz verdiler. Yalnız seninkini.\"", en: "\"My whole life, I've been staring at a wall. They showed me what's behind it. The first lines of the code. If you'd been...\" He doesn't finish. \"And they scared me. They promised your name wouldn't be on the list. Just yours.\"" }
          - { tr: "Gümüş figürler aktarımın bitmesini bekliyor; ilerleme çubuğu yüzde seksen dokuzda. Sana dönüp bakmıyorlar bile, tıpkı bir biçerdöverin korkuluğa bakmadığı gibi.", en: "The silver figures are waiting for the transfer to finish. The progress bar reads eighty-nine percent. They don't even look at you. The same way a combine doesn't bother looking at a scarecrow." }
        secenekler:
          - id: "geri_cek"
            etiket: { tr: "\"Aktarımı geri çek. Şimdi.\"", en: "\"Pull the transfer. Right now.\"" }
            gerekli: { iliski_min: { mert_kilic: { guven: 30 } } }
            kronik: { tr: "{npc:mert_kilic|e} aktarımı geri çektirdin; ilerleme çubuğu yüzde seksen dokuzda durdu ve üç yüz on iki isim, şimdilik, Kadimler'e ulaşmadı.", en: "You got {npc:mert_kilic} to pull the transfer. The bar froze at eighty-nine percent, and for the moment, three hundred twelve names stayed out of the Ancients' hands." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 3, kadim_tehdit: -3 }
              - iliski: { mert_kilic: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "mert_kilic", id: "olay:buyuk_ihanet", agirlik: 50 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "bitti"
            etiket: { tr: "\"Konuşma bitti.\" Gümüşlere dön", en: "\"We're done talking.\" Turn on the silver ones" }
            kronik: { tr: "Açıklamasını yarıda kesip gümüşlere döndün; o gece {npc:mert_kilic|in} nedenleri seni ilgilendirmiyordu.", en: "You cut {npc:mert_kilic|pos} explanation short and turned on the silver ones. That night, his reasons weren't your problem." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { mert_kilic: { korku: 8 } }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "bitirsin"
            etiket: { tr: "Aktarım bitsin; listeyi sonra geri alırsın", en: "Let it finish. You'll take the list back later" }
            kronik: { tr: "Listenin Kadimler'e gitmesine göz yumdun; sonra geri alırım dedin, ama üç yüz on iki isim o gece el değiştirdi.", en: "You let the list go to the Ancients. You told yourself you'd take it back later, but that night three hundred twelve names changed hands." }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 2 }
              - bayrak: "mert_listesi_teslim"
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 4 }
              - iliski: { mert_kilic: { guven: -5, korku: 5 } }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_2"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Son gümüş figür de yere seriliyor, yüzsüz başı rafların arasına yuvarlanıyor. Bir anlık sessizliğin ardından odanın kurşun duvarları çan gibi çınlıyor ve içeri, sesleri yutarak bir şey giriyor.", en: "The last silver figure goes down, its faceless head rolling between the racks. A second of silence. Then the room's lead walls ring like a bell, and something comes in, swallowing every sound on its way." }
          - { tr: "Uzun, ince, saydam bir şey; içinde hiçbir şeyi yansıtmayan bir boşluk dönüyor. Telsizler susuyor, kendi kalp atışını bile duyamaz oluyorsun. Kadimler tanıkları böyle temizler.", en: "Tall, thin, see-through, with a hollow turning inside it that doesn't reflect a thing. The radios die. You can't even hear your own heartbeat. This is how the Ancients clean up witnesses." }
          - metin: { tr: "{npc:mert_kilic} konsolun arkasına çömelmiş, iki eliyle kulaklarını kapatmış. Dudakları kıpırdıyor ama ses çıkmıyor; bir özür belki, belki bir dua.", en: "{npc:mert_kilic} is crouched behind the console, both hands over his ears. His lips are moving. An apology, maybe a prayer. No sound comes out." }
            kosul: { npc_hayatta: "mert_kilic" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Sessizlik Avcısı · A kademesi muhafız", en: "[ANALYSIS] Silencer · A-Grade enforcer" }
            satirlar:
              - { tr: "Sesi, kaydı ve hafızayı siler. Senin hafızanı silemiyor. Neden olduğunu henüz bilmiyor.", en: "Erases sound, records, and memory. It can't erase yours. It hasn't figured out why yet." }
        secenekler:
          - id: "karsisina"
            etiket: { tr: "Karşısına dik", en: "Plant yourself in front of it" }
            kronik: { tr: "Sessizlik Avcısı'nın karşısına dikildin; {yer:eski_sehir|in} altında, sesi yutan şeye sırtını dönmedin.", en: "You planted yourself in front of the Silencer. Under {yer:eski_sehir}, you didn't turn your back on the thing that swallowed sound." }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+4"], ortam: ["dar_gecit", "karanlik"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }
          - id: "mert_arkana"
            etiket: { tr: "{npc:mert_kilic|i} arkana al ve öyle dövüş", en: "Get {npc:mert_kilic} behind you, then fight" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Seni satan adamı arkana alıp öyle dövüştün; {npc:mert_kilic} o gece tek kalkanının senin sırtın olduğunu gördü.", en: "You put the man who sold you out behind you and fought. That night, {npc:mert_kilic} saw that your back was the only shield he had." }
            etkiler:
              - ahlak: { merhamet: 5 }
              - iliski: { mert_kilic: { guven: 15, baglilik: 12 } }
              - hafiza: { npc: "mert_kilic", id: "olay:buyuk_ihanet", agirlik: 70 }
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+4"], ortam: ["dar_gecit", "karanlik"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }
          - id: "yol_soyle"
            etiket: { tr: "Yolunu yüksek sesle söyle; sessizliği yırt", en: "Speak your Path out loud. Tear the silence open" }
            goster: { bayrak: "yol_olustu" }
            kronik: { tr: "Yolunu ilk kez gerçek bir düşmanın yüzüne haykırdın; o koca sessizlikte ses çıkaran tek şey oydu.", en: "You spoke your Path into a real enemy's face for the first time. In all that silence, it was the one thing that made a sound." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 4
              - xp_seviye: 20
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_3"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sessizlik Avcısı çatlayınca içindeki boşluk dışarı taşıyor; derken bütün sesler bir anda geri geliyor: telsizlerin cızırtısı, radyocuların iniltisi, kendi soluğun. Avcının göğsünün ortasında, gümüş tozların arasında küçük bir sürücü duruyor.", en: "The Silencer cracks, and the hollow inside it spills out. Then every sound comes back at once: the radios crackling, the crew groaning, your own breathing. In the middle of its chest, in a drift of silver dust, sits a little drive." }
          - { tr: "Liste bu: üç yüz on iki isim. Avucunda bir kibrit kutusu kadar hafif.", en: "The list. Three hundred twelve names. Light as a matchbox in your palm." }
          - metin: { tr: "{npc:mert_kilic} titreyen dizlerle konsolun arkasından doğruluyor. Ellerini iki yana açmış; ne kaçmaya yeltenmiyor ne yalvarmaya. \"Ne istersen,\" diyor. \"Haklısın. Ne istersen.\"", en: "{npc:mert_kilic} gets up from behind the console, knees shaking. He holds his hands out at his sides. He's not trying to run and he's not begging. \"Whatever you want,\" he says. \"You're right. Whatever you want.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Yerdeki radyocular yavaş yavaş doğruluyor. İçlerinden biri listeyi elinde görünce gülmeye başlıyor; gülüşü çok geçmeden hıçkırığa dönüyor.", en: "The crew on the floor are starting to sit up. One of them sees the list in your hand and starts laughing, and the laugh turns into a sob." }
            kosul: { npc_olu: "mert_kilic" }
        secenekler:
          - id: "hukum"
            etiket: { tr: "Hükmü sen ver; hemen burada", en: "Pass sentence yourself. Right here" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Arşivin ortasında hükmü kendi elinle verdin; {npc:mert_kilic|e} ikinci bir şans tanımadın.", en: "Right there in the archive, you passed sentence on {npc:mert_kilic} yourself. You left no room for a second chance." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4 }
              - npc_ol: "mert_kilic"
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 4, siginak: -4, lonca: 3 }
              - degisken: { kadim_tehdit: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "cift_ajan"
            etiket: { tr: "\"Kadimlere sahte bir liste götüreceksin.\"", en: "\"You're taking the Ancients a fake list.\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|in} cebine sahte bir liste koyup onu Kadimler'e geri yolladın; hasat sırası artık senin yazdığın bir yalanla başlıyordu.", en: "You put a fake list in {npc:mert_kilic|pos} pocket and sent him back to the Ancients. Their harvest order would now start with a lie you wrote." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "mert_cift_ajan"
              - bayrak: "ihanet_onlendi"
              - degisken: { kadim_tehdit: -6, hayatta_kalan: 2 }
              - iliski: { mert_kilic: { korku: 15, guven: 8, saygi: 10 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "ag_yargilasin"
            etiket: { tr: "Sessiz Ağ kendi hainini yargılasın", en: "Let the Quiet Network judge its own" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Hainini Sessiz Ağ'ın kendisi tartsın istedin; {npc:mert_kilic|i} onların yargısına bıraktın.", en: "You wanted the Quiet Network to weigh its own traitor, so you left {npc:mert_kilic} to their judgment." }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 1 }
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { saygi: 6, guven: -4 } }
              - degisken: { kadim_tehdit: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "git"
            etiket: { tr: "\"Git. Onların yanına. Bir daha görmeyeyim.\"", en: "\"Go. Go to them. I never want to see you again.\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|i} Kadimler'in yanına yolladın; giderken bir daha karşına çıkmamasını söyledin.", en: "You sent {npc:mert_kilic} off to the Ancients and told him never to show his face again." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - npc_fraksiyon: { mert_kilic: "kadimler" }
              - npc_gitti: "mert_kilic"
              - iliski: { mert_kilic: { guven: -10, korku: 10 } }
              - degisken: { kadim_tehdit: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yak"
            etiket: { tr: "Listeyi yak; ölü adamın anahtarlarını da", en: "Burn the list. The dead man's keys too" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Ölü bir dostun anahtarlarını listeyle birlikte yaktın; o isimler de aynı ateşte kül oldu.", en: "You burned a dead friend's keys along with the list. Those names went up in the same fire." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 8 }
              - degisken: { kadim_tehdit: -3, hayatta_kalan: 2 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "sakla"
            etiket: { tr: "Listeyi sakla; bir gün işe yarar", en: "Keep the list. It'll come in handy someday" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Üç yüz on iki ismi cebine koydun; o insanların hayatı artık senin cebindeydi ve hiçbirinin haberi yoktu.", en: "You pocketed three hundred twelve names. Those people's lives were in your pocket now, and none of them knew it." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 3 }
              - bayrak: "ihanet_onlendi"
              - bilgi: "mert_listesi"
              - itibar: { sessiz_ag: -4 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_mert_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sessizlik seni yutuyor. Ne düştüğünü duyuyorsun ne yere çarptığını. Bir an kurşun duvarın soğuğu yanağında; gözlerini yeniden açtığında oda bomboş.", en: "The silence swallows you. You don't hear yourself fall, and you don't hear yourself hit the floor. One second the lead wall is cold on your cheek, and the next time you open your eyes, the room is empty." }
          - { tr: "Raflar boşalmış, sürücüler de liste de gitmiş. Radyocuların yarısı da yok. Kalanlar sana bakıyor ama tek soru sormuyor; sormalarından da beter bir şey bu.", en: "The racks are empty, the drives gone. The list is gone. Half the radio crew is gone too, and the ones still here look at you and don't ask anything. That's worse than if they asked." }
          - metin: { tr: "{npc:mert_kilic|in} konsolu da boş. Titrek bir el yazısıyla bir not bırakmış: \"Özür dilerim. Beni de aldılar. Belki en iyisi budur.\"", en: "{npc:mert_kilic|pos} console is empty too. He left a note, the handwriting shaky: \"I'm sorry. They took me too. Maybe that's for the best.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
        secenekler:
          - id: "kalk_mert"
            etiket: { tr: "Kalk. Bu daha bitmedi", en: "Get up. This isn't over" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Sessiz Ağ'ın arşivini Kadimler'e kaptırdın; {npc:mert_kilic} da listeyle birlikte gitmişti.", en: "You lost the Quiet Network's archive to the Ancients. {npc:mert_kilic} was gone, and so was the list." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - npc_fraksiyon: { mert_kilic: "kadimler" }
              - npc_gitti: "mert_kilic"
              - bayrak: "mert_listesi_teslim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
              - itibar: { sessiz_ag: -10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "kalk"
            etiket: { tr: "Kalk. Kalanları topla", en: "Get up. Gather up whoever's left" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Sessizliğin içinde düştün ve arşivi Kadimler'e kaptırdın; üç yüz on iki isim artık onların elindeydi.", en: "You went down in the silence and lost the archive to the Ancients. Three hundred twelve names were in their hands now." }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_listesi_teslim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
              - itibar: { sessiz_ag: -10 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Kaya (Konsey'e darbe)
      - id: "ihanet_kaya_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "{npc:kaya_demir} iki elini birden masaya dayıyor. Sesi bir emir kadar sakin: \"Konsey bu gece itibarıyla dağıldı. Kimse ölmeyecek. Tabii biri aptallık etmezse.\"", en: "{npc:kaya_demir} plants both hands on the table. His voice is as calm as an order. \"The Council's dissolved as of tonight. Nobody's going to die. Unless somebody does something stupid.\"" }
          - { tr: "Arkasında Çekirdek'in mavi ışığı kızıla dönüyor. Kristalin yüzeyine bir mühür gömülmüş, Lonca'nın demir işareti: Çekirdek'in muhafızını kendine bağlamış.", en: "Behind him, the Core's blue light goes red. There's a seal sunk into the crystal's surface, the Guild's iron mark. He's bound the Core's guardian to himself." }
          - metin: { tr: "Demir Yemin'den iki asker {npc:elif_sari|in} iki yanına dikilmiş. {npc:elif_sari} yerinden kalkmıyor; ne yapacağını görmek ister gibi yalnızca sana bakıyor.", en: "Two Iron Oath soldiers are standing on either side of {npc:elif_sari}. She doesn't get up. She just looks at you, like she wants to see what you'll do." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Bu planın kollarından biri senindi. {npc:kaya_demir} başıyla, ikinci kolun başında durman gereken yeri gösteriyor. Vakit geldi, ortak.", en: "One arm of this plan was yours. {npc:kaya_demir} nods you toward the spot where you're supposed to be leading the second column. It's time, partner." }
            kosul: { bayrak: "kaya_darbe_ortagi" }
          - metin: { tr: "Konsey'i uyarmıştın ama uyarın kâğıt üstünde kaldı. {npc:kaya_demir} ihbarı biliyor; sana bakarken gözlerinde öfke değil, hayal kırıklığı var. \"Önce bana gelebilirdin,\" diyor.", en: "You warned the Council. The warning stayed on paper. {npc:kaya_demir} knows you turned him in, and the look he gives you isn't anger. It's disappointment. \"You could've come to me first,\" he says." }
            kosul: { bayrak: "kaya_ihbar_edildi" }
          - { tr: "\"Altmış beş gün,\" diyor. \"Bu masa altmış beş günde iki karar alabildi, ikisi de su tayınıyla ilgili. Bu şehri ben ayakta tutacağım. Senden diz çökmeni istemiyorum; yanımda durmanı istiyorum.\"", en: "\"Sixty-five days,\" he says. \"This table made two decisions in sixty-five days, and both of them were about water rationing. I'm going to hold this city. I'm not asking you to kneel. I'm asking you to stand next to me.\"" }
          - metin: { tr: "{npc:yanki}: dürüst bir adam. en tehlikelileri bunlardır.", en: "{npc:yanki}: an honest man. that's the most dangerous kind." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Mühür onu da yakıyor: avuç içi su toplamış. Muhafızı tutmak her dakika canından bir parça koparıyor.", en: "The seal's burning him too. His palm is blistered. Every minute he holds that guardian costs him a piece of his life." }
        secenekler:
          - id: "yaninda"
            etiket: { tr: "Yanına geç; şehri birlikte tutun", en: "Step up beside him. Hold the city together" }
            kronik: { tr: "{npc:kaya_demir|in} yanına geçtin; Konsey'in dağıldığı gece demir yasanın altına sen de omuz verdin.", en: "You stepped up beside {npc:kaya_demir}. The night the Council fell, you put your shoulder behind the iron law too." }
            etkiler:
              - ahlak: { duzen: 8, merhamet: -4, insanlik: -2 }
              - itibar: { lonca: 15, siginak: -20, sessiz_ag: -6 }
              - iliski: { kaya_demir: { saygi: 10, baglilik: 15, guven: 10 } }
              - hafiza: { npc: "kaya_demir", id: "olay:buyuk_ihanet", agirlik: 60 }
            sonraki: "ihanet_kaya_birlikte"
          - id: "ikna"
            etiket: { tr: "\"Bırak onları, başçavuş.\"", en: "\"Let 'em go, Gunny.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 40 } } }
            kronik: { tr: "Silah çekmeden, yalnızca sesinle {npc:kaya_demir|i} durdurdun; yirmi yıllık asker ilk kez saygı duyduğu birinden emir aldı.", en: "Without drawing a weapon, you stopped {npc:kaya_demir} with your voice alone. A twenty-year soldier took an order from somebody he respected for the first time." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 8, guven: 5 } }
            sonraki: "ihanet_kaya_teslim"
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Yalnızca muhafızlara bak; silahları düşsün", en: "Just look at the guards. Let their weapons drop" }
            gerekli: { stat: { wil: 280 } }
            kronik: { tr: "Demir Yemin'in muhafızlarına yalnızca baktın, silahları ellerinden düştü; o gece salondaki hiçbir asker gözünü sana kaldıramadı.", en: "You only looked at the Iron Oath's guards, and their weapons fell from their hands. That night, not one soldier in the hall could meet your eyes." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 4
              - iliski: { kaya_demir: { korku: 12, saygi: 6 } }
            sonraki: "ihanet_kaya_2"
          - id: "dagit"
            etiket: { tr: "Muhafızlarını dağıt", en: "Scatter his guards" }
            kronik: { tr: "Çekirdek salonunda Demir Yemin'in muhafızlarının üstüne yürüdün; darbenin önüne kendi bedeninle çıktın.", en: "You went at the Iron Oath's guards in the Core hall. You put your own body in the coup's way." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -3 }
              - savas: { dusmanlar: ["demir_yemin_muhafizi@oyuncu", "demir_yemin_muhafizi@oyuncu", "demir_yemin_muhafizi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ihanet_kaya_2", kaybet: "ihanet_kaya_yenilgi" }

      - id: "ihanet_kaya_2"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafızlar yerde. {npc:kaya_demir} önce onlara, sonra sana bakıyor; yüzünde öfke değil, hesap var. Avucunu kristale bastırıyor. \"İşin buraya varmasını istememiştim,\" diyor.", en: "The guards are down. {npc:kaya_demir} looks at them, then at you, and what's on his face isn't anger. It's math. He presses his palm to the crystal. \"I didn't want it to come to this,\" he says." }
          - { tr: "Çekirdek'in kızıl ışığı ayağa kalkıyor: mavi camdan, şehrin unutulmuş sokak adlarından, tahliye haritalarından örülmüş bir muhafız. Başı tavana değiyor; gövdesinde {yer:kiyikent|in} her mahallesi bir yara gibi parlıyor.", en: "The Core's red light gets up on its feet. A guardian woven out of blue glass, forgotten street names, and evacuation maps; its head brushes the ceiling, and every neighborhood in {yer:kiyikent} glows on its body like a wound." }
          - metin: { tr: "{npc:elif_sari} arkadan bağırıyor: \"Çekirdek'i kırarsan şehrin kalkanı da gider! Dikkat et!\"", en: "{npc:elif_sari} shouts from the back: \"Break the Core and the city's shield goes with it! Careful!\"" }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Çekirdek Muhafızı · bağlı: Lonca", en: "[ANALYSIS] Core Guardian · bound to: Iron Guild" }
            satirlar:
              - { tr: "Bağ, bağlayanın canından beslenir. Uzun bir savaş iki kişiyi öldürür.", en: "The bond feeds on its binder's life. A long fight kills two people." }
        secenekler:
          - id: "parcala"
            etiket: { tr: "Muhafızı parçala", en: "Tear the guardian apart" }
            kronik: { tr: "Çekirdek'in muhafızına saldırdın; darbeyi bitirmek için şehrin kalbini bile göze aldın.", en: "You went at the Core's guardian. To end the coup, you were willing to risk the city's own heart." }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["muhurlu_cekirdek@oyuncu+4"], kazan: "ihanet_kaya_3", kaybet: "ihanet_kaya_yenilgi" }
          - id: "muhur"
            tur: "gosteris"
            etiket: { tr: "Mührü kristalden tırnağınla kazı", en: "Pry the seal off the crystal with a fingernail" }
            gerekli: { stat: { int: 250 } }
            kronik: { tr: "Lonca'nın mührünü Çekirdek'ten tek hamlede kazıyıp söktün; muhafız kimseyi incitmeden yeniden ışığa karıştı.", en: "In one move, you scraped the Guild's seal off the Core. The guardian melted back into light without hurting anyone." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - xp_seviye: 40
              - iliski: { kaya_demir: { saygi: 10 } }
            sonraki: "ihanet_kaya_3"
          - id: "elif_cikar"
            etiket: { tr: "Önce {npc:elif_sari|i} salondan çıkar", en: "Get {npc:elif_sari} out of the hall first" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Dövüşten önce {npc:elif_sari|i} salondan çıkardın; Konsey kimi önce kurtardığını gördü.", en: "Before you fought, you got {npc:elif_sari} out of the hall. The Council saw who you saved first." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - iliski: { elif_sari: { guven: 10, baglilik: 6 } }
              - itibar: { siginak: 5 }
              - savas: { dusmanlar: ["muhurlu_cekirdek@oyuncu+5"], kazan: "ihanet_kaya_3", kaybet: "ihanet_kaya_yenilgi" }

      - id: "ihanet_kaya_3"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafız mavi bir kum gibi dağılıyor, Çekirdek'in ışığı ağır ağır maviye dönüyor. {npc:kaya_demir} dizlerinin üstüne çöküyor; burnundan kan akıyor, avucundaki mühür izi kömür karası kesilmiş.", en: "The guardian crumbles like blue sand, and the Core's light slowly turns blue again. {npc:kaya_demir} drops to his knees. His nose is bleeding, and the seal mark on his palm has gone black as coal." }
          - { tr: "\"İyi,\" diyor nefes nefese. \"İyi. Hiç değilse biri bu şehri tutabiliyor. Ben değilmişim, senmişsin.\" Kısa, acı bir gülüş. \"Yirmi yıl... Emre bir kez karşı geldim, o da bu gece.\"", en: "\"Good,\" he says, out of breath. \"Good. At least somebody can hold this city. Wasn't me. It's you.\" He laughs, short and bitter. \"Twenty years. One time I didn't follow orders. Tonight.\"" }
          - metin: { tr: "{npc:elif_sari} salonun öbür ucunda kollarını göğsünde kavuşturmuş, tek söz etmiyor. Kararı sana bıraktığını herkes görsün diye susuyor.", en: "{npc:elif_sari} stands at the other end of the hall, arms folded. She doesn't say a word. She's keeping quiet so everybody can see she's leaving this to you." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "devir"
            etiket: { tr: "Rütbesini sök; Lonca artık senin", en: "Strip his rank. The Guild's yours now" }
            kronik: { tr: "{npc:kaya_demir|i} devirip Demir Lonca'yı kendi eline aldın; şehirdeki silahların emri artık sendeydi.", en: "You toppled {npc:kaya_demir} and took the Iron Guild for yourself. The city's guns answered to you now." }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: 10, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 10, guven: -20, korku: 10 } }
              - ordu: { lonca_avcisi: 40 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "infaz"
            etiket: { tr: "Bir darbeyi bir darbe bitirir", en: "A coup ends with one blow" }
            kronik: { tr: "{npc:kaya_demir|i} Çekirdek'in önünde infaz ettin; Lonca korkuyla, Sığınak dehşetle seyretti.", en: "You executed {npc:kaya_demir} in front of the Core, with the Guild watching in fear and the Haven in horror." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 3 }
              - npc_ol: "kaya_demir"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: -10, siginak: -5, yukselenler: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "surgun"
            etiket: { tr: "\"Şehri terk et. Bu gece.\"", en: "\"Leave the city. Tonight.\"" }
            kronik: { tr: "Ne öldürdün ne affettin: {npc:kaya_demir|i} o gece şehirden sürdün.", en: "You didn't kill {npc:kaya_demir} and you didn't forgive him. You exiled him that night." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - npc_gitti: "kaya_demir"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: -5, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 5, guven: -10 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "af"
            etiket: { tr: "\"Kalk. Sana ihtiyacım olacak.\"", en: "\"Get up. I'm gonna need you.\"" }
            kronik: { tr: "Ayağa kaldırıp affettiğin {npc:kaya_demir} hayatını sana borçlu olduğunu biliyordu.", en: "You pardoned {npc:kaya_demir} and pulled him to his feet. He knew he owed you his life." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "kaya_affedildi"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: -6, lonca: 6 }
              - iliski: { kaya_demir: { guven: 15, baglilik: 20, saygi: 10 } }
              - hafiza: { npc: "kaya_demir", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey_karar"
            etiket: { tr: "Kararı {npc:elif_sari} ve Konsey versin", en: "Let {npc:elif_sari} and the Council decide" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Darbeciyi Konsey'in yargısına bıraktın; gemi tepedeyken bile hükmü bir mahkemeye verdin.", en: "You left the man behind the coup to the Council's judgment. Even with the ship overhead, you handed the verdict to a court." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "kaya_konseye_teslim"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 10, lonca: -4 }
              - iliski: { elif_sari: { guven: 8, saygi: 8 }, kaya_demir: { saygi: 4 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_teslim"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Ortalığa uzun bir sessizlik çöküyor. {npc:kaya_demir} önce sana, ardından kristaldeki mühre bakıp elini çekiyor. Mühür sönmüş, ışık yeniden maviye dönmüş.", en: "A long silence. {npc:kaya_demir} looks at you, then at the seal on the crystal. Then he pulls his hand back. The seal goes dark and the light turns blue." }
          - { tr: "Kapıya yürüyüp sürgüyü kendi eliyle açıyor. \"Silahları indirin,\" diyor adamlarına. İtiraz eden çıkmıyor: onu dinlemeye alışkınlar, seni dinlemeye de alışacaklar.", en: "He walks to the door and throws back the bolt himself. \"Stand down,\" he tells his people. Nobody argues. They're used to listening to him. They're going to get used to listening to you." }
          - { tr: "Sana dönüyor: \"Bir şartım var. Altmış beş gün sonra bu şehir hâlâ ayaktaysa haklı çıkan sen ol, ben değil.\"", en: "\"One condition,\" he says, turning back to you. \"Sixty-five days from now, if this city's still standing, you be the one who was right. Not me.\"" }
        secenekler:
          - id: "rutbe_kalsin"
            etiket: { tr: "\"Rütben kalsın. Bu gece hiç yaşanmadı.\"", en: "\"Keep your stripes. Tonight never happened.\"" }
            kronik: { tr: "Darbe gecesini hiç yaşanmamış saydın ve {npc:kaya_demir|e} rütbesini bıraktın; aranızda adı konmamış bir borç kaldı.", en: "You wrote the night of the coup out of existence and let {npc:kaya_demir} keep his rank. It left a debt between you that neither of you named." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - bayrak: "kaya_affedildi"
              - bayrak: "ihanet_onlendi"
              - iliski: { kaya_demir: { baglilik: 20, guven: 10 } }
              - itibar: { siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey"
            etiket: { tr: "\"Konsey'in önünde hesap vereceksin.\"", en: "\"You're answering to the Council.\"" }
            kronik: { tr: "{npc:kaya_demir|i} hesap vermesi için Konsey'in önüne çıkardın; şehrin en güçlü adamı bile bir masanın karşısına oturacaktı.", en: "You marched {npc:kaya_demir} before the Council to answer for it. Even the strongest man in the city would have to face a table." }
            etkiler:
              - ahlak: { duzen: 5 }
              - bayrak: "kaya_konseye_teslim"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 8, lonca: -6 }
              - iliski: { kaya_demir: { saygi: 8, guven: -5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "lonca_al"
            etiket: { tr: "\"Lonca'yı ben alıyorum. Sen yanımda dur.\"", en: "\"I'm taking the Guild. You stand next to me.\"" }
            kronik: { tr: "{npc:kaya_demir|in} darbesini durdurup Lonca'yı kendine aldın; eski komutanı da sağ kolun yaptın.", en: "You stopped {npc:kaya_demir|pos} coup and took the Guild for yourself, with the old commander as your right hand." }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "ihanet_onlendi"
              - iliski: { kaya_demir: { saygi: 12, baglilik: 6 } }
              - ordu: { lonca_avcisi: 40 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_birlikte"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Şafakta Demir Yasa meydanda okunuyor. {yer:kiyikent} bu sabah Konsey'in değil, Lonca'nın bayraklarıyla uyanmış. Su kuyruğunun da ekmek kuyruğunun da başında asker var; sokak lambaları bile çizelgeye göre yanıyor.", en: "At dawn, the Iron Law gets read out in the square. {yer:kiyikent} wakes up under Guild flags instead of the Council's. Water lines run by soldiers, bread lines run by soldiers, even the streetlights coming on by schedule." }
          - { tr: "Ve bir şey değişiyor: o gün ne yağma oluyor ne kavga. Korku da insanları en az umut kadar hizada tutuyor. {npc:kaya_demir} yanında kollarını kavuşturmuş; hâlinden memnun.", en: "And something changes: nobody loots that day, nobody fights. Fear keeps people every bit as orderly as hope does. {npc:kaya_demir} stands beside you, arms folded, satisfied." }
          - metin: { tr: "İki asker {npc:elif_sari|i} salondan çıkarıyor. Kapıda durup sana dönüyor: \"Sana inanmıştım,\" diyor. Başka tek söz yok.", en: "Two soldiers walk {npc:elif_sari} out of the hall. She stops at the door and turns back to you. \"I believed in you,\" she says. That's all." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "elif_koru"
            etiket: { tr: "\"{npc:elif_sari|e} kimse dokunmayacak.\"", en: "\"Nobody lays a finger on {npc:elif_sari}.\"" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Darbeye katıldın ama {npc:elif_sari|e} kimsenin dokunmasına izin vermedin; seni affetmedi, ama o gece sağ çıktı.", en: "You joined the coup, but you didn't let anyone touch {npc:elif_sari}. She didn't forgive you. But she walked out of there alive." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - bayrak: "darbede_elif_korundu"
              - iliski: { elif_sari: { guven: -10, saygi: 5 }, kaya_demir: { saygi: -3 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey_hapis"
            etiket: { tr: "Konsey üyeleri hapse; hepsi", en: "Lock up the Council. All of them" }
            kronik: { tr: "Konsey'in bütün üyelerini hapse attırdın; şehrin son demokrasisini bir bodrum katına kilitledin.", en: "You had the whole Council locked up. You shut the city's last democracy in a basement." }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 5 }
              - itibar: { siginak: -10, lonca: 5 }
              - iliski: { elif_sari: { guven: -30 }, kaya_demir: { saygi: 5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "taht"
            etiket: { tr: "\"Darbe benim. Sen ikinci sırada dur.\"", en: "\"This is my coup. You're number two.\"" }
            gerekli: { stat: { cha: 250 } }
            kronik: { tr: "Darbeyi {npc:kaya_demir|in} elinden çekip aldın; Demir Yasa'nın altında artık senin adın yazıyordu.", en: "You took the coup right out of {npc:kaya_demir|pos} hands. It was your name at the bottom of the Iron Law now." }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -4 }
              - bayrak: "lonca_hakimiyeti"
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { korku: 10, saygi: 5, guven: -10 } }
              - ordu: { lonca_avcisi: 60 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "Yeni düzeni meydanda sen ilan et", en: "Announce the new order in the square yourself" }
            kronik: { tr: "Demir Yasa'yı meydanda kendi sesinle okudun; o sabah şehir yeni düzenin sesini senden duydu.", en: "You read out the Iron Law in the square in your own voice. That morning, the city heard the new order from you." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: 5, insanlik: -2 }
              - itibar: { lonca: 8, siginak: -5 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_yenilgi"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafızın camdan yumruğu seni salonun öbür ucuna fırlatıyor. Arkandaki duvar çöküyor, sonrası karanlık.", en: "The guardian's glass fist throws you clear across the hall. The wall caves in behind you. Then nothing." }
          - { tr: "Gözlerini açtığında meydanda, bir sedyenin üstündesin. Gökyüzü griye çalmış. Hoparlörlerden {npc:kaya_demir|in} sesi geliyor, hava durumu okur gibi sakin ve ölçülü: Demir Yasa yürürlükte.", en: "When you open your eyes you're in the square, on a stretcher. The sky's gone gray. {npc:kaya_demir|pos} voice is coming out of the loudspeakers, calm and measured, like a weather report: the Iron Law is now in effect." }
          - { tr: "Seni yenen ne o ne de muhafızı. Seni yenen, bu şehri senin kadar umursayıp senden önce davranan bir adam.", en: "It wasn't him that beat you. Not the guardian either. What beat you was a man who cared about this city as much as you do, and moved first." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Hesap sonra sorulur", en: "Get up. The reckoning comes later" }
            kronik: { tr: "Darbeyi durduramadın; sedyeden kalktığında {npc:kaya_demir|in} demir yasası çoktan yürürlüğe girmişti.", en: "You couldn't stop the coup. By the time you got off that stretcher, {npc:kaya_demir|pos} iron law was already in effect." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - itibar: { siginak: -5, lonca: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "kabul"
            etiket: { tr: "Ona git; yenilgiyi kabul et", en: "Go to him. Accept the loss" }
            kronik: { tr: "{npc:kaya_demir|in} karşısına çıkıp yenilgini kabul ettin; Demir Yasa'nın altına sen de imza koydun.", en: "You went to {npc:kaya_demir} and accepted defeat. You put your own name under the Iron Law." }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 10, baglilik: 5 } }
              - itibar: { lonca: 8, siginak: -8 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Thessar (kendi ırkına; iyi haber)
      - id: "ihanet_thessar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:thessar} cübbesinin içinden ince, gümüş bir levha çıkarıp sana uzatıyor. Üstünde satır satır tarihler, rotalar, kotalar. \"Hasat Defteri,\" diyor. \"Filonun geliş açısı, ilk inecek birlikler, hangi şehrin hangi gün susturulacağı... Dört yüz yıl boyunca bu defteri ben tuttum.\"", en: "{npc:thessar} pulls a thin silver plate out of his robe and holds it out to you. Lines are scrolling across it: dates, routes, quotas. \"The Harvest Ledger,\" he says. \"The fleet's approach vector, which units land first, which city gets silenced on which day. I have kept this ledger for four hundred years.\"" }
          - { tr: "\"Neden mi?\" Sen sormadan cevaplıyor. \"Çünkü sen bir hata değilsin. Dört yüz yılda ilk kez bir tarlada biçilmeyi reddeden bir şey gördüm. Bunu gören çiftçi artık eski çiftçi olarak kalamaz.\"", en: "\"Why?\" He answers before you can ask. \"Because you are not an error. In four hundred years, this is the first field where I've seen something refuse to be cut. A farmer who sees that cannot go on being the same farmer.\"" }
          - { tr: "Gökyüzünde gemi homurdanıyor. Işık sütununun içinden uzun boylu, zırhlı bir figür iniyor; yüzü bir maskenin ardında, elinde kendi boyundan uzun bir kılıç. Kadimler hainleri böyle karşılar: tören kıyafetiyle.", en: "Up in the sky, the ship growls. A figure comes down inside the column of light: tall, armored, face hidden behind a mask, carrying a sword longer than it is. That's how the Ancients greet traitors. In ceremonial dress." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Taht Cellâdı · Kadim infaz memuru", en: "[ANALYSIS] Throne Headsman · Ancient executioner" }
            satirlar:
              - { tr: "Hedef: tek. Tanıklara karşı tutum: kayıtsız. Sana karşı tutum: tanımlanmamış.", en: "Target: one. Attitude toward witnesses: indifferent. Attitude toward you: undefined." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "{npc:thessar|in} yarasını kendi eli açmış: gemiden kaçarken izini sürmesinler diye kendi işaretini söküp atmış.", en: "{npc:thessar|pos} wound is self-inflicted. He cut his own tracking mark out on the way off the ship." }
        secenekler:
          - id: "koru"
            etiket: { tr: "Önüne geç; cellat seninle konuşsun", en: "Step in front of him. The headsman deals with you" }
            kronik: { tr: "Taht Cellâdı'nın kılıcıyla kendi ırkına ihanet eden Kadim'in arasına girdin.", en: "You put yourself between the Throne Headsman's blade and the Ancient who betrayed his own kind." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - iliski: { thessar: { guven: 12, baglilik: 10 } }
              - savas: { dusmanlar: ["taht_cellati@oyuncu+5"], ortam: ["tavan"], kazan: "ihanet_thessar_2", kaybet: "ihanet_thessar_yenilgi" }
          - id: "once_defter"
            etiket: { tr: "\"Önce defteri ver. Sonra korurum.\"", en: "\"Ledger first. Then I protect you.\"" }
            kronik: { tr: "{npc:thessar|i} korumadan önce defterini aldın; yardımın bir pazarlığın sonunda geldi.", en: "You took {npc:thessar|pos} ledger before you'd lift a finger for him. Your help came at the end of a bargain." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 3 }
              - bilgi: "hasat_defteri"
              - iliski: { thessar: { saygi: 8, guven: -4 } }
              - savas: { dusmanlar: ["taht_cellati@oyuncu+5"], ortam: ["tavan"], kazan: "ihanet_thessar_2", kaybet: "ihanet_thessar_yenilgi" }
          - id: "bak"
            tur: "gosteris"
            etiket: { tr: "Gemiye bak; cellat inmeye cesaret edemesin", en: "Look up at the ship. Dare the headsman to land" }
            gerekli: { stat: { wil: 300 } }
            kronik: { tr: "Kadim gemisine yalnızca baktın ve Taht Cellâdı inmeye cesaret edemedi; bir insanın bakışı koca filoyu durdurdu.", en: "You just looked up at the Ancient ship, and the Throne Headsman didn't dare land. A human stare held off a fleet." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - dikkat: 8
              - degisken: { kadim_tehdit: -4 }
              - iliski: { thessar: { saygi: 15, korku: 8 } }
              - xp_seviye: 40
            sonraki: "ihanet_thessar_2"
          - id: "teslim"
            etiket: { tr: "Onu cellada teslim et", en: "Hand him over to the headsman" }
            kronik: { tr: "Hain Kadim'i kendi celladına teslim ettin; filoya, insanların hainleri bile geri verdiğini gösterdin.", en: "You handed the traitor Ancient over to his own headsman. You showed the fleet that humans would even give back a traitor." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4, insanlik: -3 }
              - npc_ol: "thessar"
              - bayrak: "thessar_teslim_edildi"
              - degisken: { kadim_tehdit: 8 }
              - itibar: { kadimler: 15, siginak: -5 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_thessar_2"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Işık sütunu kesiliyor. Cellâdın kılıcı sahipsiz, meydanın taşlarına saplı kalmış; sahibi ya gemiye çekildi ya da artık yok. Dağılan pazar kalabalığı, ellerinde hâlâ fenerlerle, yavaş yavaş geri dönüyor.", en: "The column of light cuts out. The headsman's sword is stuck in the square's paving stones, no owner in sight; it either pulled back to the ship or doesn't exist anymore. The scattered market crowd drifts back in slowly, still holding their lanterns." }
          - { tr: "{npc:thessar} yaralı ama başı dik, ayağa kalkıyor. \"Teşekkür etmem beklenir,\" diyor. \"Bizim dilimizde bunun bir karşılığı yok; borç için bir sözcük var. Ben onu kullanacağım.\"", en: "{npc:thessar} gets to his feet. Hurt, but head high. \"I am expected to thank you,\" he says. \"My language has no word for that. It has a word for debt. I will use that one.\"" }
          - metin: { tr: "{npc:yanki} şaşkın: bir kadim birine borçlandı. biri bunu yazsın. kimse inanmayacak.", en: "{npc:yanki}, stunned: an ancient just owed somebody. somebody write that down. nobody's going to believe it." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "sigin"
            etiket: { tr: "Ona şehirde bir sığınak ver", en: "Give him a safe house in the city" }
            kronik: { tr: "{npc:thessar|e} şehrin göbeğinde bir sığınak verdin; {yer:kiyikent} bir Kadim'i saklayan ilk insan şehri oldu.", en: "You gave {npc:thessar} a safe house in the heart of the city. {yer:kiyikent} became the first human city ever to hide an Ancient." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "thessar_sigindi"
              - degisken: { kadim_tehdit: -8 }
              - iliski: { thessar: { baglilik: 12, guven: 10 } }
              - hafiza: { npc: "thessar", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "tanik"
            tur: "aciga_vur"
            etiket: { tr: "Bütün fraksiyonların önünde konuşsun", en: "Make him testify in front of every faction" }
            kronik: { tr: "{npc:thessar|i} bütün fraksiyonların önünde konuşturdun; insanlık hasat takvimini ilk kez düşmanın kendi ağzından dinledi.", en: "You had {npc:thessar} testify before every faction. For the first time, humanity heard the harvest schedule from the enemy's own mouth." }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 4, insanlik: 2 }
              - bayrak: "thessar_sigindi"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -10 }
              - itibar: { siginak: 6, lonca: 6, sessiz_ag: 6, kadimler: -20 }
              - iliski: { thessar: { saygi: 8, korku: 4 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "silah"
            etiket: { tr: "\"Filoya karşı bana silah olacaksın.\"", en: "\"You're going to be my weapon against the fleet.\"" }
            kronik: { tr: "{npc:thessar|i} kendi filosuna karşı bir silaha çevirdin; Kadimler'in kodları artık bir hainin elindeydi.", en: "You turned {npc:thessar} into a weapon against his own fleet. The Ancients' codes were in a traitor's hands now." }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -2, duzen: 2 }
              - bayrak: "thessar_sigindi"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -12 }
              - iliski: { thessar: { saygi: 10, guven: -5, korku: 6 } }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 3, max: 6 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_thessar_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Cellâdın kılıcı boğazının bir parmak ötesinde duruyor; duruyor, çünkü araya bir el girmiş: {npc:thessar|in} gümüş kanlı eli.", en: "The headsman's blade stops an inch from your throat. It stops because there's a hand in the way: {npc:thessar|pos} silver-bloodied hand." }
          - { tr: "Cellâda önce kendi dilinde, sonra seninkinde sesleniyor: \"Sen benim için geldin. Beni al. Bu insan hesabının dışında.\" Cellat bir an düşünüyor; ardından ışık sütunu ikisini birden yukarı çekiyor.", en: "\"You came for me,\" he tells the headsman, in his own tongue and then in yours. \"Take me. This human is outside your ledger.\" The headsman thinks it over for a moment. Then the column of light pulls them both up." }
          - { tr: "Meydanda geriye bir tek gümüş levha kalıyor: Hasat Defteri, taşların arasında yağmurda parlıyor.", en: "All that's left in the square is a silver plate: the Harvest Ledger. Gleaming in the rain between the paving stones." }
        secenekler:
          - id: "defteri_al"
            etiket: { tr: "Defteri al; bedelini unutma", en: "Pick up the ledger. Don't forget what it cost" }
            kronik: { tr: "{npc:thessar} senin yerine gitti; geride bıraktığı defteri yağmurun içinden sen aldın.", en: "{npc:thessar} went up in your place. You picked the ledger he left behind out of the rain." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - npc_ol: "thessar"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -6 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "gogee_bagir"
            etiket: { tr: "Göğe bağır; geri getirsinler", en: "Scream at the sky. Make them bring him back" }
            kronik: { tr: "{npc:thessar} için göğe haykırdın; Kadim gemisi sesini duydu ama karşılık vermedi.", en: "You screamed at the sky for {npc:thessar}. The Ancient ship heard you and gave no answer." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - npc_ol: "thessar"
              - bilgi: "hasat_defteri"
              - dikkat: 6
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Deniz (Yükselenler adına)
      - id: "ihanet_deniz_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} en yukarısında, eski su deposunun önünde Yükselenler bir halka kurmuş. Ortada iple bağlanmış yüzlerce insan var; meşale ışığında yüzleri kireç gibi. Bazılarını tanıyorsun: {yer:kiyikent_liman|den}, {yer:kordon|den}, ekmek kuyruklarından.", en: "At the very top of {yer:tepe}, in front of the old water tower, the Ascended have made a ring. In the middle are hundreds of people tied together, faces bone-white in the torchlight. You know some of them: from the waterfront, {yer:kordon}, the bread lines." }
          - { tr: "{npc:deniz_arman} halkanın önünde dikiliyor. Kalkanı içten içe yanıyor ve bağlı insanların her biri soluk bir iplikle ona bağlanmış. Her nefeste iplikler biraz daha parlıyor, insanların benzi biraz daha atıyor.", en: "{npc:deniz_arman} stands at the front of the ring. The shield's burning from the inside, and every one of those tied-up people is connected to it by a pale thread. With every breath, the threads glow a little brighter and the people fade a little more." }
          - metin: { tr: "Hoparlörlerden {npc:vahit|in} tatlı ama kesin sesi yükseliyor: \"Yakıt yanmalı ki seçilmiş yükselsin. Bu gece kalkanımız şehrin en ağır yükünü taşıyacak.\"", en: "{npc:vahit|pos} voice comes over the loudspeakers, sweet and certain: \"The fuel must burn so the chosen can rise. Tonight our shield carries the city's heaviest burden.\"" }
            kosul: { npc_hayatta: "vahit" }
          - { tr: "{npc:deniz_arman} seni görünce gözleri bir anlığına eski hâline dönüyor, sonra yine uzaklara kayıyor. \"Kardeşimi buldular bana,\" diyor. \"Bedeli de sensin. Başka kimsenin ödeyemeyeceği kadar büyük tek şey sensin.\"", en: "{npc:deniz_arman} sees you. For a second {zamir:deniz_arman|onun} eyes go back to how they used to be. Then they drift off again. \"They found my sister,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You're the price. You're the only thing big enough that nobody else can pay it.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Yakıtla Beslenen Kalkan", en: "[ANALYSIS] The Fuel-Fed Shield" }
            satirlar:
              - { tr: "Güç kaynağı: 312 insan. Kalan süre: ipliklere bağlı.", en: "Power source: 312 humans. Time remaining: depends on the threads." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "İplikler kalkana, kalkan da {npc:deniz_arman|in} göğsüne bağlı. İplikleri kesersen kalkan zayıflar, ama kopan ilk iplik en çok onun canını yakar.", en: "The threads are tied to the shield, and the shield's tied to {npc:deniz_arman|pos} chest. Cut the threads and the shield weakens. But the first one that snaps is going to hurt {zamir:deniz_arman|onu} the most." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni öldürmek istemiyor. kendini öldürüyor ve işi senin elinle bitirmek istiyor. ikisi aynı şey değil.", en: "they don't want to kill you. they're killing themselves and they want you to be the one who does it. those aren't the same thing." }
        secenekler:
          - id: "benim"
            etiket: { tr: "\"Kalkanını indir. Benim.\"", en: "\"Put the shield down. It's me.\"" }
            gerekli: { iliski_min: { deniz_arman: { guven: 40 } } }
            kronik: { tr: "{npc:deniz_arman|e} {yer:tepe|de} yalnızca kim olduğunu hatırlattın; kalkan yere düştü, üç yüz kişinin ipi çözüldü.", en: "Up in {yer:tepe}, all you did was remind {npc:deniz_arman} who you were. The shield hit the ground, and three hundred people were cut loose." }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 3 }
              - degisken: { hayatta_kalan: 4 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "ihanet_deniz_konus"
          - id: "iplikler"
            etiket: { tr: "Önce iplikleri kes; insanları kurtar", en: "Cut the threads first. Get the people out" }
            kronik: { tr: "Eski dostunla dövüşmeden önce {yer:tepe|de} bağlı insanların iplerini kestin.", en: "Before you fought your old friend, you cut the threads holding the people up in {yer:tepe}." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 5, yukselenler: -8 }
              - savas: { dusmanlar: ["yakit_kalkani@oyuncu+3"], ortam: ["yanici"], kazan: "ihanet_deniz_2", kaybet: "ihanet_deniz_yenilgi" }
          - id: "yuru"
            etiket: { tr: "Kalkanına doğru yürü", en: "Walk straight at the shield" }
            kronik: { tr: "{yer:tepe|de} doğrudan eski dostunun kalkanına yürüdün; o kalkanı besleyen her ipliğin ucunda bir insan olduğunu bile bile.", en: "Up in {yer:tepe}, you walked straight into your old friend's shield, knowing there was a person on the other end of every thread feeding it." }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - degisken: { hayatta_kalan: -3 }
              - savas: { dusmanlar: ["yakit_kalkani@oyuncu+5"], ortam: ["yanici"], kazan: "ihanet_deniz_2", kaybet: "ihanet_deniz_yenilgi" }
          - id: "ciplak"
            tur: "gosteris"
            etiket: { tr: "Kalkanın darbesini çıplak elle tut", en: "Catch the shield's blow bare-handed" }
            gerekli: { stat: { end: 280 } }
            kronik: { tr: "{npc:deniz_arman|in} üç yüz insanla beslenen darbesini çıplak elle karşıladın; Yükselenler o gece yanlış tanrıya taptıklarını anladı.", en: "You caught {npc:deniz_arman|pos} blow, fed by three hundred people, bare-handed. That night, the Ascended realized they'd been worshiping the wrong god." }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: 2 }
              - dikkat: 6
              - xp_seviye: 40
              - itibar: { yukselenler: 10 }
              - iliski: { deniz_arman: { korku: 12, saygi: 10 } }
            sonraki: "ihanet_deniz_2"

      - id: "ihanet_deniz_konus"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman|in} kalkanı titremeye başlayınca iplikler birer birer sönüyor; bağlı insanlar dizlerinin üstüne çöküp derin derin soluk alıyor. Kalkan yere düştüğünde sesi {yer:tepe|in} bütün yokuşlarında yankılanıyor.", en: "{npc:deniz_arman|pos} shield trembles. The threads go dark one after another, and the tied-up people drop to their knees, breathing. The shield hits the ground, and the sound echoes down every slope in {yer:tepe}." }
          - { tr: "\"Vapuru hep senin yüzünden kaçırırdık,\" diyor {npc:deniz_arman}; gülmeye çalışıyor ama beceremiyor. \"Kardeşimi... aslında bulmamışlar. Bir fotoğraf gösterdiler. Bile bile inandım. İnanmak istedim.\"", en: "\"You always made us miss the ferry,\" {npc:deniz_arman} says, trying to laugh. It doesn't work. \"My sister... they didn't really find her. They showed me a photo. I knew. I believed it anyway. I wanted to.\"" }
          - metin: { tr: "Hoparlörlerde {npc:vahit|in} sesi yarıda kesiliyor; biri fişi çekmiş. Beyaz cüppeliler birer birer meşalelerini yere bırakıyor.", en: "{npc:vahit|pos} voice cuts off mid-word on the loudspeakers; somebody pulled the plug. One by one, the white robes set their torches down." }
            kosul: { npc_hayatta: "vahit" }
        secenekler:
          - id: "eve"
            etiket: { tr: "\"Eve gel.\"", en: "\"Come home.\"" }
            kronik: { tr: "{npc:deniz_arman|i} eve, {yer:kiyikent|e} geri getirdin; vapuru hep birlikte kaçıran ikili yeniden bir aradaydı.", en: "You brought {npc:deniz_arman} home to {yer:kiyikent}. The two who always missed the ferry were together again." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - bayrak: "deniz_geri_dondu"
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 20, guven: 10 } }
              - itibar: { yukselenler: -10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yolun_acik"
            etiket: { tr: "\"Git. Kendi yolunu bul.\"", en: "\"Go. Find your own way.\"" }
            kronik: { tr: "{npc:deniz_arman|i} serbest bıraktın; ne senin yanına ne Yükselenler'e, kendi yoluna gönderdin.", en: "You let {npc:deniz_arman} go. Not back to you, not back to the Ascended. Down a road of {zamir:deniz_arman|onun} own." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { saygi: 10, guven: 6 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "hesap"
            etiket: { tr: "\"Önce bağladığın insanlara hesap vereceksin.\"", en: "\"First you answer to the people you tied up.\"" }
            kronik: { tr: "{npc:deniz_arman|i} bağladığı insanların karşısına çıkardın; affı onlardan dilemesi gerekiyordu.", en: "You made {npc:deniz_arman} face the people {zamir:deniz_arman|o} had tied up. Whether {zamir:deniz_arman|o} {zamir:deniz_arman|was} forgiven was up to them." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - itibar: { siginak: 6, yukselenler: -6 }
              - iliski: { deniz_arman: { saygi: 8, guven: -4 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_deniz_2"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkan ortadan ikiye yarılıyor. İplikler kopunca bağlı insanlar geriye savrulup soluk soluğa yere düşüyor. {npc:deniz_arman} su deposunun dibine yığılıyor; göğsündeki yakıt hâlâ yanıyor, ama artık dışarı değil, içeri doğru.", en: "The shield splits down the middle. The threads snap, and the tied-up people fly back and hit the ground gasping. {npc:deniz_arman} crumples at the foot of the water tower. The fuel in {zamir:deniz_arman|onun} chest is still burning, but inward now. Not out." }
          - { tr: "\"Söz vermiştin,\" diyor zar zor. \"Hatırlıyor musun? Canavara da dönüşsen tanrıya da, bana söyleyecektin. Söylemedin. Ben de bekleyemedim.\"", en: "\"You promised,\" {zamir:deniz_arman|o} manage{zamir:deniz_arman|s}. \"Remember? If you turned into a monster or a god, you were gonna tell me. You never did. So I couldn't wait.\"" }
          - { tr: "Nabzı düşüyor; yakıt ondan geriye ne kaldıysa kemirip bitiriyor. Birkaç dakikası var, belki daha da az.", en: "{zamir:deniz_arman|onun} pulse is dropping. The fuel's eating whatever's left. A few minutes, maybe less." }
        secenekler:
          - id: "kurtar"
            etiket: { tr: "Yakıtı kendi içine çek; onu kurtar", en: "Pull the fuel into yourself. Save {zamir:deniz_arman|onu}" }
            kronik: { tr: "{npc:deniz_arman|in} içini yakan ateşi kendi göğsüne çektin; dostunu kurtardın, yarası sende kaldı.", en: "You pulled the fire eating {npc:deniz_arman} alive into your own chest. You saved a friend and kept the scar." }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 3 }
              - can: -800
              - yozlasma: 4
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 25, guven: 15 } }
              - hafiza: { npc: "deniz_arman", id: "olay:buyuk_ihanet", agirlik: 90 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "son_saati"
            etiket: { tr: "Son saatini ertele", en: "Push back {zamir:deniz_arman|onun} last hour" }
            goster: { yol: "son_saat" }
            kronik: { tr: "{npc:deniz_arman|in} son saatini kendi Yolunla erteledin; ikinize biraz daha zaman kazandırdın.", en: "You pushed back {npc:deniz_arman|pos} last hour with your own Path. You bought the two of you a little more time." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: -1 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 15, saygi: 15 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "bitir"
            etiket: { tr: "Acısını bitir", en: "End {zamir:deniz_arman|onun} pain" }
            kronik: { tr: "{npc:deniz_arman|in} acısına {yer:tepe|de} kendi elinle son verdin; en eski dostunu sen öldürdün.", en: "You ended {npc:deniz_arman|pos} pain up in {yer:tepe} with your own hands. Your oldest friend died by your hand." }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 3 }
              - npc_ol: "deniz_arman"
              - bayrak: "deniz_oyuncu_oldurdu"
              - bayrak: "deniz_acisi_bitirildi"
              - bayrak: "ihanet_onlendi"
              - itibar: { yukselenler: -6, lonca: 3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "birak"
            etiket: { tr: "Bırak, kendi yangınını kendi söndürsün", en: "Let {zamir:deniz_arman|onu} put out {zamir:deniz_arman|onun} own fire" }
            kronik: { tr: "{npc:deniz_arman|i} kendi yangınıyla yalnız bıraktın; sabaha karşı {yer:tepe|den} çekip gittiğini duydun.", en: "You left {npc:deniz_arman} alone with {zamir:deniz_arman|onun} own fire. Toward morning, you heard {zamir:deniz_arman|o}'d vanished from {yer:tepe}." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -2 }
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { guven: -15, saygi: 5 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_deniz_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkanın kenarı göğsüne inip seni su deposunun ayaklarına çiviliyor; üç yüz insanın ağırlığı bir anda üstüne çöküyor. {npc:deniz_arman} son darbe için kalkanı kaldırıyor.", en: "The shield's rim slams into your chest and pins you to the water tower's legs. Three hundred people's worth of weight comes down on you at once. {npc:deniz_arman} raises the last blow." }
          - { tr: "Ama indiremiyor. Havada titreyen kalkanın ardında {npc:deniz_arman|in} yüzü bir çocuğunki gibi buruşmuş. \"Yapamıyorum,\" diyor. \"Seni yakıt yapamam.\" Kalkanı fırlatıp karanlığa koşuyor.", en: "And doesn't bring it down. The shield shakes in midair, and {npc:deniz_arman|pos} face crumples like a kid's. \"I can't,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I can't make you fuel.\" {zamir:deniz_arman|b} drop{zamir:deniz_arman|s} the shield and run{zamir:deniz_arman|s} off into the dark." }
          - { tr: "Halkada bağlı insanların bir kısmı artık kıpırdamıyor. Yakıt yanmış; onlardan geriye yalnız kalkanın ışığı kalmış.", en: "Some of the people tied up in the ring aren't moving anymore. The fuel burned. The shield's glow is all that's left of them." }
        secenekler:
          - id: "kalanlar"
            etiket: { tr: "Kalanları çöz; ölüleri say", en: "Untie the living. Count the dead" }
            kronik: { tr: "İhaneti {yer:tepe|de} durduramadın; yakıt yandı, en eski dostun da karanlığa kaçtı.", en: "You couldn't stop the betrayal up in {yer:tepe}. The fuel burned, and your oldest friend fled into the dark." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - npc_gitti: "deniz_arman"
              - degisken: { hayatta_kalan: -4 }
              - itibar: { yukselenler: 5, siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "pesinden"
            etiket: { tr: "{npc:deniz_arman|in} adını karanlığa bağır", en: "Yell {npc:deniz_arman|pos} name into the dark" }
            kronik: { tr: "Kaçan dostunun adını karanlığa bağırdın; cevap gelmedi, ama bütün yokuş onu çağırdığını duydu.", en: "You yelled your runaway friend's name into the dark. No answer came, but the whole hill heard you calling for {zamir:deniz_arman|onu}." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - npc_gitti: "deniz_arman"
              - degisken: { hayatta_kalan: -4 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Aras (Kadimler'le anlaştı)
      - id: "ihanet_aras_1"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} sana dönüyor. Gözbebeklerinde girdap gibi Kadim gümüşü; pencerende seviyesi bir sayaç gibi durmadan, saniyede bir artıyor. Ödünç taç her saniye ona bir şey verir, karşılığında da bir şey alır.", en: "{npc:aras_kurt} turns around. Ancient silver is swirling in his eyes, and his level keeps ticking up in your window, once a second, nonstop, like an odometer. The borrowed crown gives him something every second and takes something back." }
          - { tr: "\"S kademesi,\" diyor. \"Hem de ilk insan. Bana bunu teklif ettiler; karşılığında tek yapmam gereken bu kapıyı açmaktı. Sen olsan reddeder miydin? Dürüst ol. Sen hiç ikinci olmadın ki.\"", en: "\"S-Grade,\" he says. \"First human. That's what they offered me. All I had to do was open this door. Would you have said no? Be honest. You've never been second at anything.\"" }
          - metin: { tr: "Teklifi aylar önce çok-evren kapısının önünde almıştı; sen de oradaydın. O gün şaka gibi gelmişti, bu gece vadesi dolmuş bir fatura gibi duruyor.", en: "He got the offer months ago, in front of the multiverse gate. You were there. That day it sounded like a joke. Tonight it looks like a bill that came due." }
            kosul: { bayrak: "aras_kadim_teklifini_aldi" }
          - { tr: "Arkasında Kadim öncüleri geçitten akmayı sürdürüyor. Aşağıda şehir uyuyor; ya da uyuduğunu sanıyor.", en: "Behind him, the Ancient vanguard keeps pouring through the gate. Down below, the city's asleep. Or thinks it is." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Ödünç Tacın Sahibi", en: "[ANALYSIS] Bearer of the Borrowed Crown" }
            satirlar:
              - { tr: "Gerçek seviye: yükseliyor. Gerçek sahip: Kadim filosu. Taç, taşıyıcısının ömrünü faiz olarak alır.", en: "True level: rising. True owner: the Ancient fleet. The crown takes its bearer's lifespan as interest." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Tacın arkasından gemiye ince bir iplik uzanıyor. Taç ona güç vermiyor, ödünç veriyor; verdiği geri de alınabilir.", en: "There's a thin thread running from the back of the crown up to the ship. It isn't giving him power. It's lending it. It can be called back." }
        secenekler:
          - id: "duello"
            etiket: { tr: "\"Ceketini çıkar. Bitirelim.\"", en: "\"Take off the jacket. Let's finish this.\"" }
            kronik: { tr: "Ebedi rakibine ceketini çıkarmasını söyledin; yarışı orada, dövüşerek bitirecektiniz.", en: "You told your lifelong rival to lose the jacket. You'd come to settle the race with your fists." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 10 } }
              - savas: { dusmanlar: ["odunc_tac@oyuncu+5"], ortam: ["dar_gecit"], kazan: "ihanet_aras_2", kaybet: "ihanet_aras_yenilgi" }
          - id: "fiyat"
            etiket: { tr: "\"Tacın fiyatını sordun mu?\"", en: "\"Did you ask what the crown costs?\"" }
            kronik: { tr: "Tacın gerçek bedelini rakibine söyledin; aranızdaki yarış o an ilk kez durdu.", en: "You told your lifelong rival what the crown really cost. For the first time, the race between you stopped." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 8 } }
            sonraki: "ihanet_aras_konus"
          - id: "kapi"
            etiket: { tr: "Önce geçidi kapat; o bekleyebilir", en: "Close the gate first. He can wait" }
            kronik: { tr: "Rakibini bekletip önce geçide döndün; şehri {npc:aras_kurt|in} önüne koydun.", en: "You left your rival waiting and turned to the gate first. You put the city ahead of {npc:aras_kurt}." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2, kadim_tehdit: 3 }
              - savas: { dusmanlar: ["kadim_infazci@dunya", "kadim_infazci@dunya", "kadim_hukumsuzlestirici@dunya"], kazan: "ihanet_aras_kacti", kaybet: "ihanet_aras_yenilgi" }
          - id: "tac_al"
            tur: "gosteris"
            etiket: { tr: "Tacı başından, o kımıldamadan al", en: "Lift the crown off his head before he can move" }
            gerekli: { stat: { agi: 300 } }
            kronik: { tr: "Ödünç tacı rakibinin başından, o daha göz kırpamadan aldın; {npc:aras_kurt} hızının sana yetmediğini o gece gördü.", en: "You lifted the borrowed crown off your rival's head before he could blink. That night, {npc:aras_kurt} learned his speed wasn't enough against you." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 5
              - xp_seviye: 40
              - iliski: { aras_kurt: { saygi: 15, korku: 8 } }
            sonraki: "ihanet_aras_2"

      - id: "ihanet_aras_konus"
        yer: "kule"
        paragraflar:
          - { tr: "Bir an kıpırdamadan duran {npc:aras_kurt|in} eli tacına doğru kalkıp yarı yolda kalıyor. \"Ömür,\" diyor. \"Biliyorum. Her yıl için on yıl. Hesapladım.\"", en: "{npc:aras_kurt} goes still. Then his hand drifts up toward the crown and stops halfway. \"Lifespan,\" he says. \"I know. Ten years for every one. I did the math.\"" }
          - { tr: "\"Ama ilk ben olurum. İlk S kademesi insanın adını kimse unutmaz. Sen bile.\" Gülüyor; gülüşünde ilk kez zerre kadar özgüven yok. \"Sen bile unutmazsın, değil mi?\"", en: "\"But I'd be first. Nobody forgets the name of the first S-Grade human. Not even you.\" He laughs, and for the first time there's no confidence in it at all. \"Not even you, right?\"" }
        secenekler:
          - id: "unutmam"
            etiket: { tr: "\"Seni zaten unutmayacaktım, aptal.\"", en: "\"I was never gonna forget you, idiot.\"" }
            gerekli: { iliski_min: { aras_kurt: { saygi: 40 } } }
            kronik: { tr: "Ebedi rakibine, onu hiçbir zaman unutmayacağını söyledin; ödünç taç ellinci katın zemininde sahipsiz kaldı.", en: "You told your lifelong rival you'd never forget him. The borrowed crown ended up on the fiftieth-floor stones, ownerless." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - iliski: { aras_kurt: { guven: 15, baglilik: 12 } }
              - hafiza: { npc: "aras_kurt", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "ihanet_aras_2"
          - id: "dovus"
            etiket: { tr: "\"O zaman ödünç tacınla kazan beni.\"", en: "\"Then beat me with your borrowed crown.\"" }
            kronik: { tr: "Ödünç tacıyla seni yenmesi için rakibine meydan okudun; konuşma orada bitti.", en: "You dared your rival to beat you with his borrowed crown. The talking was over." }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["odunc_tac@oyuncu+5"], ortam: ["dar_gecit"], kazan: "ihanet_aras_2", kaybet: "ihanet_aras_yenilgi" }
          - id: "git"
            etiket: { tr: "\"Git o zaman. Gemi seni bekliyor.\"", en: "\"Go, then. Your ship's waiting.\"" }
            kronik: { tr: "Rakibinin tacıyla gemiye yürümesine göz yumdun; Kadim filosu saflarına bir insan kattı.", en: "You let your rival walk up to that ship, crown and all. The Ancient fleet gained a human in its ranks." }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -2 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 6 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_2"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç taç taşlara çarpıp çatlıyor; içinden sızan ince, gümüş bir duman geçide, oradan da gemiye doğru akıyor. Kadim öncüleri duraksayıp geri dönerken geçit ağır ağır kapanıyor.", en: "The borrowed crown hits the stones and cracks, and a thin silver smoke leaks out of it, back through the gate and up toward the ship. The Ancient vanguard stops and turns around. The gate slowly closes." }
          - { tr: "{npc:aras_kurt} dizlerinin üstünde. Pencerede seviyesi geriye sayıyor, aldığı her şeyi iade ediyor. Ceketinin cebinden bir sigara çıkarıyor ama elleri öyle titriyor ki yakamıyor.", en: "{npc:aras_kurt} is on his knees, and his level's counting back down in the window, giving back everything it took. He pulls a cigarette out of his jacket pocket and can't light it. His hands are shaking." }
          - { tr: "\"Yine sen,\" diyor. \"Her seferinde sen. Bari ne yapacaksan çabuk yap.\"", en: "\"You again,\" he says. \"Every single time, it's you. Whatever you're gonna do, do it fast.\"" }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Bu yarış burada biter", en: "The race ends here" }
            kronik: { tr: "Ebedi rakibini ellinci katta öldürdün; yarışınız orada, onunla birlikte bitti.", en: "You killed your lifelong rival on the fiftieth floor. Your race ended there, with him." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 3 }
              - npc_ol: "aras_kurt"
              - bayrak: "ihanet_onlendi"
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yanina_al"
            etiket: { tr: "\"Kalk. Yarışın kalanını yan yana koşarız.\"", en: "\"Get up. We run the rest of this side by side.\"" }
            kronik: { tr: "Sana ihanet eden rakibini ayağa kaldırıp yanına aldın; yarışın kalanını yan yana koşacaktınız.", en: "You pulled the rival who betrayed you to his feet and took him at your side. You'd run the rest of the race together." }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - bayrak: "ihanet_onlendi"
              - yoldas_katil: "aras_kurt"
              - iliski: { aras_kurt: { guven: 15, baglilik: 15, saygi: 10 } }
              - hafiza: { npc: "aras_kurt", id: "olay:buyuk_ihanet", agirlik: 80 }
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "serbest"
            etiket: { tr: "Sigarasını yak ve git", en: "Light his cigarette and walk away" }
            kronik: { tr: "Rakibinin sigarasını yakıp arkanı döndün; ne hüküm verdin ne el uzattın.", en: "You lit your rival's cigarette and walked away. No verdict, no hand up." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - bayrak: "ihanet_onlendi"
              - npc_gitti: "aras_kurt"
              - iliski: { aras_kurt: { saygi: 12, guven: 5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "tac"
            etiket: { tr: "Çatlak tacı kendin al", en: "Pick up the cracked crown yourself" }
            kronik: { tr: "Rakibinin başından düşen çatlak tacı yerden sen aldın; içinde hâlâ bir Kadim fısıldıyordu.", en: "You picked up the cracked crown that fell from your rival's head. An Ancient was still whispering inside it." }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 1 }
              - bayrak: "ihanet_onlendi"
              - esya: { catlak_odunc_tac: 1 }
              - yozlasma: 5
              - iliski: { aras_kurt: { saygi: 5, guven: -10 } }
              - npc_gitti: "aras_kurt"
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_kacti"
        yer: "kule"
        paragraflar:
          - { tr: "Geçit son öncünün ardından kapanıyor; şehir güvende. Dönüp baktığında {npc:aras_kurt|in} yeri boş. Pencerenin kenarında yalnızca bir izmarit kalmış, hâlâ tütüyor.", en: "The gate shuts behind the last of the vanguard. The city's safe. When you turn around, {npc:aras_kurt|pos} spot is empty. Just a cigarette butt on the windowsill, still smoking." }
          - { tr: "Gökyüzünde Kadim gemisinin altına doğru ince bir ışık yükseliyor; içinde siyah ceketli bir insan silueti.", en: "Up in the sky, a thin beam rises to the underside of the Ancient ship, with a human silhouette in it. Black jacket." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Işığın sönmesini izle", en: "Watch the light fade" }
            kronik: { tr: "Rakibini durdurmak yerine şehri kurtardın; {npc:aras_kurt} tacıyla birlikte göğe, Kadimler'in safına yükseldi.", en: "You saved the city instead of stopping your rival. {npc:aras_kurt} rose into the sky to the Ancients' side, crown and all." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
            sonraki: "buyuk_ihanet_sonra"
          - id: "soz"
            etiket: { tr: "\"Seni oradan da indireceğim.\"", en: "\"I'll drag you down from there too.\"" }
            kronik: { tr: "Göğe yükselen rakibine onu oradan da indireceğine yemin ettin; yarış bitmemişti.", en: "As your rival rose into the sky, you swore you'd drag him back down from there too. The race wasn't over." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç tacın gücüyle geçidin kenarına savruluyorsun. Kalkmaya çalışsan da bacakların söz dinlemez olmuş. {npc:aras_kurt} üstüne eğiliyor.", en: "The borrowed crown's power throws you against the edge of the gate. You try to get up, and your legs won't listen. {npc:aras_kurt} leans over you." }
          - { tr: "\"İlk kez,\" diyor; sesinde zafer değil, yorgunluk var. \"İlk kez öne geçip bitirdim. Böyle hissettireceği hiç aklıma gelmezdi.\" Arkasını dönüp ışığın içinden gemiye yükseliyor.", en: "\"First time,\" he says, and there's no victory in it. Just tired. \"First time I finished ahead. Never thought it'd feel like this.\" He turns his back and rises up through the light to the ship." }
          - { tr: "Geçit açık kalıyor; şehrin ordusu onu kapatmak için sabaha kadar kan döküyor.", en: "The gate stays open. Until dawn, the city's fighters bleed to close it." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve geçide koş", en: "Get up and run for the gate" }
            kronik: { tr: "Ebedi rakibin seni ellinci katta yenip Kadimler'e katıldı; geçidi kapatmanın bedelini şehir kanıyla ödedi.", en: "Your lifelong rival beat you on the fiftieth floor and went over to the Ancients. The city paid in blood to close that gate." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yat"
            etiket: { tr: "Bir dakika daha yat; yalnızca bir dakika", en: "Lie there one more minute. Just one" }
            kronik: { tr: "Yenildiğin gece bir dakika daha yerde kaldın; o bir dakika boyunca geçit açıktı, şehir yalnızdı.", en: "The night your rival beat you, you stayed down one more minute. For that minute, the gate stood open and the city was on its own." }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Yedek hain: Sıralama'nın İkincisi
      - id: "ihanet_ikinci_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kadın sana dönüyor. Genç, olsa olsa yirmi beşinde; yüzü yorgun, gözleri gümüşe kesmiş. \"Birinci sensin,\" diyor. \"Biliyorum, herkes biliyor. Ben yalnızca ikinciyim. İkinciler de pazarlık eder.\"", en: "The woman turns around. Young. Twenty-five, maybe. Her face is exhausted and her eyes have gone silver. \"You're Number One,\" she says. \"I know. Everybody knows. I'm just Number Two. And Number Twos make deals.\"" }
          - { tr: "\"Ailem o gemide,\" diyor; sesi bir an çatallanıyor. \"Entegrasyon Günü yanlış kapıdan geçmişler. Kadimler onları bulmuş. Bu kapıyı açarsam geri verecekler.\"", en: "\"My family's on that ship,\" she says, and her voice cracks for a second. \"They went through the wrong door on Integration Day. The Ancients found them. If I open this gate, they give them back.\"" }
          - metin: { tr: "{npc:yanki}: o yalan söylemiyor, onlar söylüyor. kadimler hiçbir şeyi geri vermez.", en: "{npc:yanki}: she's not lying. they are. the ancients never give anything back." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Tacını indir; ya da ben indiririm", en: "Take off the crown. Or I take it off you" }
            kronik: { tr: "Sıralama'nın İkincisi'ne tacını çıkarmasını söyledin; çıkarmazsa sen çıkaracaktın.", en: "You told the Ranking's Number Two to take off the crown, or you'd take it off her." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["ikinci_sira@oyuncu+4"], ortam: ["dar_gecit"], kazan: "ihanet_ikinci_2", kaybet: "ihanet_ikinci_yenilgi" }
          - id: "yalan"
            etiket: { tr: "\"Sana yalan söylüyorlar.\"", en: "\"They're lying to you.\"" }
            kronik: { tr: "Kadimler'in yalanını Sıralama'nın İkincisi'nin gözü önüne serdin; ödünç tacı kendi eliyle başından çıkardı.", en: "You laid the Ancients' lie bare in front of the Ranking's Number Two. She took the borrowed crown off with her own hands." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { kadim_tehdit: -2 }
            sonraki: "ihanet_ikinci_2"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Birincinin kim olduğunu ona hatırlat", en: "Remind her who Number One is" }
            gerekli: { stat: { str: 280 } }
            kronik: { tr: "Kimin birinci olduğunu Sıralama'nın İkincisi'ne tek hamlede hatırlattın; pazarlığı o hamle bitirdi.", en: "In a single move, you reminded the Ranking's Number Two who Number One was. That move ended the bargaining." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - dikkat: 5
              - xp_seviye: 30
            sonraki: "ihanet_ikinci_2"

      - id: "ihanet_ikinci_2"
        yer: "kule"
        paragraflar:
          - { tr: "Gümüş taç taşlara düşüp çatlıyor, geçit de son öncünün ardından kapanıyor. Kadın yere çöküp dizlerini göğsüne çekiyor. Ağlamıyor; ağlayamayacak kadar yorgun.", en: "The silver crown hits the stones and cracks, and the gate closes behind the last of the vanguard. The woman sits down on the floor and pulls her knees up to her chest. She isn't crying. She's too tired to cry." }
          - { tr: "\"Artık bir ismim bile yok,\" diyor. \"Bir sıra numarasından ibaretim. Ne yapacaksan yap, Birinci.\"", en: "\"I don't even have a name anymore,\" she says. \"Just a number. Do whatever you're gonna do, Number One.\"" }
        secenekler:
          - id: "adini_sor"
            etiket: { tr: "Adını sor", en: "Ask her name" }
            kronik: { tr: "Sıralama'nın İkincisi'ne adını sordun; ona bir numara değil, bir insan olarak seslenen ilk kişi sen oldun.", en: "You asked the Ranking's Number Two her name. You were the first to speak to her as a person, not a number." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - bayrak: "ihanet_onlendi"
              - ordu: { lonca_avcisi: 10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "hapis"
            etiket: { tr: "Fraksiyonlara teslim et", en: "Turn her over to the factions" }
            kronik: { tr: "Şehri satan kadını fraksiyonların yargısına bıraktın; güçlü bir haini kılıçla değil, mahkemeyle tartmak istedin.", en: "You left the Ranking's Number Two to the factions' judgment. You wanted a powerful traitor weighed by a court, not a blade." }
            etkiler:
              - ahlak: { duzen: 5 }
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 4, lonca: 4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "infaz"
            etiket: { tr: "Bir hain için bir darbe", en: "One blow for one traitor" }
            kronik: { tr: "Ellinci katta, adını bilmediğin bir kadını tek darbeyle infaz ettin; Sıralama'nın İkincisi orada öldü.", en: "On the fiftieth floor, you executed a woman whose name you never knew with a single blow. The Ranking's Number Two died there." }
            etkiler:
              - ahlak: { merhamet: -7, duzen: 3 }
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: 4, siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_ikinci_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç taç kadını bir anlığına senden hızlı kılıyor; o bir an yetiyor da artıyor. Yere düşüyorsun, geçit açık kalıyor.", en: "For one moment, the borrowed crown makes her faster than you. One moment. That's enough. You go down, and the gate stays open." }
          - { tr: "Kadın dönüp sana bakmıyor bile; ailesinin adlarını fısıldaya fısıldaya ışığa yürüyor ve ışık onu yutuyor. Öncüler sabaha kadar şehre akıyor.", en: "She doesn't even look at you. She walks into the light whispering her family's names, and the light swallows her. The vanguard keeps pouring into the city until dawn." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; geçidi kapatmak sana kaldı", en: "Get up. Closing that gate is on you now" }
            kronik: { tr: "Sıralama'nın İkincisi seni yere serip Kadimler'e gitti; geçidi kapatmanın bedelini şehir ödedi.", en: "The Ranking's Number Two put you down and went over to the Ancients. The city paid the price of closing that gate." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "isim"
            etiket: { tr: "Adını hiç sormadığını düşün", en: "Think about how you never asked her name" }
            kronik: { tr: "Seni yenen kadının adını hiç öğrenemedin; o gece Sıralama'ya baktığında numaraların yerinde yüzler görmeye başladın.", en: "You never learned the name of the woman who beat you. That night, when you looked at the Ranking, you started seeing faces where the numbers were." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Sabah (bütün zincirler)
      - id: "buyuk_ihanet_sonra"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent} üstüne gri ve sessiz iniyor. Kasaba Çekirdeği'nin önündeki meydan, gece olanları duymuş insanlarla dolu; bağıran yok, herkes fısıldaşıyor.", en: "Morning comes down over {yer:kiyikent} gray and quiet. The square in front of the Town Core is full of people who heard what happened last night. Nobody's yelling. Everybody's whispering." }
          - metin: { tr: "Hainin durdurulduğunu herkes biliyor. Ama durdurulan bir ihanet yaşanmamış sayılmaz. İnsanlar birbirlerine eskisinden biraz daha uzun bakıyor.", en: "The traitor got stopped. Everybody knows that much. But stopping a betrayal doesn't mean it never happened. People look at each other a little longer than they used to." }
            kosul: { bayrak: "ihanet_onlendi" }
          - metin: { tr: "İhanet amacına ulaştı. Şehrin bir parçası bir daha geri gelmeyecek; meydandaki herkes bunu iliklerinde hissediyor.", en: "The betrayal went through. Part of the city isn't coming back, and everyone in the square can feel it in their bones." }
            kosul: { bayrak_yok: ["ihanet_onlendi", "ihanet_thessar"] }
          - metin: { tr: "Bir Kadim kendi ırkına sırtını döndü. Haber gece boyunca bütün kamplara yayıldı ve sabaha karşı meydanda bir şey değişti: umut ilk kez, kaba ve tuhaf da olsa akla yatkın geliyor.", en: "An Ancient turned his back on his own kind. The news spread to every camp overnight, and by morning something in the square had shifted: hope, for the first time, sounds rough and strange and almost reasonable." }
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
          - metin: { tr: "Körfezin üstündeki Kadim gemisi her zamankinden alçakta. Gece olan her şeyi kaydetti ve kaydettiklerinden hoşlanmadığı belli.", en: "Over the bay, the Ancient ship is riding lower than ever. It logged everything that happened last night, and it clearly didn't like what it logged." }
            kosul: { degisken_min: { kadim_tehdit: 60 } }
          - metin: { tr: "{npc:yanki|in} sesi yorgun: ihanetler hep böyle biter. bir sabah, bir meydan, kimsenin yüksek sesle söyleyemediği bir isim. bir sonraki döngüde de böyle olacak. ama bu döngüde sen vardın.", en: "{npc:yanki}, tired: betrayals always end like this. a morning, a square, a name nobody says out loud. it'll happen next loop too. but this loop, you were here." }
            kosul: { bayrak: "yanki_bagi" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes sana bakıyor. Bir şey söylemelisin, ne olursa olsun.\"", en: "\"Everybody's looking at you. You need to say something. Anything.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yaralılar {yer:kiyikent_liman|de}, hastanede. Bir uğrarsan iyi olur; elini sıkmak isteyenler var.\"", en: "\"The wounded are at the waterfront hospital. It'd be good if you came by. People want to shake your hand.\"" }
        secenekler:
          - id: "anlat"
            tur: "aciga_vur"
            etiket: { tr: "Meydana çık ve her şeyi anlat", en: "Step out and tell the square everything" }
            kronik: { tr: "O gecenin bütün gerçeğini meydanda anlattın; kimseden tek bir ayrıntıyı saklamadın.", en: "You told the square the whole truth about that night. You didn't hold back a single detail." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { siginak: 4, lonca: 4, sessiz_ag: 4 }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "Ayrıntıları kendine sakla", en: "Keep the details to yourself" }
            kronik: { tr: "Ayrıntıları kendine sakladın; meydandaki fısıltıları düzeltmeye kalkmadın.", en: "You kept the details of that night to yourself. You let the whispers in the square stand uncorrected." }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: -2 }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "bayrak"
            etiket: { tr: "\"Bir daha olmayacak.\" Bayrağının altına çağır", en: "\"Never again.\" Call them under your banner" }
            kronik: { tr: "Meydandakileri bayrağının altına çağırdın; o sabah yüzlerce kişi güvenecekleri kişinin sen olduğuna karar verdi.", en: "You called the square to your banner. That morning, hundreds of people decided you were the one to trust." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 40
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "korfez"
            etiket: { tr: "Kimseye bir şey deme; körfeze bak", en: "Don't say anything. Look out at the bay" }
            kronik: { tr: "Tek söz etmeden körfeze baktın; meydandakiler o sessizliği bir yemin gibi okudu.", en: "You looked out at the bay without a word. The square read that silence as a vow." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

  # ================================================================== İHANETİN ARDINDAN (tohum)
  - id: "ihanet_sonrasi"
    perde: [3]
    agirlik: 1
    etiketler: ["ihanet", "anma"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Boş sandalye", en: "The Empty Chair" }
    sahne: "ihanet_sonrasi_1"
    sahneler:
      - id: "ihanet_sonrasi_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Birkaç gün sonra Ortak Masa yeniden toplanıyor; bu kez mühre dokunan olmuyor. Sandalyelerden biri boş, kimse de onu çekip oturmaya cesaret edemiyor.", en: "A few days later, the Common Table meets again. This time nobody touches the seal. One chair at the table is empty, and nobody has the nerve to pull it out and sit." }
          - metin: { tr: "Sessiz Ağ'ın radyocuları köşede yeni bir frekans üzerinde çalışıyor; eskisi artık Kadimler'in kulağında. İçlerinden biri seninle göz göze gelince başını sallıyor: hâlâ buradayız.", en: "The Quiet Network crew is in the corner, working on a new frequency; the old one belongs to the Ancients now. One of them catches your eye and nods: we're still here." }
            kosul: { bayrak: "ihanet_mert" }
          - metin: { tr: "Demir Yemin'in askerleri kapıda bekliyor, ama silahları yerde. Darbe gecesinin adı kimsenin ağzından çıkmıyor; yine de herkesin aklı orada.", en: "Iron Oath soldiers are at the door, weapons grounded. Nobody says a word about the night of the coup. It's on everybody's mind anyway." }
            kosul: { bayrak: "ihanet_kaya" }
          - metin: { tr: "Masanın ucunda, insan sandalyesine sığmayacak kadar uzun bir Kadim oturuyor. Kimse ona doğrudan bakmıyor, ama herkes onu dinliyor.", en: "At the end of the table sits an Ancient, too tall for a human chair. Nobody looks straight at him. Everybody listens to him." }
            kosul: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
          - metin: { tr: "{yer:tepe|den} gelen temsilcinin üstünde beyaz yok. Yükselenler'in yarısı o geceden sonra cüppesini yaktı; kalanlar artık daha sessiz, daha tehlikeli.", en: "The rep from {yer:tepe} isn't wearing white. Half the Ascended burned their robes after that night. The rest got quieter, and more dangerous." }
            kosul: { bayrak: "ihanet_deniz" }
          - metin: { tr: "Küresel Sıralama'nın üst sıralarında artık bir boşluk var. Sistem onu doldurmuyor; bir şey bekler gibi.", en: "There's a gap near the top of the Global Ranking now. The System isn't filling it. Like it's waiting." }
            kosul: { bayrak: ["ihanet_aras", "aras_kadimlere_gitti"] }
          - metin: { tr: "İkinci'nin adı sonunda bir listeye yazılıyor; bu kez sıra numarasıyla değil, kendi adıyla.", en: "Number Two's real name finally goes down on a list. Not as a rank this time." }
            kosul: { bayrak: "ihanet_ikinci_sira" }
        sezgiler:
          - kosul: { stat: { cha: 200 } }
            metin: { tr: "Masadaki herkes söze senin başlamanı bekliyor. Sen konuşmadıkça kimse sandalyeye dokunmayacak.", en: "Everyone at the table is waiting for you to speak first. Until you do, nobody's touching that chair." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "en gürültülü sandalye boş olanıdır. her döngüde bir tane olur.", en: "empty chairs are always the loudest ones. every loop has one." }
        secenekler:
          - id: "sandalye"
            etiket: { tr: "Sandalyeyi çek ve masadan kaldır", en: "Pull the chair away from the table" }
            kronik: { tr: "İhanetin boş bıraktığı sandalyeyi masadan kaldırdın; o yeri kimsenin doldurmasına izin vermedin.", en: "You took the chair the betrayal left empty away from the table. Nobody was going to fill that seat." }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 2, lonca: 2, sessiz_ag: 2 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 3, max: 7 } }
            sonraki: "ihanet_sonrasi_2"
          - id: "otur"
            tur: "aciga_vur"
            etiket: { tr: "Boş sandalyeye kendin otur", en: "Sit in the empty chair yourself" }
            kronik: { tr: "Hainin boş sandalyesine kendin oturdun; masada sözün kimde olduğunu herkese gösterdin.", en: "You sat down in the traitor's empty chair yourself. You showed everyone at that table who had the floor." }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: 4, insanlik: -2 }
              - itibar: { lonca: 5, yukselenler: 4, siginak: -3 }
            sonraki: "ihanet_sonrasi_2"
          - id: "aileler"
            etiket: { tr: "Masayı bırak; o gece kayıp verenlere git", en: "Skip the table. Go see the families who lost people" }
            goster: { degisken_max: { hayatta_kalan: 70 } }
            kronik: { tr: "Masayı bırakıp o gece kayıp veren ailelerin kapısını tek tek çaldın; hiçbirini yasıyla yalnız bırakmadın.", en: "You skipped the table and knocked on the door of every family who lost someone that night. You didn't leave a single one alone with their grief." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6 }
            sonraki: "ihanet_sonrasi_aileler"

      - id: "ihanet_sonrasi_2"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Toplantı uzun sürmüyor. Kararlar kısa, sesler alçak: nöbet çizelgeleri, erzak, Kadim filosunun beklenen rotası. İhanetin adı anılmıyor, ama her karar onun gölgesinde alınıyor.", en: "The meeting doesn't run long. Short decisions, low voices: watch rosters, supplies, the Ancient fleet's projected route. Nobody mentions the betrayal. Every decision gets made in its shadow anyway." }
          - { tr: "Çıkarken biri koluna dokunuyor: genç bir nöbetçi, olsa olsa on dokuzunda. \"O gece oradaydım,\" diyor. \"Ben yalnızca... teşekkür ederim. Ya da özür dilerim. Hangisi gerekiyorsa.\"", en: "On the way out, somebody touches your arm: a young sentry, maybe nineteen. \"I was there that night,\" he says. \"I just... thank you. Or I'm sorry. Whichever one's right.\"" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Şu çocuğa bir şey söyle. Sana bakışı, benim sana ilk bakışım gibi.\"", en: "\"Say something to that kid. He's looking at you the way I first looked at you.\"" }
        secenekler:
          - id: "ikisi"
            etiket: { tr: "\"İkisi de gerekmiyor. Nöbetine dön.\"", en: "\"Neither one. Get back to your post.\"" }
            kronik: { tr: "O nöbetçiye ne teşekkür ne özür borçlu olduğunu söyleyip onu nöbetine yolladın.", en: "You told that sentry he owed you neither thanks nor an apology, and sent him back to his post." }
            etkiler:
              - ahlak: { duzen: 3 }
              - ordu: { lonca_avcisi: 5 }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Ona o geceyi anlattır", en: "Let him tell you about that night" }
            kronik: { tr: "Genç bir nöbetçinin o geceyi anlatmasını dinledin; ihaneti ilk kez bir tanığın ağzından duydun.", en: "You let a young sentry tell you about that night. For the first time, you heard the betrayal from a witness." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 3 }
            sonraki: "@akis"

      - id: "ihanet_sonrasi_aileler"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} arka sokaklarında kapılar birer birer açılıyor; kimi öfkeyle, kimi şaşkınlıkla. Bir kadın seni içeri almıyor ama kapıyı yüzüne de kapatmıyor. Bir adam önüne çay koyuyor, ağzını açıp tek kelime etmiyor.", en: "Doors open in the back streets of the waterfront, some angry, some stunned. One woman won't let you in, but she doesn't shut the door either. One man pours you tea and doesn't say a single word." }
          - { tr: "Son kapıda seni bir çocuk karşılıyor. Elinde senin resmini yaptığı bir kâğıt var; çizimi kötü ama ışık hep doğru yerde. \"Babam sana inanıyordu,\" diyor. \"Ben de inanmalı mıyım?\"", en: "At the last door there's a kid holding a drawing of you. Badly drawn, but the light's always in the right place. \"My dad believed in you,\" the kid says. \"Should I?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Ben de sana inanacağım.\"", en: "\"Yeah. And I'll believe in you too.\"" }
            kronik: { tr: "Babasını kaybeden çocuğa birbirinize inanacağınızı söyledin; o kapıdan bir söz vererek ayrıldın.", en: "You told a kid who'd lost their dad that you'd believe in each other. You walked away from that door having made a promise." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Bilmiyorum. Kendine inan.\"", en: "\"I don't know. Believe in yourself.\"" }
            kronik: { tr: "Çocuğa sana değil, kendine inanmasını söyledin; ona bir tanrı yerine kendi ayaklarını önerdin.", en: "You told a kid to believe in themselves instead of you. You offered them their own two feet instead of a god." }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
            sonraki: "@akis"

  # ================================================================== PERDE 3 SONU (ana yay, gün 320)
  - id: "perde3_son"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "kadimler", "filo"]
    gerilim: 4
    ana_yay: { gun: 320 }
    onemli: true
    kart: { tr: "Filo yolda", en: "The Fleet Is Coming" }
    sahne: "perde3_son_1"
    sahneler:
      - id: "perde3_son_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı gökyüzü olmadık bir yerden aydınlanıyor. Ayın hemen yanında önce bir, sonra on, sonra sayısız ışık beliriyor. Yıldız değiller; yıldızlar yaklaşmaz.", en: "At midnight, the sky lights up from the wrong direction. Right next to the moon, first one light, then ten, then too many to count. Not stars. Stars don't get closer." }
          - { tr: "Aylardır körfezin üstünde asılı duran gemi selam verir gibi bir an parlıyor. O hiçbir zaman ordu değildi, elçiydi. Ordu şimdi geliyor.", en: "The ship that's been hanging over the bay for months flashes once, like a salute. It was never the army. It was the envoy. The army's coming now." }
          - metin: { tr: "Bütün {yer:kiyikent} sokaklara dökülmüş. Ağlayan yok; ağlamak için ya çok erken ya çok geç. Bütün gözler önce gökyüzüne, sonra sana çevriliyor.", en: "All of {yer:kiyikent} is out in the streets. Nobody's crying. It's either too early or too late for that. Every pair of eyes goes to the sky first, then to you." }
            kosul: { degisken_min: { hayatta_kalan: 50 } }
          - metin: { tr: "Sokaklar yarı yarıya boş. Entegrasyon'dan beri kaybedilen her insanın yokluğu bu gece daha da büyük. Kalanlar kapı eşiklerinde battaniyelere sarınmış, gökyüzündeki ışıkları sayıyor.", en: "The streets are half empty. Everyone lost since Integration feels even more missing tonight. The ones left sit in doorways wrapped in blankets, counting the sky." }
            kosul: { degisken_max: { hayatta_kalan: 49 } }
          - metin: { tr: "{npc:thessar} yanı başında gökyüzünü seyrediyor. \"Yedi taht, kırk sekiz gemi,\" diyor sakin sakin. \"Irkım bu kadar gemiyi en son bir tanrıyı yakmak için yollamıştı.\"", en: "{npc:thessar} stands beside you, watching the sky. \"Seven thrones, forty-eight ships,\" he says calmly. \"The last time my people sent this many, it was to burn a god.\"" }
            kosul: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
          - metin: { tr: "Işıklardan biri ötekilerden parlak: gümüş ve siyah. Kadim tacı takan bir insan ancak bu kadar parlayabilir.", en: "One of the lights is brighter than the rest. Silver and black. As bright as a human can shine wearing an Ancient crown." }
            kosul: { bayrak: "aras_kadimlere_gitti" }
          - metin: { tr: "{yer:kordon|in} yeniden yakılan fenerleri körfez boyunca uzanıyor. Bir zamanlar düşmüş olan sahil şimdi şehrin ilk savunma hattı.", en: "The Esplanade's relit lanterns run all along the bay. A shoreline that fell once is now the city's first line of defense." }
            kosul: { bayrak: "p3_kordon_geri_alindi" }
          - metin: { tr: "{npc:yanki} hiç olmadığı kadar alçak bir sesle fısıldıyor: bunu daha önce gördüm, tam da bunu. sonraki sahneyi de biliyorum. bu kez değiştirebilir miyiz, bilmiyorum. ama bu kez sen varsın.", en: "{npc:yanki}, quieter than it's ever been: i've seen this before. exactly this. i know the next scene too. i don't know if we can change it this time. but this time, you're here." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KATMAN DEĞERLENDİRMESİ: SON 45 GÜN]", en: "[LAYER ASSESSMENT: FINAL 45 DAYS]" }
            satirlar:
              - { tr: "Hasat ekibi yola çıktı. Varış: değerlendirme sonucuna bağlı.", en: "Harvest crew dispatched. Arrival: pending assessment results." }
              - { tr: "Değerlendirme sonucu: henüz bilinmiyor. Sistem bunu şaşırtıcı buluyor.", en: "Assessment results: not yet known. The System finds this surprising." }
        sezgiler:
          - kosul: { stat: { per: 250 } }
            metin: { tr: "Kırk sekiz gemiden üçü düzeni bozup geride kalıyor. Filoda bir tartışma dönüyor; bu gece buraya gelmek istemeyenler var.", en: "Forty-eight ships. Three are lagging, out of formation. There's an argument going on in that fleet. Not everybody wants to come here tonight." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kırk beş gün. Ne yapacağız? Yok, dur. Sen ne yapacaksın? Sen neredeysen ben oradayım.\"", en: "\"Forty-five days. What are we gonna do? No, wait. What are you gonna do? Wherever you are, I'm there.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kırk sekiz gemi. Yirmi dördü senin, yirmi dördü benim. Bakalım kim önce bitirecek.\"", en: "\"Forty-eight ships. You take twenty-four, I'll take twenty-four. Whoever finishes first.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sinyallerini yakalıyorum. Hepsi aynı satırı tekrarlıyor. Çeviremiyorum ama... galiba geri sayım.\"", en: "\"I'm picking up their signals. They're all repeating the same line. Can't translate it, but... I think it's a countdown.\"" }
        secenekler:
          - id: "konus"
            tur: "aciga_vur"
            etiket: { tr: "{yer:kiyikent_liman|in} en yüksek yerine çık ve konuş", en: "Climb up high on the waterfront and speak" }
            kronik: { tr: "Batık vapurun gövdesine çıkıp şehre seslendin; binlerce yüz gökyüzünden sana döndü.", en: "You climbed onto the wrecked ferry and spoke to the city. Thousands of faces turned from the sky to you." }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 5, lonca: 5, yukselenler: 5, sessiz_ag: 5 }
            sonraki: "perde3_son_konus"
          - id: "ordu"
            etiket: { tr: "Bayrağının altındakileri topla", en: "Muster everyone under your banner" }
            goster: { ordu_min: 1 }
            kronik: { tr: "Gökte filo belirince ordunu topladın; {yer:kiyikent} sabaha kadar sancağının altına akan insanları izledi.", en: "When the fleet showed up in the sky, you mustered your army. All night, {yer:kiyikent} watched people stream in under your banner." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 60
            sonraki: "perde3_son_ordu"
          - id: "yakinlar"
            etiket: { tr: "Bu geceyi yanındakilerle geçir", en: "Spend tonight with the people closest to you" }
            kronik: { tr: "O geceyi orduyla ya da kalabalıkla değil, bir çatıda geçirdin; savaş bir gece bekleyebilirdi.", en: "You didn't spend that night with an army or a crowd. You spent it on a rooftop. The war could wait one night." }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
            sonraki: "perde3_son_gece"
          - id: "kule"
            etiket: { tr: "Kule'nin tepesine çık; filoya yakından bak", en: "Climb the Spire. Get a closer look at the fleet" }
            kronik: { tr: "Filoya Kule'nin tepesinden tek başına baktın; seninle onun arasında yalnızca gece vardı.", en: "You looked at the fleet alone from the top of the Spire, with nothing but the night between you." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - iliski: { yanki: { guven: 5 } }
            sonraki: "perde3_son_kule"

      - id: "perde3_son_konus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} en yüksek noktasına, batık vapurun yan yatmış gövdesine tırmanıyorsun. Aşağıda binlerce yüz, yukarıda kırk sekiz ışık var. Sesin kalabalığın üstünden aşıp körfeze kadar ulaşıyor.", en: "You climb up onto the capsized ferry's hull; it's the highest point on the waterfront. Thousands of faces below, forty-eight lights above. Your voice carries over the crowd all the way to the bay." }
          - { tr: "Sonradan ne söylediğini tam olarak hatırlayan çıkmıyor; herkesin aklında kalan, nasıl söylediğin. Korkusuzca değil, korkuyu bir alet gibi elinde tutarak.", en: "Afterward, nobody can remember exactly what you said. Everybody just remembers how you said it: not without fear, but holding fear like a tool in your hand." }
        secenekler:
          - id: "savas"
            etiket: { tr: "\"Kırk beş gün. Her birinde savaşacağız.\"", en: "\"Forty-five days. We fight every one of them.\"" }
            kronik: { tr: "Kalan kırk beş günün her birinde savaşacağınızı söyledin; teslim olmak o gece seçenek olmaktan çıktı.", en: "You told the city you'd fight every one of those forty-five days. Surrender came off the table that night." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - ordu_kazan: 30
              - degisken: { kadim_tehdit: -3 }
            sonraki: "@akis"
          - id: "yasayin"
            etiket: { tr: "\"Kırk beş gün. Yaşayın onları.\"", en: "\"Forty-five days. Go live them.\"" }
            kronik: { tr: "Şehre kalan kırk beş günü yaşamasını söyledin; {yer:kiyikent|den} korku yerine düğünler, doğumlar, şarkılar istedin.", en: "You told the city to go live those forty-five days. You asked {yer:kiyikent} for weddings, births, and songs instead of fear." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_ordu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman} meydanı sabaha kadar dolup taşıyor: avcılar, gönüllüler, bağladığın canavarlar, Kapı külünden kalkan şeyler. Hepsi sancağının altında, sıra sıra dizilmiş.", en: "The waterfront square fills up until dawn. Hunters, volunteers, monsters you've bound, things that rose from the ash of Gates; all of them under your banner, rank on rank." }
          - { tr: "Saymaya başlıyor, bir yerde vazgeçiyorsun. Bu gece sayıların önemi yok. Önemli olan, hiçbirinin gökyüzüne bakmaması; hepsinin gözü sende.", en: "You try to count them and give up somewhere along the way. Numbers don't matter tonight. What matters is that none of them are looking at the sky. They're all looking at you." }
          - metin: { tr: "Ön safta Demir Yemin'in eski askerleri var; darbe gecesinden beri ilk kez rütbelerini omuzlarına takmışlar.", en: "The front rank is old Iron Oath soldiers, wearing their stripes for the first time since the night of the coup." }
            kosul: { bayrak: ["lonca_hakimiyeti", "ihanet_kaya"] }
          - metin: { tr: "Ön safta Demir Yemin'in eski askerleri var; darbe gecesinden beri ilk kez rütbelerini omuzlarına takmışlar.", en: "The front rank is old Iron Oath soldiers, wearing their stripes for the first time since the night of the coup." }
            kosul: { bayrak: ["lonca_hakimiyeti", "kaya_devrildi"], bayrak_yok: "ihanet_kaya" }
          - metin: { tr: "Ön safta Demir Yemin'in eski askerleri var; omuzlarındaki rütbeler bu gece için yeniden parlatılmış. Entegrasyon'dan beri Kapı'dan Kapı'ya dövüşen bu adamlar ilk kez tek bir sancağın altında bir arada duruyor.", en: "The front rank is old Iron Oath soldiers, their stripes on their shoulders, polished up again for tonight. For a year they fought Gate by Gate. This is the first time they've stood together under one banner." }
            kosul: { bayrak: "lonca_hakimiyeti", bayrak_yok: ["ihanet_kaya", "kaya_devrildi"] }
        secenekler:
          - id: "talim"
            etiket: { tr: "Sabaha kadar talim yaptır", en: "Drill them till dawn" }
            kronik: { tr: "Ordunu şafağa kadar talim ettirdin; güneş doğduğunda saflar tek bir beden gibi kıpırdıyordu.", en: "You drilled your army until dawn. By sunrise, the ranks moved like a single body." }
            etkiler:
              - ahlak: { duzen: 4 }
              - ordu_kazan: 30
            sonraki: "@akis"
          - id: "gonder"
            etiket: { tr: "\"Bu gece evlerinize gidin. Yarın başlıyoruz.\"", en: "\"Go home tonight. We start tomorrow.\"" }
            kronik: { tr: "Ordunu son bir gece için evlerine yolladın; sabah dönmelerini istedin ve onlara güvendin.", en: "You sent your army home for one last night. You asked them back by morning, and you trusted them to come." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_gece"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir çatıda, battaniyenin altında, eski bir termostan çay içiyorsunuz. Gökyüzü yanıyor; bir süre kimse bundan söz etmiyor.", en: "Up on a roof, under a blanket, drinking tea out of an old thermos. The sky is on fire, and for a while nobody mentions it." }
          - metin: { tr: "{npc:deniz_arman} omzuna yaslanıyor. \"Vapuru hatırlıyor musun?\" diyor. \"Her sabah kaçırırdık. Keşke bir sabah daha kaçırabilsek.\"", en: "{npc:deniz_arman} leans on your shoulder. \"Remember the ferry?\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Every morning. Every morning we missed it. I wish we could miss it one more time.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} termosu elinden alıp bir yudum içiyor. \"Kırk beş gün,\" diyor. \"Bir hekim için o kadar da kısa değil. İnsan kırk beş günde iyileşebilir.\"", en: "{npc:elif_sari} takes the thermos from you and has a sip. \"Forty-five days,\" she says. \"That's not that short, for a doctor. People can heal in forty-five days.\"" }
            kosul: { yoldas: "elif_sari" }
          - metin: { tr: "Çatıda yalnızsın. Battaniye tek kişilik, çaysa iki kişilik demlenmiş; eski bir alışkanlık.", en: "You're alone on the roof. The blanket's sized for one. The tea's made for two. Old habit." }
            kosul: { yoldas_sayisi_max: 0 }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Bu iş bitince yine buraya çıkarız.\"", en: "\"When this is over, we come back up here.\"" }
            kronik: { tr: "Yanan gökyüzünün altında, bir çatıda, her şey bitince oraya yeniden çıkma sözü verdin.", en: "Under a burning sky, on a rooftop, you promised to come back up there when it was all over." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 8 }, elif_sari: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Hiçbir şey söyleme; gökyüzünü izle", en: "Don't say anything. Just watch the sky" }
            kronik: { tr: "Filonun göründüğü gece tek kelime etmeden gökyüzünü izledin; o sessizlik söyleyebileceğin her sözden uzun sürdü.", en: "The night the fleet appeared, you watched the sky without a word. That silence outlasted anything you could have said." }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_kule"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin bugüne dek tırmanılmış en yüksek katında rüzgâr esmiyor. Filo buradan bir şehir kadar büyük görünüyor; gemilerin arasına örümcek ağı gibi ince ışık iplikleri gerilmiş.", en: "On the Spire's highest climbed floor, there's no wind. From up here the fleet looks as big as a city, with thin threads of light running between the ships like a spiderweb." }
          - { tr: "Gemilerin en büyüğü sana dönüyor. Ne ışık var ne ses; yalnızca dönüp bekliyor. Kırk sekiz gemi içinde seni tanıyan bir tane var.", en: "One of the ships, the biggest one, turns toward you. No light, no sound. It just turns and waits. Out of forty-eight ships, there's one that knows who you are." }
          - metin: { tr: "{npc:yanki}: o gemi. o gemiyi tanıyorum. nereden tanıdığımı bilmiyorum.", en: "{npc:yanki}: that ship. i know that ship. i don't know how i know it." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "isaret"
            tur: "gosteris"
            etiket: { tr: "Gemiye yolunun ışığıyla bir işaret ver", en: "Signal the ship with your Path's light" }
            gerekli: { stat: { wil: 300 } }
            kronik: { tr: "Kadim amiral gemisine kendi Yolunun ışığıyla işaret verdin; filo o ışığı gördü ve bir an duraksadı.", en: "You signaled the Ancient flagship with the light of your own Path. The fleet saw it, and for a moment it hesitated." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - dikkat: 10
              - degisken: { kadim_tehdit: -5 }
              - xp_seviye: 30
            sonraki: "@akis"
          - id: "yanki_sor"
            etiket: { tr: "\"O gemiyi nereden tanıyorsun?\"", en: "\"How do you know that ship?\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bilgi: "amiral_gemisi"
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "perde3_son_kule_yanki"
          - id: "in"
            etiket: { tr: "Aşağı in; şehir seni bekliyor", en: "Head back down. The city's waiting" }
            kronik: { tr: "Filoya bir kez bakıp şehrine indin; gözünü gökten çekip yere, insanlarına çevirdin.", en: "You took one look at the fleet and went back down to your city. You turned your eyes from the sky to the ground, and to your people." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_kule_yanki"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Filo yerinden kıpırdamıyor; gemilerin arasındaki ışık iplikleri nefes alır gibi hafif hafif titriyor.", en: "{npc:yanki} goes quiet for a long time. The fleet holds still. The threads of light between the ships tremble slightly, like something taking a breath." }
          - { tr: "bilmiyorum, diyor sonunda. adımı bile hatırlamıyorum, onu bana kimin verdiğini de. bir zamanlar bir adım vardı, o kadarını biliyorum. ama o geminin gölgesini hatırlıyorum. bir gökyüzünü örttüğünü gördüm, sonra bir başkasını, sonra bir başkasını daha. kaç tane, sayamıyorum.", en: "i don't know, it says at last. i can't even remember my name, or who gave it to me. i know i had one once. that's all. but i remember that ship's shadow. i saw it cover a sky. then a different sky. then another. i can't count how many." }
          - { tr: "hep sonda geldi, hiçbir zaman başta değil. bunun ne anlama geldiğini bilmiyorum; bilmek istediğimden de emin değilim. ama cevap aşağıda değil. Kule'nin bittiği yerde ya da sistemin başladığı yerde.", en: "it always came at the end. never at the beginning. i don't know what that means. i'm not sure i want to. but the answer isn't down there. it's where the Spire ends, or where the system begins." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Oraya birlikte çıkacağız.\"", en: "\"Then we go up there together.\"" }
            kronik: { tr: "Kule'den Kadim amiral gemisine baktın; adını hatırlamayan kafandaki ses, o geminin gölgesini birden çok gökyüzünden hatırlıyordu. Nedenini öğrenmek için Kule'nin zirvesine birlikte çıkacaktınız.", en: "You looked at the Ancient flagship from the Spire. The voice in your head couldn't remember its own name, but it remembered that ship's shadow across more than one sky. To learn why, the two of you would climb to the top of the Spire together." }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"

  # ================================================================== DİKKAT EŞİKLERİ (Perde 3, motor tohumlar)
  - id: "dikkat_75_p3"
    perde: [3]
    agirlik: 1
    etiketler: ["dikkat", "kadimler"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Ölçücü", en: "The Assessor" }
    sahne: "dikkat_75_p3_1"
    sahneler:
      - id: "dikkat_75_p3_1"
        paragraflar:
          - { tr: "Sabah gözünü açtığında pencerende yabancı bir satır duruyor; rengi mavi değil, gümüş: [Ölçüm randevusu: bugün.] Altında ne saat yazıyor ne yer. Gerek de yok, seni nasılsa bulacak.", en: "When you wake up, there's a strange line in your window. Not blue. Silver: [Measurement appointment: today.] No time, no place. It doesn't need either. It'll find you." }
          - { tr: "Öğleye doğru buluyor da. Kalabalığın arasından uzun boylu, ince, şapkalı biri geçiyor; elinde cetvel, yüzünde terzi dikkati. İnsanlar nedenini bilmeden ona yol açıyor.", en: "Around noon, it does. A thin, tall figure in a hat walks through the crowd with a measuring rod in hand and a tailor's attention on its face. People get out of its way without knowing why." }
          - { tr: "\"Anomali,\" diye sesleniyor sana saygılı bir tavırla. \"Filonun ölçülerinizi bilmesi gerekiyor. Lütfen kıpırdamayın, canınız acımayacak. Genellikle.\"", en: "\"The anomaly,\" it says, respectfully. \"The fleet needs your measurements. Please hold still. It won't hurt. Usually.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim Ölçücüsü · A kademesi", en: "[ANALYSIS] Ancient Assessor · A-Grade" }
            satirlar:
              - { tr: "Ölçtüğü şey ölçüldükten sonra küçülür.", en: "Whatever it measures gets smaller afterward." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Cetvelin üstündeki çizgiler seviyeni değil, eksiğini sayıyor. Ölçülmek, senden bir şey alınması demek.", en: "The marks on that rod aren't counting your level. They're counting what you're missing. Getting measured means getting something taken." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ölçmesine izin verme. ya da ver, ama yanlış ölçsün. bende yanlış rakam çok.", en: "don't let it measure you. or let it, but make it measure wrong. i've got plenty of wrong numbers." }
        secenekler:
          - id: "kac"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış; ölçülecek bir şey bırakma", en: "Lose yourself in the crowd. Leave nothing to measure" }
            etkiler:
              - gizle: 10
              - ahlak: { duzen: -2 }
            sonraki: "dikkat_75_p3_kacis"
          - id: "yanlis"
            etiket: { tr: "{npc:yanki|e} yanlış rakamları verdir", en: "Have {npc:yanki} feed it the wrong numbers" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 6
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "dikkat_75_p3_yanlis"
          - id: "cetvel"
            etiket: { tr: "Cetvelini kır", en: "Break its measuring rod" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -1 }
              - dikkat: 4
              - savas: { dusmanlar: ["kadim_olcucu@oyuncu+3"], kazan: "dikkat_75_p3_zafer", kaybet: "dikkat_75_p3_yenilgi" }

      - id: "dikkat_75_p3_kacis"
        paragraflar:
          - { tr: "Bir omuz, bir omuz daha, bir çarşı tentesi derken kalabalığın içinde yok olup gidiyorsun. Ölçücü durup çevresine bakınıyor; cetvelini bir kez havaya kaldırıp indiriyor.", en: "A shoulder in the crowd, another shoulder, a market awning, and then you're gone. The Assessor stops, looks around, raises its rod once, and lowers it." }
          - { tr: "Pencerendeki gümüş satır değişiyor: [Randevu ertelendi.] Ertelendi ama iptal edilmedi.", en: "The silver line in your window changes: [Appointment rescheduled.] Rescheduled. Not canceled." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bir dahaki sefere hazır ol", en: "Be ready next time" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "izle"
            etiket: { tr: "Ölçücüyü uzaktan izle; kimleri ölçüyor?", en: "Tail the Assessor. Who else is it measuring?" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bilgi: "olcucu_listesi"
            sonraki: "@akis"

      - id: "dikkat_75_p3_yanlis"
        paragraflar:
          - { tr: "Ölçücü cetvelini sana doğrultunca rakamlar akmaya başlıyor, ama akanlar senin rakamların değil. {npc:yanki} onlara bir şeyler fısıldadıkça rakamlar şaşırıp birbirine karışıyor, sonunda sıfıra iniyor.", en: "The Assessor holds its rod up to you and the numbers start running. Except they aren't your numbers. {npc:yanki} whispers something to them, and the numbers get confused, tangle up, and drop to zero." }
          - { tr: "Ölçücü uzun uzun cetveline bakıyor. \"Hiç,\" diyor sonunda. \"Ölçtüğüm şey bir hiç. İlginç.\" Şapkasını düzeltip uzaklaşırken adımlarında ilk kez bir tereddüt seziliyor.", en: "The Assessor stares at its rod for a long time. \"Nothing,\" it says at last. \"What I measured is nothing. Interesting.\" It straightens its hat and leaves. For the first time, there's a hitch in its stride." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Arkasından gülümse", en: "Smile at its back" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "{npc:yanki|e} teşekkür et", en: "Thank {npc:yanki}" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"

      - id: "dikkat_75_p3_zafer"
        paragraflar:
          - { tr: "Cetvel ikiye kırılıyor, Ölçücü de onunla birlikte. İçinden bir avuç gümüş rakam dökülüp sokağa saçılıyor. Toplamaya koşan çocuklar, rakamlar avuçlarında eriyince korkup ellerinden bırakıyor.", en: "The rod snaps in two, and the Assessor with it. A handful of silver numbers spills out across the street. Kids run to scoop them up, then drop them in a panic when they melt in their hands." }
          - { tr: "Pencerende gümüş satır yanıp sönüyor: [Ölçüm başarısız. Ölçücü: kayıp. Not düşüldü.]", en: "The silver line in your window blinks: [Measurement failed. Assessor: lost. Noted.]" }
        secenekler:
          - id: "topla"
            etiket: { tr: "Rakamları topla; ne ölçtüğünü öğren", en: "Gather up the numbers. Find out what it measured" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "olcucu_listesi"
              - xp_seviye: 30
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bırak erisin", en: "Let them melt" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "dikkat_75_p3_yenilgi"
        paragraflar:
          - { tr: "Cetvel omzuna değdiği an bir şey eksiliyor. Ne olduğunu bilemiyorsun: bir anı mı, bir renk mi, bir sözcük mü? Dizlerinin bağı çözülüyor.", en: "The rod touches your shoulder, and something goes missing. You don't know what. A memory, a color, a word. Your knees buckle." }
          - { tr: "\"Teşekkürler,\" diyor Ölçücü, notunu alırken. \"Beklenenden büyüksünüz. Bunun kimseye faydası olmayacak.\" Sonra çekip gidiyor; sen yerde, içinde bir eksikle kalakalıyorsun.", en: "\"Thank you,\" the Assessor says, jotting a note. \"You're larger than expected. That won't do anyone any good.\" It leaves. You stay on the ground, missing something." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; neyin eksildiğini bul", en: "Get up. Figure out what's missing" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { kadim_tehdit: 3 }
            sonraki: "@akis"
          - id: "unut"
            etiket: { tr: "Eksik olanı unut; zaten unutmuşsun", en: "Forget about it. You already did" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { kadim_tehdit: 3 }
            sonraki: "@akis"

  - id: "dikkat_100_p3"
    perde: [3]
    agirlik: 1
    etiketler: ["dikkat", "sistem"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Yama", en: "The Patch" }
    sahne: "dikkat_100_p3_1"
    sahneler:
      - id: "dikkat_100_p3_1"
        paragraflar:
          - { tr: "Dünya bir anda donup kalıyor, düpedüz donuyor: martılar havada asılı, dalgalar yarı kıvrılmış, bir çocuğun gülüşü ağzında takılı kalmış. Kımıldayan tek şey sensin.", en: "The world freezes. Actually freezes: gulls in midair, waves half-curled, a kid's laugh hanging in her mouth. The only thing still moving is you." }
          - { tr: "Önündeki havada bir dikiş açılıyor; içinden bembeyaz, kusursuz, yüzsüz bir şey çıkıyor. Elleri olması gereken yerde iki pencere duruyor. Sistem seni bir hata olarak kaydetmiş, şimdi de o hatayı düzeltmeye gelmiş.", en: "A seam opens in the air in front of you, and something white, flawless and faceless steps through it, with two windows where its hands should be. The System logged you as a bug. Now it's here to fix it." }
          - metin: { tr: "{npc:yanki} kafanın içinde haykırıyor; ilk kez gerçekten korkmuş: bu bir yama. beni de siler, ikimizi de siler. dövüş ya da pazarlık et, ama bekleme.", en: "{npc:yanki} is screaming in your head, really scared for the first time: that's a patch. it'll wipe me too. it'll wipe us. fight or bargain, but don't wait." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[SİSTEM DÜZELTMESİ: KAPSAM 1]", en: "[SYSTEM CORRECTION: SCOPE 1]" }
            satirlar:
              - { tr: "Hedef: anomali. Yöntem: geri alma. Tahmini süre: bir an.", en: "Target: anomaly. Method: rollback. Estimated duration: one moment." }
              - { tr: "Not: önceki düzeltme girişimleri: 3. Başarı: 0. Bu not gizli olmalıydı.", en: "Note: previous correction attempts: 3. Successes: 0. This note was supposed to be hidden." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Yamayı parçala", en: "Tear the patch apart" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: -2 }
              - savas: { dusmanlar: ["sistem_yamasi@oyuncu+6"], kazan: "dikkat_100_p3_zafer", kaybet: "dikkat_100_p3_yenilgi" }
          - id: "pazarlik"
            etiket: { tr: "\"Benden bir şey al ve git.\"", en: "\"Take something from me and go.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - gizle: 15
              - can: -1000
            sonraki: "dikkat_100_p3_pazarlik"
          - id: "yanki_ver"
            etiket: { tr: "{npc:yanki|i} göster; aradığı o", en: "Point it at {npc:yanki}. That's what it's after" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: -4 }
              - gizle: 20
              - iliski: { yanki: { guven: -30, korku: 20 } }
              - hafiza: { npc: "yanki", id: "olay:dikkat_100_p3", agirlik: -70 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "dikkat_100_p3_ele_ver"

      - id: "dikkat_100_p3_zafer"
        paragraflar:
          - { tr: "Yama kırılıyor: pencereleri paramparça, beyaz gövdesi satır satır siliniyor. Dünya yeniden akarken martılar kanat çırpıyor, çocuğun gülüşü yarım kaldığı yerden tamamlanıyor. Kimsenin bir şeyden haberi yok.", en: "The patch breaks. Its windows shatter, its white body erases line by line. The world starts moving again: the gulls flap, the kid finishes her laugh. Nobody noticed a thing." }
          - { tr: "Pencerende yeni bir satır beliriyor: [Düzeltme başarısız. Girişim 4. Başarı: 0.] Bir süre gözünü ondan ayıramıyorsun. Derken satır kendiliğinden siliniyor, sanki biri utanmış.", en: "A new line in your window: [Correction failed. Attempt 4. Successes: 0.] You stare at it for a while. Then it deletes itself, like somebody got embarrassed." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Sistem'e gül", en: "Laugh at the System" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -2 }
              - xp_seviye: 60
              - dikkat: -20
            sonraki: "@akis"
          - id: "dusun"
            etiket: { tr: "Önceki üç girişimi düşün", en: "Think about the three attempts before this one" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 50
              - dikkat: -20
              - bilgi: "dort_duzeltme"
            sonraki: "@akis"

      - id: "dikkat_100_p3_yenilgi"
        paragraflar:
          - { tr: "Yamanın penceresi göğsüne değince bir an hiç var olmamış gibi oluyorsun. Sonra yeniden varsın, ama bir şey eksik. Pencerene bakılırsa iki seviye gerilemişsin; dünya bunu bir hata düzeltmesi diye kayda geçiyor.", en: "The patch's window touches your chest, and for a moment it's like you never existed. Then you do again, but something's missing. Your window says you dropped two levels, and the world logs it as a bug fix." }
          - { tr: "Yama dikişin içine geri çekiliyor. Sistem işini yaptığı kanısında. Yanılıyor, ama biraz da haklı.", en: "The patch steps back into its seam. The System thinks it did its job. It's wrong. But it's a little bit right." }
          - metin: { tr: "{npc:yanki} uzun süre susuyor. Sonra çok cılız bir sesle: buradayım. büyük kısmım. büyük kısmım burada.", en: "{npc:yanki} is quiet for a long time. Then, very faint: i'm here. most of me. most of me is here." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve yeniden tırman", en: "Get up and climb again" }
            etkiler:
              - ahlak: { duzen: 2 }
              - dikkat: -30
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "\"Kalanını ben taşırım.\"", en: "\"I'll carry the rest of you.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - dikkat: -30
              - iliski: { yanki: { baglilik: 10, guven: 6 } }
            sonraki: "@akis"

      - id: "dikkat_100_p3_pazarlik"
        paragraflar:
          - { tr: "Yama bir an duraksıyor. Pencereleri önüne bir teklif listesi seriyor: bir anı, bir yıl, bir yetenek, bir isim. Sen daha seçemeden o seçiyor ve alıp götürüyor.", en: "The patch pauses. Its windows open a menu in front of you: a memory, a year, a skill, a name. Before you can pick, it picks for you, and takes." }
          - { tr: "Neyin gittiğini anlayamıyorsun; tek bildiğin, eski bir şarkının nakaratını artık hatırlamadığın. Yama dikişin içine geri dönerken pencerende [Düzeltme: kısmi.] yazıyor.", en: "You can't tell what's gone. Just that you can't remember the chorus of an old song anymore. The patch steps back into its seam, and your window reads [Correction: partial.]" }
        secenekler:
          - id: "mirildan"
            etiket: { tr: "Şarkıyı hatırlamaya çalış", en: "Try to remember the song" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - dikkat: -20
            sonraki: "@akis"
          - id: "devam"
            etiket: { tr: "Önemli değil. Devam et", en: "Doesn't matter. Keep moving" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - dikkat: -20
            sonraki: "@akis"

      - id: "dikkat_100_p3_ele_ver"
        paragraflar:
          - { tr: "Yama dönüp bir anda içine, {npc:yanki|in} durduğu yere bakıyor. {npc:yanki} kafanın içinde, daha önce hiç duymadığın bir hızla köşeden köşeye kaçıyor.", en: "The patch turns and looks straight into you, right at where {npc:yanki} lives. {npc:yanki} runs. Inside your head, corner to corner, faster than you've ever heard it move." }
          - { tr: "Yama {npc:yanki|in} bir parçasını koparıp dikişe geri dönüyor. Dünya yeniden akarken kafanın içi, Entegrasyon'dan beri ilk kez, tuhaf biçimde ferah.", en: "The patch tears off a piece of {npc:yanki} and steps back into the seam. The world starts moving again. The inside of your head feels weirdly roomy, for the first time in years." }
          - { tr: "Derken kırık, küçücük bir fısıltı: neden.", en: "Then a whisper, small and broken: why." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "\"Özür dilerim.\"", en: "\"I'm sorry.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - dikkat: -30
              - iliski: { yanki: { guven: 5 } }
            sonraki: "@akis"
          - id: "hayatta"
            etiket: { tr: "\"Hayatta kalmam gerekiyordu.\"", en: "\"I had to stay alive.\"" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - dikkat: -30
            sonraki: "@akis"

  # ================================================================== PERDE 3 KIYIKENT (Gün 181–330)
  # ---------------------------------------------------------------- Ordu: bayrağın altında
  - id: "p3_bayrak_altinda"
    perde: [3]
    bolge: ["kiyikent_liman", "kule_dibi", "sanayi"]
    gun: { min: 185, max: 310 }
    agirlik: 6
    etiketler: ["ordu", "hakimiyet"]
    gerilim: 2
    npc: ["kaya_demir"]
    kart: { tr: "Kapıdaki kuyruk", en: "The Line at Your Door" }
    sahne: "p3_bayrak_1"
    sahneler:
      - id: "p3_bayrak_1"
        paragraflar:
          - { tr: "Sabah kapını açınca sokağın sonuna kadar uzanan bir kuyrukla karşılaşıyorsun: avcılar, kapı temizleyicileri, yarısı Lonca yeleği giymiş gençler, sırtında tüfekle bir nine. Hepsi susmuş, gözlerini kapına dikmiş.", en: "When you open your door in the morning, there's a line running all the way down the block. Hunters, Gate sweepers, kids half of them in Guild vests, a grandmother with a rifle slung across her back. All quiet. All looking at your door." }
          - { tr: "En öndeki adamın elinde yüzlerce imza taşıyan bir kâğıt var. \"Senin için savaşmak istiyoruz,\" diyor. \"Bir fraksiyon için değil, senin için. Sıralama'nın en tepesindeki adın arkasında durmak istiyoruz.\"", en: "The guy up front is holding a sheet of paper with hundreds of signatures on it. \"We want to fight for you,\" he says. \"Not for a faction. For you. We want to stand behind the name at the top of the Ranking.\"" }
          - metin: { tr: "Kuyruğun sonunda {npc:kaya_demir|in} adamlarından birkaçı da bekliyor: saçları kısacık kesilmiş, ayaklarında eski askerî postallar. Gözlerini kaçırıyorlar; komutanlarına haber vermeden gelmişler.", en: "At the back of the line, with their buzz cuts and old combat boots, are a few of {npc:kaya_demir|pos} people. They won't meet your eyes. They didn't tell their commander." }
            kosul: { npc_hayatta: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { cha: 180 } }
            metin: { tr: "Kuyrukta dört yüz on iki kişi var. Üç yüzü sende bir kurtarıcı, yüzü bir kalkan görüyor. On ikisiyse gizlice birilerine bilgi taşıyor.", en: "Four hundred twelve people in line. Three hundred see you as a savior, a hundred as a shield. Twelve are quietly reporting to somebody." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ordu. bunu hep sen mi istedin, yoksa ordu mu seni istedi? arada fark var.", en: "an army. did you always want one? or did the army want you? it matters." }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Hepsini al; bayrak dikilsin", en: "Take them all. Raise the banner" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -1 }
              - ordu_kazan: 50
              - bayrak: "p3_bayrak_kuruldu"
              - dikkat: 4
              - itibar: { lonca: -4, siginak: -2 }
            sonraki: "p3_bayrak_tore"
          - id: "sec"
            etiket: { tr: "Tek tek bak; yalnızca hazır olanları al", en: "Look at each one. Take only the ready ones" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - ordu: { lonca_avcisi: 25 }
              - bayrak: "p3_bayrak_kuruldu"
              - bilgi: "kuyruktaki_muhbirler"
            sonraki: "p3_bayrak_secim"
          - id: "kaya_konus"
            etiket: { tr: "Önce {npc:kaya_demir|in} adamlarını komutanlarına gönder", en: "Send {npc:kaya_demir|pos} people back to their commander first" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 4 }
              - iliski: { kaya_demir: { saygi: 10, guven: 6 } }
              - ordu_kazan: 30
              - bayrak: "p3_bayrak_kuruldu"
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "p3_bayrak_tore"
          - id: "reddet"
            etiket: { tr: "\"Bana ordu lazım değil. Evlerinize dönün.\"", en: "\"I don't need an army. Go home.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3, duzen: -2 }
              - gizle: 4
            sonraki: "p3_bayrak_red"

      - id: "p3_bayrak_tore"
        paragraflar:
          - { tr: "Öğleden sonra {yer:kiyikent_liman} meydanında bir bayrak yükseliyor; onu ne tasarlayan oldu ne diken. Sabah orada olmayan bu bez parçasını sanki Sistem senin adına kendi eliyle asmış.", en: "In the afternoon, a banner goes up in the waterfront square. Nobody designed it. Nobody raised it. That piece of cloth wasn't there this morning; it's like the System hung it in your name all by itself." }
          - { tr: "Altında yeni askerlerin, birbirini tanımayan insanların sırası uzanıyor. Önlerinden geçerken hepsi aynı anda dikleşiyor; oysa bunu onlara kimse öğretmedi.", en: "Under it stand your new troops, people who've never met each other. When you walk past, they all straighten up at the same moment. Nobody taught them that." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[ORDU KURULDU]", en: "[ARMY FORMED]" }
            satirlar:
              - { tr: "Komutan: sen. Sancak: otomatik oluşturuldu. Telif: Sistem'e ait.", en: "Commander: you. Banner: auto-generated. Copyright: property of the System." }
        secenekler:
          - id: "yemin"
            etiket: { tr: "Onlara yemin ettirme; sen onlara et", en: "Don't make them swear. You swear to them" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - ordu_kazan: 10
              - itibar: { siginak: 4 }
            sonraki: "@akis"
          - id: "disiplin"
            etiket: { tr: "İlk emrini ver: sabaha kadar nöbet", en: "Give your first order: watch till dawn" }
            etkiler:
              - ahlak: { duzen: 4 }
              - ordu_kazan: 10
              - itibar: { lonca: 4 }
            sonraki: "@akis"

      - id: "p3_bayrak_secim"
        paragraflar:
          - { tr: "Dört yüz on iki kişinin önünden tek tek geçiyorsun. Gözünü diktiğin biri elini kaldırıyor; eli titriyor ama bakışları dimdik. Bir başkası kendinden emin gülümsüyor, cebindeki telsiz ise cızırdayıp duruyor.", en: "You walk down four hundred twelve people. You look at one, and her hand comes up, shaking, eyes dead steady. Another one smiles like he's got it all figured out, and the radio in his pocket crackles." }
          - { tr: "Akşama kadar yüz kişi seçiyorsun, ama tam doğru yüz kişiyi. On iki muhbiri de sessizce kuyruktan ayıklıyorsun; kimsenin ruhu duymuyor, en başta da onların.", en: "By evening you've picked a hundred. The right hundred. You quietly ease the twelve informants out of line. Nobody notices. Them least of all." }
        secenekler:
          - id: "muhbir_geri"
            etiket: { tr: "Muhbirleri yanlış bilgiyle sahiplerine yolla", en: "Send the informants home with bad intel" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "muhbir_ac"
            tur: "aciga_vur"
            etiket: { tr: "Muhbirleri meydanda ifşa et", en: "Out the informants in the square" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, merhamet: -2 }
              - dikkat: 4
              - itibar: { lonca: 4, sessiz_ag: -4 }
            sonraki: "@akis"

      - id: "p3_bayrak_red"
        paragraflar:
          - { tr: "Kuyruk dağılmıyor. Bir saat sonra hâlâ oradalar; iki saat sonra biri çay, biri sandalye getirmiş. Akşama doğru kuyruğun başındaki adam kapını yeniden çalıyor.", en: "The line doesn't break up. An hour later they're still there. Two hours later somebody brings tea, somebody brings a chair. Toward evening, the guy at the front knocks on your door again." }
          - { tr: "\"Anladık,\" diyor. \"Senin orduya ihtiyacın yok. Ama bizim sana ihtiyacımız var. Biz yine de burada bekleyeceğiz; istemezsen bayrak bile açmayız.\"", en: "\"We get it,\" he says. \"You don't need an army. But we need you. We'll wait out here anyway. We won't even raise a banner if you don't want one.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Peki. Bayraksız.\"", en: "\"Fine. No banner.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - ordu: { lonca_avcisi: 15 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "sert"
            etiket: { tr: "Kapıyı kapat. Bu kez kesin", en: "Shut the door. For real this time" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -2 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule 50+ toplumu: Ellinciler
  - id: "p3_ellinciler"
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 190, max: 325 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kule", "toplum", "hakimiyet"]
    gerilim: 2
    kart: { tr: "Ellinci kattakiler", en: "The Fifties" }
    sahne: "p3_ellinciler_1"
    sahneler:
      - id: "p3_ellinciler_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin elli birinci katında bir şehir kurulmuş, ama kimse ona şehir demiyor. Ellinciler buraya, başka kat yokmuş gibi, \"Kat\" diyor. Temiz su, yanan ışıklar, kapı canavarlarının erişemeyeceği yükseklikte bahçeler.", en: "There's a city on the Spire's fifty-first floor. Nobody calls it a city. The Fifties call it \"the Floor,\" like there aren't any others. Clean water, working lights, gardens up where the Gate monsters can't reach." }
          - { tr: "Merdivenin başındaki kapıyı C kademesi iki muhafız bekliyor. Kapının iç yüzüne küçük harflerle yazılmış bir tabela asılı: [Kademe B altı: hizmet girişini kullanınız.]", en: "At the top of the stairs there's a gate with two C-Grade guards on it. On the inside of the gate hangs a little sign: [Below B-Grade: please use the service entrance.]" }
          - { tr: "Muhafızlardan biri önce sana, sonra penceresine bakıyor; benzi atıyor. Yanındakini dürtüyor, ikisi birden eğilerek kapıyı açıyor.", en: "One of the guards looks at you, then at his window. The color drains out of his face. He elbows the other one, and they both swing the gate open, bowing." }
          - metin: { tr: "Kapının dibindeki sahanlıkta on bir yaşında bir kız oturuyor; sırtında çantası, elinde bir kapı kristali. E kademesi. İçeri alınmayı bekliyor, anlaşılan günlerdir.", en: "On the landing at the foot of the gate sits an eleven-year-old girl with a backpack and a Gate crystal in her hand. E-Grade. Waiting to be let in. For days, by the look of it." }
            kosul: { gorunen_seviye_min: 1 }
          - metin: { tr: "Kapının üstündeki balkonda {npc:aras_kurt} oturuyor, bacaklarını boşluğa sarkıtmış. Kat'a hiç girmemiş; kapıyı seyretmek için oraya tırmanmış. \"Merak ediyorum,\" diye sesleniyor aşağı. \"Hangi kapıdan gireceksin?\"", en: "Up on the balcony over the gate, legs dangling over the drop, sits {npc:aras_kurt}. He never went inside the Floor. He climbed up there to watch the gate. \"I'm curious,\" he calls down. \"Which door are you gonna use?\"" }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: ["aras_cok_evren_yoldasi", "aras_kadimlere_gitti"] }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Kızın elindeki kristal B kademesi bir kapıdan çıkmış; o kapıyı kız tek başına kapatmış. Kademesi E, ama yaptığı iş E kademesinin işi değil.", en: "The crystal in the girl's hand came out of a B-Grade Gate. She closed it herself. She's E-Grade. What she did isn't." }
        secenekler:
          - id: "kizla"
            etiket: { tr: "Kızın elinden tut; ikiniz birlikte girin", en: "Take the girl's hand. You go in together" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - bayrak: "p3_ellinci_kiz"
              - dikkat: 3
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 6, max: 14 } }
            sonraki: "p3_ellinciler_ic"
          - id: "tabela"
            tur: "gosteris"
            etiket: { tr: "Tabelayı tek parmakla sök", en: "Pull the sign off with one finger" }
            gerekli: { stat: { str: 200 } }
            etkiler:
              - ahlak: { duzen: -4, insanlik: -1 }
              - dikkat: 5
              - itibar: { siginak: 4, lonca: -3 }
              - iliski: { aras_kurt: { saygi: 5, guven: 2 } }
            sonraki: "p3_ellinciler_ic"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Görünen seviyeni düşür; hizmet girişinden gir", en: "Drop your visible level. Use the service entrance" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: 2 }
              - bilgi: "ellinci_kat_hizmet"
              - iliski: { aras_kurt: { guven: 3 } }
            sonraki: "p3_ellinciler_hizmet"

      - id: "p3_ellinciler_ic"
        yer: "kule"
        paragraflar:
          - { tr: "İçeride Kat seni bir kral gibi karşılıyor. Kat'ın \"Sözcüsü\" olan, giysileri tertemiz bir kadın sana elma suyu ikram ediyor; hem de gerçek elmadan. B kademesi birkaç yüz kişi pencerelerden seni seyrediyor.", en: "Inside, the Floor greets you like visiting royalty. A woman in clean clothes, the Floor's \"Speaker,\" offers you apple juice. Real apples. A few hundred B-Grades watch from the windows." }
          - { tr: "\"Burada size bir yer ayrıldı,\" diyor Sözcü. \"En üst katta. Aşağıdaki karmaşayı unutun; Sıralama'nın birincisine aşağıda yaşamak yakışmaz.\"", en: "\"There's a place for you here,\" the Speaker says. \"Top floor. Forget the mess down there. Number One on the Ranking shouldn't be living downstairs.\"" }
          - metin: { tr: "Kız hâlâ elini bırakmamış. Sözcü önce ona, sonra sana, sonra yine ona bakarken gülümsemesi bir an çatlıyor.", en: "The girl still hasn't let go of your hand. The Speaker looks at her, then at you, then at her again, and her smile cracks for a second." }
            kosul: { bayrak: "p3_ellinci_kiz" }
          - metin: { tr: "Balkondan inen {npc:aras_kurt} kapı pervazına yaslanmış, Sözcü'nün teklifini dinliyor. Dudağının kenarı kıvrılıyor. Ne cevap vereceğini merak eden birinin yüzü değil bu; üstüne bahse girmiş birinin yüzü.", en: "{npc:aras_kurt} has come down off the balcony and is leaning in the doorframe, listening to the Speaker's offer. The corner of his mouth curls. That isn't the face of somebody wondering what you'll say. It's the face of somebody who's got money on it." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: ["aras_cok_evren_yoldasi", "aras_kadimlere_gitti"] }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kat'ta bir oda kabul et", en: "Accept a room on the Floor" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - itibar: { lonca: 5, siginak: -5 }
              - bayrak: "p3_ellinci_oda"
              - iliski: { aras_kurt: { saygi: -5, guven: -2 } }
            sonraki: "@akis"
          - id: "kapi_ac"
            etiket: { tr: "\"Kapı bundan sonra herkese açık.\"", en: "\"From now on, that gate's open to everybody.\"" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - bayrak: "p3_ellinci_kapi_acildi"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 8 }
              - iliski: { aras_kurt: { saygi: 4 } }
            sonraki: "p3_ellinciler_acilis"
          - id: "kiz_birak"
            etiket: { tr: "Kızı Kat'a bırak; odasının parasını sen öde", en: "Leave the girl on the Floor. You pay for her room" }
            goster: { bayrak: "p3_ellinci_kiz" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - kredi: -500
            sonraki: "@akis"

      - id: "p3_ellinciler_acilis"
        yer: "kule"
        paragraflar:
          - { tr: "Haber merdivenlerden aşağı kat kat yayılıyor. Akşama doğru ilk aileler tırmanmaya başlamış bile; kucaklarında battaniyeler, ellerinde çocukları. Muhafızlar önce onlara, sonra sana bakıp kenara çekiliyor.", en: "Word spreads down the stairs, floor by floor. By evening the first families start climbing up, blankets in their arms, kids by the hand. The guards look at them, then at you. Then they step aside." }
          - { tr: "Sözcü yanına geliyor. \"Bunu toparlamak aylar sürecek,\" diyor; öfkeli mi, rahatlamış mı, kestiremiyorsun. \"Su yetmeyecek. Yer yetmeyecek.\"", en: "The Speaker comes up beside you. \"This is going to take months to fix,\" she says. You can't tell if she's angry or relieved. \"There won't be enough water. There won't be enough room.\"" }
        secenekler:
          - id: "yetecek"
            etiket: { tr: "\"Yetecek. Ben getiririm.\"", en: "\"There'll be enough. I'll bring it.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - ordu_kazan: 15
            sonraki: "@akis"
          - id: "ogrenin"
            etiket: { tr: "\"O zaman paylaşmayı öğrenin.\"", en: "\"Then learn to share.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
            sonraki: "@akis"

      - id: "p3_ellinciler_hizmet"
        yer: "kule"
        paragraflar:
          - { tr: "Hizmet girişi bir çamaşırhanenin arkasından geçiyor. Burada kimsenin üstü temiz değil: D ve E kademesi insanlar Kat'ın çamaşırını yıkıyor, yemeğini pişiriyor, çöpünü elli kat aşağı taşıyor.", en: "The service entrance runs past the back of a laundry. Nobody's dressed clean back here. D- and E-Grades wash the Floor's sheets, cook its food, haul its trash fifty floors down." }
          - { tr: "Biri eline bir kova tutuşturuyor. \"Yeni misin? Kuyu suyu yirmi ikinci katta. Elini çabuk tut, Sözcü bugün misafir bekliyor. Sıralama'nın birincisi gelecekmiş.\"", en: "Somebody hands you a bucket. \"New? Well water's on twenty-two. Hurry up. The Speaker's got a guest today. Number One on the Ranking, supposedly.\"" }
          - metin: { tr: "Çamaşırhanenin penceresinden yukarı bakınca balkondaki {npc:aras_kurt|i} görüyorsun; sana bakıp sessiz sessiz gülüyor. Saklanmayı bilen birinin, kendisi gibi birini tanıyınca attığı gülüş bu.", en: "When you glance up through the laundry window, you see {npc:aras_kurt} on the balcony, looking down at you and laughing without a sound. It's the laugh of somebody who knows how to hide, recognizing somebody else who does." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: ["aras_cok_evren_yoldasi", "aras_kadimlere_gitti"] }
        secenekler:
          - id: "kova"
            etiket: { tr: "Kovayı al; bir gün burada çalış", en: "Take the bucket. Work a day down here" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - itibar: { siginak: 5 }
              - tohum: { olay: "p3_kademe_borsasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "ortaya_cik"
            tur: "aciga_vur"
            etiket: { tr: "Kovayı bırak ve kim olduğunu göster", en: "Put down the bucket and show them who you are" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3, merhamet: 2 }
              - itibar: { siginak: 6, lonca: -3 }
            sonraki: "p3_ellinciler_acilis"

  # ---------------------------------------------------------------- Küresel Sıralama'nın tepesi
  - id: "p3_siralama_zirvesi"
    perde: [3]
    bolge: ["kule_dibi", "tepe"]
    gun: { min: 200, max: 325 }
    agirlik: 4
    etiketler: ["siralama", "hakimiyet"]
    gerilim: 3
    npc: ["aras_kurt"]
    kart: { tr: "İlk Ona Masası", en: "The Top Ten Table" }
    sahne: "p3_zirve_1"
    sahneler:
      - id: "p3_zirve_1"
        paragraflar:
          - { tr: "Bir davet geliyor, ama kâğıt değil, bir Sistem penceresi. Altında dokuz imza var; her biri Küresel Sıralama'nın ilk onundan bir isim: [İlk On Masası. Bu gece. {yer:tepe}, eski rasathane.]", en: "An invitation shows up. Not paper. A System window, with nine signatures under it, every one a name from the Global Ranking's top ten: [The Top Ten Table. Tonight. The Heights, the old observatory.]" }
          - { tr: "Onuncu imzanın yeri boş bırakılmış; o yer senin. Sıralama'nın en üstündeki satır her zamanki gibi görünen seviyenle gerçek seviyen arasında bir yerde titreşip duruyor.", en: "The tenth signature line is blank. Yours. The top line of the Ranking is flickering like always, somewhere between your visible level and your real one." }
          - metin: { tr: "Davetin altına el yazısıyla küçük bir not düşülmüş: \"Gel. Herkes gerçekte ne kadar önde olduğunu merak ediyor. Ben hariç; ben biliyorum.\" İmza yok, gerek de yok.", en: "There's a little handwritten note at the bottom: \"Come. Everybody wants to know how far ahead you really are. Except me. I already know.\" No signature. Doesn't need one." }
            kosul: { npc_hayatta: "aras_kurt" }
        secenekler:
          - id: "git"
            etiket: { tr: "Rasathaneye git", en: "Go to the observatory" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bolge: "tepe"
            sonraki: "p3_zirve_masa"
          - id: "gizli_git"
            tur: "gizle"
            etiket: { tr: "Git, ama görünen seviyeni yedinci sıraya indir", en: "Go, but drop your visible level down to seventh" }
            etkiler:
              - gizle: 8
              - ahlak: { duzen: -1, insanlik: 1 }
              - bolge: "tepe"
              - bayrak: "p3_zirve_gizli"
            sonraki: "p3_zirve_masa"
          - id: "gitme"
            etiket: { tr: "Daveti kapat; ilk on seni ilgilendirmez", en: "Close the invite. The top ten isn't your business" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { aras_kurt: { saygi: -5 } }
            sonraki: "p3_zirve_gitmedi"

      - id: "p3_zirve_masa"
        yer: "tepe"
        paragraflar:
          - { tr: "Eski rasathanenin kubbesi yarıya kadar açık, teleskop Kadim gemisine çevrilmiş. Çevresinde dokuz kişi oturuyor: eski bir polis, bir öğretmen, bir yüzme şampiyonu, adını kimsenin bilmediği iki kardeş... Hepsi B kademesi, hepsi bir zamanlar sıradan insanlar.", en: "The old observatory's dome is half open, the telescope trained on the Ancient ship. Nine people sit around it: an ex-cop, a teacher, a swimming champ, two siblings nobody knows the names of. All B-Grade. All of them ordinary once." }
          - metin: { tr: "Masanın başında {npc:aras_kurt} oturuyor, ayaklarını masaya uzatmış. Seni görünce sırıtıp ötekilere dönüyor: \"İşte. Söylemiştim size, sayılar yalan söylüyor.\"", en: "{npc:aras_kurt} has the head of the table, feet up on it. He grins when he sees you. \"There,\" he tells the others. \"Told you. The numbers lie.\"" }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Görünen seviyen yedinci sıradaki adamınkinden bir eksik. Masanın alt ucundan biri sana doğru bir sandalye itiyor; yüzüne bakan yok.", en: "Your visible level is one below the seventh guy's. Somebody shoves a chair your way, at the far end. Nobody looks at you." }
            kosul: { bayrak: "p3_zirve_gizli" }
          - { tr: "Masadaki mesele basit: Kadimler geldiğinde ilk ondakilerin her biri bir mahalleyi tutacak. Kim hangisini tutacak? En önemlisi de, emri kim verecek?", en: "The agenda's simple: when the Ancients come, each of the top ten holds a neighborhood. Who gets which one? And more important: who gives the orders?" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Masadaki dokuz kişiden ikisi Kadimler'le görüşüyor: ceplerinde gümüş pul taşıyanlar. Biri öğretmen.", en: "Two of the nine people at this table are talking to the Ancients. They're the ones with silver tokens in their pockets. One of them is the teacher." }
        secenekler:
          - id: "emir"
            tur: "gosteris"
            etiket: { tr: "Ayağa kalk. Gerçek seviyeni bir an göster", en: "Stand up. Show your real level for one second" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: 4, insanlik: -2 }
              - bayrak: "p3_ilk_on_lideri"
              - iliski: { aras_kurt: { saygi: 10, korku: 5 } }
              - ordu_kazan: 20
            sonraki: "p3_zirve_son"
          - id: "esit"
            etiket: { tr: "\"Kimse emir vermeyecek. Mahalleler için kura çekin.\"", en: "\"Nobody gives orders. Draw lots for the neighborhoods.\"" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 2 }
              - iliski: { aras_kurt: { guven: 5 } }
              - itibar: { siginak: 3 }
            sonraki: "p3_zirve_son"
          - id: "muhbir"
            etiket: { tr: "Gümüş pulları masaya dök", en: "Dump the silver tokens out on the table" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { kadim_tehdit: -4 }
              - bilgi: "ilk_ondaki_muhbirler"
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "p3_zirve_son"

      - id: "p3_zirve_son"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece yarısı masadan kalktığınızda Sıralama'nın ilk onu ilk kez aynı harita üzerinde uzlaşmış oluyor: renkli kalemlerle çizilmiş on mahalle, on isim. Seninki tam ortada.", en: "You all get up from the table around midnight. For the first time, the Ranking's top ten agreed on the same map: ten neighborhoods in colored marker, ten names. Yours is dead center." }
          - metin: { tr: "{npc:aras_kurt} kapıda seni bekliyor. \"Sence ikinci sıra bana yakışıyor mu?\" diye soruyor yarı şaka. Cevabını beklemeden merdivenleri inip gidiyor.", en: "{npc:aras_kurt} is waiting for you at the door. \"Think number two looks good on me?\" he asks, half joking. He's down the stairs before you can answer." }
            kosul: { npc_hayatta: "aras_kurt" }
        secenekler:
          - id: "harita"
            etiket: { tr: "Haritayı al; bir kopyası Konsey'e gitsin", en: "Take the map. Send a copy to the Council" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 4, lonca: 4 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "aras_pesinden"
            etiket: { tr: "{npc:aras_kurt|in} arkasından seslen: \"Yakışıyor.\"", en: "Call after {npc:aras_kurt}: \"Looks great on you.\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { aras_kurt: { guven: 6, saygi: 4 } }
            sonraki: "@akis"

      - id: "p3_zirve_gitmedi"
        paragraflar:
          - { tr: "Gece yarısı pencerendeki Sıralama güncelleniyor: ilk on bir harita yayımlamış; on mahalle, on isim. Ortadaki mahallenin üstünde bir soru işareti duruyor.", en: "Around midnight, the Ranking updates in your window: the top ten published a map. Ten neighborhoods, ten names. Over the one in the middle there's a question mark." }
          - { tr: "Sabah olunca soru işaretli mahallenin sakinleri kapına dayanıyor; mahallelerini kimin tutacağını öğrenmek istiyorlar.", en: "In the morning, the people from the question-mark neighborhood are at your door. They want to know who's going to hold their streets." }
        secenekler:
          - id: "ben"
            etiket: { tr: "\"Ben tutarım.\"", en: "\"I will.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "kendiniz"
            etiket: { tr: "\"Kendiniz tutun. Size öğretirim.\"", en: "\"Hold it yourselves. I'll teach you how.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - ordu: { lonca_avcisi: 10 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Çok-evrenden dönenler
  - id: "p3_donenler"
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 205, max: 330 }
    kosul: { bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["cok_evren", "karantina"]
    gerilim: 3
    npc: ["elif_sari"]
    kart: { tr: "Geri dönenler", en: "The Ones Who Came Back" }
    sahne: "p3_donenler_1"
    sahneler:
      - id: "p3_donenler_1"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci kattaki geçitten bir sefer ekibi dönüyor: on dört kişi gitmişti, dokuzu geri geliyor. Derileri tuzdan çatlamış, gözleri başka bir güneşe alışmış. İçlerinden birinin kolu artık insan kolu değil.", en: "An expedition comes back through the gate on the fiftieth floor: fourteen went, nine come back. Their skin's cracked from salt, their eyes used to another sun, and one of them's arm isn't a human arm anymore." }
          - { tr: "Aralarında kimseye benzemeyen bir çocuk var: teni mercan renginde, parmakları perdeli. Ekip onu Batık Takımada'dan getirmiş. \"Bırakamazdık,\" diyor ekibin başındaki kadın. \"Dünyası boğuluyordu.\"", en: "There's a kid with them. Doesn't look like anybody: coral-colored skin, webbed fingers. The crew brought her back from the Drowned Reach. \"We couldn't leave her,\" says the woman leading them. \"Her whole world was drowning.\"" }
          - { tr: "{yer:kule_dibi|in} kalabalığı geçidin önüne yığılmış. Biri \"Karantina!\" diye bağırıyor, öteki \"Canavar!\" diye. Derken biri çocuğa bir taş fırlatıyor.", en: "The {yer:kule_dibi} crowd has packed in around the gate. Somebody yells \"Quarantine!\" Somebody else yells \"Monster!\" Somebody throws a rock at the kid." }
          - metin: { tr: "{npc:elif_sari} elinde çantasıyla kalabalığı yararak geliyor. \"Kimse kimseye dokunmayacak,\" diyor. \"Önce muayene.\"", en: "{npc:elif_sari} pushes through the crowd, bag in hand. \"Nobody touches anybody,\" she says. \"Exams first.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Hasta olan çocuk değil, kolu değişen adam. İçindeki şey hâlâ büyüyor ve aç.", en: "The kid isn't sick. The guy with the changed arm is. Whatever's inside him is still growing. And it's hungry." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocuğun sistemi yok, hiç olmamış. düşünsene: sistemsiz doğmuş biri.", en: "the kid doesn't have a system. never did. think about that. somebody born without one." }
        secenekler:
          - id: "tasi_tut"
            tur: "gosteris"
            etiket: { tr: "Taşı havada yakala ve atana geri ver", en: "Catch the rock midair and hand it back" }
            gerekli: { stat: { agi: 200 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - dikkat: 3
              - itibar: { siginak: 4 }
            sonraki: "p3_donenler_muayene"
          - id: "kol"
            etiket: { tr: "Kolu değişen adama bak", en: "Check out the guy with the changed arm" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "batik_tohum"
            sonraki: "p3_donenler_kol"
          - id: "karantina"
            etiket: { tr: "Hepsini karantinaya al; çocuğu da", en: "Quarantine all of them. Kid included" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - itibar: { lonca: 4, siginak: -3 }
            sonraki: "p3_donenler_kol"

      - id: "p3_donenler_muayene"
        yer: "kule"
        paragraflar:
          - { tr: "Kalabalık bir anda susmuş. Taşı atan adam elindeki taşa, sonra sana bakıp kalabalığın içinde kayboluyor. Çocuk sana bakarak perdeli eliyle yanağına dokunuyor; selam mı bu, soru mu, bilemiyorsun.", en: "The crowd goes quiet. The guy who threw the rock looks at the rock in his hand, then at you, then disappears into the crowd. The kid looks at you and touches your cheek with a webbed hand. A greeting or a question, you can't tell." }
          - { tr: "Ama arkada kolu değişen adam kıvranmaya başlamış; kolundaki mercan derisi omzuna, boynuna doğru tırmanıyor.", en: "But in the back, the guy with the changed arm starts to convulse. The coral skin on his arm is creeping up toward his shoulder, his neck." }
        secenekler:
          - id: "adam"
            etiket: { tr: "Adama koş", en: "Run to the man" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "p3_donenler_kol"
          - id: "cocugu_cikar"
            etiket: { tr: "Önce çocuğu kalabalıktan çıkar", en: "Get the kid out of the crowd first" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "p3_mercan_cocuk"
            sonraki: "p3_donenler_kol"

      - id: "p3_donenler_kol"
        yer: "kule"
        paragraflar:
          - { tr: "Adamın kolundan bir şey kopup ayağa kalkıyor: mercandan ve kemikten, insan boyunda, ağzı olmayan bir şey. Batık Takımada onu kaçak bir yolcu gibi buraya yollamış; içi tuzlu bir açlıkla dolu.", en: "Something tears loose from the man's arm and stands up: coral and bone, human-sized, no mouth. The Drowned Reach sent it here like a stowaway. There's a salt-water hunger in it." }
          - { tr: "Adam yere yığılıyor ama nefes alıyor. Kalabalık çığlık çığlığa dağılırken şey, tanıdık bir şeye döner gibi çocuğa dönüyor.", en: "The man collapses, but he's breathing. The crowd scatters, screaming. The thing turns toward the kid, like it's turning toward something it knows." }
        secenekler:
          - id: "dov"
            etiket: { tr: "Aralarına gir", en: "Get between them" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { saygi: 6 } }
              - savas: { dusmanlar: ["mercan_yolcu@dunya+20"], kazan: "p3_donenler_son", kaybet: "p3_donenler_yenilgi" }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Bir bakışla tuzunu kurut", en: "Dry the salt out of it with one look" }
            gerekli: { stat: { wil: 240 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 3
              - xp_seviye: 15
            sonraki: "p3_donenler_son"

      - id: "p3_donenler_son"
        yer: "kule"
        paragraflar:
          - { tr: "Mercan yaratık ufalanıp bir avuç beyaz kuma dönüşüyor. Geçidin önü sessizleşmiş; geriye yalnızca dönen ekip, yerde soluyan adam ve çocuk kalmış.", en: "The coral thing crumbles into a handful of white sand. It's quiet in front of the gate now. Just the crew that came back, the man breathing on the floor, and the kid." }
          - metin: { tr: "{npc:elif_sari} adamın nabzını yokladıktan sonra çocuğa bakıyor. \"İkisi de yaşayacak,\" diyor. \"Ama biri ait olmadığı bir yerde yaşayacak. Hangisi olacağına sen karar ver.\"", en: "{npc:elif_sari} checks the man's pulse, then looks at the kid. \"They'll both live,\" she says. \"But one of them is going to be living somewhere they don't belong. You decide which.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "sigin"
            etiket: { tr: "Çocuğu Sığınak'a götür", en: "Take the kid to the Haven" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - bayrak: "p3_mercan_cocuk"
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 8, baglilik: 5 } }
              - tohum: { olay: "p3_kademe_ailesi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Çocuğu kendi dünyasına geri gönder", en: "Send the kid back to her own world" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - iliski: { elif_sari: { guven: -4 } }
            sonraki: "@akis"
          - id: "yaninda"
            etiket: { tr: "Çocuk seninle kalsın", en: "The kid stays with you" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - bayrak: "p3_mercan_cocuk"
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"

      - id: "p3_donenler_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Mercan yaratığın tuzu yaralarına doluyor, nefesin bir an deniz suyuna dönüyor. Sen geri çekilince yaratık çocuğu kapıp geçide doğru kaçıyor.", en: "The coral thing's salt gets into your wounds, and for a second your breath turns to seawater. You fall back, and it grabs the kid and bolts for the gate." }
          - { tr: "Son anda geçit muhafızları onu mızraklarıyla durduruyor. Çocuk kurtuluyor; muhafızlardan ikisiyse kurtulamıyor.", en: "At the last second, the gate guards pin it with their spears. The kid gets free. Two of the guards don't." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; muhafızların adlarını öğren", en: "Get up. Learn the guards' names" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"
          - id: "cocuk"
            etiket: { tr: "Çocuğu Sığınak'a götür", en: "Take the kid to the Haven" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "p3_mercan_cocuk"
            sonraki: "@akis"

  # ---------------------------------------------------------------- Körfezin leviatanı
  - id: "p3_korfez_leviatani"
    perde: [3]
    bolge: ["kiyikent_liman", "kordon"]
    gun: { min: 181, max: 300 }
    agirlik: 5
    etiketler: ["deniz", "hakimiyet", "kesif"]
    gerilim: 3
    kart: { tr: "Körfezdeki sırt", en: "The Back in the Bay" }
    sahne: "p3_leviatan_1"
    sahneler:
      - id: "p3_leviatan_1"
        paragraflar:
          - { tr: "Üç haftadır balıkçı kayıkları körfezden boş dönüyordu; sonra hiç dönmez oldular. Bu sabah suyun ortasında bir ada beliriyor ve ada nefes alıyor.", en: "For three weeks the fishing boats have been coming back from the bay empty. Then they stopped coming back at all. This morning an island shows up in the middle of the water. The island is breathing." }
          - { tr: "İskelede yaşlı bir balıkçı, eli hiç titremeden ağlarını katlıyor. \"Dedem bunun gibisini anlatırdı,\" diyor. \"Ama dedem yalancının tekiydi. Bu yalan değil.\"", en: "On the pier, an old fisherman is folding his nets, hands perfectly steady. \"My granddad used to tell stories about something like this,\" he says. \"But my granddad was a liar. This isn't a lie.\"" }
          - { tr: "{yer:kiyikent_liman|in} yarısı kıyıya toplanmış; kimi elinde zıpkın, kimi dua ederek bekliyor. Her fraksiyon birini yollamış: biri onu öldürmek, biri evcilleştirmek, biri de ona tapmak istiyor.", en: "Half the waterfront's crowded onto the shore, some with harpoons, some praying. Every faction sent somebody: one wants it dead, one wants it tamed, one wants to worship it." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Körfez Leviatanı · B kademesi", en: "[ANALYSIS] Bay Leviathan · B-Grade" }
            satirlar:
              - { tr: "Aç. Yaşlı. Kendi okyanusundan bir kapıyla buraya düşmüş ve geri dönemiyor.", en: "Hungry. Old. Fell through a Gate from its own ocean and can't get back." }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Solungaçlarından birine bir kapı kristali saplanmış. Açlıktan değil, acıdan saldırıyor.", en: "There's a Gate crystal jammed in one of its gills. It's lashing out from pain, not hunger." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o da bir yankı, başka bir denizin yankısı. kimse onu buraya çağırmadı.", en: "it's an echo too. from some other sea. nobody called it here." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Suya gir; leviatanla yüzleş", en: "Get in the water. Face the leviathan" }
            etkiler:
              - bolge: "kordon"
              - savas: { dusmanlar: ["korfez_leviatani@oyuncu+3"], ortam: ["su"], kazan: "p3_leviatan_zafer", kaybet: "p3_leviatan_yenilgi" }
          - id: "suyun_ustu"
            tur: "gosteris"
            etiket: { tr: "Suyun üstünde yürü ve kristali sök", en: "Walk across the water and pull the crystal out" }
            gerekli: { stat: { agi: 220 } }
            etkiler:
              - dikkat: 5
              - bayrak: "p3_leviatan_kurtarildi"
              - xp_seviye: 25
            sonraki: "p3_leviatan_sakin"
          - id: "balikci"
            etiket: { tr: "Önce balıkçıya dedesinin hikâyesini sor", en: "Ask the fisherman about his granddad's story first" }
            etkiler:
              - bilgi: "leviatan_hikayesi"
            sonraki: "p3_leviatan_hikaye"

      - id: "p3_leviatan_hikaye"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Dedem derdi ki,\" diye söze giriyor balıkçı, \"denizden gelen her büyük şey bir şeyini yitirmiştir: yavrusunu, yolunu, sesini. Bulursan çekip gider. Bulamazsan seni de yitirir.\"", en: "\"My granddad used to say,\" the fisherman starts, \"every big thing that comes out of the sea has lost something. Its young, its way, its voice. Find it, and it leaves. Don't, and it loses you too.\"" }
          - { tr: "Gözlerini suya dikiyor. \"Belki de yalan değildi. Belki yalnızca dinleyen olmamıştı.\"", en: "He fixes his eyes on the water. \"Maybe he wasn't lying. Maybe nobody was listening.\"" }
        secenekler:
          - id: "kristal"
            etiket: { tr: "Kaybettiği şeyi ara: solungacına bak", en: "Look for what it lost. Check its gills" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - bayrak: "p3_leviatan_kurtarildi"
              - xp_seviye: 20
            sonraki: "p3_leviatan_sakin"
          - id: "savas"
            etiket: { tr: "Hikâye güzel, ama insanlar ölüyor", en: "Nice story. People are dying, though" }
            etkiler:
              - bolge: "kordon"
              - savas: { dusmanlar: ["korfez_leviatani@oyuncu+3"], ortam: ["su"], kazan: "p3_leviatan_zafer", kaybet: "p3_leviatan_yenilgi" }

      - id: "p3_leviatan_sakin"
        yer: "kordon"
        paragraflar:
          - { tr: "Kristal solungaçtan sökülünce suya kan değil, ışık yayılıyor. Leviatan bir süre kıpırtısız. Sonra bir kilise büyüklüğündeki başını ağır ağır sana çeviriyor.", en: "The crystal comes out of the gill, and what spills into the water isn't blood. It's light. The leviathan goes still for a while. Then it turns its head, a head the size of a church, toward you." }
          - { tr: "Gözü bir otobüs kadar. İçinde kendi yansımanı görüyorsun: suyun üstünde dikilen küçücük, yalnız bir siluet. Derken kemiklerine işleyen derin bir ses geliyor; bir teşekkür mü, yoksa bir soru mu, kestiremiyorsun.", en: "Its eye is the size of a bus. You can see yourself in it: a little figure standing on the water, alone. Then a deep sound that goes right into your bones. Thanks, or a question. You can't tell." }
        secenekler:
          - id: "bagla"
            etiket: { tr: "Elini uzat; senin olsun", en: "Hold out your hand. Make it yours" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - ordu: { evcil_canavar: 1 }
              - ordu_kazan: 10
              - itibar: { lonca: 4, yukselenler: 6 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "serbest"
            etiket: { tr: "Kapıyı aç; kendi denizine dönsün", en: "Open a Gate. Let it go home" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6 }
              - efsane: "canavari_bagisladi"
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_leviatan_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Leviatan son bir kez suyun üstüne yükselip ağır ağır batıyor; kaldırdığı dalga {yer:kordon|in} taşlarını aşıp sokaklara kadar ulaşıyor. Ardından körfez haftalar sonra ilk kez duruluyor.", en: "The leviathan rises out of the water one last time and slowly sinks. The wave it throws clears {yer:kordon|pos} stones and rolls up into the streets. Then the bay goes calm, for the first time in weeks." }
          - { tr: "Akşam olmadan ilk kayıklar suya iniyor. Yaşlı balıkçının attığı ağ ağzına kadar dolu. Sana bakmıyor; yalnızca şapkasını çıkarıyor.", en: "Before evening, the first boats are back on the water. The old fisherman casts his net and it comes up full. He doesn't look at you. He just takes his hat off." }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Leviatanın etini bütün {yer:kiyikent_liman|e} dağıt", en: "Hand out the leviathan meat to the whole waterfront" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 5 }
              - esya: { leviatan_pulu: 2 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "ganimet"
            etiket: { tr: "Pulları ve kemikleri Lonca'ya sat", en: "Sell the scales and bones to the Guild" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - kredi: 3000
              - esya: { leviatan_pulu: 4 }
              - itibar: { lonca: 5 }
            sonraki: "@akis"

      - id: "p3_leviatan_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Kuyruğu seni suyun dibine çakıyor. Ciğerlerin tuzlu suyla dolarken dünya yeşile kesiyor. Derken bir şey yakandan kavrayıp seni yukarı çekiyor: yaşlı balıkçının kancası.", en: "Its tail slams you to the bottom. Salt floods your lungs and the world goes green. Something hooks your collar and hauls you up: the old fisherman's gaff." }
          - { tr: "Leviatan yaralı ve öfkeli, ama açığa doğru yüzüp gidiyor. Bir süre geri gelmeyecek.", en: "The leviathan swims out to open water, wounded and angry, but going. It won't be back for a while." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Balıkçıya teşekkür et", en: "Thank the fisherman" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "tekrar"
            etiket: { tr: "\"Geri gelecek. Ben de.\"", en: "\"It'll be back. So will I.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kademe borsası (Sanayi)
  - id: "p3_kademe_borsasi"
    perde: [3]
    bolge: ["sanayi"]
    gun: { min: 181, max: 320 }
    agirlik: 5
    etiketler: ["ekonomi", "sanayi", "kademe"]
    gerilim: 2
    npc: ["kaya_demir"]
    kart: { tr: "Kademe Borsası", en: "The Grade Exchange" }
    sahne: "p3_borsa_1"
    sahneler:
      - id: "p3_borsa_1"
        paragraflar:
          - { tr: "{yer:sanayi|de}ki eski tekstil fabrikasının avlusunda bir kara tahta asılı, üstüne tebeşirle fiyatlar yazılmış: [D'den C'ye taşıma: 4000 kredi. C'den B'ye: 20 000. Garanti yok.] Önünde bir kuyruk.", en: "In the yard of the old textile mill in {yer:sanayi} hangs a chalkboard with prices on it: [Carry D to C: 4,000 credits. C to B: 20,000. No guarantees.] There's a line under it." }
          - { tr: "Kademe Borsası şöyle işliyor: yüksek kademeli avcılar parası olanı kapılara götürüp canavarları yarı ölü bırakıyor, son darbeyi de müşteriye vurduruyor. Müşteri seviye atlıyor. Bazen.", en: "That's how the Grade Exchange works: high-Grade hunters take paying customers into Gates, beat the monsters half to death, and let the customer land the killing blow. Customer levels up. Sometimes." }
          - { tr: "Kuyruğun önünde bir baba oğlunu kolundan tutmuş. On altı yaşındaki oğlan D kademesi; korkudan beti benzi atmış. Baba önce tahtaya, sonra cüzdanına bakıyor.", en: "At the front of the line, a dad's holding his son by the arm. The kid's sixteen, D-Grade, pale with fear. The dad looks at the board, then at his wallet." }
          - metin: { tr: "Tahtanın yanında borsanın sahibi bekliyor: Lonca yeleği giymiş bir adam. {npc:kaya_demir|in} izni olmadan burada tek bir tezgâh açılamayacağını o da biliyor.", en: "The Exchange's owner, a guy in a Guild vest, is waiting by the board. No stall opens out here without {npc:kaya_demir|pos} say-so, and he knows it." }
            kosul: { npc_hayatta: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Tahtadaki 'garanti yok' yazısının altında silinmiş bir satır daha seçiliyor: [Kayıp oranı: %18.] Silen her kimse, daha yeni silmiş.", en: "Under the 'no guarantees' line, there's another line that's been wiped off: [Loss rate: 18%.] Somebody erased it recently." }
        secenekler:
          - id: "ucretsiz"
            etiket: { tr: "Oğlanı sen götür; para alma", en: "Take the kid in yourself. No charge" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - xp_seviye: 10
            sonraki: "p3_borsa_kapi"
          - id: "tahta"
            tur: "aciga_vur"
            etiket: { tr: "Silinen satırı yeniden yaz", en: "Chalk the erased line back up" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, merhamet: 2 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: -5, siginak: 5 }
            sonraki: "p3_borsa_kapanis"
          - id: "ortak"
            etiket: { tr: "Borsaya ortak ol; bu iş büyüyebilir", en: "Buy into the Exchange. This could get big" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2, duzen: 2 }
              - kredi: 4000
              - bayrak: "p3_borsa_ortagi"
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_borsa_kapi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kapının içinde C kademesi bir kapı tazısı var; oğlanın dizleri titremeye başlıyor. Tazıyı yere serip son darbeyi ona bırakıyorsun. Oğlan kılıcını kaldırmış, ama indiremiyor.", en: "Inside the Gate there's a C-Grade Gate hound, and the kid's knees are shaking. You pin the hound and leave the last blow to him. He raises his blade and can't bring it down." }
          - { tr: "\"Ben bunu istemiyorum,\" diyor ağlamaklı. \"Babam istiyor. Ben... ben fırıncı olmak istiyordum.\"", en: "\"I don't want this,\" he says, close to tears. \"My dad does. I... I wanted to be a baker.\"" }
        secenekler:
          - id: "vur"
            etiket: { tr: "\"Vur. Hayatta kalman için.\"", en: "\"Do it. So you stay alive.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - ordu: { lonca_avcisi: 1 }
            sonraki: "@akis"
          - id: "firin"
            etiket: { tr: "Tazıyı kendin bitir; oğlanı bir fırına götür", en: "Finish the hound yourself. Walk the kid to a bakery" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - kredi: -300
              - tohum: { olay: "p3_kademe_ailesi", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_borsa_kapanis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tebeşir tahtaya değer değmez kuyruk dağılmaya başlıyor. Kimi borsanın sahibine bağırıyor, kimi cüzdanını cebine geri koyuyor. Baba da oğlunun kolunu çoktan bırakmış.", en: "The second the chalk hits the board, the line starts falling apart. Somebody's yelling at the owner, somebody's putting their wallet back in their pocket. The dad lets go of his son's arm." }
          - { tr: "Lonca yelekli adam yanına sokulup sesini alçaltıyor: \"Bu tahtayı kapatırsan insanlar kapılara kendi başına gider. O zaman yüzde on sekiz değil, yüzde elli olur.\"", en: "The guy in the Guild vest comes over, voice low. \"Shut this board down, and people go into Gates on their own. Then it's not eighteen percent. It's fifty.\"" }
        secenekler:
          - id: "denetle"
            etiket: { tr: "\"Kapanmıyor. Ama artık ben denetliyorum.\"", en: "\"It stays open. But now I'm watching it.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "p3_borsa_denetim"
              - itibar: { lonca: 3, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 5 } }
            sonraki: "@akis"
          - id: "kapat"
            etiket: { tr: "\"Kapanıyor.\"", en: "\"It's shut down.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { lonca: -6 }
              - iliski: { kaya_demir: { saygi: -5 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kademe ailesi (Eski Şehir)
  - id: "p3_kademe_ailesi"
    perde: [3]
    bolge: ["eski_sehir"]
    gun: { min: 181, max: 330 }
    agirlik: 4
    etiketler: ["aile", "kademe", "eski_sehir"]
    gerilim: 1
    kart: { tr: "Ters dönmüş ev", en: "The House Turned Upside Down" }
    sahne: "p3_aile_1"
    sahneler:
      - id: "p3_aile_1"
        paragraflar:
          - { tr: "{yer:eski_sehir|de} dar bir sokakta bir kapı çalınıyor. Senin kapın değil, ama ses sana kadar ulaşıyor: bir anne, kendi evinin kapısında içeri girmek için izin istiyor.", en: "Down a narrow street in {yer:eski_sehir}, somebody's knocking on a door. Not yours, but the sound carries. A mother, at her own front door, is asking permission to come in." }
          - { tr: "Kapıyı on üç yaşında bir kız açıyor. B kademesi; evi o geçindiriyor, kapıları o kapatıyor, Lonca'ya kira yerine kristali o veriyor. Annesiyse E kademesi, artık evin en zayıfı.", en: "A thirteen-year-old girl opens it. B-Grade. She's the one feeding the family, closing the Gates, paying the Guild in crystals instead of rent. Her mom's E-Grade. The weakest person in the house now." }
          - { tr: "\"Saat on oldu,\" diyor kız annesine. \"Kural kuraldır.\" Sonra seni görünce yüzünün rengi atıyor.", en: "\"It's past ten,\" the girl tells her mom. \"Rules are rules.\" Then she spots you, and the color drains out of her face." }
        sezgiler:
          - kosul: { stat: { cha: 180 } }
            metin: { tr: "Kızın öfkesi kural koymasından değil, ona kural koyan kimse olmamasından. Bir büyük arıyor.", en: "The girl isn't angry because she makes the rules. She's angry because nobody makes any for her. She's looking for a grown-up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistem herkesi seviyesine göre sıralar, evleri de. bunu ona kimse yazmadı ama herkes okudu.", en: "the System ranks everybody by level. houses too. nobody wrote that into it, but everybody read it anyway." }
        secenekler:
          - id: "kiz"
            etiket: { tr: "Kızla konuş: \"Benim de bir annem vardı.\"", en: "Talk to the girl: \"I had a mom too.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
            sonraki: "p3_aile_konus"
          - id: "seviye"
            tur: "gosteris"
            etiket: { tr: "Görünen seviyeni bir an aç; kim büyük, görsün", en: "Flash your visible level. Let her see who's bigger" }
            gerekli: { stat: { wil: 180 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - dikkat: 2
            sonraki: "p3_aile_korku"
          - id: "gec"
            etiket: { tr: "Seni ilgilendirmez; yürü git", en: "Not your business. Keep walking" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -1 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_aile_konus"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kız kapı eşiğine oturuyor. Annesi içeri girmiyor, o da eşiğin öbür ucuna, kızının yanına çöküyor. Aralarında bir adım var, bir kademe.", en: "The girl sits down on the doorstep. Her mom doesn't go inside. She sits down too, on the other end of the step. There's one step between them. One Grade." }
          - { tr: "\"Dün bir kapıda bir adam öldü,\" diyor kız. \"Benim yüzümden değil, ama oradaydım. Eve geldiğimde annem çorba yapmıştı, ben de ona bağırdım. Çünkü o hâlâ çorba yapabiliyordu, ben yapamıyordum.\"", en: "\"A man died in a Gate yesterday,\" the girl says. \"Not because of me. But I was there. When I got home, Mom had made soup, and I yelled at her. Because she could still make soup and I couldn't.\"" }
        secenekler:
          - id: "corba"
            etiket: { tr: "\"O zaman çorbayı birlikte yapın.\"", en: "\"Then make the soup together.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "ordu"
            etiket: { tr: "\"Bayrağımın altına gel. Yükü paylaşırız.\"", en: "\"Come serve under my banner. We'll split the load.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - ordu: { lonca_avcisi: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_aile_korku"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kız bir adım geriliyor, sonra bir adım daha. Annesi hiç düşünmeden kızıyla senin arana giriyor: E kademesi bir kadın, kendinden kat kat güçlü kızını ondan da kat kat güçlü bir şeyden koruyor.", en: "The girl backs up a step, then another. Without thinking, her mom steps between the two of you. An E-Grade woman shielding a daughter way stronger than her from something way stronger still." }
          - { tr: "Kız annesinin sırtına bakıyor. İçinde bir şeyin yerine oturduğunu yüzünden okuyorsun.", en: "The girl looks at her mom's back. Something clicks into place. You can see it on her face." }
        secenekler:
          - id: "git"
            etiket: { tr: "Başını salla ve git", en: "Nod and walk off" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Anneden özür dile", en: "Apologize to the mother" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Heykel
  - id: "p3_heykel"
    perde: [3]
    bolge: ["kiyikent_liman", "tepe"]
    gun: { min: 195, max: 330 }
    agirlik: 4
    etiketler: ["efsane", "hakimiyet", "yukselenler"]
    gerilim: 2
    npc: ["vahit"]
    kart: { tr: "Taştan sen", en: "You, in Stone" }
    sahne: "p3_heykel_1"
    sahneler:
      - id: "p3_heykel_1"
        paragraflar:
          - { tr: "Haber sana geç ulaşıyor: {yer:kiyikent_liman} meydanına bir heykel dikilmiş. Gidip bakınca karşında kendi yüzünü buluyorsun; üç kat yüksekliğinde, kapı kristalinden oyulmuş, gözlerinin yerinde iki mavi pencere.", en: "The news reaches you late: somebody put up a statue in the waterfront square. When you go see it, you're looking at your own face, three stories tall, carved out of Gate crystal, with two blue windows where the eyes should be." }
          - { tr: "Heykelin dibi mumlar, çiçekler, elle yazılmış notlarla dolu: [Oğlumu kurtar.] [Bize göz kulak ol.] [Seviye ver.] Biri de heykelin ayağını öpüyor.", en: "There are candles at its feet, flowers, handwritten notes: [Save my son.] [Watch over us.] [Give me levels.] Somebody's kissing the statue's foot." }
          - metin: { tr: "Heykelin yanında {npc:vahit} kollarını açmış, kalabalığa vaaz veriyor. Seni görünce gözleri parlıyor; tanrısının sonunda geldiğini gören bir peygamberin bakışı bu.", en: "{npc:vahit} is standing next to it, arms wide, preaching to the crowd. When he sees you, his eyes light up: a prophet watching his god finally show up." }
            kosul: { npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir önceki döngüde de bir heykel vardı. yıkılınca altından bir isim listesi çıktı. kimin listesiydi, hatırlamıyorum.", en: "there was a statue last loop too. when it came down, there was a list of names under it. i don't remember whose list." }
        secenekler:
          - id: "yik"
            tur: "gosteris"
            etiket: { tr: "Heykeli tek yumrukla yık", en: "Bring the statue down with one punch" }
            gerekli: { stat: { str: 240 } }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -3 }
              - dikkat: 4
              - itibar: { yukselenler: -10, siginak: 5 }
              - iliski: { vahit: { saygi: 5, guven: -10 } }
            sonraki: "p3_heykel_yikildi"
          - id: "kabul"
            tur: "aciga_vur"
            etiket: { tr: "Heykelin önüne çık; kalabalığı kutsa", en: "Step up in front of it. Bless the crowd" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -6, duzen: 3 }
              - dikkat: 6
              - itibar: { yukselenler: 12, siginak: -6 }
              - iliski: { vahit: { baglilik: 10, saygi: 8 } }
              - ordu_kazan: 25
            sonraki: "p3_heykel_kutsama"
          - id: "notlar"
            etiket: { tr: "Notları tek tek oku", en: "Read the notes, one by one" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - tohum: { olay: "p3_kadim_pazari", gecikme: { min: 3, max: 8 } }
            sonraki: "p3_heykel_notlar"

      - id: "p3_heykel_yikildi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kristal heykel bir çan gibi çınlayıp çatlıyor, bin parçaya ayrılarak meydana dökülüyor. Kalabalık önce çığlık atıyor, sonra susuyor. Kimsenin parçalara dokunmaya cesareti yok.", en: "The crystal statue rings like a bell, cracks, and comes down across the square in a thousand pieces. The crowd screams. Then goes silent. Nobody has the nerve to touch a single shard." }
          - { tr: "\"Ben tanrı değilim,\" diyorsun; sesin meydanın her köşesine ulaşıyor. Kimi ağlıyor, kimi ilk kez rahat bir nefes alıyor.", en: "\"I'm not a god,\" you say. Your voice reaches every corner of the square. Some people are crying. Some are breathing easy for the first time." }
        secenekler:
          - id: "parcalar"
            etiket: { tr: "Kristal parçaları Sığınak'a ver; ısınsınlar", en: "Give the shards to the Haven. Let them burn for heat" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 4 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk off without looking back" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
            sonraki: "@akis"

      - id: "p3_heykel_kutsama"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini kaldırdığın anda meydandaki herkes diz çöküyor; binlerce insan tek bir hareketle. Heykelin mavi gözleri de seninkilerle birlikte parlıyor.", en: "The moment you raise your hand, everyone in the square drops to their knees. Thousands of people, one motion. The statue's blue eyes light up at the same time yours do." }
          - { tr: "Pencerende yeni bir satır beliriyor: [Takipçi kazanıldı.] Sayı durmadan artıyor. Karşındaki bir ordu değil, ordudan da sadık bir şey.", en: "A new line shows up in your window: [Followers gained.] The number won't stop climbing. That's not an army. It's something more loyal than an army." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kollarını açık tut", en: "Keep your arms open" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - yozlasma: 3
              - ordu_kazan: 15
            sonraki: "@akis"
          - id: "indir"
            etiket: { tr: "Elini indir; yeter", en: "Lower your hand. That's enough" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "p3_heykel_notlar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yüzlerce not var ve çoğu aynı şeyi istiyor: biri kurtarılsın, biri geri dönsün, birinin acısı dinsin. Yalnız biri farklı, çocuk eliyle yazılmış: [Seni seviyorum. Hiçbir şey istemiyorum.]", en: "Hundreds of notes. Most of them want the same thing: somebody saved, somebody brought back, somebody's pain to stop. One is different, in a kid's handwriting: [I love you. I don't want anything.]" }
          - { tr: "Notların arasında düzgün bir el yazısıyla yazılmış, imzasız bir tane daha var: [Kadim Pazarı'nda insanların yıllarını satıyorlar. Sen bakmazsan kimse bakmaz.]", en: "There's one more mixed in, neat handwriting, unsigned: [They're selling people's years at the Ancient Market. If you don't look into it, nobody will.]" }
        secenekler:
          - id: "cocuk_notu"
            etiket: { tr: "Çocuğun notunu cebine koy", en: "Put the kid's note in your pocket" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "hepsi"
            etiket: { tr: "Bütün notları topla; birer birer cevapla", en: "Collect every note. Answer them one by one" }
            gerekli: { stat: { wis: 180 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6, yukselenler: -4 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kadim Pazarı
  - id: "p3_kadim_pazari"
    perde: [3]
    bolge: ["kiyikent_liman"]
    gun: { min: 190, max: 320 }
    agirlik: 4
    etiketler: ["kadimler", "karaborsa"]
    gerilim: 2
    kart: { tr: "Yıl satan tezgâh", en: "The Stall That Sells Years" }
    sahne: "p3_pazar_1"
    sahneler:
      - id: "p3_pazar_1"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} arkasında, eski balık halinin altında geceleri bir pazar kuruluyor. Tezgâhlar Kadim işi şeylerle dolu: kendiliğinden ısınan taşlar, yaraları kapatan gümüş tozlar, kapı kristaline hapsedilmiş güneş ışığı.", en: "Behind the waterfront, under the old fish market, there's a market that only sets up at night. The stalls are full of Ancient-made stuff: stones that warm themselves, silver dust that closes wounds, sunlight packed into a Gate crystal." }
          - { tr: "Pazarın en kalabalık tezgâhında, önünde bir terazi, bir Kadim tüccarı oturuyor. İnsanlar sırayla avuçlarını kefeye koyuyor, terazi de onlardan bir şey alıyor: bir yıl, iki yıl. Karşılığında bir seviye.", en: "The busiest stall has an Ancient merchant sitting behind a balance scale. People take turns putting a hand on the pan, and the scale takes something from them: a year, two years. In exchange, a level." }
          - { tr: "Kuyrukta tek bir yaşlı yok, hepsi genç. Yaşlıların satacak yılı kalmamış.", en: "There are no old people in line. They're all young. The old ones don't have years left to sell." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim tüccarı · lisanslı", en: "[ANALYSIS] Ancient merchant · licensed" }
            satirlar:
              - { tr: "Kur: 1 yıl = 1 seviye. Sistem işlemi onaylıyor. Sistem birçok şeyi onaylıyor.", en: "Exchange rate: 1 year = 1 level. The System approves this transaction. The System approves of a lot of things." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Terazi hileli: bir yıl alıp üç yıl yazıyor. Aradaki fark filoya gidiyor.", en: "The scale's rigged. It takes one year and logs three. The difference goes to the fleet." }
        secenekler:
          - id: "terazi"
            tur: "gosteris"
            etiket: { tr: "Elini kefeye koy; teraziyi sen tart", en: "Put your hand on the pan. Weigh the scale yourself" }
            gerekli: { stat: { wil: 250 } }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 3 }
              - dikkat: 5
              - degisken: { kadim_tehdit: -4 }
            sonraki: "p3_pazar_terazi"
          - id: "hile"
            tur: "aciga_vur"
            etiket: { tr: "Kuyruğa hileyi anlat", en: "Tell the line the scale's rigged" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2, kadim_tehdit: -3 }
              - itibar: { kadimler: -8, siginak: 4 }
            sonraki: "p3_pazar_kaos"
          - id: "al"
            etiket: { tr: "Güneş ışığı dolu kristallerden al", en: "Buy some of the sunlight crystals" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - kredi: -800
              - esya: { gunes_kristali: 2 }
              - itibar: { kadimler: 5 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_pazar_terazi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini kefeye koyar koymaz terazi bir ileri bir geri sallanıp kırılıyor. Ya senden alacak bir yıl bulamıyor ya da bulduğu yılların sayısı onu korkutuyor.", en: "The second you put your hand on the pan, the scale rocks back and forth, then breaks. It can't find a year to take from you. Or the number of years it finds scares it." }
          - { tr: "Tüccar önce sana, sonra kırık teraziye bakıyor. \"Tartılamayan tek müşteri,\" diyor önce kendi dilinde, sonra seninkinde. Ardından tezgâhını toplamaya koyuluyor.", en: "The merchant looks at you, then at the broken scale. \"The one customer that can't be weighed,\" it says in its language, then in yours. It starts packing up the stall." }
        secenekler:
          - id: "geri_ver"
            etiket: { tr: "\"Aldığın yılları geri ver.\"", en: "\"Give back the years you took.\"" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { kadimler: -6, siginak: 5 }
              - iliski: { thessar: { saygi: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Gitmesine izin ver", en: "Let it leave" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { kadimler: 2 }
            sonraki: "@akis"

      - id: "p3_pazar_kaos"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kuyruk bir an donup kalıyor, sonra öfke patlıyor. Tezgâh devrilip terazi yere düşerken tüccar gümüş bir ışığın içinde kayboluyor. Yerde ağlaya ağlaya iki yılını arayan bir kadın var.", en: "The line freezes for a second. Then the anger boils over. The stall goes over, the scale hits the ground, and the merchant vanishes in a flash of silver. A woman's on her knees, sobbing, looking for her two years on the ground." }
          - { tr: "Pazarın öteki tüccarları seni süzüyor; kimi korkuyla, kimi kafasında hesap yaparak.", en: "The market's other merchants are watching you. Some with fear. Some doing math." }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadının yanına diz çök", en: "Kneel down next to the woman" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "pazar_kapat"
            etiket: { tr: "\"Bu pazar bu gece kapanıyor.\"", en: "\"This market closes tonight.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { kadimler: -6, lonca: 3 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kordon'u geri almak / tutmak
  - id: "p3_kordon_geri"
    perde: [3]
    bolge: ["kordon", "kiyikent_liman"]
    gun: { min: 190, max: 325 }
    agirlik: 4
    etiketler: ["ordu", "kordon", "savas"]
    gerilim: 3
    kart: { tr: "{yer:kordon|in} fenerleri", en: "The Esplanade Lanterns" }
    sahne: "p3_kordon_1"
    sahneler:
      - id: "p3_kordon_1"
        paragraflar:
          - { tr: "Nerede olursan ol, nefes nefese bir haberci seni buluyor. \"{yer:kordon},\" diyor. \"Fenerleri yeniden yakmak niyetindeyiz, ama gece olunca kabuklular sudan çıkıyor. Sen gelmezsen kimse gitmez.\"", en: "A runner finds you, wherever you are, out of breath. \"The Esplanade,\" he says. \"We want to light the lanterns again. But at night the shellbacks come up out of the water. If you don't come, nobody's going.\"" }
          - metin: { tr: "{yer:kordon} ilk taşmada düştüğünden beri canavarların sahili. Kabuklu sürüleri yıkık büfelerin altına yuva yapmış; geceleri sesleri {yer:kiyikent_liman|e} kadar geliyor.", en: "The Esplanade has been monster coastline since it fell in the first break. Shellback swarms nest under the wrecked snack stands, and at night you can hear them all the way from the waterfront." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "{yer:kordon} ilk taşmada elde tutuldu, ama o günden beri ayakta kalmak için her gece savaş veriyor. Fenerlerin yarısı kırık, nöbetçilerin yarısı bitkin.", en: "The Esplanade held during the first break, but it's been fighting every night since to stay standing. Half the lanterns are broken. Half the sentries are exhausted." }
            kosul: { bayrak: "kordon_kurtarildi" }
        secenekler:
          - id: "ordu"
            etiket: { tr: "Ordunla in; sahili adım adım temizleyin", en: "Go down with your army. Clear the shore step by step" }
            goster: { ordu_min: 1 }
            etkiler:
              - bolge: "kordon"
              - ahlak: { duzen: 3, merhamet: 2 }
              - ordu_kazan: 20
            sonraki: "p3_kordon_ordu"
          - id: "yalniz"
            etiket: { tr: "Tek başına in", en: "Go down alone" }
            etkiler:
              - bolge: "kordon"
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["kordon_kabuklusu@dunya", "kordon_kabuklusu@dunya", "kordon_kabuklusu@dunya+20"], ortam: ["su", "karanlik"], kazan: "p3_kordon_fener", kaybet: "p3_kordon_yenilgi" }
          - id: "gosteris"
            tur: "gosteris"
            etiket: { tr: "Sahilde yürümen yeter; kabuklular kaçsın", en: "Just walk the shore. Let the shellbacks run" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bolge: "kordon"
              - ahlak: { insanlik: -2, duzen: 1 }
              - dikkat: 4
              - xp_seviye: 15
            sonraki: "p3_kordon_fener"

      - id: "p3_kordon_ordu"
        yer: "kordon"
        paragraflar:
          - { tr: "Sancağının altında yüzlerce kişi, senin öğrettiğin gibi sıra sıra {yer:kordon|e} iniyor. Kabuklular sudan çıktığında karşılarında bir duvar buluyor.", en: "Hundreds of people come down onto {yer:kordon} under your banner, in order, the way you taught them. When the shellbacks crawl out of the water, they find a wall waiting for them." }
          - { tr: "Sen çoğunlukla izliyorsun; yalnızca bir kez, bir çocuğu sudan çekmek için araya giriyorsun. Gece yarısı sahil sessiz. Ordun ilk kez sensiz kazandı.", en: "You mostly just watch. You step in once, to pull a kid out of the water. By midnight the shore is quiet. Your army won without you for the first time." }
          - metin: { tr: "Gece yarısından sonra {yer:kiyikent_liman} tarafından bir el arabası geliyor; {npc:elif_sari} ile iki Sığınak gönüllüsü bidon bidon gaz yağı getirmiş. \"Fener yakacaksanız,\" diyor, \"yağı da birinin getirmesi lazımdı.\" Sonra sancaklara bakıyor, ama bir şey söylemiyor.", en: "After midnight a handcart comes rattling up from the waterfront: {npc:elif_sari} and two Haven volunteers, with jerrycan after jerrycan of lamp oil. \"If you're lighting lanterns,\" she says, \"somebody had to bring the oil.\" Then she looks at the banners and doesn't say anything." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "fener"
            etiket: { tr: "İlk feneri onlar yaksın", en: "Let them light the first lantern" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - tohum: { olay: "p3_kordon_aksami", gecikme: { min: 5, max: 10 }, kosul: { bayrak: "p3_kordon_geri_alindi" } }
            sonraki: "@akis"
          - id: "karargah"
            etiket: { tr: "{yer:kordon|i} ordunun karargâhı yap", en: "Make {yer:kordon} your army's HQ" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 2 }
              - kontrol: { kordon: "lonca" }
              - ordu_kazan: 20
              - itibar: { lonca: 5 }
              - iliski: { elif_sari: { guven: -3 } }
              - tohum: { olay: "p3_kordon_aksami", gecikme: { min: 5, max: 10 }, kosul: { bayrak: "p3_kordon_geri_alindi" } }
            sonraki: "@akis"

      - id: "p3_kordon_fener"
        yer: "kordon"
        paragraflar:
          - { tr: "Son kabuklu da suya kaçıyor. {yer:kordon} ilk taşmadan bu yana ilk kez gecenin bir yarısında bomboş ve sessiz.", en: "The last shellback scuttles back into the water. For the first time since the first break, {yer:kordon} is empty and quiet in the middle of the night." }
          - { tr: "Haberci arkandan bir fener uzatıyor; eski bir gaz lambası bu. Fitili ıslak, ama yine de yanıyor.", en: "The runner hands you a lantern from behind, an old kerosene lamp. The wick's damp. It lights anyway." }
          - metin: { tr: "{yer:kiyikent_liman} tarafından tıkır tıkır bir el arabası geliyor: {npc:elif_sari} ile iki Sığınak gönüllüsü, yanlarında bidon bidon gaz yağı. \"Fener yakacaksanız,\" diyor nefes nefese, \"yağı da birinin getirmesi lazımdı.\"", en: "A handcart comes rattling up from the waterfront: {npc:elif_sari} and two Haven volunteers, with jerrycan after jerrycan of lamp oil. \"If you're lighting lanterns,\" she says, out of breath, \"somebody had to bring the oil.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "yak"
            etiket: { tr: "Feneri as; ilk ışık senin olsun", en: "Hang the lantern. First light's yours" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 2 } }
              - tohum: { olay: "p3_kordon_aksami", gecikme: { min: 5, max: 10 }, kosul: { bayrak: "p3_kordon_geri_alindi" } }
            sonraki: "@akis"
          - id: "habercive"
            etiket: { tr: "Feneri habercinin eline geri ver", en: "Hand the lantern back to the runner" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - tohum: { olay: "p3_kordon_aksami", gecikme: { min: 5, max: 10 }, kosul: { bayrak: "p3_kordon_geri_alindi" } }
            sonraki: "@akis"

      - id: "p3_kordon_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Kabuklulardan biri kıskacıyla kolunu kavrayıp seni suya sürüklüyor. Karanlıkta nefesin tükeniyor; derken bir el, bir halat, habercinin yüzü.", en: "One of the shellbacks clamps onto your arm and drags you into the water. Your breath runs out in the dark. Then a hand, a rope, the runner's face." }
          - { tr: "Sahili bu gece geri alamıyorsunuz. Yine de haberci sırılsıklam, titreye titreye gülüyor: \"Geldin ya, bu bile yeter. Yarın yine geliriz.\"", en: "You don't take the shore back tonight. But the runner's laughing, soaked and shaking: \"You came. That's enough. We'll be back tomorrow.\"" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "\"Yarın.\"", en: "\"Tomorrow.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "Habercinin adını sor", en: "Ask the runner's name" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - ordu: { lonca_avcisi: 1 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kapı fırtınası
  - id: "p3_kapi_firtinasi"
    perde: [3]
    bolge: ["sanayi", "kule_dibi", "eski_sehir"]
    gun: { min: 230, max: 330 }
    agirlik: 4
    etiketler: ["kapi", "savas", "hakimiyet"]
    gerilim: 4
    kart: { tr: "Yedi kapı birden", en: "Seven Gates at Once" }
    sahne: "p3_firtina_1"
    sahneler:
      - id: "p3_firtina_1"
        paragraflar:
          - { tr: "Saat 04:12'de şehrin dört bir yanında aynı bildirim çalıyor: [KAPI FIRTINASI. Açık kapı: 7. Kademe: B–A. Taşma süresi: 3 saat.] Telefonlar, telsizler, pencereler, hepsi aynı satırı yineliyor.", en: "At 4:12 a.m., the same notification goes off all over the city: [GATE STORM. Open Gates: 7. Grade: B–A. Time to break: 3 hours.] Phones, radios, windows, all of them repeating the same line." }
          - { tr: "Yedi kapı, yedi mahalle. Hiçbir fraksiyonun yedi kapıya yetecek avcısı yok. Fraksiyonlar aynı anda sana mesaj yağdırıyor ve her biri önce kendi mahallesini istiyor.", en: "Seven Gates, seven neighborhoods. No faction has enough hunters to cover seven Gates. Every one of them messages you at the same time, and every one wants its own neighborhood first." }
          - metin: { tr: "Sancağının altındakiler, kimse çağırmadan {yer:kiyikent_liman} meydanında toplanmış bile.", en: "The people under your banner are already gathering in the waterfront square. Nobody had to call them." }
            kosul: { ordu_min: 1 }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[KAPI FIRTINASI]", en: "[GATE STORM]" }
            satirlar:
              - { tr: "Eş zamanlı kapı sayısı Dünya Katmanı rekorunu kırdı. Tebrikler, sanırız.", en: "Simultaneous Gate count set a new Earth Layer record. Congratulations, we think." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Yedi kapı da aynı ritimle atıyor. Hepsinin bir merkezi var: {yer:sanayi|de}ki eski döküm fırını. Önce onu kapatırsan ötekiler zayıflar.", en: "All seven Gates are pulsing in the same rhythm. There's a center: the old foundry furnace in {yer:sanayi}. Close that one first and the rest weaken." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunları biri çağırdı. kapılar kendiliğinden fırtınaya dönmez. biri seni ölçmek istiyor.", en: "somebody called these. gates don't storm on their own. somebody wants to measure you." }
        secenekler:
          - id: "merkez"
            etiket: { tr: "{yer:sanayi|de}ki merkez kapıya dal", en: "Dive into the center Gate in {yer:sanayi}" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["firtina_dogumu@oyuncu+2", "firtina_dogumu@oyuncu"], ortam: ["yanici"], kazan: "p3_firtina_merkez", kaybet: "p3_firtina_yenilgi" }
          - id: "bol"
            etiket: { tr: "Ordunu yedi kapıya böl", en: "Split your army across all seven Gates" }
            goster: { ordu_min: 1 }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 25
            sonraki: "p3_firtina_ordu"
          - id: "yedisi"
            tur: "gosteris"
            etiket: { tr: "Yedi kapıyı da tek başına, sırayla kapat", en: "Close all seven yourself, one after another" }
            gerekli: { stat: { agi: 280 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -3, duzen: -1 }
              - dikkat: 10
              - xp_seviye: 60
              - degisken: { hayatta_kalan: 3 }
              - efsane: "kapiyi_yalniz_kapatti"
            sonraki: "p3_firtina_sabah"
          - id: "siginak_once"
            etiket: { tr: "Önce sivillerin en kalabalık olduğu mahalleye koş", en: "Run for the most crowded civilian block first" }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 5, lonca: -3 }
              - savas: { dusmanlar: ["firtina_dogumu@dunya", "firtina_dogumu@dunya"], kazan: "p3_firtina_sabah", kaybet: "p3_firtina_yenilgi" }

      - id: "p3_firtina_merkez"
        yer: "sanayi"
        paragraflar:
          - { tr: "Merkez kapı içine doğru çökerken şehrin dört bir yanındaki altı kapı birden titreyip küçülüyor. Avcılar onları birer birer kapatıyor, telsizlerden sevinç çığlıkları taşıyor.", en: "The center Gate collapses inward, and all over the city six more Gates shudder and shrink at the same moment. Hunters close them one by one, and whoops come crackling over the radio." }
          - { tr: "Döküm fırınının dibinde bir şey parlıyor: kapıları çağıran, üstü Kadim yazılı bir işaret taşı.", en: "Something's glowing at the bottom of the foundry furnace: a marker stone that called the Gates, Ancient script on it." }
        secenekler:
          - id: "tasi_al"
            etiket: { tr: "Taşı al; kimin bıraktığını bul", en: "Take the stone. Find out who left it" }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "firtina_tasi"
              - degisken: { kadim_tehdit: -3 }
              - iliski: { thessar: { saygi: 3 } }
              - tohum: { olay: "p3_firtina_olcucu", gecikme: { min: 3, max: 7 } }
            sonraki: "p3_firtina_sabah"
          - id: "kir"
            etiket: { tr: "Taşı orada kır", en: "Smash the stone right there" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 1 }
              - degisken: { kadim_tehdit: -2 }
            sonraki: "p3_firtina_sabah"

      - id: "p3_firtina_ordu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yedi kapıya yedi sancak. Telsizden her birinin sesi geliyor; kimi sakin, kimi paniğe kapılmış. Sen meydandan hepsini dinleyip birinden ötekine emir yetiştiriyorsun.", en: "Seven banners for seven Gates. Every one of them is on the radio, some calm, some panicking. You listen to all of them from the square, calling orders from one to the next." }
          - { tr: "Beşinci kapı taşmak üzere ve oradaki birlik geri çekilmek istiyor. Tek bir yanlış emir, bir mahalleye mal olur.", en: "The fifth Gate's about to break. The unit there wants to fall back. One wrong order, one neighborhood." }
        secenekler:
          - id: "kendin"
            etiket: { tr: "Beşinci kapıya kendin koş", en: "Run to the fifth Gate yourself" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["firtina_dogumu@dunya+20"], kazan: "p3_firtina_sabah", kaybet: "p3_firtina_yenilgi" }
          - id: "tut"
            etiket: { tr: "\"Hattı tutun. Geri çekilme yok.\"", en: "\"Hold the line. Nobody falls back.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - ordu_kazan: 10
              - degisken: { hayatta_kalan: -1 }
            sonraki: "p3_firtina_sabah"

      - id: "p3_firtina_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah yedide son kapı da kapanıyor. Şehir yorgun, isli, ama ayakta. Pencerende bir satır beliriyor: [Kapı fırtınası atlatıldı. Taşma: 0.]", en: "At seven in the morning, the last Gate closes. The city's still standing. Tired, sooty, but standing. A line in your window: [Gate storm survived. Breaks: 0.]" }
          - { tr: "Altındaki satır daha küçük, neredeyse mahcup: [Kayda geçti: Dünya Katmanı'nın direnci beklentinin üstünde.]", en: "The next line's smaller, almost sheepish: [Noted: Earth Layer resilience exceeds projections.]" }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Bir saat uyu", en: "Sleep for an hour" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: 500
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "Bütün avcılara tek tek teşekkür et", en: "Thank every hunter, one by one" }
            gerekli: { stat: { cha: 200 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - ordu_kazan: 15
              - itibar: { siginak: 3, lonca: 3 }
            sonraki: "@akis"

      - id: "p3_firtina_yenilgi"
        paragraflar:
          - { tr: "Kapıdan fırlayan fırtına doğumu seni bir duvara çarpıyor, duvar da seninle birlikte yıkılıyor. Ayağa kalktığında kapı çoktan taşmış, koca bir sokak canavarların eline geçmiş.", en: "The storm-spawn that bursts out of the Gate slams you into a wall, and the wall comes down with you. When you get up, the Gate's broken and a whole street belongs to the monsters." }
          - { tr: "Sabaha karşı öteki kapılar kapanıyor. O sokaksa bir süreliğine haritadan siliniyor.", en: "Toward dawn the other Gates close. That one street gets wiped off the map, for a while." }
        secenekler:
          - id: "sokak"
            etiket: { tr: "O sokağın insanlarını say", en: "Count the people from that street" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "geri_al"
            etiket: { tr: "\"O sokağı geri alacağım.\"", en: "\"I'm taking that street back.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { yanki: { saygi: 2 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kordon akşamı (tohum: p3_kordon_geri)
  - id: "p3_kordon_aksami"
    perde: [3, 4]
    agirlik: 1
    etiketler: ["kordon", "toplum", "savas"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "{yer:kordon} akşamı", en: "Evening on {yer:kordon}" }
    sahne: "p3_kordon_aksami_1"
    sahneler:
      - id: "p3_kordon_aksami_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Haberci, nerede olursan ol, seni yine buluyor; bu kez nefes nefese değil, yüzünde kocaman bir gülümsemeyle. \"Gel,\" diyor, \"görmen lazım. {yer:kordon|de} insanlar yürüyor.\"", en: "The runner finds you again, wherever you are. Not out of breath this time. Grinning. \"Come on,\" he says. \"You've gotta see this. People are walking {yer:kordon}.\"" }
          - { tr: "Güneş körfeze inerken fenerler birer birer yanıyor. Entegrasyon'dan beri ilk kez {yer:kordon|de} akşam yürüyüşü yapılıyor: tepsiyle simit satan bir ihtiyar, bankta el ele oturan iki genç, eski iskelenin ucunda misina sallayan çocuklar.", en: "As the sun goes down into the bay, the lanterns light one after another. For the first time since Integration there's an evening stroll on {yer:kordon}: an old man selling pretzels off a tray, two teenagers holding hands on a bench, kids dangling fishing line off the end of the old pier." }
          - metin: { tr: "Fenerlerden birinin altındaki bankta {npc:elif_sari} oturuyor; aylardır ilk kez üstünde önlük yok.", en: "On a bench under one of the lanterns sits {npc:elif_sari}, out of her scrubs for the first time in months." }
            kosul: { npc_hayatta: "elif_sari" }
          - { tr: "Derken eski iskelenin altında su kaynamaya başlıyor. Kabuklular temizlenmişti, ama anaları meğer hiç gitmemiş. Kamyon büyüklüğünde bir sırt, çocukların ayaklarının dibinden yükseliyor.", en: "Then the water under the old pier starts to boil. The shellbacks got cleared out, but their mother never left. A back the size of a pickup truck rises up right under the kids' feet." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Ana kabuklu yaşlı ve ağır; kabuğunun sol yanında, kıskacın dibinde bir çatlak var. Işıktan hoşlanmıyor, yuvasına dönmek istiyor, ama yolunda çocuklar var.", en: "The mother is old and slow, with a crack in her shell on the left side, right at the root of the claw. She doesn't like the light. She wants to go back to her nest, but the kids are in the way." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "fenerleri yaktın, ışık da onu uyandırdı. her ışık bir şeyi uyandırır. yine de yak. yalnız bunu bil.", en: "you lit the lanterns and the light woke it up. every light wakes something. light them anyway. just know that." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklar! Önce çocuklar!\"", en: "\"The kids! Kids first!\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kamyon kadar yengeç. Bayılıyorum bu şehre.\"", en: "\"A crab the size of a pickup. God, I love this city.\"" }
        secenekler:
          - id: "iskele"
            etiket: { tr: "İskeleye koş; çocukları sudan çek", en: "Run for the pier. Get the kids out of the water" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["kordon_kabuklusu@dunya+40", "kordon_kabuklusu@dunya"], ortam: ["su"], kazan: "p3_kordon_aksami_son", kaybet: "p3_kordon_aksami_yenilgi" }
          - id: "karanlik"
            etiket: { tr: "Fenerleri söndür; onu karanlıkta, yuvasında avla", en: "Douse the lanterns. Hunt it in the dark, in its nest" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - savas: { dusmanlar: ["kordon_kabuklusu@dunya+30"], ortam: ["su", "karanlik"], kazan: "p3_kordon_aksami_son", kaybet: "p3_kordon_aksami_yenilgi" }
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Suya tek bir bakış at; geri batsın", en: "Give the water one look. Let it sink back down" }
            gerekli: { stat: { wil: 260 } }
            etkiler:
              - dikkat: 4
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 15
            sonraki: "p3_kordon_aksami_bakis"
          - id: "ordu"
            etiket: { tr: "Sancağın altındakilere seslen: \"Bu sahil sizin!\"", en: "Call to your banner: \"This shore is yours!\"" }
            goster: { ordu_min: 1 }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - ordu_kazan: 10
            sonraki: "p3_kordon_aksami_ordu"

      - id: "p3_kordon_aksami_bakis"
        yer: "kordon"
        paragraflar:
          - { tr: "Kalabalığın arasından sıyrılıp iskelenin ucuna yürüyor, suya bakıyorsun; yalnızca bakıyorsun. Kaynayan su duruluyor.", en: "You slip through the crowd, walk to the end of the pier, and look at the water. That's all. You just look. The boiling stops." }
          - { tr: "Kamyon büyüklüğündeki sırt bir an orada asılı kalıyor, sonra bir denizaltı gibi ağır ağır geldiği karanlığa gömülüyor. Bir daha çıkmayacak; bunu ikiniz de biliyorsunuz.", en: "The pickup-sized back hangs there for a second. Then, very slowly, like a submarine, it sinks back into the dark it came from. It isn't coming up again. You both know it." }
          - { tr: "Arkandan tek bir alkış yükselmiyor. Simitçi ihtiyar tepsisini göğsüne bastırmış, sana Kadim gemisine bakar gibi bakıyor.", en: "Behind you, nobody claps. The old pretzel guy has his tray clutched to his chest, and he's staring at you the way people stare at the Ancient ship." }
        secenekler:
          - id: "simit"
            etiket: { tr: "İhtiyardan bir simit al", en: "Buy a pretzel off the old man" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Arkanı dön ve yürü", en: "Turn around and walk off" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "p3_kordon_aksami_ordu"
        yer: "kordon"
        paragraflar:
          - { tr: "Sesin {yer:kordon} boyunca yankılanınca fenerlerin altından insanlar fırlıyor: simitçinin yanındaki genç, banktaki iki âşık, misinasını bırakıp koşan bir baba... Hepsi sancağının altında savaşmayı öğrenmiş sıradan insanlar.", en: "Your voice carries down the whole Esplanade, and people come running out from under the lanterns: the kid next to the pretzel guy, the two on the bench, a dad dropping his fishing line. Ordinary people who learned to fight under your banner." }
          - { tr: "Ana kabuklu iskelenin altından çıktığında karşısında bir duvar buluyor; senin değil, onların duvarı. Sen yalnızca bir kez, kıskacı bir çocuğun misinasına dolandığı anda araya giriyorsun.", en: "When the mother comes up from under the pier, she finds a wall waiting. Not yours. Theirs. You only step in once: the second her claw tangles in a kid's fishing line." }
          - { tr: "Gece yarısı ana kabuklu iskelenin taşlarında sırtüstü yatıyor. Biri sönmüş fenerlerden birini yeniden yakınca herkes onun ardından yakmaya başlıyor.", en: "By midnight the mother is lying on her back on the pier stones. Somebody relights one of the lanterns that went out. Then everybody does." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Fenerlerin altına yürü", en: "Walk out under the lanterns" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "p3_kordon_aksami_son"

      - id: "p3_kordon_aksami_son"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon} yeniden sessizliğe gömülmüş. Ana kabuklu eski iskelenin taşlarında yatıyor; kabuğundaki su fener ışığında buhar buhar tütüyor.", en: "The Esplanade is quiet again. The mother lies on the stones of the old pier, the water on her shell steaming in the lantern light." }
          - { tr: "Akşam yürüyüşü yavaş yavaş geri dönüyor: önce simitçi ihtiyar, sonra banktaki iki genç, en son da misinalarını yeniden suya atan çocuklar.", en: "The stroll comes back little by little. The old pretzel guy first, then the two on the bench, and last of all the kids, casting their lines back into the water." }
          - metin: { tr: "{npc:elif_sari} elinde iki bardak çayla yanına gelip birini sana uzatıyor. \"Bir akşam,\" diyor. \"Tek istediğim bir akşamdı. Aldık mı onu?\"", en: "{npc:elif_sari} comes over with two paper cups of coffee and hands you one. \"One evening,\" she says. \"That's all I wanted. Just one. Did we get it?\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|le} fenerlerin altında yürü", en: "Walk the lanterns with {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            sonraki: "@akis"
          - id: "simit"
            etiket: { tr: "Yürüyüşe katıl; ihtiyardan bir simit al", en: "Join the stroll. Buy a pretzel off the old man" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Fenerlere nöbet kur; her gece biri beklesin", en: "Set a lantern watch. Somebody on it every night" }
            etkiler:
              - ahlak: { duzen: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "p3_kordon_aksami_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Ana kabuklu seni iskelenin taşlarına yapıştırırken kıskacı bir mengene gibi üstüne kapanıyor. Fener ışığı bir an gözünde kararıyor.", en: "The mother pins you to the pier stones, and her claw closes like a vise. The lantern light goes dark for a second." }
          - { tr: "Derken bir kanca, bir halat, sayısız el: {yer:kordon|in} akşam gezenleri ellerine ne geçtiyse kabukluya üşüşüyor. Onu sudan söküp çıkaran sen değil, onlar oluyor.", en: "Then a gaff hook, a rope, a whole lot of hands: {yer:kordon|pos} evening strollers pile onto the shellback with whatever they've got. You're not the one who drags it out of the water. They are." }
          - { tr: "Yere ilk düşüşün değil bu, ama seni ilk kez bir şehir ayağa kaldırıyor.", en: "It isn't the first night you've gone down. But it's the first time a city has picked you back up." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; onlara tek tek teşekkür et", en: "Get up. Thank them one by one" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "p3_kordon_aksami_son"

  # ---------------------------------------------------------------- Ölçücü (tohum: p3_kapi_firtinasi · fırtına taşı)
  - id: "p3_firtina_olcucu"
    perde: [3, 4]
    agirlik: 1
    etiketler: ["kadimler", "kapi", "hakimiyet"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Ölçücü", en: "The Assessor" }
    sahne: "p3_olcucu_1"
    sahneler:
      - id: "p3_olcucu_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Fırtına taşını cebinde taşıdığın üçüncü gün taş ısınıp sızlayan bir diş gibi tek bir yönü göstermeye başlıyor. Nerede olursan ol, çekişi hep aynı yana: {yer:eski_sehir|e}, saat kulesine.", en: "On the third day you've been carrying the storm stone, it warms up and starts pointing one way, like an aching tooth. Wherever you are, the pull is the same: the {yer:eski_sehir}. The clock tower." }
          - { tr: "Kulenin tepesinde, durmuş saatin dişlileri arasında uzun boylu, ince, şapkalı bir Kadim oturuyor; dizlerinde bir defter, elinde bir cetvel. Cetveli şehre doğru tutup deftere bir şey yazıyor, sonra bir daha.", en: "At the top of the tower, among the gears of the stopped clock, sits a tall, thin Ancient in a hat, a ledger on its knees and a measuring rod in its hand. It holds the rod out toward the city and writes something down. Then again." }
          - { tr: "Ayaklarının dibinde, üstünde {yer:sanayi|in} döküm önlüğüyle yaşlı bir adam Kadim'in pelerininin eteğindeki tozu fırçalıyor. Seni görünce fırça elinden düşüyor.", en: "At its feet, an old man in an Ironworks foundry apron is brushing the dust off the hem of the Ancient's cloak. When he sees you, the brush falls out of his hand." }
          - { tr: "\"Ah,\" diyor Ölçücü kibar bir gülümsemeyle. \"Ölçülen geldi. Lütfen kıpırdamayın, fırtına sonrası değerleriniz eksik.\"", en: "\"Ah,\" the Assessor says with a polite smile. \"The measured has arrived. Please hold still. Your post-storm figures are incomplete.\"" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Defterin açık sayfasında yedi kapı ve her birinin kapanma süresi yazılı; en altta da üstü çizilip yeniden yazılmış bir satır var: senin adın, yanında bir soru işareti.", en: "The open page of the ledger lists seven Gates, how long each took to close, and at the bottom a line that's been crossed out and rewritten: your name, with a question mark next to it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "işte, seni ölçmek isteyen bu. ölçtüğü şey küçülürmüş. sen küçülme.", en: "there. that's the one who wanted to measure you. they say whatever it measures gets smaller. don't." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"O defterin bir kopyası lazım bana. Kopyası diyorum, sakın yakma.\"", en: "\"I need a copy of that ledger. A copy. Please don't burn it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yedi mahalleyi bunun için mi ateşe verdi? Bir sayı için mi?\"", en: "\"It set seven neighborhoods on fire for this? For a number?\"" }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Cetvelini kır; defterini al", en: "Break its rod. Take its ledger" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - savas: { dusmanlar: ["kadim_olcucu@oyuncu+2"], ortam: ["dar_gecit"], kazan: "p3_olcucu_zafer", kaybet: "p3_olcucu_yenilgi" }
          - id: "kucuk"
            tur: "gizle"
            etiket: { tr: "Ölçülmene izin ver; sayılarını küçük göster", en: "Let it measure you. Show it smaller numbers" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: 1, duzen: -1 }
            sonraki: "p3_olcucu_kucuk"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|i} çağır: bu ölçüm kimin emriyle?", en: "Call {npc:thessar}. Whose orders is this on?" }
            goster: { npc_hayatta: "thessar", bayrak: "thessar_indi" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { thessar: { guven: 4, saygi: 3 } }
            sonraki: "p3_olcucu_thessar"
          - id: "usta"
            etiket: { tr: "Önce yaşlı adamla konuş", en: "Talk to the old man first" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "p3_olcucu_usta"

      - id: "p3_olcucu_usta"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Adam fırçasını yerden almıyor. \"Taşı ben getirdim,\" diyor, sen sormadan. \"Döküm fırınına ben koydum. Karşılığında vel verdiler. Yok, vel değil; adımı Defter'e yazdılar. Torunum korunsun diye.\"", en: "The man doesn't pick up his brush. \"I carried the stone,\" he says, before you can ask. \"I put it in the foundry furnace. They paid me in vel. Not vel. They wrote my name in the Ledger. So my grandson would be protected.\"" }
          - { tr: "\"Yedi mahalle,\" diyor sonra, sesi çatallanarak. \"Biri benim sokağımdı. Bilmiyordum, vallahi bilmiyordum.\"", en: "\"Seven neighborhoods,\" he says then, his voice cracking. \"One of them was my street. I didn't know. I swear to God I didn't know.\"" }
          - { tr: "Ölçücü defterine bir şey not ediyor. \"Kaynak iş birliği: beklenen,\" diye mırıldanıyor. \"Pişmanlık: beklenen.\"", en: "The Assessor jots something in its ledger. \"Source cooperation: as expected,\" it murmurs. \"Remorse: as expected.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "\"Torununun yanına git. Gerisini ben hallederim.\"", en: "\"Go home to your grandson. I've got this.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
            sonraki: "p3_olcucu_karar"
          - id: "lonca"
            etiket: { tr: "Onu Lonca'ya teslim et; hesabını versin", en: "Turn him over to the Guild. He answers for it" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - itibar: { lonca: 2 }
            sonraki: "p3_olcucu_karar"

      - id: "p3_olcucu_karar"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Yaşlı adam merdivenlerden inerken ayak sesleri saat kulesinin içinde uzun uzun yankılanıyor. Ölçücü cetvelini yeniden kaldırıyor. \"Şimdi,\" diyor, \"sıra sizde.\"", en: "The old man goes down the stairs, and his footsteps echo inside the clock tower for a long time. The Assessor raises its rod again. \"Now,\" it says. \"You.\"" }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Cetvelini kır; defterini al", en: "Break its rod. Take its ledger" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - savas: { dusmanlar: ["kadim_olcucu@oyuncu+2"], ortam: ["dar_gecit"], kazan: "p3_olcucu_zafer", kaybet: "p3_olcucu_yenilgi" }
          - id: "kucuk"
            tur: "gizle"
            etiket: { tr: "Ölçülmene izin ver; sayılarını küçük göster", en: "Let it measure you. Show it smaller numbers" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: 1, duzen: -1 }
            sonraki: "p3_olcucu_kucuk"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|i} çağır: bu ölçüm kimin emriyle?", en: "Call {npc:thessar}. Whose orders is this on?" }
            goster: { npc_hayatta: "thessar", bayrak: "thessar_indi" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { thessar: { guven: 4, saygi: 3 } }
            sonraki: "p3_olcucu_thessar"

      - id: "p3_olcucu_kucuk"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Nefesini, nabzını, penceredeki sayıları küçültüyorsun; kapı canavarından saklanan bir avcı gibi, ama içeriden. Cetvel omzuna değdiğinde hiçbir şey eksilmiyor, çünkü alınacak bir şey bırakmadın.", en: "You shrink your breathing, your pulse, the numbers in your window, the way a hunter hides from a Gate monster, but from the inside. The rod touches your shoulder and nothing goes missing, because you didn't leave it anything to take." }
          - { tr: "Ölçücü defterine bakıp bir şeyin üstünü çiziyor, yeniden yazıyor. \"Beklentinin altında,\" diyor, sesinde hafif bir hayal kırıklığıyla. \"Demek fırtına bir sapmaymış. Vaktinizi aldım, kusura bakmayın.\"", en: "The Assessor looks at its ledger, crosses something out, writes it again. \"Below projection,\" it says, with a faint note of disappointment. \"The storm was an outlier, then. My apologies for taking your time.\"" }
          - { tr: "Şapkasına dokunup merdiven iner gibi pencereden boşluğa adım atıyor. Defterinde artık küçük, sıradan, budanmaya değmeyecek birinin sayıları yazılı.", en: "It touches its hat and steps out the window into the air like it's walking down a staircase. Its ledger now holds the numbers of a small, ordinary person. Not worth pruning." }
          - metin: { tr: "{npc:yanki}: iyi yalan. benden öğrendin.", en: "{npc:yanki}: good lie. you learned that from me." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Gitmesine izin ver", en: "Let it go" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { kadim_tehdit: -2 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "p3_olcucu_thessar"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Taşın Kadim yazılı yüzünü körfezdeki kemik rengi kuleye çeviriyorsun. Bir dakika geçmeden saat kulesinin penceresinde katlanmış ışıktan bir merdiven beliriyor ve {npc:thessar} yanında tek muhafız olmadan aşağı iniyor.", en: "You hold the stone's Ancient-scripted face up toward the bone-white spire over the bay. A minute later a stair of folded light appears in the clock tower window, and {npc:thessar} comes down it. No Wardens." }
          - { tr: "Ölçücü ayağa kalkıp üç derece eğiliyor; {npc:thessar} ise eğilmiyor. \"Bu ölçümü ben istemedim,\" diyor iki sesiyle. \"Kimin defterine yazıyorsun?\"", en: "The Assessor gets up and bows three degrees. {npc:thessar} doesn't bow back. \"I did not request this measurement,\" he says in both voices. \"Whose ledger are you writing in?\"" }
          - { tr: "Ölçücünün gülümsemesi ilk kez kayıyor. \"Meclis'in, elçim,\" diyor. \"Doğrudan Meclis'in.\"", en: "For the first time, the Assessor's smile slips. \"The Conclave's, Envoy,\" it says. \"Directly.\"" }
          - { tr: "{npc:thessar} sana dönüyor; yüzünde bir Kadim'de görmeyi hiç beklemediğin bir şey var: utanç. \"Kayıtlarımı atlayarak,\" diyor. \"Karar senin. Burası senin dünyan.\"", en: "{npc:thessar} turns to you. There's something on his face you never expected to see on an Ancient's: shame. \"Over the top of my records,\" he says. \"The decision is yours. This is your world.\"" }
        secenekler:
          - id: "yargila"
            etiket: { tr: "\"Onu sen yargıla. Sizin hesabınız.\"", en: "\"You judge it. They're your books.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - degisken: { kadim_tehdit: -4 }
              - iliski: { thessar: { guven: 5, baglilik: 3 } }
            sonraki: "p3_olcucu_thessar_son"
          - id: "kendin"
            etiket: { tr: "\"Benim dünyam, benim hesabım.\" Saldır", en: "\"My world, my books.\" Attack" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
              - iliski: { thessar: { saygi: 4 } }
              - savas: { dusmanlar: ["kadim_olcucu@oyuncu+1"], ortam: ["dar_gecit"], kazan: "p3_olcucu_zafer", kaybet: "p3_olcucu_yenilgi" }
          - id: "birak"
            etiket: { tr: "Gitsin; Meclis ne bildiğini bilsin", en: "Let it go. Let the Conclave know what it knows" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - degisken: { kadim_tehdit: 2 }
              - iliski: { thessar: { guven: -3 } }
            sonraki: "@akis"

      - id: "p3_olcucu_thessar_son"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{npc:thessar} iki parmağını kaldırınca Ölçücü bir kâğıt gibi kendi içine katlanıyor. Yerde yalnızca şapkasıyla kırık cetveli kalıyor.", en: "{npc:thessar} raises two fingers, and the Assessor folds in on itself like a sheet of paper. All that's left on the floor is its hat and its broken rod." }
          - { tr: "Elçi defteri yerden alıp sana uzatıyor. \"Bunu kayda geçirmeyeceğim,\" diyor. \"Meclis bir Ölçücü kaybettiğini anlayacaktır, ama nerede kaybettiğini değil.\"", en: "The Envoy picks the ledger up off the floor and holds it out to you. \"I am not entering this,\" he says. \"The Conclave will notice it has lost an Assessor. But not where.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Defteri al", en: "Take the ledger" }
            etkiler:
              - ahlak: { duzen: 1 }
              - degisken: { kadim_tehdit: -2 }
              - iliski: { thessar: { guven: 2 } }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Defteri ona geri ver", en: "Give the ledger back to him" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { baglilik: 3 } }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "p3_olcucu_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Cetvel ikiye kırılırken Ölçücü de ölçtüğü her şey gibi bir an küçülüyor. Sonra bir yaprak gibi saat kulesinin dişlileri arasına düşüyor.", en: "The rod snaps in two, and the Assessor shrinks for a moment, like everything it ever measured. Then it drops between the clock tower's gears like a leaf." }
          - { tr: "Defter ayaklarının dibinde açık duruyor; içinde yedi kapının saatleri, mahallelerin nüfusu, avcıların tepki süreleri var. En altta da senin satırın: [Gerçek değer: ölçülemedi. Öneri: Budayıcı.]", en: "The ledger lies open at your feet: times for all seven Gates, neighborhood populations, hunter response times, and at the bottom, your line. [True value: unmeasurable. Recommendation: Pruner.]" }
          - metin: { tr: "{npc:yanki}: budayıcı. yine o sözcük.", en: "{npc:yanki}: pruner. that word again." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "yak"
            etiket: { tr: "Defteri yak", en: "Burn the ledger" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - degisken: { kadim_tehdit: -3 }
              - xp_seviye: 25
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Defteri sakla; Kadimler'in nasıl ölçtüğünü öğren", en: "Keep the ledger. Learn how the Ancients measure" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - degisken: { kadim_tehdit: -4 }
              - xp_seviye: 25
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "Defteri {npc:mert_kilic|e} götür", en: "Take the ledger to {npc:mert_kilic}" }
            goster: { npc_hayatta: "mert_kilic", bayrak_yok: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { duzen: -2 }
              - degisken: { kadim_tehdit: -4 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 4, saygi: 3 } }
              - xp_seviye: 25
            sonraki: "@akis"

      - id: "p3_olcucu_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Cetvel omzuna değince bir şey eksiliyor, ama neyin eksildiğini bilemiyorsun. Sen dizlerinin üstüne çökerken Ölçücü defterine son bir satır yazıp şapkasını düzeltiyor.", en: "The rod touches your shoulder and something goes missing. You don't know what. As you drop to your knees, the Assessor writes one last line in its ledger and straightens its hat." }
          - { tr: "\"Teşekkürler,\" diyor; sonra pencereden, basamak iner gibi havaya adım atıyor. \"Değerler tamam.\"", en: "\"Thank you,\" it says, and steps out the window into the air like it's walking down a staircase. \"Figures complete.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk", en: "Get up" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { kadim_tehdit: 3 }
