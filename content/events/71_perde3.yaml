# Parti J — Perde 3 ana yayı ve Perde 3 Kıyıkent olayları (docs/PERDE2_4.md "Parti J").
# Ana yay: yol_olusumu (Gün 260) · buyuk_ihanet (Gün 300) · perde3_son (Gün 320). Dikkat eşikleri: dikkat_75_p3, dikkat_100_p3.
# Büyük ihanetin haini öncelik sırasıyla seçilir; koşul dilinde VEYA olmadığı için yönlendirme iki sahnede yapılır
# (buyuk_ihanet_iz: Mert / Kaya / "dışarıdan"; buyuk_ihanet_kule: Thessar / Deniz / Aras / yedek). Her yönlendirme
# sahnesinde koşullar birbirini dışlar ve kapsar: her oyuncu tam bir yol görür.
# Kıyıkent (Perde 3, Gün 181–330): ordu, Kule 50+ toplumu, Küresel Sıralama'nın tepesi, çok-evrenden dönenler,
# C–A kademe şehir hayatı ve OP MC hakimiyeti (gösteriş statları 120–300).
# Yankı'nın sözleri küçük harfli ve tırnaksızdır. İngilizcede Deniz için zamir belirteci, Yankı "it".
olaylar:
  # ================================================================== YOL OLUŞUMU (ana yay, gün 260)
  - id: "yol_olusumu"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "yol", "oz", "yanki"]
    gerilim: 4
    ana_yay: { gun: 260 }
    onemli: true
    kart: { tr: "İki Öz, tek yol", en: "Two Essences, One Path" }
    sahne: "yol_olusumu_1"
    sahneler:
      - id: "yol_olusumu_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Gece yarısını biraz geçiyor ve göğsünün ortasında bir şey kendi üstüne katlanıyor. Aylardır kavradığın, adını koyabildiğin ya da koyamadığın ne varsa aynı anda uyanıyor; birbirine doğru uzanıyor, aç.", en: "It's a little past midnight, and something in the middle of your chest is folding in on itself. Everything you've grasped these past months, whether you could name it or not, wakes up at once and reaches for everything else. Hungry." }
          - { tr: "Mavi pencere sen istemeden açılıyor. Ama bu kez satırlar titremiyor; bekliyor. Sistem ilk kez bir şey söylemeden önce susuyor.", en: "The blue window opens without you asking. Only this time the lines aren't flickering. They're waiting. For the first time ever, the System goes quiet before it says something." }
          - { tr: "Yol, Sistem'in kitabında A kademesinin hakkıdır: iki Öz'ün birleşip yalnızca sana ait bir güce dönüştüğü an. Kitap senin için hiçbir zaman tam doğru yazılmadı.", en: "In the System's rulebook, a Path is an A-Grade privilege: the moment two Essences fuse into a power that belongs to nobody but you. That rulebook was never quite written with you in mind." }
          - metin: { tr: "{npc:yanki} kafanın içinde, hiç bu kadar uyanık olmamıştı: tamam. tamam, bu o. bunu bekliyordum ve beklediğim için korkuyordum. bir yer seç. bu iş yatakta olmaz. ya da olur; sen seç, ama çabuk.", en: "{npc:yanki} is in your head, more awake than you've ever heard it: okay. okay, this is it. i've been waiting for this, and i've been scared because i was waiting. pick a place. this doesn't happen in bed. or maybe it does. you pick. just pick fast." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "Kafanın içinde bir zamanlar bir ses olurdu ve böyle bir gecede susmazdı. Şimdi yalnızca kendi nabzını duyuyorsun; sessizlik hiç bu kadar kalabalık olmamıştı.", en: "There used to be a voice in your head, and on a night like this it would never have shut up. Now there's just your own pulse. Silence has never felt this crowded." }
            kosul: { bayrak_yok: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YOL EŞİĞİ]", en: "[PATH THRESHOLD]" }
            satirlar:
              - { tr: "Beklenen kademe: A. Mevcut kademe: tutarsız.", en: "Expected Grade: A. Current Grade: inconsistent." }
              - { tr: "Eşik yine de açıldı. Bu bir hata değil. Tekrar ediyoruz: bu bir hata değil.", en: "The threshold opened anyway. This is not an error. Repeat: this is not an error." }
        sezgiler:
          - kosul: { stat: { wis: 180 } }
            metin: { tr: "[ALG] Kavrayışın sınırında iki çizgi birbirine dolanıyor. Bırakırsan kendiliğinden düğümlenecekler; tutarsan düğümü sen atacaksın.", en: "[PER] At the edge of your understanding, two threads are winding around each other. Let go and they'll knot on their own. Hold on and you'll be the one tying the knot." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir şey daha. nerede olursan ol, orası seni hatırlayacak. yollar doğdukları yeri unutmaz.", en: "one more thing. wherever you are, that place is going to remember you. paths never forget where they were born." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yine ışıldıyorsun. Bu sefer farklı ama. Gitme demeyeceğim; sadece dönerken kapıyı çal.\"", en: "\"You're glowing again. It's different this time, though. I'm not gonna tell you not to go. Just knock on your way back in.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nabzın yüz kırk. Ateşin yok. Bunun tıpta adı yok, biliyorsun değil mi?\"", en: "\"Pulse is one-forty. No fever. You know there's no medical term for this, right?\"" }
        secenekler:
          - id: "kule"
            etiket: { tr: "Kule'ye tırman; gökyüzüne yakın ol", en: "Climb the Spire. Get close to the sky" }
            kronik: { tr: "Yolunu Kule'nin tepesinde kurdun; o kattan sonra rüzgâr hep senin adınla esti.", en: "You forged your Path at the top of the Spire. After that, the wind up there always blew with your name on it." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - degisken: { yol_yeri: 1 }
              - bolge: "kule_dibi"
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "yol_olusumu_yanki"
          - id: "kordon"
            etiket: { tr: "Kordon'a in; suyun önünde dur", en: "Head down to the Esplanade and face the water" }
            kronik: { tr: "Yolunu denizin önünde kurdun; o kıyıdaki dalgalar bir daha aynı ritimle vurmadı.", en: "You forged your Path facing the sea. The waves on that shore never broke in quite the same rhythm again." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { yol_yeri: 2 }
              - bolge: "kordon"
            sonraki: "yol_olusumu_yanki"
          - id: "halk"
            etiket: { tr: "Halkının arasında kal; görsünler", en: "Stay with your people. Let them see" }
            kronik: { tr: "Yolunu insanların gözü önünde kurdun; o gece meydanda olan herkes torunlarına anlattı.", en: "You forged your Path in front of everyone. Every person in that square that night told their grandkids about it." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - degisken: { yol_yeri: 3 }
              - bolge: "kiyikent_liman"
              - dikkat: 4
              - itibar: { siginak: 3, lonca: 3, yukselenler: 3 }
            sonraki: "yol_olusumu_yanki"
          - id: "yalniz"
            tur: "gizle"
            etiket: { tr: "Kimseye söyleme; tek başına karanlığa çekil", en: "Tell no one. Slip off into the dark alone" }
            kronik: { tr: "Yolunu kimse görmeden kurdun; şehir, aralarında ne yürüdüğünü uzun süre bilmedi.", en: "You forged your Path where no one could see. For a long time, the city had no idea what was walking among them." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - degisken: { yol_yeri: 4 }
              - bolge: "eski_sehir"
              - gizle: 6
            sonraki: "yol_olusumu_yanki"

      - id: "yol_olusumu_yanki"
        paragraflar:
          - metin: { tr: "Kule'nin dış merdivenlerinden kırk kat tırmanıyorsun; son on katı merdivensiz, duvarın kendisinden. Rüzgâr burada tuzsuz ve soğuk. Aşağıda {yer:kiyikent} bir avuç sönük kömür gibi; körfezin üstünde Kadim gemisi, yıldızların bir kısmını kapatan bir gölge.", en: "You take the Spire's outer stairs forty floors up, and the last ten without stairs at all, straight up the wall. The wind up here is cold and doesn't taste like salt. Below, {yer:kiyikent} is a handful of dying embers. Over the bay, the Ancient ship is a shadow that blots out a chunk of the stars." }
            kosul: { degisken_min: { yol_yeri: 1 }, degisken_max: { yol_yeri: 1 } }
          - metin: { tr: "Kordon'un ıslak taşlarına iniyorsun. Su kara ve sakin; martılar bile susmuş. Dalgalar ayağının dibinde, kıyıya varmadan duruyor, sanki onlar da bekliyor.", en: "You walk down onto the Esplanade's wet stones. The water's black and flat, and even the gulls have shut up. The waves stop just short of your boots, like they're waiting too." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 } }
          - metin: { tr: "Kordon düştüğünden beri buraya insan inmiyor. Kabuklu bir şey yıkık bir büfenin altında kıpırdıyor, sana bakıyor ve geri çekiliyor. Bu gece canavarlar bile neyin doğduğunu biliyor.", en: "Nobody's come down here since the Esplanade fell. Something with a shell shifts under a wrecked snack stand, looks at you, and backs off. Tonight even the monsters know what's being born." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 }, bayrak: "kordon_dustu" }
          - metin: { tr: "Liman meydanında kalıyorsun ve bir şeylerin değiştiğini ilk fark eden çocuklar oluyor: tenin ışık sızdırıyor. Önce birkaç kişi, sonra yüzlerce kişi etrafında bir halka oluşturuyor; kimse yaklaşmıyor, kimse gitmiyor.", en: "You stay in the waterfront square, and the kids are the first to notice something's off: light is leaking out of your skin. First a few people, then hundreds form a ring around you. Nobody comes closer. Nobody leaves." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "Halkanın en önünde senin bayrağının altındakiler duruyor. Kimse emir vermiyor; kalkanlar kendiliğinden kalabalığa dönüyor. Ne doğacaksa, önce onlara bakacak.", en: "The people under your banner hold the front of the ring. Nobody gives the order; the shields just turn to face the crowd on their own. Whatever's about to be born, it's going to see them first." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 }, ordu_min: 1 }
          - metin: { tr: "Eski Şehir'in çatılarından birine çıkıyorsun; kiremitlerin yarısı entegrasyondan beri kayıp. Kimse yukarı bakmıyor. Burada doğacak şeyi yalnızca ay ve sen göreceksiniz.", en: "You climb onto one of the rooftops in Old Town, half its shingles missing since Integration. Nobody looks up. Whatever gets born here, only you and the moon are going to see it." }
            kosul: { degisken_min: { yol_yeri: 4 } }
          - metin: { tr: "{npc:yanki} konuşmaya başlıyor ve bu kez susmuyor: öz bir kelimedir. dünyanın kendine verdiği isimlerden biri. sen onlardan birkaçını ezberledin. şimdi onları bir cümleye bağlayacaksın. Sistem buna yol diyor. ben buna imza diyorum.", en: "{npc:yanki} starts talking, and this time it doesn't stop: an essence is a word. one of the names the world gave itself. you've memorized a few of them. now you're going to tie them into a sentence. the System calls that a path. i call it a signature." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "herkesin yolu A kademesinde açılır, çünkü Sistem bir cümleyi ancak o kadar kelime bilen birine emanet eder. seninki erken açıldı, çünkü sende benim kelimelerim de var. özür dilemiyorum. sadece haber veriyorum.", en: "everyone's path opens at A-Grade, because the System only trusts a sentence to somebody who knows that many words. yours opened early, because you've got my words in you too. i'm not apologizing. i'm just letting you know." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "artık ne olduğunu biliyorsun: hasat. bir yol, hasat edilen tarlada biten en sert köke benzer. sökmesi zordur. iyi. sökülmesi zor bir şey ol.", en: "you know what this is now. a harvest. a path is like the toughest root in a field that's getting harvested. hard to pull. good. be something that's hard to pull." }
            kosul: { bayrak: ["yanki_bagi", "gercek_hasat"] }
          - metin: { tr: "artık ne olduğunu biliyorsun: ölmüş bir ırkın yazdığı bir kurtarma protokolü. yollar onların bize bıraktığı aletler. alet kimin elindeyse ona benzer. dikkat et neye benzediğine.", en: "you know what this is now. a rescue protocol, written by a race that died. paths are the tools they left us. a tool ends up looking like whoever holds it. careful what yours ends up looking like." }
            kosul: { bayrak: ["yanki_bagi", "gercek_kurtarma"] }
          - metin: { tr: "Bu kez ses yalnızca kafanın içinde kalmıyor. Bileğinden ve gözlerinin kenarından bozuk mavi bir ışık sızıyor; seni görenler artık bunun ne olduğunu biliyor. {npc:yanki} umursamıyor: baksınlar. ilk kez birinin bunu doğru yaptığını görüyorlar.", en: "This time the voice doesn't stay in your head. Glitched blue light leaks from your wrist and the corners of your eyes, and anyone looking knows exactly what it is now. {npc:yanki} doesn't care: let them look. it's the first time they've seen somebody do this right." }
            kosul: { bayrak: ["yanki_bagi", "yanki_gorundu"] }
          - metin: { tr: "Ama sesin altında başka bir şey de var; açlığa benzeyen, kendi payını hesaplayan bir şey. Kelimelerin bir kısmının senin değil, onun olacağını biliyor ve bunu saklamaya pek uğraşmıyor.", en: "But there's something else under the voice. Something like hunger, already counting its share. It knows some of these words are going to end up being its words, not yours, and it isn't trying very hard to hide that." }
            kosul: { bayrak: "yanki_ele_gecirdi" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Kadim gemisinin alt yüzünde bir ışık yanıp sönüyor; düzenli, ölçülü. Biri bu anı kaydediyor.", en: "[PER] A light is blinking on the underside of the Ancient ship. Steady, measured. Somebody's recording this." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Anlatmaya devam etsin", en: "Let it keep talking" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolun doğarken {npc:yanki|i} sonuna kadar dinledin; o gece ona ilk kez bir şey borçlu olduğunu hissettin.", en: "While your Path was being born, you heard {npc:yanki} out to the end. That night you felt, for the first time, that you owed it something." }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 35 }
            sonraki: "yol_olusumu_ani"
          - id: "dongu_sor"
            etiket: { tr: "\"Bunu daha önce kaç kez gördün?\"", en: "\"How many times have you watched this before?\"" }
            goster: { bilgi: "yanki_parcasi" }
            kronik: { tr: "{npc:yanki|e} döngüyü ilk kez sen sordun; cevap, Kule'nin en üst katına kadar peşini bırakmadı.", en: "You were the first to ask {npc:yanki} about the loop. The answer followed you all the way to the top of the Spire." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { yanki: { guven: 8, korku: 3 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 45 }
            sonraki: "yol_olusumu_ani"
          - id: "sus"
            etiket: { tr: "\"Sus. Bu benim anım.\"", en: "\"Quiet. This moment is mine.\"" }
            kronik: { tr: "Yolun doğduğu gece {npc:yanki|i} susturdun; o güçte onun sesinden çok seninki vardı.", en: "The night your Path was born, you told {npc:yanki} to be quiet. There was more of your voice in that power than its own." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { saygi: 6, guven: -3 } }
            sonraki: "yol_olusumu_secim"

      - id: "yol_olusumu_ani"
        paragraflar:
          - { tr: "{npc:yanki} bir an duraklıyor; sonra sesi tuhaf biçimde yumuşuyor, eski bir fotoğrafı tarif eden biri gibi: bir kez daha gördüm bunu. başka bir şehirde. başka bir taşıyıcıda. o da erkendi. o da benim kelimelerimi taşıyordu.", en: "{npc:yanki} pauses. Then its voice goes strangely soft, like someone describing an old photograph: i've seen this once before. another city. another carrier. they were early too. they carried my words too." }
          - { tr: "ateşi ve duvarları seçti. herkesi arkasına alacağını sandı. sonunu hatırlamıyorum; yalnızca biçimini hatırlıyorum. bir duvar. bir kıvılcım. sonra yeniden mavi paneller ve ilk gün.", en: "it picked fire and walls. thought it could get everyone behind it. i don't remember how it ended. i only remember the shape. a wall. a spark. then the blue panels again, and day one." }
          - { tr: "Söylediğinin ağırlığını kendisi de ancak şimdi duyuyor gibi. Rüzgâr bir an kesiliyor. Göğsündeki iki ateş birbirine biraz daha yaklaşıyor ve sabırsızlanıyor.", en: "It sounds like it's only now hearing the weight of what it just said. The wind cuts out for a second. The two fires in your chest crowd a little closer together, impatient." }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[KAYIT B̷ULUNAMADI]", en: "[REC̷ORD NOT FOUND]" }
            satirlar:
              - { tr: "önceki taşıyıcı: █████. önceki yol: kor... kor█.", en: "previous carrier: █████. previous path: ember... emb█." }
              - { tr: "bu satır silinmişti. neden hâlâ okunuyor?", en: "this line was deleted. why can you still read it?" }
        secenekler:
          - id: "farkli"
            etiket: { tr: "\"O zaman bu sefer farklı yapalım.\"", en: "\"Then let's do it different this time.\"" }
            kronik: { tr: "{npc:yanki|e} bu kez farklı olacağına söz verdin; söz, sonuna kadar ikinizin arasında durdu.", en: "You promised {npc:yanki} it would be different this time. That promise stood between the two of you until the end." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { baglilik: 8, guven: 4 } }
            sonraki: "yol_olusumu_secim"
          - id: "kimdi"
            etiket: { tr: "\"Önceki taşıyıcı kimdi?\"", en: "\"Who was the last carrier?\"" }
            kronik: { tr: "Önceki taşıyıcının izini sordun; o soru, senden önce bu yolu yürüyen birinin varlığını sonsuza dek kesinleştirdi.", en: "You asked about the last carrier. That question settled it for good: someone had walked this road before you." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bilgi: "yol_onceki_tasiyici"
              - iliski: { yanki: { guven: 4, korku: 2 } }
            sonraki: "yol_olusumu_onceki"

      - id: "yol_olusumu_onceki"
        paragraflar:
          - { tr: "bilmiyorum, diyor {npc:yanki}. bilmemem gerekiyor. her döngüde silinen ilk şey taşıyıcının adı oluyor. ama bir şey kaldı: sabahları ayakkabısının bağını iki kez bağlardı. çift düğüm. sanki bir şeyin çözülmesinden korkarmış gibi.", en: "i don't know, {npc:yanki} says. i'm not supposed to. every loop, the first thing that gets erased is the carrier's name. but one thing stuck. every morning they'd double-knot their shoes. like they were scared something might come undone." }
          - { tr: "Aşağı bakıyorsun. Kendi botunun bağcığı çift düğümlü. Bunu ne zamandan beri yaptığını hatırlamıyorsun.", en: "You look down. Your own laces are double-knotted. You can't remember when you started doing that." }
          - { tr: "tesadüf, diyor ses, fazla hızlı. muhtemelen tesadüf. hadi. ateşler bekliyor.", en: "coincidence, the voice says, way too fast. probably a coincidence. come on. the fires are waiting." }
        secenekler:
          - id: "coz"
            etiket: { tr: "Bağcıklardan birini çöz", en: "Untie one of the laces" }
            kronik: { tr: "Yolun doğduğu gece bir düğümü çözdün; ondan sonra hiçbir şeyi iki kez bağlamadın.", en: "The night your Path was born, you undid one knot. After that you never tied anything twice." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - iliski: { yanki: { saygi: 5 } }
            sonraki: "yol_olusumu_secim"
          - id: "birak"
            etiket: { tr: "Bırak öyle kalsın", en: "Leave them be" }
            kronik: { tr: "Düğümlere dokunmadın; bazı geceler önceki taşıyıcının rüyalarını gördün.", en: "You left the knots alone. Some nights, you dreamed the last carrier's dreams." }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "yol_olusumu_secim"

      - id: "yol_olusumu_secim"
        paragraflar:
          - { tr: "Ateşler artık bekleyemiyor. Göğsünün içinde kavradığın her Öz ayağa kalkıyor; her biri kendi rengiyle, kendi sıcaklığıyla, kendi açlığıyla. Yol iki tanesinden doğacak, fazlasından değil.", en: "The fires can't wait anymore. Every Essence you've grasped stands up inside your chest, each with its own color, its own heat, its own hunger. The Path gets born from two of them. No more than two." }
          - { tr: "Hangisine önce uzanırsan, Yol onun etrafında kurulacak. Diğeri ona eşlik edecek. Kavramadığın bir şeye uzanmak da mümkün; ama bedeli, hiç tutmadığın bir şeyi ilk kez tutmanın bedeli olur.", en: "Whichever one you reach for first, the Path gets built around it. The other one keeps it company. You can reach for something you've never held, too. But the price is the price of grabbing something you've never held before." }
          - metin: { tr: "{npc:yanki} fısıldıyor: ya da bana bırak. ben hangi kelimelerin birbirine yakıştığını bilirim. hep bildim.", en: "{npc:yanki} whispers: or leave it to me. i know which words go together. i always have." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Öz uyumu", en: "[ANALYSIS] Essence compatibility" }
            satirlar:
              - { tr: "Bağlı Öz'ler öncelikli. Bağlı olmayan Öz'le birleşme: yüksek acı, sıfır geri dönüş.", en: "Bound Essences take priority. Fusing with an unbound Essence: high pain, zero refunds." }
        secenekler:
          - id: "ates"
            etiket: { tr: "İçindeki Ateş'e uzan", en: "Reach for the Fire in you" }
            goster: { oz: "ates" }
            kronik: { tr: "Yolunu Ateş'in etrafında kurdun; o günden sonra yanındakiler hep biraz daha sıcak, karşındakiler hep biraz daha korkak oldu.", en: "You built your Path around Fire. From then on, the people beside you were always a little warmer, and the ones facing you a little more afraid." }
            etkiler:
              - ahlak: { merhamet: -1, insanlik: -1 }
            sonraki: "yol_olusumu_oz_ates"
          - id: "uzay"
            etiket: { tr: "İçindeki Uzay'a uzan", en: "Reach for the Space in you" }
            goster: { oz: "uzay" }
            kronik: { tr: "Yolunu Uzay'ın etrafında kurdun; o günden sonra hiçbir mesafe sana uzak gelmedi.", en: "You built your Path around Space. From then on, no distance ever felt far to you." }
            etkiler:
              - ahlak: { duzen: -2 }
            sonraki: "yol_olusumu_oz_uzay"
          - id: "olum"
            etiket: { tr: "İçindeki Ölüm'e uzan", en: "Reach for the Death in you" }
            goster: { oz: "olum" }
            kronik: { tr: "Yolunu Ölüm'ün etrafında kurdun; o günden sonra cenazelerde insanlar sana bakmaktan kaçındı.", en: "You built your Path around Death. From then on, people at funerals tried not to look at you." }
            etkiler:
              - ahlak: { insanlik: -3 }
            sonraki: "yol_olusumu_oz_olum"
          - id: "koruma"
            etiket: { tr: "İçindeki Koruma'ya uzan", en: "Reach for the Warding in you" }
            goster: { oz: "koruma" }
            kronik: { tr: "Yolunu Koruma'nın etrafında kurdun; o günden sonra arkanda duranlar sırtlarını hiç kollamadı.", en: "You built your Path around Warding. From then on, the people behind you never had to watch their backs." }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "yol_olusumu_oz_koruma"
          - id: "yikim"
            etiket: { tr: "İçindeki Yıkım'a uzan", en: "Reach for the Ruin in you" }
            goster: { oz: "yikim" }
            kronik: { tr: "Yolunu Yıkım'ın etrafında kurdun; o günden sonra kurulan her şey sana bir soru gibi baktı.", en: "You built your Path around Ruin. From then on, everything anyone built looked at you like a question." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -1 }
            sonraki: "yol_olusumu_oz_yikim"
          - id: "zaman"
            etiket: { tr: "İçindeki Zaman'a uzan", en: "Reach for the Time in you" }
            goster: { oz: "zaman" }
            kronik: { tr: "Yolunu Zaman'ın etrafında kurdun; o günden sonra saatler senin yanında biraz daha yavaş tıkladı.", en: "You built your Path around Time. From then on, clocks ticked a little slower around you." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "yol_olusumu_oz_zaman"
          - id: "avlanma"
            etiket: { tr: "İçindeki Avlanma'ya uzan", en: "Reach for the Hunt in you" }
            goster: { oz: "avlanma" }
            kronik: { tr: "Yolunu Avlanma'nın etrafında kurdun; o günden sonra kaçan hiçbir şey yeterince uzağa gidemedi.", en: "You built your Path around the Hunt. From then on, nothing that ran from you ever got far enough." }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "yol_olusumu_oz_avlanma"
          - id: "yanki_oz"
            etiket: { tr: "İçindeki {npc:yanki} Öz'üne uzan", en: "Reach for the {npc:yanki} Essence in you" }
            goster: { oz: "yanki" }
            kronik: { tr: "Yolunu Sistem'in tanımlayamadığı Öz'ün etrafında kurdun; o günden sonra pencerelerin seni hiç tam okuyamadı.", en: "You built your Path around the Essence the System can't define. From then on, your windows could never quite read you." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
            sonraki: "yol_olusumu_oz_yanki"
          - id: "bilinmeyen"
            etiket: { tr: "Hiç tutmadığın bir şeye uzan", en: "Reach for something you've never held" }
            kronik: { tr: "Yolunu hiç kavramadığın bir şeyden kurdun; Sistem bunu bir hata olarak kaydetti, sen ise bir başlangıç olarak.", en: "You built your Path out of something you'd never grasped. The System logged it as an error. You logged it as a beginning." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - can: -500
            sonraki: "yol_olusumu_bilinmeyen"
          - id: "yankiya_birak"
            etiket: { tr: "{npc:yanki|e} bırak; o seçsin", en: "Leave it to {npc:yanki}. Let it choose" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolunu {npc:yanki} seçti; o günden sonra gücünün bir kısmı hep onun sesiyle konuştu.", en: "{npc:yanki} chose your Path. From then on, part of your power always spoke in its voice." }
            etkiler:
              - ahlak: { insanlik: -4 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            sonraki: "yol_olusumu_yanki_secer"

      # ---------------------------------------------------------------- Öz başına eş seçimi
      - id: "yol_olusumu_oz_ates"
        paragraflar:
          - { tr: "Ateş eline geliyor ve bir an seni de yakmayı düşünüyor. Sonra tanıyor; parmaklarının arasında evcil bir hayvan gibi kıvrılıyor ama gözleri vahşi kalıyor.", en: "The Fire comes to your hand and, for a second, thinks about burning you too. Then it recognizes you and curls between your fingers like a pet, except its eyes stay wild." }
          - { tr: "Ateş yalnız yaşamaz; bir şeyi ısıtmak ya da bir şeyi yakmak ister. Hangisi olacağına senin eşlik edeceğin ikinci Öz karar verecek.", en: "Fire doesn't live alone. It wants to warm something or burn something down. Which one depends on the second Essence you hand it." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Ateşi Koruma'yla ör: bir sur", en: "Weave Fire with Warding: a wall" }
            kronik: { tr: "Ateşle korumayı birleştirdin; arkanda kalan hiçbir şey bir daha üşümedi.", en: "You fused Fire with Warding. Nothing that stood behind you was ever cold again." }
            etkiler:
              - oz: { ates: 100, koruma: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_kor_sur"
          - id: "kul_dogan"
            etiket: { tr: "Ateşi Yıkım'la ör: yak ve yeniden doğ", en: "Weave Fire with Ruin: burn down, rise again" }
            kronik: { tr: "Ateşle yıkımı birleştirdin; yaktığın her şeyin yerinde daha sert bir şey bitti.", en: "You fused Fire with Ruin. Everywhere you burned something, something harder grew back." }
            etkiler:
              - oz: { ates: 100, yikim: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -4, insanlik: -4 }
              - iliski: { yanki: { saygi: 8, korku: 3 } }
            sonraki: "yol_olusumu_kul_dogan"

      - id: "yol_olusumu_oz_uzay"
        paragraflar:
          - { tr: "Uzay'a uzandığında elin hiçbir şeye değmiyor; çünkü dokunduğun şey aradaki boşluğun kendisi. Kordon ile Kule arasındaki mesafe avucunda katlanıp küçülüyor, bir mendil gibi.", en: "When you reach for Space, your hand doesn't touch anything, because what you're touching is the gap itself. The distance between the Esplanade and the Spire folds down small in your palm, like a handkerchief." }
          - { tr: "Mesafe bir silah olabilir ya da bir kapı. İkinci Öz hangisi olacağını söyleyecek.", en: "Distance can be a weapon or a door. The second Essence will decide which." }
        secenekler:
          - id: "ufuk_avcisi"
            etiket: { tr: "Uzay'ı Avlanma'yla ör: ufku avla", en: "Weave Space with the Hunt: hunt the horizon" }
            kronik: { tr: "Uzayla avı birleştirdin; gözünün gördüğü hiçbir düşman bir daha saklanacak yer bulamadı.", en: "You fused Space with the Hunt. No enemy you could see ever found a place to hide again." }
            etkiler:
              - oz: { uzay: 100, avlanma: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "bosluk_yurur"
            etiket: { tr: "Uzay'ı Ölüm'le ör: boşlukta yürü", en: "Weave Space with Death: walk the void" }
            kronik: { tr: "Uzayla ölümü birleştirdin; dünyaların arasındaki karanlık senin koridorun oldu.", en: "You fused Space with Death. The dark between worlds became your hallway." }
            etkiler:
              - oz: { uzay: 100, olum: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { insanlik: -5, duzen: -2 }
              - iliski: { yanki: { guven: 5, korku: 3 } }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_oz_olum"
        paragraflar:
          - { tr: "Ölüm'e uzandığında sıcaklık parmak uçlarından çekiliyor. Elin soğuyor; ama ölmüyor, yalnızca dinliyor. Şehrin her yerinde bitmek üzere olan şeylerin sesini duyuyorsun: bir mum, bir köpek, bir ihtiyar.", en: "When you reach for Death, the warmth drains out of your fingertips. Your hand goes cold. It doesn't die. It just listens. All over the city you can hear the things that are about to end: a candle, a dog, an old man." }
          - { tr: "Ölüm bir sondur, ama sonlar pazarlık kabul eder. İkinci Öz, ne üzerine pazarlık edeceğini belirleyecek.", en: "Death is an ending, but endings take bargains. The second Essence decides what you'll be bargaining over." }
        secenekler:
          - id: "son_saat"
            etiket: { tr: "Ölüm'ü Zaman'la ör: son saati bil", en: "Weave Death with Time: know the last hour" }
            kronik: { tr: "Ölümle zamanı birleştirdin; herkesin son saatini bildin ve bazılarını erteledin.", en: "You fused Death with Time. You knew everyone's last hour, and you pushed some of them back." }
            etkiler:
              - oz: { olum: 100, zaman: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { yanki: { saygi: 5, guven: 3 } }
            sonraki: "yol_olusumu_son_saat"
          - id: "bosluk_yurur"
            etiket: { tr: "Ölüm'ü Uzay'la ör: boşlukta yürü", en: "Weave Death with Space: walk the void" }
            kronik: { tr: "Ölümle uzayı birleştirdin; dünyaların arasındaki karanlık senin koridorun oldu.", en: "You fused Death with Space. The dark between worlds became your hallway." }
            etkiler:
              - oz: { olum: 100, uzay: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { insanlik: -5, duzen: -2 }
              - iliski: { yanki: { guven: 5, korku: 3 } }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_oz_koruma"
        paragraflar:
          - { tr: "Koruma'ya uzandığında etrafında bir çizgi beliriyor; görünmez ama inatçı. Rüzgâr ona çarpıp ikiye bölünüyor. Çizginin içindeki her şey bir anda senin oluyor; sahip olmak anlamında değil, sorumluluk anlamında.", en: "When you reach for Warding, a line appears around you. Invisible, but stubborn. The wind hits it and splits in two. Everything inside that line is suddenly yours. Not yours to own. Yours to answer for." }
          - { tr: "Bir sınır ya yakar ya durdurur. İkinci Öz sınırının nasıl bir sınır olacağını söyleyecek.", en: "A boundary either burns or holds. The second Essence decides which kind of boundary yours will be." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Koruma'yı Ateş'le ör: yanan bir sur", en: "Weave Warding with Fire: a burning wall" }
            kronik: { tr: "Korumayla ateşi birleştirdin; arkanda kalan hiçbir şey bir daha üşümedi.", en: "You fused Warding with Fire. Nothing that stood behind you was ever cold again." }
            etkiler:
              - oz: { koruma: 100, ates: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_kor_sur"
          - id: "durmus_kalkan"
            etiket: { tr: "Koruma'yı Zaman'la ör: anı dondur", en: "Weave Warding with Time: freeze the moment" }
            kronik: { tr: "Korumayla zamanı birleştirdin; koruduğun kimseye inen darbe bir daha yere varmadı.", en: "You fused Warding with Time. No blow aimed at someone you guarded ever finished landing." }
            etkiler:
              - oz: { koruma: 100, zaman: 100 }
              - yol: "durmus_kalkan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 5, duzen: 3 }
              - iliski: { yanki: { saygi: 4, guven: 3 } }
            sonraki: "yol_olusumu_durmus_kalkan"

      - id: "yol_olusumu_oz_yikim"
        paragraflar:
          - { tr: "Yıkım'a uzandığında üstünde durduğun yer çatlıyor. Çatlak bir harita gibi yayılıyor: her yapının en zayıf noktası, her bedenin, her sözün. Bunları artık bilmeden göremeyeceksin.", en: "When you reach for Ruin, the ground under you cracks. The crack spreads like a map: the weakest point of every building, every body, every promise. You'll never be able to unsee them now." }
          - { tr: "Yıkım ya bir şeyin yerine yer açar ya da bir şeyin peşine düşer. İkinci Öz hangisi olduğunu belirleyecek.", en: "Ruin either clears space for something new or goes chasing something down. The second Essence decides which." }
        secenekler:
          - id: "kul_dogan"
            etiket: { tr: "Yıkım'ı Ateş'le ör: yak ve yeniden doğ", en: "Weave Ruin with Fire: burn down, rise again" }
            kronik: { tr: "Yıkımla ateşi birleştirdin; yaktığın her şeyin yerinde daha sert bir şey bitti.", en: "You fused Ruin with Fire. Everywhere you burned something, something harder grew back." }
            etkiler:
              - oz: { yikim: 100, ates: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -4, insanlik: -4 }
              - iliski: { yanki: { saygi: 8, korku: 3 } }
            sonraki: "yol_olusumu_kul_dogan"
          - id: "yikici_av"
            etiket: { tr: "Yıkım'ı Avlanma'yla ör: kaçış yollarını kır", en: "Weave Ruin with the Hunt: break every escape" }
            kronik: { tr: "Yıkımla avı birleştirdin; peşine düştüğün hiçbir şeyin önünde açık bir yol kalmadı.", en: "You fused Ruin with the Hunt. Nothing you went after ever had an open road in front of it again." }
            etkiler:
              - oz: { yikim: 100, avlanma: 100 }
              - yol: "yikici_av"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -6, duzen: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_yikici_av"

      - id: "yol_olusumu_oz_zaman"
        paragraflar:
          - { tr: "Zaman'a uzandığında her şey bir kare geride kalıyor. Kendi nefesinin sesi senden önce geliyor; bir martının kanat çırpışı ikiye bölünüyor. Önce ile sonra arasındaki ince çizgi parmaklarının arasında.", en: "When you reach for Time, everything slips one frame behind. You hear your own breath before you take it. A gull's wingbeat splits in two. The thin line between before and after is right there between your fingers." }
          - { tr: "Zaman üç şeyle evlenebilir: bir sonla, bir kalkanla ya da Sistem'in adını koyamadığı bir sesle. Seçimini yap.", en: "Time can marry three things: an ending, a shield, or a voice the System can't put a name to. Make your pick." }
        secenekler:
          - id: "son_saat"
            etiket: { tr: "Zaman'ı Ölüm'le ör: son saati bil", en: "Weave Time with Death: know the last hour" }
            kronik: { tr: "Zamanla ölümü birleştirdin; herkesin son saatini bildin ve bazılarını erteledin.", en: "You fused Time with Death. You knew everyone's last hour, and you pushed some of them back." }
            etkiler:
              - oz: { zaman: 100, olum: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { yanki: { saygi: 5, guven: 3 } }
            sonraki: "yol_olusumu_son_saat"
          - id: "durmus_kalkan"
            etiket: { tr: "Zaman'ı Koruma'yla ör: anı dondur", en: "Weave Time with Warding: freeze the moment" }
            kronik: { tr: "Zamanla korumayı birleştirdin; koruduğun kimseye inen darbe bir daha yere varmadı.", en: "You fused Time with Warding. No blow aimed at someone you guarded ever finished landing." }
            etkiler:
              - oz: { zaman: 100, koruma: 100 }
              - yol: "durmus_kalkan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 5, duzen: 3 }
              - iliski: { yanki: { saygi: 4, guven: 3 } }
            sonraki: "yol_olusumu_durmus_kalkan"
          - id: "yankinin_yolu"
            etiket: { tr: "Zaman'ı {npc:yanki|le} ör: döngüden geç", en: "Weave Time with {npc:yanki}: pass through the loop" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Zamanı Sistem'in tanımlayamadığı sesle birleştirdin; döngünün içinden geçen tek ses senin oldu.", en: "You fused Time with the voice the System can't define. The one voice that carries through the loop became yours." }
            etkiler:
              - oz: { zaman: 100, yanki: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { duzen: -4, insanlik: -3 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
            sonraki: "yol_olusumu_yankinin_yolu"

      - id: "yol_olusumu_oz_avlanma"
        paragraflar:
          - { tr: "Avlanma'ya uzandığında burnun keskinleşiyor, kulakların bir kurdunkine dönüyor. Şehrin içinde kaçmaya hazır her şeyi hissediyorsun: bir fare, bir hırsız, bir Kadim gözcüsü. Hepsi bir anda av oluyor.", en: "When you reach for the Hunt, your nose sharpens and your ears turn into a wolf's. You can feel everything in the city that's ready to run: a rat, a thief, an Ancient scout. All of it becomes prey at once." }
          - { tr: "Avcı ya mesafeyi yok eder ya da kaçış yolunu. İkinci Öz hangisini yapacağını söyleyecek.", en: "A hunter either erases the distance or erases the way out. The second Essence decides which." }
        secenekler:
          - id: "ufuk_avcisi"
            etiket: { tr: "Avlanma'yı Uzay'la ör: ufku avla", en: "Weave the Hunt with Space: hunt the horizon" }
            kronik: { tr: "Avla uzayı birleştirdin; gözünün gördüğü hiçbir düşman bir daha saklanacak yer bulamadı.", en: "You fused the Hunt with Space. No enemy you could see ever found a place to hide again." }
            etkiler:
              - oz: { avlanma: 100, uzay: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "yikici_av"
            etiket: { tr: "Avlanma'yı Yıkım'la ör: kaçış yollarını kır", en: "Weave the Hunt with Ruin: break every escape" }
            kronik: { tr: "Avla yıkımı birleştirdin; peşine düştüğün hiçbir şeyin önünde açık bir yol kalmadı.", en: "You fused the Hunt with Ruin. Nothing you went after ever had an open road in front of it again." }
            etkiler:
              - oz: { avlanma: 100, yikim: 100 }
              - yol: "yikici_av"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -6, duzen: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_yikici_av"

      - id: "yol_olusumu_oz_yanki"
        paragraflar:
          - { tr: "Sistem'in tanımını eksik bulduğu Öz'e uzanıyorsun ve pencerelerin bir an bozuluyor. Elinde tuttuğun şey bir ses, bir anı, bir hata; hepsi aynı anda ve hiçbiri tam olarak.", en: "You reach for the Essence the System calls incomplete, and every one of your windows glitches for a second. What you're holding is a sound, a memory, an error. All three at once, and none of them all the way." }
          - { tr: "{npc:yanki} hiç bu kadar sessiz kalmamıştı. Sonra çok alçak bir sesle: bu benim. yani bir parçası. yanına koyabileceğin tek şey zaman. geride kalan şey ancak zamanla birlikte bir şey olur.", en: "{npc:yanki} has never been this quiet. Then, very low: that's me. a piece of me, anyway. the only thing you can put next to it is time. what lingers only turns into something when it has time to linger in." }
        secenekler:
          - id: "yankinin_yolu"
            etiket: { tr: "Onu Zaman'la ör: döngüden geç", en: "Weave it with Time: pass through the loop" }
            kronik: { tr: "Sistem'in tanımlayamadığı sesi zamanla birleştirdin; döngünün içinden geçen tek ses senin oldu.", en: "You fused the voice the System can't define with Time. The one voice that carries through the loop became yours." }
            etkiler:
              - oz: { yanki: 100, zaman: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { duzen: -4, insanlik: -3 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
            sonraki: "yol_olusumu_yankinin_yolu"
          - id: "geri_cekil"
            etiket: { tr: "Elini çek; başka bir şeye uzan", en: "Pull your hand back. Reach for something else" }
            kronik: { tr: "Sistem'in tanımlayamadığı Öz'ü elinden bıraktın; {npc:yanki} bunu hiç sormadı ama hiç de unutmadı.", en: "You let go of the Essence the System can't define. {npc:yanki} never brought it up. It never forgot it, either." }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: -4, saygi: 3 } }
            sonraki: "yol_olusumu_bilinmeyen"

      - id: "yol_olusumu_bilinmeyen"
        paragraflar:
          - { tr: "Hiç tutmadığın bir şeye uzanmak, karanlıkta kızgın bir sobaya el sürmeye benziyor. Derin bir yerinden duman yükseliyor; Can çubuğun kırmızıya iniyor ve orada kalıyor.", en: "Reaching for something you've never held is like groping for a hot stove in the dark. Smoke rises from somewhere deep in you. Your HP bar drops into the red and stays there." }
          - { tr: "Ama acının altında, bir şeyin seni tanımaya başladığını hissediyorsun. Kavranmamış Öz'ler kapı aralığından bakan yabancılar gibi; içeri girmek için yalnızca davet bekliyorlar.", en: "But under the pain, you can feel something starting to recognize you. The Essences you never grasped are like strangers peering through a cracked door, just waiting for an invitation." }
          - { tr: "Sistem bir uyarı bile vermiyor. Bu, verebileceği en net uyarı.", en: "The System doesn't even throw a warning. Which is the clearest warning it could give." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Arkandakileri düşün: Ateş ve Koruma", en: "Think of who's behind you: Fire and Warding" }
            kronik: { tr: "Hiç kavramadığın ateşi ve korumayı arkandakiler için kavradın; arkanda kalan hiçbir şey bir daha üşümedi.", en: "You grasped Fire and Warding, neither of which you'd ever held, for the people behind you. Nothing that stood behind you was ever cold again." }
            etkiler:
              - oz: { ates: 100, koruma: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 3 }
            sonraki: "yol_olusumu_kor_sur"
          - id: "ufuk_avcisi"
            etiket: { tr: "Kaçanları düşün: Uzay ve Avlanma", en: "Think of the ones who run: Space and the Hunt" }
            kronik: { tr: "Hiç kavramadığın uzayı ve avı kaçanlar için kavradın; gözünün gördüğü hiçbir düşman bir daha saklanamadı.", en: "You grasped Space and the Hunt, neither of which you'd ever held, for the ones who run. No enemy you could see could ever hide again." }
            etkiler:
              - oz: { uzay: 100, avlanma: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "son_saat"
            etiket: { tr: "Kaybettiklerini düşün: Ölüm ve Zaman", en: "Think of who you've lost: Death and Time" }
            kronik: { tr: "Hiç kavramadığın ölümü ve zamanı kaybettiklerin için kavradın; herkesin son saatini bildin ve bazılarını erteledin.", en: "You grasped Death and Time, neither of which you'd ever held, for the people you'd lost. You knew everyone's last hour, and you pushed some of them back." }
            etkiler:
              - oz: { olum: 100, zaman: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -1 }
            sonraki: "yol_olusumu_son_saat"
          - id: "kul_dogan"
            etiket: { tr: "Kendi küllerini düşün: Yıkım ve Ateş", en: "Think of your own cinders: Ruin and Fire" }
            kronik: { tr: "Hiç kavramadığın yıkımı ve ateşi kendi küllerin için kavradın; yaktığın her şeyin yerinde daha sert bir şey bitti.", en: "You grasped Ruin and Fire, neither of which you'd ever held, for your own cinders. Everywhere you burned something, something harder grew back." }
            etkiler:
              - oz: { yikim: 100, ates: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, insanlik: -4 }
            sonraki: "yol_olusumu_kul_dogan"
          - id: "bosluk_yurur"
            tur: "gosteris"
            etiket: { tr: "İkisini birden, acısız tut: Uzay ve Ölüm", en: "Hold both at once, no pain: Space and Death" }
            gerekli: { stat: { wil: 220 } }
            kronik: { tr: "Hiç kavramadığın iki Öz'ü birden, acı çekmeden tuttun; dünyaların arasındaki karanlık senin koridorun oldu.", en: "You held two Essences you'd never grasped, both at once, without flinching. The dark between worlds became your hallway." }
            etkiler:
              - oz: { uzay: 100, olum: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 220
              - can: 500
              - ahlak: { insanlik: -5, duzen: -2 }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_yanki_secer"
        paragraflar:
          - { tr: "{npc:yanki} bir an hiçbir şey söylemiyor. Sonra kafanın içinde, ilk kez, iki sesin aynı anda konuştuğunu duyuyorsun: biri onun, biri sanki senin, ama senin hiç kurmadığın bir cümleyi kuruyor.", en: "For a second, {npc:yanki} says nothing. Then, for the first time ever, you hear two voices talking in your head at once. One is its voice. The other sounds like yours, except it's saying something you never said." }
          - { tr: "zaman ve ben, diyor. geride kalan şey ve onu taşıyan saat. başka hiçbir yol seni döngüden geçirmez. bu yol geçirir. ama bilmen gereken bir şey var: bu yolda kelimelerin yarısı benim olur. yarısı. pazarlık yok.", en: "time and me, it says. what lingers, and the clock that carries it. no other path gets you through the loop. this one does. but here's what you need to know: on this path, half the words are mine. half. no haggling." }
          - metin: { tr: "Sesin altındaki açlık artık saklanmıyor. Yarısı, diyor, ve bunu söylerken sanki yarısından fazlasını şimdiden almış gibi.", en: "The hunger under its voice isn't hiding anymore. Half, it says, and it says it like it's already taken more than half." }
            kosul: { bayrak: "yanki_ele_gecirdi" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Yarısı senin. Al.\"", en: "\"Half's yours. Take it.\"" }
            kronik: { tr: "Yolunun yarısını {npc:yanki|e} verdin; döngünün içinden geçen ses ikinizin sesi oldu.", en: "You gave half your Path to {npc:yanki}. The voice that carries through the loop became both of yours." }
            etkiler:
              - oz: { yanki: 100, zaman: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - bayrak: "yol_yankiya_birakildi"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 220
              - ahlak: { insanlik: -6, duzen: -3 }
              - yozlasma: 8
              - iliski: { yanki: { guven: 15, baglilik: 15 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 70 }
            sonraki: "yol_olusumu_yankinin_yolu"
          - id: "reddet"
            etiket: { tr: "\"Hayır. Kendim seçeceğim.\"", en: "\"No. I'll choose for myself.\"" }
            kronik: { tr: "{npc:yanki|in} teklifini geri çevirdin; gücün ne olursa olsun, kelimeleri senin oldu.", en: "You turned down {npc:yanki|pos} offer. Whatever your power turned out to be, the words in it were yours." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { guven: -6, saygi: 6 } }
            sonraki: "yol_olusumu_secim"

      # ---------------------------------------------------------------- Yolların doğuşu
      - id: "yol_olusumu_kor_sur"
        paragraflar:
          - { tr: "Ateş korumanın çizgisine yapışıyor ve çizgi yanmaya başlıyor; ama dışa doğru, yalnızca dışa doğru. Etrafında turuncu, yarı saydam bir sur yükseliyor. Senin tarafında havanın kokusu ekmek fırını gibi.", en: "The Fire catches on the line of the Warding and the line starts to burn. Outward. Only outward. A half-clear wall of orange rises around you, and on your side of it the air smells like a bakery." }
          - metin: { tr: "Halkadaki ilk sıradakiler sıcaklığı yüzlerinde hissediyor; bir çocuk elini surun içine uzatıyor ve hiçbir şey olmuyor, yalnızca parmakları ısınıyor. Kalabalıktan alçak bir uğultu yükseliyor.", en: "The front of the ring feels the heat on their faces. A kid sticks a hand into the wall and nothing happens; their fingers just get warm. A low murmur rolls through the crowd." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - { tr: "Surun dış yüzüne konan bir güve anında kora dönüyor. Bir sınır çizdin: içindekiler için bir ocak, dışındakiler için bir fırın.", en: "A moth lands on the outer face of the wall and turns to an ember on the spot. You've drawn a line: a hearth for everything inside, a furnace for everything out." }
          - metin: { tr: "{npc:yanki} uzun bir süre susuyor. Sonra: önceki de bunu seçmişti. ama onun suru bu kadar sıcak değildi. içeri bu kadar sıcak değildi.", en: "{npc:yanki} is quiet for a long time. Then: the last one picked this too. but their wall wasn't this warm. not on the inside." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "genislet"
            etiket: { tr: "Suru genişlet; mahalleyi içine al", en: "Push the wall out. Take in the whole block" }
            kronik: { tr: "Yolunun ilk gecesinde surunu bir mahalleye yaydın; o mahallede o kış kimse donmadı.", en: "On your Path's first night, you stretched your wall over a whole block. Nobody on that block froze that winter." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6 }
            sonraki: "yol_olusumu_son"
          - id: "dar_tut"
            etiket: { tr: "Dar tut; yalnızca seninkiler", en: "Keep it tight. Just your own" }
            kronik: { tr: "Surunu yalnızca kendi insanlarına çektin; dışarıda kalanlar bunu unutmadı.", en: "You drew your wall around your own people and nobody else. The ones left outside never forgot it." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 3 }
              - itibar: { lonca: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_kul_dogan"
        paragraflar:
          - { tr: "Önce sen yanıyorsun. Derin, kemiklerine kadar; bir an tamamen kül oluyorsun ve rüzgâr seni dağıtmak için eğiliyor. Sonra kül toplanıyor, bir araya geliyor ve ayağa kalkıyor.", en: "You burn first. Deep, down to the bone. For one second you're nothing but cinders, and the wind leans in to scatter you. Then the cinders gather, pull together, and stand up." }
          - { tr: "Yeniden kurulan beden eskisinden ağır ve sıcak. Parmaklarının arasından ince bir duman yükseliyor; yere bastığın her yerde taşlar karararak sertleşiyor.", en: "The body that rebuilds itself is heavier and hotter than the old one. Thin smoke curls up between your fingers, and everywhere you step, the stone darkens and hardens." }
          - metin: { tr: "Meydandaki halka geri çekiliyor. Biri dua ediyor, biri ağlıyor; ön sıradaki ihtiyar ise yalnızca şapkasını çıkarıyor, bir cenazede olduğu gibi.", en: "The ring in the square pulls back. Somebody's praying, somebody's crying, and the old man up front just takes off his hat, like he's at a funeral." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "{npc:yanki} neredeyse hayranlıkla: kendini yaktın ve geri geldin. Sistem bunu bir hata olarak kaydetmeye çalışıyor; kayıt da yanıyor.", en: "{npc:yanki}, almost admiring: you burned yourself down and came back. the System's trying to log it as an error. the log's on fire too." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Ateşi içine çek, dumanı söndür", en: "Pull the fire back in. Kill the smoke" }
            kronik: { tr: "Yeniden doğduğun gece dumanını içine çektin; kimse senin ne kadar yandığını bilmedi.", en: "The night you were reborn, you swallowed your own smoke. Nobody ever knew how badly you'd burned." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - gizle: 3
            sonraki: "yol_olusumu_son"
          - id: "yak"
            etiket: { tr: "Bırak yansın; Kadim gemisi görsün", en: "Let it burn. Let the Ancient ship see" }
            kronik: { tr: "Yeniden doğduğun gece alevini göğe doğru savurdun; Kadim gemisi o gece rotasını üç derece değiştirdi.", en: "The night you were reborn, you threw your flame at the sky. That night, the Ancient ship changed course by three degrees." }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -1 }
              - dikkat: 6
              - degisken: { kadim_tehdit: -3 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_ufuk_avcisi"
        paragraflar:
          - { tr: "Mesafe katlanıyor. Bir an Kule'nin tepesindesin, bir an körfezin ortasındaki şamandıranın üstünde, bir an Tepe'nin en yüksek damında; her birine yalnızca bakman yetiyor.", en: "Distance folds. One second you're on top of the Spire, the next you're standing on the buoy in the middle of the bay, the next you're on the highest roof in the Heights. All you have to do is look." }
          - { tr: "Gözünün gördüğü her yer bir adım uzakta. Kadim gemisine bakıyorsun ve aradaki mil sayısı, iki köşe arasındaki mesafe kadar anlamsızlaşıyor. Bunu biliyorsun. Onlar da biliyor artık.", en: "Anywhere you can see is one step away. You look at the Ancient ship, and the miles between you and it mean about as much as the distance across a street. You know that now. So do they." }
          - metin: { tr: "{npc:yanki}: oradan bize bakan biri şu an bardağını düşürdü. eminim. bir kadimin elinden bir şeyin düştüğünü hiç görmedim ama eminim.", en: "{npc:yanki}: somebody watching us from up there just dropped their glass. i'm sure of it. i've never seen an ancient drop anything, but i'm sure." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "adim"
            etiket: { tr: "Bir adım at; gemiye dokunup geri dön", en: "Take one step. Touch the ship and come back" }
            kronik: { tr: "Yolunun ilk gecesinde Kadim gemisinin gövdesine dokunup döndün; filonun haritalarında senin için ayrı bir işaret açıldı.", en: "On your Path's first night, you touched the Ancient ship's hull and came back. Their fleet's charts got a new marker, just for you." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - dikkat: 8
              - degisken: { kadim_tehdit: -4 }
            sonraki: "yol_olusumu_son"
          - id: "bekle"
            etiket: { tr: "Bakmakla yetin; avı ürkütme", en: "Just look. Don't spook the prey" }
            kronik: { tr: "Yolunun ilk gecesinde Kadim gemisini yalnızca izledin; o sabır, ilk vuruşun hiç beklenmediği yerden gelmesini sağladı.", en: "On your Path's first night, you only watched the Ancient ship. That patience meant your first strike came from somewhere nobody expected." }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 3
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_son_saat"
        paragraflar:
          - { tr: "Herkesin üstünde bir saat beliriyor; yalnızca senin görebildiğin, ince, beyaz rakamlar. Liman bekçisinin üstünde on bir yıl. Bir bebeğin üstünde seksen dört. Bir köpeğin üstünde dört saat.", en: "A clock appears over everyone, thin white numbers only you can see. Over the harbor watchman: eleven years. Over a baby: eighty-four. Over a dog: four hours." }
          - { tr: "Köpeğin saatine dokunuyorsun. Rakamlar bir an titriyor ve bir saat daha ekleniyor. Bedeli göğsünde, bir nefes eksik olarak kalıyor.", en: "You touch the dog's clock. The numbers shiver and one more hour ticks on. The price stays in your chest, one breath short." }
          - metin: { tr: "Sonra kendi üstüne bakıyorsun. Orada saat yok. Yalnızca bir soru işareti, yavaşça dönüyor.", en: "Then you look up at yourself. There's no clock there. Just a question mark, turning slowly." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "{npc:yanki}: ben de kendi saatimi hiç göremedim. belki bizim gibilerin saati olmuyor. belki tek bir saat var ve hepimiz onun içindeyiz.", en: "{npc:yanki}: i've never been able to see my own clock either. maybe things like us don't get one. maybe there's only one clock, and we're all inside it." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "ertele"
            etiket: { tr: "Bu gece birkaç saati daha ertele", en: "Push back a few more clocks tonight" }
            kronik: { tr: "Yolunun ilk gecesinde birkaç yabancının son saatini erteledin; içlerinden biri yıllar sonra kızına senin adını verdi.", en: "On your Path's first night, you pushed back a few strangers' last hours. Years later, one of them named a daughter after you." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - can: -300
            sonraki: "yol_olusumu_son"
          - id: "izle"
            etiket: { tr: "Saatlere dokunma; yalnızca bil", en: "Don't touch the clocks. Just know" }
            kronik: { tr: "Yolunun ilk gecesinde hiçbir saate dokunmadın; bilmenin ağırlığını tek başına taşıdın.", en: "On your Path's first night, you didn't touch a single clock. You carried the weight of knowing all by yourself." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_durmus_kalkan"
        paragraflar:
          - { tr: "Zaman korumanın çizgisinde donuyor. Bir taş atıyorsun ve taş çizgiye varınca havada kalıyor; düşmüyor, geri dönmüyor, yalnızca bekliyor.", en: "Time freezes on the line of the Warding. You toss a stone and it hangs in the air the moment it hits the line. It doesn't fall. It doesn't bounce back. It just waits." }
          - { tr: "Koruduğun şeye gelen her darbe böyle olacak: gelmek üzere, ama hiç varamadan. Dünyanın en sabırlı kalkanı.", en: "Every blow aimed at whatever you're guarding is going to be like that: about to land, and never landing. The most patient shield in the world." }
          - metin: { tr: "{npc:deniz_arman} taşın havada asılı kalışına bakıyor, sonra kendi kalkanına. \"Bütün hayatım boyunca bunu yapmaya çalıştım,\" diyor. \"Sen bir gecede yaptın.\" Kıskançlık mı, gurur mu, kendisi de bilmiyor.", en: "{npc:deniz_arman} watches the stone hanging in the air, then looks at {zamir:deniz_arman|onun} own shield. \"I've spent my whole life trying to do that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You did it in one night.\" Jealous or proud, {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't know either." }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "dondur"
            etiket: { tr: "Taşı orada bırak; anı olsun", en: "Leave the stone there. A keepsake" }
            kronik: { tr: "Yolunun doğduğu yerde bir taşı havada bıraktın; o taş yıllarca orada asılı kaldı ve insanlar ona dilek tuttu.", en: "Where your Path was born, you left a stone hanging in midair. It stayed there for years, and people made wishes on it." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3, yukselenler: 3 }
            sonraki: "yol_olusumu_son"
          - id: "birak_dussun"
            etiket: { tr: "Taşı bırak, düşsün; gösteri değil bu", en: "Let the stone drop. This isn't a show" }
            kronik: { tr: "Yolunun ilk gecesinde taşın düşmesine izin verdin; gücün, ihtiyaç olmadıkça görünmedi.", en: "On your Path's first night, you let the stone drop. Your power never showed itself unless it had to." }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 3
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_bosluk_yurur"
        paragraflar:
          - { tr: "Önünde bir kapı açılmıyor; dünyanın kendisi bir kenarından kalkıyor, perde gibi. Arkasında karanlık var, ama boş değil. Uzak dünyaların ışıkları, tozlu bir camın ardındaki sokak lambaları gibi.", en: "No door opens in front of you. The world itself just lifts up at one corner, like a curtain. Behind it is darkness, but not an empty one. The lights of faraway worlds, like streetlamps behind a dusty window." }
          - { tr: "Bir adım atıyorsun ve bir sonraki adımın Eski Şehir'in öbür ucunda yere değiyor. Arada geçtiğin koridorda soğuk bir şey yanından süzülüyor; sana bakıyor ve yol veriyor.", en: "You take a step, and your next one lands on the far side of Old Town. In the hallway you passed through, something cold drifts past you, takes a look, and gets out of your way." }
          - metin: { tr: "{npc:yanki}: orada ölü olan tek şey sen değilsin, biliyorsun. ama onlar sana yol veriyor. bunu düşünmek istemiyorum.", en: "{npc:yanki}: you're not the only dead thing in there, you know. but they make way for you. i don't want to think about that." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "koridor"
            etiket: { tr: "Koridorda biraz daha kal; dinle", en: "Stay in the hallway a little longer. Listen" }
            kronik: { tr: "Yolunun ilk gecesinde dünyaların arasındaki karanlığı dinledin; orada duyduğun fısıltıları kimseye anlatmadın.", en: "On your Path's first night, you listened to the dark between worlds. You never told anyone what you heard whispering in there." }
            etkiler:
              - ahlak: { insanlik: -3 }
              - yozlasma: 4
              - bilgi: "bosluk_fisiltisi"
            sonraki: "yol_olusumu_son"
          - id: "geri_don"
            etiket: { tr: "Hemen ışığa dön", en: "Get back to the light. Now" }
            kronik: { tr: "Yolunun ilk gecesinde karanlıktan hemen döndün; insan tarafını hep orada, ışığın önünde bıraktın.", en: "On your Path's first night, you came straight back out of the dark. You always left your human side right there, in front of the light." }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_yikici_av"
        paragraflar:
          - { tr: "Şehrin üstüne bir ağ iniyor; ama bu kez ağı ören sensin. Her sokak, her merdiven, her yarık bir çizgi. Herhangi birine bakıyorsun ve çizgi kırılıyor: oradan artık hiçbir şey kaçamaz.", en: "A net drops over the city, except this time you're the one weaving it. Every street, every stairwell, every crack is a line. You look at one and the line snaps: nothing's getting out that way ever again." }
          - { tr: "Liman'daki bir hırsız koşmaya başladığı anda nereye gideceğini biliyorsun; ve onun önündeki her yolun nasıl kırılacağını. İlk kez bir avcının değil, avın korkusunu kendi içinde duyuyorsun.", en: "The second a thief on the waterfront breaks into a run, you know exactly where he's headed, and how every road in front of him is going to break. For the first time, you feel the prey's fear from the inside instead of the hunter's thrill." }
          - metin: { tr: "{npc:yanki}: bu yol beni korkutuyor. bilmen gerek. senin önünden kaçan her şey artık bir çıkmaz sokakta. ben de dahil.", en: "{npc:yanki}: this path scares me. you should know that. everything that runs from you is in a dead end now. me included." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "hirsiz_birak"
            etiket: { tr: "Hırsızın önüne bir yol bırak", en: "Leave the thief one road open" }
            kronik: { tr: "Yolunun ilk gecesinde bir hırsıza kaçacak bir yol bıraktın; o adam bir yıl sonra senin için bir kapıyı tuttu.", en: "On your Path's first night, you left a thief one way out. A year later, that man held a door for you." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "yol_olusumu_son"
          - id: "kapat"
            etiket: { tr: "Bütün yolları kapat; sabaha kadar beklesin", en: "Close every road. Let him wait till morning" }
            kronik: { tr: "Yolunun ilk gecesinde bir hırsızı sabaha kadar bir çıkmaz sokakta beklettin; ertesi gün şehirde kimse bir şey çalmadı.", en: "On your Path's first night, you kept a thief stuck in a dead end until morning. The next day, nobody in the city stole a thing." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 4 }
              - itibar: { lonca: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_yankinin_yolu"
        paragraflar:
          - { tr: "Hiçbir şey parlamıyor, hiçbir şey yanmıyor. Yalnızca etrafındaki bütün sesler bir an gecikiyor ve ikinci kez duyuluyor: bir martı, bir dalga, kendi adın. Dünya, sana bir şeyi iki kez söylüyor.", en: "Nothing glows. Nothing burns. Every sound around you just lags for a second and plays a second time: a gull, a wave, your own name. The world is telling you everything twice." }
          - { tr: "Pencerelerin bozuluyor ve bir daha düzelmiyor. Sistem'in senin hakkındaki her satırı artık iki anlamlı: ne olduğun ve ne olacağın. Sistem bunlardan hangisinin doğru olduğunu bilmiyor.", en: "Your windows glitch and never quite come back. Every line the System has on you means two things now: what you are, and what you're going to be. The System doesn't know which one's true." }
          - metin: { tr: "{npc:yanki} kafanın içinde, ama artık bir kiracı gibi değil; bir ortak gibi: hissediyor musun? döngü. bir sonraki dönüşünde bile seni tanıyacağım. bu bir söz değil. bu bir gerçek.", en: "{npc:yanki} is in your head, but not like a roommate anymore. Like a partner: feel that? the loop. even on the next go-around, i'll know you. that's not a promise. that's just true now." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "yanki"
            nadirlik: "benzersiz"
            baslik: { tr: "[YOL: T̷ANIMSIZ]", en: "[PATH: U̷NDEFINED]" }
            satirlar:
              - { tr: "kategori yok. üst sınır yok. sahibi: iki.", en: "no category. no ceiling. owners: two." }
        secenekler:
          - id: "kabul_et"
            etiket: { tr: "Yankıyı içine al; iki kez duy", en: "Let the echo in. Hear everything twice" }
            kronik: { tr: "Döngünün sesini içine aldın; o günden sonra hiçbir şeyi yalnızca bir kez duymadın.", en: "You let the loop's voice in. From then on, you never heard anything just once." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "yol_olusumu_son"
          - id: "sinir_koy"
            etiket: { tr: "\"Benim sesim önce gelir. Hep.\"", en: "\"My voice goes first. Always.\"" }
            kronik: { tr: "Döngünün sesine bir sınır koydun; ikinizin arasında son sözü hep sen söyledin.", en: "You put a limit on the loop's voice. Between the two of you, you always had the last word." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { saygi: 8, guven: -2 } }
            sonraki: "yol_olusumu_son"

      # ---------------------------------------------------------------- Sabah
      - id: "yol_olusumu_son"
        paragraflar:
          - { tr: "Şafak sökerken gücün nihayet duruluyor. İçinde iki ateş yerine tek bir şey var artık: bir cümle, yalnızca senin kurabileceğin. Bir sonraki düşmanın onu ilk kez duyacak.", en: "As the sun comes up, the power finally settles. There aren't two fires in you anymore. There's one thing: a sentence, one only you could ever have put together. Your next enemy is going to hear it for the first time." }
          - metin: { tr: "Kule'den inerken elli katın tırmanıcıları kapı aralıklarından sana bakıyor. Kimse bir şey söylemiyor; ama aşağıya vardığında Kule Dibi'ndeki pazar susmuş, herkes yukarı bakıyor.", en: "On your way down the Spire, climbers on the fifty-somethings watch you from cracked doorways. Nobody says a word. But by the time you hit the bottom, the market at Spire Plaza has gone dead quiet and everybody's looking up." }
            kosul: { degisken_min: { yol_yeri: 1 }, degisken_max: { yol_yeri: 1 } }
          - metin: { tr: "Kordon'dan dönerken sabahın ilk balıkçıları kayıklarını suya itiyor. Biri sana bakıp haç çıkarıyor, öteki şapkasını sallıyor. Su her zamankinden sakin.", en: "On your way back from the Esplanade, the first fishermen are pushing their boats into the water. One of them crosses himself when he sees you. The other one waves his cap. The water's calmer than it's ever been." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 } }
          - metin: { tr: "Meydandaki halka sabaha kadar dağılmamış. İnsanlar yere oturmuş, battaniyelere sarınmış; sen ayağa kalktığında hepsi kalkıyor. Bu artık bir kalabalık değil. Bir tanık.", en: "The ring in the square never broke up. People are sitting on the ground wrapped in blankets, and when you stand up, every one of them stands up too. That's not a crowd anymore. That's a witness." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "Çatıdan iniyorsun ve sokakta hiçbir şey değişmemiş: ekmek kuyruğu, bir köpek, iki komşu bir su bidonu yüzünden kavga ediyor. Hiçbiri, aralarından kimin geçtiğini bilmiyor.", en: "You climb down off the roof and nothing on the street has changed: a bread line, a dog, two neighbors fighting over a water jug. None of them has any idea who just walked past." }
            kosul: { degisken_min: { yol_yeri: 4 } }
          - metin: { tr: "{npc:yanki} yorgun, neredeyse mutlu: yaptık. yani sen yaptın; ben izledim. bu sefer doğru izledim galiba.", en: "{npc:yanki}, tired, almost happy: we did it. well, you did it. i watched. i think i watched right this time." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Dünya Katmanı'nda ilk Yol oluştu.", en: "The first Path on the Earth Layer has formed." }
              - { tr: "Sahip: gizli. Konum: gizli. Sistem bu gizliliği onaylamadı.", en: "Owner: hidden. Location: hidden. The System did not approve this privacy." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sen hâlâ sen misin? Ciddi soruyorum. Cevabı duymam lazım.\"", en: "\"Are you still you? I'm serious. I need to hear you say it.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kaydını tutacağım. Biri tutmalı. Sistem tutmuyorsa ben tutarım.\"", en: "\"I'm keeping a chart on you. Somebody has to. If the System won't, I will.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bütün gece pencerelerin log'unu aldım. Yarısı okunmuyor. Yarısı... yarısı benim hiç görmediğim bir dil.\"", en: "\"I pulled logs on your windows all night. Half of it won't parse. The other half is... it's a language I've never seen.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İlk Yol, ha? Pekâlâ. İkincisi benim olacak ve seninkinden daha güzel görünecek.\"", en: "\"First Path, huh? Fine. The second one's mine, and it's gonna look better than yours.\"" }
        secenekler:
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Işığı söndür; kimse sormasın", en: "Snuff out the glow. No questions" }
            kronik: { tr: "İlk Yol'un sahibini sakladın; Küresel Duyuru'daki o 'gizli' kelimesi aylarca şehrin en büyük dedikodusu oldu.", en: "You kept the owner of the first Path a secret. That word 'hidden' in the Global Announcement was the city's favorite gossip for months." }
            etkiler:
              - gizle: 10
              - bayrak: "yol_gizlendi"
              - ahlak: { duzen: -2, insanlik: 1 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 4, max: 9 } }
            sonraki: "@akis"
          - id: "aciga"
            tur: "aciga_vur"
            etiket: { tr: "Bırak bütün şehir bilsin kimin olduğunu", en: "Let the whole city know whose it is" }
            kronik: { tr: "İlk Yol'un senin olduğunu bütün şehre duyurdun; o günden sonra Kıyıkent'te hiçbir kapı sana kapalı kalmadı.", en: "You let the whole city know the first Path was yours. From that day on, no door in Port Harlow stayed shut to you." }
            etkiler:
              - aciga_vur: true
              - bayrak: "yol_tanikli"
              - dikkat: 8
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: 6, yukselenler: 8, siginak: -2, sessiz_ag: 3 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "\"Hâlâ benim. Söz.\"", en: "\"Still me. I promise.\"" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "Yolunun doğduğu sabah {npc:deniz_arman|e} hâlâ sen olduğuna söz verdin; o söz sonuna kadar ikinizin ölçüsü oldu.", en: "The morning your Path was born, you promised {npc:deniz_arman} you were still you. That promise was how the two of you measured everything after." }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:yol_olusumu", agirlik: 40 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 5, max: 10 } }
            sonraki: "@akis"
          - id: "yanki_tesekkur"
            etiket: { tr: "{npc:yanki|e} teşekkür et", en: "Thank {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolun için {npc:yanki|e} teşekkür ettin; bir parçasının seni sevdiğini o sabah fark ettin.", en: "You thanked {npc:yanki} for your Path. That morning you realized some part of it loved you." }
            etkiler:
              - ahlak: { insanlik: -1, merhamet: 2 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 4, max: 9 } }
            sonraki: "@akis"

  # ================================================================== BÜYÜK İHANET (ana yay, gün 300)
  # Hain önceliği: Mert (mert_kadimlere_satti) → Kaya (kaya_darbe_hazirligi [B2]; kaya_devrildi yok; Kaya hayatta) →
  # Thessar (thessar_ihanete_hazir [E] ve ihanet_thessar henüz yok; iyi haber) → Deniz (deniz_yukselenlere_gitti ve hayatta) → Aras (hayatta) → yedek:
  # Sıralama'nın İkincisi. Yönlendirme: buyuk_ihanet_iz (Mert/Kaya/dışarı) → buyuk_ihanet_kule (Thessar/Deniz/üst kat) →
  # buyuk_ihanet_ellinci (Aras/İkinci). npc listesi bilerek boş: ölen bir NPC ana yayı kapatmasın.
  - id: "buyuk_ihanet"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "ihanet", "kasaba_cekirdegi"]
    gerilim: 4
    ana_yay: { gun: 300 }
    onemli: true
    kart: { tr: "Ortak Masa", en: "The Common Table" }
    sahne: "buyuk_ihanet_1"
    sahneler:
      - id: "buyuk_ihanet_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Altmış beş gün kaldı. Kadim gemisinin gölgesi bu sabah ilk kez Liman'ın tamamını örttü ve şehrin bütün kampları, entegrasyondan beri ilk kez, aynı odada oturmaya razı oldu: {yer:kasaba_cekirdegi}, ortasında nabız gibi atan mavi kristalle.", en: "Sixty-five days left. This morning the Ancient ship's shadow covered the entire waterfront for the first time, and every camp in the city agreed to sit in the same room for the first time since Integration: {yer:kasaba_cekirdegi}, with its blue crystal pulsing in the middle like a heartbeat." }
          - metin: { tr: "{npc:elif_sari} masanın başında, önünde bir yığın not; uykusuzluktan gözleri kızarmış ama sesi sakin.", en: "{npc:elif_sari} sits at the head of the table behind a stack of notes, eyes red from no sleep, voice steady anyway." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:kaya_demir} ayakta duruyor; oturmayı reddediyor, sırtı duvara dönük, iki adamı kapının iki yanında.", en: "{npc:kaya_demir} won't sit. He stands with his back to the wall and two of his people flanking the door." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:vahit} beyazlar içinde, gülümsüyor; sanki bu masa onun kehanetlerinden biriymiş ve herkes sonunda yerini bulmuş.", en: "{npc:vahit} is in white, smiling, like this table is one of his prophecies and everyone's finally found their seat." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} en köşede, dizüstünün kapağını ikide bir açıp kapatıyor; gözlerini kimseyle buluşturmuyor.", en: "{npc:mert_kilic} has the far corner, flipping his laptop open and shut over and over, not meeting anybody's eyes." }
            kosul: { npc_hayatta: "mert_kilic" }
          - { tr: "Masanın ortasında bir mühür duruyor: Kadimler'in elçilikten gönderdiği gümüş bir levha. Üstünde tek satır var, bütün dillerde aynı anda okunuyor: [Bir insan imzası yeterlidir.]", en: "In the middle of the table sits a seal: a silver plate the Ancients sent over from their embassy. There's one line on it, readable in every language at once: [One human signature is sufficient.]" }
          - metin: { tr: "{npc:yanki} kafanın içinde, alçak ve kesin: bu odada biri çoktan imzaladı. mühür değil; başka bir şey. kokusunu alıyorum.", en: "{npc:yanki}, low and sure, in your head: somebody in this room already signed. not the seal. something else. i can smell it." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[UYARI] Sadakat sapması tespit edildi", en: "[WARNING] Loyalty deviation detected" }
            satirlar:
              - { tr: "Kaynak: bilinmiyor. Kapsam: şehir. Sistem müdahale etmeyecek.", en: "Source: unknown. Scope: citywide. The System will not intervene." }
              - { tr: "Not: Sistem genelde müdahale etmez. Bunu belirtmek istedik.", en: "Note: the System generally doesn't. We just wanted that on the record." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "[ALG] Odada on dört nabız var. Biri ötekilerden üç saniye önde atıyor; bir şeyi bekleyen birinin nabzı bu.", en: "[PER] Fourteen heartbeats in this room. One of them is running three seconds ahead of the rest. That's the pulse of somebody waiting for something." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu odada kimseye sırtını dönme. Ben de dahil, tamam mı? Herkes.\"", en: "\"Don't turn your back on anybody in here. Me included, okay? Everybody.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bu masada bıçak kokusu var. Benimki değil, bu sefer.\"", en: "\"This table smells like a knife. Not mine, for once.\"" }
        secenekler:
          - id: "masa"
            etiket: { tr: "Masada kal; yüzleri oku", en: "Stay at the table. Read the faces" }
            kronik: { tr: "İhanet gecesi masadan kalkmadın; kim olursa olsun, seni ilk görecek kişi o oldu.", en: "On the night of the betrayal, you never left the table. Whoever it was, you were the first thing they saw." }
            etkiler:
              - ahlak: { duzen: 3 }
              - degisken: { ihanet_yaklasim: 1 }
            sonraki: "buyuk_ihanet_iz"
          - id: "nabiz"
            tur: "gosteris"
            etiket: { tr: "On dört nabzı tek tek say", en: "Count all fourteen heartbeats, one by one" }
            gerekli: { stat: { per: 220 } }
            kronik: { tr: "İhanet gecesi odadaki her nabzı saydın; hain daha ayağa kalkmadan kim olduğunu biliyordun.", en: "On the night of the betrayal, you counted every pulse in the room. You knew who it was before they ever stood up." }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - degisken: { ihanet_yaklasim: 2 }
              - xp_seviye: 20
            sonraki: "buyuk_ihanet_iz"
          - id: "surlar"
            etiket: { tr: "Masayı bırak; bayrağının altındakilerle surlara çık", en: "Leave the table. Take your banner to the walls" }
            goster: { ordu_min: 1 }
            kronik: { tr: "İhanet gecesi masayı bırakıp ordunla surlara çıktın; o gece şehrin dışından hiçbir şey içeri giremedi.", en: "On the night of the betrayal, you left the table and took your army to the walls. Nothing from outside got into the city that night." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { ihanet_yaklasim: 3, hayatta_kalan: 1 }
            sonraki: "buyuk_ihanet_iz"
          - id: "yanki_iz"
            etiket: { tr: "{npc:yanki|e} kokunun izini sürdür", en: "Have {npc:yanki} follow the scent" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "İhaneti {npc:yanki|in} burnuyla buldun; o geceden sonra ona bir av köpeği gibi güvendin.", en: "You tracked the betrayal with {npc:yanki|pos} nose. After that night, you trusted it like a bloodhound." }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { ihanet_yaklasim: 4 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            sonraki: "buyuk_ihanet_iz"
          - id: "yumruk"
            tur: "aciga_vur"
            etiket: { tr: "Masaya yumruğunu vur: \"Hain kim?\"", en: "Slam the table: \"Who's the rat?\"" }
            kronik: { tr: "İhanet gecesi masaya yumruğunu vurup haini çağırdın; masa ikiye bölündü ve o gece kimse bir daha oturmadı.", en: "On the night of the betrayal, you slammed the table and called the traitor out. The table split in half, and nobody sat back down that night." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -2, merhamet: -1 }
              - degisken: { ihanet_yaklasim: 5 }
            sonraki: "buyuk_ihanet_iz"

      - id: "buyuk_ihanet_iz"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Çekirdeğin ışığı bir kez sönüp yanıyor. Sonra bir kez daha. Odadaki herkes aynı anda nefesini tutuyor, çünkü Çekirdek entegrasyondan beri hiç titrememişti.", en: "The Core's light goes out and comes back. Then again. Everyone in the room holds their breath at the same moment, because the Core hasn't so much as flickered since Integration." }
          - metin: { tr: "Bu sefer önce sen görüyorsun: köşedeki nabız hızlanıyor, sonra bir el masanın altında, bir şeyi çoktan başlatmış birinin sakinliğiyle bir düğmeye basıyor.", en: "This time you see it first: the pulse in the corner speeds up, and then a hand under the table presses a button with the calm of somebody who started this a long time ago." }
            kosul: { degisken_min: { ihanet_yaklasim: 2 }, degisken_max: { ihanet_yaklasim: 2 } }
          - metin: { tr: "Telsizin cızırdıyor: surlardaki nöbetçilerin. \"Dışarıda bir şey yok,\" diyor bir ses, şaşkın. \"Hiçbir şey yaklaşmıyor. Sorun... içeride galiba.\"", en: "Your radio crackles. The sentries on the walls. \"Nothing out here,\" a voice says, confused. \"Nothing's coming at us. I think the problem's... inside.\"" }
            kosul: { degisken_min: { ihanet_yaklasim: 3 }, degisken_max: { ihanet_yaklasim: 3 } }
          - metin: { tr: "{npc:yanki} kokuyu buluyor ve sesi bir tazı gibi geriliyor: işte. işte orada. senin de görmeni istiyorum, çünkü benim söylediğime inanmayacaksın.", en: "{npc:yanki} finds the scent, and its voice goes taut as a hound's: there. right there. i want you to see it yourself, because you're not going to believe me." }
            kosul: { degisken_min: { ihanet_yaklasim: 4 }, degisken_max: { ihanet_yaklasim: 4 } }
          - metin: { tr: "Yumruğunun bıraktığı çatlak hâlâ masada ve kimse oturmuyor. Sorunun cevabı, sorulduğu andan beri odada dolaşıyor; şimdi bir yere iniyor.", en: "The crack your fist left is still in the table, and nobody's sitting. The answer to your question has been circling the room since you asked it. Now it's landing." }
            kosul: { degisken_min: { ihanet_yaklasim: 5 } }
          - metin: { tr: "Odadaki bütün telsizler aynı anda cızırdamaya başlıyor: üç kısa, bir uzun. Sessiz Ağ'ın işareti; ama ritmi yanlış, bir insan elinin değil, ölçülü ve soğuk bir makinenin ritmi.", en: "Every radio in the room starts crackling at once: three short, one long. The Quiet Network's signal. But the rhythm's wrong. That's not a human hand. It's the cold, measured beat of a machine." }
            kosul: { bayrak: "mert_kadimlere_satti" }
          - metin: { tr: "{npc:mert_kilic|in} köşesi boş. Dizüstü masanın üstünde açık kalmış; ekranda tek satır yanıp sönüyor: [Aktarım tamamlandı: 312 kayıt.]", en: "{npc:mert_kilic|pos} corner is empty. His laptop's still open on the table, one line blinking on the screen: [Transfer complete: 312 records.]" }
            kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" }
          - metin: { tr: "Ölü bir adamın sesi telsizlerden yükseliyor; kayıtlı, sakin, tanıdık: \"Yetki kodu: sıfır, yedi, kırmızı. Arşivi açın.\" {npc:mert_kilic} öldü; ama anahtarlarını çoktan birine vermiş.", en: "A dead man's voice comes out of the radios. Recorded, calm, familiar: \"Authorization: zero, seven, red. Open the archive.\" {npc:mert_kilic} is dead. But he handed his keys to somebody first." }
            kosul: { bayrak: "mert_kadimlere_satti", npc_olu: "mert_kilic" }
          - metin: { tr: "Koridordan postal sesleri geliyor; düzenli, adım adım. Kapıdaki iki adam kapıları içeriden kapatıyor ve sürgüyü çekiyor. {npc:kaya_demir} masaya dönüyor, hiç acele etmeden.", en: "Boots in the corridor. Steady, in step. The two men at the door swing the doors shut from inside and throw the bolt. {npc:kaya_demir} turns back to the table, in no hurry at all." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], bayrak: "kaya_darbe_hazirligi", npc_hayatta: "kaya_demir" }
          - metin: { tr: "Sonra uzaktan bir boru sesi: Kule Dibi'nin alarmı. Odadaki herkes birbirine bakıyor ve aynı şeyi anlıyor: ihanet bu masada değil. Bu masa yalnızca dikkatleri toplamak içinmiş.", en: "Then, far off, a horn: the Spire Plaza alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: "mert_kadimlere_satti", bayrak: "kaya_devrildi" }
          - metin: { tr: "Sonra uzaktan bir boru sesi: Kule Dibi'nin alarmı. Odadaki herkes birbirine bakıyor ve aynı şeyi anlıyor: ihanet bu masada değil. Bu masa yalnızca dikkatleri toplamak içinmiş.", en: "Then, far off, a horn: the Spire Plaza alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], npc_olu: "kaya_demir" }
          - metin: { tr: "Sonra uzaktan bir boru sesi: Kule Dibi'nin alarmı. Odadaki herkes birbirine bakıyor ve aynı şeyi anlıyor: ihanet bu masada değil. Bu masa yalnızca dikkatleri toplamak içinmiş.", en: "Then, far off, a horn: the Spire Plaza alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi", "kaya_darbe_hazirligi"], npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "mert"
            etiket: { tr: "Telsiz sinyalinin peşine düş", en: "Chase down the radio signal" }
            goster: { bayrak: "mert_kadimlere_satti" }
            kronik: { tr: "İhanet gecesi Sessiz Ağ'ın bozulmuş sinyalini takip ettin; o sinyalin sonunda bir dost vardı.", en: "On the night of the betrayal, you followed the Quiet Network's poisoned signal. At the end of it was a friend." }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "ihanet_mert"
            sonraki: "ihanet_mert_1"
          - id: "kaya_a"
            etiket: { tr: "Kapıya dön; {npc:kaya_demir|e} bak", en: "Turn to the door. Look at {npc:kaya_demir}" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], bayrak: "kaya_darbe_hazirligi", npc_hayatta: "kaya_demir" }
            kronik: { tr: "İhanet gecesi sürgülenen kapıya döndün ve sana silahını ilk öğreten adamla yüz yüze geldin.", en: "On the night of the betrayal, you turned to the bolted door and came face-to-face with the man who taught you to hold a weapon." }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "ihanet_kaya"
            sonraki: "ihanet_kaya_1"
          - id: "kule_a"
            etiket: { tr: "Alarmın geldiği yere koş: Kule Dibi", en: "Run for the alarm: Spire Plaza" }
            goster: { bayrak_yok: "mert_kadimlere_satti", bayrak: "kaya_devrildi" }
            kronik: { tr: "İhanet gecesi masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "On the night of the betrayal, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"
          - id: "kule_b"
            etiket: { tr: "Alarmın geldiği yere koş: Kule Dibi", en: "Run for the alarm: Spire Plaza" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], npc_olu: "kaya_demir" }
            kronik: { tr: "İhanet gecesi masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "On the night of the betrayal, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"
          - id: "kule_c"
            etiket: { tr: "Alarmın geldiği yere koş: Kule Dibi", en: "Run for the alarm: Spire Plaza" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi", "kaya_darbe_hazirligi"], npc_hayatta: "kaya_demir" }
            kronik: { tr: "İhanet gecesi masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "On the night of the betrayal, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"

      - id: "buyuk_ihanet_kule"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule Dibi'nin pazarı yarı yarıya boşalmış; tezgâhlar devrilmiş, bir çocuk ağlayarak annesini arıyor. Herkes yukarı bakıyor; körfezin üstündeki Kadim gemisinden bir ışık sütunu meydana iniyor.", en: "The Spire Plaza market is half empty, stalls knocked over, a kid crying for his mom. Everybody's looking up. A column of light is coming down from the Ancient ship over the bay, straight into the square." }
          - metin: { tr: "Işığın altında, meydanın tam ortasında, {npc:thessar} diz çökmüş duruyor. Cübbesi yırtık, damarlarından gümüş renkli bir şey sızıyor. Seni görünce ilk kez, bir insanın önünde, başını eğiyor.", en: "Under the light, dead center of the square, {npc:thessar} is down on one knee. His robe's torn, and something silver is leaking from his veins. When he sees you, for the first time ever, he bows his head to a human." }
            kosul: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "\"Kendi ırkıma ihanet etmeye geldim,\" diyor, sesi her zamanki gibi kibar ve kusursuz. \"Bunu daha önce kimse yapmadı. Biraz acele edersen sonuncusu da olmam.\"", en: "\"I've come to betray my own kind,\" he says, voice as polite and flawless as ever. \"No one has ever done it before. If you hurry, I may not be the last.\"" }
            kosul: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "Işık sütunu boş bir meydana iniyor; bir şey arıyor, bulamıyor ve geri çekiliyor. Kadimler bu gece birini bekliyordu. O kişi buraya gelmedi; çünkü onun işi başka yerde.", en: "The column of light hits an empty square, searches for something, doesn't find it, and pulls back. The Ancients were expecting someone tonight. That someone didn't come here, because their job is somewhere else." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir" }
          - metin: { tr: "Işık sütunu boş bir meydana iniyor; bir şey arıyor, bulamıyor ve geri çekiliyor. Kadimler bu gece birini bekliyordu. O kişi buraya gelmedi; çünkü onun işi başka yerde.", en: "The column of light hits an empty square, searches for something, doesn't find it, and pulls back. The Ancients were expecting someone tonight. That someone didn't come here, because their job is somewhere else." }
            kosul: { bayrak: ["thessar_ihanete_hazir", "ihanet_thessar"] }
          - metin: { tr: "Tepe'den bir ilahi yükseliyor. Yüzlerce ses, aynı ezgi, ritmik ve buyurgan. Tepe Mahallesi'nin yokuşunda beyaz cüppeli bir kalabalık meşaleler taşıyor; aralarında iple bağlanmış insanlar var.", en: "A hymn rises from the Heights. Hundreds of voices, one tune, rhythmic and commanding. Up the slope, a crowd in white robes carries torches, and in the middle of them are people tied together with rope." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Tepe'den bir ilahi yükseliyor. Yüzlerce ses, aynı ezgi, ritmik ve buyurgan. Tepe Mahallesi'nin yokuşunda beyaz cüppeli bir kalabalık meşaleler taşıyor; aralarında iple bağlanmış insanlar var.", en: "A hymn rises from the Heights. Hundreds of voices, one tune, rhythmic and commanding. Up the slope, a crowd in white robes carries torches, and in the middle of them are people tied together with rope." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kalabalığın başında, kalkanı içinden yanan, gözleri başka bir şeye dönmüş tanıdık bir yüz yürüyor: {npc:deniz_arman}.", en: "At the head of the crowd, shield burning from the inside, eyes turned toward something else, walks a face you know: {npc:deniz_arman}." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kalabalığın başında, kalkanı içinden yanan, gözleri başka bir şeye dönmüş tanıdık bir yüz yürüyor: {npc:deniz_arman}.", en: "At the head of the crowd, shield burning from the inside, eyes turned toward something else, walks a face you know: {npc:deniz_arman}." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_hayatta: "deniz_arman" }
          - metin: { tr: "Sonra Kule'nin gövdesinde, çok yukarıda, bir kapı açılıyor; ellinci katın hizasında. Dışarıdan açılmış gibi duruyor, ama dışarıda kimse yok. Kapıyı açan, içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak_yok: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir"] }
          - metin: { tr: "Sonra Kule'nin gövdesinde, çok yukarıda, bir kapı açılıyor; ellinci katın hizasında. Dışarıdan açılmış gibi duruyor, ama dışarıda kimse yok. Kapıyı açan, içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak: ["thessar_ihanete_hazir", "ihanet_thessar"], bayrak_yok: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Sonra Kule'nin gövdesinde, çok yukarıda, bir kapı açılıyor; ellinci katın hizasında. Dışarıdan açılmış gibi duruyor, ama dışarıda kimse yok. Kapıyı açan, içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_olu: "deniz_arman" }
          - metin: { tr: "Sonra Kule'nin gövdesinde, çok yukarıda, bir kapı açılıyor; ellinci katın hizasında. Dışarıdan açılmış gibi duruyor, ama dışarıda kimse yok. Kapıyı açan, içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_olu: "deniz_arman" }
          - metin: { tr: "{npc:yanki} kısık bir sesle: o kapı ancak bir insan eliyle açılır. Kule bunu bize ilk günden söyledi.", en: "{npc:yanki}, hushed: that door only opens to a human hand. the Spire told us that on day one." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "yanki_bagi" }
          - metin: { tr: "{npc:yanki} kısık bir sesle: o kapı ancak bir insan eliyle açılır. Kule bunu bize ilk günden söyledi.", en: "{npc:yanki}, hushed: that door only opens to a human hand. the Spire told us that on day one." }
            kosul: { bayrak: ["yanki_bagi", "thessar_ihanete_hazir", "ihanet_thessar"] }
        secenekler:
          - id: "thessar"
            etiket: { tr: "{npc:thessar|in} yanına koş", en: "Run to {npc:thessar}" }
            goster: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
            kronik: { tr: "İhanet gecesi kendi ırkına sırtını dönen Kadim'in yanına koştun; tarih o gece bir çatlak verdi.", en: "On the night of the betrayal, you ran to the Ancient who had turned his back on his own kind. History cracked a little that night." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "ihanet_thessar"
            sonraki: "ihanet_thessar_1"
          - id: "deniz"
            etiket: { tr: "Beyaz cüppelerin peşinden Tepe'ye tırman", en: "Chase the white robes up into the Heights" }
            goster: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
            kronik: { tr: "İhanet gecesi beyaz cüppelerin peşinden Tepe'ye tırmandın; kalabalığın başında en eski dostun yürüyordu.", en: "On the night of the betrayal, you chased the white robes up into the Heights. Your oldest friend was leading the crowd." }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "ihanet_deniz"
            sonraki: "ihanet_deniz_1"
          - id: "deniz_2"
            etiket: { tr: "Beyaz cüppelerin peşinden Tepe'ye tırman", en: "Chase the white robes up into the Heights" }
            goster: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_hayatta: "deniz_arman" }
            kronik: { tr: "İhanet gecesi beyaz cüppelerin peşinden Tepe'ye tırmandın; kalabalığın başında en eski dostun yürüyordu.", en: "On the night of the betrayal, you chased the white robes up into the Heights. Your oldest friend was leading the crowd." }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "ihanet_deniz"
            sonraki: "ihanet_deniz_1"
          - id: "kat_a"
            etiket: { tr: "Kule'ye gir; ellinci kata çık", en: "Get in the Spire. Up to the fiftieth floor" }
            goster: { bayrak_yok: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir"] }
            kronik: { tr: "İhanet gecesi Kule'nin ellinci katına çıktın; kapıyı içeriden açan eli orada buldun.", en: "On the night of the betrayal, you climbed to the Spire's fiftieth floor. That's where you found the hand that opened the door from inside." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "buyuk_ihanet_ellinci"
          - id: "kat_a_2"
            etiket: { tr: "Kule'ye gir; ellinci kata çık", en: "Get in the Spire. Up to the fiftieth floor" }
            goster: { bayrak: ["thessar_ihanete_hazir", "ihanet_thessar"], bayrak_yok: "deniz_yukselenlere_gitti" }
            kronik: { tr: "İhanet gecesi Kule'nin ellinci katına çıktın; kapıyı içeriden açan eli orada buldun.", en: "On the night of the betrayal, you climbed to the Spire's fiftieth floor. That's where you found the hand that opened the door from inside." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "buyuk_ihanet_ellinci"
          - id: "kat_b"
            etiket: { tr: "Kule'ye gir; ellinci kata çık", en: "Get in the Spire. Up to the fiftieth floor" }
            goster: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_olu: "deniz_arman" }
            kronik: { tr: "İhanet gecesi Kule'nin ellinci katına çıktın; kapıyı içeriden açan eli orada buldun.", en: "On the night of the betrayal, you climbed to the Spire's fiftieth floor. That's where you found the hand that opened the door from inside." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "buyuk_ihanet_ellinci"
          - id: "kat_b_2"
            etiket: { tr: "Kule'ye gir; ellinci kata çık", en: "Get in the Spire. Up to the fiftieth floor" }
            goster: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_olu: "deniz_arman" }
            kronik: { tr: "İhanet gecesi Kule'nin ellinci katına çıktın; kapıyı içeriden açan eli orada buldun.", en: "On the night of the betrayal, you climbed to the Spire's fiftieth floor. That's where you found the hand that opened the door from inside." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "buyuk_ihanet_ellinci"

      - id: "buyuk_ihanet_ellinci"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci kata tırmanmak birkaç ay önce bütün bir gün sürerdi. Bu gece kırk saniye sürüyor. Kule'nin içindeki canavarlar seni görünce duvarlara yapışıp yol veriyor.", en: "Climbing to the fiftieth floor used to take a whole day, a few months back. Tonight it takes forty seconds. The monsters inside the Spire see you coming and flatten themselves against the walls to let you by." }
          - { tr: "Çok-evren geçidinin önündeki salon yağmalanmış; nöbetçiler bayıltılmış ya da daha kötüsü. Geçit sonuna kadar açık ve arkasından Kadim öncüleri sızıyor; aceleyle değil, davet edilmiş gibi.", en: "The hall in front of the multiverse gate has been ransacked, the guards knocked out or worse. The gate's wide open, and Ancient vanguard troops are filing through it. Not in a rush. Like they were invited." }
          - metin: { tr: "Geçidin hemen önünde, sırtı sana dönük, siyah ceketli biri duruyor. Başında, onun olmayan bir taç var: Kadim işçiliği, ince, gümüş ve ödünç. Arkasını dönmeden konuşuyor: \"Sen de hızlısın, ha? Bu sefer ben daha hızlıyım.\"", en: "Right in front of the gate, back to you, stands somebody in a black jacket. On his head is a crown that isn't his: Ancient work, thin, silver, and borrowed. He talks without turning around. \"You're fast too, huh? This time I'm faster.\"" }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:aras_kurt|in} yeri boş. Ölümünden beri Küresel Sıralama'da onun yerine biri tırmandı; kimse adını öğrenmeye zahmet etmedi, herkes ona yalnızca sırasıyla seslendi: İkinci. Şimdi geçidin önünde o duruyor, başında Kadim işi gümüş bir taç.", en: "{npc:aras_kurt|pos} spot is empty. Since he died, somebody else climbed into it on the Global Ranking. Nobody bothered to learn her name; everybody just called her by her rank: Number Two. Now she's the one standing in front of the gate, a silver crown of Ancient make on her head." }
            kosul: { npc_olu: "aras_kurt" }
        secenekler:
          - id: "aras"
            etiket: { tr: "Ceketin sahibine seslen", en: "Call out to the man in the jacket" }
            goster: { npc_hayatta: "aras_kurt" }
            kronik: { tr: "İhanet gecesi Kule'nin ellinci katında ebedi rakibinle yüzleştin; başındaki taç onun değildi.", en: "On the night of the betrayal, you faced your lifelong rival on the Spire's fiftieth floor. The crown on his head wasn't his." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "ihanet_aras"
            sonraki: "ihanet_aras_1"
          - id: "ikinci"
            etiket: { tr: "Taçlı kadına yaklaş", en: "Walk toward the woman in the crown" }
            goster: { npc_olu: "aras_kurt" }
            kronik: { tr: "İhanet gecesi Sıralama'nın İkincisi'yle yüzleştin; adını hiç bilmediğin biri şehri satmıştı.", en: "On the night of the betrayal, you faced the Ranking's Number Two. Somebody whose name you never knew had sold the city." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "ihanet_ikinci_sira"
            sonraki: "ihanet_ikinci_1"

      # ---------------------------------------------------------------- Hain: Mert (Sessiz Ağ satıldı)
      - id: "ihanet_mert_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sinyal seni Eski Şehir'in altındaki eski telefon santraline götürüyor: Sessiz Ağ'ın arşivi, üç kat aşağıda, duvarları kurşun levhalarla kaplı bir oda. Aylarca buranın yerini yalnızca on iki kişi bildi.", en: "The signal takes you under Old Town to the old telephone exchange: the Quiet Network's archive, three floors down, in a room lined with lead sheeting. For months, exactly twelve people knew this place existed." }
          - { tr: "Kapı ardına kadar açık. Radyocular yerde; kulaklarından ince bir kan sızıyor, gözleri açık ama hiçbir şey görmüyor. Rafların arasında üç uzun, yüzsüz, gümüş figür sürücüleri tek tek söküyor; acele etmeden, bir kütüphanecinin özeniyle.", en: "The door's wide open. The radio crew is on the floor, thin blood trickling from their ears, eyes open and seeing nothing. Between the racks, three tall, faceless silver figures are pulling drives one at a time. No rush. The care of a librarian." }
          - metin: { tr: "{npc:mert_kilic} konsolun başında, ekrana eğilmiş; parmakları klavyenin üstünde donmuş. Sana dönüyor ve yüzü ıslak: \"Bana kodu gösterdiler,\" diyor. \"Gerçek kodu. Kaynağı. Tek istedikleri bir liste.\"", en: "{npc:mert_kilic} is hunched over the console, fingers frozen above the keys. He turns toward you, face wet. \"They showed me the code,\" he says. \"The real code. The source. All they wanted was a list.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Konsolun başında kimse yok; yalnızca bir kayıt cihazı ve döngüde dönen tanıdık bir ses: \"Yetki kodu: sıfır, yedi, kırmızı.\" {npc:mert_kilic} anahtarlarını ölmeden önce teslim etmiş; kime ve neden, artık kimse soramaz.", en: "Nobody's at the console. Just a recorder and a familiar voice on a loop: \"Authorization: zero, seven, red.\" {npc:mert_kilic} handed over his keys before he died. Who to, and why, nobody can ask him now." }
            kosul: { npc_olu: "mert_kilic" }
          - metin: { tr: "Onu bu masaya sen oturtmuştun. Kadim sözcüsüyle el sıkıştığın gün, bu gecenin geleceğini biliyordun; yalnızca bu kadar çabuk geleceğini bilmiyordun.", en: "You're the one who put him at that table. The day you shook hands with the Ancient spokesman, you knew this night was coming. You just didn't know it'd come this fast." }
            kosul: { bayrak: "mert_oyuncu_satti" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hükümsüzleştirici ×3 · Kadim öncüsü", en: "[ANALYSIS] Nullifier ×3 · Ancient vanguard" }
            satirlar:
              - { tr: "Görev: veri toplama. Tanık politikası: sıfır.", en: "Mission: data retrieval. Witness policy: zero." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Liste 312 isim. Sessiz Ağ'ın her üyesi, her muhbiri, Sistem'i okumaya çalışmış her insan. Kadimler'in hasat sırası bu.", en: "[PER] The list is 312 names. Every Quiet Network member, every informant, every human who ever tried to read the System. That's the Ancients' harvest order." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "listede senin adın yok. bunu fark ettin mi? senin adın yok.", en: "your name isn't on the list. did you notice that? yours isn't on it." }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Gümüş figürlere dal", en: "Go straight at the silver figures" }
            kronik: { tr: "Sessiz Ağ'ın arşivinde Kadim öncülerine daldın; o gece bir kütüphane savaş alanına döndü.", en: "In the Quiet Network's archive, you charged the Ancient vanguard. That night, a library became a battlefield." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "civile"
            tur: "gosteris"
            etiket: { tr: "Üçünü birden duvara çivile", en: "Pin all three to the wall at once" }
            gerekli: { stat: { str: 260 } }
            kronik: { tr: "Kadim öncülerini tek hamlede duvara çiviledin; Kadimler raporlarına o odayı 'ölçülemez' diye yazdı.", en: "You pinned the Ancient vanguard to the wall in a single move. The Ancients wrote that room up in their reports as 'unmeasurable.'" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 40
              - dikkat: 4
            sonraki: "ihanet_mert_2"
          - id: "neden"
            etiket: { tr: "\"Neden, {npc:mert_kilic}?\"", en: "\"Why, {npc:mert_kilic}?\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Kadim öncülerinin ortasında {npc:mert_kilic|e} neden diye sordun; cevabı hayatın boyunca kulağında kaldı.", en: "Surrounded by the Ancient vanguard, you asked {npc:mert_kilic} why. You heard his answer for the rest of your life." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { mert_kilic: { guven: 5 } }
            sonraki: "ihanet_mert_konus"
          - id: "kayit"
            etiket: { tr: "Önce ölü adamın sesini sustur", en: "Shut the dead man's voice up first" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|in} kayıtlı sesini parçaladın; Sessiz Ağ onu bir hain olarak değil, bir kurban olarak andı.", en: "You smashed the recording of {npc:mert_kilic|pos} voice. The Quiet Network remembered him as a victim, not a traitor." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - itibar: { sessiz_ag: 3 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_konus"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "\"Üç yüz on iki isim,\" diyor {npc:mert_kilic}. \"Biliyorum. Hepsini ben yazdım, kimin hangi gece hangi frekansı dinlediğine kadar.\" Gözlüğünü çıkarıp siliyor, takıyor, yine çıkarıyor.", en: "\"Three hundred twelve names,\" {npc:mert_kilic} says. \"I know. I wrote every one of them down, right down to who listened to what frequency on which night.\" He takes his glasses off, wipes them, puts them back on, takes them off again." }
          - { tr: "\"Bütün hayatım boyunca bir duvara baktım. Onlar duvarın arkasını gösterdi. Kodun ilk satırlarını. Sen olsan...\" Cümleyi bitirmiyor. \"Bir de korkuttular. Listede senin adın olmayacağına söz verdiler. Sadece senin.\"", en: "\"My whole life, I've been staring at a wall. They showed me what's behind it. The first lines of the code. If you'd been...\" He doesn't finish. \"And they scared me. They promised your name wouldn't be on the list. Just yours.\"" }
          - { tr: "Gümüş figürler aktarımın bitmesini bekliyor; ilerleme çubuğu yüzde seksen dokuzda. Sana bakmıyorlar bile; bir biçerdöverin bir korkuluğa bakmayacağı gibi.", en: "The silver figures are waiting for the transfer to finish. The progress bar reads eighty-nine percent. They don't even look at you. The same way a combine doesn't bother looking at a scarecrow." }
        secenekler:
          - id: "geri_cek"
            etiket: { tr: "\"Aktarımı geri çek. Şimdi.\"", en: "\"Pull the transfer. Right now.\"" }
            gerekli: { iliski_min: { mert_kilic: { guven: 30 } } }
            kronik: { tr: "{npc:mert_kilic|e} aktarımı geri çektirdin; listedeki üç yüz on iki kişiden hiçbiri o yıl Kadimler'in kapısını çalmadı.", en: "You got {npc:mert_kilic} to pull the transfer. Not one of those three hundred twelve people got a knock on the door from the Ancients that year." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 3, kadim_tehdit: -3 }
              - iliski: { mert_kilic: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "mert_kilic", id: "olay:buyuk_ihanet", agirlik: 50 }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "bitti"
            etiket: { tr: "\"Konuşma bitti.\" Gümüşlere dön", en: "\"We're done talking.\" Turn on the silver ones" }
            kronik: { tr: "{npc:mert_kilic|in} açıklamasını yarıda kestin; o gece ona bir daha hiçbir şey sormadın.", en: "You cut {npc:mert_kilic|pos} explanation short. You never asked him anything again that night." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { mert_kilic: { korku: 8 } }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }
          - id: "bitirsin"
            etiket: { tr: "Aktarım bitsin; listeyi sonra geri alırsın", en: "Let it finish. You'll take the list back later" }
            kronik: { tr: "Listenin Kadimler'e gitmesine izin verdin; geri almak, bedelini ödeyenlere hiçbir şey ifade etmedi.", en: "You let the list go to the Ancients. Taking it back later meant nothing to the people who paid for it." }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 2 }
              - bayrak: "mert_listesi_teslim"
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 4 }
              - iliski: { mert_kilic: { guven: -5, korku: 5 } }
              - savas: { dusmanlar: ["kadim_hukumsuzlestirici@oyuncu+2", "kadim_hukumsuzlestirici@oyuncu"], ortam: ["dar_gecit"], kazan: "ihanet_mert_2", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_2"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Son gümüş figür yere iniyor ve yüzsüz başı rafların arasında yuvarlanıyor. Bir an sessizlik. Sonra odanın kurşun duvarları bir çan gibi çınlıyor; içeri bir şey giriyor, sesleri yutarak.", en: "The last silver figure goes down, its faceless head rolling between the racks. A second of silence. Then the room's lead walls ring like a bell, and something comes in, swallowing every sound on its way." }
          - { tr: "Uzun, ince, saydam; içinde dönen, hiçbir şeyi yansıtmayan bir boşluk. Telsizler ölüyor. Kendi kalp atışını bile duyamıyorsun. Kadimler tanıkları böyle temizliyor.", en: "Tall, thin, see-through, with a hollow turning inside it that doesn't reflect a thing. The radios die. You can't even hear your own heartbeat. This is how the Ancients clean up witnesses." }
          - metin: { tr: "{npc:mert_kilic} konsolun arkasına çömelmiş, iki eliyle kulaklarını kapatıyor. Dudakları kıpırdıyor; bir özür, belki bir dua. Sesi yok.", en: "{npc:mert_kilic} is crouched behind the console, both hands over his ears. His lips are moving. An apology, maybe a prayer. No sound comes out." }
            kosul: { npc_hayatta: "mert_kilic" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Sessizlik Avcısı · A kademesi muhafız", en: "[ANALYSIS] Silencer · A-Grade enforcer" }
            satirlar:
              - { tr: "Sesi, kaydı ve hafızayı siler. Senin hafızanı silemiyor. Neden olduğunu henüz bilmiyor.", en: "Erases sound, records, and memory. It can't erase yours. It hasn't figured out why yet." }
        secenekler:
          - id: "karsisina"
            etiket: { tr: "Karşısına dik", en: "Plant yourself in front of it" }
            kronik: { tr: "Sessizlik Avcısı'nın karşısına dikildin; o gece Eski Şehir'in altında sesin yeniden doğduğu söylendi.", en: "You stood up to the Silencer. They say sound was reborn under Old Town that night." }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+4"], ortam: ["dar_gecit", "karanlik"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }
          - id: "mert_arkana"
            etiket: { tr: "{npc:mert_kilic|i} arkana al ve öyle dövüş", en: "Get {npc:mert_kilic} behind you, then fight" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Seni satan adamı arkana alıp dövüştün; {npc:mert_kilic} bunu hiç unutmadı ve bir daha hiç kimseyi satmadı.", en: "You put the man who sold you out behind you and fought. {npc:mert_kilic} never forgot it, and he never sold out anyone again." }
            etkiler:
              - ahlak: { merhamet: 5 }
              - iliski: { mert_kilic: { guven: 15, baglilik: 12 } }
              - hafiza: { npc: "mert_kilic", id: "olay:buyuk_ihanet", agirlik: 70 }
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+4"], ortam: ["dar_gecit", "karanlik"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }
          - id: "yol_soyle"
            etiket: { tr: "Yolunu yüksek sesle söyle; sessizliği yırt", en: "Speak your Path out loud. Tear the silence open" }
            goster: { bayrak: "yol_olustu" }
            kronik: { tr: "Yolunu ilk kez gerçek bir düşmanın yüzüne söyledin; sessizlik onu duyduğu anda çatladı.", en: "You spoke your Path into a real enemy's face for the first time. The silence cracked the moment it heard it." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 4
              - xp_seviye: 20
              - savas: { dusmanlar: ["sessizlik_avcisi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "ihanet_mert_3", kaybet: "ihanet_mert_yenilgi" }

      - id: "ihanet_mert_3"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sessizlik Avcısı çatlıyor ve içindeki boşluk dışarı taşıyor; sonra sesler bir anda geri dönüyor, hepsi birden: telsizlerin cızırtısı, radyocuların inlemesi, kendi soluğun. Göğsünün ortasında, gümüş tozların arasında küçük bir sürücü duruyor.", en: "The Silencer cracks, and the hollow inside it spills out. Then every sound comes back at once: the radios crackling, the crew groaning, your own breathing. In the middle of its chest, in a drift of silver dust, sits a little drive." }
          - { tr: "Liste. Üç yüz on iki isim. Avucunda bir kibrit kutusu kadar hafif.", en: "The list. Three hundred twelve names. Light as a matchbox in your palm." }
          - metin: { tr: "{npc:mert_kilic} konsolun arkasından kalkıyor, dizleri titriyor. Ellerini iki yana açıyor; ne kaçmaya ne de yalvarmaya çalışıyor. \"Ne istiyorsan,\" diyor. \"Haklısın. Ne istiyorsan.\"", en: "{npc:mert_kilic} gets up from behind the console, knees shaking. He holds his hands out at his sides. He's not trying to run and he's not begging. \"Whatever you want,\" he says. \"You're right. Whatever you want.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Yerdeki radyocular yavaş yavaş doğruluyor. Biri, listenin senin elinde olduğunu görünce gülmeye başlıyor; gülüşü hıçkırığa dönüyor.", en: "The crew on the floor are starting to sit up. One of them sees the list in your hand and starts laughing, and the laugh turns into a sob." }
            kosul: { npc_olu: "mert_kilic" }
        secenekler:
          - id: "hukum"
            etiket: { tr: "Hükmü sen ver; hemen burada", en: "Pass sentence yourself. Right here" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|i} arşivin ortasında kendi elinle yargıladın; Sessiz Ağ o geceden sonra kimseye ikinci şans vermedi.", en: "You judged {npc:mert_kilic} with your own hands, right there in the archive. After that night, the Quiet Network never gave anyone a second chance." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4 }
              - npc_ol: "mert_kilic"
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 4, siginak: -4, lonca: 3 }
              - degisken: { kadim_tehdit: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "cift_ajan"
            etiket: { tr: "\"Kadimlere sahte bir liste götüreceksin.\"", en: "\"You're taking the Ancients a fake list.\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|i} Kadimler'e geri gönderdin, cebinde sahte bir listeyle; filonun hasat sırası son güne kadar yanlış kaldı.", en: "You sent {npc:mert_kilic} back to the Ancients with a fake list in his pocket. Their harvest order stayed wrong right up to the last day." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "mert_cift_ajan"
              - bayrak: "ihanet_onlendi"
              - degisken: { kadim_tehdit: -6, hayatta_kalan: 2 }
              - iliski: { mert_kilic: { korku: 15, guven: 8, saygi: 10 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "ag_yargilasin"
            etiket: { tr: "Sessiz Ağ kendi hainini yargılasın", en: "Let the Quiet Network judge its own" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|i} Sessiz Ağ'ın yargısına bıraktın; onu öldürmediler, ama bir daha hiçbir kapının anahtarını vermediler.", en: "You left {npc:mert_kilic} to the Quiet Network's judgment. They didn't kill him. They just never handed him the key to anything again." }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 1 }
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { saygi: 6, guven: -4 } }
              - degisken: { kadim_tehdit: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "git"
            etiket: { tr: "\"Git. Onların yanına. Bir daha görmeyeyim.\"", en: "\"Go. Go to them. I never want to see you again.\"" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:mert_kilic|i} Kadimler'in yanına gönderdin; bir sonraki görüşmenizde o gemiden bakıyordu.", en: "You sent {npc:mert_kilic} off to the Ancients. The next time you saw him, he was looking down from that ship." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - npc_fraksiyon: { mert_kilic: "kadimler" }
              - npc_gitti: "mert_kilic"
              - iliski: { mert_kilic: { guven: -10, korku: 10 } }
              - degisken: { kadim_tehdit: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yak"
            etiket: { tr: "Listeyi yak; ölü adamın anahtarlarını da", en: "Burn the list. The dead man's keys too" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Ölü bir dostun anahtarlarını listeyle birlikte yaktın; Sessiz Ağ o külleri bir kavanozda sakladı.", en: "You burned a dead friend's keys along with the list. The Quiet Network kept the ashes in a jar." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - bayrak: "ihanet_onlendi"
              - itibar: { sessiz_ag: 8 }
              - degisken: { kadim_tehdit: -3, hayatta_kalan: 2 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "sakla"
            etiket: { tr: "Listeyi sakla; bir gün işe yarar", en: "Keep the list. It'll come in handy someday" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Üç yüz on iki ismi cebinde sakladın; o insanların hiçbiri hayatlarının senin cebinde durduğunu bilmedi.", en: "You kept three hundred twelve names in your pocket. Not one of those people ever knew their lives were sitting in there." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 3 }
              - bayrak: "ihanet_onlendi"
              - bilgi: "mert_listesi"
              - itibar: { sessiz_ag: -4 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_mert_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sessizlik seni yutuyor. Ne düştüğünü duyuyorsun ne de yere çarptığını; bir an kurşun duvar yanağında soğuk, bir an sonra gözlerini açtığında oda boş.", en: "The silence swallows you. You don't hear yourself fall, and you don't hear yourself hit the floor. One second the lead wall is cold on your cheek, and the next time you open your eyes, the room is empty." }
          - { tr: "Raflar boş, sürücüler gitmiş. Liste gitmiş. Radyocuların yarısı da yok; kalanlar sana bakıyor ve hiçbir şey sormuyor. Bu, sormalarından daha kötü.", en: "The racks are empty, the drives gone. The list is gone. Half the radio crew is gone too, and the ones still here look at you and don't ask anything. That's worse than if they asked." }
          - metin: { tr: "{npc:mert_kilic|in} konsolu da boş. Bir not bırakmış, titrek bir el yazısıyla: \"Özür dilerim. Beni de aldılar. Belki iyisi budur.\"", en: "{npc:mert_kilic|pos} console is empty too. He left a note, the handwriting shaky: \"I'm sorry. They took me too. Maybe that's for the best.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
        secenekler:
          - id: "kalk_mert"
            etiket: { tr: "Kalk. Bu daha bitmedi", en: "Get up. This isn't over" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Sessiz Ağ'ın arşivini Kadimler'e kaptırdın; {npc:mert_kilic} o gemiye bindi ve listedeki isimler birer birer sustu.", en: "You lost the Quiet Network's archive to the Ancients. {npc:mert_kilic} went up to that ship, and the names on the list went quiet one by one." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - npc_fraksiyon: { mert_kilic: "kadimler" }
              - npc_gitti: "mert_kilic"
              - bayrak: "mert_listesi_teslim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
              - itibar: { sessiz_ag: -10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "kalk"
            etiket: { tr: "Kalk. Kalanları topla", en: "Get up. Gather up whoever's left" }
            goster: { npc_olu: "mert_kilic" }
            kronik: { tr: "Sessiz Ağ'ın arşivini Kadimler'e kaptırdın; listedeki isimler birer birer sustu.", en: "You lost the Quiet Network's archive to the Ancients. The names on the list went quiet one by one." }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_listesi_teslim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
              - itibar: { sessiz_ag: -10 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Kaya (Konsey'e darbe)
      - id: "ihanet_kaya_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "{npc:kaya_demir} masaya iki elini birden dayıyor. Sesi bir emir kadar sakin: \"Konsey bu gece dağıldı. Kimse ölmeyecek; tabii kimse aptallık etmezse.\"", en: "{npc:kaya_demir} plants both hands on the table. His voice is as calm as an order. \"The Council's dissolved as of tonight. Nobody's going to die. Unless somebody does something stupid.\"" }
          - { tr: "Arkasında Çekirdek'in mavi ışığı kırmızıya dönüyor. Kristalin yüzeyine gömülü bir mühür var, Lonca'nın demir işareti: Çekirdek'in muhafızını kendine bağlamış.", en: "Behind him, the Core's blue light goes red. There's a seal sunk into the crystal's surface, the Guild's iron mark. He's bound the Core's guardian to himself." }
          - metin: { tr: "İki Demir Yemin askeri {npc:elif_sari|in} iki yanında duruyor. {npc:elif_sari} oturduğu yerden kalkmıyor; yalnızca sana bakıyor, ne yapacağını görmek ister gibi.", en: "Two Iron Oath soldiers are standing on either side of {npc:elif_sari}. She doesn't get up. She just looks at you, like she wants to see what you'll do." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Bu planın bir kolu senindi. {npc:kaya_demir} sana başıyla işaret ediyor; ikinci kolun başında olman gereken yeri gösteriyor. Saat geldi, ortak.", en: "One arm of this plan was yours. {npc:kaya_demir} nods you toward the spot where you're supposed to be leading the second column. It's time, partner." }
            kosul: { bayrak: "kaya_darbe_ortagi" }
          - metin: { tr: "Konsey'i uyarmıştın. Uyarı bir kâğıtta kaldı; {npc:kaya_demir} ihbarı biliyor ve sana bakışında öfke değil, hayal kırıklığı var. \"Bana önce gelseydin,\" diyor.", en: "You warned the Council. The warning stayed on paper. {npc:kaya_demir} knows you turned him in, and the look he gives you isn't anger. It's disappointment. \"You could've come to me first,\" he says." }
            kosul: { bayrak: "kaya_ihbar_edildi" }
          - { tr: "\"Altmış beş gün,\" diyor. \"Bu masa altmış beş günde iki karar aldı, ikisi de su tahsisiyle ilgiliydi. Ben bu şehri tutacağım. Senden diz çökmeni istemiyorum. Yanımda durmanı istiyorum.\"", en: "\"Sixty-five days,\" he says. \"This table made two decisions in sixty-five days, and both of them were about water rationing. I'm going to hold this city. I'm not asking you to kneel. I'm asking you to stand next to me.\"" }
          - metin: { tr: "{npc:yanki}: dürüst bir adam. en tehlikelisi bu türü.", en: "{npc:yanki}: an honest man. that's the most dangerous kind." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Mühür onu da yakıyor. Avuç içi kabarmış; muhafızı tutmak her dakika canından bir parça götürüyor.", en: "[PER] The seal's burning him too. His palm is blistered. Every minute he holds that guardian costs him a piece of his life." }
        secenekler:
          - id: "yaninda"
            etiket: { tr: "Yanına geç; şehri birlikte tutun", en: "Step up beside him. Hold the city together" }
            kronik: { tr: "Ortak Masa'nın gecesi {npc:kaya_demir|in} yanında durdun; Konsey dağıldı ve şehir son günlerini demir bir yasayla geçirdi.", en: "On the night of the Common Table, you stood with {npc:kaya_demir}. The Council fell, and the city spent its last days under iron law." }
            etkiler:
              - ahlak: { duzen: 8, merhamet: -4, insanlik: -2 }
              - itibar: { lonca: 15, siginak: -20, sessiz_ag: -6 }
              - iliski: { kaya_demir: { saygi: 10, baglilik: 15, guven: 10 } }
              - hafiza: { npc: "kaya_demir", id: "olay:buyuk_ihanet", agirlik: 60 }
            sonraki: "ihanet_kaya_birlikte"
          - id: "ikna"
            etiket: { tr: "\"Bırak onları, başçavuş.\"", en: "\"Let 'em go, Gunny.\"" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 40 } } }
            kronik: { tr: "Darbe gecesi {npc:kaya_demir|i} yalnızca sesinle durdurdun; yirmi yıllık bir asker ilk kez saygı duyduğu birinden emir aldı.", en: "On the night of the coup, you stopped {npc:kaya_demir} with nothing but your voice. A twenty-year soldier took an order from somebody he respected for the first time." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 8, guven: 5 } }
            sonraki: "ihanet_kaya_teslim"
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Yalnızca muhafızlara bak; silahları düşsün", en: "Just look at the guards. Let their weapons drop" }
            gerekli: { stat: { wil: 280 } }
            kronik: { tr: "Bir bakışla Demir Yemin'in silahlarını düşürdün; o gece salondaki hiçbir asker sana bir daha doğrudan bakamadı.", en: "One look from you and the Iron Oath dropped their weapons. Not one soldier in that hall could look you in the eye again." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 4
              - iliski: { kaya_demir: { korku: 12, saygi: 6 } }
            sonraki: "ihanet_kaya_2"
          - id: "dagit"
            etiket: { tr: "Muhafızlarını dağıt", en: "Scatter his guards" }
            kronik: { tr: "Darbe gecesi Demir Yemin'in muhafızlarını Çekirdek salonunda dağıttın; o salonun taşlarında izleri hâlâ duruyor.", en: "On the night of the coup, you broke the Iron Oath's guard in the Core hall. The marks are still in the stone." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -3 }
              - savas: { dusmanlar: ["demir_yemin_muhafizi@oyuncu", "demir_yemin_muhafizi@oyuncu", "demir_yemin_muhafizi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ihanet_kaya_2", kaybet: "ihanet_kaya_yenilgi" }

      - id: "ihanet_kaya_2"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafızlar yerde. {npc:kaya_demir} onlara bakıyor, sonra sana; yüzünde öfke değil, bir hesap var. Avucunu kristale bastırıyor. \"Bunu istememiştim,\" diyor.", en: "The guards are down. {npc:kaya_demir} looks at them, then at you, and what's on his face isn't anger. It's math. He presses his palm to the crystal. \"I didn't want it to come to this,\" he says." }
          - { tr: "Çekirdek'in kırmızı ışığı ayağa kalkıyor. Mavi camdan, şehrin unutulmuş sokak adlarından, tahliye haritalarından örülmüş bir muhafız; başı tavana değiyor, gövdesinde Kıyıkent'in her mahallesi bir yara gibi parlıyor.", en: "The Core's red light gets up on its feet. A guardian woven out of blue glass, forgotten street names, and evacuation maps; its head brushes the ceiling, and every neighborhood in Port Harlow glows on its body like a wound." }
          - metin: { tr: "{npc:elif_sari} arkadan bağırıyor: \"Çekirdek'i kırarsan şehrin kalkanı da gider! Dikkat et!\"", en: "{npc:elif_sari} shouts from the back: \"Break the Core and the city's shield goes with it! Careful!\"" }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Çekirdek Muhafızı · bağlı: Lonca", en: "[ANALYSIS] Core Guardian · bound to: Iron Guild" }
            satirlar:
              - { tr: "Bağ, bağlayanın canından beslenir. Uzun bir savaş iki kişiyi öldürür.", en: "The bond feeds on its binder's life. A long fight kills two people." }
        secenekler:
          - id: "parcala"
            etiket: { tr: "Muhafızı parçala", en: "Tear the guardian apart" }
            kronik: { tr: "Çekirdek'in muhafızını parçaladın; şehrin kalbi o gece çatladı ama durmadı.", en: "You tore the Core's guardian apart. The city's heart cracked that night, but it didn't stop." }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["muhurlu_cekirdek@oyuncu+4"], kazan: "ihanet_kaya_3", kaybet: "ihanet_kaya_yenilgi" }
          - id: "muhur"
            tur: "gosteris"
            etiket: { tr: "Mührü kristalden tırnağınla kazı", en: "Pry the seal off the crystal with a fingernail" }
            gerekli: { stat: { int: 250 } }
            kronik: { tr: "Lonca'nın mührünü Çekirdek'ten tek hamlede kazıdın; muhafız, kimseyi incitmeden yeniden ışığa dağıldı.", en: "You scraped the Guild's seal off the Core in one move. The guardian dissolved back into light without hurting anyone." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - xp_seviye: 40
              - iliski: { kaya_demir: { saygi: 10 } }
            sonraki: "ihanet_kaya_3"
          - id: "elif_cikar"
            etiket: { tr: "Önce {npc:elif_sari|i} salondan çıkar", en: "Get {npc:elif_sari} out of the hall first" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Darbe gecesi önce {npc:elif_sari|i} kurtardın, sonra dövüştün; Konsey senin sırayı hiç unutmadı.", en: "On the night of the coup, you got {npc:elif_sari} out first and fought second. The Council never forgot the order you did it in." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - iliski: { elif_sari: { guven: 10, baglilik: 6 } }
              - itibar: { siginak: 5 }
              - savas: { dusmanlar: ["muhurlu_cekirdek@oyuncu+5"], kazan: "ihanet_kaya_3", kaybet: "ihanet_kaya_yenilgi" }

      - id: "ihanet_kaya_3"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafız mavi kum gibi dağılıyor ve Çekirdek'in ışığı yavaşça maviye dönüyor. {npc:kaya_demir} dizlerinin üstüne çöküyor; burnundan kan akıyor, avucundaki mühür izi kömür gibi kararmış.", en: "The guardian crumbles like blue sand, and the Core's light slowly turns blue again. {npc:kaya_demir} drops to his knees. His nose is bleeding, and the seal mark on his palm has gone black as coal." }
          - { tr: "\"İyi,\" diyor, nefes nefese. \"İyi. En azından biri bu şehri tutabiliyor. Ben değilmişim. Sen.\" Gülüyor, kısa ve acı. \"Yirmi yıl. Bir kere emir dinlemedim. Bu gece.\"", en: "\"Good,\" he says, out of breath. \"Good. At least somebody can hold this city. Wasn't me. It's you.\" He laughs, short and bitter. \"Twenty years. One time I didn't follow orders. Tonight.\"" }
          - metin: { tr: "{npc:elif_sari} salonun öbür ucunda, kollarını göğsünde kavuşturmuş duruyor. Hiçbir şey söylemiyor; kararı sana bıraktığını herkes görsün diye susuyor.", en: "{npc:elif_sari} stands at the other end of the hall, arms folded. She doesn't say a word. She's keeping quiet so everybody can see she's leaving this to you." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "devir"
            etiket: { tr: "Rütbesini sök; Lonca artık senin", en: "Strip his rank. The Guild's yours now" }
            kronik: { tr: "{npc:kaya_demir|i} devirip Demir Lonca'yı kendi eline aldın; o geceden sonra şehirdeki her silah önce sana sordu.", en: "You toppled {npc:kaya_demir} and took the Iron Guild for yourself. After that night, every gun in the city asked you first." }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -3 }
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: 10, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 10, guven: -20, korku: 10 } }
              - ordu: { lonca_avcisi: 40 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "infaz"
            etiket: { tr: "Bir darbeyi bir darbe bitirir", en: "A coup ends with one blow" }
            kronik: { tr: "Darbe gecesi {npc:kaya_demir|i} Çekirdek'in önünde infaz ettin; Lonca seni korkuyla, Sığınak dehşetle izledi.", en: "On the night of the coup, you executed {npc:kaya_demir} in front of the Core. The Guild watched you with fear. The Haven watched with horror." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 3 }
              - npc_ol: "kaya_demir"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: -10, siginak: -5, yukselenler: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "surgun"
            etiket: { tr: "\"Şehri terk et. Bu gece.\"", en: "\"Leave the city. Tonight.\"" }
            kronik: { tr: "{npc:kaya_demir|i} sürgüne gönderdin; şehrin dışındaki yollarda yalnız bir askerin kamp ateşleri görüldü.", en: "You exiled {npc:kaya_demir}. Out on the roads past the city, people saw a lone soldier's campfires." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - npc_gitti: "kaya_demir"
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: -5, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 5, guven: -10 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "af"
            etiket: { tr: "\"Kalk. Sana ihtiyacım olacak.\"", en: "\"Get up. I'm gonna need you.\"" }
            kronik: { tr: "Darbe gecesi {npc:kaya_demir|i} affettin; o asker son savaşa kadar sana borçlu olduğunu bir an bile unutmadı.", en: "On the night of the coup, you pardoned {npc:kaya_demir}. That soldier didn't forget for one second, right up to the last battle, that he owed you." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "kaya_affedildi"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: -6, lonca: 6 }
              - iliski: { kaya_demir: { guven: 15, baglilik: 20, saygi: 10 } }
              - hafiza: { npc: "kaya_demir", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey_karar"
            etiket: { tr: "Kararı {npc:elif_sari} ve Konsey versin", en: "Let {npc:elif_sari} and the Council decide" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Darbeciyi Konsey'in yargısına bıraktın; şehir son günlerinde bile bir mahkemenin nasıl kurulduğunu hatırladı.", en: "You left the man behind the coup to the Council's judgment. Even in its last days, the city remembered how a court is supposed to work." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "kaya_konseye_teslim"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 10, lonca: -4 }
              - iliski: { elif_sari: { guven: 8, saygi: 8 }, kaya_demir: { saygi: 4 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_teslim"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Uzun bir sessizlik. {npc:kaya_demir} sana bakıyor, sonra kristaldeki mühre. Sonra elini çekiyor; mühür sönüyor, ışık maviye dönüyor.", en: "A long silence. {npc:kaya_demir} looks at you, then at the seal on the crystal. Then he pulls his hand back. The seal goes dark and the light turns blue." }
          - { tr: "Kapıya yürüyor ve sürgüyü kendi eliyle açıyor. \"Silahları indirin,\" diyor adamlarına. Kimse itiraz etmiyor. Onu dinlemeye alışkınlar; seni dinlemeye de alışacaklar.", en: "He walks to the door and throws back the bolt himself. \"Stand down,\" he tells his people. Nobody argues. They're used to listening to him. They're going to get used to listening to you." }
          - { tr: "\"Bir şartım var,\" diyor sana dönerek. \"Altmış beş gün sonra bu şehir hâlâ ayaktaysa, haklı olan sen ol. Ben değil.\"", en: "\"One condition,\" he says, turning back to you. \"Sixty-five days from now, if this city's still standing, you be the one who was right. Not me.\"" }
        secenekler:
          - id: "rutbe_kalsin"
            etiket: { tr: "\"Rütben kalsın. Bu gece hiç yaşanmadı.\"", en: "\"Keep your stripes. Tonight never happened.\"" }
            kronik: { tr: "Darbe gecesini sildin ve {npc:kaya_demir|e} rütbesini bıraktın; o adam son güne kadar sana yalnızca 'komutanım' dedi.", en: "You erased the night of the coup and let {npc:kaya_demir} keep his rank. Right up to the last day, he never called you anything but 'sir.'" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - bayrak: "kaya_affedildi"
              - bayrak: "ihanet_onlendi"
              - iliski: { kaya_demir: { baglilik: 20, guven: 10 } }
              - itibar: { siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey"
            etiket: { tr: "\"Konsey'in önünde hesap vereceksin.\"", en: "\"You're answering to the Council.\"" }
            kronik: { tr: "{npc:kaya_demir|i} Konsey'in önünde hesap vermeye götürdün; şehir, gücün de bir masaya oturabileceğini gördü.", en: "You marched {npc:kaya_demir} in front of the Council to answer for it. The city saw that even power could be made to sit at a table." }
            etkiler:
              - ahlak: { duzen: 5 }
              - bayrak: "kaya_konseye_teslim"
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 8, lonca: -6 }
              - iliski: { kaya_demir: { saygi: 8, guven: -5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "lonca_al"
            etiket: { tr: "\"Lonca'yı ben alıyorum. Sen yanımda dur.\"", en: "\"I'm taking the Guild. You stand next to me.\"" }
            kronik: { tr: "{npc:kaya_demir|in} darbesini durdurup Lonca'yı kendine aldın; eski komutan sağ kolun oldu.", en: "You stopped {npc:kaya_demir|pos} coup and took the Guild for yourself. The old commander became your right hand." }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - bayrak: "kaya_devrildi"
              - bayrak: "lonca_hakimiyeti"
              - bayrak: "ihanet_onlendi"
              - iliski: { kaya_demir: { saygi: 12, baglilik: 6 } }
              - ordu: { lonca_avcisi: 40 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_birlikte"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Şafakta Demir Yasa meydanda okunuyor. Kıyıkent, Konsey'in değil Lonca'nın bayraklarıyla uyanıyor; su sırası askerlerle, ekmek sırası askerlerle, sokak lambaları bile bir çizelgeye göre yanıyor.", en: "At dawn, the Iron Law gets read out in the square. Port Harlow wakes up under Guild flags instead of the Council's. Water lines run by soldiers, bread lines run by soldiers, even the streetlights coming on by schedule." }
          - { tr: "Ve bir şey değişiyor: o gün kimse yağmalamıyor, kimse kavga etmiyor. Korku, insanları en az bir umut kadar düzenli tutuyor. {npc:kaya_demir} yanında, kollarını kavuşturmuş, memnun.", en: "And something changes: nobody loots that day, nobody fights. Fear keeps people every bit as orderly as hope does. {npc:kaya_demir} stands beside you, arms folded, satisfied." }
          - metin: { tr: "{npc:elif_sari|i} iki asker salondan çıkarıyor. Kapıda duruyor ve sana dönüyor: \"Sana inanmıştım,\" diyor. Yalnızca bu.", en: "Two soldiers walk {npc:elif_sari} out of the hall. She stops at the door and turns back to you. \"I believed in you,\" she says. That's all." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "elif_koru"
            etiket: { tr: "\"{npc:elif_sari|e} kimse dokunmayacak.\"", en: "\"Nobody lays a finger on {npc:elif_sari}.\"" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "Darbeye katıldın ama {npc:elif_sari|i} korudun; o da seni affetmedi, ama yaşadı.", en: "You joined the coup, but you protected {npc:elif_sari}. She never forgave you. But she lived." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - bayrak: "darbede_elif_korundu"
              - iliski: { elif_sari: { guven: -10, saygi: 5 }, kaya_demir: { saygi: -3 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "konsey_hapis"
            etiket: { tr: "Konsey üyeleri hapse; hepsi", en: "Lock up the Council. All of them" }
            kronik: { tr: "Konsey'in bütün üyelerini hapse attırdın; şehrin son demokrasisi bir bodrum katında bitti.", en: "You had the whole Council locked up. The city's last democracy ended in a basement." }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 5 }
              - itibar: { siginak: -10, lonca: 5 }
              - iliski: { elif_sari: { guven: -30 }, kaya_demir: { saygi: 5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "taht"
            etiket: { tr: "\"Darbe benim. Sen ikinci sırada dur.\"", en: "\"This is my coup. You're number two.\"" }
            gerekli: { stat: { cha: 250 } }
            kronik: { tr: "{npc:kaya_demir|in} darbesini elinden aldın; Demir Yasa'nın altına senin adın yazıldı.", en: "You took {npc:kaya_demir|pos} coup right out of his hands. Your name went at the bottom of the Iron Law." }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -4 }
              - bayrak: "lonca_hakimiyeti"
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { korku: 10, saygi: 5, guven: -10 } }
              - ordu: { lonca_avcisi: 60 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "Yeni düzeni meydanda sen ilan et", en: "Announce the new order in the square yourself" }
            kronik: { tr: "Demir Yasa'yı meydanda kendi sesinle ilan ettin; şehir o sesin kime ait olduğunu bir daha unutmadı.", en: "You read out the Iron Law in the square in your own voice. The city never forgot whose voice that was." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: 5, insanlik: -2 }
              - itibar: { lonca: 8, siginak: -5 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_kaya_yenilgi"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Muhafızın camdan yumruğu seni salonun öbür ucuna fırlatıyor. Duvar arkanda çöküyor; sonra hiçbir şey.", en: "The guardian's glass fist throws you clear across the hall. The wall caves in behind you. Then nothing." }
          - { tr: "Gözlerini açtığında meydandasın, bir sedyenin üstünde. Gökyüzü griye dönmüş. Hoparlörlerden {npc:kaya_demir|in} sesi geliyor; sakin, ölçülü, bir hava durumu raporu gibi: Demir Yasa yürürlükte.", en: "When you open your eyes you're in the square, on a stretcher. The sky's gone gray. {npc:kaya_demir|pos} voice is coming out of the loudspeakers, calm and measured, like a weather report: the Iron Law is now in effect." }
          - { tr: "Seni yenen o değil; o muhafız da değil. Seni yenen, bir şehri senin kadar umursayan ve senden önce davranan bir adam.", en: "It wasn't him that beat you. Not the guardian either. What beat you was a man who cared about this city as much as you do, and moved first." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Hesap sonra sorulur", en: "Get up. The reckoning comes later" }
            kronik: { tr: "Darbeyi durduramadın; şehir son günlerini {npc:kaya_demir|in} demir yasasıyla geçirdi ve sen bunun bedelini ölçtün.", en: "You couldn't stop the coup. The city spent its last days under {npc:kaya_demir|pos} iron law, and you counted every cost." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - itibar: { siginak: -5, lonca: 5 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "kabul"
            etiket: { tr: "Ona git; yenilgiyi kabul et", en: "Go to him. Accept the loss" }
            kronik: { tr: "Yenilgini {npc:kaya_demir|in} önünde kabul ettin; Demir Yasa'nın ilk sayfasında senin adın da vardı.", en: "You accepted defeat in front of {npc:kaya_demir}. Your name ended up on the first page of the Iron Law too." }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 10, baglilik: 5 } }
              - itibar: { lonca: 8, siginak: -8 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Thessar (kendi ırkına; iyi haber)
      - id: "ihanet_thessar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:thessar} cübbesinin içinden ince, gümüş bir levha çıkarıyor ve sana uzatıyor. Üstünde satırlar akıyor: tarihler, rotalar, kotalar. \"Hasat Defteri,\" diyor. \"Filonun geliş açısı, ilk inecek birlikler, hangi şehrin hangi gün susturulacağı. Dört yüz yıl boyunca bu defteri ben tuttum.\"", en: "{npc:thessar} pulls a thin silver plate out of his robe and holds it out to you. Lines are scrolling across it: dates, routes, quotas. \"The Harvest Ledger,\" he says. \"The fleet's approach vector, which units land first, which city gets silenced on which day. I have kept this ledger for four hundred years.\"" }
          - { tr: "\"Neden mi?\" Sorunu sormadan cevaplıyor. \"Çünkü sen bir hata değilsin. Dört yüz yılda ilk kez bir tarlada, biçilmeyi reddeden bir şey gördüm. Bir çiftçi bunu gördükten sonra aynı çiftçi olarak kalamaz.\"", en: "\"Why?\" He answers before you can ask. \"Because you are not an error. In four hundred years, this is the first field where I've seen something refuse to be cut. A farmer who sees that cannot go on being the same farmer.\"" }
          - { tr: "Gökyüzünde gemi homurdanıyor. Işık sütununun içinden bir figür iniyor: uzun, zırhlı, yüzünü örten bir maskenin ardında, kendi boyundan uzun bir kılıç taşıyan. Kadimler hainleri böyle karşılıyor; tören giysisiyle.", en: "Up in the sky, the ship growls. A figure comes down inside the column of light: tall, armored, face hidden behind a mask, carrying a sword longer than it is. That's how the Ancients greet traitors. In ceremonial dress." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Taht Cellâdı · Kadim infaz memuru", en: "[ANALYSIS] Throne Headsman · Ancient executioner" }
            satirlar:
              - { tr: "Hedef: tek. Tanıklara karşı tutum: kayıtsız. Sana karşı tutum: tanımlanmamış.", en: "Target: one. Attitude toward witnesses: indifferent. Attitude toward you: undefined." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "[ALG] {npc:thessar|in} yarası kendi eliyle açılmış. Gemiden kaçarken izini sürmesinler diye kendi işaretini sökmüş.", en: "[PER] {npc:thessar|pos} wound is self-inflicted. He cut his own tracking mark out on the way off the ship." }
        secenekler:
          - id: "koru"
            etiket: { tr: "Önüne geç; cellat seninle konuşsun", en: "Step in front of him. The headsman deals with you" }
            kronik: { tr: "Kendi ırkına ihanet eden Kadim'in önüne geçtin; o gece Taht Cellâdı ilk kez işini bitiremeden döndü.", en: "You stepped in front of the Ancient who betrayed his own kind. That night, the Throne Headsman went home with its job undone for the first time." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - iliski: { thessar: { guven: 12, baglilik: 10 } }
              - savas: { dusmanlar: ["taht_cellati@oyuncu+5"], ortam: ["tavan"], kazan: "ihanet_thessar_2", kaybet: "ihanet_thessar_yenilgi" }
          - id: "once_defter"
            etiket: { tr: "\"Önce defteri ver. Sonra korurum.\"", en: "\"Ledger first. Then I protect you.\"" }
            kronik: { tr: "{npc:thessar|i} korumadan önce defterini aldın; o anlaşmanın soğukluğu ikinizin arasında son güne kadar kaldı.", en: "You took {npc:thessar|pos} ledger before you'd lift a finger for him. The chill of that deal stayed between you until the last day." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 3 }
              - bilgi: "hasat_defteri"
              - iliski: { thessar: { saygi: 8, guven: -4 } }
              - savas: { dusmanlar: ["taht_cellati@oyuncu+5"], ortam: ["tavan"], kazan: "ihanet_thessar_2", kaybet: "ihanet_thessar_yenilgi" }
          - id: "bak"
            tur: "gosteris"
            etiket: { tr: "Gemiye bak; cellat inmeye cesaret edemesin", en: "Look up at the ship. Dare the headsman to land" }
            gerekli: { stat: { wil: 300 } }
            kronik: { tr: "Kadim gemisine yalnızca baktın ve Taht Cellâdı inmedi; filo o gece ilk kez bir insanın bakışını kayda geçirdi.", en: "You just looked at the Ancient ship, and the Throne Headsman never touched down. That night the fleet logged a human's stare for the first time." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - dikkat: 8
              - degisken: { kadim_tehdit: -4 }
              - iliski: { thessar: { saygi: 15, korku: 8 } }
              - xp_seviye: 40
            sonraki: "ihanet_thessar_2"
          - id: "teslim"
            etiket: { tr: "Onu cellada teslim et", en: "Hand him over to the headsman" }
            kronik: { tr: "Kendi ırkına ihanet eden Kadim'i cellada teslim ettin; filo bunu bir nezaket olarak kaydetti ve hasat takvimini bir gün öne aldı.", en: "You handed the Ancient who betrayed his own kind over to the headsman. The fleet logged it as a courtesy and moved the harvest up a day." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4, insanlik: -3 }
              - npc_ol: "thessar"
              - bayrak: "thessar_teslim_edildi"
              - degisken: { kadim_tehdit: 8 }
              - itibar: { kadimler: 15, siginak: -5 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_thessar_2"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Işık sütunu kesiliyor. Cellâdın kılıcı meydanın taşlarına saplanmış, sahibi yok; gemiye geri çekilmiş ya da artık var değil. Pazarın dağılmış kalabalığı yavaş yavaş geri dönüyor, ellerinde hâlâ fenerler.", en: "The column of light cuts out. The headsman's sword is stuck in the square's paving stones, no owner in sight; it either pulled back to the ship or doesn't exist anymore. The scattered market crowd drifts back in slowly, still holding their lanterns." }
          - { tr: "{npc:thessar} ayağa kalkıyor. Yaralı, ama başı dik. \"Teşekkür etmem beklenir,\" diyor. \"Bizim dilimizde bunun bir kelimesi yok. Bir borç kelimesi var. Onu kullanacağım.\"", en: "{npc:thessar} gets to his feet. Hurt, but head high. \"I am expected to thank you,\" he says. \"My language has no word for that. It has a word for debt. I will use that one.\"" }
          - metin: { tr: "{npc:yanki} şaşkın: bir kadim borçlu oldu. bunu kaydedin. hiç kimse inanmayacak.", en: "{npc:yanki}, stunned: an ancient just owed somebody. somebody write that down. nobody's going to believe it." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "sigin"
            etiket: { tr: "Ona şehirde bir sığınak ver", en: "Give him a safe house in the city" }
            kronik: { tr: "{npc:thessar|a} şehrin içinde bir sığınak verdin; Kıyıkent, bir Kadim'in saklandığı ilk insan şehri oldu.", en: "You gave {npc:thessar} a safe house in the city. Port Harlow became the first human city to hide an Ancient." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "thessar_sigindi"
              - degisken: { kadim_tehdit: -8 }
              - iliski: { thessar: { baglilik: 12, guven: 10 } }
              - hafiza: { npc: "thessar", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "tanik"
            tur: "aciga_vur"
            etiket: { tr: "Bütün fraksiyonların önünde konuşsun", en: "Make him testify in front of every faction" }
            kronik: { tr: "{npc:thessar|i} bütün fraksiyonların önünde konuşturdun; insanlık hasat takvimini ilk kez düşmanın kendi ağzından duydu.", en: "You had {npc:thessar} testify in front of every faction. For the first time, humanity heard the harvest schedule straight from the enemy's mouth." }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 4, insanlik: 2 }
              - bayrak: "thessar_sigindi"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -10 }
              - itibar: { siginak: 6, lonca: 6, sessiz_ag: 6, kadimler: -20 }
              - iliski: { thessar: { saygi: 8, korku: 4 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "silah"
            etiket: { tr: "\"Filoya karşı bana silah olacaksın.\"", en: "\"You're going to be my weapon against the fleet.\"" }
            kronik: { tr: "{npc:thessar|i} kendi filosuna karşı bir silah olarak kullandın; Kadimler o yıl ilk kez kendi kodlarına güvenemedi.", en: "You used {npc:thessar} as a weapon against his own fleet. That year, the Ancients couldn't trust their own codes for the first time." }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -2, duzen: 2 }
              - bayrak: "thessar_sigindi"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -12 }
              - iliski: { thessar: { saygi: 10, guven: -5, korku: 6 } }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 3, max: 6 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_thessar_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Cellâdın kılıcı boğazının bir parmak önünde duruyor. Duruyor, çünkü arada bir el var: {npc:thessar|in} gümüş kanlı eli.", en: "The headsman's blade stops an inch from your throat. It stops because there's a hand in the way: {npc:thessar|pos} silver-bloodied hand." }
          - { tr: "\"Benim için geldin,\" diyor cellâda, kendi dilinde, sonra seninkinde. \"Beni al. Bu insan hesabın dışında.\" Cellat bir an düşünüyor. Sonra ışık sütunu ikisini birden yukarı çekiyor.", en: "\"You came for me,\" he tells the headsman, in his own tongue and then in yours. \"Take me. This human is outside your ledger.\" The headsman thinks it over for a moment. Then the column of light pulls them both up." }
          - { tr: "Meydanda yalnızca gümüş bir levha kalıyor: Hasat Defteri. Taşların arasında, yağmurda parlıyor.", en: "All that's left in the square is a silver plate: the Harvest Ledger. Gleaming in the rain between the paving stones." }
        secenekler:
          - id: "defteri_al"
            etiket: { tr: "Defteri al; bedelini unutma", en: "Pick up the ledger. Don't forget what it cost" }
            kronik: { tr: "{npc:thessar} senin yerine gitti; geride bıraktığı defter insanlığın elindeki en değerli silah oldu.", en: "{npc:thessar} went up in your place. The ledger he left behind became the most valuable weapon humanity had." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - npc_ol: "thessar"
              - bilgi: "hasat_defteri"
              - degisken: { kadim_tehdit: -6 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "gogee_bagir"
            etiket: { tr: "Göğe bağır; geri getirsinler", en: "Scream at the sky. Make them bring him back" }
            kronik: { tr: "{npc:thessar} için göğe bağırdın; Kadim gemisi seni duydu ve cevap vermedi.", en: "You screamed at the sky for {npc:thessar}. The Ancient ship heard you and didn't answer." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - npc_ol: "thessar"
              - bilgi: "hasat_defteri"
              - dikkat: 6
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Deniz (Yükselenler adına)
      - id: "ihanet_deniz_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepe'nin en yukarısında, eski su deposunun önünde, Yükselenler bir halka kurmuş. Ortada iple bağlanmış yüzlerce insan; meşalelerin ışığında yüzleri bembeyaz. Bir kısmını tanıyorsun: Liman'dan, Kordon'dan, ekmek kuyruklarından.", en: "At the very top of the Heights, in front of the old water tower, the Ascended have made a ring. In the middle are hundreds of people tied together, faces bone-white in the torchlight. You know some of them: from the waterfront, the Esplanade, the bread lines." }
          - { tr: "{npc:deniz_arman} halkanın önünde duruyor. Kalkanı içinden yanıyor; bağlı insanların her biri soluk bir iplikle o kalkana bağlı. Her nefeste iplikler biraz daha parlıyor, insanlar biraz daha soluyor.", en: "{npc:deniz_arman} stands at the front of the ring. The shield's burning from the inside, and every one of those tied-up people is connected to it by a pale thread. With every breath, the threads glow a little brighter and the people fade a little more." }
          - metin: { tr: "Hoparlörlerden {npc:vahit|in} sesi geliyor, tatlı ve kesin: \"Yakıt yanmalı ki seçilmiş yükselsin. Bu gece kalkanımız, şehrin en büyük yükünü taşıyacak.\"", en: "{npc:vahit|pos} voice comes over the loudspeakers, sweet and certain: \"The fuel must burn so the chosen can rise. Tonight our shield carries the city's heaviest burden.\"" }
            kosul: { npc_hayatta: "vahit" }
          - { tr: "{npc:deniz_arman} seni görüyor. Gözleri bir an eski haline dönüyor; sonra yine uzaklaşıyor. \"Bana kardeşimi buldular,\" diyor. \"Bedeli sensin. Kimse ödeyemeyecek kadar büyük olan tek şey sensin.\"", en: "{npc:deniz_arman} sees you. For a second {zamir:deniz_arman|onun} eyes go back to how they used to be. Then they drift off again. \"They found my sister,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You're the price. You're the only thing big enough that nobody else can pay it.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Yakıtla Beslenen Kalkan", en: "[ANALYSIS] The Fuel-Fed Shield" }
            satirlar:
              - { tr: "Güç kaynağı: 312 insan. Kalan süre: ipliklere bağlı.", en: "Power source: 312 humans. Time remaining: depends on the threads." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] İplikler kalkana bağlı, kalkan da {npc:deniz_arman|in} göğsüne. İplikleri kesersen kalkan zayıflar; ama ilk kopan iplik en çok ona acıtır.", en: "[PER] The threads are tied to the shield, and the shield's tied to {npc:deniz_arman|pos} chest. Cut the threads and the shield weakens. But the first one that snaps is going to hurt {zamir:deniz_arman|onu} the most." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni öldürmek istemiyor. kendini öldürüyor ve bunu sana yaptırmak istiyor. ikisi aynı şey değil.", en: "they don't want to kill you. they're killing themselves and they want you to be the one who does it. those aren't the same thing." }
        secenekler:
          - id: "benim"
            etiket: { tr: "\"Kalkanını indir. Benim.\"", en: "\"Put the shield down. It's me.\"" }
            gerekli: { iliski_min: { deniz_arman: { guven: 40 } } }
            kronik: { tr: "Tepe'de {npc:deniz_arman|e} yalnızca kim olduğunu hatırlattın; kalkan yere düştü ve üç yüz kişi eve yürüdü.", en: "Up in the Heights, you just reminded {npc:deniz_arman} who you were. The shield hit the ground, and three hundred people walked home." }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 3 }
              - degisken: { hayatta_kalan: 4 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "ihanet_deniz_konus"
          - id: "iplikler"
            etiket: { tr: "Önce iplikleri kes; insanları kurtar", en: "Cut the threads first. Get the people out" }
            kronik: { tr: "Tepe'de önce bağlı insanları kurtardın, sonra eski dostunla dövüştün; o gece yakıt yanmadı.", en: "Up in the Heights, you freed the people tied up first and fought your old friend second. Nobody burned as fuel that night." }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 5, yukselenler: -8 }
              - savas: { dusmanlar: ["yakit_kalkani@oyuncu+3"], ortam: ["yanici"], kazan: "ihanet_deniz_2", kaybet: "ihanet_deniz_yenilgi" }
          - id: "yuru"
            etiket: { tr: "Kalkanına doğru yürü", en: "Walk straight at the shield" }
            kronik: { tr: "Tepe'de doğrudan eski dostunun kalkanına yürüdün; o kalkanı besleyen insanların bir kısmı sabahı göremedi.", en: "Up in the Heights, you walked straight into your old friend's shield. Some of the people feeding it didn't make it to morning." }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - degisken: { hayatta_kalan: -3 }
              - savas: { dusmanlar: ["yakit_kalkani@oyuncu+5"], ortam: ["yanici"], kazan: "ihanet_deniz_2", kaybet: "ihanet_deniz_yenilgi" }
          - id: "ciplak"
            tur: "gosteris"
            etiket: { tr: "Kalkanın darbesini çıplak elle tut", en: "Catch the shield's blow bare-handed" }
            gerekli: { stat: { end: 280 } }
            kronik: { tr: "{npc:deniz_arman|in} üç yüz insanla beslenen darbesini çıplak elle tuttun; Yükselenler o gece tanrılarının yanlış kişi olduğunu anladı.", en: "You caught {npc:deniz_arman|pos} three-hundred-person blow bare-handed. That night, the Ascended realized they'd been worshiping the wrong god." }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: 2 }
              - dikkat: 6
              - xp_seviye: 40
              - itibar: { yukselenler: 10 }
              - iliski: { deniz_arman: { korku: 12, saygi: 10 } }
            sonraki: "ihanet_deniz_2"

      - id: "ihanet_deniz_konus"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman|in} kalkanı titriyor. İplikler bir bir sönüyor; bağlı insanlar dizlerinin üstüne çöküyor, nefes alıyor. Kalkan yere düşüyor ve sesi Tepe'nin bütün yokuşlarında yankılanıyor.", en: "{npc:deniz_arman|pos} shield trembles. The threads go dark one after another, and the tied-up people drop to their knees, breathing. The shield hits the ground, and the sound echoes down every slope in the Heights." }
          - { tr: "\"Vapuru hep sen kaçırtırdın,\" diyor {npc:deniz_arman}, gülmeye çalışarak. Beceremiyor. \"Kardeşim... aslında bulmamışlar. Bir fotoğraf gösterdiler. Bilerek inandım. İnanmak istedim.\"", en: "\"You always made us miss the ferry,\" {npc:deniz_arman} says, trying to laugh. It doesn't work. \"My sister... they didn't really find her. They showed me a photo. I knew. I believed it anyway. I wanted to.\"" }
          - metin: { tr: "Hoparlörlerde {npc:vahit|in} sesi kesiliyor; birisi fişi çekmiş. Beyaz cüppeliler birer birer meşalelerini yere bırakıyor.", en: "{npc:vahit|pos} voice cuts off mid-word on the loudspeakers; somebody pulled the plug. One by one, the white robes set their torches down." }
            kosul: { npc_hayatta: "vahit" }
        secenekler:
          - id: "eve"
            etiket: { tr: "\"Eve gel.\"", en: "\"Come home.\"" }
            kronik: { tr: "İhanet gecesi {npc:deniz_arman|i} eve getirdin; o yıl Kıyıkent'te kimse vapuru kaçırmadı.", en: "On the night of the betrayal, you brought {npc:deniz_arman} home. Nobody in Port Harlow missed the ferry that year." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - bayrak: "deniz_geri_dondu"
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 20, guven: 10 } }
              - itibar: { yukselenler: -10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yolun_acik"
            etiket: { tr: "\"Git. Kendi yolunu bul.\"", en: "\"Go. Find your own way.\"" }
            kronik: { tr: "{npc:deniz_arman|i} serbest bıraktın; ne seninle ne Yükselenler'le, yalnızca kendi yolunda yürüdü.", en: "You let {npc:deniz_arman} go free. Not with you, not with the Ascended. Just down a road of {zamir:deniz_arman|onun} own." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { saygi: 10, guven: 6 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "hesap"
            etiket: { tr: "\"Önce bağladığın insanlara hesap vereceksin.\"", en: "\"First you answer to the people you tied up.\"" }
            kronik: { tr: "{npc:deniz_arman|i} bağladığı insanlara hesap vermeye götürdün; affedildi ama hiçbir zaman tamamen değil.", en: "You made {npc:deniz_arman} answer to the people {zamir:deniz_arman|o} tied up. {zamir:deniz_arman|b} {zamir:deniz_arman|was} forgiven, but never all the way." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - itibar: { siginak: 6, yukselenler: -6 }
              - iliski: { deniz_arman: { saygi: 8, guven: -4 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_deniz_2"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkan ortadan ikiye yarılıyor. İplikler kopuyor; bağlı insanlar geriye savrulup nefes nefese yere düşüyor. {npc:deniz_arman} su deposunun dibine yığılıyor; göğsündeki yakıt hâlâ yanıyor ama artık dışarıya değil, içeriye doğru.", en: "The shield splits down the middle. The threads snap, and the tied-up people fly back and hit the ground gasping. {npc:deniz_arman} crumples at the foot of the water tower. The fuel in {zamir:deniz_arman|onun} chest is still burning, but inward now. Not out." }
          - { tr: "\"Söz vermiştin,\" diyor zar zor. \"Hatırlıyor musun? Canavara ya da tanrıya dönüşürsen bana söyleyecektin. Söylemedin. Ben de bekleyemedim.\"", en: "\"You promised,\" {zamir:deniz_arman|o} manage{zamir:deniz_arman|s}. \"Remember? If you turned into a monster or a god, you were gonna tell me. You never did. So I couldn't wait.\"" }
          - { tr: "Nabzı düşüyor. Yakıt ondan geriye ne kaldıysa onu yiyor. Birkaç dakikası var; belki daha az.", en: "{zamir:deniz_arman|onun} pulse is dropping. The fuel's eating whatever's left. A few minutes, maybe less." }
        secenekler:
          - id: "kurtar"
            etiket: { tr: "Yakıtı kendi içine çek; onu kurtar", en: "Pull the fuel into yourself. Save {zamir:deniz_arman|onu}" }
            kronik: { tr: "{npc:deniz_arman|in} içini yakan ateşi kendi göğsüne çektin; bir dost kurtuldu, sende bir yara kaldı.", en: "You pulled the fire eating {npc:deniz_arman} into your own chest. A friend was saved, and you kept the scar." }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 3 }
              - can: -800
              - yozlasma: 4
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 25, guven: 15 } }
              - hafiza: { npc: "deniz_arman", id: "olay:buyuk_ihanet", agirlik: 90 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "son_saati"
            etiket: { tr: "Son saatini ertele", en: "Push back {zamir:deniz_arman|onun} last hour" }
            goster: { yol: "son_saat" }
            kronik: { tr: "{npc:deniz_arman|in} son saatini kendi yolunla erteledin; o saat yeniden geldiğinde ikiniz de hazırdınız.", en: "You pushed back {npc:deniz_arman|pos} last hour with your own Path. When that hour came around again, you were both ready." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: -1 }
              - bayrak: "ihanet_onlendi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { baglilik: 15, saygi: 15 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "bitir"
            etiket: { tr: "Acısını bitir", en: "End {zamir:deniz_arman|onun} pain" }
            kronik: { tr: "Tepe'de {npc:deniz_arman|in} acısına kendi elinle son verdin; o yokuşu bir daha hiç tırmanmadın.", en: "Up in the Heights, you ended {npc:deniz_arman|pos} pain with your own hands. You never climbed that slope again." }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 3 }
              - npc_ol: "deniz_arman"
              - bayrak: "ihanet_onlendi"
              - itibar: { yukselenler: -6, lonca: 3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "birak"
            etiket: { tr: "Bırak, kendi yangınını kendi söndürsün", en: "Let {zamir:deniz_arman|onu} put out {zamir:deniz_arman|onun} own fire" }
            kronik: { tr: "{npc:deniz_arman|i} kendi yangınıyla baş başa bıraktın; sabaha karşı Tepe'den kaybolduğunu söylediler.", en: "You left {npc:deniz_arman} alone with {zamir:deniz_arman|onun} own fire. By morning, they said {zamir:deniz_arman|o}'d vanished from the Heights." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -2 }
              - npc_gitti: "deniz_arman"
              - iliski: { deniz_arman: { guven: -15, saygi: 5 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_deniz_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkanın kenarı göğsüne iniyor ve seni su deposunun ayaklarına çiviliyor. Üç yüz insanın ağırlığı bir anda üstünde. {npc:deniz_arman} son darbeyi kaldırıyor.", en: "The shield's rim slams into your chest and pins you to the water tower's legs. Three hundred people's worth of weight comes down on you at once. {npc:deniz_arman} raises the last blow." }
          - { tr: "Ve indirmiyor. Kalkan havada titriyor; {npc:deniz_arman|in} yüzü bir çocuğunki gibi buruşuyor. \"Yapamıyorum,\" diyor. \"Seni yakıt yapamıyorum.\" Kalkanı atıyor ve karanlığa koşuyor.", en: "And doesn't bring it down. The shield shakes in midair, and {npc:deniz_arman|pos} face crumples like a kid's. \"I can't,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I can't make you fuel.\" {zamir:deniz_arman|b} drop{zamir:deniz_arman|s} the shield and run{zamir:deniz_arman|s} off into the dark." }
          - { tr: "Halkada bağlı insanların bir kısmı artık kıpırdamıyor. Yakıt yanmış; kalkanın ışığı onlardan geriye kalan tek şey.", en: "Some of the people tied up in the ring aren't moving anymore. The fuel burned. The shield's glow is all that's left of them." }
        secenekler:
          - id: "kalanlar"
            etiket: { tr: "Kalanları çöz; ölüleri say", en: "Untie the living. Count the dead" }
            kronik: { tr: "Tepe'deki ihaneti durduramadın; yakıt yandı ve en eski dostun karanlığa kaçtı.", en: "You couldn't stop the betrayal in the Heights. The fuel burned, and your oldest friend ran off into the dark." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - npc_gitti: "deniz_arman"
              - degisken: { hayatta_kalan: -4 }
              - itibar: { yukselenler: 5, siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "pesinden"
            etiket: { tr: "{npc:deniz_arman|in} adını karanlığa bağır", en: "Yell {npc:deniz_arman|pos} name into the dark" }
            kronik: { tr: "Kaçan dostunun adını karanlığa bağırdın; cevap gelmedi, ama o geceden sonra hiçbir Yükselen ona dokunamadı.", en: "You yelled your runaway friend's name into the dark. No answer came. But after that night, no Ascended ever laid a hand on {zamir:deniz_arman|onu}." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - npc_gitti: "deniz_arman"
              - degisken: { hayatta_kalan: -4 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Hain: Aras (Kadimler'le anlaştı)
      - id: "ihanet_aras_1"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} dönüyor. Gözlerinin içinde Kadim gümüşü dönüyor; seviyesi pencerede saniyede bir artıyor, durmadan, bir sayaç gibi. Ödünç taç her saniye ona bir şey veriyor ve karşılığında bir şey alıyor.", en: "{npc:aras_kurt} turns around. Ancient silver is swirling in his eyes, and his level keeps ticking up in your window, once a second, nonstop, like an odometer. The borrowed crown gives him something every second and takes something back." }
          - { tr: "\"S kademesi,\" diyor. \"İlk insan. Bana bunu teklif ettiler; karşılığında yalnızca bu kapıyı açmam gerekiyordu. Sen olsan reddeder miydin? Dürüst ol. Sen hiç ikinci olmadın.\"", en: "\"S-Grade,\" he says. \"First human. That's what they offered me. All I had to do was open this door. Would you have said no? Be honest. You've never been second at anything.\"" }
          - metin: { tr: "Teklifi aylar önce, çok-evren kapısının önünde almıştı; sen de oradaydın. O gün bir şaka gibi gelmişti. Bu gece ödenmiş bir fatura gibi.", en: "He got the offer months ago, in front of the multiverse gate. You were there. That day it sounded like a joke. Tonight it looks like a bill that came due." }
            kosul: { bayrak: "aras_kadim_teklifini_aldi" }
          - { tr: "Arkasında Kadim öncüleri geçitten akmaya devam ediyor. Aşağıda şehir uyuyor; ya da uyuduğunu sanıyor.", en: "Behind him, the Ancient vanguard keeps pouring through the gate. Down below, the city's asleep. Or thinks it is." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Ödünç Tacın Sahibi", en: "[ANALYSIS] Bearer of the Borrowed Crown" }
            satirlar:
              - { tr: "Gerçek seviye: yükseliyor. Gerçek sahip: Kadim filosu. Taç, taşıyıcısının ömrünü faiz olarak alır.", en: "True level: rising. True owner: the Ancient fleet. The crown takes its bearer's lifespan as interest." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "[ALG] Tacın arkasında ince bir iplik var, gemiye uzanıyor. Taç ona güç vermiyor; ödünç veriyor. Geri çekilebilir.", en: "[PER] There's a thin thread running from the back of the crown up to the ship. It isn't giving him power. It's lending it. It can be called back." }
        secenekler:
          - id: "duello"
            etiket: { tr: "\"Ceketini çıkar. Bitirelim.\"", en: "\"Take off the jacket. Let's finish this.\"" }
            kronik: { tr: "Kule'nin ellinci katında ebedi rakibinle son kez dövüştün; geçidin önündeki taşlar o gecenin izlerini hâlâ taşıyor.", en: "You fought your lifelong rival one last time on the Spire's fiftieth floor. The stones in front of that gate still carry the marks." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 10 } }
              - savas: { dusmanlar: ["odunc_tac@oyuncu+5"], ortam: ["dar_gecit"], kazan: "ihanet_aras_2", kaybet: "ihanet_aras_yenilgi" }
          - id: "fiyat"
            etiket: { tr: "\"Tacın fiyatını sordun mu?\"", en: "\"Did you ask what the crown costs?\"" }
            kronik: { tr: "Ebedi rakibine tacın gerçek fiyatını söyledin; o an ikinizin arasındaki yarış ilk kez durdu.", en: "You told your lifelong rival what the crown really cost. For the first time ever, the race between you stopped." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 8 } }
            sonraki: "ihanet_aras_konus"
          - id: "kapi"
            etiket: { tr: "Önce geçidi kapat; o bekleyebilir", en: "Close the gate first. He can wait" }
            kronik: { tr: "Rakibini bıraktın ve geçidi kapattın; şehir o gece kurtuldu, {npc:aras_kurt} ise tacıyla birlikte gemiye gitti.", en: "You let your rival go and shut the gate. The city was saved that night, and {npc:aras_kurt} went up to the ship, crown and all." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2, kadim_tehdit: 3 }
              - savas: { dusmanlar: ["kadim_infazci@dunya", "kadim_infazci@dunya", "kadim_hukumsuzlestirici@dunya"], kazan: "ihanet_aras_kacti", kaybet: "ihanet_aras_yenilgi" }
          - id: "tac_al"
            tur: "gosteris"
            etiket: { tr: "Tacı başından, o kımıldamadan al", en: "Lift the crown off his head before he can move" }
            gerekli: { stat: { agi: 300 } }
            kronik: { tr: "Ödünç tacı rakibinin başından, o daha göz kırpmadan aldın; {npc:aras_kurt} o geceden sonra hızından hiç söz etmedi.", en: "You lifted the borrowed crown off your rival's head before he could blink. After that night, {npc:aras_kurt} never once bragged about being fast." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - dikkat: 5
              - xp_seviye: 40
              - iliski: { aras_kurt: { saygi: 15, korku: 8 } }
            sonraki: "ihanet_aras_2"

      - id: "ihanet_aras_konus"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} bir an duruyor. Sonra eli tacına gidiyor, yarı yolda kalıyor. \"Ömür,\" diyor. \"Biliyorum. Bir yılda on yıl. Hesapladım.\"", en: "{npc:aras_kurt} goes still. Then his hand drifts up toward the crown and stops halfway. \"Lifespan,\" he says. \"I know. Ten years for every one. I did the math.\"" }
          - { tr: "\"Ama ilk olurum. Kimse ilk S kademesi insanın adını unutmaz. Sen bile.\" Gülüyor; gülüşünde ilk kez hiç kendine güven yok. \"Sen bile, değil mi?\"", en: "\"But I'd be first. Nobody forgets the name of the first S-Grade human. Not even you.\" He laughs, and for the first time there's no confidence in it at all. \"Not even you, right?\"" }
        secenekler:
          - id: "unutmam"
            etiket: { tr: "\"Seni zaten unutmayacaktım, aptal.\"", en: "\"I was never gonna forget you, idiot.\"" }
            gerekli: { iliski_min: { aras_kurt: { saygi: 40 } } }
            kronik: { tr: "Ebedi rakibine onu asla unutmayacağını söyledin; ödünç taç ellinci katın zemininde, sahipsiz kaldı.", en: "You told your lifelong rival you'd never forget him. The borrowed crown ended up on the fiftieth floor, ownerless." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - iliski: { aras_kurt: { guven: 15, baglilik: 12 } }
              - hafiza: { npc: "aras_kurt", id: "olay:buyuk_ihanet", agirlik: 80 }
            sonraki: "ihanet_aras_2"
          - id: "dovus"
            etiket: { tr: "\"O zaman ödünç tacınla kazan beni.\"", en: "\"Then beat me with your borrowed crown.\"" }
            kronik: { tr: "Rakibine ödünç tacıyla seni yenmeye çalışmasını söyledin; deneyişi Kule'nin ellinci katında efsane oldu.", en: "You dared your rival to beat you with his borrowed crown. The way he tried became a legend on the fiftieth floor." }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["odunc_tac@oyuncu+5"], ortam: ["dar_gecit"], kazan: "ihanet_aras_2", kaybet: "ihanet_aras_yenilgi" }
          - id: "git"
            etiket: { tr: "\"Git o zaman. Gemi seni bekliyor.\"", en: "\"Go, then. Your ship's waiting.\"" }
            kronik: { tr: "Rakibinin tacıyla gemiye gitmesine izin verdin; Kadim filosunun önünde bir insan yürüdü.", en: "You let your rival walk up to that ship with his crown. An Ancient fleet had a human marching in front of it." }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -2 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 6 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_2"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç taç taşlara çarpıp çatlıyor; içinden ince bir gümüş duman çıkıp geçide, oradan gemiye doğru akıyor. Kadim öncüleri durup geri dönüyor; geçit yavaşça kapanıyor.", en: "The borrowed crown hits the stones and cracks, and a thin silver smoke leaks out of it, back through the gate and up toward the ship. The Ancient vanguard stops and turns around. The gate slowly closes." }
          - { tr: "{npc:aras_kurt} dizlerinin üstünde; pencerede seviyesi geri sayıyor, aldığı her şeyi geri veriyor. Ceketinin cebinden bir sigara çıkarıyor, yakamıyor, elleri titriyor.", en: "{npc:aras_kurt} is on his knees, and his level's counting back down in the window, giving back everything it took. He pulls a cigarette out of his jacket pocket and can't light it. His hands are shaking." }
          - { tr: "\"Yine sen,\" diyor. \"Her seferinde sen. Bari ne yapacaksan çabuk yap.\"", en: "\"You again,\" he says. \"Every single time, it's you. Whatever you're gonna do, do it fast.\"" }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Bu yarış burada biter", en: "The race ends here" }
            kronik: { tr: "Ebedi rakibini Kule'nin ellinci katında öldürdün; o günden sonra Küresel Sıralama'da senin arkanda kimse kalmadı.", en: "You killed your lifelong rival on the Spire's fiftieth floor. After that day, there was nobody left behind you on the Global Ranking." }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 3 }
              - npc_ol: "aras_kurt"
              - bayrak: "ihanet_onlendi"
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yanina_al"
            etiket: { tr: "\"Kalk. Yarışın kalanını yan yana koşarız.\"", en: "\"Get up. We run the rest of this side by side.\"" }
            kronik: { tr: "İhanet eden rakibini yanına aldın; o günden sonra aynı yöne koştunuz ve kimse ikinizi birden geçemedi.", en: "You took the rival who betrayed you and put him at your side. From then on you ran the same way, and nobody could pass you both." }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - bayrak: "ihanet_onlendi"
              - yoldas_katil: "aras_kurt"
              - iliski: { aras_kurt: { guven: 15, baglilik: 15, saygi: 10 } }
              - hafiza: { npc: "aras_kurt", id: "olay:buyuk_ihanet", agirlik: 80 }
              - degisken: { kadim_tehdit: -4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "serbest"
            etiket: { tr: "Sigarasını yak ve git", en: "Light his cigarette and walk away" }
            kronik: { tr: "Rakibinin sigarasını yakıp gittin; ikiniz bir daha hiç aynı merdivende karşılaşmadınız.", en: "You lit your rival's cigarette and walked off. The two of you never met on the same staircase again." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - bayrak: "ihanet_onlendi"
              - npc_gitti: "aras_kurt"
              - iliski: { aras_kurt: { saygi: 12, guven: 5 } }
            sonraki: "buyuk_ihanet_sonra"
          - id: "tac"
            etiket: { tr: "Çatlak tacı kendin al", en: "Pick up the cracked crown yourself" }
            kronik: { tr: "Rakibinin başından düşen çatlak tacı sen aldın; içinde hâlâ bir Kadim'in fısıltısı vardı.", en: "You picked up the cracked crown that fell off your rival's head. There was still an Ancient whispering inside it." }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 1 }
              - bayrak: "ihanet_onlendi"
              - esya: { catlak_odunc_tac: 1 }
              - yozlasma: 5
              - iliski: { aras_kurt: { saygi: 5, guven: -10 } }
              - npc_gitti: "aras_kurt"
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_kacti"
        yer: "kule"
        paragraflar:
          - { tr: "Geçit son öncünün arkasından kapanıyor. Şehir güvende. Döndüğünde {npc:aras_kurt|in} yeri boş; yalnızca pencerenin kenarında bir sigara izmariti, hâlâ tütüyor.", en: "The gate shuts behind the last of the vanguard. The city's safe. When you turn around, {npc:aras_kurt|pos} spot is empty. Just a cigarette butt on the windowsill, still smoking." }
          - { tr: "Gökyüzünde Kadim gemisinin altından ince bir ışık yükseliyor; içinde bir insan silüeti. Siyah ceketli.", en: "Up in the sky, a thin beam rises to the underside of the Ancient ship, with a human silhouette in it. Black jacket." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Işığın sönmesini izle", en: "Watch the light fade" }
            kronik: { tr: "Şehri kurtarmayı rakibini durdurmaya tercih ettin; {npc:aras_kurt} Kadimler'in safında, tacıyla birlikte göğe çıktı.", en: "You chose saving the city over stopping your rival. {npc:aras_kurt} went up to the Ancients' side, crown and all." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
            sonraki: "buyuk_ihanet_sonra"
          - id: "soz"
            etiket: { tr: "\"Seni oradan da indireceğim.\"", en: "\"I'll drag you down from there too.\"" }
            kronik: { tr: "Göğe çıkan rakibine onu oradan da indireceğine söz verdin; o söz son savaşa kadar seninle yürüdü.", en: "You swore to your rival as he rose into the sky that you'd drag him back down. That promise walked with you to the last battle." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_aras_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç tacın gücü seni geçidin kenarına savuruyor. Kalkmaya çalışıyorsun; bacakların seni dinlemiyor. {npc:aras_kurt} üstüne eğiliyor.", en: "The borrowed crown's power throws you against the edge of the gate. You try to get up, and your legs won't listen. {npc:aras_kurt} leans over you." }
          - { tr: "\"İlk kez,\" diyor, ve sesinde zafer yok. Yalnızca yorgunluk. \"İlk kez ben önde bitirdim. Hiç böyle hissettirmeyeceğini düşünmüştüm.\" Arkasını dönüyor ve ışığın içinden gemiye yükseliyor.", en: "\"First time,\" he says, and there's no victory in it. Just tired. \"First time I finished ahead. Never thought it'd feel like this.\" He turns his back and rises up through the light to the ship." }
          - { tr: "Geçit açık kalıyor. Sabaha kadar şehrin ordusu onu kapatmak için kan döküyor.", en: "The gate stays open. Until dawn, the city's fighters bleed to close it." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve geçide koş", en: "Get up and run for the gate" }
            kronik: { tr: "Ebedi rakibin seni Kule'nin ellinci katında yendi ve Kadimler'e gitti; geçidi kapatmanın bedelini şehir ödedi.", en: "Your lifelong rival beat you on the Spire's fiftieth floor and went over to the Ancients. The city paid for closing that gate." }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "yat"
            etiket: { tr: "Bir dakika daha yat; yalnızca bir dakika", en: "Lie there one more minute. Just one" }
            kronik: { tr: "Rakibine yenildiğin gece bir dakika yerde kaldın; o dakikayı ömrün boyunca geri istedin.", en: "The night your rival beat you, you stayed on the floor for one more minute. You wanted that minute back for the rest of your life." }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - bayrak: "aras_kadimlere_gitti"
              - npc_fraksiyon: { aras_kurt: "kadimler" }
              - npc_gitti: "aras_kurt"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -4 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Yedek hain: Sıralama'nın İkincisi
      - id: "ihanet_ikinci_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kadın dönüyor. Genç; belki yirmi beş. Yüzü yorgun, gözleri gümüşe kesmiş. \"Birinci sensin,\" diyor. \"Biliyorum. Herkes biliyor. Ben yalnızca ikinciyim; ikinciler de pazarlık eder.\"", en: "The woman turns around. Young. Twenty-five, maybe. Her face is exhausted and her eyes have gone silver. \"You're Number One,\" she says. \"I know. Everybody knows. I'm just Number Two. And Number Twos make deals.\"" }
          - { tr: "\"Ailem gemide,\" diyor, sesi bir an kırılarak. \"Entegrasyon Günü yanlış kapıdan geçtiler. Kadimler onları bulmuş. Bu kapıyı açarsam onları geri veriyorlar.\"", en: "\"My family's on that ship,\" she says, and her voice cracks for a second. \"They went through the wrong door on Integration Day. The Ancients found them. If I open this gate, they give them back.\"" }
          - metin: { tr: "{npc:yanki}: yalan söylemiyor. ama onlar söylüyor. kadimler hiçbir şeyi geri vermez.", en: "{npc:yanki}: she's not lying. they are. the ancients never give anything back." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Tacını indir; ya da ben indiririm", en: "Take off the crown. Or I take it off you" }
            kronik: { tr: "Sıralama'nın İkincisi'yle dövüştün; ailesi için şehri satan bir kadına son sözü sen söyledin.", en: "You fought the Ranking's Number Two. You had the last word with a woman who sold the city for her family." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["ikinci_sira@oyuncu+4"], ortam: ["dar_gecit"], kazan: "ihanet_ikinci_2", kaybet: "ihanet_ikinci_yenilgi" }
          - id: "yalan"
            etiket: { tr: "\"Sana yalan söylüyorlar.\"", en: "\"They're lying to you.\"" }
            kronik: { tr: "Sıralama'nın İkincisi'ne Kadimler'in yalanını gösterdin; ödünç tacı kendi eliyle çıkardı.", en: "You showed the Ranking's Number Two the Ancients' lie. She took the borrowed crown off with her own hands." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { kadim_tehdit: -2 }
            sonraki: "ihanet_ikinci_2"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Birincinin kim olduğunu ona hatırlat", en: "Remind her who Number One is" }
            gerekli: { stat: { str: 280 } }
            kronik: { tr: "Sıralama'nın İkincisi'ne tek hamlede kimin birinci olduğunu hatırlattın; o kadın bir daha hiç pazarlık etmedi.", en: "You reminded the Ranking's Number Two who Number One was in a single move. That woman never made another deal." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - dikkat: 5
              - xp_seviye: 30
            sonraki: "ihanet_ikinci_2"

      - id: "ihanet_ikinci_2"
        yer: "kule"
        paragraflar:
          - { tr: "Gümüş taç taşlara düşüyor ve çatlıyor; geçit, son öncünün arkasından kapanıyor. Kadın yere oturuyor, dizlerini göğsüne çekiyor. Ağlamıyor. Ağlamak için fazla yorgun.", en: "The silver crown hits the stones and cracks, and the gate closes behind the last of the vanguard. The woman sits down on the floor and pulls her knees up to her chest. She isn't crying. She's too tired to cry." }
          - { tr: "\"Adım bile yok artık,\" diyor. \"Sadece bir sıra numarası. Ne yapacaksan yap, Birinci.\"", en: "\"I don't even have a name anymore,\" she says. \"Just a number. Do whatever you're gonna do, Number One.\"" }
        secenekler:
          - id: "adini_sor"
            etiket: { tr: "Adını sor", en: "Ask her name" }
            kronik: { tr: "Sıralama'nın İkincisi'ne adını sordun; o günden sonra kimse ona numarasıyla seslenmedi.", en: "You asked the Ranking's Number Two her name. Nobody ever called her by her number again." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - bayrak: "ihanet_onlendi"
              - ordu: { lonca_avcisi: 10 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "hapis"
            etiket: { tr: "Fraksiyonlara teslim et", en: "Turn her over to the factions" }
            kronik: { tr: "Sıralama'nın İkincisi'ni fraksiyonların yargısına bıraktın; şehir, güçlü bir haini ilk kez bir mahkemede gördü.", en: "You left the Ranking's Number Two to the factions' judgment. For the first time, the city saw a powerful traitor stand trial." }
            etkiler:
              - ahlak: { duzen: 5 }
              - bayrak: "ihanet_onlendi"
              - itibar: { siginak: 4, lonca: 4 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "infaz"
            etiket: { tr: "Bir hain için bir darbe", en: "One blow for one traitor" }
            kronik: { tr: "Sıralama'nın İkincisi'ni Kule'nin ellinci katında infaz ettin; o kat bir süre kimsenin tırmanmak istemediği bir kat oldu.", en: "You executed the Ranking's Number Two on the Spire's fiftieth floor. For a while, nobody wanted to climb that floor." }
            etkiler:
              - ahlak: { merhamet: -7, duzen: 3 }
              - bayrak: "ihanet_onlendi"
              - itibar: { lonca: 4, siginak: -4 }
            sonraki: "buyuk_ihanet_sonra"

      - id: "ihanet_ikinci_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Ödünç taç kadını bir anlığına senden hızlı yapıyor. Bir an. Yeterli. Yere düşüyorsun ve geçit açık kalıyor.", en: "For one moment, the borrowed crown makes her faster than you. One moment. That's enough. You go down, and the gate stays open." }
          - { tr: "Kadın sana bakmıyor bile; ışığa doğru, ailesinin adını fısıldayarak yürüyor. Işık onu yutuyor. Öncüler sabaha kadar şehre akıyor.", en: "She doesn't even look at you. She walks into the light whispering her family's names, and the light swallows her. The vanguard keeps pouring into the city until dawn." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; geçidi kapatmak sana kaldı", en: "Get up. Closing that gate is on you now" }
            kronik: { tr: "Sıralama'nın İkincisi seni geçip Kadimler'e gitti; geçidi kapatmanın bedelini şehir ödedi.", en: "The Ranking's Number Two got past you and went over to the Ancients. The city paid for closing that gate." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"
          - id: "isim"
            etiket: { tr: "Adını hiç sormadığını düşün", en: "Think about how you never asked her name" }
            kronik: { tr: "Seni yenen kadının adını hiç bilmedin; o gece Sıralama'ya baktığında numaralar yerine yüzler görmeye başladın.", en: "You never learned the name of the woman who beat you. That night, when you looked at the Ranking, you started seeing faces instead of numbers." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { kadim_tehdit: 6, hayatta_kalan: -3 }
            sonraki: "buyuk_ihanet_sonra"

      # ---------------------------------------------------------------- Sabah (bütün zincirler)
      - id: "buyuk_ihanet_sonra"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent} üstüne gri ve sessiz iniyor. Kasaba Çekirdeği'nin önündeki meydan, gece boyunca olanları duymuş insanlarla dolu; kimse bağırmıyor, herkes fısıldıyor.", en: "Morning comes down over {yer:kiyikent} gray and quiet. The square in front of the Town Core is full of people who heard what happened last night. Nobody's yelling. Everybody's whispering." }
          - metin: { tr: "Hain durduruldu; bunu herkes biliyor. Ama bir ihanetin durdurulması, olmadığı anlamına gelmiyor. İnsanlar birbirine eskisinden biraz daha uzun bakıyor.", en: "The traitor got stopped. Everybody knows that much. But stopping a betrayal doesn't mean it never happened. People look at each other a little longer than they used to." }
            kosul: { bayrak: "ihanet_onlendi" }
          - metin: { tr: "İhanet tamamlandı. Şehrin bir parçası artık geri gelmeyecek ve bunu meydandaki herkes kemiklerinde hissediyor.", en: "The betrayal went through. Part of the city isn't coming back, and everyone in the square can feel it in their bones." }
            kosul: { bayrak_yok: ["ihanet_onlendi", "ihanet_thessar"] }
          - metin: { tr: "Bir Kadim, kendi ırkına sırtını döndü. Haber gece boyunca bütün kamplara yayıldı ve sabaha doğru meydanda bir şey değişti: umut, ilk kez, kaba ve tuhaf bir biçimde mantıklı geliyor.", en: "An Ancient turned his back on his own kind. The news spread to every camp overnight, and by morning something in the square had shifted: hope, for the first time, sounds rough and strange and almost reasonable." }
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
          - metin: { tr: "Körfezin üstünde Kadim gemisi her zamankinden alçakta. Gece olanları kaydetti; ve ne kaydettiğinden hoşlanmadığı belli.", en: "Over the bay, the Ancient ship is riding lower than ever. It logged everything that happened last night, and it clearly didn't like what it logged." }
            kosul: { degisken_min: { kadim_tehdit: 60 } }
          - metin: { tr: "{npc:yanki} yorgun: ihanetler hep böyle biter. bir sabah, bir meydan, kimsenin yüksek sesle söylemediği bir isim. bir sonraki döngüde de olacak. ama bu döngüde sen vardın.", en: "{npc:yanki}, tired: betrayals always end like this. a morning, a square, a name nobody says out loud. it'll happen next loop too. but this loop, you were here." }
            kosul: { bayrak: "yanki_bagi" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes sana bakıyor. Bir şey söylemen gerekiyor. Ne olursa.\"", en: "\"Everybody's looking at you. You need to say something. Anything.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yaralılar Liman'daki hastanede. Gelirsen iyi olur; senin elini sıkmak isteyenler var.\"", en: "\"The wounded are at the waterfront hospital. It'd be good if you came by. People want to shake your hand.\"" }
        secenekler:
          - id: "anlat"
            tur: "aciga_vur"
            etiket: { tr: "Meydana çık ve her şeyi anlat", en: "Step out and tell the square everything" }
            kronik: { tr: "İhanet gecesinin bütün gerçeğini meydanda anlattın; şehir, son günlerine yalan olmadan girdi.", en: "You told the square the whole truth about the night of the betrayal. The city walked into its last days without a lie between them." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { siginak: 4, lonca: 4, sessiz_ag: 4 }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "Ayrıntıları kendine sakla", en: "Keep the details to yourself" }
            kronik: { tr: "İhanet gecesinin ayrıntılarını sakladın; şehirde o gece hakkında yüz farklı hikâye dolaştı ve hiçbiri doğru değildi.", en: "You kept the details of that night to yourself. A hundred different stories about it went around the city, and none of them were true." }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: -2 }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "bayrak"
            etiket: { tr: "\"Bir daha olmayacak.\" Bayrağının altına çağır", en: "\"Never again.\" Call them under your banner" }
            kronik: { tr: "İhanetin sabahında insanları bayrağının altına çağırdın; o gün yüzlerce kişi, kime güveneceğini senden öğrendi.", en: "On the morning after the betrayal, you called people under your banner. That day hundreds of them learned from you who to trust." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 40
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "korfez"
            etiket: { tr: "Kimseye bir şey deme; körfeze bak", en: "Don't say anything. Look out at the bay" }
            kronik: { tr: "İhanetin sabahında hiçbir şey söylemeden körfeze baktın; insanlar o sessizliği bir yemin olarak okudu.", en: "On the morning after the betrayal, you looked out at the bay without a word. People read that silence as a vow." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
              - tohum: { olay: "ihanet_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

  # ================================================================== İHANETİN ARDINDAN (tohum)
  - id: "ihanet_sonrasi"
    perde: [3]
    agirlik: 1
    etiketler: ["ihanet", "anma"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Boş sandalye", en: "The Empty Chair" }
    sahne: "ihanet_sonrasi_1"
    sahneler:
      - id: "ihanet_sonrasi_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Birkaç gün sonra Ortak Masa yeniden toplanıyor; bu kez kimse mühre dokunmuyor. Masanın bir sandalyesi boş ve kimse onu çekip oturmaya cesaret edemiyor.", en: "A few days later, the Common Table meets again. This time nobody touches the seal. One chair at the table is empty, and nobody has the nerve to pull it out and sit." }
          - metin: { tr: "Sessiz Ağ'ın radyocuları köşede, yeni bir frekans üstünde çalışıyor; eskisi artık Kadimler'in kulağında. Biri sana bakıp başını sallıyor: hâlâ buradayız.", en: "The Quiet Network crew is in the corner, working on a new frequency; the old one belongs to the Ancients now. One of them catches your eye and nods: we're still here." }
            kosul: { bayrak: "ihanet_mert" }
          - metin: { tr: "Demir Yemin'in askerleri kapıda, ama silahları yerde. Darbenin gecesi kimsenin ağzından çıkmıyor; yine de herkesin aklında.", en: "Iron Oath soldiers are at the door, weapons grounded. Nobody says a word about the night of the coup. It's on everybody's mind anyway." }
            kosul: { bayrak: "ihanet_kaya" }
          - metin: { tr: "Masanın ucunda, bir insan sandalyesine fazla uzun gelen bir Kadim oturuyor. Kimse ona doğrudan bakmıyor; ama herkes onu dinliyor.", en: "At the end of the table sits an Ancient, too tall for a human chair. Nobody looks straight at him. Everybody listens to him." }
            kosul: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
          - metin: { tr: "Tepe'den gelen temsilci beyaz giymemiş. Yükselenler'in yarısı o geceden sonra cüppelerini yaktı; kalanlar daha sessiz, daha tehlikeli.", en: "The rep from the Heights isn't wearing white. Half the Ascended burned their robes after that night. The rest got quieter, and more dangerous." }
            kosul: { bayrak: "ihanet_deniz" }
          - metin: { tr: "Küresel Sıralama'nın en üstünde artık bir boşluk var. Sistem onu doldurmuyor; sanki bekliyor.", en: "There's a gap near the top of the Global Ranking now. The System isn't filling it. Like it's waiting." }
            kosul: { bayrak: ["ihanet_aras", "aras_kadimlere_gitti"] }
          - metin: { tr: "İkinci'nin adı nihayet bir listeye yazılıyor; bu kez bir sıra numarası olarak değil.", en: "Number Two's real name finally goes down on a list. Not as a rank this time." }
            kosul: { bayrak: "ihanet_ikinci_sira" }
        sezgiler:
          - kosul: { stat: { cha: 200 } }
            metin: { tr: "[ALG] Masadaki herkes söze senin başlamanı bekliyor. Sen konuşmadıkça kimse sandalyeye dokunmayacak.", en: "[PER] Everyone at the table is waiting for you to speak first. Until you do, nobody's touching that chair." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "boş sandalyeler en gürültülü olanlardır. her döngüde bir tane olur.", en: "empty chairs are always the loudest ones. every loop has one." }
        secenekler:
          - id: "sandalye"
            etiket: { tr: "Sandalyeyi çek ve masadan kaldır", en: "Pull the chair away from the table" }
            kronik: { tr: "İhanetin boş bıraktığı sandalyeyi masadan kaldırdın; Ortak Masa son güne kadar bir kişi eksik toplandı.", en: "You took the chair the betrayal left empty away from the table. The Common Table met one seat short until the last day." }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 2, lonca: 2, sessiz_ag: 2 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 3, max: 7 } }
            sonraki: "ihanet_sonrasi_2"
          - id: "otur"
            tur: "aciga_vur"
            etiket: { tr: "Boş sandalyeye kendin otur", en: "Sit in the empty chair yourself" }
            kronik: { tr: "Hainin sandalyesine kendin oturdun; o günden sonra masada kimin konuştuğu tartışılmadı.", en: "You sat down in the traitor's chair yourself. After that, nobody argued about who did the talking at that table." }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: 4, insanlik: -2 }
              - itibar: { lonca: 5, yukselenler: 4, siginak: -3 }
            sonraki: "ihanet_sonrasi_2"
          - id: "aileler"
            etiket: { tr: "Masayı bırak; o gece kayıp verenlere git", en: "Skip the table. Go see the families who lost people" }
            goster: { degisken_max: { hayatta_kalan: 70 } }
            kronik: { tr: "Masayı bırakıp ihanet gecesi kayıp veren ailelerin kapısını tek tek çaldın; hiçbiri o ziyareti unutmadı.", en: "You skipped the table and knocked on the door of every family who lost someone that night. None of them ever forgot it." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6 }
            sonraki: "ihanet_sonrasi_aileler"

      - id: "ihanet_sonrasi_2"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Toplantı uzun sürmüyor. Kararlar kısa, sesler alçak: nöbet çizelgeleri, erzak, Kadim filosunun beklenen rotası. İhanetten bahsedilmiyor; ama her karar onun gölgesinde alınıyor.", en: "The meeting doesn't run long. Short decisions, low voices: watch rosters, supplies, the Ancient fleet's projected route. Nobody mentions the betrayal. Every decision gets made in its shadow anyway." }
          - { tr: "Çıkarken biri koluna dokunuyor: genç bir nöbetçi, belki on dokuz. \"O gece oradaydım,\" diyor. \"Yalnızca... teşekkür ederim. Ya da özür dilerim. Hangisi gerekiyorsa.\"", en: "On the way out, somebody touches your arm: a young sentry, maybe nineteen. \"I was there that night,\" he says. \"I just... thank you. Or I'm sorry. Whichever one's right.\"" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu çocuğa bir şey söyle. Sana bakışı benim sana ilk bakışım gibi.\"", en: "\"Say something to that kid. He's looking at you the way I first looked at you.\"" }
        secenekler:
          - id: "ikisi"
            etiket: { tr: "\"İkisi de gerekmiyor. Nöbetine dön.\"", en: "\"Neither one. Get back to your post.\"" }
            kronik: { tr: "O nöbetçiye ne teşekkür ne özür gerektiğini söyledin; o çocuk son savaşta nöbetini bırakmayan tek kişiydi.", en: "You told that sentry he didn't owe you thanks or an apology. In the last battle, he was the one who never left his post." }
            etkiler:
              - ahlak: { duzen: 3 }
              - ordu: { lonca_avcisi: 5 }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Ona o geceyi anlattır", en: "Let him tell you about that night" }
            kronik: { tr: "Genç bir nöbetçinin o geceyi anlatmasını dinledin; ihanetin hikâyesi, ilk kez bir tanığın ağzından yazıldı.", en: "You listened to a young sentry tell you about that night. For the first time, the story of the betrayal got written down by a witness." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 3 }
            sonraki: "@akis"

      - id: "ihanet_sonrasi_aileler"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Liman'ın arka sokaklarında kapılar açılıyor; kimisi öfkeyle, kimisi şaşkınlıkla. Bir kadın seni içeri almıyor ama kapıyı da kapatmıyor. Bir adam sana çay koyuyor ve tek kelime etmiyor.", en: "Doors open in the back streets of the waterfront, some angry, some stunned. One woman won't let you in, but she doesn't shut the door either. One man pours you tea and doesn't say a single word." }
          - { tr: "Son kapıda bir çocuk var. Elinde senin bir çizimin; kötü çizilmiş, ama ışık hep doğru yerde. \"Babam sana inanıyordu,\" diyor. \"Ben de inanmalı mıyım?\"", en: "At the last door there's a kid holding a drawing of you. Badly drawn, but the light's always in the right place. \"My dad believed in you,\" the kid says. \"Should I?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Ben de sana inanacağım.\"", en: "\"Yeah. And I'll believe in you too.\"" }
            kronik: { tr: "Babasını kaybeden bir çocuğa birbirinize inanacağınızı söyledin; o çocuk yıllar sonra bir şehrin konseyine başkan oldu.", en: "You told a kid who lost their dad that you'd believe in each other. Years later, that kid chaired a city council." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Bilmiyorum. Kendine inan.\"", en: "\"I don't know. Believe in yourself.\"" }
            kronik: { tr: "Bir çocuğa sana değil kendine inanmasını söyledin; o çocuk hiçbir tanrıya diz çökmeden büyüdü.", en: "You told a kid to believe in themselves instead of you. That kid grew up without kneeling to any god." }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
            sonraki: "@akis"

  # ================================================================== PERDE 3 SONU (ana yay, gün 320)
  - id: "perde3_son"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "kadimler", "filo"]
    gerilim: 4
    ana_yay: { gun: 320 }
    onemli: true
    kart: { tr: "Filo yolda", en: "The Fleet Is Coming" }
    sahne: "perde3_son_1"
    sahneler:
      - id: "perde3_son_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı gökyüzü yanlış bir yerden aydınlanıyor. Ayın hemen yanında, önce bir, sonra on, sonra sayılamayacak kadar çok ışık; yıldız değil, çünkü yıldızlar yaklaşmaz.", en: "At midnight, the sky lights up from the wrong direction. Right next to the moon, first one light, then ten, then too many to count. Not stars. Stars don't get closer." }
          - { tr: "Körfezin üstünde aylardır asılı duran gemi bir an parlıyor, sanki selam veriyor. O hiçbir zaman bir ordu değildi. Bir elçiydi. Ordu şimdi geliyor.", en: "The ship that's been hanging over the bay for months flashes once, like a salute. It was never the army. It was the envoy. The army's coming now." }
          - metin: { tr: "Bütün Kıyıkent sokaklarda. Kimse ağlamıyor; ağlamak için fazla erken ya da fazla geç. Herkesin gözü önce gökyüzüne, sonra sana dönüyor.", en: "All of Port Harlow is out in the streets. Nobody's crying. It's either too early or too late for that. Every pair of eyes goes to the sky first, then to you." }
            kosul: { degisken_min: { hayatta_kalan: 50 } }
          - metin: { tr: "Sokaklar yarı boş. Entegrasyondan beri kaybedilen her insan şimdi daha da eksik; kalanlar kapı eşiklerinde, battaniyelere sarılmış, gökyüzünü sayıyor.", en: "The streets are half empty. Everyone lost since Integration feels even more missing tonight. The ones left sit in doorways wrapped in blankets, counting the sky." }
            kosul: { degisken_max: { hayatta_kalan: 49 } }
          - metin: { tr: "{npc:thessar} yanında, gökyüzüne bakıyor. \"Yedi taht, kırk sekiz gemi,\" diyor sakin bir sesle. \"Benim ırkım bu kadar çok gemiyi en son bir tanrıyı yakmak için yollamıştı.\"", en: "{npc:thessar} stands beside you, watching the sky. \"Seven thrones, forty-eight ships,\" he says calmly. \"The last time my people sent this many, it was to burn a god.\"" }
            kosul: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
          - metin: { tr: "Işıkların arasında biri daha parlak; gümüş ve siyah. Bir insanın bir Kadim tacıyla parlayabileceği kadar parlak.", en: "One of the lights is brighter than the rest. Silver and black. As bright as a human can shine wearing an Ancient crown." }
            kosul: { bayrak: "aras_kadimlere_gitti" }
          - metin: { tr: "Kordon'un yeniden yakılmış fenerleri körfezin kıyısı boyunca uzanıyor; bir zamanlar düşmüş bir sahil, şimdi şehrin ilk savunma hattı.", en: "The Esplanade's relit lanterns run all along the bay. A shoreline that fell once is now the city's first line of defense." }
            kosul: { bayrak: "p3_kordon_geri_alindi" }
          - metin: { tr: "{npc:yanki} hiç olmadığı kadar alçak bir sesle: bunu daha önce gördüm. tam olarak bunu. bir sonraki sahneyi de biliyorum. bu sefer değiştirebilir miyiz bilmiyorum. ama bu sefer sen varsın.", en: "{npc:yanki}, quieter than it's ever been: i've seen this before. exactly this. i know the next scene too. i don't know if we can change it this time. but this time, you're here." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KATMAN DEĞERLENDİRMESİ: SON 45 GÜN]", en: "[LAYER ASSESSMENT: FINAL 45 DAYS]" }
            satirlar:
              - { tr: "Hasat ekibi yola çıktı. Varış: değerlendirme sonucuna bağlı.", en: "Harvest crew dispatched. Arrival: pending assessment results." }
              - { tr: "Değerlendirme sonucu: henüz bilinmiyor. Sistem bunu şaşırtıcı buluyor.", en: "Assessment results: not yet known. The System finds this surprising." }
        sezgiler:
          - kosul: { stat: { per: 250 } }
            metin: { tr: "[ALG] Kırk sekiz gemi. Üçü geri kalıyor, düzensiz. Filoda bir tartışma var; herkes bu gece buraya gelmek istemiyor.", en: "[PER] Forty-eight ships. Three are lagging, out of formation. There's an argument going on in that fleet. Not everybody wants to come here tonight." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kırk beş gün. Ne yapacağız? Hayır, dur. Ne yapacaksın? Ben neredeysen oradayım.\"", en: "\"Forty-five days. What are we gonna do? No, wait. What are you gonna do? Wherever you are, I'm there.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kırk sekiz gemi. Yirmi dördünü sen al, yirmi dördünü ben. Kim önce bitirirse.\"", en: "\"Forty-eight ships. You take twenty-four, I'll take twenty-four. Whoever finishes first.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sinyallerini yakalıyorum. Hepsi aynı satırı tekrarlıyor. Çeviremiyorum ama... sanırım bir sayım.\"", en: "\"I'm picking up their signals. They're all repeating the same line. Can't translate it, but... I think it's a countdown.\"" }
        secenekler:
          - id: "konus"
            tur: "aciga_vur"
            etiket: { tr: "Liman'ın en yüksek yerine çık ve konuş", en: "Climb up high on the waterfront and speak" }
            kronik: { tr: "Filonun ışıkları göründüğü gece şehre konuştun; o konuşma, son kırk beş günün her sabahı birileri tarafından tekrarlandı.", en: "The night the fleet's lights showed up, you spoke to the city. Every morning for the last forty-five days, somebody repeated that speech." }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 5, lonca: 5, yukselenler: 5, sessiz_ag: 5 }
            sonraki: "perde3_son_konus"
          - id: "ordu"
            etiket: { tr: "Bayrağının altındakileri topla", en: "Muster everyone under your banner" }
            goster: { ordu_min: 1 }
            kronik: { tr: "Filonun göründüğü gece ordunu topladın; Kıyıkent o gece ilk kez bir ordunun nasıl uyuduğunu gördü.", en: "The night the fleet appeared, you mustered your army. That night, Port Harlow saw for the first time what an army looks like when it sleeps." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 60
            sonraki: "perde3_son_ordu"
          - id: "yakinlar"
            etiket: { tr: "Bu geceyi yanındakilerle geçir", en: "Spend tonight with the people closest to you" }
            kronik: { tr: "Filonun göründüğü gece yanındakilerle oturdun; o gecenin sohbeti, savaşın en zor günlerinde akıllarında kalan şey oldu.", en: "The night the fleet appeared, you sat with the people closest to you. That conversation was what stuck with them through the worst days of the war." }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
            sonraki: "perde3_son_gece"
          - id: "kule"
            etiket: { tr: "Kule'nin tepesine çık; filoya yakından bak", en: "Climb the Spire. Get a closer look at the fleet" }
            kronik: { tr: "Filonun göründüğü gece Kule'nin tepesinden ona yalnız baktın; filo da sana baktı ve rotasını değiştirmedi.", en: "The night the fleet appeared, you looked at it alone from the top of the Spire. The fleet looked back and didn't change course." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -1 }
              - iliski: { yanki: { guven: 5 } }
            sonraki: "perde3_son_kule"

      - id: "perde3_son_konus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Batık vapurun yan yatmış gövdesine tırmanıyorsun; Liman'ın en yüksek yeri o. Aşağıda binlerce yüz, yukarıda kırk sekiz ışık. Sesin kalabalığın üstünden körfeze kadar gidiyor.", en: "You climb up onto the capsized ferry's hull; it's the highest point on the waterfront. Thousands of faces below, forty-eight lights above. Your voice carries over the crowd all the way to the bay." }
          - { tr: "Ne söylediğini sonra kimse tam hatırlamıyor. Herkes yalnızca nasıl söylediğini hatırlıyor: korkmadan değil, ama korkuyu bir alet gibi elinde tutarak.", en: "Afterward, nobody can remember exactly what you said. Everybody just remembers how you said it: not without fear, but holding fear like a tool in your hand." }
        secenekler:
          - id: "savas"
            etiket: { tr: "\"Kırk beş gün. Hepsini savaşacağız.\"", en: "\"Forty-five days. We fight every one of them.\"" }
            kronik: { tr: "Şehre kırk beş günün her birini savaşacağınızı söyledin; kimse o günlerden birini bile teslim olarak geçirmedi.", en: "You told the city you'd fight every one of those forty-five days. Nobody spent a single one of them surrendering." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - ordu_kazan: 30
              - degisken: { kadim_tehdit: -3 }
            sonraki: "@akis"
          - id: "yasayin"
            etiket: { tr: "\"Kırk beş gün. Yaşayın onları.\"", en: "\"Forty-five days. Go live them.\"" }
            kronik: { tr: "Şehre kalan kırk beş günü yaşamasını söyledin; o günlerde Kıyıkent'te düğünler, doğumlar ve şarkılar oldu.", en: "You told the city to go live those forty-five days. Port Harlow had weddings, births, and songs in that stretch." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_ordu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Liman meydanı sabaha kadar doluyor. Avcılar, gönüllüler, bağladığın canavarlar, kapı külünden kalkan şeyler; hepsi senin sancağının altında, sıra sıra.", en: "The waterfront square fills up until dawn. Hunters, volunteers, monsters you've bound, things that rose from the ash of Gates; all of them under your banner, rank on rank." }
          - { tr: "Saymaya çalışıyorsun ve bir yerde bırakıyorsun. Sayılar bu gece önemli değil. Önemli olan, hiçbirinin gökyüzüne bakmaması; hepsi sana bakıyor.", en: "You try to count them and give up somewhere along the way. Numbers don't matter tonight. What matters is that none of them are looking at the sky. They're all looking at you." }
          - metin: { tr: "Ön sırada Demir Yemin'in eski askerleri duruyor; darbe gecesinden beri ilk kez rütbeleri omuzlarında.", en: "The front rank is old Iron Oath soldiers, wearing their stripes for the first time since the night of the coup." }
            kosul: { bayrak: "lonca_hakimiyeti" }
        secenekler:
          - id: "talim"
            etiket: { tr: "Sabaha kadar talim yaptır", en: "Drill them till dawn" }
            kronik: { tr: "Filonun göründüğü gece ordunu sabaha kadar talim ettirdin; o ordu son savaşta bir kez bile dağılmadı.", en: "The night the fleet appeared, you drilled your army till dawn. That army didn't break once in the last battle." }
            etkiler:
              - ahlak: { duzen: 4 }
              - ordu_kazan: 30
            sonraki: "@akis"
          - id: "gonder"
            etiket: { tr: "\"Bu gece evlerinize gidin. Yarın başlıyoruz.\"", en: "\"Go home tonight. We start tomorrow.\"" }
            kronik: { tr: "Ordunu son bir gece için evlerine gönderdin; ertesi sabah hepsi, bir kişi bile eksilmeden geri geldi.", en: "You sent your army home for one last night. The next morning, every last one of them came back." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_gece"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir çatıda, bir battaniyenin altında, eski bir termostan çay içiyorsunuz. Gökyüzü yanıyor ve bir süre kimse bundan söz etmiyor.", en: "Up on a roof, under a blanket, drinking tea out of an old thermos. The sky is on fire, and for a while nobody mentions it." }
          - metin: { tr: "{npc:deniz_arman} omzuna yaslanıyor. \"Vapuru hatırlıyor musun?\" diyor. \"Her sabah. Kaçırdığımız her sabah. Keşke bir sabah daha kaçırsak.\"", en: "{npc:deniz_arman} leans on your shoulder. \"Remember the ferry?\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Every morning. Every morning we missed it. I wish we could miss it one more time.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} termosu senin elinden alıp bir yudum içiyor. \"Kırk beş gün,\" diyor. \"Bir hekim için çok kısa bir süre değil. İnsanlar kırk beş günde iyileşebilir.\"", en: "{npc:elif_sari} takes the thermos from you and has a sip. \"Forty-five days,\" she says. \"That's not that short, for a doctor. People can heal in forty-five days.\"" }
            kosul: { yoldas: "elif_sari" }
          - metin: { tr: "Çatıda yalnızsın. Battaniye bir kişilik; çay iki kişilik. Eski bir alışkanlık.", en: "You're alone on the roof. The blanket's sized for one. The tea's made for two. Old habit." }
            kosul: { yoldas_sayisi_max: 0 }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Bu bittiğinde, yine buraya çıkarız.\"", en: "\"When this is over, we come back up here.\"" }
            kronik: { tr: "Filonun göründüğü gece bir çatıda, her şey bittiğinde oraya geri dönme sözü verdin; o çatı hâlâ orada.", en: "The night the fleet appeared, you promised on a rooftop that you'd come back up there when it was all over. That roof's still there." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 8 }, elif_sari: { baglilik: 8 } }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Hiçbir şey söyleme; gökyüzünü izle", en: "Don't say anything. Just watch the sky" }
            kronik: { tr: "Filonun göründüğü gece hiçbir şey söylemeden gökyüzünü izledin; o sessizlik, söyleyebileceğin her şeyden daha uzun sürdü.", en: "The night the fleet appeared, you watched the sky without a word. That silence lasted longer than anything you could have said." }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

      - id: "perde3_son_kule"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin en yüksek tırmanılmış katında rüzgâr yok. Filo buradan bir şehir kadar büyük görünüyor; gemiler arasında ince, ışıktan iplikler, bir örümcek ağı gibi.", en: "On the Spire's highest climbed floor, there's no wind. From up here the fleet looks as big as a city, with thin threads of light running between the ships like a spiderweb." }
          - { tr: "Gemilerden biri, en büyüğü, sana dönüyor. Ne bir ışık ne bir ses; yalnızca dönüyor ve bekliyor. Kırk sekiz gemi içinde, seni tanıyan bir tane var.", en: "One of the ships, the biggest one, turns toward you. No light, no sound. It just turns and waits. Out of forty-eight ships, there's one that knows who you are." }
          - metin: { tr: "{npc:yanki}: o gemi. o gemiyi hatırlıyorum. en son gördüğümde içinde biri vardı. bana adımı veren biri.", en: "{npc:yanki}: that ship. i remember that ship. last time i saw it, there was someone on board. someone who gave me my name." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "isaret"
            tur: "gosteris"
            etiket: { tr: "Gemiye yolunun ışığıyla bir işaret ver", en: "Signal the ship with your Path's light" }
            gerekli: { stat: { wil: 300 } }
            kronik: { tr: "Kadim filosunun amiral gemisine kendi yolunun ışığıyla işaret verdin; filo o gece bir saat boyunca yerinde durdu.", en: "You signaled the Ancient flagship with the light of your own Path. That night, the fleet held its position for an hour." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - dikkat: 10
              - degisken: { kadim_tehdit: -5 }
              - xp_seviye: 30
            sonraki: "@akis"
          - id: "yanki_sor"
            etiket: { tr: "\"Sana adını kim verdi?\"", en: "\"Who gave you your name?\"" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "{npc:yanki|e} adını kimin verdiğini sordun; cevabın ilk yarısı Kule'nin en üst katında, ikinci yarısı Çekirdek'te bekliyordu.", en: "You asked {npc:yanki} who gave it its name. The first half of the answer was waiting at the top of the Spire. The second half, at the Core." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bilgi: "amiral_gemisi"
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "@akis"
          - id: "in"
            etiket: { tr: "Aşağı in; şehir seni bekliyor", en: "Head back down. The city's waiting" }
            kronik: { tr: "Filoya bir kez bakıp şehrine döndün; o günden sonra gözün hep yerdeydi, gökte değil.", en: "You took one look at the fleet and went back down to your city. After that, your eyes stayed on the ground, not the sky." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 2, max: 6 } }
            sonraki: "@akis"

  # ================================================================== DİKKAT EŞİKLERİ (Perde 3, motor tohumlar)
  - id: "dikkat_75_p3"
    perde: [3]
    agirlik: 1
    etiketler: ["dikkat", "kadimler"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Ölçücü", en: "The Assessor" }
    sahne: "dikkat_75_p3_1"
    sahneler:
      - id: "dikkat_75_p3_1"
        paragraflar:
          - { tr: "Sabah uyandığında pencerende yabancı bir satır var; mavi değil, gümüş: [Ölçüm randevusu: bugün.] Altında saat yok, yer yok. Gerek yok; seni bulacak.", en: "When you wake up, there's a strange line in your window. Not blue. Silver: [Measurement appointment: today.] No time, no place. It doesn't need either. It'll find you." }
          - { tr: "Öğleye doğru buluyor. Kalabalığın içinden geçen ince, uzun, şapkalı bir figür; elinde bir cetvel, yüzünde bir terzinin dikkati. İnsanlar ona yol veriyor, neden verdiklerini bilmeden.", en: "Around noon, it does. A thin, tall figure in a hat walks through the crowd with a measuring rod in hand and a tailor's attention on its face. People get out of its way without knowing why." }
          - { tr: "\"Anomali,\" diyor sana, saygılı bir sesle. \"Filonun boyunu bilmesi gerekiyor. Lütfen kıpırdamayın; acımayacak. Genellikle.\"", en: "\"The anomaly,\" it says, respectfully. \"The fleet needs your measurements. Please hold still. It won't hurt. Usually.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim Ölçücüsü · A kademesi", en: "[ANALYSIS] Ancient Assessor · A-Grade" }
            satirlar:
              - { tr: "Ölçtüğü şey, ölçüldükten sonra küçülür.", en: "Whatever it measures gets smaller afterward." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Cetvelin üstündeki çizgiler senin seviyeni değil, eksiğini sayıyor. Ölçülmek, bir şeyin alınması demek.", en: "[PER] The marks on that rod aren't counting your level. They're counting what you're missing. Getting measured means getting something taken." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bırakma ölçsün. ya da bırak, ama yanlış ölçsün. bende yanlış rakamlar çok.", en: "don't let it measure you. or let it, but make it measure wrong. i've got plenty of wrong numbers." }
        secenekler:
          - id: "kac"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış; ölçülecek bir şey bırakma", en: "Lose yourself in the crowd. Leave nothing to measure" }
            etkiler:
              - gizle: 10
              - ahlak: { duzen: -2 }
            sonraki: "dikkat_75_p3_kacis"
          - id: "yanlis"
            etiket: { tr: "{npc:yanki|e} yanlış rakamları verdir", en: "Have {npc:yanki} feed it the wrong numbers" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 6
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "dikkat_75_p3_yanlis"
          - id: "cetvel"
            etiket: { tr: "Cetvelini kır", en: "Break its measuring rod" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -1 }
              - dikkat: 4
              - savas: { dusmanlar: ["kadim_olcucu@oyuncu+3"], kazan: "dikkat_75_p3_zafer", kaybet: "dikkat_75_p3_yenilgi" }

      - id: "dikkat_75_p3_kacis"
        paragraflar:
          - { tr: "Kalabalığın içinde bir omuz, bir başka omuz, bir çarşı tentesi; sonra yoksun. Ölçücü durup etrafına bakıyor, cetvelini bir kez havaya kaldırıyor ve indiriyor.", en: "A shoulder in the crowd, another shoulder, a market awning, and then you're gone. The Assessor stops, looks around, raises its rod once, and lowers it." }
          - { tr: "Pencerende gümüş satır değişiyor: [Randevu ertelendi.] Ertelendi, iptal edilmedi.", en: "The silver line in your window changes: [Appointment rescheduled.] Rescheduled. Not canceled." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bir dahaki sefere hazır ol", en: "Be ready next time" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "izle"
            etiket: { tr: "Ölçücüyü uzaktan izle; kimleri ölçüyor?", en: "Tail the Assessor. Who else is it measuring?" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bilgi: "olcucu_listesi"
            sonraki: "@akis"

      - id: "dikkat_75_p3_yanlis"
        paragraflar:
          - { tr: "Ölçücü cetvelini sana tutuyor ve rakamlar akmaya başlıyor; ama akan rakamlar senin değil. {npc:yanki} onlara bir şeyler fısıldıyor ve rakamlar şaşırıyor, birbirine karışıyor, sıfıra iniyor.", en: "The Assessor holds its rod up to you and the numbers start running. Except they aren't your numbers. {npc:yanki} whispers something to them, and the numbers get confused, tangle up, and drop to zero." }
          - { tr: "Ölçücü cetveline uzun süre bakıyor. \"Hiç,\" diyor sonunda. \"Ölçtüğüm şey hiç. İlginç.\" Şapkasını düzeltip gidiyor; adımlarında ilk kez bir tereddüt var.", en: "The Assessor stares at its rod for a long time. \"Nothing,\" it says at last. \"What I measured is nothing. Interesting.\" It straightens its hat and leaves. For the first time, there's a hitch in its stride." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Arkasından gülümse", en: "Smile at its back" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "{npc:yanki|e} teşekkür et", en: "Thank {npc:yanki}" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"

      - id: "dikkat_75_p3_zafer"
        paragraflar:
          - { tr: "Cetvel ikiye kırılıyor ve Ölçücü onunla birlikte; içinden bir avuç gümüş rakam dökülüp sokağa saçılıyor. Çocuklar onları toplamaya koşuyor, sonra ellerinde eriyince korkup bırakıyor.", en: "The rod snaps in two, and the Assessor with it. A handful of silver numbers spills out across the street. Kids run to scoop them up, then drop them in a panic when they melt in their hands." }
          - { tr: "Pencerende gümüş satır yanıp sönüyor: [Ölçüm başarısız. Ölçücü: kayıp. Not düşüldü.]", en: "The silver line in your window blinks: [Measurement failed. Assessor: lost. Noted.]" }
        secenekler:
          - id: "topla"
            etiket: { tr: "Rakamları topla; ne ölçtüğünü öğren", en: "Gather up the numbers. Find out what it measured" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "olcucu_listesi"
              - xp_seviye: 30
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bırak erisin", en: "Let them melt" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "dikkat_75_p3_yenilgi"
        paragraflar:
          - { tr: "Cetvel omzuna değiyor ve bir şey eksiliyor. Ne olduğunu bilmiyorsun; bir anı, bir renk, bir kelime. Dizlerin bükülüyor.", en: "The rod touches your shoulder, and something goes missing. You don't know what. A memory, a color, a word. Your knees buckle." }
          - { tr: "\"Teşekkürler,\" diyor Ölçücü, notunu alıp. \"Beklenenden büyüksünüz. Bu kimsenin işine yaramayacak.\" Gidiyor. Sen yerde, eksik bir şeyle kalıyorsun.", en: "\"Thank you,\" the Assessor says, jotting a note. \"You're larger than expected. That won't do anyone any good.\" It leaves. You stay on the ground, missing something." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; neyin eksildiğini bul", en: "Get up. Figure out what's missing" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { kadim_tehdit: 3 }
            sonraki: "@akis"
          - id: "unut"
            etiket: { tr: "Eksik olanı unut; zaten unutmuşsun", en: "Forget about it. You already did" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { kadim_tehdit: 3 }
            sonraki: "@akis"

  - id: "dikkat_100_p3"
    perde: [3]
    agirlik: 1
    etiketler: ["dikkat", "sistem"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Yama", en: "The Patch" }
    sahne: "dikkat_100_p3_1"
    sahneler:
      - id: "dikkat_100_p3_1"
        paragraflar:
          - { tr: "Dünya bir an donuyor. Gerçekten donuyor: martılar havada, dalgalar yarı kıvrılmış, bir çocuğun gülüşü ağzında asılı. Hareket eden tek şey sensin.", en: "The world freezes. Actually freezes: gulls in midair, waves half-curled, a kid's laugh hanging in her mouth. The only thing still moving is you." }
          - { tr: "Önündeki havada bir dikiş açılıyor ve içinden beyaz, kusursuz, yüzsüz bir şey çıkıyor; elleri olması gereken yerde iki pencere var. Sistem seni bir hata olarak kaydetti. Şimdi hatayı düzeltmeye geldi.", en: "A seam opens in the air in front of you, and something white, flawless and faceless steps through it, with two windows where its hands should be. The System logged you as a bug. Now it's here to fix it." }
          - metin: { tr: "{npc:yanki} kafanın içinde bağırıyor, ilk kez gerçekten korkmuş: bu bir yama. beni de siler. bizi siler. dövüş ya da pazarlık et ama bekleme.", en: "{npc:yanki} is screaming in your head, really scared for the first time: that's a patch. it'll wipe me too. it'll wipe us. fight or bargain, but don't wait." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[SİSTEM DÜZELTMESİ: KAPSAM 1]", en: "[SYSTEM CORRECTION: SCOPE 1]" }
            satirlar:
              - { tr: "Hedef: anomali. Yöntem: geri alma. Tahmini süre: bir an.", en: "Target: anomaly. Method: rollback. Estimated duration: one moment." }
              - { tr: "Not: önceki düzeltme girişimleri: 3. Başarı: 0. Bu not gizli olmalıydı.", en: "Note: previous correction attempts: 3. Successes: 0. This note was supposed to be hidden." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Yamayı parçala", en: "Tear the patch apart" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: -2 }
              - savas: { dusmanlar: ["sistem_yamasi@oyuncu+6"], kazan: "dikkat_100_p3_zafer", kaybet: "dikkat_100_p3_yenilgi" }
          - id: "pazarlik"
            etiket: { tr: "\"Benden bir şey al ve git.\"", en: "\"Take something from me and go.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - gizle: 15
              - can: -1000
            sonraki: "dikkat_100_p3_pazarlik"
          - id: "yanki_ver"
            etiket: { tr: "{npc:yanki|i} göster; aradığı o", en: "Point it at {npc:yanki}. That's what it's after" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: -4 }
              - gizle: 20
              - iliski: { yanki: { guven: -30, korku: 20 } }
              - hafiza: { npc: "yanki", id: "olay:dikkat_100_p3", agirlik: -70 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "dikkat_100_p3_ele_ver"

      - id: "dikkat_100_p3_zafer"
        paragraflar:
          - { tr: "Yama kırılıyor; pencereleri paramparça, beyaz gövdesi satır satır siliniyor. Dünya yeniden akmaya başlıyor; martılar kanat çırpıyor, çocuğun gülüşü cümlesini bitiriyor. Kimse bir şey fark etmiyor.", en: "The patch breaks. Its windows shatter, its white body erases line by line. The world starts moving again: the gulls flap, the kid finishes her laugh. Nobody noticed a thing." }
          - { tr: "Pencerende yeni bir satır: [Düzeltme başarısız. Girişim 4. Başarı: 0.] Bir süre bakıyorsun. Sonra satır kendi kendine siliniyor; sanki biri utanmış.", en: "A new line in your window: [Correction failed. Attempt 4. Successes: 0.] You stare at it for a while. Then it deletes itself, like somebody got embarrassed." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Sistem'e gül", en: "Laugh at the System" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -2 }
              - xp_seviye: 60
              - dikkat: -20
            sonraki: "@akis"
          - id: "dusun"
            etiket: { tr: "Üç önceki girişimi düşün", en: "Think about the three attempts before this one" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 50
              - dikkat: -20
              - bilgi: "dort_duzeltme"
            sonraki: "@akis"

      - id: "dikkat_100_p3_yenilgi"
        paragraflar:
          - { tr: "Yamanın penceresi göğsüne değiyor ve bir an hiç var olmamış gibisin. Sonra var oluyorsun; ama bir şey eksik. Pencerende iki seviye geri gitmişsin; dünya bunu bir hata düzeltmesi olarak kaydediyor.", en: "The patch's window touches your chest, and for a moment it's like you never existed. Then you do again, but something's missing. Your window says you dropped two levels, and the world logs it as a bug fix." }
          - { tr: "Yama dikişin içine geri çekiliyor. Sistem işini yaptığını düşünüyor. Yanılıyor; ama biraz haklı.", en: "The patch steps back into its seam. The System thinks it did its job. It's wrong. But it's a little bit right." }
          - metin: { tr: "{npc:yanki} uzun süre sessiz kalıyor. Sonra çok zayıf bir sesle: buradayım. çoğu. çoğu buradayım.", en: "{npc:yanki} is quiet for a long time. Then, very faint: i'm here. most of me. most of me is here." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve yeniden tırman", en: "Get up and climb again" }
            etkiler:
              - ahlak: { duzen: 2 }
              - dikkat: -30
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "\"Kalanını ben taşırım.\"", en: "\"I'll carry the rest of you.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - dikkat: -30
              - iliski: { yanki: { baglilik: 10, guven: 6 } }
            sonraki: "@akis"

      - id: "dikkat_100_p3_pazarlik"
        paragraflar:
          - { tr: "Yama bir an duruyor. Pencereleri önünde bir teklif listesi açıyor: bir anı, bir yıl, bir yetenek, bir isim. Sen bir şey seçmeden önce o seçiyor ve çekip alıyor.", en: "The patch pauses. Its windows open a menu in front of you: a memory, a year, a skill, a name. Before you can pick, it picks for you, and takes." }
          - { tr: "Neyin gittiğini anlamıyorsun. Yalnızca, eski bir şarkının nakaratını artık hatırlamıyorsun. Yama dikişin içine geri dönüyor; pencerende [Düzeltme: kısmi.] yazıyor.", en: "You can't tell what's gone. Just that you can't remember the chorus of an old song anymore. The patch steps back into its seam, and your window reads [Correction: partial.]" }
        secenekler:
          - id: "mirildan"
            etiket: { tr: "Şarkıyı hatırlamaya çalış", en: "Try to remember the song" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - dikkat: -20
            sonraki: "@akis"
          - id: "devam"
            etiket: { tr: "Önemli değil. Devam et", en: "Doesn't matter. Keep moving" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - dikkat: -20
            sonraki: "@akis"

      - id: "dikkat_100_p3_ele_ver"
        paragraflar:
          - { tr: "Yama dönüyor ve bir anda senin içine, {npc:yanki|in} durduğu yere bakıyor. {npc:yanki} kaçıyor; kafanın içinde, köşeden köşeye, hiç duymadığın bir hızla.", en: "The patch turns and looks straight into you, right at where {npc:yanki} lives. {npc:yanki} runs. Inside your head, corner to corner, faster than you've ever heard it move." }
          - { tr: "Yama {npc:yanki|in} bir parçasını kopartıyor ve dikişe geri dönüyor. Dünya akmaya başlıyor. Kafanın içi, ilk kez yıllardır, tuhaf biçimde ferah.", en: "The patch tears off a piece of {npc:yanki} and steps back into the seam. The world starts moving again. The inside of your head feels weirdly roomy, for the first time in years." }
          - { tr: "Sonra bir fısıltı, kırık ve küçük: neden.", en: "Then a whisper, small and broken: why." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "\"Özür dilerim.\"", en: "\"I'm sorry.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - dikkat: -30
              - iliski: { yanki: { guven: 5 } }
            sonraki: "@akis"
          - id: "hayatta"
            etiket: { tr: "\"Hayatta kalmam gerekiyordu.\"", en: "\"I had to stay alive.\"" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - dikkat: -30
            sonraki: "@akis"

  # ================================================================== PERDE 3 KIYIKENT (Gün 181–330)
  # ---------------------------------------------------------------- Ordu: bayrağın altında
  - id: "p3_bayrak_altinda"
    perde: [3]
    bolge: ["kiyikent_liman", "kule_dibi", "sanayi"]
    gun: { min: 185, max: 310 }
    agirlik: 6
    etiketler: ["ordu", "hakimiyet"]
    gerilim: 2
    npc: ["kaya_demir"]
    kart: { tr: "Kapıdaki kuyruk", en: "The Line at Your Door" }
    sahne: "p3_bayrak_1"
    sahneler:
      - id: "p3_bayrak_1"
        paragraflar:
          - { tr: "Sabah kapını açtığında sokağın sonuna kadar uzanan bir kuyruk görüyorsun. Avcılar, kapı temizleyiciler, yarısı Lonca yeleği giymiş gençler, sırtında tüfek taşıyan bir büyükanne. Hepsi sessiz; hepsi senin kapına bakıyor.", en: "When you open your door in the morning, there's a line running all the way down the block. Hunters, Gate sweepers, kids half of them in Guild vests, a grandmother with a rifle slung across her back. All quiet. All looking at your door." }
          - { tr: "Öndeki adam elinde bir kâğıt tutuyor, üstünde yüzlerce imza. \"Senin için savaşmak istiyoruz,\" diyor. \"Fraksiyon için değil. Senin için. Sıralama'da en üstteki adın arkasında durmak istiyoruz.\"", en: "The guy up front is holding a sheet of paper with hundreds of signatures on it. \"We want to fight for you,\" he says. \"Not for a faction. For you. We want to stand behind the name at the top of the Ranking.\"" }
          - metin: { tr: "Kuyruğun sonunda, kısa kesilmiş saçları ve eski askerî postallarıyla, {npc:kaya_demir|in} adamlarından birkaç tanesi de bekliyor. Gözlerini kaçırıyorlar; komutanlarına söylememişler.", en: "At the back of the line, with their buzz cuts and old combat boots, are a few of {npc:kaya_demir|pos} people. They won't meet your eyes. They didn't tell their commander." }
            kosul: { npc_hayatta: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { cha: 180 } }
            metin: { tr: "[ALG] Kuyrukta dört yüz on iki kişi var. Üç yüzü seni bir kurtarıcı olarak görüyor, yüzü bir kalkan olarak. On ikisi gizlice birilerine rapor veriyor.", en: "[PER] Four hundred twelve people in line. Three hundred see you as a savior, a hundred as a shield. Twelve are quietly reporting to somebody." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ordu. bunu hep istedin mi? yoksa ordu seni mi istedi? fark eder.", en: "an army. did you always want one? or did the army want you? it matters." }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Hepsini al; bayrak dikilsin", en: "Take them all. Raise the banner" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -1 }
              - ordu_kazan: 50
              - bayrak: "p3_bayrak_kuruldu"
              - dikkat: 4
              - itibar: { lonca: -4, siginak: -2 }
            sonraki: "p3_bayrak_tore"
          - id: "sec"
            etiket: { tr: "Tek tek bak; yalnızca hazır olanları al", en: "Look at each one. Take only the ready ones" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - ordu: { lonca_avcisi: 25 }
              - bayrak: "p3_bayrak_kuruldu"
              - bilgi: "kuyruktaki_muhbirler"
            sonraki: "p3_bayrak_secim"
          - id: "kaya_konus"
            etiket: { tr: "Önce {npc:kaya_demir|in} adamlarını komutanlarına gönder", en: "Send {npc:kaya_demir|pos} people back to their commander first" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 4 }
              - iliski: { kaya_demir: { saygi: 10, guven: 6 } }
              - ordu_kazan: 30
              - bayrak: "p3_bayrak_kuruldu"
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "p3_bayrak_tore"
          - id: "reddet"
            etiket: { tr: "\"Bana ordu lazım değil. Evlerinize dönün.\"", en: "\"I don't need an army. Go home.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3, duzen: -2 }
              - gizle: 4
            sonraki: "p3_bayrak_red"

      - id: "p3_bayrak_tore"
        paragraflar:
          - { tr: "Öğleden sonra Liman meydanında bir bayrak yükseliyor; kimse onu tasarlamadı, kimse dikmedi. Bez parçası sabah orada değildi; sanki Sistem onu senin adına kendisi asmış.", en: "In the afternoon, a banner goes up in the waterfront square. Nobody designed it. Nobody raised it. That piece of cloth wasn't there this morning; it's like the System hung it in your name all by itself." }
          - { tr: "Altında yeni askerlerin, birbirini tanımayan insanların sırası. Sen geçerken hepsi aynı anda doğruluyor. Bunu kimse onlara öğretmedi.", en: "Under it stand your new troops, people who've never met each other. When you walk past, they all straighten up at the same moment. Nobody taught them that." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[ORDU KURULDU]", en: "[ARMY FORMED]" }
            satirlar:
              - { tr: "Komutan: sen. Sancak: otomatik oluşturuldu. Telif: Sistem'e ait.", en: "Commander: you. Banner: auto-generated. Copyright: property of the System." }
        secenekler:
          - id: "yemin"
            etiket: { tr: "Onlara yemin ettirme; sen onlara et", en: "Don't make them swear. You swear to them" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - ordu_kazan: 10
              - itibar: { siginak: 4 }
            sonraki: "@akis"
          - id: "disiplin"
            etiket: { tr: "İlk emrini ver: sabaha kadar nöbet", en: "Give your first order: watch till dawn" }
            etkiler:
              - ahlak: { duzen: 4 }
              - ordu_kazan: 10
              - itibar: { lonca: 4 }
            sonraki: "@akis"

      - id: "p3_bayrak_secim"
        paragraflar:
          - { tr: "Dört yüz on iki kişinin önünden yürüyorsun. Birine bakıyorsun ve elini kaldırıyor; titriyor, ama gözleri dimdik. Bir başkası kendinden emin gülümsüyor ve cebinde bir telsiz cızırdıyor.", en: "You walk down four hundred twelve people. You look at one, and her hand comes up, shaking, eyes dead steady. Another one smiles like he's got it all figured out, and the radio in his pocket crackles." }
          - { tr: "Akşama kadar yüz kişiyi seçiyorsun; ama yüz doğru kişiyi. On iki muhbiri sessizce kuyruktan çıkarıyorsun; kimse fark etmiyor, en çok da onlar.", en: "By evening you've picked a hundred. The right hundred. You quietly ease the twelve informants out of line. Nobody notices. Them least of all." }
        secenekler:
          - id: "muhbir_geri"
            etiket: { tr: "Muhbirleri sahiplerine geri yolla, yanlış bilgiyle", en: "Send the informants home with bad intel" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "muhbir_ac"
            tur: "aciga_vur"
            etiket: { tr: "Muhbirleri meydanda ifşa et", en: "Out the informants in the square" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, merhamet: -2 }
              - dikkat: 4
              - itibar: { lonca: 4, sessiz_ag: -4 }
            sonraki: "@akis"

      - id: "p3_bayrak_red"
        paragraflar:
          - { tr: "Kuyruk dağılmıyor. Bir saat sonra hâlâ oradalar; iki saat sonra biri çay getiriyor, biri bir sandalye. Akşama doğru kuyruğun başındaki adam yeniden kapını çalıyor.", en: "The line doesn't break up. An hour later they're still there. Two hours later somebody brings tea, somebody brings a chair. Toward evening, the guy at the front knocks on your door again." }
          - { tr: "\"Anladık,\" diyor. \"Sana ordu lazım değil. Ama bize sen lazımsın. Biz yine de burada bekleyeceğiz. İstemezsen bayrak da açmayız.\"", en: "\"We get it,\" he says. \"You don't need an army. But we need you. We'll wait out here anyway. We won't even raise a banner if you don't want one.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Peki. Bayraksız.\"", en: "\"Fine. No banner.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - ordu: { lonca_avcisi: 15 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "sert"
            etiket: { tr: "Kapıyı kapat. Bu kez kesin", en: "Shut the door. For real this time" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -2 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kule 50+ toplumu: Ellinciler
  - id: "p3_ellinciler"
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 190, max: 325 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kule", "toplum", "hakimiyet"]
    gerilim: 2
    kart: { tr: "Ellinci kattakiler", en: "The Fifties" }
    sahne: "p3_ellinciler_1"
    sahneler:
      - id: "p3_ellinciler_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin elli birinci katında bir şehir var. Kimse buna şehir demiyor; Ellinciler buraya \"Kat\" diyor, sanki başka katlar yokmuş gibi. Temiz su, çalışan ışık, kapı canavarlarının ulaşamadığı yükseklikte bahçeler.", en: "There's a city on the Spire's fifty-first floor. Nobody calls it a city. The Fifties call it \"the Floor,\" like there aren't any others. Clean water, working lights, gardens up where the Gate monsters can't reach." }
          - { tr: "Merdivenin başında bir kapı var, kapıda iki C kademesi muhafız. Kapının iç tarafına küçük harflerle bir tabela asılmış: [Kademe B altı: hizmet girişini kullanınız.]", en: "At the top of the stairs there's a gate with two C-Grade guards on it. On the inside of the gate hangs a little sign: [Below B-Grade: please use the service entrance.]" }
          - { tr: "Muhafızlardan biri sana bakıyor, sonra penceresine. Rengi atıyor. Sonra diğerini dürtüyor ve ikisi birden kapıyı açıyor, eğilerek.", en: "One of the guards looks at you, then at his window. The color drains out of his face. He elbows the other one, and they both swing the gate open, bowing." }
          - metin: { tr: "Kapının dibinde, merdivenin sahanlığında, on bir yaşında bir kız oturuyor; sırtında bir çanta, elinde bir kapı kristali. E kademesi. İçeri alınmayı bekliyor; anlaşılan günlerdir.", en: "On the landing at the foot of the gate sits an eleven-year-old girl with a backpack and a Gate crystal in her hand. E-Grade. Waiting to be let in. For days, by the look of it." }
            kosul: { gorunen_seviye_min: 1 }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "[ALG] Kızın elindeki kristal B kademesi bir kapıdan. Onu kendi başına kapatmış. Kademesi E, ama yaptığı şey değil.", en: "[PER] The crystal in the girl's hand came out of a B-Grade Gate. She closed it herself. She's E-Grade. What she did isn't." }
        secenekler:
          - id: "kizla"
            etiket: { tr: "Kızın elinden tut; ikiniz birlikte girin", en: "Take the girl's hand. You go in together" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - bayrak: "p3_ellinci_kiz"
              - dikkat: 3
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 6, max: 14 } }
            sonraki: "p3_ellinciler_ic"
          - id: "tabela"
            tur: "gosteris"
            etiket: { tr: "Tabelayı tek parmakla sök", en: "Pull the sign off with one finger" }
            gerekli: { stat: { str: 200 } }
            etkiler:
              - ahlak: { duzen: -4, insanlik: -1 }
              - dikkat: 5
              - itibar: { siginak: 4, lonca: -3 }
            sonraki: "p3_ellinciler_ic"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Görünen seviyeni düşür; hizmet girişinden gir", en: "Drop your visible level. Use the service entrance" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: 2 }
              - bilgi: "ellinci_kat_hizmet"
            sonraki: "p3_ellinciler_hizmet"

      - id: "p3_ellinciler_ic"
        yer: "kule"
        paragraflar:
          - { tr: "İçeride Kat seni bir kraliyet ziyaretçisi gibi karşılıyor. Temiz giysili bir kadın, Kat'ın \"Sözcüsü\", sana elma suyu ikram ediyor; gerçek elmalardan. Birkaç yüz B kademesi insan pencerelerden bakıyor.", en: "Inside, the Floor greets you like visiting royalty. A woman in clean clothes, the Floor's \"Speaker,\" offers you apple juice. Real apples. A few hundred B-Grades watch from the windows." }
          - { tr: "\"Burada bir yeriniz var,\" diyor Sözcü. \"En üst katta. Aşağıdaki karmaşayı unutun. Sıralama'nın birincisi aşağıda yaşamamalı.\"", en: "\"There's a place for you here,\" the Speaker says. \"Top floor. Forget the mess down there. Number One on the Ranking shouldn't be living downstairs.\"" }
          - metin: { tr: "Kız elini hâlâ bırakmamış. Sözcü ona bakıyor, sonra sana, sonra yine ona; gülümsemesi bir an çatlıyor.", en: "The girl still hasn't let go of your hand. The Speaker looks at her, then at you, then at her again, and her smile cracks for a second." }
            kosul: { bayrak: "p3_ellinci_kiz" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kat'ta bir oda kabul et", en: "Accept a room on the Floor" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - itibar: { lonca: 5, siginak: -5 }
              - bayrak: "p3_ellinci_oda"
            sonraki: "@akis"
          - id: "kapi_ac"
            etiket: { tr: "\"Kapı bundan sonra herkese açık.\"", en: "\"From now on, that gate's open to everybody.\"" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - bayrak: "p3_ellinci_kapi_acildi"
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 8 }
            sonraki: "p3_ellinciler_acilis"
          - id: "kiz_birak"
            etiket: { tr: "Kızı Kat'a bırak; ona bir oda sen ödersin", en: "Leave the girl on the Floor. You pay for her room" }
            goster: { bayrak: "p3_ellinci_kiz" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - kredi: -500
            sonraki: "@akis"

      - id: "p3_ellinciler_acilis"
        yer: "kule"
        paragraflar:
          - { tr: "Söz merdivenden aşağı, kat kat yayılıyor. Akşama doğru ilk aileler tırmanmaya başlıyor; ellerinde battaniyeler, çocuklarının elleri. Muhafızlar onlara bakıyor, sonra sana; sonra kenara çekiliyor.", en: "Word spreads down the stairs, floor by floor. By evening the first families start climbing up, blankets in their arms, kids by the hand. The guards look at them, then at you. Then they step aside." }
          - { tr: "Sözcü yanına geliyor. \"Bunu düzeltmek aylar alacak,\" diyor; öfkeli mi, rahatlamış mı anlamıyorsun. \"Su yetmeyecek. Yer yetmeyecek.\"", en: "The Speaker comes up beside you. \"This is going to take months to fix,\" she says. You can't tell if she's angry or relieved. \"There won't be enough water. There won't be enough room.\"" }
        secenekler:
          - id: "yetecek"
            etiket: { tr: "\"Yetecek. Ben getiririm.\"", en: "\"There'll be enough. I'll bring it.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - ordu_kazan: 15
            sonraki: "@akis"
          - id: "ogrenin"
            etiket: { tr: "\"O zaman paylaşmayı öğrenin.\"", en: "\"Then learn to share.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
            sonraki: "@akis"

      - id: "p3_ellinciler_hizmet"
        yer: "kule"
        paragraflar:
          - { tr: "Hizmet girişi bir çamaşırhanenin arkasından geçiyor. Burada kimse temiz giymiyor; D ve E kademesi insanlar Kat'ın çamaşırını yıkıyor, yemeğini pişiriyor, çöpünü elli kat aşağı taşıyor.", en: "The service entrance runs past the back of a laundry. Nobody's dressed clean back here. D- and E-Grades wash the Floor's sheets, cook its food, haul its trash fifty floors down." }
          - { tr: "Biri sana bir kova uzatıyor. \"Yenisin? Kuyu suyu yirmi ikinci katta. Acele et; Sözcü bugün misafir bekliyor. Sıralama'nın birincisi gelecekmiş.\"", en: "Somebody hands you a bucket. \"New? Well water's on twenty-two. Hurry up. The Speaker's got a guest today. Number One on the Ranking, supposedly.\"" }
        secenekler:
          - id: "kova"
            etiket: { tr: "Kovayı al; bir gün burada çalış", en: "Take the bucket. Work a day down here" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - itibar: { siginak: 5 }
              - tohum: { olay: "p3_kademe_borsasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "ortaya_cik"
            tur: "aciga_vur"
            etiket: { tr: "Kovayı bırak ve kim olduğunu göster", en: "Put down the bucket and show them who you are" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3, merhamet: 2 }
              - itibar: { siginak: 6, lonca: -3 }
            sonraki: "p3_ellinciler_acilis"

  # ---------------------------------------------------------------- Küresel Sıralama'nın tepesi
  - id: "p3_siralama_zirvesi"
    perde: [3]
    bolge: ["kule_dibi", "tepe"]
    gun: { min: 200, max: 325 }
    agirlik: 4
    etiketler: ["siralama", "hakimiyet"]
    gerilim: 3
    npc: ["aras_kurt"]
    kart: { tr: "İlk Ona Masası", en: "The Top Ten Table" }
    sahne: "p3_zirve_1"
    sahneler:
      - id: "p3_zirve_1"
        paragraflar:
          - { tr: "Bir davet geliyor; kâğıt değil, Sistem penceresi. Altında dokuz imza var, her biri Küresel Sıralama'nın ilk onundan bir isim: [İlk On Masası. Bu gece. Tepe, eski rasathane.]", en: "An invitation shows up. Not paper. A System window, with nine signatures under it, every one a name from the Global Ranking's top ten: [The Top Ten Table. Tonight. The Heights, the old observatory.]" }
          - { tr: "Onuncu imza yeri boş. Senin için. Sıralama'nın en üstündeki satır her zamanki gibi titriyor; görünen ve gerçek seviyen arasında bir yerde.", en: "The tenth signature line is blank. Yours. The top line of the Ranking is flickering like always, somewhere between your visible level and your real one." }
          - metin: { tr: "Davetin altında küçük bir not var, el yazısıyla: \"Gel. Herkes senin gerçekten ne kadar uzakta olduğunu merak ediyor. Ben hariç. Ben biliyorum.\" İmza yok; gerekmiyor.", en: "There's a little handwritten note at the bottom: \"Come. Everybody wants to know how far ahead you really are. Except me. I already know.\" No signature. Doesn't need one." }
            kosul: { npc_hayatta: "aras_kurt" }
        secenekler:
          - id: "git"
            etiket: { tr: "Rasathaneye git", en: "Go to the observatory" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bolge: "tepe"
            sonraki: "p3_zirve_masa"
          - id: "gizli_git"
            tur: "gizle"
            etiket: { tr: "Git, ama görünen seviyeni yedinci sıraya indir", en: "Go, but drop your visible level down to seventh" }
            etkiler:
              - gizle: 8
              - ahlak: { duzen: -1, insanlik: 1 }
              - bolge: "tepe"
              - bayrak: "p3_zirve_gizli"
            sonraki: "p3_zirve_masa"
          - id: "gitme"
            etiket: { tr: "Daveti kapat; ilk on seni ilgilendirmez", en: "Close the invite. The top ten isn't your business" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { aras_kurt: { saygi: -5 } }
            sonraki: "p3_zirve_gitmedi"

      - id: "p3_zirve_masa"
        yer: "tepe"
        paragraflar:
          - { tr: "Eski rasathanenin kubbesi yarı yarıya açık; teleskop Kadim gemisine çevrilmiş. Etrafında dokuz kişi oturuyor: bir eski polis, bir öğretmen, bir yüzme şampiyonu, kimsenin adını bilmediği iki kardeş. Hepsi B kademesi, hepsi bir zamanlar sıradan.", en: "The old observatory's dome is half open, the telescope trained on the Ancient ship. Nine people sit around it: an ex-cop, a teacher, a swimming champ, two siblings nobody knows the names of. All B-Grade. All of them ordinary once." }
          - metin: { tr: "Masanın başında {npc:aras_kurt} oturuyor, ayaklarını masaya uzatmış. Seni görünce sırıtıyor. \"İşte,\" diyor diğerlerine. \"Söylemiştim. Sayılar yalan söylüyor.\"", en: "{npc:aras_kurt} has the head of the table, feet up on it. He grins when he sees you. \"There,\" he tells the others. \"Told you. The numbers lie.\"" }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Görünen seviyen yedinci sıradaki adamınkinden bir eksik. Masada biri sana bir sandalye itiyor, alt uçtan. Kimse sana bakmıyor.", en: "Your visible level is one below the seventh guy's. Somebody shoves a chair your way, at the far end. Nobody looks at you." }
            kosul: { bayrak: "p3_zirve_gizli" }
          - { tr: "Masanın konusu basit: Kadimler geldiğinde ilk onun her biri bir mahalleyi tutacak. Kim hangisini? Ve en önemlisi: kim emir verecek?", en: "The agenda's simple: when the Ancients come, each of the top ten holds a neighborhood. Who gets which one? And more important: who gives the orders?" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Masadaki dokuz kişiden ikisi Kadimler'le konuşuyor; cebinde gümüş bir pul taşıyanlar. Biri öğretmen.", en: "[PER] Two of the nine people at this table are talking to the Ancients. They're the ones with silver tokens in their pockets. One of them is the teacher." }
        secenekler:
          - id: "emir"
            tur: "gosteris"
            etiket: { tr: "Ayağa kalk. Gerçek seviyeni bir an göster", en: "Stand up. Show your real level for one second" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: 4, insanlik: -2 }
              - bayrak: "p3_ilk_on_lideri"
              - iliski: { aras_kurt: { saygi: 10, korku: 5 } }
              - ordu_kazan: 20
            sonraki: "p3_zirve_son"
          - id: "esit"
            etiket: { tr: "\"Kimse emir vermeyecek. Mahalleleri çekin.\"", en: "\"Nobody gives orders. Draw lots for the neighborhoods.\"" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 2 }
              - iliski: { aras_kurt: { guven: 5 } }
              - itibar: { siginak: 3 }
            sonraki: "p3_zirve_son"
          - id: "muhbir"
            etiket: { tr: "Gümüş pulları masaya dök", en: "Dump the silver tokens out on the table" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { kadim_tehdit: -4 }
              - bilgi: "ilk_ondaki_muhbirler"
              - iliski: { aras_kurt: { saygi: 8 } }
            sonraki: "p3_zirve_son"

      - id: "p3_zirve_son"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece yarısı masadan kalkıyorsunuz. Sıralama'nın ilk onu ilk kez aynı haritanın üstünde anlaşmış: renkli kalemlerle çizilmiş on mahalle, on isim. Seninki en ortada.", en: "You all get up from the table around midnight. For the first time, the Ranking's top ten agreed on the same map: ten neighborhoods in colored marker, ten names. Yours is dead center." }
          - metin: { tr: "{npc:aras_kurt} kapıda seni bekliyor. \"İkinci sıra bana yakışıyor mu sence?\" diye soruyor, şakayla karışık. Cevabını beklemeden merdivenlerden iniyor.", en: "{npc:aras_kurt} is waiting for you at the door. \"Think number two looks good on me?\" he asks, half joking. He's down the stairs before you can answer." }
            kosul: { npc_hayatta: "aras_kurt" }
        secenekler:
          - id: "harita"
            etiket: { tr: "Haritayı al; bir kopyası Konsey'e gitsin", en: "Take the map. Send a copy to the Council" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 4, lonca: 4 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "aras_pesinden"
            etiket: { tr: "{npc:aras_kurt|in} arkasından seslen: \"Yakışıyor.\"", en: "Call after {npc:aras_kurt}: \"Looks great on you.\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { aras_kurt: { guven: 6, saygi: 4 } }
            sonraki: "@akis"

      - id: "p3_zirve_gitmedi"
        paragraflar:
          - { tr: "Gece yarısı pencerende Sıralama değişiyor: ilk on bir harita yayımlamış, on mahalle, on isim. Ortadaki mahallenin üstünde bir soru işareti var.", en: "Around midnight, the Ranking updates in your window: the top ten published a map. Ten neighborhoods, ten names. Over the one in the middle there's a question mark." }
          - { tr: "Sabah, soru işaretli mahallenin sakinleri kapında. Mahallelerini kimin tutacağını bilmek istiyorlar.", en: "In the morning, the people from the question-mark neighborhood are at your door. They want to know who's going to hold their streets." }
        secenekler:
          - id: "ben"
            etiket: { tr: "\"Ben tutarım.\"", en: "\"I will.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "kendiniz"
            etiket: { tr: "\"Kendiniz tutun. Size öğretirim.\"", en: "\"Hold it yourselves. I'll teach you how.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - ordu: { lonca_avcisi: 10 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Çok-evrenden dönenler
  - id: "p3_donenler"
    perde: [3]
    bolge: ["kule_dibi"]
    gun: { min: 205, max: 330 }
    kosul: { bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["cok_evren", "karantina"]
    gerilim: 3
    npc: ["elif_sari"]
    kart: { tr: "Geri dönenler", en: "The Ones Who Came Back" }
    sahne: "p3_donenler_1"
    sahneler:
      - id: "p3_donenler_1"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci kattaki geçitten bir sefer ekibi geri dönüyor: on dört kişi gitmişti, dokuz kişi geliyor. Derileri tuzdan çatlamış, gözleri başka bir güneşe alışmış; birinin kolu artık bir insan kolu değil.", en: "An expedition comes back through the gate on the fiftieth floor: fourteen went, nine come back. Their skin's cracked from salt, their eyes used to another sun, and one of them's arm isn't a human arm anymore." }
          - { tr: "Aralarında bir çocuk var. Kimseye benzemiyor; teni mercan renginde, parmakları perdeli. Ekip onu Batık Takımada'dan getirmiş. \"Bırakamazdık,\" diyor ekibin başındaki kadın. \"Dünyası boğuluyordu.\"", en: "There's a kid with them. Doesn't look like anybody: coral-colored skin, webbed fingers. The crew brought her back from the Drowned Reach. \"We couldn't leave her,\" says the woman leading them. \"Her whole world was drowning.\"" }
          - { tr: "Kule Dibi'nin kalabalığı geçidin önünde toplanmış. Biri \"Karantina!\" diye bağırıyor; biri \"Canavar!\" Biri çocuğa doğru bir taş fırlatıyor.", en: "The Spire Plaza crowd has packed in around the gate. Somebody yells \"Quarantine!\" Somebody else yells \"Monster!\" Somebody throws a rock at the kid." }
          - metin: { tr: "{npc:elif_sari} kalabalığı yarıp geliyor, elinde çantası. \"Kimse kimseye dokunmuyor,\" diyor. \"Önce muayene.\"", en: "{npc:elif_sari} pushes through the crowd, bag in hand. \"Nobody touches anybody,\" she says. \"Exams first.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Çocuk hasta değil. Kolu değişen adam hasta; içindeki şey hâlâ büyüyor ve aç.", en: "[PER] The kid isn't sick. The guy with the changed arm is. Whatever's inside him is still growing. And it's hungry." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocuğun bir sistemi yok. hiç olmamış. düşünsene. bir hiç olmadan doğmuş biri.", en: "the kid doesn't have a system. never did. think about that. somebody born without one." }
        secenekler:
          - id: "tasi_tut"
            tur: "gosteris"
            etiket: { tr: "Taşı havada yakala ve atana geri ver", en: "Catch the rock midair and hand it back" }
            gerekli: { stat: { agi: 200 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - dikkat: 3
              - itibar: { siginak: 4 }
            sonraki: "p3_donenler_muayene"
          - id: "kol"
            etiket: { tr: "Kolu değişen adama bak", en: "Check out the guy with the changed arm" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "batik_tohum"
            sonraki: "p3_donenler_kol"
          - id: "karantina"
            etiket: { tr: "Hepsini karantinaya al; çocuk da", en: "Quarantine all of them. Kid included" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - itibar: { lonca: 4, siginak: -3 }
            sonraki: "p3_donenler_kol"

      - id: "p3_donenler_muayene"
        yer: "kule"
        paragraflar:
          - { tr: "Kalabalık susuyor. Taşı atan adam elindeki taşa bakıyor, sonra sana; sonra kalabalığın içinde kayboluyor. Çocuk sana bakıyor ve perdeli eliyle yanağına dokunuyor; bir selam mı, bir soru mu, bilmiyorsun.", en: "The crowd goes quiet. The guy who threw the rock looks at the rock in his hand, then at you, then disappears into the crowd. The kid looks at you and touches your cheek with a webbed hand. A greeting or a question, you can't tell." }
          - { tr: "Ama arkada, kolu değişen adam kıvranmaya başlıyor. Kolundaki mercan derisi omzuna, boynuna doğru tırmanıyor.", en: "But in the back, the guy with the changed arm starts to convulse. The coral skin on his arm is creeping up toward his shoulder, his neck." }
        secenekler:
          - id: "adam"
            etiket: { tr: "Adama koş", en: "Run to the man" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "p3_donenler_kol"
          - id: "cocugu_cikar"
            etiket: { tr: "Önce çocuğu kalabalıktan çıkar", en: "Get the kid out of the crowd first" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "p3_mercan_cocuk"
            sonraki: "p3_donenler_kol"

      - id: "p3_donenler_kol"
        yer: "kule"
        paragraflar:
          - { tr: "Adamın kolundan bir şey kopuyor ve ayağa kalkıyor: mercan ve kemikten, insan boyunda, ağzı olmayan bir şey. Batık Takımada onu bir yolcu gibi buraya göndermiş; içinde tuzlu bir açlık.", en: "Something tears loose from the man's arm and stands up: coral and bone, human-sized, no mouth. The Drowned Reach sent it here like a stowaway. There's a salt-water hunger in it." }
          - { tr: "Adam yere yığılıyor ama nefes alıyor. Kalabalık çığlık atarak dağılıyor. Şey çocuğa dönüyor; tanıdığı bir şeye döner gibi.", en: "The man collapses, but he's breathing. The crowd scatters, screaming. The thing turns toward the kid, like it's turning toward something it knows." }
        secenekler:
          - id: "dov"
            etiket: { tr: "Aralarına gir", en: "Get between them" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { saygi: 6 } }
              - savas: { dusmanlar: ["mercan_yolcu@dunya+20"], kazan: "p3_donenler_son", kaybet: "p3_donenler_yenilgi" }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Bir bakışla tuzunu kurut", en: "Dry the salt out of it with one look" }
            gerekli: { stat: { wil: 240 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 3
              - xp_seviye: 15
            sonraki: "p3_donenler_son"

      - id: "p3_donenler_son"
        yer: "kule"
        paragraflar:
          - { tr: "Mercan şey bir avuç beyaz kuma dönüşüyor. Geçidin önü sessiz; yalnızca dönen ekip, yerde nefes alan adam ve çocuk kalmış.", en: "The coral thing crumbles into a handful of white sand. It's quiet in front of the gate now. Just the crew that came back, the man breathing on the floor, and the kid." }
          - metin: { tr: "{npc:elif_sari} adamın nabzını tutuyor, sonra çocuğa bakıyor. \"İkisi de yaşayacak,\" diyor. \"Ama biri burada ait olmadığı bir yerde yaşayacak. Hangisi olduğuna sen karar ver.\"", en: "{npc:elif_sari} checks the man's pulse, then looks at the kid. \"They'll both live,\" she says. \"But one of them is going to be living somewhere they don't belong. You decide which.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "sigin"
            etiket: { tr: "Çocuğu Sığınak'a götür", en: "Take the kid to the Haven" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - bayrak: "p3_mercan_cocuk"
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 8, baglilik: 5 } }
              - tohum: { olay: "p3_kademe_ailesi", gecikme: { min: 5, max: 12 } }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Çocuğu kendi dünyasına geri gönder", en: "Send the kid back to her own world" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - iliski: { elif_sari: { guven: -4 } }
            sonraki: "@akis"
          - id: "yaninda"
            etiket: { tr: "Çocuk seninle kalsın", en: "The kid stays with you" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - bayrak: "p3_mercan_cocuk"
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"

      - id: "p3_donenler_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Mercan şeyin tuzu yaralarına doluyor; nefesin bir an tuzlu suya dönüyor. Geri çekiliyorsun ve o, çocuğu kapıp geçide doğru kaçıyor.", en: "The coral thing's salt gets into your wounds, and for a second your breath turns to seawater. You fall back, and it grabs the kid and bolts for the gate." }
          - { tr: "Son anda geçit muhafızları onu mızraklarıyla tutuyor. Çocuk kurtuluyor. Muhafızlardan ikisi kurtulamıyor.", en: "At the last second, the gate guards pin it with their spears. The kid gets free. Two of the guards don't." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; muhafızların adlarını öğren", en: "Get up. Learn the guards' names" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"
          - id: "cocuk"
            etiket: { tr: "Çocuğu Sığınak'a götür", en: "Take the kid to the Haven" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "p3_mercan_cocuk"
            sonraki: "@akis"

  # ---------------------------------------------------------------- Körfezin leviatanı
  - id: "p3_korfez_leviatani"
    perde: [3]
    bolge: ["kiyikent_liman", "kordon"]
    gun: { min: 181, max: 300 }
    agirlik: 5
    etiketler: ["deniz", "hakimiyet", "kesif"]
    gerilim: 3
    kart: { tr: "Körfezdeki sırt", en: "The Back in the Bay" }
    sahne: "p3_leviatan_1"
    sahneler:
      - id: "p3_leviatan_1"
        paragraflar:
          - { tr: "Üç haftadır balıkçı kayıkları körfezden boş dönüyor. Sonra hiç dönmüyor. Bu sabah suyun ortasında bir ada beliriyor; ada nefes alıyor.", en: "For three weeks the fishing boats have been coming back from the bay empty. Then they stopped coming back at all. This morning an island shows up in the middle of the water. The island is breathing." }
          - { tr: "İskelede yaşlı bir balıkçı ağlarını katlıyor, eli titremeden. \"Benim dedem bunun gibisini anlatırdı,\" diyor. \"Ama dedem yalancıydı. Bu yalan değil.\"", en: "On the pier, an old fisherman is folding his nets, hands perfectly steady. \"My granddad used to tell stories about something like this,\" he says. \"But my granddad was a liar. This isn't a lie.\"" }
          - { tr: "Liman'ın yarısı kıyıda toplanmış; kimisi zıpkınla, kimisi dua ederek. Fraksiyonların her biri birini yollamış: biri öldürmek, biri ehlileştirmek, biri ona tapmak istiyor.", en: "Half the waterfront's crowded onto the shore, some with harpoons, some praying. Every faction sent somebody: one wants it dead, one wants it tamed, one wants to worship it." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Körfez Leviatanı · B kademesi", en: "[ANALYSIS] Bay Leviathan · B-Grade" }
            satirlar:
              - { tr: "Aç. Yaşlı. Kendi okyanusundan bir kapıyla buraya düşmüş ve geri dönemiyor.", en: "Hungry. Old. Fell through a Gate from its own ocean and can't get back." }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "[ALG] Solungaçlarından birine bir kapı kristali saplanmış. Acıdan saldırıyor; açlıktan değil.", en: "[PER] There's a Gate crystal jammed in one of its gills. It's lashing out from pain, not hunger." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o da bir yankı. başka bir denizin. kimse onu buraya çağırmadı.", en: "it's an echo too. from some other sea. nobody called it here." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Suya gir; leviatanla yüzleş", en: "Get in the water. Face the leviathan" }
            etkiler:
              - bolge: "kordon"
              - savas: { dusmanlar: ["korfez_leviatani@oyuncu+3"], ortam: ["su"], kazan: "p3_leviatan_zafer", kaybet: "p3_leviatan_yenilgi" }
          - id: "suyun_ustu"
            tur: "gosteris"
            etiket: { tr: "Suyun üstünde yürü ve kristali sök", en: "Walk across the water and pull the crystal out" }
            gerekli: { stat: { agi: 220 } }
            etkiler:
              - dikkat: 5
              - bayrak: "p3_leviatan_kurtarildi"
              - xp_seviye: 25
            sonraki: "p3_leviatan_sakin"
          - id: "balikci"
            etiket: { tr: "Önce balıkçıya dedesinin hikâyesini sor", en: "Ask the fisherman about his granddad's story first" }
            etkiler:
              - bilgi: "leviatan_hikayesi"
            sonraki: "p3_leviatan_hikaye"

      - id: "p3_leviatan_hikaye"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Dedem derdi ki,\" diye başlıyor balıkçı, \"denizden gelen her büyük şey bir şey kaybetmiştir. Yavrusunu, yolunu, sesini. Bulursan gider. Bulamazsan seni de kaybeder.\"", en: "\"My granddad used to say,\" the fisherman starts, \"every big thing that comes out of the sea has lost something. Its young, its way, its voice. Find it, and it leaves. Don't, and it loses you too.\"" }
          - { tr: "Gözlerini suya dikiyor. \"Belki yalan değildi. Belki sadece kimse dinlememişti.\"", en: "He fixes his eyes on the water. \"Maybe he wasn't lying. Maybe nobody was listening.\"" }
        secenekler:
          - id: "kristal"
            etiket: { tr: "Kaybettiği şeyi ara: solungacına bak", en: "Look for what it lost. Check its gills" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - bayrak: "p3_leviatan_kurtarildi"
              - xp_seviye: 20
            sonraki: "p3_leviatan_sakin"
          - id: "savas"
            etiket: { tr: "Hikâye güzel; ama insanlar ölüyor", en: "Nice story. People are dying, though" }
            etkiler:
              - bolge: "kordon"
              - savas: { dusmanlar: ["korfez_leviatani@oyuncu+3"], ortam: ["su"], kazan: "p3_leviatan_zafer", kaybet: "p3_leviatan_yenilgi" }

      - id: "p3_leviatan_sakin"
        yer: "kordon"
        paragraflar:
          - { tr: "Kristal solungaçtan sökülüyor ve suya kan değil, ışık yayılıyor. Leviatan bir süre kıpırdamadan kalıyor. Sonra başını, bir kilise kadar büyük başını, sana çeviriyor.", en: "The crystal comes out of the gill, and what spills into the water isn't blood. It's light. The leviathan goes still for a while. Then it turns its head, a head the size of a church, toward you." }
          - { tr: "Gözü bir otobüs kadar. İçinde kendi yansımanı görüyorsun; küçük, yalnız, suyun üstünde dikilen bir figür. Sonra derin, kemiklerine işleyen bir ses: teşekkür bu mu, yoksa bir soru mu, bilmiyorsun.", en: "Its eye is the size of a bus. You can see yourself in it: a little figure standing on the water, alone. Then a deep sound that goes right into your bones. Thanks, or a question. You can't tell." }
        secenekler:
          - id: "bagla"
            etiket: { tr: "Elini uzat; senin olsun", en: "Hold out your hand. Make it yours" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - ordu: { evcil_canavar: 1 }
              - ordu_kazan: 10
              - itibar: { lonca: 4, yukselenler: 6 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "serbest"
            etiket: { tr: "Kapıyı aç; kendi denizine dönsün", en: "Open a Gate. Let it go home" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6 }
              - efsane: "canavari_bagisladi"
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_leviatan_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Leviatan son bir kez suyun üstüne kalkıyor ve yavaşça batıyor; dalgası Kordon'un taşlarını aşıp sokaklara kadar geliyor. Sonra körfez sakinleşiyor, ilk kez haftalardır.", en: "The leviathan rises out of the water one last time and slowly sinks. The wave it throws clears the Esplanade's stones and rolls up into the streets. Then the bay goes calm, for the first time in weeks." }
          - { tr: "Akşam olmadan ilk kayıklar suya iniyor. Yaşlı balıkçı ağını atıyor ve ağ doluyor. Sana bakmıyor; yalnızca şapkasını çıkarıyor.", en: "Before evening, the first boats are back on the water. The old fisherman casts his net and it comes up full. He doesn't look at you. He just takes his hat off." }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Leviatanın etini bütün Liman'a dağıt", en: "Hand out the leviathan meat to the whole waterfront" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 5 }
              - esya: { leviatan_pulu: 2 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"
          - id: "ganimet"
            etiket: { tr: "Pulları ve kemikleri Lonca'ya sat", en: "Sell the scales and bones to the Guild" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - kredi: 3000
              - esya: { leviatan_pulu: 4 }
              - itibar: { lonca: 5 }
            sonraki: "@akis"

      - id: "p3_leviatan_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Kuyruğu seni suyun dibine çakıyor. Tuz ciğerlerine doluyor ve dünya yeşile kesiyor. Bir şey seni yakandan tutup yukarı çekiyor: yaşlı balıkçının kancası.", en: "Its tail slams you to the bottom. Salt floods your lungs and the world goes green. Something hooks your collar and hauls you up: the old fisherman's gaff." }
          - { tr: "Leviatan açığa doğru yüzüyor; yaralı, öfkeli, ama gidiyor. Bir süre geri gelmeyecek.", en: "The leviathan swims out to open water, wounded and angry, but going. It won't be back for a while." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Balıkçıya teşekkür et", en: "Thank the fisherman" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "tekrar"
            etiket: { tr: "\"Geri gelecek. Ben de.\"", en: "\"It'll be back. So will I.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kademe borsası (Sanayi)
  - id: "p3_kademe_borsasi"
    perde: [3]
    bolge: ["sanayi"]
    gun: { min: 181, max: 320 }
    agirlik: 5
    etiketler: ["ekonomi", "sanayi", "kademe"]
    gerilim: 2
    npc: ["kaya_demir"]
    kart: { tr: "Kademe Borsası", en: "The Grade Exchange" }
    sahne: "p3_borsa_1"
    sahneler:
      - id: "p3_borsa_1"
        paragraflar:
          - { tr: "Sanayi'deki eski tekstil fabrikasının avlusunda bir tahta asılı; üstünde tebeşirle fiyatlar: [D'den C'ye taşıma: 4000 kredi. C'den B'ye: 20 000. Garanti yok.] Altında bir kuyruk.", en: "In the yard of the old textile mill in the Ironworks hangs a chalkboard with prices on it: [Carry D to C: 4,000 credits. C to B: 20,000. No guarantees.] There's a line under it." }
          - { tr: "Kademe Borsası böyle çalışıyor: yüksek kademeli avcılar, parası olanları kapılara götürüyor, canavarları yarı ölü bırakıyor, son darbeyi müşteriye vurduruyor. Müşteri seviye atlıyor. Bazen.", en: "That's how the Grade Exchange works: high-Grade hunters take paying customers into Gates, beat the monsters half to death, and let the customer land the killing blow. Customer levels up. Sometimes." }
          - { tr: "Kuyruğun önünde bir baba, oğlunun kolundan tutmuş. Oğlan on altısında, D kademesi, korkudan beti benzi atmış. Baba tahtaya bakıyor, sonra cüzdanına.", en: "At the front of the line, a dad's holding his son by the arm. The kid's sixteen, D-Grade, pale with fear. The dad looks at the board, then at his wallet." }
          - metin: { tr: "Borsanın sahibi, Lonca yeleği giymiş biri, tahtanın yanında bekliyor. {npc:kaya_demir|in} izni olmadan burada hiçbir tezgâh açılmaz; o da bunu biliyor.", en: "The Exchange's owner, a guy in a Guild vest, is waiting by the board. No stall opens out here without {npc:kaya_demir|pos} say-so, and he knows it." }
            kosul: { npc_hayatta: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "[ALG] Tahtadaki 'garanti yok' satırının altında silinmiş bir satır daha var: [Kayıp oranı: %18.] Biri yeni silmiş.", en: "[PER] Under the 'no guarantees' line, there's another line that's been wiped off: [Loss rate: 18%.] Somebody erased it recently." }
        secenekler:
          - id: "ucretsiz"
            etiket: { tr: "Oğlanı sen götür; para alma", en: "Take the kid in yourself. No charge" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - xp_seviye: 10
            sonraki: "p3_borsa_kapi"
          - id: "tahta"
            tur: "aciga_vur"
            etiket: { tr: "Silinen satırı yeniden yaz", en: "Chalk the erased line back up" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, merhamet: 2 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: -5, siginak: 5 }
            sonraki: "p3_borsa_kapanis"
          - id: "ortak"
            etiket: { tr: "Borsaya ortak ol; bu iş büyüyebilir", en: "Buy into the Exchange. This could get big" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2, duzen: 2 }
              - kredi: 4000
              - bayrak: "p3_borsa_ortagi"
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_borsa_kapi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kapının içinde C kademesi bir kapı tazısı var; oğlanın dizleri titriyor. Tazıyı yere seriyorsun ve son darbeyi ona bırakıyorsun. Oğlan kılıcını kaldırıyor, indiremiyor.", en: "Inside the Gate there's a C-Grade Gate hound, and the kid's knees are shaking. You pin the hound and leave the last blow to him. He raises his blade and can't bring it down." }
          - { tr: "\"Ben bunu istemiyorum,\" diyor, ağlamaklı. \"Babam istiyor. Ben... ben ekmek yapmak istiyordum.\"", en: "\"I don't want this,\" he says, close to tears. \"My dad does. I... I wanted to be a baker.\"" }
        secenekler:
          - id: "vur"
            etiket: { tr: "\"Vur. Hayatta kalman için.\"", en: "\"Do it. So you stay alive.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - ordu: { lonca_avcisi: 1 }
            sonraki: "@akis"
          - id: "firin"
            etiket: { tr: "Tazıyı kendin bitir; oğlanı bir fırına götür", en: "Finish the hound yourself. Walk the kid to a bakery" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - kredi: -300
              - tohum: { olay: "p3_kademe_ailesi", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_borsa_kapanis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tebeşir tahtaya değdiği anda kuyruk dağılmaya başlıyor. Biri borsanın sahibine bağırıyor, biri cüzdanını cebine geri koyuyor. Baba oğlunun kolunu bırakıyor.", en: "The second the chalk hits the board, the line starts falling apart. Somebody's yelling at the owner, somebody's putting their wallet back in their pocket. The dad lets go of his son's arm." }
          - { tr: "Lonca yelekli adam sana yaklaşıyor, alçak sesle: \"Bu tahtayı kapatırsan, insanlar kapılara kendi başına gider. O zaman yüzde on sekiz değil, yüzde elli olur.\"", en: "The guy in the Guild vest comes over, voice low. \"Shut this board down, and people go into Gates on their own. Then it's not eighteen percent. It's fifty.\"" }
        secenekler:
          - id: "denetle"
            etiket: { tr: "\"Kapanmıyor. Ama artık ben denetliyorum.\"", en: "\"It stays open. But now I'm watching it.\"" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "p3_borsa_denetim"
              - itibar: { lonca: 3, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 5 } }
            sonraki: "@akis"
          - id: "kapat"
            etiket: { tr: "\"Kapanıyor.\"", en: "\"It's shut down.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { lonca: -6 }
              - iliski: { kaya_demir: { saygi: -5 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kademe ailesi (Eski Şehir)
  - id: "p3_kademe_ailesi"
    perde: [3]
    bolge: ["eski_sehir"]
    gun: { min: 181, max: 330 }
    agirlik: 4
    etiketler: ["aile", "kademe", "eski_sehir"]
    gerilim: 1
    kart: { tr: "Ters dönmüş ev", en: "The House Turned Upside Down" }
    sahne: "p3_aile_1"
    sahneler:
      - id: "p3_aile_1"
        paragraflar:
          - { tr: "Eski Şehir'de dar bir sokakta bir kapı çalınıyor; senin kapın değil, ama ses sana kadar geliyor. Bir anne, kendi evinin kapısında, içeri girmek için izin istiyor.", en: "Down a narrow street in Old Town, somebody's knocking on a door. Not yours, but the sound carries. A mother, at her own front door, is asking permission to come in." }
          - { tr: "Kapıyı on üç yaşında bir kız açıyor. B kademesi; ailenin geçimini o sağlıyor, kapıları o kapatıyor, kira yerine Lonca'ya kristal o veriyor. Annesi E kademesi; artık evin en zayıfı.", en: "A thirteen-year-old girl opens it. B-Grade. She's the one feeding the family, closing the Gates, paying the Guild in crystals instead of rent. Her mom's E-Grade. The weakest person in the house now." }
          - { tr: "\"Saat on oldu,\" diyor kız, annesine. \"Kural kural.\" Sonra seni görüyor ve rengi atıyor.", en: "\"It's past ten,\" the girl tells her mom. \"Rules are rules.\" Then she spots you, and the color drains out of her face." }
        sezgiler:
          - kosul: { stat: { cha: 180 } }
            metin: { tr: "[ALG] Kız kural koyduğu için değil, kimsenin ona kural koymadığı için öfkeli. Bir yetişkin arıyor.", en: "[PER] The girl isn't angry because she makes the rules. She's angry because nobody makes any for her. She's looking for a grown-up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem herkesi seviyesine göre sıralar. evleri de. bunu kimse ona yazmadı ama herkes okudu.", en: "the System ranks everybody by level. houses too. nobody wrote that into it, but everybody read it anyway." }
        secenekler:
          - id: "kiz"
            etiket: { tr: "Kızla konuş: \"Benim de bir annem vardı.\"", en: "Talk to the girl: \"I had a mom too.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
            sonraki: "p3_aile_konus"
          - id: "seviye"
            tur: "gosteris"
            etiket: { tr: "Görünen seviyeni bir an aç; kim büyük, görsün", en: "Flash your visible level. Let her see who's bigger" }
            gerekli: { stat: { wil: 180 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - dikkat: 2
            sonraki: "p3_aile_korku"
          - id: "gec"
            etiket: { tr: "Senin işin değil; geç git", en: "Not your business. Keep walking" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -1 }
              - tohum: { olay: "p3_heykel", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_aile_konus"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kız kapı eşiğine oturuyor. Annesi içeri girmiyor; o da oturuyor, kızının yanına, eşiğin öbür ucuna. Aralarında bir adım var; bir kademe.", en: "The girl sits down on the doorstep. Her mom doesn't go inside. She sits down too, on the other end of the step. There's one step between them. One Grade." }
          - { tr: "\"Dün bir kapıda bir adam öldü,\" diyor kız. \"Benim yüzümden değil. Ama ben oradaydım. Eve geldiğimde annem bana çorba yapmıştı ve ben ona bağırdım. Çünkü çorba yapabiliyordu ve ben yapamıyordum.\"", en: "\"A man died in a Gate yesterday,\" the girl says. \"Not because of me. But I was there. When I got home, Mom had made soup, and I yelled at her. Because she could still make soup and I couldn't.\"" }
        secenekler:
          - id: "corba"
            etiket: { tr: "\"O zaman çorbayı birlikte yapın.\"", en: "\"Then make the soup together.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "ordu"
            etiket: { tr: "\"Bayrağımın altına gel. Yükü paylaşırız.\"", en: "\"Come serve under my banner. We'll split the load.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - ordu: { lonca_avcisi: 1 }
              - tohum: { olay: "p3_kapi_firtinasi", gecikme: { min: 3, max: 9 } }
            sonraki: "@akis"

      - id: "p3_aile_korku"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kız geri adım atıyor; sonra bir adım daha. Annesi, hiç düşünmeden, kızıyla senin arana giriyor. E kademesi bir kadın, kendinden kat kat güçlü bir kızı, kat kat daha güçlü bir şeyden koruyor.", en: "The girl backs up a step, then another. Without thinking, her mom steps between the two of you. An E-Grade woman shielding a daughter way stronger than her from something way stronger still." }
          - { tr: "Kız annesinin sırtına bakıyor. Bir şey yerine oturuyor; yüzünde görüyorsun.", en: "The girl looks at her mom's back. Something clicks into place. You can see it on her face." }
        secenekler:
          - id: "git"
            etiket: { tr: "Başını salla ve git", en: "Nod and walk off" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Anneden özür dile", en: "Apologize to the mother" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Heykel
  - id: "p3_heykel"
    perde: [3]
    bolge: ["kiyikent_liman", "tepe"]
    gun: { min: 195, max: 330 }
    agirlik: 4
    etiketler: ["efsane", "hakimiyet", "yukselenler"]
    gerilim: 2
    npc: ["vahit"]
    kart: { tr: "Taştan sen", en: "You, in Stone" }
    sahne: "p3_heykel_1"
    sahneler:
      - id: "p3_heykel_1"
        paragraflar:
          - { tr: "Haber sana geç ulaşıyor: Liman meydanında bir heykel dikilmiş. Gidip baktığında kendi yüzünü görüyorsun, üç kat büyüklüğünde, kapı kristalinden oyulmuş; gözlerinin yerinde iki mavi pencere.", en: "The news reaches you late: somebody put up a statue in the waterfront square. When you go see it, you're looking at your own face, three stories tall, carved out of Gate crystal, with two blue windows where the eyes should be." }
          - { tr: "Heykelin dibinde mumlar, çiçekler, el yazısı notlar: [Oğlumu kurtar.] [Bize bak.] [Seviye ver.] Biri heykelin ayağını öpüyor.", en: "There are candles at its feet, flowers, handwritten notes: [Save my son.] [Watch over us.] [Give me levels.] Somebody's kissing the statue's foot." }
          - metin: { tr: "Heykelin yanında {npc:vahit} duruyor, kollarını açmış, kalabalığa vaaz veriyor. Seni görünce gözleri parlıyor; bir peygamber, tanrısının sonunda geldiğini görüyor.", en: "{npc:vahit} is standing next to it, arms wide, preaching to the crowd. When he sees you, his eyes light up: a prophet watching his god finally show up." }
            kosul: { npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir önceki döngüde de bir heykel vardı. yıkıldığında altından bir isim listesi çıktı. kimin listesi olduğunu hatırlamıyorum.", en: "there was a statue last loop too. when it came down, there was a list of names under it. i don't remember whose list." }
        secenekler:
          - id: "yik"
            tur: "gosteris"
            etiket: { tr: "Heykeli tek yumrukla yık", en: "Bring the statue down with one punch" }
            gerekli: { stat: { str: 240 } }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -3 }
              - dikkat: 4
              - itibar: { yukselenler: -10, siginak: 5 }
              - iliski: { vahit: { saygi: 5, guven: -10 } }
            sonraki: "p3_heykel_yikildi"
          - id: "kabul"
            tur: "aciga_vur"
            etiket: { tr: "Heykelin önüne çık; kalabalığı kutsa", en: "Step up in front of it. Bless the crowd" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -6, duzen: 3 }
              - dikkat: 6
              - itibar: { yukselenler: 12, siginak: -6 }
              - iliski: { vahit: { baglilik: 10, saygi: 8 } }
              - ordu_kazan: 25
            sonraki: "p3_heykel_kutsama"
          - id: "notlar"
            etiket: { tr: "Notları tek tek oku", en: "Read the notes, one by one" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - tohum: { olay: "p3_kadim_pazari", gecikme: { min: 3, max: 8 } }
            sonraki: "p3_heykel_notlar"

      - id: "p3_heykel_yikildi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kristal heykel bir çan gibi çınlayıp çatlıyor ve meydana bin parça halinde dökülüyor. Kalabalık çığlık atıyor; sonra susuyor. Kimse hiçbir parçaya dokunmaya cesaret edemiyor.", en: "The crystal statue rings like a bell, cracks, and comes down across the square in a thousand pieces. The crowd screams. Then goes silent. Nobody has the nerve to touch a single shard." }
          - { tr: "\"Ben tanrı değilim,\" diyorsun. Sesin meydanın her köşesine ulaşıyor. İnsanların bir kısmı ağlıyor; bir kısmı ilk kez rahat nefes alıyor.", en: "\"I'm not a god,\" you say. Your voice reaches every corner of the square. Some people are crying. Some are breathing easy for the first time." }
        secenekler:
          - id: "parcalar"
            etiket: { tr: "Kristal parçaları Sığınak'a ver; ısınsınlar", en: "Give the shards to the Haven. Let them burn for heat" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 4 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk off without looking back" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
            sonraki: "@akis"

      - id: "p3_heykel_kutsama"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini kaldırdığın anda meydandaki herkes diz çöküyor. Binlerce insan, tek bir hareketle. Heykelin mavi gözleri seninle aynı anda parlıyor.", en: "The moment you raise your hand, everyone in the square drops to their knees. Thousands of people, one motion. The statue's blue eyes light up at the same time yours do." }
          - { tr: "Pencerende yeni bir satır beliriyor: [Takipçi kazanıldı.] Sayı durmadan artıyor. Bu bir ordu değil; bir ordudan daha sadık bir şey.", en: "A new line shows up in your window: [Followers gained.] The number won't stop climbing. That's not an army. It's something more loyal than an army." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kollarını açık tut", en: "Keep your arms open" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - yozlasma: 3
              - ordu_kazan: 15
            sonraki: "@akis"
          - id: "indir"
            etiket: { tr: "Elini indir; yeter", en: "Lower your hand. That's enough" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "p3_heykel_notlar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yüzlerce not. Çoğu aynı şeyi istiyor: biri kurtarılsın, biri geri dönsün, birinin acısı dinsin. Bir tanesi farklı; bir çocuk yazısı: [Seni seviyorum. Hiçbir şey istemiyorum.]", en: "Hundreds of notes. Most of them want the same thing: somebody saved, somebody brought back, somebody's pain to stop. One is different, in a kid's handwriting: [I love you. I don't want anything.]" }
          - { tr: "Notların arasında bir tane daha var, düzgün bir el yazısıyla, imzasız: [Kadim Pazarı'nda insanların yıllarını satıyorlar. Sen bakmazsan kimse bakmaz.]", en: "There's one more mixed in, neat handwriting, unsigned: [They're selling people's years at the Ancient Market. If you don't look into it, nobody will.]" }
        secenekler:
          - id: "cocuk_notu"
            etiket: { tr: "Çocuğun notunu cebine koy", en: "Put the kid's note in your pocket" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "hepsi"
            etiket: { tr: "Bütün notları topla; birer birer cevapla", en: "Collect every note. Answer them one by one" }
            gerekli: { stat: { wis: 180 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6, yukselenler: -4 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kadim Pazarı
  - id: "p3_kadim_pazari"
    perde: [3]
    bolge: ["kiyikent_liman"]
    gun: { min: 190, max: 320 }
    agirlik: 4
    etiketler: ["kadimler", "karaborsa"]
    gerilim: 2
    kart: { tr: "Yıl satan tezgâh", en: "The Stall That Sells Years" }
    sahne: "p3_pazar_1"
    sahneler:
      - id: "p3_pazar_1"
        paragraflar:
          - { tr: "Liman'ın arkasında, eski balık halinin altında, gece kurulan bir pazar var. Tezgâhlarda Kadim işi şeyler: kendi kendine ısınan taşlar, yaraları kapatan gümüş tozlar, bir kapı kristalinin içine sıkıştırılmış güneş ışığı.", en: "Behind the waterfront, under the old fish market, there's a market that only sets up at night. The stalls are full of Ancient-made stuff: stones that warm themselves, silver dust that closes wounds, sunlight packed into a Gate crystal." }
          - { tr: "Pazarın en kalabalık tezgâhında bir Kadim tüccarı oturuyor; önünde bir terazi. İnsanlar sırayla kefeye avuçlarını koyuyor ve terazi onlardan bir şey alıyor: bir yıl, iki yıl. Karşılığında bir seviye.", en: "The busiest stall has an Ancient merchant sitting behind a balance scale. People take turns putting a hand on the pan, and the scale takes something from them: a year, two years. In exchange, a level." }
          - { tr: "Kuyrukta yaşlılar yok. Hepsi genç. Yaşlıların satacak yılı kalmamış.", en: "There are no old people in line. They're all young. The old ones don't have years left to sell." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim tüccarı · lisanslı", en: "[ANALYSIS] Ancient merchant · licensed" }
            satirlar:
              - { tr: "Kur: 1 yıl = 1 seviye. Sistem işlemi onaylıyor. Sistem birçok şeyi onaylıyor.", en: "Exchange rate: 1 year = 1 level. The System approves this transaction. The System approves of a lot of things." }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "[ALG] Terazi hileli. Bir yıl alıyor, üç yıl yazıyor. Fark filoya gidiyor.", en: "[PER] The scale's rigged. It takes one year and logs three. The difference goes to the fleet." }
        secenekler:
          - id: "terazi"
            tur: "gosteris"
            etiket: { tr: "Elini kefeye koy; teraziyi sen tart", en: "Put your hand on the pan. Weigh the scale yourself" }
            gerekli: { stat: { wil: 250 } }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 3 }
              - dikkat: 5
              - degisken: { kadim_tehdit: -4 }
            sonraki: "p3_pazar_terazi"
          - id: "hile"
            tur: "aciga_vur"
            etiket: { tr: "Kuyruğa hileyi anlat", en: "Tell the line the scale's rigged" }
            gerekli: { stat: { per: 200 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2, kadim_tehdit: -3 }
              - itibar: { kadimler: -8, siginak: 4 }
            sonraki: "p3_pazar_kaos"
          - id: "al"
            etiket: { tr: "Güneş ışığı dolu kristallerden al", en: "Buy some of the sunlight crystals" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - kredi: -800
              - esya: { gunes_kristali: 2 }
              - itibar: { kadimler: 5 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

      - id: "p3_pazar_terazi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini kefeye koyduğun anda terazi ileri geri sallanıyor, sonra kırılıyor. Senden alacak bir yıl bulamıyor; ya da bulduğu yılların sayısı onu korkutuyor.", en: "The second you put your hand on the pan, the scale rocks back and forth, then breaks. It can't find a year to take from you. Or the number of years it finds scares it." }
          - { tr: "Tüccar sana bakıyor, sonra kırık teraziye. \"Bu ölçülemeyen tek müşteri,\" diyor kendi dilinde, sonra seninkinde. Tezgâhını topluyor.", en: "The merchant looks at you, then at the broken scale. \"The one customer that can't be weighed,\" it says in its language, then in yours. It starts packing up the stall." }
        secenekler:
          - id: "geri_ver"
            etiket: { tr: "\"Aldığın yılları geri ver.\"", en: "\"Give back the years you took.\"" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { kadimler: -6, siginak: 5 }
              - iliski: { thessar: { saygi: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Gitmesine izin ver", en: "Let it leave" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { kadimler: 2 }
            sonraki: "@akis"

      - id: "p3_pazar_kaos"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kuyruk bir an donup kalıyor; sonra öfke patlıyor. Tezgâh devriliyor, terazi yere düşüyor, tüccar gümüş bir ışıkla kayboluyor. Bir kadın ağlayarak yerde iki yılını arıyor.", en: "The line freezes for a second. Then the anger boils over. The stall goes over, the scale hits the ground, and the merchant vanishes in a flash of silver. A woman's on her knees, sobbing, looking for her two years on the ground." }
          - { tr: "Pazarın öteki tüccarları sana bakıyor. Bazıları korkuyla; bazıları bir hesap yaparak.", en: "The market's other merchants are watching you. Some with fear. Some doing math." }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadının yanına diz çök", en: "Kneel down next to the woman" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"
          - id: "pazar_kapat"
            etiket: { tr: "\"Bu pazar bu gece kapanıyor.\"", en: "\"This market closes tonight.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { kadimler: -6, lonca: 3 }
              - tohum: { olay: "p3_kordon_geri", gecikme: { min: 4, max: 10 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kordon'u geri almak / tutmak
  - id: "p3_kordon_geri"
    perde: [3]
    bolge: ["kordon", "kiyikent_liman"]
    gun: { min: 190, max: 325 }
    agirlik: 4
    etiketler: ["ordu", "kordon", "savas"]
    gerilim: 3
    kart: { tr: "Kordon'un fenerleri", en: "The Esplanade Lanterns" }
    sahne: "p3_kordon_1"
    sahneler:
      - id: "p3_kordon_1"
        paragraflar:
          - { tr: "Bir haberci seni buluyor; nerede olursan ol, nefes nefese. \"Kordon,\" diyor. \"Fenerleri yeniden yakmak istiyoruz. Ama gece olunca kabuklular sudan çıkıyor. Sen gelmezsen kimse gitmeyecek.\"", en: "A runner finds you, wherever you are, out of breath. \"The Esplanade,\" he says. \"We want to light the lanterns again. But at night the shellbacks come up out of the water. If you don't come, nobody's going.\"" }
          - metin: { tr: "Kordon, ilk taşmada düştüğünden beri bir canavar sahili. Kabuklu sürüler yıkık büfelerin altında yuva yapmış; geceleri sesleri Liman'a kadar geliyor.", en: "The Esplanade has been monster coastline since it fell in the first break. Shellback swarms nest under the wrecked snack stands, and at night you can hear them all the way from the waterfront." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Kordon ilk taşmada tutuldu, ama o günden beri ayakta kalmak için her gece savaşıyor. Fenerlerin yarısı kırık; nöbetçilerin yarısı yorgun.", en: "The Esplanade held during the first break, but it's been fighting every night since to stay standing. Half the lanterns are broken. Half the sentries are exhausted." }
            kosul: { bayrak: "kordon_kurtarildi" }
        secenekler:
          - id: "ordu"
            etiket: { tr: "Ordunla in; sahili adım adım temizleyin", en: "Go down with your army. Clear the shore step by step" }
            goster: { ordu_min: 1 }
            etkiler:
              - bolge: "kordon"
              - ahlak: { duzen: 3, merhamet: 2 }
              - ordu_kazan: 20
            sonraki: "p3_kordon_ordu"
          - id: "yalniz"
            etiket: { tr: "Tek başına in", en: "Go down alone" }
            etkiler:
              - bolge: "kordon"
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["kordon_kabuklusu@dunya", "kordon_kabuklusu@dunya", "kordon_kabuklusu@dunya+20"], ortam: ["su", "karanlik"], kazan: "p3_kordon_fener", kaybet: "p3_kordon_yenilgi" }
          - id: "gosteris"
            tur: "gosteris"
            etiket: { tr: "Sahile yalnızca yürü; kabuklular kaçsın", en: "Just walk the shore. Let the shellbacks run" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bolge: "kordon"
              - ahlak: { insanlik: -2, duzen: 1 }
              - dikkat: 4
              - xp_seviye: 15
            sonraki: "p3_kordon_fener"

      - id: "p3_kordon_ordu"
        yer: "kordon"
        paragraflar:
          - { tr: "Sancağın altında yüzlerce kişi Kordon'a iniyor; sırayla, senin öğrettiğin gibi. Kabuklular sudan çıktığında karşılarında bir duvar buluyorlar.", en: "Hundreds of people come down onto the Esplanade under your banner, in order, the way you taught them. When the shellbacks crawl out of the water, they find a wall waiting for them." }
          - { tr: "Sen yalnızca izliyorsun; bir kez müdahale ediyorsun, bir çocuğu sudan çekmek için. Gece yarısı sahil sessiz. Senin ordun ilk kez sensiz kazandı.", en: "You mostly just watch. You step in once, to pull a kid out of the water. By midnight the shore is quiet. Your army won without you for the first time." }
        secenekler:
          - id: "fener"
            etiket: { tr: "İlk feneri onlar yaksın", en: "Let them light the first lantern" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
              - itibar: { siginak: 6 }
            sonraki: "@akis"
          - id: "karargah"
            etiket: { tr: "Kordon'u ordunun karargâhı yap", en: "Make the Esplanade your army's HQ" }
            etkiler:
              - ahlak: { duzen: 4 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 2 }
              - kontrol: { kordon: "lonca" }
              - ordu_kazan: 20
              - itibar: { lonca: 5 }
            sonraki: "@akis"

      - id: "p3_kordon_fener"
        yer: "kordon"
        paragraflar:
          - { tr: "Son kabuklu suya geri kaçıyor. Kordon, ilk taşmadan beri ilk kez, gecenin bir yarısında boş ve sessiz.", en: "The last shellback scuttles back into the water. For the first time since the first break, the Esplanade is empty and quiet in the middle of the night." }
          - { tr: "Haberci arkandan bir fener uzatıyor, eski bir gaz lambası. Fitili ıslak; yine de yanıyor.", en: "The runner hands you a lantern from behind, an old kerosene lamp. The wick's damp. It lights anyway." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Feneri as; ilk ışık senin olsun", en: "Hang the lantern. First light's yours" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
              - itibar: { siginak: 5 }
            sonraki: "@akis"
          - id: "habercive"
            etiket: { tr: "Feneri habercinin eline geri ver", en: "Hand the lantern back to the runner" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak: "p3_kordon_geri_alindi"
              - degisken: { hayatta_kalan: 3 }
              - kontrol: { kordon: "siginak" }
            sonraki: "@akis"

      - id: "p3_kordon_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Kabukluların biri kolunu kıskacıyla kavrıyor ve seni suya sürüklüyor. Karanlıkta nefesin bitiyor; sonra bir el, bir halat, habercinin yüzü.", en: "One of the shellbacks clamps onto your arm and drags you into the water. Your breath runs out in the dark. Then a hand, a rope, the runner's face." }
          - { tr: "Sahili bu gece geri alamıyorsunuz. Ama haberci gülüyor, ıslak ve titrek: \"Geldin. Bu bile yeter. Yarın yine geliriz.\"", en: "You don't take the shore back tonight. But the runner's laughing, soaked and shaking: \"You came. That's enough. We'll be back tomorrow.\"" }
        secenekler:
          - id: "yarin"
            etiket: { tr: "\"Yarın.\"", en: "\"Tomorrow.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "Habercinin adını sor", en: "Ask the runner's name" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - ordu: { lonca_avcisi: 1 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kapı fırtınası
  - id: "p3_kapi_firtinasi"
    perde: [3]
    bolge: ["sanayi", "kule_dibi", "eski_sehir"]
    gun: { min: 230, max: 330 }
    agirlik: 4
    etiketler: ["kapi", "savas", "hakimiyet"]
    gerilim: 4
    kart: { tr: "Yedi kapı birden", en: "Seven Gates at Once" }
    sahne: "p3_firtina_1"
    sahneler:
      - id: "p3_firtina_1"
        paragraflar:
          - { tr: "Saat 04:12'de şehrin her yerinde aynı bildirim çalıyor: [KAPI FIRTINASI. Açık kapı: 7. Kademe: B–A. Taşma süresi: 3 saat.] Telefonlar, telsizler, pencereler; hepsi aynı satırı tekrarlıyor.", en: "At 4:12 a.m., the same notification goes off all over the city: [GATE STORM. Open Gates: 7. Grade: B–A. Time to break: 3 hours.] Phones, radios, windows, all of them repeating the same line." }
          - { tr: "Yedi kapı, yedi mahalle. Hiçbir fraksiyonun yedi kapıya yetecek avcısı yok. Fraksiyonların hepsi aynı anda sana mesaj atıyor; hepsi önce kendi mahallesini istiyor.", en: "Seven Gates, seven neighborhoods. No faction has enough hunters to cover seven Gates. Every one of them messages you at the same time, and every one wants its own neighborhood first." }
          - metin: { tr: "Sancağının altındakiler zaten Liman meydanında toplanmış; kimse çağırmadan.", en: "The people under your banner are already gathering in the waterfront square. Nobody had to call them." }
            kosul: { ordu_min: 1 }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[KAPI FIRTINASI]", en: "[GATE STORM]" }
            satirlar:
              - { tr: "Eş zamanlı kapı sayısı Dünya Katmanı rekorunu kırdı. Tebrikler, sanırız.", en: "Simultaneous Gate count set a new Earth Layer record. Congratulations, we think." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "[ALG] Yedi kapının yedisi de aynı ritimle atıyor. Bir merkez var: Sanayi'deki eski döküm fırını. Önce onu kapatırsan diğerleri zayıflar.", en: "[PER] All seven Gates are pulsing in the same rhythm. There's a center: the old foundry furnace in the Ironworks. Close that one first and the rest weaken." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "biri bunları çağırdı. kapılar kendiliğinden fırtına olmaz. biri seni ölçmek istiyor.", en: "somebody called these. gates don't storm on their own. somebody wants to measure you." }
        secenekler:
          - id: "merkez"
            etiket: { tr: "Sanayi'deki merkez kapıya dal", en: "Dive into the center Gate in the Ironworks" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["firtina_dogumu@oyuncu+2", "firtina_dogumu@oyuncu"], ortam: ["yanici"], kazan: "p3_firtina_merkez", kaybet: "p3_firtina_yenilgi" }
          - id: "bol"
            etiket: { tr: "Ordunu yedi kapıya böl", en: "Split your army across all seven Gates" }
            goster: { ordu_min: 1 }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - ordu_kazan: 25
            sonraki: "p3_firtina_ordu"
          - id: "yedisi"
            tur: "gosteris"
            etiket: { tr: "Yedi kapıyı da tek başına, sırayla kapat", en: "Close all seven yourself, one after another" }
            gerekli: { stat: { agi: 280 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -3, duzen: -1 }
              - dikkat: 10
              - xp_seviye: 60
              - degisken: { hayatta_kalan: 3 }
              - efsane: "kapiyi_yalniz_kapatti"
            sonraki: "p3_firtina_sabah"
          - id: "siginak_once"
            etiket: { tr: "Önce sivillerin en kalabalık olduğu mahalleye koş", en: "Run for the most crowded civilian block first" }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 5, lonca: -3 }
              - savas: { dusmanlar: ["firtina_dogumu@dunya", "firtina_dogumu@dunya"], kazan: "p3_firtina_sabah", kaybet: "p3_firtina_yenilgi" }

      - id: "p3_firtina_merkez"
        yer: "sanayi"
        paragraflar:
          - { tr: "Merkez kapı içeri doğru çöküyor ve şehrin dört bir yanında altı kapı aynı anda titriyor, küçülüyor. Avcılar onları birer birer kapatıyor; telsizden sevinç çığlıkları geliyor.", en: "The center Gate collapses inward, and all over the city six more Gates shudder and shrink at the same moment. Hunters close them one by one, and whoops come crackling over the radio." }
          - { tr: "Döküm fırınının dibinde bir şey parlıyor: kapıyı çağıran bir işaret taşı, üstünde Kadim yazısı.", en: "Something's glowing at the bottom of the foundry furnace: a marker stone that called the Gates, Ancient script on it." }
        secenekler:
          - id: "tasi_al"
            etiket: { tr: "Taşı al; kimin bıraktığını bul", en: "Take the stone. Find out who left it" }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "firtina_tasi"
              - degisken: { kadim_tehdit: -3 }
              - iliski: { thessar: { saygi: 3 } }
            sonraki: "p3_firtina_sabah"
          - id: "kir"
            etiket: { tr: "Taşı orada kır", en: "Smash the stone right there" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 1 }
              - degisken: { kadim_tehdit: -2 }
            sonraki: "p3_firtina_sabah"

      - id: "p3_firtina_ordu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yedi kapıya yedi sancak. Telsizden her birinin sesi geliyor; kimi sakin, kimi panik içinde. Sen meydandan hepsini dinliyor, birinden ötekine emir veriyorsun.", en: "Seven banners for seven Gates. Every one of them is on the radio, some calm, some panicking. You listen to all of them from the square, calling orders from one to the next." }
          - { tr: "Beşinci kapı taşmak üzere. Oradaki birlik geri çekilmek istiyor. Bir yanlış emir, bir mahalle.", en: "The fifth Gate's about to break. The unit there wants to fall back. One wrong order, one neighborhood." }
        secenekler:
          - id: "kendin"
            etiket: { tr: "Beşinci kapıya kendin koş", en: "Run to the fifth Gate yourself" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["firtina_dogumu@dunya+20"], kazan: "p3_firtina_sabah", kaybet: "p3_firtina_yenilgi" }
          - id: "tut"
            etiket: { tr: "\"Hattı tutun. Geri çekilme yok.\"", en: "\"Hold the line. Nobody falls back.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - ordu_kazan: 10
              - degisken: { hayatta_kalan: -1 }
            sonraki: "p3_firtina_sabah"

      - id: "p3_firtina_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah yedide son kapı kapanıyor. Şehir ayakta; yorgun, isli, ama ayakta. Pencerende bir satır: [Kapı fırtınası atlatıldı. Taşma: 0.]", en: "At seven in the morning, the last Gate closes. The city's still standing. Tired, sooty, but standing. A line in your window: [Gate storm survived. Breaks: 0.]" }
          - { tr: "Bir sonraki satır daha küçük, neredeyse utangaç: [Kayda geçti: Dünya Katmanı'nın direnci beklentinin üstünde.]", en: "The next line's smaller, almost sheepish: [Noted: Earth Layer resilience exceeds projections.]" }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Bir saat uyu", en: "Sleep for an hour" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: 500
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "Bütün avcılara tek tek teşekkür et", en: "Thank every hunter, one by one" }
            gerekli: { stat: { cha: 200 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - ordu_kazan: 15
              - itibar: { siginak: 3, lonca: 3 }
            sonraki: "@akis"

      - id: "p3_firtina_yenilgi"
        paragraflar:
          - { tr: "Kapının içinden fırlayan fırtına doğumu seni bir duvara çarpıyor; duvar seninle birlikte yıkılıyor. Kalktığında kapı taşmış, bir sokak canavarların.", en: "The storm-spawn that bursts out of the Gate slams you into a wall, and the wall comes down with you. When you get up, the Gate's broken and a whole street belongs to the monsters." }
          - { tr: "Sabaha karşı diğer kapılar kapanıyor. O sokak, bir süre için, haritadan siliniyor.", en: "Toward dawn the other Gates close. That one street gets wiped off the map, for a while." }
        secenekler:
          - id: "sokak"
            etiket: { tr: "O sokağın insanlarını say", en: "Count the people from that street" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "geri_al"
            etiket: { tr: "\"O sokağı geri alacağım.\"", en: "\"I'm taking that street back.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { yanki: { saygi: 2 } }
            sonraki: "@akis"
