# Parti J — Perde 3 ana yayı ve Perde 3 Kıyıkent olayları (docs/PERDE2_4.md "Parti J").
# Ana yay: yol_olusumu (Gün 260) · buyuk_ihanet (Gün 300) · perde3_son (Gün 320). Dikkat eşikleri: dikkat_75_p3, dikkat_100_p3.
# Büyük ihanetin haini öncelik sırasıyla seçilir; koşul dilinde VEYA olmadığı için yönlendirme iki sahnede yapılır
# (buyuk_ihanet_iz: Mert / Kaya / "dışarıdan"; buyuk_ihanet_kule: Thessar / Deniz / Aras / yedek). Her yönlendirme
# sahnesinde koşullar birbirini dışlar ve kapsar: her oyuncu tam bir yol görür.
# Kıyıkent (Perde 3, Gün 181–330): ordu, Kule 50+ toplumu, Küresel Sıralama'nın tepesi, çok-evrenden dönenler,
# C–A kademe şehir hayatı ve OP MC hakimiyeti (gösteriş statları 120–300).
# Yankı'nın sözleri küçük harfli ve tırnaksızdır. İngilizcede Deniz için zamir belirteci, Yankı "it".
olaylar:
  # ================================================================== YOL OLUŞUMU (ana yay, gün 260)
  - id: "yol_olusumu"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "yol", "oz", "yanki"]
    gerilim: 4
    ana_yay: { gun: 260 }
    onemli: true
    kart: { tr: "İki Öz, tek yol", en: "Two Essences, One Path" }
    sahne: "yol_olusumu_1"
    sahneler:
      - id: "yol_olusumu_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Saat gece yarısını biraz geçmiş. Göğsünün ortasında bir şey kendi üstüne katlanıyor. Aylardır kavradığın ne varsa, adını koyabildiğin de koyamadığın da, hep birden uyanmış, açlıkla birbirine uzanıyor.", en: "It's a little past midnight, and something in the middle of your chest is folding in on itself. Everything you've grasped these past months, whether you could name it or not, wakes up at once and reaches for everything else. Hungry." }
          - { tr: "Mavi pencere sen istemeden açılıyor; ama bu kez satırları titremiyor, bekliyor. Sistem ilk defa söze girmeden önce susuyor.", en: "The blue window opens without you asking. Only this time the lines aren't flickering. They're waiting. For the first time ever, the System goes quiet before it says something." }
          - { tr: "Sistem'in kitabına göre Yol A kademesinin hakkıdır: iki Öz'ün birleşip yalnızca sana ait bir güce dönüştüğü an. Ne var ki o kitap hiçbir zaman tam olarak senin için yazılmadı.", en: "In the System's rulebook, a Path is an A-Grade privilege: the moment two Essences fuse into a power that belongs to nobody but you. That rulebook was never quite written with you in mind." }
          - metin: { tr: "Kafanın içindeki {npc:yanki} hiç bu kadar uyanık olmamıştı: tamam. tamam, işte bu. bunu bekliyordum, beklediğim için de korkuyordum. bir yer seç. bu iş yatakta olmaz. ya da olur, bilmem; sen seç, yeter ki çabuk ol.", en: "{npc:yanki} is in your head, more awake than you've ever heard it: okay. okay, this is it. i've been waiting for this, and i've been scared because i was waiting. pick a place. this doesn't happen in bed. or maybe it does. you pick. just pick fast." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "Bir zamanlar kafanın içinde bir ses vardı; böyle bir gecede çenesi hiç durmazdı. Şimdi yalnız kendi nabzını duyuyorsun. Sessizlik hiç bu kadar kalabalık olmamıştı.", en: "There used to be a voice in your head, and on a night like this it would never have shut up. Now there's just your own pulse. Silence has never felt this crowded." }
            kosul: { bayrak_yok: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YOL EŞİĞİ]", en: "[PATH THRESHOLD]" }
            satirlar:
              - { tr: "Beklenen kademe: A. Mevcut kademe: tutarsız.", en: "Expected Grade: A. Current Grade: inconsistent." }
              - { tr: "Eşik yine de açıldı. Bu bir hata değil. Tekrar ediyoruz: bu bir hata değil.", en: "The threshold opened anyway. This is not an error. Repeat: this is not an error." }
        sezgiler:
          - kosul: { stat: { wis: 180 } }
            metin: { tr: "Kavrayışının sınırında iki iplik birbirine dolanıyor. Bırakırsan kendiliğinden düğümlenecekler; tutarsan düğümü sen atacaksın.", en: "At the edge of your understanding, two threads are winding around each other. Let go and they'll knot on their own. Hold on and you'll be the one tying the knot." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir şey daha. nerede olursan ol, orası seni hatırlayacak. yollar doğdukları yeri unutmaz.", en: "one more thing. wherever you are, that place is going to remember you. paths never forget where they were born." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yine ışıl ışılsın. Ama bu sefer başka türlü. Gitme demeyeceğim; yalnız dönerken kapıyı çal.\"", en: "\"You're glowing again. It's different this time, though. I'm not gonna tell you not to go. Just knock on your way back in.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nabız yüz kırk, ateş yok. Bunun tıpta bir adı yok, farkındasın değil mi?\"", en: "\"Pulse is one-forty. No fever. You know there's no medical term for this, right?\"" }
        secenekler:
          - id: "kule"
            etiket: { tr: "Kule'ye tırman, göğe yaklaş", en: "Climb the Spire. Get close to the sky" }
            kronik: { tr: "Yolunun doğacağı yer olarak Kule'nin tepesini seçtin; o gece gökyüzüyle aranda rüzgârdan başka bir şey yoktu.", en: "You chose the top of the Spire as the place your Path would be born. That night, nothing stood between you and the sky but the wind." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - degisken: { yol_yeri: 1 }
              - bolge: "kule_dibi"
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "yol_olusumu_yanki"
          - id: "kordon"
            etiket: { tr: "{yer:kordon|e} in, suyun karşısında dur", en: "Head down to {yer:kordon} and face the water" }
            kronik: { tr: "Yolunun doğuşunu denizin karşısında bekledin; dalgalar o gece kıyıya varmadan durdu.", en: "You waited for your Path facing the sea. That night the waves stopped just short of the shore." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { yol_yeri: 2 }
              - bolge: "kordon"
            sonraki: "yol_olusumu_yanki"
          - id: "halk"
            etiket: { tr: "Halkının arasında kal, görsünler", en: "Stay with your people. Let them see" }
            kronik: { tr: "Yolunun herkesin gözü önünde doğmasını göze aldın. O gece meydanı dolduran yüzlerce kişi buna tanık oldu.", en: "You let your Path be born in plain sight. Hundreds of people filled the square that night to witness it." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - degisken: { yol_yeri: 3 }
              - bolge: "kiyikent_liman"
              - dikkat: 4
              - itibar: { siginak: 3, lonca: 3, yukselenler: 3 }
            sonraki: "yol_olusumu_yanki"
          - id: "yalniz"
            tur: "gizle"
            etiket: { tr: "Kimseye söyleme, tek başına karanlığa çekil", en: "Tell no one. Slip off into the dark alone" }
            kronik: { tr: "Yolunu kimsenin görmediği bir damda kurdun; o gece aralarından neyin geçtiğini şehirde bilen yoktu.", en: "You forged your Path on a rooftop where no one could see. That night, nobody in the city knew what had passed among them." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - degisken: { yol_yeri: 4 }
              - bolge: "eski_sehir"
              - gizle: 6
            sonraki: "yol_olusumu_yanki"

      - id: "yol_olusumu_yanki"
        paragraflar:
          - metin: { tr: "Kule'nin dış merdivenlerinden kırk kat tırmanıyorsun, son on katı da merdivensiz, doğrudan duvara tutunarak çıkıyorsun. Buradaki rüzgâr soğuk, tuz kokmuyor. Aşağıda {yer:kiyikent} sönmeye yüz tutmuş bir avuç kömür gibi; körfezin üstündeki Kadim gemisi ise yıldızların bir kısmını örten bir gölge.", en: "You take the Spire's outer stairs forty floors up, and the last ten without stairs at all, straight up the wall. The wind up here is cold and doesn't taste like salt. Below, {yer:kiyikent} is a handful of dying embers. Over the bay, the Ancient ship is a shadow that blots out a chunk of the stars." }
            kosul: { degisken_min: { yol_yeri: 1 }, degisken_max: { yol_yeri: 1 } }
          - metin: { tr: "{yer:kordon|in} ıslak taşlarına iniyorsun. Su kapkara ve durgun, martılar bile susmuş. Dalgalar ayağının dibinde, kıyıya varmadan duruyor; onlar da bir şey bekler gibi.", en: "You walk down onto {yer:kordon|pos} wet stones. The water's black and flat, and even the gulls have shut up. The waves stop just short of your boots, like they're waiting too." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 } }
          - metin: { tr: "{yer:kordon} düştüğünden beri buraya insan inmez oldu. Yıkık bir büfenin altında kabuklu bir şey kıpırdanıp sana bakıyor, sonra geri çekiliyor. Bu gece neyin doğduğunu canavarlar bile biliyor.", en: "Nobody's come down here since {yer:kordon} fell. Something with a shell shifts under a wrecked snack stand, looks at you, and backs off. Tonight even the monsters know what's being born." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 }, bayrak: "kordon_dustu" }
          - metin: { tr: "{yer:kiyikent_liman} meydanından ayrılmıyorsun. Bir şeylerin değiştiğini ilk çocuklar görüyor: teninden ışık sızıyor. Önce birkaç kişi, derken yüzlerce kişi çevrende bir halka kurmuş. Yaklaşan da yok, giden de.", en: "You stay in the waterfront square, and the kids are the first to notice something's off: light is leaking out of your skin. First a few people, then hundreds form a ring around you. Nobody comes closer. Nobody leaves." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "Halkanın en önünde bayrağının altında yürüyenler duruyor. Kimse emir vermeden kalkanlar kendiliğinden kalabalığa dönüyor. Ne doğacaksa ilk onları görecek.", en: "The people under your banner hold the front of the ring. Nobody gives the order; the shields just turn to face the crowd on their own. Whatever's about to be born, it's going to see them first." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 }, ordu_min: 1 }
          - metin: { tr: "{yer:eski_sehir|in} damlarından birine çıkıyorsun; kiremitlerinin yarısı Entegrasyon'dan beri kayıp. Başını kaldırıp bakan yok. Burada doğacak şeyi bir sen göreceksin, bir de ay.", en: "You climb onto one of the rooftops in {yer:eski_sehir}, half its shingles missing since Integration. Nobody looks up. Whatever gets born here, only you and the moon are going to see it." }
            kosul: { degisken_min: { yol_yeri: 4 } }
          - metin: { tr: "{npc:yanki} konuşmaya başlıyor ve bu kez susmuyor: öz bir kelimedir, dünyanın kendine verdiği adlardan biri. sen onlardan birkaçını ezberledin; şimdi onları bir cümlede birleştireceksin. sistem buna yol diyor. ben imza diyorum.", en: "{npc:yanki} starts talking, and this time it doesn't stop: an essence is a word. one of the names the world gave itself. you've memorized a few of them. now you're going to tie them into a sentence. the System calls that a path. i call it a signature." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "herkesin yolu A kademesinde açılır; sistem bir cümleyi ancak o kadar kelime bilene emanet eder. seninki erken açıldı, çünkü sende benim kelimelerim de var. özür dilemiyorum, yalnızca haber veriyorum.", en: "everyone's path opens at A-Grade, because the system only trusts a sentence to somebody who knows that many words. yours opened early, because you've got my words in you too. i'm not apologizing. i'm just letting you know." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "bunun ne olduğunu artık biliyorsun: hasat. yol, biçilen bir tarlada kalan en sert köke benzer; sökmesi zordur. iyi. sen de sökülmesi zor bir şey ol.", en: "you know what this is now. a harvest. a path is like the toughest root in a field that's getting harvested. hard to pull. good. be something that's hard to pull." }
            kosul: { bayrak: ["yanki_bagi", "gercek_hasat"] }
          - metin: { tr: "bunun ne olduğunu artık biliyorsun: ölüp gitmiş bir ırkın yazdığı kurtarma protokolü. yollar onların bize bıraktığı aletler; alet kimin elindeyse ona benzer. seninkinin neye benzediğine dikkat et.", en: "you know what this is now. a rescue protocol, written by a race that died. paths are the tools they left us. a tool ends up looking like whoever holds it. careful what yours ends up looking like." }
            kosul: { bayrak: ["yanki_bagi", "gercek_kurtarma"] }
          - metin: { tr: "Ses bu kez kafanın içinde kalmıyor. Bileğinden ve göz kenarlarından bozuk, mavi bir ışık sızıyor; seni görenler artık bunun ne olduğunu biliyor. {npc:yanki} aldırmıyor bile: baksınlar. birinin bunu doğru yaptığını ilk kez görüyorlar.", en: "This time the voice doesn't stay in your head. Glitched blue light leaks from your wrist and the corners of your eyes, and anyone looking knows exactly what it is now. {npc:yanki} doesn't care: let them look. it's the first time they've seen somebody do this right." }
            kosul: { bayrak: ["yanki_bagi", "yanki_gorundu"] }
          - metin: { tr: "Ama sesin altında başka bir şey de var: açlığa benzeyen, şimdiden payını hesaplayan bir şey. Kelimelerin bir kısmının sana değil kendisine kalacağını biliyor ve bunu pek gizlemeye de uğraşmıyor.", en: "But there's something else under the voice. Something like hunger, already counting its share. It knows some of these words are going to end up being its words, not yours, and it isn't trying very hard to hide that." }
            kosul: { bayrak: "yanki_ele_gecirdi" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Kadim gemisinin altında bir ışık düzenli, ölçülü aralıklarla yanıp sönüyor. Biri bu anı kayda geçiriyor.", en: "A light is blinking on the underside of the Ancient ship. Steady, measured. Somebody's recording this." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Bırak anlatsın", en: "Let it keep talking" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolun doğarken {npc:yanki|i} sözünü kesmeden, sonuna kadar dinledin. O gece ona ilk kez bir borcun olduğunu hissettin.", en: "While your Path was being born, you heard {npc:yanki} out to the end. That night you felt, for the first time, that you owed it something." }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 35 }
            sonraki: "yol_olusumu_ani"
          - id: "dongu_sor"
            etiket: { tr: "\"Bunu daha önce kaç kez gördün?\"", en: "\"How many times have you watched this before?\"" }
            goster: { bilgi: "yanki_parcasi" }
            kronik: { tr: "{npc:yanki|e} bu anı daha önce kaç kez gördüğünü sordun; bir döngünün içinde olduğunuzu o gece öğrendin.", en: "You asked {npc:yanki} how many times it had watched this before. That night you learned you were inside a loop." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { yanki: { guven: 8, korku: 3 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 45 }
            sonraki: "yol_olusumu_ani"
          - id: "sus"
            etiket: { tr: "\"Sus. Bu benim anım.\"", en: "\"Quiet. This moment is mine.\"" }
            kronik: { tr: "Yolunun doğduğu gece {npc:yanki|i} susturdun. O güçte onun sesinden çok senin sesin vardı.", en: "The night your Path was born, you told {npc:yanki} to be quiet. There was more of your voice in that power than its own." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { saygi: 6, guven: -3 } }
            sonraki: "yol_olusumu_secim"

      - id: "yol_olusumu_ani"
        paragraflar:
          - { tr: "{npc:yanki} bir an duraksıyor. Ardından sesi, eski bir fotoğrafı anlatan birininki gibi tuhaf biçimde yumuşuyor: bunu bir kez daha gördüm. başka bir şehirde, başka bir taşıyıcıda. onunki de erken açılmıştı. o da benim kelimelerimi taşıyordu.", en: "{npc:yanki} pauses. Then its voice goes strangely soft, like someone describing an old photograph: i've seen this once before. another city. another carrier. they were early too. they carried my words too." }
          - { tr: "ateşi ve duvarları seçti. herkesi arkasına alabileceğini sandı. nasıl bittiğini hatırlamıyorum, yalnızca biçimi aklımda: bir duvar, bir kıvılcım. sonra yine mavi paneller ve ilk gün.", en: "it picked fire and walls. thought it could get everyone behind it. i don't remember how it ended. i only remember the shape. a wall. a spark. then the blue panels again, and day one." }
          - { tr: "Söylediğinin ağırlığını kendisi de ancak şimdi duyuyor gibi. Rüzgâr bir an kesiliyor; göğsündeki iki ateş sabırsızlanıp birbirine biraz daha sokuluyor.", en: "It sounds like it's only now hearing the weight of what it just said. The wind cuts out for a second. The two fires in your chest crowd a little closer together, impatient." }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[KAYIT B̷ULUNAMADI]", en: "[REC̷ORD NOT FOUND]" }
            satirlar:
              - { tr: "önceki taşıyıcı: █████. önceki yol: kor... kor█.", en: "previous carrier: █████. previous path: ember... emb█." }
              - { tr: "bu satır silinmişti. neden hâlâ okunuyor?", en: "this line was deleted. why can you still read it?" }
        secenekler:
          - id: "farkli"
            etiket: { tr: "\"O zaman bu sefer başka türlü yapalım.\"", en: "\"Then let's do it different this time.\"" }
            kronik: { tr: "{npc:yanki|e} bu kez her şeyin başka türlü olacağına söz verdin. O gece bu sözü tutup tutamayacağınızı ikiniz de bilmiyordunuz.", en: "You promised {npc:yanki} it would be different this time. That night, neither of you knew if that promise could be kept." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { baglilik: 8, guven: 4 } }
            sonraki: "yol_olusumu_secim"
          - id: "kimdi"
            etiket: { tr: "\"Önceki taşıyıcı kimdi?\"", en: "\"Who was the last carrier?\"" }
            kronik: { tr: "Senden önceki taşıyıcının izini sordun. O sorudan sonra bu yolu senden önce birinin yürüdüğünden bir daha hiç şüphe edemedin.", en: "You asked about the last carrier. That question settled it for good: someone had walked this road before you." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bilgi: "yol_onceki_tasiyici"
              - iliski: { yanki: { guven: 4, korku: 2 } }
            sonraki: "yol_olusumu_onceki"

      - id: "yol_olusumu_onceki"
        paragraflar:
          - { tr: "bilmiyorum, diyor {npc:yanki}. bilmemem gerekiyor. her döngüde ilk silinen şey taşıyıcının adı. ama bir şey kaldı: sabahları ayakkabılarını iki kez bağlardı. çift düğüm. bir şeyin çözülmesinden korkar gibi.", en: "i don't know, {npc:yanki} says. i'm not supposed to. every loop, the first thing that gets erased is the carrier's name. but one thing stuck. every morning they'd double-knot their shoes. like they were scared something might come undone." }
          - { tr: "Gözün aşağı kayıyor: botunun bağcıkları çift düğümlü. Ne zamandan beri böyle bağladığını hatırlamıyorsun.", en: "You look down. Your own laces are double-knotted. You can't remember when you started doing that." }
          - { tr: "tesadüf, diyor ses; biraz fazla çabuk. herhalde tesadüf. hadi, ateşler bekliyor.", en: "coincidence, the voice says, way too fast. probably a coincidence. come on. the fires are waiting." }
        secenekler:
          - id: "coz"
            etiket: { tr: "Bağcıklardan birini çöz", en: "Untie one of the laces" }
            kronik: { tr: "Yolunun doğduğu gece bağcıklarından birini çözdün; belki de sana ait olmayan bir alışkanlığı üstünden atmaya çalıştın.", en: "The night your Path was born, you undid one of the knots, trying to shake off a habit that might not be yours." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - iliski: { yanki: { saygi: 5 } }
            sonraki: "yol_olusumu_secim"
          - id: "birak"
            etiket: { tr: "Bırak öyle kalsın", en: "Leave them be" }
            kronik: { tr: "Düğümlere dokunmadın. Önceki taşıyıcıdan kalan o küçük alışkanlığın sende kalmasına razı oldun.", en: "You left the knots alone. You let that small habit from the last carrier stay with you." }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "yol_olusumu_secim"

      - id: "yol_olusumu_secim"
        paragraflar:
          - { tr: "Ateşlerin artık bekleyecek hâli yok. Kavradığın her Öz göğsünün içinde ayağa kalkıyor, her biri kendi rengi, kendi sıcaklığı ve kendi açlığıyla. Yol bunlardan ikisinden doğacak; fazlasından değil.", en: "The fires can't wait anymore. Every Essence you've grasped stands up inside your chest, each with its own color, its own heat, its own hunger. The Path gets born from two of them. No more than two." }
          - { tr: "Hangisine önce uzanırsan Yol onun üzerine kurulacak, öteki ona eşlik edecek. Kavramadığın bir şeye uzanmak da mümkün; ama o zaman hiç tutmadığın bir şeyi ilk kez tutmanın bedelini ödersin.", en: "Whichever one you reach for first, the Path gets built around it. The other one keeps it company. You can reach for something you've never held, too. But the price is the price of grabbing something you've never held before." }
          - metin: { tr: "{npc:yanki} fısıldıyor: ya da bana bırak. hangi kelimelerin birbirine yakıştığını ben bilirim; hep bildim.", en: "{npc:yanki} whispers: or leave it to me. i know which words go together. i always have." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Öz uyumu", en: "[ANALYSIS] Essence compatibility" }
            satirlar:
              - { tr: "Bağlı Öz'ler öncelikli. Bağlı olmayan Öz'le birleşme: yüksek acı, sıfır geri dönüş.", en: "Bound Essences take priority. Fusing with an unbound Essence: high pain, zero refunds." }
        secenekler:
          - id: "ates"
            etiket: { tr: "İçindeki Ateş'e uzan", en: "Reach for the Fire in you" }
            goster: { oz: "ates" }
            kronik: { tr: "Yolunu Ateş üzerine kurdun. O günden sonra yanında duranlar biraz daha ısındı, karşına dikilenler biraz daha ürktü.", en: "You built your Path on Fire. From then on, the people beside you ran a little warmer, and the ones facing you a little more afraid." }
            etkiler:
              - ahlak: { merhamet: -1, insanlik: -1 }
            sonraki: "yol_olusumu_oz_ates"
          - id: "uzay"
            etiket: { tr: "İçindeki Uzay'a uzan", en: "Reach for the Space in you" }
            goster: { oz: "uzay" }
            kronik: { tr: "Yolunun ilk taşı olarak Uzay'ı seçtin; mesafeler o gece avucunda katlanmaya başladı.", en: "You chose Space as your Path's first stone. That night, distances started folding up in your palm." }
            etkiler:
              - ahlak: { duzen: -2 }
            sonraki: "yol_olusumu_oz_uzay"
          - id: "olum"
            etiket: { tr: "İçindeki Ölüm'e uzan", en: "Reach for the Death in you" }
            goster: { oz: "olum" }
            kronik: { tr: "Ölüm'e uzandın ve Yolunu onun üzerine kurdun; parmak uçların o gece bitmek üzere olan her şeyin sesini duydu.", en: "You reached for Death and built your Path on it. That night your fingertips heard everything that was about to end." }
            etkiler:
              - ahlak: { insanlik: -3 }
            sonraki: "yol_olusumu_oz_olum"
          - id: "koruma"
            etiket: { tr: "İçindeki Koruma'ya uzan", en: "Reach for the Warding in you" }
            goster: { oz: "koruma" }
            kronik: { tr: "Yolunu Koruma'ya dayandırdın; çizdiğin çizginin içinde kalan her şeyin hesabını vermeyi üstlendin.", en: "You grounded your Path in Warding. Everything inside the line you drew became yours to answer for." }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "yol_olusumu_oz_koruma"
          - id: "yikim"
            etiket: { tr: "İçindeki Yıkım'a uzan", en: "Reach for the Ruin in you" }
            goster: { oz: "yikim" }
            kronik: { tr: "Yolunu Yıkım'la başlattın; o geceden sonra hiçbir şeye en zayıf yerini görmeden bakamaz oldun.", en: "You started your Path with Ruin. From that night on, you couldn't look at anything without seeing its weakest point." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -1 }
            sonraki: "yol_olusumu_oz_yikim"
          - id: "zaman"
            etiket: { tr: "İçindeki Zaman'a uzan", en: "Reach for the Time in you" }
            goster: { oz: "zaman" }
            kronik: { tr: "Yolunu Zaman'la başlatmaya karar verdin; o gece öncesiyle sonrası arasındaki ince çizgi parmaklarının arasındaydı.", en: "You decided to begin your Path with Time. That night, the thin line between before and after was right between your fingers." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "yol_olusumu_oz_zaman"
          - id: "avlanma"
            etiket: { tr: "İçindeki Avlanma'ya uzan", en: "Reach for the Hunt in you" }
            goster: { oz: "avlanma" }
            kronik: { tr: "Avlanma'yı seçtiğin an, şehirde kaçmaya hazır ne varsa senin avın oldu.", en: "The moment you chose the Hunt, everything in the city that was ready to run became your prey." }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "yol_olusumu_oz_avlanma"
          - id: "yanki_oz"
            etiket: { tr: "İçindeki {npc:yanki} Öz'üne uzan", en: "Reach for the {npc:yanki} Essence in you" }
            goster: { oz: "yanki" }
            kronik: { tr: "Sistem'in tanımlayamadığı Öz'e uzandın; pencerelerin o an bozuldu ve seni tam okuyamadı.", en: "You reached for the Essence the System can't define. Your windows glitched on the spot and couldn't quite read you." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
            sonraki: "yol_olusumu_oz_yanki"
          - id: "bilinmeyen"
            etiket: { tr: "Hiç tutmadığın bir şeye uzan", en: "Reach for something you've never held" }
            kronik: { tr: "Yolunu hiç kavramadığın bir şeyden kurmaya kalktın; Sistem bunu hata diye kaydetti, sen başlangıç diye.", en: "You built your Path out of something you'd never grasped. The System logged it as an error. You logged it as a beginning." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - can: -500
            sonraki: "yol_olusumu_bilinmeyen"
          - id: "yankiya_birak"
            etiket: { tr: "{npc:yanki|e} bırak, o seçsin", en: "Leave it to {npc:yanki}. Let it choose" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolunu seçme işini {npc:yanki|e} bıraktın; gücünün bir parçasını onun sesine emanet ettin.", en: "You left the choice of your Path to {npc:yanki}, and trusted part of your power to its voice." }
            etkiler:
              - ahlak: { insanlik: -4 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            sonraki: "yol_olusumu_yanki_secer"

      # ---------------------------------------------------------------- Öz başına eş seçimi
      - id: "yol_olusumu_oz_ates"
        paragraflar:
          - { tr: "Ateş avucuna geliyor ve bir an seni de yakmayı aklından geçiriyor. Sonra seni tanıyıp parmaklarının arasında evcil bir hayvan gibi kıvrılıyor; gözleriyse yine vahşi.", en: "The Fire comes to your hand and, for a second, thinks about burning you too. Then it recognizes you and curls between your fingers like a pet, except its eyes stay wild." }
          - { tr: "Ateş tek başına yaşamaz; ya bir şeyi ısıtmak ister ya da yakıp kül etmek. Hangisi olacağına yanına koyacağın ikinci Öz karar verecek.", en: "Fire doesn't live alone. It wants to warm something or burn something down. Which one depends on the second Essence you hand it." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Ateşi Koruma'yla ör: bir sur", en: "Weave Fire with Warding: a wall" }
            kronik: { tr: "Ateşle Koruma'yı birleştirdin ve içindekilere ocak, dışındakilere fırın olan bir sur çektin.", en: "You fused Fire with Warding and raised a wall: a hearth for everyone inside, a furnace for everything out." }
            etkiler:
              - oz: { ates: 100, koruma: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_kor_sur"
          - id: "kul_dogan"
            etiket: { tr: "Ateşi Yıkım'la ör: yak ve yeniden doğ", en: "Weave Fire with Ruin: burn down, rise again" }
            kronik: { tr: "Ateşi Yıkım'la ördün; önce kendini yaktın, sonra küllerinden daha ağır, daha sıcak bir bedenle kalktın.", en: "You wove Fire with Ruin. You burned yourself down first, then rose from the cinders in a heavier, hotter body." }
            etkiler:
              - oz: { ates: 100, yikim: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -4, insanlik: -4 }
              - iliski: { yanki: { saygi: 8, korku: 3 } }
            sonraki: "yol_olusumu_kul_dogan"

      - id: "yol_olusumu_oz_uzay"
        paragraflar:
          - { tr: "Uzay'a uzandığında elin hiçbir şeye değmiyor, çünkü dokunduğun şey aradaki boşluğun ta kendisi. {yer:kordon} ile Kule arasındaki mesafe avucunda bir mendil gibi katlanıp küçülüyor.", en: "When you reach for Space, your hand doesn't touch anything, because what you're touching is the gap itself. The distance between {yer:kordon} and the Spire folds down small in your palm, like a handkerchief." }
          - { tr: "Mesafe silah da olabilir, kapı da. Hangisi olacağını ikinci Öz söyleyecek.", en: "Distance can be a weapon or a door. The second Essence will decide which." }
        secenekler:
          - id: "ufuk_avcisi"
            etiket: { tr: "Uzay'ı Avlanma'yla ör: ufku avla", en: "Weave Space with the Hunt: hunt the horizon" }
            kronik: { tr: "Uzayı Avlanma'yla ördün; gözünün gördüğü her yer bir adım ötene geldi.", en: "You wove Space with the Hunt. Anywhere you could see was suddenly one step away." }
            etkiler:
              - oz: { uzay: 100, avlanma: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "bosluk_yurur"
            etiket: { tr: "Uzay'ı Ölüm'le ör: boşlukta yürü", en: "Weave Space with Death: walk the void" }
            kronik: { tr: "Uzayla Ölüm'ü birleştirdin; dünyaların arasındaki karanlık sana koridor oldu.", en: "You fused Space with Death. The dark between worlds became your hallway." }
            etkiler:
              - oz: { uzay: 100, olum: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { insanlik: -5, duzen: -2 }
              - iliski: { yanki: { guven: 5, korku: 3 } }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_oz_olum"
        paragraflar:
          - { tr: "Ölüm'e uzandığında sıcaklık parmak uçlarından çekiliyor. Elin buz kesiyor ama ölmüyor, yalnızca dinliyor. Şehrin dört bir yanında bitmek üzere olan şeylerin sesi geliyor kulağına: bir mum, bir köpek, bir ihtiyar.", en: "When you reach for Death, the warmth drains out of your fingertips. Your hand goes cold. It doesn't die. It just listens. All over the city you can hear the things that are about to end: a candle, a dog, an old man." }
          - { tr: "Ölüm bir sondur ama sonlar pazarlığa açıktır. Neyin pazarlığını yapacağını ikinci Öz belirleyecek.", en: "Death is an ending, but endings take bargains. The second Essence decides what you'll be bargaining over." }
        secenekler:
          - id: "son_saat"
            etiket: { tr: "Ölüm'ü Zaman'la ör: son saati bil", en: "Weave Death with Time: know the last hour" }
            kronik: { tr: "Ölümü Zaman'la ördün; herkesin son saatini görmek, istersen birkaçını ertelemek artık elindeydi.", en: "You wove Death with Time. Everyone's last hour was now yours to see, and a few of them yours to push back." }
            etkiler:
              - oz: { olum: 100, zaman: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { yanki: { saygi: 5, guven: 3 } }
            sonraki: "yol_olusumu_son_saat"
          - id: "bosluk_yurur"
            etiket: { tr: "Ölüm'ü Uzay'la ör: boşlukta yürü", en: "Weave Death with Space: walk the void" }
            kronik: { tr: "Ölümü Uzay'la ördün ve dünyalar arasındaki karanlıkta yürümenin yolunu buldun.", en: "You wove Death with Space and found a way to walk the dark between worlds." }
            etkiler:
              - oz: { olum: 100, uzay: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { insanlik: -5, duzen: -2 }
              - iliski: { yanki: { guven: 5, korku: 3 } }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_oz_koruma"
        paragraflar:
          - { tr: "Koruma'ya uzandığında çevrende görünmez ama inatçı bir çizgi beliriyor; rüzgâr ona çarpıp ikiye ayrılıyor. Çizginin içinde kalan her şey bir anda senin oluyor: senin malın değil, senin sorumluluğun.", en: "When you reach for Warding, a line appears around you. Invisible, but stubborn. The wind hits it and splits in two. Everything inside that line is suddenly yours. Not yours to own. Yours to answer for." }
          - { tr: "Sınır ya yakar ya durdurur. Seninkinin nasıl bir sınır olacağını ikinci Öz söyleyecek.", en: "A boundary either burns or holds. The second Essence decides which kind of boundary yours will be." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Koruma'yı Ateş'le ör: yanan bir sur", en: "Weave Warding with Fire: a burning wall" }
            kronik: { tr: "Koruma'yı Ateş'le ördün; çizginin içi ısındı, dışına değen her şey kora döndü.", en: "You wove Warding with Fire. Inside the line it was warm; anything that touched the outside turned to embers." }
            etkiler:
              - oz: { koruma: 100, ates: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_kor_sur"
          - id: "durmus_kalkan"
            etiket: { tr: "Koruma'yı Zaman'la ör: anı dondur", en: "Weave Warding with Time: freeze the moment" }
            kronik: { tr: "Koruma'yı Zaman'la birleştirdin; çizgine varan her şey orada, havada asılı kaldı.", en: "You fused Warding with Time. Anything that reached your line just hung there in midair." }
            etkiler:
              - oz: { koruma: 100, zaman: 100 }
              - yol: "durmus_kalkan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 5, duzen: 3 }
              - iliski: { yanki: { saygi: 4, guven: 3 } }
            sonraki: "yol_olusumu_durmus_kalkan"

      - id: "yol_olusumu_oz_yikim"
        paragraflar:
          - { tr: "Yıkım'a uzandığında ayağının altındaki zemin çatlıyor. Çatlak bir harita gibi yayılıp her yapının, her bedenin, her sözün en zayıf yerini gösteriyor. Bundan sonra onları görmeden bakamayacaksın.", en: "When you reach for Ruin, the ground under you cracks. The crack spreads like a map: the weakest point of every building, every body, every promise. You'll never be able to unsee them now." }
          - { tr: "Yıkım ya yenisine yer açar ya da bir şeyin peşine düşer. Hangisi olduğunu ikinci Öz belirleyecek.", en: "Ruin either clears space for something new or goes chasing something down. The second Essence decides which." }
        secenekler:
          - id: "kul_dogan"
            etiket: { tr: "Yıkım'ı Ateş'le ör: yak ve yeniden doğ", en: "Weave Ruin with Fire: burn down, rise again" }
            kronik: { tr: "Yıkımı Ateş'le birleştirdin; kendi küllerinden kalkıp yeniden kuruldun.", en: "You fused Ruin with Fire. You rose from your own cinders and put yourself back together." }
            etkiler:
              - oz: { yikim: 100, ates: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -4, insanlik: -4 }
              - iliski: { yanki: { saygi: 8, korku: 3 } }
            sonraki: "yol_olusumu_kul_dogan"
          - id: "yikici_av"
            etiket: { tr: "Yıkım'ı Avlanma'yla ör: kaçış yollarını kır", en: "Weave Ruin with the Hunt: break every escape" }
            kronik: { tr: "Yıkımı Avlanma'yla ördün; şehrin her sokağı, her yarığı kırabileceğin bir çizgiye dönüştü.", en: "You wove Ruin with the Hunt. Every street and every crack in the city became a line you could break." }
            etkiler:
              - oz: { yikim: 100, avlanma: 100 }
              - yol: "yikici_av"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -6, duzen: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_yikici_av"

      - id: "yol_olusumu_oz_zaman"
        paragraflar:
          - { tr: "Zaman'a uzandığında her şey bir kare geride kalıyor. Nefesinin sesi senden önce geliyor, bir martının kanat çırpışı ikiye bölünüyor. Öncesiyle sonrası arasındaki ince çizgi parmaklarının arasında.", en: "When you reach for Time, everything slips one frame behind. You hear your own breath before you take it. A gull's wingbeat splits in two. The thin line between before and after is right there between your fingers." }
          - { tr: "Zaman üç şeyle evlenebilir: bir sonla, bir kalkanla ya da Sistem'in adını koyamadığı bir sesle. Seç.", en: "Time can marry three things: an ending, a shield, or a voice the System can't put a name to. Make your pick." }
        secenekler:
          - id: "son_saat"
            etiket: { tr: "Zaman'ı Ölüm'le ör: son saati bil", en: "Weave Time with Death: know the last hour" }
            kronik: { tr: "Zamanı Ölüm'le birleştirdin; herkesin üstünde ince, beyaz rakamlarla son saatini görmeye başladın.", en: "You fused Time with Death, and began to see everyone's last hour in thin white numbers." }
            etkiler:
              - oz: { zaman: 100, olum: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { yanki: { saygi: 5, guven: 3 } }
            sonraki: "yol_olusumu_son_saat"
          - id: "durmus_kalkan"
            etiket: { tr: "Zaman'ı Koruma'yla ör: anı dondur", en: "Weave Time with Warding: freeze the moment" }
            kronik: { tr: "Zamanla Koruma'yı birleştirip dünyanın en sabırlı kalkanını kurdun; darbeler çizgine varıp orada donuyordu.", en: "You fused Time with Warding and built the most patient shield in the world. Blows reached your line and froze there." }
            etkiler:
              - oz: { zaman: 100, koruma: 100 }
              - yol: "durmus_kalkan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 5, duzen: 3 }
              - iliski: { yanki: { saygi: 4, guven: 3 } }
            sonraki: "yol_olusumu_durmus_kalkan"
          - id: "yankinin_yolu"
            etiket: { tr: "Zaman'ı {npc:yanki|le} ör: döngüden geç", en: "Weave Time with {npc:yanki}: pass through the loop" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Zamanı Sistem'in tanımlayamadığı sesle ördün ve döngünün içinden geçebilecek bir yol açtın.", en: "You wove Time with the voice the System can't define, and opened a path that could pass through the loop." }
            etkiler:
              - oz: { zaman: 100, yanki: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { duzen: -4, insanlik: -3 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
            sonraki: "yol_olusumu_yankinin_yolu"

      - id: "yol_olusumu_oz_avlanma"
        paragraflar:
          - { tr: "Avlanma'ya uzandığında burnun keskinleşiyor, kulakların kurt kulağına dönüyor. Şehirde kaçmaya hazır ne varsa hissediyorsun: bir fare, bir hırsız, bir Kadim gözcüsü. Hepsi bir anda av oluveriyor.", en: "When you reach for the Hunt, your nose sharpens and your ears turn into a wolf's. You can feel everything in the city that's ready to run: a rat, a thief, an Ancient scout. All of it becomes prey at once." }
          - { tr: "Avcı ya mesafeyi ortadan kaldırır ya da kaçış yolunu. Hangisini yapacağını ikinci Öz söyleyecek.", en: "A hunter either erases the distance or erases the way out. The second Essence decides which." }
        secenekler:
          - id: "ufuk_avcisi"
            etiket: { tr: "Avlanma'yı Uzay'la ör: ufku avla", en: "Weave the Hunt with Space: hunt the horizon" }
            kronik: { tr: "Avlanma'yı Uzay'la birleştirdin; gözünün gördüğü hiçbir yer artık bir adımdan uzak değildi.", en: "You fused the Hunt with Space. Nothing you could see was more than a step away anymore." }
            etkiler:
              - oz: { avlanma: 100, uzay: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "yikici_av"
            etiket: { tr: "Avlanma'yı Yıkım'la ör: kaçış yollarını kır", en: "Weave the Hunt with Ruin: break every escape" }
            kronik: { tr: "Avlanma'yı Yıkım'la birleştirdin; o gece kaçış yollarını bir bakışla kırabildiğini gördün.", en: "You fused the Hunt with Ruin. That night you found you could break an escape route just by looking at it." }
            etkiler:
              - oz: { avlanma: 100, yikim: 100 }
              - yol: "yikici_av"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -6, duzen: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "yol_olusumu_yikici_av"

      - id: "yol_olusumu_oz_yanki"
        paragraflar:
          - { tr: "Sistem'in tanımını eksik bulduğu Öz'e uzandığın an pencerelerin bozuluyor. Elinde tuttuğun şey hem bir ses hem bir anı hem bir hata; ama hiçbiri tam olarak değil.", en: "You reach for the Essence the System calls incomplete, and every one of your windows glitches for a second. What you're holding is a sound, a memory, an error. All three at once, and none of them all the way." }
          - { tr: "{npc:yanki} hiç bu kadar sessiz kalmamıştı. Sonunda çok alçak bir sesle: bu benim. bir parçam, yani. yanına koyabileceğin tek şey zaman. geride kalan şey ancak zamanla bir şeye dönüşür.", en: "{npc:yanki} has never been this quiet. Then, very low: that's me. a piece of me, anyway. the only thing you can put next to it is time. what lingers only turns into something when it has time to linger in." }
        secenekler:
          - id: "yankinin_yolu"
            etiket: { tr: "Onu Zaman'la ör: döngüden geç", en: "Weave it with Time: pass through the loop" }
            kronik: { tr: "Sistem'in adını koyamadığı sesi Zaman'a bağladın; Yolun döngünün içinden geçecek biçimde doğdu.", en: "You bound the voice the System can't name to Time. Your Path was born to pass through the loop." }
            etkiler:
              - oz: { yanki: 100, zaman: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { duzen: -4, insanlik: -3 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
            sonraki: "yol_olusumu_yankinin_yolu"
          - id: "geri_cekil"
            etiket: { tr: "Elini çek, başka bir şeye uzan", en: "Pull your hand back. Reach for something else" }
            kronik: { tr: "Sistem'in tanımlayamadığı Öz'ü bırakıp başka bir şeye uzandın; {npc:yanki} o gece bu konuda tek söz etmedi.", en: "You let go of the Essence the System can't define and reached for something else. {npc:yanki} didn't say a word about it that night." }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: -4, saygi: 3 } }
            sonraki: "yol_olusumu_bilinmeyen"

      - id: "yol_olusumu_bilinmeyen"
        paragraflar:
          - { tr: "Hiç tutmadığın bir şeye uzanmak, karanlıkta kızgın bir sobaya el sürmek gibi. İçinin derinlerinden bir duman yükseliyor; Can çubuğun kırmızıya düşüp orada kalıyor.", en: "Reaching for something you've never held is like groping for a hot stove in the dark. Smoke rises from somewhere deep in you. Your HP bar drops into the red and stays there." }
          - { tr: "Ama acının altında bir şeyin seni tanımaya başladığını hissediyorsun. Kavranmamış Öz'ler aralık kapıdan içeri bakan yabancılara benziyor; girmek için bir davet bekliyorlar, o kadar.", en: "But under the pain, you can feel something starting to recognize you. The Essences you never grasped are like strangers peering through a cracked door, just waiting for an invitation." }
          - { tr: "Sistem bir uyarı bile vermiyor; verebileceği en açık uyarı da bu zaten.", en: "The System doesn't even throw a warning. Which is the clearest warning it could give." }
        secenekler:
          - id: "kor_sur"
            etiket: { tr: "Arkandakileri düşün: Ateş ve Koruma", en: "Think of who's behind you: Fire and Warding" }
            kronik: { tr: "Hiç tutmadığın Ateş'i ve Koruma'yı arkandakiler için kavradın; bedelini kendi canından ödedin.", en: "You grasped Fire and Warding, neither of which you'd ever held, for the people behind you. You paid for it out of your own hide." }
            etkiler:
              - oz: { ates: 100, koruma: 100 }
              - yol: "kor_sur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 6, insanlik: 3 }
            sonraki: "yol_olusumu_kor_sur"
          - id: "ufuk_avcisi"
            etiket: { tr: "Kaçanları düşün: Uzay ve Avlanma", en: "Think of the ones who run: Space and the Hunt" }
            kronik: { tr: "Hiç tutmadığın Uzay'ı ve Avlanma'yı kaçanlar için kavradın; ufku avlamak uğruna kanınla ödedin.", en: "Without ever having held them, you grasped Space and the Hunt for the ones who run, and paid in blood to hunt the horizon." }
            etkiler:
              - oz: { uzay: 100, avlanma: 100 }
              - yol: "ufuk_avcisi"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, duzen: -2 }
            sonraki: "yol_olusumu_ufuk_avcisi"
          - id: "son_saat"
            etiket: { tr: "Kaybettiklerini düşün: Ölüm ve Zaman", en: "Think of who you've lost: Death and Time" }
            kronik: { tr: "Kaybettiklerin uğruna, hiç tutmadığın Ölüm'ü ve Zaman'ı kavradın; o gece herkesin son saatini görmeye başladın.", en: "For the people you'd lost, you grasped Death and Time without ever having held them. That night you began to see everyone's last hour." }
            etkiler:
              - oz: { olum: 100, zaman: 100 }
              - yol: "son_saat"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: 3, insanlik: -1 }
            sonraki: "yol_olusumu_son_saat"
          - id: "kul_dogan"
            etiket: { tr: "Kendi küllerini düşün: Yıkım ve Ateş", en: "Think of your own cinders: Ruin and Fire" }
            kronik: { tr: "Kendi küllerini düşünüp hiç tutmadığın Yıkım'a ve Ateş'e sarıldın; yanıp yeniden kalkmayı göze aldın.", en: "Thinking of your own cinders, you took hold of Ruin and Fire, neither of which you'd ever held, and dared to burn and rise again." }
            etkiler:
              - oz: { yikim: 100, ates: 100 }
              - yol: "kul_dogan"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 200
              - ahlak: { merhamet: -3, insanlik: -4 }
            sonraki: "yol_olusumu_kul_dogan"
          - id: "bosluk_yurur"
            tur: "gosteris"
            etiket: { tr: "İkisini birden, acısız tut: Uzay ve Ölüm", en: "Hold both at once, no pain: Space and Death" }
            gerekli: { stat: { wil: 220 } }
            kronik: { tr: "Hiç kavramadığın iki Öz'ü aynı anda tuttun ve yüzünü bile buruşturmadın; dünyaların arasındaki karanlık sana açıldı.", en: "You held two Essences you'd never grasped, both at once, without flinching. The dark between worlds became your hallway." }
            etkiler:
              - oz: { uzay: 100, olum: 100 }
              - yol: "bosluk_yurur"
              - bayrak: "yol_olustu"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 220
              - can: 500
              - ahlak: { insanlik: -5, duzen: -2 }
            sonraki: "yol_olusumu_bosluk_yurur"

      - id: "yol_olusumu_yanki_secer"
        paragraflar:
          - { tr: "{npc:yanki} bir an hiçbir şey söylemiyor. Derken kafanın içinde ilk kez iki sesin birden konuştuğunu duyuyorsun: biri onun, öteki seninkine benziyor ama hiç kurmadığın bir cümleyi kuruyor.", en: "For a second, {npc:yanki} says nothing. Then, for the first time ever, you hear two voices talking in your head at once. One is its voice. The other sounds like yours, except it's saying something you never said." }
          - { tr: "zaman ve ben, diyor. geride kalan şey ve onu taşıyan saat. başka hiçbir yol seni döngüden geçirmez, bu geçirir. ama bilmen gereken bir şey var: bu yolda kelimelerin yarısı benim olur. yarısı. pazarlığı yok.", en: "time and me, it says. what lingers, and the clock that carries it. no other path gets you through the loop. this one does. but here's what you need to know: on this path, half the words are mine. half. no haggling." }
          - metin: { tr: "Sesin altındaki açlık artık saklanmıyor. Yarısı, diyor; ama söyleyişi, yarısından fazlasını çoktan almış birininki gibi.", en: "The hunger under its voice isn't hiding anymore. Half, it says, and it says it like it's already taken more than half." }
            kosul: { bayrak: "yanki_ele_gecirdi" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Yarısı senin. Al.\"", en: "\"Half's yours. Take it.\"" }
            kronik: { tr: "Yolunun yarısını {npc:yanki|e} verdin; döngünün içinden geçecek ses artık ikinizin sesiydi.", en: "You gave half your Path to {npc:yanki}. The voice that carries through the loop became both of yours." }
            etkiler:
              - oz: { yanki: 100, zaman: 100 }
              - yol: "yankinin_yolu"
              - bayrak: "yol_olustu"
              - bayrak: "yol_yankiya_birakildi"
              - unvan: "ilk_yol_acan"
              - xp_seviye: 220
              - ahlak: { insanlik: -6, duzen: -3 }
              - yozlasma: 8
              - iliski: { yanki: { guven: 15, baglilik: 15 } }
              - hafiza: { npc: "yanki", id: "olay:yol_olusumu", agirlik: 70 }
            sonraki: "yol_olusumu_yankinin_yolu"
          - id: "reddet"
            etiket: { tr: "\"Hayır. Kendim seçeceğim.\"", en: "\"No. I'll choose for myself.\"" }
            kronik: { tr: "{npc:yanki|in} teklifini geri çevirdin; gücün ne olacaksa olsun, kelimelerini sen seçecektin.", en: "You turned down {npc:yanki|pos} offer. Whatever your power became, you would choose its words yourself." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { guven: -6, saygi: 6 } }
            sonraki: "yol_olusumu_secim"

      # ---------------------------------------------------------------- Yolların doğuşu
      - id: "yol_olusumu_kor_sur"
        paragraflar:
          - { tr: "Ateş Koruma'nın çizgisine yapışınca çizgi tutuşuyor, ama yalnızca dışa doğru yanar. Çevrende turuncu, yarı saydam bir sur yükseliyor. Senin tarafında hava fırından yeni çıkmış ekmek kokusuyla dolu.", en: "The Fire catches on the line of the Warding and the line starts to burn. Outward. Only outward. A half-clear wall of orange rises around you, and on your side of it the air smells like a bakery." }
          - metin: { tr: "Halkanın ön sırasındakiler sıcaklığı yüzlerinde duyarken bir çocuk elini surun içine uzatıyor; hiçbir şey olmuyor, yalnızca parmakları ısınıyor. Kalabalıktan alçak bir uğultu yayılıyor.", en: "The front of the ring feels the heat on their faces. A kid sticks a hand into the wall and nothing happens; their fingers just get warm. A low murmur rolls through the crowd." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - { tr: "Surun dış yüzüne konan bir güve o anda kora dönüyor. Bir sınır çizdin: içindekilere ocak, dışındakilere fırın.", en: "A moth lands on the outer face of the wall and turns to an ember on the spot. You've drawn a line: a hearth for everything inside, a furnace for everything out." }
          - metin: { tr: "{npc:yanki} uzun süre susuyor, sonra: önceki de bunu seçmişti. ama onun suru bu kadar sıcak değildi. içi bu kadar sıcak değildi.", en: "{npc:yanki} is quiet for a long time. Then: the last one picked this too. but their wall wasn't this warm. not on the inside." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "genislet"
            etiket: { tr: "Suru genişlet; mahalleyi içine al", en: "Push the wall out. Take in the whole block" }
            kronik: { tr: "Surunu koca bir mahalleye yaydın; o gece o sokaklarda kimse surun dışında kalmadı.", en: "You stretched your wall over a whole block. Nobody on those streets was left outside it that night." }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 6 }
            sonraki: "yol_olusumu_son"
          - id: "dar_tut"
            etiket: { tr: "Dar tut, yalnızca seninkiler kalsın", en: "Keep it tight. Just your own" }
            kronik: { tr: "Surunu yalnız kendi insanlarına çektin; dışarıda kalanlar o gece sınırın hangi yanında olduklarını gördü.", en: "You drew your wall around your own people and nobody else. That night, the ones outside learned which side of the line they stood on." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 3 }
              - itibar: { lonca: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_kul_dogan"
        paragraflar:
          - { tr: "Önce sen yanıyorsun, derinden, kemiklerine kadar. Bir an bütünüyle kül oluyorsun; rüzgâr seni savurmak için eğiliyor. Sonra kül toplanıyor, bir araya gelip ayağa kalkıyor.", en: "You burn first. Deep, down to the bone. For one second you're nothing but cinders, and the wind leans in to scatter you. Then the cinders gather, pull together, and stand up." }
          - { tr: "Yeniden kurulan beden eskisinden hem ağır hem sıcak. Parmaklarının arasından ince bir duman tütüyor; bastığın her yerde taş kararıp sertleşiyor.", en: "The body that rebuilds itself is heavier and hotter than the old one. Thin smoke curls up between your fingers, and everywhere you step, the stone darkens and hardens." }
          - metin: { tr: "Meydandaki halka geri çekiliyor. Kimi dua ediyor, kimi ağlıyor; ön sıradaki ihtiyarsa cenazedeymiş gibi yalnızca şapkasını çıkarıyor.", en: "The ring in the square pulls back. Somebody's praying, somebody's crying, and the old man up front just takes off his hat, like he's at a funeral." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "{npc:yanki|in} sesinde hayranlığa yakın bir şey var: kendini yaktın ve geri geldin. sistem bunu hata diye kaydetmeye çalışıyor; kayıt da yanıyor.", en: "{npc:yanki}, almost admiring: you burned yourself down and came back. the System's trying to log it as an error. the log's on fire too." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Ateşi içine çek, dumanı söndür", en: "Pull the fire back in. Kill the smoke" }
            kronik: { tr: "Yeniden doğduğun gece dumanını içine çektin; ne kadar yandığını kimseye göstermedin.", en: "The night you were reborn, you swallowed your own smoke. You didn't let anyone see how badly you'd burned." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - gizle: 3
            sonraki: "yol_olusumu_son"
          - id: "yak"
            etiket: { tr: "Bırak yansın; Kadim gemisi görsün", en: "Let it burn. Let the Ancient ship see" }
            kronik: { tr: "Küllerinden kalktığın gece alevini göğe savurdun; Kadim gemisinin bunu görmesini istedin.", en: "The night you rose from the ashes, you threw your flame at the sky. You wanted the Ancient ship to see it." }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -1 }
              - dikkat: 6
              - degisken: { kadim_tehdit: -3 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_ufuk_avcisi"
        paragraflar:
          - { tr: "Mesafe katlanıyor. Bir an Kule'nin tepesindesin, bir an körfezin ortasındaki şamandıranın, bir an da {yer:tepe|in} en yüksek damının üstünde; her birine bakman yetiyor.", en: "Distance folds. One second you're on top of the Spire, the next you're standing on the buoy in the middle of the bay, the next you're on the highest roof in {yer:tepe}. All you have to do is look." }
          - { tr: "Gözünün gördüğü her yer bir adım ötende. Kadim gemisine baktığında aradaki onca kilometre, karşı köşeye olan mesafe kadar anlamını yitiriyor. Bunu sen biliyorsun; artık onlar da biliyor.", en: "Anywhere you can see is one step away. You look at the Ancient ship, and the miles between you and it mean about as much as the distance across a street. You know that now. So do they." }
          - metin: { tr: "{npc:yanki}: oradan bizi izleyen biri şu an bardağını düşürdü, eminim. bir kadimin elinden bir şey düştüğünü hiç görmedim ama eminim.", en: "{npc:yanki}: somebody watching us from up there just dropped their glass. i'm sure of it. i've never seen an ancient drop anything, but i'm sure." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "adim"
            etiket: { tr: "Bir adım at; gemiye dokunup geri dön", en: "Take one step. Touch the ship and come back" }
            kronik: { tr: "Tek adımda Kadim gemisine varıp gövdesine dokundun ve geri döndün; onlara bundan sonra seni hesaba katmaları gerektiğini gösterdin.", en: "In a single step you reached the Ancient ship, touched its hull and came back. You showed them they'd have to reckon with you now." }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - dikkat: 8
              - degisken: { kadim_tehdit: -4 }
            sonraki: "yol_olusumu_son"
          - id: "bekle"
            etiket: { tr: "Bakmakla yetin; avı ürkütme", en: "Just look. Don't spook the prey" }
            kronik: { tr: "Kadim gemisini yalnızca izlemekle yetindin; avı ürkütmemek için gücünü sakladın.", en: "You settled for watching the Ancient ship. You kept your power hidden so you wouldn't spook the prey." }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 3
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_son_saat"
        paragraflar:
          - { tr: "Herkesin üstünde bir saat beliriyor: yalnız senin görebildiğin ince, beyaz rakamlar. {yer:kiyikent_liman} bekçisinin üstünde on bir yıl, bir bebeğin üstünde seksen dört, bir köpeğin üstünde dört saat.", en: "A clock appears over everyone, thin white numbers only you can see. Over the harbor watchman: eleven years. Over a baby: eighty-four. Over a dog: four hours." }
          - { tr: "Köpeğin saatine dokununca rakamlar bir an titreyip bir saat daha ekliyor. Bedeli göğsünde kalıyor: eksik bir nefes.", en: "You touch the dog's clock. The numbers shiver and one more hour ticks on. The price stays in your chest, one breath short." }
          - metin: { tr: "Sonra kendi başının üstüne bakıyorsun. Orada saat yok; yalnızca ağır ağır dönen bir soru işareti var.", en: "Then you look up at yourself. There's no clock there. Just a question mark, turning slowly." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "{npc:yanki}: ben de kendi saatimi hiç göremedim. belki bizim gibilerin saati olmuyor. belki tek bir saat var ve hepimiz onun içindeyiz.", en: "{npc:yanki}: i've never been able to see my own clock either. maybe things like us don't get one. maybe there's only one clock, and we're all inside it." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "ertele"
            etiket: { tr: "Bu gece birkaç saati daha ertele", en: "Push back a few more clocks tonight" }
            kronik: { tr: "O gece birkaç yabancının son saatini erteledin; her birinin bedelini göğsünde eksik kalan bir nefesle ödedin.", en: "That night you pushed back a few strangers' last hours, and paid for each one with a breath you couldn't get back." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - can: -300
            sonraki: "yol_olusumu_son"
          - id: "izle"
            etiket: { tr: "Saatlere dokunma; yalnızca bil", en: "Don't touch the clocks. Just know" }
            kronik: { tr: "İlk gece hiçbir saate dokunmadın; bilmenin ağırlığını tek başına yüklendin.", en: "On your Path's first night, you didn't touch a single clock. You carried the weight of knowing all by yourself." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_durmus_kalkan"
        paragraflar:
          - { tr: "Koruma'nın çizgisinde zaman donuyor. Attığın taş çizgiye varınca havada kalıyor; ne düşüyor ne geri sekiyor, yalnızca bekliyor.", en: "Time freezes on the line of the Warding. You toss a stone and it hangs in the air the moment it hits the line. It doesn't fall. It doesn't bounce back. It just waits." }
          - { tr: "Koruduğun şeye inen her darbe böyle olacak: hep inmek üzere, ama hiç varmadan. Dünyanın en sabırlı kalkanı bu.", en: "Every blow aimed at whatever you're guarding is going to be like that: about to land, and never landing. The most patient shield in the world." }
          - metin: { tr: "{npc:deniz_arman} önce havada asılı taşa, sonra kendi kalkanına bakıyor. \"Ömrüm boyunca bunu yapmaya uğraştım,\" diyor. \"Sen bir gecede yaptın.\" Kıskanıyor mu, gururlanıyor mu, kendisi de bilmiyor.", en: "{npc:deniz_arman} watches the stone hanging in the air, then looks at {zamir:deniz_arman|onun} own shield. \"I've spent my whole life trying to do that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You did it in one night.\" Jealous or proud, {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't know either." }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "dondur"
            etiket: { tr: "Taşı orada bırak, hatıra olsun", en: "Leave the stone there. A keepsake" }
            kronik: { tr: "Yolunun doğduğu yerde bir taşı havada asılı bıraktın; geride herkesin görebileceği bir hatıra kaldı.", en: "Where your Path was born, you left a stone hanging in midair, a keepsake anyone could see." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3, yukselenler: 3 }
            sonraki: "yol_olusumu_son"
          - id: "birak_dussun"
            etiket: { tr: "Taşı bırak, düşsün; gösteri değil bu", en: "Let the stone drop. This isn't a show" }
            kronik: { tr: "Taşın yere düşmesine göz yumdun; gücünü bir gösteriye dönüştürmek istemedin.", en: "You let the stone drop. You didn't want your power turned into a show." }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 3
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_bosluk_yurur"
        paragraflar:
          - { tr: "Önünde bir kapı açılmıyor; dünyanın kendisi bir perde gibi kenarından kalkıyor. Ardında karanlık var ama boş bir karanlık değil: uzak dünyaların ışıkları, tozlu bir camın ardındaki sokak lambaları gibi parıldıyor.", en: "No door opens in front of you. The world itself just lifts up at one corner, like a curtain. Behind it is darkness, but not an empty one. The lights of faraway worlds, like streetlamps behind a dusty window." }
          - { tr: "Bir adım atıyorsun; ikinci adımın {yer:eski_sehir|in} öbür ucunda yere basıyor. Aradaki koridorda soğuk bir şey yanından süzülüp geçiyor, sana bir bakıp yol veriyor.", en: "You take a step, and your next one lands on the far side of {yer:eski_sehir}. In the hallway you passed through, something cold drifts past you, takes a look, and gets out of your way." }
          - metin: { tr: "{npc:yanki}: orada ölü olan tek şey sen değilsin, biliyorsun. ama sana yol veriyorlar. bunu düşünmek bile istemem.", en: "{npc:yanki}: you're not the only dead thing in there, you know. but they make way for you. i don't want to think about that." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "koridor"
            etiket: { tr: "Koridorda biraz daha kal; dinle", en: "Stay in the hallway a little longer. Listen" }
            kronik: { tr: "Dünyaların arasındaki karanlıkta oyalanıp oradaki fısıltılara kulak verdin.", en: "You lingered in the dark between worlds and listened to what whispered there." }
            etkiler:
              - ahlak: { insanlik: -3 }
              - yozlasma: 4
              - bilgi: "bosluk_fisiltisi"
            sonraki: "yol_olusumu_son"
          - id: "geri_don"
            etiket: { tr: "Hemen ışığa dön", en: "Get back to the light. Now" }
            kronik: { tr: "Karanlıktan hemen ışığa döndün; içindeki insanı o koridora kaptırmak istemedin.", en: "You came straight back out of the dark into the light. You weren't going to lose the human in you to that hallway." }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_yikici_av"
        paragraflar:
          - { tr: "Şehrin üstüne bir ağ iniyor; ama bu kez ağı ören sensin. Her sokak, her merdiven, her yarık bir çizgi. Hangisine baksan kırılıyor: oradan artık hiçbir şey kaçamaz.", en: "A net drops over the city, except this time you're the one weaving it. Every street, every stairwell, every crack is a line. You look at one and the line snaps: nothing's getting out that way ever again." }
          - { tr: "{yer:kiyikent_liman|de}ki bir hırsız koşmaya başladığı anda nereye gideceğini de, önündeki her yolun nasıl kırılacağını da biliyorsun. İlk kez içinde avcının değil, avın korkusunu duyuyorsun.", en: "The second a thief on the waterfront breaks into a run, you know exactly where he's headed, and how every road in front of him is going to break. For the first time, you feel the prey's fear from the inside instead of the hunter's thrill." }
          - metin: { tr: "{npc:yanki}: bu yol beni korkutuyor, bilmen gerek. önünden kaçan her şey artık bir çıkmaz sokakta. ben de.", en: "{npc:yanki}: this path scares me. you should know that. everything that runs from you is in a dead end now. me included." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "hirsiz_birak"
            etiket: { tr: "Hırsızın önüne bir yol bırak", en: "Leave the thief one road open" }
            kronik: { tr: "Bir hırsızın önünde kaçacak tek bir yol bıraktın; ağını ilk kez attığın gece merhameti seçtin.", en: "You left a thief one way out. The first night you cast your net, you chose mercy." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "yol_olusumu_son"
          - id: "kapat"
            etiket: { tr: "Bütün yolları kapat; sabaha kadar beklesin", en: "Close every road. Let him wait till morning" }
            kronik: { tr: "Bir hırsızı sabaha kadar çıkmaz sokakta beklettin; şehre ağının nasıl işlediğini gösterdin.", en: "You kept a thief stuck in a dead end until morning, and showed the city how your net works." }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 4 }
              - itibar: { lonca: 4 }
            sonraki: "yol_olusumu_son"

      - id: "yol_olusumu_yankinin_yolu"
        paragraflar:
          - { tr: "Ne bir şey parlıyor ne bir şey yanıyor. Yalnızca çevrendeki bütün sesler bir an gecikip ikinci kez duyuluyor: bir martı, bir dalga, kendi adın. Dünya sana her şeyi iki kez söylüyor.", en: "Nothing glows. Nothing burns. Every sound around you just lags for a second and plays a second time: a gull, a wave, your own name. The world is telling you everything twice." }
          - { tr: "Pencerelerin bozuluyor ve bir daha düzelmiyor. Sistem'in senin hakkında yazdığı her satır artık iki anlama geliyor: ne olduğun ve ne olacağın. Hangisinin doğru olduğunu Sistem de bilmiyor.", en: "Your windows glitch and never quite come back. Every line the System has on you means two things now: what you are, and what you're going to be. The System doesn't know which one's true." }
          - metin: { tr: "{npc:yanki} yine kafanın içinde, ama artık kiracı gibi değil, ortak gibi: hissediyor musun? döngü. bir sonraki dönüşünde bile seni tanıyacağım. bu bir söz değil, bir gerçek.", en: "{npc:yanki} is in your head, but not like a roommate anymore. Like a partner: feel that? the loop. even on the next go-around, i'll know you. that's not a promise. that's just true now." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "yanki"
            nadirlik: "benzersiz"
            baslik: { tr: "[YOL: T̷ANIMSIZ]", en: "[PATH: U̷NDEFINED]" }
            satirlar:
              - { tr: "kategori yok. üst sınır yok. sahibi: iki.", en: "no category. no ceiling. owners: two." }
        secenekler:
          - id: "kabul_et"
            etiket: { tr: "Yankıyı içine al, her şeyi iki kez duy", en: "Let the echo in. Hear everything twice" }
            kronik: { tr: "Döngünün sesini içine aldın ve dünyanın sana her şeyi iki kez söylemesine razı oldun.", en: "You let the loop's voice in, and agreed to hear the world say everything twice." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "yol_olusumu_son"
          - id: "sinir_koy"
            etiket: { tr: "\"Benim sesim önce gelir. Hep.\"", en: "\"My voice goes first. Always.\"" }
            kronik: { tr: "Döngünün sesine bir sınır çizdin: ikinizin arasında önce senin sesin gelecekti.", en: "You put a limit on the loop's voice: between the two of you, yours would come first." }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { saygi: 8, guven: -2 } }
            sonraki: "yol_olusumu_son"

      # ---------------------------------------------------------------- Sabah
      - id: "yol_olusumu_son"
        paragraflar:
          - { tr: "Şafak sökerken gücün nihayet duruluyor. İçinde artık iki ateş değil, tek bir şey var: yalnızca senin kurabileceğin bir cümle. Bir sonraki düşmanın onu duyan ilk kişi olacak.", en: "As the sun comes up, the power finally settles. There aren't two fires in you anymore. There's one thing: a sentence, one only you could ever have put together. Your next enemy is going to hear it for the first time." }
          - metin: { tr: "Kule'den inerken ellili katların tırmanıcıları aralık kapılardan seni süzüyor. Kimse ağzını açmıyor; aşağı vardığındaysa Kule Dibi'ndeki pazar susmuş, herkes başını kaldırmış yukarı bakıyor.", en: "On your way down the Spire, climbers on the fifty-somethings watch you from cracked doorways. Nobody says a word. But by the time you hit the bottom, the market at {yer:kule_dibi} has gone dead quiet and everybody's looking up." }
            kosul: { degisken_min: { yol_yeri: 1 }, degisken_max: { yol_yeri: 1 } }
          - metin: { tr: "{yer:kordon|den} dönerken sabahın ilk balıkçıları kayıklarını suya itiyor. Biri seni görünce haç çıkarıyor, öteki kasketini sallıyor. Su hiç olmadığı kadar sakin.", en: "On your way back from {yer:kordon}, the first fishermen are pushing their boats into the water. One of them crosses himself when he sees you. The other one waves his cap. The water's calmer than it's ever been." }
            kosul: { degisken_min: { yol_yeri: 2 }, degisken_max: { yol_yeri: 2 } }
          - metin: { tr: "Meydandaki halka sabaha kadar dağılmamış. İnsanlar battaniyelere sarınıp yere oturmuşlar; sen ayağa kalkınca hepsi birden kalkıyor. Bu artık bir kalabalık değil, bir tanık.", en: "The ring in the square never broke up. People are sitting on the ground wrapped in blankets, and when you stand up, every one of them stands up too. That's not a crowd anymore. That's a witness." }
            kosul: { degisken_min: { yol_yeri: 3 }, degisken_max: { yol_yeri: 3 } }
          - metin: { tr: "Damdan indiğinde sokakta hiçbir şey değişmemiş: ekmek kuyruğu, bir köpek, bir su bidonu yüzünden kavga eden iki komşu. Aralarından kimin geçtiğini hiçbiri bilmiyor.", en: "You climb down off the roof and nothing on the street has changed: a bread line, a dog, two neighbors fighting over a water jug. None of them has any idea who just walked past." }
            kosul: { degisken_min: { yol_yeri: 4 } }
          - metin: { tr: "{npc:yanki} yorgun, neredeyse mutlu: yaptık. yani sen yaptın, ben izledim. galiba bu sefer doğru izledim.", en: "{npc:yanki}, tired, almost happy: we did it. well, you did it. i watched. i think i watched right this time." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Dünya Katmanı'nda ilk Yol oluştu.", en: "The first Path on the Earth Layer has formed." }
              - { tr: "Sahip: gizli. Konum: gizli. Sistem bu gizliliği onaylamadı.", en: "Owner: hidden. Location: hidden. The System did not approve this privacy." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hâlâ sen misin? Ciddi soruyorum. Senin ağzından duymam lazım.\"", en: "\"Are you still you? I'm serious. I need to hear you say it.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Senin için bir dosya açıyorum. Birinin tutması lazım; Sistem tutmuyorsa ben tutarım.\"", en: "\"I'm keeping a chart on you. Somebody has to. If the System won't, I will.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bütün gece pencerelerinin log'unu çektim. Yarısı okunmuyor. Öbür yarısı... hiç görmediğim bir dil.\"", en: "\"I pulled logs on your windows all night. Half of it won't parse. The other half is... it's a language I've never seen.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İlk Yol ha? Peki. İkincisi benim olacak, hem de seninkinden güzel.\"", en: "\"First Path, huh? Fine. The second one's mine, and it's gonna look better than yours.\"" }
        secenekler:
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Işığı söndür, kimse sormasın", en: "Snuff out the glow. No questions" }
            kronik: { tr: "İlk Yol'un sahibini gizledin; Küresel Duyuru'daki o 'gizli' kelimesinin ardında kimin durduğunu şehre söylemedin.", en: "You kept the owner of the first Path a secret. You didn't tell the city who was behind that word 'hidden' in the Global Announcement." }
            etkiler:
              - gizle: 10
              - bayrak: "yol_gizlendi"
              - ahlak: { duzen: -2, insanlik: 1 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 4, max: 9 } }
            sonraki: "@akis"
          - id: "aciga"
            tur: "aciga_vur"
            etiket: { tr: "Bırak, bütün şehir kimin olduğunu bilsin", en: "Let the whole city know whose it is" }
            kronik: { tr: "İlk Yol'un senin olduğunu bütün şehre ilan ettin; o sabah {yer:kiyikent|de} adın herkesin ağzındaydı.", en: "You told the whole city the first Path was yours. By that morning, your name was on every tongue in {yer:kiyikent}." }
            etkiler:
              - aciga_vur: true
              - bayrak: "yol_tanikli"
              - dikkat: 8
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: 6, yukselenler: 8, siginak: -2, sessiz_ag: 3 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "\"Hâlâ benim. Söz.\"", en: "\"Still me. I promise.\"" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "Yolunun doğduğu sabah {npc:deniz_arman|e} hâlâ sen olduğuna söz verdin ve bu sözü ikinizin arasına bir ölçü gibi koydun.", en: "The morning your Path was born, you promised {npc:deniz_arman} you were still you, and set that promise between you as a yardstick." }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:yol_olusumu", agirlik: 40 }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 5, max: 10 } }
            sonraki: "@akis"
          - id: "yanki_tesekkur"
            etiket: { tr: "{npc:yanki|e} teşekkür et", en: "Thank {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Yolun için {npc:yanki|e} teşekkür ettin; onun bir parçasının seni sevdiğini o sabah anladın.", en: "You thanked {npc:yanki} for your Path. That morning you realized some part of it loved you." }
            etkiler:
              - ahlak: { insanlik: -1, merhamet: 2 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - tohum: { olay: "p3_siralama_zirvesi", gecikme: { min: 4, max: 9 } }
            sonraki: "@akis"

  # ================================================================== BÜYÜK İHANET (ana yay, gün 300)
  # Hain önceliği: Mert (mert_kadimlere_satti) → Kaya (kaya_darbe_hazirligi [B2]; kaya_devrildi yok; Kaya hayatta) →
  # Thessar (thessar_ihanete_hazir [E] ve ihanet_thessar henüz yok; iyi haber) → Deniz (deniz_yukselenlere_gitti ve hayatta) → Aras (hayatta) → yedek:
  # Sıralama'nın İkincisi. Yönlendirme: buyuk_ihanet_iz (Mert/Kaya/dışarı) → buyuk_ihanet_kule (Thessar/Deniz/üst kat) →
  # buyuk_ihanet_ellinci (Aras/İkinci). npc listesi bilerek boş: ölen bir NPC ana yayı kapatmasın.
  - id: "buyuk_ihanet"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "ihanet", "kasaba_cekirdegi"]
    gerilim: 4
    ana_yay: { gun: 300 }
    onemli: true
    kart: { tr: "Ortak Masa", en: "The Common Table" }
    sahne: "buyuk_ihanet_1"
    sahneler:
      - id: "buyuk_ihanet_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Altmış beş gün kaldı. Kadim gemisinin gölgesi bu sabah ilk kez {yer:kiyikent_liman|in} tamamını örttü; şehrin bütün kampları da Entegrasyon'dan bu yana ilk kez aynı odada oturmaya razı oldu. Oda {yer:kasaba_cekirdegi}: ortasında mavi bir kristal nabız gibi atıyor.", en: "Sixty-five days left. This morning the Ancient ship's shadow covered the entire waterfront for the first time, and every camp in the city agreed to sit in the same room for the first time since Integration: {yer:kasaba_cekirdegi}, with its blue crystal pulsing in the middle like a heartbeat." }
          - metin: { tr: "{npc:elif_sari} masanın başına geçmiş, önüne bir yığın not koymuş. Uykusuzluktan gözleri kıpkırmızı, sesiyse sakin.", en: "{npc:elif_sari} sits at the head of the table behind a stack of notes, eyes red from no sleep, voice steady anyway." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:kaya_demir} oturmayı reddedip sırtını duvara vermiş, ayakta bekliyor; iki adamı kapının iki yanına dikilmiş.", en: "{npc:kaya_demir} won't sit. He stands with his back to the wall and two of his people flanking the door." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:vahit} bembeyaz giyinmiş, gülümsüyor; sanki bu masa kehanetlerinden biriymiş de herkes sonunda yerini bulmuş.", en: "{npc:vahit} is in white, smiling, like this table is one of his prophecies and everyone's finally found their seat." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} en köşeye sinmiş, dizüstünün kapağını ha bire açıp kapatıyor; kimseyle göz göze gelmiyor.", en: "{npc:mert_kilic} has the far corner, flipping his laptop open and shut over and over, not meeting anybody's eyes." }
            kosul: { npc_hayatta: "mert_kilic" }
          - { tr: "Masanın ortasında bir mühür duruyor: Kadimler'in elçilikten yolladığı gümüş bir levha. Üstündeki tek satır her dilde aynı anda okunuyor: [Bir insan imzası yeterlidir.]", en: "In the middle of the table sits a seal: a silver plate the Ancients sent over from their embassy. There's one line on it, readable in every language at once: [One human signature is sufficient.]" }
          - metin: { tr: "{npc:yanki} kafanın içinde alçak ama kesin bir sesle fısıldıyor: bu odada biri çoktan imzalamış. mührü değil, başka bir şeyi. kokusunu alıyorum.", en: "{npc:yanki}, low and sure, in your head: somebody in this room already signed. not the seal. something else. i can smell it." }
            kosul: { bayrak: "yanki_bagi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[UYARI] Sadakat sapması tespit edildi", en: "[WARNING] Loyalty deviation detected" }
            satirlar:
              - { tr: "Kaynak: bilinmiyor. Kapsam: şehir. Sistem müdahale etmeyecek.", en: "Source: unknown. Scope: citywide. The System will not intervene." }
              - { tr: "Not: Sistem zaten genellikle müdahale etmez. Yine de kayda geçsin istedik.", en: "Note: the System generally doesn't. We just wanted that on the record." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Odada on dört nabız atıyor. Biri ötekilerin üç saniye önünden gidiyor: bir şey bekleyen birinin nabzı.", en: "Fourteen heartbeats in this room. One of them is running three seconds ahead of the rest. That's the pulse of somebody waiting for something." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu odada kimseye sırtını dönme. Herkes, tamam mı? Bana bile.\"", en: "\"Don't turn your back on anybody in here. Me included, okay? Everybody.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bu masa bıçak kokuyor. Bu seferlik benimki değil.\"", en: "\"This table smells like a knife. Not mine, for once.\"" }
        secenekler:
          - id: "masa"
            etiket: { tr: "Masada kal; yüzleri oku", en: "Stay at the table. Read the faces" }
            kronik: { tr: "Ortak Masa'dan kalkmadın; hain kim olursa olsun, ilk göreceği yüz seninki olacaktı.", en: "You stayed at the Common Table. Whoever the traitor was, yours would be the first face they saw." }
            etkiler:
              - ahlak: { duzen: 3 }
              - degisken: { ihanet_yaklasim: 1 }
            sonraki: "buyuk_ihanet_iz"
          - id: "nabiz"
            tur: "gosteris"
            etiket: { tr: "On dört nabzı tek tek say", en: "Count all fourteen heartbeats, one by one" }
            gerekli: { stat: { per: 220 } }
            kronik: { tr: "Odadaki on dört nabzı tek tek saydın; biri ötekilerden önde atıyordu ve sen onu, hain daha ayağa kalkmadan duydun.", en: "You counted all fourteen pulses in the room. One was running ahead, and you heard it before the traitor ever stood up." }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - degisken: { ihanet_yaklasim: 2 }
              - xp_seviye: 20
            sonraki: "buyuk_ihanet_iz"
          - id: "surlar"
            etiket: { tr: "Masayı bırak; bayrağının altındakilerle surlara çık", en: "Leave the table. Take your banner to the walls" }
            goster: { ordu_min: 1 }
            kronik: { tr: "Masayı bırakıp ordunla surlara çıktın; ihanet nereden gelirse gelsin, şehrin dışı tutulmuştu.", en: "You left the table and took your army to the walls. Wherever the betrayal came from, the outside was covered." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { ihanet_yaklasim: 3, hayatta_kalan: 1 }
            sonraki: "buyuk_ihanet_iz"
          - id: "yanki_iz"
            etiket: { tr: "{npc:yanki|e} kokunun izini sürdür", en: "Have {npc:yanki} follow the scent" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Hainin kokusunu {npc:yanki|e} sürdürdün; o gece onun burnuna bir av köpeğine güvenir gibi güvendin.", en: "You had {npc:yanki} track the traitor's scent. That night you trusted its nose like a bloodhound's." }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { ihanet_yaklasim: 4 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            sonraki: "buyuk_ihanet_iz"
          - id: "yumruk"
            tur: "aciga_vur"
            etiket: { tr: "Masaya yumruğunu vur: \"Hain kim?\"", en: "Slam the table: \"Who's the rat?\"" }
            kronik: { tr: "Yumruğunu masaya indirip haini ortaya çağırdın; masa ikiye ayrıldı ve o gece kimse yeniden oturmadı.", en: "You slammed your fist on the table and called the traitor out. The table split in two, and nobody sat back down that night." }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -2, merhamet: -1 }
              - degisken: { ihanet_yaklasim: 5 }
            sonraki: "buyuk_ihanet_iz"

      - id: "buyuk_ihanet_iz"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Çekirdek'in ışığı sönüp yeniden yanıyor, ardından bir kez daha. Odadaki herkes birden nefesini tutuyor: Entegrasyon'dan bu yana Çekirdek bir kez bile titrememişti.", en: "The Core's light goes out and comes back. Then again. Everyone in the room holds their breath at the same moment, because the Core hasn't so much as flickered since Integration." }
          - metin: { tr: "Bu kez ilk gören sensin: köşedeki nabız hızlanıyor, ardından masanın altında bir el, işi çoktan başlatmış birinin sakinliğiyle bir düğmeye basıyor.", en: "This time you see it first: the pulse in the corner speeds up, and then a hand under the table presses a button with the calm of somebody who started this a long time ago." }
            kosul: { degisken_min: { ihanet_yaklasim: 2 }, degisken_max: { ihanet_yaklasim: 2 } }
          - metin: { tr: "Telsizin cızırdıyor; arayan surlardaki nöbetçiler. \"Dışarıda bir şey yok,\" diyor şaşkın bir ses. \"Yaklaşan hiçbir şey yok. Sorun... galiba içeride.\"", en: "Your radio crackles. The sentries on the walls. \"Nothing out here,\" a voice says, confused. \"Nothing's coming at us. I think the problem's... inside.\"" }
            kosul: { degisken_min: { ihanet_yaklasim: 3 }, degisken_max: { ihanet_yaklasim: 3 } }
          - metin: { tr: "{npc:yanki} kokuyu buluyor; sesi iz süren bir tazı gibi geriliyor: işte, tam orada. kendi gözünle gör, çünkü benim söylediğime inanmayacaksın.", en: "{npc:yanki} finds the scent, and its voice goes taut as a hound's: there. right there. i want you to see it yourself, because you're not going to believe me." }
            kosul: { degisken_min: { ihanet_yaklasim: 4 }, degisken_max: { ihanet_yaklasim: 4 } }
          - metin: { tr: "Yumruğunun açtığı çatlak masada duruyor; oturan yok. Sorduğun sorunun cevabı o andan beri odada dolanıp duruyordu, şimdi bir yere konuyor.", en: "The crack your fist left is still in the table, and nobody's sitting. The answer to your question has been circling the room since you asked it. Now it's landing." }
            kosul: { degisken_min: { ihanet_yaklasim: 5 } }
          - metin: { tr: "Odadaki bütün telsizler birden cızırdamaya başlıyor: üç kısa, bir uzun. Sessiz Ağ'ın işareti bu, ama ritmi yanlış. Bu vuruşlar bir insan elinden değil, ölçülü ve soğuk bir makineden çıkıyor.", en: "Every radio in the room starts crackling at once: three short, one long. The Quiet Network's signal. But the rhythm's wrong. That's not a human hand. It's the cold, measured beat of a machine." }
            kosul: { bayrak: "mert_kadimlere_satti" }
          - metin: { tr: "{npc:mert_kilic|in} köşesi boşalmış. Dizüstü masada açık kalmış, ekranda tek bir satır yanıp sönüyor: [Aktarım tamamlandı: 312 kayıt.]", en: "{npc:mert_kilic|pos} corner is empty. His laptop's still open on the table, one line blinking on the screen: [Transfer complete: 312 records.]" }
            kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" }
          - metin: { tr: "Telsizlerden ölü bir adamın sesi yükseliyor; kayda alınmış, sakin, tanıdık bir ses: \"Yetki kodu: sıfır, yedi, kırmızı. Arşivi açın.\" {npc:mert_kilic} öldü, ama anahtarlarını ondan önce birine teslim etmiş.", en: "A dead man's voice comes out of the radios. Recorded, calm, familiar: \"Authorization: zero, seven, red. Open the archive.\" {npc:mert_kilic} is dead. But he handed his keys to somebody first." }
            kosul: { bayrak: "mert_kadimlere_satti", npc_olu: "mert_kilic" }
          - metin: { tr: "Koridordan düzenli, adım uydurmuş postal sesleri geliyor. Kapıdaki iki adam kanatları içeriden kapatıp sürgüyü çekmiş bile. {npc:kaya_demir} hiç acele etmeden masaya dönüyor.", en: "Boots in the corridor. Steady, in step. The two men at the door swing the doors shut from inside and throw the bolt. {npc:kaya_demir} turns back to the table, in no hurry at all." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], bayrak: "kaya_darbe_hazirligi", npc_hayatta: "kaya_demir" }
          - metin: { tr: "Derken uzaktan bir boru sesi geliyor: {yer:kule_dibi|in} alarmı. Odadakiler birbirine bakıp aynı anda anlıyor: ihanet bu masada değil. Masa, gözleri yanlış yere çevirmek için kurulmuş.", en: "Then, far off, a horn: the {yer:kule_dibi} alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: "mert_kadimlere_satti", bayrak: "kaya_devrildi" }
          - metin: { tr: "Derken uzaktan bir boru sesi geliyor: {yer:kule_dibi|in} alarmı. Odadakiler birbirine bakıp aynı anda anlıyor: ihanet bu masada değil. Masa, gözleri yanlış yere çevirmek için kurulmuş.", en: "Then, far off, a horn: the {yer:kule_dibi} alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], npc_olu: "kaya_demir" }
          - metin: { tr: "Derken uzaktan bir boru sesi geliyor: {yer:kule_dibi|in} alarmı. Odadakiler birbirine bakıp aynı anda anlıyor: ihanet bu masada değil. Masa, gözleri yanlış yere çevirmek için kurulmuş.", en: "Then, far off, a horn: the {yer:kule_dibi} alarm. Everyone in the room looks at everyone else and gets it at the same time. The betrayal isn't at this table. This table was just here to keep everybody looking the wrong way." }
            kosul: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi", "kaya_darbe_hazirligi"], npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "mert"
            etiket: { tr: "Telsiz sinyalinin peşine düş", en: "Chase down the radio signal" }
            goster: { bayrak: "mert_kadimlere_satti" }
            kronik: { tr: "Sessiz Ağ'ın zehirlenmiş sinyalinin peşine düştün; ucu bir dostun kapısına çıkıyordu.", en: "You chased the Quiet Network's poisoned signal. It led to a friend's door." }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "ihanet_mert"
            sonraki: "ihanet_mert_1"
          - id: "kaya_a"
            etiket: { tr: "Kapıya dön; {npc:kaya_demir|e} bak", en: "Turn to the door. Look at {npc:kaya_demir}" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], bayrak: "kaya_darbe_hazirligi", npc_hayatta: "kaya_demir" }
            kronik: { tr: "Sürgülenen kapıya döndün; darbenin başında Demir Lonca'nın lideri duruyordu.", en: "You turned to the bolted door. Standing at the head of the coup was the Iron Guild's own leader." }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "ihanet_kaya"
            sonraki: "ihanet_kaya_1"
          - id: "kule_a"
            etiket: { tr: "Alarmın geldiği yere koş: {yer:kule_dibi}", en: "Run for the alarm: {yer:kule_dibi}" }
            goster: { bayrak_yok: "mert_kadimlere_satti", bayrak: "kaya_devrildi" }
            kronik: { tr: "Alarm çalınca masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "When the alarm went off, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"
          - id: "kule_b"
            etiket: { tr: "Alarmın geldiği yere koş: {yer:kule_dibi}", en: "Run for the alarm: {yer:kule_dibi}" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi"], npc_olu: "kaya_demir" }
            kronik: { tr: "Alarm çalınca masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "When the alarm went off, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"
          - id: "kule_c"
            etiket: { tr: "Alarmın geldiği yere koş: {yer:kule_dibi}", en: "Run for the alarm: {yer:kule_dibi}" }
            goster: { bayrak_yok: ["mert_kadimlere_satti", "kaya_devrildi", "kaya_darbe_hazirligi"], npc_hayatta: "kaya_demir" }
            kronik: { tr: "Alarm çalınca masayı bırakıp Kule'ye koştun; asıl bıçak oradaydı.", en: "When the alarm went off, you left the table and ran for the Spire. That's where the real knife was." }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "buyuk_ihanet_kule"

      - id: "buyuk_ihanet_kule"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} pazarı yarı yarıya boşalmış, tezgâhlar devrilmiş; bir çocuk ağlaya ağlaya annesini arıyor. Herkesin gözü yukarıda: körfezin üstündeki Kadim gemisinden meydana bir ışık sütunu iniyor.", en: "The {yer:kule_dibi} market is half empty, stalls knocked over, a kid crying for his mom. Everybody's looking up. A column of light is coming down from the Ancient ship over the bay, straight into the square." }
          - metin: { tr: "Meydanın tam ortasında, ışığın altında {npc:thessar} diz çökmüş. Cübbesi yırtılmış, damarlarından gümüş renkli bir şey sızıyor. Seni görünce ilk kez bir insanın önünde başını eğiyor.", en: "Under the light, dead center of the square, {npc:thessar} is down on one knee. His robe's torn, and something silver is leaking from his veins. When he sees you, for the first time ever, he bows his head to a human." }
            kosul: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "\"Kendi ırkıma ihanet etmeye geldim,\" diyor; sesi her zamanki kadar kibar, her zamanki kadar kusursuz. \"Bunu benden önce kimse yapmadı. Biraz acele edersen sonuncusu da ben olmam.\"", en: "\"I've come to betray my own kind,\" he says, voice as polite and flawless as ever. \"No one has ever done it before. If you hurry, I may not be the last.\"" }
            kosul: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "Işık sütunu boş meydana iniyor, bir şey arayıp bulamayınca geri çekiliyor. Kadimler bu gece birini bekliyordu. Beklenen buraya gelmedi, çünkü onun işi başka yerde.", en: "The column of light hits an empty square, searches for something, doesn't find it, and pulls back. The Ancients were expecting someone tonight. That someone didn't come here, because their job is somewhere else." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir" }
          - metin: { tr: "Işık sütunu boş meydana iniyor, bir şey arayıp bulamayınca geri çekiliyor. Kadimler bu gece birini bekliyordu. Beklenen buraya gelmedi, çünkü onun işi başka yerde.", en: "The column of light hits an empty square, searches for something, doesn't find it, and pulls back. The Ancients were expecting someone tonight. That someone didn't come here, because their job is somewhere else." }
            kosul: { bayrak: ["thessar_ihanete_hazir", "ihanet_thessar"] }
          - metin: { tr: "{yer:tepe|den} bir ilahi yükseliyor: yüzlerce ağızdan tek bir ezgi, ritimli ve buyurgan. Yokuşta beyaz cüppeli bir kalabalık meşalelerle ilerliyor; aralarında iple birbirine bağlanmış insanlar var.", en: "A hymn rises from {yer:tepe}. Hundreds of voices, one tune, rhythmic and commanding. Up the slope, a crowd in white robes carries torches, and in the middle of them are people tied together with rope." }
            kosul: { bayrak_yok: ["thessar_ihanete_hazir", "deniz_yukselenlerden_dondu"], bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "{yer:tepe|den} bir ilahi yükseliyor: yüzlerce ağızdan tek bir ezgi, ritimli ve buyurgan. Yokuşta beyaz cüppeli bir kalabalık meşalelerle ilerliyor; aralarında iple birbirine bağlanmış insanlar var.", en: "A hymn rises from {yer:tepe}. Hundreds of voices, one tune, rhythmic and commanding. Up the slope, a crowd in white robes carries torches, and in the middle of them are people tied together with rope." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], bayrak_yok: "deniz_yukselenlerden_dondu", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kalabalığın başında tanıdık bir yüz yürüyor; kalkanı içten içe yanıyor, gözleri başka bir şeye dönmüş: {npc:deniz_arman}.", en: "At the head of the crowd, shield burning from the inside, eyes turned toward something else, walks a face you know: {npc:deniz_arman}." }
            kosul: { bayrak_yok: ["thessar_ihanete_hazir", "deniz_yukselenlerden_dondu"], bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kalabalığın başında tanıdık bir yüz yürüyor; kalkanı içten içe yanıyor, gözleri başka bir şeye dönmüş: {npc:deniz_arman}.", en: "At the head of the crowd, shield burning from the inside, eyes turned toward something else, walks a face you know: {npc:deniz_arman}." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], bayrak_yok: "deniz_yukselenlerden_dondu", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak_yok: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir"] }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak: ["thessar_ihanete_hazir", "ihanet_thessar"], bayrak_yok: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "deniz_yukselenlere_gitti", npc_olu: "deniz_arman" }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "thessar_ihanete_hazir", "ihanet_thessar"], npc_olu: "deniz_arman" }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: ["deniz_yukselenlere_gitti", "deniz_yukselenlerden_dondu"], npc_hayatta: "deniz_arman" }
          - metin: { tr: "Derken Kule'nin gövdesinde, çok yukarıda, ellinci katın hizasında bir kapı açılıyor. Dışarıdan açılmış gibi görünse de dışarıda kimse yok; kapıyı açan el içeriden açmış.", en: "Then, way up on the Spire's side, a door opens, level with the fiftieth floor. It looks like it was opened from outside, except nobody's out there. Whoever opened it did it from inside." }
            kosul: { bayrak: ["deniz_yukselenlere_gitti", "deniz_yukselenlerden_dondu", "thessar_ihanete_hazir", "ihanet_thessar"], npc_hayatta: "deniz_arman" }
          - metin: { tr: "{npc:yanki} sesini kısıyor: o kapı ancak bir insan eliyle açılır. Kule bunu bize daha ilk gün söyledi.", en: "{npc:yanki}, hushed: that door only opens to a human hand. the Spire told us that on day one." }
            kosul: { bayrak_yok: "thessar_ihanete_hazir", bayrak: "yanki_bagi" }
          - metin: { tr: "{npc:yanki} sesini kısıyor: o kapı ancak bir insan eliyle açılır. Kule bunu bize daha ilk gün söyledi.", en: "{npc:yanki}, hushed: that door only opens to a human hand. the Spire told us that on day one." }
            kosul: { bayrak: ["yanki_bagi", "thessar_ihanete_hazir", "ihanet_thessar"] }
        secenekler:
          - id: "thessar"
            etiket: { tr: "{npc:thessar|in} yanına koş", en: "Run to {npc:thessar}" }
            goster: { bayrak: "thessar_ihanete_hazir", bayrak_yok: "ihanet_thessar" }
            kronik: { tr: "Kendi ırkına sırtını dönen Kadim'in yanına koştun; tarihte o gece bir çatlak açıldı.", en: "You ran to the Ancient who'd turned his back on his own kind. History cracked a little that night." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "ihanet_thessar"
            sonraki: "ihanet_thessar_1"
          - id: "deniz"
            etiket: { tr: "Beyaz cüppelerin peşinden {yer:tepe|e} tırman", en: "Chase the white robes up into {yer:tepe}" }
            goster: { bayrak_yok: ["thessar_ihanete_hazir", "deniz_yukselenlerden_dondu"], bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
