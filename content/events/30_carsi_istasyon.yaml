# Parti C — Harabe Çarşı, Kırık İstasyon ve ilk kamplar (docs/PERDE1.md).
# Dört kamp tanışması (Kaya · Elif · Vahit · Mert) Perde 2 fraksiyonlarının tohumudur: lonca · siginak · yukselenler · sessiz_ag.
# Kendi takip olayları yalniz_tohum'dur: mahsurlar_sonrasi, cete_hesabi, eczane_bedeli, avci_kizi, kaya_gece_devriyesi,
# hastane_karantina, vahit_yakit_listesi, mert_cozulen_satir.
olaylar:
  # ================================================================== ÇARŞIDAKİ MAHSURLAR
  - id: "carsi_mahsurlar"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 4, max: 26 }
    agirlik: 6
    etiketler: ["kurtarma", "ahlak", "carsi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kepenklerin ardında", en: "Behind the shutters" }
    sahne: "carsi_mahsurlar_1"
    sahneler:
      - id: "carsi_mahsurlar_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "İkinci katta, indirimdeki bir ayakkabı mağazasının kepengi içeriden yumruklanıyor. Vuruşlar cılız; günlerdir bağırmaktan sesi kısılmış insanların yumrukları bunlar.", en: "Second floor, outside a discount shoe store, somebody's pounding on the security shutter from the inside. The fists are weak. These are people who've been yelling for days." }
          - { tr: "Kepengin önünde altı vitrin mankeni yarım daire çizmiş, yüzlerini kapıya dönmüş. Hiçbiri kıpırdamıyor ama her birinin bir eli kepengin altındaki aralığa uzanmış; içeriden birinin gözünü kırpmasını bekler gibiler.", en: "Six display dummies stand in a half circle in front of the shutter, faces turned toward it. None of them moves. But every one has a hand stretched toward the gap underneath, like they're waiting for somebody inside to blink." }
          - { tr: "Aralıktan bir çocuğun sesi geliyor: \"Annem uyumuyor ama gözlerini de açmıyor.\" Daha kalın bir ses onu susturuyor: \"Dışarıdaki kimsen, duyuyorsan: yedi kişiyiz.\"", en: "A kid's voice drifts out through the gap: \"My mom's not asleep, but she won't open her eyes.\" A deeper voice shushes him. \"Whoever's out there, if you can hear us: there's seven of us.\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Mankenler yalnızca kendilerine bakan gözün önünde donar. Bir çift göz üçünü tutar, iki çift göz altısını birden.", en: "The dummies only freeze for whoever's looking right at them. One pair of eyes holds three. Two pairs hold all six." }
          - kosul: { stat: { wis: 8 } }
            metin: { tr: "Aralıktan su kokusu gelmiyor. İçeride su çoktan bitmiş; bunu en önce ateşi olan hisseder.", en: "No smell of water coming from under that shutter. They ran dry a while ago, and anybody running a fever feels that first." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷edi kalp atışı sayıyorum. biri yavaşlıyor. acele etmezsen altıya iner.", en: "i̷'m counting seven heartbeats. one of them is slowing down. take your time and it'll be six." }
          - kosul: { bayrak: "kirilma_yasandi" }
            metin: { tr: "altı plastik oyuncak. bir hafta önce ödünü koparırlardı, hatırlıyor musun?", en: "six plastic toys. a week ago they'd have scared you. remember that?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İçeride çocuk var. Tartışacak bir şey yok, değil mi? Yok.\"", en: "\"There's a kid in there. Nothing to talk about, right? Right.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Mankenlerin üstüne yürü, yolu aç", en: "Walk into the dummies and clear a path" }
            etkiler:
              - gorev: { carsi_mahsurlari: "basla" }
              - ahlak: { merhamet: 6, insanlik: 2 }
              - savas: { dusmanlar: ["vitrin_mankeni", "vitrin_mankeni"], ortam: ["dar_gecit"], kazan: "carsi_mahsurlar_acildi", kaybet: "carsi_mahsurlar_yenilgi", kac: "carsi_mahsurlar_kacis" }
          - id: "bakis"
            etiket: { tr: "Gözünü onlardan ayırma, insanları tek tek çıkar", en: "Keep your eyes on them. Bring people out one by one" }
            gerekli: { stat: { wil: 7 } }
            etkiler:
              - gorev: { carsi_mahsurlari: "basla" }
              - ahlak: { merhamet: 5, duzen: 3 }
            sonraki: "carsi_mahsurlar_bakis"
          - id: "ikili_bakis"
            etiket: { tr: "{npc:deniz_arman|le} sırt sırta verin, altısını da tutun", en: "Go back to back with {npc:deniz_arman}. Hold all six" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - gorev: { carsi_mahsurlari: "basla" }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 } }
            sonraki: "carsi_mahsurlar_bakis"
          - id: "kepenk"
            tur: "gosteris"
            etiket: { tr: "Kepengi sök ve mankenlerin üstüne fırlat", en: "Rip the shutter loose and hurl it at the dummies" }
            gerekli: { stat: { str: 16 } }
            etkiler:
              - gorev: { carsi_mahsurlari: "basla" }
              - ahlak: { merhamet: 4, duzen: -1 }
              - dikkat: 3
              - efsane: "tek_basina_suru"
            sonraki: "carsi_mahsurlar_ezme"
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç, mankenler de görsün", en: "Open your true level. Let the dummies see it" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - gorev: { carsi_mahsurlari: "basla" }
              - aciga_vur: true
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 3, lonca: 4 }
            sonraki: "carsi_mahsurlar_ilan"
          - id: "git"
            tur: "gizle"
            etiket: { tr: "Arkanı dön; bu senin kavgan değil", en: "Turn around. This isn't your fight" }
            etkiler:
              - gizle: 3
              - ahlak: { merhamet: -8, insanlik: -4 }
              - gorev: { carsi_mahsurlari: "basarisiz" }
              - degisken: { hayatta_kalan: -5 }
              - bayrak: "mahsurlar_birakildi"
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "carsi_mahsurlar_bakis"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kepengin aralığının başına çömelip gözlerini mankenlere dikiyorsun. İçeridekilere birer birer, sürünerek çıkmalarını söylerken gözlerin yanmaya başlıyor.", en: "You crouch by the gap and lock your eyes on the dummies. You tell the people inside to crawl out one at a time. Your eyes start to burn." }
          - metin: { tr: "{npc:deniz_arman} yanına diz çöküp soldaki üçünü üstleniyor. \"Sağdakiler senin, soldakiler benim,\" diyor; sesi titriyor ama bakışı sapasağlam.", en: "{npc:deniz_arman} drops down next to you and takes the three on the left. \"You get right, I get left,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice shaking, stare steady." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Dört kişi çıkıyor: elinde copuyla bir güvenlik görevlisi, birbirinin elini bırakmayan iki kız kardeş, ağzını bir kez bile açmayan bir adam. İçeride üç kişi kalıyor: yaşlı bir adam, ateşler içinde yatan bir kadın ve yanından ayrılmayan oğlu.", en: "Four make it out: a mall cop with a nightstick, two sisters who won't let go of each other's hands, and a man who hasn't said a word. Three are still inside: an old man, a woman burning up with fever, and her son, who won't leave her." }
          - { tr: "Görevli copunu kaldırıyor. \"Ben bakarım,\" diyor, \"sen gir, onları al.\" Ama eli titriyor, gözleri de çoktan sulanmış.", en: "The mall cop raises his nightstick. \"I'll watch 'em,\" he says, \"you go in and get them.\" But his hand's shaking, and his eyes are already watering." }
        secenekler:
          - id: "gorevliye_guven"
            etiket: { tr: "Görevliye güven, içeri dal", en: "Trust the guard and go in" }
            zar: { stat: "cha", zorluk: 11, tek: true, basarisiz: "carsi_mahsurlar_bedel", basarisiz_etkiler: [{ can: -12 }] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
            sonraki: "carsi_mahsurlar_disari"
          - id: "bakmaya_devam"
            etiket: { tr: "Bakmayı sürdür, onları görevli çıkarsın", en: "Keep staring. Let the guard bring them out" }
            gerekli: { stat: { wil: 9 } }
            etkiler:
              - can: -8
              - ahlak: { merhamet: 4, insanlik: 1 }
            sonraki: "carsi_mahsurlar_disari"
          - id: "triyaj"
            etiket: { tr: "Yaşlıyı bırak, anneyle oğlunu kurtar", en: "Leave the old man. Save the mother and son" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "mahsur_kaptan_kaldi"
              - bayrak: "mahsur_kadin_sirtta"
            sonraki: "carsi_mahsurlar_kaptan"

      - id: "carsi_mahsurlar_kaptan"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Yaşlı adam sen daha ağzını açmadan anlıyor. \"Kırk yıl vapur kaptanlığı yaptım,\" deyip rafların arasındaki taburesine geri oturuyor. \"Batan gemiden en son kaptan iner. Hadi, götür onları.\"", en: "The old man gets it before you even open your mouth. \"Forty years I captained the ferry,\" he says, easing back onto a stool between the shoe racks. \"Captain's last off a sinking ship, so go on, get 'em out.\"" }
          - { tr: "Kadını sırtlıyorsun, çocuk da ceketinin ucuna yapışıyor. Kepengin altından son bir kez baktığında yaşlı adam, iskeleden ayrılan bir vapuru uğurlar gibi sana el sallıyor.", en: "You get the woman over your shoulders and the kid latches onto your jacket. When you glance back under the shutter, the old man is waving, like you're a ferry pulling away from the dock." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Dönüp bakma, yürü", en: "Don't look back. Walk" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bayrak: "mahsur_kaptan_tanindi"
            sonraki: "carsi_mahsurlar_disari"
          - id: "don"
            etiket: { tr: "Onları çıkar, sonra kaptana geri dön", en: "Get them clear, then go back for the captain" }
            zar: { stat: "agi", zorluk: 13, tek: true, basarisiz: "carsi_mahsurlar_kaptan_gec", basarisiz_etkiler: [{ can: -15 }, { bayrak: "mahsur_kaptan_tanindi" }] }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
              - bayrak: "mahsur_kaptan_tanindi"
              - bayrak_kaldir: "mahsur_kaptan_kaldi"
              - degisken: { hayatta_kalan: 1 }
              - can: -6
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_kaptan_gec"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadınla çocuğu kepengin dışına bırakıp geri koşuyorsun ama mankenler aralığı çoktan kapatmış. Plastik elleri kepengin altında çit gibi dizilmiş.", en: "You set the woman and the kid down outside and run back, but the dummies have already closed the gap. Their plastic hands stand under the shutter like a picket fence." }
          - { tr: "Aralıktan kaptanı görüyorsun. Taburesine oturmuş, iskeleden ayrılan bir vapuru uğurlar gibi sana el sallıyor. Bu kez veda gerçek.", en: "Through the gap you can see the captain on his stool, waving at you like you're a ferry pulling away from the dock. This time for real." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürü; karar onundu", en: "Walk. That was his call" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
            sonraki: "carsi_mahsurlar_disari"
          - id: "seslen"
            etiket: { tr: "Kepengin ardına son bir kez seslen", en: "Call through the shutter one last time" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_bedel"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Görevli gözünü kırpıyor; bir kez, saniyenin onda biri kadar. O kadarı yetiyor.", en: "The guard blinks. Once, a tenth of a second. That's all it takes." }
          - { tr: "Plastik bir el bileğine yapışıp seni kepenge çarpıyor, bir başkası görevlinin dizine kapanıyor. Kemik, mağazanın boş koridorunda kuru bir dal gibi çatırdayarak kırılıyor.", en: "A plastic hand clamps on your wrist and slams you into the shutter. Another one closes over the guard's knee. The bone goes with a crack that echoes down the empty concourse like a snapped branch." }
          - { tr: "Yine de doğrulup gözlerini açık tutuyorsun. Yaşlı adam, kadın ve çocuk dışarıda; görevli yerde yatıyor, dişlerini sıkmış, yüzü kireç gibi.", en: "You get up anyway and you keep your eyes open. The old man, the woman, and the kid are out. The guard's on the floor, jaw clenched, face gone white as paper." }
        secenekler:
          - id: "sirtla"
            etiket: { tr: "Görevliyi sırtına al", en: "Get the guard on your back" }
            etkiler:
              - can: -5
              - ahlak: { merhamet: 5, insanlik: 2 }
              - bayrak: "mahsur_gorevli_yarali"
            sonraki: "carsi_mahsurlar_disari"
          - id: "copuna_dayan"
            etiket: { tr: "Copunu baston yapsın, kendi yürüsün", en: "Make his nightstick a cane. He walks" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - bayrak: "mahsur_gorevli_yarali"
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_acildi"
        yer: "harabe_carsi"
        paragraflar:
          - metin: { tr: "Kavga denecek bir şey olmuyor. Plastik bacaklar kırılıp kafalar mozaik zemine sekerken geri kalan mankenler ilk kez geri çekiliyor.", en: "It isn't a fight. Plastic legs snap, heads bounce off the tile, and the rest of the dummies do something you've never seen them do. They back away." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son manken dizlerinin üstüne çöküp donuyor; bu kez senin bakmana bile gerek kalmadan. Kalanlar karanlık vitrinlere çekilmiş, bekliyor.", en: "The last dummy folds at the knees and locks up, and this time you don't even have to be looking. The others have pulled back into the dark storefronts. Waiting." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Kepengi omzunla yukarı itiyorsun. İçeriden ekşi ter, deri ve korku kokusu taşıyor; yedi yüz sana gökten inmişsin gibi bakıyor.", en: "You shoulder the shutter up. Out rolls the smell of sour sweat, shoe leather, and fear. Seven faces stare at you like you dropped out of the sky." }
          - { tr: "Yaşlı bir adam elini tutup bırakmıyor. \"Kırk yıl vapur kaptanlığı yaptım,\" diyor, \"böyle temiz bir yanaşma görmedim.\"", en: "An old man grabs your hand and won't let go. \"Forty years I captained the ferry,\" he says. \"Never saw a cleaner docking.\"" }
        secenekler:
          - id: "ates"
            etiket: { tr: "Önce kadının ateşine bak", en: "Check the woman's fever first" }
            gerekli: { stat: { wis: 7 } }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "mahsur_anne_toparlandi"
              - bayrak: "mahsur_kaptan_tanindi"
            sonraki: "carsi_mahsurlar_disari"
          - id: "iksir"
            etiket: { tr: "Kadına iksirini içir", en: "Give the woman your potion" }
            gerekli: { esya: { kucuk_iyilesme_iksiri: 1 } }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: -1 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "mahsur_anne_toparlandi"
              - efsane: "yabancilari_iyilestirdi"
              - bayrak: "mahsur_kaptan_tanindi"
            sonraki: "carsi_mahsurlar_disari"
          - id: "hemen"
            etiket: { tr: "Vakit yok, hemen yola çıkın", en: "No time. Move out now" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "mahsur_kaptan_tanindi"
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_ezme"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kepengi alt kenarından kavrayıp asılıyorsun. Çelik yarım saniye direndikten sonra raylarından sökülüp çarşaf gibi havalanıyor.", en: "You grab the bottom edge of the shutter and pull. The steel fights you for half a second. Then it tears out of its tracks and lifts like a bedsheet." }
          - { tr: "Fırlattığın kepenk üç mankeni birden karşı duvara çiviliyor. Kalan üçü sen bakmadan olduğu yerde çatlıyor; korkmayı yeni öğrenmişler gibi.", en: "The shutter pins three dummies to the far wall at once. The other three crack right where they stand without you even looking at them, like they just now learned how to be afraid." }
          - { tr: "İçerideki yedi kişi seni görüyor. Teşekkür eden çıkmıyor; yedisi birden bir adım geri atıyor.", en: "The seven people inside see you. Nobody says thank you. All seven take one step back at the exact same time." }
        secenekler:
          - id: "eller"
            etiket: { tr: "Ellerini göster, zarar vermeyeceğini söyle", en: "Show them your hands. Tell them you won't hurt them" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3 }
            sonraki: "carsi_mahsurlar_disari"
          - id: "korksunlar"
            etiket: { tr: "Bırak korksunlar; korkan hızlı yürür", en: "Let them be scared. Scared walks faster" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - dikkat: 1
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_ilan"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Pencereni açıyorsun, bu kez tek satırı bile saklamadan. Gerçek seviyen havada mavi ve çırılçıplak asılı duruyor; altı plastik kafa tek bir tıkırtıyla, hep birlikte sana dönüyor.", en: "You open your window and for once you don't hide a single line. Your real level hangs in the air, blue and naked. Six plastic heads turn toward you with one single click." }
          - { tr: "Derken bellerinden çatırdayarak eğilip kepenge uzanan ellerini yanlarına indiriyorlar; sen yanlarından geçip giderken de öyle eğik kalıyorlar.", en: "Then they bow. Waists creaking, the hands that were reaching for the shutter drawn back to their sides. They stay bent like that the whole time you walk past." }
          - { tr: "Kepengin ardındaki yedi kişi pencereni okuyor. Görevli rakamı yüksek sesle söyleyip bir kez daha tekrarlıyor; ikincisinde sesi duaya benziyor.", en: "The seven behind the shutter read your window. The mall cop says the number out loud, then says it again. The second time, it sounds like a prayer." }
        secenekler:
          - id: "kepengi_ac"
            etiket: { tr: "Kepengi kaldır, onları çıkar", en: "Lift the shutter and bring them out" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - efsane: "tek_basina_suru"
            sonraki: "carsi_mahsurlar_disari"
          - id: "mankenleri_kir"
            etiket: { tr: "Eğilmiş mankenleri tek tek kır", en: "Break the bowing dummies one by one" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 3 }
              - efsane: "acimasiz_infaz_tanikli"
              - xp: 60
            sonraki: "carsi_mahsurlar_disari"

      - id: "carsi_mahsurlar_disari"
        yer: "harabe_carsi"
        paragraflar:
          - metin: { tr: "Durmuş yürüyen merdivenin dibinde soluklanıyorsunuz. Kadın görevlinin omzunda, oğlu ceketinin ucunu bırakmıyor; iki kız kardeşse son iki günün bir yerinde ağlamayı unutmuş gibiler.", en: "You catch your breath at the foot of the dead escalator. The woman is slung over the guard's shoulder, her son has a fist locked on his jacket, and the two sisters look like they forgot how to cry somewhere around day two." }
            kosul: { bayrak_yok: ["mahsur_gorevli_yarali", "mahsur_kadin_sirtta"] }
          - metin: { tr: "Durmuş yürüyen merdivenin dibinde soluklanıyorsunuz. Görevlinin dizi paramparça; kadını iki kız kardeş aralarında taşıyor, oğlu annesinin elini bir an olsun bırakmıyor.", en: "You catch your breath at the foot of the dead escalator. The guard's knee is wrecked, so the two sisters carry the woman between them, and her son won't let go of her hand for a second." }
            kosul: { bayrak: "mahsur_gorevli_yarali" }
          - metin: { tr: "Durmuş yürüyen merdivenin dibinde soluklanıyorsunuz. Kadın hâlâ sırtında, oğlu ceketinin ucuna yapışmış; iki kız kardeşse son iki günün bir yerinde ağlamayı unutmuş gibiler.", en: "You catch your breath at the foot of the dead escalator. The woman's still on your back, her son has a fist locked on your jacket, and the two sisters look like they forgot how to cry somewhere around day two." }
            kosul: { bayrak: "mahsur_kadin_sirtta", bayrak_yok: "mahsur_gorevli_yarali" }
          - metin: { tr: "Kaptan, ayakkabı mağazasından aldığı parlak bir çift spor ayakkabıyı sallaya sallaya yanında yürüyor. \"Bedavaya geldi,\" diyor. \"Kıyametin tek iyi yanı indirim.\"", en: "The captain walks beside you, swinging a pair of shiny new sneakers he lifted from the store. \"Free,\" he says. \"Only good thing about the apocalypse: everything's on clearance.\"" }
            kosul: { bayrak: "mahsur_kaptan_tanindi", bayrak_yok: "mahsur_kaptan_kaldi" }
          - metin: { tr: "Yaşlı adam, ayakkabı mağazasından aldığı parlak bir çift spor ayakkabıyı sallaya sallaya yanında yürüyor. \"Kırk yıl vapurda kaptanlık yaptım, bir kez olsun yeni ayakkabı almadım,\" diyor. \"Kıyametin tek iyi yanı indirim.\"", en: "The old man walks beside you, swinging a pair of shiny new sneakers he lifted from the store. \"Forty years I captained the ferry and never once bought new shoes,\" he says. \"Only good thing about the apocalypse: everything's on clearance.\"" }
            kosul: { bayrak_yok: ["mahsur_kaptan_tanindi", "mahsur_kaptan_kaldi"] }
          - { tr: "\"Nereye?\" diye soruyor görevli. Bütün başlar sana dönüyor; sen istemeden kararı sana bırakmışlar.", en: "\"Where to?\" the guard asks. Every head turns your way. They've handed you the call whether you wanted it or not." }
          - metin: { tr: "Çarşıda söylentiler dolaşıyor: yemek katında yara diken bir hekim, yükleme rampasında silahlı adam toplayan eski bir asker, kuru havuzun başında Sistem'in sesini duyduğunu söyleyen biri.", en: "There are rumors going around the mall: a doctor stitching people up in the food court, an ex-soldier collecting armed men at the loading dock, a guy by the dry fountain who claims the System talks to him." }
            kosul: { bayrak_yok: "elif_hastanesi_bilinir" }
          - metin: { tr: "Aklına {npc:elif_sari|in} yemek katındaki sedyeleri geliyor. Kadının ateşi sana pek zaman tanımıyor.", en: "You think of the cots {npc:elif_sari} set up in the food court. That fever isn't giving you a lot of time." }
            kosul: { bayrak: "elif_hastanesi_bilinir" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hekime. Annesini kaybeden çocuğa ne olur, biliyorsun.\"", en: "\"The doctor. You know what it does to a kid to lose his mom.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kadını bana ver. Üç saat; sonra tartışırız.\"", en: "\"Give me the woman. Three hours. Then we can argue.\"" }
        secenekler:
          - id: "hekime"
            etiket: { tr: "Onları yemek katındaki hekime götür", en: "Take them to the doctor in the food court" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 6, saygi: 4 } }
              - degisken: { hayatta_kalan: 5 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_siginakta"
              - xp: 80
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "askere"
            etiket: { tr: "Onları rampadaki askere götür; işe yararlar", en: "Take them to the soldier at the dock. They can work" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - degisken: { hayatta_kalan: 4 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_loncada"
              - xp: 80
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "vaize"
            etiket: { tr: "Onları havuz başındaki vaize götür", en: "Take them to the preacher by the fountain" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { saygi: 4, guven: 3 } }
              - degisken: { hayatta_kalan: 3 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_yukselenlerde"
              - xp: 80
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "kampa"
            etiket: { tr: "Onları kendi kampına al; kimseye borçlanmasınlar", en: "Bring them to your own camp. They owe nobody" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - degisken: { hayatta_kalan: 5 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_kampta"
              - xp: 80
              - gun: 1
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"

      - id: "carsi_mahsurlar_yenilgi"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Plastik bir el ayak bileğine kenetlenip dünyayı tersine çeviriyor. Mozaik zemin yüzüne çarpıyor; son gördüğün, kepengin aralığından sana uzanan küçücük bir el.", en: "A plastic hand snaps around your ankle and flips the world upside down. The tile comes up and hits you in the face. The last thing you see is a small hand reaching for you through the gap under the shutter." }
          - { tr: "Kendine geldiğinde mankenler yine yarım daire çizmiş, yine bekliyor. Kepengin ardından ses gelmiyor; ya uyudular ya da bağıracak halleri kalmadı.", en: "When you come to, the dummies are back in their half circle, still waiting. It's quiet behind the shutter. Either they fell asleep, or they've got nothing left to yell with." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk. Bir kez daha", en: "Get up. One more time" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - savas: { dusmanlar: ["vitrin_mankeni"], ortam: ["dar_gecit"], kazan: "carsi_mahsurlar_acildi", kaybet: "carsi_mahsurlar_kacis", kac: "carsi_mahsurlar_kacis" }
          - id: "rampaya"
            etiket: { tr: "Yükleme rampasındaki silahlılara koş", en: "Run for the armed crew at the loading dock" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: -3 } }
              - degisken: { hayatta_kalan: 2 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_loncada"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "cekil"
            etiket: { tr: "Geri çekil, yaralarını sar", en: "Fall back and bind your wounds" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -2 }
              - can: 10
              - gorev: { carsi_mahsurlari: "basarisiz" }
              - degisken: { hayatta_kalan: -3 }
              - bayrak: "mahsurlar_birakildi"
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "carsi_mahsurlar_kacis"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Mankenler peşine düşmüyor, başka avları var. Ne kadar sabırlı olduklarını ancak şimdi anlıyorsun.", en: "You fall back. The dummies don't chase you. They've got other prey, and now you understand just how patient they are." }
          - { tr: "Merdivenden inerken kepengin ardındaki sesler birer birer kısılıyor. Belki de sana öyle geliyor; belki yalnızca yoruldular.", en: "Going down the escalator, you hear the voices behind the shutter drop away one by one. Or maybe that's just what you hear. Maybe they're only tired." }
        secenekler:
          - id: "geri_don"
            etiket: { tr: "Geri dön, bu kez başka türlü dene", en: "Go back. Try it a different way" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "carsi_mahsurlar_1"
          - id: "yardim"
            etiket: { tr: "Rampadaki silahlılardan yardım iste", en: "Get help from the armed crew at the dock" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: -3 } }
              - degisken: { hayatta_kalan: 2 }
              - gorev: { carsi_mahsurlari: "tamam" }
              - bayrak: "mahsurlar_kurtarildi"
              - bayrak: "mahsurlar_loncada"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3 }
              - gorev: { carsi_mahsurlari: "basarisiz" }
              - degisken: { hayatta_kalan: -4 }
              - bayrak: "mahsurlar_birakildi"
              - tohum: { olay: "mahsurlar_sonrasi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ mahsurların sonrası (tohum)
  - id: "mahsurlar_sonrasi"
    perde: [1]
    agirlik: 1
    etiketler: ["kurtarma", "ahlak", "carsi"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Ayakkabı mağazasının önünden", en: "Past the shoe store" }
    sahne: "mahsurlar_sonrasi_1"
    sahneler:
      - id: "mahsurlar_sonrasi_1"
        paragraflar:
          - metin: { tr: "Çarşıya dönerken yolun ayakkabı mağazasının önünden geçiyor. Kepenk açık; içeride altı manken rafların arasında müşteri gibi dikiliyor. Birinin sırtında bir güvenlik görevlisi ceketi var, birinin ayağında küçük, çamurlu bir spor ayakkabı.", en: "When you get back to the mall, your path takes you past the shoe store. The shutter's up, and inside six dummies stand between the racks like customers, one in a mall-cop jacket, one with a small, muddy sneaker on its foot." }
            kosul: { bayrak: "mahsurlar_birakildi" }
          - metin: { tr: "Merdivenin dibinde yanan bir kamp ateşinin başında iki kız kardeşten biri oturuyor. Seni tanıyor; o gün kepengin aralığından gördüğü tek yüz seninkiydi.", en: "Down by the escalator, at somebody's campfire, sits one of the two sisters. She knows you. Yours was the only face she saw through the gap that day." }
            kosul: { bayrak: "mahsurlar_birakildi" }
          - metin: { tr: "Çarşıya döndüğünde durmuş yürüyen merdivenin dibinden biri adını sesleniyor. Kurtardığın çocuk elinde bir parça kartonla sana koşuyor, arkasında iki kız kardeş gülüşüyor.", en: "When you get back to the mall, someone at the bottom of the dead escalator calls your name. The kid you pulled out is running at you waving a scrap of cardboard, the two sisters laughing behind him." }
            kosul: { bayrak: "mahsurlar_kurtarildi" }
          - metin: { tr: "Kartona mum boyayla bir resim çizmiş: bir kepenk, altı çöp adam, ortada da kocaman bir sen. \"Annem iyileşti,\" diyor. \"Hekim teyze kızgın ama annem iyileşti.\"", en: "He's drawn on it in crayon: a shutter, six stick figures, and you in the middle, huge. \"My mom got better,\" he says. \"The doctor lady's mad at everybody, but my mom got better.\"" }
            kosul: { bayrak: "mahsurlar_siginakta" }
          - metin: { tr: "Kartona mum boyayla bir resim çizmiş: bir kepenk ve sen. Ama elleri su toplamış; rampadaki asker herkese iş vermiş, ona da su taşıtıyor. \"Annem çalışamıyor,\" diyor, \"ben de iki kişilik taşıyorum.\"", en: "He's drawn on it in crayon: a shutter, and you. But his hands are blistered, because the soldier at the dock put everybody to work, him included, hauling water. \"My mom can't work,\" he says, \"so I carry for two.\"" }
            kosul: { bayrak: "mahsurlar_loncada" }
          - metin: { tr: "Kartona mum boyayla bir resim çizmiş ama sana göstermeden önce duraksıyor. Vaizin adamları annesine \"yakıt\" demiş; payını seçilmişlere vermesi gerekiyormuş, o yüzden annesi yine zayıf düşmüş.", en: "He's drawn on it in crayon, but he hesitates before he shows you. The preacher's people called his mom \"fuel.\" She's supposed to give her share to the Chosen, so she's getting weak again." }
            kosul: { bayrak: "mahsurlar_yukselenlerde" }
          - metin: { tr: "Kartona mum boyayla bir resim çizmiş: senin kamp ateşin, çevresinde yedi çöp adam. \"Kaptan dede herkese düğüm öğretiyor,\" diyor. \"İstersen sana da öğretirmiş.\"", en: "He's drawn on it in crayon: your campfire with seven stick figures around it. \"The old captain's teaching everybody knots,\" he says. \"He'll teach you too if you want.\"" }
            kosul: { bayrak: "mahsurlar_kampta", bayrak_yok: "mahsur_kaptan_kaldi" }
          - metin: { tr: "Kartona mum boyayla bir resim çizmiş: senin kamp ateşin, çevresinde altı çöp adam, bir kenarda da kepengin ardından el sallayan ufacık bir adam. \"Kaptan dedeyi de çizdim,\" diyor. \"Unutmayalım diye.\"", en: "He's drawn on it in crayon: your campfire with six stick figures around it, and off to one side, behind a shutter, a little man waving. \"I drew the old captain too,\" he says. \"So we don't forget him.\"" }
            kosul: { bayrak: ["mahsurlar_kampta", "mahsur_kaptan_kaldi"] }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ö̷nemli değil, de. sistem de öyle der. bak, ne çok benziyorsunuz.", en: "s̷ay it doesn't matter. the system says that too. see how alike you are?" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Kız kardeşin yanına otur, özür dile", en: "Sit down by the sister and apologize" }
            goster: { bayrak: "mahsurlar_birakildi" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 2 }
            sonraki: "mahsurlar_sonrasi_ozur"
          - id: "inkar"
            etiket: { tr: "Onu tanımıyormuş gibi geç", en: "Walk past like you don't know her" }
            goster: { bayrak: "mahsurlar_birakildi" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - gizle: 2
            sonraki: "@akis"
          - id: "hekime_gotur"
            etiket: { tr: "Kardeşi yemek katındaki hekime götür", en: "Walk the sister to the food court doctor" }
            goster: { bayrak: "mahsurlar_birakildi" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "resmi_al"
            etiket: { tr: "Resmi al, çantanın en güvenli yerine koy", en: "Take the drawing. Pack it somewhere safe" }
            goster: { bayrak: "mahsurlar_kurtarildi" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "yakit_degil"
            etiket: { tr: "Annesini vaizin elinden al", en: "Get his mother away from the preacher" }
            goster: { bayrak: "mahsurlar_yukselenlerde" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { yukselenler: -4, siginak: 3 }
              - iliski: { vahit: { guven: -6, saygi: -2 } }
              - degisken: { hayatta_kalan: 1 }
              - bayrak_kaldir: "mahsurlar_yukselenlerde"
              - bayrak: "mahsurlar_siginakta"
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "suyu_paylas"
            etiket: { tr: "Bir gün boyunca çocuğun kovalarını sen taşı", en: "Carry the kid's buckets for a day" }
            goster: { bayrak: "mahsurlar_loncada" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - stat: { end: 1 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - gun: 1
            sonraki: "@akis"
          - id: "dugum"
            etiket: { tr: "Kaptandan bir denizci düğümü öğren", en: "Learn a sailor's knot from the captain" }
            goster: { bayrak: "mahsurlar_kampta", bayrak_yok: "mahsur_kaptan_kaldi" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - stat: { agi: 1 }
            sonraki: "@akis"
          - id: "kaptan"
            etiket: { tr: "Ayakkabı mağazasına uğra, kaptana bak", en: "Swing by the shoe store. Look for the captain" }
            goster: { bayrak: "mahsur_kaptan_kaldi" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 2 }
            sonraki: "mahsurlar_sonrasi_kaptan"
          - id: "yuru"
            etiket: { tr: "Başını salla, yoluna devam et", en: "Nod and keep moving" }
            goster: { bayrak: "mahsurlar_kurtarildi" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
      - id: "mahsurlar_sonrasi_kaptan"
        paragraflar:
          - { tr: "Ayakkabı mağazasının kepengi yarıya kadar açık, mankenler gitmiş. Raflar devrilmiş, zemin ayak izi dolu.", en: "The shoe store's shutter is halfway up, and the dummies are gone. The racks are knocked over, the floor covered in footprints." }
          - { tr: "Rafların arasındaki taburede parlak bir çift spor ayakkabı duruyor; bağcıkları sıkı bir denizci düğümüyle birbirine bağlanmış. Kaptandan başka bir iz kalmamış.", en: "On the stool between the racks sits a pair of shiny sneakers, the laces tied together in a tight sailor's knot. There's no other sign of the captain." }
        secenekler:
          - id: "al"
            etiket: { tr: "Ayakkabıları al, düğümü çözme", en: "Take the sneakers. Leave the knot tied" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - stat: { agi: 1 }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Taburede bırak; burası onun iskelesi", en: "Leave them on the stool. This was his dock" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            sonraki: "@akis"

      - id: "mahsurlar_sonrasi_ozur"
        paragraflar:
          - { tr: "Özrünü sonuna kadar dinliyor. Ardından ateşe bir parça karton atıp alevlerin onu yiyişini seyrediyor.", en: "She hears you out, every word. Then she tosses a scrap of cardboard on the fire and watches it burn." }
          - { tr: "\"Kardeşim senin için dua etti,\" diyor. \"O kepengin arkasında, son gece. Gelecek dedi, ben de inandım.\"", en: "\"My sister prayed for you,\" she says. \"Behind that shutter, the last night, she said you'd come back, and I believed her.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Söz ver: bir daha kimseyi kepenk ardında bırakmayacaksın", en: "Never leave anyone behind a shutter again" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme, yanında otur", en: "Don't say anything. Just sit with her" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"

  # ================================================================== ÇÖP AVCISININ TEZGÂHI
  - id: "cop_avcisi_pazar"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 3, max: 30 }
    agirlik: 4
    etiketler: ["ticaret", "karsilasma", "carsi"]
    gerilim: 1
    kart: { tr: "Yürüyen merdivenin dibindeki tezgâh", en: "The stall under the escalator" }
    sahne: "cop_avcisi_pazar_1"
    sahneler:
      - id: "cop_avcisi_pazar_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Durmuş yürüyen merdivenin dibine üç alışveriş arabası yan yana dizilmiş, üstlerine çiçekli bir masa örtüsü atılmış. Tezgâhta iksirler, cam şişeler, bir kutu pil, yarısı yenmiş bir paket bisküvi; her birinin üstünde elle yazılmış bir fiyat etiketi.", en: "Three shopping carts sit side by side at the foot of the dead escalator with a flowered tablecloth thrown over them. On display: potions, glass vials, a box of batteries, and half a sleeve of cookies, every single one with a handwritten price tag." }
          - { tr: "Tezgâhın sahibi reflektörlü yelek giymiş, kırk yaşlarında bir kadın. Ayağının dibinde, köpek tasmasına bağlı, diz boyu, patlak gözlü bir hurdacık oturuyor; bir pili koklayıp kadının kulağına bir şeyler tıkırdatıyor.", en: "The owner is a woman in her forties wearing a reflective safety vest. At her feet, clipped to a dog leash, sits a knee-high, bug-eyed Tinkerling, sniffing a battery and clicking something into her ear." }
          - { tr: "\"Her şeyin bir fiyatı var,\" diyor kadın. \"Ufaklık neyin kaç para ettiğini bilir, ben de kimin yalan söylediğini.\"", en: "\"Everything's got a price,\" the woman says. \"The little guy knows what stuff's worth. I know who's lying.\"" }
          - metin: { tr: "Tezgâhın köşesinde plastik bir anahtarlık sallanıyor: bacası kırık, bembeyaz bir {yer:kiyikent} vapuru.", en: "A plastic keychain dangles from the corner of the cart: a little white {yer:kiyikent} ferry with a broken smokestack." }
            kosul: { yoldas: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Kadının penceresindeki seviye bozuk bir yama gibi titriyor. Üstte 9 yazıyor, altından bir 4 sızıyor.", en: "The level on her window flickers like a bad patch. The top layer says 9. Underneath, a 4 is bleeding through." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "tasma o yaratığı tutmuyor. kendi isteğiyle kalıyor. neden, hiç merak etmiyor musun?", en: "that leash isn't holding the little thing. it stays because it wants to. aren't you even curious why?" }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Kadın seni süzerken kafasında bütün fiyatları yeniden yazıyor. Artıracak mı, indirecek mi, henüz karar vermiş değil.", en: "She's sizing you up and rewriting every price in her head. Up or down, she hasn't decided." }
        secenekler:
          - id: "pazarlik"
            etiket: { tr: "Pazarlık et", en: "Haggle" }
            zar: { stat: "cha", zorluk: 12, tek: false, basarisiz: "cop_avcisi_pazar_pazarlik_yok", basarisiz_etkiler: [{ kredi: -5 }] }
            etkiler:
              - kredi: -10
              - esya: { kucuk_iyilesme_iksiri: 2 }
            sonraki: "@akis"
          - id: "takas"
            etiket: { tr: "Pas dişlerini bir iksirle takas et", en: "Trade your rust teeth for a potion" }
            gerekli: { esya: { pas_dis: 2 } }
            etkiler:
              - esya: { pas_dis: -2, kucuk_iyilesme_iksiri: 1 }
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "cekirdek"
            etiket: { tr: "Ona bir canavar çekirdeği sat", en: "Sell her a monster core" }
            gerekli: { esya: { canavar_cekirdegi: 1 } }
            etkiler:
              - esya: { canavar_cekirdegi: -1 }
              - kredi: 30
            sonraki: "cop_avcisi_pazar_cekirdek"
          - id: "blof"
            etiket: { tr: "Gerçek seviyesini kulağına fısılda", en: "Whisper her real level in her ear" }
            gerekli: { stat: { per: 7 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "pazarci_maskesi"
            sonraki: "cop_avcisi_pazar_sir"
          - id: "kaldir"
            tur: "gosteris"
            etiket: { tr: "Tezgâhı tek elle kaldır, bekle", en: "Lift the whole stall one-handed and wait" }
            gerekli: { stat: { str: 14 } }
            etkiler:
              - ahlak: { merhamet: -4, duzen: -2 }
              - dikkat: 3
              - esya: { kucuk_iyilesme_iksiri: 1, cam_sise: 2, panzehir: 1 }
            sonraki: "cop_avcisi_pazar_kaldir"
          - id: "hurdacik"
            etiket: { tr: "Hurdacığa bir avuç hurda uzat", en: "Hold out a handful of scrap to the Tinkerling" }
            gerekli: { esya: { hurda: 2 } }
            etkiler:
              - esya: { hurda: -2 }
              - ahlak: { insanlik: 1 }
            sonraki: "cop_avcisi_pazar_hurdacik"
          - id: "anahtarlik"
            etiket: { tr: "{npc:deniz_arman} için o vapur anahtarlığını al", en: "Buy {npc:deniz_arman} that ferry keychain" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - kredi: -5
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 6, guven: 3 } }
            sonraki: "cop_avcisi_pazar_anahtarlik"
          - id: "git"
            etiket: { tr: "Hiçbir şey almadan yürü", en: "Walk on without buying anything" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_pazarlik_yok"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadın fiyattan tek kredi indirmiyor. Üstüne bir de pazarlık ettiğin için beş kredi \"oturma ücreti\" istiyor.", en: "She doesn't knock a single credit off. Instead she charges you five for \"sitting time.\"" }
          - { tr: "\"Bu çarşıda zaman da satılık,\" diyor. Hurdacık onaylar gibi tıkırdıyor.", en: "\"Time's for sale in this mall too,\" she says, and the Tinkerling clicks like it agrees." }
        secenekler:
          - id: "ode"
            etiket: { tr: "Öde; bir dahakine daha iyi pazarlık et", en: "Pay up. Haggle better next time" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "gul"
            etiket: { tr: "Gülümse, yürü", en: "Smile and walk on" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_fiyat_yok"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadın kaşlarını kaldırıp parmağıyla tezgâha vuruyor. \"Otuz dedim, otuz,\" diyor. \"Şansını başka tezgâhta dene.\"", en: "She raises her eyebrows and taps the cart with one finger. \"I said thirty, and I meant thirty,\" she says. \"Try your luck at some other stall.\"" }
          - { tr: "Hurdacık başını iki yana sallıyor: pazarlık bitti.", en: "The Tinkerling shakes its head. Haggling's over." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Otuza razı ol", en: "Settle for thirty" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Yine de vaizin yerini sor", en: "Ask where the preacher is anyway" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_cekirdek"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadın çekirdeği ışığa tutuyor; içinde bulanık, mor bir şey dönüp duruyor. \"Bunlara iyi para veren var,\" diyor. \"Havuz başındakiler, vaizin çocukları.\"", en: "She holds the core up to the light, and something murky and purple swirls inside. \"There's folks who pay real good for these,\" she says. \"The fountain crowd, the preacher's kids.\"" }
          - { tr: "\"Yutuyorlar,\" diyor, havadan sudan konuşur gibi. \"Biri geçen gün kan kustu, ertesi gün iki seviye atladı. Şimdi hepsi ondan istiyor.\"", en: "\"They swallow 'em,\" she says, like she's talking about the weather. \"One of 'em puked blood the other day and jumped two levels by morning. Now they all want one.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ç̷ekirdek pil değil, mühür. yutan, kendini sistem'e biraz daha imzalatıyor. bunu sana kimse söylemeyecekti.", en: "a̷ core isn't a battery. it's a seal. whoever swallows one signs a little more of themselves over to the system. nobody was ever going to tell you that." }
        secenekler:
          - id: "kime"
            etiket: { tr: "Vaizin nerede vaaz verdiğini sor", en: "Ask where the preacher holds his sermons" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "fiyat"
            etiket: { tr: "Madem öyle, fiyatı yükselt", en: "If that's the case, raise your price" }
            zar: { stat: "cha", zorluk: 11, tek: true, basarisiz: "cop_avcisi_pazar_fiyat_yok" }
            etkiler:
              - kredi: 15
              - ahlak: { merhamet: -2 }
            sonraki: "@akis"
          - id: "satma"
            etiket: { tr: "Onlara satmamasını rica et", en: "Ask her not to sell to them" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { yukselenler: -2 }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_sir"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadının gülümsemesi bir an kayıyor, yerine daha sahici bir tanesi oturuyor. \"Sesini alçalt,\" diyor. \"Bu çarşı dört olduğumu bilse iki saat dayanamazdım.\"", en: "Her smile slips for a second, then a realer one settles in its place. \"Keep your voice down,\" she says. \"If this mall knew I was a four, I wouldn't last two hours.\"" }
          - { tr: "\"Sana bir borcum oldu,\" deyip sesini iyice alçaltıyor. \"Bodrumdaki banka şubesinin kasası açılmış. İçinden ses geliyor, ama para sesi değil.\"", en: "\"So I owe you one,\" she says, dropping even lower. \"The bank branch down in the basement, the vault door's open. There's noise coming out of it, and it isn't money.\"" }
        secenekler:
          - id: "kasa"
            etiket: { tr: "Kasanın yerini aklına yaz", en: "Memorize where the vault is" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "zindan_kasa", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "indirim"
            etiket: { tr: "Sırrın bedeli olarak bir iksir iste", en: "Ask for a potion as the price of silence" }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: 1 }
              - ahlak: { merhamet: -2, duzen: -1 }
            sonraki: "@akis"
          - id: "sir_sende"
            etiket: { tr: "Sırrının sende güvende olduğunu söyle", en: "Tell her the secret's safe with you" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - esya: { cam_sise: 2 }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_kaldir"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Üç arabayı örtüsü ve iksirleriyle birlikte tepsi gibi göğüs hizana kaldırıyorsun. Tek şişe bile devrilmiyor.", en: "You lift all three carts, tablecloth and potions and all, chest-high like a serving tray. Not one bottle tips over." }
          - { tr: "Kadın tek kelime etmeden cebine üç şey sıkıştırıyor. Hurdacıksa ilk kez tıkırdamayı kesip kocaman gözleriyle sana bakıyor; hayranlık mı, korku mu, bir hurdacığın yüzünden okunmuyor.", en: "Without a word, the woman tucks three things into your pocket. The Tinkerling stops clicking for the first time and stares at you with those huge eyes. Awe or terror, you can't read it on a face like that." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Tezgâhı yavaşça yere bırak", en: "Set the stall down gently" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "@akis"
          - id: "dusur"
            etiket: { tr: "Bırak, düşsün", en: "Let it drop" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2 }
              - dikkat: 2
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_hurdacik"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Hurdacık hurdayı koklayıp iki parça seçiyor, ikisini de ağzına atıp çiğniyor. Ardından elini kadının önlüğünün cebine daldırıp sana bir şişe uzatıyor.", en: "The Tinkerling sniffs the scrap, picks out two pieces, pops them both in its mouth, and chews. Then it digs into the pocket of the woman's apron and hands you a bottle." }
          - { tr: "\"Hey, o benim—\" diye başlıyor kadın ama hurdacık tıkırdayınca iç çekip elini sallıyor. \"Peki, seni sevdi,\" diyor. \"Bu çarşıda başka sevdiği tek şey pil.\"", en: "\"Hey, that's mine—\" the woman starts, but the Tinkerling clicks at her, and she sighs and waves it off. \"Fine, he likes you,\" she says. \"Only other thing in this mall he likes is batteries.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Şişeyi al, hurdacığa teşekkür et", en: "Take the bottle and thank the little guy" }
            etkiler:
              - esya: { mana_iksiri: 1 }
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "geri_ver"
            etiket: { tr: "Şişeyi kadına geri ver", en: "Give the bottle back to the woman" }
            etkiler:
              - ahlak: { duzen: 3 }
              - esya: { cam_sise: 1, kaya_tuzu: 1 }
            sonraki: "@akis"

      - id: "cop_avcisi_pazar_anahtarlik"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:deniz_arman} anahtarlığı avucunda evirip çeviriyor, uzun süre ağzını açmıyor. Başparmağıyla kırık bacayı düzeltmeye uğraşıyor ama baca düzelmiyor.", en: "{npc:deniz_arman} turns the keychain over in {zamir:deniz_arman|onun} palm and doesn't say anything for a long time. A thumb works at the broken smokestack, trying to straighten it. It won't straighten." }
          - { tr: "\"Sabah vapurunda martılara simit atardık,\" diyor sonunda. \"Şimdi bu niye aklıma geldi, bilmiyorum.\" Anahtarlığı ceketinin fermuarına takıyor; o günden sonra her adımında hafif hafif şıkırdıyor.", en: "\"We used to throw pretzel bits to the gulls on the morning ferry,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}. \"No idea why I'm thinking about that now.\" The keychain goes on {zamir:deniz_arman|onun} jacket zipper, and from that day on it clicks softly with every step." }
        secenekler:
          - id: "doneriz"
            etiket: { tr: "\"Döneceğiz. O vapura yine bineceğiz.\"", en: "\"We'll get back. We'll ride that ferry again.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 3 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey deme, omzuna dokun", en: "Don't say anything. Touch their shoulder" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { baglilik: 2 } }
            sonraki: "@akis"

  # ================================================================== ÇARŞI ÇETESİ
  - id: "carsi_cetesi"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 8, max: 24 }
    agirlik: 5
    etiketler: ["ahlak", "insan", "carsi"]
    gerilim: 3
    onemli: true
    kart: { tr: "Cam köprüdeki gişe", en: "The toll on the skybridge" }
    sahne: "carsi_cetesi_1"
    sahneler:
      - id: "carsi_cetesi_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Biri atriyumun cam köprüsünün ortasına bir otopark bariyeri sürükleyip getirmiş. Yanındaki kartonda boyayla yazılmış: GEÇİŞ — 1 YEMEK / 1 İKSİR / 1 GECE NÖBETİ.", en: "Somebody dragged a parking-garage gate arm out to the middle of the atrium's glass skybridge. The cardboard next to it says, in house paint: TOLL — 1 MEAL / 1 POTION / 1 NIGHT ON WATCH." }
          - { tr: "Bariyerin başında otopark görevlisi ceketi giymiş bir adam, hâlâ çalışan bir bilet makinesinden fiş basıyor. Arkasında boru ve sopa taşıyan dört kişi duruyor; biri en fazla on beşinde bir oğlan.", en: "The guy running it wears a parking attendant's jacket and punches tickets out of a machine that somehow still works. Behind him are four guys with pipes and bats. One of them is a boy, fifteen tops." }
          - { tr: "Kuyruktaki yaşlı bir kadın ödeyecek hiçbir şeyi olmadığını söylüyor. Adam gülümseyip kadının bileğindeki saati gösteriyor: \"O da olur, teyzeciğim.\"", en: "An old woman in line says she's got nothing to pay with. The man smiles and points to the watch on her wrist. \"That'll do just fine, ma'am.\"" }
          - { tr: "Kadın kayışı çözerken elleri titriyor. Saat kocasınınmış; söylemesine gerek yok, herkes anlıyor.", en: "Her hands shake as she works the clasp. It was her husband's; she doesn't have to say so, everybody knows." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Adamın penceresi Seviye 8 diyor, gerçeği 5. Arkasındaki oğlanınki 2; borusunu da ters tutuyor.", en: "His window says Level 8. He's a 5. The kid behind him is a 2, and he's holding his pipe backwards." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "g̷işe, fiş, ücret tarifesi. dünyanın sonunda bile bürokrasi kuruyorsunuz. bayılıyorum.", en: "a̷ toll booth, tickets, a rate card. even at the end of the world you people build bureaucracy, and i love it." }
          - kosul: { bayrak: "kirilma_yasandi" }
            metin: { tr: "beşi birden senin tek nefesin. bunu onlar da öğrenecek, yalnız henüz değil.", en: "all five of them together are one breath of yours. they'll figure that out too. just not yet." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Önce kadının saatini geri alalım. Gerisini sonra konuşuruz.\"", en: "\"Get the lady her watch back first. We can talk after.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Fiş basıyor. Ciddi ciddi fiş basıyor. Adamın veritabanı var. Bu beni niye bu kadar rahatsız ediyor?\"", en: "\"He's printing receipts. Actual receipts. The guy has a database. Why does that bother me so much?\"" }
        secenekler:
          - id: "ode"
            etiket: { tr: "Ücreti öde, geç", en: "Pay the toll and walk through" }
            etkiler:
              - kredi: -10
              - ahlak: { duzen: 2, merhamet: -2 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "kadin"
            etiket: { tr: "Kadının ücretini de sen öde", en: "Pay the old woman's toll too" }
            etkiler:
              - kredi: -20
              - ahlak: { merhamet: 4, duzen: 1 }
            sonraki: "carsi_cetesi_comert"
          - id: "dagit"
            etiket: { tr: "Bariyeri devir; gişe kapandı", en: "Knock the gate over. Toll booth's closed" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - savas: { dusmanlar: ["cop_avcisi", "cop_avcisi"], ortam: ["dar_gecit"], kazan: "carsi_cetesi_zafer", kaybet: "carsi_cetesi_yenilgi", kac: "carsi_cetesi_kacis" }
          - id: "ikna"
            etiket: { tr: "Onlara daha iyi bir iş teklif et: muhafızlık", en: "Offer them a better gig: escort duty" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "carsi_cetesi_ters", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }] }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 2 }
            sonraki: "carsi_cetesi_muhafiz"
          - id: "bukmek"
            tur: "gosteris"
            etiket: { tr: "Bariyeri tek elle bük; fişini kendin bas", en: "Bend the gate arm one-handed. Print your own ticket" }
            gerekli: { stat: { str: 15 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -3 }
              - dikkat: 3
              - tehlike: { harabe_carsi: -3 }
              - bayrak: "cete_dagitildi"
            sonraki: "carsi_cetesi_ezme"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kuyruğa gir, başını eğ, izle", en: "Get in line, keep your head down, and watch" }
            etkiler:
              - gizle: 2
              - kredi: -10
              - ahlak: { duzen: 1, merhamet: -1 }
              - bilgi: "cete_gercek_seviye"
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_comert"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kadın saatini geri takıp sana bir şey söylemeye çalışıyor ama boğazı düğümleniyor. Gişedeki adam iki fişi birden koparıp sana uzatıyor.", en: "The old woman straps her watch back on and tries to say something to you. Her throat won't let her. The guy at the gate tears off two tickets at once and holds them out." }
          - { tr: "\"Cömertmişsin,\" deyip seni tepeden tırnağa süzüyor. \"Bu çarşıda cömertlik ya çok güçlü olmaktan gelir ya çok aptal olmaktan. Sen hangisisin?\"", en: "\"Generous,\" he says, looking you up and down. \"In this mall, generous means you're either real strong or real stupid. Which one are you?\"" }
          - { tr: "Arkasındaki oğlan gözünü senden ayırmıyor. Borusunu yine ters tutuyor; bu kez farkına varıp utanıyor.", en: "The kid behind him is staring at you. He's holding the pipe backwards again. This time he notices, and it embarrasses him." }
        secenekler:
          - id: "ikisi_de_degil"
            etiket: { tr: "\"İkisi de değil. Sabırlıyım.\"", en: "\"Neither. I'm patient.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "oglan"
            etiket: { tr: "Oğlana burada ne aradığını sor", en: "Ask the kid what he's doing here" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 2 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "carsi_cetesi_oglan"
          - id: "simdi_dagit"
            etiket: { tr: "Fişleri yırt, bariyeri devir", en: "Tear up the tickets and knock the gate over" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -3 }
              - savas: { dusmanlar: ["cop_avcisi", "cop_avcisi"], ortam: ["dar_gecit"], kazan: "carsi_cetesi_zafer", kaybet: "carsi_cetesi_yenilgi", kac: "carsi_cetesi_kacis" }

      - id: "carsi_cetesi_oglan"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Oğlan önce liderine, sonra sana bakıyor. \"O benim abim,\" diyor, sesi çatallanarak. \"Annemiz kepenklerin orada kaldı. Abim, kimse bizden bir şey almasın, önce biz alalım dedi.\"", en: "The kid glances at the boss, then at you: \"He's my brother,\" he says, voice cracking. \"Our mom got left back by the shutters. My brother said nobody's ever taking anything from us again, so we take first.\"" }
          - { tr: "Abi ağzını açmıyor. Sessizliğin ortasında bilet makinesi kendi kendine bir fiş daha basıyor.", en: "The brother doesn't say anything. In the silence, the ticket machine prints one more stub all on its own." }
        secenekler:
          - id: "hekim"
            etiket: { tr: "Yemek katındaki hekime gitmesini söyle", en: "Tell him to go see the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "cete_oglan_kurtuldu"
            sonraki: "@akis"
          - id: "abiye"
            etiket: { tr: "Abisine dön: \"Ona böyle mi göz kulak oluyorsun?\"", en: "Turn to the brother: \"This is you looking out for him?\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            sonraki: "@akis"

      - id: "carsi_cetesi_ters"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Adam teklifini sonuna kadar dinleyip kahkahayı basıyor. \"Kime muhafızlık, kimin parasıyla?\" diyor. \"Burada tek iş var, o da benim işim.\"", en: "He hears your pitch all the way through, then bursts out laughing. \"Escort duty for who, paid with what?\" he says. \"There's one job in this mall, and it's mine.\"" }
          - { tr: "Dört boru birden kalkıyor. Kuyruktakiler geri çekilirken yaşlı kadın saatini göğsüne bastırıyor.", en: "Four pipes come up at once. The people in line back away. The old woman clutches her watch to her chest." }
        secenekler:
          - id: "kavga"
            etiket: { tr: "Madem öyle. Gel bakalım", en: "Fine. Come on, then" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - savas: { dusmanlar: ["cop_avcisi", "cop_avcisi"], ortam: ["dar_gecit"], kazan: "carsi_cetesi_zafer", kaybet: "carsi_cetesi_yenilgi", kac: "carsi_cetesi_kacis" }
          - id: "geri_cekil"
            etiket: { tr: "Ellerini kaldır, köprüden çekil", en: "Raise your hands and back off the bridge" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_muhafiz"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Adam sopasını indiriyor. \"Muhafızlık,\" diyor, kelimeyi ağzında tartarak. \"İnsanları köprüden geçir, istasyona kadar götür, karşılığında da biri seni doyursun. Kim doyuracak?\"", en: "The man lowers his bat: \"Escort duty,\" he says, testing the words. \"Walk people across, take 'em all the way to the station, and somebody feeds you for it. Who's doing the feeding?\"" }
          - { tr: "Yerinde bir soru. Arkasındaki dört kişi de cevabı bekliyor, en çok da oğlan.", en: "Fair question. The four behind him are waiting on the answer too. The kid most of all." }
        secenekler:
          - id: "kayaya"
            etiket: { tr: "Onları rampadaki askerin kampına yolla", en: "Send them to the soldier's camp at the dock" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 5, guven: 2 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "cete_muhafiz"
              - tehlike: { harabe_carsi: -3 }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 1, max: 2 } }
              - tohum: { olay: "cete_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "elife"
            etiket: { tr: "Onları yemek katındaki hekime yolla", en: "Send them to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 4, guven: 2 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "cete_muhafiz"
              - tehlike: { harabe_carsi: -3 }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 1, max: 2 } }
              - tohum: { olay: "cete_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "bana"
            etiket: { tr: "\"Ben doyururum. Benim için çalışacaksınız.\"", en: "\"I'll feed you. You work for me now.\"" }
            gerekli: { stat: { cha: 10 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - dikkat: 2
              - bayrak: "cete_muhafiz"
              - bayrak: "cete_sana_bagli"
              - tehlike: { harabe_carsi: -4 }
              - tohum: { olay: "cete_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_ezme"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Bariyerin çelik kolunu tek elle kavrayıp pipet gibi büküyorsun. Ardından bilet makinesinin düğmesine basıyorsun; makine de korkmuş gibi titreye titreye bir fiş basıyor.", en: "You take the steel gate arm in one hand and bend it like a drinking straw. Then you press the button on the ticket machine. It prints you a stub, shaking, like it's scared too." }
          - { tr: "Dört boru köprünün camına çarpıp yere düşüyor, dört adam atriyumun karanlığına dağılıyor. Geriye lider ile oğlan kalıyor: lider kaçamayacak kadar şaşkın, oğlan kaçmayacak kadar inatçı.", en: "Four pipes clang off the skybridge glass and four guys scatter into the dark of the atrium. Only the boss and the kid are left: the boss too stunned to run, the kid too stubborn to." }
        secenekler:
          - id: "saat"
            etiket: { tr: "Saati liderden al, kadına geri ver", en: "Take the watch off the boss. Give it back" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - efsane: "canavari_bagisladi"
              - bayrak: "cete_lideri_bagislandi"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "korku"
            etiket: { tr: "Lideri köprünün korkuluğundan sarkıt", en: "Dangle the boss over the skybridge railing" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 2 }
              - dikkat: 2
              - itibar: { lonca: 3, siginak: -3 }
              - bayrak: "cete_lideri_bagislandi"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "oglana"
            etiket: { tr: "Oğlanın borusunu düzelt, elinden al", en: "Turn the kid's pipe right way round. Take it" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "cete_oglan_kurtuldu"
              - bayrak: "cete_lideri_bagislandi"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_zafer"
        yer: "harabe_carsi"
        paragraflar:
          - metin: { tr: "İki vuruş, belki üç. Bilet makinesi köprünün camını aşıp atriyuma düşüyor, aşağıda alkışı andıran bir şangırtıyla paramparça oluyor.", en: "Two hits. Maybe three. The ticket machine goes over the skybridge rail and shatters on the atrium floor below like a round of applause." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Köprünün camı çatlamış, ağzında kan tadı var. Ama gişeci dizlerinin üstüne çökmüş; fişleri köprünün altından yükselen hava akımında kar taneleri gibi uçuşuyor.", en: "The skybridge glass is cracked and you've got the taste of blood in your mouth. But the toll man's on his knees, and his tickets are drifting up in the draft from the atrium like snowflakes." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Kuyruktakiler kıpırdamıyor. Gözleri sende: ne yapacağını, onlardan ne kadar farklı olduğunu görmek istiyorlar.", en: "Nobody in line moves. They're watching you, watching what you'll do, watching how different you are from him." }
          - { tr: "Oğlan borusunu bırakmış, tir tir titriyor. Ağzından tek bir şey çıkıyor: \"Abim... o benim abim.\"", en: "The kid's dropped his pipe, and he's shaking. \"That's my brother,\" is all he says, \"that's my brother.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ş̷imdi ne yaparsan bu köprüdeki herkes onu anlatacak. iyi düşün. ya da hiç düşünme; o da bir cevap.", en: "w̷hatever you do now, everyone on this bridge tells the story. think hard. or don't think at all. that's an answer too." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşinin önünde olmaz. Lütfen.\"", en: "\"Not in front of his little brother. Please.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dikiş lazım. Her şeyden önce dikiş. Sonra ne yapacaksan yap.\"", en: "\"He needs stitches. Before anything else he needs stitches. Then do whatever you're going to do.\"" }
        secenekler:
          - id: "infaz"
            etiket: { tr: "Lideri herkesin önünde bitir", en: "Finish the boss in front of everyone" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4, duzen: 3 }
              - efsane: "acimasiz_infaz_tanikli"
              - itibar: { yukselenler: 3, lonca: 2, siginak: -4 }
              - degisken: { hayatta_kalan: -1 }
              - tehlike: { harabe_carsi: -4 }
              - bayrak: "cete_lideri_olduruldu"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "bagisla"
            etiket: { tr: "Bağışla; aldığı her şeyi geri versin", en: "Spare him. He gives back everything he took" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - efsane: "canavari_bagisladi"
              - tehlike: { harabe_carsi: -3 }
              - bayrak: "cete_lideri_bagislandi"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "teslim"
            etiket: { tr: "Onu rampadaki askere teslim et", en: "Hand him over to the soldier at the dock" }
            goster: { bayrak: "kaya_kampi_bilinir" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -1 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
              - tehlike: { harabe_carsi: -3 }
              - bayrak: "cete_loncaya_teslim"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "halk"
            etiket: { tr: "Kararı kuyruktakilere bırak", en: "Let the people in line decide" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
            sonraki: "carsi_cetesi_halk"

      - id: "carsi_cetesi_halk"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Önce konuşmaya kimse yanaşmıyor. Derken yaşlı kadın saatini bileğine geri takarak öne çıkıyor.", en: "Nobody wants to go first. Then the old woman steps up, strapping the watch back onto her wrist." }
          - { tr: "\"Gitsin,\" diyor. \"Çarşıdan çıksın, bir daha yüzünü görmeyelim. Kardeşi kalabilir; çocuk çocuktur.\" Kuyrukta başlar birer birer onaylarcasına sallanıyor.", en: "\"Let him go,\" she says. \"Out of this mall, and we never see him again, but the little brother can stay, because a kid's a kid.\" One by one, heads in the line start to nod." }
          - { tr: "Kimse adını koymuyor ama bunun bir oylama olduğunu herkes anlıyor. Öğretici'de ilk kez bir avuç insan birinin kaderine birlikte karar veriyor.", en: "Nobody calls it a vote, but everybody knows that's what it is. For the first time in the Tutorial, a group of people decide somebody's fate together." }
        secenekler:
          - id: "uygula"
            etiket: { tr: "Kararı uygula; onu çarşının dışına yürüt", en: "Carry it out. Walk him out of the mall" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 3 } }
              - degisken: { hayatta_kalan: 1 }
              - tehlike: { harabe_carsi: -3 }
              - bayrak: "cete_lideri_bagislandi"
              - bayrak: "cete_oglan_kurtuldu"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "kardesler"
            etiket: { tr: "Kardeşleri ayırma; ikisi birlikte gitsin", en: "Don't split the brothers. They leave together" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - tehlike: { harabe_carsi: -3 }
              - bayrak: "cete_lideri_bagislandi"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_yenilgi"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Boru kaburgalarına iniyor, ardından bir kez daha. Yüzün köprünün soğuk camına yapışmışken birinin ellerinin ceplerini boşalttığını hissediyorsun.", en: "A pipe comes down on your ribs, then again. With your cheek pressed to the cold skybridge glass, you feel somebody's hands going through your pockets." }
          - { tr: "\"Ücret,\" diyor gişeci, tepene dikilip. \"Artı gecikme cezası.\" Bilet makinesi senin adına bir fiş basıyor, adam da fişi yüzünün önüne bırakıyor.", en: "\"Toll,\" the gate man says, standing over you. \"Plus a late fee.\" The machine prints a stub with your name on it, and he drops it in front of your face." }
        secenekler:
          - id: "fis"
            etiket: { tr: "Fişi sakla; bir gün geri getireceksin", en: "Keep the stub. You'll bring it back someday" }
            etkiler:
              - kredi: -15
              - ahlak: { merhamet: -2, duzen: -1 }
              - stat: { wil: 1 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "surun"
            etiket: { tr: "Sürünerek köprüden uzaklaş", en: "Crawl off the bridge" }
            etkiler:
              - kredi: -15
              - ahlak: { duzen: 1 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"

      - id: "carsi_cetesi_kacis"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Köprüden geri çekiliyorsun. Borular arkandan camı dövüyor ama peşine düşen olmuyor; gişeler kovalamaz, bekler.", en: "You back off the bridge. Pipes bang on the glass behind you, but nobody follows. Toll booths don't chase; they wait." }
          - { tr: "Kuyruktaki yaşlı kadın sana son bir kez bakıyor. Saat hâlâ adamın avucunda.", en: "The old woman in line looks at you one last time. Her husband's watch is still in that man's fist." }
        secenekler:
          - id: "unutma"
            etiket: { tr: "Kadının yüzünü aklına kazı", en: "Burn her face into your memory" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - bayrak: "cete_gisede"
              - tohum: { olay: "cete_hesabi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"
          - id: "baska_yol"
            etiket: { tr: "Çarşıda kendine başka bir yol bul", en: "Find yourself another way through the mall" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - bayrak: "cete_gisede"
            sonraki: "@akis"

  # ------------------------------------------------------------------ çetenin hesabı (tohum)
  - id: "cete_hesabi"
    perde: [1]
    agirlik: 1
    etiketler: ["ahlak", "insan", "carsi"]
    gerilim: 3
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Gişenin hesabı", en: "The toll comes due" }
    sahne: "cete_hesabi_1"
    sahneler:
      - id: "cete_hesabi_1"
        paragraflar:
          - metin: { tr: "Gece, kamp ateşinin ışığının bittiği yerde biri dikiliyor: gişecinin küçük kardeşi. Elinde bu kez ters tutmadığı bir mutfak bıçağı var, gözleri ağlamaktan kıpkırmızı.", en: "At night, right where your campfire's light runs out, somebody's standing. The toll man's little brother. He's got a kitchen knife this time, held the right way round, and his eyes are red from crying." }
            kosul: { bayrak: "cete_lideri_olduruldu" }
          - metin: { tr: "\"Herkes seni anlatıyor,\" diyor. \"Herkesin önünde yaptığını. Ben de herkesin önünde yapacağım.\" Bıçak titriyor, çocuk titremiyor.", en: "\"Everybody's telling it,\" he says, \"what you did in front of everybody, so I'm doing it in front of everybody too.\" The knife shakes; the kid doesn't." }
            kosul: { bayrak: "cete_lideri_olduruldu" }
          - metin: { tr: "Çarşıya uğradığında köprünün oradan biri sana el sallıyor: eski gişeci. Otopark ceketi gitmiş, sırtında birinin çantası var. Ama bu kez çanta bir yaşlınınki; adam onu istasyon yoluna kadar taşıyor.", en: "Back at the mall, someone by the skybridge waves at you: the old toll man, minus the parking jacket, somebody's backpack on his shoulders. But this time the backpack belongs to an old man, and he's carrying it for him all the way to the station road." }
            kosul: { bayrak: "cete_lideri_bagislandi" }
          - metin: { tr: "Yanına gelince sesini alçaltıyor: \"Adamlarım eski işe dönmek istiyor. Bu gece köprüde toplanacaklar. Yanımda biri dursa belki dönmezler.\"", en: "\"My guys want to go back to the old gig,\" he says when he gets close, keeping it low. \"They're meeting on the bridge tonight. If somebody stood with me, maybe they wouldn't.\"" }
            kosul: { bayrak: "cete_lideri_bagislandi" }
          - metin: { tr: "Çarşıya döndüğünde cam köprüdeki gişenin büyüdüğünü görüyorsun. Bariyerin yanına ikinci bir tabela çakılmış: ÇOCUKLAR YARIM TARİFE. Altında, kartona sonradan eklenmiş bir satır: YİYECEK YOKSA NÖBET, NÖBET YOKSA GEÇİŞ YOK.", en: "Back at the mall, you see the toll on the skybridge has grown, with a second sign nailed up by the gate: KIDS HALF PRICE. Under it, added later in marker: NO FOOD, PULL A WATCH. NO WATCH, NO CROSSING." }
            kosul: { bayrak: "cete_gisede" }
          - metin: { tr: "Köprünün altında, atriyumun zemininde üstü örtülmüş bir ceset yatıyor. İstasyondaki suya geçemeyen bir adammış; gişeye verecek bir şeyi kalmamış.", en: "Down on the atrium floor, under the skybridge, lies a body under a tarp. A man who couldn't get across to the water at the station. He had nothing left to pay the toll with." }
            kosul: { bayrak: "cete_gisede" }
          - metin: { tr: "Çarşıya uğradığında eski çete üyelerini cam köprünün iki ucunda buluyorsun; kollarına beyaz bez bağlamış, insanları karşıya geçiriyorlar. Biri seni görünce selam veriyor, beceriksizce ama içtenlikle.", en: "Back at the mall, you find the old gang at both ends of the skybridge, walking people across with white rags tied around their arms. One of them spots you and salutes. Clumsy, but he means it." }
            kosul: { bayrak: "cete_muhafiz" }
          - metin: { tr: "\"Dün bir aileyi sülüklerin elinden aldık,\" diyor. \"Biz, boru sallayan serseriler! Annem görse inanmazdı.\"", en: "\"Yesterday we got a family away from the leeches,\" he says. \"Us, the pipe-swinging idiots. My mom wouldn't believe it.\"" }
            kosul: { bayrak: "cete_muhafiz" }
          - metin: { tr: "Rampadaki kampın önünden geçerken gişeciyi görüyorsun; koluna turuncu bant sarılmış. Asker onu avcı yapmış, şimdi köprüden geçenlerden \"kampa katkı\" adı altında pay topluyor.", en: "Passing the dock camp, you spot the toll man, wearing an orange-taped armband. The soldier made him a hunter, and now he's collecting from everybody who crosses the bridge, except they call it a \"camp contribution.\"" }
            kosul: { bayrak: "cete_loncaya_teslim" }
          - metin: { tr: "Artık fiş basmıyor. Gereği yok; arkasında bir ordu var.", en: "He doesn't print tickets anymore. Doesn't have to. Now he's got an army behind him." }
            kosul: { bayrak: "cete_loncaya_teslim" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Ne yaparsan yap, bu çarşı kimin kime ne borçlu olduğunu senden öğreniyor.", en: "Whatever you do, this whole mall is learning from you who owes what to whom." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷orçlar faiz biriktirir. seninki de birikiyor. hesabı ben tutuyorum.", en: "d̷ebts collect interest. yours too. i've taken over the bookkeeping." }
        secenekler:
          # ---- intikam
          - id: "bicak_konus"
            etiket: { tr: "Ellerini aç, onu konuştur", en: "Open your hands and get him talking" }
            goster: { bayrak: "cete_lideri_olduruldu" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "cete_hesabi_kesik", basarisiz_etkiler: [{ can: -10 }, { ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "cete_hesabi_cocuk"
          - id: "bicak_al"
            etiket: { tr: "Bıçağı elinden al; bir daha deneme", en: "Take the knife away. Don't let him try again" }
            goster: { bayrak: "cete_lideri_olduruldu" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - dikkat: 1
            sonraki: "cete_hesabi_cocuk"
          - id: "bicak_bitir"
            etiket: { tr: "Onu yere ser; bileğini bıçak tutamayacak kadar burk", en: "Put him down. Twist that wrist till it can't hold a knife" }
            goster: { bayrak: "cete_lideri_olduruldu" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -5 }
              - yozlasma: 2
              - dikkat: 1
              - itibar: { siginak: -5, yukselenler: 3 }
            sonraki: "@akis"
          # ---- bağışlanan lider
          - id: "yaninda_dur"
            etiket: { tr: "Bu gece köprüde onun yanında dur", en: "Stand with him on the bridge tonight" }
            goster: { bayrak: "cete_lideri_bagislandi" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 3, lonca: 2 }
              - tehlike: { harabe_carsi: -3 }
              - degisken: { hayatta_kalan: 2 }
              - gun: 1
            sonraki: "@akis"
          - id: "kendi_isi"
            etiket: { tr: "\"Bu senin sınavın. Ben karışmam.\"", en: "\"This is your test. I'm staying out of it.\"" }
            goster: { bayrak: "cete_lideri_bagislandi" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"
          - id: "elife_gotur"
            etiket: { tr: "Adamlarını hekime götür; orada iş var", en: "Take his guys to the doctor. There's work there" }
            goster: { bayrak: "cete_lideri_bagislandi" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { saygi: 4, guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          # ---- gişe hâlâ açık
          - id: "simdi_kapat"
            etiket: { tr: "Bu gişeyi bu gece kapat", en: "Shut this toll booth down tonight" }
            goster: { bayrak: "cete_gisede" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - bayrak_kaldir: "cete_gisede"
              - savas: { dusmanlar: ["cop_avcisi", "cop_avcisi", "cop_avcisi"], ortam: ["dar_gecit"], kazan: "cete_hesabi_kapandi", kaybet: "cete_hesabi_dayak", kac: "cete_hesabi_dayak" }
          - id: "ezip_gec"
            tur: "gosteris"
            etiket: { tr: "Köprünün ortasına yürü, ücret iste", en: "Walk to the middle of the bridge. Demand a toll" }
            goster: { bayrak: "cete_gisede" }
            gerekli: { stat: { str: 16 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - dikkat: 4
              - bayrak_kaldir: "cete_gisede"
              - tehlike: { harabe_carsi: -5 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 3 }
              - efsane: "tek_basina_suru"
            sonraki: "cete_hesabi_kapandi"
          - id: "askere_haber"
            etiket: { tr: "Rampadaki askere gişeden haber ver", en: "Tell the soldier at the dock about the toll" }
            goster: { bayrak: "cete_gisede" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 3 } }
              - bayrak_kaldir: "cete_gisede"
              - bayrak: "cete_loncaya_teslim"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          # ---- muhafızlar
          - id: "talim"
            etiket: { tr: "Onlara bir sabah boyunca talim yaptır", en: "Run them through drills for a morning" }
            goster: { bayrak: "cete_muhafiz" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - egilim: { koruma: 1 }
            sonraki: "@akis"
          - id: "tebrik"
            etiket: { tr: "Selamına karşılık ver, yürü", en: "Return the salute and keep walking" }
            goster: { bayrak: "cete_muhafiz" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          # ---- loncaya teslim
          - id: "kayaya_sor"
            etiket: { tr: "Askere sor: bu mu senin adaletin?", en: "Ask the soldier: this is your idea of justice?" }
            goster: { bayrak: "cete_loncaya_teslim" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
              - hafiza: { npc: "kaya_demir", id: "olay:cete_hesabi", agirlik: 15 }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "katki_ode"
            etiket: { tr: "Katkını öde; düzen düzendir", en: "Pay your contribution. Order is order" }
            goster: { bayrak: "cete_loncaya_teslim" }
            etkiler:
              - kredi: -10
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 4 }
            sonraki: "@akis"
          - id: "gozunu_ac"
            etiket: { tr: "Eski gişeciye onu gözünün önünden ayırmadığını belli et", en: "Let the old toll man know you're watching him" }
            goster: { bayrak: "cete_loncaya_teslim" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - dikkat: 1
            sonraki: "@akis"

      - id: "cete_hesabi_cocuk"
        paragraflar:
          - { tr: "Bıçak yere düşüyor, ardından çocuk da yığılıyor. Hıçkırıkları ateşin çıtırtısını bastırıyor.", en: "The knife hits the dirt, and the kid goes down right after it. His sobbing is louder than the fire." }
          - { tr: "\"Kimsem kalmadı,\" diyor. \"Abim kötüydü, biliyorum. Ama benimdi.\"", en: "\"I don't have anybody left,\" he says. \"My brother was bad, I know. But he was mine.\"" }
        secenekler:
          - id: "hekime"
            etiket: { tr: "Onu sabah yemek katındaki hekime götür", en: "Take him to the food court doctor in the morning" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "ates_basi"
            etiket: { tr: "Ateşin başında ona yer aç", en: "Make room for him by the fire" }
            etkiler:
              - ahlak: { insanlik: 5, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "kov"
            etiket: { tr: "Gitmesini söyle, bir daha gelmesin", en: "Tell him to go and never come back" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
            sonraki: "@akis"

      - id: "cete_hesabi_kesik"
        paragraflar:
          - { tr: "Sen konuşmaya başlar başlamaz çocuk saldırıyor; beceriksizce, çaresizce, tam koluna. Bıçak kemiğe varmadan kayıyor ama kan akmaya başlıyor.", en: "You start talking and the kid lunges, clumsy and desperate, right into your forearm. The blade skids off before it finds bone, but you're bleeding." }
          - { tr: "Derken bıçağın senin kanınla ıslandığını görüp geri çekiliyor; yaptığı şeyden senden de çok korkmuş görünüyor.", en: "Then he sees your blood on the knife and backs away, more scared of what he just did than you are." }
        secenekler:
          - id: "sar"
            etiket: { tr: "Kolunu sar, onu yine de ateşe çağır", en: "Wrap your arm and call him to the fire anyway" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "cete_hesabi_cocuk"
          - id: "kovala"
            etiket: { tr: "Kaçmasına izin ver", en: "Let him run" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
            sonraki: "@akis"

      - id: "cete_hesabi_kapandi"
        paragraflar:
          - { tr: "Bu gece köprüde gişe yok. Bariyer atriyumun dibinde yatıyor, iki tabela da üstünde; kartonlardaki yazılar bir su birikintisinde yavaş yavaş eriyip akıyor.", en: "No toll on the bridge tonight. The gate arm lies at the bottom of the atrium with both signs on top of it, and the marker's slowly running off the cardboard into a puddle." }
          - { tr: "Sabah köprüden ilk geçen kişi yarı yolda durup çevresine bakınıyor, ardından biri onu geri çağıracakmış gibi koşmaya başlıyor. Çağıran olmuyor.", en: "In the morning, the first person across stops halfway, looks around, then breaks into a run, like somebody's going to call them back. Nobody does." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Köprünün ortasında bir süre bekle", en: "Hang around in the middle of the bridge awhile" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kimse teşekkür etmeden git", en: "Leave before anybody thanks you" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { hayatta_kalan: 2 }
              - gizle: 1
            sonraki: "@akis"

      - id: "cete_hesabi_dayak"
        paragraflar:
          - { tr: "Üç kişiler, üstelik bu kez seni bekliyorlardı. Köprünün camı sırtının altında buz gibi; bir yerlerden bilet makinesinin kahkahayı andıran takırtısı geliyor.", en: "There's three of them, and this time they were waiting for you. The glass is cold under your back, and from somewhere the ticket machine chatters like a laugh." }
          - { tr: "Gişe açık kalıyor. Ama köprüden geçen herkes artık birinin ona kafa tuttuğunu biliyor; o biri bir dahaki sefere yalnız olmayabilir.", en: "The toll stays open. But everyone crossing now knows somebody stood up to it, and next time that somebody might not be alone." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk, bu iş bitmedi", en: "Get up. This isn't over" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - stat: { wil: 1 }
              - bayrak: "cete_gisede"
            sonraki: "@akis"
          - id: "yardim"
            etiket: { tr: "Rampadaki askere git, yardım iste", en: "Go to the soldier at the dock and ask for help" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: -2, guven: 2 } }
              - bayrak: "cete_loncaya_teslim"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

  # ================================================================== ECZANE
  - id: "eczane"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 5, max: 22 }
    agirlik: 5
    etiketler: ["ahlak", "kaynak", "carsi"]
    gerilim: 2
    onemli: true
    kart: { tr: "Son ilaçlar", en: "The last of the meds" }
    sahne: "eczane_1"
    sahneler:
      - id: "eczane_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Alt katın en ucundaki eczanenin tavanı çökmüş. Kablolar sarmaşık gibi sarkıyor; aralarından biri ağır ağır nefes alıp veriyor.", en: "The pharmacy at the far end of the lower level has a caved-in ceiling. Cables hang down like vines, and one of them is slowly, heavily breathing." }
          - { tr: "Tezgâhın arkasındaki reçete dolabı sağlam kalmış. Camın ardında antibiyotik kutuları, ağrı kesiciler ve bir buz poşetinin içinde hâlâ terleyen bir avuç insülin kalemi duruyor.", en: "The prescription cabinet behind the counter is intact. Behind the glass: boxes of antibiotics, painkillers, and a cooler bag holding a handful of insulin pens, still sweating." }
          - { tr: "Çarşının başka hiçbir yerinde bu kadar ilaç kalmadı. Şu an bunu bir tek sen biliyorsun; az sonra herkes bilecek.", en: "There isn't this much medicine left anywhere else in the mall. Right now, you're the only one who knows. Pretty soon, everybody will." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Kablo yılanı yalnızca titreşime saldırır. Yerdeki camlara basmadan tezgâhın üstünden geçersen belki uyanmaz.", en: "The cable serpent only strikes at vibration. Go over the counter without stepping on the broken glass, and maybe it sleeps right through you." }
          - kosul: { stat: { int: 8 } }
            metin: { tr: "İnsülin kalemlerindeki uyarı: soğuk zincir kırılırsa kırk sekiz saat. Buz poşetleri en fazla yarın sabaha kadar dayanır.", en: "The warning on the insulin pens: once the cold chain breaks, forty-eight hours. Those ice packs will last till tomorrow morning, tops." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u dolap birkaç kişinin bir haftası. ya da tek kişinin bir ayı. matematik hep bu kadar çirkindir, ben uydurmadım.", en: "t̷hat cabinet is a week for a handful of people. or a month for one. the math is always this ugly. i didn't invent it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Amoksisilin. Sefaleksin. Tanrım, insülin.\" Sesi titriyor. \"Bunlardan tekini bile kırarsak biri ölür, haberin olsun.\"", en: "\"Amoxicillin. Cephalexin. God, insulin.\" Her voice shakes. \"We break any of that, somebody dies. Just so you know.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bunlar bize değil. Biliyorsun, değil mi? Bunlar bize değil.\"", en: "\"This stuff isn't for us. You know that, right? It's not for us.\"" }
        secenekler:
          - id: "yilan"
            etiket: { tr: "Yılanı tavandan sök", en: "Tear the serpent out of the ceiling" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["tavan"], kazan: "eczane_dolap", kaybet: "eczane_yenilgi", kac: "eczane_kacis" }
          - id: "sessiz"
            etiket: { tr: "Tezgâhın üstünden, camlara basmadan geç", en: "Go over the counter. Don't touch the glass" }
            zar: { stat: "agi", zorluk: 12, tek: true, basarisiz: "eczane_uyandi" }
            etkiler:
              - ahlak: { duzen: 1 }
              - egilim: { gizlilik: 1 }
            sonraki: "eczane_dolap"
          - id: "akim"
            tur: "gosteris"
            etiket: { tr: "Akımı kendi kablosuna geri ver; yılanı yak", en: "Feed the current back up its own wire. Fry it" }
            gerekli: { stat: { int: 14 } }
            etkiler:
              - ahlak: { duzen: 2 }
              - dikkat: 2
              - xp: 120
            sonraki: "eczane_dolap"
          - id: "hekime_haber"
            etiket: { tr: "Önce yemek katındaki hekime haber ver", en: "Tell the food court doctor first" }
            goster: { bayrak: "elif_hastanesi_bilinir" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - iliski: { elif_sari: { guven: 6, saygi: 2 } }
              - itibar: { siginak: 3 }
            sonraki: "eczane_birlikte"
          - id: "birak"
            etiket: { tr: "Bırak; bir dolap ilaç için ölmeye değmez", en: "Leave it. A cabinet of pills isn't worth dying for" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 1 }
              - bayrak: "eczane_kaybedildi"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "eczane_birlikte"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:elif_sari} on dakika sonra iki gönüllüyle çıkageliyor; önlüğünün cebinde bir el feneri, elinde bir yangın tüpü var. \"Elektrikli yaratıklar köpükten hoşlanmaz,\" diyor. \"Umarım.\"", en: "{npc:elif_sari} shows up ten minutes later with two volunteers, a flashlight in her coat pocket and a fire extinguisher in her hands. \"Electric things hate foam,\" she says. \"I hope.\"" }
          - { tr: "Köpük tavana fışkırınca yılan ciyaklayıp kıvranarak bir havalandırma boşluğuna kaçıyor. {npc:elif_sari} dolabın camını kırmıyor; menteşesini bir neşterle söküveriyor.", en: "Foam hits the ceiling and the serpent thrashes, shrieking, and bolts into an air duct. {npc:elif_sari} doesn't break the glass. She takes the cabinet hinge off with a scalpel." }
          - { tr: "Daha kutuları saymaya başlamadan \"Teşekkür ederim,\" diyor. \"Bunu tek başına alabilirdin ama almadın. Unutmayacağım.\"", en: "\"Thank you,\" she says, before she even starts counting boxes. \"You could've taken this alone, and you didn't. I won't forget that.\"" }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Hepsini birlikte koğuşa taşıyın", en: "Haul all of it to the ward together" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 6, baglilik: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:eczane", agirlik: 25 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "eczane_hastaneye"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "pay"
            etiket: { tr: "Kendine birkaç ağrı kesici iste", en: "Ask for a few painkillers for yourself" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - esya: { kucuk_iyilesme_iksiri: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "eczane_hastaneye"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"

      - id: "eczane_uyandi"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Topuğunun altında bir cam parçası çıtırdıyor. Tavandaki kablolar hep birden dikleşiyor, en kalını mavi kıvılcımlar saçarak başının üstüne iniyor.", en: "A sliver of glass crunches under your heel. Every cable in the ceiling stiffens at once, and the thickest one comes down over your head, spitting blue sparks." }
          - { tr: "Artık sessiz olmanın anlamı yok.", en: "No point being quiet now." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Dövüş", en: "Fight" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kablo_yilani"], ortam: ["tavan", "dar_gecit"], kazan: "eczane_dolap", kaybet: "eczane_yenilgi", kac: "eczane_kacis" }
          - id: "kac"
            etiket: { tr: "Tezgâhın arkasından kaç", en: "Bolt out behind the counter" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - can: -8
            sonraki: "eczane_kacis"

      - id: "eczane_dolap"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Dolabın camını dirseğinle kırıyorsun. Kutular avucunda tüy gibi; bir insan hayatının bu kadar az tartması tuhaf.", en: "You break the cabinet glass with your elbow. The boxes weigh almost nothing in your hand. Strange, how little a human life weighs." }
          - { tr: "Kapıda bir ses: on üç, on dört yaşlarında bir kız, elinde boş bir insülin kalemi. \"Annem için,\" diyor. \"Şekeri var, kalemi dün bitti.\"", en: "A voice from the doorway: a girl, thirteen or fourteen, clutching an empty insulin pen. \"It's for my mom,\" she says. \"She's diabetic, and she ran out yesterday.\"" }
          - metin: { tr: "{npc:elif_sari|in} koğuşunda en az altı kişi antibiyotik bekliyor; içlerinden birinin, dokuz yaşında bir oğlanın insüline ihtiyacı var. Bu dolap onların koca bir haftası.", en: "At least six people on {npc:elif_sari|pos} ward are waiting on antibiotics, and one of them, a nine-year-old boy, needs insulin. This cabinet is their whole week." }
            kosul: { bayrak: "elif_hastanesi_bilinir" }
          - metin: { tr: "Yemek katındaki hekimin, antibiyotik olmazsa yaraların kokmaya başladığını söylediği anlatılıyor. O kokuyu artık sen de tanıyorsun.", en: "Word is the food court doctor says wounds start to smell without antibiotics. You know that smell now too." }
            kosul: { bayrak_yok: "elif_hastanesi_bilinir" }
          - { tr: "Yukarıdan, durmuş yürüyen merdivenden ayak sesleri geliyor; ilacın kokusunu başkaları da almış.", en: "Footsteps up on the dead escalator. Somebody else has caught the scent of medicine." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kıza bir kalem ver, gerisi koğuşa. Annesine sonra ben bakarım.\"", en: "\"Give the girl one pen. The rest goes to the ward. I'll check on her mom after.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu çarşının en değerli parası artık bu. Kredi değil, bu. Not ediyorum.\"", en: "\"That's the real currency in this mall now. Not credits. That. I'm writing that down.\"" }
        secenekler:
          - id: "hastane"
            etiket: { tr: "Hepsini hekimin koğuşuna götür", en: "Take all of it to the doctor's ward" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { guven: 8, saygi: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:eczane", agirlik: 25 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "eczane_hastaneye"
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "kiz"
            etiket: { tr: "Kıza iki kalem ver, gerisini koğuşa götür", en: "Give the girl two pens. The rest goes to the ward" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "eczane_kiza"
              - bayrak: "eczane_hastaneye"
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Bir kısmını kendine ayır", en: "Skim some off the top for yourself" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - esya: { panzehir: 2, kucuk_iyilesme_iksiri: 2 }
              - itibar: { siginak: 3 }
              - hafiza: { npc: "elif_sari", id: "ilaci_sakladi", agirlik: -20 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "eczane_saklandi"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "sat"
            etiket: { tr: "Hepsini pazarcı kadına sat", en: "Sell the whole lot to the stall woman" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - kredi: 60
              - itibar: { siginak: -4 }
              - degisken: { hayatta_kalan: -3 }
              - bayrak: "eczane_satildi"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "secilmis"
            etiket: { tr: "Vaizin \"seçilmişlerine\" götür", en: "Bring it to the preacher's \"Chosen\"" }
            goster: { bayrak: "vahit_vaazi_dinlendi" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -4, duzen: 2 }
              - itibar: { yukselenler: 8, siginak: -3 }
              - iliski: { vahit: { guven: 6, saygi: 4 } }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "eczane_yukselenlere"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"

      - id: "eczane_yenilgi"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Akım seni duvara yapıştırıyor. Dişlerin kendiliğinden takırdıyor, kalbin bir an tekliyor ve her şey kararıyor.", en: "The current pins you to the wall. Your teeth chatter on their own, your heart skips a beat, and then everything goes dark." }
          - { tr: "Uyandığında dolap boşalmış. Yerde ayak izleri, kırık bir insülin kalemi ve birinin aceleyle düşürdüğü bir otopark fişi var.", en: "When you come to, the cabinet's empty. Footprints on the floor, one broken insulin pen, and a parking stub somebody dropped in a hurry." }
        secenekler:
          - id: "fis"
            etiket: { tr: "Fişi al; kimin olduğunu biliyorsun", en: "Pick up the stub. You know whose it is" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "eczane_kaybedildi"
              - bayrak: "cete_gisede"
              - degisken: { hayatta_kalan: -2 }
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "toparlan"
            etiket: { tr: "Kalkmaya çalış, yaralarına bak", en: "Try to get up. Check the damage" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - can: 10
              - bayrak: "eczane_kaybedildi"
              - degisken: { hayatta_kalan: -2 }
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "eczane_kacis"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Eczaneden yuvarlanarak çıkıyorsun; saçların hâlâ diken diken, burnunda yanık plastik kokusu. Arkanda yılan, zincir gibi dolabın çevresine sarılıyor.", en: "You tumble out of the pharmacy, hair still standing on end, the stink of burnt plastic in your nose. Behind you the serpent coils itself around the cabinet like a chain." }
          - { tr: "İlaçlar hâlâ orada, üstelik artık bir bekçileri var. Bunu da bir kenara yazmak gerek.", en: "The meds are still in there, and now they've got a guard. That's worth writing down too." }
        secenekler:
          - id: "hekime_soyle"
            etiket: { tr: "Yemek katındaki hekime yerini söyle", en: "Tell the food court doctor where it is" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "eczane_hastaneye"
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "sir"
            etiket: { tr: "Kimseye söyleme; bir gün geri dönersin", en: "Tell nobody. You'll come back someday" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -1 }
              - bayrak: "eczane_kaybedildi"
              - tohum: { olay: "eczane_bedeli", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ eczanenin bedeli (tohum)
  - id: "eczane_bedeli"
    perde: [1]
    agirlik: 1
    etiketler: ["ahlak", "kaynak", "carsi"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "İlacın bedeli", en: "What the medicine cost" }
    sahne: "eczane_bedeli_1"
    sahneler:
      - id: "eczane_bedeli_1"
        paragraflar:
          - metin: { tr: "Yemek katındaki koğuşa uğradığında bir şeylerin değiştiğini görüyorsun. Ateşler düşmüş; yatakların birinin başında ilk kez biri yüksek sesle gülüyor.", en: "When you stop by the food court ward, you can tell something's changed. The fevers broke, and for the first time somebody's laughing out loud beside one of the cots." }
            kosul: { bayrak: "eczane_hastaneye" }
          - metin: { tr: "Kapıda insülin kalemli kız bekliyor, yanında annesi: solgun ama ayakta. Kız elindeki termos çayı tek kelime etmeden sana uzatıyor.", en: "The girl with the insulin pen is waiting at the door, her mother next to her. Standing, pale, but standing. She's holding a thermos of tea, and she hands it to you without a word." }
            kosul: { bayrak: "eczane_kiza" }
          - metin: { tr: "{npc:elif_sari} seni görünce elindeki listeyi bırakıyor. \"Bir haftalık stok,\" diyor. \"Bu dünyada bir hafta sonsuzluk demek.\"", en: "{npc:elif_sari} sets down her clipboard when she sees you. \"A week of stock,\" she says. \"A week, in this world, is forever.\"" }
            kosul: { bayrak: "eczane_hastaneye" }
          - metin: { tr: "Yemek katındaki koğuşa uğradığında {npc:elif_sari} koğuşun öbür ucunda bir hastanın nabzını sayıyor. Seni görünce saymayı bitirip yanına geliyor; sesi, kötü haber veren bir hekiminki kadar sakin.", en: "When you stop by the food court ward, {npc:elif_sari} is at the far end, counting somebody's pulse. She finishes the count when she sees you, then walks over, her voice as calm as a doctor giving bad news." }
            kosul: { bayrak: "eczane_saklandi" }
          - metin: { tr: "\"Kutuları da saydım, raflardaki toz izlerini de,\" diyor. \"Payını almışsın; ben de olsam belki alırdım. Ama bana söylerdin.\"", en: "\"I counted the boxes, and the dust marks on the shelves,\" she says. \"You took a cut, and maybe I would have too. But I'd have told you.\"" }
            kosul: { bayrak: "eczane_saklandi" }
          - metin: { tr: "Çarşıdan geçerken eczanenin kutularını pazarcı kadının tezgâhında görüyorsun, üç katı fiyatına. Kuyrukta insülin kalemli kız var; bir kalem için verecek hiçbir şeyi yok.", en: "Passing through the mall, you spot the pharmacy's boxes on the stall woman's carts, at triple the price. The girl with the insulin pen is in line, with nothing to pay for one pen." }
            kosul: { bayrak: "eczane_satildi" }
          - metin: { tr: "Kız seni görüyor. Hiçbir şey söylemiyor ama kuyruktaki yerini de bırakmıyor.", en: "The girl sees you. She doesn't say a word. She just doesn't give up her place in line." }
            kosul: { bayrak: "eczane_satildi" }
          - metin: { tr: "Yolun vaizin halkasına düştüğünde seçilmişleri ağrı kesicileri kutsal ekmek gibi, yalnız seviyesi yüksek olanlara dağıtırken buluyorsun. Kenarda \"yakıt\" dedikleri insanlar yaralarını tükürükle temizliyor.", en: "When your path crosses the preacher's circle, you find the Chosen handing out painkillers like communion wafers, high levels only. Off to the side, the ones they call \"fuel\" clean their wounds with spit." }
            kosul: { bayrak: "eczane_yukselenlere" }
          - metin: { tr: "{npc:vahit} seni görünce kollarını iki yana açıyor: \"Cömert kardeşimiz!\" Seçilmişler alkışlıyor, kenardakiler alkışlamıyor.", en: "{npc:vahit} spots you and throws his arms wide. \"Our generous friend!\" The Chosen applaud; the ones off to the side don't." }
            kosul: { bayrak: "eczane_yukselenlere" }
          - metin: { tr: "Çarşıya döndüğünde cam köprüdeki gişenin tabelasına yeni bir satır eklendiğini görüyorsun: İLAÇ — 2 NÖBET. Eczanenin kutuları bariyerin arkasında, bir alışveriş arabasına istiflenmiş.", en: "Back at the mall, there's a new line on the skybridge toll sign: MEDS — 2 WATCHES. The pharmacy's boxes are stacked in a shopping cart behind the gate arm." }
            kosul: { bayrak: "eczane_kaybedildi" }
          - metin: { tr: "Gişenin önündeki kuyrukta insülin kalemli kız bekliyor. Ne verecek bir şeyi var ne de nöbet tutacak gücü.", en: "The girl with the insulin pen is waiting in the toll line. She has nothing to give, and no strength left to pull a watch." }
            kosul: { bayrak: "eczane_kaybedildi" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷onuçları sevmiyorsun. sonuçlar da seni hiç sevmedi ki. ödeştiniz say.", en: "y̷ou don't like consequences. consequences never liked you either. call it even." }
        secenekler:
          - id: "cayi_ic"
            etiket: { tr: "Çayı al, kızın annesiyle otur", en: "Take the tea. Sit with the girl's mother" }
            goster: { bayrak: "eczane_kiza" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - stat: { wis: 1 }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Bir gece koğuşta {npc:elif_sari|le} nöbet tut", en: "Pull a night shift on the ward with {npc:elif_sari}" }
            goster: { bayrak: "eczane_hastaneye" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
              - gun: 1
              - tohum: { olay: "hastane_karantina", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "@akis"
          - id: "oglan_ziyaret"
            etiket: { tr: "Koğuştaki dokuz yaşındaki oğlana uğra", en: "Stop by the nine-year-old's cot" }
            goster: { bayrak: "eczane_hastaneye" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { guven: 2 } }
              - stat: { cha: 1 }
            sonraki: "eczane_bedeli_oglan"
          - id: "tesekkuru_gec"
            etiket: { tr: "Teşekkürü bir kenara bırak; yapılacak iş var", en: "Skip the thank-yous. There's work to do" }
            goster: { bayrak: "eczane_hastaneye" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"
          - id: "geri_ver"
            etiket: { tr: "Sakladıklarını çantandan çıkarıp masaya koy", en: "Pull what you kept out of your bag. Set it down" }
            goster: { bayrak: "eczane_saklandi" }
            gerekli: { esya: { panzehir: 2 } }
            etkiler:
              - esya: { panzehir: -2 }
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { elif_sari: { guven: 10, saygi: 4 } }
              - hafiza: { npc: "elif_sari", id: "ilaci_sakladi", agirlik: -5 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "yalan"
            etiket: { tr: "\"Saymışsın, yanlış saymışsın.\"", en: "\"You counted. You counted wrong.\"" }
            goster: { bayrak: "eczane_saklandi" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "eczane_bedeli_yalan_yok", basarisiz_etkiler: [{ ahlak: { duzen: -2 } }, { iliski: { elif_sari: { guven: -14 } } }, { npc_iz: { elif_sari: "yarali_guven" } }] }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -2 }
              - iliski: { elif_sari: { guven: -3 } }
              - yalan: { npc: "elif_sari", konu: "eczane_yalani" }
            sonraki: "@akis"
          - id: "hakli"
            etiket: { tr: "\"Hayatta kalmam lazım ki onlar da kalsın.\"", en: "\"I stay alive so they stay alive. That's the math.\"" }
            goster: { bayrak: "eczane_saklandi" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - iliski: { elif_sari: { guven: -5, saygi: 3 } }
            sonraki: "@akis"
          - id: "kiza_kalem"
            etiket: { tr: "Kıza tezgâhtan bir kalem satın al", en: "Buy the girl one pen off the stall" }
            goster: { bayrak: "eczane_satildi" }
            etkiler:
              - kredi: -25
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "geri_satin"
            etiket: { tr: "Bütün kutuları geri al, koğuşa götür", en: "Buy back every box. Take it to the ward" }
            goster: { bayrak: "eczane_satildi" }
            gerekli: { stat: { cha: 12 } }
            etkiler:
              - kredi: -50
              - ahlak: { merhamet: 6, insanlik: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 4, saygi: 4 } }
              - degisken: { hayatta_kalan: 3 }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "omuz_silk"
            etiket: { tr: "Omuz silk; pazar pazardır", en: "Shrug. A market's a market" }
            goster: { bayrak: "eczane_satildi" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"
          - id: "yakita_dagit"
            etiket: { tr: "Kutuları al, \"yakıta\" dağıt", en: "Take the boxes and hand them out to the \"fuel\"" }
            goster: { bayrak: "eczane_yukselenlere" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -3 }
              - itibar: { yukselenler: -6, siginak: 3 }
              - iliski: { vahit: { guven: -8, saygi: -3 } }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "kutsama"
            etiket: { tr: "Seçilmişlerin şükranını kabul et", en: "Accept the Chosen's gratitude" }
            goster: { bayrak: "eczane_yukselenlere" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -2 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 4, baglilik: 3 } }
            sonraki: "@akis"
          - id: "yaralara_bak"
            etiket: { tr: "Kenardaki \"yakıtların\" yaralarına kendin bak", en: "Tend the \"fuel\" people's wounds yourself" }
            goster: { bayrak: "eczane_yukselenlere" }
            gerekli: { stat: { wis: 8 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { yukselenler: -2, siginak: 2 }
              - iliski: { vahit: { saygi: -2 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "fisi_goster"
            etiket: { tr: "Gişeye yürü, ilaçları geri iste", en: "Walk up to the toll and take the meds back" }
            goster: { bayrak: "eczane_kaybedildi" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - savas: { dusmanlar: ["cop_avcisi", "cop_avcisi"], ortam: ["dar_gecit"], kazan: "eczane_bedeli_geri", kaybet: "eczane_bedeli_kayip", kac: "eczane_bedeli_kayip" }
          - id: "kaya_soyle"
            etiket: { tr: "Rampadaki askere hırsızlığı haber ver", en: "Report the stolen meds to the soldier at the dock" }
            goster: { bayrak: "eczane_kaybedildi" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 3, saygi: 2 } }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "kabullen"
            etiket: { tr: "Kaybettiğini kabul et, yürü", en: "Accept that you lost this one. Walk on" }
            goster: { bayrak: "eczane_kaybedildi" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

      - id: "eczane_bedeli_yalan_yok"
        paragraflar:
          - { tr: "{npc:elif_sari} gözünü senden ayırmıyor. \"Acil serviste on iki yıl yalan dinledim,\" diyor. \"Seninki iyilerinden bile değil.\"", en: "{npc:elif_sari} doesn't take her eyes off you. \"Twelve years in the ER, I've heard a lot of lies,\" she says. \"Yours isn't even one of the good ones.\"" }
          - { tr: "Arkasını dönüp listesine eğiliyor. O günden sonra kutuları sayarken seni de sayıyor.", en: "She turns back to her clipboard. From that day on, when she counts the boxes, she counts you too." }
        secenekler:
          - id: "git"
            etiket: { tr: "Bir şey söyleme, git", en: "Say nothing and leave" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile; yalan söylediğini kabul et", en: "Apologize. Admit you lied" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "@akis"

      - id: "eczane_bedeli_oglan"
        paragraflar:
          - { tr: "Oğlan yatağında doğrulmuş, bir kartonun üstüne kalemle bir şeyler çiziyor. Koluna yapıştırılmış bantta başka bir hayattan kalma bir çizgi film kahramanı var.", en: "The kid's sitting up on his cot, drawing something on a piece of cardboard. The tape on his arm has a cartoon character on it, left over from some other life." }
          - { tr: "\"Hekim abla, biri eczaneye gitti dedi,\" diyor. \"Sen miydin?\" Cevabını beklemeden çizdiğini gösteriyor: bir kılıç, bir de kocaman, mavi bir pencere.", en: "\"The doctor said somebody went to the pharmacy,\" he says. \"Was it you?\" He doesn't wait for an answer, just holds up the drawing: a sword and a huge blue window." }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Bendim. Bir dahakine sen de gelirsin.\"", en: "\"Yeah, me. Next time you can come along.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "hekim"
            etiket: { tr: "\"Ben yalnızca taşıdım. Seni hekim kurtardı.\"", en: "\"I just carried it. The doctor saved you.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 3, baglilik: 2 } }
            sonraki: "@akis"

      - id: "eczane_bedeli_geri"
        paragraflar:
          - { tr: "Alışveriş arabasını köprünün ortasından kendin itip getiriyorsun; tekerleklerden biri gıcırdıyor, kutular her sarsıntıda tıkırdıyor.", en: "You push the shopping cart off the skybridge yourself. One wheel squeals, and the boxes rattle with every bump." }
          - { tr: "Yemek katına vardığında koğuşun ışığı hâlâ yanıyor. İlaçların nereden geldiğini soran olmuyor; sormalarına gerek de yok.", en: "When you reach the food court, the ward light's still on. Nobody asks where the meds came from. Nobody has to." }
        secenekler:
          - id: "teslim"
            etiket: { tr: "Arabayı hekimin masasının yanına bırak", en: "Park the cart next to the doctor's desk" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 5 } }
              - degisken: { hayatta_kalan: 3 }
              - tehlike: { harabe_carsi: -2 }
            sonraki: "@akis"
          - id: "kiz"
            etiket: { tr: "Önce insülin kalemli kızı bul", en: "Find the girl with the insulin pen first" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
            sonraki: "@akis"

      - id: "eczane_bedeli_kayip"
        paragraflar:
          - { tr: "Gişeciler bu kez hazırlıklıydı. Seni köprünün başına kadar sürükleyip orada bırakıyorlar; bir uyarı olsun diye.", en: "The toll crew was ready for you this time. They drag you to the end of the bridge and leave you there. A warning." }
          - { tr: "Arabadaki kutular yerinden kıpırdamıyor. Ertesi sabah tabeladaki fiyat iki katına çıkıyor.", en: "The boxes stay right where they are in the cart. The next morning, the price on the sign doubles." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk, bunu bir kenara yaz", en: "Get up and write this one down" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - bayrak: "cete_gisede"
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Hekime git, olanları anlat", en: "Go to the doctor and tell her what happened" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

  # ================================================================== KAYIP EŞYA OFİSİ
  - id: "kayip_esya_ofisi"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 6, max: 28 }
    agirlik: 4
    etiketler: ["gizem", "ahlak", "carsi"]
    gerilim: 2
    onemli: true
    kart: { tr: "Kayıp Eşya", en: "Lost & Found" }
    sahne: "kayip_esya_ofisi_1"
    sahneler:
      - id: "kayip_esya_ofisi_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Danışma bankosunun arkasındaki küçük odanın kapısında KAYIP EŞYA yazıyor. Raflar ağzına kadar dolu; Entegrasyon'dan önce bu kadar dolu olduklarını hiç sanmıyorsun.", en: "The little room behind the Guest Services desk says LOST & FOUND on the door. The shelves are packed solid. You're pretty sure they weren't this full before Integration." }
          - { tr: "Her eşyaya bir etiket iliştirilmiş: bir cüzdana, bir çocuk montuna, bir nişan yüzüğüne, bir avcı bıçağına. Her etikette bir isim, bir gün ve tek bir kelime var: ALINAMADI.", en: "There's a tag tied to every item: a wallet, a kid's winter coat, an engagement ring, a hunting knife. Each tag has a name, a day, and one word: UNCLAIMED." }
          - { tr: "Bazılarının üstünde sahiplerinin Durum pencereleri hâlâ asılı duruyor, sönük ve gri. Sistem ölenlerin eşyalarını buraya bırakıyor; pencereyi kapatmaya üşenmiş gibi.", en: "Some still have their owners' Status windows hanging over them, dim and gray. When somebody dies, the System drops their stuff off here. Like it couldn't be bothered to close the window." }
          - { tr: "Kapıda dikilen kadın içeri girmeye bir türlü cesaret edemiyor. \"Oğlumun sırt çantası; mavi, üstünde dinozor var,\" diyor. \"Burada olabilir diyorlar ama benim bakmaya gücüm yok.\"", en: "There's a woman at the door who can't make herself come in. \"My son's backpack, blue, with a dinosaur on it,\" she says. \"They said it might be in here, but I can't look.\"" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "En arka rafın gerisinde, duvara yaslanmış bir defter duruyor. Sayfaları kendi kendine yazılıyor.", en: "Behind the back shelf, propped against the wall, there's a ledger. Its pages are writing themselves." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷urası bir arşiv. arşiv, unutmamak için tutulur. peki kim neyi unutmamak istiyor?", en: "t̷his is an archive. you keep archives so you don't forget. so who's trying not to forget what?" }
        secenekler:
          - id: "canta"
            etiket: { tr: "Kadının oğlunun çantasını bul", en: "Find the woman's son's backpack" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
            sonraki: "kayip_esya_canta"
          - id: "defter"
            etiket: { tr: "Rafın arkasındaki defteri aç", en: "Open the ledger behind the shelf" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "hasat_kotasi"
            sonraki: "kayip_esya_defter"
          - id: "yagma"
            etiket: { tr: "Ölülerin artık işine yaramaz; topla", en: "The dead don't need it anymore. Clean it out" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -3 }
              - kredi: 35
              - esya: { kucuk_iyilesme_iksiri: 1, ates_sisesi: 1 }
              - bayrak: "kayip_esya_yagmalandi"
            sonraki: "kayip_esya_musteri"
          - id: "kapat"
            etiket: { tr: "Pencereleri tek tek kapat", en: "Close the windows, one by one" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - xp: 40
              - gun: 1
            sonraki: "kayip_esya_kapat"

      - id: "kayip_esya_canta"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Mavi çanta üçüncü rafta, bir kaskla bir bebek arabasının arasında. Dinozorun bir gözü sökülmüş; biri onu bir zamanlar çok sevmiş.", en: "The blue backpack is on the third shelf, between a bike helmet and a stroller. The dinosaur's missing an eye. Somebody loved it hard, once." }
          - { tr: "Etikette çocuğun adı yazıyor. Altında: GÜN 3 — ALINAMADI.", en: "The tag has the boy's name on it. Underneath: DAY 3 — UNCLAIMED." }
          - { tr: "Kapıdaki kadın yüzüne bakıp cevabı orada okuyor, sen daha ağzını açmadan.", en: "The woman at the door is looking at your face, and she reads the answer there before you even open your mouth." }
        secenekler:
          - id: "ver"
            etiket: { tr: "Çantayı ona ver, yanında kal", en: "Hand her the backpack and stay with her" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 3 }
              - itibar: { siginak: 3 }
              - stat: { wis: 1 }
            sonraki: "@akis"
          - id: "etiketi_kopar"
            etiket: { tr: "Etiketi kopar; çantayı \"düşürmüş\" de", en: "Tear off the tag. Say he must have dropped it" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "kayip_esya_etiket_yok", basarisiz_etkiler: [{ ahlak: { insanlik: -2 } }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - bayrak: "kayip_umut_yalani"
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Onu yemek katındaki hekime götür", en: "Walk her to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "kayip_esya_etiket_yok"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Etiketi koparırken kadın bileğini yakalıyor. \"Yapma,\" diyor. \"Görmem lazım.\"", en: "As you tear at the tag, she catches your wrist. \"Don't,\" she says. \"I need to see it.\"" }
          - { tr: "Etiketi elinden alıp okuyor, sonra çantayı göğsüne bastırıyor. Ağlamıyor; kapının eşiğinde uzun süre öylece dikilip kalıyor.", en: "She takes the tag from you and reads it, then presses the backpack to her chest. She doesn't cry. She just stands there in the doorway for a long time." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Yanında kal", en: "Stay with her" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Onu yemek katındaki hekime götür", en: "Walk her to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 2 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "kayip_esya_defter"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Defterin kapağında tek bir satır var: ÖĞRETİCİ KATMAN · HEDEF KALIŞ ORANI: %50. Sayfalar isimlerle dolu; sen okurken mürekkepsiz, kendiliğinden yeni bir isim beliriyor.", en: "The cover has one line on it: TUTORIAL LAYER · TARGET RETENTION: 50%. The pages are full of names, and while you're reading, a new one writes itself in. No ink." }
          - { tr: "Sistem kaç kişinin öleceğini biliyordu. Daha doğrusu, kaç kişinin ölmesini istediğini.", en: "The System knew how many people would die. Or rather, how many it wanted to." }
          - { tr: "Son sayfada, boş bir etiketin yanında senin adın var. Durum: [OKUNAMADI]. Etiket: AYRILDI.", en: "Your name's on the last page, next to a blank tag. Status: [UNREADABLE]. Tag: RESERVED." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ etiketi ben bozdum. rica ederim. ama sana bir yer ayırmışlar, fark ettin mi? sana bir yer ayırmışlar.", en: "i̷ scrambled that tag. you're welcome. but they saved you a spot. did you notice? they saved you a spot." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir log. Sunucu logu bu. Ver onu bana. Lütfen. Lütfen ver.\"", en: "\"That's a log. That's a server log. Give it to me. Please. Please give it to me.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşimin adına bak. Lütfen. Yalnızca bak.\"", en: "\"Look for my sister's name. Please. Just look.\"" }
        secenekler:
          - id: "merte"
            etiket: { tr: "Defteri istasyondaki radyocuya götür", en: "Take the ledger to the radio guy at the station" }
            goster: { bayrak: "mert_istasyonu_bilinir" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { saygi: 8, guven: 5 } }
              - hafiza: { npc: "mert_kilic", id: "olay:kayip_esya_ofisi", agirlik: 30 }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "vahite"
            etiket: { tr: "Defteri havuz başındaki vaize götür", en: "Take the ledger to the preacher at the fountain" }
            goster: { bayrak: "vahit_vaazi_dinlendi" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { yukselenler: 8 }
              - iliski: { vahit: { saygi: 8, baglilik: 4 } }
              - hafiza: { npc: "vahit", id: "olay:kayip_esya_ofisi", agirlik: 25 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "sayfayi_yirt"
            tur: "gizle"
            etiket: { tr: "Kendi sayfanı yırt, yak", en: "Tear out your page and burn it" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -3 }
              - bayrak: "kayip_etiket_yakildi"
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Defteri çantana koy; kimseye gösterme", en: "Put the ledger in your bag. Show nobody" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - bilgi: "ayrilmis_etiket"
              - tohum: { olay: "zindan_kasa", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"

      - id: "kayip_esya_musteri"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Ceplerin dolarken arkandan bir tekerlek gıcırtısı geliyor. Kapıda bir soluk müşteri dikiliyor: ölü, gri, alışveriş arabası etiketli eşyalarla dolu.", en: "Your pockets are filling up when a wheel squeaks behind you. A pale shopper stands in the doorway, dead and gray, its cart piled with tagged belongings." }
          - { tr: "Bir eşya getirmiş. Önce elindekine, sonra seninkine bakıyor; Sistem'in kuryesi raflarının boşaltıldığını görüyor.", en: "It's here to drop something off. It looks at what's in its hands, then at what's in yours. The System's courier, watching somebody empty its shelves." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kuryeyi durdur", en: "Stop the courier" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["soluk_musteri"], ortam: ["dar_gecit"], kazan: "kayip_esya_zafer", kaybet: "kayip_esya_yenilgi", kac: "kayip_esya_kacis" }
          - id: "birak"
            etiket: { tr: "Aldıklarını rafa geri koy", en: "Put back what you took" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - kredi: -35
              - bayrak_kaldir: "kayip_esya_yagmalandi"
            sonraki: "@akis"

      - id: "kayip_esya_zafer"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kurye arabasının üstüne devriliyor, taşıdığı eşyalar yere saçılıyor: bir kol saati, bir diş teli kutusu, bir manyetik kart.", en: "The courier collapses over its cart. What it was carrying spills across the floor: a wristwatch, a retainer case, and a magnetic key card." }
          - { tr: "Kartın etiketinde bir isim ve bir unvan yazıyor: Banka Şubesi Müdürü. ALINAMADI.", en: "The tag on the card has a name and a job title: Bank Branch Manager. UNCLAIMED." }
        secenekler:
          - id: "kart"
            etiket: { tr: "Kartı al; banka bodrumda", en: "Take the card. The bank's in the basement" }
            etkiler:
              - ahlak: { duzen: -1 }
              - tohum: { olay: "zindan_kasa", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "rafa"
            etiket: { tr: "Kuryenin getirdiklerini raflara diz", en: "Shelve what the courier brought" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
            sonraki: "@akis"

      - id: "kayip_esya_yenilgi"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Soğuk, gri eller ceplerini boşaltıyor; aldığın her şeyi, üstüne bir de sana ait bir şeyi. Kurye seni kapıya kadar sürükleyip orada bırakıyor.", en: "Cold gray hands empty your pockets: everything you took, plus one thing that was yours. The courier drags you to the door and leaves you there." }
          - { tr: "Raflardan birinde yeni bir etiket sallanıyor; üstünde senin adın ve kaybettiğin şey yazıyor.", en: "There's a new tag swinging on one of the shelves. It's got your name on it, and the thing you lost." }
        secenekler:
          - id: "ders"
            etiket: { tr: "Kalk. Ders alındı", en: "Get up. Lesson learned" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - kredi: -40
              - bayrak_kaldir: "kayip_esya_yagmalandi"
            sonraki: "@akis"
          - id: "etiket"
            etiket: { tr: "Kendi etiketini rafta bırak", en: "Leave your own tag on the shelf" }
            etkiler:
              - ahlak: { duzen: 2 }
              - kredi: -40
              - bayrak_kaldir: "kayip_esya_yagmalandi"
            sonraki: "@akis"

      - id: "kayip_esya_kacis"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Rafların arasından kaçıyorsun ama kurye peşine düşmüyor. Dönüp baktığında boşalttığın rafları sabırla, tek tek yeniden doldurduğunu görüyorsun.", en: "You bolt between the shelves. The courier doesn't chase you. When you look back, it's patiently restocking every shelf you emptied." }
          - { tr: "Ceplerin dolu ama için, nedense, bomboş.", en: "Your pockets are full. The rest of you, weirdly, isn't." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ganimeti say, devam et", en: "Count the haul and keep going" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"
          - id: "bagisla"
            etiket: { tr: "Kredilerin yarısını gişedeki kuyruğa dağıt", en: "Hand half the credits out to the toll line" }
            etkiler:
              - kredi: -15
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"

      - id: "kayip_esya_kapat"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Pencerelere tek tek dokunup hepsini kapatıyorsun. Bazıları direniyor. Birinin son satırı bir alışveriş listesi, ötekininki yarım kalmış bir mesaj: \"Akşama geliyorum, makar—\"", en: "You touch each window and close it. Some of them fight you. One's last line is a grocery list. Another one is half a text: \"Home for dinner, I'll bring the—\"" }
          - { tr: "Yüzüncüsünde parmakların uyuşmuş. İki yüzüncüsüne gelince kapıdaki kadın içeri girip sessizce sana yardım etmeye başlıyor.", en: "By the hundredth one your fingers are numb. Around the two hundredth, the woman from the door steps inside and quietly starts helping." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu neden yaptığını sistem anlamayacak. ben de anlamıyorum. ama kaydettim.", en: "t̷he system won't understand why you did that. i don't either. but i logged it." }
        secenekler:
          - id: "son"
            etiket: { tr: "Sonuncusunu kapattığında kadının elini tut", en: "When the last one's closed, hold her hand" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - itibar: { siginak: 3 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "defter_ara"
            etiket: { tr: "Pencerelerin altındaki defteri bul", en: "Find the ledger the windows were hiding" }
            gerekli: { stat: { per: 7 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "hasat_kotasi"
            sonraki: "kayip_esya_defter"

  # ================================================================== SON TREN
  - id: "son_tren"
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 7, max: 25 }
    agirlik: 4
    etiketler: ["gizem", "kurtarma", "istasyon"]
    gerilim: 3
    onemli: true
    kart: { tr: "Hâlâ işleyen vagon", en: "The car that still runs" }
    sahne: "son_tren_1"
    sahneler:
      - id: "son_tren_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Kırık İstasyon'un üçüncü peronunda raylar uğuldamaya başlıyor. Derken tünelin karanlığından farları sönük, içi aydınlık, camları buğulanmış tek bir vagon süzülüp geliyor.", en: "The rails on the Broken Station's third platform start to hum. Then a single subway car glides out of the tunnel, headlights dark, lit up inside, its windows fogged." }
          - { tr: "Kapılar açılıyor. Hoparlörde bir kadın, Entegrasyon'dan önceki o bıkkın sesiyle anons ediyor: \"Sonraki durak: {yer:kiyikent_iskele|tam}. Kapılar kapanıyor, lütfen kapıdan uzak durunuz.\"", en: "The doors slide open. A woman's voice comes over the speaker in that bored, pre-Integration tone: \"Next stop: {yer:kiyikent_iskele|tam}. Stand clear of the closing doors, please.\"" }
          - { tr: "İçeride on bir kişi oturuyor: takım elbiseli bir adam, okul formalı iki çocuk, örgü ören yaşlı bir kadın... Sana yeni binmiş bir yolcuya bakar gibi bakıyorlar: önce hafif bir merak, ardından kayıtsızlık.", en: "Eleven people are sitting inside: a man in a suit, two kids in school uniforms, an old woman knitting. They look at you the way you look at somebody who just got on. A flicker of interest, then nothing." }
          - { tr: "Kapılar kapanınca vagon çıt çıkarmadan tünele geri dönüyor. Peron duvarına çentikler atılmış; biri günlerdir saymış: kırk dakikada bir.", en: "The doors close and the car slides back into the tunnel without a sound. The tally marks scratched into the platform wall say somebody's been counting for days: once every forty minutes." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Çentiklerin yanına küçük sayılar kazınmış: 19, 16, 14, 11. Vagon her dönüşünde biraz daha boşalıyor, içindekilerse bunun farkında bile değil.", en: "There are little numbers scratched next to the tallies: 19, 16, 14, 11. Every time the car comes back there are fewer people on it, and nobody on board notices." }
          - kosul: { stat: { int: 9 } }
            metin: { tr: "Anonsun iki cümlesinin arasına, insan kulağının seçemeyeceği kadar kısa bir sinyal sıkışmış. Biri kaydedebilse belki bir anlam çıkarırdı.", en: "Between the two sentences of the announcement there's a burst of signal, too short for a human ear. If somebody recorded it, it might turn out to be something." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ vagon eve gitmiyor; hiçbir şey eve gitmiyor. ama binmek istiyorsun, değil mi? bir evim olsaydı ben de isterdim.", en: "t̷hat car isn't going home. nothing's going home. but you want to get on anyway, don't you? i would too. if i had a home." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İskele mi... Sence gerçekten—? Yok, olamaz. Değil mi? Hayır de bana.\"", en: "\"The ferry terminal... You think it actually—? No. No, right? Tell me no.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"O anonsu kaydetmem lazım. Bir sonraki turda. Bir de... lütfen o şeye yaklaşma. Lütfen.\"", en: "\"I need to record that announcement. Next loop. And please don't get anywhere near that thing. Please.\"" }
        secenekler:
          - id: "bin"
            etiket: { tr: "Bir sonraki turda vagona bin", en: "Board the car on its next loop" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
            sonraki: "son_tren_icinde"
          - id: "uyar"
            etiket: { tr: "Kapılar açılınca yolculara gerçeği haykır", en: "When the doors open, shout the truth at them" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "son_tren_inanmadilar" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "tren_bosaltildi"
            sonraki: "son_tren_inenler"
          - id: "sabitle"
            tur: "gosteris"
            etiket: { tr: "Vagonu çıplak ellerinle perona çivile", en: "Pin the car to the platform with your bare hands" }
            gerekli: { stat: { str: 17 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - dikkat: 4
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "tren_bosaltildi"
              - efsane: "tek_basina_suru"
            sonraki: "son_tren_durdu"
          - id: "kaydet"
            etiket: { tr: "Anonsu kaydedip istasyondaki radyocuya götür", en: "Record the announcement. Bring it to the radio guy" }
            goster: { bayrak: "mert_istasyonu_bilinir" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { saygi: 5, guven: 3 } }
              - bilgi: "tren_dongusu"
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bırak gitsin; umut da bir şeydir", en: "Let it go. Hope's something, at least" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"

      - id: "son_tren_icinde"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Vagonun içi sıcacık, kahve kokuyor. Ayakta duran yok; tek bir koltuk boş ve sen oturana dek bütün gözler senin üstünde.", en: "It's warm inside the car and it smells like coffee. Nobody's standing. There's exactly one empty seat, and everybody watches you until you take it." }
          - { tr: "Takım elbiseli adam gazetesini indiriyor. \"Uzun yolculuk ama insan sonunda evine varıyor,\" diyor. \"Her turda birimiz iner; sıra herkese gelir.\"", en: "The man in the suit lowers his newspaper. \"Long ride, but it gets you home in the end,\" he says. \"One of us gets off every loop, and everybody gets a turn.\"" }
          - { tr: "Vagon tünele dalıyor. Pencerelerin ardında karanlık yok, mavi bir ışık akıp gidiyor: bir kapının içinden tanıdığın o ıslak mavi.", en: "The car dives into the tunnel. There's no dark outside the windows. Blue light streams past instead, that familiar wet blue from the inside of a Gate." }
          - { tr: "Tünelin ortasında vagon yavaşlıyor. Örgü ören kadın örgüsünü katlayıp ayağa kalkıyor, gülümseyerek kapıya yürüyor.", en: "Halfway down the tunnel, the car slows. The old woman folds up her knitting, gets to her feet, and walks to the door. Smiling." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Kadının Durum penceresi titreşiyor. En altta, solgun harflerle: [Katkı: hazır].", en: "Her Status window is flickering. At the very bottom, in faded letters: [Contribution: ready]." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u tren falan değil, boru hattı. kalk. hemen şimdi kalk.", en: "t̷his isn't a train. it's a pipeline. get up. get up now." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Kadını kolundan yakala; inmesine izin verme", en: "Grab her arm. Don't let her get off" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - savas: { dusmanlar: ["yarik_sulugu", "yarik_sulugu"], ortam: ["karanlik", "dar_gecit"], kazan: "son_tren_sonu", kaybet: "son_tren_dusus", kac: "son_tren_dusus" }
          - id: "izle"
            etiket: { tr: "Kapının ardında ne olduğunu izle", en: "Watch what's waiting past the door" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -2 }
              - bilgi: "tren_dongusu"
            sonraki: "son_tren_gordun"
          - id: "in"
            etiket: { tr: "Bir sonraki peronda in ve arkana bakma", en: "Get off at the next platform. Don't look back" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -1 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

      - id: "son_tren_gordun"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Kapı açılıyor, ardında ray yok: bir kapının iç duvarı gibi parlayıp titreşen bir zar var yalnızca. Kadın içine adım atar atmaz sökülen bir örgü gibi iplik iplik çözülüyor.", en: "The door opens and there's no track past it. Just a bright, shivering membrane, like the inner wall of a Gate. The old woman steps into it and comes apart thread by thread, like somebody unraveling a sweater." }
          - { tr: "Penceresi bir an havada asılı kalıyor: [Katkı alındı. Teşekkür ederiz.] Ardından o da siliniyor, kapılar kapanıyor.", en: "For a second her window hangs in the air: [Contribution received. Thank you.] Then that's gone too, and the doors close." }
          - { tr: "Vagondakiler başlarını bile kaldırmıyor. Takım elbiseli adam gazetesinin sayfasını çeviriyor.", en: "Nobody on the car even looks up. The man in the suit turns the page." }
        secenekler:
          - id: "fren"
            etiket: { tr: "Acil fren kolunu yerinden söküp çek", en: "Rip down the emergency brake and pull" }
            zar: { stat: "str", zorluk: 12, tek: true, basarisiz: "son_tren_dusus", basarisiz_etkiler: [{ can: -12 }] }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "tren_bosaltildi"
            sonraki: "son_tren_durdu"
          - id: "kapida_dur"
            etiket: { tr: "Kapının önüne dikil; kimse inmesin", en: "Plant yourself in front of the door. Nobody gets off" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - savas: { dusmanlar: ["yarik_sulugu", "yarik_sulugu"], ortam: ["karanlik", "dar_gecit"], kazan: "son_tren_sonu", kaybet: "son_tren_dusus", kac: "son_tren_dusus" }
          - id: "sessizce_in"
            etiket: { tr: "Perona gelince sessizce in; bu senin trenin değil", en: "Slip off at the platform. This isn't your train" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"

      - id: "son_tren_sonu"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Son sülük kapının zarına geri çekilirken vagon sarsılıyor ve ilk kez tünelin ortasında ölü gibi duruyor. Işıklar sönüyor, mavi zar da onlarla birlikte.", en: "As the last leech slides back into the membrane, the car lurches and, for the first time, stops dead in the middle of the tunnel. The lights go out. So does the blue." }
          - { tr: "Karanlıkta yolcular ilk kez bir şey hissediyor: korku. Artık kapıya yürüyen yok; takım elbiseli adamın gazetesi elinden düşüyor, okul formalı çocuklardan biri ağlamaya başlıyor.", en: "In the dark, the passengers finally feel something: fear. Nobody's walking toward the door now. The man in the suit drops his paper, and one of the kids in the school uniforms starts to cry." }
          - { tr: "Peron yarım mil geride kaldı. El ele, rayların üstünden yürümek gerekecek; üstelik tünelin duvarlarında hâlâ bir şeyler kıpırdıyor.", en: "The platform's half a mile back. You'll have to walk the rails, hand in hand, and there's still something moving in the tunnel walls." }
        secenekler:
          - id: "yurut"
            etiket: { tr: "Onları el ele rayların üstünden yürüt", en: "Walk them back down the rails, hand in hand" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "tren_bosaltildi"
              - xp: 150
            sonraki: "son_tren_durdu"
          - id: "duvar"
            etiket: { tr: "Önce duvardaki kıpırtının kaynağına bak", en: "Check what's moving in the walls first" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "tren_bosaltildi"
              - tohum: { olay: "zindan_metro", gecikme: { min: 1, max: 3 } }
            sonraki: "son_tren_durdu"

      - id: "son_tren_durdu"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Yolcular uzun bir uykudan uyanmış gibi perona dökülüyor. Biri kendi adını hatırlamaya uğraşıyor; bir başkası Entegrasyon'un üstünden kaç gün geçtiğini soruyor, cevabı duyunca olduğu yere çöküveriyor.", en: "The passengers spill out onto the platform like they're waking up from a long sleep. One of them is trying to remember her own name. Another asks how many days it's been since Integration, hears the answer, and sits down hard." }
          - { tr: "Takım elbiseli adam inmiyor. Kapının eşiğinde durmuş sana bakıyor; gözlerinde öfke değil, yas var. \"Eve gidiyordum,\" diyor, \"sıram gelmek üzereydi.\"", en: "The man in the suit won't get off; he stands in the doorway looking at you, and it isn't anger in his eyes, it's grief. \"I was going home,\" he says, \"and it was almost my turn.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷nu zorla indirebilirsin, ya da bırakırsın gitsin. ikisi de bir çeşit merhamet; hangisi, sen söyle.", en: "y̷ou could drag him off. or let him go. both of those are mercy, in a way. you tell me which." }
        secenekler:
          - id: "surukle"
            etiket: { tr: "Onu yakasından tutup perona çek", en: "Grab him by the collar and haul him off" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - stat: { str: 1 }
            sonraki: "son_tren_veda"
          - id: "ikna"
            etiket: { tr: "Ona eve gerçekten nasıl gidildiğini anlat", en: "Tell him how people really get home" }
            gerekli: { stat: { cha: 9 } }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "son_tren_veda"
          - id: "birak"
            etiket: { tr: "Kapıdan çekil; seçim onun", en: "Step back from the door. His call" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1, merhamet: -1 }
            sonraki: "son_tren_veda"

      - id: "son_tren_veda"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Vagon bir daha gelmiyor; ya da geliyor da artık onu bekleyen kimse yok. Biri peron duvarındaki çentiklerin yanına tebeşirle yeni bir sayı yazıyor: 0.", en: "The car doesn't come back. Or maybe it does, but nobody's waiting for it anymore. Next to the tally marks on the platform wall, somebody chalks a new number: 0." }
          - { tr: "Kurtardığın yolculardan okul formalı bir kız yanına geliyor. \"Hekimin hastanesini biliyor musun?\" diye soruyor. \"Annem orada olabilir.\"", en: "One of the passengers you pulled out, a girl in a school uniform, comes up to you. \"Do you know where the doctor's hospital is?\" she asks. \"My mom might be there.\"" }
        secenekler:
          - id: "hekime"
            etiket: { tr: "Yolcuları yemek katındaki hekime götür", en: "Take the passengers to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "radyocu"
            etiket: { tr: "Kontrol odasındaki radyoculara sor; kayıt tutuyorlar", en: "Ask the radio crew in the control room. They keep logs" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - itibar: { sessiz_ag: 3 }
              - iliski: { mert_kilic: { guven: 3 } }
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "yol_goster"
            etiket: { tr: "Yolu göster, sonra kendi işine dön", en: "Point the way and get back to your own business" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "son_tren_inenler"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Sesin peronun tavanında yankılanıyor. Okul formalı iki çocuk birbirine bakıp ayağa fırlıyor, kapıdan dışarı atlıyor; örgü ören kadın da ağır ağır peşlerinden iniyor.", en: "Your voice bounces off the platform ceiling. The two kids in uniforms look at each other, then jump up and bolt out the door. The old woman with the knitting follows them, slowly." }
          - { tr: "Ardından altı kişi daha iniyor. Kapılar kapanmadan içeride kalan iki kişiden biri, takım elbiseli adam, sana elini kaldırıyor; hem veda eder gibi hem özür diler gibi.", en: "Six more get off. Before the doors close, one of the two still aboard, the man in the suit, raises his hand to you, like a goodbye, like an apology." }
        secenekler:
          - id: "atla"
            etiket: { tr: "Kapanan kapılardan içeri atla, son ikisini al", en: "Dive through the closing doors. Get the last two" }
            gerekli: { stat: { agi: 9 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "son_tren_icinde"
          - id: "yeter"
            etiket: { tr: "Dokuz kişi. Bugünlük yeter", en: "Nine people. That's enough for today" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            sonraki: "son_tren_veda"

      - id: "son_tren_inanmadilar"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Bağırıyorsun ama yolcular sana, metroda kendi kendine konuşan birine bakar gibi bakıyor. Okul formalı çocuklardan biri kıkırdıyor, annesi onu susturuyor.", en: "You yell. The passengers look at you like you're the guy talking to himself on the subway. One of the kids in uniform giggles, and his mother shushes him." }
          - { tr: "Kapılar kapanıyor. Birinin eli peron duvarına yeni bir çentik atıyor.", en: "The doors close. Somebody's hand adds a new mark to the tally on the wall." }
        secenekler:
          - id: "bin"
            etiket: { tr: "Bir sonraki turda vagona kendin bin", en: "Board the car yourself next loop" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "son_tren_icinde"
          - id: "vazgec"
            etiket: { tr: "Vazgeç; inanmayanı kurtaramazsın", en: "Give up. You can't save people who won't listen" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 1 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"

      - id: "son_tren_dusus"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Bir şey seni vagonun kapısından dışarı fırlatıyor. Sırtüstü raylara çakılınca ciğerlerindeki bütün hava bir anda boşalıveriyor.", en: "Something launches you out the car door. You hit the rails flat on your back and every bit of air leaves your lungs at once." }
          - { tr: "Işıkları yanan vagon sakin sakin uzaklaşıyor. Camların ardında yolcular kitaplarını okumayı, örgülerini örmeyi sürdürüyor; bir koltuk daha boşalmış.", en: "The car glides away, lights on, calm as anything. Behind the glass the passengers go right on reading, knitting. One more seat is empty." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve perona yürü", en: "Get up and walk back to the platform" }
            etkiler:
              - ahlak: { duzen: 1 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "Duvara bir çentik at: bu daha bitmedi", en: "Scratch a mark in the wall. This isn't over" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - stat: { wil: 1 }
              - degisken: { hayatta_kalan: -2 }
              - tohum: { olay: "zindan_metro", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

  # ================================================================== SU BASKINI
  - id: "su_baskini"
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 10, max: 26 }
    agirlik: 5
    etiketler: ["kurtarma", "ahlak", "istasyon"]
    gerilim: 4
    onemli: true
    kart: { tr: "Suyun altındaki tünel", en: "The tunnel under the water" }
    sahne: "su_baskini_1"
    sahneler:
      - id: "su_baskini_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "İstasyonun alt katındaki bakım tünelinden su sesi geliyor; damla damla değil, nehir gibi. Merdivenin son basamakları çoktan gözden kaybolmuş, kahverengi su her dakika bir basamak daha yutuyor.", en: "There's water coming from the maintenance tunnel under the station, and not a drip: a river. The bottom steps are already gone, and the brown water swallows another one every minute." }
          - { tr: "Tünelin ucundaki bakım platformunda altı kişi mahsur: bir anne ile iki çocuğu, birbirine sarılmış iki genç, bir de kolunda turuncu bant, bacağı kırık bir avcı. Aralarındaki suda kol boyu mavi sülükler kıvrılıp duruyor.", en: "Six people are stranded on the maintenance platform at the end of the tunnel: a mother and her two kids, two teenagers clinging to each other, and a hunter with a broken leg and an orange-taped armband. Arm-length blue leeches are twisting through the water between them." }
          - metin: { tr: "Arkadan ağır bot sesleri geliyor. {npc:kaya_demir} iki adamıyla merdivende dikilmiş, tüfeğini omzundan indirmeden konuşuyor: \"Bacağı kırık olan benim adamım. Önce o çıkacak.\"", en: "Heavy boots behind you. {npc:kaya_demir} stands on the stairs with two of his people, rifle still on his shoulder. \"The one with the busted leg is mine, and he comes out first.\"" }
            kosul: { bayrak: "kaya_kampi_bilinir" }
          - metin: { tr: "Arkadan ağır bot sesleri geliyor: turuncu bantlı iki avcı, soluk soluğa. \"Bizim çocuk orada,\" diyor biri. \"Başçavuş önce onu istiyor.\"", en: "Heavy boots behind you: two hunters with orange-taped armbands, out of breath. \"That's our guy down there,\" one of them says. \"Gunny wants him out first.\"" }
            kosul: { bayrak_yok: "kaya_kampi_bilinir" }
          - { tr: "Platformun tavanında suyun en son nereye kadar çıktığını gösteren bir pas çizgisi var. Su oraya vardığında platform diye bir şey kalmayacak.", en: "There's a rust line on the platform ceiling, the old high-water mark. When the water hits it, there won't be a platform anymore." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Duvardaki boşaltma vanası kapalı. Çarkı suyun beş adım altında kalmış; açılırsa su seviyesi düşer.", en: "The drain valve on the wall is shut. The wheel's about five feet under. Crack it open and the water level drops." }
          - kosul: { stat: { end: 10 } }
            metin: { tr: "Bu soğukta nefesini en çok doksan saniye tutabilirsin. Vanaya varmak altmış saniyeni alır.", en: "In water this cold you can hold your breath ninety seconds, tops. Getting to the valve takes sixty." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "a̷ltı kişi, bir tünel, bir saat. bu soruyu kimin sorduğunu biliyorsun; ben değilim. ama cevabını ben not edeceğim.", en: "s̷ix people, one tunnel, one hour. you know who's asking the question. it's not me. but i'll be the one writing down your answer." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocuklar. Önce çocuklar. Bunu tartışmam bile.\"", en: "\"The kids. Kids first. I'm not even arguing about this.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kırık bacak suda şoka girer, çocuklar hipotermiye. İkisi de zamana karşı. Hangisi önce, sen söyle; ben sararım.\"", en: "\"A broken leg in cold water goes into shock. The kids go hypothermic. Both are on a clock. You pick the order. I'll do the wrapping.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Ben yüzme bilmiyorum. Bunu şimdi söylemem gerekiyordu herhalde, değil mi? Bilmiyorum.\"", en: "\"I can't swim. I should mention that now, right? I can't swim.\"" }
        secenekler:
          - id: "vana"
            etiket: { tr: "Dal, boşaltma vanasını aç", en: "Dive and open the drain valve" }
            zar: { stat: "end", zorluk: 13, tek: true, basarisiz: "su_baskini_bogulma", basarisiz_etkiler: [{ can: -20 }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - can: -8
            sonraki: "su_baskini_vana"
          - id: "sulukler"
            etiket: { tr: "Sülükleri temizle, insanları tek tek taşı", en: "Clear the leeches. Carry people out one at a time" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["yarik_sulugu", "yarik_sulugu"], ortam: ["su", "karanlik"], kazan: "su_baskini_tasima", kaybet: "su_baskini_bogulma", kac: "su_baskini_bogulma" }
          - id: "avci_once"
            etiket: { tr: "Emre uy; önce avcıyı çıkar", en: "Follow orders. Get the hunter out first" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -3 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 5, guven: 4 } }
              - bayrak: "su_once_avci"
            sonraki: "su_baskini_avci_once"
          - id: "cocuk_once"
            etiket: { tr: "Önce çocukları çıkar; avcı bekleyebilir", en: "Kids first. The hunter can wait" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - itibar: { siginak: 2 }
              - iliski: { kaya_demir: { guven: -4, saygi: 2 } }
              - bayrak: "su_once_siviller"
            sonraki: "su_baskini_cocuk_once"
          - id: "zincir"
            etiket: { tr: "Avcılara bağır: insan zinciri kurun", en: "Yell at the hunters: form a human chain" }
            gerekli: { stat: { cha: 10 } }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 3 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - degisken: { hayatta_kalan: 6 }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"
          - id: "duvar"
            tur: "gosteris"
            etiket: { tr: "Tünelin duvarını yumrukla; suya yeni yol aç", en: "Punch through the wall. Give the water a new way out" }
            gerekli: { stat: { str: 18 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - dikkat: 4
              - degisken: { hayatta_kalan: 6 }
              - efsane: "tek_basina_suru"
              - bayrak: "su_herkes_kurtuldu"
              - bayrak: "su_duvar_yikildi"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_vana"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Su kemiklerine kadar ısırıyor. Çark önce direniyor, sonra pas çatırdayıp kopuyor ve bütün tünel, yutkunan dev bir hayvan gibi guruldamaya başlıyor.", en: "The water bites down to the bone. The wheel won't budge at first, then the rust cracks and the whole tunnel gurgles, like some huge animal swallowing." }
          - { tr: "Su çekiliyor; önce diz boyuna, sonra bileklere iniyor. Platformdakiler birbirine bakıp ilk kez ağlamadan gülüyorlar.", en: "The water drops. Knee-deep, then ankle-deep. The people on the platform look at each other and, for the first time, laugh instead of cry." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Herkesi merdivenlere yürüt", en: "Walk everybody up the stairs" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 6 }
              - bayrak: "su_herkes_kurtuldu"
              - xp: 120
            sonraki: "su_baskini_sonuc"
          - id: "dibe_bak"
            etiket: { tr: "Suyun nereye aktığına bak", en: "See where the water's draining to" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - degisken: { hayatta_kalan: 6 }
              - bayrak: "su_herkes_kurtuldu"
              - bayrak: "su_duvar_yikildi"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_tasima"
        yer: "kirik_istasyon"
        paragraflar:
          - metin: { tr: "Sülükler karınları göğe dönük, birer birer suyun yüzüne çıkıyor. Gerisi kolay: altı gidiş, altı nefes.", en: "The leeches float up one by one, bellies to the ceiling. The rest is easy: six trips, six breaths." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son sülük kolundan koparken etinden derin bir parça da götürüyor. Kanın suya karışıyor, ama platforma giden yol açık.", en: "The last leech tears a chunk of skin with it when it lets go. Your blood clouds the water. But the way to the platform is open." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Su tavandaki pas çizgisine bir karış kala son kişiyi, kırık bacaklı avcıyı da merdivene bırakıyorsun.", en: "With the water a hand's width from the rust line, you set the last one, the hunter with the broken leg, down on the stairs." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Merdivene çök, soluklan", en: "Collapse on the stairs and breathe" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 6 }
              - bayrak: "su_herkes_kurtuldu"
              - xp: 120
            sonraki: "su_baskini_sonuc"
          - id: "sar"
            etiket: { tr: "Önce avcının bacağını sar", en: "Splint the hunter's leg first" }
            gerekli: { stat: { wis: 8 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: 6 }
              - iliski: { kaya_demir: { guven: 4 } }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_avci_once"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Avcıyı sırtına alıyorsun; kırık bacağı suya her değdiğinde dişlerinin arasından küfrediyor. Merdivene vardığınızda su platformun kenarını yalamaya başlamış.", en: "You get the hunter on your back. Every time his broken leg touches the water he swears through his teeth. By the time you reach the stairs, the water's lapping over the edge of the platform." }
          - { tr: "Bir tur daha atabilirsin, belki iki. Platformda bir anne, iki çocuk ve birbirine sarılmış iki genç seni bekliyor.", en: "You've got one more trip in you. Maybe two. On the platform: a mother, two kids, and two teenagers holding on to each other." }
        secenekler:
          - id: "anne"
            etiket: { tr: "Anneyle çocukları al; gençler yüzsün", en: "Take the mother and kids. The teens can swim" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "su_genc_kayboldu"
            sonraki: "su_baskini_sonuc"
          - id: "hep_birlikte"
            etiket: { tr: "Hepsine birden yüzmelerini söyle", en: "Tell them all to swim for it together" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "su_baskini_sonuc", basarisiz_etkiler: [{ degisken: { hayatta_kalan: 2 } }, { bayrak: "su_genc_kayboldu" }, { ahlak: { merhamet: -1 } }] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 5 }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"
          - id: "iki_tur"
            etiket: { tr: "İki tur at; ciğerlerin dayanır", en: "Make two more trips. Your lungs will hold" }
            gerekli: { stat: { end: 12 } }
            etkiler:
              - can: -25
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 5 }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_cocuk_once"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Çocukları birer birer omzuna alıyorsun, anneleri de arkandan yüzüyor. Kırık bacaklı avcı platformdan sizi izliyor; ağzını açmadan sırasını bekliyor.", en: "You take the kids across one at a time on your shoulders, the mother swimming behind. The hunter with the broken leg watches from the platform without a word, just waiting his turn." }
          - { tr: "Dönüşte su göğsüne çıkmış. Platformda avcıyla iki genç kaldı; tavandaki pas çizgisine bir karış var.", en: "On the way back the water's up to your chest. The hunter and the two teens are still on the platform, a hand's width from the rust line." }
          - { tr: "\"Önce onları al,\" diyor avcı, gençleri göstererek. \"Ben asker sayılırım. Asker bekler.\"", en: "\"Take them first,\" the hunter says, nodding at the teenagers. \"I'm sort of a soldier. Soldiers wait.\"" }
        secenekler:
          - id: "gencler"
            etiket: { tr: "Gençleri al, sonra avcı için dön", en: "Take the teens. Then come back for the hunter" }
            zar: { stat: "end", zorluk: 12, tek: true, basarisiz: "su_baskini_sonuc", basarisiz_etkiler: [{ degisken: { hayatta_kalan: 3 } }, { bayrak: "su_avci_boguldu" }, { ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 6 }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"
          - id: "avci"
            etiket: { tr: "Avcıyı şimdi al; gençler tutunsun", en: "Take the hunter now. The teens hang on" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "su_genc_kayboldu"
            sonraki: "su_baskini_sonuc"
          - id: "avcilara"
            etiket: { tr: "Merdivendekilere bağır: kendi adamınızı kendiniz alın", en: "Yell at the stairs: come get your own man" }
            gerekli: { stat: { cha: 9 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - degisken: { hayatta_kalan: 6 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "su_herkes_kurtuldu"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_bogulma"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Su seni tavana yapıştırıyor. Ciğerlerin yanıyor, kulaklarında kalbinin gümlemesinden başka ses yok; bir an hangi yönün yukarı olduğunu unutuyorsun.", en: "The water pins you to the ceiling. Your lungs are on fire, there's nothing in your ears but your own heartbeat, and for a second you forget which way is up." }
          - { tr: "Biri yakandan tutup seni sudan çekip çıkarıyor: turuncu bantlı bir avcı. Merdivende öksürürken platforma bakıyorsun; su pas çizgisine dayanmış, platformda kalanların sayısı azalmış.", en: "Somebody's hand hauls you out by the collar: a hunter with an orange armband. Coughing on the stairs, you look back at the platform. The water's at the rust line, and there are fewer people on it now." }
        secenekler:
          - id: "yine"
            etiket: { tr: "Öksürüğün dinmeden geri dal", en: "Dive back in before you stop coughing" }
            gerekli: { stat: { wil: 8 } }
            etkiler:
              - can: -15
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "su_genc_kayboldu"
            sonraki: "su_baskini_sonuc"
          - id: "izle"
            etiket: { tr: "Avcıların gerisini çıkarmasını izle", en: "Watch the hunters pull out the rest" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: 2 }
              - itibar: { lonca: 2 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "su_genc_kayboldu"
            sonraki: "su_baskini_sonuc"

      - id: "su_baskini_sonuc"
        yer: "kirik_istasyon"
        paragraflar:
          - metin: { tr: "Merdivende yan yana oturmuşsunuz, sırılsıklam ve tir tir titreyerek; altı kişinin altısı da burada. Çocuklardan biri dişleri takırdaya takırdaya sana bir sakız uzatıyor.", en: "You're all sitting on the stairs, soaked and shivering. All six. One of the kids, teeth chattering, holds out a stick of gum to you." }
            kosul: { bayrak: "su_herkes_kurtuldu" }
          - metin: { tr: "Merdivende sırılsıklam oturuyorsunuz. Gençlerden biri suyun içinde, sana uzanan elini bıraktığı yerde kaldı; öbürü merdivenin en üstünde sessiz sessiz ağlıyor.", en: "You're sitting on the stairs, soaked through. One of the teenagers stayed in the water, right where his hand slipped out of yours. The other one sits at the top of the stairs, crying without a sound." }
            kosul: { bayrak: "su_genc_kayboldu" }
          - metin: { tr: "Kırık bacaklı avcı platformda kaldı. Turuncu bantlı kolluğu suyun yüzünde bir yaprak gibi dönüp duruyor.", en: "The hunter with the broken leg never left the platform. His orange armband turns slowly on the surface of the water, like a leaf." }
            kosul: { bayrak: "su_avci_boguldu" }
          - metin: { tr: "{npc:kaya_demir} merdivenin başında kollarını kavuşturmuş. \"Emre uydun. İyi asker,\" diyor; sesinde ilk kez bir sıcaklık var.", en: "{npc:kaya_demir} stands at the top of the stairs, arms folded. \"You followed orders. Good soldier,\" he says, and for the first time there's some warmth in it." }
            kosul: { bayrak: "su_once_avci", bayrak_yok: "su_avci_boguldu", degisken_min: { kaya_tanidik: 1 } }
          - metin: { tr: "{npc:kaya_demir} adamının kolluğunu sudan çıkarıp uzun uzun sıkıyor. \"Doğru seçimdi,\" diyor sonunda, sana bakmadan. \"Bunu bil. Bir daha da karşıma çıkma.\"", en: "{npc:kaya_demir} fishes his man's armband out of the water and wrings it out for a long time. \"It was the right call,\" he finally says, not looking at you. \"Know that, and stay out of my way.\"" }
            kosul: { bayrak: "su_avci_boguldu", degisken_min: { kaya_tanidik: 1 } }
          - metin: { tr: "Suyun çekildiği yerde, tünelin dibinde bir yarık açılmış. İçinden ıslak, mavi bir ışık sızıyor: bir kapının ışığı.", en: "Where the water drained away, a crack has opened at the bottom of the tunnel. Wet blue light is leaking out of it. Gate light." }
            kosul: { bayrak: "su_duvar_yikildi" }
          - { tr: "Tünelden gelen su sesi yavaş yavaş diniyor. Yukarıda, istasyonun bir köşesinde biri hiçbir şey olmamış gibi radyonun düğmesini çeviriyor.", en: "The roar from the tunnel slowly dies down. Somewhere upstairs in the station, somebody's turning the dial on a radio like nothing happened at all." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "c̷evabını yazdım. ne yazdığımı sana söylemeyeceğim. ama kalemi bastıra bastıra yazdım.", en: "w̷rote your answer down. not telling you what i wrote. but i pressed hard." }
        secenekler:
          - id: "isik"
            etiket: { tr: "Tünelin dibindeki ışığı aklına yaz", en: "Make a note of the light down there" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "zindan_metro", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "kayaya_cevap"
            etiket: { tr: "Askerin gözünün içine bak: \"Emri çiğnedim. Yine çiğnerim.\"", en: "Look him in the eye: \"I broke it. I'd do it again.\"" }
            goster: { bayrak: "su_once_siviller", bayrak_yok: "su_avci_boguldu", degisken_min: { kaya_tanidik: 1 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - iliski: { kaya_demir: { saygi: 8, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "emri_cignedi", agirlik: 35 }
            sonraki: "@akis"
          - id: "kolluk"
            etiket: { tr: "Boğulan avcının kolluğunu kendi koluna bağla", en: "Tie the drowned hunter's armband on your arm" }
            goster: { bayrak: "su_avci_boguldu" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 6, korku: -3 } }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Kurtulanları yemek katındaki hekime götür", en: "Bring the survivors to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "loncaya"
            etiket: { tr: "Avcıların kampına katılıp ısın", en: "Go warm up at the hunters' camp" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 3 } }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

  # ================================================================== ÖLÜ AVCININ PENCERESİ
  - id: "olu_avci_penceresi"
    perde: [1]
    gun: { min: 9, max: 27 }
    agirlik: 4
    etiketler: ["gizem", "ahlak", "anomali"]
    gerilim: 2
    onemli: true
    kart: { tr: "Kapanmayan pencere", en: "The window that won't close" }
    sahne: "olu_avci_penceresi_1"
    sahneler:
      - id: "olu_avci_penceresi_1"
        paragraflar:
          - { tr: "Yol kenarında sırtüstü bir avcı yatıyor. Kolunda turuncu bantlı bir kolluk, göğsünde temiz ve ölümcül bir delik.", en: "There's a hunter lying on his back at the side of the path. Orange-taped armband on his sleeve. One clean, fatal hole in his chest." }
          - { tr: "Durum penceresi hâlâ açık, göğsünün bir karış üstünde asılı duruyor. Ölülerin pencereleri birkaç dakikada kapanır, bunu herkes bilir; oysa bu saatlerdir açık ve bir köşesinde imleç hâlâ yanıp sönüyor.", en: "His Status window is still open, hanging a few inches above his chest. Everybody knows a dead man's window closes in a couple of minutes. This one's been open for hours, and the cursor in the corner is still blinking." }
          - { tr: "Notlar bölümüne yarım bir cümle yazılmış: \"Bunu kim bulursa, kızıma söyle ki—\"", en: "Somebody typed half a sentence into the notes field: \"Whoever finds this, tell my daughter that—\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Bu bir canavar yarası değil; ucu sivriltilmiş bir boru açmış onu. Bunu bir insan yapmış, hem de hiç acele etmeden.", en: "That's no monster wound. A pipe, filed to a point. A person did this, and they took their time." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "p̷encerenin en alt satırını görüyor musun? görmemen gerekiyordu. benim de görmemem gerekiyordu.", en: "s̷ee the line at the very bottom of the window? you weren't supposed to. neither was i." }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Ayak izleri taze. Katil geri gelecek; ya bir şey almayı unuttu ya da bir şey almaya dönecek.", en: "The footprints are fresh. Whoever did this is coming back. Either they forgot something, or they've got something left to collect." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kızı... Kızı varmış. Ona bir şey götürmemiz lazım, değil mi? Herhangi bir şey.\"", en: "\"He had a daughter. We have to bring her something, right? Anything.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Pencere açık kalmış. Bu... bu bir hata. Sistem hata yapmaz. Yapmaması lazım. Dur, kaydediyorum.\"", en: "\"The window stayed open. That's... that's a bug. The System doesn't have bugs. It's not supposed to. Hold on, I'm logging this.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Pencerenin gizli satırını oku", en: "Read the hidden line on the window" }
            gerekli: { stat: { int: 8 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "elenen_aday"
            sonraki: "olu_avci_satir"
          - id: "kapat"
            etiket: { tr: "Gözlerini ve penceresini kapat, künyesini al", en: "Close his eyes and his window. Take his tags" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "olu_avci_kapat"
          - id: "yagma"
            etiket: { tr: "Çantasını ve ganimetini al", en: "Take his pack and his loot" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -2 }
              - esya: { kucuk_iyilesme_iksiri: 1, canavar_cekirdegi: 1 }
              - kredi: 25
              - bayrak: "olu_avci_yagmalandi"
            sonraki: "olu_avci_yagma"
          - id: "pusu"
            tur: "gizle"
            etiket: { tr: "Katil geri gelecek; çalılara saklanıp bekle", en: "The killer's coming back. Hide and wait" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 2 }
            sonraki: "olu_avci_pusu"
          - id: "kayaya"
            etiket: { tr: "Cesedi rampadaki askerin kampına taşı", en: "Carry the body to the soldier's camp" }
            goster: { bayrak: "kaya_kampi_bilinir" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 3 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 } }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - gun: 1
            sonraki: "olu_avci_kaya"

      - id: "olu_avci_satir"
        paragraflar:
          - { tr: "Satır öyle soluk ki okumak için gözlerini kısıyorsun. [Aday #0412 · Sapma: tespit edildi · Düzeltme: harici görev atandı.]", en: "The line's so faint you have to squint. [Candidate #0412 · Deviation: detected · Correction: external quest assigned.]" }
          - { tr: "Altında bir satır daha var: [Atanan: yakındaki avcı · Ödül: 200 kredi · Durum: tamamlandı, teslim bekleniyor.] Sistem bu adamı fark etmiş, onu öldürsün diye de bir başkasına iş vermiş.", en: "Under it, one more: [Assigned to: nearby hunter · Reward: 200 credits · Status: complete, pending turn-in.] The System noticed this man. Then it hired somebody else to kill him." }
          - { tr: "Bu adamın penceresi de seninki gibi bozulmuş muydu, bilmiyorsun. Ama Sistem'in gözüne takılan birinin neye dönüştüğünü artık biliyorsun: bir göreve.", en: "You don't know if his window glitched like yours did. But now you know what somebody becomes once they get noticed: a quest." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷en olmasam senin satırın da böyle olurdu; belki hâlâ olur. sesini alçak, başını eğik tut. benim için.", en: "w̷ithout me, your line would read just like that, and maybe it still will. keep your voice down and your head down. for me." }
        secenekler:
          - id: "kapat"
            tur: "gizle"
            etiket: { tr: "Pencereyi kapat; bu satırı kimse görmesin", en: "Shut the window. Nobody else sees that line" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 2, insanlik: 1 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "olu_avci_kapat"
          - id: "merte"
            etiket: { tr: "Satırı istasyondaki radyocuya götür", en: "Bring that line to the radio guy at the station" }
            goster: { bayrak: "mert_istasyonu_bilinir" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - dikkat: 2
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { saygi: 6, guven: 4, korku: 3 } }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
              - tohum: { olay: "avci_kizi", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"
          - id: "ezberle"
            etiket: { tr: "Satırı ezberle, katili bekle", en: "Memorize the line. Wait for the killer" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "olu_avci_pusu"

      - id: "olu_avci_kapat"
        paragraflar:
          - { tr: "Gözkapakları soğuk ve inatçı. Pencereye dokunduğunda bir an direniyor, sonra mum gibi sönüyor; en son da imleç.", en: "His eyelids are cold and stubborn. When you touch the window it resists for a second, then gutters out like a candle. The cursor is the last thing to go." }
          - { tr: "Künyesini boynundan çıkarıyorsun. Bir yüzünde adı yazılı, öbür yüzüne çakıyla bir kalp ve iki harf kazınmış.", en: "You lift the tags off his neck. His name's stamped on one side. On the other, somebody scratched a heart and two initials with a pocketknife." }
        secenekler:
          - id: "gom"
            etiket: { tr: "Onu taşlarla ört", en: "Cover him with stones" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - gun: 1
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Künyeyi cebine koy, yürü", en: "Pocket the tags and walk" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "bekle"
            etiket: { tr: "Taşların arkasında katili bekle", en: "Wait behind the rocks for the killer" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
            sonraki: "olu_avci_pusu"

      - id: "olu_avci_yagma"
        paragraflar:
          - { tr: "Çantası ağır: iksirler, bir çekirdek, bir rulo bant. Kemerini çözerken arkanda bir dal çıtırdıyor.", en: "His pack's heavy: potions, a core, a roll of tape. You're working his belt loose when a branch snaps behind you." }
          - { tr: "Elinde ucu sivri bir boru, gözleri kan çanağına dönmüş bir adam dikiliyor. \"O benim,\" diyor, sesi titriyor. \"Görevi ben yaptım, ödül benim.\"", en: "A man stands there, red-eyed, holding a pipe filed to a point. \"That's mine,\" he says, voice shaking. \"I did the quest, so the reward's mine.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Boruyu elinden al", en: "Take that pipe away from him" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 2 }
              - savas: { dusmanlar: ["cop_avcisi"], kazan: "olu_avci_katil_zafer", kaybet: "olu_avci_katil_yenilgi", kac: "olu_avci_katil_kacis" }
          - id: "ver"
            etiket: { tr: "Ganimeti bırak, görevi kimin verdiğini sor", en: "Drop the loot. Ask him who gave him the quest" }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: -1, canavar_cekirdegi: -1 }
              - kredi: -25
              - ahlak: { insanlik: 2, duzen: 1 }
              - bilgi: "elenen_aday"
            sonraki: "olu_avci_itiraf"

      - id: "olu_avci_pusu"
        paragraflar:
          - { tr: "Bir saat geçiyor. Derken çalıların arasından elinde ucu sivri bir boruyla bir adam çıkıyor; Durum penceresi bir harita gibi önünde açık.", en: "An hour goes by. Then a man steps out of the brush carrying a pipe filed to a point, his own Status window open in front of him like a map." }
          - { tr: "Penceresinde bir görev parlıyor: [Sapmayı düzelt · Tamamlandı · Ödülünü almak için hedefe dokun.] Adam cesedin yanına diz çöküp titreyen elini uzatıyor.", en: "A quest is glowing on his window: [Correct the deviation · Complete · Touch the target to claim your reward.] He kneels by the body and reaches out a hand. It's shaking." }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Dokunmadan üstüne atıl", en: "Jump him before he touches the body" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: 3 }
              - savas: { dusmanlar: ["cop_avcisi"], kazan: "olu_avci_katil_zafer", kaybet: "olu_avci_katil_yenilgi", kac: "olu_avci_katil_kacis" }
          - id: "izle"
            etiket: { tr: "Dokunmasına izin ver, izle", en: "Let him touch it. Watch" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - bilgi: "elenen_aday"
            sonraki: "olu_avci_odul"
          - id: "seslen"
            etiket: { tr: "Saklandığın yerden seslen: \"Neden?\"", en: "Call out from cover: \"Why?\"" }
            zar: { stat: "cha", zorluk: 11, tek: true, basarisiz: "olu_avci_katil_kacis" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
            sonraki: "olu_avci_itiraf"

      - id: "olu_avci_odul"
        paragraflar:
          - { tr: "Parmakları cesede değdiği anda penceresinden bir zil sesi yükseliyor; kazanan bir oyun makinesinin çıkardığı o ses. [200 kredi · Teşekkür ederiz. Katkınız not edildi.]", en: "The second his fingers touch the body, a chime comes out of his window, the sound a slot machine makes when it pays out. [200 credits · Thank you. Your contribution has been noted.]" }
          - { tr: "Adam ağlamaya başlıyor. Kredilerini sayıyor, bir daha sayıyor, sonra ölünün yüzüne bir kez bile bakmadan çekip gidiyor.", en: "The man starts crying. He counts the credits, then counts them again, and leaves without looking at the dead man's face even once." }
        secenekler:
          - id: "kunye"
            etiket: { tr: "Gittikten sonra künyeyi al", en: "After he's gone, take the tags" }
            goster: { bayrak_yok: "olu_avci_kunyesi" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "tut"
            etiket: { tr: "Cebindeki künyeyi sık ve gidişini izle", en: "Grip the tags in your pocket. Watch him go" }
            goster: { bayrak: "olu_avci_kunyesi" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
            sonraki: "@akis"
          - id: "takip"
            etiket: { tr: "Peşine düş, nereye gittiğini öğren", en: "Tail him. Find out where he goes" }
            gerekli: { stat: { agi: 8 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - egilim: { gizlilik: 2 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 3, max: 5 } }
            sonraki: "@akis"

      - id: "olu_avci_itiraf"
        paragraflar:
          - { tr: "Adam boruyu bırakıp yere çöküyor. \"Bir sabah uyandım, penceremde bir görev duruyordu,\" diyor. \"Adı, yeri, ödülü... Neden diye sormadım; Sistem'e soru sorulmaz.\"", en: "The man drops the pipe and sinks to the ground. \"I woke up one morning and there was a quest on my window,\" he says. \"His name, his location, the reward, and I didn't ask why, because you don't ask the System.\"" }
          - { tr: "\"İki çocuğum var,\" diyor. \"İki yüz kredi on günlük yemek demek. Sen olsan ne yapardın?\"", en: "\"I've got two kids,\" he says. \"Two hundred credits is ten days of food. What would you have done?\"" }
        secenekler:
          - id: "affet"
            etiket: { tr: "Git. Çocuklarına bak", en: "Go. Take care of your kids" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - bayrak: "olu_avci_katil_bagislandi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "teslim"
            etiket: { tr: "Onu ölünün arkadaşlarına teslim et", en: "Turn him over to the dead man's crew" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -3 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - bayrak: "olu_avci_katil_teslim"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "cevap"
            etiket: { tr: "\"Hayır derdim.\" Sonra bunun doğru olup olmadığını düşün", en: "\"I'd have said no.\" Then wonder if that's true" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - stat: { wis: 1 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "olu_avci_katil_zafer"
        paragraflar:
          - { tr: "Adam yerde yatıyor, boru elinden fersah fersah uzağa savrulmuş. Penceresi hâlâ açık, görev hâlâ parlıyor: teslim bekleniyor.", en: "The man's on the ground, the pipe a mile out of reach. His window's still open, and the quest's still glowing: pending turn-in." }
          - { tr: "\"Sistem verdi bana!\" diye bağırıyor. \"İki yüz kredi! Ne yapsaydım, ne yapsaydım?\"", en: "\"The System gave it to me!\" he yells. \"Two hundred credits! What was I supposed to do, what was I supposed to do?\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ bir alet. aleti kırmak eli durdurmaz. ama yine de kırmak isteyebilirsin; anlarım.", en: "h̷e's a tool. breaking the tool doesn't stop the hand. you might want to break it anyway. i'd get that." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Onu öldür; görevini sen kapat", en: "Kill him. Close out his quest yourself" }
            etkiler:
              - ahlak: { merhamet: -7, insanlik: -4, duzen: 2 }
              - yozlasma: 2
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - bayrak: "olu_avci_katil_olduruldu"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "affet"
            etiket: { tr: "Bırak gitsin; ama künyeyi sen al", en: "Let him go. But you take the tags" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - bayrak: "olu_avci_katil_bagislandi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "kayaya"
            etiket: { tr: "Onu rampadaki askere götür", en: "March him to the soldier at the dock" }
            goster: { bayrak: "kaya_kampi_bilinir" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -2 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 6, guven: 5 } }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - bayrak: "olu_avci_katil_teslim"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"

      - id: "olu_avci_katil_yenilgi"
        paragraflar:
          - { tr: "Boru kafana iniyor ve gökyüzü bir an bembeyaz kesiliyor. Gözlerini açtığında adam cesedin başında, eli ölünün göğsünde; penceresinden bir zil sesi yükseliyor.", en: "The pipe comes down on your head and the sky goes white. When you open your eyes, he's kneeling by the body, hand on the dead man's chest, and a chime is rising from his window." }
          - { tr: "Ardından çekip gidiyor. Seni öldürmüyor; senin için görev almamış ki.", en: "He leaves. He doesn't kill you. Nobody gave him a quest for you." }
        secenekler:
          - id: "kunye"
            etiket: { tr: "Sürünerek cesede git ve künyeyi al", en: "Crawl to the body and take the tags" }
            goster: { bayrak_yok: "olu_avci_kunyesi" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "son_cumle"
            etiket: { tr: "Senin için görev almamış; bunu aklına yaz", en: "Nobody hired him for you. Remember that" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - gizle: 1
            sonraki: "@akis"

      - id: "olu_avci_katil_kacis"
        paragraflar:
          - { tr: "Adam boruyu savurup bağırırken sen geri çekiliyorsun. Çalıların arasından son gördüğün, onun cesedin üstüne eğilişi oluyor.", en: "He swings the pipe and screams and you fall back. The last thing you see through the brush is him bending over the body." }
          - { tr: "Uzaktan, bir oyun salonundan geliyormuş gibi bir zil sesi duyuluyor.", en: "You hear a chime, far off, like it's coming from an arcade." }
        secenekler:
          - id: "don"
            etiket: { tr: "Gittikten sonra dön ve künyeyi al", en: "Come back after he's gone. Take the tags" }
            goster: { bayrak_yok: "olu_avci_kunyesi" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gorev: { olu_avcinin_mesaji: "basla" }
              - bayrak: "olu_avci_kunyesi"
              - tohum: { olay: "avci_kizi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Bu senin işin değil; git", en: "Not your business. Go" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -2 }
            sonraki: "@akis"

      - id: "olu_avci_kaya"
        paragraflar:
          - { tr: "{npc:kaya_demir} cesedi görünce tek söz etmiyor. Diz çöküp adamının kolluğunu düzeltiyor, ardından yarayı uzun uzun inceliyor.", en: "{npc:kaya_demir} doesn't say a word when he sees the body. He kneels, straightens his man's armband, then studies the wound for a long time." }
          - { tr: "\"Canavar değil bu. İnsan işi, hem de sabırlı birinin,\" diyor sonunda. Sonra gözlerini sana kaldırıyor: \"Ne gördün?\"", en: "\"That's no monster. That's a man, and a patient one,\" he finally says. Then he looks up at you: \"What did you see?\"" }
          - { tr: "Kampın mutfak çadırından elinde kepçeyle on yedi yaşlarında bir kız çıkıyor ve olduğu yerde donup kalıyor.", en: "A girl of about seventeen comes out of the camp's cook tent, ladle in hand, and freezes where she stands." }
        secenekler:
          - id: "insan"
            etiket: { tr: "\"Bir insan. Boruyla. Bulmana yardım ederim.\"", en: "\"A man. With a pipe. I'll help you find him.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { kaya_demir: { guven: 6, saygi: 3 } }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
              - tohum: { olay: "avci_kizi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "satir"
            tur: "aciga_vur"
            etiket: { tr: "Ona Sistem'in o adamı nasıl işaretlediğini anlat", en: "Tell him how the System marked his man" }
            gerekli: { bilgi: "elenen_aday" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { kaya_demir: { saygi: 6, korku: 5, guven: 2 } }
              - itibar: { lonca: 4 }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
              - tohum: { olay: "avci_kizi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "kiza"
            etiket: { tr: "Kıza dön; künye onun", en: "Turn to the girl. The tags are hers" }
            etkiler:
              - bayrak: "olu_avci_kunye_verildi"
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - tohum: { olay: "avci_kizi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ avcının kızı (tohum)
  - id: "avci_kizi"
    perde: [1]
    agirlik: 1
    etiketler: ["ahlak", "karsilasma"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Yarım kalan cümle", en: "The unfinished sentence" }
    sahne: "avci_kizi_1"
    sahneler:
      - id: "avci_kizi_1"
        paragraflar:
          - metin: { tr: "Kamp ateşinin başına on yedi yaşlarında bir kız geliyor; elleri kova taşımaktan su toplamış, gözleri babasının gözleri. \"Babamın künyesi sendeymiş,\" diyor.", en: "A girl of about seventeen walks up to your fire. Her hands are blistered from hauling water buckets, and she's got her father's eyes. \"I heard you have my dad's tags,\" she says." }
            kosul: { bayrak_yok: "olu_avci_kunye_verildi" }
          - metin: { tr: "Rampadaki kampta künyeyi verdiğin kız kamp ateşinin başına geliyor; babasının künyesi artık onun boynunda. Teşekküre değil, bir şey sormaya gelmiş.", en: "The girl you gave the tags to at the dock camp walks up to your fire, her father's tags around her own neck now. She didn't come to say thanks. She came to ask something." }
            kosul: { bayrak: "olu_avci_kunye_verildi" }
          - metin: { tr: "\"O gün sormaya cesaret edemedim,\" diyor. \"Penceresine bir şey yazmış mı? Herkes bir şey yazar.\"", en: "\"I couldn't make myself ask that day,\" she says. \"Did he write anything in his window? Everybody writes something.\"" }
            kosul: { bayrak: "olu_avci_kunye_verildi" }
          - metin: { tr: "Künyeyi uzatıyorsun. Kız onu avucunda tartıyor, kazınmış kalbe başparmağıyla dokunuyor, sonra yüzüne bakıyor: \"Penceresine bir şey yazmış mı? Herkes bir şey yazar.\"", en: "You hold out the tags, and she weighs them in her palm, running a thumb over the scratched-in heart. Then she looks up at you: \"Did he write anything in his window? Everybody writes something.\"" }
            kosul: { bayrak_yok: "olu_avci_kunye_verildi" }
          - { tr: "Yarım cümle, imleciyle birlikte aklında duruyor: \"Bunu kim bulursa, kızıma söyle ki—\"", en: "The half sentence is still in your head, blinking cursor and all: \"Whoever finds this, tell my daughter that—\"" }
        sezgiler:
          - kosul: { stat: { cha: 9 } }
            metin: { tr: "Ne söylersen ömrü boyunca onu taşıyacak. Ağır bir şey verme; ya da ver, ama kaldırabileceği kadar.", en: "Whatever you say, she'll carry for the rest of her life. Don't hand her anything too heavy. Or do, but only as much as she can lift." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷alan söyle. ya da söyleme. insanlar ikisinden de bir şeyler kurar; hangisinden kurulanın daha sağlam olduğunu hiç çözemedim.", en: "l̷ie. or don't. people build something out of both. which one holds up better, i never figured out." }
        secenekler:
          - id: "sevgi"
            etiket: { tr: "\"Onu çok sevdiğini söylemeni istemiş.\"", en: "\"He wanted you to know he loved you.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - gorev: { olu_avcinin_mesaji: "tamam" }
              - xp: 60
              - bayrak: "avci_kizi_teselli"
            sonraki: "avci_kizi_teselli"
          - id: "dogru"
            etiket: { tr: "Doğruyu söyle: cümle yarım kalmış", en: "Tell the truth: he never finished it" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - gorev: { olu_avcinin_mesaji: "tamam" }
              - xp: 60
            sonraki: "avci_kizi_yarim"
          - id: "katil"
            tur: "aciga_vur"
            etiket: { tr: "Ona babasını Sistem'in işaretlediğini anlat", en: "Tell her the System marked her father" }
            gerekli: { bilgi: "elenen_aday" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: -3 }
              - gorev: { olu_avcinin_mesaji: "tamam" }
              - xp: 60
            sonraki: "avci_kizi_ofke"

      - id: "avci_kizi_teselli"
        paragraflar:
          - { tr: "Kızın omuzları çöküyor; sonra, günlerdir ilk kez, ağlamaya başlıyor. Sen bekliyorsun, ateş de bekliyor.", en: "Her shoulders drop, and then for the first time, maybe in days, she starts to cry. You wait. So does the fire." }
          - { tr: "\"Biliyordum,\" diyor sonunda, künyeyi avucunda sıkarak. \"Ama birinin söylemesi lazımdı.\"", en: "\"I knew it,\" she finally says, squeezing the tags in her fist. \"But somebody had to say it.\"" }
        secenekler:
          - id: "hekime"
            etiket: { tr: "Ona yemek katındaki hekimin yanında iş olduğunu söyle", en: "Tell her there's work with the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "loncaya"
            etiket: { tr: "Babasının arkadaşları ona sahip çıkar, de", en: "Tell her dad's crew will look out for her" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { baglilik: 4, saygi: 3 } }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "ates"
            etiket: { tr: "Bu gece ateşinin başında kalmasını teklif et", en: "Offer her a spot by your fire tonight" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "avci_kizi_yarim"
        paragraflar:
          - { tr: "Kız uzun süre sesini çıkarmıyor. Sonra künyeyi çevirip kalbin yanındaki boşluğa bakıyor.", en: "She doesn't say anything for a long time. Then she turns the tags over and looks at the empty space next to the heart." }
          - { tr: "\"O zaman ben bitiririm, her gün başka bir sonla,\" diyor. \"Bugünkü: kızına söyle ki dayanıyor.\" Sesi titremiyor, en azından fazla değil.", en: "\"Then I'll finish it, a different ending every day,\" she says. \"Today's: tell my daughter that she's holding up.\" Her voice doesn't shake, not much." }
        secenekler:
          - id: "saygi"
            etiket: { tr: "Başını eğ; bu onun cümlesi artık", en: "Bow your head. It's her sentence now" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Ona yemek katındaki hekime gitmesini söyle", en: "Point her to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "loncaya"
            etiket: { tr: "Ona babasının arkadaşlarını göster", en: "Point her to her dad's crew" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "avci_kizi_ofke"
        paragraflar:
          - { tr: "Anlatıyorsun: gizli satırı, görevi, iki yüz krediyi, zil sesini. Kızın yüzündeki yas ağır ağır başka bir şeye dönüşüyor; daha soğuk, daha dimdik bir şeye.", en: "You tell her: the hidden line, the quest, the two hundred credits, the chime. The grief on her face slowly turns into something else, something colder, something that stands up straighter." }
          - { tr: "\"Demek onu kimse öldürmedi. Sistem öldürdü, o adam yalnızca eliydi,\" diyor, künyeyi sıkarak. \"Sen bunu nasıl gördün? Sende ne varsa ben de ondan istiyorum.\"", en: "\"So nobody killed him, the System did, and some guy was just the hand,\" she says, squeezing the tags. \"How did you even see that? Whatever you are, I want some.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ş̷imdi biliyor. bilen herkes bir risk; ama aynı zamanda bir müttefik. hesabını sen yap, ben yoruldum.", en: "n̷ow she knows. everybody who knows is a risk. and an ally. you do the math. i'm tired." }
        secenekler:
          - id: "radyocular"
            etiket: { tr: "İstasyonda Sistem'i dinleyenler var, de", en: "Tell her about the station crew listening to the System" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 3 } }
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "\"Kimseye söyleme. Benim için değil; senin için.\"", en: "\"Tell no one. Not for my sake. For yours.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - gizle: 2
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "\"O zaman güçlen. Bir gün de ona sor.\"", en: "\"Then get strong. And someday, make it answer.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -1 }
              - itibar: { lonca: 2, sessiz_ag: 2 }
              - stat: { cha: 1 }
            sonraki: "@akis"

  # ================================================================== KAYA — İLK TANIŞMA (Lonca çekirdeği)
  - id: "kaya_ilk_tanisma"
    perde: [1]
    bolge: ["ogretici_orman", "harabe_carsi"]
    gun: { min: 5, max: 18 }
    agirlik: 7
    etiketler: ["kamp", "lonca", "npc", "karsilasma"]
    gerilim: 3
    npc: ["kaya_demir"]
    onemli: true
    kart: { tr: "Rampadaki asker", en: "The soldier at the loading dock" }
    sahne: "kaya_ilk_tanisma_1"
    sahneler:
      - id: "kaya_ilk_tanisma_1"
        paragraflar:
          - { tr: "Ormanın çarşıya dayandığı yerde, eski yükleme rampasının önüne bir belediye otobüsü yan yatırılmış, aralıkları alışveriş arabalarıyla tıkanmış. Siperin üstünde kollarına turuncu bant takmış dört nöbetçi bekliyor; ellerinde mızrağa çevrilmiş korkuluk demirleri.", en: "Where the woods run up against the mall, somebody's tipped a city bus onto its side in front of the old loading dock and packed the gaps with shopping carts. Four sentries stand on top in orange-taped armbands, holding stair railings filed down into spears." }
          - { tr: "Rampanın önünde insanlar sıraya girmiş. Başlarında gri saçları kısacık kesilmiş, sırtı bayrak direği gibi dimdik bir adam, sıradakilerin Durum pencerelerini birer birer okuyup hükmünü veriyor: \"Savaşçı, taşıyıcı, hekime.\"", en: "A line of people waits in front of the dock. At the head of it stands a man with a gray buzz cut and a spine like a flagpole, reading each person's Status window and handing down a verdict: \"Fighter, hauler, go see the doc.\"" }
          - { tr: "Sıradaki adam savaşmayacağını da yük taşımayacağını da söylüyor. Gri saçlı adam başını sallıyor: \"O zaman yemek de yok. Burada bedava ağız yok, el var.\"", en: "The next guy in line says he won't fight or haul, and the gray-haired man just nods. \"Then you don't eat. No free mouths here, only hands.\"" }
          - { tr: "Sonra sana dönüp pencerene tek bir kez bakıyor; gözleri bir an kısılıyor. \"{npc:kaya_demir|tam},\" diyor, elini uzatmadan. \"Sen hangisisin?\"", en: "Then he turns to you and looks at your window exactly once, his eyes narrowing for a second. \"{npc:kaya_demir|tam},\" he says, not offering a hand. \"Which one are you?\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Siperdeki dört nöbetçiden üçü mızrağını yanlış tutuyor. Adam bunu biliyor; onları oraya dövüşsünler diye değil, görünsünler diye dikmiş.", en: "Three of the four sentries are holding their spears wrong. He knows. He didn't put them up there to fight. He put them up there to be seen." }
          - kosul: { stat: { per: 11 } }
            metin: { tr: "Penceresinde Seviye 8 yazıyor, gerçeği de 8. Bu çarşıda rakamını şişirmeyen tek kişi o olabilir.", en: "His window says Level 8, and he really is an 8. He might be the only person in this whole mall who isn't padding his number." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ana bir rütbe takmak isteyecek. rütbe dediğin tasmadır, yalnızca daha parlağı.", en: "h̷e's going to want to pin a rank on you. a rank is a leash. just shinier." }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Seni ölçüp biçiyor. Cetveli yetmeyecek, bunu yüzünden okuyabiliyorsun.", en: "He's measuring you. His ruler's going to come up short, and you can see him starting to realize it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kampı sağlam. Ama o adam aç kalırsa... Bilmiyorum. Bir şey söylesene ona.\"", en: "\"Solid camp. But if that guy goes hungry... I don't know. Say something to him.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bana yolladığı yaralıların yarısını vaktinde yolluyor. Öbür yarısını sana anlatmayayım.\"", en: "\"Half the wounded he sends me, he sends in time. The other half, I'm not going to tell you about.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Herkesin penceresini okuyor. Herkesin. Bir veritabanı tutuyor, eminim. Kafasında.\"", en: "\"He reads everybody's window. Everybody's. He's keeping a database, I swear. In his head.\"" }
        secenekler:
          - id: "sinav"
            etiket: { tr: "Sıraya gir, sınavına çık", en: "Get in line. Take his test" }
            etkiler:
              - tanis: "kaya_demir"
              - bayrak: "kaya_kampi_bilinir"
              - degisken: { kaya_tanidik: 1 }
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            sonraki: "kaya_ilk_tanisma_sinav"
          - id: "savun"
            etiket: { tr: "Aç kalacak adamı savun", en: "Stand up for the guy he's about to starve" }
            etkiler:
              - tanis: "kaya_demir"
              - bayrak: "kaya_kampi_bilinir"
              - degisken: { kaya_tanidik: 1 }
              - ahlak: { merhamet: 4, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 4, guven: -3 } }
            sonraki: "kaya_ilk_tanisma_savun"
          - id: "tasiyici"
            tur: "gizle"
            etiket: { tr: "Seviyeni düşük göster; taşıyıcı ol", en: "Play your level down. Be a hauler" }
            etkiler:
              - tanis: "kaya_demir"
              - bayrak: "kaya_kampi_bilinir"
              - degisken: { kaya_tanidik: 1 }
              - gizle: 3
              - ahlak: { duzen: 2 }
              - gun: 1
            sonraki: "kaya_ilk_tanisma_tasiyici"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni tamamen aç; sınavı atla", en: "Open your window all the way. Skip the test" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - tanis: "kaya_demir"
              - bayrak: "kaya_kampi_bilinir"
              - degisken: { kaya_tanidik: 1 }
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 12, korku: 6 } }
              - itibar: { lonca: 6 }
            sonraki: "kaya_ilk_tanisma_rutbe"
          - id: "yuru"
            etiket: { tr: "Başınla selam verip yoluna git", en: "Give him a nod and go your own way" }
            etkiler:
              - tanis: "kaya_demir"
              - bayrak: "kaya_kampi_bilinir"
              - degisken: { kaya_tanidik: 1 }
              - ahlak: { duzen: -2 }
              - iliski: { kaya_demir: { saygi: -3 } }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_sinav"
        paragraflar:
          - { tr: "{npc:kaya_demir} rampanın çökmüş çatısını gösteriyor. \"Çatı penceresine yarasalar yuvalanmış; her gece nöbetçilerimden birini alıyorlar,\" diyor. \"İki adamım seninle gelecek. Sonra konuşuruz.\"", en: "{npc:kaya_demir} points at the dock's caved-in roof. \"Bats in the skylight, and every night they take one of my sentries,\" he says. \"Two of my people go up with you, and we talk after.\"" }
          - { tr: "Yanına verdiği iki avcı birbirine bakıyor. Biri yirmisinde bile yok; öbürü bir boru anahtarını tespih gibi parmaklarında çevirip duruyor.", en: "The two hunters he hands you trade a look. One of them isn't even twenty. The other one keeps turning a pipe wrench through his fingers like a rosary." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Çatıya tırman ve yarasaları indir", en: "Climb up and bring the bats down" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["ciglik_yarasasi", "ciglik_yarasasi"], ortam: ["tavan"], kazan: "kaya_ilk_tanisma_degerlendirme", kaybet: "kaya_ilk_tanisma_yenilgi", kac: "kaya_ilk_tanisma_kacis" }
          - id: "komuta"
            etiket: { tr: "İki avcıya plan ver, birlikte temizleyin", en: "Give the two hunters a plan. Clear it together" }
            gerekli: { stat: { cha: 9 } }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 1 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - bayrak: "kaya_sinavi_komuta"
              - savas: { dusmanlar: ["ciglik_yarasasi", "ciglik_yarasasi"], ortam: ["tavan"], kazan: "kaya_ilk_tanisma_degerlendirme", kaybet: "kaya_ilk_tanisma_yenilgi", kac: "kaya_ilk_tanisma_kacis" }
          - id: "yalniz"
            tur: "gosteris"
            etiket: { tr: "Avcıları aşağıda bırak, tek başına çık", en: "Leave the hunters below. Go up alone" }
            gerekli: { stat: { agi: 14 } }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 2 }
              - dikkat: 3
              - efsane: "tek_basina_suru"
              - xp: 150
              - bayrak: "kaya_sinavi_yalniz"
            sonraki: "kaya_ilk_tanisma_degerlendirme"

      - id: "kaya_ilk_tanisma_degerlendirme"
        paragraflar:
          - metin: { tr: "Çatıdan indiğinde iki avcı sana, bir şey anlatmak isteyip nasıl anlatacağını bilemeyen insanlar gibi bakıyor. {npc:kaya_demir} çatıdaki yarasa leşlerini sayıyor, sonra bir daha sayıyor.", en: "When you climb down, the two hunters are looking at you like people who want to describe something and don't know how. {npc:kaya_demir} counts the dead bats on the roof, then counts them again." }
            kosul: { degisken_min: { _savas_ezme: 1 }, bayrak_yok: "kaya_sinavi_yalniz" }
          - metin: { tr: "Kan içindesin ama ayaktasın. Genç avcının kolunda bir pençe izi var, yine de yaşıyor; yarasalar susmuş. {npc:kaya_demir} merdivenin dibinde kollarını kavuşturmuş, seni bekliyor.", en: "You're bloody, but you're standing. The young hunter's got claw marks down one arm, but he's alive, and the bats have gone quiet. {npc:kaya_demir} waits at the foot of the ladder, arms crossed." }
            kosul: { degisken_max: { _savas_ezme: 0 }, bayrak_yok: "kaya_sinavi_yalniz" }
          - metin: { tr: "Avcıları aşağıda bırakıp çıkıyorsun; bir dakika sonra yarasalar çatı penceresinden birer birer taş gibi düşüyor. {npc:kaya_demir} saatine bakıyor, neden baktığını kendisi de bilmiyormuş gibi.", en: "You leave the hunters below and go up, and a minute later bats start dropping out of the skylight one after another like stones. {npc:kaya_demir} checks his watch, like even he doesn't know why he's timing it." }
            kosul: { bayrak: "kaya_sinavi_yalniz" }
          - { tr: "\"Geçen gün biri, kampa bir isim lazım dedi,\" diyor sonunda. \"{fraksiyon:lonca} dedim. Kulağa resmî geliyor; insanlar resmî olana selam durur.\"", en: "\"Somebody said the camp needed a name the other day,\" he finally says. \"I said {fraksiyon:lonca}, because it sounds official. People salute official.\"" }
          - { tr: "Cebinden bir parça turuncu bant çıkarıp sana uzatıyor. \"İlk onda yerin var. Rütbe sonra gelir, hak edersen.\"", en: "He pulls a strip of orange tape out of his pocket and holds it out. \"There's a spot for you in the first ten. Rank comes later, if you earn it.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ant. tasmanın kumaştan olanı. ama ılık, değil mi? onun elinden geldiği için ılık.", en: "t̷ape. the cloth version of a leash. but it's warm, isn't it? warm from his hand." }
        secenekler:
          - id: "tak"
            etiket: { tr: "Bandı koluna sar", en: "Wrap the tape around your arm" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 10 }
              - iliski: { kaya_demir: { saygi: 6, baglilik: 6, guven: 3 } }
              - bayrak: "lonca_saflarinda"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "Teşekkür et, ama bandı geri ver", en: "Thank him, but hand the tape back" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 3, baglilik: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 25 }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "elestir"
            etiket: { tr: "\"Aç bıraktığın adamlar ne olacak?\"", en: "\"And the people you're starving?\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2, guven: -3 } }
            sonraki: "kaya_ilk_tanisma_felsefe"
          - id: "hekimle"
            etiket: { tr: "Yemek katındaki hekimle çalışmasını öner", en: "Suggest he work with the food court doctor" }
            goster: { bayrak: "elif_hastanesi_bilinir" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - itibar: { lonca: 3, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 3 }, elif_sari: { saygi: 3 } }
              - bayrak: "kaya_elif_koprusu"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_felsefe"
        paragraflar:
          - { tr: "{npc:kaya_demir} bandı cebine geri koymuyor, avucunda tutuyor. \"Ben zayıfları korurum,\" diyor. \"Beslerim, barındırırım, uyurlarken başlarında beklerim. Ama kararlarını vermelerine izin vermem.\"", en: "{npc:kaya_demir} doesn't put the tape away; he keeps it in his fist. \"I protect the weak, feed them, shelter them, stand over them while they sleep,\" he says. \"What I don't do is let them make the calls.\"" }
          - { tr: "\"Yirmi yıl boyunca gördüm, korkan insanlar oy verince ne olur. En yüksek sesle bağıranı seçerler. Burada en yüksek ses benimki olacak; hiç değilse ben ne yaptığımı biliyorum.\"", en: "\"Twenty years, I've seen what happens when scared people vote. They pick whoever screams loudest, and around here, the loudest voice is going to be mine. At least I know what I'm doing.\"" }
        secenekler:
          - id: "ikna"
            etiket: { tr: "Ona bir kural öner: çocuklar ve yaşlılar muaf", en: "Propose one rule: kids and old folks exempt" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "kaya_ilk_tanisma_ikna_yok", basarisiz_etkiler: [{ iliski: { kaya_demir: { saygi: -2 } } }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 4, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "lonca_muafiyet"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "katil"
            etiket: { tr: "\"Haklısın.\" Bandı alıp koluna sar", en: "\"Fair.\" Take the tape and put it on" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { saygi: 5, baglilik: 5 } }
              - bayrak: "lonca_saflarinda"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "ayril"
            etiket: { tr: "\"Öyleyse senin bağıran sesin ben olmam.\"", en: "\"Then I won't be your loud voice.\"" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 4, guven: -4 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 30 }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_ikna_yok"
        paragraflar:
          - { tr: "{npc:kaya_demir} başını iki yana sallıyor. \"Bugün bir istisna koyarsın, yarın on istisna isterler,\" diyor. \"Kural ya herkes içindir ya hiç kimse için.\"", en: "{npc:kaya_demir} shakes his head. \"Make one exception, tomorrow they want ten,\" he says. \"A rule's for everybody or it's for nobody.\"" }
          - { tr: "Yine de bandı cebine koymuyor; sana uzatılmayı bekler gibi avucunda duruyor.", en: "He still doesn't put the tape away. It sits in his palm like it's waiting to be handed over." }
        secenekler:
          - id: "al"
            etiket: { tr: "Bandı al; içeriden değiştirirsin", en: "Take the tape. Change it from the inside" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 3, baglilik: 3 } }
              - bayrak: "lonca_saflarinda"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bandı bırak, git", en: "Leave the tape and go" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 25 }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_kural_yok"
        paragraflar:
          - { tr: "\"Benim kampım, benim kuralım,\" diyor {npc:kaya_demir}, sesini yükseltmeden. \"Ya kendi payından doyurursun ya hiç doyurmazsın.\"", en: "\"My camp, my rule,\" {npc:kaya_demir} says, without raising his voice. \"You feed him out of your share, or you don't feed him at all.\"" }
          - { tr: "Sıradaki adam başını öne eğiyor. Tartışma onun hakkında ama artık onun elinde değil; bunu o da biliyor.", en: "The guy in line drops his head. He knows the argument was about him, and that it isn't his anymore." }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Payını adamla paylaş", en: "Split your share with him" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - can: -10
              - degisken: { hayatta_kalan: 1 }
              - iliski: { kaya_demir: { saygi: 3 } }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Adamı yemek katındaki hekime götür", en: "Take the guy to the food court doctor" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_savun"
        paragraflar:
          - { tr: "{npc:kaya_demir} seni sonuna kadar dinliyor; ne kaşı kalkıyor ne sesi. \"Peki,\" diyor. \"O zaman bir hafta boyunca onu sen doyurursun, kendi payından.\"", en: "{npc:kaya_demir} hears you out without an eyebrow moving, without his voice changing. \"Fine,\" he says. \"Then you feed him out of your share, for one week.\"" }
          - { tr: "Sıradaki adam sana bakıyor. Yüzünde minnet değil utanç var; utancın altında da başka bir şey: savaşmak istemeyen birinin, kendisi için savaşanı izlerken duyduğu şaşkınlık.", en: "The guy in line is looking at you. There's no gratitude on his face. There's shame, and under the shame something else: the confusion of somebody who won't fight, watching somebody fight for him." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; payını adamla paylaş", en: "Deal. Split your share with him" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 6, guven: 2 } }
              - degisken: { hayatta_kalan: 1 }
              - can: -10
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kuralı değiştirmesi için onu ikna et", en: "Talk him into changing the rule" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "kaya_ilk_tanisma_kural_yok", basarisiz_etkiler: [{ iliski: { kaya_demir: { saygi: -3 } } }, { ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 4, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "lonca_muafiyet"
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Adamı yemek katındaki hekime götür", en: "Take the guy to the food court doctor instead" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 3 }
              - iliski: { kaya_demir: { saygi: -2 }, elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"
          - id: "sonra_sinav"
            etiket: { tr: "\"Anlaştık. Şimdi şu sınava geçelim.\"", en: "\"Deal. Now give me your test.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "kaya_ilk_tanisma_sinav"

      - id: "kaya_ilk_tanisma_tasiyici"
        paragraflar:
          - { tr: "Bütün gün su bidonu, yarasa leşi, hurda taşıyorsun. Kimse sana dönüp ikinci kez bakmıyor; tam da istediğin gibi.", en: "All day long you haul water jugs, bat carcasses, and scrap. Nobody looks at you twice. Exactly how you wanted it." }
          - { tr: "Akşam {npc:kaya_demir|in} çadırının önünden geçerken masadaki listeye gözün takılıyor. Üç sütun var: ÇEKİRDEK, YÜK, AĞIZ. Senin adın yük sütununda, yanında bir soru işareti.", en: "In the evening, walking past {npc:kaya_demir|pos} tent, you catch sight of the list on his table. Three columns: CORE, LOAD, MOUTHS. Your name's in the load column, with a question mark next to it." }
          - { tr: "En uzun sütun ağızlarınki. Bazı isimlerin üstü çizilmiş; neden çizildiklerini sormaya gerek yok.", en: "The mouths column is the longest. Some names have lines through them. You don't have to ask why." }
        secenekler:
          - id: "belli_etme"
            etiket: { tr: "Okuduğunu belli etme", en: "Don't let on that you read it" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "kaya_listesi"
              - gizle: 1
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Çadıra gir, listeyi ona sor", en: "Walk into the tent and ask him about the list" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - bilgi: "kaya_listesi"
              - iliski: { kaya_demir: { saygi: 5, guven: 2 } }
            sonraki: "kaya_ilk_tanisma_felsefe"
          - id: "agizlar"
            etiket: { tr: "Ağız sütunundakileri gizlice hekime götür", en: "Quietly walk the mouths column to the doctor" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - bilgi: "kaya_listesi"
              - itibar: { siginak: 5, lonca: -3 }
              - iliski: { kaya_demir: { guven: -5 }, elif_sari: { guven: 4, saygi: 3 } }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_rutbe"
        paragraflar:
          - { tr: "Pencereni açtığında sıra susuyor. {npc:kaya_demir} rakamları okurken yüzünde tek kas kıpırdamıyor, ama sağ eli kendiliğinden selama kalkıp yarı yolda kalakalıyor.", en: "When you open your window, the whole line goes quiet. {npc:kaya_demir} reads the numbers. Nothing on his face moves, but his right hand comes halfway up on its own, like it's going to salute, and stops there." }
          - { tr: "\"Sınav yok,\" diyor, elini indirip. \"Sana bant da vermeyeceğim. İkinci adamım ol; ben düşersem kamp senin.\"", en: "\"No test,\" he says, lowering the hand. \"No tape for you either. Be my number two, and if I go down, the camp's yours.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ana anahtarları uzatıyor. ya da sırtına hedef tahtası asıyor. askerler ikisini de aynı sesle yapar.", en: "h̷e's handing you the keys. or hanging a target on you. soldiers do both in the same tone of voice." }
        secenekler:
          - id: "ikinci"
            etiket: { tr: "Kabul et, ikinci adam ol", en: "Accept. Be his number two" }
            etkiler:
              - ahlak: { duzen: 5 }
              - itibar: { lonca: 12 }
              - iliski: { kaya_demir: { baglilik: 8, guven: 5 } }
              - bayrak: "lonca_saflarinda"
              - bayrak: "lonca_ikinci_adam"
              - dikkat: 2
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "\"Kimsenin ikincisi olmam.\"", en: "\"I'm nobody's number two.\"" }
            etkiler:
              - ahlak: { duzen: -3 }
              - iliski: { kaya_demir: { saygi: 4, guven: -3 } }
              - hafiza: { npc: "kaya_demir", id: "rutbeyi_reddetti", agirlik: 35 }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "komuta"
            tur: "gosteris"
            etiket: { tr: "\"İkinci değil. Birinci.\"", en: "\"Not number two. Number one.\"" }
            gerekli: { stat: { cha: 14 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - dikkat: 3
              - itibar: { lonca: 8 }
              - iliski: { kaya_demir: { korku: 10, saygi: 6, guven: -8 } }
              - npc_iz: { kaya_demir: "yara_izi" }
              - bayrak: "lonca_saflarinda"
              - bayrak: "lonca_komutasi_alindi"
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"

      - id: "kaya_ilk_tanisma_yenilgi"
        paragraflar:
          - { tr: "Bir yarasanın çığlığı kulak zarını deliyor ve çatıdan aşağı, alışveriş arabalarının üstüne düşüyorsun. Gözünü açtığında iki avcı seni saçaktan sürükleyip indirmiş.", en: "A bat's shriek punches through your eardrum and you fall off the roof onto the shopping carts. When you open your eyes, the two hunters have dragged you down off the eaves." }
          - { tr: "{npc:kaya_demir} başında dikiliyor. \"Bugün değil,\" diyor; sesinde ne alay var ne hayal kırıklığı. \"Ama bugün değil demek, hiçbir zaman demek değil.\"", en: "{npc:kaya_demir} stands over you. \"Not today,\" he says, no mockery in it, no disappointment either. \"But not today doesn't mean never.\"" }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Yarın yine geleceğini söyle", en: "Tell him you'll be back tomorrow" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - stat: { wil: 1 }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "tasiyici"
            etiket: { tr: "Şimdilik taşıyıcı ol", en: "Take the hauler job for now" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - itibar: { lonca: 3 }
              - gizle: 2
              - gun: 1
            sonraki: "kaya_ilk_tanisma_tasiyici"

      - id: "kaya_ilk_tanisma_kacis"
        paragraflar:
          - { tr: "Çatıdan geri çekiliyorsun; yarasalar saçağa kadar peşini bırakmıyor. Aşağıda {npc:kaya_demir} saatine bakıyor.", en: "You fall back from the roof, the bats chasing you right to the edge of the eaves. Down below, {npc:kaya_demir} is checking his watch." }
          - { tr: "\"Geri çekilmek de taktiktir,\" diyor. \"Çoğu zaman. Bir dahaki sefere hangisi olduğunu bana söylersin.\"", en: "\"Falling back's a tactic too,\" he says. \"Most of the time. Next time you tell me which one it was.\"" }
        secenekler:
          - id: "taktik"
            etiket: { tr: "\"Taktikti.\"", en: "\"It was a tactic.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"
          - id: "korku"
            etiket: { tr: "\"Korktum.\"", en: "\"I got scared.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { kaya_demir: { guven: 5, saygi: 1 } }
              - tohum: { olay: "kaya_gece_devriyesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "kaya_demir" } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Kaya ile gece devriyesi (tohum)
  - id: "kaya_gece_devriyesi"
    perde: [1]
    agirlik: 1
    etiketler: ["kamp", "lonca", "npc", "ahlak"]
    gerilim: 3
    npc: ["kaya_demir"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Gece devriyesi", en: "Night patrol" }
    sahne: "kaya_gece_devriyesi_1"
    sahneler:
      - id: "kaya_gece_devriyesi_1"
        paragraflar:
          - { tr: "Gece yarısı {npc:kaya_demir}, elinde fener, omzunda süngülü tüfeğiyle kamp ateşinin başında bitiveriyor. \"Devriyeye çıkıyoruz, ikimiz,\" diyor. \"Konuşacaklarımız var, ben de yürürken konuşurum.\"", en: "Around midnight, {npc:kaya_demir} shows up at your fire with a lantern in one hand and a bayoneted rifle on his shoulder. \"Patrol, just us two,\" he says. We've got things to talk about, and I talk better walking.\"" }
          - { tr: "Bir saat boyunca ağzını açtığı pek olmuyor. Derken kampın erzak çadırının arkasında durup feneri kısıyor: çadırın yanı kesilmiş, içeride bir pirinç çuvalının başında bir kadınla iki çocuk donakalmış.", en: "For an hour he barely says a word. Then, behind the camp's supply tent, he stops and dims the lantern. Someone's slit the side of the tent, and inside, frozen over a sack of rice, are a woman and two kids." }
          - { tr: "\"Kural belli,\" diyor {npc:kaya_demir}, sesini hiç yükseltmeden. \"Erzaktan çalan sürgün edilir. Ama bu gece kararı sen vereceksin; bunu bir sınav say.\"", en: "\"The rule's clear,\" {npc:kaya_demir} says, without raising his voice. \"Steal from stores, you get exiled. But tonight it's your call, so call it a test.\"" }
          - metin: { tr: "Kadının çocuklarından birinin adı ağız sütununun en altında duruyor; üstü daha çizilmemiş.", en: "One of the woman's kids is the last name in the mouths column. It hasn't been crossed out yet." }
            kosul: { bilgi: "kaya_listesi" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Çadırların gerisinden, ağaçların arasından bir hışırtı yaklaşıyor. Hırsızlar ya yalnız gelmemiş ya da peşlerine başka bir şey takılmış.", en: "Something's rustling closer through the trees behind the tents. Either the thieves didn't come alone, or something followed them in." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unun bir sınav olduğunu söyledi. hep öyle derler. ama asıl sınanan kim, hiç sordun mu?", en: "h̷e said it's a test. they always say that. ever ask who's really being tested?" }
        secenekler:
          - id: "surgun"
            etiket: { tr: "Kural kuraldır; sürgün et", en: "Rules are rules. Exile them" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -6 }
              - itibar: { lonca: 6, siginak: -3 }
              - iliski: { kaya_demir: { saygi: 6, guven: 4 } }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "kaya_gece_devriyesi_son"
          - id: "ort"
            etiket: { tr: "Görmezden gel; pirinci geri koysunlar, gitsinler", en: "Look the other way. Rice goes back, they go home" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - iliski: { kaya_demir: { saygi: -2, guven: -2 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "kaya_gece_devriyesi_son"
          - id: "payim"
            etiket: { tr: "\"Pirinci benim payımdan düş.\"", en: "Tell him to count the rice against your share" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
              - degisken: { hayatta_kalan: 1 }
              - can: -8
            sonraki: "kaya_gece_devriyesi_son"
          - id: "kural_degistir"
            etiket: { tr: "Kuralı değiştir: aç çocuk hırsız sayılmaz", en: "Change the rule: a hungry kid isn't a thief" }
            gerekli: { stat: { cha: 11 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - itibar: { lonca: 3, siginak: 4 }
              - iliski: { kaya_demir: { saygi: 8, guven: 2 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "lonca_muafiyet"
            sonraki: "kaya_gece_devriyesi_son"
          - id: "hisirti"
            etiket: { tr: "Hışırtıyı göster; karar beklesin", en: "Point at the rustling. The verdict can wait" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - savas: { dusmanlar: ["kanal_faresi", "kanal_faresi", "kanal_faresi"], ortam: ["karanlik"], kazan: "kaya_gece_devriyesi_hat", kaybet: "kaya_gece_devriyesi_yara", kac: "kaya_gece_devriyesi_yara" }

      - id: "kaya_gece_devriyesi_hat"
        paragraflar:
          - { tr: "Fareler çadırların arasından sel gibi akarken ikiniz sırt sırta vermiş, selin ortasında kaya gibi duruyorsunuz. {npc:kaya_demir} süngüsünü hiç acele etmeden kaldırıp indiriyor, kaldırıp indiriyor; saat gibi şaşmadan.", en: "The rats pour between the tents like a flash flood, and the two of you stand back to back in the middle of it like a rock. {npc:kaya_demir} raises the bayonet and brings it down without hurrying, up and down, up and down, like clockwork." }
          - { tr: "Son fare de kaçtığında kadınla iki çocuğu erzak çadırında, pirinç çuvalının arkasına sinmiş, ama sağ salim. {npc:kaya_demir} tüfeğini indirip ilk kez, bir anlığına gülümsüyor.", en: "When the last rat runs, the woman and her kids are still in the supply tent, hunkered down behind the rice sack. Alive. {npc:kaya_demir} lowers his rifle and, for one second, actually smiles." }
          - { tr: "\"Hattı tuttun; bunu her asker beceremez,\" diyor. Ardından çadıra dönüyor: \"Şimdi karar senin.\"", en: "\"You held the line, and not every soldier does,\" he says. Then he turns back to the tent: \"Now, your call.\"" }
        secenekler:
          - id: "cocuklar_kalsin"
            etiket: { tr: "\"Bu gece hattı onlar için tuttuk. Kalsınlar.\"", en: "\"We held the line for them tonight. They stay.\"" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - iliski: { kaya_demir: { saygi: 6, baglilik: 6, guven: 4 } }
              - hafiza: { npc: "kaya_demir", id: "hatti_tuttu", agirlik: 40 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "lonca_muafiyet"
            sonraki: "kaya_gece_devriyesi_son"
          - id: "kural_yine"
            etiket: { tr: "\"Kural yine kural.\" Sürgün et", en: "\"Rule's still the rule.\" Exile them" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -5 }
              - iliski: { kaya_demir: { saygi: 6, baglilik: 4 } }
              - hafiza: { npc: "kaya_demir", id: "hatti_tuttu", agirlik: 40 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "kaya_gece_devriyesi_son"

      - id: "kaya_gece_devriyesi_yara"
        paragraflar:
          - { tr: "Fareler fazla geliyor. Biri bacağına asılırken öteki fenerin camını kırıyor; karanlıkta {npc:kaya_demir|in} süngüsünün sesinden başka bir şey kalmıyor.", en: "Too many rats. One clamps onto your leg, another smashes the lantern glass, and in the dark there's nothing but the sound of {npc:kaya_demir|pos} bayonet." }
          - { tr: "Sabaha karşı fareler çekiliyor. Erzak çadırı yarı yarıya boşalmış; kadınla çocukları gitmiş, peşlerine düşen de yok.", en: "Toward dawn the rats pull back. The supply tent's half empty. The woman and her kids are gone, and nobody's chasing them." }
        secenekler:
          - id: "sar"
            etiket: { tr: "Yaranı sar, sessizce otur", en: "Bandage your leg and sit quietly" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 2 } }
              - can: 10
            sonraki: "kaya_gece_devriyesi_son"
          - id: "ara"
            etiket: { tr: "Kadını ve çocukları ormanda ara", en: "Search the woods for the woman and her kids" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
              - gun: 1
            sonraki: "kaya_gece_devriyesi_son"

      - id: "kaya_gece_devriyesi_son"
        paragraflar:
          - { tr: "Kampa dönerken {npc:kaya_demir} feneri yeniden yakıyor. \"Bir keresinde, buradan çok uzakta, bir emri yırttım ve pişman değilim,\" diyor, yüzünü sana çevirmeden. \"Ama o günden beri hangi kuralı yazsam, bir köşesini yırtılabilsin diye açık bırakırım.\"", en: "On the way back, {npc:kaya_demir} gets the lantern going again. \"I tore up an order once, a long way from here, and I don't regret it,\" he says, not looking at you. \"But ever since, every rule I write, I leave one corner where it can tear.\"" }
          - { tr: "\"Bu gece o köşeye ya dokundun ya dokunmadın. İkisini de not ettim.\"", en: "\"Tonight you either touched that corner or you didn't. I made a note either way.\"" }
        secenekler:
          - id: "sor"
            etiket: { tr: "Hangi emri yırttığını sor", en: "Ask him which order he tore up" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 3 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey sorma, yanında yürü", en: "Don't ask. Just walk beside him" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { kaya_demir: { saygi: 3 } }
            sonraki: "@akis"
          - id: "hekim"
            etiket: { tr: "Ona yemek katındaki hekimin oylamalarını anlat", en: "Tell him about the food court doctor's votes" }
            goster: { bayrak: "elif_hastanesi_bilinir" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - bayrak: "kaya_elif_koprusu"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "@akis"

  # ================================================================== ELİF — SAHRA HASTANESİ (Sığınak çekirdeği)
  - id: "elif_sahra_hastanesi"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 4, max: 18 }
    agirlik: 7
    etiketler: ["kamp", "siginak", "npc", "karsilasma"]
    gerilim: 2
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Yemek katındaki hastane", en: "The food court hospital" }
    sahne: "elif_sahra_hastanesi_1"
    sahneler:
      - id: "elif_sahra_hastanesi_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Çarşının yemek katı hastaneye çevrilmiş. Masalar yan yana itilip yatak yapılmış, serum torbaları YEMEK DÜNYASI tabelasının harflerine asılmış; hava çamaşır suyu ve eski kızartma yağı kokuyor.", en: "The mall's food court has turned into a hospital. Tables shoved together into beds, IV bags hung off the letters of the FOOD COURT sign, the air thick with bleach and old fryer oil." }
          - { tr: "Yaralıların alnına renkli bantlar yapıştırılmış: kırmızı, sarı, yeşil. Birkaç yatakta siyah bant var; o yatakların başında duran olmasa da her birinin yanına biri bir bardak su bırakmış.", en: "Every patient has a strip of colored tape on their forehead: red, yellow, green. A few cots have black tape. Nobody's standing by those, but somebody's left a glass of water next to every one." }
          - { tr: "Ortada, önlüğü kana bulanmış bir kadın bir yandan birinin bacağını dikiyor, bir yandan başka birine talimat veriyor; sesi alçak, elleri durmak bilmiyor. Seni görünce önce yaralarına, sonra yüzüne bakıyor.", en: "In the middle of it all, a woman in a bloodstained white coat is stitching up somebody's leg and giving orders to somebody else, voice low, hands never stopping. When she spots you, her eyes go to your wounds first. Then your face." }
          - { tr: "\"{npc:elif_sari|tam},\" diyor, iğneyi elinden bırakmadan. \"Kanaman yoksa bekle; varsa sırayı atla, bana söyle. Lamba tutabiliyorsan buraya gel.\"", en: "\"{npc:elif_sari|tam},\" she says, without setting down the needle. \"If you're not bleeding, wait; if you are, cut the line and tell me. If you can hold a lamp, get over here.\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Yeşil bantlıların yarısı aslında sarı. Hekim bunu biliyor ama yatak yetmediği için yeşil diyor.", en: "Half the green tapes should be yellow. The doctor knows it. She calls them green because she's out of beds." }
          - kosul: { stat: { wis: 9 } }
            metin: { tr: "Koğuşun öbür ucunda bir adam kolundaki ısırık izini bir bezle gizliyor. Isırığın kenarları kararmaya yüz tutmuş.", en: "At the far end of the ward, a man's hiding a bite on his arm under a rag. The edges are starting to go dark." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u kadın herkesi sayıyor. kapıdan girdiğin an seni de saydı. sana hangi rengi verdi, merak etmiyor musun?", en: "s̷he counts everybody. she counted you the second you walked in. don't you wonder what color she gave you?" }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Gözleri yaralarını arıyor ama bir tane bile bulamıyor. Kaşları bir milim kalkıyor; bunu bir yere not edeceği belli.", en: "She looks for your wounds and can't find a single one. Her eyebrows go up about a millimeter. She's going to write that down somewhere." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben su taşırım. Ya da başka bir şey. Burada bir işe yaramam lazım, yoksa delireceğim.\"", en: "\"I'll haul water. Or something. I need to do something in here or I'm going to lose it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Renk kodlu triyaj, bir de beyaz tahta. Bu kadın resmen sistem yöneticisi. Elindeki donanım bir insanla bir kalem.\"", en: "\"Color-coded triage. And a whiteboard. This woman is basically a sysadmin. With a human. And a marker.\"" }
        secenekler:
          - id: "lamba"
            etiket: { tr: "Lambayı tut, hekime yardım et", en: "Hold the lamp. Help the doctor" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "elif_hastanesi_bilinir"
              - degisken: { elif_tanidik: 1 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "elif_sahra_hastanesi_ameliyat"
          - id: "bekle"
            etiket: { tr: "Yaranı göster, sıranı bekle", en: "Show her your wound and wait your turn" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "elif_hastanesi_bilinir"
              - degisken: { elif_tanidik: 1 }
              - ahlak: { duzen: 3 }
              - can: 15
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "kan"
            tur: "gosteris"
            etiket: { tr: "Kanını ver; yaralının damarına senin kanın aksın", en: "Give blood. Let yours run into the patient" }
            gerekli: { stat: { end: 13 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "elif_hastanesi_bilinir"
              - degisken: { elif_tanidik: 1 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 1 }
            sonraki: "elif_sahra_hastanesi_kan"
          - id: "isirik"
            etiket: { tr: "Isırığını saklayan adamı ona göster", en: "Point out the man hiding the bite" }
            gerekli: { stat: { wis: 9 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "elif_hastanesi_bilinir"
              - degisken: { elif_tanidik: 1 }
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { elif_sari: { saygi: 6, guven: 3 } }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "git"
            etiket: { tr: "Yaranı kendin sar, uzak dur", en: "Patch yourself up and keep your distance" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "elif_hastanesi_bilinir"
              - degisken: { elif_tanidik: 1 }
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { elif_sari: { saygi: -2 } }
              - tohum: { olay: "hastane_karantina", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "@akis"

      - id: "elif_sahra_hastanesi_ameliyat"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Masadaki genç adamın karnına bir vitrin camı parçası saplanmış. {npc:elif_sari} lambayı tutmanı, sonra iki parmağını yaranın kenarına bastırmanı söylüyor. \"Bastır, daha sert. Canını yakıyorsan doğru yapıyorsun.\"", en: "The young guy on the table has a shard of display-window glass in his gut. {npc:elif_sari} tells you to hold the lamp, then press two fingers against the edge of the wound. \"Press harder; if it hurts him, you're doing it right.\"" }
          - { tr: "Lambanın ışığında kan simsiyah görünüyor. Bir yerden sızıyor; {npc:elif_sari} gözlerini kısıp dudağını ısırarak o yeri arıyor.", en: "In the lamplight the blood looks black. It's coming from somewhere. {npc:elif_sari} is hunting for it, squinting, biting her lip." }
        sezgiler:
          - kosul: { stat: { per: 11 } }
            metin: { tr: "Kanama camın sol ucunda değil; altında, damarın çatallandığı yerde.", en: "The bleed isn't at the left tip of the glass. It's underneath, where a vessel splits in two." }
        secenekler:
          - id: "bul"
            etiket: { tr: "Kanamanın yerini sen bul", en: "Find the bleeder yourself" }
            zar: { stat: "per", zorluk: 11, tek: true, basarisiz: "elif_sahra_hastanesi_kayip" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 8, guven: 6 } }
              - hafiza: { npc: "elif_sari", id: "olay:elif_sahra_hastanesi", agirlik: 25 }
              - degisken: { hayatta_kalan: 1 }
              - xp: 60
            sonraki: "elif_sahra_hastanesi_kurtuldu"
          - id: "tut"
            etiket: { tr: "Yalnızca lambayı tut; o bulur", en: "Just hold the lamp. She'll find it" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "elif_sahra_hastanesi_bacak"

      - id: "elif_sahra_hastanesi_kurtuldu"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Parmağınla gösteriyorsun; {npc:elif_sari} bir saniye bile duraksamıyor. Bir klemp, bir düğüm, bir düğüm daha… ve siyah sızıntı kesiliyor.", en: "You point. {npc:elif_sari} doesn't hesitate for a second. A clamp, a knot, another knot, and the black seep stops." }
          - { tr: "Eldivenlerini çıkarıp sana bakıyor. \"Bunu nereden bildin?\" diye soruyor ama cevabını beklemiyor; başını sallayıp sıradaki yatağa yürüyor. İki adım sonra dönüp \"Teşekkürler,\" diyor.", en: "She peels off her gloves and looks at you. \"How did you know that?\" she asks, and doesn't wait for an answer. She just nods and heads for the next cot, but two steps later she turns around and says, \"Thanks.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Peşinden sıradaki yatağa git", en: "Follow her to the next cot" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { elif_sari: { baglilik: 3 } }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "dinlen"
            etiket: { tr: "Ellerindeki kanı yıka, otur", en: "Wash the blood off your hands and sit down" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - stat: { wis: 1 }
            sonraki: "elif_sahra_hastanesi_oylama"

      - id: "elif_sahra_hastanesi_bacak"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:elif_sari} kanamayı buluyor; geç de olsa buluyor. Adamın karnı kurtuluyor ama cam içeri girerken başka bir şeyi de kesmiş: sol bacağı bir daha hiçbir şey hissetmeyecek.", en: "{npc:elif_sari} finds the bleed. Late, but she finds it. His gut's saved, but the glass cut something else on the way in, and his left leg won't ever feel anything again." }
          - { tr: "\"Yaşayacak,\" diyor eldivenlerini çıkarırken. \"Yürüyemeyecek ama yaşayacak. Bu dünyada ikisi arasındaki farkı bilen pek kimse kalmadı.\"", en: "\"He'll live,\" she says, peeling off her gloves. \"He won't walk. But he'll live, and there aren't many people left in this world who know the difference.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "Kal; koğuşta bir işe yara", en: "Stay. Make yourself useful on the ward" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "sorumluluk"
            etiket: { tr: "\"Daha dikkatli bakabilirdim.\"", en: "\"I could've looked harder.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { saygi: 3, baglilik: 2 } }
            sonraki: "elif_sahra_hastanesi_oylama"

      - id: "elif_sahra_hastanesi_kayip"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Yanlış yeri gösteriyorsun. {npc:elif_sari} bir saniye kaybediyor; burada bir saniye her şey demek.", en: "You point at the wrong spot. {npc:elif_sari} loses one second. Here, one second is everything." }
          - { tr: "Adamın nabzı parmaklarının altında yavaşlayıp duruyor. {npc:elif_sari} saate bakıp saati yüksek sesle söylüyor; ardından siyah bandı adamın alnına kendi eliyle yapıştırıp elini bir an göğsünde tutuyor.", en: "His pulse slows under your fingers, then stops. {npc:elif_sari} checks the clock and calls the time out loud. Then she puts the black tape on his forehead herself and leaves her hand on his chest for a moment." }
          - { tr: "\"Senin suçun değil,\" diyor, yüzüne bakmadan. \"Kendini suçlamak istiyorsan bunu dışarıda yap; burada ona yer yok.\"", en: "\"Not your fault,\" she says, without looking at you. \"If you want to feel like it was, go do that outside. We don't have room in here.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "Dışarı çıkma; sıradaki yatağa geç", en: "Don't go outside. Move on to the next cot" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - iliski: { elif_sari: { saygi: 5 } }
              - stat: { wil: 1 }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "su"
            etiket: { tr: "Siyah bantlı yatağa bir bardak su bırak", en: "Leave a glass of water by the black-tape cot" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { elif_sari: { baglilik: 3 } }
            sonraki: "elif_sahra_hastanesi_oylama"

      - id: "elif_sahra_hastanesi_kan"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:elif_sari} kolundan bir hat açıyor. Kanın plastik borunun içinde tuhaf bir hızla, acelesi varmış gibi akıyor; yaralının dudaklarına saniyeler içinde renk geliyor.", en: "{npc:elif_sari} runs a line out of your arm. Your blood moves through the tubing weirdly fast, like it's in a hurry. Within seconds, color's back in the patient's lips." }
          - { tr: "Sonra iki parmağını bileğine koyup saymaya başlıyor; bir duruyor, baştan alıyor.", en: "Then she puts two fingers on your wrist and starts counting. Stops counting. Starts over." }
          - { tr: "\"Nabzın dakikada otuz,\" diyor, sesi neredeyse duyulmayacak kadar alçak. \"Ama ayaktasın, gülümseyerek kan veriyorsun. Sen nesin?\"", en: "\"Your pulse is thirty a minute,\" she says, very quietly. \"And you're standing up, smiling, giving blood. What are you?\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷na söyleme. ya da söyle. ama söylersen o artık hekim olmaz, tanık olur.", en: "d̷on't tell her. or do. but if you do, she stops being a doctor and becomes a witness." }
        secenekler:
          - id: "saka"
            tur: "gizle"
            etiket: { tr: "\"Sistem beni seviyor.\" Gülümse", en: "\"The System likes me.\" Smile" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1 }
              - iliski: { elif_sari: { saygi: 4, guven: -2 } }
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "dogru"
            tur: "aciga_vur"
            etiket: { tr: "Ona doğruyu söyle: pencere bozuk geldi", en: "Tell her the truth: your window came broken" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 10, saygi: 6, korku: 3 } }
              - bayrak: "elif_anomaliyi_biliyor"
            sonraki: "elif_sahra_hastanesi_oylama"
          - id: "kolu_cek"
            etiket: { tr: "Kolunu çek, bir şey söyleme", en: "Pull your arm back. Say nothing" }
            etkiler:
              - ahlak: { duzen: -1 }
              - gizle: 1
              - iliski: { elif_sari: { guven: -3, korku: 2 } }
            sonraki: "elif_sahra_hastanesi_oylama"

      - id: "elif_sahra_hastanesi_oylama"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Akşama doğru koğuşun ortasına bir beyaz tahta çekiyorlar. Tepesinde kalemle KONSEY yazıyor, altında çentik çentik oylar.", en: "Toward evening, somebody wheels a whiteboard into the middle of the ward. Across the top, in marker: COUNCIL. Under it, tally marks." }
          - { tr: "Bugünkü soru, kolunda kararan bir ısırık taşıyan adam: içeride mi kalacak, dışarı mı çıkarılacak? Isırık dönüşürse bütün koğuş tehlikeye girer; dışarıdaysa adam sabahı göremez.", en: "Tonight's question is the man with the darkening bite on his arm: does he stay inside, or go out. If the bite turns, the whole ward's at risk. Outside, he won't see morning." }
          - { tr: "{npc:elif_sari} oy kullanmıyor. \"Ben hekimim. Hekim karar vermez, hakkında karar verilene bakar,\" diyor. Ama gözleri sende.", en: "{npc:elif_sari} doesn't vote. \"I'm the doctor, and doctors don't decide; we take care of whoever got decided about,\" she says. But her eyes are on you." }
          - { tr: "Tahtanın köşesine biri yarı şaka bir ad yazmış: {fraksiyon:siginak}. Silen olmamış.", en: "In the corner of the board, somebody's written a name, half as a joke: {fraksiyon:siginak}. Nobody's erased it." }
        sezgiler:
          - kosul: { stat: { wis: 12 } }
            metin: { tr: "Isırık canavar dişi değil, bir yarık sülüğünün emme ağzı. Derinin altında yumurtalar var. Temizlenirse adam yaşar.", en: "That bite's no fang. It's a rift leech's sucker mouth, and there are eggs under the skin. Clean it out and he lives." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Onu dışarı atarsak sıra kime gelecek? Bana mı? Sana mı?\"", en: "\"If we toss him out, who's next time? Me? You?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Risk analizi basit: ya biri ölür ya hepsi ölebilir. Basit. Ve korkunç. Ben çekimserim.\"", en: "\"Risk analysis is simple: one dies, or maybe everybody does. Simple. And horrible. I'm abstaining.\"" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "\"İçeride kalsın. Kapısında ben nöbet tutarım.\"", en: "\"He stays in. I'll stand watch at his door.\"" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 6, baglilik: 5 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_nobeti"
              - gun: 1
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"
          - id: "iceride"
            etiket: { tr: "İçeride kalsın diye oy ver", en: "Vote to keep him inside" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_iceride"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"
          - id: "disarida"
            etiket: { tr: "Dışarı çıkarılsın diye oy ver", en: "Vote to put him outside" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -5 }
              - itibar: { siginak: 2, lonca: 2 }
              - iliski: { elif_sari: { saygi: 2, guven: -4 } }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_disarida"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"
          - id: "sor"
            etiket: { tr: "Hekime sor: \"Sen olsan ne yapardın?\"", en: "Ask the doctor: \"What would you do?\"" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
            sonraki: "elif_sahra_hastanesi_fikir"
          - id: "temizle"
            tur: "gosteris"
            etiket: { tr: "Isırığı kendin aç, yumurtaları tek tek çıkar", en: "Open the bite yourself. Pull the eggs one by one" }
            gerekli: { stat: { wis: 12 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - dikkat: 3
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 10, korku: 3, guven: 4 } }
              - degisken: { hayatta_kalan: 1 }
              - efsane: "yabancilari_iyilestirdi"
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_cozuldu"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"

      - id: "elif_sahra_hastanesi_fikir"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:elif_sari} bir süre tahtaya bakıyor. \"İçeride tutardım. Bağlı, ayrı bir yatakta, başında bir nöbetçiyle,\" diyor. \"Yanılıyorsam da ilk ben ölürdüm; çünkü ona ilk ben bakardım.\"", en: "{npc:elif_sari} stares at the board for a while. \"I'd keep him in, restrained, separate cot, one person on watch,\" she says. \"And if I'm wrong, I'd die first, because I'd be the first one checking on him.\"" }
          - { tr: "\"Ama benim fikrim bir oy değil,\" diyor. \"Olmamalı da. Bir gün buraya bir lider gerekecek; o gün geldiğinde umarım bir hekim olmaz.\"", en: "\"But my opinion isn't a vote,\" she says. \"It shouldn't be. Someday this place is going to need a leader, and when that day comes, I hope it isn't a doctor.\"" }
        secenekler:
          - id: "onun_yolu"
            etiket: { tr: "Onun dediği gibi oy ver, nöbeti üstlen", en: "Vote her way, and take the watch yourself" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 6, baglilik: 6 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_nobeti"
              - gun: 1
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"
          - id: "lider"
            etiket: { tr: "\"Belki o lider sensin.\"", en: "\"Maybe you're the leader.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 4, baglilik: 4 } }
              - itibar: { siginak: 4 }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_iceride"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"
          - id: "risk"
            etiket: { tr: "\"Ölmeni istemem. Dışarı çıksın.\"", en: "\"I don't want you dying. He goes out.\"" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - iliski: { elif_sari: { baglilik: 3, guven: -2 } }
              - bayrak: "karantina_oylandi"
              - bayrak: "karantina_disarida"
              - tohum: { olay: "hastane_karantina", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "elif_sahra_hastanesi_son"

      - id: "elif_sahra_hastanesi_son"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Gece yemek katının ışıklarını kısıyorlar. {npc:elif_sari} bir tabureye çöküyor; on iki saattir ilk kez oturduğunu ancak otururken anlıyor.", en: "At night the food court lights get turned down. {npc:elif_sari} drops onto a stool and realizes, sitting there, that it's the first time she's sat down in twelve hours." }
          - { tr: "\"Alt kattaki eczanede hâlâ ilaç varmış ama tavanda bir şey olduğu için kimse gitmiyor,\" diyor, gözlerini kapatarak. \"Benim ellerim dikiş için. Seninkiler ne için, bilmiyorum.\"", en: "\"They say there's still medicine in the pharmacy downstairs, but nobody'll go, because there's something in the ceiling,\" she says, eyes closed. \"My hands are for stitching. What yours are for, I don't know.\"" }
          - metin: { tr: "Koğuşta üç gönüllü dikiş atmayı öğrendi. Bir haftalığına belki onsuz da idare ederler.", en: "Three volunteers on the ward have learned to stitch. For a week, maybe, they could manage without her." }
            kosul: { yoldas_yer: true }
        secenekler:
          - id: "yoldas"
            etiket: { tr: "Seferlere birlikte çıkmayı teklif et", en: "Ask her to come along on supply runs" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { elif_sari: { guven: 12 } } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { baglilik: 8, guven: 4 } }
              - yoldas_katil: "elif_sari"
              - bayrak: "elif_yoldas"
            sonraki: "elif_sahra_hastanesi_katilim"
          - id: "eczane"
            etiket: { tr: "\"Eczaneye ben giderim.\"", en: "\"I'll go to the pharmacy.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 4 } }
              - tohum: { olay: "eczane", gecikme: { min: 0, max: 2 } }
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Ona bir bardak su getir, sessizce çık", en: "Bring her a glass of water and slip out" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 3 } }
            sonraki: "@akis"
          - id: "uzak"
            etiket: { tr: "\"Benim ellerim kendi işime bakar.\"", en: "\"Mine are for my own business.\"" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
              - iliski: { elif_sari: { saygi: -2, baglilik: -2 } }
            sonraki: "@akis"

      - id: "elif_sahra_hastanesi_katilim"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "{npc:elif_sari} gözlerini açıp uzun uzun sana bakıyor. Sonra tabureden kalkıyor; neşterini gönüllülerden birine, beyaz tahta kalemini ötekine veriyor.", en: "{npc:elif_sari} opens her eyes and looks at you for a long moment. Then she gets up off the stool and hands her scalpel to one volunteer and the whiteboard marker to another." }
          - { tr: "\"Bir hafta. Sonra yeniden konuşuruz,\" deyip çantasına bir rulo bant, iki şişe alkol ve bir paket kurabiye koyuyor. \"Kurabiyeler benim. Sorma.\"", en: "\"One week, then we talk again,\" she says, and into her bag go a roll of tape, two bottles of rubbing alcohol, and a pack of cookies. \"The cookies are mine. Don't ask.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Kurabiyelere dokunmam. Söz.\"", en: "\"Won't touch the cookies. Promise.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "@akis"
          - id: "yuk"
            etiket: { tr: "Çantasını taşımayı teklif et", en: "Offer to carry her bag" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - iliski: { elif_sari: { baglilik: 2, saygi: 1 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ karantina (tohum)
  - id: "hastane_karantina"
    perde: [1]
    agirlik: 1
    etiketler: ["siginak", "npc", "ahlak"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Isırık", en: "The bite" }
    sahne: "hastane_karantina_1"
    sahneler:
      - id: "hastane_karantina_1"
        paragraflar:
          - metin: { tr: "Koğuşa nöbete döndüğün gece, saat üçte, kapısını beklediğin yatakta bir şey kıpırdıyor. Adamın kolundaki ısırık bir dudak gibi aralanıyor, içinden ince, ıslak, mavi bir şey sürünerek çıkıyor.", en: "The night you're back on watch at the ward, something moves on the cot you're guarding at three in the morning. The bite on the man's arm parts like a pair of lips, and something thin and blue and wet crawls out." }
            kosul: { bayrak: "karantina_nobeti" }
          - metin: { tr: "Koğuşa döndüğün gece yarısı bir çığlık kopuyor. Bağlı yatağın çevresindeki çarşaflar kıpırdıyor; adamın kolundaki ısırık açılmış, içinden mavi sülükler birbiri ardına yere dökülüyor.", en: "The night you're back at the ward, a scream goes up around midnight. The sheets around the restrained cot are moving. The bite on his arm has split open, and blue leeches are spilling out onto the floor one after another." }
            kosul: { bayrak: "karantina_iceride" }
          - metin: { tr: "Yemek katına döndüğün sabah adamı kapının önünde buluyorsun; gece soğukta, tek başına ölmüş. Kolundaki ısırık açılmış, içinden çıkan mavi sülükler kepengin altından koğuşa doğru sürünüyor.", en: "The morning you get back to the food court, you find him outside the doors. He died out there in the cold, alone. The bite on his arm is split open, and the blue leeches that came out of it are crawling under the shutter, toward the ward." }
            kosul: { bayrak: "karantina_disarida" }
          - metin: { tr: "Koğuşa uğradığında, ısırığını temizlediğin adamı elinde bir tepsiyle görüyorsun. Kolunda temiz bir sargı var; seni görünce tepsiyi bir hemşire gibi dengeleyip başıyla selam veriyor.", en: "When you stop by the ward, the man whose bite you cleaned out is carrying a tray. There's a clean bandage on his arm. When he sees you he balances the tray like a nurse and dips his head." }
            kosul: { bayrak: "karantina_cozuldu" }
          - metin: { tr: "\"Artık gönüllü,\" diyor {npc:elif_sari}. \"Kendi istedi. Ölmeyi beklediği yatağın yanında oturup başkalarının ölümünü bekliyor, kimse ölmesin diye de elinden geleni yapıyor.\"", en: "\"He's a volunteer now,\" {npc:elif_sari} says. \"His own idea. He sits by the cot where he expected to die and waits on other people's dying, and tries his hardest to make sure nobody does.\"" }
            kosul: { bayrak: "karantina_cozuldu" }
          - metin: { tr: "Sen koğuşa uğramışken kolunda kararan bir ısırıkla bir adam getiriyorlar. {npc:elif_sari} ona bakınca yüzünü buruşturuyor, sonra bir şey görüp donakalıyor: ısırığın altında bir şey kıpırdıyor.", en: "You're stopping by the ward when they bring in a man with a bite going dark on his arm. {npc:elif_sari} takes one look and winces. Then she notices something and freezes: something's moving under the skin." }
            kosul: { bayrak_yok: "karantina_oylandi" }
          - metin: { tr: "Bir saniye sonra deri yırtılıyor, mavi sülükler yatağın kenarından taşmaya başlıyor.", en: "A second later the skin tears, and blue leeches come spilling over the side of the cot." }
            kosul: { bayrak_yok: "karantina_oylandi" }
          - metin: { tr: "Koğuşta biri ışıkları yakıyor. {npc:elif_sari} çoktan ayağa fırlamış; bir elinde neşter, öbüründe tabure, ikisinin de işe yarayacağından emin değil.", en: "Somebody hits the ward lights. {npc:elif_sari} is already on her feet, a scalpel in one hand and a stool in the other, not sure either one's going to help." }
            kosul: { bayrak_yok: "karantina_cozuldu" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Sülükler sıcağa gidiyor. Koğuşun en sıcak yeri, ortadaki ateşli çocukların yatakları.", en: "The leeches go for heat. The warmest spot on the ward is the row of feverish kids in the middle." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ylar, kurallar, nöbetler. sülükler hiçbirini okumadı.", en: "v̷otes, rules, watches. the leeches didn't read any of it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Çocukları ben alırım! Sen o şeyleri durdur!\"", en: "\"I've got the kids! You stop those things!\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sülüklerin önüne geç", en: "Get between the leeches and everyone else" }
            goster: { bayrak_yok: "karantina_cozuldu" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - savas: { dusmanlar: ["yarik_sulugu", "yarik_sulugu"], ortam: ["dar_gecit"], kazan: "hastane_karantina_temiz", kaybet: "hastane_karantina_bedel", kac: "hastane_karantina_bedel" }
          - id: "ates"
            etiket: { tr: "Bir ateş şişesiyle sülüklerin yolunu kes", en: "Cut the leeches off with a firebomb" }
            goster: { bayrak_yok: "karantina_cozuldu" }
            gerekli: { esya: { ates_sisesi: 1 } }
            etkiler:
              - esya: { ates_sisesi: -1 }
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { elif_sari: { saygi: 4 } }
            sonraki: "hastane_karantina_temiz"
          - id: "cocuklar"
            etiket: { tr: "Önce ateşli çocukları koğuştan çıkar", en: "Get the feverish kids off the ward first" }
            goster: { bayrak_yok: "karantina_cozuldu" }
            gerekli: { stat: { per: 9 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { elif_sari: { guven: 5 } }
              - savas: { dusmanlar: ["yarik_sulugu"], ortam: ["dar_gecit"], kazan: "hastane_karantina_temiz", kaybet: "hastane_karantina_bedel", kac: "hastane_karantina_bedel" }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Sülüklerin hepsini tek adımda ez", en: "Crush every last leech in a single stomp" }
            goster: { bayrak_yok: "karantina_cozuldu" }
            gerekli: { stat: { agi: 15 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - dikkat: 3
              - iliski: { elif_sari: { saygi: 8, korku: 4 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "hastane_karantina_temiz"
          - id: "tesekkur"
            etiket: { tr: "Gönüllünün tepsisinden bir bardak çay al", en: "Take a cup of tea off the volunteer's tray" }
            goster: { bayrak: "karantina_cozuldu" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - stat: { wis: 1 }
            sonraki: "@akis"
          - id: "elif_ile"
            etiket: { tr: "{npc:elif_sari|le} koğuşu bir tur dolaş", en: "Walk the ward once with {npc:elif_sari}" }
            goster: { bayrak: "karantina_cozuldu" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 6, guven: 3 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 25 }
            sonraki: "hastane_karantina_tur"
          - id: "sor"
            etiket: { tr: "Sülüklerin nereden geldiğini sor", en: "Ask her where the leeches came from" }
            goster: { bayrak: "karantina_cozuldu" }
            etkiler:
              - ahlak: { duzen: 2 }
              - tohum: { olay: "su_baskini", gecikme: { min: 0, max: 2 } }
            sonraki: "@akis"

      - id: "hastane_karantina_temiz"
        paragraflar:
          - { tr: "Son sülük çatırdayarak kuruyor. Koğuşun zemini ıslak, mavi lekelerle dolu ama yataklar sağlam; ateşli çocuklar hâlâ uyuyor, kimisi hiçbir şey olmamış gibi.", en: "The last leech crackles and dries up. The floor is wet and streaked blue, but the cots are intact. The feverish kids are still asleep, some of them like nothing happened at all." }
          - metin: { tr: "Isırık taşıyan adam yatağında; zayıf, solgun ama sağ. Sen nöbette olduğun için sülükler onu bitiremeden dışarı çıkmak zorunda kaldı.", en: "The man with the bite is still on his cot. Weak and pale, but alive. Because you were on watch, the leeches had to come out before they could finish him." }
            kosul: { bayrak: "karantina_nobeti" }
          - metin: { tr: "Isırık taşıyan adamın yatağında kimse kalmamış, yalnızca bir kabuk. {npc:elif_sari} çarşafı adamın yüzüne çekip bir süre öylece duruyor.", en: "There's nobody left on the bitten man's cot now. Just a husk. {npc:elif_sari} pulls the sheet up over his face and stands there for a while." }
            kosul: { bayrak_yok: "karantina_nobeti" }
          - { tr: "\"Bunların nereden geldiğini bulmamız lazım,\" diyor {npc:elif_sari}, sesini toparlayarak. \"İstasyonun altından su geliyormuş. Belki bunlar da oradan geliyor.\"", en: "\"We need to find out where these are coming from,\" {npc:elif_sari} says, pulling her voice together. \"There's water coming up from under the station. Maybe they are too.\"" }
        secenekler:
          - id: "istasyon"
            etiket: { tr: "İstasyonun altındaki suya bakacağına söz ver", en: "Promise to check the water under the station" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - iliski: { elif_sari: { guven: 5 } }
              - tohum: { olay: "su_baskini", gecikme: { min: 0, max: 2 } }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Bu gece de koğuşta kal", en: "Stay on the ward tonight too" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 6 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
              - degisken: { hayatta_kalan: 1 }
              - gun: 1
            sonraki: "@akis"
          - id: "oy"
            etiket: { tr: "\"Bir dahaki oylamada bunu unutmayın.\"", en: "\"Remember this next time you vote.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"

      - id: "hastane_karantina_bedel"
        paragraflar:
          - { tr: "Sülükler aranızdan sıyrılıp kayıyor. Biri koğuşun ortasındaki yataklara varıyor ve bir çocuğun çığlığı bütün yemek katını dolduruyor.", en: "The leeches slip right past you. One of them reaches the cots in the middle of the ward, and a kid's scream fills the whole food court." }
          - { tr: "{npc:elif_sari} sülüğü çıplak elleriyle çocuğun bacağından söküp yere çarpıyor; avucu kanıyor ama dönüp bakmıyor bile. Sabaha kadar iki kişiyi kaybediyorsunuz.", en: "{npc:elif_sari} tears it off the kid's leg with her bare hands and slams it on the floor. Her palm's bleeding, and she doesn't even look. By morning you've lost two people." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Sabaha kadar ona yardım et", en: "Help her until morning" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { guven: 3, baglilik: 4 } }
              - degisken: { hayatta_kalan: -2 }
              - gun: 1
            sonraki: "@akis"
          - id: "istasyon"
            etiket: { tr: "Kaynağı bul; istasyonun altına in", en: "Find the source. Go under the station" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "su_baskini", gecikme: { min: 0, max: 1 } }
            sonraki: "@akis"

      - id: "hastane_karantina_tur"
        paragraflar:
          - { tr: "{npc:elif_sari} her yatağın başında birkaç saniye duruyor; birinin alnına dokunuyor, birinin sargısını düzeltiyor, birinin adını fısıldıyor. Hepsinin adını biliyor.", en: "{npc:elif_sari} stops at every cot for a few seconds. Touches a forehead, straightens a bandage, whispers a name. She knows every single one." }
          - { tr: "Son yatağın başında durup sana dönüyor: \"Biliyor musun, eskiden acilde bir gecede kimsenin adını öğrenmezdim. Şimdi unutamıyorum.\"", en: "At the last cot, she stops and turns to you. \"You know, in the ER I never learned anybody's name in a night,\" she says. \"Now I can't forget them.\"" }
        secenekler:
          - id: "isimler"
            etiket: { tr: "\"O zaman ben de öğrenirim.\"", en: "\"Then I'll learn them too.\"" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { elif_sari: { baglilik: 5, guven: 3 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey söyleme, elini omzuna koy", en: "Don't say anything. Put a hand on her shoulder" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 3 } }
            sonraki: "@akis"

  # ================================================================== VAHİT — VAAZ (Yükselenler çekirdeği)
  - id: "vahit_vaaz"
    perde: [1]
    gun: { min: 7, max: 20 }
    agirlik: 6
    etiketler: ["kamp", "yukselenler", "npc", "karsilasma"]
    gerilim: 2
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Derme çatma kürsüdeki vaiz", en: "The preacher on the makeshift pulpit" }
    sahne: "vahit_vaaz_1"
    sahneler:
      - id: "vahit_vaaz_1"
        paragraflar:
          - metin: { tr: "Çarşının kurumuş fıskiyesinin başında kırk kişilik bir halka bir adamın çevresine toplanmış. Adam ters çevrilmiş bir alışveriş arabasını kürsü yapmış; mikrofonsuz da olsa sesi her kulağa ulaşıyor, sanki havada ona ayrılmış bir kanal varmış gibi.", en: "A ring of forty people has gathered around one man at the mall's dry fountain. He's standing on a pulpit made from an upturned shopping cart, and even without a mic his voice gets into every ear, like the air saved a channel just for him." }
            kosul: { bolge: "harabe_carsi" }
          - metin: { tr: "İstasyonun bilet salonunda kırk kişilik bir halka bir adamın çevresine toplanmış. Adam devrilmiş bir bilet makinesini kürsü yapmış; mikrofonsuz da olsa sesi her kulağa ulaşıyor, sanki havada ona ayrılmış bir kanal varmış gibi.", en: "A ring of forty people has gathered around one man in the station's ticket hall. He's standing on a pulpit made from a toppled ticket machine, and even without a mic his voice gets into every ear, like the air saved a channel just for him." }
            kosul: { bolge: "kirik_istasyon" }
          - metin: { tr: "Sisin seyreldiği bir açıklıkta kırk kişilik bir halka bir adamın çevresine toplanmış. Adam devrik bir kütüğü kürsü yapmış; mikrofonsuz da olsa sesi her kulağa ulaşıyor, sanki havada ona ayrılmış bir kanal varmış gibi.", en: "A ring of forty people has gathered around one man in a clearing where the fog thins out. He's standing on a pulpit made from a fallen log, and even without a mic his voice gets into every ear, like the air saved a channel just for him." }
            kosul: { bolge: "ogretici_orman" }
          - metin: { tr: "Halkanın kenarında beyazlar giymiş birkaç kişi nöbet tutuyor. Ormanda kayıp çocukları \"ışığa\" götüren beyazlı adam geliyor aklına; o ışık burası olabilir.", en: "A few people dressed all in white keep watch at the edge of the ring. You remember the man in white leading lost kids in the woods \"to the light.\" This might be the light." }
            kosul: { bilgi: "beyazli_adam" }
          - { tr: "\"Sistem bir ceza değil kardeşlerim,\" diyor. \"Bir ayna. Kimin seçildiğini, kimin yakıt olduğunu gösterir. Aynaya kızmak da insanın en eski hatasıdır.\"", en: "\"The System isn't a punishment, friends,\" he says. \"It's a mirror that shows who's been chosen and who's fuel. And getting mad at a mirror is the oldest mistake in the book.\"" }
          - { tr: "Ardından gökyüzünü gösterip \"Şimdi,\" diyor; tam o anda göğün mavi panellerinden birinde yeni bir bildirim beliriyor. Kalabalıkta bir inilti dolaşırken biri adını fısıldıyor: {npc:vahit|tam}.", en: "Then he points at the sky. \"Now,\" he says, and right on cue, a fresh notice blinks onto one of the blue panels overhead. A moan rolls through the crowd, and somebody whispers his name: {npc:vahit|tam}." }
          - { tr: "Gözlerini kalabalığın üstünde gezdirip sende durduruyor. Seni yıllardır tanıyormuş gibi gülümsüyor. \"İşte,\" diyor, \"Sistem'in dün gece bana sözünü ettiği kişi.\"", en: "His eyes sweep across the crowd and stop on you. He smiles like he's known you for years. \"And there,\" he says, \"the one the System told me about last night.\"" }
        sezgiler:
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Göğün panellerinin kenarı, bildirim gelmeden iki saniye önce belli belirsiz titriyor. Adam oraya bakıyordu. Ya da bakmıyordu; emin olamıyorsun.", en: "The edges of the sky panels shimmer, just barely, about two seconds before a notice drops. He was looking right there. Or he wasn't. You can't be sure." }
          - kosul: { stat: { wil: 9 } }
            metin: { tr: "Sesi dalga dalga ilerleyip aklının boşluklarını doldurmaya çalışıyor. İraden dalgakıran gibi karşısına dikilince dalga geri çekiliyor.", en: "His voice moves like a wave, trying to fill every gap in your head. Your will stands there like a breakwater, and the wave pulls back." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷en ona bir şey söylemedim. ben... sanmıyorum. hayır. söylemedim.", en: "i̷ didn't tell him anything. i... don't think i did. no. i didn't." }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Sana bakarken gülümsemesinin altında bir şey titriyor. Aynasında kendinden büyük bir şey gördü; şimdiden onu nasıl pazarlayacağını hesaplıyor.", en: "He's looking at you, and something trembles under that smile. He just saw something bigger than himself in his mirror, and he's already working out how to sell it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Neden herkes ona inanıyor? Neden... neden ben de biraz inanmak istiyorum?\"", en: "\"Why does everybody believe him? Why do I... kind of want to believe him too?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Soldaki kadın anemik. Arkadaki çocuk dehidrate. Bu adam da kalkmış onlardan ekmek istiyor.\"", en: "\"The woman on the left is anemic. The kid in the back is dehydrated. And that man wants their bread.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Panel gecikmesini biliyor, o kadar. Değil mi? Değil mi? Lütfen o kadar olsun.\"", en: "\"He knows about the panel latency. That's all it is. Right? Right? Please let that be all it is.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Sonuna kadar dinle", en: "Hear him out to the end" }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - ahlak: { duzen: 1 }
              - iliski: { vahit: { saygi: 2 } }
            sonraki: "vahit_vaaz_sunu"
          - id: "gul"
            etiket: { tr: "Vaazın ortasında yüksek sesle gül", en: "Laugh out loud in the middle of his sermon" }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - ahlak: { insanlik: 2, duzen: -2 }
              - itibar: { yukselenler: -5 }
              - iliski: { vahit: { guven: -5, saygi: 3 } }
              - hafiza: { npc: "vahit", id: "vaazda_guldu", agirlik: -25 }
            sonraki: "vahit_vaaz_gul"
          - id: "ima"
            tur: "aciga_vur"
            etiket: { tr: "Sistem'in sana da fısıldadığını ima et", en: "Hint that the System whispers to you too" }
            gerekli: { stat: { cha: 8 } }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - aciga_vur: true
              - ahlak: { duzen: -1, insanlik: -2 }
              - itibar: { yukselenler: 8 }
              - iliski: { vahit: { saygi: 10, baglilik: 5 } }
              - hafiza: { npc: "vahit", id: "sesi_dogruladi", agirlik: 35 }
            sonraki: "vahit_vaaz_secilmis"
          - id: "ifsa"
            etiket: { tr: "Göğün titreşimini göster; hilesini ifşa et", en: "Point out the sky shimmer. Expose his trick" }
            gerekli: { stat: { per: 10 } }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - ahlak: { duzen: 2, insanlik: 2 }
              - bilgi: "vahit_isik_hilesi"
            sonraki: "vahit_vaaz_ifsa"
          - id: "cal"
            tur: "gosteris"
            etiket: { tr: "Kalabalığı tek cümleyle elinden al", en: "Steal the crowd from him with one sentence" }
            gerekli: { stat: { cha: 15 } }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - ahlak: { duzen: -2, insanlik: -1 }
              - dikkat: 4
              - itibar: { yukselenler: 10 }
              - iliski: { vahit: { korku: 8, saygi: 10, baglilik: 6 } }
            sonraki: "vahit_vaaz_calmak"
          - id: "git"
            etiket: { tr: "Kalabalıktan sessizce ayrıl", en: "Slip quietly out of the crowd" }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_vaazi_dinlendi"
              - ahlak: { duzen: 1 }
              - iliski: { vahit: { saygi: -2 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"

      - id: "vahit_vaaz_sunu"
        paragraflar:
          - { tr: "Vaazın sonunda {npc:vahit} kalabalığı ikiye ayırıyor: seviyesi beşin üstündekiler sağa, altındakiler sola. Soldakilerin önüne boş bir çuval bırakılıyor.", en: "At the end of the sermon, {npc:vahit} splits the crowd in two: level five and up to the right, everybody else to the left. An empty sack gets set down in front of the left side." }
          - { tr: "\"Yakıt olmak utanılacak bir şey değil,\" diyor yumuşacık bir sesle. \"Ateş olmazsa kimse ısınmaz. Verin ki seçilmişler yükselsin; onlar yükselince sizi de yukarı çekecekler.\"", en: "\"Being fuel is nothing to be ashamed of,\" he says gently. \"Without the fire, nobody stays warm. Give, so the Chosen can rise, and when they rise, they'll pull you up after them.\"" }
          - { tr: "Soldakiler birer birer ekmeklerini, iksirlerini, çekirdeklerini çuvala atıyor. En sona, bir eli sargılı, zayıf bir kadın kalmış; son ekmeğini tutuyor, bir türlü bırakamıyor.", en: "One by one, the left side drops their bread, their potions, their cores into the sack. Last in line is a thin woman with one hand bandaged. She's holding her last piece of bread and she can't let go of it." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Çuval dolunca sağdakilerden ikisi onu kampın arkasına taşıyor. Payları bölüştüren yok; çuval tek bir çadıra giriyor.", en: "When the sack's full, two of the right-side folks carry it off behind the camp. Nobody divides it up. The sack goes into exactly one tent." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eçilmiş ve yakıt. sistem böyle bir ayrım yapmıyor. ama yapsaydı seni hangi tarafa koyardı, hiç düşündün mü?", en: "c̷hosen and fuel. the system doesn't sort people like that. but if it did, which side would it put you on? ever think about that?" }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadının önüne geç; ekmeğini vermeyecek", en: "Step in front of her. She keeps her bread" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - itibar: { yukselenler: -6, siginak: 3 }
              - iliski: { vahit: { guven: -8, saygi: 3 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: -30 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "yakit_kadin_kurtarildi"
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 5 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "payini_at"
            etiket: { tr: "Kendi payını çuvala at", en: "Toss your own share in the sack" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { yukselenler: 5 }
              - iliski: { vahit: { saygi: 4, guven: 3 } }
              - can: -5
            sonraki: "@akis"
          - id: "saga"
            etiket: { tr: "Sağa geç, seçilmişlerin arasında dur", en: "Cross to the right. Stand with the Chosen" }
            gerekli: { gorunen_seviye_min: 5 }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -3 }
              - itibar: { yukselenler: 8 }
              - iliski: { vahit: { baglilik: 5, saygi: 4 } }
              - bayrak: "secilmislere_katildi"
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 5 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "sola"
            tur: "gizle"
            etiket: { tr: "Sola geç, yakıtın yanında dur", en: "Cross to the left. Stand with the fuel" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { vahit: { saygi: -2 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "hekime"
            etiket: { tr: "Soldakileri yemek katındaki hekime davet et", en: "Invite the left side to the food court doctor" }
            goster: { bayrak: "elif_hastanesi_bilinir" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 4, yukselenler: -4 }
              - iliski: { vahit: { guven: -4 }, elif_sari: { guven: 3 } }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"

      - id: "vahit_vaaz_gul"
        paragraflar:
          - { tr: "Kahkahan halkanın ortasına taş gibi düşüyor. Kırk yüz birden sana dönüyor; kimi öfkeli, kimi korkmuş, birkaçı da için için rahatlamış.", en: "Your laugh lands in the middle of that ring like a rock. Forty faces turn your way. Some are angry, some are scared, and a few of them, secretly, look relieved." }
          - { tr: "{npc:vahit} kızmıyor, gülümsemesi yalnızca genişliyor. \"Gülün,\" diyor kalabalığa. \"Gülmek korkunun en dürüst yüzüdür. Sistem bana birinin güleceğini söylemişti.\"", en: "{npc:vahit} doesn't get angry; his smile just gets wider. \"Laugh,\" he tells the crowd, \"laughter is the most honest face fear has. The System told me someone would laugh.\"" }
        secenekler:
          - id: "soru"
            etiket: { tr: "\"Peki Sistem sana benim hakkımda ne dedi?\"", en: "\"So what did the System say about me?\"" }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "vahit_vaaz_soru"
          - id: "gulmeye_devam"
            etiket: { tr: "Gülmeye devam ederek çekip git", en: "Keep laughing and walk away" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - itibar: { yukselenler: -3 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Özür dile; korkmuş insanlarla alay edilmez", en: "Apologize. You don't mock scared people" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { vahit: { saygi: 2, guven: 3 } }
            sonraki: "@akis"

      - id: "vahit_vaaz_soru"
        paragraflar:
          - { tr: "{npc:vahit} kürsüsünden iniyor; kalabalık önünde yol açarken sana yaklaşıp kulağına eğiliyor. Sesi artık yalnızca senin için.", en: "{npc:vahit} steps down off his pulpit and walks toward you, the crowd parting to let him through. He leans in close to your ear. Now his voice is just for you." }
          - { tr: "\"Entegrasyon anında pencerenin bozuk geldiğini söyledi; bir satırın titrediğini,\" diye fısıldıyor. Sonra geri çekilip göz kırpıyor. \"Ama belki de ben iyi bir tahminciyimdir. Sen karar ver.\"", en: "\"It said your window came in broken right at Integration, one line glitching,\" he whispers. Then he pulls back and winks. \"But maybe I'm just a good guesser, so you decide.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu nereden bilebilir? o gün çevrende yüzlerce kişi vardı; biri görmüş olabilir. olabilir, değil mi?", en: "h̷ow could he know that? there were hundreds of people around you that day, and somebody could have seen it. could have, right?" }
        secenekler:
          - id: "tehdit"
            etiket: { tr: "Yakasından tut: \"Bunu kimden duydun?\"", en: "Grab his collar: \"Who told you that?\"" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -2 }
              - dikkat: 2
              - iliski: { vahit: { korku: 10, guven: -6 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 5 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "inkar"
            tur: "gizle"
            etiket: { tr: "Omuz silk: \"Herkesin penceresi titredi.\"", en: "Shrug: \"Everybody's window glitched.\"" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1 }
              - iliski: { vahit: { saygi: 2 } }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme; gözlerinin içine bak ve git", en: "Say nothing. Hold his eyes, then go" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { vahit: { saygi: 5, korku: 3 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"

      - id: "vahit_vaaz_secilmis"
        paragraflar:
          - { tr: "Sözlerin bitmeden {npc:vahit} kürsüsünden atlayıp ellerini tutuyor; avuçları sıcak ve nemli, gözleri yaşlı.", en: "Before you've even finished, {npc:vahit} jumps down from his pulpit and takes your hands. His palms are hot and damp. His eyes are wet." }
          - { tr: "\"Biliyordum! Üç gecedir ses bana bir yabancıdan söz ediyordu,\" diyor, sesi titreyerek. \"Gel, iç halkaya. Sen bana onun sana ne dediğini anlat, ben de sana bana ne dediğini; belki birlikte bütün cümleyi duyarız.\"", en: "\"I knew it—three nights now the voice has been telling me about a stranger,\" he says, voice shaking. \"Come, inner circle. You tell me what it says to you, I'll tell you what it says to me, and together, maybe, we'll finally hear the whole sentence.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ütün cümleyi duymak istiyor. bütün cümle ben miyim? bunu ona söyleme. lütfen.", en: "h̷e wants to hear the whole sentence. am i the whole sentence? don't tell him that. please." }
        secenekler:
          - id: "ic_halka"
            etiket: { tr: "Davetini kabul et", en: "Accept his invitation" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { baglilik: 6, guven: 5 } }
              - bayrak: "secilmislere_katildi"
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "sina"
            etiket: { tr: "\"Önce sen. Dün gece ne dedi?\"", en: "\"You first. What did it say last night?\"" }
            zar: { stat: "wil", zorluk: 12, tek: true, basarisiz: "vahit_vaaz_sina_yok", basarisiz_etkiler: [{ iliski: { vahit: { baglilik: 4 } } }, { ahlak: { insanlik: -1 } }] }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - bilgi: "vahit_isik_hilesi"
              - iliski: { vahit: { korku: 5, saygi: 3 } }
            sonraki: "@akis"
          - id: "geri_cek"
            etiket: { tr: "Ellerini geri çek; bu bir hataydı", en: "Pull your hands back. That was a mistake" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - gizle: 1
              - iliski: { vahit: { guven: -3 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"

      - id: "vahit_vaaz_sina_yok"
        paragraflar:
          - { tr: "Soruyu soruyorsun; {npc:vahit} yalnızca gülümseyip gözlerini gözlerine dikiyor. Bir an cevabı senin vermen gerekiyormuş gibi hissediyorsun, dilinin ucuna bir şey geliyor.", en: "You ask. {npc:vahit} just smiles and holds your eyes. For a second it feels like you're the one who's supposed to answer, and something rises to the tip of your tongue." }
          - { tr: "Kendini toparladığında ellerin hâlâ onun avuçlarında. O da bir şey duymuş gibi başını sallıyor.", en: "When you pull yourself together, your hands are still in his. He nods like he heard something." }
        secenekler:
          - id: "cek"
            etiket: { tr: "Ellerini çek, uzaklaş", en: "Pull your hands free and back off" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gizle: 1
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Kal, dinlemeyi sürdür", en: "Stay. Keep listening" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { baglilik: 3 } }
            sonraki: "@akis"

      - id: "vahit_vaaz_ifsa"
        paragraflar:
          - { tr: "Göğü gösteriyorsun: \"Bir sonraki bildirimden önce panelin kenarına bakın.\" Kırk baş birden yukarı kalkıyor; panelin kenarı tam dediğin gibi titriyor, iki saniye sonra da bildirim düşüyor.", en: "You point up at the sky: \"Before the next notice, watch the edge of the panel.\" Forty heads tilt back at once, and the panel's edge shimmers just like you said. Two seconds later, the notice drops." }
          - { tr: "Halkada bir mırıltı dolaşıyor. {npc:vahit} bir an susuyor, sonra kollarını iki yana açıyor. \"Evet, gök titrer, çünkü Sistem konuşmadan önce nefes alır!\" diyor. \"Siz titremeyi görürsünüz; ben nefesi duyarım.\"", en: "A murmur moves through the ring, and {npc:vahit} goes quiet for one second before he throws his arms wide. \"Yes, the sky shivers, because the System takes a breath before it speaks!\" he says. \"You see the shiver; I hear the breath.\"" }
          - { tr: "Kalabalığın yarısı yeniden ona dönüyor, öbür yarısıysa bir anlığına sana.", en: "Half the crowd turns back to him. The other half, for a second, turns to you." }
        secenekler:
          - id: "ikna"
            etiket: { tr: "O yarıya seslen: \"Ekmeğinizi vermeden önce bir düşünün\"", en: "Talk to that half: \"Think before you give him bread\"" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "vahit_vaaz_tas", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { yukselenler: -6, siginak: 2 }
              - iliski: { vahit: { korku: 4, saygi: 6, guven: -8 } }
              - hafiza: { npc: "vahit", id: "olay:vahit_vaaz", agirlik: -30 }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Yeter; bırak kendi gözleriyle görsünler", en: "That's enough. Let them see it for themselves" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { vahit: { saygi: 4 } }
            sonraki: "@akis"
          - id: "hayran"
            etiket: { tr: "Kendine itiraf et: iyi cevap verdi", en: "Admit it to yourself: that was a good comeback" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { vahit: { saygi: 6 } }
              - itibar: { yukselenler: 2 }
            sonraki: "@akis"

      - id: "vahit_vaaz_tas"
        paragraflar:
          - { tr: "Konuşmaya başladığın anda kalabalıktan bir taş geliyor, şakağının hemen üstüne. Ardından bir tane daha; ama {npc:vahit} elini kaldırınca taşlar kesiliyor.", en: "You start talking and a rock comes out of the crowd, right above your temple. Then another one, but {npc:vahit} raises a hand and the rocks stop." }
          - { tr: "\"Bırakın. Sistem onu da seçecek ya da seçmeyecek; ikisi de bizim işimiz değil,\" diyor. Kalabalık bir sürü gibi peşinden yürüyor.", en: "\"Leave it,\" he says. \"The System will choose this one too, or it won't, and neither one is our business.\" The crowd follows him off like a flock." }
        secenekler:
          - id: "kan"
            etiket: { tr: "Şakağındaki kanı sil, gidişini izle", en: "Wipe the blood off your temple. Watch him go" }
            etkiler:
              - can: -5
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "tasi_al"
            etiket: { tr: "Taşı al; bir gün ona geri vereceksin", en: "Pick up the rock. Someday you'll give it back" }
            etkiler:
              - can: -5
              - ahlak: { merhamet: -2 }
              - iliski: { vahit: { korku: 2 } }
            sonraki: "@akis"

      - id: "vahit_vaaz_calmak"
        paragraflar:
          - { tr: "Tek bir cümle kuruyorsun, üstelik yüksek sesle bile değil. Ama kırk kişi, gökten bildirim düşmüş gibi aynı anda sana dönüyor.", en: "You say one sentence. Not even loud. But forty people turn to you at the same time, like a notice just dropped out of the sky." }
          - { tr: "{npc:vahit} kürsüsünde yapayalnız kalakalmış. Yüzünden önce şaşkınlık, sonra korku geçiyor; en sonunda bir tür açlık yerleşiyor. Kürsüden inip önünde diz çöküyor.", en: "{npc:vahit} is left standing alone on his pulpit. Confusion crosses his face, then fear, and then, at last, a kind of hunger. He climbs down and kneels in front of you." }
          - { tr: "\"Söylemiştim,\" diye fısıldıyor kalabalığa. \"Size söylemiştim.\"", en: "\"I told you,\" he whispers to the crowd. \"I told you all.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "a̷z önce bir tarikatı devraldın. aferin. nasıl geri verilir, onu ben de bilmiyorum.", en: "y̷ou just took over a cult. congratulations. how you give one back, i don't know either." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Onu ayağa kaldır: \"Kimse kimsenin önünde diz çökmez.\"", en: "Pull him up: \"Nobody kneels to anybody.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - itibar: { yukselenler: -4, siginak: 3 }
              - iliski: { vahit: { saygi: 4, guven: 3 } }
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "diz_coksun"
            etiket: { tr: "Bırak diz çöksün", en: "Let him kneel" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 3 }
              - yozlasma: 2
              - itibar: { yukselenler: 8 }
              - iliski: { vahit: { baglilik: 8, korku: 4 } }
              - bayrak: "secilmislere_katildi"
              - tohum: { olay: "vahit_yakit_listesi", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "vahit" } }
            sonraki: "@akis"
          - id: "dagit"
            etiket: { tr: "Kalabalığa dağılmalarını söyle", en: "Tell the crowd to break it up" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { yukselenler: -6 }
              - iliski: { vahit: { guven: -6, korku: 6 } }
              - degisken: { hayatta_kalan: 2 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ yakıt listesi (tohum)
  - id: "vahit_yakit_listesi"
    perde: [1]
    agirlik: 1
    etiketler: ["yukselenler", "npc", "ahlak"]
    gerilim: 3
    npc: ["vahit"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Yakıt listesi", en: "The fuel list" }
    sahne: "vahit_yakit_listesi_1"
    sahneler:
      - id: "vahit_yakit_listesi_1"
        paragraflar:
          - { tr: "Kampına beyazlar giymiş genç bir mürit gelip sana katlanmış bir kâğıt uzatıyor. \"Kardeş {npc:vahit} görmeni istedi,\" diyor. \"Sistem bunu seçilmişlere emanet etti.\"", en: "A young disciple dressed all in white walks into your camp and hands you a folded sheet of paper. \"Brother {npc:vahit} wanted you to see this,\" he says. \"The System entrusted it to the Chosen.\"" }
          - { tr: "Kâğıdın başlığında YAKIT — İLK SUNU yazıyor. Altında on iki isim var, her birinin yanında bir seviye; hiçbiri üçü geçmiyor.", en: "The heading reads: FUEL — FIRST OFFERING. Under it, twelve names, each with a level next to it. Every one of them is a three or lower." }
          - metin: { tr: "Listenin başında, son ekmeğini çuvala atamayan kadının adı var. Altı çizilmiş.", en: "At the top of the list is the woman who couldn't drop her last bread in the sack. Her name's underlined." }
            kosul: { bayrak: "yakit_kadin_kurtarildi" }
          - metin: { tr: "Listede ayakkabı mağazasından çıkardığın kadının da adı var: ateşli olanın, oğlu ceketine yapışıp kalanın.", en: "One of the names is the woman you pulled out of the shoe store. The one with the fever, whose son wouldn't let go of your jacket." }
            kosul: { bayrak: "mahsurlar_yukselenlerde" }
          - { tr: "Kâğıdın altında {npc:vahit|in} el yazısı: \"Çıkış Kapısı yakıt ister. Bunu bana o söyledi. Sen de duymadın mı?\"", en: "At the bottom, in {npc:vahit|pos} handwriting: \"The Exit Gate requires fuel. It told me so. Didn't you hear it too?\"" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Mürit kâğıdı uzatırken eli titriyor. Kendi adı da listede: on üçüncü sırada, sonradan kurşun kalemle eklenmiş.", en: "The disciple's hand shakes as he holds out the paper. His own name's on the list too. Thirteenth, added later, in pencil." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷uymadım. çünkü öyle bir şey yok. ya da var da bana söylemediler. ikisi de kötü.", en: "d̷idn't hear it. because there's no such thing. or there is, and nobody told me. both of those are bad." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On iki kişi. On iki. Bir şey yapacağız, değil mi? Yapacağız.\"", en: "\"Twelve people. Twelve. We're doing something, right? We're doing something.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu isimlerin dördü benim koğuşumdan. Dördü. Bunun hesabını ondan ben soracağım.\"", en: "\"Four of these names are from my ward. Four. I'm going to ask him about this myself.\"" }
        secenekler:
          - id: "yak"
            etiket: { tr: "Listeyi müridin gözü önünde yak", en: "Burn the list right in front of the disciple" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { yukselenler: -8 }
              - iliski: { vahit: { guven: -10, saygi: 3, korku: 3 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yakit_listesi_yakildi"
            sonraki: "vahit_yakit_listesi_murit"
          - id: "uyar"
            etiket: { tr: "Listedekileri uyar, hekime götür", en: "Warn the people on the list. Take them to the doctor" }
            goster: { bayrak: "elif_hastanesi_bilinir" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 5, yukselenler: -5 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 }, vahit: { guven: -6 } }
              - degisken: { hayatta_kalan: 4 }
              - gun: 1
              - tohum: { olay: "hastane_karantina", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari" } }
            sonraki: "@akis"
          - id: "yuzles"
            etiket: { tr: "Kâğıdı al, onu bu gece bul", en: "Take the paper. Find him tonight" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "vahit_yakit_listesi_yuzles"
          - id: "imzala"
            etiket: { tr: "Listeyi onayla; seçilmişler yükselsin", en: "Sign off on the list. Let the Chosen rise" }
            goster: { bayrak: "secilmislere_katildi" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -6 }
              - yozlasma: 3
              - itibar: { yukselenler: 10 }
              - iliski: { vahit: { baglilik: 8, guven: 6 } }
              - degisken: { hayatta_kalan: -4 }
            sonraki: "@akis"
          - id: "merte"
            etiket: { tr: "Listeyi istasyondaki radyocuya götür", en: "Bring the list to the radio guy at the station" }
            goster: { bayrak: "mert_istasyonu_bilinir" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 4, saygi: 3 } }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"

      - id: "vahit_yakit_listesi_teselli_yok"
        paragraflar:
          - { tr: "{npc:vahit} tokat yemiş gibi yüzünü buruşturuyor. \"Hayır,\" diyor. \"O konuştu, ben duydum.\"", en: "{npc:vahit} flinches like you slapped him. \"No,\" he says, \"it spoke, and I heard it.\"" }
          - { tr: "Kütükten kalkıp kâğıt elinde kampına yürüyor. Sabah olduğunda yeni bir kopyası müritlerin arasında elden ele dolaşıyor.", en: "He gets up off the stump and walks back to his camp, the paper still in his hand. By morning a fresh copy is going around among his disciples." }
        secenekler:
          - id: "durdur"
            etiket: { tr: "Peşinden git, listeyi elinden al", en: "Go after him and take the list" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - iliski: { vahit: { korku: 6, guven: -4 } }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "yakit_listesi_yakildi"
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "Bırak; sabah listedekileri uyar", en: "Let him go. Warn the names in the morning" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "vahit_yakit_listesi_murit"
        paragraflar:
          - { tr: "Kâğıt alev alıyor, mürit geri çekilmiyor. Alev on üçüncü isme, kendi adına varınca gözleri doluyor.", en: "The paper catches. The disciple doesn't step back. When the flame reaches the thirteenth name, his own, his eyes fill up." }
          - { tr: "\"Ona ne diyeceğim?\" diye soruyor. \"Bana kızacak. Ya da kızmayacak; o daha kötü. Kızmadığında sesi... öyle yumuşak oluyor ki.\"", en: "\"What do I tell him?\" he asks. \"He'll be angry, or he won't, and that's worse. When he isn't angry, his voice gets so... soft.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "\"Söyleme. Burada kal.\"", en: "\"Don't tell him. Stay here.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { guven: -3 } }
            sonraki: "@akis"
          - id: "git_soyle"
            etiket: { tr: "\"Git, ona benim yaktığımı söyle.\"", en: "\"Go tell him I burned it.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - dikkat: 1
              - iliski: { vahit: { korku: 4, saygi: 3 } }
            sonraki: "@akis"

      - id: "vahit_yakit_listesi_yuzles"
        paragraflar:
          - { tr: "{npc:vahit|i} gece kampının gerisinde, tek başına buluyorsun. Bir kütüğe oturmuş, göğün panellerine bakıyor; kalabalığın önündeki adamdan eser kalmamış.", en: "You find {npc:vahit} that night, alone, out behind his camp. He's sitting on a stump staring up at the sky panels. There's nothing left of the man who works the crowd." }
          - { tr: "\"Ses üç gündür susuyor, tek kelime etmedi,\" diyor, sana dönmeden. \"Ben de bir şey söylemezsem bana bakmayı bırakırlar.\" Sonunda dönüyor: \"Liste bir soruydu. Belki biri cevap verir diye.\"", en: "\"The voice has been quiet for three days, not a word,\" he says, not turning around. \"And if I don't say anything either, they stop looking at me.\" He finally turns: \"The list was a question, in case somebody answered.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷na cevap verebilirsin. benim sesimle. ne dersen inanır; bunu biliyorsun, ben de bundan nefret ediyorum.", en: "y̷ou could answer him. in my voice. he'd believe anything you said. you know it, and i hate it." }
        secenekler:
          - id: "tehdit"
            etiket: { tr: "\"Bu listeyi bir daha yazarsan seni bulurum.\"", en: "\"Write that list again and I'll find you.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - dikkat: 1
              - iliski: { vahit: { korku: 14, guven: -6 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yakit_listesi_yakildi"
            sonraki: "@akis"
          - id: "ses_ol"
            tur: "aciga_vur"
            etiket: { tr: "\"Ses benimle konuşuyor. Listeyi yırtmanı istiyor.\"", en: "\"The voice talks to me. It wants you to tear it up.\"" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -3, merhamet: 3 }
              - iliski: { vahit: { baglilik: 10, saygi: 6 } }
              - yalan: { npc: "vahit", konu: "vahit_ses_yalani" }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yakit_listesi_yakildi"
            sonraki: "@akis"
          - id: "teselli"
            etiket: { tr: "\"Belki hiç konuşmadı. Belki sen konuştun.\"", en: "\"Maybe it never talked. Maybe that was you.\"" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "vahit_yakit_listesi_teselli_yok", basarisiz_etkiler: [{ iliski: { vahit: { guven: -4 } } }] }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - iliski: { vahit: { guven: 6, saygi: 4 } }
              - npc_iz: { vahit: "yarali_guven" }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yakit_listesi_yakildi"
            sonraki: "@akis"
          - id: "ifsa"
            etiket: { tr: "Sabah onu müritlerinin önünde ifşa et", en: "Expose him to his flock in the morning" }
            gerekli: { stat: { cha: 12 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { yukselenler: -10, siginak: 3, sessiz_ag: 2 }
              - iliski: { vahit: { guven: -15, korku: 8 } }
              - npc_iz: { vahit: "korku_izi" }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "yakit_listesi_yakildi"
              - bayrak: "vahit_ifsa_edildi"
            sonraki: "@akis"

  # ================================================================== MERT — ŞİFRELİ MESAJ (Sessiz Ağ çekirdeği)
  - id: "mert_sifreli_mesaj"
    perde: [1]
    bolge: ["kirik_istasyon"]
    gun: { min: 8, max: 22 }
    agirlik: 6
    etiketler: ["kamp", "sessiz_ag", "npc", "gizem"]
    gerilim: 2
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Kontrol odasındaki radyocular", en: "The radio crew in the control room" }
    sahne: "mert_sifreli_mesaj_1"
    sahneler:
      - id: "mert_sifreli_mesaj_1"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "İstasyonun kontrol odasının kapısına bir karton bantlanmış: SESSİZ OLUN. Altında, daha küçük harflerle: CİDDİYİM.", en: "Somebody's taped a piece of cardboard to the station control room door: QUIET PLEASE. Underneath, smaller: I MEAN IT." }
          - { tr: "İçeride dört kişi sökülmüş sinyal panellerinin, telsizlerin ve araba akülerinin arasına yerleşmiş: emekli bir amatör telsizci, eskiden yayın yapan on altı yaşında bir kız, eski bir santral memuru. Dördüncüsü ince, uykusuz bir adam; sana dönmeden konuşuyor.", en: "Four people have dug in between gutted signal panels, ham radios, and car batteries: a retired ham operator, a sixteen-year-old girl who used to stream, a former switchboard operator. The fourth is a skinny, sleepless guy who talks to you without turning around." }
          - { tr: "\"Kapıyı kapat,\" diyor, gözünü ekrandan ayırmadan. \"Panellerin her doksan dakikada bir, görünmeyen bir bantta aynı sayı dizisini yayınladığını biliyor muydun? Biz onu dinliyoruz. O da büyük ihtimalle bizi.\"", en: "\"Shut the door,\" he says, eyes never leaving the screen. \"Did you know the sky panels broadcast the same number string every ninety minutes on a band nobody can see? We listen to it, and it's probably listening to us.\"" }
          - { tr: "Sonunda dönüp sana bakıyor: \"{npc:mert_kilic|tam}. Beni görmedin. Burada kimse kimseyi görmez; kız da bize şakadan {fraksiyon:sessiz_ag} demeye başladı, ad öyle kaldı.\"", en: "He finally turns and looks at you: \"{npc:mert_kilic|tam}, and you never saw me. Nobody sees anybody in here, so the kid started calling us {fraksiyon:sessiz_ag} as a joke, and it stuck.\"" }
        sezgiler:
          - kosul: { stat: { int: 9 } }
            metin: { tr: "Ekrandaki dizi rastgele değil. Her gün bir azalıyor: üç yüz altmış beşten geriye doğru sayıyor.", en: "That string on the screen isn't random. It drops by one every day. It's counting down, and the first number was 365." }
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Elleri titriyor; sinirden değil, kafeinden. Masanın altında boş enerji içeceği kutuları tepe olmuş.", en: "His hands are shaking. Not nerves. Caffeine. There's a small mountain of empty energy drink cans under the desk." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u adam beni arıyor, farkında olmadan. ona yaklaşırsan beni bulabilir. bunu gerçekten istiyor musun?", en: "t̷his guy's looking for me. he doesn't know it. get close to him and he might find me. do you actually want that?" }
          - kosul: { bayrak: "kirilma_yasandi" }
            anlati: true
            metin: { tr: "Sen içeri girince ekranlarından biri bir an karıncalanıyor. Ondan başka fark eden olmuyor.", en: "One of his screens fuzzes for a second when you walk in. Nobody notices. Except him." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Telsizleri var. Telsiz... Kardeşim telsize bayılırdı. Belki bir yerden duyan olur, değil mi?\"", en: "\"They've got radios. Radios... My sister loved radios. Maybe somebody out there could hear, right?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu adam en son ne zaman uyudu? Yok, sorma. Bana da sorma.\"", en: "\"When did this man last sleep? No, don't ask him. Don't ask me either.\"" }
        secenekler:
          - id: "log"
            tur: "aciga_vur"
            etiket: { tr: "Pencere kayıtlarını onunla paylaş", en: "Share your window logs with him" }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - aciga_vur: true
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 10, saygi: 8, korku: 4 } }
              - hafiza: { npc: "mert_kilic", id: "logu_paylasti", agirlik: 35 }
            sonraki: "mert_sifreli_mesaj_log"
          - id: "sahte"
            tur: "gizle"
            etiket: { tr: "Ona sıradan, sahte bir kayıt ver", en: "Give him a fake, boring log" }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - gizle: 2
              - ahlak: { duzen: -2, insanlik: -1 }
              - iliski: { mert_kilic: { guven: 3 } }
              - yalan: { npc: "mert_kilic", konu: "mert_sahte_kayit" }
            sonraki: "mert_sifreli_mesaj_sahte"
          - id: "coz"
            etiket: { tr: "Sayı dizisini incele, kendin çöz", en: "Study the number string. Crack it yourself" }
            gerekli: { stat: { int: 9 } }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - ahlak: { duzen: 1, insanlik: 1 }
              - bilgi: "geri_sayim"
              - iliski: { mert_kilic: { saygi: 10, guven: 4 } }
            sonraki: "mert_sifreli_mesaj_coz"
          - id: "anten"
            etiket: { tr: "Çatıdaki anteni onarmayı teklif et", en: "Offer to fix the antenna on the roof" }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - ahlak: { merhamet: 1, duzen: 1 }
              - gorev: { mert_anteni: "basla" }
              - iliski: { mert_kilic: { guven: 3 } }
            sonraki: "mert_sifreli_mesaj_anten"
          - id: "ihbar"
            etiket: { tr: "Telsizleri rampadaki askere ihbar et", en: "Tip off the soldier at the dock about the radios" }
            goster: { bayrak: "kaya_kampi_bilinir" }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - ahlak: { duzen: 3, insanlik: -3 }
              - kredi: 30
              - itibar: { lonca: 6, sessiz_ag: -8 }
              - iliski: { mert_kilic: { guven: -15, korku: 8 }, kaya_demir: { guven: 4 } }
              - hafiza: { npc: "mert_kilic", id: "olay:mert_sifreli_mesaj", agirlik: -35 }
              - bayrak: "telsizler_satildi"
            sonraki: "mert_sifreli_mesaj_ihbar"
          - id: "git"
            etiket: { tr: "Kapıyı kapat, onları rahat bırak", en: "Close the door and leave them be" }
            etkiler:
              - tanis: "mert_kilic"
              - bayrak: "mert_istasyonu_bilinir"
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { guven: 2 } }
            sonraki: "@akis"

      - id: "mert_sifreli_mesaj_log"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:mert_kilic} kaydı satır satır kaydırırken dudakları sessizce kıpırdıyor. En alta gelince duruyor; parmağı, dokunmaya korkar gibi ekranın üstünde asılı kalıyor.", en: "{npc:mert_kilic} scrolls the log line by line, lips moving without a sound. When he hits the bottom, he stops, finger hovering over the screen like he's scared to touch it." }
          - { tr: "\"Bu bir imza değil, yama,\" diyor neredeyse fısıltıyla. \"Biri senin pencereni elle yamamış. Sistem'in içinden biri ya da bir şey.\"", en: "\"That's not a signature, that's a patch,\" he says, very quietly. \"Somebody hand-patched your window. Somebody inside the System, or something.\"" }
          - { tr: "Yayıncı kız omzunun üstünden ekrana bakıp ıslık çalıyor. Eski telsizci haç çıkarıyor. Santral memuru ise ilk kez ağzını açıyor: \"Kapıyı kilitleyin.\"", en: "The streamer kid leans over his shoulder and whistles. The old ham operator crosses himself. The switchboard woman speaks for the first time: \"Lock the door.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷eni gördü. tamamını değil, kenarımı. insanlar kenardan başlar, sonra da durmazlar.", en: "h̷e saw me. not all of me. just an edge. people always start at the edges. then they don't stop." }
        secenekler:
          - id: "kopya"
            etiket: { tr: "Kaydın bir kopyasını ona bırak", en: "Let him keep a copy of the log" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - dikkat: 2
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { baglilik: 6, guven: 4 } }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "sil"
            tur: "gizle"
            etiket: { tr: "\"Bak, ama kopyalama. Sil onu.\"", en: "\"Look all you want. No copies. Delete it.\"" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 2 }
              - iliski: { mert_kilic: { saygi: 5, guven: 2 } }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 4, max: 7 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "yoldas"
            etiket: { tr: "Onu yanına al; sahada veri toplasın", en: "Bring him along. Let him collect data in the field" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { mert_kilic: { guven: 5 } } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { baglilik: 8 } }
              - yoldas_katil: "mert_kilic"
              - bayrak: "mert_yoldas"
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "mert_sifreli_mesaj_katilim"

      - id: "mert_sifreli_mesaj_sahte"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:mert_kilic} sahte kaydı okurken omuzları düşüyor. \"Sıradan, herkesinki gibi,\" deyip defterine bir çentik atıyor. \"Bugünün otuz yedinci sıradan kaydı.\"", en: "{npc:mert_kilic} reads the fake log and his shoulders sag. \"Standard, same as everybody's,\" he says, and makes a tally mark in his notebook. \"Thirty-seventh standard log today.\"" }
          - { tr: "Yayıncı kız ise sana biraz fazla uzun bakıyor. \"Herkesin penceresinin bir gölgesi olur, seninkinin yok,\" dedikten sonra omuz silkip ekranına dönüyor.", en: "The streamer kid, though, looks at you a little too long. \"Everybody's window casts a shadow, and yours doesn't,\" she says. Then she shrugs and turns back to her screen." }
        secenekler:
          - id: "anten"
            etiket: { tr: "Konuyu değiştir: anteni onarmayı teklif et", en: "Change the subject. Offer to fix the antenna" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gorev: { mert_anteni: "basla" }
            sonraki: "mert_sifreli_mesaj_anten"
          - id: "itiraf"
            tur: "aciga_vur"
            etiket: { tr: "Pes et, gerçek kaydı göster", en: "Give it up. Show him the real log" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: -1 }
              - iliski: { mert_kilic: { guven: 6, saygi: 6 } }
              - hafiza: { npc: "mert_kilic", id: "logu_paylasti", agirlik: 30 }
            sonraki: "mert_sifreli_mesaj_log"
          - id: "git"
            etiket: { tr: "Kıza göz kırp, çık", en: "Wink at the kid and leave" }
            etkiler:
              - ahlak: { duzen: -1 }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"

      - id: "mert_sifreli_mesaj_coz"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Diziye bakınca örüntü, çözülen bir düğüm gibi kendiliğinden açılıveriyor. Sayıyı, bugünün sayısını yüksek sesle söylüyorsun.", en: "You look at the string, and the pattern just gives itself up, like a knot coming loose. You say the number out loud. Today's number." }
          - { tr: "{npc:mert_kilic} omzunu kavrıyor; parmakları buz gibi. \"Bu bir geri sayım,\" diyor. Köşedeki eski telsizci kısık sesle cümleyi tamamlıyor: \"Üç yüz altmış beş gün.\"", en: "{npc:mert_kilic} grabs your shoulder. His fingers are ice cold. \"It's a countdown,\" he says, and from the corner the old ham operator finishes it in a rasp: \"Three hundred sixty-five days.\"" }
          - { tr: "\"Entegrasyon'un bir son tarihi var,\" diyor {npc:mert_kilic}. \"Kimse bize söylemedi. O da kimseye söylemedi.\"", en: "\"Integration has a deadline,\" {npc:mert_kilic} says. \"And nobody told us. It didn't tell anybody.\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "\"Dinlemeye devam edin. Ben de dinlerim.\"", en: "\"Keep listening. I'll listen too.\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { baglilik: 5, guven: 4 } }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "yay"
            etiket: { tr: "\"Bunu hekim de, asker de bilmeli.\"", en: "\"The doctor needs to hear this. The soldier too.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 3, lonca: 3, sessiz_ag: -3 }
              - iliski: { mert_kilic: { guven: -6, korku: 6 } }
            sonraki: "@akis"
          - id: "yoldas"
            etiket: { tr: "Onu yanına al; birlikte çözelim", en: "Bring him along. You'll crack the rest together" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { mert_kilic: { guven: 5 } } }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { baglilik: 8 } }
              - yoldas_katil: "mert_kilic"
              - bayrak: "mert_yoldas"
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "mert_sifreli_mesaj_katilim"

      - id: "mert_sifreli_mesaj_anten"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "İstasyonun çatısında, çökmüş bir reklam panosunun yanında bir anten direği yana yatmış. Direğe kalın, siyah kablolar sarılı; sen yaklaşınca içlerinden biri başını kaldırıyor.", en: "Up on the station roof, next to a collapsed billboard, an antenna mast leans sideways. Thick black cables are wrapped around it, and one of them lifts its head as you get close." }
          - { tr: "Aşağıdan, telsizden {npc:mert_kilic|in} sesi geliyor: \"Bu arada... kablolardan biri canlı olabilir. Bunu söylemem gerekirdi, değil mi?\"", en: "{npc:mert_kilic|pos} voice crackles up from below, over a walkie: \"By the way... one of those cables might be alive. I should've mentioned that, right?\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kabloyu direkten sök", en: "Rip the cable off the mast" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kablo_yilani"], kazan: "mert_sifreli_mesaj_anten_zafer", kaybet: "mert_sifreli_mesaj_anten_yenilgi", kac: "mert_sifreli_mesaj_anten_yenilgi" }
          - id: "zek"
            tur: "gosteris"
            etiket: { tr: "Yılanı antenin kendisine dönüştür", en: "Turn the serpent into the antenna itself" }
            gerekli: { stat: { int: 15 } }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - dikkat: 3
              - xp: 150
            sonraki: "mert_sifreli_mesaj_anten_zafer"

      - id: "mert_sifreli_mesaj_anten_zafer"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Direği doğrultuyorsun. Aşağıdan bir sevinç çığlığı kopuyor, sonra birden kesiliyor; telsizden, cızırtının arasından bir insan sesi geliyor.", en: "You straighten the mast. A whoop goes up from below, then cuts off all at once. Out of the walkie, through the static, comes a human voice." }
          - { tr: "\"...burası başka bir Öğretici... tekrar ediyorum, burası başka bir Öğretici Katman, hayatta kalan var mı...\" Ses kayboluyor; kontrol odasında herkes nefesini tutmuş.", en: "\"...this is another Tutorial... repeat, this is a different Tutorial Layer, is anybody still out there...\" The voice fades. Down in the control room, nobody breathes." }
          - { tr: "\"Yalnız değiliz,\" diyor {npc:mert_kilic}, telsizdeki sesi titreyerek. \"Tanrım. Yalnız değiliz.\"", en: "\"We're not alone,\" {npc:mert_kilic} says, his voice shaking over the walkie. \"Oh my God. We're not alone.\"" }
        secenekler:
          - id: "in"
            etiket: { tr: "Aşağı in, sesi birlikte dinleyin", en: "Climb down. Listen to it together" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - gorev: { mert_anteni: "tamam" }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 8, saygi: 6, baglilik: 4 } }
              - bilgi: "baska_ogreticiler"
              - xp: 100
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "yoldas"
            etiket: { tr: "Telsizden seslen: \"Gel, sahaya çıkıyoruz.\"", en: "Tell him over the walkie: \"Come on. Field trip.\"" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { mert_kilic: { guven: 5 } } }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gorev: { mert_anteni: "tamam" }
              - bilgi: "baska_ogreticiler"
              - iliski: { mert_kilic: { baglilik: 8, guven: 4 } }
              - yoldas_katil: "mert_kilic"
              - bayrak: "mert_yoldas"
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 3, max: 5 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "mert_sifreli_mesaj_katilim"
          - id: "isaret"
            etiket: { tr: "Antene istasyonun hoparlörünü de bağla", en: "Patch the station speakers into the antenna" }
            gerekli: { stat: { int: 10 } }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - gorev: { mert_anteni: "tamam" }
              - bilgi: "baska_ogreticiler"
              - iliski: { mert_kilic: { saygi: 6 } }
              - tohum: { olay: "istasyon_sinyali", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "mert_sifreli_mesaj_anten_yenilgi"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Akım seni çatının kenarına kadar savuruyor. Bir an aşağıya, rayların üstüne bakakalıyorsun; derken bir el, yayıncı kızın eli, ceketinden yakalıyor seni.", en: "The current throws you all the way to the edge of the roof. For a second you're looking straight down at the tracks. Then a hand, the streamer kid's, grabs you by the jacket." }
          - { tr: "\"Bir dahaki sefere lastik eldiven,\" diyor kız. \"Bunu sana {npc:mert_kilic} söylemeliydi ama söylemez, hiç söylemez.\"", en: "\"Next time, rubber gloves,\" she says. \"{npc:mert_kilic} should've told you, but he never does.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Kıza teşekkür et, aşağı in", en: "Thank the kid and climb down" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { guven: 3 } }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 4, max: 6 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"
          - id: "yine"
            etiket: { tr: "Eldiven bul, yarın yeniden dene", en: "Find gloves. Try again tomorrow" }
            etkiler:
              - ahlak: { duzen: 2 }
              - stat: { wil: 1 }
              - gun: 1
            sonraki: "mert_sifreli_mesaj_anten"

      - id: "mert_sifreli_mesaj_ihbar"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "Ertesi sabah turuncu bantlı dört avcı kontrol odasının kapısını kırıyor. Telsizler, aküler, sinyal panelleri bir alışveriş arabasına yükleniyor; {npc:mert_kilic} elleri başının üstünde, köşede dikiliyor.", en: "The next morning, four hunters in orange armbands kick in the control room door. Radios, batteries, signal panels, all of it gets loaded into a shopping cart. {npc:mert_kilic} stands in the corner with his hands on his head." }
          - { tr: "Arabayı iten avcılardan biri sana bir kese kredi uzatıyor. {npc:mert_kilic} sana bakıyor; gözlerinde öfke yok. Yalnızca kafasında bir yere not düşüyor.", en: "One of the hunters pushing the cart hands you a pouch of credits. {npc:mert_kilic} looks at you, and there's no anger in it. He's just making a note, in his head." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Krediyi cebine koy", en: "Pocket the credits" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            sonraki: "@akis"
          - id: "bir_telsiz"
            etiket: { tr: "Ona gizlice tek bir telsiz bırak", en: "Slip him one radio on the sly" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - iliski: { mert_kilic: { guven: 6, korku: -3 } }
              - itibar: { sessiz_ag: 3 }
              - tohum: { olay: "mert_cozulen_satir", gecikme: { min: 5, max: 8 }, kosul: { npc_hayatta: "mert_kilic" } }
            sonraki: "@akis"

      - id: "mert_sifreli_mesaj_katilim"
        yer: "kirik_istasyon"
        paragraflar:
          - { tr: "{npc:mert_kilic} sırt çantasına bir dizüstü bilgisayar, iki akü, bir rulo bant ve dört kutu enerji içeceği tıkıştırıyor. Sonra durup kutulardan ikisini geri çıkarıyor, ardından yine koyuyor.", en: "{npc:mert_kilic} crams a laptop, two batteries, a roll of tape, and four cans of energy drink into a backpack. Then he stops and takes two of the cans out. Then puts them back." }
          - { tr: "\"Kurallar,\" diyor, parmaklarıyla sayarak. \"Bir: sana sorduğum her şeyi kaydederim. İki: kimseye söylemem. Üç: bir şey bizi öldürmeye kalkarsa ben arkada dururum, çok arkada.\"", en: "\"Ground rules,\" he says, counting on his fingers. \"One, everything I ask you, I log; two, I tell nobody. Three, if something tries to kill us, I'm in the back, way in the back.\"" }
        secenekler:
          - id: "anlastik"
            etiket: { tr: "\"Anlaştık. Çok arkada.\"", en: "\"Deal. Way in the back.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { guven: 3 } }
            sonraki: "@akis"
          - id: "dorduncu"
            etiket: { tr: "\"Dördüncü kural: uyuyacaksın.\"", en: "\"Rule four: you sleep.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { mert_kilic: { baglilik: 3, saygi: 2 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ çözülen satır (tohum)
  - id: "mert_cozulen_satir"
    perde: [1]
    agirlik: 1
    etiketler: ["sessiz_ag", "npc", "gizem", "anomali"]
    gerilim: 2
    npc: ["mert_kilic"]
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Sabahın dördünde gelen", en: "The four a.m. visitor" }
    sahne: "mert_cozulen_satir_1"
    sahneler:
      - id: "mert_cozulen_satir_1"
        paragraflar:
          - { tr: "Sabahın dördünde biri kamp ateşinin küllerinin başına çömeliyor: {npc:mert_kilic}, gözlerinin altı mosmor, elinde dizüstü bilgisayarı. \"Uyumadım ama bir kısmını çözdüm,\" diyor. \"Birine söylersem ölürüm, söylemezsem belki hepimiz ölürüz. Ne yapacağımı sen söyleyeceksin.\"", en: "At four in the morning, somebody crouches down by the ashes of your fire: {npc:mert_kilic}, purple bags under his eyes, laptop in his hands. \"Didn't sleep, but I cracked part of it,\" he says. \"If I tell anybody, I'm dead, and if I don't, maybe we all are, so you're going to tell me what to do.\"" }
          - { tr: "\"Geri sayımın altında ikinci bir katman var: bir liste,\" diyor. \"İsim değil, aday numarası. Bazılarının yanında tek bir kelime yazıyor: düzeltildi.\"", en: "\"There's a second layer under the countdown, a list,\" he says. \"Not names but candidate numbers, and some of them have one word next to them: corrected.\"" }
          - metin: { tr: "\"Defterdeki oran bir hedef değil, eşik,\" diyor. \"Yüzde ellinin altı başarısızlık değil, hasat demek.\"", en: "\"That ratio in the ledger isn't a goal, it's a threshold,\" he says. \"Under fifty percent isn't a failure. It's a harvest.\"" }
            kosul: { bilgi: "hasat_kotasi" }
          - metin: { tr: "\"Tren anonsundaki o kısa sinyal bir toplama protokolü,\" diyor. \"Adına 'katkı' diyor. İnsanları bir yere aktarıyor; bir yere ya da bir şeyin içine.\"", en: "\"That little burst in the train announcement is a collection protocol,\" he says. \"It calls it a 'contribution.' It's moving people somewhere. Somewhere, or into something.\"" }
            kosul: { bilgi: "tren_dongusu" }
          - metin: { tr: "\"Senin satırınsa,\" diyor sesini alçaltarak, \"hiçbirine benzemiyor. İçinde bir adres var. Sistem'in içinde bir yer.\"", en: "\"And your line,\" he says, dropping his voice, \"your line doesn't look like any of them. There's an address in it, a place inside the System.\"" }
            kosul: { hafiza: { mert_kilic: "logu_paylasti" } }
        sezgiler:
          - kosul: { stat: { int: 10 } }
            metin: { tr: "Ekrandaki kodun yarısı yanlış çözülmüş. Ama yanlış çözülen yarısı bile insanı korkutmaya yetiyor.", en: "Half the code on his screen is decoded wrong. Even the wrong half is terrifying." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ adres benim evim. ya da hücrem. hangisi olduğunu ona söyleme; ben de bilmiyorum.", en: "t̷hat address is my home. or my cell. don't tell him which. i don't know either." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Önce uyusun. Dünyayı sonra kurtarırız. Bu sırayla.\"", en: "\"First he sleeps. Then we save the world. In that order.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hasat mı? Hasat ne demek? Biri bana ne demek olduğunu söylesin.\"", en: "\"Harvest? What does harvest mean? Somebody tell me what that means.\"" }
        secenekler:
          - id: "sir"
            etiket: { tr: "\"Kimseye söyleme. İkimizin arasında.\"", en: "\"Tell no one. This stays between us.\"" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 1 }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 6 } }
              - bayrak: "sessiz_ag_sirri"
            sonraki: "@akis"
          - id: "herkes"
            etiket: { tr: "\"Hekime de askere de söyle. Herkes bilmeli.\"", en: "\"Tell the doctor and the soldier. Everyone should know.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 3, lonca: 3, sessiz_ag: -4 }
              - iliski: { mert_kilic: { guven: -8, korku: 6 } }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "adres"
            etiket: { tr: "\"Adresi bana ver.\"", en: "\"Give me the address.\"" }
            goster: { hafiza: { mert_kilic: "logu_paylasti" } }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1 }
              - dikkat: 3
              - bilgi: "sistem_adresi"
              - iliski: { mert_kilic: { saygi: 4, korku: 3 } }
            sonraki: "mert_cozulen_satir_adres"
          - id: "hoparlor"
            etiket: { tr: "\"İstasyon hoparlörlerini hiç dinledin mi?\"", en: "\"Ever listen to the station speakers?\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { guven: 3 } }
              - tohum: { olay: "istasyon_sinyali", gecikme: { min: 0, max: 2 } }
            sonraki: "@akis"
          - id: "yoldas"
            etiket: { tr: "Onu yanına al; geri kalanı birlikte çözün", en: "Bring him along. Crack the rest together" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { mert_kilic: { guven: 5 } } }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { baglilik: 8 } }
              - yoldas_katil: "mert_kilic"
              - bayrak: "mert_yoldas"
            sonraki: "@akis"

      - id: "mert_cozulen_satir_adres"
        paragraflar:
          - { tr: "{npc:mert_kilic} ekranı sana çeviriyor. Adres bir harf ve sayı dizisinden ibaret; ama ona baktığında gözünün kenarında bozuk bir ışık titreşiyor.", en: "{npc:mert_kilic} turns the screen toward you. The address is a string of letters and numbers, but when you look at it, something broken flickers at the edge of your vision." }
          - { tr: "Durum pencerende, kimsenin göremeyeceği bir yerde yeni bir satır beliriyor: [Kök Erişim: ███ · kilitli]. Sonra kayboluyor.", en: "In your Status window, somewhere nobody else can see, a new line appears: [Root Access: ███ · locked]. Then it's gone." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu görmemen gerekiyordu. ben de görmemeliydim. ama gördük. artık ikimiz de biliyoruz: bir kapı var.", en: "y̷ou weren't supposed to see that. neither was i. but we did. now we both know there's a door." }
        secenekler:
          - id: "sil"
            etiket: { tr: "{npc:mert_kilic|e} dosyayı silmesini söyle", en: "Tell {npc:mert_kilic} to delete the file" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gizle: 3
              - iliski: { mert_kilic: { guven: 4 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "\"Sakla onu. Bir gün lazım olacak.\"", en: "\"Keep it. We'll need it someday.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { baglilik: 6, saygi: 4 } }
              - bayrak: "sessiz_ag_sirri"
            sonraki: "@akis"
