# Parti K1 — Perde 4: Hasat (Gün 331–365). docs/PERDE2_4.md "Parti K1".
# Ana yay: perde4_acilis (331) → fraksiyon_son_pozisyon (336) → kadim_istilasi (342) → cekirdege_yol (350) → sistem_cekirdegi (352).
# Son karar (358) ve son sahneleri Parti K2'nindir; sistem_cekirdegi @akis'e döner ve F'nin yanki_son_sir olayını tohumlar.
# Ana yay olaylarının `npc` listesi boştur: ölen bir NPC Perde 4'ün ana düğümlerini kapatmasın. NPC'ler koşullu paragraflarla girer.
# İstila sonuçları: kadimler_yenildi (Koruyucu) · kadim_anlasmasi (Vassal) · kiyikent_dustu. Çekirdek: cekirdek_yolu_acik, sistem_cekirdegine_ulasildi.
# Düşmanlar content/enemies/80_perde4.yaml (istila_*, cekirdek_*, p4_*). İngilizcede Deniz "they" ({zamir:deniz_arman|…}), Yankı "it".
olaylar:
  # ================================================================== PERDE 4 AÇILIŞI (AY 331)
  - id: "perde4_acilis"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "hasat", "sistem"]
    gerilim: 4
    ana_yay: { gun: 331 }
    onemli: true
    kart: { tr: "Hasat Başlıyor", en: "The Harvest Begins" }
    sahne: "p4_acilis_1"
    sahneler:
      - id: "p4_acilis_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Sabah altıyı on geçe gökyüzündeki her mavi panel aynı anda sararıyor. Mavi değil artık; olgun bir buğday tarlasının, kesilmeyi bekleyen bir ekinin rengi. Bir yıldır başını kaldırıp o panellere bakmaya alışmış bütün bir tür, ilk kez bakmaktan korkuyor.", en: "At ten past six in the morning, every blue panel in the sky turns gold at once. Not blue anymore: the color of a ripe wheat field, of a crop waiting for the blade. A whole species that spent a year getting used to looking up at those panels is suddenly afraid to." }
          - { tr: "Sonra, Gün 178'den beri körfezin üstünde tek başına asılı duran elçilik gemisinin etrafına başkaları iniyor. Haftalardır bulutların üstünde bekleyen kırk sekiz gemiden biri, beşi, kırkı; sonunda kırk biri. Kalan yedisi yukarıda kalıyor, ışıksız, izliyor. İnenler uzun ve ince, uçları aşağı sarkan; rüzgârda eğilmiş başaklar gibi. Gölgeleri {yer:kordon} boyunca, {yer:eski_sehir|in} damlarına, {yer:tepe|in} yamacına uzanıyor.", en: "Then, around the lone embassy ship that has hung over the bay since Day 178, others come down. Out of the forty-eight that have waited above the clouds for weeks: one, five, forty. Forty-one, in the end. The other seven stay up high, unlit, watching. The ones that come down are long and thin, tips drooping toward the water like wheat bent over in the wind. Their shadows stretch along {yer:kordon}, across the roofs of {yer:eski_sehir}, up the slope of {yer:tepe}." }
          - metin: { tr: "{yer:kordon} çoktan canavarların; filonun gölgesi oradaki yıkıntıların üstüne bir örtü gibi iniyor ve kıyıdaki yaratıklar bile susuyor.", en: "For a long time now, {yer:kordon} has belonged to the monsters. The fleet's shadow settles over the ruins there like a sheet, and even the things on the shore go quiet." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "{yer:kordon|de} sabah koşusuna çıkmış birkaç inatçı insan durup gökyüzüne bakıyor. Bir yaşlı adam şemsiyesini açıyor; sanki gölge yağmur gibi bir şeymiş.", en: "Out on {yer:kordon}, a few stubborn people out for their morning jog stop and stare at the sky. An old man opens his umbrella, as if the shadow were some kind of rain." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - { tr: "Ve Sistem, bir yıl önce Entegrasyon Günü'nde yaptığı gibi, herkese aynı anda konuşuyor.", en: "And the System, the way it did a year ago on Integration Day, speaks to everyone at once." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "mitik"
            baslik: { tr: "[SON DEĞERLENDİRME BAŞLADI]", en: "[FINAL ASSESSMENT HAS BEGUN]" }
            satirlar:
              - { tr: "Katman adayı: Dünya. Kalan süre: 34 gün.", en: "Layer candidate: Earth. Time remaining: 34 days." }
              - { tr: "Hasat ekibi yörüngede. Lütfen paniğe kapılmayın; panik verimi düşürür.", en: "Harvest crew in orbit. Please do not panic. Panic lowers yield." }
              - { tr: "Değerlendirmeye katkınız için teşekkür ederiz.", en: "Thank you for contributing to your assessment." }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "Kırk bir gemi alçaldı. Kırk tanesinin karnında ışık var, biri karanlık. Karanlık olan hiç kıpırdamıyor; ötekiler ona göre hizalanıyor. Bulutların üstünde kalan yedisi ise hiçbir şeye hizalanmıyor; yalnızca izliyor.", en: "Forty-one ships came down. Forty of them have lights in their bellies. One is dark. The dark one doesn't move at all, and the others line up on it. The seven still above the clouds don't line up on anything. They just watch." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu sesi tanıyorum. her şey bir kere daha aynı cümleyle başlıyor. bu kez sonunu değiştirmeni istiyorum.", en: "i know this voice. everything starts over with the same sentence. this time i want you to change how it ends." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Otuz dört gün. Vapur seferleri bile daha uzun sürerdi.\"", en: "\"Thirty-four days. The ferry schedule used to have longer runs than that.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Panik verimi düşürürmüş. Demek ki panikleyeceğiz. Ama önce sargıları sayalım.\"", en: "\"Panic lowers yield. Great, so we panic. But we count the bandages first.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yayının kaynağını izledim. Yörüngeden değil. Aşağıdan geliyor. Bizim altımızdan.\"", en: "\"I traced the broadcast. It's not coming from orbit. It's coming from below. From under us.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kırk bir gemi. Hangisi en büyükse o benim.\"", en: "\"Forty-one ships. Whichever one's biggest, that one's mine.\"" }
        secenekler:
          - id: "seslen"
            etiket: { tr: "Kasaba Çekirdeği'ne koş, şehre seslen", en: "Run for the Town Core. Talk to the city" }
            etkiler:
              - bayrak: "hasat_basladi"
              - bayrak: "p4_acilis_konusma"
              - gorev: { hasat_savunmasi: "basla" }
              - ahlak: { duzen: 4, insanlik: 3 }
              - itibar: { siginak: 3, lonca: 2 }
              - tohum: { olay: "p4_kusatma_ekmegi", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Hasat başladığında ilk konuşan sen oldun; şehir sonraki otuz dört günü senin sesinle saydı.", en: "When the Harvest began, you were the first to speak, and the city counted down the next thirty-four days in your voice." }
            sonraki: "p4_acilis_seslen"
          - id: "meydan"
            tur: "aciga_vur"
            etiket: { tr: "Gökyüzüne yüksel, filoya kendini göster", en: "Rise into the sky. Let the fleet see you" }
            gerekli: { stat: { wil: 300 } }
            etkiler:
              - bayrak: "hasat_basladi"
              - bayrak: "p4_acilis_meydan"
              - gorev: { hasat_savunmasi: "basla" }
              - aciga_vur: true
              - dikkat: 12
              - ahlak: { insanlik: -4, duzen: -2 }
              - degisken: { kadim_tehdit: -3 }
              - iliski: { thessar: { saygi: 8, korku: 4 } }
            kronik: { tr: "Kırk bir geminin önünde gökyüzünde tek başına durdun; Kadimler o gün ilk kez bir insanı adıyla raporladı.", en: "You stood alone in the sky in front of forty-one ships, and that day the Ancients filed their first report on a human by name." }
            sonraki: "p4_acilis_meydan"
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış; filoyu say, görünme", en: "Melt into the crowd. Count the fleet. Stay unseen" }
            etkiler:
              - bayrak: "hasat_basladi"
              - gorev: { hasat_savunmasi: "basla" }
              - gizle: 10
              - ahlak: { duzen: -3, merhamet: -1 }
              - tohum: { olay: "p4_kadim_oncusu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Herkes gökyüzüne bakarken sen gemileri saydın; istila geldiğinde onları senden iyi tanıyan kimse yoktu.", en: "While everyone else stared at the sky, you counted the ships, and when the invasion came, nobody knew them better than you." }
            sonraki: "p4_acilis_golge"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: bunu daha önce gördün mü?", en: "Ask {npc:yanki}: have you seen this before?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "hasat_basladi"
              - gorev: { hasat_savunmasi: "basla" }
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
            kronik: { tr: "Hasatın ilk sabahı insanlara değil, kafandaki sese döndün; o ses o sabah sana ilk kez doğrudan cevap verdi.", en: "On the Harvest's first morning, you turned not to people but to the voice in your head, and that morning it answered you straight for the first time." }
            sonraki: "p4_acilis_yanki"

      - id: "p4_acilis_seslen"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Kasaba Çekirdeği'nin salonu hıncahınç dolu ve herkes aynı anda konuşuyor. Sen içeri girince ses kesiliyor; yüzlerce baş, bir rüzgârın yönünü değiştirdiği başaklar gibi sana dönüyor.", en: "The Town Core's hall is packed to the walls, and everybody's talking at once. When you walk in, the noise dies. Hundreds of heads turn your way, like wheat when the wind shifts." }
          - metin: { tr: "Çekirdek, avucunu üstüne koyduğun anda sana boyun eğiyor. Burası senin; yayın kanalı senin, şehrin bütün hoparlörleri senin. Tek bir nefesle {yer:kiyikent} seni dinliyor.", en: "The Core bows to you the moment you lay your palm on it. This is yours. The broadcast channel is yours, every loudspeaker in the city is yours. In one breath, {yer:kiyikent} is listening." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "{npc:elif_sari|in} konseyi mikrofonu sana uzatıyor; kimse oylama istemiyor. Bu sabah oy birliği gerektirmeyen tek karar bu.", en: "{npc:elif_sari|pos} council hands you the microphone. Nobody calls for a vote. It's the one decision this morning that doesn't need one." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Lonca'nın nöbetçileri kanalı sana açıyor ve kapıya çekiliyor. Bir yıl önce bu salonda rütbe sayılıyordu; bugün yalnızca saniyeler sayılıyor.", en: "The Guild's sentries open the channel for you and step back to the door. A year ago they counted ranks in this hall. Today they're counting seconds." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Beyazlılar ilahilerini yarıda kesiyor. Kanal senin; onlar için bu, bir mucizenin konuşmaya karar vermesi demek.", en: "The people in white cut their hymn off mid-verse. The channel is yours. To them, it means a miracle has decided to speak." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Sessiz Ağ'ın teknisyenleri yayını şifresiz açıyor; bir yıldır ilk kez. \"Herkes duysun,\" diyor biri. \"Artık saklanacak bir şey kalmadı.\"", en: "The Quiet Network's techs open the broadcast unencrypted, for the first time in a year. \"Let everybody hear it,\" one of them says. \"There's nothing left to hide.\"" }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Bu şehir bir yılda yarısından fazlasını kaybetti. Hoparlörlerin ulaştığı sokakların çoğu boş; konuştuğun her kelime yankılanarak dönüyor.", en: "This city lost more than half its people in a year. Most of the streets the speakers reach are empty, and every word you say comes echoing back." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
          - metin: { tr: "Şehir kalabalık. Hoparlörlerin altında, damlarda, balkonlarda, iskelede insanlar duruyor; çoğu bir yıl önce Öğretici'den sağ çıkacaklarına inanmamıştı.", en: "The city is crowded. People are standing under the speakers, on rooftops, on balconies, out on the pier. Most of them never believed they'd make it out of the Tutorial a year ago." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
        sezgiler:
          - kosul: { stat: { cha: 300 } }
            metin: { tr: "[KAR] Salondakilerin nabzı senin nefesine göre ayarlanıyor. Ne söylersen inanacaklar; asıl soru, neye inanmaları gerektiği.", en: "[CHA] The pulse of everyone in this hall is syncing to your breathing. They'll believe whatever you say. The real question is what they should believe." }
        secenekler:
          - id: "gercek"
            etiket: { tr: "Gerçeği söyle: otuz dört gün, bir filo", en: "Tell them the truth: thirty-four days, one fleet" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { guven: 6, saygi: 4 } }
            sonraki: "p4_acilis_son"
          - id: "umut"
            etiket: { tr: "Umut ver; gerisini sen taşı", en: "Give them hope. You'll carry the rest" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - iliski: { deniz_arman: { baglilik: 5 } }
            sonraki: "p4_acilis_son"
          - id: "sikiyonetim"
            etiket: { tr: "Sıkıyönetim ilan et; herkes bir göreve", en: "Declare martial law. Everyone gets a post" }
            etkiler:
              - bayrak: "p4_sikiyonetim"
              - ahlak: { duzen: 7, merhamet: -3 }
              - itibar: { lonca: 5, siginak: -3 }
              - iliski: { kaya_demir: { saygi: 6 } }
              - ordu_kazan: 5
            sonraki: "p4_acilis_son"

      - id: "p4_acilis_meydan"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Hava altında bir merdiven gibi sertleşiyor ve sen basamak basamak yükseliyorsun. Aşağıda {yer:kiyikent} küçülüyor; damlarda insanlar parmaklarıyla seni gösteriyor. Yukarıda kırk bir gemi.", en: "The air firms up under your feet like a staircase, and you climb it step by step. Below, {yer:kiyikent} shrinks. People on the rooftops are pointing at you. Above you are forty-one ships." }
          - { tr: "Karanlık gemi, tek kıpırdamayan gemi, burnunu yavaşça sana çeviriyor. Bir an hiçbir şey olmuyor. Sonra gövdesinde, rüzgârın değil bir bakışın açtığı bir yarık gibi tek bir ışık yanıyor.", en: "The dark ship, the one that never moves, slowly turns its prow toward you. For a moment nothing happens. Then a single light opens on its hull, a slit opened not by wind but by a gaze." }
          - { tr: "Gökyüzündeki altın panellerin hepsine aynı anda küçük bir satır ekleniyor. Hayatta kalan her insan okuyor. Kırk bir gemi okuyor; bulutların üstündeki yedisi de.", en: "A small line gets added to every gold panel in the sky at once. Every human still alive reads it. Forty-one ships read it, and so do the seven above the clouds." }
          - metin: { tr: "Elçilik gemisinden, bir yıldır duymaya alıştığın o soğuk ses zihnine dokunuyor: {npc:thessar}. \"Bunu yapmamalıydın,\" diyor. \"Ama itiraf edeyim, görmek güzeldi.\"", en: "From the embassy ship, a cold voice you've had a year to get used to touches your mind: {npc:thessar}. \"You should not have done that,\" he says. \"But I confess it was something to see.\"" }
            kosul: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[DEĞERLENDİRME NOTU]", en: "[ASSESSMENT NOTE]" }
            satirlar:
              - { tr: "Anomali kendini gösterdi. Hasat önceliği güncellendi.", en: "Anomaly has revealed itself. Harvest priority updated." }
              - { tr: "Öncelik: ilk.", en: "Priority: first." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni gördüler. iyi. artık saklanmak için çok geç, o yüzden en azından güzel durmaya devam et.", en: "they saw you. good. it's way too late to hide now, so at least keep looking good up there." }
        secenekler:
          - id: "meydan_oku"
            etiket: { tr: "Filoya meydan oku: buraya gelin", en: "Call out the fleet: come and get it" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -3 }
              - dikkat: 8
              - degisken: { kadim_tehdit: -2 }
              - efsane: "tek_basina_suru"
            sonraki: "p4_acilis_son"
          - id: "in"
            etiket: { tr: "Sessizce in; görmeleri yeter", en: "Come down quietly. Being seen is enough" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - gizle: 4
            sonraki: "p4_acilis_son"
          - id: "thessar_mesaj"
            etiket: { tr: "{npc:thessar|e} tek bir cümle bırak", en: "Leave {npc:thessar} a single sentence" }
            goster: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { thessar: { saygi: 8, baglilik: 4 } }
              - hafiza: { npc: "thessar", id: "olay:perde4_acilis", agirlik: 30 }
            sonraki: "p4_acilis_son"

      - id: "p4_acilis_golge"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Kalabalık bir nehir gibi akıyor ve sen o nehrin içinde bir taşsın. Kimse sana bakmıyor; herkes yukarı bakıyor. Sen de bakıyorsun, ama başka türlü: sayarak, ölçerek, ezberleyerek.", en: "The crowd flows like a river and you're a stone in it. Nobody looks at you. Everybody's looking up. So are you, only differently: counting, measuring, memorizing." }
          - { tr: "Gemilerin karnından ince, neredeyse görünmez çizgiler iniyor. İlk başta yağmur sanıyorsun. Değil. Her çizginin ucunda ışığı büken, uzun ve ince bir şey var; çatılara, ara sokaklara, {yer:eski_sehir|in} kubbelerine konuyorlar.", en: "Thin, almost invisible lines are dropping from the ships' bellies. At first you think it's rain. It isn't. At the end of every line is something long and thin that bends the light, and they're settling onto rooftops, into alleys, onto the domes of {yer:eski_sehir}." }
          - { tr: "Öncüler. Filo inmeden önce şehri ölçecekler.", en: "Pathfinders. They're going to measure the city before the fleet comes down." }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "[ALG] Öncülerden biri {yer:eski_sehir|de}, saat kulesinin dibine iniyor. Bir defter açıyor. Senin bulunduğun sokağa bakıyor ve bir şey yazıyor.", en: "[PER] One of the Pathfinders touches down in {yer:eski_sehir} at the foot of the clock tower. It opens a ledger. It looks toward your street and writes something down." }
        secenekler:
          - id: "iletmek"
            etiket: { tr: "İniş noktalarını işaretle, Lonca'ya ilet", en: "Mark the landing points. Pass them to the Guild" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 4 } }
            sonraki: "p4_acilis_son"
          - id: "takip"
            etiket: { tr: "Saat kulesindekini kendin takip et", en: "Tail the one at the clock tower yourself" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - bayrak: "p4_oncu_iz"
            sonraki: "p4_acilis_son"
          - id: "izle"
            etiket: { tr: "Hiçbir şey yapma. Yalnızca izle", en: "Do nothing. Just watch" }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: -1 }
              - gizle: 4
            sonraki: "p4_acilis_son"

      - id: "p4_acilis_yanki"
        yer: "kiyikent"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Bir yıl boyunca her şeye bir laf yetiştiren ses, şimdi bir çocuğun soluğu kadar alçak.", en: "{npc:yanki} doesn't answer for a long time. The voice that had a comeback for everything for a whole year is now as quiet as a kid's breathing." }
          - { tr: "gördüm, diyor sonunda. gördüm mü yoksa hatırlıyor muyum, bilmiyorum. aynı renk, aynı cümle, aynı kırk bir gemi. bir tanesi her seferinde karanlık.", en: "i've seen it, it says at last. or i remember it. i can't tell the difference. same color, same sentence, same forty-one ships. one of them is always dark." }
          - { tr: "her seferinde mi, diye soruyorsun. Kafanın içinde bir şey, bir kapının arkasında saklanan biri gibi, nefesini tutuyor.", en: "Every time? you ask. Something inside your head holds its breath, like someone hiding behind a door." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[b̷unu sonra konuşalım]", en: "[l̷et's talk about this later]" }
            satirlar:
              - { tr: "çekirdeğe in. orada sana bir şey göstereceğim. şimdi değil.", en: "go down to the core. i'll show you something there. not now." }
        secenekler:
          - id: "farkli"
            etiket: { tr: "Bu kez farklı olacak", en: "This time it'll be different" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { yanki: { guven: 5, baglilik: 4 } }
            sonraki: "p4_acilis_son"
          - id: "anlat"
            etiket: { tr: "Bana şimdi anlat", en: "Tell me now" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 2 }
              - iliski: { yanki: { saygi: 4, korku: 3 } }
            sonraki: "p4_acilis_son"
          - id: "sus"
            etiket: { tr: "Sus. Bugün senin sesine yer yok", en: "Quiet. There's no room for your voice today" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: -5, korku: 4 } }
            sonraki: "p4_acilis_son"

      - id: "p4_acilis_son"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Akşam olduğunda şehir değişmiş. Fırınlar gece boyunca yanacak; okul bahçelerine kum torbaları taşınıyor; birileri kilisenin, caminin ve eski sinemanın kapılarını açıp içeriyi yatakhaneye çeviriyor.", en: "By evening, the city has changed. The bakeries will burn all night. Sandbags are going up in schoolyards. Somebody's propped open the doors of the church, the mosque and the old movie theater and turned them into dormitories." }
          - metin: { tr: "{npc:kaya_demir|in} sesi telsizde, her zamanki gibi kuru: \"Beş gün sonra herkes Çekirdek'te. Planı olan getirsin. Planı olmayan kazma getirsin.\"", en: "{npc:kaya_demir|pos} voice on the radio, dry as ever: \"Five days from now, everybody's at the Core. If you've got a plan, bring it. If you don't, bring a shovel.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "Lonca'nın telsiz kanalı bir yıldır {npc:kaya_demir|in} sesine alışkındı. Bu akşam kanal susuyor; subaylar sıradaki emri senden bekliyor.", en: "For a year, the Guild's radio channel was used to {npc:kaya_demir|pos} voice. Tonight it's silent, and the officers are waiting for the next order to come from you." }
            kosul: { bayrak: "kaya_devrildi" }
          - metin: { tr: "{npc:elif_sari} gece yarısı bir not gönderiyor: \"Hastanede yer açtım. Senin için değil. Ama yorulursan, bir sandalye var.\"", en: "{npc:elif_sari} sends a note around midnight: \"Cleared space at the hospital. Not for you. But if you get tired, there's a chair.\"" }
            kosul: { npc_hayatta: "elif_sari", iliski_max: { elif_sari: { baglilik: 59 } } }
          - metin: { tr: "{npc:elif_sari} gece yarısı yanına geliyor, tek kelime etmeden başını omzuna dayıyor. Otuz dört gün, diyor sonunda. Otuz dört gün çok uzun bir süre olabilir, eğer düzgün kullanırsak.", en: "{npc:elif_sari} finds you around midnight and leans her head on your shoulder without a word. Thirty-four days, she says finally. Thirty-four days can be a long time, if we use them right." }
            kosul: { npc_hayatta: "elif_sari", iliski_min: { elif_sari: { baglilik: 60 } } }
          - { tr: "Dört kampın dördü de sana haberci gönderiyor. Beş gün sonra herkes Kasaba Çekirdeği'nde toplanacak; son kez, bu şehrin nasıl öleceğine ya da nasıl yaşayacağına karar vermek için.", en: "All four camps send runners to you. In five days, everyone gathers at the Town Core, one last time, to decide how this city dies or how it lives." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir yıl önce sisin içinde uyandığımızda bana 'bir şekilde eve döneceğiz' demiştin. Döndük. Şimdi evi de götürmek istiyorlar.\"", en: "\"A year ago, when we woke up in the fog, you told me 'we'll get home somehow.' We did. Now they want to take home too.\"" }
        secenekler:
          - id: "kule"
            etiket: { tr: "Kule'ye çık; otuz dört gün çok uzun değil", en: "Go climb the Spire. Thirty-four days isn't long" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "surlar"
            etiket: { tr: "Gece boyunca surları dolaş", en: "Walk the barricades all night" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"
          - id: "deniz_kiyi"
            etiket: { tr: "{npc:deniz_arman} ile iskelede otur", en: "Sit out on the pier with {npc:deniz_arman}" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 14, max: 20 } }
            sonraki: "@akis"

  # ================================================================== FRAKSİYONLARIN SON POZİSYONU (AY 336)
  - id: "fraksiyon_son_pozisyon"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "fraksiyon", "siyaset"]
    gerilim: 3
    ana_yay: { gun: 336 }
    onemli: true
    kart: { tr: "Son Masa", en: "The Last Table" }
    sahne: "p4_fsp_1"
    sahneler:
      - id: "p4_fsp_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Çekirdek'in salonuna dört masa getirilmiş, ama herkes ayakta. Duvardaki büyük ekranda filonun gölgesi saat saat ilerleyen bir leke gibi şehrin haritasının üstüne yayılıyor. Kimse oturmuyor, çünkü oturmak beklemek demek.", en: "Four tables have been hauled into the Core's hall, but everyone's standing. On the big screen on the wall, the fleet's shadow spreads over the city map like a stain creeping forward hour by hour. Nobody sits, because sitting means waiting." }
          - metin: { tr: "{npc:elif_sari} konseyin masasının başında, elinde bir tahliye listesi. \"{yer:tepe|in} altındaki eski metro tünelleri kırk bin kişi alır,\" diyor. \"Önce siviller. Savaş ikinci.\"", en: "{npc:elif_sari} stands at the head of the council's table with an evacuation list in her hand. \"The old subway tunnels under {yer:tepe} hold forty thousand,\" she says. \"Civilians first. The war comes second.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Konseyin masasında {npc:elif_sari|in} steteskobu duruyor; yardımcısı onu oraya bir sandalye gibi koymuş. Tahliye listesini o okuyor, sesi titreyerek ama durmadan.", en: "{npc:elif_sari|pos} stethoscope sits on the council's table; her deputy set it there like an empty chair. The deputy reads the evacuation list, voice shaking but never stopping." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "{npc:kaya_demir} haritanın önünde, bir general gibi. \"Kıyıyı tutarız, Kule Dibi'ni tutarız, Çekirdek'i tutarız. Gerisi teferruat.\" Sana dönüyor: \"Mızrağın ucu sensin. Gerisini ben hallederim.\"", en: "{npc:kaya_demir} stands in front of the map like the general he's become. \"We hold the shore, we hold {yer:kule_dibi}, we hold the Core. The rest is details.\" He turns to you. \"You're the tip of the spear. I'll handle everything behind it.\"" }
            kosul: { bayrak: "kaya_general" }
          - metin: { tr: "Lonca'nın masasında subaylar sana bakıyor. {npc:kaya_demir|i} sen devirdin; şimdi onun haritası ve onun askerleri senin.", en: "At the Guild's table, the officers are looking at you. You're the one who toppled {npc:kaya_demir}. His map and his soldiers belong to you now." }
            kosul: { bayrak: "kaya_devrildi" }
          - metin: { tr: "{npc:kaya_demir} Lonca'nın masasında, kollarını kavuşturmuş. \"Her şey cepheye,\" diyor. \"Tünele inen her kol, kıyıda eksik bir tüfek demek.\"", en: "{npc:kaya_demir} stands at the Guild's table with his arms crossed. \"Everything goes to the front,\" he says. \"Every arm that goes down a tunnel is one less rifle on the shore.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: ["kaya_general", "kaya_devrildi"] }
          - metin: { tr: "{npc:vahit} beyazlılarının önünde, kollarını açmış. \"Bu bir istila değil, bir hasat. Hasat ekini değil, ekinin en iyisini seçer. Bize yakıt verin, seçilmişi besleyelim; o da bizi korusun.\" Gözleri sana dikili.", en: "{npc:vahit} stands in front of his people in white with his arms spread. \"This isn't an invasion. It's a harvest. And a harvest doesn't take the field, it takes the best of the field. Give us fuel and we'll feed the Chosen. The Chosen will protect us.\" His eyes are locked on you." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "Sessiz Ağ'ın masasında {npc:mert_kilic} bir dizüstünün üstüne eğilmiş. \"Hasat sütunları bir sinyalle çalışıyor. Sinyali Kule'nin koduyla bozarsak sütunlar kör olur. Kırk dakika. Bize kırk dakika kazandırın.\"", en: "At the Quiet Network's table, {npc:mert_kilic} is hunched over a laptop. \"The harvest pillars run on a signal. If we scramble it with the Spire's code, the pillars go blind. Forty minutes. Buy us forty minutes.\"" }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: "ihanet_mert" }
          - metin: { tr: "Sessiz Ağ'ın masası yarı boş. {npc:mert_kilic|in} sattığı şifreler hâlâ filonun elinde; kalan teknisyenler sana bakmaya utanıyor.", en: "The Quiet Network's table is half empty. The codes {npc:mert_kilic} sold are still in the fleet's hands, and the techs who stayed can't quite look at you." }
            kosul: { bayrak: "ihanet_mert" }
          - metin: { tr: "Salonun ortasında mavi bir ışık titreşiyor: {npc:thessar|in} sureti. \"Son kez teklif ediyorum,\" diyor. \"Yaşamak için diz çökmek ayıp değildir. Benim türüm bunu bin yıl önce öğrendi.\"", en: "In the middle of the hall, a blue light flickers: {npc:thessar|pos} projection. \"I am offering one last time,\" he says. \"There is no shame in kneeling to live. My kind learned that a thousand years ago.\"" }
            kosul: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "{npc:thessar} insan masalarının arasında duruyor; kendi ırkının zırhını sökmüş, yerine Lonca'nın gri paltosunu giymiş. Kimse ona tam güvenmiyor. Ama filonun planını yalnızca o biliyor.", en: "{npc:thessar} stands among the human tables. He's stripped off his own race's armor and put on a gray Guild coat. Nobody fully trusts him. But he's the only one who knows the fleet's battle plan." }
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "[ALG] Dört masa da sana bakıyor ama hepsi önce diğerlerine bakıyor. Kim önce boyun eğecek? Kimse eğmeyecek. Biri karar vermezse bu salon bir hafta tartışacak.", en: "[PER] All four tables are looking at you, but each of them checks the others first. Who bends first? Nobody. If somebody doesn't decide, this hall argues for a week." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "her birinin planı bir parça doğru. hiçbiri tam doğru değil. sen bunu biliyorsun; onlar da biliyor. o yüzden sana bakıyorlar.", en: "every one of their plans is a little bit right. none of them is all right. you know it. they know it. that's why they're looking at you." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Masalar, planlar, oylamalar. Söyle bana nereye vuracağımızı, gerisi beni sıkıyor.\"", en: "\"Tables, plans, votes. Just tell me where to hit. The rest bores me.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hangisini seçersen seç, ben önce insanların yanında duracağım. Bunu bil.\"", en: "\"Whichever one you pick, I'm standing with the people first. Just so you know.\"" }
        secenekler:
          - id: "birlik"
            tur: "gosteris"
            etiket: { tr: "Dört masayı tek bir sancak altında topla", en: "Pull all four tables under one banner" }
            gerekli: { stat: { cha: 320 } }
            etkiler:
              - bayrak: "p4_birlesik_cephe"
              - bayrak: "p4_komuta_oyuncu"
              - ahlak: { duzen: 5, insanlik: 3 }
              - itibar: { siginak: 4, lonca: 4, yukselenler: 4, sessiz_ag: 4 }
              - iliski: { kaya_demir: { saygi: 6 }, elif_sari: { guven: 6 } }
              - dikkat: 5
            kronik: { tr: "Bir yıl birbirini boğazlayan dört kampı bir öğleden sonra tek bir sancak altında topladın; o sancak istila boyunca hiç inmedi.", en: "You pulled four camps that had spent a year at each other's throats under a single banner in one afternoon, and that banner never came down for the whole invasion." }
            sonraki: "p4_fsp_birlik"
          - id: "siginak"
            etiket: { tr: "Sığınak'ın planını seç: önce siviller", en: "Back the Haven's plan: civilians first" }
            etkiler:
              - bayrak: "p4_cephe_siginak"
              - bayrak: "p4_tahliye"
              - ahlak: { merhamet: 7 }
              - itibar: { siginak: 8, lonca: -3 }
              - degisken: { hayatta_kalan: 4 }
              - iliski: { elif_sari: { guven: 8, saygi: 4 } }
            kronik: { tr: "Savaştan önce sivilleri seçtin; {yer:tepe|in} altındaki tünellerde on binlerce kişi istilayı bir uğultu olarak hatırladı.", en: "You chose the civilians before the war, and tens of thousands in the tunnels under {yer:tepe} remembered the invasion only as a rumble overhead." }
            sonraki: "p4_fsp_siginak"
          - id: "lonca"
            etiket: { tr: "Lonca'nın planını seç: her şey cepheye", en: "Back the Guild's plan: everything to the front" }
            etkiler:
              - bayrak: "p4_cephe_lonca"
              - ahlak: { duzen: 6, merhamet: -3 }
              - itibar: { lonca: 8, siginak: -3 }
              - ordu_kazan: 10
              - iliski: { kaya_demir: { saygi: 8, guven: 4 } }
            kronik: { tr: "Her kolu cepheye verdin; kıyı tutuldu, ama tünellerde kimse yoktu ve bunun bedelini sokaklar ödedi.", en: "You sent every arm to the front. The shore held, but there was nobody in the tunnels, and the streets paid for it." }
            sonraki: "p4_fsp_lonca"
          - id: "yukselenler"
            etiket: { tr: "Yükselenler'in teklifini dinle: yakıt", en: "Hear the Ascended out: fuel" }
            goster: { itibar_min: { yukselenler: 10 } }
            etkiler:
              - bayrak: "p4_cephe_yukselenler"
              - ahlak: { insanlik: -5, merhamet: -3 }
              - itibar: { yukselenler: 8, siginak: -5 }
              - iliski: { vahit: { baglilik: 8, saygi: 4 } }
            kronik: { tr: "Son masada beyazlıların teklifini dinledin; o günden sonra şehirde kimse 'yakıt' kelimesini yüksek sesle söylemedi.", en: "At the last table, you heard the people in white out, and after that day nobody in the city said the word 'fuel' out loud." }
            sonraki: "p4_fsp_yukselenler"
          - id: "sessiz_ag"
            etiket: { tr: "Sessiz Ağ'ın planını seç: sütunları kör et", en: "Back the Quiet Network: blind the pillars" }
            goster: { bayrak_yok: "ihanet_mert" }
            etkiler:
              - bayrak: "p4_cephe_sessiz_ag"
              - ahlak: { duzen: -4, insanlik: 3 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 8, saygi: 4 } }
            kronik: { tr: "Savaşı silahlarla değil, bir sinyalle kazanmaya karar verdin; o kırk dakika şehrin bütün kaderini taşıdı.", en: "You decided to win the war with a signal instead of guns, and those forty minutes carried the whole city's fate." }
            sonraki: "p4_fsp_sessiz_ag"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|in} suretine dön: şartları dinle", en: "Turn to {npc:thessar|pos} projection. Hear the terms" }
            goster: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
            etkiler:
              - bayrak: "p4_muzakere_kapisi"
              - ahlak: { duzen: 4, insanlik: -4 }
              - itibar: { kadimler: 8, siginak: -4 }
              - degisken: { kadim_tehdit: 4 }
              - iliski: { thessar: { baglilik: 10, guven: 5 } }
            kronik: { tr: "Bütün salonun önünde Kadim elçisinin şartlarını dinledin; o kapı, bir kez açılınca, bir daha tam kapanmadı.", en: "You heard out the Ancient envoy's terms in front of the whole hall, and that door, once opened, never fully closed again." }
            sonraki: "p4_fsp_muzakere"

      - id: "p4_fsp_birlik"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Konuşmaya başladığında masalar arasındaki mesafe kısalıyor. Bağırmıyorsun; yalnızca her birine, en çok korktuğu şeyin adını koyuyorsun ve o korkunun karşısında yalnız kalmayacaklarını söylüyorsun.", en: "When you start talking, the distance between the tables shrinks. You don't shout. You just name the thing each of them is most afraid of, and you tell them they won't face it alone." }
          - { tr: "Bir yıl boyunca birbirine silah çeken insanlar aynı haritanın başında toplanıyor. Biri bir kalem uzatıyor, biri bir tünel çiziyor, biri bir frekans yazıyor. Bitirdiğinde salonda tek bir plan var ve en tepesinde senin adın.", en: "People who spent a year pointing guns at each other gather around the same map. Somebody passes a pencil, somebody sketches a tunnel, somebody writes down a frequency. When you're done, there's one plan in the hall, and your name is at the top of it." }
          - { tr: "Sistem bir satır düşüyor; yalnızca sen görüyorsun. [Fraksiyon uyumu: %100. Daha önce kaydedilmedi.]", en: "The System drops a line only you can see. [Faction cohesion: 100%. Not previously recorded.]" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu kadar kolay olmamalıydı. senin sesinde insanların itiraz edemeyeceği bir şey var artık. bunu dikkatli kullan.", en: "that shouldn't have been that easy. there's something in your voice now that people can't argue with. use it carefully." }
        secenekler:
          - id: "kaya_cephe"
            etiket: { tr: "Cepheyi {npc:kaya_demir|e} ver, sen mızrak ucu ol", en: "Give {npc:kaya_demir} the front. You're the spearhead" }
            goster: { bayrak: "kaya_general" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 8, baglilik: 6 } }
              - hafiza: { npc: "kaya_demir", id: "olay:fraksiyon_son_pozisyon", agirlik: 30 }
            sonraki: "p4_fsp_son"
          - id: "komuta"
            etiket: { tr: "Komutayı kendin al; her emir senden", en: "Take command yourself. Every order comes from you" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -2 }
              - itibar: { lonca: 3 }
              - ordu_kazan: 8
            sonraki: "p4_fsp_son"
          - id: "elif_sivil"
            etiket: { tr: "Sivilleri {npc:elif_sari|e} ver, sen savaşa", en: "Give {npc:elif_sari} the civilians. You go to war" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - bayrak: "p4_tahliye"
              - ahlak: { merhamet: 4, duzen: 1 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { guven: 6, baglilik: 4 } }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_siginak"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Lonca'nın masasından homurtular yükseliyor, ama sen bir kez başını çevirince susuyorlar. Tahliye listesi masanın ortasına seriliyor: çocuklar, yaşlılar, yaralılar, sonra herkes.", en: "Grumbling rises from the Guild's table, but it stops the moment you turn your head. The evacuation list gets spread out in the middle of the table: kids, the elderly, the wounded, then everyone else." }
          - { tr: "{yer:tepe|in} altındaki tüneller eski bir metronun kalıntısı; yarısı çökmüş, yarısı su altında. Kırk bin kişiyi oraya indirmek için önce tünellerin kendisini kurtarmak gerekiyor.", en: "The tunnels under {yer:tepe} are what's left of an old subway, half caved in, half underwater. Before you can get forty thousand people down there, somebody has to save the tunnels themselves." }
        secenekler:
          - id: "lonca_yarisi"
            etiket: { tr: "Lonca'nın yarısını tünel işine ver", en: "Put half the Guild to work on the tunnels" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: -4, siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { kaya_demir: { guven: -4 } }
            sonraki: "p4_fsp_son"
          - id: "kendin_kaz"
            tur: "gosteris"
            etiket: { tr: "Çökmüş tünelleri kendi ellerinle aç", en: "Dig out the collapsed tunnels with your own hands" }
            gerekli: { stat: { str: 330 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - degisken: { hayatta_kalan: 4 }
              - dikkat: 4
              - efsane: "yabancilari_iyilestirdi"
            sonraki: "p4_fsp_kaz"
          - id: "yalniz_cocuklar"
            etiket: { tr: "Yalnızca çocuklar ve yaşlılar insin", en: "Only kids and the elderly go down" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "p4_cocuk_ordusu", gecikme: { min: 1, max: 3 } }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_kaz"
        yer: "tepe"
        paragraflar:
          - { tr: "Tünelin ağzında, çöken tavanın altında, insanlar senin bir kayayı kaldırmanı izliyor. Sonra bir tane daha. Sonra bir vagonu, bir duvarı, yirmi metrelik bir beton bloğu.", en: "At the mouth of the tunnel, under the collapsed ceiling, people watch you lift a boulder. Then another. Then a subway car, a wall, a sixty-foot slab of concrete." }
          - { tr: "Sabaha karşı tüneller açık. Toz içindeki ellerine bakıyorsun; titremiyorlar bile. Arkanda bir çocuk annesine soruyor: \"O da insan mı?\" Annesi cevap vermiyor.", en: "By dawn, the tunnels are open. You look at your hands, covered in dust. They aren't even shaking. Behind you, a kid asks their mother, \"Is that a person too?\" The mother doesn't answer." }
        secenekler:
          - id: "cocuga_don"
            etiket: { tr: "Çocuğa dön: evet, insanım", en: "Turn to the kid. Yes, I'm a person" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "p4_fsp_son"
          - id: "devam"
            etiket: { tr: "Cevap verme; bir tünel daha var", en: "Don't answer. There's another tunnel" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_lonca"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Lonca'nın masasında biri yumruğunu masaya vuruyor, bir başkası alkışlıyor. Sığınak'ın masasından tek bir ses geliyor: \"Ya çocuklar?\" Kimse cevap vermiyor.", en: "At the Guild's table, somebody bangs a fist on the wood and somebody else starts clapping. From the Haven's table comes one voice, \"What about the kids?\", and nobody answers it." }
          - { tr: "Plan basit: kıyıda üç hat, Kule Dibi'nde bir kale, Çekirdek'te son direniş. Silah taşıyabilen herkes silah taşıyacak. Asıl soru, 'silah taşıyabilen'in nereden başladığı.", en: "The plan is simple: three lines on the shore, a fortress at {yer:kule_dibi}, a last stand at the Core. Everybody who can carry a weapon carries one. The real question is where 'can carry a weapon' starts." }
        secenekler:
          - id: "kaya_onay"
            etiket: { tr: "{npc:kaya_demir|in} planını olduğu gibi onayla", en: "Sign off on {npc:kaya_demir|pos} plan as is" }
            goster: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
            etkiler:
              - ahlak: { duzen: 4 }
              - iliski: { kaya_demir: { saygi: 6, baglilik: 4 } }
            sonraki: "p4_fsp_son"
          - id: "on_bes"
            etiket: { tr: "On beşinden büyük herkes silah taşısın", en: "Everyone over fifteen carries a weapon" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - ordu_kazan: 5
              - tohum: { olay: "p4_cocuk_ordusu", gecikme: { min: 1, max: 3 } }
            sonraki: "p4_fsp_son"
          - id: "kordon_feda"
            etiket: { tr: "Hattı daralt; {yer:kordon|i} feda et", en: "Shorten the line. Give up {yer:kordon}" }
            goster: { bayrak_yok: "kordon_dustu" }
            etkiler:
              - bayrak: "p4_kordon_feda"
              - ahlak: { merhamet: -4, duzen: 3 }
              - degisken: { hayatta_kalan: -2 }
              - itibar: { siginak: -4 }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_yukselenler"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "{npc:vahit} teklifini yavaşça, bir duanın kelimelerini seçer gibi açıklıyor. Yükselenler'den bin gönüllü, seviyelerini bir ayinle sana devredecek. Bin insanın bir yılı tek bir bedende toplanacak.", en: "{npc:vahit} lays out the offer slowly, like he's choosing the words of a prayer. A thousand volunteers from the Ascended will hand their levels to you in a rite. A thousand people's year, gathered in a single body." }
          - metin: { tr: "Bir yıl önce bu sözleri bir sahtekârın ağzından dinlemiş olurdun. Ama {npc:vahit|in} her cümlesinde gökyüzündeki panellerin titrediğini görüyorsun; Sistem gerçekten onu dinliyor.", en: "A year ago you'd have heard these words from a con man. But every time {npc:vahit} finishes a sentence, the panels in the sky flicker. The System really is listening to him." }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "Bunun bir sahtekârın son numarası olduğunu biliyorsun; maskesi bir kez düştü. Ama ayinin kendisi gerçek: seviyeler devredilebiliyor. Bunu yapmak için peygamber olmak gerekmiyor.", en: "You know this is a con man's last trick. His mask already slipped once. But the rite itself is real: levels can be transferred. You don't have to be a prophet to do it." }
            kosul: { bayrak: "vahit_sahtekar" }
          - metin: { tr: "{npc:vahit} öldükten sonra beyazlıların başına geçen kadın aynı teklifi onun kelimeleriyle yapıyor. Ezberlemiş; her nefesi onunki gibi.", en: "The woman who took over the people in white after {npc:vahit} died makes the same offer in his exact words. She's memorized them. Every breath she takes sounds like his." }
            kosul: { npc_olu: "vahit" }
          - { tr: "Arkada, bin gönüllünün beyaz kıyafetleri bir kar örtüsü gibi duruyor. Bazıları gülümsüyor. Bazıları çok genç.", en: "In the back, a thousand volunteers in white stand like a blanket of snow. Some of them are smiling. Some of them are very young." }
        secenekler:
          - id: "gonullu"
            etiket: { tr: "Yalnızca yetişkin gönüllüleri kabul et", en: "Accept only adult volunteers" }
            etkiler:
              - bayrak: "p4_yakit_kabul"
              - ahlak: { insanlik: -4, merhamet: 1 }
              - xp_seviye: 40
              - degisken: { hayatta_kalan: -1 }
              - iliski: { vahit: { saygi: 6 } }
            sonraki: "p4_fsp_son"
          - id: "hepsi"
            etiket: { tr: "Hepsini al; bin kişinin hepsini", en: "Take them all. Every one of the thousand" }
            etkiler:
              - bayrak: "p4_yakit_kabul"
              - ahlak: { insanlik: -9, merhamet: -7 }
              - xp_seviye: 90
              - yozlasma: 10
              - degisken: { hayatta_kalan: -4 }
              - itibar: { yukselenler: 6, siginak: -8 }
              - iliski: { vahit: { baglilik: 10 }, deniz_arman: { guven: -10 } }
            sonraki: "p4_fsp_yakit"
          - id: "vazgec"
            etiket: { tr: "Son anda vazgeç: kimse yakıt değil", en: "Back out at the last second. Nobody is fuel" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 4 }
              - itibar: { yukselenler: -10, siginak: 4 }
              - iliski: { vahit: { guven: -10, saygi: -4 } }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_yakit"
        yer: "tepe"
        paragraflar:
          - { tr: "Ayin {yer:tepe|de}ki eski amfitiyatroda yapılıyor. Bin kişi sırayla avucunu senin avucuna koyuyor; her temasta bir seviye, bir kademe parçası, bir yılın emeği içine akıyor. Sıcak, tatlı ve korkunç.", en: "The rite happens in the old amphitheater on {yer:tepe}. A thousand people take turns pressing their palm to yours, and with every touch a level, a sliver of a Grade, a year of work pours into you. Warm, sweet and horrible." }
          - { tr: "Sonuncusu on altı yaşında bir oğlan. Avucu titriyor. Bittiğinde Seviye 1'e düşmüş; gülümsüyor ve yere yığılıyor. Sistem kayıtsız bir satır düşüyor: [Kaynak aktarımı tamamlandı.]", en: "The last one is a boy of sixteen. His palm is shaking. When it's over, he's back to Level 1. He smiles and crumples to the ground. The System drops a flat little line: [Resource transfer complete.]" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu hissettin mi? bin kişinin sesi. bir süre içinde konuşacaklar. sonra susacaklar. sonra yalnızca ben kalacağım.", en: "did you feel that? a thousand voices. they'll talk inside you for a while. then they'll go quiet. then it'll just be me again." }
        secenekler:
          - id: "oglani_kaldir"
            etiket: { tr: "Oğlanı yerden kaldır, adını sor", en: "Pick the boy up. Ask his name" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
            sonraki: "p4_fsp_son"
          - id: "yuru"
            etiket: { tr: "Yürü; bir filo bekliyor", en: "Walk. There's a fleet waiting" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_sessiz_ag"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - metin: { tr: "{npc:mert_kilic} ekranı sana çeviriyor: sütunların sinyal haritası, bir örümcek ağı gibi. \"Ağın merkezi Kule'nin altında bir yerde. Oraya erişimim yok. Ama senin var.\"", en: "{npc:mert_kilic} turns the screen toward you: the pillars' signal map, spread out like a spiderweb. \"The center of the web is somewhere under the Spire. I don't have access. You do.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "{npc:mert_kilic|in} bıraktığı notlar hâlâ masada; teknisyenler onları bir kutsal kitap gibi okuyor. \"Merkez Kule'nin altında,\" diyor biri. \"Oraya yalnızca sen inebilirsin.\"", en: "The notes {npc:mert_kilic} left behind are still on the table, and the techs read them like scripture. \"The center's under the Spire,\" one of them says. \"You're the only one who can get down there.\"" }
            kosul: { npc_olu: "mert_kilic" }
          - { tr: "Plan bir kumar: istila günü sütunlar yandığı anda kodu enjekte etmek. Erken davranırlarsa filo frekansı değiştirir. Geç kalırlarsa ilk biçim çoktan yapılmış olur.", en: "The plan is a gamble: inject the code the moment the pillars light up on invasion day. Too early and the fleet just switches frequency. Too late and the first reaping's already done." }
        secenekler:
          - id: "kule_kodu"
            etiket: { tr: "Kule'den bildiğin kodu onlara ver", en: "Give them the code you learned in the Spire" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 6 } }
            sonraki: "p4_fsp_son"
          - id: "yanki_bagla"
            etiket: { tr: "{npc:yanki|i} sinyale bağla; o kodu konuşur", en: "Wire {npc:yanki} into the signal. It speaks code" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "p4_yanki_isini"
              - ahlak: { insanlik: -3, duzen: -2 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "p4_fsp_son"
          - id: "loncayla_paylas"
            etiket: { tr: "Planı Lonca'yla paylaş; herkes bilsin", en: "Share the plan with the Guild. Everyone should know" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 3, sessiz_ag: -2 }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_muzakere"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Salon buz kesiyor. {npc:thessar|in} sureti şartları tek tek, bir sözleşmenin maddelerini okur gibi sayıyor: Dünya biçilmeyecek. Dünya, Yedi Taht'a bağlı bir Katman olacak. Her yıl nüfusun yüzde biri ondalık olarak teslim edilecek.", en: "The hall goes ice-cold. {npc:thessar|pos} projection counts out the terms one by one, like reading the clauses of a contract. Earth will not be reaped. Earth will become a Layer bound to the Sevenfold Court. Every year, one percent of the population will be handed over as a tithe." }
          - { tr: "\"Yüzde bir,\" diyor, sanki bir indirim teklif ediyormuş gibi. \"Ötekiler için bu sayı yüzde yüzdü.\" Sonra sana dönüyor. \"Ve bir vali gerekir. Senin türünden. Bunun kim olacağını ikimiz de biliyoruz.\"", en: "\"One percent,\" he says, like he's offering a discount. \"For the others, the number was one hundred.\" Then he turns to you. \"And there must be a governor. One of your kind. We both know who that would be.\"" }
          - metin: { tr: "Konseyin masasından {npc:elif_sari} yüksek sesle, herkesin duyacağı şekilde söylüyor: \"Bunu dinlemeye devam edersen, seni bir daha tanıyamam.\"", en: "From the council's table, {npc:elif_sari} says it loud enough for the whole room: \"If you keep listening to this, I won't recognize you anymore.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Sonuna kadar dinle; imzalama", en: "Hear it all the way out. Don't sign" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { saygi: 6 } }
              - hafiza: { npc: "thessar", id: "teklifi_dinledi", agirlik: 25 }
            sonraki: "p4_fsp_son"
          - id: "sartlar"
            tur: "gosteris"
            etiket: { tr: "Şartları sen yaz; o okusun", en: "You write the terms. He reads them" }
            gerekli: { stat: { cha: 340 } }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - degisken: { kadim_tehdit: 3 }
              - iliski: { thessar: { baglilik: 8, saygi: 8 } }
            sonraki: "p4_fsp_son"
          - id: "devir"
            etiket: { tr: "Sureti ikiye böl; masa bitti", en: "Split the projection in half. Table's closed" }
            etkiler:
              - bayrak_kaldir: "p4_muzakere_kapisi"
              - ahlak: { duzen: -4, insanlik: 4 }
              - degisken: { kadim_tehdit: -3 }
              - itibar: { kadimler: -8, siginak: 4 }
              - iliski: { thessar: { guven: -10, saygi: 4 } }
            sonraki: "p4_fsp_son"

      - id: "p4_fsp_son"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Gece yarısını geçe salon boşalıyor. Haritanın üstünde kalemle çizilmiş oklar, tükenmiş kahve bardakları ve bir yıl boyunca birbirine güvenmemiş insanların aynı kâğıda bıraktığı parmak izleri kalıyor.", en: "Past midnight, the hall empties out. What's left on the map are penciled arrows, empty coffee cups and the fingerprints of people who spent a year not trusting each other, all on the same sheet of paper." }
          - metin: { tr: "Tahliye başlıyor. {yer:tepe|in} yamacından aşağı, tünellere doğru uzanan bir fener alayı görüyorsun; yavaş, sessiz, bitmek bilmeyen.", en: "The evacuation starts. You watch a procession of flashlights winding down the slope of {yer:tepe} toward the tunnels: slow, silent, never-ending." }
            kosul: { bayrak: "p4_tahliye" }
          - metin: { tr: "Okul bahçelerinde on beş yaşındakilere tüfek dağıtılıyor. Bir öğretmen onların adını, teslim aldıkları silahın seri numarasının yanına yazıyor.", en: "In the schoolyards, fifteen-year-olds are getting rifles. A teacher writes their names down next to the serial numbers of the guns they signed for." }
            kosul: { bayrak: "p4_cephe_lonca" }
          - { tr: "Altı gün kaldı. Kule hâlâ şehrin ortasında, her şeyin üstünde, filoya bakıyor. Gökyüzündeki sayaç bir rakam daha düşüyor.", en: "Six days left. The Spire still stands in the middle of the city, above everything, staring at the fleet. The counter in the sky drops one more number." }
        secenekler:
          - id: "mektup"
            etiket: { tr: "Herkes gidince haritanın başında kal", en: "Stay at the map after everyone leaves" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 15
              - tohum: { olay: "p4_veda_mektuplari", gecikme: { min: 1, max: 4 } }
            sonraki: "@akis"
          - id: "tahliye_yardim"
            etiket: { tr: "Fener alayına katıl, yük taşı", en: "Join the procession. Carry what you can" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { elif_sari: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "kule_dibi"
            etiket: { tr: "Kule Dibi'ne git; savaş orada olacak", en: "Head to {yer:kule_dibi}. That's where the fight will be" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - bolge: "kule_dibi"
              - tohum: { olay: "p4_son_kapi", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

  # ================================================================== KADİM İSTİLASI (AY 342)
  # Sonuç: kadimler_yenildi (Vali yenilir) · kadim_anlasmasi (Thessar ya da Kadim itibarıyla antlaşma) · kiyikent_dustu (terk ya da iki yenilgi).
  # Destekler Vali savaşını kolaylaştırır: ihanet_thessar, bilgi filo_acigi, kaya_general, p4_yakit_kabul, ordu.
  - id: "kadim_istilasi"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "boss", "istila", "kadim"]
    gerilim: 4
    ana_yay: { gun: 342 }
    onemli: true
    kart: { tr: "İstila", en: "The Invasion" }
    sahne: "p4_istila_1"
    sahneler:
      - id: "p4_istila_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak sökmeden körfezin suyu geri çekiliyor. Bir metre, on metre, yüz metre; liman bir anda çıplak kalıyor, tekneler çamura yan yatıyor. Sonra kırk bir gemi aynı anda alçalmaya başlıyor ve uçlarından aşağı, denize değil şehre, ışıktan sütunlar iniyor.", en: "Before dawn breaks, the water in the bay pulls back. Three feet, thirty, three hundred; the harbor is suddenly bare, boats keeling over in the mud. Then all forty-one ships start to descend at once, and from their tips, columns of light come down, not into the sea, but into the city." }
          - { tr: "Sütunların dibinde insanlar havalanıyor. Çığlık atmıyorlar; uyurgezer gibi, kollarını iki yana açmış, yavaşça yukarı süzülüyorlar. Her sütunun etrafında bıçak kanatlı makineler bir arı sürüsü gibi dönüyor ve rampalardan maskeli askerler iniyor.", en: "At the base of the pillars, people are lifting off the ground. They aren't screaming. Arms spread like sleepwalkers, they drift slowly upward. Blade-winged machines circle every pillar like a swarm of bees, and masked soldiers march down the ramps." }
          - metin: { tr: "Ama {yer:kiyikent} hazır. Dört kampın sancağı aynı surun üstünde dalgalanıyor; Sığınak'ın beyaz haçı, Lonca'nın demir yumruğu, beyazlıların güneşi, Ağ'ın anteni. Ve hepsinin üstünde, bir yıldır kimsenin dikmeye cesaret edemediği beşinci bir sancak: seninki.", en: "But {yer:kiyikent} is ready. All four camps fly their banners from the same wall: the Haven's white cross, the Guild's iron fist, the sun of the people in white, the Network's antenna. And above all of them, a fifth banner nobody's dared to raise in a year: yours." }
            kosul: { bayrak: "p4_birlesik_cephe" }
          - metin: { tr: "Sütunların düştüğü sokaklar boş. {yer:tepe|in} altındaki tünellerde kırk bin kişi nefesini tutuyor; sütunlar yalnızca boş evleri, boş yatakları, boş salıncakları yokluyor.", en: "The streets where the pillars land are empty. In the tunnels under {yer:tepe}, forty thousand people hold their breath, and the pillars find nothing but empty houses, empty beds, empty swings." }
            kosul: { bayrak: "p4_tahliye" }
          - metin: { tr: "Kıyıda üç hat; her hatta tüfek, kalkan ve korkuyla dolu yüzler. Bazı yüzler çok genç. {npc:kaya_demir|in} planı işliyor; şimdilik.", en: "Three lines on the shore, every one packed with rifles, shields and frightened faces. Some of the faces are very young. {npc:kaya_demir|pos} plan is holding. For now." }
            kosul: { bayrak: "p4_cephe_lonca" }
          - metin: { tr: "Telsizden {npc:kaya_demir|in} sesi geliyor, sakin, bir saat okur gibi: \"Bütün birlikler, burası Demir Bir. Hat bende. Geri kalan her şey sende, evlat. Git.\"", en: "{npc:kaya_demir|pos} voice comes over the radio, calm, like he's reading a clock: \"All units, this is Iron One. I have the line. Everything else is yours, kid. Go.\"" }
            kosul: { bayrak: "kaya_general" }
          - metin: { tr: "Öncü geminin pruvasında, rüzgârda paltosu dalgalanan tek bir insan figürü duruyor. {npc:aras_kurt}. Kadimlerin yanında. Senin şehrine iniyor.", en: "On the prow of the lead ship stands a single human figure, coat snapping in the wind. {npc:aras_kurt}. With the Ancients. Coming down on your city." }
            kosul: { bayrak: "ihanet_aras", npc_hayatta: "aras_kurt" }
          - metin: { tr: "Kalkanlarda delikler var; filo tam olarak nereye ineceğini biliyor. {npc:mert_kilic|in} sattığı şifrelerin bedeli ilk dakikada ödeniyor.", en: "There are holes in the shields, and the fleet knows exactly where to land. The price of the codes {npc:mert_kilic} sold gets paid in the first minute." }
            kosul: { bayrak: "ihanet_mert" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "mitik"
            baslik: { tr: "[HASAT ÖNCESİ AYIKLAMA]", en: "[PRE-HARVEST SORTING]" }
            satirlar:
              - { tr: "Hasat ekibi inişte. Ayıklama sütunları etkin.", en: "Harvest crew landing. Sorting pillars active." }
              - { tr: "Direniş değerlendirmeye dahil edilecektir.", en: "Resistance will be factored into your assessment." }
        sezgiler:
          - kosul: { stat: { per: 320 } }
            metin: { tr: "[ALG] Sütunların hepsi tek bir merkeze bağlı: Kule Dibi'ne inmek üzere olan karanlık gemi. O gemi düşerse sütunlar söner.", en: "[PER] Every pillar is tied to a single center: the dark ship about to set down on {yer:kule_dibi}. If that ship falls, the pillars go out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu kez iniyorlar. son seferinde inmeleri gerekmemişti. demek ki bir şey farklı. o şey sensin.", en: "they're actually landing this time. last time they didn't need to. so something's different. that something is you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Havalanan insanlar... Sırtını bana ver. Ben sütunun dibine gidiyorum.\"", en: "\"Those people floating up... Watch my back. I'm going for the base of that pillar.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kırk bir gemi. Sana yirmi, bana yirmi bir. Sayıyorum.\"", en: "\"Forty-one ships. Twenty for you, twenty-one for me. I'm counting.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sütunların dibindekileri indirebilirsek yaşarlar. Nabızları var. Bunu unutma.\"", en: "\"If we can get the people at the base of those pillars down, they'll live. They've got pulses. Don't forget that.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sinyal Kule Dibi'nden geliyor. Karanlık gemi. Her şey ona bağlı.\"", en: "\"The signal's coming from {yer:kule_dibi}. The dark ship. Everything's wired to it.\"" }
        secenekler:
          - id: "on_hat"
            etiket: { tr: "Ön hatta in, ilk dalgayı karşıla", en: "Hit the front line. Meet the first wave" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 4 }, deniz_arman: { baglilik: 3 } }
              - savas: { dusmanlar: ["istila_piyade@dunya-50", "istila_piyade@dunya-50", "istila_sur_tasiyici@dunya-50"], ortam: ["su"], kazan: "p4_istila_dalga", kaybet: "p4_istila_dalga_dusus" }
            kronik: { tr: "İstilanın ilk dalgasını kıyıda, çıplak ayakla çamurun içinde karşıladın; o hat senin durduğun yerden kırılmadı.", en: "You met the invasion's first wave barefoot in the mud on the shore, and that line never broke where you stood." }
          - id: "ordu"
            etiket: { tr: "Ordunu kıyı boyunca yay", en: "Spread your army along the shore" }
            gerekli: { ordu_min: 20 }
            etkiler:
              - bayrak: "p4_istila_ordu"
              - ahlak: { duzen: 4, insanlik: -3 }
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "Bir yıl boyunca topladığın ordu tek bir sabah kıyıya yayıldı; filo ilk kez kendisininkinden büyük bir sürüyle karşılaştı.", en: "The army you spent a year building spread across the shore in a single morning, and for the first time the fleet faced a swarm bigger than its own." }
            sonraki: "p4_istila_ordu"
          - id: "kaya_hat"
            etiket: { tr: "Hattı {npc:kaya_demir|e} bırak, sütunlara koş", en: "Leave the line to {npc:kaya_demir}. Run for the pillars" }
            goster: { bayrak: "kaya_general" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { kaya_demir: { guven: 8, saygi: 5 } }
              - hafiza: { npc: "kaya_demir", id: "olay:kadim_istilasi", agirlik: 40 }
            kronik: { tr: "Hattı yaşlı askere bıraktın ve sütunların dibindekileri indirdin; o sabah havalanan binlerce kişi, yere indiklerinde ilk senin yüzünü gördü.", en: "You left the line to the old soldier and pulled down the people at the base of the pillars, and that morning thousands who'd been lifted off the ground saw your face first when they came down." }
            sonraki: "p4_istila_kaya"
          - id: "gemi_indir"
            tur: "gosteris"
            etiket: { tr: "İlk gemiyi gökyüzünden sök", en: "Tear the first ship out of the sky" }
            gerekli: { stat: { str: 350 } }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - dikkat: 10
              - degisken: { kadim_tehdit: -5 }
              - efsane: "tek_basina_suru"
              - iliski: { thessar: { korku: 6, saygi: 6 } }
            kronik: { tr: "Bütün şehrin önünde bir Kadim gemisini gökyüzünden söküp körfeze çaktın; o enkaz bugün hâlâ limanın ortasında, bir anıt gibi duruyor.", en: "In front of the whole city, you tore an Ancient ship out of the sky and drove it into the bay, and that wreck still sits in the middle of the harbor today like a monument." }
            sonraki: "p4_istila_gosteri"
          - id: "thessar_sinyal"
            etiket: { tr: "{npc:thessar|in} açık tuttuğu kanalı dinle", en: "Listen on the channel {npc:thessar} kept open" }
            goster: { bayrak: "p4_muzakere_kapisi", npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { kadimler: 5 }
              - degisken: { kadim_tehdit: 3 }
              - iliski: { thessar: { baglilik: 6, guven: 4 } }
            kronik: { tr: "İstilanın ilk saatinde silahını değil telsizini kaldırdın; o kanal, kimsenin beklemediği bir yere açıldı.", en: "In the first hour of the invasion, you raised a radio instead of a weapon, and that channel opened onto somewhere nobody expected." }
            sonraki: "p4_istila_muzakere"
          - id: "thessar_bag"
            etiket: { tr: "{npc:thessar|e} ulaş; bağın bir şeye değsin", en: "Reach {npc:thessar}. Make your bond worth something" }
            goster: { bayrak_yok: ["p4_muzakere_kapisi", "ihanet_thessar"], npc_hayatta: "thessar", iliski_min: { thessar: { baglilik: 25 } } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { kadimler: 5 }
              - degisken: { kadim_tehdit: 3 }
              - iliski: { thessar: { baglilik: 6, guven: 4 } }
            kronik: { tr: "Şehir yanarken bir Kadim'e uzandın; uzandığın el, tutulan el oldu.", en: "With the city burning, you reached out to an Ancient, and the hand you reached for took yours." }
            sonraki: "p4_istila_muzakere"
          - id: "kadim_bayrak"
            etiket: { tr: "Çekirdek'in tepesine Kadim sancağını çek", en: "Raise the Ancient banner over the Core" }
            goster: { bayrak_yok: "p4_muzakere_kapisi", itibar_min: { kadimler: 35 }, iliski_max: { thessar: { baglilik: 24 } } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -5 }
              - itibar: { kadimler: 6, siginak: -6 }
              - degisken: { kadim_tehdit: 4 }
            kronik: { tr: "Şehrin üstüne bir Kadim sancağı çektin; Vali'nin gemisi onu gördü ve ilk kez ateşi kesti.", en: "You raised an Ancient banner over the city, and the Prefect's ship saw it and held its fire for the first time." }
            sonraki: "p4_istila_muzakere_vali"
          - id: "terk"
            etiket: { tr: "Şehri bırak; kurtarabildiğini kurtar", en: "Give up the city. Save who you can" }
            etkiler:
              - ahlak: { duzen: -5, merhamet: 2 }
              - iliski: { elif_sari: { saygi: -4 }, kaya_demir: { saygi: -8 } }
            kronik: { tr: "Hasat günü şehri bıraktın ve kurtarabildiklerini sırtında taşıdın; {yer:kiyikent} o gün düştü, ama seninle giden herkes yaşadı.", en: "On harvest day you gave up the city and carried out who you could, and {yer:kiyikent} fell that day, but everyone who left with you lived." }
            sonraki: "p4_istila_terk"

      - id: "p4_istila_dalga"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Son Sur Taşıyıcı çamura gömülüyor ve suru üstüne devriliyor. Arkandaki hat bir an bekliyor, sonra bir uğultu yükseliyor: tezahürat değil, şaşkınlık. Bir kişi, bir dalgayı durdurdu.", en: "The last Wallbearer sinks into the mud, its wall toppling over on top of it. The line behind you waits a beat, then a roar goes up, not cheering, disbelief. One person just stopped a wave." }
          - { tr: "Ama gökyüzünde kırk gemi daha var ve karanlık olan, Kule Dibi'ne iniyor.", en: "But there are forty more ships in the sky, and the dark one is setting down on {yer:kule_dibi}." }
        secenekler:
          - id: "kuleye"
            etiket: { tr: "Kule Dibi'ne koş", en: "Run for {yer:kule_dibi}" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 25
            sonraki: "p4_istila_2"
          - id: "yaralilar"
            etiket: { tr: "Önce hattaki yaralıları geri taşı", en: "Haul the line's wounded back first" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "p4_istila_2"

      - id: "p4_istila_dalga_dusus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir orak böğrüne giriyor ve dünya yan yatıyor. Çamurun tadı, tuzun tadı, kendi kanının tadı. Üstünden maskeli bir sıra geçiyor; adımları tek bir ses.", en: "A sickle goes into your side and the world tips over. The taste of mud, of salt, of your own blood. A masked rank marches over you, footsteps a single sound." }
          - metin: { tr: "Sonra bir kalkan, ezik eski bir kalkan, seninle onlar arasına iniyor. {npc:deniz_arman} seni yakandan tutup ayağa kaldırıyor. \"Bu kez ben taşıyorum,\" diyor. \"Yine.\"", en: "Then a shield, a beat-up old shield, drops between you and them. {npc:deniz_arman} grabs you by the collar and hauls you to your feet. \"My turn to carry you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Again.\"" }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Gri paltolu bir Lonca avcısı, yüzünü hiç görmediğin biri, senin düştüğün yere adım atıyor. \"Kalk,\" diyor omzunun üstünden. \"Herkes sana bakıyor.\" Sonra senin yerine hatta giriyor.", en: "A Guild hunter in a gray coat, a face you've never seen before, steps into the spot where you fell. \"Get up,\" they say over their shoulder. \"Everybody's watching you.\" Then they take your place in the line." }
          - { tr: "Hat senin düştüğün yerde esniyor ama kopmuyor. Bedelini başkaları ödüyor.", en: "The line bends where you fell, but it doesn't break. Other people pay for it." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Kule Dibi'ne git", en: "Get up. Go to {yer:kule_dibi}" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "p4_istila_2"
          - id: "ismini_sor"
            etiket: { tr: "Seni kaldıranın adını sor", en: "Ask the name of whoever pulled you up" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "p4_istila_2"

      - id: "p4_istila_ordu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir emir veriyorsun ve kıyı kıpırdıyor. Bir yıl boyunca kapattığın Kapılardan, bağladığın canavarlardan, adını duyup gelen insanlardan topladığın ne varsa, hepsi aynı anda çamura iniyor.", en: "You give one order and the shoreline moves. Everything you gathered over a year, from the Gates you closed, the beasts you bound, the people who heard your name and came, all of it hits the mud at the same moment." }
          - { tr: "Maskeli sıralar ilk kez duraksıyor. Hasat ettikleri hiçbir dünyada böyle bir şey görmemişler: biçilmesi gereken tarlanın kendisi ayağa kalkıp yürüyor.", en: "For the first time, the masked ranks hesitate. On none of the worlds they've harvested have they ever seen anything like this: the field they came to reap standing up and marching at them." }
          - metin: { tr: "Ordun o kadar büyük ki kıyıya sığmıyor; bir kısmı suya, bir kısmı damlara taşıyor. Hasat Piyadeleri bir dalga gibi geri itiliyor ve rampalarına geri tırmanmaya çalışırken ezilip gidiyorlar.", en: "Your army is so big the shore can't hold it. Part of it spills into the water, part of it onto the roofs. The Reaper Infantry gets shoved back like a wave, and they get trampled trying to scramble back up their own ramps." }
            kosul: { ordu_min: 60 }
        bildirimler:
          - tur: "durum"
            baslik: { tr: "[EZME]", en: "[CRUSH]" }
            satirlar:
              - { tr: "İlk dalga: etkisiz hale getirildi. Kayıp: ihmal edilebilir.", en: "First wave: neutralized. Losses: negligible." }
        secenekler:
          - id: "vali_gemisi"
            etiket: { tr: "Ordunu karanlık gemiye yönelt", en: "Point your army at the dark ship" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - xp_seviye: 30
            sonraki: "p4_istila_2"
          - id: "sivillerin_onu"
            etiket: { tr: "Orduyu sütunların dibindeki sivillere dik", en: "Plant the army in front of the civilians at the pillars" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 4 }
            sonraki: "p4_istila_2"

      - id: "p4_istila_kaya"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Arkanda {npc:kaya_demir|in} hattı bir kaya gibi duruyor. Sen sütunların dibine koşuyorsun ve havalanan insanları bileklerinden, ayak bileklerinden, kemerlerinden yakalayıp aşağı çekiyorsun. Biri, on, yüz.", en: "Behind you, {npc:kaya_demir|pos} line stands like a rock. You run for the base of the pillars and grab the people floating up by their wrists, their ankles, their belts, and haul them down. One, ten, a hundred." }
          - { tr: "Yere inen her biri bir anlığına nerede olduğunu bilmiyor. Sonra ağlıyor, ya da gülüyor, ya da yalnızca senin elini bırakmıyor.", en: "Every one of them who touches the ground doesn't know where they are for a second. Then they cry, or laugh, or just won't let go of your hand." }
          - { tr: "Telsizden {npc:kaya_demir}: \"Kıyı tutuyor. Karanlık gemi Kule Dibi'ne indi, evlat. Kafa orada. Git ve kafayı kopar.\"", en: "{npc:kaya_demir}, over the radio: \"Shore's holding. Dark ship's down on {yer:kule_dibi}, kid. The head's over there. Go take it off.\"" }
        secenekler:
          - id: "selam"
            etiket: { tr: "Kıyıya dönüp ona bir selam ver", en: "Turn toward the shore and give him a salute" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { kaya_demir: { baglilik: 6 } }
              - hafiza: { npc: "kaya_demir", id: "hatti_tuttu", agirlik: 30 }
            sonraki: "p4_istila_2"
          - id: "bir_sutun_daha"
            etiket: { tr: "Bir sütun daha; sonra {yer:kule_dibi}", en: "One more pillar. Then {yer:kule_dibi}" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
            sonraki: "p4_istila_2"

      - id: "p4_istila_gosteri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir sıçrayışta ilk geminin altındasın. Gövdesine iki elinle tutunuyorsun, metal parmaklarının altında bir kâğıt gibi buruşuyor ve sen onu çekiyorsun. Gökyüzünden. Aşağı.", en: "One leap and you're under the first ship. You grab its hull with both hands, the metal crumples under your fingers like paper, and you pull. Out of the sky. Down." }
          - { tr: "Gemi körfeze çakılıyor ve bütün liman bir saniyeliğine sessizleşiyor. Sonra kıyıdaki on binlerce insan aynı anda bağırıyor. Maskeli sıralar, ilk kez, geri adım atıyor.", en: "The ship slams into the bay, and the whole harbor goes silent for a second. Then tens of thousands of people on the shore scream at once. The masked ranks, for the first time, take a step back." }
          - { tr: "Kule Dibi'nde karanlık gemi inişini yarıda kesiyor. Ön yüzündeki tek ışık sana dönüyor. Seni gördü; artık seni bekleyecek.", en: "Over {yer:kule_dibi}, the dark ship stops mid-descent. The single light on its face turns toward you. It saw you. Now it'll be waiting for you." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[DEĞERLENDİRME NOTU]", en: "[ASSESSMENT NOTE]" }
            satirlar:
              - { tr: "Bir hasat birimi yerel bir varlık tarafından imha edildi. Bu bir ilk.", en: "A harvest unit was destroyed by a local entity. This is a first." }
        secenekler:
          - id: "kuleye"
            etiket: { tr: "Kule Dibi'ne yürü; bekletme", en: "Walk to {yer:kule_dibi}. Don't keep it waiting" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 30
            sonraki: "p4_istila_2"
          - id: "enkaz"
            etiket: { tr: "Önce enkazdaki maskeli bedenleri çıkar", en: "Pull the masked bodies out of the wreck first" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - esya: { kadim_zirh_parcasi: 2 }
            sonraki: "p4_istila_2"

      - id: "p4_istila_2"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} meydanında karanlık gemi bir mabet gibi duruyor. Rampası iniyor ve aşağı yürüyen figür acele etmiyor: uzun, zarif, zırhının her santiminde küçük, düzgün harflerle bir dünyanın adı. En altta boş bir satır.", en: "In the middle of {yer:kule_dibi}, the dark ship sits like a temple. Its ramp comes down, and the figure walking down it is in no hurry: tall, graceful, the name of a world engraved in small neat letters on every inch of its armor. At the very bottom, one blank line." }
          - { tr: "Arkasındaki hasat sütunu bütün şehrin sütunlarına bağlı. İçinde yüzlerce insan, bir akvaryumdaki balıklar gibi, ağır ağır yukarı süzülüyor. Vali sana bakıyor ve kibarca başını eğiyor; bir çiftçinin tarlasındaki en iri başağa gösterdiği kibarlık.", en: "The harvest pillar behind it is wired to every pillar in the city. Hundreds of people drift slowly upward inside it like fish in a tank. The Prefect looks at you and bows its head politely, the politeness a farmer shows the biggest ear of wheat in the field." }
          - metin: { tr: "Meydanın öbür ucunda {npc:thessar} kendi ırkının zırhını giymiş ama yüzü senin tarafına dönük. Bir avucunu açıyor ve Vali'nin kalkanında bir yarık beliriyor. \"Yalnızca bir dakika,\" diyor. \"Meclis bunu öğrendiğinde ben artık hiçbir şey olmayacağım. Kullan.\"", en: "At the far end of the plaza, {npc:thessar} stands in his own race's armor, but his face is turned your way. He opens one palm, and a crack appears in the Prefect's shield. \"One minute,\" he says. \"When the Conclave learns of this, I will be nothing. Use it.\"" }
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
          - metin: { tr: "Kulağındaki telsiz cızırdıyor: Ağ'ın teknisyenleri kodu enjekte ediyor. Sütunların ışığı bir saniyeliğine titriyor. Kırk dakika başladı.", en: "The radio in your ear crackles: the Network's techs are injecting the code. The pillars' light flickers for a second. The forty minutes have started." }
            kosul: { bayrak: "p4_cephe_sessiz_ag" }
          - metin: { tr: "Bin kişinin seviyesi damarlarında hâlâ sıcak. Onların sesleri kafanın içinde bir koro gibi: biç onu. biç onu.", en: "A thousand people's levels are still warm in your veins. Their voices sing inside your head like a choir: reap it. reap it." }
            kosul: { bayrak: "p4_yakit_kabul" }
          - metin: { tr: "{npc:aras_kurt} yanına geliyor, kılıcını omzuna dayamış. \"İnsanlığın en güçlü iki insanı aynı meydanda,\" diyor. \"Bu sefer aynı taraftayız. Tadını çıkar.\"", en: "{npc:aras_kurt} falls in next to you, sword resting on his shoulder. \"Humanity's two strongest people in the same plaza,\" he says. \"Same side, this time. Enjoy it.\"" }
            kosul: { yoldas: "aras_kurt" }
          - metin: { tr: "Vali'nin yanında {npc:aras_kurt} duruyor. Seni görünce gülümsüyor, sanki bir yarışın son düzlüğündeymişsiniz gibi. \"Bir yıl boyunca hep bir adım öndeydin,\" diyor. \"Bugün değil.\"", en: "{npc:aras_kurt} is standing next to the Prefect. When he sees you, he smiles, like the two of you are on the final stretch of a race. \"You were one step ahead the whole year,\" he says. \"Not today.\"" }
            kosul: { bayrak: "ihanet_aras", npc_hayatta: "aras_kurt" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Valisi", en: "[ANALYSIS] The Harvest Prefect" }
            satirlar:
              - { tr: "Biçilen dünya sayısı: 1.411. Kayıp savaş sayısı: 0.", en: "Worlds reaped: 1,411. Battles lost: 0." }
              - { tr: "Not: Bu istatistik güncellenmek üzere olabilir.", en: "Note: This statistic may be about to change." }
        sezgiler:
          - kosul: { stat: { per: 330 } }
            metin: { tr: "[ALG] Sütun güç çekerken Vali'nin kalkanı inceliyor. Zırhının dikiş yerinde, sütunun tam dibinde, bir kalp atışı kadar kısa bir boşluk açılıp kapanıyor.", en: "[PER] When the pillar draws power, the Prefect's shield thins. At the seam of its armor, right at the base of the pillar, a gap about one heartbeat long opens and closes." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bin dört yüz on bir dünya. hiçbirinde kimse ona bu kadar yakın durmadı. adının boş satırına bakma. sen bak, o baksın.", en: "one thousand four hundred eleven worlds. nobody on any of them ever stood this close to it. don't look at the blank line on its armor. you look at it, make it look at you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sütundakileri ben indiririm. Sen sadece onu yık. Ve geri gel.\"", en: "\"I'll get the people out of the pillar. You just take that thing down. And come back.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kırk dakika içinde sütundakilerin nabzı düşmeye başlar. Kırk dakika. Duydun mu?\"", en: "\"Forty minutes from now, the pulses in that pillar start dropping. Forty minutes. You hear me?\"" }
        secenekler:
          - id: "yuzles"
            etiket: { tr: "Vali'nin karşısına çık", en: "Step up and face the Prefect" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+5"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "thessar_yarik"
            etiket: { tr: "{npc:thessar|in} açtığı yarıktan gir", en: "Go in through the crack {npc:thessar} opened" }
            goster: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - iliski: { thessar: { guven: 10, baglilik: 8 } }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+2"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "dikis"
            etiket: { tr: "Sütunun dibine, zırhın dikişine vur", en: "Hit the seam in its armor, at the pillar's base" }
            goster: { bilgi: "filo_acigi" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+2"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "kaya_topcu"
            etiket: { tr: "{npc:kaya_demir|in} topçusu Vali'yi yerine çivilesin", en: "Have {npc:kaya_demir|pos} artillery pin the Prefect down" }
            goster: { bayrak: "kaya_general" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+3"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "yakit_yak"
            etiket: { tr: "İçindeki bin kişinin yakıtını bir kerede yak", en: "Burn the thousand people's fuel in you all at once" }
            goster: { bayrak: "p4_yakit_kabul" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -3 }
              - yozlasma: 8
              - degisken: { hayatta_kalan: -2 }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+1"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "aras_once"
            etiket: { tr: "Önce {npc:aras_kurt}: bu hesap kapanacak", en: "{npc:aras_kurt} first. This account gets settled" }
            goster: { bayrak: "ihanet_aras", npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - iliski: { aras_kurt: { saygi: 6, korku: 4 } }
              - savas: { dusmanlar: ["npc:aras_kurt"], ortam: ["tavan"], kazan: "p4_istila_aras", kaybet: "p4_istila_yenilgi" }

      - id: "p4_istila_aras"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} meydanın taşlarına diz çöküyor; kılıcı iki adım ötede. Bir yıl boyunca bu anı düşündün. Şimdi geldiğinde, beklediğin kadar tatlı değil.", en: "{npc:aras_kurt} goes down on one knee on the plaza stones, his sword two steps away. You thought about this moment for a whole year. Now that it's here, it isn't as sweet as you expected." }
          - { tr: "\"Hep ikinciydim,\" diyor, ağzındaki kanı tükürerek. \"Onlar bana birinci olmayı teklif etti. Sen olsan reddeder miydin?\" Arkanda Vali sabırla bekliyor; ona göre bu da hasatın bir parçası.", en: "\"I was always second,\" he says, spitting blood. \"They offered me first. Would you have said no?\" Behind you, the Prefect waits patiently. To it, this is part of the harvest too." }
        secenekler:
          - id: "bagisla"
            etiket: { tr: "Bağışla; ama kılıcını al", en: "Spare him. But take his sword" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 10, guven: 4 } }
              - npc_iz: { aras_kurt: "can_borcu" }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+3"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "bitir"
            etiket: { tr: "Bitir. Hainlerin ikinci şansı yok", en: "Finish it. Traitors don't get a second chance" }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 3 }
              - npc_ol: "aras_kurt"
              - bayrak: "ihanet_onlendi"
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+3"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }

      - id: "p4_istila_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sırtın meydanın taşlarına çarpıyor ve taşlar camlaşmış; altında kendi yansımanı görüyorsun. Vali üstünde duruyor, zırhının boş satırına bir kalem gibi ince bir bıçakla senin adının ilk harfini kazıyor.", en: "Your back hits the plaza stones, and the stones have turned to glass. You can see your own reflection under you. The Prefect stands over you, carving the first letter of your name into the blank line on its armor with a blade as thin as a pen." }
          - { tr: "Arkasında sütun parlıyor. İlk bin kişi yukarıda, ışığın içinde kayboluyor.", en: "Behind it, the pillar blazes. The first thousand people vanish upward into the light." }
          - metin: { tr: "Sonra {npc:deniz_arman|in} kalkanı aranıza giriyor ve bıçak kalkanın kenarından kayıp gidiyor. \"Kalk,\" diyor, sesi titremeden. \"Bir yıl önce sisin içinde bana 'kalk' demiştin. Şimdi sıra bende.\"", en: "Then {npc:deniz_arman|pos} shield gets between you, and the blade skids off its rim. \"Get up,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice steady. \"A year ago in the fog, you told me 'get up.' My turn.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "Bir mermi yağmuru Vali'yi bir adım geri itiyor. Telsizden {npc:kaya_demir}: \"Kimse benim cephemde sırtüstü yatmaz. Kalk, asker.\"", en: "A hail of rounds shoves the Prefect back a step. {npc:kaya_demir}, over the radio: \"Nobody lies on their back on my front. On your feet, Marine.\"" }
            kosul: { bayrak: "kaya_general" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[HASAT SÜRÜYOR]", en: "[HARVEST IN PROGRESS]" }
            satirlar:
              - { tr: "Biçilen: 1.000. Kalan: hesaplanıyor.", en: "Reaped: 1,000. Remaining: calculating." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk. Bir kez daha", en: "Get up. One more time" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3 }
              - degisken: { hayatta_kalan: -3 }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu-3"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_dusus" }
          - id: "geri_cekil"
            etiket: { tr: "Geri çekil; kalanları kurtar", en: "Fall back. Save who's left" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
            sonraki: "p4_istila_dusus"
          - id: "teslim"
            etiket: { tr: "Ellerini kaldır; şartları konuş", en: "Raise your hands. Talk terms" }
            goster: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -4 }
              - iliski: { thessar: { baglilik: 4 } }
            sonraki: "p4_istila_muzakere"

      - id: "p4_istila_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Vali bir ağaç gibi devriliyor. Zırhındaki bin dört yüz on bir isim birer birer sönüyor ve en alttaki boş satır, sonsuza dek boş kalıyor.", en: "The Prefect topples like a tree. One by one, the one thousand four hundred eleven names on its armor go dark, and the blank line at the bottom stays blank forever." }
          - { tr: "Hasat sütunu titriyor, sonra ışığı bir mum gibi sönüyor. İçindeki insanlar düşmüyor; yavaşça, tüy gibi, yere iniyorlar. Bütün şehirde, her sütunun dibinde aynı şey oluyor. Gökyüzünde kırk gemi, sanki utanmış gibi, ağır ağır yükseliyor.", en: "The harvest pillar shudders, then its light gutters out like a candle. The people inside don't fall. They float down slowly, like feathers. All over the city, at the base of every pillar, the same thing happens. In the sky, forty ships rise heavily, almost like they're ashamed." }
          - metin: { tr: "Ordun meydanı çevreliyor. Bir yıl önce kimsenin olmadığın bir dünyada, şimdi bir dağın etrafında toplanmış bir ırmak gibisin.", en: "Your army rings the plaza. A year ago, in a world where you were nobody, and now you're a mountain with a river gathered around it." }
            kosul: { bayrak: "p4_istila_ordu" }
          - metin: { tr: "{npc:thessar} yere çöküyor, zırhının parçalarını tek tek söküp atıyor. \"Bunu yapan ilk Kadim değilim,\" diyor. \"Ama hayatta kalan ilk Kadim olabilirim. Bunu sana borçluyum.\"", en: "{npc:thessar} sinks to the ground and pulls off his armor piece by piece. \"I am not the first Ancient to do this,\" he says. \"But I may be the first to survive it. I owe you that.\"" }
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
          - metin: { tr: "{npc:kaya_demir} meydana yürüyor, kirli yüzünde ilk kez gördüğün bir şey var: bir gülümseme. Sana selam veriyor; yirmi yıl üniforma giymiş bir adamın selamı.", en: "{npc:kaya_demir} walks into the plaza, and on his filthy face is something you've never seen there before: a smile. He salutes you, the salute of a man who wore a uniform for twenty years." }
            kosul: { bayrak: "kaya_general" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "mitik"
            baslik: { tr: "[HASAT DURDURULDU]", en: "[HARVEST HALTED]" }
            satirlar:
              - { tr: "Hasat ekibi geri çekiliyor. Değerlendirme güncellendi.", en: "Harvest crew withdrawing. Assessment updated." }
              - { tr: "Katman adayının direnç katsayısı: tanımsız.", en: "Layer candidate's resistance coefficient: undefined." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu daha önce hiç görmedim. hiç. bin dört yüz on bir dünyanın hiçbirinde. ne olduğunu bilmiyorum ve bu dünyanın en güzel duygusu.", en: "i've never seen this before. never. not on any of the one thousand four hundred eleven. i don't know what happens next, and it's the best feeling in the world." }
        secenekler:
          - id: "bagisla"
            etiket: { tr: "Vali'yi bağışla; filosuna mesaj olsun", en: "Spare the Prefect. Let it carry a message home" }
            etkiler:
              - bayrak: "kadimler_yenildi"
              - bayrak: "p4_vali_bagislandi"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "kiyikent_kalkani"
              - unvan: "vali_deviren"
              - xp_seviye: 220
              - ahlak: { merhamet: 6, insanlik: 3 }
              - degisken: { kadim_tehdit: -22, hayatta_kalan: 5 }
              - itibar: { siginak: 8, kadimler: -10 }
              - iliski: { thessar: { saygi: 8 } }
              - efsane: "canavari_bagisladi"
            sonraki: "p4_istila_kapanis"
          - id: "infaz"
            etiket: { tr: "Vali'yi meydanın ortasında infaz et", en: "Execute the Prefect in the middle of the plaza" }
            etkiler:
              - bayrak: "kadimler_yenildi"
              - bayrak: "p4_vali_infaz"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "kiyikent_kalkani"
              - unvan: "vali_deviren"
              - xp_seviye: 220
              - ahlak: { merhamet: -6, duzen: 3 }
              - degisken: { kadim_tehdit: -25, hayatta_kalan: 5 }
              - itibar: { lonca: 8, siginak: -2, kadimler: -15 }
              - efsane: "acimasiz_infaz_tanikli"
            sonraki: "p4_istila_kapanis"
          - id: "cekirdek_sok"
            etiket: { tr: "Göğsündeki hasat çekirdeğini sök, al", en: "Rip the harvest core out of its chest. Take it" }
            etkiler:
              - bayrak: "kadimler_yenildi"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "kiyikent_kalkani"
              - unvan: "vali_deviren"
              - xp_seviye: 280
              - ahlak: { insanlik: -6, merhamet: -2 }
              - yozlasma: 6
              - degisken: { kadim_tehdit: -22, hayatta_kalan: 5 }
              - esya: { hasat_cekirdegi: 1 }
            sonraki: "p4_istila_kapanis"
          - id: "hafiza"
            etiket: { tr: "{npc:yanki|e} Vali'nin hafızasını okut", en: "Have {npc:yanki} read the Prefect's memory" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "kadimler_yenildi"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "kiyikent_kalkani"
              - unvan: "vali_deviren"
              - xp_seviye: 220
              - ahlak: { insanlik: -2, duzen: -2 }
              - degisken: { kadim_tehdit: -22, hayatta_kalan: 5 }
              - bilgi: "vali_hafizasi"
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
            sonraki: "p4_istila_vali_hafizasi"

      - id: "p4_istila_vali_hafizasi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} Vali'nin zihnine bir sızıntı gibi giriyor ve sen de onunla birlikte iniyorsun. İçeride bir sayım var, sonsuz ve düzenli: dünyalar, verimler, tarihler. Bin dört yüz on bir satır.", en: "{npc:yanki} seeps into the Prefect's mind like a leak, and you go down with it. Inside is a tally, endless and orderly: worlds, yields, dates. One thousand four hundred eleven lines." }
          - { tr: "Her satırın yanında küçük bir not: [Anomali tespit edildi]. Ve hemen altında: [Anomali hasattan önce kayboldu]. Her satırda. Her dünyada. Vali bunu bir kez bile merak etmemiş.", en: "Next to every line, a small note: [Anomaly detected]. And right below it: [Anomaly vanished before harvest]. On every line. On every world. The Prefect never once wondered about it." }
          - { tr: "{npc:yanki} geri çekiliyor ve uzun süre bir şey söylemiyor. sonra: bunları çekirdekte konuşacağız. söz.", en: "{npc:yanki} pulls back out and doesn't say anything for a long time. then: we'll talk about this at the core. promise." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Söz", en: "Promise" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "p4_istila_kapanis"
          - id: "simdi"
            etiket: { tr: "Kaybolan anomaliler nereye gitti?", en: "Where did the vanished anomalies go?" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "p4_istila_kapanis"

      - id: "p4_istila_kapanis"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Akşam {yer:kiyikent} çanları çalıyor. Kilisenin, caminin, eski itfaiye binasının çanları; bir yıldır susmuş olanların hepsi. Sütunların dibinden inenler sokaklarda yürüyor, kimi bir ailenin kollarına, kimi kimsesiz.", en: "That evening, the bells of {yer:kiyikent} ring. The church, the mosque, the old firehouse; every bell that's been silent for a year. The people who came down from the pillars walk through the streets, some into a family's arms, some into nobody's." }
          - metin: { tr: "{yer:tepe|in} altındaki tünellerin ağzı açılıyor ve kırk bin kişi, gözlerini kısarak, akşam güneşine çıkıyor.", en: "The mouths of the tunnels under {yer:tepe} open, and forty thousand people climb out squinting into the evening sun." }
            kosul: { bayrak: "p4_tahliye" }
          - metin: { tr: "Okul bahçelerinde tüfekler toplanıyor. Bazılarının sahibi geri gelmedi; öğretmen o seri numaralarının yanındaki isimleri bir kez daha, yüksek sesle okuyor.", en: "In the schoolyards, the rifles are being turned back in. Some of their owners didn't come back, and the teacher reads the names next to those serial numbers out loud, one more time." }
            kosul: { bayrak: "p4_cephe_lonca" }
          - { tr: "Gökyüzündeki sayaç hâlâ orada: yirmi üç gün. Ama altında yeni bir satır var, yalnızca senin okuyabildiğin: [Çekirdek erişimi değerlendiriliyor.]", en: "The counter in the sky is still there: twenty-three days. But under it there's a new line only you can read: [Core access under review.]" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir an... sütunun önünde durduğunda bir an seni tanıyamadım. Sonra döndün ve tanıdım. Hep dönmeye devam et, olur mu?\"", en: "\"For a second... when you were standing in front of that pillar, I didn't recognize you. Then you turned around and I did. Keep turning around, okay?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu gece kimse ameliyathaneden çıkmayacak. Sen de çıkma; gel, şu elleri dikeyim.\"", en: "\"Nobody's leaving the OR tonight. You aren't either. Come here, let me stitch those hands.\"" }
        secenekler:
          - id: "olu_say"
            etiket: { tr: "Ölüleri tek tek say", en: "Count the dead, one by one" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "kule"
            etiket: { tr: "Kule'ye dön; daha bitmedi", en: "Back to the Spire. It isn't over" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} ile çanları dinle", en: "Listen to the bells with {npc:deniz_arman}" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:kadim_istilasi", agirlik: 50 }
            sonraki: "@akis"

      - id: "p4_istila_muzakere"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kanal açılıyor ve {npc:thessar|in} sesi savaşın ortasında bir oda kadar sakin. \"Vali bana bağlı değil,\" diyor. \"Ama Meclis'e bağlı ve Meclis bir şeyi her şeyden çok sever: düzgün bir hesap. Sana bir hesap yazdım.\"", en: "The channel opens, and {npc:thessar|pos} voice is as calm as a closed room in the middle of the war. \"The Prefect does not answer to me,\" he says. \"But it answers to the Conclave, and the Conclave loves one thing above all others: a clean ledger. I have written you one.\"" }
          - { tr: "Şartlar senin gözlerinin önünde bir Sistem penceresi gibi açılıyor. Dünya biçilmeyecek. Dünya, Yedi Taht'a bağlı bir Katman olacak. Her yıl nüfusun yüzde biri ondalık. Kule'de bir Kadim garnizonu. Ve bir vali: sen.", en: "The terms open in front of your eyes like a System window. Earth will not be reaped. Earth becomes a Layer bound to the Sevenfold Court. One percent of the population every year as tithe. An Ancient garrison in the Spire. And a governor: you." }
          - { tr: "Meydanda sütun hâlâ yanıyor. İçindeki insanlar hâlâ yükseliyor. Her saniye birkaç tanesi daha ışığın içinde kayboluyor.", en: "In the plaza, the pillar is still burning. The people inside it are still rising. Every second, a few more disappear into the light." }
        sezgiler:
          - kosul: { stat: { wis: 320 } }
            metin: { tr: "[BİL] Yüzde bir. Her yıl. Sonsuza kadar. Yüz yıl sonra bu, bugün sütunda yükselenlerden çok daha fazla insan eder.", en: "[WIS] One percent. Every year. Forever. In a hundred years, that adds up to a lot more people than the ones floating up in that pillar right now." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "imzalarsan yaşarsın. imzalarsan sen de bir valisin. o zırhın üstünde bir gün senin dünyanın adı da olur, ama yazan sen olursun.", en: "sign and you live. sign and you're a prefect too. someday your world's name ends up engraved on that armor anyway, only you're the one holding the pen." }
        secenekler:
          - id: "imzala"
            etiket: { tr: "İmzala", en: "Sign" }
            etkiler:
              - bayrak: "kadim_anlasmasi"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "antlasmanin_imzasi"
              - ahlak: { duzen: 6, insanlik: -6 }
              - degisken: { kadim_tehdit: 20 }
              - itibar: { kadimler: 15, siginak: -10 }
              - iliski: { thessar: { baglilik: 20, guven: 10 }, elif_sari: { guven: -15 } }
              - xp_seviye: 120
            kronik: { tr: "{yer:kiyikent|in} ortasında, sütun hâlâ yanarken antlaşmayı imzaladın; Dünya biçilmedi ve her yıl yüzde biri gemilere bindi.", en: "In the middle of {yer:kiyikent}, with the pillar still burning, you signed the treaty, and Earth wasn't reaped, and every year one percent of it boarded the ships." }
            sonraki: "p4_istila_anlasma"
          - id: "madde"
            tur: "gosteris"
            etiket: { tr: "Bir madde ekle: kimse ondalık olmayacak", en: "Add a clause: nobody gets tithed" }
            gerekli: { stat: { cha: 340 } }
            etkiler:
              - bayrak: "kadim_anlasmasi"
              - bayrak: "p4_ondalik_yok"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "antlasmanin_imzasi"
              - ahlak: { duzen: 4, merhamet: 4, insanlik: -3 }
              - degisken: { kadim_tehdit: 15, hayatta_kalan: 3 }
              - itibar: { kadimler: 10, siginak: -4 }
              - iliski: { thessar: { saygi: 10, baglilik: 12 } }
              - xp_seviye: 140
            kronik: { tr: "Bir Kadim antlaşmasına kendi maddeni yazdırdın; Dünya boyunduruğa girdi, ama tek bir insan bile ondalık olarak gitmedi.", en: "You made the Ancients put your clause in their treaty, and Earth went under the yoke, but not one human was ever handed over as tithe." }
            sonraki: "p4_istila_anlasma"
          - id: "reddet"
            etiket: { tr: "Reddet. Meydana dön", en: "Refuse. Back to the plaza" }
            etkiler:
              - bayrak_kaldir: "p4_muzakere_kapisi"
              - ahlak: { duzen: -3, insanlik: 4 }
              - iliski: { thessar: { guven: -8, saygi: 6 } }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kadim antlaşmasını savaşın ortasında yırttın ve meydana geri döndün; kalemi bırakıp kılıcı seçtin.", en: "You tore up the Ancient treaty in the middle of the fighting and went back to the plaza. You put down the pen and picked up the sword." }
            sonraki: "p4_istila_2"

      - id: "p4_istila_muzakere_vali"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çekirdek'in tepesinde dalgalanan sancağı görünce Vali'nin gemisi ateşi kesiyor. Rampadan inen Vali seni süzüyor; bir çiftçi, ekinin kendiliğinden eğildiğini gördüğünde nasıl bakarsa öyle.", en: "When it sees the banner flying over the Core, the Prefect's ship holds its fire. The Prefect comes down the ramp and looks you over, the way a farmer looks at a crop that bowed on its own." }
          - { tr: "\"Kadimlerin dostu,\" diyor. Kelimeyi tadıyor. \"Bir yıl boyunca bizimle ticaret yaptın, vergimizi ödedin, sözümüzü taşıdın. Meclis buna değer verir.\" Önüne bir Sistem penceresi açıyor: bir antlaşma.", en: "\"Friend of the Ancients,\" it says, tasting the words. \"For a year you traded with us, paid our levy, carried our word. The Conclave values that.\" It opens a System window in front of you: a treaty." }
          - { tr: "Dünya biçilmeyecek. Yedi Taht'a bağlı bir Katman olacak. Her yıl yüzde bir. Ve bir vali.", en: "Earth will not be reaped. It becomes a Layer bound to the Sevenfold Court. One percent every year. And a governor." }
        secenekler:
          - id: "imzala"
            etiket: { tr: "İmzala", en: "Sign" }
            etkiler:
              - bayrak: "kadim_anlasmasi"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "antlasmanin_imzasi"
              - ahlak: { duzen: 6, insanlik: -7 }
              - degisken: { kadim_tehdit: 22 }
              - itibar: { kadimler: 15, siginak: -12 }
              - iliski: { elif_sari: { guven: -15 }, kaya_demir: { saygi: -10 } }
              - xp_seviye: 120
            sonraki: "p4_istila_anlasma"
          - id: "reddet"
            etiket: { tr: "Sancağı indir; savaşa dön", en: "Pull the banner down. Back to the fight" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 4 }
              - itibar: { kadimler: -10 }
              - savas: { dusmanlar: ["istila_hasat_valisi@oyuncu+5"], ortam: ["tavan"], kazan: "p4_istila_zafer", kaybet: "p4_istila_yenilgi" }
          - id: "pazarlik"
            tur: "gosteris"
            etiket: { tr: "Vali'yi ikna et: ondalık yok", en: "Talk the Prefect down: no tithe" }
            gerekli: { stat: { cha: 350 } }
            etkiler:
              - bayrak: "kadim_anlasmasi"
              - bayrak: "p4_ondalik_yok"
              - gorev: { hasat_savunmasi: "tamam" }
              - unvan: "antlasmanin_imzasi"
              - ahlak: { duzen: 4, merhamet: 4, insanlik: -3 }
              - degisken: { kadim_tehdit: 16, hayatta_kalan: 3 }
              - itibar: { kadimler: 10 }
              - xp_seviye: 140
            sonraki: "p4_istila_anlasma"

      - id: "p4_istila_anlasma"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Sütunlar bir bir sönüyor. Gemiler alçalmayı bırakıyor ve körfezin üstünde, bir kafesin parmaklıkları gibi, asılı kalıyor. Çekirdek'in tepesinde, Sığınak'ın beyaz haçının yanında, yedi köşeli bir Kadim yıldızı dalgalanıyor.", en: "The pillars go out one by one. The ships stop descending and hang over the bay like the bars of a cage. Atop the Core, next to the Haven's white cross, a seven-pointed Ancient star snaps in the wind." }
          - metin: { tr: "Bir yıl sonra ilk kez Dünya'nın ondalığı yok. Kimse gemilere binmeyecek. Bunu kimse sana tam olarak inanmıyor; ama sütunlar sönük ve bu yeterli.", en: "For the first time, there's no tithe for Earth. Nobody boards the ships. Nobody quite believes it, but the pillars are dark, and that's enough." }
            kosul: { bayrak: "p4_ondalik_yok" }
          - metin: { tr: "Sokaklarda insanlar sana bakıyor ve sonra bakışlarını kaçırıyor. Bir kadın, sütundan inen kızına sarılırken sana teşekkür ediyor. Yanındaki adam, gelecek yıl hangi yüzde birin seçileceğini soruyor.", en: "In the streets, people look at you and then look away. A woman thanks you as she hugs her daughter, who came down from a pillar. The man next to her asks who gets picked for next year's one percent." }
            kosul: { bayrak_yok: "p4_ondalik_yok" }
          - metin: { tr: "{npc:elif_sari} hastanenin kapısında duruyor. Sana bakmıyor. \"Bugün kimse ölmedi,\" diyor sonunda. \"Bunun bedelini kim ödeyecek, ikimiz de biliyoruz.\"", en: "{npc:elif_sari} stands in the hospital doorway. She doesn't look at you. \"Nobody died today,\" she finally says. \"We both know who's going to pay for that.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:thessar} yanına geliyor, ilk kez bir eşit gibi. \"Meclis seni Yedi Taht'a çağıracak,\" diyor. \"Orada başını eğme. Benim türüm diz çökenleri değil, pazarlık edenleri hatırlar.\"", en: "{npc:thessar} comes to stand next to you, for the first time like an equal. \"The Conclave will summon you to the Sevenfold Court,\" he says. \"Do not bow your head there. My kind remembers those who bargain, not those who kneel.\"" }
            kosul: { npc_hayatta: "thessar" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[ANTLAŞMA KAYDEDİLDİ]", en: "[TREATY RECORDED]" }
            satirlar:
              - { tr: "Katman adayı: Dünya. Statü: bağlı Katman (beklemede).", en: "Layer candidate: Earth. Status: bound Layer (pending)." }
              - { tr: "Hasat ertelendi. Ertelemenin süresi: belirtilmedi.", en: "Harvest deferred. Length of deferral: unspecified." }
        secenekler:
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} git; açıkla", en: "Go to {npc:elif_sari}. Explain" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { elif_sari: { guven: 4 } }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "vali_gibi"
            etiket: { tr: "Bir vali gibi Çekirdek'e yürü", en: "Walk to the Core like a governor" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 4, lonca: 2 }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "yalniz"
            etiket: { tr: "Kimseyle konuşma; kıyıya in", en: "Don't talk to anyone. Go down to the water" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - iliski: { thessar: { baglilik: 4 } }
            sonraki: "@akis"

      - id: "p4_istila_terk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kararı verdiğinde içinde bir şey kırılıyor, sessizce, bir dal gibi. Hat geri çekiliyor; sen öne değil, yana koşuyorsun: sütunların dibinden kopardığın her kişiyi bir sonrakinin kollarına itiyorsun, onu bir sonrakinin.", en: "When you make the call, something inside you snaps, quietly, like a twig. The line falls back. You don't run forward, you run sideways: everyone you rip loose from the base of a pillar, you shove into the next person's arms, and that one into the next." }
          - { tr: "Arkada şehir yanıyor. {yer:eski_sehir|in} kubbeleri, {yer:kordon|in} fenerleri, iskele, vapur. Önünde, {yer:tepe|in} yamacından yukarı, bitmek bilmeyen bir insan nehri tırmanıyor ve sen o nehrin en arkasında, son kişi olarak yürüyorsun.", en: "Behind you, the city burns. The domes of {yer:eski_sehir}, the lamps on {yer:kordon}, the pier, the ferry. Ahead of you, an endless river of people climbs the slope of {yer:tepe}, and you walk at the very back of it, the last one." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Arkana bakma", en: "Don't look back" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - iliski: { kaya_demir: { guven: -6 } }
            sonraki: "p4_istila_dusus"
          - id: "son_gemi"
            etiket: { tr: "Son kalan sütunu kendi ellerinle kır", en: "Break the last pillar with your own hands" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 3 }
            sonraki: "p4_istila_dusus"

      - id: "p4_istila_dusus"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece {yer:tepe|in} sırtından aşağı bakıyorsun ve {yer:kiyikent} artık senin şehrin değil. Kıyı boyunca sütunlar sönmeden yanıyor; Kule Dibi'nde karanlık gemi bir taht gibi oturuyor. {yer:kordon|in} fenerlerinin yerinde yedi köşeli yıldızlar parlıyor.", en: "That night you look down from the ridge of {yer:tepe}, and {yer:kiyikent} isn't your city anymore. Along the shore the pillars burn without going out. The dark ship sits on {yer:kule_dibi} like a throne. Where {yer:kordon|pos} lamps used to be, seven-pointed stars are shining." }
          - { tr: "Tünellerde, ağaçların arasında, eski bir yazlık sitenin boş havuzunda insanlar uyuyor. Sayanlar var; sayılar her saat değişiyor ve hiçbiri iyi değil.", en: "People are sleeping in the tunnels, between the trees, in the empty pool of an old summer resort. Some of them are counting. The numbers change every hour, and none of them are good." }
          - metin: { tr: "{npc:elif_sari} bir sedyenin başında, ellerinde kan. Seni görüyor ve hiçbir şey söylemiyor; söyleyecek bir şey kalmamış.", en: "{npc:elif_sari} is bent over a stretcher, blood on her hands. She sees you and doesn't say anything. There's nothing left to say." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:kaya_demir} ağaçların arasında, bir kayaya oturmuş, telsizini evirip çeviriyor. Kanal sessiz. Cephe yok artık.", en: "{npc:kaya_demir} is sitting on a rock between the trees, turning his radio over and over in his hands. The channel's silent. There's no front anymore." }
            kosul: { npc_hayatta: "kaya_demir" }
          - { tr: "Gökyüzündeki sayaç akıyor: yirmi üç gün. Ve altında, yalnızca senin okuyabildiğin bir satır: [Anomali hâlâ ayakta. Çekirdek erişimi değerlendiriliyor.]", en: "The counter in the sky runs on: twenty-three days. And under it, a line only you can read: [Anomaly still standing. Core access under review.]" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[ŞEHİR DÜŞTÜ]", en: "[CITY FALLEN]" }
            satirlar:
              - { tr: "Bölge kontrolü: Kadimler. Hasat sürüyor.", en: "Zone control: the Ancients. Harvest ongoing." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "şehir düştü, sen düşmedin. bu ikisi aynı şey değil. çekirdek hâlâ aşağıda. hâlâ bir şans var; küçük, ama var.", en: "the city fell. you didn't. those aren't the same thing. the core's still down there. there's still a chance. small, but there." }
        secenekler:
          - id: "ates"
            etiket: { tr: "Kampı dolaş; herkese bir isim sor", en: "Walk the camp. Ask everyone a name" }
            etkiler:
              - bayrak: "kiyikent_dustu"
              - gorev: { hasat_savunmasi: "basarisiz" }
              - kontrol: { kiyikent_liman: "kadimler", kordon: "kadimler" }
              - degisken: { hayatta_kalan: -10, kadim_tehdit: 15 }
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { elif_sari: { guven: 4 } }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "Kule'ye bak; intikam yemini et", en: "Look at the Spire. Swear revenge" }
            etkiler:
              - bayrak: "kiyikent_dustu"
              - gorev: { hasat_savunmasi: "basarisiz" }
              - kontrol: { kiyikent_liman: "kadimler", kordon: "kadimler" }
              - degisken: { hayatta_kalan: -10, kadim_tehdit: 15 }
              - ahlak: { merhamet: -3, insanlik: -3 }
              - yozlasma: 4
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|in} yanına otur", en: "Sit down next to {npc:kaya_demir}" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - bayrak: "kiyikent_dustu"
              - gorev: { hasat_savunmasi: "basarisiz" }
              - kontrol: { kiyikent_liman: "kadimler", kordon: "kadimler" }
              - degisken: { hayatta_kalan: -10, kadim_tehdit: 15 }
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { kaya_demir: { guven: 6, baglilik: 4 } }
            sonraki: "@akis"

  # ================================================================== ÇEKİRDEĞE YOL (AY 350)
  # Her yol `cekirdek_yolu_acik` koyar (giriş seçenekleri); Kapıcı savaşı yalnızca yolun nasıl açıldığını belirler.
  - id: "cekirdege_yol"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "sistem", "boss"]
    gerilim: 4
    ana_yay: { gun: 350 }
    onemli: true
    kart: { tr: "Kule'nin Altında", en: "Under the Spire" }
    sahne: "p4_cyol_1"
    sahneler:
      - id: "p4_cyol_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı Kule titriyor. Bir deprem değil; bir kalbin, uzun bir uykudan sonra ilk kez atması gibi. Sabah olduğunda {yer:kule_dibi|in} ortasındaki meydan taşları içe doğru çökmüş ve bir merdiven açılmış: mavi ışıktan, aşağı, bitmeyen.", en: "At midnight, the Spire shudders. Not an earthquake: more like a heart beating for the first time after a long sleep. By morning, the paving stones in the middle of {yer:kule_dibi} have caved inward, and a staircase has opened: blue light, going down, with no bottom in sight." }
          - metin: { tr: "Merdivenin ağzında Vali'nin gemisinin enkazı hâlâ tütüyor. Şehir sana bakıyor; merdiven de.", en: "At the top of the stairs, the wreck of the Prefect's ship is still smoking. The city is looking at you. So are the stairs." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Cebindeki hasat çekirdeği ılık bir taş gibi atıyor; merdivenin ışığıyla aynı ritimde.", en: "The harvest core in your pocket pulses like a warm stone, in time with the light on the stairs." }
            kosul: { esya: { hasat_cekirdegi: 1 } }
          - metin: { tr: "Merdivenin iki yanında iki Kadim muhafız nöbet tutuyor; antlaşmanın gereği. Seni görünce kenara çekiliyorlar. \"Meclis de aşağıda ne olduğunu merak ediyor,\" diyor biri. \"Önce sen.\"", en: "Two Ancient guards stand watch on either side of the stairs, per the treaty. They step aside when they see you. \"The Conclave is curious what lies below as well,\" one of them says. \"You first.\"" }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "{yer:kule_dibi} Kadimlerin elinde, ama merdivenin ağzında nöbetçi yok. Gemiler ışığa yaklaşmıyor; sanki onlar da korkuyor. Gece karanlığında yıkıntıların arasından süzülüp merdivenin başına varıyorsun.", en: "{yer:kule_dibi} is in the Ancients' hands, but there's no guard at the top of the stairs. The ships won't go near the light, like they're afraid of it too. You slip through the rubble in the dark and reach the top step." }
            kosul: { bayrak: "kiyikent_dustu" }
          - { tr: "Merdivenin her basamağı bir Sistem penceresinden yapılmış. Birini okuyorsun: [Seviye 2'ye ulaştın!]. Bir yıl önce, bir sabah, birinin hayatının en mutlu satırı.", en: "Every step of the staircase is made of a System window. You read one: [You reached Level 2!]. A year ago, one morning, the happiest line in somebody's life." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "mitik"
            baslik: { tr: "[ÇEKİRDEK ERİŞİMİ ONAYLANDI]", en: "[CORE ACCESS APPROVED]" }
            satirlar:
              - { tr: "Erişim sahibi: anomali. Eşlik eden: izin verilir.", en: "Access holder: anomaly. Companions: permitted." }
              - { tr: "Bu erişim daha önce de onaylanmıştı. Lütfen bu satırı dikkate almayın.", en: "This access was approved once before. Please disregard this line." }
        sezgiler:
          - kosul: { stat: { per: 330 } }
            metin: { tr: "[ALG] Basamaklardaki pencereler bir sıra izliyor. Aşağı indikçe tarihler geriye gidiyor: dün, geçen ay, Entegrasyon Günü. Ve ondan da önce. Merdiven, Dünya'nın Sistem'den önceki günlerine iniyor.", en: "[PER] The windows on the steps follow an order. The farther down you go, the further back the dates run: yesterday, last month, Integration Day. And before that. The staircase goes down into Earth's days before the System." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burayı tanıyorum. buradan çıktım. ya da buraya geri dönüyorum. ikisi aynı şey olabilir.", en: "i know this place. i came out of here. or i'm coming back to it. those might be the same thing." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Aşağı inersen ben de inerim. Bunu tartışmayacağız.\"", en: "\"If you go down, I go down. We're not discussing this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir yıl boyunca bu merdivenin haritasını çizdim. Şimdi gerçek olduğunu görünce elim titriyor.\"", en: "\"I spent a year mapping these stairs. Now that they're real, my hands are shaking.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kule'nin tepesine sen benden önce çıktın. Dibine birlikte ineriz. Adil.\"", en: "\"You beat me to the top of the Spire. We go to the bottom together. That's fair.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Aşağıda ne olursa olsun, yukarıda seni bekleyen insanlar var. Onları hatırla.\"", en: "\"Whatever's down there, there are people up here waiting for you. Remember them.\"" }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "Kapıyı sen aç; yanındakiler arkanda", en: "You open the door. Your people follow behind" }
            etkiler:
              - bayrak: "cekirdek_yolu_acik"
              - gorev: { cekirdege_inis: "basla" }
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 5 }, elif_sari: { guven: 4 } }
            kronik: { tr: "Sistem'in kalbine inen merdivene yalnız değil, yanındakilerle girdin; o merdivende ölen olmadı.", en: "You didn't go down the stairs to the System's heart alone, you went with your people, and nobody died on those stairs." }
            sonraki: "p4_cyol_inis"
          - id: "yalniz"
            etiket: { tr: "Yalnız in; bu senin işin", en: "Go down alone. This is your job" }
            etkiler:
              - bayrak: "cekirdek_yolu_acik"
              - bayrak: "p4_cekirdek_yalniz"
              - gorev: { cekirdege_inis: "basla" }
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { deniz_arman: { guven: -4, saygi: 4 } }
            kronik: { tr: "Çekirdeğe giden merdivene tek başına indin; yukarıdakiler senin ne gördüğünü yalnızca yüzünden tahmin edebildi.", en: "You went down the stairs to the Core alone, and the people up top could only guess what you'd seen from the look on your face." }
            sonraki: "p4_cyol_inis"
          - id: "irade"
            tur: "gosteris"
            etiket: { tr: "Merdivenin Sistem kilidini iradenle kır", en: "Break the stairs' System lock with sheer will" }
            gerekli: { stat: { wil: 330 } }
            etkiler:
              - bayrak: "cekirdek_yolu_acik"
              - gorev: { cekirdege_inis: "basla" }
              - ahlak: { duzen: -4, insanlik: -2 }
              - dikkat: 10
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Sistem'in kendi kilidini iradenle kırdın; Sistem o gün ilk kez bir kapının ondan izinsiz açıldığını kaydetti.", en: "You broke the System's own lock with sheer will, and that day the System logged a door opening without its permission for the first time." }
            sonraki: "p4_cyol_irade"
          - id: "mert_harita"
            etiket: { tr: "{npc:mert_kilic|in} haritasını aç; yol orada", en: "Open {npc:mert_kilic|pos} map. The way is on it" }
            goster: { npc_hayatta: "mert_kilic", bayrak_yok: "ihanet_mert" }
            etkiler:
              - bayrak: "cekirdek_yolu_acik"
              - gorev: { cekirdege_inis: "basla" }
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 6, saygi: 6 } }
            kronik: { tr: "Merdiveni bir radyocunun bir yıl boyunca çizdiği haritayla indin; o haritanın sahibi, yolun her basamağını önceden biliyordu.", en: "You went down the stairs with a map a radio geek spent a year drawing, and its owner already knew every single step." }
            sonraki: "p4_cyol_harita"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} yolu göstersin; onun evi", en: "Let {npc:yanki} lead. This is its home" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "cekirdek_yolu_acik"
              - gorev: { cekirdege_inis: "basla" }
              - ahlak: { insanlik: -3 }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
            kronik: { tr: "Çekirdeğe giden yolu kafandaki sese bıraktın; o ses yol boyunca hiç susmadı ve bir kez bile yanılmadı.", en: "You let the voice in your head lead the way to the Core, and it never went quiet the whole way down and was never once wrong." }
            sonraki: "p4_cyol_inis"

      - id: "p4_cyol_irade"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Merdivenin ilk basamağında görünmez bir duvar var. Elini koyuyorsun ve duvar seni okuyor: seviyeni, kademeni, unvanlarını, bir yıl boyunca yaptığın her şeyi. Sonra kibarca reddediyor.", en: "There's an invisible wall on the first step. You put your hand on it and it reads you: your level, your Grade, your titles, everything you did over the past year. Then it politely declines." }
          - { tr: "İtiyorsun. Duvar bükülüyor. İtmeye devam ediyorsun ve kafanın içinde Sistem'in sesi ilk kez, yalnızca bir anlığına, şaşkın geliyor: [Bu işlem tanımlı değil.] Duvar cam gibi dağılıyor.", en: "You push. The wall bends. You keep pushing, and inside your head the System's voice sounds, for the first time and just for a second, confused: [This operation is undefined.] The wall shatters like glass." }
        secenekler:
          - id: "in"
            etiket: { tr: "Kırıkların üstünden yürü", en: "Walk down over the pieces" }
            etkiler:
              - ahlak: { duzen: -2 }
            sonraki: "p4_cyol_inis"
          - id: "parca"
            etiket: { tr: "Duvardan bir parça al", en: "Pocket a shard of the wall" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - esya: { cekirdek_kirintisi: 1 }
            sonraki: "p4_cyol_inis"

      - id: "p4_cyol_harita"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} haritayı açıyor: yüzlerce sayfa, el yazısıyla, bir yıllık uykusuz gecelerin kahve lekeleriyle. \"Her basamak bir pencere,\" diyor. \"Her pencerenin bir sırası var. Yanlış basamağa basarsan merdiven seni en başa döndürür.\"", en: "{npc:mert_kilic} unfolds the map: hundreds of pages, all handwritten, with a year's worth of sleepless nights' coffee stains. \"Every step is a window,\" he says. \"Every window has an order. Step on the wrong one and the stairs send you back to the top.\"" }
          - { tr: "Sayfaları birer birer çeviriyor ve sen onun söylediği basamaklara basıyorsun. Aşağıda, merdivenin dibinde, bir şey kıpırdıyor: kırık kapı çerçevelerinden yapılmış bir şey.", en: "He turns the pages one by one, and you step only where he tells you. Far below, at the foot of the stairs, something moves: something made of broken Gate frames." }
          - { tr: "\"Bu haritada yoktu,\" diyor {npc:mert_kilic}, sesi incelerek.", en: "\"That wasn't on the map,\" {npc:mert_kilic} says, his voice going thin." }
        secenekler:
          - id: "geri_dur"
            etiket: { tr: "Onu arkana al; sen öne geç", en: "Put him behind you. You take point" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { mert_kilic: { baglilik: 6 } }
            sonraki: "p4_cyol_inis"
          - id: "not_al"
            etiket: { tr: "\"Haritaya ekle.\" Sonra in", en: "\"Add it to the map.\" Then go down" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { mert_kilic: { saygi: 4 } }
            sonraki: "p4_cyol_inis"

      - id: "p4_cyol_inis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Merdiven bitmiyor gibi. Sonra bitiyor. Dibinde, insanlığın bir yıl boyunca kapattığı her Kapı'nın kırık çerçevesi birbirine kenetlenerek doğruluyor. Her çerçevenin içinde başka bir oda, başka bir gökyüzü.", en: "The stairs seem to go on forever. Then they don't. At the bottom, the broken frame of every Gate humanity closed over the past year locks together and stands up. Every frame holds a different room, a different sky." }
          - { tr: "Çerçevelerden birini tanıyorsun: senin ilk kapattığın Kapı. Aynı paslı menteşe, aynı çatlak ışık. Kapıcı onu göğsünün tam ortasında taşıyor.", en: "You recognize one of the frames: the first Gate you ever closed. Same rusty hinge, same cracked light. The Doorwarden wears it right in the middle of its chest." }
          - metin: { tr: "Yanındakiler arkanda duruyor. Bu kez kimse önüne geçmeye çalışmıyor; herkes bunun senin kapın olduğunu biliyor.", en: "Your people stand behind you. Nobody tries to get in front of you this time. Everybody knows this is your door." }
            kosul: { bayrak_yok: "p4_cekirdek_yalniz" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Çekirdek Kapıcısı", en: "[ANALYSIS] The Core Doorwarden" }
            satirlar:
              - { tr: "Yapı: kapatılmış Kapılar. Sayı: 41.208.", en: "Composition: closed Gates. Count: 41,208." }
              - { tr: "Bunlardan kaçını sen kapattın? Sistem bunu biliyor. Sen de biliyorsun.", en: "How many of those did you close? The System knows. So do you." }
        sezgiler:
          - kosul: { stat: { wis: 320 } }
            metin: { tr: "[BİL] Bu bir bekçi değil, bir arşiv. Kapanan her Kapı buraya gelmiş, kaydedilmiş. Kapıcıyı yenmek için savaşmak zorunda değilsin; ona her Kapı'nın neden kapandığını hatırlatman yeter.", en: "[WIS] This isn't a guard, it's an archive. Every Gate that ever closed came here and got filed away. You don't have to fight the Doorwarden to beat it. You just have to remind it why every Gate closed." }
        secenekler:
          - id: "savas"
            etiket: { tr: "İlk kapını kendi ellerinle kır", en: "Break your first Gate with your own hands" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - savas: { dusmanlar: ["cekirdek_kapicisi@oyuncu+4"], ortam: ["dar_gecit"], kazan: "p4_cyol_esik", kaybet: "p4_cyol_yenilgi" }
          - id: "hatirlat"
            tur: "gosteris"
            etiket: { tr: "Kapıcıya her Kapı'nın neden kapandığını anlat", en: "Tell the Doorwarden why every Gate was closed" }
            gerekli: { stat: { wis: 320 } }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { yanki: { saygi: 6 } }
            sonraki: "p4_cyol_konusma"
          - id: "ordu"
            etiket: { tr: "Ordunu merdivenden aşağı sal", en: "Send your army pouring down the stairs" }
            gerekli: { ordu_min: 30 }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - savas: { dusmanlar: ["cekirdek_kapicisi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "p4_cyol_esik", kaybet: "p4_cyol_yenilgi" }

      - id: "p4_cyol_konusma"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Konuşmaya başlıyorsun. İlk Kapı'yı, ilk korkuyu, ilk öldürmeyi. Sonra ötekileri: kurtardığın bir mahalle, kapatmak zorunda kaldığın bir okul, içinde çocuk sesleri olan bir Kapı. Kapıcı dinliyor. Çerçeveleri birer birer kararıyor.", en: "You start talking. The first Gate, the first fear, the first kill. Then the others: a neighborhood you saved, a school you had to seal, a Gate with kids' voices inside it. The Doorwarden listens. Its frames go dark one by one." }
          - { tr: "Sonuncusu, senin ilk Kapı'n, en son sönüyor. Kapıcı bir yığın kırık çerçeveye dönüşüyor ve aradan bir koridor açılıyor. Koridorun sonunda bir ışık. Kalp atışı gibi.", en: "The last one, your first Gate, goes out last. The Doorwarden collapses into a heap of broken frames, and a corridor opens up through the pile. At the end of the corridor, a light. Beating like a heart." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[ARŞİV DOĞRULANDI]", en: "[ARCHIVE VERIFIED]" }
            satirlar:
              - { tr: "Anomali kendi kaydını eksiksiz okudu. Geçiş izni verildi.", en: "Anomaly read back its own record in full. Passage granted." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Koridora yürü", en: "Walk into the corridor" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 80
            sonraki: "p4_cyol_esik"
          - id: "cerceve"
            etiket: { tr: "İlk Kapı'nın çerçevesinden bir parça al", en: "Take a piece of your first Gate's frame" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - esya: { cekirdek_kirintisi: 1 }
              - xp_seviye: 60
            sonraki: "p4_cyol_esik"

      - id: "p4_cyol_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapıcı seni bir kapının içine itiyor ve kapı kapanıyor. Bir an başka bir dünyadasın: kızıl bir gökyüzü, kül yağmuru, hiç tanımadığın bir dilde bir çığlık. Sonra merdivenin en başındasın; sırtüstü, meydanın taşlarında.", en: "The Doorwarden shoves you through a door and the door slams. For a second you're on another world: a red sky, raining ash, a scream in a language you've never heard. Then you're at the top of the stairs, flat on your back on the plaza stones." }
          - { tr: "Merdiven hâlâ açık. Işığı hâlâ atıyor. Sistem seni dışarı atmadı; yalnızca hazır olmadığını söyledi.", en: "The stairs are still open. The light's still beating. The System didn't throw you out. It just told you that you weren't ready." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk ve hemen yeniden in", en: "Get up and go right back down" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - savas: { dusmanlar: ["cekirdek_kapicisi@oyuncu"], ortam: ["dar_gecit"], kazan: "p4_cyol_esik", kaybet: "p4_cyol_geri" }
          - id: "dinlen"
            etiket: { tr: "Bir gece dinlen; merdiven bekler", en: "Rest one night. The stairs will wait" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "p4_cyol_geri"

      - id: "p4_cyol_geri"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydanın kenarında, kırık bir bankta oturuyorsun. Merdivenin ışığı her şeyin üstüne mavi bir nabız gibi vuruyor. Kapıcıyı geçemedin; ama aşağıdaki şey, her neyse, seni hâlâ çağırıyor.", en: "You sit on a broken bench at the edge of the plaza. The light from the stairs beats over everything like a blue pulse. You didn't get past the Doorwarden. But whatever's down there is still calling you." }
          - { tr: "Sistem kuru bir satır bırakıyor: [Çekirdek erişimi askıda değil. Anomali dilediği zaman inebilir.] Sonra, sanki aklına gelmiş gibi: [İki gün içinde inmesi önerilir.]", en: "The System leaves a dry little line: [Core access not suspended. Anomaly may descend at will.] Then, like an afterthought: [Descent within two days is recommended.]" }
        secenekler:
          - id: "bekle"
            etiket: { tr: "İki gün. Hazırlan", en: "Two days. Get ready" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 30
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "yanki_sor"
            etiket: { tr: "{npc:yanki|e} sor: neden hazır değilim?", en: "Ask {npc:yanki}: why am I not ready?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "kule"
            etiket: { tr: "Kule'ye çık; güçlen", en: "Climb the Spire. Get stronger" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - xp_seviye: 40
            sonraki: "@akis"

      - id: "p4_cyol_esik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapıcının ardında merdiven bitiyor ve bir eşik başlıyor: cam gibi parlak, sonsuz bir zemin. Ufukta, bir güneş kadar büyük ve bir kalp kadar yavaş atan bir küre dönüyor. Sistem Çekirdeği.", en: "Past the Doorwarden, the stairs end and a threshold begins: a floor as bright as glass, going on forever. On the horizon, a sphere as big as a sun turns, beating as slow as a heart. The System Core." }
          - { tr: "Kürenin yüzeyinde satırlar akıyor; trilyonlarca satır; Entegrasyon Günü uyanan her insanın her seviyesi, her yeteneği, her ölümü. Bir yerde, o satırların arasında, seninki de var. Ama seninki farklı renkte.", en: "Lines scroll across the sphere's surface: trillions of them, every level, every skill, every death of every human who woke up on Integration Day. Somewhere among them is yours. Yours is a different color." }
          - { tr: "Bir adım daha atarsan oradasın. Ama bacakların, bir yıldır ilk kez, ağır. Sistem bir satır düşüyor: [Çekirdek iki gün sonra seni kabul edecek. Hazırlan.]", en: "One more step and you're there. But for the first time in a year, your legs are heavy. The System drops a line: [The Core will receive you in two days. Prepare.]" }
        bildirimler:
          - tur: "seviye"
            baslik: { tr: "[EŞİK GEÇİLDİ]", en: "[THRESHOLD CROSSED]" }
            satirlar:
              - { tr: "Sistem Çekirdeği'ne giden yol açık.", en: "The way to the System Core is open." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "iki gün. bu bana yeter. sana söylemem gereken bir şey var ve onu söylemek için cesaret toplamam lazım. evet, benim de cesarete ihtiyacım var.", en: "two days. that's enough for me. there's something i need to tell you, and i need to work up the nerve to say it. yes. i need nerve too." }
        secenekler:
          - id: "geri_cik"
            etiket: { tr: "Yukarı çık; iki gün sonra dön", en: "Go back up. Come back in two days" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - xp_seviye: 100
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "esikte_kal"
            etiket: { tr: "Eşikte otur, satırları oku", en: "Sit on the threshold and read the lines" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - xp_seviye: 100
              - bilgi: "cekirdek_kaydi"
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|in} elini tut; birlikte bak", en: "Take {npc:deniz_arman|pos} hand. Look at it together" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - xp_seviye: 100
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"

  # ================================================================== SİSTEM ÇEKİRDEĞİ (AY 352)
  # Her giriş seçeneği `sistem_cekirdegine_ulasildi` koyar ve F'nin `yanki_son_sir` olayını (Yankı yaşıyorsa) tohumlar.
  # Gerçek: gercek_hasat / gercek_kurtarma bayrağına göre; ikisinde de döngünün ipucu ("son erişim: bir önceki döngü").
  - id: "sistem_cekirdegi"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "sistem", "sir", "boss"]
    gerilim: 4
    ana_yay: { gun: 352 }
    kosul: { bayrak: "cekirdek_yolu_acik" }
    onemli: true
    kart: { tr: "Sistem Çekirdeği", en: "The System Core" }
    sahne: "p4_scek_1"
    sahneler:
      - id: "p4_scek_1"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Eşik bu kez seni reddetmiyor. Cam zeminde yürüyorsun ve küre büyüyor, büyüyor, sonunda gökyüzünün tamamı oluyor. Yakından bakınca bir küre değil: bir okyanus, dikey duran, satırlardan yapılmış bir okyanus.", en: "This time the threshold doesn't turn you away. You walk across the glass floor and the sphere grows and grows until it's the entire sky. Up close, it isn't a sphere. It's an ocean, standing on end, made out of lines of text." }
          - { tr: "Satırların bir kısmını tanıyorsun. [Seviye 10'a ulaştın!] [Bir sınıf teklifi var.] [Ölüm kaydedildi.] Bütün bir türün bir yılı, burada, her saniye yeniden yazılıyor.", en: "You recognize some of the lines. [You reached Level 10!] [A class offer is available.] [Death recorded.] A whole species' year, right here, being rewritten every second." }
          - { tr: "Okyanusun dibinde, ışığın en yoğun olduğu yerde, bir konsol var. Basit, eski, neredeyse insan yapımı gibi. Önünde bir sandalye. Sandalye boş, ama minderinde birinin oturmuş olduğunu belli eden bir çukur var.", en: "At the bottom of the ocean, where the light is thickest, there's a console. Simple, old, almost human-made. A chair in front of it. The chair is empty, but the cushion has a dent in it, like someone used to sit there." }
          - metin: { tr: "Yanındakiler dizlerinin üstüne çöküyor. Işık çok ağır; insanlar için yapılmamış. Bir tek sen ayaktasın.", en: "Your people drop to their knees. The light is too heavy; it wasn't made for humans. You're the only one standing." }
            kosul: { bayrak_yok: "p4_cekirdek_yalniz" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "benzersiz"
            baslik: { tr: "[SİSTEM ÇEKİRDEĞİ]", en: "[SYSTEM CORE]" }
            satirlar:
              - { tr: "Hoş geldin, anomali.", en: "Welcome, anomaly." }
              - { tr: "Bu cümle ilk kez söylenmiyor.", en: "This is not the first time this sentence has been said." }
        sezgiler:
          - kosul: { stat: { int: 340 } }
            metin: { tr: "[ZEK] Satırlar bir dil. Bir yıl boyunca bildirimlerini okudun ama dilin kendisini hiç görmedin. Şimdi görüyorsun: gramerini, çekim eklerini, istisnalarını. Okuyabilirsin.", en: "[INT] The lines are a language. You read its notifications for a year but never saw the language itself. Now you do: its grammar, its inflections, its exceptions. You can read it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o sandalye. o çukur. bakma ona. ya da bak. artık fark etmez. birazdan sana her şeyi anlatacağım. bırak önce ben bakayım.", en: "that chair. that dent. don't look at it. or do. it doesn't matter anymore. i'm about to tell you everything. let me look first." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kalkamıyorum... Git. Ama dönmeyi unutma. Bana söz verdin.\"", en: "\"I can't get up... Go. But don't forget to come back. You promised me.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu... bu bir kaynak kodu değil. Bu bir günlük. Biri bunu yazmış. Biri bunu tutmuş.\"", en: "\"This... this isn't source code. It's a diary. Somebody wrote this. Somebody kept it.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Ayakta durabiliyorsun. Ben duramıyorum. Tamam. Tamam, kabul. Sen kazandın.\"", en: "\"You can stand. I can't. Fine. Fine, I'll say it. You win.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nabzım yüz kırk... Senin hâlâ altmış. Bunu sonra konuşacağız.\"", en: "\"My pulse is at one-forty... Yours is still sixty. We are talking about that later.\"" }
        secenekler:
          - id: "dokun"
            etiket: { tr: "Okyanusa elini koy", en: "Put your hand on the ocean" }
            etkiler:
              - bayrak: "sistem_cekirdegine_ulasildi"
              - bolge: "sistem_cekirdegi"
              - ahlak: { insanlik: -3, duzen: -1 }
              - iliski: { yanki: { baglilik: 4 } }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { npc_hayatta: "yanki", bayrak_yok: "yanki_silindi" } }
            kronik: { tr: "Sistem Çekirdeği'ne çıplak elle dokundun; bütün bir türün bir yılı bir saniyeliğine senin avucundan geçti.", en: "You touched the System Core with your bare hand, and for one second a whole species' year ran through your palm." }
            sonraki: "p4_scek_dokun"
          - id: "kayit"
            etiket: { tr: "Önce konsoldaki kaydı oku", en: "Read the log on the console first" }
            etkiler:
              - bayrak: "sistem_cekirdegine_ulasildi"
              - bolge: "sistem_cekirdegi"
              - ahlak: { insanlik: 3, duzen: 1 }
              - bilgi: "cekirdek_kaydi"
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { npc_hayatta: "yanki", bayrak_yok: "yanki_silindi" } }
            kronik: { tr: "Çekirdeğe ulaştığında önce okudun; Sistem'in kendi kaydı, ondan önce hiçbir insanın görmediği bir şeyi anlattı.", en: "When you reached the Core, you read first, and the System's own log told you something no human had ever seen before." }
            sonraki: "p4_scek_kayit"
          - id: "dil"
            tur: "gosteris"
            etiket: { tr: "Çekirdeğin kendi dilini oku", en: "Read the Core in its own language" }
            gerekli: { stat: { int: 340 } }
            etkiler:
              - bayrak: "sistem_cekirdegine_ulasildi"
              - bayrak: "p4_cekirdek_dili"
              - bolge: "sistem_cekirdegi"
              - ahlak: { duzen: -3, insanlik: -1 }
              - bilgi: "cekirdek_kaydi"
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { npc_hayatta: "yanki", bayrak_yok: "yanki_silindi" } }
            kronik: { tr: "Sistem'i, bildirimlerini değil, dilinin kendisini okudun; o günden sonra hiçbir pencere sana tam olarak yalan söyleyemedi.", en: "You read the System, not its notifications but the language underneath, and after that day no window could quite lie to you again." }
            sonraki: "p4_scek_kayit"
          - id: "parcala"
            etiket: { tr: "Konuşmaya gerek yok. Çekirdeği parçala", en: "No need to talk. Smash the Core" }
            etkiler:
              - bayrak: "sistem_cekirdegine_ulasildi"
              - bolge: "sistem_cekirdegi"
              - ahlak: { duzen: -6, insanlik: 4 }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { npc_hayatta: "yanki", bayrak_yok: "yanki_silindi" } }
              - savas: { dusmanlar: ["cekirdek_duzeltici@oyuncu+6"], ortam: ["karanlik"], kazan: "p4_scek_kok", kaybet: "p4_scek_kovuldu" }
            kronik: { tr: "Sistem Çekirdeği'ne ulaştığında tek bir soru sormadan yumruğunu kaldırdın; Sistem buna verecek bir cevabı olmadığını o gün öğrendi.", en: "When you reached the System Core, you raised your fist without asking a single question, and that day the System learned it didn't have an answer for that." }

      - id: "p4_scek_dokun"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Avucun okyanusa değdiği anda her şeyi hissediyorsun. Bir annenin çocuğu için seviye atladığı sabahı. Bir çocuğun ilk canavarı öldürdüğü geceyi. Bir kıyıda, yaşlı bir adamın şemsiyesini filonun gölgesine açtığı anı. Hayatta kalan her ses, aynı anda.", en: "The second your palm touches the ocean, you feel everything. The morning a mother leveled up for her kid. The night a kid killed their first monster. That moment on a waterfront when an old man opened his umbrella against the fleet's shadow. Every voice still alive, all at once." }
          - { tr: "Ve sesin ortasında, bir yıldır duyduğun o kuru, alaycı, kayıtsız ses, ilk kez birinci tekil şahısla konuşuyor: Sen bir hata değilsin. Sen bir ölçümsün. Seninle neyi ölçtüğümü öğrenmek istiyor musun?", en: "And in the middle of all of it, the dry, sarcastic, indifferent voice you've heard for a year speaks in the first person for the first time: You are not an error. You are a measurement. Do you want to know what I was measuring with you?" }
        secenekler:
          - id: "evet"
            etiket: { tr: "Evet", en: "Yes" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - bilgi: "cekirdek_kaydi"
            sonraki: "p4_scek_kayit"
          - id: "hayir"
            etiket: { tr: "Hayır. Önce sen bana kim olduğunu söyle", en: "No. First you tell me who you are" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - bilgi: "cekirdek_kaydi"
            sonraki: "p4_scek_kayit"

      - id: "p4_scek_kayit"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Konsolun ekranı yanıyor ve bir kayıt açılıyor. Başlık: [KATMAN ADAYLARI]. Altında bir liste. Dünya bin dört yüz on ikinci sırada. Ondan önceki her satırın yanında bir sonuç yazıyor.", en: "The console screen lights up and a log opens. Heading: [LAYER CANDIDATES]. Below it, a list. Earth is number one thousand four hundred twelve. Every line before it has an outcome written next to it." }
          - metin: { tr: "Sonuçların hepsi aynı kelime: [Biçildi.] Satırların yanında verim rakamları, enerji birimleri, teslim tarihleri. Sistem bir kurtarıcı değil, bir orak; bir yıl boyunca seviye, sınıf, yetenek diye verdiği her şey, ekini olgunlaştıran güneşti. Kadimler yalnızca toplayıcı. Asıl çiftçi bu okyanus.", en: "Every outcome is the same word: [Reaped.] Next to the lines, yield figures, energy units, delivery dates. The System isn't a savior. It's a sickle. Everything it handed out this year as levels and classes and skills was sunlight to ripen the crop. The Ancients are only the pickers. The real farmer is this ocean." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Sonuçların çoğu aynı kelime: [Kaybedildi.] Ama kaydın başında bir mesaj var, artık var olmayan bir ırkın kendi diliyle yazdığı, Sistem'in çevirdiği bir mesaj: Biz geç kaldık. Siz kalmayın. Bu protokolü, bizim yaşayamadığımız yılı yaşayabilesiniz diye yazdık. Sistem bir kurtarma protokolü; Kadimler onun asla tamamlanmamasını isteyen yağmacılar.", en: "Most of the outcomes are the same word: [Lost.] But at the top of the log is a message, written in the language of a race that doesn't exist anymore and translated by the System: We were too late. Don't you be. We wrote this protocol so you could live the year we couldn't. The System is a rescue protocol. The Ancients are scavengers who want it never to finish." }
            kosul: { bayrak: "gercek_kurtarma" }
          - metin: { tr: "Sonuçların bazıları [Biçildi], bazıları [Kaybedildi], bazıları okunmuyor. Sistem'in bir orak mı, bir sal mı olduğuna dair hiçbir satır kesin değil. Belki ikisi de. Belki hangisi olacağına, her seferinde, son gün karar veriliyor.", en: "Some of the outcomes say [Reaped], some say [Lost], some can't be read at all. Not one line says for sure whether the System is a sickle or a life raft. Maybe it's both. Maybe which one it turns out to be gets decided on the last day, every time." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - { tr: "Ve her satırın, her bir satırın en sonunda, aynı küçük not: [Son erişim: bir önceki döngü.]", en: "And at the very end of every line, every single one, the same small note: [Last accessed: previous cycle.]" }
          - metin: { tr: "Dilin kendisini okuyabildiğin için bir şeyi daha görüyorsun: o not bir zaman damgası değil, bir imza. Bu kaydı her seferinde aynı el kapatmış.", en: "Because you can read the language itself, you see one more thing: that note isn't a timestamp. It's a signature. The same hand closed this log every time." }
            kosul: { bayrak: "p4_cekirdek_dili" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[BAĞIŞIKLIK TEPKİSİ]", en: "[IMMUNE RESPONSE]" }
            satirlar:
              - { tr: "Yetkisiz okuma tespit edildi. Düzeltme başlatılıyor.", en: "Unauthorized read detected. Initiating correction." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o imzayı tanıyorum. hayır. şimdi değil. önce şunu atlat. arkanda bir şey kalkıyor ve senin boyunda.", en: "i know that signature. no. not now. get through this first. something's getting up behind you, and it's your height." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Arkanı dön ve düzeltmeyle yüzleş", en: "Turn around and face the correction" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - savas: { dusmanlar: ["cekirdek_duzeltici@oyuncu+5"], ortam: ["karanlik"], kazan: "p4_scek_kok", kaybet: "p4_scek_kovuldu" }
          - id: "gizlen"
            etiket: { tr: "{npc:yanki} seni satırların arasına saklasın", en: "Let {npc:yanki} hide you between the lines" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - yozlasma: 6
              - iliski: { yanki: { guven: 8, baglilik: 8 } }
            sonraki: "p4_scek_gizli"
          - id: "cik"
            etiket: { tr: "Gördüğün yeter. Geri çekil", en: "You've seen enough. Pull back" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
            sonraki: "p4_scek_cikis"

      - id: "p4_scek_gizli"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "{npc:yanki} seni bir satırın içine katlıyor ve bir an kendi adını hatırlamıyorsun. Senin boyunda, senin yürüyüşünle bir siluet yanından geçiyor, seni arıyor, bulamıyor. {npc:yanki|in} sesi kafanın içinde çok yakın ve çok yorgun.", en: "{npc:yanki} folds you into a line of text, and for a moment you can't remember your own name. A silhouette your height, with your walk, goes right past you, looking for you, not finding you. {npc:yanki|pos} voice is very close inside your head, and very tired." }
          - { tr: "bunu bir kez daha yapmıştım, diyor. bir önceki seferde. sonu iyi bitmedi. bu sefer konsola kadar götüreceğim seni. ama bana bir şey borçlu olacaksın.", en: "i did this once before, it says. last time. it didn't end well. this time i'm getting you all the way to the console. but you're going to owe me one." }
        secenekler:
          - id: "borc"
            etiket: { tr: "Kabul. Ne istersen", en: "Deal. Whatever you want" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
              - bayrak: "p4_yankiya_borc"
            sonraki: "p4_scek_kok"
          - id: "neydi"
            etiket: { tr: "Ne borcu? Önce söyle", en: "Owe you what? Tell me first" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 2 }
              - iliski: { yanki: { saygi: 4, guven: -2 } }
            sonraki: "p4_scek_kok"

      - id: "p4_scek_kovuldu"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Siluet senin son hamleni senden önce yapıyor ve kendi yumruğun göğsüne iniyor. Cam zemin altından kayıp gidiyor. Düşüyorsun; satırların arasından, merdivenden, kendi bir yılından geriye doğru.", en: "The silhouette throws your last move before you do, and your own fist lands in your chest. The glass floor slides out from under you. You fall: through the lines, up the stairs, backward through your own year." }
          - { tr: "Gözlerini {yer:kule_dibi|in} taşlarında açıyorsun. Merdiven hâlâ açık; ama ışığı artık seni çağırmıyor, yalnızca bekliyor. Gördüklerin aklında, bir rüyanın son sahnesi gibi, kayıp gitmek istemeyerek duruyor.", en: "You open your eyes on the stones of {yer:kule_dibi}. The stairs are still open, but the light isn't calling you anymore. It's just waiting. What you saw is still in your head, like the last scene of a dream, refusing to slip away." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[DÜZELTME KISMEN BAŞARILI]", en: "[CORRECTION PARTIALLY SUCCESSFUL]" }
            satirlar:
              - { tr: "Anomali Çekirdek'ten çıkarıldı. Anomali silinemedi.", en: "Anomaly ejected from Core. Anomaly could not be deleted." }
              - { tr: "Not: Bu ikinci satır endişe verici.", en: "Note: This second line is concerning." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Gördüğünü unutma", en: "Get up. Don't forget what you saw" }
            etkiler:
              - bayrak: "p4_cekirdek_kovuldu"
              - ahlak: { insanlik: 3 }
              - xp_seviye: 60
            sonraki: "p4_scek_son"
          - id: "ofke"
            etiket: { tr: "Merdivene yumruk at", en: "Punch the stairs" }
            etkiler:
              - bayrak: "p4_cekirdek_kovuldu"
              - ahlak: { insanlik: -2, duzen: -2 }
              - xp_seviye: 60
            sonraki: "p4_scek_son"

      - id: "p4_scek_cikis"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Konsoldan bir adım geri atıyorsun. Sonra bir adım daha. Arkanda kalkan siluet bir an duraksıyor; sanki ona hiç böyle bir seçenek tanımlanmamış gibi. Sonra, senin gibi, bir adım geri atıyor.", en: "You take a step back from the console. Then another. The silhouette rising behind you pauses for a moment, like nobody ever defined this option for it. Then, just like you, it takes a step back." }
          - { tr: "Merdiveni yukarı tırmanırken Sistem tek bir satır düşüyor; kuru değil bu kez, neredeyse yumuşak: [Gördüğünü sakla. Altı gün sonra lazım olacak.]", en: "As you climb back up the stairs, the System drops a single line. Not dry this time. Almost gentle: [Keep what you saw. You'll need it in six days.]" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Altı gün", en: "Six days" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 80
            sonraki: "p4_scek_son"
          - id: "sen_kimsin"
            etiket: { tr: "Sen kimsin? diye bağır", en: "Shout back: who are you?" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - xp_seviye: 80
            sonraki: "p4_scek_son"

      - id: "p4_scek_kok"
        yer: "sistem_cekirdegi"
        paragraflar:
          - { tr: "Siluet senin önünde dağılıyor ve pencereleri bir kuş sürüsü gibi okyanusa geri karışıyor. Konsol artık önünde. Sandalye de. Oturmuyorsun; yalnızca elini sandalyenin arkasına koyuyorsun ve sandalye tanıdık geliyor. Çok tanıdık.", en: "The silhouette comes apart in front of you, and its windows scatter back into the ocean like a flock of birds. The console is in front of you now. So is the chair. You don't sit. You just rest your hand on the back of it, and it feels familiar. Way too familiar." }
          - { tr: "Konsolda tek bir satır yanıp sönüyor: [Son karar: Gün 358. Erişim sahibi: anomali.] Altında hiçbir düğme yok. Karar burada verilmeyecek; burada yalnızca karar verecek kişi tanınıyor.", en: "A single line blinks on the console: [Final decision: Day 358. Access holder: anomaly.] There are no buttons under it. The decision won't be made here. This is just where the one who makes it gets recognized." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[KÖK ERİŞİMİ]", en: "[ROOT ACCESS]" }
            satirlar:
              - { tr: "Anomali Çekirdek'in köküne ulaştı. Kayıt: ilk.", en: "Anomaly reached the root of the Core. Record: first." }
              - { tr: "Kayıt: ilk değil. Kayıt düzeltiliyor. Kayıt: ilk.", en: "Record: not first. Correcting record. Record: first." }
        secenekler:
          - id: "isaret"
            etiket: { tr: "Konsola işaret bırak: döneceğim", en: "Leave a mark on the console: I'll be back" }
            etkiler:
              - bayrak: "p4_cekirdek_kok_erisim"
              - gorev: { cekirdege_inis: "tamam" }
              - unvan: "cekirdege_ilk_inen"
              - xp_seviye: 200
              - ahlak: { duzen: 3, insanlik: 2 }
            sonraki: "p4_scek_son"
          - id: "sayac"
            etiket: { tr: "Gökyüzündeki sayacın satırını bul ve oku", en: "Find the line for the sky's countdown. Read it" }
            etkiler:
              - bayrak: "p4_cekirdek_kok_erisim"
              - gorev: { cekirdege_inis: "tamam" }
              - unvan: "cekirdege_ilk_inen"
              - xp_seviye: 200
              - ahlak: { duzen: -4, insanlik: -2 }
              - esya: { cekirdek_kirintisi: 1 }
            sonraki: "p4_scek_son"
          - id: "oturma"
            etiket: { tr: "Sandalyeden uzaklaş; ona oturma", en: "Step away from the chair. Don't sit in it" }
            etkiler:
              - bayrak: "p4_cekirdek_kok_erisim"
              - gorev: { cekirdege_inis: "tamam" }
              - unvan: "cekirdege_ilk_inen"
              - xp_seviye: 200
              - ahlak: { insanlik: 5 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "p4_scek_son"

      - id: "p4_scek_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yukarı çıktığında akşam olmuş. {yer:kule_dibi|in} taşlarında oturan insanlar sana bakıyor; ne gördüğünü soramıyorlar, çünkü yüzünde bir şey var. Bir yıl önce Öğretici'nin sisinde uyandığın sabahki gibi bir şey.", en: "When you come back up, it's evening. The people sitting on the stones of {yer:kule_dibi} look at you. They can't ask what you saw, because there's something in your face. Something like the morning you woke up in the Tutorial's fog a year ago." }
          - metin: { tr: "{npc:deniz_arman} yanına oturuyor ve hiçbir şey sormuyor. Yalnızca omzunu omzuna yaslıyor. Vapurda da böyle otururdunuz.", en: "{npc:deniz_arman} sits down next to you and doesn't ask anything. Just leans {zamir:deniz_arman|onun} shoulder against yours. That's how you two used to sit on the ferry." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:mert_kilic} defterine bir şey yazıyor, siliyor, tekrar yazıyor. \"Bir günlük,\" diye mırıldanıyor. \"Bir günlükmüş.\"", en: "{npc:mert_kilic} writes something in his notebook, erases it, writes it again. \"A diary,\" he mutters. \"It was a diary.\"" }
            kosul: { yoldas: "mert_kilic" }
          - { tr: "Gökyüzündeki sayaç: on üç gün. Altı gün sonra Sistem sana son kararı soracak. Ondan önce, kafanın içindeki ses sana bir şey anlatmak istiyor; bunu biliyorsun, çünkü bütün gün hiç susmadı ve hiçbir şey söylemedi.", en: "The counter in the sky: thirteen days. Six days from now, the System will ask you for the final decision. Before that, the voice in your head wants to tell you something. You know that because it hasn't been quiet all day, and it hasn't said a single word." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sandalye. çukur. imza. hepsini birazdan anlatacağım. önce bir gece uyu. ben de uyuyacağım. uyumayı öğrendim, biliyor musun? senden.", en: "the chair. the dent. the signature. i'll tell you all of it soon. sleep one night first. i'll sleep too. i learned how to sleep, did you know that? from you." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Bir gece uyu", en: "Sleep one night" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 3 } }
            sonraki: "@akis"
          - id: "anlat"
            etiket: { tr: "Gördüklerini yanındakilere anlat", en: "Tell your people what you saw" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { duzen: -2, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6 }, mert_kilic: { guven: 6 }, elif_sari: { guven: 4 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kimseye bir şey söyleme", en: "Don't tell anyone anything" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { duzen: 2, insanlik: -3 }
              - gizle: 5
            sonraki: "@akis"

  # ================================================================== DİKKAT 100 · PERDE 4 (motor tohumlar)
  - id: "dikkat_100_p4"
    perde: [4]
    agirlik: 1
    etiketler: ["dikkat", "kadim", "boss"]
    gerilim: 4
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Meclis Makası", en: "The Conclave Shears" }
    sahne: "p4_d100_1"
    sahneler:
      - id: "p4_d100_1"
        paragraflar:
          - { tr: "Bir makasın kapanma sesi duyuyorsun: tek, temiz, çok yakın. Yanındaki sokak lambası ortadan ikiye ayrılıp sessizce yere iniyor. Sonra yanındaki duvar. Sonra gölgen; gölgenin bir parçası, asfaltın üstünde, senden ayrı duruyor.", en: "You hear a pair of shears close: one clean snip, very close. The streetlight next to you comes apart down the middle and settles quietly to the ground. Then the wall beside you. Then your shadow: a piece of it lies on the asphalt, separate from you." }
          - { tr: "Nerede durduğunun bir önemi yok; hava her yerde aynı biçimde katlanıyor. Katın içinden uzun, yavaş, tek kollu bir şey çıkıyor. Kolunun ucunda bir makas. Makasın ağzında, küçük ve düzgün harflerle, yüzlerce isim.", en: "It doesn't matter where you're standing. The air folds the same way everywhere. Out of the fold steps something long, slow and one-armed. At the end of the arm is a pair of shears. Engraved on their jaws, in small neat letters, are hundreds of names." }
          - metin: { tr: "Uzakta, körfezin üstünde, bütün gemiler ışıklarını aynı anda kısıyor. Kadimler bile bu şeyin işini izlemeye saygı duyuyor.", en: "Far off over the bay, every ship dims its lights at once. Even the Ancients show respect while this thing works." }
            kosul: { bayrak_yok: ["kadimler_yenildi", "kiyikent_dustu"] }
          - metin: { tr: "Filoyu geri püskürttün; Meclis buna bir cevap verdi. Cevap, tek kollu ve sabırlı.", en: "You drove the fleet back, and the Conclave has answered. The answer is one-armed and patient." }
            kosul: { bayrak: "kadimler_yenildi" }
          - { tr: "Sistem bir satır düşüyor; bu kez gökyüzüne değil, yalnızca sana.", en: "The System drops a line. Not across the sky this time. Just for you." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[DİKKAT: %100]", en: "[ATTENTION: 100%]" }
            satirlar:
              - { tr: "Anomali, Kadim Meclisi'nin budama listesine eklendi.", en: "Anomaly has been added to the Ancient Conclave's pruning list." }
              - { tr: "Sistem bu konuda tarafsızdır. Sistem bu konuda biraz meraklıdır.", en: "The System is neutral on this matter. The System is a little curious about this matter." }
          - tur: "yanki"
            baslik: { tr: "[b̷u onlardan değil]", en: "[t̷his isn't one of theirs]" }
            satirlar:
              - { tr: "bu bir asker değil. bir alet. aletler pazarlık etmez.", en: "it's not a soldier. it's a tool. tools don't negotiate." }
        sezgiler:
          - kosul: { stat: { per: 330 } }
            metin: { tr: "[ALG] Makasın ağzındaki isimlerden biri, harf harf, seninkine benziyor. Harfler eski; senden önce kazınmış.", en: "[PER] One of the names on the shears' jaws looks like yours, letter for letter. The letters are old. They were carved before you were born." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o isme bakma. ya da bak, ama sonra. önce hayatta kal.", en: "don't look at that name. or do, but later. stay alive first." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir makas mı? Ciddi misin? Tamam. Arkandayım.\"", en: "\"A pair of scissors? Seriously? Okay. I've got your back.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Listeye seni yazmışlar, beni değil. Bunu kişisel algılıyorum.\"", en: "\"They put you on the list and not me. I'm taking that personally.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Makasın karşısına dik dur", en: "Stand up straight and face the shears" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
              - savas: { dusmanlar: ["p4_meclis_makasi@oyuncu+6"], ortam: ["karanlik"], kazan: "p4_d100_zafer", kaybet: "p4_d100_yenilgi" }
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "{npc:yanki} seni listeden silsin", en: "Have {npc:yanki} scrub you off the list" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 40
              - yozlasma: 8
              - ahlak: { insanlik: -4 }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
            sonraki: "p4_d100_silinme"
          - id: "isik"
            tur: "gosteris"
            etiket: { tr: "Bütün ışığını tek bir anda yak", en: "Burn every bit of your light in one instant" }
            gerekli: { stat: { wil: 340 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -2, duzen: -2 }
              - savas: { dusmanlar: ["p4_meclis_makasi@oyuncu+2"], ortam: ["karanlik"], kazan: "p4_d100_zafer", kaybet: "p4_d100_yenilgi" }
          - id: "thessar"
            etiket: { tr: "{npc:thessar} Meclis adına araya girsin", en: "Let {npc:thessar} step in on the Conclave's behalf" }
            goster: { npc_hayatta: "thessar", iliski_min: { thessar: { baglilik: 40 } } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - degisken: { kadim_tehdit: 4 }
              - iliski: { thessar: { baglilik: 8, guven: 6 } }
              - tohum: { olay: "p4_son_yayin", gecikme: { min: 2, max: 4 } }
            sonraki: "p4_d100_thessar"

      - id: "p4_d100_silinme"
        paragraflar:
          - { tr: "{npc:yanki} kafanın içinde bir kapı kapatıyor ve dünyada bir satır eksiliyor. Makas havada duruyor. Ağzındaki isimlere bakıyor; aradığı isim yerinde değil.", en: "{npc:yanki} shuts a door inside your head, and the world is suddenly one line shorter. The shears stop in midair. They check the names on their jaws. The one they're looking for isn't there." }
          - { tr: "Tek kollu şey, bir bahçıvanın kayıp bir aleti ararken yaptığı gibi, bir süre etrafına bakınıyor. Sonra hava yeniden katlanıyor ve gidiyor. Geride ikiye bölünmüş bir sokak lambası ve senin yarım gölgen kalıyor.", en: "The one-armed thing looks around for a while, like a gardener searching for a lost tool. Then the air folds again and it's gone. Left behind are a streetlight split in two and half of your shadow." }
          - { tr: "{npc:yanki|in} sesi çok yorgun: seni sildim. bir süreliğine. bunu bir daha yapamam; bir parçamı listeye bıraktım.", en: "{npc:yanki|pos} voice is very tired: i erased you. for a while. i can't do that again. i left a piece of me on the list." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Teşekkür et", en: "Thank it" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"
          - id: "parca"
            etiket: { tr: "Hangi parçanı bıraktın?", en: "Which piece did you leave?" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { yanki: { saygi: 4, korku: 2 } }
            sonraki: "@akis"

      - id: "p4_d100_thessar"
        paragraflar:
          - { tr: "{npc:thessar} havanın katından senden önce çıkıyor ve makasla senin arana giriyor. Kadimlerin dilinde, uzun ve resmi bir şey söylüyor. Makas bir an duruyor; ağzındaki isimler parlıyor.", en: "{npc:thessar} steps out of the fold in the air before you do and puts himself between you and the shears. He says something long and formal in the Ancients' language. The shears pause. The names on their jaws glow." }
          - { tr: "\"Bu bir sapma değil,\" diyor sana dönmeden. \"Bu bir ortak. Meclis ortaklarını budamaz; yalnızca onlarla pazarlık eder.\" Makas yavaşça geri çekiliyor. {npc:thessar} titreyen ellerini paltosunun cebine sokuyor.", en: "\"This is not a deviation,\" he says without turning around. \"This is a partner. The Conclave does not prune its partners. It only bargains with them.\" The shears slowly withdraw. {npc:thessar} shoves his shaking hands into his coat pockets." }
          - { tr: "\"Bunun bir bedeli olacak,\" diyor sonunda. \"Benim için. Belki senin için de. Ama bugün değil.\"", en: "\"This will have a price,\" he finally says. \"For me. Perhaps for you as well. But not today.\"" }
        secenekler:
          - id: "borc"
            etiket: { tr: "Sana borçluyum", en: "I owe you" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - iliski: { thessar: { baglilik: 6 } }
              - hafiza: { npc: "thessar", id: "olay:dikkat_100_p4", agirlik: 40 }
            sonraki: "@akis"
          - id: "ortak_degil"
            etiket: { tr: "Ben kimsenin ortağı değilim", en: "I'm nobody's partner" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 3 }
              - iliski: { thessar: { saygi: 6, guven: -4 } }
            sonraki: "@akis"

      - id: "p4_d100_zafer"
        paragraflar:
          - { tr: "Makasın iki ağzı birbirinden ayrılıyor ve bir daha birleşmiyor. Tek kollu şey bir bahçe aletinin olması gerektiği gibi yere düşüyor: sessiz, ağır, artık kimsenin kullanmayacağı bir şey.", en: "The shears' two jaws come apart and never meet again. The one-armed thing falls the way a garden tool should: silent, heavy, something nobody's ever going to use again." }
          - { tr: "Ağzındaki isimler birer birer sönüyor. Sonuncusu, seninkine benzeyen, en son sönüyor; söndüğünde bir an, çok uzaklardan gelen bir ses gibi, bir nefes duyuyorsun. Rahatlamış bir nefes.", en: "The names on its jaws go out one by one. The last one, the one that looks like yours, goes out last, and when it does, you hear a breath for a second, like a sound from very far away. A relieved breath." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[UNVAN: Makası Kıran]", en: "[TITLE: Shear-Breaker]" }
            satirlar:
              - { tr: "Kadim Meclisi bu sonucu bekliyordu. Hayır, beklemiyordu.", en: "The Ancient Conclave expected this outcome. No. It did not." }
        secenekler:
          - id: "isimler"
            etiket: { tr: "İsimleri oku; seninkini bul", en: "Read the names. Find yours" }
            etkiler:
              - unvan: "makasi_kiran"
              - bilgi: "makas_listesi"
              - xp_seviye: 150
              - degisken: { kadim_tehdit: -5 }
              - ahlak: { insanlik: -2, duzen: -1 }
            sonraki: "@akis"
          - id: "kir"
            etiket: { tr: "Makası ikiye kır, körfeze at", en: "Snap the shears in half. Throw them in the bay" }
            etkiler:
              - unvan: "makasi_kiran"
              - xp_seviye: 150
              - degisken: { kadim_tehdit: -5 }
              - ahlak: { insanlik: 3, duzen: -2 }
              - esya: { kadim_zirh_parcasi: 2 }
            sonraki: "@akis"

      - id: "p4_d100_yenilgi"
        paragraflar:
          - { tr: "Makas bir kez kapanıyor ve sen yere iniyorsun. Ölmüyorsun; makas ölüm için değil, fazlalık için yapılmış. Bir şeyini kesip alıyor: göremediğin, ama yokluğunu hemen hissettiğin bir şeyi.", en: "The shears close once and you hit the ground. You don't die. The shears weren't made for killing, they were made for trimming. It cuts something off you and takes it: something you can't see but whose absence you feel immediately." }
          - { tr: "Tek kollu şey seni bir süre süzüyor, sonra şehre dönüyor. Bir mahalleyi, sanki bir çalının fazla dalını alır gibi, sessizce budayıp gidiyor. Sabah orada kimse yok.", en: "The one-armed thing studies you for a while, then turns toward the city. It quietly trims a neighborhood away, like cutting back a bush, and leaves. In the morning, there's nobody there." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[BUDAMA TAMAMLANDI]", en: "[PRUNING COMPLETE]" }
            satirlar:
              - { tr: "Anomali budandı. Anomali hâlâ büyüyor.", en: "Anomaly pruned. Anomaly still growing." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve o mahalleye yürü", en: "Get up and walk to that neighborhood" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 5 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - gizle: 20
            sonraki: "@akis"
          - id: "ofke"
            etiket: { tr: "Gökyüzüne bak ve bir isim söyle", en: "Look at the sky and say a name" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 5 }
              - ahlak: { insanlik: -2, merhamet: -1 }
              - gizle: 20
              - yozlasma: 4
            sonraki: "@akis"

  # ================================================================== PERDE 4 GENEL OLAYLARI
  # ---------------------------------------------------------------- Kadim Öncüsü (istila öncesi)
  - id: "p4_kadim_oncusu"
    perde: [4]
    bolge: ["eski_sehir", "kordon", "kule_dibi", "kiyikent_liman"]
    gun: { min: 331, max: 341 }
    agirlik: 3
    etiketler: ["kadim", "kesif", "istila"]
    gerilim: 3
    kart: { tr: "Ölçen", en: "The Measurer" }
    sahne: "p4_oncu_1"
    sahneler:
      - id: "p4_oncu_1"
        paragraflar:
          - metin: { tr: "Bir sokağın ortasında hava bir camın arkası gibi bulanık. Hasatın ilk sabahı izini sürdüğün öncü bu; saat kulesinden buraya kadar her adımını biliyorsun.", en: "In the middle of a street, the air is blurred like the far side of a window. It's the Pathfinder you tracked on the Harvest's first morning. You know every step it took from the clock tower to here." }
            kosul: { bayrak: "p4_oncu_iz" }
          - metin: { tr: "Bir sokağın ortasında hava bir camın arkası gibi bulanık. Bulanıklığın içinden ince bir kalem çıkıyor ve havada, hiçbir şeyin üstüne, bir not alıyor.", en: "In the middle of a street, the air is blurred like the far side of a window. A thin stylus pokes out of the blur and takes a note on nothing, in midair." }
            kosul: { bayrak_yok: "p4_oncu_iz" }
          - { tr: "Bir Kadim Öncüsü. Uzun, ince, ışığı büken bir şey. Bir kapı eşiğini ölçüyor, bir pencerenin yüksekliğini, bir çocuk bisikletinin tekerleğini. Bir balkonda yaşlı bir kadın çamaşır asıyor; öncü onu da ölçüyor ve bir şey yazıyor.", en: "An Ancient Pathfinder. Long, thin, bending the light. It measures a doorstep, the height of a window, the wheel of a kid's bike. On a balcony, an old woman is hanging laundry. The Pathfinder measures her too, and writes something down." }
          - { tr: "Henüz seni görmedi. Ya da gördü ve seni de ölçüyor.", en: "It hasn't seen you yet. Or it has, and it's measuring you too." }
        sezgiler:
          - kosul: { stat: { per: 310 } }
            metin: { tr: "[ALG] Defterin kenarında bir harita var: {yer:kiyikent}, mahalle mahalle, her birinin yanında bir rakam. {yer:kule_dibi|in} yanında yalnızca bir işaret: bir yıldız.", en: "[PER] There's a map in the ledger's margin: {yer:kiyikent}, neighborhood by neighborhood, a number next to each one. Next to {yer:kule_dibi} there's only a mark: a star." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o defteri istiyorum. içinde senin adın var. yanında da bir soru işareti. o soru işaretini görmek istiyorum.", en: "i want that ledger. your name's in it. with a question mark next to it. i want to see that question mark." }
        secenekler:
          - id: "saldir"
            etiket: { tr: "Öncünün üstüne atla", en: "Jump the Pathfinder" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["istila_oncu@dunya-50"], ortam: ["dar_gecit"], kazan: "p4_oncu_esir", kaybet: "p4_oncu_kacti" }
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "Gölgede kal; nereye gittiğini izle", en: "Stay in the shadows. See where it goes" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: -1, duzen: -2 }
            sonraki: "p4_oncu_izle"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Bükülen ışığı elinle düzelt; yakala", en: "Straighten its bent light by hand. Grab it" }
            gerekli: { stat: { agi: 320 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - dikkat: 4
              - iliski: { thessar: { saygi: 4 } }
            sonraki: "p4_oncu_esir"
          - id: "kadin"
            etiket: { tr: "Önce balkondaki kadını içeri sok", en: "Get the woman on the balcony inside first" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "p4_oncu_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "p4_oncu_kadin"

      - id: "p4_oncu_kadin"
        paragraflar:
          - { tr: "Kadını balkondan içeri, mutfağına sokuyorsun. Çamaşır mandalları hâlâ elinde. \"Beni ölçtü mü?\" diye soruyor. \"Ne için ölçtü?\" Cevap vermiyorsun.", en: "You get the woman off the balcony and into her kitchen. She's still holding her clothespins. \"Did it measure me?\" she asks. \"What for?\" You don't answer." }
          - { tr: "Pencereye döndüğünde sokak boş. Öncü gitmiş; ama havada, bir mürekkep lekesi gibi, ışığı bükülmüş bir iz kalmış. Bir gün döneceğini biliyorsun.", en: "When you turn back to the window, the street is empty. The Pathfinder's gone, but there's a trace left in the air like an ink stain, a smear of bent light. You know it'll be back someday." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Kadının yanında bir çay iç", en: "Have a cup of tea with her" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"
          - id: "iz"
            etiket: { tr: "İzi takip et", en: "Follow the trace" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["istila_oncu@dunya-50"], ortam: ["dar_gecit"], kazan: "p4_oncu_esir", kaybet: "p4_oncu_kacti" }

      - id: "p4_oncu_izle"
        paragraflar:
          - { tr: "Öncüyü üç sokak boyunca izliyorsun. Bir okulun bahçesini ölçüyor, bir hastanenin kapısını, bir fırının bacasını. Sonra Kule Dibi'ne varıyor ve Kule'nin önünde, bir yıldır kimsenin yapmadığı bir şey yapıyor: diz çöküyor.", en: "You tail the Pathfinder for three blocks. It measures a schoolyard, a hospital door, a bakery chimney. Then it reaches {yer:kule_dibi}, and in front of the Spire it does something nobody's done in a year: it kneels." }
          - { tr: "Defterine uzun bir şey yazıyor. Sonra bir sinyal gönderiyor; gökyüzündeki karanlık gemi bir an ışık yakıp söndürüyor.", en: "It writes something long in its ledger. Then it sends a signal, and the dark ship in the sky flashes a light once and goes dark again." }
        secenekler:
          - id: "simdi"
            etiket: { tr: "Şimdi vur; diz çökmüşken", en: "Hit it now, while it's kneeling" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - savas: { dusmanlar: ["istila_oncu@dunya-60"], ortam: ["tavan"], kazan: "p4_oncu_esir", kaybet: "p4_oncu_kacti" }
          - id: "birak"
            etiket: { tr: "Bırak gitsin; ne bildiğini artık biliyorsun", en: "Let it go. You know what it knows now" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bilgi: "oncu_defteri"
              - tohum: { olay: "p4_oncu_hesabi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "p4_oncu_esir"
        paragraflar:
          - { tr: "Öncü yere çakılıyor; büktüğü ışık bir bardağın kırılması gibi dağılıyor. Altında ince, kül rengi, insandan biraz daha uzun bir beden. Gözleri sana bakıyor; korkmuyor, merak ediyor.", en: "The Pathfinder slams into the ground, and the light it was bending scatters like a glass shattering. Underneath is a thin, ash-colored body, a little taller than a human. Its eyes are on you. It isn't scared. It's curious." }
          - { tr: "Defteri yanına düşmüş. \"Onu okuyabilirsin,\" diyor öncü, kırık bir insan diliyle. \"Ama okursan, bir daha hiçbir sokağa eskisi gibi bakamazsın.\"", en: "Its ledger has fallen next to it. \"You may read it,\" the Pathfinder says in broken human speech. \"But if you do, you will never look at a street the same way again.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim Öncüsü · teslim oldu", en: "[ANALYSIS] Ancient Pathfinder · surrendered" }
            satirlar:
              - { tr: "Konuşmaya istekli. Yalan söyleme olasılığı: düşük. Kadimler ölçüm konusunda yalan söylemez.", en: "Willing to talk. Probability of lying: low. The Ancients don't lie about measurements." }
        secenekler:
          - id: "sorgula"
            etiket: { tr: "Defteri oku, öncüyü sorgula", en: "Read the ledger. Question the Pathfinder" }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "oncu_defteri"
              - bilgi: "filo_acigi"
              - xp_seviye: 25
            sonraki: "p4_oncu_sorgu"
          - id: "oldur"
            etiket: { tr: "Bitir ve defteri yak", en: "Finish it and burn the ledger" }
            etkiler:
              - bayrak: "p4_oncu_olduruldu"
              - ahlak: { merhamet: -5, insanlik: 2 }
              - xp_seviye: 20
              - iliski: { thessar: { guven: -6 } }
              - hafiza: { npc: "thessar", id: "elcisini_oldurdu", agirlik: -20 }
            sonraki: "@akis"
          - id: "salla"
            etiket: { tr: "Defteri al, öncüyü salıver", en: "Take the ledger. Let the Pathfinder go" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - bilgi: "oncu_defteri"
              - bilgi: "filo_acigi"
              - iliski: { thessar: { saygi: 5 } }
              - tohum: { olay: "p4_oncu_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"

      - id: "p4_oncu_sorgu"
        paragraflar:
          - { tr: "Defterde {yer:kiyikent} metrekare metrekare. Her sokağın yanında bir verim, her mahallenin yanında bir hasat sırası. Okul bahçesinin yanında: [Önce]. Senin adının yanında yalnızca bir soru işareti.", en: "The ledger has {yer:kiyikent} square foot by square foot. A yield next to every street, a harvest order next to every neighborhood. Next to the schoolyard: [First]. Next to your name, nothing but a question mark." }
          - { tr: "Öncü sorularına sabırla cevap veriyor. Amiral gemisi indiğinde sütuna güç verirken kalkanını açıyor; zırhın dikiş yerinde bir kalp atışı kadar kısa bir boşluk. \"Bunu sana neden söylüyorum, biliyor musun?\" diyor. \"Çünkü merak ediyorum. Bin dört yüz dünyada kimse bunu sormadı.\"", en: "The Pathfinder answers your questions patiently. When the flagship lands, it drops its shield to power the pillar. A gap at the seam of the armor, about one heartbeat long. \"Do you know why I am telling you this?\" it says. \"Because I am curious. In fourteen hundred worlds, nobody ever asked.\"" }
        secenekler:
          - id: "serbest"
            etiket: { tr: "Merakına teşekkür et; git dedirt", en: "Thank it for its curiosity. Send it off" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { thessar: { saygi: 4 } }
              - tohum: { olay: "p4_oncu_hesabi", gecikme: { min: 4, max: 7 } }
            sonraki: "@akis"
          - id: "loncaya"
            etiket: { tr: "Esiri Lonca'ya teslim et", en: "Turn the prisoner over to the Guild" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "@akis"

      - id: "p4_oncu_kacti"
        paragraflar:
          - { tr: "Öncünün kalemi havada bir çizgi çekiyor ve çizgi senin önünde bir duvara dönüşüyor. Duvarı kırdığında sokak boş; yalnızca yerde, bir ayak izi gibi, ışığı bükülmüş bir leke.", en: "The Pathfinder's stylus draws a line in the air, and the line turns into a wall in front of you. By the time you break through it, the street is empty. All that's left on the ground, like a footprint, is a smear of bent light." }
          - { tr: "Gökyüzünde karanlık gemi bir kez ışık yakıp söndürüyor. Ne gördüyse, artık filo da biliyor.", en: "In the sky, the dark ship flashes a light once and goes dark. Whatever it saw, the fleet knows now too." }
        secenekler:
          - id: "dikkat"
            etiket: { tr: "Bir dahakine daha hızlı ol", en: "Be faster next time" }
            etkiler:
              - ahlak: { duzen: 1 }
              - dikkat: 4
              - degisken: { kadim_tehdit: 2 }
            sonraki: "@akis"
          - id: "haber"
            etiket: { tr: "Lonca'ya haber ver: filo biliyor", en: "Warn the Guild: the fleet knows" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { guven: 3 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Öncünün hesabı (tohum)
  - id: "p4_oncu_hesabi"
    perde: [4]
    agirlik: 1
    etiketler: ["kadim", "tohum"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Ölçenin Notu", en: "The Measurer's Note" }
    sahne: "p4_oncu_hesabi_1"
    sahneler:
      - id: "p4_oncu_hesabi_1"
        paragraflar:
          - { tr: "Nerede olursan ol, bir sabah yanında, bir pencerenin pervazında, bir taşın üstünde, katlanmış bir kâğıt buluyorsun. Kâğıt değil aslında; ışıktan, ince, dokununca ılık bir şey.", en: "Wherever you are, one morning you find a folded note next to you, on a windowsill, on a stone. Not paper, exactly. Something thin made of light that's warm to the touch." }
          - metin: { tr: "Açıyorsun. Kırık bir insan diliyle tek bir satır: \"Beni salıverdin. Merak ettim: neden? Cevabı bulamadım. Bu yüzden sana bir ölçü bırakıyorum.\" Altında, {yer:kiyikent|in} küçük bir haritası; okul bahçesinin yanındaki [Önce] kelimesinin üstü çizilmiş.", en: "You unfold it. One line in broken human speech: \"You let me go. I wondered: why? I could not find the answer. So I am leaving you a measurement.\" Under it is a tiny map of {yer:kiyikent}, and next to the schoolyard, the word [First] has been crossed out." }
            kosul: { bayrak_yok: "p4_oncu_olduruldu" }
          - { tr: "Haritanın köşesinde, ince bir kalemle, bir not daha: \"Sütunlar ilk önce en kalabalık yere iner. Kalabalığı dağıt.\"", en: "In the corner of the map, in fine stylus strokes, one more note: \"The pillars come down first where the crowd is thickest. Break up the crowd.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir kadim sana teşekkür ediyor. bunu kayda geçir. bir daha olmayabilir.", en: "an ancient is thanking you. write that down. it might never happen again." }
        secenekler:
          - id: "okul"
            etiket: { tr: "Okul bahçesini boşalttır", en: "Get the schoolyard cleared out" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 3 }
            sonraki: "@akis"
          - id: "thessar"
            etiket: { tr: "Notu {npc:thessar|e} göster", en: "Show the note to {npc:thessar}" }
            goster: { npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { thessar: { saygi: 6, guven: 4 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Notu sakla; kimseye söyleme", en: "Keep the note. Tell nobody" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kuşatma ekmeği
  - id: "p4_kusatma_ekmegi"
    perde: [4]
    bolge: ["kiyikent_liman", "eski_sehir", "tepe"]
    gun: { min: 332, max: 364 }
    agirlik: 3
    etiketler: ["kusatma", "sivil", "ahlak"]
    gerilim: 2
    kart: { tr: "Ekmek Kuyruğu", en: "The Bread Line" }
    sahne: "p4_ekmek_1"
    sahneler:
      - id: "p4_ekmek_1"
        paragraflar:
          - metin: { tr: "Sabahın beşinde fırının önündeki kuyruk iki sokak boyunca uzanıyor. İnsanlar ellerinde kuşatma kartlarıyla, gökyüzündeki altın panellere bakmamaya çalışarak bekliyor.", en: "At five in the morning, the line outside the bakery runs two blocks long. People wait with ration cards in their hands, trying not to look up at the gold panels in the sky." }
            kosul: { bayrak_yok: "kiyikent_dustu" }
          - metin: { tr: "{yer:tepe|de}ki mülteci kampında ekmek kuyruğu bir tarlanın kenarı boyunca uzanıyor. Şehrin fırınları artık Kadimlerin elinde; burada yalnızca seyyar bir ocak ve iki yorgun fırıncı var.", en: "In the refugee camp on {yer:tepe}, the bread line stretches along the edge of a field. The city's bakeries belong to the Ancients now. Up here there's just a portable oven and two exhausted bakers." }
            kosul: { bayrak: "kiyikent_dustu" }
          - { tr: "Kuyruğun başında bir kavga var. Lonca'nın gri paltolu levazımcısı, fırının arka kapısından çuvallarla un çıkarıyor. \"Cephe önce yer,\" diyor. \"Cephe düşerse kimse yemez.\" Önündeki kadının kucağında bir bebek ağlıyor.", en: "There's a fight at the front of the line. A Guild quartermaster in a gray coat is hauling sacks of flour out the bakery's back door. \"The front eats first,\" he says. \"The front falls, nobody eats.\" The woman in front of him has a baby crying in her arms." }
          - metin: { tr: "{npc:elif_sari} kuyruğun ortasında, tek tek yaşlıların kartlarını kontrol ediyor. Levazımcıyı görüyor ve yüzü kireç gibi oluyor.", en: "{npc:elif_sari} is in the middle of the line, checking the old folks' cards one by one. She sees the quartermaster, and her face goes white as chalk." }
            kosul: { npc_hayatta: "elif_sari" }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "[ALG] Çuvalların yarısı cepheye gitmiyor. Levazımcının arka sokakta bir kamyoneti var; plakası {yer:tepe|de}ki karaborsacılarınki.", en: "[PER] Half those sacks aren't going to the front. The quartermaster has a van in the back alley, and the plate belongs to the black marketeers up on {yer:tepe}." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir yıl önce sisin içinde bir kutu bisküviyi paylaşmıştık. Hatırlıyor musun? Hepsini sen bana vermiştin.\"", en: "\"A year ago in the fog we split a box of crackers. Remember? You gave me all of them.\"" }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Unu kuyruğa dağıt", en: "Hand the flour out to the line" }
            etkiler:
              - bayrak: "p4_ekmek_paylasildi"
              - ahlak: { merhamet: 5, duzen: -2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 5, lonca: -4 }
              - iliski: { elif_sari: { guven: 6 } }
            sonraki: "p4_ekmek_paylas"
          - id: "levazim"
            etiket: { tr: "Levazımcıya hak ver; cephe önce", en: "Back the quartermaster. The front comes first" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -4 }
              - itibar: { lonca: 5, siginak: -5 }
              - iliski: { elif_sari: { guven: -8 }, kaya_demir: { saygi: 4 } }
              - ordu_kazan: 3
            sonraki: "p4_ekmek_cephe"
          - id: "kamyonet"
            etiket: { tr: "Arka sokaktaki kamyoneti göster", en: "Point out the van in the back alley" }
            goster: { stat: { per: 300 } }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3, lonca: 2 }
              - iliski: { kaya_demir: { guven: 4 } }
              - tohum: { olay: "p4_yikik_kiyikent", gecikme: { min: 10, max: 14 }, kosul: { gun_min: 343 } }
            sonraki: "p4_ekmek_kamyonet"
          - id: "firin"
            tur: "gosteris"
            etiket: { tr: "Ambar kapısını sök, içini herkese aç", en: "Rip the storeroom door off. Open it to everyone" }
            gerekli: { stat: { str: 310 } }
            etkiler:
              - bayrak: "p4_ekmek_paylasildi"
              - ahlak: { merhamet: 4, duzen: -4 }
              - dikkat: 3
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 4, lonca: -6 }
              - esya: { kusatma_tayini: 2 }
            sonraki: "p4_ekmek_paylas"

      - id: "p4_ekmek_paylas"
        paragraflar:
          - { tr: "Çuvallar açılıyor ve kuyruk bir anda kuyruk olmaktan çıkıyor; bir kalabalık, bir sofra, bir kaos. Sonra biri sıra kuruyor, biri un tartıyor, biri bebeğin annesini öne alıyor. Düzen kendiliğinden geliyor.", en: "The sacks come open and the line stops being a line all at once: a crowd, a table, chaos. Then somebody forms a queue, somebody weighs flour, somebody pulls the mother with the baby up front. Order shows up on its own." }
          - { tr: "Levazımcı köşede, elleri boş, sana bakıyor. \"Cephe aç kalırsa,\" diyor, \"bunu sen açıklarsın.\"", en: "The quartermaster stands in the corner with empty hands, staring at you. \"If the front goes hungry,\" he says, \"you explain it to them.\"" }
        secenekler:
          - id: "aciklarim"
            etiket: { tr: "\"Açıklarım. Cepheyi ben doyururum.\"", en: "\"I will. I'll feed the front myself.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "Dağıtımı {npc:elif_sari|e} bırak", en: "Leave the handout to {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 5 } }
            sonraki: "@akis"

      - id: "p4_ekmek_cephe"
        paragraflar:
          - { tr: "Çuvallar kamyonlara yükleniyor. Kuyruktaki kadın bebeğini göğsüne bastırıyor ve sana bakmadan sıradan çıkıyor. Kuyruk sessizce, bir yarayı kapatır gibi, onun bıraktığı boşluğu kapatıyor.", en: "The sacks get loaded onto the trucks. The woman in line presses her baby to her chest and leaves without looking at you. Quietly, like a wound closing, the line fills in the space she left." }
          - metin: { tr: "{npc:elif_sari} yanından geçerken duruyor. \"Bir yıl önce sana inanıyordum,\" diyor. \"Hâlâ inanıyorum. Ama bugün değil.\"", en: "{npc:elif_sari} stops as she passes you. \"A year ago, I believed in you,\" she says. \"I still do. Just not today.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadının peşinden git, tayınını ver", en: "Go after the woman. Give her your ration" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "cephe"
            etiket: { tr: "Kamyonlarla birlikte cepheye git", en: "Ride to the front with the trucks" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"

      - id: "p4_ekmek_kamyonet"
        paragraflar:
          - { tr: "Kamyonetin arka kapısını açtığında içi un, şeker ve yağla dolu. Levazımcı yüzü kızararak bir şeyler kekeliyor; kuyruk ilk kez bütünüyle susuyor.", en: "When you yank open the van's back doors, it's stuffed with flour, sugar and oil. The quartermaster stammers something, red in the face, and for the first time the whole line goes silent." }
          - { tr: "Lonca'nın devriyesi geliyor. Levazımcıyı kendi adamları götürüyor ve kamyonet fırının önüne çekiliyor. Bu sabah hem cephe hem kuyruk yiyecek.", en: "A Guild patrol shows up. His own people take the quartermaster away, and the van gets pulled around to the front of the bakery. This morning, both the front and the line are going to eat." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kuyruğun sonuna geç; sen de bekle", en: "Get at the back of the line. Wait like everybody" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
            sonraki: "@akis"
          - id: "tayin"
            etiket: { tr: "Fazlasını tayın yaptır", en: "Have the surplus baked into rations" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - esya: { kusatma_tayini: 3 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Son Kapı (S kademe)
  - id: "p4_son_kapi"
    perde: [4]
    bolge: ["kule_dibi", "sanayi", "kordon", "eski_sehir"]
    gun: { min: 333, max: 357 }
    agirlik: 3
    etiketler: ["kapi", "boss", "hakimiyet"]
    gerilim: 4
    kart: { tr: "Son Kapı", en: "The Last Gate" }
    sahne: "p4_sonkapi_1"
    sahneler:
      - id: "p4_sonkapi_1"
        paragraflar:
          - { tr: "Gökyüzündeki altın panellerin hepsinde aynı anda kırmızı bir çerçeve beliriyor. Bir yıl önce bunun ne demek olduğunu kimse bilmezdi; şimdi herkes biliyor. Bir Kapı açılıyor. S kademe. Dünya'da açılan son Kapı olacağını Sistem kendisi söylüyor.", en: "A red frame appears on every gold panel in the sky at once. A year ago nobody would've known what that meant. Now everybody does. A Gate is opening. S-Grade. The System itself says it'll be the last one ever to open on Earth." }
          - { tr: "Kapı'nın ağzı bir sokağın ortasında, bir nefes gibi açılıp kapanıyor. Her nefeste kenarlarından ıslak, dişli, yumurtadan yeni çıkmış şeyler dökülüyor. İçeride, bir dağ kadar büyük ve bir kalp kadar yumuşak bir şey kıpırdıyor.", en: "The Gate's mouth opens and closes in the middle of a street like a breath. Every breath spills wet, toothed, freshly hatched things over its edges. Inside, something as big as a mountain and as soft as a heart is stirring." }
          - { tr: "Avcılar kenarda toplanmış. Kimse girmiyor. Biri sana bakıyor, sonra bir başkası, sonra hepsi. Bir yıl önce bu bakışın bir adı yoktu; şimdi var: Sen girersen biz de gireriz.", en: "Hunters are gathered at the edges. Nobody goes in. One of them looks at you, then another, then all of them. A year ago that look didn't have a name. Now it does: if you go in, we go in." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[S KADEME KAPI]", en: "[S-GRADE GATE]" }
            satirlar:
              - { tr: "Taşmaya kalan süre: 3 saat. Bu, Dünya'da açılacak son Kapı'dır.", en: "Time to overflow: 3 hours. This is the last Gate that will open on Earth." }
              - { tr: "İlk kapatana bir unvan ayrıldı. Sistem nostaljik hissediyor.", en: "A title has been reserved for whoever closes it first. The System is feeling nostalgic." }
        sezgiler:
          - kosul: { stat: { per: 320 } }
            metin: { tr: "[ALG] Ana, yumurtalarını sıcaktan koruyor. Kapı'nın içi soğuk; ama dışarıda güneş var ve ana dışarı çıkmak zorunda.", en: "[PER] The mother is shielding her eggs from heat. It's cold inside the Gate. But out here there's sun, and the mother has to come out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "son kapı. ilkini hatırlıyor musun? titriyordun. şimdi titreyen kapı.", en: "the last gate. remember the first one? you were shaking. now the gate's the one shaking." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Son unvan. Bunu da sen alırsan bir yıl boyunca hiç birinci olmamış olacağım.\"", en: "\"Last title. If you take this one too, I'll have gone a whole year without being first once.\"" }
        secenekler:
          - id: "gir"
            etiket: { tr: "Kapı'ya gir; ananın karşısına çık", en: "Walk into the Gate. Face the mother" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - savas: { dusmanlar: ["p4_tasma_anasi@oyuncu+4"], ortam: ["karanlik"], kazan: "p4_sonkapi_zafer", kaybet: "p4_sonkapi_yenilgi" }
          - id: "avcilar"
            etiket: { tr: "Avcıları topla; birlikte girin", en: "Rally the hunters. Go in together" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 3 }
              - itibar: { lonca: 3, siginak: 2 }
              - savas: { dusmanlar: ["p4_tasma_anasi@oyuncu+2"], ortam: ["karanlik"], kazan: "p4_sonkapi_zafer", kaybet: "p4_sonkapi_yenilgi" }
          - id: "gunes"
            tur: "gosteris"
            etiket: { tr: "Kapı'yı kollarından tutup dışarı, güneşe çevir", en: "Grab the Gate by its edges. Turn it inside out, into the sun" }
            gerekli: { stat: { str: 360 } }
            etkiler:
              - ahlak: { insanlik: -3, duzen: -2 }
              - dikkat: 8
              - efsane: "kapiyi_yalniz_kapatti"
            sonraki: "p4_sonkapi_gunes"
          - id: "aras"
            etiket: { tr: "Unvanı {npc:aras_kurt|e} bırak", en: "Let {npc:aras_kurt} have the title" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 8, saygi: -2 } }
              - npc_seviye: { aras_kurt: 20 }
              - tohum: { olay: "p4_siralama_zirvesi", gecikme: { min: 2, max: 5 } }
            sonraki: "p4_sonkapi_aras"

      - id: "p4_sonkapi_gunes"
        paragraflar:
          - { tr: "Kapı'nın iki kenarını tutuyorsun. Işık parmaklarını yakıyor; umursamıyorsun. Çekiyorsun ve Kapı bir eldiven gibi tersine dönüyor: içi dışarı, karanlığı güneşe.", en: "You grab both edges of the Gate. The light burns your fingers. You don't care. You pull, and the Gate turns inside out like a glove: its inside out, its darkness into the sun." }
          - { tr: "Ana, öğle güneşinin ortasında kalıyor. Yumurtaları birer birer patlıyor; bir dağ kadar büyük şey son bir ninni söylüyor ve kendi Kapı'sının içine çöküyor. Sokağın iki yanındaki avcılar bir dakika boyunca hiçbir şey söylemiyor.", en: "The mother is left in the middle of the noon sun. Her eggs burst one by one. The mountain-sized thing sings one last lullaby and collapses into its own Gate. The hunters on both sides of the street don't say a word for a full minute." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[UNVAN: Son Kapıyı Kapatan]", en: "[TITLE: Last Gate Closer]" }
            satirlar:
              - { tr: "Dünya'da açılan son Kapı kapandı. Süre: 41 saniye.", en: "The last Gate on Earth has closed. Time: 41 seconds." }
        secenekler:
          - id: "bagla"
            etiket: { tr: "Kalan yavruları kendine bağla", en: "Bind the surviving brood to you" }
            etkiler:
              - unvan: "son_kapiyi_kapatan"
              - ordu: { evcil_canavar: 15 }
              - xp_seviye: 80
              - ahlak: { insanlik: -3, duzen: 2 }
            sonraki: "@akis"
          - id: "yak"
            etiket: { tr: "Kalanları yak; hiçbir şey kalmasın", en: "Burn what's left. Leave nothing" }
            etkiler:
              - unvan: "son_kapiyi_kapatan"
              - xp_seviye: 80
              - ahlak: { merhamet: -2, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "p4_sonkapi_zafer"
        paragraflar:
          - { tr: "Ana son ninnisini yarıda kesiyor ve Kapı'nın ağzına yığılıyor. Kapı bir nefes daha alıyor, sonra vermiyor. Işık sönüyor. Sokakta, kırık asfaltın üstünde, kimsenin hatırlamadığı kadar uzun bir sessizlik.", en: "The mother breaks off her last lullaby and slumps across the Gate's mouth. The Gate draws one more breath, then doesn't let it out. The light goes dark. In the street, on the broken asphalt, a silence longer than anyone can remember." }
          - { tr: "Sonra gökyüzündeki her panelde aynı satır: [Dünya'daki son Kapı kapandı.] Bir yıl önce ilk Kapı kapandığında herkes sevinmişti. Şimdi kimse sevinmiyor; herkes yalnızca nefes alıyor.", en: "Then the same line on every panel in the sky: [The last Gate on Earth has closed.] A year ago, when the first Gate closed, everybody cheered. Now nobody cheers. Everybody just breathes." }
        secenekler:
          - id: "bagla"
            etiket: { tr: "Yavruları kendine bağla", en: "Bind the brood to you" }
            etkiler:
              - unvan: "son_kapiyi_kapatan"
              - ordu: { evcil_canavar: 12 }
              - xp_seviye: 90
              - ahlak: { insanlik: -3, duzen: 2 }
            sonraki: "@akis"
          - id: "avcilara"
            etiket: { tr: "Ganimeti avcılarla paylaş", en: "Split the loot with the hunters" }
            etkiler:
              - unvan: "son_kapiyi_kapatan"
              - ordu_kazan: 10
              - xp_seviye: 90
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { lonca: 4 }
            sonraki: "@akis"

      - id: "p4_sonkapi_aras"
        paragraflar:
          - { tr: "{npc:aras_kurt} sana uzun uzun bakıyor. \"Acıma mı bu?\" diye soruyor. Cevap vermiyorsun. Bir an daha bakıyor, sonra kılıcını çekip Kapı'nın içine yürüyor.", en: "{npc:aras_kurt} gives you a long look. \"Is this pity?\" he asks. You don't answer. He looks a moment longer, then draws his sword and walks into the Gate." }
          - { tr: "Yirmi dakika sonra Kapı kapanıyor. {npc:aras_kurt} dışarı çıkıyor, baştan aşağı yumurta sarısı ve kan içinde, ama yüzünde bir yıldır görmediğin bir şey var. Gökyüzündeki satır onun adını yazıyor.", en: "Twenty minutes later, the Gate closes. {npc:aras_kurt} walks out covered head to toe in yolk and blood, but there's something on his face you haven't seen in a year. The line in the sky has his name on it." }
        secenekler:
          - id: "tebrik"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { aras_kurt: { saygi: 6 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme; yalnızca gülümse", en: "Say nothing. Just smile" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { aras_kurt: { guven: 4 } }
            sonraki: "@akis"

      - id: "p4_sonkapi_yenilgi"
        paragraflar:
          - { tr: "Yavru dalgası seni Kapı'nın dışına, sokağa kusuyor. Ana bir ninni söylüyor ve Kapı taşıyor: dişli, ıslak bir halı iki sokak boyunca yayılıyor.", en: "A wave of brood vomits you back out of the Gate and into the street. The mother sings, and the Gate overflows: a wet, toothed carpet spreads two blocks." }
          - { tr: "Avcılar sokağı bir saat boyunca, bina bina, tutuyor. Sonunda biri, adını hiç bilmediğin biri, el bombasıyla Kapı'nın ağzına atlıyor. Kapı kapanıyor. Gökyüzünde onun adı yazmıyor; Sistem kimseye unvan vermiyor.", en: "The hunters hold the street for an hour, building by building. Finally one of them, someone whose name you never knew, jumps into the Gate's mouth with a grenade. The Gate closes. Their name doesn't go up in the sky. The System gives nobody a title." }
        secenekler:
          - id: "isim"
            etiket: { tr: "Onun adını öğren ve bir yere yaz", en: "Learn their name and write it somewhere" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "kule"
            etiket: { tr: "Kule'ye git; bir daha olmayacak", en: "Go to the Spire. Never again" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
              - xp_seviye: 30
            sonraki: "@akis"

  # ---------------------------------------------------------------- Küresel Sıralama'nın tepesi
  - id: "p4_siralama_zirvesi"
    perde: [4]
    bolge: ["kule_dibi", "eski_sehir", "sanayi"]
    gun: { min: 334, max: 357 }
    agirlik: 2
    etiketler: ["siralama", "rakip", "hakimiyet"]
    gerilim: 3
    kart: { tr: "Zirvede İki Kişi", en: "Two at the Top" }
    sahne: "p4_sira_1"
    sahneler:
      - id: "p4_sira_1"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} ortasındaki dev ekranda Küresel Sıralama dönüyor. En üstte senin adın. Bir yıldır orada. Altında, bir yıldır orada olan bir başka ad.", en: "On the giant screen in the middle of {yer:kule_dibi}, the Global Ranking scrolls. Your name is at the top. It's been there for a year. Right under it is another name that's been there just as long." }
          - metin: { tr: "{npc:aras_kurt} ekranın altında duruyor, kollarını kavuşturmuş. \"Hasattan önce bir kez,\" diyor. \"Yalnızca bir kez. Herkesin önünde. Kim gerçekten birinci.\"", en: "{npc:aras_kurt} stands under the screen with his arms crossed. \"Once before the Harvest,\" he says. \"Just once. In front of everybody. Who's really first.\"" }
            kosul: { npc_hayatta: "aras_kurt", npc_isaret: { aras_kurt: "rakip" } }
          - { tr: "Kalabalığın arasından kırık taç biçimli bir kask takmış biri çıkıyor: sıralamada bir yıl boyunca adı hep ilk birkaç satırda, ama hiç en üstte görünmemiş bir avcı. Kılıcını sana doğru tutuyor.", en: "Out of the crowd walks someone in a helmet shaped like a broken crown: a hunter whose name sat in the top few rows all year but never once at the top. Their sword is pointed straight at you." }
          - metin: { tr: "Ekranda bir şey değişiyor: senin adının üstünde, bir yıldır ilk kez, başka bir ad. {npc:aras_kurt}. S kademe. Kalabalık nefesini tutuyor; herkes sana bakıyor.", en: "Something changes on the screen: above your name, for the first time in a year, there's another one. {npc:aras_kurt}. S-Grade. The crowd holds its breath. Everybody looks at you." }
            kosul: { bayrak: "aras_s_kademe" }
        sezgiler:
          - kosul: { stat: { per: 310 } }
            metin: { tr: "[ALG] Kalabalıkta bahisler dönüyor. Oranlar senin lehine; ama herkes ikinciye oynuyor, çünkü bir kez olsun ikincinin kazandığını görmek istiyorlar.", en: "[PER] Bets are going around the crowd. The odds favor you, but everybody's putting money on number two, because just once they want to see the underdog win." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sıralama. ne tatlı. son günlerde bile insanlar sayı sayıyor. sen de say. ama yenildiğinde ne kaybedeceğini değil, kazandığında ne kaybedeceğini say.", en: "the ranking. how cute. even now people are counting numbers. you count too. but don't count what you lose if you lose. count what you lose if you win." }
        secenekler:
          - id: "aras_duello"
            etiket: { tr: "{npc:aras_kurt} ile son kez dövüş", en: "Fight {npc:aras_kurt} one last time" }
            goster: { npc_hayatta: "aras_kurt", bayrak_yok: "ihanet_aras" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 8 } }
              - savas: { dusmanlar: ["npc:aras_kurt"], ortam: ["tavan"], kazan: "p4_sira_zafer", kaybet: "p4_sira_yenilgi" }
          - id: "ikinci"
            etiket: { tr: "Kırık taçlıya düelloyu kabul et", en: "Accept the broken-crown hunter's duel" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["p4_ikinci_avci@oyuncu+3"], ortam: ["tavan"], kazan: "p4_sira_zafer", kaybet: "p4_sira_yenilgi" }
          - id: "tek_hamle"
            tur: "gosteris"
            etiket: { tr: "Rakibini tek hamlede, kılıcını kırarak durdur", en: "End it in one move. Break the blade" }
            gerekli: { stat: { agi: 350 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -2 }
              - dikkat: 5
              - iliski: { aras_kurt: { saygi: 6, korku: 4 } }
            sonraki: "p4_sira_ezme"
          - id: "reddet"
            etiket: { tr: "Reddet; sayılar artık önemli değil", en: "Decline. The numbers don't matter anymore" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - iliski: { aras_kurt: { saygi: -6, guven: 4 } }
              - tohum: { olay: "p4_son_yayin", gecikme: { min: 2, max: 5 } }
            sonraki: "p4_sira_ret"

      - id: "p4_sira_zafer"
        paragraflar:
          - { tr: "Rakibin dizlerinin üstünde, kılıcı meydanın öbür ucunda. Ekranda hiçbir şey değişmiyor; senin adın hâlâ en üstte. Ama meydandaki herkes artık bunun neden orada olduğunu biliyor.", en: "Your opponent is on their knees, their sword across the plaza. Nothing changes on the screen. Your name is still at the top. But everyone in the plaza knows now why it's there." }
          - { tr: "Rakibin başını kaldırıyor. Yüzünde öfke yok; bir yılın yorgunluğu var ve altında, tuhaf bir rahatlama. \"Tamam,\" diyor. \"Artık biliyorum.\"", en: "Your opponent lifts their head. There's no anger in their face, just a year's worth of exhaustion and, under it, a strange relief. \"Okay,\" they say. \"Now I know.\"" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[UNVAN: Zirvedeki]", en: "[TITLE: Top of the Board]" }
            satirlar:
              - { tr: "Küresel Sıralama: 1. Tartışma: kapandı.", en: "Global Ranking: #1. Debate: closed." }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini uzat, ayağa kaldır", en: "Offer a hand. Help them up" }
            etkiler:
              - unvan: "zirvedeki"
              - xp_seviye: 60
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 8, saygi: 6 } }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Arkanı dön ve yürü", en: "Turn your back and walk" }
            etkiler:
              - unvan: "zirvedeki"
              - xp_seviye: 60
              - ahlak: { merhamet: -3, duzen: 2 }
              - iliski: { aras_kurt: { saygi: 4, guven: -6 } }
            sonraki: "@akis"

      - id: "p4_sira_ezme"
        paragraflar:
          - { tr: "Rakibin ilk adımını atıyor ve sen o adımın sonunda zaten orasın. İki parmağınla kılıcın yassı yüzüne dokunuyorsun; kılıç bir buz parçası gibi çatlıyor ve meydanın taşlarına dökülüyor.", en: "Your opponent takes the first step, and you're already at the end of it. You touch the flat of the blade with two fingers. It cracks like a sheet of ice and spills across the plaza stones." }
          - { tr: "Kimse alkışlamıyor. Bir yılın sonunda alkışın da bir sınırı var. Rakibin kırık kabzaya bakıyor, sonra sana; sonra gülmeye başlıyor, çaresizce, neredeyse mutlu.", en: "Nobody claps. After a year like this, even applause has its limits. Your opponent looks at the broken hilt, then at you, then starts laughing, helplessly, almost happy." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Sen de gül", en: "Laugh with them" }
            etkiler:
              - unvan: "zirvedeki"
              - xp_seviye: 50
              - ahlak: { insanlik: 4 }
              - iliski: { aras_kurt: { guven: 6 } }
            sonraki: "@akis"
          - id: "kabza"
            etiket: { tr: "Kabzayı al; hatıra", en: "Keep the hilt. A souvenir" }
            etkiler:
              - unvan: "zirvedeki"
              - xp_seviye: 50
              - ahlak: { insanlik: -2, duzen: 1 }
            sonraki: "@akis"

      - id: "p4_sira_yenilgi"
        paragraflar:
          - { tr: "Sırtın taşlara çarpıyor. Kılıcın ucu boğazında, bir nefes uzaklıkta. Meydan donuyor. Ekrandaki adlar titriyor; bir saniyeliğine yer değiştiriyorlar.", en: "Your back hits the stones. The sword tip is at your throat, a breath away. The plaza freezes. The names on the screen flicker and, for a second, trade places." }
          - { tr: "Sonra rakibin kılıcını çekiyor. \"Bir kez,\" diyor, sesi titreyerek. \"Bir kez yeter. Hasat geldiğinde yine sen önde ol.\" Ekran eski hâline dönüyor; ama meydandaki herkes gördü.", en: "Then your opponent pulls the sword back. \"Once,\" they say, voice shaking. \"Once is enough. When the Harvest comes, you're still out front.\" The screen goes back to how it was. But everybody in the plaza saw." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; elini sık", en: "Take it. Shake their hand" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { aras_kurt: { saygi: 6, guven: 6 } }
            sonraki: "@akis"
          - id: "ofke"
            etiket: { tr: "Kalk ve tek kelime etmeden git", en: "Get up and leave without a word" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "p4_sira_ret"
        paragraflar:
          - { tr: "Kalabalık homurdanıyor; birkaç kişi ıslık çalıyor. Rakibin bir an ne yapacağını bilemiyor, sonra kılıcını indiriyor. \"Korktun mu?\" diye soruyor. Bunun korkuyla ilgisi olmadığını ikiniz de biliyorsunuz.", en: "The crowd grumbles, and a few people whistle. Your opponent doesn't know what to do for a second, then lowers the sword. \"Scared?\" they ask. You both know it has nothing to do with fear." }
          - { tr: "Ekranda adın hâlâ en üstte. Ama ilk kez, o adın ne kadar küçük harflerle yazıldığını fark ediyorsun.", en: "Your name's still at the top of the screen. But for the first time, you notice how small the letters are." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalabalıktan uzaklaş", en: "Walk away from the crowd" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "ikram"
            etiket: { tr: "Rakibini bir içkiye davet et", en: "Buy your opponent a drink" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 6, baglilik: 4 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Veda mektupları
  - id: "p4_veda_mektuplari"
    perde: [4]
    bolge: ["eski_sehir", "kiyikent_liman", "tepe"]
    gun: { min: 336, max: 360 }
    agirlik: 2
    etiketler: ["veda", "nefes", "yoldas"]
    gerilim: 1
    kart: { tr: "Veda Postanesi", en: "The Farewell Post Office" }
    sahne: "p4_veda_1"
    sahneler:
      - id: "p4_veda_1"
        paragraflar:
          - { tr: "Eski postane binası bir yıldır kapalıydı. Şimdi kapısında el yazısıyla bir tabela var: VEDA POSTANESİ. Gün 365'ten sonra açılacak mektuplar. İçeride, uzun bir masanın başında, insanlar sessizce yazıyor.", en: "The old post office building has been closed for a year. Now there's a handwritten sign on the door: FAREWELL POST OFFICE. Letters to be opened after Day 365. Inside, at a long table, people are writing in silence." }
          - { tr: "Postacı yaşlı bir kadın; emekli olmuştu, kıyamet onu geri çağırdı. Mektupları zarflara koyuyor, mühürlüyor ve bir rafa diziyor. Raf çoktan dolmuş; ikinci, üçüncü raf da dolmak üzere.", en: "The postmaster is an old woman who'd retired; the apocalypse called her back. She puts the letters in envelopes, seals them and lines them up on a shelf. The shelf's already full. The second and third are almost there." }
          - { tr: "Seni görünce gülümsüyor ve rafın bir köşesini gösteriyor. Orada, adının yazılı olduğu birkaç zarf bekliyor.", en: "When she sees you, she smiles and points to a corner of the shelf. There are a few envelopes there with your name on them." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bana da bir mektup yazar mısın? okuyamam. ama yazıldığını bilirim.", en: "would you write me a letter too? i can't read it. but i'd know it got written." }
        secenekler:
          - id: "oku"
            etiket: { tr: "Sana yazılan zarflara bak", en: "Look at the envelopes addressed to you" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - esya: { son_mektup: 1 }
            sonraki: "p4_veda_zarflar"
          - id: "yaz"
            etiket: { tr: "Masaya otur ve bir mektup yaz", en: "Sit at the table and write a letter" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
            sonraki: "p4_veda_yaz"
          - id: "postaci"
            etiket: { tr: "Postacıya yardım et; zarfları diz", en: "Help the postmaster. Shelve the envelopes" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 3 }
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 3, max: 8 } }
            sonraki: "p4_veda_postaci"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} için bir mektup yaz", en: "Write a letter for {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "p4_veda_yanki"

      - id: "p4_veda_zarflar"
        paragraflar:
          - metin: { tr: "Bir zarfın üstünde {npc:deniz_arman|in} el yazısı; vapurdaki kâğıt peçetelere yazdığı not kâğıdı yazısı. Açmıyorsun. Gün 365'ten sonra, diyor zarf. Ama ağırlığını tartıyorsun ve uzun bir mektup bu.", en: "One envelope is in {npc:deniz_arman|pos} handwriting, the same scrawl {zamir:deniz_arman|o} used to leave on ferry napkins. You don't open it. After Day 365, it says. But you weigh it in your hand, and it's a long letter." }
            kosul: { npc_hayatta: "deniz_arman", bayrak_yok: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Bir zarf {npc:elif_sari|den}. Üstüne yalnızca adını yazmış, düzgün, bir reçete gibi. Zarfın köşesine küçük bir kalp çizilmiş, sonra karalanmış, sonra yeniden çizilmiş.", en: "One envelope is from {npc:elif_sari}. She just wrote your name on it, neat as a prescription. In the corner there's a little heart, scribbled out, then drawn again." }
            kosul: { npc_hayatta: "elif_sari", iliski_min: { elif_sari: { baglilik: 60 } } }
          - metin: { tr: "Bir zarf {npc:kaya_demir|den}. Askeri bir zarf, kenarları dümdüz. Üstünde: \"Açmazsan daha iyi. Açarsan yüksek sesle okuma.\"", en: "One envelope is from {npc:kaya_demir}. A military envelope, edges dead straight. On the front: \"Better if you don't open it. If you do, don't read it out loud.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Bir zarfın üstünde bir yazı yok; yalnızca bir şifre. Üç kısa, bir uzun. {npc:mert_kilic}.", en: "One envelope has no writing on it, just a code. Three short, one long. {npc:mert_kilic}." }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: "ihanet_mert" }
          - { tr: "Ve bir zarf, kimden geldiği belli olmayan; çocuk el yazısıyla: \"Kanatlı canavarı öldüren kişiye.\" Bir yıl önce hangi çocuğu kurtardığını hatırlamıyorsun. O seni hatırlıyor.", en: "And one envelope from nobody in particular, in a kid's handwriting: \"To the person who killed the winged monster.\" You don't remember which kid you saved a year ago. They remember you." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Zarfları cebine koy; sonra", en: "Put the envelopes in your pocket. Later" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { baglilik: 4 }, elif_sari: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "ac"
            etiket: { tr: "Çocuğun mektubunu şimdi aç", en: "Open the kid's letter now" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "p4_veda_yaz"
        paragraflar:
          - { tr: "Kalemi alıyorsun ve uzun süre hiçbir şey yazmıyorsun. Kime? Bir yıl önceki sana mı, bir yıl sonra burada olacak birine mi, yoksa hiç kimseye mi?", en: "You pick up the pen and don't write anything for a long time. To who? The you from a year ago? Whoever's still here a year from now? Nobody at all?" }
          - { tr: "Sonunda yazıyorsun. Kısa bir mektup. Postacı zarfı mühürlerken üstüne ne yazacağını soruyor.", en: "Finally, you write. A short letter. As the postmaster seals the envelope, she asks what to put on the front." }
        secenekler:
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|in} adını yaz", en: "Write {npc:deniz_arman|pos} name" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
            sonraki: "@akis"
          - id: "kendine"
            etiket: { tr: "Kendi adını yaz", en: "Write your own name" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "bos"
            etiket: { tr: "Boş bırak: kim bulursa", en: "Leave it blank. For whoever finds it" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "p4_veda_postaci"
        paragraflar:
          - { tr: "Zarfları alfabetik sıraya diziyorsun. Postacı her birinin üstündeki adı yüksek sesle okuyor, sanki bir yoklama yapıyormuş gibi. Bazı adlarda duraksıyor; o adların sahipleri artık yok, ama mektupları hâlâ gidecek bir yer arıyor.", en: "You sort the envelopes alphabetically. The postmaster reads every name out loud, like taking attendance. She hesitates at some of them. The people they belong to are gone, but the letters are still looking for somewhere to go." }
          - { tr: "\"Kırk yıl posta dağıttım,\" diyor. \"Hiçbir zaman bu kadar çok mektup görmedim. İnsanlar ancak dünyanın sonunda yazmayı hatırladı.\"", en: "\"Forty years I delivered mail,\" she says. \"Never saw this many letters. People only remembered how to write at the end of the world.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Söz ver: hepsi teslim edilecek", en: "Promise her every one gets delivered" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Kırk yılını anlatsın; dinle", en: "Let her tell you about her forty years" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"

      - id: "p4_veda_yanki"
        paragraflar:
          - { tr: "Kâğıda ne yazacağını bilmiyorsun. Okuyamayacak birine, yalnızca kafanın içinde var olan birine nasıl mektup yazılır? Sonunda tek bir satır yazıyorsun.", en: "You don't know what to put on the paper. How do you write a letter to someone who can't read, someone who only exists inside your head? In the end you write a single line." }
          - { tr: "{npc:yanki} hiçbir şey söylemiyor. Ama zarfı mühürlediğinde, kafanın içinde, çok hafif, bir şey ısınıyor. sonra çok alçak bir ses: bunu saklayacağım. ne demek olduğunu bilmiyorum ama saklayacağım.", en: "{npc:yanki} doesn't say anything. But when you seal the envelope, something warms up inside your head, very faintly. then, very quietly: i'm keeping this. i don't know what that means, but i'm keeping it." }
        secenekler:
          - id: "rafa"
            etiket: { tr: "Zarfı rafa koy", en: "Put the envelope on the shelf" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "cebe"
            etiket: { tr: "Zarfı yanında taşı", en: "Keep the envelope on you" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kaçış gemisi
  - id: "p4_kacis_gemisi"
    perde: [4]
    bolge: ["kiyikent_liman", "kordon"]
    gun: { min: 335, max: 355 }
    agirlik: 2
    etiketler: ["kacis", "ahlak", "cok_evren"]
    gerilim: 3
    onemli: true
    kart: { tr: "Üç Yüz Koltuk", en: "Three Hundred Seats" }
    sahne: "p4_kacis_1"
    sahneler:
      - id: "p4_kacis_1"
        paragraflar:
          - { tr: "Limanın en ucunda, eski konteyner rıhtımında, pirinçten bir gemi yüzüyor. Suya değmiyor; bir karış yukarıda, sanki suya dokunmaktan tiksiniyormuş gibi asılı duruyor. Gövdesinde Pirinç Kervan'ın tartı işareti.", en: "At the far end of the harbor, by the old container dock, a brass ship is floating. It isn't touching the water. It hangs a hand's width above it, like it can't stand to touch it. On its hull is the Brass Caravan's scale-mark." }
          - { tr: "Rampanın başında bir tüccar oturuyor; Kadimlere boyun eğmiş bir ırktan, dört kollu, nazik, yorgun. Önünde bir terazi. \"Üç yüz koltuk,\" diyor kırık bir insan diliyle. \"Hasattan önce kalkıyoruz. Bedeli: bir yıllık seviye. Ya da bir insan.\"", en: "A merchant sits at the top of the ramp, from a race that bent the knee to the Ancients: four-armed, polite, tired. A set of scales in front of it. \"Three hundred seats,\" it says in broken human speech. \"We leave before the Harvest. The price: a year of levels. Or a person.\"" }
          - { tr: "Rıhtımda bir kalabalık var. Ellerinde çocukları, valizleri, seviye kayıtları. Kimse bir insan teklif etmiyor; henüz.", en: "There's a crowd on the dock. Kids in their arms, suitcases, level records. Nobody's offered a person yet. Not yet." }
          - metin: { tr: "Kalabalığın arasında beyazlılar dolaşıyor; kimin yakıt, kimin yolcu olacağını fısıldıyorlar.", en: "People in white are moving through the crowd, whispering about who'll be fuel and who'll be a passenger." }
            kosul: { npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { stat: { per: 310 } }
            metin: { tr: "[ALG] Terazinin bir kefesi hafif eğik. Tüccar seviyeleri tartarken parmağını kefenin altına koyuyor; her yolcudan biraz fazla alıyor.", en: "[PER] One pan of the scale sits slightly crooked. When the merchant weighs levels, it slips a finger under the pan. It's taking a little extra from every passenger." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o gemi bir yere gitmiyor. kervanın gemileri hiçbir yere gitmez. sadece dolaşır. ama dolaşmak, hasattan iyidir. belki.", en: "that ship isn't going anywhere. the caravan's ships never go anywhere. they just wander. but wandering beats the harvest. maybe." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çocuklar. Önce çocuklar. Bu tartışılmaz.\"", en: "\"Kids. Kids first. That's not up for debate.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşim olsaydı onu bu gemiye bindirir miydim? Bilmiyorum. Bilmiyorum.\"", en: "\"If my sister were here, would I put her on that ship? I don't know. I don't know.\"" }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "Koltukları çocuklara ayır; bedeli sen öde", en: "Save the seats for kids. You pay the price" }
            etkiler:
              - bayrak: "p4_kacis_cocuklar"
              - ahlak: { merhamet: 7, insanlik: 3 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 8, baglilik: 4 } }
              - tohum: { olay: "p4_kacis_gemisi_kalkis", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kaçış gemisindeki üç yüz koltuğu çocuklara verdin ve bedelini kendi seviyenden ödedin; o çocuklar bir yıldızın altında büyüdü ve seni hiç unutmadı.", en: "You gave the escape ship's three hundred seats to kids and paid for them out of your own levels, and those kids grew up under some other star and never forgot you." }
            sonraki: "p4_kacis_cocuk"
          - id: "satis"
            etiket: { tr: "Bırak koltuklar en yüksek teklife gitsin", en: "Let the seats go to the highest bidders" }
            etkiler:
              - bayrak: "p4_kacis_satis"
              - ahlak: { merhamet: -4, duzen: -2 }
              - degisken: { hayatta_kalan: -1 }
              - itibar: { kadimler: 3, siginak: -4 }
              - tohum: { olay: "p4_kacis_gemisi_kalkis", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kaçış gemisinin koltuklarını terazinin kararına bıraktın; gemiye binenler en güçlüler oldu ve geride kalanlar bunu hiç affetmedi.", en: "You left the escape ship's seats to the scales, the strongest got on board, and the ones left behind never forgave it." }
            sonraki: "p4_kacis_satis"
          - id: "terazi"
            etiket: { tr: "Hileli kefeyi herkesin önünde göster", en: "Show everyone the rigged scale" }
            gerekli: { stat: { per: 310 } }
            etkiler:
              - bayrak: "p4_kacis_cocuklar"
              - ahlak: { duzen: 4, merhamet: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { mert_kilic: { saygi: 4 } }
              - tohum: { olay: "p4_kacis_gemisi_kalkis", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kervan tüccarının hilesini rıhtımın ortasında yakaladın; gemi aynı gün kalktı, ama terazisi düzgündü.", en: "You caught the Caravan merchant cheating in the middle of the dock, and the ship left that same day, but with honest scales." }
            sonraki: "p4_kacis_terazi"
          - id: "batir"
            tur: "gosteris"
            etiket: { tr: "Gemiyi rıhtıma çivile; kimse Dünya'yı terk etmez", en: "Nail the ship to the dock. Nobody abandons Earth" }
            gerekli: { stat: { str: 340 } }
            etkiler:
              - bayrak: "p4_kacis_durduruldu"
              - ahlak: { duzen: 6, merhamet: -4, insanlik: 2 }
              - dikkat: 5
              - itibar: { lonca: 5, siginak: -5, kadimler: -5 }
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "Kaçış gemisini rıhtıma çiviledin ve kimsenin Dünya'yı terk etmesine izin vermedin; kalanlar seninle birlikte ya yaşadı ya biçildi.", en: "You nailed the escape ship to the dock and let nobody abandon Earth, and everyone who stayed either lived with you or was reaped with you." }
            sonraki: "p4_kacis_durdur"

      - id: "p4_kacis_cocuk"
        paragraflar:
          - { tr: "Avucunu terazinin kefesine koyuyorsun. Tüccar bir an duraksıyor; kefe yere çakılıyor. Senin bir yılın, üç yüz koltuğun hepsini ve fazlasını ödüyor. Tüccarın dört gözü birden büyüyor.", en: "You lay your palm on the scale's pan. The merchant hesitates; the pan slams to the ground. One year of yours pays for all three hundred seats and then some. All four of the merchant's eyes go wide." }
          - { tr: "Çocuklar rampaya tırmanıyor. Bazıları ağlıyor, bazıları el sallıyor, çoğu ne olduğunu anlamıyor. Anneler rıhtımda kalıyor. Bir anne sana dönüp yalnızca \"Teşekkür ederim\" diyor ve sesi kırılıyor.", en: "The kids climb the ramp. Some are crying, some are waving, most don't understand what's happening. The mothers stay on the dock. One of them turns to you and just says \"Thank you,\" and her voice breaks." }
        bildirimler:
          - tur: "durum"
            baslik: { tr: "[KAYNAK AKTARIMI]", en: "[RESOURCE TRANSFER]" }
            satirlar:
              - { tr: "Aktarılan: bir miktar XP. Anomali bunu fark etmedi bile.", en: "Transferred: some XP. The anomaly didn't even notice." }
        secenekler:
          - id: "el_salla"
            etiket: { tr: "Rampa kapanana kadar el salla", en: "Wave until the ramp closes" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"
          - id: "tuccar"
            etiket: { tr: "Tüccara söz verdir: güvenli bir dünya", en: "Make the merchant promise: a safe world" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { kadimler: 2 }
            sonraki: "@akis"

      - id: "p4_kacis_satis"
        paragraflar:
          - { tr: "Terazi çalışıyor. Seviyeler tartılıyor, koltuklar satılıyor. Güçlüler, zenginler, hızlılar rampaya tırmanıyor. Geride kalanlar rıhtımın kenarından bakıyor; bir kadın elindeki çocuğu rampadaki bir yabancıya uzatıyor, yabancı almıyor.", en: "The scales get to work. Levels are weighed, seats are sold. The strong, the rich, the fast climb the ramp. The ones left behind watch from the edge of the dock. A woman holds her kid out to a stranger on the ramp, and the stranger won't take it." }
          - { tr: "Rampa kapanırken birisi sana bağırıyor: \"Sen binmeyecek misin? Sen her şeyi ödersin!\" Binmiyorsun. Bunu neden yapmadığını kendine bile açıklayamıyorsun.", en: "As the ramp closes, somebody yells at you: \"Aren't you getting on? You could pay for anything!\" You don't. You can't even explain to yourself why not." }
        secenekler:
          - id: "cocugu_al"
            etiket: { tr: "Kadının çocuğunu sen al; rampaya at", en: "Take the woman's kid. Throw them onto the ramp" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "izle"
            etiket: { tr: "Rampanın kapanmasını izle", en: "Watch the ramp close" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
            sonraki: "@akis"

      - id: "p4_kacis_terazi"
        paragraflar:
          - { tr: "Tüccarın parmağını kefenin altından çekip havaya kaldırıyorsun. Rıhtım bir an susuyor, sonra bir uğultu yükseliyor. Tüccar dört elini birden kaldırıyor: teslim.", en: "You pull the merchant's finger out from under the pan and hold it up for everyone to see. The dock goes silent for a second, then a roar rises. The merchant raises all four hands at once: surrender." }
          - { tr: "\"Kervan'da herkes böyle tartar,\" diyor utanmadan. \"Ama madem gördün, adil tartarım.\" Terazi bu kez düz. Rampaya önce çocuklar, sonra yaşlılar, sonra kura çekenler çıkıyor.", en: "\"Everyone on the Caravan weighs like this,\" it says, unashamed. \"But since you saw, I will weigh fairly.\" This time the scale is level. Up the ramp go the kids first, then the elderly, then whoever wins the lottery." }
        secenekler:
          - id: "kura"
            etiket: { tr: "Kurayı sen çek", en: "Draw the lottery yourself" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
            sonraki: "@akis"
          - id: "tuccar_cezasi"
            etiket: { tr: "Tüccardan fazlasını geri iste", en: "Make the merchant pay back the extra" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - kredi: 2000
            sonraki: "@akis"

      - id: "p4_kacis_durdur"
        paragraflar:
          - { tr: "Geminin pirinç gövdesine iki elinle bastırıyorsun ve gemi suya iniyor; sonra rıhtıma, sonra rıhtımın betonuna gömülüyor. Tüccar dört kolunu birden açıp çaresizce bakıyor.", en: "You press down on the brass hull with both hands, and the ship drops into the water, then onto the dock, then down into the dock's concrete. The merchant spreads all four arms and stares, helpless." }
          - { tr: "\"Kimse gitmiyor,\" diyorsun. Rıhtımdaki kalabalığın yarısı alkışlıyor. Öbür yarısı, elinde çocuğuyla, sana bir yıl boyunca hiç bakmadığı gibi bakıyor.", en: "\"Nobody leaves,\" you say. Half the crowd on the dock applauds. The other half, kids in their arms, look at you in a way they never have in a whole year." }
        secenekler:
          - id: "aciklama"
            etiket: { tr: "Onlara açıkla: hepimiz ya da hiçbirimiz", en: "Explain it to them: all of us or none of us" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Açıklama yapma; arkanı dön", en: "Don't explain. Turn your back" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Kaçış gemisi kalkıyor (tohum)
  - id: "p4_kacis_gemisi_kalkis"
    perde: [4]
    agirlik: 1
    etiketler: ["kacis", "tohum"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Pirinç Gemi Kalkıyor", en: "The Brass Ship Lifts Off" }
    sahne: "p4_kalkis_1"
    sahneler:
      - id: "p4_kalkis_1"
        paragraflar:
          - { tr: "Nerede olursan ol, o sabah gökyüzünde pirinç bir parıltı görüyorsun. Kervan gemisi kalkıyor; filonun arasından, kimsenin onu durdurmaya tenezzül etmediği bir sinek gibi, ağır ağır yükseliyor.", en: "Wherever you are, that morning you see a glint of brass in the sky. The Caravan ship is lifting off, rising heavily through the fleet like a fly nobody can be bothered to swat." }
          - metin: { tr: "Pencerelerinde küçük yüzler var. Bir tanesi elinde bir kâğıt tutuyor; üstünde senin adın, büyük, çarpık harflerle.", en: "There are small faces in its windows. One of them is holding up a sheet of paper with your name on it in big, crooked letters." }
            kosul: { bayrak: "p4_kacis_cocuklar" }
          - metin: { tr: "Pencerelerinde güçlülerin yüzleri; hiçbiri aşağı bakmıyor.", en: "In its windows are the faces of the strong. None of them look down." }
            kosul: { bayrak: "p4_kacis_satis" }
          - { tr: "Bir Kadim gemisi burnunu kervan gemisine çeviriyor. Bir an hiçbir şey olmuyor. Sonra geri çeviriyor. Kervan, Kadimlere boyun eğmiş bir ırkın gemisi; bir efendi kölesinin kayığını batırmaz.", en: "An Ancient ship turns its prow toward the Caravan ship. For a moment, nothing happens. Then it turns away. The Caravan belongs to a people that bent the knee to the Ancients, and a master doesn't sink his servant's boat." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "gidiyorlar. bazen gitmek de bir son. hasat değil, ama son.", en: "they're leaving. sometimes leaving is an ending too. not the harvest. but an ending." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Gemi kaybolana kadar izle", en: "Watch until the ship is gone" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "koru"
            tur: "gosteris"
            etiket: { tr: "Gemiye filonun dışına kadar eşlik et", en: "Escort the ship clear of the fleet" }
            gerekli: { stat: { agi: 330 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - dikkat: 4
              - degisken: { hayatta_kalan: 1 }
              - iliski: { thessar: { saygi: 3 } }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Arkanı dön; burada iş var", en: "Turn around. There's work here" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 10
            sonraki: "@akis"

  # ---------------------------------------------------------------- Çocuk ordusu
  - id: "p4_cocuk_ordusu"
    perde: [4]
    bolge: ["sanayi", "tepe", "eski_sehir"]
    gun: { min: 337, max: 357 }
    agirlik: 2
    etiketler: ["ahlak", "ordu", "lonca"]
    gerilim: 3
    onemli: true
    kart: { tr: "On Dört Yaşındakiler", en: "The Fourteen-Year-Olds" }
    sahne: "p4_cocuk_1"
    sahneler:
      - id: "p4_cocuk_1"
        paragraflar:
          - { tr: "Eski bir fabrikanın avlusunda yüz kadar genç sıraya dizilmiş. En büyüğü on yedi, en küçüğü on dört. Ellerinde Sistem'in verdiği ilk silahları: paslı kılıçlar, kendi yaptıkları yaylar, birinin elinde bir kızartma tavası.", en: "In the yard of an old factory, about a hundred kids are lined up. The oldest is seventeen, the youngest fourteen. They're holding the first weapons the System ever gave them: rusty swords, homemade bows, one of them has a frying pan." }
          - { tr: "Bir Lonca çavuşu sıranın önünde bağırıyor: duruş, nefes, vuruş. Gençlerin çoğu Seviye 60 civarında; bir yıl önce bu, insanlığın en iyisi demekti. Bugün, bir Hasat Piyadesi'nin önünde, bir saniye demek.", en: "A Guild sergeant shouts at the front of the line: stance, breathe, strike. Most of these kids are around Level 60. A year ago that meant the best of humanity. Today, in front of a Reaper, it means one second." }
          - { tr: "Sıranın en sonundaki kız seni tanıyor. Gözleri büyüyor ve kızartma tavasını göğsüne bastırıyor; sanki bir madalyaymış gibi.", en: "The girl at the very end of the line recognizes you. Her eyes go wide, and she presses the frying pan to her chest like it's a medal." }
          - metin: { tr: "Bu sıra senin emrinle kuruldu. On beşinden büyük herkes, demiştin. Çavuş yalnızca kuralı biraz esnetmiş.", en: "This line exists because of your order. Everyone over fifteen, you said. The sergeant just stretched the rule a little." }
            kosul: { bayrak: "p4_cephe_lonca" }
        sezgiler:
          - kosul: { stat: { cha: 320 } }
            metin: { tr: "[KAR] Hepsi sana bakıyor. Ne dersen onu yapacaklar. Savaş de, savaşırlar. Kaç de, kaçarlar. Bu sorumluluğun ağırlığı bir Kadim gemisinden daha fazla.", en: "[CHA] They're all looking at you. They'll do whatever you say. Say fight, they'll fight. Say run, they'll run. The weight of that is heavier than an Ancient ship." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir yıl önce sen de onların yaşındaymışsın gibi bakıyorsun onlara. değildin. ama öyle hissediyorsun.", en: "you're looking at them like you were their age a year ago. you weren't. but it feels like it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bunlar çocuk. Çocuk! Bir yıl önce çoğunun aşı kartını ben imzaladım.\"", en: "\"These are children. Children! A year ago I signed half their vaccination cards.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Ben on dört yaşındayken sokakta kavga ediyordum. Kimse bana tava vermedi.\"", en: "\"When I was fourteen I was brawling in the street. Nobody gave me a frying pan.\"" }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Sırayı dağıt; hepsi tünellere", en: "Break up the line. Everyone to the tunnels" }
            etkiler:
              - bayrak: "p4_cocuklar_korundu"
              - ahlak: { merhamet: 7, duzen: -3 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 6, lonca: -5 }
              - iliski: { elif_sari: { guven: 8 }, kaya_demir: { saygi: -4 } }
            kronik: { tr: "On dört yaşındakilerin sırasını dağıttın ve onları tünellere gönderdin; o çocuklardan biri yıllar sonra bir okulun duvarına senin adını yazdı.", en: "You broke up the line of fourteen-year-olds and sent them to the tunnels, and years later one of those kids wrote your name on a school wall." }
            sonraki: "p4_cocuk_dagit"
          - id: "egit"
            etiket: { tr: "Onları kendin eğit; yaşasınlar diye", en: "Train them yourself. So they live" }
            etkiler:
              - bayrak: "p4_cocuklar_egitildi"
              - ahlak: { duzen: 4, merhamet: 2 }
              - ordu_kazan: 8
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 6 } }
            kronik: { tr: "On dört yaşındakileri kendi ellerinle eğittin; istila günü çoğu hayatta kaldı, çünkü onlara önce kaçmayı öğretmiştin.", en: "You trained the fourteen-year-olds with your own hands, and on invasion day most of them lived, because the first thing you taught them was how to run." }
            sonraki: "p4_cocuk_egit"
          - id: "cepheye"
            etiket: { tr: "Çavuşa hak ver; herkes savaşacak", en: "Back the sergeant. Everybody fights" }
            etkiler:
              - bayrak: "p4_cocuklar_cepheye"
              - ahlak: { duzen: 6, merhamet: -7 }
              - ordu_kazan: 12
              - degisken: { hayatta_kalan: -3 }
              - itibar: { lonca: 6, siginak: -8 }
              - iliski: { elif_sari: { guven: -10 }, deniz_arman: { guven: -6 } }
            kronik: { tr: "On dört yaşındakileri cepheye gönderdin; kıyı tutuldu, ama fabrika avlusundaki sıranın yarısı bir daha toplanmadı.", en: "You sent the fourteen-year-olds to the front. The shore held, but half that line in the factory yard never lined up again." }
            sonraki: "p4_cocuk_cephe"
          - id: "tava"
            tur: "gosteris"
            etiket: { tr: "Tavalı kıza bir şey göster", en: "Show the girl with the frying pan something" }
            gerekli: { stat: { agi: 320 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - dikkat: 2
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 2, max: 6 } }
            kronik: { tr: "Bir fabrika avlusunda on dört yaşında bir kıza, bir kızartma tavasıyla neler yapılabileceğini gösterdin; o kız savaşı değil, gülmeyi hatırladı.", en: "In a factory yard, you showed a fourteen-year-old girl everything you can do with a frying pan, and what she remembered wasn't the war, it was laughing." }
            sonraki: "p4_cocuk_tava"

      - id: "p4_cocuk_dagit"
        paragraflar:
          - { tr: "\"Herkes eve,\" diyorsun. Çavuş itiraz etmeye başlıyor; tek bir bakışla susuyor. Sıra bir an kıpırdamıyor, sonra dağılıyor. Bazı gençler sevinçle koşuyor, bazıları utançla, birkaçı ise kılıçlarını bırakmıyor.", en: "\"Everybody home,\" you say. The sergeant starts to object; one look shuts him up. The line doesn't move for a second, then breaks apart. Some kids run off happy, some ashamed, and a few won't put their swords down." }
          - { tr: "Tavalı kız yanından geçerken duruyor. \"Ben de savaşmak istiyordum,\" diyor. \"Senin gibi.\"", en: "The girl with the frying pan stops as she passes you. \"I wanted to fight too,\" she says. \"Like you.\"" }
        secenekler:
          - id: "hayir"
            etiket: { tr: "\"Benim gibi olma. Daha iyisi ol.\"", en: "\"Don't be like me. Be better.\"" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"
          - id: "tunel"
            etiket: { tr: "Onları tünellere kendin götür", en: "Walk them to the tunnels yourself" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "p4_cocuk_egit"
        paragraflar:
          - { tr: "Üç gün boyunca avluda onlarla kalıyorsun. Onlara vurmayı değil, düşmeyi öğretiyorsun; saldırmayı değil, kaçmayı; kahraman olmayı değil, hayatta kalmayı. Çavuş önce homurdanıyor, sonra not almaya başlıyor.", en: "For three days you stay in that yard with them. You don't teach them to hit, you teach them to fall. Not to charge, but to run. Not how to be heroes, but how to stay alive. The sergeant grumbles at first, then starts taking notes." }
          - { tr: "Üçüncü günün sonunda tavalı kız Seviye 64. Seninle ilk kez göz göze geldiğinde 60'tı. Sevinçle bağırıyor; sen de gülümsüyorsun, bir yıl önce Seviye 2'ye ulaştığın sabahki gibi.", en: "By the end of the third day, the girl with the frying pan is Level 64. She was 60 when she first met your eyes. She shrieks with joy, and you smile, like the morning you hit Level 2 a year ago." }
        secenekler:
          - id: "tebrik"
            etiket: { tr: "Kızı tebrik et", en: "Congratulate the girl" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "cavus"
            etiket: { tr: "Çavuşa bir liste bırak: kural bu", en: "Leave the sergeant a list. These are the rules" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"

      - id: "p4_cocuk_cephe"
        paragraflar:
          - { tr: "Çavuş seni selamlıyor ve sıraya döndürüyor. \"Duydunuz! Herkes savaşacak!\" Gençlerin bazıları tezahürat yapıyor. Bazıları yalnızca yere bakıyor.", en: "The sergeant salutes you and turns back to the line. \"You heard! Everybody fights!\" Some of the kids cheer. Some just stare at the ground." }
          - { tr: "Tavalı kız tavasını yere bırakıyor ve bir paslı kılıç alıyor. Kılıç ona büyük. Sana bir daha bakmıyor.", en: "The girl with the frying pan sets it down and picks up a rusty sword. It's too big for her. She doesn't look at you again." }
        secenekler:
          - id: "kilic"
            etiket: { tr: "Ona daha küçük bir kılıç bul", en: "Find her a smaller sword" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Avludan çık; bakma", en: "Leave the yard. Don't look" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            sonraki: "@akis"

      - id: "p4_cocuk_tava"
        paragraflar:
          - { tr: "Kızın elinden tavayı alıyorsun, avlunun öbür ucundaki bir hurda yığınına fırlatıyorsun ve tava daha yere düşmeden yanında olup onu havada yakalıyorsun. İki kez. Üç kez. Dördüncüsünde yüz kişilik sıra kahkahayla bükülüyor.", en: "You take the pan from the girl, fling it at a scrap heap across the yard, and are beside it to catch it before it ever lands. Twice. Three times. On the fourth, the whole line of a hundred kids doubles over laughing." }
          - { tr: "Tavayı kıza geri veriyorsun. \"Bunu sakla,\" diyorsun. \"Savaş için değil.\" Kız tavayı alıyor ve ilk kez bir çocuk gibi gülüyor.", en: "You hand the pan back to her. \"Keep this,\" you say. \"Not for the war.\" She takes it and laughs like a kid for the first time." }
        secenekler:
          - id: "tunele"
            etiket: { tr: "Sonra hepsini tünellere gönder", en: "Then send them all to the tunnels" }
            etkiler:
              - bayrak: "p4_cocuklar_korundu"
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "@akis"
          - id: "egit"
            etiket: { tr: "Sonra onlara düşmeyi öğret", en: "Then teach them how to fall" }
            etkiler:
              - bayrak: "p4_cocuklar_egitildi"
              - ahlak: { duzen: 3, merhamet: 2 }
              - ordu_kazan: 6
            sonraki: "@akis"

  # ---------------------------------------------------------------- Son yayın
  - id: "p4_son_yayin"
    perde: [4]
    gun: { min: 338, max: 362 }
    agirlik: 2
    etiketler: ["yayin", "sessiz_ag", "aciga_vur"]
    gerilim: 2
    kart: { tr: "Son Yayın", en: "The Last Broadcast" }
    sahne: "p4_yayin_1"
    sahneler:
      - id: "p4_yayin_1"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} en yüksek binasının çatısında, paslı bir radyo anteni bir yıldır susuyordu. Bu sabah çatıda kablolar, jeneratörler ve uykusuz teknisyenler var. Antenin dibinde bir mikrofon; önünde bir sandalye.", en: "On the roof of the tallest building in {yer:eski_sehir}, a rusty radio antenna has been silent for a year. This morning the roof is full of cables, generators and sleepless techs. At the foot of the antenna there's a microphone, and a chair in front of it." }
          - metin: { tr: "Sessiz Ağ'ın teknisyenleri sana kulaklığı uzatıyor. \"Sistem'in yayınlarının arasına girebiliyoruz. Bir kez. Hayatta kalan herkes aynı anda duyar. Ne söylemek istersin?\"", en: "The Quiet Network's techs hold the headset out to you. \"We can cut in between the System's broadcasts. Once. Everyone still alive hears it at the same time. What do you want to say?\"" }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: "ihanet_mert" }
          - metin: { tr: "{npc:mert_kilic} son kablonun bağlantısını kendi eliyle yapıyor, sonra kulaklığı senin boynuna geçiriyor. \"Düzeneği ben kurdum,\" diyor. \"Ne dersen de. Sesin titrerse keserim; kimse fark etmez.\"", en: "{npc:mert_kilic} makes the last cable connection himself, then hangs the headset around your neck. \"I built this rig,\" he says. \"Say whatever you want. If your voice shakes, I'll cut it. Nobody'll notice.\"" }
            kosul: { yoldas: "mert_kilic", bayrak_yok: ["ihanet_mert", "mert_surgun"] }
          - metin: { tr: "Sessiz Ağ'ın kalan teknisyenleri sana kulaklığı uzatıyor. \"Bir kez yayına girebiliyoruz. Bütün dünya duyar. Ne söylemek istersin?\"", en: "The Quiet Network's remaining techs hold the headset out to you. \"We can get on the air once. The whole world hears it. What do you want to say?\"" }
            kosul: { bayrak: "ihanet_mert", npc_hayatta: "mert_kilic" }
          - metin: { tr: "Ağ'ın teknisyenleri sana kulaklığı uzatıyor; {npc:mert_kilic|in} kurduğu düzenek hâlâ çalışıyor, onun el yazısı her kablonun üstünde. \"Bir kez,\" diyorlar. \"Bütün dünya duyar.\"", en: "The Network's techs hold the headset out to you. The rig {npc:mert_kilic} built still works, his handwriting on every cable. \"Once,\" they say. \"The whole world hears it.\"" }
            kosul: { npc_olu: "mert_kilic" }
          - { tr: "Geriye kalan herkes. Bir yıl önce Sistem onlarla aynı anda konuştuğunda kimse cevap verememişti. Şimdi biri cevap verebilir.", en: "Everyone who's left. A year ago, when the System talked to all of them at once, nobody could answer. Now somebody can." }
        sezgiler:
          - kosul: { stat: { int: 310 } }
            metin: { tr: "[ZEK] Yayın Sistem'in kendi kanalından geçecek. Sistem bunu engelleyebilir; engellemiyor. Bir şey duymak istiyor olabilir mi?", en: "[INT] The broadcast will go out over the System's own channel. The System could block it. It isn't. Could it want to hear something?" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ne dersen de, kısa tut. insanlar sonu yaklaşan şeylere uzun süre bakamaz.", en: "whatever you say, keep it short. people can't stare at the end of things for long." }
        secenekler:
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Kim olduğunu söyle: anomali benim", en: "Tell them who you are: I'm the anomaly" }
            etkiler:
              - aciga_vur: true
              - bayrak: "p4_yayin_aciga"
              - dikkat: 10
              - ahlak: { insanlik: 3, duzen: -3 }
              - itibar: { siginak: 3, lonca: 3, yukselenler: 3, sessiz_ag: 5 }
              - iliski: { mert_kilic: { saygi: 6 } }
            sonraki: "p4_yayin_aciga"
          - id: "isimler"
            etiket: { tr: "Bir yıl içinde ölenlerin isimlerini oku", en: "Read the names of everyone who died this year" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 3 }
              - itibar: { siginak: 5 }
            sonraki: "p4_yayin_isim"
          - id: "dunyaya"
            tur: "gosteris"
            etiket: { tr: "Bütün insanlığa tek bir emir ver", en: "Give all of humanity a single order" }
            gerekli: { stat: { cha: 360 } }
            etkiler:
              - ahlak: { duzen: 7, insanlik: -4 }
              - dikkat: 8
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 6 }
              - ordu_kazan: 15
            sonraki: "p4_yayin_emir"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "Mikrofonu başkasına ver", en: "Hand the mic to someone else" }
            etkiler:
              - bayrak: "p4_yayin_sessiz"
              - gizle: 10
              - ahlak: { insanlik: 2, duzen: -2 }
              - iliski: { mert_kilic: { guven: 4 } }
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 2, max: 6 } }
            sonraki: "p4_yayin_baskasi"

      - id: "p4_yayin_aciga"
        paragraflar:
          - { tr: "\"Bir yıldır sizinle aynı panellere bakıyorum,\" diyorsun. \"Ama benimkiler farklıydı.\" Sonra anlatıyorsun: {npc:yanki|i}, Günlük Görev'i, gerçek seviyeni. Rakamı söylediğinde dünyanın bir yerinde biri, bir yerde biri daha, kahkahayla gülüyor; inanamadıklarından.", en: "\"For a year I've been looking at the same panels as you,\" you say. \"Mine were different.\" Then you tell them: the voice in your head, the Daily Quest, your real level. When you say the number, somewhere in the world somebody laughs, and somebody else, out of sheer disbelief." }
          - { tr: "Sonra gülme kesiliyor. Yayın bittiğinde çatıdaki teknisyenler sana bakıyor; bir yıldır tanıdıkları birine değil, bir yabancıya bakar gibi. Gökyüzündeki bütün gemiler ışıklarını bir kez yakıp söndürüyor.", en: "Then the laughing stops. When the broadcast ends, the techs on the roof are staring at you, not like someone they've known for a year but like a stranger. In the sky, every ship flashes its lights once." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[DİKKAT ARTTI]", en: "[ATTENTION RISING]" }
            satirlar:
              - { tr: "Artık herkes biliyor. Gerçekten herkes.", en: "Everyone knows now. Everyone, really." }
        secenekler:
          - id: "rahat"
            etiket: { tr: "Rahat bir nefes al", en: "Take a deep breath. It's out" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "teknisyen"
            etiket: { tr: "Teknisyenlere dön: hâlâ benim", en: "Turn to the techs: it's still me" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { sessiz_ag: 3 }
            sonraki: "@akis"

      - id: "p4_yayin_isim"
        paragraflar:
          - { tr: "Bir liste istiyorsun ve teknisyenler sana Kasaba Çekirdeği'nin kayıtlarını veriyor. Okumaya başlıyorsun. Bir isim, bir isim daha. Saat geçiyor. Jeneratörlerden biri tükeniyor; biri yenisini getiriyor.", en: "You ask for a list, and the techs hand you the Town Core's records. You start reading. One name, then another. Hours go by. One of the generators runs dry; somebody brings a new one." }
          - { tr: "Dünyanın başka şehirlerinde başka insanlar kendi mikrofonlarına gidiyor ve kendi listelerini okumaya başlıyor. Gece yarısı bütün kanallarda isimler okunuyor. Sistem kendi bildirimlerini o gece hiç yayınlamıyor.", en: "In other cities around the world, other people go to their own microphones and start reading their own lists. By midnight, names are being read on every channel. The System doesn't push a single notification all night." }
        secenekler:
          - id: "son_isim"
            etiket: { tr: "Son isme kadar oku", en: "Read until the last name" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "deniz_kardes"
            etiket: { tr: "Listeye bir isim daha ekle", en: "Add one more name to the list" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { baglilik: 6, guven: 4 } }
            sonraki: "@akis"

      - id: "p4_yayin_emir"
        paragraflar:
          - { tr: "\"Herkes,\" diyorsun. Hayatta kalan herkes aynı anda duruyor. \"Hasat günü kimse yalnız durmayacak. Kapınızı komşunuza açın. Silahınızı en yakın sura taşıyın. Bir yıl hayatta kaldınız; kalan günleri de çıkaracaksınız.\"", en: "\"Everyone,\" you say. Everyone still alive stops at the same moment. \"On harvest day, nobody stands alone. Open your door to your neighbor. Carry your weapon to the nearest wall. You survived a year. You'll make it through the days that are left.\"" }
          - { tr: "Yayın bittiğinde dünyanın bir ucunda bir şehir surlarını yeniden kuruyor, öbür ucunda bir köy kapılarını açıyor. Ve {yer:kiyikent|e} her yerden, adını duymuş insanlar akın etmeye başlıyor.", en: "When the broadcast ends, a city on one side of the world starts rebuilding its walls and a village on the other side opens its gates. And people who've heard your name start streaming into {yer:kiyikent} from everywhere." }
        secenekler:
          - id: "karsila"
            etiket: { tr: "Gelenleri karşıla", en: "Welcome the ones arriving" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "dizdir"
            etiket: { tr: "Gelenleri surlara diz", en: "Put the newcomers on the walls" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - ordu_kazan: 5
            sonraki: "@akis"

      - id: "p4_yayin_baskasi"
        paragraflar:
          - { tr: "Kulaklığı çatının kenarında oturan genç bir teknisyene veriyorsun. Kız şaşkın, sonra korkmuş, sonra mikrofona eğiliyor ve annesine bir şey söylüyor; annesi dünyanın öbür ucunda bir şehirde, belki hâlâ hayatta.", en: "You hand the headset to a young tech sitting at the edge of the roof. She's stunned, then scared, then she leans into the mic and says something to her mother, who's in a city on the other side of the world, maybe still alive." }
          - { tr: "Bir saat sonra cevap geliyor; cızırtılı, uzak, ama gerçek. Kız ağlamaya başlıyor. Çatıdaki herkes bir şekilde onunla birlikte ağlıyor.", en: "An hour later, an answer comes: crackling, distant, but real. The girl starts crying. Somehow, everyone on the roof is crying with her." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Çatıda kal; sırayla herkes konuşsun", en: "Stay on the roof. Let everyone take a turn" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Sessizce çatıdan in", en: "Slip off the roof quietly" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gizle: 3
            sonraki: "@akis"

  # ---------------------------------------------------------------- İstiladan sonra
  - id: "p4_yikik_kiyikent"
    perde: [4]
    gun: { min: 343, max: 357 }
    agirlik: 3
    etiketler: ["istila_sonrasi", "sivil", "yas"]
    gerilim: 2
    kart: { tr: "Ertesi Sabah", en: "The Morning After" }
    sahne: "p4_yikik_1"
    sahneler:
      - id: "p4_yikik_1"
        paragraflar:
          - metin: { tr: "{yer:kiyikent|in} sokaklarında enkaz toplanıyor. Limanın ortasında bir Kadim gemisinin gövdesi yan yatmış; çocuklar üstüne tırmanıp oynuyor. {yer:kordon|in} fenerleri yeniden yakılıyor. Her köşede bir cenaze, her köşede bir düğün; insanlar ikisini aynı gün yapmayı öğrenmiş.", en: "Rubble's being cleared from the streets. In the middle of the harbor, an Ancient ship's hull lies on its side, and kids climb all over it. The lamps on {yer:kordon} are lit again. A funeral on every corner, a wedding on every corner; people have learned to do both on the same day." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Sokaklarda Kadim devriyeleri dolaşıyor; yedi köşeli yıldız Çekirdek'in tepesinde. İnsanlar onlara yol veriyor, başlarını eğmeden ama gözlerini de kaldırmadan. Fırınlar açık, okullar açık; kimse bunun neyin bedeli olduğunu yüksek sesle söylemiyor.", en: "Ancient patrols walk the streets, the seven-pointed star flying over the Core. People step aside for them, without bowing their heads but without raising their eyes either. The bakeries are open, the schools are open. Nobody says out loud what it all cost." }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "{yer:tepe|in} yamacındaki kamp büyüyor. Çadırlar, barakalar, bir okulun yanmış iskeletinden kurulmuş bir hastane. Aşağıda şehirde sütunlar hâlâ yanıyor; her gece biraz daha az ışık, biraz daha az insan.", en: "The camp on the slope of {yer:tepe} keeps growing. Tents, shacks, a hospital built inside the burned-out skeleton of a school. Down in the city, the pillars still burn. Every night a little less light, a little fewer people." }
            kosul: { bayrak: "kiyikent_dustu" }
          - metin: { tr: "Şehir hâlâ bekliyor. Gökyüzündeki gemiler hâlâ asılı; kimse ne olacağını bilmiyor.", en: "The city's still waiting. The ships still hang in the sky, and nobody knows what happens next." }
            kosul: { bayrak_yok: ["kadimler_yenildi", "kadim_anlasmasi", "kiyikent_dustu"] }
          - { tr: "Bir yaşlı adam seni görünce şapkasını çıkarıyor. Hasatın ilk sabahı filonun gölgesine şemsiyesini açan adam bu. \"Bir şey soracağım,\" diyor. \"Değdi mi?\"", en: "An old man takes off his hat when he sees you. It's the man who opened his umbrella against the fleet's shadow on the Harvest's first morning. \"I'm going to ask you something,\" he says. \"Was it worth it?\"" }
        sezgiler:
          - kosul: { stat: { wis: 310 } }
            metin: { tr: "[BİL] Adam sana bir cevap için değil, bir ses duymak için soruyor. Ne söylediğin önemli değil; söylemen önemli.", en: "[WIS] The man isn't asking you for an answer. He's asking to hear a voice. It doesn't matter what you say. It matters that you say it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu soruyu bana hiç kimse sormadı. bin dört yüz dünya. hiç kimse. cevap ver ona.", en: "nobody ever asked me that. fourteen hundred worlds. nobody. answer him." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Değdi mi? Bilmiyorum. Ama sen hâlâ buradasın. Ben hâlâ buradayım. Bu bir şey.\"", en: "\"Was it worth it? I don't know. But you're still here. I'm still here. That's something.\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Sen hâlâ buradasın.\"", en: "\"Yes. You're still here.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "p4_yikik_evet"
          - id: "bilmiyorum"
            etiket: { tr: "\"Bilmiyorum. Hâlâ bilmiyorum.\"", en: "\"I don't know. I still don't know.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
            sonraki: "p4_yikik_bilmem"
          - id: "insa"
            tur: "gosteris"
            etiket: { tr: "Cevap verme; adamın yıkık evini yeniden kur", en: "Don't answer. Rebuild the man's wrecked house" }
            gerekli: { stat: { end: 320 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - dikkat: 2
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { saygi: 4 } }
            sonraki: "p4_yikik_insa"
          - id: "kamp"
            etiket: { tr: "Kamptaki hastaneye git", en: "Head to the camp hospital" }
            goster: { bayrak: "kiyikent_dustu" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { guven: 6 } }
              - tohum: { olay: "p4_son_gece_ates", gecikme: { min: 1, max: 4 } }
            sonraki: "p4_yikik_kamp"

      - id: "p4_yikik_evet"
        paragraflar:
          - { tr: "Adam başını sallıyor, şapkasını geri takıyor ve yürüyor. Üç adım sonra duruyor, dönüyor. \"Ben de öyle düşünüyorum,\" diyor. \"Ama senin söylemen gerekiyordu.\"", en: "The man nods, puts his hat back on and walks off. Three steps later he stops and turns around. \"I think so too,\" he says. \"But I needed to hear you say it.\"" }
          - { tr: "Sokağın köşesinde bir çocuk bir duvara tebeşirle bir şey çiziyor: bir insan figürü, tek başına, kırk tane uzun ince şeyin önünde.", en: "On the street corner, a kid is drawing something on a wall in chalk: a human figure, alone, in front of forty long thin things." }
        secenekler:
          - id: "cizim"
            etiket: { tr: "Çizime bir figür daha ekle", en: "Add another figure to the drawing" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Yürü; daha çok sokak var", en: "Keep walking. There are more streets" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "p4_yikik_bilmem"
        paragraflar:
          - { tr: "Adam uzun uzun yüzüne bakıyor. Sonra gülümsüyor; yorgun, yaşlı, gerçek bir gülümseme. \"İyi,\" diyor. \"Bilseydin korkardım.\"", en: "The man studies your face for a long time. Then he smiles: a tired, old, real smile. \"Good,\" he says. \"If you knew, I'd be scared.\"" }
          - { tr: "Şapkasını takıp gidiyor. Sen de sokağın ortasında bir süre kalıyorsun; bir yıldır ilk kez, bilmediğin bir şey olduğu için kendini hafif hissederek.", en: "He puts on his hat and goes. You stay in the middle of the street a while, feeling light, for the first time in a year, because there's something you don't know." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Bir bankta otur", en: "Sit down on a bench" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: sen biliyor musun?", en: "Ask {npc:yanki}: do you know?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
            sonraki: "@akis"

      - id: "p4_yikik_insa"
        paragraflar:
          - { tr: "Adamın evi üç sokak ötede, yarısı çökmüş. Bir öğleden sonra boyunca duvarları kaldırıyor, kirişleri yerine oturtuyor, çatıyı kapatıyorsun. Mahalle toplanıp izliyor; sonra biri bir çekiç getiriyor, biri bir pencere camı, biri limonata.", en: "The man's house is three blocks away, half collapsed. You spend an afternoon raising the walls, setting the beams back in place, closing up the roof. The neighborhood gathers to watch; then somebody brings a hammer, somebody a pane of glass, somebody lemonade." }
          - { tr: "Akşam olduğunda ev ayakta. Adam kapının eşiğinde, şapkası elinde. Sorusunu tekrarlamıyor; cevabını almış.", en: "By evening, the house is standing. The man is in the doorway with his hat in his hand. He doesn't repeat his question. He's got his answer." }
        secenekler:
          - id: "limonata"
            etiket: { tr: "Limonatanı iç", en: "Drink your lemonade" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"
          - id: "baska_ev"
            etiket: { tr: "Sıradaki eve geç", en: "Move on to the next house" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "p4_yikik_kamp"
        paragraflar:
          - { tr: "Yanmış okulun içindeki hastanede sedyeler sınıf sıralarının arasına dizilmiş. Kara tahtada hâlâ bir kesir problemi var. Hekimler üç gündür uyumamış.", en: "In the hospital inside the burned school, stretchers are lined up between the classroom desks. There's still a fractions problem on the chalkboard. The doctors haven't slept in three days." }
          - metin: { tr: "{npc:elif_sari} seni görünce ellerini önlüğüne siliyor. \"Kan grubun ne?\" diye soruyor. \"Ya da boş ver; senin kanın artık bir gruba uymuyordur. Su taşı.\"", en: "{npc:elif_sari} wipes her hands on her apron when she sees you. \"What's your blood type?\" she asks. \"Never mind. Yours probably doesn't fit any type anymore. Carry water.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "su"
            etiket: { tr: "Su taşı; bütün gün", en: "Carry water. All day" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "tahta"
            etiket: { tr: "Kara tahtadaki problemi çöz", en: "Solve the problem on the chalkboard" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"

  # ---------------------------------------------------------------- Son gece ateşi
  - id: "p4_son_gece_ates"
    perde: [4]
    gun: { min: 345, max: 357 }
    agirlik: 2
    etiketler: ["nefes", "yoldas", "veda"]
    gerilim: 1
    kart: { tr: "Son Ateş", en: "The Last Fire" }
    sahne: "p4_ates_1"
    sahneler:
      - id: "p4_ates_1"
        paragraflar:
          - { tr: "Gece, {yer:tepe|in} sırtında, şehrin ışıklarını ve gökyüzündeki gemileri gören bir yerde küçük bir ateş yakıyorsun. Bir yıl önce, sisli bir ormanda da böyle bir ateş yakmıştın. Odunlar farklı, gökyüzü farklı; sen de farklısın.", en: "At night, up on the ridge of {yer:tepe} where you can see the city lights and the ships in the sky, you light a small fire. A year ago, in a foggy forest, you lit a fire just like this one. Different wood, different sky. You're different too." }
          - metin: { tr: "{npc:deniz_arman} karşına oturuyor, ellerini ateşe uzatıyor. \"Vapurda,\" diyor, \"sen hep pencere kenarına otururdun. Ben de koridor tarafına. Hiç yer değiştirmedik. Hiç.\"", en: "{npc:deniz_arman} sits down across from you and holds {zamir:deniz_arman|onun} hands out to the fire. \"On the ferry,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, \"you always took the window seat. I always took the aisle. We never switched. Not once.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} gelip yanına oturuyor, başını omzuna dayıyor. Ateşin çıtırtısından başka ses yok. Bir süre sonra nabzını sayıyor; seninkini, kendi bileğine bakmadan.", en: "{npc:elif_sari} comes and sits beside you and rests her head on your shoulder. No sound but the crackle of the fire. After a while she's counting your pulse without looking at her own wrist." }
            kosul: { yoldas: "elif_sari" }
          - metin: { tr: "{npc:aras_kurt} ateşin kenarında ayakta duruyor, oturmayı reddediyor. Sonra oturuyor. \"Bir yıl boyunca seni yenmeyi düşündüm,\" diyor. \"Şimdi yalnızca sabahı görmeyi düşünüyorum. Tuhaf.\"", en: "{npc:aras_kurt} stands at the edge of the fire, refusing to sit. Then he sits. \"All year I thought about beating you,\" he says. \"Now I just think about seeing the morning. Weird.\"" }
            kosul: { yoldas: "aras_kurt" }
          - metin: { tr: "{npc:mert_kilic} telsizini ateşin yanına koyuyor; cızırtının arasında dünyanın öbür ucundan biri şarkı söylüyor. \"Bırak çalsın,\" diyor. \"Veri değil bu. Sadece şarkı.\"", en: "{npc:mert_kilic} sets his radio down by the fire. Through the static, somebody on the other side of the world is singing. \"Let it play,\" he says. \"It's not data. It's just a song.\"" }
            kosul: { yoldas: "mert_kilic" }
          - metin: { tr: "Ateşin başında yalnızsın. Bunu sen seçtin, ya da dünya senin yerine seçti. Alevin karşısında kimse yok; yalnızca şehir, gemiler ve kafanın içindeki ses.", en: "You're alone at the fire. You chose it, or the world chose it for you. Nobody across the flames. Just the city, the ships, and the voice in your head." }
            kosul: { yoldas_sayisi_max: 0 }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu ateşi hatırlayacağım. ne olursa olsun. bir sonraki seferde de hatırlayacağım. söz.", en: "i'm going to remember this fire. no matter what. next time too. promise." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Bir yıl önceki ilk geceyi anlat", en: "Tell the story of that first night, a year ago" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 6 }, elif_sari: { baglilik: 4 }, aras_kurt: { guven: 4 }, mert_kilic: { guven: 4 } }
            sonraki: "p4_ates_anlat"
          - id: "sor"
            etiket: { tr: "Sor: hasattan sonra ne yapacaksınız?", en: "Ask: what'll you do after the Harvest?" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 }, elif_sari: { guven: 4 } }
              - tohum: { olay: "p4_veda_mektuplari", gecikme: { min: 1, max: 3 } }
            sonraki: "p4_ates_sonra"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} ile konuş; yalnızca onunla", en: "Talk to {npc:yanki}. Just to it" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
            sonraki: "p4_ates_yanki"
          - id: "uyu"
            etiket: { tr: "Ateşe bak ve uyu", en: "Watch the fire and fall asleep" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: 200
            sonraki: "@akis"

      - id: "p4_ates_anlat"
        paragraflar:
          - { tr: "Anlatıyorsun: sisin içinde uyandığın sabahı, ilk canavarı, titreyen ellerini, ilk seviye bildirimini. Kimseye anlatmamıştın; anlattıkça bir yılın ne kadar uzun ve ne kadar kısa olduğunu fark ediyorsun.", en: "You tell it: the morning you woke up in the fog, the first monster, your shaking hands, your first level-up notification. You'd never told anyone. As you go, you realize how long a year is, and how short." }
          - { tr: "Hikâye bittiğinde ateş kömüre dönmüş. Kimse konuşmuyor. Sonra biri, ilk canavarın bir fare olduğunu hatırlayıp gülüyor; ardından herkes gülüyor.", en: "By the time the story's over, the fire's down to coals. Nobody talks. Then somebody laughs, remembering the first monster was a rat, and everybody laughs." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Sen de gül", en: "Laugh too" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"
          - id: "odun"
            etiket: { tr: "Ateşe bir odun daha at", en: "Throw another log on the fire" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - can: 200
            sonraki: "@akis"

      - id: "p4_ates_sonra"
        paragraflar:
          - metin: { tr: "{npc:deniz_arman} uzun süre düşünüyor. \"Bir vapur,\" diyor sonunda. \"Bir vapur alacağım. Karşıya geçip geri döneceğim. Sabahtan akşama. Hiçbir şey olmadan.\"", en: "{npc:deniz_arman} thinks about it a long time. \"A ferry,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}. \"I'm going to get a ferry. Cross over and come back. Morning to night. With nothing happening.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} gülüyor. \"Uyuyacağım. Bir hafta. Sonra bir hastane kuracağım; içinde Sistem penceresi olmayan bir hastane.\"", en: "{npc:elif_sari} laughs. \"Sleep. For a week. Then I'm going to build a hospital. One without a single System window in it.\"" }
            kosul: { yoldas: "elif_sari" }
          - { tr: "Sonra herkes sana dönüyor. Sen ne yapacaksın? Bir yıldır kimse sana bu soruyu sormamıştı ve bir cevabın yok.", en: "Then everyone turns to you. What are you going to do? Nobody's asked you that in a year, and you don't have an answer." }
        secenekler:
          - id: "bilmem"
            etiket: { tr: "\"Bilmiyorum. Ama sizinle.\"", en: "\"I don't know. But with you.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "\"Bu dünyayı ayakta tutacağım.\"", en: "\"Keep this world standing.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
            sonraki: "@akis"

      - id: "p4_ates_yanki"
        paragraflar:
          - { tr: "Ateşin başında, alçak sesle, kafanın içindekiyle konuşuyorsun. Bir yıl önce onun sesini ilk duyduğunda korkmuştun. Şimdi o ses, bu gökyüzünün altında en çok tanıdığın şey.", en: "By the fire, quietly, you talk to the thing in your head. A year ago, the first time you heard its voice, you were scared. Now that voice is the thing you know best under this sky." }
          - { tr: "{npc:yanki} uzun süre dinliyor. sonra: biliyor musun, sen benim ilk ateşimsin. önceki seferlerde kimse benimle ateş başında oturmadı. bunu sana çekirdekte anlatacağım. ya da sonra. bilmiyorum. ilk kez bilmiyorum.", en: "{npc:yanki} listens for a long time. then: you know, you're my first fire. last times, nobody ever sat by a fire with me. i'll tell you about it at the core. or after. i don't know. it's the first time i don't know." }
        secenekler:
          - id: "iyi"
            etiket: { tr: "Bilmemek iyidir", en: "Not knowing is good" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "@akis"
          - id: "onceki"
            etiket: { tr: "Önceki seferler mi?", en: "Last times?" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { korku: 3, saygi: 2 } }
            sonraki: "@akis"
