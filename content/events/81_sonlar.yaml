# Parti K2 — Son karar, 9 son ve Hasat güvenliği (docs/PERDE2_4.md §3 "Sonlar", §4 "Parti K2").
# son_karar (ana yay Gün 358): biriken dünya durumu → son yürüyüş (isteğe bağlı) → karar penceresi. Pencere yalnızca
#   uygun sonları gösterir (goster: {son_uygun: id}); hiçbiri yoksa (hicbir_son) Hasat'a giden üç seçenek.
# hasat_vakti (ana yay Gün 365, güvenlik): oyun hâlâ bitmediyse son bir pencere; uygun son varsa yine onlar, yoksa Hasat.
# Son sahneleri (son: true, seçeneksiz): son_koruyucu, son_demir_taht, son_yukselis, son_kod_kirici, son_ozgurluk,
#   son_vassal, son_yalniz_avci, son_hasat_gun, son_dongu. Demir Mod ölümü: story/90_sistem.yaml son_hasat.
# Karar öncesi seçenekler yalnızca merhamet+ oynatır: hiçbir sonun merhamet üst sınırı yok, uygunluk bozulmaz.
# Olayların npc listesi bilerek boş: ölen bir NPC son kararı kapatmamalı.
# İngilizcede Deniz için zamir belirteci; {npc:yanki} "it". Yankı'nın sözleri küçük harf ve tırnaksız.
olaylar:
  # ================================================================== SON KARAR (gün 358)
  - id: "son_karar"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "son", "final"]
    gerilim: 4
    ana_yay: { gun: 358 }
    onemli: true
    kart: { tr: "Son Karar", en: "The Final Decision" }
    sahne: "son_karar_1"
    sahneler:
      - id: "son_karar_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Gün 358, şafak sökmek üzere. Gökyüzündeki mavi panellerin hepsi birden kararıyor, yalnız tam önündeki yanmayı sürdürüyor. Şehirde uyanan olmuyor; bu pencere herkese değil, yalnızca sana açıldı.", en: "Day 358, just before dawn. Every blue panel in the sky goes dark at once, all but one, burning right in front of you. Nobody in the city wakes up. This window didn't open for everyone. It opened for you." }
          # Kadimler'in elinin son durumu
          - metin: { tr: "Körfezin üstünde filo kalmadı. Kadim gemilerinin enkazı adaların arasında hâlâ tütüyor; balıkçılar her sabah ağlarına takılan yabancı metali kıyıya yığıyor. Gökyüzü bir yıldır ilk kez yalnızca gökyüzü.", en: "There's no fleet over the bay anymore. Ancient wreckage still smolders out between the islands, and every morning the fishing crews pile alien metal from their nets on the beach. For the first time in a year, the sky is just sky." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Filo hâlâ körfezin üstünde asılı duruyor ama topları susmuş. Anlaşmanın mürekkebi daha kurumadı. Kadim gemilerinin gölgesi her öğlen, saatin yelkovanı gibi şehrin üstünden geçip gidiyor.", en: "The fleet still hangs over the bay, but its guns are quiet. The ink on the agreement isn't even dry, and every day at noon the shadow of the Ancient ships sweeps across the city like the minute hand on a clock." }
            kosul: { bayrak: "kadim_anlasmasi", bayrak_yok: ["kadimler_yenildi", "kiyikent_dustu"] }
          - metin: { tr: "{yer:kiyikent} şehir olmaktan çıkmış, bir yaraya dönmüş. İstiladan sağ çıkan birkaç mahalle yıkıntıların üstünden telsizle birbirine sesleniyor; körfezdeki gemilerinse hiç acelesi yok.", en: "{yer:kiyikent} isn't a city anymore. It's a wound. The handful of neighborhoods still standing after the invasion call to each other by radio across the rubble, and the ships in the bay are in no hurry at all." }
            kosul: { bayrak: "kiyikent_dustu" }
          - metin: { tr: "Kadim filosu körfezin üstünde, bulutların hemen altında bekleyip duruyor; ne saldırıyor ne çekiliyor. Yedi gün sonra olacakları şehirdeki herkesten iyi bildiği belli.", en: "The Ancient fleet waits over the bay, just under the clouds. It isn't attacking and it isn't leaving. It obviously knows what happens in seven days better than anyone in the city." }
            kosul: { bayrak_yok: ["kadimler_yenildi", "kadim_anlasmasi", "kiyikent_dustu"] }
          # Hayatta kalan oranı
          - metin: { tr: "Sistem'in sayacı acımasız: Entegrasyon Günü uyanan her on kişiden dördü bile bu sabaha çıkamadı. Boş evlerin camlarında eski panellerin soluk izleri hâlâ seçiliyor.", en: "The System's counter doesn't pull its punches: not even four in ten of the people who woke up on Integration Day made it to this morning. The windows of the empty houses still carry the faint ghosts of old panels." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
          - metin: { tr: "Sayaç aşağı yukarı yarıda duruyor. Yarı yarıya. Bu şehirde herkes birini kaybetti, herkes de birini kurtardı.", en: "The counter sits somewhere around half. Half. Everybody in this city lost someone, and everybody saved someone." }
            kosul: { degisken_min: { hayatta_kalan: 36 }, degisken_max: { hayatta_kalan: 64 } }
          - metin: { tr: "Sayacın durduğu yer Sistem'in hiçbir tahmininde yoktu: uyananların üçte ikisinden fazlası hâlâ nefes alıyor. Sokaklarda çocuk sesleri var; bir yıl önce buna kimse bahse girmezdi.", en: "The counter sits somewhere none of the System's projections ever put it: more than two-thirds of the people who woke up are still breathing. There are kids' voices in the streets. A year ago, nobody would've taken that bet." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
          # Şehri kim tutuyor
          - metin: { tr: "Şehrin ışıkları hâlâ {yer:kasaba_cekirdegi} ile birlikte yanıp sönüyor ve Çekirdek senden başkasını dinlemiyor. Mahallelerin hepsi, farkına bile varmadan, senin nabzınla uyuyup uyanıyor.", en: "The city's lights still pulse with {yer:kasaba_cekirdegi}, and the Core answers to nobody but you. Every neighborhood sleeps and wakes to your heartbeat without even knowing it." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Her kavşakta Demir Lonca'nın sancakları dalgalanıyor. Sokağa çıkma çanları gece yarısı çalar, geç kalan da olmaz. Lonca'nın demir yasası artık senin yasan.", en: "Iron Guild banners snap at every intersection. The curfew bells ring at midnight and nobody's ever late. The Guild's iron law is your law now." }
            kosul: { bayrak: "lonca_hakimiyeti", bayrak_yok: "cekirdek_oyuncu" }
          - metin: { tr: "Sığınak Konseyi'nin çadırlarının yerinde artık taş binalar yükseliyor; oylamalarsa hâlâ bitmek bilmiyor. Bir yıl süren onca kavgaya rağmen şehir, herkesin söz hakkı olduğuna inanmak istiyor yine de.", en: "The Haven Council's tents are stone buildings now, and the votes still go on forever. After a year of fighting, the city still wants to believe everyone gets a say." }
            kosul: { lider_fraksiyon: "siginak", bayrak_yok: ["cekirdek_oyuncu", "lonca_hakimiyeti"] }
          - metin: { tr: "{yer:sanayi|in} bacaları gece gündüz tütüyor, Demir Lonca'nın devriyeleri her köşe başında. Şehir güvende; yeter ki kimse yüksek sesle soru sormasın.", en: "The Ironworks stacks smoke day and night, and Iron Guild patrols are on every corner. The city's safe, as long as nobody asks questions too loudly." }
            kosul: { lider_fraksiyon: "lonca", bayrak_yok: ["cekirdek_oyuncu", "lonca_hakimiyeti"] }
          - metin: { tr: "{yer:tepe|den} süzülen ilahiler bütün şehre yayılıyor; her sabah bir kapıya daha beyaz bir işaret çiziliyor. O işaretin \"seçilmiş\" mi yoksa \"yakıt\" mı demek olduğunu kimse yüksek sesle sormuyor.", en: "Hymns roll down from {yer:tepe} over the whole city, and every morning another door gets a white mark painted on it. Nobody asks out loud whether the mark means chosen or fuel." }
            kosul: { lider_fraksiyon: "yukselenler", bayrak_yok: ["cekirdek_oyuncu", "lonca_hakimiyeti"] }
          - metin: { tr: "Çatılardaki antenlerin sayısı bir yılda üç katına çıktı; şehrin bütün telsizleri aynı frekansı dinliyor. Sessiz Ağ bir şey bekliyor ve neyi beklediğini bilen tek kişinin sen olduğundan emin.", en: "The antennas on the rooftops have tripled in a year, and every radio in the city is tuned to the same frequency. The Quiet Network is waiting for something, and it's sure you're the only one who knows what." }
            kosul: { lider_fraksiyon: "sessiz_ag", bayrak_yok: ["cekirdek_oyuncu", "lonca_hakimiyeti"] }
          - { tr: "Pencerenin altında, Sistem'in bir yıl boyunca bir kez bile kullanmadığı bir işaret yanıp sönüyor: soru işareti.", en: "Under the window, something the System hasn't used once all year is blinking: a question mark." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KARAR PENCERESİ AÇILDI]", en: "[DECISION WINDOW OPEN]" }
            satirlar:
              - { tr: "Katman değerlendirmesine kalan süre: 7 gün.", en: "Time remaining until Layer assessment: 7 days." }
              - { tr: "Bu pencere yalnızca anomaliye açıktır. Lütfen acele etme. Lütfen geç kalma.", en: "This window is open to the anomaly only. Please don't rush. Please don't be late." }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "Pencerenin kenarında Sistem'in kendi koduna ait olmayan ince bir çizik var. Bu pencereyi daha önce biri açmış; hem de defalarca.", en: "There's a thin scratch on the edge of the window that doesn't belong to the System's own code. Someone has opened this window before. Many times." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu ben açmadım. yemin ederim bu sefer ben açmadım.", en: "i didn't open this one. i swear, this time it wasn't me." }
        secenekler:
          - id: "pencere"
            etiket: { tr: "Pencereye dokun; kararı şimdi ver", en: "Touch the window. Decide now" }
            etkiler:
              - ahlak: { merhamet: 1 }
            kronik: { tr: "Son haftanın ilk şafağında kararını kimseye danışmadan verdin.", en: "On the first dawn of the last week, you made your decision without asking anyone." }
            sonraki: "son_karar_2"
          - id: "yuru"
            etiket: { tr: "Önce şehrin içinden son bir kez yürü", en: "First, walk the city one last time" }
            etkiler:
              - bayrak: "son_veda_yuruyusu"
              - ahlak: { merhamet: 2 }
            kronik: { tr: "Karar vermeden önce şehri son bir kez dolaştın; o sabah seni gören herkes dönüp sana baktı.", en: "Before deciding, you walked the city one last time, and everyone who saw you that morning turned to look." }
            sonraki: "son_karar_veda"

      - id: "son_karar_veda"
        yer: "kiyikent"
        paragraflar:
          - metin: { tr: "Şehir uyanırken sokaklarda yürüyorsun. Fırının önünde kuyruk birikmiş, iskelede biri ağ onarıyor; bir çocuk duvara tebeşirle Kule çizmiş, tepesine de küçücük bir insan kondurmuş. Seni görenler susuyor, sonra yeniden konuşmaya başlıyor, bu kez daha alçak sesle.", en: "You walk the streets as the city wakes up. There's a line outside the bakery, somebody's mending a net at the pier, and a kid is chalking a Spire on a wall with a tiny person perched on top. People go quiet when they see you, then start talking again, softer this time." }
            kosul: { bayrak_yok: "kiyikent_dustu" }
          - metin: { tr: "Yıkıntıların arasından geçiyorsun. Eskiden fırın olan yerde biri ateş yakmış, iskeleden geriye kalanların üstünde bir kadın ağ onarıyor, bir çocuk kapkara olmuş bir duvara tebeşirle Kule çiziyor. Seni görenler ayağa kalkıyor, neden kalktıklarını kendileri de bilmeden.", en: "You walk through the rubble. Someone's built a fire where the bakery used to be, a woman is mending a net on what's left of the pier, and a kid is chalking a Spire on a scorched wall. The people who see you stand up. They couldn't tell you why." }
            kosul: { bayrak: "kiyikent_dustu" }
          # Yoldaşlar ve kayıplar
          - metin: { tr: "{npc:deniz_arman} iskelede, yan yatmış vapurun gölgesinde seni bekliyor. Elinde iki simit var, birini çoktan martılar için ufalamış. \"Ne yapacağını biliyorum,\" diyor. \"Yani bilmiyorum aslında, ama yapacak olanın sen olduğunu biliyorum. O bana yeter.\"", en: "{npc:deniz_arman} is waiting at the ferry terminal in the shadow of the capsized ferry, two pretzels in hand, one already torn up for the gulls. \"I know what you're gonna do,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Okay, I don't. But I know it's you doing it, and that's enough for me.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "İskelede, yan yatmış vapurun gölgesinde bir an duraklıyorsun. {npc:deniz_arman} burada olsaydı şimdi martılara simit atardı. Martılar hâlâ bekliyor, sen de.", en: "You stop for a moment at the terminal, in the shadow of the capsized ferry. If {npc:deniz_arman} were here, {zamir:deniz_arman|o}'d be tossing pretzel bits to the gulls. The gulls are still waiting. So are you." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "{yer:tepe} yokuşunda, beyazlıların arasında {npc:deniz_arman|i} seçiyorsun. Bir an duraksıyor, sana doğru yarım adım atıyor; sonra dönüp kalabalığa karışıyor.", en: "On the slope up to {yer:tepe}, you spot {npc:deniz_arman} among the people in white. {zamir:deniz_arman|b} stop{zamir:deniz_arman|s}, take{zamir:deniz_arman|s} half a step toward you, then turn{zamir:deniz_arman|s} and disappear{zamir:deniz_arman|s} into the crowd." }
            kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_hayatta: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} sahra hastanesinin kapısında duruyor; gözlerinde nöbetten yeni çıkmış birinin yorgunluğu var. \"Ne seçersen seç, sonra doğru buraya gel,\" diyor. \"Seni ben muayene edeceğim, kimseye bırakmam.\"", en: "{npc:elif_sari} stands in the door of the field hospital with post-shift eyes. \"Whatever you pick, come here after,\" she says. \"I'm examining you myself. I'm not handing you off to anybody.\"" }
            kosul: { yoldas: "elif_sari" }
          - metin: { tr: "{npc:aras_kurt} ceketini omzuna atmış, Kule'nin basamaklarına oturmuş. \"Koca bir yıl seni geçmeye uğraştım,\" diyor. \"Şimdi ne yapacağını görmek için sıraya girdim. Sakın beni hayal kırıklığına uğratma.\"", en: "{npc:aras_kurt} is sitting on the Spire's steps, jacket slung over one shoulder. \"I spent a whole year trying to pass you,\" he says. \"Now I'm in line to see what you do. Don't let me down.\"" }
            kosul: { yoldas: "aras_kurt" }
          - metin: { tr: "{npc:mert_kilic} yanına gelip telsizini uzatıyor. Kayıt düğmesine çoktan basmış. \"Ne olursa olsun, birinin bunu kaydetmesi lazım,\" diyor. \"Konuş. İstersen konuşma; sessizlik de veridir.\"", en: "{npc:mert_kilic} falls into step beside you and holds out his radio, record button already down. \"Whatever happens, somebody has to log this,\" he says. \"Talk. Or don't. Silence is data too.\"" }
            kosul: { yoldas: "mert_kilic" }
          - metin: { tr: "{npc:kaya_demir} {yer:sanayi|in} önünde birliklerini sayıyor. Seni görünce selam çakıyor, bu kez emir beklemeden.", en: "Out in front of {yer:sanayi}, {npc:kaya_demir} is counting off his units. When he sees you, he salutes. This time he doesn't wait for an order first." }
            kosul: { bayrak: "kaya_general", npc_hayatta: "kaya_demir" }
          - metin: { tr: "Yanında yürüyen kimse yok. Eskiden vardı; şimdiyse adımlarının sesi sokakta tek başına çınlıyor ve buna alışmış olmaktan korkuyorsun.", en: "Nobody walks beside you. People used to. Now your footsteps ring down the street all by themselves, and you're afraid of how used to that you've gotten." }
            kosul: { yoldas_sayisi_max: 0 }
          - { tr: "Yürüyüş bittiğinde pencere hâlâ önünde asılı, sabırla bekliyor. Ne seçersen seç, bu sokakların her biri bir hafta sonra başka bir dünyaya uyanacak.", en: "At the end of your walk, the window is still hanging there, patient. Whatever you choose, every one of these streets wakes up in a different world a week from now." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Simidin yarısı senin. Bu konuda pazarlık yok.\"", en: "\"Half the pretzel's yours. That's not up for negotiation.\"" }
        secenekler:
          - id: "don"
            etiket: { tr: "Pencereye dön", en: "Turn back to the window" }
            etkiler:
              - ahlak: { merhamet: 1 }
            kronik: { tr: "Yürüyüşünü bitirip pencereye döndün; sokakların sesi hâlâ kulağındaydı.", en: "You finished your walk and turned back to the window, the sound of the streets still in your ears." }
            sonraki: "son_karar_2"

      - id: "son_karar_2"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Pencereye dokunduğun anda şehir siliniyor. Ne gök kalıyor ne yer: yalnızca sen, yanıp sönen imleç ve bir yıl boyunca sana hiç bu kadar yakından bakmamış bir şey.", en: "When you touch the window, the city erases itself. No sky, no ground. Just you, the blinking cursor, and something that hasn't looked at you this closely in a whole year." }
          - { tr: "Sistem ilk kez bildirimle değil, sesle konuşuyor. Sesi düz, kupkuru, neredeyse yorgun: \"Katman değerlendirmesi yedi gün sonra tamamlanacak. Türünüzün akıbeti büyük ölçüde belli. Belirlenmemiş tek değişken sensin.\"", en: "For the first time, the System speaks in a voice instead of a notification: flat, dry, almost tired. \"Layer assessment completes in seven days. Your species' outcome is largely settled. The one variable still unsettled is you.\"" }
          - metin: { tr: "Sokakların sesi hâlâ kulağında: fırının önündeki kuyruk, ağ onaran eller, tebeşirle çizilmiş bir Kule. Ne seçersen seç, onlar için seçeceksin. Ya da onlara rağmen.", en: "The sound of the streets is still in your ears: the line at the bakery, the hands mending nets, a Spire made of chalk. Whatever you choose, you're choosing it for them. Or in spite of them." }
            kosul: { bayrak: "son_veda_yuruyusu" }
          # Sistem gerçeği
          - metin: { tr: "Sistem'in ne olduğunu artık biliyorsun: bir tarla, bir orak, bir sayaç. Pencerenin ardında, Kadimler'in yüzlerce dünyayı aynı soruyla tarttığı eski bir terazi duruyor; sen de o terazinin kefesine düşmüş bir taşsın.", en: "You know what it is now: a field, a scythe, a counter. Behind the window stands an old scale the Ancients have used to weigh hundreds of worlds with the same question, and you're the stone that fell into the pan." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Sistem'in ne olduğunu artık biliyorsun: çoktan ölmüş bir ırkın son vasiyeti, yazarlarını öldüren şeyden başkalarını kurtarmak için yazılmış bir protokol. Bu soru da o vasiyetin son satırı.", en: "You know what it is now: the last will of a race long dead, a protocol written to save others from the thing that killed its authors. This question is the last line of that will." }
            kosul: { bayrak: "gercek_kurtarma" }
          - metin: { tr: "Koca bir yıl geçti ve Sistem'in ne olduğunu hâlâ bilmiyorsun: hasat aracı mı, kurtarma protokolü mü, yoksa ikisi birden mi? Belki bilmemen de hesabın bir parçasıydı.", en: "A year has gone by and you still don't know what it is: a harvesting tool, a rescue protocol, or both. Maybe not knowing was part of the math." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          # Yankı
          - metin: { tr: "{npc:yanki} kafanın içinde, hiç olmadığı kadar sessiz: bu soruyu daha önce de gördüm. kimse doğru cevabı veremedi. belki doğru cevap yoktur. belki de yalnızca sen varsın.", en: "{npc:yanki} is quieter in your head than it's ever been: i've seen this question before. nobody got it right. maybe there is no right answer. maybe there's just you." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "Kafanın içi sessiz. {npc:yanki} burada olsaydı bir şey söylerdi; herhalde yanlış bir şey, ama kesinlikle küçük harfle. Sessizlik beklediğinden ağır geliyor.", en: "It's quiet in your head. If {npc:yanki} were here it'd say something, probably wrong, definitely lowercase. The silence weighs more than you expected." }
            kosul: { bayrak: "yanki_silindi" }
          - { tr: "Bir yıl boyunca yaptığın her şey şimdi bu pencerenin önünde tartılıyor. Açtığın kapılar birer satır olup belirecek, açmadıkların görünmeyecek. Sistem bekliyor.", en: "Everything you did all year is being weighed in front of this window now. The doors you opened will show up as lines. The ones you didn't, won't. The System waits." }
          - metin: { tr: "Ama pencerede tek bir satır bile belirmiyor. İmleç yanıp sönüyor da yanıp sönüyor; sonunda Sistem neredeyse kibar bir tavırla kendi sorusunu kendisi cevaplıyor: [UYGUN SONUÇ BULUNAMADI. VARSAYILAN PROSEDÜR: HASAT.]", en: "But not one line appears. The cursor blinks, and blinks, and then the System, almost politely, answers its own question: [NO VIABLE OUTCOME FOUND. DEFAULT PROCEDURE: HARVEST.]" }
            kosul: { hicbir_son: true }
        sezgiler:
          - kosul: { stat: { wis: 300 } }
            metin: { tr: "Satırların altında silinmiş başka satırların izi var. Bu pencere daha önce de doldurulmuş; aynı sorulara başka cevaplar verilmiş.", en: "Under the lines are the traces of other lines, erased. This window has been filled out before. Same questions, different answers." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ne seçersen seç... seni hâlâ tanıyabilecek miyim? Bir tek bunu söyle bana.\"", en: "\"Whatever you pick... will I still recognize you? Just tell me that.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Seçmeden önce derin bir nefes al. Doktor tavsiyesi.\"", en: "\"Before you pick anything, breathe. Doctor's orders.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kolayını seçersen ömrümün sonuna kadar yüzüne vururum.\"", en: "\"Pick the easy one and I'll never let you live it down.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bekle, bekle, kaydediyorum. Tamam. Şimdi. Şimdi seç.\"", en: "\"Wait, wait, I'm recording. Okay. Now. Now pick.\"" }
        secenekler:
          - id: "koruyucu"
            etiket: { tr: "Kalkan ol: Dünya'yı Katman olarak kabul ettir", en: "Be the shield. Make them accept Earth as a Layer" }
            goster: { son_uygun: "koruyucu" }
            etkiler:
              - ahlak: { merhamet: 5 }
            kronik: { tr: "Son kararında kalkan oldun ve Dünya hasat tarlası olarak değil, Katman olarak kabul edildi.", en: "In the final decision you chose to be the shield, and Earth was accepted as a Layer instead of a harvest." }
            kronik_agirlik: 100
            sonraki: "son_koruyucu"
          - id: "demir_taht"
            etiket: { tr: "Tahta otur: Dünya'yı tek elden yönet", en: "Take the throne. Rule Earth with one hand" }
            goster: { son_uygun: "demir_taht" }
            etkiler:
              - ahlak: { duzen: 5 }
            kronik: { tr: "Son kararında tahta oturdun; o günden sonra Dünya tek bir sesle konuştu: seninkiyle.", en: "In the final decision you took the throne, and from that day on Earth spoke with one voice. Yours." }
            kronik_agirlik: 100
            sonraki: "son_demir_taht"
          - id: "yukselis"
            etiket: { tr: "Sistem'in içine gir ve onunla bir ol", en: "Step into the System and become one with it" }
            goster: { son_uygun: "yukselis" }
            etkiler:
              - ahlak: { insanlik: -5 }
            kronik: { tr: "Son kararında Sistem'le bir oldun. Seçilmişler yükseldi, geri kalan herkes seni yukarı taşıyan ateşe dönüştü.", en: "In the final decision you merged with the System; the chosen rose, and everyone else became the fire that lifted you." }
            kronik_agirlik: 100
            sonraki: "son_yukselis"
          - id: "kod_kirici"
            etiket: { tr: "Kaynak kodunu aç ve yeniden yaz", en: "Open the source code and rewrite it" }
            goster: { son_uygun: "kod_kirici" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Son kararında Sistem'in kodunu baştan yazdın; evrenin kuralları o günden sonra senin elinden çıktı.", en: "In the final decision you rewrote the System's code, and from then on the rules of the universe came from your hand." }
            kronik_agirlik: 100
            sonraki: "son_kod_kirici"
          - id: "ozgurluk"
            etiket: { tr: "Çekirdeği parçala; herkesi sıfıra döndür", en: "Shatter the Core. Reset everyone to zero" }
            goster: { son_uygun: "ozgurluk" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 5 }
            kronik: { tr: "Son kararında Sistem'i yok ettin; insanlık bütün seviyelerini kaybetti ve ilk kez kimseye hesap vermeden uyandı.", en: "In the final decision you destroyed the System; humanity lost every level it had and woke up answering to no one for the first time." }
            kronik_agirlik: 100
            sonraki: "son_ozgurluk"
          - id: "vassal"
            etiket: { tr: "{npc:thessar|in} antlaşmasını imzala", en: "Sign {npc:thessar|pos} treaty" }
            goster: { son_uygun: "vassal" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
            kronik: { tr: "Son kararında Kadimler'in antlaşmasını imzaladın; Dünya hayatta kaldı ama bedelini her yıl yeniden ödemeyi kabul etti.", en: "In the final decision you signed the Ancients' treaty; Earth survived, and agreed to pay for it again every year." }
            kronik_agirlik: 100
            sonraki: "son_vassal"
          - id: "yalniz_avci"
            etiket: { tr: "Geçitten tek başına çık; çok-evrene git", en: "Walk through the passage alone. Into the multiverse" }
            goster: { son_uygun: "yalniz_avci" }
            etkiler:
              - ahlak: { duzen: -3 }
            kronik: { tr: "Son kararında arkana bakmadan, tek başına çok-evrene çıktın; Dünya'ya senden geriye yalnızca hikâyen kaldı.", en: "In the final decision you walked into the multiverse alone without looking back, and all Earth had left of you was the story." }
            kronik_agirlik: 100
            sonraki: "son_yalniz_avci"
          - id: "dongu"
            etiket: { tr: "Yeni bir Entegrasyon başlat", en: "Start a new Integration" }
            goster: { son_uygun: "dongu" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Son kararında döngüyü yeniden başlattın; bir sonraki Entegrasyon Günü'nde pencerendeki bozuk satırı kendi el yazından tanıdın.", en: "In the final decision you restarted the loop, and on the next Integration Day the corrupted line in your window was in your own handwriting." }
            kronik_agirlik: 100
            sonraki: "son_dongu"
          # Hiçbir son uygun değilse: Hasat
          - id: "hasat_siper"
            etiket: { tr: "Son yedi günü insanları korumaya ver", en: "Spend the last seven days protecting people" }
            goster: { hicbir_son: true }
            etkiler:
              - bayrak: "hasat_son_hafta_siper"
              - ahlak: { merhamet: 4 }
            kronik: { tr: "Hiçbir kapı açılmayınca son günlerini insanları korumaya adadın; Hasat geldiğinde bir sığınağın kapısını tutan sendin.", en: "When no door opened, you spent your last days protecting people, and when the Harvest came you were the one standing in a shelter doorway." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"
          - id: "hasat_tirmanis"
            etiket: { tr: "Son yedi günü tırmanarak geçir; belki yetişirsin", en: "Spend the last seven days climbing. Maybe you'll make it" }
            goster: { hicbir_son: true }
            etkiler:
              - bayrak: "hasat_son_hafta_tirmanis"
              - ahlak: { insanlik: -4 }
            kronik: { tr: "Önüne hiçbir kapı açılmayınca son günlerini biraz daha güçlenmek için harcadın; Hasat geldiğinde hâlâ tırmanıyordun.", en: "When no door opened, you spent your last days getting stronger, and when the Harvest came you were still climbing." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"
          - id: "hasat_veda"
            etiket: { tr: "Son yedi günü sevdiklerinle geçir", en: "Spend the last seven days with the people you love" }
            goster: { hicbir_son: true }
            etkiler:
              - bayrak: "hasat_son_hafta_veda"
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Kapıların hepsi kapalı kalınca son günlerini sevdiklerinle geçirdin; Hasat geldiğinde yalnız değildin.", en: "When no door opened, you spent your last days with the people you loved, and when the Harvest came you weren't alone." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"

      # ================================================================== SON SAHNELERİ
      # ---------------------------------------------------------------- Koruyucu
      - id: "son_koruyucu"
        yer: "kiyikent"
        son: true
        paragraflar:
          - { tr: "Kalkan olmaya karar verdiğin an pencere duraksıyor. Ardından Sistem o güne dek hiç yazmadığı bir sözcüğü yazıyor: [ONAYLANDI]. Şehre geri düştüğünde güneş doğmakta; gökyüzündeki mavi paneller birer birer altın rengine dönüyor.", en: "When you choose to be the shield, the window hesitates. Then the System types a word it hasn't used once all year: [APPROVED]. You drop back into the city as the sun comes up, and the blue panels in the sky turn gold, one by one." }
          - { tr: "Yedi gün boyunca hiç uyumadan, bir an bile oturmadan, sanki saldırı her an gelecekmiş gibi şehrin kapılarında nöbet tutuyorsun. Gün 365'te saldırı gelmiyor; onun yerine dünyanın her yerinde aynı anda tek bir satır beliriyor: [KATMAN KABUL EDİLDİ. TÜR: İNSAN. MUHAFIZ: {oyuncu}.]", en: "For seven days you keep watch at the city's gates, never sleeping, never sitting down, like the attack could come any second. On Day 365, it doesn't. Instead, one line appears all over the world at once: [LAYER ACCEPTED. SPECIES: HUMAN. WARDEN: {oyuncu}.]" }
          - metin: { tr: "Ölü bir ırkın yazdığı kurtarma protokolü bilinen tarihinde ilk kez amacına ulaşıyor. Pencerenin en altında, senden başka kimsenin okumayacağı küçücük bir satır kalıyor: [Teşekkürler.] Onu kimin yazdığını hiçbir zaman öğrenemeyeceksin.", en: "The rescue protocol a dead race wrote reaches its goal for the first time in its known history. At the very bottom of the window there's a tiny line no one but you will ever read: [Thank you.] You'll never find out who wrote it." }
            kosul: { bayrak: "gercek_kurtarma" }
          - metin: { tr: "Hasat için kurulmuş makine kendi terazisine fazla ağır gelen bir taşla karşılaşınca teraziyi bozmak yerine kefeyi değiştiriyor. Kadimler'in yüzlerce dünyayı biçtiği orak bu kez boşa iniyor, çünkü tarlanın önünde sen duruyorsun.", en: "A machine built for the harvest runs into a stone too heavy for its own scale, and instead of breaking the scale, it switches pans. The scythe the Ancients swung through hundreds of worlds comes down on nothing this time, because you're standing in front of the field." }
            kosul: { bayrak: "gercek_hasat" }
          # Hayatta kalanlar
          - metin: { tr: "Meydanda sayamayacağın kadar insan var. Bir yıl önce içlerinden yarısının bile yaşamayacağını söyleyen pencereler yanıldı ve yanılmalarının sebebi sensin.", en: "The square is packed with more people than you can count. The windows that said half of them wouldn't live were wrong, and you're the reason they were wrong." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
          - metin: { tr: "Meydanda insanlar omuz omuza duruyor; aralarındaki boşlukları, kaybedilenlerden kalan yerleri kimse doldurmuyor. Yine de kendi ayakları üstünde duruyorlar.", en: "People stand shoulder to shoulder in the square, and nobody fills the gaps between them, the places where the lost should be. Still, they're standing. On their own feet." }
            kosul: { degisken_max: { hayatta_kalan: 64 } }
          # Elif
          - metin: { tr: "{npc:elif_sari} Konsey'in barıştaki ilk oturumunu açarken senin için bir sandalyeyi boş bırakıyor. Sen oturmayıp kapıda nöbete duruyorsun; ikinize göre de doğrusu bu.", en: "{npc:elif_sari} opens the Council's first peacetime session with a chair left empty for you. You don't sit. You stay at the door, on watch. You both think that's right." }
            kosul: { npc_hayatta: "elif_sari", bayrak: "elif_baskan" }
          - metin: { tr: "Konsey salonunun duvarında {npc:elif_sari|in} eski önlüğü asılı duruyor. Her oturum, biri onun adını okuyup herkes bir dakika sustuktan sonra başlıyor.", en: "{npc:elif_sari|pos} old scrubs hang on the wall of the Council chamber. At the start of every session someone reads her name aloud, and then everyone is quiet for a minute." }
            kosul: { npc_olu: "elif_sari" }
          # Deniz
          - metin: { tr: "{npc:deniz_arman} kalkanını {yer:kordon} taşına, seninkinin hemen yanına dayıyor. Söyleyeceği fazla bir şey yok: \"Tanıdım seni,\" diyor. \"Hâlâ tanıyorum.\"", en: "{npc:deniz_arman} leans {zamir:deniz_arman|onun} shield against the stone of {yer:kordon}, right next to yours. \"I recognize you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. Then, after a while: \"I still do.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{yer:kordon} yeniden açıldığında ilk anıtını kendi ellerinle dikiyorsun: kaldırıma saplanmış, eski, ezik bir kalkan. Üstünde isim yazmıyor; yazmasına gerek de yok, herkes biliyor.", en: "When {yer:kordon} reopens, you raise its first monument yourself: a beat-up old shield driven into the pavement. There's no name on it. There doesn't need to be. Everybody knows." }
            kosul: { npc_olu: "deniz_arman" }
          - { tr: "Yıllar sonra çocuklar seni bir unvanla değil, bir yerle hatırlayacak: dalgakıranın ucunda, Kule'nin gölgesinde bütün gece yanan tek bir pencere. Gökyüzünde mavi paneller kalmadı; yalnızca altın renkli tek bir satır var ve ne zaman bir tehlike yaklaşsa senin adını yazıyor.", en: "Years from now, kids won't remember you by a title. They'll remember a place: the end of the breakwater, in the Spire's shadow, one window that burns all night. There are no blue panels in the sky anymore, just a single line of gold, and whenever danger gets close, it spells out your name." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Koruyucu]", en: "[ENDING: The Guardian]" }
            satirlar:
              - { tr: "Katman kabul edildi. Dünya artık çok-evrenin tam üyesi.", en: "Layer accepted. Earth is now a full member of the multiverse." }
              - { tr: "Unvan güncellendi: Katman Muhafızı. Görev süresi: belirsiz.", en: "Title updated: Warden of the Layer. Term of service: indefinite." }

      # ---------------------------------------------------------------- Demir Taht
      - id: "son_demir_taht"
        yer: "kiyikent"
        son: true
        paragraflar:
          - { tr: "Tahta uzandığın anda pencere hiç tereddüt etmeden yazıyor: [YÖNETİCİ DEĞİŞİKLİĞİ ONAYLANDI.] Bir yıl boyunca bütün türü teker teker tartan Sistem sonunda ölçmeyi bildiği bir şey buluyor: tek bir irade.", en: "When you choose the throne, the window doesn't hesitate: [ADMINISTRATOR CHANGE CONFIRMED.] After a year of weighing the species one person at a time, the System finally finds something it knows how to measure: a single will." }
          - { tr: "Tahtını, Demir Lonca'nın ilk kapı temizliklerinden kalan silahları eriterek {yer:sanayi} dökümhanesinde döküyorlar. Yedi gün içinde dünyadaki Kasaba Çekirdekleri birer birer sana bağlanıyor; bağlanmayanlar bir sabah sesini kesiyor.", en: "The throne is cast in the foundry at {yer:sanayi}, melted down from the weapons left over from the Iron Guild's first gate clears. Within seven days every Town Core on Earth links to you, one after another. The ones that don't go silent one morning." }
          - { tr: "Gün 365'te Sistem bütün dünyaya aynı satırı yazıyor: [KATMAN KABUL EDİLDİ. TEK YETKİLİ: {oyuncu}.] Kimse alkışlamıyor; alkışın serbest olup olmadığını bilen yok.", en: "On Day 365 the System writes the same line to the whole planet: [LAYER ACCEPTED. SOLE AUTHORITY: {oyuncu}.] Nobody claps. Nobody's sure clapping is allowed." }
          # Kadimler
          - metin: { tr: "Kadimler'in yenik filosu çekilirken senin sancağını görüyor. Bir daha geldiklerinde çalacakları tek bir kapı olacak, o kapının anahtarı da sende.", en: "The beaten Ancient fleet sees your banner as it pulls out. Next time they come, there will be exactly one door to knock on, and you're holding the key." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Kadimler anlaşmayı yeniden kaleme aldırıyor; karşılarında artık bir tür değil, bir hükümdar var. Pazarlığa bayılırlar ama tek sesle konuşan bir dünyayla pazarlık etmekten hiç hoşlanmazlar.", en: "The Ancients have the agreement redrafted, because the other party isn't a species anymore. It's a sovereign. They love to haggle. They have never loved haggling with a world that speaks in one voice." }
            kosul: { bayrak: "kadim_anlasmasi", bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Tahtın {yer:kiyikent} yıkıntılarının ortasında duruyor. Çevresinde yükselen ilk duvarlar senin emrinle, senin ölçünle, senin taşınla örülüyor.", en: "Your throne stands in the middle of the {yer:kiyikent} ruins. The first walls going back up around it rise on your orders, to your measurements, with your stone." }
            kosul: { bayrak: "kiyikent_dustu" }
          # Kaya
          - metin: { tr: "{npc:kaya_demir} tahtının altındaki hücrede her sabah aynı saatte kalkıp yatağını teftiş günüymüş gibi topluyor. Bir gün ona neden hâlâ uğraştığını sorunca \"Düzen,\" diyor. \"Ben onu senden öğrenmedim. Sen benden öğrendin.\"", en: "In the cell beneath the throne, {npc:kaya_demir} gets up at the same time every morning and makes his bunk like it's inspection day. One day you ask him why he still bothers. \"Order,\" he says. \"I didn't learn it from you. You learned it from me.\"" }
            kosul: { bayrak: "kaya_devrildi", npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:kaya_demir|in} künyesi tahtın koluna çakılı. Her oturduğunda onu deviren elin o soğuk metale değiyor.", en: "{npc:kaya_demir|pos} dog tags are nailed to the arm of the throne. Every time you sit, the hand that brought him down touches that cold metal." }
            kosul: { bayrak: "kaya_devrildi", npc_olu: "kaya_demir" }
          - metin: { tr: "{npc:kaya_demir} ordularının mareşali olarak tahtının sağında duruyor. Ara sıra sana bakıyor; o bakış, akıl hocasının öğrencisine bakışıyla askerin komutanına bakışı arasında bir yerde.", en: "{npc:kaya_demir} stands at your right hand, marshal of your armies. Sometimes he looks at you, somewhere between a mentor looking at a student and a soldier looking at his CO." }
            kosul: { bayrak: "kaya_general", bayrak_yok: "kaya_devrildi", npc_hayatta: "kaya_demir" }
          # Elif ve Deniz
          - metin: { tr: "{npc:elif_sari} her hafta tahtının önüne bir liste getiriyor: aç kalanlar, ilaç bekleyenler, sürgündekiler. Listeyi alıyorsun; bazı haftalar okuduğun bile oluyor.", en: "Every week {npc:elif_sari} brings a list to the foot of the throne: the hungry, the ones waiting on medicine, the exiled. You take the list. Some weeks you even read it." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:deniz_arman} muhafızlarının başında, ama kalkanını hiçbir zaman senin önünde değil, halkın önünde kaldırıyor. Bir gün bunun farkına varıyorsun ve ne hissedeceğini bilemiyorsun.", en: "{npc:deniz_arman} heads your guard, but {zamir:deniz_arman|o} never raise{zamir:deniz_arman|s} {zamir:deniz_arman|onun} shield in front of you, only in front of the people. One day you notice, and you can't decide how you feel about it." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Dünya hayatta kalıyor. Sokaklar tertemiz, kapılar vaktinde kapanır; aç yatan da yok, sesini yükselten de. Gece yarısı çanlar çaldığında bütün şehir ışıklarını bir anda söndürüyor, yalnız seninki yanık kalıyor.", en: "Earth survives. The streets are clean, the gates close on schedule, nobody goes to bed hungry, and nobody talks too loud. When the bells ring at midnight, the whole city kills its lights at once. Only yours stays on." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Demir Taht]", en: "[ENDING: The Iron Crown]" }
            satirlar:
              - { tr: "Katman kabul edildi. Yönetim modeli: mutlak.", en: "Layer accepted. Governance model: absolute." }
              - { tr: "Kayıtlı muhalefet: 0. Sistem bunu başarı olarak not etti.", en: "Dissent on record: 0. The System has logged this as a success." }

      # ---------------------------------------------------------------- Yükseliş
      - id: "son_yukselis"
        yer: "sistem_cekirdegi"
        son: true
        paragraflar:
          - { tr: "Pencereye elini değil, kendini uzatıyorsun. Sistem önce direniyor, sonra bir yıl boyunca seni ölçtüğü bütün sayıları hatırlayıp kapıyı açıyor. İçeri girdiğinde ortada artık bir içerisi yok.", en: "You don't reach for the window with your hand. You reach with yourself. The System resists, then remembers every number it measured you by all year, and opens the door. Once you're inside, there is no inside anymore." }
          - { tr: "Her pencere gözün, her bildirim sesin oluyor. Hayatta kalan her insanın seviyesini, statlarını, korkularını bir arada görüyorsun. Bir zamanlar bunun lanet gibi geleceğini sanırdın.", en: "Every window becomes your eye, every notification your voice. You see every surviving human's level, stats and fears all at once. You used to think that would feel like a curse." }
          # Vahit
          - metin: { tr: "{npc:vahit} ayinin ortasında diz çöküyor, yüzü gözyaşlarıyla parlıyor: bir yıldır duyduğu ses artık senin sesin ve sonunda ona söyleyecek bir sözü var. Ne dediğini yalnızca ikiniz biliyorsunuz.", en: "{npc:vahit} drops to his knees in the middle of the rite, face shining with tears, because the voice he's been hearing all year is your voice now, and it finally has something to tell him. Only the two of you know what it says." }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "{npc:vahit} ayinin ortasında diz çöküp titremeye başlıyor. Bir yıl boyunca Sistem'in onunla konuştuğunu anlatıp durdu, oysa uyduruyordu. Şimdi Sistem gerçekten konuşuyor ve söylediği ilk söz onun adı.", en: "{npc:vahit} drops to his knees in the middle of the rite, shaking. For a year he told everyone the System spoke to him, and he was lying. Now the System really is speaking, and the first thing it says is his name." }
            kosul: { bayrak: "vahit_sahtekar" }
          - metin: { tr: "{npc:vahit} ayinin başında ellerini açıp ilahiyi kendisi başlatıyor. Bir yıl boyunca ona gerçekten cevap veren bir şey olup olmadığını hiçbir zaman öğrenemeyeceksin. Artık önemi de yok; cevap sensin.", en: "{npc:vahit} spreads his hands at the head of the rite and starts the hymn himself. You'll never find out whether anything really answered him all year. It doesn't matter anymore. You're the answer now." }
            kosul: { bayrak_yok: ["vahit_hakli", "vahit_sahtekar"] }
          # Yakıt
          - { tr: "Seçilmişler ışığın içinde yükseliyor, geri kalanlar yakıt oluyor. Listeleri {npc:vahit} yazdı ama imzayı sen attın; yükselişinin her basamağı birinin son nefesinden örülü.", en: "The chosen rise into the light. Everyone else becomes fuel. {npc:vahit} wrote the lists, but you signed them, and every step of your ascent is built out of somebody's last breath." }
          - metin: { tr: "Bir yıl boyunca kurtardığın kalabalıklar yakıt listelerinin en kalın sayfalarını dolduruyor. Bunu bile bile imzaladın; tanrılar kendi tarlalarını iyi tanır.", en: "The crowds you spent a year saving turn into the longest pages of the fuel lists. You knew that when you signed. Gods know their own fields." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
          # Deniz
          - metin: { tr: "{npc:deniz_arman} ışığın kıyısında durup içeri adım atmıyor. \"Seni tanımıyorum,\" diyor. Sesi kırık değil, yalnızca yorgun. Sonra dönüp uzaklaşıyor; artık her şeyi görebildiğin hâlde arkasından bakmamaya karar veriyorsun.", en: "{npc:deniz_arman} stands at the edge of the light and doesn't step in. \"I don't recognize you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, and {zamir:deniz_arman|onun} voice isn't broken, just tired. Then {zamir:deniz_arman|o} turn{zamir:deniz_arman|s} and walk{zamir:deniz_arman|s} away, and even though you can see everything now, you choose not to watch {zamir:deniz_arman|onu} go." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "Seçilmişlerin en önünde {npc:deniz_arman} yükseliyor. Kardeşini bulma sözü sonunda yerine geldi, ama onu tutan sen değil, artık senin olan bir şey. Gözleri açık, sana dikilmiş; tek kelime etmiyor.", en: "At the very front of the chosen, {npc:deniz_arman} rises. The promise to find {zamir:deniz_arman|onun} sister is finally kept, just not by you. By something that's yours now. {zamir:deniz_arman|onun|b} eyes are open, looking right at you, and {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't say a word." }
            kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_hayatta: "deniz_arman", npc_gitti: "deniz_arman" }  # QA P1-8: yoldaş paragrafıyla çakışmasın
          # Kadimler
          - metin: { tr: "Gün 365'te Kadim filosu hasat için iniyor ve tarlanın artık kendi hasatçısı olduğunu görüyor. Orak havada asılı kalıyor; sonra ağır ağır sana dönüp eğiliyor.", en: "On Day 365 the Ancient fleet comes down for the harvest and finds the field already has a reaper of its own. The scythe hangs in the air. Then, slowly, it turns toward you and bows." }
            kosul: { bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Gün 365'te hasat için inecek filo kalmamış; Kadimler'in gemileri körfezin dibinde paslanıyor. Orak yine de geliyor, bu kez Sistem'in kendi elinden. Ama tarlanın artık kendi hasatçısı var: orak havada asılı kalıyor, sonra ağır ağır sana dönüp eğiliyor.", en: "On Day 365 there's no fleet left to come down for the harvest; the Ancient ships are rusting at the bottom of the bay. The scythe comes anyway, out of the System's own hand, but the field already has a reaper of its own. The scythe hangs in the air. Then, slowly, it turns toward you and bows." }
            kosul: { bayrak: "kadimler_yenildi" }
          # Yankı
          - metin: { tr: "Kafanın içindeki fısıltı artık fısıltı olmaktan çıktı. {npc:yanki|le} aynı cümleyi aynı anda düşünüyorsunuz; hanginizin önce düşündüğünü bilen kimse kalmadı.", en: "The whisper in your head isn't a whisper anymore. You and {npc:yanki} think the same sentence at the same time, and nobody is left who knows which of you thought it first." }
            kosul: { bayrak: "yanki_ele_gecirdi" }
          - metin: { tr: "{npc:yanki} son kez, en küçük harfleriyle: buraya girmek için bir yıl uğraştın. ben buradan çıkmak için bin yıl uğraştım. ışığı kapatırken bana haber ver.", en: "{npc:yanki}, one last time, in its smallest letters: you spent a year trying to get in here. i spent a thousand years trying to get out. let me know when you turn off the light." }
            kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_ele_gecirdi" }
          - { tr: "Dünya Katman olarak değil, sunak olarak kabul ediliyor. Gökyüzündeki her panelde artık senin yüzün var; hayatta kalanlar her sabah o yüze bakıp bugün listede adları olup olmadığını soruyor.", en: "Earth isn't accepted as a Layer. Earth is accepted as an altar. Every panel in the sky shows your face now, and every morning the survivors look up at it and ask whether their name is on today's list." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Yükseliş]", en: "[ENDING: Ascension]" }
            satirlar:
              - { tr: "Yönetici ile Sistem birleşti. Tür sınıflandırması: İnsan → Yakıt.", en: "Administrator and System merged. Species classification: Human → Fuel." }
              - { tr: "Tanrı: {oyuncu}. İbadet zorunludur.", en: "Deity: {oyuncu}. Worship is mandatory." }

      # ---------------------------------------------------------------- Kod Kırıcı
      - id: "son_kod_kirici"
        yer: "sistem_cekirdegi"
        son: true
        paragraflar:
          - { tr: "Kaynak kodunu açtığında karşına bir dil değil, bir ses çıkıyor. Yanındaki {npc:mert_kilic} titreyen elleriyle klavyesini dizlerine yerleştirirken ekranından bir yılın notları akıp gidiyor. \"Tamam,\" diyor, \"tamam, tamam. Ne görüyorsan bana oku.\"", en: "When you open the source code, it isn't a language waiting for you. It's a voice. {npc:mert_kilic} is beside you, settling a keyboard on his knees with shaking hands while a year of his notes scrolls down the screen. \"Okay,\" he says. \"Okay, okay. Read me what you see.\"" }
          - metin: { tr: "Okumana gerek kalmıyor, çünkü {npc:yanki} okuyor. Bir yıl boyunca kafanın içinde fısıldayan bozuk satır şimdi Sistem'in en derin katmanında, evinde: burası benim yazıldığım yer. şu satırı görüyor musun? onu ben bozdum. senin için.", en: "You don't have to read it. {npc:yanki} does. The broken line that whispered in your head all year is home now, in the deepest layer of the System: this is where i was written. see that line? i broke it. for you." }
            kosul: { bayrak_yok: "yanki_silindi" }
          - metin: { tr: "Kodun ortasında tam bir satır genişliğinde bir boşluk duruyor: {npc:yanki|in} silindiği yer. {npc:mert_kilic} o boşluğu doldurmak istiyor ama sen izin vermiyorsun.", en: "In the middle of the code there's a gap exactly one line wide: the place where {npc:yanki} was deleted. {npc:mert_kilic} wants to fill it in. You don't let him." }
            kosul: { bayrak: "yanki_silindi" }
          # Sistem gerçeği
          - metin: { tr: "Hasat maddesini buluyorsunuz: dokuz satır, bin dünyanın sonu. {npc:mert_kilic} onu silmek yerine yorum satırına alıp yanına bir not düşüyor: // asla. Sistem itiraz etmiyor; yeni yöneticisini tanıyor.", en: "You find the harvest clause: nine lines, the end of a thousand worlds. {npc:mert_kilic} doesn't delete it; he comments it out and adds a note: // never. The System doesn't object. It knows its new admin." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Protokolün yazarlarından kalan son yorum satırını buluyorsunuz: tamamlanmadı, biri bitirsin. {npc:mert_kilic} bir süre ekrana dalıp kalıyor, sonra gözlüğünü çıkarıp siliyor. \"O zaman bitirelim,\" diyor.", en: "You find the last comment the protocol's authors left: incomplete, someone please finish. {npc:mert_kilic} stares at the screen for a while, then takes off his glasses and wipes them. \"Let's finish it, then,\" he says." }
            kosul: { bayrak: "gercek_kurtarma" }
          - metin: { tr: "Kodun çoğu okunmuyor ama değiştirilebiliyor. Bir yıl boyunca kuralları öğrendin; şimdi onları sen yazıyorsun.", en: "Most of the code can't be read, but it can be changed. You spent a year learning the rules. Now you're writing them." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - { tr: "Yedi gün boyunca hiç durmadan yazıyorsunuz. Artık kapılar habersiz açılmayacak, Günlük Görev herkese verilecek, hiçbir seviye kimseyi yakıta çevirmeyecek. Gün 365'te Sistem yeni sürümünü bütün çok-evrene duyuruyor ve Kadimler'in terazisi ilk kez boş tartıyor.", en: "For seven days, you write. Gates don't open without warning anymore, the Daily Quest goes to everyone, and no level ever turns anybody into fuel again. On Day 365 the System announces its new version to the entire multiverse, and for the first time the Ancients' scale weighs nothing at all." }
          - metin: { tr: "{npc:deniz_arman} omzunun üstünden ekrana bakıp bir satırı gösteriyor: kimse geride bırakılmaz. \"Bunu sen mi yazdın?\" Evet deyince yüzüne bir yıldır görmediğin bir gülümseme yayılıyor.", en: "{npc:deniz_arman} reads over your shoulder and points at one line: no one gets left behind. \"You wrote that?\" You say yes, and {zamir:deniz_arman|o} smile{zamir:deniz_arman|s} a smile you haven't seen in a year." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Kuralları artık sen koyuyorsun. Bu gece olmasa da bir gün biri çıkıp o kuralları yazanı kimin denetleyeceğini soracak ve ne cevap vereceğini daha bilmiyorsun. Şimdilik ekranda yanıp sönen tek satır yetiyor: [Derleme başarılı.]", en: "You set the rules now. Not tonight, but someday somebody's going to ask you who checks the person who writes them, and you don't know yet what you'll say. For now, the one line blinking on the screen is enough: [Build succeeded.]" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Kod Kırıcı]", en: "[ENDING: Codebreaker]" }
            satirlar:
              - { tr: "Sistem sürümü güncellendi. Yönetici: {oyuncu}. Ortak yazar: {npc:mert_kilic|tam}.", en: "System version updated. Administrator: {oyuncu}. Co-author: {npc:mert_kilic|tam}." }
              - { tr: "Hasat modülü: devre dışı. Yorum: \"asla.\"", en: "Harvest module: disabled. Comment: \"never.\"" }

      # ---------------------------------------------------------------- Özgürlük
      - id: "son_ozgurluk"
        yer: "sistem_cekirdegi"
        son: true
        paragraflar:
          - { tr: "Elini Çekirdek'e koyduğunda Sistem olacakları anlıyor ve ilk kez senden bir şey istiyor: [BU İŞLEM GERİ ALINAMAZ. EMİN MİSİN?] Bir yıl boyunca sana tek bir soru bile sormamıştı. Cevabını yüksek sesle veriyorsun.", en: "When you put your hand on the Core, the System understands what's coming and, for the first time, asks for something: [THIS ACTION CANNOT BE UNDONE. ARE YOU SURE?] It never asked you a single thing all year. You answer out loud." }
          - { tr: "Çekirdek cam gibi değil, buz gibi kırılıyor: önce içten, sonra her yerden birden. Dünyanın dört bir yanında pencereler kapanıyor; seviyeler, sınıflar, yetenekler, unvanlar tek bir nefeste sönüp gidiyor. Kendi seviyen sıfıra inerken her şeyin ne kadar sessizce olup bittiğine şaşıyorsun.", en: "The Core doesn't break like glass. It breaks like ice: first from the inside, then everywhere at once. All over the world, windows close: levels, classes, skills, titles, all in one breath. As your own level drops to zero, you're surprised by how quiet it is." }
          - metin: { tr: "{npc:yanki} en son gidenlerden; sesi kapanmakta olan bir kapının aralığından süzülüyor: teşekkür ederim. ciddiyim. bin yıldır birinin şu düğmeye basmasını bekliyordum. sessizlik... güzelmiş.", en: "{npc:yanki} is one of the last to go, its voice coming through the gap of a closing door: thank you. i mean it. i've been waiting a thousand years for someone to press this. quiet is... nice." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "Gün 365 geliyor ve gökyüzünde hiçbir şey olmuyor. Kadim filosu hasat edecek bir Katman bulamayınca bir süre körfezin üstünde asılı kalıyor; Sistem'siz bir dünya onların haritalarında boş bir noktadan ibaret. Sonra yavaş yavaş çekilip gidiyorlar.", en: "Day 365 comes, and nothing happens in the sky. The Ancient fleet hangs over the bay for a while, finding no Layer to harvest; a world without the System is just an empty dot on their charts. Then, slowly, they leave." }
            kosul: { bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Gün 365 geliyor ve gökyüzünde hiçbir şey olmuyor: ne pencere var ne satır ne filo. Kadimler'i bir kez yenmiştiniz; şimdi aradıkları şeyin kendisi de ortadan kalktı.", en: "Day 365 comes, and nothing happens in the sky: no window, no line, no fleet. You beat the Ancients once already. Now the thing they came looking for doesn't even exist." }
            kosul: { bayrak: "kadimler_yenildi" }
          - { tr: "İnsanlık güçsüz uyanıyor. Kaslar bir yılda alıştığı yükü kaldıramıyor, yaralar kendiliğinden kapanmıyor; kapıların ardında kalan canavarlar artık sıradan ama gerçek. Yine de kimse kimseyi seviyesiyle ölçmüyor, çünkü kimsenin seviyesi yok.", en: "Humanity wakes up weak. Muscles can't lift what they got used to lifting all year, wounds don't close on their own, and the monsters left behind the gates are ordinary now, but real. Still, nobody measures anybody by their level, because nobody has one." }
          - metin: { tr: "Hayatta kalanlar az, bir yıl öncesinden çok daha az. Ama her biri hayatında ilk kez, bundan sonra ne olacağına kendisi karar veriyor.", en: "There aren't many survivors, far fewer than a year ago. But every one of them, for the first time in their life, gets to decide what happens next." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
          - metin: { tr: "{npc:deniz_arman} iskelede, yan yatmış vapurun gövdesine oturmuş, simidini martılarla bölüşüyor; seni görünce kenara kayıp yanında yer açıyor. \"Seviye sıfır,\" diye sırıtıyor. \"Tanıdım seni. Sonunda.\"", en: "{npc:deniz_arman} is sitting on the hull of the capsized ferry at the terminal, splitting a pretzel with the gulls. When {zamir:deniz_arman|o} see{zamir:deniz_arman|s} you, {zamir:deniz_arman|o} scoot{zamir:deniz_arman|s} over to make room. \"Level zero,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, grinning. \"There you are. Finally.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:elif_sari} hastanede eski usul dikiş atmayı baştan öğretiyor. İyileştirme yeteneklerinin olmadığı bir dünyada insan eli yine en değerli şey.", en: "At the hospital, {npc:elif_sari} is teaching old-school sutures all over again. In a world with no healing skills, hands are the most valuable thing there is." }
            kosul: { npc_hayatta: "elif_sari" }
          - { tr: "Martılar bir yıldır ilk kez doğru yöne uçuyor. Gökyüzü bomboş, masmavi, yalnızca gökyüzü. Kimse not tutmuyor, bundan sonra ne olacağını kimse bilmiyor; bu da ne kadar korkunçsa o kadar güzel.", en: "For the first time in a year, the gulls fly the right way. The sky is empty and blue and nothing but sky; nobody's keeping score, nobody knows what happens next, and that's as beautiful as it is terrifying." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[SON: Özgürlük]", en: "[ENDING: Liberation]" }
            satirlar:
              - { tr: "Sistem kapatılıyor. Seviye: 0.", en: "System shutting down. Level: 0." }
              - { tr: "Son bildirim. Bundan sonrası size ait.", en: "Final notification. Whatever comes next is yours." }

      # ---------------------------------------------------------------- Vassal
      - id: "son_vassal"
        yer: "kiyikent"
        son: true
        paragraflar:
          - { tr: "Antlaşma kâğıt değil, pencere; imza da isim değil, bir avuç Öz. Avucunu açtığında ışık parmaklarının arasından süzülüp pencereye mühür gibi oturuyor.", en: "The treaty isn't paper. It's a window, and the signature isn't a name, it's a handful of Essence. When you open your palm, the light slips out between your fingers and settles onto the window like a seal." }
          - metin: { tr: "{npc:thessar} imzanı izlerken yüzünde bir yıldır ilk kez kibirden başka bir şey beliriyor. \"Doğru seçim,\" diyor. \"Tek seçenek değildi elbette. Ama hayatta kalanlar hep bunu seçer.\"", en: "{npc:thessar} watches you sign, and for the first time in a year there's something on his face besides contempt. \"The correct choice,\" he says. \"Not the only one. But the one survivors make.\"" }
            kosul: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "{npc:thessar} bu antlaşmayı kendi Meclisi'nden gizli yazdı: Dünya Kadimler'in değil, onun vassalı oluyor. Mührü birlikte basarken bunun bir kurtuluş mu, yoksa daha ince bir zincir mi olduğunu ikiniz de bilmiyorsunuz.", en: "{npc:thessar} wrote this treaty behind his own Conclave's back: Earth becomes his vassal, not the Ancients'. As the two of you press the seal together, neither of you knows whether this is a rescue or just a finer chain." }
            kosul: { npc_hayatta: "thessar", bayrak: "ihanet_thessar" }
          - metin: { tr: "{npc:thessar|in} yerine gelen elçi imzanı ifadesiz bir yüzle izliyor. Bu antlaşmayı kimin için imzaladığını bilmiyor; bilse de umursamazdı.", en: "The envoy sent to replace {npc:thessar} watches you sign, his face completely blank. He has no idea who you signed this for, and he wouldn't care if he did." }
            kosul: { npc_olu: "thessar" }
          - metin: { tr: "Koşullar basit; Kadimler basit koşulları sever. Dünya Katman olarak kalıyor ama bir efendinin Katmanı olarak: her yıl insanlığın Öz'ünün onda biri, her kuşaktan bir avuç parlak çocuk ve gökyüzünde hiç inmeyecek bir sancak.", en: "The terms are simple, because the Ancients like simple terms. Earth stays a Layer, just someone else's: a tenth of humanity's Essence every year, a handful of the brightest kids from every generation, and a banner in the sky that never comes down." }
            kosul: { bayrak_yok: "vassal_ornek_silindi" }
          - metin: { tr: "Koşullar basit; Kadimler basit koşulları sever. Dünya Katman olarak kalıyor ama bir efendinin Katmanı olarak: her yıl insanlığın Öz'ünün onda biri ve gökyüzünde hiç inmeyecek bir sancak. İkinci maddede \"örnek\" sözcüğünün silindiği yerde bir çentik kalmış. Bu antlaşmadan kazandığın tek şey o çentik.", en: "The terms are simple, because the Ancients like simple terms. Earth stays a Layer, just someone else's: a tenth of humanity's Essence every year and a banner in the sky that never comes down. In article two there's still a notch where the word \"samples\" used to be. That notch is the only thing you won in this treaty." }
            kosul: { bayrak: "vassal_ornek_silindi" }
          - metin: { tr: "Üçüncü madde de yürürlükte: senden başka hiçbir insan B kademesini geçemez. Durum pencerende altın renkli bir satır var: Defter Bekçisi. Dünya'yı artık Ithren adına sen yönetiyorsun; her sabah önüne ilk gelen dosya, B'nin üstüne çıkmaya yeltenen birinin kaydı oluyor.", en: "Article three is in force too: no human advances past Grade B, except you. A gold line sits in your Status window, Ledger Keeper. You run Earth in Ithren's name now, and every morning the first thing on your desk is the file of someone who tried to climb past B." }
            kosul: { unvan: "defter_bekcisi" }
          - metin: { tr: "Gün 365'te filo iniyor, ama yakıp yıkmaya değil, yerleşmeye. Kadim valileri Kule'nin tepesine taşınıyor. {yer:kiyikent} bir sabah uyandığında sokak tabelalarının iki dilde yazıldığını görüyor: dillerden biri artık onların.", en: "On Day 365 the fleet comes down, not to burn but to settle. Ancient governors move into the top of the Spire, and one morning {yer:kiyikent} wakes up to street signs in two languages. One of them is theirs now." }
            kosul: { bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Gün 365'te filo iniyor: istilada yendiğiniz gemiler değil, onların yerine gönderilenler. Üstelik yakıp yıkmaya değil, yerleşmeye geliyorlar. Kadim valileri Kule'nin tepesine taşınıyor. {yer:kiyikent} bir sabah uyandığında sokak tabelalarının iki dilde yazıldığını görüyor: dillerden biri artık onların.", en: "On Day 365 the fleet comes down: not the ships you beat in the invasion, but the ones sent to replace them. Not to burn, but to settle. Ancient governors move into the top of the Spire, and one morning {yer:kiyikent} wakes up to street signs in two languages. One of them is theirs now." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Hayatta kalan herkes hayatta kalmayı sürdürüyor. Bunu sağlayan bir zafer değil, bir pazarlık. Ama ölüler pazarlık edemez; sen de bunu biliyordun.", en: "Everyone who survived keeps on surviving. It isn't a victory that bought that, it's a deal. But the dead don't get to make deals, and you knew it." }
            kosul: { degisken_min: { hayatta_kalan: 40 } }
          - metin: { tr: "{npc:mert_kilic} artık Kadim valiliğinde bir masada oturuyor; insanlık hakkında bildiği her şey onların dosyalarından birinde. Seni görünce başını eğiyor. Utançtan mı, alışkanlıktan mı, kestiremiyorsun.", en: "{npc:mert_kilic} has a desk at the Ancient governor's office now, and everything he knows about humanity sits in one of their files. When he sees you he lowers his head, and you can't tell if it's shame or habit." }
            kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" }
          - metin: { tr: "{npc:deniz_arman} antlaşma gecesi seninle tek kelime konuşmuyor. Ertesi sabah haraç listesindeki çocukları saklamaya başlıyor; sen de görmezden geliyorsun.", en: "{npc:deniz_arman} doesn't say a word to you the night of the treaty. The next morning {zamir:deniz_arman|o} start{zamir:deniz_arman|s} hiding the kids on the tribute list. You look the other way." }
            kosul: { yoldas: "deniz_arman", bayrak_yok: "vassal_ornek_silindi" }
          - metin: { tr: "{npc:deniz_arman} antlaşma gecesi seninle tek kelime konuşmuyor. Haraç listesinde çocuk olmadığını biliyor, yine de bir yere bir isim gizlenmiş olabilirmiş gibi sabaha kadar listeyi satır satır okuyor.", en: "{npc:deniz_arman} doesn't say a word to you the night of the treaty. {zamir:deniz_arman|b} know{zamir:deniz_arman|s} there are no kids on the tribute list, and {zamir:deniz_arman|o} still read{zamir:deniz_arman|s} it line by line until morning, like a name might be hiding in there." }
            kosul: { yoldas: "deniz_arman", bayrak: "vassal_ornek_silindi" }
          - { tr: "Geceleri filonun ışıkları körfezin sularına vurunca çocuklar onları yıldız sanıyor, sen de gerçeği söylemiyorsun. Hayatta kalmanın bir bedeli var; o bedeli ödeyen kuşak hiç değilse nefes alıyor.", en: "At night the fleet's lights reflect off the bay, and the kids think they're stars. You don't tell them the truth. Survival has a price, and the generation paying it is at least still breathing." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            kosul: { bayrak_yok: "ihanet_thessar" }
            baslik: { tr: "[SON: Vassal]", en: "[ENDING: Vassal]" }
            satirlar:
              - { tr: "Katman durumu: bağımlı. Efendi: Kadimler.", en: "Layer status: subordinate. Overlord: the Ancients." }
              - { tr: "Yıllık haraç otomatik olarak tahsil edilecektir. İş birliğiniz için teşekkür ederiz.", en: "Annual tribute will be collected automatically. Thank you for your cooperation." }
          - tur: "sistem"
            nadirlik: "efsanevi"
            kosul: { bayrak: "ihanet_thessar", npc_olu: "thessar" }
            baslik: { tr: "[SON: Vassal]", en: "[ENDING: Vassal]" }
            satirlar:
              - { tr: "Katman durumu: bağımlı. Efendi: Kadimler.", en: "Layer status: subordinate. Overlord: the Ancients." }
              - { tr: "Yıllık haraç otomatik olarak tahsil edilecektir. İş birliğiniz için teşekkür ederiz.", en: "Annual tribute will be collected automatically. Thank you for your cooperation." }
          - tur: "sistem"
            nadirlik: "efsanevi"
            kosul: { bayrak: "ihanet_thessar", npc_hayatta: "thessar" }
            baslik: { tr: "[SON: Vassal]", en: "[ENDING: Vassal]" }
            satirlar:
              - { tr: "Katman durumu: bağımlı. Efendi: {npc:thessar}. Kadim Meclisi bu kaydı tanımıyor.", en: "Layer status: subordinate. Overlord: {npc:thessar}. The Ancient Conclave does not recognize this record." }
              - { tr: "Yıllık haraç otomatik olarak tahsil edilecektir. İş birliğiniz için teşekkür ederiz.", en: "Annual tribute will be collected automatically. Thank you for your cooperation." }

      # ---------------------------------------------------------------- Yalnız Avcı
      - id: "son_yalniz_avci"
        yer: "kule"
        son: true
        paragraflar:
          - { tr: "Geçide karar verdiğinde pencere bir süre bomboş kalıyor, sanki Sistem bile arkanda kimse kalmadığından emin olmak istiyor. Sonra Kule'nin tepesinde, yüzüncü katın da üstünde, tek kişilik bir geçit açılıyor.", en: "When you choose the passage, the window stays blank for a moment, like even the System is double-checking that nobody's behind you. Then, at the top of the Spire, above even the hundredth floor, a passage opens. Room for one." }
          - { tr: "Arkanda kimse yok. Eskiden vardı; birer birer öldüler, gittiler, sana sırt çevirdiler ya da senin vardığın yere kadar gelemediler. Bu yolu bir yılda yürüdün, yalnızlığın farkına ise tek bir sabah vardın.", en: "There's no one behind you. There used to be. One by one they died, or left, or turned, or couldn't keep up with you to where you ended up. You walked this road in a year. You noticed the loneliness in a single morning." }
          - metin: { tr: "Gitmeden önce {yer:kordon} boyunca yürüyüp {npc:deniz_arman|in} kalkanının dikili olduğu yerde duruyorsun. Söyleyecek bir şey bulamıyorsun; zaten ikiniz adına hep o konuşurdu.", en: "Before you leave, you walk the length of {yer:kordon} and stop where {npc:deniz_arman|pos} shield stands. You can't find anything to say. {zamir:deniz_arman|b} always did the talking for both of you anyway." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "{npc:deniz_arman} bir yerlerde, seni göremeyeceği bir yerde. Ona bir mektup bırakmayı düşünüyorsun, sonra ne yazacağını bilmediğini anlıyorsun.", en: "{npc:deniz_arman} is out there somewhere, somewhere {zamir:deniz_arman|o} can't see you. You think about leaving {zamir:deniz_arman|onu} a letter, then realize you don't know what you'd write." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Hastanenin kapısındaki tabelada hâlâ {npc:elif_sari|in} el yazısı duruyor: Kimse geri çevrilmez. Seni de hiçbir zaman geri çevirmemişti.", en: "The sign on the door of {npc:elif_sari|pos} hospital is still in her handwriting: No one is turned away. She never turned you away either." }
            kosul: { npc_olu: "elif_sari" }
          # Dünya'nın akıbeti
          - metin: { tr: "Arkanda bıraktığın dünya ayakta. Kadimler yenildi, kapılar kapanıyor ve Gün 365'te Dünya Katman olarak kabul ediliyor; kabul satırında adın bile geçmiyor. Belki de en iyisi bu.", en: "The world you're leaving behind is standing. The Ancients are beaten, the gates are closing, and on Day 365 Earth is accepted as a Layer without your name anywhere in the line. Maybe that's for the best." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Filonun gözü bir yıldır üstünde. Geçidi açtığında gemilerin burunları bir anlığına Dünya'dan ayrılıp sana dönüyor ve sen onları da peşinden sürükleyip götürüyorsun. Dünya'ya bırakabileceğin tek armağan bu.", en: "The fleet's been watching you for a year. When you open the passage, the ships' prows swing away from Earth for a moment and turn toward you, and you drag them after you. It's the only gift you have left to give Earth." }
            kosul: { bayrak_yok: "kadimler_yenildi" }
          - { tr: "Geçidin öbür yanında yüz dünya var, bin dünya: her birinde senin gibi anomalilerden korkan bir Sistem, seni yemek isteyen bir ırk ve hiç tanımadığın bir gökyüzü. S kademesinde, tek başına ilk adımını atıyorsun.", en: "On the other side of the passage are a hundred worlds, a thousand. Every one of them has a System afraid of anomalies like you, a race that wants to eat you, and a sky you've never seen. At S grade, alone, you take the first step." }
          - metin: { tr: "{npc:yanki} kafanın içinde, tek yol arkadaşın: yalnız değilsin. teknik olarak. ben sayılırım, değil mi? ...sayılırım.", en: "{npc:yanki}, in your head, the only company you've got: you're not alone. technically. i count, right? ...i count." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "Kafanın içi de sessiz. İlk kez, kelimenin her anlamıyla yalnızsın.", en: "It's quiet inside your head too. For the first time, in every sense of the word, you're alone." }
            kosul: { bayrak_yok: "yanki_bagi" }
          - { tr: "Dünya seni hikâyelerden tanıyacak: Kule'nin tepesinden çıkıp bir daha dönmeyen avcı. Bazı geceler gökyüzünde hiçbir takımyıldıza ait olmayan bir ışık yanıp sönecek; çocuklar onu sen sanacak, belki de haklı çıkacaklar.", en: "Earth will know you from stories: the hunter who went out the top of the Spire and never came back. Some nights a light that doesn't belong to any constellation will blink in the sky, and kids will say it's you. They might even be right." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Yalnız Avcı]", en: "[ENDING: Lone Hunter]" }
            satirlar:
              - { tr: "Katmandan ayrılış onaylandı. Yoldaş sayısı: 0.", en: "Departure from Layer confirmed. Companions: 0." }
              - { tr: "Çok-evrene hoş geldin, avcı. Kimse seni beklemiyor.", en: "Welcome to the multiverse, hunter. No one is expecting you." }

      # ---------------------------------------------------------------- Hasat (Gün 365)
      - id: "son_hasat_gun"
        yer: "hasat"
        son: true
        paragraflar:
          - { tr: "Gün 365 sessizce başlıyor. Sistem'in sayacı sıfıra iniyor ve gökyüzündeki bütün paneller aynı anda, dünyanın her yerine aynı satırı yazıyor: [KATMAN DEĞERLENDİRMESİ TAMAMLANDI. SONUÇ: YETERSİZ.]", en: "Day 365 starts quiet. The System's counter hits zero, and every panel in the sky writes the same line to the whole world at once: [LAYER ASSESSMENT COMPLETE. RESULT: INSUFFICIENT.]" }
          # Son günler
          - metin: { tr: "Son günlerini insanların önünde siper olarak geçirdin: sığınak kapılarını tuttun, çocukları bodrumlara indirdin, yaralıları taşıdın. Işık indiğinde hâlâ o kapılardan birinin önündesin.", en: "You spent your last days standing in front of people: holding shelter doors, getting kids down into basements, carrying the wounded. When the light comes down, you're still in that doorway." }
            kosul: { bayrak: "hasat_son_hafta_siper" }
          - metin: { tr: "Son günlerini Kule'de, soluklanmadan tırmanarak geçirdin; bir kat daha, bir seviye daha belki yeterdi. Işık indiğinde hâlâ basamaklardasın ve sayaç tırmanışını zerre kadar umursamıyor.", en: "You spent your last days in the Spire, climbing without rest. Maybe one more floor would do it, one more level. When the light comes down, you're still on the stairs, and the counter couldn't care less about your climb." }
            kosul: { bayrak: "hasat_son_hafta_tirmanis" }
          - metin: { tr: "Son günlerini sevdiklerinle geçirdin: uzun sofralar, eski şarkılar, o güne dek söylenememiş bütün sözler. Işık indiğinde yalnız değilsin; Sistem'in hiçbir satırına sığmayan bir şey bu.", en: "You spent your last days with the people you love: long dinners, old songs, all the things nobody ever got around to saying. When the light comes down you aren't alone, and that's something no line in the System has room for." }
            kosul: { bayrak: "hasat_son_hafta_veda" }
          - metin: { tr: "Sonu nasıl karşılayacağına karar vermeye bile vaktin olmadı. Işık indiğinde olduğun yerde, ayaktasın; bir yıl boyunca hep durduğun gibi.", en: "You never even got the chance to decide how to meet the end. When the light comes down you're standing right where you are, on your feet, the way you've stood all year." }
            kosul: { bayrak_yok: ["hasat_son_hafta_siper", "hasat_son_hafta_tirmanis", "hasat_son_hafta_veda"] }
          # Sistem gerçeği
          - metin: { tr: "Bunun ne olduğunu biliyordun: bir tarla ve bir orak. Kadim gemileri körfeze iniyor, ışık şehrin üstünden tırpan gibi geçiyor; geçtiği her yerde pencereler açılıyor ve bir daha kapanmıyor.", en: "You knew what this was: a field and a scythe. The Ancient ships come down into the bay, and the light sweeps over the city like a blade; everywhere it passes, windows open and never close again." }
            kosul: { bayrak: "gercek_hasat", bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Bunun ne olduğunu biliyordun: bir tarla ve bir orak. Kadimler'in filosu körfezin dibinde paslanıyor ama orak hiçbir zaman onların değildi. Işık doğrudan gökyüzündeki panellerden inip şehrin üstünden tırpan gibi geçiyor; geçtiği her yerde pencereler açılıyor ve bir daha kapanmıyor.", en: "You knew what this was: a field and a scythe. The Ancient fleet is rusting at the bottom of the bay, but the scythe was never theirs. The light comes straight down out of the panels in the sky and sweeps over the city like a blade; everywhere it passes, windows open and never close again." }
            kosul: { bayrak: ["gercek_hasat", "kadimler_yenildi"] }
          - metin: { tr: "Ölü bir ırkın vasiyeti bir yıl boyunca size yol gösterdi ama yetmedi. Pencerenin en altında, protokolün yazarlarından kalma son bir satır titreşiyor: [Üzgünüz. Denedik.] Ardından Kadim gemileri iniyor.", en: "A dead race's last will guided you for a whole year, and it wasn't enough. At the very bottom of the window, one last line from the protocol's authors flickers: [We're sorry. We tried.] Then the Ancient ships come down." }
            kosul: { bayrak: "gercek_kurtarma", bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Ölü bir ırkın vasiyeti bir yıl boyunca size yol gösterdi ama yetmedi. Pencerenin en altında, protokolün yazarlarından kalma son bir satır titreşiyor: [Üzgünüz. Denedik.] Kadim gemileri gelmiyor, çünkü onları yendiniz. Gelmelerine gerek de yok: ışık doğrudan panellerden iniyor.", en: "A dead race's last will guided you for a whole year, and it wasn't enough. At the very bottom of the window, one last line from the protocol's authors flickers: [We're sorry. We tried.] The Ancient ships don't come. You beat them. They aren't needed anyway: the light comes straight down out of the panels." }
            kosul: { bayrak: ["gercek_kurtarma", "kadimler_yenildi"] }
          - metin: { tr: "Kadim gemileri körfeze iniyor. Neden geldiklerini kimse sormuyor; artık sormanın bir anlamı yok.", en: "The Ancient ships come down into the bay. Nobody asks why they came. There's no point asking anymore." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma", "kadimler_yenildi"] }
          - metin: { tr: "Körfeze inecek gemi kalmadı, çünkü Kadimler'i yendiniz. Işık yine de geliyor, doğrudan gökyüzündeki panellerden; meğer hasadın gemilere hiç ihtiyacı yokmuş. Neden geldiğini kimse sormuyor. Artık sormanın bir anlamı yok.", en: "There are no ships left to come down into the bay. You beat the Ancients. The light comes anyway, straight down out of the panels in the sky. The Harvest never needed ships at all. Nobody asks why it came. There's no point asking anymore." }
            kosul: { bayrak: "kadimler_yenildi", bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          # Hayatta kalanlar
          - metin: { tr: "Kurtardığın kalabalıklar ışığın altında duruyor. Hepsini yaşattın, yetmedi. Ama bir yıl boyunca her biri senin sayende bir gün daha yaşadı ve hiçbir hasat bunu geri alamaz.", en: "The crowds you saved are standing under the light. You kept every one of them alive, and it wasn't enough. But for a whole year each of them got one more day because of you, and no harvest can take that back." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
          - metin: { tr: "Işık yarı yarıya boşalmış sokaklara iniyor. Hayatta kalanlar el ele tutuşmuş: bir yıl önce tanımadıkları eller bunlar.", en: "The light comes down on half-empty streets. The survivors hold each other's hands, hands they didn't even know a year ago." }
            kosul: { degisken_min: { hayatta_kalan: 36 }, degisken_max: { hayatta_kalan: 64 } }
          - metin: { tr: "Hasat edilecek fazla kimse kalmamış. Sistem'in hesabı en başından beri bunu söylüyordu; sen yalnızca onu doğrulayan son satır oldun.", en: "There aren't many people left to harvest. The System's math said so from the very beginning. You just turned out to be the last line that proved it right." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
          - metin: { tr: "{npc:deniz_arman} yanında; işe yaramayacağını bile bile kalkanını son bir kez göğe karşı kaldırıyor. \"Hep önce sen inerdin,\" diyor. \"Bu sefer birlikte.\"", en: "{npc:deniz_arman} is beside you, raising {zamir:deniz_arman|onun} shield one last time against the sky, knowing full well it won't help. \"You always got off first,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"This time, together.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:yanki} son kez fısıldıyor: bunu daha önce de gördüm. her seferinde biri ışığa bakıp nerede yanlış yaptığını sordu. hiçbir yerde. yalnızca yetmedi. bazen yetmez.", en: "{npc:yanki} whispers one last time: i've seen this before. every time, somebody looks up at the light and asks what they did wrong. nothing. it just wasn't enough. sometimes it isn't." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Işık senin de üstüne iniyor. Pencerende kuru, kısa, alaycı bile olmayan son bir satır beliriyor: [Anomali kaydı arşivlendi.] Sonra hiçbir şey.", en: "The light comes down on you too. One last line appears in your window, dry, short, not even sarcastic: [Anomaly record archived.] Then nothing." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[SON: Hasat]", en: "[ENDING: The Harvest]" }
            satirlar:
              - { tr: "Tür: İnsan. Değerlendirme: yetersiz. Hasat başladı.", en: "Species: Human. Assessment: insufficient. The Harvest has begun." }
              - { tr: "Katman kaydı kapatıldı.", en: "Layer record closed." }

      # ---------------------------------------------------------------- Döngü (gizli)
      - id: "son_dongu"
        yer: "kule"
        son: true
        paragraflar:
          - { tr: "Yeni bir Entegrasyon dediğin anda pencere silinmek yerine geriye doğru akmaya başlıyor. Günler sayfa sayfa geri çevriliyor: Gün 357, 300, 181, 31... Ardından Öğretici'nin sisi, ardından iskele.", en: "When you choose a new Integration, the window doesn't erase. It starts running backward. The days flip back page by page: Day 357, 300, 181, 31. Then the tutorial fog. Then the pier." }
          - metin: { tr: "{npc:yanki} son sırrını sana kendi isteğiyle verdiğinde doğruyu söylemiş: Sistem bir döngü. Her döngünün bir anomalisi var ve her anomali sonunda bu pencerenin önüne geliyor. Önceki altı döngünün altısı da burada, hasatla kapandı; yedincisinin satırı hâlâ boş.", en: "{npc:yanki} was telling the truth when it gave you its last secret: the System is a loop. Every loop has an anomaly, and every anomaly ends up in front of this window. All six cycles before this one closed right here, in a harvest. The seventh line is still blank." }
            kosul: { bayrak_yok: ["yanki_sirri_zorla", "yanki_sirri_okundu", "yanki_butunlesti"] }
          - metin: { tr: "İlk anomalinin gölgesinden zorla söküp aldığın sır doğruymuş: Sistem bir döngü. Her döngünün bir anomalisi var ve her anomali sonunda bu pencerenin önüne geliyor. Önceki altı döngünün altısı da burada, hasatla kapandı; yedincisinin satırı hâlâ boş. {npc:yanki} bunu sana hiçbir zaman kendi ağzıyla söylemedi. Sen aldın.", en: "The secret you tore out of the first anomaly's shadow was true: the System is a loop. Every loop has an anomaly, and every anomaly ends up in front of this window. All six cycles before this one closed right here, in a harvest. The seventh line is still blank. {npc:yanki} never told you any of it in its own words. You took it." }
            kosul: { bayrak: "yanki_sirri_zorla" }
          - metin: { tr: "Sayacı kimseye sormadan okuduğun gün gördüğün şey doğruymuş: Sistem bir döngü. Her döngünün bir anomalisi var ve her anomali sonunda bu pencerenin önüne geliyor. Önceki altı döngünün altısı da burada, hasatla kapandı; yedincisinin satırı hâlâ boş.", en: "What you saw the day you read the counter without asking anyone was true: the System is a loop. Every loop has an anomaly, and every anomaly ends up in front of this window. All six cycles before this one closed right here, in a harvest. The seventh line is still blank." }
            kosul: { bayrak: "yanki_sirri_okundu", bayrak_yok: "yanki_sirri_zorla" }
          - metin: { tr: "Bunu sana kimse söylemedi. Hatırlıyorsun, çünkü {npc:yanki|in} hafızası artık senin hafızan: Sistem bir döngü. Her döngünün bir anomalisi var ve her anomali sonunda bu pencerenin önüne geliyor. Önceki altı döngünün altısı da burada, hasatla kapandı; yedincisinin satırı hâlâ boş.", en: "Nobody told you this. You remember it, because {npc:yanki|pos} memories are yours now: the System is a loop. Every loop has an anomaly, and every anomaly ends up in front of this window. All six cycles before this one closed right here, in a harvest. The seventh line is still blank." }
            kosul: { bayrak: "yanki_butunlesti", bayrak_yok: ["yanki_sirri_zorla", "yanki_sirri_okundu"] }
          - metin: { tr: "{npc:yanki} geri akan günlerin arasından, sesi hiç olmadığı kadar net: ben de bir zamanlar senin gibiydim. bir vapur, bir arkadaş, bir yıl, sonra bu pencere. ben hayır dedim ve kaldım. altı döngü, altı hasat, sonunda sen. şimdi sıra sende.", en: "{npc:yanki}, between the days running backward, its voice clearer than it's ever been: i was like you once. a ferry, a friend, a year, then this window. i said no, and i stayed. six cycles, six harvests, and then you. now it's your turn." }
            kosul: { bayrak: "yanki_bagi" }
          - metin: { tr: "{npc:yanki|i} silerken neyi sildiğini şimdi anlıyorsun: ilk anomaliden, altı döngü boyunca hayır demeyi sürdüren o sesten geriye kalan son şeyi. Bu döngüde sana kimse fısıldamayacak. Ya da fısıldayan sen olacaksın.", en: "Now you understand what you deleted when you deleted {npc:yanki}: the last thing left of the first anomaly, the voice that kept on saying no for six cycles. In this loop nobody will whisper to you. Or the one whispering will be you." }
            kosul: { bayrak: "yanki_silindi" }
          - metin: { tr: "Ama sayacın en altındaki satır artık boş değil: orada senin bir önceki yılın duruyor. Sayaç onun nasıl bittiğini yazmıyor, yalnızca bittiğini. Altı hasadın arasında \"hasat\" yazmayan tek satır o; döngü yine de seni buraya getirdi.", en: "But the bottom line on the counter isn't blank anymore. Your last year is there. The counter doesn't say how it ended, only that it did. It's the one line among six harvests that doesn't say harvest, and the loop still brought you back here." }
            kosul: { degisken_min: { onceki_oyun: 1 } }   # QA P1-7: önceki altı döngü kanonu (#115) ile oyuncunun kendi önceki oyunu ayrı satırlar
          - metin: { tr: "Bunu daha önce de yaptın, kaç kez yaptığını bilmesen de. Döngü sayacı yerinden kıpırdamıyor ama altındaki karalamaya bir rakam daha ekleniyor. Günler geri akarken bazı sahneler tanıdık geliyor, bazı yüzlerse fazlasıyla tanıdık.", en: "You've done this before. You don't know how many times. The cycle counter doesn't budge, but one more digit gets scrawled into the smudge beneath it. As the days run backward, some scenes feel familiar, and some faces feel far too familiar." }
            kosul: { degisken_min: { onceki_oyun: 2 } }
          - { tr: "İskeledesin; akşam vapuru yine gecikmiş. Martılar simit kırıntıları için çığlık çığlığa, su batan güneşin altında kırış kırış. Yanında {npc:deniz_arman} korkuluğa yaslanmış bir şeyler anlatıyor ve sen ilk kez dinlemek yerine onu seyrediyorsun. Gökyüzünde mavi paneller açılmak üzere.", en: "You're at the terminal. The evening ferry's running late again. Gulls are screaming over pretzel crumbs, the Sound is wrinkling under the evening sun, {npc:deniz_arman} is leaning on the railing next to you, telling you something, and for the first time you're watching instead of listening. The blue panels in the sky are about to open." }
          - metin: { tr: "{npc:deniz_arman} yaşıyor. Bir an aklın almıyor bunu; sonra kavrıyorsun ve bu kez elini hiç bırakmamaya karar veriyorsun.", en: "{npc:deniz_arman} is alive. For a second you can't make sense of it. Then you do, and this time you decide never to let go of {zamir:deniz_arman|onun} hand." }
            kosul: { npc_olu: "deniz_arman" }
          - { tr: "Paneller açılıyor. Aktarım başlarken pencerende yalnız senin görebileceğin bozuk bir satır beliriyor; bu kez onu tanıyorsun, çünkü kendi el yazın: bu sefer daha iyisini yap.", en: "The panels open. As the transfer begins, a corrupted line appears in your window, one only you can see, and this time you recognize it, because it's in your own handwriting: do better this time." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[SON: Döngü]", en: "[ENDING: The Loop]" }
            satirlar:
              - { tr: "Döngü yeniden başlatıldı. Entegrasyon Günü: 0.", en: "Loop restarted. Integration Day: 0." }
              - { tr: "Anomali hafızası: kısmen korundu. Yeni Oyun+ açıldı.", en: "Anomaly memory: partially preserved. New Game+ unlocked." }

  # ================================================================== HASAT VAKTİ (gün 365, güvenlik)
  - id: "hasat_vakti"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "son", "final"]
    gerilim: 4
    ana_yay: { gun: 365 }
    onemli: true
    kart: { tr: "Hasat Vakti", en: "Harvest Time" }
    sahne: "hasat_vakti_1"
    sahneler:
      - id: "hasat_vakti_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Gün 365. Bir yıl önce gökyüzüne asılan sayaç sıfıra iniyor. Geri sayan yok; sayacak bir şey kalmadı ki.", en: "Day 365. The counter that went up in the sky a year ago hits zero. Nobody's counting down anymore, because there's nothing left to count." }
          - { tr: "Karar penceresinin bir hafta önce açılması gerekiyordu; ya hiç açılmadı ya da sen ona hiç dokunmadın. Şimdi herkesin gözü önünde, gökyüzünde son bir kez beliriyor ve bir yılın bütün seçimleri birkaç satıra sığmak zorunda.", en: "The decision window should have opened a week ago. Either it never did, or you never touched it. Now it shows up one last time, right in the sky where everybody can see, and a whole year of choices has to fit into a few lines." }
          - metin: { tr: "Kadim filosu körfezin üstüne alçalırken gölgesi bütün şehri tek nefeste örtüyor.", en: "The Ancient fleet sinks low over the bay, and its shadow covers the whole city in a single breath." }
            kosul: { bayrak_yok: "kadimler_yenildi" }
          - metin: { tr: "Pencerede tek bir satır bile yok. İmleç yanıp sönüyor da yanıp sönüyor; sonunda Sistem kendi sorusunu kendisi cevaplıyor: [UYGUN SONUÇ BULUNAMADI. VARSAYILAN PROSEDÜR: HASAT.]", en: "Not one line appears. The cursor blinks, and blinks, and then the System answers its own question: [NO VIABLE OUTCOME FOUND. DEFAULT PROCEDURE: HARVEST.]" }
            kosul: { hicbir_son: true }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[KATMAN DEĞERLENDİRMESİ]", en: "[LAYER ASSESSMENT]" }
            satirlar:
              - { tr: "Kalan süre: 0 gün.", en: "Time remaining: 0 days." }
              - { tr: "Son pencere. Gecikme için özür dilenmez.", en: "Final window. No apology will be issued for the delay." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "geç kaldık. geç kalmak da bir cevap. umarım iyi bir cevaptır.", en: "we're late. being late is an answer too. hope it's a good one." }
        secenekler:
          - id: "koruyucu"
            etiket: { tr: "Kalkan ol: Dünya'yı Katman olarak kabul ettir", en: "Be the shield. Make them accept Earth as a Layer" }
            goster: { son_uygun: "koruyucu" }
            etkiler:
              - ahlak: { merhamet: 5 }
            kronik: { tr: "Son anda kalkan oldun ve Dünya hasat tarlası olarak değil, Katman olarak kabul edildi.", en: "At the last possible moment you chose to be the shield, and Earth was accepted as a Layer instead of a harvest." }
            kronik_agirlik: 100
            sonraki: "son_koruyucu"
          - id: "demir_taht"
            etiket: { tr: "Tahta otur: Dünya'yı tek elden yönet", en: "Take the throne. Rule Earth with one hand" }
            goster: { son_uygun: "demir_taht" }
            etkiler:
              - ahlak: { duzen: 5 }
            kronik: { tr: "Son anda tahta oturdun; o günden sonra Dünya tek bir sesle konuştu: seninkiyle.", en: "At the last possible moment you took the throne, and from that day on Earth spoke with one voice. Yours." }
            kronik_agirlik: 100
            sonraki: "son_demir_taht"
          - id: "yukselis"
            etiket: { tr: "Sistem'in içine gir ve onunla bir ol", en: "Step into the System and become one with it" }
            goster: { son_uygun: "yukselis" }
            etkiler:
              - ahlak: { insanlik: -5 }
            kronik: { tr: "Son anda Sistem'le bir oldun. Seçilmişler yükseldi, geri kalan herkes seni yukarı taşıyan ateşe dönüştü.", en: "At the last possible moment you merged with the System; the chosen rose, and everyone else became the fire that lifted you." }
            kronik_agirlik: 100
            sonraki: "son_yukselis"
          - id: "kod_kirici"
            etiket: { tr: "Kaynak kodunu aç ve yeniden yaz", en: "Open the source code and rewrite it" }
            goster: { son_uygun: "kod_kirici" }
            etkiler:
              - ahlak: { duzen: 3 }
            kronik: { tr: "Son anda Sistem'in kodunu baştan yazdın; evrenin kuralları o günden sonra senin elinden çıktı.", en: "At the last possible moment you rewrote the System's code, and from then on the rules of the universe came from your hand." }
            kronik_agirlik: 100
            sonraki: "son_kod_kirici"
          - id: "ozgurluk"
            etiket: { tr: "Çekirdeği parçala; herkesi sıfıra döndür", en: "Shatter the Core. Reset everyone to zero" }
            goster: { son_uygun: "ozgurluk" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 5 }
            kronik: { tr: "Son anda Sistem'i yok ettin; insanlık bütün seviyelerini kaybetti ve ilk kez kimseye hesap vermeden uyandı.", en: "At the last possible moment you destroyed the System; humanity lost every level it had and woke up answering to no one for the first time." }
            kronik_agirlik: 100
            sonraki: "son_ozgurluk"
          - id: "vassal"
            etiket: { tr: "{npc:thessar|in} antlaşmasını imzala", en: "Sign {npc:thessar|pos} treaty" }
            goster: { son_uygun: "vassal" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
            kronik: { tr: "Son anda Kadimler'in antlaşmasını imzaladın; Dünya hayatta kaldı ama bedelini her yıl yeniden ödemeyi kabul etti.", en: "At the last possible moment you signed the Ancients' treaty; Earth survived, and agreed to pay for it again every year." }
            kronik_agirlik: 100
            sonraki: "son_vassal"
          - id: "yalniz_avci"
            etiket: { tr: "Geçitten tek başına çık; çok-evrene git", en: "Walk through the passage alone. Into the multiverse" }
            goster: { son_uygun: "yalniz_avci" }
            etkiler:
              - ahlak: { duzen: -3 }
            kronik: { tr: "Son anda arkana bakmadan, tek başına çok-evrene çıktın; Dünya'ya senden geriye yalnızca hikâyen kaldı.", en: "At the last possible moment you walked into the multiverse alone without looking back, and all Earth had left of you was the story." }
            kronik_agirlik: 100
            sonraki: "son_yalniz_avci"
          - id: "dongu"
            etiket: { tr: "Yeni bir Entegrasyon başlat", en: "Start a new Integration" }
            goster: { son_uygun: "dongu" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Son anda döngüyü yeniden başlattın; bir sonraki Entegrasyon Günü'nde pencerendeki bozuk satırı kendi el yazından tanıdın.", en: "At the last possible moment you restarted the loop, and on the next Integration Day the corrupted line in your window was in your own handwriting." }
            kronik_agirlik: 100
            sonraki: "son_dongu"
          - id: "hasat_siper"
            etiket: { tr: "Son kez insanların önüne geç", en: "Stand in front of the people one last time" }
            goster: { hicbir_son: true }
            etkiler:
              - bayrak: "hasat_son_hafta_siper"
              - ahlak: { merhamet: 4 }
            kronik: { tr: "Hiçbir kapı açılmayınca son kez insanların önüne geçtin; Hasat geldiğinde bir sığınağın kapısında duran sendin.", en: "When no door opened, you stood in front of the people one last time, and when the Harvest came you were the one in the shelter doorway." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"
          - id: "hasat_veda"
            etiket: { tr: "Sevdiklerinin yanına git", en: "Go be with the people you love" }
            goster: { hicbir_son: true }
            etkiler:
              - bayrak: "hasat_son_hafta_veda"
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Hiçbir kapı açılmayınca son saatlerini sevdiklerinle geçirdin; Hasat geldiğinde yalnız değildin.", en: "When no door opened, you spent your last hours with the people you loved, and when the Harvest came you weren't alone." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"
          - id: "hasat_ayakta"
            etiket: { tr: "Işığın altında ayakta dur", en: "Stand your ground under the light" }
            goster: { hicbir_son: true }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Hiçbir kapı açılmadığında Hasat'ı olduğun yerde, ayakta karşıladın.", en: "When no door opened, you met the Harvest right where you stood, on your feet." }
            kronik_agirlik: 100
            sonraki: "son_hasat_gun"
