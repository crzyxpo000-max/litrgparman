# Parti C — Yükselenler zinciri (zincir_yukselenler), Vahit'in yayı ve Deniz'in Yükselenler dalı (Aşama 7, Perde 2–4).
# Zincir: yukselenler_1_cagri (P2) → yukselenler_2_yakit_listesi (P2) → yukselenler_3_ayin (P3, AY 220)
#         → yukselenler_4_kurban (P3, AY 285) → yukselenler_5_mutlak_sadakat (P4, AY 340; gorev tamam).
# Vahit: vahit_secilmisler (P2) → vahit_mucize_sinavi (P2–3) → vahit_maske_duser (P3, AY 245; vahit_hakli / vahit_sahtekar)
#        → vahit_yukselis_kapisi (P4, AY 346; Yükseliş sonunun kapısı).
# Deniz (Yükselenler dalı): deniz_yukselen_rakip (AY 150; Deniz Yükselenler'deyse; J'nin büyük ihaneti için deniz_rakip_oldu).
# Yalnız tohum: yukselenler_kacak_aile, on_ucuncu_secim.
# Gerçek: Sistem bir hasat aracıysa (gercek_hasat) Vahit haklıdır: hasadın "ön seçim" kanalı ona gerçekten konuşur.
# Değilse Vahit sahtekârdır: Entegrasyon sabahı bir kez duyduğu tek satırı yıllarca taklit etmiştir.
# Tekrar eden yüz: Öğretici'de yakıt listesini getiren mürit, artık "On Üç" (EN: "Thirteen").
olaylar:
  # ================================================================== ZİNCİR 1: ÇAĞRI
  - id: "yukselenler_1_cagri"
    perde: [2]
    gun: { min: 45, max: 130 }
    agirlik: 8
    etiketler: ["yukselenler", "zincir", "npc", "ahlak"]
    gerilim: 3
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Beyaz cübbe ve kül kâsesi", en: "A white robe and a bowl of ash" }
    sahne: "yuk1_davet"
    sahneler:
      - id: "yuk1_davet"
        paragraflar:
          - { tr: "Akşamüstü kapına baştan aşağı beyazlar giymiş altı kişi dayanıyor; ellerinde fener, ayakkabılarında yokuşun tozu. En öndekinin taşıdığı tepside katlanmış beyaz bir cübbe, yanında da ağzına kadar ince, gri külle dolu küçük bir kâse duruyor.", en: "Six people in white show up at your door near sundown, lanterns in hand, the dust of a steep hill on their shoes. The one in front is carrying a tray: a folded white robe, and beside it, a little bowl full of fine gray ash." }
          - { tr: "Tepsiyi taşıyan genci tanıyorsun: Öğretici'de sana yakıt listesini getiren mürit. Bir ayda on yaş birden yaşlanmış sanki. \"Artık bana On Üç diyorlar,\" diyor; sesindeki gurur mu, utanç mı, kestiremiyorsun. \"Listede kaçıncı olduğumu kimse unutmasın diye.\"", en: "The kid carrying the tray is the disciple who brought you the fuel list back in the Tutorial. He looks ten years older in one month. \"They call me Thirteen now,\" he says, and you can't tell if it's pride or shame. \"So nobody forgets where I was on the list.\"" }
          - metin: { tr: "Gözü bir an ellerine kayıyor. \"Adımı bir kere yaktın,\" diyor alçak sesle. \"O günden beri onu geri kazanmaya uğraşıyorum.\"", en: "His eyes drop to your hands for a second. \"You burned my name once,\" he says, low. \"I've been trying to earn it back ever since.\"" }
            kosul: { bayrak: "yakit_listesi_yakildi" }
          - { tr: "\"Peygamber seni {yer:tepe|e} çağırıyor; bu gece Çağrı var.\" Tepsiyi biraz daha uzatıyor. \"Ya cübbeyi giyersin ya külü sürersin. {yer:tepe|de} üçüncü renk yoktur.\"", en: "\"The Prophet's calling you up to {yer:tepe}. Tonight's the Calling.\" He holds the tray out a little farther. \"You put on the robe or you put on the ash. There's no third color on the hill.\"" }
          - metin: { tr: "Fraksiyonların seni istediği gün onların safını seçmiştin; kâğıt üstünde zaten onlardansın. Ama On Üç'ün bakışı her şeyi söylüyor: {yer:tepe|de} kâğıdın hükmü yoktur, insan orada renginden tanınır.", en: "On the day the factions came for you, you stood with them. On paper, you're already one of them. But the look Thirteen gives you says it plain: paper doesn't count on the hill. Up there, they know you by your color." }
            kosul: { bayrak: "uye_yukselenler" }
          - metin: { tr: "Fenerlerin ışığı yolun aşağısına vuruyor. {yer:kordon|den} kaçanlar battaniyelerini, bebek arabalarını sürükleyerek yokuşa tırmanıyor; çoğunun alnına şimdiden gri bir başparmak izi basılmış.", en: "Lantern light spills down the road. People who ran from {yer:kordon} are climbing the hill with blankets and strollers, and most of them already have a gray thumbprint on their foreheads." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Kasaba Çekirdeği'nin uğultusu bu akşam ilahiyi andırıyor. Çekirdek artık onların elinde; şehrin bütün panelleri {yer:tepe|in} saatine göre yanıp sönüyor.", en: "Tonight the hum of the Town Core sounds like a hymn. The Core belongs to them now, and every panel in the city blinks on the hill's schedule." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Altı seviye: 11, 14, 9, 12, 8, bir de On Üç'ünkü: 31. Bir ay önce listede \"üç ve altı\" yazıyordu. Kapı temizleyerek kimse bir ayda yirmi sekiz seviye atlamaz.", en: "Six levels: 11, 14, 9, 12, 8, and Thirteen: 31. A month ago the list said \"three or lower.\" Nobody jumps twenty-eight levels in a month clearing Gates." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷ül. sistem külden bir şey yapmaz, ama tepede biri yapıyor. bir de kokusu... bu kokuyu tanıyorum. keşke tanımasaydım.", en: "a̷sh. the system doesn't make anything out of ash. but somebody on that hill does. and that smell... i know it. i'd rather not." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ben o kâseyi tanırım. Alnına o külü süren hiç kimse koğuşuma geri dönmedi.\"", en: "\"I know that bowl. Not one person who wore the ash ever came back to my ward.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"{yer:tepe|den} her gece bir sinyal çıkıyor, kısa ve düzenli. Orada biri bir şey sayıyor.\"", en: "\"There's a signal coming off that hill every night. Short. Regular. Somebody up there is counting something.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşimi bu insanlar aldı. Gidiyorsan ben de geliyorum.\"", en: "\"These people took my sister. If you're going up there, I'm coming.\"" }
        secenekler:
          - id: "cubbe"
            etiket: { tr: "Beyaz cübbeyi al, {yer:tepe|e} çık", en: "Take the white robe. Climb the hill" }
            etkiler:
              - tanis: "vahit"
              - bolge: "tepe"
              - bayrak: "vahit_yakin_takip"
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "Beyaz cübbeyi tepsiden kendi elinle aldın. O geceden sonra {yer:tepe} seni kendi renginden saydı.", en: "You took the white robe with your own hands. From that night on, the hill counted you as one of its own." }
            sonraki: "yuk1_tepe"
          - id: "kul"
            tur: "gizle"
            etiket: { tr: "Külü alnına sür, yakıtın arasında yokuşu çık", en: "Thumb the ash on your brow. Go up as fuel" }
            etkiler:
              - tanis: "vahit"
              - bolge: "tepe"
              - bayrak: "vahit_yakin_takip"
              - gizle: 4
              - ahlak: { insanlik: 3, merhamet: 1 }
            kronik: { tr: "Alnında külle yakıtın arasına karışıp {yer:tepe|e} çıktın; her şeye onların gözünden baktın.", en: "You climbed the hill among the fuel, ash on your forehead, and saw it through their eyes." }
            sonraki: "yuk1_kul"
          - id: "ret"
            etiket: { tr: "Tepsiyi geri çevir", en: "Hand the tray back" }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_yakin_takip"
              - ahlak: { insanlik: 2, duzen: -1 }
              - itibar: { yukselenler: -4 }
              - iliski: { vahit: { guven: -3 } }
            kronik: { tr: "{yer:tepe|in} çağrısını daha kapıdayken geri çevirdin, ama tepsi yine de eşiğinde kaldı.", en: "You turned the hill's Calling away at your own door. The tray stayed on your step anyway." }
            sonraki: "yuk1_ret"
          - id: "insin"
            tur: "gosteris"
            etiket: { tr: "Peygamber kendi insin; {yer:tepe} ayağına gelsin", en: "Let the Prophet come down. The hill comes to you" }
            gerekli: { stat: { cha: 45 } }
            etkiler:
              - tanis: "vahit"
              - bayrak: "vahit_yakin_takip"
              - dikkat: 3
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { korku: 6, saygi: 8 } }
            kronik: { tr: "Bir peygamberi tepesinden indirttin. Yükselenler o gece asıl kimin önünde diz çöktüklerini öğrendi.", en: "You made a prophet come down off his hill. That night the Ascended learned who they really kneel to." }
            sonraki: "yuk1_inis"

      - id: "yuk1_tepe"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} dar sokakları fener ışığıyla dolup taşıyor. Çamaşır iplerinde çarşaf yerine beyaz cübbeler kuruyor, her kapının üstüne kömürle tek bir göz çizilmiş.", en: "The narrow streets of {yer:tepe} are full of lanterns. White robes hang drying on the clotheslines where the bedsheets used to be, and over every door someone has drawn a single eye in charcoal." }
          - { tr: "Doruğunda eski rasathane yükseliyor: kubbesi yarılmış, teleskobu çoktan sökülmüş. Kubbenin altındaki taş sarnıçta bir Kapı açık duruyor. Kapatan olmamış, kapatmaya niyetlenen de yok. Süt beyazı zarı ağır ağır inip kalkıyor, nefes alıyor.", en: "The old observatory sits at the top, its dome split open, the telescope long since stripped out. Down in the stone reservoir under the dome there's an open Gate; nobody's closed it, and nobody means to. Its membrane is milk-white, and it breathes." }
          - { tr: "Sarnıcın çevresine iki halka kurulmuş: içeride beyazlar, dışarıda taş basamaklara dizilmiş, alınlarında gri başparmak iziyle yakıt. Hepsi bir ağızdan ilahi söylüyor; sesi en gür çıkanlar da dışarıdakiler.", en: "There are two rings around the reservoir. Inside, the white robes. Outside, on the stone steps, the fuel, each with a gray thumbprint on the forehead. Everyone's singing, and the loudest are the ones on the outside." }
          - { tr: "{npc:vahit} sarnıcın ağzında dikiliyor; eskisinden zayıf, eskisinden parlak. Mikrofonsuz sesi yine her kulağa ulaşıyor: \"Sistem bana bir merdiven gösterdi ve basamaklarını size saydırdı. Bu gece en üst basamak ayağımıza geldi.\"", en: "{npc:vahit} stands at the mouth of the reservoir, thinner than before and brighter. \"The System showed me a ladder,\" he says, and his voice still reaches every ear without a mic, \"and it had you count the rungs. Tonight, the top rung came to us.\"" }
          - { tr: "Derken seni öne, halkanın içine çağırıyor. \"Çağrı'nın tek kuralı vardır,\" diyor yumuşacık bir sesle. \"Her yeni seçilmiş ilk yakıtını kendi ağzıyla adlandırır. Bak onlara: hangisi seni yukarı taşımak ister?\"", en: "Then he calls you forward, into the ring. \"The Calling has one rule,\" he says, soft as anything. \"Every new Chosen names their first fuel with their own mouth. Look at them. Which one wants to carry you up?\"" }
          - metin: { tr: "Öğretici'de onu müritlerinin gözü önünde ifşa etmiştin. Burada kimse hatırlamıyor gibi; ya da hatırlıyorlar da o gün de kehanete katılıp gitmiş.", en: "Back in the Tutorial, you exposed him in front of his flock. Nobody here seems to remember. Or they do, and that day got folded into the prophecy too." }
            kosul: { bayrak: "vahit_ifsa_edildi" }
          - metin: { tr: "Halkadakilerden biri seni Öğretici'deki çuvalın başından tanıyıp başıyla selam veriyor: o gün sağa geçenlerdendin. Burada bunun adı rütbe.", en: "Somebody in the ring recognizes you from the sack back in the Tutorial and nods: you were one of the ones who crossed to the right that day. Up here, that's a rank." }
            kosul: { bayrak: "secilmislere_katildi" }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Basamaklardaki yakıtın ortalama seviyesi 4, halkadakilerinki 26. Bunların hiçbiri kapı temizlememiş; aradaki fark başka bir yerden geliyor.", en: "Average level of the fuel on the steps: 4. Average in the ring: 26. None of these people clear Gates. That gap is coming from somewhere else." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "z̷arın içinde bir sayaç var, içinden geçen her kişide bir artıyor. sistem buna... katkı diyor. bu kelimeyi hiç sevmedim.", en: "t̷here's a counter inside that membrane. it ticks up by one for every person who goes through. the system calls it... a contribution. i never liked that word." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu triyaj değil. Triyajda kimse sırasını seve seve vermez.\"", en: "\"This isn't triage. In triage, nobody gives up their place gladly.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir isim söylersen... bir isim söylersen seni bir daha tanımam. Bilmiş ol.\"", en: "\"If you say a name... if you say a name, I won't know who you are anymore. Just so you know.\"" }
        secenekler:
          - id: "isim"
            etiket: { tr: "Basamaklardan bir yüz seç, adını söyle", en: "Pick a face on the steps. Say a name" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { merhamet: -6, insanlik: -8 }
              - itibar: { yukselenler: 10 }
              - iliski: { vahit: { baglilik: 8, saygi: 4 } }
              - xp_seviye: 30
              - bayrak: "yukselenler_ilk_yakit"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "İlk yakıtını kendi ağzınla adlandırdın; halka o adı senin ardından bir ağızdan tekrarladı.", en: "You named your first fuel out loud, and the whole ring said the name back after you." }
            sonraki: "yuk1_isim"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "\"İlk yakıtım benim. Kendimi adlandırıyorum.\"", en: "\"My first fuel is me. I name myself.\"" }
            gerekli: { stat: { wil: 50 } }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - dikkat: 4
              - ahlak: { insanlik: -2, merhamet: 3 }
              - itibar: { yukselenler: 12 }
              - iliski: { vahit: { saygi: 10, korku: 6 } }
              - bayrak: "yakit_reddi_goruldu"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Kendini ilk yakıtın olarak adlandırıp elini sarnıcın zarına soktun; Sistem seni yakmayı reddetti ve {yer:tepe} dilini yuttu.", en: "You named yourself as your first fuel and pushed your hand into the membrane. The System refused to burn you, and the whole hill went silent." }
            sonraki: "yuk1_kendin"
          - id: "ikircik"
            etiket: { tr: "\"Tırmanırım, ama kimseyi yakmam.\"", en: "\"I'll climb. I'm not burning anybody.\"" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { insanlik: 3, merhamet: 2 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { guven: -4, saygi: 4 } }
              - bayrak: "yukselenler_ikircikli"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Kimseyi adlandırmadan beyazı giydin; {yer:tepe|in} peygamberi yalnızca gülümseyip merdivenin sabırlı olduğunu söyledi.", en: "You wore the white but named no one. The prophet just smiled and said the ladder was patient." }
            sonraki: "yuk1_ikircik"
          - id: "casus"
            etiket: { tr: "Kabul et, gördüğün her şeyi dışarı taşı", en: "Say yes. Carry everything you see back out" }
            goster: { bayrak_yok: "uye_yukselenler" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { duzen: -3, insanlik: 1 }
              - iliski: { vahit: { guven: 3 } }
              - bayrak: "yukselenler_casus"
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 6, max: 12 } }
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Maske niyetine beyaz giydin; {yer:tepe|in} sırları cebinde yokuştan aşağı indi.", en: "You wore the white like a mask, and the hill's secrets walked down in your pockets." }
            sonraki: "yuk1_casus"
          - id: "cik"
            etiket: { tr: "Cübbeyi sarnıca at, aşağı in", en: "Toss the robe in the reservoir. Walk down" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - itibar: { yukselenler: -8 }
              - iliski: { vahit: { guven: -6, saygi: 2 } }
              - hafiza: { npc: "vahit", id: "olay:yukselenler_1_cagri", agirlik: -20 }
              - bayrak: "yukselenler_reddedildi"
            kronik: { tr: "Cübbeyi sarnıcın zarına fırlattın; Kapı onu bir nefeste yuttu.", en: "You threw the white robe into the membrane, and the Gate swallowed it in one breath." }
            sonraki: "yuk1_cikis"

      - id: "yuk1_isim"
        yer: "tepe"
        paragraflar:
          - { tr: "Gözlerin basamaklarda gezinip bir yüzde takılıyor: saçında hâlâ {yer:kordon|in} tuzunu taşıyan yaşlı bir adam. Bakışını yakalayınca gülümsüyor. Seçilmek bu yüzü öyle aydınlatıyor ki görünce midene taş oturuyor.", en: "Your eyes move over the steps and land on one face: an old man with sea salt still in his hair. He catches you looking and smiles, and the way being chosen lights him up sits in your stomach like a stone." }
          - { tr: "Adam adını söylüyor, sen de tekrarlıyorsun. Halka da bir ağızdan yineleyince isim sarnıcın taş duvarlarında üç kez yankılanıyor.", en: "He tells you his name. You say it back. The ring repeats it in one voice, and the name echoes three times off the reservoir's stone walls." }
          - { tr: "Adam halkanın beyaz tarafını gösteriyor: \"Torunum orada. Ben yanınca o tırmanacak. Sağ ol evladım, gerçekten.\"", en: "\"My granddaughter's in there,\" the old man tells you, pointing at the white side of the ring. \"When I burn, she climbs. Thank you. Really.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Katkı ön kaydı oluşturuldu]", en: "[Contribution pre-registered]" }
            satirlar:
              - { tr: "Alıcı: {oyuncu}. Teslim tarihi: belirsiz.", en: "Recipient: {oyuncu}. Delivery date: TBD." }
              - { tr: "Teşekkürler.", en: "Thank you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ satır... yazı tipi de biçimi de doğru, ama imzası yok. sistem her satırını imzalar. bunu kim yazdı?", en: "t̷hat line... the font's right. the format's right. there's no signature. the system signs every line it writes. so who wrote that one?" }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Adamın seviyesi 2. Torunu dediği kız halkanın arka sırasında duruyor, seviyesi 19. Gözünü bir kez olsun dedesine çevirmiyor.", en: "The old man's level 2. The girl he called his granddaughter stands at the back of the ring, level 19. Her eyes never once turn toward him." }
        secenekler:
          - id: "sik"
            etiket: { tr: "Adamın elini sık, anlaşma tamam", en: "Shake his hand. Deal's done" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 2 }
              - iliski: { vahit: { baglilik: 3 } }
            kronik: { tr: "Yakıtının elini sıkıp teşekkürünü kabul ettin.", en: "You shook your fuel's hand and accepted his thanks." }
            sonraki: "@akis"
          - id: "torun"
            etiket: { tr: "Kıza git: \"Deden için ne yaptın?\"", en: "Go to the girl: \"What did you do for him?\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { vahit: { guven: -2 } }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Yakıtının torununa dedesinin adını söylettin; kızın dudakları titredi.", en: "You made your fuel's granddaughter say his name. Her lips shook when she did." }
            sonraki: "yuk1_torun"
          - id: "geri_al"
            etiket: { tr: "Vazgeç, adını ona geri ver", en: "Take it back. Give him his name back" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { yukselenler: -4 }
              - iliski: { vahit: { guven: -4, saygi: 2 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: -15 }
            kronik: { tr: "Sarnıcın önünde bir isim söyleyip geri aldın; {yer:tepe} bunu ilk tereddüdün diye bir kenara yazdı.", en: "You said a name to the reservoir and then took it back. The hill wrote it down as your first hesitation." }
            sonraki: "@akis"

      - id: "yuk1_torun"
        yer: "tepe"
        paragraflar:
          - { tr: "Kız önce sana, sonra beyaz cübbesinin yakasına bakıyor. \"Hiçbir şey yapmadım,\" diyor. \"Yapmama gerek yok. Ben seçildim.\"", en: "The girl looks at you, then down at the collar of her white robe. \"I didn't do anything,\" she says. \"I don't have to. I was chosen.\"" }
          - { tr: "Ama dedesinin adını ağzına alınca dudakları titremeye başlıyor; söylemeyi unutmuş gibi, uzun zamandır kimse ondan bunu istememiş gibi.", en: "But when she says her grandfather's name, her lips shake. Like she forgot how. Like nobody's asked her to say it in a long time." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu orada bırak, söz senin değil", en: "Leave her there. It's not your call" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "Bir torunu dedesinin ateşiyle baş başa bıraktın.", en: "You left a granddaughter alone with her grandfather's fire." }
            sonraki: "@akis"
          - id: "dedene_git"
            etiket: { tr: "\"Bu gece dedenin yanında uyu.\"", en: "\"Sleep next to him tonight.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { vahit: { guven: -1 } }
            kronik: { tr: "Bir kıza son gecesini dedesinin yanında geçirmesini söyledin.", en: "You told a girl to spend one last night beside her grandfather." }
            sonraki: "@akis"

      - id: "yuk1_kendin"
        yer: "tepe"
        paragraflar:
          - { tr: "Kimse önünü kesmeden sarnıcın ağzına yürüyüp elini zarın içine daldırıyorsun. Ne soğuk ne sıcak. Yalnız bir şeyin seni tarttığını hissediyorsun.", en: "Nobody stops you. You walk to the mouth of the reservoir and push your hand into the membrane. It isn't cold. It isn't warm. You can feel something weighing you." }
          - { tr: "Derken zar irkilip geri çekiliyor. Süt beyazı yüzeyde bir dalga yayılıp kenarlara çarpıyor ve ağızdaki lokmayı tükürür gibi elini dışarı itiyor.", en: "Then the membrane flinches. A ripple runs across the milk-white surface, slaps the edges, and pushes your hand back out, like a mouth spitting out a bite." }
          - { tr: "Halka buz kesiyor. Basamaklardaki yakıttan biri ağlamaya başlıyor, ardından bir başkası. {npc:vahit|in} yüzünden önce korku geçiyor, peşinden o tanıdık açlık. \"Sistem,\" diye fısıldıyor, \"sahip olamadığını yakmaz.\"", en: "The ring goes silent. Somebody on the steps starts crying, then somebody else. Fear crosses {npc:vahit|pos} face first, then that old familiar hunger. \"The System,\" he whispers, \"won't burn what it can't own.\"" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Katkı reddedildi]", en: "[Contribution rejected]" }
            satirlar:
              - { tr: "Taşıyıcı sınıflandırılamadı.", en: "Carrier could not be classified." }
              - { tr: "Lütfen tekrar denemeyin.", en: "Please do not try again." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu bir daha yapma. ben de oradaydım, senin içinde. o şey ikimizi birden tarttı ve beni... tanıdı.", en: "d̷on't ever do that again. i was in there. inside you. that thing weighed both of us, and it... recognized me." }
        secenekler:
          - id: "yerine"
            etiket: { tr: "Elini çek, sessizce yerine dön", en: "Pull your hand back. Quietly take your place" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "Bir mucize gösterip sessizce halkadaki yerine döndün.", en: "You worked a miracle and then quietly stepped back into the ring." }
            sonraki: "@akis"
          - id: "kimse"
            etiket: { tr: "Basamaklara dön: \"Kimse yanmak zorunda değil.\"", en: "Turn to the steps: \"Nobody has to burn.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { yukselenler: -2 }
              - iliski: { vahit: { guven: -3 } }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "{yer:tepe|in} ortasında durup kimsenin yanmak zorunda olmadığını söyledin; o gece birkaç kişi alnındaki külü sildi.", en: "In the middle of the hill, you said nobody had to burn. A few people wiped off their ash that night." }
            sonraki: "@akis"
          - id: "diz"
            etiket: { tr: "Bırak diz çöksünler", en: "Let them kneel" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - yozlasma: 2
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { baglilik: 6 } }
            kronik: { tr: "Yüzlerce insan önünde diz çöktü; sen hiçbirini kaldırmadın.", en: "Hundreds of people knelt in front of you, and you didn't tell them to stand." }
            sonraki: "@akis"

      - id: "yuk1_ikircik"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} gülümsüyor. \"İlk gece herkes böyle der,\" deyip cübbeyi kendi elleriyle omuzlarına yerleştiriyor. \"Merdiven sabırlıdır kardeşim, sen sabırlı olmasan da.\"", en: "{npc:vahit} smiles. \"Everybody says that the first night,\" he tells you, and settles the robe on your shoulders with his own hands. \"The ladder's patient, friend. Even if you aren't.\"" }
          - { tr: "Gece biterken gözün rasathanenin içindeki kara tahtaya takılıyor: seçilmişlerin adları, her birinin altında da küçük, düzgün harflerle yazılmış başka bir ad. Senin adının altında da bir isim var; oysa sen ağzını açıp hiçbir isim söylemedin.", en: "As the night winds down, you look at the chalkboard inside the observatory: the names of the Chosen, and under each one, in neat little letters, another name. There's a name under yours too. You never said it." }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Tebeşir tozu taze. Adının altındaki isim basamaklarda oturan sarı yağmurluklu kadına ait: seviye 3, iki çocuk annesi. Çocukların ikisi de yanında değil.", en: "The chalk dust is fresh. The name under yours belongs to a woman on the steps in a yellow raincoat. Level 3. Two kids, and neither one of them is with her." }
        secenekler:
          - id: "sil"
            etiket: { tr: "Tahtadaki adı sil", en: "Wipe the name off the board" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { vahit: { guven: -3 } }
            kronik: { tr: "Tahtada adının altına yazılan yakıtı kendi elinle sildin.", en: "You wiped the fuel they'd written under your name off the board with your own hand." }
            sonraki: "@akis"
          - id: "gormezden"
            etiket: { tr: "Görmezden gel, bu gece değil", en: "Look away. Not tonight" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 1 }
            kronik: { tr: "Adının altına yazılan yakıtı gördün, gözünü kaçırdın.", en: "You saw the fuel written under your name and looked away." }
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "Sarı yağmurluklu kadını bulup uyar", en: "Find the woman in the yellow raincoat. Warn her" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 4, max: 9 } }
            kronik: { tr: "{yer:tepe|de} senin adına yakılacak sarı yağmurluklu kadını gece yarısı bulup uyardın.", en: "In the middle of the night you found the woman in the yellow raincoat they meant to burn in your name, and warned her." }
            sonraki: "@akis"

      - id: "yuk1_casus"
        yer: "tepe"
        paragraflar:
          - { tr: "Cübbeyi giyer giymez gözlerin kayda geçiyor: rasathanenin üç girişi, sarnıca inen yirmi iki basamak, nöbet değişimleri, kara tahtadaki sayılar. Beyaz insanı görünmez kılar; burada kimse beyazın içindekine bakmaz, yalnız beyazı görür.", en: "You put on the robe and your eyes start taking notes: the observatory's three entrances, the twenty-two steps down to the reservoir, the watch rotations, the numbers on the chalkboard. White makes you invisible. Up here, people don't look at who's inside the white, just at the white." }
          - { tr: "Gecenin sonunda {npc:vahit} sana sarılıp kulağına eğiliyor. \"Yalan söyleyeni duyarım,\" diye fısıldıyor. Kalbin bir an tekler gibi. \"Öyleyse bana ömür boyu yalan söyle. İnanmakla aynı kapıya çıkar.\"", en: "At the end of the night {npc:vahit} hugs you and leans in close to your ear. \"I can hear when somebody's lying,\" he whispers. Your heart stops for a beat. \"So lie to me forever, then. It's the same thing as believing.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷uyabiliyor mu? bilmiyorum. ama duyuyormuş gibi yapmayı çok iyi beceriyor. bazen bu daha tehlikelidir.", en: "c̷an he hear it? i don't know. but he's very, very good at acting like he can. sometimes that's worse." }
        secenekler:
          - id: "siginaga"
            etiket: { tr: "Gördüklerini Sığınak'a yaz", en: "Write it all up for the Haven Council" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { siginak: 4 }
            kronik: { tr: "{yer:tepe|in} haritasını çıkarıp Sığınak Konseyi'ne teslim ettin.", en: "You mapped the hill and handed it over to the Haven Council." }
            sonraki: "@akis"
          - id: "sessiz_aga"
            etiket: { tr: "Sessiz Ağ'a {yer:tepe|in} sinyal saatlerini ver", en: "Give the Quiet Network the hill's signal times" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - itibar: { sessiz_ag: 4 }
              - bilgi: "yakit_katkisi"
            kronik: { tr: "{yer:tepe|in} gece sinyallerini Sessiz Ağ'a ilettin; radyocular sayacın neyi saydığını çözdü.", en: "You gave the hill's night signals to the Quiet Network. The radio crew worked out what the counter was counting." }
            sonraki: "@akis"
          - id: "kendine"
            etiket: { tr: "Kimseye söyleme, kendine sakla", en: "Tell no one. Keep it for yourself" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - bilgi: "yakit_katkisi"
            kronik: { tr: "{yer:tepe|in} sırlarını kimseyle paylaşmayıp hepsini kendine sakladın.", en: "You shared the hill's secrets with no one. You kept them, all of them, for yourself." }
            sonraki: "@akis"

      - id: "yuk1_cikis"
        yer: "tepe"
        paragraflar:
          - { tr: "Cübbe sarnıcın zarına düşüyor, zar onu bir nefeste yutuyor. Bir saniye geçmeden, herkesin gözü önünde, göğün en yakın panelinde küçük bir satır beliriyor.", en: "The robe drops onto the membrane and the membrane swallows it in one breath. A second later, in front of everyone, a little line blinks onto the nearest sky panel." }
          - { tr: "Halkada kımıldayan yok. {npc:vahit} başını yana eğip sesini hiç yükseltmeden konuşuyor: \"Merdiveni reddeden basamak olur. Git kardeşim. Seni yine çağıracağız.\"", en: "The ring doesn't move. {npc:vahit} tilts his head, and his voice never rises. \"The one who refuses the ladder becomes a rung. Go on, friend. We'll call you again.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Katkı alındı: 1 beyaz keten]", en: "[Contribution received: 1 white linen]" }
            satirlar:
              - { tr: "Teşekkürler.", en: "Thank you." }
        secenekler:
          - id: "seslen"
            etiket: { tr: "Basamaklara seslen: \"Benimle inin.\"", en: "Call to the steps: \"Come down with me.\"" }
            zar: { stat: "cha", zorluk: 30, tek: true, basarisiz: "yuk1_cikis_yalniz", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { itibar: { yukselenler: -2 } }] }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { yukselenler: -6 }
              - iliski: { vahit: { korku: 4, guven: -4 } }
              - degisken: { hayatta_kalan: 3 }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "{yer:tepe|den} inerken basamaklardakilere dönüp seslendin: \"Benimle inin.\"", en: "On your way down off the hill, you turned and called to the people on the steps: \"Come down with me.\"" }
            sonraki: "@akis"
          - id: "in"
            etiket: { tr: "Arkana bakmadan in", en: "Walk down without looking back" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
            kronik: { tr: "{yer:tepe|i} arkana bakmadan bıraktın; ilahi yokuşun dibine kadar peşinden geldi.", en: "You left the hill without looking back. The hymn followed you all the way to the bottom." }
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "{npc:vahit|e} dön: \"Bu sarnıcı kapatacağım.\"", en: "Turn to {npc:vahit}: \"I'll close this reservoir.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { vahit: { korku: 4, saygi: 4 } }
              - bayrak: "sarnic_yemini"
            kronik: { tr: "Peygamberin gözünün içine bakıp sarnıcını kapatacağını söyledin.", en: "You told a prophet to his face that you'd close his reservoir." }
            sonraki: "@akis"

      - id: "yuk1_cikis_yalniz"
        yer: "tepe"
        paragraflar:
          - { tr: "Sesin taş basamaklara çarpıp sana geri dönüyor. Kımıldayan olmuyor; bir tek küçük bir çocuk ayağa kalkıyor, o da annesi bileğinden çekip yeniden oturtana kadar.", en: "Your voice bounces off the stone steps and comes back to you. Nobody moves. One little kid stands up, and his mother yanks him back down by the wrist." }
          - { tr: "İlahi yeniden, bu kez daha gür başlıyor. Yokuşu yalnız inerken ilahinin bir bölümünün senin için söylendiğini anlıyorsun.", en: "The hymn starts back up, louder this time. You walk down the hill alone, and part of that hymn, you realize, is being sung about you." }
        secenekler:
          - id: "yut"
            etiket: { tr: "Yutkun ve yürü", en: "Swallow it. Keep walking" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Peşinden tek kişi gelmedi; {yer:tepe} yine de senin için bir ilahi yazdı.", en: "Nobody followed you. The hill wrote a hymn about you anyway." }
            sonraki: "@akis"
          - id: "cocuk"
            etiket: { tr: "Ayağa kalkan çocuğun yüzünü aklına kazı", en: "Burn that kid's face into your memory" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - stat: { wil: 1 }
            kronik: { tr: "Basamaklarda ayağa kalkan tek çocuğun yüzünü belleğine kazıdın.", en: "You burned the face of the one kid who stood up on those steps into your memory." }
            sonraki: "@akis"

      - id: "yuk1_kul"
        yer: "tepe"
        paragraflar:
          - { tr: "Alnındaki kül soğuk, yağlı. Gri bir kalabalığa karışıp yokuşu tırmanıyorsun. Kimse yüzüne bakmıyor, çünkü yakıt yakıta bakmaz; bütün gözler yukarıda, kubbenin yarığından sızan beyaz ışıkta.", en: "The ash on your forehead is cold and greasy. You climb the hill in a gray crowd, and nobody looks at you, because fuel doesn't look at fuel. Everybody's looking up at the white light leaking out of the split dome." }
          - { tr: "Basamakta yanına oturan kadın {yer:kordon|den} gelmiş. Halkanın beyaz tarafını gösteriyor: \"Oğlum orada. Ben yandıkça o yükseliyor. Annelik dediğin başka ne ki?\"", en: "The woman who sits down next to you on the steps is from {yer:kordon}. \"My boy's in there,\" she says, pointing to the white side of the ring. \"Every time I burn a little, he climbs. What else is being a mother?\"" }
          - { tr: "Rasathanenin içindeki kara tahta buradan görünüyor: seçilmişlerin adları, her birinin altında tebeşirle yazılmış \"yakıtları\". Kadının adı oğlununkinin altında. Hemen yanında, kenara sıkıştırılmış yeni bir satır: \"Anomali — gelecek.\"", en: "From here you can see the chalkboard inside the observatory: the names of the Chosen, and under each one, chalked in, their \"fuel.\" The woman's name sits under her son's. Right next to it, off to the side, there's a fresh line: \"The anomaly — coming.\"" }
          - { tr: "Derken {npc:vahit} vaazını yarıda kesiyor. Bakışları basamaklarda gezinip sende duruyor. \"Sistem seçilmişini yakıtın arasına saklamış,\" diyor yumuşacık, \"bizi sınamak için.\"", en: "Then {npc:vahit} stops mid-sermon. His eyes travel over the steps and stop on you. \"The System hid its Chosen among the fuel,\" he says softly, \"to test us.\"" }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "En alt basamağa, tam zarın kenarına küçük çentikler kazınmış; yüzlercesi. Her çentiğin yanında bir tarih var, en eskisi Entegrasyon'dan üç gün sonrası.", en: "There are tiny notches cut into the bottom step, right at the edge of the membrane. Hundreds. A date next to each one. The oldest is three days after Integration." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni gördü, külün altından. ya gerçekten bir şey duyuyor ya da bakmayı çok, çok iyi biliyor.", en: "h̷e saw you. right through the ash. either he really does hear something, or he's very, very good at looking." }
        secenekler:
          - id: "aciga"
            tur: "aciga_vur"
            etiket: { tr: "Külü sil, gerçek seviyeni göster", en: "Wipe the ash. Show them your real level" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { yukselenler: 10 }
              - iliski: { vahit: { saygi: 10, baglilik: 6 } }
            kronik: { tr: "Yakıtın arasından doğrulup gerçek seviyeni gösterdin; {yer:tepe} o gün seni kendi tanrısı ilan etti.", en: "You rose up out of the fuel and showed your real level. That day the hill declared you its god." }
            sonraki: "yuk1_kul_ifsa"
          - id: "egil"
            tur: "gizle"
            etiket: { tr: "Başını eğ, yakıt kal ve öğren", en: "Keep your head down. Stay fuel and learn" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: 2, duzen: -1 }
              - bilgi: "yakit_katkisi"
              - iliski: { vahit: { saygi: -2 } }
              - tohum: { olay: "vahit_secilmisler", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Başını eğip yakıtın nasıl yandığını yakıtın kendisinden öğrendin.", en: "You kept your head down and learned how fuel burns from the fuel itself." }
            sonraki: "@akis"
          - id: "indir"
            etiket: { tr: "Basamaktakileri ayağa kaldır, aşağı indir", en: "Get the steps on their feet. Lead them down" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -3 }
              - degisken: { hayatta_kalan: 4 }
              - itibar: { yukselenler: -10, siginak: 3 }
              - iliski: { vahit: { guven: -8, korku: 6 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: -30 }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Yakıtın arasından kalkıp kırk kişiyi {yer:tepe|den} indirdin; peygamber önüne geçmeye cesaret edemedi.", en: "You stood up out of the fuel and led forty people off the hill. The prophet didn't dare stop you." }
            sonraki: "yuk1_kul_inis"

      - id: "yuk1_kul_ifsa"
        yer: "tepe"
        paragraflar:
          - { tr: "Külü başparmağınla silip sakladığın ne varsa salıveriyorsun. Hava ağırlaşıyor. Sarnıcın zarı geri çekiliyor, o da senden bir adım uzaklaşmak istermiş gibi.", en: "You wipe the ash off with your thumb and let go of everything you've been hiding. The air goes heavy. The membrane in the reservoir pulls back, like it wants to take a step away too." }
          - { tr: "Önce basamaklar, sonra halka susuyor. {npc:vahit} gözleri yaşlı, kollarını iki yana açıyor: \"Söylemiştim! Size söylemiştim! Yakıtın içinden çıkan ateş!\"", en: "The steps go quiet. The ring goes quiet. {npc:vahit} throws his arms wide, eyes wet. \"I told you. I told you all! Fire out of the fuel itself!\"" }
          - { tr: "Omzundan çıkardığı kendi beyaz cübbesini sana uzatıyor. \"Çağrı'nın en üst basamağı,\" diyor. \"Bu gece kimseyi adlandırmana gerek yok. Sen zaten bir isimsin.\"", en: "He holds out a white robe, the one off his own shoulders. \"The top rung of the Calling,\" he says. \"You don't have to name anyone tonight. You're already a name.\"" }
        secenekler:
          - id: "giy"
            etiket: { tr: "Cübbesini giy", en: "Put on his robe" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { insanlik: -3, duzen: 2 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { baglilik: 6 } }
              - unvan: "secilmislerin_secilmisi"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Peygamberin sırtından çıkardığı cübbeyi giyip Seçilmişlerin Seçilmişi oldun.", en: "You put on the prophet's own robe and became the Chosen of the Chosen." }
            sonraki: "@akis"
          - id: "kulu_sil"
            etiket: { tr: "\"Önce herkesin külünü sil.\"", en: "\"First, wipe the ash off everyone.\"" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { merhamet: 5, insanlik: 1 }
              - itibar: { yukselenler: 2 }
              - iliski: { vahit: { guven: -2, saygi: 6 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yakit_sarti"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Beyazı ancak basamaklardaki herkesin alnından kül silindikten sonra giydin.", en: "You only put on the white once every forehead on the steps had been wiped clean." }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "Cübbeyi geri it: \"Ben kimsenin basamağı değilim.\"", en: "Push it back: \"I'm nobody's rung.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 6, guven: -3 } }
              - bayrak: "yukselenler_reddedildi"
            kronik: { tr: "Bir tarikat seni tanrı ilan ettiğinde cübbesini geri itip kimsenin basamağı olmadığını söyledin.", en: "When a cult declared you its god, you pushed its robe back and said you were nobody's rung." }
            sonraki: "@akis"

      - id: "yuk1_kul_inis"
        yer: "tepe"
        paragraflar:
          - { tr: "Ayağa kalkıp basamaklardakilere tek bir cümle söylüyorsun. Önce biri doğruluyor, ardından beşi, derken kırkı birden; gri bir ırmak gibi yokuştan aşağı akmaya başlıyorlar.", en: "You get to your feet and say one sentence to the people on the steps. First one stands, then five, then forty, and they pour down the hill like a gray river." }
          - { tr: "Beyazlardan kımıldayan yok. {npc:vahit} sarnıcın ağzında, ellerini önünde kavuşturmuş seni izliyor. \"Al onları,\" diyor. \"Sistem verir de alır da. Bu gece senin elinden verdi.\"", en: "The white robes don't move. {npc:vahit} stands at the mouth of the reservoir, hands folded in front of him, watching you. \"Take them,\" he says. \"The System gives and takes. Tonight it gave through you.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onları Sığınak'ın kapısına götür", en: "Walk them to the Haven Council's door" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "{yer:tepe|den} indirdiğin kırk kişiyi Sığınak'ın kapısına kadar götürüp teslim ettin.", en: "You walked the forty from the hill to the Haven Council's door and handed them over." }
            sonraki: "@akis"
          - id: "kendi"
            etiket: { tr: "Onları kendi kanadının altına al", en: "Take them under your own wing" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - ordu: { lonca_avcisi: 2 }
            kronik: { tr: "{yer:tepe|in} yakıtını kendi insanların yaptın; sana da {yer:tepe|e} baktıkları gözle baktılar.", en: "You made the hill's fuel into your own people. They didn't look at you any differently than they'd looked at the hill." }
            sonraki: "@akis"
          - id: "secsinler"
            etiket: { tr: "\"Nereye gideceğinize siz karar verin.\"", en: "\"You decide where you go.\"" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "{yer:tepe|den} indirdiğin kırk kişiye nereye gideceklerine kendilerinin karar vermesini söyledin.", en: "You told the forty you'd brought off the hill to decide for themselves where they'd go." }
            sonraki: "@akis"

      - id: "yuk1_ret"
        paragraflar:
          - { tr: "On Üç tepsiyi geri almıyor; cübbeyle kâseyi yan yana eşiğine bırakıyor. \"Peygamber 'reddedecek' dedi,\" diyor. \"Ardından da 'gelecek' dedi.\"", en: "Thirteen doesn't take the tray back. He sets it on your step, robe and bowl side by side. \"The Prophet said you'd refuse,\" he says. \"Then he said you'd come.\"" }
          - { tr: "Fenerler yokuşa doğru uzaklaşıp gidiyor. Gece boyunca {yer:tepe|den} süzülen ilahi kulağından gitmiyor; ritmi nefesine ayak uydurmaya çalışıyor sanki.", en: "The lanterns move off toward the hill. All night you can hear the hymn coming down from {yer:tepe}. Its rhythm seems to be trying to match your breathing." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Cübbeyi ve külü ateşe at", en: "Throw the robe and the ash in the fire" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
            kronik: { tr: "{yer:tepe|in} cübbesini kendi ateşinde yaktın.", en: "You burned the hill's robe in your own fire." }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Cübbeyi katlayıp bir kenara koy", en: "Fold the robe. Put it away" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - esya: { beyaz_keten: 1 }
            kronik: { tr: "Reddettiğin cübbeyi atmayıp katlayarak dolabına kaldırdın.", en: "You didn't throw out the robe you refused. It waited, folded, in your closet." }
            sonraki: "@akis"
          - id: "pesinden"
            etiket: { tr: "Fenerlerin peşinden git", en: "Follow the lanterns" }
            etkiler:
              - bolge: "tepe"
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { vahit: { saygi: 2 } }
            kronik: { tr: "Önce geri çevirdin, ardından fenerlerin peşine takıldın; peygamber yine haklı çıktı.", en: "You refused, and then you followed the lanterns. The prophet was right again." }
            sonraki: "yuk1_tepe"

      - id: "yuk1_inis"
        paragraflar:
          - { tr: "Tek bir cümle kurman yetiyor: On Üç tepsiyi bırakıp yokuşa koşuyor. Bir saat sonra fenerler geri geliyor, bu kez önlerinde yalınayak, baştan aşağı beyazlar içinde {npc:vahit} yürüyor.", en: "You say one sentence. Thirteen drops the tray and runs for the hill. An hour later the lanterns come back, and this time {npc:vahit} is walking in front of them, barefoot, all in white." }
          - { tr: "Eşiğinin önüne diz çöküyor. \"Sistem bana 'git' dedi,\" diyor titrek bir sesle. \"'O tırmanmaz, ona tırmanılır' dedi.\" Arkasındaki altı kişi de dizlerinin üstüne iniyor; sokağın pencerelerinde birer birer yüzler beliriyor.", en: "He kneels at your doorstep. \"The System told me 'go,'\" he says, voice shaking. \"It said, 'That one doesn't climb. That one gets climbed.'\" The six behind him kneel too, and faces start showing up in the windows up and down the street." }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Yokuşun taşlarında yalınayak yürümekten ayakları kan içinde kalmış. Gösteri mi bu, inanç mı? Bazen ikisi de aynı acıyı verir.", en: "His feet are bleeding. He walked the hill's stones barefoot. Showmanship or faith? Sometimes they hurt exactly the same." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷istem ona bir şey demedi. ya da dedi de ben duymadım. hangisi daha kötü, bilmiyorum.", en: "t̷he system didn't say anything to him. or it did, and i didn't hear it. i don't know which one's worse." }
        secenekler:
          - id: "onunde"
            etiket: { tr: "Kabul et, {yer:tepe|e} onun önünde çık", en: "Accept. Walk up the hill ahead of him" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - bolge: "tepe"
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { yukselenler: 10 }
              - iliski: { vahit: { baglilik: 8 } }
              - unvan: "secilmislerin_secilmisi"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Peygamberi kapında diz çöktürdükten sonra tepesine onun önünde çıktın.", en: "You had a prophet kneel at your door and then walked up his hill ahead of him." }
            sonraki: "@akis"
          - id: "sart"
            etiket: { tr: "\"Şartım var: yakıt sırası kalkacak.\"", en: "\"One condition: the fuel line goes away.\"" }
            etkiler:
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { merhamet: 4, insanlik: 1 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { guven: -2, saygi: 6 } }
              - bayrak: "yakit_sarti"
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 20, max: 35 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Yükselenler'e katılmanın bedeli olarak yakıt sırasının kaldırılmasını şart koştun.", en: "Your price for joining the Ascended was an end to the fuel line." }
            sonraki: "@akis"
          - id: "kalk"
            etiket: { tr: "\"Kalk. Bir daha kapıma gelme.\"", en: "\"Get up. Don't come to my door again.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - itibar: { yukselenler: -6 }
              - iliski: { vahit: { korku: 6, guven: -4 } }
              - bayrak: "yukselenler_reddedildi"
            kronik: { tr: "Kapında diz çöken peygamberi geri yolladın; yokuşu kanlı ayaklarıyla yeniden tırmandı.", en: "You sent the kneeling prophet away from your door. He climbed his hill again on bleeding feet." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 2: YAKIT LİSTESİ
  - id: "yukselenler_2_yakit_listesi"
    perde: [2]
    gun: { min: 80, max: 178 }
    kosul: { gorev: { zincir_yukselenler: "basla" } }
    agirlik: 8
    etiketler: ["yukselenler", "zincir", "npc", "ahlak"]
    gerilim: 3
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Kırmızı kalem", en: "The red pen" }
    sahne: "yuk2_defter"
    sahneler:
      - id: "yuk2_defter"
        yer: "tepe"
        paragraflar:
          - { tr: "Sabah kapını çalan mürit haberi getiriyor: Peygamber seni rasathanede bekliyormuş. Yokuşu tırmanırken {yer:tepe|in} pencerelerinden beyaz yüzler seni selamlıyor.", en: "A disciple knocks on your door in the morning: the Prophet is waiting for you at the observatory. You climb the hill, and white faces greet you from the windows of {yer:tepe}." }
          - { tr: "Kubbenin altında, eskiden yıldız haritalarının asılı durduğu duvara şimdi tek bir defter çakılmış: kalın, mavi kapaklı bir muhasebe defteri. Sayfaları açık, kenarından aşağı sarkıyor.", en: "Under the observatory dome, on the wall where the star charts used to hang, there's one ledger nailed open. A fat, blue-covered accounting book, its pages sagging over the edge." }
          - { tr: "Her satırda bir ad, bir seviye, bir adres. Başlıkta {npc:vahit|in} yuvarlak, sakin el yazısı okunuyor: \"BÜYÜK AYİN · İLK MEVSİM · YAKIT: 300\".", en: "Every line has a name, a level, an address. The heading is in {npc:vahit|pos} round, calm handwriting: \"THE GREAT RITE · FIRST SEASON · FUEL: 300\"." }
          - metin: { tr: "Seviyeler doğrudan Kasaba Çekirdeği'nden okunmuş, her satırın yanına Çekirdek'in mavi damgası basılmış. Şehrin bütün seviyeleri artık bu kubbenin altında.", en: "The levels were read straight off the Town Core. Every line carries the Core's blue stamp. Every level in the city lives under this dome now." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Seviyeleri sokak sokak dolaşan müritler toplamış; kapı kapı gezip gülümseyerek \"Sistem sizi merak ediyor\" demişler.", en: "The levels were collected by disciples going street by street, door to door, smiling, saying \"The System's curious about you.\"" }
            kosul: { bayrak_yok: "cekirdek_yukselenler" }
          - metin: { tr: "İlk sayfanın tamamı {yer:kordon|den}: düşen sahilden kaçan ailelerin adları, yanlarında da {yer:tepe|de} kurdukları çadırların numarası.", en: "The whole first page is from {yer:kordon}: the families who fled the fallen waterfront, listed with their tent numbers on the hill." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "{yer:kordon} düşmediği için defterde {yer:kordon|den} tek bir isim yok. {npc:vahit} bunu sana iltifat eder gibi söylüyor: \"Senin kurtardığın sahil bize yakıt vermedi.\"", en: "Because {yer:kordon} held, there isn't a single name from there in the ledger. {npc:vahit} says it to you like a compliment: \"The shore you saved didn't give us any fuel.\"" }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "Bir şartın vardı: yakıt sırası kalkacaktı. {npc:vahit} defteri gösterip omuz silkiyor. \"Sıra kalktı,\" diyor. \"Bu sıra değil, defter.\"", en: "You had one condition: the fuel line goes away. {npc:vahit} gestures at the ledger and shrugs. \"The line's gone,\" he says. \"This isn't a line. It's a ledger.\"" }
            kosul: { bayrak: "yakit_sarti" }
          - { tr: "On üçüncü satıra yine kurşun kalemle, yine sonradan eklenmiş bir ad: On Üç. Kendi el yazısıyla.", en: "On line thirteen, in pencil again, added later again: Thirteen. In his own handwriting." }
          - { tr: "{npc:vahit} sana kırmızı bir kalem uzatıyor. \"Mevsim dönerken Büyük Ayin yapılacak,\" diyor. \"Sayıyı Sistem bana dün gece söyledi. Ama imzayı senin elinden istiyor.\"", en: "{npc:vahit} holds out a red pen. \"When the season turns, there's the Great Rite,\" he says. \"The System gave me the number last night. But it wants the signature from your hand.\"" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Satırların %61'i seviye 1–3 arasında, %22'si altmış yaşın üstünde. Dokuz satırın yanında \"gönüllü\" yazıyor ve dokuzunda da el yazısı aynı.", en: "61% of the lines are level 1 to 3. 22% are over sixty. Nine lines say \"volunteer\" next to them, and all nine are in the same handwriting." }
          - kosul: { stat: { int: 50 } }
            metin: { tr: "Hesap kubbedeki kara tahtada duruyor: üç yüz yakıt, halkadaki kırk kişiye kişi başı ortalama iki seviye eder. Sana dokuz, peygambere on bir.", en: "The math is right there on the chalkboard under the dome: three hundred fuel works out to about two levels for each of the forty in the ring. Nine for you. Eleven for the Prophet." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷ırmızı kalem. sistem kalem kullanmaz; kalemi hep insanlar tutar. bunu sakın unutma, olur mu?", en: "a̷ red pen. the system doesn't use pens. it's always people holding the pen. don't ever forget that, okay?" }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu listede dört hastam var. Dördü de iyileşiyordu.\"", en: "\"Four of my patients are on that list. All four were getting better.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Önce fotoğrafını çek. Ne yapacağına sonra karar verirsin. Ama önce fotoğraf.\"", en: "\"Take a picture of it. Decide what to do after. But take the picture first.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O kalemi alırsan giderim. Bu sefer gerçekten.\"", en: "\"If you take that pen, I'm gone. For real this time.\"" }
        secenekler:
          - id: "imza"
            etiket: { tr: "Defteri imzala", en: "Sign the ledger" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -10 }
              - itibar: { yukselenler: 12 }
              - degisken: { hayatta_kalan: -4 }
              - xp_seviye: 40
              - bayrak: "yakit_listesi_imzalandi"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { baglilik: 8, guven: 6 } }
            kronik: { tr: "Üç yüz kişinin adının altına kırmızı kalemle imzanı attın.", en: "You signed your name in red ink under three hundred names." }
            sonraki: "yuk2_imza"
          - id: "gonullu"
            etiket: { tr: "Yalnız gönüllüleri bırak, gerisinin üstünü çiz", en: "Keep only the volunteers. Strike the rest" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -4, duzen: 2 }
              - itibar: { yukselenler: 4 }
              - bayrak: "yakit_gonulluler"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { saygi: 4, guven: -2 } }
            kronik: { tr: "Defterde yalnız gönüllüleri bıraktın; ne kadar çok gönüllü çıktığını o zaman gördün.", en: "You cut the fuel ledger down to volunteers only, and found out how many volunteers there were." }
            sonraki: "yuk2_gonullu"
          - id: "mahkum"
            etiket: { tr: "Masumları sil, yerlerine mahkûmları yaz", en: "Strike the innocent. Write in the prisoners" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -5, insanlik: -5 }
              - itibar: { yukselenler: 6, lonca: 2 }
              - bayrak: "yakit_mahkumlar"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { saygi: 6 } }
            kronik: { tr: "Masumların üstünü çizip yerlerine şehrin hücrelerindekileri yazdın.", en: "You struck the innocent from the fuel ledger and wrote the city's prisoners in their place." }
            sonraki: "yuk2_mahkum"
          - id: "hesap"
            tur: "gosteris"
            etiket: { tr: "Katkının hesabını herkesin önünde çıkar", en: "Work the contribution math. Out loud" }
            gerekli: { stat: { int: 55 } }
            etkiler:
              - dikkat: 3
              - bilgi: "yakit_katkisi"
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { vahit: { korku: 6, saygi: 4 } }
            kronik: { tr: "Yükselenler'in kutsal defterini herkesin önünde bir muhasebe tablosuna çevirdin.", en: "You turned the Ascended's holy ledger into a spreadsheet, in front of everyone." }
            sonraki: "yuk2_hesap"
          - id: "yak"
            etiket: { tr: "Defteri kubbenin altında yak", en: "Burn the ledger right under the dome" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 5, duzen: -3 }
              - itibar: { yukselenler: -15 }
              - degisken: { hayatta_kalan: 4 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - bayrak: "yakit_defteri_bozuldu"
              - iliski: { vahit: { guven: -12, korku: 6 } }
              - hafiza: { npc: "vahit", id: "olay:yukselenler_2_yakit_listesi", agirlik: -35 }
            kronik: { tr: "Defteri kubbenin altında ateşe verdin, beyaz cübbeni de orada bıraktın.", en: "You burned the Ascended's fuel ledger under the dome and left your white robe behind." }
            sonraki: "yuk2_yak"
          - id: "sizdir"
            etiket: { tr: "Defterin kopyasını gizlice dışarı çıkar", en: "Sneak a copy of the ledger out" }
            goster: { bayrak: "yukselenler_casus" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { siginak: 5 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "yakit_defteri_sizdi"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { guven: 2 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Yakıt defterini gece yarısı sayfa sayfa kopyaladın, kopyayı da gizlice {yer:tepe|den} kaçırdın.", en: "That night you copied the fuel ledger page by page and smuggled the copy off the hill." }
            sonraki: "yuk2_sizinti"

      - id: "yuk2_imza"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalemin ucu kâğıda değer değmez mürekkep kan gibi yayılıyor. Adını yazıyorsun: üç yüz ismin altında, hepsinden büyük tek bir isim.", en: "The pen touches the paper and the ink spreads like blood. You sign your name: one name under three hundred names, bigger than all of them." }
          - { tr: "Kubbenin yarığından göğün panellerinden biri görünüyor. Tam o anda panelde bir satır beliriyor; kubbenin altındaki kırk kişi aynı anda derin bir nefes çekiyor.", en: "Through the split in the dome you can see one of the sky panels. Right then a line blinks onto it, and forty people under the dome draw breath at the same time." }
          - { tr: "{npc:vahit} sessiz sessiz ağlıyor, mezuniyet töreninde çocuğunu izleyen bir baba gibi. On Üç defterin önüne gelip on üçüncü satıra dokunuyor, sonra dönüp sana teşekkür ediyor.", en: "{npc:vahit} is crying, quietly, the way a dad cries at a graduation. Thirteen stands in front of the ledger, touches line thirteen, and thanks you." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Liste onaylandı]", en: "[List approved]" }
            satirlar:
              - { tr: "Kayıt: 300. Durum: beklemede.", en: "Entries: 300. Status: pending." }
              - { tr: "Teşekkürler.", en: "Thank you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷ine imzasız. bu sefer yazı tipi bile biraz kaymış. biri sistem gibi konuşmaya çalışıyor; ya da sistem biri gibi.", en: "u̷nsigned again. the font's even a little off this time. somebody's trying to talk like the system. or the system's trying to talk like somebody." }
        secenekler:
          - id: "on_uc_ciz"
            etiket: { tr: "On Üç'ün satırını kırmızıyla çiz", en: "Strike Thirteen's line in red" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - bayrak: "on_ucuncu_cizildi"
              - iliski: { vahit: { guven: -2 } }
            kronik: { tr: "Üç yüz kişinin altına imzanı attın, ama on üçüncünün üstünü kırmızıyla çizdin.", en: "You signed off on three hundred people, but you struck the thirteenth in red." }
            sonraki: "@akis"
          - id: "kalem"
            etiket: { tr: "Kırmızı kalemi cebine koy", en: "Pocket the red pen" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 2 }
              - iliski: { vahit: { baglilik: 3 } }
            kronik: { tr: "İmzayı attığın kırmızı kalemi cebine koyup yanında taşıdın.", en: "You carried the red pen you signed the fuel ledger with." }
            sonraki: "@akis"
          - id: "as"
            etiket: { tr: "Defteri {yer:tepe|in} meydanına astır", en: "Have the ledger hung in the hill's square" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - dikkat: 2
              - itibar: { yukselenler: 4 }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Defteri, içindeki her adı herkes okusun diye meydanın ortasına astırdın.", en: "You had the fuel ledger hung in the square, every name in it out where anyone could read it." }
            sonraki: "@akis"

      - id: "yuk2_gonullu"
        yer: "tepe"
        paragraflar:
          - { tr: "Kırmızı kalemle satırların üstünü bir bir çizip en alta tek bir cümle ekliyorsun: \"Yalnızca kendi isteğiyle gelenler.\" {npc:vahit} omzunun üstünden okuyup başını sallıyor. \"Akıllıca,\" diyor. \"Sistem de istekliyi sever.\"", en: "You strike line after line in red and write one sentence at the bottom: \"Only those who come willingly.\" {npc:vahit} reads it over your shoulder and nods. \"Wise,\" he says. \"The System loves the willing too.\"" }
          - { tr: "Ertesi sabah rasathanenin önündeki kuyruk yokuşun dibine kadar uzanıyor: dört yüz kişi, defterin istediğinden fazla.", en: "The next morning, the line outside the observatory runs all the way to the bottom of the hill. Four hundred people. More than the ledger asked for." }
          - { tr: "Çocuğunu yükseltmek isteyen anneler, bir Kapı'da bütün ekibini kaybetmiş avcılar, \"bari bir işe yarayayım\" diyen yaşlılar. Gülümseyen bir genç: \"Ben de ışığa gitmek istiyorum.\" İşin en korkunç yanının istekliler olduğunu ancak şimdi anlıyorsun.", en: "Mothers who want to lift their kids. Hunters who lost their whole crew in a Gate. Old folks saying \"let me be useful for once.\" A smiling teenager: \"I want to go to the light too.\" The willing, you realize, are the worst part." }
        sezgiler:
          - kosul: { stat: { wis: 50 } }
            metin: { tr: "Bu insanların çoğu ölmek istemiyor, bir şeyin parçası olmak istiyor. {yer:tepe|in} onlara satabildiği tek parça da ölüm.", en: "Most of these people don't want to die. They want to be part of something. Death is the only part the hill has for sale." }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Kuyruğu dağıt, kimse gitmeyecek", en: "Break up the line. Nobody's going" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { yukselenler: -6 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { vahit: { guven: -6, saygi: 2 } }
            kronik: { tr: "Ölmeye gönüllü dört yüz kişinin kuyruğunu dağıtıp hepsini evine yolladın.", en: "You broke up a line of four hundred volunteers and sent every one of them home." }
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Her birine tek tek sor: \"Neden?\"", en: "Ask every single one: \"Why?\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - gun: 1
              - degisken: { hayatta_kalan: 3 }
              - iliski: { vahit: { saygi: 4, guven: -2 } }
            kronik: { tr: "Bütün bir gün dört yüz gönüllünün her birine neden ölmek istediğini sordun; yüz yirmisi cevap veremeden kuyruktan çıkıp gitti.", en: "You spent a whole day asking four hundred volunteers why they wanted to die. A hundred and twenty walked away before they could answer." }
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "Üç yüzünü say, gerisini eve yolla", en: "Count off three hundred. Send the rest home" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { baglilik: 4 } }
            kronik: { tr: "Gönüllü kuyruğunu üç yüzüncü kişide kesip gerisini gelecek mevsime bıraktın.", en: "You cut the line of volunteers off at three hundred and left the rest for next season." }
            sonraki: "@akis"

      - id: "yuk2_mahkum"
        yer: "tepe"
        paragraflar:
          - { tr: "İki gün sonra mahkûmlar zincirler içinde getiriliyor: yakıt diye satılan hırsızlar, Kapı'dan kaçmış avcılar, bir avcıyı bıçaklamış bir adam, bir de iksir çalan on dört yaşında bir çocuk.", en: "The prisoners show up two days later in chains. Thieves sold off as fuel, hunters who ran from a Gate, a man who knifed a hunter, and a fourteen-year-old kid who stole a potion." }
          - { tr: "Çocuk iksiri annesi için çalmış, annesi de dün ölmüş. Bunu sana kimse söylemiyor; sen sorunca çocuk anlatıyor, gözünü bir an olsun zincirinden kaldırmadan.", en: "The kid stole it for his mom, and his mom died yesterday. Nobody tells you this. You ask, and he tells you, without once looking up from his chains." }
        secenekler:
          - id: "cocuk"
            etiket: { tr: "Çocuğu listeden çıkar", en: "Take the kid off the list" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { guven: -1 } }
            kronik: { tr: "İksir çalan çocuğu mahkûm listesinden çıkardın, ötekileri olduğu gibi bıraktın.", en: "You pulled the kid who stole a potion off the prisoner list. You left the rest." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Listeyi olduğu gibi bırak", en: "Leave the list as it is" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - iliski: { vahit: { saygi: 2 } }
            kronik: { tr: "Annesi için bir iksir çalan on dört yaşındaki çocuğu yakıt listesinde bıraktın.", en: "You left a fourteen-year-old on the fuel list for a potion he stole for his mother." }
            sonraki: "@akis"
          - id: "secim"
            etiket: { tr: "Mahkûmlara seçtir: yakıt ya da sürgün", en: "Give the prisoners a choice: fuel or exile" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { saygi: 3, guven: -2 } }
            kronik: { tr: "Mahkûmları yakıtla sürgün arasında seçim yapmaya bıraktın; çoğu sürgünü, yedisi ateşi seçti.", en: "You let the prisoners choose between fuel and exile. Most chose exile. Seven chose the fire." }
            sonraki: "@akis"

      - id: "yuk2_hesap"
        yer: "tepe"
        paragraflar:
          - { tr: "Tebeşiri alıp herkesin gözü önünde katkıyı kara tahtaya döküyorsun: üç yüz yakıt, kırk seçilmiş, dağılım. Sayılar hiçbir vaazın çıkaramayacağı kadar gür konuşuyor.", en: "You pick up the chalk and write the contribution out on the board, in front of everybody: three hundred fuel, forty Chosen, the split. Numbers talk louder than any sermon." }
          - { tr: "Halkadaki kırk kişinin payı eşit değil: katkının yüzde yetmişini en içteki on iki kişi alıyor, yüzde otuzunu da tek başına {npc:vahit}. Kubbenin altında bir mırıltı dolaşmaya başlıyor.", en: "The forty in the ring don't get equal shares. The inner twelve take seventy percent of the contribution, and {npc:vahit} alone takes thirty. A murmur moves under the dome." }
          - { tr: "{npc:vahit|in} yüzündeki gülümseme hiç solmuyor. \"Elbette,\" diyor sakin sakin. \"Ağız önce doymalı ki konuşabilsin. Yoksa Sistem'in sesini size kim taşıyacak?\"", en: "{npc:vahit} never stops smiling. \"Of course,\" he says calmly. \"The mouth has to eat first so it can speak. Otherwise, who carries the System's voice to you?\"" }
        secenekler:
          - id: "esitle"
            etiket: { tr: "Payları eşitle, sonra imzala", en: "Even out the shares. Then sign" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -4, merhamet: -3 }
              - itibar: { yukselenler: 8 }
              - bayrak: "yakit_listesi_imzalandi"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { guven: -6, saygi: 6 } }
            kronik: { tr: "Yükselenler'in yakıtını hakça paylaştırdın; üç yüz kişinin altına yine de imzanı attın.", en: "You made the Ascended split their fuel fairly. You still signed off on three hundred people." }
            sonraki: "@akis"
          - id: "payini_al"
            etiket: { tr: "Peygamberin payını kendine yaz", en: "Write the Prophet's share over to yourself" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -3 }
              - xp_seviye: 20
              - itibar: { yukselenler: 6 }
              - bayrak: "yakit_listesi_imzalandi"
              - bayrak: "yukselenler_2_tamam"
              - iliski: { vahit: { korku: 8, baglilik: 4 } }
            kronik: { tr: "Peygamberin yakıt payını kendi adına geçirdin; {yer:tepe|in} ağzı o günden sonra senin için yedi.", en: "You signed the prophet's share of the fuel over to yourself. From then on, the hill's mouth ate for you." }
            sonraki: "@akis"
          - id: "kapat"
            etiket: { tr: "Hesabı tahtada bırak, defteri kapat", en: "Leave the math up. Close the ledger" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { yukselenler: -10 }
              - degisken: { hayatta_kalan: 3 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - bayrak: "yakit_defteri_bozuldu"
              - iliski: { vahit: { guven: -10, korku: 4 } }
            kronik: { tr: "Yükselenler'in kutsal defterini tahtada bir dolandırıcılık hesabı olarak bırakıp beyazı çıkardın.", en: "You left the Ascended's holy ledger on the board as a con man's spreadsheet and took off the white." }
            sonraki: "@akis"

      - id: "yuk2_yak"
        yer: "tepe"
        paragraflar:
          - { tr: "Defteri duvardan söküp ateşe veriyorsun; sayfalar bir anda alev alıyor. Kubbenin altındaki kırk kişiden kımıldayan yok. Ortalıkta yalnız kâğıdın çıtırtısı, bir de uzaktan gelen ilahi.", en: "You tear the ledger off the wall and the pages catch. The forty under the dome don't move. There's just the crackle of paper and the hymn from far away." }
          - { tr: "{npc:vahit} kızmıyor. Öğretici'deki o mürit haklıymış: kızmadığı zaman sesi iyice yumuşar. \"O bir kopyaydı kardeşim,\" diyor. \"Asıl defter Sistem'de.\"", en: "{npc:vahit} doesn't get angry. That disciple back in the Tutorial was right: when he doesn't get angry, his voice gets so soft. \"That was a copy, friend,\" he says. \"The real ledger's in the System.\"" }
          - { tr: "Arkanda iki beyaz cübbeli kemerinden bıçak çekiyor. {npc:vahit} onları durdurmuyor, durdurmaya niyeti de yok gibi.", en: "Behind you, two white robes draw knives from their belts. {npc:vahit} doesn't stop them. He doesn't look like he plans to." }
        secenekler:
          - id: "kopya"
            etiket: { tr: "\"Kopyanın yerini söyle. Hemen.\"", en: "\"Tell me where the copy is. Now.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { vahit: { korku: 8 } }
            kronik: { tr: "Peygamberi, yakıt defterinin kopyasının yerini söylemeye zorladın.", en: "You forced the prophet to tell you where the copy of the ledger was." }
            sonraki: "@akis"
          - id: "dovus"
            etiket: { tr: "Bıçaklar gelsin", en: "Let the knives come" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -2 }
              - savas: { dusmanlar: ["yukselen_muhafiz@dunya", "yukselen_muhafiz@dunya"], ortam: ["karanlik"], kazan: "yuk2_yak_zafer", kaybet: "yuk2_yak_yenilgi" }
            kronik: { tr: "Rasathanenin kubbesi altında beyaz cübbelilerle dövüştün.", en: "You fought the white robes under the observatory dome." }
          - id: "in"
            etiket: { tr: "Arkanı dön, {yer:tepe|den} in", en: "Turn your back. Walk down off the hill" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "Bıçaklara sırtını dönüp {yer:tepe|den} yürüyerek indin; peşine düşmeye kimse cesaret edemedi.", en: "You turned your back on the knives and walked off the hill. Nobody dared follow." }
            sonraki: "@akis"

      - id: "yuk2_yak_zafer"
        yer: "tepe"
        paragraflar:
          - { tr: "İki beyaz cübbeli kubbenin taş zemininde boylu boyunca yatıyor; nefes alıyorlar, ama bir süre kalkacak halleri yok. Defterin külü yerdeki kana karışıyor.", en: "Two white robes are lying on the observatory's stone floor. They're breathing, but they won't be getting up for a while. The ledger's ashes mix with the blood on the floor." }
          - { tr: "{npc:vahit} avuçları sana dönük, ellerini kaldırıyor. Kırk kişiye dönüp hâlâ aynı yumuşak sesle konuşuyor: \"Gördünüz mü? Sistem'in seçtiğini Sistem'in kanunu bile bağlayamaz.\"", en: "{npc:vahit} raises his hands, palms out. \"Do you see,\" he tells the forty, his voice still soft. \"The one the System chose isn't bound even by the System's law.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Tek söz etme, çekip git", en: "Say nothing. Leave" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { vahit: { korku: 4 } }
            kronik: { tr: "Yükselenler'in iki muhafızını yere serip tek kelime etmeden gittin; peygamber bunu bile vaaza çevirdi.", en: "You put two of the Ascended's guards on the floor and left without a word. The prophet turned that into a sermon too." }
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "\"Bir daha defter yazarsan, seni yazarım.\"", en: "\"Write another ledger and I'll write you in.\"" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - dikkat: 2
              - iliski: { vahit: { korku: 10, guven: -4 } }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "Peygambere, bir daha defter yazarsa o deftere onun adını senin yazacağını söyledin.", en: "You told the prophet that if he ever wrote another ledger, you'd write his name in it yourself." }
            sonraki: "@akis"

      - id: "yuk2_yak_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Bıçaklardan biri kaburgalarının arasına giriyor. Dizlerinin üstüne çökerken gözlerin kararıyor; son gördüğün şey {npc:vahit|in} çıplak ayakları.", en: "One of the knives slides between your ribs. You go down on your knees, and as your vision goes dark you can see {npc:vahit|pos} bare feet." }
          - { tr: "\"Yeter,\" diyor. \"Sistem'in seçtiğini Sistem'den başkası öldüremez.\" Gözünü açtığında {yer:tepe|in} eteğindesin; yaraların sarılmış, yanı başında kül dolu küçük bir kâse duruyor.", en: "\"Enough,\" he says. \"Nobody but the System gets to kill the System's chosen.\" When you wake up you're at the bottom of the hill, your wounds bandaged, a little bowl of ash next to you." }
        secenekler:
          - id: "kase"
            etiket: { tr: "Kâseyi yokuşa fırlat", en: "Hurl the bowl back up the hill" }
            etkiler:
              - can: -10
              - ahlak: { duzen: -1, insanlik: 1 }
            kronik: { tr: "{yer:tepe|de} yenik düştün; peygamberin başucuna bıraktığı kül kâsesini yokuşa geri fırlattın.", en: "You lost on the hill, and threw the bowl of ash the prophet left you right back up the slope." }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kâseyi sakla, bunu unutmayacaksın", en: "Keep the bowl. You won't forget this" }
            etkiler:
              - can: -10
              - ahlak: { merhamet: -1, duzen: 1 }
              - esya: { kul_muhru: 1 }
            kronik: { tr: "{yer:tepe|de} aldığın yenilgiyi, peygamberin bıraktığı kül kâsesinde sakladın.", en: "You kept your defeat on the hill in the bowl of ash the prophet left you." }
            sonraki: "@akis"

      - id: "yuk2_sizinti"
        yer: "tepe"
        paragraflar:
          - { tr: "İmzanı atıyorsun, ama mürekkep daha kurumadan kafanın içinde ikinci bir defter yazılmaya başlıyor. Gece kubbeye dönüp sayfaları tek tek kopyalıyorsun.", en: "You sign. Before the ink's even dry, a second ledger starts writing itself in your head. That night you go back to the dome and copy the pages one by one." }
          - { tr: "Son sayfaya geldiğinde arkandan bir ses geliyor. On Üç elinde bir fenerle kapının eşiğine dikilmiş. Seni de kopyayı da görüyor, ama ağzını açmıyor.", en: "You're on the last page when you hear a sound behind you. Thirteen is standing in the doorway with a lantern. He sees you, sees the copy, and doesn't say a word." }
          - { tr: "Sonra yaklaşıp on üçüncü satırı gösteriyor. \"Benim adımı da götür,\" diyor. \"Ama beni götürme. Ben inanıyorum. Yalnız... adım kurtulsun istiyorum.\"", en: "Then he steps closer and points at line thirteen. \"Take my name too,\" he says. \"But don't take me. I believe. I just... want my name to get out.\"" }
        secenekler:
          - id: "adini"
            etiket: { tr: "Adını da kopyaya yaz", en: "Copy his name too" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak: "on_ucuncu_cizildi"
              - iliski: { vahit: { guven: -1 } }
            kronik: { tr: "{yer:tepe|den} bir müridin kendisini değil, adını kaçırdın.", en: "You smuggled a disciple's name off the hill. Not the disciple." }
            sonraki: "@akis"
          - id: "onu"
            etiket: { tr: "\"Adın değil, sen kurtulmalısın.\"", en: "\"Not your name. You need to get out.\"" }
            zar: { stat: "cha", zorluk: 32, tek: true, basarisiz: "yuk2_sizinti_ret", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }] }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "on_ucuncu_kacti"
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { guven: -3 } }
            kronik: { tr: "On Üç'e adının değil, kendisinin kurtulması gerektiğini söyleyip onu {yer:tepe|den} kaçmaya çağırdın.", en: "You told Thirteen it was him who needed saving, not his name, and asked him to run off the hill." }
            sonraki: "@akis"
          - id: "kandir"
            etiket: { tr: "Ona Peygamber'in seni yolladığını söyle", en: "Tell him the Prophet sent you" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { vahit: { guven: 2 } }
            kronik: { tr: "Seni suçüstü yakalayan müride peygamberin adını kullanarak yalan söyledin; sana inandı.", en: "You lied to the disciple who caught you, in the prophet's name. He believed you." }
            sonraki: "@akis"

      - id: "yuk2_sizinti_ret"
        yer: "tepe"
        paragraflar:
          - { tr: "On Üç başını iki yana sallıyor. \"Gidersem kim olurum?\" diye soruyor. \"Burada bir numaram var. Aşağıda hiçbir şeyim yok.\"", en: "Thirteen shakes his head, and it isn't a yes. \"If I leave, who am I?\" he asks. \"Up here I have a number. Down there I don't have anything.\"" }
          - { tr: "Feneri üfleyip karanlıkta kapıdan çıkıyor. Kopya senin elinde kalıyor; on üçüncü satır da, onun istediği gibi, kopyada yazılı.", en: "He blows out the lantern and walks out the door in the dark. The copy stays in your hands, and line thirteen, the way he wanted it, is on the copy." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kopyayı katla, git", en: "Fold up the copy. Go" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - bayrak: "on_ucuncu_cizildi"
            kronik: { tr: "On Üç'ü kurtaramadın; yalnızca adını {yer:tepe|den} indirebildin.", en: "You couldn't save Thirteen. You could only get his name off the hill." }
            sonraki: "@akis"
          - id: "bekle"
            etiket: { tr: "Karanlıkta bir süre daha bekle", en: "Wait in the dark a while longer" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Bir müridin karanlıkta geri dönmesini bekledin; dönmedi.", en: "You waited in the dark for a disciple to come back. He didn't." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 3: BÜYÜK AYİN
  - id: "yukselenler_3_ayin"
    perde: [3]
    ana_yay: { gun: 220 }
    kosul: { gorev: { zincir_yukselenler: "basla" }, bayrak: "yukselenler_2_tamam" }
    agirlik: 1
    etiketler: ["yukselenler", "zincir", "npc", "ahlak", "savas"]
    gerilim: 4
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Büyük Ayin", en: "The Great Rite" }
    sahne: "yuk3_ayin"
    sahneler:
      - id: "yuk3_ayin"
        yer: "tepe"
        paragraflar:
          - { tr: "Mevsim dönerken {yer:tepe|in} bütün fenerleri bir anda yanıyor. Sarnıcın zarı artık kubbeye sığmıyor: rasathanenin yarığından taşmış, beyaz bir sütun gibi göğe yükselmiş. Her nefes alışında bütün yokuş da onunla birlikte soluyor.", en: "The season turns, and every lantern on {yer:tepe} lights at once. The reservoir's membrane doesn't fit under the dome anymore. It has spilled up out of the split and rises toward the sky like a white pillar, and every time it breathes, the whole hill breathes with it." }
          - metin: { tr: "Yokuşun dibinden üç yüz gri insan tek sıra hâlinde tırmanıyor. Her birinin boynunda bir ip, ipin ucunda defterdeki satır numarası: senin imzanın altındaki numaralar.", en: "Three hundred gray figures climb up from the bottom of the hill in single file. Around each neck hangs a string, and on each string, a line number from the ledger. The numbers under your signature." }
            kosul: { bayrak: "yakit_listesi_imzalandi" }
          - metin: { tr: "Gönüllüler ilahi söyleyerek çıkıyor, en önde kuyruktaki o gülümseyen genç. Kimse onları itmiyor; itmeye gerek de yok.", en: "The volunteers climb singing, and at the front is that smiling teenager from the line. Nobody is pushing them. Nobody has to." }
            kosul: { bayrak: "yakit_gonulluler" }
          - metin: { tr: "Mahkûmlar zincirlerini şakırdatarak çıkıyor; şakırtı ilahiyi bastırıyor. Kimi hâlâ kaçmaya yelteniyor, kimi çoktan pes etmiş.", en: "The prisoners climb in their chains, and the clanking drowns out the hymn. A few of them are still trying to break away. A few gave up a long time ago." }
            kosul: { bayrak: "yakit_mahkumlar" }
          - metin: { tr: "Defterdekilerin yarısı bir gecede ortadan kaybolmuş, Sığınak'ın gizli yolları onları şehrin öbür ucuna taşımış. {npc:vahit} boşlukları eline geçen herkesle doldurmuş: {yer:tepe|de} yaşayan, arayanı soranı olmayan yaşlılarla, yalnızlarla.", en: "Half the ledger vanished in one night, carried off to the far side of the city along the Haven Council's back roads. {npc:vahit} filled the gaps with whoever he could find: the old and the alone on the hill, the ones nobody would come looking for." }
            kosul: { bayrak: "yakit_defteri_sizdi" }
          - metin: { tr: "Rasathanenin balkonunda uzun, boyuna göre fazla ince bir karaltı duruyor: {npc:thessar|in} elçiliğinden bir gözcü. İnsanların kendi kendini nasıl hasat ettiğini büyük bir merakla izliyor.", en: "There's a tall, too-thin figure standing on the observatory balcony: an observer from {npc:thessar|pos} embassy. It is watching, with great interest, how humans harvest themselves." }
            kosul: { bayrak: "thessar_indi" }
          - metin: { tr: "Sıranın on üçüncüsü On Üç. Boynundaki ipte kendi el yazısıyla yazılmış bir sayı var. Seni görünce okul gezisine çıkmış bir çocuk gibi el sallıyor.", en: "Thirteenth in line is Thirteen. The number on his string is in his own handwriting. He sees you and waves, like he's on a field trip." }
            kosul: { bayrak_yok: ["on_ucuncu_cizildi", "on_ucuncu_kacti"] }
          - metin: { tr: "On Üç sırada değil: satırının üstü kırmızıyla çizildiği için {npc:vahit} onu fenerci olarak yanına almış. Gözünü bile kırpmadan sırayı izliyor.", en: "Thirteen isn't in line. His line got struck in red, so {npc:vahit} took him on as a lantern bearer. He watches the line without blinking." }
            kosul: { bayrak: "on_ucuncu_cizildi" }
          - metin: { tr: "On üçüncü sırada On Üç'ün yerinde başka bir genç duruyor. Sıra boşluk tanımıyor.", en: "Thirteenth in line, where Thirteen should have been, stands some other kid. The line doesn't leave gaps." }
            kosul: { bayrak: "on_ucuncu_kacti" }
          - { tr: "{npc:vahit} sütunun dibinde kollarını açmış bekliyor. \"Bu gece merdiven tek bir basamağa dönüşüyor,\" diyor. \"Halkanın ortasına geç, ey Seçilmişlerin Seçilmişi. Katkıyı kabul et.\"", en: "{npc:vahit} waits at the foot of the pillar, arms spread. \"Tonight the ladder becomes a single rung,\" he says. \"Step into the middle of the ring, Chosen of the Chosen. Receive the contribution.\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Kapı: C kademesi. Zarın içindeki sayaç: 4.112. İlk ayin değil bu, yalnızca ilk büyüğü.", en: "Gate: Grade C. The counter inside the membrane: 4,112. This isn't the first rite. Just the first big one." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u sayaç sistemin değil. sistemin altında bir şey var: bir ağız, hem de aç. onu sarnıca neyin koyduğunu bilmiyorum. bilmek de istemiyorum.", en: "t̷hat counter isn't the system's. it's something under the system. a mouth. and it's hungry. i don't know what put it in that reservoir. i don't want to know." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bunu yaparsan bir daha yanında yürümem. Yaralarını da sarmam bir daha.\"", en: "\"Do this and I'll never walk beside you again. I won't stitch you up again, either.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sütundaki frekans... Sistem'in değil, altındaki bir katmandan geliyor. Bu ayin falan değil, düpedüz besleme.\"", en: "\"The frequency on that pillar... it isn't the System's. It's coming from a layer underneath. This isn't a rite. It's a feeding.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sana bir keresinde canavar mı oluyorsun, tanrı mı diye sormuştum. Cevabı şimdi vereceksin, değil mi?\"", en: "\"I asked you once if you were turning into a monster or a god. You're about to answer, aren't you?\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Halkanın ortasına geç, katkıyı al", en: "Step into the middle of the ring. Receive it" }
            etkiler:
              - ahlak: { insanlik: -15, merhamet: -6 }
              - yozlasma: 8
              - xp_seviye: 150
              - itibar: { yukselenler: 15 }
              - degisken: { hayatta_kalan: -6 }
              - bayrak: "ayin_alindi"
              - bayrak: "yukselenler_3_tamam"
              - iliski: { vahit: { baglilik: 10 } }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 4, max: 9 }, kosul: { bayrak_yok: "on_ucuncu_kacti" } }
            kronik: { tr: "Halkanın ortasına geçip yüzlerce insanın katkısını tek başına aldın; o gece seviyeler üstüne şelale gibi boşaldı.", en: "At the Great Rite you took the contribution of hundreds of people alone. That night your levels came down like a waterfall." }
            sonraki: "yuk3_alis"
          - id: "dagit"
            etiket: { tr: "Katkıyı halkaya dağıt, sen dışarıda kal", en: "Spread it around the ring. Stay outside" }
            etkiler:
              - ahlak: { insanlik: -8, merhamet: -4, duzen: 4 }
              - xp_seviye: 30
              - itibar: { yukselenler: 10 }
              - degisken: { hayatta_kalan: -6 }
              - bayrak: "yukselenler_3_tamam"
              - iliski: { vahit: { saygi: 6, baglilik: 6 } }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 4, max: 9 }, kosul: { bayrak_yok: "on_ucuncu_kacti" } }
            kronik: { tr: "Ayinin katkısını kendine ayırmayıp Yükselenler'e dağıttın, onların yükselişini de halkanın dışından izledin.", en: "You didn't take the Great Rite's contribution for yourself. You handed it out to the Ascended and watched them rise from outside the ring." }
            sonraki: "yuk3_paylasim"
          - id: "kendini_yak"
            tur: "gosteris"
            etiket: { tr: "Zara kendin gir, onların yerine seni yesin", en: "Walk into the membrane. Let it eat you instead" }
            gerekli: { stat: { wil: 150 } }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: 8 }
              - dikkat: 8
              - itibar: { yukselenler: 15 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "ayin_kendini_yakti"
              - bayrak: "yukselenler_3_tamam"
              - iliski: { vahit: { korku: 10, saygi: 10 } }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 4, max: 9 }, kosul: { bayrak_yok: "on_ucuncu_kacti" } }
            kronik: { tr: "Üç yüz kişinin önüne geçip sarnıcın zarına kendin yürüdün; zar seni sindiremedi, senden önce girenleri de geri kustu.", en: "You walked into the membrane ahead of three hundred people. It couldn't digest you, and it threw up the ones who'd gone in before you." }
            sonraki: "yuk3_kendini"
          - id: "durdur"
            etiket: { tr: "Halkayı kır, ayini durdur", en: "Break the ring. Stop the Rite" }
            etkiler:
              - ahlak: { merhamet: 8, insanlik: 6, duzen: -4 }
              - itibar: { yukselenler: -25 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - iliski: { vahit: { guven: -15, korku: 8 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: -40 }
              - savas: { dusmanlar: ["yukselen_muhafiz@dunya", "yukselen_muhafiz@dunya", "secilmis_avci@oyuncu+2"], ortam: ["karanlik"], kazan: "yuk3_kesinti", kaybet: "yuk3_kesinti_yenilgi" }
            kronik: { tr: "Ayinin tam ortasında halkayı kırıp sarnıcın ağzında beyaz cübbelilerle dövüştün.", en: "In the middle of the Great Rite you broke the ring and fought the white robes at the mouth of the reservoir." }
          - id: "baskin"
            etiket: { tr: "İşareti ver, Sığınak'ın baskını başlasın", en: "Give the signal. Let the Haven raid start" }
            goster: { bayrak: "yukselenler_casus" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -2 }
              - itibar: { siginak: 8, yukselenler: -20 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - iliski: { vahit: { guven: -20 } }
            kronik: { tr: "Büyük Ayin gecesi {yer:tepe|in} kapılarını Sığınak'a açtın ve beyaz cübbeni sırtından çıkardın.", en: "On the night of the Great Rite you opened the hill's doors to the Haven Council. You took off the white robe that night." }
            sonraki: "yuk3_baskin"

      - id: "yuk3_alis"
        yer: "tepe"
        paragraflar:
          - { tr: "Halkanın ortasına adım atar atmaz sıra yürümeye başlıyor. İlk kişi zara girip geri dönmüyor; senin göğsünde bir sıcaklık kıpırdanıyor. Ardından ikincisi, üçüncüsü… Onuncudan sonra saymayı bırakıyorsun.", en: "You step into the middle of the ring and the line starts walking. The first one goes into the membrane and doesn't come back, and warmth blooms in your chest. Second. Third. After the tenth, you stop counting." }
          - { tr: "Pencereler üst üste açılıyor. Seviye çubuğun dolup boşalıyor, yeniden doluyor; şelalenin altında durmak gibi bir şey. Bütün bu sıcaklığın altında bir yerde, birinin son nefesini senin ağzınla aldığını duyumsuyorsun.", en: "Windows stack up on top of each other. Your level bar fills, empties, fills again; it's like standing under a waterfall. Somewhere, under all that warmth, you can feel someone taking their last breath with your mouth." }
          - { tr: "Derken zar şişmeye başlıyor. Tıka basa doymuş bir mide gibi gerilip çatlıyor, çatlaktan da bir şey çıkıyor: yüzlerce yüzden örülmüş, kenarları kor gibi yanan bir ağız.", en: "Then the membrane swells. It stretches like an overfed stomach and splits, and something comes out of the split: a mouth woven out of hundreds of faces, its edges glowing like embers." }
        bildirimler:
          - tur: "seviye"
            nadirlik: "efsanevi"
            baslik: { tr: "[Katkı alındı ×300]", en: "[Contribution received ×300]" }
            satirlar:
              - { tr: "Seviye atladın. Seviye atladın. Seviye atladın.", en: "Level up. Level up. Level up." }
              - { tr: "Teşekkürler. Teşekkürler. Teşekkürler.", en: "Thank you. Thank you. Thank you." }
          - tur: "uyari"
            baslik: { tr: "[ANALİZ] Ocak Ağzı · Kapı aşırı beslendi", en: "[ANALYSIS] The Kiln Mouth · Gate overfed" }
            satirlar:
              - { tr: "Bu varlık sana katkıda bulunanlardan oluşuyor.", en: "This entity is composed of those who contributed to you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷ur. dur. bu sıcaklık sen değilsin. içinde yüzlerce ses var, hepsi teşekkür ediyor. neden teşekkür ediyorlar sana?", en: "s̷top. stop. this warmth isn't you. there are hundreds of voices in you and every one of them is saying thank you. why are they thanking you?" }
        secenekler:
          - id: "kendin"
            etiket: { tr: "Ağzı kendin kapat", en: "Shut the mouth yourself" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+5"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Kendi ayininden doğan ağızla sarnıcın başında yalnız dövüştün.", en: "You fought the mouth born from your own rite, alone, at the head of the reservoir." }
          - id: "secilmisler"
            etiket: { tr: "Seçilmişleri öne sür, arkalarından vur", en: "Send the Chosen in first. Strike from behind" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { korku: 4 } }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+3"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Ocak Ağzı'nın üstüne önce kendi Seçilmişlerini sürüp arkalarından vurmaya hazırlandın.", en: "You sent your own Chosen at the Kiln Mouth first and got ready to strike from behind them." }

      - id: "yuk3_paylasim"
        yer: "tepe"
        paragraflar:
          - { tr: "Halkanın dışında durup elini kaldırıyorsun. {npc:vahit} işaretini anlıyor: katkı bu gece kırk kişiye bölünecek. Sıra yürümeye başlıyor; her birinin zara girişini tek tek izliyorsun.", en: "You stay outside the ring and raise your hand. {npc:vahit} understands the signal: tonight the contribution gets split among the forty. The line starts walking, and you watch every single one of them step into the membrane." }
          - { tr: "Halkadakilerin yüzleri birer birer aydınlanıyor; en çok da {npc:vahit} parlıyor, gözlerinde yaş, dudaklarında bir şükür duası. Senin aklındansa zara giren yüzlerin hiçbiri silinmiyor.", en: "The faces in the ring light up one by one. {npc:vahit} shines brightest, tears in his eyes, a prayer of thanks in his mouth. You can't forget a single face." }
          - { tr: "Derken zar şişip çatlıyor; çatlaktan yüzlerce yüzden örülmüş, kenarları kor gibi yanan bir ağız çıkıyor. Halka çığlık çığlığa dağılırken yerinden kıpırdamayan bir tek sen kalıyorsun.", en: "Then the membrane swells and splits, and out of the split comes a mouth woven from hundreds of faces, its edges glowing like embers. The ring scatters, screaming, and you're the only one who doesn't move." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ağzın önüne geç", en: "Step in front of the mouth" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+4"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Kaçışan Seçilmişlerin önüne geçip Ocak Ağzı'yla sen dövüştün.", en: "You stepped in front of the fleeing Chosen and fought the Kiln Mouth yourself." }
          - id: "vahite"
            etiket: { tr: "\"Sizin ayininiz. Siz kapatın.\"", en: "\"Your rite. You close it.\"" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - iliski: { vahit: { korku: 6, guven: -4 } }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+2", "yukselen_muhafiz@dunya"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Ocak Ağzı'nı önce Yükselenler'e bıraktın: ayin onlarındı, kapatmak da onlara düşerdi.", en: "You left the Kiln Mouth to the Ascended first. It was their rite; closing it was their job." }

      - id: "yuk3_kendini"
        yer: "tepe"
        paragraflar:
          - { tr: "Sıranın önüne geçip kimse engel olamadan zara dalıyorsun. İçerisi ne sıcak ne soğuk, yalnızca aç. Bir şey seni tartıyor, sayıyor, bölüp parçalamaya uğraşıyor.", en: "You step in front of the line and walk into the membrane before anyone can stop you. Inside it's not warm and not cold. Just hungry. Something is weighing you, counting you, trying to divide you." }
          - { tr: "Ama beceremiyor. Penceren bir hata kodu basıyor, ardından {npc:yanki|in} o tanıdık çatlak sesi geliyor. Zar sarsılıp öğürüyor ve içindekileri dışarı kusuyor: seni ve senden önce giren dokuz kişiyi. Islak, titrek ama sağ.", en: "And it can't. Your window throws an error code, and behind it, that familiar cracked voice of {npc:yanki|pos}. The membrane shudders, gags, and throws up what's inside it: you, and the nine people who went in before you, wet and shaking and alive." }
          - { tr: "Kalabalık nefesini tutuyor. Derken zar ikinci kez kasılıyor ve bu sefer, yutamadığı her şeyin öfkesiyle, dışarı bir ağız itiyor: yüzlerce yüzden örülmüş, kenarları kor gibi yanan bir ağız.", en: "The crowd holds its breath. Then the membrane cramps a second time, and this time it pushes out a mouth woven from hundreds of faces, edges glowing like embers, angry at everything it couldn't swallow." }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[KATKI İŞLENEMİYOR]", en: "[CONTRIBUTION CANNOT BE PROCESSED]" }
            satirlar:
              - { tr: "taşıyıcı: █████. bölünemez. sindirilemez.", en: "carrier: █████. indivisible. indigestible." }
              - { tr: "bunu bir daha yaparsan ben de seninle orada kalırım, ikimiz birden. unutma.", en: "do this again and i'm staying in there with you. both of us. remember that." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Dokuz kişiyi arkana al, ağza dön", en: "Get the nine behind you. Face the mouth" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+5"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Sarnıcın kustuğu dokuz kişiyi arkana alıp Ocak Ağzı'yla dövüştün.", en: "You fought the Kiln Mouth with the nine people the reservoir threw up sheltered behind you." }
          - id: "emret"
            etiket: { tr: "Yükselenler'e emret: \"Sırayı geri çekin!\"", en: "Order the Ascended: \"Pull the line back!\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { vahit: { korku: 4 } }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+5"], ortam: ["karanlik"], kazan: "yuk3_zafer", kaybet: "yuk3_yenilgi" }
            kronik: { tr: "Ayinin ortasında Yükselenler'e sırayı geri çektirdin ve {yer:tepe|de} Ocak Ağzı'nın karşısına dikildin.", en: "In the middle of the rite you made the Ascended pull the line back, then turned to face the Kiln Mouth on the hill." }

      - id: "yuk3_zafer"
        yer: "tepe"
        paragraflar:
          - { tr: "Ocak Ağzı son bir kez açılıyor, bütün yüzleri bir ağızdan konuşuyor; bu sefer teşekkür değil, yalnızca bir iç çekiş. Ardından küle dönüyor ve kül sarnıcın taşlarına kar gibi yağıyor.", en: "The Kiln Mouth opens one last time and every face in it speaks at once. Not a thank-you this time, just a sigh. Then it turns to ash, and the ash falls on the reservoir stones like snow." }
          - { tr: "Beyaz sütun eğilip kısalıyor, sarnıcın ağzına geri çekiliyor. Zar yorgun, küçülmüş, ama hâlâ orada; hâlâ nefes alıp veriyor.", en: "The white pillar bends, shrinks, and pulls back down into the mouth of the reservoir. The membrane is tired and small now, but it's still there. Still breathing." }
          - { tr: "{npc:vahit} küllerin ortasına diz çöküp külü yüzüne sürüyor. \"Gördünüz mü?\" diye fısıldıyor. \"Sistem'in ağzı bile onun önünde boyun eğiyor.\"", en: "{npc:vahit} kneels in the middle of the ash and rubs it on his face. \"Did you see?\" he whispers. \"Even the System's own mouth bows to this one.\"" }
          - metin: { tr: "Balkondaki gözcü seni uzun uzun süzüyor, sonra eğilip selam veriyor. Selamı insanlara değil, sana.", en: "The observer on the balcony gives you a long look. Then it bows. Not to the humans. To you." }
            kosul: { bayrak: "thessar_indi" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[Unvan: Ocak Kırıcı]", en: "[Title: Kiln Breaker]" }
            satirlar:
              - { tr: "Kendi ayininden doğan ağzı yendin. Bunun nasıl okunacağını kimse bilmiyor.", en: "You beat the mouth born from your own rite. Nobody knows how to read that." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Sarnıcın zarını kapat, bir daha açılmasın", en: "Seal the membrane. Never again" }
            etkiler:
              - unvan: "ocak_kirici"
              - esya: { ocak_cekirdegi: 1 }
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { yukselenler: -4 }
              - bayrak: "sarnic_kapandi"
              - iliski: { vahit: { guven: -4, korku: 4 } }
            kronik: { tr: "Ocak Ağzı'nı yendikten sonra {yer:tepe|in} sarnıcını kendi ellerinle mühürledin; Yükselenler o zarı bir daha besleyemedi.", en: "After the Great Rite you sealed the hill's reservoir with your own hands. The Ascended never fed that membrane again." }
            sonraki: "@akis"
          - id: "acik"
            etiket: { tr: "Zarı açık bırak, ayin sürsün", en: "Leave the membrane open. The rite goes on" }
            etkiler:
              - unvan: "ocak_kirici"
              - esya: { ocak_cekirdegi: 1 }
              - ahlak: { insanlik: -4, duzen: 2 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { baglilik: 6 } }
            kronik: { tr: "Ocak Ağzı'nı yendin ama {yer:tepe|in} sarnıcını kapatmadın; yorgun zar hâlâ nefes alıyordu.", en: "You beat the Kiln Mouth and left the reservoir open. The tired membrane was still breathing." }
            sonraki: "@akis"
          - id: "gozcu"
            etiket: { tr: "Balkondaki gözcünün selamına karşılık ver", en: "Return the observer's bow" }
            goster: { bayrak: "thessar_indi" }
            etkiler:
              - unvan: "ocak_kirici"
              - ahlak: { insanlik: -3, duzen: 1 }
              - degisken: { kadim_tehdit: 3 }
              - itibar: { kadimler: 4, yukselenler: 2 }
              - iliski: { thessar: { saygi: 4 } }
            kronik: { tr: "Kendi türünden insanların yandığı bir ayinin sonunda Kadim gözcüsünün selamına karşılık verdin; gözcü bunu gemiye bildirdi.", en: "At the end of a rite where your own kind burned, you bowed to an Ancient observer. It reported that back to the ship." }
            sonraki: "@akis"

      - id: "yuk3_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Ağız seni yere seriyor; yüzlerce yüz aynı anda üstüne eğiliyor. Bilincin kayarken beyaz cübbelilerin kollarına yapışıp seni geri sürüklediğini hissediyorsun.", en: "The mouth puts you on the ground and hundreds of faces lean over you at once. As you black out, you feel white robes grab you by the arms and drag you back." }
          - { tr: "Gözünü açtığında sütun yok olmuş. {npc:vahit} yanında oturuyor, yüzü külden griye dönmüş. \"Ağzı geri püskürttük,\" diyor yumuşacık. \"Kırk kişi daha vererek. Sırada bekleyenlerden.\"", en: "When you wake up, the pillar is gone. {npc:vahit} is sitting beside you, his face gray with ash. \"We pushed the mouth back,\" he says softly. \"With forty more. The ones still waiting in line.\"" }
        secenekler:
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme, tavana bak", en: "Say nothing. Stare at the ceiling" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
            kronik: { tr: "Yenilgin kırk canı daha götürdü; sen bunu sesini çıkarmadan kabullendin.", en: "Your defeat cost forty more people, and you took it in silence." }
            sonraki: "@akis"
          - id: "yaka"
            etiket: { tr: "Yakasına yapış: \"Neden beni beklemedin?\"", en: "Grab his collar: \"Why didn't you wait for me?\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { vahit: { korku: 6, guven: -4 } }
            kronik: { tr: "Kırk kişiyi ağza yem eden peygamberin yakasına yapıştın; peygamberden ses çıkmadı.", en: "You grabbed the prophet who fed forty people to the mouth by the collar. He didn't answer." }
            sonraki: "@akis"

      - id: "yuk3_kesinti"
        yer: "tepe"
        paragraflar:
          - { tr: "Son muhafız da sarnıcın basamaklarından yuvarlanınca sıra dağılıyor; gri insanlar ilk kez kendi ayaklarıyla, kendi seçtikleri yöne koşuyor.", en: "The last guard tumbles down the reservoir steps. The line breaks, and for the first time the gray figures run on their own feet, in their own directions." }
          - { tr: "{npc:vahit} beyaz cübbesinin eteği basamaklarda sürüne sürüne rasathanenin döner merdivenine kaçıyor. Arkanda zar şişip duruyor; aç ve terk edilmiş.", en: "{npc:vahit} bolts for the observatory's spiral stair, his white robe dragging on the steps. Behind you the membrane swells, hungry and abandoned." }
        secenekler:
          - id: "kovala"
            etiket: { tr: "Peygamberin peşinden merdivene çık", en: "Chase the Prophet up the stairs" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
            kronik: { tr: "Ayini kırdıktan sonra kaçan peygamberi rasathanenin tepesine kadar kovaladın.", en: "After you broke the rite, you chased the fleeing prophet all the way to the top of the observatory." }
            sonraki: "yuk3_kovalama"
          - id: "indir"
            etiket: { tr: "Kaçanları topla, {yer:tepe|den} indir", en: "Round up the runners. Get them off the hill" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 1 }
              - degisken: { hayatta_kalan: 6 }
              - itibar: { siginak: 5 }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 4, max: 9 }, kosul: { bayrak_yok: "on_ucuncu_kacti" } }
            kronik: { tr: "Ayin için getirilen üç yüz yakıtı gecenin karanlığında {yer:tepe|den} indirdin.", en: "You walked the Great Rite's three hundred fuel down off the hill in the middle of the night." }
            sonraki: "@akis"
          - id: "zar"
            etiket: { tr: "Aç kalan zara dön, şimdi kapat", en: "Turn to the starving membrane. Close it now" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - savas: { dusmanlar: ["ocak_agzi@oyuncu+3"], ortam: ["karanlik"], kazan: "yuk3_kapandi", kaybet: "yuk3_kesinti_yenilgi" }
            kronik: { tr: "Halka dağılınca aç kalan sarnıca dönüp içinden çıkanla dövüştün.", en: "After you broke the rite, you turned to the starving reservoir and fought what came out of it." }

      - id: "yuk3_kovalama"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit|i} kubbenin yarığının kenarında yakalıyorsun: altında şehir, üstünde göğün panelleri. Nefes nefese, ayakları kan içinde duruyor. Gözlerinde ilk kez peygamberden eser yok; karşında korkmuş bir adam var, o kadar.", en: "You catch {npc:vahit} at the edge of the split in the dome, the city below him, the sky panels above. He's out of breath, his feet are bleeding, and for the first time there's no prophet in his eyes. Just a scared man." }
          - { tr: "\"Ben yalnızca söyleneni yaptım,\" diyor. \"Ya da bana söylendiğini sandığımı. Fark eder mi? Söyle bana, fark eder mi?\"", en: "\"I only did what I was told,\" he says. \"Or what I thought I was told. Does it matter? Does it, tell me?\"" }
        sezgiler:
          - kosul: { stat: { wis: 120 } }
            metin: { tr: "Yalan söylemiyor; ama bu onu daha az tehlikeli kılmıyor.", en: "He isn't lying. That doesn't make him any less dangerous." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Onu yarıktan aşağı it", en: "Push him off the edge" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: -2 }
              - npc_ol: "vahit"
              - unvan: "kardes_katili"
              - itibar: { yukselenler: -15 }
            kronik: { tr: "Yükselenler'in peygamberini kendi rasathanesinin kubbesinden aşağı ittin; {yer:tepe|in} sesi o gece sustu.", en: "You pushed the Ascended's prophet off the dome of his own observatory. The hill went quiet that night." }
            sonraki: "@akis"
          - id: "bagisla"
            etiket: { tr: "\"Fark eder. Yaşa ve bunu düşün.\"", en: "\"It matters. Live, and think about that.\"" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { vahit: { korku: 12, guven: 6 } }
              - npc_iz: { vahit: "korku_izi" }
              - hafiza: { npc: "vahit", id: "olay:yukselenler_3_ayin", agirlik: 30 }
            kronik: { tr: "Ayinini kırdığın peygamberi kubbenin kenarında bağışladın ve ona yaşayıp bunu düşünmesini söyledin.", en: "At the edge of the dome you spared the prophet whose rite you broke, and told him to live and think about it." }
            sonraki: "@akis"
          - id: "suruklle"
            etiket: { tr: "Onu sürükleyip müritlerinin önüne at", en: "Drag him down in front of his flock" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { yukselenler: -8, siginak: 3 }
              - iliski: { vahit: { korku: 10, guven: -10 } }
              - npc_iz: { vahit: "yara_izi" }
            kronik: { tr: "Peygamberi kanlı ayaklarıyla müritlerinin önüne sürükledin; onu orada, dizlerinin üstünde bıraktın.", en: "You dragged the prophet down to his flock on his bleeding feet and left him there on his knees." }
            sonraki: "@akis"

      - id: "yuk3_kapandi"
        yer: "tepe"
        paragraflar:
          - { tr: "Ağız küle dönüyor; besleyeni kalmayan zar da kendi üstüne çöküyor. Sarnıcın dibinde ıslak taştan ve dört bin yüz on iki çentikten başka bir şey kalmıyor.", en: "The mouth turns to ash, and with nobody left to feed it, the membrane collapses in on itself. All that's left at the bottom of the reservoir is wet stone and four thousand one hundred and twelve notches." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı kapatıldı]", en: "[Gate closed]" }
            satirlar:
              - { tr: "Katkı sayacı sıfırlandı.", en: "Contribution counter reset." }
        secenekler:
          - id: "say"
            etiket: { tr: "Çentikleri tek tek say", en: "Count the notches, one by one" }
            etkiler:
              - unvan: "ocak_kirici"
              - ahlak: { insanlik: 4, merhamet: 2 }
              - bayrak: "sarnic_kapandi"
              - gun: 1
            kronik: { tr: "{yer:tepe|in} sarnıcını kapattın ve dibindeki dört bin yüz on iki çentiği bir bir saydın.", en: "You closed the hill's reservoir and counted every one of the four thousand one hundred and twelve notches at the bottom." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Sarnıcı arkanda bırak", en: "Leave the reservoir behind" }
            etkiler:
              - unvan: "ocak_kirici"
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "sarnic_kapandi"
            kronik: { tr: "{yer:tepe|in} sarnıcını kapattın ve arkana bakmadan yürüyüp gittin.", en: "You closed the hill's reservoir and walked away without looking back." }
            sonraki: "@akis"

      - id: "yuk3_kesinti_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Yere düşüyorsun; beyaz cübbeliler seni yokuştan aşağı yuvarlıyor. Taşların arasından son gördüğün şey, sıranın yeniden düzene girmesi.", en: "You go down, and the white robes roll you down the hill. Between the stones, the last thing you see is the line straightening back up." }
          - { tr: "Sabah {yer:tepe} sessizliğe gömülmüş. Göğün panellerinde kimsenin anlam veremediği bir satır duruyor: \"[Katkı alındı ×300.]\" Bu sefer hiç kimsenin adına değil.", en: "In the morning the hill is quiet. On the sky panels, a line nobody understands: \"[Contribution received ×300.]\" This time it belongs to no one." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk, gelecek mevsime hazırlan", en: "Get up. Get ready for next season" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - degisken: { hayatta_kalan: -6 }
              - stat: { wil: 2 }
            kronik: { tr: "Büyük Ayin'i durdurmaya gücün yetmedi; üç yüz kişi gözünün önünde yanıp gitti.", en: "You couldn't stop the Great Rite. Three hundred people burned right in front of you." }
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "Şehre in ve herkese anlat", en: "Go down into the city. Tell everyone" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - degisken: { hayatta_kalan: -4 }
              - itibar: { siginak: 4, yukselenler: -6 }
            kronik: { tr: "Ayini durduramadın ama şehre inip {yer:tepe|de} olanları herkese anlattın.", en: "You couldn't stop the rite, but you went down into the city and told everyone what happened on the hill." }
            sonraki: "@akis"

      - id: "yuk3_baskin"
        yer: "tepe"
        paragraflar:
          - { tr: "Fenerini üç kez kaldırıp indiriyorsun. Yokuşun dibinden Sığınak'ın yeşil bantlı insanları sessizce tırmanmaya başlıyor; ayak sesleri ilahiyi bastıran bir uğultuya dönüşüyor.", en: "You raise your lantern and lower it three times. From the bottom of the hill the Haven Council's green-banded people come up silent, a hum that drowns out the hymn." }
          - { tr: "Sıra dağılıyor. Beyazlar ne yapacağını şaşırmış; çoğu ömründe dövüşmemiş. {npc:vahit} kalabalığın içinden sana dönüp tek bir kelime söylüyor, dudaklarından okuyorsun: \"Sen.\"", en: "The line breaks apart. The white robes don't know what to do; most of them have never fought. Inside the crowd {npc:vahit} turns toward you and says one word. You read it on his lips: \"You.\"" }
        secenekler:
          - id: "yakit"
            etiket: { tr: "Önce yakıtı koru, kimse zara düşmesin", en: "Cover the fuel first. Nobody falls in" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 8 }
              - itibar: { siginak: 4 }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 4, max: 9 }, kosul: { bayrak_yok: "on_ucuncu_kacti" } }
            kronik: { tr: "Sığınak baskın yaparken yakıtın önünde siper oldun; o gece sarnıca tek kişi düşmedi.", en: "During the Haven raid you stood in front of the fuel. Not one person fell into the reservoir that night." }
            sonraki: "@akis"
          - id: "vahit"
            etiket: { tr: "Kalabalığı yar, {npc:vahit|i} yakala", en: "Cut through the crowd. Grab {npc:vahit}" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - degisken: { hayatta_kalan: 4 }
            kronik: { tr: "Baskın gecesi kalabalığı yarıp peygambere ulaştın.", en: "On the night of the raid you cut through the crowd and got your hands on the prophet." }
            sonraki: "yuk3_kovalama"

  # ================================================================== ZİNCİR 4: KURBAN
  # npc listesi bilerek boş: Vahit ölmüş olsa da zincir (On İkiler'le) sürer; Vahit'e özgü seçenekler goster ile.
  - id: "yukselenler_4_kurban"
    perde: [3]
    ana_yay: { gun: 285 }
    kosul: { gorev: { zincir_yukselenler: "basla" }, bayrak: "yukselenler_3_tamam" }
    agirlik: 1
    etiketler: ["yukselenler", "zincir", "ahlak"]
    gerilim: 4
    onemli: true
    kart: { tr: "Seni seven bir kalp", en: "A heart that loves you" }
    sahne: "yuk4_talep"
    sahneler:
      - id: "yuk4_talep"
        paragraflar:
          - { tr: "Gece yarısı kapında beyaz bir fener beliriyor. Bu sefer ne tepsi var ne kül; yalnız katlanmış bir kâğıt, üstünde de tek bir satır: \"Son ip.\"", en: "A white lantern at your door at midnight. No tray this time, no ash. Just one folded sheet of paper with one line on it: \"The last cord.\"" }
          - metin: { tr: "Fenerin arkasında {npc:vahit} duruyor; erimiş, gözleri çukura kaçmış, ama sesi hiç olmadığı kadar sakin. \"Bu gece konuştu,\" diyor. \"Senin sesin kadar açık. Senden son bir şey istiyor.\"", en: "{npc:vahit} is standing behind the lantern. He's gotten thin, his eyes sunk deep, but his voice has never been this calm. \"It spoke tonight,\" he says. \"As clear as you. It wants one last thing from you.\"" }
            kosul: { npc_hayatta: "vahit", bayrak: "vahit_hakli" }
          - metin: { tr: "Fenerin arkasında {npc:vahit} duruyor, gözünü senden kaçırarak. \"Ne olduğumu ikimiz de biliyoruz,\" diyor. \"Ama onlar bilmiyor. Ve son bir şeye ihtiyaçları var: bir kanıta.\"", en: "{npc:vahit} is standing behind the lantern, and he won't meet your eyes. \"We both know what I am,\" he says. \"But they don't. And they need one last thing. Proof.\"" }
            kosul: { npc_hayatta: "vahit", bayrak: "vahit_sahtekar" }
          - metin: { tr: "Fenerin arkasında {npc:vahit}, ayakları yine çıplak. \"Sistem merdivenin son basamağını istiyor,\" diyor. \"O basamağı da bir tek sen verebilirsin.\"", en: "{npc:vahit} is standing behind the lantern, barefoot again. \"The System wants the last rung of the ladder,\" he says. \"And only you can give it.\"" }
            kosul: { npc_hayatta: "vahit", bayrak_yok: ["vahit_hakli", "vahit_sahtekar"] }
          - metin: { tr: "Feneri peygamber değil, halkanın en içindeki on iki kişi taşıyor. Hepsi birden, tek bir ağızdan konuşuyor; peygamber öldüğünden beri hep böyle konuşurlar.", en: "The lantern isn't carried by the prophet. It's carried by the inner twelve of the ring. They speak at the same time, out of one mouth. They've talked like that ever since the prophet died." }
            kosul: { npc_olu: "vahit" }
          - { tr: "\"Sistem kanıt istiyor,\" diye sürdürüyor ses. \"Seni bu dünyaya bağlayan son ipi kestiğine dair bir kanıt. Bir kalp. Seni seven bir kalp Ocak'a yürüyecek.\"", en: "\"The System wants proof,\" the voice goes on. \"Proof that you've cut the last cord tying you to this world. A heart. A heart that loves you walks into the Kiln.\"" }
          - metin: { tr: "Sarnıcı sen mühürlemiştin. Ama {yer:tepe} yeni bir Ocak açmış: rasathanenin bodrumunda, bir kazanın içinde, daha küçük ve daha aç bir zar.", en: "The reservoir's sealed; you sealed it. But the hill opened a new Kiln: in the observatory basement, inside an old boiler, a smaller, hungrier membrane." }
            kosul: { bayrak: "sarnic_kapandi" }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Bunun Sistem'le hiçbir ilgisi yok; düpedüz bir sadakat sınavı. Sınavı yapanlar seni ne kadar kaybedebileceklerini ölçüyor.", en: "This has nothing to do with the System. It's a loyalty test, and whoever's giving it is measuring how much they stand to lose you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni seven bir kalp. listeyi hiç düşündün mü? ben de listedeyim. kalbim yok, ama... listedeyim.", en: "a̷ heart that loves you. have you thought about the list? i'm on it. i don't have a heart, but... i'm on it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bana bakma. Bakarsan... Ne olur bana bakma.\"", en: "\"Don't look at me. If you look at me... just don't look at me.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kalp, öyle mi? Benimki seni pek sevmez, haberin olsun. Yani... bilmiş ol.\"", en: "\"A heart, huh. Mine doesn't like you that much, for the record. Just... for the record.\"" }
        secenekler:
          - id: "on_uc"
            etiket: { tr: "On Üç'ü sun", en: "Offer Thirteen" }
            goster: { bayrak: "on_ucuncu_yaninda" }
            etkiler:
              - ahlak: { merhamet: -12, insanlik: -12 }
              - unvan: "kurban_eden"
              - xp_seviye: 80
              - itibar: { yukselenler: 10 }
              - bayrak: "on_ucuncu_kurban"
              - bayrak: "yukselenler_4_tamam"
            kronik: { tr: "Sana tanrıymışsın gibi bakan, listede bir numarası olan genci kendi ellerinle {yer:tepe|in} Ocak'ına yürüttün.", en: "You walked a boy who looked at you like a god into the Kiln with your own hands." }
            sonraki: "yuk4_on_uc"
          - id: "kendin"
            etiket: { tr: "Kendini sun, Ocak'a sen yürü", en: "Offer yourself. Walk into the Kiln" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: 3 }
              - dikkat: 6
              - itibar: { yukselenler: 12 }
              - bayrak: "kurban_kendisi"
              - bayrak: "yukselenler_4_tamam"
            kronik: { tr: "Seni seven kalp olarak kendini sunup Ocak'tan yanmadan çıktın; {yer:tepe} sana o günden sonra Yanmayan dedi.", en: "You offered yourself as the heart that loves you and walked out of the Kiln unburned. From then on the hill called you the Unburnable." }
            sonraki: "yuk4_kendin"
          - id: "vahit"
            etiket: { tr: "\"Seni seven kalp onunki.\" {npc:vahit|i} göster", en: "\"The heart that loves me is his.\" Point at {npc:vahit}" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -4 }
              - iliski: { vahit: { korku: 15 } }
            kronik: { tr: "Sevgi kanıtı isteyen peygambere, seni en çok sevenin kendisi olduğunu söyledin.", en: "When the prophet demanded proof of love, you told him the one who loved you most was him." }
            sonraki: "yuk4_vahit"
          - id: "deniz"
            etiket: { tr: "Beyaz Kalkan'ı, {npc:deniz_arman|i} sun", en: "Offer the White Shield. Offer {npc:deniz_arman}" }
            goster: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -8 }
              - iliski: { deniz_arman: { guven: -30, baglilik: -20 } }
            kronik: { tr: "Yükselenler senden seni seven bir kalp istediğinde en eski arkadaşının adını söyledin.", en: "When the Ascended asked for a heart that loved you, you said your oldest friend's name." }
            sonraki: "yuk4_deniz"
          - id: "hayran"
            etiket: { tr: "Sana tapan birini seç, kalp kalptir", en: "Pick one of your worshippers. A heart's a heart" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -8 }
              - xp_seviye: 40
              - itibar: { yukselenler: 6 }
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "yukselenler_4_tamam"
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Seni seven bir kalp istendiğinde kalp kalptir deyip sana tapan bir yabancıyı seçtin.", en: "A heart's a heart, you figured, and picked a stranger who worshipped you." }
            sonraki: "yuk4_hayran"
          - id: "ret"
            etiket: { tr: "Kâğıdı yırt, sunağı devirmeye git", en: "Tear up the paper. Go knock over the altar" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 6, duzen: -2 }
              - itibar: { yukselenler: -20 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - savas: { dusmanlar: ["secilmis_avci@oyuncu+3", "yukselen_muhafiz@dunya", "yukselen_muhafiz@dunya"], ortam: ["karanlik", "dar_gecit"], kazan: "yuk4_ret_zafer", kaybet: "yuk4_ret_yenilgi" }
            kronik: { tr: "Son ipi kesmeyi reddedip {yer:tepe|in} Ocak'ını devirmeye yürüdün.", en: "You refused to cut the last cord and went to tear down the hill's Kiln." }

      - id: "yuk4_on_uc"
        yer: "tepe"
        paragraflar:
          - { tr: "On Üç'e söylediğinde ağlamıyor. Gülümsüyor; o ilk akşam tepsiyi uzattığı gibi, sana bir şey sunar gibi. \"Biliyordum,\" diyor. \"Listede bir numaram vardı. Artık bir anlamı da var.\"", en: "When you tell Thirteen, he doesn't cry. He smiles, the way he held out that tray the first night, like he's offering you something. \"I knew it,\" he says. \"I had a number on the list. Now it means something.\"" }
          - { tr: "Ocak'ın kenarında durup sana dönüyor ve ilk kez gerçek adını söylüyor. Daha önce kimseye söylememiş; şimdi o adı bir tek sen biliyorsun.", en: "He stands at the edge of the Kiln and turns back to you. Then, for the first time, he tells you his real name. He's never told it to anyone before. Now you're the only one who knows it." }
          - { tr: "Zar onu bir nefeste içine çekiyor. Penceren imzasız tek bir satır basıyor: \"[Son ip kesildi. Teşekkürler.]\" İçinde bir yer susuyor ve bir daha hiç ses vermiyor.", en: "The membrane takes him in one breath. Your window prints one line, unsigned: \"[Last cord severed. Thank you.]\" Somewhere inside you, a place goes quiet and never makes a sound again." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "a̷dını söyledi, ben de duydum. onu senin yerine ben saklayacağım. sen saklamayacaksın, biliyorum.", en: "h̷e said his name. i heard it too. i'll keep it for you. you won't keep it. i know you won't." }
        secenekler:
          - id: "adini"
            etiket: { tr: "Adını yüksek sesle tekrarla", en: "Say his name back, out loud" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 4 } }
            kronik: { tr: "On Üç'ü Ocak'a yürüttükten sonra gerçek adını bütün {yer:tepe|e} duyurdun.", en: "You walked Thirteen into the Kiln, and then you told the whole hill his real name." }
            sonraki: "@akis"
          - id: "unut"
            etiket: { tr: "Adını unut. Bilerek", en: "Forget his name. On purpose" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - yozlasma: 4
              - iliski: { yanki: { guven: -6 } }
            kronik: { tr: "On Üç'ün sana emanet ettiği tek şeyi, adını, bilerek unuttun.", en: "Thirteen trusted you with one thing, his name, and you forgot it on purpose." }
            sonraki: "@akis"

      - id: "yuk4_kendin"
        yer: "tepe"
        paragraflar:
          - { tr: "\"Beni seven bir kalp,\" diyorsun. \"Kendimden başka kimseye bu kadar güvenmem.\" Kimse önüne geçmeden Ocak'ın zarına yürüyorsun.", en: "\"A heart that loves me,\" you say. \"I don't trust anybody else that much.\" Nobody stops you as you walk into the Kiln's membrane." }
          - { tr: "İçeride bir şey seni yine tartıyor, bu sefer daha uzun uzun; kibarca, neredeyse özür diler gibi. Sonunda yine pes edip seni dışarı bırakıyor: cübben yanıp gitmiş, tenine ise dokunulmamış.", en: "Inside, something weighs you again. Longer this time. Almost polite, almost apologetic. Then it gives up again and lets you out, your robe burned away, your skin untouched." }
          - { tr: "{yer:tepe} diz çöküyor. Yüzlerce ağızdan aynı kelime yükseliyor; senin adın değil bu, yeni adın: \"Yanmayan.\"", en: "The hill kneels. The same word comes out of hundreds of mouths, and it isn't your name. It's your new one: \"The Unburnable.\"" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[Unvan: Yanmayan]", en: "[Title: The Unburnable]" }
            satirlar:
              - { tr: "Ocak seni iki kez reddetti. Üçüncüsünü denemeyecek.", en: "The Kiln has rejected you twice. It won't try a third time." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Yeni adını kabul et", en: "Accept your new name" }
            etkiler:
              - unvan: "kendi_yakiti"
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { yukselenler: 6 }
            kronik: { tr: "Kendi adını bırakıp {yer:tepe|in} sana verdiği Yanmayan adını kabul ettin.", en: "You let go of your own name and took the one the hill gave you: the Unburnable." }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "\"Benim bir adım var.\"", en: "\"I already have a name.\"" }
            etkiler:
              - unvan: "kendi_yakiti"
              - ahlak: { insanlik: 4 }
              - itibar: { yukselenler: -2 }
            kronik: { tr: "Ocak'tan yanmadan çıktın ama {yer:tepe|e} kendi adını hatırlattın.", en: "You walked out of the Kiln unburned, but you made the hill remember your real name." }
            sonraki: "@akis"

      - id: "yuk4_vahit"
        paragraflar:
          - { tr: "{npc:vahit} önce anlamıyor; anlayınca da yüzünden bütün kan çekiliyor. Bir adım geriliyor, sonra durup aynaya bakar gibi kendine bakıyor.", en: "For a second {npc:vahit} doesn't get it. Then he does, and all the color drains from his face. He takes a step back, then stops and looks at himself, like he's looking in a mirror." }
          - metin: { tr: "\"Beni istiyorsa,\" diye fısıldıyor, \"haklıdır. Hep haklıydı.\" Ve ayakları kanlı, adımları emin, Ocak'a doğru yürümeye başlıyor.", en: "\"If it wants me,\" he whispers, \"then it's right. It was always right.\" And he starts walking toward the Kiln, feet bloody, steps steady." }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "\"Hiçbir şey duymadım,\" diye fısıldıyor. \"Belki bir kere duydum. Sonra hiç.\" Yine de Ocak'a doğru yürümeye başlıyor; ömründe ilk kez gerçek bir şey yapan bir adam gibi.", en: "\"I never heard anything,\" he whispers. \"Once, maybe. Then never again.\" And he starts walking toward the Kiln anyway, like a man doing the first real thing he's ever done." }
            kosul: { bayrak_yok: "vahit_hakli" }
        secenekler:
          - id: "cek"
            etiket: { tr: "Son adımda onu geri çek", en: "Pull him back on the last step" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: -2 }
              - iliski: { vahit: { baglilik: 30, guven: 15 } }
              - npc_iz: { vahit: "can_borcu" }
              - bayrak: "vahit_ocaktan_cekildi"
              - bayrak: "yukselenler_4_tamam"
              - itibar: { yukselenler: 10 }
            kronik: { tr: "Peygamberi Ocak'ın kenarından geri çektin; o günden sonra sana Sistem'e bile olmadığı kadar bağlandı.", en: "You pulled the prophet back from the edge of the Kiln. From then on he was bound to you tighter than he'd ever been to the System." }
            sonraki: "@akis"
          - id: "yurusun"
            etiket: { tr: "Yürümesine izin ver", en: "Let him walk" }
            etkiler:
              - ahlak: { merhamet: -10, insanlik: -10 }
              - npc_ol: "vahit"
              - bayrak: "yukselenler_4_tamam"
              - xp_seviye: 60
              - itibar: { yukselenler: 4 }
            kronik: { tr: "Yükselenler'in peygamberini kendi Ocak'ına yürüttün; {yer:tepe|in} ağzı o gece sonsuza dek sustu.", en: "You walked the Ascended's prophet into his own Kiln. That night the hill's mouth went silent for good." }
            sonraki: "@akis"

      - id: "yuk4_deniz"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} rasathanenin bodrumuna beyazlar içinde iniyor; göğsünde dikili bir göz, sırtında kalkanı. Ocak'ın önünde durup sana bakıyor.", en: "{npc:deniz_arman} comes down into the observatory basement in white, the eye stitched on {zamir:deniz_arman|onun} chest, the shield on {zamir:deniz_arman|onun} back. {zamir:deniz_arman|o|b} stop{zamir:deniz_arman|s} in front of the Kiln and look{zamir:deniz_arman|s} at you." }
          - { tr: "\"Seni seven bir kalp,\" diyor. Sesi çatlıyor ama kırılmıyor. \"Doğru seçmişsin. Ama yanmayacağım. Senin yüzünden bir kez gittim, senin için ölmem.\"", en: "\"A heart that loves you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. {zamir:deniz_arman|onun|b} voice cracks, but it doesn't break. \"Good pick. But I'm not burning. I left once because of you. I'm not dying for you.\"" }
          - { tr: "Kalkanını sırtından indirip öne çıkıyor. Bodrumdaki beyazlar geri çekiliyor; Beyaz Kalkan'ın karşısında durmak kimsenin işine gelmiyor.", en: "{zamir:deniz_arman|o|b} pull{zamir:deniz_arman|s} the shield off {zamir:deniz_arman|onun} back and step{zamir:deniz_arman|s} forward. The white robes in the basement back away. Nobody wants to stand in front of the White Shield." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kalkanına karşı dur", en: "Stand against the shield" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - savas: { dusmanlar: ["deniz_beyaz_kalkan@oyuncu+4"], ortam: ["dar_gecit"], kazan: "yuk4_deniz_zafer", kaybet: "yuk4_deniz_yenilgi" }
            kronik: { tr: "En eski arkadaşınla bir Ocak'ın önünde dövüştün.", en: "You fought your oldest friend in front of a Kiln." }
          - id: "vazgec"
            etiket: { tr: "\"Haklısın. Kendimi sunuyorum.\"", en: "\"You're right. I'll offer myself.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { deniz_arman: { saygi: 10, guven: 6 } }
            kronik: { tr: "Arkadaşını Ocak'a sunar sunmaz pişman olup onun yerine kendin yürüdün.", en: "The moment you offered your friend to the Kiln, you regretted it, and walked in yourself instead." }
            sonraki: "yuk4_kendin"

      - id: "yuk4_deniz_zafer"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkan bodrumun taş zemininde dönüp dönüp sonunda duruyor. {npc:deniz_arman} Ocak'ın zarına bir kol boyu uzaklıkta dizlerinin üstüne çökmüş; nefes nefese, yenik, gözleri sende.", en: "The shield spins to a stop on the basement's stone floor. {npc:deniz_arman} is on {zamir:deniz_arman|onun} knees, an arm's length from the Kiln's membrane, out of breath, beaten, eyes on you." }
          - { tr: "\"Hadi,\" diyor. \"Vapurda simidimi de sen yemiştin zaten.\"", en: "\"Go on,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You ate my pretzel on the ferry anyway.\"" }
        secenekler:
          - id: "it"
            etiket: { tr: "Onu zara it", en: "Push {zamir:deniz_arman|onu} into the membrane" }
            etkiler:
              - ahlak: { merhamet: -15, insanlik: -15 }
              - yozlasma: 10
              - npc_ol: "deniz_arman"
              - unvan: "kurban_eden"
              - xp_seviye: 120
              - bayrak: "deniz_ocakta"
              - bayrak: "deniz_oyuncu_oldurdu"
              - bayrak: "yukselenler_4_tamam"
            kronik: { tr: "Vapurda simidini bölüştüğün arkadaşını kendi ellerinle Ocak'a ittin; Yükselenler o geceyi son ipin kesildiği gece diye andı.", en: "You pushed the friend you shared pretzels with on the ferry into the Kiln with your own hands. The Ascended remembered it as the night the last cord was cut." }
            sonraki: "@akis"
          - id: "kaldir"
            etiket: { tr: "Elini uzat, onu ayağa kaldır", en: "Hold out your hand. Help {zamir:deniz_arman|onu} up" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 6 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - iliski: { deniz_arman: { guven: 15, saygi: 10 } }
              - hafiza: { npc: "deniz_arman", id: "olay:yukselenler_4_kurban", agirlik: 40 }
              - bayrak: "deniz_kurbandan_kurtuldu"
            kronik: { tr: "Ocak'ın önünde yendiğin arkadaşına elini uzatıp Yükselenler'in son sınavını orada yarım bıraktın.", en: "In front of the Kiln, you held your hand out to the friend you'd just beaten, and walked away from the Ascended's last test." }
            sonraki: "@akis"

      - id: "yuk4_deniz_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Kalkanın kenarı şakağına inince dünya yan yatıyor. Yerde yatıyorsun; {npc:deniz_arman} tepende dikiliyor, kalkanı havada. Ama indirmiyor.", en: "The edge of the shield catches your temple and the world tips over. You're on the floor, and {npc:deniz_arman} is standing over you, shield raised. It doesn't come down." }
          - { tr: "\"Gördün mü?\" diyor ağlayarak. \"İnsansın işte. Hâlâ.\" Kalkanını yeniden sırtına asıp merdivenden çıkıyor; arkasında Ocak boş ve aç kalıyor.", en: "\"See?\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, crying. \"You're human. Still.\" {zamir:deniz_arman|o|b} sling{zamir:deniz_arman|s} the shield back on and climb{zamir:deniz_arman|s} the stairs, leaving the Kiln behind, empty and hungry." }
        secenekler:
          - id: "yat"
            etiket: { tr: "Taş zeminde bir süre daha yat", en: "Lie on the stone a while longer" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - iliski: { deniz_arman: { saygi: 6 } }
              - bayrak: "deniz_rakip_oldu"
            kronik: { tr: "Ocak'ın önünde en eski arkadaşına yenildin; o seni bağışladı ve Yükselenler'in sınavı yarım kaldı.", en: "You lost to your oldest friend in front of the Kiln. They spared you, and the Ascended's test went unfinished." }
            sonraki: "@akis"
          - id: "kendin"
            etiket: { tr: "Kalk, Ocak'a kendin yürü", en: "Get up. Walk into the Kiln yourself" }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: 2 }
              - bayrak: "deniz_rakip_oldu"
            kronik: { tr: "Arkadaşına yenildikten sonra Ocak'a kendin yürüdün.", en: "After your friend beat you, you walked into the Kiln yourself." }
            sonraki: "yuk4_kendin"

      - id: "yuk4_hayran"
        yer: "tepe"
        paragraflar:
          - { tr: "Bodrumda seni bekleyen yüzlerden birini gösteriyorsun: boynundaki ipe senin adını yazmış genç bir kadın. Seçildiğini anlayınca yüzü doğum günü sabahındaki bir çocuk gibi aydınlanıyor.", en: "You point to one of the faces waiting in the basement: a young woman with a string around her neck she's written your name on. When she understands she's been picked, her face lights up like a birthday morning." }
          - { tr: "Koşa koşa zara giriyor. Penceren imzasız bir satır basıyor: \"[Kabul edildi.]\" Ona adını sormadığını ancak o gittikten sonra anlıyorsun.", en: "She runs into the membrane. Your window prints an unsigned line: \"[Accepted.]\" Only after she's gone do you realize you never asked her name." }
        secenekler:
          - id: "sor"
            etiket: { tr: "Kim olduğunu sor, biri mutlaka bilir", en: "Ask who she was. Somebody knows" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Sana tapan bir yabancıyı Ocak'a yolladın ve ancak sonra adını sordun.", en: "You sent a stranger who worshipped you into the Kiln, and only afterward asked her name." }
            sonraki: "@akis"
          - id: "sorma"
            etiket: { tr: "Sorma. Kalp kalptir", en: "Don't ask. A heart's a heart" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - yozlasma: 3
            kronik: { tr: "Sana tapan bir yabancıyı Ocak'a yolladın ve adını hiç öğrenmedin.", en: "You sent a stranger who worshipped you into the Kiln and never learned her name." }
            sonraki: "@akis"

      - id: "yuk4_ret_zafer"
        yer: "tepe"
        paragraflar:
          - { tr: "Ocak'ın kazanı devriliyor; zar sönen bir balon gibi bodrumun duvarlarına yapışıp kuruyor. Seçilmiş avcı kırık kalkanının yanında yerde yatıyor, muhafızlar çoktan merdivenlerden kaçmış.", en: "The Kiln's boiler tips over, and the membrane deflates like a balloon, sticks to the basement walls, and dries out. The Chosen hunter's on the floor next to his broken shield. The guards ran up the stairs." }
          - { tr: "Yukarıda {yer:tepe|in} fenerleri birer birer sönüyor. Sen son ipi kesmeyi reddettin, {yer:tepe} de artık seni kendinden saymıyor.", en: "Up top, the hill's lanterns go out one by one. You refused to cut the last cord, and the hill doesn't count you as one of its own anymore." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Bodrumu ateşe ver", en: "Set the basement on fire" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -3 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { vahit: { korku: 8, guven: -10 } }
            kronik: { tr: "{yer:tepe|in} ikinci Ocak'ını devirip rasathanenin bodrumunu yaktın.", en: "You knocked over the hill's second Kiln and burned out the observatory basement." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Beyaz cübbeni bodrumda bırak, çık", en: "Leave your white robe in the basement. Go" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Beyaz cübbeni devrilmiş Ocak'ın yanında bırakıp {yer:tepe|den} indin.", en: "You left your white robe beside the toppled Kiln and walked down off the hill." }
            sonraki: "@akis"

      - id: "yuk4_ret_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Seçilmiş avcının kılıcı seni merdivenin dibine seriyor. Bodrumun tavanı başının üstünde dönüyor; muhafızların ayakları, Ocak'ın uğultusu.", en: "The Chosen hunter's blade drops you at the foot of the stairs. The basement ceiling spins: guards' feet, and the hum of the Kiln." }
          - { tr: "Seni öldürmüyorlar; yüzüne külle işaret çizip {yer:tepe|in} kapısına bırakıyorlar. Artık onlar için ne seçilmişsin ne yakıt, yalnızca bir uyarı.", en: "They don't kill you. They leave you at the hill's gate with your face marked in ash. To them you're not Chosen anymore, and not fuel either. Just a warning." }
        secenekler:
          - id: "sil"
            etiket: { tr: "Külü yüzünden sil", en: "Wipe the ash off your face" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "{yer:tepe} seni yüzün külle işaretlenmiş hâlde kapısına attı; külü silip yürüdün.", en: "The hill dumped you at its gate with ash on your face. You wiped it off and walked." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Külü bırak, herkes görsün", en: "Leave the ash. Let everyone see" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 2 }
              - itibar: { siginak: 3 }
            kronik: { tr: "{yer:tepe|in} yüzüne sürdüğü külü, şehir görsün diye günlerce silmeden taşıdın.", en: "You wore the ash the hill smeared on your face for days, so the city could see it." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 5: MUTLAK SADAKAT
  # npc listesi bilerek boş (Vahit ölmüş olabilir). gorev tamam = Yükseliş sonunun zincir koşulu.
  - id: "yukselenler_5_mutlak_sadakat"
    perde: [4]
    ana_yay: { gun: 340 }
    kosul: { gorev: { zincir_yukselenler: "basla" }, bayrak: "yukselenler_4_tamam" }
    agirlik: 1
    etiketler: ["yukselenler", "zincir", "ahlak", "ana_yay"]
    gerilim: 4
    onemli: true
    kart: { tr: "Mutlak sadakat", en: "Total loyalty" }
    sahne: "yuk5_cagri"
    sahneler:
      - id: "yuk5_cagri"
        yer: "tepe"
        paragraflar:
          - { tr: "Gök artık mavi değil. Panellerin ardında Kadim filosunun gölgeleri dolaşıyor, her sabah göğe aynı satır yazılıyor: kalan gün sayısı. {yer:kiyikent} korkudan dilini yutmuş; bir tek {yer:tepe} şarkı söylüyor.", en: "The sky isn't blue anymore. The shadows of the Ancient fleet drift behind the panels, and every morning the same line gets written across the sky: the number of days left. {yer:kiyikent} has gone quiet with fear. Only the hill is singing." }
          - { tr: "Yokuşun her basamağı, her damı, her balkonu insanla dolu. Binlerce alında gri başparmak izi, ortada rasathanenin yarığından göğe uzanan beyaz bir sütun. {yer:tepe} bütün şehrin korkusunu toplayıp ona bir ilahi yazmış.", en: "There are people on every step of the hill, on every roof, on every balcony. Thousands of foreheads with gray thumbprints, and in the middle, a white pillar reaching from the split dome up into the sky. The hill has gathered up the whole city's fear and written it a hymn." }
          - metin: { tr: "Sütundan bir ses geliyor ve bu sefer herkes duyuyor: peygamber haklıymış. Göğün panellerinde imzalı bir satır parlıyor: \"[Ön seçim tamamlandı. Yükselen adayı: {oyuncu}.]\"", en: "A voice comes out of the pillar, and this time everybody hears it; the prophet was right. Across the sky panels, a signed line: \"[Pre-selection complete. Ascension candidate: {oyuncu}.]\"" }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "Sütundan hiçbir ses gelmiyor; hiçbir zaman gelmedi. {npc:vahit} binlerce yüzün önünde sana dönüp yalnız senin duyabileceğin kadar alçak sesle konuşuyor: \"Şimdi sen konuş. Ses sen ol. Ben hep yalnızca bekledim.\"", en: "No voice comes out of the pillar. None ever did. In front of thousands of faces {npc:vahit} turns to you and speaks low enough that only you can hear: \"Now you speak. Be the voice. All I ever did was wait.\"" }
            kosul: { bayrak: "vahit_sahtekar", npc_hayatta: "vahit" }
          - metin: { tr: "{npc:vahit} sütunun dibinde bekliyor: yalınayak, gözleri ışıl ışıl. Mikrofonsuz sesi yine her kulağa ulaşıyor. \"Merdivenin sonuna geldik,\" diyor. \"Son basamak sadakattir. Hem de mutlak olanı.\"", en: "{npc:vahit} waits at the foot of the pillar, barefoot, eyes shining, his voice once again reaching every ear without a mic. \"We've come to the end of the ladder,\" he says. \"The last rung is loyalty. The total kind.\"" }
            kosul: { npc_hayatta: "vahit", bayrak_yok: "vahit_sahtekar" }   # sahtekâr dalında alçak sesli paragrafla çakışmasın
          - metin: { tr: "Peygamber artık yok. Sütunun dibinde halkanın on iki kişisi durmuş, tek bir ağızdan konuşuyor: \"Ağız sustu, ama merdiven ayakta. Son basamak sadakattir. Hem de mutlak olanı.\"", en: "The prophet is gone. At the foot of the pillar stand the inner twelve of the ring, speaking out of one mouth: \"The mouth went quiet, but the ladder still stands. The last rung is loyalty. The total kind.\"" }
            kosul: { npc_olu: "vahit" }
          - metin: { tr: "Sütunun önünde Seçilmişlerin muhafızı olarak {npc:deniz_arman} bekliyor; beyazlar içinde, kalkanı sırtında. Sana bakmıyor, bakamıyor.", en: "In front of the pillar, guarding the Chosen, stands {npc:deniz_arman}, all in white, shield on {zamir:deniz_arman|onun} back. {zamir:deniz_arman|o|b} won't look at you. Can't." }
            kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kalabalığın içinden bir fısıltı dalgası geçiyor: \"Yanmayan.\" Ocak'ın iki kez geri çevirdiği kişi sensin; bu gece onlar da senden kendilerini geri çevirmemeni istiyor.", en: "A wave of whispers passes through the crowd: \"The Unburnable.\" You're the one the Kiln refused twice. Tonight they're asking you not to refuse them." }
            kosul: { bayrak: "kurban_kendisi" }
          - { tr: "Son Ocak'ın kuralı basit: diz çöküp kendini Sistem'e yazdırırsın, ardından {yer:tepe|de} toplanan herkes birer birer peşinden sütuna yürür. Binlerce katkı, tek bir alıcı. Hasat gelmeden kendi hasadını kaldıran bir şehir.", en: "The rule of the Last Kiln is simple: you kneel and let the System write you in. Then everyone on the hill walks into the pillar after you, one by one. Thousands of contributions, a single recipient. A city harvesting itself before the Harvest arrives." }
        sezgiler:
          - kosul: { stat: { per: 350 } }
            metin: { tr: "Sütunun içindeki sayaç: 9.871. Kalabalık: aşağı yukarı 11.000. Hesap tutuyor. Seni S kademesinin de ötesine taşır bu; nereye, kimse bilmiyor.", en: "The counter inside the pillar: 9,871. The crowd: roughly 11,000. The math works. It would carry you past Grade S. To where, nobody knows." }
          - kosul: { stat: { wis: 350 } }
            metin: { tr: "Bu insanların çoğu sana değil, bitmek bilmeyen korkunun sona ermesine tapıyor. Sen yalnızca o sonun yüzüsün.", en: "Most of these people aren't worshipping you. They're worshipping an end to the endless fear. You're just the face it's wearing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷iz çökersen ben ne olacağım? bir satır mı, bir dipnot mu? sistem seni yazarsa beni siler. bunu bil. yalnızca... bil.", en: "i̷f you kneel, what happens to me? a line? a footnote? if the system writes you in, it erases me. know that. just... know it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"On bir bin kişi. Hepsinin bir adı vardı. Hepsinin.\"", en: "\"Eleven thousand people. Every one of them had a name. Every one.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Diz çökersen Sistem'in kaynak koduna değil, midesine girersin. Lütfen. Bir kerecik beni dinle.\"", en: "\"Kneel and you're not going into the System's source code. You're going into its stomach. Please. Listen to me once.\"" }
        secenekler:
          - id: "diz"
            etiket: { tr: "Diz çök, Sistem seni yazsın", en: "Kneel. Let the System write you in" }
            etkiler:
              - ahlak: { insanlik: -20, duzen: 6, merhamet: -6 }
              - gorev: { zincir_yukselenler: "tamam" }
              - xp_seviye: 200
              - yozlasma: 10
              - itibar: { yukselenler: 20 }
              - degisken: { hayatta_kalan: -8 }
              - bayrak: "yukselis_sadakati"
              - iliski: { yanki: { guven: -15 } }
            kronik: { tr: "Hasat gelmeden {yer:tepe|de} diz çöküp kendini Sistem'e yazdırdın; arkandan on bir bin kişi beyaz sütuna yürüdü.", en: "Before the Harvest you knelt on the hill and let the System write you in. Behind you, eleven thousand people walked into the white pillar." }
            sonraki: "yuk5_diz"
          - id: "taht"
            etiket: { tr: "Diz çökme. Onları kendine diz çöktür", en: "Don't kneel. Make them kneel to you" }
            etkiler:
              - ahlak: { insanlik: -15, duzen: 10, merhamet: -5 }
              - gorev: { zincir_yukselenler: "tamam" }
              - ordu_kazan: 40
              - itibar: { yukselenler: 20 }
              - degisken: { hayatta_kalan: -3 }
              - bayrak: "yukselenler_oyuncuya_bagli"
            kronik: { tr: "{yer:tepe} senden Sistem'e sadakat bekliyordu; sen o sadakati kendine çevirdin ve on bir bin kişi önünde diz çöktü.", en: "The hill asked for your loyalty to the System. You took that loyalty for yourself, and eleven thousand people knelt to you." }
            sonraki: "yuk5_taht"
          - id: "yakitsiz"
            tur: "gosteris"
            etiket: { tr: "Sadakatlerini al, tek kişiyi bile yakmadan", en: "Take their loyalty. Without burning anyone" }
            gerekli: { stat: { cha: 350 } }
            etkiler:
              - ahlak: { insanlik: -8, merhamet: 6, duzen: 4 }
              - gorev: { zincir_yukselenler: "tamam" }
              - dikkat: 10
              - ordu_kazan: 30
              - itibar: { yukselenler: 15 }
              - bayrak: "yukselenler_yakitsiz"
            kronik: { tr: "On bir bin kişinin mutlak sadakatini tek bir cümleyle aldın ve sütuna kimseyi yürütmedin.", en: "You took the total loyalty of eleven thousand people with a single sentence and didn't walk a single one into the pillar." }
            sonraki: "yuk5_yakitsiz"
          - id: "dagit"
            etiket: { tr: "Son Ocak'ı söndür, Yükselenler'i dağıt", en: "Put out the Last Kiln. Disband the Ascended" }
            etkiler:
              - ahlak: { insanlik: 10, merhamet: 8, duzen: -4 }
              - gorev: { zincir_yukselenler: "basarisiz" }
              - itibar: { yukselenler: -30, siginak: 6 }
              - degisken: { hayatta_kalan: 6 }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Merdivenin en üst basamağına varınca Son Ocak'ı söndürmek için elini zarın kenarına koydun.", en: "At the very top of the ladder, you laid your hand on the edge of the membrane to put out the Last Kiln." }
            sonraki: "yuk5_dagit"

      - id: "yuk5_diz"
        yer: "tepe"
        paragraflar:
          - { tr: "Dizlerin taşa değdiği an dünya susuyor. Ardından penceren açılıyor, ama bu sefer sana bir şey göstermek için değil, seni okumak için.", en: "Your knees touch the stone and the world goes silent. Then your window opens, but not to show you something this time. To read you." }
          - { tr: "Satır satır yazılıyorsun: adın, seviyen, korktuğun ve sevdiğin her şey. Sevdiklerinin satırları birer birer çiziliyor. Arkanda ilk yakıt sütuna yürürken içinde bir şey seninle birlikte büyümeye başlıyor.", en: "You get written in line by line: your name, your level, everything you're afraid of, everything you love. One by one, the lines with the people you love get struck out. Behind you, the first fuel walks into the pillar, and something inside you grows along with it." }
          - { tr: "Sabaha kadar yürüyorlar. Gün ağardığında {yer:tepe} bomboş; sen ise artık hiçbir insan bedenine sığmayacak kadar büyüksün. Göğün panelleri de ilk kez doğrudan sana bakıyor.", en: "They walk until dawn. In the morning the hill is empty, and you're far bigger than anywhere a person could fit, and for the first time the sky panels are looking straight at you." }
        bildirimler:
          - tur: "evrim"
            nadirlik: "mitik"
            baslik: { tr: "[Yükselen kaydı oluşturuldu]", en: "[Ascendant record created]" }
            satirlar:
              - { tr: "Katkı: 11.204. İnsanlık payı: yeniden hesaplanıyor.", en: "Contribution: 11,204. Humanity share: recalculating." }
              - { tr: "Son karar için bekleniyorsun.", en: "You are awaited for the final decision." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Ayağa kalk, bomboş {yer:tepe|e} bak", en: "Get up. Look at the empty hill" }
            etkiler:
              - unvan: "sesin_ta_kendisi"
              - ahlak: { insanlik: -3 }
            kronik: { tr: "Sabah, bomboş kalmış {yer:tepe|in} ortasında tek başına ayağa kalktın.", en: "In the morning you stood up alone in the middle of the emptied hill." }
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "İçindeki sesleri saymaya çalış", en: "Try to count the voices inside you" }
            etkiler:
              - unvan: "sesin_ta_kendisi"
              - ahlak: { insanlik: 2, merhamet: 1 }
            kronik: { tr: "İçine giren on bir bin sesi saymaya çalıştın; üç yüzde vazgeçtin.", en: "You tried to count the eleven thousand voices that went into you. You gave up at three hundred." }
            sonraki: "@akis"

      - id: "yuk5_taht"
        yer: "tepe"
        paragraflar:
          - { tr: "Dizlerini kırmıyorsun. Sütun titreyerek bekliyor; sen ise kalabalığa dönüp tek bir şey söylüyorsun: \"Sistem değil. Ben.\"", en: "You stay on your feet. The pillar trembles, waiting, and you turn to the crowd and say one thing: \"Not the System. Me.\"" }
          - { tr: "Önce on iki kişi diz çöküyor, ardından kırkı, derken bütün yokuş; yukarıdan aşağıya bir dalga gibi. Beyaz sütun bir süre daha bekliyor, sonra kandırılmış gibi ağır ağır sönüyor.", en: "First the twelve kneel, then the forty, then the whole slope, top to bottom, like a wave. The white pillar waits a little longer, then slowly fades out, like something that just got cheated." }
          - metin: { tr: "En son diz çöken {npc:vahit} oluyor. Yüzünde korkuyla mutluluk iç içe: sonunda duyabileceği bir ses bulmuş.", en: "{npc:vahit} is the last to kneel. Fear and happiness on his face at the same time: he's finally found a voice he can actually hear." }
            kosul: { npc_hayatta: "vahit" }
        secenekler:
          - id: "ordu"
            etiket: { tr: "\"Kalkın. Hasada karşı yürüyeceğiz.\"", en: "\"Get up. We march against the Harvest.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - degisken: { kadim_tehdit: -3 }
            kronik: { tr: "Sana diz çöken on bir bin kişiyi Kadim hasadına karşı bir orduya çevirdin.", en: "You turned eleven thousand kneeling people into an army against the Ancient Harvest." }
            sonraki: "@akis"
          - id: "kalsin"
            etiket: { tr: "Bırak diz çökmüş kalsınlar", en: "Let them stay on their knees" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 4 }
              - yozlasma: 4
              - unvan: "sesin_ta_kendisi"
            kronik: { tr: "On bir bin kişiyi sabaha kadar dizlerinin üstünde bıraktın; hiçbiri kalkmaya cesaret edemedi.", en: "You left eleven thousand people on their knees until morning. Not one of them dared get up." }
            sonraki: "@akis"

      - id: "yuk5_yakitsiz"
        yer: "tepe"
        paragraflar:
          - { tr: "Sesini yükseltmiyorsun. Tek bir cümle söylüyorsun, yalnızca bir cümle; ama on bir bin kişi onu aynı anda kafasının içinde, kendi sesiyle duyuyor.", en: "You don't raise your voice. One sentence. Just one, but eleven thousand people hear it at the same time, inside their own heads, in their own voices." }
          - { tr: "Sütun bekliyor, ama kimse yürümüyor. Kalabalık alnındaki külü kendi eliyle siliyor. Sadakatleri yerli yerinde; yalnız artık ateşe değil, sana.", en: "The pillar waits. Nobody walks. The crowd wipes the ash off their own foreheads with their own hands. Their loyalty is still there; it's just not owed to the fire anymore. It's owed to you." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Anomali Dikkati yükseldi]", en: "[Anomaly Attention increased]" }
            satirlar:
              - { tr: "Hasat protokolü bir sapma kaydetti: yakıtsız sadakat.", en: "Harvest protocol logged a deviation: loyalty without fuel." }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Aç kalan sütunu söndür", en: "Put out the starving pillar" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak: "sarnic_kapandi"
            kronik: { tr: "Yakıtsız kalan beyaz sütunu kendi elinle söndürdün.", en: "You snuffed out the starving white pillar with your own hand." }
            sonraki: "@akis"
          - id: "dursun"
            etiket: { tr: "Sütun dursun, bir gün lazım olabilir", en: "Leave the pillar. You might need it someday" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
            kronik: { tr: "Yakıtsız sadakati aldın ama Son Ocak'ı söndürmedin; bir gün lazım olabilirdi.", en: "You took loyalty without fuel, but you didn't put out the Last Kiln. You might need it someday." }
            sonraki: "@akis"

      - id: "yuk5_dagit"
        yer: "tepe"
        paragraflar:
          - { tr: "Sütunun dibine inip elini zarın kenarına koyuyorsun. Kalabalık nefesini tutuyor, ilahi yarıda kesiliyor.", en: "You walk down to the foot of the pillar and lay your hand on the edge of the membrane. The crowd holds its breath, and the hymn breaks off mid-line." }
          - { tr: "Seçilmişlerin muhafızları silahlarına davranıyor; en önde binlerce yakıtın katkısıyla şişip kabarmış bir Seçilmiş avcı var. \"Merdiveni yıkamazsın,\" diyor. \"Merdiven biziz.\"", en: "The Chosen's guards reach for their weapons, and in front, a Chosen hunter swollen on the contributions of thousands. \"You can't tear down the ladder,\" he says. \"We are the ladder.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Merdiveni yık", en: "Tear the ladder down" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 2 }
              - savas: { dusmanlar: ["secilmis_avci@oyuncu+6", "yukselen_muhafiz@dunya", "yukselen_muhafiz@dunya"], ortam: ["karanlik"], kazan: "yuk5_dagit_zafer", kaybet: "yuk5_dagit_yenilgi" }
            kronik: { tr: "Yükselenler'in son Seçilmişleriyle Son Ocak'ın önünde dövüştün.", en: "In front of the Last Kiln you fought the Ascended's last Chosen." }
          - id: "konus"
            etiket: { tr: "Kalabalığa dön: \"Kimse size merdiven borçlu değil.\"", en: "Turn to the crowd: \"Nobody owes you a ladder.\"" }
            zar: { stat: "cha", zorluk: 38, tek: true, basarisiz: "yuk5_dagit_yenilgi", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 3 }
              - degisken: { hayatta_kalan: 4 }
            kronik: { tr: "On bir bin kişilik kalabalığa dönüp kimsenin onlara merdiven borçlu olmadığını söyledin.", en: "You turned to eleven thousand people and told them nobody owed them a ladder." }
            sonraki: "yuk5_dagit_zafer"

      - id: "yuk5_dagit_zafer"
        yer: "tepe"
        paragraflar:
          - { tr: "Beyaz sütun mum gibi sönüveriyor. Yokuştaki binlerce insan bir süre kıpırdamadan bekliyor; derken biri alnındaki külü siliyor, ardından bir başkası.", en: "The white pillar goes out like a candle. The thousands on the slope stand still for a while. Then someone wipes the ash off their forehead, then someone else." }
          - { tr: "Teşekkür eden çıkmıyor. Gök hâlâ kalan günleri sayıyor, ama {yer:tepe} bu sefer ona eşlik etmiyor; dağılıp gidiyor yalnızca: evlerine, ailelerine, korkularına.", en: "Nobody says thank you. The sky is still counting the days left, but this time the hill isn't counting along. It just breaks apart, back to its homes, its families, its fears." }
          - metin: { tr: "{npc:vahit} çıplak ayakları, bomboş elleriyle rasathanenin basamaklarına çökmüş. \"Şimdi ben ne olacağım?\" diye soruyor boşluğa.", en: "{npc:vahit} sits on the observatory steps, bare feet, empty hands. \"What am I now?\" he asks, of no one." }
            kosul: { npc_hayatta: "vahit" }
        secenekler:
          - id: "insan"
            etiket: { tr: "\"İnsan. Uzun zamandır olmadığın kadar.\"", en: "\"Human. More than you've been in a long time.\"" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { vahit: { guven: 10 } }
            kronik: { tr: "Yükselenler'i dağıtıp peygamberlerine yeniden insan olmayı öğrettin.", en: "You disbanded the Ascended and taught their prophet how to be human again." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Boşalan {yer:tepe|den} in", en: "Walk down off the emptied hill" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - unvan: "ocak_kirici"
            kronik: { tr: "Sütunun söndüğü gece {yer:tepe|den} son kez indin; ardında yalnızca kül kaldı.", en: "The night you put out the Last Kiln, you walked down off the hill one last time. Only ash was left behind you." }
            sonraki: "@akis"

      - id: "yuk5_dagit_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Yere yığılıyorsun. Merdiven ayakta kalıyor; ilahi yeniden yükseliyor ve kalabalık üstünden geçerek sütuna yürümeye koyuluyor.", en: "You go down. The ladder stays standing. The hymn starts up again, and the crowd starts walking toward the pillar, right over you." }
          - { tr: "Doğrulabildiğinde yokuşun yarısı boşalmış. Sütun hâlâ aç, ama artık bir alıcısı yok; katkılar kimsenin adına yazılmadan boşluğa akıp gidiyor.", en: "By the time you can stand, half the slope is empty. The pillar is still hungry, but it has no recipient anymore; the contributions just pour into the void, written to no one." }
        secenekler:
          - id: "kalanlar"
            etiket: { tr: "Kalanları kolla, aşağı indir", en: "Grab the ones who are left. Get them down" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: -4 }
            kronik: { tr: "Sütunu durduramadın; geride kalan yarıyı kollayıp yokuştan indirdin.", en: "You couldn't stop the Last Kiln. You got the half you could save down off the hill." }
            sonraki: "@akis"
          - id: "sutun"
            etiket: { tr: "Kalk, sütunu kendi bedeninle kapat", en: "Get up. Block the pillar with your body" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
              - dikkat: 6
              - unvan: "ocak_kirici"
            kronik: { tr: "Kendi bedeninle Son Ocak'ın ağzını tıkadın; sütun seni yutamadı ve sonunda söndü.", en: "You plugged the Last Kiln's mouth with your own body. The pillar couldn't swallow you, and in the end it went out." }
            sonraki: "@akis"

  # ================================================================== VAHİT 1: SEÇİLMİŞLER
  - id: "vahit_secilmisler"
    perde: [2]
    gun: { min: 50, max: 165 }
    agirlik: 6
    etiketler: ["yukselenler", "npc", "vahit"]
    gerilim: 2
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Kırmızı ışığı yanan mikrofon", en: "A mic with its red light on" }
    sahne: "vsec_1"
    sahneler:
      - id: "vsec_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} seni rasathanenin alt katına, eskiden gece bekçisinin oturduğu odaya çaya çağırıyor. İçeride bir halka ışığı, çalışmayan bir dizüstü bilgisayar, bir de masa mikrofonu var. Duvardaki afiş solup gitmiş: \"EN İYİ HÂLİN · 312 BİN TAKİPÇİ\".", en: "Down on the observatory's ground floor, in the room where the night watchman used to sit, {npc:vahit} invites you in for tea. There's a ring light, a dead laptop, and a desk mic, and on the wall a faded poster: \"THE BEST-SELF HOUR · 312K SUBSCRIBERS\"." }
          - { tr: "İki bardağa çay koyarken konuşuyor: \"Eskiden insanlara ne kadar özel olduklarını anlatırdım. Ayda yirmi liraya. Şimdi bunu benim yerime Sistem söylüyor, ben de tercümanlık ediyorum.\"", en: "\"I used to tell people they were special,\" he says, pouring two glasses of tea. \"Twenty bucks a month. Now the System says it for me. I just translate.\"" }
          - { tr: "Bardağı önüne sürüp gözlerini gözlerine dikiyor. \"Ama sen... Sen bana kimsenin tercüme etmediği bir şey getirebilirsin. Söylesene, sana ne diyor?\"", en: "He slides the glass over and fixes his eyes on yours. \"But you... you could bring me something nobody's translated. Tell me. What does it say to you?\"" }
          - metin: { tr: "Artık bütün şehir senin pencereni konuşuyor: içinde bir hayalet varmış, kendi kendine konuşuyormuş. {npc:vahit} bunu duymuş; gözleri aç aç parlıyor.", en: "The whole city is talking about your window now: that there's a ghost in it, that it talks to itself. {npc:vahit} has heard, and his eyes are hungry." }
            kosul: { bayrak: "yanki_gorundu" }
          - metin: { tr: "\"Öğretici'de bana 'ses benimle konuşuyor' demiştin,\" diye hatırlatıyor usulca. \"O günden beri cümlenin devamını bekliyorum. Hani söz vermiştin.\"", en: "\"Back in the Tutorial you told me 'the voice talks to me,'\" he reminds you softly. \"I've been waiting ever since. For the rest of the sentence you promised.\"" }
            kosul: { bilgi: "vahit_ses_yalani" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Mikrofonun kırmızı ışığı yanıyor; oysa kablosu hiçbir yere takılı değil, pili de yok.", en: "The mic's red light is on. The cable isn't plugged into anything. There's no battery." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ ışığa bakma. ya da bak, bilmiyorum. hiçbir yere yayın yapmıyor ama bir şey dinliyor olabilir.", en: "d̷on't look at that light. or do. i don't know. it isn't broadcasting anything. but something could be listening." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Pilsiz mikrofon ha? Ya bir numara ya da benim aklımın almadığı bir şey. İkisinden de nefret ederim.\"", en: "\"A mic with no battery, huh. Either it's a trick or it's something I don't understand at all. I hate both.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çaya şeker atmış. Ellerine bak; dokuz gündür ağzına lokma koymamış.\"", en: "\"The tea's sweetened. Look at his hands. He hasn't eaten in nine days.\"" }
        secenekler:
          - id: "yanki"
            tur: "aciga_vur"
            etiket: { tr: "Ona {npc:yanki|i} anlat", en: "Tell him about {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - bayrak: "vahit_yakin_takip"
              - ahlak: { insanlik: 2, duzen: -2 }
              - iliski: { vahit: { saygi: 10, baglilik: 6 }, yanki: { guven: -8 } }
              - hafiza: { npc: "vahit", id: "sesi_dogruladi", agirlik: 30 }
            kronik: { tr: "Kafandaki bozuk sesi bir peygambere anlattın; sözün bittiğinde ağlıyordu.", en: "You told a prophet about the broken voice in your head. By the time you finished, he was crying." }
            sonraki: "vsec_yanki"
          - id: "yalan"
            etiket: { tr: "Duymak istediğini söyle: Sistem onu övüyor", en: "Tell him what he wants: the System praises him" }
            etkiler:
              - bayrak: "vahit_yakin_takip"
              - ahlak: { insanlik: -3, duzen: 1 }
              - yalan: { npc: "vahit", konu: "vahit_ikinci_ses_yalani" }
              - iliski: { vahit: { baglilik: 10, guven: 6 } }
            kronik: { tr: "Bir peygambere Sistem'in onu övdüğünü söyledin; dinledikçe omuzları dikleşti.", en: "You told a prophet the System praised him. His shoulders straightened as he listened." }
            sonraki: "vsec_yalan"
          - id: "sina"
            etiket: { tr: "\"Önce sen. Dün gece ne dedi?\"", en: "\"You first. What did it say last night?\"" }
            zar: { stat: "wis", zorluk: 30, tek: true, basarisiz: "vsec_sina_yok", basarisiz_etkiler: [{ ahlak: { insanlik: -1 } }, { iliski: { vahit: { baglilik: 3 } } }] }
            etkiler:
              - bayrak: "vahit_yakin_takip"
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { vahit: { korku: 4, saygi: 4 } }
            kronik: { tr: "Sorusunu peygambere geri çevirip önce onun ne duyduğunu sordun.", en: "You turned the prophet's question around and asked what he'd heard first." }
            sonraki: "vsec_sina"
          - id: "eski"
            etiket: { tr: "Eski hayatını sor", en: "Ask about his old life" }
            etkiler:
              - bayrak: "vahit_yakin_takip"
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bilgi: "vahit_eski_hayati"
              - iliski: { vahit: { guven: 6 } }
            kronik: { tr: "Peygambere, peygamber olmadan önceki hayatını sordun; anlattı.", en: "You asked a prophet who he was before he was a prophet. He told you." }
            sonraki: "vsec_eski"
          - id: "alay"
            etiket: { tr: "Halka ışığını yak: \"Yayındayız, abone olun!\"", en: "Flip on the ring light: \"We're live. Hit subscribe.\"" }
            etkiler:
              - bayrak: "vahit_yakin_takip"
              - ahlak: { insanlik: 1, duzen: -2 }
              - iliski: { vahit: { guven: -6, saygi: 2 } }
              - hafiza: { npc: "vahit", id: "vaazda_guldu", agirlik: -15 }
            kronik: { tr: "Bir peygamberin eski hayatını yüzüne vurup onunla alay ettin.", en: "You mocked a prophet with his old life, right to his face." }
            sonraki: "vsec_alay"
          - id: "katil"
            etiket: { tr: "\"Fikrimi değiştirdim. Beyazı ver.\"", en: "\"I changed my mind. Give me the white.\"" }
            goster: { bayrak: "yukselenler_reddedildi" }
            etkiler:
              - bayrak: "vahit_yakin_takip"
              - bayrak_kaldir: "yukselenler_reddedildi"
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { insanlik: -4, duzen: 2 }
              - itibar: { yukselenler: 6 }
              - iliski: { vahit: { baglilik: 8 } }
              - tohum: { olay: "yukselenler_2_yakit_listesi", gecikme: { min: 10, max: 20 }, kosul: { gorev: { zincir_yukselenler: "basla" } } }
            kronik: { tr: "Bir zamanlar geri çevirdiğin beyaz cübbeyi peygamberin odasında çay içerken kabul ettin.", en: "Over tea in the prophet's room, you accepted the white robe you'd once refused." }
            sonraki: "@akis"

      - id: "vsec_yanki"
        yer: "tepe"
        paragraflar:
          - { tr: "Her şeyi anlatıyorsun: bozuk satırı, çatlak sesi, küçük harflerle konuşan o şeyi. {npc:vahit} bir kez olsun sözünü kesmiyor; bitirdiğinde ağlıyor.", en: "You tell him: the glitched line, the cracked voice, the thing that talks in lowercase. {npc:vahit} doesn't interrupt once. When you finish, he's crying." }
          - { tr: "\"Bozuk mu?\" diye fısıldıyor. \"O zaman dünyadaki en dürüst şey o. Bozuk olan yalanı beceremez.\" Elini uzatıyor. \"Bırak konuşsun. Bir kez, benimle.\"", en: "\"Broken?\" he whispers. \"Then it's the most honest thing in the world. Broken things can't lie right.\" He reaches out a hand. \"Let it speak. Once. To me.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "h̷ayır. ona benden hiçbir şey verme. o beni dinlemez, satar. lütfen.", en: "n̷o. don't give him anything of mine. he won't listen to me. he'll sell me. please." }
        secenekler:
          - id: "ver"
            etiket: { tr: "{npc:yanki|in} bir satırını ona yüksek sesle oku", en: "Read him one of {npc:yanki|pos} lines out loud" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - bayrak: "vahit_yankiyi_biliyor"
              - iliski: { vahit: { baglilik: 8 }, yanki: { guven: -6 } }
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "{npc:yanki|in} sözlerinden birini {yer:tepe|in} peygamberine yüksek sesle okudun; artık o da biliyordu.", en: "You read one of {npc:yanki|pos} lines aloud to a prophet. Now he knew too." }
            sonraki: "@akis"
          - id: "koru"
            etiket: { tr: "\"Hayır. O benim, senin değil.\"", en: "\"No. It's mine. Not yours.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 6 }, vahit: { saygi: 4 } }
            kronik: { tr: "{npc:yanki|i} bir peygamberin açlığından sakındın; {npc:yanki} bunu unutmadı.", en: "You protected {npc:yanki} from a prophet's hunger. {npc:yanki} remembered." }
            sonraki: "@akis"
          - id: "tehdit"
            etiket: { tr: "\"Bunu birine söylersen seni susturur.\"", en: "\"Tell anyone and it shuts you up for good.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - iliski: { vahit: { korku: 8 } }
            kronik: { tr: "Sırrını öğrenen peygamberi {npc:yanki|in} adıyla tehdit ettin.", en: "You threatened the prophet who learned your secret, in {npc:yanki|pos} name." }
            sonraki: "@akis"

      - id: "vsec_yalan"
        yer: "tepe"
        paragraflar:
          - { tr: "\"Senden söz ediyor,\" diyorsun. \"Sabrını takdir ediyor. Ne kadar beklediğinin farkında.\" Her sözcükte {npc:vahit|in} omuzları biraz daha dikleşiyor.", en: "\"It mentions you,\" you say. \"It thinks you're patient. It sees how long you've waited.\" With every word, {npc:vahit|pos} shoulders straighten a little more." }
          - { tr: "\"Biliyordum,\" diyor. Sonra duraksayıp kırmızı ışığı yanan mikrofona bakıyor. \"Biliyordum. Ama birinin bunu söylemesi gerekiyordu.\"", en: "\"I knew it,\" he says. Then he pauses and looks at the mic with its red light on. \"I knew it. But somebody had to say it.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yalana bir satır daha ekle", en: "Add one more line to the lie" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { baglilik: 4 } }
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Peygambere Sistem adına bir yalan söyledin, ardından bir tane daha ekledin.", en: "You told the prophet one lie in the System's name, then added another." }
            sonraki: "@akis"
          - id: "dur"
            etiket: { tr: "Sus artık; bu kadarı yeter", en: "Stop. You've said enough" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { vahit: { guven: 2 } }
            kronik: { tr: "Peygambere bir yalan söyledin, ötesine geçmedin.", en: "You told the prophet one lie and stopped there." }
            sonraki: "@akis"

      - id: "vsec_sina"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} bardağını masaya bırakıyor. \"Dün gece bir kapıdan söz etti,\" diyor. \"Yukarı açılan tek kapıdan. Onu senin açacağını söyledi.\"", en: "{npc:vahit} sets his tea down. \"Last night,\" he says, \"it talked about a door. The only door that opens upward. And it said you'd be the one to open it.\"" }
          - { tr: "Bunu gözünü bile kırpmadan söylüyor; ne bir seğirme var ne bir duraksama. Karşındaki ya yıllarını kamera karşısında geçirmiş bir adam ya da gerçekten bir şey duymuş biri.", en: "He says it without blinking. No tic, no pause. Either he's a man who spent years in front of a camera, or he really did hear something." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷apı. ben de bir kapı biliyorum. ona söylemedim, kimseye söylemedim.", en: "a̷ door. i know about a door too. i never told him. i never told anyone." }
        secenekler:
          - id: "not"
            etiket: { tr: "Söylediğini aklının bir köşesine yaz", en: "File what he said away somewhere" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "yukari_kapi"
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Bir peygamberin yukarı açılan kapıya dair sözlerini aklının bir köşesine yazdın.", en: "You filed away what a prophet told you about a door that opens upward." }
            sonraki: "@akis"
          - id: "gul"
            etiket: { tr: "\"İyi deneme.\"", en: "\"Nice try.\"" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { vahit: { saygi: 3, guven: -2 } }
            kronik: { tr: "Bir peygamberin kehanetine güldün; kehanet sana gülmedi.", en: "You laughed at a prophet's prophecy. The prophecy didn't laugh back." }
            sonraki: "@akis"

      - id: "vsec_sina_yok"
        yer: "tepe"
        paragraflar:
          - { tr: "Soruyu soruyorsun ama {npc:vahit} yalnızca gülümsüyor; sessizlik odaya yayılıyor. Bir an, sanki cevabı senin vermen gerekiyormuş gibi geliyor sana.", en: "You ask, but {npc:vahit} just smiles, and the silence fills the room. For a second it feels like you're the one who's supposed to answer." }
          - { tr: "Kendine geldiğinde çoktan konuşmaya başlamışsın: kırılma gecesini, kaburgalarının altındaki o şeyi anlatıyorsun. Ne zaman başladığını hatırlamıyorsun bile. O ise bir şey duymuş gibi başını sallıyor.", en: "When you pull yourself together, you've been talking: about the night of the break, about the thing under your ribs. You don't remember starting. He nods, like he heard something." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk, odadan çık", en: "Get up and leave the room" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gizle: 2
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Bir peygamberin sessizliğinde içini dökerken kendini yakaladın ve kaçtın.", en: "You caught yourself confessing into a prophet's silence, and you ran." }
            sonraki: "@akis"
          - id: "otur"
            etiket: { tr: "Otur, anlatmaya devam et", en: "Stay. Keep going" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { vahit: { baglilik: 4 } }
            kronik: { tr: "İtiraflarını bir peygamberin sessizliğine döktün; kalktığında hafiflemiştin.", en: "You poured your confessions into a prophet's silence, and you felt lighter when you got up." }
            sonraki: "@akis"

      - id: "vsec_eski"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} uzun uzun bardağına bakıyor. \"Son bölümü Entegrasyon sabahı kaydettim,\" diyor. \"Adı 'Bugün Her Şey Değişebilir'di. Şaka değil. O sabah kırk iki kişi izledi.\"", en: "{npc:vahit} stares into his glass for a long time. \"I recorded the last episode the morning of Integration,\" he says. \"It was called 'Today Everything Could Change.' For real. Forty-two people watched it that morning.\"" }
          - { tr: "\"Sonra gök açıldı. Herkesin penceresi aynıydı, bir benimki farklıydı. Benimkinde tek bir satır belirdi, ancak bir saniye kaldı: 'Seni duyuyorum.' Sonra silindi ve bir daha hiç gelmedi.\"", en: "\"Then the sky opened. Everybody's window was the same except mine. Mine had one line on it, for just one second: 'I hear you.' Then it was gone, and it never came back.\"" }
          - { tr: "\"O günden beri hattı açık tutuyorum,\" diyerek pilsiz mikrofonun kırmızı ışığını gösteriyor. \"Ya bir gün yeniden konuşursa?\"", en: "\"I've been keeping the line open ever since,\" he says, and points at the dead mic's red light. \"What if it talks again someday?\"" }
        sezgiler:
          - kosul: { stat: { wis: 45 } }
            metin: { tr: "Bu hikâyeyi daha önce kimseye anlatmamış. Ya da bin kez anlatmış, bu da en iyi provası.", en: "He's never told anyone this before. Or he's told it a thousand times, and this is his best rehearsal." }
        secenekler:
          - id: "inan"
            etiket: { tr: "\"Sana inanıyorum.\"", en: "\"I believe you.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - iliski: { vahit: { guven: 8, baglilik: 4 } }
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Bir peygambere tek bir satırlık mucizesine inandığını söyledin.", en: "You told a prophet you believed in his one-line miracle." }
            sonraki: "@akis"
          - id: "belki"
            etiket: { tr: "\"Belki o satırı sen yazdın.\"", en: "\"Maybe you wrote that line yourself.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { vahit: { guven: -4, saygi: 6 } }
              - npc_iz: { vahit: "yarali_guven" }
            kronik: { tr: "Tek mucizesini kendi uydurmuş olabileceğini peygamberin yüzüne söyledin; bunu hiç unutmadı.", en: "You told a prophet he might have made up his only miracle. He never forgot it." }
            sonraki: "@akis"
          - id: "isigi"
            etiket: { tr: "Mikrofonun kırmızı ışığını söndür", en: "Switch off the mic's red light" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: 2 }
              - iliski: { vahit: { korku: 6, guven: -6 } }
            kronik: { tr: "Bir peygamberin Entegrasyon'dan beri açık tuttuğu hattı kendi elinle kapattın.", en: "You switched off the line a prophet had kept open since Integration." }
            sonraki: "@akis"

      - id: "vsec_alay"
        yer: "tepe"
        paragraflar:
          - { tr: "Halka ışığı yanınca {npc:vahit|in} yüzü bir an bembeyaz kesiliyor. Eski bir alışkanlıkla gülümsüyor: kameraya, artık orada olmayan kırk iki izleyiciye.", en: "The ring light comes on and {npc:vahit|pos} face goes white in it for a second. On some old reflex, he smiles: at the camera, at forty-two viewers who aren't there." }
          - { tr: "Derken gülümsemesi yüzünden siliniyor. \"Gül,\" diyor alçak sesle. \"Herkes güldü. Gök açılana kadar.\"", en: "Then the smile drops. \"Laugh,\" he says quietly. \"Everybody laughed. Right up until the sky opened.\"" }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Işığı söndür, özür dile", en: "Kill the light. Apologize" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - iliski: { vahit: { guven: 4 } }
            kronik: { tr: "Bir peygamberle alay ettin, sonra özür diledin.", en: "You mocked a prophet, and then you apologized." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Işığı açık bırakıp çık", en: "Leave the light on. Walk out" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: -1 }
              - iliski: { vahit: { guven: -4 } }
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 15, max: 30 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Bir peygamberi halka ışığının altında yalnız bıraktın.", en: "You left a prophet alone under his ring light." }
            sonraki: "@akis"

  # ================================================================== VAHİT 2: MUCİZE SINAVI
  - id: "vahit_mucize_sinavi"
    perde: [2, 3]
    gun: { min: 110, max: 235 }
    kosul: { bayrak: "vahit_yakin_takip" }
    agirlik: 6
    etiketler: ["yukselenler", "npc", "vahit", "kapi", "savas"]
    gerilim: 3
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Şafakta kapanacak kapı", en: "The Gate that closes at dawn" }
    sahne: "vmuc_1"
    sahneler:
      - id: "vmuc_1"
        paragraflar:
          - { tr: "{yer:tepe|in} eteğindeki eski ilkokulun bahçesinde bir Kapı açılmış. Zarı mor, kenarları çatlamış; taşmasına bir gece var. Bunu bütün şehir biliyor, çünkü {npc:vahit} bütün şehre ilan etti.", en: "A Gate has opened in the yard of the old grade school at the foot of {yer:tepe}. Its membrane is purple, its edges cracked. It's one night from breaking. The whole city knows, because {npc:vahit} told the whole city." }
          - { tr: "\"Şafakta,\" demiş on bin kişiye, \"Sistem bu kapıyı kendi eliyle kapatacak. Kimse dokunmasın; dokunan, imansızlığını göstermiş olur.\" Şimdi okulun dört bir yanı mum dolu ve kimse kapıya el sürmüyor.", en: "\"At dawn,\" he told ten thousand people, \"the System will close this Gate with its own hand. Nobody touch it. Whoever touches it shows their lack of faith.\" Now the schoolyard's ringed with candles and nobody is touching the Gate." }
          - { tr: "Gece yarısı kapın çalınıyor; gelen {npc:vahit}. Yapayalnız, beyaz cübbesinin içinde tir tir titreyerek konuşuyor: \"Kapanmazsa beni paramparça ederler. Sahtekârsam etsinler. Ama değilsem... Sistem'in eline yardım et.\"", en: "At midnight somebody knocks. It's {npc:vahit}, alone, shaking under his white robe. \"If it doesn't close,\" he says, \"they'll tear me apart. If I'm a fraud, let them. But if I'm not... help the System's hand.\"" }
          - metin: { tr: "Okulun avlusunda, mum ışığının içinde {yer:kordon|den} kaçan ailelerin çadırları duruyor. Kapı taşarsa ilk onlar gider.", en: "In the schoolyard, in the candlelight, there are tents belonging to families who fled {yer:kordon}. If the Gate breaks, they go first." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Kapı: D kademesi. Taşma: 6 saat 40 dakika. Şafak: 6 saat 12 dakika. Kendiliğinden kapanma olasılığı: hesaplanamadı. Sıfır değil, ama neredeyse.", en: "Gate: Grade D. Break in 6 hrs 40 min. Dawn in 6 hrs 12 min. Odds it closes on its own: could not be calculated. Not zero. Almost." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷istem kapı kapatmaz, kapıları insanlar kapatır. bu adam ya bunu bilmiyor ya da çok iyi biliyor.", en: "t̷he system doesn't close gates. people close gates. but this guy either doesn't know that, or he knows it really, really well." }
        secenekler:
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Kapıyı bu gece gizlice kapat; mucize onun olsun", en: "Close it tonight, quietly. Give him his miracle" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -2, insanlik: -2, merhamet: 3 }
              - iliski: { vahit: { guven: 8 } }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+10", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_gizli_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Peygamberin kehanetini gece yarısı gizlice kendin gerçekleştirmeye gittin.", en: "At midnight you went to make a prophet's prophecy come true yourself, quietly." }
          - id: "acik"
            tur: "aciga_vur"
            etiket: { tr: "Kapıyı şafakta, herkesin önünde kapat", en: "Close it at dawn, in front of everyone" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { vahit: { korku: 6, guven: -4 } }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+10", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_acik_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Peygamberin mucizesini şafakta, on bin kişinin önünde elinden almaya yürüdün.", en: "At dawn, in front of ten thousand people, you walked out to take the prophet's miracle from him." }
          - id: "bekle"
            etiket: { tr: "Hiçbir şey yapma; kehanet sınansın", en: "Do nothing. Let the prophecy be tested" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -4 }
              - iliski: { vahit: { guven: -6 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 3, max: 8 } }
            kronik: { tr: "Kehanet sınansın diye kenarda durdun; bedelini okulun avlusundakiler ödedi.", en: "You stood back and let a prophecy be tested. The people in the schoolyard paid for it." }
            sonraki: "vmuc_bekle"
          - id: "ifsa"
            etiket: { tr: "Şafaktan önce kalabalığa gerçeği söyle", en: "Tell the crowd the truth before dawn" }
            gerekli: { bilgi: "vahit_isik_hilesi" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - itibar: { yukselenler: -8 }
              - iliski: { vahit: { guven: -10, korku: 6 } }
              - bayrak: "vahit_itibar_sarsildi"
            kronik: { tr: "Şafaktan önce, mum ışığında, peygamberin göğün titreşimini nasıl okuduğunu herkese anlattın.", en: "Before dawn, by candlelight, you told everyone how the prophet read the shimmer in the sky." }
            sonraki: "vmuc_ifsa"
          - id: "pazarlik"
            etiket: { tr: "\"Mucizenin bedeli ne?\"", en: "\"What's a miracle worth to you?\"" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 1 }
              - iliski: { vahit: { saygi: 4, korku: 2 } }
            kronik: { tr: "Bir peygamberle mucizesinin fiyatı üzerine pazarlığa oturdun.", en: "You haggled with a prophet over the price of his miracle." }
            sonraki: "vmuc_pazarlik"

      - id: "vmuc_pazarlik"
        paragraflar:
          - { tr: "{npc:vahit} bir an şaşırıyor, ardından yüzüne eski bir satıcının gülümsemesi yayılıyor. \"Ne istersen,\" diyor. \"İç halkada bir yer. Defterin anahtarı. Ya da...\" Sesini alçaltıyor. \"Sürü. Benim sürüm. Senin sesinle konuşmaya hazır.\"", en: "{npc:vahit} looks surprised for a second, then smiles: an old salesman's smile. \"Whatever you want,\" he says. \"A seat in the inner circle. The key to the ledger. Or...\" He drops his voice. \"The flock. My flock. Ready to talk in your voice.\"" }
        secenekler:
          - id: "suru"
            etiket: { tr: "Sürüyü iste", en: "Ask for the flock" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { yukselenler: 8 }
              - bayrak: "vahit_borclu"
              - iliski: { vahit: { baglilik: 6, korku: 4 } }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+10", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_gizli_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Bir mucize sözü karşılığında bir peygamberin sürüsünü pazarlıkla aldın.", en: "You traded a prophet the promise of a miracle for his flock." }
          - id: "hicbir"
            etiket: { tr: "\"Hiçbir şey. Yalnızca merak ettim.\"", en: "\"Nothing. I just wanted to know.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { vahit: { guven: 4 } }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+10", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_gizli_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Bir peygambere fiyatını sordun, sonra hiçbir şey istemeden Kapı'ya yürüdün.", en: "You asked a prophet his price, then walked to the Gate asking nothing in return." }

      - id: "vmuc_gizli_zafer"
        paragraflar:
          - { tr: "Kemik taçlı şey okul bahçesinin kumuna serilmiş yatıyor. Kapının zarını içeriden, çekirdeğini söküp kapatıyorsun; mumların alevi kıpırdamıyor bile. Gören olmuyor.", en: "The bone-crowned thing lies in the schoolyard sand. You close the Gate's membrane from the inside by ripping out its core, and the candlelight doesn't even flicker. Nobody sees." }
          - { tr: "Şafakta on bin kişi Kapı'nın durduğu yere bakıyor; orada hiçbir şey yok. Önce bir sessizlik çöküyor, ardından bir uğultu, en sonunda bir ilahi başlıyor. {npc:vahit} ellerini göğe kaldırmış; gözleri kalabalığın içinde seni bulunca bir an, yalnızca bir an, korkuyla bakıyor.", en: "At dawn ten thousand people look at the spot where the Gate was and see nothing. First silence, then a murmur, then a hymn. {npc:vahit} raises his hands to the sky. His eyes find you in the crowd and, for one moment, just one, he looks scared." }
        secenekler:
          - id: "gulumse"
            etiket: { tr: "Ona gülümse, kalabalığa karış", en: "Smile at him. Melt into the crowd" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - itibar: { yukselenler: 6 }
              - bayrak: "vahit_mucizesi_verildi"
              - iliski: { vahit: { baglilik: 15, korku: 4 } }
              - hafiza: { npc: "vahit", id: "olay:vahit_mucize_sinavi", agirlik: 45 }
            kronik: { tr: "Bir peygambere mucizesini verip sürüsünün arasında kayboldun; o günden sonra sana borçluydu.", en: "You gave a prophet his miracle and disappeared into his flock. From then on he owed you." }
            sonraki: "@akis"
          - id: "fisilda"
            etiket: { tr: "Kulağına eğil: \"Bir dahakine kendin kapat.\"", en: "Lean in: \"Next time, close it yourself.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "vahit_mucizesi_verildi"
              - iliski: { vahit: { korku: 8, baglilik: 8 } }
            kronik: { tr: "Mucizesini verdiğin peygamberin kulağına bunun sonuncusu olduğunu fısıldadın.", en: "You gave the prophet his miracle and whispered in his ear that it was the last one." }
            sonraki: "@akis"

      - id: "vmuc_acik_zafer"
        paragraflar:
          - { tr: "Şafak sökerken on bin kişinin gözü önünde Kapı'ya yürüyorsun. Kemik taçlı şey dışarı çıkınca mumlar sönüyor. İş bittiğinde Kapı ortada yok, çekirdeği avucunda; on bin yüz sana çevrilmiş.", en: "As dawn breaks you walk up to the Gate in front of ten thousand people. When the bone-crowned thing comes out, the candles go out. When it's over, the Gate is gone, its core is in your hand, and ten thousand faces are turned toward you." }
          - { tr: "{npc:vahit} kalabalığın önünde tek başına duruyor. Derken dizlerinin üstüne çöküyor. \"Sistem'in eli,\" diyor titreyerek. \"Size söylemiştim. Elini... size söylemiştim.\"", en: "{npc:vahit} stands in front of the crowd, alone. Then he drops to his knees. \"The System's hand,\" he says, trembling. \"I told you. Its hand... I told you all.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı kapatıldı · Tanık: 10.214]", en: "[Gate closed · Witnesses: 10,214]" }
            satirlar:
              - { tr: "Efsanen büyüyor. Dikkat de.", en: "Your legend is growing. So is the Attention." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Onu ayağa kaldır; mucizeyi ona ver", en: "Pull him up. Give him the miracle" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -1 }
              - itibar: { yukselenler: 8 }
              - bayrak: "vahit_mucizesi_verildi"
              - iliski: { vahit: { baglilik: 12, guven: 6 } }
            kronik: { tr: "Herkesin önünde bir Kapı kapattın ve mucizeyi diz çökmüş peygambere geri verdin.", en: "You closed a Gate in front of everyone and handed the miracle back to the prophet on his knees." }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Bırak diz çöksün; mucize senin", en: "Let him kneel. The miracle is yours" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - itibar: { yukselenler: 12 }
              - bayrak: "mucize_calindi"
              - iliski: { vahit: { korku: 8, saygi: 6, guven: -6 } }
              - npc_iz: { vahit: "korku_izi" }
            kronik: { tr: "On bin kişinin önünde bir peygamberin mucizesini çaldın; o sabah sürüsü sana döndü.", en: "You stole a prophet's miracle in front of ten thousand people. That morning his flock turned to you." }
            sonraki: "@akis"

      - id: "vmuc_bekle"
        paragraflar:
          - { tr: "Şafak sökse de Kapı kapanmıyor. Mumlar yanıp dururken on bin kişi aynı zarın titreyişini izliyor; derken zar çatlıyor.", en: "Dawn comes. The Gate doesn't close. The candles keep burning, and ten thousand people watch the same membrane shiver. Then it cracks." }
          - { tr: "İlk çığlık okul bahçesinden kopuyor. {npc:vahit} kollarını açıp \"Sistem sizi sınıyor!\" diye haykırıyor ama kalabalığın gözü artık onda değil, Kapı'da. Birkaç kişi ellerinde taşlarla ona doğru yürümeye başlıyor.", en: "The first scream comes from the schoolyard. {npc:vahit} throws his arms wide and shouts, \"The System is testing you!\" But the crowd isn't looking at him anymore, it's looking at the Gate, and some people start walking toward him with rocks in their hands." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Önce Kapı; çocuklar önce", en: "The Gate first. The kids first" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "vahit_itibar_sarsildi"
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+15", "sis_tazisi@dunya", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_gec_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Kehanetin çöktüğü sabah Kapı'ya koştun ve peygamberi kalabalığın insafına bıraktın.", en: "The morning the prophecy collapsed, you ran for the Gate and left the prophet to the crowd." }
          - id: "vahit"
            etiket: { tr: "Önce peygamber; kalabalığı ondan uzak tut", en: "The prophet first. Keep the crowd off him" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - degisken: { hayatta_kalan: -5 }
              - bayrak: "vahit_itibar_sarsildi"
              - iliski: { vahit: { baglilik: 15, guven: 10 } }
              - npc_iz: { vahit: "can_borcu" }
            kronik: { tr: "Kapı taşarken peygamberi taşların altından çektin; okul bahçesinde beş aile öldü.", en: "While the Gate broke, you saved the prophet from the stones. Five families died in the schoolyard." }
            sonraki: "vmuc_gec_kapi"

      - id: "vmuc_gec_kapi"
        paragraflar:
          - { tr: "{npc:vahit|i} kalabalığın arasından çekip çıkarıyor, bir kapı aralığına itiyorsun. Arkanda okul bahçesi çığlık çığlığa; zardan çıkan şey mumları devirmiş.", en: "You yank {npc:vahit} out of the crowd and shove him into a doorway. Behind you the schoolyard is full of screaming; whatever came out of the membrane knocked the candles over." }
        secenekler:
          - id: "simdi"
            etiket: { tr: "Şimdi Kapı'ya dön", en: "Now turn to the Gate" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+15", "sis_tazisi@dunya", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_gec_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Peygamberi kurtardıktan sonra taşan Kapı'ya döndün.", en: "After saving the prophet, you turned back to the breaking Gate." }

      - id: "vmuc_gec_zafer"
        paragraflar:
          - { tr: "Kapı kapanıyor ama geç kalmış. Okul bahçesinde devrilmiş mumlar, yırtık çadırlar, kumun üstünde de çarşafla örtülü biçimler var.", en: "The Gate closes, but late. In the schoolyard there are tipped-over candles, torn tents, and shapes in the sand covered with sheets." }
          - { tr: "{npc:vahit} çarşafların arasında dolaşıp her birinin başında duruyor. Sonunda bomboş bir sesle, \"Sistem bu sabah konuşmadı,\" diyor. Kimseden ses yok.", en: "{npc:vahit} walks between the sheets, stopping at each one. \"The System,\" he finally says, his voice empty, \"didn't speak this morning.\" Nobody answers." }
        secenekler:
          - id: "teselli"
            etiket: { tr: "Onu çarşafların arasından al", en: "Lead him away from the sheets" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - iliski: { vahit: { guven: 6 } }
            kronik: { tr: "Ölülerinin arasında dolaşan peygamberi kolundan tutup oradan çıkardın.", en: "You took the prophet whose prophecy failed by the arm and led him out from among his dead." }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "\"Hepsine bak. Tek tek.\"", en: "\"Look at every one of them. One at a time.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { vahit: { korku: 6 } }
              - npc_iz: { vahit: "yara_izi" }
            kronik: { tr: "Kehaneti çöken peygambere ölülerinin yüzüne tek tek baktırdın.", en: "You made the prophet whose prophecy failed look at the faces of his dead, one by one." }
            sonraki: "@akis"

      - id: "vmuc_ifsa"
        paragraflar:
          - { tr: "Mumların arasında yürüyerek anlatıyorsun: göğün titreşimini, iki saniyelik gecikmeyi, Sistem'in hiçbir kapıyı kendi eliyle kapatmadığını. Kalabalığın yarısı sana bakıyor, öbür yarısı kapıya.", en: "You walk between the candles and talk: about the shimmer in the sky, the two-second delay, how the System has never once closed a Gate with its own hand. Half the crowd looks at you. The other half looks at the Gate." }
          - { tr: "{npc:vahit} itiraz etmiyor. Mumlardan birini alıp bir mezara bırakır gibi kapının dibine koyuyor ve geri çekiliyor.", en: "{npc:vahit} doesn't argue. He just picks up one of the candles, sets it down at the foot of the Gate, and steps back, like it's a grave." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Şimdi Kapı'yı kapat", en: "Now close the Gate" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - savas: { dusmanlar: ["kemik_tacli_geyik@dunya+10", "sis_tazisi@dunya"], ortam: ["karanlik"], kazan: "vmuc_acik_zafer", kaybet: "vmuc_yenilgi" }
            kronik: { tr: "Peygamberin hilesini herkese anlattın, sonra Kapı'yı kendin kapatmaya yürüdün.", en: "You explained the prophet's trick, then went to close the Gate yourself." }

      - id: "vmuc_yenilgi"
        paragraflar:
          - { tr: "Kapıdan çıkan şey seni okulun duvarına çarpıyor. Doğrulabildiğinde Lonca'nın turuncu bantlı avcıları kapıyı çoktan bastırmış; mum ışığında kum kana bulanmış.", en: "The thing out of the Gate slams you into the school wall. By the time you can stand, Iron Guild hunters in orange armbands have already pushed it back. Bloody sand in the candlelight." }
          - { tr: "{npc:vahit} kalabalığın önünde, sesi elinden alınmış bir adam gibi dikiliyor. Bu sabah ne onun için bir mucize oldu ne de senin için.", en: "{npc:vahit} stands in front of the crowd like a man who's lost his voice. There was no miracle this morning. Not for him, not for you." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk, yaralılarla ilgilen", en: "Get up. See to the wounded" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "vahit_itibar_sarsildi"
              - iliski: { vahit: { guven: 2 } }
            kronik: { tr: "Mucize sabahı Kapı'ya yenildin ve gün boyu yaralıları taşıdın.", en: "On the morning of the miracle you lost to the Gate, and spent the rest of the day carrying the wounded." }
            sonraki: "@akis"
          - id: "vahite"
            etiket: { tr: "Peygambere bak: \"Bu da mı sınavdı?\"", en: "Look at the prophet: \"Was this a test too?\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - bayrak: "vahit_itibar_sarsildi"
              - iliski: { vahit: { korku: 4, guven: -4 } }
            kronik: { tr: "Kanlı kumun üstünde peygambere bunun da bir sınav olup olmadığını sordun; cevap vermedi.", en: "Standing on the bloody sand you asked the prophet if this was a test too. He didn't answer." }
            sonraki: "@akis"

  # ================================================================== VAHİT 3: MASKE DÜŞER
  # Gerçek dünya durumundan gelir: gercek_hasat → vahit_hakli (hasadın ön seçim kanalı ona gerçekten konuşur);
  # aksi hâlde vahit_sahtekar. Her yol tam olarak birini koyar.
  - id: "vahit_maske_duser"
    perde: [3]
    ana_yay: { gun: 245 }
    kosul: { bayrak: "vahit_yakin_takip" }
    agirlik: 1
    etiketler: ["yukselenler", "npc", "vahit", "sir"]
    gerilim: 4
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Kubbedeki kilitli oda", en: "The locked room in the dome" }
    sahne: "vmask_1"
    sahneler:
      - id: "vmask_1"
        paragraflar:
          - metin: { tr: "Gece yarısı kapında On Üç beliriyor, elinde sönmüş bir fener. \"Dokuz gündür ağzına bir lokma koymadı,\" diyor. \"Kubbenin tepesindeki odaya kapandı. Sesin bu gece geleceğini söylüyor. Seni istiyor.\"", en: "Thirteen is at your door at midnight, holding a lantern that's gone out. \"He hasn't eaten in nine days,\" he says. \"He locked himself in the room at the top of the dome. He says the voice is coming tonight. He wants you there.\"" }
            kosul: { bayrak_yok: ["on_ucuncu_kacti", "on_ucuncu_yandi"] }
          - metin: { tr: "Gece yarısı kapında beyazlar giymiş, yüzünü tanımadığın bir mürit var. \"Dokuz gündür ağzına bir lokma koymadı,\" diyor. \"Kubbenin tepesindeki odaya kapandı. Sesin bu gece geleceğini söylüyor. Seni istiyor.\"", en: "There's a disciple in white at your door at midnight, a face you don't know. \"He hasn't eaten in nine days,\" she says. \"He locked himself in the room at the top of the dome. He says the voice is coming tonight. He wants you there.\"" }
            kosul: { bayrak: ["on_ucuncu_kacti"] }
          - metin: { tr: "Gece yarısı kapında beyazlar giymiş, yüzünü tanımadığın bir mürit var; elinde bir zamanlar On Üç'ün taşıdığı fener. \"Dokuz gündür ağzına bir lokma koymadı,\" diyor. \"Kubbenin tepesindeki odaya kapandı. Seni istiyor.\"", en: "There's a disciple in white at your door at midnight, a face you don't know, carrying the lantern Thirteen used to carry. \"He hasn't eaten in nine days,\" she says. \"He locked himself in the room at the top of the dome. He wants you there.\"" }
            kosul: { bayrak: "on_ucuncu_yandi" }
          - { tr: "Rasathanenin en tepesinde, döner merdivenin bittiği yerde kimsenin girmediği bir kapı var. {yer:tepe|de} herkes adını bilir: Dinleme Odası.", en: "At the very top of the observatory, where the spiral stair ends, there's a door nobody goes through. Everyone on the hill knows its name: the Listening Room." }
          - metin: { tr: "Şehir artık Sistem'in ne olduğunu biliyor ya da bildiğini sanıyor: bir hasat aracı. {npc:vahit} bunu ilk duyduğunda gülmüş, gözünden yaşlar akarak.", en: "The city knows what the System is now, or thinks it does: a harvesting tool. When {npc:vahit} first heard, he laughed. Crying." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Şehir artık Sistem'in ne olduğunu biliyor ya da bildiğini sanıyor: soyu tükenmiş bir ırkın yazdığı bir kurtarma protokolü. {npc:vahit} bunu ilk duyduğu gün, bugün dokuzuncu gününe giren orucuna başlamış.", en: "The city knows what the System is now, or thinks it does: a rescue protocol written by a dead race. When {npc:vahit} first heard, he started the fast that's now nine days long." }
            kosul: { bayrak: "gercek_kurtarma" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Kubbenin tepesinden göğe ince bir sinyal yükseliyor: {npc:mert_kilic|in} aylardır duyduğu o kısa, düzenli sayım.", en: "A thin signal is coming off the top of the dome, going up into the sky: the short, regular count the radio crew has been picking up for months." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ odaya gitme. ya da git. bilmek istiyorum, bilmek istemiyorum, ikisi birden. bu bende yeni.", en: "d̷on't go in that room. or go. i want to know. i don't want to know. both at once. that's new for me." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Kubbeye çık; kapıyı çal", en: "Climb the dome. Knock" }
            etkiler:
              - bolge: "tepe"
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { vahit: { guven: 4 } }
            kronik: { tr: "Peygamberin Dinleme Odası'nın kapısını çaldın; içeri buyur edildin.", en: "You knocked on the door of the prophet's Listening Room and were invited in." }
            sonraki: "vmask_oda"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Kapıyı menteşesinden sök", en: "Rip the door off its hinges" }
            gerekli: { stat: { str: 120 } }
            etkiler:
              - bolge: "tepe"
              - dikkat: 3
              - ahlak: { duzen: -2, merhamet: -1 }
              - iliski: { vahit: { korku: 8 } }
            kronik: { tr: "Kapıyı menteşelerinden söküp Dinleme Odası'na daldın; içerideki sırra hazırlanacak vakit bırakmadın.", en: "You tore the door of the prophet's Listening Room off its hinges. The secret inside had no time to get ready for you." }
            sonraki: "vmask_oda"
          - id: "on_uc"
            etiket: { tr: "Müride söyle: \"Kapıyı sen aç. Ben arkandayım.\"", en: "Tell the disciple: \"You open it. I'm right behind you.\"" }
            etkiler:
              - bolge: "tepe"
              - ahlak: { duzen: 1, insanlik: 1 }
              - tohum: { olay: "on_ucuncu_secim", gecikme: { min: 3, max: 8 }, kosul: { bayrak_yok: ["on_ucuncu_kacti", "on_ucuncu_yandi"] } }
            kronik: { tr: "Dinleme Odası'nın kapısını bir mürite açtırdın; içeri ilk o baktı.", en: "You had a disciple open the door to the Listening Room. They were the first to look inside." }
            sonraki: "vmask_oda"

      - id: "vmask_oda"
        yer: "tepe"
        paragraflar:
          - metin: { tr: "Oda bomboş sayılır: bir şilte, bir su şişesi, duvarda tırnakla kazınmış çentikler. {npc:vahit} ortada bağdaş kurmuş, havada asılı bir pencereye bakıyor. Bu pencereyi hayatında ilk kez görüyorsun ama yazı tipini tanıyorsun.", en: "The room is almost empty: a mattress, a water bottle, notches scratched into the wall with fingernails. {npc:vahit} sits cross-legged in the middle, staring at a window hanging in the air. You've never seen this window before in your life. But you know the font." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Oda düpedüz bir stüdyo. Sessiz Ağ'dan çalınmış üç tarayıcı göğe çevrilmiş; duvarlar müritlerin her biri için el yazısıyla tutulmuş notlarla dolu: korkuları, ölüleri, zaafları. Masada ucuz bir yazıcı, yanında da Sistem'in yazı tipiyle basılmış sararmış bir kâğıt: \"Seni duyuyorum.\"", en: "The room is a studio. Three scanners stolen from the Quiet Network point at the sky, and the walls are covered in handwritten notes about every single disciple: their fears, their dead, their weak spots. On the desk is a cheap printer and a yellowed page printed in the System's font: \"I hear you.\"" }
            kosul: { bayrak_yok: "gercek_hasat" }
          - { tr: "{npc:vahit} sana dönüyor. Dokuz günlük açlık yüzünü kafatasına çevirmiş ama gözleri hâlâ o bildiğin gözler. \"Geldin,\" diyor. \"Artık saklayacak bir şeyim kalmadı.\"", en: "{npc:vahit} turns to you. Nine days of hunger have turned his face into a skull, but his eyes are still the same eyes. \"You came,\" he says. \"There's nothing left to hide.\"" }
        secenekler:
          - id: "bak_hakli"
            etiket: { tr: "Havadaki pencereye bak", en: "Look at the window in the air" }
            goster: { bayrak: "gercek_hasat" }
            etkiler:
              - bayrak: "vahit_hakli"
              - bayrak: "vahit_maskesi_dustu"
              - bilgi: "secici_kanali"
              - unvan: "kehanetin_tanigi"
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Dinleme Odası'nda Sistem'in peygambere gerçekten konuştuğunu kendi gözlerinle gördün.", en: "In the prophet's Listening Room you saw that the System really had been talking to him." }
            sonraki: "vmask_hakli"
          - id: "bak_sahte"
            etiket: { tr: "Duvardaki notları oku", en: "Read the notes on the walls" }
            goster: { bayrak_yok: "gercek_hasat" }
            etkiler:
              - bayrak: "vahit_sahtekar"
              - bayrak: "vahit_maskesi_dustu"
              - bilgi: "vahit_alicilari"
              - unvan: "kehanetin_tanigi"
              - ahlak: { insanlik: 2, duzen: 1 }
            kronik: { tr: "Sesin aylardır bir yazıcıdan çıktığını peygamberin Dinleme Odası'nda gördün.", en: "In the prophet's Listening Room you saw that the voice had been coming out of a printer for months." }
            sonraki: "vmask_sahte"
          - id: "kac_hakli"
            etiket: { tr: "Bakma; kapıyı kapatıp aşağı in", en: "Don't look. Close the door and go down" }
            goster: { bayrak: "gercek_hasat" }
            etkiler:
              - bayrak: "vahit_hakli"
              - bayrak: "vahit_maskesi_dustu"
              - ahlak: { merhamet: 1, insanlik: 1 }
            kronik: { tr: "Peygamberin odasındaki gerçeğe bakmadın; ertesi sabah onu {yer:tepe|de} herkesin ağzından duydun.", en: "You didn't look at the truth in the prophet's room. The next morning you heard it from the whole hill." }
            sonraki: "vmask_kac_hakli"
          - id: "kac_sahte"
            etiket: { tr: "Bakma; kapıyı kapatıp aşağı in", en: "Don't look. Close the door and go down" }
            goster: { bayrak_yok: "gercek_hasat" }
            etkiler:
              - bayrak: "vahit_sahtekar"
              - bayrak: "vahit_maskesi_dustu"
              - ahlak: { merhamet: 1, insanlik: 1 }
            kronik: { tr: "Peygamberin odasındaki gerçeğe bakmadın; ertesi sabah onu {yer:tepe|de} herkesin ağzından duydun.", en: "You didn't look at the truth in the prophet's room. The next morning you heard it from the whole hill." }
            sonraki: "vmask_kac_sahte"

      - id: "vmask_hakli"
        yer: "tepe"
        paragraflar:
          - { tr: "Pencere imzalı: Sistem'in bütün satırlarında olduğu gibi köşesinde küçük, soğuk bir mühür duruyor. Başlıkta şu yazıyor: \"[ÖN SEÇİM AJANI · TEPE · KOTA: 41.200 / 60.000 · SONRAKİ TESLİM: GÜN 331]\".", en: "The window is signed. Like every line the System writes, it has a small, cold seal in the corner. The header reads: \"[PRE-SELECTION AGENT · THE HEIGHTS · QUOTA: 41,200 / 60,000 · NEXT DELIVERY: DAY 331]\"." }
          - { tr: "\"Listeyi ben yazmadım,\" diyor {npc:vahit}. \"Tek bir ismi bile. Ben yalnızca kopyaladım. Bir sabah pencere açılıp bana bir sayı verdi, ben de o sayıyı insana çevirdim. Söylemiştim. Hep söyledim.\"", en: "\"I never wrote the list,\" {npc:vahit} says. \"Not one of them. I only copied it. One morning the window opened and gave me a number, and I turned the number into people. I told you. I always told you.\"" }
          - { tr: "Derken pencere sana dönüyor ve bu kez senin adınla yeni bir satır beliriyor: \"[Anomali tespit edildi. Ön seçim yetkisi devredilebilir.]\"", en: "Then the window turns toward you. A new line appears, with your name on it this time: \"[Anomaly detected. Pre-selection authority is transferable.]\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu tanıyorum. hasat aracının elleri. sayan, seçen, teslim eden. ben bunlardan biri değilim. değilim. değilim, değil mi?", en: "i̷ know this. the harvesting tool's hands. the ones that count, pick, deliver. i'm not one of them. i'm not. i'm not, am i?" }
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Kota {yer:kiyikent|in} nüfusunun yüzde kırkına denk geliyor, teslim günü de hasadın başladığı güne. Yükselenler bir tarikat değil; hasadın yerel dağıtım şubesi.", en: "The quota is forty percent of {yer:kiyikent|pos} population. The delivery date is the day the Harvest begins. The Ascended aren't a cult. They're the Harvest's local distribution branch." }
        secenekler:
          - id: "yetki"
            etiket: { tr: "Yetkiyi al", en: "Take the authority" }
            etkiler:
              - ahlak: { insanlik: -12, duzen: 4 }
              - yozlasma: 6
              - bayrak: "secici_yetkisi"
              - iliski: { vahit: { korku: 10, baglilik: 10 }, yanki: { guven: -10 } }
            kronik: { tr: "Ön seçim yetkisini peygamberden devraldın; o günden sonra hasadın listelerini senin elin yazdı.", en: "You took the Harvest's pre-selection authority out of the prophet's hands. From then on, your hand wrote the lists." }
            sonraki: "@akis"
          - id: "kir"
            etiket: { tr: "Pencereyi kır; kanalı kapat", en: "Smash the window. Shut the channel" }
            etkiler:
              - ahlak: { insanlik: 8, merhamet: 2 }
              - savas: { dusmanlar: ["vahit_hukum@oyuncu+4"], ortam: ["dar_gecit"], kazan: "vmask_kanal_kirildi", kaybet: "vmask_kanal_yenilgi" }
            kronik: { tr: "Peygamberin odasında hasadın penceresini kırmaya kalktın ve kanalın sesiyle karşı karşıya kaldın.", en: "In the prophet's room you went to smash the Harvest's window, and came face to face with the channel's voice." }
          - id: "kopar"
            tur: "gosteris"
            etiket: { tr: "Kanalı onun kafasından sök; onu da kurtar", en: "Tear the channel out of his head. Save him too" }
            gerekli: { stat: { wil: 180 } }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 4 }
              - dikkat: 6
              - bayrak: "vahit_kanaldan_koptu"
              - iliski: { vahit: { guven: 20, baglilik: 10 } }
              - npc_iz: { vahit: "can_borcu" }
            kronik: { tr: "Hasadın kanalını peygamberin kafasından iradenin gücüyle söküp attın; o gece sessizliği ilk kez dinledi.", en: "You ripped the Harvest's channel out of the prophet's head by sheer will. That night he listened to silence for the first time." }
            sonraki: "vmask_kopar"
          - id: "sakla"
            etiket: { tr: "Sır kalsın; o konuşsun, kanal açık kalsın", en: "Keep it secret. He stays the mouth. Channel open" }
            etkiler:
              - ahlak: { insanlik: -6, duzen: 3 }
              - bayrak: "vahit_sirri_saklandi"
              - iliski: { vahit: { baglilik: 8, guven: 8 } }
            kronik: { tr: "Peygamberin hasatla konuştuğunu bildin ve sustun; kanalı açık bıraktın.", en: "You knew the prophet was talking to the Harvest, and you kept quiet. You left the channel open." }
            sonraki: "@akis"
          - id: "ilan"
            etiket: { tr: "{yer:tepe|e} ilan et: \"Peygamber haklıydı.\"", en: "Tell the hill: \"The Prophet was right.\"" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -4 }
              - itibar: { yukselenler: 15 }
              - degisken: { hayatta_kalan: -3 }
              - iliski: { vahit: { baglilik: 12 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 2, max: 6 } }
            kronik: { tr: "Peygamberin haklı olduğunu bütün {yer:tepe|e} kendi ağzınla ilan ettin.", en: "You announced to the whole hill, in your own voice, that the prophet had been right." }
            sonraki: "@akis"

      - id: "vmask_kanal_kirildi"
        yer: "tepe"
        paragraflar:
          - { tr: "Pencere bin parçaya ayrılıyor, her parça küçük, soğuk bir mühürle sönüp gidiyor. {npc:vahit} şiltenin üstüne yığılıyor; sesi kesilmiş, gözleri açık.", en: "The window breaks into a thousand pieces, and each piece goes dark with a small, cold seal. {npc:vahit} collapses onto the mattress, his voice gone, his eyes open." }
          - { tr: "Epey sonra, fısıltıya yakın bir sesle konuşuyor: \"Sessiz. Ne kadar da sessiz. Hep böyle miydi?\"", en: "A long while later he speaks, very quietly: \"Quiet. So quiet. Was it always like this?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Herkes için hep böyleydi.\"", en: "\"For everybody else, always.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - unvan: "maskeyi_indiren"
              - iliski: { vahit: { guven: 8 } }
            kronik: { tr: "Hasadın kanalını kırdın ve peygambere sessizliği öğrettin.", en: "You broke the Harvest's channel and taught the prophet what silence was." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Onu sessizlikle baş başa bırak", en: "Leave him alone with the silence" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - unvan: "maskeyi_indiren"
              - iliski: { vahit: { korku: 4 } }
            kronik: { tr: "Kanalı kırıp peygamberi, hayatında ilk kez duyduğu sessizlikle baş başa bıraktın.", en: "You broke the channel and left the prophet alone with the first silence of his life." }
            sonraki: "@akis"

      - id: "vmask_kanal_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Pencerenin sesi {npc:vahit|in} ağzından çıkıp seni duvara yapıştırıyor. Kırk bin isim aynı anda okunuyor, hepsi senin kafanın içinde.", en: "The window's voice comes out of {npc:vahit|pos} mouth and pins you to the wall. Forty thousand names get read at once, all of them inside your skull." }
          - { tr: "Kendine geldiğinde oda bomboş; ne pencere kalmış ne {npc:vahit}. Duvarda yalnızca yeni bir çentik var, taptaze, senin tırnaklarınla kazınmış.", en: "When you come to, the room is empty. No window, no {npc:vahit}. Just one new notch on the wall, fresh, scratched with your own fingernails." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; bu iş bitmedi", en: "Get up. This isn't over" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - bayrak: "vahit_sirri_saklandi"
            kronik: { tr: "Hasadın kanalına yenildin; o gece peygamber de penceresi de {yer:tepe|de} bir yerlere gizlendi.", en: "You lost to the Harvest's channel. That night the prophet and his window hid somewhere on the hill." }
            sonraki: "@akis"

      - id: "vmask_kopar"
        yer: "tepe"
        paragraflar:
          - { tr: "Elini {npc:vahit|in} alnına koyup iradeni içeri itiyorsun. Kafatasının içinde soğuk, eski bir kanca var. Onu kökünden söktüğünde pencere ağzı açık kalmış gibi sönüyor.", en: "You put your hand on {npc:vahit|pos} forehead and push your will inside. There's a hook in his skull, cold and old, and you pull it out by the root. The window goes dark with its mouth still open." }
          - { tr: "{npc:vahit} çocuk gibi ağlıyor. \"Gitti,\" diyor. \"Gerçekten gitti. Ben şimdi kimim?\"", en: "{npc:vahit} cries like a little kid. \"It's gone,\" he says. \"It's really gone. Who am I now?\"" }
        secenekler:
          - id: "insan"
            etiket: { tr: "\"Kendinsin. Uzun zamandır ilk kez.\"", en: "\"Yourself. For the first time in a long time.\"" }
            etkiler:
              - unvan: "maskeyi_indiren"
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { vahit: { guven: 6 } }
            kronik: { tr: "Bir adamın kafasındaki hasat kancasını söküp ona kendisi olabilmeyi geri verdin.", en: "You pulled the Harvest's hook out of a man's head and gave him back the chance to be himself." }
            sonraki: "@akis"
          - id: "benim"
            etiket: { tr: "\"Benim. Artık beni dinleyeceksin.\"", en: "\"Mine. You listen to me now.\"" }
            etkiler:
              - unvan: "maskeyi_indiren"
              - ahlak: { insanlik: -5, duzen: 4 }
              - bayrak: "vahit_kukla"
              - iliski: { vahit: { baglilik: 15, korku: 8 } }
            kronik: { tr: "Hasadın kancasını bir adamın kafasından söktün, yerine kendi sesini yerleştirdin.", en: "You pulled the Harvest's hook out of a man's head and put your own voice in its place." }
            sonraki: "@akis"

      - id: "vmask_sahte"
        yer: "tepe"
        paragraflar:
          - { tr: "Notlar titizlikle tutulmuş. Her müridin bir sayfası var: kaybettiği çocuk, sakladığı korku, hangi cümleyle ağladığı. Kendi sayfanı da buluyorsun; üstünde tek satır yazıyor: \"Yalnız. Yalnız olduğunu bilmiyor.\"", en: "The notes are meticulous. Every disciple has a page: the kid they lost, the fear they hide, the sentence that makes them cry. You find your own page too. There's one line on it: \"Alone. Doesn't know it.\"" }
          - { tr: "{npc:vahit} yazıcının yanındaki sararmış kâğıdı gösteriyor. \"Bir kez konuştu,\" diyor. \"Bir kez! Entegrasyon sabahı. Sonra bir daha hiç. Ben de... hattı açık tuttum. Birinin bir şey söylemesi gerekiyordu. İnsanlar bir ses duymadan ölüp gidiyordu.\"", en: "\"It spoke once,\" {npc:vahit} says, pointing at the yellowed page by the printer. \"Once! Integration morning. Then never again. So I... kept the line open. Somebody had to say something. People were dying without a voice.\"" }
          - { tr: "Yazıcıda yarısı basılmış bir sayfa takılı kalmış: Sistem'in yazı tipiyle ertesi sabahın kehaneti.", en: "There's a half-printed page stuck in the printer. In the System's font: tomorrow morning's prophecy." }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Yalan söylüyor ve söylediğine inanıyor. Onda ikisi aynı şey; belki de bu yüzden bu kadar iyi.", en: "He's lying and he believes it. In him, those are the same thing. Maybe that's why he's so good at it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ sabah onunla konuşan ben değildim. biliyorum, sormadın. ama sorarsın diye söylüyorum.", en: "i̷t wasn't me who talked to him that morning. i know, you didn't ask. i'm saying it in case you do." }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Notları müritlerine göster", en: "Show the notes to his flock" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { yukselenler: -25 }
              - iliski: { vahit: { guven: -20, korku: 15 } }
            kronik: { tr: "Peygamberin notlarını sürüsüne gösterdin; o gece sürü peygamberine karşı ayaklandı.", en: "You showed the prophet's notes to his flock. That night the flock turned on its prophet." }
            sonraki: "vmask_ifsa"
          - id: "ses"
            etiket: { tr: "Sakla; ama artık sesi sen yaz", en: "Keep it hidden. But now you write the voice" }
            etkiler:
              - ahlak: { insanlik: -8, duzen: 4 }
              - bayrak: "vahit_kukla"
              - itibar: { yukselenler: 8 }
              - iliski: { vahit: { baglilik: 15, korku: 10 } }
            kronik: { tr: "Sahte peygamberin sırrını sakladın; o günden sonra {yer:tepe|in} kehanetlerini sen yazdın.", en: "You kept the false prophet's secret, and from then on you wrote the hill's prophecies yourself." }
            sonraki: "@akis"
          - id: "affet"
            etiket: { tr: "Onu affet; ama yazıcıyı yanında götür", en: "Forgive him. But take the printer with you" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 4 }
              - bayrak: "vahit_affedildi"
              - iliski: { vahit: { guven: 15 } }
              - npc_iz: { vahit: "yarali_guven" }
            kronik: { tr: "Sahte peygamberi affettin; kehanetlerini basan yazıcıyı da koltuğunun altında {yer:tepe|den} indirdin.", en: "You forgave the false prophet and carried the printer that made his prophecies down off the hill under your arm." }
            sonraki: "@akis"
          - id: "oldur"
            etiket: { tr: "Bitir; bu odada, bu gece", en: "End it. This room, tonight" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 2 }
              - npc_ol: "vahit"
              - unvan: "maskeyi_indiren"
              - itibar: { yukselenler: -15 }
            kronik: { tr: "Dinleme Odası'nda sahte peygamberin işini bitirdin; {yer:tepe} ertesi sabah kehanetsiz uyandı.", en: "You killed the false prophet in his own Listening Room. The next morning the hill woke up with no prophecy." }
            sonraki: "@akis"

      - id: "vmask_ifsa"
        yer: "tepe"
        paragraflar:
          - { tr: "Notları rasathanenin önüne saçıyorsun; sayfalar elden ele geçiyor. Her mürit kendi sayfasını, el yazısıyla kâğıda geçirilmiş kendi korkusunu, kendi ölüsünü buluyor.", en: "You scatter the notes in front of the observatory and the pages go hand to hand. Every disciple finds their own page: their own fear, their own dead, written out by hand." }
          - { tr: "Önce ortalığa bir sessizlik çöküyor, derken biri yerden bir taş alıyor. {npc:vahit} merdivenin başında kalakalmış; kaçmak istiyor ama ayakları tutmuyor.", en: "Silence first. Then someone picks up a rock. {npc:vahit} stands at the top of the stairs. He wants to run, but his feet won't move." }
        secenekler:
          - id: "durdur"
            etiket: { tr: "Kalabalığın önüne geç", en: "Step between him and the crowd" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - unvan: "maskeyi_indiren"
              - npc_gitti: "vahit"
              - bayrak: "vahit_kacti"
              - iliski: { vahit: { guven: 10, korku: 6 } }
            kronik: { tr: "Kendi sürüsünün taşlarına karşı sahte peygamberin önüne geçtin; o gece şehirden kaçtı.", en: "You shielded the false prophet from his own flock's stones. He fled the city that night." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Kenara çekil", en: "Step aside" }
            etkiler:
              - ahlak: { merhamet: -6, duzen: -2 }
              - unvan: "maskeyi_indiren"
              - npc_ol: "vahit"
            kronik: { tr: "Sahte peygamberi sürüsüne bıraktın; {yer:tepe|in} taşları onu rasathanenin basamaklarında buldu.", en: "You left the false prophet to his own flock. The hill's stones found him on the observatory steps." }
            sonraki: "@akis"

      - id: "vmask_kac_hakli"
        paragraflar:
          - { tr: "Kapıyı kapatıp aşağı iniyorsun. Sabah müritlerden biri titreye titreye {yer:tepe|in} meydanına iniyor ve avazı çıktığı kadar bağırıyor: \"Gördüm! Pencereyi gördüm! Gerçekmiş! Benimle de konuştu!\"", en: "You close the door and go down. In the morning a disciple comes stumbling into the hill's square, shaking, shouting: \"I saw it! I saw the window! It's real! It talked to me too!\"" }
          - { tr: "O gün {yer:tepe|in} kalabalığı ikiye katlanıyor. {npc:vahit} artık kimsenin sorgulayamayacağı bir peygamber. Onu durdurabilecek tek kişi sendin ve bakmadın.", en: "That day the crowd on the hill doubles. {npc:vahit} is a prophet nobody can question anymore, and you, because you chose not to look, were the one person who could have stopped him." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; bazı kapılar kapalı kalmalı", en: "Accept it. Some doors should stay shut" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { vahit: { saygi: 4 } }
            kronik: { tr: "Peygamberin odasındaki gerçeğe bakmadın ve sonuçlarına katlanmaya razı oldun.", en: "You didn't look at the truth in the prophet's room, and you chose to live with what came of it." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Geri dön; bu sefer bak", en: "Go back. Look this time" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - bilgi: "secici_kanali"
            kronik: { tr: "Bir gece önce bakamadığın odaya ertesi gün geri döndün.", en: "You went back the next day to the room you wouldn't look into the night before." }
            sonraki: "vmask_hakli"

      - id: "vmask_kac_sahte"
        paragraflar:
          - { tr: "Kapıyı kapatıp aşağı iniyorsun. Sabah olunca kucağında notlar ve bir yazıcıyla bir mürit {yer:tepe|in} meydanına iniyor; ağzını açmadan sayfaları yere bırakıyor, herkes de kendi sayfasını buluyor.", en: "You close the door and go down. In the morning a disciple comes down into the hill's square with an armful of notes and a printer. They don't say anything. They just drop the pages, and everyone finds their own." }
          - { tr: "Öğleye kadar {yer:tepe|in} yarısı boşalıyor. {npc:vahit} kubbedeki odasından çıkmıyor, kapısının önünde taşlar birikip duruyor.", en: "By noon, half the hill has emptied out. {npc:vahit} won't come out of the room in the dome, and rocks are piling up outside his door." }
        secenekler:
          - id: "kacir"
            etiket: { tr: "Gece onu {yer:tepe|den} kaçır", en: "Get him off the hill tonight" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - npc_gitti: "vahit"
              - bayrak: "vahit_kacti"
              - iliski: { vahit: { guven: 12, baglilik: 6 } }
            kronik: { tr: "Sahte peygamberi gece karanlığında kendi tepesinden kaçırdın.", en: "You smuggled the false prophet off his own hill in the middle of the night." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Kaderini sürüsü belirlesin", en: "Let his flock decide his fate" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - itibar: { yukselenler: -10 }
              - iliski: { vahit: { guven: -8 } }
            kronik: { tr: "Sahte peygamberin kaderini sürüsüne bıraktın; kapısında biriken taşlara dokunmadın.", en: "You left the false prophet's fate to his flock and never touched the rocks piling up at his door." }
            sonraki: "@akis"

  # ================================================================== VAHİT 4: YÜKSELİŞ KAPISI
  # Yükseliş sonu: insanlik ≤ −70, zincir_yukselenler tamam, Vahit hayatta. Kapı açılırsa yukselis_kapisi_acildi.
  - id: "vahit_yukselis_kapisi"
    perde: [4]
    ana_yay: { gun: 346 }
    kosul: { bayrak: "vahit_maskesi_dustu" }
    agirlik: 1
    etiketler: ["yukselenler", "npc", "vahit", "ana_yay", "son"]
    gerilim: 4
    npc: ["vahit"]
    onemli: true
    kart: { tr: "Yukarıya açılan kapı", en: "The door that opens upward" }
    sahne: "vkap_1"
    sahneler:
      - id: "vkap_1"
        paragraflar:
          - { tr: "Hasadın on beşinci günü. Gök Kadim gemileriyle dolmuş, şehir yanıyor, Kule'nin tepesi bulutlara gömülmüş. {npc:vahit} seni {yer:tepe|in} doruğunda, kubbesiz kalmış rasathanenin taş zemininde bekliyor.", en: "The fifteenth day of the Harvest. The sky is full of Ancient ships, the city is burning, and the top of the tower is lost in the clouds. {npc:vahit} is waiting for you at the top of {yer:tepe}, on the stone floor of an observatory that doesn't have a dome anymore." }
          - metin: { tr: "Şehri terk etmişti ama işte karşında: yalınayak, sakal bırakmış, üstü başı yol tozu içinde. \"Döndüm,\" diyor. \"Kapı beni bekliyordu. Ya da seni.\"", en: "He'd left the city, but here he is, barefoot, bearded, road dust all over him. \"I came back,\" he says. \"The door was waiting for me. Or for you.\"" }
            kosul: { bayrak: "vahit_kacti" }
          - { tr: "Zeminin ortasında bir kapı duruyor: ne duvarı var ne çerçevesi, havada asılı beyaz bir dikdörtgenden ibaret. Bütün kapılar dışarı açılır; bu ise yukarı açılıyor.", en: "In the middle of the floor there's a door. No wall, no frame. Just a white rectangle standing in the air. Every other door opens out. This one opens up." }
          - metin: { tr: "\"Tıpkı söylediği gibi,\" diyor {npc:vahit}. Ön seçim kanalı artık bütün şehre sesleniyor. \"Hasadın tek çıkışı bu. Yükselen geçer, geri kalanlar onu yukarı taşır. Anahtar benim sesim; kapı senin.\"", en: "\"Just like it said,\" {npc:vahit} tells you. The pre-selection channel is talking to the whole city now. \"The Harvest's only exit. The Ascendant goes through, and everyone else carries them up. The key is my voice. The door is yours.\"" }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "{npc:vahit} ilk kez korkuyla konuşuyor: \"Bunu ben yapmadım. Sen yaptın. İçindeki o bozuk şey ya da sen, belki ikiniz birden. Ben yalnızca yolu gösterdim. Aylarca bir sesi taklit ettim; şimdi gerçeği karşımda duruyor ve konuşmuyor bile. Yalnızca açılmayı bekliyor.\"", en: "\"I didn't make this,\" {npc:vahit} says, scared for the first time. \"You did. That broken thing inside you, or you, or both of you. All I did was point the way. I faked a voice for years, and now the real thing is right in front of me and it doesn't even talk. It just waits to be opened.\"" }
            kosul: { bayrak: "vahit_sahtekar" }
          - metin: { tr: "Merdivenin bütün basamaklarını çıktın. Yükselenler'in son sadakati de artık senin; kapının ardında bekleyen şeyin istediği her şey yerli yerinde. Geriye tek bir adım kaldı.", en: "You've climbed every rung of the ladder. The Ascended's final loyalty belongs to you; everything the thing behind that door needs is in place. All that's left is one step." }
            kosul: { gorev: { zincir_yukselenler: "tamam" } }
          - metin: { tr: "Merdiveni sonuna kadar çıkmadın. Kapı açılıyor ama ardı bulanık, yarım kalmış bir taslak gibi. {npc:vahit} bunu görünce gözlerinde bir şey sönüyor.", en: "You never climbed the ladder all the way up. The door opens, but what's behind it is blurry, like a sketch, unfinished. {npc:vahit} sees it, and something goes out in his eyes." }
            kosul: { bayrak_yok: "yukselis_sadakati", gorev: { zincir_yukselenler: "basla" } }
        sezgiler:
          - kosul: { stat: { per: 400 } }
            metin: { tr: "Kapının ardında {yer:kiyikent|in} kalan nüfusunu gösteren bir sayaç var. Rakam her saniye biraz daha düşüyor.", en: "There's a counter behind the door, and it shows {yer:kiyikent|pos} remaining population. The number drops a little every second." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u kapıyı tanıyorum. önceki döngüde biri açmıştı. sonra... sonra döngü baştan başladı. sonrasını hatırlamıyorum. belki de hatırlamamam gerekiyordu.", en: "i̷ know this door. somebody opened it in the last loop. then... then the loop started over. i don't remember after that. maybe i'm not supposed to." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O kapının ardında kimse yok. Sen bile yoksun.\"", en: "\"There's nobody behind that door. Not even you.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sana canavara mı dönüşüyorsun, tanrıya mı diye sorduğum günü hatırlıyor musun? Cevabı o kapının ardında, değil mi? Ne olur açma.\"", en: "\"Remember when I asked if you were turning into a monster or a god? The answer's behind that door, isn't it? Please don't open it.\"" }
        secenekler:
          - id: "ac"
            etiket: { tr: "Kapıyı aç; insanlık seni taşısın", en: "Open the door. Let humanity carry you up" }
            goster: { gorev: { zincir_yukselenler: "tamam" } }
            etkiler:
              - ahlak: { insanlik: -15, merhamet: -6 }
              - bayrak: "yukselis_kapisi_acildi"
              - unvan: "sesin_ta_kendisi"
              - degisken: { hayatta_kalan: -6 }
              - iliski: { vahit: { baglilik: 20 }, yanki: { guven: -15 } }
            kronik: { tr: "Yukarı açılan kapıyı açtın, insanlığın seni yukarı taşımasına izin verdin; peygamber anahtar oldu.", en: "You opened the door that opens upward and let humanity carry you through it. The prophet became the key." }
            sonraki: "vkap_acik"
          - id: "muhurle"
            etiket: { tr: "Kapıyı mühürle; peygamberi yaşat", en: "Seal the door. Let the prophet live" }
            etkiler:
              - ahlak: { insanlik: 8, merhamet: 4 }
              - bayrak: "yukselis_kapisi_muhurlendi"
              - iliski: { vahit: { guven: 10 } }
            kronik: { tr: "Anahtarı olmayı bekleyen adamı yaşatıp yukarı açılan kapıyı mühürledin.", en: "You sealed the door that opens upward and let the man who'd been waiting to be its key go on living." }
            sonraki: "vkap_muhur"
          - id: "once_sen"
            etiket: { tr: "\"Önce sen geç.\"", en: "\"You go first.\"" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - iliski: { vahit: { korku: 10 } }
            kronik: { tr: "Yükseliş Kapısı'ndan önce peygamberin geçmesini istedin.", en: "You told the prophet to go through the Ascension Door first." }
            sonraki: "vkap_once"
          - id: "yik"
            etiket: { tr: "Kapıyı ve anahtarını birlikte yık", en: "Break the door and its key together" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: -4, duzen: -2 }
              - savas: { dusmanlar: ["vahit_hukum@oyuncu+6"], ortam: ["tavan"], kazan: "vkap_yikildi", kaybet: "vkap_yenilgi" }
            kronik: { tr: "Hasadın ortasında Yükseliş Kapısı'nı da anahtarı olan peygamberi de yıkmaya kalktın.", en: "In the middle of the Harvest you set out to destroy the Ascension Door and the prophet who was its key." }
          - id: "son_kez"
            tur: "gosteris"
            etiket: { tr: "Kapıya tek bakışla \"hayır\" de", en: "Tell the door no with a single look" }
            gerekli: { stat: { wil: 400 } }
            etkiler:
              - ahlak: { insanlik: 10, duzen: -3 }
              - dikkat: 10
              - bayrak: "yukselis_kapisi_muhurlendi"
              - iliski: { vahit: { saygi: 15, korku: 10 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Hasadın sunduğu tanrılığa tek bir bakışla hayır dedin; kapı bir çizgiye, sonra bir noktaya indi.", en: "With a single look you refused the godhood the Harvest offered, and the door shrank to a line, then a dot." }
            sonraki: "vkap_muhur"

      - id: "vkap_acik"
        yer: "tepe"
        paragraflar:
          - { tr: "Kapının kolu yok; elini üstüne koymanla açılması bir oluyor. {npc:vahit} arkanda konuşmaya başlıyor ve bu kez sesi gerçekten her kulağa ulaşıyor: şehrin bütün panellerinden, bütün radyolarından, her kafatasının içinden.", en: "The door has no handle. You just lay your hand on it, and it opens. Behind you, {npc:vahit} starts to speak, and this time his voice really does reach every ear: out of every panel in the city, every radio, the inside of every skull." }
          - { tr: "Aşağıda, yanan sokaklarda insanlar olduğu yerde duruyor. Sonra birer birer başlarını kaldırıp yürümeye koyuluyorlar: {yer:tepe|e}, kapıya, sana doğru.", en: "Down below, in the burning streets, people stop. Then one by one they look up and start walking: toward the hill, toward the door, toward you." }
          - { tr: "Kapı arkandan henüz kapanmıyor. Son karar gününe dek bekleyecek, bütün şehir sana yetişsin diye.", en: "The door doesn't close behind you yet. It's waiting, until the day of the final decision, for the whole city to catch up to you." }
        bildirimler:
          - tur: "evrim"
            nadirlik: "benzersiz"
            baslik: { tr: "[YÜKSELİŞ KAPISI · AÇIK]", en: "[ASCENSION DOOR · OPEN]" }
            satirlar:
              - { tr: "Taşıyıcı: tanımlandı. Yakıt: yolda.", en: "Carrier: identified. Fuel: en route." }
              - { tr: "Son karar bekleniyor.", en: "Final decision pending." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Eşikte bekle; şehir sana gelsin", en: "Wait on the threshold. Let the city come to you" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 2 }
              - itibar: { yukselenler: 10 }
            kronik: { tr: "Yükseliş Kapısı'nın eşiğinde durup şehrin sana yürümesini bekledin.", en: "You stood on the threshold of the Ascension Door and waited for the city to walk to you." }
            sonraki: "@akis"
          - id: "vahite"
            etiket: { tr: "{npc:vahit|e} dön: \"Sen haklıydın.\"", en: "Turn to {npc:vahit}: \"You were right.\"" }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: 1 }
              - iliski: { vahit: { baglilik: 10, guven: 10 } }
            kronik: { tr: "Eşikte durup peygambere haklı olduğunu söyledin; gözleri doldu.", en: "On the threshold you told the prophet he'd been right. He cried." }
            sonraki: "@akis"

      - id: "vkap_muhur"
        yer: "tepe"
        paragraflar:
          - { tr: "Elini kapının ortasına koyup itiyorsun, ama açmak için değil, kapatmak için. Beyaz dikdörtgen titreyip inceliyor; önce bir çizgiye, sonra bir noktaya dönüşüyor.", en: "You put your hand in the middle of the door and push, not to open it but to shut it. The white rectangle trembles, thins out, and turns into a line, then a dot." }
          - { tr: "{npc:vahit} noktanın kaybolduğu yere uzun uzun bakıyor. \"Bütün ömrüm bir kapının önünde beklemekle geçti,\" diyor. \"Şimdi kapı da yok.\" Sonra tuhaf bir şey oluyor: gülüyor.", en: "{npc:vahit} stares at the place where the dot disappeared for a long time. \"My whole life,\" he says, \"was waiting in front of a door. Now there's no door.\" Then, strangely, he laughs." }
        secenekler:
          - id: "yasa"
            etiket: { tr: "\"Şimdi yaşamaya başla.\"", en: "\"Now start living.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { vahit: { guven: 8 } }
            kronik: { tr: "Yükseliş Kapısı'nı mühürleyip bir peygambere yaşamayı öğrettin.", en: "You sealed the Ascension Door and taught a prophet how to live." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Onu gülmesiyle baş başa bırak", en: "Leave him there laughing" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Kapısız kalan peygamberi kubbesiz rasathanede kahkahalarıyla baş başa bıraktın.", en: "You left the doorless prophet laughing in the domeless observatory." }
            sonraki: "@akis"

      - id: "vkap_once"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} önce kapıya, sonra sana bakıyor. Aylardır beklediği şey yalnızca bir adım ötede.", en: "{npc:vahit} looks at the door, then at you. The thing he's been waiting years for is just one step away." }
          - metin: { tr: "Sonunda titreyen bir sesle konuşuyor: \"Benim için değil. Hiçbir zaman benim için değildi. Ben yalnızca anahtarım.\" Yine de bir adım atıyor; ışık onu ayak bileklerinden yakalayıp çekmeye başlıyor.", en: "\"It's not for me,\" he finally says, voice shaking. \"It was never for me. I'm just the key.\" But he takes a step anyway, and the light catches him by the ankles and starts to pull." }
            kosul: { bayrak: "vahit_hakli" }
          - metin: { tr: "\"Ya ardında hiçbir şey yoksa?\" diye fısıldıyor. \"Ya orada da bir yazıcı varsa?\" Yine de bir adım atıyor; ışık onu ayak bileklerinden yakalayıp çekmeye başlıyor.", en: "\"What if there's nothing?\" he whispers. \"What if there's just another printer back there?\" But he takes a step anyway, and the light catches him by the ankles and starts to pull." }
            kosul: { bayrak: "vahit_sahtekar" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bırak gitsin", en: "Let him go" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4 }
              - npc_ol: "vahit"
              - bayrak: "yukselis_kapisi_muhurlendi"
            kronik: { tr: "Peygamberin Yükseliş Kapısı'ndan geçmesine göz yumdun; ışık onu yuttu, kapı da anahtarıyla birlikte kapandı.", en: "You let the prophet go through the Ascension Door first. The light swallowed him, and the door closed along with its key." }
            sonraki: "@akis"
          - id: "cek"
            etiket: { tr: "Son anda onu geri çek", en: "Pull him back at the last second" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { vahit: { baglilik: 15, guven: 10 } }
            kronik: { tr: "Peygamberi kapının ışığından son anda söküp aldın.", en: "You pulled the prophet back out of the door's light at the last second." }
            sonraki: "vkap_1"

      - id: "vkap_yikildi"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:vahit} rasathanenin taş zemininde yatıyor; sesi sonunda yalnızca bir insanın sesine dönmüş. Kapı anahtarını yitirmiş bir kilit gibi titreyip çatlıyor.", en: "{npc:vahit} lies on the observatory's stone floor. His voice, at last, is just a human voice. The door trembles like a lock that lost its key, and then it cracks." }
          - { tr: "\"Bitir,\" diyor. \"Ya da bitirme. İkisi de... galiba ikisi de benim için bir cevap.\"", en: "\"Finish it,\" he tells you. \"Or don't. Either one... I guess either one is an answer for me.\"" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Bitir", en: "Finish it" }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 2 }
              - npc_ol: "vahit"
              - bayrak: "yukselis_kapisi_muhurlendi"
            kronik: { tr: "Kubbesiz rasathanede Yükseliş Kapısı'nın anahtarını, peygamberi öldürdün; kapı da onunla birlikte kırıldı.", en: "You killed the Ascension Door's key, the prophet, in the domeless observatory. The door broke along with him." }
            sonraki: "@akis"
          - id: "yasat"
            etiket: { tr: "Kapıyı kır; onu yaşat", en: "Break the door. Let him live" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - bayrak: "yukselis_kapisi_muhurlendi"
              - iliski: { vahit: { guven: 10, korku: 6 } }
            kronik: { tr: "Yükseliş Kapısı'nı kırdın ama anahtarını yaşattın.", en: "You broke the Ascension Door, but you let its key live." }
            sonraki: "@akis"

      - id: "vkap_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Hükmün sesi seni dizlerinin üstüne çöktürüyor. {npc:vahit} tepende dikiliyor; ondan ilk kez gerçekten korkuyorsun.", en: "The Verdict's voice drives you to your knees. {npc:vahit} stands over you, and for the first time you're truly afraid of him." }
          - { tr: "\"Görüyor musun?\" diyor yumuşacık. \"Kapı seni seçti, yıkılmana izin vermez.\" Elini uzatıyor; arkasında kapı açık bekliyor.", en: "\"Do you see?\" he says softly. \"The door chose you. It won't let you be broken.\" He holds out his hand, and behind him the door waits, open." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Elini tut", en: "Take his hand" }
            etkiler:
              - ahlak: { insanlik: -8, duzen: 2 }
              - iliski: { vahit: { baglilik: 10 } }
            kronik: { tr: "Seni yenen peygamberin uzattığı eli tuttun.", en: "You took the hand of the prophet who'd beaten you." }
            sonraki: "@akis"
          - id: "it"
            etiket: { tr: "Elini it ve kalk", en: "Knock his hand away. Get up" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { vahit: { saygi: 6, guven: -4 } }
            kronik: { tr: "Kapının önünde yenildin ama peygamberin elini ittin.", en: "You lost in front of the door, but you knocked the prophet's hand away." }
            sonraki: "@akis"

  # ================================================================== DENİZ: YÜKSELEN RAKİP
  # Yalnızca Deniz Yükselenler'deyse. deniz_rakip_oldu → J'nin buyuk_ihanet'i Deniz'i hain seçebilir (ihanet_deniz J'nin).
  # deniz_yukselenlerden_dondu → Deniz Sığınak'a geçer (Parti F okur). Deniz'in ana yayı Parti F'nindir.
  - id: "deniz_yukselen_rakip"
    perde: [2, 3]
    ana_yay: { gun: 150 }
    kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_hayatta: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "yukselenler", "npc", "duello"]
    gerilim: 4
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Beyaz Kalkan", en: "The White Shield" }
    sahne: "drakip_1"
    sahneler:
      - id: "drakip_1"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} meydanında, kırık saat kulesinin dibinde beyaz cübbeli bir kalabalık seni bekliyor. Ortalarında, kalkanı sırtında, göğsüne tek bir göz dikilmiş {npc:deniz_arman} duruyor.", en: "In the square in {yer:eski_sehir}, under the broken clock tower, a crowd in white is waiting for you. In the middle of them, shield on {zamir:deniz_arman|onun} back, a single eye stitched over {zamir:deniz_arman|onun} heart, stands {npc:deniz_arman}." }
          - { tr: "Çok değişmiş: omuzları genişlemiş, yüzü incelmiş, gözaltlarındaki şey uykusuzluk değil, başka bir şey. {yer:tepe|de} ona Beyaz Kalkan diyorlarmış; Seçilmişlerin önünde duran, hiç düşmeyen kalkan.", en: "{zamir:deniz_arman|o|b}'ve changed. Broader in the shoulders, thinner in the face, and what's under {zamir:deniz_arman|onun} eyes isn't lack of sleep. It's something else. Up in {yer:tepe} they call {zamir:deniz_arman|onu} the White Shield: the one who stands in front of the Chosen and never falls." }
          - metin: { tr: "Selam bile vermeden konuşuyor: \"Onu buldum. Karnı tok, güvende, martı resimleri çiziyor. Beni hatırlamıyor ama martıları hatırlıyor.\"", en: "\"I found her,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, without even saying hi. \"She's fed, she's safe, she draws gulls. She doesn't remember me. But she remembers the gulls.\"" }
            kosul: { bayrak: "deniz_kardes_bulundu" }
          - metin: { tr: "Selam bile vermeden konuşuyor: \"Onu hâlâ görmeme izin vermiyorlar. Yakında, diyorlar; Kalkan yeterince güçlenince. Ben de güçleniyorum.\"", en: "\"They still won't let me see her,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, without even saying hi. \"Soon, they say. Once the Shield's strong enough. So I'm getting stronger.\"" }
            kosul: { bayrak_yok: "deniz_kardes_bulundu" }
          - { tr: "\"Peygamber senin Seçilmiş olduğunu söylüyor,\" diye sürdürüyor. \"Öyleyse {yer:tepe|e} gel. Ya da şuracıkta, herkesin önünde yanıldığımı söyle. Ama bu sefer arkanı dönüp gitme.\"", en: "\"The Prophet says you're the Chosen,\" {zamir:deniz_arman|o} keep{zamir:deniz_arman|s} going. \"So come up to {yer:tepe}. Or tell me I'm wrong, right here, in front of them. But don't turn your back and walk away this time.\"" }
          - metin: { tr: "Giderken ona söz vermiştin: bir gün ikisini de oradan çıkaracaktın. Gözlerinden o sözü unutmadığı okunuyor.", en: "When {zamir:deniz_arman|o} left, you made a promise: someday you'd walk them both out of there. {zamir:deniz_arman|onun|b} eyes say {zamir:deniz_arman|o} remember{zamir:deniz_arman|s}." }
            kosul: { hafiza: { deniz_arman: "gidis_soz" } }
          - metin: { tr: "Giderken ona sırtını dönmüştün. Bunu unutmadığını bakışından çok, sana hiç bakmamasından anlıyorsun.", en: "When {zamir:deniz_arman|o} left, you turned your back. You can tell {zamir:deniz_arman|o} remember{zamir:deniz_arman|s}, less from the way {zamir:deniz_arman|o} look{zamir:deniz_arman|s} at you than from the way {zamir:deniz_arman|o} won't." }
            kosul: { hafiza: { deniz_arman: "arkasini_dondu" } }
        sezgiler:
          - kosul: { stat: { per: 70 } }
            metin: { tr: "Bir ayda otuz seviye atlamış, ama hiçbir Kapı kaydı yok. Kalkanının iç yüzüne küçük çentikler kazınmış; her biri bir tarih.", en: "{zamir:deniz_arman|onun|b} level jumped thirty in a month. No Gate record. There are little notches scratched inside the shield, each one a date." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷nu yakıtla beslemişler. yakıtının ne olduğunu bilmiyor. çentikler... sayıyor ama neyi saydığını bilmiyor.", en: "t̷hey've been feeding {zamir:deniz_arman|onu} fuel. {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't know where it comes from. the notches. {zamir:deniz_arman|o} {zamir:deniz_arman|is} counting and doesn't know what." }
        secenekler:
          - id: "soz"
            etiket: { tr: "Sözünü hatırlat: \"İkinizi de çıkaracağım.\"", en: "Remind them: \"I'm getting you both out.\"" }
            goster: { hafiza: { deniz_arman: "gidis_soz" } }
            zar: { stat: "cha", zorluk: 34, tek: true, basarisiz: "drakip_soz_yok", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { iliski: { deniz_arman: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - iliski: { deniz_arman: { guven: 15, baglilik: 10 } }
            kronik: { tr: "Beyaz Kalkan'a, kardeşiyle onu oradan çıkarma sözünü hatırlattın.", en: "You reminded the White Shield of your promise to get them and their sister out." }
            sonraki: "drakip_donus"
          - id: "duello"
            etiket: { tr: "Meydan okumayı kabul et", en: "Accept the challenge" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 6 } }
              - savas: { dusmanlar: ["deniz_beyaz_kalkan@oyuncu+3"], kazan: "drakip_zafer", kaybet: "drakip_yenilgi" }
            kronik: { tr: "{yer:eski_sehir|in} meydanında, kırık saatin dibinde en eski arkadaşınla dövüştün.", en: "You fought your oldest friend in the {yer:eski_sehir} square, under the broken clock." }
          - id: "teslim"
            etiket: { tr: "\"Tamam. {yer:tepe|e} geliyorum.\"", en: "\"Fine. I'm coming up the hill.\"" }
            etkiler:
              - ahlak: { insanlik: -6, duzen: 3 }
              - itibar: { yukselenler: 8 }
              - bayrak: "deniz_kalkanin_oldu"
              - iliski: { deniz_arman: { baglilik: 6, guven: -4, korku: 4 } }
              - tohum: { olay: "vahit_secilmisler", gecikme: { min: 2, max: 5 }, kosul: { npc_hayatta: "vahit" } }
            kronik: { tr: "Arkadaşının peşinden {yer:tepe|e} çıktın; Beyaz Kalkan o günden sonra senin kalkanın oldu.", en: "You followed your friend up to {yer:tepe}. From that day on, the White Shield was your shield." }
            sonraki: "drakip_teslim"
          - id: "guc"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek gücünü göster; kim kime eğilir, görsünler", en: "Show your real power. Let them see who bows" }
            gerekli: { stat: { wil: 80 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 3, insanlik: -4 }
              - itibar: { yukselenler: 6 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { korku: 10, saygi: 8, guven: -8 } }
            kronik: { tr: "Bütün Seçilmişleri meydanda diz çöktürdün; yalnızca en eski arkadaşın ayakta kaldı ve o günden sonra sana rakip oldu.", en: "You brought every one of the Chosen to their knees in the square. Only your oldest friend stayed standing, and from that day on was your rival." }
            sonraki: "drakip_guc"
          - id: "yalniz"
            etiket: { tr: "\"Kalabalığı gönder. Yalnız konuşalım.\"", en: "\"Send the crowd away. Let's talk alone.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Beyaz Kalkan'dan kalabalığı göndermesini istedin; kırık saatin altında baş başa konuştunuz.", en: "You asked the White Shield to send the crowd away, and the two of you talked alone under the broken clock." }
            sonraki: "drakip_yalniz"

      - id: "drakip_donus"
        paragraflar:
          - { tr: "{npc:deniz_arman} uzun uzun sana bakıyor. Sonra kalkanı sırtından indirip yere bırakıyor; arkasındaki beyazların arasından bir uğultu yükseliyor.", en: "{npc:deniz_arman} looks at you for a long time. Then {zamir:deniz_arman|o} take{zamir:deniz_arman|s} the shield off {zamir:deniz_arman|onun} back and set{zamir:deniz_arman|s} it on the ground, and a murmur rises from the white robes behind {zamir:deniz_arman|onu}." }
          - { tr: "Cübbesinin düğmelerini çözerken konuşuyor: \"Ne yaptığımı bilmiyorum. Ama onların ne yaptığını biliyorum. Kalkanın içindeki çentikler... Onları ben saymadım. Biri benim yerime saydı.\"", en: "\"I don't know what I'm doing,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, unbuttoning the robe. \"But I know what they're doing. The notches inside the shield... I didn't count those. Somebody counted them for me.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "\"Sığınak'a git. Kardeşin için yol açacağım.\"", en: "\"Go to the Haven. I'll open a road for your sister.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_yukselenlerden_dondu"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - itibar: { siginak: 4, yukselenler: -8 }
              - iliski: { deniz_arman: { baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_yukselen_rakip", agirlik: 50 }
            kronik: { tr: "En eski arkadaşını Yükselenler'den çıkarıp Sığınak'a yolladın.", en: "You got your oldest friend out of the Ascended and sent them to the Haven." }
            sonraki: "@akis"
          - id: "sarilir"
            etiket: { tr: "Ona sarıl, uzun süre bırakma", en: "Hug them. Don't let go for a while" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_yukselenlerden_dondu"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_yukselen_rakip", agirlik: 55 }
            kronik: { tr: "Beyazı çıkaran arkadaşına kırık saatin altında sarıldın; uzun süre ikinizin de ağzından tek söz çıkmadı.", en: "Under the broken clock you hugged the friend who'd just taken off the white. Neither of you said anything for a long time." }
            sonraki: "@akis"

      - id: "drakip_soz_yok"
        paragraflar:
          - { tr: "Sözlerin meydanda yankılanıyor ama {npc:deniz_arman|e} ulaşmıyor. \"Söz ha,\" diyor acı acı gülümseyerek. \"Vapurda da bana simit sözü vermiştin.\"", en: "Your words echo across the square, but they don't reach {npc:deniz_arman}. \"A promise,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} with a bitter smile. \"You promised me a pretzel on the ferry too.\"" }
          - { tr: "Kalkanını sırtından indiriyor. \"Sözlerini artık kalkanıma anlat.\"", en: "{zamir:deniz_arman|o|b} pull{zamir:deniz_arman|s} the shield off {zamir:deniz_arman|onun} back. \"Tell your promises to my shield now.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kalkanına karşı dur", en: "Stand against the shield" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - savas: { dusmanlar: ["deniz_beyaz_kalkan@oyuncu+3"], kazan: "drakip_zafer", kaybet: "drakip_yenilgi" }
            kronik: { tr: "Sözünü dinlemeyen arkadaşınla meydanda dövüştün.", en: "You fought the friend who wouldn't listen to your promise." }
          - id: "git"
            etiket: { tr: "Bu sefer dövüşme; yalnızca bekle", en: "Don't fight this time. Just wait" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { saygi: -4, guven: 2 } }
            kronik: { tr: "Arkadaşın kalkanını kaldırdığında karşılık vermedin; o da vurmadan {yer:tepe|e} döndü.", en: "When your friend raised the shield, you didn't fight. Neither did they. They went back up the hill." }
            sonraki: "@akis"

      - id: "drakip_zafer"
        paragraflar:
          - { tr: "Kalkan meydanın taşlarında dönüp dönüp sonunda duruyor. {npc:deniz_arman} dizlerinin üstüne çökmüş, nefes nefese; dudağı kanıyor ama gözünü kaçırmıyor.", en: "The shield spins to a stop on the square's stones. {npc:deniz_arman} is on {zamir:deniz_arman|onun} knees, out of breath, lip bleeding, but {zamir:deniz_arman|o} won't look away." }
          - { tr: "Beyaz cübbelilerden çıt çıkmıyor. Kırık saatin yelkovanı tam o anda bir dakika ilerliyor; yıllardır ilk kez.", en: "The white robes are silent. The broken clock's hand ticks forward one minute right then, for the first time in years." }
        secenekler:
          - id: "bagisla"
            etiket: { tr: "Elini uzat: \"Kalk.\"", en: "Hold out a hand: \"Get up.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { saygi: 10, guven: -2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_yukselen_rakip", agirlik: 30 }
            kronik: { tr: "Meydanda yendiğin arkadaşına elini uzattın; tutmadı ama o günden sonra sana bir rakip olarak saygı duydu.", en: "You held your hand out to the friend you'd beaten in the square. They didn't take it, but from then on they respected you as a rival." }
            sonraki: "@akis"
          - id: "oldur"
            etiket: { tr: "Bitir", en: "Finish it" }
            etkiler:
              - ahlak: { merhamet: -15, insanlik: -10 }
              - npc_ol: "deniz_arman"
              - unvan: "kardes_katili"
              - bayrak: "deniz_oyuncu_oldurdu"
              - yozlasma: 6
              - itibar: { yukselenler: -10 }
            kronik: { tr: "En eski arkadaşını {yer:eski_sehir|in} meydanında, kırık saatin altında öldürdün.", en: "You killed your oldest friend in the {yer:eski_sehir} square, under the broken clock." }
            sonraki: "@akis"
          - id: "cubbe"
            etiket: { tr: "Cübbesini çıkar: \"Kardeşine git, beyazsız.\"", en: "Pull off the robe: \"Go to your sister. No white.\"" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 3 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { korku: 6, saygi: 6 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Yendiğin arkadaşının beyaz cübbesini herkesin gözü önünde çıkardın; cübbesiz hâliyle yine de {yer:tepe|e} döndü.", en: "You stripped the white robe off your beaten friend in front of everyone. Robeless, they went back up the hill anyway." }
            sonraki: "@akis"

      - id: "drakip_yenilgi"
        paragraflar:
          - { tr: "Kalkanın kenarı göğsüne iniyor, sırtüstü meydanın taşlarına çakılıyorsun. {npc:deniz_arman} tepende, kalkanı havada; ama indirmiyor.", en: "The edge of the shield hits you in the chest and your back slams onto the square's stones. {npc:deniz_arman} is over you, shield raised. It doesn't come down." }
          - { tr: "\"Gördün mü?\" diyor ağlayarak. \"İnsansın. Hâlâ insansın.\" Kalkanını indirip beyazların arasına dönüyor. Kalabalık \"Kalkan! Kalkan!\" diye tempo tutuyor; o bir kez olsun başını kaldırmıyor.", en: "\"See?\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, crying. \"You're human. You're still human.\" {zamir:deniz_arman|o|b} lower{zamir:deniz_arman|s} the shield and walk{zamir:deniz_arman|s} back into the white robes. The crowd chants Shield, Shield, and {zamir:deniz_arman|o} never once lift{zamir:deniz_arman|s} {zamir:deniz_arman|onun} head." }
        secenekler:
          - id: "yat"
            etiket: { tr: "Taşlarda uzan, saate bak", en: "Lie on the stones. Look at the clock" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { saygi: -4, guven: 4 } }
            kronik: { tr: "Meydanda en eski arkadaşına yenildin; canını bağışladı ve {yer:tepe|in} kahramanı oldu.", en: "You lost to your oldest friend in the square. They spared you and became the hill's hero." }
            sonraki: "@akis"
          - id: "seslen"
            etiket: { tr: "Arkasından seslen: \"Bu sen değilsin!\"", en: "Shout after them: \"This isn't you!\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { guven: 2, baglilik: 2 } }
            kronik: { tr: "Seni yenen arkadaşının arkasından bağırdın; durmadı ama omuzları titredi.", en: "You shouted after the friend who'd beaten you. They didn't stop, but their shoulders shook." }
            sonraki: "@akis"

      - id: "drakip_teslim"
        paragraflar:
          - { tr: "{npc:deniz_arman|in} yüzünden iki şey birden geçiyor: rahatlama ve dehşet. Yanına yürüyorsun; beyazlar ikinizi ortalarına alıp yokuşa doğru götürüyor.", en: "Two things cross {npc:deniz_arman|pos} face at the same time: relief and horror. You walk up beside {zamir:deniz_arman|onu}, and the white robes close around you both and walk you toward the hill." }
          - { tr: "Yarı yolda sana dönüp fısıldıyor: \"Gelmeni istiyordum. Peki neden şimdi korkuyorum?\"", en: "Halfway there, {zamir:deniz_arman|o} turn{zamir:deniz_arman|s} to you and whisper{zamir:deniz_arman|s}: \"I wanted you to come. So why am I scared now?\"" }
        secenekler:
          - id: "koru"
            etiket: { tr: "\"Çünkü artık seni ben korurum.\"", en: "\"Because now I'm the one protecting you.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { deniz_arman: { baglilik: 6, korku: 4 } }
            kronik: { tr: "Beyaz Kalkan'a bundan böyle onu senin koruyacağını söyledin; korka korka inandı.", en: "You told the White Shield you'd be the one protecting them from now on. Scared, they believed you." }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Çünkü haklısın. Korkmalısın.\"", en: "\"Because you're right. You should be scared.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 6 } }
            kronik: { tr: "{yer:tepe|e} çıkarken arkadaşına korkmakta haklı olduğunu söyledin.", en: "On the way up to {yer:tepe} you told your friend they were right to be scared." }
            sonraki: "@akis"

      - id: "drakip_guc"
        paragraflar:
          - { tr: "Gizlediğin her şeyi salıveriyorsun. Meydanın havası içine göçüyor; beyaz cübbeliler dalga dalga dizlerinin üstüne iniyor, kırık saat kulesinin camları zangırdıyor.", en: "You let go of everything you've been hiding. The air in the square caves in, and the white robes go down on their knees one after another, in waves. The broken clock tower's glass rattles." }
          - { tr: "Ayakta kalan bir tek {npc:deniz_arman}. Dizleri titriyor, kalkanı elinden kayıyor, ama kendisi yıkılmıyor. \"Sen bu musun?\" diye soruyor. \"Buna mı dönüştün?\"", en: "Only {npc:deniz_arman} is still standing. {zamir:deniz_arman|onun|b} knees are shaking, the shield's slipping, but {zamir:deniz_arman|o} won't go down. \"Is this you?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"Is this what you became?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet.\"", en: "\"Yes.\"" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - iliski: { deniz_arman: { korku: 6, guven: -6 } }
            kronik: { tr: "En eski arkadaşın sana neye dönüştüğünü sorduğunda tek kelimeyle cevap verdin: evet.", en: "When your oldest friend asked what you'd become, you answered with one word: yes." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Gücü geri çek; onu ayakta bırak", en: "Pull the power back. Leave them standing" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - gizle: 2
              - iliski: { deniz_arman: { saygi: 6 } }
            kronik: { tr: "Bütün Seçilmişleri diz çöktürdün, sonra gücünü geri çekip arkadaşını ayakta bıraktın.", en: "You brought all the Chosen to their knees, then pulled your power back and let your friend stay standing." }
            sonraki: "@akis"

      - id: "drakip_yalniz"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir an duraksadıktan sonra elini kaldırıyor; beyazlar meydanın kenarına çekiliyor. Kırık saatin altında, vapurdaki iki koltuk gibi baş başa kalıyorsunuz.", en: "{npc:deniz_arman} hesitates, then raises a hand, and the white robes pull back to the edges of the square. The two of you are left under the broken clock, like two seats on the ferry." }
          - { tr: "Sen ağzını açmadan konuşuyor: \"Bana yakıtı anlatma. Biliyorum, herkes biliyor. Ama kardeşim orada ve tek yol yukarı.\"", en: "\"Don't tell me about the fuel,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} before you can open your mouth. \"I know. Everybody knows. But my sister's up there, and the only way is up.\"" }
        secenekler:
          - id: "katki"
            etiket: { tr: "Kalkanındaki çentiklerin ne olduğunu söyle", en: "Tell them what the notches on the shield are" }
            gerekli: { bilgi: "yakit_katkisi" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - iliski: { deniz_arman: { guven: 8, korku: 4 } }
              - npc_iz: { deniz_arman: "yara_izi" }
            kronik: { tr: "Arkadaşına, kalkanındaki her çentiğin bir insan olduğunu söyledin.", en: "You told your oldest friend that every notch of their power was a person." }
            sonraki: "drakip_cetik"
          - id: "aile"
            etiket: { tr: "\"Bana {yer:tepe|den} bir aile ver. Tek bir aile.\"", en: "\"Give me one family off the hill. Just one.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 3, max: 6 } }
            kronik: { tr: "Beyaz Kalkan'dan {yer:tepe|den} tek bir aile istedin.", en: "You asked the White Shield for one family off the hill." }
            sonraki: "@akis"
          - id: "veda"
            etiket: { tr: "\"O zaman bir gün karşı karşıya geliriz.\"", en: "\"Then someday we'll be on opposite sides.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { saygi: 6, baglilik: -4 } }
            kronik: { tr: "Kırık saatin altında en eski arkadaşınla bir gün karşı karşıya geleceğinizi kabul ettiniz.", en: "Under the broken clock, you and your oldest friend agreed that someday you'd be on opposite sides." }
            sonraki: "@akis"

      - id: "drakip_cetik"
        paragraflar:
          - { tr: "{npc:deniz_arman} kalkanı çevirip çentiklere ilk kez görüyormuş gibi bakıyor. Parmağını önce birinin, sonra bir başkasının üstünde gezdiriyor.", en: "{npc:deniz_arman} turns the shield over and looks at the notches like {zamir:deniz_arman|o} {zamir:deniz_arman|is} seeing them for the first time. {zamir:deniz_arman|o|b} run{zamir:deniz_arman|s} a finger over one, then another." }
          - { tr: "Sonunda bir yabancının sesiyle, \"Kırk yedi,\" diyor. \"Kırk yedi kişi. Bense her sabah kendimi daha iyi hissediyordum.\"", en: "\"Forty-seven,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}, in a stranger's voice. \"Forty-seven people. And I felt better every morning.\"" }
        secenekler:
          - id: "gel"
            etiket: { tr: "\"Benimle gel. Şimdi.\"", en: "\"Come with me. Right now.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_yukselenlerden_dondu"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
            kronik: { tr: "En eski arkadaşın, gücünün bedelini gördükten sonra kalkanını meydanda bırakıp seninle geldi.", en: "You showed your oldest friend what their power cost. They left the shield in the square and came with you." }
            sonraki: "@akis"
          - id: "karar"
            etiket: { tr: "\"Ne yapacağına sen karar ver.\"", en: "\"You decide what to do with that.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - bayrak: "deniz_rakip_oldu"
              - iliski: { deniz_arman: { saygi: 8 } }
            kronik: { tr: "Arkadaşına gerçeği söyledin ve kararı ona bıraktın; {yer:tepe|e} döndü ama artık başka bir nedenle.", en: "You told your friend the truth and left the choice to them. They went back up to {yer:tepe}, but for a different reason now." }
            sonraki: "@akis"

  # ================================================================== TOHUM: KAÇAK AİLE
  - id: "yukselenler_kacak_aile"
    perde: [2, 3, 4]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["yukselenler", "ahlak", "gece"]
    gerilim: 3
    onemli: true
    kart: { tr: "Gece yarısı kapıdaki kül", en: "A gray thumbprint at midnight" }
    sahne: "kacak_1"
    sahneler:
      - id: "kacak_1"
        paragraflar:
          - { tr: "Gece yarısı kapın tıkırdıyor. Çalınmıyor, tıkırdıyor; korkan birinin parmak uçlarıyla. Eşikte bir adamla iki çocuk duruyor, üçünün de alnında gri bir başparmak izi var.", en: "At midnight there's a tapping at your door. Not knocking, tapping, with the fingertips of somebody scared. On the step stand a man and two kids, all three with gray thumbprints on their foreheads." }
          - { tr: "\"{yer:tepe|den} kaçtık,\" diyor adam. \"Bizim satırımız gelmişti. Peşimizde avcılar var, beyazlılar. Bir yer... bir gecelik. Yalnızca bir gece.\"", en: "\"We got off {yer:tepe},\" the man says. \"Our line came up. There are hunters after us. White robes. Somewhere... one night. Just one night.\"" }
          - metin: { tr: "Derken omzundaki beyaz kumaşı görüp geri çekiliyor, küçüğü arkasına itiyor. Sen de onlardansın.", en: "Then he sees the white cloth over your shoulder and pulls back, pushing the little one behind him. You're one of them." }
            kosul: { gorev: { zincir_yukselenler: "basla" } }
          - metin: { tr: "Sokağın başında fenerler beliriyor; üç, dört tane. Hiç acele etmiyorlar, etmelerine gerek de yok.", en: "Lanterns show up at the end of the street. Three, four. They're not hurrying. They don't have to." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Fenerlerin ardında bir Seçilmiş avcı var; seviyesi yakıtla şişirilmiş. Yanındakiler sıradan muhafızlar.", en: "Behind the lanterns, a Chosen hunter. Level: puffed up on fuel. The ones with him are ordinary guards." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ç̷ocukların alınlarındaki kül... hâlâ ıslak. bu akşam sürülmüş. bu gece yanacaklardı.", en: "t̷he ash on those kids' foreheads... it's still wet. somebody put it there tonight. they were going to burn tonight." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "İçeri al, kapıyı kapat", en: "Let them in. Shut the door" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { yukselenler: -4 }
            kronik: { tr: "{yer:tepe|den} kaçan bir aileyi gece yarısı evine aldın.", en: "At midnight you took in a family running from the hill." }
            sonraki: "kacak_kapi"
          - id: "teslim"
            etiket: { tr: "Fenerlere seslen: \"Buradalar.\"", en: "Call to the lanterns: \"They're here.\"" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: 4, insanlik: -4 }
              - itibar: { yukselenler: 8 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { vahit: { guven: 4 } }
            kronik: { tr: "Kapına sığınan aileyi {yer:tepe|in} avcılarına ele verdin.", en: "At midnight you handed the family that came to your door over to the hill's hunters." }
            sonraki: "kacak_teslim"
          - id: "benim"
            tur: "gosteris"
            etiket: { tr: "Avcılara yürü: \"Bunlar benim yakıtım.\"", en: "Walk out to the hunters: \"They're my fuel.\"" }
            gerekli: { stat: { cha: 60 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -2 }
              - dikkat: 2
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { saygi: 4 } }
            kronik: { tr: "Bir aileyi kendi yakıtın ilan ederek {yer:tepe|in} avcılarının elinden kurtardın.", en: "You saved a family from {yer:tepe}' hunters by claiming them as your own fuel." }
            sonraki: "kacak_benim"
          - id: "siginak"
            etiket: { tr: "Arka sokaktan Sığınak'a götür", en: "Take them to the Haven by the back alleys" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "vahit_mucize_sinavi", gecikme: { min: 8, max: 16 }, kosul: { npc_hayatta: "vahit", bayrak: "vahit_yakin_takip" } }
            kronik: { tr: "Gece karanlığında, arka sokaklardan geçirerek {yer:tepe|den} kaçan bir aileyi Sığınak'a ulaştırdın.", en: "You walked a family running from {yer:tepe} through the back alleys to the Haven in the middle of the night." }
            sonraki: "@akis"

      - id: "kacak_kapi"
        paragraflar:
          - { tr: "Fenerler kapının önünde duruyor. Nazik, neredeyse özür diler gibi bir ses: \"Kardeşim, Sistem'in malını içeride tutuyorsun.\"", en: "The lanterns stop outside your door. A voice, polite, almost apologetic: \"Friend, you're keeping the System's property in there.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kapıyı açıp dışarı çık", en: "Open the door and step out" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - savas: { dusmanlar: ["secilmis_avci@dunya", "yukselen_muhafiz@dunya"], kazan: "kacak_zafer", kaybet: "kacak_yenilgi" }
            kronik: { tr: "Kapına sığınan bir aile için {yer:tepe|in} avcılarıyla sokakta dövüştün.", en: "You fought {yer:tepe}' hunters in the street for a family that came to your door." }
          - id: "sus"
            etiket: { tr: "Sus; ışıkları söndür ve bekle", en: "Stay quiet. Kill the lights. Wait" }
            zar: { stat: "agi", zorluk: 28, tek: true, basarisiz: "kacak_bulundu", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Bir aileyle birlikte karanlıkta nefesini tutup fenerlerin geçip gitmesini bekledin.", en: "You held your breath in the dark with a family, waiting for the lanterns to pass." }
            sonraki: "@akis"

      - id: "kacak_bulundu"
        paragraflar:
          - { tr: "Küçük çocuk hapşırıyor. Kapı menteşelerinden fırlıyor, fenerlerin ışığı odaya doluyor.", en: "The little one sneezes. The door flies off its hinges and lantern light floods the room." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ailenin önüne geç", en: "Get in front of the family" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - savas: { dusmanlar: ["secilmis_avci@dunya", "yukselen_muhafiz@dunya"], kazan: "kacak_zafer", kaybet: "kacak_yenilgi" }
            kronik: { tr: "Kapın kırıldığında sakladığın ailenin önüne geçtin.", en: "When they broke your door down, you stepped in front of the family you'd hidden." }

      - id: "kacak_zafer"
        paragraflar:
          - { tr: "Fenerler sokağın taşlarında yanıp duruyor; onları taşıyanlarsa yerde. Adam çocuklarına sarılmış, başını kaldırmaya korkuyor.", en: "The lanterns keep burning on the street stones. The ones who carried them are on the ground. The man is holding his kids and is too scared to lift his head." }
          - { tr: "Sabah onları kendi elinle bir yere götürüyorsun. Yolda çocuklardan biri önce kendi alnındaki külü siliyor, sonra kardeşininkini.", en: "In the morning you take them somewhere yourself. On the way one of the kids wipes the ash off his own forehead, then his brother's." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onları güvenli bir yere bırak", en: "Drop them somewhere safe" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { yukselenler: -4, siginak: 2 }
            kronik: { tr: "{yer:tepe|in} avcılarını yere serdin, sabah da bir aileyi güvenli bir yere bıraktın.", en: "You put {yer:tepe}' hunters on the ground and dropped a family somewhere safe in the morning." }
            sonraki: "@akis"
          - id: "ordu"
            etiket: { tr: "Adama sor: \"Benim için savaşır mısın?\"", en: "Ask the man: \"Would you fight for me?\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - ordu: { lonca_avcisi: 1 }
            kronik: { tr: "Kurtardığın adamı kendi saflarına aldın.", en: "You took the man you saved into your own ranks." }
            sonraki: "@akis"

      - id: "kacak_yenilgi"
        paragraflar:
          - { tr: "Seçilmiş avcının kılıcı seni duvara yapıştırıyor. Fenerler aileyi alıp götürürken küçük çocuk dönüp sana bakıyor; sesi bile çıkmıyor.", en: "The Chosen hunter's blade pins you to the wall. As the lanterns carry the family off, the little kid looks back at you. He doesn't even scream." }
        secenekler:
          - id: "pesinden"
            etiket: { tr: "Kalk ve peşlerinden git", en: "Get up and go after them" }
            etkiler:
              - can: -10
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: -1 }
            kronik: { tr: "Kapına sığınan aileyi koruyamadın; yokuşun dibine kadar peşlerinden gittin.", en: "You couldn't protect the family that came to your door, and you followed them all the way to the foot of the hill." }
            sonraki: "@akis"
          - id: "otur"
            etiket: { tr: "Duvarın dibinde otur", en: "Sit down against the wall" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - degisken: { hayatta_kalan: -1 }
            kronik: { tr: "Aile götürülürken duvarın dibine çöküp oturdun.", en: "You sat against the wall while the family that came to your door was taken away." }
            sonraki: "@akis"

      - id: "kacak_teslim"
        paragraflar:
          - { tr: "Fenerler geliyor. Adam direnmiyor, yalnızca elleriyle küçüğün gözlerini kapatıyor. Avcı kibarca başıyla seni selamlıyor: \"Sistem teşekkür eder.\"", en: "The lanterns come. The man doesn't fight. He just covers the little one's eyes with his hands. The hunter nods politely at you: \"The System thanks you.\"" }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Kapını kapat", en: "Close your door" }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Bir aileyi teslim edip kapını kapattın.", en: "You handed a family over and closed your door." }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Fenerler gözden kaybolana kadar izle", en: "Watch until the lanterns are out of sight" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: -1 }
            kronik: { tr: "Teslim ettiğin ailenin fenerlerini gözden kaybolana kadar izledin.", en: "You watched the lanterns of the family you handed over until they were out of sight." }
            sonraki: "@akis"

      - id: "kacak_benim"
        paragraflar:
          - { tr: "Fenerlerin önüne çıkıyorsun. \"Bunlar benim yakıtım,\" diyorsun. \"Ne zaman yanacaklarına ben karar veririm.\"", en: "You step out in front of the lanterns. \"They're my fuel,\" you say. \"I'll say when they burn.\"" }
          - { tr: "Avcı bir an duraksadıktan sonra başını eğip geri çekiliyor. Kurtardığın adam sana bir kurtarıcıya değil, yeni sahibine bakar gibi bakıyor.", en: "The hunter hesitates, then bows and backs off. The man you just saved doesn't look at you like a rescuer. He looks at you like a new owner." }
        secenekler:
          - id: "ozgur"
            etiket: { tr: "\"Gidin. Kimsenin yakıtı değilsiniz.\"", en: "\"Go. You're nobody's fuel.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Bir aileyi yakıtın diyerek kurtardın, sonra kimsenin yakıtı olmadıklarını söyleyip salıverdin.", en: "You saved a family by calling them your fuel, then let them go and told them they were nobody's." }
            sonraki: "@akis"
          - id: "tut"
            etiket: { tr: "Bırak öyle sansınlar; daha güvenli", en: "Let them think it. It's safer" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
            kronik: { tr: "Kurtardığın ailenin seni sahipleri sanmasına izin verdin.", en: "You let the family you saved believe you owned them." }
            sonraki: "@akis"

  # ================================================================== TOHUM: ON ÜÇ'ÜN SEÇİMİ
  - id: "on_ucuncu_secim"
    perde: [3, 4]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["yukselenler", "ahlak"]
    gerilim: 2
    onemli: true
    kart: { tr: "On üçüncü satır", en: "Line thirteen" }
    sahne: "onuc_1"
    sahneler:
      - id: "onuc_1"
        paragraflar:
          - { tr: "On Üç seni şehrin kıyısında, denize bakan bir duvarın üstünde buluyor. Beyaz cübbesi kir içinde, ayakları çıplak; elinde Öğretici'deki o ilk listenin buruş buruş bir kopyası var.", en: "Thirteen finds you at the edge of the city, on a wall looking out at the sea. His white robe is filthy, his feet are bare, and in his hand is a crumpled copy of that very first list from the Tutorial." }
          - { tr: "\"Sıra bende,\" diyor. \"Mevsimin son yakıtıyım. Peygamber beni bunun için saklamış; on üçüncü satır en sona kalsın diye.\" Sesinde en ufak bir titreme yok. \"Kaçmalı mıyım, bilmiyorum. Hayatımda ilk kez birine bir şey soruyorum.\"", en: "\"I'm next,\" he says. \"The last fuel of the season. The Prophet saved me for it, so line thirteen could wait till the end.\" His voice doesn't shake. \"I don't know if I should run. It's the first time in my life I've asked anybody.\"" }
          - metin: { tr: "\"Bir zamanlar adımı yakmıştın,\" diye ekliyor. \"Belki o gün haklıydın.\"", en: "\"You burned my name once,\" he adds. \"Maybe you were right back then.\"" }
            kosul: { bayrak: "yakit_listesi_yakildi" }
          - metin: { tr: "\"Adımı kırmızıyla çizmiştin,\" diye ekliyor. \"Peygamber sonra yeniden yazdı; bu sefer mürekkeple.\"", en: "\"You struck my name in red,\" he adds. \"The Prophet wrote it back in later. In ink, this time.\"" }
            kosul: { bayrak: "on_ucuncu_cizildi" }
        sezgiler:
          - kosul: { stat: { wis: 100 } }
            metin: { tr: "Ölmek istemiyor ama yaşamak için birinin ona izin vermesi gerektiğine inanıyor. O iznin de sende olduğuna.", en: "He doesn't want to die. But he believes someone has to give him permission to live. And he believes that someone is you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷na ne istediğini sor. kimse sormadı. bana da kimse sormadı. o yüzden biliyorum.", en: "a̷sk him what he wants. nobody ever asked. nobody ever asked me either. that's how i know." }
        secenekler:
          - id: "yaninda"
            etiket: { tr: "\"Yanımda kal. Kimse seni yakamaz.\"", en: "\"Stay with me. Nobody gets to burn you.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2, insanlik: -1 }
              - bayrak: "on_ucuncu_yaninda"
              - iliski: { vahit: { guven: -4 } }
            kronik: { tr: "On Üç'ü {yer:tepe|in} ateşinden çekip yanında tuttun; sana bir tanrıya bakar gibi baktı.", en: "You took Thirteen out of the hill's fire and kept him by your side. He looked at you like a god." }
            sonraki: "onuc_yaninda"
          - id: "kac"
            etiket: { tr: "\"Kaç. Yolu ben açarım.\"", en: "\"Run. I'll clear the road.\"" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - bayrak: "on_ucuncu_kacti"
              - degisken: { hayatta_kalan: 1 }
              - itibar: { yukselenler: -4 }
              - iliski: { vahit: { guven: -4 } }
              - tohum: { olay: "yukselenler_kacak_aile", gecikme: { min: 6, max: 12 } }
            kronik: { tr: "On Üç'e kaçmasını söyledin ve yolu ona sen açtın.", en: "You told Thirteen to run, and you cleared the road for him." }
            sonraki: "@akis"
          - id: "yan"
            etiket: { tr: "\"İnandığın buysa, git.\"", en: "\"If that's what you believe, go.\"" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4, duzen: 2 }
              - bayrak: "on_ucuncu_yandi"
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { baglilik: 4 } }
            kronik: { tr: "Sana ilk kez bir şey soran On Üç'ü inancıyla baş başa bıraktın; mevsimin son yakıtı oldu.", en: "The first time Thirteen ever asked anybody anything, you left him alone with his faith. He became the last fuel of the season." }
            sonraki: "@akis"
          - id: "adi"
            tur: "gosteris"
            etiket: { tr: "Ona gerçek adını geri ver", en: "Give him back his real name" }
            gerekli: { stat: { cha: 120 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 6 }
              - bayrak: "on_ucuncu_kacti"
              - bayrak: "on_ucuncu_adini_aldi"
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { saygi: 4, guven: -6 } }
            kronik: { tr: "On Üç'e listeden önceki adını hatırlattın; {yer:tepe|in} ona taktığı numarayı denizin kıyısında bırakıp adını yüksek sesle söyledi.", en: "You reminded Thirteen of the name he had before the list. He said it out loud to the sea and left the hill's number behind." }
            sonraki: "onuc_adi"

      - id: "onuc_yaninda"
        paragraflar:
          - { tr: "On Üç tek söz etmiyor. Cübbesinin eteğinden bir şerit yırtıp bileğine bağlıyor: beyaz, senin rengin.", en: "Thirteen doesn't say anything. He tears a strip off the hem of his robe and ties it around his wrist. White. Your color." }
          - { tr: "\"Artık senin listendeyim,\" diyor. Bunun iyiye mi kötüye mi işaret olduğunu ikiniz de bilmiyorsunuz.", en: "\"I'm on your list now,\" he says. Neither of you knows if that's good or bad." }
        secenekler:
          - id: "liste_yok"
            etiket: { tr: "\"Benim listem yok.\"", en: "\"I don't have a list.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
            kronik: { tr: "On Üç'e listen olmadığını söyledin; inanmadı ama gülümsedi.", en: "You told Thirteen you didn't have a list. He didn't believe you, but he smiled." }
            sonraki: "@akis"
          - id: "basta"
            etiket: { tr: "\"O zaman en baştasın.\"", en: "\"Then you're at the top of it.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 2 }
            kronik: { tr: "Listende en başta olduğunu söylediğinde bunun ne anlama geldiğini ne On Üç biliyordu ne sen.", en: "You told Thirteen he was at the top of your list. Neither of you knew what that meant." }
            sonraki: "@akis"

      - id: "onuc_adi"
        paragraflar:
          - { tr: "Konuştukça sesin onun kafasının içine, listeden öncesine uzanıyor: bir annenin seslendiği, sınıf yoklamasında okunan, doğum günü pastasına yazılan bir isme.", en: "You talk, and your voice reaches into his head, back to before the list: to a name a mother called, a name read off a class roster, a name written on a birthday cake." }
          - { tr: "On Üç gözlerini kırpıştırıyor. Sonra adını, kendi adını yüksek sesle söylüyor; sana değil, denize. Buruşuk listeyi de rüzgâra bırakıyor.", en: "Thirteen blinks. Then he says his name, his own name, out loud. Not to you. To the sea. And he lets the crumpled list go on the wind." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kâğıdın denize düşüşünü izle", en: "Watch the paper fall into the sea" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Yanında bir adam kendi adını söylerken bir listenin denize düşüşünü izledin.", en: "You watched a list fall into the sea while a man next to you said his own name." }
            sonraki: "@akis"
          - id: "tekrar"
            etiket: { tr: "Adını sen de tekrar et", en: "Say his name back to him" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
            kronik: { tr: "Listeden kurtulan adamın gerçek adını yüksek sesle tekrarladın.", en: "You said the real name of the man who got free of the list out loud." }
            sonraki: "@akis"

