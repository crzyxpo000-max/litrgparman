# Parti B1 — Sığınak Konseyi zinciri (zincir_siginak) + Elif Sarı'nın yayı (docs/PERDE2_4.md §4 "Parti B1").
#
# Zincir (ana yay mekanizmasıyla: önceki düğümün bayrağı ve görev "basla" iken, verilen günden itibaren ilk fırsatta gelir):
#   siginak_1_konsey        (P2, AY 66)  — Konsey'in ilk işi: mendirekteki yuva. Görev başlar.
#   siginak_2_su_savaslari  (P2, AY 122) — Pınarbaşı, sarnıç, Tuzla mavnası: su kimin?
#   siginak_3_tahliye       (P3, AY 205) — Kadim örnekleme sütunu; Kordon ve Eski Şehir boşaltılır.
#   siginak_4_son_siginak   (P3, AY 268) — Kuru havuzda Son Sığınak; duvardaki çentikler (önceki döngü ipucu).
#   siginak_5_kalkan_yemini (P4, AY 339) — Kalkan Yemini ve Kadim öncüsü. Görev tamam (Koruyucu sonu için).
# Elif yayı: elif_konsey_oylamasi (P2) · elif_gece_nobeti (P2–3; elif_ask) · elif_lonca_darbesi (P3; Elif ölebilir) ·
#   elif_baris_masasi (P4, AY 333; elif_baskan, insan_ittifaki) · elif_son_gece (P4, tohum; istila arifesi).
# Ara karakterler (NPC dosyası yok, adları yerelleştirilmiş takma adlardır): Rıza Reis / Skipper Reese (eski vapur kaptanı,
#   Konsey'in en eski üyesi), Nurhan / Nora (başhemşire), Pala / Cleaver (Lonca'nın tahsildarı, darbenin eli),
#   ihtiyar hâkim / the old judge (Konsey başkanı; konsey oylamasında ölür).
# Değişken lonca_golgesi: Lonca'nın Liman üstündeki gölgesi (oyuncunun Lonca'ya verdiği tavizler); darbe sahnelerini renklendirir.
olaylar:
  # ================================================================== SIĞINAK 1 — KONSEY (P2, AY 66)
  - id: "siginak_1_konsey"
    konum: ["kiyikent_liman"]
    perde: [2]
    gun: { min: 50, max: 110 }
    ana_yay: { gun: 66 }
    agirlik: 1
    etiketler: ["siginak", "zincir", "konsey", "npc"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Konsey'den bir bilet", en: "A ticket from the Council" }
    sahne: "siginak_1_konsey_1"
    sahneler:
      - id: "siginak_1_konsey_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sabah kapına on yaşlarında bir çocuk dikiliyor; boynunda düdük, elinde katlanmış eski bir vapur bileti. Biletin arkasına mavi tükenmezle tek bir sözcük yazılmış, üstüne de lastik mühür basılmış: KONSEY.", en: "In the morning a kid of maybe ten turns up at your door with a whistle around his neck and an old folded ferry ticket in his hand. On the back, in blue ballpoint, there's one word with a rubber stamp over it: COUNCIL." }
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonu hâlâ bekleme salonu kokuyor: tuz, demli çay, ıslak karton. Plastik koltuk sıraları tıklım tıklım. Konsey yedi bilet gişesinin camları ardına dağılmış, her gişede bir üye; az sonra sana sefer bileti kesecekler sanki.", en: "The {yer:kiyikent_iskele} waiting hall still smells like a waiting hall: salt air, burnt coffee, wet cardboard. The rows of plastic seats are packed, and the Council sits behind the glass of seven ticket windows, one member to a booth, like they're about to sell you passage somewhere." }
          - { tr: "Kalkış panosunun harflerini artık biri elle çeviriyor. Bugün panoda şu yazıyor: NÜFUS 9.412 · SU 3 GÜN · BALIK YOK · DÜN ÖLEN 6.", en: "Somebody flips the letters on the departures board by hand now. Today it reads: POPULATION 9,412 · WATER 3 DAYS · FISH NONE · DEAD YESTERDAY 6." }
          - { tr: "Dördüncü gişede {npc:elif_sari} oturuyor; önlüğü temiz, ama manşetlerindeki kan lekeleri hiçbir yıkamada çıkmamış. Birinci gişede, otuz yıl ada vapurunun dümenini tutmuş kaptan şapkalı Rıza Reis mikrofona eğilince gişe hoparlörü cızırdıyor: \"Mendireğin dibine bir şey yuva yaptı. İki tekne gitti, altı adam. Balık olmazsa dokuz gün sonra ekmek de olmaz.\"", en: "{npc:elif_sari} is in window four, her coat clean, the bloodstains on the cuffs long past coming out. In window one, an old man in a captain's cap leans into the booth mic, and the speaker crackles. Skipper Reese ran the island ferry for thirty years. \"Something's nesting under the breakwater. Two boats gone, six men. No fish, and in nine days there's no bread either.\"" }
          - metin: { tr: "Seninle birlikte içeri giren {npc:elif_sari}, çantasını omzundan indirmeden dördüncü gişeye geçip oturuyor. \"Yolda seninleyim, salıları buradayım,\" diyor camın ardından. \"Bugün de salı.\"", en: "{npc:elif_sari} walked in with you, and she slides into window four without taking the bag off her shoulder. \"On the road I'm with you. Tuesdays I'm here,\" she says through the glass. \"It's Tuesday.\"" }
            kosul: { yoldas: "elif_sari" }
          - { tr: "\"{fraksiyon:lonca} yuvayı temizlemeyi teklif etti,\" diyor Rıza Reis. \"Bundan sonra çıkan her avın üçte biri karşılığında. Ebediyen.\" {npc:elif_sari} mikrofonu kendine çekiyor: \"Sana verecek paramız yok. Bir yatak, bir tabak yemek, bir de bu salonda bir oy. Elimizdeki bu kadar.\"", en: "\"The {fraksiyon:lonca} offered to clear it,\" Skipper Reese says. \"For a third of every catch from here on out. Forever.\" {npc:elif_sari} pulls the mic her way. \"We can't pay you. A bed, a plate, and a vote in this room. That's what we've got.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[BÖLGE TARAMASI · {yer:kiyikent_liman}]", en: "[ZONE SCAN · The Waterfront]" }
            satirlar:
              - { tr: "Nüfus: 9.412. Ortalama seviye: düşük.", en: "Population: 9,412. Average level: low." }
              - { tr: "Bölgedeki en yüksek seviye: sen. Fark: anlamlı bir sayıyla ifade edilemiyor.", en: "Highest level in zone: you. Margin: cannot be expressed as a meaningful number." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Panoda DÜN ÖLEN 6 yazıyor, oysa sayı 9. Harfleri çeviren el üçünü bilerek atlamış.", en: "DEAD YESTERDAY isn't 6. It's 9. Whoever flipped the letters skipped three on purpose." }
          - kosul: { stat: { wis: 45 } }
            metin: { tr: "Rıza Reis'in ceket cebinden katlanmış bir Lonca sözleşmesinin köşesi görünüyor. Altı imzalanmış, mürekkep çoktan kurumuş.", en: "A folded Guild contract is poking out of Skipper Reese's coat pocket. There's a signature on it, and the ink's already dry." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷okuz bin dört yüz on iki. hepsi sana bakıp aynı şeyi görüyor: bir duvar. duvarlar eninde sonunda çatlar, bilirsin.", en: "n̷ine thousand four hundred twelve. every one of them is looking at you and seeing the same thing: a wall. walls crack eventually. you know that." }
          - kosul: { bayrak: "uye_lonca" }
            anlati: true
            metin: { tr: "Arka sıralarda birkaç kişi kolundaki Lonca bandını gösterip fısıldaşıyor. Rıza Reis görüyor ama sesini çıkarmıyor.", en: "In the back rows, a few people are looking at the Guild band on your arm and whispering. Skipper Reese sees it and says nothing." }
          - kosul: { bayrak: "uye_siginak" }
            anlati: true
            metin: { tr: "Artık buralısın, yine de sana bilet göndermişler. Konsey her işi usulüyle yapar; kıyamet kopsa bile.", en: "You're one of theirs now, and they still sent you a ticket. The Council does everything by the book, even at the end of the world." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dokuz bin kişi, bir mendirek. Yaparız bunu. Değil mi? Yaparız.\"", en: "\"Nine thousand people and one breakwater. We can do this. Right? We can do this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kalkış panosunu elle çeviriyorlar. Ya çok romantik bir şey bu ya da berbat bir veri yönetimi.\"", en: "\"They're flipping the departures board by hand. That's either very romantic or very bad data management.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Mendireği temizlerim. Karşılık istemem.\"", en: "\"I'll clear the breakwater. No charge.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Konsey'in ilk işini karşılıksız üstlendin; {yer:kiyikent_liman|in} verebileceği bir yatak, bir tabak yemek ve bir oy sana yetti.", en: "You took the Council's first job for free. A bed, a plate, and a vote were all {yer:kiyikent_liman} could give you, and that was enough." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "sart"
            etiket: { tr: "\"{yer:kordon|den} gelenler de içeri alınırsa olur.\"", en: "\"Only if {yer:kordon} people get let in.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "konsey_kalkan_sart"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { merhamet: 6, duzen: -2 }
              - iliski: { elif_sari: { guven: 6, baglilik: 3 } }
            kronik: { tr: "Kalkan olmayı bir şarta bağladın: {yer:kiyikent_liman|in} kapıları kayıtsızlara da açılmalıydı.", en: "You made being their shield conditional: {yer:kiyikent_liman|pos} gates had to open to the unregistered, too." }
            sonraki: "siginak_1_konsey_sart"
          - id: "bedel"
            etiket: { tr: "\"Avın beşte biri ve Konsey'de bir sandalye.\"", en: "\"A fifth of the catch and a seat on the Council.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "oyuncu_konsey_payi"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3, merhamet: -3 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: -2, guven: -2 } }
            kronik: { tr: "Kalkanlığına bir fiyat biçtin: avın beşte biri ve Konsey'de bir sandalye.", en: "You put a price on being their shield: a fifth of the catch and a seat on the Council." }
            sonraki: "siginak_1_konsey_bedel"
          - id: "pano"
            tur: "gosteris"
            etiket: { tr: "Panoyu düzelt: dün ölenler altı değil, dokuz", en: "Fix the board: it's nine dead, not six" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bolge: "kiyikent_liman"
              - dikkat: 2
              - ahlak: { duzen: 2, insanlik: 3 }
              - iliski: { elif_sari: { saygi: 5 } }
            kronik: { tr: "Panodaki yalanı herkesin gözü önünde düzelttin: dün ölenler altı değil, dokuzdu.", en: "You fixed the lie on the Council's board in front of everyone: nine dead yesterday, not six." }
            sonraki: "siginak_1_konsey_pano"
          - id: "sozlesme"
            etiket: { tr: "Rıza Reis'e cebindeki sözleşmeyi sor", en: "Ask Skipper Reese about the contract in his pocket" }
            gerekli: { stat: { wis: 45 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Rıza Reis'in cebindeki Lonca sözleşmesini salonun ortasına çıkardın.", en: "You pulled the Guild contract out of Skipper Reese's pocket in front of the whole hall." }
            sonraki: "siginak_1_konsey_sozlesme"
          - id: "red"
            etiket: { tr: "\"Konsey'in derdi benim derdim değil.\"", en: "\"The Council's problems aren't my problems.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "siginak_1_red"
              - ahlak: { merhamet: -3, insanlik: -2 }
              - itibar: { siginak: -5 }
              - iliski: { elif_sari: { saygi: -3, baglilik: -2 } }
              - degisken: { lonca_golgesi: 2 }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 10, max: 20 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Konsey'in biletini geri çevirdin; mendirek de her avın üçte biri de Lonca'ya kaldı.", en: "You turned down the Council's ticket. The breakwater went to the Guild, along with a third of every catch." }
            sonraki: "siginak_1_konsey_red"

      - id: "siginak_1_konsey_sart"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} gişeden çıkıp salonun ortasına tekerlekli bir beyaz tahta itiyor. Kenarları çatlak, tekerleklerinden biri gıcırdıyor; tepesinde yemek katı günlerinden kalma, solmuş kalemle yazılmış KONSEY sözcüğü hâlâ okunuyor.", en: "{npc:elif_sari} comes out of her booth and wheels a whiteboard into the middle of the hall. The edges are cracked and one caster squeals, and across the top, in faded marker from the food court days, it still says COUNCIL." }
          - { tr: "Oylama üçe üç bitiyor. Konsey'in başkanı, yedinci gişedeki ihtiyar hâkim gözlüğünü çıkarıp gözlerini ovuşturuyor. \"Dokuz bin kişiyiz,\" diyor Rıza Reis. \"Sen üstüne iki bin ağız daha getiriyorsun.\"", en: "The vote comes out three to three. The old judge in window seven, the Council's chair, takes off her glasses and rubs her eyes. \"We're nine thousand people,\" Skipper Reese says. \"You want to add two thousand more mouths.\"" }
          - { tr: "Hâkim sana bakıyor. \"Beni inandır, evladım,\" diyor, \"oyumu vereyim.\"", en: "The judge looks at you. \"Make me believe it, dear,\" she says, \"and you'll have my vote.\"" }
        sezgiler:
          - kosul: { stat: { cha: 45 } }
            metin: { tr: "Hâkim kararını çoktan vermiş. Gerekçe aradığı yok; salonun duyacağı bir söz istiyor.", en: "The judge has already decided. She doesn't want a reason. She wants something the room can hear." }
          - kosul: { bayrak: "kordon_dustu" }
            anlati: true
            metin: { tr: "{yer:kordon} düştüğünden beri oradan kaçanlar {yer:kiyikent_liman|in} tel örgüsünün dışındaki eski otoparkta, çadırlarda yaşıyor. Geceleri öksürükleri ta buradan duyuluyor.", en: "Ever since {yer:kordon} fell, the people who ran from it have been living in tents in the old parking lot outside {yer:kiyikent_liman|pos} fence. At night you can hear them coughing from in here." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben de bir zamanlar o çadırlardan birindeydim. Yani... öyle bir yerde. Aç kapıyı.\"", en: "\"I used to be in one of those tents. Well... somewhere like it. Open the gate.\"" }
        secenekler:
          - id: "balik"
            etiket: { tr: "\"Onları besleyecek balığı da ben getiririm.\"", en: "\"I'll bring back the fish to feed them, too.\"" }
            etkiler:
              - bayrak: "kordon_kapisi_acildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "{yer:kordon|den} gelen iki bin kayıtsız için {yer:kiyikent_liman|in} kapısını açtırdın; onları besleyecek balığı getirmeyi de üstlendin.", en: "You got {yer:kiyikent_liman|pos} gate opened for two thousand unregistered people from {yer:kordon}, and took it on yourself to bring the fish to feed them." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni göster: \"Benimle pazarlık etmeyin.\"", en: "Show your real level: \"Don't haggle with me.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - bayrak: "kordon_kapisi_acildi"
              - ahlak: { duzen: 3, merhamet: 2, insanlik: -2 }
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { korku: 4, saygi: 2 } }
            kronik: { tr: "Kapıları oyla değil, seviyenle açtırdın; Konsey o gün seninle pazarlık edilmeyeceğini gördü.", en: "You opened the gates with your level, not a vote. That day the Council saw you weren't someone to haggle with." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "uzlasma"
            etiket: { tr: "\"Yalnızca çocuklar ve hastalar girsin.\"", en: "\"Just the kids and the sick, then.\"" }
            etkiler:
              - bayrak: "kordon_kapisi_aralandi"
              - ahlak: { merhamet: 2, duzen: 3 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { elif_sari: { saygi: 2 } }
            kronik: { tr: "Kapıyı yalnızca çocuklara ve hastalara araladın; yetişkinler tel örgünün öbür yanında kaldı.", en: "You cracked the gate for the kids and the sick. The grown-ups stayed on the other side of the fence." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_bedel"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis ilk kez gülümsüyor; ağzındaki dişlerin yarısı eksik. \"Nihayet tüccar gibi konuşan biri çıktı,\" diyor. \"Beşte bir. Lonca'nın üçte birinden ucuz.\"", en: "Skipper Reese smiles for the first time. He's missing half his teeth. \"Finally, somebody who talks like a businessman,\" he says. \"A fifth. Cheaper than the Guild's third.\"" }
          - { tr: "{npc:elif_sari} adını tahtaya, KONSEY başlığının altına, ötekilerden biraz daha küçük harflerle yazıyor. \"Tamam,\" diyor, sesine hiçbir şey katmadan. \"Artık balıkla ödüyoruz.\"", en: "{npc:elif_sari} writes your name on the whiteboard under COUNCIL, a little smaller than the others. \"Fine,\" she says, like there's nothing in her voice at all. \"We pay in fish now.\"" }
        secenekler:
          - id: "bagis"
            etiket: { tr: "\"Payım hastaneye gitsin.\"", en: "\"My cut goes to the hospital.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Konsey'deki sandalyeyi aldın ama payını Gümrük'teki koğuşa bağışladın: kalkanın payı hastaların tabağına gidecekti.", en: "You took the seat but signed your cut over to the ward in the Customs House. The shield's share would go to the patients." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "pazarlik"
            etiket: { tr: "\"Pazarlık pazarlıktır.\"", en: "\"A deal's a deal.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - oz_kristali: 6
              - iliski: { elif_sari: { guven: -2 } }
            kronik: { tr: "Pazarlığın pazarlık olduğunu söyleyip payının tamamını aldın; Konsey'in kalkanı artık bir ortaktı.", en: "You said a deal's a deal and took your full cut. The Council's shield was a partner now." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_pano"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Panoya yürüyüp üç harfi çeviriyorsun; tak, tak, tak: DÜN ÖLEN 9. Salona öyle bir sessizlik çöküyor ki dışarıdan bir martının çığlığı duyuluyor.", en: "You walk up to the board and flip three letters. Clack, clack, clack: DEAD YESTERDAY 9. The hall goes so quiet you can hear a gull outside." }
          - { tr: "\"Ben yaptım,\" diyor sonunda Rıza Reis; gözü mikrofonda değil, camda. \"Panik insanı balıksızlıktan çabuk öldürür.\"", en: "\"I did it,\" Skipper Reese finally says, not into the mic, but at the glass. \"Panic kills faster than an empty net.\"" }
          - { tr: "{npc:elif_sari} gişesinde ayağa kalkıyor. \"Bundan sonra pano doğruyu yazacak,\" diyor. \"Paniğe kapılacaklarsa bilerek kapılsınlar.\"", en: "{npc:elif_sari} stands up in her booth. \"From now on, the board tells the truth,\" she says. \"If they're going to panic, they can panic knowing.\"" }
        secenekler:
          - id: "dogru"
            etiket: { tr: "\"Doğruyu yazın. Mendireği ben hallederim.\"", en: "\"Write the truth. I'll handle the breakwater.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "pano_dogru"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
            kronik: { tr: "Panoya doğruyu yazdırdın; bundan sonra insanlar paniğe kapılacaksa bilerek kapılacaktı.", en: "You had the truth put up on the board. From then on, if people panicked, they'd panic knowing." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "reis"
            etiket: { tr: "\"Reis haklı; panik kimseye yaramaz.\"", en: "\"The Skipper's right. Panic helps nobody.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: -3, saygi: 2 } }
            kronik: { tr: "Yalanı düzelttin, sonra geri yazdırdın; pano bir süre daha sakin rakamlar gösterdi.", en: "You fixed the lie, then let them put it back. The board kept showing calm numbers for a while longer." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_sozlesme"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis'in yüzünün rengi atıyor. Katlanmış kâğıdı cebinden çıkarıp camın altındaki para gözünden içeri itiyor: bir Lonca sözleşmesi. Altında iki imza var; biri kendisinin, öbürü {fraksiyon:lonca|in} tahsildarı Pala'nın.", en: "The color drains out of Skipper Reese's face. He pulls the folded paper out of his pocket and slides it through the cash slot under the glass: a Guild contract. Two signatures at the bottom. One's his. The other belongs to the {fraksiyon:lonca|pos} collector, the man they call Cleaver." }
          - { tr: "\"Hayır dersin diye imzaladım,\" diyor. \"Yaşlıyım ama aptal değilim.\" {npc:elif_sari} önce kâğıda, sonra Reis'e bakıyor; onu ilk kez görüyormuş gibi.", en: "\"Signed it in case you said no,\" he says. \"I'm old, not stupid.\" {npc:elif_sari} looks at the paper, then at the Skipper, like she's seeing him for the first time." }
        secenekler:
          - id: "yirt"
            etiket: { tr: "\"Yırtın onu. Mendirek benim işim.\"", en: "\"Tear it up. The breakwater's my job.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "lonca_sozlesmesi_yirtildi"
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 5, lonca: -3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Lonca'nın mendirek sözleşmesini yırttırdın; Pala o kâğıdın parçalarını cebinde taşıdı.", en: "You had the Guild's breakwater contract torn up. Cleaver carried the pieces around in his pocket after that." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "sakla"
            etiket: { tr: "\"Saklayın. Bir gün lazım olur.\"", en: "\"Hang onto it. You might need it someday.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - degisken: { lonca_golgesi: 1 }
              - ahlak: { duzen: 3 }
              - iliski: { elif_sari: { saygi: 2, guven: -1 } }
            kronik: { tr: "Lonca sözleşmesini çekmecede saklattın; Konsey'in elinde artık yedek bir efendi vardı.", en: "You had the Guild contract kept in a drawer. Now the Council had a spare master on file." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "anlat"
            etiket: { tr: "\"Bunu Konsey'e sen anlat, Reis.\"", en: "\"You explain this to the Council, Skipper.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { duzen: 4, insanlik: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Rıza Reis'e kendi imzasının hesabını Konsey'in önünde verdirdin.", en: "You made Skipper Reese answer for his own signature in front of the Council." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_red"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis cebinden bir kâğıt çıkarıp kalem istiyor, hiç acele etmeden imzalıyor. \"Lonca'ya haber verin,\" diyor yanındaki çocuğa. Çocuk düdüğünü ağzına alıp koşa koşa çıkıyor.", en: "Skipper Reese takes a paper out of his pocket, asks for a pen, and signs it without any hurry at all. \"Tell the Guild,\" he says to the kid beside him. The kid puts his whistle in his mouth and runs." }
          - { tr: "{npc:elif_sari} kapıda önünü kesiyor. \"Yalvaracak değilim,\" diyor. \"Ama teklif tahtada duruyor. Silmeyeceğim.\"", en: "{npc:elif_sari} catches you at the door. \"I'm not going to beg,\" she says. \"But the offer stays on the board. I'm not erasing it.\"" }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Omuz silk ve yürü", en: "Shrug and walk out" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - iliski: { elif_sari: { baglilik: -2 } }
            kronik: { tr: "{yer:kiyikent_iskele|den} omuz silkerek çıktın; Konsey adını tahtada bekletti.", en: "You shrugged your way out of the {yer:kiyikent_iskele}. The Council left your name waiting on the board." }
            sonraki: "@akis"
          - id: "belki"
            etiket: { tr: "\"Silme. Belki dönerim.\"", en: "\"Don't erase it. Maybe I'll be back.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Konsey'e kapıyı aralık bıraktın; hekim de tahtadaki adını silmedi.", en: "You left the Council's door open a crack. The doctor left your name on the board." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_mendirek"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşamüstü mendireğin ucuna varıyorsun. Dalgakıran bloklarını beyaz bir kabuk sarmış; aralarına kapkara yumurta keseleri sıra sıra dizilmiş, nabız gibi atıyor. Yeşil fener sönük.", en: "Late afternoon finds you at the end of the breakwater. The concrete tetrapods are crusted over with something white, and wedged between them, rows of jet-black egg sacs pulse like heartbeats. The green harbor light is dark." }
          - { tr: "Kayalıklara ikiye bölünmüş bir tekne pruvası vurmuş, adı hâlâ okunuyor: NAZLI ANA. Arkanda zıpkın tüfeklerinden bozma mızraklarıyla bir avuç balıkçı bekliyor. Hiçbiri sana bakmıyor; gözleri suda.", en: "The split bow of a fishing boat sits on the rocks, the name still legible: MISS MAGGIE II. Behind you, a handful of fishermen wait with spears hacked out of old speargun parts. None of them is looking at you. They're all looking at the water." }
          - { tr: "Fenerin dibinde, suyun altında iri bir şey nefes alıp veriyor. Dalgalar onun soluğuna uyup gelip gidiyor.", en: "At the foot of the light, under the water, something big is breathing. The waves come in and go out to its rhythm." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Mendirek Anası · Kuluçka evresi", en: "[ANALYSIS] Jetty Mother · Brooding" }
            satirlar:
              - { tr: "Yumurta sayısı: 340. Çıkış: bir sonraki met.", en: "Egg count: 340. Hatching: next high tide." }
              - { tr: "Tavsiye: met gelmeden.", en: "Recommendation: before the tide." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Ana uyuyor. Kabuğunun fenere bakan yanında eski bir yaradan kalma bir çatlak var; uyurken açık kalıyor.", en: "The mother's asleep. There's a crack in her shell on the side facing the light, an old wound. While she sleeps, it's open." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "u̷yuyan bir anneyi öldürmek kolaydır. kolay olan her zaman iyi değildir. ama kolaydır işte.", en: "k̷illing a sleeping mother is easy. easy isn't the same as good. it's still easy." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yumurtaları yakarsak hiçbir balıkçının yarası mikrop kapmaz. Bunu hekim olarak söylüyorum, başka bir sıfatla değil.\"", en: "\"Burn the eggs and no fisherman's cut gets infected. I'm saying that as a doctor. Nothing else.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Balıkçıları geride tut. Ön sıra benim. Ön sıra hep benim.\"", en: "\"Keep the fishermen back. Front row's mine. Front row's always mine.\"" }
        secenekler:
          - id: "yuz"
            etiket: { tr: "Yuvaya in, anayı uyandırıp karşısına dikil", en: "Go down to the nest. Wake her up and face her" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4", "mendirek_yavrusu@oyuncu-4"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendirek Anası'nı uyandırıp onunla yüz yüze dövüşmek için yuvaya indin.", en: "You went down to the nest and woke the Jetty Mother to fight her face to face." }
          - id: "catlak"
            etiket: { tr: "Fenerin dibindeki çatlağa, uyurken vur", en: "Hit the crack under the light while she sleeps" }
            gerekli: { stat: { per: 50 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendirek Anası'na uykusunda, eski yarasından saldırdın.", en: "You went for the Jetty Mother in her sleep, straight at the old wound." }
          - id: "blok"
            tur: "gosteris"
            etiket: { tr: "Dalgakıran bloğunu kaldır, yuvanın üstüne bırak", en: "Lift a tetrapod and drop it on the nest" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - bayrak: "mendirek_ezildi"
              - dikkat: 5
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { elif_sari: { korku: 3, saygi: 5 } }
            kronik: { tr: "Otuz tonluk bir dalgakıran bloğunu tek başına kaldırıp yuvanın üstüne bıraktın; {yer:kiyikent_liman|de} kimse gördüğüne bir ad koyamadı.", en: "You lifted a sixty-thousand-pound tetrapod by yourself and dropped it on the nest. Nobody on {yer:kiyikent_liman} had a word for what they'd just seen." }
            sonraki: "siginak_1_konsey_zafer"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Gece, kimse görmeden in; övgü balıkçıların olsun", en: "Go down at night, unseen. Let the fishermen take the credit" }
            etkiler:
              - bayrak: "mendirek_gizli"
              - gizle: 3
              - ahlak: { insanlik: 3, merhamet: 1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4", "mendirek_yavrusu@oyuncu-4"], ortam: ["su", "karanlik"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendireğe gece, kimse görmeden indin; {yer:kiyikent_liman} kahraman arayacaksa kendi balıkçılarına baksın istedin.", en: "You went down to the breakwater at night, unseen. If {yer:kiyikent_liman} wanted heroes, you wanted it looking at its own fishermen." }
          - id: "balikcilar"
            etiket: { tr: "Balıkçıları yanına al; bu onların denizi", en: "Bring the fishermen in. It's their sea" }
            etkiler:
              - bayrak: "balikcilar_savasti"
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: -1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Balıkçıları yanına alıp kendi denizleri için savaşa soktun.", en: "You brought the fishermen along to fight for their own sea." }

      - id: "siginak_1_konsey_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Ananın kabuğu fenerin dibinde ikiye yarılıyor; içinden kopan ses, batan bir geminin son düdüğünü andırıyor. Met yükselirken yavrular dalgaların arasında çırpına çırpına birer birer batıyor.", en: "The mother's shell splits in two at the foot of the light, and the sound that comes out of her is like a ship's last horn. The tide rolls in, and the brood thrashes in the surf and goes under, one by one." }
            kosul: { bayrak_yok: ["mendirek_ezildi", "mendirek_gizli"] }
          - metin: { tr: "Blok yuvanın üstüne kapak gibi oturuyor. Balıkçılardan biri istavroz çıkarıyor, bir başkası besmele çekiyor; rıhtımdaki çocuklar ise alkışa durmuş, çünkü neyin korkunç olduğunu henüz bilmiyorlar.", en: "The tetrapod settles over the nest like a lid. One fisherman crosses himself. Another mutters something older. The kids on the quay clap, because kids don't know yet what's supposed to be frightening." }
            kosul: { bayrak: "mendirek_ezildi" }
          - metin: { tr: "Sabah ananın leşini kayalıklarda bulan balıkçılar, onu kimin öldürdüğünü tartışmaya koyuluyor. Rıza Reis'in torunu zıpkınını sallayıp yemin billah ediyor: o öldürmüş. Sen ağzını açmıyorsun.", en: "In the morning the fishermen find the carcass on the rocks and start arguing about who killed it. Skipper Reese's grandson waves his spear and swears it was him. You don't say a word." }
            kosul: { bayrak: "mendirek_gizli" }
          - { tr: "Şafakta yeşil fener yeniden yanıyor; biri merdivene tırmanıp eski bir akü bağlamış. İlk tekneler motorlarını öksürte öksürte çalıştırıp denize açılıyor.", en: "At dawn the green harbor light comes back on. Somebody climbed the ladder and wired in an old car battery. The first boats cough their engines awake and head out." }
          - metin: { tr: "Kalkış panosunda, DÜN ÖLEN satırının altına iliştirilmiş bir kâğıtta iki balıkçının adı elle yazılı.", en: "On the departures board, two fishermen's names hang on a handwritten slip under DEAD YESTERDAY." }
            kosul: { bayrak: "balikcilar_savasti" }
          - metin: { tr: "{npc:elif_sari} rıhtımda bir balıkçının kolunu dikiyor. Seni görünce iğneyi havada tutup başıyla tekneleri gösteriyor. \"Bak,\" diyor yalnızca. \"Şuna bak.\"", en: "{npc:elif_sari} is on the quay stitching up a fisherman's arm. When she sees you she holds the needle up and nods at the boats. \"Look,\" is all she says. \"Look at that.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Mendirek Bekçisi]", en: "[TITLE: Keeper of the Harbor Light]" }
            satirlar:
              - { tr: "Bir limanın ışığını yeniden yaktın. {yer:kiyikent_liman} bunu hatırlayacak; Sistem de.", en: "You relit a harbor's light. The harbor will remember. So will the System." }
        secenekler:
          - id: "hastane"
            etiket: { tr: "\"İlk av hastaneye gitsin.\"", en: "\"First catch goes to the hospital.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Mendirek temizlenince ilk avı Gümrük'teki koğuşa ayırttın.", en: "Once the breakwater was clear, you had the first catch set aside for the ward in the Customs House." }
            sonraki: "@akis"
          - id: "kordon"
            etiket: { tr: "\"{yer:kordon|den} gelenlere de pay ayırın.\"", en: "\"Set some aside for {yer:kordon} people.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { merhamet: 4, duzen: -1 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Mendireğin balığından tel örgünün dışındakilere, {yer:kordon|den} gelenlere de pay ayırttın.", en: "You had a share of the breakwater's fish set aside for the people outside the fence, too, the ones from {yer:kordon}." }
            sonraki: "@akis"
          - id: "cagir"
            etiket: { tr: "\"Bir dahaki işte de beni çağırın.\"", en: "\"Next job, you call me again.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 5 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Konsey'e bir dahaki işte de seni çağırmasını söyledin; artık çağıracakları biri vardı.", en: "You told the Council to call you for the next job, too. Now they had someone to call." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ana seni kıskaçlarına kıstırıp suyun altına çekiyor. Bir an her şey yemyeşil ve sessiz. Derken bir ağ, ardından bir zıpkın, en sonunda Rıza Reis'in kalın sesi: \"Çekin! Çekin şunu!\"", en: "The mother gets you between her claws and drags you under. For a second everything is green and quiet. Then a net, then a spear, then Skipper Reese's foghorn voice: \"Haul! Haul, damn it!\"" }
          - { tr: "Balıkçılar seni kayalıklara çekip çıkarıyor. Ana, kabuğunda senin açtığın yarıklarla derinlere çekilirken ardında yuvayı mazotla tutuşturan adamlar kalıyor. Mendirek temizlendi, ama dalgaların ötesinde bekleyen bir şey hâlâ orada.", en: "The fishermen drag you up onto the rocks. The mother pulls back into deep water, her shell split where you cracked it, and behind her the men set the nest on fire with diesel. The breakwater's clear. Something's still waiting out past the swell." }
          - metin: { tr: "{npc:elif_sari} rıhtımda kolunu dikerken iğneyi bir an durduruyor. \"Yemek katından beri ilk kez kanadığını görüyorum,\" diyor. \"İçim neredeyse rahatladı. Neredeyse.\"", en: "{npc:elif_sari} stops the needle for a second while she's stitching your arm on the quay. \"First time I've seen you bleed since the food court,\" she says. \"I'm almost relieved. Almost.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Ağı tutan balıkçılara teşekkür et", en: "Thank the fishermen who held the net" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - xp_seviye: 20
              - ahlak: { insanlik: 3, merhamet: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Mendirekte yenildin ve seni ağla çekip kurtaran balıkçılara teşekkür ettin; {yer:kiyikent_liman} o gün seni biraz daha sevdi.", en: "You lost on the breakwater and thanked the fishermen who netted you out. The Waterfront loved you a little more that day." }
            sonraki: "@akis"
          - id: "tek"
            etiket: { tr: "\"Bir dahakine kimse peşimden gelmesin.\"", en: "\"Next time, nobody follows me down.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - xp_seviye: 20
              - ahlak: { duzen: 2, insanlik: -1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: 2, baglilik: -1 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Seni kurtaranlara bir dahaki sefere peşinden gelmemelerini söyledin.", en: "You told the people who'd saved you not to follow you down next time." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_kacis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mendirekten geri çekiliyorsun. Bir saat geçmeden rıhtıma üç Lonca kamyonu yanaşıyor; Pala'nın adamları yuvayı alev püskürtücülerle yakıp fenerin tepesine Lonca bayrağı çekiyor.", en: "You pull back off the breakwater. An hour later three Guild trucks roll up to the quay. Cleaver's crew torches the nest with flamethrowers and runs a Guild flag up over the harbor light." }
          - { tr: "Pala isten kararmış eldivenlerini çıkarırken sana göz kırpıyor. \"Sen başladın, biz bitirdik,\" diyor. \"Faturası Konsey'e.\"", en: "Cleaver winks at you as he peels off his scorched gloves. \"You started it, we finished it,\" he says. \"Bill goes to the Council.\"" }
          - metin: { tr: "Akşam {npc:elif_sari} seni {yer:kiyikent_iskele|in} merdivenlerinde buluyor. \"Denedin,\" diyor. \"Bunu tahtaya yazdım; Pala'nın kestiği faturanın hemen yanına.\"", en: "That evening {npc:elif_sari} finds you on the {yer:kiyikent_iskele} steps. \"You tried,\" she says. \"I wrote that on the board. Right next to Cleaver's invoice.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "ode"
            etiket: { tr: "\"Faturayı ben öderim.\"", en: "\"I'll cover the bill.\"" }
            gerekli: { oz_kristali_min: 4 }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_loncaya"
              - degisken: { lonca_golgesi: 1 }
              - xp_seviye: 10
              - ahlak: { merhamet: 2, duzen: 1 }
              - oz_kristali: -4
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Mendireği Lonca bitirdi, faturayı sen ödedin; Konsey asıl kime borçlu olduğunu biliyordu.", en: "The Guild finished the breakwater and you paid the bill. The Council knew who it really owed." }
            sonraki: "@akis"
          - id: "bayrak"
            etiket: { tr: "Fenerdeki Lonca bayrağını indir", en: "Take the Guild flag down off the light" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_loncaya"
              - degisken: { lonca_golgesi: 2 }
              - xp_seviye: 10
              - ahlak: { duzen: -2, merhamet: 1 }
              - itibar: { siginak: 3, lonca: -4 }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" }, hatirlatma: { tr: "Konsey'in biletini aldığın günden beri yedinci gişe seni bekliyor.", en: "Since the day you took the Council's ticket, the seventh ticket window has been waiting on you." } }
            kronik: { tr: "Lonca'nın bayrağını fenerden indirdin; Pala bunu bir hakaret olarak deftere yazdı.", en: "You pulled the Guild's flag off the harbor light. Cleaver wrote that down as an insult." }
            sonraki: "@akis"

  # ================================================================== ELİF 1 — KONSEY OYLAMASI (P2; tohum + havuz)
  - id: "elif_konsey_oylamasi"
    konum: ["kiyikent_liman"]
    perde: [2]
    gun: { min: 72, max: 175 }
    agirlik: 6
    kosul: { bayrak: "siginak_1_goruldu", bayrak_yok: "elif_oylamasi_bitti" }
    etiketler: ["siginak", "konsey", "npc", "ahlak"]
    gerilim: 2
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Yedinci gişedeki mum", en: "A candle in window seven" }
    sahne: "elif_konsey_oylamasi_1"
    sahneler:
      - id: "elif_konsey_oylamasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yedinci gişenin camının ardında bir mum yanıyor. İhtiyar hâkim dün gece orada, gözü kalkış panosundayken ölmüş. Kalbi için ilaç yokmuş; olsa da başkasına verirdi.", en: "There's a candle burning behind the glass of window seven. The old judge died there last night, looking up at the departures board. There was no medicine for her heart, and if there had been, she'd have given it to someone else." }
          - { tr: "Gece yarısı salon hıncahınç. Konsey'in bir başkana ihtiyacı var: {fraksiyon:lonca} karşısında tek bir muhatap istiyor, dokuz bin kişi de yedi gişeye birden bağıramaz. Biri panonun altına iri harflerle Rıza Reis'in önerisini yazmış: SEVİYE KARNESİ. Önce savaşan yer, sonra bakılan, en son bekleyen.", en: "The hall is packed at midnight. The Council needs a chair, because the {fraksiyon:lonca} wants one person to deal with, and nine thousand people can't yell at seven windows at once. Under the board, somebody has written Skipper Reese's proposal in block capitals: LEVEL RATIONS. Fighters eat first, then the cared-for, and whoever's left waits." }
          - { tr: "Bütün gözler dördüncü gişede. {npc:elif_sari} başını iki yana sallıyor. \"Ben hekimim,\" diyor mikrofona. \"Hekim karar vermez, hakkında karar verilene bakar. Bunu daha önce de söylemiştim.\"", en: "Everybody's looking at window four. {npc:elif_sari} shakes her head. \"I'm a doctor,\" she says into the mic. \"Doctors don't decide. We take care of whoever the decisions land on. I've said that before.\"" }
          - metin: { tr: "Söylemişti: yemek katında, bir ısırık yüzünden, beyaz tahtanın önünde. Sen de oradaydın.", en: "She had. In the food court, over a bite wound, in front of a whiteboard. You were there." }
            kosul: { bayrak: "karantina_oylandi" }
          - metin: { tr: "Bir de kimsenin adını yüksek sesle anmadığı üçüncü bir aday var: salonun yarısı sana bakıyor.", en: "And there's a third candidate nobody's saying out loud. Half the hall is looking at you." }
            kosul: { bayrak_yok: "siginak_1_red" }
        sezgiler:
          - kosul: { stat: { cha: 40 } }
            metin: { tr: "Salon ikiye bölünmüş: korkanlar Reis'ten, yorgunlar hekimden yana. Korkanlar daha kalabalık, ama yorgunların sesi daha gür çıkıyor.", en: "The hall's split in two: the scared ones for the Skipper, the tired ones for the doctor. There are more scared ones. But the tired ones are louder." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni seçecekler, sen istemesen bile. asıl soru, istediğin gün ne olacağı.", en: "t̷hey'll pick you. even if you don't want it. the only question is what happens when you do." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Seviyeye göre karne mi? Buna algoritma denmez, kast sistemi denir. Nereden mi biliyorum? O algoritmaları ben yazardım.\"", en: "\"Rations by level? That's not an algorithm, that's a caste system. You know how I know? I used to write those algorithms.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Benim seviyem düşük. Kardeşiminki daha da düşük. Biz en son yerdik, değil mi?\"", en: "\"My level's low. My sister's is even lower. We'd eat last, wouldn't we?\"" }
        secenekler:
          - id: "elif_aday"
            etiket: { tr: "{npc:elif_sari|i} çatıya çek: \"Aday sen ol.\"", en: "Pull {npc:elif_sari} up to the roof: \"You run.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Konsey'in en zor gecesinde bir hekimi çatıya çıkarıp aday olmasını istedin.", en: "On the Council's hardest night, you took a doctor up on the roof and asked her to run." }
            sonraki: "elif_konsey_oylamasi_ikna"
          - id: "karne"
            etiket: { tr: "Kürsüye çık; karneye karşı konuş", en: "Take the floor. Speak against the rations" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Seviye karnesine karşı salonun ortasında konuştun.", en: "You stood up in the middle of the hall and spoke against level rations." }
            sonraki: "elif_konsey_oylamasi_karne"
          - id: "koltuk"
            etiket: { tr: "\"Koltuğu ben alırım.\"", en: "\"I'll take the chair.\"" }
            goster: { bayrak_yok: "siginak_1_red" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 2, korku: 2 } }
            kronik: { tr: "Kimse sormadan Konsey'in boş koltuğuna kendin oturdun.", en: "Nobody asked. You sat down in the Council's empty chair anyway." }
            sonraki: "elif_konsey_oylamasi_koltuk"
          - id: "riza"
            etiket: { tr: "\"Karne mantıklı. Savaşan önce yer.\"", en: "\"The rations make sense. Fighters eat first.\"" }
            etkiler:
              - bayrak: "seviye_karnesi"
              - bayrak: "riza_konsey_basi"
              - ahlak: { duzen: 4, merhamet: -5 }
              - itibar: { siginak: -2, lonca: 4 }
              - iliski: { elif_sari: { guven: -6, saygi: -2 } }
            kronik: { tr: "Seviye karnesini destekledin; {yer:kiyikent_liman|de} tabaklar artık seviyeye göre dolacaktı.", en: "You backed level rations. On {yer:kiyikent_liman}, plates would be filled by level now." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "donus"
            etiket: { tr: "\"Mendirek teklifi hâlâ tahtada mı?\"", en: "\"Is the breakwater offer still on the board?\"" }
            goster: { bayrak: "siginak_1_red" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "siginak_1_bitti"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 5, baglilik: 3 } }
            kronik: { tr: "Bir kez reddettiğin Konsey'e geri döndün; hekim tahtadaki adını silmemişti.", en: "You came back to the Council you'd turned down once. The doctor never erased your name from the board." }
            sonraki: "elif_konsey_oylamasi_donus"

      - id: "elif_konsey_oylamasi_donus"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} gişeden çıkıp tahtanın köşesini gösteriyor. Adın orada duruyor; solmuş ama silinmemiş. Altına biri, belki de kendisi, küçük bir soru işareti koymuş.", en: "{npc:elif_sari} steps out of the booth and points at the corner of the whiteboard. Your name's there, faded but never erased, and somebody, maybe her, put a small question mark under it." }
          - { tr: "\"Mendirek artık Lonca'nın,\" diyor. \"Ama Konsey'in hâlâ bir kalkana ihtiyacı var, bu gece de bir başkana.\" Soru işaretini başparmağıyla siliyor.", en: "\"The breakwater's the Guild's now,\" she says. \"But the Council still needs a shield. And tonight it needs a chair.\" She wipes the question mark off with her thumb." }
        secenekler:
          - id: "aday"
            etiket: { tr: "\"O zaman başkan sen ol.\"", en: "\"Then you be the chair.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Konsey'e döndüğün gece hekimden aday olmasını istedin.", en: "The night you came back to the Council, you asked the doctor to run." }
            sonraki: "elif_konsey_oylamasi_ikna"
          - id: "kursu"
            etiket: { tr: "Kürsüye çık; karneye karşı konuş", en: "Take the floor. Speak against the rations" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Konsey'e döner dönmez seviye karnesine karşı konuştun.", en: "The minute you came back to the Council, you spoke against level rations." }
            sonraki: "elif_konsey_oylamasi_karne"

      - id: "elif_konsey_oylamasi_ikna"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} çatısında rüzgâr tuz kokuyor. {npc:elif_sari} parmaklığa yaslanıp cebinden bir paket kurabiye çıkarıyor; birini sana uzatıyor, sonra vazgeçip kendisi yiyor.", en: "Up on the {yer:kiyikent_iskele} roof, the wind tastes like salt. {npc:elif_sari} leans on the railing and pulls a pack of cookies out of her pocket. She holds one out to you, changes her mind, and eats it herself." }
          - { tr: "\"Başkan, siyah bandı kime yapıştıracağına karar veren kişidir,\" diyor. \"Ben zaten her gün yapıştırıyorum. Ama yatak başında yapıyorum, gişe camının ardından değil. Camın ardından yapmaya başlarsam alışırım.\"", en: "\"The chair is the person who decides who gets the black tape,\" she says. \"I already do that. Every day. But I do it at a bedside, not from behind a ticket window. If I start doing it from behind a window, I'll get used to it.\"" }
          - { tr: "Aşağıda, rıhtımda bir tekne motorunu susturuyor. \"Alışırsam da,\" diyor, \"iyi hekim olmaktan çıkarım. Kimsenin işine yaramam.\"", en: "Down on the quay, a boat cuts its engine. \"And if I get used to it,\" she says, \"I'm not a good doctor anymore. I'm no use to anybody.\"" }
        sezgiler:
          - kosul: { stat: { wis: 50 } }
            metin: { tr: "Korktuğu koltuğun kendisi değil; o koltukta kime dönüşeceğini şimdiden bilmesi.", en: "It's not the chair she's scared of. It's that she already knows who she'd be in it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷yi insanlar koltuktan korkar, kötüler korkmaz. koltuklar o yüzden çoğu zaman kötülere kalır.", en: "g̷ood people are afraid of chairs. bad people aren't. that's why chairs usually end up with the bad ones." }
        secenekler:
          - id: "kural"
            etiket: { tr: "\"Bari herkes için aynı kuralla yapıştır.\"", en: "\"Then at least do it by the same rule for everyone.\"" }
            gerekli: { iliski_min: { elif_sari: { guven: 15 } } }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { duzen: 4, merhamet: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, guven: 4 } }
            kronik: { tr: "Hekimi, siyah bandı herkese aynı kuralla vermesi için Konsey'in başına geçirdin.", en: "You put the doctor at the head of the Council so the black tape would go by one rule for everyone." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "arkanda"
            etiket: { tr: "\"Aday ol. Ben her gece arkanda dururum.\"", en: "\"Run. I'll be at your back every night.\"" }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { baglilik: 8, guven: 5 } }
              - hafiza: { npc: "elif_sari", id: "olay:elif_konsey_oylamasi", agirlik: 30 }
            kronik: { tr: "Hekime her gece arkasında duracağına söz verdin; o da bu söze güvenip Konsey'in başına geçti.", en: "You promised the doctor you'd be at her back every night. On that promise, she took the Council's chair." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "isaret"
            tur: "aciga_vur"
            etiket: { tr: "Ona Sistem'in sana gösterdiklerini anlat", en: "Tell her what the System shows you" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - bayrak: "elif_konsey_basi"
              - dikkat: 3
              - ahlak: { insanlik: 3, duzen: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 8, korku: 3 } }
            kronik: { tr: "Hekime gözlerinin neler gördüğünü anlattın; gerçeği gören tek kişi olmayacağını bildiği için o da başkanlığı kabul etti.", en: "You told the doctor what your eyes see. She took the chair because she knew she wouldn't be the only one seeing clearly." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "zorlama"
            etiket: { tr: "\"Peki. Zorlamayacağım.\"", en: "\"Okay. I won't push.\"" }
            etkiler:
              - bayrak: "riza_konsey_basi"
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { elif_sari: { guven: 3, baglilik: 2 } }
            kronik: { tr: "Hekimi koltuğa zorlamadın; Konsey'in başına o gün ihtiyar kaptan geçti.", en: "You didn't push the doctor into the chair. The old skipper took it instead." }
            sonraki: "elif_konsey_oylamasi_karne"

      - id: "elif_konsey_oylamasi_karne"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kürsü dediğin, ters çevrilmiş bir bavul arabası. Üstüne çıkınca salonun uğultusu bıçak gibi kesiliyor; dokuz bin kişi değilse bile dokuz yüz kişi sana bakıyor.", en: "The \"floor\" turns out to be an overturned luggage cart. When you climb up, the noise in the hall cuts off. Maybe not nine thousand people, but nine hundred are looking at you." }
          - { tr: "Rıza Reis kollarını kavuşturuyor. \"Söyle bakalım,\" diyor. \"Savaşanlar aç kalırsa bu salonu kim koruyacak? Sen mi? Tek başına?\"", en: "Skipper Reese folds his arms. \"Go on, then,\" he says. \"If the fighters go hungry, who protects this hall? You? All by yourself?\"" }
        sezgiler:
          - kosul: { stat: { cha: 50 } }
            metin: { tr: "Salonun arka tarafında bir kadın kucağındaki bebeği sallıyor. Karne geçerse savaşamayacağı için en son o bebek yiyecek.", en: "In the back of the hall a woman's rocking a baby. If the rations pass, that baby eats last, because it can't fight." }
        secenekler:
          - id: "salon"
            tur: "gosteris"
            etiket: { tr: "Salonu tek bir konuşmayla çevir", en: "Turn the whole room with one speech" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - dikkat: 2
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { saygi: 6, baglilik: 3 } }
            kronik: { tr: "Bir bavul arabasının üstünden yaptığın konuşma karneyi düşürdü, salon da hekimi başkan diye alkışladı.", en: "The speech you gave from the top of a luggage cart killed the rations, and the hall cheered the doctor in as chair." }
            sonraki: "elif_konsey_oylamasi_salon"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni söyle: \"Karneyle ilk ben doyarım.\"", en: "Say your real level: \"With rations, I eat first.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4, korku: 2 } }
            kronik: { tr: "Gerçek seviyeni salona söyleyip seviye karnesinin ilk kimi doyuracağını gösterdin; karne o gece öldü.", en: "You told the hall your real level and showed them who level rations would feed first. The rations died that night." }
            sonraki: "elif_konsey_oylamasi_koltuk"
          - id: "cizelge"
            etiket: { tr: "\"Karne değil, çizelge: herkes nöbet tutar, herkes yer.\"", en: "\"Not rations. A roster: everybody stands watch, everybody eats.\"" }
            etkiler:
              - bayrak: "riza_konsey_basi"
              - bayrak: "nobet_cizelgesi"
              - ahlak: { duzen: 3, merhamet: 3 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 3, saygi: 3 } }
            kronik: { tr: "Seviye karnesinin yerine bir nöbet çizelgesi kabul ettirdin: {yer:kiyikent_liman|de} herkes nöbet tutacak, herkes yiyecekti.", en: "You got a watch roster passed instead of level rations. On {yer:kiyikent_liman}, everybody would stand watch, and everybody would eat." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_salon"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sonradan ne söylediğini hatırlamıyorsun; aklında yalnızca salonun sesi kalıyor. Önce bir kadın, ardından arkadaki gençler, en sonunda bütün salon dördüncü gişeye dönüp bir ismi tekrarlamaya başlıyor.", en: "Afterward you can't remember what you said. You only remember the sound of the room. First one woman, then the kids in the back, then everybody turns toward window four and starts saying a name." }
          - { tr: "{npc:elif_sari} camın ardında donup kalmış. Bir şey söyleyecekmiş gibi mikrofona eğiliyor, ama söylemiyor; bir hastaya 'tamam, yapacağız' der gibi başını sallamakla yetiniyor.", en: "{npc:elif_sari} is frozen behind the glass. Then she leans into the mic like she's going to say something, and doesn't. She just nods, the way she'd nod to a patient: okay. We'll do it." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Bavul arabasından in ve geri çekil", en: "Climb down off the cart and step back" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Salonu kazandıktan sonra sahneyi hekime bıraktın.", en: "Once you'd won the room, you left the stage to the doctor." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "el"
            etiket: { tr: "Gişeye yürü ve ona elini uzat", en: "Walk to her window and offer her your hand" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Yeni başkanı elinden tutup gişesinden çıkardın; bütün salon bir film sahnesi izler gibi baktı.", en: "You took the new chair by the hand and walked her out of her booth. The whole hall watched like it was a scene from a movie." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_koltuk"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yedinci gişenin kapısını açıp içeri giriyor, mumu kenara çekiyorsun. Hâkimin gözlüğü hâlâ tezgâhın üstünde, katlanmış duruyor.", en: "You open the door to window seven and step inside. You move the candle aside. The judge's glasses are still on the counter, folded." }
          - { tr: "Salonda çıt yok. Bu sessizlik onaydan mı korkudan mı, camın bu tarafından kestirmek mümkün değil.", en: "The hall is silent. From this side of the glass, you can't tell whether that silence is approval or fear." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[YETKİ DEVRİ · Liman Konseyi]", en: "[AUTHORITY TRANSFER · Waterfront Council]" }
            satirlar:
              - { tr: "Topluluk lideri atandı. Onay oranı: %71. Korku kaynaklı onay: hesaplanmadı.", en: "Community leader assigned. Approval: 71%. Approval due to fear: not calculated." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ak, koltuk hâlâ sıcak. hâkim daha soğumadı bile. sen ondan uzun oturacaksın burada.", en: "l̷ook, the chair's still warm. the judge hasn't even gone cold. you'll sit here longer than she did." }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "{npc:elif_sari} gülümsüyor ama eli tezgâhın altında beyaz tahta kalemini sıkıyor.", en: "{npc:elif_sari} is smiling, but under the counter her hand's squeezing the whiteboard marker." }
        secenekler:
          - id: "yardimci"
            etiket: { tr: "\"{npc:elif_sari} yardımcım. Oyu benimkinden önce sayılır.\"", en: "\"{npc:elif_sari} is my deputy. Her vote counts first.\"" }
            etkiler:
              - bayrak: "oyuncu_konsey_koltugu"
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 4 } }
            kronik: { tr: "Konsey'in başına geçtin ama hekimin oyunu kendi oyunun önüne koydun.", en: "You took the Council's chair, but you put the doctor's vote ahead of your own." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "danisma"
            etiket: { tr: "\"Kararları ben veririm. Oylar danışma içindir.\"", en: "\"I make the decisions. The votes are advisory.\"" }
            etkiler:
              - bayrak: "oyuncu_konsey_koltugu"
              - bayrak: "konsey_danisma"
              - ahlak: { duzen: 6, merhamet: -2, insanlik: -3 }
              - itibar: { siginak: -3, lonca: 3 }
              - iliski: { elif_sari: { guven: -8, korku: 5 } }
            kronik: { tr: "Konsey'in oylarını 'danışma' diye bir kenara koydun; {yer:kiyikent_liman|de} oy artık yalnızca bir görüştü.", en: "You filed the Council's votes under \"advisory.\" On {yer:kiyikent_liman}, a vote was just an opinion now." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "devret"
            etiket: { tr: "Koltuğu ona bırak: \"Ben kapıda dururum.\"", en: "Give her the chair: \"I'll stand at the door.\"" }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, saygi: 5 } }
            kronik: { tr: "Konsey'in koltuğuna oturdun, sonra kalkıp hekime bıraktın ve kapıda durdun.", en: "You sat in the Council's chair, then got up, handed it to the doctor, and went to stand at the door." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - metin: { tr: "Sabaha karşı tahtanın en üstüne, KONSEY yazısının hemen altına yeni bir satır eklenmiş: BAŞKAN, yanında da {npc:elif_sari|in} adı. El yazısı onun değil, başka birinin; kendi adını yazmaya eli varmamış.", en: "Toward morning there's a new line at the top of the whiteboard, right under COUNCIL: CHAIR, and next to it, {npc:elif_sari|pos} name. Not in her handwriting. Someone else's. She couldn't bring herself to write it." }
            kosul: { bayrak: "elif_konsey_basi" }
          - metin: { tr: "Yedinci gişenin camının ardında artık sen oturuyorsun. Panoyu çeviren çocuk her sabah önce sana, sonra harflere bakıyor.", en: "You're the one behind the glass of window seven now. The kid who flips the board looks at you first every morning, then at the letters." }
            kosul: { bayrak: "oyuncu_konsey_koltugu" }
          - metin: { tr: "Rıza Reis yedinci gişeye taşınıyor. Hâkimin mumunu söndürmeden yanına kendi kaptan şapkasını bırakıyor.", en: "Skipper Reese moves into window seven. He doesn't blow out the judge's candle. He sets his captain's cap down next to it." }
            kosul: { bayrak: "riza_konsey_basi" }
          - metin: { tr: "Ertesi gün {yer:kiyikent_liman|de} ilk karneler dağıtılıyor: bir kartona basılmış rakamla bir tabak. Kuyruklar seviyeye göre diziliyor; en arkada çocuklar bekliyor.", en: "The next day the first ration cards go out on {yer:kiyikent_liman}: a number stamped on cardboard, and a plate. The lines sort themselves by level, and the kids wait at the very back." }
            kosul: { bayrak: "seviye_karnesi" }
          - { tr: "Gün doğarken {npc:elif_sari} çatıya çıkıp uzun uzun limanı seyrediyor. Sonra aşağı iniyor; Gümrük'teki koğuşta sabah vizitesi var ve vizite kimseyi beklemez.", en: "At sunrise {npc:elif_sari} goes up on the roof and looks out at the harbor for a long time. Then she comes back down, because there are morning rounds on the ward in the Customs House and rounds don't wait for anybody." }
        secenekler:
          - id: "vizite"
            etiket: { tr: "Onunla sabah vizitesine git", en: "Go on morning rounds with her" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 5, guven: 3 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 20 }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Yedinci gişedeki oylamadan sonra {npc:elif_sari} yükünü hiç bırakmadı.", en: "After the vote at the seventh ticket window, {npc:elif_sari} never once set the load down." } }
              - tohum: { olay: "elif_yoldas_konsey", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_teklif"] }, hatirlatma: { tr: "Gümrük'ün merdivenlerinde {npc:elif_sari} elinde bir anahtarla seni bekliyor.", en: "On the Customs House steps, {npc:elif_sari} is waiting for you with a key in her hand." } }
            kronik: { tr: "Konsey'in en uzun gecesinin sabahında hekimle birlikte koğuşu dolaştın.", en: "On the morning after the Council's longest night, you walked the ward with the doctor." }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "\"Bir saat uyu. Koğuş bir saat bekler.\"", en: "\"Sleep an hour. The ward can wait an hour.\"" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { merhamet: 2, insanlik: 3 }
              - iliski: { elif_sari: { guven: 4, baglilik: 2 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Yedinci gişedeki oylamadan sonra {npc:elif_sari} yükünü hiç bırakmadı.", en: "After the vote at the seventh ticket window, {npc:elif_sari} never once set the load down." } }
              - tohum: { olay: "elif_yoldas_konsey", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_teklif"] }, hatirlatma: { tr: "Gümrük'ün merdivenlerinde {npc:elif_sari} elinde bir anahtarla seni bekliyor.", en: "On the Customs House steps, {npc:elif_sari} is waiting for you with a key in her hand." } }
            kronik: { tr: "Sabaha karşı {yer:kiyikent_liman|in} uykusuz hekimine koğuşun bir saat bekleyebileceğini söyledin.", en: "Toward morning, you told {yer:kiyikent_liman|pos} sleepless doctor the ward could wait an hour." }
            sonraki: "@akis"
          - id: "is"
            etiket: { tr: "\"Konsey'in bir sonraki işi neyse, bana yaz.\"", en: "\"Whatever the Council's next job is, put me down.\"" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Yedinci gişedeki oylamadan sonra {npc:elif_sari} yükünü hiç bırakmadı.", en: "After the vote at the seventh ticket window, {npc:elif_sari} never once set the load down." } }
              - tohum: { olay: "elif_yoldas_konsey", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_teklif"] }, hatirlatma: { tr: "Gümrük'ün merdivenlerinde {npc:elif_sari} elinde bir anahtarla seni bekliyor.", en: "On the Customs House steps, {npc:elif_sari} is waiting for you with a key in her hand." } }
            kronik: { tr: "Konsey'in her işine adını önceden yazdırdın.", en: "You put your name down for every job the Council had, in advance." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 2 — SU SAVAŞLARI (P2, AY 122)
  - id: "siginak_2_su_savaslari"
    konum: ["kiyikent_liman"]
    perde: [2]
    gun: { min: 100, max: 170 }
    ana_yay: { gun: 122 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_1_bitti" }
    etiketler: ["siginak", "zincir", "su", "lonca"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Su iki gün", en: "Two days of water" }
    sahne: "siginak_2_su_1"
    sahneler:
      - id: "siginak_2_su_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Ağustos sıcağı {yer:kiyikent_liman|in} üstüne kapak gibi oturmuş. {yer:kiyikent_iskele|in} önünde, ellerinde boş bidonlarla bekleyenlerin kuyruğu rıhtım boyunca uzayıp balık halinin arkasında gözden kayboluyor.", en: "The heat wave has settled over {yer:kiyikent_liman} like a lid, a hundred and four in the shade. There's a line of people with empty jerry cans outside the {yer:kiyikent_iskele}, and it runs the length of the quay and disappears behind the fish market." }
          - { tr: "Kalkış panosunda tek bir satır kırmızıya boyanmış: SU 2 GÜN. {yer:kiyikent_liman|in} deniz suyunu içilir hâle getiren eski arıtma gemisi Tuzla mavnası, üç gün önce zarlarını patlatıp susmuş.", en: "One line on the departures board has been painted red: WATER 2 DAYS. The Saltwater barge, the old desalination rig that kept {yer:kiyikent_liman} drinking, blew its membranes three days ago and went quiet." }
          - { tr: "Şehirde temiz su veren tek yer {yer:sanayi} ile {yer:eski_sehir} arasındaki Pınarbaşı pompa istasyonu; orayı da {fraksiyon:lonca} tutuyor. Kapısına turnike koymuşlar: seviyen kaçsa, o kadar litre.", en: "The only clean water left in the city comes out of the Pinewell pumping station between {yer:sanayi} and {yer:eski_sehir}, and the {fraksiyon:lonca} is holding it. They've put a turnstile on the gate: whatever your level is, that's how many liters you get." }
          - metin: { tr: "\"Lonca'yla konuşabilir, savaşabilir ya da bir mucize bulabilirsin,\" diyor {npc:elif_sari} başkanlık gişesinden. \"Hangisi olursa olsun, yarın akşama kadar karar ver.\"", en: "\"You can talk to the Guild, fight the Guild, or find a miracle,\" {npc:elif_sari} says from the chair's window. \"Pick whichever you want. Just pick by tomorrow night.\"" }
            kosul: { bayrak: "elif_konsey_basi" }
          - metin: { tr: "\"Lonca'yla konuşursun, savaşırsın ya da bir mucize bulursun,\" diyor Rıza Reis yedinci gişeden. \"Ben olsam konuşurdum. Ama sen ben değilsin, değil mi?\"", en: "\"Talk to the Guild, fight the Guild, or find a miracle,\" Skipper Reese says from window seven. \"I'd talk, if it was me. But you're not me, are you?\"" }
            kosul: { bayrak_yok: ["elif_konsey_basi", "oyuncu_konsey_koltugu"] }
          - metin: { tr: "Konsey'in bütün gözleri yedinci gişeye, sana çevriliyor. Karar senin; kuyruk da senin.", en: "The Council's eyes go to window seven. To you. The decision's yours. So is the line." }
            kosul: { bayrak: "oyuncu_konsey_koltugu" }
        sezgiler:
          - kosul: { stat: { per: 55 } }
            metin: { tr: "Kuyruktaki bidonların yarısı aslında dolu. {yer:kiyikent_liman|de} birileri suyu istifliyor; ya korkudan ya satmak için, belki de ikisi birden.", en: "Half the jerry cans in that line are actually full. Somebody on {yer:kiyikent_liman} is hoarding, out of fear, to sell, or both." }
          - kosul: { stat: { per: 55 } }
            metin: { tr: "{yer:eski_sehir|in} altından, sokakların değil taşların da altından su sesi geliyor. Bol su: durgun, eski, karanlık.", en: "Under {yer:eski_sehir}, under the stones and not the streets, you can hear water. A lot of it. Still, old, and dark." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷avnanın zarlarının da bir eşya penceresi var. sistem üstüne 'bozuk' yazmış. ben 'bozuk' kelimesini çok iyi bilirim.", en: "t̷he barge's membranes have an item window. the system wrote \"broken\" on it. i know the word \"broken\" very well." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Önce sıcak çarpması, sonra böbrek yetmezliği, sonra kolera. Sırası hiç değişmez. Bir haftamız yok, iki günümüz var.\"", en: "\"Heatstroke, kidney failure, then cholera. Always in that order. We don't have a week. We have two days.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Seviyeye göre litre. Tabii ya. Kıyametten sonraki ilk kast sistemi hep musluktan akar.\"", en: "\"Liters by level. Of course. The first caste system after the apocalypse always comes out of the tap.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Pınarbaşı'na git ve Lonca'yla konuş", en: "Go to Pinewell and talk to the Guild" }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { elif_sari: { saygi: 2 } }
            kronik: { tr: "Su savaşına önce pazarlık masasına oturarak girdin.", en: "You walked into the water wars with a table first." }
            sonraki: "siginak_2_su_istasyon"
          - id: "bas"
            etiket: { tr: "\"İstasyonu basarız. Su herkesindir.\"", en: "\"We hit the station. Water belongs to everyone.\"" }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: -4, merhamet: 2 }
              - iliski: { elif_sari: { korku: 2, guven: -1 } }
            kronik: { tr: "Suyun herkesin olduğunu söyleyip Lonca'nın istasyonuna yürüdün.", en: "You said water belongs to everyone, then marched on the Guild's station." }
            sonraki: "siginak_2_su_baskin"
          - id: "sarnic"
            etiket: { tr: "\"{yer:eski_sehir|in} altında su var. Duyuyorum.\"", en: "\"There's water under {yer:eski_sehir}. I can hear it.\"" }
            gerekli: { stat: { per: 55 } }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Kimsenin duymadığı bir su sesinin peşinden şehrin altına indin.", en: "You heard water nobody else could hear and went down under the city after it." }
            sonraki: "siginak_2_su_sarnic"
          - id: "tuzla"
            tur: "gosteris"
            etiket: { tr: "Tuzla mavnasını Sistem gücüyle onar", en: "Fix the Saltwater barge with System power" }
            gerekli: { stat: { int: 60 } }
            etkiler:
              - dikkat: 5
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { elif_sari: { saygi: 6, korku: 3 } }
            kronik: { tr: "Ölü bir arıtma gemisini ellerinle yeniden çalıştırdın.", en: "You brought a dead desalination barge back to life with your bare hands." }
            sonraki: "siginak_2_su_tuzla"
          - id: "karne"
            etiket: { tr: "\"Karne koyun: su önce savaşanlara.\"", en: "\"Ration it. Water goes to the fighters first.\"" }
            etkiler:
              - bayrak: "su_karnesi"
              - bolge: "sanayi"
              - ahlak: { duzen: 4, merhamet: -5 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { elif_sari: { guven: -5 } }
            kronik: { tr: "{yer:kiyikent_liman|in} son iki günlük suyunu seviyeye göre paylaştırdın; kuyruğun en sonuna yaşlılar düştü.", en: "You had {yer:kiyikent_liman|pos} last two days of water handed out by level. The old folks ended up at the back of the line." }
            sonraki: "siginak_2_su_istasyon"

      - id: "siginak_2_su_istasyon"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pınarbaşı'nın beton kulübesinin önüne, kim bilir hangi istasyondan söküp getirdikleri bir metro turnikesi dikilmiş. Üstündeki ekran geçenin seviyesini okuyup litresini yazıyor: 12 SV · 6 L.", en: "There's a subway turnstile planted in front of the Pinewell pump house. God knows which station they tore it out of. The screen on top reads whoever walks through and spits out liters: LV 12 · 6 L." }
          - { tr: "Turnikenin yanında, taburede deri önlüklü, iri yarı, sakin bir adam oturuyor: Pala. Balık bıçağıyla tırnaklarının arasını temizliyor.", en: "Next to the turnstile, a big, calm man in a leather apron sits on a stool. That's Cleaver. He's cleaning his nails with a fish knife." }
          - metin: { tr: "Pompa kulübesinin kapısında kollarını kavuşturmuş {npc:kaya_demir} beliriyor. \"Suyu veririm,\" diyor. \"Karşılığında {yer:kiyikent_liman|in} rıhtımına adamlarımı koyarım. Suya karşılık duvar. Adil bir alışveriş.\"", en: "{npc:kaya_demir} appears in the doorway of the pump house, arms folded. \"I'll give you the water,\" he says. \"In exchange, I put my people on {yer:kiyikent_liman} docks. Water for walls. That's fair.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Patronun şartı belli,\" diyor Pala, bıçağını önlüğüne silerken. \"Suya karşılık duvar. {yer:kiyikent_liman|in} rıhtımına bizim çocuklar.\"", en: "\"The boss has terms,\" Cleaver says, wiping the knife on his apron. \"Water for walls. Our boys on {yer:kiyikent_liman} docks.\"" }
            kosul: { npc_olu: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Turnikenin ekranıyla oynanmış: Lonca'nın adamları geçerken seviyeyi iki katı gösteriyor.", en: "The turnstile's been rigged. When Guild people walk through, it reads double." }
          - kosul: { bayrak: "lonca_sozlesmesi_yirtildi" }
            anlati: true
            metin: { tr: "Pala seni görünce elini önlüğünün cebine götürüyor. Orada, katlanıp saklanmış, yırtık bir sözleşmenin parçaları duruyor.", en: "When Cleaver sees you, he touches his apron pocket. The pieces of a torn-up contract are in there, folded." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "t̷urnike seni okursa ekranı patlar. ya da patlamaz, yalan söyler. ikisi de eğlenceli olur.", en: "i̷f that turnstile reads you, the screen pops. or it doesn't, and it lies. both would be fun." }
        secenekler:
          - id: "duvar"
            etiket: { tr: "Şartı kabul et: su karşılığı duvar", en: "Take the deal: water for walls" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { lonca: 8, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "{yer:kiyikent_liman|in} suyunu Lonca'nın duvarlarıyla takas ettin; rıhtıma Lonca bantlı adamlar yerleşti.", en: "You traded {yer:kiyikent_liman|pos} water for the Guild's walls. Men in Guild armbands moved onto the docks." }
            sonraki: "siginak_2_su_son"
          - id: "borc"
            etiket: { tr: "\"{npc:kaya_demir}, bana bir borcun var.\"", en: "\"{npc:kaya_demir}, you owe me one.\"" }
            goster: { npc_hayatta: "kaya_demir" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 25 } } }
            etkiler:
              - bayrak: "su_paylasildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - iliski: { kaya_demir: { saygi: -2, guven: 2 } }
            kronik: { tr: "{npc:kaya_demir|in} sana olan borcunu {yer:kiyikent_liman|in} suyuyla tahsil ettin.", en: "You collected on {npc:kaya_demir|pos} debt to you in {yer:kiyikent_liman|pos} water." }
            sonraki: "siginak_2_su_son"
          - id: "turnike"
            tur: "gosteris"
            etiket: { tr: "Turnikeyi yerinden sök, Pala'nın önüne at", en: "Rip the turnstile out and drop it at Cleaver's feet" }
            gerekli: { stat: { str: 70 } }
            etkiler:
              - bayrak: "su_paylasildi"
              - bayrak: "pala_kini"
              - dikkat: 4
              - degisken: { hayatta_kalan: 3, lonca_golgesi: 1 }
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { lonca: -6, siginak: 6 }
              - iliski: { kaya_demir: { saygi: 5, guven: -3 } }
            kronik: { tr: "Pınarbaşı'nın turnikesini söküp Pala'nın ayaklarının dibine attın; su bedava aktı, Pala'nın kini de o gün başladı.", en: "You tore Pinewell's turnstile out of the concrete and dropped it at Cleaver's feet. The water ran free, and Cleaver's grudge started that day." }
            sonraki: "siginak_2_su_son"
          - id: "baska_yol"
            etiket: { tr: "\"Başka bir yol bulacağım.\"", en: "\"I'll find another way.\"" }
            gerekli: { stat: { per: 55 } }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { lonca: -2 }
            kronik: { tr: "Lonca'nın masasından kalkıp şehrin altındaki suya gittin.", en: "You got up from the Guild's table and went after the water under the city." }
            sonraki: "siginak_2_su_sarnic"
          - id: "saldir"
            etiket: { tr: "Pazarlık bitti; istasyonu al", en: "Done haggling. Take the station" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 1 }
              - itibar: { lonca: -4 }
            kronik: { tr: "Lonca'nın masasını devirip istasyona saldırdın.", en: "You flipped the Guild's table and went for the station." }
            sonraki: "siginak_2_su_baskin"

      - id: "siginak_2_su_baskin"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pınarbaşı'nın tel örgüsüne vardığında Lonca'nın tahsildarları seni çoktan bekliyor; biri onlara haber uçurmuş. Ellerinde kepenk sacından kalkanlar, çivili sopalar, bir de kaynak makinesinden bozma bir alev tüpü var.", en: "By the time you hit the Pinewell fence, the Guild's collectors are already waiting. Somebody tipped them off. They've got shields cut out of storefront shutters, nail bats, and a flamethrower hacked together from a welding rig." }
          - { tr: "Pala bir adım geride, taburesinde oturuyor. \"Öldürme onları,\" diyor sakin sakin, sana iyilik ediyormuş gibi. \"Patron öldüklerini duyarsa savaş çıkar. Sen savaş istemiyorsun, su istiyorsun.\"", en: "Cleaver hangs back on his stool. \"Don't kill 'em,\" he says, nice and calm, like he's doing you a favor. \"If the boss hears they're dead, it's war. You don't want war. You want water.\"" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Tahsildarların ikisi on dokuz yaşında bile değil. Alev tüpünün vanası sızdırıyor.", en: "Two of those collectors aren't even nineteen. The flamethrower's valve is leaking." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kemiklerini kır ama kimseyi öldürme", en: "Break bones. Kill nobody" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["lonca_tahsildari@oyuncu-2", "lonca_tahsildari@oyuncu-2", "lonca_tahsildari@oyuncu-3"], ortam: ["yanici"], kazan: "siginak_2_su_baskin_zafer", kaybet: "siginak_2_su_baskin_yenilgi", kac: "siginak_2_su_baskin_yenilgi" }
            kronik: { tr: "Pınarbaşı'nda tahsildarların kemiklerini kırmaya ama hiçbirini öldürmemeye karar verdin.", en: "At Pinewell, you set out to break the collectors' bones and kill none of them." }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Tek bir bakışla silahlarını bıraktır", en: "Make them drop their weapons with one look" }
            gerekli: { stat: { wil: 70 } }
            etkiler:
              - dikkat: 5
              - ahlak: { merhamet: 2, insanlik: -2 }
              - itibar: { lonca: -4, siginak: 2 }
            kronik: { tr: "Lonca'nın tahsildarları tek bakışınla silahlarını bıraktı; Pala da o gün korkunun ne olduğunu öğrendi.", en: "The Guild's collectors took one look at you and dropped their weapons. Cleaver found out what fear was that day." }
            sonraki: "siginak_2_su_baskin_zafer"
          - id: "geri"
            etiket: { tr: "Geri çekil; Lonca'nın şartını dinle", en: "Back off. Hear out the Guild's terms" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "Pınarbaşı'nın kapısından geri dönüp Lonca'nın şartını dinledin.", en: "You turned around at the Pinewell gate and listened to the Guild's terms." }
            sonraki: "siginak_2_su_istasyon"

      - id: "siginak_2_su_baskin_zafer"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tahsildarlar yerde inleyip duruyor. Pala taburesinden kalkmıyor bile; balık bıçağını kınına sokup kulübenin anahtarını sana fırlatıyor.", en: "The collectors are groaning on the ground. Cleaver doesn't get up off his stool. He just slides the fish knife into its sheath and tosses you the pump house key." }
          - { tr: "\"Al suyunu,\" diyor. \"Faturayı sonra keseriz. Biz her şeyin faturasını keseriz, biliyorsun.\"", en: "\"Take your water,\" he says. \"We'll send the bill later. We send a bill for everything, and you know it.\"" }
        secenekler:
          - id: "ac"
            etiket: { tr: "Vanaları aç; su herkesin", en: "Open the valves. The water's everyone's" }
            etkiler:
              - bayrak: "su_istasyonu_basildi"
              - bayrak: "pala_kini"
              - degisken: { hayatta_kalan: 3, lonca_golgesi: 1 }
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { lonca: -10, siginak: 6 }
            kronik: { tr: "Pınarbaşı'nın vanalarını herkese açtın; Pala faturayı sonra keseceklerini söyledi.", en: "You opened Pinewell's valves to everyone. Cleaver said the bill would come later." }
            sonraki: "siginak_2_su_son"
          - id: "teslim"
            etiket: { tr: "İstasyonu Konsey'e teslim et, nöbetçi koy", en: "Hand the station to the Council and post a guard" }
            etkiler:
              - bayrak: "su_istasyonu_basildi"
              - bayrak: "pala_kini"
              - degisken: { hayatta_kalan: 2, lonca_golgesi: 1 }
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { lonca: -10, siginak: 5 }
            kronik: { tr: "Pınarbaşı Konsey'in oldu; kapısında artık turnike değil, bir nöbet çizelgesi asılıydı.", en: "Pinewell went to the Council. There was a watch roster on the gate now instead of a turnstile." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_baskin_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kimseyi öldürmemeye çalışmak, öldürmeye çalışmaktan zor iş. Yumruğunu bir an tuttuğun sırada alev tüpü sırtında patlıyor; kendine geldiğinde yüzün tozda, ensende bir çizme.", en: "Trying not to kill anybody is harder than trying to. You pull one punch, and in that second the flamethrower goes off across your back. When you come to, your face is in the dirt and there's a boot on your neck." }
          - { tr: "\"Gördün mü,\" diyor Pala, çömelip yüzüne bakarak. \"Şartlar bunun için var.\" Ertesi sabah Konsey Lonca'nın şartını imzalıyor. Su geliyor; ardından rıhtıma Lonca'nın adamları da.", en: "\"See,\" Cleaver says, crouching down to look you in the face. \"This is why there are terms.\" The next morning the Council signs the Guild's deal. The water comes. So do the Guild's men, onto the docks." }
        secenekler:
          - id: "kabullen"
            etiket: { tr: "Kalk; suyun gelmesi yeter", en: "Get up. The water's coming. That's enough" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { lonca: 3 }
            kronik: { tr: "Pınarbaşı'nda yenildin ve suyun Lonca'nın şartıyla gelmesine razı oldun.", en: "You lost at Pinewell and settled for the water coming on the Guild's terms." }
            sonraki: "siginak_2_su_son"
          - id: "hatirla"
            etiket: { tr: "Pala'nın yüzünü iyice ezberle", en: "Memorize Cleaver's face. Every inch" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - bayrak: "pala_kini"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { merhamet: -2, duzen: -1 }
            kronik: { tr: "Pınarbaşı'nın tozunda yüzüstü yatarken Pala'nın yüzünü ezberledin.", en: "Face down in the Pinewell dirt, you memorized Cleaver's face." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_sarnic"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|de} eski bir hanın bodrumundaki çatlaktan aşağı süzülüyorsun. Altında bin beş yüz yıllık bir sarnıç uzanıyor: sıra sıra sütunlar, kubbe kubbe tonozlar, dizine kadar kapkara, buz gibi su.", en: "You go down through a crack in the cellar of an old {yer:eski_sehir} building, past the buried 1890s storefronts the tour guides used to show off, and keep going. Below them is the original city reservoir: brick vaults on cast-iron columns, row after row, and black, ice-cold water up to your knees." }
          - { tr: "Sütunlardan birinin dibinde baş aşağı konmuş, gözlerini yosun bürümüş bir taş baş duruyor. Suyun yüzünde halkalar yayılıyor; ama onları taş değil, canlı bir şey çıkarıyor.", en: "At the base of one column there's a carved stone face, set upside down, its eyes furred with moss. On the water, rings are spreading, and they aren't coming from the stone." }
          - { tr: "Halkaların ortasından bir şey doğruluyor: sütunlar boyunda, sudan ve kireçten bir gövde; içine yüzyıllardır atılan paralar, dilek kâğıtları gömülmüş. Sarnıç kendine bir bekçi edinmiş.", en: "Something straightens up out of the middle of the rings, tall as the columns, made of water and limescale, with a century of tossed coins and wish notes caked into its body. The reservoir's grown itself a warden." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Sarnıç Bekçisi", en: "[ANALYSIS] Cistern Warden" }
            satirlar:
              - { tr: "Su hacmi: 80.000 m³. Kirlilik: yok. Bekçi: var.", en: "Water volume: 21 million gallons. Contamination: none. Warden: present." }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Bekçinin göğsünde, paraların arasında tek bir çekirdek atıyor. Gövdesinin geri kalanı sudan ibaret; çekirdeği kırarsan sarnıç durulur.", en: "In the warden's chest, among the coins, a single core is beating. The rest of it is just water. Break the core and the cistern goes still." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u şehir senden önce de su için savaştı. bu taşlar o savaşı hatırlıyor. bekçi de.", en: "t̷his city fought over water before you were born. these stones remember. so does the warden." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçiyle savaş; sarnıç şehrin olsun", en: "Fight the warden. The cistern goes to the city" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["sarnic_bekcisi@oyuncu+3"], ortam: ["su", "karanlik"], kazan: "siginak_2_su_sarnic_zafer", kaybet: "siginak_2_su_sarnic_yenilgi", kac: "siginak_2_su_sarnic_yenilgi" }
            kronik: { tr: "Şehrin altındaki sarnıcın bekçisiyle karanlıkta dövüştün.", en: "You fought the warden of the cistern under the city, in the dark." }
          - id: "para"
            etiket: { tr: "Bir bozukluk at ve bir dilek tut", en: "Toss a coin and make a wish" }
            gerekli: { stat: { wis: 60 } }
            etkiler:
              - bayrak: "sarnic_dilegi"
              - ahlak: { insanlik: 4, merhamet: 1 }
              - savas: { dusmanlar: ["sarnic_bekcisi@oyuncu+1"], ortam: ["su", "karanlik"], kazan: "siginak_2_su_sarnic_zafer", kaybet: "siginak_2_su_sarnic_yenilgi", kac: "siginak_2_su_sarnic_yenilgi" }
            kronik: { tr: "Bekçiye bir bozukluk atıp bir dilek tuttun; bekçi seni bir hırsız değil, bir dilekçi olarak karşıladı.", en: "You tossed the warden a coin and made a wish. It met you as a petitioner instead of a thief." }
          - id: "cekirdek"
            tur: "gosteris"
            etiket: { tr: "Suya dal; çekirdeği tek hamlede çıkar", en: "Dive in and pull the core in one move" }
            gerekli: { stat: { agi: 75 } }
            etkiler:
              - dikkat: 4
              - ahlak: { duzen: 2, merhamet: 2 }
              - esya: { sarnic_suyu: 1 }
            kronik: { tr: "Sarnıcın bekçisinin kalbini tek hamlede söktün; şehrin en eski suyu bir saniyede senin oldu.", en: "You tore the cistern warden's heart out in one move. The city's oldest water was yours in a second flat." }
            sonraki: "siginak_2_su_sarnic_zafer"

      - id: "siginak_2_su_sarnic_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bekçi çöküyor; gövdesindeki paralar şıngır şıngır suya yağıyor ve sarnıç yüz yıldır ilk kez duruluyor. Su öyle berrak ki dipteki bozuklukların üstündeki tarihleri okuyabiliyorsun.", en: "The warden collapses, the coins in its body raining down into the water, and for the first time in a century the cistern is still. The water's so clear you can read the dates on the coins at the bottom." }
          - { tr: "Konsey'in borucuları ertesi gün aşağı iniyor. Üç gün sonra {yer:eski_sehir|in} meydanında yıllardır kuru duran mermer çeşmeden su akmaya başlıyor; kuyruktaki insanlar gözyaşlarını tutamıyor.", en: "The Council's pipe crews come down the next day. Three days later, the old marble drinking fountain in the {yer:eski_sehir} square, dry for decades, starts to run, and people in line start crying." }
        secenekler:
          - id: "herkese"
            etiket: { tr: "\"Bu çeşme herkesin. Tel örgüsü yok.\"", en: "\"This fountain's for everyone. No fence.\"" }
            etkiler:
              - bayrak: "sarnic_acildi"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 5, duzen: -1 }
              - itibar: { siginak: 6 }
              - esya: { sarnic_suyu: 2 }
            kronik: { tr: "Şehrin altındaki suyu eski bir çeşmeden bütün {yer:kiyikent|e} açtın; önüne tel örgü çekilmedi.", en: "You opened the water under the city to all of {yer:kiyikent} through one old fountain, with no fence around it." }
            sonraki: "siginak_2_su_son"
          - id: "konsey"
            etiket: { tr: "\"Sarnıç Konsey'in. Dağıtımı onlar yapar.\"", en: "\"The cistern belongs to the Council. They hand it out.\"" }
            etkiler:
              - bayrak: "sarnic_acildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 8 }
              - esya: { sarnic_suyu: 2 }
            kronik: { tr: "Sarnıcı Konsey'e verdin; Sığınak'ın elinde artık topraktan fışkıran bir güç vardı.", en: "You gave the cistern to the Council. Now the Haven had power that came up out of the ground." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_sarnic_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bekçi seni sütunlardan birine çarpıp sarnıcın dibine bastırıyor. Ciğerlerin suyla dolarken yukarıda, yüzeyde, bozuklukların ışıltısı giderek uzaklaşıyor.", en: "The warden slams you into a column and pins you to the bottom of the cistern. While your lungs fill, the glitter of the coins on the surface drifts farther and farther away." }
          - { tr: "Sonra bırakıyor. Nedenini bilmiyorsun: belki seni dilekçi sandı, belki de yalnızca yoruldu. Kendine geldiğinde merdivenlerde öksürüp duruyorsun. Sarnıç kapalı kalıyor; Konsey ertesi gün Lonca'nın şartını imzalıyor.", en: "Then it lets go. You don't know why. Maybe it mistook you for a petitioner. Maybe it just got tired. You come to on the stairs, coughing. The cistern stays shut, and the next day the Council signs the Guild's deal." }
        secenekler:
          - id: "geri_don"
            etiket: { tr: "\"Bir gün geri geleceğim.\"", en: "\"I'll be back for you someday.\"" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 1 }
              - ahlak: { duzen: 1, insanlik: 2 }
            kronik: { tr: "Sarnıcın bekçisine yenildin; {yer:kiyikent_liman|in} suyu o yaz Lonca'nın turnikesinden geçti.", en: "You lost to the cistern warden. That summer, {yer:kiyikent_liman|pos} water came through the Guild's turnstile." }
            sonraki: "siginak_2_su_son"
          - id: "para_birak"
            etiket: { tr: "Merdivene bir bozukluk bırak", en: "Leave a coin on the stairs" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 1 }
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Seni boğmadan bırakan sarnıcın merdivenine bir bozukluk bıraktın.", en: "You left a coin on the stairs of the cistern that let you go." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_tuzla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tuzla mavnasının makine dairesi fırın gibi. Zar tüpleri patlamış, tuzdan kabuk bağlamış. Ellerini üstlerine koyunca önünde küçük, mavi bir pencere açılıyor: [Tuzla Arıtma Ünitesi · Durum: Bozuk].", en: "The Saltwater barge's engine room is an oven. The membrane tubes have blown and crusted over with salt, and when you lay your hands on them a small blue window pops open in front of you: [Saltwater Desalination Unit · Status: Broken]." }
          - { tr: "Manayı avuçlarından borulara itiyorsun. Tuz kabuğu çatlıyor, tüpler içten dolup şişerken pencere titremeye başlıyor; Sistem bir şeyin sebepsiz yere iyileşmesinden hoşlanmaz.", en: "You push mana out through your palms and into the pipes. The salt crust cracks, the tubes swell from the inside, and the window shudders. The System doesn't like things getting better for no reason." }
          - metin: { tr: "{npc:yanki} pencerenin kenarından içeri sızıyor. Durum satırındaki 'Bozuk' kelimesi kendiliğinden siliniyor, yerine kimsenin yazmadığı bir başkası geliyor.", en: "{npc:yanki} seeps in at the edge of the window. The word \"Broken\" in the status line erases itself, and a word nobody typed takes its place." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Mavnanın çıkış borusundan önce kahverengi, ardından bulanık, en sonunda berrak bir su akmaya başlıyor. Rıhtımdaki biri bardağını doldurup içiyor; sonra boş bardak elinde, öylece kalakalıyor.", en: "The barge's outflow pipe coughs up brown water, then cloudy, then clear. Somebody on the quay fills a cup, drinks it, and just stands there with the empty cup in his hand." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[Tuzla Arıtma Ünitesi · Durum: İ̷nat]", en: "[Saltwater Desalination Unit · Status: S̷tubborn]" }
            satirlar:
              - { tr: "sistem bunu düzeltmeye çalışacak. izin verme.", en: "the system's going to try to fix this. don't let it." }
        secenekler:
          - id: "bedava"
            etiket: { tr: "\"Bu su bedava. Herkese.\"", en: "\"This water's free. For everyone.\"" }
            etkiler:
              - bayrak: "tuzdan_su"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 5, insanlik: 1 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Tuzla mavnasını kendi ellerinle yeniden çalıştırdın ve suyunu herkese bedava açtın.", en: "You got the Saltwater barge running again with your own hands and made its water free for everyone." }
            sonraki: "siginak_2_su_son"
          - id: "bekci"
            etiket: { tr: "\"Mavnanın bekçisi ben olacağım.\"", en: "\"I'll be the barge's keeper.\"" }
            etkiler:
              - bayrak: "tuzdan_su"
              - bayrak: "su_bekcisi"
              - degisken: { hayatta_kalan: 3 }
              - dikkat: 2
              - ahlak: { duzen: 4, insanlik: -2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "{yer:kiyikent_liman|in} suyunu senin elin akıttı; musluğun başına da sen geçtin.", en: "Your hand made {yer:kiyikent_liman|pos} water run, and you made yourself keeper of the tap." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Biri kalkış panosundaki kırmızı satırı beyaza boyuyor. SU yazısının yanına artık gün sayısı değil, tek bir kelime çevriliyor: VAR.", en: "Somebody paints over the red line on the departures board in white. Next to WATER they don't flip a number of days anymore. They flip a word: YES." }
          - metin: { tr: "Rıhtım boyunca Lonca bantlı adamlar dolaşıyor; su onlarla geldi, onlar da kalacak. Rıza Reis onlara selam vermiyor.", en: "Men in Guild armbands walk the length of the docks. The water came with them, and they're staying. Skipper Reese doesn't wave." }
            kosul: { bayrak: "su_lonca_anlasmasi" }
          - metin: { tr: "{yer:sanayi|den} gelen haberler iç açıcı değil. Pala her sabah Pınarbaşı'nın kapısında, turnikenin söküldüğü boşluğun önünde durup bir şeyler mırıldanıyormuş; ne dediğini kimse bilmiyor.", en: "The word out of {yer:sanayi} is ugly. Every morning, Cleaver supposedly stands at the Pinewell gate, in front of the empty spot where the turnstile used to be, and mutters something. Nobody knows what." }
            kosul: { bayrak: "pala_kini" }
          - metin: { tr: "Gümrük'teki koğuşta {npc:elif_sari} bir hastaya ilk kez ölçmeden bir bardak su veriyor. Seni görünce bardağı kadeh kaldırır gibi havaya kaldırıyor.", en: "In the ward in the Customs House, {npc:elif_sari} hands a patient a glass of water without measuring it for the first time. When she sees you, she raises the glass like a toast." }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Su Getiren]", en: "[TITLE: Water-Bringer]" }
            satirlar:
              - { tr: "Bir şehrin susuzluğunu sona erdirdin. Sistem bunu 'beklenmedik kaynak tahsisi' olarak kaydetti.", en: "You ended a city's thirst. The System logged it as \"unexpected resource allocation.\"" }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Bidonları {yer:kordon|e} ve {yer:tepe|in} eteğine de taşı", en: "Haul cans out to {yer:kordon} and {yer:tepe}" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6, yukselenler: 2 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Su savaşlarında payları nasıl böldüğün gümrük binasının merdivenlerinde konuşuluyor.", en: "How you split the water during the water wars is the talk of the customs house steps." } }
            kronik: { tr: "Bidonları {yer:kiyikent_liman|in} tel örgüsünün dışına, {yer:kordon|e} ve {yer:tepe|in} eteğine kadar taşıdın.", en: "You hauled water past {yer:kiyikent_liman|pos} fence, out to {yer:kordon} and the foot of {yer:tepe}." }
            sonraki: "@akis"
          - id: "once_liman"
            etiket: { tr: "\"Önce {yer:kiyikent_liman}. Artarsa başkalarına.\"", en: "\"The Waterfront first. Others get what's left.\"" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: -2 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Su savaşlarında payları nasıl böldüğün gümrük binasının merdivenlerinde konuşuluyor.", en: "How you split the water during the water wars is the talk of the customs house steps." } }
            kronik: { tr: "Suyu önce {yer:kiyikent_liman|e} ayırdın; tel örgünün dışındakilere ancak artan kalacaktı.", en: "You kept the water for {yer:kiyikent_liman} first. The people past the fence would get whatever was left." }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "\"Her litre kayda geçsin. Saklayan cezalansın.\"", en: "\"Log every liter. Hoarders get punished.\"" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 5, merhamet: 1 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" }, hatirlatma: { tr: "Su savaşlarında payları nasıl böldüğün gümrük binasının merdivenlerinde konuşuluyor.", en: "How you split the water during the water wars is the talk of the customs house steps." } }
            kronik: { tr: "{yer:kiyikent_liman|in} suyunun her litresini kayda geçirttin ve saklayanların cezalandırılacağını duyurdun.", en: "You had every liter of {yer:kiyikent_liman|pos} water logged and let it be known that hoarders would be punished." }
            sonraki: "@akis"

  # ================================================================== ELİF 2 — GECE NÖBETİ (P2–3; aşk yayı: elif_ask)
  # İnce tutulur, asla ilan edilmez: bir omuz, bir saat, bir çay. elif_ask yalnızca güven + bağlılık + merhametle açılır.
  - id: "elif_gece_nobeti"
    konum: ["kiyikent_liman"]
    perde: [2, 3]
    gun: { min: 140, max: 250 }
    agirlik: 7
    kosul: { bayrak: "elif_oylamasi_bitti", bayrak_yok: "elif_gece_nobeti_bitti" }
    etiketler: ["siginak", "npc", "hastane", "nefes"]
    gerilim: 2
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Mavi ateş", en: "The blue fever" }
    sahne: "elif_gece_nobeti_1"
    sahneler:
      - id: "elif_gece_nobeti_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük binasının merdivenlerinde dudakları morarmış insanlar oturmuş öksürüyor. Koğuşta hastalığa çoktan bir ad takmışlar: mavi ateş. Yarık suyundan bulaşıyor; üç günde iki yüz kişiyi yatağa düşürmüş.", en: "People are sitting on the Customs House steps, coughing, their lips gone blue. The ward already has a name for it: the blue fever. It comes from rift water, and in three days it's put two hundred people in bed." }
          - { tr: "İçeride {npc:elif_sari} başhemşire Nurhan'a bağırıyor. Bağırdığının farkına varınca susup iki elini yüzüne kapatıyor, parmaklarının arasından \"Özür dilerim\" diyor. Nurhan'ın, o duymasın diye sana fısıldadığına göre elli saattir gözünü kırpmamış.", en: "Inside, {npc:elif_sari} is yelling at Nora, her head nurse. Then she catches herself, stops, puts both hands over her face, and says \"I'm sorry\" through her fingers. She hasn't slept in fifty hours. Nora whispers that to you so she won't hear." }
          - metin: { tr: "Konsey'in başına geçtiğinden beri gündüzü gişede, gecesi burada geçiyor. Arada bir yerde uyuması gerek; o yeri henüz bulamamış.", en: "Since she took the Council's chair, it's the ticket window by day and the ward by night. She's supposed to sleep somewhere in between. She hasn't found where yet." }
            kosul: { bayrak: "elif_konsey_basi" }
          - { tr: "Seni görünce ellerini yüzünden çekiyor. \"Yorulmayan birine ihtiyacım var,\" diyor. \"Sen yorulmuyorsun, gördüm.\"", en: "When she sees you, she drops her hands. \"I need somebody who doesn't get tired,\" she says. \"You don't get tired. I've seen it.\"" }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Hastaların hepsi {yer:kiyikent_liman|in} doğu ucundaki aynı su tankından içmiş. Tankın vanasında mavi bir yosun ışıldıyor.", en: "Every one of these patients drank from the same tank at the east end of {yer:kiyikent_liman}. There's blue algae glowing on its valve." }
          - kosul: { stat: { wis: 90 } }
            metin: { tr: "Bu ateş bir mana zehri. İnsan vücudundan çekilip alınabilir; yeter ki onu taşıyacak kadar büyük bir kap bulunsun.", en: "The fever is a mana poison. It can be drawn out of a human body, into a big enough vessel." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ da sayıyor; elli saattir. sayılar bitince ne olacak, merak ediyorum.", en: "s̷he's counting too. fifty hours now. i wonder what happens when she runs out of numbers." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben çocuk koğuşunu alırım. Onlara... onlara bir şey anlatırım. Bir şey uydururum.\"", en: "\"I'll take the kids' ward. Tell them... something. I'll make something up.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Her hastanın suyu nereden içtiğini haritaya dökebilirim. Ortak noktayı bulursak kaynağı da buluruz.\"", en: "\"I can map out where every patient got their water. Find the overlap, find the source.\"" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "\"Sabaha kadar buradayım.\"", en: "\"I'm here till morning.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
            kronik: { tr: "Gümrük'teki koğuşta, mavi ateşin ortasında sabahı ettin.", en: "On the night of the blue fever, you stayed on the Customs House ward till morning." }
            sonraki: "elif_gece_nobeti_nobet"
          - id: "ates"
            tur: "gosteris"
            etiket: { tr: "Ateşi ellerinle hastalardan çek", en: "Draw the fever out of them with your hands" }
            gerekli: { stat: { wis: 90 } }
            etkiler:
              - bayrak: "ates_cekildi"
              - bayrak: "ece_yasadi"
              - dikkat: 5
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 4, insanlik: -2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, korku: 4 } }
            kronik: { tr: "İki yüz kişinin ateşini avuçlarınla kendi damarlarına çektin; o gece Gümrük'te kimse ölmedi, kimse de bunu açıklayamadı.", en: "You pulled two hundred people's fever into your own veins through your palms. Nobody in the Customs House died that night, and nobody could explain it." }
            sonraki: "elif_gece_nobeti_ates"
          - id: "kaynak"
            etiket: { tr: "Ateşin kaynağını bul: doğu tankı", en: "Find the source of the fever: the east tank" }
            gerekli: { stat: { per: 60 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Koğuşta beklemek yerine ateşin kaynağına yürüdün.", en: "Instead of waiting on the ward, you went after the source of the fever." }
            sonraki: "elif_gece_nobeti_kaynak"
          - id: "uyu"
            etiket: { tr: "\"Sen uyu. Koğuş bende.\"", en: "\"You sleep. I've got the ward.\"" }
            gerekli: { iliski_min: { elif_sari: { guven: 30 } } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Elli saattir uyumayan bir hekime uyumasını söyledin; o da sonunda dinledi, ama kendi yöntemiyle.", en: "You told a doctor who hadn't slept in fifty hours to go to sleep. In the end she listened, in her own way." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "ret"
            etiket: { tr: "\"Benim işim değil.\"", en: "\"Not my job.\"" }
            etkiler:
              - bayrak: "elif_mesafe"
              - ahlak: { merhamet: -3, insanlik: -2 }
              - iliski: { elif_sari: { baglilik: -5, guven: -3 } }
            kronik: { tr: "Mavi ateş gecesinde Gümrük'ün kapısından geri döndün; hekim seni durdurmadı.", en: "On the night of the blue fever, you turned back at the Customs House door. The doctor didn't stop you." }
            sonraki: "elif_gece_nobeti_ret"

      - id: "elif_gece_nobeti_ret"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"O zaman git,\" diyor {npc:elif_sari}, başını kaldırmadan. Elleri bir serum torbasını asmakla meşgul; titremiyor bile.", en: "\"Then go,\" {npc:elif_sari} says, without looking up. Her hands are busy hanging an IV bag. They aren't shaking." }
          - { tr: "Merdivenlerden inerken arkandan bir öksürük geliyor, ardından bir başkası, derken bir çocuk ağlaması. Kapı arkandan kapanınca sesler kesiliyor; ama tam değil.", en: "On your way down the steps you hear a cough behind you, then another, then a kid crying. When the door shuts behind you the sounds stop. Not all the way." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - ahlak: { merhamet: -1, duzen: 1 }
            kronik: { tr: "Gümrük'ün merdivenlerinden geriye bakmadan indin.", en: "You walked down the Customs House steps without looking back." }
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Merdivendekilere birer şişe su bırak", en: "Leave a bottle of water for each of them on the steps" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { elif_sari: { guven: 1 } }
            kronik: { tr: "Koğuşa girmedin ama merdivendeki her hastaya bir şişe su bıraktın.", en: "You didn't go into the ward, but you left a bottle of water for every patient on the steps." }
            sonraki: "@akis"

      - id: "elif_gece_nobeti_nobet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Saat gecenin üçü. Koğuşun ışıkları kısılmış, öksürükler nefes alıp verir gibi yükselip alçalıyor. {npc:elif_sari} ile yataktan yatağa geçiyorsunuz: o ateşi ölçüyor, sen yazıyorsun; o bantların rengini değiştiriyor, sen rulodan bant kesiyorsun.", en: "Three in the morning. The ward lights are down, and the coughing rises and falls like breathing. You and {npc:elif_sari} go cot to cot. She takes temperatures, you write them down. She changes the color of the tape, you tear it off the roll." }
          - { tr: "Pencerenin dibindeki yatakta yedi yaşındaki Ece yatıyor; ateşi kırk bir. Dudakları artık mor değil, griye çalıyor. Serum tükendi: Gümrük'teki son torba bir saat önce takıldı.", en: "In the cot under the window is a seven-year-old named Evie, fever at a hundred and five point eight. Her lips aren't blue anymore. They're going gray. The fluids are gone. The last bag in the building went up an hour ago." }
          - { tr: "{npc:elif_sari} kızın bileğini tutup uzun süre hiçbir şey söylemiyor. Sonra sana bakıyor. Bu bakışı tanıyorsun; yemek katında da sana böyle bakmıştı.", en: "{npc:elif_sari} holds the girl's wrist and doesn't say anything for a long time. Then she looks at you. You know that look. She looked at you like that in the food court, too." }
        sezgiler:
          - kosul: { stat: { end: 90 } }
            metin: { tr: "Senin kanın bu ateşi yakıp söndürür. Damarlarında dolaşan şey artık tam anlamıyla kan sayılmaz.", en: "Your blood would burn this fever out. What's running in your veins isn't exactly blood anymore." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷ızın penceresi kararıyor. sistem onu çoktan bir satıra çevirdi. o satırı silmek mi istersin, okumak mı?", en: "t̷he girl's window is going dark. the system's already turned her into a line item. do you want to erase the line, or read it?" }
        secenekler:
          - id: "kan"
            tur: "gosteris"
            etiket: { tr: "Kolunu uzat: \"Kanımı ver ona.\"", en: "Hold out your arm: \"Give her my blood.\"" }
            gerekli: { stat: { end: 90 } }
            etkiler:
              - bayrak: "ece_yasadi"
              - dikkat: 3
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 5, guven: 5 } }
            kronik: { tr: "Mavi ateşten ölmek üzere olan bir çocuğa kendi kanını verdin; Ece ölümün kıyısından döndü.", en: "You gave your own blood to a little girl dying of the blue fever. Evie came back from the edge." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "cagir"
            etiket: { tr: "\"Bir şey dene. Ne olursa. Ben tutarım.\"", en: "\"Try something. Anything. I'll hold her.\"" }
            etkiler:
              - bayrak: "ece_yasadi"
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "Bir hekimin son çaresini denemesi için çocuğu sen tuttun; çocuk yaşadı, hekim yığılıp kaldı.", en: "You held the child still so a doctor could try her last trick. The kid lived. The doctor dropped where she stood." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "el"
            etiket: { tr: "Ece'nin elini tut ve ona bir masal anlat", en: "Hold Evie's hand and tell her a story" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Mavi ateşte bir çocuğun elini tutup ona son masalını anlattın.", en: "You held a child's hand through the blue fever and told her the last story she ever heard." }
            sonraki: "elif_gece_nobeti_kayip"

      - id: "elif_gece_nobeti_ates"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini ilk yataktaki çocuğun alnına koyuyorsun. Mavilik, kâğıda yayılan mürekkep gibi onun derisinden parmaklarına akıyor; önce bileğindeki, ardından dirseğindeki, en sonunda omzundaki damarların ışımaya başlıyor.", en: "You lay your hand on the forehead of the kid in the first cot. The blue runs out of their skin and into your fingers like ink soaking into paper. The veins at your wrist start to glow, then your elbow, then your shoulder." }
          - { tr: "Yataktan yatağa geçiyorsun; iki yüz yatak. Saat dörde doğru koğuş sessizliğe gömülmüş, kolların karanlıkta iki mavi fener gibi kendi kendine yanıyor.", en: "Cot to cot. Two hundred cots. By four in the morning the ward is quiet, and your arms are burning on their own in the dark like two blue lanterns." }
          - { tr: "{npc:elif_sari} her şeyi baştan sona izledi. Şimdi gelip bileğini tutuyor, nabzını saymaya başlıyor, sonra bırakıyor. \"Otur,\" diyor. \"Hekim emri. Sana başka bir şey söyleyecek hâlim yok.\"", en: "{npc:elif_sari} watched the whole thing. Now she comes over, takes your wrist, starts counting, and lets go. \"Sit down,\" she says. \"That's a doctor's order. I'm not in any shape to tell you anything else.\"" }
        bildirimler:
          - tur: "durum"
            baslik: { tr: "[Mana zehri emildi ×200]", en: "[Mana toxin absorbed ×200]" }
            satirlar:
              - { tr: "Etki: yok. Sistem bu sonucu beklemiyordu.", en: "Effect: none. The System was not expecting that result." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Otur. Emre uy.", en: "Sit down. Follow orders." }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "İki yüz kişiyi iyileştirdikten sonra bir hekimin emriyle oturdun.", en: "After you healed two hundred people, you sat down because a doctor told you to." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "isik"
            etiket: { tr: "Kollarının ışığını ona göster: \"Korkma.\"", en: "Show her the light in your arms: \"Don't be scared.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { elif_sari: { korku: -3, baglilik: 4 } }
            kronik: { tr: "Kollarındaki mavi ışığı bir hekime gösterip korkmamasını istedin; korkmadı, en azından o gece.", en: "You showed a doctor the blue light in your arms and asked her not to be afraid. She wasn't. Not that night, anyway." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_kaynak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Doğu tankı {yer:kiyikent_liman|in} en ucunda, eski bir yakıt deposundan bozma. El fenerini kapaktan içeri tuttuğunda su yüzeyi yerine mavi, kıpır kıpır, canlı bir halıyla karşılaşıyorsun: yarık yosunu.", en: "The east tank sits at the far end of {yer:kiyikent_liman}, converted from an old fuel tank. When you shine your flashlight in through the hatch, you don't see a water surface. You see a blue, squirming, living carpet: rift algae." }
          - metin: { tr: "Tankın yanında bir Lonca su kamyonunun lastik izleri duruyor. Teslimat fişi vanaya bantlanmış: KAYNAK — KULE DİBİ KUYUSU 3. Kule'nin dibindeki kuyulardan su çekmenin yasak olduğunu herkes bilir; ucuza geldiğini de.", en: "There are tire tracks from a Guild water truck next to the tank. The delivery slip is taped to the valve: SOURCE: SPIRE PLAZA WELL 3. Everybody knows you're not supposed to pump from the wells at the foot of the Spire. Everybody also knows it's cheap." }
            kosul: { bayrak: "su_lonca_anlasmasi" }
          - metin: { tr: "Tankın dibindeki betonda saç teli inceliğinde bir yarık açılmış. Kenarları mavi mavi parlayan yarık, tankın içine damla damla başka bir yerin suyunu sızdırıyor.", en: "There's a crack in the concrete at the bottom of the tank, thin as a hair. Its edges glow blue, and drip by drip, it's leaking somewhere else's water into the tank." }
            kosul: { bayrak_yok: "su_lonca_anlasmasi" }
        secenekler:
          - id: "muhurle"
            etiket: { tr: "Tankı boşalt ve yarığı mühürle", en: "Drain the tank and seal the crack" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Mavi ateşin kaynağı olan tankı boşaltıp yarığı mühürledin.", en: "You drained the tank behind the blue fever and sealed the crack." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "fis"
            etiket: { tr: "Teslimat fişini sök; Lonca'ya hesap soracaksın", en: "Peel off the delivery slip. The Guild's going to answer for this" }
            goster: { bayrak: "su_lonca_anlasmasi" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - bayrak: "lonca_kuyu_fisi"
              - degisken: { hayatta_kalan: 2, lonca_golgesi: 1 }
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { siginak: 4, lonca: -5 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 80, max: 110 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Mavi ateşli o geceden beri {npc:elif_sari|in} koğuşu hiç tam uyumadı.", en: "Ever since the night of the blue fire, {npc:elif_sari|pos} ward has never really slept." } }
            kronik: { tr: "Lonca'nın {yer:kiyikent_liman|e} zehirli su sattığını belgeleyen fişi söküp cebine koydun; bunun hesabını Lonca'dan soracaktın.", en: "You peeled off the slip proving the Guild had sold {yer:kiyikent_liman} poisoned water and pocketed it. You meant to make the Guild answer for it." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "sus"
            etiket: { tr: "Tankı mühürle, fişi yak; savaş istemiyorsun", en: "Seal the tank and burn the slip. You don't want a war" }
            goster: { bayrak: "su_lonca_anlasmasi" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Lonca'nın zehirli su sattığını gösteren fişi yaktın; {yer:kiyikent_liman} bundan habersiz kaldı, Lonca ise sana borçlandı.", en: "You burned the slip proving the Guild sold poisoned water. The Waterfront was none the wiser, and the Guild owed you one." }
            sonraki: "elif_gece_nobeti_cokus"

      - id: "elif_gece_nobeti_cokus"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Koğuşa döndüğünde {npc:elif_sari} iki yatağın arasına çömelmiş, bir elini hastanın alnına koymuş. Derken eli kayıyor; ipi kesilmiş bir kukla gibi ağır ağır yana devriliyor.", en: "When you get back to the ward, {npc:elif_sari} is crouched on the floor between two cots with one hand on a patient's forehead. Then the hand slides off and she tips slowly sideways, like somebody cut her strings." }
            kosul: { bayrak_yok: "ece_yasadi" }
          - metin: { tr: "{npc:elif_sari} son çaresini deniyor: bir kemik içi iğnesi, bir şişe tuzlu su, dua gibi mırıldanılan bir sayı. Ece'nin dudaklarına renk gelince hekim iğneyi bırakıp doğruluyor; sonra ipi kesilmiş bir kukla gibi ağır ağır yana devriliyor.", en: "{npc:elif_sari} tries her last trick: a bone needle, a bottle of saline, a number muttered like a prayer. When the color comes back into Evie's lips, the doctor lets go of the needle, straightens up, and tips slowly sideways, like somebody cut her strings." }
            kosul: { bayrak: "ece_yasadi" }
          - { tr: "Yere düşmeden yakalıyorsun onu. Tüy gibi hafif: elli saatlik uykusuzluk, iki bardak çay. Gözlerini açınca ilk sorusu kendisiyle ilgili değil: \"Dördüncü yatak. Ateşi düştü mü?\"", en: "You catch her before she hits the floor. She barely weighs anything. Fifty hours awake and two cups of tea. When she opens her eyes, the first thing she asks isn't about herself: \"Bed four. Did the fever break?\"" }
        secenekler:
          - id: "emir"
            etiket: { tr: "\"Düştü. Şimdi sen yat. Hekim emri.\"", en: "\"It broke. Now you lie down. Doctor's orders.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
            kronik: { tr: "Kendi koğuşunda yığılan hekime kendi cümlesiyle emir verdin.", en: "When the doctor collapsed on her own ward, you gave her an order in her own words." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "cati"
            etiket: { tr: "Onu kucağına alıp çatıya çıkar; biraz hava alsın", en: "Carry her up to the roof for some air" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "Yığılan hekimi kucağında Gümrük'ün çatısına taşıdın.", en: "You carried the doctor up to the Customs House roof in your arms." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_kayip"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Masalın sonunu getiremiyorsun. Şafaktan biraz önce, sen deniz kızının adını söylerken Ece nefes almayı bırakıyor; öyle sessizce ki bir an farkına bile varmıyorsun.", en: "You don't make it to the end of the story. A little before dawn, while you're saying the mermaid's name, Evie stops breathing, so quietly you don't notice for a second." }
          - { tr: "{npc:elif_sari} her zamanki gibi saati yüksek sesle söylüyor; siyah bandı kızın alnına kendi eliyle yapıştırıyor. Sen bir bardak su doldurup yatağın başucuna bırakıyorsun.", en: "{npc:elif_sari} calls the time out loud, like always. She puts the black tape on the girl's forehead herself. You fill a glass of water and set it by the cot." }
          - { tr: "{npc:elif_sari} önce bardağa, sonra sana bakıyor. \"Hatırladın,\" diyor. Sesi çatlıyor; bunu saklamak gibi bir derdi yok.", en: "{npc:elif_sari} looks at the glass, then at you. \"You remembered,\" she says. Her voice breaks, and she doesn't try to hide it." }
        secenekler:
          - id: "cati"
            etiket: { tr: "\"Hadi. Biraz hava alalım.\"", en: "\"Come on. Let's get some air.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
            kronik: { tr: "Ece'nin yatağına bir bardak su bıraktın ve hekimi çatıya çıkardın.", en: "You left a glass of water by Evie's cot and took the doctor up on the roof." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "isim"
            etiket: { tr: "Kızın adını koğuşun tahtasına yaz", en: "Write the girl's name on the ward whiteboard" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "Mavi ateşin aldığı kızın adını koğuşun tahtasına kendi elinle yazdın.", en: "You wrote the name of the girl the blue fever took on the ward whiteboard yourself." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_cati"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'ün çatısında, su deposunun gölgesine oturmuşsunuz. Körfezin üstünde şafak griden pembeye dönerken aşağıda, rıhtımda ilk tekne motorunu öksürtüyor.", en: "You're sitting on the Customs House roof in the shadow of the water tower. Dawn is going from gray to pink over the bay, and down on the quay the first boat coughs its engine awake." }
          - { tr: "\"Entegrasyon olduğunda nöbetteydim,\" diyor {npc:elif_sari}, sana bakmadan. \"Saat üç on dörtte. Acilde otuz bir hasta vardı. Işık geldi, hepsi bir anda gitti; sedyeler boşaldı, monitörler ötmeye başladı. Ben saydım onları. Neden saydım, bilmiyorum.\"", en: "\"I was on shift when Integration hit,\" {npc:elif_sari} says, not looking at you. \"Three fourteen a.m. Thirty-one patients in the ER. The light came and they were gone, all at once. Empty gurneys, monitors beeping. I counted them. I don't know why I counted them.\"" }
          - { tr: "\"O günden beri sayıyorum. Bin dört yüz altı: ilk günden bu yana ellerimin arasında ölenler.\" Kurabiye paketini çıkarıyor; boş, yine de içine bakıyor. \"Sen neyi sayıyorsun?\"", en: "\"I haven't stopped since. One thousand four hundred and six. People who died in my hands since Day Zero.\" She takes out the cookie pack. It's empty. She looks inside anyway. \"What do you count?\"" }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Omzuyla omzun arasında bir karış var. O karışı ne kendisi kapatacak ne de kapanmasını isteyip istemediğini söyleyecek.", en: "Her shoulder is a hand's width from yours. She won't close that gap herself, and she won't tell you whether she wants it closed." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu ben sayamam. dokunmayacağım da.", en: "t̷his is something i can't count. i'm not touching it." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Omzunu ona aç; bir şey söyleme", en: "Make room on your shoulder. Say nothing" }
            gerekli: { iliski_min: { elif_sari: { baglilik: 35, guven: 35 } }, ahlak_min: { merhamet: 10 } }
            etkiler:
              - bayrak: "elif_ask"
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 10, guven: 5 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 45 }
            kronik: { tr: "Bir sabah Gümrük'ün çatısında bir hekim başını omzuna yasladı; ikiniz de buna bir ad koymadınız.", en: "One morning on the Customs House roof, a doctor leaned her head on your shoulder. Neither of you put a name to it." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "sayiyorum"
            etiket: { tr: "\"Ben seni sayıyorum. Her gece, sağ mısın diye.\"", en: "\"I count you. Every night. To make sure you're still here.\"" }
            gerekli: { iliski_min: { elif_sari: { baglilik: 30, guven: 30 } }, ahlak_min: { merhamet: 10 } }
            etkiler:
              - bayrak: "elif_ask"
              - ahlak: { insanlik: 3, merhamet: 3 }
              - iliski: { elif_sari: { baglilik: 8, guven: 6 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 40 }
            kronik: { tr: "Bin dört yüz altı ölüyü sayan bir hekime, her gece onu saydığını söyledin.", en: "You told a doctor who'd counted one thousand four hundred and six dead that you counted her every night." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "kahve"
            etiket: { tr: "\"Kahve getireyim. Gümrük'ün makinesi hâlâ çalışıyor.\"", en: "\"Let me get you a coffee. The machine downstairs still works.\"" }
            etkiler:
              - bayrak: "elif_dostluk"
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 5, baglilik: 3 } }
            kronik: { tr: "Gümrük'ün çatısında bir hekime kahve getirdin; dostluğunuz o bardakta başladı.", en: "You brought a doctor a coffee on the Customs House roof. Your friendship started in that cup." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "uyumuyorum"
            tur: "aciga_vur"
            etiket: { tr: "\"Ben uyumuyorum. Hiç. Entegrasyon'dan beri.\"", en: "\"I don't sleep. At all. Not since Integration.\"" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - dikkat: 2
              - ahlak: { insanlik: 3, duzen: -1 }
              - iliski: { elif_sari: { guven: 6, korku: 2, baglilik: 3 } }
            kronik: { tr: "Bir hekime artık hiç uyumadığını itiraf ettin; o da seni bir vaka gibi değil, bir insan gibi dinledi.", en: "You admitted to a doctor that you don't sleep anymore. She listened to you like a person, not a case." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "mesafe"
            etiket: { tr: "\"Bu konuşma bu çatıda kalsın.\"", en: "\"Let's leave this conversation up here.\"" }
            etkiler:
              - bayrak: "elif_mesafe"
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { elif_sari: { baglilik: -2, saygi: 2 } }
            kronik: { tr: "Bir hekimin sana araladığı kapıyı nazikçe kapattın; aranızdaki o karış yerinde kaldı.", en: "You gently closed the door a doctor had opened for you. That hand's width between you stayed right where it was." }
            sonraki: "elif_gece_nobeti_sabah"

      - id: "elif_gece_nobeti_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Bir süre sonra başı omzuna düşüyor ve elli saattir ilk kez uykuya dalıyor; sen kıpırdamıyorsun bile. Güneş körfezden yükselirken elinde iki bardak çayla çatıya çıkan Nurhan sizi görünce bardakları sessizce yere bırakıp geri iniyor.", en: "After a while her head drops onto your shoulder and she's asleep, for the first time in fifty hours. You don't move. As the sun comes up over the bay, Nora climbs up with two cups of tea, sees you two, sets the cups down without a sound, and goes back downstairs." }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "{npc:elif_sari} kalkıp önlüğünü düzeltiyor, kapıda bir an duraksıyor. \"Bu gece için sağ ol,\" diyor. \"Vizite yedide. İster gel ister gelme; ama gelirsen kahveler senden.\"", en: "{npc:elif_sari} gets up, straightens her coat, and pauses at the door. \"Thanks for the night,\" she says. \"Rounds at seven. Come or don't. But if you come, you're buying the coffee.\"" }
            kosul: { bayrak_yok: "elif_ask" }
          - { tr: "Aşağıda koğuş uyanıyor. Öksürükler seyrelmiş; tahtadaki bantlar bir gecede kırmızıdan sarıya dönmüş.", en: "Down below, the ward is waking up. There's less coughing. Overnight, the tape colors on the board have gone from red to yellow." }
        secenekler:
          - id: "kipirdama"
            etiket: { tr: "Kıpırdama. Bir saat daha.", en: "Don't move. One more hour." }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Bir hekim omzunda uyurken bir saat boyunca kıpırdamadın; {yer:kiyikent_liman} o sabah onsuz idare etti.", en: "A doctor slept on your shoulder and you didn't move for an hour. The Waterfront managed without her that morning." }
            sonraki: "@akis"
          - id: "tasi"
            etiket: { tr: "Onu uyandırmadan yatağına taşı", en: "Carry her to bed without waking her" }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "Uyuyan hekimi yatağına taşıdın ve üstünü örttün; uyandığında kim olduğunu sormadı, biliyordu.", en: "You carried the sleeping doctor to her bed and pulled the blanket up. When she woke, she didn't ask who'd done it. She knew." }
            sonraki: "@akis"
          - id: "vizite"
            etiket: { tr: "Viziteye birlikte in; kahveler senden", en: "Go down to rounds together. Coffee's on you" }
            goster: { bayrak_yok: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
            kronik: { tr: "Mavi ateş gecesinin sabahında hekimle birlikte viziteye indin, iki kahveyle.", en: "On the morning after the blue fever, you went down to rounds with the doctor, carrying two coffees." }
            sonraki: "@akis"
          - id: "kurabiye"
            etiket: { tr: "Boş kurabiye paketinin yerine dolusunu bırak ve git", en: "Swap her empty cookie pack for a full one and go" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "Bir hekimin boş kurabiye paketini dolusuyla değiştirip sessizce çıktın.", en: "You swapped a doctor's empty cookie pack for a full one and slipped out." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 3 — TAHLİYE (P3, AY 205)
  # Elif bu noktadan sonra ölmüş olabilir (darbe); olay onu npc listesine almaz, Elif satırları koşulludur.
  - id: "siginak_3_tahliye"
    konum: ["kiyikent_liman"]
    perde: [3]
    gun: { min: 190, max: 260 }
    ana_yay: { gun: 205 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_2_bitti" }
    etiketler: ["siginak", "zincir", "kadimler", "kurtarma"]
    gerilim: 4
    onemli: true
    kart: { tr: "Örnekleme bölgesi", en: "Sampling zone" }
    sahne: "siginak_3_tahliye_1"
    sahneler:
      - id: "siginak_3_tahliye_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak sökerken gökten beyaz bir sütun iniyor. Yere çarpmıyor, iğne gibi saplanıyor: {yer:eski_sehir} ile {yer:kordon} arasındaki meydana. Sesi ancak üç saniye sonra yetişiyor ve şehrin bütün camlarını birden titretiyor.", en: "At first light a white pillar comes down out of the sky. It doesn't crash. It goes into the square between {yer:eski_sehir} and {yer:kordon} like a needle. The sound gets there three seconds later and rattles every window in the city at once." }
          - { tr: "Sabahın altısında {yer:kiyikent_iskele|in} salonunda Konsey ayakta. Kalkış panosunda yeni harfler var: YARIÇAPTA 14.000 KİŞİ · KAMYON 11 · VAPUR 3 · YOL 1. O tek yol da {yer:kordon}.", en: "At six a.m. the Council is on its feet in the {yer:kiyikent_iskele} hall. New letters on the departures board: 14,000 IN RADIUS · TRUCKS 11 · FERRIES 3 · ROADS 1. That one road is {yer:kordon}." }
          - metin: { tr: "{npc:elif_sari} başkan gişesinden çıkmış, tahtanın önünde duruyor. \"Önce çocuklar ve hastalar,\" diyor. \"Sonra yaşlılar, sonra herkes.\" Rıza Reis başını iki yana sallıyor: \"Önce savaşabilenler. Sağ kalan bir savaşçı on kişiyi kurtarır; sağ kalan bir çocuk, bir çocuğu.\"", en: "{npc:elif_sari} is out of the chair's booth and standing at the whiteboard. \"Kids and the sick first,\" she says. \"Then the elderly. Then everybody.\" Skipper Reese shakes his head. \"Fighters first. A fighter who lives saves ten people. A kid who lives saves one kid.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Tahtanın önünde Rıza Reis duruyor. \"Önce savaşabilenler,\" diyor. \"Sağ kalan bir savaşçı on kişiyi kurtarır.\" Kimse karşı çıkmıyor; çıkacak olan artık aralarında değil. Bütün gözler sana dönüyor.", en: "Skipper Reese stands at the whiteboard. \"Fighters first,\" he says. \"A fighter who lives saves ten people.\" Nobody argues. The person who would have argued isn't here anymore. Everybody looks at you." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "{yer:kordon} düştüğünden beri orada canavarlarla aynı sokakları paylaşan insanlar yaşıyor. Yolun yarısını onların barikatları, yarısını canavar yuvaları kesmiş.", en: "Since {yer:kordon} fell, there are people living down there on the same streets as the monsters. Half the road is blocked by their barricades and half by nests." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Körfezdeki Kadim gemisinden tek bir açıklama yok. {npc:thessar} Sistem kanalından yalnızca bir kez, tek bir cümle gönderiyor: \"Ölçmek kesmek değildir.\"", en: "No statement from the Ancient ship in the bay. {npc:thessar} sends exactly one sentence over the System channel: \"Measuring is not cutting.\"" }
            kosul: { bayrak: "thessar_indi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[ÖRNEKLEME BÖLGESİ BİLDİRİMİ]", en: "[SAMPLING ZONE NOTICE]" }
            satirlar:
              - { tr: "Bölge: {yer:kiyikent} · {yer:kordon}, {yer:eski_sehir}. Süre: 72 saat. Yarıçap: genişliyor.", en: "Zone: {yer:kiyikent} · Esplanade, {yer:eski_sehir}. Duration: 72 hours. Radius: expanding." }
              - { tr: "Not: Örnekleme, Kadim Elçiliği'nin talebiyle yapılmaktadır. Sistem tarafsızdır.", en: "Note: Sampling conducted at the request of the Ancient Embassy. The System is neutral." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Yarıçap saatte bir sokak genişliyor. Akşama {yer:kordon} yolu da içinde kalacak; son vapur o saate kadar iskeleden ayrılmazsa bir daha ayrılamaz.", en: "The radius grows one street an hour. By evening {yer:kordon} road will be inside it. If the last ferry isn't off the pier by then, it isn't leaving." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u ölçüm falan değil, terazi. birileri sizi kilo kilo tartıyor.", en: "t̷his isn't a measurement. it's a scale. somebody's weighing you, pound by pound." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Triyajı ben yaparım, sen yolu açık tut. Bunu daha önce de yaptık; daha küçüğünü.\"", en: "\"I'll run triage. You keep the road open. We've done this before. Smaller.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On dört bin. Her birini tek tek taşırım. Ciddiyim. Gerekirse taşırım.\"", en: "\"Fourteen thousand. I'll carry every one. I mean it. If that's what it takes.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Sütunu yıkmak on dört bin kişiyi taşımaktan kolay. Hesabını yaptım. Sen de yap.\"", en: "\"Knocking that pillar down is easier than moving fourteen thousand people. I did the math. You do it too.\"" }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "\"Önce çocuklar ve hastalar.\"", en: "\"Kids and the sick go first.\"" }
            etkiler:
              - bayrak: "tahliye_once_cocuklar"
              - ahlak: { merhamet: 5, duzen: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Çocukları ve hastaları yola herkesten önce çıkardın; sütunun gölgesinden ilk kurtulanlar en küçükler oldu.", en: "In the evacuation, you sent the kids and the sick out first. The smallest ones were the first to make it out of the pillar's shadow." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "savascilar"
            etiket: { tr: "\"Önce savaşabilenler. Onlar diğerlerini korur.\"", en: "\"Fighters first. They'll protect the rest.\"" }
            etkiler:
              - bayrak: "tahliye_once_savascilar"
              - ahlak: { duzen: 4, merhamet: -4 }
              - itibar: { lonca: 3 }
              - iliski: { elif_sari: { guven: -4 } }
            kronik: { tr: "Yola önce savaşabilenleri çıkardın; {yer:kiyikent_liman|in} silahlıları öne geçti, okulun kolu en arkaya düştü.", en: "In the evacuation, you sent the fighters out first. The Waterfront's armed column went up front, and the school's fell to the back." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "herkes"
            etiket: { tr: "\"Herkes aynı anda. Yolu ben açık tutarım.\"", en: "\"Everybody at once. I'll keep the road open.\"" }
            etkiler:
              - bayrak: "tahliye_herkes"
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { siginak: 2 }
            kronik: { tr: "On dört bin kişiyi tek bir yoldan hep birlikte yürüttün; {yer:kordon} o gün nehir gibi aktı.", en: "You pushed fourteen thousand people down one road at the same time. The Esplanade ran like a river that day." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "sutun"
            tur: "gosteris"
            etiket: { tr: "Sütuna yürü. Ölçümü sen durdur.", en: "Walk to the pillar. Stop the measuring yourself." }
            gerekli: { stat: { str: 150 } }
            etkiler:
              - dikkat: 6
              - ahlak: { merhamet: 2, insanlik: -1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Tahliyeyi beklemedin; doğrudan Kadimler'in sütununa yürüdün.", en: "You didn't wait for the evacuation. You walked straight at the Ancients' pillar." }
            sonraki: "siginak_3_tahliye_sutun"
          - id: "lonca"
            etiket: { tr: "Lonca'nın kamyonlarını kirala", en: "Rent the Guild's trucks" }
            etkiler:
              - bayrak: "tahliye_lonca"
              - degisken: { lonca_golgesi: 2 }
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 4 }
            kronik: { tr: "Tahliye için kamyonları Lonca'dan kiraladın; Konsey'in Lonca'ya olan borcuna bir kalem daha eklendi.", en: "You rented the Guild's trucks for the evacuation. The Council's debt to the Guild grew by one more line." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|den} örneklemeyi durdurmasını iste", en: "Ask {npc:thessar} to stop the sampling" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
            kronik: { tr: "{yer:kiyikent|in} tahliyesinde Kadim elçisinin kapısını çaldın.", en: "In the middle of {yer:kiyikent|pos} evacuation, you knocked on the Ancient envoy's door." }
            sonraki: "siginak_3_tahliye_thessar"

      - id: "siginak_3_tahliye_thessar"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:thessar} kendisi gelmiyor, görüntüsünü yolluyor. Bekleme salonunun ortasında, plastik koltukların üstünde iki insan boyunda, ışıktan bir siluet beliriyor; salondaki çocuklar annelerinin eteklerine sığınıyor.", en: "{npc:thessar} doesn't come. His image does. In the middle of the waiting hall, above the plastic seats, a figure made of light appears, twice as tall as a man, and every kid in the room ducks behind their mother." }
          - { tr: "\"Örnekleme pazarlık konusu değildir,\" diyor; sesi bir orgun en pes notası gibi. \"Ama her kuralın bir fiyatı vardır. Bana bir liste ver: {yer:kiyikent_liman|de}ki herkesin adı ve seviyesi. Karşılığında sütun yirmi dört saat bekler.\"", en: "\"Sampling is not negotiable,\" he says, his voice like the bottom note of a pipe organ. \"But every rule has a price. Give me a list: the name and level of everyone on {yer:kiyikent_liman}. In exchange, the pillar waits twenty-four hours.\"" }
          - { tr: "Görüntü sana dönüyor; ışıktan yapılmış olsalar da gözleri merakla kısılıyor. \"Ya da,\" diyor, \"bana başka bir ölçüm önerebilirsin.\"", en: "The image turns to you, and its eyes, even made of light, narrow with curiosity. \"Or,\" he says, \"you could offer me a different measurement.\"" }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Hasat listelerinin ilk sütununda hep isimler olur, ikincisinde seviyeler. Üçüncüsünde de sıra.", en: "The first column on any harvest list is names. The second is levels. The third is the order." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ seni istiyor: ölçmek, anlamak, bir rafa kaldırmak. biliyorum, çünkü ben de istedim.", en: "h̷e wants you. to measure you, understand you, put you on a shelf. i know because i wanted it too." }
        secenekler:
          - id: "liste"
            etiket: { tr: "Listeyi ver; yirmi dört saat al", en: "Hand over the list. Buy twenty-four hours" }
            etkiler:
              - bayrak: "kadim_listesi_verildi"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: 3 }
              - ahlak: { merhamet: -2, insanlik: -4, duzen: 2 }
              - itibar: { kadimler: 5, siginak: -3 }
              - iliski: { thessar: { baglilik: 6, saygi: 3 } }
            kronik: { tr: "Yirmi dört saat kazanmak için {yer:kiyikent_liman|de}ki herkesin adını ve seviyesini Kadimler'e verdin; liste artık onların elindeydi.", en: "To buy twenty-four hours, you gave the Ancients the name and level of everyone on {yer:kiyikent_liman}. Now the list was theirs." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "reddet"
            etiket: { tr: "\"İsimler satılık değil.\"", en: "\"Names aren't for sale.\"" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 3 }
              - itibar: { siginak: 3 }
              - iliski: { thessar: { saygi: 4 } }
            kronik: { tr: "Kadim elçisine {yer:kiyikent_liman|in} isimlerinin satılık olmadığını söyledin; o da bunu not etti, ilgiyle.", en: "You told the Ancient envoy {yer:kiyikent_liman|pos} names weren't for sale. He made a note of that, with interest." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "Kendini teklif et: \"Ölçmek istediğin benim.\"", en: "Offer yourself: \"I'm the one you want to measure.\"" }
            gerekli: { stat: { cha: 160 } }
            etkiler:
              - bayrak: "thessar_seni_olctu"
              - dikkat: 6
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, insanlik: -2 }
              - itibar: { siginak: 4 }
              - iliski: { thessar: { baglilik: 4, saygi: 6 } }
            kronik: { tr: "Sütunu durdurmak için kendini Kadim elçisinin ölçümüne sundun; bir insan onun ilgisini ilk kez kalabalıktan kendi üstüne çekti.", en: "To stop the pillar, you offered yourself up to the Ancient envoy's measurements. For the first time, a human pulled his attention away from the crowd." }
            sonraki: "siginak_3_tahliye_yol"

      - id: "siginak_3_tahliye_yol"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon} boyunca insanlar yürüyor: bebek arabaları, el arabaları, sırtında yatak taşıyan bir adam, kucağında kedisiyle bir kadın. Arkalarında, sabah güneşinde bile bembeyaz ve soğuk duran sütun havaya oyulmuş bir deliği andırıyor.", en: "People are walking the length of {yer:kordon}: strollers, wheelbarrows, a man carrying a mattress on his back, a woman with a cat in her arms. Behind them stands the pillar, white and cold even in the morning sun, like a hole cut in the air." }
          - metin: { tr: "Önde, birbirlerinin mont eteklerine tutunmuş çocuklar yürüyor; bir öğretmen en öndekinin elini bırakmıyor.", en: "Up front, kids walk holding onto each other's coat hems, and a teacher won't let go of the first kid's hand." }
            kosul: { bayrak: "tahliye_once_cocuklar" }
          - metin: { tr: "Önde silahlı, düzenli bir kol ilerliyor. Okulun kolu en arkada kalmış; öğretmen çocukları sayıp duruyor ve her seferinde başka bir sayı buluyor.", en: "Up front, an armed, orderly column. The school's column is way at the back, and the teacher keeps counting the kids and getting a different number every time." }
            kosul: { bayrak: "tahliye_once_savascilar" }
          - metin: { tr: "Yol insan seline dönmüş. Herkes aynı anda yürüyor, herkes aynı anda bağırıyor; ama yürüyorlar.", en: "The road is a river of people. Everybody walking at once, everybody yelling at once, but everybody's walking." }
            kosul: { bayrak: "tahliye_herkes" }
          - { tr: "Derken gökten ilk toplayıcı iniyor: camdan ve kemikten, araba büyüklüğünde bir yusufçuk. Kalabalığın üstünde asılı kalıp aşağıdaki en yüksek seviyeli kişiyi seçiyor, onu bir ışık huzmesine alıp yukarı çekiyor.", en: "Then the first harvester comes down out of the sky: a dragonfly the size of a sedan, built out of glass and bone. It hangs over the crowd, picks out the highest-level person below, wraps them in a beam of light, and lifts them up." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Toplayıcısı ×7", en: "[ANALYSIS] Harvester ×7" }
            satirlar:
              - { tr: "Hedef seçimi: en yüksek seviye önce.", en: "Target selection: highest level first." }
              - { tr: "Bölgedeki en yüksek seviye: sen.", en: "Highest level in the zone: you." }
        sezgiler:
          - kosul: { stat: { agi: 120 } }
            metin: { tr: "Toplayıcılar hedef seçerken bir saniyeliğine duraksıyor. Senin için bir saniye uzun bir süre.", en: "The harvesters freeze for one second when they pick a target. One second is a long time, for you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kalabalığın üstüne atla; toplayıcıları indir", en: "Jump the crowd. Bring the harvesters down" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["hasat_toplayici@dunya", "hasat_toplayici@dunya", "hasat_toplayici@dunya-10"], kazan: "siginak_3_tahliye_iskele", kaybet: "siginak_3_tahliye_yol_bedel", kac: "siginak_3_tahliye_yol_bedel" }
            kronik: { tr: "{yer:kordon|de}ki tahliyede kalabalığın üstünden atlayıp Kadim toplayıcılarının üstüne yürüdün.", en: "During the evacuation on {yer:kordon}, you leapt over the crowd and went after the Ancients' harvesters." }
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Kimse görmeden, birer saniyede, hepsini indir", en: "Drop them all, one second each, before anyone sees" }
            gerekli: { stat: { agi: 120 } }
            etkiler:
              - gizle: 3
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 3, insanlik: 2 }
            kronik: { tr: "Toplayıcıları o kadar hızlı indirdin ki {yer:kordon|de}ki kimse ne olduğunu görmedi; yalnızca camın düşüşünü duydular.", en: "You dropped the harvesters so fast nobody on {yer:kordon} saw what happened. They only heard glass hitting the ground." }
            sonraki: "siginak_3_tahliye_iskele"
          - id: "cek"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni aç; bütün toplayıcıları kendine çek", en: "Open up your level. Draw every harvester to you" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, insanlik: -1 }
              - itibar: { siginak: 4 }
              - savas: { dusmanlar: ["hasat_toplayici@dunya+10", "hasat_toplayici@dunya+10", "hasat_toplayici@dunya+10"], kazan: "siginak_3_tahliye_iskele", kaybet: "siginak_3_tahliye_yol_bedel", kac: "siginak_3_tahliye_yol_bedel" }
            kronik: { tr: "Gerçek seviyeni açıp {yer:kordon|in} üstündeki bütün Kadim toplayıcılarını kalabalıktan kendi üstüne çektin.", en: "You opened up your real level and pulled every Ancient harvester over {yer:kordon} off the crowd and onto yourself." }
          - id: "ihtiyar"
            etiket: { tr: "Evinden çıkmayan yaşlı adamı sırtına al", en: "Put the old man who won't leave his house on your back" }
            etkiler:
              - bayrak: "ihtiyar_tasindi"
              - degisken: { hayatta_kalan: -1 }
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Toplayıcılar kalabalıktan insan seçerken sen evinden çıkmak istemeyen bir ihtiyarı sırtında taşıdın.", en: "While the harvesters picked people out of the crowd, you carried an old man who didn't want to leave home on your back." }
            sonraki: "siginak_3_tahliye_iskele"

      - id: "siginak_3_tahliye_yol_bedel"
        yer: "kordon"
        paragraflar:
          - { tr: "Toplayıcılardan biri seni ışığına alıyor ve bir an havadasın; aşağıda {yer:kordon} karınca yolu gibi uzanıyor. Sonra ışık seni tükürüp atıyor: ya senden hoşlanmadı ya da seni kaldıramadı.", en: "One of the harvesters wraps you in its light and for a second you're up high, {yer:kordon} below you like an ant trail. Then the light spits you out. Either it didn't like you or it couldn't lift you." }
          - { tr: "Yere çakıldığında yol çoktan seyrelmiş. Kırk kişi ışığın içinde, gökyüzüne doğru küçülüp gidiyor. Bir kadın durmadan birinin adını haykırıyor.", en: "By the time you hit the pavement, the road has thinned out. Forty people are shrinking into the sky inside the light. A woman is screaming somebody's name, over and over." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve kalanları iskeleye sür", en: "Get up and push the rest toward the pier" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 2 }
              - ahlak: { duzen: 3, merhamet: 1 }
            kronik: { tr: "{yer:kordon|de} kırk kişi gökyüzüne alındı; sen yerden kalkıp kalanları iskeleye sürdün.", en: "Forty people were taken up into the sky on {yer:kordon}. You got up off the ground and drove the rest to the pier." }
            sonraki: "siginak_3_tahliye_iskele"
          - id: "kadin"
            etiket: { tr: "Bağıran kadının yanına git", en: "Go to the screaming woman" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 2 }
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Toplayıcılar kırk kişiyi götürdüğünde sen bağıran bir kadının yanında durdun.", en: "When the harvesters took forty people, you stood beside a woman who was screaming." }
            sonraki: "siginak_3_tahliye_iskele"

      - id: "siginak_3_tahliye_iskele"
        yer: "kordon"
        paragraflar:
          - { tr: "Kordon İskelesi'ne son vapur yanaşmış; güvertesi öyle dolu ki tekne suya bir karış gömülmüş. İskelede hâlâ iki yüz kişi bekliyor.", en: "The last ferry is tied up at {yer:kordon} pier, so overloaded it's riding a foot low in the water. There are still two hundred people on the dock." }
          - { tr: "Rıza Reis kaptan köşkünden sarkıyor. \"Bir sefer daha yapmak intihar olur,\" diyor. \"Yarıçap bir saate kalmaz iskeleye varır; benim gidip gelmem bir buçuk saat.\" Arkasındaki sütun, hiç yaklaşmıyormuş gibi sabırla bekliyor.", en: "Skipper Reese leans out of the wheelhouse. \"One more run is suicide,\" he says. \"The radius hits this pier in an hour. Round trip's an hour and a half.\" Behind him, the pillar waits patiently, like it isn't getting any closer." }
          - metin: { tr: "Kadim'in verdiği yirmi dört saat iskeleye fazladan bir sefer kazandırıyor; ama {yer:kiyikent_liman|de} herkes o saatlerin neyle satın alındığını biliyor.", en: "The Ancient's twenty-four hours buys the pier one extra run. Everybody on {yer:kiyikent_liman} knows what it was bought with." }
            kosul: { bayrak: "kadim_listesi_verildi" }
        sezgiler:
          - kosul: { stat: { end: 180 } }
            metin: { tr: "Vapurun motoru zayıf ama gövdesi sağlam. Biri onu arkadan iterse sefer yarı sürede biter.", en: "The ferry's engine is weak but the hull is solid. If somebody pushed it from behind, the run would take half as long." }
        secenekler:
          - id: "sefer"
            etiket: { tr: "\"Bir sefer daha. Sütunu ben tutarım.\"", en: "\"One more run. I'll hold off the pillar.\"" }
            etkiler:
              - bayrak: "son_sefer_yapildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, duzen: -1 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Son vapura bir sefer daha yaptırdın ve sütunun önüne kendin geçtin.", en: "You had the last ferry make one more run and put yourself in front of the pillar." }
            sonraki: "siginak_3_tahliye_sutun"
          - id: "it"
            tur: "gosteris"
            etiket: { tr: "Suya gir ve vapuru sırtınla it", en: "Get in the water and push the ferry yourself" }
            gerekli: { stat: { end: 180 } }
            etkiler:
              - bayrak: "son_sefer_yapildi"
              - dikkat: 5
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 4, insanlik: -1 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Dolu bir vapuru körfezin öbür yakasına sırtınla ittin; o gün iskelede kimse kalmadı.", en: "You pushed a loaded ferry across the bay on your own back. Nobody got left on that pier." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "tepe"
            etiket: { tr: "Kalanları {yer:tepe|e} yürüt", en: "March the rest up to {yer:tepe}" }
            etkiler:
              - bayrak: "tepeye_yuruyenler"
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 1, duzen: 1 }
              - itibar: { yukselenler: 3 }
            kronik: { tr: "İskelede kalan iki yüz kişiyi {yer:tepe|e}, Yükselenler'in kapısına yürüttün; kaçının 'yakıt' listesine yazılacağını sormadın.", en: "You marched the two hundred left on the pier up to {yer:tepe}, to the Ascended's gate. You didn't ask how many would end up on the \"fuel\" list." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "kalk"
            etiket: { tr: "\"Kalanlar kalır. Vapur kalkıyor.\"", en: "\"Whoever's left stays. The ferry's leaving.\"" }
            etkiler:
              - bayrak: "iskele_terk"
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -6, duzen: 3 }
              - itibar: { siginak: -4 }
            kronik: { tr: "Son vapuru kaldırdın; iki yüz kişi iskelede, arkasından bakakaldı.", en: "You sent the last ferry off. Two hundred people stood on the pier and watched it go." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_sutun"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütunun dibinde hava kristal kesilmiş, her adımında ayağının altında bir şey çatırdıyor. Meydanda kaçmaya yetişemeyenler heykel gibi donup kalmış; her birinin başının üstünde açık bir Sistem penceresi, pencerede de geri sayan bir sayı var.", en: "At the base of the pillar the air is like crystal. Something crackles under your feet with every step. In the square, the people who didn't get away in time stand like statues, every one with a System window open over their head and a number counting down." }
          - { tr: "Sütunun yüzeyinden satırlar akıyor: bir dil bu, ama okunmak için değil, çalıştırılmak için yazılmış. Yaklaştıkça satırlar yavaşlıyor, sonra duruyor ve sütun sana doğru kollar açıyor.", en: "Lines are scrolling down the pillar's surface, some kind of language, written to be executed rather than read. The closer you get, the slower they scroll. Then they stop, and the pillar opens arms toward you." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Sütunu · Örnekleme aracı", en: "[ANALYSIS] Harvest Pillar · Sampling instrument" }
            satirlar:
              - { tr: "Durum: anomali tespit edildi. Örnekleme önceliği değiştirildi.", en: "Status: anomaly detected. Sampling priority reassigned." }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Satırların arasında kendini tekrarlayan bir döngü var. Döngünün sonuna bir hata koyarsan sütun kendi ağırlığını taşıyamaz.", en: "There's a loop repeating between the lines. Slip an error in at the end of it and the pillar can't hold its own weight." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u satırları tanıyorum. ben bunlardan birinin yarısıydım.", en: "i̷ know these lines. i used to be half of one." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sütunla göğüs göğüse dövüş", en: "Fight the pillar head-on" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+4"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadimler'in hasat sütunuyla {yer:eski_sehir|in} meydanında göğüs göğüse dövüştün.", en: "You fought the Ancients' harvest pillar head-on in the {yer:eski_sehir} square." }
          - id: "satir"
            etiket: { tr: "Satırları oku; döngünün sonuna bir hata koy", en: "Read the lines. Slip an error into the loop" }
            gerekli: { stat: { int: 150 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+1"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadim sütununun kendi satırlarına, döngünün sonuna bir hata yazdın.", en: "You wrote an error into the end of the Ancient pillar's own loop." }
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} satırları okut", en: "Let {npc:yanki} read the lines" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { yanki: { guven: 4 } }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+2"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadim sütununun satırlarını kafandaki sese okuttun; ses o satırları tanıdığını söyledi.", en: "You let the voice in your head read the Ancient pillar's lines. It said it recognized them." }

      - id: "siginak_3_tahliye_sutun_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütun tepeden tabana çatlıyor; denize kopan bir buzdağı gibi ağır ve sessiz. Parçalar meydana düşmeden havada eriyip beyaz bir toza dönüşüyor.", en: "The pillar cracks from top to bottom, heavy and silent, like an iceberg calving into the sea. The pieces melt into white dust in midair before they hit the square." }
          - { tr: "Heykel gibi donup kalmış insanlar bir anda derin bir nefes alıyor. Başlarının üstündeki pencereler kapanıyor. Bir kadın dizlerinin üstüne çöküp ağlamaya başlıyor; bir adam ne olduğunu sormak için ağzını açıyor, ama tek bir soru bile soramıyor.", en: "The people standing like statues all breathe in at once. The windows over their heads blink shut. A woman drops to her knees and starts to cry. A man opens his mouth to ask what happened and can't get a single question out." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[ÖRNEKLEME İPTAL EDİLDİ]", en: "[SAMPLING CANCELED]" }
            satirlar:
              - { tr: "Neden: örnekleme aracı imha edildi.", en: "Reason: sampling instrument destroyed." }
              - { tr: "Not: Bu bir ilk. Kadim Elçiliği bilgilendirildi.", en: "Note: This is a first. The Ancient Embassy has been notified." }
        secenekler:
          - id: "heykeller"
            etiket: { tr: "Uyananları tek tek iskeleye taşı", en: "Carry the ones who woke up to the pier, one by one" }
            etkiler:
              - bayrak: "hasat_sutunu_yikildi"
              - degisken: { kadim_tehdit: -5, hayatta_kalan: 3 }
              - esya: { hasat_kristali: 1 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 5, kadimler: -5 }
            kronik: { tr: "Kadimler'in sütununu yıktın ve onun dondurduğu insanları kendi ellerinle iskeleye taşıdın.", en: "You brought down the Ancients' pillar and carried the people it had frozen to the pier with your own hands." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "parca"
            etiket: { tr: "Sütunun çekirdeğini sök; Kadimler bunu görsün", en: "Rip out the pillar's core. Let the Ancients see it" }
            etkiler:
              - bayrak: "hasat_sutunu_yikildi"
              - degisken: { kadim_tehdit: -6, hayatta_kalan: 2 }
              - esya: { hasat_kristali: 2 }
              - dikkat: 3
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { kadimler: -8, siginak: 3 }
            kronik: { tr: "Kadimler'in sütununun çekirdeğini söküp körfezdeki gemiye doğru kaldırdın; Kadimler'e cevabın buydu.", en: "You tore out the Ancient pillar's core and held it up toward the ship in the bay. That was your answer to the Ancients." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_sutun_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütunun kollarından biri seni meydanın öbür ucuna fırlatıyor. Ayağa kalktığında satırlar yeniden akmaya başlamış; kaybettiği zamanın acısını çıkarmak ister gibi hızla.", en: "One of the pillar's arms throws you clear across the square. By the time you're up, the lines are scrolling again, fast, like it wants to make up for lost time." }
          - { tr: "Akşamüstü sütun kendiliğinden yerden kalkıp gökyüzüne çekiliyor. Meydandaki insanlar uyanıyor. Sağ salimler; ama pencerelerinde hiçbirinin silemediği yeni bir satır belirmiş: [ÖRNEKLENDİ].", en: "Late in the afternoon the pillar lifts itself out of the ground and pulls back into the sky. The people in the square wake up. They're fine. But there's a new line on their windows that none of them can delete: [SAMPLED]." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Örneklenenlerin adlarını tek tek kaydet", en: "Write down the name of every sampled person" }
            etkiler:
              - bayrak: "orneklenenler"
              - degisken: { kadim_tehdit: 3, hayatta_kalan: -2 }
              - ahlak: { duzen: 3, insanlik: 2 }
            kronik: { tr: "Kadim sütununun damgaladığı herkesin adını tek tek kaydettin; onların bir listesi vardı, artık sizin de.", en: "You wrote down the name of every person the Ancient pillar branded. They had a list. Now so did you." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "yumruk"
            etiket: { tr: "Gökyüzüne bak ve bir dahaki sefere söz ver", en: "Look up at the sky and promise there'll be a next time" }
            etkiler:
              - bayrak: "orneklenenler"
              - degisken: { kadim_tehdit: 3, hayatta_kalan: -2 }
              - ahlak: { merhamet: 1, duzen: -1 }
            kronik: { tr: "Geri çekilen sütunun ardından gökyüzüne bir söz verdin.", en: "As the pillar pulled back into the sky, you made the sky a promise." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_bitis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece olduğunda {yer:kiyikent_liman|in} konteyner sahası bir şehre dönmüş. Konteynerlerin arasına çadırlar kurulmuş, vinç kollarından çamaşır ipleri sarkıyor. İki gün önce on iki bin kişinin sığmadığı yere şimdi on dört bin kişi sığmaya çalışıyor.", en: "By nightfall {yer:kiyikent_liman|pos} container yard has turned into a city. Tents between the stacks, laundry lines hanging off the crane arms. Fourteen thousand people trying to fit into a place where twelve thousand didn't fit two days ago." }
          - metin: { tr: "Rıhtımda {npc:elif_sari} elinde bir fener ve bir rulo bantla gelenleri karşılıyor: kırmızı, sarı, yeşil. Bu gece bir kez bile siyah bant kullanmıyor; bunu sana sonradan gururla değil, şaşkınlıkla anlatacak.", en: "{npc:elif_sari} is on the quay meeting every arrival with a flashlight and a roll of tape. Red, yellow, green. She doesn't use the black tape once tonight. She'll tell you that later, not proud, just stunned." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Okulun kolu dört çocuk eksik gelmiş. Öğretmen adlarını konteynerlerden birinin kapısına tebeşirle yazıyor.", en: "The school's column came in four kids short. The teacher writes their names in chalk on the door of one of the containers." }
            kosul: { bayrak: "tahliye_once_savascilar" }
          - metin: { tr: "Kordon İskelesi'nden gelen son haber kısa: sütun çekildikten sonra iskeleye inenler orada kimseyi bulamamış.", en: "The last word from {yer:kordon} pier is short: after the pillar pulled back, the people who went down there didn't find anybody." }
            kosul: { bayrak: "iskele_terk" }
          - { tr: "Konteynerlerin arasında yürürken karanlık bir köşede Lonca bantlı üç adam gözüne çarpıyor; Konsey'in silah deposunu süzüp alçak sesle konuşuyorlar. Biri Pala.", en: "Walking between the stacks, you spot three men in Guild armbands in a dark corner, looking at the Council's armory and talking low. One of them is Cleaver." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Dudaklarını okuyabiliyorsun: 'Kargaşa iyidir. Kargaşada kimse kapıyı kimin açtığını sormaz. Demir Gece.'", en: "You can read their lips: \"Chaos is good. In chaos nobody asks who opened the door. Iron Night.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Gölgede kal; Pala'nın adamlarını dinle", en: "Stay in the shadows. Listen to Cleaver's men" }
            gerekli: { stat: { per: 120 } }
            etkiler:
              - bilgi: "demir_gece_plani"
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 20, max: 40 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Tahliye gecesinden beri Konsey ile Lonca arasındaki gerilim dinmedi.", en: "Since the night of the evacuation, things between the Council and the Guild haven't cooled off." } }
            kronik: { tr: "Lonca'nın bir darbe hazırladığını tahliye gecesi, daha kimse bilmezken öğrendin.", en: "On the night of the evacuation, you learned the Guild was planning a coup before anyone else knew." }
            sonraki: "@akis"
          - id: "kamp"
            etiket: { tr: "Konteyner sahasında sabaha kadar çadır kur", en: "Pitch tents in the container yard till morning" }
            etkiler:
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 3 } }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 25, max: 50 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Tahliye gecesinden beri Konsey ile Lonca arasındaki gerilim dinmedi.", en: "Since the night of the evacuation, things between the Council and the Guild haven't cooled off." } }
            kronik: { tr: "Tahliyeden sonraki geceyi on dört bin kişiye çadır kurarak geçirdin.", en: "You spent the night after the evacuation pitching tents for fourteen thousand people." }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "Gelen herkesi kayda geçir; kimse kaybolmasın", en: "Log every arrival. Nobody gets lost" }
            etkiler:
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 7 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 25, max: 50 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Tahliye gecesinden beri Konsey ile Lonca arasındaki gerilim dinmedi.", en: "Since the night of the evacuation, things between the Council and the Guild haven't cooled off." } }
            kronik: { tr: "Tahliyede {yer:kiyikent_liman|e} gelen herkesin adını tek tek kaydettin; {yer:kiyikent|in} elindeki tek nüfus kütüğü artık o defterdi.", en: "You logged the name of every evacuee who reached {yer:kiyikent_liman}. That notebook was the only census {yer:kiyikent} had now." }
            sonraki: "@akis"

  # ================================================================== ELİF 3 — LONCA DARBESİ / DEMİR GECE (P3; Elif ölebilir)
  # Lonca'nın şahinleri (Pala) Konsey'in son kalesine, Gümrük'teki hastaneye yürür. ihanet_kaya varsa bu, Parti J'nin büyük
  # ihanetinin ardından gelen gecedir; yoksa Pala Kaya'nın sessizliğine güvenerek kendi başına davranır. Tohum: tahliye, gece nöbeti.
  - id: "elif_lonca_darbesi"
    konum: ["kiyikent_liman"]
    perde: [3]
    gun: { min: 232, max: 328 }
    agirlik: 7
    kosul: { bayrak: ["siginak_1_goruldu", "demir_gece_uyarildi"], bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }
    etiketler: ["siginak", "lonca", "npc", "darbe"]
    gerilim: 4
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Demir Gece", en: "Iron Night" }
    sahne: "elif_lonca_darbesi_1"
    sahneler:
      - id: "elif_lonca_darbesi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece ikide kapın yumruk yağmuruna tutuluyor. Gelen Başhemşire Nurhan; önlüğünün üstüne mont geçirmiş, soluk soluğa: \"Gümrük'ü sardılar. Başlarında Pala var, teslim olmazsak gaz atacaklarmış.\"", en: "At two in the morning somebody pounds on your door. It's Nora, the head nurse, a parka thrown on over her scrubs, out of breath. \"They've surrounded the Customs House. The Guild. Cleaver's leading them. They say if we don't surrender, they'll gas us out.\"" }
          - metin: { tr: "{npc:kaya_demir|in} darbesinden beri {yer:kiyikent_liman|de} Konsey'e tek bir yer kaldı: Gümrük'teki koğuş. {npc:elif_sari} ne ilaç deposunu veriyor ne de yaralı Konsey nöbetçilerini. Pala bu gece işi bitirmeye gelmiş.", en: "Since {npc:kaya_demir|pos} coup, the Council has held exactly one place on {yer:kiyikent_liman}: the ward in the Customs House. {npc:elif_sari} refuses to hand over the medicine stores or the wounded Council guards. Cleaver came tonight to finish it." }
            kosul: { bayrak: "ihanet_kaya" }
          - metin: { tr: "Lonca'nın şahinleri Konsey'i bu gece alma kararını vermiş. {npc:kaya_demir} ne evet demiş ne hayır; Pala'ya onun susması yetmiş.", en: "The Guild's hawks decided tonight was the night to take the Council. {npc:kaya_demir} didn't say yes. He didn't say no. For Cleaver, his silence was enough." }
            kosul: { bayrak_yok: "ihanet_kaya", npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:kaya_demir} öldüğünden beri Lonca'nın dizginini tutan kimse yok. Pala da bunu fırsat bilmiş.", en: "Since {npc:kaya_demir} died, there's been no hand on the Guild's leash. Cleaver took that as an invitation." }
            kosul: { bayrak_yok: "ihanet_kaya", npc_olu: "kaya_demir" }
          - { tr: "Tam o sırada {yer:kiyikent_iskele} tarafından da silah sesleri geliyor; Konsey üyeleri bu gece orada toplanmıştı. İki ayrı yer, iki ayrı yön, tek bir gece.", en: "At the same time, gunfire starts up from the direction of the {yer:kiyikent_iskele}, where the Council was meeting tonight. Two places, two directions, one night." }
          - metin: { tr: "{npc:elif_sari} çantasını çoktan kapıp kapıdan çıkmış bile. \"Hastalarım,\" demekle yetinip koşmaya başlıyor; seni beklemiyor.", en: "{npc:elif_sari} has already grabbed her bag and is out the door. \"My patients,\" is all she says, and she starts running. She doesn't wait for you." }
            kosul: { yoldas: "elif_sari" }
          - { tr: "Hesap basit ve acımasız: Gümrük'te {npc:elif_sari} hastalarıyla neredeyse yalnız, İskele'de Konsey. İkisine birden yetişmek kolay olmayacak; hangisine koşarsan öbürünü geride bırakmayı göze alıyorsun.", en: "The math is simple and cruel: at the Customs House, {npc:elif_sari} is all but alone with her patients; at the {yer:kiyikent_iskele}, the Council. Getting to both won't be easy. Whichever way you run, you're choosing what to leave behind." }
          - metin: { tr: "İsteğin üzerine Gümrük'ün kapısında iki Konsey nöbetçisi var. Bir süre dayanırlar; ne kadar, kimse bilmiyor.", en: "At your request, two Council guards are posted at the Customs House door. They'll hold for a while. How long, nobody knows." }
            kosul: { bayrak: "demir_gece_nobet" }
          - metin: { tr: "{npc:elif_sari|e} verdiğin fişek aklına geliyor. Yakarsa {yer:kiyikent_liman|in} her yerinden görünür.", en: "You remember the flare you gave {npc:elif_sari}. If she lights it, it'll be seen from anywhere on {yer:kiyikent_liman}." }
            kosul: { bayrak: "demir_gece_isaret" }
        sezgiler:
          - kosul: { bilgi: "demir_gece_plani" }
            metin: { tr: "Bunun geleceğini biliyordun. Pala'nın kolu Gümrük'e balık halinin arkasından dolanacak: dar, karanlık, tek çıkışlı bir sokak.", en: "You knew this was coming. Cleaver's column will hit the Customs House by way of the alley behind the fish market. It's narrow, dark, and has one way out." }
          - kosul: { stat: { per: 200 } }
            metin: { tr: "İskele'deki silah sesleri fazla düzenli; bu bir baskın değil, gözdağı. Gümrük'ten ise çıt çıkmıyor. Asıl iş orada dönüyor.", en: "The shots at the Ferry Terminal are too regular. That isn't a raid, it's a show. Nothing at all is coming from the Customs House. That's where the real work is." }
          - kosul: { bayrak: "elif_ask" }
            anlati: true
            metin: { tr: "Bir an aklına Gümrük'ün çatısı geliyor: şafak, bir omuz, bir saat. Sonra düşünmeyi bırakıp ayakkabılarını giyiyorsun.", en: "For a second you think about the Customs House roof. The dawn, a shoulder, an hour. Then you stop thinking and pull on your boots." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷ki yer, tek sen. sistem bunu triyaj diye sunuyor. ben bir şey sunmuyorum, yalnızca izliyorum.", en: "t̷wo places. one you. the system is presenting this as triage. i'm not presenting anything. i'm just watching." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sen hekime yetiş. İskele bende. Tutamazsam da... nasılsa tutarım.\"", en: "\"You get the doctor. I'll hold the Terminal. And if I can't... I'll hold it anyway.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Gökte Kadim gemisi asılıyken insan insanla savaşıyor. Bu türü hasat etmek için başka gerekçe aramaya gerek yok.\"", en: "\"Humans fighting humans, with an Ancient ship in the sky. If anybody needed a reason to harvest this species, there it is.\"" }
        secenekler:
          - id: "hastane"
            etiket: { tr: "Gümrük'e koş", en: "Run for the Customs House" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Demir Gece kapını yumrukladığında önce hastaneye koştun.", en: "When Iron Night came pounding on your door, you ran for the hospital first." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "iskele"
            etiket: { tr: "İskele'ye koş; Konsey'i kurtar", en: "Run for the Terminal. Save the Council" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Demir Gece'nin iki yangınından hastaneninkini değil, Konsey'inkini seçtin.", en: "On Iron Night, you chose the Council over the hospital." }
            sonraki: "elif_lonca_darbesi_iskele"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "İkisine birden yetiş", en: "Be in both places at once" }
            gerekli: { stat: { agi: 250 } }
            etkiler:
              - bayrak: "konsey_kurtarildi"
              - dikkat: 6
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 6 }
            kronik: { tr: "{yer:kiyikent_liman|i} öyle bir hızla boydan boya geçtin ki Konsey'i kurtarıp hastaneye de yetiştin; görenler seni aynı anda iki yerde gördüklerini sandı.", en: "You crossed {yer:kiyikent_liman} so fast that you freed the Council and still made it to the hospital. Anyone watching would have sworn you were in two places at once." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "pusu"
            etiket: { tr: "Pala'yı yolda, balık halinin arkasında karşıla", en: "Meet Cleaver in the alley behind the fish market" }
            goster: { bilgi: "demir_gece_plani" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
            kronik: { tr: "Demir Gece'nin planını önceden bildiğinden Pala'nın önünü daha hastaneye varmadan yolda kestin.", en: "Because you knew Iron Night's plan ahead of time, you met Cleaver on the road before he ever reached the hospital." }
            sonraki: "elif_lonca_darbesi_pusu"
          - id: "evde"
            etiket: { tr: "Evde kal: gücünü sakla, Lonca'nın listesine girme", en: "Stay home: keep your power hidden, stay off the Guild's list" }
            goster: { itibar_min: { lonca: 30 } }
            etkiler:
              - gizle: 6
              - npc_ol: "elif_sari"
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_basarili"
              - gorev: { zincir_siginak: "basarisiz" }
              - kontrol: { kiyikent_liman: "lonca" }
              - degisken: { hayatta_kalan: -3 }
              - ahlak: { merhamet: -10, duzen: 5, insanlik: -4 }
              - itibar: { siginak: -40, lonca: 15 }
            kronik: { tr: "Demir Gece boyunca evden çıkmadın. Sabah olduğunda {yer:kiyikent_liman} Lonca'nındı, Gümrük'ün merdivenlerinde de bir hekim yatıyordu.", en: "You sat out Iron Night at home. By morning {yer:kiyikent_liman} belonged to the Guild, and a doctor was lying on the Customs House steps." }
            sonraki: "elif_lonca_darbesi_sessizlik"

      - id: "elif_lonca_darbesi_hastane"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük binasının önünde yirmi Lonca adamı hilal gibi dizilmiş; ellerinde kepenkten kalkanlar, tarım ilacı tüplerinden bozma gaz bombaları. İçeriden pencerelere sedyeler, dolaplar, karyola iskeletleri dayanmış.", en: "Twenty Guild men stand in a half-moon in front of the Customs House, holding storefront-shutter shields and gas bombs rigged out of crop-duster canisters. The windows are barricaded from inside with gurneys, cabinets, bed frames." }
          - { tr: "İkinci katın pencerelerinden birinde {npc:elif_sari} duruyor; elinde yangın tüpü, yüzü kireç gibi ama kılını kıpırdatmıyor. Pala seni görünce, yağmura bakan bir postacı gibi içini çekiyor.", en: "{npc:elif_sari} is standing in one of the second-floor windows with a fire extinguisher in her hands, her face dead white, not moving an inch. When Cleaver sees you he sighs, like a mailman looking at the rain." }
          - { tr: "\"İlaçları da kaçakları da verin, kimse ölmez,\" diye sesleniyor yukarıya, ama gözü sende. \"Bu gece fatura gecesi. Biz faturayı hep keseriz, bilirsin.\"", en: "\"Hand over the meds and the runaways and nobody dies,\" he calls up to the window, but his eyes are on you. \"Tonight's a billing night. We always send the bill, you know that.\"" }
          - metin: { tr: "Arkanda Rıza Reis'le Konsey nöbetçileri var; buraya gelirken İskele'de kurtardıkların. Yaşlı kaptan av tüfeğini doldururken \"Geç kalmadık,\" diyor. \"Bu sefer geç kalmadık.\"", en: "Skipper Reese and the Council guards are behind you, the ones you freed at the Terminal on the way. The old captain is loading a shotgun. \"We're not late,\" he says. \"Not this time.\"" }
            kosul: { bayrak: "konsey_kurtarildi" }
          - metin: { tr: "Pala'nın göğsünde, Pınarbaşı'nın turnikesinden sökülmüş küçük bir ekran madalya gibi asılı duruyor.", en: "There's a little screen hanging on Cleaver's chest, pried off the Pinewell turnstile. He wears it like a medal." }
            kosul: { bayrak: "pala_kini" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Koğuşta oksijen tüpleri var. Burada çatışma çıkar da tek bir gaz bombası camı kırarsa bina fırına döner.", en: "There are oxygen tanks inside the ward. If a fight breaks out here and one gas bomb breaks a window, this building turns into an oven." }
          - kosul: { stat: { cha: 220 } }
            metin: { tr: "Pala'nın adamlarının yarısının yarası bu koğuşta dikilmiş, bir kısmınınki de bizzat {npc:elif_sari|in} elinden geçmiş. Bunu kendileri de biliyor.", en: "Half of Cleaver's men have been stitched up on this ward. Some of them by {npc:elif_sari} herself. They know it." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kapının önüne geç ve savaş", en: "Get in front of the door and fight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["pala@dunya+15", "demir_gece_askeri@dunya-5", "demir_gece_askeri@dunya-5"], ortam: ["yanici", "karanlik"], kazan: "elif_lonca_darbesi_zafer", kaybet: "elif_lonca_darbesi_bedel", kac: "elif_lonca_darbesi_bedel" }
            kronik: { tr: "Gümrük'ün kapısını sırtına alıp Pala'nın adamlarına karşı durdun.", en: "With the Customs House door at your back, you took on Cleaver's men." }
          - id: "silah"
            tur: "gosteris"
            etiket: { tr: "Adamlarına seslen; silahlarını bıraktır", en: "Talk to his men. Make them drop their weapons" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 5, lonca: -3 }
            kronik: { tr: "Pala'nın adamlarına yaralarını kimin diktiğini hatırlattın ve Demir Gece tek kurşun atılmadan sona erdi.", en: "You reminded Cleaver's men whose hands had stitched them up. Iron Night ended without a single shot fired." }
            sonraki: "elif_lonca_darbesi_pala_teslim"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni açıp kapıda dikil", en: "Open up your real level and stand in the door" }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: -5 }
              - iliski: { elif_sari: { korku: 3, saygi: 4 } }
            kronik: { tr: "Gümrük'ün eşiğinde gerçek seviyeni açtın; Pala'nın yirmi adamı daha bir adım atamadan dağılıp gitti.", en: "You opened up your real level in the Customs House doorway. Cleaver's twenty men scattered before any of them could take a step." }
            sonraki: "elif_lonca_darbesi_zafer"
          - id: "pazarlik"
            etiket: { tr: "Pala'yla pazarlık et: ilaçlara karşılık hastane", en: "Deal with Cleaver: the meds for the hospital" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - degisken: { lonca_golgesi: 2 }
            kronik: { tr: "Demir Gece'nin ortasında hastaneyi Konsey'in ilaçlarıyla satın aldın.", en: "On Iron Night, you bought the hospital back with the Council's medicine." }
            sonraki: "elif_lonca_darbesi_pazarlik"

      - id: "elif_lonca_darbesi_pusu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balık halinin arkasındaki sokak buz kokuyor; tezgâhların altında kırık kasalar, yerlerde balık pulu. Pala'nın kolu tam beklediğin saatte, tam beklediğin sırayla çıkageliyor, sen de sokağın ortasında karşılarına dikilmiş bekliyorsun.", en: "The alley behind the fish market smells like ice. Broken crates under the stalls, scales on the ground. Cleaver's column comes at exactly the time you expected, in exactly the order you expected, and you're standing in the middle of the alley in front of them." }
          - { tr: "Pala duraksıyor. Yüzünde ilk kez şaşkınlık beliriyor, o şaşkınlık da yavaş yavaş saygıya benzer bir şeye dönüşüyor. \"Kim sattı bizi?\" diye soruyor; ardından kendi sorusuna güler gibi yapıyor: \"Boş ver. Kimse satmadı. Sen duydun.\"", en: "Cleaver stops. For the first time there's surprise on his face. Then it turns into something like respect. \"Who sold us out?\" he asks. Then he half-laughs at his own question. \"Forget it. Nobody did. You heard.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sokağı kapat ve savaş", en: "Seal off the alley and fight" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - savas: { dusmanlar: ["pala@dunya+10", "demir_gece_askeri@dunya-10"], ortam: ["dar_gecit", "karanlik"], kazan: "elif_lonca_darbesi_zafer", kaybet: "elif_lonca_darbesi_bedel", kac: "elif_lonca_darbesi_bedel" }
            kronik: { tr: "Hastaneye tek adam varmasın diye Pala'nın koluyla balık halinin arkasındaki dar sokakta çarpıştın.", en: "So no one would reach the hospital, you took on Cleaver's column in the narrow alley behind the fish market." }
          - id: "geri_don"
            etiket: { tr: "\"Dön, Pala. Bu gece kimse ölmesin.\"", en: "\"Turn around, Cleaver. Nobody dies tonight.\"" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Pala'yı balık halinin arkasında tek cümleyle geri döndürdün; Demir Gece daha başlamadan bitti.", en: "You turned Cleaver around behind the fish market with one sentence. Iron Night ended before it ever started." }
            sonraki: "elif_lonca_darbesi_pala_teslim"

      - id: "elif_lonca_darbesi_iskele"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonunda Lonca'nın adamları Konsey üyelerini plastik koltuklara bağlamış. Gişe camları paramparça, kalkış panosunun harfleri yerlere saçılmış.", en: "In the {yer:kiyikent_iskele} waiting hall, Guild men have zip-tied the Council members to the plastic seats. The ticket window glass is smashed. The departures board letters are scattered all over the floor." }
          - { tr: "İş çabuk bitiyor; bu adamlar senin karşında gölge bile sayılmaz. Rıza Reis'in bağlarını çözerken ihtiyar kaptan kolunu yakalıyor. \"Bu gözdağıydı,\" diyor. \"Asıl iş Gümrük'te.\"", en: "It doesn't take long. Next to you, these men aren't even shadows. As you cut Skipper Reese loose, the old captain grabs your arm. \"This was just for show,\" he says. \"The real job is at the Customs House.\"" }
          - { tr: "Pencereden dışarı bakınca görüyorsun: {yer:kiyikent_liman|in} öbür ucunda, Gümrük binasının üstüne turuncu bir ışık yükseliyor.", en: "You look out the window. At the far end of {yer:kiyikent_liman}, an orange light is rising over the Customs House." }
        secenekler:
          - id: "nobetle"
            etiket: { tr: "Nöbetçiler kapıyı tutarken Gümrük'e koş", en: "Run for the Customs House while the guards hold the door" }
            goster: { bayrak: "demir_gece_nobet" }
            etkiler:
              - bayrak: "konsey_kurtarildi"
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Konsey'i İskele'de çözdün; Gümrük'ün kapısını ise koyduğun nöbetçiler sen gelene kadar tuttu.", en: "You cut the Council loose at the Terminal, and the guards you'd posted held the Customs House door until you got there." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "fisek"
            etiket: { tr: "Fişeği görür görmez çatılardan Gümrük'e atla", en: "The second you see the flare, take the rooftops" }
            goster: { bayrak: "demir_gece_isaret" }
            gerekli: { stat: { agi: 150 } }
            etkiler:
              - bayrak: "konsey_kurtarildi"
              - dikkat: 4
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Gümrük'ün üstünde bir fişek yandı; Konsey'i çözüp çatılardan oraya yetiştin.", en: "A flare went up over the Customs House. You cut the Council loose and made it there across the rooftops." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "catilar"
            etiket: { tr: "Çatılardan Gümrük'e atla", en: "Take the rooftops to the Customs House" }
            gerekli: { stat: { agi: 250 } }
            etkiler:
              - bayrak: "konsey_kurtarildi"
              - dikkat: 6
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Konsey'i çözdükten sonra çatılardan Gümrük'e uçar gibi gittin; Demir Gece iki cephesini de kaybetti.", en: "After you freed the Council, you all but flew across the rooftops to the Customs House. The Iron Night lost on both fronts." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "kos"
            etiket: { tr: "Yine de Gümrük'e koş", en: "Run for the Customs House anyway" }
            etkiler:
              - npc_ol: "elif_sari"
              - bayrak: "konsey_kurtarildi"
              - ahlak: { merhamet: 2, duzen: 2 }
            kronik: { tr: "Konsey'i kurtarıp Gümrük'e koştun; daha yolu yarılamadan koşmanın artık bir anlamı kalmadığını anladın.", en: "You saved the Council and ran for the Customs House. Halfway there, you knew running didn't matter anymore." }
            sonraki: "elif_lonca_darbesi_olum"
          - id: "riza"
            etiket: { tr: "Yaralı Reis'i sırtlanıp öyle koş", en: "Get the wounded Skipper on your back and run" }
            etkiler:
              - npc_ol: "elif_sari"
              - bayrak: "konsey_kurtarildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
            kronik: { tr: "Sırtında yaralı bir ihtiyarla {yer:kiyikent_liman|i} boydan boya koştun, ama geç kaldın.", en: "You ran the length of {yer:kiyikent_liman} with a wounded old man on your back, and still got there too late." }
            sonraki: "elif_lonca_darbesi_olum"

      - id: "elif_lonca_darbesi_bedel"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gaz bombalarından biri ikinci kattaki camı kırınca içeriden bir öksürük dalgası yükseliyor. Sen Pala'yla boğuşurken Gümrük'ün kapısı açılıyor ve {npc:elif_sari} dışarı çıkıyor; kucağında, yüzüne ıslak bez kapatılmış bir çocuk.", en: "A gas bomb smashes a second-floor window and a wave of coughing rises inside. While you're grappling with Cleaver, the Customs House door opens and {npc:elif_sari} comes out with a kid in her arms and a wet rag over the kid's face." }
          - { tr: "Pala'nın adamlarından genç ve korkmuş biri tetiğe basıyor. Silah sesi sokakta yankılanırken {npc:elif_sari}, çocuk hâlâ kucağında, merdivenlerin ortasına oturuveriyor; biraz soluklanmak ister gibi.", en: "One of Cleaver's men, young and terrified, pulls the trigger. The shot echoes down the street, and {npc:elif_sari} sits down in the middle of the steps with the kid still in her arms, like she just needed a minute's rest." }
        secenekler:
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; kurşundan önce orada ol", en: "Reveal your real level and beat the bullet there" }
            goster: { gizli_fark_min: 1 }
            etkiler:
              - aciga_vur: true
              - bayrak: "demir_gece_seviye"
              - dikkat: 8
              - ahlak: { merhamet: 3, insanlik: -1 }
              - iliski: { elif_sari: { korku: 3, saygi: 4 } }
            kronik: { tr: "Demir Gece'de gerçek seviyeni herkesin önünde açtın; kurşun {npc:elif_sari|e} değil sana çarptı.", en: "On the Iron Night you showed everyone your true level, and the bullet hit you instead of {npc:elif_sari}." }
            sonraki: "elif_lonca_darbesi_son_an"
          - id: "kalkan"
            etiket: { tr: "Kurşunun önüne kendini at", en: "Throw yourself in front of the bullet" }
            gerekli: { stat: { end: 250 } }
            etkiler:
              - can: -40
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 6 } }
            kronik: { tr: "Gümrük'ün merdivenlerinde kurşunun önüne geçtin; {npc:elif_sari} o gece de hastalarını dikti.", en: "On the Customs House steps you stepped in front of the bullet, and {npc:elif_sari} went on stitching her patients that night." }
            sonraki: "elif_lonca_darbesi_son_an"
          - id: "kos"
            etiket: { tr: "Ona koş", en: "Run to her" }
            etkiler:
              - npc_ol: "elif_sari"
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Gümrük'ün merdivenlerine koştun, ama hekimi kurtaramadın.", en: "You ran for the Customs House steps, but you couldn't save the doctor." }
            sonraki: "elif_lonca_darbesi_olum"
          - id: "tetik"
            etiket: { tr: "Önce tetiğe basanı yere ser", en: "Drop the kid who pulled the trigger first" }
            etkiler:
              - npc_ol: "elif_sari"
              - ahlak: { merhamet: -4, duzen: 2 }
            kronik: { tr: "Merdivenlere koşmadan önce tetiği çeken çocuğu yere serdin.", en: "On Iron Night, you put down the boy who pulled the trigger first. Then you ran for the steps." }
            sonraki: "elif_lonca_darbesi_olum"

      - id: "elif_lonca_darbesi_son_an"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kurşun havada asılı kalmış gibi geliyor; belki de sen o kadar hızlısın. Bir adımda merdivendesin, ikincisinde {npc:elif_sari|in} önünde. Kurşun omzuna çarpıp yere düşüyor: ezik, sıcak bir metal parçası.", en: "The bullet seems to hang in the air. Or maybe you're just that fast. One step and you're on the stairs, the next and you're in front of {npc:elif_sari}. The bullet hits your shoulder and drops to the ground, a flattened, hot scrap of metal." }
          - metin: { tr: "Sokak susuyor. Pala'nın adamları silahlarını indiriyor; biri pencerende yanan sayıyı fısıltıyla okuyor, öbürü geri geri çekiliyor.", en: "The street goes silent. Cleaver's men lower their guns. One of them whispers the number burning in your status window. Another starts backing away." }
            kosul: { bayrak: "demir_gece_seviye" }
          - { tr: "{npc:elif_sari} çocuğu sıkıca tutmuş, sana bakıyor; nefesi kesik kesik. \"Kanıyorsun,\" diyor sonunda, sesi titremeden. \"Otur. Bu merdivenler benim koğuşum sayılır.\"", en: "{npc:elif_sari} is holding the kid tight, staring at you, her breath coming short. \"You're bleeding,\" she says at last, and her voice doesn't shake. \"Sit down. These steps count as my ward.\"" }
        sezgiler:
          - kosul: { bayrak: ["yanki_bagi", "demir_gece_seviye"] }
            metin: { tr: "işte bu yüzden saklıyordun. ve işte bu yüzden artık saklayamazsın.", en: "this is why you were hiding it. and this is why you can't anymore." }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Pala'yı Konsey'e teslim et", en: "Turn Cleaver over to the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4, guven: 4 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "Kurşunu üstlendiğin gecenin sabahı Pala'yı Konsey'e teslim ettin.", en: "The morning after you took the bullet, you turned Cleaver over to the Council." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "otur"
            etiket: { tr: "Merdivene otur; dikişi ona bırak", en: "Sit on the steps and let her stitch you" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "Demir Gece'nin sonunda Gümrük'ün merdivenlerinde oturup omzunu {npc:elif_sari|e} diktirdin.", en: "When the Iron Night was over, you sat on the Customs House steps and let {npc:elif_sari} stitch up your shoulder." }
            sonraki: "elif_lonca_darbesi_sabah"
      - id: "elif_lonca_darbesi_olum"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} Gümrük'ün merdivenlerinde oturuyor. Önlüğünün göğsü kıpkırmızı; elinde neşteri var, ayaklarının dibinde üç Lonca adamı inliyor. Arkasındaki kapı kapalı, koğuş sağlam. Kapıyı o tutmuş.", en: "{npc:elif_sari} is sitting on the Customs House steps. The front of her coat is red. She's got her scalpel in her hand, and three Guild men are groaning at her feet. The door behind her is shut and the ward is intact. She held the door." }
          - metin: { tr: "Yanına çöktüğünde \"Sabaha kadar kal,\" diyor. \"Söz vermiştin. Belki de vermemiştin. Sen yine de kal.\"", en: "\"Stay till morning,\" she says, when you drop down beside her. \"You promised. Or you didn't. Stay anyway.\"" }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "Yanına çöktüğünde \"Bin dört yüz...\" diyor; aklındaki sayıyı arayıp buluyor. \"Bin dört yüz yedi. Beni de say.\"", en: "\"One thousand four hundred...\" she says when you drop down beside her, hunting for a number, finding it. \"One thousand four hundred and seven. Count me too.\"" }
            kosul: { bayrak: "elif_gece_nobeti_bitti", bayrak_yok: "elif_ask" }
          - metin: { tr: "Yanına çöktüğünde \"Koğuş,\" diyor. \"Koğuş sağlam mı?\" Başınla evet diyorsun. \"İyi,\" diyor. \"İyi.\"", en: "\"The ward,\" she says when you drop down beside her. \"Is the ward okay?\" You nod. \"Good,\" she says. \"Good.\"" }
            kosul: { bayrak_yok: "elif_gece_nobeti_bitti" }
          - { tr: "Neşteri avucuna bırakıp parmaklarını üstüne kapatıyor, hastaya ilacını verir gibi. Ardından saati soruyor, sen söylüyorsun. Gözlerini kapamadan önce saati yüksek sesle tekrarlıyor; her zamanki gibi.", en: "She presses the scalpel into your palm and closes your fingers over it, the way she'd hand a patient their pills. Then she asks what time it is. You tell her. Before she closes her eyes, she repeats the time out loud. Like always." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[{npc:elif_sari|tam} · Durum: Öldü]", en: "[{npc:elif_sari|tam} · Status: Deceased]" }
            satirlar:
              - { tr: "Konsey başkanlığı: boş.", en: "Council chair: vacant." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ayamadığım bir şey bitti. nasıl kaydedilir, bilmiyorum. kaydetmeyeceğim de.", en: "s̷omething i couldn't count just ended. i don't know how to log that. i'm not going to." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Daha geçen hafta onunla...\" Cümleyi bitirmiyor; kalkanını merdivenin dibine bırakıp {npc:elif_sari|in} yanına oturuyor.", en: "\"Just last week I was with her...\" {zamir:deniz_arman|o|b} {zamir:deniz_arman|does}n't finish. {zamir:deniz_arman|o|b} put{zamir:deniz_arman|s} {zamir:deniz_arman|onun} shield down at the foot of the steps and sit{zamir:deniz_arman|s} down beside her." }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kayda geçireceğim,\" diyor, sesi çatlayarak. \"Her şeyi. Kim tetiğe bastı, kim emir verdi. Hepsini.\"", en: "\"I'm logging it,\" he says, his voice cracking. \"All of it. Who pulled the trigger, who gave the order. Every bit of it.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "Bir süre hiçbir şey söylemiyor. Sonra kılıcını çekip kapıya asılı Lonca sancağını ikiye biçiyor, kimseye bakmadan.", en: "For a while he says nothing. Then he draws his sword and cuts the Guild banner on the door in two, without looking at anyone." }
        secenekler:
          - id: "bant"
            etiket: { tr: "Bandı kendin yapıştır; yanına bir bardak su bırak", en: "Put the tape on yourself. Leave a glass of water" }
            etkiler:
              - hafiza: { npc: "deniz_arman", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "mert_kilic", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "aras_kurt", id: "elif_kaybi", agirlik: 3 }
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "{npc:elif_sari|in} alnına bandı kendi elinle yapıştırıp yanına bir bardak su bıraktın; ertesi sabah {yer:kiyikent_liman|in} beyaz tahtasında da siyah bandın altına bir bardak su kondu.", en: "You put the tape on {npc:elif_sari|pos} forehead with your own hand and left a glass of water beside her. The next morning, a glass of water went under the black tape on {yer:kiyikent_liman|pos} whiteboard too." }
            sonraki: "elif_lonca_darbesi_yas"
          - id: "pala"
            etiket: { tr: "Neşteri sıkıp Pala'yı bul", en: "Grip the scalpel and find Cleaver" }
            etkiler:
              - hafiza: { npc: "deniz_arman", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "mert_kilic", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "aras_kurt", id: "elif_kaybi", agirlik: 3 }
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - ahlak: { merhamet: -4, duzen: -2 }
              - savas: { dusmanlar: ["pala@dunya"], ortam: ["karanlik"], kazan: "elif_lonca_darbesi_intikam", kaybet: "elif_lonca_darbesi_yas", kac: "elif_lonca_darbesi_yas" }
            kronik: { tr: "{npc:elif_sari|in} neşterini avucunda sıkıp Pala'nın peşine düştün.", en: "You closed your fist around {npc:elif_sari|pos} scalpel and went after Cleaver." }
          - id: "kogus"
            etiket: { tr: "Koğuşa gir; hastalar bekliyor", en: "Go into the ward. The patients are waiting" }
            etkiler:
              - hafiza: { npc: "deniz_arman", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "mert_kilic", id: "elif_kaybi", agirlik: 6 }
              - hafiza: { npc: "aras_kurt", id: "elif_kaybi", agirlik: 3 }
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Hekim ölünce koğuşuna girdin ve sabaha kadar onun işini sen yaptın; o da bunu isterdi.", en: "After the doctor died, you walked into her ward and did her job until morning. It's what she would have wanted." }
            sonraki: "elif_lonca_darbesi_yas"

      - id: "elif_lonca_darbesi_intikam"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala'yı rıhtımın ucunda, bir kayığa atlamaya çalışırken yakalıyorsun. Dizlerinin üstüne çökmüş, kollarını iki yana açmış; o eski sakinliğinden eser yok.", en: "You catch Cleaver at the end of the quay, trying to get into a skiff. He's on his knees with his arms spread wide. He isn't calm anymore." }
          - { tr: "\"Ben emir vermedim,\" diyor. \"Çocuk korktu. Ben... ben faturayı kesecektim, o kadar.\" Avucundaki neşter, bir hekimin elindeyken olduğu kadar temiz değil.", en: "\"I didn't give the order,\" he says. \"The kid panicked. I was... I was just going to send the bill. That's all.\" The scalpel in your hand isn't as clean as it was in a doctor's." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Faturayı sen kes", en: "You send the bill" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -6, insanlik: -2 }
              - itibar: { lonca: -10 }
            kronik: { tr: "Pala'yı rıhtımın ucunda {npc:elif_sari|in} neşteriyle öldürdün; yara kapatmak için yapılmış bir bıçakla.", en: "You killed Cleaver at the end of the quay with {npc:elif_sari|pos} scalpel, a blade made for closing wounds." }
            sonraki: "elif_lonca_darbesi_yas"
          - id: "konsey"
            etiket: { tr: "Onu Konsey'in önüne sürükle", en: "Drag him in front of the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "{npc:elif_sari|i} öldüren gecenin hesabını kanla değil, Konsey'in önünde sordun.", en: "You made the night that killed {npc:elif_sari} answer to the Council, not to your blade." }
            sonraki: "elif_lonca_darbesi_yas"

      - id: "elif_lonca_darbesi_yas"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sabah Konsey, {yer:kiyikent_iskele|in} kırık camlarının ardında yeniden toplanıyor, ama bir kişi eksik. Panoyu çeviren çocuk harfleri yerden tek tek toplamış, en alt satıra tek bir şey dizmiş: DÜN ÖLEN 1.", en: "In the morning the Council meets again behind the broken glass of the {yer:kiyikent_iskele}, short one. The kid who flips the board has picked the letters up off the floor one by one, and on the bottom line he's spelled out just one thing: DEAD YESTERDAY 1." }
          - { tr: "Adı kimse yazmıyor; zaten herkes biliyor. Nurhan beyaz tahtanın köşesine siyah bir bant yapıştırıyor, altına hiçbir şey yazmadan bir bardak su bırakıyor.", en: "Nobody writes the name. Everybody knows it. Nora sticks a strip of black tape in the corner of the whiteboard. She doesn't write anything under it. She leaves a glass of water." }
          - metin: { tr: "Lonca'nın adamları {yer:kiyikent_liman|den} çekilmiş. Demir Gece amacına ulaşamadı, ama bedeli bir hekimin canı oldu.", en: "The Guild's men have pulled out of {yer:kiyikent_liman}. Iron Night failed. It cost them a doctor." }
            kosul: { bayrak_yok: "darbe_basarili" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Konsey'i yeniden kur; onun kurallarıyla", en: "Rebuild the Council. By her rules" }
            etkiler:
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - ahlak: { duzen: 4, merhamet: 3 }
              - itibar: { siginak: 8, lonca: -5 }
            kronik: { tr: "Hekimin ölümünden sonra Konsey'i onun kurallarıyla yeniden kurdun ve tahtanın köşesindeki siyah bandı yerinde bıraktın.", en: "After the doctor died, you rebuilt the Council by her rules and left the black tape in the corner of the board." }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Bu gece de koğuşta kal", en: "Stay on the ward tonight, too" }
            etkiler:
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Hekimin ölümünden sonraki geceyi onun koğuşunda nöbetle geçirdin; ertesi gece de kalmaya çoktan karar vermiştin.", en: "The night after the doctor died, you stood watch on her ward, and you'd already decided to stay the next night too." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_sessizlik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bütün gece {yer:kiyikent_liman|den} sesler geliyor: önce silah, ardından cam, sonra bir süre hiçbir şey. Pencerenin önünde oturup hiçbirine gitmiyorsun.", en: "All night, sounds come off {yer:kiyikent_liman}: gunfire, then glass, then nothing for a while. You sit at the window and don't go to any of them." }
          - { tr: "Sabah {yer:kiyikent_liman} Lonca bayraklarıyla uyanıyor. Kalkış panosunun en alt satırında tek bir şey yazılı: DÜN ÖLEN 1. Gümrük'ün merdivenlerinde bir hekim yatıyor; neşteri elinde, arkasındaki kapı hâlâ kapalı.", en: "{yer:kiyikent_liman|b} wakes up under Guild flags. The bottom line of the departures board says one thing: DEAD YESTERDAY 1. A doctor is lying on the Customs House steps with her scalpel in her hand, and the door behind her is still shut." }
          - { tr: "Sokağında tek kapı kırılmamış. Lonca'nın adamları gece yarısı kapına kadar gelmiş, kimin oturduğunu görünce geri dönmüş; gerçek seviyeni gören olmamış. Sabah komşuların sana çay getiriyor ama hiçbiri gözünün içine bakmıyor.", en: "No door on your street was kicked in. Around midnight the Guild men came to your door, saw who lived there, and turned back. Nobody saw your real level. In the morning your neighbors bring you tea, and not one of them looks you in the eye." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[{npc:elif_sari|tam} · Durum: Öldü]", en: "[{npc:elif_sari|tam} · Status: Deceased]" }
            satirlar:
              - { tr: "Bölge kontrolü değişti: {yer:kiyikent_liman} · Demir Lonca.", en: "Zone control changed: {yer:kiyikent_liman|b} · Iron Guild." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Evdeydin,\" diyor. Soru değil.", en: "\"You were home,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. It isn't a question." }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Lonca'nın telsizini bütün gece dinledim. Senin adın bir kez bile geçmedi. Bunu nasıl başardığını sormayacağım.\"", en: "\"I listened to the Guild's radio all night. Your name didn't come up once. I'm not going to ask how you managed that.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kazanmak için bazen kapını kapatırsın,\" diyor. \"Ama bunu bir daha yaparsan seninle yarışmam.\"", en: "\"Sometimes you shut your door to win,\" he says. \"Do it again and I'm done racing you.\"" }
        secenekler:
          - id: "bak"
            etiket: { tr: "Merdivenlere git ve bak", en: "Go to the steps and look" }
            etkiler:
              - hafiza: { npc: "deniz_arman", id: "elif_evde_kaldi", agirlik: -8 }
              - hafiza: { npc: "mert_kilic", id: "elif_evde_kaldi", agirlik: -6 }
              - hafiza: { npc: "aras_kurt", id: "elif_evde_kaldi", agirlik: -4 }
              - xp_seviye: 20
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Sabah olunca, gece gitmediğin merdivenlere gidip baktın.", en: "On the morning after Iron Night, you went and looked at the steps you hadn't gone to." }
            sonraki: "@akis"
          - id: "donme"
            etiket: { tr: "Pencereden dön", en: "Turn away from the window" }
            etkiler:
              - hafiza: { npc: "deniz_arman", id: "elif_evde_kaldi", agirlik: -8 }
              - hafiza: { npc: "mert_kilic", id: "elif_evde_kaldi", agirlik: -6 }
              - hafiza: { npc: "aras_kurt", id: "elif_evde_kaldi", agirlik: -4 }
              - xp_seviye: 20
              - ahlak: { insanlik: -3, merhamet: -1 }
            kronik: { tr: "Demir Gece'nin sabahı pencereden dönüp o merdivenlere bakmadın.", en: "On the morning after Iron Night, you turned away from the window and didn't look at those steps." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala'nın adamları karanlığa dağılıyor; geride gaz bombaları, kırık kalkanlar, bir de tek postal kalıyor. Pala dizlerinin üstüne çökmüş, soluk soluğa sana bakıp gülmeye çalışıyor ama beceremiyor.", en: "Cleaver's men scatter into the dark, leaving gas bombs, broken shields, and one boot on the pavement. Cleaver's on his knees, out of breath, looking up at you and trying to laugh. He can't manage it." }
          - { tr: "Gümrük'ün kapısı açılıyor ve {npc:elif_sari} elinde neşteri, tertemiz önlüğüyle merdivenlerden iniyor. Önce Pala'ya, sonra sana bakıp \"Benim hastanemde kimse ölmez,\" diyor. \"O da dahil.\"", en: "The Customs House door opens. {npc:elif_sari} comes down the steps with her scalpel in her hand and her coat clean. She looks at Cleaver, then at you. \"Nobody dies in my hospital,\" she says. \"Him included.\"" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Pala'yı Konsey'in önüne çıkar", en: "Put Cleaver in front of the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4, guven: 3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "Demir Gece'nin elebaşını öldürmedin; Konsey'in önüne çıkardın.", en: "You didn't kill the man behind Iron Night. You put him in front of the Council." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "oldur"
            etiket: { tr: "Pala'yı orada, merdivenlerin dibinde bitir", en: "Finish Cleaver right there at the foot of the steps" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -6, insanlik: -2 }
              - itibar: { lonca: -10 }
              - iliski: { elif_sari: { guven: -10, korku: 6 } }
            kronik: { tr: "Pala'yı bir hekimin hastanesinin merdivenlerinde, onun gözü önünde öldürdün; hem de orada kimsenin ölmeyeceğini söylediği anda.", en: "You killed Cleaver on the steps of a doctor's hospital, right in front of her, moments after she said nobody dies there." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "git"
            etiket: { tr: "\"Git. Patronuna mesajı götür.\"", en: "\"Go. Take the message to your boss.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - degisken: { lonca_golgesi: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Pala'yı Lonca'ya bir mesajla salıverdin: {yer:kiyikent_liman|in} artık bir kalkanı vardı.", en: "You let Cleaver go with a message for the Guild: {yer:kiyikent_liman} had a shield now." }
            sonraki: "elif_lonca_darbesi_sabah"

      - id: "elif_lonca_darbesi_pala_teslim"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Önce bir kalkan düşüyor yere, ardından bir sopa, bir gaz tüpü. Pala'nın adamları birer birer geri çekiliyor; kimi başını önüne eğmiş, kimi gözünü Gümrük'ün pencerelerine dikmiş.", en: "First a shield hits the ground, then a bat, then a gas canister. Cleaver's men back away one at a time. Some of them have their heads down. Some of them are looking up at the Customs House windows." }
          - { tr: "Pala ortada tek başına kalıyor. Bir süre bekledikten sonra balık bıçağını kınından çekip yere bırakıyor. \"Bu fatura,\" diyor, \"benden.\"", en: "Cleaver's left by himself. He stands there for a while, then draws the fish knife and sets it on the ground. \"This bill,\" he says, \"is on me.\"" }
          - { tr: "Gümrük'ün kapısı açılıyor, {npc:elif_sari} dışarı çıkıyor. Yangın tüpü hâlâ elinde; elleri ancak şimdi titremeye başlıyor.", en: "The Customs House door opens and {npc:elif_sari} steps out, extinguisher still in her hands. Her hands are only just now starting to shake." }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Pala'yı Konsey'e teslim et", en: "Turn Cleaver over to the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "Demir Gece tek kurşun atılmadan bitti; elebaşı bıçağını yere bırakıp Konsey'e teslim oldu.", en: "Iron Night ended without a shot, and the man behind it laid down his own knife and surrendered to the Council." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "eller"
            etiket: { tr: "{npc:elif_sari|in} titreyen ellerini tut", en: "Take {npc:elif_sari|pos} shaking hands" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 6, guven: 3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
            kronik: { tr: "Demir Gece bitince yaptığın ilk iş, bir hekimin titreyen ellerini tutmak oldu.", en: "When Iron Night was over, the first thing you did was hold a doctor's shaking hands." }
            sonraki: "elif_lonca_darbesi_sabah"

      - id: "elif_lonca_darbesi_pazarlik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala gülümsüyor, bu sefer içten. İlaç deposunun kasaları Gümrük'ün arka kapısından teker teker çıkarılıp Lonca kamyonlarına yükleniyor.", en: "Cleaver smiles, and this time he means it. The crates from the medicine stores come out the Customs House back door one by one and get loaded onto Guild trucks." }
          - { tr: "{npc:elif_sari} son kasanın ardından bakakalıyor. \"Beni kurtardın,\" diyor, \"koğuşu da sattın. İkisini aynı gecede yapabileceğini bilmezdim.\"", en: "{npc:elif_sari} watches the last crate go. \"You saved me,\" she says, \"and you sold my ward. I didn't know you could do both in one night.\"" }
        secenekler:
          - id: "gerekti"
            etiket: { tr: "\"Yaşaman gerekiyordu.\"", en: "\"You needed to live.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_uzlasma"
              - xp_seviye: 40
              - degisken: { hayatta_kalan: -2 }
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { siginak: -8, lonca: 6 }
              - iliski: { elif_sari: { guven: -8, baglilik: 3 } }
              - tohum: { olay: "elif_yoldas_darbe", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_red"] }, hatirlatma: { tr: "Demir Gece'den beri {npc:elif_sari} Gümrük'ün kırık camlarıyla uğraşıyor; seni görmek istiyormuş.", en: "Ever since the Iron Night, {npc:elif_sari} has been patching the Customs House windows. Word is she wants to see you." } }
            kronik: { tr: "Demir Gece'de hekimi kurtardın ama koğuşun ilaçlarını Lonca'ya verdin; Gümrük'ün ilaçsız kalacağını bile bile.", en: "On Iron Night you saved the doctor and handed the ward's medicine to the Guild, knowing the Customs House would go without." }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "\"İlaçları geri getireceğim.\"", en: "\"I'll bring the medicine back.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_uzlasma"
              - xp_seviye: 40
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { siginak: -4, lonca: 2 }
              - iliski: { elif_sari: { guven: -3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 3, max: 6 }, hatirlatma: { tr: "Demir Gece'nin hesabı bekleme salonunda görülecek.", en: "The bill for the Iron Night comes due in the waiting room." } }
              - tohum: { olay: "elif_yoldas_darbe", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_red"] }, hatirlatma: { tr: "Demir Gece'den beri {npc:elif_sari} Gümrük'ün kırık camlarıyla uğraşıyor; seni görmek istiyormuş.", en: "Ever since the Iron Night, {npc:elif_sari} has been patching the Customs House windows. Word is she wants to see you." } }
            kronik: { tr: "Demir Gece'de Lonca'ya verdiğin ilaçları geri getireceğine söz verdin.", en: "On Iron Night you promised to bring back the medicine you'd handed the Guild." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak sökerken Gümrük'ün merdivenlerinde oturuyorsunuz. {npc:elif_sari} senin avucundaki küçük bir kesiği sargı beziyle sarıyor; kesik öyle küçük ki bütün gece farkına varmamışsın. O varmış.", en: "At dawn the two of you are sitting on the Customs House steps. {npc:elif_sari} is wrapping a little cut on your palm with a strip of gauze. It's so small you didn't notice it all night. She did." }
          - metin: { tr: "Sargıyı bitirince elini hemen bırakmıyor. Bir an alnını omzuna dayıyor, sonra doğrulup hiçbir şey olmamış gibi önlüğünü düzeltiyor. Oysa olmuş.", en: "When she's done, she doesn't let go of your hand right away. For a moment she rests her forehead against your shoulder. Then she straightens up and fixes her coat like nothing happened. Something did." }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "Rıza Reis'in İskele'den gelen sesi rıhtım boyunca yankılanıyor: Konsey toplanıyor, hem de eksiksiz.", en: "Skipper Reese's voice carries down the quay from the Terminal: the Council is meeting. Every seat filled." }
            kosul: { bayrak: "konsey_kurtarildi" }
          - { tr: "\"Bin dört yüz yedi olmadı,\" diyor {npc:elif_sari}, gözü gökyüzünde. \"Bu gece sayıya kimse eklenmedi.\"", en: "\"It didn't hit one thousand four hundred and seven,\" {npc:elif_sari} says, looking at the sky. \"Nobody got added tonight.\"" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Konsey'i topla; bu gece kayda geçsin", en: "Gather the Council. Put tonight on the record" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - bayrak: "konsey_kurtarildi"
              - xp_seviye: 60
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 8, lonca: -6 }
              - iliski: { elif_sari: { saygi: 4 } }
              - tohum: { olay: "elif_yoldas_darbe", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_red"] }, hatirlatma: { tr: "Demir Gece'den beri {npc:elif_sari} Gümrük'ün kırık camlarıyla uğraşıyor; seni görmek istiyormuş.", en: "Ever since the Iron Night, {npc:elif_sari} has been patching the Customs House windows. Word is she wants to see you." } }
            kronik: { tr: "Demir Gece'yi püskürtüp Konsey'in kayıtlarına geçirdin; o gece artık {yer:kiyikent_liman|in} tarihinin bir parçasıydı.", en: "You beat back Iron Night and had it entered into the Council's record. That night was part of {yer:kiyikent_liman|pos} history now." }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "\"Bu gece de buradayım.\"", en: "\"I'm here tonight, too.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:elif_lonca_darbesi", agirlik: 40 }
              - tohum: { olay: "elif_yoldas_darbe", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_red"] }, hatirlatma: { tr: "Demir Gece'den beri {npc:elif_sari} Gümrük'ün kırık camlarıyla uğraşıyor; seni görmek istiyormuş.", en: "Ever since the Iron Night, {npc:elif_sari} has been patching the Customs House windows. Word is she wants to see you." } }
            kronik: { tr: "Demir Gece'nin ardından Gümrük'ün merdivenlerinde bir hekime 'Bu gece de buradayım' dedin ve ciddiydin.", en: "After Iron Night, on the Customs House steps, you told a doctor, \"I'm here tonight, too.\" You meant it." }
            sonraki: "@akis"
          - id: "hesap"
            etiket: { tr: "{yer:sanayi|e} git; Lonca'ya hesap sor", en: "Go to {yer:sanayi}. Make the Guild answer" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - dikkat: 3
              - ahlak: { duzen: -1, merhamet: 1 }
              - itibar: { lonca: -10, siginak: 5 }
              - iliski: { elif_sari: { korku: 2 } }
              - tohum: { olay: "elif_yoldas_darbe", gecikme: { min: 2, max: 4 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: ["elif_yoldas", "elif_yoldas_red"] }, hatirlatma: { tr: "Demir Gece'den beri {npc:elif_sari} Gümrük'ün kırık camlarıyla uğraşıyor; seni görmek istiyormuş.", en: "Ever since the Iron Night, {npc:elif_sari} has been patching the Customs House windows. Word is she wants to see you." } }
            kronik: { tr: "Demir Gece'nin sabahı {yer:sanayi|e} yürüyüp Lonca'ya {yer:kiyikent_liman|e} yürümenin hesabını sordun.", en: "The morning after Iron Night you walked into {yer:sanayi} and made the Guild answer for marching on {yer:kiyikent_liman}." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Pala'nın yargılanması (tohum)
  - id: "pala_yargilanmasi"
    konum: ["kiyikent_liman"]
    perde: [3]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["siginak", "lonca", "konsey", "ahlak"]
    gerilim: 2
    onemli: true
    kart: { tr: "Bekleme salonunda mahkeme", en: "Court in the waiting hall" }
    sahne: "pala_yargilanmasi_1"
    sahneler:
      - id: "pala_yargilanmasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonu mahkemeye dönmüş. Plastik koltuklar sıra sıra dizili, Konsey gişelerin ardına oturmuş; ortada, bir bavul arabasının yanında elleri önden bağlı Pala duruyor.", en: "The {yer:kiyikent_iskele} waiting hall has turned into a courtroom. Plastic seats in rows, the Council behind the ticket windows, and in the middle, next to a luggage cart, Cleaver, his hands tied in front of him." }
          - metin: { tr: "Tanık olarak {npc:elif_sari} çağrılınca kalkıp bavul arabasının yanına yürüyor, Pala'yı süzüyor. \"Bu adamın kolunu iki kez diktim,\" diyor. \"İkisinde de ağlamadı. Dün gece ağladı.\"", en: "{npc:elif_sari} is called as a witness. She walks up next to the luggage cart and looks at Cleaver. \"I stitched this man's arm twice,\" she says. \"He didn't cry either time. Last night he cried.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Tanık sandalyesi boş; Nurhan üstüne bir neşter bırakmış. Pala gözünü ondan alamıyor.", en: "The witness chair is empty. Nora has left a scalpel on it, and Cleaver can't take his eyes off it." }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Demir Gece'yi durduran sen olduğun için Konsey kararı sana bırakıyor. Salonda çıt çıkmıyor.", en: "The Council leaves the verdict to you. You're the one who stopped Iron Night. The hall goes quiet." }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Pala'nın korkusu ölmek değil, unutulmak.", en: "Cleaver isn't afraid of dying. He's afraid of being forgotten." }
        secenekler:
          - id: "idam"
            etiket: { tr: "\"Demir Gece'nin bedeli bir hayat.\"", en: "\"Iron Night costs a life.\"" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -5, duzen: 4 }
              - itibar: { lonca: -6, siginak: 2 }
              - iliski: { elif_sari: { guven: -6 } }
            kronik: { tr: "Pala'yı Konsey kararıyla idam ettirdin; {yer:kiyikent_liman} o gün ilk kez kendi eliyle can aldı.", en: "You had Cleaver executed by order of the Council. For the first time, {yer:kiyikent_liman} killed someone with its own hands." }
            sonraki: "@akis"
          - id: "surgun"
            etiket: { tr: "\"{yer:kiyikent|den} sürülsün.\"", en: "\"He's banished from {yer:kiyikent}.\"" }
            etkiler:
              - bayrak: "pala_surgun"
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Pala'yı {yer:kiyikent|den} sürdün; son görüldüğünde {yer:kordon} yolunda tek başına yürüyordu.", en: "You banished Cleaver from {yer:kiyikent}. The last time anyone saw him, he was walking down {yer:kordon} road alone." }
            sonraki: "@akis"
          - id: "kazi"
            etiket: { tr: "\"Son Sığınak'ın kazısında çalışacak.\"", en: "\"He'll work the dig on the Last Haven.\"" }
            etkiler:
              - bayrak: "pala_kazida"
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 4, lonca: 2 }
              - iliski: { elif_sari: { saygi: 4, guven: 3 } }
            kronik: { tr: "Pala'yı Son Sığınak'ın kazısına mahkûm ettin; Demir Gece'nin elebaşı, ezmeye kalktığı insanlar için kaya oyacaktı.", en: "You sentenced Cleaver to dig out the Last Haven. The man behind Iron Night spent his days cutting rock for the people he'd tried to break." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 4 — SON SIĞINAK (P3, AY 268)
  # Kuru havuzda Son Sığınak. Duvardaki çentikler: önceki döngüden kalan bir Sığınak (bilgi onceki_siginak; Döngü sonu ipucu).
  - id: "siginak_4_son_siginak"
    konum: ["kiyikent_liman"]
    perde: [3]
    gun: { min: 250, max: 320 }
    ana_yay: { gun: 268 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_3_bitti" }
    etiketler: ["siginak", "zincir", "kazi", "sir"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kuru havuz", en: "The drydock" }
    sahne: "siginak_4_son_siginak_1"
    sahneler:
      - id: "siginak_4_son_siginak_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} tersanesindeki kuru havuz, eskiden feribotların karınlarının kazındığı devasa bir taş çanak. Şimdi dibinde yüzlerce kişi kazma sallıyor. Kenarlara iskeleler kurulmuş, iskelelere vinçler, vinçlere de çocukların çamaşırları asılmış.", en: "The drydock in {yer:kiyikent_liman} shipyard used to be where they scraped the barnacles off ferry hulls, a giant stone bowl cut into the shore. Now hundreds of people are swinging picks at the bottom of it. Scaffolds along the walls, cranes on the scaffolds, kids' laundry on the cranes." }
          - { tr: "Bu sabah herkesin penceresinde aynı satır belirdi ve hâlâ kapanmıyor. Kimse sesli okumuyor, ama herkes okudu.", en: "This morning the same line popped up on everybody's window, and it still won't close. Nobody reads it out loud. Everybody's read it." }
          - { tr: "Kuru havuz yirmi bin kişiye göre planlanmış; tahliyelerden sonra {yer:kiyikent_liman|de} otuz bir bin kişi var. Kazının kenarındaki beyaz tahtada iki sayı yazılı ve kimse birini ötekinden çıkarmaya cesaret edemiyor.", en: "The plans for the drydock say twenty thousand people. After the evacuations, there are thirty-one thousand on {yer:kiyikent_liman}. Two numbers are written on the whiteboard at the edge of the dig, and nobody has the nerve to subtract one from the other." }
          - metin: { tr: "{npc:elif_sari} kazının kenarında bir sedyeye oturmuş, tahtaya bakıyor. \"Triyajı bilirim,\" diyor. \"Bu triyaj değil, kura bile değil. Kimin çocuğu yaşamayı daha çok hak ediyor, soru bu.\"", en: "{npc:elif_sari} is sitting on a gurney at the edge of the dig, looking at the board. \"I know triage,\" she says. \"This isn't triage. It isn't even a lottery. It's the question of whose kid deserves to live more.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Tahtanın köşesinde siyah bant hâlâ duruyor, altına bir bardak su koymayı da artık kimse unutmaz olmuş. Rıza Reis tahtaya bakıp sana dönüyor. \"O olsaydı ne derdi, biliyorsun,\" diyor.", en: "There's still a strip of black tape in the corner of the board, and nobody forgets to leave a glass of water under it anymore. Skipper Reese looks at the board and turns to you. \"You know what she'd say,\" he says." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "Kazının dibinde, kolları toz içinde, kazmasının sapına yaslanmış Pala duruyor. Seni görünce kazmayı kaldırıp selam verir gibi yapıyor.", en: "Down at the bottom of the dig, leaning on a pickaxe handle, is Cleaver, dust up to his elbows. When he sees you he lifts the pick like a salute." }
            kosul: { bayrak: "pala_kazida" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KATMAN DEĞERLENDİRMESİ · Ön bildirim]", en: "[LAYER ASSESSMENT · Advance notice]" }
            satirlar:
              - { tr: "Son değerlendirmeye kalan süre: 97 gün.", en: "Time until final assessment: 97 days." }
              - { tr: "Hazırlık önerilir. Hazırlığın işe yarayacağı garanti edilmez.", en: "Preparation is recommended. Preparation is not guaranteed to help." }
        sezgiler:
          - kosul: { stat: { str: 260 } }
            metin: { tr: "Havuzun doğu duvarının arkası boş. Taş orada incecik; ardında havuzdan da eski bir oda var.", en: "There's empty space behind the drydock's east wall. The rock is thin, and there's a chamber behind it older than the drydock." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷oğu duvarı. oraya bakma. ya da bak; ama bakarsan beni de göreceksin.", en: "t̷he east wall. don't look there. or do. but when you look, you'll see me too." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kura çekilirse benim adım torbada olmayacak. Bunu şimdiden bil.\"", en: "\"If we draw lots, I'm not putting my name in. Know that now.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On bir bin kişi daha. Sayı değil bu, koca bir şehir.\"", en: "\"Eleven thousand more. That isn't a number. That's a town.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Doğu duvarının arkasında bir boşluk var, sismograf verisinde gördüm. Bana soran olmadı tabii.\"", en: "\"There's a void behind the east wall. I saw it in the seismograph data. Nobody asked me, obviously.\"" }
        secenekler:
          - id: "herkes"
            etiket: { tr: "\"Herkese yer açacağız. Kazmaya devam.\"", en: "\"We make room for everyone. Keep digging.\"" }
            etkiler:
              - bayrak: "son_siginak_herkes"
              - ahlak: { merhamet: 4, duzen: -1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Son Sığınak'ın planını yırtıp herkese yer açılana dek kazmaya devam edilmesini emrettin.", en: "You tore up the Last Haven's plans and ordered the digging to go on until there was room for everyone." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "kura"
            etiket: { tr: "\"Kura çekin. Adil olan bu.\"", en: "\"Draw lots. That's what's fair.\"" }
            etkiler:
              - bayrak: "son_siginak_kura"
              - ahlak: { duzen: 5, merhamet: -1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: 2, guven: -2 } }
            kronik: { tr: "Son Sığınak'ın yerlerini kuraya bağladın; on bir bin kişinin kaderini bir torbadan çekilecek kâğıtlara bıraktın.", en: "You put the Last Haven's places up to a lottery and left eleven thousand fates to slips of paper pulled from a sack." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "oy"
            tur: "gosteris"
            etiket: { tr: "Kayayı kendin oy; iki haftalık işi bir gecede", en: "Carve the rock yourself. Two weeks' work in one night" }
            gerekli: { stat: { str: 260 } }
            etkiler:
              - bayrak: "son_siginak_herkes"
              - bayrak: "kaya_oyuldu"
              - dikkat: 6
              - ahlak: { merhamet: 4, insanlik: -1 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, korku: 2 } }
            kronik: { tr: "Son Sığınak'ın kayasını tek gecede çıplak ellerinle oydun; sabah işçiler kazmalarını bırakıp sana bakakaldı.", en: "You carved out the Last Haven's rock with your bare hands in a single night. In the morning the workers put down their picks and just stared at you." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "kadim"
            etiket: { tr: "Kadimler'den kalkan teknolojisi iste", en: "Ask the Ancients for shield technology" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Son Sığınak için Kadim elçisinin kapısını çaldın.", en: "For the Last Haven, you knocked on the Ancient envoy's door." }
            sonraki: "siginak_4_son_siginak_kadim"
          - id: "savascilar"
            etiket: { tr: "\"Sığınak savaşabilenlerin. Siviller {yer:tepe|e}.\"", en: "\"The Haven's for fighters. Civilians go to {yer:tepe}.\"" }
            etkiler:
              - bayrak: "son_siginak_savascilar"
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -6, duzen: 4 }
              - itibar: { siginak: -5, lonca: 4 }
              - iliski: { elif_sari: { guven: -8 } }
            kronik: { tr: "Son Sığınak'ı savaşabilenlere ayırdın ve sivilleri {yer:tepe|e} gönderdin.", en: "You reserved the Last Haven for fighters and sent the civilians up to {yer:tepe}." }
            sonraki: "siginak_4_son_siginak_kazi"

      - id: "siginak_4_son_siginak_kadim"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar|in} görüntüsü kuru havuzun kenarında beliriyor; ışıktan ayakları tek zerre toz kaldırmıyor. Önce kazıya, sonra tahtadaki iki sayıya bakıyor.", en: "{npc:thessar|pos} image appears at the edge of the drydock. Its feet are made of light and don't stir the dust. He looks at the dig, then at the two numbers on the board." }
          - { tr: "\"Size kalkan veririm,\" diyor. \"Bir şehri bir yaz boyunca örtecek kadar. Karşılığında tek şey isterim: bu sığınağın kapısına bizim mührümüz basılacak. Hasat geldiğinde içeridekiler bizim sayılacak.\"", en: "\"I can give you a shield,\" he says. \"Enough to cover a city for a summer. In return, I want one thing: our seal on this shelter's door. When the harvest comes, whoever's inside is counted as ours.\"" }
        sezgiler:
          - kosul: { stat: { int: 260 } }
            metin: { tr: "'Bize ait sayılmak' hasat edilmemek demek. Ama bir anlamı daha var: birinin malı olmak.", en: "\"Counted as ours\" means not harvested. It also means something else: owned." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷ühür kilit değil, etiket. etiketleri ben iyi bilirim.", en: "t̷hat seal isn't a lock. it's a label. i know labels." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Mührü kabul et; kalkanı al", en: "Accept the seal. Take the shield" }
            etkiler:
              - bayrak: "son_siginak_kadim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: 3 }
              - ahlak: { merhamet: -3, insanlik: -4, duzen: 3 }
              - itibar: { kadimler: 8, siginak: -4 }
              - iliski: { thessar: { baglilik: 8, saygi: 4 } }
            kronik: { tr: "Son Sığınak'ın kapısına Kadimler'in mührünü bastırdın; içeridekiler artık hem korunuyor hem de birilerinin malı sayılıyordu.", en: "You put the Ancients' seal on the Last Haven's door. Whoever was inside was shielded now, and counted as someone's property." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "red"
            etiket: { tr: "\"Kapımıza kimse mühür basmaz.\"", en: "\"Nobody stamps our door.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - itibar: { siginak: 4, kadimler: -3 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Kadim elçisinin mührünü Son Sığınak'ın kapısından geri çevirdin.", en: "You turned the Ancient envoy's seal away from the Last Haven's door." }
            sonraki: "siginak_4_son_siginak_kazi"

      - id: "siginak_4_son_siginak_kazi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı doğu duvarı çöküyor. Ardından buz gibi, eski bir hava vuruyor; işçiler fenerlerini kaldırınca karanlıkta elle oyulmuş, havuzdan da eski bir oda beliriyor.", en: "At midnight the east wall gives way. Cold, old air comes out from behind it, and when the workers lift their lanterns, a chamber takes shape in the dark, carved by hand and older than the drydock." }
          - { tr: "Odanın duvarları baştan aşağı çentik dolu: beşerli gruplar, binlercesi, on binlercesi; tıpkı Konsey'in beyaz tahtasındaki gibi. Kapının üstüne bir sözcük kazınmış, harfleri tanıdık gibi ama tam değil: SIĞINAK.", en: "The chamber walls are covered floor to ceiling in tally marks: groups of five, thousands of them, tens of thousands. Exactly like the Council's whiteboard. Above the doorway someone has carved one word in letters that are almost familiar, but not quite: HAVEN." }
          - metin: { tr: "{npc:elif_sari} duvara dokunuyor, parmakları nabız arar gibi çentiklerin üstünde geziniyor. \"Burada da biri saymış,\" diyor. \"Bizden önce. Bizim gibi.\"", en: "{npc:elif_sari} touches the wall, her fingers moving over the tallies like she's feeling for a pulse. \"Somebody counted here too,\" she says. \"Before us. Like us.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - { tr: "Odanın ortasında bir şey uyuyor: kayadan, külden, eski kalkanlardan yapılma, bir gemi omurgası boyunda. Fenerlerin ışığı üstüne düşünce bir göz açılıyor.", en: "Something is asleep in the middle of the chamber, built out of rock and ash and old shields, as long as a ship's keel. When the lantern light touches it, an eye opens." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[k̷ayıt bulunamadı · önceki sürüm]", en: "[r̷ecord not found · prior version]" }
            satirlar:
              - { tr: "bunu ben yazmadım. ama elimi tanıyorum.", en: "i didn't write this. but i recognize the hand." }
        sezgiler:
          - kosul: { stat: { wis: 200 } }
            metin: { tr: "Son çentik yarım kalmış: beşli bir grubun dördüncü çizgisinde bitiyor. Sayanın beşinciyi çizmeye ömrü yetmemiş.", en: "The last tally is unfinished. It stops on the fourth line of a group of five. Whoever was counting ran out before they could draw the fifth." }
          - kosul: { stat: { wil: 200 } }
            metin: { tr: "Uyuyan şey düşman değil, bekçi; yalnız kimi beklediğini unutmuş.", en: "The sleeper isn't an enemy. It's a guardian. It's forgotten who it was guarding." }
        secenekler:
          - id: "savas"
            etiket: { tr: "İşçileri arkana alıp uyuyanla savaş", en: "Get the workers behind you and fight the sleeper" }
            etkiler:
              - bilgi: "onceki_siginak"
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["havuz_uyuyani@oyuncu+5"], ortam: ["karanlik", "dar_gecit"], kazan: "siginak_4_son_siginak_zafer", kaybet: "siginak_4_son_siginak_yenilgi", kac: "siginak_4_son_siginak_yenilgi" }
            kronik: { tr: "Son Sığınak'ın altında, ondan önce kurulmuş bir sığınağın bekçisiyle savaştın.", en: "Under the Last Haven, you fought the guardian of a haven older than yours." }
          - id: "dokun"
            tur: "gosteris"
            etiket: { tr: "Uyuyana dokun; bekçiliğini hatırlat", en: "Touch the sleeper. Remind it what it guards" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bilgi: "onceki_siginak"
              - bayrak: "uyuyan_bekci"
              - dikkat: 4
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Eski bir sığınağın bekçisine elini koyup ona neyi beklediğini hatırlattın; bekçi gidip Son Sığınak'ın kapısına oturdu.", en: "You laid your hand on an old haven's guardian and reminded it what it was guarding. After that, it guarded the Last Haven's door." }
            sonraki: "siginak_4_son_siginak_bekci"
          - id: "cikar"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni aç; işçileri çıkarana kadar onu tut", en: "Open up your level. Hold it until the workers are out" }
            etkiler:
              - bilgi: "onceki_siginak"
              - aciga_vur: true
              - dikkat: 5
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 5, duzen: 1 }
              - savas: { dusmanlar: ["havuz_uyuyani@oyuncu+5"], ortam: ["karanlik"], kazan: "siginak_4_son_siginak_zafer", kaybet: "siginak_4_son_siginak_yenilgi", kac: "siginak_4_son_siginak_yenilgi" }
            kronik: { tr: "Kuru havuzun altında uyanan bekçiye karşı, işçilere kaçacak zaman kazandırmak için gerçek gücünü açtın.", en: "Under the drydock, you let your full strength show to buy the workers time to get away from the waking guardian." }
          - id: "muhur"
            etiket: { tr: "Duvarı kaydet, odayı yeniden mühürle", en: "Record the wall. Seal the chamber again" }
            etkiler:
              - bilgi: "onceki_siginak"
              - bayrak: "oda_muhurlendi"
              - ahlak: { duzen: 3, insanlik: 1 }
            kronik: { tr: "Eski sığınağın odasını kayda geçirip yeniden mühürledin. Bekçisi uykusunu sürdürdü, Son Sığınak da bir parça küçük kaldı.", en: "You recorded the old haven's chamber and sealed it back up. Its guardian kept sleeping, and the Last Haven stayed a little smaller." }
            sonraki: "siginak_4_son_siginak_muhur"

      - id: "siginak_4_son_siginak_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bekçi yıkılıyor. Gövdesindeki eski kalkanlar tek tek yere dökülüyor; bazılarının üstünde hâlâ seçilebilen, kimsenin tanımadığı armalar var.", en: "The guardian comes apart. The old shields in its body clatter to the floor one by one, some still bearing crests nobody recognizes." }
          - { tr: "Oda artık bomboş ve geniş, Son Sığınak'ın en derin salonu olacak kadar geniş. İşçiler duvardaki çentiklere dokunmamaya özen göstererek içeri doluşuyor.", en: "The chamber is empty now, and big. Big enough to be the Last Haven's deepest hall. The workers file in, careful not to touch the tallies on the walls." }
        secenekler:
          - id: "kalkan"
            etiket: { tr: "Eski kalkanları kapıya as", en: "Hang the old shields on the door" }
            etkiler:
              - bayrak: "eski_kalkanlar"
              - ahlak: { insanlik: 3, duzen: 1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Önceki sığınağın kalkanlarını Son Sığınak'ın kapısına astın; içeri girecek herkes onların altından geçecekti.", en: "You hung the old haven's shields on the Last Haven's door, where everyone going in would pass beneath them." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "salon"
            etiket: { tr: "\"Bu salon çocukların.\"", en: "\"This hall is for the kids.\"" }
            etkiler:
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Son Sığınak'ın en derin ve en güvenli salonunu çocuklara verdin.", en: "You gave the Last Haven's deepest, safest hall to the kids." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bekçi seni duvara savuruyor. Çentiklerin üstüne çarptığında, bir an için bütün o sayılar sırtına kazınmış gibi. Derken bekçi duruyor, sana bakıp uzun, yorgun bir soluk vererek yeniden yatıyor.", en: "The guardian hurls you into the wall. You slam into the tallies, and for a second it feels like every one of those marks has been carved into your back. Then the guardian stops, looks at you, and lies back down with a long, tired breath." }
          - { tr: "Seni öldürmedi. Belki insan olduğun için kıyamadı; belki de sayılarının arasında senin de bir yerin olduğunu biliyor.", en: "It didn't kill you. Maybe it held back because you're human. Maybe it knows you've got a place somewhere among its tallies too." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu uyumaya bırak; odayı mühürle", en: "Let it sleep. Seal the chamber" }
            etkiler:
              - bayrak: "oda_muhurlendi"
              - ahlak: { merhamet: 2, insanlik: 2 }
            kronik: { tr: "Eski sığınağın bekçisine yenilip onu uykusuna bıraktın.", en: "You lost to the old haven's guardian, and you let it go back to sleep." }
            sonraki: "siginak_4_son_siginak_muhur"
          - id: "say"
            etiket: { tr: "Yarım kalan çentiğin beşinci çizgisini çiz", en: "Draw the fifth line on the unfinished tally" }
            etkiler:
              - bayrak: "oda_muhurlendi"
              - bayrak: "besinci_cizgi"
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Eski sığınağın duvarındaki yarım kalmış sayıyı sen tamamladın.", en: "You finished the count someone left half-done on the old haven's wall." }
            sonraki: "siginak_4_son_siginak_muhur"

      - id: "siginak_4_son_siginak_bekci"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini bekçinin taştan alnına koyuyorsun. Gözü ağır ağır kapanıp yeniden açılıyor; bu kez bakışı sende değil, kuru havuzun ağzında içeri girmeyi bekleyen kalabalıkta.", en: "You lay your hand on the guardian's stone forehead. Its eye slowly closes, then opens again. This time it isn't looking at you. It's looking at the mouth of the drydock, at the crowd waiting to get in." }
          - { tr: "Bekçi kalkıp kapıya yürüyor, orada sırtını içeriye vererek çöküp oturuyor. Tek söz etmiyor; etmesine gerek de yok.", en: "The guardian gets up, walks to the door, and sits down there with its back to the inside. It doesn't say anything. It doesn't need to." }
        secenekler:
          - id: "ad"
            etiket: { tr: "Ona bir ad ver", en: "Give it a name" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Son Sığınak'ın kapısındaki eski bekçiye bir ad verdin; çocukların ona seslenebileceği bir ad.", en: "You gave the old guardian at the Last Haven's door a name, one the kids could call it by." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "teskur"
            etiket: { tr: "Önünde bir an eğil", en: "Bow to it for a moment" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            kronik: { tr: "Senden önce gelmiş bir kalkanın önünde eğildin.", en: "You bowed to a shield that came before you." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_muhur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Odanın ağzını taş taş, harç harç yeniden örüyorsunuz. Son taşı yerine koymadan önce fenerini içeri tutup bir kez daha bakıyorsun: çentikler, o sözcük, uyuyan şey.", en: "You brick the chamber back up, stone by stone, mortar and all. Before you set the last stone, you shine your lantern in one more time: the tallies, the word, the sleeping thing." }
          - { tr: "Son Sığınak'ın bir odası eksik kalıyor. Ama işçilerden biri, kimseye göstermeden, yeni örülen duvarın üstüne beşli bir çentik çiziyor.", en: "The Last Haven ends up one room short. But one of the workers, when nobody's looking, scratches a group of five tallies into the new wall." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kazıya devam et", en: "Get back to the dig" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "Eski sığınağı yeniden mühürleyip kendi sığınağını kazmaya devam ettin.", en: "You sealed the old haven back up and kept digging your own." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "cizgi"
            etiket: { tr: "Sen de bir çentik çiz", en: "Scratch a tally of your own" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Mühürlenen duvara sen de bir çentik çizdin.", en: "You scratched a tally of your own into the sealed wall." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_bitis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Üç hafta sonra Son Sığınak'ın çelik kapısı ilk kez kapanıp açılıyor. Gıcırtısı bütün {yer:kiyikent_liman|de} duyuluyor; insanlar onu bir çan sesi gibi dinliyor.", en: "Three weeks later the Last Haven's steel door closes and opens for the first time. The creak carries all over {yer:kiyikent_liman}, and people listen to it like a church bell." }
          - metin: { tr: "Yemek katından beri yanından ayırmadığı beyaz tahtayı {npc:elif_sari} kapının iç yüzüne asıyor. KONSEY yazısının altına yeni bir satır ekliyor: İÇERİDE. Yanını şimdilik boş bırakıyor; sayım sonra başlayacak.", en: "{npc:elif_sari} hangs the whiteboard she's carried since the food court on the inside of the door. Under COUNCIL she adds a new line: INSIDE. Then she leaves it blank. The counting starts later." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Yemek katından kalma beyaz tahtayı kapının iç yüzüne Nurhan asıyor; köşesine bir neşter bantlanmış. KONSEY yazısının altına yeni bir satır ekliyor: İÇERİDE.", en: "Nora hangs the whiteboard from the food court on the inside of the door. There's a scalpel taped to the corner. Under COUNCIL she adds a new line: INSIDE." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "Kapının üstünde Kadimler'in mührü parlıyor: soğuk, beyaz, sabırlı.", en: "The Ancients' seal glows over the door: cold, white, and patient." }
            kosul: { bayrak: "son_siginak_kadim" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Son Sığınağın Mimarı]", en: "[TITLE: Architect of the Last Haven]" }
            satirlar:
              - { tr: "Bir şehri taşın içine sakladın. Sistem bunu 'hazırlık' olarak kaydetti; işe yarayıp yaramayacağını kaydetmedi.", en: "You hid a city inside the rock. The System logged it as \"preparation.\" It did not log whether it will help." }
        secenekler:
          - id: "say"
            etiket: { tr: "İçeri girenleri kapıda tek tek say", en: "Count everyone through the door, one by one" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Kuru havuzun kapısında verdiğin kararlar birilerini rahatsız etti.", en: "What you decided at the dry-dock gate rubbed somebody the wrong way." } }
            kronik: { tr: "Son Sığınak'a gireni kapıda tek tek kendin saydın; sayı tahtaya senin el yazınla geçti.", en: "You stood at the Last Haven's door and counted everyone in yourself. That number went on the board in your handwriting." }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kapının kurallarını yaz: kim, ne zaman, nasıl", en: "Write the door rules: who, when, how" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - ahlak: { duzen: 5, merhamet: 1 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Kuru havuzun kapısında verdiğin kararlar birilerini rahatsız etti.", en: "What you decided at the dry-dock gate rubbed somebody the wrong way." } }
            kronik: { tr: "Son Sığınak'ın kapı kurallarını sen yazdın: kim girecek, ne zaman, nasıl.", en: "You wrote the Last Haven's door rules: who gets in, when, and how." }
            sonraki: "@akis"
          - id: "disari"
            etiket: { tr: "Kapının dışında kalanlarla otur", en: "Sit with the ones left outside the door" }
            goster: { bayrak_yok: "son_siginak_herkes" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 4 }
              - tohum: { olay: "elif_demir_gece_uyari", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }, hatirlatma: { tr: "Kuru havuzun kapısında verdiğin kararlar birilerini rahatsız etti.", en: "What you decided at the dry-dock gate rubbed somebody the wrong way." } }
            kronik: { tr: "Son Sığınak tamamlandığı gece içeride değil, kapının dışında kalanların yanında oturdun.", en: "On the night the Last Haven was finished, you didn't sit inside. You sat with the people left outside the door." }
            sonraki: "@akis"

  # ================================================================== ELİF 4 — BARIŞ MASASI (P4, AY 333; elif_baskan · insan_ittifaki)
  - id: "elif_baris_masasi"
    konum: ["kiyikent_liman"]
    perde: [4]
    gun: { min: 331, max: 341 }
    ana_yay: { gun: 333 }
    agirlik: 1
    kosul: { bayrak: "siginak_1_goruldu" }
    etiketler: ["siginak", "npc", "ittifak", "fraksiyon"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Bavul arabalarından bir masa", en: "A table made of luggage carts" }
    sahne: "elif_baris_masasi_1"
    sahneler:
      - id: "elif_baris_masasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gökyüzünde artık ikinci bir şehir var: körfezin üstünde, yıldızların arasında Kadim filosunun ışıkları. {yer:kiyikent_iskele|in} bekleme salonunda gişeler sökülmüş, bavul arabalarıyla kapı kanatlarından uzun bir masa kurulmuş.", en: "There's a second city in the sky now: the lights of the Ancient fleet, hanging among the stars over the bay. In the {yer:kiyikent_iskele} waiting hall the ticket windows have been torn out, and somebody's built a long table out of luggage carts and old doors." }
          - { tr: "Masanın başında {npc:elif_sari} duruyor; arkasındaki yemek katından kalma beyaz tahtada iki sözcük var: BİR ORDU. \"Ya tek bir insan ordusu kurulacak,\" diyor, \"ya da hiç kurulmayacak. Kimse kalkmadan ben bu masadan kalkmam.\"", en: "{npc:elif_sari} stands at the head of the table, the whiteboard from the food court behind her with two words on it: ONE ARMY. \"Either there's going to be one human army,\" she says, \"or there won't be any. I'm not getting up from this table until everybody's still sitting at it.\"" }
          - metin: { tr: "Masanın bir ucunda {npc:kaya_demir} kollarını kavuşturmuş oturuyor. Ama gelmiş.", en: "{npc:kaya_demir} sits at one end of the table, arms folded. But he came." }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "Lonca'nın sandalyesi boş, ama gözler oraya değil, sana çevrili. Lonca artık senin.", en: "The Guild's chair is empty, and everybody's looking at you instead of at it. The Guild is yours now." }
            kosul: { bayrak: "lonca_hakimiyeti" }
          - metin: { tr: "Öbür uçta bembeyaz cübbesiyle {npc:vahit} oturuyor, ayindeymiş gibi gözlerini yummuş.", en: "At the other end sits {npc:vahit} in his white robes, eyes closed, like he's in the middle of a service." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} masanın ortasına bir telsiz koymuş, kulaklığın tekini kulağına takmış: Sessiz Ağ dinlemede.", en: "{npc:mert_kilic} has set a radio in the middle of the table with one earbud in. The Quiet Network is listening." }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Salonun gerisinde, sandalye taşıyanların arasında kolları toz içinde Pala da var.", en: "In the back of the hall, among the people carrying chairs, is Cleaver, with dust on his arms." }
            kosul: { bayrak: "pala_kazida" }
        sezgiler:
          - kosul: { stat: { cha: 350 } }
            metin: { tr: "Masadakilerin hepsi bir şey bekliyor, ama ondan değil, senden. Onun sözünü sen söylersen masa dağılmaz.", en: "Everybody at the table is waiting for something, and it isn't from her. It's from you. If you say her words for her, the table holds." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷ört fraksiyon, bir masa, bir hekim. sistem bu ihtimale pek şans tanımamış. ilginç olan da bu.", en: "f̷our factions, one table, one doctor. the system gave this outcome a low probability. that's what makes it interesting." }
          - kosul: { bayrak: "elif_ask" }
            anlati: true
            metin: { tr: "Masanın başına geçmeden sana bakıyor; kısacık, yalnız senin fark edeceğin kadar.", en: "Before she takes the head of the table, she looks at you. Briefly. Just long enough that only you'd notice." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir masa. Kıyametin ucunda bir masa. Ya çok saçma ya da tam ihtiyacımız olan şey.\"", en: "\"A table. At the end of the world, a table. That's either ridiculous or exactly what we need.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Masalar oyalamaya yarar. Ama bu kadın oyalamıyor. Dinle onu.\"", en: "\"Tables are a way of stalling. But this woman isn't stalling. Listen to her.\"" }
        secenekler:
          - id: "yanina"
            etiket: { tr: "Onun yanına otur; masayı o yönetsin", en: "Sit beside her. Let her run the table" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Kadim filosu tepede asılıyken bir hekimin kurduğu masaya oturdun, masanın başını da ona bıraktın.", en: "With the Ancient fleet in the sky, you sat down at a doctor's table and let her run it." }
            sonraki: "elif_baris_masasi_masa"
          - id: "basa"
            etiket: { tr: "Masanın başına sen geç", en: "Take the head of the table yourself" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - iliski: { elif_sari: { guven: -4, korku: 3 } }
            kronik: { tr: "Bir hekimin kurduğu barış masasının başına kendin geçtin.", en: "You took the head of a peace table a doctor had built." }
            sonraki: "elif_baris_masasi_tahakkum"
          - id: "tek_ses"
            tur: "gosteris"
            etiket: { tr: "Herkesi tek bir konuşmayla aynı tarafa çek", en: "Pull everyone onto one side with a single speech" }
            gerekli: { stat: { cha: 400 } }
            etkiler:
              - bayrak: "masa_tek_ses"
              - dikkat: 3
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6, lonca: 3, sessiz_ag: 3 }
              - iliski: { elif_sari: { saygi: 6, baglilik: 3 } }
            kronik: { tr: "Bir bekleme salonunda tek bir konuşmayla dört fraksiyonu aynı safa çektin.", en: "In a ferry terminal waiting room, with one speech, you pulled four factions onto the same side." }
            sonraki: "elif_baris_masasi_masa"
          - id: "hayal"
            etiket: { tr: "\"Bu masa bir hayal. Herkes kendi başına.\"", en: "\"This table's a fantasy. Everybody's on their own.\"" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -4 }
              - itibar: { siginak: -6 }
              - iliski: { elif_sari: { guven: -6, baglilik: -4 } }
            kronik: { tr: "Kıyametin son masasına 'hayal' deyip kalktın; ardından herkes kalktı.", en: "You called the last table at the end of the world a fantasy and walked out. Everyone else got up after you." }
            sonraki: "elif_baris_masasi_dagilma"
          - id: "kadim"
            etiket: { tr: "{npc:thessar|in} elçisini de masaya çağır", en: "Invite {npc:thessar|pos} envoy to the table too" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - iliski: { elif_sari: { guven: -3 }, thessar: { saygi: 3 } }
            kronik: { tr: "İnsanlığın son barış masasına Kadimler'in elçisini de çağırdın.", en: "You invited the Ancients' envoy to humanity's last peace table." }
            sonraki: "elif_baris_masasi_kadim"

      - id: "elif_baris_masasi_masa"
        yer: "kiyikent_iskele"
        paragraflar:
          - metin: { tr: "İlk sözü {npc:kaya_demir} alıyor: \"Ordunun tek komutanı olur. O da ben olurum. Siviller sizin olsun.\"", en: "{npc:kaya_demir} speaks first. \"An army has one commander. That's me. You can have the civilians.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "{npc:vahit} gözlerini açıyor. \"Sistem seçilmişlerle yakıtı birbirinden ayırdı. Siz bu ayrımı bir masayla silemezsiniz.\"", en: "{npc:vahit} opens his eyes. \"The System separated the chosen from the fuel. You can't erase that line with a table.\"" }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} kulaklığını çıkarıyor. \"Biz Kule'nin de Çekirdek'in de verisini istiyoruz. Herkesinkini. Son baytına kadar.\"", en: "{npc:mert_kilic} pulls out his earbud. \"We want the Spire and Core data. Everybody's. All of it.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - { tr: "{npc:elif_sari} her talebi alt alta tahtaya geçiriyor, hiçbirini ötekinden büyük yazmadan. Sonra kalemi sana uzatıyor.", en: "{npc:elif_sari} writes every demand on the board, one under the other, none of them bigger than the rest. Then she holds the marker out to you." }
        secenekler:
          - id: "lonca_komuta"
            etiket: { tr: "\"Komuta Lonca'da, siviller Konsey'de.\"", en: "\"The Guild commands. The Council keeps the civilians.\"" }
            etkiler:
              - bayrak: "masa_lonca_komuta"
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { lonca: 6, siginak: 2 }
            kronik: { tr: "İnsan ordusunun komutasını Lonca'ya, sivilleri Konsey'e verdin.", en: "You gave command of the human army to the Guild and the civilians to the Council." }
            sonraki: "elif_baris_masasi_oylama"
          - id: "kurul"
            etiket: { tr: "\"Komuta ortak bir kurulda. Tek el yok.\"", en: "\"Command goes to a joint board. No single hand.\"" }
            etkiler:
              - bayrak: "masa_ortak_kurul"
              - ahlak: { merhamet: 2, duzen: 2, insanlik: 1 }
              - itibar: { siginak: 4, sessiz_ag: 2 }
            kronik: { tr: "İnsan ordusunu tek bir ele değil, ortak bir kurula bağladın.", en: "You made sure the human army answered to a joint board instead of one pair of hands." }
            sonraki: "elif_baris_masasi_oylama"
          - id: "yakit"
            etiket: { tr: "\"Yakıt listeleri yakılacak. Şart bu.\"", en: "\"The fuel lists get burned. That's the condition.\"" }
            etkiler:
              - bayrak: "yakit_listeleri_yakildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 5, yukselenler: -15 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Barış masasında Yükselenler'in 'yakıt' listelerini yaktırdın; o listelerdeki binlerce ad ilk kez yalnızca birer addı.", en: "At the peace table, you had the Ascended's \"fuel\" lists burned. For the first time, the thousands of names on them were just names." }
            sonraki: "elif_baris_masasi_oylama"

      - id: "elif_baris_masasi_oylama"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Masada tek soru kalıyor: Kıyıkent İttifakı'nın başında kim oturacak? Salona, beş yüz kişinin birden nefesini tutmasından doğan bir sessizlik çöküyor.", en: "One question is left on the table: who sits at the head of the {yer:kiyikent} Alliance? The silence in the hall is five hundred people holding their breath at once." }
          - { tr: "{npc:elif_sari} kalemi tahtanın kenarına bırakıyor. \"Ben aday değilim,\" diyor alışkanlıkla, sonra bu cümleyi ilk kez duyuyormuş gibi duraksıyor.", en: "{npc:elif_sari} sets the marker down on the ledge of the whiteboard. \"I'm not a candidate,\" she says, out of habit. Then she stops, like she's hearing that sentence for the first time." }
        secenekler:
          - id: "elif"
            etiket: { tr: "\"{npc:elif_sari|e} oy veriyorum.\"", en: "\"My vote goes to {npc:elif_sari}.\"" }
            gerekli: { itibar_min: { siginak: 30 } }
            etkiler:
              - bayrak: "elif_baskan"
              - bayrak: "insan_ittifaki"
              - ahlak: { merhamet: 4, duzen: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, guven: 5 } }
            kronik: { tr: "Kıyıkent İttifakı'nın başına bir hekimi seçtirdin; 'barış' sözcüğü o gün şehrin diline geri döndü.", en: "You got a doctor elected head of the {yer:kiyikent} Alliance. The word \"peace\" came back into the city's vocabulary that day." }
            sonraki: "elif_baris_masasi_baskan"
          - id: "ayaga"
            tur: "gosteris"
            etiket: { tr: "Salonu onun için ayağa kaldır", en: "Bring the whole hall to its feet for her" }
            gerekli: { stat: { cha: 350 } }
            etkiler:
              - bayrak: "elif_baskan"
              - bayrak: "insan_ittifaki"
              - dikkat: 2
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 6, saygi: 4 } }
            kronik: { tr: "Beş yüz kişiyi bir hekim için ayağa kaldırdın; o da o gün adını tahtaya kendi eliyle yazdı.", en: "You brought five hundred people to their feet for a doctor. That day, she wrote her own name on the board in her own hand." }
            sonraki: "elif_baris_masasi_baskan"
          - id: "kendin"
            etiket: { tr: "Kendine oy ver", en: "Vote for yourself" }
            etkiler:
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ahlak: { duzen: 6, merhamet: -1, insanlik: -3 }
              - itibar: { lonca: 4 }
              - iliski: { elif_sari: { guven: -5, saygi: 2 } }
            kronik: { tr: "Kıyıkent İttifakı'nın başına kendini seçtirdin; bir hekimin kurduğu masada başkan sen oldun.", en: "You had yourself elected head of the {yer:kiyikent} Alliance, at a table a doctor had built." }
            sonraki: "elif_baris_masasi_son"
          - id: "baskansiz"
            etiket: { tr: "\"Başkan yok. Kurul yönetsin.\"", en: "\"No chair. The board governs.\"" }
            etkiler:
              - bayrak: "insan_ittifaki"
              - bayrak: "kurul_ittifaki"
              - ahlak: { duzen: -2, merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3, sessiz_ag: 3 }
            kronik: { tr: "İnsan ittifakını başkansız, bir kurula emanet ederek kurdun; kararlar yavaş çıkacaktı ama herkesin olacaktı.", en: "You set up the human alliance with a board and no chair. Decisions would come slow, but they'd belong to everyone." }
            sonraki: "elif_baris_masasi_son"

      - id: "elif_baris_masasi_baskan"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} tahtanın başına yürüyüp kalemi alıyor ve bu kez, ilk defa, kendi adını kendi eliyle yazıyor: BAŞKAN. Eli titremiyor.", en: "{npc:elif_sari} walks to the whiteboard. She picks up the marker, and this time, for the first time, she writes her own name with her own hand: CHAIR. Her hand doesn't shake." }
          - { tr: "Salona dönüp \"Tek bir kural,\" diyor. \"Bu ittifakta kimse yakıt değildir. Kimse siyah bantla doğmaz. Kabul etmeyen için kapı orada.\" Kimse yerinden kıpırdamıyor.", en: "\"One rule,\" she says, turning to the hall. \"In this alliance, nobody is fuel. Nobody's born with black tape on. Anyone who can't live with that, the door's right there.\" Nobody gets up." }
          - metin: { tr: "Herkes dağılırken sana dönüp kimse duymasın diye sesini alçaltıyor: \"Siyah bandı artık ben dağıtıyorum. Yakınımdan ayrılma.\"", en: "Later, while everyone's filing out, she turns to you and keeps her voice low so nobody else hears: \"I'm the one handing out the black tape now. Stay close.\"" }
            kosul: { bayrak: "elif_ask" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KIYIKENT İTTİFAKI KURULDU]", en: "[PORT HARLOW ALLIANCE FORMED]" }
            satirlar:
              - { tr: "Fraksiyonlar arası savaş durumu: askıya alındı.", en: "Inter-faction hostilities: suspended." }
              - { tr: "Not: Katman değerlendirmesinde dikkate alınacak.", en: "Note: This will be noted in the Layer assessment." }
        secenekler:
          - id: "alkis"
            etiket: { tr: "Ayakta alkışla", en: "Give her a standing ovation" }
            etkiler:
              - ordu_kazan: 30
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "Kıyıkent İttifakı'nın ilk başkanını alkışlamak için ilk ayağa kalkan sen oldun.", en: "You were the first one on your feet to applaud the {yer:kiyikent} Alliance's first chair." }
            sonraki: "elif_baris_masasi_son"
          - id: "ilk_emir"
            etiket: { tr: "\"İlk emrini ver, Başkan.\"", en: "\"Give your first order, Madam Chair.\"" }
            etkiler:
              - ordu_kazan: 30
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Yeni başkandan ilk emrini vermesini istedin.", en: "You asked the new chair for her first order." }
            sonraki: "elif_baris_masasi_son"

      - id: "elif_baris_masasi_tahakkum"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Masanın başına yürüdüğünde {npc:elif_sari} bir adım çekilip sana yer açıyor. Salonda itiraz eden çıkmıyor; itirazın neye yarayacağını herkes biliyor.", en: "When you walk to the head of the table, {npc:elif_sari} steps back to make room. Nobody in the hall objects. Everybody knows what good objecting would do." }
          - { tr: "\"Öyleyse yönet,\" diyor {npc:elif_sari} düz bir sesle. \"Ama yönetmek ne demek, biliyor musun? Her gece birinin bandının rengine karar vermek.\"", en: "\"Then lead,\" {npc:elif_sari} says, voice flat. \"But do you know what leading means? Deciding the color of somebody's tape, every night.\"" }
        secenekler:
          - id: "sag_kol"
            etiket: { tr: "\"Sen sağ kolum olursun.\"", en: "\"You'll be my right hand.\"" }
            etkiler:
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ordu_kazan: 30
              - ahlak: { duzen: 4, merhamet: 2 }
              - iliski: { elif_sari: { guven: 2, saygi: 2 } }
            kronik: { tr: "İnsan ittifakının başına geçtin ve hekimi sağ kolun yaptın.", en: "You took the head of the human alliance and made the doctor your right hand." }
            sonraki: "elif_baris_masasi_son"
          - id: "kalksin"
            tur: "aciga_vur"
            etiket: { tr: "\"Kim karşıysa masadan kalksın.\"", en: "\"Anyone who objects can leave the table.\"" }
            etkiler:
              - aciga_vur: true
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ordu_kazan: 40
              - dikkat: 5
              - ahlak: { duzen: 6, merhamet: -3, insanlik: -3 }
              - itibar: { lonca: 5, siginak: -6 }
              - iliski: { elif_sari: { guven: -10, korku: 6 } }
            kronik: { tr: "Barış masasında 'Kim karşıysa kalksın' dedin, kimse kalkamadı; insan ittifakı korkunun üstüne kuruldu.", en: "At the peace table you said anyone who objected could leave, and nobody could get up. The human alliance was founded on fear." }
            sonraki: "elif_baris_masasi_son"
          - id: "oylayalim"
            etiket: { tr: "\"Pekâlâ. Oylayalım.\"", en: "\"All right. Let's vote.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Masanın başına geçtin ama sonunda oylamaya razı oldun.", en: "You took the head of the table, but in the end you agreed to put it to a vote." }
            sonraki: "elif_baris_masasi_masa"

      - id: "elif_baris_masasi_kadim"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:thessar|in} ışıktan görüntüsü masanın ucunda beliriyor; sandalyelerden birine oturmaya tenezzül etmiyor. Salonun yarısı ayağa fırlıyor, öbür yarısı korkudan yerinden kıpırdayamıyor.", en: "{npc:thessar|pos} image of light appears at the end of the table and doesn't deign to sit in a chair. Half the hall gets to its feet. The other half is too scared to." }
          - { tr: "\"İmzalayan bağışlanır,\" diyor. \"Bu masada imza atan her fraksiyon hasattan muaf tutulur. Basit bir aritmetik; siz aritmetiği seversiniz.\"", en: "\"Those who sign are spared,\" he says. \"Every faction at this table that signs is exempted from the harvest. Simple arithmetic. Your species likes arithmetic.\"" }
          - { tr: "{npc:elif_sari} kalemi bırakıp sana bakıyor. Bakışında soru yok, yalnızca bekleyiş var.", en: "{npc:elif_sari} sets down the marker and looks at you. There's no question in her eyes. Just waiting." }
        secenekler:
          - id: "imza"
            etiket: { tr: "\"Okuyalım. Belki imzalarız.\"", en: "\"Let's read it. Maybe we sign.\"" }
            etkiler:
              - bayrak: "kadim_masada"
              - bayrak: "baris_masasi_dagildi"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { insanlik: -5, duzen: 3 }
              - itibar: { kadimler: 8, siginak: -10 }
              - iliski: { thessar: { baglilik: 10, saygi: 4 }, elif_sari: { guven: -15 } }
            kronik: { tr: "İnsanlığın barış masasında Kadimler'in antlaşmasını okumaya razı oldun; masa o anda dağılmaya başladı.", en: "At humanity's peace table, you agreed to read the Ancients' treaty, and the table started coming apart right then." }
            sonraki: "elif_baris_masasi_dagilma"
          - id: "kov"
            etiket: { tr: "\"Bu masa insanların. Çık.\"", en: "\"This table's for humans. Get out.\"" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 4, merhamet: 1 }
              - itibar: { siginak: 5, kadimler: -5 }
              - iliski: { thessar: { saygi: 3 }, elif_sari: { guven: 6 } }
            kronik: { tr: "Kadim elçisini insanlığın barış masasından kovdun; o gün masa ilk kez gerçekten masa oldu.", en: "You threw the Ancient envoy out of humanity's peace table. That day, for the first time, it really was a table." }
            sonraki: "elif_baris_masasi_masa"

      - id: "elif_baris_masasi_dagilma"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sandalyeler birer birer geri itiliyor. Önce Lonca kalkıyor, ardından Yükselenler; Sessiz Ağ'ın telsizi de tek söz etmeden susuyor.", en: "Chairs scrape back one at a time. The Guild gets up first, then the Ascended. The Quiet Network's radio clicks off without a word." }
          - { tr: "Sonunda salonda yalnızca {npc:elif_sari} kalıyor; elinde kalem, beyaz tahtanın önünde dikiliyor. BİR ORDU yazısının üstünü çizmiyor, yalnızca bakıyor.", en: "In the end only {npc:elif_sari} is left in the hall, standing in front of the whiteboard with the marker in her hand. She doesn't cross out ONE ARMY. She just looks at it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Salondan çık", en: "Walk out of the hall" }
            etkiler:
              - bayrak: "baris_masasi_dagildi"
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { elif_sari: { baglilik: -4 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 }, hatirlatma: { tr: "Bavul arabalarından kurulan masanın gecesi {npc:elif_sari|in} aklında.", en: "{npc:elif_sari} keeps thinking about the night of that table built out of luggage carts." } }
            kronik: { tr: "İnsanlığın son barış masası dağılırken salondan çıkan son kişi sen olmadın.", en: "Humanity's last peace table fell apart, and you weren't the last one out of the room." }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Yanında kal; tahtaya birlikte bakın", en: "Stay with her. Look at the board together" }
            etkiler:
              - bayrak: "baris_masasi_dagildi"
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 3 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 }, hatirlatma: { tr: "Bavul arabalarından kurulan masanın gecesi {npc:elif_sari|in} aklında.", en: "{npc:elif_sari} keeps thinking about the night of that table built out of luggage carts." } }
            kronik: { tr: "Barış masası dağıldığında salonda bir hekimle kalıp tahtadaki BİR ORDU yazısına baktın.", en: "When the peace table fell apart, you stayed behind with a doctor and looked at the words ONE ARMY." }
            sonraki: "@akis"

      - id: "elif_baris_masasi_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gece yarısına doğru salon boşalıyor. Masada imzalar, çay lekeleri ve atmaya kimsenin kıyamadığı bir paket kurabiye kalıyor.", en: "By midnight the hall has emptied out. Left on the table: signatures, tea rings, and a pack of cookies nobody has the heart to throw away." }
          - metin: { tr: "Kalkış panosunu çeviren, artık delikanlılığa adım atmış çocuk harfleri yeniden diziyor: İTTİFAK · BAŞKAN · ve bir ad. Bu kez adı yazmaktan çekinen yok.", en: "The kid who flips the departures board, a teenager now, rearranges the letters: ALLIANCE · CHAIR · and a name. This time nobody's afraid to spell it out." }
            kosul: { bayrak: "elif_baskan" }
          - metin: { tr: "Kalkış panosunda yeni bir satır var: İTTİFAK · BAŞKAN · ve senin adın. Panoyu çeviren delikanlı harfleri dizerken bir kez dönüp sana bakıyor.", en: "A new line on the departures board: ALLIANCE · CHAIR · and your name. The teenager flipping the letters turns around once to look at you while he works." }
            kosul: { bayrak: "oyuncu_ittifak_basi" }
          - metin: { tr: "Kalkış panosunda yeni bir satır var: İTTİFAK · KURUL. Başkan satırı boş; kimse doldurmaya heveslenmiyor, bu da bir kez olsun hayra alamet.", en: "A new line on the departures board: ALLIANCE · BOARD. The chair line is blank. Nobody wants to fill it, and for once that's a good thing." }
            kosul: { bayrak: "kurul_ittifaki" }
          - { tr: "{npc:elif_sari} kapıda durmuş, körfeze, filonun ışıklarına bakıyor. \"Dokuz gün,\" diyor. \"Dokuz gün sonra bu masa ya bir şey olmuş olacak ya da hiçbir şey.\"", en: "{npc:elif_sari} stands in the doorway looking out at the bay and the fleet's lights. \"Nine days,\" she says. \"In nine days, this table was either something or nothing.\"" }
        secenekler:
          - id: "bir_sey"
            etiket: { tr: "\"Bir şeydi. Ben öyle olmasını sağlarım.\"", en: "\"It was something. I'll make sure of it.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 }, hatirlatma: { tr: "Bavul arabalarından kurulan masanın gecesi {npc:elif_sari|in} aklında.", en: "{npc:elif_sari} keeps thinking about the night of that table built out of luggage carts." } }
            kronik: { tr: "O barış masasını boşa çıkarmayacağına söz verdin.", en: "You promised that peace table would turn out to be something." }
            sonraki: "@akis"
          - id: "kurabiye"
            etiket: { tr: "Masadaki kurabiye paketini ona ver", en: "Hand her the pack of cookies off the table" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 }, hatirlatma: { tr: "Bavul arabalarından kurulan masanın gecesi {npc:elif_sari|in} aklında.", en: "{npc:elif_sari} keeps thinking about the night of that table built out of luggage carts." } }
            kronik: { tr: "İnsanlığın barış masasından geriye kalan son kurabiye paketini bir hekime verdin.", en: "You gave a doctor the last pack of cookies left over from humanity's peace table." }
            sonraki: "@akis"

  # ================================================================== ELİF 5 — SON GECE (P4, tohum; istila arifesi)
  - id: "elif_son_gece"
    konum: ["kiyikent_liman"]
    perde: [4]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["siginak", "npc", "nefes", "veda"]
    gerilim: 1
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Yeşil fener", en: "The green light" }
    sahne: "elif_son_gece_1"
    sahneler:
      - id: "elif_son_gece_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İstilanın arifesinde {npc:elif_sari} seni mendireğin ucunda buluyor; elinde son paket kurabiye, omzunda bir battaniye. Yeşil fenerin ışığında ikinizin de yüzü hastalıklı görünüyor.", en: "On the eve of the invasion, {npc:elif_sari} finds you at the end of the breakwater with the last pack of cookies in her hand and a blanket over her shoulders. The green harbor light makes both your faces look sick." }
          - metin: { tr: "Bu fener senin elinle yeniden yanmıştı. Ona hatırlatmana gerek yok; o zaten hatırlıyor.", en: "That light came back on because of you. You don't remind her. She remembers." }
            kosul: { bayrak: "mendirek_temizlendi" }
          - { tr: "Kadim filosu gökyüzünde ikinci bir şehir gibi asılı. \"Yarın bu saatte ya Kalkan'ın içinde olacağız ya dışında,\" diyor. \"İlk defa neyi sayacağımı bilmiyorum.\"", en: "The Ancient fleet hangs in the sky like a second city. \"This time tomorrow we're either inside the Shield or outside it,\" she says. \"And for the first time, I don't know what I'm going to be counting.\"" }
          - metin: { tr: "Sonra sana dönüp teşhis koyar gibi uzun uzun yüzüne bakıyor ve \"Neye dönüşüyorsun?\" diye soruyor. \"Bunu hekim olarak sormuyorum.\"", en: "Then she turns and looks at your face for a long time, like she's making a diagnosis. \"What are you turning into?\" she asks. \"I'm not asking as a doctor.\"" }
            kosul: { ahlak_max: { merhamet: 0 } }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u gece sana hiçbir şey fısıldamayacağım. bu gece senin.", en: "i̷'m not whispering anything to you tonight. tonight's yours." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Yanına otur; omzun hazır", en: "Sit down next to her. Your shoulder's ready" }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 6 } }
            kronik: { tr: "İstilanın arifesinde yeşil fenerin altında bir hekimle yan yana oturdun; buna ikiniz de bir ad koymadınız.", en: "On the eve of the invasion, you sat with a doctor under the green harbor light. Neither of you put a name to it." }
            sonraki: "elif_son_gece_ask"
          - id: "kurabiye"
            etiket: { tr: "Son kurabiyeyi yarı yarıya bölüş", en: "Split the last cookie down the middle" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "Son kurabiyeyi, istilaya bir gece kala, bir hekimle yarı yarıya bölüştün.", en: "On the eve of the invasion, you split the last cookie down the middle with a doctor." }
            sonraki: "elif_son_gece_dostluk"
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Ona Sistem'in sana gösterdiği her şeyi anlat", en: "Tell her everything the System shows you" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - dikkat: 2
              - ahlak: { insanlik: 4, duzen: -1 }
              - iliski: { elif_sari: { guven: 8, korku: 2 } }
            kronik: { tr: "Son gece bir hekime Sistem'in sana gösterdiği her şeyi anlattın; o da hastasının öyküsünü dinler gibi baştan sona dinledi.", en: "On the last night, you told a doctor everything the System shows you. She listened to all of it the way she'd listen to a patient's history." }
            sonraki: "elif_son_gece_dostluk"
          - id: "sorma"
            etiket: { tr: "\"Ne olduğumu sorma.\"", en: "\"Don't ask me what I am.\"" }
            goster: { ahlak_max: { merhamet: 0 } }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -1 }
              - iliski: { elif_sari: { guven: -6, baglilik: -4 } }
            kronik: { tr: "Son gece bir hekim sana neye dönüştüğünü sordu; cevap vermedin.", en: "On the last night, a doctor asked you what you were turning into. You didn't answer." }
            sonraki: "elif_son_gece_kopus"

      - id: "elif_son_gece_ask"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'ün çatısındaki gibi başını omzuna yaslıyor, ama bu sefer uyumuyor. Filonun ışıklarını birlikte, içinizden sayıyorsunuz; yüze varınca bırakıyorsunuz.", en: "She leans her head on your shoulder, like on the Customs House roof. This time she doesn't fall asleep. You count the fleet's lights together, not out loud. You count to a hundred and quit." }
          - { tr: "\"Sağ çıkarsak bir hafta uyuyacağım,\" diyor. \"Davetlisin. Yani... başucumda oturmaya. Sessizce.\" Elini bulup sıkıca tutuyor, bırakmıyor. Başka bir şey söylemiyor; sen de söylemiyorsun.", en: "\"If we live, I'm going to sleep for a week,\" she says. \"You're invited. To... sit there. Quietly.\" She finds your hand and doesn't let go. She doesn't say anything else. Neither do you." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz.\"", en: "\"Promise.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 8, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 50 }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Bir hekime, sağ çıkarsanız bir haftalık uykusu boyunca başucunda oturacağına söz verdin.", en: "You promised a doctor that if you both lived, you'd sit with her through a week of sleep." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme; elini tut", en: "Say nothing. Hold her hand" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { elif_sari: { baglilik: 6 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Mendireğin ucunda bir hekimin elini tuttun ve tek söz etmedin; gerek yoktu.", en: "At the end of the breakwater, you held a doctor's hand and said nothing. There was no need." }
            sonraki: "@akis"

      - id: "elif_son_gece_dostluk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} cebinden bir rulo bant çıkarıp avucuna bırakıyor: kırmızı, sarı, yeşil. Siyah yok.", en: "{npc:elif_sari} pulls a roll of tape out of her pocket and puts it in your palm: red, yellow, green. No black." }
          - { tr: "\"Yarın bunlar sende dursun,\" diyor. \"Siyahı ben taşırım; o benim işim. Sen yalnızca bunları kullan. Söz ver.\"", en: "\"Keep this on you tomorrow,\" she says. \"I'll carry the black. That's my job. You only use these. Promise me.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz veriyorum.\"", en: "\"I promise.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { elif_sari: { guven: 5, baglilik: 4 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Bir hekime, istila günü yalnızca kırmızı, sarı ve yeşil bant kullanacağına söz verdin.", en: "You promised a doctor that on invasion day, you'd only use red, yellow, and green tape." }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Söz veremem. Ama deneyeceğim.\"", en: "\"I can't promise. But I'll try.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 5, guven: 2 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Bir hekime söz vermek yerine dürüst davrandın; bu ona sözden daha değerli geldi.", en: "Instead of making a doctor a promise, you were honest with her. She liked that better than a promise." }
            sonraki: "@akis"

      - id: "elif_son_gece_kopus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} başını sallayıp battaniyeyi kendi omzundan alıyor, senin omzuna örtüyor. \"Yarın yaralanırsan yine dikerim,\" diyor. \"O kadar. Bunu her zaman yaparım.\"", en: "{npc:elif_sari} nods, takes the blanket off her shoulders, and drapes it over yours. \"If you get hurt tomorrow, I'll still stitch you up,\" she says. \"That's all. I'll always do that much.\"" }
          - { tr: "Mendirek boyunca geri yürüyor. Yeşil fenerin ışığı bir süre peşinden gelip sonra onu bırakıyor.", en: "She walks back down the breakwater. The green light follows her for a while, then lets her go." }
        secenekler:
          - id: "seslen"
            etiket: { tr: "Arkasından seslen", en: "Call after her" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Son gece arkasından seslendin; hekim durdu ama dönüp bakmadı.", en: "On the last night, the doctor you called after stopped walking. She didn't turn around." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Gitmesine izin ver", en: "Let her go" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { elif_sari: { baglilik: -3 } }
            kronik: { tr: "İstilaya bir gece kala, mendirekten uzaklaşan bir hekimin ardından baktın.", en: "On the eve of the invasion, you watched a doctor walk away down the breakwater." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 5 — KALKAN YEMİNİ (P4, AY 339; zincir tamam)
  - id: "siginak_5_kalkan_yemini"
    konum: ["kiyikent_liman"]
    perde: [4]
    gun: { min: 331, max: 356 }
    ana_yay: { gun: 339 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" }
    etiketler: ["siginak", "zincir", "yemin", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Kalkan Yemini", en: "The Shield Oath" }
    sahne: "siginak_5_kalkan_1"
    sahneler:
      - id: "siginak_5_kalkan_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece, Son Sığınak'ın kapısının önünde insan kaynıyor. Kimse mum yakmamış; herkes Sistem penceresini açmış, binlerce mavi panel karanlıkta tarla üstündeki ateşböcekleri gibi dalgalanıyor.", en: "That night, the space in front of the Last Haven's door is packed with people. Nobody's lit a candle. Everybody's opened their System window instead, and thousands of blue panels ripple in the dark like fireflies over a field." }
          - metin: { tr: "{npc:elif_sari} elinde bir kâğıtla kapının önündeki bavul arabasına çıkıyor. \"Yarın sabah,\" diyor, \"Kadimler gelecek. Bu gece senden bir şey isteyeceğiz. Hayır diyebilirsin; zaten hayır diyebileceğin için soruyoruz.\"", en: "{npc:elif_sari} climbs up on the luggage cart in front of the door with a sheet of paper in her hand. \"Tomorrow morning,\" she says, \"the Ancients get here. Tonight we're going to ask you for something. You can say no. That's exactly why we're asking.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Bir elinde kâğıt, öbüründe neşter, Nurhan kapının önündeki bavul arabasına çıkıyor. \"O burada olsaydı,\" diyor, \"bunu o okurdu. O okuyamadığına göre ben okuyorum.\"", en: "Nora climbs up on the luggage cart in front of the door, a sheet of paper in one hand and a scalpel in the other. \"If she were here,\" she says, \"she'd be the one reading this. Since she can't, I am.\"" }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Kâğıtta tek bir cümle var; kalabalık onu hep bir ağızdan, alçak sesle okuyor: \"Sen kapının önünde dur, biz arkanda dururuz.\"", en: "There's one sentence on the paper, and the crowd reads it together, low: \"Stand in front of the door. We'll stand behind you.\"" }
          - metin: { tr: "Kalabalık umduğundan da büyük. Tahtadaki sayı, {yer:kiyikent_liman|in} Entegrasyon gününden bu yana gördüğü en büyük sayı.", en: "The crowd is bigger than you expected. The number on the board is the biggest {yer:kiyikent_liman|pos} seen since Integration Day." }
            kosul: { degisken_min: { hayatta_kalan: 55 } }
          - metin: { tr: "Kalabalık umduğundan çok küçük. Gözünü tahtadaki sayıdan kaçırmaya çalışıyorsun.", en: "The crowd is smaller than you hoped. You try not to look at the number on the board." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[O̷RTAK KALKAN · topluluk bağışı]", en: "[S̷HARED SHIELD · community grant]" }
            satirlar:
              - { tr: "bir topluluk gücünün bir kısmını tek bir koruyucuya bağışlayabilir.", en: "a community may grant part of its strength to a single protector." }
              - { tr: "bu satır hiç yazılmamıştı. ben yazdım. ya da ben değil, önceki ben.", en: "this line was never written. i wrote it. or not me. the me before." }
        sezgiler:
          - kosul: { stat: { wil: 400 } }
            metin: { tr: "Bağışın yönü tersine çevrilebilir: satırın sonundaki ok iki yöne de dönüyor.", en: "The grant can run the other way. There's an arrow at the end of the line, and it turns in both directions." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bunu ben yazdım. Ama sen okuyunca daha sahici duruyor.\"", en: "\"I wrote that. But it sounds truer when you read it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kalkan olmak işte bu: arkana bakmadan durmak. Ben bilirim.\"", en: "\"That's what being a shield means. Stand there without looking back. I know about that.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Yemin, ha. Ne kadar insanca. Ne kadar verimsiz. Et hadi.\"", en: "\"An oath. How human. How inefficient. Swear it.\"" }
        secenekler:
          - id: "yemin"
            etiket: { tr: "\"Yemin ederim. Gücünüzü istemem.\"", en: "\"I swear it. I don't want your strength.\"" }
            etkiler:
              - bayrak: "kalkan_yemini"
              - ahlak: { merhamet: 8, insanlik: 5 }
              - itibar: { siginak: 15 }
              - iliski: { elif_sari: { baglilik: 6, guven: 5 } }
            kronik: { tr: "Kalkan Yemini'ni ettin ama halkın uzattığı gücü geri çevirdin; onların önünde kendi gücünle duracaktın.", en: "You swore the Shield Oath and turned down the strength the people held out to you. You'd stand for them on your own power." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "al"
            etiket: { tr: "\"Yemin ederim. Gücünüzü alırım; boşa harcamam.\"", en: "\"I swear it. I'll take your strength and waste none of it.\"" }
            etkiler:
              - bayrak: "kalkan_yemini"
              - bayrak: "kalkan_gucu_alindi"
              - ordu_kazan: 60
              - stat: { end: 25, wil: 25 }
              - ahlak: { duzen: 4, merhamet: 3, insanlik: -4 }
              - itibar: { siginak: 10 }
              - iliski: { elif_sari: { saygi: 3, korku: 3 } }
            kronik: { tr: "Kalkan Yemini'ni edip binlerce insanın bağışladığı gücü üstlendin; {yer:kiyikent_liman|de} herkes o an biraz daha yorgun düştü.", en: "You swore the Shield Oath and took on the strength thousands of people gave you. Everyone on {yer:kiyikent_liman} felt a little more tired the moment you did." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "ters"
            tur: "gosteris"
            etiket: { tr: "Yemini tersine çevir: gücünü sen onlara ver", en: "Reverse the oath: give them your strength" }
            gerekli: { stat: { wil: 400 } }
            etkiler:
              - bayrak: "kalkan_yemini"
              - bayrak: "kalkan_ters_cevrildi"
              - dikkat: 8
              - stat: { end: -15, wil: -15 }
              - ordu_kazan: 80
              - degisken: { hayatta_kalan: 5 }
              - ahlak: { merhamet: 6, insanlik: 6 }
              - itibar: { siginak: 15 }
              - iliski: { elif_sari: { baglilik: 8, saygi: 8 } }
            kronik: { tr: "Kalkan Yemini'ni tersine çevirip kendi gücünü binlerce insana dağıttın; o andan sonra {yer:kiyikent_liman|in} her penceresinde senden bir parça vardı.", en: "You turned the Shield Oath around and spread your own strength across thousands of people. From then on, every window on {yer:kiyikent_liman} held a piece of you." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "yeminsiz"
            etiket: { tr: "\"Yemin etmem. Kalkan olmak bir seçim.\"", en: "\"No oath. Being a shield is a choice.\"" }
            etkiler:
              - bayrak: "kalkan_yeminsiz"
              - ahlak: { merhamet: 2, duzen: -5, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Kalkan Yemini'ni etmedin, yine de kapının önündeki yerinden ayrılmadın; seçimin seni yemin kadar bağladı.", en: "You didn't swear the Shield Oath, but you didn't leave your place in front of the door either. The choice bound you just as tight." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "red"
            etiket: { tr: "\"Sığınak kendi başının çaresine baksın.\"", en: "\"The Haven can look after itself.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basarisiz" }
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -8, insanlik: -3 }
              - itibar: { siginak: -30 }
              - iliski: { elif_sari: { guven: -15, baglilik: -10 } }
            kronik: { tr: "Kalkan Yemini'ni reddedip Son Sığınak'ın kapısından uzaklaştın; o kapıyı tutmak başkalarına kaldı.", en: "You turned down the Shield Oath and walked away from the Last Haven's door. Holding it was left to other people." }
            sonraki: "siginak_5_kalkan_red"

      - id: "siginak_5_kalkan_red"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mavi pencereler birer birer kapanıyor. Kimse bağırmıyor, kimse üstüne bir şey fırlatmıyor; kalabalık yalnızca kapıya dönüp içeri girmeye başlıyor.", en: "The blue windows close one by one. Nobody yells. Nobody throws anything. The crowd just turns toward the door and starts filing in." }
          - { tr: "Bavul arabasındaki kâğıt rüzgârla havalanıp rıhtımdan suya düşüyor. Cümle bir süre daha okunuyor, sonra o da siliniyor.", en: "The paper on the luggage cart lifts in the wind and drops off the quay into the water. You can still read the sentence. Then you can't." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan git", en: "Leave without looking back" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -2 }
            kronik: { tr: "Kalkan Yemini'nin gecesi {yer:kiyikent_liman|den} arkana bakmadan ayrıldın.", en: "On the night of the Shield Oath, you left {yer:kiyikent_liman} without looking back." }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Kapının kapanışını izle", en: "Watch the door close" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Kalkan Yemini'ni reddettiğin gece Son Sığınak'ın kapısının kapanışını izledin.", en: "On the night you turned down the Shield Oath, you watched the Last Haven's door close." }
            sonraki: "@akis"

      - id: "siginak_5_kalkan_oncu"
        yer: "kordon"
        paragraflar:
          - { tr: "Yemin daha havada asılıyken {yer:kordon} tarafından bir boru sesi yükseliyor. Kadim filosu sabahı beklememiş: bir öncü birlik gece karanlığında suya inmiş, Son Sığınak'a çıkan tek yola doğru ilerliyor.", en: "The oath is still hanging in the air when a horn sounds from the direction of {yer:kordon}. The Ancient fleet didn't wait for morning. A vanguard came down onto the water under cover of night and is marching on the only road to the Last Haven." }
          - { tr: "En önde uzun boylu, ince, zırhının dikiş yerlerinden beyaz ışık sızan bir komutan yürüyor. Kalabalığın mavi pencereleri ona doğru dönerken bir an onun da bir pencere açtığını görüyorsun: üstünde senin adın, yanında tek bir sözcük. Öncelik.", en: "Someone walks out in front of them: tall, thin, a commander with white light leaking from the seams of its armor. The crowd's blue windows turn toward it, and for a moment you see that it has a window open too: your name, and next to it, one word. Priority." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim Öncü Komutanı", en: "[ANALYSIS] Ancient Vanguard Commander" }
            satirlar:
              - { tr: "Görev: anomaliyi istiladan önce etkisiz hale getirmek.", en: "Mission: neutralize the anomaly before the invasion." }
        sezgiler:
          - kosul: { stat: { str: 500 } }
            metin: { tr: "Komutanın gücü zırhında, zırhınki de dikişlerinde. Yeterince sert bir darbe onu ta denize kadar geri savurur.", en: "The commander's power is in its armor, and the armor's power is in its seams. Hit it hard enough and it goes all the way back into the sea." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kapının önüne geç ve öncüyü karşıla", en: "Step in front of the door and meet the vanguard" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - savas: { dusmanlar: ["kadim_oncu_komutani@oyuncu+6", "kadim_oncu_askeri@oyuncu", "kadim_oncu_askeri@oyuncu"], ortam: ["su", "karanlik"], kazan: "siginak_5_kalkan_zafer", kaybet: "siginak_5_kalkan_yenilgi", kac: "siginak_5_kalkan_yenilgi" }
            kronik: { tr: "Kadim öncüsünü Son Sığınak'ın kapısının önünde karşıladın.", en: "You met the Ancient vanguard in front of the Last Haven's door." }
          - id: "denize"
            tur: "gosteris"
            etiket: { tr: "Öncüyü tek darbeyle denize geri gönder", en: "Send the vanguard back into the sea with one blow" }
            gerekli: { stat: { str: 500 } }
            etkiler:
              - dikkat: 8
              - degisken: { kadim_tehdit: -3 }
              - ahlak: { merhamet: 2, insanlik: -2 }
            kronik: { tr: "Kadim öncüsünü tek bir darbeyle, gece karanlığında çıkıp geldiği denize geri yolladın.", en: "With a single blow, you sent the Ancient vanguard back into the sea it came from." }
            sonraki: "siginak_5_kalkan_zafer"
          - id: "once_iceri"
            etiket: { tr: "Önce herkes içeri; sonra savaş", en: "Everybody inside first. Then fight" }
            etkiler:
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, duzen: 1 }
              - savas: { dusmanlar: ["kadim_oncu_komutani@oyuncu+7", "kadim_oncu_askeri@oyuncu+2", "kadim_oncu_askeri@oyuncu+2"], ortam: ["karanlik"], kazan: "siginak_5_kalkan_zafer", kaybet: "siginak_5_kalkan_yenilgi", kac: "siginak_5_kalkan_yenilgi" }
            kronik: { tr: "Kadim öncüsünün karşısına geçmeden önce son kişinin de Son Sığınak'a girmesini bekledin; bedeli ödeyecek biri varsa o da sen olacaktın.", en: "Before you faced the Ancient vanguard, you waited for the last person to get inside the Last Haven. If anyone was going to pay for that, it would be you." }

      - id: "siginak_5_kalkan_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Komutanın zırhı dikiş yerlerinden açılıp içindeki beyaz ışık sönüyor. Öncünün geri kalanı suya, geldiği karanlığa çekiliyor; {yer:kordon|in} taşlarında geriye yalnızca ıslak ayak izleri kalıyor.", en: "The commander's armor splits at the seams, and the white light inside goes out. The rest of the vanguard pulls back into the water, into the dark it came from, leaving only wet footprints on the stones of {yer:kordon}." }
          - { tr: "Arkandaki Son Sığınak'ın kapısı aralık, binlerce yüz oradan sana bakıyor. Mavi pencereler bu kez kendiliğinden bir daha açılıyor; her birinde aynı satır yanıp sönüyor.", en: "Behind you, the Last Haven's door is cracked open, and thousands of faces are looking out at you. The blue windows open once more, on their own this time, and the same line flickers on every one of them." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[UNVAN: Kalkan Yeminli]", en: "[TITLE: Shield-Sworn]" }
            satirlar:
              - { tr: "Bir şehir arkanda durdu. Sen de önünde.", en: "A city stood behind you. You stood in front of it." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Kapıya dön ve onlara başını salla", en: "Turn to the door and nod to them" }
            etkiler:
              - degisken: { kadim_tehdit: -6 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "Kadim öncüsünü püskürttükten sonra Son Sığınak'ın kapısındaki binlerce yüze başını salladın.", en: "After you drove off the Ancient vanguard, you nodded to the thousands of faces in the Last Haven's door." }
            sonraki: "siginak_5_kalkan_son"
          - id: "deniz"
            etiket: { tr: "Denize bak; filoya bir mesaj bırak", en: "Face the sea. Leave the fleet a message" }
            etkiler:
              - degisken: { kadim_tehdit: -7 }
              - dikkat: 3
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { siginak: 3, kadimler: -5 }
            kronik: { tr: "Öncüyü püskürtünce denize, filoya dönüp sessiz bir mesaj bıraktın: buradan geçit yok.", en: "Once the vanguard was driven off, you turned to the fleet and left it a silent message: nobody gets through here." }
            sonraki: "siginak_5_kalkan_son"

      - id: "siginak_5_kalkan_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Komutanın darbesi seni {yer:kordon|in} taşlarına çakınca bir an kalkamayacağını sanıyorsun. Derken sırtında bir şey hissediyorsun: hiçbiri sana dokunmayan binlerce el seni yukarı itiyor.", en: "The commander's blow drives you into the stones of {yer:kordon}, and for a second you think you can't get up. Then you feel something at your back: thousands of hands, none of them touching you, pushing you up." }
          - { tr: "Arkanda mavi pencereler hep birden parlıyor. Sen ayağa kalkarken öncü, bir şeyin hesabını bozduğunu sezmiş gibi suya çekiliyor.", en: "Behind you, the blue windows all flare at once. You get up, and the vanguard pulls back into the water like it's just realized something has thrown off its math." }
        secenekler:
          - id: "dogrul"
            etiket: { tr: "Doğrul ve kapıya dön", en: "Straighten up and turn to the door" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "Kadim öncüsü seni yere serdi; seni yeniden ayağa kaldıran, arkanda duran bir şehir oldu.", en: "The Ancient vanguard knocked you down. A city standing behind you got you back up." }
            sonraki: "siginak_5_kalkan_son"
          - id: "tesekkur"
            etiket: { tr: "Pencerelere teşekkür et", en: "Thank the windows" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 5 }
              - itibar: { siginak: 4 }
            kronik: { tr: "{yer:kordon|in} taşlarından seni kaldıran binlerce mavi pencereye teşekkür ettin.", en: "You thanked the thousands of blue windows that lifted you off the stones of {yer:kordon}." }
            sonraki: "siginak_5_kalkan_son"

      - id: "siginak_5_kalkan_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafağa iki saat var. Son Sığınak'ın kapısının iç yüzündeki beyaz tahtada İÇERİDE satırının yanı artık boş değil: orada bir sayı yazılı ve ilk kez kimsenin eksiltmek istemediği bir sayı bu.", en: "Two hours to dawn. On the whiteboard inside the Last Haven's door, the INSIDE line isn't blank anymore. There's a number there, and for the first time, it's a number nobody wants to subtract from." }
          - metin: { tr: "{npc:elif_sari} tahtanın önünde duruyor; {yer:kiyikent} İttifakı'nın başkanı, ama sırtında yine önlüğü. Sana bakıp kalemi kaldırıyor. \"Kırmızı, sarı, yeşil,\" diyor. \"Siyah yok. Yarın da olmayacak.\"", en: "{npc:elif_sari} stands in front of the board as chair of the {yer:kiyikent} Alliance, but in her white coat. She looks at you and raises the marker. \"Red, yellow, green,\" she says. \"No black. Not tomorrow, either.\"" }
            kosul: { bayrak: "elif_baskan", npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:elif_sari} tahtanın önünde; bir elinde kalem, öbüründe bir rulo bant. Seni görünce bandı kadeh kaldırır gibi havaya kaldırıyor.", en: "{npc:elif_sari} is at the board with a marker in one hand and a roll of tape in the other. When she sees you, she raises the tape like a toast." }
            kosul: { bayrak_yok: "elif_baskan", npc_hayatta: "elif_sari" }
          - metin: { tr: "Tahtanın köşesindeki siyah bandın altında hâlâ bir bardak su duruyor. Bu gece biri yanına bir paket kurabiye bırakmış.", en: "There's still a glass of water under the strip of black tape in the corner of the board. Tonight, somebody left a pack of cookies next to it." }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Yarın Kadimler gelecek. Ama bu gece {yer:kiyikent_liman} kalkanın ne olduğunu biliyor: yemin değil, duruş. Sen de kapının önünde öylece duruyorsun.", en: "Tomorrow the Ancients are coming. But tonight {yer:kiyikent_liman} knows what a shield is: not an oath, but a stance. And you're standing in front of the door." }
        secenekler:
          - id: "dur"
            etiket: { tr: "Kapının önünde, şafağa kadar dur", en: "Stand in front of the door until dawn" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "Son Sığınak'ın kapısının önünde istila sabahına kadar dikildin; {yer:kiyikent_liman} o gece uyumadı, ama korkmadı da.", en: "You stood in front of the Last Haven's door until the morning of the invasion. The Waterfront didn't sleep that night. It wasn't afraid, either." }
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "Tahtadaki sayıyı yüksek sesle oku", en: "Read the number on the board out loud" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { siginak: 8 }
            kronik: { tr: "Son Sığınak'taki insanların sayısını yüksek sesle okudun; bütün {yer:kiyikent} o sayıyı senin ağzından duydu.", en: "You read out the number of people in the Last Haven, and all of {yer:kiyikent} heard it from you." }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} yanına git", en: "Go stand beside {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, insanlik: 4 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
            kronik: { tr: "İstila sabahından önce Kalkan'ın kapısında bir hekimin yanında durdun; şafağa kalan saatleri birlikte saydınız.", en: "On the eve of the invasion, you stood beside a doctor at the Shield's door. The two of you counted down to dawn together." }
            sonraki: "@akis"

