# Parti B1 — Sığınak Konseyi zinciri (zincir_siginak) + Elif Sarı'nın yayı (docs/PERDE2_4.md §4 "Parti B1").
#
# Zincir (ana yay mekanizmasıyla: önceki düğümün bayrağı ve görev "basla" iken, verilen günden itibaren ilk fırsatta gelir):
#   siginak_1_konsey        (P2, AY 66)  — Konsey'in ilk işi: mendirekteki yuva. Görev başlar.
#   siginak_2_su_savaslari  (P2, AY 122) — Pınarbaşı, sarnıç, Tuzla mavnası: su kimin?
#   siginak_3_tahliye       (P3, AY 205) — Kadim örnekleme sütunu; Kordon ve Eski Şehir boşaltılır.
#   siginak_4_son_siginak   (P3, AY 268) — Kuru havuzda Son Sığınak; duvardaki çentikler (önceki döngü ipucu).
#   siginak_5_kalkan_yemini (P4, AY 339) — Kalkan Yemini ve Kadim öncüsü. Görev tamam (Koruyucu sonu için).
# Elif yayı: elif_konsey_oylamasi (P2) · elif_gece_nobeti (P2–3; elif_ask) · elif_lonca_darbesi (P3; Elif ölebilir) ·
#   elif_baris_masasi (P4, AY 333; elif_baskan, insan_ittifaki) · elif_son_gece (P4, tohum; istila arifesi).
# Ara karakterler (NPC dosyası yok, adları yerelleştirilmiş takma adlardır): Rıza Reis / Skipper Reese (eski vapur kaptanı,
#   Konsey'in en eski üyesi), Nurhan / Nora (başhemşire), Pala / Cleaver (Lonca'nın tahsildarı, darbenin eli),
#   ihtiyar hâkim / the old judge (Konsey başkanı; konsey oylamasında ölür).
# Değişken lonca_golgesi: Lonca'nın Liman üstündeki gölgesi (oyuncunun Lonca'ya verdiği tavizler); darbe sahnelerini renklendirir.
olaylar:
  # ================================================================== SIĞINAK 1 — KONSEY (P2, AY 66)
  - id: "siginak_1_konsey"
    perde: [2]
    gun: { min: 50, max: 110 }
    ana_yay: { gun: 66 }
    agirlik: 1
    etiketler: ["siginak", "zincir", "konsey", "npc"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Konsey'den bir bilet", en: "A ticket from the Council" }
    sahne: "siginak_1_konsey_1"
    sahneler:
      - id: "siginak_1_konsey_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sabah kapına on yaşlarında bir çocuk geliyor; boynunda bir düdük, elinde katlanmış eski bir vapur bileti. Biletin arkasına mavi tükenmez kalemle tek bir kelime yazılmış, üstüne de lastik bir mühür basılmış: KONSEY.", en: "In the morning a kid of maybe ten turns up at your door with a whistle around his neck and an old folded ferry ticket in his hand. On the back, in blue ballpoint, there's one word with a rubber stamp over it: COUNCIL." }
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonu hâlâ bir bekleme salonu gibi kokuyor: tuz, demlenmiş çay, ıslak karton. Plastik koltuk sıraları insanla dolu; Konsey ise yedi bilet gişesinin camlarının ardında oturuyor, her gişede bir üye, sanki sana bir sefer satacaklarmış gibi.", en: "The {yer:kiyikent_iskele} waiting hall still smells like a waiting hall: salt air, burnt coffee, wet cardboard. The rows of plastic seats are packed, and the Council sits behind the glass of seven ticket windows, one member to a booth, like they're about to sell you passage somewhere." }
          - { tr: "Kalkış panosunun harfleri artık elle çevriliyor. Bugün şunu yazıyor: NÜFUS 9.412 · SU 3 GÜN · BALIK YOK · DÜN ÖLEN 6.", en: "Somebody flips the letters on the departures board by hand now. Today it reads: POPULATION 9,412 · WATER 3 DAYS · FISH NONE · DEAD YESTERDAY 6." }
          - { tr: "Dördüncü gişede {npc:elif_sari} oturuyor; önlüğü temiz ama manşetlerindeki kan lekeleri hiç çıkmamış. Birinci gişede kaptan şapkalı yaşlı bir adam, otuz yıl ada vapurunu kullanmış Rıza Reis, mikrofona eğiliyor ve gişe hoparlörü cızırdıyor: \"Mendireğin altında bir şey yuva yaptı. İki tekne gitti, altı adam. Balık yoksa dokuz gün sonra ekmek de yok.\"", en: "{npc:elif_sari} is in window four, her coat clean, the bloodstains on the cuffs long past coming out. In window one, an old man in a captain's cap leans into the booth mic, and the speaker crackles. Skipper Reese ran the island ferry for thirty years. \"Something's nesting under the breakwater. Two boats gone, six men. No fish, and in nine days there's no bread either.\"" }
          - metin: { tr: "{npc:elif_sari} seninle birlikte girmiş, çantasını omzundan indirmeden dördüncü gişeye geçip oturuyor. \"Seferlerde seninleyim, salıları buradayım,\" diyor camın ardından. \"Bugün salı.\"", en: "{npc:elif_sari} walked in with you, and she slides into window four without taking the bag off her shoulder. \"On the road I'm with you. Tuesdays I'm here,\" she says through the glass. \"It's Tuesday.\"" }
            kosul: { yoldas: "elif_sari" }
          - { tr: "\"{fraksiyon:lonca} yuvayı temizlemeyi teklif etti,\" diyor Rıza Reis. \"Bundan sonraki her avın üçte biri karşılığında. Sonsuza kadar.\" {npc:elif_sari} mikrofonu kendine çekiyor: \"Sana ödeyecek bir şeyimiz yok. Bir yatak, bir tabak yemek ve bu salonda bir oy. Hepsi bu.\"", en: "\"The {fraksiyon:lonca} offered to clear it,\" Skipper Reese says. \"For a third of every catch from here on out. Forever.\" {npc:elif_sari} pulls the mic her way. \"We can't pay you. A bed, a plate, and a vote in this room. That's what we've got.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[BÖLGE TARAMASI · Liman]", en: "[ZONE SCAN · The Waterfront]" }
            satirlar:
              - { tr: "Nüfus: 9.412. Ortalama seviye: düşük.", en: "Population: 9,412. Average level: low." }
              - { tr: "Bölgedeki en yüksek seviye: sen. Fark: anlamlı bir sayıyla ifade edilemiyor.", en: "Highest level in zone: you. Margin: cannot be expressed as a meaningful number." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Panodaki DÜN ÖLEN sayısı 6 değil, 9. Harfleri çeviren el üç rakamı bilerek atlamış.", en: "DEAD YESTERDAY isn't 6. It's 9. Whoever flipped the letters skipped three on purpose." }
          - kosul: { stat: { wis: 45 } }
            metin: { tr: "Rıza Reis'in ceket cebinden katlanmış bir Lonca sözleşmesinin köşesi görünüyor. Altında bir imza var; mürekkebi kurumuş.", en: "A folded Guild contract is poking out of Skipper Reese's coat pocket. There's a signature on it, and the ink's already dry." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷okuz bin dört yüz on iki. hepsi sana bakıyor ve hepsi aynı şeyi görüyor: bir duvar. duvarlar eninde sonunda çatlar, bilirsin.", en: "n̷ine thousand four hundred twelve. every one of them is looking at you and seeing the same thing: a wall. walls crack eventually. you know that." }
          - kosul: { bayrak: "uye_lonca" }
            anlati: true
            metin: { tr: "Arka sıralarda birkaç kişi kolundaki Lonca bandına bakıp fısıldaşıyor. Rıza Reis bunu görüyor ve hiçbir şey söylemiyor.", en: "In the back rows, a few people are looking at the Guild band on your arm and whispering. Skipper Reese sees it and says nothing." }
          - kosul: { bayrak: "uye_siginak" }
            anlati: true
            metin: { tr: "Sen artık buranın insanısın; yine de sana bir bilet gönderdiler. Konsey her şeyi usulüne göre yapar, kıyamette bile.", en: "You're one of theirs now, and they still sent you a ticket. The Council does everything by the book, even at the end of the world." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dokuz bin kişi ve bir mendirek. Bunu yaparız. Değil mi? Yaparız.\"", en: "\"Nine thousand people and one breakwater. We can do this. Right? We can do this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kalkış panosunu elle çeviriyorlar. Bu ya çok romantik ya da çok kötü bir veri yönetimi.\"", en: "\"They're flipping the departures board by hand. That's either very romantic or very bad data management.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Mendireği temizlerim. Karşılık istemem.\"", en: "\"I'll clear the breakwater. No charge.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Konsey'in ilk işini karşılıksız aldın; Liman o günden sonra sana fatura kesmeyi hiç düşünmedi.", en: "You took the Council's first job for free. The Waterfront never once thought about sending you a bill after that." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "sart"
            etiket: { tr: "\"Kordon'dan gelenler de içeri alınırsa.\"", en: "\"Only if the Esplanade people get let in.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "konsey_kalkan_sart"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { merhamet: 6, duzen: -2 }
              - iliski: { elif_sari: { guven: 6, baglilik: 3 } }
            kronik: { tr: "Kalkan olmaya bir şart koştun: Liman'ın kapıları kayıtsızlara da açılacaktı.", en: "You put a condition on being their shield: the Waterfront's gates would open to the unregistered, too." }
            sonraki: "siginak_1_konsey_sart"
          - id: "bedel"
            etiket: { tr: "\"Avın beşte biri ve Konsey'de bir sandalye.\"", en: "\"A fifth of the catch and a seat on the Council.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "oyuncu_konsey_payi"
              - gorev: { zincir_siginak: "basla" }
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3, merhamet: -3 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: -2, guven: -2 } }
            kronik: { tr: "Kalkanlığına bir fiyat biçtin; Konsey ödedi ve faturayı hiç unutmadı.", en: "You put a price on being their shield. The Council paid it, and never forgot the invoice." }
            sonraki: "siginak_1_konsey_bedel"
          - id: "pano"
            tur: "gosteris"
            etiket: { tr: "Panoyu düzelt: dün ölenler altı değil, dokuz", en: "Fix the board: it's nine dead, not six" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bolge: "kiyikent_liman"
              - dikkat: 2
              - ahlak: { duzen: 2, insanlik: 3 }
              - iliski: { elif_sari: { saygi: 5 } }
            kronik: { tr: "Konsey'in panosundaki yalanı herkesin önünde düzelttin; o pano bir daha hiç yalan söylemedi.", en: "You fixed the lie on the Council's board in front of everyone. That board never lied again." }
            sonraki: "siginak_1_konsey_pano"
          - id: "sozlesme"
            etiket: { tr: "Rıza Reis'e cebindeki sözleşmeyi sor", en: "Ask Skipper Reese about the contract in his pocket" }
            gerekli: { stat: { wis: 45 } }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bolge: "kiyikent_liman"
              - ahlak: { duzen: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Rıza Reis'in cebindeki Lonca sözleşmesini salonun ortasına çıkardın.", en: "You pulled the Guild contract out of Skipper Reese's pocket in front of the whole hall." }
            sonraki: "siginak_1_konsey_sozlesme"
          - id: "red"
            etiket: { tr: "\"Konsey'in derdi benim derdim değil.\"", en: "\"The Council's problems aren't my problems.\"" }
            etkiler:
              - tanis: "elif_sari"
              - bayrak: "siginak_1_goruldu"
              - bayrak: "siginak_1_red"
              - ahlak: { merhamet: -3, insanlik: -2 }
              - itibar: { siginak: -5 }
              - iliski: { elif_sari: { saygi: -3, baglilik: -2 } }
              - degisken: { lonca_golgesi: 2 }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 10, max: 20 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Konsey'in biletini geri çevirdin; mendirek Lonca'nın oldu, her avın üçte biriyle birlikte.", en: "You turned down the Council's ticket. The breakwater went to the Guild, along with a third of every catch." }
            sonraki: "siginak_1_konsey_red"

      - id: "siginak_1_konsey_sart"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} gişeden çıkıp salonun ortasına bir beyaz tahta yuvarlıyor. Kenarları çatlamış, tekerleklerinden biri gıcırdıyor; üstünde, yemek katından kalma solgun bir kalem iziyle hâlâ KONSEY yazıyor.", en: "{npc:elif_sari} comes out of her booth and wheels a whiteboard into the middle of the hall. The edges are cracked and one caster squeals, and across the top, in faded marker from the food court days, it still says COUNCIL." }
          - { tr: "Oylama üçe üç bitiyor. Yedinci gişedeki ihtiyar hâkim, Konsey'in başkanı, gözlüğünü çıkarıp gözlerini ovuşturuyor. \"Dokuz bin kişiyiz,\" diyor Rıza Reis. \"Sen iki bin ağız daha ekliyorsun.\"", en: "The vote comes out three to three. The old judge in window seven, the Council's chair, takes off her glasses and rubs her eyes. \"We're nine thousand people,\" Skipper Reese says. \"You want to add two thousand more mouths.\"" }
          - { tr: "Hâkim sana bakıyor. \"Beni inandır, evladım,\" diyor, \"oyumu vereyim.\"", en: "The judge looks at you. \"Make me believe it, dear,\" she says, \"and you'll have my vote.\"" }
        sezgiler:
          - kosul: { stat: { cha: 45 } }
            metin: { tr: "Hâkim çoktan karar vermiş. İstediği bir gerekçe değil; salonun duyacağı bir söz.", en: "The judge has already decided. She doesn't want a reason. She wants something the room can hear." }
          - kosul: { bayrak: "kordon_dustu" }
            anlati: true
            metin: { tr: "Kordon düştüğünden beri oradan kaçanlar Liman'ın tel örgüsünün dışında, eski otoparkta çadırlarda yaşıyor. Geceleri onların öksürüğü buradan duyuluyor.", en: "Ever since the Esplanade fell, the people who ran from it have been living in tents in the old parking lot outside the Waterfront's fence. At night you can hear them coughing from in here." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben bir zamanlar o çadırlardan birindeydim. Yani... öyle bir yerdeydim. Kapıyı aç.\"", en: "\"I used to be in one of those tents. Well... somewhere like it. Open the gate.\"" }
        secenekler:
          - id: "balik"
            etiket: { tr: "\"Onları besleyecek balığı da ben getiririm.\"", en: "\"I'll bring back the fish to feed them, too.\"" }
            etkiler:
              - bayrak: "kordon_kapisi_acildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "Kordon'dan gelen iki bin kayıtsız o kış Liman'ın içinde, çatı altında uyudu.", en: "Two thousand unregistered people from the Esplanade spent that winter inside the Waterfront, under a roof." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni göster: \"Benimle pazarlık etmeyin.\"", en: "Show your real level: \"Don't haggle with me.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - bayrak: "kordon_kapisi_acildi"
              - ahlak: { duzen: 3, merhamet: 2, insanlik: -2 }
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { korku: 4, saygi: 2 } }
            kronik: { tr: "Kapıları oyla değil, seviyenle açtırdın; Konsey o gün sana bir daha hayır diyemeyeceğini öğrendi.", en: "You opened the gates with your level, not a vote. That was the day the Council learned it couldn't tell you no." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "uzlasma"
            etiket: { tr: "\"Yalnızca çocuklar ve hastalar girsin.\"", en: "\"Just the kids and the sick, then.\"" }
            etkiler:
              - bayrak: "kordon_kapisi_aralandi"
              - ahlak: { merhamet: 2, duzen: 3 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { elif_sari: { saygi: 2 } }
            kronik: { tr: "Kapıyı yalnızca çocuklara ve hastalara araladın; yetişkinler tel örgünün dışında kışı bekledi.", en: "You cracked the gate for the kids and the sick. The grown-ups waited out the winter on the other side of the fence." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_bedel"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis ilk kez gülümsüyor; dişlerinin yarısı yok. \"Nihayet tüccar gibi konuşan biri,\" diyor. \"Beşte bir. Lonca'nın üçte birinden ucuz.\"", en: "Skipper Reese smiles for the first time. He's missing half his teeth. \"Finally, somebody who talks like a businessman,\" he says. \"A fifth. Cheaper than the Guild's third.\"" }
          - { tr: "{npc:elif_sari} tahtaya senin adını yazıyor, KONSEY başlığının altına, diğerlerinden biraz daha küçük harflerle. \"Tamam,\" diyor, sesinde hiçbir şey yokmuş gibi. \"Artık balıkla ödüyoruz.\"", en: "{npc:elif_sari} writes your name on the whiteboard under COUNCIL, a little smaller than the others. \"Fine,\" she says, like there's nothing in her voice at all. \"We pay in fish now.\"" }
        secenekler:
          - id: "bagis"
            etiket: { tr: "\"Payım hastaneye gitsin.\"", en: "\"My cut goes to the hospital.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Sandalyeyi aldın ama payını Gümrük'teki koğuşa bıraktın; hemşireler o balığa 'kalkanın payı' dedi.", en: "You took the seat but left your cut to the ward in the Customs House. The nurses called that fish \"the shield's share.\"" }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "pazarlik"
            etiket: { tr: "\"Pazarlık pazarlıktır.\"", en: "\"A deal's a deal.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - kredi: 150
              - iliski: { elif_sari: { guven: -2 } }
            kronik: { tr: "Payını her sabah iskelede tarttırıp aldın; balıkçılar sana kalkan değil, ortak demeye başladı.", en: "You had your cut weighed out on the dock every morning. The fishermen stopped calling you the shield and started calling you the partner." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_pano"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Panoya yürüyüp üç harfi çeviriyorsun. Tak, tak, tak: DÜN ÖLEN 9. Salon öyle sessizleşiyor ki dışarıda bir martının çığlığı duyuluyor.", en: "You walk up to the board and flip three letters. Clack, clack, clack: DEAD YESTERDAY 9. The hall goes so quiet you can hear a gull outside." }
          - { tr: "\"Ben yaptım,\" diyor Rıza Reis sonunda, mikrofona değil, cama bakarak. \"Panik, balıksızlıktan hızlı öldürür.\"", en: "\"I did it,\" Skipper Reese finally says, not into the mic, but at the glass. \"Panic kills faster than an empty net.\"" }
          - { tr: "{npc:elif_sari} gişesinden kalkıyor. \"Bundan sonra pano doğruyu söyleyecek,\" diyor. \"Panik olacaklarsa, bilerek panik olsunlar.\"", en: "{npc:elif_sari} stands up in her booth. \"From now on, the board tells the truth,\" she says. \"If they're going to panic, they can panic knowing.\"" }
        secenekler:
          - id: "dogru"
            etiket: { tr: "\"Doğruyu yazın. Mendireği ben hallederim.\"", en: "\"Write the truth. I'll handle the breakwater.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "pano_dogru"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
            kronik: { tr: "Konsey'in panosu senin yüzünden doğruyu yazmaya başladı; insanlar korktu ama birbirine güvendi.", en: "Because of you, the Council's board started telling the truth. People got scared, but they trusted each other." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "reis"
            etiket: { tr: "\"Reis haklı; panik kimseye yaramaz.\"", en: "\"The Skipper's right. Panic helps nobody.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: -3, saygi: 2 } }
            kronik: { tr: "Yalanı düzelttin, sonra geri yazdırdın; pano bir süre daha sakin rakamlar gösterdi.", en: "You fixed the lie, then let them put it back. The board kept showing calm numbers for a while longer." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_sozlesme"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis'in yüzündeki renk çekiliyor. Cebinden katlanmış kâğıdı çıkarıp camın altındaki para gözüne itiyor: bir Lonca sözleşmesi. Altında iki imza var; biri onun, öbürü {fraksiyon:lonca|in} tahsildarı Pala'nın.", en: "The color drains out of Skipper Reese's face. He pulls the folded paper out of his pocket and slides it through the cash slot under the glass: a Guild contract. Two signatures at the bottom. One's his. The other belongs to the {fraksiyon:lonca|pos} collector, the man they call Cleaver." }
          - { tr: "\"Hayır dersin diye imzaladım,\" diyor. \"Yaşlıyım, aptal değilim.\" {npc:elif_sari} kâğıda bakıyor; sonra Reis'e, sanki ilk kez görüyormuş gibi.", en: "\"Signed it in case you said no,\" he says. \"I'm old, not stupid.\" {npc:elif_sari} looks at the paper, then at the Skipper, like she's seeing him for the first time." }
        secenekler:
          - id: "yirt"
            etiket: { tr: "\"Yırtın onu. Mendirek benim işim.\"", en: "\"Tear it up. The breakwater's my job.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "lonca_sozlesmesi_yirtildi"
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 5, lonca: -3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Lonca'nın mendirek sözleşmesini yırttırdın; Pala o kâğıdın parçalarını cebinde taşıdı.", en: "You had the Guild's breakwater contract torn up. Cleaver carried the pieces around in his pocket after that." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "sakla"
            etiket: { tr: "\"Saklayın. Bir gün lazım olur.\"", en: "\"Hang onto it. You might need it someday.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - degisken: { lonca_golgesi: 1 }
              - ahlak: { duzen: 3 }
              - iliski: { elif_sari: { saygi: 2, guven: -1 } }
            kronik: { tr: "Lonca sözleşmesini çekmecede bıraktın; Konsey'in elinde hep bir yedek efendi kaldı.", en: "You left the Guild contract in a drawer. The Council always had a spare master on file." }
            sonraki: "siginak_1_konsey_mendirek"
          - id: "anlat"
            etiket: { tr: "\"Bunu Konsey'e sen anlat, Reis.\"", en: "\"You explain this to the Council, Skipper.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { duzen: 4, insanlik: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Rıza Reis'i kendi imzasını Konsey'e açıklamaya zorladın; ihtiyar bunu sana hiç unutmadı, iyi ya da kötü.", en: "You made Skipper Reese explain his own signature to the Council. The old man never forgot that, for better or worse." }
            sonraki: "siginak_1_konsey_mendirek"

      - id: "siginak_1_konsey_red"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Rıza Reis cebinden bir kâğıt çıkarıyor, bir kalem istiyor ve hiç acele etmeden imzalıyor. \"Lonca'ya haber verin,\" diyor yanındaki çocuğa. Çocuk düdüğünü ağzına alıp koşuyor.", en: "Skipper Reese takes a paper out of his pocket, asks for a pen, and signs it without any hurry at all. \"Tell the Guild,\" he says to the kid beside him. The kid puts his whistle in his mouth and runs." }
          - { tr: "{npc:elif_sari} seni kapıda yakalıyor. \"Yalvarmayacağım,\" diyor. \"Ama teklif tahtada kalıyor. Silmeyeceğim.\"", en: "{npc:elif_sari} catches you at the door. \"I'm not going to beg,\" she says. \"But the offer stays on the board. I'm not erasing it.\"" }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Omuz silk ve yürü", en: "Shrug and walk out" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - iliski: { elif_sari: { baglilik: -2 } }
            kronik: { tr: "{yer:kiyikent_iskele|den} omuz silkerek çıktın; Konsey adını tahtada bekletti.", en: "You shrugged your way out of the {yer:kiyikent_iskele}. The Council left your name waiting on the board." }
            sonraki: "@akis"
          - id: "belki"
            etiket: { tr: "\"Silme. Belki dönerim.\"", en: "\"Don't erase it. Maybe I'll be back.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Konsey'e kapıyı aralık bıraktın; bir hekim o aralığa her gün baktı.", en: "You left the Council's door open a crack. A doctor checked that crack every single day." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_mendirek"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşamüstü mendireğin ucundasın. Dalgakıran blokları beyaz bir kabukla kaplanmış; aralarında, kapkara ve nabız gibi atan yumurta keseleri sıra sıra dizilmiş. Yeşil fener sönük.", en: "Late afternoon finds you at the end of the breakwater. The concrete tetrapods are crusted over with something white, and wedged between them, rows of jet-black egg sacs pulse like heartbeats. The green harbor light is dark." }
          - { tr: "Kayalıklarda bir teknenin ikiye bölünmüş pruvası duruyor, adı hâlâ okunuyor: NAZLI ANA. Arkanda, zıpkın tüfeklerinden bozma mızraklarla bir avuç balıkçı bekliyor; hiçbiri sana bakmıyor, hepsi suya bakıyor.", en: "The split bow of a fishing boat sits on the rocks, the name still legible: MISS MAGGIE II. Behind you, a handful of fishermen wait with spears hacked out of old speargun parts. None of them is looking at you. They're all looking at the water." }
          - { tr: "Fenerin dibinde, suyun altında büyük bir şey nefes alıyor. Dalgalar onun nefesine göre geliyor ve gidiyor.", en: "At the foot of the light, under the water, something big is breathing. The waves come in and go out to its rhythm." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Mendirek Anası · Kuluçka evresi", en: "[ANALYSIS] Jetty Mother · Brooding" }
            satirlar:
              - { tr: "Yumurta sayısı: 340. Çıkış: bir sonraki met.", en: "Egg count: 340. Hatching: next high tide." }
              - { tr: "Tavsiye: met gelmeden.", en: "Recommendation: before the tide." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Ana uyuyor. Kabuğunda, fenerin dibine bakan tarafta, eski bir yaradan kalma bir çatlak var. Uyurken o çatlak açık.", en: "The mother's asleep. There's a crack in her shell on the side facing the light, an old wound. While she sleeps, it's open." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "u̷yuyan bir anneyi öldürmek kolaydır. kolay olan iyi olan değildir. ama yine de kolaydır.", en: "k̷illing a sleeping mother is easy. easy isn't the same as good. it's still easy." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yumurtaları yakarsak hiçbir balıkçının yarası mikrop kapmaz. Bunu bir hekim olarak söylüyorum, başka bir şey olarak değil.\"", en: "\"Burn the eggs and no fisherman's cut gets infected. I'm saying that as a doctor. Nothing else.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Balıkçıları geride tut. Ön sıra benim. Ön sıra hep benim.\"", en: "\"Keep the fishermen back. Front row's mine. Front row's always mine.\"" }
        secenekler:
          - id: "yuz"
            etiket: { tr: "Yuvaya in; anayı uyandır ve yüzleş", en: "Go down to the nest. Wake her up and face her" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4", "mendirek_yavrusu@oyuncu-4"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendirek Anası'nı uyandırıp yüz yüze dövüştün; balıkçılar o kavgayı torunlarına anlattı.", en: "You woke the Jetty Mother and fought her face to face. The fishermen told their grandkids about it." }
          - id: "catlak"
            etiket: { tr: "Fenerin dibindeki çatlağa, uyurken vur", en: "Hit the crack under the light while she sleeps" }
            gerekli: { stat: { per: 50 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendirek Anası'nı uykusunda, eski yarasından vurdun; temiz ve sessiz bir işti.", en: "You hit the Jetty Mother in her sleep, right in the old wound. Clean, quiet work." }
          - id: "blok"
            tur: "gosteris"
            etiket: { tr: "Dalgakıran bloğunu kaldır, yuvanın üstüne bırak", en: "Lift a tetrapod and drop it on the nest" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - bayrak: "mendirek_ezildi"
              - dikkat: 5
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { elif_sari: { korku: 3, saygi: 5 } }
            kronik: { tr: "Otuz tonluk bir dalgakıran bloğunu tek başına kaldırıp yuvanın üstüne bıraktın; Liman'da kimse bunu bir daha 'güç' diye anmadı, 'o' dedi.", en: "You lifted a sixty-thousand-pound tetrapod by yourself and dropped it on the nest. Nobody on the Waterfront ever called that strength again. They just called it you." }
            sonraki: "siginak_1_konsey_zafer"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Gece, kimse görmeden in; övgü balıkçıların olsun", en: "Go down at night, unseen. Let the fishermen take the credit" }
            etkiler:
              - bayrak: "mendirek_gizli"
              - gizle: 3
              - ahlak: { insanlik: 3, merhamet: 1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4", "mendirek_yavrusu@oyuncu-4"], ortam: ["su", "karanlik"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Mendireği gece, tek başına temizledin ve övgüyü balıkçılara bıraktın; Liman kendi kahramanlarına inandı.", en: "You cleared the breakwater alone at night and left the credit to the fishermen. The Waterfront got to believe in its own heroes." }
          - id: "balikcilar"
            etiket: { tr: "Balıkçıları yanına al; bu onların denizi", en: "Bring the fishermen in. It's their sea" }
            etkiler:
              - bayrak: "balikcilar_savasti"
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: -1 }
              - savas: { dusmanlar: ["mendirek_anasi@oyuncu+2", "mendirek_yavrusu@oyuncu-4"], ortam: ["su"], kazan: "siginak_1_konsey_zafer", kaybet: "siginak_1_konsey_yenilgi", kac: "siginak_1_konsey_kacis" }
            kronik: { tr: "Balıkçıları kendi denizleri için savaştırdın; ikisi dönmedi, kalanlar bir daha hiç korkmadı.", en: "You had the fishermen fight for their own sea. Two didn't come back. The rest were never scared again." }

      - id: "siginak_1_konsey_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Ananın kabuğu fenerin dibinde ikiye ayrılıyor ve içinden çıkan ses bir geminin son düdüğüne benziyor. Met geliyor, yavrular dalgaların arasında çırpınıyor ve tek tek batıyor.", en: "The mother's shell splits in two at the foot of the light, and the sound that comes out of her is like a ship's last horn. The tide rolls in, and the brood thrashes in the surf and goes under, one by one." }
            kosul: { bayrak_yok: ["mendirek_ezildi", "mendirek_gizli"] }
          - metin: { tr: "Blok, yuvanın üstüne bir kapak gibi oturuyor. Balıkçılardan biri istavroz çıkarıyor, bir başkası besmele çekiyor; rıhtımdaki çocuklar ise alkışlıyor, çünkü çocuklar neyin korkunç olduğunu henüz bilmiyor.", en: "The tetrapod settles over the nest like a lid. One fisherman crosses himself. Another mutters something older. The kids on the quay clap, because kids don't know yet what's supposed to be frightening." }
            kosul: { bayrak: "mendirek_ezildi" }
          - metin: { tr: "Sabah balıkçılar ananın leşini kayalıklarda buluyor ve kimin öldürdüğünü tartışmaya başlıyorlar. Rıza Reis'in torunu, zıpkınını sallayarak kendisi olduğunu söylüyor. Sen bir şey söylemiyorsun.", en: "In the morning the fishermen find the carcass on the rocks and start arguing about who killed it. Skipper Reese's grandson waves his spear and swears it was him. You don't say a word." }
            kosul: { bayrak: "mendirek_gizli" }
          - { tr: "Şafakta yeşil fener yeniden yanıyor; biri merdivene tırmanmış, eski bir akü bağlamış. İlk tekneler motorlarını öksürte öksürte çalıştırıp açılıyor.", en: "At dawn the green harbor light comes back on. Somebody climbed the ladder and wired in an old car battery. The first boats cough their engines awake and head out." }
          - metin: { tr: "Kalkış panosunda iki balıkçının adı, DÜN ÖLEN satırının altında, elle yazılmış bir kâğıtta duruyor.", en: "On the departures board, two fishermen's names hang on a handwritten slip under DEAD YESTERDAY." }
            kosul: { bayrak: "balikcilar_savasti" }
          - metin: { tr: "{npc:elif_sari} rıhtımda bir balıkçının kolunu dikiyor. Seni görünce iğneyi havada tutup başıyla tekneleri gösteriyor. \"Bak,\" diyor yalnızca. \"Bak.\"", en: "{npc:elif_sari} is on the quay stitching up a fisherman's arm. When she sees you she holds the needle up and nods at the boats. \"Look,\" is all she says. \"Look at that.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Mendirek Bekçisi]", en: "[TITLE: Keeper of the Harbor Light]" }
            satirlar:
              - { tr: "Bir limanın ışığını yeniden yaktın. Liman bunu hatırlayacak; Sistem de.", en: "You relit a harbor's light. The harbor will remember. So will the System." }
        secenekler:
          - id: "hastane"
            etiket: { tr: "\"İlk av hastaneye gitsin.\"", en: "\"First catch goes to the hospital.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Mendirekten gelen ilk av Gümrük'teki koğuşa gitti; hastalar o hafta ilk kez doydu.", en: "The first catch off the breakwater went to the ward in the Customs House. The patients ate their fill for the first time that week." }
            sonraki: "@akis"
          - id: "kordon"
            etiket: { tr: "\"Kordon'dan gelenlere de pay ayırın.\"", en: "\"Set some aside for the Esplanade people.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { merhamet: 4, duzen: -1 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Mendireğin balığını tel örgünün dışındakilerle de paylaştırdın; o kış Kordon'dan gelenlerin çocukları ölmedi.", en: "You had the breakwater's fish shared with the people outside the fence, too. That winter, the Esplanade kids didn't die." }
            sonraki: "@akis"
          - id: "cagir"
            etiket: { tr: "\"Bir dahaki işte de beni çağırın.\"", en: "\"Next job, you call me again.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - unvan: "mendirek_bekcisi"
              - xp_seviye: 40
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 5 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Konsey'e bir dahaki sefer de seni çağırmasını söyledin; çağırdı, her seferinde.", en: "You told the Council to call you next time. It did, every time." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ana seni kıskaçlarının arasına alıp suyun altına çekiyor. Bir an her şey yeşil ve sessiz; sonra bir ağ, sonra bir zıpkın, sonra Rıza Reis'in kalın sesi: \"Çekin! Çekin şunu!\"", en: "The mother gets you between her claws and drags you under. For a second everything is green and quiet. Then a net, then a spear, then Skipper Reese's foghorn voice: \"Haul! Haul, damn it!\"" }
          - { tr: "Balıkçılar seni kayalıklara çekiyor. Ana, kabuğunda senin açtığın yarıklarla derine çekiliyor; arkasında yuvayı mazotla yakan adamlar kalıyor. Mendirek temiz ama dalgaların ötesinde hâlâ bir şey bekliyor.", en: "The fishermen drag you up onto the rocks. The mother pulls back into deep water, her shell split where you cracked it, and behind her the men set the nest on fire with diesel. The breakwater's clear. Something's still waiting out past the swell." }
          - metin: { tr: "{npc:elif_sari} rıhtımda kolunu dikerken iğneyi bir an durduruyor. \"Yemek katından beri ilk kez kanadığını görüyorum,\" diyor. \"Neredeyse rahatladım. Neredeyse.\"", en: "{npc:elif_sari} stops the needle for a second while she's stitching your arm on the quay. \"First time I've seen you bleed since the food court,\" she says. \"I'm almost relieved. Almost.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Ağı tutan balıkçılara teşekkür et", en: "Thank the fishermen who held the net" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - xp_seviye: 20
              - ahlak: { insanlik: 3, merhamet: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Mendirekte yenildin ve seni bir ağla kurtaran balıkçılara teşekkür ettin; Liman seni o gün biraz daha çok sevdi.", en: "You lost on the breakwater and thanked the fishermen who netted you out. The Waterfront loved you a little more that day." }
            sonraki: "@akis"
          - id: "tek"
            etiket: { tr: "\"Bir dahakine kimse peşimden gelmesin.\"", en: "\"Next time, nobody follows me down.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_temizlendi"
              - xp_seviye: 20
              - ahlak: { duzen: 2, insanlik: -1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: 2, baglilik: -1 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Seni kurtaranlara bir daha peşinden gelmemelerini söyledin; gelmediler.", en: "You told the people who saved you never to follow you down again. They didn't." }
            sonraki: "@akis"

      - id: "siginak_1_konsey_kacis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mendirekten geri çekiliyorsun. Bir saat sonra rıhtıma üç Lonca kamyonu yanaşıyor; Pala'nın adamları alev püskürtücülerle yuvayı yakıyor, fenerin tepesine de bir Lonca bayrağı asıyorlar.", en: "You pull back off the breakwater. An hour later three Guild trucks roll up to the quay. Cleaver's crew torches the nest with flamethrowers and runs a Guild flag up over the harbor light." }
          - { tr: "Pala, kapkara eldivenlerini çıkarırken sana göz kırpıyor. \"Sen başlattın, biz bitirdik,\" diyor. \"Fatura Konsey'e.\"", en: "Cleaver winks at you as he peels off his scorched gloves. \"You started it, we finished it,\" he says. \"Bill goes to the Council.\"" }
          - metin: { tr: "Akşam {npc:elif_sari} seni {yer:kiyikent_iskele|in} merdivenlerinde buluyor. \"Denedin,\" diyor. \"Bunu tahtaya yazdım. Pala'nın kestiği faturanın yanına.\"", en: "That evening {npc:elif_sari} finds you on the {yer:kiyikent_iskele} steps. \"You tried,\" she says. \"I wrote that on the board. Right next to Cleaver's invoice.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "ode"
            etiket: { tr: "\"Faturayı ben öderim.\"", en: "\"I'll cover the bill.\"" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_loncaya"
              - degisken: { lonca_golgesi: 1 }
              - xp_seviye: 10
              - ahlak: { merhamet: 2, duzen: 1 }
              - kredi: -100
              - iliski: { elif_sari: { guven: 3 } }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Mendireği Lonca bitirdi, faturayı sen ödedin; Konsey borcun kimde olduğunu hep bildi.", en: "The Guild finished the breakwater and you paid the bill. The Council always knew who it really owed." }
            sonraki: "@akis"
          - id: "bayrak"
            etiket: { tr: "Fenerdeki Lonca bayrağını indir", en: "Take the Guild flag down off the light" }
            etkiler:
              - bayrak: "siginak_1_bitti"
              - bayrak: "mendirek_loncaya"
              - degisken: { lonca_golgesi: 2 }
              - xp_seviye: 10
              - ahlak: { duzen: -2, merhamet: 1 }
              - itibar: { siginak: 3, lonca: -4 }
              - tohum: { olay: "elif_konsey_oylamasi", gecikme: { min: 6, max: 14 }, kosul: { npc_hayatta: "elif_sari" } }
            kronik: { tr: "Lonca'nın bayrağını fenerden indirdin; Pala bunu bir hakaret olarak deftere yazdı.", en: "You pulled the Guild's flag off the harbor light. Cleaver wrote that down as an insult." }
            sonraki: "@akis"

  # ================================================================== ELİF 1 — KONSEY OYLAMASI (P2; tohum + havuz)
  - id: "elif_konsey_oylamasi"
    perde: [2]
    gun: { min: 72, max: 175 }
    agirlik: 6
    kosul: { bayrak: "siginak_1_goruldu", bayrak_yok: "elif_oylamasi_bitti" }
    etiketler: ["siginak", "konsey", "npc", "ahlak"]
    gerilim: 2
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Yedinci gişedeki mum", en: "A candle in window seven" }
    sahne: "elif_konsey_oylamasi_1"
    sahneler:
      - id: "elif_konsey_oylamasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yedinci gişenin camının ardında bir mum yanıyor. İhtiyar hâkim dün gece orada, kalkış panosuna bakarken ölmüş; kalbi için ilaç yokmuş, olsaydı da başkasına verirdi.", en: "There's a candle burning behind the glass of window seven. The old judge died there last night, looking up at the departures board. There was no medicine for her heart, and if there had been, she'd have given it to someone else." }
          - { tr: "Salon gece yarısı dolu. Konsey'in bir başkana ihtiyacı var, çünkü {fraksiyon:lonca} tek bir muhatap istiyor ve dokuz bin kişi yedi gişeye aynı anda bağıramaz. Panonun altına birisi kalın harflerle Rıza Reis'in önerisini yazmış: SEVİYE KARNESİ. Savaşan önce yer, sonra bakılan, en son bekleyen.", en: "The hall is packed at midnight. The Council needs a chair, because the {fraksiyon:lonca} wants one person to deal with, and nine thousand people can't yell at seven windows at once. Under the board, somebody has written Skipper Reese's proposal in block capitals: LEVEL RATIONS. Fighters eat first, then the cared-for, and whoever's left waits." }
          - { tr: "Herkes dördüncü gişeye bakıyor. {npc:elif_sari} başını iki yana sallıyor. \"Ben hekimim,\" diyor mikrofona. \"Hekimler karar vermez; karar verilenlere bakar. Bunu daha önce de söyledim.\"", en: "Everybody's looking at window four. {npc:elif_sari} shakes her head. \"I'm a doctor,\" she says into the mic. \"Doctors don't decide. We take care of whoever got decided about. I've said that before.\"" }
          - metin: { tr: "Söylemişti. Yemek katında, bir ısırık yüzünden, beyaz tahtanın önünde. Sen oradaydın.", en: "She had. In the food court, over a bite wound, in front of a whiteboard. You were there." }
            kosul: { bayrak: "karantina_oylandi" }
          - metin: { tr: "Bir de kimsenin yüksek sesle söylemediği üçüncü bir aday var. Salonun yarısı sana bakıyor.", en: "And there's a third candidate nobody's saying out loud. Half the hall is looking at you." }
            kosul: { bayrak_yok: "siginak_1_red" }
        sezgiler:
          - kosul: { stat: { cha: 40 } }
            metin: { tr: "Salonun oyu ikiye bölünmüş: korkanlar Reis'e, yorgunlar hekime. Korkanlar daha çok. Ama yorgunlar daha yüksek sesli.", en: "The hall's split in two: the scared ones for the Skipper, the tired ones for the doctor. There are more scared ones. But the tired ones are louder." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni seçecekler. sen istemesen de. tek soru, istediğinde ne olacağı.", en: "t̷hey'll pick you. even if you don't want it. the only question is what happens when you do." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Seviyeye göre karne mi? Bu bir algoritma değil, bir sınıf sistemi. Nereden mi biliyorum? Ben o algoritmaları yazardım.\"", en: "\"Rations by level? That's not an algorithm, that's a caste system. You know how I know? I used to write those algorithms.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Benim seviyem düşük. Kardeşiminki daha da düşüktü. Biz en son yerdik, değil mi?\"", en: "\"My level's low. My sister's was lower. We'd eat last, wouldn't we?\"" }
        secenekler:
          - id: "elif_aday"
            etiket: { tr: "{npc:elif_sari|i} çatıya çek: \"Aday sen ol.\"", en: "Pull {npc:elif_sari} up to the roof: \"You run.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Konsey'in en zor gecesinde bir hekimi çatıya çıkarıp aday olmasını istedin.", en: "On the Council's hardest night, you took a doctor up on the roof and asked her to run." }
            sonraki: "elif_konsey_oylamasi_ikna"
          - id: "karne"
            etiket: { tr: "Kürsüye çık; karneye karşı konuş", en: "Take the floor. Speak against the rations" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Seviye karnesine karşı salonun ortasında konuştun.", en: "You stood up in the middle of the hall and spoke against level rations." }
            sonraki: "elif_konsey_oylamasi_karne"
          - id: "koltuk"
            etiket: { tr: "\"Koltuğu ben alırım.\"", en: "\"I'll take the chair.\"" }
            goster: { bayrak_yok: "siginak_1_red" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 2, korku: 2 } }
            kronik: { tr: "Konsey'in boş koltuğuna, kimse sormadan, kendin oturdun.", en: "Nobody asked. You sat down in the Council's empty chair anyway." }
            sonraki: "elif_konsey_oylamasi_koltuk"
          - id: "riza"
            etiket: { tr: "\"Karne mantıklı. Savaşan önce yer.\"", en: "\"The rations make sense. Fighters eat first.\"" }
            etkiler:
              - bayrak: "seviye_karnesi"
              - bayrak: "riza_konsey_basi"
              - ahlak: { duzen: 4, merhamet: -5 }
              - itibar: { siginak: -2, lonca: 4 }
              - iliski: { elif_sari: { guven: -6, saygi: -2 } }
            kronik: { tr: "Seviye karnesini destekledin; Liman'da tabaklar o günden sonra seviyeye göre doldu.", en: "You backed level rations. On the Waterfront, plates got filled by level from then on." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "donus"
            etiket: { tr: "\"Mendirek teklifi hâlâ tahtada mı?\"", en: "\"Is the breakwater offer still on the board?\"" }
            goster: { bayrak: "siginak_1_red" }
            etkiler:
              - gorev: { zincir_siginak: "basla" }
              - bayrak: "siginak_1_bitti"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 5, baglilik: 3 } }
            kronik: { tr: "Bir kez reddettiğin Konsey'e geri döndün; hekim tahtadaki adını silmemişti.", en: "You came back to the Council you'd turned down once. The doctor never erased your name from the board." }
            sonraki: "elif_konsey_oylamasi_donus"

      - id: "elif_konsey_oylamasi_donus"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} gişeden çıkıp tahtanın köşesini gösteriyor. Adın orada, solmuş ama silinmemiş; altına biri, belki de o, küçük bir soru işareti koymuş.", en: "{npc:elif_sari} steps out of the booth and points at the corner of the whiteboard. Your name's there, faded but never erased, and somebody, maybe her, put a small question mark under it." }
          - { tr: "\"Mendirek artık Lonca'nın,\" diyor. \"Ama Konsey'in hâlâ bir kalkana ihtiyacı var. Bu gece de bir başkana.\" Soru işaretini parmağıyla siliyor.", en: "\"The breakwater's the Guild's now,\" she says. \"But the Council still needs a shield. And tonight it needs a chair.\" She wipes the question mark off with her thumb." }
        secenekler:
          - id: "aday"
            etiket: { tr: "\"O zaman başkan sen ol.\"", en: "\"Then you be the chair.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Konsey'e döndüğün gece hekimden aday olmasını istedin.", en: "The night you came back to the Council, you asked the doctor to run." }
            sonraki: "elif_konsey_oylamasi_ikna"
          - id: "kursu"
            etiket: { tr: "Kürsüye çık; karneye karşı konuş", en: "Take the floor. Speak against the rations" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Konsey'e döner dönmez seviye karnesine karşı konuştun.", en: "The minute you came back to the Council, you spoke against level rations." }
            sonraki: "elif_konsey_oylamasi_karne"

      - id: "elif_konsey_oylamasi_ikna"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} çatısında rüzgâr tuz taşıyor. {npc:elif_sari} parmaklığa yaslanıp cebinden bir paket kurabiye çıkarıyor, birini sana uzatıyor, sonra vazgeçip kendisi yiyor.", en: "Up on the {yer:kiyikent_iskele} roof, the wind tastes like salt. {npc:elif_sari} leans on the railing and pulls a pack of cookies out of her pocket. She holds one out to you, changes her mind, and eats it herself." }
          - { tr: "\"Başkan, siyah bandı kime yapıştıracağına karar veren kişidir,\" diyor. \"Ben yapıştırıyorum zaten, her gün. Ama bunu bir yatağın başında yapıyorum; bir gişenin ardından değil. Bir gişenin ardından yaparsam alışırım.\"", en: "\"The chair is the person who decides who gets the black tape,\" she says. \"I already do that. Every day. But I do it at a bedside, not from behind a ticket window. If I start doing it from behind a window, I'll get used to it.\"" }
          - { tr: "Aşağıda, rıhtımda bir tekne motorunu kapatıyor. \"Alışırsam da,\" diyor, \"artık iyi bir hekim olamam. Kimsenin işine yaramam.\"", en: "Down on the quay, a boat cuts its engine. \"And if I get used to it,\" she says, \"I'm not a good doctor anymore. I'm no use to anybody.\"" }
        sezgiler:
          - kosul: { stat: { wis: 50 } }
            metin: { tr: "Korktuğu şey koltuk değil. Koltukta kim olacağını çoktan bilmesi.", en: "It's not the chair she's scared of. It's that she already knows who she'd be in it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷yi insanlar koltuktan korkar. kötüler korkmaz. bu yüzden koltuklar genelde kötülerde kalır.", en: "g̷ood people are afraid of chairs. bad people aren't. that's why chairs usually end up with the bad ones." }
        secenekler:
          - id: "kural"
            etiket: { tr: "\"Bari herkes için aynı kuralla yapıştır.\"", en: "\"Then at least do it by the same rule for everyone.\"" }
            gerekli: { iliski_min: { elif_sari: { guven: 15 } } }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { duzen: 4, merhamet: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, guven: 4 } }
            kronik: { tr: "Hekimi, siyah bandı herkese aynı kuralla vermesi için Konsey'in başına geçirdin.", en: "You put the doctor at the head of the Council so the black tape would go by one rule for everyone." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "arkanda"
            etiket: { tr: "\"Aday ol. Ben her gece arkanda dururum.\"", en: "\"Run. I'll be at your back every night.\"" }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { baglilik: 8, guven: 5 } }
              - hafiza: { npc: "elif_sari", id: "olay:elif_konsey_oylamasi", agirlik: 30 }
            kronik: { tr: "Hekime her gece arkasında duracağına söz verdin; o da bu sözle Konsey'in başına geçti.", en: "You promised the doctor you'd be at her back every night. On that promise, she took the Council's chair." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "isaret"
            tur: "aciga_vur"
            etiket: { tr: "Ona Sistem'in sana gösterdiklerini anlat", en: "Tell her what the System shows you" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - bayrak: "elif_konsey_basi"
              - dikkat: 3
              - ahlak: { insanlik: 3, duzen: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 8, korku: 3 } }
            kronik: { tr: "Hekime gözlerinin ne gördüğünü anlattın; o da gerçeği gören tek kişi olmayacağını bildiği için Konsey'e başkan oldu.", en: "You told the doctor what your eyes see. She took the chair because she knew she wouldn't be the only one seeing clearly." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "zorlama"
            etiket: { tr: "\"Peki. Zorlamayacağım.\"", en: "\"Okay. I won't push.\"" }
            etkiler:
              - bayrak: "riza_konsey_basi"
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { elif_sari: { guven: 3, baglilik: 2 } }
            kronik: { tr: "Hekimi koltuğa zorlamadın; Konsey'in başına ihtiyar kaptan geçti.", en: "You didn't push the doctor into the chair. The old skipper took it instead." }
            sonraki: "elif_konsey_oylamasi_karne"

      - id: "elif_konsey_oylamasi_karne"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kürsü dediğin, ters çevrilmiş bir bavul arabası. Üstüne çıktığında salonun gürültüsü bir anda kesiliyor; dokuz bin kişi değil belki ama dokuz yüz kişi sana bakıyor.", en: "The \"floor\" turns out to be an overturned luggage cart. When you climb up, the noise in the hall cuts off. Maybe not nine thousand people, but nine hundred are looking at you." }
          - { tr: "Rıza Reis kollarını kavuşturuyor. \"Söyle bakalım,\" diyor. \"Savaşanlar aç kalırsa bu salonu kim koruyacak? Sen mi? Tek başına?\"", en: "Skipper Reese folds his arms. \"Go on, then,\" he says. \"If the fighters go hungry, who protects this hall? You? All by yourself?\"" }
        sezgiler:
          - kosul: { stat: { cha: 50 } }
            metin: { tr: "Salonun arkasında bir kadın kucağındaki bebeği sallıyor. Karne geçerse o bebek, savaşamayacağı için, en son yiyecek.", en: "In the back of the hall a woman's rocking a baby. If the rations pass, that baby eats last, because it can't fight." }
        secenekler:
          - id: "salon"
            tur: "gosteris"
            etiket: { tr: "Salonu tek bir konuşmayla çevir", en: "Turn the whole room with one speech" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - dikkat: 2
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { saygi: 6, baglilik: 3 } }
            kronik: { tr: "Bir bavul arabasının üstünden yaptığın konuşma karneyi düşürdü ve salon hekimi başkan diye alkışladı.", en: "The speech you gave from the top of a luggage cart killed the rations, and the hall cheered the doctor in as chair." }
            sonraki: "elif_konsey_oylamasi_salon"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni söyle: \"Karneyle ilk ben doyarım.\"", en: "Say your real level: \"With rations, I eat first.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4, korku: 2 } }
            kronik: { tr: "Gerçek seviyeni salona söyleyip seviye karnesinin ilk kimi doyuracağını gösterdin; karne o gece öldü.", en: "You told the hall your real level and showed them who level rations would feed first. The rations died that night." }
            sonraki: "elif_konsey_oylamasi_koltuk"
          - id: "cizelge"
            etiket: { tr: "\"Karne değil, çizelge: herkes nöbet tutar, herkes yer.\"", en: "\"Not rations. A roster: everybody stands watch, everybody eats.\"" }
            etkiler:
              - bayrak: "riza_konsey_basi"
              - bayrak: "nobet_cizelgesi"
              - ahlak: { duzen: 3, merhamet: 3 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 3, saygi: 3 } }
            kronik: { tr: "Seviye karnesinin yerine bir nöbet çizelgesi koydurdun; Liman'da herkes nöbet tuttu ve herkes yedi.", en: "You swapped level rations for a watch roster. On the Waterfront, everybody stood watch and everybody ate." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_salon"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Ne söylediğini sonra hatırlamıyorsun; yalnızca salonun sesini hatırlıyorsun. Önce bir kadın, sonra arkadaki gençler, sonra herkes dördüncü gişeye dönüp bir isim söylemeye başlıyor.", en: "Afterward you can't remember what you said. You only remember the sound of the room. First one woman, then the kids in the back, then everybody turns toward window four and starts saying a name." }
          - { tr: "{npc:elif_sari} camın ardında donup kalmış. Sonra mikrofona eğiliyor, bir şey söyleyecekmiş gibi; söylemiyor. Yalnızca başını sallıyor, bir hastaya 'tamam, yapacağız' der gibi.", en: "{npc:elif_sari} is frozen behind the glass. Then she leans into the mic like she's going to say something, and doesn't. She just nods, the way she'd nod to a patient: okay. We'll do it." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Bavul arabasından in ve geri çekil", en: "Climb down off the cart and step back" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Salonu kazandıktan sonra sahneyi hekime bıraktın.", en: "Once you'd won the room, you left the stage to the doctor." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "el"
            etiket: { tr: "Gişeye yürü ve ona elini uzat", en: "Walk to her window and offer her your hand" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Yeni başkanı gişesinden elinden tutup çıkardın; salon bunu bir film sahnesi gibi hatırladı.", en: "You took the new chair by the hand and walked her out of her booth. The hall remembered it like a scene from a movie." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_koltuk"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yedinci gişenin kapısını açıp içeri giriyorsun. Mumu kenara çekiyorsun; hâkimin gözlüğü hâlâ tezgâhın üstünde, katlanmış.", en: "You open the door to window seven and step inside. You move the candle aside. The judge's glasses are still on the counter, folded." }
          - { tr: "Salon sessiz. Bu sessizlik onay mı korku mu, camın bu tarafından ayırt edilmiyor.", en: "The hall is silent. From this side of the glass, you can't tell whether that silence is approval or fear." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[YETKİ DEVRİ · Liman Konseyi]", en: "[AUTHORITY TRANSFER · Waterfront Council]" }
            satirlar:
              - { tr: "Topluluk lideri atandı. Onay oranı: %71. Korku kaynaklı onay: hesaplanmadı.", en: "Community leader assigned. Approval: 71%. Approval due to fear: not calculated." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ak, koltuk sıcak. hâkim daha soğumadı. sen ondan daha uzun oturacaksın.", en: "l̷ook, the chair's still warm. the judge hasn't even gone cold. you'll sit here longer than she did." }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "{npc:elif_sari} gülümsüyor ama eli tezgâhın altında beyaz tahta kalemini sıkıyor.", en: "{npc:elif_sari} is smiling, but under the counter her hand's squeezing the whiteboard marker." }
        secenekler:
          - id: "yardimci"
            etiket: { tr: "\"{npc:elif_sari} yardımcım. Oyu benimkinden önce sayılır.\"", en: "\"{npc:elif_sari} is my deputy. Her vote counts first.\"" }
            etkiler:
              - bayrak: "oyuncu_konsey_koltugu"
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 4 } }
            kronik: { tr: "Konsey'in başına geçtin ama hekimin oyunu kendi oyunun önüne koydun.", en: "You took the Council's chair, but you put the doctor's vote ahead of your own." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "danisma"
            etiket: { tr: "\"Kararları ben veririm. Oylar danışma içindir.\"", en: "\"I make the decisions. The votes are advisory.\"" }
            etkiler:
              - bayrak: "oyuncu_konsey_koltugu"
              - bayrak: "konsey_danisma"
              - ahlak: { duzen: 6, merhamet: -2, insanlik: -3 }
              - itibar: { siginak: -3, lonca: 3 }
              - iliski: { elif_sari: { guven: -8, korku: 5 } }
            kronik: { tr: "Konsey'in oylarını 'danışma' diye bir kenara koydun; Liman o günden sonra oy vermeyi bıraktı ve beklemeye başladı.", en: "You filed the Council's votes under \"advisory.\" After that the Waterfront stopped voting and started waiting." }
            sonraki: "elif_konsey_oylamasi_son"
          - id: "devret"
            etiket: { tr: "Koltuğu ona bırak: \"Ben kapıda dururum.\"", en: "Give her the chair: \"I'll stand at the door.\"" }
            etkiler:
              - bayrak: "elif_konsey_basi"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, saygi: 5 } }
            kronik: { tr: "Konsey'in koltuğuna oturdun, sonra kalkıp hekime bıraktın ve kapıda durdun.", en: "You sat in the Council's chair, then got up, handed it to the doctor, and went to stand at the door." }
            sonraki: "elif_konsey_oylamasi_son"

      - id: "elif_konsey_oylamasi_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - metin: { tr: "Sabaha karşı tahtanın en üstünde, KONSEY yazısının hemen altında, yeni bir satır var: BAŞKAN ve yanında {npc:elif_sari|in} adı, kendi el yazısıyla değil, bir başkasınınkiyle. Kendi adını yazmaya eli gitmemiş.", en: "Toward morning there's a new line at the top of the whiteboard, right under COUNCIL: CHAIR, and next to it, {npc:elif_sari|pos} name. Not in her handwriting. Someone else's. She couldn't bring herself to write it." }
            kosul: { bayrak: "elif_konsey_basi" }
          - metin: { tr: "Yedinci gişenin camının ardında artık sen oturuyorsun. Panoyu çeviren çocuk her sabah önce sana bakıyor, sonra harflere.", en: "You're the one behind the glass of window seven now. The kid who flips the board looks at you first every morning, then at the letters." }
            kosul: { bayrak: "oyuncu_konsey_koltugu" }
          - metin: { tr: "Rıza Reis yedinci gişeye taşınıyor ve hâkimin mumunu söndürmüyor; yanına kendi kaptan şapkasını koyuyor.", en: "Skipper Reese moves into window seven. He doesn't blow out the judge's candle. He sets his captain's cap down next to it." }
            kosul: { bayrak: "riza_konsey_basi" }
          - metin: { tr: "Ertesi gün Liman'da ilk karneler dağıtılıyor: kartonun üstüne basılmış bir rakam, bir de tabak. Kuyruklar seviyeye göre diziliyor ve en arkada çocuklar bekliyor.", en: "The next day the first ration cards go out on the Waterfront: a number stamped on cardboard, and a plate. The lines sort themselves by level, and the kids wait at the very back." }
            kosul: { bayrak: "seviye_karnesi" }
          - { tr: "{npc:elif_sari} gün doğarken çatıya çıkıyor ve uzun süre limana bakıyor. Sonra aşağı iniyor, çünkü Gümrük'teki koğuşta sabah vizitesi var ve vizite kimseyi beklemez.", en: "At sunrise {npc:elif_sari} goes up on the roof and looks out at the harbor for a long time. Then she comes back down, because there are morning rounds on the ward in the Customs House and rounds don't wait for anybody." }
        secenekler:
          - id: "vizite"
            etiket: { tr: "Onunla sabah vizitesine git", en: "Go on morning rounds with her" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 5, guven: 3 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 20 }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Konsey'in en uzun gecesinin sabahında hekimle birlikte koğuşu dolaştın.", en: "On the morning after the Council's longest night, you walked the ward with the doctor." }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "\"Bir saat uyu. Koğuş bir saat bekler.\"", en: "\"Sleep an hour. The ward can wait an hour.\"" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { merhamet: 2, insanlik: 3 }
              - iliski: { elif_sari: { guven: 4, baglilik: 2 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Bütün Liman adına karar veren bir kadına bir saat uyumasını söyledin; uyumadı ama söylediğini hatırladı.", en: "You told a woman who was making decisions for the whole Waterfront to sleep for an hour. She didn't, but she remembered you said it." }
            sonraki: "@akis"
          - id: "is"
            etiket: { tr: "\"Konsey'in bir sonraki işi neyse, bana yaz.\"", en: "\"Whatever the Council's next job is, put me down.\"" }
            etkiler:
              - bayrak: "elif_oylamasi_bitti"
              - xp_seviye: 20
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 45, max: 75 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Konsey'in her işine adını önceden yazdırdın.", en: "You put your name down for every job the Council had, in advance." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 2 — SU SAVAŞLARI (P2, AY 122)
  - id: "siginak_2_su_savaslari"
    perde: [2]
    gun: { min: 100, max: 170 }
    ana_yay: { gun: 122 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_1_bitti" }
    etiketler: ["siginak", "zincir", "su", "lonca"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Su iki gün", en: "Two days of water" }
    sahne: "siginak_2_su_1"
    sahneler:
      - id: "siginak_2_su_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Ağustos sıcağı Liman'ın üstüne bir kapak gibi oturmuş. {yer:kiyikent_iskele|in} önünde boş bidonlarla bir kuyruk var; kuyruk rıhtım boyunca uzayıp balık halinin arkasında kayboluyor.", en: "The heat wave has settled over the Waterfront like a lid, a hundred and four in the shade. There's a line of people with empty jerry cans outside the {yer:kiyikent_iskele}, and it runs the length of the quay and disappears behind the fish market." }
          - { tr: "Kalkış panosunda tek satır kırmızıya boyanmış: SU 2 GÜN. Tuzla mavnası, Liman'ın deniz suyunu içilir hâle getiren eski arıtma gemisi, üç gün önce zarlarını patlatıp susmuş.", en: "One line on the departures board has been painted red: WATER 2 DAYS. The Saltwater barge, the old desalination rig that kept the Waterfront drinking, blew its membranes three days ago and went quiet." }
          - { tr: "Şehirde temiz su veren tek yer {yer:sanayi} ile {yer:eski_sehir} arasındaki Pınarbaşı pompa istasyonu ve orayı {fraksiyon:lonca} tutuyor. Kapısına bir turnike koymuşlar: seviyen kaçsa, o kadar litre.", en: "The only clean water left in the city comes out of the Pinewell pumping station between {yer:sanayi} and {yer:eski_sehir}, and the {fraksiyon:lonca} is holding it. They've put a turnstile on the gate: whatever your level is, that's how many liters you get." }
          - metin: { tr: "\"Lonca'yla konuşabilirsin, savaşabilirsin ya da bir mucize bulabilirsin,\" diyor {npc:elif_sari}, Konsey başkanının gişesinden. \"Hangisini seçersen seç, yarın akşama kadar seç.\"", en: "\"You can talk to the Guild, fight the Guild, or find a miracle,\" {npc:elif_sari} says from the chair's window. \"Pick whichever you want. Just pick by tomorrow night.\"" }
            kosul: { bayrak: "elif_konsey_basi" }
          - metin: { tr: "\"Lonca'yla konuşursun, savaşırsın ya da bir mucize bulursun,\" diyor Rıza Reis yedinci gişeden. \"Ben olsam konuşurdum. Ama sen ben değilsin, değil mi?\"", en: "\"Talk to the Guild, fight the Guild, or find a miracle,\" Skipper Reese says from window seven. \"I'd talk, if it was me. But you're not me, are you?\"" }
            kosul: { bayrak_yok: ["elif_konsey_basi", "oyuncu_konsey_koltugu"] }
          - metin: { tr: "Konsey'in gözleri yedinci gişeye, sana dönüyor. Karar senin; kuyruk da.", en: "The Council's eyes go to window seven. To you. The decision's yours. So is the line." }
            kosul: { bayrak: "oyuncu_konsey_koltugu" }
        sezgiler:
          - kosul: { stat: { per: 55 } }
            metin: { tr: "Kuyruktaki bidonların yarısı aslında dolu. Liman'da birileri suyu saklıyor; korkudan, satmak için ya da ikisi için birden.", en: "Half the jerry cans in that line are actually full. Somebody on the Waterfront is hoarding, out of fear, to sell, or both." }
          - kosul: { stat: { per: 55 } }
            metin: { tr: "Eski Şehir'in altında, sokakların değil taşların altında, su sesi var. Çok su. Durgun, eski, karanlık.", en: "Under Old Town, under the stones and not the streets, you can hear water. A lot of it. Still, old, and dark." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷avnanın zarlarının bir eşya penceresi var. sistem ona 'bozuk' yazmış. ben 'bozuk' kelimesini çok iyi bilirim.", en: "t̷he barge's membranes have an item window. the System wrote \"broken\" on it. i know the word \"broken\" very well." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sıcak çarpması, böbrek yetmezliği, sonra kolera. Sırası hep aynıdır. Bir haftamız yok; iki günümüz var.\"", en: "\"Heatstroke, kidney failure, then cholera. Always in that order. We don't have a week. We have two days.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Seviyeye göre litre. Tabii. Kıyametten sonraki ilk sınıf sistemi hep musluktan çıkar.\"", en: "\"Liters by level. Of course. The first caste system after the apocalypse always comes out of the tap.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Pınarbaşı'na git ve Lonca'yla konuş", en: "Go to Pinewell and talk to the Guild" }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { elif_sari: { saygi: 2 } }
            kronik: { tr: "Su savaşlarına önce bir masayla girdin.", en: "You walked into the water wars with a table first." }
            sonraki: "siginak_2_su_istasyon"
          - id: "bas"
            etiket: { tr: "\"İstasyonu basarız. Su herkesindir.\"", en: "\"We hit the station. Water belongs to everyone.\"" }
            etkiler:
              - bolge: "sanayi"
              - ahlak: { duzen: -4, merhamet: 2 }
              - iliski: { elif_sari: { korku: 2, guven: -1 } }
            kronik: { tr: "Suyun herkesin olduğunu söyleyip Lonca'nın istasyonuna yürüdün.", en: "You said water belongs to everyone, then marched on the Guild's station." }
            sonraki: "siginak_2_su_baskin"
          - id: "sarnic"
            etiket: { tr: "\"Eski Şehir'in altında su var. Duyuyorum.\"", en: "\"There's water under Old Town. I can hear it.\"" }
            gerekli: { stat: { per: 55 } }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Kimsenin duymadığı bir suyun sesini duyup şehrin altına indin.", en: "You heard water nobody else could hear and went down under the city after it." }
            sonraki: "siginak_2_su_sarnic"
          - id: "tuzla"
            tur: "gosteris"
            etiket: { tr: "Tuzla mavnasını Sistem gücüyle onar", en: "Fix the Saltwater barge with System power" }
            gerekli: { stat: { int: 60 } }
            etkiler:
              - dikkat: 5
              - ahlak: { merhamet: 3, insanlik: -2 }
              - iliski: { elif_sari: { saygi: 6, korku: 3 } }
            kronik: { tr: "Ölü bir arıtma gemisini ellerinle yeniden çalıştırdın.", en: "You brought a dead desalination barge back to life with your bare hands." }
            sonraki: "siginak_2_su_tuzla"
          - id: "karne"
            etiket: { tr: "\"Karne koyun: su önce savaşanlara.\"", en: "\"Ration it. Water goes to the fighters first.\"" }
            etkiler:
              - bayrak: "su_karnesi"
              - bolge: "sanayi"
              - ahlak: { duzen: 4, merhamet: -5 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { elif_sari: { guven: -5 } }
            kronik: { tr: "Liman'ın son iki günlük suyunu seviyeye göre paylaştırdın; o hafta en çok yaşlılar öldü.", en: "You had the Waterfront's last two days of water handed out by level. The old folks died the most that week." }
            sonraki: "siginak_2_su_istasyon"

      - id: "siginak_2_su_istasyon"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pınarbaşı'nın beton kulübesinin önünde bir metro turnikesi duruyor; kim bilir hangi istasyondan söküp getirmişler. Turnikenin üstündeki ekran, geçenin seviyesini okuyup litre yazıyor: 12 SV · 6 L.", en: "There's a subway turnstile planted in front of the Pinewell pump house. God knows which station they tore it out of. The screen on top reads whoever walks through and spits out liters: LV 12 · 6 L." }
          - { tr: "Turnikenin yanında, deri önlüklü, iri, sakin bir adam bir taburede oturuyor: Pala. Elindeki balık bıçağıyla tırnaklarını temizliyor.", en: "Next to the turnstile, a big, calm man in a leather apron sits on a stool. That's Cleaver. He's cleaning his nails with a fish knife." }
          - metin: { tr: "Pompa kulübesinin kapısında {npc:kaya_demir} beliriyor, kollarını kavuşturmuş. \"Suyu veririm,\" diyor. \"Karşılığında Liman'ın rıhtımına adam koyarım. Su karşılığı duvar. Adil.\"", en: "{npc:kaya_demir} appears in the doorway of the pump house, arms folded. \"I'll give you the water,\" he says. \"In exchange, I put my people on the Waterfront docks. Water for walls. That's fair.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "\"Patronun şartı belli,\" diyor Pala, bıçağını önlüğüne silerek. \"Su karşılığı duvar. Liman'ın rıhtımına bizim adamlar.\"", en: "\"The boss has terms,\" Cleaver says, wiping the knife on his apron. \"Water for walls. Our boys on the Waterfront docks.\"" }
            kosul: { npc_olu: "kaya_demir" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Turnikenin ekranı oynanmış. Lonca'nın adamları geçtiğinde seviye iki katı yazıyor.", en: "The turnstile's been rigged. When Guild people walk through, it reads double." }
          - kosul: { bayrak: "lonca_sozlesmesi_yirtildi" }
            anlati: true
            metin: { tr: "Pala seni görünce önlüğünün cebine dokunuyor. Orada, katlanmış, yırtılmış bir sözleşmenin parçaları duruyor.", en: "When Cleaver sees you, he touches his apron pocket. The pieces of a torn-up contract are in there, folded." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "t̷urnike seni okursa ekranı patlar. ya da patlamaz ve yalan söyler. ikisi de eğlenceli olur.", en: "i̷f that turnstile reads you, the screen pops. or it doesn't, and it lies. both would be fun." }
        secenekler:
          - id: "duvar"
            etiket: { tr: "Şartı kabul et: su karşılığı duvar", en: "Take the deal: water for walls" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { lonca: 8, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
            kronik: { tr: "Liman'ın suyunu Lonca'nın duvarlarıyla takas ettin; rıhtımda o günden sonra hep Lonca bantları dolaştı.", en: "You traded the Waterfront's water for the Guild's walls. Guild armbands walked the docks every day after that." }
            sonraki: "siginak_2_su_son"
          - id: "borc"
            etiket: { tr: "\"{npc:kaya_demir}, bana bir borcun var.\"", en: "\"{npc:kaya_demir}, you owe me one.\"" }
            goster: { npc_hayatta: "kaya_demir" }
            gerekli: { iliski_min: { kaya_demir: { saygi: 25 } } }
            etkiler:
              - bayrak: "su_paylasildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
              - iliski: { kaya_demir: { saygi: -2, guven: 2 } }
            kronik: { tr: "{npc:kaya_demir|in} sana olan borcunu Liman'ın suyuyla tahsil ettin.", en: "You collected on {npc:kaya_demir|pos} debt to you in the Waterfront's water." }
            sonraki: "siginak_2_su_son"
          - id: "turnike"
            tur: "gosteris"
            etiket: { tr: "Turnikeyi yerinden sök, Pala'nın önüne at", en: "Rip the turnstile out and drop it at Cleaver's feet" }
            gerekli: { stat: { str: 70 } }
            etkiler:
              - bayrak: "su_paylasildi"
              - bayrak: "pala_kini"
              - dikkat: 4
              - degisken: { hayatta_kalan: 3, lonca_golgesi: 1 }
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { lonca: -6, siginak: 6 }
              - iliski: { kaya_demir: { saygi: 5, guven: -3 } }
            kronik: { tr: "Pınarbaşı'nın turnikesini söküp Pala'nın ayaklarının dibine attın; su bedava aktı, Pala ise o günü hiç unutmadı.", en: "You tore Pinewell's turnstile out of the concrete and dropped it at Cleaver's feet. The water ran free. Cleaver never forgot that day." }
            sonraki: "siginak_2_su_son"
          - id: "baska_yol"
            etiket: { tr: "\"Başka bir yol bulacağım.\"", en: "\"I'll find another way.\"" }
            gerekli: { stat: { per: 55 } }
            etkiler:
              - bolge: "eski_sehir"
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { lonca: -2 }
            kronik: { tr: "Lonca'nın masasından kalkıp şehrin altındaki suya gittin.", en: "You got up from the Guild's table and went after the water under the city." }
            sonraki: "siginak_2_su_sarnic"
          - id: "saldir"
            etiket: { tr: "Pazarlık bitti; istasyonu al", en: "Done haggling. Take the station" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 1 }
              - itibar: { lonca: -4 }
            kronik: { tr: "Lonca'nın masasını devirip istasyona saldırdın.", en: "You flipped the Guild's table and went for the station." }
            sonraki: "siginak_2_su_baskin"

      - id: "siginak_2_su_baskin"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pınarbaşı'nın tel örgüsüne vardığında Lonca'nın tahsildarları zaten bekliyor; biri sana haber uçurmuş. Ellerinde kepenk demirinden kalkanlar, çivili sopalar, bir de kaynak makinesinden bozma bir alev tüpü var.", en: "By the time you hit the Pinewell fence, the Guild's collectors are already waiting. Somebody tipped them off. They've got shields cut out of storefront shutters, nail bats, and a flamethrower hacked together from a welding rig." }
          - { tr: "Pala bir adım geride, taburesinde. \"Öldürme onları,\" diyor sakin sakin, sanki sana bir iyilik yapıyormuş gibi. \"Patron öldüklerini duyarsa savaş olur. Sen savaş istemiyorsun. Sen su istiyorsun.\"", en: "Cleaver hangs back on his stool. \"Don't kill 'em,\" he says, nice and calm, like he's doing you a favor. \"If the boss hears they're dead, it's war. You don't want war. You want water.\"" }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Tahsildarların ikisi on dokuz yaşında bile değil. Alev tüpünün vanası sızdırıyor.", en: "Two of those collectors aren't even nineteen. The flamethrower's valve is leaking." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kemiklerini kır ama kimseyi öldürme", en: "Break bones. Kill nobody" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["lonca_tahsildari@oyuncu-2", "lonca_tahsildari@oyuncu-2", "lonca_tahsildari@oyuncu-3"], ortam: ["yanici"], kazan: "siginak_2_su_baskin_zafer", kaybet: "siginak_2_su_baskin_yenilgi", kac: "siginak_2_su_baskin_yenilgi" }
            kronik: { tr: "Pınarbaşı'nı aldın ve kimseyi öldürmedin; Lonca kırık kemikleri yine de bir savaş ilanı gibi saydı.", en: "You took Pinewell and killed nobody. The Guild still counted the broken bones like a declaration of war." }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Tek bir bakışla silahlarını bıraktır", en: "Make them drop their weapons with one look" }
            gerekli: { stat: { wil: 70 } }
            etkiler:
              - dikkat: 5
              - ahlak: { merhamet: 2, insanlik: -2 }
              - itibar: { lonca: -4, siginak: 2 }
            kronik: { tr: "Lonca'nın tahsildarları sana bakıp silahlarını bıraktı; Pala o gün korkmayı öğrendi ve bunu sana ödetmeye yemin etti.", en: "The Guild's collectors took one look at you and dropped their weapons. Cleaver learned how to be afraid that day, and swore you'd pay for teaching him." }
            sonraki: "siginak_2_su_baskin_zafer"
          - id: "geri"
            etiket: { tr: "Geri çekil; Lonca'nın şartını dinle", en: "Back off. Hear out the Guild's terms" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "Pınarbaşı'nın kapısından geri dönüp Lonca'nın şartını dinledin.", en: "You turned around at the Pinewell gate and listened to the Guild's terms." }
            sonraki: "siginak_2_su_istasyon"

      - id: "siginak_2_su_baskin_zafer"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tahsildarlar inleyerek yerde. Pala taburesinden kalkmıyor; yalnızca balık bıçağını kınına sokuyor ve kulübenin anahtarını sana fırlatıyor.", en: "The collectors are groaning on the ground. Cleaver doesn't get up off his stool. He just slides the fish knife into its sheath and tosses you the pump house key." }
          - { tr: "\"Suyunu al,\" diyor. \"Faturayı sonra keseriz. Biz her şeyin faturasını keseriz, sen de bunu biliyorsun.\"", en: "\"Take your water,\" he says. \"We'll send the bill later. We send a bill for everything, and you know it.\"" }
        secenekler:
          - id: "ac"
            etiket: { tr: "Vanaları aç; su herkesin", en: "Open the valves. The water's everyone's" }
            etkiler:
              - bayrak: "su_istasyonu_basildi"
              - bayrak: "pala_kini"
              - degisken: { hayatta_kalan: 3, lonca_golgesi: 1 }
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { lonca: -10, siginak: 6 }
            kronik: { tr: "Pınarbaşı'nın vanalarını herkese açtın; Lonca o suya bir daha 'bizim' demedi, ama bir intikam defteri açtı.", en: "You opened Pinewell's valves to everyone. The Guild never called that water theirs again, but it opened a ledger for revenge." }
            sonraki: "siginak_2_su_son"
          - id: "teslim"
            etiket: { tr: "İstasyonu Konsey'e teslim et, nöbetçi koy", en: "Hand the station to the Council and post a guard" }
            etkiler:
              - bayrak: "su_istasyonu_basildi"
              - bayrak: "pala_kini"
              - degisken: { hayatta_kalan: 2, lonca_golgesi: 1 }
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { lonca: -10, siginak: 5 }
            kronik: { tr: "Pınarbaşı Konsey'in oldu; kapısında artık turnike değil, bir nöbet çizelgesi asılıydı.", en: "Pinewell went to the Council. There was a watch roster on the gate now instead of a turnstile." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_baskin_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kimseyi öldürmemeye çalışmak, öldürmeye çalışmaktan zor. Bir an yumruğunu tutuyorsun ve o an alev tüpü sırtına patlıyor; kendine geldiğinde yüzün tozda, bir çizme ensende.", en: "Trying not to kill anybody is harder than trying to. You pull one punch, and in that second the flamethrower goes off across your back. When you come to, your face is in the dirt and there's a boot on your neck." }
          - { tr: "\"Bak,\" diyor Pala, çömelip yüzüne bakarak. \"Şartlar bunun için var.\" Ertesi sabah Konsey Lonca'nın şartını imzalıyor; su geliyor, rıhtıma da Lonca'nın adamları.", en: "\"See,\" Cleaver says, crouching down to look you in the face. \"This is why there are terms.\" The next morning the Council signs the Guild's deal. The water comes. So do the Guild's men, onto the docks." }
        secenekler:
          - id: "kabullen"
            etiket: { tr: "Kalk; suyun gelmesi yeter", en: "Get up. The water's coming. That's enough" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { lonca: 3 }
            kronik: { tr: "Pınarbaşı'nda yenildin ve suyun Lonca'nın şartıyla gelmesine razı oldun.", en: "You lost at Pinewell and settled for the water coming on the Guild's terms." }
            sonraki: "siginak_2_su_son"
          - id: "hatirla"
            etiket: { tr: "Pala'nın yüzünü iyice ezberle", en: "Memorize Cleaver's face. Every inch" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - bayrak: "pala_kini"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 2 }
              - ahlak: { merhamet: -2, duzen: -1 }
            kronik: { tr: "Pınarbaşı'nın tozunda Pala'nın yüzünü ezberledin; ikiniz de o günü unutmadınız.", en: "Face down in the Pinewell dirt, you memorized Cleaver's face. Neither of you forgot that day." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_sarnic"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} eski bir hanının bodrumundaki çatlaktan iniyorsun. Aşağıda bin beş yüz yıllık bir sarnıç uzanıyor: sütun sütun, kubbe kubbe, dizlerine kadar kapkara, buz gibi su.", en: "You go down through a crack in the cellar of an old Old Town building, past the buried 1890s storefronts the tour guides used to show off, and keep going. Below them is the original city reservoir: brick vaults on cast-iron columns, row after row, and black, ice-cold water up to your knees." }
          - { tr: "Sütunlardan birinin dibinde ters dönmüş bir taş baş var; gözleri yosunla kaplı. Suyun yüzeyinde ise taşın değil, canlı bir şeyin halkaları dolaşıyor.", en: "At the base of one column there's a carved stone face, set upside down, its eyes furred with moss. On the water, rings are spreading, and they aren't coming from the stone." }
          - { tr: "Halkaların ortasından bir şey doğruluyor; sütunlar kadar uzun, sudan ve kireçten yapılmış, gövdesinde yüzyıllardır biriken paralar ve dilek kâğıtları. Sarnıç kendine bir bekçi edinmiş.", en: "Something straightens up out of the middle of the rings, tall as the columns, made of water and limescale, with a century of tossed coins and wish notes caked into its body. The reservoir's grown itself a warden." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Sarnıç Bekçisi", en: "[ANALYSIS] Cistern Warden" }
            satirlar:
              - { tr: "Su hacmi: 80.000 m³. Kirlilik: yok. Bekçi: var.", en: "Water volume: 21 million gallons. Contamination: none. Warden: present." }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Bekçinin göğsünde, paraların arasında tek bir çekirdek atıyor. Gövdesinin geri kalanı sadece su; çekirdeği kırarsan sarnıç sakinleşir.", en: "In the warden's chest, among the coins, a single core is beating. The rest of it is just water. Break the core and the cistern goes still." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u şehir senden önce de su için savaştı. bu taşlar savaşı hatırlıyor. bekçi de.", en: "t̷his city fought over water before you were born. these stones remember. so does the warden." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçiyle savaş; sarnıç şehrin olsun", en: "Fight the warden. The cistern goes to the city" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["sarnic_bekcisi@oyuncu+3"], ortam: ["su", "karanlik"], kazan: "siginak_2_su_sarnic_zafer", kaybet: "siginak_2_su_sarnic_yenilgi", kac: "siginak_2_su_sarnic_yenilgi" }
            kronik: { tr: "Şehrin altındaki sarnıcın bekçisiyle karanlıkta dövüştün.", en: "You fought the warden of the cistern under the city, in the dark." }
          - id: "para"
            etiket: { tr: "Bir bozukluk at ve bir dilek tut", en: "Toss a coin and make a wish" }
            gerekli: { stat: { wis: 60 } }
            etkiler:
              - bayrak: "sarnic_dilegi"
              - ahlak: { insanlik: 4, merhamet: 1 }
              - savas: { dusmanlar: ["sarnic_bekcisi@oyuncu+1"], ortam: ["su", "karanlik"], kazan: "siginak_2_su_sarnic_zafer", kaybet: "siginak_2_su_sarnic_yenilgi", kac: "siginak_2_su_sarnic_yenilgi" }
            kronik: { tr: "Bekçiye bir bozukluk atıp bir dilek tuttun; bekçi seni bir hırsız değil, bir dilekçi olarak karşıladı.", en: "You tossed the warden a coin and made a wish. It met you as a petitioner instead of a thief." }
          - id: "cekirdek"
            tur: "gosteris"
            etiket: { tr: "Suya dal; çekirdeği tek hamlede çıkar", en: "Dive in and pull the core in one move" }
            gerekli: { stat: { agi: 75 } }
            etkiler:
              - dikkat: 4
              - ahlak: { duzen: 2, merhamet: 2 }
              - esya: { sarnic_suyu: 1 }
            kronik: { tr: "Sarnıcın bekçisinin kalbini tek hamlede söktün; şehrin en eski suyu bir saniyede senin oldu.", en: "You tore the cistern warden's heart out in one move. The city's oldest water was yours in a second flat." }
            sonraki: "siginak_2_su_sarnic_zafer"

      - id: "siginak_2_su_sarnic_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bekçi çöküyor; gövdesindeki paralar şıngırdayarak suya yağıyor ve sarnıç, yüz yıldır ilk kez, sakin. Su öyle berrak ki dibindeki bozuklukların üstündeki tarihleri okuyabiliyorsun.", en: "The warden collapses, the coins in its body raining down into the water, and for the first time in a century the cistern is still. The water's so clear you can read the dates on the coins at the bottom." }
          - { tr: "Konsey'in borucuları ertesi gün geliyor. Üç gün sonra {yer:eski_sehir|in} meydanında, yıllardır kuru duran mermer çeşmeden su akıyor ve kuyruktaki insanlar ağlamaya başlıyor.", en: "The Council's pipe crews come down the next day. Three days later, the old marble drinking fountain in the {yer:eski_sehir} square, dry for decades, starts to run, and people in line start crying." }
        secenekler:
          - id: "herkese"
            etiket: { tr: "\"Bu çeşme herkesin. Tel örgüsü yok.\"", en: "\"This fountain's for everyone. No fence.\"" }
            etkiler:
              - bayrak: "sarnic_acildi"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 5, duzen: -1 }
              - itibar: { siginak: 6 }
              - esya: { sarnic_suyu: 2 }
            kronik: { tr: "Şehrin altındaki suyu bir çeşmeden herkese açtın; o yaz Kıyıkent'te kimse susuzluktan ölmedi.", en: "You opened the water under the city to everyone through one old fountain. That summer, nobody in Port Harlow died of thirst." }
            sonraki: "siginak_2_su_son"
          - id: "konsey"
            etiket: { tr: "\"Sarnıç Konsey'in. Dağıtımı onlar yapar.\"", en: "\"The cistern belongs to the Council. They hand it out.\"" }
            etkiler:
              - bayrak: "sarnic_acildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 8 }
              - esya: { sarnic_suyu: 2 }
            kronik: { tr: "Sarnıcı Konsey'e verdin; Sığınak'ın gücü o gün topraktan gelmeye başladı.", en: "You gave the cistern to the Council. That day, the Haven's power started coming up out of the ground." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_sarnic_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bekçi seni sütunlardan birine çarpıyor ve sarnıcın dibine bastırıyor. Ciğerlerin dolarken yukarıda, suyun yüzeyinde, bozuklukların ışıltısı uzaklaşıyor.", en: "The warden slams you into a column and pins you to the bottom of the cistern. While your lungs fill, the glitter of the coins on the surface drifts farther and farther away." }
          - { tr: "Sonra bırakıyor. Neden bilmiyorsun; belki seni bir dilekçi sanıyor, belki de yalnızca yoruldu. Kendini merdivenlerde, öksürürken buluyorsun. Sarnıç kapalı kalıyor; Konsey ertesi gün Lonca'nın şartını imzalıyor.", en: "Then it lets go. You don't know why. Maybe it mistook you for a petitioner. Maybe it just got tired. You come to on the stairs, coughing. The cistern stays shut, and the next day the Council signs the Guild's deal." }
        secenekler:
          - id: "geri_don"
            etiket: { tr: "\"Bir gün geri geleceğim.\"", en: "\"I'll be back for you someday.\"" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 1 }
              - ahlak: { duzen: 1, insanlik: 2 }
            kronik: { tr: "Sarnıcın bekçisine yenildin; Liman'ın suyu o yaz Lonca'nın turnikesinden geçti.", en: "You lost to the cistern warden. That summer, the Waterfront's water came through the Guild's turnstile." }
            sonraki: "siginak_2_su_son"
          - id: "para_birak"
            etiket: { tr: "Merdivene bir bozukluk bırak", en: "Leave a coin on the stairs" }
            etkiler:
              - bayrak: "su_lonca_anlasmasi"
              - degisken: { lonca_golgesi: 2, hayatta_kalan: 1 }
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Seni boğmadan bırakan sarnıcın merdivenine bir bozukluk bıraktın.", en: "You left a coin on the stairs of the cistern that let you go." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_tuzla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tuzla mavnasının makine dairesi bir fırın gibi. Zar tüpleri patlamış, tuzla kabuk bağlamış; ellerini üstlerine koyduğunda önünde küçük, mavi bir pencere açılıyor: [Tuzla Arıtma Ünitesi · Durum: Bozuk].", en: "The Saltwater barge's engine room is an oven. The membrane tubes have blown and crusted over with salt, and when you lay your hands on them a small blue window pops open in front of you: [Saltwater Desalination Unit · Status: Broken]." }
          - { tr: "Manayı ellerinden borulara itiyorsun. Tuz kabuğu çatlıyor, tüpler içten dolup şişiyor ve pencere titriyor; Sistem, bir şeyin sebepsiz yere iyileşmesini sevmiyor.", en: "You push mana out through your palms and into the pipes. The salt crust cracks, the tubes swell from the inside, and the window shudders. The System doesn't like things getting better for no reason." }
          - metin: { tr: "{npc:yanki} pencerenin kenarından içeri sızıyor. Durum satırındaki 'Bozuk' kelimesi siliniyor; yerine kimsenin yazmadığı bir kelime geliyor.", en: "{npc:yanki} seeps in at the edge of the window. The word \"Broken\" in the status line erases itself, and a word nobody typed takes its place." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Mavnanın çıkış borusundan önce kahverengi, sonra bulanık, sonra berrak bir su akmaya başlıyor. Rıhtımdaki biri bir bardak doldurup içiyor ve öylece, boş bardak elinde, kalakalıyor.", en: "The barge's outflow pipe coughs up brown water, then cloudy, then clear. Somebody on the quay fills a cup, drinks it, and just stands there with the empty cup in his hand." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[Tuzla Arıtma Ünitesi · Durum: İ̷nat]", en: "[Saltwater Desalination Unit · Status: S̷tubborn]" }
            satirlar:
              - { tr: "sistem bunu düzeltmeye çalışacak. izin verme.", en: "the System's going to try to fix this. don't let it." }
        secenekler:
          - id: "bedava"
            etiket: { tr: "\"Bu su bedava. Herkese.\"", en: "\"This water's free. For everyone.\"" }
            etkiler:
              - bayrak: "tuzdan_su"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 5, insanlik: 1 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Tuzla mavnası senin elinle yeniden çalıştı ve kimse bir damlası için kimseye borçlanmadı.", en: "The Saltwater barge ran again because of your hands, and nobody ever owed anybody for a drop of it." }
            sonraki: "siginak_2_su_son"
          - id: "bekci"
            etiket: { tr: "\"Mavnanın bekçisi ben olacağım.\"", en: "\"I'll be the barge's keeper.\"" }
            etkiler:
              - bayrak: "tuzdan_su"
              - bayrak: "su_bekcisi"
              - degisken: { hayatta_kalan: 3 }
              - dikkat: 2
              - ahlak: { duzen: 4, insanlik: -2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Liman'ın suyunu senin elin akıttı ve senin elin tuttu; kimse bunu sorgulamadı, kimse de unutmadı.", en: "Your hand made the Waterfront's water run, and your hand held the tap. Nobody questioned it. Nobody forgot it, either." }
            sonraki: "siginak_2_su_son"

      - id: "siginak_2_su_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kalkış panosundaki kırmızı satırı birisi beyaza boyuyor. SU yazısının yanına artık gün sayısı değil, bir kelime çevriliyor: VAR.", en: "Somebody paints over the red line on the departures board in white. Next to WATER they don't flip a number of days anymore. They flip a word: YES." }
          - metin: { tr: "Rıhtım boyunca Lonca bantlı adamlar yürüyor; su onlarla geldi ve onlar kalacak. Rıza Reis onlara selam vermiyor.", en: "Men in Guild armbands walk the length of the docks. The water came with them, and they're staying. Skipper Reese doesn't wave." }
            kosul: { bayrak: "su_lonca_anlasmasi" }
          - metin: { tr: "Sanayi'den gelen haberler sert. Pala her sabah Pınarbaşı'nın kapısında, turnikenin söküldüğü boş yerin önünde durup bir şey mırıldanıyormuş. Ne mırıldandığını kimse bilmiyor.", en: "The word out of the Ironworks is ugly. Every morning, Cleaver supposedly stands at the Pinewell gate, in front of the empty spot where the turnstile used to be, and mutters something. Nobody knows what." }
            kosul: { bayrak: "pala_kini" }
          - metin: { tr: "Gümrük'teki koğuşta {npc:elif_sari} ilk kez bir hastasına bir bardak su verirken bardağı ölçmüyor. Seni görünce bardağı kaldırıyor, kadeh kaldırır gibi.", en: "In the ward in the Customs House, {npc:elif_sari} hands a patient a glass of water without measuring it for the first time. When she sees you, she raises the glass like a toast." }
            kosul: { npc_hayatta: "elif_sari" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Su Getiren]", en: "[TITLE: Water-Bringer]" }
            satirlar:
              - { tr: "Bir şehrin susuzluğunu sona erdirdin. Sistem bunu 'beklenmedik kaynak tahsisi' olarak kaydetti.", en: "You ended a city's thirst. The System logged it as \"unexpected resource allocation.\"" }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Bidonları Kordon'a ve Tepe'nin eteğine de taşı", en: "Haul cans out to the Esplanade and the Heights" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 6, yukselenler: 2 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Suyu Liman'ın tel örgüsünün dışına da taşıdın; Kordon'da ve Tepe'nin eteğinde çocuklar o yazı çıkardı.", en: "You carried water past the Waterfront fence, too. Out on the Esplanade and at the foot of the Heights, kids lived through that summer." }
            sonraki: "@akis"
          - id: "once_liman"
            etiket: { tr: "\"Önce Liman. Artarsa başkalarına.\"", en: "\"The Waterfront first. Others get what's left.\"" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: -2 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Suyu önce Liman'a ayırdın; tel örgünün dışına artan kadarı gitti, yani pek bir şey gitmedi.", en: "You kept the water for the Waterfront first. What was left went past the fence, which is to say not much." }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "\"Her litre kayda geçsin. Saklayan cezalansın.\"", en: "\"Log every liter. Hoarders get punished.\"" }
            etkiler:
              - bayrak: "siginak_2_bitti"
              - unvan: "su_getiren"
              - xp_seviye: 50
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 5, merhamet: 1 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 3 } }
              - tohum: { olay: "elif_gece_nobeti", gecikme: { min: 12, max: 25 }, kosul: { npc_hayatta: "elif_sari", bayrak_yok: "elif_gece_nobeti_bitti" } }
            kronik: { tr: "Liman'ın suyunun her litresini kayda geçirttin; saklayanlar bulundu ve kuyruk ilk kez adil oldu.", en: "You had every liter of the Waterfront's water logged. The hoarders got caught, and for the first time the line was fair." }
            sonraki: "@akis"

  # ================================================================== ELİF 2 — GECE NÖBETİ (P2–3; aşk yayı: elif_ask)
  # İnce tutulur, asla ilan edilmez: bir omuz, bir saat, bir çay. elif_ask yalnızca güven + bağlılık + merhametle açılır.
  - id: "elif_gece_nobeti"
    perde: [2, 3]
    gun: { min: 140, max: 250 }
    agirlik: 7
    kosul: { bayrak: "elif_oylamasi_bitti", bayrak_yok: "elif_gece_nobeti_bitti" }
    etiketler: ["siginak", "npc", "hastane", "nefes"]
    gerilim: 2
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Mavi ateş", en: "The blue fever" }
    sahne: "elif_gece_nobeti_1"
    sahneler:
      - id: "elif_gece_nobeti_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük binasının merdivenlerinde dudakları morarmış insanlar oturuyor, öksürerek. Koğuşta adını çoktan koymuşlar: mavi ateş. Yarık suyundan bulaşıyor ve üç günde iki yüz kişiyi yatağa düşürmüş.", en: "People are sitting on the Customs House steps, coughing, their lips gone blue. The ward already has a name for it: the blue fever. It comes from rift water, and in three days it's put two hundred people in bed." }
          - { tr: "İçeride {npc:elif_sari} başhemşire Nurhan'a bağırıyor; sonra bağırdığını fark edip duruyor, iki elini yüzüne kapatıyor ve parmaklarının arasından \"Özür dilerim\" diyor. Elli saattir uyumamış. Bunu sana Nurhan fısıldıyor, o duymasın diye.", en: "Inside, {npc:elif_sari} is yelling at Nora, her head nurse. Then she catches herself, stops, puts both hands over her face, and says \"I'm sorry\" through her fingers. She hasn't slept in fifty hours. Nora whispers that to you so she won't hear." }
          - metin: { tr: "Konsey'in başına geçtiğinden beri gündüzleri gişede, geceleri burada. Arada bir yerde uyuması gerekiyor; o yeri henüz bulamamış.", en: "Since she took the Council's chair, it's the ticket window by day and the ward by night. She's supposed to sleep somewhere in between. She hasn't found where yet." }
            kosul: { bayrak: "elif_konsey_basi" }
          - { tr: "Seni görünce yüzündeki ellerini indiriyor. \"Yorulmayan birine ihtiyacım var,\" diyor. \"Sen yorulmuyorsun. Gördüm.\"", en: "When she sees you, she drops her hands. \"I need somebody who doesn't get tired,\" she says. \"You don't get tired. I've seen it.\"" }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Hastaların hepsi Liman'ın doğu ucundaki aynı su tankından içmiş. Tankın vanasında mavi bir yosun parlıyor.", en: "Every one of these patients drank from the same tank at the east end of the Waterfront. There's blue algae glowing on its valve." }
          - kosul: { stat: { wis: 90 } }
            metin: { tr: "Ateş bir mana zehri. Bir insan vücudundan çekilebilir; yeterince büyük bir kaba.", en: "The fever is a mana poison. It can be drawn out of a human body, into a big enough vessel." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ da sayıyor. elli saattir. sayı bittiğinde ne olacağını merak ediyorum.", en: "s̷he's counting too. fifty hours now. i wonder what happens when she runs out of numbers." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben çocuk koğuşunu alırım. Onlara... onlara bir şey anlatırım. Bir şey uydururum.\"", en: "\"I'll take the kids' ward. Tell them... something. I'll make something up.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bütün hastaların içtiği suyu bir haritaya dökebilirim. Ortak noktayı bulursak, kaynağı buluruz.\"", en: "\"I can map out where every patient got their water. Find the overlap, find the source.\"" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "\"Sabaha kadar buradayım.\"", en: "\"I'm here till morning.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 30 }
            kronik: { tr: "Mavi ateş gecesinde Gümrük'teki koğuşta sabaha kadar kaldın.", en: "On the night of the blue fever, you stayed on the Customs House ward till morning." }
            sonraki: "elif_gece_nobeti_nobet"
          - id: "ates"
            tur: "gosteris"
            etiket: { tr: "Ateşi ellerinle hastalardan çek", en: "Draw the fever out of them with your hands" }
            gerekli: { stat: { wis: 90 } }
            etkiler:
              - bayrak: "ates_cekildi"
              - bayrak: "ece_yasadi"
              - dikkat: 5
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 4, insanlik: -2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, korku: 4 } }
            kronik: { tr: "İki yüz kişinin ateşini avuçlarınla kendi damarlarına çektin; Gümrük'te o gece kimse ölmedi ve kimse bunu açıklayamadı.", en: "You pulled two hundred people's fever into your own veins through your palms. Nobody in the Customs House died that night, and nobody could explain it." }
            sonraki: "elif_gece_nobeti_ates"
          - id: "kaynak"
            etiket: { tr: "Ateşin kaynağını bul: doğu tankı", en: "Find the source of the fever: the east tank" }
            gerekli: { stat: { per: 60 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Koğuşta beklemek yerine ateşin kaynağına yürüdün.", en: "Instead of waiting on the ward, you went after the source of the fever." }
            sonraki: "elif_gece_nobeti_kaynak"
          - id: "uyu"
            etiket: { tr: "\"Sen uyu. Koğuş bende.\"", en: "\"You sleep. I've got the ward.\"" }
            gerekli: { iliski_min: { elif_sari: { guven: 30 } } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Elli saattir uyumayan bir hekime uyumasını söyledin; o da sonunda dinledi, ama kendi yöntemiyle.", en: "You told a doctor who hadn't slept in fifty hours to go to sleep. In the end she listened, in her own way." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "ret"
            etiket: { tr: "\"Benim işim değil.\"", en: "\"Not my job.\"" }
            etkiler:
              - bayrak: "elif_mesafe"
              - ahlak: { merhamet: -3, insanlik: -2 }
              - iliski: { elif_sari: { baglilik: -5, guven: -3 } }
            kronik: { tr: "Mavi ateş gecesinde Gümrük'ün kapısından döndün; hekim seni bir daha yardıma çağırmadı.", en: "On the night of the blue fever, you turned around at the Customs House door. The doctor never asked you for help again." }
            sonraki: "elif_gece_nobeti_ret"

      - id: "elif_gece_nobeti_ret"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"O zaman git,\" diyor {npc:elif_sari}, başını kaldırmadan. Elleri bir serum torbasını asmakla meşgul; titremiyorlar.", en: "\"Then go,\" {npc:elif_sari} says, without looking up. Her hands are busy hanging an IV bag. They aren't shaking." }
          - { tr: "Merdivenlerden inerken arkandan bir öksürük duyuyorsun; sonra bir başkası, sonra bir çocuk ağlaması. Kapı arkandan kapanınca sesler kesiliyor, ama tam kesilmiyor.", en: "On your way down the steps you hear a cough behind you, then another, then a kid crying. When the door shuts behind you the sounds stop. Not all the way." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - ahlak: { merhamet: -1, duzen: 1 }
            kronik: { tr: "Gümrük'ün merdivenlerinden geriye bakmadan indin.", en: "You walked down the Customs House steps without looking back." }
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Merdivendekilere birer şişe su bırak", en: "Leave a bottle of water for each of them on the steps" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { elif_sari: { guven: 1 } }
            kronik: { tr: "Koğuşa girmedin ama merdivendeki her hastaya bir şişe su bıraktın.", en: "You didn't go into the ward, but you left a bottle of water for every patient on the steps." }
            sonraki: "@akis"

      - id: "elif_gece_nobeti_nobet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Saat üç. Koğuşun ışıkları kısılmış, öksürükler bir nefes gibi yükselip alçalıyor. {npc:elif_sari} ile yataktan yatağa geçiyorsunuz; o ateş ölçüyor, sen yazıyorsun, o bantların rengini değiştiriyor, sen bandı kesiyorsun.", en: "Three in the morning. The ward lights are down, and the coughing rises and falls like breathing. You and {npc:elif_sari} go cot to cot. She takes temperatures, you write them down. She changes the color of the tape, you tear it off the roll." }
          - { tr: "Pencerenin dibindeki yatakta yedi yaşında bir kız, Ece, yatıyor; ateşi kırk bir. Dudakları artık mor değil, griye dönüyor. Serum bitti; Gümrük'te son torba bir saat önce takıldı.", en: "In the cot under the window is a seven-year-old named Evie, fever at a hundred and five point eight. Her lips aren't blue anymore. They're going gray. The fluids are gone. The last bag in the building went up an hour ago." }
          - { tr: "{npc:elif_sari} kızın bileğini tutuyor ve uzun süre bir şey söylemiyor. Sonra sana bakıyor; o bakışı biliyorsun. Yemek katında da böyle bakmıştı.", en: "{npc:elif_sari} holds the girl's wrist and doesn't say anything for a long time. Then she looks at you. You know that look. She looked at you like that in the food court, too." }
        sezgiler:
          - kosul: { stat: { end: 90 } }
            metin: { tr: "Senin kanın bu ateşi yakar. Damarlarında dolaşan şey artık tam olarak kan değil.", en: "Your blood would burn this fever out. What's running in your veins isn't exactly blood anymore." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷ızın penceresi kararıyor. sistem onu çoktan bir satıra çevirdi. satırı silmek mi istiyorsun, yoksa okumak mı?", en: "t̷he girl's window is going dark. the System's already turned her into a line item. do you want to erase the line, or read it?" }
        secenekler:
          - id: "kan"
            tur: "gosteris"
            etiket: { tr: "Kolunu uzat: \"Kanımı ver ona.\"", en: "Hold out your arm: \"Give her my blood.\"" }
            gerekli: { stat: { end: 90 } }
            etkiler:
              - bayrak: "ece_yasadi"
              - dikkat: 3
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 5, guven: 5 } }
            kronik: { tr: "Mavi ateşte ölen bir çocuğa kendi kanını verdin; Ece adlı bir kız büyüdü ve hep biraz fazla sıcak elleri oldu.", en: "You gave your own blood to a little girl dying of the blue fever. A kid named Evie grew up, and her hands always ran a little too warm." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "cagir"
            etiket: { tr: "\"Bir şey dene. Ne olursa. Ben tutarım.\"", en: "\"Try something. Anything. I'll hold her.\"" }
            etkiler:
              - bayrak: "ece_yasadi"
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "Bir hekimin son çaresini denemesi için çocuğu sen tuttun; çocuk yaşadı, hekim yığılıp kaldı.", en: "You held the child still so a doctor could try her last trick. The kid lived. The doctor dropped where she stood." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "el"
            etiket: { tr: "Ece'nin elini tut ve ona bir masal anlat", en: "Hold Evie's hand and tell her a story" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Mavi ateşte bir çocuğun elini tutup ona son masalını anlattın.", en: "You held a child's hand through the blue fever and told her the last story she ever heard." }
            sonraki: "elif_gece_nobeti_kayip"

      - id: "elif_gece_nobeti_ates"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini ilk yataktaki çocuğun alnına koyuyorsun. Mavilik, mürekkebin kâğıda yayılması gibi, onun derisinden senin parmaklarına akıyor; bileğinde, sonra dirseğinde, sonra omzunda damarların parlamaya başlıyor.", en: "You lay your hand on the forehead of the kid in the first cot. The blue runs out of their skin and into your fingers like ink soaking into paper. The veins at your wrist start to glow, then your elbow, then your shoulder." }
          - { tr: "Yataktan yatağa. İki yüz yatak. Saat dörde doğru koğuş sessiz ve senin kolların, karanlıkta iki mavi fener gibi, kendi kendine yanıyor.", en: "Cot to cot. Two hundred cots. By four in the morning the ward is quiet, and your arms are burning on their own in the dark like two blue lanterns." }
          - { tr: "{npc:elif_sari} her şeyi izledi. Şimdi gelip bileğini tutuyor, saymaya başlıyor, sonra bırakıyor. \"Otur,\" diyor. \"Bu bir hekim emri. Sana başka bir şey söyleyecek durumda değilim.\"", en: "{npc:elif_sari} watched the whole thing. Now she comes over, takes your wrist, starts counting, and lets go. \"Sit down,\" she says. \"That's a doctor's order. I'm not in any shape to tell you anything else.\"" }
        bildirimler:
          - tur: "durum"
            baslik: { tr: "[Mana zehri emildi ×200]", en: "[Mana toxin absorbed ×200]" }
            satirlar:
              - { tr: "Etki: yok. Sistem bu sonucu beklemiyordu.", en: "Effect: none. The System was not expecting that result." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Otur. Emre uy.", en: "Sit down. Follow orders." }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "İki yüz kişiyi iyileştirdikten sonra bir hekimin emriyle oturdun.", en: "After you healed two hundred people, you sat down because a doctor told you to." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "isik"
            etiket: { tr: "Kollarının ışığını ona göster: \"Korkma.\"", en: "Show her the light in your arms: \"Don't be scared.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { elif_sari: { korku: -3, baglilik: 4 } }
            kronik: { tr: "Kollarındaki mavi ışığı bir hekime gösterip korkmamasını istedin; korkmadı, en azından o gece.", en: "You showed a doctor the blue light in your arms and asked her not to be afraid. She wasn't. Not that night, anyway." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_kaynak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Doğu tankı, Liman'ın en ucunda, eski bir yakıt deposundan bozma. Fenerini kapağın içine tuttuğunda suyun yüzeyi değil, mavi, kıpır kıpır, canlı bir halı görüyorsun: yarık yosunu.", en: "The east tank sits at the far end of the Waterfront, converted from an old fuel tank. When you shine your flashlight in through the hatch, you don't see a water surface. You see a blue, squirming, living carpet: rift algae." }
          - metin: { tr: "Tankın yanında bir Lonca su kamyonunun lastik izleri var. Teslimat fişi vanaya bantlanmış: KAYNAK — KULE DİBİ KUYUSU 3. Kule'nin dibindeki kuyulardan su çekmenin yasak olduğunu herkes bilir; ucuz olduğunu da.", en: "There are tire tracks from a Guild water truck next to the tank. The delivery slip is taped to the valve: SOURCE: SPIRE PLAZA WELL 3. Everybody knows you're not supposed to pump from the wells at the foot of the Spire. Everybody also knows it's cheap." }
            kosul: { bayrak: "su_lonca_anlasmasi" }
          - metin: { tr: "Tankın dibinde, betonda, saç teli kadar ince bir yarık açılmış. Yarığın kenarları mavi parlıyor ve tankın içine, damla damla, başka bir yerin suyunu sızdırıyor.", en: "There's a crack in the concrete at the bottom of the tank, thin as a hair. Its edges glow blue, and drip by drip, it's leaking somewhere else's water into the tank." }
            kosul: { bayrak_yok: "su_lonca_anlasmasi" }
        secenekler:
          - id: "muhurle"
            etiket: { tr: "Tankı boşalt ve yarığı mühürle", en: "Drain the tank and seal the crack" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Mavi ateşin kaynağını boşaltıp mühürledin; ertesi hafta yeni hasta gelmedi.", en: "You drained and sealed the source of the blue fever. The next week, no new patients came in." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "fis"
            etiket: { tr: "Teslimat fişini sök; Lonca'ya hesap soracaksın", en: "Peel off the delivery slip. The Guild's going to answer for this" }
            goster: { bayrak: "su_lonca_anlasmasi" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - bayrak: "lonca_kuyu_fisi"
              - degisken: { hayatta_kalan: 2, lonca_golgesi: 1 }
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { siginak: 4, lonca: -5 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 80, max: 110 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Lonca'nın Liman'a zehirli su sattığını belgeleyen fişi Konsey'e götürdün; o fiş Lonca ile Sığınak arasında hiç kapanmayan bir yara oldu.", en: "You brought the Council the slip proving the Guild sold the Waterfront poisoned water. It became a wound between the Guild and the Haven that never closed." }
            sonraki: "elif_gece_nobeti_cokus"
          - id: "sus"
            etiket: { tr: "Tankı mühürle, fişi yak; savaş istemiyorsun", en: "Seal the tank and burn the slip. You don't want a war" }
            goster: { bayrak: "su_lonca_anlasmasi" }
            etkiler:
              - bayrak: "dogu_tanki_muhurlendi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Lonca'nın zehirli su sattığını gösteren fişi yaktın; Liman hiçbir zaman bilmedi, Lonca ise borçlu olduğunu bildi.", en: "You burned the slip that proved the Guild sold poisoned water. The Waterfront never found out. The Guild knew it owed you." }
            sonraki: "elif_gece_nobeti_cokus"

      - id: "elif_gece_nobeti_cokus"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Koğuşa döndüğünde {npc:elif_sari} iki yatağın arasında, yere çömelmiş, bir elini bir hastanın alnında tutuyor. Sonra eli kayıyor ve kendisi de yavaşça yana devriliyor, sanki biri ipini kesmiş gibi.", en: "When you get back to the ward, {npc:elif_sari} is crouched on the floor between two cots with one hand on a patient's forehead. Then the hand slides off and she tips slowly sideways, like somebody cut her strings." }
            kosul: { bayrak_yok: "ece_yasadi" }
          - metin: { tr: "{npc:elif_sari} son çareyi deniyor: bir kemik içi iğnesi, bir şişe tuzlu su, bir dua gibi mırıldanan bir sayı. Ece'nin dudaklarına renk geldiğinde hekim iğneyi bırakıyor, doğruluyor ve yavaşça yana devriliyor, sanki biri ipini kesmiş gibi.", en: "{npc:elif_sari} tries her last trick: a bone needle, a bottle of saline, a number muttered like a prayer. When the color comes back into Evie's lips, the doctor lets go of the needle, straightens up, and tips slowly sideways, like somebody cut her strings." }
            kosul: { bayrak: "ece_yasadi" }
          - { tr: "Onu yere düşmeden yakalıyorsun. Ağırlığı yok gibi; elli saat uykusuzluk ve iki bardak çay. Gözlerini açtığında ilk sorusu kendisi değil: \"Dördüncü yatak. Ateşi düştü mü?\"", en: "You catch her before she hits the floor. She barely weighs anything. Fifty hours awake and two cups of tea. When she opens her eyes, the first thing she asks isn't about herself: \"Bed four. Did the fever break?\"" }
        secenekler:
          - id: "emir"
            etiket: { tr: "\"Düştü. Şimdi sen yat. Hekim emri.\"", en: "\"It broke. Now you lie down. Doctor's orders.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
            kronik: { tr: "Kendi koğuşunda yığılan hekime kendi cümlesiyle emir verdin.", en: "When the doctor collapsed on her own ward, you gave her an order in her own words." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "cati"
            etiket: { tr: "Onu kucakla, çatıya çıkar; hava alsın", en: "Carry her up to the roof for some air" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "Yığılan hekimi kucağında Gümrük'ün çatısına taşıdın.", en: "You carried the doctor up to the Customs House roof in your arms." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_kayip"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Masalın sonuna gelemiyorsun. Ece şafaktan biraz önce, sen deniz kızının adını söylerken, nefes almayı bırakıyor; o kadar sessizce ki bir an fark etmiyorsun.", en: "You don't make it to the end of the story. A little before dawn, while you're saying the mermaid's name, Evie stops breathing, so quietly you don't notice for a second." }
          - { tr: "{npc:elif_sari} saati söylüyor, yüksek sesle, her zamanki gibi. Siyah bandı kızın alnına kendisi yapıştırıyor. Sen bir bardak su doldurup yatağın başına koyuyorsun.", en: "{npc:elif_sari} calls the time out loud, like always. She puts the black tape on the girl's forehead herself. You fill a glass of water and set it by the cot." }
          - { tr: "{npc:elif_sari} bardağa bakıyor, sonra sana. \"Hatırladın,\" diyor. Sesi kırılıyor ve bunu saklamaya çalışmıyor.", en: "{npc:elif_sari} looks at the glass, then at you. \"You remembered,\" she says. Her voice breaks, and she doesn't try to hide it." }
        secenekler:
          - id: "cati"
            etiket: { tr: "\"Hadi. Biraz hava alalım.\"", en: "\"Come on. Let's get some air.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4, guven: 2 } }
            kronik: { tr: "Ece'nin yatağına bir bardak su bıraktın ve hekimi çatıya çıkardın.", en: "You left a glass of water by Evie's cot and took the doctor up on the roof." }
            sonraki: "elif_gece_nobeti_cati"
          - id: "isim"
            etiket: { tr: "Kızın adını koğuşun tahtasına yaz", en: "Write the girl's name on the ward whiteboard" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "Mavi ateşte ölen kızın adını koğuşun tahtasına kendi elinle yazdın; kimse silmedi.", en: "You wrote the name of the girl who died of the blue fever on the ward whiteboard yourself. Nobody erased it." }
            sonraki: "elif_gece_nobeti_cati"

      - id: "elif_gece_nobeti_cati"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'ün çatısında, su deposunun gölgesinde oturuyorsunuz. Şafak körfezin üstünde griden pembeye dönüyor; aşağıda, rıhtımda, ilk tekne motorunu öksürtüyor.", en: "You're sitting on the Customs House roof in the shadow of the water tower. Dawn is going from gray to pink over the bay, and down on the quay the first boat coughs its engine awake." }
          - { tr: "\"Entegrasyon olduğunda nöbetteydim,\" diyor {npc:elif_sari}, sana bakmadan. \"Saat üç on dörtte. Acil serviste otuz bir hasta vardı. Işık geldi ve hepsi gitti, bir anda; sedyeler boşaldı, monitörler bipledi. Ben saydım. Neden saydım bilmiyorum.\"", en: "\"I was on shift when Integration hit,\" {npc:elif_sari} says, not looking at you. \"Three fourteen a.m. Thirty-one patients in the ER. The light came and they were gone, all at once. Empty gurneys, monitors beeping. I counted them. I don't know why I counted them.\"" }
          - { tr: "\"O günden beri sayıyorum. Bin dört yüz altı. Gün sıfırdan beri ellerimin arasında ölenler.\" Kurabiye paketini çıkarıyor, boş; yine de içine bakıyor. \"Sen neyi sayıyorsun?\"", en: "\"I haven't stopped since. One thousand four hundred and six. People who died in my hands since Day Zero.\" She takes out the cookie pack. It's empty. She looks inside anyway. \"What do you count?\"" }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Omzu seninkinden bir karış uzakta. Bu karışı ne o kapatacak, ne de kapatılmasını isteyip istemediğini söyleyecek.", en: "Her shoulder is a hand's width from yours. She won't close that gap herself, and she won't tell you whether she wants it closed." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷unu benim sayamayacağım bir şey. buna dokunmayacağım.", en: "t̷his is something i can't count. i'm not touching it." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Omzunu ona aç; bir şey söyleme", en: "Make room on your shoulder. Say nothing" }
            gerekli: { iliski_min: { elif_sari: { baglilik: 35, guven: 35 } }, ahlak_min: { merhamet: 10 } }
            etkiler:
              - bayrak: "elif_ask"
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 10, guven: 5 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 45 }
            kronik: { tr: "Bir sabah Gümrük'ün çatısında bir hekim başını omzuna yasladı; ikiniz de bunun adını hiç koymadınız.", en: "One morning on the Customs House roof, a doctor leaned her head on your shoulder. Neither of you ever gave it a name." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "sayiyorum"
            etiket: { tr: "\"Ben seni sayıyorum. Her gece, sağ mısın diye.\"", en: "\"I count you. Every night. To make sure you're still here.\"" }
            gerekli: { iliski_min: { elif_sari: { baglilik: 30, guven: 30 } }, ahlak_min: { merhamet: 10 } }
            etkiler:
              - bayrak: "elif_ask"
              - ahlak: { insanlik: 3, merhamet: 3 }
              - iliski: { elif_sari: { baglilik: 8, guven: 6 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 40 }
            kronik: { tr: "Bin dört yüz altı ölüyü sayan bir hekime, her gece onu saydığını söyledin.", en: "You told a doctor who'd counted one thousand four hundred and six dead that you counted her every night." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "kahve"
            etiket: { tr: "\"Kahve getireyim. Gümrük'ün makinesi hâlâ çalışıyor.\"", en: "\"Let me get you a coffee. The machine downstairs still works.\"" }
            etkiler:
              - bayrak: "elif_dostluk"
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 5, baglilik: 3 } }
            kronik: { tr: "Gümrük'ün çatısında bir hekime kahve getirdin; dostluğunuz o bardakta başladı.", en: "You brought a doctor a coffee on the Customs House roof. Your friendship started in that cup." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "uyumuyorum"
            tur: "aciga_vur"
            etiket: { tr: "\"Ben uyumuyorum. Hiç. Entegrasyon'dan beri.\"", en: "\"I don't sleep. At all. Not since Integration.\"" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - dikkat: 2
              - ahlak: { insanlik: 3, duzen: -1 }
              - iliski: { elif_sari: { guven: 6, korku: 2, baglilik: 3 } }
            kronik: { tr: "Bir hekime, artık uyumadığını itiraf ettin; o da seni bir vaka değil, bir insan olarak dinledi.", en: "You admitted to a doctor that you don't sleep anymore. She listened to you like a person, not a case." }
            sonraki: "elif_gece_nobeti_sabah"
          - id: "mesafe"
            etiket: { tr: "\"Bu konuşma bu çatıda kalsın.\"", en: "\"Let's leave this conversation up here.\"" }
            etkiler:
              - bayrak: "elif_mesafe"
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { elif_sari: { baglilik: -2, saygi: 2 } }
            kronik: { tr: "Bir hekimin sana açtığı kapıyı nazikçe kapattın; aranızdaki karış hiç kapanmadı.", en: "You gently closed the door a doctor had opened for you. That hand's width between you never did close." }
            sonraki: "elif_gece_nobeti_sabah"

      - id: "elif_gece_nobeti_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Bir süre sonra başı omzuna düşüyor ve uyuyor; elli saattir ilk kez. Sen kıpırdamıyorsun. Güneş körfezden yükselirken Nurhan elinde iki bardak çayla çatıya çıkıyor, sizi görüyor, bardakları sessizce yere bırakıp geri iniyor.", en: "After a while her head drops onto your shoulder and she's asleep, for the first time in fifty hours. You don't move. As the sun comes up over the bay, Nora climbs up with two cups of tea, sees you two, sets the cups down without a sound, and goes back downstairs." }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "{npc:elif_sari} kalkıyor, önlüğünü düzeltiyor ve bir an kapıda duruyor. \"Gece için teşekkürler,\" diyor. \"Vizite yedide. Gel ya da gelme; ama gelirsen kahve senden.\"", en: "{npc:elif_sari} gets up, straightens her coat, and pauses at the door. \"Thanks for the night,\" she says. \"Rounds at seven. Come or don't. But if you come, you're buying the coffee.\"" }
            kosul: { bayrak_yok: "elif_ask" }
          - { tr: "Aşağıda koğuş uyanıyor. Öksürükler azalmış; tahtadaki bantların rengi, bir gecede, kırmızıdan sarıya dönmüş.", en: "Down below, the ward is waking up. There's less coughing. Overnight, the tape colors on the board have gone from red to yellow." }
        secenekler:
          - id: "kipirdama"
            etiket: { tr: "Kıpırdama. Bir saat daha.", en: "Don't move. One more hour." }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 5 } }
            kronik: { tr: "Bir hekim omzunda uyurken bir saat boyunca kıpırdamadın; Liman o sabah onsuz idare etti.", en: "A doctor slept on your shoulder and you didn't move for an hour. The Waterfront managed without her that morning." }
            sonraki: "@akis"
          - id: "tasi"
            etiket: { tr: "Onu uyandırmadan yatağına taşı", en: "Carry her to bed without waking her" }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "Uyuyan hekimi yatağına taşıdın ve üstünü örttün; uyandığında kim olduğunu sormadı, biliyordu.", en: "You carried the sleeping doctor to her bed and pulled the blanket up. When she woke, she didn't ask who'd done it. She knew." }
            sonraki: "@akis"
          - id: "vizite"
            etiket: { tr: "Viziteye birlikte in; kahveler senden", en: "Go down to rounds together. Coffee's on you" }
            goster: { bayrak_yok: "elif_ask" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
            kronik: { tr: "Mavi ateş gecesinin sabahında hekimle birlikte viziteye indin, iki kahveyle.", en: "On the morning after the blue fever, you went down to rounds with the doctor, carrying two coffees." }
            sonraki: "@akis"
          - id: "kurabiye"
            etiket: { tr: "Boş kurabiye paketine bir paket koy ve git", en: "Swap her empty cookie pack for a full one and go" }
            etkiler:
              - bayrak: "elif_gece_nobeti_bitti"
              - xp_seviye: 25
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "Bir hekimin boş kurabiye paketini dolusuyla değiştirdin; o paketi hiç atmadı.", en: "You swapped a doctor's empty cookie pack for a full one. She never threw that pack away." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 3 — TAHLİYE (P3, AY 205)
  # Elif bu noktadan sonra ölmüş olabilir (darbe); olay onu npc listesine almaz, Elif satırları koşulludur.
  - id: "siginak_3_tahliye"
    perde: [3]
    gun: { min: 190, max: 260 }
    ana_yay: { gun: 205 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_2_bitti" }
    etiketler: ["siginak", "zincir", "kadimler", "kurtarma"]
    gerilim: 4
    onemli: true
    kart: { tr: "Örnekleme bölgesi", en: "Sampling zone" }
    sahne: "siginak_3_tahliye_1"
    sahneler:
      - id: "siginak_3_tahliye_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak sökerken gökten beyaz bir sütun iniyor. Çarpmıyor; {yer:eski_sehir} ile {yer:kordon} arasındaki meydana, bir iğne gibi, saplanıyor. Sesi ancak üç saniye sonra geliyor ve bütün camları aynı anda titretiyor.", en: "At first light a white pillar comes down out of the sky. It doesn't crash. It goes into the square between {yer:eski_sehir} and {yer:kordon} like a needle. The sound gets there three seconds later and rattles every window in the city at once." }
          - { tr: "Sabah altıda {yer:kiyikent_iskele|in} salonunda Konsey ayakta. Kalkış panosunda yeni harfler: YARIÇAPTA 14.000 KİŞİ · KAMYON 11 · VAPUR 3 · YOL 1. O tek yol Kordon.", en: "At six a.m. the Council is on its feet in the {yer:kiyikent_iskele} hall. New letters on the departures board: 14,000 IN RADIUS · TRUCKS 11 · FERRIES 3 · ROADS 1. That one road is the Esplanade." }
          - metin: { tr: "{npc:elif_sari} başkan gişesinden kalkmış, tahtanın önünde duruyor. \"Önce çocuklar ve hastalar,\" diyor. \"Sonra yaşlılar. Sonra herkes.\" Rıza Reis başını sallıyor: \"Önce savaşabilenler. Yaşayan bir savaşçı on kişiyi kurtarır. Yaşayan bir çocuk, bir çocuğu.\"", en: "{npc:elif_sari} is out of the chair's booth and standing at the whiteboard. \"Kids and the sick first,\" she says. \"Then the elderly. Then everybody.\" Skipper Reese shakes his head. \"Fighters first. A fighter who lives saves ten people. A kid who lives saves one kid.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Rıza Reis tahtanın önünde duruyor. \"Önce savaşabilenler,\" diyor. \"Yaşayan bir savaşçı on kişiyi kurtarır.\" Kimse karşı çıkmıyor; karşı çıkacak kişi artık yok. Herkes sana bakıyor.", en: "Skipper Reese stands at the whiteboard. \"Fighters first,\" he says. \"A fighter who lives saves ten people.\" Nobody argues. The person who would have argued isn't here anymore. Everybody looks at you." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "Kordon düştüğünden beri orada canavarlarla aynı sokakları paylaşan insanlar var. Yolun yarısı onların barikatlarıyla, yarısı canavar yuvalarıyla kesik.", en: "Since the Esplanade fell, there are people living down there on the same streets as the monsters. Half the road is blocked by their barricades and half by nests." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Körfezdeki Kadim gemisinden açıklama yok. {npc:thessar} yalnızca bir kez, Sistem kanalından, tek bir cümle gönderiyor: \"Ölçmek kesmek değildir.\"", en: "No statement from the Ancient ship in the bay. {npc:thessar} sends exactly one sentence over the System channel: \"Measuring is not cutting.\"" }
            kosul: { bayrak: "thessar_indi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[ÖRNEKLEME BÖLGESİ BİLDİRİMİ]", en: "[SAMPLING ZONE NOTICE]" }
            satirlar:
              - { tr: "Bölge: Kıyıkent · Kordon, Eski Şehir. Süre: 72 saat. Yarıçap: genişliyor.", en: "Zone: Port Harlow · Esplanade, Old Town. Duration: 72 hours. Radius: expanding." }
              - { tr: "Not: Örnekleme, Kadim Elçiliği'nin talebiyle yapılmaktadır. Sistem tarafsızdır.", en: "Note: Sampling conducted at the request of the Ancient Embassy. The System is neutral." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Yarıçap saatte bir sokak büyüyor. Akşama Kordon yolu da içinde kalacak; son vapur iskeleden o zamana kadar kalkmazsa hiç kalkmaz.", en: "The radius grows one street an hour. By evening the Esplanade road will be inside it. If the last ferry isn't off the pier by then, it isn't leaving." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u bir ölçüm değil. bu bir terazi. birileri sizi tartıyor, kilo kilo.", en: "t̷his isn't a measurement. it's a scale. somebody's weighing you, pound by pound." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Triyajı ben yaparım; yolu sen açık tut. Bunu daha önce de yaptık. Daha küçüğünü.\"", en: "\"I'll run triage. You keep the road open. We've done this before. Smaller.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On dört bin. Ben her birini taşırım. Ciddiyim. Gerekirse taşırım.\"", en: "\"Fourteen thousand. I'll carry every one. I mean it. If that's what it takes.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Sütunu yıkmak, on dört bin kişiyi taşımaktan kolay. Ben hesap yaptım. Sen de yap.\"", en: "\"Knocking that pillar down is easier than moving fourteen thousand people. I did the math. You do it too.\"" }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "\"Önce çocuklar ve hastalar.\"", en: "\"Kids and the sick go first.\"" }
            etkiler:
              - bayrak: "tahliye_once_cocuklar"
              - ahlak: { merhamet: 5, duzen: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Tahliyede önce çocukları ve hastaları yola çıkardın; sütunun gölgesinden ilk geçenler en küçükler oldu.", en: "In the evacuation, you sent the kids and the sick out first. The smallest ones were the first to make it out of the pillar's shadow." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "savascilar"
            etiket: { tr: "\"Önce savaşabilenler. Onlar diğerlerini korur.\"", en: "\"Fighters first. They'll protect the rest.\"" }
            etkiler:
              - bayrak: "tahliye_once_savascilar"
              - ahlak: { duzen: 4, merhamet: -4 }
              - itibar: { lonca: 3 }
              - iliski: { elif_sari: { guven: -4 } }
            kronik: { tr: "Tahliyede önce savaşabilenleri kurtardın; Liman'ın ordusu sağ çıktı, okul yolu ise geç kaldı.", en: "In the evacuation, you saved the fighters first. The Waterfront's army got out alive. The school's column got out late." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "herkes"
            etiket: { tr: "\"Herkes aynı anda. Yolu ben açık tutarım.\"", en: "\"Everybody at once. I'll keep the road open.\"" }
            etkiler:
              - bayrak: "tahliye_herkes"
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { siginak: 2 }
            kronik: { tr: "On dört bin kişiyi tek bir yoldan aynı anda geçirdin; Kordon o gün bir nehir gibi aktı.", en: "You pushed fourteen thousand people down one road at the same time. The Esplanade ran like a river that day." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "sutun"
            tur: "gosteris"
            etiket: { tr: "Sütuna yürü. Ölçümü sen durdur.", en: "Walk to the pillar. Stop the measuring yourself." }
            gerekli: { stat: { str: 150 } }
            etkiler:
              - dikkat: 6
              - ahlak: { merhamet: 2, insanlik: -1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Tahliyeyi beklemedin; doğrudan Kadimler'in sütununa yürüdün.", en: "You didn't wait for the evacuation. You walked straight at the Ancients' pillar." }
            sonraki: "siginak_3_tahliye_sutun"
          - id: "lonca"
            etiket: { tr: "Lonca'nın kamyonlarını kirala", en: "Rent the Guild's trucks" }
            etkiler:
              - bayrak: "tahliye_lonca"
              - degisken: { lonca_golgesi: 2 }
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 4 }
            kronik: { tr: "Tahliye için Lonca'nın kamyonlarını kiraladın; Lonca bunu Konsey'in borç defterine kalın harflerle yazdı.", en: "You rented the Guild's trucks for the evacuation. The Guild wrote it into the Council's debt ledger in big letters." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|den} örneklemeyi durdurmasını iste", en: "Ask {npc:thessar} to stop the sampling" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -2 }
            kronik: { tr: "Kıyıkent'in tahliyesinde Kadim elçisinin kapısını çaldın.", en: "In the middle of Port Harlow's evacuation, you knocked on the Ancient envoy's door." }
            sonraki: "siginak_3_tahliye_thessar"

      - id: "siginak_3_tahliye_thessar"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:thessar} gelmiyor; görüntüsü geliyor. Bekleme salonunun ortasında, plastik koltukların üstünde, iki insan boyunda, ışıktan bir siluet beliriyor ve salondaki çocuklar annelerinin eteklerine sığınıyor.", en: "{npc:thessar} doesn't come. His image does. In the middle of the waiting hall, above the plastic seats, a figure made of light appears, twice as tall as a man, and every kid in the room ducks behind their mother." }
          - { tr: "\"Örnekleme pazarlık konusu değildir,\" diyor; sesi bir orgun en alt notası gibi. \"Ama her kuralın bir fiyatı vardır. Bana bir liste ver: Liman'daki herkesin adı ve seviyesi. Karşılığında sütun yirmi dört saat bekler.\"", en: "\"Sampling is not negotiable,\" he says, his voice like the bottom note of a pipe organ. \"But every rule has a price. Give me a list: the name and level of everyone on the Waterfront. In exchange, the pillar waits twenty-four hours.\"" }
          - { tr: "Görüntü sana dönüyor ve gözleri, ışıktan yapılmış olsalar bile, merakla kısılıyor. \"Ya da,\" diyor, \"başka bir ölçüm teklif edebilirsin.\"", en: "The image turns to you, and its eyes, even made of light, narrow with curiosity. \"Or,\" he says, \"you could offer me a different measurement.\"" }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Bir hasat listesinin ilk satırı her zaman isimlerdir. İkincisi seviyeler. Üçüncüsü, sıralama.", en: "The first column on any harvest list is names. The second is levels. The third is the order." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ seni istiyor. seni ölçmek, seni anlamak, seni bir rafa koymak. bunu biliyorum çünkü ben de istedim.", en: "h̷e wants you. to measure you, understand you, put you on a shelf. i know because i wanted it too." }
        secenekler:
          - id: "liste"
            etiket: { tr: "Listeyi ver; yirmi dört saat al", en: "Hand over the list. Buy twenty-four hours" }
            etkiler:
              - bayrak: "kadim_listesi_verildi"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: 3 }
              - ahlak: { merhamet: -2, insanlik: -4, duzen: 2 }
              - itibar: { kadimler: 5, siginak: -3 }
              - iliski: { thessar: { baglilik: 6, saygi: 3 } }
            kronik: { tr: "Yirmi dört saat için Liman'daki herkesin adını ve seviyesini Kadimler'e verdin; o liste bir daha hiç kaybolmadı.", en: "For twenty-four hours, you gave the Ancients the name and level of everyone on the Waterfront. That list never got lost again." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "reddet"
            etiket: { tr: "\"İsimler satılık değil.\"", en: "\"Names aren't for sale.\"" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 3 }
              - itibar: { siginak: 3 }
              - iliski: { thessar: { saygi: 4 } }
            kronik: { tr: "Kadim elçisine Liman'ın isimlerinin satılık olmadığını söyledin; o da bunu not etti, ilgiyle.", en: "You told the Ancient envoy the Waterfront's names weren't for sale. He made a note of that, with interest." }
            sonraki: "siginak_3_tahliye_yol"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "Kendini teklif et: \"Ölçmek istediğin benim.\"", en: "Offer yourself: \"I'm the one you want to measure.\"" }
            gerekli: { stat: { cha: 160 } }
            etkiler:
              - bayrak: "thessar_seni_olctu"
              - dikkat: 6
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, insanlik: -2 }
              - itibar: { siginak: 4 }
              - iliski: { thessar: { baglilik: 4, saygi: 6 } }
            kronik: { tr: "Sütunu durdurmak için kendini Kadim elçisinin ölçümüne sundun; o gün ilk kez bir insan onun ilgisini kalabalıktan uzağa çekti.", en: "To stop the pillar, you offered yourself up to the Ancient envoy's measurements. For the first time, a human pulled his attention away from the crowd." }
            sonraki: "siginak_3_tahliye_yol"

      - id: "siginak_3_tahliye_yol"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon} boyunca insanlar yürüyor: bebek arabaları, el arabaları, sırtında yatak taşıyan bir adam, kucağında kedisiyle bir kadın. Arkalarında sütun, sabah güneşinde bile beyaz ve soğuk, sanki havaya oyulmuş bir delik gibi duruyor.", en: "People are walking the length of the {yer:kordon}: strollers, wheelbarrows, a man carrying a mattress on his back, a woman with a cat in her arms. Behind them stands the pillar, white and cold even in the morning sun, like a hole cut in the air." }
          - metin: { tr: "Önde, ellerinde birbirlerinin montlarının eteklerini tutan çocuklar yürüyor; bir öğretmen en öndekinin elini bırakmıyor.", en: "Up front, kids walk holding onto each other's coat hems, and a teacher won't let go of the first kid's hand." }
            kosul: { bayrak: "tahliye_once_cocuklar" }
          - metin: { tr: "Önde, silahlı, düzenli bir kol yürüyor. Okulun kolu en arkada; öğretmen çocukları saymaya çalışıyor ve her seferinde farklı bir sayı buluyor.", en: "Up front, an armed, orderly column. The school's column is way at the back, and the teacher keeps counting the kids and getting a different number every time." }
            kosul: { bayrak: "tahliye_once_savascilar" }
          - metin: { tr: "Yol bir insan nehri. Herkes aynı anda yürüyor, herkes aynı anda bağırıyor; ama herkes yürüyor.", en: "The road is a river of people. Everybody walking at once, everybody yelling at once, but everybody's walking." }
            kosul: { bayrak: "tahliye_herkes" }
          - { tr: "Sonra gökten ilk toplayıcı iniyor: camdan ve kemikten yapılmış, bir araba büyüklüğünde bir yusufçuk. Kalabalığın üstünde asılı kalıyor, en yüksek seviyeli kişiyi seçiyor ve onu bir ışık huzmesinin içine alıp yukarı kaldırıyor.", en: "Then the first harvester comes down out of the sky: a dragonfly the size of a sedan, built out of glass and bone. It hangs over the crowd, picks out the highest-level person below, wraps them in a beam of light, and lifts them up." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Toplayıcısı ×7", en: "[ANALYSIS] Harvester ×7" }
            satirlar:
              - { tr: "Hedef seçimi: en yüksek seviye önce.", en: "Target selection: highest level first." }
              - { tr: "Bölgedeki en yüksek seviye: sen.", en: "Highest level in the zone: you." }
        sezgiler:
          - kosul: { stat: { agi: 120 } }
            metin: { tr: "Toplayıcılar hedef seçerken bir saniye duruyor. Bir saniye, senin için uzun bir süre.", en: "The harvesters freeze for one second when they pick a target. One second is a long time, for you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kalabalığın üstüne atla; toplayıcıları indir", en: "Jump the crowd. Bring the harvesters down" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["hasat_toplayici@dunya", "hasat_toplayici@dunya", "hasat_toplayici@dunya-10"], kazan: "siginak_3_tahliye_iskele", kaybet: "siginak_3_tahliye_yol_bedel", kac: "siginak_3_tahliye_yol_bedel" }
            kronik: { tr: "Kordon'daki tahliyede Kadim toplayıcılarını kalabalığın üstünde, tek tek indirdin.", en: "During the Esplanade evacuation, you brought the Ancients' harvesters down over the crowd, one by one." }
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Kimse görmeden, birer saniyede, hepsini indir", en: "Drop them all, one second each, before anyone sees" }
            gerekli: { stat: { agi: 120 } }
            etkiler:
              - gizle: 3
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 3, insanlik: 2 }
            kronik: { tr: "Toplayıcıları o kadar hızlı indirdin ki Kordon'daki kimse ne olduğunu görmedi; yalnızca camın düşüşünü duydular.", en: "You dropped the harvesters so fast nobody on the Esplanade saw what happened. They only heard glass hitting the ground." }
            sonraki: "siginak_3_tahliye_iskele"
          - id: "cek"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni aç; bütün toplayıcıları kendine çek", en: "Open up your level. Draw every harvester to you" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, insanlik: -1 }
              - itibar: { siginak: 4 }
              - savas: { dusmanlar: ["hasat_toplayici@dunya+10", "hasat_toplayici@dunya+10", "hasat_toplayici@dunya+10"], kazan: "siginak_3_tahliye_iskele", kaybet: "siginak_3_tahliye_yol_bedel", kac: "siginak_3_tahliye_yol_bedel" }
            kronik: { tr: "Gerçek seviyeni açıp Kordon'un üstündeki bütün Kadim toplayıcılarını kendine çektin; o gün yoldan kimse alınmadı.", en: "You opened up your real level and pulled every Ancient harvester over the Esplanade onto yourself. Nobody got taken off the road that day." }
          - id: "ihtiyar"
            etiket: { tr: "Evinden çıkmayan yaşlı adamı sırtına al", en: "Put the old man who won't leave his house on your back" }
            etkiler:
              - bayrak: "ihtiyar_tasindi"
              - degisken: { hayatta_kalan: -1 }
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Toplayıcılar kalabalıktan insan seçerken sen evinden çıkmak istemeyen bir ihtiyarı sırtında taşıdın.", en: "While the harvesters picked people out of the crowd, you carried an old man who didn't want to leave home on your back." }
            sonraki: "siginak_3_tahliye_iskele"

      - id: "siginak_3_tahliye_yol_bedel"
        yer: "kordon"
        paragraflar:
          - { tr: "Toplayıcılardan biri seni ışığın içine alıyor ve bir an yukarıdasın: altında Kordon, bir karınca yolu gibi. Sonra ışık seni tükürüyor; senden hoşlanmamış, ya da seni taşıyamamış.", en: "One of the harvesters wraps you in its light and for a second you're up high, the Esplanade below you like an ant trail. Then the light spits you out. Either it didn't like you or it couldn't lift you." }
          - { tr: "Yere çakıldığında yol çoktan seyrelmiş. Kırk kişi ışığın içinde, gökyüzüne doğru küçülüyor. Bir kadın birinin adını bağırıyor, durmadan.", en: "By the time you hit the pavement, the road has thinned out. Forty people are shrinking into the sky inside the light. A woman is screaming somebody's name, over and over." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve kalanları iskeleye sür", en: "Get up and push the rest toward the pier" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 2 }
              - ahlak: { duzen: 3, merhamet: 1 }
            kronik: { tr: "Kordon'da kırk kişi gökyüzüne alındı; sen yerden kalkıp kalanları iskeleye sürdün.", en: "Forty people were taken up into the sky on the Esplanade. You got up off the ground and drove the rest to the pier." }
            sonraki: "siginak_3_tahliye_iskele"
          - id: "kadin"
            etiket: { tr: "Bağıran kadının yanına git", en: "Go to the screaming woman" }
            etkiler:
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 2 }
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Toplayıcılar kırk kişiyi götürdüğünde sen bağıran bir kadının yanında durdun.", en: "When the harvesters took forty people, you stood beside a woman who was screaming." }
            sonraki: "siginak_3_tahliye_iskele"

      - id: "siginak_3_tahliye_iskele"
        yer: "kordon"
        paragraflar:
          - { tr: "Kordon İskelesi'nde son vapur yanaşmış; güvertesi o kadar dolu ki suyun içine bir karış gömülmüş. İskelede hâlâ iki yüz kişi var.", en: "The last ferry is tied up at the Esplanade pier, so overloaded it's riding a foot low in the water. There are still two hundred people on the dock." }
          - { tr: "Rıza Reis kaptan köşkünden sarkıyor. \"Bir sefer daha intihar,\" diyor. \"Yarıçap bir saate iskeleye varır. Gidip gelmem bir buçuk saat.\" Arkasında sütun, sanki yaklaşmıyormuş gibi, sabırla bekliyor.", en: "Skipper Reese leans out of the wheelhouse. \"One more run is suicide,\" he says. \"The radius hits this pier in an hour. Round trip's an hour and a half.\" Behind him, the pillar waits patiently, like it isn't getting any closer." }
          - metin: { tr: "Kadim'in yirmi dört saati iskeleye fazladan bir sefer kazandırıyor; ama Liman'da herkes, o saatin neyle satın alındığını biliyor.", en: "The Ancient's twenty-four hours buys the pier one extra run. Everybody on the Waterfront knows what it was bought with." }
            kosul: { bayrak: "kadim_listesi_verildi" }
        sezgiler:
          - kosul: { stat: { end: 180 } }
            metin: { tr: "Vapurun motoru zayıf ama gövdesi sağlam. Biri onu arkadan iterse sefer yarı sürede biter.", en: "The ferry's engine is weak but the hull is solid. If somebody pushed it from behind, the run would take half as long." }
        secenekler:
          - id: "sefer"
            etiket: { tr: "\"Bir sefer daha. Sütunu ben tutarım.\"", en: "\"One more run. I'll hold off the pillar.\"" }
            etkiler:
              - bayrak: "son_sefer_yapildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, duzen: -1 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Son vapura bir sefer daha yaptırdın ve sütunun önüne kendin geçtin.", en: "You had the last ferry make one more run and put yourself in front of the pillar." }
            sonraki: "siginak_3_tahliye_sutun"
          - id: "it"
            tur: "gosteris"
            etiket: { tr: "Suya gir ve vapuru sırtınla it", en: "Get in the water and push the ferry yourself" }
            gerekli: { stat: { end: 180 } }
            etkiler:
              - bayrak: "son_sefer_yapildi"
              - dikkat: 5
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 4, insanlik: -1 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Dolu bir vapuru körfezin öbür yakasına sırtınla ittin; o gün iskelede kimse kalmadı.", en: "You pushed a loaded ferry across the bay on your own back. Nobody got left on that pier." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "tepe"
            etiket: { tr: "Kalanları Tepe'ye yürüt", en: "March the rest up to the Heights" }
            etkiler:
              - bayrak: "tepeye_yuruyenler"
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 1, duzen: 1 }
              - itibar: { yukselenler: 3 }
            kronik: { tr: "İskelede kalan iki yüz kişiyi Tepe'ye, Yükselenler'in kapısına yürüttün; kaçının 'yakıt' listesine yazıldığını hiç öğrenmedin.", en: "You marched the two hundred left on the pier up to the Heights, to the Ascended's gate. You never found out how many of them ended up on the \"fuel\" list." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "kalk"
            etiket: { tr: "\"Kalanlar kalır. Vapur kalkıyor.\"", en: "\"Whoever's left stays. The ferry's leaving.\"" }
            etkiler:
              - bayrak: "iskele_terk"
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -6, duzen: 3 }
              - itibar: { siginak: -4 }
            kronik: { tr: "Son vapuru iki yüz kişiyi iskelede bırakarak kaldırdın; o iskeleye bir daha kimse yanaşmadı.", en: "You sent the last ferry off and left two hundred people on the pier. Nobody ever tied up at that dock again." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_sutun"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütunun dibinde hava kristal gibi; her adımında ayaklarının altında bir şey çatırdıyor. Meydanda, kaçmaya yetişemeyenler heykeller gibi duruyor; her birinin başının üstünde Sistem penceresi açık ve bir sayı geri sayıyor.", en: "At the base of the pillar the air is like crystal. Something crackles under your feet with every step. In the square, the people who didn't get away in time stand like statues, every one with a System window open over their head and a number counting down." }
          - { tr: "Sütunun yüzeyinde satırlar akıyor; bir dil, ama okunmaya değil, uygulanmaya yazılmış. Sen yaklaştıkça satırlar yavaşlıyor, sonra duruyor ve sütun, sana doğru, kollar açıyor.", en: "Lines are scrolling down the pillar's surface, some kind of language, written to be executed rather than read. The closer you get, the slower they scroll. Then they stop, and the pillar opens arms toward you." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Sütunu · Örnekleme aracı", en: "[ANALYSIS] Harvest Pillar · Sampling instrument" }
            satirlar:
              - { tr: "Durum: anomali tespit edildi. Örnekleme önceliği değiştirildi.", en: "Status: anomaly detected. Sampling priority reassigned." }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Satırların arasında tekrar eden bir döngü var. O döngünün sonuna bir hata koyarsan, sütun kendi ağırlığını taşıyamaz.", en: "There's a loop repeating between the lines. Slip an error in at the end of it and the pillar can't hold its own weight." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u satırları tanıyorum. ben bunlardan birinin yarısıydım.", en: "i̷ know these lines. i used to be half of one." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sütunla göğüs göğüse dövüş", en: "Fight the pillar head-on" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+4"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadimler'in hasat sütunuyla Eski Şehir'in meydanında göğüs göğüse dövüştün.", en: "You fought the Ancients' harvest pillar head-on in the Old Town square." }
          - id: "satir"
            etiket: { tr: "Satırları oku; döngünün sonuna bir hata koy", en: "Read the lines. Slip an error into the loop" }
            gerekli: { stat: { int: 150 } }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+1"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadim sütununun kendi satırlarına bir hata yazdın ve onu kendi ağırlığıyla çökerttin.", en: "You wrote an error into the Ancient pillar's own lines and let it collapse under its own weight." }
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} satırları okut", en: "Let {npc:yanki} read the lines" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { yanki: { guven: 4 } }
              - savas: { dusmanlar: ["hasat_sutunu@oyuncu+2"], kazan: "siginak_3_tahliye_sutun_zafer", kaybet: "siginak_3_tahliye_sutun_yenilgi", kac: "siginak_3_tahliye_sutun_yenilgi" }
            kronik: { tr: "Kadim sütununun satırlarını kafandaki sese okuttun; ses o satırları tanıdığını söyledi.", en: "You let the voice in your head read the Ancient pillar's lines. It said it recognized them." }

      - id: "siginak_3_tahliye_sutun_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütun yukarıdan aşağıya çatlıyor; bir buz dağının denize kopması gibi, ağır ve sessiz. Parçalar meydana düşmeden havada eriyip beyaz bir toza dönüşüyor.", en: "The pillar cracks from top to bottom, heavy and silent, like an iceberg calving into the sea. The pieces melt into white dust in midair before they hit the square." }
          - { tr: "Heykel gibi duran insanlar bir anda nefes alıyor. Başlarının üstündeki pencereler kapanıyor; bir kadın dizlerinin üstüne çöküp ağlamaya başlıyor, bir adam ne olduğunu sormak için ağzını açıyor ve hiçbir şey soramıyor.", en: "The people standing like statues all breathe in at once. The windows over their heads blink shut. A woman drops to her knees and starts to cry. A man opens his mouth to ask what happened and can't get a single question out." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[ÖRNEKLEME İPTAL EDİLDİ]", en: "[SAMPLING CANCELED]" }
            satirlar:
              - { tr: "Neden: örnekleme aracı imha edildi.", en: "Reason: sampling instrument destroyed." }
              - { tr: "Not: Bu bir ilk. Kadim Elçiliği bilgilendirildi.", en: "Note: This is a first. The Ancient Embassy has been notified." }
        secenekler:
          - id: "heykeller"
            etiket: { tr: "Uyananları tek tek iskeleye taşı", en: "Carry the ones who woke up to the pier, one by one" }
            etkiler:
              - bayrak: "hasat_sutunu_yikildi"
              - degisken: { kadim_tehdit: -5, hayatta_kalan: 3 }
              - esya: { hasat_kristali: 1 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 5, kadimler: -5 }
            kronik: { tr: "Kadimler'in sütununu yıktın ve onun dondurduğu insanları kendi ellerinle iskeleye taşıdın.", en: "You brought down the Ancients' pillar and carried the people it had frozen to the pier with your own hands." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "parca"
            etiket: { tr: "Sütunun çekirdeğini sök; Kadimler bunu görsün", en: "Rip out the pillar's core. Let the Ancients see it" }
            etkiler:
              - bayrak: "hasat_sutunu_yikildi"
              - degisken: { kadim_tehdit: -6, hayatta_kalan: 2 }
              - esya: { hasat_kristali: 2 }
              - dikkat: 3
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { kadimler: -8, siginak: 3 }
            kronik: { tr: "Kadimler'in sütununun çekirdeğini söküp körfezdeki gemiye doğru kaldırdın; gemi o gün ilk kez geri çekildi.", en: "You tore out the Ancient pillar's core and held it up toward the ship in the bay. For the first time, the ship pulled back." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_sutun_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sütunun kollarından biri seni meydanın öbür ucuna fırlatıyor. Kalktığında satırlar yeniden akıyor; hızlı, sanki kaybettiği zamanı telafi etmek istiyormuş gibi.", en: "One of the pillar's arms throws you clear across the square. By the time you're up, the lines are scrolling again, fast, like it wants to make up for lost time." }
          - { tr: "Akşamüstü sütun kendiliğinden yükseliyor ve gökyüzüne geri çekiliyor. Meydandaki insanlar uyanıyor; sağlar, ama pencerelerinde, hiçbirinin silemediği yeni bir satır var: [ÖRNEKLENDİ].", en: "Late in the afternoon the pillar lifts itself out of the ground and pulls back into the sky. The people in the square wake up. They're fine. But there's a new line on their windows that none of them can delete: [SAMPLED]." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Örneklenenlerin adlarını tek tek kaydet", en: "Write down the name of every sampled person" }
            etkiler:
              - bayrak: "orneklenenler"
              - degisken: { kadim_tehdit: 3, hayatta_kalan: -2 }
              - ahlak: { duzen: 3, insanlik: 2 }
            kronik: { tr: "Kadim sütununun damgaladığı her insanın adını kaydettin; o liste, öbür listeye karşı tek kalkanınız oldu.", en: "You wrote down the name of every person the Ancient pillar branded. That list became your only shield against the other one." }
            sonraki: "siginak_3_tahliye_bitis"
          - id: "yumruk"
            etiket: { tr: "Gökyüzüne bak ve bir dahaki sefere söz ver", en: "Look up at the sky and promise there'll be a next time" }
            etkiler:
              - bayrak: "orneklenenler"
              - degisken: { kadim_tehdit: 3, hayatta_kalan: -2 }
              - ahlak: { merhamet: 1, duzen: -1 }
            kronik: { tr: "Geri çekilen sütunun ardından gökyüzüne bir söz verdin.", en: "As the pillar pulled back into the sky, you made the sky a promise." }
            sonraki: "siginak_3_tahliye_bitis"

      - id: "siginak_3_tahliye_bitis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece, Liman'ın konteyner sahası bir şehre dönmüş. Konteynerlerin arasına çadırlar kurulmuş, vinçlerin kollarından çamaşır ipleri sarkıyor; on dört bin kişi, iki gün önce on iki bin kişinin sığmadığı bir yere sığmaya çalışıyor.", en: "By nightfall the Waterfront's container yard has turned into a city. Tents between the stacks, laundry lines hanging off the crane arms. Fourteen thousand people trying to fit into a place where twelve thousand didn't fit two days ago." }
          - metin: { tr: "Rıhtımda {npc:elif_sari} gelenleri karşılıyor, bir el feneri ve bir rulo bantla. Kırmızı, sarı, yeşil. Bu gece hiç siyah bant kullanmıyor; bunu sana sonradan, gururla değil, şaşkınlıkla söyleyecek.", en: "{npc:elif_sari} is on the quay meeting every arrival with a flashlight and a roll of tape. Red, yellow, green. She doesn't use the black tape once tonight. She'll tell you that later, not proud, just stunned." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Okulun kolundan dört çocuk eksik. Öğretmen onların adlarını konteynerlerden birinin kapısına tebeşirle yazıyor.", en: "The school's column came in four kids short. The teacher writes their names in chalk on the door of one of the containers." }
            kosul: { bayrak: "tahliye_once_savascilar" }
          - metin: { tr: "Kordon İskelesi'nden son gelen haber kısa: sütun çekildikten sonra iskeleye gidenler orada kimseyi bulamamış.", en: "The last word from the Esplanade pier is short: after the pillar pulled back, the people who went down there didn't find anybody." }
            kosul: { bayrak: "iskele_terk" }
          - { tr: "Konteynerlerin arasında yürürken, karanlık bir köşede, Lonca bantlı üç adamın Konsey'in silah deposuna bakıp alçak sesle konuştuğunu görüyorsun. Biri Pala.", en: "Walking between the stacks, you spot three men in Guild armbands in a dark corner, looking at the Council's armory and talking low. One of them is Cleaver." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Dudaklarını okuyabiliyorsun: 'Kargaşa iyi. Kargaşada kimse kimin kapıyı açtığını sormaz. Demir Gece.'", en: "You can read their lips: \"Chaos is good. In chaos nobody asks who opened the door. Iron Night.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Gölgede kal; Pala'nın adamlarını dinle", en: "Stay in the shadows. Listen to Cleaver's men" }
            gerekli: { stat: { per: 120 } }
            etkiler:
              - bilgi: "demir_gece_plani"
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 20, max: 40 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Tahliyenin gecesinde Lonca'nın bir darbe planladığını, daha kimse bilmezken öğrendin.", en: "On the night of the evacuation, you learned the Guild was planning a coup before anyone else knew." }
            sonraki: "@akis"
          - id: "kamp"
            etiket: { tr: "Konteyner sahasında sabaha kadar çadır kur", en: "Pitch tents in the container yard till morning" }
            etkiler:
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 3 } }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 25, max: 50 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Tahliyenin gecesini on dört bin kişiye çadır kurarak geçirdin.", en: "You spent the night after the evacuation pitching tents for fourteen thousand people." }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "Gelen herkesi kayda geçir; kimse kaybolmasın", en: "Log every arrival. Nobody gets lost" }
            etkiler:
              - bayrak: "siginak_3_bitti"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 7 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 25, max: 50 }, kosul: { perde: 3, bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Tahliyede Liman'a gelen herkesin adını tek tek kaydettin; o deftere sonradan Kıyıkent'in nüfus kütüğü dendi.", en: "You logged the name of every evacuee who reached the Waterfront. That notebook later became Port Harlow's official census." }
            sonraki: "@akis"

  # ================================================================== ELİF 3 — LONCA DARBESİ / DEMİR GECE (P3; Elif ölebilir)
  # Lonca'nın şahinleri (Pala) Konsey'in son kalesine, Gümrük'teki hastaneye yürür. ihanet_kaya varsa bu, Parti J'nin büyük
  # ihanetinin ardından gelen gecedir; yoksa Pala Kaya'nın sessizliğine güvenerek kendi başına davranır. Tohum: tahliye, gece nöbeti.
  - id: "elif_lonca_darbesi"
    perde: [3]
    gun: { min: 232, max: 328 }
    agirlik: 7
    kosul: { bayrak: "siginak_1_goruldu", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] }
    etiketler: ["siginak", "lonca", "npc", "darbe"]
    gerilim: 4
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Demir Gece", en: "Iron Night" }
    sahne: "elif_lonca_darbesi_1"
    sahneler:
      - id: "elif_lonca_darbesi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece ikide kapın yumruklanıyor. Başhemşire Nurhan, önlüğünün üstüne bir mont geçirmiş, nefes nefese: \"Gümrük'ü sardılar. Lonca. Pala başlarında. Teslim olmazsak gaz atacaklarmış.\"", en: "At two in the morning somebody pounds on your door. It's Nora, the head nurse, a parka thrown on over her scrubs, out of breath. \"They've surrounded the Customs House. The Guild. Cleaver's leading them. They say if we don't surrender, they'll gas us out.\"" }
          - metin: { tr: "{npc:kaya_demir|in} darbesinden bu yana Liman'da Konsey'in elinde tek bir yer kaldı: Gümrük'teki koğuş. {npc:elif_sari} ilaç deposunu ve yaralı Konsey nöbetçilerini vermeyi reddediyor. Pala bu gece işi bitirmeye gelmiş.", en: "Since {npc:kaya_demir|pos} coup, the Council has held exactly one place on the Waterfront: the ward in the Customs House. {npc:elif_sari} refuses to hand over the medicine stores or the wounded Council guards. Cleaver came tonight to finish it." }
            kosul: { bayrak: "ihanet_kaya" }
          - metin: { tr: "Lonca'nın şahinleri bu gece Konsey'i almaya karar vermiş. {npc:kaya_demir} ne evet demiş ne hayır; sessizliği Pala'ya yetmiş.", en: "The Guild's hawks decided tonight was the night to take the Council. {npc:kaya_demir} didn't say yes. He didn't say no. For Cleaver, his silence was enough." }
            kosul: { bayrak_yok: "ihanet_kaya", npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:kaya_demir} öldüğünden beri Lonca'yı tutan bir el yok. Pala bunu bir fırsat bilmiş.", en: "Since {npc:kaya_demir} died, there's been no hand on the Guild's leash. Cleaver took that as an invitation." }
            kosul: { bayrak_yok: "ihanet_kaya", npc_olu: "kaya_demir" }
          - { tr: "Aynı anda {yer:kiyikent_iskele} tarafından da silah sesleri geliyor; Konsey üyeleri bu gece orada toplanmıştı. İki yer, iki yön ve bir gece.", en: "At the same time, gunfire starts up from the direction of the {yer:kiyikent_iskele}, where the Council was meeting tonight. Two places, two directions, one night." }
          - metin: { tr: "{npc:elif_sari} çantasını çoktan kapmış, kapıdan çıkıyor. \"Hastalarım,\" diyor yalnızca ve koşmaya başlıyor; seni beklemiyor.", en: "{npc:elif_sari} has already grabbed her bag and is out the door. \"My patients,\" is all she says, and she starts running. She doesn't wait for you." }
            kosul: { yoldas: "elif_sari" }
        sezgiler:
          - kosul: { bilgi: "demir_gece_plani" }
            metin: { tr: "Bunu biliyordun. Pala'nın kolu Gümrük'e balık halinin arkasından gidecek; orası dar, karanlık ve tek çıkışlı.", en: "You knew this was coming. Cleaver's column will hit the Customs House by way of the alley behind the fish market. It's narrow, dark, and has one way out." }
          - kosul: { stat: { per: 200 } }
            metin: { tr: "İskele'deki silah sesleri düzenli; bir baskın değil, bir gözdağı. Gümrük'ten ise ses gelmiyor. Asıl iş orada.", en: "The shots at the Ferry Terminal are too regular. That isn't a raid, it's a show. Nothing at all is coming from the Customs House. That's where the real work is." }
          - kosul: { bayrak: "elif_ask" }
            anlati: true
            metin: { tr: "Bir an Gümrük'ün çatısını düşünüyorsun; şafağı, bir omzu, bir saati. Sonra düşünmeyi bırakıp ayakkabılarını giyiyorsun.", en: "For a second you think about the Customs House roof. The dawn, a shoulder, an hour. Then you stop thinking and pull on your boots." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷ki yer. bir sen. sistem bunu bir triyaj olarak sunuyor. ben sunmuyorum. ben sadece izliyorum.", en: "t̷wo places. one you. the System is presenting this as triage. i'm not presenting anything. i'm just watching." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sen hekimi al. İskele'yi ben tutarım. Tutamazsam... bir şekilde tutarım.\"", en: "\"You get the doctor. I'll hold the Terminal. And if I can't... I'll hold it anyway.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İnsanlar insanlarla savaşıyor, gökte Kadim gemisi varken. Bu türün hasat edilmesi için başka gerekçeye gerek yok.\"", en: "\"Humans fighting humans, with an Ancient ship in the sky. If anybody needed a reason to harvest this species, there it is.\"" }
        secenekler:
          - id: "hastane"
            etiket: { tr: "Gümrük'e koş", en: "Run for the Customs House" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Demir Gece'de önce hastaneye koştun.", en: "On Iron Night, you ran for the hospital first." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "iskele"
            etiket: { tr: "İskele'ye koş; Konsey'i kurtar", en: "Run for the Terminal. Save the Council" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Demir Gece'de hastaneyi değil, Konsey'i seçtin.", en: "On Iron Night, you chose the Council over the hospital." }
            sonraki: "elif_lonca_darbesi_iskele"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "İkisine birden yetiş", en: "Be in both places at once" }
            gerekli: { stat: { agi: 250 } }
            etkiler:
              - bayrak: "konsey_kurtarildi"
              - dikkat: 6
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Demir Gece'de Liman'ı o kadar hızlı geçtin ki hem Konsey'i hem hastaneyi kurtardın; şahitler seni iki yerde birden gördüklerine yemin etti.", en: "On Iron Night you crossed the Waterfront so fast you saved both the Council and the hospital. Witnesses swore they saw you in two places at once." }
            sonraki: "elif_lonca_darbesi_hastane"
          - id: "pusu"
            etiket: { tr: "Pala'yı balık halinin arkasında, yolda karşıla", en: "Meet Cleaver in the alley behind the fish market" }
            goster: { bilgi: "demir_gece_plani" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
            kronik: { tr: "Demir Gece'nin planını önceden bildiğin için Pala'yı daha hastaneye varmadan yolda karşıladın.", en: "Because you knew Iron Night's plan ahead of time, you met Cleaver on the road before he ever reached the hospital." }
            sonraki: "elif_lonca_darbesi_pusu"
          - id: "evde"
            etiket: { tr: "Evde kal. Bu gece Lonca'nın gecesi.", en: "Stay home. Tonight belongs to the Guild." }
            goster: { itibar_min: { lonca: 30 } }
            etkiler:
              - npc_ol: "elif_sari"
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_basarili"
              - gorev: { zincir_siginak: "basarisiz" }
              - kontrol: { kiyikent_liman: "lonca" }
              - degisken: { hayatta_kalan: -3 }
              - ahlak: { merhamet: -10, duzen: 5, insanlik: -4 }
              - itibar: { siginak: -40, lonca: 15 }
            kronik: { tr: "Demir Gece'de evde kaldın; sabah Liman Lonca'nındı ve Gümrük'ün merdivenlerinde bir hekim yatıyordu.", en: "On Iron Night, you stayed home. By morning the Waterfront belonged to the Guild, and a doctor was lying on the Customs House steps." }
            sonraki: "elif_lonca_darbesi_sessizlik"

      - id: "elif_lonca_darbesi_hastane"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük binasının önünde yirmi Lonca adamı yarım ay şeklinde dizilmiş; ellerinde kepenk kalkanları ve tarım ilacı tüplerinden bozma gaz bombaları. Pencerelere içeriden sedyeler, dolaplar, yatak çerçeveleri dayanmış.", en: "Twenty Guild men stand in a half-moon in front of the Customs House, holding storefront-shutter shields and gas bombs rigged out of crop-duster canisters. The windows are barricaded from inside with gurneys, cabinets, bed frames." }
          - { tr: "İkinci kattaki pencerelerden birinde {npc:elif_sari} duruyor; elinde bir yangın tüpü, yüzü bembeyaz ama kıpırdamıyor. Pala seni görünce iç çekiyor, bir postacının yağmura bakışı gibi.", en: "{npc:elif_sari} is standing in one of the second-floor windows with a fire extinguisher in her hands, her face dead white, not moving an inch. When Cleaver sees you he sighs, like a mailman looking at the rain." }
          - { tr: "\"İlaçları ve kaçakları ver, kimse ölmez,\" diyor yukarıya, ama gözleri sende. \"Bu gece bir fatura gecesi. Biz hep faturayı keseriz, biliyorsun.\"", en: "\"Hand over the meds and the runaways and nobody dies,\" he calls up to the window, but his eyes are on you. \"Tonight's a billing night. We always send the bill, you know that.\"" }
          - metin: { tr: "Arkanda Rıza Reis ve Konsey'in nöbetçileri var; yolda, İskele'de kurtardıkların. Yaşlı kaptan bir av tüfeğini doldururken \"Geç kalmadık,\" diyor. \"Bu sefer geç kalmadık.\"", en: "Skipper Reese and the Council guards are behind you, the ones you sprang at the Terminal on the way. The old captain is loading a shotgun. \"We're not late,\" he says. \"Not this time.\"" }
            kosul: { bayrak: "konsey_kurtarildi" }
          - metin: { tr: "Pala'nın göğsünde Pınarbaşı'nın turnikesinden sökülmüş küçük bir ekran asılı; bir madalya gibi.", en: "There's a little screen hanging on Cleaver's chest, pried off the Pinewell turnstile. He wears it like a medal." }
            kosul: { bayrak: "pala_kini" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Koğuşun içinde oksijen tüpleri var. Burada bir savaş çıkarsa ve bir gaz bombası camı kırarsa bina bir fırına döner.", en: "There are oxygen tanks inside the ward. If a fight breaks out here and one gas bomb breaks a window, this building turns into an oven." }
          - kosul: { stat: { cha: 220 } }
            metin: { tr: "Pala'nın adamlarının yarısı bu koğuşta dikilmiş. Bir kısmının yarası {npc:elif_sari|in} elinden geçmiş; bunu biliyorlar.", en: "Half of Cleaver's men have been stitched up on this ward. Some of them by {npc:elif_sari} herself. They know it." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kapının önüne geç ve savaş", en: "Get in front of the door and fight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["pala@oyuncu+2", "demir_gece_askeri@oyuncu-2", "demir_gece_askeri@oyuncu-2"], ortam: ["yanici", "karanlik"], kazan: "elif_lonca_darbesi_zafer", kaybet: "elif_lonca_darbesi_bedel", kac: "elif_lonca_darbesi_bedel" }
            kronik: { tr: "Demir Gece'de Gümrük'ün kapısının önünde Pala'nın adamlarıyla savaştın.", en: "On Iron Night, you fought Cleaver's men in front of the Customs House door." }
          - id: "silah"
            tur: "gosteris"
            etiket: { tr: "Adamlarına seslen; silahlarını bıraktır", en: "Talk to his men. Make them drop their weapons" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 5, lonca: -3 }
            kronik: { tr: "Pala'nın adamlarına kimin yaralarını diktiğini hatırlattın; Demir Gece tek kurşun atılmadan bitti.", en: "You reminded Cleaver's men whose hands had stitched them up. Iron Night ended without a single shot fired." }
            sonraki: "elif_lonca_darbesi_pala_teslim"
          - id: "seviye"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç ve kapıda dur", en: "Open up your real level and stand in the door" }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: -5 }
              - iliski: { elif_sari: { korku: 3, saygi: 4 } }
            kronik: { tr: "Gümrük'ün kapısında gerçek seviyeni açtın; Pala'nın yirmi adamı tek bir adım atamadan dağıldı.", en: "You opened up your real level in the Customs House doorway. Cleaver's twenty men scattered before any of them could take a step." }
            sonraki: "elif_lonca_darbesi_zafer"
          - id: "pazarlik"
            etiket: { tr: "Pala'yla pazarlık: ilaçlar karşılığında hastane", en: "Deal with Cleaver: the meds for the hospital" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - degisken: { lonca_golgesi: 2 }
            kronik: { tr: "Demir Gece'de hastaneyi Konsey'in ilaçlarıyla satın aldın.", en: "On Iron Night, you bought the hospital back with the Council's medicine." }
            sonraki: "elif_lonca_darbesi_pazarlik"

      - id: "elif_lonca_darbesi_pusu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balık halinin arkasındaki sokak buz kokuyor; tezgâhların altında kırık kasalar, yerde pullar. Pala'nın kolu tam beklediğin saatte, tam beklediğin sırayla geliyor ve sen onların önünde, sokağın ortasında duruyorsun.", en: "The alley behind the fish market smells like ice. Broken crates under the stalls, scales on the ground. Cleaver's column comes at exactly the time you expected, in exactly the order you expected, and you're standing in the middle of the alley in front of them." }
          - { tr: "Pala duruyor. Yüzünde ilk kez şaşkınlık var; sonra o şaşkınlık bir tür saygıya dönüyor. \"Kim sattı?\" diye soruyor. Sonra kendi sorusuna güler gibi yapıyor: \"Boş ver. Kimse satmadı. Sen duydun.\"", en: "Cleaver stops. For the first time there's surprise on his face. Then it turns into something like respect. \"Who sold us out?\" he asks. Then he half-laughs at his own question. \"Forget it. Nobody did. You heard.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sokağı kapat ve savaş", en: "Seal off the alley and fight" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - savas: { dusmanlar: ["pala@oyuncu+1", "demir_gece_askeri@oyuncu-3"], ortam: ["dar_gecit", "karanlik"], kazan: "elif_lonca_darbesi_zafer", kaybet: "elif_lonca_darbesi_bedel", kac: "elif_lonca_darbesi_bedel" }
            kronik: { tr: "Demir Gece'yi balık halinin arkasındaki dar sokakta, hastaneye tek bir adam varmadan bitirdin.", en: "You ended Iron Night in the narrow alley behind the fish market, before a single man got near the hospital." }
          - id: "geri_don"
            etiket: { tr: "\"Dön, Pala. Bu gece kimse ölmesin.\"", en: "\"Turn around, Cleaver. Nobody dies tonight.\"" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Pala'yı balık halinin arkasında tek bir cümleyle geri çevirdin; Demir Gece hiç başlamadan bitti.", en: "You turned Cleaver around behind the fish market with one sentence. Iron Night ended before it ever started." }
            sonraki: "elif_lonca_darbesi_pala_teslim"

      - id: "elif_lonca_darbesi_iskele"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonunda Lonca'nın adamları Konsey üyelerini plastik koltuklara bağlamış. Gişelerin camları kırık; kalkış panosunun harfleri yerlere saçılmış.", en: "In the {yer:kiyikent_iskele} waiting hall, Guild men have zip-tied the Council members to the plastic seats. The ticket window glass is smashed. The departures board letters are scattered all over the floor." }
          - { tr: "İş kısa sürüyor; bu adamlar senin karşında birer gölge bile değil. Rıza Reis'in bağlarını çözerken ihtiyar kaptan kolunu yakalıyor. \"Bu bir gözdağıydı,\" diyor. \"Asıl iş Gümrük'te.\"", en: "It doesn't take long. Next to you, these men aren't even shadows. As you cut Skipper Reese loose, the old captain grabs your arm. \"This was just for show,\" he says. \"The real job is at the Customs House.\"" }
          - { tr: "Pencereden bakıyorsun. Liman'ın öbür ucunda, Gümrük binasının üstünde turuncu bir ışık yükseliyor.", en: "You look out the window. At the far end of the Waterfront, an orange light is rising over the Customs House." }
        secenekler:
          - id: "kos"
            etiket: { tr: "Gümrük'e koş", en: "Run for the Customs House" }
            etkiler:
              - npc_ol: "elif_sari"
              - bayrak: "konsey_kurtarildi"
              - ahlak: { merhamet: 2, duzen: 2 }
            kronik: { tr: "Konsey'i kurtardın ve Gümrük'e koştun; yolun yarısında koşmanın artık bir anlamı kalmadığını bildin.", en: "You saved the Council and ran for the Customs House. Halfway there, you knew running didn't matter anymore." }
            sonraki: "elif_lonca_darbesi_olum"
          - id: "riza"
            etiket: { tr: "Yaralı Reis'i sırtına al ve öyle koş", en: "Get the wounded Skipper on your back and run" }
            etkiler:
              - npc_ol: "elif_sari"
              - bayrak: "konsey_kurtarildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
            kronik: { tr: "Demir Gece'de sırtında yaralı bir ihtiyarla Liman'ı boydan boya koştun; geç kaldın.", en: "On Iron Night, you ran the length of the Waterfront with a wounded old man on your back. You were too late." }
            sonraki: "elif_lonca_darbesi_olum"

      - id: "elif_lonca_darbesi_bedel"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir gaz bombası ikinci kattaki camı kırıyor ve içeriden bir öksürük dalgası yükseliyor. Sen Pala'yla boğuşurken Gümrük'ün kapısı açılıyor; {npc:elif_sari} dışarı çıkıyor, kucağında bir çocuk, çocuğun yüzünde ıslak bir bez.", en: "A gas bomb smashes a second-floor window and a wave of coughing rises inside. While you're grappling with Cleaver, the Customs House door opens and {npc:elif_sari} comes out with a kid in her arms and a wet rag over the kid's face." }
          - { tr: "Pala'nın adamlarından biri, genç ve korkmuş, tetiğe basıyor. Silah sesi sokakta yankılanıyor ve {npc:elif_sari} merdivenlerin ortasında, çocuğu hâlâ kucağında, oturuyor; sanki biraz dinlenmek istiyormuş gibi.", en: "One of Cleaver's men, young and terrified, pulls the trigger. The shot echoes down the street, and {npc:elif_sari} sits down in the middle of the steps with the kid still in her arms, like she just needed a minute's rest." }
        secenekler:
          - id: "kos"
            etiket: { tr: "Ona koş", en: "Run to her" }
            etkiler:
              - npc_ol: "elif_sari"
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Demir Gece'de Gümrük'ün merdivenlerine koştun; hekimi kurtaramadın.", en: "On Iron Night you ran for the Customs House steps. You couldn't save the doctor." }
            sonraki: "elif_lonca_darbesi_olum"
          - id: "tetik"
            etiket: { tr: "Önce tetiğe basanı yere ser", en: "Drop the kid who pulled the trigger first" }
            etkiler:
              - npc_ol: "elif_sari"
              - ahlak: { merhamet: -4, duzen: 2 }
            kronik: { tr: "Demir Gece'de önce tetiği çeken çocuğu yere serdin, sonra merdivenlere koştun.", en: "On Iron Night, you put down the boy who pulled the trigger first. Then you ran for the steps." }
            sonraki: "elif_lonca_darbesi_olum"

      - id: "elif_lonca_darbesi_olum"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} Gümrük'ün merdivenlerinde oturuyor. Önlüğünün göğsü kırmızı; elinde neşteri, ayaklarının dibinde üç Lonca adamı inliyor. Arkasındaki kapı kapalı ve koğuş sağlam; kapıyı o tutmuş.", en: "{npc:elif_sari} is sitting on the Customs House steps. The front of her coat is red. She's got her scalpel in her hand, and three Guild men are groaning at her feet. The door behind her is shut and the ward is intact. She held the door." }
          - metin: { tr: "\"Sabaha kadar kal,\" diyor, sen yanına çöktüğünde. \"Söz vermiştin. Ya da vermemiştin. Kal yine de.\"", en: "\"Stay till morning,\" she says, when you drop down beside her. \"You promised. Or you didn't. Stay anyway.\"" }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "\"Bin dört yüz...\" diyor, sen yanına çöktüğünde; bir sayıyı arıyor, buluyor. \"Bin dört yüz yedi. Beni de say.\"", en: "\"One thousand four hundred...\" she says when you drop down beside her, hunting for a number, finding it. \"One thousand four hundred and seven. Count me too.\"" }
            kosul: { bayrak: "elif_gece_nobeti_bitti", bayrak_yok: "elif_ask" }
          - metin: { tr: "\"Koğuş,\" diyor, sen yanına çöktüğünde. \"Koğuş sağlam mı?\" Başını sallıyorsun. \"İyi,\" diyor. \"İyi.\"", en: "\"The ward,\" she says when you drop down beside her. \"Is the ward okay?\" You nod. \"Good,\" she says. \"Good.\"" }
            kosul: { bayrak_yok: "elif_gece_nobeti_bitti" }
          - { tr: "Neşteri avucuna bırakıyor ve parmaklarını onun üstüne kapatıyor, bir hastaya ilaç verir gibi. Sonra saati soruyor. Söylüyorsun. Gözlerini kapatmadan önce, saati yüksek sesle tekrarlıyor; her zamanki gibi.", en: "She presses the scalpel into your palm and closes your fingers over it, the way she'd hand a patient their pills. Then she asks what time it is. You tell her. Before she closes her eyes, she repeats the time out loud. Like always." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[{npc:elif_sari|tam} · Durum: Öldü]", en: "[{npc:elif_sari|tam} · Status: Deceased]" }
            satirlar:
              - { tr: "Konsey başkanlığı: boş.", en: "Council chair: vacant." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷ayamadığım bir şey bitti. bunu nasıl kaydedeceğimi bilmiyorum. kaydetmeyeceğim.", en: "s̷omething i couldn't count just ended. i don't know how to log that. i'm not going to." }
        secenekler:
          - id: "bant"
            etiket: { tr: "Bandı kendin yapıştır; yanına bir bardak su bırak", en: "Put the tape on yourself. Leave a glass of water" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "{npc:elif_sari|in} alnına bandı kendi elinle yapıştırdın ve yanına bir bardak su bıraktın; Liman o bardağı yıllarca kimseye dokundurmadı.", en: "You put the tape on {npc:elif_sari|pos} forehead with your own hand and left a glass of water beside her. For years, the Waterfront wouldn't let anybody touch that glass." }
            sonraki: "elif_lonca_darbesi_yas"
          - id: "pala"
            etiket: { tr: "Neşteri sık ve Pala'yı bul", en: "Grip the scalpel and find Cleaver" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - ahlak: { merhamet: -4, duzen: -2 }
              - savas: { dusmanlar: ["pala@oyuncu"], ortam: ["karanlik"], kazan: "elif_lonca_darbesi_intikam", kaybet: "elif_lonca_darbesi_yas", kac: "elif_lonca_darbesi_yas" }
            kronik: { tr: "{npc:elif_sari|in} neşterini avucunda sıkıp Pala'nın peşine düştün.", en: "You closed your fist around {npc:elif_sari|pos} scalpel and went after Cleaver." }
          - id: "kogus"
            etiket: { tr: "Koğuşa gir; hastalar bekliyor", en: "Go into the ward. The patients are waiting" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - esya: { elif_nesteri: 1 }
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Hekimin ölümünün ardından onun koğuşuna girdin ve sabaha kadar onun işini yaptın; o da bunu isterdi.", en: "After the doctor died, you walked into her ward and did her job until morning. It's what she would have wanted." }
            sonraki: "elif_lonca_darbesi_yas"

      - id: "elif_lonca_darbesi_intikam"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala'yı rıhtımın ucunda, bir kayığa binmeye çalışırken yakalıyorsun. Dizlerinin üstünde, kollarını iki yana açmış; artık sakin değil.", en: "You catch Cleaver at the end of the quay, trying to get into a skiff. He's on his knees with his arms spread wide. He isn't calm anymore." }
          - { tr: "\"Ben emir vermedim,\" diyor. \"Çocuk korktu. Ben... ben faturayı kesecektim, o kadar.\" Avucundaki neşter, bir hekimin elindeki kadar temiz değil.", en: "\"I didn't give the order,\" he says. \"The kid panicked. I was... I was just going to send the bill. That's all.\" The scalpel in your hand isn't as clean as it was in a doctor's." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Faturayı sen kes", en: "You send the bill" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -6, insanlik: -2 }
              - itibar: { lonca: -10 }
            kronik: { tr: "Pala'yı rıhtımın ucunda {npc:elif_sari|in} neşteriyle öldürdün; o neşter bir daha hiçbir yarayı dikmedi.", en: "You killed Cleaver at the end of the quay with {npc:elif_sari|pos} scalpel. That scalpel never stitched another wound." }
            sonraki: "elif_lonca_darbesi_yas"
          - id: "konsey"
            etiket: { tr: "Onu Konsey'in önüne sürükle", en: "Drag him in front of the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "{npc:elif_sari|i} öldüren gecenin hesabını kanla değil, Konsey'in önünde sordun.", en: "You made the night that killed {npc:elif_sari} answer to the Council, not to your blade." }
            sonraki: "elif_lonca_darbesi_yas"

      - id: "elif_lonca_darbesi_yas"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent_iskele|in} kırık camlarının ardında Konsey yeniden toplanıyor; eksik. Panoyu çeviren çocuk harfleri yerden tek tek toplamış ve en alt satıra yalnızca bir şey yazmış: DÜN ÖLEN 1.", en: "In the morning the Council meets again behind the broken glass of the {yer:kiyikent_iskele}, short one. The kid who flips the board has picked the letters up off the floor one by one, and on the bottom line he's spelled out just one thing: DEAD YESTERDAY 1." }
          - { tr: "Kimse ismi yazmıyor. Herkes biliyor. Nurhan beyaz tahtanın köşesine siyah bir bant yapıştırıyor; altına bir şey yazmıyor, bir bardak su bırakıyor.", en: "Nobody writes the name. Everybody knows it. Nora sticks a strip of black tape in the corner of the whiteboard. She doesn't write anything under it. She leaves a glass of water." }
          - metin: { tr: "Lonca'nın adamları Liman'dan çekilmiş. Demir Gece başarısız oldu; bedeli bir hekimdi.", en: "The Guild's men have pulled out of the Waterfront. Iron Night failed. It cost them a doctor." }
            kosul: { bayrak_yok: "darbe_basarili" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Konsey'i yeniden kur; onun kurallarıyla", en: "Rebuild the Council. By her rules" }
            etkiler:
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - ahlak: { duzen: 4, merhamet: 3 }
              - itibar: { siginak: 8, lonca: -5 }
            kronik: { tr: "Hekimin ölümünden sonra Konsey'i onun kurallarıyla yeniden kurdun; siyah bant her toplantıda tahtanın köşesinde durdu.", en: "After the doctor died, you rebuilt the Council by her rules. The black tape stayed in the corner of the board at every meeting." }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Bu gece de koğuşta kal", en: "Stay on the ward tonight, too" }
            etkiler:
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Hekimin ölümünden sonraki gece onun koğuşunda nöbet tuttun, sonra bir gece daha, sonra bir gece daha.", en: "The night after the doctor died, you stood watch on her ward. Then another night. Then another." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_sessizlik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece boyunca Liman'dan sesler geliyor: önce silah, sonra cam, sonra bir süre hiçbir şey. Sen pencerenin önünde oturuyorsun ve hiçbirine gitmiyorsun.", en: "All night, sounds come off the Waterfront: gunfire, then glass, then nothing for a while. You sit at the window and don't go to any of them." }
          - { tr: "Sabah Liman Lonca bayraklarıyla uyanıyor. Kalkış panosunun en alt satırında tek bir şey yazıyor: DÜN ÖLEN 1. Gümrük'ün merdivenlerinde bir hekim yatıyor; elinde neşteri, arkasındaki kapı hâlâ kapalı.", en: "The Waterfront wakes up under Guild flags. The bottom line of the departures board says one thing: DEAD YESTERDAY 1. A doctor is lying on the Customs House steps with her scalpel in her hand, and the door behind her is still shut." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[{npc:elif_sari|tam} · Durum: Öldü]", en: "[{npc:elif_sari|tam} · Status: Deceased]" }
            satirlar:
              - { tr: "Bölge kontrolü değişti: Liman · Demir Lonca.", en: "Zone control changed: The Waterfront · Iron Guild." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Merdivenlere git ve bak", en: "Go to the steps and look" }
            etkiler:
              - xp_seviye: 20
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Demir Gece'nin sabahı, gitmediğin merdivenlere gidip baktın.", en: "On the morning after Iron Night, you went and looked at the steps you hadn't gone to." }
            sonraki: "@akis"
          - id: "donme"
            etiket: { tr: "Pencereden dön", en: "Turn away from the window" }
            etkiler:
              - xp_seviye: 20
              - ahlak: { insanlik: -3, merhamet: -1 }
            kronik: { tr: "Demir Gece'nin sabahı pencereden döndün ve bir daha o merdivenlere bakmadın.", en: "On the morning after Iron Night, you turned away from the window and never looked at those steps again." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala'nın adamları karanlığa dağılıyor; yerde gaz bombaları, kırık kalkanlar, bir postal. Pala dizlerinin üstünde, nefes nefese, sana bakıyor ve gülmeye çalışıyor; beceremiyor.", en: "Cleaver's men scatter into the dark, leaving gas bombs, broken shields, and one boot on the pavement. Cleaver's on his knees, out of breath, looking up at you and trying to laugh. He can't manage it." }
          - { tr: "Gümrük'ün kapısı açılıyor. {npc:elif_sari} merdivenlerden iniyor, elinde neşteri, önlüğü temiz. Pala'ya bakıyor, sonra sana. \"Benim hastanemde kimse ölmez,\" diyor. \"O da dahil.\"", en: "The Customs House door opens. {npc:elif_sari} comes down the steps with her scalpel in her hand and her coat clean. She looks at Cleaver, then at you. \"Nobody dies in my hospital,\" she says. \"Him included.\"" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Pala'yı Konsey'in önüne çıkar", en: "Put Cleaver in front of the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4, guven: 3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Demir Gece'nin elebaşını öldürmedin; Konsey'in önüne çıkardın.", en: "You didn't kill the man behind Iron Night. You put him in front of the Council." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "oldur"
            etiket: { tr: "Pala'yı orada, merdivenlerin dibinde bitir", en: "Finish Cleaver right there at the foot of the steps" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -6, insanlik: -2 }
              - itibar: { lonca: -10 }
              - iliski: { elif_sari: { guven: -10, korku: 6 } }
            kronik: { tr: "Pala'yı bir hekimin gözü önünde, onun hastanesinin merdivenlerinde öldürdün; hekim seni bunun için hiç affetmedi.", en: "You killed Cleaver in front of a doctor, on the steps of her hospital. She never forgave you for it." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "git"
            etiket: { tr: "\"Git. Patronuna mesajı götür.\"", en: "\"Go. Take the message to your boss.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - degisken: { lonca_golgesi: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Pala'yı salıverdin ve mesajı Lonca'ya o götürdü: Liman'ın bir kalkanı vardı.", en: "You let Cleaver go, and he carried the message back to the Guild himself: the Waterfront had a shield." }
            sonraki: "elif_lonca_darbesi_sabah"

      - id: "elif_lonca_darbesi_pala_teslim"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Önce bir kalkan yere düşüyor, sonra bir sopa, sonra bir gaz tüpü. Pala'nın adamları birer birer geri çekiliyor; bazıları başını eğmiş, bazıları Gümrük'ün pencerelerine bakıyor.", en: "First a shield hits the ground, then a bat, then a gas canister. Cleaver's men back away one at a time. Some of them have their heads down. Some of them are looking up at the Customs House windows." }
          - { tr: "Pala yalnız kalıyor. Bir süre durup bekliyor, sonra balık bıçağını kınından çıkarıp yere bırakıyor. \"Bu fatura,\" diyor, \"benim.\"", en: "Cleaver's left by himself. He stands there for a while, then draws the fish knife and sets it on the ground. \"This bill,\" he says, \"is on me.\"" }
          - { tr: "Gümrük'ün kapısı açılıyor ve {npc:elif_sari} dışarı çıkıyor; yangın tüpü hâlâ elinde, ellerinin titremesi ancak şimdi başlıyor.", en: "The Customs House door opens and {npc:elif_sari} steps out, extinguisher still in her hands. Her hands are only just now starting to shake." }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Pala'yı Konsey'e teslim et", en: "Turn Cleaver over to the Council" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Demir Gece kurşunsuz bitti ve elebaşı kendi bıçağını yere bırakıp Konsey'e teslim oldu.", en: "Iron Night ended without a shot, and the man behind it laid down his own knife and surrendered to the Council." }
            sonraki: "elif_lonca_darbesi_sabah"
          - id: "eller"
            etiket: { tr: "{npc:elif_sari|in} titreyen ellerini tut", en: "Take {npc:elif_sari|pos} shaking hands" }
            etkiler:
              - bayrak: "pala_yakalandi"
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 6, guven: 3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Demir Gece bittiğinde önce bir hekimin titreyen ellerini tuttun.", en: "When Iron Night was over, the first thing you did was hold a doctor's shaking hands." }
            sonraki: "elif_lonca_darbesi_sabah"

      - id: "elif_lonca_darbesi_pazarlik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pala gülümsüyor; bu sefer gerçekten. İlaç deposunun kasaları Gümrük'ün arka kapısından teker teker çıkıyor ve Lonca kamyonlarına yükleniyor.", en: "Cleaver smiles, and this time he means it. The crates from the medicine stores come out the Customs House back door one by one and get loaded onto Guild trucks." }
          - { tr: "{npc:elif_sari} son kasanın ardından bakıyor. \"Beni kurtardın,\" diyor, \"ve koğuşu sattın. İkisini aynı gece yapabileceğini bilmiyordum.\"", en: "{npc:elif_sari} watches the last crate go. \"You saved me,\" she says, \"and you sold my ward. I didn't know you could do both in one night.\"" }
        secenekler:
          - id: "gerekti"
            etiket: { tr: "\"Yaşaman gerekiyordu.\"", en: "\"You needed to live.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_uzlasma"
              - xp_seviye: 40
              - degisken: { hayatta_kalan: -2 }
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { siginak: -8, lonca: 6 }
              - iliski: { elif_sari: { guven: -8, baglilik: 3 } }
            kronik: { tr: "Demir Gece'de hekimi kurtardın ama koğuşun ilaçlarını Lonca'ya verdin; o kış Gümrük'te ilaçsız ölenler oldu.", en: "On Iron Night you saved the doctor but gave the ward's medicine to the Guild. That winter, people died in the Customs House for lack of it." }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "\"İlaçları geri getireceğim.\"", en: "\"I'll bring the medicine back.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_uzlasma"
              - xp_seviye: 40
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { siginak: -4, lonca: 2 }
              - iliski: { elif_sari: { guven: -3 } }
              - tohum: { olay: "pala_yargilanmasi", gecikme: { min: 3, max: 6 } }
            kronik: { tr: "Demir Gece'de verdiğin ilaçları geri getireceğine söz verdin; bu söz seni Pala'nın kapısına götürdü.", en: "On Iron Night you promised to bring back the medicine you'd handed over. That promise took you to Cleaver's door." }
            sonraki: "@akis"

      - id: "elif_lonca_darbesi_sabah"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafakta Gümrük'ün merdivenlerinde oturuyorsunuz. {npc:elif_sari} elinde bir sargı bezi, avucundaki küçük bir kesiği sarıyor; kesik o kadar küçük ki gece boyunca fark etmemişsin. O fark etmiş.", en: "At dawn the two of you are sitting on the Customs House steps. {npc:elif_sari} is wrapping a little cut on your palm with a strip of gauze. It's so small you didn't notice it all night. She did." }
          - metin: { tr: "Sargıyı bitirince elini hemen bırakmıyor. Bir an alnını omzuna dayıyor; sonra doğrulup önlüğünü düzeltiyor, sanki hiçbir şey olmamış gibi. Olmuş.", en: "When she's done, she doesn't let go of your hand right away. For a moment she rests her forehead against your shoulder. Then she straightens up and fixes her coat like nothing happened. Something did." }
            kosul: { bayrak: "elif_ask" }
          - metin: { tr: "İskele'den gelen Rıza Reis'in sesi rıhtım boyunca yankılanıyor: Konsey toplanıyor; eksiksiz.", en: "Skipper Reese's voice carries down the quay from the Terminal: the Council is meeting. Every seat filled." }
            kosul: { bayrak: "konsey_kurtarildi" }
          - { tr: "\"Bin dört yüz yedi olmadı,\" diyor {npc:elif_sari}, gökyüzüne bakarak. \"Bu gece kimse eklenmedi.\"", en: "\"It didn't hit one thousand four hundred and seven,\" {npc:elif_sari} says, looking at the sky. \"Nobody got added tonight.\"" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "Konsey'i topla; bu gece kayda geçsin", en: "Gather the Council. Put tonight on the record" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - bayrak: "konsey_kurtarildi"
              - xp_seviye: 60
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 8, lonca: -6 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Demir Gece'yi püskürttün ve Konsey'in kayıtlarına geçirdin; Liman o geceyi her yıl anmaya karar verdi.", en: "You beat back Iron Night and had it entered into the Council's record. The Waterfront decided to remember it every year." }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "\"Bu gece de buradayım.\"", en: "\"I'm here tonight, too.\"" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:elif_lonca_darbesi", agirlik: 40 }
            kronik: { tr: "Demir Gece'den sonra Gümrük'ün merdivenlerinde bir hekime 'Bu gece de buradayım' dedin; dediğin gibi oldu.", en: "After Iron Night, you told a doctor on the Customs House steps, \"I'm here tonight, too.\" You were." }
            sonraki: "@akis"
          - id: "hesap"
            etiket: { tr: "Sanayi'ye git; Lonca'ya hesap sor", en: "Go to the Ironworks. Make the Guild answer" }
            etkiler:
              - bayrak: "elif_darbe_yasandi"
              - bayrak: "darbe_puskurtuldu"
              - xp_seviye: 60
              - dikkat: 3
              - ahlak: { duzen: -1, merhamet: 1 }
              - itibar: { lonca: -10, siginak: 5 }
              - iliski: { elif_sari: { korku: 2 } }
            kronik: { tr: "Demir Gece'nin sabahı Sanayi'ye yürüyüp Lonca'ya hesap sordun; Lonca bir daha Liman'a yürümedi.", en: "The morning after Iron Night you walked into the Ironworks and made the Guild answer for it. The Guild never marched on the Waterfront again." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Pala'nın yargılanması (tohum)
  - id: "pala_yargilanmasi"
    perde: [3]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["siginak", "lonca", "konsey", "ahlak"]
    gerilim: 2
    onemli: true
    kart: { tr: "Bekleme salonunda mahkeme", en: "Court in the waiting hall" }
    sahne: "pala_yargilanmasi_1"
    sahneler:
      - id: "pala_yargilanmasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_iskele|in} bekleme salonu bir mahkemeye dönmüş. Plastik koltuklar sıra sıra, Konsey gişelerin ardında; ortada, bir bavul arabasının yanında, elleri önden bağlı Pala duruyor.", en: "The {yer:kiyikent_iskele} waiting hall has turned into a courtroom. Plastic seats in rows, the Council behind the ticket windows, and in the middle, next to a luggage cart, Cleaver, his hands tied in front of him." }
          - metin: { tr: "{npc:elif_sari} tanık olarak çağrılıyor. Kalkıp bavul arabasının yanına yürüyor ve Pala'ya bakıyor. \"Bu adamın kolunu iki kez diktim,\" diyor. \"İkisinde de ağlamadı. Dün gece ağladı.\"", en: "{npc:elif_sari} is called as a witness. She walks up next to the luggage cart and looks at Cleaver. \"I stitched this man's arm twice,\" she says. \"He didn't cry either time. Last night he cried.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Tanık sandalyesi boş. Nurhan oraya bir neşter bırakmış; Pala gözlerini ondan ayıramıyor.", en: "The witness chair is empty. Nora has left a scalpel on it, and Cleaver can't take his eyes off it." }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Konsey kararı sana bırakıyor; Demir Gece'yi durduran sendin. Salon susuyor.", en: "The Council leaves the verdict to you. You're the one who stopped Iron Night. The hall goes quiet." }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Pala ölmekten korkmuyor. Unutulmaktan korkuyor.", en: "Cleaver isn't afraid of dying. He's afraid of being forgotten." }
        secenekler:
          - id: "idam"
            etiket: { tr: "\"Demir Gece'nin bedeli bir hayat.\"", en: "\"Iron Night costs a life.\"" }
            etkiler:
              - bayrak: "pala_olduruldu"
              - ahlak: { merhamet: -5, duzen: 4 }
              - itibar: { lonca: -6, siginak: 2 }
              - iliski: { elif_sari: { guven: -6 } }
            kronik: { tr: "Pala'yı Konsey'in kararıyla idam ettirdin; Liman ilk kez kendi eliyle birini öldürdü.", en: "You had Cleaver executed by order of the Council. For the first time, the Waterfront killed someone with its own hands." }
            sonraki: "@akis"
          - id: "surgun"
            etiket: { tr: "\"Kıyıkent'ten sürülsün.\"", en: "\"He's banished from Port Harlow.\"" }
            etkiler:
              - bayrak: "pala_surgun"
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Pala'yı Kıyıkent'ten sürdün; son görüldüğünde Kordon yolunda tek başına yürüyordu.", en: "You banished Cleaver from Port Harlow. The last time anyone saw him, he was walking down the Esplanade road alone." }
            sonraki: "@akis"
          - id: "kazi"
            etiket: { tr: "\"Son Sığınak'ın kazısında çalışacak.\"", en: "\"He'll work the dig on the Last Haven.\"" }
            etkiler:
              - bayrak: "pala_kazida"
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 4, lonca: 2 }
              - iliski: { elif_sari: { saygi: 4, guven: 3 } }
            kronik: { tr: "Pala'yı Son Sığınak'ın kazısına mahkûm ettin; Demir Gece'nin elebaşı, kurtardığı ya da kurtaramadığı insanlar için kaya oydu.", en: "You sentenced Cleaver to dig out the Last Haven. The man behind Iron Night spent his days cutting rock for the people he'd tried to break." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 4 — SON SIĞINAK (P3, AY 268)
  # Kuru havuzda Son Sığınak. Duvardaki çentikler: önceki döngüden kalan bir Sığınak (bilgi onceki_siginak; Döngü sonu ipucu).
  - id: "siginak_4_son_siginak"
    perde: [3]
    gun: { min: 250, max: 320 }
    ana_yay: { gun: 268 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_3_bitti" }
    etiketler: ["siginak", "zincir", "kazi", "sir"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kuru havuz", en: "The drydock" }
    sahne: "siginak_4_son_siginak_1"
    sahneler:
      - id: "siginak_4_son_siginak_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Liman'ın tersanesindeki kuru havuz, eskiden feribotların karnının kazındığı dev bir taş çanak. Şimdi dibinde yüzlerce insan kazma sallıyor; kenarlarına iskeleler, iskelelere vinçler, vinçlere çocukların çamaşırları asılmış.", en: "The drydock in the Waterfront shipyard used to be where they scraped the barnacles off ferry hulls, a giant stone bowl cut into the shore. Now hundreds of people are swinging picks at the bottom of it. Scaffolds along the walls, cranes on the scaffolds, kids' laundry on the cranes." }
          - { tr: "Sabah herkesin penceresinde aynı satır belirdi ve hâlâ kapanmıyor. Kimse yüksek sesle okumuyor; herkes okudu.", en: "This morning the same line popped up on everybody's window, and it still won't close. Nobody reads it out loud. Everybody's read it." }
          - { tr: "Kuru havuzun planı yirmi bin kişilik. Liman'da, tahliyelerden sonra, otuz bir bin kişi var. Kazının kenarındaki beyaz tahtada iki sayı yazıyor ve kimse ikisini birbirinden çıkarmaya cesaret edemiyor.", en: "The plans for the drydock say twenty thousand people. After the evacuations, there are thirty-one thousand on the Waterfront. Two numbers are written on the whiteboard at the edge of the dig, and nobody has the nerve to subtract one from the other." }
          - metin: { tr: "{npc:elif_sari} kazının kenarında, bir sedyenin üstüne oturmuş, tahtaya bakıyor. \"Ben triyajı bilirim,\" diyor. \"Bu triyaj değil. Bu bir kura bile değil. Bu, kimin çocuğunun daha çok yaşamayı hak ettiği sorusu.\"", en: "{npc:elif_sari} is sitting on a gurney at the edge of the dig, looking at the board. \"I know triage,\" she says. \"This isn't triage. It isn't even a lottery. It's the question of whose kid deserves to live more.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Tahtanın köşesinde hâlâ siyah bir bant duruyor; altında artık kimse bir bardak su bırakmayı unutmuyor. Rıza Reis tahtaya bakıyor ve sana dönüyor. \"O olsaydı ne derdi, biliyorsun,\" diyor.", en: "There's still a strip of black tape in the corner of the board, and nobody forgets to leave a glass of water under it anymore. Skipper Reese looks at the board and turns to you. \"You know what she'd say,\" he says." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "Kazının dibinde, bir kazmanın sapına yaslanmış Pala var; kolları toz içinde. Seni görünce kazmayı kaldırıp selam verir gibi yapıyor.", en: "Down at the bottom of the dig, leaning on a pickaxe handle, is Cleaver, dust up to his elbows. When he sees you he lifts the pick like a salute." }
            kosul: { bayrak: "pala_kazida" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KATMAN DEĞERLENDİRMESİ · Ön bildirim]", en: "[LAYER ASSESSMENT · Advance notice]" }
            satirlar:
              - { tr: "Son değerlendirmeye kalan süre: 97 gün.", en: "Time until final assessment: 97 days." }
              - { tr: "Hazırlık önerilir. Hazırlığın işe yarayacağı garanti edilmez.", en: "Preparation is recommended. Preparation is not guaranteed to help." }
        sezgiler:
          - kosul: { stat: { str: 260 } }
            metin: { tr: "Havuzun doğu duvarının arkası boş. Taş ince; ardında bir oda var, havuzdan daha eski.", en: "There's empty space behind the drydock's east wall. The rock is thin, and there's a chamber behind it older than the drydock." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷oğu duvarı. oraya bakma. ya da bak. ama baktığında beni de göreceksin.", en: "t̷he east wall. don't look there. or do. but when you look, you'll see me too." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kura çekersek ben listede olmayacağım. Bunu şimdiden bil.\"", en: "\"If we draw lots, I'm not putting my name in. Know that now.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On bir bin kişi daha. Bu bir sayı değil. Bu bir şehir.\"", en: "\"Eleven thousand more. That isn't a number. That's a town.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Doğu duvarının arkasında bir boşluk var. Sismograf verisinde gördüm. Kimse bana sormadı tabii.\"", en: "\"There's a void behind the east wall. I saw it in the seismograph data. Nobody asked me, obviously.\"" }
        secenekler:
          - id: "herkes"
            etiket: { tr: "\"Herkese yer açacağız. Kazmaya devam.\"", en: "\"We make room for everyone. Keep digging.\"" }
            etkiler:
              - bayrak: "son_siginak_herkes"
              - ahlak: { merhamet: 4, duzen: -1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Son Sığınak'ın planını yırtıp herkese yer açılana kadar kazdırdın.", en: "You tore up the Last Haven's plans and kept everyone digging until there was room for all of them." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "kura"
            etiket: { tr: "\"Kura çekin. Adil olan bu.\"", en: "\"Draw lots. That's what's fair.\"" }
            etkiler:
              - bayrak: "son_siginak_kura"
              - ahlak: { duzen: 5, merhamet: -1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: 2, guven: -2 } }
            kronik: { tr: "Son Sığınak'ın yerlerini kurayla dağıttın; on bir bin kişi bir torbadan çekilen kâğıtla dışarıda kaldı.", en: "You handed out places in the Last Haven by lottery. Eleven thousand people got left outside by a slip of paper pulled from a sack." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "oy"
            tur: "gosteris"
            etiket: { tr: "Kayayı kendin oy; iki haftalık işi bir gecede", en: "Carve the rock yourself. Two weeks' work in one night" }
            gerekli: { stat: { str: 260 } }
            etkiler:
              - bayrak: "son_siginak_herkes"
              - bayrak: "kaya_oyuldu"
              - dikkat: 6
              - ahlak: { merhamet: 4, insanlik: -1 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { saygi: 6, korku: 2 } }
            kronik: { tr: "Son Sığınak'ın kayasını bir gecede çıplak ellerinle oydun; sabah işçiler kazmalarını bıraktı ve sana baktı.", en: "You carved out the Last Haven's rock with your bare hands in a single night. In the morning the workers put down their picks and just stared at you." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "kadim"
            etiket: { tr: "Kadimler'den kalkan teknolojisi iste", en: "Ask the Ancients for shield technology" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Son Sığınak için Kadim elçisinin kapısını çaldın.", en: "For the Last Haven, you knocked on the Ancient envoy's door." }
            sonraki: "siginak_4_son_siginak_kadim"
          - id: "savascilar"
            etiket: { tr: "\"Sığınak savaşabilenlerin. Siviller Tepe'ye.\"", en: "\"The Haven's for fighters. Civilians go to the Heights.\"" }
            etkiler:
              - bayrak: "son_siginak_savascilar"
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -6, duzen: 4 }
              - itibar: { siginak: -5, lonca: 4 }
              - iliski: { elif_sari: { guven: -8 } }
            kronik: { tr: "Son Sığınak'ı savaşabilenlere ayırdın; siviller Tepe'ye yürüdü ve çoğu oradan geri dönmedi.", en: "You reserved the Last Haven for fighters. The civilians walked up to the Heights, and most of them never came back down." }
            sonraki: "siginak_4_son_siginak_kazi"

      - id: "siginak_4_son_siginak_kadim"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar|in} görüntüsü kuru havuzun kenarında beliriyor; ışıktan yapılmış ayakları tozu kıpırdatmıyor. Kazıya, sonra tahtadaki iki sayıya bakıyor.", en: "{npc:thessar|pos} image appears at the edge of the drydock. Its feet are made of light and don't stir the dust. He looks at the dig, then at the two numbers on the board." }
          - { tr: "\"Kalkan veririm,\" diyor. \"Bir şehri bir yaz örtecek kadar. Karşılığında tek bir şey isterim: bu sığınağın kapısına bizim mührümüz basılsın. Hasat geldiğinde, içeridekiler bize ait sayılsın.\"", en: "\"I can give you a shield,\" he says. \"Enough to cover a city for a summer. In return, I want one thing: our seal on this shelter's door. When the harvest comes, whoever's inside is counted as ours.\"" }
        sezgiler:
          - kosul: { stat: { int: 260 } }
            metin: { tr: "'Bize ait sayılmak' hasat edilmemek demek. Ama aynı zamanda başka bir şey demek: sahiplenilmek.", en: "\"Counted as ours\" means not harvested. It also means something else: owned." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "m̷ühür bir kilit değil. bir etiket. etiketleri ben bilirim.", en: "t̷hat seal isn't a lock. it's a label. i know labels." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Mührü kabul et; kalkanı al", en: "Accept the seal. Take the shield" }
            etkiler:
              - bayrak: "son_siginak_kadim"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: 3 }
              - ahlak: { merhamet: -3, insanlik: -4, duzen: 3 }
              - itibar: { kadimler: 8, siginak: -4 }
              - iliski: { thessar: { baglilik: 8, saygi: 4 } }
            kronik: { tr: "Son Sığınak'ın kapısına Kadimler'in mührünü bastırdın; içeridekiler hayatta kaldı ve kimin malı olduklarını hiç unutmadılar.", en: "You put the Ancients' seal on the Last Haven's door. The people inside survived, and never forgot whose property they were." }
            sonraki: "siginak_4_son_siginak_kazi"
          - id: "red"
            etiket: { tr: "\"Kapımıza kimse mühür basmaz.\"", en: "\"Nobody stamps our door.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - itibar: { siginak: 4, kadimler: -3 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Kadim elçisinin mührünü Son Sığınak'ın kapısından geri çevirdin.", en: "You turned the Ancient envoy's seal away from the Last Haven's door." }
            sonraki: "siginak_4_son_siginak_kazi"

      - id: "siginak_4_son_siginak_kazi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece yarısı doğu duvarı çöküyor. Arkasından buz gibi, eski bir hava çıkıyor; işçiler fenerlerini kaldırınca karanlıkta, havuzdan daha eski, elle oyulmuş bir oda beliriyor.", en: "At midnight the east wall gives way. Cold, old air comes out from behind it, and when the workers lift their lanterns, a chamber takes shape in the dark, carved by hand and older than the drydock." }
          - { tr: "Odanın duvarları baştan sona çentiklerle dolu: beşerli gruplar, binlerce, on binlerce. Tam olarak Konsey'in beyaz tahtasındaki gibi. Kapının üstüne bir kelime kazınmış; harfleri neredeyse tanıdık ama değil: SIĞINAK.", en: "The chamber walls are covered floor to ceiling in tally marks: groups of five, thousands of them, tens of thousands. Exactly like the Council's whiteboard. Above the doorway someone has carved one word in letters that are almost familiar, but not quite: HAVEN." }
          - metin: { tr: "{npc:elif_sari} duvara dokunuyor; parmakları çentiklerin üstünde bir nabız arar gibi geziniyor. \"Biri burada da saymış,\" diyor. \"Bizden önce. Bizim gibi.\"", en: "{npc:elif_sari} touches the wall, her fingers moving over the tallies like she's feeling for a pulse. \"Somebody counted here too,\" she says. \"Before us. Like us.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - { tr: "Odanın ortasında bir şey uyuyor: kayadan, külden ve eski kalkanlardan yapılmış, bir gemi omurgası kadar uzun. Fenerlerin ışığı ona değince bir göz açılıyor.", en: "Something is asleep in the middle of the chamber, built out of rock and ash and old shields, as long as a ship's keel. When the lantern light touches it, an eye opens." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[k̷ayıt bulunamadı · önceki sürüm]", en: "[r̷ecord not found · prior version]" }
            satirlar:
              - { tr: "bunu ben yazmadım. ama elimi tanıyorum.", en: "i didn't write this. but i recognize the hand." }
        sezgiler:
          - kosul: { stat: { wis: 200 } }
            metin: { tr: "Çentiklerin sonuncusu yarım. Beşli bir grubun dördüncü çizgisinde duruyor; sayan kişi beşinciyi çizemeden bitmiş.", en: "The last tally is unfinished. It stops on the fourth line of a group of five. Whoever was counting ran out before they could draw the fifth." }
          - kosul: { stat: { wil: 200 } }
            metin: { tr: "Uyuyan şey düşman değil. Bir bekçi. Kimin bekçisi olduğunu unutmuş.", en: "The sleeper isn't an enemy. It's a guardian. It's forgotten who it was guarding." }
        secenekler:
          - id: "savas"
            etiket: { tr: "İşçileri arkana al ve uyuyanla savaş", en: "Get the workers behind you and fight the sleeper" }
            etkiler:
              - bilgi: "onceki_siginak"
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["havuz_uyuyani@oyuncu+5"], ortam: ["karanlik", "dar_gecit"], kazan: "siginak_4_son_siginak_zafer", kaybet: "siginak_4_son_siginak_yenilgi", kac: "siginak_4_son_siginak_yenilgi" }
            kronik: { tr: "Son Sığınak'ın altında, kendisinden önceki bir sığınağın bekçisiyle savaştın.", en: "Under the Last Haven, you fought the guardian of a haven older than yours." }
          - id: "dokun"
            tur: "gosteris"
            etiket: { tr: "Uyuyana dokun; bekçiliğini hatırlat", en: "Touch the sleeper. Remind it what it guards" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bilgi: "onceki_siginak"
              - bayrak: "uyuyan_bekci"
              - dikkat: 4
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
            kronik: { tr: "Eski bir sığınağın bekçisine elini koydun ve neyi beklediğini hatırlattın; Son Sığınak'ın kapısını o bekledi.", en: "You laid your hand on an old haven's guardian and reminded it what it was guarding. After that, it guarded the Last Haven's door." }
            sonraki: "siginak_4_son_siginak_bekci"
          - id: "cikar"
            tur: "aciga_vur"
            etiket: { tr: "Seviyeni aç; işçileri çıkarana kadar onu tut", en: "Open up your level. Hold it until the workers are out" }
            etkiler:
              - bilgi: "onceki_siginak"
              - aciga_vur: true
              - dikkat: 5
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 5, duzen: 1 }
              - savas: { dusmanlar: ["havuz_uyuyani@oyuncu+5"], ortam: ["karanlik"], kazan: "siginak_4_son_siginak_zafer", kaybet: "siginak_4_son_siginak_yenilgi", kac: "siginak_4_son_siginak_yenilgi" }
            kronik: { tr: "Kuru havuzun altında uyanan bekçiyi, son işçi çıkana kadar gerçek gücünle tuttun.", en: "Under the drydock, you held the waking guardian back with your full strength until the last worker was out." }
          - id: "muhur"
            etiket: { tr: "Duvarı kaydet, odayı yeniden mühürle", en: "Record the wall. Seal the chamber again" }
            etkiler:
              - bilgi: "onceki_siginak"
              - bayrak: "oda_muhurlendi"
              - ahlak: { duzen: 3, insanlik: 1 }
            kronik: { tr: "Eski sığınağın odasını kaydedip yeniden mühürledin; bekçisi uyumaya devam etti, Son Sığınak ise biraz daha küçük kaldı.", en: "You recorded the old haven's chamber and sealed it back up. Its guardian kept sleeping, and the Last Haven stayed a little smaller." }
            sonraki: "siginak_4_son_siginak_muhur"

      - id: "siginak_4_son_siginak_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bekçi çöküyor. Gövdesindeki eski kalkanlar tek tek yere dökülüyor; bazılarının üstünde hâlâ okunabilen, kimsenin tanımadığı armalar var.", en: "The guardian comes apart. The old shields in its body clatter to the floor one by one, some still bearing crests nobody recognizes." }
          - { tr: "Oda şimdi boş ve büyük; Son Sığınak'ın en derin salonu olacak kadar büyük. İşçiler duvardaki çentiklere dokunmamaya özen göstererek içeri giriyor.", en: "The chamber is empty now, and big. Big enough to be the Last Haven's deepest hall. The workers file in, careful not to touch the tallies on the walls." }
        secenekler:
          - id: "kalkan"
            etiket: { tr: "Eski kalkanları kapıya as", en: "Hang the old shields on the door" }
            etkiler:
              - bayrak: "eski_kalkanlar"
              - ahlak: { insanlik: 3, duzen: 1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Önceki sığınağın kalkanlarını Son Sığınak'ın kapısına astın; içeri giren herkes onların altından geçti.", en: "You hung the old haven's shields on the Last Haven's door. Everyone who went inside walked under them." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "salon"
            etiket: { tr: "\"Bu salon çocukların.\"", en: "\"This hall is for the kids.\"" }
            etkiler:
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Son Sığınak'ın en derin ve en güvenli salonunu çocuklara verdin.", en: "You gave the Last Haven's deepest, safest hall to the kids." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bekçi seni duvara savuruyor; çentiklerin üstüne çarpıyorsun ve bir an bütün o sayılar sırtına kazınmış gibi geliyor. Sonra bekçi duruyor, sana bakıyor ve uzun, yorgun bir nefesle yeniden yatıyor.", en: "The guardian hurls you into the wall. You slam into the tallies, and for a second it feels like every one of those marks has been carved into your back. Then the guardian stops, looks at you, and lies back down with a long, tired breath." }
          - { tr: "Seni öldürmedi. Belki sana bir insan olduğun için dokunmadı; belki de sayılarının arasında senin de bir yerin olduğunu biliyor.", en: "It didn't kill you. Maybe it held back because you're human. Maybe it knows you've got a place somewhere among its tallies too." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu uyumaya bırak; odayı mühürle", en: "Let it sleep. Seal the chamber" }
            etkiler:
              - bayrak: "oda_muhurlendi"
              - ahlak: { merhamet: 2, insanlik: 2 }
            kronik: { tr: "Eski sığınağın bekçisine yenildin ve onu uyumaya bıraktın.", en: "You lost to the old haven's guardian, and you let it go back to sleep." }
            sonraki: "siginak_4_son_siginak_muhur"
          - id: "say"
            etiket: { tr: "Yarım kalan çentiğin beşinci çizgisini çiz", en: "Draw the fifth line on the unfinished tally" }
            etkiler:
              - bayrak: "oda_muhurlendi"
              - bayrak: "besinci_cizgi"
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Eski sığınağın duvarındaki yarım kalmış sayıyı sen tamamladın.", en: "You finished the count someone left half-done on the old haven's wall." }
            sonraki: "siginak_4_son_siginak_muhur"

      - id: "siginak_4_son_siginak_bekci"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini bekçinin taş alnına koyuyorsun. Gözü yavaşça kapanıyor, sonra yeniden açılıyor; bu sefer bakışı sende değil, kuru havuzun ağzında, içeri girmeyi bekleyen kalabalıkta.", en: "You lay your hand on the guardian's stone forehead. Its eye slowly closes, then opens again. This time it isn't looking at you. It's looking at the mouth of the drydock, at the crowd waiting to get in." }
          - { tr: "Bekçi kalkıyor, kapıya yürüyor ve orada, sırtını içeriye dönerek, çöküp oturuyor. Hiçbir şey söylemiyor. Hiçbir şey söylemesine gerek yok.", en: "The guardian gets up, walks to the door, and sits down there with its back to the inside. It doesn't say anything. It doesn't need to." }
        secenekler:
          - id: "ad"
            etiket: { tr: "Ona bir ad ver", en: "Give it a name" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Son Sığınak'ın kapısındaki eski bekçiye bir ad verdin; çocuklar onu o adla çağırdı.", en: "You gave the old guardian at the Last Haven's door a name. The kids called it that." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "teskur"
            etiket: { tr: "Önünde bir an eğil", en: "Bow to it for a moment" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
            kronik: { tr: "Kendinden önceki bir kalkanın önünde eğildin.", en: "You bowed to a shield that came before you." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_muhur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Odanın ağzını yeniden örüyorsunuz; taş taş, harç harç. Son taşı yerine koymadan önce fenerinle son bir kez bakıyorsun: çentikler, kelime, uyuyan şey.", en: "You brick the chamber back up, stone by stone, mortar and all. Before you set the last stone, you shine your lantern in one more time: the tallies, the word, the sleeping thing." }
          - { tr: "Son Sığınak bir oda eksik kalıyor. Ama işçilerden biri, kimse görmeden, örülen duvarın üstüne beşli bir çentik çiziyor.", en: "The Last Haven ends up one room short. But one of the workers, when nobody's looking, scratches a group of five tallies into the new wall." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kazıya devam et", en: "Get back to the dig" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "Eski sığınağı yeniden mühürleyip kendi sığınağını kazmaya devam ettin.", en: "You sealed the old haven back up and kept digging your own." }
            sonraki: "siginak_4_son_siginak_bitis"
          - id: "cizgi"
            etiket: { tr: "Senin de bir çentik çiz", en: "Scratch a tally of your own" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Mühürlenen duvara sen de bir çentik çizdin.", en: "You scratched a tally of your own into the sealed wall." }
            sonraki: "siginak_4_son_siginak_bitis"

      - id: "siginak_4_son_siginak_bitis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Üç hafta sonra Son Sığınak'ın çelik kapısı ilk kez kapanıyor ve açılıyor. Kapının gıcırtısı bütün Liman'da duyuluyor; insanlar bunu bir zil gibi dinliyor.", en: "Three weeks later the Last Haven's steel door closes and opens for the first time. The creak carries all over the Waterfront, and people listen to it like a church bell." }
          - metin: { tr: "{npc:elif_sari} yemek katından bu yana yanında taşıdığı beyaz tahtayı kapının iç tarafına asıyor. KONSEY yazısının altına yeni bir satır ekliyor: İÇERİDE. Sonra boş bırakıyor; sayılmaya başlanacak.", en: "{npc:elif_sari} hangs the whiteboard she's carried since the food court on the inside of the door. Under COUNCIL she adds a new line: INSIDE. Then she leaves it blank. The counting starts later." }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Nurhan, yemek katından kalma beyaz tahtayı kapının iç tarafına asıyor. Köşesine bir neşter bantlanmış. KONSEY yazısının altına yeni bir satır ekliyor: İÇERİDE.", en: "Nora hangs the whiteboard from the food court on the inside of the door. There's a scalpel taped to the corner. Under COUNCIL she adds a new line: INSIDE." }
            kosul: { npc_olu: "elif_sari" }
          - metin: { tr: "Kapının üstünde Kadimler'in mührü parlıyor; soğuk, beyaz ve sabırlı.", en: "The Ancients' seal glows over the door: cold, white, and patient." }
            kosul: { bayrak: "son_siginak_kadim" }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[UNVAN: Son Sığınağın Mimarı]", en: "[TITLE: Architect of the Last Haven]" }
            satirlar:
              - { tr: "Bir şehri taşın içine sakladın. Sistem bunu bir 'hazırlık' olarak kaydetti; işe yarayıp yaramayacağını kaydetmedi.", en: "You hid a city inside the rock. The System logged it as \"preparation.\" It did not log whether it will help." }
        secenekler:
          - id: "say"
            etiket: { tr: "İçeri girenleri kapıda tek tek say", en: "Count everyone through the door, one by one" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Son Sığınak'a giren herkesi kapıda kendin saydın; o sayı tahtaya senin el yazınla geçti.", en: "You stood at the Last Haven's door and counted everyone in yourself. That number went on the board in your handwriting." }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kapının kurallarını yaz: kim, ne zaman, nasıl", en: "Write the door rules: who, when, how" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - ahlak: { duzen: 5, merhamet: 1 }
              - itibar: { siginak: 6 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Son Sığınak'ın kapı kurallarını sen yazdın; hasat gecesi kapı o kurallara göre açıldı ve kapandı.", en: "You wrote the Last Haven's door rules. On harvest night, the door opened and shut by them." }
            sonraki: "@akis"
          - id: "disari"
            etiket: { tr: "Kapının dışında kalanlarla otur", en: "Sit with the ones left outside the door" }
            goster: { bayrak_yok: "son_siginak_herkes" }
            etkiler:
              - bayrak: "siginak_4_bitti"
              - bayrak: "son_siginak_kuruldu"
              - unvan: "son_siginagin_mimari"
              - xp_seviye: 100
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 4 }
              - tohum: { olay: "elif_lonca_darbesi", gecikme: { min: 3, max: 10 }, kosul: { perde: 3, npc_hayatta: "elif_sari", bayrak_yok: ["kaya_devrildi", "elif_darbe_yasandi"] } }
            kronik: { tr: "Son Sığınak tamamlandığı gece içeride değil, kapının dışında kalanların yanında oturdun.", en: "On the night the Last Haven was finished, you didn't sit inside. You sat with the people left outside the door." }
            sonraki: "@akis"

  # ================================================================== ELİF 4 — BARIŞ MASASI (P4, AY 333; elif_baskan · insan_ittifaki)
  - id: "elif_baris_masasi"
    perde: [4]
    gun: { min: 331, max: 341 }
    ana_yay: { gun: 333 }
    agirlik: 1
    kosul: { bayrak: "siginak_1_goruldu" }
    etiketler: ["siginak", "npc", "ittifak", "fraksiyon"]
    gerilim: 3
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Bavul arabalarından bir masa", en: "A table made of luggage carts" }
    sahne: "elif_baris_masasi_1"
    sahneler:
      - id: "elif_baris_masasi_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gökyüzünde artık ikinci bir şehir var: körfezin üstünde, yıldızların arasında, Kadim filosunun ışıkları. {yer:kiyikent_iskele|in} bekleme salonunda gişeler sökülmüş; bavul arabaları ve kapı kanatlarından uzun bir masa kurulmuş.", en: "There's a second city in the sky now: the lights of the Ancient fleet, hanging among the stars over the bay. In the {yer:kiyikent_iskele} waiting hall the ticket windows have been torn out, and somebody's built a long table out of luggage carts and old doors." }
          - { tr: "Masanın başında {npc:elif_sari} duruyor; arkasında yemek katından kalma beyaz tahta, üstünde iki kelime: BİR ORDU. \"Ya tek bir insan ordusu olacak,\" diyor, \"ya da hiç olmayacak. Ben bu masadan kimse kalkmadan kalkmıyorum.\"", en: "{npc:elif_sari} stands at the head of the table, the whiteboard from the food court behind her with two words on it: ONE ARMY. \"Either there's going to be one human army,\" she says, \"or there won't be any. I'm not getting up from this table until everybody's still sitting at it.\"" }
          - metin: { tr: "Masanın bir ucunda {npc:kaya_demir} oturuyor; kollarını kavuşturmuş, ama gelmiş.", en: "{npc:kaya_demir} sits at one end of the table, arms folded. But he came." }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "Lonca'nın sandalyesi boş; herkes oraya değil, sana bakıyor. Lonca artık senin.", en: "The Guild's chair is empty, and everybody's looking at you instead of at it. The Guild is yours now." }
            kosul: { bayrak: "lonca_hakimiyeti" }
          - metin: { tr: "Öbür uçta {npc:vahit}, bembeyaz cübbesiyle, sanki bir ayindeymiş gibi gözleri kapalı.", en: "At the other end sits {npc:vahit} in his white robes, eyes closed, like he's in the middle of a service." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} masanın ortasına bir telsiz koymuş, kulaklığın tekini takmış; Sessiz Ağ dinliyor.", en: "{npc:mert_kilic} has set a radio in the middle of the table with one earbud in. The Quiet Network is listening." }
            kosul: { npc_hayatta: "mert_kilic" }
          - metin: { tr: "Salonun arkasında, sandalye taşıyanların arasında, tozlu kollarıyla Pala var.", en: "In the back of the hall, among the people carrying chairs, is Cleaver, with dust on his arms." }
            kosul: { bayrak: "pala_kazida" }
        sezgiler:
          - kosul: { stat: { cha: 350 } }
            metin: { tr: "Masadaki herkes bir şey bekliyor ama ondan değil, senden. Onun sözünü sen söylersen masa kalkmaz.", en: "Everybody at the table is waiting for something, and it isn't from her. It's from you. If you say her words for her, the table holds." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷ört fraksiyon, bir masa, bir hekim. sistem bu ihtimale düşük bir olasılık vermiş. bu yüzden ilginç.", en: "f̷our factions, one table, one doctor. the System gave this outcome a low probability. that's what makes it interesting." }
          - kosul: { bayrak: "elif_ask" }
            anlati: true
            metin: { tr: "Masanın başına geçmeden önce sana bakıyor; kısa, yalnızca senin fark edeceğin kadar.", en: "Before she takes the head of the table, she looks at you. Briefly. Just long enough that only you'd notice." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir masa. Kıyametin sonunda bir masa. Bu ya çok saçma ya da tam ihtiyacımız olan şey.\"", en: "\"A table. At the end of the world, a table. That's either ridiculous or exactly what we need.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Masalar insanı oyalar. Ama bu kadın oyalamıyor. Dinle onu.\"", en: "\"Tables are a way of stalling. But this woman isn't stalling. Listen to her.\"" }
        secenekler:
          - id: "yanina"
            etiket: { tr: "Onun yanına otur; masayı o yönetsin", en: "Sit beside her. Let her run the table" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            kronik: { tr: "Kadim filosu gökteyken bir hekimin kurduğu masaya oturdun ve masayı ona bıraktın.", en: "With the Ancient fleet in the sky, you sat down at a doctor's table and let her run it." }
            sonraki: "elif_baris_masasi_masa"
          - id: "basa"
            etiket: { tr: "Masanın başına sen geç", en: "Take the head of the table yourself" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - iliski: { elif_sari: { guven: -4, korku: 3 } }
            kronik: { tr: "Bir hekimin kurduğu barış masasının başına kendin geçtin.", en: "You took the head of a peace table a doctor had built." }
            sonraki: "elif_baris_masasi_tahakkum"
          - id: "tek_ses"
            tur: "gosteris"
            etiket: { tr: "Herkesi tek bir konuşmayla aynı tarafa çek", en: "Pull everyone onto one side with a single speech" }
            gerekli: { stat: { cha: 400 } }
            etkiler:
              - bayrak: "masa_tek_ses"
              - dikkat: 3
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 6, lonca: 3, sessiz_ag: 3 }
              - iliski: { elif_sari: { saygi: 6, baglilik: 3 } }
            kronik: { tr: "Dört fraksiyonu bir bekleme salonunda, tek bir konuşmayla aynı tarafa çektin.", en: "In a ferry terminal waiting room, with one speech, you pulled four factions onto the same side." }
            sonraki: "elif_baris_masasi_masa"
          - id: "hayal"
            etiket: { tr: "\"Bu masa bir hayal. Herkes kendi başına.\"", en: "\"This table's a fantasy. Everybody's on their own.\"" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -4 }
              - itibar: { siginak: -6 }
              - iliski: { elif_sari: { guven: -6, baglilik: -4 } }
            kronik: { tr: "Kıyametin son masasına 'hayal' dedin ve kalkıp gittin; arkandan herkes kalktı.", en: "You called the last table at the end of the world a fantasy and walked out. Everyone else got up after you." }
            sonraki: "elif_baris_masasi_dagilma"
          - id: "kadim"
            etiket: { tr: "{npc:thessar|in} elçisini de masaya çağır", en: "Invite {npc:thessar|pos} envoy to the table too" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - iliski: { elif_sari: { guven: -3 }, thessar: { saygi: 3 } }
            kronik: { tr: "İnsanlığın son barış masasına Kadimler'in elçisini de çağırdın.", en: "You invited the Ancients' envoy to humanity's last peace table." }
            sonraki: "elif_baris_masasi_kadim"

      - id: "elif_baris_masasi_masa"
        yer: "kiyikent_iskele"
        paragraflar:
          - metin: { tr: "{npc:kaya_demir} ilk konuşan: \"Ordunun tek bir komutanı olur. Ben olurum. Siviller sizin olsun.\"", en: "{npc:kaya_demir} speaks first. \"An army has one commander. That's me. You can have the civilians.\"" }
            kosul: { npc_hayatta: "kaya_demir", bayrak_yok: "kaya_devrildi" }
          - metin: { tr: "{npc:vahit} gözlerini açıyor. \"Sistem seçilmişlerle yakıtı ayırdı. Siz bu ayrımı bir masayla silemezsiniz.\"", en: "{npc:vahit} opens his eyes. \"The System separated the chosen from the fuel. You can't erase that line with a table.\"" }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} kulaklığını çıkarıyor. \"Biz Kule'nin ve Çekirdek'in verisini istiyoruz. Herkesinkini. Sonuna kadar.\"", en: "{npc:mert_kilic} pulls out his earbud. \"We want the Spire and Core data. Everybody's. All of it.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - { tr: "{npc:elif_sari} her talebi tahtaya yazıyor, alt alta, kimseninkini ötekinden büyük yazmadan. Sonra kalemi sana uzatıyor.", en: "{npc:elif_sari} writes every demand on the board, one under the other, none of them bigger than the rest. Then she holds the marker out to you." }
        secenekler:
          - id: "lonca_komuta"
            etiket: { tr: "\"Komuta Lonca'da, siviller Konsey'de.\"", en: "\"The Guild commands. The Council keeps the civilians.\"" }
            etkiler:
              - bayrak: "masa_lonca_komuta"
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { lonca: 6, siginak: 2 }
            kronik: { tr: "İnsan ordusunun komutasını Lonca'ya, sivilleri Konsey'e verdin.", en: "You gave command of the human army to the Guild and the civilians to the Council." }
            sonraki: "elif_baris_masasi_oylama"
          - id: "kurul"
            etiket: { tr: "\"Komuta ortak bir kurulda. Tek el yok.\"", en: "\"Command goes to a joint board. No single hand.\"" }
            etkiler:
              - bayrak: "masa_ortak_kurul"
              - ahlak: { merhamet: 2, duzen: 2, insanlik: 1 }
              - itibar: { siginak: 4, sessiz_ag: 2 }
            kronik: { tr: "İnsan ordusunu tek bir elin değil, ortak bir kurulun yönetmesini sağladın.", en: "You made sure the human army answered to a joint board instead of one pair of hands." }
            sonraki: "elif_baris_masasi_oylama"
          - id: "yakit"
            etiket: { tr: "\"Yakıt listeleri yakılacak. Şart bu.\"", en: "\"The fuel lists get burned. That's the condition.\"" }
            etkiler:
              - bayrak: "yakit_listeleri_yakildi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 5, yukselenler: -15 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Barış masasında Yükselenler'in 'yakıt' listelerini yaktırdın; o listelerdeki binlerce isim, ilk kez, yalnızca isimdi.", en: "At the peace table, you had the Ascended's \"fuel\" lists burned. For the first time, the thousands of names on them were just names." }
            sonraki: "elif_baris_masasi_oylama"

      - id: "elif_baris_masasi_oylama"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Masaya bir soru kalıyor: Kıyıkent İttifakı'nın başında kim oturacak? Salonun sessizliği, beş yüz kişinin aynı anda nefesini tutması gibi.", en: "One question is left on the table: who sits at the head of the Port Harlow Alliance? The silence in the hall is five hundred people holding their breath at once." }
          - { tr: "{npc:elif_sari} kalemi tahtanın kenarına bırakıyor. \"Ben aday değilim,\" diyor, alışkanlıkla; sonra duruyor, sanki bu cümleyi ilk kez duyuyormuş gibi.", en: "{npc:elif_sari} sets the marker down on the ledge of the whiteboard. \"I'm not a candidate,\" she says, out of habit. Then she stops, like she's hearing that sentence for the first time." }
        secenekler:
          - id: "elif"
            etiket: { tr: "\"{npc:elif_sari|e} oy veriyorum.\"", en: "\"My vote goes to {npc:elif_sari}.\"" }
            gerekli: { itibar_min: { siginak: 30 } }
            etkiler:
              - bayrak: "elif_baskan"
              - bayrak: "insan_ittifaki"
              - ahlak: { merhamet: 4, duzen: 3 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { baglilik: 6, guven: 5 } }
            kronik: { tr: "Kıyıkent İttifakı'nın başkanlığına bir hekimi seçtirdin; 'barış' kelimesi o gün şehrin sözlüğüne geri döndü.", en: "You got a doctor elected head of the Port Harlow Alliance. The word \"peace\" came back into the city's vocabulary that day." }
            sonraki: "elif_baris_masasi_baskan"
          - id: "ayaga"
            tur: "gosteris"
            etiket: { tr: "Salonu onun için ayağa kaldır", en: "Bring the whole hall to its feet for her" }
            gerekli: { stat: { cha: 350 } }
            etkiler:
              - bayrak: "elif_baskan"
              - bayrak: "insan_ittifaki"
              - dikkat: 2
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 6, saygi: 4 } }
            kronik: { tr: "Beş yüz kişiyi bir hekim için ayağa kaldırdın; o gün kendi adını tahtaya kendi eliyle yazdı.", en: "You brought five hundred people to their feet for a doctor. That day, she wrote her own name on the board in her own hand." }
            sonraki: "elif_baris_masasi_baskan"
          - id: "kendin"
            etiket: { tr: "Kendine oy ver", en: "Vote for yourself" }
            etkiler:
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ahlak: { duzen: 6, merhamet: -1, insanlik: -3 }
              - itibar: { lonca: 4 }
              - iliski: { elif_sari: { guven: -5, saygi: 2 } }
            kronik: { tr: "Kıyıkent İttifakı'nın başına kendini seçtirdin; hekim tahtadaki adını sildi ve yerine seninkini yazdı.", en: "You had yourself elected head of the Port Harlow Alliance. The doctor erased her name from the board and wrote yours in its place." }
            sonraki: "elif_baris_masasi_son"
          - id: "baskansiz"
            etiket: { tr: "\"Başkan yok. Kurul yönetsin.\"", en: "\"No chair. The board governs.\"" }
            etkiler:
              - bayrak: "insan_ittifaki"
              - bayrak: "kurul_ittifaki"
              - ahlak: { duzen: -2, merhamet: 2, insanlik: 2 }
              - itibar: { siginak: 3, sessiz_ag: 3 }
            kronik: { tr: "İnsan ittifakını başkansız, bir kurulla kurdun; kararlar yavaş çıktı ama herkesin oldu.", en: "You set up the human alliance with a board and no chair. Decisions came slow, but they belonged to everyone." }
            sonraki: "elif_baris_masasi_son"

      - id: "elif_baris_masasi_baskan"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:elif_sari} tahtanın başına yürüyor. Kalemi alıyor ve bu sefer, ilk kez, kendi adını kendi eliyle yazıyor: BAŞKAN. Eli titremiyor.", en: "{npc:elif_sari} walks to the whiteboard. She picks up the marker, and this time, for the first time, she writes her own name with her own hand: CHAIR. Her hand doesn't shake." }
          - { tr: "\"Bir kural,\" diyor salona dönüp. \"Bu ittifakta kimse yakıt değil. Kimse siyah bantla doğmaz. Kim bunu kabul etmezse kapı orada.\" Kimse kalkmıyor.", en: "\"One rule,\" she says, turning to the hall. \"In this alliance, nobody is fuel. Nobody's born with black tape on. Anyone who can't live with that, the door's right there.\" Nobody gets up." }
          - metin: { tr: "Sonra herkes dağılırken sana dönüyor, kimse duymasın diye alçak sesle: \"Artık siyah bandı ben dağıtıyorum. Yakınımda dur.\"", en: "Later, while everyone's filing out, she turns to you and keeps her voice low so nobody else hears: \"I'm the one handing out the black tape now. Stay close.\"" }
            kosul: { bayrak: "elif_ask" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KIYIKENT İTTİFAKI KURULDU]", en: "[PORT HARLOW ALLIANCE FORMED]" }
            satirlar:
              - { tr: "Fraksiyonlar arası savaş durumu: askıya alındı.", en: "Inter-faction hostilities: suspended." }
              - { tr: "Not: Bu, Katman değerlendirmesinde not edilecek.", en: "Note: This will be noted in the Layer assessment." }
        secenekler:
          - id: "alkis"
            etiket: { tr: "Ayakta alkışla", en: "Give her a standing ovation" }
            etkiler:
              - ordu_kazan: 30
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 3 } }
            kronik: { tr: "Kıyıkent İttifakı'nın ilk başkanını ilk ayağa kalkan sen alkışladın.", en: "You were the first one on your feet to applaud the Port Harlow Alliance's first chair." }
            sonraki: "elif_baris_masasi_son"
          - id: "ilk_emir"
            etiket: { tr: "\"İlk emrini ver, Başkan.\"", en: "\"Give your first order, Madam Chair.\"" }
            etkiler:
              - ordu_kazan: 30
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Yeni başkandan ilk emrini istedin; ilk emri bir hastane çadırı içindi.", en: "You asked the new chair for her first order. It was for a hospital tent." }
            sonraki: "elif_baris_masasi_son"

      - id: "elif_baris_masasi_tahakkum"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Masanın başına yürüdüğünde {npc:elif_sari} bir adım geri çekiliyor, sana yer açıyor. Salonda kimse karşı çıkmıyor; karşı çıkmanın ne işe yarayacağını herkes biliyor.", en: "When you walk to the head of the table, {npc:elif_sari} steps back to make room. Nobody in the hall objects. Everybody knows what good objecting would do." }
          - { tr: "\"O zaman yönet,\" diyor {npc:elif_sari}, sesi düz. \"Ama yönetmek ne demek, biliyor musun? Her gece bir bandın rengine karar vermek.\"", en: "\"Then lead,\" {npc:elif_sari} says, voice flat. \"But do you know what leading means? Deciding the color of somebody's tape, every night.\"" }
        secenekler:
          - id: "sag_kol"
            etiket: { tr: "\"Sen sağ kolum olursun.\"", en: "\"You'll be my right hand.\"" }
            etkiler:
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ordu_kazan: 30
              - ahlak: { duzen: 4, merhamet: 2 }
              - iliski: { elif_sari: { guven: 2, saygi: 2 } }
            kronik: { tr: "İnsan ittifakının başına geçtin ve hekimi sağ kolun yaptın.", en: "You took the head of the human alliance and made the doctor your right hand." }
            sonraki: "elif_baris_masasi_son"
          - id: "kalksin"
            tur: "aciga_vur"
            etiket: { tr: "\"Kim karşıysa masadan kalksın.\"", en: "\"Anyone who objects can leave the table.\"" }
            etkiler:
              - aciga_vur: true
              - bayrak: "oyuncu_ittifak_basi"
              - bayrak: "insan_ittifaki"
              - ordu_kazan: 40
              - dikkat: 5
              - ahlak: { duzen: 6, merhamet: -3, insanlik: -3 }
              - itibar: { lonca: 5, siginak: -6 }
              - iliski: { elif_sari: { guven: -10, korku: 6 } }
            kronik: { tr: "Barış masasında 'kim karşıysa kalksın' dedin ve kimse kalkamadı; insan ittifakı korkuyla kuruldu.", en: "At the peace table you said anyone who objected could leave, and nobody could get up. The human alliance was founded on fear." }
            sonraki: "elif_baris_masasi_son"
          - id: "oylayalim"
            etiket: { tr: "\"Pekâlâ. Oylayalım.\"", en: "\"All right. Let's vote.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 3 }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Masanın başına geçtin ama sonunda oylamaya razı oldun.", en: "You took the head of the table, but in the end you agreed to put it to a vote." }
            sonraki: "elif_baris_masasi_masa"

      - id: "elif_baris_masasi_kadim"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:thessar|in} ışıktan görüntüsü masanın ucunda beliriyor ve sandalyelerden birine oturmaya tenezzül etmiyor. Salonun yarısı ayağa kalkıyor; öbür yarısı kalkamayacak kadar korkuyor.", en: "{npc:thessar|pos} image of light appears at the end of the table and doesn't deign to sit in a chair. Half the hall gets to its feet. The other half is too scared to." }
          - { tr: "\"İmzalayanlar bağışlanır,\" diyor. \"Bu masada imza atan her fraksiyon hasattan muaf tutulur. Basit bir aritmetik. Siz aritmetiği seversiniz.\"", en: "\"Those who sign are spared,\" he says. \"Every faction at this table that signs is exempted from the harvest. Simple arithmetic. Your species likes arithmetic.\"" }
          - { tr: "{npc:elif_sari} kalemi bırakıyor ve sana bakıyor. Bakışında bir soru yok; yalnızca bir bekleyiş.", en: "{npc:elif_sari} sets down the marker and looks at you. There's no question in her eyes. Just waiting." }
        secenekler:
          - id: "imza"
            etiket: { tr: "\"Okuyalım. Belki imzalarız.\"", en: "\"Let's read it. Maybe we sign.\"" }
            etkiler:
              - bayrak: "kadim_masada"
              - bayrak: "baris_masasi_dagildi"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { insanlik: -5, duzen: 3 }
              - itibar: { kadimler: 8, siginak: -10 }
              - iliski: { thessar: { baglilik: 10, saygi: 4 }, elif_sari: { guven: -15 } }
            kronik: { tr: "İnsanlığın barış masasında Kadimler'in antlaşmasını okumaya razı oldun; hekim kalemini bırakıp salondan çıktı.", en: "At humanity's peace table, you agreed to read the Ancients' treaty. The doctor put down her marker and walked out of the hall." }
            sonraki: "elif_baris_masasi_dagilma"
          - id: "kov"
            etiket: { tr: "\"Bu masa insanların. Çık.\"", en: "\"This table's for humans. Get out.\"" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 4, merhamet: 1 }
              - itibar: { siginak: 5, kadimler: -5 }
              - iliski: { thessar: { saygi: 3 }, elif_sari: { guven: 6 } }
            kronik: { tr: "Kadim elçisini insanlığın barış masasından kovdun; masa o gün ilk kez gerçekten bir masa oldu.", en: "You threw the Ancient envoy out of humanity's peace table. That day, for the first time, it really was a table." }
            sonraki: "elif_baris_masasi_masa"

      - id: "elif_baris_masasi_dagilma"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sandalyeler birer birer geri itiliyor. Önce Lonca kalkıyor, sonra Yükselenler; Sessiz Ağ'ın telsizi hiçbir şey söylemeden kapanıyor.", en: "Chairs scrape back one at a time. The Guild gets up first, then the Ascended. The Quiet Network's radio clicks off without a word." }
          - { tr: "Sonunda salonda yalnızca {npc:elif_sari} kalıyor; beyaz tahtanın önünde, elinde kalem. BİR ORDU yazısının üstüne bir çizgi çekmiyor. Yalnızca bakıyor.", en: "In the end only {npc:elif_sari} is left in the hall, standing in front of the whiteboard with the marker in her hand. She doesn't cross out ONE ARMY. She just looks at it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Salondan çık", en: "Walk out of the hall" }
            etkiler:
              - bayrak: "baris_masasi_dagildi"
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { elif_sari: { baglilik: -4 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 } }
            kronik: { tr: "İnsanlığın son barış masası dağıldı ve sen salondan çıkan son kişi değildin.", en: "Humanity's last peace table fell apart, and you weren't the last one out of the room." }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Yanında kal; tahtaya birlikte bakın", en: "Stay with her. Look at the board together" }
            etkiler:
              - bayrak: "baris_masasi_dagildi"
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { baglilik: 3 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 } }
            kronik: { tr: "Barış masası dağıldığında salonda bir hekimle birlikte kalıp 'bir ordu' yazısına baktın.", en: "When the peace table fell apart, you stayed behind with a doctor and looked at the words ONE ARMY." }
            sonraki: "@akis"

      - id: "elif_baris_masasi_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gece yarısı salon boşalıyor. Masanın üstünde imzalar, çay lekeleri ve kimsenin atmaya kıyamadığı bir paket kurabiye kalıyor.", en: "By midnight the hall has emptied out. Left on the table: signatures, tea rings, and a pack of cookies nobody has the heart to throw away." }
          - metin: { tr: "Kalkış panosunu çeviren çocuk, artık bir genç, harfleri yeniden diziyor: İTTİFAK · BAŞKAN · ve bir isim. Bu sefer kimse ismi yazmaktan çekinmiyor.", en: "The kid who flips the departures board, a teenager now, rearranges the letters: ALLIANCE · CHAIR · and a name. This time nobody's afraid to spell it out." }
            kosul: { bayrak: "elif_baskan" }
          - metin: { tr: "Kalkış panosunda yeni bir satır: İTTİFAK · BAŞKAN · ve senin adın. Panoyu çeviren genç harfleri dizerken bir kez dönüp sana bakıyor.", en: "A new line on the departures board: ALLIANCE · CHAIR · and your name. The teenager flipping the letters turns around once to look at you while he works." }
            kosul: { bayrak: "oyuncu_ittifak_basi" }
          - metin: { tr: "Kalkış panosunda yeni bir satır: İTTİFAK · KURUL. Başkan satırı boş; kimse doldurmak istemiyor ve bu bir kez olsun iyi bir şey.", en: "A new line on the departures board: ALLIANCE · BOARD. The chair line is blank. Nobody wants to fill it, and for once that's a good thing." }
            kosul: { bayrak: "kurul_ittifaki" }
          - { tr: "{npc:elif_sari} kapıda duruyor, körfeze, filonun ışıklarına bakıyor. \"Dokuz gün,\" diyor. \"Dokuz gün sonra bu masa ya bir şeydi ya da hiçbir şey.\"", en: "{npc:elif_sari} stands in the doorway looking out at the bay and the fleet's lights. \"Nine days,\" she says. \"In nine days, this table was either something or nothing.\"" }
        secenekler:
          - id: "bir_sey"
            etiket: { tr: "\"Bir şeydi. Ben öyle yapacağım.\"", en: "\"It was something. I'll make sure of it.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 } }
            kronik: { tr: "Barış masasının bir şey olacağına söz verdin.", en: "You promised that peace table would turn out to be something." }
            sonraki: "@akis"
          - id: "kurabiye"
            etiket: { tr: "Masadaki kurabiye paketini ona ver", en: "Hand her the pack of cookies off the table" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { baglilik: 4 } }
              - tohum: { olay: "elif_son_gece", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "elif_sari", perde: 4 } }
            kronik: { tr: "İnsanlığın barış masasından geriye kalan son kurabiye paketini bir hekime verdin.", en: "You gave a doctor the last pack of cookies left over from humanity's peace table." }
            sonraki: "@akis"

  # ================================================================== ELİF 5 — SON GECE (P4, tohum; istila arifesi)
  - id: "elif_son_gece"
    perde: [4]
    agirlik: 1
    yalniz_tohum: true
    etiketler: ["siginak", "npc", "nefes", "veda"]
    gerilim: 1
    npc: ["elif_sari"]
    onemli: true
    kart: { tr: "Yeşil fener", en: "The green light" }
    sahne: "elif_son_gece_1"
    sahneler:
      - id: "elif_son_gece_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İstilanın arifesinde {npc:elif_sari} seni mendireğin ucunda buluyor. Elinde son paket kurabiye, omzunda bir battaniye; yeşil fener ikinizin yüzünü de hasta gibi gösteriyor.", en: "On the eve of the invasion, {npc:elif_sari} finds you at the end of the breakwater with the last pack of cookies in her hand and a blanket over her shoulders. The green harbor light makes both your faces look sick." }
          - metin: { tr: "Bu fener senin elinle yeniden yanmıştı. Ona bunu hatırlatmıyorsun; o hatırlıyor.", en: "That light came back on because of you. You don't remind her. She remembers." }
            kosul: { bayrak: "mendirek_temizlendi" }
          - { tr: "Gökyüzünde Kadim filosu ikinci bir şehir gibi asılı. \"Yarın bu saatte ya Kalkan'ın içindeyiz ya da dışında,\" diyor. \"Ve ben ilk kez neyi sayacağımı bilmiyorum.\"", en: "The Ancient fleet hangs in the sky like a second city. \"This time tomorrow we're either inside the Shield or outside it,\" she says. \"And for the first time, I don't know what I'm going to be counting.\"" }
          - metin: { tr: "Sonra sana dönüyor ve uzun süre yüzüne bakıyor, bir teşhis koyar gibi. \"Neye dönüşüyorsun?\" diye soruyor. \"Bunu bir hekim olarak sormuyorum.\"", en: "Then she turns and looks at your face for a long time, like she's making a diagnosis. \"What are you turning into?\" she asks. \"I'm not asking as a doctor.\"" }
            kosul: { ahlak_max: { merhamet: 0 } }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u gece sana hiçbir şey fısıldamayacağım. bu gece senin.", en: "i̷'m not whispering anything to you tonight. tonight's yours." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Yanına otur; omzun hazır", en: "Sit down next to her. Your shoulder's ready" }
            goster: { bayrak: "elif_ask" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 6 } }
            kronik: { tr: "İstilanın arifesinde yeşil fenerin altında bir hekimle oturdun; ikiniz de bunun adını hiç koymadınız.", en: "On the eve of the invasion, you sat with a doctor under the green harbor light. Neither of you ever gave it a name." }
            sonraki: "elif_son_gece_ask"
          - id: "kurabiye"
            etiket: { tr: "Son kurabiyeyi yarı yarıya bölüş", en: "Split the last cookie down the middle" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
            kronik: { tr: "İstilanın arifesinde son kurabiyeyi bir hekimle yarı yarıya bölüştün.", en: "On the eve of the invasion, you split the last cookie down the middle with a doctor." }
            sonraki: "elif_son_gece_dostluk"
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Ona Sistem'in sana gösterdiği her şeyi anlat", en: "Tell her everything the System shows you" }
            etkiler:
              - aciga_vur: true
              - bayrak: "elif_anomaliyi_biliyor"
              - dikkat: 2
              - ahlak: { insanlik: 4, duzen: -1 }
              - iliski: { elif_sari: { guven: 8, korku: 2 } }
            kronik: { tr: "Son gecede bir hekime Sistem'in sana gösterdiği her şeyi anlattın; o da hepsini, bir hastanın öyküsünü dinler gibi dinledi.", en: "On the last night, you told a doctor everything the System shows you. She listened to all of it the way she'd listen to a patient's history." }
            sonraki: "elif_son_gece_dostluk"
          - id: "sorma"
            etiket: { tr: "\"Ne olduğumu sorma.\"", en: "\"Don't ask me what I am.\"" }
            goster: { ahlak_max: { merhamet: 0 } }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -1 }
              - iliski: { elif_sari: { guven: -6, baglilik: -4 } }
            kronik: { tr: "Son gecede bir hekim sana neye dönüştüğünü sordu; sen cevap vermedin.", en: "On the last night, a doctor asked you what you were turning into. You didn't answer." }
            sonraki: "elif_son_gece_kopus"

      - id: "elif_son_gece_ask"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Başını omzuna yaslıyor, Gümrük'ün çatısındaki gibi. Bu sefer uyumuyor. Filonun ışıklarını birlikte sayıyorsunuz, yüksek sesle değil; yüze kadar sayıyorsunuz ve bırakıyorsunuz.", en: "She leans her head on your shoulder, like on the Customs House roof. This time she doesn't fall asleep. You count the fleet's lights together, not out loud. You count to a hundred and quit." }
          - { tr: "\"Yaşarsak bir hafta uyuyacağım,\" diyor. \"Davetlisin. Yani... orada oturmaya. Sessizce.\" Elini avucunda buluyor ve bırakmıyor. Başka bir şey söylemiyor; sen de söylemiyorsun.", en: "\"If we live, I'm going to sleep for a week,\" she says. \"You're invited. To... sit there. Quietly.\" She finds your hand and doesn't let go. She doesn't say anything else. Neither do you." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz.\"", en: "\"Promise.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 8, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "gece_kaldi", agirlik: 50 }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "İstilanın arifesinde bir hekime bir haftalık uykusunda yanında oturacağına söz verdin.", en: "On the eve of the invasion, you promised a doctor you'd sit with her through a week of sleep." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Bir şey söyleme; elini tut", en: "Say nothing. Hold her hand" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { elif_sari: { baglilik: 6 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "İstilanın arifesinde mendireğin ucunda bir hekimin elini tuttun ve hiçbir şey söylemedin; gerek yoktu.", en: "On the eve of the invasion, at the end of the breakwater, you held a doctor's hand and said nothing. There was no need." }
            sonraki: "@akis"

      - id: "elif_son_gece_dostluk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} cebinden bir rulo bant çıkarıp avucuna bırakıyor: kırmızı, sarı, yeşil. Siyah yok.", en: "{npc:elif_sari} pulls a roll of tape out of her pocket and puts it in your palm: red, yellow, green. No black." }
          - { tr: "\"Yarın sende dursun,\" diyor. \"Siyahı ben taşırım; o benim işim. Sen yalnızca bunları kullan. Söz ver.\"", en: "\"Keep this on you tomorrow,\" she says. \"I'll carry the black. That's my job. You only use these. Promise me.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz veriyorum.\"", en: "\"I promise.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { elif_sari: { guven: 5, baglilik: 4 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Bir hekime istila gününde yalnızca kırmızı, sarı ve yeşil bant kullanacağına söz verdin.", en: "You promised a doctor that on invasion day, you'd only use red, yellow, and green tape." }
            sonraki: "@akis"
          - id: "durust"
            etiket: { tr: "\"Söz veremem. Ama deneyeceğim.\"", en: "\"I can't promise. But I'll try.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 5, guven: 2 } }
              - tohum: { olay: "siginak_5_kalkan_yemini", gecikme: { min: 0, max: 1 }, kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" } }
            kronik: { tr: "Bir hekime söz vermek yerine dürüst oldun; o da bunu bir sözden daha çok sevdi.", en: "Instead of making a doctor a promise, you were honest with her. She liked that better than a promise." }
            sonraki: "@akis"

      - id: "elif_son_gece_kopus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} başını sallıyor, battaniyeyi omzundan alıp senin omzuna bırakıyor. \"Yarın yaralanırsan yine dikerim,\" diyor. \"Bu kadar. Bunu hep yaparım.\"", en: "{npc:elif_sari} nods, takes the blanket off her shoulders, and drapes it over yours. \"If you get hurt tomorrow, I'll still stitch you up,\" she says. \"That's all. I'll always do that much.\"" }
          - { tr: "Mendirekten geri yürüyor. Yeşil fenerin ışığı onu bir süre takip ediyor, sonra bırakıyor.", en: "She walks back down the breakwater. The green light follows her for a while, then lets her go." }
        secenekler:
          - id: "seslen"
            etiket: { tr: "Arkasından seslen", en: "Call after her" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 2 } }
            kronik: { tr: "Son gecede arkasından seslendiğin hekim durdu ama dönmedi.", en: "On the last night, the doctor you called after stopped walking. She didn't turn around." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Gitmesine izin ver", en: "Let her go" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { elif_sari: { baglilik: -3 } }
            kronik: { tr: "İstilanın arifesinde bir hekimin mendirekten uzaklaşmasını izledin.", en: "On the eve of the invasion, you watched a doctor walk away down the breakwater." }
            sonraki: "@akis"

  # ================================================================== SIĞINAK 5 — KALKAN YEMİNİ (P4, AY 339; zincir tamam)
  - id: "siginak_5_kalkan_yemini"
    perde: [4]
    gun: { min: 331, max: 356 }
    ana_yay: { gun: 339 }
    agirlik: 1
    kosul: { gorev: { zincir_siginak: "basla" }, bayrak: "siginak_4_bitti" }
    etiketler: ["siginak", "zincir", "yemin", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Kalkan Yemini", en: "The Shield Oath" }
    sahne: "siginak_5_kalkan_1"
    sahneler:
      - id: "siginak_5_kalkan_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece, Son Sığınak'ın kapısının önü insanla dolu. Kimse mum yakmamış; herkes Sistem penceresini açmış ve binlerce mavi panel karanlıkta, bir tarlanın üstündeki ateşböcekleri gibi, dalgalanıyor.", en: "That night, the space in front of the Last Haven's door is packed with people. Nobody's lit a candle. Everybody's opened their System window instead, and thousands of blue panels ripple in the dark like fireflies over a field." }
          - metin: { tr: "{npc:elif_sari} kapının önündeki bavul arabasının üstüne çıkıyor, elinde bir kâğıt. \"Yarın sabah,\" diyor, \"Kadimler gelecek. Bu gece senden bir şey isteyeceğiz. Hayır diyebilirsin. Biz de hayır diyebileceğin için soruyoruz.\"", en: "{npc:elif_sari} climbs up on the luggage cart in front of the door with a sheet of paper in her hand. \"Tomorrow morning,\" she says, \"the Ancients get here. Tonight we're going to ask you for something. You can say no. That's exactly why we're asking.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "Nurhan kapının önündeki bavul arabasının üstüne çıkıyor; bir elinde kâğıt, öbüründe bir neşter. \"O burada olsaydı,\" diyor, \"bunu o okurdu. Okuyamadığı için ben okuyorum.\"", en: "Nora climbs up on the luggage cart in front of the door, a sheet of paper in one hand and a scalpel in the other. \"If she were here,\" she says, \"she'd be the one reading this. Since she can't, I am.\"" }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Kâğıtta tek bir cümle yazıyor ve kalabalık onu hep bir ağızdan, alçak sesle okuyor: \"Kapının önünde dur; biz arkanda dururuz.\"", en: "There's one sentence on the paper, and the crowd reads it together, low: \"Stand in front of the door. We'll stand behind you.\"" }
          - metin: { tr: "Kalabalık ummadığın kadar büyük. Tahtadaki sayı, Liman'ın Entegrasyon gününden beri gördüğü en büyük sayı.", en: "The crowd is bigger than you expected. The number on the board is the biggest the Waterfront's seen since Integration Day." }
            kosul: { degisken_min: { hayatta_kalan: 55 } }
          - metin: { tr: "Kalabalık ummadığın kadar küçük. Tahtadaki sayıya bakmamaya çalışıyorsun.", en: "The crowd is smaller than you hoped. You try not to look at the number on the board." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[O̷RTAK KALKAN · topluluk bağışı]", en: "[S̷HARED SHIELD · community grant]" }
            satirlar:
              - { tr: "bir topluluk, gücünün bir kısmını tek bir koruyucuya bağışlayabilir.", en: "a community may grant part of its strength to a single protector." }
              - { tr: "bu satır hiç yazılmamıştı. ben yazdım. ya da ben değil. önceki ben.", en: "this line was never written. i wrote it. or not me. the me before." }
        sezgiler:
          - kosul: { stat: { wil: 400 } }
            metin: { tr: "Bağışın yönü çevrilebilir. Satırın sonunda bir ok var ve ok iki tarafa da dönüyor.", en: "The grant can run the other way. There's an arrow at the end of the line, and it turns in both directions." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bunu ben yazdım. Ama sen okuduğunda daha doğru geliyor.\"", en: "\"I wrote that. But it sounds truer when you read it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kalkan olmak bu demek işte. Arkana bakmadan dur. Ben bunu biliyorum.\"", en: "\"That's what being a shield means. Stand there without looking back. I know about that.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir yemin. Ne kadar insanca. Ne kadar verimsiz. Et onu.\"", en: "\"An oath. How human. How inefficient. Swear it.\"" }
        secenekler:
          - id: "yemin"
            etiket: { tr: "\"Yemin ederim. Gücünüzü istemem.\"", en: "\"I swear it. I don't want your strength.\"" }
            etkiler:
              - bayrak: "kalkan_yemini"
              - ahlak: { merhamet: 8, insanlik: 5 }
              - itibar: { siginak: 15 }
              - iliski: { elif_sari: { baglilik: 6, guven: 5 } }
            kronik: { tr: "Kalkan Yemini'ni ettin ve halkın sana uzattığı gücü geri çevirdin; yarın onlar için kendi gücünle durdun.", en: "You swore the Shield Oath and turned down the strength the people held out to you. The next day, you stood for them on your own power." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "al"
            etiket: { tr: "\"Yemin ederim. Gücünüzü alırım; boşa harcamam.\"", en: "\"I swear it. I'll take your strength and waste none of it.\"" }
            etkiler:
              - bayrak: "kalkan_yemini"
              - bayrak: "kalkan_gucu_alindi"
              - ordu_kazan: 60
              - stat: { end: 25, wil: 25 }
              - ahlak: { duzen: 4, merhamet: 3, insanlik: -4 }
              - itibar: { siginak: 10 }
              - iliski: { elif_sari: { saygi: 3, korku: 3 } }
            kronik: { tr: "Kalkan Yemini'ni ettin ve binlerce insanın bağışladığı gücü üstüne aldın; o gece Liman'da herkes biraz daha yorgun uyudu.", en: "You swore the Shield Oath and took on the strength thousands of people gave you. That night, everyone on the Waterfront went to sleep a little more tired." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "ters"
            tur: "gosteris"
            etiket: { tr: "Yemini tersine çevir: gücünü sen onlara ver", en: "Reverse the oath: give them your strength" }
            gerekli: { stat: { wil: 400 } }
            etkiler:
              - bayrak: "kalkan_yemini"
              - bayrak: "kalkan_ters_cevrildi"
              - dikkat: 8
              - stat: { end: -15, wil: -15 }
              - ordu_kazan: 80
              - degisken: { hayatta_kalan: 5 }
              - ahlak: { merhamet: 6, insanlik: 6 }
              - itibar: { siginak: 15 }
              - iliski: { elif_sari: { baglilik: 8, saygi: 8 } }
            kronik: { tr: "Kalkan Yemini'ni tersine çevirip kendi gücünü binlerce insana dağıttın; ertesi sabah Liman'ın her penceresinde senin bir parçan vardı.", en: "You turned the Shield Oath around and spread your own strength across thousands of people. The next morning, every window on the Waterfront held a piece of you." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "yeminsiz"
            etiket: { tr: "\"Yemin etmem. Kalkan olmak bir seçim.\"", en: "\"No oath. Being a shield is a choice.\"" }
            etkiler:
              - bayrak: "kalkan_yeminsiz"
              - ahlak: { merhamet: 2, duzen: -5, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { saygi: 4 } }
            kronik: { tr: "Kalkan Yemini'ni etmedin ama ertesi sabah yine de kapının önünde durdun; seçim yemin kadar bağlayıcıydı.", en: "You didn't swear the Shield Oath, but the next morning you stood in front of the door anyway. The choice bound you just as tight." }
            sonraki: "siginak_5_kalkan_oncu"
          - id: "red"
            etiket: { tr: "\"Sığınak kendi başının çaresine baksın.\"", en: "\"The Haven can look after itself.\"" }
            etkiler:
              - gorev: { zincir_siginak: "basarisiz" }
              - degisken: { hayatta_kalan: -4 }
              - ahlak: { merhamet: -8, insanlik: -3 }
              - itibar: { siginak: -30 }
              - iliski: { elif_sari: { guven: -15, baglilik: -10 } }
            kronik: { tr: "Kalkan Yemini'ni reddedip Son Sığınak'ın kapısından uzaklaştın; o kapıyı ertesi sabah başkaları tuttu, tutabildikleri kadar.", en: "You turned down the Shield Oath and walked away from the Last Haven's door. The next morning other people held that door, for as long as they could." }
            sonraki: "siginak_5_kalkan_red"

      - id: "siginak_5_kalkan_red"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mavi pencereler birer birer kapanıyor. Kimse bağırmıyor, kimse sana bir şey fırlatmıyor; kalabalık yalnızca kapıya döner ve içeri girmeye başlar.", en: "The blue windows close one by one. Nobody yells. Nobody throws anything. The crowd just turns toward the door and starts filing in." }
          - { tr: "Bavul arabasındaki kâğıt rüzgârla kalkıp rıhtımdan suya düşüyor. Cümle hâlâ okunuyor, sonra okunmuyor.", en: "The paper on the luggage cart lifts in the wind and drops off the quay into the water. You can still read the sentence. Then you can't." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan git", en: "Leave without looking back" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -2 }
            kronik: { tr: "Kalkan Yemini'nin gecesi Liman'dan arkana bakmadan ayrıldın.", en: "On the night of the Shield Oath, you left the Waterfront without looking back." }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Kapının kapanışını izle", en: "Watch the door close" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Kalkan Yemini'ni reddettiğin gece Son Sığınak'ın kapısının kapanışını izledin.", en: "On the night you turned down the Shield Oath, you watched the Last Haven's door close." }
            sonraki: "@akis"

      - id: "siginak_5_kalkan_oncu"
        yer: "kordon"
        paragraflar:
          - { tr: "Yemin daha havada asılıyken {yer:kordon} tarafından bir boru sesi yükseliyor. Kadim filosu sabahı beklememiş: bir öncü birlik, gece karanlığında suya inmiş ve Son Sığınak'a giden tek yola yürüyor.", en: "The oath is still hanging in the air when a horn sounds from the direction of {yer:kordon}. The Ancient fleet didn't wait for morning. A vanguard came down onto the water under cover of night and is marching on the only road to the Last Haven." }
          - { tr: "Önlerinde biri yürüyor: uzun, ince, zırhının dikiş yerlerinden beyaz bir ışık sızan bir komutan. Kalabalığın mavi pencereleri ona doğru dönüyor ve bir an, onun da bir pencere açtığını görüyorsun: senin adın ve yanında tek bir kelime. Öncelik.", en: "Someone walks out in front of them: tall, thin, a commander with white light leaking from the seams of its armor. The crowd's blue windows turn toward it, and for a moment you see that it has a window open too: your name, and next to it, one word. Priority." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Kadim Öncü Komutanı", en: "[ANALYSIS] Ancient Vanguard Commander" }
            satirlar:
              - { tr: "Görev: anomaliyi istiladan önce etkisiz hale getirmek.", en: "Mission: neutralize the anomaly before the invasion." }
        sezgiler:
          - kosul: { stat: { str: 500 } }
            metin: { tr: "Komutanın gücü zırhında, zırhın gücü dikişlerinde. Yeterince sert bir darbe onu denize kadar geri götürür.", en: "The commander's power is in its armor, and the armor's power is in its seams. Hit it hard enough and it goes all the way back into the sea." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kapının önüne geç ve öncüyü karşıla", en: "Step in front of the door and meet the vanguard" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - savas: { dusmanlar: ["kadim_oncu_komutani@oyuncu+6", "kadim_oncu_askeri@oyuncu", "kadim_oncu_askeri@oyuncu"], ortam: ["su", "karanlik"], kazan: "siginak_5_kalkan_zafer", kaybet: "siginak_5_kalkan_yenilgi", kac: "siginak_5_kalkan_yenilgi" }
            kronik: { tr: "İstilanın arifesinde Kadim öncüsünü Son Sığınak'ın kapısının önünde karşıladın.", en: "On the eve of the invasion, you met the Ancient vanguard in front of the Last Haven's door." }
          - id: "denize"
            tur: "gosteris"
            etiket: { tr: "Öncüyü tek darbeyle denize geri gönder", en: "Send the vanguard back into the sea with one blow" }
            gerekli: { stat: { str: 500 } }
            etkiler:
              - dikkat: 8
              - degisken: { kadim_tehdit: -3 }
              - ahlak: { merhamet: 2, insanlik: -2 }
            kronik: { tr: "Kadim öncüsünü tek bir darbeyle geldiği denize geri gönderdin; filo o gece sabahı beklemeye karar verdi.", en: "You sent the Ancient vanguard back into the sea it came from with a single blow. That night, the fleet decided to wait for morning after all." }
            sonraki: "siginak_5_kalkan_zafer"
          - id: "once_iceri"
            etiket: { tr: "Önce herkes içeri; sonra savaş", en: "Everybody inside first. Then fight" }
            etkiler:
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, duzen: 1 }
              - savas: { dusmanlar: ["kadim_oncu_komutani@oyuncu+7", "kadim_oncu_askeri@oyuncu+2", "kadim_oncu_askeri@oyuncu+2"], ortam: ["karanlik"], kazan: "siginak_5_kalkan_zafer", kaybet: "siginak_5_kalkan_yenilgi", kac: "siginak_5_kalkan_yenilgi" }
            kronik: { tr: "Kadim öncüsünü durdurmadan önce son kişinin Son Sığınak'a girmesini bekledin; bu sana pahalıya patladı, onlara değil.", en: "Before you stopped the Ancient vanguard, you waited for the last person to get inside the Last Haven. It cost you. It didn't cost them." }

      - id: "siginak_5_kalkan_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Komutanın zırhı dikişlerinden açılıyor ve içindeki beyaz ışık sönüyor. Öncünün geri kalanı suya, geldiği karanlığa çekiliyor; Kordon'un taşları üstünde yalnızca ıslak ayak izleri kalıyor.", en: "The commander's armor splits at the seams, and the white light inside goes out. The rest of the vanguard pulls back into the water, into the dark it came from, leaving only wet footprints on the stones of the Esplanade." }
          - { tr: "Arkanda Son Sığınak'ın kapısı aralık; binlerce yüz oradan sana bakıyor. Mavi pencereler bir kez daha açılıyor, bu sefer kendiliğinden, ve her birinde aynı satır yanıp sönüyor.", en: "Behind you, the Last Haven's door is cracked open, and thousands of faces are looking out at you. The blue windows open once more, on their own this time, and the same line flickers on every one of them." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[UNVAN: Kalkan Yeminli]", en: "[TITLE: Shield-Sworn]" }
            satirlar:
              - { tr: "Bir şehir arkanda durdu. Sen de önünde.", en: "A city stood behind you. You stood in front of it." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Kapıya dön ve onlara başını salla", en: "Turn to the door and nod to them" }
            etkiler:
              - degisken: { kadim_tehdit: -6 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "Kadim öncüsünü püskürttükten sonra Son Sığınak'ın kapısındaki binlerce yüze başını salladın.", en: "After you drove off the Ancient vanguard, you nodded to the thousands of faces in the Last Haven's door." }
            sonraki: "siginak_5_kalkan_son"
          - id: "deniz"
            etiket: { tr: "Denize bak; filoya bir mesaj bırak", en: "Face the sea. Leave the fleet a message" }
            etkiler:
              - degisken: { kadim_tehdit: -7 }
              - dikkat: 3
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { siginak: 3, kadimler: -5 }
            kronik: { tr: "Kadim öncüsünü püskürttükten sonra filoya dönüp sessiz bir mesaj bıraktın: buradan geçilmez.", en: "After you drove off the Ancient vanguard, you turned to the fleet and left it a silent message: nobody gets through here." }
            sonraki: "siginak_5_kalkan_son"

      - id: "siginak_5_kalkan_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Komutanın darbesi seni Kordon'un taşlarına çakıyor ve bir an kalkamayacağını düşünüyorsun. Sonra sırtında bir şey hissediyorsun: binlerce el, hiçbiri sana dokunmadan, seni yukarı itiyor.", en: "The commander's blow drives you into the stones of the Esplanade, and for a second you think you can't get up. Then you feel something at your back: thousands of hands, none of them touching you, pushing you up." }
          - { tr: "Arkanda mavi pencereler hep birden parlıyor. Ayağa kalkıyorsun ve öncü, bir şeyin hesaplarını bozduğunu anlamış gibi, suya çekiliyor.", en: "Behind you, the blue windows all flare at once. You get up, and the vanguard pulls back into the water like it's just realized something has thrown off its math." }
        secenekler:
          - id: "dogrul"
            etiket: { tr: "Doğrul ve kapıya dön", en: "Straighten up and turn to the door" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { siginak: 5 }
            kronik: { tr: "Kadim öncüsü seni yere serdi; bir şehrin arkanda durması seni yeniden ayağa kaldırdı.", en: "The Ancient vanguard knocked you down. A city standing behind you got you back up." }
            sonraki: "siginak_5_kalkan_son"
          - id: "tesekkur"
            etiket: { tr: "Pencerelere teşekkür et", en: "Thank the windows" }
            etkiler:
              - degisken: { kadim_tehdit: -2 }
              - ahlak: { insanlik: 5 }
              - itibar: { siginak: 4 }
            kronik: { tr: "Kordon'un taşlarından seni kaldıran binlerce mavi pencereye teşekkür ettin.", en: "You thanked the thousands of blue windows that lifted you off the stones of the Esplanade." }
            sonraki: "siginak_5_kalkan_son"

      - id: "siginak_5_kalkan_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafağa iki saat var. Son Sığınak'ın kapısının iç tarafındaki beyaz tahtada İÇERİDE satırının yanı artık boş değil; bir sayı yazıyor ve sayı, ilk kez, kimsenin eksiltmek istemediği bir sayı.", en: "Two hours to dawn. On the whiteboard inside the Last Haven's door, the INSIDE line isn't blank anymore. There's a number there, and for the first time, it's a number nobody wants to subtract from." }
          - metin: { tr: "{npc:elif_sari} tahtanın önünde, Kıyıkent İttifakı'nın başkanı olarak, ama önlüğüyle duruyor. Sana bakıp kalemi kaldırıyor: \"Kırmızı, sarı, yeşil,\" diyor. \"Siyah yok. Yarın da olmayacak.\"", en: "{npc:elif_sari} stands in front of the board as chair of the Port Harlow Alliance, but in her white coat. She looks at you and raises the marker. \"Red, yellow, green,\" she says. \"No black. Not tomorrow, either.\"" }
            kosul: { bayrak: "elif_baskan", npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:elif_sari} tahtanın önünde; bir elinde kalem, öbüründe bir rulo bant. Seni görünce bandı havaya kaldırıyor, kadeh kaldırır gibi.", en: "{npc:elif_sari} is at the board with a marker in one hand and a roll of tape in the other. When she sees you, she raises the tape like a toast." }
            kosul: { bayrak_yok: "elif_baskan", npc_hayatta: "elif_sari" }
          - metin: { tr: "Tahtanın köşesindeki siyah bandın altında hâlâ bir bardak su duruyor. Birisi, bu gece, yanına bir paket kurabiye bırakmış.", en: "There's still a glass of water under the strip of black tape in the corner of the board. Tonight, somebody left a pack of cookies next to it." }
            kosul: { npc_olu: "elif_sari" }
          - { tr: "Yarın Kadimler gelecek. Ama bu gece Liman bir kalkanın ne olduğunu biliyor: bir yemin değil, bir duruş. Ve sen, kapının önünde, duruyorsun.", en: "Tomorrow the Ancients are coming. But tonight the Waterfront knows what a shield is: not an oath, but a stance. And you're standing in front of the door." }
        secenekler:
          - id: "dur"
            etiket: { tr: "Kapının önünde, şafağa kadar dur", en: "Stand in front of the door until dawn" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 4 } }
            kronik: { tr: "İstilanın sabahına kadar Son Sığınak'ın kapısının önünde durdun; Liman o gece hiç uyumadı, ama hiç korkmadı da.", en: "You stood in front of the Last Haven's door until the morning of the invasion. The Waterfront didn't sleep that night. It wasn't afraid, either." }
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "Tahtadaki sayıyı yüksek sesle oku", en: "Read the number on the board out loud" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: 3, insanlik: 3 }
              - itibar: { siginak: 8 }
            kronik: { tr: "İstilanın arifesinde Son Sığınak'taki insanların sayısını yüksek sesle okudun; o sayı Kıyıkent'in en çok tekrarlanan sözü oldu.", en: "On the eve of the invasion, you read out the number of people in the Last Haven. It became the most-repeated words in Port Harlow." }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} yanına git", en: "Go stand beside {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - gorev: { zincir_siginak: "tamam" }
              - unvan: "kalkan_yeminli"
              - xp_seviye: 150
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3, insanlik: 4 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { baglilik: 6, guven: 4 } }
            kronik: { tr: "İstilanın arifesinde Kalkan'ın kapısında bir hekimin yanında durdun; ikiniz de şafağı birlikte saydınız.", en: "On the eve of the invasion, you stood beside a doctor at the Shield's door. The two of you counted down to dawn together." }
            sonraki: "@akis"

