# Parti G — Perde 2 Kıyıkent: Liman, Kordon, Eski Şehir (docs/PERDE2_4.md §4 "Parti G").
# Havuz olayları: liman_kayiplar_duvari, liman_balikhane_karaborsa, liman_yan_yatmis_vapur, liman_karantina_gemisi,
# liman_konteyner_labirenti, kordon_kapi_catlagi, kordon_fener_baligi, kordon_fener_frekansi, kordon_son_balkon,
# kordon_heykel, kordon_olu_bolge_seferi, eski_sehir_kapi_avcilari, eski_sehir_ekmek_kuyrugu, eski_sehir_seviye_birler.
# Kendi takip olayları (yalniz_tohum): kayiplar_mektup, balikhane_hesap, vapur_ilk_sefer, kapi_avcilari_donus, fener_yavrulari.
# Dünya durumunu okur: cekirdek_*, uye_*, kordon_dustu/kordon_kurtarildi, kule_acik, yanki_gorundu, Deniz'in akıbeti,
# hayatta_kalan; Perde 1'den mahsur_kaptan_*, cete_oglan_kurtuldu, deniz_hic_bulunmadi.
olaylar:
  # ================================================================== KAYIPLAR DUVARI
  - id: "liman_kayiplar_duvari"
    konum: ["kiyikent_liman"]
    perde: [2]
    bolge: ["kiyikent_liman"]
    gun: { min: 31, max: 120 }
    agirlik: 6
    etiketler: ["kayip", "ahlak", "liman"]
    gerilim: 2
    onemli: true
    kart: { tr: "Kayıplar Duvarı", en: "The Wall of the Missing" }
    sahne: "kayiplar_1"
    sahneler:
      - id: "kayiplar_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İskelenin bekleme salonunda camlar artık dışarıyı göstermiyor. Fotoğraflar, kâğıt peçetelere karalanmış notlar, bantla, sakızla tutturulmuş çocuk resimleri karış karış kaplamış her yanı: Öğretici'den dönmeyenler.", en: "The windows of the ferry terminal's waiting room don't look out on anything anymore. Every inch is covered in photos, notes scrawled on napkins, kids' drawings held up with packing tape and chewing gum: the ones who never came back from the tutorial." }
          - { tr: "Duvarın önünde sessiz bir kalabalık birikmiş. Ağlayan yok; burada ağlamak için ya çok geç ya çok erken, hangisi olduğunu da kimse kestiremiyor.", en: "There's a quiet crowd in front of the glass. Nobody's crying. It's either too late or too early for that here, and nobody's sure which." }
          - metin: { tr: "Camların üst sırasından, bulutların arasında Kule'nin gri gövdesi seçiliyor. Biri, gölgesinin düştüğü fotoğrafları toplayıp bir kenara ayırmış; uğursuz sayıyorlar.", en: "Above the top row of photos, the Spire's gray trunk shows between the clouds. Somebody has moved every picture its shadow touches off to one side. They think it's bad luck." }
            kosul: { bayrak: "kule_acik" }
          - { tr: "Sırtında eski bir vapur gişesi yeleği olan bir kadın kalabalığı yarıp önüne dikiliyor. Elindeki fotoğrafta bıyıklı, ön dişi kırık bir balıkçı var, ağzı kulaklarında. \"O sensin,\" diyor. \"Her şeyi görüyormuşsun, öyle diyorlar.\"", en: "A woman in an old ferry ticket-booth vest pushes through the crowd and plants herself in front of you. She's holding a photo of a fisherman with a mustache, a chipped front tooth and an enormous grin. \"You're the one,\" she says. \"They say you see everything.\"" }
          - metin: { tr: "{npc:yanki|in} herkese göründüğü geceden beri şehirde penceren bozukmuş diye fısıldaşıp duruyorlar. Bu kadının gözünde o bozukluk bir umut kapısı.", en: "Ever since the night everyone saw {npc:yanki}, the whole city's been whispering that your window is broken. To this woman, broken means there might be a way in." }
            kosul: { bayrak: "yanki_gorundu" }
          - metin: { tr: "{npc:deniz_arman} yanından ayrılıp duvara yürüyor, ördeğe benzeyen bir martı resmini fotoğrafların arasına iğneliyor. Kardeşinin fotoğrafı yok; olsaydı da buraya asmaya yüreği dayanmazdı.", en: "{npc:deniz_arman} slips away from your side, walks up to the glass and pins a drawing of a gull that looks like a duck between the photos. There's no picture of {zamir:deniz_arman|onun} sister. Even if there were, {zamir:deniz_arman|o} couldn't stand to hang it here." }
            kosul: { yoldas: "deniz_arman", bayrak: "kardes_izi_bulundu" }
          - metin: { tr: "{npc:deniz_arman} duvarın önünde durmuş, gözleri fotoğraftan fotoğrafa atlıyor. Tek bir yüzü arıyor; her bulamayışında omuzları biraz daha çöküyor.", en: "{npc:deniz_arman} stands in front of the glass, eyes jumping from photo to photo. {zamir:deniz_arman|b|o} {zamir:deniz_arman|is} looking for one face, and every time it isn't there, {zamir:deniz_arman|onun} shoulders sink a little lower." }
            kosul: { yoldas: "deniz_arman", bayrak_yok: "kardes_izi_bulundu" }
          - metin: { tr: "Duvarın sol köşesinde tanıdık bir yüz duruyor: {npc:deniz_arman}. Fotoğraf vapurda çekilmiş; elinde simit, arkasında martılar. Altına titrek bir elle yazılmış: \"Öğretici'de gören oldu mu? Annesi.\"", en: "Down in the left-hand corner of the glass there's a face you know: {npc:deniz_arman}. The photo was taken on the ferry, a soft pretzel in hand, gulls in the background. Under it, in shaky handwriting: \"Did anybody see my kid in the tutorial? — Mom.\"" }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Fotoğrafların arasına beyaz bir el ilanı sıkıştırılmış: \"Kayıplarınızı Sistem'e sorun. Seçilmişler cevap alır.\" Köşesinde ördeğe benzeyen küçük bir martı var; o eli nerede görsen tanırsın.", en: "Someone has wedged a white flyer between the photos: \"Ask the System about your missing. The Chosen get answers.\" In the corner there's a tiny gull that looks like a duck. You'd know that handwriting anywhere." }
            kosul: { bayrak: "deniz_yukselenlere_gitti" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "siradan"
            baslik: { tr: "Fotoğraftaki adam", en: "The man in the photo" }
            satirlar:
              - { tr: "Kayıt aranıyor... Kayıt bulunamadı.", en: "Searching records... No record found." }
              - { tr: "Kamu erişimi: yok.", en: "Public access: none." }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Analizini fotoğraflardan birinin üstüne kaydırınca köşede soluk, gri bir satır titreşmeye başlıyor. Herkese \"kayıt yok\" diyen pencerenin sana söyleyecek bir sözü daha var.", en: "When you slide your analysis across one of the photos, a faint gray line flickers in its corner. The window that tells everybody \"no record\" wants to tell you something else." }
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Kadının parmak uçları nasır bağlamış; yirmi yıl bilet koparmış eller bunlar. Fotoğrafı o kadar çok tutmuş ki adamın yüzü ortasından solmuş.", en: "Her fingertips are calloused, twenty years of tearing ticket stubs. She's held that photo so often the man's face has worn pale in the middle." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷istem herkesin defterini tutar. sayfaların çoğu kapalıdır ama senin için birkaçını aralayabilirim. bedeli yok. şimdilik.", en: "t̷he system keeps a ledger on everybody. most of the pages are shut. i can crack a few for you. no charge. for now." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ne görürsen gör, kadına yalan söyleme. Bir gün o duvarın önünde ben de duracağım.\"", en: "\"Whatever you see, don't lie to her. Someday I'm going to be the one standing in front of that wall.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Umut ilaç gibidir. Dozu yanlışsa öldürür.\"", en: "\"Hope's like a drug. Get the dose wrong and it kills.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Kocasının satırını oku; gördüğünü söyle", en: "Read her husband's line. Tell her what you see" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - bilgi: "duvar_kayit_satiri"
              - bayrak: "kayip_koca_yasiyor"
            kronik: { tr: "Ölülerin defterini aralayıp bir kadına aradığı satırı okudun.", en: "At the Wall of the Missing you opened the ledger of the dead and read one woman the line she was looking for." }
            sonraki: "kayiplar_satir"
          - id: "duvar"
            tur: "aciga_vur"
            etiket: { tr: "Bütün duvarı oku; herkes öğrensin", en: "Read the whole wall. Let everyone know" }
            gerekli: { stat: { per: 45 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, insanlik: 2 }
              - bilgi: "duvar_kayit_satiri"
              - bayrak: "kayip_duvar_okundu"
              - bayrak: "kayip_koca_yasiyor"
            kronik: { tr: "Kayıplar Duvarı'nı herkesin gözü önünde baştan sona okudun; kimin öldüğünü, kimin yaşadığını o gece bütün iskele öğrendi.", en: "You read the Wall of the Missing end to end in front of everyone, and that night the whole terminal learned who was dead and who was alive." }
            sonraki: "kayiplar_herkes"
          - id: "umut"
            etiket: { tr: "Okumadan ona umut ver", en: "Give her hope without reading a thing" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - bayrak: "kayip_umut_verildi"
            kronik: { tr: "Tek satır okumadan bir kadına kocasının yaşadığını söyledin; şans eseri haklı çıktın.", en: "You told a woman her husband was alive without reading a single line, and by dumb luck you were right." }
            sonraki: "kayiplar_umut"
          - id: "balikhane"
            etiket: { tr: "Onu balıkhanedeki kayıt satıcılarına gönder", en: "Send her to the record-sellers at the fish hall" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - bayrak: "kayip_balikhaneye"
              - tohum: { olay: "liman_balikhane_karaborsa", gecikme: { min: 0, max: 2 }, kosul: { bayrak_yok: "balikhane_goruldu" } }
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 6, max: 12 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Kocasını arayan bir kadına kendin bakacağına onu karaborsaya yolladın.", en: "Instead of looking for yourself, you sent a woman hunting for her husband to the black market." }
            sonraki: "kayiplar_balikhane"
          - id: "deniz_not"
            etiket: { tr: "{npc:deniz_arman|in} fotoğrafının altına not bırak", en: "Leave a note under {npc:deniz_arman|pos} photo" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4 }
            kronik: { tr: "Son anını bilen tek kişi olarak {npc:deniz_arman|in} fotoğrafının altına bir not iliştirdin.", en: "Under {npc:deniz_arman|pos} photo you left a note, as the only one who knew how it ended." }
            sonraki: "kayiplar_deniz"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Hiçbir şey göremediğini söyle", en: "Tell her you can't see anything" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: -3, merhamet: -2 }
            kronik: { tr: "Gördüğünü kendine saklayıp bir kadını beklemekle baş başa bıraktın.", en: "At the Wall of the Missing you kept what you saw to yourself and left a woman to go on waiting." }
            sonraki: "@akis"

      - id: "kayiplar_satir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gözünü fotoğrafa dikince gri satır kalınlaşıyor, harfler birer birer yerine oturuyor. Sistem'in herkese \"kayıt yok\" dediği adam için pencerende bir dosya açılıyor.", en: "You focus on the photo. The gray line thickens and the letters settle into place, and for the man the System tells everyone has no record, a file opens in your window." }
          - { tr: "Adam yaşıyor. Bulunmak istemiyor; kimseye ne istediğini sormamış olan Sistem de bu tek isteğini harfi harfine yerine getiriyor.", en: "He's alive. He doesn't want to be found, and the System, which never asked anybody what they wanted, is honoring that one wish to the letter." }
          - { tr: "Kadın gelgit tablosu okur gibi dikkatle yüzünü okuyor. \"Ne yazıyor?\"", en: "She's reading your face like a tide table, carefully. \"What does it say?\"" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "nadir"
            baslik: { tr: "[GİZLİ KAYIT]", en: "[HIDDEN RECORD]" }
            satirlar:
              - { tr: "Durum: Aktif · Seviye: 14", en: "Status: Active · Level: 14" }
              - { tr: "Konum: gizlendi · Gizleyen: kayıt sahibi", en: "Location: hidden · Hidden by: record holder" }
              - { tr: "Not: Kayıt sahibi aranmak istemiyor.", en: "Note: Record holder does not wish to be located." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷aklanmayı seçmiş. insan bunu ancak utanınca yapar. ya da korkunca. çoğu zaman ikisi aynı şeydir.", en: "h̷e chose to hide. people only do that when they're ashamed. or scared. most of the time that's the same thing." }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Her şeyi söyle: yaşıyor ve saklanıyor", en: "Tell her all of it. He's alive, and he's hiding" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 3 }
              - bayrak: "kayip_gercek_soylendi"
              - itibar: { siginak: 2 }
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 4, max: 9 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Bir kadına kocasının hem yaşadığını hem de ondan saklandığını söyledin; ikisini birden yüklenmek ona düştü.", en: "You told a woman her husband was alive and hiding from her, and she had to carry both at once." }
            sonraki: "kayiplar_son"
          - id: "yarim"
            etiket: { tr: "Yalnızca yaşadığını söyle", en: "Tell her he's alive. Just that" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - bayrak: "kayip_yarim_gercek"
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 4, max: 9 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Bir kadına kocasının yaşadığını söyleyip gerisini yuttun.", en: "You told a woman her husband was alive and kept the rest of it to yourself." }
            sonraki: "kayiplar_son"
          - id: "olu"
            etiket: { tr: "Öldüğünü söyle; beklemekten kurtulsun", en: "Tell her he's dead. Let her stop waiting" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 1, merhamet: -2 }
              - bayrak: "kayip_olu_dendi"
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 6, max: 12 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Hâlâ nefes alan bir adam için bir kadına yas tutmasını söyledin.", en: "You told a woman to grieve a man who was still breathing." }
            sonraki: "kayiplar_son"
          - id: "soz"
            etiket: { tr: "Onu bulup getireceğine söz ver", en: "Promise you'll find him and bring him home" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - bayrak: "kayip_soz"
              - bayrak: "kayip_gercek_soylendi"
              - gorev: { duvardaki_isim: "basla" }
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 3, max: 6 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Bir yabancıya, saklanan kocasını bulup eve getireceğine söz verdin.", en: "In front of the Wall of the Missing you promised a stranger you'd bring her hiding husband home." }
            sonraki: "kayiplar_son"

      - id: "kayiplar_herkes"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini kaldırdığında Analiz camın üstüne dalga gibi yayılıyor. Üç yüz fotoğrafın köşesinde üç yüz gri satır birden yanıyor, sıra sıra dizilmiş mumlar gibi.", en: "You raise your hand and your analysis rolls across the glass like a wave. Three hundred gray lines light up in the corners of three hundred photos at once, row after row, like candles." }
          - { tr: "Ön sıradaki bir genç satırları yüksek sesle okumaya başlıyor, sonra susup kalıyor. Çoğunda tek bir kelime yazılı: Silindi.", en: "A kid in the front row starts reading them out loud, then stops. Most of them say one word: Deleted." }
          - { tr: "Önce bir sessizlik çöküyor, ardından dalga geliyor. Biri dizlerinin üstüne yığılıyor, bir başkası camdan bir fotoğraf söküp göğsüne bastırıyor; arkalardan biri bağırıyor: \"Bu nasıl yapıyor bunu? Bizim için neden yapamıyor?\"", en: "First the silence, then the wave. Someone drops to their knees, someone tears a photo off the glass and crushes it to their chest, and from the back somebody yells, \"How is that one doing this? Why can't it do this for us?\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Toplu Analiz]", en: "[Bulk Analysis]" }
            satirlar:
              - { tr: "Okunan kayıt: 312 · Silindi: 271 · Aktif: 38 · Okunamadı: 3", en: "Records read: 312 · Deleted: 271 · Active: 38 · Unreadable: 3" }
              - { tr: "Bu işlem kamuya açık bir alanda yapıldı. Not edildi.", en: "This operation was performed in a public space. Noted." }
          - tur: "yanki"
            baslik: { tr: "[o̷kunamadı]", en: "[u̷nreadable]" }
            satirlar:
              - { tr: "o üç satıra bakma. ya da bak. ama sonra bana kızma.", en: "don't look at those three. or do. just don't get mad at me after." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Kalabalıkta kal; herkesle tek tek konuş", en: "Stay with the crowd. Talk to them one by one" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 5 }
              - gun: 1
              - bayrak: "kayip_gercek_soylendi"
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 4, max: 9 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Sabaha kadar duvarın önünden ayrılmadın; yüzlerce insana kaybını kendi ağzınla söyledin.", en: "You spent the whole night at the Wall of the Missing telling hundreds of people their losses in your own voice." }
            sonraki: "kayiplar_son"
          - id: "konsey"
            etiket: { tr: "Kocasınınkini ona göster; gerisini Konsey'e bırak", en: "Show her husband's. Leave the rest to the Council" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Duvarı okuduktan sonra yasın işini Konsey'e havale ettin.", en: "After reading the wall, you handed the business of grief over to the Council." }
            sonraki: "kayiplar_satir"
          - id: "ucu"
            etiket: { tr: "Okunamayan üç satıra bak", en: "Look at the three unreadable lines" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - dikkat: 2
              - iliski: { yanki: { guven: 4 } }
              - bilgi: "duvar_ayrilmis_uc"
            kronik: { tr: "Kimsenin okuyamadığı üç satıra eğildin ve orada kendi etiketini tanıdın.", en: "At the Wall of the Missing you looked at the three lines no one could read, and recognized your own tag." }
            sonraki: "kayiplar_ayrilmis"

      - id: "kayiplar_ayrilmis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Üç fotoğraf, duvarın üç ayrı köşesinde: dişsiz ağzıyla gülen yaşlı bir kadın, okul önlüklü bir oğlan, kasklı bir kurye. Satırları gri değil; seninki gibi adı konmamış bir renkte titreşiyor.", en: "Three photos in three different corners of the wall: a toothless old woman laughing, a boy in a school uniform, a delivery courier in a bike helmet. Their lines aren't gray. They flicker in a color with no name, like yours." }
          - { tr: "Üçünün altında da aynı kelime yazılı: Ayrıldı. Öğretici'deki o defterin son sayfasında, adının yanında gördüğün kelimenin ta kendisi.", en: "Under all three is the same word: Reserved. The word you saw on the last page of that ledger in the tutorial, next to your own name." }
          - { tr: "{npc:yanki} sesini alçaltıyor: bunlar senin gibiydi. ya da senin gibi olacaklardı. sistem onlara da bir parça göndermişti, tutunamadılar.", en: "{npc:yanki} drops its voice: they were like you. or they were going to be. the system sent them a piece too. they couldn't hold on." }
        secenekler:
          - id: "sor"
            etiket: { tr: "{npc:yanki|e} sor: onlara ne oldu?", en: "Ask {npc:yanki} what happened to them" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 3, saygi: 2 } }
            kronik: { tr: "Senden önce tutunamayanları {npc:yanki|e} sordun; aldığın cevap hoşuna gitmedi.", en: "You asked {npc:yanki} about the ones before you who couldn't hold on, and you didn't like the answer." }
            sonraki: "kayiplar_ayrilmis_cevap"
          - id: "kapat"
            etiket: { tr: "Pencereyi kapat, kadına dön", en: "Close the window. Go back to the woman" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
            kronik: { tr: "Kendine benzeyen üç ölünün satırını kapatıp yaşayanlara döndün.", en: "You shut the lines of three dead people too much like you and went back to the living." }
            sonraki: "kayiplar_satir"

      - id: "kayiplar_ayrilmis_cevap"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "bilmiyorum, diyor {npc:yanki}. sonra, daha uzun bir sessizliğin ardından: yalan. biliyorum. parça bir bedene bağlanır; beden onu taşıyamazsa ikisi birden silinir. sen taşıdın. şimdilik.", en: "i don't know, {npc:yanki} says. then, after a longer silence: that's a lie. i know. the piece binds to a body. if the body can't carry it, both get deleted. you carried it. so far." }
          - { tr: "Gözün kurye çocuğun kaskına takılıyor. Biri üstüne keçeli kalemle \"Hızlı teslimat\" yazmış.", en: "You look at the courier's helmet. Somebody wrote SPEEDY DELIVERY across it in Sharpie." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Hiçbir şey deme, kadına dön", en: "Say nothing. Go back to the woman" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Senin yerinde olabilecek üç insanın neden silindiğini öğrendin ve sesini çıkarmadın.", en: "You learned why three people who could have been you were deleted, and you told no one." }
            sonraki: "kayiplar_satir"

      - id: "kayiplar_umut"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Yaşıyor,\" diyorsun. Fotoğrafa göz ucuyla bile bakmadan kadının yüzüne bakıyor, o yüz ne duymak istiyorsa onu söylüyorsun.", en: "\"He's alive,\" you say. You don't even look at the photo. You look at her face and tell it what it wants to hear." }
          - { tr: "Kadın fotoğrafı göğsüne bastırmış; hem gülüyor hem ağlıyor. Arkasındaki kalabalıktan birkaç kişi, ellerinde kendi fotoğraflarıyla sana doğru bir adım atıyor.", en: "She crushes the photo to her chest and laughs and cries at the same time. A few people in the crowd behind her take a step toward you, holding out their own photos." }
          - { tr: "{npc:yanki|in} sesi kupkuru: satırı okumadan doğruyu söyledin. aferin. bu seferlik.", en: "{npc:yanki}, dry as dust: you told the truth without reading the line. congratulations. this time." }
        secenekler:
          - id: "simdi_oku"
            etiket: { tr: "Şimdi gerçekten oku", en: "Now actually read it" }
            goster: { stat: { per: 30 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - bilgi: "duvar_kayit_satiri"
              - bayrak: "kayip_koca_yasiyor"
            kronik: { tr: "Bir kadına önce umut verdin, sonra o umudun neye dayandığını okudun.", en: "You gave a woman hope first, then went back and read what that hope was standing on." }
            sonraki: "kayiplar_satir"
          - id: "diger"
            etiket: { tr: "Öteki fotoğraflara da umut dağıt", en: "Hand out hope for the other photos too" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -4, insanlik: -2 }
              - itibar: { yukselenler: 4, siginak: -2 }
              - dikkat: 2
            kronik: { tr: "Kayıplar Duvarı'nın önünde tek satır okumadan bütün kalabalığa umut dağıttın.", en: "At the Wall of the Missing you handed out hope to the whole crowd without reading a single line." }
            sonraki: "kayiplar_son"
          - id: "git"
            etiket: { tr: "Onu sevinciyle baş başa bırak, uzaklaş", en: "Leave her with her joy and walk away" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: -1 }
              - tohum: { olay: "kayiplar_mektup", gecikme: { min: 6, max: 12 }, hatirlatma: { tr: "Kayıplar Duvarı'nda yardım ettiğin kadın seni unutmadı.", en: "The woman you helped at the Wall of the Missing hasn't forgotten you." } }
            kronik: { tr: "Bir kadını, doğruluğundan senin bile emin olmadığın bir sevinçle bırakıp gittin.", en: "You left a woman with a joy even you weren't sure was true." }
            sonraki: "kayiplar_son"

      - id: "kayiplar_balikhane"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Balıkhanede kayıt satanlar var,\" diyorsun. \"Kristal karşılığı. Onlar benden iyi bakar.\"", en: "\"There are people at the fish hall who sell records,\" you say. \"For crystals. They'll look harder than I can.\"" }
          - { tr: "Kadın seni uzun uzun süzüyor. Ardından fotoğrafı yeleğinin iç cebine koyup düğmesini ilikliyor ve tek kelime etmeden kalabalığa karışıp kayboluyor.", en: "She gives you a long look. Then she tucks the photo into the inside pocket of her vest, buttons it shut and disappears into the crowd without a word." }
          - { tr: "{npc:yanki} mırıldanıyor: az önce sana bakarken ne gördü, biliyor musun? onlardan birini.", en: "{npc:yanki} mutters: you know what she saw when she looked at you just now? one of them." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Omzunu silk ve yürü", en: "Shrug it off and walk" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir kadının gözünde karaborsacılardan biri oldun; omuz silkip geçtin.", en: "You became one of the black marketeers in a woman's eyes, and you shrugged." }
            sonraki: "@akis"
          - id: "arkasindan"
            etiket: { tr: "Arkasından seslen; fikrini değiştir", en: "Call after her. Change your mind" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak_kaldir: "kayip_balikhaneye"
            kronik: { tr: "Bir kadını karaborsaya gönderdin, sonra arkasından koşup geri çağırdın.", en: "You sent a woman to the black market, then ran after her and called her back." }
            sonraki: "kayiplar_1"

      - id: "kayiplar_deniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Fotoğrafın altındaki boşluğa ne yazacağını uzun uzun düşünüyorsun. Sonunda yalnızca şunu yazıyorsun: \"Gördüm. Benim için durdu. Yalnız değildi.\"", en: "You stand there a long time trying to decide what to write in the blank space under the photo. In the end you write only this: \"I saw. Stood their ground for me. Wasn't alone.\"" }
          - { tr: "Arkanda biri nefesini tutuyor. Elinde yeni bir fotoğraf ve bir rulo bantla ufak tefek, kır saçlı bir kadın dikilmiş; seni tanıyor. On yıl boyunca her bayram sofrasına senin tabağını da koymuş biri.", en: "Behind you, someone's breath catches. A small gray-haired woman is standing there with a fresh photo and a roll of tape, and she knows you. Ten years of holiday dinners where she set a place for you too." }
          - { tr: "\"Sen dönmüşsün,\" diyor; sitem değil bu, yalnızca bir tespit. Sonra notu okuyor ve bant elinden yere düşüyor.", en: "\"You came back,\" she says. Not an accusation. Just a fact. Then she reads the note, and the tape falls out of her hand." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Ona her şeyi anlat; son anına kadar", en: "Tell her everything. Right to the end" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 2 }
              - bayrak: "deniz_annesi_bildi"
            kronik: { tr: "{npc:deniz_arman|in} annesine, çocuğunun Öğretici'nin kapısında senin yerine nasıl dikildiğini anlattın.", en: "You told {npc:deniz_arman|pos} mother how her kid stood at the tutorial's gate in your place." }
            sonraki: "kayiplar_deniz_son"
          - id: "kayboldu"
            etiket: { tr: "\"Öğretici'de birbirimizi kaybettik\" de; yalan söyle", en: "Say you lost each other in there. Lie" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -3 }
              - bayrak: "deniz_annesi_bekliyor"
            kronik: { tr: "{npc:deniz_arman|in} annesine yalan söyledin; kadın yeni fotoğrafı eskisinin yanına bantlayıp beklemeye koyuldu.", en: "You lied to {npc:deniz_arman|pos} mother, and she taped a new photo up beside the old one and settled in to wait." }
            sonraki: "kayiplar_deniz_son"

      - id: "kayiplar_deniz_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Anlatırken sesin bir kez bile titremiyor; titreyen onun sesi. Sonunda fotoğrafı duvardan indirip notunu da içine katlıyor. \"Bunu evde asarım,\" diyor. \"Burası bekleyenlerin yeri.\"", en: "Your voice doesn't crack once while you tell it. Hers does. When you're done, she takes the photo down and folds your note in with it. \"I'll hang this at home,\" she says. \"This wall is for people who are still waiting.\"" }
            kosul: { bayrak: "deniz_annesi_bildi" }
          - metin: { tr: "Kadın başını sallayıp yeni fotoğrafı eskisinin yanına bantlıyor. \"O zaman beklerim,\" diyor. \"Hep geç kalırdı zaten. Vapura bile.\"", en: "She nods and tapes the new photo up next to the old one. \"Then I'll wait,\" she says. \"Always was late anyway. Even for the ferry.\"" }
            kosul: { bayrak: "deniz_annesi_bekliyor" }
          - { tr: "Arkasını dönüp gitmeden sana sarılıyor; öyle kısa sürüyor ki sonradan gerçekten olup olmadığına emin olamıyorsun.", en: "Before she turns to go, she hugs you. It's so quick that later you can't be sure it really happened." }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Fotoğraflı kadına geri dön", en: "Go back to the woman with the photo" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Kendi yasını bir kenara koyup bir yabancının kaybına döndün.", en: "You set your own grief aside and went back to a stranger's." }
            sonraki: "kayiplar_1"
          - id: "git"
            etiket: { tr: "İskeleden çık; bugün bu kadarı yeter", en: "Leave the terminal. That's enough for today" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "O gün iskeleden tek bir yabancının yüzüne bakmadan çıktın.", en: "That day you walked away from the Wall of the Missing without looking at a single stranger." }
            sonraki: "@akis"

      - id: "kayiplar_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kadın parmaklarını fotoğrafta, adamın solmuş yüzünde gezdiriyor. \"Saklanıyorsa bir bildiği vardır,\" diyor. \"Onu ben bulurum. Yirmi yıllık evliyiz; saklambaçta hep ben kazandım.\"", en: "She touches the photo, the faded face. \"If he's hiding, he's got a reason,\" she says. \"I'll find it. Twenty years married. I always won hide-and-seek.\"" }
            kosul: { bayrak: "kayip_gercek_soylendi" }
          - metin: { tr: "Kadın fotoğrafı yeniden cama bantlıyor, bu kez altına iri harflerle tek bir satır ekliyor: \"YAŞIYOR.\" Kalabalıktan geçenlerin birkaçı uğur getirsin diye o kelimeye dokunuyor.", en: "She tapes the photo back on the glass, and this time she adds a line under it in big block letters: ALIVE. A few people in the crowd touch the word as they pass, for luck." }
            kosul: { bayrak: "kayip_yarim_gercek" }
          - metin: { tr: "Kadın fotoğrafı camdan ağır ağır ayırıyor, bant artıklarını tırnağıyla tek tek kazıyor. Ağlamıyor; teşekkür ediyor. Ağlasa daha iyiydi.", en: "She peels the photo off the glass slowly and picks the tape off with her thumbnail, piece by piece. She doesn't cry. She thanks you, which is worse." }
            kosul: { bayrak: "kayip_olu_dendi" }
          - metin: { tr: "Kadın fotoğrafı yeleğinin cebine koyup sana bakıyor, verdiğin sözün ağırlığını tartar gibi. \"Bekliyorum o zaman,\" diyor. \"Yirmi yıl bekledim; vapuru da, onu da.\"", en: "She slips the photo into her vest pocket and looks at you like she's weighing your promise. \"Then I'll wait,\" she says. \"I've waited twenty years. For the ferry and for him.\"" }
            kosul: { bayrak: "kayip_soz" }
          - metin: { tr: "Kadın sevincini duvara asar gibi fotoğrafın yanına yeni bir not iliştiriyor: \"Dönüyor.\" O sözün kimden çıktığını herkes biliyor; seninle göz göze gelmemek için başlarını çeviriyorlar.", en: "She hangs her joy on the wall: a new note next to the photo, COMING HOME. Everybody knows who said so, and they turn their heads so they won't catch your eye." }
            kosul: { bayrak: "kayip_umut_verildi", bayrak_yok: ["kayip_gercek_soylendi", "kayip_yarim_gercek", "kayip_olu_dendi", "kayip_soz"] }
          - { tr: "Dışarıda akşam vapurunun düdüğü ötünce iskeledeki bütün başlar kalkıyor. Vapur yan yatmış, düdüğü rüzgâr çalıyor; yine de bütün başlar kalkıyor.", en: "Outside the terminal a ferry horn sounds, and every head comes up. The ferry is lying on its side and it's only the wind blowing through the horn, but every head comes up anyway." }
        secenekler:
          - id: "cik"
            etiket: { tr: "İskeleden çık", en: "Leave the terminal" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 20
            kronik: { tr: "Duvarın önünden ayrılırken sana uzanan elleri saymadın.", en: "Walking away from the Wall of the Missing, you didn't count the hands that reached for you." }
            sonraki: "@akis"
          - id: "fotograf"
            etiket: { tr: "Kendi kaybın için duvara bir şey as", en: "Put something on the wall for your own lost" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - stat: { wil: 1 }
              - xp_seviye: 20
            kronik: { tr: "Herkesin kaybını okuduğun duvarın bir köşesine kendi kaybını da astın.", en: "On the wall where you read everyone else's losses, in one corner, you hung your own." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ kayıplar duvarı: saklanan adam (tohum)
  - id: "kayiplar_mektup"
    konum: ["kiyikent_liman"]
    perde: [2]
    agirlik: 1
    etiketler: ["kayip", "ahlak", "liman"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Ölüden Alan", en: "Takes From the Dead" }
    sahne: "mektup_1"
    sahneler:
      - id: "mektup_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gişe yelekli kadın, şehrin hangi köşesinde olursan ol seni buluyor; nefes nefese, elinde katlanmış bir kâğıt. \"Balıkhanenin rıhtımında görmüşler onu,\" diyor. \"Geceleri suya giriyormuş.\"", en: "The woman in the ticket-booth vest finds you, wherever you happen to be, out of breath, a folded scrap of paper in her hand. \"They saw him on the fish hall pier,\" she says. \"At night. Going into the water.\"" }
          - metin: { tr: "Verdiğin sözü sen de hatırlıyorsun, kadın da. Kâğıdı uzatırken tek söz etmesine gerek kalmıyor.", en: "You remember your promise. So does she. When she hands you the paper she doesn't need to say a thing." }
            kosul: { bayrak: "kayip_soz" }
          - metin: { tr: "\"Bana öldü demiştin,\" diyor; sesi dümdüz. \"Ölüler gece suya girmez.\"", en: "\"You told me he was dead,\" she says, flat, very flat. \"Dead men don't go swimming at night.\"" }
            kosul: { bayrak: "kayip_olu_dendi" }
          - metin: { tr: "\"Balıkhanedekiler benden bir kese kristal aldı,\" diyor. \"Kayıt yok dediler. Sonra biri kulağıma bunu fısıldadı, hem de bedavaya.\"", en: "\"The fish hall people took a pouch of crystals off me,\" she says. \"Said there was no record. Then somebody whispered this in my ear. For free.\"" }
            kosul: { bayrak: "kayip_balikhaneye" }
          - { tr: "Kâğıtta bir rıhtım numarasıyla bir saat yazılı: gece yarısından sonra, gelgit dönerken.", en: "On the paper: a pier number and a time. After midnight, when the tide turns." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "g̷ece suya giren adamlar ne arar, biliyor musun? kendilerini değil.", en: "y̷ou know what men are looking for when they go into the water at night? not themselves." }
        secenekler:
          - id: "git"
            etiket: { tr: "Gece yarısı rıhtıma git", en: "Go to the pier at midnight" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
            kronik: { tr: "Bir kadının saklanan kocasını bulmak için gece yarısı balıkhanenin rıhtımına indin.", en: "You went down to the fish hall pier at midnight to find a woman's hiding husband." }
            sonraki: "mektup_rihtim"
          - id: "kadinla"
            etiket: { tr: "Kadını da yanına al", en: "Bring her with you" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "mektup_kadin_geldi"
            kronik: { tr: "Bir kadını, saklanmak isteyen kocasıyla yüz yüze getirmek için gece rıhtıma götürdün.", en: "You took a woman down to the pier at night to stand face to face with a husband who wanted to stay hidden." }
            sonraki: "mektup_rihtim"
          - id: "reddet"
            etiket: { tr: "Bulunmak istemeyen bir adamı arama", en: "Don't go looking for a man who doesn't want to be found" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -2 }
              - gorev: { duvardaki_isim: "basarisiz" }
            kronik: { tr: "Bulunmak istemeyen bir adamın isteğine saygı gösterdin; onu bekleyen kadın da beklemeye devam etti.", en: "You respected a man's wish to stay lost, and left the woman waiting for him to go on waiting." }
            sonraki: "@akis"

      - id: "mektup_rihtim"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Rıhtıma bir kayık bağlı, kayıkta tek bir fener yanıyor. Adam sırtına halatla bağlanmış ağır, ıslak bir yükle sudan çıkıyor: bir insan bedeni. Kayığın dibinde bir kova dolusu Öz Kristali parıldıyor.", en: "There's a skiff at the pier with a single lantern. The man comes up out of the water with a heavy, wet load roped to his back. A human body. In the bottom of the skiff, a bucket of Essence Crystals glows." }
            kosul: { bayrak_yok: "balikhane_kapatildi" }
          - metin: { tr: "Rıhtım bomboş; balıkhane kapandığından beri suya giren olmamış. Adam ters çevrilmiş bir kayığın altında battaniyelere sarınmış uyuyor. Çevresinde boş şişeler, bir de sudan çıktığından beri yerine kaldırılmamış bir dalgıç maskesi.", en: "The pier's empty. Nobody's gone into the water since the fish hall shut down. The man is asleep under an overturned skiff, wrapped in blankets, empty bottles all around and a dive mask that never got put away." }
            kosul: { bayrak: "balikhane_kapatildi" }
          - { tr: "Başının üstünde, herkesin görebileceği yerde Sistem'in ona verdiği unvan asılı duruyor; gizleyemediği tek satır: [Ölüden Alan].", en: "Hanging over his head, right where anybody can see it, is the title the System gave him. The one line he can't hide: [Takes From the Dead]." }
          - { tr: "Seni görünce kaçmıyor. \"Öğretici'de,\" diyor, \"ilk haftaydı. Arkadaşım düştü, kristali de yere düştü. Aldım. Sonra bir tane daha. Sistem de bunu adımın üstüne yazdı, karım okusun diye.\"", en: "He doesn't run when he sees you. \"In the tutorial,\" he says, \"first week. My buddy went down, and his crystal dropped. I took it. Then another one. The System wrote it over my head. So my wife could read it.\"" }
          - metin: { tr: "Karısı rıhtımın başında duruyor. Unvanı okuyup bir adım atıyor; geriye değil, ileriye.", en: "His wife is standing at the head of the pier. She reads the title, and she takes a step. Not back. Forward." }
            kosul: { bayrak: "mektup_kadin_geldi" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "nadir"
            baslik: { tr: "Rıhtımdaki adam", en: "The man on the pier" }
            satirlar:
              - { tr: "Sv. 14 · Sınıf: Dalgıç · Unvan: Ölüden Alan (görünür, kaldırılamaz)", en: "Lv. 14 · Class: Diver · Title: Takes From the Dead (visible, cannot be removed)" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ satırı örtebilirim, seninkileri örttüğüm gibi. ama örttüğüm her şeyden bana biraz bulaşır. bilmende fayda var.", en: "i̷ can cover that line. same way i cover yours. but everything i cover rubs off on me a little. figured you should know." }
          - kosul: { stat: { per: 30 }, bayrak: "kordon_dustu" }
            metin: { tr: "Sırtındaki cesedin bileğinde bir hastane bilekliği var: {yer:kordon|den}, taşmada ölenlerden biri.", en: "The body on his back is wearing a hospital wristband. From {yer:kordon}, one of the gate-break dead." }
          - kosul: { stat: { per: 30 }, bayrak_yok: "kordon_dustu" }
            metin: { tr: "Sırtındaki bedenin üstünde Öğretici'nin tozu hâlâ duruyor. Dönüş gecesi ışık herkesi kıyıya bırakmadı; kimini körfezin ortasına bıraktı.", en: "The body on his back is still dusted with the tutorial. On the night of the return the light didn't drop everybody on the shore. It dropped some of them in the middle of the sound." }
        secenekler:
          - id: "eve"
            etiket: { tr: "Onu eve götür; unvanıyla birlikte", en: "Take him home, title and all" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - gorev: { duvardaki_isim: "tamam" }
              - bayrak: "kayip_aile_birlesti"
              - itibar: { siginak: 3 }
              - xp_seviye: 35
              - tohum: { olay: "liman_balikhane_karaborsa", gecikme: { min: 1, max: 4 }, kosul: { bayrak_yok: "balikhane_goruldu" }, hatirlatma: { tr: "Ölüden alan adamın hikâyesi seni balıkhaneye çıkarıyor.", en: "The story of the man who took from the dead leads you to the fish market." } }
            kronik: { tr: "Ölülerden kristal toplayan bir adamı, unvanı başının üstünde asılıyken evine, karısının sofrasına götürdün.", en: "You sat a man who took crystals off the dead down at his wife's table with his title still hanging over his head." }
            sonraki: "mektup_son"
          - id: "maske"
            etiket: { tr: "{npc:yanki|e} unvanını örttür", en: "Have {npc:yanki} cover his title" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -2 }
              - dikkat: 3
              - iliski: { yanki: { guven: 5, baglilik: 3 } }
              - bayrak: "kayip_maske"
              - bayrak: "kayip_aile_birlesti"
              - gorev: { duvardaki_isim: "tamam" }
              - xp_seviye: 35
            kronik: { tr: "Bir adamın utancını {npc:yanki|e} yedirdin; satır söndü ve {npc:yanki} biraz daha ağırlaştı.", en: "You fed a man's shame to {npc:yanki}. The line went out, and {npc:yanki} got a little heavier." }
            sonraki: "mektup_son"
          - id: "sec"
            etiket: { tr: "Karısının fotoğrafını ver; kararı ona bırak", en: "Give him his wife's photo. Leave it to him" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 2 }
              - bayrak: "kayip_koca_secti"
              - gorev: { duvardaki_isim: "tamam" }
              - xp_seviye: 25
              - tohum: { olay: "liman_balikhane_karaborsa", gecikme: { min: 1, max: 4 }, kosul: { bayrak_yok: "balikhane_goruldu" }, hatirlatma: { tr: "Ölüden alan adamın hikâyesi seni balıkhaneye çıkarıyor.", en: "The story of the man who took from the dead leads you to the fish market." } }
            kronik: { tr: "Saklanan bir adamın eline karısının yıpranmış fotoğrafını tutuşturup kararı ona bıraktın.", en: "You handed a hiding man his wife's worn-out photo and left the rest to him." }
            sonraki: "mektup_son"
          - id: "birak"
            etiket: { tr: "Karısına öldüğünü söyle; onu burada bırak", en: "Tell his wife he's dead. Leave him here" }
            goster: { bayrak_yok: "mektup_kadin_geldi" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -3 }
              - bayrak: "kayip_koca_birakildi"
              - gorev: { duvardaki_isim: "basarisiz" }
            kronik: { tr: "Yaşayan bir adamı karısının gözünde ölü ilan edip ölüleri sırtlamaya devam etsin diye onu rıhtımda bıraktın.", en: "You declared a living man dead to his wife and left him on the pier to keep hauling the dead." }
            sonraki: "mektup_son"

      - id: "mektup_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kadın unvanı bir kez daha okuyup kocasının ıslak yüzünü iki avucunun arasına alıyor. \"Ben bilet kopardım,\" diyor. \"Yirmi yıl. Kimse bana o biletlerle insanların nereye gittiğini sormadı.\" Rıhtımdan birlikte çıkıp gidiyorlar.", en: "She reads the title one more time, then takes his wet face in both hands. \"I tore tickets,\" she says. \"Twenty years. Nobody ever asked me where those tickets took people.\" They walk off the pier together." }
            kosul: { bayrak: "kayip_aile_birlesti", bayrak_yok: "kayip_maske" }
          - metin: { tr: "{npc:yanki} satırın üstüne eğilince satır mum gibi sönüveriyor. Başının üstünü yoklayıp orada hiçbir şey kalmadığını gören adam çocuk gibi hıçkıra hıçkıra ağlamaya başlıyor. {npc:yanki} ise ağzında bir tat kalmış gibi susmuş.", en: "{npc:yanki} leans over the line and it goes out like a candle. The man reaches up over his head, feels nothing there, and cries like a little kid. {npc:yanki} goes quiet, like it's got a taste in its mouth." }
            kosul: { bayrak: "kayip_maske" }
          - metin: { tr: "Adam fotoğrafa uzun uzun bakıp kayığın fenerini söndürüyor. Ertesi sabah Kayıplar Duvarı'ndaki fotoğrafın altında bir satır daha beliriyor, kadının el yazısı değil bu: \"Geliyorum. Biraz zaman ver.\"", en: "He stares at the photo for a long time, then blows out the skiff's lantern. The next morning, under the photo on the Wall of the Missing, there's one more line, not in her handwriting: COMING. GIVE ME A LITTLE TIME." }
            kosul: { bayrak: "kayip_koca_secti" }
          - metin: { tr: "Kadına kocasının öldüğünü söylüyorsun; fotoğrafı duvardan indiriyor. O gece rıhtımda bir fener daha yanıyor, bir adam yine suya giriyor.", en: "You tell her her husband is dead. She takes the photo off the wall. That night another lantern burns on the pier and a man goes back into the water." }
            kosul: { bayrak: "kayip_koca_birakildi" }
        secenekler:
          - id: "son"
            etiket: { tr: "Rıhtımdan ayrıl", en: "Leave the pier" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Öğretici'de kazanılmış bir unvanın bir adama neye mal olduğunu gördün, sonra rıhtımı arkanda bıraktın.", en: "You saw what one tutorial title cost a man, and you walked off the pier." }
            sonraki: "@akis"

  # ================================================================== BALIKHANE KARABORSASI
  - id: "liman_balikhane_karaborsa"
    konum: ["kiyikent_liman"]
    perde: [2]
    bolge: ["kiyikent_liman"]
    gun: { min: 34, max: 170 }
    agirlik: 5
    etiketler: ["karaborsa", "ahlak", "liman", "hakimiyet"]
    gerilim: 3
    onemli: true
    kart: { tr: "Balıkhanenin kantarı", en: "The scale at the fish hall" }
    sahne: "balikhane_1"
    sahneler:
      - id: "balikhane_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Eski balık halinin oluklu sac çatısı yer yer çökmüş; duvardaki saat altıyı kırk geçe, Entegrasyon'un dakikasında kalmış. Bir zamanlar levrekle çipuranın serildiği mermer tezgâhlarda şimdi iksir, canavar çekirdeği, bidon bidon temiz su ve üstünde \"seviye maskesi\" yazan küçük, parlak yamalar satılıyor.", en: "The old fish auction hall's corrugated roof has caved in here and there, and the clock on the wall stopped at 6:40, the minute of Integration. The marble counters that used to hold salmon and Dungeness crab now hold potions, monster cores, jerry cans of clean water and little shiny patches labeled LEVEL MASK." }
          - { tr: "Ortada mezatın eski kantarı duruyor: dökme demir, iki ton, kefesi bir kayık genişliğinde. Başında bir kadın, balık mezatçılarına özgü o hızlı, şarkı gibi sesle kristal satıyor; başının üstünde Seviye 31 yazan bir pencere asılı.", en: "In the middle sits the old auction scale: cast iron, two tons, a pan as wide as a rowboat. A woman stands at it selling crystals in that fast, sing-song auctioneer's chant, a window over her head that reads Level 31." }
          - { tr: "Kantarın iki yanında birer kiralık avcı nöbet tutuyor. Tezgâhtaki Öz Kristalleri öyle bol, öyle düzgün ki bu şehirde o kadar canavar öldürülmüş olamaz.", en: "Two hired hunters stand watch on either side of the scale. There are so many Essence Crystals on the counter, all so smooth and even, that nobody in this city could have killed that many monsters." }
          - metin: { tr: "Kapının üstünde Lonca'nın demir mührü asılı: [Katkı ödendi]. Turuncu kol bantlı bir tahsildar kantarın yanına oturmuş, her satıştan onda birini ayırıp sayıyor.", en: "The Guild's iron stamp is over the door: [Contribution paid]. A collector in an orange armband sits by the scale and counts out a tenth of every sale." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Konsey burayı yasakladığı için kapıda ıslıkla haber veren üç çocuk gözcü bekliyor. Burada satılan her iksir, Konsey'in reçeteyle dağıttığının üç katı fiyatına gidiyor.", en: "The Council banned this place, so there are three kid lookouts at the door who whistle when anybody official comes. Every potion here goes for three times what the Council hands out on prescription." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Kantarın önünde beyazlar giymiş insanlar sıraya girmiş. Yükselenler'in yakıt listesinden düşmek için kristal alıyorlar; sunuya ne kadar çok götürürlerse o kadar seçilmiş sayılıyorlar.", en: "There's a line in white robes in front of the scale. They're buying crystals to get off the Ascended's fuel list. The more they bring to the offering, the more Chosen they count as." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Köşedeki tezgâhta satılan bir şey yok; kulaklıkları boynunda bir kadın oturmuş, ağzını açmadan dinliyor. Ağ'ın kulakları burada da.", en: "The stall in the corner isn't selling anything. Just a woman sitting there with headphones around her neck, listening and saying nothing. The Network has ears here too." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "İçeri adımını atar atmaz bütün balıkhane susuyor. Kantarcı kefeye bir kese kristal koyup sana doğru itiyor: [Bölge sahibinin payı]. İsteyen olmadı; pay kendiliğinden geliyor.", en: "The moment you walk in, the whole fish hall goes quiet. The woman at the scale sets a pouch of crystals in the pan and slides it toward you: [Region holder's share]. Nobody asked for it. It just shows up." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Muhafızlardan biri seni tepeden tırnağa süzüp yanından geçerken omuzluyor. \"Taşıyıcılık arıyorsan arka kapı.\"", en: "One of the guards looks you up and down and checks you with his shoulder on the way past. \"Looking for porter work? Back door.\"" }
            kosul: { gizli_fark_min: 10, bayrak_yok: "cekirdek_oyuncu" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "siradan"
            baslik: { tr: "Kantarcı", en: "The Weighmaster" }
            satirlar:
              - { tr: "Görünen Sv. 31 · Gerçek Sv. 18", en: "Shown Lv. 31 · True Lv. 18" }
              - { tr: "Etkin yetenek: Mezat Sesi (Nadir) · ikna", en: "Active skill: Auction Chant (Rare) · persuasion" }
            kosul: { stat: { per: 35 } }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Canavar kristali pürüzlü olur, kenarlarına kapının pası siner. Bunlarsa cam gibi pürüzsüz; ışığa tutunca içlerinde parmak izi kadar ince çizgiler beliriyor.", en: "Monster crystals are rough, with Gate rust on the edges. These are smooth as glass, and inside, when they catch the light, there are lines as fine as fingerprints." }
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Kantarcı kefeye her kristal koyuşunda gözlerini kaçırıyor. Mezatçı balığın gözüne bakmaz; tazeliğini sezer.", en: "Every time she sets a crystal in the pan, she looks away. Auctioneers never look a fish in the eye. They just know." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷nsanlar da kristal düşürür. sistem bunu kimseye söylemedi. söylemesine gerek kalmadı.", en: "p̷eople drop crystals too. the system never told anybody. it didn't have to." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu iksirlerin yarısı benim hastanemden çalındı. Etiketlerimi tanırım.\"", en: "\"Half these potions walked out of my hospital. I know my own labels.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kristallerin hepsi aynı frekansta tınlıyor. Şey... bu normal değil. Hiç değil.\"", en: "\"Every one of those crystals is ringing at the same frequency. That's, uh, not normal. At all.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Buranın kokusu değişmemiş. Hâlâ ölü bir şey kokuyor.\"", en: "\"Place still smells the same. Like something dead.\"" }
        secenekler:
          - id: "kaynak"
            etiket: { tr: "Kristallerin nereden geldiğini sor", en: "Ask where the crystals come from" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "balikhane_goruldu"
            kronik: { tr: "Balıkhanenin kantarında satılan kristallerin nereden geldiğini soran ilk kişi sendin.", en: "You were the first one to ask where the crystals on the fish hall scale came from." }
            sonraki: "balikhane_kaynak"
          - id: "kantar"
            tur: "gosteris"
            etiket: { tr: "Kantarı tek elle kaldır; kefedekileri dök", en: "Lift the scale one-handed. Dump the pan" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - dikkat: 3
              - bayrak: "balikhane_goruldu"
              - bayrak: "balikhane_korkutuldu"
              - bilgi: "kantarci_gercek_seviye"
            kronik: { tr: "İki tonluk mezat kantarını tek elle kaldırıp kefedeki kristalleri yere döktün; balıkhanede kimse sesini çıkaramadı.", en: "You lifted a two-ton auction scale with one hand and dumped its pan on the floor, and nobody in the fish hall made a sound." }
            sonraki: "balikhane_kantar"
          - id: "sat"
            etiket: { tr: "Canavar çekirdeklerini kantara koy", en: "Put your monster cores on the scale" }
            gerekli: { esya: { canavar_cekirdegi: 1 } }
            etkiler:
              - esya: { canavar_cekirdegi: -1 }
              - oz_kristali: 2
              - ahlak: { duzen: -1, insanlik: -1 }
              - bayrak: "balikhane_goruldu"
            kronik: { tr: "Balıkhanenin kantarına ilk önce satıcı olarak yanaştın.", en: "You stepped up to the fish hall scale as a seller first." }
            sonraki: "balikhane_ticaret"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış, yalnızca izle", en: "Blend into the crowd. Just watch" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -1 }
              - bayrak: "balikhane_goruldu"
            kronik: { tr: "Balıkhanede seni taşıyıcı sanmalarına ses etmedin.", en: "At the fish hall you let them take you for a porter and kept your mouth shut." }
            sonraki: "balikhane_izle"

      - id: "balikhane_izle"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mermer tezgâhlardan birine yaslanıyorsun. Kimse dönüp sana ikinci kez bakmıyor; görünen seviyenle burada sıradan bir taşıyıcıdan farkın yok.", en: "You lean against one of the marble counters. Nobody looks at you twice. With the level you're showing, you're just another porter here." }
          - { tr: "Arka kapıdan, elinde bir kova dolusu kristalle sırılsıklam bir dalgıç giriyor. Kovayı kefeye boşaltırken içinden bir şey kayıp ayağının dibine düşüyor: suyla şişmiş plastik bir yaka kartı.", en: "A diver in a wet suit comes in the back door with a bucket of crystals. When he dumps it into the pan, something slides out and lands at your feet: a waterlogged plastic ID badge on a lanyard." }
          - { tr: "Kartta bir yüz var; bir cumartesi sabahı, bir okul kantininde çekilmiş.", en: "There's a face on the badge. Taken one Saturday morning, in a school cafeteria." }
          - metin: { tr: "Muhafızın gözü yine sana takılıyor. \"Yere düşen kantarındır, taşıyıcı,\" deyip karta uzanan eline basıyor.", en: "The guard notices you again. \"Whatever hits the floor belongs to the scale, porter,\" he says, and he steps on your hand when you reach for the badge." }
            kosul: { gizli_fark_min: 10 }
        secenekler:
          - id: "sor"
            etiket: { tr: "Kartı al, kantarcıya götür", en: "Pick up the badge. Take it to the Weighmaster" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Bir ölünün yaka kartını kantara geri götürüp hesabını sordun.", en: "You carried a dead person's ID badge back to the fish hall scale and asked for an accounting." }
            sonraki: "balikhane_kaynak"
          - id: "bilek"
            tur: "gosteris"
            etiket: { tr: "Muhafızın ayağını elinle kaldır", en: "Lift the guard's foot off with your hand" }
            gerekli: { stat: { str: 35 } }
            goster: { gizli_fark_min: 10 }
            etkiler:
              - ahlak: { duzen: -1, merhamet: -1 }
              - dikkat: 2
              - bayrak: "balikhane_korkutuldu"
            kronik: { tr: "Seni taşıyıcı sanan muhafızı, elinin üstündeki botuyla birlikte havaya kaldırdın.", en: "The guard who took you for a porter got lifted into the air by the boot he had on your hand." }
            sonraki: "balikhane_bilek"
          - id: "cik"
            tur: "gizle"
            etiket: { tr: "Kartı bırak, dışarı çık", en: "Leave the badge. Walk out" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -3, merhamet: -2 }
            kronik: { tr: "Bir ölünün yaka kartını balıkhanenin zemininde bırakıp gölgede kalmayı yeğledin.", en: "You left a dead person's ID badge on the fish hall floor and chose to stay hidden." }
            sonraki: "@akis"

      - id: "balikhane_bilek"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Muhafızı ayak bileğinden tutup kaldırıyorsun; hiç acele etmeden, mutfak masasından kedi indirir gibi. Adam havada asılı kalıyor, öbür ayağı yere değmiyor.", en: "You take the guard's boot by the ankle and lift, no hurry at all, like you're moving a cat off the kitchen table. He hangs there, his other foot not touching the floor." }
          - { tr: "Balıkhane bir anda buz kesiyor. Kantarcının başındaki pencere titreşiyor; bir anlığına herkes gerçeği görüyor: 31 değil, 18.", en: "The fish hall goes dead quiet. The window over the Weighmaster's head flickers, and for one second everybody sees the truth: not 31. Eighteen." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Muhafızı yere bırak; kartı al", en: "Set the guard down. Pick up the badge" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bilgi: "kantarci_gercek_seviye"
            kronik: { tr: "Seni küçümseyen muhafızı incitmeden yere bıraktın ve ölünün kartını aldın.", en: "You set down the guard who'd looked down on you without hurting him, and picked up the dead kid's badge." }
            sonraki: "balikhane_kaynak"

      - id: "balikhane_kantar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kantarın kolunu kavrıyorsun. Dökme demir inliyor, cıvatalar betondan sökülüyor; iki ton, tepsi gibi omuz hizana kalkıyor.", en: "You get a grip on the scale's arm. The cast iron groans, the bolts tear out of the concrete, and two tons come up to shoulder height like a serving tray." }
          - { tr: "Kefedeki kristaller yere yağıp dolu taneleri gibi sekiyor. İki muhafız silaha davranmaya bile yeltenmeden geri çekiliyor.", en: "The crystals in the pan rain down onto the floor, bouncing like hail. The two guards don't even reach for their weapons. They both back up." }
          - { tr: "Kantarcının başındaki pencere korkuyla titreşip sönüyor. Geriye, balık mezatlarından kalma bir yeleğin içinde Seviye 18 bir kadın kalıyor.", en: "The window over the Weighmaster's head shudders with fear and goes out. Underneath, in a vest left over from the fish auctions, stands a Level 18 woman." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ak nasıl bakıyorlar. hoşuna gidiyor. bana yalan söyleme, hoşuna gidiyor.", en: "l̷ook at them looking at you. you like it. don't lie to me. you like it." }
        secenekler:
          - id: "indir"
            etiket: { tr: "Kantarı yerine koy, soracağını sor", en: "Set the scale down. Ask your question" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "Kantarı yerine koydun; balıkhanedekilerin gözü ise hâlâ onu kaldırdığın andaydı.", en: "You put the scale back down, but what the fish hall remembered was the moment you lifted it." }
            sonraki: "balikhane_kaynak"

      - id: "balikhane_ticaret"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kantarcı çekirdeklerini tartıp ışığa tutuyor ve iyi bir fiyat söylüyor; fazla iyi. \"Canavar kristali,\" diyor, \"pürüzlü, paslı, dürüst. Bu aralar az bulunur.\"", en: "The Weighmaster weighs your cores, holds them up to the light and names a good price. Too good. \"Monster crystal,\" she says. \"Rough, rusty, honest. Hard to come by these days.\"" }
          - { tr: "Sonra sesini alçaltıyor. \"Senin gibi birini kantarın arkasında görmek isterdim. Kantarla kimse tartışmaz; seninle hiç tartışmaz. Payın onda üç.\"", en: "Then she lowers her voice. \"I'd love someone like you behind this scale. Nobody argues with a scale. Nobody'd ever argue with you. Three in ten is yours.\"" }
        secenekler:
          - id: "ortak"
            etiket: { tr: "Kabul et; onda üçünü al", en: "Take the deal. Three in ten" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -4 }
              - oz_kristali: 3
              - bayrak: "balikhane_ortak"
              - bayrak: "balikhane_pay"
              - itibar: { siginak: -3 }
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Neyin tartıldığını sormadan balıkhanenin kantarından pay almaya razı oldun.", en: "You agreed to take a cut off the fish hall scale without asking what was being weighed." }
            sonraki: "balikhane_ortaklik"
          - id: "neden"
            etiket: { tr: "Önce bu kadar kristalin kaynağını söyle", en: "First tell me where all these crystals come from" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
            kronik: { tr: "Bir ortaklık teklifine kristallerin kaynağını sorarak cevap verdin.", en: "You answered a partnership offer by asking where the crystals came from." }
            sonraki: "balikhane_kaynak"

      - id: "balikhane_ortaklik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kantarcı elini sıkıyor; avucu nasırlı, buz gibi. Arka kapıdan bir dalgıç bir kova daha getiriyor, kantarın arkasında sen durduğun için de kimse kovanın içine bakmıyor.", en: "She shakes your hand. Her palm is calloused and cold. A diver brings in another bucket through the back door, and because you're standing behind the scale, nobody looks inside it." }
          - { tr: "{npc:yanki} uzun süre bir şey demiyor. Çok sonra konuşuyor: artık sen de bir şey tartıyorsun. ne olduğunu bilmemek ellerini temiz tutmaz.", en: "{npc:yanki} says nothing. Then, much later: you're weighing something now too. not knowing what it is doesn't keep your hands clean." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kristallerini al ve çık", en: "Take your crystals and go" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - oz_kristali: 3
            kronik: { tr: "Kantardan ilk payını aldın; kovaların içine bakmadın.", en: "You took your first cut from the fish hall scale and never looked inside the buckets." }
            sonraki: "@akis"

      - id: "balikhane_kaynak"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kantarcı mezatçılara has bir gülüşle gülüyor. \"Canavarlar kristal düşürür, bilirsin. Uyanmış insanlar da düşürür. Kimse söylemedi, çünkü kimse sormadı.\"", en: "She laughs, an auctioneer's laugh. \"Monsters drop crystals, you know that. So do awakened people. Nobody said so because nobody asked.\"" }
            kosul: { bayrak_yok: "balikhane_korkutuldu" }
          - metin: { tr: "Kantarcı bu kez gülmüyor. Sesi titriyor ama mezattaki gibi hızlı hızlı konuşuyor. \"İnsanlar. Uyanmış insanlar da kristal düşürür. Kimse söylemedi, çünkü kimse sormadı. Yemin ederim, ben kimseyi öldürmedim.\"", en: "This time she doesn't laugh. Her voice shakes, but she talks fast, like she's working an auction. \"People. Awakened people drop crystals too. Nobody said so because nobody asked. I swear to God I never killed anybody.\"" }
            kosul: { bayrak: "balikhane_korkutuldu" }
          - { tr: "\"Dönüş gecesi ışık herkesi kıyıya bırakmadı. Kimini körfezin ortasına bıraktı: yüzme bilmeyenleri, yaşlıları, çocukları. Dalgıçlarım her gece onları sudan çıkarıyor. Ölünün kristali kimsenin değildir; ben de kimsenin olmayanı satarım.\"", en: "\"On the night of the return, the light didn't drop everybody on the beach. Some it dropped in the middle of the sound. People who couldn't swim, old folks, kids. My divers pull them out every night. A dead man's crystal belongs to nobody, and I sell what belongs to nobody.\"" }
          - metin: { tr: "\"Taşmadan beri iş açıldı,\" diye ekliyor. \"{yer:kordon|in} açıkları dolu.\"", en: "\"Business picked up after the gate break,\" she adds. \"The water off {yer:kordon} is full.\"" }
            kosul: { bayrak: "kordon_dustu" }
          - { tr: "Arkasındaki tezgâhta kristaller ışığı yakalıyor; her birinin içinde parmak izi kadar ince bir çizgi var. Artık ne olduklarını biliyorsun.", en: "Behind her, on the counter, the crystals catch the light. Inside each one there's a line as fine as a fingerprint. Now you know what they are." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Bir kristale uzun uzun bakınca çizgi bir harfe, ardından bir başkasına dönüşüyor. İçlerinde sahiplerinin adı yazılı ve sen okuyabiliyorsun.", en: "Stare at a crystal long enough and the line turns into a letter, then another. Their owners' names are written inside them. You can read them." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷stersen hepsini yiyebilirim, biliyorsun. öz özdür; kimin olduğu umurumda olmaz. senin umurunda mı?", en: "y̷ou know i could eat every one of these if you let me. essence is essence. i don't care whose it was. do you?" }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Balıkhaneyi kapat", en: "Shut the fish hall down" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 3 }
              - bilgi: "balikhane_kristal_kaynagi"
              - savas: { dusmanlar: ["balikhane_kiralik_avci@dunya", "balikhane_kiralik_avci@dunya"], ortam: ["dar_gecit"], kazan: "balikhane_kapandi", kaybet: "balikhane_yenilgi", kac: "balikhane_yenilgi" }
            kronik: { tr: "Ölülerden kristal satan balıkhaneyi kapatmak için kiralık avcıların üstüne yürüdün.", en: "You went at the hired muscle to shut down the fish hall that sold crystals off the dead." }
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; kimse kılını kıpırdatmasın", en: "Show your true level. Nobody so much as twitches" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 4, insanlik: 2 }
              - bilgi: "balikhane_kristal_kaynagi"
              - bayrak: "balikhane_kapatildi"
              - itibar: { lonca: 3, siginak: 3 }
            kronik: { tr: "Balıkhanenin ortasında gerçek seviyeni açıp tek yumruk atmadan bir karaborsayı kapattın.", en: "You opened your true level in the middle of the fish hall and closed down a black market without throwing a punch." }
            sonraki: "balikhane_kapandi"
          - id: "defter"
            etiket: { tr: "Ölülerin adlarını yazsın; aileler bilsin", en: "Make her log the names. Let families know" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2, insanlik: 1 }
              - bilgi: "balikhane_kristal_kaynagi"
              - bayrak: "balikhane_kayit_defteri"
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Balıkhaneyi kapatmadın ama sattığı her kristalin karşısına bir ölünün adını yazdırdın.", en: "You didn't shut the fish hall down, but you made it write a dead person's name under every crystal it sold." }
            sonraki: "balikhane_defter"
          - id: "devral"
            etiket: { tr: "Burası artık benim; kantar bana çalışır", en: "This place is mine now. The scale works for me" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -5, duzen: -2 }
              - oz_kristali: 5
              - bilgi: "balikhane_kristal_kaynagi"
              - bayrak: "balikhane_ele_gecirildi"
              - bayrak: "balikhane_pay"
              - itibar: { siginak: -5, yukselenler: 3 }
              - dikkat: 2
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Ölülerin kristalini satan balıkhaneyi kapatacağına el koyup kendine aldın.", en: "Instead of shutting down the fish hall that sold the dead, you took it for yourself." }
            sonraki: "balikhane_devral"
          - id: "lonca"
            etiket: { tr: "Lonca'ya haber ver; düzeni onlar koysun", en: "Tip off the Guild. Let them run it right" }
            goster: { itibar_min: { lonca: 10 } }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
              - bilgi: "balikhane_kristal_kaynagi"
              - bayrak: "balikhane_ihbar_lonca"
              - bayrak: "balikhane_ihbar"
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Ölülerin kristal pazarını Demir Lonca'ya teslim ettin; Lonca orayı kapatmak yerine vergiye bağladı.", en: "You handed the dead men's crystal market to the Iron Guild, and the Guild didn't close it. It taxed it." }
            sonraki: "balikhane_ihbar_sahne"
          - id: "konsey"
            etiket: { tr: "Konsey'e haber ver; hastane bilsin", en: "Tip off the Council. Let the hospital know" }
            goster: { itibar_min: { siginak: 10 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - bilgi: "balikhane_kristal_kaynagi"
              - bayrak: "balikhane_ihbar_siginak"
              - bayrak: "balikhane_ihbar"
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Ölülerin kristal pazarını Sığınak Konseyi'ne ihbar edip kapatılıp kapatılmamasını oylamaya bıraktın.", en: "You reported the dead men's crystal market to the Haven Council and left its closing to a vote." }
            sonraki: "balikhane_ihbar_sahne"

      - id: "balikhane_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kiralık avcılardan birinin topuzu kaburgalarına iniyor, öbürü seni kantarın kefesine çarpıyor. Kendine geldiğinde rıhtımın kenarındasın, ağzın tuzlu su dolu; yakandan tutup suya atmışlar.", en: "One hired hunter's mace finds your ribs. The other slams you into the scale pan. You come to at the edge of the pier with a mouthful of salt water. They tossed you in by the collar." }
          - { tr: "Yukarıdan, balıkhanenin kapısından kantarcının şarkı gibi, alaycı sesi geliyor: \"Bir kişi gitti, bir kişi! Başka teklif?\"", en: "From up top, at the fish hall door, you can hear the Weighmaster's voice, sing-song and mocking: \"Going once, going twice, gone! Do I hear another bid?\"" }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Sudan çık ve yeniden içeri gir", en: "Climb out and go back in" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - savas: { dusmanlar: ["balikhane_kiralik_avci@dunya"], ortam: ["dar_gecit"], kazan: "balikhane_kapandi", kaybet: "balikhane_terk", kac: "balikhane_terk" }
            kronik: { tr: "Seni balıkhaneden suya attılar; sen sırılsıklam geri döndün.", en: "They threw you off the fish hall pier, and you came back in still dripping." }
          - id: "birak"
            etiket: { tr: "Bugünlük bırak; yaralarını sar", en: "Let it go for today. Patch yourself up" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -1 }
              - can: 15
            kronik: { tr: "Balıkhanenin kiralık avcıları seni suya attı ve sen o gün geri dönmedin.", en: "The fish hall's hired muscle threw you in the harbor, and you didn't go back that day." }
            sonraki: "balikhane_terk"

      - id: "balikhane_terk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sen rıhtımdan yukarı tırmanırken içeride mezat yeniden başlıyor. Kantar iniyor, kalkıyor; bir dalgıç arka kapıdan bir kova daha taşıyor.", en: "As you climb up off the pier, the auction starts up again inside. The scale goes down, comes up. A diver carries another bucket in through the back door." }
          - { tr: "Kapıdaki gözcü çocuklardan biri seni görüyor ama ıslık çalmıyor. Islık gelen için çalınır, giden için değil.", en: "One of the kid lookouts at the door sees you and doesn't whistle. You whistle for somebody coming in. Not for somebody leaving." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - ahlak: { merhamet: -1 }
            kronik: { tr: "Balıkhanenin kantarını o gün durduramadın.", en: "That day you couldn't stop the fish hall scale." }
            sonraki: "@akis"

      - id: "balikhane_kapandi"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kiralık avcılar mermer tezgâhların arasında yatıyor, birinin topuzu kantarın kefesine saplanmış. Olan bitene kavga demek zor.", en: "The hired hunters are lying between the marble counters, one of their maces sunk into the scale pan. It wasn't anything you'd call a fight." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Kiralık avcılar mermer tezgâhların arasında inliyor, senin de soluğun kesilmiş. Kantarın kefesi kanla, tuzlu suyla ıslanmış.", en: "The hired hunters are groaning between the marble counters, and you're breathing hard too. The scale pan is wet with blood and salt water." }
            kosul: { degisken_max: { _savas_ezme: 0 }, degisken_min: { _savas_kazanildi: 1 } }
          - metin: { tr: "Kimse kıpırdamıyor. Kantarcı kefedeki kristalleri tek tek bir beze sarıp bohçayı sana uzatıyor, teslim olur gibi.", en: "Nobody moves. The Weighmaster wraps the crystals in the pan one by one in a cloth and holds the bundle out to you, like a surrender." }
            kosul: { degisken_max: { _savas_kazanildi: 0 } }
          - { tr: "Balıkhane boşalıyor. Dalgıçlar ellerinde boş kovalarla kapıda dikiliyor; birinin yüzünde öfke, ötekilerinde yalnızca yorgunluk okunuyor. Bir kadın kolunu çekiştiriyor: \"Oğlumun ateşi var. Bundan sonra iksiri nereden bulacağım?\"", en: "The fish hall empties out. The divers stand at the door with empty buckets, one of them angry, the rest just tired. A woman tugs at your sleeve. \"My boy's got a fever. Where am I supposed to get potions now?\"" }
          - metin: { tr: "{yer:kordon} taştığından beri balıkhane, şehirde ilaç bulunabilen son yerlerden biriydi.", en: "Since the gate break, the fish hall had been one of the last places in the city you could find medicine at all." }
            kosul: { bayrak: "kordon_dustu" }
        secenekler:
          - id: "hastane"
            etiket: { tr: "Stokları Konsey'in hastanesine taşı", en: "Haul the stock over to the Council hospital" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { siginak: 6 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "balikhane_kapatildi"
              - bayrak: "balikhane_stok_hastanede"
              - xp_seviye: 40
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Balıkhanenin iksirlerini, ateşli çocuklar ilacı orada bulsun diye Konsey'in hastanesine taşıdın.", en: "You hauled the fish hall's potions to the Council hospital so the feverish kids could find their medicine there." }
            sonraki: "@akis"
          - id: "dalgic"
            etiket: { tr: "Stokları sat; parayı dalgıçlara dağıt", en: "Sell the stock. Split the money among the divers" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { siginak: 1 }
              - bayrak: "balikhane_kapatildi"
              - bayrak: "balikhane_dalgiclara"
              - xp_seviye: 40
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Balıkhaneyi kapattın ama ölüleri sudan çıkaranları da aç bırakmadın.", en: "You shut down the fish hall and didn't let the people who pulled the dead out of the water go hungry for it." }
            sonraki: "@akis"
          - id: "el_koy"
            etiket: { tr: "Stoklara el koy; ganimet kazananındır", en: "Seize the stock. Spoils go to the winner" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -3 }
              - oz_kristali: 4
              - oz_kristali: 4
              - esya: { buyuk_iyilesme_iksiri: 2 }
              - itibar: { siginak: -4, lonca: 2 }
              - bayrak: "balikhane_kapatildi"
              - xp_seviye: 40
              - tohum: { olay: "balikhane_hesap", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Balıkhanenin kantarında bıraktığın hesap kapanmadı.", en: "That business at the fish market scale isn't finished." } }
            kronik: { tr: "Ölülerin pazarını kapatıp raflarını kendi çantana boşalttın.", en: "You closed the market of the dead and emptied its shelves into your own pack." }
            sonraki: "@akis"

      - id: "balikhane_defter"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Ad mı?\" Kantarcı kahkahayı basıyor. \"Ölüler adını söylemez, avcı. Dalgıçlarım cüzdan toplamıyor.\"", en: "\"Names?\" The Weighmaster barks a laugh. \"Dead men don't give their names, hunter. My divers don't collect wallets.\"" }
          - { tr: "Tezgâhtan bir kristal alıp avucuna koyuyorsun. İçindeki ince çizgi büyüyüp harflere dönüşüyor, sen de o harfleri yüksek sesle okuyorsun: on dokuz yaşında bir kurye, {yer:eski_sehir|den}, iki kız kardeşin büyüğü.", en: "You pick a crystal up off the counter and hold it in your palm. The fine line inside grows and turns into letters, and you read them out loud: a nineteen-year-old courier from {yer:eski_sehir}, the older of two sisters." }
          - { tr: "Balıkhanede çıt çıkmıyor. Kantarcı ağzını açıp kapatıyor; sonra tezgâhın altından eski bir mezat defteri çıkarıp kaleminin ucunu dilinde ıslatıyor.", en: "Nobody in the fish hall moves. The Weighmaster opens her mouth, closes it. Then she pulls an old auction ledger out from under the counter and licks the tip of her pencil." }
        bildirimler:
          - tur: "analiz"
            nadirlik: "epik"
            baslik: { tr: "[Öz izi okundu]", en: "[Essence imprint read]" }
            satirlar:
              - { tr: "Kristal sahibinin kaydı geri çağrıldı. Bu işlem standart kullanıcılara kapalıdır.", en: "Crystal owner's record recalled. This operation is unavailable to standard users." }
        secenekler:
          - id: "oku"
            etiket: { tr: "Bütün tezgâhı oku; bir gece sürse de", en: "Read the whole counter, even if it takes all night" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - gun: 1
              - itibar: { siginak: 4 }
              - xp_seviye: 35
            kronik: { tr: "Sabaha kadar balıkhanede ölülerin kristallerinden adlarını okudun; kantarcı hepsini deftere geçirdi.", en: "You spent one night in the fish hall reading the names out of the dead men's crystals, and every one went into a ledger." }
            sonraki: "@akis"
          - id: "ogret"
            etiket: { tr: "Ona nasıl bakacağını göster; gerisini o yapsın", en: "Show her how to look. Let her do the rest" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - xp_seviye: 25
            kronik: { tr: "Ölülerin adlarını okumayı bir karaborsacıya öğrettin; gerisini onun eline bıraktın.", en: "You taught a black marketeer to read the names of the dead and left the rest in her hands." }
            sonraki: "@akis"

      - id: "balikhane_devral"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kantarcı bir süre seni süzüyor, sonra mezatta malı alıcısına bırakır gibi başını eğiyor. \"Kantar senin,\" diyor. \"Ben yalnızca sesiyim.\"", en: "The Weighmaster looks at you for a long moment, then dips her head, like she's knocking down a lot to the winning bid. \"Scale's yours,\" she says. \"I'm just the voice.\"" }
          - metin: { tr: "Lonca'nın tahsildarı mührünü cebine koyup kapıya yürüyor. Onda bir artık başka birinin cebine girecek; bunu {npc:kaya_demir|e} kimin anlatacağını merak ediyorsun.", en: "The Guild collector pockets his stamp and walks out. The tenth goes to somebody else now, and you wonder who's going to explain that to {npc:kaya_demir}." }
            kosul: { bayrak: "cekirdek_lonca" }
          - { tr: "Arka kapıdan giren bir dalgıç kovasını kefeye boşaltıp yeni patronuna bakar gibi sana bakıyor. {npc:yanki|in} keyfi yerinde: ilk kez bir şeye sahipsin. nasıl bir his?", en: "A diver comes in the back and dumps his bucket in the pan, and he looks at you the way you look at a new boss. {npc:yanki} sounds pleased: first time you've owned anything. how's it feel?" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İlk kovanın kristallerini say", en: "Count the first bucket" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - oz_kristali: 5
              - iliski: { kaya_demir: { guven: -3 } }
              - xp_seviye: 30
            kronik: { tr: "Ölülerin kristallerini satan balıkhanenin sahibi oldun; ilk kovayı kendi elinle saydın.", en: "You became the owner of the fish hall that sold crystals off the dead, and you counted the first bucket yourself." }
            sonraki: "@akis"

      - id: "balikhane_ihbar_sahne"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Ertesi sabah Lonca'nın turuncu kol bantlıları balıkhanenin kapısını tutmuş. Kantar da kantarcı da yerinde; değişen tek şey, kantarın yanındaki tahsildarla önündeki defter.", en: "The next morning the Guild's orange armbands are holding the fish hall door. The scale's still there. So's the Weighmaster. The only thing that's changed is the collector next to the scale and the ledger in front of him." }
            kosul: { bayrak: "balikhane_ihbar_lonca" }
          - metin: { tr: "Ertesi sabah Konsey'den elinde bir kâğıtla üç kişi geliyor. Balıkhane mühürleniyor, ama kantarcı dalgıçlarını da alıp arka kapıdan çoktan sıvışmış. Kâğıtta bir hafta sonraya konmuş bir oylamanın tarihi yazılı.", en: "The next morning three people from the Council show up with a sheet of paper. The fish hall gets sealed, but the Weighmaster's already gone out the back, and the divers with her. The paper has the date for a vote scheduled a week out." }
            kosul: { bayrak: "balikhane_ihbar_siginak" }
          - { tr: "Haber verdiğin için sana teşekkür ediyorlar. Ölülerin adını soran yok.", en: "They thank you for the tip. Nobody asks the names of the dead." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Başını salla ve yoluna devam et", en: "Nod and move on" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 25
            kronik: { tr: "Ölülerin pazarını bir fraksiyona bırakıp sonrasını onlara havale ettin.", en: "You passed the dead men's crystal market to a faction and left the rest to them." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ balıkhanenin hesabı (tohum)
  - id: "balikhane_hesap"
    konum: ["kiyikent_liman"]
    perde: [2]
    agirlik: 1
    etiketler: ["karaborsa", "ahlak", "liman"]
    gerilim: 3
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Kantarın öbür kefesi", en: "The other side of the scale" }
    sahne: "hesap_1"
    sahneler:
      - id: "hesap_1"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kantarcı, şehrin neresinde olursan ol seni buluyor; bu kez yanında beş kiralık avcı var. Hiçbiri buralı değil: dağ yolundan kapı avlamaya inmiş yabancılar. Ortadaki seni tepeden tırnağa süzüp gülüyor. \"Bu mu? Bize bunun için mi kristal ödüyorsun?\"", en: "The Weighmaster finds you wherever you are in the city, and this time she's brought five hired hunters. None of them are local. Out-of-towners who came down the mountain highway to hunt Gates. The one in the middle looks you up and down and laughs. \"This? You're paying us crystals for this?\"" }
            kosul: { bayrak: "balikhane_kapatildi" }
          - metin: { tr: "Balıkhaneye uğradığında orayı neredeyse tanıyamıyorsun. Kapının yanına bir pano asılmış: yüzlerce ad, her birinin yanında bir tarih, bir kristal ağırlığı. Önüne çiçek bırakan bir kadın var.", en: "When you stop by the fish hall scale, you almost don't recognize it. Someone's hung a board next to the door, hundreds of names on it, a date and a crystal weight beside each one. There's a woman laying flowers in front of it." }
            kosul: { bayrak: "balikhane_kayit_defteri", bayrak_yok: "balikhane_kapatildi" }
          - metin: { tr: "Payın her hafta geliyor: bir kese, bazen iki. Bu hafta keseyi getiren bir dalgıç değil, karalar giymiş yaşlı bir kadın. Elinde keseden çıkardığı tek bir kristal duruyor.", en: "Your cut shows up every week, a pouch, sometimes two. This week it isn't a diver bringing it. It's an old woman dressed in black, and she's holding one crystal she took out of the pouch." }
            kosul: { bayrak: "balikhane_pay" }
          - metin: { tr: "\"Bu benim oğlum,\" diyor kadın. Kristalin içindeki çizgiyi sen de görüyorsun: harfler, bir ad, bir doğum günü. \"Pazarda gördüm. Kantarcı, sahibine sor, dedi.\"", en: "\"This is my son,\" the woman says. You can see the line inside the crystal too: letters, a name, a birthday. \"I saw it at the market. The Weighmaster said ask the owner.\"" }
            kosul: { bayrak: "balikhane_pay" }
          - metin: { tr: "Yolun balıkhanenin önünden geçiyor. Lonca'nın tahsildarı hâlâ kantarın başında ama kristal fiyatları ikiye katlanmış: katkı, vergi, bir de \"güvenlik bedeli\". Kapıda, iksire parası yetmediği için geri dönen bir baba görüyorsun.", en: "You walk past the fish hall. The Guild collector's still at the scale, but crystal prices have doubled: contribution, tax, plus a \"security fee.\" There's a father at the door turning around because he can't afford a potion." }
            kosul: { bayrak: "balikhane_ihbar_lonca" }
          - metin: { tr: "Balıkhanenin kapısındaki Konsey mührü yırtılmış. İçeride mezat yeniden başlamış, bu kez daha sessiz: gözcüler daha genç, fiyatlar daha yüksek. Oylama hâlâ yapılmamış.", en: "The Council seal on the fish hall door has been torn off. The auction's started up again inside, quieter this time. The lookouts are younger and the prices are higher. The vote still hasn't happened." }
            kosul: { bayrak: "balikhane_ihbar_siginak" }
        sezgiler:
          - kosul: { stat: { per: 35 }, bayrak: "balikhane_kapatildi" }
            metin: { tr: "Kiralık avcıların en güçlüsü Seviye 29; kendine güveni seviyesinden de büyük. İkisi de seninkinin yanında cüce kalıyor.", en: "The strongest hired gun is Level 29. His confidence is bigger than his level, and both of them look small next to yours." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "h̷esap er geç gelir. sistem öyle kurulmuş. ben de öyle kuruldum.", en: "t̷he bill always comes due. that's how the system's built. that's how i'm built too." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Beşine birden \"gelin\" de", en: "Tell all five to come at once" }
            goster: { bayrak: "balikhane_kapatildi" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["balikhane_kiralik_avci@dunya+15", "balikhane_kiralik_avci@dunya+15", "balikhane_kiralik_avci@dunya", "balikhane_kiralik_avci@dunya", "balikhane_kiralik_avci@dunya"], ortam: ["dar_gecit"], kazan: "hesap_zafer", kaybet: "hesap_yenilgi", kac: "hesap_yenilgi" }
            kronik: { tr: "Kantarcının kiraladığı yabancı avcılar seni hafife aldı; sen de beşini birden üstüne çağırdın.", en: "The out-of-town hunters the Weighmaster hired sized you up and laughed, so you told all five to come at once." }
          - id: "konus"
            etiket: { tr: "Kantarcıyla konuş; kayıtlı bir pazar teklif et", en: "Talk to her. Offer a legal market with a ledger" }
            goster: { bayrak: "balikhane_kapatildi" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bayrak: "balikhane_kayit_defteri"
              - bayrak_kaldir: "balikhane_kapatildi"
              - xp_seviye: 30
            kronik: { tr: "Kapattığın balıkhaneyi kantarcıya, ölülerin adlarını tutmak şartıyla geri verdin.", en: "You gave the fish hall you'd shut down back to the Weighmaster, on the condition that she kept the names of the dead." }
            sonraki: "hesap_defter"
          - id: "pano"
            etiket: { tr: "Panodaki adları oku", en: "Read the names on the board" }
            goster: { bayrak: "balikhane_kayit_defteri", bayrak_yok: "balikhane_kapatildi" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - xp_seviye: 30
            kronik: { tr: "Balıkhanenin kapısındaki ölüler panosunun önünde durup adları tek tek okudun.", en: "You stood at the board of the dead by the fish hall door and read the names one by one." }
            sonraki: "hesap_defter"
          - id: "ver"
            etiket: { tr: "Kristali ona bedavaya ver", en: "Give her the crystal. No charge" }
            goster: { bayrak: "balikhane_pay" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 25
            kronik: { tr: "Ölülerden aldığın paydan bir kristali, içinde oğlunu tanıyan anneye geri verdin.", en: "Out of the cut you made off the dead, you gave one crystal back to a mother who recognized her son in it." }
            sonraki: "hesap_anne"
          - id: "sat"
            etiket: { tr: "Kristali ona maliyetine sat", en: "Sell it to her at cost" }
            goster: { bayrak: "balikhane_pay" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2, insanlik: -2 }
              - oz_kristali: 1
            kronik: { tr: "Bir anneye oğlunun kristalini maliyetine sattın ve iyilik ettiğini sandın.", en: "You sold a mother her son's crystal at cost, and you thought you were doing her a favor." }
            sonraki: "hesap_anne"
          - id: "kapat_simdi"
            etiket: { tr: "Bu iş burada biter; balıkhaneyi kapat", en: "This ends here. Close the fish hall" }
            goster: { bayrak: "balikhane_pay" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - bayrak_kaldir: "balikhane_pay"
              - bayrak: "balikhane_kapatildi"
              - itibar: { siginak: 4 }
              - xp_seviye: 30
            kronik: { tr: "Ölülerden pay aldığın balıkhaneyi bir anneyle göz göze geldiğin gün kapattın.", en: "You shut down the fish hall you'd been taking a cut from on the day you looked a mother in the eye." }
            sonraki: "hesap_anne_kapat"
          - id: "fiyat"
            etiket: { tr: "Tahsildara git; fiyatı düşürt", en: "Go see the collector. Get the price down" }
            goster: { bayrak: "balikhane_ihbar_lonca" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { lonca: -2, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: -2 } }
              - xp_seviye: 20
            kronik: { tr: "Lonca'nın ölüler pazarına koyduğu vergiyi bizzat pazarlık edip indirttin.", en: "You personally talked the Guild down on the tax it had put on the market of the dead." }
            sonraki: "hesap_son"
          - id: "oylama"
            etiket: { tr: "Konsey'e git; oylamayı bugün yaptır", en: "Go to the Council. Get the vote held today" }
            goster: { bayrak: "balikhane_ihbar_siginak" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
              - xp_seviye: 20
            kronik: { tr: "Konsey'in bir haftadır ertelediği oylamayı tek bir sabahta yaptırdın.", en: "You got the Council to hold the vote it had been putting off for a week in a single morning." }
            sonraki: "hesap_son"
          - id: "bosver"
            etiket: { tr: "Omzunu silk; bu artık senin işin değil", en: "Shrug. Not your business anymore" }
            goster: { bayrak: "balikhane_ihbar" }
            etkiler:
              - ahlak: { merhamet: -2 }
            kronik: { tr: "Ölülerin pazarını başkasına devretmiştin; ne hâle geldiğini görünce omuz silkip geçtin.", en: "You'd handed the market of the dead off to someone else, and when you saw what had become of it, you shrugged." }
            sonraki: "@akis"

      - id: "hesap_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Beşi de yerde. Sana \"bu mu\" diyen ortadaki hâlâ ne olduğunu anlamaya çalışıyor; gözleri seninle analiz penceresi arasında gidip geliyor. Penceren ona bir sayı değil, bir soru işareti gösteriyor.", en: "All five are down. The one in the middle, the one who said \"this?\", is still trying to work out what happened, eyes flicking between you and his analysis window. Your window doesn't show him a number. It shows him a question mark." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Beşi de yerde, ama ucuz kurtulmadın. Sana \"bu mu\" diyen ortadaki yerden sana bakıyor; bu kez gülmüyor.", en: "All five are down, but it didn't come cheap. The one in the middle, the one who said \"this?\", looks up at you from the ground. He isn't laughing now." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Kantarcı bir duvarın dibine çökmüş. \"Dalgıçlarım aç,\" diyor. \"Balıkhaneyi kapattın, ölüler hâlâ suda. Ne değişti?\"", en: "The Weighmaster has slid down a wall. \"My divers are starving,\" she says. \"You closed the hall and the dead are still in the water. What changed?\"" }
        secenekler:
          - id: "is"
            etiket: { tr: "Dalgıçlara iş ver: ölüleri gömmek için çıkarsınlar", en: "Give the divers work: haul the dead out for burial" }
            gerekli: { oz_kristali_min: 2 }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - oz_kristali: -2
              - itibar: { siginak: 4 }
              - bayrak: "balikhane_dalgic_mezar"
              - xp_seviye: 45
            kronik: { tr: "Ölüleri satmak için sudan çıkaran dalgıçlara, bu kez gömülsünler diye çıkarmaları için para verdin.", en: "You paid the divers who'd pulled the dead out of the water to sell them, to pull them out to be buried." }
            sonraki: "@akis"
          - id: "kov"
            etiket: { tr: "Kantarcıyı şehirden kov", en: "Run the Weighmaster out of the city" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - itibar: { lonca: 2 }
              - xp_seviye: 45
            kronik: { tr: "Kantarcıyı ve kiraladığı yabancıları dağ yoluna kadar sürdün.", en: "You drove the Weighmaster and her hired out-of-towners all the way to the mountain highway." }
            sonraki: "@akis"

      - id: "hesap_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Beş kişi beş ayrı yönden üstüne geliyor ve bir anlığına, yalnızca bir anlığına sayılar seni aşıyor. Yere yıkılıyorsun; tuzlu asfalt yanağını yarıyor.", en: "Five people come from five directions, and for a moment, just one, the numbers get past you. You go down. The salty asphalt opens up your cheek." }
          - { tr: "Kantarcı tepende dikiliyor. \"Bir şey öğrendin mi?\" diyor. \"Herkesin bir fiyatı vardır. Seninki beş kiralık avcıymış.\" Balıkhaneyi geri alıyor; sen yerden doğrulduğunda çoktan gitmiş oluyorlar.", en: "The Weighmaster stands over you. \"Learn something?\" she says. \"Everybody's got a price. Turns out yours was five hired guns.\" She takes the hall back. By the time you get up, they're long gone." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve yüzündeki kanı sil", en: "Get up. Wipe the blood off your face" }
            etkiler:
              - ahlak: { duzen: -2 }
              - bayrak_kaldir: "balikhane_kapatildi"
            kronik: { tr: "Kapattığın balıkhaneyi bir gece beş kiralık avcıya geri kaptırdın.", en: "One night you lost the fish hall you'd shut down to five hired guns." }
            sonraki: "@akis"

      - id: "hesap_defter"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Panoda ad ada eklenmiş. Kiminin yanına çiçek bırakılmış, kimine fotoğraf, birine de bir çocuk resmi bantlanmış. Kantarcı onlara hiç bakmıyor ama kirlenmesin diye her sabah panonun tozunu alıyor.", en: "The board is names on top of names. Flowers next to some, a photo taped to others, a kid's drawing on one. The Weighmaster never looks at them. But every morning she dusts the board off, so it won't get grimy." }
          - { tr: "Çiçek bırakan kadın sana dönüyor. \"Oğlumun kristali buradaymış,\" diyor. \"Biri adını okumuş. Bilmeseydim hâlâ kapı gözlüyor olurdum.\"", en: "The woman with the flowers turns to you. \"My son's crystal was here,\" she says. \"Somebody read his name. If I didn't know, I'd still be watching the door.\"" }
          - metin: { tr: "Pano, iskelenin öbür ucundaki Kayıplar Duvarı'na bakıyor; iki kalabalığın arasına artık bir köprü kurulmuş.", en: "The board looks out across the terminal at the Wall of the Missing, and now there's a bridge between the two crowds." }
            kosul: { bilgi: "duvar_kayit_satiri" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kadının yanında bir süre dur", en: "Stand with her a while" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "liman_kayiplar_duvari", gecikme: { min: 1, max: 3 }, kosul: { bayrak_yok: ["kayip_koca_yasiyor", "kayip_umut_verildi", "kayip_balikhaneye"] }, hatirlatma: { tr: "Kantarın öbür kefesinde kalan kadın hâlâ aklında.", en: "You keep thinking about the woman left on the other side of that scale." } }
            kronik: { tr: "Bir karaborsanın kapısında, ölüler panosunun önünde, oğlunun haberini yeni almış bir annenin yanı başında durdun.", en: "At the door of a black market, next to a board of the dead, you stood with a mother who'd just found out about her son." }
            sonraki: "@akis"

      - id: "hesap_anne"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kadın kristali iki avucunun arasına almış. \"Bak,\" diyor, \"bu o. Doğduğunda da böyle avucuma sığmıştı.\" Gözleri seninle kristal arasında gidip geliyor.", en: "The woman holds the crystal in both hands. \"Look,\" she says, \"this is him. He fit in my palm like this when he was born, too.\" Her eyes go back and forth between you and the crystal." }
          - { tr: "Arkasını dönüp gitmeden sana teşekkür ediyor. Ne yapmış olursan ol teşekkür ediyor ve bu teşekkür içinde bir yere oturuyor.", en: "Before she turns to go, she thanks you. It doesn't matter which choice you made, she thanks you anyway, and that settles in somewhere inside you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onun gidişini izle", en: "Watch her go" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Ölülerin pazarından pay alırken bir annenin teşekkürünü de kabul ettin.", en: "While you were taking your cut from the market of the dead, you took a mother's thank-you too." }
            sonraki: "@akis"

      - id: "hesap_anne_kapat"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kadın kristali iki avucunda tutmuş, balıkhanenin kapısına zincir vuruşunu izliyor. Kantarcı itiraz etmiyor; bu sabahı çoktandır bekliyormuş gibi bakıyor.", en: "The woman holds the crystal in both hands and watches you chain the fish hall door. The Weighmaster doesn't argue. She looks like she's been waiting years for this morning." }
          - { tr: "Kilidin şakırtısı rıhtımın ucuna kadar gidiyor. {npc:yanki} bir kez olsun sesini çıkarmıyor.", en: "The sound of the lock carries all the way to the end of the pier. For once, {npc:yanki} doesn't say a thing." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Anahtarı denize at", en: "Throw the key in the sound" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Balıkhanenin anahtarını körfeze attın.", en: "You threw the key to the fish hall into the sound." }
            sonraki: "@akis"

      - id: "hesap_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kantarın önündeki sıra kısalıyor ama büsbütün bitmiyor. Ölüler hâlâ suda; birileri onları çıkarmaya, birileri tartmaya devam ediyor.", en: "The line in front of the scale gets shorter, but it never quite goes away. The dead are still in the water. Somebody's still pulling them out, and somebody's still weighing them." }
          - { tr: "Kapıdan iksir alamadan dönen baba bu kez elinde küçük, kırmızı bir şişeyle çıkıyor. Sana değil, şişeye bakıyor.", en: "The father who turned away at the door walks out this time with a little red bottle in his hand. He doesn't look at you. He looks at the bottle." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - ahlak: { merhamet: 1 }
            kronik: { tr: "Ölülerin pazarını kapatamadın ama bir babanın iksirini ucuzlattın.", en: "You couldn't close the market of the dead, but you made one father's potion cheaper." }
            sonraki: "@akis"

  # ================================================================== YAN YATMIŞ VAPUR
  - id: "liman_yan_yatmis_vapur"
    konum: ["kiyikent_liman"]
    perde: [2]
    bolge: ["kiyikent_liman"]
    gun: { min: 33, max: 110 }
    kosul: { bayrak_yok: "vapur_dogrultuldu" }
    agirlik: 5
    etiketler: ["vapur", "hakimiyet", "liman"]
    gerilim: 2
    kart: { tr: "Akşam vapuru", en: "The evening ferry" }
    sahne: "vapur_1"
    sahneler:
      - id: "vapur_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşam vapuru iskelenin dibinde sancağına yatmış; yarısı suyun altında, bacası bir devin parmağı gibi körfezi gösteriyor. Martılar gövdesine sıra sıra dizilmiş, bir şey bekliyorlar sanki.", en: "The evening ferry lies on its starboard side at the foot of the terminal, half underwater, its stack pointing out across the sound like a giant's finger. The gulls are lined up along its hull in neat rows, like they're waiting for something." }
          - { tr: "Yirmi kadar gönüllü halatları babalara ve çürümüş bir vinç kamyonuna bağlamış, tempo tutarak asılıyor ama vapur kılını kıpırdatmıyor. Karşı yakadaki adalarda sahipsiz kalmış meyve bahçeleri, tarlalar, tavuklar var; şehrin yarısı ise aç.", en: "About twenty volunteers have tied ropes to the bollards and a rusted-out crane truck, and they're hauling in rhythm. The ferry doesn't budge. Out on the islands across the sound there are orchards and fields and chickens nobody owns anymore, and half the city is hungry." }
          - metin: { tr: "Halatların başında tanıdık bir yüz var: ayakkabı mağazasından çıkardığın yaşlı kaptan, ayağında hâlâ o parlak spor ayakkabılar. Seni görünce kollarını açıyor. \"Temiz yanaşmanın ustası! Gel bakalım; bu sefer yanaşacak değil, kaldıracak bir şey var.\"", en: "There's a familiar face at the head of the ropes: the old captain you pulled out of the shoe store, still in those shiny sneakers. He throws his arms wide when he sees you. \"Master of the clean docking! Get over here. Nothing to dock this time. Something to lift.\"" }
            kosul: { bayrak: "mahsur_kaptan_tanindi", bayrak_yok: "mahsur_kaptan_kaldi" }
          - metin: { tr: "Halatların başında genç bir tayfa, kaptanın düğümlerini atıyor. \"Kaptanımız Öğretici'de kaldı,\" diyor. \"Bir ayakkabı mağazasındaymış, öyle diyorlar. Batan gemiden en son kaptan iner.\" Bunu söylerken gözü sende. O bir şey bilmiyor; sen biliyorsun.", en: "There's a young deckhand at the head of the ropes, tying the captain's knots. \"Our captain stayed behind in the tutorial,\" she says. \"In a shoe store, they say. Captain's always last off a sinking ship.\" She's looking at you when she says it. She doesn't know anything. You do." }
            kosul: { bayrak: "mahsur_kaptan_kaldi" }
          - metin: { tr: "Halatların başında yağlı tulumuyla vapurun eski çarkçıbaşı duruyor. \"Kaptanı Öğretici'de kaybettik,\" diyor. \"Bu vapuru ondan başkası yürütemezdi. Şimdi biz yürüteceğiz, öyle ya da böyle.\"", en: "At the head of the ropes is the ferry's old chief engineer in greasy coveralls. \"We lost the captain in the tutorial,\" he says. \"Nobody else could've run this boat. Now we're gonna run it anyway.\"" }
            kosul: { bayrak_yok: ["mahsur_kaptan_tanindi", "mahsur_kaptan_kaldi"] }
          - metin: { tr: "{npc:deniz_arman} yanı başında, korkuluğun tam o eski yerinde duruyor. \"Yarın da gecikirse yüzerek giderim,\" diyor. İkiniz de gülmüyorsunuz; derken gülmeye başlıyorsunuz, uzun uzun, aptal aptal, gözleriniz yaşarana kadar.", en: "{npc:deniz_arman} is next to you, at the exact same spot on the railing. \"If it's late again tomorrow, I'm swimming,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. Neither of you laughs. Then you both do, long and stupid, until your eyes water." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "Korkuluğun yanında, bir zamanlar simidini martılarla paylaşan birinin durduğu yerde şimdi yalnızca martılar var. Sana bakıyorlar: o gün susan martılar.", en: "By the railing, where someone used to stand tossing pretzel crumbs to the gulls, there's nothing now but gulls. They're watching you. The same gulls that went quiet that day." }
            kosul: { npc_olu: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Vapuru aşağı çeken yalnızca su değil. Alt güvertede, makine dairesinin karanlığında iki uzun gövde birbirine dolanmış yatıyor; vapuru dipte tutan onlar.", en: "It isn't just water weighing that ferry down. On the lower deck, in the dark of the engine room, two long bodies lie coiled around each other. They're what's holding it down." }
          - kosul: { stat: { str: 45 } }
            metin: { tr: "Gövdeyi gözünle tartıyorsun: sekiz yüz ton, belki biraz fazlası. Kaburgaların bunu dert bile etmiyor.", en: "You size up the hull: eight hundred tons, maybe a little more. Your ribs don't think twice about it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ vapurda bulmuştum seni, hatırlıyor musun? korkuluğun orada. her şey orada başladı.", en: "i̷ found you on that ferry, remember? by the railing. that's where all of this started." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hadi ama. Bu bizim vapurumuz.\"", en: "\"Come on. That's our ferry.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sekiz yüz ton. Senin kas yoğunluğunla, şey... aslında hiç hesaplamasam daha iyi.\"", en: "\"Eight hundred tons. With your muscle density, uh... actually, I'd rather not do the math.\"" }
        secenekler:
          - id: "omuz"
            tur: "gosteris"
            etiket: { tr: "Halatları bırak; vapuru omzunla doğrult", en: "Drop the ropes. Right the ferry with your shoulder" }
            gerekli: { stat: { str: 50 } }
            etkiler:
              - gorev: { vapuru_yuzdur: "basla" }
              - dikkat: 4
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "vapur_dogrultuldu"
              - unvan: "vapuru_dogrultan"
            kronik: { tr: "{yer:kiyikent|in} akşam vapurunu omzunla sudan kaldırdın; iskeledeki iki yüzü aşkın kişi bunu kendi gözüyle gördü.", en: "You lifted the {yer:kiyikent} evening ferry out of the water with your shoulder, and more than two hundred people on the terminal saw it with their own eyes." }
            sonraki: "vapur_ezme"
          - id: "halat"
            etiket: { tr: "Halata geç; herkesle birlikte çek", en: "Grab a rope. Pull with everybody else" }
            etkiler:
              - gorev: { vapuru_yuzdur: "basla" }
              - ahlak: { insanlik: 2, merhamet: 1 }
              - gun: 1
            sonraki: "vapur_birlikte"
          - id: "dal"
            etiket: { tr: "Gövdeye dal; onu aşağıda tutanı bul", en: "Dive into the hull. Find what's holding it down" }
            etkiler:
              - gorev: { vapuru_yuzdur: "basla" }
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["vapur_safra_yilani@dunya-15", "vapur_safra_yilani@dunya-15"], ortam: ["su", "karanlik"], kazan: "vapur_govde", kaybet: "vapur_govde_kayip", kac: "vapur_govde_kayip" }
          - id: "kaptan"
            etiket: { tr: "Genç tayfaya kaptanın son anını anlat", en: "Tell the deckhand about the captain's last moment" }
            goster: { bayrak: "mahsur_kaptan_kaldi" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { saygi: 2 } }
            sonraki: "vapur_tayfa"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Uzaktan izle ve yoluna devam et", en: "Watch from a distance. Keep moving" }
            etkiler:
              - gizle: 1
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "vapur_tayfa"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Anlatıyorsun: mankenleri, taburedeki yaşlı adamı, iskeleden ayrılan vapura el sallar gibi sana el sallayışını. Kendi payına düşeni de anlatıyorsun, neye karar verdiğini.", en: "You tell her: the dummies, the old man on the stool, the way he waved at you like a ferry pulling away from the dock. You tell her your part too. What you chose." }
          - { tr: "Tayfa bir süre halatın ucunu evirip çevirdikten sonra kaptanın düğümlerinden birini sıkı sıkı atıp halatı sana uzatıyor. \"O zaman bu da senin,\" diyor. \"Onun yerine sen çek.\"", en: "The deckhand fiddles with the end of her rope for a while. Then she ties one of the captain's knots, good and tight, and holds the rope out to you. \"Then this is yours too,\" she says. \"Pull for him.\"" }
        secenekler:
          - id: "cek"
            etiket: { tr: "Halatı al, onun yerine çek", en: "Take the rope. Pull for him" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - gun: 1
            sonraki: "vapur_birlikte"
          - id: "omuz"
            tur: "gosteris"
            etiket: { tr: "Halatı bırak; kaptan için vapuru sen kaldır", en: "Drop the rope. Lift the ferry yourself, for him" }
            gerekli: { stat: { str: 50 } }
            etkiler:
              - dikkat: 4
              - ahlak: { insanlik: 2 }
              - bayrak: "vapur_dogrultuldu"
              - unvan: "vapuru_dogrultan"
            sonraki: "vapur_ezme"

      - id: "vapur_birlikte"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bütün gün asılıyorsunuz. Halatın en başında sen varsın, yükün çoğunu da sen çekiyorsun; ama bunu bilen yok, çünkü herkes kendi avucunun yandığını hissediyor.", en: "You haul all day. You're at the very front of the rope and you're carrying most of the weight, but nobody knows it, because everybody can feel their own palms burning." }
          - { tr: "Akşamüstü vapur inleye inleye yarıya kadar doğruluyor; kalabalık bağırıyor, biri şapkasını havaya fırlatıyor. Derken gövde sarsılıyor, halatlar bir anda gevşiyor: alt güvertede bir şey uyanmış, vapuru yeniden dibe çekiyor.", en: "Late in the afternoon the ferry groans halfway upright. The crowd yells, somebody throws a hat in the air. Then the hull shudders and every rope goes slack at once. Something on the lower deck just woke up, and it's dragging the ferry back down." }
          - { tr: "Makine dairesinin lombozunda iki göz parlıyor, ardından iki göz daha.", en: "Two eyes glow behind the engine room porthole. Then two more." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Gövdeye dal, onları dışarı sürükle", en: "Dive into the hull and drag them out" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["vapur_safra_yilani@dunya-15", "vapur_safra_yilani@dunya-15"], ortam: ["su", "karanlik"], kazan: "vapur_govde", kaybet: "vapur_govde_kayip", kac: "vapur_govde_kayip" }
          - id: "tek"
            tur: "aciga_vur"
            etiket: { tr: "Halatı bırak; gerisini herkesin önünde sen yap", en: "Let go of the rope. Finish it yourself, in front of everyone" }
            goster: { stat: { str: 50 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - bayrak: "vapur_dogrultuldu"
              - unvan: "vapuru_dogrultan"
            sonraki: "vapur_ezme"

      - id: "vapur_ezme"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Göğsüne kadar suya girip omzunu küpeştenin altına yerleştiriyorsun. Çelik inliyor, perçinler tabanca gibi patlıyor; derken sekiz yüz ton, bir çocuğun doğrulttuğu kayık gibi ağır ağır doğruluyor.", en: "You wade in up to your chest and set your shoulder under the gunwale. The steel groans and rivets pop like gunshots. Then eight hundred tons comes upright slowly, like a rowboat a kid is tipping over." }
          - { tr: "Pencerelerden şelale gibi su boşalıyor. Halattaki gönüllüler sırtüstü düşüyor; kalkan da yok, bağıran da. Yalnızca martılar hep birden havalanıyor.", en: "Water pours out of every window in sheets. The volunteers on the ropes go down flat on their backs. Nobody gets up. Nobody yells. Only the gulls take off, all of them at once." }
          - { tr: "Makine dairesinden fırlayan iki uzun, kaygan gövde rıhtıma çarpıp topuğunun altında susuyor. Arkandaki sessizlik tam bir dakika sürüyor; sonra bütün iskele bir ağızdan haykırıyor.", en: "Two long, slick bodies come shooting out of the engine room, hit the pier and go quiet under your heel. The silence behind you lasts a full minute. Then the whole terminal yells at once." }
          - metin: { tr: "Kaptan hiç utanmadan ağlıyor; spor ayakkabılarıyla suya girmiş, at sağrısı sıvazlar gibi vapurun gövdesini okşuyor.", en: "The captain's crying, unashamed, wading into the water in those sneakers to pat the hull like a horse." }
            kosul: { bayrak: "mahsur_kaptan_tanindi", bayrak_yok: "mahsur_kaptan_kaldi" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "epik"
            baslik: { tr: "[Unvan kazanıldı: Vapuru Doğrultan]", en: "[Title earned: Ferry Lifter]" }
            satirlar:
              - { tr: "Sekiz yüz ton. Tek omuz. Tanık sayısı: 214.", en: "Eight hundred tons. One shoulder. Witnesses: 214." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷uydun mu onları? adını bağırıyorlar. ben seni ilk bulduğumda kimse adını bilmiyordu.", en: "h̷ear them? they're yelling your name. when i first found you, nobody knew it." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sudan çık", en: "Climb out of the water" }
            etkiler:
              - xp_seviye: 40
              - efsane: "tek_basina_suru"
            sonraki: "vapur_kimin"

      - id: "vapur_govde"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Makine dairesinin karanlığında kavga denecek bir şey yaşanmıyor. İki gövde birbirine dolanmış hâlde suyun yüzüne çıkıyor, bir daha da dalmıyor.", en: "Down in the black of the engine room, it isn't anything you'd call a fight. Two bodies float to the surface still tangled together, and they don't go back under." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Makine dairesinden iki kolun ısırık içinde çıkıyorsun; arkandan iki uzun gövde suyun yüzüne yükseliyor. Kalabalık seni kollarından tutup rıhtıma çekiyor.", en: "You come out of the engine room with bite marks up both arms, two long bodies rising to the surface behind you. The crowd hauls you up onto the pier." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Yük kalkınca vapur kendiliğinden kıpırdanıyor. Halatlar geriliyor, gönüllüler son bir kez asılıyor; akşam vapuru da uzun uzun gıcırdayarak yeniden suyun üstüne oturuyor.", en: "With the dead weight gone, the ferry starts to move on its own. The ropes go taut, the volunteers pull one last time, and with a long creak the evening ferry settles back on top of the water." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Rıhtıma çık", en: "Climb up onto the pier" }
            etkiler:
              - xp_seviye: 40
            sonraki: "vapur_kimin"

      - id: "vapur_govde_kayip"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kaygan bir gövde boğazına dolanıp seni makine dairesinin dibine sürüklüyor. Karanlıkta kaç saniye geçtiğini bilemiyorsun; sonra biri ayak bileğinden yakalayıp seni yukarı çekiyor.", en: "Something slick wraps around your throat and drags you down to the bottom of the engine room. You lose track of how many seconds pass in the dark. Then somebody grabs your ankle and hauls you up." }
          - { tr: "Gönüllüler seni rıhtıma yatırıyor. Vapur yine yan yatmış, içindekiler yine uykuya dalmış. \"Bugün olmadı,\" diyor biri, \"ama yarın da bir gün.\"", en: "The volunteers lay you out on the pier. The ferry's on its side again, and whatever's inside it has gone back to sleep. \"Not today,\" someone says. \"But there's tomorrow.\"" }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Bir daha dal", en: "Dive again" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["vapur_safra_yilani@dunya"], ortam: ["su", "karanlik"], kazan: "vapur_govde", kaybet: "vapur_birak", kac: "vapur_birak" }
          - id: "birak"
            etiket: { tr: "Bugünlük bırak", en: "Call it for today" }
            etkiler:
              - can: 10
              - gorev: { vapuru_yuzdur: "basarisiz" }
            sonraki: "vapur_birak"

      - id: "vapur_birak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İskeleden ayrılırken dönüp arkana bakıyorsun. Gönüllüler halatları yarın için sarıp topluyor. Martılar gövdenin üstüne yine sıra sıra dizilmiş.", en: "You look back as you leave the terminal. The volunteers are coiling the ropes for tomorrow. The gulls are lined up along the hull again." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "vapur_kimin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Vapur biraz yana yatık ama yüzüyor. Daha suyu boşalmadan rıhtıma üç grup geliyor, üçü de aynı şeyi söylüyor: bu vapur bizim.", en: "The ferry's listing a little, but it floats. Before it's even done draining, three groups walk up the pier, and all three say the same thing: that boat's ours." }
          - metin: { tr: "Lonca'nın bir çavuşu adalardaki kapılara avcı taşımak istiyor; \"Bir kapı taşarsa açlık dert olmaktan çıkar,\" diyor. Konsey'den gelen hemşire elindeki listeyi sallıyor: erzak, ilaç, çocuklar için süt. Kaptan ise vapurun burnuna yaslanmış, yalnızca bekliyor.", en: "A Guild sergeant wants to run hunters out to the Gates on the islands. \"If a Gate breaks, hunger won't be our problem,\" he says. The nurse from the Council waves her list: food, meds, milk for the kids. The captain just leans against the bow and waits." }
            kosul: { bayrak_yok: "cekirdek_oyuncu" }
          - metin: { tr: "Lonca'nın çavuşu da Konsey'in hemşiresi de kaptan da tartışmayı kesip sana bakıyor. Kasaba Çekirdeği senin; bu rıhtım da bu vapur da senin ağzından çıkacak sözü bekliyor.", en: "The Guild sergeant, the Council nurse and the captain all stop arguing and look at you. The Town Core is yours, and so this pier and this ferry are waiting on your word." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Çekirdek Lonca'nın elinde; çavuş bunu herkese hatırlatmadan edemiyor. \"Emir yukarıdan,\" diyor. \"Ama kaldıran sensin. Sana sormadan götürmeyiz.\"", en: "The Core belongs to the Guild, and the sergeant makes sure everybody remembers it. \"Orders come from the top,\" he says. \"But you're the one who lifted it. We won't take it without asking you.\"" }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Çekirdek Konsey'in elinde; hemşire bunu yüksek sesle söylemiyor ama listesinin tepesinde Konsey'in mührü duruyor.", en: "The Core belongs to the Council. The nurse doesn't say it out loud, but the Council's seal is right at the top of her list." }
            kosul: { bayrak: "cekirdek_siginak" }
        secenekler:
          - id: "lonca"
            etiket: { tr: "Lonca'ya ver; avcıları kapılara taşısın", en: "Give it to the Guild. Run hunters to the Gates" }
            etkiler:
              - itibar: { lonca: 6, siginak: -2 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
              - ahlak: { duzen: 3, merhamet: -1 }
              - bayrak: "vapur_lonca"
              - gorev: { vapuru_yuzdur: "tamam" }
              - xp_seviye: 30
              - tohum: { olay: "vapur_ilk_sefer", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Yan yatmış akşam vapuru için verdiğin karar sonunda suya iniyor.", en: "What you decided about that capsized evening ferry is finally hitting the water." } }
            kronik: { tr: "Kaldırdığın vapuru, ambarına un değil avcı dolacağını bile bile Demir Lonca'ya verdin.", en: "You gave the ferry you'd raised to the Iron Guild, knowing its hold would fill with hunters, not bread." }
            sonraki: "vapur_son"
          - id: "konsey"
            etiket: { tr: "Konsey'e ver; erzak seferi yapsın", en: "Give it to the Council. Run food" }
            etkiler:
              - itibar: { siginak: 6, lonca: -2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - ahlak: { merhamet: 3, duzen: 2 }
              - bayrak: "vapur_siginak"
              - gorev: { vapuru_yuzdur: "tamam" }
              - xp_seviye: 30
              - tohum: { olay: "vapur_ilk_sefer", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Yan yatmış akşam vapuru için verdiğin karar sonunda suya iniyor.", en: "What you decided about that capsized evening ferry is finally hitting the water." } }
            kronik: { tr: "Vapuru adalardan erzak taşısın diye Sığınak Konseyi'ne verdin.", en: "You gave the ferry to the Haven Council to haul food in from the islands." }
            sonraki: "vapur_son"
          - id: "halk"
            etiket: { tr: "Kaptana ver; kim binmek isterse binsin", en: "Give it to the captain. Anyone who wants to ride, rides" }
            etkiler:
              - itibar: { siginak: 1, lonca: -3 }
              - ahlak: { duzen: -3, insanlik: 3 }
              - bayrak: "vapur_halk"
              - gorev: { vapuru_yuzdur: "tamam" }
              - xp_seviye: 30
              - tohum: { olay: "vapur_ilk_sefer", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Yan yatmış akşam vapuru için verdiğin karar sonunda suya iniyor.", en: "What you decided about that capsized evening ferry is finally hitting the water." } }
            kronik: { tr: "Vapuru hiçbir fraksiyona vermedin; bileti olmayan da binsin diye kaptana bıraktın.", en: "You didn't give the ferry to any faction. You left it with the captain so people without a ticket could ride too." }
            sonraki: "vapur_son"
          - id: "benim"
            etiket: { tr: "Vapur benim; sefer tarifesini ben yazarım", en: "The ferry's mine. I write the schedule" }
            goster: { bayrak: "vapur_dogrultuldu" }
            etkiler:
              - itibar: { siginak: 2, lonca: 2, yukselenler: 2 }
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 2
              - bayrak: "vapur_oyuncu"
              - gorev: { vapuru_yuzdur: "tamam" }
              - xp_seviye: 30
              - tohum: { olay: "vapur_ilk_sefer", gecikme: { min: 5, max: 10 }, hatirlatma: { tr: "Yan yatmış akşam vapuru için verdiğin karar sonunda suya iniyor.", en: "What you decided about that capsized evening ferry is finally hitting the water." } }
            kronik: { tr: "Sudan çıkardığın vapuru kendine ayırdın; şehrin karşı yakaya ne zaman geçeceğine sen karar verdin.", en: "You kept the ferry you'd raised and decided for yourself when the city got to cross the sound." }
            sonraki: "vapur_son"

      - id: "vapur_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Çavuş vapurun pruvasına Lonca'nın turuncu bayrağını çekiyor. Kaptan ses etmiyor; yalnızca bayrağın düğümünü çözüp bu kez doğru düğümle yeniden bağlıyor.", en: "The sergeant runs the Guild's orange flag up on the bow. The captain doesn't say anything. He just unties the knot and reties it properly." }
            kosul: { bayrak: "vapur_lonca" }
          - metin: { tr: "Hemşire listesini kaptana uzatıyor; kaptan bakmadan katlayıp cebine atıyor. \"Süt,\" diyor, \"tamam. Önce süt.\"", en: "The nurse hands her list to the captain, who folds it into his pocket without looking. \"Milk,\" he says. \"Got it. Milk first.\"" }
            kosul: { bayrak: "vapur_siginak" }
          - metin: { tr: "Kaptan vapurun kapısına bir karton asıyor: \"Bilet yok. Herkes biner.\" Çavuş yere tükürüp uzaklaşıyor; hemşire gülümsüyor, sonra gülümsediği için kendine kızıyor.", en: "The captain hangs a piece of cardboard on the gangway: NO TICKETS. EVERYBODY RIDES. The sergeant spits and leaves. The nurse smiles, then gets mad at herself for smiling." }
            kosul: { bayrak: "vapur_halk" }
          - metin: { tr: "Kaptan vapurun kapısına bir karton asıp üstüne senin adını yazıyor. Altına da küçük harflerle: \"Tarife için ona sorun.\"", en: "The captain hangs a piece of cardboard on the gangway and writes your name on it. Underneath, in small letters: ASK THEM ABOUT THE SCHEDULE." }
            kosul: { bayrak: "vapur_oyuncu" }
          - { tr: "Akşam olunca vapurun düdüğü ötüyor; bu kez çalan rüzgâr değil, buhar. İskeledeki bütün başlar kalkıyor ve bu kez kimse yanılmıyor.", en: "When evening comes, the ferry horn sounds. Not the wind this time. Steam. Every head on the terminal comes up, and this time nobody's wrong." }
        secenekler:
          - id: "git"
            etiket: { tr: "Düdüğün sesiyle iskeleden ayrıl", en: "Leave the terminal to the sound of the horn" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ vapurun ilk seferi (tohum)
  - id: "vapur_ilk_sefer"
    konum: ["kiyikent_liman"]
    perde: [2]
    agirlik: 1
    etiketler: ["vapur", "deniz", "liman"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Karşı yakaya", en: "Across the sound" }
    sahne: "sefer_1"
    sahneler:
      - id: "sefer_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabahın köründe, şehrin neresinde olursan ol, vapurun düdüğü seni buluyor: iki uzun, bir kısa. Telsizden kaptanın sesi geliyor: \"İlk sefer. Sensiz kalkmam.\"", en: "Wherever you are in the city, the ferry horn finds you before dawn: two long, one short. The captain's voice comes over the radio: \"First run. Not leaving without you.\"" }
          - metin: { tr: "Güvertede turuncu kol bantlı otuz avcı, silahları kucaklarında, tek söz etmeden körfezi seyrediyor. Hiçbiri seninle göz göze gelmiyor; bu vapuru kimin kaldırdığını bilmeyen yok.", en: "There are thirty hunters in orange armbands on deck, weapons across their laps, staring out at the water without a word. None of them meets your eye. They all know who lifted this boat." }
            kosul: { bayrak: "vapur_lonca" }
          - metin: { tr: "Güvertede boş sandıklar, boş çuvallar, bir de Konsey'den altı gönüllü var. Hemşire listesini üçüncü kez okuyor: süt, un, tohum. Bir çocuk martılara bisküvi atıyor.", en: "The deck's stacked with empty crates and empty sacks and six volunteers from the Council. The nurse is reading her list for the third time: milk, flour, seed. A kid's tossing crackers to the gulls." }
            kosul: { bayrak: "vapur_siginak" }
          - metin: { tr: "Güverte tıklım tıklım: adalarda evi olan yaşlılar, tarla görmeye can atan çocuklar, bir keçi, bir akordeon; kimsenin bileti yok. Kaptan dümende ıslık çalıyor.", en: "The deck is packed: old folks who had houses on the islands, kids who want to see a farm, a goat, an accordion. No tickets. The captain's whistling at the wheel." }
            kosul: { bayrak: "vapur_halk" }
          - metin: { tr: "Güvertede yalnızca senin listene yazılanlar var: bir avcı ekibi, iki aile, Konsey'den bir hemşire, bir de adını duyup gelmiş üç genç. Kaptan seni dümenin yanına çağırıyor: \"Tarife senin.\"", en: "Everyone on deck is someone on your list: a hunter crew, two families, a nurse from the Council and three kids who showed up because they heard your name. The captain calls you up next to the wheel. \"Your schedule,\" he says." }
            kosul: { bayrak: "vapur_oyuncu" }
          - { tr: "Körfezin ortasında sis çöküyor. Motor homurdanarak ilerlerken bir şey gövdenin altından geçiyor; bütün vapur, alınıp verilen bir nefes gibi bir an kalkıp yeniden oturuyor.", en: "Halfway across the sound the fog comes down. The engine grumbles along. Then something passes under the hull, and the whole ferry lifts for a second and settles, like a breath." }
          - metin: { tr: "Sisin içinde, pruvanın tam önünde eski fenerin ışığına benzeyen bir ışık yanıp sönüyor. Kaptan dümeni ona doğru kırmaya başlıyor; gözleri bomboş.", en: "Out in the fog, dead ahead of the bow, a light like the old lighthouse beam pulses on and off. The captain starts turning the wheel toward it. His eyes have gone completely blank." }
            kosul: { bayrak_yok: "fenerci_olduruldu" }
          - metin: { tr: "Sisin içinden tıkırtılar yükseliyor: gövdeye tırmanan yüzlerce kıskaç. Fener Balığı Ana öldüğünden beri yavruları körfezde başıboş dolaşıyor; ışık yok artık, yalnızca açlık var.", en: "Clicking comes out of the fog: hundreds of claws climbing the hull. Ever since the Lamplighter died, her brood's been running loose in the sound. No light now. Just hunger." }
            kosul: { bayrak: "fenerci_olduruldu" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "O ışık gerçek fener değil; suyun altındaki bir şeyin ucunda sallanıyor, fenerin olması gereken yerden kırk metre ötede.", en: "That's not the real lighthouse. It's dangling off the end of something underwater, a hundred and thirty feet from where the lighthouse should be." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷u altında bir şey seni tanıyor. kordon'daki ışığa bakan her şey seni tanıyor artık.", en: "s̷omething under the water knows you. everything that ever looked at the light off the esplanade knows you now." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yüzerek giderim demiştim. Ne olur, şakam başıma gelmesin.\"", en: "\"I said I'd swim. Please don't make me eat that joke.\"" }
        secenekler:
          - id: "fener"
            etiket: { tr: "Dümeni kaptandan al; ışığın kaynağına dal", en: "Take the wheel off the captain. Dive for the light" }
            goster: { bayrak_yok: "fenerci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["fenerci_ana@oyuncu+2"], ortam: ["su", "karanlik"], kazan: "sefer_zafer_fener", kaybet: "sefer_yenilgi", kac: "sefer_yenilgi" }
          - id: "kiskac"
            etiket: { tr: "Küpeşteye çık; kıskaçları gövdeden sök", en: "Get up on the rail. Peel the claws off the hull" }
            goster: { bayrak: "fenerci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya"], ortam: ["su"], kazan: "sefer_zafer", kaybet: "sefer_yenilgi", kac: "sefer_yenilgi" }
          - id: "kos"
            tur: "gosteris"
            etiket: { tr: "Pruvadan atla, suyun üstünde koş", en: "Jump off the bow and run across the water" }
            gerekli: { stat: { agi: 60 } }
            etkiler:
              - dikkat: 4
              - ahlak: { duzen: -1, insanlik: -1 }
              - efsane: "tek_basina_suru"
            sonraki: "sefer_kosu"
          - id: "salon"
            etiket: { tr: "Yolcuları iç salona topla; kapıyı sen tut", en: "Herd the passengers inside. You hold the door" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 2 } }
              - can: -20
            sonraki: "sefer_kapi"

      - id: "sefer_kosu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Pruvadan atlıyorsun; su ayağının altında asfalt gibi duruyor, öyle hızlısın ki seni yutmaya vakit bulamıyor. Güvertedekiler küpeşteye yığılmış, sisin içinde ardında bıraktığın köpük çizgisini izliyor.", en: "You jump off the bow and the water holds under your feet like asphalt. You're moving too fast for it to swallow you. Everyone on deck crowds the rail, watching the line of foam you leave behind in the fog." }
          - metin: { tr: "Işığın ucuna varıyorsun. Altında, fenerin ışığını taklit eden şeyin kocaman, solgun gözü sana bakıyor ve bir anlığına, gerçekten korkuyor.", en: "You reach the end of the light. Underneath it, the huge pale eye of the thing faking the lighthouse beam looks up at you. And then, for a second, it's honestly afraid." }
            kosul: { bayrak_yok: "fenerci_olduruldu" }
          - metin: { tr: "Kıskaç sürüsü gövdeden kopup dalga gibi sana yöneliyor, yüzlercesi birden. Ama dalga sana ulaşamadan dağılıveriyor: ayaklarının altında suyun nasıl titrediğini görmüşler.", en: "The swarm of claws peels off the hull and turns toward you, hundreds of them, like a wave. But the wave breaks apart before it ever reaches you. They saw how the water was shaking under your feet." }
            kosul: { bayrak: "fenerci_olduruldu" }
        secenekler:
          - id: "vur"
            etiket: { tr: "Bitir şunu", en: "Finish it" }
            goster: { bayrak_yok: "fenerci_olduruldu" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["fenerci_ana@oyuncu"], ortam: ["su"], kazan: "sefer_zafer_fener", kaybet: "sefer_yenilgi", kac: "sefer_yenilgi" }
          - id: "don"
            etiket: { tr: "Vapura dön; yolu açtın", en: "Head back to the ferry. The way's clear" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "sefer_varis"

      - id: "sefer_kapi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Herkesi iç salona doldurup sırtını kapıya veriyorsun. Camların ardında sis kaynıyor; bir şey gövdeye çarpıyor, bir daha, bir daha.", en: "You pack everybody into the main cabin and put your back against the door. Past the windows, the fog is boiling. Something slams into the hull, again, and again." }
          - { tr: "Bir çocuk elini cama dayıyor. Sen kapıda durduğun sürece içeride kimse ağlamıyor.", en: "A kid presses a hand against the glass. As long as you're standing in that door, nobody inside cries." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Kapıyı arkandan kilitlet; dışarı çık", en: "Have them lock it behind you. Go out" }
            goster: { bayrak_yok: "fenerci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["fenerci_ana@oyuncu+2"], ortam: ["su", "karanlik"], kazan: "sefer_zafer_fener", kaybet: "sefer_yenilgi", kac: "sefer_yenilgi" }
          - id: "cik2"
            etiket: { tr: "Kapıyı arkandan kilitlet; dışarı çık", en: "Have them lock it behind you. Go out" }
            goster: { bayrak: "fenerci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya"], ortam: ["su"], kazan: "sefer_zafer", kaybet: "sefer_yenilgi", kac: "sefer_yenilgi" }

      - id: "sefer_zafer_fener"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Işık söner sönmez suyun altından ağır, solgun bir şey yükseliyor; karnı yukarıda, sisin içinde ada gibi yüzüyor. Kaptan gözlerini kırpıştırıp önce dümene, sonra sana bakıyor.", en: "The light goes out. Something rises from below, heavy and pale, belly-up, floating in the fog like an island. The captain blinks, looks at the wheel, then at you." }
          - { tr: "\"Kırk yıl,\" diyor. \"Kırk yıl o fenere baktım. Bir gün bana yalan söyleyeceği aklımın ucundan geçmezdi.\"", en: "\"Forty years,\" he says. \"Forty years I watched that lighthouse. Never crossed my mind it'd lie to me someday.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Dümeni kaptana geri ver", en: "Give the captain back the wheel" }
            etkiler:
              - bayrak: "fenerci_olduruldu"
              - gorev: { fenerciyi_avla: "tamam" }
              - unvan: "fenerci_avcisi"
              - esya: { fener_incisi: 1 }
              - xp_seviye: 60
            sonraki: "sefer_varis"

      - id: "sefer_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Son kıskaç da küpeşteden kopup suya düşüyor. Sis seyrelince ileride, ilk kez, adaların koyu yeşili beliriyor.", en: "The last claw peels off the rail and drops into the water. The fog thins out, and up ahead, for the first time, you can see the dark green of the islands." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Pruvaya geç", en: "Move up to the bow" }
            etkiler:
              - xp_seviye: 40
            sonraki: "sefer_varis"

      - id: "sefer_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Su seni bir yumruk gibi yutuyor. Güverteye nasıl çıktığını hatırlamıyorsun; biri yakandan çekip çıkarmış, bir başkası ciğerlerindeki suyu boşaltmış.", en: "The water swallows you like a fist. You don't know how you got back on deck. Somebody grabbed you by the collar, somebody pumped the water out of your lungs." }
          - { tr: "Kaptan dümeni geri kırmış, vapur limana dönüyor. Kimse ağzını açmıyor. Adalar sisin içinde kalıyor; bu seferlik.", en: "The captain's swung the wheel around and the ferry's heading back to port. Nobody says anything. The islands stay out there in the fog. This time." }
        secenekler:
          - id: "don"
            etiket: { tr: "Limana dön", en: "Head back to port" }
            etkiler:
              - can: 10
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "sefer_varis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Adanın iskelesi çürümüş ama ayakta. Budayan olmadığı için bahçeler yabanıllaşmış; elmalar avuç büyüklüğünde, hafiften ışıldıyor. Tavuklar insanı unutmuş ama yemi unutmamış.", en: "The island dock is rotten but standing. Nobody's pruned the orchards, so they've gone wild. The apples are as big as your fist and they glow, just a little. The chickens have forgotten people. They remember feed." }
          - metin: { tr: "Karaya ilk avcılar çıkıp doğruca ormandaki kapının ışığına yürüyor; sandıklar boş kalıyor. \"Dönüşte doldururuz,\" diyor çavuş, ama dönüşte de dolduran olmuyor.", en: "The hunters are first off the boat, and they march straight for the glow of the Gate in the woods. The crates stay empty. \"We'll fill 'em on the way back,\" the sergeant says. Nobody fills them on the way back either." }
            kosul: { bayrak: "vapur_lonca" }
          - metin: { tr: "Gönüllüler sandıkları doldurmaya koyuluyor; hemşire her sandığı listesinden çiziyor ve her çizişte biraz daha gençleşiyor sanki.", en: "The volunteers start filling crates. The nurse crosses each one off her list, and every time she does she looks a little younger." }
            kosul: { bayrak: "vapur_siginak" }
          - metin: { tr: "Yaşlılar evlerine dağılıyor, çocuklar tarlalara koşuşuyor; keçi gidip hemen bir elma ağacının altına kuruluyor. Akordeon bütün öğleden sonra susmuyor. Dönüşte vapur, kimsenin elinde liste olmadan ağzına kadar dolu.", en: "The old folks scatter to their houses, the kids run for the fields, and the goat plants itself under an apple tree on the spot. The accordion plays all afternoon. On the way back the ferry's full to the rails, and nobody had a list." }
            kosul: { bayrak: "vapur_halk" }
          - metin: { tr: "Listen tıkır tıkır işliyor: avcılar kapının çevresini temizliyor, aileler sandıkları dolduruyor, hemşire tohum seçiyor. Kaptan dönüş saatini sana soruyor; sen bir saat söylüyorsun, herkes günü o saate göre ayarlıyor.", en: "Your list works. The hunters clear the ground around the Gate, the families fill crates, the nurse picks seed. The captain asks you what time to head back. You name an hour, and everyone lives by it." }
            kosul: { bayrak: "vapur_oyuncu" }
        secenekler:
          - id: "elma"
            etiket: { tr: "Bir sandık elmayı kendin taşı", en: "Carry a crate of apples yourself" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "vapur_sefer_tamam"
              - xp_seviye: 30
              - tohum: { olay: "eski_sehir_ekmek_kuyrugu", gecikme: { min: 2, max: 5 }, kosul: { gun_min: 61 }, hatirlatma: { tr: "Vapurun ilk seferinde karşı yakaya taşınanlar {yer:eski_sehir|in} kuyruklarına karışmış.", en: "The people carried across on the ferry's first run have joined the lines in {yer:eski_sehir}." } }
            sonraki: "@akis"
          - id: "kapi"
            etiket: { tr: "Ormandaki kapıya bir bak", en: "Take a look at the Gate in the woods" }
            etkiler:
              - ahlak: { duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "vapur_sefer_tamam"
              - gunluk: { kapi: 1 }
              - itibar: { lonca: 2 }
              - xp_seviye: 40
            sonraki: "@akis"

  # ================================================================== KARANTİNA GEMİSİ (Elif)
  - id: "liman_karantina_gemisi"
    konum: ["kiyikent_liman"]
    perde: [2]
    bolge: ["kiyikent_liman"]
    gun: { min: 50, max: 170 }
    agirlik: 5
    npc: ["elif_sari"]
    etiketler: ["siginak", "ahlak", "liman", "salgin"]
    gerilim: 3
    onemli: true
    kart: { tr: "Sarı bayraklı gemi", en: "The ship with the yellow flag" }
    sahne: "karantina_1"
    sahneler:
      - id: "karantina_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mendireğin açığında demirlemiş bir konteyner gemisinin direğinde sarı bayrak dalgalanıyor. Gece çökünce gövde içeriden hafif hafif parlamaya başlıyor: yüzlerce lombozdan birden, nabız gibi atan mavi bir ışık.", en: "Off the breakwater, a yellow flag flies from the mast of an anchored container ship. When night falls, its hull glows faintly from the inside: a blue light, pulsing like a heartbeat, out of a hundred portholes at once." }
          - { tr: "Rıhtımda dokuz avcı bir botu patlayıcıyla dolduruyor. Başlarındaki çavuş ellerini silip sana dönüyor: \"Dün gece biri patladı. İçinden kristal fışkırdı, iki hemşire öldü. Gemi sabaha batacak.\"", en: "Nine hunters on the pier are loading a launch with demolition charges. Their sergeant wipes his hands and turns to you. \"One of 'em burst last night. Crystal shot right out of him. Two nurses dead. That ship goes down by morning.\"" }
          - { tr: "Çavuşun kemerindeki telsiz cızırdıyor; ardından {npc:elif_sari|in} yorgun, bitkin sesi geliyor: \"Duyan varsa... gemide otuz bir hasta var. Yirmi sekizi hâlâ insan.\"", en: "The radio on the sergeant's belt crackles and {npc:elif_sari|pos} voice comes through, tired, so tired: \"If anyone can hear me... there are thirty-one patients on this ship. Twenty-eight of them are still people.\"" }
          - metin: { tr: "Bu kez {npc:elif_sari} gemide değil, yanında duruyor. Telsizdeki ses baş hemşiresinin. O sesi duyunca {npc:elif_sari|in} benzi atıyor.", en: "This time {npc:elif_sari} isn't on the ship. She's standing next to you, and the voice on the radio is her head nurse. When she hears it, the color drains out of her face." }
            kosul: { yoldas: "elif_sari" }
          - metin: { tr: "Çavuşun cebinde Çekirdek'in mühürlü emri duruyor: [Bölge tehdidi: imha edilecek]. \"Emir yukarıdan,\" deyip kâğıdı sana gösteriyor; tartışacak bir şey yokmuş gibi.", en: "The sergeant's got the Core's sealed order in his pocket: [Regional threat: to be destroyed]. \"Orders from the top,\" he says, and shows you the paper like there's nothing to discuss." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Konsey gemiyi korumaktan yana oy vermiş. Çavuş o kâğıdı katlayıp cebine sokuyor. \"Konsey oylarken insanlar ölüyor,\" diyor.", en: "The Council voted to protect the ship. The sergeant folds that paper up and puts it in his pocket. \"People die while the Council votes,\" he says." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Rıhtımın öbür ucunda beyazlara bürünmüş üç kişi bekliyor. Hastaları \"kristal hasadı\" için istiyorlar; onlara göre gemiyi batırmak israf.", en: "Three people in white are waiting at the other end of the pier. They want the patients for a \"crystal harvest.\" Sinking them would be a waste, they say." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Rıhtımın gölgesinde, elinde şırınga kutusuyla Ağ'dan biri bekliyor. Gemi batmadan örnek almak istiyor. Kimse ona izin vermemiş ama yasaklayan da olmamış.", en: "Someone from the Network is waiting in the shadows on the pier with a case of syringes. They want samples before the ship goes down. Nobody gave permission. Nobody said no, either." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Çavuş elindeki tetiği sana uzatıyor. \"Çekirdek senin,\" diyor. \"O hâlde emir de senin.\"", en: "The sergeant holds the detonator out to you. \"The Core's yours,\" he says. \"So's the order.\"" }
            kosul: { bayrak: "cekirdek_oyuncu" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Bottaki patlayıcıların yarısı bir gemiyi batırmaya yeter, öbür yarısı rıhtımı da götürür. Çavuşun bundan haberi yok.", en: "Half the charges on that launch would sink a ship. The other half would take the pier with it, and the sergeant doesn't know that." }
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Mavi ışığın nabzı düzensiz: bedenin kaldıramadığı öz, kristalleşerek dışarı taşıyor. Biri o özü boşaltabilse kristalleşme durur.", en: "That blue pulse is irregular: essence the body can't carry, overflowing as crystal. If somebody could drain it off, the crystallizing would stop." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ ışık... aç olduğumu söylemiş miydim? söylememişimdir herhalde. işte şimdi söylüyorum.", en: "t̷hat light... did i mention i'm hungry? i probably didn't. i'm mentioning it now." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O gemiye adım atsınlar, yemin ederim hepsini kendi ellerimle dikerim. Sonra dikişleri tek tek sökerim.\"", en: "\"If they set foot on that ship, I swear to God I'll stitch every one of them up myself. And then I'll take the stitches out.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yirmi sekiz kişi. İnsan dedi, duydun mu? İnsan.\"", en: "\"Twenty-eight people. She said people. You hear that? People.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kristalleşme hata değil, taşma. Taşma varsa arabellek de vardır. Arabellek varsa da... şey, boşaltılabilir.\"", en: "\"Crystallization isn't a bug, it's an overflow. If there's an overflow, there's a buffer. If there's a buffer... uh, it can be flushed.\"" }
        secenekler:
          - id: "bin"
            etiket: { tr: "Bir kayığa atla, önce gemiyi gör", en: "Jump in a skiff. See the ship first" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
            kronik: { tr: "Kimse bir karar vermeden sarı bayraklı gemiye çıkıp hastaların yüzüne baktın.", en: "Before anyone could decide anything, you went aboard the ship with the yellow flag and looked the patients in the face." }
            sonraki: "karantina_gemi"
          - id: "firlat"
            tur: "gosteris"
            etiket: { tr: "Patlayıcıları tek tek körfeze fırlat", en: "Hurl the charges into the sound, one by one" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -3, merhamet: 3 }
              - itibar: { lonca: -4, siginak: 3 }
              - bayrak: "karantina_patlayici_atildi"
            kronik: { tr: "Karantina gemisini batıracak patlayıcıları körfezin ortasına savurdun. O gece suyun dibinde üç ayrı güneş doğdu.", en: "You threw the charges meant for the quarantine ship out into the middle of the sound, and that night three separate suns rose underwater." }
            sonraki: "karantina_firlat"
          - id: "emir"
            etiket: { tr: "Emri ben veririm: kimse bir şey patlatmıyor", en: "I give the orders. Nobody blows anything" }
            goster: { bayrak: "cekirdek_oyuncu" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - bayrak: "karantina_patlayici_atildi"
            kronik: { tr: "Çekirdek senindi; karantina gemisinin imha emrini kendi ağzınla iptal ettin.", en: "As holder of the Core, you cancelled the order to destroy the quarantine ship yourself." }
            sonraki: "karantina_gemi"
          - id: "batir"
            etiket: { tr: "Çavuşa hak ver, gemi batsın", en: "Side with the sergeant. Let it sink" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3, duzen: 3 }
              - itibar: { lonca: 4, siginak: -6 }
              - iliski: { elif_sari: { guven: -15, saygi: -5 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: -40 }
              - degisken: { hayatta_kalan: -3 }
              - bayrak: "karantina_batti"
            kronik: { tr: "Sarı bayraklı geminin batırılmasına onay verdin. Yirmi sekiz insan, üç kristalle birlikte körfezin dibini boyladı.", en: "You signed off on sinking the ship with the yellow flag, and twenty-eight people went to the bottom of the sound alongside three crystals." }
            sonraki: "karantina_batis"

      - id: "karantina_firlat"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İlk paketi bottan kapıp fırlatıyorsun; körfezin karanlığında bir çizgi gibi uzaklaşıp gözden yitiyor. Ardından ikincisi, üçüncüsü... Çavuşun aklı bağırmaya ancak dördüncüde geliyor.", en: "You pull the first charge out of the launch and throw it. It shrinks into the dark over the sound like a line drawn with a ruler. The second, the third. The sergeant only thinks to yell on the fourth." }
          - { tr: "Çok uzakta su üç kez aydınlanıp kabarıyor, sonra geri çöküyor. Bir saniye sonra rıhtım sarsılıyor. Dokuz avcının dokuzu da silahını yere bırakmış, gözünü sana dikmiş.", en: "Way out on the water, the sound lights up three times, rises and falls back. A second later the pier shakes. Nine hunters stare at you, and all nine have set their weapons down." }
        secenekler:
          - id: "gemi"
            etiket: { tr: "Şimdi gemiye çık", en: "Now go out to the ship" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
            kronik: { tr: "Patlayıcılar denizi boyladıktan sonra karantina gemisine çıktın; önüne geçen olmadı.", en: "With the charges in the sea, you went out to the quarantine ship and nobody tried to stop you." }
            sonraki: "karantina_gemi"

      - id: "karantina_gemi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ambara üç sıra portatif yatak dizilmiş. Hastaların derisinden mercan gibi kristaller fışkırmış; kimininki bileğinde bilezik kadar, kimininki boynundan çenesine tırmanmış.", en: "There are three rows of cots in the hold. Crystal has grown out of the patients' skin like coral, a bracelet's worth on some wrists, on others climbing from the neck up over the jaw." }
          - metin: { tr: "{npc:elif_sari} bir yatağın başına eğilmiş; eldivenleri kristal tozundan maviye kesmiş. Seni görünce doğrulmuyor bile. \"Ham kristal,\" diyor. \"Karaborsadan alıp yutmuşlar, çabuk seviye için. Sistem kimseyi uyarmadı.\"", en: "{npc:elif_sari} is bent over a cot, gloves blue with crystal dust. She doesn't even straighten up when she sees you. \"Raw crystal,\" she says. \"Bought off the black market and swallowed. Quick levels. The System didn't warn a soul.\"" }
            kosul: { bayrak_yok: "elif_yoldas" }
          - metin: { tr: "{npc:elif_sari} ambara senden önce iniyor; eldivenlerini geçirip baş hemşiresine sarılıyor, ardından vakit kaybetmeden işe koyuluyor. \"Ham kristal,\" diyor. \"Karaborsadan alıp yutmuşlar, çabuk seviye için. Sistem kimseyi uyarmadı.\"", en: "{npc:elif_sari} gets down into the hold ahead of you, pulls on gloves, hugs her head nurse, and gets straight to work. \"Raw crystal,\" she says. \"Bought off the black market and swallowed. Quick levels. The System didn't warn a soul.\"" }
            kosul: { bayrak: "elif_yoldas" }
          - metin: { tr: "Aklına balıkhanedeki pürüzsüz kristaller geliyor. Ölülerden sökülen öz, yaşayanların boğazında yeniden ölüme dönüşüyor.", en: "You think of the smooth crystals at the fish hall. Essence taken off the dead, turning back into death in the throats of the living." }
            kosul: { bayrak: "balikhane_goruldu" }
          - { tr: "Köşedeki yatakta on iki yaşlarında bir oğlan resim yapıyor. Sol kolu omzuna kadar mavi, taş gibi sert; sağ eliyle bir vapur çiziyor. Yan yatmış değil, dimdik duran bir vapur.", en: "On the cot in the corner, a boy of about twelve is drawing. His left arm is blue and rigid up to the shoulder. With his right hand he's drawing a ferry. Not one on its side. One sitting up straight." }
          - { tr: "\"En kötü üçü bunlar,\" diyor {npc:elif_sari} sesini alçaltıp. \"O oğlan da aralarında. Üç günleri var. Sonra patlarlar, yanlarındakileri de götürürler.\"", en: "\"The worst three,\" {npc:elif_sari} says, keeping her voice down. \"That boy's one of them. Three days. Then they burst, and they take the people next to them along.\"" }
        sezgiler:
          - kosul: { stat: { int: 40 } }
            metin: { tr: "Oğlanın kolundaki kristal kanal gibi akıp özün kaynağına uzanan bir çizgi çiziyor. O çizgiyi yakalayabilen biri özü dışarı çekebilir.", en: "The crystal in the boy's arm flows like a channel, a line running back to the source of the essence. Somebody who could get hold of that line could pull the essence out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ırak beni. bir tanesini, yalnız bir tanesini. çocuk yaşar, ben doyarım. ikimiz de kazanırız. sen de.", en: "l̷et me. just one. only one. the kid lives, i eat. we both win. you too." }
        secenekler:
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} oğlanın kristalini yedir", en: "Let {npc:yanki} eat the boy's crystal" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { stat: { int: 35 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -3 }
              - dikkat: 4
              - iliski: { yanki: { guven: 5, baglilik: 3 }, elif_sari: { korku: 10, saygi: 5 } }
            kronik: { tr: "Karantina gemisinde bir çocuğun kristalini {npc:yanki|e} yedirdin; çocuk kurtuldu.", en: "On the quarantine ship you fed a child's crystal to {npc:yanki}, and the child lived." }
            sonraki: "karantina_yanki"
          - id: "koru"
            etiket: { tr: "Gemiyi koru: rıhtımda dur, kimse geçmesin", en: "Guard the ship. Stand on the pier. Nobody passes" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - itibar: { lonca: -6, siginak: 6 }
              - iliski: { elif_sari: { guven: 8, saygi: 4 }, kaya_demir: { saygi: 3, guven: -4 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: 40 }
              - bayrak: "karantina_korundu"
              - tohum: { olay: "liman_balikhane_karaborsa", gecikme: { min: 1, max: 3 }, kosul: { bayrak_yok: "balikhane_goruldu" }, hatirlatma: { tr: "Sarı bayraklı gemiden sonra limanın karanlık köşeleri seni tanıyor.", en: "Since the ship with the yellow flag, the dark corners of the harbor know who you are." } }
            kronik: { tr: "Rıhtımda, karantina gemisinin önünde tek başına nöbete oturdun; o gece kimse sarı bayrağa yaklaşamadı.", en: "You stood alone on the pier in front of the quarantine ship, and that night nobody came near the yellow flag." }
            sonraki: "karantina_koruma"
          - id: "cek"
            tur: "gosteris"
            etiket: { tr: "Demir zincirini omzuna al, gemiyi açığa çek", en: "Shoulder the anchor chain. Tow the ship out" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4, lonca: 2 }
              - iliski: { elif_sari: { saygi: 6, guven: 4 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: 30 }
              - bayrak: "karantina_tasindi"
              - tohum: { olay: "liman_balikhane_karaborsa", gecikme: { min: 1, max: 3 }, kosul: { bayrak_yok: "balikhane_goruldu" }, hatirlatma: { tr: "Sarı bayraklı gemiden sonra limanın karanlık köşeleri seni tanıyor.", en: "Since the ship with the yellow flag, the dark corners of the harbor know who you are." } }
            kronik: { tr: "Demir zincirini omzuna vurup karantina gemisini yüze yüze adaların koyuna kadar çektin.", en: "You swam the quarantine ship out to a cove in the islands with its anchor chain over your shoulder." }
            sonraki: "karantina_ada"
          - id: "triyaj"
            etiket: { tr: "Sağlamları indir, en kötü üçü kalsın", en: "Get the stable ones off. The worst three stay" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 4 }
              - iliski: { elif_sari: { saygi: 2, guven: -4 } }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "karantina_triyaj"
            kronik: { tr: "Karantina gemisinde triyaja karar verdin: yirmi sekiz kişi karaya çıktı, üçü gemiyle birlikte battı.", en: "You ran triage on the quarantine ship: twenty-eight people went ashore and three went down with the ship." }
            sonraki: "karantina_triyaj_sahne"

      - id: "karantina_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini oğlanın mavi koluna koyar koymaz {npc:yanki} içinden akmaya başlıyor; soğuk bir dil gibi kristalin damarlarını yalıyor. Mavi ışık kolun ucundan omza doğru geri çekiliyor, oradan avucuna geçip sönüyor.", en: "You lay your hand on the boy's blue arm and {npc:yanki} flows out through you, like a cold tongue licking along the crystal's veins. The blue light pulls back from his fingertips, up to the shoulder, into your palm, and goes out there." }
          - { tr: "Oğlan kolunu oynatınca kristal kırıntıları kum gibi yatağa dökülüyor; altından pembe, buruşuk, yepyeni bir deri çıkıyor. Resmini yere düşürüp ağlamaya başlıyor: ilk kez bir şey hissediyor.", en: "The boy moves his arm. Crystal flakes spill onto the cot like sand, and underneath there's new skin, pink and wrinkled. He drops his drawing and starts to cry, because for the first time he can feel something." }
          - { tr: "{npc:elif_sari} sana, bir hekimin adını koyamadığı bir şeye baktığı gibi bakıyor. {npc:yanki} ise memnun, ağzı dolu: daha var. otuz tane daha. hepsi bu kadar kolay.", en: "{npc:elif_sari} looks at you the way a doctor looks at something she doesn't have a name for. {npc:yanki} sounds pleased, mouth full: there's more. thirty more. every one this easy." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[ö̷z emildi]", en: "[e̷ssence absorbed]" }
            satirlar:
              - { tr: "tadı tuzlu. kıyıkent gibi.", en: "tastes like salt. like port harlow." }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Hepsini boşalt, otuz bir kişinin hepsini", en: "Drain them all. All thirty-one" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: -5 }
              - dikkat: 10
              - iliski: { yanki: { guven: 6, baglilik: 6 }, elif_sari: { korku: 15, saygi: 5 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: 25 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "karantina_herkes_yanki"
              - xp_seviye: 60
            kronik: { tr: "Karantina gemisindeki otuz bir hastanın kristalini {npc:yanki|e} yedirdin. Şafakta hepsi yataklarında doğrulmuştu, {npc:yanki} ise hiç değilse o gece doymuştu.", en: "You fed the crystal of all thirty-one patients on the quarantine ship to {npc:yanki}. By dawn they were all sitting up on their cots, and for that night, at least, {npc:yanki} was full." }
            sonraki: "karantina_bitti"
          - id: "bir"
            etiket: { tr: "Bu kadarı yeter. Gerisine başka bir yol bul", en: "That's enough. Find another way for the rest" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { yanki: { guven: -3 } }
              - bayrak: "karantina_bir_cocuk"
            kronik: { tr: "{npc:yanki|e} yalnız bir çocuğun kristalini yedirdin, sonra onu dizginleyip ötekiler için başka bir yol aradın.", en: "You let {npc:yanki} take one child's crystal, then reined it in and went looking for another way for the rest." }
            sonraki: "karantina_karar"

      - id: "karantina_karar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Güverteye çıktığında rıhtımdaki botun motoru çalışıyor, çavuş fenerini sallıyor. Şafağa iki saat var.", en: "You climb up to the deck. Back on the pier the launch's engine is running. The sergeant's swinging a flashlight. Two hours to dawn." }
          - { tr: "Oğlan pembe koluyla korkuluğa tutunarak arkandan geliyor. \"Ötekiler,\" diyor. \"Onlara ne olacak?\"", en: "The boy comes up behind you, holding the rail with his new pink arm. \"The others,\" he says. \"What happens to them?\"" }
        secenekler:
          - id: "koru"
            etiket: { tr: "Rıhtıma dön, kimse geçmesin", en: "Go back to the pier. Nobody passes" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { lonca: -6, siginak: 6 }
              - iliski: { elif_sari: { guven: 8 }, kaya_demir: { saygi: 3, guven: -4 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: 40 }
              - bayrak: "karantina_korundu"
            kronik: { tr: "Rıhtımda, karantina gemisinin önünde tek başına nöbete oturdun; o gece kimse sarı bayrağa yaklaşamadı.", en: "You stood alone on the pier in front of the quarantine ship, and that night nobody came near the yellow flag." }
            sonraki: "karantina_koruma"
          - id: "cek"
            tur: "gosteris"
            etiket: { tr: "Gemiyi açığa, adaların koyuna çek", en: "Tow the ship out to a cove on the islands" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 4, lonca: 2 }
              - iliski: { elif_sari: { saygi: 6 } }
              - hafiza: { npc: "elif_sari", id: "olay:liman_karantina_gemisi", agirlik: 30 }
              - bayrak: "karantina_tasindi"
            kronik: { tr: "Demir zincirini omzuna vurup karantina gemisini yüze yüze adaların koyuna kadar çektin.", en: "You swam the quarantine ship out to a cove in the islands with its anchor chain over your shoulder." }
            sonraki: "karantina_ada"

      - id: "karantina_koruma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Rıhtımın ucuna oturuyorsun; bacakların suya sarkmış, sırtın gemiye dönük. Tek söz etmene gerek yok. Çavuş yarım saat botun yanında volta atıp duruyor.", en: "You sit down at the end of the pier, legs hanging over the water, back to the ship. You don't need to say a thing. The sergeant paces next to the launch for half an hour." }
          - { tr: "Sonunda telsizine bir şeyler fısıldayıp cevabı dinliyor, adamlarına patlayıcıları geri taşımalarını söylüyor. Yanından geçerken bir an duraklıyor. \"Patlarlarsa,\" diyor, \"vebali senin boynuna.\"", en: "Then he mutters something into his radio, listens to the answer and tells his men to haul the charges back. He stops as he passes you. \"If they burst,\" he says, \"that's on you.\"" }
          - metin: { tr: "Şafakta {npc:elif_sari} güverteye çıkıp sana el sallıyor. Yanındaki ufak tefek gölge de kolunu kaldırıyor; pembe, yepyeni bir kol.", en: "At dawn {npc:elif_sari} comes up on deck and waves at you. There's a small figure next to her, and its arm goes up too, pink and new." }
            kosul: { bayrak: "karantina_bir_cocuk" }
          - metin: { tr: "Şafakta güverteye çıkan {npc:elif_sari} uzun uzun sana bakıyor. Sonra eldivenlerini çıkarıp korkuluğa asıyor. Bir geceliğine, yalnızca bir geceliğine de olsa hiçbiri patlamadı.", en: "At dawn {npc:elif_sari} comes up on deck and looks at you for a long time. Then she peels off her gloves and hangs them on the rail. For one night, just one, nobody burst." }
            kosul: { bayrak_yok: "karantina_bir_cocuk" }
        secenekler:
          - id: "kal"
            etiket: { tr: "{npc:elif_sari|e} üç gün nöbet tutacağını söyle", en: "Tell her you'll stand watch all three days" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - gun: 2
              - iliski: { elif_sari: { baglilik: 6 } }
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 45
            kronik: { tr: "Karantina gemisinin önünde üç gün nöbet tuttun; o üç gün boyunca sarı bayrağın gölgesinden ayrılmadın.", en: "You stood watch outside the quarantine ship for three days and never once left the shadow of the yellow flag." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Şafak söktü, işine dön", en: "It's dawn. Get back to your business" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 35
            kronik: { tr: "Karantina gemisini bir gece boyunca korudun, sabah da kendi işine döndün.", en: "You guarded the quarantine ship for one night and went back to your business in the morning." }
            sonraki: "@akis"

      - id: "karantina_ada"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Demir zincirini omzuna alıp suya giriyorsun. Gemi önce direniyor, sonra teslim oluyor; dalgaları yarıp ardında köpükten bir yol bırakarak körfezin ortasından adalara doğru ilerliyor.", en: "You get the anchor chain over your shoulder and walk into the water. The ship fights you at first, then gives up. It moves through the swells behind you, out across the middle of the sound toward the islands, leaving a road of foam." }
          - { tr: "Rıhtımda dokuz avcıyla çavuşları, ellerinde patlayıcılar, ağızları açık kalakalmış. Sonunda çavuş gülmeye başlıyor; ne yapacağını bilemeyen bir adamın gülüşüyle gülüyor.", en: "Back on the pier, nine hunters and a sergeant stand there with their mouths open and their charges in their hands. The sergeant finally starts laughing, the laugh of a man who has no idea what else to do." }
          - { tr: "Koyda gemiyi bir kayalığa bağlıyorsun. Burada patlayan kristal kimseyi götürmez, olsa olsa martıları ürkütür. {npc:elif_sari} güverteden sana bakıyor; sırılsıklam, bitkin ama nasılsa gülümsüyor.", en: "In the cove you tie the ship off to a rock shelf. A crystal that bursts out here won't take anybody with it. It'll just scare the gulls. {npc:elif_sari} looks down at you from the deck, soaked and exhausted and somehow smiling." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Çekiş: 11.400 ton]", en: "[Towed: 12,600 tons]" }
            satirlar:
              - { tr: "Tanık sayısı: 41. Bu sayı yarın sabaha kadar artacak.", en: "Witnesses: 41. That number will be higher by morning." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kıyıya yüz", en: "Swim back to shore" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - degisken: { hayatta_kalan: 3 }
              - efsane: "yabancilari_iyilestirdi"
              - xp_seviye: 55
            kronik: { tr: "Sarı bayraklı gemiyi, patlasa bile kimseyi götüremeyeceği bir koya çekip bağladın.", en: "You towed the ship with the yellow flag to a cove where, even if it burst, it couldn't take anyone with it, and tied it off there." }
            sonraki: "@akis"

      - id: "karantina_triyaj_sahne"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yirmi sekiz hastayı botlarla karaya taşıyorsunuz. {npc:elif_sari} listesinde her birini tek tek imzalarken eli bir kez bile titremiyor. Titremeyi en sona saklamış.", en: "You ferry twenty-eight patients ashore in boats. {npc:elif_sari} signs each one off her list, and her hand doesn't shake once. She saves the shaking for last." }
          - metin: { tr: "En kötü üçü ambarda kalıyor; resim yapan oğlan da aralarında. Son kayığa binerken oğlan çizdiği vapuru sana uzatıyor. \"Bunu kaldırmışsın,\" diyor. \"Herkes anlatıyor.\"", en: "The worst three stay in the hold. The boy with the drawing is one of them. As you climb into the last boat, he hands you the ferry he drew. \"You lifted this,\" he says. \"Everybody talks about it.\"" }
            kosul: { bayrak: "vapur_dogrultuldu" }
          - metin: { tr: "En kötü üçü ambarda kalıyor; resim yapan oğlan da aralarında. Son kayığa binerken oğlan çizdiği vapuru sana uzatıyor. \"Bunu sen al,\" diyor. \"Ben nasılsa bir daha çizerim.\"", en: "The worst three stay in the hold. The boy with the drawing is one of them. As you climb into the last boat, he hands you the ferry he drew. \"You keep it,\" he says. \"I can always draw another one.\"" }
            kosul: { bayrak_yok: "vapur_dogrultuldu" }
          - { tr: "Şafakta gemi batıyor. Suyun altından bir kez mavi bir ışık yükseliyor, sonra bir daha hiç.", en: "At dawn the ship goes down. A blue light rises from under the water, once, and then never again." }
        secenekler:
          - id: "resim"
            etiket: { tr: "Resmi katlayıp sakla", en: "Fold up the drawing and keep it" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - stat: { wil: 1 }
              - xp_seviye: 40
            kronik: { tr: "Batırdığın gemide bıraktığın oğlanın çizdiği vapuru katlayıp cebine koydun.", en: "You folded up the ferry drawn by the boy you left on the ship you sank, and put it in your pocket." }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} yanına otur, tek söz etme", en: "Sit down beside her. Don't say anything" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - xp_seviye: 40
            kronik: { tr: "Triyajdan sonra hekimin yanına oturdun; o sabah ikinizin de ağzından tek söz çıkmadı.", en: "After the triage you sat down next to the doctor without a word, and neither of you said anything all morning." }
            sonraki: "@akis"

      - id: "karantina_batis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çavuşun başını sallamasıyla bot rıhtımdan ayrılıyor. Telsizden {npc:elif_sari|in} sesi geliyor: \"Personele bir saat verdiler. Bir saat.\"", en: "The sergeant nods and the launch pulls away from the pier. On the radio, {npc:elif_sari|pos} voice: \"They gave the staff an hour. One hour.\"" }
          - { tr: "Bir saat sonra hemşireler botlarla karaya çıkıyor. En son inen {npc:elif_sari}; mavi tozlu eldivenleri hâlâ elinde, bir de resim kâğıdı var. Yanından geçerken yüzüne bakmıyor.", en: "An hour later the nurses come ashore in boats. {npc:elif_sari} is last off, holding a sheet of drawing paper, her gloves still blue with dust. She doesn't look at you when she walks past." }
          - { tr: "Şafakta su üç kez aydınlanıyor. Sonra mavi ışık körfezin dibine iniyor; yıllar geçse de bazı geceler hâlâ orada görülecek.", en: "At dawn the water lights up three times. Then the blue light sinks to the bottom of the sound, and for years after, on certain nights, you can still see it down there." }
        secenekler:
          - id: "git"
            etiket: { tr: "Rıhtımdan ayrıl", en: "Leave the pier" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - xp_seviye: 20
            kronik: { tr: "Karantina gemisi batarken rıhtımdan ayrıldın; hekim yanından geçerken yüzüne bakmamıştı.", en: "You left the pier as the quarantine ship went down. The doctor hadn't looked at you when she walked past." }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} peşinden git", en: "Go after {npc:elif_sari}" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { guven: 3 } }
            kronik: { tr: "Batırılan geminin ardından hekimin peşine düştün; sana tek bir soru sordu: neden.", en: "After the ship went down you went after the doctor, and she asked you one question: why." }
            sonraki: "karantina_neden"

      - id: "karantina_neden"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} iskelenin ucunda durmuş, resmi katlayıp açıyor, katlayıp açıyor. \"Neden?\" diyor, sesini hiç yükseltmeden. \"Seni dinleyeceklerdi. Herkes seni dinliyor.\"", en: "{npc:elif_sari} stands at the end of the dock, folding the drawing, unfolding it, folding it again. \"Why?\" she says. Her voice doesn't rise. \"They would have listened to you. Everybody listens to you.\"" }
        secenekler:
          - id: "matematik"
            etiket: { tr: "\"Üçü patlasa otuz kişi ölürdü.\"", en: "\"If three burst, thirty die.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - iliski: { elif_sari: { saygi: 2 } }
            kronik: { tr: "Hekime triyajın hesabını anlattın; o hesabı hekim zaten biliyordu.", en: "You explained the math of triage to a doctor. She already knew the math." }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "\"Yanıldım.\"", en: "\"I was wrong.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 5 } }
            kronik: { tr: "Karantina gemisi için hekime yanıldığını söyledin; ama o söz gemiyi geri getirmedi.", en: "You told the doctor you'd been wrong about the quarantine ship. It didn't bring the ship back." }
            sonraki: "@akis"

      - id: "karantina_bitti"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak söktüğünde ambarda tek bir mavi ışık kalmamış. Otuz bir kişi yataklarında doğrulmuş, derilerindeki kristali kum gibi silkeliyor; kimi gülüyor, kimi bir şey yitirmiş gibi ağlıyor.", en: "By dawn there isn't a single blue light left in the hold. Thirty-one people sit up on their cots, shaking crystal off their skin like sand. Some are laughing. Some are crying like they've lost something." }
          - { tr: "{npc:elif_sari} hiçbir şey yapmamış ellerine bakıyor. \"Ben buna ne diyeceğim?\" diyor. \"Tıp mı? Mucize mi? Yoksa sen neysen o mu?\"", en: "{npc:elif_sari} looks at her hands, hands that didn't do anything. \"What am I supposed to call this?\" she says. \"Medicine? A miracle? Or whatever you are?\"" }
          - { tr: "Rıhtımda çavuş patlayıcıları bota geri yüklüyor. Kimse ona bir şey söylemedi ama gemi artık parlamıyor; avuçlarının içiyse belli belirsiz maviye çalmış.", en: "On the pier the sergeant's loading the charges back onto the launch. Nobody told him anything, but the ship isn't glowing anymore. The insides of your palms, though, are faintly, very faintly, blue." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ellerini cebine sokup gemiden in", en: "Shove your hands in your pockets. Leave the ship" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - efsane: "yabancilari_iyilestirdi"
            kronik: { tr: "Otuz bir hastayı kurtardığın sabah avuçların maviydi; kimseye göstermedin.", en: "On the morning you saved thirty-one patients, your palms were blue, and you showed no one." }
            sonraki: "@akis"
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Ellerini {npc:elif_sari|e} göster", en: "Show {npc:elif_sari} your hands" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { guven: 6, korku: -5 } }
              - efsane: "yabancilari_iyilestirdi"
            kronik: { tr: "Hekime mavi avuçlarını gösterdin; ne olduğunu ikiniz de bilmiyordunuz, ikiniz de sustunuz.", en: "You showed the doctor your blue palms, and neither of you knew what it meant, and neither of you said so." }
            sonraki: "@akis"

  # ================================================================== KONTEYNER LABİRENTİ (keşif)
  - id: "liman_konteyner_labirenti"
    konum: ["kiyikent_liman"]
    perde: [2]
    bolge: ["kiyikent_liman"]
    gun: { min: 31, max: 180 }
    agirlik: 4
    etiketler: ["kesif", "ganimet", "liman", "hakimiyet"]
    gerilim: 2
    kart: { tr: "Konteyner labirenti", en: "The container maze" }
    sahne: "konteyner_1"
    sahneler:
      - id: "konteyner_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Konteyner limanında vinçler devler gibi diz çökmüş; devrilen yığınlar daracık, çelikten bir labirent kurmuş. Labirentin ortasından göğe mavi bir ışık sütunu yükseliyor: oraya bir Sistem ikmal sandığı düşmüş.", en: "Out at the container terminal, the gantry cranes have gone down on one knee like giants. The stacks have toppled into a tight steel maze, and from the middle of it a pillar of blue light rises into the sky. A System supply drop has landed." }
          - { tr: "Labirentin üç ağzında üç ayrı grup var. Turuncu kol bantlı altı Lonca avcısı iplerle, kancalarla tırmanıyor. Beyazlar giymiş iki Yükselen dua ederek bekliyor; sandığın kendilerine indirildiğine inanmışlar. Üçüncü ağızdaysa ellerinde borular, tencere kapaklarıyla beş genç dikiliyor.", en: "There are three groups at three different mouths of the maze. Six Guild hunters in orange armbands are climbing with ropes and grappling hooks. Two of the Ascended in white are waiting and praying; they're sure the crate was sent down for them. At the third mouth, five teenagers with lead pipes and pot lids." }
          - metin: { tr: "Gençlerden birini tanıyorsun: çarşıdaki cam köprüde ağabeyinin yanında borusunu ters tutan on beş yaşındaki çocuk bu. Artık borusunu doğru tutuyor.", en: "You know one of the kids: the fifteen-year-old from the skybridge at the mall who used to hold his pipe backward next to his big brother. He holds it right now." }
            kosul: { bayrak: "cete_oglan_kurtuldu" }
          - { tr: "Gençlerin hepsi ceketinin sırtına aynı şeyi boyamış: diş gösteren bir çakal. İçlerinden biri seni görünce bağırıyor: \"Sıraya gir! Çakallar önce gördü!\"", en: "The kids have all painted the same thing on the backs of their jackets: a jackal showing its teeth. One spots you and yells, \"Get in line! The Jackals saw it first!\"" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Işık sütunu bir değil, iki. Biri gerçekten gökten iniyor; öbürü labirentin doğu ucundaki kırmızı bir konteynerin içinden yukarı vuruyor. O kırmızı konteynerin kapısı nefes alır gibi aralanıp kapanıyor.", en: "There are two pillars of light. One is really coming down from the sky. The other is bouncing up out of a red container at the east end of the maze. The red container's door eases open and shut, like it's breathing." }
          - kosul: { stat: { agi: 40 } }
            metin: { tr: "Konteynerlerin tepesinden gidersen labirent diye bir şey kalmıyor; önünde kırmızılı mavili dümdüz bir yol uzanıyor.", en: "Go across the tops of the containers and there's no maze at all. Just a flat road of red and blue steel." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷istem ikmali kavga edesiniz diye atar. ödülü değil, kavgayı izler. ben de izliyorum, yalan yok.", en: "t̷he system drops supplies so you'll fight over them. it's not watching the prize. it's watching the fight. i'm watching too, to be honest." }
        secenekler:
          - id: "ust"
            tur: "gosteris"
            etiket: { tr: "Konteynerlerin üstünden koş, herkesten önce var", en: "Run across the container tops. Beat everyone there" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: -1 }
            sonraki: "konteyner_sandik"
          - id: "uyar"
            etiket: { tr: "Herkesi kırmızı konteynere karşı uyar", en: "Warn everybody off the red container" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { lonca: 2 }
              - bayrak: "konteyner_uyarildi"
            sonraki: "konteyner_tuzak"
          - id: "cakal"
            etiket: { tr: "Çakalların yanına geç, onlarla gir", en: "Fall in with the Jackals. Go in with them" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - bayrak: "cakallar_tanisildi"
            sonraki: "konteyner_cakallar"
          - id: "tuzak"
            etiket: { tr: "Lonca'yı kırmızı konteynere yönlendir", en: "Steer the Guild toward the red container" }
            goster: { stat: { per: 30 } }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -3 }
              - itibar: { lonca: -3 }
              - iliski: { kaya_demir: { guven: -4 } }
              - bayrak: "konteyner_lonca_tuzak"
            sonraki: "konteyner_lonca"

      - id: "konteyner_tuzak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Kırmızıya yaklaşmayın!\" Sesin konteynerlerin arasında yankılanıyor. Lonca avcılarından biri dönüp sana bakıyor, ardından kırmızı konteynere bir taş fırlatıyor.", en: "\"Stay away from the red one!\" Your voice bounces down the steel corridors. One of the Guild hunters turns to look at you, then lobs a rock at the red container." }
          - { tr: "Konteynerin kapısı bir ağız gibi açılıyor. İçeride sıra sıra dişler dizili: kilit dili biçiminde çelik dişler. Derken bütün konteyner ayağa kalkıyor.", en: "The container's door swings open like a mouth. There are teeth inside, row after row of them, steel teeth shaped like lock bolts. Then the whole container stands up." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Önüne geç, kimse ısırılmasın", en: "Get in front of it. Nobody gets bitten" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["konteyner_taklitci@dunya+10"], ortam: ["dar_gecit"], kazan: "konteyner_zafer", kaybet: "konteyner_kayip", kac: "konteyner_kayip" }
          - id: "izle"
            etiket: { tr: "Uyardın ya, gerisi onların sorunu", en: "You warned them. The rest is their problem" }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "konteyner_sandik"

      - id: "konteyner_cakallar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çakalların lideri on dokuz yaşlarında bir kız: sırtında eski bir kurye ceketi, başında bisiklet kaskı, gözlerinin altında uykusuzluk halkaları. Görünen seviyene bakıp kaşını kaldırıyor. \"Taşıyıcı mısın? Yüzde beş. Ağırları sen taşırsın.\"", en: "The Jackals' leader is a girl of maybe nineteen: an old courier jacket, a bike helmet, no sleep under her eyes. She glances at the level you're showing and raises an eyebrow. \"Porter? Five percent. You carry the heavy stuff.\"" }
          - metin: { tr: "Sonra yüzünü tanıyınca elindeki boru yere düşüyor. \"Sen... vapuru kaldıran sensin.\"", en: "Then she recognizes your face and the pipe drops out of her hand. \"You're... you're the one who lifted the ferry.\"" }
            kosul: { bayrak: "vapur_dogrultuldu" }
          - { tr: "Gençler labirente dalıyor. Kırmızı konteynerin önünden geçerken en küçükleri durup ışığa bakıyor; ışık sanki ona göz kırpıyor.", en: "The kids plunge into the maze. Passing the red container, the smallest one stops to stare at the light. The light seems to wink at him." }
        secenekler:
          - id: "cek"
            etiket: { tr: "Çocuğu yakasından geri çek", en: "Yank the kid back by his collar" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "konteyner_uyarildi"
            sonraki: "konteyner_tuzak"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Taşıyıcı rolüne gir, gücünü belli etme", en: "Play the porter. Don't show what you've got" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: -1 }
              - bayrak: "cakallar_hafife_aldi"
            sonraki: "konteyner_sandik"

      - id: "konteyner_lonca"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Sandık doğuda, kırmızının yanında,\" diyorsun Lonca'nın ip ustasına. Adam teşekkür edip ekibini oraya götürüyor.", en: "\"Crate's on the east side, next to the red one,\" you tell the Guild's rope man. He thanks you and leads his crew over there." }
          - { tr: "Konteynerin kapısı açılınca sıra sıra çelik dişler beliriyor. İlk çığlık labirentin her köşesine ulaşıyor; Çakallarla Yükselenler bir an duraksıyor, sonra hep birlikte ışığa koşuyorlar.", en: "The container door opens. Inside are rows of steel teeth. The first scream carries to every corner of the maze. The Jackals and the Ascended freeze for a second, then everyone runs for the light." }
        secenekler:
          - id: "kurtar"
            etiket: { tr: "Fikrini değiştir, avcıları kurtar", en: "Change your mind. Save the hunters" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - savas: { dusmanlar: ["konteyner_taklitci@dunya+10"], ortam: ["dar_gecit"], kazan: "konteyner_zafer", kaybet: "konteyner_kayip", kac: "konteyner_kayip" }
          - id: "sandik"
            etiket: { tr: "Kargaşadan yararlan, sandığa koş", en: "Use the chaos. Run for the crate" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "konteyner_sandik"

      - id: "konteyner_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Taklitçi konteyner yere yığılıyor, dişleri gevşek cıvatalar gibi asfalta saçılıyor. Etraftakiler önce sana, sonra birbirlerine bakıyor.", en: "The mimic crashes down, its teeth scattering across the asphalt like loose bolts. Everyone around you looks at you, then at each other." }
          - { tr: "Lonca'nın ip ustası bacağındaki ısırığı sarıp başıyla sana selam veriyor; bir askerin teşekkürü kadar kısa bir selam.", en: "The Guild's rope man wraps the bite on his leg and gives you a nod, short as a soldier's thank-you." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Gerçek sandığa yürü", en: "Walk to the real crate" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 3 } }
              - itibar: { lonca: 3 }
              - esya: { taklitci_disi: 1 }
              - xp_seviye: 25
            sonraki: "konteyner_sandik"

      - id: "konteyner_kayip"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çelik dişler omzuna kapanıp seni bir konteynerin duvarına çarpıyor. Bir an her yer kıpkırmızı kesiliyor; sonra Lonca'nın kancaları taklitçiyi yakalıyor, sen de kendini çekip kurtarıyorsun.", en: "Steel teeth clamp down on your shoulder and slam you into a container wall. For a second the world is red. Then the Guild's grappling hooks catch the mimic and you tear free." }
          - { tr: "Taklitçi sürüne sürüne labirentin derinliklerinde kayboluyor. Işık sütunlarından biri sönüyor; öbürü hâlâ yanıyor, herkes de ona koşuyor.", en: "The mimic crawls off into the depths of the maze. One of the pillars of light goes out. The other's still burning, and everyone's running for it." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalk, sandığa yürü", en: "Get up. Walk to the crate" }
            etkiler:
              - can: 10
            sonraki: "konteyner_sandik"

      - id: "konteyner_sandik"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İkmal sandığı bir konteynerin çatısına gömülmüş; buz gibi soğuk, masmavi. Kapağında herkesin okuyabileceği bir satır yazıyor: [Dönüş ikmali · İlk dokunan alır].", en: "The supply crate's buried in a container roof, ice-cold and blue. Its lid carries a line anybody can read: [Return supply · First touch claims]." }
          - metin: { tr: "Çakallar nefes nefese arkandan yetişiyor. Liderleri seni sandığın başında görünce duruyor; bir taşıyıcının oraya nasıl önce vardığını hesaplamaya çalışıyor ama hesap bir türlü tutmuyor.", en: "The Jackals come pounding up behind you, out of breath. Their leader sees you standing at the crate and stops, trying to work out how a porter got there first. The math doesn't work." }
            kosul: { bayrak: "cakallar_hafife_aldi" }
          - { tr: "Arkanda Lonca avcıları, Yükselenler ve Çakallar toplanıyor. Kimse ağzını açmıyor; herkes elinin kapağa ne zaman değeceğini bekliyor.", en: "Behind you, the Guild hunters, the Ascended and the Jackals gather. Nobody says anything. They're all waiting to see when your hand touches the lid." }
        secenekler:
          - id: "al"
            etiket: { tr: "Dokun, ilk dokunan alır", en: "Touch it. First touch claims" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - esya: { buyuk_iyilesme_iksiri: 2 }
              - oz_kristali: 4
              - oz_kristali: 2
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "cakallara"
            etiket: { tr: "Kapağı Çakallar'ın liderine bırak", en: "Let the Jackals' leader touch the lid" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - bayrak: "cakallar_tanisildi"
              - bayrak: "cakallara_sandik"
              - xp_seviye: 20
              - tohum: { olay: "eski_sehir_kapi_avcilari", gecikme: { min: 3, max: 8 }, hatirlatma: { tr: "Konteyner labirentinde karşılaştığın Çakallar başka bir kapının peşinde.", en: "The Jackals you ran into in the container maze are chasing another Gate." } }
            sonraki: "konteyner_cakallar_son"
          - id: "paylas"
            etiket: { tr: "Aç ve herkese eşit dağıt", en: "Open it and split it evenly" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { lonca: 2, yukselenler: 2, siginak: 2 }
              - iliski: { vahit: { saygi: 2 } }
              - esya: { buyuk_iyilesme_iksiri: 1 }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "yukselen"
            etiket: { tr: "Yükselenler'e ver, kendilerine indiğine inanıyorlar", en: "Give it to the Ascended. They think it's theirs" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - itibar: { yukselenler: 5 }
              - iliski: { vahit: { saygi: 4, guven: 3 } }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "konteyner_cakallar_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kurye ceketli kız elini kapağa koyunca sandık açılıyor. İçinden iksirler, kristaller, bir de üstünde [Dönüş ikmali] yazan küçük bir el feneri. Gençler sevinç çığlıkları atarken Lonca avcıları sana bakıp omuz silkiyor.", en: "The girl in the courier jacket puts her hand on the lid and the crate pops open. Potions, crystals, and a little flashlight stamped [Return supply]. The kids whoop. The Guild hunters look at you and shrug." }
          - { tr: "Kız feneri sana uzatıyor, sonra vazgeçip kendi cebine atıyor. \"{yer:eski_sehir|de} bir kapı bulduk,\" diyor. \"Hamamın içinde. Gelirsen... şey, yüzde beşten fazla veririz.\"", en: "The girl holds out the flashlight to you, then changes her mind and pockets it. \"We found a Gate in {yer:eski_sehir},\" she says. \"Inside the old bathhouse. If you came along... uh, we'd give you more than five percent.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gülümse ve yürü", en: "Smile and walk off" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"

  # ================================================================== MENDİREKTEKİ ÇATLAK (taşmadan önce)
  - id: "kordon_kapi_catlagi"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 50, max: 79 }
    agirlik: 6
    etiketler: ["kapi", "kordon", "ahlak", "gizem"]
    gerilim: 3
    onemli: true
    kart: { tr: "Mendirekteki çatlak", en: "The crack on the jetty" }
    sahne: "catlak_1"
    sahneler:
      - id: "catlak_1"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon|in} palmiyeleri hâlâ ayakta ama kafeler artık kafe değil: masalar duvara dayanmış, sandalyelerin üstüne şilteler serilmiş. İnsanlar deniz manzaralı yatakhanelerde uyuyor; denizden kopmaya gönülleri yok.", en: "The cherry trees along {yer:kordon} are still standing, but the cafés aren't cafés anymore. The tables are pushed against the walls and there are mattresses spread across the chairs. People sleep in dormitories with an ocean view. They don't want to give up the water." }
          - { tr: "Mendireğin ucunda, eski fenerin dibinde bir kapı açılmış. İlk gün E kademesindeydi; bugün kenarları D'ye doğru titreşiyor. Dalgalar ona doğru değil, ondan uzağa, açık denize doğru kırılıyor.", en: "Out at the end of the jetty, at the foot of the old lighthouse, a Gate has opened. On the first day it was E grade. Today its edges are flickering toward D. The waves don't break toward it. They break back away from it, out to sea." }
          - { tr: "Mendireğin başında üç kişi tartışıyor. Lonca'dan bir avcı: \"Takvimde yok, sıradan bir kapı.\" Konsey'den bir kadın: \"{yer:kordon|i} boşaltın.\" Ağ'dan gelense ağzını açmıyor; elindeki cihazın iğnesi kırmızıda titreyip duruyor.", en: "Three people are arguing at the base of the jetty. A Guild hunter: \"It's not on any schedule. Just a regular Gate.\" A woman from the Council: \"Clear {yer:kordon}.\" Somebody from the Network says nothing at all. The needle on the gadget in their hand is shaking in the red." }
          - metin: { tr: "Öğleden sonra Kule'nin gölgesi mendireğe kadar uzanıyor; gölge üstüne düştüğü an kapı derin bir nefes alır gibi bir kez kabarıyor.", en: "In the afternoon the Spire's shadow stretches all the way out to the jetty, and the moment it falls across the Gate, the Gate swells once, like a deep breath." }
            kosul: { bayrak: "kule_acik" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Kapının kenarlarında, yalnız senin görebildiğin incecik bir yazı saat kadranı gibi dönüyor. Gösterdiği rakamlar değil, günler.", en: "Around the edges of the Gate, thin enough that only you can see it, there's writing turning like the face of a clock. Not numbers. Days." }
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Kafelerdekilerin yarısı balıkçı aileleri. Denizi bırakırlarsa ne yiyeceklerini bilmiyorlar; onları korkutan kapı değil, açlık.", en: "Half the people in those cafés are fishing families. If they leave the water, they don't know what they'll eat. They're not scared of the Gate. They're scared of going hungry." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u kapı... takvime bağlı. ben takvimleri sevmem. takvimi kim yazdıysa sonunu da o yazmıştır.", en: "t̷his gate's... on a schedule. i don't like schedules. whoever wrote the calendar already wrote the ending." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"{yer:kordon|de} büyüdüm sayılır. İlk sigaramı şu bankta içtim. Yıkılmasına göz yumma.\"", en: "\"I basically grew up on {yer:kordon}. Smoked my first cigarette on that bench. Don't let it go under.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Ölçümler kararsız. Yok, yanlış söyledim: ölçümler fazla kararlı. Biri bunu ayarlamış.\"", en: "\"The readings aren't stable. No, wait, that's wrong. They're too stable. Somebody set this.\"" }
        secenekler:
          - id: "dokun"
            etiket: { tr: "Mendireğin ucuna yürü, kapıya dokun", en: "Walk out to the end of the jetty. Touch the Gate" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "Taşmadan önce {yer:kordon|de} kapıya dokundun; Sistem sana taşmanın tarihini söyledi.", en: "You touched {yer:kordon} Gate before it broke, and the System told you the date." }
            sonraki: "catlak_muhur"
          - id: "tahliye"
            etiket: { tr: "{yer:kordon|i} boşaltmaya başla, kapı kapı dolaş", en: "Start clearing {yer:kordon}. Door to door" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "{yer:kordon|de} kapı kapı dolaşıp insanlara, taşma gelmeden gitmeleri için yalvardın.", en: "Before the gate break you went door to door down {yer:kordon}, begging people to leave." }
            sonraki: "catlak_tahliye"
          - id: "barikat"
            etiket: { tr: "Mendireğin başına barikat ve tuzak kur", en: "Barricade and trap the base of the jetty" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
            kronik: { tr: "{yer:kordon|i} boşaltmadın; onun yerine mendireği tahkim ettin.", en: "Before the gate break, instead of clearing {yer:kordon}, you fortified the jetty." }
            sonraki: "catlak_barikat"
          - id: "olcum"
            etiket: { tr: "Ağ'ın cihazını kapının ağzına kadar taşı", en: "Carry the Network's gadget right up to the Gate" }
            goster: { itibar_min: { sessiz_ag: 10 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 3, saygi: 3 } }
              - bilgi: "tasma_takvimi"
              - tohum: { olay: "kordon_fener_frekansi", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Mendirekteki çatlağın başında {fraksiyon:sessiz_ag} da seninle aynı şeyi duymuş.", en: "At the crack in the breakwater, {fraksiyon:sessiz_ag} heard the same thing you did." } }
            kronik: { tr: "Sessiz Ağ'ın cihazını kapının ağzına kadar götürdün; iğne bir tarihin üstünde durdu.", en: "You carried the Quiet Network's gadget up to the mouth of the Gate before it broke, and the needle stopped on a date." }
            sonraki: "catlak_muhur"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "{yer:kordon|in} kaderi senin işin değil", en: "The Esplanade isn't your problem" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -4, insanlik: -2 }
            kronik: { tr: "{yer:kordon|de} kapının büyüdüğünü gördün, arkanı dönüp gittin.", en: "You watched {yer:kordon} Gate grow and turned your back." }
            sonraki: "@akis"

      - id: "catlak_muhur"
        yer: "kordon"
        paragraflar:
          - { tr: "Mendireğin ucunda rüzgâr tersine, denizden karaya değil karadan denize esiyor. Elini kapının yüzeyine koyuyorsun: cam gibi soğuk ve kapalı. Ne kadar bastırsan da elin içeri geçmiyor.", en: "At the end of the jetty the wind blows backward, from land out to sea. You lay your hand on the face of the Gate. It's like glass, cold and shut. No matter how hard you push, your hand doesn't go in." }
          - { tr: "Şimdiye dek hiçbir kapı seni geri çevirmemişti. İlk kez oluyor.", en: "No Gate has ever turned you away before. This is the first." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[Kapı mühürlü]", en: "[Gate sealed]" }
            satirlar:
              - { tr: "Açılış: Gün 80. Taşma takvimi değiştirilemez.", en: "Opens: Day 80. Break schedule cannot be modified." }
              - { tr: "Değerlendirme aşaması 2/5. Lütfen bekleyiniz.", en: "Assessment phase 2 of 5. Please stand by." }
        sezgiler:
          - kosul: { stat: { int: 40 } }
            metin: { tr: "\"Değiştirilemez\" demiyor, \"değiştirilemez diye yazıldı\" diyor. Kimse yazmadıkça hiçbir kural kural olmaz.", en: "It doesn't say it can't be changed. It says it has been written as unchangeable. Rules don't exist until somebody writes them." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷eş aşama. bize ikincisini gösterdiler. beşincide ne olduğunu sormayacak mısın? sorma. daha değil.", en: "f̷ive phases. they showed us the second one. aren't you going to ask what happens in the fifth? don't. not yet." }
        secenekler:
          - id: "zorla"
            tur: "gosteris"
            etiket: { tr: "Mührü yumrukla, Sistem sesini duysun", en: "Punch the seal. Make the System hear you" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 6
              - ahlak: { duzen: -4, insanlik: 2 }
              - bilgi: "tasma_takvimi"
              - bayrak: "kordon_muhur_yumruklandi"
            kronik: { tr: "{yer:kordon|de} kapının mührüne yumruk indirdin. Mühür kırılmadı ama Sistem o gün adını bir yere not etti.", en: "You punched the seal on {yer:kordon} Gate. It didn't break, but that day the System wrote your name down somewhere." }
            sonraki: "catlak_yumruk"
          - id: "not"
            etiket: { tr: "Tarihi not et, {yer:kordon|e} dön", en: "Note the date. Head back up {yer:kordon}" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "tasma_takvimi"
            kronik: { tr: "Taşma gününü bir kâğıda yazıp {yer:kordon|e} döndün.", en: "You wrote the day of the break on a scrap of paper and headed back up {yer:kordon}." }
            sonraki: "catlak_son"
          - id: "duyur"
            tur: "aciga_vur"
            etiket: { tr: "Tarihi {yer:kordon|de} herkese duyur", en: "Announce the date to the whole Esplanade" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 3, duzen: 2 }
              - bilgi: "tasma_takvimi"
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "kordon_tahliye"
              - itibar: { siginak: 3, sessiz_ag: 3 }
            kronik: { tr: "{yer:kordon|de} kapının taşacağı günü herkese açık açık duyurdun; o sabah pek çok kişi bavulunu topladı.", en: "You announced to everyone, straight out, which day the Gate on {yer:kordon} would break, and that morning a lot of people packed a bag." }
            sonraki: "catlak_son"

      - id: "catlak_yumruk"
        yer: "kordon"
        paragraflar:
          - { tr: "Yumruğun mühre iner inmez bütün mendirek titriyor. Fenerin camları çatlıyor, dalgalar bir an duruyor; kapının yüzeyine örümcek ağı gibi beyaz çizgiler yayılıyor, sonra ağır ağır kendiliğinden kapanıyorlar.", en: "Your fist hits the seal and the whole jetty shudders. The lighthouse glass cracks, the waves stop for a heartbeat, white lines spread across the face of the Gate like a spiderweb. Then, slowly, they seal themselves back up." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Yetkisiz müdahale kaydedildi]", en: "[Unauthorized interference logged]" }
            satirlar:
              - { tr: "Kullanıcı işaretlendi. Değerlendirme notunuza eklendi.", en: "User flagged. This has been added to your assessment notes." }
          - tur: "yanki"
            baslik: { tr: "[h̷aha]", en: "[h̷aha]" }
            satirlar:
              - { tr: "onlar seni not alıyor. ben de onları not alıyorum.", en: "they're taking notes on you. i'm taking notes on them." }
        secenekler:
          - id: "don"
            etiket: { tr: "{yer:kordon|e} dön, vakit az", en: "Head back up {yer:kordon}. Not much time" }
            etkiler:
              - ahlak: { merhamet: 1 }
            kronik: { tr: "Sistem'in değiştirilemez dediği bir mührü bir anlığına da olsa çatlattın.", en: "You cracked a seal the System called unchangeable, even if only for a second." }
            sonraki: "catlak_son"

      - id: "catlak_tahliye"
        yer: "kordon"
        paragraflar:
          - { tr: "Bütün gün kafe kafe dolaşıyorsun. Kimi seni dinleyip çantasını topluyor; çoğuysa kibar kibar çay ikram edip yerinden kıpırdamıyor.", en: "You walk from café to café all day. Some people listen and pack their bags. Most politely pour you a cup of coffee and don't budge." }
          - { tr: "Mendireğe en yakın kafede yaşlı bir balıkçı ağ örüyor. \"Altmış yıldır bu denize bakıyorum,\" diyor. \"Bir kapı yüzünden sırtımı mı döneceğim?\"", en: "In the café closest to the jetty, an old fisherman is mending a net. \"Sixty years I've been looking at this water,\" he says. \"I'm supposed to turn my back on it because of a Gate?\"" }
          - metin: { tr: "Kafelerin birinde duvara gazete kâğıdından kesilmiş bir fotoğraf iliştirilmiş: vapuru omzunla kaldırdığın an. Altına biri yazmış: \"O dediyse gideriz.\"", en: "In one café there's a photo cut out of a newsletter taped to the wall: the moment you lifted the ferry with your shoulder. Someone's written under it: IF THEY SAY GO, WE GO." }
            kosul: { bayrak: "vapur_dogrultuldu" }
        secenekler:
          - id: "ikna"
            etiket: { tr: "Balıkçının yanına otur, ağını birlikte örün", en: "Sit with the fisherman. Mend the net with him" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "kordon_tahliye"
              - bayrak: "kordon_balikci_ikna"
              - gun: 1
            kronik: { tr: "{yer:kordon|in} en yaşlı balıkçısıyla bütün gün ağ ördün; ertesi sabah kafe toptan onunla birlikte taşındı.", en: "You spent a day mending nets with the oldest fisherman on {yer:kordon}, and the next morning the whole café moved out with him." }
            sonraki: "catlak_son"
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni göster, seni dinlesinler", en: "Show them your true level. Make them listen" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, merhamet: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "kordon_tahliye"
            kronik: { tr: "Gerçek seviyeni gösterip {yer:kordon|in} insanlarını gitmeye ikna ettin; korkudan da olsa gittiler.", en: "You got {yer:kordon} to move by showing them your true level. They went, even if it was fear that moved them." }
            sonraki: "catlak_son"
          - id: "zorla"
            etiket: { tr: "Dinlemeyenleri zorla çıkar", en: "Drag out the ones who won't listen" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2, insanlik: -2 }
              - degisken: { hayatta_kalan: 4 }
              - itibar: { siginak: -2, lonca: 3 }
              - bayrak: "kordon_tahliye"
              - bayrak: "kordon_zorla_tahliye"
            kronik: { tr: "{yer:kordon|den} gitmek istemeyenleri dinlemedin; kollarından tutup zorla çıkardın.", en: "When people wouldn't leave {yer:kordon}, you didn't argue. You took them by the arms and hauled them out." }
            sonraki: "catlak_son"
          - id: "birak"
            etiket: { tr: "İsteyen kalsın, karar onların", en: "Let anyone who wants to stay, stay. Their choice" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "kordon_tahliye"
            kronik: { tr: "{yer:kordon|de} kalmak isteyenlere karışmadın; o gece kafelerin ışıkları her zamanki gibi yanıyordu.", en: "You left the people who wanted to stay on {yer:kordon} alone, and that night the café lights were on as usual." }
            sonraki: "catlak_son"

      - id: "catlak_barikat"
        yer: "kordon"
        paragraflar:
          - { tr: "Lonca avcılarıyla birlikte mendireğin başına beton bloklar diziyorsun; yanlarına kafelerden sökülmüş kepenkler, devrilmiş bir kamyon, palmiyelerin arasına gerilmiş zincirler ekleniyor.", en: "You and the Guild hunters line the base of the jetty with concrete blocks: shutters torn off the cafés, an overturned truck, chains strung between the cherry trees." }
          - { tr: "Akşam olduğunda {yer:kordon} kaleye dönmüş. Kafelerdekiler barikatın ardında güvende olduklarını düşünerek yatıyor. Barikatın asıl kimi içeride tuttuğunu onlara söyleyen yok.", en: "By evening {yer:kordon} looks like a fortress. The people in the cafés go to bed thinking they're safe behind the barricade. Nobody tells them who the barricade is keeping in." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Barikatı denetle, nöbet çizelgesi yaz", en: "Inspect the line. Write up a watch rotation" }
            etkiler:
              - ahlak: { duzen: 3 }
              - bayrak: "kordon_barikat"
              - itibar: { lonca: 3 }
            kronik: { tr: "Taşma gelmeden {yer:kordon|e} bir savunma hattıyla bir nöbet çizelgesi bıraktın.", en: "Before the gate break, you left {yer:kordon} a defensive line and a watch rotation." }
            sonraki: "catlak_son"
          - id: "ikisi"
            etiket: { tr: "Barikatın arkasına bir de kaçış yolu aç", en: "Cut an escape route behind the barricade too" }
            gerekli: { stat: { int: 30 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 3 }
              - bayrak: "kordon_barikat"
              - bayrak: "kordon_tahliye"
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "{yer:kordon|e} bir barikat bıraktın, barikatın arkasına da bir kaçış yolu açtın.", en: "You left {yer:kordon} a barricade, and behind it you cut an escape route." }
            sonraki: "catlak_son"

      - id: "catlak_son"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Ertesi sabah {yer:kordon|in} yarısı bomboş. Kafelerin önünde bırakılan sandalyeler, sahipleri birazdan dönecekmiş gibi denize dönük duruyor.", en: "The next morning half {yer:kordon} is empty. The chairs left outside the cafés face the water, like their owners will be right back." }
            kosul: { bayrak: "kordon_tahliye" }
          - metin: { tr: "Ertesi sabah {yer:kordon} her zamanki hâlinde: çay bardakları, ağlar, palmiyelerin arasında koşuşan çocuklar. Yalnız barikatın gölgesi kumsala kadar uzanıyor.", en: "The next morning {yer:kordon} looks like any other: coffee cups, nets, kids playing under the cherry trees. The shadow of the barricade reaches all the way to the beach." }
            kosul: { bayrak: "kordon_barikat", bayrak_yok: "kordon_tahliye" }
          - metin: { tr: "Ertesi sabah {yer:kordon|de} hayat her zamanki gibi akıyor. Kapının tarihini bilen bir tek sensin ve o tarih değişmiyor.", en: "The next morning {yer:kordon} looks like any other. You're the only one who knows the date on that Gate, and the date doesn't change." }
            kosul: { bayrak_yok: ["kordon_tahliye", "kordon_barikat"] }
          - { tr: "Mendireğin ucunda kapı nefes alıp veriyor; dalgalar hâlâ ters yöne kırılıyor.", en: "Out at the end of the jetty, the Gate breathes in and out. The waves still break the wrong way." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "{yer:kordon|den} ayrıl", en: "Leave {yer:kordon}" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 35
              - tohum: { olay: "kordon_fener_baligi", gecikme: { min: 2, max: 6 }, kosul: { bayrak_yok: "fenerci_olduruldu" }, hatirlatma: { tr: "Mendirekteki çatlaktan beri {yer:kordon|in} geceleri sakin değil.", en: "Since the crack in the breakwater, nights on {yer:kordon} haven't been quiet." } }
            kronik: { tr: "{yer:kordon|i} taşmaya kendi bildiğin gibi hazırladın, sonra arkanda bıraktın.", en: "You got {yer:kordon} ready for the break your own way, and then you left." }
            sonraki: "@akis"

  # ================================================================== FENER BALIĞI ANA (keşif, boss)
  - id: "kordon_fener_baligi"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 36, max: 180 }
    kosul: { bayrak_yok: "fenerci_olduruldu" }
    agirlik: 4
    etiketler: ["kesif", "deniz", "kordon", "boss"]
    gerilim: 4
    kart: { tr: "Mendireğin ötesindeki ışık", en: "The light past the jetty" }
    sahne: "fenerci_1"
    sahneler:
      - id: "fenerci_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece yarısı {yer:kordon|in} taş rıhtımında siyahlara bürünmüş altı kadın oturmuş, gözlerini denize dikmiş. Açıkta, mendireğin çok ötesinde, eski fenerinkine benzeyen bir ışık yanıp sönüyor; oysa fener karanlık.", en: "At midnight, six women in black sit on the stone seawall of {yer:kordon}, eyes on the water. Way out past the jetty, a light like the old lighthouse beam pulses on and off. The lighthouse itself is dark." }
          - { tr: "\"O ışığa giden kayıklar geri dönmüyor,\" diyor içlerinden biri. \"Kocam, kardeşim, şunun iki oğlu.\" Rıhtımın ucunda on altı yaşında bir oğlan, ağlarını küreğin üstüne yığmış, sandalını suya itiyor.", en: "\"The boats that go out to that light don't come back,\" one says. \"My husband, my brother, her two boys.\" At the end of the seawall a sixteen-year-old is shoving a rowboat into the water, nets piled on one of the oars." }
          - { tr: "\"Evde dört kişiyiz,\" diyor oğlan yüzüne bakmadan. \"Lonca'nın tayınında sıra bize hiç gelmiyor. Işık hep orada, balık da orada.\"", en: "\"There's four of us at home,\" the kid says without looking at you. \"We never make it to the front of the Guild's ration line. The light's always out there. So are the fish.\"" }
          - metin: { tr: "{yer:kordon} düştüğünden beri bu rıhtım canavar bölgesinin kıyısında kaldı. Sandalı suya itmeden önce oğlanın bir kıskaç kabuğunu tekmeyle kenara itmesi gerekiyor.", en: "Ever since {yer:kordon} fell, this seawall's been on the edge of the monster zone. Before he can push the boat out he has to kick a claw shell out of the way." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Işık sallanıyor; oysa fener ışığı sallanmaz. Bu ışık suyun altından yükselen bir sapın ucunda asılı duruyor ve sap nefes alıyor.", en: "The light sways. Lighthouse beams don't sway. This one's dangling off the end of a stalk rising out of the water, and the stalk is breathing." }
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Altı kadından biri ağlamıyor. Işığa bakışında öfke değil, özlem var; kocasının hâlâ o ışığın altında olduğunu düşünüyor.", en: "One of the six women isn't crying. The way she looks at that light isn't anger. It's longing. She thinks her husband's still somewhere under it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ ışık bir yalan. ben yalanı görünce tanırım. iyi bir yalan ama; tanıdık bir şeyin kılığına girmiş.", en: "t̷hat light is a lie. i know lies. it's a good one. it took the shape of something familiar." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Oğlanı yalnız bırakma. Bir kere bırakırsak hep bırakırız.\"", en: "\"Don't let that kid go alone. Leave one person once and you leave them forever.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dört kişilik bir evin tek geliri bir sandal. Bunu Konsey'e götüreceğim. Ama önce oğlanı geri getir.\"", en: "\"One rowboat feeding a house of four. I'm taking this to the Council. But get that kid back first.\"" }
        secenekler:
          - id: "sandal"
            etiket: { tr: "Oğlanın sandalına bin, birlikte gidin", en: "Climb into the kid's boat. Go together" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - gorev: { fenerciyi_avla: "basla" }
            sonraki: "fenerci_sandal"
          - id: "yuz"
            tur: "gosteris"
            etiket: { tr: "Ceketini çıkar, ışığa kadar yüz", en: "Take off your jacket. Swim out to the light" }
            gerekli: { stat: { end: 50 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, duzen: -1 }
              - gorev: { fenerciyi_avla: "basla" }
            sonraki: "fenerci_yuzus"
          - id: "durdur"
            etiket: { tr: "Oğlanı durdur, bu gece evine erzak götür", en: "Stop the kid. Bring food home for him tonight" }
            gerekli: { oz_kristali_min: 1 }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - oz_kristali: -1
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "kordon_fener_baligi", gecikme: { min: 4, max: 8 }, hatirlatma: { tr: "Mendireğin ötesindeki ışık yeniden yanıyor.", en: "The light past the breakwater is burning again." } }
            sonraki: "fenerci_ev"
          - id: "lonca"
            etiket: { tr: "Lonca'dan bir motorbot iste", en: "Ask the Guild for a motor launch" }
            goster: { itibar_min: { lonca: 15 } }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - gorev: { fenerciyi_avla: "basla" }
            sonraki: "fenerci_motor"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Yürüyüp geç, herkesin denizi kendine", en: "Keep walking. Everybody's got their own sea" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -3 }
            sonraki: "@akis"

      - id: "fenerci_ev"
        yer: "kordon"
        paragraflar:
          - { tr: "Oğlanın sandalını rıhtıma geri çekip onu kolundan tuttuğun gibi evine kadar götürüyorsun. Kapıyı küçük bir kız açıyor; arkasında iki çocuk daha, bir de yatalak bir anne.", en: "You drag the kid's boat back onto the seawall and walk him home by the arm. A little girl opens the door, two more kids behind her, and a mother who can't get out of bed." }
          - { tr: "Getirdiğin erzakı masaya bırakıyorsun. Oğlan bir süre sana, sonra pencereden ışığa bakıp \"Yarın yine orada olacak,\" diyor.", en: "You set the food you brought on the table. The kid looks at you for a while, then out the window at the light. \"It'll be out there again tomorrow,\" he says." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Yarın ben de orada olacağım.\"", en: "\"So will I.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
            sonraki: "@akis"

      - id: "fenerci_motor"
        yer: "kordon"
        paragraflar:
          - { tr: "Lonca'nın motorbotu yarım saatte geliyor: dümende turuncu kol bantlı bir avcı, pruvada bir projektör. Oğlan da ağlarıyla birlikte tekneye atlıyor, kimse onu indirmeye kalkmıyor.", en: "The Guild's launch shows up in half an hour: a hunter in an orange armband at the wheel, a spotlight on the bow. The kid jumps in too, nets and all. Nobody tries to make him get off." }
          - { tr: "Mendireği geçtiğiniz anda projektör sönüveriyor. Avcı düğmeye bir basıyor, bir daha basıyor ama nafile. İlerideki ışıksa daha da parlıyor; sanki size yol gösteriyor.", en: "The second you clear the jetty, the spotlight dies. The hunter flips the switch, flips it again. The light up ahead burns brighter, like it's showing you the way." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Pruvaya geç, ışığı sen gözle", en: "Get up on the bow. You watch the light" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "fenerci_karsilasma"

      - id: "fenerci_sandal"
        yer: "kordon"
        paragraflar:
          - { tr: "Oğlan küreklere asılıyor, sen pruvada oturuyorsun. Mendireği geçer geçmez deniz bir anda duruluyor: ne dalga var ne rüzgâr, yalnızca önünüzde yanıp sönen o ışık.", en: "The kid leans into the oars and you sit in the bow. Once you clear the jetty, the sea goes dead still. No swells, no wind. Just that light pulsing ahead of you." }
          - { tr: "Oğlanın gözleri donuklaşıyor. Kürekleri bırakıp ayağa kalkıyor ve ışığa doğru, sandalın kenarına, suya doğru bir adım atıyor.", en: "The kid's eyes go blank. He lets go of the oars, stands up and takes a step toward the light. Toward the edge of the boat. Toward the water." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Onu yakala, gözlerini kapat", en: "Grab him. Cover his eyes" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { yanki: { saygi: 1 } }
            sonraki: "fenerci_karsilasma"

      - id: "fenerci_yuzus"
        yer: "kordon"
        paragraflar:
          - { tr: "Ceketini rıhtıma bırakıp suya giriyorsun; altı kadın ayağa kalkıyor. Kulaç kulaç ilerlerken su bu gece sana bir sokak kadar düz geliyor.", en: "You leave your jacket on the seawall and walk into the water. The six women stand up. You go stroke after stroke, and tonight the water feels as flat as a street." }
          - { tr: "Mendireği geçince ışık sana dönüyor. Yalanına kılık olacak tanıdık bir şey arıyor ve buluyor: akşam vapurunun ışıkları, korkuluğu, martılar. Bir an oraya yüzmek istiyorsun.", en: "Past the jetty, the light turns toward you. It goes looking for something familiar to lie with, and finds it: the evening ferry's running lights, the railing, the gulls. For a second you want to swim there." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "h̷ayır. o vapur iskelede duruyor artık. bu onun hayaleti değil, kılığını çalmış bir ağız.", en: "n̷o. that ferry's back at the terminal. this isn't its ghost. it's a mouth wearing its shape." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Işığın altına dal", en: "Dive under the light" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "fenerci_karsilasma"

      - id: "fenerci_karsilasma"
        yer: "kordon"
        paragraflar:
          - { tr: "Işığın altında su yarılıyor, bir göz yükseliyor: vapur lombozu büyüklüğünde, solgun, sulu. Ardından ağız beliriyor; rıhtım genişliğinde, içinde batık kayıkların küpeşteleri diş gibi dizilmiş.", en: "Under the light the water opens and an eye comes up, big as a ferry porthole, pale and wet. Then the mouth: as wide as the seawall, with the gunwales of sunken boats lined up inside it like teeth." }
          - { tr: "Işık alnından uzanan bir sapın ucunda sallanıyor. Fener Balığı Ana bu. {yer:kordon|in} yitirdiği bütün kayıklar onun karnında.", en: "The light hangs off the end of a stalk growing out of its forehead. The Lamplighter. Every boat {yer:kordon} ever lost is inside it." }
        bildirimler:
          - tur: "analiz"
            nadirlik: "epik"
            baslik: { tr: "Fener Balığı Ana", en: "The Lamplighter" }
            satirlar:
              - { tr: "Boss · Sığ sular · Yuva koruyor", en: "Boss · Shallows · Guarding a nest" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sapı kopar, ışığı söndür", en: "Rip off the stalk. Kill the light" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - savas: { dusmanlar: ["fenerci_ana@oyuncu"], ortam: ["su", "karanlik"], kazan: "fenerci_zafer", kaybet: "fenerci_kayip", kac: "fenerci_kayip" }

      - id: "fenerci_kayip"
        yer: "kordon"
        paragraflar:
          - { tr: "Ağız kapanınca dünya tuzlu, sıcak, karanlık bir şeye dönüşüyor. Bir küpeşteye, ardından bir başkasına tutunuyorsun; sonunda dişlerin arasında bir aralık bulup kendini dışarı, suya, havaya fırlatıyorsun.", en: "The mouth closes and the world turns salty and hot and dark. You grab a gunwale, then another one, then find a gap between the teeth and throw yourself out into the water, into the air." }
          - { tr: "Işık acele etmeden, sabırla uzaklaşıyor. Rıhtıma nasıl döndüğün aklında değil. Altı kadından biri tek söz etmeden omzuna bir battaniye örtüyor.", en: "The light drifts away. Not in a hurry. Patiently. You don't remember how you got back to the seawall. One of the six women puts a blanket around you and doesn't say a thing." }
        secenekler:
          - id: "yine"
            etiket: { tr: "Soluklan, yeniden gir", en: "Catch your breath. Go back in" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["fenerci_ana@oyuncu-12%"], ortam: ["su"], kazan: "fenerci_zafer", kaybet: "fenerci_cekil", kac: "fenerci_cekil" }
          - id: "cekil"
            etiket: { tr: "Bu gece değil", en: "Not tonight" }
            etkiler:
              - can: 15
              - gorev: { fenerciyi_avla: "basarisiz" }
            sonraki: "fenerci_cekil"

      - id: "fenerci_cekil"
        yer: "kordon"
        paragraflar:
          - { tr: "Rıhtımda battaniyeye sarınmış oturuyorsun. Açıkta ışık yanıp sönmeyi sürdürüyor. Oğlanın sandalı rıhtıma bağlı; hiç değilse bu gece.", en: "You sit on the seawall wrapped in a blanket. Out on the water the light keeps pulsing. The kid's boat is tied up at the wall. For tonight, at least." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalk", en: "Get up" }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "fenerci_zafer"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Sapı kökünden koparınca ışık avucunun içinde sönüyor. Dev gövde bir kez kasılıp ağır ağır yan dönüyor; karnı havada, ay ışığında solgun bir ada gibi.", en: "You tear the stalk out at the root and the light dies in your hand. The huge body clenches once, then rolls slowly onto its side, belly-up, a pale island in the moonlight." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Dövüş seni iki kez suyun dibine çekiyor ama üçüncüsünde sapı kökünden söküyorsun. Işık avucunda sönüyor; gövde ters dönüp karnı havada, ay ışığında solgun bir ada gibi yüzmeye başlıyor.", en: "The fight drags you down to the bottom twice, but the third time you rip the stalk out by the root. The light dies in your hand. The body rolls belly-up and floats like a pale island in the moonlight." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Ağzından kayıklar dökülüyor: kırık küpeşteler, ağlar, bir kürek. Mendireğin dibinde, suyun altındaysa ışıkla dolu yüzlerce küçük yumurta parlıyor; her biri minicik bir fener gibi.", en: "Boats spill out of its mouth: broken gunwales, nets, an oar. And at the foot of the jetty, under the water, hundreds of little eggs glow, each one full of light, each one a tiny lighthouse." }
          - { tr: "Rıhtımdaki altı kadın kıyıya inmiş. İçlerinden biri dizlerine kadar suya girip bir küreği çekip alıyor: üstünde kocasının oyduğu harfler duruyor.", en: "The six women have come down to the shore. One of them wades in up to her knees and pulls out an oar. Her husband's initials are carved into it." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "epik"
            baslik: { tr: "[Unvan kazanıldı: Fener Söndüren]", en: "[Title earned: Lightbreaker]" }
            satirlar:
              - { tr: "{yer:kordon|in} ışığı artık yalan söylemiyor.", en: "The Esplanade's light doesn't lie anymore." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Yumurtaların ışığı annelerininki gibi sallanmıyor; sabit, sıcak, sana dönük. Henüz doğmamış bir şey seni ilk kez görüyor.", en: "The eggs' light doesn't sway like their mother's did. It's steady and warm and turned toward you. Something not born yet is seeing you for the first time." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "y̷umurtalar seni annelerinin katili diye değil, ilk gördükleri şey diye hatırlayacak. arada çok fark var.", en: "t̷hose eggs won't remember you as the thing that killed their mother. they'll remember you as the first thing they saw. that's very different." }
        secenekler:
          - id: "ez"
            etiket: { tr: "Yumurtaları tek tek ez, körfez temiz kalsın", en: "Crush the eggs one by one. Keep the sound clean" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 3 }
              - itibar: { lonca: 3 }
              - bayrak: "fenerci_olduruldu"
              - bayrak: "fener_yumurtalar_ezildi"
              - gorev: { fenerciyi_avla: "tamam" }
              - unvan: "fenerci_avcisi"
              - esya: { fener_incisi: 1 }
              - xp_seviye: 80
            sonraki: "fenerci_son"
          - id: "birak"
            etiket: { tr: "Yumurtalara dokunma", en: "Leave the eggs alone" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - bayrak: "fenerci_olduruldu"
              - bayrak: "fener_yumurtalar_birakildi"
              - gorev: { fenerciyi_avla: "tamam" }
              - unvan: "fenerci_avcisi"
              - esya: { fener_incisi: 1 }
              - efsane: "canavari_bagisladi"
              - xp_seviye: 80
              - tohum: { olay: "fener_yavrulari", gecikme: { min: 6, max: 12 }, hatirlatma: { tr: "Mendireğin ötesindeki ışıktan geriye bir şey kaldı.", en: "That light past the breakwater left something behind." } }
            sonraki: "fenerci_son"
          - id: "al"
            etiket: { tr: "Bir avuç yumurtayı ceketine sarıp al", en: "Wrap a handful of eggs in your jacket. Take them" }
            goster: { stat: { per: 35 } }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: 1 }
              - bayrak: "fenerci_olduruldu"
              - bayrak: "fener_yumurtalar_alindi"
              - gorev: { fenerciyi_avla: "tamam" }
              - unvan: "fenerci_avcisi"
              - esya: { fener_incisi: 1 }
              - xp_seviye: 80
              - tohum: { olay: "fener_yavrulari", gecikme: { min: 4, max: 8 }, hatirlatma: { tr: "Mendireğin ötesindeki ışıktan geriye bir şey kaldı.", en: "That light past the breakwater left something behind." } }
            sonraki: "fenerci_son"

      - id: "fenerci_son"
        yer: "kordon"
        paragraflar:
          - { tr: "Kıyıya döndüğünde rıhtıma kalabalık toplanmış; ışık söndüğü için değil, gerçek fener yandığı için. Biri yıllardır kilitli duran kapıyı kırıp eski feneri yakmış. Bu kez ışık sallanmıyor.", en: "When you get back to shore there's a crowd on the seawall. Not because the light went out. Because the real lighthouse is lit. Somebody broke the lock that's been on its door for years and lit the old lamp. This time the beam doesn't sway." }
          - metin: { tr: "Sandallı oğlan ağlarını rıhtıma seriyor; ağlar balıkla dolu. Dört kişilik bir ev bu gece karnını doyuracak.", en: "The kid from the rowboat spreads his nets out on the seawall, and they're full of fish. A house of four eats tonight." }
            kosul: { bayrak_yok: "fener_yumurtalar_alindi" }
          - metin: { tr: "Ceketinin içindeki yumurtalar sıcacık ve hafif. Biri kıpırdıyor.", en: "Inside your jacket, the eggs are warm and light. One of them moves." }
            kosul: { bayrak: "fener_yumurtalar_alindi" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Rıhtımda kurumaya otur", en: "Sit on the seawall and dry off" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { elif_sari: { saygi: 2 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ fener yavruları (tohum)
  - id: "fener_yavrulari"
    konum: ["kordon"]
    perde: [2]
    agirlik: 1
    etiketler: ["deniz", "kordon", "ordu"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Küçük fenerler", en: "Little lighthouses" }
    sahne: "yavru_1"
    sahneler:
      - id: "yavru_1"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "{yer:kordon|den} bir balıkçı kadın şehrin neresinde olursan ol seni bulup geliyor. \"Geceleri kayıkların ardında ışıklar var,\" diyor. \"Küçük küçük ışıklar. Peşimizden geliyorlar. Kimseye dokunmuyorlar ama... hep senin geçtiğin yerlere bakıyorlar.\"", en: "A fisherwoman from {yer:kordon} finds you wherever you are in the city. \"There are lights following the boats at night,\" she says. \"Little ones. They don't touch anybody, but... they keep looking where you've been.\"" }
            kosul: { bayrak: "fener_yumurtalar_birakildi" }
          - metin: { tr: "Bir sabah uyandığında çantanı boş ve ıslak buluyorsun. Yumurtalar açılmış; kabukları bir patika gibi kapıdan dışarı, denize doğru dizilmiş.", en: "One morning you wake up to find your pack empty and wet. The eggs have hatched, and the shells are laid out like a trail from your door down toward the water." }
            kosul: { bayrak: "fener_yumurtalar_alindi" }
          - { tr: "Rıhtıma indiğinde onları görüyorsun: kedi büyüklüğünde, yarı saydam, alınlarında birer küçük ışık sallanan bir düzine yavru. Sana doğru yüzerlerken ışıkları köpek kuyruğu gibi sallanıyor.", en: "When you get down to the seawall you see them: a dozen hatchlings the size of cats, half see-through, each with a little light bobbing on its forehead. They swim toward you, and their lights wag like a dog's tail." }
          - { tr: "Rıhtımın öbür ucunda Lonca'dan üç avcı zıpkınlarını hazırlıyor. \"Bölge kuralı,\" diyor içlerinden biri. \"Sur içinde canavar barınmaz.\"", en: "At the far end of the seawall, three Guild hunters are getting their harpoons ready. \"Regional rule,\" one says. \"No monsters inside the walls.\"" }
        sezgiler:
          - kosul: { stat: { cha: 35 } }
            metin: { tr: "Yavrular senden bir ses, bir işaret bekliyor; ne dersen onu yapacaklar. Sana bir bağ sunuyorlar.", en: "The hatchlings are waiting on you. One word, one gesture, and they'll do whatever you say. This is an offer to bond." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "i̷lk ordun. küçük, ıslak, pırıl pırıl. ben de böyle başladım, biliyor musun? birinin peşinden yüzerek.", en: "y̷our first army. small, wet and shiny. that's how i started too, you know. swimming after somebody." }
        secenekler:
          - id: "bagla"
            etiket: { tr: "Onları kendine bağla", en: "Bond them to you" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - ordu: { evcil_canavar: 2 }
              - itibar: { lonca: -3 }
              - iliski: { yanki: { baglilik: 3 } }
              - bayrak: "fener_yavrulari_bagli"
            kronik: { tr: "Öldürdüğün canavarın yavrularını kendine bağladın; yavrular seni annelerinin yerine koydu.", en: "You bonded the hatchlings of the monster you'd killed, and they took you for their mother." }
            sonraki: "yavru_bag"
          - id: "denize"
            etiket: { tr: "Onları açık denize götür ve orada bırak", en: "Lead them out to open sea and leave them there" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - gun: 1
            kronik: { tr: "Fener Balığı Ana'nın yavrularını açık denize götürüp orada salıverdin; ışıkları dalgaların altında birer birer kayboldu.", en: "You led the Lamplighter's hatchlings out to open sea and let them go, and one by one their lights slipped under the swells." }
            sonraki: "yavru_deniz"
          - id: "lonca"
            etiket: { tr: "Kenara çekil, Lonca işini yapsın", en: "Step aside. Let the Guild do its job" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 3 }
              - itibar: { lonca: 3 }
            kronik: { tr: "Sana doğru yüzen yavruların zıpkınlanmasını seyrettin; Lonca'nın kuralı çiğnenmedi.", en: "You watched the hatchlings that swam to you get harpooned, and the Guild's rule was kept." }
            sonraki: "yavru_lonca"

      - id: "yavru_bag"
        yer: "kordon"
        paragraflar:
          - { tr: "Elini suya uzattığında bir düzine küçük ışık birden sana dönüyor. Sistem araya giriyor; kuru, kısa ve biraz şaşkın.", en: "You hold your hand out over the water and a dozen little lights all turn to you at once. The System cuts in, dry, short, a little surprised." }
          - { tr: "Lonca avcıları zıpkınlarını indiriyor. Bölge kuralı canavarlar içindir, sana ait olanlar için değil; hiç değilse bugünlük öyle görünüyor.", en: "The Guild hunters lower their harpoons. The regional rule is about monsters, not things that belong to you. At least, that's how it looks today." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bağ kuruldu: Fener Yavrusu ×12]", en: "[Bond formed: Lamplighter Hatchling ×12]" }
            satirlar:
              - { tr: "Birlik ordunuza eklendi. Bakımı size aittir.", en: "Unit added to your army. Upkeep is your responsibility." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onlara balıkçıların kayıklarını korumayı öğret", en: "Teach them to guard the fishing boats" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 25
            kronik: { tr: "{yer:kordon|in} balıkçı kayıklarına gece bekçisi olarak küçük fenerler verdin.", en: "You gave {yer:kordon|pos} fishing boats a night watch of little lighthouses." }
            sonraki: "@akis"

      - id: "yavru_deniz"
        yer: "kordon"
        paragraflar:
          - { tr: "Bütün gün yüzüyorsun, bir düzine ışık da peşinden geliyor. Körfezin ağzında, açık denizin maviliğinin başladığı yerde sen durunca onlar da duruyor.", en: "You swim all day with a dozen lights trailing you. At the mouth of the sound, where the open blue begins, you stop, and they stop." }
          - { tr: "Derken ışıklar birer birer dalgaların altında kayboluyor. Sonuncusu bir süre yanında oyalanıyor, sonra o da gidiyor.", en: "Then, one by one, their lights slip under the swells. The last one stays with you a while. Then it goes too." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kıyıya dön", en: "Swim back to shore" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - efsane: "canavari_bagisladi"
              - xp_seviye: 25
            kronik: { tr: "Bir canavarın yavrularını denize uğurladın; dönüş yolunda bir kez bile arkana bakmadın.", en: "You saw a monster's young off to sea and never once looked back on the swim home." }
            sonraki: "@akis"

      - id: "yavru_lonca"
        yer: "kordon"
        paragraflar:
          - { tr: "Zıpkınlar suya saplanıyor: bir, iki... on iki. Işıklar birer birer sönüyor; sonuncusu sönmeden önce sana dönüyor.", en: "The harpoons go into the water, one, two, twelve. The lights go out one by one. The last one turns toward you before it does." }
          - { tr: "Avcılardan biri omzuna dokunuyor. \"Doğru olanı yaptın,\" diyor. {yer:kordon|in} balıkçı kadınlarıysa ağızlarını açmıyor.", en: "One of the hunters touches your shoulder. \"You did the right thing,\" he says. The fisherwomen of {yer:kordon} don't say anything." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Rıhtımdan ayrıl", en: "Leave the seawall" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - xp_seviye: 15
            kronik: { tr: "{yer:kordon|de} Lonca'nın kuralına uydun; bir düzine küçük ışığın sönmesine göz yumdun.", en: "On {yer:kordon} you went by the Guild's rule and let a dozen little lights go out." }
            sonraki: "@akis"

  # ================================================================== FENERİN SESİ (Mert)
  - id: "kordon_fener_frekansi"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 40, max: 170 }
    agirlik: 4
    npc: ["mert_kilic"]
    etiketler: ["sessiz_ag", "gizem", "kordon"]
    gerilim: 2
    kart: { tr: "Fenerin sesi", en: "The lighthouse voice" }
    sahne: "frekans_1"
    sahneler:
      - id: "frekans_1"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Cebindeki telsiz cızırdıyor: üç kısa, bir uzun. Ardından {npc:mert_kilic|in} soluk soluğa sesi geliyor: \"{yer:kordon|in} eski feneri. Bir şey yayınlıyor. Ölü bir frekansta. Entegrasyon'dan beri. Yakınlardasın, değil mi? Lütfen yakınlarda ol.\"", en: "The radio in your pocket crackles: three short, one long. Then {npc:mert_kilic|pos} voice, out of breath: \"The old lighthouse on {yer:kordon}. It's broadcasting something. On a dead frequency. Since Integration. You're close, right? Please be close.\"" }
            kosul: { bayrak_yok: "mert_yoldas" }
          - metin: { tr: "{npc:mert_kilic} birden durup kulaklıklarını iki eliyle kulaklarına bastırıyor. \"Fener,\" diyor. \"{yer:kordon|in} eski feneri. Bir şey yayınlıyor. Ölü bir frekansta. Entegrasyon'dan beri.\"", en: "{npc:mert_kilic} stops dead and presses his headphones to his ears with both hands. \"The lighthouse,\" he says. \"The old one on {yer:kordon}. It's broadcasting. On a dead frequency. Since Integration.\"" }
            kosul: { bayrak: "mert_yoldas" }
          - { tr: "Fenerin dibinde buluşuyorsunuz. {npc:mert_kilic|in} elinde bir tarayıcı, sırtında çanta dolusu kablo var; gözlerinin altı mosmor. Kulaklığın bir tekini sana uzatıyor.", en: "You meet at the foot of the lighthouse. {npc:mert_kilic} has a scanner in his hand and a bag of cables on his back, dark circles under his eyes. He hands you one side of his headphones." }
          - { tr: "Bir kadın sesi, hiçbir dile ait olmayan sözcüklerle bir sayı okuyor. Ardından bir bip, ardından bir öncekinden bir eksik bir sayı daha.", en: "A woman's voice reads out a number in words from no language at all. Then a beep. Then another number, one less." }
          - metin: { tr: "{yer:kordon} düştüğünden beri fener canavar bölgesinin tam ortasında kaldı. Merdivenlerin dibinde, tuz kabuğu bağlamış kıskaçların arasında yayın hiç kesilmeden sürüyor.", en: "Ever since {yer:kordon} fell, the lighthouse has stood dead center in the monster zone. At the foot of the stairs, among the salt-crusted claws, the broadcast keeps going without a break." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Sayıyı çözüp bugünün gün sayısını üstüne ekliyorsun. Kaç kez denersen dene, sonuç hep aynı çıkıyor: üç yüz altmış beş.", en: "You work out the number and add today's day count to it. However many times you try it, the answer is the same: three hundred sixty-five." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷u ses... tanımıyorum. yalan söylüyorum. tanıyorum.", en: "t̷hat voice... i don't know it. i'm lying. i know it." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir geri sayım. Bunu söyleyen ben olmak istemezdim. Tutanağa geçsin: istemezdim.\"", en: "\"That's a countdown. And I really didn't want to be the one to say it. Let the record show: I didn't want to.\"" }
        secenekler:
          - id: "tirman"
            etiket: { tr: "{npc:mert_kilic|le} fenere tırman", en: "Climb the lighthouse with {npc:mert_kilic}" }
            etkiler:
              - iliski: { mert_kilic: { guven: 4, saygi: 2 } }
              - itibar: { sessiz_ag: 2 }
            sonraki: "frekans_tirmanis"
          - id: "tek"
            tur: "gosteris"
            etiket: { tr: "{npc:mert_kilic|i} sırtına al, dış duvardan tırman", en: "Scale the outside wall with {npc:mert_kilic} on your back" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - dikkat: 2
              - iliski: { mert_kilic: { saygi: 6, korku: 3 } }
            sonraki: "frekans_oda"
          - id: "sat"
            etiket: { tr: "Yükselenler'e haber ver: bu Sistem'in sesi", en: "Tell the Ascended. That's the System's voice" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - itibar: { yukselenler: 5, sessiz_ag: -6 }
              - iliski: { mert_kilic: { guven: -12 }, vahit: { saygi: 4, guven: 3 } }
              - bayrak: "fener_yukselenlere"
            sonraki: "frekans_vaiz"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Kulaklığı geri ver, bilmek istemiyorsun", en: "Hand back the headphones. You don't want to know" }
            etkiler:
              - gizle: 1
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { saygi: -3 } }
            sonraki: "@akis"

      - id: "frekans_tirmanis"
        yer: "kordon"
        paragraflar:
          - { tr: "Döner merdiven yüz on dört basamak. Yetmişinci basamakta karanlıkta bir şey çığlık atıyor, tavandan bir yarasa sürüsü boşalıyor: kanatları kâğıt gibi, çığlıkları cam gibi.", en: "The spiral stairs are a hundred and fourteen steps. On the seventieth, something screams in the dark and a swarm of bats pours down from the ceiling, wings like paper, screams like breaking glass." }
          - { tr: "{npc:mert_kilic} tarayıcısını göğsüne bastırıp duvara yapışıyor. \"Ben, şey, arkanda kalayım. Analitik destek.\"", en: "{npc:mert_kilic} flattens himself against the wall, scanner clutched to his chest. \"I'm just gonna, uh, stay behind you. Analytical support.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Önüne geç, merdiveni temizle", en: "Get in front of him. Clear the stairs" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3 } }
              - savas: { dusmanlar: ["ciglik_yarasasi@dunya", "ciglik_yarasasi@dunya", "ciglik_yarasasi@dunya"], ortam: ["dar_gecit", "karanlik"], kazan: "frekans_oda", kaybet: "frekans_kacis", kac: "frekans_kacis" }

      - id: "frekans_kacis"
        yer: "kordon"
        paragraflar:
          - { tr: "Yarasalar seni merdivenin dibine kadar geri püskürtüyor. {npc:mert_kilic} kapının dışında, tarayıcısının ekranına gömülmüş. \"Kaydettim,\" diyor. \"Yarısını. O da bir şey. Değil mi? Bir şey.\"", en: "The bats drive you all the way back down the stairs. {npc:mert_kilic} is outside the door with his scanner, staring at the screen. \"I got it,\" he says. \"Half of it. That's something. Right? That's something.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Şimdilik yarısı yeter", en: "Half's enough. For now" }
            etkiler:
              - bilgi: "fener_geri_sayim"
              - iliski: { mert_kilic: { guven: 2 } }
            sonraki: "@akis"

      - id: "frekans_oda"
        yer: "kordon"
        paragraflar:
          - { tr: "Fener odasının ortasında dev mercek duruyor ama ışığın yerinde bir pencere var: havada dönen, kenarları kusursuz, masmavi bir Sistem penceresi. Sayıları okuyan o.", en: "The great lens stands in the middle of the lamp room, but where the light should be there's a window: blue, with perfectly clean edges, a System window turning in midair. That's what's reading the numbers." }
          - { tr: "{npc:mert_kilic} kablolarını çıkarıp pencerenin çevresinde dolanmaya başlıyor; elleri titriyor ama çabuk. \"Bu yayın değil,\" diyor. \"Hatırlatma. Kime olduğunu bilmiyorum. Bize değil.\"", en: "{npc:mert_kilic} pulls out his cables and starts circling the window, hands shaking but fast. \"This isn't a broadcast,\" he says. \"It's a reminder. I don't know who it's for. Not us.\"" }
          - { tr: "Sayıların arasındaki bipin içinde, yalnızca senin duyabileceğin kadar alçak ikinci bir ses saklı: küçük harfli, bozuk, tanıdık. hâlâ orada mısın, diyor. kimse cevap vermiyor.", en: "Inside the beep between the numbers there's a second voice, low enough that only you can hear it: lowercase, glitched, familiar. are you still there, it says. no one answers." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Katman hatırlatıcısı · kalan gün]", en: "[Layer reminder · days remaining]" }
            satirlar:
              - { tr: "Bu iletim yerel kullanıcılara yönelik değildir.", en: "This transmission is not intended for local users." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "c̷evap verme. lütfen. ilk kez bir şey için yalvarıyorum sana.", en: "d̷on't answer it. please. first time i've ever begged you for anything." }
        secenekler:
          - id: "kaydet"
            etiket: { tr: "{npc:mert_kilic|in} kaydı bitirmesini bekle", en: "Let {npc:mert_kilic} finish recording" }
            etkiler:
              - bilgi: "fener_geri_sayim"
              - iliski: { mert_kilic: { guven: 6, baglilik: 4 } }
              - itibar: { sessiz_ag: 5 }
              - bayrak: "fener_kayit_mertte"
              - xp_seviye: 35
              - tohum: { olay: "kordon_fener_baligi", gecikme: { min: 2, max: 5 }, kosul: { bayrak_yok: "fenerci_olduruldu" }, hatirlatma: { tr: "Fenerin frekansında duyduğun ses seni yine {yer:kordon|e} çağırıyor.", en: "The sound you caught on the lighthouse frequency is calling you back to {yer:kordon}." } }
            sonraki: "frekans_son"
          - id: "cevap"
            etiket: { tr: "İkinci sese cevap ver", en: "Answer the second voice" }
            etkiler:
              - bilgi: "fener_geri_sayim"
              - dikkat: 3
              - iliski: { yanki: { guven: -6, korku: 4 }, mert_kilic: { saygi: 3 } }
              - bayrak: "fener_cevap_verildi"
              - xp_seviye: 35
            sonraki: "frekans_cevap"
          - id: "kir"
            etiket: { tr: "{npc:yanki} istiyor: pencereyi kır", en: "{npc:yanki} wants it. Smash the window" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 4 }, mert_kilic: { guven: -6, saygi: -2 } }
              - itibar: { sessiz_ag: -3 }
              - bayrak: "fener_kirildi"
              - xp_seviye: 30
            sonraki: "frekans_kir"

      - id: "frekans_cevap"
        yer: "kordon"
        paragraflar:
          - { tr: "\"Buradayım,\" diyorsun pencereye. Sayılar da bip de kesiliyor. Fener odası, deniz, {yer:kordon}... her şey bir anlığına susuyor.", en: "\"I'm here,\" you tell the window. The numbers stop. The beep stops. The lamp room, the sea, {yer:kordon}, everything goes quiet for one second." }
          - { tr: "Derken ikinci ses çok uzaklardan geliyor: geç kaldın. Pencere kararıyor. {npc:yanki} uzun süre tek söz etmiyor; sonunda yalnızca şunu diyor: bir daha yapma.", en: "Then the second voice, from very far away: you're late. The window goes dark. {npc:yanki} doesn't say anything for a long time. Then, just: don't ever do that again." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Merdivenlerden in", en: "Head down the stairs" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3 } }
            sonraki: "frekans_son"

      - id: "frekans_kir"
        yer: "kordon"
        paragraflar:
          - { tr: "Yumruğun pencerenin tam ortasından geçiyor; pencere cam gibi yüzlerce mavi parçaya bölünüyor. Parçalar yere düşmeden havada eriyip gidiyor.", en: "Your fist goes straight through the middle of the window, and it shatters like glass into hundreds of blue shards. The shards never hit the floor. They melt in midair." }
          - { tr: "{npc:mert_kilic} kaydın yarısıyla kalakalıyor. \"Neden?\" diyor. Bir cevabın yok; olsaydı da senin cevabın olmazdı. {npc:yanki} ise derin, rahat bir nefes veriyor: teşekkür ederim. bunu unutmayacağım.", en: "{npc:mert_kilic} is left holding half a recording. \"Why?\" he says. You don't have an answer, and if you did, it wouldn't be yours. {npc:yanki} lets out a long breath: thank you. i won't forget this." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "{npc:mert_kilic|e} bir şey söyleme", en: "Don't explain it to {npc:mert_kilic}" }
            etkiler:
              - iliski: { mert_kilic: { guven: -2 } }
            sonraki: "frekans_son"

      - id: "frekans_vaiz"
        yer: "kordon"
        paragraflar:
          - { tr: "Ertesi gün fenerin dibinde beyazlar giymiş bir kalabalık diz çökmüş, gözlerini yukarı dikmiş. Sayıları ilahi gibi tekrarlıyorlar; her bipte içlerinden biri ağlamaya başlıyor.", en: "The next day there's a crowd in white kneeling at the foot of the lighthouse, eyes turned up. They repeat the numbers like a hymn, and every time it beeps somebody cries." }
          - { tr: "{npc:mert_kilic} telsizden tek bir cümle gönderip frekansını kapatıyor: \"Bir veri noktasıydı. Sen onu dine çevirdin.\"", en: "{npc:mert_kilic} sends one sentence over the radio, then shuts off his frequency: \"It was a data point. You turned it into a religion.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İlahiyi dinle", en: "Listen to the hymn" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bilgi: "fener_geri_sayim"
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "frekans_son"
        yer: "kordon"
        paragraflar:
          - { tr: "Fenerin dibinde {npc:mert_kilic} kablolarını sararken uzun süre ağzını açmıyor. Sonunda: \"Kalan günleri sayıyor. Her gece bir eksiliyor. Bunu kimse bilmiyor. Biz biliyoruz.\"", en: "At the foot of the lighthouse {npc:mert_kilic} coils his cables and doesn't talk for a long time. Then: \"It's counting down the days we have left. One less every night. Nobody knows that. We know that.\"" }
          - metin: { tr: "Pencere söndüğünden beri fener ilk kez karanlık. {yer:kordon|de} birileri buna uğursuzluk diyecek; sense ne olduğunu biliyorsun.", en: "With the window gone, the lighthouse is dark for the first time. Somebody on {yer:kordon} will call it bad luck. You know what it is." }
            kosul: { bayrak: "fener_kirildi" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "{yer:kordon|den} ayrıl", en: "Leave {yer:kordon}" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 2 } }
            sonraki: "@akis"

  # ================================================================== ÜÇÜNCÜ KATTAKİ FENER (taşmadan sonra)
  - id: "kordon_son_balkon"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 81, max: 180 }
    agirlik: 5
    etiketler: ["kordon", "ahlak", "kayip"]
    gerilim: 2
    onemli: true
    kart: { tr: "Üçüncü kattaki fener", en: "The lamp on the third floor" }
    sahne: "balkon_1"
    sahneler:
      - id: "balkon_1"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "{yer:kordon} artık bir canavar bölgesi. Palmiyelerin yarısı kırılmış, kafelerin camlarını tuz kabuğu sarmış; kaldırımlar kıskaç izleriyle dolu, deniz kokusunun altında daha ağır, daha tatlımsı bir koku var.", en: "The Esplanade is a monster zone now. Half the cherry trees are snapped, the café windows are crusted over with salt, there are claw tracks on the sidewalks, and under the smell of the sea there's something heavier, sweeter." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Tek bir pencere dışında bütün sıra karanlık. Üçüncü kattaki bir balkonda gaz lambası yanıyor; bir kadın, hiçbir şey olmamış gibi saksılarını suluyor.", en: "The whole row is dark except for one window. On a third-floor balcony an oil lamp is burning, and a woman is watering her potted plants like nothing ever happened." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Balkonun altında, kaldırımda köpek büyüklüğünde bir kıskaç nöbet tutuyor. Biri sırtındaki kabuğa tebeşirle bir kalp çizmiş.", en: "Under the balcony, on the sidewalk, a claw-crab the size of a dog is standing guard. Somebody's drawn a heart on its shell in chalk." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "{yer:kordon} dayandı; bunu her köşede görebiliyorsun. Barikatın kalıntıları anıt gibi duruyor, kafeler yeniden açılmış, palmiyelerin arasına isimler asılmış: taşma gecesi hattı tutarken ölenlerin isimleri.", en: "The Esplanade held, and you can see it everywhere: what's left of the barricade stands like a monument, the cafés have reopened, and names hang from the cherry trees. The names of the ones who died holding the line the night the Gate broke." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "Her akşam üçüncü kattaki bir balkonda gaz lambası yanıyor. Yaşlı bir kadın onu ölüler için yakıyor, bir de Öğretici'den dönmeyen oğlu için.", en: "Every evening an oil lamp burns on a third-floor balcony. An old woman lights it for the dead, and for her son, who never came back from the tutorial." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "Bu akşam balkonun altında bir kalabalık birikmiş. Lonca'dan iki avcı kapıyı yumrukluyor. Yukarıda, kadının balkonunda, saksıların arasında kedi büyüklüğünde bir kıskaç yavrusu saklanıyor.", en: "Tonight there's a crowd under the balcony. Two Guild hunters are pounding on the door. Up on the balcony, between the flowerpots, a claw-crab pup the size of a cat is hiding." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "{yer:kordon|i} boşaltmaya çalıştığın gün bu kadın kapısını yüzüne kapatmıştı. \"Oğlum dönerse beni burada bulmalı,\" demişti.", en: "The day you tried to clear {yer:kordon}, this woman shut her door on you. \"If my boy comes home, he has to find me here,\" she'd said." }
            kosul: { bayrak: "kordon_tahliye" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Kıskacın tepesinde, yalnız senin görebildiğin soluk bir satır duruyor: [Evcil · Sahibi: balkondaki kadın]. Kadının satırındaysa şu yazıyor: [Sınıf: Besleyen · Sv. 6]. Yetmiş yaşında, farkına bile varmadan bir sınıf edinmiş.", en: "Above the crab there's a faint line only you can see: [Tamed · Owner: the woman on the balcony]. And on hers: [Class: Feeder · Lv. 6]. Seventy years old, and she got a class without even noticing." }
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Kadının saksılarında ne domates var ne maydanoz; yalnızca mavi yosun. Kıskaçlar onu yiyor. Kadın onları besliyor, onlar da kadını.", en: "There's no tomatoes in those pots, no parsley. Just bluecap moss. The crabs eat it. She feeds them, and they keep her fed." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷istem ona bir sınıf vermiş ve söylememiş. sana söylerdi. sana her şeyi söylüyor, değil mi? ben söylüyorum.", en: "t̷he system gave her a class and didn't tell her. it would have told you. it tells you everything, right? i do." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Benim annem de böyle yapardı. Lambayı yakar, kapıyı kilitlemezdi.\"", en: "\"My mom would do this. Leave the lamp on. Never lock the door.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yetmiş yaşında, tek başına, canavar bölgesinin ortasında. Üstelik dişlerinin hepsi yerinde. Bu kadından öğreneceğimiz çok şey var.\"", en: "\"Seventy, alone, in a monster zone. And she's still got all her teeth. We ought to be learning something from her.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Onu zorla da olsa bölgenin dışına taşı", en: "Get her out of the zone, by force if you have to" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1, insanlik: -2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "balkon_tasindi"
            kronik: { tr: "{yer:kordon|in} son sakinini balkonundan zorla indirdin; arkanızda lambası kimsesiz yanmayı sürdürdü.", en: "You carried {yer:kordon|pos} last resident off her balcony by force, and behind her the lamp kept burning for no one." }
            sonraki: "balkon_tasindi_sahne"
          - id: "nobet"
            etiket: { tr: "Bir gece onunla kal, lambaya ne gelirse karşıla", en: "Stay the night. Meet whatever the lamp draws in" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - savas: { dusmanlar: ["mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya", "kordon_lesyiyen@dunya"], ortam: ["karanlik"], kazan: "balkon_sabah", kaybet: "balkon_gece_kayip", kac: "balkon_gece_kayip" }
            kronik: { tr: "{yer:kordon|in} ortasında, bir gaz lambasının altında nöbete oturdun; ışığın çektiği her şeyi karşılamaya hazırdın.", en: "You sat down to keep watch under an oil lamp in the middle of the fallen Esplanade, ready to meet whatever the light drew in." }
          - id: "temizle"
            tur: "gosteris"
            etiket: { tr: "Sokağı baştan sona temizle, hiçbir şey yaklaşmasın", en: "Clear the whole street. Nothing comes near again" }
            goster: { bayrak: "kordon_dustu" }
            gerekli: { stat: { str: 55 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 3, duzen: 2 }
              - efsane: "tek_basina_suru"
              - bayrak: "balkon_sokak_temiz"
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Düşmüş {yer:kordon|de} bir sokağı tek başına temizledin ve bölgenin ortasında küçük bir ada açtın.", en: "You cleared one street of the fallen Esplanade single-handed and carved a little island out of the middle of the zone." }
            sonraki: "balkon_ada"
          - id: "kiskac"
            etiket: { tr: "Balkonun altındaki kıskacı öldür", en: "Kill the crab under the balcony" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - savas: { dusmanlar: ["mendirek_kiskaci@dunya"], ortam: ["karanlik"], kazan: "balkon_kiskac", kaybet: "balkon_gece_kayip", kac: "balkon_gece_kayip" }
            kronik: { tr: "Yaşlı bir kadını koruyan tek canavara, onu korumak adına saldırdın.", en: "To protect an old woman, you went after the only monster that was protecting her." }
          - id: "savun"
            etiket: { tr: "Kapının önüne geç, yavruya dokunmasınlar", en: "Get between them and the door. Nobody touches the pup" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { lonca: -4, siginak: 2 }
              - iliski: { kaya_demir: { guven: -3 } }
              - bayrak: "balkon_yavru_kaldi"
            kronik: { tr: "{yer:kordon} ayakta kalmıştı; sen orada bir kıskaç yavrusunu Lonca'nın kuralına karşı korudun.", en: "The line at {yer:kordon} had held, and there you protected a claw-crab pup against the Guild's rule." }
            sonraki: "balkon_yavru"
          - id: "benim"
            tur: "aciga_vur"
            etiket: { tr: "\"Bu yavru benim. Kimse dokunmaz.\"", en: "\"That pup's mine. Nobody touches it.\"" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, insanlik: -1 }
              - itibar: { lonca: 2 }
              - bayrak: "balkon_yavru_kaldi"
            kronik: { tr: "Bir kıskaç yavrusunu kendi adınla koruma altına aldın; o gün {yer:kordon|de} kimse onun yaşama hakkını tartışmaya yeltenmedi.", en: "You put a claw-crab pup under the protection of your own name, and that day nobody on {yer:kordon} dared argue its right to live." }
            sonraki: "balkon_yavru"
          - id: "kural"
            etiket: { tr: "Kenara çekil, kural kuraldır", en: "Step aside. Rules are rules" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "{yer:kordon} dayanmıştı ama Lonca'nın kuralına ses çıkarmadın; yaşlı kadın o gece lambasını yakmadı.", en: "On {yer:kordon} that held, you let the Guild's rule stand, and that night the old woman didn't light her lamp." }
            sonraki: "balkon_kural"
          - id: "oglu"
            etiket: { tr: "Ona oğlunun satırını oku", en: "Read her son's line for her" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - bilgi: "duvar_kayit_satiri"
            kronik: { tr: "Balkondaki yaşlı kadın için, Öğretici'den dönmeyen oğlunun satırına baktın.", en: "For the old woman on the balcony, you looked up the line for her son who never came back from the tutorial." }
            sonraki: "balkon_oglu"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Lambaya bak, yoluna devam et", en: "Look at the lamp. Keep walking" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -2 }
            kronik: { tr: "{yer:kordon|in} son lambasının önünden geçtin, durmadın.", en: "You walked past the last lamp on {yer:kordon} and didn't stop." }
            sonraki: "@akis"

      - id: "balkon_oglu"
        yer: "kordon"
        paragraflar:
          - { tr: "Kadın seni içeri buyur ediyor. Duvarda bir fotoğraf asılı: lise mezuniyeti, kepini havaya fırlatan bir oğlan. Fotoğrafa odaklanınca köşesinde gri satır beliriyor.", en: "She lets you in. There's a photo on the wall: a high school graduation, a boy tossing his cap in the air. You focus on it and the gray line appears in the corner." }
          - { tr: "Satırda tek bir sözcük var: Silindi. Kadın yüzüne bakıyor; satırı ona okumana gerek kalmıyor.", en: "The line is one word: Deleted. She's reading your face. She doesn't need you to read her the line." }
        secenekler:
          - id: "soyle"
            etiket: { tr: "Ona doğruyu söyle", en: "Tell her the truth" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - bayrak: "balkon_oglu_bildi"
            kronik: { tr: "Yetmiş yaşında bir kadına oğlunun öldüğünü söyledin; kadın lambasını yine de söndürmedi.", en: "You told a seventy-year-old woman her son was dead, and she still didn't put out her lamp." }
            sonraki: "balkon_son"
          - id: "sus"
            etiket: { tr: "\"Okuyamıyorum,\" de", en: "Say you can't read it" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -2 }
            kronik: { tr: "Yaşlı bir kadına oğlunun satırını okuyamadığını söyledin; oysa okumuştun.", en: "You told an old woman you couldn't read her son's line. You had." }
            sonraki: "balkon_son"

      - id: "balkon_tasindi_sahne"
        yer: "kordon"
        paragraflar:
          - { tr: "Kadını kucaklayıp merdivenlerden iniyorsun; kuş kadar hafif, kuş gibi de çırpınıyor. Kıskaç sana saldırmıyor, yalnızca bölgenin sınırına kadar peşinizden geliyor.", en: "You scoop her up and carry her down the stairs. She's as light as a bird and fights like one. The crab doesn't attack. It just follows you, all the way to the edge of the zone." }
          - { tr: "Sınırda duruyor. Kadın omzunun üstünden ona bakıp ilk kez ağlıyor. Arkanızda üçüncü kattaki lamba yanık, ama artık kimse için değil.", en: "At the edge it stops. The woman looks back at it over your shoulder and cries for the first time. Behind you, the lamp on the third floor keeps burning, for nobody." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu Konsey'in yurduna bırak", en: "Leave her at the Council's shelter" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - itibar: { siginak: 2 }
              - xp_seviye: 25
            kronik: { tr: "{yer:kordon|in} son sakinini Konsey'in yurduna bıraktın; kadın ilk iş pencerenin önüne oturdu.", en: "You left {yer:kordon|pos} last resident at the Council's shelter, and the first thing she did was sit down by the window." }
            sonraki: "@akis"

      - id: "balkon_sabah"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Gece boyunca lambanın ışığına gelen her şeyin önce senin yanından geçmesi gerekiyor; hiçbiri geçemiyor. Sabaha karşı kaldırım kabuk ve tuzla kaplanmış.", en: "All night, anything drawn to the lamp has to get past you. Nothing does. By dawn the sidewalk is covered in shell and salt." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Gece uzun, sen yorgunsun ama balkona hiçbir şey çıkamıyor. Sabaha karşı kaldırım da kolundaki kesikler de kabuk ve tuzla dolmuş.", en: "The night is long and you're tired, but nothing makes it up to the balcony. By dawn the sidewalk's covered in shell and salt, and so are the cuts on your arms." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Kadın balkondan sana ince belli, kenarı çatlak bir bardak çay uzatıyor. \"Oğlum da gece nöbeti tutardı,\" diyor. \"{yer:kiyikent_liman|de}, gümrükte. Ona hep çay götürürdüm.\"", en: "The woman hands you a mug of coffee over the railing, an old diner mug with a chipped rim. \"My son worked nights too,\" she says. \"Down at the customs house. I always brought him coffee.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çayı iç", en: "Drink the coffee" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 40
            kronik: { tr: "Düşmüş {yer:kordon|de} bir gecelik nöbetin sonunda, bir annenin eskiden oğluna götürdüğü çayı sen içtin.", en: "On the fallen Esplanade, after a night on watch, you drank the coffee a mother used to bring her son." }
            sonraki: "balkon_son"

      - id: "balkon_gece_kayip"
        yer: "kordon"
        paragraflar:
          - { tr: "Karanlıkta kaç tane olduklarını şaşırıyorsun; bir kıskaç baldırına yapışıyor, bir başkası sırtına tırmanıyor. Bir an lamba gözlerinin önünde sallanıyor.", en: "In the dark you lose count of them. One claw gets your calf, another climbs onto your back. For a moment the lamp swings in front of your eyes." }
          - { tr: "Derken balkondan bir kova kaynar su, ardından bir saksı iniyor. Kadın elinde süpürgeyle merdivenlerden iniyor; kıskaçlar da nedense ondan kaçışıyor.", en: "Then a bucket of boiling water comes down off the balcony, followed by a flowerpot. The woman comes down the stairs with a broom, and the crabs, for some reason, run from her." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yerden kalk, ona teşekkür et", en: "Get up off the ground and thank her" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - can: 10
            kronik: { tr: "Bir gece, düşmüş {yer:kordon|de}, seni elinde süpürgeyle yetmiş yaşında bir kadın kurtardı.", en: "One night on the fallen Esplanade, you were rescued by a seventy-year-old woman with a broom." }
            sonraki: "balkon_son"

      - id: "balkon_kiskac"
        yer: "kordon"
        paragraflar:
          - { tr: "Kıskaç kaçmaya kalkmıyor, yalnızca balkonla senin arana giriyor. Son darbede kabuğundaki tebeşir kalp ikiye bölünüyor.", en: "The crab doesn't try to run. It just puts itself between you and the balcony. The chalk heart on its shell splits in two on the last blow." }
          - { tr: "Balkondan bir çığlık kopuyor, bir annenin çığlığı. O gece lamba sönüyor. Ertesi gece bölgedeki bütün kıskaçlar o sokağa üşüşüyor.", en: "A scream comes down off the balcony. A mother's scream. That night the lamp goes out. The next night, every crab in the zone comes crowding into that street." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kadını oradan çıkar", en: "Get her out of there" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "balkon_tasindi"
              - xp_seviye: 25
            kronik: { tr: "Yaşlı bir kadının tek bekçisini öldürdün; sonra kadını kendi evinden kaçırmak sana düştü.", en: "You killed an old woman's only guard and then had to get her out of her own home." }
            sonraki: "@akis"

      - id: "balkon_ada"
        yer: "kordon"
        paragraflar:
          - { tr: "Sokağa bir ucundan girip öbür ucundan çıkıyorsun. Arkanda kabuktan, tuzdan bir çizgi kalıyor; o çizgiyi bir daha hiçbir şey geçemiyor.", en: "You go in one end of the street and come out the other. Behind you there's a line of shell and salt, and nothing ever crosses that line again." }
          - { tr: "Kadın balkondan seyrediyor. İş bitince lambasını biraz daha açıyor. \"Artık buraya başkaları da gelebilir,\" diyor. \"Tek ev mahalle olmaz. İki ev olur.\"", en: "The woman watches from her balcony. When it's over, she turns her lamp up a little. \"Now other people can come here too,\" she says. \"One house isn't a neighborhood. Two houses are.\"" }
          - { tr: "Balkonun altındaki kıskaç yerinden kıpırdamadı. Sen ona dokunmadın, o da sana.", en: "The crab under the balcony never moved. You didn't touch it, and it didn't touch you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sokağın başına bir işaret bırak", en: "Leave a mark at the head of the street" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { siginak: 3 }
              - xp_seviye: 45
              - tohum: { olay: "kordon_olu_bolge_seferi", gecikme: { min: 3, max: 8 }, kosul: { bayrak: "kordon_dustu" }, hatirlatma: { tr: "Üçüncü kattaki fenerin bıraktığı işaret birilerine ulaşmış.", en: "The sign that third-floor lantern left behind has reached somebody." } }
            kronik: { tr: "Düşmüş {yer:kordon|in} ortasında bir sokağı temizleyip başına bir işaret bıraktın; artık oraya başkaları da taşınabilirdi.", en: "You cleared a street in the middle of the fallen Esplanade and left a mark at its head. Other people could move in there now." }
            sonraki: "@akis"

      - id: "balkon_yavru"
        yer: "kordon"
        paragraflar:
          - { tr: "Kapının önündeki Lonca avcıları önce sana, sonra birbirlerine bakıyor. Biri omuz silkiyor. \"Rapora geçer,\" diyor. \"Ama raporu ben yazıyorum.\" Çekip gidiyorlar.", en: "The Guild hunters at the door look at you, then at each other. One shrugs. \"It'll go in the report,\" he says. \"But I'm the one writing the report.\" They leave." }
          - { tr: "Kadın yavruyu saksıların arasından alıp kucağına koyuyor; yavru kedi gibi kabuğunu bileğine sürtüyor. Lamba o gece her zamankinden parlak yanıyor.", en: "The woman lifts the pup out from between the flowerpots and sets it in her lap. Like a cat, it rubs its shell against her wrist. That night the lamp burns brighter than ever." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Balkonun altında bir süre dur", en: "Stand under the balcony a while" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - xp_seviye: 30
              - tohum: { olay: "kordon_heykel", gecikme: { min: 3, max: 8 }, kosul: { bayrak: "kordon_kurtarildi" }, hatirlatma: { tr: "Üçüncü kattaki fenerin hatırası {yer:kordon|de} taşa dönüşüyor.", en: "The memory of that lantern on the third floor is turning to stone on {yer:kordon}." } }
            kronik: { tr: "Taşmayı atlatan {yer:kordon|de}, yaşlı bir kadınla bir kıskaç yavrusunu aynı lambanın altında yaşamaya bıraktın.", en: "On {yer:kordon} that held, you let an old woman and a crab pup live under the same lamp." }
            sonraki: "balkon_son"

      - id: "balkon_kural"
        yer: "kordon"
        paragraflar:
          - { tr: "Avcılar kapıyı kırıp içeri dalıyor. Kısa bir tıkırtı, kısa bir çığlık, ardından sessizlik. İçlerinden biri yavruyu bir çuvala koymuş, dışarı çıkıyor.", en: "The hunters break the door and go in. A short clatter, a short scream, then nothing. One of them comes out with the pup in a sack." }
          - { tr: "Kadın balkona çıkıp lambasına uzun uzun bakıyor ama yakmıyor. {yer:kordon} o gece ilk kez kapkaranlık.", en: "The woman comes out onto the balcony and looks at her lamp for a long time. She doesn't light it. That night, for the first time, {yer:kordon} is completely dark." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 15
            kronik: { tr: "{yer:kordon|de} kural yerini buldu; yavruyu çuvala koyup götürdüler, sen de arkana bakmadan yürüdün.", en: "On {yer:kordon} the rule was kept. They carried the pup off in a sack, and you walked away without looking back." }
            sonraki: "@akis"

      - id: "balkon_son"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Kadın lambanın fitilini biraz açıyor. \"Biliyordum,\" diyor. \"Anasıyım ben. Ama lambayı yakmayı sürdüreceğim. Artık onun için değil, başkalarının oğulları için. Belki biri yolunu bulur.\"", en: "She turns the lamp's wick up a little. \"I knew,\" she says. \"I'm his mother. But I'm going to keep lighting it. Not for him anymore. For other people's sons. Maybe one of them finds his way.\"" }
            kosul: { bayrak: "balkon_oglu_bildi" }
          - { tr: "Lamba üçüncü katta yanıyor. {yer:kordon|in} geri kalanı ister karanlık olsun ister aydınlık, o lamba her gece aynı saatte yanıyor; çok geçmeden şehirde onu bilmeyen kalmıyor.", en: "The lamp burns on the third floor. The rest of {yer:kordon} might be dark or might be bright, but that lamp burns at the same hour every night, and before long there's nobody in the city who doesn't know it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Lambaya son bir kez bakıp git", en: "Look at the lamp one last time and go" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "{yer:kordon|de} üçüncü kattaki lambaya son bir kez bakıp yoluna devam ettin; ışık hâlâ yanıyordu.", en: "You took one last look at the lamp on the third floor on {yer:kordon} and moved on. It was still burning." }
            sonraki: "@akis"

  # ================================================================== KAİDE (Kordon tutulduysa)
  - id: "kordon_heykel"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 85, max: 180 }
    kosul: { bayrak: "kordon_kurtarildi" }
    agirlik: 5
    etiketler: ["kordon", "hakimiyet", "efsane"]
    gerilim: 1
    kart: { tr: "Kaide", en: "The pedestal" }
    sahne: "heykel_1"
    sahneler:
      - id: "heykel_1"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon|in} ortasında, eski saat kulesinin dibinde, taşma gecesinden kalan kapı enkazından bir kaide yükseltmişler. Üstünde {yer:sanayi|den} gelmiş bir dökümcü çalışıyor; malzemesi demir, kristal, bir de canavar kabuğu.", en: "In the middle of {yer:kordon}, at the foot of the old clock tower, they've built a pedestal out of the wreckage left by the gate break. A foundry worker from {yer:sanayi} is at work on top of it: iron, crystal, and monster shell." }
          - { tr: "Heykelin henüz başı yok ama duruşu belli: bir ayağı önde, bir kolu havada, yüzü mendireğe dönük. Kimin heykeli olduğunu sormana gerek kalmıyor; çevredeki çocuklar seni görünce çığlığı basıp parmaklarıyla heykeli gösteriyor.", en: "The statue doesn't have a head yet, but you can tell the pose: one foot forward, one arm raised, facing the jetty. You don't need to ask who it is. The kids hanging around it see you, shriek, and point back and forth between you and the statue." }
          - { tr: "Kaidenin çevresinde üç tartışma birden sürüyor. Lonca'dan biri heykele zırh giydirilsin istiyor; Konsey'den bir kadın, kaideye taşma gecesi ölenlerin adları yazılsın. Beyazlar giymiş iki kişiyse heykelin önüne bir sunak kurmanın derdinde.", en: "Three arguments are going on around the pedestal at once. Somebody from the Guild wants the statue in armor. A woman from the Council wants the names of the gate-break dead on the base. Two people in white want an altar out front." }
          - metin: { tr: "Biri kaidenin bir köşesine unvanını kazımış: Vapuru Doğrultan. Altında bir çocuk elinden çıkma bir vapur resmi var.", en: "Somebody's carved your title into one corner of the base: Ferry Lifter. Underneath, in a kid's hand, a drawing of a ferry." }
            kosul: { unvan: "vapuru_dogrultan" }
          - metin: { tr: "Taşma gecesinden önce {yer:kordon|i} boşalttığın için hayatta kalan yüzlerce kişi burada. Kimi sana el sallıyor, kimi heykele.", en: "Hundreds of people are here who are alive because you cleared {yer:kordon} before the Gate broke. Some of them wave at you. Some wave at the statue." }
            kosul: { bayrak: "kordon_tahliye" }
          - metin: { tr: "Yükselenler'in ilahilerinde artık senin adın da geçiyor. Kasaba Çekirdeği onların; heykel de onların fikriydi.", en: "The Ascended's hymns have your name in them now too. The Town Core is theirs, and the statue was their idea." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { cha: 40 } }
            metin: { tr: "Kalabalık ağzından çıkacak tek sözü bekliyor. Heykel de sunak da isimler de, ne dersen o olacak.", en: "The crowd's waiting on one word from you. Whatever you say goes: the statue, the altar, the names." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ir heykel. birkaç ay önce vapur iskelesinde simit yiyordun. buna bayılıyorum.", en: "a̷ statue. a few months ago you were eating pretzels on a ferry dock. i love this so much." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Burnunu yanlış yapmışlar. Söylemeyeceğim tabii. Tamam, söyleyeceğim.\"", en: "\"They got your nose wrong. Not that I'd say anything. Okay, I'm gonna say something.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Heykel mi? Benimkini daha büyük yaparlar. Görürsün.\"", en: "\"A statue? They'll make mine bigger. Just watch.\"" }
        secenekler:
          - id: "isim"
            tur: "gosteris"
            etiket: { tr: "Heykelin yüzüne ölülerin adlarını parmağınla kazı", en: "Carve the names of the dead into its face with your finger" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - dikkat: 2
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 6, yukselenler: -4 }
              - unvan: "kordonun_kalkani"
              - bayrak: "heykel_isimler"
            kronik: { tr: "{yer:kordon|de} sana dikilen heykelin yüzünü sildin ve yerine taşma gecesi ölenlerin adlarını parmaklarınla kazıdın.", en: "You wiped your own face off the statue they raised to you on {yer:kordon} and carved the names of the gate-break dead in its place with your fingers." }
            sonraki: "heykel_isimler_sahne"
          - id: "kabul"
            tur: "aciga_vur"
            etiket: { tr: "Kaideye çık, heykelin yanında dur", en: "Climb the pedestal. Stand next to the statue" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, insanlik: -3 }
              - itibar: { lonca: 4, yukselenler: 3 }
              - bayrak: "heykel_kabul"
            kronik: { tr: "Kaideye çıkıp sana dikilen heykelin yanında durdun; {yer:kordon|in} kalabalığı ikinizi birlikte alkışladı.", en: "You stood next to the statue they raised to you on {yer:kordon}, and the crowd cheered for both of you." }
            sonraki: "heykel_kabul_sahne"
          - id: "sunak"
            etiket: { tr: "Sunağa izin ver, insanlar inanacak bir şey istiyor", en: "Allow the altar. People want something to believe in" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 2 }
              - itibar: { yukselenler: 6, siginak: -3 }
              - iliski: { vahit: { saygi: 5, guven: 3 } }
              - bayrak: "heykel_sunak"
              - tohum: { olay: "kordon_son_balkon", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Kaidenin başında verdiğin karardan sonra {yer:kordon} biraz değişti.", en: "After what you decided at the pedestal, {yer:kordon} changed a little." } }
            kronik: { tr: "Kendi heykelinin önüne sunak kurulmasına izin verdin; {yer:kordon|de} o sunağa ilk çiçeği bir anne bıraktı.", en: "You let them build an altar in front of your own statue on {yer:kordon}, and the first flowers left on it came from a mother." }
            sonraki: "heykel_sunak_sahne"
          - id: "yik"
            tur: "gizle"
            etiket: { tr: "Heykeli indirt, heykel istemiyorsun", en: "Have them take it down. No statue" }
            etkiler:
              - gizle: 4
              - ahlak: { insanlik: 3, duzen: -1 }
              - itibar: { lonca: -2, yukselenler: -3 }
              - bayrak: "heykel_yikildi"
            kronik: { tr: "Sana dikilen heykeli bitmeden indirttin; {yer:kordon|de} boş kalan kaide çocukların oyun yeri oldu.", en: "You had the statue they were raising to you on {yer:kordon} taken down before it was finished, and the kids played on the empty pedestal." }
            sonraki: "heykel_yik_sahne"

      - id: "heykel_isimler_sahne"
        yer: "kordon"
        paragraflar:
          - { tr: "Parmağını heykelin yüzüne bastırınca demir çamur gibi yol veriyor. İlk adı, ardından ikincisini kazıyorsun. Kalabalık susmuş; Konsey'den gelen kadın listeyi yüksek sesle okumaya başlıyor, sen de her adı onun sesine uyarak yazıyorsun.", en: "You press your finger to the statue's face and the iron gives way like clay. You carve the first name, then the second. The crowd goes quiet. The woman from the Council starts reading the list out loud, and you write each name in time with her voice." }
          - { tr: "İş bittiğinde heykelin yüzü kalmamış, yerine kırk yedi ad gelmiş. Dökümcü ağlıyor. Çocuklardan biri parmağını bir adın üstünde gezdiriyor: babasının adı.", en: "When you're done, the statue doesn't have a face. It has forty-seven names. The foundry worker is crying. One of the kids runs a finger along a name. His dad's." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "epik"
            baslik: { tr: "[Unvan kazanıldı: {yer:kordon|in} Kalkanı]", en: "[Title earned: Shield of {yer:kordon}]" }
            satirlar:
              - { tr: "Kendi heykelini başkalarına veren ilk kişi. Sistem bunu nereye yazacağını bilemedi.", en: "First person to give their own statue away. The System wasn't sure where to file this." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kaideden in", en: "Climb down off the pedestal" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 45
            sonraki: "@akis"

      - id: "heykel_kabul_sahne"
        yer: "kordon"
        paragraflar:
          - { tr: "Kaideye çıktığında kalabalık bir dalga gibi kabarıyor. Gerçek seviyen havada asılı duruyor; insanlar onu fotoğraflıyor, sayıyı kulaktan kulağa yayıyor, kimi dizlerinin üstüne çöküyor.", en: "You climb the pedestal and the crowd swells like a wave. Your true level hangs in the air. People take pictures of it, tell each other the number, and some of them go down on their knees." }
          - { tr: "Dökümcü heykelin başını o gün bitiriyor. Burnu senin burnun, gözleri senin gözlerin değil; ama ona bakan herkes seni görüyor.", en: "The foundry worker finishes the statue's head that same day. The nose isn't your nose and the eyes aren't your eyes, but everyone who looks at it sees you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷ikkat. çok fazla göz var. hepsi de insan gözü değil.", en: "c̷areful. too many eyes. and not all of them are human." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kalabalığa el salla", en: "Wave to the crowd" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 1 }
              - efsane: "tek_basina_suru"
              - xp_seviye: 40
            sonraki: "@akis"

      - id: "heykel_sunak_sahne"
        yer: "kordon"
        paragraflar:
          - { tr: "Akşam olmadan heykelin önüne bir sunak kurulmuş: beyaz bir örtü, mumlar, bir kâse Öz Kristali. Yükselenler'in ilahisi {yer:kordon} boyunca yükseliyor; her nakaratta senin adın geçiyor.", en: "Before evening there's an altar in front of the statue: a white cloth, candles, a bowl of Essence Crystals. The Ascended's hymn rises all along {yer:kordon}, your name in every chorus." }
          - { tr: "Sunağa ilk çiçeği yaşlı bir kadın bırakıyor. \"Oğlumu geri getirmesi için,\" diyor. Sana değil, heykele.", en: "The first flowers on the altar come from an old woman. \"To bring my son back,\" she says. Not to you. To the statue." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Hiçbir şey söyleme", en: "Say nothing" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - xp_seviye: 30
            sonraki: "@akis"

      - id: "heykel_yik_sahne"
        yer: "kordon"
        paragraflar:
          - { tr: "Dökümcü itiraz etmiyor; heykeli parça parça indirip demiri {yer:sanayi|e} geri yolluyor. Kaide bomboş kalıyor.", en: "The foundry worker doesn't argue. He takes the statue down piece by piece and ships the iron back to {yer:sanayi}. The pedestal stays empty." }
          - { tr: "Ertesi sabah çocuklar boş kaidenin üstüne çıkıp oyun oynuyor: biri kapı oluyor, biri canavar, biri de sen. Sen olmak için birbirleriyle kavga ediyorlar.", en: "The next morning the kids climb up on the empty pedestal and play: one's the Gate, one's the monster, one's you. They fight over who gets to be you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gülümseyip geç", en: "Smile and walk on" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 30
            sonraki: "@akis"

  # ================================================================== TUZLU SESSİZLİK (Kordon düştüyse)
  - id: "kordon_olu_bolge_seferi"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    gun: { min: 82, max: 180 }
    kosul: { bayrak: "kordon_dustu" }
    agirlik: 5
    etiketler: ["kesif", "kurtarma", "kordon", "ahlak"]
    gerilim: 4
    onemli: true
    kart: { tr: "Tuzlu sessizlik", en: "The salt quiet" }
    sahne: "olu_bolge_1"
    sahneler:
      - id: "olu_bolge_1"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon|in} sınırında, tuz kabuğunun başladığı yerde bir telsiz cızırdıyor. Ses Grand Kordon Oteli'nin çatısından geliyor: \"On iki kişiyiz. Taşmadan beri. Su bitti. Biri ısırıldı.\"", en: "At the edge of {yer:kordon}, right where the salt crust starts, a radio crackles. The voice is coming from the roof of the Grand Esplanade Hotel: \"There's twelve of us. Since the gate break. Water's gone. Somebody got bitten.\"" }
          - { tr: "Sınırda iki grup bekliyor. Bir yanda ellerinde fotoğraflarla aileler; çatıdakiler onların çocukları, kocaları. Öbür yanda sırt çantaları boş bir Lonca ekibi: onlara bakılırsa otelin kasası hâlâ dolu.", en: "There are two groups at the edge. One's families holding photos. The people on that roof are their kids, their husbands. The other's a Guild crew with empty backpacks. The hotel safe's still full, they say." }
          - metin: { tr: "Taşmadan önce {yer:kordon|i} boşaltmaya çalışmıştın. Çatıdakiler o gün kapıyı yüzüne kapatan otel çalışanları.", en: "Before the gate break, you tried to clear {yer:kordon}. The people on the roof are the hotel staff who shut their door on you that day." }
            kosul: { bayrak: "kordon_tahliye" }
          - metin: { tr: "Mendireğe kurduğun barikat hâlâ ayakta ama artık yanlış tarafta kalmış: canavarlar içeride, insanlar dışarıda.", en: "The barricade you built at the jetty is still standing, but it's on the wrong side now. The monsters are inside it. The people are out here." }
            kosul: { bayrak: "kordon_barikat" }
          - metin: { tr: "Lonca ekibinin başındaki avcı seni görünce sırıtıyor. \"Taşıyıcı! Kasa ağır; sen de ağır yük seversin herhalde.\"", en: "The hunter leading the Guild crew grins when he sees you. \"Porter! That safe's heavy. Bet you love heavy lifting.\"" }
            kosul: { gizli_fark_min: 10 }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Otelin lobisinde sekiz kıskaç var, merdiven boşluğundaysa başka bir şey: iri, ağır, aç. Çatıya çıkan tek bir yol var.", en: "There are eight crabs in the hotel lobby and something else in the stairwell, big and slow and hungry. There's only one way up to the roof." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷n iki kişi, bir kasa. sistem bu soruyu sanki özellikle sana soruyor.", en: "t̷welve people and one safe. it's like the system's asking you personally." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kasa mı? Ciddi misin? Çatıda insanlar var.\"", en: "\"The safe? Are you serious? There are people on that roof.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İkisini birden al. Ne diye seçiyorsun ki?\"", en: "\"Take both. Why are you even choosing?\"" }
        secenekler:
          - id: "cati"
            etiket: { tr: "Ailelere söz ver, çatıya git", en: "Promise the families. Head for the roof" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Bir otelin çatısında mahsur kalan on iki kişi için düşmüş {yer:kordon|e} girdin.", en: "You went into the fallen Esplanade for twelve people stranded on a hotel roof." }
            sonraki: "olu_bolge_lobi"
          - id: "kasa"
            etiket: { tr: "Lonca ekibine katıl, önce kasa", en: "Join the Guild crew. The safe comes first" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -3 }
              - itibar: { lonca: 3, siginak: -4 }
              - bayrak: "olu_bolge_kasa"
            kronik: { tr: "Düşmüş {yer:kordon|e} önce bir otel kasası için girdin; çatıdakileri bekletmeyi göze aldın.", en: "You went into the fallen Esplanade for a hotel safe first, and the people on the roof waited." }
            sonraki: "olu_bolge_lobi"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "\"İkisini de ben alırım. Burada bekleyin.\"", en: "\"I'll get both. Wait here.\"" }
            gerekli: { stat: { str: 55 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "olu_bolge_ikisi"
            kronik: { tr: "Düşmüş {yer:kordon|e} tek başına girdin; hem insanları hem kasayı çıkaracağına söz vermiştin.", en: "You went into the fallen Esplanade alone, having promised to bring out both the people and the safe." }
            sonraki: "olu_bolge_ezme"
          - id: "reddet"
            tur: "gizle"
            etiket: { tr: "Bölgeye girme, bu iş senin değil", en: "Stay out of the zone. Not your job" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -6, insanlik: -2 }
              - degisken: { hayatta_kalan: -3 }
            kronik: { tr: "Düşmüş {yer:kordon|de} bir otel çatısından yükselen yardım çağrısını duydun ama sınırdan öteye adım atmadın.", en: "You heard a call for help from a hotel roof in the fallen Esplanade, and you stayed at the edge." }
            sonraki: "@akis"

      - id: "olu_bolge_ezme"
        yer: "kordon"
        paragraflar:
          - { tr: "Lobiye adım attığında sekiz kıskaç birden sana dönüyor, bir saniye sonra hiçbiri kıpırdamıyor. Merdiven boşluğundaki iri şey seni duyup yukarı çekiliyor; kaçmak istiyor, çatıya, insanlara doğru.", en: "When you step into the lobby, eight crabs turn at once. A second later none of them are turning. The big thing in the stairwell hears you and pulls back upward. It wants out. Up. Toward the roof. Toward the people." }
          - { tr: "Merdivenlere bulaşmıyorsun. Otelin dış cephesine tırmanıp on dört katı balkondan balkona sıçrayarak çıkıyor, çatıya ondan önce varıyorsun.", en: "You don't take the stairs. You go up the outside of the hotel, fourteen floors, balcony to balcony, and you get to the roof before it does." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Çatı kapısında onu bekle", en: "Wait for it at the roof door" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kordon_lesyiyen@oyuncu+2"], ortam: ["dar_gecit"], kazan: "olu_bolge_cati", kaybet: "olu_bolge_kayip", kac: "olu_bolge_kayip" }
            kronik: { tr: "Grand Kordon Oteli'nin çatı kapısında, merdivenden çıkan şeyi tek başına karşıladın.", en: "At the roof door of the Grand Esplanade Hotel, you met the thing coming up the stairs alone." }

      - id: "olu_bolge_lobi"
        yer: "kordon"
        paragraflar:
          - { tr: "Otelin lobisi tuz kokuyor. Avize yere düşmüş, halının üstünde sekiz kıskaç dolanıyor; resepsiyonun arkasında kasa odasının kapısı aralık kalmış.", en: "The hotel lobby reeks of salt. The chandelier's on the floor and there are eight crabs on the carpet. Behind the front desk, the door to the safe room is ajar." }
          - metin: { tr: "Lonca ekibi kasa odasına yöneliyor. \"Önce bu,\" diyor başlarındaki. \"Çatı bekler. Kasa beklemez; başkası kapar.\"", en: "The Guild crew heads for the safe room. \"This first,\" their leader says. \"The roof can wait. The safe can't. Somebody else'll grab it.\"" }
            kosul: { bayrak: "olu_bolge_kasa" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Lobiyi temizle", en: "Clear the lobby" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - savas: { dusmanlar: ["mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya", "mendirek_kiskaci@dunya"], ortam: ["dar_gecit"], kazan: "olu_bolge_merdiven", kaybet: "olu_bolge_kayip", kac: "olu_bolge_kayip" }
            kronik: { tr: "Grand Kordon Oteli'nin lobisinde sekiz kıskacın üstüne yürüdün.", en: "You went straight at the eight crabs in the Grand Esplanade Hotel lobby." }

      - id: "olu_bolge_merdiven"
        yer: "kordon"
        paragraflar:
          - { tr: "Lobiye sessizlik çökmüş. Merdiven boşluğunun karanlığında iri bir şey kıpırdıyor, ağır ağır soluyor. Çatıya giden tek yol oradan geçiyor.", en: "The lobby's quiet. In the dark of the stairwell something big shifts, a heavy, slow breath. The only way up to the roof goes right past it." }
          - metin: { tr: "Kasa odasında Lonca ekibi çantaları dolduruyor. Başlarındaki sana sesleniyor: \"Gel, payını al. Çatıdakiler zaten yarı ölü.\"", en: "In the safe room the Guild crew's stuffing their packs. Their leader calls out to you: \"Come get your share. The roof people are half dead anyway.\"" }
            kosul: { bayrak: "olu_bolge_kasa" }
        secenekler:
          - id: "yukari"
            etiket: { tr: "Merdivenden yukarı çık", en: "Go up the stairs" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - savas: { dusmanlar: ["kordon_lesyiyen@oyuncu+2"], ortam: ["dar_gecit", "karanlik"], kazan: "olu_bolge_cati", kaybet: "olu_bolge_kayip", kac: "olu_bolge_kayip" }
            kronik: { tr: "Grand Kordon Oteli'nin merdiven boşluğundaki şeyle karanlıkta karşılaştın.", en: "You met the thing in the Grand Esplanade Hotel's stairwell in the dark." }
          - id: "pay"
            etiket: { tr: "Önce payını al, sonra çatı", en: "Get your cut first. Then the roof" }
            goster: { bayrak: "olu_bolge_kasa" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -3 }
              - oz_kristali: 6
              - gun: 1
              - bayrak: "olu_bolge_gec"
            kronik: { tr: "Çatıdakilere gitmeden önce otel kasasından payını aldın; düşmüş {yer:kordon|de} çatıya ancak ertesi sabah çıkabildin.", en: "In the fallen Esplanade you took your cut of the hotel safe before going up to the roof, and you didn't reach the roof until the next morning." }
            sonraki: "olu_bolge_cati_gec"

      - id: "olu_bolge_kayip"
        yer: "kordon"
        paragraflar:
          - { tr: "Karanlıkta bir şey seni bir duvara, ardından bir başkasına çarpıyor. Lobinin halısında, tuzların içinde gözünü açıyorsun; kulağında telsiz cızırdıyor: \"Duyan var mı? Duyan var mı?\"", en: "Something in the dark slams you into a wall, then another wall. You wake up on the lobby carpet in the salt with a radio crackling in your ear: \"Anybody there? Anybody?\"" }
        secenekler:
          - id: "yine"
            etiket: { tr: "Kalk. Yukarıda on iki kişi var", en: "Get up. There are twelve people up there" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - savas: { dusmanlar: ["kordon_lesyiyen@oyuncu"], ortam: ["dar_gecit"], kazan: "olu_bolge_cati", kaybet: "olu_bolge_cekilme", kac: "olu_bolge_cekilme" }
            kronik: { tr: "Düşmüş {yer:kordon|in} otelinde yere serildin ve on iki kişi için yeniden ayağa kalktın.", en: "In the hotel on the fallen Esplanade you got knocked flat, and you got back up for twelve people." }
          - id: "cekil"
            etiket: { tr: "Geri çekil, bu gece olmaz", en: "Fall back. Not tonight" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - can: 15
              - degisken: { hayatta_kalan: -2 }
            kronik: { tr: "Düşmüş {yer:kordon|in} otelinden geri çekildin; telsiz gece yarısına kadar çağırmayı sürdürdü.", en: "You fell back out of the hotel on the fallen Esplanade, and the radio kept calling until midnight." }
            sonraki: "olu_bolge_cekilme"

      - id: "olu_bolge_cekilme"
        yer: "kordon"
        paragraflar:
          - { tr: "Sınıra döndüğünde aileler önce sana, sonra telsize bakıyor. Gece yarısı telsiz susuyor; bu sessizliğin ne anlama geldiğini kimse yüksek sesle söyleyemiyor.", en: "You make it back to the edge. The families look at you, then at the radio. Around midnight the radio goes quiet. Nobody says out loud what the silence means." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sınırda sabahı bekle", en: "Wait out the night at the edge" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { hayatta_kalan: -2 }
            kronik: { tr: "Düşmüş {yer:kordon|in} otelinin çatısındakiler senin yetişemediğin bir gecede sustu.", en: "The people on the hotel roof in the fallen Esplanade went quiet on a night you couldn't get to them." }
            sonraki: "@akis"

      - id: "olu_bolge_cati"
        yer: "kordon"
        paragraflar:
          - { tr: "Çatı kapısını açtığında on iki yüz sana dönüyor: on biri ayakta, biri battaniyenin üstünde yatıyor. Adamın kolunda bir ısırık var, çevresi tuz kabuğu bağlamış.", en: "When you push open the roof door, twelve faces turn toward you. Eleven are standing. One's lying on a blanket with a bite on his arm and a crust of salt around it." }
          - { tr: "\"Kabuk bağlıyor,\" diyor bir kadın. \"Önce kol, sonra omuz. İki gün önce bir başkasına da olmuştu; sonra o... o da kıskaçlara karıştı.\"", en: "\"It's crusting over,\" a woman says. \"First the arm, then the shoulder. It happened to someone else two days ago. Then he... he went over to the crabs.\"" }
          - metin: { tr: "Merdivenden ayak sesleri geliyor: kasayı boşaltan Lonca ekibi, çantaları ağır, nefes nefese yukarı çıkıyor.", en: "Footsteps on the stairs: the Guild crew, done with the safe, coming up out of breath with heavy packs." }
            kosul: { bayrak: "olu_bolge_kasa" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Isırığın tuzu daha omza varmamış. Kolu şimdi alırsan adam yaşar; bir saat geç kalırsan yaşamaz.", en: "The salt hasn't reached the shoulder yet. Take the arm now and he lives. Take it in an hour and he doesn't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷abuk dediğin öz. ben özü yerim. biliyorsun.", en: "t̷hat crust is essence. i eat essence. you know that." }
        secenekler:
          - id: "kol"
            etiket: { tr: "Kolu şimdi kes, adam yaşasın", en: "Take the arm now. Let him live" }
            gerekli: { stat: { wis: 35 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "olu_bolge_herkes"
            kronik: { tr: "Grand Kordon Oteli'nin çatısında bir adamın kolunu kestin; on iki kişinin on ikisi de aşağı indi.", en: "On the roof of the Grand Esplanade Hotel you took a man's arm, and all twelve of the twelve made it down." }
            sonraki: "olu_bolge_inis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} kabuğu yedir", en: "Let {npc:yanki} eat the crust" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: -3 }
              - dikkat: 4
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
              - degisken: { hayatta_kalan: 4 }
              - bayrak: "olu_bolge_herkes"
            kronik: { tr: "Düşmüş {yer:kordon|de} bir adamın tuzunu {npc:yanki|e} yedirdin; adam kıskaca dönüşmekten kurtuldu.", en: "On the fallen Esplanade you saved a man from turning into a crab by feeding his salt to {npc:yanki}." }
            sonraki: "olu_bolge_inis"
          - id: "birak"
            etiket: { tr: "Onu bırak, on bir kişiyi indir", en: "Leave him. Take the other eleven down" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "Grand Kordon Oteli'nin çatısında ısırılan adamı bırakıp on bir kişiyi indirdin.", en: "On the roof of the Grand Esplanade Hotel you left the bitten man behind and brought eleven people down." }
            sonraki: "olu_bolge_inis"

      - id: "olu_bolge_cati_gec"
        yer: "kordon"
        paragraflar:
          - { tr: "Çatıya ertesi sabah çıkıyorsun. On bir yüz sana dönüyor. Battaniyenin üstünde yatan on ikinci adam yok; battaniyede yalnızca tuz ve bir çift ayakkabı kalmış.", en: "You reach the roof the next morning. Eleven faces turn toward you. The twelfth, the man on the blanket, is gone. There's nothing on the blanket but salt and a pair of shoes." }
          - { tr: "Kimse ağzını açmıyor. Çantandaki kristallerin ağırlığını sırtında hissediyorsun.", en: "Nobody says anything. You can feel the weight of the crystals in your pack." }
        secenekler:
          - id: "inis"
            etiket: { tr: "On bir kişiyi indir", en: "Bring the eleven down" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - degisken: { hayatta_kalan: 2 }
            kronik: { tr: "Düşmüş {yer:kordon|in} otelinin çatısından on bir kişiyi indirdin; on ikincisi gecikmenin bedeli oldu.", en: "You brought eleven people down off the hotel roof on the fallen Esplanade. The twelfth was what your delay cost." }
            sonraki: "olu_bolge_inis"

      - id: "olu_bolge_inis"
        yer: "kordon"
        paragraflar:
          - { tr: "Tuz kabuğunun sınırına vardığınızda aileler koşarak geliyor. Fotoğraflar yere düşüyor; artık kimsenin fotoğrafa ihtiyacı kalmamış.", en: "When you reach the edge of the salt crust, the families run. Photos fall on the ground. Nobody needs a photo anymore." }
          - metin: { tr: "Lonca ekibi çantaları dolu, arkadan geliyor. Başlarındaki, ailelerin önünde, herkesin göreceği biçimde kasadan çıkma bir avuç kristali sana uzatıyor.", en: "The Guild crew comes up behind you with full packs. Their leader holds out a handful of crystals from the safe to you, in front of the families, where everybody can see." }
            kosul: { bayrak: "olu_bolge_kasa", bayrak_yok: "olu_bolge_gec" }
          - metin: { tr: "Sırtında otelin kasası var; menteşeleriyle birlikte koca kasa. Lonca ekibi onu omzunda görünce uzun süre dili tutulmuş kalıyor.", en: "The hotel safe is on your back. The whole safe, hinges and all. The Guild crew sees it on your shoulder and can't say anything for a long time." }
            kosul: { bayrak: "olu_bolge_ikisi" }
        secenekler:
          - id: "ailelere"
            etiket: { tr: "Kasanın içindekini ailelere dağıt", en: "Split what's in the safe among the families" }
            goster: { bayrak: "olu_bolge_ikisi" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - xp_seviye: 70
            kronik: { tr: "Düşmüş {yer:kordon|den} sırtında çıkardığın otel kasasını çatıdakilerin ailelerine dağıttın.", en: "You split the hotel safe you hauled out of the fallen Esplanade among the families of the people on the roof." }
            sonraki: "@akis"
          - id: "loncaya"
            etiket: { tr: "Kasayı Lonca'ya ver, anlaşma anlaşmadır", en: "Give the safe to the Guild. A deal's a deal" }
            goster: { bayrak: "olu_bolge_ikisi" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - xp_seviye: 70
            kronik: { tr: "Düşmüş {yer:kordon|den} hem insanları hem kasayı çıkardın ve kasayı Lonca'ya teslim ettin.", en: "You brought both the people and the safe out of the fallen Esplanade, and handed the safe over to the Guild." }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Kristalleri al", en: "Take the crystals" }
            goster: { bayrak: "olu_bolge_kasa", bayrak_yok: "olu_bolge_gec" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -1 }
              - oz_kristali: 4
              - itibar: { lonca: 2, siginak: -3 }
              - xp_seviye: 60
            kronik: { tr: "Kurtardığın insanların ailelerinin önünde Lonca'dan otel kasasının payını aldın.", en: "In front of the families of the people you'd saved, you took your share of the hotel safe from the Guild." }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "Kristalleri geri it", en: "Push the crystals back" }
            goster: { bayrak: "olu_bolge_kasa", bayrak_yok: "olu_bolge_gec" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - itibar: { siginak: 3, lonca: -2 }
              - xp_seviye: 60
            kronik: { tr: "Kurtardığın insanların ailelerinin önünde Lonca'nın uzattığı parayı geri ittin.", en: "In front of the families of the people you'd saved, you pushed the Guild's money back." }
            sonraki: "@akis"
          - id: "tamam"
            etiket: { tr: "Ailelerin arasında bir süre dur", en: "Stand with the families a while" }
            goster: { bayrak_yok: ["olu_bolge_ikisi", "olu_bolge_kasa"] }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - itibar: { siginak: 4 }
              - xp_seviye: 60
              - tohum: { olay: "kordon_son_balkon", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Tuzlu sessizliğe yaptığın seferden sonra ailelerin yüzü aklından çıkmıyor.", en: "Since your run into the salt silence, you can't stop seeing the families' faces." } }
            kronik: { tr: "Düşmüş {yer:kordon|den} çıkardığın insanların aileleriyle sınırda, tuzun bittiği yerde durdun.", en: "You stood with the families of the people you'd brought out of the fallen Esplanade, right where the salt ended." }
            sonraki: "@akis"
          - id: "tamam2"
            etiket: { tr: "Yürü", en: "Walk" }
            goster: { bayrak: "olu_bolge_gec" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - xp_seviye: 40
            kronik: { tr: "Düşmüş {yer:kordon|den} dönerken çantandaki kristallerin ağırlığı omuzlarına çöktü.", en: "Walking out of the fallen Esplanade, you felt the weight of the crystals in your pack settle on your shoulders." }
            sonraki: "@akis"

  # ================================================================== ÇAKALLAR (Eski Şehir kapı avcıları; keşif)
  - id: "eski_sehir_kapi_avcilari"
    konum: ["eski_sehir"]
    perde: [2]
    bolge: ["eski_sehir"]
    gun: { min: 38, max: 170 }
    agirlik: 5
    etiketler: ["kesif", "kapi", "hakimiyet", "eski_sehir"]
    gerilim: 3
    kart: { tr: "Hamamdaki kapı", en: "The Gate in the bathhouse" }
    sahne: "cakal_1"
    sahneler:
      - id: "cakal_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} dar sokaklarında, kubbelerini yosun basmış tarihi hamamın kapısından buhar sızıyor. İçeride, göbek taşının tam üstünde bir kapı açılmış: D kademesi, kenarları kaynar su gibi fokurduyor.", en: "Down the narrow streets of {yer:eski_sehir}, steam is leaking out the door of the old Victorian bathhouse with the moss-covered domes. Inside, right over the big heated slab in the steam room, a Gate has opened: D grade, its edges bubbling like boiling water." }
          - { tr: "Kapının önünde, ceketlerinin sırtında diş gösteren bir çakal resmi taşıyan beş genç bekliyor. Liderleri on dokuz yaşlarında bir kız: eski bir kurye ceketi, bisiklet kaskı, elinde boya kalemiyle çizilmiş bir hamam planı.", en: "There are five teenagers in front of the Gate, a snarling jackal painted on the backs of their jackets. Their leader's a girl of about nineteen: old courier jacket, bike helmet, a floor plan of the bathhouse drawn in marker in her hand." }
          - metin: { tr: "Kız seni görür görmez tanıyıp planı katlıyor. \"Gelmişsin,\" diyor. \"Konteyner limanındaki sandığı bize bırakan sendin. Bu sefer yüzde beşten fazlası var.\"", en: "The girl recognizes you and folds up her plan. \"You came,\" she says. \"You're the one who let us have that crate at the container yard. This time it's more than five percent.\"" }
            kosul: { bayrak: "cakallara_sandik" }
          - metin: { tr: "Kız görünen seviyene bakıp gülüyor. \"Biz de taşıyıcı arıyorduk zaten. Yüzde beş; ağırları sen taşırsın, kimse de sana dadılık etmez. Anlaştık mı?\"", en: "The girl glances at the level you're showing and laughs. \"We needed a porter anyway. Five percent, you carry the heavy stuff, and nobody has to babysit you. Deal?\"" }
            kosul: { gizli_fark_min: 10, bayrak_yok: "cakallara_sandik" }
          - metin: { tr: "Kız seni görünce donakalıyor. Elindeki plan titriyor, ekibin geri kalanı birbirine bakıyor. \"Bu bizim kapımız,\" diyor sonunda incecik bir sesle. \"Biz bulduk. Lütfen.\"", en: "The girl sees you and freezes. The plan in her hand is shaking, and the rest of the crew looks at each other. \"This is our Gate,\" she finally says, voice gone thin. \"We found it. Please.\"" }
            kosul: { gorunen_seviye_min: 40, bayrak_yok: "cakallara_sandik" }
          - metin: { tr: "Ekipte tanıdık bir yüz var: çarşıdaki cam köprüde ağabeyinin yanında duran on beş yaşındaki çocuk. Sana bakıp başını eğiyor; utançtan değil, saygıdan.", en: "There's a face you know on the crew: the fifteen-year-old who used to stand next to his big brother on the skybridge at the mall. He looks at you and dips his head. Not ashamed. Respectful." }
            kosul: { bayrak: "cete_oglan_kurtuldu" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "siradan"
            baslik: { tr: "Çakallar", en: "The Jackals" }
            satirlar:
              - { tr: "Lider: Sv. 24 · Ekip ortalaması: Sv. 17 · Kapı: D kademesi, tavsiye edilen Sv. 35+", en: "Leader: Lv. 24 · Crew average: Lv. 17 · Gate: D grade, recommended Lv. 35+" }
            kosul: { stat: { per: 30 } }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Kapının içinde, buharın derinliklerinde bir taş nefes alıyor. Bu kapının patronu göbek taşının ta kendisi; Çakalların bundan haberi yok.", en: "Inside the Gate, deep in the steam, a stone is breathing. The boss of this Gate is the steam-room slab itself. The Jackals don't know that." }
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Kız ekibini kapıya sokacak; paraya ihtiyaçları var, kardeşleri aç. Kendisinin öleceği aklına gelmiyor, yalnızca ötekilerin.", en: "She's going to take her crew in. They need the money, their little brothers and sisters are hungry. She's not afraid she'll die. Only the others." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni küçümsüyorlar. bundan zevk alacağını biliyorum. ben de alacağım.", en: "t̷hey're underestimating you. i know you're going to enjoy this. so am i." }
        secenekler:
          - id: "tasiyici"
            tur: "gizle"
            etiket: { tr: "Yüzde beşi kabul et, taşıyıcı ol", en: "Take the five percent. Be the porter" }
            etkiler:
              - gizle: 3
              - bayrak: "cakallar_tanisildi"
              - bayrak: "cakallar_tasiyici"
            sonraki: "cakal_iceri"
          - id: "liderlik"
            etiket: { tr: "Bu kapının onlara göre olmadığını söyle", en: "Tell them this Gate is out of their league" }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "cakallar_tanisildi"
            sonraki: "cakal_iceri"
          - id: "tek"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni göster, arkanda dursunlar", en: "Show your true level. Stay behind me" }
            etkiler:
              - aciga_vur: true
              - bayrak: "cakallar_tanisildi"
              - bayrak: "cakallar_onunde"
              - ahlak: { duzen: 2 }
            sonraki: "cakal_aciga"
          - id: "lonca"
            etiket: { tr: "Kapıyı Lonca'ya bildir, bu çocuk oyuncağı değil", en: "Report the Gate to the Guild. It's no kids' game" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "cakallar_ihbar"
            sonraki: "cakal_lonca"

      - id: "cakal_aciga"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Pencereni açıyorsun; bu kez tek bir satırı bile saklamıyorsun. Hamamın buharı gerçek seviyenin ışığında maviye kesiyor.", en: "You open your window and this time you don't hide a single line. The bathhouse steam turns blue in the glow of your true level." }
          - { tr: "Kurye ceketli kız sayıyı okuyor, bir daha okuyor, sonra kaskını çıkarıyor; sanki kaskla okunacak bir şey değilmiş gibi. Ekibin en küçüğü dizlerinin üstüne çöküveriyor.", en: "The girl in the courier jacket reads the number, reads it again and takes off her helmet, like it's not something you read with a helmet on. The youngest one on the crew sinks to his knees." }
        secenekler:
          - id: "iceri"
            etiket: { tr: "\"Kalk. Kapıya giriyoruz.\"", en: "\"Get up. We're going in.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
            sonraki: "cakal_iceri"

      - id: "cakal_iceri"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kapının ardında sonu gelmeyen bir hamam uzanıyor: kubbe kubbeyi, kurna kurnayı izliyor; mermerler kaynar, buhar öyle yoğun ki elini göremiyorsun. Buharın içinde birtakım şekiller kıvrılıyor.", en: "Past the Gate there's a bathhouse that never ends: dome after dome, basin after basin, marble too hot to touch, steam so thick you can't see your own hand. Shapes are coiling in it." }
          - metin: { tr: "Kız sana içi taş doluymuş gibi ağır bir sırt çantası uzatıyor. \"Kristaller buraya. Sen arkada kal, taşıyıcı.\" Ekibin geri kalanı borularını kaldırıp buhara dalıyor.", en: "The girl hands you a backpack, heavy like it's full of rocks. \"Crystals go in here. You stay in the back, porter.\" The rest of the crew raises their pipes and plunges into the steam." }
            kosul: { bayrak: "cakallar_tasiyici" }
          - metin: { tr: "Ekip arkanda, mabede girmiş gibi sessiz. Kız bir an yanına sokuluyor. \"Bize bakarsan,\" diyor, \"öğrenebiliriz.\"", en: "The crew's behind you, quiet, like they're in church. The girl comes up beside you for a second. \"If you let us watch,\" she says, \"we could learn.\"" }
            kosul: { bayrak: "cakallar_onunde" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Buharın içindekileri karşıla", en: "Meet what's in the steam" }
            etkiler:
              - savas: { dusmanlar: ["hamam_buhar_hayaleti@dunya-12", "hamam_buhar_hayaleti@dunya-12"], ortam: ["dar_gecit", "karanlik"], kazan: "cakal_gobek", kaybet: "cakal_kayip", kac: "cakal_kayip" }

      - id: "cakal_gobek"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Buhar hayaletleri dağılınca en büyük kubbenin altında göbek taşı beliriyor: yatak kadar geniş, kıpkızıl, ortasında yürek gibi atan bir çatlak. Derken taş ayağa kalkıyor.", en: "The steam wraiths come apart, and under the biggest dome the slab is revealed: as big as a bed, glowing red, a crack in the middle beating like a heart. The stone stands up." }
          - metin: { tr: "\"Çekilin! Bu bizim!\" diye bağıran kurye ceketli kız borusunu kaldırıp ileri atılıyor. Taş onu sinek gibi kenara savuruyor; kız mermerin üstünde kıpırdamadan yatıyor.", en: "The girl in the courier jacket yells, \"Back off! This one's ours!\" and charges with her pipe raised. The stone swats her aside like a fly, and she lies still on the marble." }
            kosul: { bayrak: "cakallar_tasiyici" }
          - metin: { tr: "Ekip arkanda donup kalmış. Taş seni tanıyor; attığı ilk adım geriye doğru.", en: "The crew's frozen behind you. The stone recognizes you. Its first step is backward." }
            kosul: { bayrak_yok: "cakallar_tasiyici" }
        secenekler:
          - id: "maske_dus"
            tur: "aciga_vur"
            etiket: { tr: "Sırt çantasını bırak, taşıyıcı maskesini at", en: "Drop the backpack. Drop the porter act" }
            goster: { bayrak: "cakallar_tasiyici" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 3 }
              - savas: { dusmanlar: ["hamam_gobek_tasi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "cakal_zafer", kaybet: "cakal_kayip", kac: "cakal_kayip" }
          - id: "bitir"
            etiket: { tr: "Taşı ortasından kır", en: "Break the stone down the middle" }
            goster: { bayrak_yok: "cakallar_tasiyici" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["hamam_gobek_tasi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "cakal_zafer", kaybet: "cakal_kayip", kac: "cakal_kayip" }
          - id: "ogret"
            etiket: { tr: "Onlar dövüşsün, sen yalnızca yönlendir", en: "Let them fight it. You just call the moves" }
            goster: { bayrak_yok: "cakallar_tasiyici" }
            gerekli: { stat: { int: 40 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "cakallar_ogrendi"
              - savas: { dusmanlar: ["hamam_gobek_tasi@oyuncu-10%"], ortam: ["dar_gecit"], kazan: "cakal_zafer", kaybet: "cakal_kayip", kac: "cakal_kayip" }

      - id: "cakal_kayip"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Buhar ciğerlerini dolduruyor, mermer yüzüne çarpıyor. Biri seni ayak bileklerinden tutup sürüklüyor; gözünü açtığında hamamın kapısının önündesin, Çakallar kaskları yamulmuş hâlde başına toplanmış.", en: "The steam fills your lungs and the marble comes up to meet your face. Somebody grabs you by the ankles and drags. When you open your eyes you're outside the bathhouse door, the Jackals around you, their helmets crooked." }
          - { tr: "\"Taşıyıcımızı biz taşıdık,\" diyor kız nefes nefese. Gülmeye çalışıyor ama beceremiyor.", en: "\"We carried our porter,\" the girl says, panting. She tries to laugh. It doesn't come." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kalk, bugünlük bu kadar", en: "Get up. That's it for today" }
            etkiler:
              - can: 15
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "cakal_zafer"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Göbek taşı ortasından ikiye ayrılıyor, içinden bir avuç kızıl kristal dökülüyor. Kubbelerdeki buhar bir anda soğuyup yağmur olup iniyor.", en: "The slab splits down the middle and a handful of red crystals spill out of it. The steam in the domes goes cold all at once and comes down like rain." }
          - metin: { tr: "Kız başını tutarak mermerin üstünde doğruluyor. Taşıyıcısının göbek taşını iki yumrukta ikiye böldüğünü görüyor; ağzını açmıyor, söyleyecek söz bulamıyor.", en: "The girl sits up on the marble, holding her head. She watches her porter split the slab in two with two punches, and she doesn't say anything. She can't find anything to say." }
            kosul: { bayrak: "cakallar_tasiyici" }
          - metin: { tr: "Çakallar senin yönlendirmenle taşı deviriyor; borularla, kasklarla, tencere kapaklarıyla, bolca da çığlıkla. İş bitince beşi birden mermerin üstüne çöküp nefes nefese gülüyor, ölmedikleri için.", en: "The Jackals bring the stone down on your call, with pipes and helmets and pot lids and a whole lot of yelling. When it's over all five of them sit down on the marble and laugh, out of breath, because they're not dead." }
            kosul: { bayrak: "cakallar_ogrendi" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kapı kapatıldı: Hamam · D]", en: "[Gate closed: Bathhouse · D]" }
            satirlar:
              - { tr: "Katkı oranları hesaplandı. Bir katılımcının katkısı diğerlerinin toplamını aşıyor.", en: "Contribution shares calculated. One participant's contribution exceeds all others combined." }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Ganimetin hepsini onlara bırak", en: "Leave them all of the loot" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - bayrak: "cakallar_ganimet_onlarda"
              - gunluk: { kapi: 1 }
              - xp_seviye: 50
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 8, max: 15 }, hatirlatma: { tr: "Hamamdaki kapıdan sonra Çakallar'ın adı sokaklarda dolaşıyor.", en: "Since the Gate in the bathhouse, the Jackals' name has been going around the streets." } }
            sonraki: "cakal_son"
          - id: "pay"
            etiket: { tr: "Hakkını al, yüzde beşi değil", en: "Take your fair share. Not five percent" }
            etkiler:
              - ahlak: { duzen: 3 }
              - esya: { hamam_kristali: 1 }
              - oz_kristali: 2
              - gunluk: { kapi: 1 }
              - xp_seviye: 50
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 8, max: 15 }, hatirlatma: { tr: "Hamamdaki kapıdan sonra Çakallar'ın adı sokaklarda dolaşıyor.", en: "Since the Gate in the bathhouse, the Jackals' name has been going around the streets." } }
            sonraki: "cakal_son"
          - id: "bayrak"
            etiket: { tr: "Onları sancağının altına al", en: "Take them under your banner" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - ordu: { lonca_avcisi: 3 }
              - bayrak: "cakallar_sancakta"
              - gunluk: { kapi: 1 }
              - xp_seviye: 50
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 8, max: 15 }, hatirlatma: { tr: "Hamamdaki kapıdan sonra Çakallar'ın adı sokaklarda dolaşıyor.", en: "Since the Gate in the bathhouse, the Jackals' name has been going around the streets." } }
            sonraki: "cakal_son"

      - id: "cakal_lonca"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bir saat sonra turuncu kol bantlı on avcı hamamın kapısına dayanmış. Çakalları kenara itiyorlar; içlerinden biri kızın kaskını başından çekip sokağa fırlatıyor. \"Bölge Lonca'nın,\" diyor. \"Kapılar da.\"", en: "An hour later ten hunters in orange armbands are at the bathhouse door. They shove the Jackals aside, and one of them pulls the girl's helmet off and tosses it into the street. \"This region's the Guild's,\" he says. \"So are the Gates.\"" }
          - { tr: "Kız kaskını almak için eğiliyor. Doğrulunca uzun uzun sana bakıyor ama tek söz etmiyor.", en: "The girl bends down to pick up her helmet. When she straightens up she looks at you for a long time, but she doesn't say a thing." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Doğru olanı yaptın, yürü", en: "You did the right thing. Walk" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 20
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 8, max: 15 }, hatirlatma: { tr: "Hamamdaki kapıdan sonra Çakallar'ın adı sokaklarda dolaşıyor.", en: "Since the Gate in the bathhouse, the Jackals' name has been going around the streets." } }
            sonraki: "@akis"

      - id: "cakal_son"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Hamamın dışında kız sırt çantasını ters çevirip boşaltıyor; kaldırıma bir avuç dere taşı dökülüyor. Baştan beri taş taşımışsın. \"Taşıyıcıyı denemek için koymuştuk,\" diyor. \"Herkes taşır. Sen sormadın bile.\"", en: "Outside the bathhouse the girl turns the backpack upside down and shakes it out. A handful of river rocks clatters onto the pavement. You've been hauling rocks the whole time. \"We stuff it to test the porters,\" she says. \"Everybody carries it. You didn't even ask.\"" }
            kosul: { bayrak: "cakallar_tasiyici" }
          - metin: { tr: "Çakallar ceketlerinin sırtındaki çakalın yanına yeni bir şey boyuyor: senin işaretini. Yüzleri hâlâ isli, gözleri pırıl pırıl.", en: "The Jackals paint something new next to the jackal on the backs of their jackets: your mark. Their faces are still sooty. Their eyes are bright." }
            kosul: { bayrak: "cakallar_sancakta" }
          - { tr: "{yer:eski_sehir|in} sokaklarına akşam çöküyor. Hamamın kubbelerinden son buhar tütüyor; bu sefer sıradan bir buhar.", en: "Evening comes down over the streets of {yer:eski_sehir}. The last of the steam rises from the bathhouse domes. Just steam this time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onlara iyi geceler dile", en: "Wish them a good night" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Çakallar geri dönüyor (tohum)
  - id: "kapi_avcilari_donus"
    konum: ["eski_sehir"]
    perde: [2]
    agirlik: 1
    etiketler: ["kapi", "eski_sehir", "ahlak"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Çakal başı", en: "The jackal's head" }
    sahne: "cakal_donus_1"
    sahneler:
      - id: "cakal_donus_1"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Şehrin neresinde olursan ol, Çakallar seni buluyor: beşi birden, başlarında yeni kasklar, sırtlarında yeni ceketler. Kız sana bir Sistem penceresi gösteriyor: [Kapı kapatıldı: Eski Çarşı · D]. \"Kendi başımıza,\" diyor. \"Senin gösterdiğin gibi.\"", en: "Wherever you are in the city, the Jackals find you, all five of them, new helmets, new jackets. The girl shows you a System window: [Gate closed: Old Market · D]. \"On our own,\" she says. \"The way you showed us.\"" }
            kosul: { bayrak: "cakallar_ogrendi" }
          - metin: { tr: "Çakallar, ceketlerinin sırtında senin işaretinle seni buluyor. Arkalarında altı yeni yüz var. \"Sancağının altına girmek isteyenler,\" diyor kız. \"Adını duymuşlar.\"", en: "The Jackals find you, your mark on the backs of their jackets. There are six new faces behind them. \"People who want under your banner,\" the girl says. \"They heard your name.\"" }
            kosul: { bayrak: "cakallar_sancakta", bayrak_yok: "cakallar_ogrendi" }
          - metin: { tr: "Bir sabah {yer:eski_sehir|in} bir sokağında dört Çakal'la karşılaşıyorsun. Beşincileri, kurye ceketli kız aralarında yok. Ekibin en küçüğü onun kaskını kucağında taşıyor.", en: "One morning in an {yer:eski_sehir} street you run into four of the Jackals. The fifth, the girl in the courier jacket, isn't with them. The youngest is carrying her helmet in his arms." }
            kosul: { bayrak_yok: ["cakallar_ogrendi", "cakallar_sancakta", "cakallar_ihbar"] }
          - metin: { tr: "\"Hamamdan sonra kendimize güvendik,\" diyor oğlan. \"Bir kapı daha bulduk. O... ilk girdi. Hep ilk girerdi.\"", en: "\"After the bathhouse we thought we could handle it,\" the kid says. \"We found another Gate. She... went in first. She always went in first.\"" }
            kosul: { bayrak_yok: ["cakallar_ogrendi", "cakallar_sancakta", "cakallar_ihbar"] }
          - metin: { tr: "Çakallar {yer:sanayi|e} giden yolda karşına çıkıyor, kollarında turuncu bantlar. Kız bandını gösteriyor. \"Lonca'ya katıldık,\" diyor. \"Başka kapı yoktu. Sağ ol herhalde.\"", en: "The Jackals catch you on the road to {yer:sanayi}, wearing orange armbands. The girl shows you hers. \"We joined the Guild,\" she says. \"There wasn't any other way in. Thanks, I guess.\"" }
            kosul: { bayrak: "cakallar_ihbar" }
          - metin: { tr: "Ekipte yeni bir yüz var: {yer:eski_sehir|in} okulundaki öğrenci, uğruna bir canavarı tuttuğun oğlan. Borusunu doğru tutuyor.", en: "There's a new face on the crew: the student from the {yer:eski_sehir} school, the boy you held a monster down for. He holds his pipe the right way." }
            kosul: { bayrak: "seviye_birler_vurus" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷enin gibi olmak istiyorlar. kimse onlara senin gibi olmanın ne demek olduğunu anlatmadı.", en: "t̷hey want to be like you. nobody's told them what that actually means." }
        secenekler:
          - id: "ovgu"
            etiket: { tr: "Onları öv, hak ettiler", en: "Praise them. They earned it" }
            goster: { bayrak: "cakallar_ogrendi" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - itibar: { siginak: 2, lonca: 2 }
              - xp_seviye: 20
            kronik: { tr: "Kapı kapatmayı öğrettiğin Çakallar {yer:eski_sehir|de} kendi başlarına bir kapı kapatıp geldiler; onları gönül rahatlığıyla övdün.", en: "The Jackals you'd taught to close Gates came back having closed one in {yer:eski_sehir} on their own, and you praised them without holding back." }
            sonraki: "cakal_donus_son"
          - id: "kabul"
            etiket: { tr: "Yenileri de al", en: "Take the new ones too" }
            goster: { bayrak: "cakallar_sancakta" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - ordu: { lonca_avcisi: 4 }
              - dikkat: 2
              - xp_seviye: 20
            kronik: { tr: "Adını duyup gelen gençleri de sancağının altına aldın; sancağın gölgesi biraz daha uzadı.", en: "You took the kids who'd come because they heard your name under your banner too, and its shadow grew a little longer." }
            sonraki: "cakal_donus_son"
          - id: "geri_cevir"
            etiket: { tr: "Yenileri evlerine gönder", en: "Send the new ones home" }
            goster: { bayrak: "cakallar_sancakta" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - xp_seviye: 15
            kronik: { tr: "Sancağının altına girmek isteyen çocukları, dinleyip dinlemeyeceklerini bilmeden evlerine yolladın.", en: "You sent the kids who wanted under your banner back home, with no way of knowing if they'd listen." }
            sonraki: "cakal_donus_son"
          - id: "kask"
            etiket: { tr: "Kaskı al, o kapıyı kapat", en: "Take the helmet. Close that Gate" }
            goster: { bayrak_yok: ["cakallar_ogrendi", "cakallar_sancakta", "cakallar_ihbar"] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - savas: { dusmanlar: ["hamam_buhar_hayaleti@dunya+20", "hamam_buhar_hayaleti@dunya+20"], ortam: ["dar_gecit"], kazan: "cakal_donus_kask", kaybet: "cakal_donus_son", kac: "cakal_donus_son" }
            kronik: { tr: "Kurye ceketli kızı yutan kapıya onun kaskını alıp girdin.", en: "You took the helmet of the girl in the courier jacket and went into the Gate that swallowed her." }
          - id: "yas"
            etiket: { tr: "Onlarla otur, tek söz etme", en: "Sit with them. Don't say anything" }
            goster: { bayrak_yok: ["cakallar_ogrendi", "cakallar_sancakta", "cakallar_ihbar"] }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - degisken: { hayatta_kalan: -1 }
            kronik: { tr: "Liderlerini yitiren Çakallar'la bir kaldırıma oturdun; ağzından tek söz çıkmadı.", en: "You sat on a curb with the Jackals after they lost their leader, and you didn't say a thing." }
            sonraki: "cakal_donus_son"
          - id: "lonca_iyi"
            etiket: { tr: "\"Lonca'da yaşarsınız. Bu yeter.\"", en: "\"You'll live, in the Guild. That's enough.\"" }
            goster: { bayrak: "cakallar_ihbar" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            kronik: { tr: "Çakallar'ı Lonca'ya sen ittin ve bunun doğru olduğuna inandın.", en: "You were the one who pushed the Jackals into the Guild, and you believed it was right." }
            sonraki: "cakal_donus_son"
          - id: "lonca_ozur"
            etiket: { tr: "Onlardan özür dile", en: "Apologize to them" }
            goster: { bayrak: "cakallar_ihbar" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
            kronik: { tr: "Kapılarını Lonca'ya ihbar ettiğin gençlerden özür diledin.", en: "You apologized to the kids whose Gate you'd reported to the Guild." }
            sonraki: "cakal_donus_son"

      - id: "cakal_donus_kask"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kapının içinde, bir kurnanın kenarında kızın borusunu buluyorsun; kendisini değil. Çıkarken boruyu da yanına alıyorsun.", en: "Inside the Gate you find the girl's pipe at the edge of a basin. Not her. You take the pipe with you on the way out." }
          - { tr: "Kaskla boruyu ekibin en küçüğüne veriyorsun. Kaskı takıyor ama başına bol geliyor. \"Büyüyünce olur,\" diyor biri. Önce kimse gülmüyor, sonra hepsi birden gülüyor.", en: "You give the helmet and the pipe to the youngest on the crew. He puts the helmet on. It's way too big. \"He'll grow into it,\" somebody says. Nobody laughs. Then they all do." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onları yalnız bırak", en: "Leave them be" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - gunluk: { kapi: 1 }
              - xp_seviye: 40
            kronik: { tr: "Kurye ceketli kızın kaskıyla borusunu Çakallar'ın en küçüğüne teslim ettin.", en: "You handed the courier girl's helmet and pipe to the youngest of the Jackals." }
            sonraki: "@akis"

      - id: "cakal_donus_son"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Çakallar {yer:eski_sehir|in} sokaklarında gözden kayboluyor; köşeyi dönerlerken ceketlerinin sırtındaki çakal sana dişlerini gösteriyor.", en: "The Jackals disappear into the streets of {yer:eski_sehir}. As they turn the corner, the jackal on the backs of their jackets shows you its teeth." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Çakallar'ın {yer:eski_sehir|in} sokaklarında yazdığı hikâyenin bir yerinde sen de vardın.", en: "Somewhere in the Jackals' story in {yer:eski_sehir}, there was you." }
            sonraki: "@akis"

  # ================================================================== FIRININ ÖNÜ (Kasaba Çekirdeği kuralları)
  - id: "eski_sehir_ekmek_kuyrugu"
    konum: ["eski_sehir"]
    perde: [2]
    bolge: ["eski_sehir"]
    gun: { min: 61, max: 180 }
    agirlik: 6
    etiketler: ["cekirdek", "ahlak", "eski_sehir"]
    gerilim: 3
    onemli: true
    kart: { tr: "Fırının önü", en: "Outside the bakery" }
    sahne: "ekmek_1"
    sahneler:
      - id: "ekmek_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} son taş fırını sabahın beşinde açılıyor ama kuyruk dörtte başlıyor. Fırıncının Sistem'den aldığı meslek ekmeğe bir şey katmış: sıcak somundan bir ısırık alınca kesikler kapanıyor, ateş düşüyor.", en: "{yer:eski_sehir|pos} last wood-fired bakery opens at five in the morning, and the line starts at four. The profession the baker got from the System put something into his bread: bite into a warm loaf and cuts close up, fevers come down." }
          - { tr: "Bu sabah kuyruğun başında bir kalabalık birikmiş. Ortada, kucağında üç somunla on iki yaşlarında bir kız duruyor; biri elini kızın ensesine geçirmiş. Fırıncı elinde küreğiyle kapının eşiğinde ne yapacağını bilemiyor.", en: "This morning there's a crowd at the front of the line. In the middle of it, a girl of about twelve with three loaves in her arms and somebody's hand on the back of her neck. The baker stands in the doorway with his peel, not sure what to do." }
          - metin: { tr: "Kızın başının üstünde Çekirdek'in kural penceresi asılı, üstünde Lonca'nın mührü: [Bölge Kuralı · Hırsızlık: bir hafta zorunlu kapı hamallığı]. Turuncu kol bantlı bir avcı kızın ensesini bırakmıyor.", en: "The Core's rule window hangs over the girl's head with the Guild's stamp on it: [Regional Rule · Theft: one week mandatory Gate porterage]. A hunter in an orange armband won't let go of her neck." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kızın başının üstünde Çekirdek'in kural penceresi asılı, üstünde Konsey'in mührü: [Bölge Kuralı · Hırsızlık: Konsey önünde duruşma, bir hafta pay kesintisi]. Duruşma üç gün sonra ama kalabalığın beklemeye niyeti yok.", en: "The Core's rule window hangs over the girl's head with the Council's seal: [Regional Rule · Theft: hearing before the Council, one week ration cut]. The hearing's three days out, and the crowd doesn't want to wait." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Kızın başının üstünde Çekirdek'in kural penceresi beyaz harflerle asılı: [Bölge Kuralı · Hırsız yakıt listesine yazılır]. Beyazlar giymiş bir adam, elinde defteri, kızın adını soruyor.", en: "The Core's rule window hangs over the girl's head in white letters: [Regional Rule · Thieves are added to the fuel list]. A man in white with a notebook is asking the girl her name." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Kızın başının üstünde hiçbir pencere yok. Ağ Çekirdek'i saklıyor, bölgenin de bir kuralı yok. Kalabalık kuralı kendisi yazmak üzere.", en: "There's no window over the girl's head. The Network keeps its Core hidden, so the region has no rules. The crowd's about to write one of its own." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Kızın başının üstünde bir pencere asılı ama bomboş: [Bölge Kuralı tanımsız. Bölge sahibinin hükmü bekleniyor.] Kalabalık sana dönüyor; fırıncı da, kız da.", en: "There's a window over the girl's head, but it's blank: [Regional Rule undefined. Awaiting the region holder's ruling.] The crowd turns to you. So does the baker. So does the girl." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Kızın başının üstünde hiçbir kural yok; Kasaba Çekirdeği'nin kime ait olduğu daha belli değil. Kalabalık kuralını kendisi yazmak üzere.", en: "There's no rule over the girl's head. Nobody's sure yet who the Town Core belongs to. The crowd's about to write a rule of its own." }
            kosul: { bayrak_yok: ["cekirdek_lonca", "cekirdek_siginak", "cekirdek_yukselenler", "cekirdek_sessiz_ag", "cekirdek_oyuncu"] }
          - { tr: "\"Kardeşim için,\" diyor kız. \"Seviyesi bir. Kimse ona iş vermiyor, tayında sıra ona hiç gelmiyor.\"", en: "\"For my little brother,\" the girl says. \"He's Level One. Nobody'll give him work and he never makes it to the front of the ration line.\"" }
          - metin: { tr: "{yer:kordon} düştüğünden beri {yer:eski_sehir|in} sokakları {yer:kordon|den} kaçanlarla dolup taşıyor. Kuyruk her gün biraz daha uzuyor, ekmekse hep aynı.", en: "Ever since {yer:kordon} fell, the streets of {yer:eski_sehir} have been full of people who ran from it. The line gets a little longer every day. The bread doesn't." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Kızın ceplerinde bir şey daha var: bir avuç kuru ekmek kabuğu. Üç somunu kendisi için almamış; kendine kırıntıları ayırmış.", en: "There's something else in her pockets: a handful of dry crusts. She didn't take the three loaves for herself. For herself she took the crumbs." }
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Fırıncı somunları saymış, kızı görmüş ama sesini çıkarmamış. Bağıran kalabalık olmuş.", en: "The baker counted the loaves, saw the girl and didn't yell. The crowd yelled." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "k̷uralı kim yazarsa güç onundur. bir somun ekmek için bile.", en: "w̷hoever writes the rule holds the power. even over a loaf of bread." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşi için çalmış. Ben de yapardım. Sen de yapardın.\"", en: "\"She stole it for her little brother. I'd have done it. So would you.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir kural yaz, herkes için aynı olsun. Ama bu sabah değil. Bu sabah kızı bırak.\"", en: "\"Write a rule and make it the same for everyone. Just not this morning. This morning, let her go.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kural penceresi dediğin bir arayüz. Arayüzün arkasında da biri var. Bu sabah o biri kim?\"", en: "\"That rule window's an interface. There's somebody behind the interface. Who's that somebody this morning?\"" }
        secenekler:
          - id: "ode"
            etiket: { tr: "Ekmeklerin parasını öde, kız gitsin", en: "Pay for the bread. Let her go" }
            gerekli: { oz_kristali_min: 1 }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - oz_kristali: -1
              - itibar: { siginak: 2 }
            kronik: { tr: "{yer:eski_sehir|in} fırınında bir kızın çaldığı üç somunun parasını sen ödedin; kurala ise dokunmadın.", en: "At the {yer:eski_sehir} bakery you paid for the three loaves a girl stole, and the rule stayed exactly where it was." }
            sonraki: "ekmek_ode"
          - id: "ceza"
            etiket: { tr: "Cezayı kızın yerine ben çekerim", en: "I'll serve the sentence. In her place" }
            goster: { bayrak_yok: ["cekirdek_oyuncu", "cekirdek_sessiz_ag"] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - gun: 1
              - itibar: { lonca: 2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 3 }, elif_sari: { saygi: 3 } }
            kronik: { tr: "Bir kızın ekmek hırsızlığının cezasını, Kasaba Çekirdeği'nin kuralı neyse ona göre, onun yerine sen çektin.", en: "Under the Town Core's rule, you served a girl's sentence for stealing bread in her place." }
            sonraki: "ekmek_ceza"
          - id: "kural"
            etiket: { tr: "Kural kuraldır, uygulansın", en: "A rule's a rule. Let it stand" }
            goster: { bayrak_yok: ["cekirdek_oyuncu", "cekirdek_sessiz_ag"] }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - itibar: { lonca: 2, yukselenler: 2, siginak: -3 }
            kronik: { tr: "{yer:eski_sehir|in} fırınında, üç somun ekmek için bir çocuğa kuralın uygulanmasını izledin.", en: "At the {yer:eski_sehir} bakery you watched the rule come down on a child over three loaves of bread." }
            sonraki: "ekmek_kural"
          - id: "kir"
            tur: "aciga_vur"
            etiket: { tr: "Kural penceresini elinle parçala", en: "Tear the rule window apart with your hand" }
            goster: { bayrak_yok: ["cekirdek_oyuncu", "cekirdek_sessiz_ag"] }
            gerekli: { stat: { wil: 45 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -5, merhamet: 3 }
              - dikkat: 4
              - itibar: { lonca: -3, yukselenler: -3, siginak: -1 }
              - bayrak: "ekmek_kural_kirildi"
            kronik: { tr: "Bir fırının önünde, herkesin gözü önünde Kasaba Çekirdeği'nin kural penceresini elinle parçaladın.", en: "In front of a bakery, with everyone watching, you tore the Town Core's rule window apart with your bare hand." }
            sonraki: "ekmek_kir"
          - id: "yaz"
            etiket: { tr: "Kuralı sen yaz: çocuklara ekmek ücretsiz", en: "Write the rule yourself: bread is free for kids" }
            goster: { bayrak: "cekirdek_oyuncu" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "ekmek_kurali_cocuk"
            kronik: { tr: "Kasaba Çekirdeği'nin ilk kuralını sen yazdın: on dört yaşından küçüklere ekmek ücretsiz.", en: "You wrote the Town Core's first rule yourself: bread is free for anyone under fourteen." }
            sonraki: "ekmek_yaz"
          - id: "yaz_sert"
            etiket: { tr: "Kuralı sen yaz: hırsız bir ay kapı taşır", en: "Write the rule yourself: thieves haul for a month" }
            goster: { bayrak: "cekirdek_oyuncu" }
            etkiler:
              - ahlak: { duzen: 6, merhamet: -4, insanlik: -1 }
              - itibar: { lonca: 4 }
              - bayrak: "ekmek_kurali_sert"
            kronik: { tr: "Kasaba Çekirdeği'nin ilk kuralını sen yazdın; o kuralın ilk hükmü on iki yaşında bir kızın ensesine indi.", en: "You wrote the Town Core's first rule yourself, and the first person it came down on was a twelve-year-old girl." }
            sonraki: "ekmek_yaz"
          - id: "kalabalik"
            etiket: { tr: "Kalabalığı dağıt, kızı al", en: "Break up the crowd. Take the girl" }
            goster: { bayrak: "cekirdek_sessiz_ag" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - itibar: { sessiz_ag: 2 }
            kronik: { tr: "Kuralsız bir sokakta, kalabalığın kendi yazdığı hükümden bir kızı çekip aldın.", en: "On a street with no rules, you took a girl away from the sentence the crowd was writing for her." }
            sonraki: "ekmek_ode"
          - id: "firin"
            tur: "gosteris"
            etiket: { tr: "Fırının duvarını yık, ikinci bir ağız aç", en: "Knock through the oven wall. Open a second mouth" }
            gerekli: { stat: { str: 50, int: 30 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "ekmek_firin_buyudu"
              - tohum: { olay: "eski_sehir_seviye_birler", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Fırının önündeki kuyrukta tanıştığın yüzlerin bir kısmı başka bir sırada bekliyor.", en: "Some of the faces you met in that bread line are waiting in another line now." } }
            kronik: { tr: "{yer:eski_sehir|in} son taş fırınına ellerinle ikinci bir ağız açtın; fırın artık iki katı ekmek çıkarabiliyordu.", en: "You opened a second mouth in {yer:eski_sehir|pos} last wood-fired oven with your bare hands, and now it could turn out twice the bread." }
            sonraki: "ekmek_firin"

      - id: "ekmek_ode"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Parayı fırıncıya sayınca ensedeki el gevşiyor, kalabalık homurdanarak dağılıyor. Kız üç somunu göğsüne bastırmış, sana bakıyor; teşekkür etmeyi unutuyor, sonra hatırlıyor, sonra yine unutuyor.", en: "You count the money out to the baker. The hand on her neck lets go and the crowd breaks up, grumbling. The girl hugs the three loaves to her chest and looks at you. She forgets to say thank you, remembers, forgets again." }
          - { tr: "\"Kardeşin,\" diyorsun. \"Seviyesi bir mi?\" Kız başını sallıyor. \"Han'daki okula gidiyor,\" diyor. \"Öğretmen ona pencere okumayı öğretiyor. Ama pencere okumak karın doyurmuyor.\"", en: "\"Your brother,\" you say. \"Level One?\" She nods. \"He goes to the school in the old inn,\" she says. \"The teacher's teaching him to read his window. But reading your window doesn't feed you.\"" }
        secenekler:
          - id: "okul"
            etiket: { tr: "O okulu bir gün ziyaret et", en: "Plan to visit that school" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - xp_seviye: 25
              - tohum: { olay: "eski_sehir_seviye_birler", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Fırının önündeki kuyrukta tanıştığın yüzlerin bir kısmı başka bir sırada bekliyor.", en: "Some of the faces you met in that bread line are waiting in another line now." } }
            kronik: { tr: "Ekmek çalan bir kızın kardeşinin okuluna uğramaya söz verdin.", en: "You promised to visit the school where a bread thief's little brother learned to read his window." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Başını sallayıp yürü", en: "Nod and walk on" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 20
            kronik: { tr: "{yer:eski_sehir|de} bir sabah üç somunun parasını ödeyip yoluna devam ettin.", en: "One morning in {yer:eski_sehir} you paid for three loaves of bread and kept walking." }
            sonraki: "@akis"

      - id: "ekmek_ceza"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Bir hafta boyunca Lonca'nın kapı ekiplerinin çantalarını taşıyorsun. Ekipler önce gülüyor, sonra gülmeyi kesiyor: senin taşıdığın çantayı açtıklarında içinden bir kapı bossunun kafası çıkıyor.", en: "For a week you haul packs for the Guild's Gate crews. At first the crews laugh. Then they stop laughing, because when they open a pack you carried, there's a Gate boss's head in it." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Konsey önündeki duruşmada kızın yerine sen çıkıyorsun. Konsey kâtibi kararı yazarken gülümsemesini saklamaya çalışıyor; bir hafta boyunca tayınından kesilen pay kızın kardeşine gidiyor.", en: "At the hearing before the Council, you stand in the girl's place. The clerk writing up the ruling can't quite hide a smile, and for a week the cut from your ration goes to the girl's little brother." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Yükselenler'in kâtibine, yakıt listesine kızın adı yerine seninkini yazmak düşüyor. Kalemi titriyor; yazdığı ad listenin geri kalanından iri harflerle çıkıyor.", en: "The Ascended's clerk has to write your name on the fuel list instead of the girl's. His pen shakes, and the name he writes comes out in bigger letters than the rest of the list." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Kalabalık sana bakıyor: ortada ne kural var ne ceza. Bir gün boyunca fırının önünde nöbet tutuyorsun; o gün kimse kimsenin ensesine el atmıyor.", en: "The crowd looks at you. No rule, no sentence. You stand watch outside the bakery for a day, and that day nobody puts a hand on anybody's neck." }
            kosul: { bayrak_yok: ["cekirdek_lonca", "cekirdek_siginak", "cekirdek_yukselenler"] }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Cezanı bitir", en: "Finish your sentence" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - xp_seviye: 35
              - tohum: { olay: "eski_sehir_seviye_birler", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Fırının önündeki kuyrukta tanıştığın yüzlerin bir kısmı başka bir sırada bekliyor.", en: "Some of the faces you met in that bread line are waiting in another line now." } }
            kronik: { tr: "Başkasının cezasını üstlendin; bir çocuğun ensesindeki el senin omzuna kondu.", en: "You served someone else's sentence, and the hand on a child's neck moved to your shoulder." }
            sonraki: "@akis"

      - id: "ekmek_kural"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Avcı kızı ensesinden tutup götürüyor. Kız arkasına bakmıyor; somunları fırıncıya geri veriyor, yalnızca biri yere düşüyor.", en: "The hunter marches the girl off by the neck. She doesn't look back. She hands the loaves back to the baker, except one that falls on the ground." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kalabalık kızı, üç gün sonraki duruşmasını beklesin diye Konsey'in yurduna götürüyor. Somunlar fırıncıya dönüyor; kardeşi o gece aç yatıyor.", en: "The crowd walks the girl to the Council shelter to wait out the three days until her hearing. The loaves go back to the baker. Her brother goes to bed hungry that night." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Beyazlar giymiş adam kızın adını defterine yazıyor. Kız, düzgün yazılsın diye adını kendisi heceliyor.", en: "The man in white writes the girl's name in his notebook. She spells it out for him herself, so it'll be written down right." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Kalabalık kızı fırının duvarına sıkıştırıyor. Ne olacağını kimse bilmiyor; ortada kural yok, yalnızca öfke var. Sonunda fırıncı küreğini bırakıp kızın önüne geçiyor, kalabalık da dağılıyor.", en: "The crowd backs the girl up against the bakery wall. Nobody knows what happens next. No rule, just anger. In the end the baker drops his peel, steps in front of her, and the crowd breaks up." }
            kosul: { bayrak_yok: ["cekirdek_lonca", "cekirdek_siginak", "cekirdek_yukselenler"] }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kuyruğa dön", en: "Get back in line" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - xp_seviye: 15
            kronik: { tr: "Bir çocuğun kurala teslim edildiği sabah ekmek kuyruğuna geri döndün.", en: "On the morning a child was handed over to the rule, you got back in the bread line." }
            sonraki: "@akis"

      - id: "ekmek_kir"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Elini kural penceresinin içine sokup onu kâğıt gibi buruşturuyorsun. Mavi harfler parmaklarının arasından akıp sokağın taşlarına damlıyor, orada sönüyor.", en: "You reach into the rule window and crumple it like a sheet of paper. Blue letters run through your fingers, drip onto the cobblestones and go out." }
          - { tr: "Sokakta kimse kıpırdamıyor; kızın ensesindeki el kendiliğinden çekilmiş. Kapıda elinde küreğiyle donup kalan fırıncı bir süre sonra ağır ağır kıza bir somun daha uzatıyor.", en: "Nobody on the street moves. The hand on the girl's neck pulls away on its own. The baker's frozen in the doorway with his peel. Then, very slowly, he holds out one more loaf to her." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Bölge kuralı silindi · Yetkisiz]", en: "[Regional rule deleted · Unauthorized]" }
            satirlar:
              - { tr: "Kasaba Çekirdeği sahibine bildirim gönderildi.", en: "Town Core holder has been notified." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Elini silkeleyip git", en: "Shake off your hand and go" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { kaya_demir: { guven: -3 }, elif_sari: { saygi: 2 } }
              - xp_seviye: 30
              - tohum: { olay: "eski_sehir_seviye_birler", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Fırının önündeki kuyrukta tanıştığın yüzlerin bir kısmı başka bir sırada bekliyor.", en: "Some of the faces you met in that bread line are waiting in another line now." } }
            kronik: { tr: "Kasaba Çekirdeği'ne, sahibinin kim olduğuna bakmadan, kendi kuralını gösterdin.", en: "You showed the Town Core a rule of your own, no matter whose Core it was." }
            sonraki: "@akis"

      - id: "ekmek_yaz"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Boş pencereye yazıyorsun; yazdığın satır aynı anda bütün {yer:eski_sehir|in} üstünde, her sokağın başında beliriyor: [Bölge Kuralı · On dört yaşından küçüklere ekmek ücretsizdir.] Kızın ensesindeki el çekiliyor.", en: "You write into the blank window, and the line you write appears over all of {yer:eski_sehir} at once, at the head of every street: [Regional Rule · Bread is free for anyone under fourteen.] The hand on the girl's neck pulls away." }
            kosul: { bayrak: "ekmek_kurali_cocuk" }
          - metin: { tr: "Boş pencereye yazıyorsun; yazdığın satır bütün {yer:eski_sehir|in} üstünde beliriyor: [Bölge Kuralı · Hırsızlık: bir ay zorunlu kapı hamallığı.] Kızın ensesindeki el sıkılaşıyor. Kız sana, kuralı yazana bakıyor.", en: "You write into the blank window, and the line appears over all of {yer:eski_sehir}: [Regional Rule · Theft: one month mandatory Gate porterage.] The hand on the girl's neck tightens. She looks at you, the person who wrote it." }
            kosul: { bayrak: "ekmek_kurali_sert" }
          - { tr: "Fırıncı küreğini indiriyor. \"Bölge sahibi konuştu,\" diyor; kimseye değil, kendi kendine. Bir şehir, bir pencereye bir satırın nasıl yazıldığını ilk kez izliyor.", en: "The baker lowers his peel. \"The holder has spoken,\" he says, not to anybody, to himself. A city is watching, for the first time, how a line gets written into a window." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pencereyi kapat", en: "Close the window" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { elif_sari: { saygi: 2 }, kaya_demir: { saygi: 2 } }
              - xp_seviye: 35
              - tohum: { olay: "eski_sehir_seviye_birler", gecikme: { min: 2, max: 6 }, hatirlatma: { tr: "Fırının önündeki kuyrukta tanıştığın yüzlerin bir kısmı başka bir sırada bekliyor.", en: "Some of the faces you met in that bread line are waiting in another line now." } }
            kronik: { tr: "Kasaba Çekirdeği'nin penceresine yazdığın kural {yer:eski_sehir|in} her sokağının başında aynı anda belirdi.", en: "The rule you wrote into the Town Core's window appeared at the head of every street in {yer:eski_sehir} at once." }
            sonraki: "@akis"

      - id: "ekmek_firin"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Elini fırının yüz yıllık, hâlâ sıcak yan duvarına koyuyorsun. Bir yumruk, bir daha; duvarda kapı büyüklüğünde bir delik açılıyor. Sonra fırıncının tarifine göre tuğlaları yeniden diziyorsun: ikinci bir kubbe, ikinci bir ağız.", en: "You lay your hand on the side wall of the oven, a hundred years old and still warm. One punch, then another, and the wall opens up the size of a door. Then you stack the bricks back the way the baker tells you: a second dome, a second mouth." }
          - { tr: "Akşama doğru ikinci ağızdan ilk somunlar çıkınca kuyruk ikiye bölünüyor; kız kendi kuyruğunun başında parasız iki somun alıyor. Kimse sesini çıkarmıyor.", en: "Toward evening the first loaves come out of the second mouth. The line splits in two, and the girl, at the front of her own line, gets two loaves without paying. Nobody says a word." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ellerindeki isi sil", en: "Wipe the soot off your hands" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - esya: { firin_ekmegi: 3 }
              - xp_seviye: 40
            kronik: { tr: "{yer:eski_sehir|in} fırınında bütün gün tuğla dizdin; akşam ikinci ağızdan ilk somunlar çıktı.", en: "You spent a day laying brick at the {yer:eski_sehir} bakery, and that evening the first loaves came out of the second mouth." }
            sonraki: "@akis"

  # ================================================================== SEVİYE BİRLER (Han'daki okul)
  - id: "eski_sehir_seviye_birler"
    konum: ["eski_sehir"]
    perde: [2]
    bolge: ["eski_sehir"]
    gun: { min: 45, max: 180 }
    agirlik: 5
    etiketler: ["sistem", "ahlak", "eski_sehir"]
    gerilim: 2
    onemli: true
    kart: { tr: "Seviye birler", en: "The Level Ones" }
    sahne: "birler_1"
    sahneler:
      - id: "birler_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} kervansaray devrinden kalma taş hanının avlusunda bir kara tahta duruyor. Önünde yirmi kişi oturmuş: çocuklar, yaşlılar, bir de ellerini nereye koyacağını bilemeyen iri yarı bir adam. Hepsinin başının üstünde aynı sayı yazıyor: 1.", en: "In an old stone inn left over from {yer:eski_sehir|pos} stagecoach days, there's a chalkboard in the middle of the courtyard. Twenty people sit in front of it: kids, old folks, and one big man who doesn't know what to do with his hands. All of them have the same number over their heads: 1." }
          - { tr: "Öğretmenleri emekli bir edebiyat öğretmeni; tahtaya tebeşirle bir Sistem penceresi çizmiş, satır satır anlatıyor. \"Bu satır mesleğiniz. Seviye atlamanın tek yolu öldürmek değil. Sistem bunu size söylemedi ama ben söylüyorum.\"", en: "The teacher's a retired English teacher. She's drawn a System window in chalk and she's walking them through it line by line. \"This line is your profession. Killing isn't the only way to level. The System didn't tell you that. I'm telling you.\"" }
          - { tr: "Hepsi Öğretici'de tek bir canavar bile öldürmemiş, öldürememiş ya da öldürmek istememiş insanlar. Entegre Dünya'da seviye her şey demek: iş, tayın, saygı. Burada oturanlar hepsini kaçırmış.", en: "The ones who didn't kill anything in the tutorial. Couldn't, or wouldn't. In the Integrated World, your level is everything: work, rations, respect. The people sitting here missed out on all of it." }
          - { tr: "Avlunun kapısında beyazlar giymiş iki kişi duruyor. Biri elindeki broşürü sallıyor: \"Kolay seviye! Mahzende hazır canavar, son vuruş sizin. Yakıt olmaktan kurtulun.\" Öğrencilerden on dört yaşlarında bir oğlan gözünü broşürden ayıramıyor.", en: "There are two people in white at the courtyard gate. One's waving a flyer: EASY LEVELS! MONSTERS READY IN THE CELLAR, YOU LAND THE LAST HIT. DON'T BE FUEL. A fourteen-year-old boy in the class keeps staring at it." }
          - metin: { tr: "Fırının önünde ekmek çalan kızın kardeşi de burada; sana el sallıyor. Ablası ona senden söz etmiş.", en: "The little brother of the girl who stole the bread at the bakery is here too. He waves at you. His sister told him about you." }
            kosul: { bayrak: "ekmek_kurali_cocuk" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Broşürdeki mahzen bu sokağın sonunda. Zincirli canavarların her biri, son vuruşu yapana tam iki seviye kazandıracak kadar besili tutulmuş. Seviye başına fiyat: bir haftalık tayın.", en: "The cellar on that flyer is at the end of this street. Every chained monster in it has been fattened up to give exactly two levels to whoever lands the last hit. Price per level: one week's rations." }
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Tahtadaki pencere çizimi tek bir yer dışında doğru: Sistem'de meslek seviyesinin tavanı yok. Öğretmen bunu bilmiyor; sen biliyorsun.", en: "The chalk window's right, except for one thing: the System doesn't cap profession levels. The teacher doesn't know that. You do." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eviye bir. ben seni bulduğumda sen de birdin. hatırlıyor musun?", en: "l̷evel one. you were a one when i found you. remember?" }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Hemşirelerimin yarısı seviye bir. Hiçbiri tek bir canavar öldürmedi. Hepsi benden çok hayat kurtardı.\"", en: "\"Half my nurses are Level One. Not one of them ever killed a monster. Every one of them has saved more lives than I have.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Şu oğlana bak. Broşüre nasıl bakıyor, görüyor musun? Bir şey yap.\"", en: "\"Look at that kid. Look at how he's staring at that flyer. Do something.\"" }
        secenekler:
          - id: "ders"
            etiket: { tr: "Tahtanın başına geç, meslek tavanını anlat", en: "Take the chalk. Explain how profession levels work" }
            gerekli: { stat: { int: 35 } }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - itibar: { siginak: 4, sessiz_ag: 2 }
              - bayrak: "seviye_birler_ders"
            kronik: { tr: "{yer:eski_sehir|in} taş hanında seviye birlere öldürmeden nasıl güçleneceklerini öğrettin.", en: "In the old stone inn in {yer:eski_sehir}, you taught the Level Ones how to get stronger without killing." }
            sonraki: "birler_ders"
          - id: "tut"
            tur: "gosteris"
            etiket: { tr: "Bir canavarı boynundan tut, vuruşu oğlana bırak", en: "Hold a monster by the neck. Let the boy make the kill" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: 1, duzen: -1 }
              - dikkat: 2
              - bayrak: "seviye_birler_vurus"
            kronik: { tr: "Canavarı boynundan tutarak on dört yaşındaki bir çocuğa ilk öldürmesini sen verdin.", en: "You gave a fourteen-year-old his first kill, holding the monster by the neck for him." }
            sonraki: "birler_vurus"
          - id: "mahzen"
            etiket: { tr: "Broşürdeki mahzeni bul", en: "Find the cellar on the flyer" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { guven: -4 } }
            kronik: { tr: "Yükselenler'in seviye sattığı mahzenin kapısını açtın.", en: "You opened the door to the cellar where the Ascended sold levels." }
            sonraki: "birler_mahzen"
          - id: "ad"
            tur: "aciga_vur"
            etiket: { tr: "Kapıya adını yaz, bu okul senin korumanda", en: "Write your name on the gate. This school's under you" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 3, yukselenler: -2 }
              - bayrak: "seviye_birler_korunuyor"
            kronik: { tr: "{yer:eski_sehir|in} seviye birler okulunun kapısına adını kazıdın; broşürcüler o gün broşürlerini yere bırakıp gitti.", en: "You carved your name into the gate of the Level Ones' school in {yer:eski_sehir}, and that day the flyer people dropped their flyers and left." }
            sonraki: "birler_ad"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Avluya bir göz atıp geç", en: "Glance at the courtyard and move on" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -2, insanlik: -1 }
            kronik: { tr: "Seviye birlerin okulunun önünden geçtin ve içeri girmedin.", en: "You walked past the Level Ones' school and didn't go in." }
            sonraki: "@akis"

      - id: "birler_ders"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Tebeşiri alıp tahtadaki pencerenin altına bir satır daha ekliyorsun. Meslek seviyesi: tavan yok. Fırıncı, terzi, ebe, kunduracı; her biri ayrı bir yol. Yavaş ama kimsenin ölümüne bağlı değil.", en: "You take the chalk and add one more line under the window on the board. Profession level: no cap. Baker, tailor, midwife, cobbler, each one's a road. Slow, but it doesn't run through anybody's death." }
          - { tr: "İri adam elini kaldırıyor. \"Ben çilingirdim,\" diyor. \"Bu da sayılır mı?\" Pencereni açıp onunkine bakıyorsun: meslek satırında, hiç dokunulmamış soluk bir çilingir simgesi duruyor.", en: "The big man raises his hand. \"I was a locksmith,\" he says. \"Does that count?\" You open your window and look at his. There in his profession line, untouched, there's a faint little locksmith icon." }
          - { tr: "Öğretmen sana, bir öğretmenin iyi bir öğrencisine baktığı gibi bakıyor. Broşür sallayan iki kişi kapıdan geri çekiliyor.", en: "The teacher looks at you the way a teacher looks at a good student. The two people waving the flyer back away from the gate." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Bir gün kal, her birinin satırını oku", en: "Stay a day. Read every one of their lines" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - gun: 1
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 40
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 4, max: 9 }, kosul: { bayrak: "cakallar_tanisildi" }, hatirlatma: { tr: "Seviye birlerin taş hanında söylediklerin kulaktan kulağa geçmiş.", en: "What you said at the old stone inn with the level ones has been passed along." } }
            kronik: { tr: "Bir gün boyunca seviye birlerin pencerelerini tek tek okudun; her birine kendi satırında saklı duran mesleği gösterdin.", en: "You spent a day reading the Level Ones' windows one by one, and showed each of them the profession hiding in their own line." }
            sonraki: "birler_son"
          - id: "git"
            etiket: { tr: "Tebeşiri öğretmene bırak", en: "Hand the chalk back to the teacher" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
              - xp_seviye: 30
            kronik: { tr: "Seviye birlere bir satır öğrettin ve tebeşiri öğretmenlerine geri verdin.", en: "You taught the Level Ones one line and handed the chalk back to their teacher." }
            sonraki: "birler_son"

      - id: "birler_vurus"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sokağın sonundaki bir kanaldan bir canavar çıkarıp boynundan tuttuğun gibi avluya getiriyorsun; o çırpınıyor, sen kılını kıpırdatmıyorsun. Öğrenciler çığlık atıyor, öğretmen tahtanın önünde donakalıyor.", en: "You pull a monster out of a storm drain at the end of the street and carry it into the courtyard by the neck. It thrashes. You don't. The students scream. The teacher freezes in front of the board." }
          - { tr: "Oğlan eline bir boru alıp titreyen ellerle yaklaşıyor. İlk vuruş boşa gidiyor, ikincisi kemiğe çarpıyor, üçüncüsünde canavar kıpırtısız kalıyor. Oğlanın başının üstündeki 1'in yerinde artık 3 var.", en: "The boy picks up a pipe and comes closer. His hands are shaking. The first swing misses, the second hits bone, and on the third the monster stops moving. The 1 over the boy's head turns into a 3." }
          - { tr: "Oğlan gülmüyor. Önce borunun ucundaki kana, sonra sana bakıyor. Öğretmen tahtanın önünden ona doğru yürüyüp ilk kez sesini yükseltiyor: \"Buraya gel.\"", en: "The boy doesn't smile. He looks at the blood on the end of the pipe, then at you. The teacher walks over from the board and raises her voice for the first time: \"Come here.\"" }
        secenekler:
          - id: "savun"
            etiket: { tr: "\"Annesini korumak için güç lazım.\"", en: "\"He needs strength to protect his mom.\"" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - xp_seviye: 30
              - tohum: { olay: "kapi_avcilari_donus", gecikme: { min: 4, max: 9 }, kosul: { bayrak: "cakallar_tanisildi" }, hatirlatma: { tr: "Seviye birlerin taş hanında söylediklerin kulaktan kulağa geçmiş.", en: "What you said at the old stone inn with the level ones has been passed along." } }
            kronik: { tr: "Bir çocuğa öldürmeyi öğrettin ve öğretmenine bunun gerekli olduğunu söyledin.", en: "You taught a kid to kill and told his teacher it was necessary." }
            sonraki: "birler_son"
          - id: "ozur"
            etiket: { tr: "Öğretmenden özür dile", en: "Apologize to the teacher" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - xp_seviye: 25
            kronik: { tr: "Bir çocuğa ilk öldürmesini verdikten sonra öğretmeninden özür diledin; ama özür olanı geri almadı.", en: "After giving a kid his first kill, you apologized to his teacher. The apology didn't take anything back." }
            sonraki: "birler_son"

      - id: "birler_mahzen"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Mahzen dedikleri, sokağın sonundaki eski bir şarap deposu. İçeride on iki canavar zincire vurulmuş; kafeslerin önünde tayın kartlarını uzatmış bir kuyruk bekliyor. Beyazlar giymiş bir kâtip her kartı delip müşterinin eline bir sopa tutuşturuyor.", en: "The cellar's an old wine storehouse at the end of the street. There are twelve monsters chained up inside, and in front of the cages there's a line of people holding out their ration cards. A clerk in white punches each card and hands the customer a club." }
          - { tr: "Canavarlar sıska, aç, gözleri yarı kapalı. İçlerinden biri sopasını kaldıran yaşlı bir kadına bakıp başını eğiyor; ne olacağını biliyormuş gibi.", en: "The monsters are thin, starving, eyes half shut. One of them looks up at an old woman raising her club and lowers its head, like it knows what's coming." }
          - metin: { tr: "Kâtip seni görünce defterini kapatıyor. \"Çekirdek'in izniyle,\" diyor. \"Yükselenler'in bölgesi, Yükselenler'in kuralı.\"", en: "The clerk sees you and shuts his ledger. \"This is licensed by the Core,\" he says. \"Ascended region, Ascended rules.\"" }
            kosul: { bayrak: "cekirdek_yukselenler" }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Zincirleri kopar, canavarları kanala sal", en: "Snap the chains. Turn the monsters loose in the drains" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3, insanlik: 2 }
              - itibar: { yukselenler: -5 }
              - iliski: { vahit: { guven: -4, saygi: 2 } }
              - efsane: "canavari_bagisladi"
              - bayrak: "seviye_birler_mahzen_bos"
            kronik: { tr: "Yükselenler'in seviye sattığı mahzende zincirleri kopardın ve canavarları serbest bıraktın.", en: "In the cellar where the Ascended sold levels, you snapped the chains and turned the monsters loose." }
            sonraki: "birler_son"
          - id: "bitir"
            etiket: { tr: "Canavarları kendin bitir, kimse onlardan seviye satamasın", en: "Finish the monsters yourself. Nobody sells levels off them" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - itibar: { yukselenler: -5, lonca: 2 }
              - iliski: { vahit: { guven: -4 } }
              - bayrak: "seviye_birler_mahzen_bos"
            kronik: { tr: "Seviye satılan mahzendeki on iki canavarı, kimse onlardan kâr etmesin diye kendin bitirdin.", en: "You put down all twelve monsters in the cellar yourself so nobody could profit off them again." }
            sonraki: "birler_son"
          - id: "kartlar"
            etiket: { tr: "Delinmiş tayın kartlarını sahiplerine geri ver", en: "Give the punched ration cards back to their owners" }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 3, yukselenler: -3 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "seviye_birler_mahzen_bos"
            kronik: { tr: "Seviye satılan mahzende yaşlıların tayın kartlarını geri aldın ve sahiplerine dağıttın.", en: "In the cellar where levels were sold, you took the old folks' ration cards back and handed them out to their owners." }
            sonraki: "birler_son"

      - id: "birler_ad"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Adını parmağınla hanın kapısındaki taşa kazıyorsun, altına da gerçek seviyeni. Broşür sallayanlar yazıyı bir kez, sonra bir kez daha okuyor; ardından broşürleri yere bırakıp gidiyorlar.", en: "You write your name on the stone of the inn's gate, with your finger, into the rock. Under it, your true level. The people with the flyers read it once, then again. Then they drop the flyers and leave." }
          - { tr: "Öğretmen önce kapıya, sonra sana bakıyor. \"Teşekkür ederim,\" diyor. \"Ama artık bu okula senin okulun diyecekler. Bunu biliyorsun, değil mi?\"", en: "The teacher looks at the gate, then at you. \"Thank you,\" she says. \"But now they'll call this your school. You know that, don't you?\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Okul onların. Ben yalnızca kapısıyım.\"", en: "\"It's their school. I'm just the gate.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - xp_seviye: 30
            kronik: { tr: "Seviye birlerin okulunu adınla korudun ama okulun onların olduğunu söyleyip kapıda kaldın.", en: "You put the Level Ones' school under your name, but you told them it was theirs and stayed at the gate." }
            sonraki: "birler_son"
          - id: "benim"
            etiket: { tr: "\"Evet. Benim okulum.\"", en: "\"Yeah. My school.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - itibar: { lonca: 2 }
              - xp_seviye: 30
            kronik: { tr: "Öğretmen insanların öyle diyeceğini söyledikten hemen sonra, seviye birlerin okuluna kendi okulun dedin.", en: "You called the Level Ones' school your own, right after the teacher warned you people would." }
            sonraki: "birler_son"

      - id: "birler_son"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Ders bitiyor. On dört yaşındaki oğlan broşürü yırtıp çöpe atıyor, tahtadaki satırı defterine geçiriyor.", en: "Class lets out. The fourteen-year-old tears up the flyer, throws it away and copies the line on the board into his notebook." }
            kosul: { bayrak_yok: "seviye_birler_vurus" }
          - metin: { tr: "Oğlan derse dönmüyor. Avlunun kapısında durmuş, elinde hâlâ boru, {yer:eski_sehir|in} sokaklarına bakıyor.", en: "The boy doesn't go back to class. He stands at the courtyard gate looking out at the streets of {yer:eski_sehir}, the pipe still in his hand." }
            kosul: { bayrak: "seviye_birler_vurus" }
          - { tr: "Akşam olunca handan bir şarkı yükseliyor: öğretmen çarpım tablosunu Sistem pencerelerinin satırlarıyla örüp bir ninniye çevirmiş. Seviye birler hep bir ağızdan söylüyor.", en: "When evening comes, a song rises out of the inn. The teacher's turned the times tables into a lullaby made of System window lines, and the Level Ones sing it all together." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Şarkıyı dinleyip git", en: "Listen to the song and go" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "{yer:eski_sehir|in} taş hanından yükselen seviye birlerin şarkısını dinledin.", en: "You listened to the Level Ones' song rising out of the old stone inn in {yer:eski_sehir}." }
            sonraki: "@akis"
