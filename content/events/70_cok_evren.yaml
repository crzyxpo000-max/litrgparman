# Parti I — Çok-evren (Perde 3–4). docs/PERDE2_4.md §4 "Parti I".
# cok_evren_kapisi (AY 200): Kule'nin 50. katının ardındaki geçit açılır (cok_evren_acik).
# Batık Takımada (Nehhalar; Hasat sonunun aynası): batik_ilk_adim, batik_son_fener, batik_tuz_arsivi, batik_son_basakci, batik_tilu (tohum).
# Pirinç Kervan (Tavvarlar; Vassal sonunun aynası): kervan_tarti_carsisi, kervan_ondalik, kervan_sayman, kervan_bos_kefe.
# Yedi Taht (Kadim sarayı; Yükseliş/tanrı sonunun aynası): taht_kabul_salonu, taht_yedinci_koltuk, taht_uyuyan_tanrilar, taht_varis_duellosu (tohum).
olaylar:
  # ================================================================== ANA YAY: ÇOK-EVREN GEÇİDİ (gün 200)
  - id: "cok_evren_kapisi"
    konum: ["kule_dibi"]
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "cok_evren", "kule"]
    gerilim: 4
    ana_yay: { gun: 200 }
    onemli: true
    kart: { tr: "Ellinci katın ardı", en: "Past the fiftieth floor" }
    sahne: "gecit_1"
    sahneler:
      - id: "gecit_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gün doğmadan Kule nabız gibi atmaya başlıyor. Gövdesinde bir ışık halkası belirip kat kat yukarı tırmanıyor, tam ellinci katın hizasına varınca da olduğu yerde kalakalıyor.", en: "Before sunrise, the Spire starts to throb like a pulse. A ring of light climbs its body floor by floor and stops dead at the fiftieth." }
          - { tr: "Kule Dibi'ndeki çadırlarda, tezgâhların başında, yarı yıkık apartmanların balkonlarında binlerce baş aynı noktaya kalkmış. Derken herkesin penceresi birden çalmaya başlıyor.", en: "Out of the tents and stalls of {yer:kule_dibi}, off the balconies of half-gutted apartment blocks, thousands of faces tip up toward the same spot. Then everybody's window goes off at once." }
          - metin: { tr: "Ellinci katın ardındaki o kapıyı daha önce görmüştün. Önünde durmuş, avucunda soğuk bir mührün dokunuşunu duyup geri dönmüştün. Şimdi mühür ortada yok.", en: "You've already seen that door behind the fiftieth floor. You stood in front of it, felt a cold seal under your palm, and turned back. Now the seal is gone." }
            kosul: { degisken_min: { kule_kat: 50 } }
          - metin: { tr: "Körfezin üstünde asılı duran Kadim gemisinin karnından ince, beyaz bir ışık inip Kule'nin ellinci katına dokunuyor. Çok uzaklardan biri kapının açıldığını onaylamış gibi.", en: "From the belly of the Ancient ship hanging over the bay, a thin white beam comes down and touches the Spire's fiftieth floor. Somebody, a long way off, is signing for the delivery." }
            kosul: { bayrak: "thessar_indi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[ÇOK-EVREN AĞI · BAĞLANTI AÇILDI]", en: "[MULTIVERSE NETWORK · CONNECTION ESTABLISHED]" }
            satirlar:
              - { tr: "Dünya Katmanı komşu Katmanlarla temas düzeyine yükseltildi.", en: "Earth Layer has been upgraded to contact status with neighboring Layers." }
              - { tr: "Geçit: Kule, Kat 50. Ziyaret serbesttir. Dönüş garanti edilmez.", en: "Gate: The Spire, Floor 50. Visitation is unrestricted. Return is not guaranteed." }
              - { tr: "Not: Komşularınız da sizi ziyaret edebilir.", en: "Note: Your neighbors may also visit you." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Işık halkası ellinci katta durmadı, orada kırıldı. Bir parçası Kule'nin içine akmıyor; ne yukarı ne aşağı olan bambaşka bir yöne gidiyor.", en: "The ring of light didn't stop at the fiftieth floor. It broke there. Part of it isn't flowing into the Spire at all, but off in some other direction, one that isn't up and isn't down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu kapıyı tanıyorum. ben buradan geçmedim; ama geçen bir şeyden kopmuş olabilirim.", en: "i know this door. i didn't come through it. but i might have broken off something that did." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Başka dünyalar. Düpedüz başka dünyalar! Sen de şimdiden gözünü kapıya diktin, değil mi?\"", en: "\"Other worlds. Actual other worlds. And you're already eyeing the door, aren't you?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir yarış daha. Bu sefer bitiş çizgisi başka bir gezegende, o kadar.\"", en: "\"Another race. Only this time the finish line's on another planet.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sistem 'ziyaret serbest' diyor. Sistem bir şeye serbest dedi mi ben cüzdanımı yoklarım.\"", en: "\"The System says 'visitation is unrestricted.' When the System says something's free, I check my wallet.\"" }
        secenekler:
          - id: "kos"
            tur: "gosteris"
            etiket: { tr: "Kule'nin dış cephesinden ellinci kata koş", en: "Run up the Spire's outer wall to fifty" }
            gerekli: { stat: { agi: 160 } }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - bayrak: "gecit_ilk_giren"
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -3, insanlik: -1 }
              - itibar: { lonca: 4, yukselenler: 4 }
            kronik: { tr: "Ellinci kata herkesten önce, duvarı koşarak tırmandın. O sabah bütün şehir başka dünyalara giden yolu senin sırtında gördü.", en: "You ran up the wall to the fiftieth floor ahead of everyone. That morning the whole city saw the road to other worlds on your back." }
            sonraki: "gecit_kosu"
          - id: "kos_hazirlik"
            etiket: { tr: "İşaretlediğin yoldan ellinci kata tırman", en: "Climb the route you marked to the fiftieth floor" }
            goster: { bayrak: "hazirlik_gecit_cephe" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - bayrak: "gecit_ilk_giren"
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -3, insanlik: -1 }
              - itibar: { lonca: 4, yukselenler: 4 }
            kronik: { tr: "Ellinci kata herkesten önce, duvarı koşarak tırmandın. O sabah bütün şehir başka dünyalara giden yolu senin sırtında gördü.", en: "You ran up the wall to the fiftieth floor ahead of everyone. That morning the whole city saw the road to other worlds on your back." }
            sonraki: "gecit_kosu"
          - id: "topla"
            etiket: { tr: "Avcıları topla; geçide birlikte yürüyün", en: "Gather the hunters. Walk to the gate together" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3, lonca: 3 }
              - xp_seviye: 20
            kronik: { tr: "Geçide tek başına değil, bir avcı kalabalığının önünde yürüdün; çok-evrene ilk adım atan insanlar senin adımına uydu.", en: "You didn't walk to the gate alone. You led a crowd of hunters, and the first humans into the multiverse matched your stride." }
            sonraki: "gecit_esik"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kalabalığın arasında kal; önce kim gidiyor, izle", en: "Stay in the crowd. Watch who goes first" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - gizle: 5
              - ahlak: { duzen: 1, insanlik: 1 }
            kronik: { tr: "Geçit açıldığında kalabalığa karışıp başkalarının cesaretini seyrettin. İlk adımı atanlar arasında kimse seni görmedi.", en: "When the gate opened, you waited in the crowd and watched other people be brave. No one remembers you taking the first step." }
            sonraki: "gecit_izle"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bu kapıdan kimin geçtiğini sor", en: "Ask {npc:yanki} who came through this door" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 6, baglilik: 3 } }
            kronik: { tr: "Geçit açılırken ilk soruyu dünyaya değil kafandaki sese sordun. Ses de ilk kez sana geçmişinden bir kırıntı verdi.", en: "When the gate opened, you asked your first question of the voice in your head instead of the world, and for the first time it gave you a crumb of its past." }
            sonraki: "gecit_yanki"

      - id: "gecit_kosu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin cephesi cam değil, dokununca ılık ılık nefes alan bir taş. Ayağının değdiği her yerde küçük mavi pencereler açılıp kapanıyor; sen her biri kapanmadan ötekine basıp yükseliyorsun.", en: "The Spire's face isn't glass. It's warm stone, and it breathes when you touch it. Everywhere your feet land, little blue windows blink open and shut, and you're on the next one before they close." }
          - { tr: "Aşağıdaki kalabalık bir karınca yuvası kadar küçülmüş. Otuzuncu katta biri adını haykırıyor; kırkıncıya vardığında rüzgârın uğultusundan başka ses kalmamış.", en: "Below you the crowd shrinks to an anthill. Somebody yells your name around the thirtieth floor. By the fortieth there's no sound at all, just wind." }
          - { tr: "Ellinci katın kırık penceresinden içeri yuvarlandığında Sistem seni karşılamaya hazır bekliyor.", en: "When you roll in through the broken window of the fiftieth floor, the System is already there to greet you." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[Unvan: İlk Katman Gezgini]", en: "[Title: First Layer-Walker]" }
            satirlar:
              - { tr: "Bu duyuru tüm Dünya Katmanı'na yapıldı.", en: "This announcement has been made to all of Earth Layer." }
              - { tr: "Komşularınıza da.", en: "And to your neighbors." }
        secenekler:
          - id: "ilerle"
            etiket: { tr: "Soluklan, sonra eşikten geç", en: "Catch your breath. Cross the threshold" }
            etkiler:
              - unvan: "ilk_katman_gezgini"
              - xp_seviye: 30
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir dünyanın sınırını geçen ilk insan oldun; Sistem bunu komşulara da duyurdu.", en: "You became the first human to cross a world's border, and the System made sure the neighbors heard about it." }
            sonraki: "gecit_esik"

      - id: "gecit_izle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk kıpırdayan Lonca'nın avcıları oluyor: omuz omuza verip silahlarını çekerek merdivenlere yürüyorlar. Arkalarından bir sedyeyle iki ilk yardım çantası taşıyan Sığınak gönüllüleri geliyor; onları çağıran olmamış.", en: "The Guild's hunters move first: shoulder to shoulder, weapons out, headed for the stairs. Haven volunteers trail behind them with a stretcher and two first-aid kits. Nobody asked them to come." }
          - { tr: "Meydanın ortasında beyazlara bürünmüş bir Yükselen avazı çıktığı kadar bağırıyor: \"Cennetin kapısı açıldı!\" Sessiz Ağ'dan birkaç kişi de Kule'nin duvarına bantla bir anten tutturuyor.", en: "Dead center in the plaza, an Ascended in white is screaming at the top of his lungs: \"The gates of heaven are open!\" A couple of Quiet Network techs are duct-taping an antenna to the Spire's wall." }
          - { tr: "Saatler geçiyor, yukarı çıkanlardan geri inen olmuyor. Sonunda telsizin cızırtısı arasından bir ses tek bir kelime söylüyor: \"Okyanus.\"", en: "Hours go by. Nobody who went up comes back down. But a voice on the radio, through the static, says exactly one word: \"Ocean.\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Antenin ekranındaki dalga boyu Dünya'daki hiçbir frekansa uymuyor. Dalganın içine gömülü ritmik bir tını var: çan sesleri.", en: "The waveform on that antenna's screen doesn't match any frequency on Earth. Buried in it is a rhythmic chime: bells." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Sıra sende; yukarı çık", en: "Your turn. Head up" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "gecidin_kapilari"
            kronik: { tr: "Geçide herkesten sonra girdin; seni neyin beklediğini artık biliyordun.", en: "You went through the gate after everyone else, knowing what was waiting." }
            sonraki: "gecit_esik"

      - id: "gecit_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Sonunda pencerenin kenarında, yalnız senin görebildiğin titrek bir satır beliriyor.", en: "{npc:yanki} doesn't answer for a long time. Then a shaky line shows up at the edge of your window, where only you can see it." }
          - { tr: "{npc:yanki}: bu kapı açıldığında her seferinde bir şey girer, bir şey çıkar. bu sefer ne çıkacak, bilmiyorum. ama giren bir şey olacaksa o sen olmalısın.", en: "{npc:yanki}: every time this door opens, something goes in and something comes out. i don't know what's coming out this time. but if something's going in, it should be you." }
          - { tr: "'Her seferinde' sözü bir an orada asılı kalıyor; sonra satır, fazla konuşmuş gibi kendi kendini siliyor.", en: "The words 'every time' hang there for a second. Then the line erases itself, like it said too much." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Merdivenlere yürü", en: "Head for the stairs" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bilgi: "gecidin_kapilari"
            kronik: { tr: "Kafandaki sesin 'her seferinde' deyişini aklından atamadan geçide girdin.", en: "You went through the gate unable to stop hearing the voice in your head say 'every time.'" }
            sonraki: "gecit_esik"
          - id: "sor"
            etiket: { tr: "'Her seferinde' ne demek diye sor", en: "Ask what 'every time' means" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: -2, saygi: 3 } }
            kronik: { tr: "Kafandaki sesi tek bir kelimesinden yakaladın. Cevap vermedi; ama soruyu duymazdan da gelmedi.", en: "You caught the voice in your head on a single word. It didn't answer, but it didn't pretend not to hear you either." }
            sonraki: "gecit_esik"

      - id: "gecit_esik"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci katın ardında koridor falan yok; yuvarlak, kubbeli bir boşluk açılıyor. Duvarlarında üç kapı duruyor, hiçbiri bu dünyadan değil.", en: "There's no hallway behind the fiftieth floor, just a round, domed hollow. Three doors stand in its walls, and none of them is from this world." }
          - { tr: "Birincisi suyun ta kendisinden yapılmış; yüzeyini ılık, tuzlu bir rüzgâr dalgalandırıyor, derinlerden çan sesleri geliyor. İkincisi pirinçten. Kenarlarından tütsüyle kandil yağı kokusu sızıyor, ardında binlerce ses pazarlık ediyor.", en: "The first is made of water itself; a warm, salty breeze ripples its surface, and bells ring somewhere deep inside it. The second is brass. Incense and lamp oil leak around its edges, and behind it, a thousand voices haggling." }
          - { tr: "Üçüncüsü kapalı. Üstünde ışıktan bir mühür var; mühürde, eklemleri olmadık yerlerden bükülen uzun boylu bir figürün kabartması. Kabartmanın yüzü yok, yine de sana bakıyor.", en: "The third is shut. On it is a seal made of light, and on the seal, a relief of a tall figure whose joints bend in all the wrong places. It has no face. It's looking at you anyway." }
          - metin: { tr: "Bu figürü tanıyorsun: Öğretici'de, kuzey sırtında dikilen o şey de tam böyle eğiliyordu.", en: "You know that figure. The thing on the north ridge back in the Tutorial bent just like that." }
            kosul: { bayrak: "yeni_tavan_goruldu" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KATMAN VİZESİ]", en: "[LAYER VISA]" }
            satirlar:
              - { tr: "Ilunnar · durum: hasat edildi.", en: "Ilunnar · status: harvested." }
              - { tr: "Tavvar Kervanı · durum: bağlı Katman.", en: "Tavvari Caravan · status: bonded Layer." }
              - { tr: "{yer:yedi_taht} · durum: erişim davetle.", en: "Sevenfold Court · status: access by invitation." }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Su kapısının yüzeyi tek yönlü değil; kırışıkların yarısı içeri, yarısı dışarı akıyor. Öbür taraftan biri geliyor.", en: "The water door's surface isn't one-way. Half the ripples flow in, half flow out. Somebody's coming from the other side." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Su kapısının önünde dur ve bekle", en: "Stand at the water door and wait" }
            etkiler:
              - bilgi: "gecidin_kapilari"
              - ahlak: { duzen: 1 }
            kronik: { tr: "Başka bir dünyanın kapısında bekledin; oradan gelen ilk yolcuyu sen karşıladın.", en: "You waited at another world's door, and you were the one who met its first traveler." }
            sonraki: "gecit_cocuk"
          - id: "muhur"
            etiket: { tr: "Mühürlü kapıya avucunu daya", en: "Press your palm to the sealed door" }
            etkiler:
              - bilgi: "gecidin_kapilari"
              - dikkat: 4
              - ahlak: { duzen: -2 }
            kronik: { tr: "İlk gün mühürlü kapıyı zorladın; ardında her ne varsa adını bir kenara not etti.", en: "On the first day you pushed on the sealed door, and whatever was behind it took note of you." }
            sonraki: "gecit_muhur"

      - id: "gecit_muhur"
        yer: "kule"
        paragraflar:
          - { tr: "Mühür avucunun altında soğuk değil, kayıtsız. Bir an parmaklarının arasından bir şey seni okuyor: seviyeni, kademeni, kaç gündür yaşadığını.", en: "The seal under your palm isn't cold. It's indifferent. For a second something reads you between your fingers: your level, your Grade, how many days you've been alive." }
          - { tr: "Derken mühürde tek bir satır yanıyor: [Davetsiz. Not edildi.] Arkanda, su kapısından bir şıpırtı geliyor.", en: "Then one line lights up on the seal: [Uninvited. Noted.] Behind you, the water door splashes." }
        secenekler:
          - id: "don"
            etiket: { tr: "Su kapısına dön", en: "Turn back to the water door" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Elini mühürden çekip başka bir dünyadan gelen sese döndün.", en: "You pulled your hand off the seal and turned toward the sound coming from another world." }
            sonraki: "gecit_cocuk"

      - id: "gecit_cocuk"
        yer: "kule"
        paragraflar:
          - { tr: "Su kapısı şişiyor ve içinden bir çocuk düşüyor: gri-mavi tenli, cılız, omuzlarına tuz lekeleri serpilmiş, parmakları ikinci boğumuna kadar perdeli bir çocuk. Soluk almaya çalışıyor ama havanın tadı hoşuna gitmiyor.", en: "The water door bulges, and a kid tumbles out. Thin, blue-gray skin, salt freckles across the shoulders, fingers webbed up to the second knuckle. The kid is trying to breathe and doesn't like the taste of the air." }
          - { tr: "Gözlerinde iki kat göz kapağı var; ikincisi korkudan durmadan kapanıp açılıyor. Elinde yeşile çalmış küçük bir çanı, hiç bırakmayacakmış gibi sımsıkı tutuyor.", en: "Its eyes have two lids, and the second one keeps flicking shut in fear. It's clutching a little bell gone green with age like it'll never let go." }
          - { tr: "Arkanda metal şakırtıları. Lonca'nın öncü avcıları girişe dikilmiş, silahlarını çocuğa doğrultmuşlar: \"Kapıdan canavar çıktı!\" Sessiz Ağ'dan bir teknisyen aralarından sıyrılıp bağırıyor: \"Ateş etmeyin! O bir veri!\"", en: "Metal clicks behind you. The Guild's lead hunters are in the doorway, weapons trained on the kid: \"Monster out of the Gate!\" One of the Quiet Network techs shoves between them: \"Don't shoot! That's data!\"" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Çocuğun seviyesi yok; sıfır değil, düpedüz yok. Sistem başının üstünde hiçbir şey göstermiyor, sanki orada kimse durmuyormuş gibi.", en: "The kid has no level. Not zero. None. The System shows nothing over its head, like nobody's standing there at all." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistemi yok; toplanıp götürülmüş. bu çocuk hasattan geriye kalan şey. seni de gördü: ışıldıyorsun.", en: "no system. it's been collected. this kid is what's left after a harvest. and it saw you. you're glowing." }
        secenekler:
          - id: "koru"
            etiket: { tr: "Çocukla silahların arasına geç", en: "Step between the kid and the guns" }
            etkiler:
              - bayrak: "tilu_korundu"
              - ahlak: { merhamet: 6, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - dikkat: 3
              - tohum: { olay: "batik_tilu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Geçitten gelen çocuk hâlâ Sığınak'ın çadırlarında.", en: "The kid who came through the passage is still in the Haven's tents." } }
            kronik: { tr: "Başka bir dünyadan gelen ilk yolcu bir çocuktu; sen de onunla insanların silahları arasına girdin.", en: "The first traveler from another world was a child, and you stood between it and humanity's guns." }
            sonraki: "gecit_korundu"
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Avcılara tek bir bakış at; silahlar insin", en: "Give the hunters one look. Guns down" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - bayrak: "tilu_korundu"
              - aciga_vur: true
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 3, siginak: 3 }
              - tohum: { olay: "batik_tilu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Geçitten gelen çocuk hâlâ Sığınak'ın çadırlarında.", en: "The kid who came through the passage is still in the Haven's tents." } }
            kronik: { tr: "Tek bakışınla koca bir avcı birliğine silah indirttin. O gün Kule'de kimse başka bir dünyadan gelmiş bir çocuğa ateş etmedi.", en: "One look from you and a whole squad of hunters lowered their guns. Nobody in the Spire shot a child from another world that day." }
            sonraki: "gecit_korundu"
          - id: "ag"
            etiket: { tr: "Ağ'ın teknisyenine bırak; incelesinler", en: "Hand it to the Network. Let them study it" }
            etkiler:
              - bayrak: "tilu_ag_teslim"
              - ahlak: { duzen: 3, merhamet: -3, insanlik: -1 }
              - itibar: { sessiz_ag: 6 }
              - tohum: { olay: "batik_tilu", gecikme: { min: 4, max: 8 }, hatirlatma: { tr: "Geçitten gelen çocuk hâlâ Sığınak'ın çadırlarında.", en: "The kid who came through the passage is still in the Haven's tents." } }
            kronik: { tr: "Başka bir dünyadan gelen ilk çocuğu bir teknisyenin battaniyesine sarıp deney masasına yolladın.", en: "You wrapped the first child from another world in a tech's blanket and sent it off to a lab table." }
            sonraki: "gecit_ag"
          - id: "karisma"
            etiket: { tr: "Karışma; avcılar karar versin", en: "Stay out of it. Let the hunters decide" }
            etkiler:
              - bayrak: "tilu_vuruldu"
              - ahlak: { merhamet: -8, insanlik: -4 }
              - itibar: { lonca: 3, siginak: -5 }
            kronik: { tr: "Kule'nin ellinci katında bir çocuğun vurulmasını seyrettin. O gün {yer:batik_takimada|in} çanları yas için çaldı.", en: "On the Spire's fiftieth floor, you watched a child get shot. The bells of {yer:batik_takimada} rang for mourning that day." }
            sonraki: "gecit_vuruldu"

      - id: "gecit_korundu"
        yer: "kule"
        paragraflar:
          - { tr: "Çocuk arkana saklanıp iki eliyle ceketinin eteğine yapışıyor. Avcılar bir süre daha nişanda bekledikten sonra namlularını birer birer indiriyor; içlerinden biri yere tükürüp merdivenlere yöneliyor.", en: "The kid ducks behind you and grabs the hem of your jacket with both hands. The hunters hold their aim a while longer, then one by one the barrels come down. One of them spits on the floor and heads back to the stairs." }
          - { tr: "Çocuk dilini damağında şaklatarak konuşuyor, Sistem de cümleyi yarım yamalak çeviriyor: [Çeviri: kısmi] \"Seviyeli. Sen seviyelisin. Başakçı seni duyacak.\" Sonra borcunu ödüyormuş gibi çanı avucuna bırakıyor.", en: "The kid talks by clicking its tongue against the roof of its mouth, and the System half-translates: [Translation: partial] \"Leveled. You're leveled. The Gleaner will hear you.\" Then it drops the bell into your palm, like it's settling a debt." }
          - { tr: "Su kapısına dönmüyor. Dönmek istemediği öyle belli ki kimse onu zorlamıyor.", en: "It won't go back through the water door. It's so obvious it doesn't want to that nobody tries to make it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ver onu bana. Hipotermiye girmiş, korkuyor, bizim hava da ona ağır geliyor. Kahramanlığı sonra yaparsın.\"", en: "\"Give the kid to me. Hypothermic, scared, and our air's too heavy for it. You can be a hero later.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onu aşağıdaki Sığınak çadırına götür", en: "Take it to the Haven tent downstairs" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Başka bir dünyanın çocuğunu Kule Dibi'ndeki bir Sığınak çadırına, güvendiğin ellere emanet ettin.", en: "You left another world's child in a Haven field tent in {yer:kule_dibi}, in hands you trusted." }
            sonraki: "gecit_karar"
          - id: "yanina"
            etiket: { tr: "Onu yanında tut; eve sen götüreceksin", en: "Keep it with you. You'll take it home" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { merhamet: 4, duzen: -1 }
            kronik: { tr: "Başka bir dünyadan gelen çocuğa, onu evine kendi elinle götüreceğine söz verdin.", en: "You promised a child from another world you'd be the one to take it home." }
            sonraki: "gecit_karar"

      - id: "gecit_ag"
        yer: "kule"
        paragraflar:
          - { tr: "Teknisyen çocuğu gümüş rengi bir termal battaniyeye sarıp bileğine bir sensör bağlıyor. Çocuk direnmiyor, yalnızca çanı göğsüne bastırıyor.", en: "The tech wraps the kid in a silver thermal blanket and straps a sensor to its wrist. It doesn't fight. It just presses the bell to its chest." }
          - { tr: "Merdivenlerin başında dönüp sana bakıyor. İkinci göz kapağı inip bir daha açılmıyor.", en: "At the top of the stairs it turns to look at you. Its second eyelid slides shut and stays that way." }
          - { tr: "\"Kimseye bir şey olmayacak,\" diyor teknisyen; sana değil de kendine söylüyor sanki. \"Yalnızca ölçüm alacağız.\"", en: "\"Nobody's getting hurt,\" the tech says, like he's telling himself instead of you. \"We're just going to take some measurements.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Çocuğa bir gün geri döneceğini söyle", en: "Tell the kid you'll come back for it" }
            etkiler:
              - ahlak: { merhamet: 2 }
            kronik: { tr: "Ağ'a teslim ettiğin çocuğa bir gün geri döneceğini söyledin; o söz artık boynunun borcuydu.", en: "You told the child you'd handed to the Network that you'd come back for it. Now you owed it that." }
            sonraki: "gecit_karar"
          - id: "don"
            etiket: { tr: "Arkanı dön; işin bitti", en: "Turn around. You're done here" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Ağ'ın götürdüğü çocuğa arkanı dönüp onu bir daha düşünmemeye çalıştın.", en: "You turned your back on the child the Network took and tried not to think about it again." }
            sonraki: "gecit_karar"

      - id: "gecit_vuruldu"
        yer: "kule"
        paragraflar:
          - { tr: "Silah sesi kubbede üç kez yankılanıyor. Çocuk sırtüstü su kapısına düşüyor, kapı da onu bir damla gibi yutuveriyor.", en: "The shot echoes three times around the dome. The kid falls backward into the water door, and the door swallows it like a drop of rain." }
          - { tr: "Kapının yüzeyi bir an pembeleşip yeniden duruluyor. Derinlerdeki çanlar susmuş; onların yerine tek, ağır bir çan ara vere vere çalmaya başlıyor.", en: "For a moment the door's surface goes pink. Then it clears. The bells deep inside go quiet, and in their place one heavy bell starts tolling, slow and spaced out." }
          - { tr: "Avcılardan biri omuz silkiyor: \"Canavardı.\" Kubbenin taş zemininde yeşile çalmış küçük bir çan duruyor.", en: "One of the hunters shrugs. \"It was a monster.\" On the stone floor of the dome lies a small bell, gone green with age." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Katman ziyaretçisi öldü]", en: "[Layer visitor deceased]" }
            satirlar:
              - { tr: "Diplomatik kayıt oluşturuldu. Kayıt ziyaretçinin Katmanı'na iletildi.", en: "Diplomatic record created. Record forwarded to the visitor's Layer." }
        secenekler:
          - id: "can"
            etiket: { tr: "Çanı yerden al", en: "Pick the bell up off the floor" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Vurulan çocuğun çanını yerden alıp yanına koydun; çan cebinde bir itiraf gibi ağır duruyordu.", en: "You picked up the shot child's bell and kept it on you. It sat in your pocket, heavy as a confession." }
            sonraki: "gecit_karar"
          - id: "silah"
            etiket: { tr: "Ateş edenin tüfeğini elinden al ve kır", en: "Take the shooter's rifle and snap it" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 2 }
              - itibar: { lonca: -4 }
              - dikkat: 2
            kronik: { tr: "Çocuk vurulduktan sonra tüfeği kırdın. Geç kalmış öfken kimseyi geri getirmedi, ama avcılar bunu bir kenara yazdı.", en: "You broke the rifle after the child was already shot. Late anger brought no one back, but the hunters didn't forget it." }
            sonraki: "gecit_karar"

      - id: "gecit_karar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşama doğru {yer:kule_dibi} pazar yerinden çok mahkeme salonunu andırıyor. Lonca'nın, Sığınak'ın, Sessiz Ağ'ın ve Yükselenler'in sözcüleri merdivenlerin dibinde bağrışıp duruyor: geçit kimin, kim geçecek, kim geçemeyecek?", en: "By evening, {yer:kule_dibi} looks less like a market and more like a courtroom. Spokespeople from the Guild, the Haven, the Quiet Network and the Ascended are shouting at each other at the foot of the stairs: whose gate is it, who goes through, who doesn't." }
          - { tr: "Derken biri seni görüyor, bağrışmalar kesiliyor. Kimse ağzını açmıyor ama herkes biliyor: bu meydanda geçitten geçip başka bir dünyanın havasını soluyan, üstelik yorgunluk nedir bilmiyormuş gibi görünen tek kişi sensin.", en: "Then somebody spots you, and the shouting stops. Nobody says it, but everybody knows: you're the only person in this plaza who went through that gate, breathed another world's air and doesn't look the least bit tired." }
          - metin: { tr: "{yer:kasaba_cekirdegi} sana bağlı. Hiçbiri yüksek sesle söylemese de kararda son söz zaten sende.", en: "The Town Core is bound to you. Nobody says it out loud, but the last word on this was always going to be yours." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Kalabalığın arasında siyah bir ceket kıpırdıyor. {npc:aras_kurt} sana değil, geçide bakıyor; ondan hiç görmediğin bir şey.", en: "A black jacket shifts in the crowd. {npc:aras_kurt} is looking at the gate, not at you. That's new for him." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
        secenekler:
          - id: "acik"
            etiket: { tr: "Geçit herkese açık kalsın", en: "The gate stays open to everyone" }
            etkiler:
              - bayrak: "gecit_herkese_acik"
              - ahlak: { duzen: -6, insanlik: 2 }
              - itibar: { sessiz_ag: 4, yukselenler: 3, lonca: -3 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Ellinci katın ardındaki geçit için verdiğin karar {npc:aras_kurt|in} da kulağına gitmiş.", en: "What you decided about the passage past the fiftieth floor reached {npc:aras_kurt} too." } }
            kronik: { tr: "Geçidi herkese açık bıraktın. Aynı kapı artık hem insanları dışarı salıyor hem başka dünyaları içeri alıyordu.", en: "You left the gate open to everyone. The same door now let humans out and let other worlds in." }
            sonraki: "gecit_son"
          - id: "denetim"
            etiket: { tr: "Lonca nöbet tutsun; geçiş izinle olsun", en: "The Guild stands watch. Passage by permit" }
            etkiler:
              - bayrak: "gecit_denetimli"
              - ahlak: { duzen: 6, merhamet: -2 }
              - itibar: { lonca: 6, siginak: -2, sessiz_ag: -2 }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Ellinci katın ardındaki geçit için verdiğin karar {npc:aras_kurt|in} da kulağına gitmiş.", en: "What you decided about the passage past the fiftieth floor reached {npc:aras_kurt} too." } }
            kronik: { tr: "Geçide nöbetçi dikip izin kâğıdı şartı koydun; çok-evrene giden yol bir gümrük kapısına döndü.", en: "You put guards and permits on the gate. The road to the multiverse turned into a customs checkpoint." }
            sonraki: "gecit_son"
          - id: "benim"
            etiket: { tr: "Geçidi mühürle; yalnızca sen geçeceksin", en: "Seal the gate. Only you go through" }
            etkiler:
              - bayrak: "gecit_oyuncunun"
              - ahlak: { duzen: 3, insanlik: -4 }
              - itibar: { lonca: -2, siginak: -2, sessiz_ag: -3, yukselenler: 2 }
              - dikkat: 5
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" }, hatirlatma: { tr: "Ellinci katın ardındaki geçit için verdiğin karar {npc:aras_kurt|in} da kulağına gitmiş.", en: "What you decided about the passage past the fiftieth floor reached {npc:aras_kurt} too." } }
            kronik: { tr: "Çok-evrenin kapısının anahtarını cebine koydun. İnsanlık başka dünyaları artık ancak senin anlatacaklarından tanıyabilecekti.", en: "You pocketed the key to the multiverse. From then on, humanity could only know other worlds through the stories you brought back." }
            sonraki: "gecit_son"

      - id: "gecit_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı olmuş, Kule'nin ellinci katı hâlâ ışıl ışıl; şehir yeni bir yıldız edinmiş sanki. Meydanda uyuyan yok.", en: "At midnight the Spire's fiftieth floor is still glowing, like the city picked up a new star. Nobody in the plaza is sleeping." }
          - { tr: "Rüzgâr çok uzaklardan bir çan sesi getiriyor, başka bir yerden de pirinç terazilerin şıngırtısını. Mühürlü kapının ardından ise hiçbir şey gelmiyor; yalnız bekleyen bir şeyin sessizliği.", en: "From somewhere far off, the wind carries the sound of a bell. From somewhere else, the clink of brass scales. And from behind the sealed door, nothing at all: the silence of something waiting." }
          - metin: { tr: "Bu gece kapının öbür yanındaki dünyada, adını bilmediğin bir anne tek başına bir çan çalıyor.", en: "Tonight, in a world on the other side of that door, a mother whose name you don't know is ringing a bell all by herself." }
            kosul: { bayrak: "tilu_vuruldu" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Işığa bak ve yarını düşün", en: "Watch the light and think about tomorrow" }
            etkiler:
              - xp_seviye: 40
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Çok-evrenin açıldığı gece ellinci kattaki ışığa bakıp yarını düşündün. Yarın seni üç ayrı dünyada bekliyordu.", en: "The night the multiverse opened, you watched the light on the fiftieth floor and thought about tomorrow. Tomorrow was waiting for you in three different worlds." }
            sonraki: "@akis"

  # ================================================================== BATIK TAKIMADA (Nehhalar · Hasat'ın aynası)
  - id: "batik_ilk_adim"
    konum: ["batik_takimada"]
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak_yok: "batik_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Tuzlu kapı", en: "The salt door" }
    sahne: "batik_ilk_1"
    sahneler:
      - id: "batik_ilk_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısından geçer geçmez dizine kadar ılık bir denize gömülüyorsun. Gökyüzü olması gerekenden büyük, güneş olması gerekenden beyaz; ufka kadar her yer su.", en: "The moment you step through the water door, you're knee-deep in a warm sea. The sky's too big, the sun's too white, and it's water all the way to the horizon." }
          - { tr: "Sudan yarı batık, yeşile çalmış çan kuleleri yükseliyor. Her dalga vurduğunda içlerindeki çanlar kendiliğinden çalıyor, bütün takımada da tek bir uzun soluk gibi birden inliyor.", en: "Towers jut out of the water: half-drowned bell towers gone green with age. Every time a wave rolls in, the bells inside them ring on their own, and the whole archipelago moans at once, like one long breath." }
          - { tr: "Sistem susmuş. Pencereni açmaya çalışıyorsun; açılıyor açılmasına, ama içindeki her şey bir bardağın dibinden okunuyormuş gibi bulanık.", en: "The System is quiet. You open your window, and it opens, but everything in it looks blurry, like you're reading it through the bottom of a glass." }
          - metin: { tr: "En yakın kulenin kemerine kırmızı bir bezle deniz kabuklarından dizilmiş küçük bir kolye bağlanmış. Su kapısının bu yanında, suyun yüzünde soluk pembe bir leke hâlâ yüzüp duruyor.", en: "Somebody's tied a red rag and a little necklace of seashells to the arch of the nearest tower. On this side of the water door, a faint pink stain still floats on the surface." }
            kosul: { bayrak: "tilu_vuruldu" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[KATMAN ANALİZİ: Ilunnar]", en: "[LAYER ANALYSIS: Ilunnar]" }
            satirlar:
              - { tr: "Durum: hasat edildi. Hasat tarihi: 212 yıl önce.", en: "Status: harvested. Harvest date: 212 years ago." }
              - { tr: "Yaşayan seviye: tespit edilemedi.", en: "Living levels: none detected." }
              - { tr: "Uyarı: ziyaretçinin seviyesi bu Katman'da tek ışık kaynağıdır.", en: "Warning: the visitor's level is the only light source in this Layer." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Suyun altında sokaklar var: kaldırım taşları, bir çeşmenin kenarı, bir okul bahçesinin yarısı. Burası deniz değil, boğulmuş bir kıta.", en: "There are streets under the water. Cobblestones, the rim of a fountain, half a schoolyard. This isn't a sea. It's a drowned continent." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burada sistemin sesi yok; her şey toplanmış. kendimi ilk kez bu kadar net duyuyorum ve hiç hoşuma gitmiyor.", en: "no system voice here. everything's been collected. it's the first time i can hear myself this clearly, and i don't like it at all." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Şu sese bak. Bütün bu çanlar... Sanki biri hâlâ yardım çağırıyor da kimi çağırdığını unutmuş.\"", en: "\"That sound. All those bells. It's like somebody's still calling for help, but they forgot who they were calling.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Hasat edilmiş bir dünya. Demek bizim son sayfamız da böyle görünüyor.\"", en: "\"A harvested world. So this is what our last page looks like.\"" }
        secenekler:
          - id: "kule"
            etiket: { tr: "En yakın çan kulesine doğru yürü", en: "Wade toward the nearest bell tower" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
            sonraki: "batik_ilk_sal"
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Sudaki sokakların haritasını gözünle çıkar", en: "Map the streets under the water by eye" }
            gerekli: { stat: { per: 140 } }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - xp_seviye: 15
              - egilim: { gizlilik: 2 }
            sonraki: "batik_ilk_harita"
          - id: "tirman"
            etiket: { tr: "En yüksek kuleye tırman, takımadayı gör", en: "Climb the tallest tower. Get eyes on the Reach" }
            zar: { stat: "agi", zorluk: 380, tek: false, basarisiz: "batik_ilk_dusus", basarisiz_etkiler: [{ can: -60 }] }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - xp_seviye: 10
            sonraki: "batik_ilk_tepe"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} Sistem'in neden sustuğunu sor", en: "Ask {npc:yanki} why the System went quiet" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - iliski: { yanki: { guven: 5, baglilik: 3 } }
            sonraki: "batik_ilk_yanki"

      - id: "batik_ilk_harita"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Gözlerini kısınca dünya katman katman açılıyor: kıyıda bir liman, limanın ardında yokuşa tırmanan bir çarşı, çarşının tepesinde kubbeli bir yapı. Hepsi on kulaç suyun altında.", en: "You narrow your eyes, and the world peels open layer by layer. A harbor at the shore, a market climbing the hill behind it, a domed building at the top, all of it sixty feet underwater." }
          - { tr: "Kuleler rastgele dizilmemiş. Her biri bir zamanlar bir mahallenin ortasında yükseliyormuş; mahalleler çanlardan birbirini duyabilsin diye.", en: "The towers aren't scattered at random. Each one used to stand in the middle of a neighborhood, so the neighborhoods could hear each other." }
          - { tr: "Kubbenin içinde bir hava cebi parlıyor. Doğuda, en uzak kulenin dibinde de bir ateşin dumanı tütüyor.", en: "There's a pocket of air shining inside that dome. And to the east, at the foot of the farthest tower, smoke from a fire." }
        secenekler:
          - id: "duman"
            etiket: { tr: "Dumanın olduğu yöne git", en: "Head toward the smoke" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_dusus"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Üçüncü katta kulenin yeşil bronz basamakları elinde ufalanıyor, sen de sırtüstü suya çakılıyorsun. Dibe değmeden bir şey gözüne çarpıyor: aşağıda, sokakların arasında cam gibi parlayan uzun bir şey ağır ağır kıpırdanıyor.", en: "The tower's green bronze rungs crumble in your hand on the third floor, and you go into the water flat on your back. Before you hit bottom, something catches your eye: down between the streets, something long and glassy is moving, slow." }
          - { tr: "Yüzeye çıktığında kıpırtı kaybolmuş. Ama göğsünün önünde, pencerenin kenarında bir anlığına kırmızı bir satır yanıp sönmüş: [Okundu.]", en: "By the time you break the surface, the movement's gone. But for a second, at the edge of your window, a red line blinked: [Read.]" }
        secenekler:
          - id: "yuz"
            etiket: { tr: "Kıyıya yüz; dumanın olduğu yere", en: "Swim for the shore. Toward the smoke" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_tepe"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kulenin tepesinde çanın kendisi asılı: bir ev büyüklüğünde, içi kuş yuvalarıyla dolu. Buradan bakınca takımada bir harita gibi serilmiş önüne; yüzlerce kule, aralarında sığ sular, kum dilleri.", en: "The bell itself hangs at the top of the tower, big as a house and full of bird nests. From up here the archipelago looks like a map: hundreds of towers, shallow water between them, spits of sand." }
          - { tr: "Doğuda, en uzaktaki kulenin çevresine tuz bloklarından bir sal köyü kurulmuş. Batıda deniz koyulaşıyor; orada tek bir kule bile yok, suyun rengi de olması gerektiği gibi değil.", en: "To the east, around the farthest tower, there's a village of rafts built from salt blocks. To the west, the sea gets darker. No towers there, and the water's the wrong color." }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Batıdaki koyu suyun içinde belli belirsiz ışıklar yanıp sönüyor; aşağıda biri yüzlerce pencereyi birden açıp kapıyor sanki.", en: "Faint lights blink in that dark water to the west, like somebody down there is opening and closing hundreds of windows at once." }
        secenekler:
          - id: "dogu"
            etiket: { tr: "Doğudaki sal köyüne in", en: "Climb down and head for the raft village" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_yanki"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:yanki}: çünkü dinleyecek kimse kalmadı. sistem burada işini bitirip toparlandı, gitti. ama bir şeyi unuttu.", en: "{npc:yanki}: because there's nobody left to listen. the system finished its job here, packed up and left. but it forgot something." }
          - { tr: "Bir süre yalnız dalgaların ve çanların sesi duyuluyor. Sonra çok daha alçak bir satır beliriyor.", en: "For a while there's only the sound of waves and bells. Then a much quieter line." }
          - { tr: "{npc:yanki}: neyi unuttuğunu bilmiyorum. ama bilmek istemediğimi biliyorum. doğuda duman var; insana benzeyen şeyler.", en: "{npc:yanki}: i don't know what it forgot. but i know i don't want to know. there's smoke to the east. things that look like people." }
        secenekler:
          - id: "git"
            etiket: { tr: "Dumanın peşine düş", en: "Follow the smoke" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_sal"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Doğudaki kulenin dibinde, tuz bloklarından çatılmış bir salın üstünde dört kişi ağ topluyor. Gri-mavi tenli, cılız, omuzları tuz lekeli, parmakları perdeli insanlar bunlar; her soluk alışlarında kaburgaları tek tek sayılıyor.", en: "At the foot of the eastern tower, four people are hauling a net onto a raft made of salt blocks. Thin, blue-gray skin, salt-freckled shoulders, webbed fingers. People, more or less, and you can count their ribs with every breath." }
          - { tr: "Seni görür görmez ağı bırakıyorlar. Aralarından yaşlıca bir kadın dizlerinin üstüne çöküyor; ötekiler kemik uçlu zıpkınlarını kaldırıyor.", en: "The moment they see you they drop the net. One of them, an older woman, falls to her knees. The others raise bone-tipped harpoons." }
          - { tr: "Analiz penceren açılıp kapanıyor, açılıp kapanıyor. Dördünün de başının üstünde aynı şey yazıyor: [Seviye: —]", en: "Your Analysis window opens and closes, opens and closes. Over all four heads it shows the same thing: [Level: —]" }
          - metin: { tr: "Zıpkınların ucu dosdoğru sana çevrili. Kadınlardan biri ağlayarak aynı kelimeyi tekrarlıyor; Sistem çevirmeye tenezzül etmiyor, ama anlamak için çeviriye gerek de yok.", en: "The harpoon points are aimed straight at you. One of the women is crying and repeating the same word. The System doesn't bother translating it, but you don't need a translation." }
            kosul: { bayrak: "tilu_vuruldu" }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Seviyeleri sıfır değil, tanımsız. Sistem onları artık kayıtlarında bile tutmuyor. Hasat yalnız güçlerini değil, sayılma hakkını da alıp götürmüş.", en: "Their levels aren't zero. They're undefined. The System doesn't even keep them on file anymore. The Harvest didn't just take their power. It took being counted." }
        secenekler:
          - id: "eller"
            etiket: { tr: "Ellerini aç, yavaşça yaklaş", en: "Open your hands. Come in slow" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "batik_ilk_temas"
          - id: "konus"
            tur: "gosteris"
            etiket: { tr: "Konuş; sesin bütün kuleleri titretsin", en: "Speak, and let your voice shake every tower" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - bayrak: "batik_tanri_sanildi"
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { insanlik: -3 }
            sonraki: "batik_ilk_donen"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Pencereni karart; onlardan biri gibi görün", en: "Dim your window. Look like one of them" }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "batik_ilk_temas"
          - id: "geri"
            etiket: { tr: "Geri çekil; onları rahat bırak", en: "Back off. Leave them in peace" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "batik_ilk_gece"

      - id: "batik_ilk_donen"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sesin suyun üstüne yayılınca en yakın üç kulenin çanı birden çalıyor. Zıpkınlar teker teker suya düşüyor.", en: "Your voice rolls out across the water, and the bells in the three nearest towers ring at once. The harpoons drop into the water one by one." }
          - { tr: "Diz çökmüş kadın başını kaldırıyor. Sistem bu kez çeviriyor: [Çeviri: kısmi] \"Dönen. Çanların söylediği gibi. Seviyeli olan bir gün dönüp son çanı çalacak.\"", en: "The kneeling woman lifts her head. This time the System translates: [Translation: partial] \"The Returner. Like the bells said. One with a level will come back one day and ring the last bell.\"" }
          - { tr: "Salın ucundaki genç adam suya tükürüyor. \"Seviyeli olan her şey Başakçı'yı çağırır, Saye,\" diyor. \"Bu Dönen falan değil. Yem bu.\"", en: "A young man at the end of the raft spits into the water. \"Anything with a level calls the Gleaner, Saye,\" he says. \"That's no Returner. That's bait.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Sustur onu; evet, sen Dönen'sin", en: "Shut him up. Yes, you're the Returner" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - dikkat: 2
            sonraki: "batik_ilk_temas"
          - id: "red"
            etiket: { tr: "Tanrı olmadığını söyle", en: "Tell them you're no god" }
            etkiler:
              - bayrak_kaldir: "batik_tanri_sanildi"
              - ahlak: { insanlik: 4 }
            sonraki: "batik_ilk_temas"
          - id: "basakci"
            etiket: { tr: "Gence Başakçı'nın ne olduğunu sor", en: "Ask the young one what the Gleaner is" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "batik_ilk_temas"

      - id: "batik_ilk_temas"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yaşlı kadın, Saye, avucunu suya batırıp ıslak avucunu alnına bastırıyor. Bu onların selamı; senin de aynısını yapmanı bekliyor.", en: "The old woman, Saye, dips her palm in the water, then presses the wet palm to her forehead. It's a greeting. She's waiting for you to do the same." }
          - { tr: "Onlar konuştukça Sistem'in çevirisi toparlanıyor. Kendilerine Nehha diyorlar. Bu dünyanın adı Ilunnar'mış; iki yüz on iki yıl önce bir gece Hasat gelmiş, bütün seviyeleri toplayıp gitmiş. Kıyıları tutan büyüyü de götürdüğü için ardından denizler yükselmiş.", en: "The more they talk, the better the System gets at translating. They're the Nehha. This world was called Ilunnar. Two hundred and twelve years ago, one night, the Harvest came, collected every level and left. Then the seas rose, because it took the magic holding the shorelines too." }
          - { tr: "\"Geride kalanlara Sönükler diyoruz,\" diyor Saye. \"Bizim gibilere. Bir de Başakçı kaldı geriye, Hasat'ın unuttuğu şey. Seviyesi olan ne varsa bulur. Sen ise ışıl ışılsın.\"", en: "\"We call the ones left behind the Dimmed,\" Saye says. \"Like us. And the Gleaner was left, too, the thing the Harvest forgot. It finds anything with a level. And you, you're shining.\"" }
          - metin: { tr: "Genç adam, Kesh, zıpkınını hâlâ indirmemiş. \"Kapının öbür yanında bir çocuğumuz vuruldu,\" diyor. \"Senin dünyanda. O kutun bunu da çeviriyor mu?\"", en: "The young one, Kesh, still hasn't put his harpoon down. \"One of our children got shot on the other side of that door,\" he says. \"In your world. Does your little box translate that too?\"" }
            kosul: { bayrak: "tilu_vuruldu" }
          - metin: { tr: "\"Kapıdan bir çocuğumuz geçti,\" diyor Saye, gözlerini yüzünden ayırmadan. \"Tilu. Yanına bir çan almıştı. Gördün mü onu?\"", en: "\"One of our children went through the door,\" Saye says, eyes on your face. \"Tilu. Took a bell along. Did you see her?\"" }
            kosul: { bayrak_yok: "tilu_vuruldu" }
        secenekler:
          - id: "selam"
            etiket: { tr: "Suya, sonra alnına dokun", en: "Touch the water, then your forehead" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Tuzlu kapıdan geçtiğin günden beri takımadada biri seni bekliyor.", en: "Ever since you came through the salt door, someone in the Reach has been waiting on you." } }
            sonraki: "batik_ilk_gece"
          - id: "tilu"
            etiket: { tr: "Tilu'nun güvende olduğunu söyle", en: "Tell her Tilu is safe" }
            goster: { bayrak: "tilu_korundu" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Tuzlu kapıdan geçtiğin günden beri takımadada biri seni bekliyor.", en: "Ever since you came through the salt door, someone in the Reach has been waiting on you." } }
            sonraki: "batik_ilk_gece"
          - id: "ozur"
            etiket: { tr: "Kesh'in gözüne bak ve özür dile", en: "Look Kesh in the eye and apologize" }
            goster: { bayrak: "tilu_vuruldu" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Tuzlu kapıdan geçtiğin günden beri takımadada biri seni bekliyor.", en: "Ever since you came through the salt door, someone in the Reach has been waiting on you." } }
            sonraki: "batik_ilk_gece"
          - id: "fener"
            etiket: { tr: "Sönüklerin nerede toplandığını sor", en: "Ask where the Dimmed gather" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Tuzlu kapıdan geçtiğin günden beri takımadada biri seni bekliyor.", en: "Ever since you came through the salt door, someone in the Reach has been waiting on you." } }
            sonraki: "batik_ilk_gece"

      - id: "batik_ilk_gece"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "O fazla beyaz güneş denize gömülürken çanlar yavaşlıyor. Gece çöküyor; bu dünyanın gecesinde yıldız az, çoğunun da çok uzun zaman önce söndüğünü sezer gibisin.", en: "As the sun, that too-white sun, sinks into the sea, the bells slow down. Night falls, and this world's night doesn't have many stars. You get the feeling most of them went out a long time ago." }
          - { tr: "Batıda, koyu suların altında ışıklar yanıp sönüyor; bir değil, yüzlerce. Minicik, mavi, dikdörtgen ışıklar: pencereler.", en: "Out west, under the dark water, lights are blinking. Not one: hundreds. Tiny, blue, rectangular lights. Windows." }
          - { tr: "Işıklar bir süre bir yöne doğru akıyor, sonra olduğu yerde kalıyor. Sanki sana dönmüşler.", en: "For a while the lights drift one way. Then they stop. Like they've turned toward you." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Seviye taraması algılandı]", en: "[Level scan detected]" }
            satirlar:
              - { tr: "Kaynak: tanımsız. Sınıflandırma: Hasat artığı.", en: "Source: undefined. Classification: Harvest remnant." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Işıklara bakmaya devam et", en: "Keep watching the lights" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Tuzlu kapının ardında gördüğün kubbe aklından çıkmıyor.", en: "You can't stop thinking about the dome you saw past the salt door." } }
            sonraki: "@akis"
          - id: "karart"
            tur: "gizle"
            etiket: { tr: "Pencereni kapat ve kulenin gölgesine çekil", en: "Close your window. Get into the tower's shadow" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Tuzlu kapının ardında gördüğün kubbe aklından çıkmıyor.", en: "You can't stop thinking about the dome you saw past the salt door." } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SON FENER (önemli)
  - id: "batik_son_fener"
    konum: ["batik_takimada"]
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "batik", "ahlak"]
    gerilim: 3
    onemli: true
    kart: { tr: "Son Fener", en: "The Last Light" }
    sahne: "fener_1"
    sahneler:
      - id: "fener_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kesh zıpkını sırtında, soluk soluğa çıkagelmiş. \"Bekçi seni çağırıyor,\" diyor. Peşine takılıp takımadanın doğusuna, Son Fener'e kadar gidiyorsun.", en: "Kesh finds you, harpoon slung across his back, out of breath. \"The keeper's asking for you,\" he says. You follow him to the east end of {yer:batik_takimada}, to the Last Light." }
          - { tr: "Son Fener aslında batık bir deniz fenerinin sudan dışarıda kalan son on katı. Tepesindeki lamba mana değil balık yağı yakıyor; ışığı sarı, titrek ve inatçı.", en: "The Last Light is the top ten floors of a drowned lighthouse, the only part still above water. The lamp up top doesn't burn mana; it burns fish oil. The light is yellow, shaky and stubborn." }
          - { tr: "Fenerin dibinde tuz bloklarından sallar birbirine bağlanmış, üstlerinde iki yüz kadar Sönük yaşıyor. Hiçbirinin gözü havada pencere aramıyor artık; nasıl aranacağını unutmuşlar.", en: "Rafts of salt blocks are lashed together at its base, and about two hundred of the Dimmed live on them. None of their eyes go looking for a window in the air anymore. They've forgotten how." }
          - { tr: "Sallardan birinde çocuklar oyun oynuyor. Biri parmağıyla havaya bir kare çiziyor, ötekiler bağrışıyor: \"Seviye on! Seviye yirmi!\" Oyunun adını sormana gerek yok.", en: "On one of the rafts some kids are playing a game. One of them draws a square in the air with a finger, and the others shout: \"Level ten! Level twenty!\" You don't need to ask what the game's called." }
          - metin: { tr: "Merdivenlerin iki yanına dizilmişler. Sen geçerken başlarını eğip hep aynı kelimeyi fısıldıyorlar: Dönen.", en: "They've lined up on both sides of the stairs. As you pass, they bow their heads and whisper the same word: Returner." }
            kosul: { bayrak: "batik_tanri_sanildi" }
          - metin: { tr: "Sen yaklaşınca annelerin bazıları çocuklarını salın öbür ucuna çekip sana sırtını dönüyor. Kapıda olanları biliyorlar.", en: "Some of the mothers pull their kids to the far end of the raft when you come close, and turn their backs. They know what happened at the door." }
            kosul: { bayrak: "tilu_vuruldu" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Ağlar bomboş. Sal köyünün yarım mil çevresinde tek bir balık yok; ya bir şey onları buradan uzak tutuyor ya da hepsini yemiş.", en: "The nets are empty. There's not one fish within half a mile of this raft village. Something's keeping them away, or something ate them all." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar siz olabilirdiniz. bunu söylemek zorunda kaldığım için üzgünüm. ama olabilirdiniz.", en: "this could be you. i'm sorry i have to say it. but this could be you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çocukların yarısı yetersiz beslenmiş, yaşlıların hepsi öyle. Hasat burada bitmemiş; yalnızca yavaşlamış.\"", en: "\"Half these kids are malnourished, and every one of the elders. The Harvest isn't over here. It just slowed down.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Şu oyun... 'Seviye on.' Bizim çocuklar da aynısını oynuyor artık. Dikkat ettin mi?\"", en: "\"That game. 'Level ten.' Our kids play it too now. Did you notice?\"" }
        secenekler:
          - id: "cik"
            etiket: { tr: "Fenerin bekçisine çık", en: "Climb up to the keeper of the light" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - ahlak: { duzen: 1 }
            kronik: { tr: "Son Fener'in bekçisinin yanına çıkıp hasat edilmiş bir dünyanın son sözlerini dinledin.", en: "You climbed up to the keeper of the Last Light and heard a harvested world's last words." }
            sonraki: "fener_bekci"
          - id: "erzak"
            etiket: { tr: "Çantandaki erzakı çocuklara dağıt", en: "Hand out your rations to the kids" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - ahlak: { merhamet: 5, insanlik: 2 }
            kronik: { tr: "Son Fener'in çocuklarına kendi erzakını dağıttın; çantan boşaldı, küçük eller doldu.", en: "You handed your own rations out to the children of the Last Light until your pack was empty and their hands were full." }
            sonraki: "fener_bekci"
          - id: "lamba"
            tur: "gosteris"
            etiket: { tr: "Lambaya kendi ışığını ver", en: "Feed the lamp your own light" }
            gerekli: { stat: { int: 170 } }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - bayrak: "batik_lamba_yakildi"
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { merhamet: 3, insanlik: -2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Son Fener'in lambasını kendi manana bağladın. Bütün takımada iki yüz yıl sonra ilk kez aydınlandı; karanlıktaki şey de bunu gördü.", en: "You tied the Last Light's lamp to your own mana. For the first time in two hundred years the whole archipelago lit up, and the thing in the dark saw it too." }
            sonraki: "fener_lamba"

      - id: "fener_lamba"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Avucunu lambanın camına dayayınca mana kolundan aşağı akmaya başlıyor. Sarı alev bir an sönecek gibi oluyor; önce beyaza, sonra masmavi bir ışığa dönüşüp bütün takımadayı yalayıp geçiyor.", en: "You lay your palm on the lamp's glass and let the mana run down your arm. The yellow flame almost goes out, then turns white, then a deep blue that sweeps across the entire archipelago." }
          - { tr: "Aşağıda iki yüz kişi bir ağızdan bağırıyor. Çocuklar havaya kare çizmeyi bırakıp ışığa el sallıyor.", en: "Two hundred people shout at once down below. The kids stop drawing squares in the air and wave at the light instead." }
          - { tr: "Batıda, koyu suyun altında yüzlerce minik pencere birden yanıyor; bu kez de sönmüyorlar.", en: "To the west, under the dark water, hundreds of tiny windows light up at once. This time they don't blink off." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Bekçinin odasına gir", en: "Go into the keeper's room" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "Başakçı'ya inat fenerin ışığını yaktın, ardından bekçinin kapısını çaldın.", en: "You lit the Light in spite of the Gleaner, and then you knocked on the keeper's door." }
            sonraki: "fener_bekci"

      - id: "fener_bekci"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Lambanın altındaki dar odada kör, çok yaşlı bir Nehha kadını oturuyor. Kolları hâlâ bir savaşçının kolları: üstlerinde eski yaraların izleri, parmakları yıllarca kılıç kabzası tutmaktan biçim almış.", en: "In the cramped room under the lamp sits a blind, very old Nehha woman. Her arms are still a fighter's arms: old scars, fingers shaped by years of holding a sword hilt." }
          - { tr: "\"Ben Oru-Venn,\" diyor. \"İki yüz on iki yıl önce bu dünyanın en güçlüsüydüm. Seviyem dört yüz on dokuzdu. O kademenin bir adı vardı, şimdi hatırlamıyorum.\"", en: "\"I am Oru-Venn,\" she says. \"Two hundred and twelve years ago I was the strongest thing on this world. My level was four hundred and nineteen. There was a name for that Grade, but I don't remember it anymore.\"" }
          - { tr: "\"Son yılımızda dört kampa bölündük. Biri kalkan istedi, biri demir; biri ışığa taptı, biri sessizce okudu. Hepimiz hazır olduğumuzu sanıyorduk. Bir sabah uyandığımda içim sessizdi.\"", en: "\"In our last year we split into four camps. One wanted a shield, one wanted iron, one worshiped the light, one read quietly in the dark. Every one of us thought we were ready. One morning I woke up and it was quiet inside me.\"" }
          - { tr: "Elini uzatıp yüzüne dokunuyor; parmakları bir an kıpırtısız kalıyor. \"Sende iki ses var,\" diyor. \"Bizden birinde de vardı. Arşive git. Ama önce şunu söyle bana: ne yapacaksın?\"", en: "She reaches out and touches your face, and her fingers stop for a second. \"There are two voices in you,\" she says. \"One of us had that too. Go to the Archive. But first, tell me something: what are you going to do?\"" }
        sezgiler:
          - kosul: { stat: { wis: 140 } }
            metin: { tr: "Kadının gözleri kör, ama bakışı havada tam pencerenin durduğu yere, göğsünün önüne dikilmiş. Bir zamanlar pencere okumakta üstüne yokmuş.", en: "The woman's eyes are blind, but her gaze is fixed on exactly the spot in the air in front of your chest where your window hangs. Once upon a time she was very, very good at reading windows." }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "Çocukları kendi dünyama götüreyim", en: "Let me take the children to my world" }
            etkiler:
              - bayrak: "batik_cocuklar_dunyada"
              - ahlak: { merhamet: 8, duzen: -2 }
              - itibar: { siginak: 5, lonca: -2 }
              - dikkat: 3
            kronik: { tr: "Son Fener'in çocuklarını kendi dünyana götürmeyi üstlendin; otuz yedi perdeli parmaklı çocuk {yer:kiyikent|in} yolunu tuttu.", en: "You took it on yourself to carry the children of the Last Light to your own world. Thirty-seven kids with webbed fingers set out on the road to {yer:kiyikent}." }
            sonraki: "fener_goc"
          - id: "basakci"
            etiket: { tr: "Başakçı'yı öldüreceğim", en: "I'm going to kill the Gleaner" }
            etkiler:
              - bayrak: "batik_basakci_sozu"
              - ahlak: { merhamet: 4, duzen: -2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Hasat edilmiş bir dünyanın son bekçisine, Hasat'ın geride bıraktığı şeyi öldüreceğine söz verdin.", en: "You promised the last keeper of a harvested world that you'd kill the thing the Harvest left behind." }
            sonraki: "fener_soz"
          - id: "gorunur"
            etiket: { tr: "{npc:yanki} onları Sistem'e yeniden göstersin", en: "Have {npc:yanki} make them visible to the System" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "batik_gorunur"
              - dikkat: 6
              - ahlak: { merhamet: 4, insanlik: -3 }
              - iliski: { yanki: { guven: 8, baglilik: 5 } }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Kafandaki ses hasat edilmiş iki yüz kişiyi Sistem'in kayıtlarına yeniden yazdı. Birinci seviyeden başladılar; bir dünyanın sonunda başlayan ilk şey buydu.", en: "The voice in your head wrote two hundred harvested people back into the System's records. They started over at level one, and it was the first thing to begin at the end of that world." }
            sonraki: "fener_gorunur"
          - id: "mercek"
            etiket: { tr: "Fenerin merceğini karşılık olarak iste", en: "Ask for the lamp's lens in return" }
            etkiler:
              - bayrak: "batik_fener_soyuldu"
              - ahlak: { merhamet: -8, insanlik: -5 }
              - esya: { tuz_tableti: 3 }
              - oz_kristali: 30
              - xp_seviye: 25
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Son Fener'in merceğini söküp götürdün. Hasat edilmiş bir dünyayı ikinci kez sen hasat ettin.", en: "You pried the lens out of the Last Light and took it with you. You were the one who harvested a harvested world a second time." }
            sonraki: "fener_soyuldu"
          - id: "hicbir"
            etiket: { tr: "Hiçbir şey vaat etme", en: "Promise nothing" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 3, max: 6 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Son Fener'in bekçisine hiçbir şey vaat etmedin, o da senden bir şey beklemedi. Aranızdaki sessizliği ikiniz de iyi tanıyordunuz.", en: "You promised the keeper of the Last Light nothing. She expected nothing back, and it was a silence you both knew." }
            sonraki: "fener_sessiz"

      - id: "fener_goc"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn uzun süre susuyor. Sonunda \"Senin dünyana da Hasat gelecek,\" diyor. \"Biliyorum; gözlerinde yazılı. Onları bir yangından ötekine mi taşıyorsun?\"", en: "Oru-Venn doesn't say anything for a long time. Then: \"The Harvest is coming to your world too. I know. Your eyes say so. Are you carrying them out of one fire into another?\"" }
          - { tr: "\"Belki,\" diyorsun. Şaşırtıcı ama gülümsüyor: \"Belki. Burada 'belki' diye bir şey kalmadı. Al onları.\"", en: "\"Maybe,\" you say. And to your surprise, she smiles. \"Maybe. We're all out of 'maybe' here. Take them.\"" }
          - { tr: "Şafakta otuz yedi çocuk, tuz bloklarından bir salın üstünde su kapısına doğru süzülüyor. Annelerin hiçbiri ağlamıyor; gözyaşlarını iki yüz yıl önce tüketmişler.", en: "At dawn, thirty-seven kids float toward the water door on a raft of salt blocks. None of the mothers cry. They finished crying two hundred years ago." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Otuz yedi. Sığınak'ta yer açarız. Yer her zaman açılır; yeter ki biri kapıyı tutsun.\"", en: "\"Thirty-seven. We'll make room at the Haven. There's always room if somebody holds the door.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Salı kapıya sen it", en: "Push the raft to the door yourself" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Son Fener'in başında söylediklerin takımadada yankılanıyor.", en: "What you said at the Last Lighthouse is still echoing through the Reach." } }
            kronik: { tr: "Otuz yedi çocuğu taşıyan salı kendi ellerinle bir dünyadan ötekine ittin.", en: "With your own hands, you pushed a raft of thirty-seven children from one world into the next." }
            sonraki: "fener_gece"

      - id: "fener_soz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn gülüyor, bu kez acı acı. \"Ben de söz vermiştim,\" diyor. \"Seviyem dört yüz on dokuzken. Onu ancak yaralayabildim; sonra kendi seviyemin onun ağına takılışını seyrettim.\"", en: "Oru-Venn laughs, and it's a bitter laugh this time. \"I made that promise too,\" she says. \"At level four hundred and nineteen. All I managed was to wound it. Then I watched my own level get caught in its net.\"" }
          - { tr: "Masanın altından yeşile çalmış bir çan çıkarıp kucağına bırakıyor. \"Çanlar,\" diyor. \"Hasat'tan önce bu dünyada Sistem'e ait olmayan tek ses. Başakçı onları duyunca yönünü şaşırır. Ben bunu çok geç öğrendim.\"", en: "She pulls a green-tarnished bell from under the table and sets it in your lap. \"The bells,\" she says. \"Before the Harvest, the only sound on this world that didn't belong to the System. When the Gleaner hears them, it loses its way. I learned that too late.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Çanı al ve teşekkür et", en: "Take the bell. Thank her" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - bilgi: "basakci_cani"
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın en güçlü savaşçısı çanını sana verdi; onun yarım kalan sözü artık senin omzundaydı.", en: "A harvested world's greatest fighter gave you her bell, and the promise she never got to keep was yours to carry now." }
            sonraki: "fener_gece"

      - id: "fener_gorunur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:yanki} sessizce çalışıyor. Penceren titriyor, harfler tersine akıyor; derken aşağıda, sallarda bir çocuk çığlığı kopuyor.", en: "{npc:yanki} works in silence. Your window shudders, letters run backward, and down on the rafts, a kid screams." }
          - { tr: "Korkudan değil bu çığlık. Çocuğun başının üstünde, bu dünyada iki yüz yıldır görülmemiş bir şey yanıyor: [Seviye 1]. Ardından bir tane daha, bir tane daha.", en: "Not out of fear. Over the kid's head, something nobody on this world has seen in two hundred years is glowing: [Level 1]. Then another. Then another." }
          - { tr: "{npc:yanki}: tamam. onları yeniden saydım. ama dinle: sayılıyorlarsa toplanabilirler de. ben yalnızca ne yaptığımı söylüyorum.", en: "{npc:yanki}: done. i counted them again. but listen: if they're being counted, they can be collected too. i'm just telling you what i did." }
          - { tr: "Oru-Venn'in kör gözlerinden yaşlar süzülüyor. Kendi başının üstünde hiçbir şey belirmemiş; yalnız çocuklarınkinde.", en: "Tears run out of Oru-Venn's blind eyes. Nothing has appeared over her own head. Only over the children's." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[k̷ayıt geri yüklendi: 204 varlık]", en: "[r̷ecord restored: 204 entities]" }
            satirlar:
              - { tr: "kaynak: yetkisiz. sistem bunu fark edecek.", en: "source: unauthorized. the system will notice." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bedeli ne olursa olsun, buna değdi", en: "Whatever it costs, it was worth it" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Bir dünyanın sonunda iki yüz dört kişiyi yeniden birinci seviyeye kavuşturdun; bedelini sormadın.", en: "At the end of a world, you gave two hundred and four people level one again, and you didn't ask what it would cost." }
            sonraki: "fener_gece"

      - id: "fener_soyuldu"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn tek kelime etmiyor. Yalnızca başıyla lambayı gösteriyor; 'nasıl istersen' der gibi, bunu daha önce de görmüş gibi.", en: "Oru-Venn doesn't say a word. She just nods toward the lamp, like 'suit yourself,' like she's seen this before." }
          - { tr: "Merceği yuvasından sökünce ışık sönüyor. Aşağıdaki iki yüz kişi bir anda susuyor; merdivenlerden inerken hiçbiri yüzüne bakmıyor.", en: "When you pry the lens out of its housing, the light goes out. Two hundred people go quiet at once down below, and as you come down the stairs, not one of them looks at you." }
          - { tr: "Merceğin içinde yüzyılların biriktirdiği mana var; elinde ağır ve sıcak duruyor. Sistem onu ganimet sayıyor.", en: "There are centuries of built-up mana inside that lens, heavy and warm in your hands. The System counts it as loot." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hasat da tam böyle hissettiriyordu. bunu bilmen gerektiğini düşündüm.", en: "this is exactly how the Harvest felt. i thought you should know." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk away without looking back" }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Söndürdüğün fenerin dibinden arkana bakmadan uzaklaştın.", en: "You walked out from under the light you'd put out and never looked back." }
            sonraki: "fener_gece"

      - id: "fener_sessiz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "\"İyi,\" diyor Oru-Venn. \"Benim zamanımda herkes vaat ederdi. Vaatler bizi kurtarmadı.\"", en: "\"Good,\" Oru-Venn says. \"In my day, everybody made promises. Promises didn't save us.\"" }
          - { tr: "Işığını göremediği halde yüzünü lambaya kaldırıyor. \"Arşive git,\" diyor yeniden. \"Yaptığımız hataları oku. Sonra kendi dünyana dön, sakın onları yapma.\"", en: "She lifts her face toward the lamp even though she can't see it. \"Go to the Archive,\" she says again. \"Read the mistakes we made. Then go back to your world and don't make them.\"" }
        secenekler:
          - id: "arsiv"
            etiket: { tr: "Arşivin yerini sor", en: "Ask where the Archive is" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Son Fener'de sorduğun arşiv seni bekliyor.", en: "The archive you asked about at the Last Lighthouse is waiting for you." } }
            kronik: { tr: "Bir dünyanın son bekçisinden vaat değil, bir adres aldın.", en: "From a world's last keeper you took an address, not a promise." }
            sonraki: "fener_gece"

      - id: "fener_gece"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Gece Son Fener'in dibinde, salların arasında oturuyorsun. Biri sana bir dilim kurutulmuş yosun uzatıyor; geri çevirmek ayıp kaçar.", en: "That night you sit among the rafts at the foot of the Last Light. Someone passes you a strip of dried seaweed. Turning it down would be rude." }
          - metin: { tr: "Çocukların başlarının üstünde minicik [Seviye 1] yazıları yanıyor; hiçbiri uyumak istemiyor.", en: "Tiny [Level 1] tags glow over the kids' heads. None of them want to go to sleep." }
            kosul: { bayrak: "batik_gorunur" }
          - metin: { tr: "Lamba sönük. Karanlıkta dalgaların ve uzak çanların sesinden başka bir şey yok; bir de birinin alçak sesle mırıldandığı çok eski bir şarkı.", en: "The lamp is dark. There's nothing in the dark but the waves and the distant bells, and somebody humming a very old song, low." }
            kosul: { bayrak: "batik_fener_soyuldu" }
          - { tr: "Batıda, koyu suyun altındaki pencere ışıkları biraz daha yaklaşmış.", en: "Out west, under the dark water, the window lights are a little closer than before." }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Sabaha kadar nöbet tut", en: "Stand watch till morning" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - xp_seviye: 20
            kronik: { tr: "Hasat edilmiş bir dünyanın son köyünde sabaha kadar nöbet tuttun.", en: "In the last village of a harvested world, you stood watch until morning." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Kapıya dön; kendi dünyanı düşün", en: "Head back to the door. Think about home" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 15
            kronik: { tr: "Son Fener'den kendi dünyana dönerken Hasat'ın neye benzediğini artık biliyordun.", en: "Walking back from the Last Light to your own world, you knew what the Harvest looked like now." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ TUZ ARŞİVİ
  - id: "batik_tuz_arsivi"
    konum: ["batik_takimada"]
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "batik", "kesif", "sir"]
    gerilim: 3
    kart: { tr: "Tuz Arşivi", en: "The Salt Archive" }
    sahne: "arsiv_1"
    sahneler:
      - id: "arsiv_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yol sonunda seni takımadanın ortasındaki kubbeye çıkarıyor. Kubbe bir zamanlar yokuşlu bir şehrin doruğundaymış; şimdi on kulaç suyun altında, içinde gümüş gibi parlayan bir hava cebiyle duruyor.", en: "The road finally brings you to the dome in the middle of {yer:batik_takimada}. It used to crown a hillside city. Now it sits sixty feet underwater, with a pocket of air inside it shining like a silver bubble." }
          - { tr: "Suyun altında, kubbenin girişine Nehha harfleriyle tek bir satır kazınmış. Sistem çeviriyor: [Bizden sonra gelen, oku. Bizi değil, hatalarımızı.]", en: "Underwater, over the dome's entrance, a single line is carved in Nehha letters. The System translates: [Whoever comes after us, read. Not us. Our mistakes.]" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Girişin dibinde bir şey kıpırdanıyor: beyaz, kırılgan, insan biçimli bir şey. Suyun içinde dimdik durmuş, kubbeyi bekliyor.", en: "Something shifts at the foot of the entrance. White, brittle, human-shaped, standing upright in the water, guarding the dome." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Dal ve kubbenin kapısına yüz", en: "Dive. Swim for the dome's door" }
            etkiler:
              - bolge: "batik_takimada"
              - savas: { dusmanlar: ["tuz_yuruyeni@dunya"], ortam: ["su"], kazan: "arsiv_ic", kaybet: "arsiv_yenilgi", kac: "arsiv_kacis" }
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Suyu ikiye ayır; kubbeye kuru yürü", en: "Split the water. Walk to the dome dry" }
            gerekli: { stat: { int: 180 } }
            etkiler:
              - bolge: "batik_takimada"
              - aciga_vur: true
              - dikkat: 4
              - xp_seviye: 20
            sonraki: "arsiv_yarik"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Yürüyenin arkasından süzül", en: "Slip past the Saltwalker" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "arsiv_fark", basarisiz_etkiler: [{ bolge: "batik_takimada" }, { can: -50 }, { dikkat: 2 }] }
            etkiler:
              - bolge: "batik_takimada"
              - gizle: 5
            sonraki: "arsiv_ic"

      - id: "arsiv_yarik"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kollarını açtığında deniz gönülsüzce iki yana çekiliyor. Ortada ıslak kaldırım taşlarından bir yol beliriyor; üstünde yosunlar, kayık parçaları, bir çocuk ayakkabısı.", en: "You spread your arms, and the sea, reluctantly, pulls aside. A road of wet cobblestones opens down the middle: seaweed, boat wreckage, a child's shoe." }
          - { tr: "Kubbenin dibindeki beyaz figür kuru havada kalınca kıpırdayamıyor. Tuzdan bedeni çatlıyor, sonra ağır ağır, neredeyse minnetle dökülüp dağılıyor.", en: "Left standing in dry air, the white figure at the dome's base can't move. Its salt body cracks, then slowly, almost gratefully, crumbles." }
        secenekler:
          - id: "gir"
            etiket: { tr: "Kubbeye gir", en: "Go into the dome" }
            sonraki: "arsiv_ic"

      - id: "arsiv_fark"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yürüyenin yanından geçerken ağzından bir kabarcık kaçıyor. Beyaz baş sana dönüyor; göğsündeki sönük pencere çerçevesi bir anlığına, yalnızca bir anlığına yanıyor.", en: "A bubble slips out of your mouth as you pass it. The white head turns toward you, and the dead window frame in its chest lights up for a second. Just a second." }
          - { tr: "Kolları seni yakalıyor, tuz derine işliyor. Kaçış yok; burada, dibin de dibinde dövüşeceksin.", en: "Its arms catch you, and the salt grinds into your skin. No getting out of it. You'll fight here, at the bottom of the bottom." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Dövüş", en: "Fight" }
            etkiler:
              - savas: { dusmanlar: ["tuz_yuruyeni@dunya"], ortam: ["su"], kazan: "arsiv_ic", kaybet: "arsiv_yenilgi", kac: "arsiv_kacis" }

      - id: "arsiv_yenilgi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ciğerlerin tuzla doluyor, dünya bembeyaz kesiliyor. Kendine geldiğinde bir salın üstündesin; biri seni sudan çekip çıkarmış.", en: "Salt fills your lungs, and the world whites out. When you come to, you're on a raft. Somebody pulled you out of the water." }
          - { tr: "Kesh bu. Zıpkınını yanına bırakmış, yüzünü inceliyor. \"Seviyeliler de boğuluyormuş demek,\" diyor. \"Bildiğim iyi oldu.\"", en: "Kesh. He's set his harpoon down beside you and he's studying your face. \"So leveled ones drown too,\" he says. \"Good to know.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve teşekkür et", en: "Get up. Thank him" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "arsiv_kacis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ciğerlerin yana yana yüzeye çıkıyorsun. Aşağıda beyaz figür kubbenin önündeki yerine dönüyor; seni kovalamıyor bile. Görevi seni öldürmek değil, okutmamak.", en: "You break the surface, lungs on fire. Down below, the white figure goes back to its post in front of the dome. It doesn't even chase you. Its job isn't killing you. It's keeping you from reading." }
        secenekler:
          - id: "don"
            etiket: { tr: "Başka bir gün gel", en: "Come back another day" }
            sonraki: "@akis"

      - id: "arsiv_ic"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kubbenin içi kuru ve soğuk. Duvarlar baştan başa raf, raflar tuz tabletleriyle dolu: binlerce, on binlerce. Her tablet gelgitleri sayan çentiklerle başlıyor, çoğu da bir isimle bitiyor.", en: "The inside of the dome is dry and cold. The walls are shelves, and the shelves are full of salt tablets: thousands, tens of thousands. Every one starts with notches counting tides, and most end with a name." }
          - { tr: "Ortadaki masada tabletler, birbirinden uzak dursunlar diye dört ayrı yığına ayrılmış. Her yığının başında bir sembol var: bir kalkan, bir demir halka, açık bir göz, kapalı bir ağız.", en: "On the table in the middle sit four stacks of tablets, set apart like they're supposed to keep their distance. Each stack has a symbol at the top: a shield, an iron ring, an open eye, a closed mouth." }
          - { tr: "Hepsi gözüne tanıdık geliyor, hem de fazlasıyla.", en: "It looks familiar. Way too familiar." }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Dört yığının son tabletleri aynı gelgite tarihli. Dördü de aynı gece, birbirinin ne yazdığından habersiz yazılmış.", en: "The last tablet in each of the four stacks is dated to the same tide. All four were written the same night, none of them knowing what the others were writing." }
        secenekler:
          - id: "kalkan"
            etiket: { tr: "Kalkan yığınının son tabletini oku", en: "Read the last tablet in the shield stack" }
            sonraki: "arsiv_dort"
          - id: "hepsi"
            tur: "gosteris"
            etiket: { tr: "Dört yığını birden, bir solukta oku", en: "Read all four stacks in one breath" }
            gerekli: { stat: { int: 200 } }
            etkiler:
              - xp_seviye: 25
            sonraki: "arsiv_dort"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} rafları taramasını söyle", en: "Have {npc:yanki} scan the shelves" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "arsiv_fisilti"

      - id: "arsiv_dort"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kalkan şöyle yazmış: [Halkı koruyacağız. Kalkan hazır. Ötekiler bize güvenmiyor.] Demir halkanın yazdığı: [Güçlüler yönetecek. Zayıflar bunu anlayacak. Ötekiler engel.]", en: "The shield writes: [We will protect the people. The shield is ready. The others don't trust us.] The iron ring writes: [The strong will rule. The weak will understand. The others are in the way.]" }
          - { tr: "Açık göz şöyle yazmış: [Sistem bizi seçti. Yakıt olacak olan yakıt olacak. Ötekiler kör.] Kapalı ağız ise: [Kaynağa ulaştık. Bir gün daha. Ötekilere söylemeyeceğiz.]", en: "The open eye writes: [The System has chosen us. Those meant to be fuel will be fuel. The others are blind.] The closed mouth writes: [We have reached the source. One more day. We will not tell the others.]" }
          - { tr: "Dört tablet, hepsi aynı gece. Ertesi sabaha dair kimse tek satır yazmamış.", en: "Four tablets, the same night. Nobody wrote anything for the next morning." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"'Ötekilere söylemeyeceğiz.' Biz de aynısını söyledik, geçen ay. Kelimesi kelimesine.\"", en: "\"'We will not tell the others.' We said that. Last month. Word for word.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dört kamp. Tam dört! Burası arşiv değil, ayna.\"", en: "\"Four camps. Four. This isn't an archive. It's a mirror.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Rafların arkasına bak", en: "Look behind the shelves" }
            etkiler:
              - bilgi: "batik_son_yili"
            sonraki: "arsiv_fisilti"

      - id: "arsiv_fisilti"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Rafların en arkasında duvara gömülü tek bir tablet duruyor. Ötekiler kadar düzgün değil: çentikler titrek, harfler birbirine binmiş; yazan, bir başkasının söylediklerini aceleyle kazımış sanki.", en: "At the very back of the shelves, a single tablet is set into the wall. It isn't neat like the others. The notches shake, the letters run into each other, like whoever wrote it was scratching down someone else's dictation in a hurry." }
          - { tr: "Sistem çeviriyor ama çeviri bozuk çıkıyor: [Bana bir ses konuşuyordu. Yalnızca bana. Sistem'den kopmuş bir parça olduğunu söyledi. Son gece bana tek bir kelime söyledi: yeniden.]", en: "The System translates, and the translation comes out broken: [A voice spoke to me. Only to me. It said it was a piece broken off the System. On the last night it said one word to me: again.]" }
          - { tr: "Altında isim yok. Kazınıp silinmiş; bile bile, derin ve öfkeli çizgilerle.", en: "There's no name under it. The name has been scratched out: on purpose, in deep, angry strokes." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[b̷u el yazısını tanıyorum]", en: "[i̷ know this handwriting]" }
            satirlar:
              - { tr: "hayır. tanımıyorum. tanımamalıyım.", en: "no. i don't. i shouldn't." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "lütfen bunu yanına alma. lütfen. neden istediğimi bilmiyorum; beni korkutan da bu.", en: "please don't take this with you. please. i don't know why i'm asking, and that scares me." }
        secenekler:
          - id: "al"
            etiket: { tr: "Tableti duvardan sök ve yanına al", en: "Pry the tablet loose and take it" }
            etkiler:
              - bilgi: "nehha_fisildayani"
              - esya: { tuz_tableti: 1 }
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { yanki: { guven: -6, korku: 6 } }
              - itibar: { sessiz_ag: 4 }
            sonraki: "arsiv_cikis"
          - id: "birak"
            etiket: { tr: "{npc:yanki} için tableti yerinde bırak", en: "Leave the tablet where it is, for {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bilgi: "nehha_fisildayani"
              - ahlak: { merhamet: 2 }
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "arsiv_cikis"
          - id: "kir"
            etiket: { tr: "Tableti kır; kimse okumasın", en: "Smash the tablet. Nobody reads it" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { yanki: { guven: 4, korku: 3 } }
            sonraki: "arsiv_cikis"

      - id: "arsiv_cikis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çıkarken dört yığının önünde bir an duraklıyorsun: kalkan, demir halka, açık göz, kapalı ağız. Dördü de haklı olduğundan emindi.", en: "On your way out you stop in front of the four stacks for a second. Shield, iron ring, open eye, closed mouth. All four sure they were right." }
          - { tr: "Raflarda boş bir yer var; sanki bir zamanlar orada bir yığın daha duruyormuş. Belki beşinci bir kamp vardı, belki de biri bir şey yazmayı unuttu.", en: "There's an empty spot on the shelves, like there used to be one more stack. Maybe there was a fifth camp. Maybe somebody forgot to write something." }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Dört tableti Dünya'ya götür; herkes okusun", en: "Take the four tablets home. Let everyone read" }
            etkiler:
              - esya: { tuz_tableti: 4 }
              - ahlak: { duzen: -1, insanlik: 3 }
              - itibar: { siginak: 3, lonca: 3, sessiz_ag: 3, yukselenler: 3 }
              - xp_seviye: 30
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Tuz Arşivi'nde okuduklarından sonra takımadada saat daha hızlı işliyor.", en: "Since what you read in the Salt Archive, the clock in the Reach has been running faster." } }
            sonraki: "@akis"
          - id: "yaz"
            etiket: { tr: "Boş rafa kendi tabletini kazı", en: "Carve your own tablet for the empty shelf" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - xp_seviye: 25
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Tuz Arşivi'nde okuduklarından sonra takımadada saat daha hızlı işliyor.", en: "Since what you read in the Salt Archive, the clock in the Reach has been running faster." } }
            sonraki: "arsiv_yaz"
          - id: "birak"
            etiket: { tr: "Her şeyi olduğu gibi bırak", en: "Leave everything the way it is" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 20
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 3, max: 6 }, hatirlatma: { tr: "Tuz Arşivi'nde okuduklarından sonra takımadada saat daha hızlı işliyor.", en: "Since what you read in the Salt Archive, the clock in the Reach has been running faster." } }
            sonraki: "@akis"

      - id: "arsiv_yaz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Tuzu bıçağının ucuyla kazıyorsun. Nehha harflerini bilmediğin için Sistem'in alfabesini kullanıyorsun; her yerde herkesin okuyabildiği tek alfabeyi.", en: "You scratch into the salt with the tip of a knife. You don't know the Nehha letters, so you use the System's alphabet, the only one anybody anywhere can read." }
          - { tr: "Tek bir satır yazıyorsun ve ne yazdığını kimseye söylemiyorsun. Tableti boş rafa koyduğunda kubbe bir an, belli belirsiz, bir çan gibi çınlıyor.", en: "You write one line. You don't tell anyone what it says. When you set the tablet on the empty shelf, the dome rings for a second, faintly, like a bell." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Yüzeye çık", en: "Head for the surface" }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SON BAŞAKÇI (boss · önemli)
  - id: "batik_son_basakci"
    konum: ["batik_takimada"]
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_fener_goruldu" }
    agirlik: 4
    etiketler: ["cok_evren", "batik", "boss"]
    gerilim: 4
    onemli: true
    kart: { tr: "Son Başakçı", en: "The Last Gleaner" }
    sahne: "basakci_1"
    sahneler:
      - id: "basakci_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çanlar düzensiz, telaşla çalıyor; sesleri öyle yüksek ki su kapısından bile taşıyor. Takımadaya vardığında deniz çoktan çekilmeye başlamış, kuleler dibine kadar çırılçıplak kalmış. Aralarındaki batık sokaklar iki yüz yıl sonra ilk kez kurumuş.", en: "The bells are ringing wild and ragged, loud enough to carry through the water door. By the time you reach the archipelago the sea is pulling back: the towers stand bare to their roots, and the drowned streets between them are dry for the first time in two hundred years." }
          - { tr: "Kuru sokakların ortasında, sığ bir çukurun içinden bir şey doğruluyor: ağlardan, cam bıçaklardan ve on binlerce sönük pencereden örülmüş, bir kule boyunda bir şey. Ağlarındaki pencereler hâlâ yanıp sönüyor.", en: "In the middle of the dry streets, out of a shallow trench, something stands up. A thing as tall as a tower, woven out of nets and glass blades and tens of thousands of dead windows, and the windows in its nets are still blinking." }
          - { tr: "Son Fener'e doğru yürüyor. Hiç acelesi yok; tarlasının öbür ucuna yürüyen bir çiftçi gibi.", en: "It's walking toward the Last Light. No hurry. Like a farmer walking out to the far end of his field." }
          - metin: { tr: "Fenerin dibindeki çocukların başlarının üstünde minicik [Seviye 1] yazıları yanıyor. Başakçı'nın başı onlara çevrilmiş.", en: "Tiny [Level 1] tags glow over the heads of the children at the foot of the Light. The Gleaner's head is turned toward them." }
            kosul: { bayrak: "batik_gorunur" }
          - metin: { tr: "Sallarda çocuk yok; otuz yedisi de senin dünyanda. Fenerin dibinde ellerinde kemik zıpkınlarla yalnız yaşlılar kalmış.", en: "There are no kids on the rafts. All thirty-seven are in your world. Only the old ones are left at the foot of the Light, bone harpoons in hand." }
            kosul: { bayrak: "batik_cocuklar_dunyada" }
          - metin: { tr: "Fener karanlık. Başakçı ona dönüp bakmıyor bile; senin dünyandan gelen tek ışığa, sana yöneliyor.", en: "The Light is dark. The Gleaner doesn't so much as glance at it. It's turning toward the only light that came from your world. Toward you." }
            kosul: { bayrak: "batik_fener_soyuldu" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[HASAT ARTIĞI: Son Başakçı]", en: "[HARVEST REMNANT: The Last Gleaner]" }
            satirlar:
              - { tr: "Görev: kalan seviyelerin toplanması. Durum: 212 yıldır devam ediyor.", en: "Task: collection of remaining levels. Status: ongoing for 212 years." }
              - { tr: "Hedef öncelik: en parlak kaynak.", en: "Target priority: brightest source." }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Ağlarındaki pencereler rastgele değil; her biri bir Nehha. Ağın en dibindeki, en eskisi, dört yüz on dokuz gösteriyor.", en: "The windows in its nets aren't random. Each one is a Nehha. And at the very bottom of the net, the oldest one reads four hundred and nineteen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistemin bir parçası bu, benim gibi. ama o geride bırakıldı, ben kaçtım. aradaki fark işte bu kadar ince.", en: "it's a piece of the system. like me. but it got left behind, and i ran. that's how thin the difference is." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben fenerin başındayım. Ne olursa olsun oradan kimse o ağa düşmeyecek.\"", en: "\"I've got the Light. Whatever happens, nobody up there goes into that net.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kule kadar büyük, iki yüz yaşında. Güzel. Sonunda uğruna terlemeye değecek bir şey.\"", en: "\"Big as a tower and two hundred years old. Nice. Finally something worth breaking a sweat over.\"" }
        secenekler:
          - id: "karsila"
            etiket: { tr: "Fenerin önünde dur ve onu karşıla", en: "Stand in front of the Light and meet it" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 4, duzen: -1 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+5"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Son Fener'in önünde, hasat edilmiş bir dünyanın son insanlarıyla Hasat'ın geride bıraktığı şeyin arasına dikildin.", en: "You stood in front of the Last Light, between a harvested world's last people and the thing the Harvest left behind." }
          - id: "canlar"
            etiket: { tr: "Önce çanları çaldır; sonra saldır", en: "Get the bells ringing first. Then attack" }
            goster: { bilgi: "basakci_cani" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 3, duzen: 2 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+2"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Bir dünyanın bütün çanlarını birden çaldırdın; o seste Başakçı iki yüz yılda ilk kez yolunu şaşırdı.", en: "You got every bell in a world ringing at once, and for the first time in two hundred years the Gleaner lost its way." }
          - id: "cek"
            etiket: { tr: "Onu fenerden uzağa, derin suya çek", en: "Draw it away from the Light, into deep water" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "basakci_yakalandi", basarisiz_etkiler: [{ bolge: "batik_takimada" }, { can: -80 }, { ahlak: { merhamet: 3 } }] }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 6 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+4"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı'yı kendi ışığınla fenerden uzağa, derin suya çekmeye kalktın; sallardakilerle onun arasına kendini attın.", en: "You tried to lure the Gleaner away from the Light and into deep water with your own light, putting yourself between it and the rafts." }
          - id: "konus"
            etiket: { tr: "{npc:yanki} onunla konuşsun", en: "Let {npc:yanki} talk to it" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 4, insanlik: -2 }
              - iliski: { yanki: { guven: 6, saygi: 6 } }
            kronik: { tr: "Hasat'ın artığını kafandaki sesle konuşturdun; iki kopuk parça birbirini tanıdı.", en: "You let the voice in your head talk to the Harvest's leftover, and two broken-off pieces recognized each other." }
            sonraki: "basakci_konus"
          - id: "terk"
            etiket: { tr: "Feneri bırak; kapıya koş", en: "Leave the Light. Run for the door" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -10, insanlik: -3 }
            kronik: { tr: "Son Fener'i Başakçı'ya bıraktın; {yer:batik_takimada|in} son çanı arkandan sustu.", en: "You left the Last Light to the Gleaner, and behind you the last bell of {yer:batik_takimada} went silent." }
            sonraki: "basakci_terk"

      - id: "basakci_yakalandi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Daha kuru sokağın yarısındayken ağ üstüne çöküyor. İplikler bileklerine dolanıyor; her düğümde bir sayı, senin sayılarından biri gevşemeye başlıyor.", en: "The net comes down on you halfway across the dry street. The lines wrap your wrists, and at every knot a number, one of yours, starts working loose." }
          - { tr: "Derin suya varamadın. Dövüşeceksen burada, fenerin dibinde dövüşeceksin.", en: "You didn't make deep water. You're fighting it here, at the foot of the Light." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ağı yırt ve dövüş", en: "Tear free of the net and fight" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+5"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı'nın ağını yırtıp kurtuldun, onunla fenerin dibinde dövüşe tutuştun.", en: "You tore your way out of the Gleaner's net and fought it at the foot of the Light." }

      - id: "basakci_konus"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Penceren titriyor, {npc:yanki} konuşmaya başlıyor; ama sana değil. Satırlar pencerenden taşıp havaya, Başakçı'nın ağlarına doğru akıyor.", en: "Your window shudders and {npc:yanki} starts talking, but not to you. The lines flow out of your window, into the air, toward the Gleaner's nets." }
          - { tr: "Başakçı duraksıyor. Ağlarındaki pencerelerin en büyüğü ağır ağır dönüyor, üstünde bozuk bir satır beliriyor: [b̷en hasat etmedim. ben yalnızca artığım. geride kalanı topluyorum.]", en: "The Gleaner stops. One window in its nets, the biggest, turns slowly, and a broken line shows up on it: [i̷ didn't harvest anything. i'm only what was left over. i gather what's left behind.]" }
          - { tr: "{npc:yanki}: o zaman kendini topla. senden geriye kalan bu. bırak onları.", en: "{npc:yanki}: then gather yourself. that's what's left of you. let them go." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Sessizce bekle", en: "Wait in silence" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
            kronik: { tr: "İki artık konuşurken sesini çıkarmadan bekledin; sonunda biri ötekini dinledi.", en: "You waited in silence while two leftovers talked, and in the end one of them listened to the other." }
            sonraki: "basakci_huzur"
          - id: "saldir"
            etiket: { tr: "Durduğu an saldır", en: "Hit it while it's standing still" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - iliski: { yanki: { guven: -8, saygi: -4 } }
              - savas: { dusmanlar: ["son_basakci@oyuncu+1"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı kafandaki sesi dinlerken ona saldırdın; sesin sana olan güveni orada kırıldı.", en: "You attacked the Gleaner while it was listening to the voice in your head, and the voice's trust in you broke right there." }

      - id: "basakci_huzur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Başakçı, ağını katlayan bir balıkçı gibi düzgünce, özenle ağlarını gövdesinin üstüne çekiyor. Sonra katlanmış ağ kuru sokağa çöküyor; deniz de iki yüz yılın ağırlığıyla geri geliyor.", en: "The Gleaner draws its nets in over its own body, neat and careful, the way a fisherman folds his net. Then the folded net collapses onto the dry street, and the sea comes back with two hundred years of weight behind it." }
          - { tr: "Suyun yüzüne binlerce minik pencere çıkıyor. Ne yanıyorlar ne sönüyorlar; fenerin ışığında küçük küçük fenerler gibi salınıp duruyorlar.", en: "Thousands of tiny windows rise to the surface. They aren't lit and they aren't dark. They just float in the lamplight, like a crowd of little lanterns." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[a̷rtık kapatıldı]", en: "[r̷emnant closed]" }
            satirlar:
              - { tr: "kaynak: yetkisiz. işlem: rıza ile.", en: "source: unauthorized. process: consensual." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Pencerelerin denize dağılmasını izle", en: "Watch the windows drift out to sea" }
            etkiler:
              - bayrak: "basakci_saldi"
              - gorev: { cok_evren_batik: tamam }
              - ahlak: { merhamet: 5, insanlik: 6 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - xp_seviye: 120
            kronik: { tr: "Son Başakçı'yı öldürmedin, kendini toplamasına izin verdin. İki yüz yıllık hasat denize, sahiplerine geri döndü.", en: "You didn't kill the Last Gleaner. You let it gather itself up, and two hundred years of harvest went back to the sea, back to the people it belonged to." }
            sonraki: "basakci_sabah"

      - id: "basakci_zafer"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Başakçı'nın göğsündeki son ağ yırtılınca dev gövde cam bıçaklarını şıngırdatarak kuru sokağa yığılıyor; deniz de iki yüz yılın ağırlığıyla geri gelip üstünü örtüyor.", en: "The last net in the Gleaner's chest tears open, and the huge body crashes down onto the dry street, glass blades jangling. The sea comes back with two hundred years of weight behind it and covers it over." }
          - { tr: "Suyun yüzüne binlerce minik pencere çıkıyor: ağlarında tuttuğu bütün Nehha seviyeleri. Ne yanıyorlar ne sönüyorlar; bir sahip bekliyorlar.", en: "Thousands of tiny windows rise to the surface: every Nehha level it was holding in its nets. They aren't lit and they aren't dark. They're waiting for an owner." }
          - { tr: "Penceren bir an upuzun bir sayı gösteriyor: bütün bunları içine çekersen ulaşacağın sayıyı. Sistem bu seçeneği sen sormadan önüne koyuyor.", en: "For a second your window shows a very long number: the number you'd hit if you pulled all of this into yourself. The System offers you the option without being asked." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[Unvan: Başakçı'yı Kıran]", en: "[Title: Gleaner-Breaker]" }
            satirlar:
              - { tr: "Hasat artığı yok edildi. Toplanmış kaynaklar sahipsiz.", en: "Harvest remnant destroyed. Collected resources unclaimed." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Alma onları. Bana bak. Bunlar insanlar. Alma.\"", en: "\"Don't take them. Look at me. Those are people. Don't.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bunca seviye öylece yüzüyor. Sen almazsan başkası alır. Benden söylemesi.\"", en: "\"That many levels just floating there. If you don't take them, somebody will. Just saying.\"" }
        secenekler:
          - id: "ozgur"
            etiket: { tr: "Pencereleri serbest bırak; denize dağılsınlar", en: "Let the windows go. Let them scatter" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { merhamet: 4, insanlik: 6 }
              - degisken: { kadim_tehdit: -3 }
              - xp_seviye: 100
            kronik: { tr: "Son Başakçı'yı devirip topladığı iki yüz yıllık hasadı denize saldın. {yer:batik_takimada|de} ilk kez bir çan kendi isteğiyle çaldı.", en: "You brought down the Last Gleaner and let two hundred years of harvest go into the sea. For the first time, a bell in {yer:batik_takimada} rang because it wanted to." }
            sonraki: "basakci_sabah"
          - id: "yut"
            etiket: { tr: "Hepsini içine çek", en: "Pull every last one into yourself" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - bayrak: "batik_hasat_yutuldu"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { insanlik: -12, merhamet: -6 }
              - dikkat: 8
              - xp_seviye: 220
              - stat: { str: 8, end: 8, wil: 8 }
              - itibar: { yukselenler: 6, siginak: -6 }
            kronik: { tr: "Son Başakçı'yı devirdin, iki yüz yıl boyunca topladığı her şeyi de içine çektin. Hasat'ın yarım bıraktığı işi sen bitirdin.", en: "You brought down the Last Gleaner and pulled in everything it had spent two hundred years collecting. You finished the Harvest's job." }
            sonraki: "basakci_sabah"
          - id: "sonuklere"
            etiket: { tr: "{npc:yanki} pencereleri Sönüklere dağıtsın", en: "Have {npc:yanki} hand the windows to the Dimmed" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - bayrak: "batik_gorunur"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { merhamet: 8, duzen: -3 }
              - dikkat: 5
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - xp_seviye: 120
            kronik: { tr: "Son Başakçı'yı devirip topladığı seviyeleri hasat edilmiş bir halka geri dağıttın. Sönükler iki yüz yıl sonra yeniden sayılır oldu.", en: "You brought down the Last Gleaner and handed what it had collected back to a harvested people. Two hundred years later, the Dimmed started being counted again." }
            sonraki: "basakci_sabah"

      - id: "basakci_yenilgi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ağ seni yere çiviliyor. Durum pencerende seviyenin altındaki kırmızı çizgi kalınlaştıkça kalınlaşıyor; bir an, yalnızca bir an, sayılarının sana değil ona ait olduğunu hissediyorsun.", en: "The net pins you to the ground. The red line under the level in your Status window keeps getting thicker, thicker, and for a second, just a second, you feel your numbers belonging to it instead of you." }
          - { tr: "Derken bir çan çalıyor. Fenerin tepesinde Oru-Venn kör gözleriyle, yeşile çalmış bir çanı iki eliyle sallıyor; Başakçı'nın başı sarsılınca ağ gevşiyor.", en: "Then a bell rings. At the top of the Light, blind eyes and all, Oru-Venn is swinging a green-tarnished bell with both hands. The Gleaner's head jerks. The net goes slack." }
          - { tr: "Sürüne sürüne kurtuluyorsun. Arkanda Başakçı fenere dönüyor; çanın sesi kesiliyor, lamba sönüyor.", en: "You crawl free. Behind you, the Gleaner turns toward the Light. The bell stops, and the lamp goes out." }
        secenekler:
          - id: "kac"
            etiket: { tr: "Kapıya sürün; yaşamak zorundasın", en: "Crawl for the door. You have to live" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -2, insanlik: 2 }
              - can: 50
            kronik: { tr: "Son Başakçı'ya yenildin. Seni kurtaran çanı çalan kadın o gece fenerle birlikte söndü.", en: "You lost to the Last Gleaner. The woman who rang the bell that saved you went out with the Light that night." }
            sonraki: "@akis"

      - id: "basakci_kacis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısına koşuyorsun; Başakçı peşine düşmüyor. Gerek de yok: arkanda daha kolay bir hasat bekliyor.", en: "You run for the water door, and the Gleaner doesn't follow. It doesn't need to. There's an easier harvest behind you." }
          - { tr: "Kapıdan geçmeden dönüp bakıyorsun. Fenerin ışığı bir kez titreyip sönüyor.", en: "Before you go through the door, you look back. The Light flickers once and goes out." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Kapıdan geç", en: "Go through the door" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -5 }
            kronik: { tr: "Başakçı'dan kaçtın ve Son Fener arkandan söndü.", en: "You ran from the Gleaner, and the Last Light went out behind you." }
            sonraki: "@akis"

      - id: "basakci_terk"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Koşarken arkanda çanlar teker teker susuyor; önce uzaktakiler, sonra yakındakiler. En son fenerin çanı kesiliyor.", en: "You run. Behind you the bells go quiet one at a time, the far ones first, then the near ones. The Light's bell is the last to stop." }
          - { tr: "Su kapısının önüne vardığında takımadada çıt çıkmıyor. Sistem bu dünyaya ait son kaydı kapatıyor.", en: "By the time you reach the water door, the archipelago is completely silent. The System closes the last record it had for this world." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Ilunnar · kayıt kapatıldı]", en: "[Ilunnar · record closed]" }
            satirlar:
              - { tr: "Kalan seviye: yok. Kalan nüfus: önemsiz.", en: "Remaining levels: none. Remaining population: negligible." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Kapıdan geç ve kendi dünyana dön", en: "Go through the door. Go home" }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın son kaydı kapanırken seyrettin, sonra kendi dünyana döndün. Hasat'ın neye benzediğini artık biliyordun.", en: "You watched a harvested world's last record close and went home. Now you knew what the Harvest looked like." }
            sonraki: "@akis"

      - id: "basakci_sabah"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sabah takımadanın bütün çanları çalıyor, ama bu kez telaşla değil; düğünde ya da doğumda çalınan çanlar gibi.", en: "In the morning every bell in the archipelago rings, but not in a panic this time. Like bells at a wedding, or a birth." }
          - metin: { tr: "Oru-Venn yüzünü güneşe dönmüş, fenerin merdivenlerinde oturuyor. \"Benim seviyem de oradaydı,\" diyor. \"En altta. Dört yüz on dokuz. Gitti mi?\" Gitti. Gülümsüyor: \"İyi.\"", en: "Oru-Venn is sitting on the Light's stairs, face turned to the sun. \"My level was in there too,\" she says. \"At the very bottom. Four hundred and nineteen. Is it gone?\" It is. She smiles. \"Good.\"" }
            kosul: { bayrak_yok: "batik_hasat_yutuldu" }
          - metin: { tr: "Oru-Venn fenerin merdivenlerinde oturuyor, yüzünü sana çevirmiyor. \"Benim seviyem de oradaydı,\" diyor. \"En altta.\" Şimdi senin içinde; bunu ikiniz de biliyorsunuz.", en: "Oru-Venn is sitting on the Light's stairs, and she won't turn her face to you. \"My level was in there too,\" she says. \"At the very bottom.\" It's inside you now. You both know it." }
            kosul: { bayrak: "batik_hasat_yutuldu" }
          - { tr: "Kesh zıpkınını ayaklarının dibine bırakıyor. Bunun Nehhalarda ne anlama geldiğini sormana gerek yok.", en: "Kesh lays his harpoon down at your feet. You don't need to ask what that means to the Nehha." }
        secenekler:
          - id: "veda"
            etiket: { tr: "Suya, sonra alnına dokun; veda et", en: "Touch the water, then your brow. Say goodbye" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - tohum: { olay: "batik_kesh_yemini", gecikme: { min: 5, max: 12 }, hatirlatma: { tr: "Son Başakçı'nın gününden beri {yer:batik_takimada} seni unutmadı.", en: "{yer:batik_takimada|b} hasn't forgotten you since the day of the Last Reaper." } }
            kronik: { tr: "{yer:batik_takimada|e} onların selamıyla veda ettin.", en: "You said goodbye to {yer:batik_takimada} with their own greeting." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Kendi dünyanı düşün; Gün 365 yaklaşıyor", en: "Think about your own world. About Day 365" }
            etkiler:
              - ahlak: { duzen: 2 }
              - tohum: { olay: "batik_kesh_yemini", gecikme: { min: 5, max: 12 }, hatirlatma: { tr: "Son Başakçı'nın gününden beri {yer:batik_takimada} seni unutmadı.", en: "{yer:batik_takimada|b} hasn't forgotten you since the day of the Last Reaper." } }
            kronik: { tr: "Hasat edilmiş bir dünyanın sabahında kendi dünyanın son gününü düşündün.", en: "On the morning of a harvested world, you thought about your own world's last day." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ TİLU (tohum: cok_evren_kapisi)
  - id: "batik_tilu"
    konum: ["kule_dibi"]
    perde: [3, 4]
    agirlik: 1
    etiketler: ["cok_evren", "batik", "kurtarma"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Eve giden çocuk", en: "The kid going home" }
    sahne: "tilu_1"
    sahneler:
      - id: "tilu_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Sığınak'ın Kule Dibi'ndeki sahra çadırından bir gönüllü seni aramaya gelmiş. \"Kapıdan gelen çocuk,\" diyor. \"Yemiyor, uyumuyor, durmadan çanını sallıyor. Seni soruyor; yani tarif ediyor.\"", en: "A volunteer from the Haven's field tent in {yer:kule_dibi} tracks you down. \"The kid from the door,\" she says. \"Won't eat, won't sleep, just keeps shaking that bell. Asking for you. Well, describing you.\"" }
            kosul: { bayrak: "tilu_korundu" }
          - metin: { tr: "Gözlerinin altı mor halkalı bir Sessiz Ağ teknisyeni seni buluyor. \"Çocuk,\" diyor. \"Ölçümler bitti. Yemek yemiyor. Ekip... ekip onu senin götürmeni istiyor. Ya da ölçmeye devam etmemizi. Sana soruyorlar.\"", en: "A Quiet Network tech finds you, dark circles under his eyes. \"The kid,\" he says. \"Measurements are done. It's not eating. The team... the team wants you to take it home. Or for us to keep measuring. They're asking you.\"" }
            kosul: { bayrak: "tilu_ag_teslim" }
          - { tr: "Çocuk, Tilu, seni görür görmez ayağa fırlıyor. Perdeli parmaklarıyla bileğine yapışıyor ve ilk kez Sistem'in çevirisini beklemeden, senin dilinde tek bir kelime söylüyor: \"Ev.\"", en: "The kid, Tilu, jumps up the second she sees you. She grabs your wrist with webbed fingers and, for the first time, without waiting for the System to translate, says one word in your language: \"Home.\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Bileğinde bir sensörün bıraktığı kırmızı iz hâlâ duruyor. Çanı bir an bile bırakmamış; sapını sıkmaktan parmakları morarmış.", en: "There's still a red mark on her wrist from a sensor. She never once let go of the bell. Her fingers have gone purple around the handle." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu çocuk senin sayılarını görebiliyor; Sönükler bazen görür. seni çok parlak buluyor. iltifat say.", en: "this kid can see your numbers. the Dimmed sometimes can. she thinks you're very bright. take it as a compliment." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir çocuğun evine dönmesi tıbbi bir ihtiyaçtır. Rapora da öyle yazacağım.\"", en: "\"A kid getting home is a medical necessity. That's how I'm writing it up.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Veri bende. Fazlasıyla var. Götür onu.\"", en: "\"I've got the data. I've got plenty. Take her.\"" }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Elinden tut; eve götür", en: "Take her hand. Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 5 }
              - itibar: { siginak: 3 }
            sonraki: "tilu_yol"
          - id: "olc"
            etiket: { tr: "Ağ biraz daha ölçsün; sonra götürürsün", en: "Let the Network measure a bit more first" }
            goster: { bayrak: "tilu_ag_teslim" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 3 }
              - itibar: { sessiz_ag: 5 }
              - bilgi: "basakci_cani"
            sonraki: "tilu_olcum"
          - id: "kos"
            tur: "gosteris"
            etiket: { tr: "Onu sırtına al; Kule'yi bir solukta çık", en: "Piggyback her up the Spire in one breath" }
            gerekli: { stat: { end: 170 } }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 4 }
              - dikkat: 3
              - xp_seviye: 10
            sonraki: "tilu_yol"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} çocuğun gördüğünü sor", en: "Ask {npc:yanki} what the kid sees" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
            sonraki: "tilu_yanki"

      - id: "tilu_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki}: seni görüyor. beni de. iki ışık diyor; biri parlak, biri titrek. hangisinin ben olduğunu tahmin edersin.", en: "{npc:yanki}: she sees you. and me. two lights, she says. one bright, one flickering. you can guess which one i am." }
          - { tr: "Tilu başını yana eğip göğsünün önünde, pencerenin durduğu yere bakıyor. Sonra küçük, perdeli parmağını uzatıp havaya dokunuyor; tam {npc:yanki|in} satırlarının durduğu yere.", en: "Tilu tilts her head and looks at the spot in front of your chest where your window hangs. Then she reaches out one small webbed finger and touches the air, right where {npc:yanki|pos} lines sit." }
          - { tr: "{npc:yanki}: ...bana kimse dokunmamıştı.", en: "{npc:yanki}: ...nobody's ever touched me before." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Onu eve götür", en: "Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 4 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "tilu_yol"

      - id: "tilu_olcum"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Üç gün daha geçiyor. Teknisyenler çocuğun çanını ölçüp sonunda buluyor: çanın sesi Sistem'in kayıt frekansının tam tersinde titreşiyor. Sistem'e ait olmayan bir ses; Başakçı'yı şaşırtan da bu.", en: "Three more days. The techs measure the kid's bell and find it: the bell's tone vibrates at the exact inverse of the System's logging frequency. A sound that doesn't belong to the System. That's what throws the Gleaner off." }
          - { tr: "Dördüncü gün Tilu çanı sallamayı bırakıyor. Yalnızca elinde tutup kapının olduğu yöne bakıyor.", en: "On the fourth day Tilu stops shaking the bell. She just holds it and stares in the direction of the door." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Yeter. Onu eve götür", en: "Enough. Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 2, insanlik: 1 }
            sonraki: "tilu_yol"
          - id: "tut"
            etiket: { tr: "Ağ'da kalsın; bilgi daha değerli", en: "She stays with the Network. Data's worth more" }
            etkiler:
              - bayrak: "tilu_ag_tutsak"
              - ahlak: { merhamet: -8, insanlik: -5, duzen: 2 }
              - itibar: { sessiz_ag: 6, siginak: -5 }
            sonraki: "tilu_tutsak"

      - id: "tilu_tutsak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Teknisyen başını sallayıp gözlerini kaçırıyor. Tilu'nun çadırının kapısı kapanıyor.", en: "The tech nods and won't meet your eyes. The flap of Tilu's tent closes." }
          - { tr: "O gece çok uzaklardan, su kapısının ardından bir çan çalıyor. Cevap veren olmuyor.", en: "That night, from very far away, from somewhere behind the water door, a bell rings. Nobody answers it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Uzaklaş", en: "Walk away" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "tilu_yol"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısından geçer geçmez Tilu elini bırakıp bir balık gibi suya dalıyor. Senin dünyanın havasında boğulan çocuk gitmiş, yerine kendi denizine kavuşmuş bir şey gelmiş.", en: "The second you come through the water door, Tilu lets go of your hand and dives. Like a fish. The kid who was drowning in your air is gone, and in her place is something that's back in its own sea." }
          - { tr: "Sonra başını sudan çıkarıp çanını sallıyor: bir, iki, üç kez. Uzaktan bir çan cevap veriyor, ardından bir başkası.", en: "Then she pops her head up and shakes her bell. Once, twice, three times. A bell answers from far off. Then another." }
          - { tr: "Doğudaki sallardan birinden bir kadın suya atlayıp yüzmeye başlıyor; ömründe kimseyi bu kadar hızlı yüzerken görmedin.", en: "On one of the rafts to the east, a woman dives into the water and starts swimming. You've never seen anybody swim that fast." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Kıyıda bekle; onlar kavuşsun", en: "Wait on the shore. Let them have this" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "tilu_anne"
          - id: "yuz"
            etiket: { tr: "Onların peşinden yüz", en: "Swim out after them" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "tilu_anne"

      - id: "tilu_anne"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Annesi Tilu'yu sudan çekip bağrına basıyor, uzun süre de bırakmıyor. Sonra sana bakıyor: başının üstünde hiçbir şey yazmayan bir kadın, senin başının üstündeki sayıya bakıyor.", en: "Her mother pulls Tilu out of the water and crushes her to her chest and doesn't let go for a long time. Then she looks at you: a woman with nothing over her head, looking at the number over yours." }
          - { tr: "Avucunu suya batırıp alnına bastırıyor. Ardından ağır ağır, ıslak avucunu senin alnına da bastırıyor.", en: "She dips her palm in the water and presses it to her forehead. Then, slowly, she presses her wet palm to yours, too." }
          - { tr: "Tilu çanını sana uzatıyor. Annesi bir şey söylüyor, Sistem de çeviriyor: [Çanı al. Başakçı çanı duyunca yolunu şaşırır. Bunu seviyeliler dışında herkes bilir.]", en: "Tilu holds her bell out to you. Her mother says something, and the System translates: [Take the bell. When the Gleaner hears it, it loses its way. Everybody knows that. Except the leveled ones.]" }
        secenekler:
          - id: "al"
            etiket: { tr: "Çanı al", en: "Take the bell" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - bilgi: "basakci_cani"
              - ahlak: { merhamet: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Eve giden çocuğun dünyası seni yeniden çağırıyor.", en: "The world of the kid who went home is calling you back." } }
            sonraki: "tilu_son"
          - id: "red"
            etiket: { tr: "Çan onun kalsın; yalnızca bilgiyi al", en: "Let her keep the bell. Just take the advice" }
            etkiler:
              - bilgi: "basakci_cani"
              - ahlak: { insanlik: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Eve giden çocuğun dünyası seni yeniden çağırıyor.", en: "The world of the kid who went home is calling you back." } }
            sonraki: "tilu_son"
          - id: "goc"
            etiket: { tr: "Onları da Dünya'ya davet et", en: "Invite them both back to Earth" }
            etkiler:
              - bilgi: "basakci_cani"
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { siginak: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Eve giden çocuğun dünyası seni yeniden çağırıyor.", en: "The world of the kid who went home is calling you back." } }
            sonraki: "tilu_davet"

      - id: "tilu_davet"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Anne başını iki yana sallıyor: hayır. Eliyle denizi, kuleleri, doğudaki dumanı gösteriyor. Boğulmuş da olsa burası onların evi.", en: "The mother shakes her head. No. She gestures at the sea, the towers, the smoke out east. This is their home, drowned or not." }
          - { tr: "Tilu sana bir kez daha sarılıp annesinin ardından suya dalıyor.", en: "Tilu hugs you one more time and dives in after her mother." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Anlıyorum", en: "I get it" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "tilu_son"

      - id: "tilu_son"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Doğudaki sal köyünden biri sana el sallıyor, ardından bir başkası. Koca bir dünyadan geriye kalanlar sana el sallarken sen ne yapacağını bilemeden elini kaldırıyorsun.", en: "Somebody in the raft village out east waves at you. Then somebody else. The leftovers of a whole world are waving at you, and you lift your hand without really knowing what else to do." }
          - metin: { tr: "Takımadaya ilk gelişin bu ve burada ilk gördüğün şey bir kavuşma oldu. Bu dünyada kavuşmanın ne kadar nadir olduğunu henüz bilmiyorsun.", en: "It's your first time in {yer:batik_takimada}, and the first thing you saw here was a reunion. You don't know yet how rare that is in this world." }
            kosul: { bayrak_yok: "batik_varildi" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "El salla ve sal köyüne yürü", en: "Wave back. Head for the raft village" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - ahlak: { merhamet: 1 }
              - xp_seviye: 20
            sonraki: "@akis"

  # ================================================================== PİRİNÇ KERVAN (Tavvarlar · Vassal'ın aynası)
  - id: "kervan_tarti_carsisi"
    konum: ["pirinc_kervan"]
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak_yok: "kervan_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "kervan", "kesif"]
    gerilim: 2
    kart: { tr: "Tartı Çarşısı", en: "The Weighing Bazaar" }
    sahne: "tarti_1"
    sahneler:
      - id: "tarti_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Pirinç kapıdan bir güverteye çıkıyorsun, ama güvertenin sonu gelmiyor. Ufuk aşağı değil yukarı kıvrılıyor; koca bir şehir, koca bir ülke dev bir geminin karnına sığdırılmış, gemi de yıldızların arasında ağır ağır ilerliyor.", en: "You step out of the brass door onto a deck, and the deck doesn't end. The horizon curves up instead of down: a whole city, a whole country, packed into the belly of an enormous ship crawling between the stars." }
          - { tr: "Her yer pirinç: kubbeler, köprüler, kapı tokmakları, tütsü kazanları. Kalabalığın içinde uzun boylu, ince, altı parmaklı insanlar yürüyor; derileri pirinç pullarla kaplı, her pul bir hece.", en: "Everything's brass. Domes, bridges, door knockers, incense burners. The crowd is full of tall, thin, six-fingered people, and their skin is studded with brass chits, every chit a syllable." }
          - { tr: "Konuşmadan önce birbirlerine küçük pullar uzatıyorlar. Burada her sözün bir bedeli var, her cümle bir alışveriş.", en: "Before they talk, they hand each other little chits. Here every word costs something. Every sentence is a transaction." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[KATMAN ANALİZİ: Tavvar Kervanı]", en: "[LAYER ANALYSIS: Tavvari Caravan]" }
            satirlar:
              - { tr: "Durum: bağlı Katman. Bağ: Boyun Senedi (Kadim). Süre: 412 yıl.", en: "Status: bonded Layer. Bond: the Neckbond (Ancient). Duration: 412 years." }
              - { tr: "Hasat durumu: ertelendi. Bedel: süregelen.", en: "Harvest status: deferred. Price: ongoing." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Derilerindeki pullar süs değil, defter: doğum, borç, evlilik, ölüm. Bazı pulların yeri boş; söküldükleri yerde ince, beyaz izler kalmış.", en: "The chits in their skin aren't decoration. They're a ledger: birth, debt, marriage, death. Some have gaps where chits used to be, thin white scars where they were pried out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistem burada konuşuyor, ama başka biri adına. her satırın sonunda bir Kadim imzası var. birinin malı olmak neye benziyor, görmek istiyordun, değil mi?", en: "the system talks here. but on someone else's behalf. there's an Ancient signature at the end of every line. you wanted to see what being owned looks like, didn't you?" }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Konuşmak için para ödüyorlar. Benim kâbusum bu, biliyor musun? Tıpatıp bu.\"", en: "\"They pay to talk. That's my nightmare, you know that? This exactly.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes gülümsüyor, herkesin karnı tok görünüyor. Peki neden tüylerim diken diken?\"", en: "\"Everybody's smiling. Everybody looks well-fed. So why's my skin crawling?\"" }
        secenekler:
          - id: "carsi"
            etiket: { tr: "Kalabalığın aktığı yöne, çarşıya yürü", en: "Follow the crowd into the bazaar" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
            sonraki: "tarti_terazi"
          - id: "pazarlik"
            etiket: { tr: "Bir tezgâhtan söz pulu almaya çalış", en: "Try to buy word-chits off a stall" }
            gerekli: { oz_kristali_min: 4 }
            zar: { stat: "cha", zorluk: 380, tek: false, basarisiz: "tarti_kazik", basarisiz_etkiler: [{ oz_kristali: -8 }] }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - esya: { pirinc_pul: 20 }
              - oz_kristali: -4
            sonraki: "tarti_terazi"
          - id: "agirlik"
            tur: "gosteris"
            etiket: { tr: "Dev terazinin karşı ağırlığını tek elle kaldır", en: "Lift the great scale's counterweight one-handed" }
            gerekli: { stat: { str: 180 } }
            etkiler:
              - bayrak: "kervan_varildi"
              - bayrak: "kervan_tartilamadi"
              - gorev: { cok_evren_kervan: basla }
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3 }
            sonraki: "tarti_kirildi"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} derilerdeki defterleri okusun", en: "Have {npc:yanki} read the ledgers in their skin" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - bilgi: "kervan_boyun_senedi"
              - iliski: { yanki: { guven: 4, saygi: 3 } }
            sonraki: "tarti_defter"

      - id: "tarti_kazik"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tezgâhtaki Tavvar önce kesendeki kristallere, sonra sana, sonra yine kristallere bakıyor. Pazarlığın ilk cümlesinde ona yirmi pul borçlanmışsın, ikincisinde kırk.", en: "The Tavvari at the stall looks at your crystals, then at you, then back at the crystals. Your first sentence of haggling cost you twenty chits. Your second cost forty." }
          - { tr: "Kalabalıktan birkaç kişi gülüyor. Burada konuşmayı bilmeyen, ne kadar güçlü olursa olsun yoksuldur.", en: "A few people in the crowd laugh. Here, somebody who doesn't know how to talk is poor, no matter how strong they are." }
        secenekler:
          - id: "ode"
            etiket: { tr: "Öde ve dersini al", en: "Pay up. Learn the lesson" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - esya: { pirinc_pul: 5 }
              - ahlak: { duzen: 1 }
            sonraki: "tarti_terazi"

      - id: "tarti_defter"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:yanki} kalabalığı tarayıp satırları pencerene diziyor. Bir kadın üç çocuk doğurmuş, biri ondalık olarak gitmiş. Yaşlı bir adamın dört kardeşi varmış, ikisi gitmiş. Bir gencin defterinde henüz bir şey yok, ama derisinde ondalığın seçileceği yaşı gösteren bir pul boş bırakılmış.", en: "{npc:yanki} sweeps the crowd and lines them up in your window. A woman: three children, one gone as the tithe. An old man: four siblings, two gone. A kid: nothing yet, but there's a blank chit in her skin marking the age the tithe gets picked." }
          - { tr: "{npc:yanki}: herkesin defterinde aynı satır var, her ailede bir boşluk. bunlar bir halk değil; bir taksit planı.", en: "{npc:yanki}: same line in every ledger. a gap in every family. this isn't a people. it's an installment plan." }
        secenekler:
          - id: "carsi"
            etiket: { tr: "Çarşıya, terazilerin olduğu yere yürü", en: "Head into the bazaar, to the scales" }
            sonraki: "tarti_terazi"

      - id: "tarti_terazi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tartı Çarşısı'nın ortasında ev büyüklüğünde bir terazi duruyor. Tavvarlar her şeyi onda tartıyor: tahılı, kumaşı, köle sözleşmelerini, çocukların gelecekteki emeğini. Yabancıları da.", en: "In the middle of the Weighing Bazaar stands a scale the size of a house. The Tavvari weigh everything on it: grain, cloth, indenture contracts, children's future labor. And strangers." }
          - { tr: "Derisi baştan aşağı pullarla kaplı yaşlı bir tartıcı sana el ediyor. \"Yabancı,\" diyor, bu söz için de kendi kendine bir pul ödüyor. \"Burada her şeyin bir fiyatı var. Gel, seninkini öğrenelim.\"", en: "An old weigher whose skin is covered head to toe in chits waves you over. \"Stranger,\" he says, and pays himself a chit for it. \"Everything here has a price. Let's learn yours.\"" }
        secenekler:
          - id: "tartil"
            etiket: { tr: "Kefeye çık; tartılmayı kabul et", en: "Step onto the pan. Let them weigh you" }
            etkiler:
              - bayrak: "kervan_tartilamadi"
              - dikkat: 3
              - ahlak: { duzen: 2 }
            sonraki: "tarti_kirildi"
          - id: "red"
            etiket: { tr: "Kimse beni tartamaz", en: "Nobody weighs me" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
            sonraki: "tarti_ondalikci"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Görünen seviyenle tartıl; gerisini sakla", en: "Get weighed at your visible level. Hide the rest" }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: 1 }
            sonraki: "tarti_gizli"

      - id: "tarti_gizli"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe hafifçe iniyor. Tartıcı bir pula bir sayı kazıyıp sana uzatıyor: orta halli bir Tavvar kadar çekiyorsun. Ne satmaya değersin ne satın almaya.", en: "The pan dips a little. The weigher scratches a number into a chit and hands it over: about what an average Tavvari would weigh. Not worth selling, not worth buying." }
          - { tr: "Kalabalığın ilgisi dağılıyor. Yalnızca çarşının kenarındaki pirinç kaplı, yüzsüz bir figür başını sana çevirip uzun süre öyle kalıyor.", en: "The crowd loses interest. Only a faceless figure plated in brass at the edge of the bazaar turns its head toward you, and stays that way a long time." }
        secenekler:
          - id: "git"
            etiket: { tr: "Figürü görmezden gel; çarşıda dolaş", en: "Ignore the figure. Wander the bazaar" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "tarti_kesra"

      - id: "tarti_kirildi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe bir kaya gibi iniyor. Öbür kefedeki pirinç ağırlıklar havaya fırlıyor, zincirler gerilip kopuyor; dev terazinin kolu dört yüz yıldır ilk kez ortasından çatlıyor.", en: "The pan drops like a rock. The brass weights in the other pan go flying, the chains snap taut and break, and the arm of the great scale cracks down the middle for the first time in four hundred years." }
          - { tr: "Çarşı susuyor. Burada sessizlik çok pahalıdır; yüzlerce Tavvar konuşmamak için aynı anda bedel ödüyor.", en: "The bazaar goes silent. Silence costs a lot here. Hundreds of Tavvari are paying, all at once, not to talk." }
          - { tr: "Tartıcı önce kırık kola, sonra sana bakıyor. \"Ölçülemez,\" diye fısıldıyor; bu kelime için on pul öderken elleri titriyor.", en: "The weigher stares at the broken arm, then at you. \"Unweighable,\" he whispers. He pays ten chits for that word, and his hands are shaking." }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Kalabalığın bir kısmı seni Kadim sanıp başını eğiyor. Bir kısmı ise birbirine bakıyor, bakışlarında hesap var: kaçak bir ondalık, sahibine geri götürülse ne eder?", en: "Part of the crowd bows; they think you're an Ancient. Another part is trading looks, and those looks are doing math: a runaway tithe, how much would that fetch, returned to its owner?" }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Kırık kefenin üstünde dur ve bekle", en: "Stand on the broken pan and wait" }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "tarti_ondalikci"

      - id: "tarti_ondalikci"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kalabalık ikiye ayrılıyor; aradan pirinç kaplı, yüzsüz bir figür yürüyüp geliyor. Derisinde tek bir pul yok, onun yerine yekpare bir levha var. Elinde küçük, zarif, kusursuz bir terazi.", en: "The crowd splits down the middle. Through the gap walks a faceless figure plated in brass. There isn't a single chit on its skin, just one seamless plate. In its hand, a set of scales: small, elegant, perfect." }
          - { tr: "Önünde duruyor. Sesi yok, ama terazisini kaldırınca boş kefelerden biri senin ağırlığınla aşağı iniyor. Sonra göğsündeki levhadan bir mühür uzatıyor: bir Kadim mührü, kayıt mührü.", en: "It stops in front of you. It has no voice, but it raises its scales, and one empty pan sinks under your weight. Then a seal slides out of the plate on its chest. An Ancient seal. A registration seal." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kayıt talebi: Kadim Mülkiyet Dairesi]", en: "[Registration request: Ancient Office of Holdings]" }
            satirlar:
              - { tr: "Kayıtlı varlıklar Kervan'da serbestçe dolaşabilir.", en: "Registered entities may move freely on the Caravan." }
              - { tr: "Kayıtsız varlıklar ondalığa tabidir.", en: "Unregistered entities are subject to the tithe." }
        secenekler:
          - id: "damga"
            etiket: { tr: "Mührü kabul et; kayıt ol", en: "Accept the seal. Register" }
            etkiler:
              - bayrak: "kervan_damgali"
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 6 }
              - degisken: { kadim_tehdit: 2 }
            sonraki: "tarti_kesra"
          - id: "kir"
            etiket: { tr: "Mührü elinden al ve avucunda ez", en: "Take the seal and crush it in your fist" }
            etkiler:
              - bayrak: "kervan_muhur_ezildi"
              - ahlak: { duzen: -5, insanlik: 2 }
              - itibar: { kadimler: -6 }
              - dikkat: 5
            sonraki: "tarti_ezildi"
          - id: "dovus"
            etiket: { tr: "Mühürle değil, yumrukla cevap ver", en: "Answer with a fist, not a seal" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: -1 }
              - itibar: { kadimler: -8 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@dunya"], ortam: ["dar_gecit"], kazan: "tarti_zafer", kaybet: "tarti_yenilgi", kac: "tarti_kesra" }

      - id: "tarti_ezildi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mühür avucunda kuru bir yaprak gibi ufalanıyor. Figür parmaklarının arasından dökülen pirinç tozunu bir süre seyrettikten sonra terazisini indirip dönüyor, gidiyor.", en: "The seal crumbles in your fist like a dry leaf. The figure watches the brass dust sift between your fingers for a while. Then it lowers its scales, turns and leaves." }
          - { tr: "Gidişinin ardından kimse ağzını açmıyor. Ama çarşının kenarında genç bir Tavvar kadını sana bakıyor; burada ilk kez birinin bedavaya gülümsediğini görüyorsun.", en: "Nobody says anything after it's gone. But at the edge of the bazaar, a young Tavvari woman is watching you, and for the first time here you see somebody smile for free." }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadına doğru yürü", en: "Walk over to the woman" }
            sonraki: "tarti_kesra"

      - id: "tarti_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Pirinç levha ortasından yarılıyor, figür dizlerinin üstüne çöküyor. Levhanın altında, perçinlerin arasında, bir zamanlar pullarla kaplı bir derinin izleri seçiliyor; bu şey de bir zamanlar Tavvarmış.", en: "The brass plate splits open down the middle, and the figure drops to its knees. Under the plate, between the rivets, are the scars of skin that used to be covered in chits. It used to be a Tavvari." }
          - { tr: "Çarşı nefesini tutmuş. Ne bedel ödeyen var ne konuşan. Burada kimse bir Ondalıkçı'nın yere düştüğünü görmemiş.", en: "The bazaar holds its breath. Nobody's paying. Nobody's talking. Nobody here has ever seen a Tithe-Taker hit the ground." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu orada bırak; çarşı görsün", en: "Leave it there. Let the bazaar see" }
            etkiler:
              - bayrak: "kervan_muhur_ezildi"
              - ahlak: { duzen: -2 }
              - itibar: { kadimler: -4 }
            sonraki: "tarti_kesra"

      - id: "tarti_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe şakağına inince dünya pirinç rengine kesiyor. Kendine geldiğinde çarşının kenarında, bir tezgâhın altındasın; biri seni oraya sürüklemiş.", en: "The scale-pan connects with your temple, and the world goes brass-colored. When you come to, you're under a stall at the edge of the bazaar. Somebody dragged you there." }
          - { tr: "Genç bir Tavvar kadını yanında diz çökmüş. \"Burada kimse Ondalıkçı'ya vurmaz,\" diyor. \"Ama sen vurdun. Bu da bir şeydir.\"", en: "A young Tavvari woman is kneeling next to you. \"Nobody here hits a Tithe-Taker,\" she says. \"But you did. That counts for something.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Doğrul ve dinle", en: "Sit up and listen" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "tarti_kesra"

      - id: "tarti_kesra"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Genç bir Tavvar kadını yanına geliyor. Derisinin sol yanında, tam kalbinin üstünde, söküldüğü belli bir pulun beyaz izi var.", en: "A young Tavvari woman comes up beside you. On the left side of her skin, over her heart, is the white scar of a chit somebody pried out." }
          - { tr: "\"Kesra,\" diyor, bunun için de pul ödemiyor. \"Bu çarşıda pul ödemeden konuşan tek kişi benim. Çünkü hiçbir şeyim kalmadı; onu da söktüler.\"", en: "\"Kesra,\" she says, and doesn't pay for it. \"I'm the only one in this bazaar who talks without paying. Because I don't have anything left. They pried that out too.\"" }
          - { tr: "\"Yarın Ondalık günü,\" diyor. \"Gel, kendi gözünle gör. Sonra sen söyle bize, neyin fiyatı varmış.\"", en: "\"Tomorrow is Tithe Day,\" she says. \"Come and see. Then you tell us what has a price.\"" }
        secenekler:
          - id: "gelecegim"
            etiket: { tr: "Geleceğim", en: "I'll be there" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Tartı Çarşısı'ndan beri kervanın terazileri sana başka türlü sallanıyor.", en: "Since the Weighing Bazaar, the caravan's scales swing differently for you." } }
            sonraki: "@akis"
          - id: "neden"
            etiket: { tr: "Neden bana söylüyorsun?", en: "Why are you telling me?" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Tartı Çarşısı'ndan beri kervanın terazileri sana başka türlü sallanıyor.", en: "Since the Weighing Bazaar, the caravan's scales swing differently for you." } }
            sonraki: "tarti_neden"
          - id: "ilgilenmez"
            etiket: { tr: "Bu benim işim değil", en: "Not my business" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 2, max: 4 }, hatirlatma: { tr: "Tartı Çarşısı'ndan beri kervanın terazileri sana başka türlü sallanıyor.", en: "Since the Weighing Bazaar, the caravan's scales swing differently for you." } }
            sonraki: "@akis"

      - id: "tarti_neden"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra omuz silkiyor. \"Senin dünyana da bir senet gelecek,\" diyor. \"Her dünyaya gelir. Bizimkini gör ki seninkini imzalamadan önce okuyasın.\"", en: "Kesra shrugs. \"A treaty's coming to your world too,\" she says. \"It comes to every world. I want you to see ours, so you read yours before you sign it.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yarın görüşürüz", en: "See you tomorrow" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ ONDALIK (önemli)
  - id: "kervan_ondalik"
    konum: ["pirinc_kervan"]
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "kervan", "ahlak", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Ondalık günü", en: "Tithe Day" }
    sahne: "ondalik_1"
    sahneler:
      - id: "ondalik_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{yer:pirinc_kervan|de} çalan çan değil terazi: binlerce kefe birden inip kalkıyor. Bugün ondalık günü ve Senet Kulesi'nin önündeki meydan aile aile dolmuş.", en: "It isn't {yer:pirinc_kervan|pos} bells that ring, it's every scale aboard; thousands of pans rise and fall at once. Tithe Day. The square in front of the Bond Tower is packed, family by family." }
          - { tr: "Seçilme yaşına gelen gençler ön sırada dikiliyor; derilerindeki boş pul yuvaları parlatılmış. Ondalıkçı aralarında sessizce dolaşıp küçük terazisini her birinin önünde bir kez kaldırıyor.", en: "The kids who've come of age stand in the front row, the empty chit sockets in their skin polished bright. The Tithe-Taker walks between them in silence, raising its little scales once in front of each one." }
          - { tr: "Onuncu gencin önünde kefe aşağı iniyor. Seçilen, incecik bir kız; korkudan donmuş, gözlerini kalabalığın içindeki annesine dikmiş. Adı Ninu. Babası bir çığlık koparıyor ve kimse o çığlık için pul istemiyor.", en: "In front of the tenth kid, the pan sinks. A girl: skinny, terrified, eyes locked on her mother's face in the crowd. Ninu. Her father lets out a scream, and nobody charges him for it." }
          - metin: { tr: "Ondalıkçı seni, göğsündeki Kadim mührünü görüyor. Terazisini indirip bir memurun amirinin önünde eğildiği gibi hafifçe eğiliyor.", en: "The Tithe-Taker sees you. Sees the Ancient seal on your chest. It lowers its scales and dips toward you slightly, the way a clerk would to a supervisor." }
            kosul: { bayrak: "kervan_damgali" }
          - metin: { tr: "Ondalıkçı seni görünce terazisini bir an sana çeviriyor, sonra geri döndürüyor. Mührünü ezen yabancıyı unutmamış.", en: "The Tithe-Taker sees you. It turns its scales your way for a second, then turns them back. It hasn't forgotten the stranger who crushed its seal." }
            kosul: { bayrak: "kervan_muhur_ezildi" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Kızın babası kalabalığı yararak sana doğru geliyor. Derisindeki bütün pulları, hayatının bütün defterini söküp avuçlarında toplamış.", en: "The girl's father is shoving through the crowd toward you. He's pried every chit out of his skin, his whole life's ledger, and he's holding them out in his cupped hands." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onda bir, onda bir. biri seçilmezse terazi sıradakine geçer. kural değil bu, düpedüz aritmetik. seçerken bunu bil.", en: "one in ten. one in ten. if one isn't taken, the scale moves on to the next. that's not a rule, it's arithmetic. choose knowing that." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir çocuğu kurtarıp terazinin ötekini seçmesine göz yummak kurtarmak sayılmaz. Ama elini kolunu bağlayıp durmak da sayılmaz.\"", en: "\"Saving one kid so the scale picks another isn't saving anyone. But neither is doing nothing.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Şu pirinç herifi indir, bütün tiyatro biter. Neden kimse benim kadar basit düşünmüyor?\"", en: "\"Drop the brass guy and the whole show's over. Why doesn't anybody think as simple as me?\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşimi de böyle götürmüşler gibi geliyor bana. Bir şey yap. Lütfen.\"", en: "\"Feels like this is how they took my sister. Do something. Please.\"" }
        secenekler:
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Kızı kalabalığın içinde sakla", en: "Hide the girl in the crowd" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "ondalik_yakalandi", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { itibar: { kadimler: -4 } }] }
            etkiler:
              - bayrak: "ninu_saklandi"
              - gizle: 4
              - ahlak: { merhamet: 6, duzen: -4 }
            kronik: { tr: "Ondalık günü terazinin seçtiği kızı kalabalığın içinde saklamaya kalkıştın.", en: "On Tithe Day you tried to hide the girl the scale had picked somewhere in the crowd." }
            sonraki: "ondalik_siradaki"
          - id: "meydan"
            etiket: { tr: "Ondalıkçı'nın önüne çık, töreni durdur", en: "Step in front of the Tithe-Taker. Stop it" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -6 }
              - itibar: { kadimler: -10 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Dört yüz yıllık bir törenin ortasında Ondalıkçı'nın karşısına dikildin; bütün meydan nefesini tuttu.", en: "In the middle of a four-hundred-year-old ceremony, you planted yourself in front of the Tithe-Taker while the whole square held its breath." }
          - id: "muaf"
            etiket: { tr: "Mührünü göster, kızı muaf tut", en: "Show your seal. Exempt the girl" }
            goster: { bayrak: "kervan_damgali" }
            etkiler:
              - bayrak: "ninu_muaf"
              - ahlak: { duzen: 4, insanlik: -3, merhamet: 2 }
              - itibar: { kadimler: 3 }
            kronik: { tr: "Kadim mührünü kullanarak bir kızı ondalıktan muaf tuttun. Terazi sıradakine geçti ve herkes kimin adına konuştuğunu gördü.", en: "You used your Ancient seal to exempt a girl from the tithe. The scale moved on to the next one, and everybody saw whose name you were speaking in." }
            sonraki: "ondalik_siradaki"
          - id: "izle"
            etiket: { tr: "Karışma; bir vassallığın nasıl işlediğini izle", en: "Stay out of it. Watch how vassalage works" }
            etkiler:
              - bayrak: "ninu_teslim"
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { merhamet: -6, duzen: 6 }
              - degisken: { kadim_tehdit: 2 }
            kronik: { tr: "Bir kızın Senet Kulesi'ne götürülüşünü sesini çıkarmadan seyrettin ve vassallığın nasıl işlediğini öğrendin.", en: "On Tithe Day you watched a girl get taken without a word. Now you knew how vassalage works." }
            sonraki: "ondalik_gidis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} terazinin hesabını bozsun", en: "Have {npc:yanki} break the scale's math" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "ondalik_bozuldu"
              - dikkat: 4
              - ahlak: { duzen: -8, merhamet: 4 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - itibar: { kadimler: -6 }
              - degisken: { kadim_tehdit: 2 }
            kronik: { tr: "{yer:pirinc_kervan|in} ondalık terazisini kafandaki sese bozdurdun; kefe o gün kimsenin önünde inmedi.", en: "You had the voice in your head break {yer:pirinc_kervan|pos} tithe scale. That day the pan didn't sink for anyone." }
            sonraki: "ondalik_bozuk"

      - id: "ondalik_yakalandi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kızı omuzlarından tutup kalabalığın içine çekiyorsun ama Ondalıkçı'nın terazisi senden çabuk. Kefe, koca bir dünyanın ağırlığıyla elinin üstüne iniyor.", en: "You pull the girl back into the crowd by the shoulders, but the Tithe-Taker's scales are faster. The pan comes down on your hand with the weight of a whole world." }
          - { tr: "Kalabalık senden uzaklaşıyor. Saklanacak yer kalmadı: ya bırakacaksın ya dövüşeceksin.", en: "The crowd pulls back from you. There's nowhere left to hide. You either let go or you fight." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kızı bırakma; dövüş", en: "Don't let go of her. Fight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -4 }
              - dikkat: 4
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Saklayamadığın kızın elini bırakmadın ve meydanın ortasında Ondalıkçı'yla dövüşe tutuştun.", en: "You couldn't hide the girl, so you didn't let go of her hand, and you fought the Tithe-Taker in the middle of the square." }
          - id: "birak"
            etiket: { tr: "Elini bırak", en: "Let go of her hand" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: -6, insanlik: -2 }
            kronik: { tr: "Ondalık günü bir kızın elini tuttun ve sonra bıraktın.", en: "On Tithe Day you held a girl's hand, and then you let go." }
            sonraki: "ondalik_gidis"

      - id: "ondalik_siradaki"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı bir an duraksıyor, sonra hiçbir şey olmamış gibi sıradaki gencin önüne geçip terazisini kaldırıyor. Kefe iniyor.", en: "The Tithe-Taker pauses for a second. Then, like nothing happened, it moves on to the next kid in line and raises its scales. The pan sinks." }
          - { tr: "Bu kez seçilen bir oğlan. Kimse adını anmıyor; ailesi kalabalığın en gerisinde duruyor, babasının elleri bomboş. Sökecek pulları olacak kadar bile zengin değiller.", en: "A boy this time. Nobody says his name. His family is at the very back of the crowd, his father's hands empty. They aren't even rich enough to have chits to pry out." }
          - { tr: "Ninu annesinin kollarında hıçkırıyor. Oğlansa Senet Kulesi'ne doğru yürüyor ve dönüp arkasına bakmıyor.", en: "Ninu is sobbing in her mother's arms. The boy walks toward the Bond Tower and doesn't look back." }
        secenekler:
          - id: "oglan"
            etiket: { tr: "Oğlanın da önüne geç", en: "Step in front of the boy too" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -6 }
              - itibar: { kadimler: -10 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Bir çocuğu kurtardıktan sonra terazinin onun yerine seçtiği oğlan için de Ondalıkçı'nın önüne geçtin.", en: "After saving one child, you stepped in front of the Tithe-Taker again, this time for the boy the scale picked in her place." }
          - id: "bak"
            etiket: { tr: "Oğlanın gidişini izle", en: "Watch the boy go" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -1 }
            kronik: { tr: "Bir kızı kurtardın, onun yerine götürülen oğlanınsa gidişini seyrettin. Kimse adını anmadı.", en: "You saved one girl and watched the boy taken in her place walk away. Nobody even said his name." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_gidis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ninu Senet Kulesi'ne doğru yürüyor. Annesi bağırmıyor; babası avucundaki pulları yere döküp dizlerinin üstüne çöküyor.", en: "Ninu walks toward the Bond Tower. Her mother doesn't scream. Her father drops the chits out of his hands and goes down on his knees." }
          - { tr: "Kulenin kapısı açılıp kapanıyor. Meydandaki herkes sessizce, hep birlikte birer pul ödüyor; burada yas tutmanın da bir bedeli var.", en: "The tower door opens, then closes. Everyone in the square pays one chit at the same time, in silence. Here, even grief costs something." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Meydanın dağılmasını bekle", en: "Wait for the square to empty" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "Ondalık meydanı boşalana dek bekledin ve Tavvarların yasını bir alışveriş gibi seyrettin.", en: "You waited until the tithe square emptied out, and watched the Tavvari grieve like it was a transaction." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_bozuk"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı terazisini Ninu'nun önünde kaldırıyor ama kefe inmiyor. Sıradakinin önünde de inmiyor, ondan sonrakinin önünde de.", en: "The Tithe-Taker raises its scales in front of Ninu, and the pan doesn't sink. It doesn't sink for the next one, either. Or the next." }
          - { tr: "Meydanda bir uğultu yükseliyor ve kimse bunun için pul ödemiyor. Ondalıkçı terazisine bakıp sallıyor, yeniden kaldırıyor; nafile.", en: "A murmur goes up across the square, and nobody pays a single chit for it. The Tithe-Taker looks at its scales, shakes them, raises them again. Nothing." }
          - { tr: "{npc:yanki}: on, onda bir. bölmeyi biraz bozdum. Kadimler fark edecek elbet, ama bu yıl değil.", en: "{npc:yanki}: ten, one in ten. i broke the division a little. the Ancients will notice. just not this year." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[o̷ndalık: 0]", en: "[t̷ithe: 0]" }
            satirlar:
              - { tr: "hesap hatası raporlandı. raporlayan: kimse.", en: "calculation error reported. reported by: nobody." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ninu'nun ailesine kavuşmasını izle", en: "Watch Ninu go back to her family" }
            etkiler:
              - ahlak: { merhamet: 3 }
            kronik: { tr: "Ninu'nun ailesine kavuşmasını seyrettin; terazinin neden susup kaldığını bir sen biliyordun, bir de kafandaki ses.", en: "You watched Ninu go back to her family. Only you and the voice in your head knew why the scale had gone dead." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı'nın levhası ortasından ikiye yarılıyor; küçük, kusursuz terazisi meydanın pirinç zeminine düşüp tıngırdıyor. Dört yüz yıldır kimse bu sesi duymamış.", en: "The Tithe-Taker's plate splits in two, and its little perfect scales hit the brass floor of the square with a clang. Nobody's heard that sound in four hundred years." }
          - { tr: "İlk anda kıpırdayan olmuyor. Derken bir çocuk koşup teraziyi kaptığı gibi kulenin önündeki kanala fırlatıyor. Kalabalıktan bir haykırış kopuyor; öfke mi sevinç mi, kestirmek zor.", en: "At first, nobody moves. Then a kid runs out, grabs the scales and hurls them into the canal in front of the tower. The crowd roars, and you can't tell if it's rage or joy." }
          - { tr: "Senet Kulesi'nin tepesinde pirinç rengi bir ışık yanıyor. Kulenin derinlerinde bir şey uyanmakta.", en: "At the top of the Bond Tower, a brass light comes on. Something deep inside the tower is waking up." }
        secenekler:
          - id: "ninu"
            etiket: { tr: "Ninu'yu ve oğlanı ailelerine geri götür", en: "Bring Ninu and the boy back to their families" }
            etkiler:
              - bayrak: "ondalikci_olduruldu"
              - bayrak: "ninu_saklandi"
              - ahlak: { merhamet: 4, duzen: -2 }
              - xp_seviye: 40
            kronik: { tr: "Ondalıkçı'yı devirip o yıl seçilen bütün çocukları ailelerine geri götürdün.", en: "You took down the Tithe-Taker and brought every child picked that year back to their families." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe seni yere seriyor. Kusursuz terazi gözlerinin önünde yükselirken üstünde bir sayı yanıyor: senin fiyatın. Ondalıkçı onu ilk kez ölçebiliyor.", en: "The pan knocks you flat. Above you the perfect scales lift, and a number glows on them: your price. For the first time, the Tithe-Taker can measure it." }
          - { tr: "Kesra'yla iki genç seni koltuk altlarından tutup kalabalığın içine sürüklüyor. Ninu'yu son kez kulenin kapısında görüyorsun.", en: "Kesra and two kids grab you under the arms and drag you into the crowd. The last time you see Ninu, she's at the door of the tower." }
        secenekler:
          - id: "kac"
            etiket: { tr: "Kalabalığın içinde kaybol", en: "Disappear into the crowd" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: 1, insanlik: 1 }
              - can: 40
            kronik: { tr: "Ondalıkçı'ya yenildin; kurtarmaya çalıştığın kız Senet Kulesi'ne yürüyüp gitti.", en: "You lost to the Tithe-Taker, and the girl you tried to save walked into the Bond Tower." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Ondalıkçı peşine düşmüyor; terazisini yeniden Ninu'nun önünde kaldırıyor ve kefe iniyor.", en: "You back off. The Tithe-Taker doesn't follow. It raises its scales in front of Ninu again, and the pan sinks." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Uzaktan izle", en: "Watch from a distance" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: -4 }
            kronik: { tr: "Ondalıkçı'nın önünden çekilip bir kızın götürülüşünü uzaktan seyrettin.", en: "You backed away from the Tithe-Taker and watched a girl get taken from a distance." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_kesra"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Gece Kesra seni Kervan'ın kıç güvertelerinde, makinelerin gürültüsünün sözleri yuttuğu yerde buluyor. Burada kimse pul ödemiyor, çünkü kimse bir şey duymuyor.", en: "That night, down on the Caravan's stern decks, where the roar of the engines swallows every word, Kesra finds you. Nobody pays chits down here, because nobody can hear." }
          - { tr: "\"Onda birin nereye gittiğini biliyor musun?\" diye soruyor. \"Hizmetkâr falan olmuyorlar. {yer:yedi_taht|de} seviyeleri sağılıyor, sonra bir Kadim'in derisinin altına yıldız diye gömülüyorlar. Kardeşim şu an birinin omzunda parlıyor.\"", en: "\"Do you know where the tithe goes?\" she asks. \"They don't become servants. In {yer:yedi_taht} they get milked for their levels and buried under some Ancient's skin as stars. My brother's shining on somebody's shoulder right now.\"" }
          - { tr: "\"Senedin mühür makinesi Kervan'ın kalbinde,\" diyor. \"Biz kendimize Boş Kefe diyoruz, çünkü tartılacak hiçbir şeyimiz kalmadı. O makineyi kırmak istiyoruz. Seninle.\"", en: "\"The treaty's seal engine is in the Caravan's heart,\" she says. \"We call ourselves the Empty Pan, because we've got nothing left to weigh. We want to break it. With you.\"" }
          - metin: { tr: "Bakışı göğsündeki Kadim mührüne kayıp orada bir an takılıyor. \"Ya da sen onların adamısın,\" diyor. \"O zaman bunu anlattığıma pişman olacağım.\"", en: "Her eyes slide to the Ancient seal on your chest and stay there a second. \"Or you're one of theirs,\" she says. \"In which case I'm going to regret telling you this.\"" }
            kosul: { bayrak: "kervan_damgali" }
        secenekler:
          - id: "dusun"
            etiket: { tr: "Düşüneceğim", en: "I'll think about it" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Ondalık gününde verdiğin cevabın sırası geldi.", en: "It's time for the answer you gave on tithe day." } }
            kronik: { tr: "{yer:pirinc_kervan|in} isyancılarına düşüneceğini söyledin; sen düşünürken onlar bekledi.", en: "You told {yer:pirinc_kervan|pos} rebels you'd think about it, and they waited while you did." }
            sonraki: "@akis"
          - id: "evet"
            etiket: { tr: "Ne zaman başlıyoruz?", en: "When do we start?" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: -4, merhamet: 2 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Ondalık gününde verdiğin cevabın sırası geldi.", en: "It's time for the answer you gave on tithe day." } }
            kronik: { tr: "{yer:pirinc_kervan|in} isyancılarına daha planlarını duymadan evet dedin.", en: "You said yes to {yer:pirinc_kervan|pos} rebels before you'd even heard the plan." }
            sonraki: "@akis"
          - id: "sayman"
            etiket: { tr: "Önce Sayman'ı dinlemek istiyorum", en: "I want to hear the Reckoner out first" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 3 }
              - tohum: { olay: "kervan_sayman", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "İsyancılara cevap vermeden önce Kervan'ın efendisini dinlemek istedin.", en: "Before giving the rebels an answer, you wanted to hear out the Caravan's master." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SAYMAN (yedi_taht_davet)
  - id: "kervan_sayman"
    konum: ["pirinc_kervan"]
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "kervan", "kadimler", "siyaset"]
    gerilim: 2
    kart: { tr: "Sayman", en: "The Reckoner" }
    sahne: "sayman_1"
    sahneler:
      - id: "sayman_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Senet Kulesi'nin tepesine çağrılıyorsun; davetiye tek bir pul, üstünde tek bir hece. {yer:pirinc_kervan|e} gelen er geç çağrılır, çünkü Sayman herkesi tartar.", en: "You get summoned to the top of the Bond Tower. The summons is a single chit with one syllable on it. Come to {yer:pirinc_kervan}, and sooner or later you get called up; the Reckoner weighs everyone." }
          - { tr: "Sayman çok yaşlı bir Tavvar. Derisinde boş bir yer kalmamış; tepeden tırnağa pulla kaplı bu bedene Kervan'ın dört yüz yıllık bütün defteri yazılı.", en: "The Reckoner is a very old Tavvari. There isn't a bare inch on him. He's chits from crown to heel, the Caravan's entire four-hundred-year ledger written on his body." }
          - { tr: "Konuşmadan önce kolundan bir pul söküp masaya bırakıyor. Kan akmıyor; geride ince, beyaz bir izden başka bir şey kalmamış. \"Her sözün bir bedeli vardır,\" diyor. \"Seninle konuşmak için kendimden ödüyorum. Bunu bil.\"", en: "Before he speaks, he pries a chit off his own arm and sets it on the table. No blood, just a thin white scar. \"Every word has a price,\" he says. \"To talk to you, I pay out of myself. Know that.\"" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Sökülen pul gelişigüzel seçilmemiş: kolunun en eski satırından, kendi doğumunu yazan pulun hemen yanından alınmış.", en: "The chit he pulled isn't random. It came from the oldest line on his arm, right next to the one recording his own birth." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu adam bir defter değil, bir bedel listesi. listenin en başındaysa bir çocuk var.", en: "this man isn't a ledger. he's an invoice. and at the very top of the invoice is a child." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Otur ve dinle", en: "Sit down and listen" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "sayman_senet"
          - id: "ode"
            etiket: { tr: "Sen de bir pul öde; eşit konuşalım", en: "Pay a chit yourself. Talk as equals" }
            gerekli: { esya: { pirinc_pul: 1 } }
            etkiler:
              - esya: { pirinc_pul: -1 }
              - ahlak: { insanlik: 2, duzen: 1 }
            sonraki: "sayman_senet"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} derisinin en başını okusun", en: "Have {npc:yanki} read the top of his skin" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, saygi: 2 } }
              - ahlak: { insanlik: -1 }
            sonraki: "sayman_kizi"

      - id: "sayman_kizi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:yanki} satırları dizdikçe bir isim beliriyor: Sayman'ın kalbinin üstündeki ilk pul. Bir kız, ilk çocuğu. Altında tek bir hece: ondalık.", en: "As {npc:yanki} lines up the entries, a name surfaces: the first chit over the Reckoner's heart. A girl, his firstborn. Under it, a single syllable: tithe." }
          - { tr: "Sayman gözlerinin nereye kaydığını görüyor. Bu kez pul ödemeden, bedavaya konuşuyor: \"Evet. İlk ben verdim. Sayman olmanın şartı bu.\"", en: "The Reckoner sees where your eyes went. Without paying, for free, he says: \"Yes. I gave first. That's the price of being Reckoner.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Anlatmasına izin ver", en: "Let him tell it" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "sayman_senet"

      - id: "sayman_senet"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "\"Dört yüz on iki yıl önce Kadimler bizi hasat etmeye geldi,\" diyor Sayman; her cümlesinde masaya bir pul daha düşüyor. \"Bizim de üç yüz altmış beş günümüz vardı. Savaşabilirdik. Ölürdük.\"", en: "\"Four hundred and twelve years ago, the Ancients came to harvest us,\" the Reckoner says, and a chit hits the table with every sentence. \"We had three hundred and sixty-five days too. We could have fought. We'd have died.\"" }
          - { tr: "\"Büyükannem onlara bir teklifte bulundu: bizi hasat etmek yerine sahiplensinler. Dünyamızı bir gemiye çevirdik, her kuşağın onda birini verdik; senedi de kendi sırtına yazdırdı. Kalan dokuzda biz yaşadık. Bin yıl sürerse bin yıl yaşarız.\"", en: "\"My grandmother made them an offer: own us instead of harvesting us. We turned our world into a ship, we gave a tenth of every generation, and she had the treaty written on her own back. On the other nine, we live. If it lasts a thousand years, we live a thousand years.\"" }
          - { tr: "\"Senin dünyana da bir elçi geldi,\" diyor. \"Bir senet getirecek; herkese getirirler. Ben sana o senedin neye benzediğini gösteriyorum: bize.\"", en: "\"An envoy has come to your world too,\" he says. \"He'll bring a treaty. They bring one to everyone. I'm showing you what that treaty looks like. It looks like us.\"" }
          - metin: { tr: "\"Elçinizin adını biliyorum,\" diye ekliyor. \"{npc:thessar}. Raporları {yer:yedi_taht|de} okunuyor ve senin adın da o raporlarda geçiyor.\"", en: "\"I know your envoy's name,\" he adds. \"{npc:thessar}. His reports are read in {yer:yedi_taht}. Your name is in those reports.\"" }
            kosul: { bayrak: "thessar_indi" }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"'Kalan dokuzda biz yaşadık,' diyor; bir başarı hikâyesi anlatır gibi. Beni her şeyden çok korkutan da bu.\"", en: "\"'On the other nine, we live.' He's telling it like a success story. That scares me more than anything.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yaşamak yaşamaktır. Ama bunu onda birin annesine söyleyemem.\"", en: "\"Living is living. But I couldn't say that to the mother of the tenth.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Benden ne istiyorsun?", en: "What do you want from me?" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: 1 }
            sonraki: "sayman_teklif"
          - id: "haklisin"
            etiket: { tr: "Doğru seçimi yapmışsınız", en: "You made the right call" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 4 }
            sonraki: "sayman_teklif"
          - id: "yanlis"
            etiket: { tr: "Bu yaşamak değil; taksitle ölmek", en: "That's not living. That's dying in installments" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: -4, insanlik: 3 }
              - itibar: { kadimler: -3 }
            sonraki: "sayman_teklif"

      - id: "sayman_teklif"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sayman masaya iki şey koyuyor. Biri Kadim yazısıyla yazılmış, ışıktan bir şeritle bağlanmış mühürlü bir mektup. \"{yer:yedi_taht|e} giriş,\" diyor. \"Oraya davetsiz kimse giremez. Ben seni davet ettirebilirim.\"", en: "The Reckoner lays two things on the table. One is a sealed letter in Ancient script, tied with a ribbon of light. \"Entry to {yer:yedi_taht},\" he says. \"No one gets in uninvited. I can get you invited.\"" }
          - { tr: "Öteki pirinç bir levha: bir ticaret yolu. \"Senin şehrinle Kervan arasında,\" diyor. \"Tahıl, ilaç, pirinç, mühendis. Kadimler onaylar; bizim üzerimizden yapılan her ticareti onaylarlar.\"", en: "The other is a brass plate: a trade route. \"Between your city and the Caravan,\" he says. \"Grain, medicine, brass, engineers. The Ancients will approve it. They approve any trade that runs through us.\"" }
          - { tr: "\"Karşılığında,\" diyor ve bu kez iki pul birden söküyor, \"Boş Kefe'yi durdur. Kesra'nın çocuklarını. Mührü kırarlarsa koruma biter, Kadimler de bizi bir gecede toplar. Özgürlük bizi öldürür.\"", en: "\"In exchange,\" he says, and this time he pries off two chits at once, \"stop the Empty Pan. Kesra's children. If they break the seal, the protection ends, and the Ancients collect us in a single night. Freedom will kill us.\"" }
        sezgiler:
          - kosul: { stat: { int: 160 } }
            metin: { tr: "Mektubun Kadim yazısını okuyabiliyorsun; kıvrımları pencerendeki satırları andırıyor. Mektup seni 'konuk' olarak değil, 'numune' olarak tanıtıyor.", en: "You can read the Ancient script on the letter; its curls look like the lines of a window. It doesn't introduce you as a 'guest.' It introduces you as a 'specimen.'" }
        secenekler:
          - id: "mektup"
            etiket: { tr: "Mektubu olduğu gibi al", en: "Take the letter as it is" }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - bayrak: "sayman_numune_mektubu"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Saymanın verdiği mektup seni çağırıyor.", en: "The letter the Treasurer gave you is calling." } }
            sonraki: "sayman_kefe"
          - id: "yazdir"
            tur: "gosteris"
            etiket: { tr: "Mektubu oku; 'numune'yi 'konuk' yaptır", en: "Read it. Make him change 'specimen' to 'guest'" }
            gerekli: { stat: { int: 160, cha: 150 } }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - aciga_vur: true
              - ahlak: { duzen: -1, insanlik: 2 }
              - itibar: { kadimler: 2 }
              - dikkat: 3
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Saymanın verdiği mektup seni çağırıyor.", en: "The letter the Treasurer gave you is calling." } }
            sonraki: "sayman_yazdi"
          - id: "ticaret"
            etiket: { tr: "Ticaret yolunu al; şehrin buna muhtaç", en: "Take the trade route. Your city needs it" }
            etkiler:
              - bayrak: "kervan_ticaret"
              - ahlak: { duzen: 4, insanlik: -2, merhamet: 2 }
              - itibar: { lonca: 5, siginak: 3, kadimler: 6 }
              - degisken: { kadim_tehdit: 3, hayatta_kalan: 2 }
            sonraki: "sayman_kefe"
          - id: "hicbiri"
            etiket: { tr: "İkisini de geri it", en: "Push both back across the table" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { kadimler: -3 }
            sonraki: "sayman_kefe"

      - id: "sayman_yazdi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mektubu açıp yüksek sesle okurken Kadim sözcüklerini doğru telaffuz etmenle Sayman'ın derisindeki pulların ürpermesi bir oluyor. \"Numune,\" diyorsun. \"Yanlış yazılmış.\"", en: "You open the letter and read it out loud. The moment you pronounce the Ancient words right, the chits on the Reckoner's skin shiver. \"Specimen,\" you say. \"That's a typo.\"" }
          - { tr: "Uzun bir sessizliğin bedeli yedi pul. Sayman onları ödedikten sonra kalemi alıp tek bir sözcüğü değiştiriyor. \"Kadimler bunu sevmeyecek,\" diyor. \"Ben de sevmedim. Ama seni tartamadım ve bunu da yazmam gerekirdi.\"", en: "A long silence. The Reckoner pays seven chits for it. Then he picks up the pen and changes one word. \"The Ancients won't like this,\" he says. \"Neither do I. But I couldn't weigh you, and I'd have had to write that down too.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Mektubu al", en: "Take the letter" }
            sonraki: "sayman_kefe"

      - id: "sayman_kefe"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kalkarken Sayman bir pul daha söküyor, ama bu kez masaya koymayıp sana uzatıyor. Üstünde tek bir hece var: 'lütfen'.", en: "As you get up, the Reckoner pries off one more chit, but instead of putting it on the table he holds it out to you. One syllable on it: 'please.'" }
          - metin: { tr: "\"Ondalıkçı'yı yere serdin,\" diyor. \"Kesra'nın çocukları şimdiden yüzlerce kişi; yarın binlerce olurlar. İstesen de istemesen de onların bayrağı sensin.\"", en: "\"You put the Tithe-Taker on the ground,\" he says. \"Kesra's children number in the hundreds now. Tomorrow it'll be thousands. You're their flag, whether you want to be or not.\"" }
            kosul: { bayrak: "ondalikci_olduruldu" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Pulu al; Boş Kefe'yi durduracağına söz ver", en: "Take the chit. Promise to stop the Empty Pan" }
            etkiler:
              - bayrak: "sayman_soz"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Saymanla aranızdaki konuşma bir yere ve bir saate dönüştü.", en: "That talk with the Treasurer has turned into a place and a time." } }
            sonraki: "@akis"
          - id: "red"
            etiket: { tr: "Pulu geri ver; söz yok", en: "Give the chit back. No promises" }
            etkiler:
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: -2, insanlik: 1 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Saymanla aranızdaki konuşma bir yere ve bir saate dönüştü.", en: "That talk with the Treasurer has turned into a place and a time." } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ BOŞ KEFE (boss · önemli)
  - id: "kervan_bos_kefe"
    konum: ["pirinc_kervan"]
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_kefe_daveti" }
    agirlik: 4
    etiketler: ["cok_evren", "kervan", "boss", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Boş Kefe", en: "The Empty Pan" }
    sahne: "kefe_1"
    sahneler:
      - id: "kefe_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra haberine tek bir pul bile eklememiş; yalnızca bir yer ve bir saat bildirmiş. {yer:pirinc_kervan|in} kıç güvertelerine, makinelerin sözleri yuttuğu yere iniyorsun.", en: "When Kesra's message reaches you, she hasn't sent a single chit with it, just a place and a time. You go down to {yer:pirinc_kervan|pos} stern decks, where the engines swallow every word." }
          - { tr: "Kırk Tavvar seni bekliyor, hepsinin derisinde sökülmüş pulların beyaz izleri var. Kesra ortalarında durmuş, elinde Kervan'ın kalbini gösteren bir çizim: dişliler, zincirler ve ortada, camın altında, bir Tavvar'ın sırtından yüzülmüş deri. Senet.", en: "Forty Tavvari are waiting, all of them marked with the white scars of pried-out chits. Kesra stands in the middle with a drawing of the Caravan's heart: gears, chains, and in the center, under glass, a hide taken off a Tavvari back. The treaty." }
          - { tr: "\"Mührü kırarsak senet biter,\" diyor. \"Kadimler gelir. Biz de Kervan'ı Karanlık Rota'ya, hiçbir Katman'ın uzanmadığı yere sürüp kaçacağız. Belki ölürüz. Ama onda birimizi vermeyiz.\"", en: "\"If we break the seal, the treaty's void,\" she says. \"The Ancients will come. We'll drive the Caravan onto the Dark Route, out where there are no Layers, and run. Maybe we die. But we don't hand over our tenth.\"" }
          - metin: { tr: "Kırk değil, yüzlerce kişi. Ondalıkçı'nın düştüğü günden beri güverteler dolup taşmış. Kalabalığın en önünde perdeli değil, altı parmaklı bir el sana bir pul uzatıyor: Ninu.", en: "Not forty. Hundreds. The decks have been filling up since the day the Tithe-Taker fell, and at the front of the crowd a six-fingered hand holds out a chit to you. Ninu." }
            kosul: { bayrak: "ondalikci_olduruldu" }
          - metin: { tr: "Kesra'nın gözü göğsündeki Kadim mührüne takılmış. \"Sayman'ın pulunu aldın mı?\" diye soruyor. \"Söyle. Burada yalan bedava değil.\"", en: "Kesra's eyes are on the Ancient seal on your chest. \"Did you take the Reckoner's chit?\" she asks. \"Say it. Lies aren't free down here.\"" }
            kosul: { bayrak: "sayman_soz" }
        sezgiler:
          - kosul: { stat: { int: 160 } }
            metin: { tr: "Çizime bakılırsa mühür makinesi Kervan'ın ana motoruna bağlı. Kırılırsa gemi bir süre başıboş sürüklenecek; Karanlık Rota'ya varabilmeleri için birinin onu itmesi gerekecek.", en: "Going by the drawing, the seal engine is wired into the Caravan's main drive. Break it, and the ship drifts for a while. Somebody's going to have to push it onto the Dark Route." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "senedi kırmak zinciri kırmak demek. ama zincir aynı zamanda çapadır. bunu onlar da biliyor, yine de istiyorlar.", en: "breaking a treaty is breaking a chain. but a chain is also an anchor. they know that. they want it anyway." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kalbe inen bir yol, bir bekçi, koca bir makine. Bana sorarsan düpedüz davetiye bu.\"", en: "\"Road to the heart, a guardian, one big machine. If you ask me, that's an invitation.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bin kişi özgür kalsın diye kaç kişinin öleceğini hesapladın mı? Onlar hesaplamış. Asıl korkunç olan da bu.\"", en: "\"Did you do the math on how many die so a thousand go free? They did. That's the terrifying part.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir senet, bir mühür, bir makine. Bizim Sistem'e bu kadar benzeyen bir şey görmedim. Kır onu.\"", en: "\"A treaty, a seal, a machine. Never seen anything this close to our System. Break it.\"" }
        secenekler:
          - id: "liderlik"
            etiket: { tr: "Saldırıyı sen yönet; kalbe in", en: "Lead the strike. Go down to the heart" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: 2 }
              - itibar: { kadimler: -6 }
              - iliski: { yanki: { saygi: 3 } }
            kronik: { tr: "{yer:pirinc_kervan|in} isyancılarını geminin kalbine kendin götürdün.", en: "You led {yer:pirinc_kervan|pos} rebels down into the heart of the ship yourself." }
            sonraki: "kefe_kalp"
          - id: "oylama"
            tur: "gosteris"
            etiket: { tr: "Bütün Kervan oylasın; sesini çarşıya duyur", en: "Let the whole Caravan vote. Make the bazaar hear" }
            gerekli: { stat: { cha: 190 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: 2, insanlik: 4 }
            kronik: { tr: "{yer:pirinc_kervan} halkına, dört yüz yılda ilk kez, hangi bedeli ödemek istediklerini sordun.", en: "For the first time in four hundred years, you asked the whole Brass Caravan what price they actually wanted to pay." }
            sonraki: "kefe_oylama"
          - id: "ihanet"
            etiket: { tr: "Sayman'a ve Kadimler'e haber ver", en: "Tip off the Reckoner and the Ancients" }
            etkiler:
              - bayrak: "kervan_muhur_korundu"
              - ahlak: { duzen: 8, merhamet: -6, insanlik: -3 }
              - itibar: { kadimler: 12 }
              - degisken: { kadim_tehdit: 4 }
            kronik: { tr: "Boş Kefe'yi Kadimler'e ispiyonladın ve {yer:pirinc_kervan|in} senedini kendi ellerinle korudun.", en: "You sold the Empty Pan out to the Ancients and kept {yer:pirinc_kervan|pos} treaty intact with your own hands." }
            sonraki: "kefe_ihanet"
          - id: "ayril"
            etiket: { tr: "Bu sizin savaşınız; ben yokum", en: "This is your fight. Count me out" }
            etkiler:
              - bayrak: "kervan_isyan_yalniz"
              - ahlak: { duzen: 2, merhamet: -3 }
            kronik: { tr: "{yer:pirinc_kervan|in} isyancılarını kendi savaşlarıyla yalnız bıraktın.", en: "You left {yer:pirinc_kervan|pos} rebels alone with their own war." }
            sonraki: "kefe_ayril"

      - id: "kefe_oylama"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sesin Tartı Çarşısı'nda yankılanıyor ve kimse senden pul istemiyor. Kesra'nın gençleri dev terazinin kırık kolunu zincirlerle onarıp kefelerden birine 'kal', ötekine 'kır' yazıyor.", en: "Your voice booms across the Weighing Bazaar, and nobody asks you for a chit. Kesra's kids patch the great scale's broken arm with chains and label the pans: 'stay' on one, 'break' on the other." }
          - { tr: "Tavvarlar bütün gece sıraya giriyor; her biri derisinden bir pul söküp kefelerden birine atıyor. Kimi ağlıyor, kimi dört yüz yıldır ilk kez kendi sesiyle bir şey söylüyor.", en: "All night the Tavvari line up. Each one pries a chit out of their skin and drops it in a pan. Some are crying. Some are saying something in their own voice for the first time in four hundred years." }
          - { tr: "Şafak sökerken terazi 'kır' tarafına inmiş. Senet Kulesi'nde Sayman başını öne eğiyor; Kervan'ın kalbindeyse dişliler ters yöne dönmeye başlıyor.", en: "At dawn the scale tips toward 'break.' Up in the Bond Tower, the Reckoner bows his head. And in the Caravan's heart, the gears start to turn backward." }
        secenekler:
          - id: "kalp"
            etiket: { tr: "Kalbe in; halkın kararını uygula", en: "Go down to the heart. Carry out the vote" }
            etkiler:
              - bayrak: "kervan_oylandi"
              - ahlak: { duzen: -3, insanlik: 2 }
            kronik: { tr: "Bir halkın oyunu kendi ellerinle mühür makinesine taşıdın.", en: "You carried a people's vote down to the seal engine with your own hands." }
            sonraki: "kefe_kalp"

      - id: "kefe_kalp"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kervan'ın kalbi bir katedral büyüklüğünde. Dişliler ev kadar, zincirler bir insan gövdesi kalınlığında; her şey pirinçten, ağır ve sıcak. Ortada, camın altında senet duruyor, üstündeki Kadim yazısı hâlâ hafif hafif ışıldıyor.", en: "The Caravan's heart is the size of a cathedral. Gears as big as houses, chains as thick as a body, everything brass, everything heavy and hot. In the middle, under glass, the treaty, the Ancient script on it still faintly glowing." }
          - { tr: "Cama yaklaştığında dişliler duruyor, sonra hepsi birden ters yöne dönüyor. Makinenin içinden binlerce imzanın sesi aynı cümleyi kuruyor: [Senet bozulamaz.]", en: "When you get close to the glass, the gears stop. Then every one of them spins backward at once, and from inside the machine the voice of a thousand signatures says one sentence: [The bond cannot be broken.]" }
          - { tr: "Zincirler, dişliler, pirinç levhalar birbirine geçiyor ve karşında bir şey doğruluyor: Mühürdar.", en: "Chains, gears and brass plates lock together, and something rises up in front of you. The Sealwarden." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[SENET BEKÇİSİ: Mühürdar]", en: "[TREATY GUARDIAN: The Sealwarden]" }
            satirlar:
              - { tr: "Yetki: Kadim. Süre: 412 yıl. İhlal: tespit edildi.", en: "Authority: Ancient. Term: 412 years. Breach: detected." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Mühürdar'la yüzleş", en: "Face the Sealwarden" }
            etkiler:
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["muhurdar@oyuncu+6"], ortam: ["dar_gecit"], kazan: "kefe_zafer", kaybet: "kefe_yenilgi", kac: "kefe_kacis" }
            kronik: { tr: "Dört yüz yıllık bir senedin bekçisiyle {yer:pirinc_kervan|in} kalbinde dövüştün.", en: "You fought the guardian of a four-hundred-year-old treaty in the heart of {yer:pirinc_kervan}." }
          - id: "zincir"
            etiket: { tr: "Önce Kesra'nın gençleri zincirleri kessin", en: "Have Kesra's kids cut the chains first" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -2 }
              - savas: { dusmanlar: ["muhurdar@oyuncu+3"], ortam: ["dar_gecit"], kazan: "kefe_zafer", kaybet: "kefe_yenilgi", kac: "kefe_kacis" }
            kronik: { tr: "Mühürdar'ın zincirlerini, neye mal olabileceğini bile bile isyancıların ellerine kestirdin.", en: "You had the rebels cut the Sealwarden's chains by hand, knowing what it might cost them." }

      - id: "kefe_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mühürdar'ın göğsü yarılıyor, dişliler birer birer kırılıyor. İmzaların sesi dağılıp gidiyor; en sonda bir çocuğun sesi kalıyor, sonra o da susuyor.", en: "The Sealwarden's chest splits open, and the gears break one by one. The voice of the signatures falls apart, until only a child's voice is left, and then that goes quiet too." }
          - { tr: "Camın altındaki senet artık ışıldamıyor. Bütün Kervan bir an sarsılıyor, motorları susuyor; dört yüz yıldır ilk kez gemi kimseye ait değil.", en: "The treaty under the glass doesn't glow anymore. The whole Caravan shudders. The engines cut out, and for the first time in four hundred years the ship belongs to no one." }
          - { tr: "Kesra elinde bir meşaleyle camın önünde durmuş, sana bakıyor. Kararı sana bırakıyor, çünkü kalbe kadar senin peşinden geldiler.", en: "Kesra is standing in front of the glass with a torch in her hand. She's looking at you. She's leaving this one to you, because they followed you all the way to the heart." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[Bağ durumu: geçersiz]", en: "[Bond status: void]" }
            satirlar:
              - { tr: "Tavvar Kervanı: bağsız Katman. Hasat koruması: yok.", en: "Tavvari Caravan: unbonded Layer. Harvest protection: none." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Meşaleyi al ve senedi yak", en: "Take the torch. Burn the treaty" }
            etkiler:
              - bayrak: "kervan_ozgur"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 1 }
              - ahlak: { duzen: -6, insanlik: 4, merhamet: 2 }
              - itibar: { kadimler: -15 }
              - degisken: { kadim_tehdit: -6 }
              - xp_seviye: 120
            kronik: { tr: "{yer:pirinc_kervan|in} dört yüz yıllık senedini kendi ellerinle yaktın. Sahipsiz kalan Tavvarlar Karanlık Rota'ya kendi başlarına açıldı.", en: "You burned {yer:pirinc_kervan|pos} four-hundred-year-old treaty with your own hands. The Tavvari lost their owners and set out onto the Dark Route on their own." }
            sonraki: "kefe_ozgur"
          - id: "yeniden"
            etiket: { tr: "Senedi yeniden yaz; kendi adına", en: "Rewrite the treaty. In your own name" }
            etkiler:
              - bayrak: "kervan_sahibi"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 1 }
              - ahlak: { duzen: 8, insanlik: -8, merhamet: -3 }
              - itibar: { kadimler: -10, lonca: 4 }
              - degisken: { kadim_tehdit: -3 }
              - ordu_kazan: 40
              - xp_seviye: 120
            kronik: { tr: "{yer:pirinc_kervan|in} senedini kırıp yerine kendi adını yazdın; Tavvarlar bir efendiden kurtulup ötekinin eline düştü.", en: "You broke {yer:pirinc_kervan|pos} treaty and wrote your own name in its place. The Tavvari traded one master for another." }
            sonraki: "kefe_sahip"
          - id: "parca"
            etiket: { tr: "Mührün kalbini sök; gücü senin olsun", en: "Rip out the seal's core. Its power is yours" }
            etkiler:
              - bayrak: "kervan_ozgur"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 3 }
              - ahlak: { insanlik: -6, duzen: -2 }
              - dikkat: 6
              - stat: { int: 10, wil: 10 }
              - itibar: { kadimler: -12 }
              - degisken: { kadim_tehdit: -5 }
              - xp_seviye: 150
            kronik: { tr: "{yer:pirinc_kervan|i} özgür bıraktın, ama mühür makinesinin kalbini kendi göğsünde taşıyıp götürdün.", en: "You set {yer:pirinc_kervan} free, but you carried the seal engine's heart away in your own chest." }
            sonraki: "kefe_ozgur"

      - id: "kefe_ozgur"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Güvertelerde kimse pul ödemiyor. Binlerce Tavvar hep bir ağızdan konuşup bağırıyor, şarkı söylüyor; dört yüz yıllık bir sessizliğin borcu bir gecede kapanıyor.", en: "Nobody on the decks is paying chits. Thousands of Tavvari are talking, yelling, singing all at once. Four hundred years of silence gets paid off in a single night." }
          - { tr: "Kervan'ın motorları yeniden çalışıyor, ama bu kez Kesra'nın gençlerinin elleriyle. Dev gemi ağır ağır dönüp burnunu yıldızsız bir karanlığa, Karanlık Rota'ya çeviriyor.", en: "The Caravan's engines kick back on, but this time Kesra's kids are running them by hand. The giant ship turns slowly, nose toward a dark with no stars in it: the Dark Route." }
          - metin: { tr: "Ninu güvertenin kenarından sana el sallıyor. Derisindeki boş pul yuvasına bir şey kazımış: tek bir hece, bedeli ödenmemiş. 'Özgür'.", en: "Ninu waves at you from the rail. She's scratched something into the empty chit socket in her skin: one syllable, unpaid for. 'Free.'" }
            kosul: { bayrak: "ninu_saklandi" }
          - { tr: "\"Belki ölürüz,\" diyor Kesra yanı başında. \"Ama ölümümüz kendi ölümümüz olacak.\" Sonra bedavaya gülümsüyor.", en: "\"Maybe we die,\" Kesra says beside you. \"But it'll be our own death.\" Then she smiles, for free." }
        secenekler:
          - id: "veda"
            etiket: { tr: "Pirinç kapıya dön; onları yolcu et", en: "Head back to the brass door. See them off" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
            kronik: { tr: "Özgür bıraktığın bir halkı, hiçbir haritada olmayan bir karanlığa uğurladın.", en: "You saw a people you'd freed off into a dark that isn't on any map." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Kendi dünyanın senedini düşün", en: "Think about the treaty coming to your world" }
            etkiler:
              - ahlak: { duzen: -2 }
            kronik: { tr: "Bir senedin sonunu görünce kendi dünyana gelecek olanı düşündün.", en: "Watching one treaty die, you thought about the one coming to your world." }
            sonraki: "@akis"

      - id: "kefe_sahip"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra'nın meşalesi yere düşüyor. Senedin derisine, Kadim yazısının üstüne senin adın yazılıyor ve Sistem bunu bir mülk devri olarak kaydediyor.", en: "Kesra's torch hits the floor. Your name gets written onto the hide of the treaty, over the Ancient script, and the System logs it as a transfer of property." }
          - { tr: "Güvertelerde kimse bağırmıyor. Binlerce Tavvar hep birlikte derisinden bir pul söküp yere bırakıyor; yeni sahiplerine ilk vergilerini ödüyorlar.", en: "Nobody on the decks is yelling. Thousands of Tavvari, all at once, pry a chit out of their skin and set it down. They're paying their new owner their first tax." }
          - { tr: "Kesra yüzüne bakmadan soruyor: \"Onda bir mi istiyorsun? Yoksa daha azını mı? Sahipler hep daha azını istediklerini söyler.\"", en: "Kesra won't look at you. \"Do you want a tenth?\" she asks. \"Or less? Owners always say they want less.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bağ durumu: devredildi]", en: "[Bond status: transferred]" }
            satirlar:
              - { tr: "Tavvar Kervanı: bağlı Katman. Sahip: sen.", en: "Tavvari Caravan: bonded Layer. Owner: you." }
        secenekler:
          - id: "hicbir"
            etiket: { tr: "Ondalık yok; yalnızca sadakat", en: "No tithe. Just loyalty" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
            kronik: { tr: "{yer:pirinc_kervan|in} sahibi olup ondalığı kaldırdın; Tavvarlar sana minnet mi duysun, senden mi korksun, bilemedi.", en: "You became {yer:pirinc_kervan|pos} owner and abolished the tithe, and the Tavvari couldn't tell whether to be grateful or afraid." }
            sonraki: "@akis"
          - id: "ondalik"
            etiket: { tr: "Onda bir; bana, Kadimler'e değil", en: "A tenth. To me, not to the Ancients" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4, duzen: 4 }
              - ordu_kazan: 40
            kronik: { tr: "{yer:pirinc_kervan|in} ondalığını Kadimler'in elinden alıp kendi adına yazdın; onda bir artık senin ordunda yürüyordu.", en: "You took {yer:pirinc_kervan|pos} tithe away from the Ancients and wrote it over to yourself. A tenth of them marched in your army now." }
            sonraki: "@akis"

      - id: "kefe_ihanet"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sayman'ın pulunu, üstüne yalnızca bir saat ve bir yer yazıp masasına bırakıyorsun. Ertesi gece kıç güvertelerinde makinelerin gürültüsü bile Kadim muhafızlarının ayak seslerini bastıramıyor.", en: "You leave the Reckoner's chit on his table with nothing on it but a time and a place. The next night, down on the stern decks, even the roar of the engines can't drown out the footsteps of the Ancient guards." }
          - { tr: "Kırk Tavvar diz çöktürülüyor ama Kesra ayakta kalıyor. Seni kalabalığın arasında görüp tek söz etmiyor; burada sessizlik pahalıdır ve o bedelini ödüyor.", en: "Forty Tavvari are forced to their knees. Kesra stays standing. She spots you in the crowd and says nothing. Silence is expensive down here, and she pays for it." }
          - { tr: "Yeni bir Ondalıkçı terazisini Kesra'nın önünde kaldırıyor ve kefe iniyor.", en: "A new Tithe-Taker raises its scales in front of Kesra. The pan sinks." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "epik"
            baslik: { tr: "[Unvan: Senedin Koruyucusu]", en: "[Title: Keeper of the Bond]" }
            satirlar:
              - { tr: "Kadim Mülkiyet Dairesi hizmetinizi kaydetti. {yer:yedi_taht|e} davetiniz hazırlandı.", en: "The Ancient Office of Holdings has recorded your service. Your invitation to {yer:yedi_taht} has been prepared." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kesra'nın götürülüşünü izle", en: "Watch Kesra get taken" }
            etkiler:
              - unvan: "senet_koruyucu"
              - bayrak: "yedi_taht_davet"
              - gorev: { cok_evren_kervan: tamam }
              - ahlak: { merhamet: -4, duzen: 3 }
              - xp_seviye: 80
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Boş Kefe'den beri cebindeki mektup aklında.", en: "Since the Empty Pan, you keep thinking about the letter in your pocket." } }
            kronik: { tr: "{yer:pirinc_kervan|in} isyancısı Kesra'yı Kadimler'e teslim ettin, karşılığında da {yer:yedi_taht|e} bir davet aldın.", en: "You handed {yer:pirinc_kervan|pos} rebel Kesra to the Ancients and got an invitation to {yer:yedi_taht} for it." }
            sonraki: "@akis"
          - id: "kurtar"
            etiket: { tr: "Son anda Kesra'yı kefeden çek", en: "Pull Kesra off the pan at the last second" }
            etkiler:
              - unvan: "senet_koruyucu"
              - bayrak: "yedi_taht_davet"
              - gorev: { cok_evren_kervan: tamam }
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { kadimler: -4 }
              - xp_seviye: 60
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 }, hatirlatma: { tr: "Boş Kefe'den beri cebindeki mektup aklında.", en: "Since the Empty Pan, you keep thinking about the letter in your pocket." } }
            kronik: { tr: "Boş Kefe'yi Kadimler'e sattın, sonra son anda liderini kefeden çektin.", en: "You sold the Empty Pan to the Ancients, then pulled its leader off the scale at the last second." }
            sonraki: "kefe_kesra_kurtuldu"

      - id: "kefe_kesra_kurtuldu"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra'yı kolundan tutup kefeden çektiğinde Ondalıkçı terazisini sana çeviriyor, ama göğsündeki unvanı okuyunca indiriyor. Kefe sıradakinin önünde iniyor.", en: "You grab Kesra by the arm and haul her off the pan. The Tithe-Taker turns its scales toward you, reads the title on your chest and lowers them. The pan sinks in front of the next one in line." }
          - { tr: "Kesra teşekkür etmiyor. \"Beni kurtardın,\" diyor, \"onu da seçtirdin. Bizim dilimizde bunun bir adı var. Sizinkinde de vardır herhalde.\"", en: "Kesra doesn't thank you. \"You saved me,\" she says, \"and you got him picked instead. We have a word for that in our language. I bet you've got one in yours.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Sessizce uzaklaş", en: "Walk away without a word" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Kurtardığın isyancının yüzüne bakamadan {yer:pirinc_kervan|den} ayrıldın.", en: "You left {yer:pirinc_kervan} unable to look the rebel you'd saved in the face." }
            sonraki: "@akis"

      - id: "kefe_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Zincirler boynuna dolanıyor, makine seni kendi dişlilerinin arasına çekiyor. Bilincin kararırken binlerce imzanın sesini duyuyorsun: [Borç, borçlunun ölümüyle kapanmaz.]", en: "The chains loop your neck and the machine hauls you in between its own gears. As you black out, you hear the voice of a thousand signatures: [The debt does not close with the debtor's death.]" }
          - { tr: "Kendine geldiğinde kıç güvertesinde yatıyorsun. Kesra yanında; yüzü isten kapkara, kolları kan içinde. Kırk kişiden geriye on bir kişi kalmış.", en: "When you come to, you're on the stern deck. Kesra's beside you, face black with soot, arms bloody. Out of forty, eleven are left." }
          - { tr: "\"Denedik,\" diyor. \"Senet hâlâ yerinde, biz de hâlâ buradayız. Bu da bir şeydir.\" Bu kez gülümsemiyor.", en: "\"We tried,\" she says. \"The treaty's still there. We're still here. That's something.\" She doesn't smile this time." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; ölüleri say", en: "Get up. Count the dead" }
            etkiler:
              - bayrak: "kervan_isyan_basarisiz"
              - gorev: { cok_evren_kervan: basarisiz }
              - ahlak: { insanlik: 2, merhamet: 1 }
              - can: 60
            kronik: { tr: "{yer:pirinc_kervan|in} isyanı Mühürdar'ın önünde kırıldı; kırk isyancıdan yalnız on biri sağ kaldı.", en: "The Brass Caravan's uprising broke against the Sealwarden. Eleven of forty rebels lived." }
            sonraki: "@akis"

      - id: "kefe_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Dişlilerin arasından geri kayıyorsun. Mühürdar peşine düşmüyor, zincirlerini isyancılara çeviriyor.", en: "You slip back out between the gears. The Sealwarden doesn't chase you. It turns its chains on the rebels instead." }
          - { tr: "Kalbin kapısı arkandan kapanıyor. İçeriden uzun süre metalin metale çarptığını duyuyorsun.", en: "The door to the heart slams shut behind you. For a long time, from the other side, comes the sound of metal hitting metal." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıdan uzaklaş", en: "Get away from the door" }
            etkiler:
              - bayrak: "kervan_isyan_basarisiz"
              - gorev: { cok_evren_kervan: basarisiz }
              - ahlak: { merhamet: -5 }
            kronik: { tr: "Mühürdar'ın önünden kaçtın ve kalbin kapısı arkanda, isyancıların üstüne kapandı.", en: "You ran from the Sealwarden, and the door to the heart closed on the rebels." }
            sonraki: "@akis"

      - id: "kefe_ayril"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra bunu bekliyormuş gibi başını sallıyor. \"Senin dünyan, senin savaşın,\" diyor. \"Bizimki de bizim.\"", en: "Kesra nods, like she saw it coming. \"Your world, your war,\" she says. \"Ours is ours.\"" }
          - { tr: "Pirinç kapıya doğru yürürken arkanda kıç güvertelerinin ışıkları birer birer sönüyor. Bu gece bir şey olacak ve sen orada olmayacaksın.", en: "As you walk toward the brass door, the lights on the stern decks go out behind you one by one. Something's going to happen tonight, and you won't be there for it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıdan geç", en: "Go through the door" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "{yer:pirinc_kervan|in} kaderini kendi halkına bırakıp o gece kapıdan geçtin.", en: "You left {yer:pirinc_kervan|pos} fate to its own people and walked out through the door that night." }
            sonraki: "@akis"

  # ================================================================== YEDİ TAHT (Kadim sarayı · Yükseliş'in aynası)
  - id: "taht_kabul_salonu"
    konum: ["yedi_taht"]
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "yedi_taht_davet", bayrak_yok: "taht_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "taht", "kadimler", "siyaset"]
    gerilim: 3
    kart: { tr: "Kabul Salonu", en: "The Hall of Reception" }
    sahne: "salon_1"
    sahneler:
      - id: "salon_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Davet mektubu avucunda ısınarak seni Kule'nin ellinci katına, mühürlü kapının önüne çağırıyor. Bu kez mühür avucunu değil mektubu okuyor ve kapı açılıyor.", en: "The invitation warms in your palm and pulls you to the Spire's fiftieth floor, to the sealed door. This time the seal doesn't read your hand. It reads the letter, and it opens." }
          - { tr: "Öbür yanda bir saray var; ama inşa edilmemiş, yetiştirilmiş. Duvarları hasat edilmiş bir ayın kabuğundan, sütunları yıldız ışığı kadar soğuk bir taştan. Zemini de camdan.", en: "On the other side is a palace, except nobody built it. It was grown. The walls are the crust of a harvested moon, the pillars a stone as cold as starlight. And the floor is glass." }
          - { tr: "Cam değil bu, pencere. Ayaklarının altına milyonlarca Sistem penceresi yan yana döşenmiş ve her biri son bildirimini hâlâ gösteriyor. Hasat edilmiş dünyaların son satırlarının üstünde yürüyorsun.", en: "Not glass. Windows. Millions of System windows laid side by side under your feet, every one still showing its final notification. You're walking on the last lines of harvested worlds." }
          - metin: { tr: "Pencerelerden biri tanıdık: Nehha harfleri, altında dört yüz on dokuz. Oru-Venn'in seviyesi burada bir döşeme taşına dönmüş.", en: "One of the windows is familiar. Nehha letters, and under them, four hundred and nineteen. Oru-Venn's level ended up as a floor tile here." }
            kosul: { bayrak: "batik_fener_goruldu" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YEDİ TAHT · Konuk kaydı]", en: "[SEVENFOLD COURT · Guest registry]" }
            satirlar:
              - { tr: "Konuğun karşılanmasına karar verildi.", en: "It has been decided that the guest shall be received." }
              - { tr: "Konuğun ne zaman ayrılacağına henüz karar verilmedi.", en: "It has not yet been decided when the guest shall leave." }
        sezgiler:
          - kosul: { stat: { per: 140 } }
            metin: { tr: "Salonun kenarlarındaki heykellerin hepsi nefes alıyor. Bunlar muhafız: eklemleri yanlış yerlerden bükülen, derilerinin altında yıldızlar taşıyan uzun boylu varlıklar.", en: "Every statue along the edges of the hall is breathing. Guards: tall things with joints bending the wrong way and stars moving under their skin." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burası... burayı tanıyorum. ya da bilmemem gereken bir şeyi biliyorum. lütfen beni onlara gösterme.", en: "this place. i know this place. or i know something i'm not supposed to. please don't show me to them." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Tanrıların oturma odası. Yerlere de bizim gibileri döşemişler. Sakin ol, bak ben de sakinim. Sayılır.\"", en: "\"The gods' living room. And they tiled the floor with people like us. Stay calm. I'm calm. Mostly.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Aşağı bakma. Ben baktım. Sakın aşağı bakma.\"", en: "\"Don't look down. I did. Don't look down.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Pencerelerin üstünden salonun ortasına yürü", en: "Walk across the windows to the center of the hall" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - gorev: { cok_evren_taht: basla }
              - ahlak: { duzen: 1 }
            sonraki: "salon_karsilama"
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Zemindeki pencereleri adım adım oku", en: "Read the floor windows, step by step" }
            gerekli: { stat: { int: 190 } }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - gorev: { cok_evren_taht: basla }
              - bilgi: "ondalik_gercegi"
              - xp_seviye: 15
              - ahlak: { insanlik: 3 }
            sonraki: "salon_zemin"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Yalnızca görünen seviyeni göster; gerisini sakla", en: "Show only your visible level. Hide the rest" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - bayrak: "taht_hafife_alindi"
              - gorev: { cok_evren_taht: basla }
              - gizle: 8
            sonraki: "salon_karsilama"

      - id: "salon_zemin"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Pencereler bir kitabın sayfaları gibi ayaklarının altından akıp gidiyor: Nehhalar, Tavvarlar, adını hiç duymadığın başka ırklar. Hepsinin son satırı aynı: [Toplandı.]", en: "The windows scroll under your feet like pages of a book. Nehha, Tavvari, races you've never even heard of. Every one ends on the same line: [Collected.]" }
          - { tr: "Salonun ortasına vardığında son pencerede bir Tavvar adı okuyorsun: bir çocuk, onda birlerden biri. Altında Kadim yazısıyla bir not var: [Yıldız olarak işlendi. Taşıyan: İkinci Taht.]", en: "When you reach the middle of the hall, the last window shows a Tavvari name: a kid, a tithe. Under it, a note in Ancient script: [Processed as star. Bearer: the Second Throne.]" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Başını kaldır; karşılayıcıya bak", en: "Look up. Face whoever's greeting you" }
            sonraki: "salon_karsilama"

      - id: "salon_karsilama"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Salonun ortasında biri seni bekliyor: uzun, ince, eklemleri yanlış yerlerden bükülen bir Kadim. Derisinin altında bir dünyanın takımyıldızları ağır ağır dönüyor. Yüzü var ama ifadesi yok; maskeye değil, bir ölçü aletine benziyor.", en: "Someone's waiting for you in the middle of the hall. A tall, thin Ancient, joints bending the wrong way, a whole world's constellations turning slowly under its skin. It has a face but no expression. Not like a mask. Like a measuring instrument." }
          - { tr: "\"Ben {npc:ulvenne},\" diyor. \"İkinci Taht'ın Nazırı. Buraya getirilmene karar verildi. Ne olduğuna da yakında karar verilecek.\"", en: "\"I am {npc:ulvenne},\" it says. \"Chamberlain of the Second Throne. It was decided that you would be brought here. What you are will be decided soon.\"" }
          - metin: { tr: "\"Elçimizin raporları senden önce geldi,\" diye ekliyor {npc:ulvenne}. \"{npc:thessar} senin için 'ilginç' dedi. Bin yıldır bu sözcüğü kullanmamıştı.\"", en: "\"Our envoy's reports preceded you,\" {npc:ulvenne} adds. \"{npc:thessar} described you as 'interesting.' He had not used that word in a thousand years.\"" }
            kosul: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "\"Elçimiz bize ihanet etti,\" diyor {npc:ulvenne}; sesinde hiçbir şey yok. \"{npc:thessar}. Senin dünyanda. Salonun yarısının bugün seni öldürmeyi oylaması bu yüzden.\"", en: "\"Our envoy betrayed us,\" {npc:ulvenne} says, with nothing at all in its voice. \"{npc:thessar}. On your world. Which is why half this hall is voting today on whether to kill you.\"" }
            kosul: { bayrak: "ihanet_thessar" }
          - metin: { tr: "{npc:ulvenne} seni şöyle bir süzüyor ve yalnızca görünen seviyeni görüyor. \"Bu mu?\" diye soruyor salona. Arkadaki muhafızlardan biri bir ses çıkarıyor; Kadim dilinde bunun gülmek olduğunu tahmin ediyorsun.", en: "{npc:ulvenne} gives you a once-over and only sees your visible level. \"This?\" it asks the hall. One of the guards in the back makes a noise. In the Ancient language, you guess that's a laugh." }
            kosul: { bayrak: "taht_hafife_alindi" }
        secenekler:
          - id: "egil"
            etiket: { tr: "Protokole uy; başını eğ", en: "Follow protocol. Bow your head" }
            etkiler:
              - bayrak: "taht_egildi"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { kadimler: 5 }
            sonraki: "salon_inceleme"
          - id: "dik"
            etiket: { tr: "Dik dur; kimseye eğilmezsin", en: "Stand straight. You don't bow to anyone" }
            etkiler:
              - bayrak: "taht_egilmedi"
              - ahlak: { insanlik: 3, duzen: -1 }
              - dikkat: 3
              - itibar: { kadimler: -3 }
            sonraki: "salon_inceleme"
          - id: "ezici"
            tur: "gosteris"
            etiket: { tr: "Gerçek seviyeni bir an salona aç", en: "Flash your real level at the whole hall" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bayrak: "taht_egilmedi"
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: -3, insanlik: -2 }
              - itibar: { kadimler: 2 }
            sonraki: "salon_aciga"

      - id: "salon_aciga"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Penceren bir anlığına bütün salona açılıyor. Muhafızların derisindeki yıldızlar hep birden dağılıyor; bir an kendi bedenlerini tanıyamıyorlar.", en: "For one second your window opens up to the entire hall. The stars under the guards' skin scatter all at once. For a beat they don't recognize their own bodies." }
          - { tr: "{npc:ulvenne} kıpırdamıyor, ama ölçü aletini andıran yüzünde ilk kez bir çizgi beliriyor. \"Ah,\" diyor. \"Demek raporlar abartmamış. Bu çok uygunsuz.\"", en: "{npc:ulvenne} doesn't move. But on that measuring-instrument face, for the first time, a line appears. \"Ah,\" it says. \"So the reports did not exaggerate. This is very improper.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Pencereni kapat ve bekle", en: "Close your window and wait" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "salon_inceleme"

      - id: "salon_inceleme"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Kadim bir âlim yaklaşıp izin bile istemeden uzun parmaklarını pencerenin kenarına koyuyor. Seviyeni, kademeni, büyüme hızını okudukça her satırda biraz daha yavaşlıyor.", en: "An Ancient scholar comes over and sets its long fingers on the edge of your window without asking. It reads your level, your Grade, your growth rate, and it slows down a little more with every line." }
          - { tr: "\"Hasat edilmemiş bir türden,\" diye mırıldanıyor. \"Hem de tek bir yılda. Ya bir hata ya bir tohum. Tohumsa dikmek isteriz, hataysa budamak.\"", en: "\"From an unharvested species,\" it murmurs. \"In a single year. Either an error or a seed. If it is a seed, we would like to plant it. If it is an error, to prune it.\"" }
          - { tr: "Parmakları satırların arasında bir şeye takılıyor: pencerene ait olmayan, titreyen bir şeye.", en: "Its fingers snag on something between the lines: something flickering that isn't part of your window." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "{npc:yanki} kendini saklasın", en: "Let {npc:yanki} hide itself" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "taht_yanki_gizli"
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "salon_ziyafet"
          - id: "goster"
            etiket: { tr: "Bıraksın görsün; ne olduğunu söylesinler", en: "Let it look. Let them tell you what it is" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - dikkat: 5
              - iliski: { yanki: { guven: -8, korku: 6 } }
            sonraki: "salon_artik"
          - id: "cek"
            etiket: { tr: "Parmaklarını pencerenden çek", en: "Pull its fingers off your window" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - itibar: { kadimler: -2 }
            sonraki: "salon_ziyafet"

      - id: "salon_artik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Âlim titreyen şeyi parmaklarının arasında tutup uzun uzun bakıyor. \"Bir artık,\" diyor sonunda salona. \"Eski bir şeyden kopmuş. Bunları yakarız.\"", en: "The scholar holds the flickering thing between its fingers and stares at it a long time. \"A remnant,\" it finally tells the hall. \"Broken off something old. We burn these.\"" }
          - { tr: "{npc:ulvenne} elini kaldırıyor. \"Konuk kaydında,\" diyor. \"Henüz değil.\" Âlim parmaklarını çekiyor; {npc:yanki} pencerenin en dibinde, bir köşeye büzülmüş.", en: "{npc:ulvenne} raises a hand. \"It is on the guest registry,\" it says. \"Not yet.\" The scholar lets go, and {npc:yanki} has curled up in the very bottom corner of your window." }
          - { tr: "{npc:yanki}: beni yakmak istediler. sen de bakmalarına izin verdin. bunu hatırlayacağım. kızgın değilim, yalnızca hatırlayacağım.", en: "{npc:yanki}: they wanted to burn me. you let them look. i'll remember that. i'm not angry. i'll just remember." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ziyafete geç", en: "Move on to the feast" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
            sonraki: "salon_ziyafet"

      - id: "salon_ziyafet"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ziyafet sofrası uzun ve boş, çünkü Kadimler yemek yemez, yalnızca içer. Önüne bir kadeh konuyor; içindeki sıvı ışık gibi, ılık ve hafif hafif titreşiyor.", en: "The banquet table is long and empty. The Ancients don't eat. They only drink. A goblet is set down in front of you; the liquid inside is like light, warm and faintly humming." }
          - { tr: "\"Ondalık şarabı,\" diyor {npc:ulvenne}. \"Bağlı Katmanlardan gelir. Bir konuğa sunulabilecek en büyük onurdur.\"", en: "\"Tithe wine,\" {npc:ulvenne} says. \"From the bonded Layers. The highest honor that can be offered to a guest.\"" }
          - metin: { tr: "Kadehin dibinde, ışığın arasında minicik bir pirinç pul parlıyor. Üstünde tek bir hece: Ninu.", en: "At the bottom of the goblet, in the light, a tiny brass chit glints. One syllable on it. Ninu." }
            kosul: { bayrak: "ninu_teslim" }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Kadehteki şey sıvı değil, seviye: birinin sağılmış birkaç yılı. İçersen bir parçası senin olur.", en: "What's in the goblet isn't liquid. It's level. A few years of somebody's life, milked. Drink it and a piece of them becomes yours." }
        secenekler:
          - id: "ic"
            etiket: { tr: "Kadehi kaldır ve iç", en: "Raise the goblet and drink" }
            etkiler:
              - bayrak: "taht_ondalik_icildi"
              - ahlak: { insanlik: -5, merhamet: -2 }
              - itibar: { kadimler: 6 }
              - stat: { wil: 5 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Kabul Salonu'ndaki kadehten sonra {npc:ulvenne} seni bir sonraki salona çağırıyor.", en: "After the cup in the Reception Hall, {npc:ulvenne} is calling you into the next room." } }
            sonraki: "salon_son"
          - id: "dok"
            etiket: { tr: "Kadehi pencereli zemine boşalt", en: "Pour it out onto the window floor" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -3 }
              - itibar: { kadimler: -6 }
              - dikkat: 3
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Kabul Salonu'ndaki kadehten sonra {npc:ulvenne} seni bir sonraki salona çağırıyor.", en: "After the cup in the Reception Hall, {npc:ulvenne} is calling you into the next room." } }
            sonraki: "salon_son"
          - id: "kaldir"
            tur: "gosteris"
            etiket: { tr: "Kadehi kaldır, içme; salonu güldür", en: "Raise the goblet, don't drink. Make the hall laugh" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Kabul Salonu'ndaki kadehten sonra {npc:ulvenne} seni bir sonraki salona çağırıyor.", en: "After the cup in the Reception Hall, {npc:ulvenne} is calling you into the next room." } }
            sonraki: "salon_kahkaha"

      - id: "salon_kahkaha"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Kadehi kaldırıp âlimden duyduğun tek Kadim sözcüğüyle bir şerefe sözü söylüyorsun: \"Uygunsuzluğa.\"", en: "You raise the goblet and make a toast in the Ancient language, using the one word you picked up from the scholar: \"To impropriety.\"" }
          - { tr: "Bir an hiçbir şey olmuyor. Derken salonun dört bir yanından o tuhaf, eklemsiz ses yükseliyor: Kadimler gülüyor. Bin yıldır kimse onları güldürmemiş gibi beceriksizce.", en: "Nothing for a second. Then that weird, jointless sound goes up from every corner of the hall. The Ancients are laughing. Awkwardly, like nobody's made them laugh in a thousand years." }
          - { tr: "Kadehi el sürmeden bırakıyorsun ve kimse fark etmiyor. Ya da herkes fark ediyor ve bunu da uygunsuzluktan sayıyor.", en: "You set the goblet down untouched, and nobody notices. Or everybody notices, and counts that as impropriety too." }
        secenekler:
          - id: "devam"
            etiket: { tr: "{npc:ulvenne|in} yanına geç", en: "Go stand beside {npc:ulvenne}" }
            sonraki: "salon_son"

      - id: "salon_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ziyafetin sonunda {npc:ulvenne} uzun boynunu yanlış yerden bükerek sana eğiliyor. \"Sana yedinci koltuğun gösterilmesine karar verildi,\" diye fısıldıyor. \"Kimin kararıyla olduğuna henüz karar verilmedi.\"", en: "At the end of the feast, {npc:ulvenne} leans down beside you, long neck bending in the wrong place. \"It has been decided that you will be shown the seventh seat,\" it whispers. \"It has not yet been decided on whose authority.\"" }
          - { tr: "Salonun öbür ucundan biri seni izliyor. Derisinin altında üç ayrı dünyanın yıldızları dönüyor, dördüncüsü için de boş bir yer bırakılmış.", en: "At the far end of the hall, someone is watching you. Three separate worlds' worth of stars turn under its skin, and there's an empty space left for a fourth." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Bakışına karşılık ver", en: "Stare right back" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: 2
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "{npc:ulvenne|e} onun kim olduğunu sor", en: "Ask {npc:ulvenne} who that is" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "salon_varis"

      - id: "salon_varis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "\"{npc:ossiran},\" diyor {npc:ulvenne}. \"Yedinci Taht'ın varisi; kendini öyle ilan etti. Üç dünya hasat etti, dördüncüsü için de seninkini seçti.\"", en: "\"{npc:ossiran},\" {npc:ulvenne} says. \"Heir to the Seventh Throne, by his own declaration. He has harvested three worlds. For the fourth, he has chosen yours.\"" }
          - { tr: "\"Bazılarımız onun o koltuğa oturmasını istemiyor,\" diye ekliyor; hiçbir şey söylemiyormuş gibi. \"Bir koltuğun ikinci bir talibi olunca iş çok daha ilginçleşir.\"", en: "\"Some of us would prefer he did not take the seat,\" it adds, like it's not saying anything at all. \"A seat becomes much more interesting when it has a second claimant.\"" }
        secenekler:
          - id: "anla"
            etiket: { tr: "Ne demek istediğini anladım", en: "I get what you're saying" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bilgi: "yedinci_taht_sirri"
            sonraki: "@akis"

  # ------------------------------------------------------------------ YEDİNCİ KOLTUK (önemli)
  - id: "taht_yedinci_koltuk"
    konum: ["yedi_taht"]
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "taht_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "taht", "kadimler", "ahlak"]
    gerilim: 4
    onemli: true
    kart: { tr: "Yedinci koltuk", en: "The seventh seat" }
    sahne: "koltuk_1"
    sahneler:
      - id: "koltuk_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "{npc:ulvenne} seni {yer:yedi_taht|in} kalbine, taht salonuna götürüyor. Yarım ay biçiminde dizilmiş yedi koltuğun altısında birer Kadim oturuyor; her biri bir Hane'nin Sesi. Yedincisi boş.", en: "{npc:ulvenne} leads you into the heart of {yer:yedi_taht}: the throne room. Seven seats stand in a half-moon. On six sit Ancients, each one the Voice of a House. The seventh is empty." }
          - { tr: "Boş koltuk ötekilere benzemiyor. Taştan değil, üst üste örülmüş binlerce ince, saydam pencereden yapılmış ve içinde bir şey bekliyor: bir dünya büyüklüğünde bir boşluk.", en: "The empty seat isn't like the others. It isn't stone. It's woven from thousands of thin, clear windows layered one over another, and something inside it is waiting: an emptiness the size of a world." }
          - { tr: "\"Yedinci koltuk bin yıldır boş,\" diyor {npc:ulvenne}. \"Bir dünyayı tek başına hasat edene verilir. Gün 365'te dünyanın hasadı kimin adına yazılırsa koltuk onun olacak. Bunun bir Kadim olması gerekmiyor.\"", en: "\"The seventh seat has been empty for a thousand years,\" {npc:ulvenne} says. \"It goes to whoever harvests a world single-handed. On Day 365, whoever your world's harvest is credited to will have it. That does not have to be an Ancient.\"" }
          - { tr: "Altı Ses aynı anda sana dönüyor. Odanın öbür ucunda {npc:ossiran} gülümsüyor; derisinde dördüncü dünyaya ayırdığı karanlık nabız gibi atıyor.", en: "All six Voices look at you at once. Across the room {npc:ossiran} is smiling, and the dark he's saved in his skin for a fourth world is throbbing like a pulse." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YEDİNCİ TAHT · talip kaydı]", en: "[SEVENTH THRONE · claimant registry]" }
            satirlar:
              - { tr: "Talip 1: {npc:ossiran} (Kadim). Hedef: Dünya Katmanı.", en: "Claimant 1: {npc:ossiran} (Ancient). Target: Earth Layer." }
              - { tr: "Talip 2: kayıt bekliyor.", en: "Claimant 2: pending registration." }
        sezgiler:
          - kosul: { stat: { wis: 160 } }
            metin: { tr: "Koltuğun içindeki boşluk senin dünyanın biçiminde: kıyı çizgileri, dağlar, {yer:kiyikent|in} körfezi. Biri onu çoktan ölçüp biçmiş.", en: "The emptiness inside the seat is shaped like your world. Coastlines, mountains, the bay at {yer:kiyikent}. Somebody's already measured it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ona oturma. ya da otur, bilmiyorum. ama oturursan sende kendime yer bulamayabilirim. oraya koca bir dünya sığar, bense çok küçüğüm.", en: "don't sit in it. or do, i don't know. but if you sit, i might not find room in you anymore. a whole world fits in there, and i'm very small." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bak bana. Hayır, ona değil, bana bak. Tanrı olmak istediğini söyle, şimdi çeker giderim. Söyleme.\"", en: "\"Look at me. No, at me, not at that. Tell me you want to be a god and I'll walk out right now. Don't say it.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir dünyaya karşılık bir koltuk. Ben bile bu kadar gözü doymaz değilim. Herhalde.\"", en: "\"One world for one chair. Even I'm not that hungry. I think.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir koltuk değil, arayüz. Doğrudan Sistem'e bağlı. Oturursan bir daha kalkamayabilirsin.\"", en: "\"That's not a chair, it's an interface. Wired straight into the System. Sit down and there might be no getting up.\"" }
        secenekler:
          - id: "otur"
            etiket: { tr: "Koltuğa yürü ve otur", en: "Walk to the seat and sit" }
            etkiler:
              - bolge: "yedi_taht"
              - ahlak: { insanlik: -6 }
              - dikkat: 5
            kronik: { tr: "{yer:yedi_taht|in} boş koltuğuna oturdun ve bir dünyanın ağırlığını üstünde hissettin.", en: "You sat in the empty seat of {yer:yedi_taht} and felt a world's weight settle on you." }
            sonraki: "koltuk_otur"
          - id: "red"
            etiket: { tr: "Koltuğa sırtını dön", en: "Turn your back on the seat" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_reddedildi"
              - unvan: "taht_reddeden"
              - ahlak: { insanlik: 8, duzen: -2 }
              - itibar: { kadimler: -5 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "Kadimler sana bir tanrının koltuğunu gösterdi ve sen ona sırtını döndün.", en: "The Ancients showed you a god's seat, and you turned your back on it." }
            sonraki: "koltuk_red"
          - id: "pazarlik"
            etiket: { tr: "Koltuğu değil, dünyamı istiyorum; pazarlık et", en: "I don't want the seat. I want my world. Deal" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_ittifak"
              - ahlak: { duzen: 6, insanlik: -2 }
              - itibar: { kadimler: 10 }
              - degisken: { kadim_tehdit: 4 }
            kronik: { tr: "{yer:yedi_taht|in} siyasetine girdin ve dünyanı korumak için Kadimler'le pazarlık masasına oturdun.", en: "You stepped into the politics of {yer:yedi_taht} and sat down at the Ancients' bargaining table to protect your world." }
            sonraki: "koltuk_pazarlik"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Koltuğun kolunu kopar ve {npc:ossiran|e} fırlat", en: "Rip off the seat's armrest. Throw it at {npc:ossiran}" }
            gerekli: { stat: { str: 230 } }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_reddedildi"
              - unvan: "taht_reddeden"
              - aciga_vur: true
              - dikkat: 10
              - ahlak: { duzen: -8, insanlik: 4 }
              - itibar: { kadimler: -10 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 0, max: 1 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "{yer:yedi_taht|in} bin yıllık boş koltuğunu kırıp parçasını talibinin yüzüne fırlattın.", en: "You broke {yer:yedi_taht|pos} thousand-year-old empty seat and threw a piece of it in its claimant's face." }
            sonraki: "koltuk_kirildi"

      - id: "koltuk_otur"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Oturduğun an koltuk açılıyor; ama açılan içindeki boşluk değil, sensin. Hayatta kalan her insanın penceresi önünde birden yanıyor. Her biri bir insan, her biri bir seviye ve hepsi rüzgâra yatan başaklar gibi sana doğru eğilmiş.", en: "The moment you sit, the seat opens. Not the emptiness inside it. You. The window of every human still alive lights up in front of you at once, every one a person, every one a level, every one leaning toward you like wheat bending in the wind." }
          - { tr: "Tek bir düşünce yeter: hepsi akar ve sen bir tanrı olursun. Bunun ne kadar kolay olacağını bütün açıklığıyla hissediyorsun; gördüğün en korkunç şey de bu kolaylık.", en: "One thought would do it. All of it would flow in, and you'd be a god. You can feel exactly how easy it would be, and that easiness is the most horrifying thing you've ever seen." }
          - { tr: "Pencerelerin arasında tanıdıklar da var: {yer:kiyikent|den} insanlar, seninle Öğretici'den çıkanlar.", en: "Some of the windows are familiar. People from {yer:kiyikent}. People who walked out of the Tutorial with you." }
          - metin: { tr: "Pencerelerden biri ötekilerden parlak ve sana eğilmiyor; tam tersine, geri çekiliyor. {npc:deniz_arman}.", en: "One window is brighter than the rest, and it doesn't lean toward you. It pulls away. {npc:deniz_arman}." }
            kosul: { npc_hayatta: "deniz_arman" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[Unvan: Yedinci Koltukta Oturan]", en: "[Title: Who Sat the Seventh Seat]" }
            satirlar:
              - { tr: "Talip 2: kaydedildi.", en: "Claimant 2: registered." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Biraz daha otur; başakları hisset", en: "Sit a while longer. Feel the wheat lean" }
            etkiler:
              - bayrak: "taht_koltuga_oturdu"
              - bayrak: "taht_talip"
              - unvan: "yedinci_koltuk"
              - ahlak: { insanlik: -15, merhamet: -4 }
              - dikkat: 10
              - itibar: { yukselenler: 8, kadimler: 4 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 2 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "Yedinci koltukta, hayatta kalan bütün insanlığın sana eğildiğini hissedecek kadar uzun oturdun. {yer:yedi_taht} da seni Dünya'nın hasadına ikinci talip olarak yazdı.", en: "You sat in the seventh seat long enough to feel every human left alive lean toward you. The Sevenfold Court wrote you down as the second claimant to Earth's harvest." }
            sonraki: "koltuk_kalkis"
          - id: "kalk"
            etiket: { tr: "Kalk. Hemen", en: "Get up. Now" }
            etkiler:
              - bayrak: "taht_koltuga_oturdu"
              - unvan: "yedinci_koltuk"
              - ahlak: { insanlik: 6 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "Yedinci koltuğa oturdun, tanrı olmanın ne kadar kolay olduğunu görünce de hemen kalktın.", en: "You sat in the seventh seat, saw how easy it would be to become a god, and got up immediately." }
            sonraki: "koltuk_kalkis"

      - id: "koltuk_kalkis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ayağa kalktığında dizlerin titriyor. O pencerelerin hepsi sönüyor, ama içinde bir yerde hâlâ sana eğiliyorlar.", en: "When you stand, your knees are shaking. All those windows go dark, but somewhere inside you they're still leaning." }
          - { tr: "{npc:ossiran} salonun öbür ucundan sana doğru yürüyor; gülümsemesi silinmiş. \"Hasat,\" diyor ağır ağır, \"hasatçısının koltuğuna oturmaz.\"", en: "{npc:ossiran} is crossing the room toward you. The smile is gone. \"A crop,\" he says slowly, \"does not sit in its harvester's chair.\"" }
        secenekler:
          - id: "cevap"
            etiket: { tr: "O zaman gel ve kaldır beni", en: "Then come get me out of it" }
            etkiler:
              - ahlak: { duzen: -3 }
              - dikkat: 3
            kronik: { tr: "{yer:yedi_taht|in} varisine meydan okudun.", en: "You challenged the heir of {yer:yedi_taht}." }
            sonraki: "koltuk_son"
          - id: "sus"
            etiket: { tr: "Bir şey söyleme; yanından geç", en: "Say nothing. Walk past him" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "{yer:yedi_taht|in} varisinin yanından tek kelime etmeden geçtin.", en: "You walked past the heir of {yer:yedi_taht} without a word." }
            sonraki: "koltuk_son"

      - id: "koltuk_red"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Koltuğa sırtını dönüyorsun. Taht salonunda bin yıldır duyulmamış bir ses yükseliyor: altı Ses aynı anda nefesini içine çekiyor.", en: "You turn your back on the seat. A sound nobody's heard in this throne room for a thousand years goes up: six Voices inhaling at the same time." }
          - { tr: "\"Hiçbir ölümlü,\" diyor {npc:ulvenne} ve sesinde ilk kez bir şey var, \"bunu bize yapmamıştı.\"", en: "\"No mortal,\" {npc:ulvenne} says, and for the first time there's something in its voice, \"has ever done that to us.\"" }
          - { tr: "{npc:ossiran} bir kahkaha patlatıyor. \"O hâlde koltuk benim,\" diyor. \"Dünyan da.\"", en: "{npc:ossiran} laughs. \"Then the seat is mine,\" he says. \"And so is your world.\"" }
        secenekler:
          - id: "hayir"
            etiket: { tr: "Ne koltuk ne dünya", en: "Neither one" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - dikkat: 3
            kronik: { tr: "Yedinci koltuğu reddettin ve onu isteyen Kadim'e dünyanın da onun olmayacağını söyledin.", en: "You refused the seventh seat and told the Ancient who wanted it that your world wouldn't be his either." }
            sonraki: "koltuk_son"

      - id: "koltuk_kirildi"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Koltuğun kolu, bin pencereden örülmüş o saydam kol, buz sarkıtı gibi kopuyor. Fırlattığın parça {npc:ossiran|in} göğsünde, derisinin altındaki karanlık boşluğun tam ortasında paramparça oluyor.", en: "The seat's armrest, that clear arm woven from a thousand windows, snaps off like an icicle. You throw it, and it shatters dead center on {npc:ossiran|pos} chest, right in the dark hollow under his skin." }
          - { tr: "Altı Ses kıpırdamıyor, ama altısının da derisindeki yıldızlar bir an titriyor: bin yıllık bir hesap salonun ortasında yanlış sonuç vermiş.", en: "None of the six Voices move. But the stars under all six skins shiver for a second. A thousand-year calculation just came out wrong, right in the middle of the room." }
          - { tr: "{npc:ossiran} göğsündeki cam tozunu silkeliyor. \"Yarın,\" diyor. \"Hüküm salonunda, altı tahtın önünde.\"", en: "{npc:ossiran} brushes the glass dust off his chest. \"Tomorrow,\" he says. \"In the Hall of Decree. Before all six thrones.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Yarın", en: "Tomorrow" }
            etkiler:
              - ahlak: { duzen: -2 }
            kronik: { tr: "{yer:yedi_taht|in} varisinin düello davetini tek kelimeyle kabul ettin.", en: "You accepted {yer:yedi_taht} heir's challenge with one word." }
            sonraki: "koltuk_son"

      - id: "koltuk_pazarlik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Altı Ses birbirine bakıyor. Derken Beşinci Taht'ın Sesi, çocuk boyunda ve bin yaşında bir Kadim, söz alıyor: \"Hasat pazarlık etmez. Ama talip eder.\"", en: "The six Voices look at each other. Then the Voice of the Fifth Throne, an Ancient the size of a child and a thousand years old, speaks: \"A crop does not bargain. But a claimant does.\"" }
          - { tr: "{npc:ulvenne} teklifi açıklıyor: {npc:ossiran|i} yenersen Dünya'nın hasadı bu döngüde 'talipsiz' kalacak. Kadimler yine gelecek, ama bir Kadim'in koltuğu için değil, bir anlaşma için.", en: "{npc:ulvenne} spells out the offer: beat {npc:ossiran}, and Earth's harvest stays 'unclaimed' this cycle. The Ancients will still come. But not for an Ancient's throne. For a treaty." }
          - { tr: "Bir anlaşma; {yer:pirinc_kervan|in} derisine yazılı olanlardan. Bunu kavradığını görüyorlar ve kimse ağzını açmıyor.", en: "A treaty. The kind written on {yer:pirinc_kervan|pos} hide. They can see you realize it, and nobody says a word." }
          - metin: { tr: "\"Elçimiz {npc:thessar} dünyanla masaya oturacak,\" diyor {npc:ulvenne}. \"Bu salon, onun getireceği senedin altında senin imzanı görmek istiyor.\"", en: "\"Our envoy {npc:thessar} will sit down at the table with your world,\" {npc:ulvenne} says. \"This hall would like to see the treaty he brings carry your signature.\"" }
            kosul: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; önce {npc:ossiran}", en: "Accept. {npc:ossiran} first" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 6 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "{yer:yedi_taht|le} anlaştın: sen varisi yenecektin, onlar da karşılığında dünyanın hasadını bir senede çevirecekti.", en: "You cut a deal with {yer:yedi_taht}: you'd beat the heir, and in exchange they'd turn your world's harvest into a treaty." }
            sonraki: "koltuk_son"
          - id: "elci"
            etiket: { tr: "Elçinize söyleyin: imzalayan ben olacağım", en: "Tell your envoy I'll be the one who signs" }
            goster: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -5 }
              - itibar: { kadimler: 8 }
              - iliski: { thessar: { saygi: 6, baglilik: 4 } }
              - degisken: { kadim_tehdit: 5 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "{yer:yedi_taht|e}, dünyanın senedine imzayı senin atacağını bildirdin.", en: "You told {yer:yedi_taht} that you'd be the one to sign your world's treaty." }
            sonraki: "koltuk_son"
          - id: "geri"
            etiket: { tr: "Sözünü geri al; senet yok", en: "Take it back. No treaty" }
            etkiler:
              - bayrak_kaldir: "taht_ittifak"
              - ahlak: { insanlik: 4, duzen: -3 }
              - itibar: { kadimler: -8 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Yedinci koltuğun önünde verdiğin cevap bir hükme dönüştü.", en: "The answer you gave in front of the seventh seat has turned into a ruling." } }
            kronik: { tr: "Bir senedin ne demek olduğunu anladığın an Kadimler'in pazarlık masasından kalktın.", en: "You got up from the Ancients' bargaining table the moment you understood what a treaty meant." }
            sonraki: "koltuk_son"

      - id: "koltuk_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Taht salonundan çıkarken boş koltuk arkanda hafifçe parlıyor; içindeki boşluk hâlâ dünyanın biçiminde.", en: "As you leave the throne room, the empty seat glows faintly behind you, the hollow inside it still shaped like your world." }
          - { tr: "{npc:ulvenne} kapıda seni durduruyor. \"Hüküm salonunda,\" diyor, \"altı taht seyreder ama karışmaz. Bu da bir oydur. Unutma.\"", en: "{npc:ulvenne} stops you at the door. \"In the Hall of Decree,\" it says, \"the six thrones watch, but do not intervene. That is also a vote. Remember that.\"" }
        secenekler:
          - id: "hazir"
            etiket: { tr: "Hazırlan", en: "Get ready" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 30
            kronik: { tr: "{yer:yedi_taht|in} hüküm salonuna hazırlandın.", en: "You got ready for {yer:yedi_taht|pos} Hall of Decree." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Bir gece için dünyana dön", en: "Go home for one night" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            kronik: { tr: "Bir tanrının koltuğunu gördükten sonra bir geceliğine kendi dünyana döndün.", en: "After seeing a god's seat, you went home to your own world for a night." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ UYUYAN TANRILAR
  - id: "taht_uyuyan_tanrilar"
    konum: ["yedi_taht"]
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "taht_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "taht", "kesif", "sir"]
    gerilim: 2
    kart: { tr: "Uyuyan tanrılar bahçesi", en: "Garden of the sleeping gods" }
    sahne: "bahce_1"
    sahneler:
      - id: "bahce_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Sarayın arka yüzünde, hasat edilmiş ayın kabuğunun bittiği yerde bir bahçe uzanıyor. Ne ağaç var ne çiçek; yalnızca dağ büyüklüğünde, kıpırtısız, gözleri açık, derileri yıldızlarla dolu dev Kadimler.", en: "On the back side of the palace, where the harvested moon's crust ends, there's a garden. No trees, no flowers. Just huge, motionless Ancients, big as mountains, eyes open, skin packed with stars." }
          - { tr: "Aralarında ellerinde uzun cam çubuklar taşıyan genç Kadimler dolaşıyor. Çubukları devlerin derisine batırıp ışık çekiyor, çektikleri ışığı da sarayın içine taşıyorlar.", en: "Young Ancients move between them carrying long glass rods. They push the rods into the giants' skin, draw out light, and carry the light back into the palace." }
          - { tr: "Bahçıvanlardan biri seni görünce başını eğiyor. \"Uyuyan tanrılar,\" diyor. \"En yaşlılarımız. Onlara iyi bakarız.\"", en: "One of the gardeners notices you and bows. \"The sleeping gods,\" it says. \"Our eldest. We take good care of them.\"" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Devlerin gözleri açık ama bakmıyorlar. Derilerindeki yıldızlar dönüp duruyor; oysa içlerinde, yıldızların arasında onlara ait hiçbir şey kalmamış.", en: "The giants' eyes are open, but there's no looking in them. The stars in their skin keep turning, but inside, between the stars, there's nothing that belongs to them." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar uyumuyor, bomboşlar. ne kadar çok dünya yutarsan içinde kendine o kadar az yer kalır. bunu bilmen gerekiyordu.", en: "they're not asleep. they're empty. the more worlds you swallow, the less room is left for you. you needed to know that." }
        secenekler:
          - id: "yaklas"
            etiket: { tr: "En yakın devin yanına git", en: "Walk up to the nearest giant" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "bahce_tanri"
          - id: "bahcivan"
            etiket: { tr: "Bahçıvana çektiği ışığı sor", en: "Ask the gardener about the light it draws" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - ahlak: { duzen: 1 }
            sonraki: "bahce_bahcivan"
          - id: "dokun"
            tur: "gosteris"
            etiket: { tr: "Devin derisine dokun; içini oku", en: "Touch the giant's skin. Read what's inside" }
            gerekli: { stat: { wis: 180 } }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - xp_seviye: 20
              - ahlak: { insanlik: 2 }
            sonraki: "bahce_tanri"

      - id: "bahce_bahcivan"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "\"Işık sarayı aydınlatır,\" diyor bahçıvan, bir çocuğa anlatır gibi. \"Tahtları ısıtır, ondalık şarabını tatlandırır. Tanrılar artık onu kullanmıyor; biz kullanıyoruz.\"", en: "\"The light keeps the palace lit,\" the gardener says, like it's explaining to a child. \"It warms the thrones. It sweetens the tithe wine. The gods don't use it anymore. We do.\"" }
          - { tr: "\"Bir gün ben de burada olacağım,\" diye ekliyor gururla. \"Yeterince dünya yuttuğumda. O zaman benden de ışık çekecekler.\"", en: "\"Someday I'll be here too,\" it adds, proudly. \"When I've swallowed enough worlds. And they'll draw light out of me.\"" }
        secenekler:
          - id: "yaklas"
            etiket: { tr: "Devlerden birine yaklaş", en: "Go up to one of the giants" }
            sonraki: "bahce_tanri"

      - id: "bahce_tanri"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Yaklaştıkça devin derisindeki yıldızlar, güneşe dönen bir çiçek gibi ağır ağır ve kendiliğinden sana doğru kayıyor. Bin yıldır hiçbir şeye dönmemişler.", en: "As you get closer, the stars in the giant's skin drift toward you, slow and on their own, like a flower turning toward the sun. They haven't turned toward anything in a thousand years." }
          - { tr: "Devin dudakları kıpırdıyor. Ses yıldızların arasından, bin dünya öteden geliyor: \"Biz de bir zamanlar bir şey olarak kalmak istemiştik.\"", en: "The giant's lips move. The voice comes from between the stars, from a thousand worlds away: \"We too once wished to remain something.\"" }
          - { tr: "\"Sende bir anomali var,\" diyor. \"Hiç dolmayan bir boşluk. Onu kullan. Bitir bunu. Lütfen.\"", en: "\"There is an anomaly in you,\" it says. \"A hollow that does not fill. Use it. End this. Please.\"" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Uyuyan varlık uyarıldı]", en: "[Dormant entity stimulated]" }
            satirlar:
              - { tr: "Bahçe nöbetçileri bilgilendirildi.", en: "Garden wardens have been notified." }
        secenekler:
          - id: "bitir"
            etiket: { tr: "İsteğini yerine getir; onu bitir", en: "Grant what it asks. End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "dinle"
            etiket: { tr: "Yalnızca dinle; anlatsın", en: "Just listen. Let it tell you" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - ahlak: { insanlik: 3 }
            sonraki: "bahce_hikaye"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bunun ne olduğunu sor", en: "Ask {npc:yanki} what this thing is" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - iliski: { yanki: { guven: 5, saygi: 3 } }
              - ahlak: { insanlik: 1 }
            sonraki: "bahce_yanki"

      - id: "bahce_yanki"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "{npc:yanki}: bu bir tanrı. ya da bir tanrının kabuğu. içinde bin dünya var ve hiçbiri o değil.", en: "{npc:yanki}: it's a god. or a god's shell. there are a thousand worlds inside it, and none of them is it." }
          - { tr: "{npc:yanki}: senin dünyanın sonlarından biri buna benziyor: sistemle birleşmek, tanrı olmak. bunu sana söylemem gerekiyordu, değil mi? işte söyledim.", en: "{npc:yanki}: one of your world's endings looks like this. merging with the system. becoming a god. i was supposed to tell you that, right? i told you." }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir", en: "End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "birak"
            etiket: { tr: "Onu olduğu gibi bırak", en: "Leave it the way it is" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            sonraki: "bahce_ayril"

      - id: "bahce_hikaye"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Dev anlatıyor; cümleleri yıldızlardan kurulu, bazıları sönmüş. Bir zamanlar küçük bir halkın kahramanıymış. Halkını kurtarmak için ilk dünyasını hasat etmiş, o yetmeyince ikincisini.", en: "The giant talks, and its sentences are made of stars, some of them burnt out. Once it was the hero of a small people. Then it harvested its first world, to save its own. Then a second, because the first wasn't enough." }
          - { tr: "\"Yüzüncüsünde halkımın adını unuttum,\" diyor. \"Bininci dünyada da kendi adımı. Şimdi bahçıvanlar benden ışık çekiyor, ben de onlara teşekkür ediyorum, çünkü başka hiçbir şey hissetmiyorum.\"", en: "\"By the hundredth, I had forgotten my people's name,\" it says. \"By the thousandth world, my own. Now the gardeners draw light from me, and I thank them, because I feel nothing else.\"" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir", en: "End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "birak"
            etiket: { tr: "Kalk ve git", en: "Get up and go" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "bahce_ayril"

      - id: "bahce_son_isik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Avucunu devin derisine bastırınca içindeki o hiç dolmayan boşluk açılıyor. Bin dünyanın yıldızları devin içinden çıkıp bahçenin göğüne yükseliyor; sönmüyor, yalnızca dağılıyorlar.", en: "You press your palm to the giant's skin, and the hollow in you that never fills opens up. A thousand worlds' stars lift out of the giant and rise into the garden's sky. They don't go out. They just scatter." }
          - { tr: "Dev, kapanan gözleriyle bir şey söylüyor: çok eski, çok kısa bir isim. Kendi adı. Sonra bir dağ gibi susuyor.", en: "With its closing eyes, the giant says something: a name, very old and very short. Its own name. Then it's as quiet as a mountain." }
          - { tr: "Yıldızların bazıları hâlâ avucunun üstünde, sahibini arar gibi titreşiyor.", en: "Some of the stars are still hovering over your palm, quivering like they're looking for an owner." }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Yıldızları göğe bırak", en: "Let the stars go to the sky" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - xp_seviye: 40
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Uyuyan tanrıların bahçesinden döndüğünden beri {yer:yedi_taht} seni bekliyor.", en: "{yer:yedi_taht|b} has been waiting for you since you came back from the garden of sleeping gods." } }
            sonraki: "bahce_ayril"
          - id: "al"
            etiket: { tr: "Kalan yıldızları içine çek", en: "Pull the leftover stars into yourself" }
            etkiler:
              - ahlak: { insanlik: -8 }
              - dikkat: 6
              - stat: { wis: 8, wil: 8 }
              - xp_seviye: 90
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 }, hatirlatma: { tr: "Uyuyan tanrıların bahçesinden döndüğünden beri {yer:yedi_taht} seni bekliyor.", en: "{yer:yedi_taht|b} has been waiting for you since you came back from the garden of sleeping gods." } }
            sonraki: "bahce_ayril"

      - id: "bahce_ayril"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Bahçeden çıkarken bahçıvanlar cam çubuklarını indirip arkandan bakıyor. Bir ölümlünün önünde ilk kez, tanrının aslında ne olduğunu merak ediyorlar.", en: "As you leave the garden, the gardeners lower their glass rods and watch you go. For the first time, in front of a mortal, they're wondering what a god actually is." }
          - metin: { tr: "Arkanda, devin durduğu yerde artık sönmüş bir dağ yükseliyor. Bahçıvanlardan biri ona dokunuyor; ağlamayı bilmediği için yalnızca başını eğiyor.", en: "Behind you, where the giant was, a dead mountain stands. One of the gardeners touches it and, not knowing how to cry, just bows its head." }
            kosul: { bayrak: "uyuyan_tanri_bitirildi" }
        secenekler:
          - id: "dusun"
            etiket: { tr: "Kendi gücünü düşün", en: "Think about your own power" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Uyuyan tanrıların bahçesinden döndüğünden beri {yer:yedi_taht} seni bekliyor.", en: "{yer:yedi_taht|b} has been waiting for you since you came back from the garden of sleeping gods." } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Saraya dön", en: "Head back into the palace" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 4 }, hatirlatma: { tr: "Uyuyan tanrıların bahçesinden döndüğünden beri {yer:yedi_taht} seni bekliyor.", en: "{yer:yedi_taht|b} has been waiting for you since you came back from the garden of sleeping gods." } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ VARİS DÜELLOSU (boss · önemli · tohum)
  - id: "taht_varis_duellosu"
    konum: ["yedi_taht"]
    perde: [3, 4]
    agirlik: 1
    etiketler: ["cok_evren", "taht", "boss", "kadimler"]
    gerilim: 4
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Hüküm salonu", en: "The Hall of Decree" }
    sahne: "varis_1"
    sahneler:
      - id: "varis_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Hüküm salonunun çağrısı pencerende bir mühür olarak beliriyor ve nerede olursan ol seni Kule'nin ellinci katına, oradan da {yer:yedi_taht|e} çekiyor. Salon yuvarlak ve bomboş; tavan yerine yıldızsız bir karanlık var.", en: "The Hall of Decree's summons shows up in your window as a seal, and wherever you are, it pulls you to the Spire's fiftieth floor and from there into {yer:yedi_taht}. The hall is round and empty. No ceiling, just a starless dark." }
          - { tr: "Duvarların yerinde altı taht, altı Ses var. Seyrediyorlar ama karışmayacaklar.", en: "Instead of walls, six thrones, six Voices. Watching. They won't step in." }
          - { tr: "{npc:ossiran} ortada duruyor. Derisinin altında üç dünyanın yıldızları dönüyor; dördüncüye ayrılan boşluk artık senin biçimini almış. \"Hasat,\" diyor, \"hasatçısına meydan okumaz. Bunu sana öğretmek benim için onur olacak.\"", en: "{npc:ossiran} stands in the middle. Three worlds' stars turn under his skin, and the space reserved for the fourth is shaped like you now. \"A crop,\" he says, \"does not challenge its harvester. It will be my honor to teach you that.\"" }
          - metin: { tr: "Altı Ses'ten biri, Beşinci Taht'ınki, sana belli belirsiz başını eğiyor: anlaşmanız hâlâ geçerli.", en: "One of the six Voices, the Fifth Throne's, dips its head at you, just slightly. Your deal still stands." }
            kosul: { bayrak: "taht_ittifak" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[HÜKÜM DÜELLOSU]", en: "[DUEL OF DECREE]" }
            satirlar:
              - { tr: "Talip: {npc:ossiran}. Karşı taraf: kayıtlı ya da değil, fark etmez.", en: "Claimant: {npc:ossiran}. Opponent: registered or not, irrelevant." }
              - { tr: "Sonuç Dünya Katmanı'nın hasat kaydına işlenecek.", en: "The outcome will be entered into Earth Layer's harvest record." }
        sezgiler:
          - kosul: { stat: { per: 170 } }
            metin: { tr: "{npc:ossiran|in} görünen seviyesi tek bir varlığa ait değil, üç dünyanın toplamı. Yıldızları ayıklarsan geriye kalan şaşılacak kadar küçük.", en: "{npc:ossiran|pos} visible level isn't one being's. It's three worlds added together. Take the stars away and what's left underneath is surprisingly small." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onun içindeki üç dünya birbirini sevmiyor. onları biraz karıştırabilirim. ama yaparsam ben de biraz karışırım.", en: "the three worlds inside him don't like each other. i could stir them up a little. but if i do, i get a little stirred up too." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Ben kenarda duracağım, bu senin dövüşün. Ama sen düşersen o kenar fazla dayanmaz.\"", en: "\"I'll be on the sidelines. This one's yours. But if you go down, those sidelines won't last long.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kazan. Sonra da içindekileri alma. Söz ver bana.\"", en: "\"Win. And then don't take what's inside him. Promise me.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ortaya yürü ve dövüş", en: "Walk out to the center and fight" }
            etkiler:
              - bolge: "yedi_taht"
              - ahlak: { duzen: -3, merhamet: 1 }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+8"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "{yer:yedi_taht|in} hüküm salonunda, altı tahtın önünde, dünyanı isteyen Kadim'le dövüştün.", en: "In {yer:yedi_taht|pos} Hall of Decree, before all six thrones, you fought the Ancient who wanted your world." }
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Gerçek seviyesini salona yüksek sesle oku", en: "Read his real level out loud to the hall" }
            gerekli: { stat: { per: 170 } }
            etkiler:
              - bolge: "yedi_taht"
              - bilgi: "ossiran_gercek_seviye"
              - aciga_vur: true
              - ahlak: { duzen: -2, insanlik: 2 }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+5"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "{yer:yedi_taht|in} varisinin gerçek seviyesini altı tahtın önünde yüksek sesle okudun; o tanrılığın ne kadarının ödünç olduğunu herkes duydu.", en: "You read {yer:yedi_taht} heir's real level out loud before all six thrones, and everyone heard how much of a god was borrowed." }
          - id: "yanki"
            etiket: { tr: "{npc:yanki} içindeki üç dünyayı karıştırsın", en: "Have {npc:yanki} stir up the three worlds in him" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "yedi_taht"
              - dikkat: 5
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+4"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "{yer:yedi_taht|in} varisinin içindeki üç dünyayı kafandaki sese birbirine düşürttün; bedelini ikiniz birlikte ödediniz.", en: "The voice in your head turned the three worlds inside {yer:yedi_taht|pos} heir against each other, and the two of you paid for it together." }
          - id: "reddet"
            etiket: { tr: "Düelloyu reddet ve salondan çık", en: "Refuse the duel. Walk out of the hall" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_duellosu_reddedildi"
              - ahlak: { duzen: 2, merhamet: -2 }
              - itibar: { kadimler: -5 }
              - degisken: { kadim_tehdit: 6 }
            kronik: { tr: "{yer:yedi_taht|in} varisiyle düelloya girmedin; {npc:ossiran} da dünyanı hasat listesine kendi adıyla yazdırdı.", en: "You refused {yer:yedi_taht} heir's duel, and {npc:ossiran} had your world entered on the harvest list under his own name." }
            sonraki: "varis_ret"

      - id: "varis_zafer"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "{npc:ossiran} dizlerinin üstüne çöküyor. Derisi çatlamış; çatlaklardan üç dünyanın ışığı sızıyor ve o ışığın içinde küçük, şaşkın yüzler kaynaşıyor: hasat ettikleri.", en: "{npc:ossiran} drops to his knees. His skin is cracked, light from three worlds leaking out of the seams, and inside that light you can see a crowd of small, bewildered faces. The ones he harvested." }
          - { tr: "Altı taht kıpırdamıyor. Karışmadılar ve bu da bir oydu. Şimdi ne yapacağını bekliyorlar.", en: "The six thrones don't move. They didn't step in, and that was a vote too. Now they're waiting to see what you'll do." }
          - { tr: "\"Bitir,\" diyor {npc:ossiran}. \"Ya da al. Biz ikisi arasında bir fark görmeyiz.\"", en: "\"Finish it,\" {npc:ossiran} says. \"Or take it. We do not see a difference between the two.\"" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[Talip yenildi]", en: "[Claimant defeated]" }
            satirlar:
              - { tr: "Dünya Katmanı'nın hasat kaydı: talipsiz.", en: "Earth Layer harvest record: unclaimed." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Söz vermiştin.\"", en: "\"You promised.\"" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir; içindeki dünyaları serbest bırak", en: "Finish him. Set the worlds inside him free" }
            etkiler:
              - bayrak: "ossiran_olduruldu"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - esya: { ossiran_tac_parcasi: 1 }
              - ahlak: { merhamet: 4, duzen: -4, insanlik: 4 }
              - itibar: { kadimler: -15 }
              - degisken: { kadim_tehdit: -8 }
              - xp_seviye: 150
            kronik: { tr: "{yer:yedi_taht|in} varisini kendi sarayında öldürüp içinde taşıdığı üç dünyanın ışığını serbest bıraktın.", en: "You killed {yer:yedi_taht|pos} heir in his own palace and set free the light of the three worlds he carried." }
            sonraki: "varis_son"
          - id: "bagisla"
            etiket: { tr: "Bağışla; yaşasın ve hatırlasın", en: "Spare him. Let him live and remember" }
            etkiler:
              - bayrak: "ossiran_bagislandi"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - ahlak: { merhamet: 8, insanlik: 4 }
              - itibar: { kadimler: -4 }
              - degisken: { kadim_tehdit: -4 }
              - xp_seviye: 120
            kronik: { tr: "{yer:yedi_taht|in} varisini yendin, sonra altı tahtın gözü önünde canını bağışladın.", en: "You beat {yer:yedi_taht|pos} heir, then spared his life with all six thrones watching." }
            sonraki: "varis_son"
          - id: "yut"
            etiket: { tr: "Üç dünyayı içine çek", en: "Pull the three worlds into yourself" }
            etkiler:
              - bayrak: "ossiran_olduruldu"
              - bayrak: "ossiran_yutuldu"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - esya: { ossiran_tac_parcasi: 1 }
              - ahlak: { insanlik: -14, merhamet: -6 }
              - dikkat: 10
              - stat: { str: 10, int: 10, wil: 10 }
              - itibar: { kadimler: 5, yukselenler: 8 }
              - degisken: { kadim_tehdit: -6 }
              - xp_seviye: 260
            kronik: { tr: "{yer:yedi_taht|in} varisini yenip hasat ettiği üç dünyayı içine çektin; altı taht seni ilk kez kendilerinden biri gibi selamladı.", en: "You beat {yer:yedi_taht|pos} heir and pulled the three worlds he'd harvested into yourself. For the first time, the six thrones saluted you like one of their own." }
            sonraki: "varis_son"

      - id: "varis_yenilgi"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "{npc:ossiran|in} avucu göğsünde. İtmiyor, çekiyor. Sayıların ona doğru eğiliyor ve derisindeki dördüncü boşluk senin ışığınla dolmaya başlıyor.", en: "{npc:ossiran|pos} palm is flat on your chest. He isn't pushing. He's pulling. Your numbers lean toward him, and the fourth hollow in his skin starts filling with your light." }
          - { tr: "Derken altı tahttan biri konuşuyor; İkinci Taht'tan {npc:ulvenne|in} Sesi: \"Konuk kaydında.\" Tek bir cümle, ama bu salonda yasa hükmünde.", en: "Then one of the six thrones speaks. {npc:ulvenne|pos} Voice, from the Second Throne: \"It is on the guest registry.\" One sentence. In this hall, it's law." }
          - { tr: "{npc:ossiran} elini çekiyor; sen de yarı yarıya boşalmış hâlde pencereli zeminden aşağı, Kule'nin ellinci katına düşüyorsun.", en: "{npc:ossiran} pulls his hand back, and you, half drained, fall down through the window floor to the Spire's fiftieth floor." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kule'nin taşında nefeslen", en: "Catch your breath on the Spire's stone" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_yenilgisi"
              - gorev: { cok_evren_taht: basarisiz }
              - ahlak: { insanlik: 2 }
              - degisken: { kadim_tehdit: 6 }
              - can: 60
            kronik: { tr: "{yer:yedi_taht|in} varisine yenildin. Dünyan onun hasat listesine yazıldı; seni kurtaran tek şey bir misafirlik kuralı oldu.", en: "You lost to {yer:yedi_taht|pos} heir. Your world went onto his harvest list, and the only thing that saved you was a rule about guests." }
            sonraki: "@akis"

      - id: "varis_kacis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Yumruğunu pencereli zemine indirince cam açılıyor ve aşağıya, Kule'ye düşüyorsun. Yukarıda altı taht kıpırdamıyor.", en: "You slam your fist into the window floor and the glass gives way. You drop through it, down into the Spire. Up above, the six thrones don't move." }
          - { tr: "{npc:ossiran|in} sesi peşinden geliyor: \"Kaçan hasat da hasattır.\"", en: "{npc:ossiran|pos} voice follows you down: \"A crop that runs is still a crop.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Ayağa kalk", en: "Get up" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_yenilgisi"
              - gorev: { cok_evren_taht: basarisiz }
              - ahlak: { duzen: 1, merhamet: -2 }
              - degisken: { kadim_tehdit: 5 }
            kronik: { tr: "{yer:yedi_taht|in} hüküm salonundan kaçtın; arkandan gelen tek şey {npc:ossiran|in} sesiydi.", en: "You ran from {yer:yedi_taht|pos} Hall of Decree, and all that followed you down was {npc:ossiran|pos} voice." }
            sonraki: "@akis"

      - id: "varis_ret"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Salondan çıkınca mühürlü kapı arkandan kapanıyor. Kule Dibi'nde akşam olmuş; insanlar tezgâhlarını topluyor.", en: "You walk out of the hall, and the sealed door shuts behind you. It's evening in {yer:kule_dibi}. People are packing up their stalls." }
          - { tr: "Gece yarısı herkesin penceresi aynı anda çalıyor: [Dünya Katmanı · hasat talibi kaydedildi: {npc:ossiran}.] Kimse bunun ne anlama geldiğini bilmiyor; sen biliyorsun.", en: "At midnight everybody's window goes off at once: [Earth Layer · harvest claimant registered: {npc:ossiran}.] Nobody knows what that means. You do." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Ellinci kata bak ve bekle", en: "Look up at the fiftieth floor and wait" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
            kronik: { tr: "Dünyanın hasat talibinin adını bütün şehirle aynı anda okudun; ne demek olduğunu bilen tek kişi sendin.", en: "You read the name of your world's harvest claimant at the same moment as the whole city, and you were the only one who knew what it meant." }
            sonraki: "@akis"

      - id: "varis_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Altı taht ayağa kalkıyor; bin yıldır görülmemiş bir şey bu. {npc:ulvenne} hüküm salonunun ortasına yürüyüp Kadim dilinde bir şey okuyor, Sistem de çeviriyor: [Dünya Katmanı'nın hasadının talipsiz kalmasına karar verildi.]", en: "The six thrones rise. That hasn't happened in a thousand years. {npc:ulvenne} walks into the middle of the Hall of Decree and reads something in the Ancient language, and the System translates: [It has been decided that the harvest of Earth Layer shall remain unclaimed.]" }
          - metin: { tr: "\"Bu döngüde,\" diye ekliyor {npc:ulvenne}, alçak sesle ve yalnızca sana. \"Gerisi elçimizin masasına kaldı. Anlaşmamızı unutmadık.\"", en: "\"For this cycle,\" {npc:ulvenne} adds quietly, only to you. \"The rest is left to our envoy's table. We have not forgotten our arrangement.\"" }
            kosul: { bayrak: "taht_ittifak" }
          - metin: { tr: "Altı Ses'in derisindeki yıldızlar güneşe dönen bir çiçek gibi sana doğru kayıyor. İçindeki üç dünya onları tanıyıp selamlıyor.", en: "The stars under the six Voices' skin drift toward you, like a flower turning to the sun. The three worlds inside you recognize them, and salute." }
            kosul: { bayrak: "ossiran_yutuldu" }
          - { tr: "Pencereli zemin ayaklarının altında hafifçe ısınıyor. Hasat edilmiş dünyaların son satırları orada; ama bu gece aralarında seninki yok.", en: "The window floor warms a little under your feet. The last lines of harvested worlds, and tonight, yours isn't one of them." }
        secenekler:
          - id: "don"
            etiket: { tr: "Kendi dünyana dön", en: "Go home to your world" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Dünyanın hasadını talipsiz bıraktırıp {yer:yedi_taht|den} evine döndün.", en: "You came home from {yer:yedi_taht} having left your world's harvest unclaimed." }
            sonraki: "@akis"
          - id: "koltuk"
            etiket: { tr: "Çıkmadan önce boş koltuğa son kez bak", en: "Take one last look at the empty seat" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "{yer:yedi_taht|den} ayrılmadan önce boş koltuğa son kez baktın; koltuk da sana baktı.", en: "Before leaving {yer:yedi_taht}, you took one last look at the empty seat. It looked back." }
            sonraki: "varis_koltuk"

      - id: "varis_koltuk"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Taht salonu boş. Yedinci koltuğun içindeki boşluk hâlâ dünyanın biçiminde; ama kıyıları artık biraz bulanık, sanki biri silmeye başlamış.", en: "The throne room is empty. The hollow inside the seventh seat is still shaped like your world, but the coastlines are a little blurry now, like somebody started erasing them." }
          - { tr: "Koltuk seni bekliyor. Hep bekleyecek.", en: "The seat is waiting for you. It always will be." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkanı dön ve git", en: "Turn around and go" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Bir tanrının koltuğunun seni bekleyeceğini bile bile ona sırtını döndün.", en: "Knowing a god's seat would wait for you, you turned your back on it." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ KESH'İN YEMİNİ (tohum: batik_son_basakci · basakci_sabah)
  - id: "batik_kesh_yemini"
    konum: ["kule_dibi"]
    perde: [3, 4]
    agirlik: 1
    etiketler: ["cok_evren", "batik", "ordu"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "İkinci zıpkın", en: "The second harpoon" }
    sahne: "kesh_1"
    sahneler:
      - id: "kesh_1"
        yer: "kule"
        paragraflar:
          - { tr: "Sığınak'ın Kule Dibi'ndeki çadırından bir gönüllü, nerede olursan ol seni bulup çıkarıyor. \"Ellinci kattaki su kapısından biri çıktı,\" diyor. \"Kimseyle konuşmuyor, durmadan seni tarif ediyor.\"", en: "A volunteer from the Haven's tent in {yer:kule_dibi} tracks you down wherever you are. \"Somebody came out of the water door up on fifty,\" she says. \"Won't talk to anybody. Just keeps describing you.\"" }
          - metin: { tr: "Geçidin önünde Kesh dikiliyor. Arkasında sırtlarında kemik zıpkınlar taşıyan altı Nehha var, ayaklarının dibinde deniz suyu birikmiş. Avcılar çevrelerinde yarım çember olmuş; kimse silahını indirmiyor ama kaldıran da yok.", en: "Kesh is standing in front of the gate with six Nehha behind him, bone harpoons on their backs, seawater pooling at their feet. Hunters have formed a half circle around them. Nobody's lowering a weapon. Nobody's raising one either." }
            kosul: { bayrak_yok: "batik_hasat_yutuldu" }
          - metin: { tr: "Seni görünce Kesh zıpkınını ikinci kez ayaklarının dibine bırakıyor. Sistem çeviriyor: [Bir kez bırakılan zıpkın teşekkürdür. İkinci kez bırakılan yemindir.]", en: "When he sees you, Kesh lays his harpoon at your feet for the second time. The System translates: [A harpoon laid down once is thanks. Laid down twice, it is an oath.]" }
            kosul: { bayrak_yok: "batik_hasat_yutuldu" }
          - metin: { tr: "\"Sizin dünyanıza da bir hasat geliyor,\" diyor. \"Başakçı yalnızca artığıydı; size gelen hasadın kendisi. Hasat'ın neye benzediğini biz biliyoruz, siz bilmiyorsunuz.\"", en: "\"A harvest is coming for your world too,\" he says. \"The Gleaner was only the leftovers. What's coming for you is the whole thing. We know what the Harvest looks like. You don't.\"" }
            kosul: { bayrak_yok: "batik_hasat_yutuldu" }
          - metin: { tr: "Geçidin önünde Kesh tek başına duruyor. Zıpkını bu kez ayaklarının dibinde değil, elinde. Avcılar ona bir canavara bakar gibi bakıyor; o da sana öyle bakıyor.", en: "Kesh is standing in front of the gate alone. His harpoon is in his hand this time, not at your feet. The hunters around him are looking at him like he's a monster, and he's looking at you the same way." }
            kosul: { bayrak: "batik_hasat_yutuldu" }
          - metin: { tr: "\"Oru-Venn artık yürümüyor,\" diyor. Sistem sesini düzleştirerek çeviriyor: [Ağdayken seviyesi hâlâ onundu; bir iplikle ona bağlıydı. Sen ipliği kopardın.]", en: "\"Oru-Venn doesn't walk anymore,\" he says. The System translates, flattening his voice: [While it was in the net, her level was still hers. A thread tied it to her. You broke the thread.]" }
            kosul: { bayrak: "batik_hasat_yutuldu" }
          - metin: { tr: "\"Yaşlı kadın senin içinde,\" diyor Kesh. \"Onu geri istiyorum.\"", en: "\"The old woman is inside you,\" Kesh says. \"I want her back.\"" }
            kosul: { bayrak: "batik_hasat_yutuldu" }
        sezgiler:
          - kosul: { stat: { per: 150 }, bayrak_yok: "batik_hasat_yutuldu" }
            metin: { tr: "Yedi Nehha'nın hiçbirinin başının üstünde bir şey yazmıyor; Sistem onları görmüyor. Sistem'le çalışan bir şeye karşı bundan iyi asker bulunmaz.", en: "There's nothing written over any of the seven Nehha's heads. The System doesn't see them. Against something that runs on the System, you couldn't ask for better soldiers." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "batik_hasat_yutuldu" }
            metin: { tr: "yedi kişi, hiçbirinin sistemi yok. onlara bakınca kıskanıyorum. nasıl yapıyorlar bunu?", en: "seven people and not one of them has a system. looking at them, i'm jealous. how do they do it?" }
          - kosul: { bayrak: ["yanki_bagi", "batik_hasat_yutuldu"] }
            metin: { tr: "içinde dört yüz on dokuz diyen bir sayı var. her gece kendi adını biraz daha yüksek sesle söylüyor. ben duyuyorum, sen duymazdan geliyorsun.", en: "there's a number in you that says four hundred and nineteen. every night it says its own name a little louder. i hear it. you pretend you don't." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari", bayrak_yok: "batik_hasat_yutuldu" }
            metin: { tr: "\"Hepsi susuz kalmış. Önce su, yemin sonra.\"", en: "\"They're all dehydrated. Water first, oaths after.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt", bayrak_yok: "batik_hasat_yutuldu" }
            metin: { tr: "\"Altı adam, kemik zıpkın. Eskiden olsa gülerdim. Sonra o Başakçı'yı gördüm.\"", en: "\"Six guys with bone harpoons. I'd have laughed, once. Then I saw that Gleaner.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "batik_hasat_yutuldu" }
            metin: { tr: "\"Yaşlı bir kadın. Yaşlı bir kadını yuttun.\"", en: "\"An old woman. You swallowed an old woman.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Zıpkını kaldırıp ona geri ver: yemini kabul et", en: "Pick up the harpoon, hand it back. Accept the oath" }
            goster: { bayrak_yok: "batik_hasat_yutuldu" }
            etkiler:
              - bayrak: "nehha_yemini"
              - ordu: { lonca_avcisi: 7 }
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { siginak: 2 }
              - xp_seviye: 15
            sonraki: "kesh_yemin"
          - id: "eve"
            etiket: { tr: "\"Bu sizin savaşınız değil. Eve dönün.\"", en: "\"This isn't your war. Go home.\"" }
            goster: { bayrak_yok: "batik_hasat_yutuldu" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
            sonraki: "kesh_eve"
          - id: "bedel"
            etiket: { tr: "Yeminin karşılığında ne istediklerini sor", en: "Ask what they want in return for the oath" }
            goster: { bayrak_yok: "batik_hasat_yutuldu" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "kesh_bedel"
          - id: "oru"
            etiket: { tr: "Onunla geçitten geç; geri vermeyi dene", en: "Go back through with him. Try to give it back" }
            goster: { bayrak: "batik_hasat_yutuldu" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 5, insanlik: 3 }
            sonraki: "kesh_oru"
          - id: "benim"
            etiket: { tr: "\"O seviye artık benim. Git.\"", en: "\"That level's mine now. Leave.\"" }
            goster: { bayrak: "batik_hasat_yutuldu" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -5 }
              - dikkat: 3
            sonraki: "kesh_benim"
          - id: "sok"
            tur: "gosteris"
            etiket: { tr: "Sayıyı burada, kendi ellerinle içinden sök", en: "Tear the number out of yourself, here, by hand" }
            goster: { bayrak: "batik_hasat_yutuldu" }
            gerekli: { stat: { wil: 300 } }
            etkiler:
              - stat: { str: -3, end: -3, wil: -3 }
              - dikkat: -4
              - dikkat: 4
              - ahlak: { merhamet: 6, insanlik: 4 }
            sonraki: "kesh_sokum"

      - id: "kesh_yemin"
        yer: "kule"
        paragraflar:
          - { tr: "Zıpkını yerden alıp Kesh'e uzatıyorsun. Bir an elini uzatmıyor; sonra alıyor ve sapını bir kez yere vuruyor, arkasındaki altı Nehha da aynısını yapıyor. {yer:kule_dibi|in} taşlarında yedi kuru ses çınlıyor.", en: "You pick the harpoon up and hold it out to Kesh. For a second he doesn't reach for it. Then he takes it and knocks the butt against the ground once, the six behind him do the same, and seven dry knocks ring off the stones of {yer:kule_dibi}." }
          - { tr: "Penceren güncelleniyor, ama yedi satır yerine tek satır düşüyor: [Ordu: +7. Tür: tanımsız. Seviye: okunamıyor.] Sistem onları sayıyor, neyi saydığını bilmeden.", en: "Your window updates, but instead of seven lines there's just one: [Army: +7. Type: undefined. Level: unreadable.] The System is counting them. It just doesn't know what it's counting." }
          - metin: { tr: "{npc:yanki}: çanlarını duydun mu? sistemin kayıt frekansının tam tersinde çalıyorlar. o sesi öğrenebilirim. öğrenirsem bir gün sistem de bizi duymayabilir.", en: "{npc:yanki}: did you hear their bells? they ring at the exact inverse of the system's logging frequency. i could learn that sound. if i do, someday the system might not hear us either." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "kordon"
            etiket: { tr: "Onları {yer:kordon|in} sahil hattına yerleştir; deniz onların", en: "Post them on {yer:kordon} shore. The sea is theirs" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} çanlarının sesini öğrensin", en: "Let {npc:yanki} learn the sound of their bells" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bilgi: "basakci_cani"
              - ahlak: { insanlik: -2, duzen: -2 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            sonraki: "@akis"
          - id: "on"
            etiket: { tr: "Onları ordunun önüne koy; herkes görsün", en: "Put them at the front of your army. Let everyone see" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -1 }
              - ordu_kazan: 8
            sonraki: "@akis"

      - id: "kesh_eve"
        yer: "kule"
        paragraflar:
          - { tr: "Kesh zıpkını yerden alıyor. Bir an onu kırdığını sanıyorsun; derken kemerinden yeşile çalmış küçük bir çan çıkarıp üç kez sallıyor.", en: "Kesh picks the harpoon up off the ground. For a second you think you've insulted him. Then he takes a little green-tarnished bell off his belt and shakes it three times." }
          - { tr: "Sistem çeviriyor: [Gün geldiğinde çanınızı çalın. Duyarsak geliriz. Bu bir yemin değil; komşuluk.]", en: "The System translates: [When the day comes, ring your bell. If we hear it, we come. That is not an oath. That is being neighbors.]" }
          - { tr: "Altı Nehha geçide dönüyor. Arkalarında bıraktıkları deniz suyu Kule'nin taşlarında saatlerce kurumuyor.", en: "The six Nehha turn back to the gate. The seawater they leave behind takes hours to dry on the Spire's stones." }
        secenekler:
          - id: "al"
            etiket: { tr: "Çanı al", en: "Take the bell" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "ugurla"
            etiket: { tr: "Onları geçide kadar uğurla", en: "Walk them back to the gate" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
            sonraki: "@akis"

      - id: "kesh_bedel"
        yer: "kule"
        paragraflar:
          - { tr: "Kesh sorunun çevrilmesini bekleyip kısa, ıslak bir kahkaha atıyor. \"Sönükler pazarlık etmez,\" diyor. \"Pazarlık, sayılanların işidir.\"", en: "Kesh waits for the question to be translated, then laughs, short and wet. \"The Dimmed don't bargain,\" he says. \"Bargaining is for people who get counted.\"" }
          - { tr: "Sonra ciddileşiyor. \"Bir şey isteyeceğim ama bu bir bedel değil. Biz düşersek biri bizim çanımızı sizin dünyanızda çalsın da bir yerlerde birileri, bir zamanlar Ilunnar diye bir dünya olduğunu hatırlasın.\"", en: "Then he gets serious. \"I will ask one thing, but it is not a price. If we fall, someone rings our bell in your world. So that somewhere, someone remembers there was once a world called Ilunnar.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Söz ver; yemini kabul et", en: "Promise. Accept the oath" }
            etkiler:
              - bayrak: "nehha_yemini"
              - ordu: { lonca_avcisi: 7 }
              - ahlak: { merhamet: 2, insanlik: 2 }
              - xp_seviye: 15
            sonraki: "kesh_yemin"
          - id: "eve"
            etiket: { tr: "\"O zaman siz düşmeyin. Eve dönün.\"", en: "\"Then don't fall. Go home.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
            sonraki: "kesh_eve"

      - id: "kesh_oru"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısından geçtiğinizde takımada sessiz. Çanlar yalnızca rüzgâr esince kendiliğinden, tek tük çalıyor. Oru-Venn fenerin merdivenlerinde yatıyor; yüzü güneşe dönük, nefesi bir mum alevi kadar ince.", en: "When you come through the water door, the archipelago is quiet. The bells only ring now and then, on their own, when the wind picks up. Oru-Venn is lying on the Light's stairs, face to the sun, her breath as thin as a candle flame." }
          - { tr: "Yanına diz çöküyorsun. İçinde bir yerde dört yüz on dokuz diye bir sayı, onu tanıyormuş gibi kıpırdıyor. Ama Sistem'de geri verme tuşu yok, hiçbir zaman olmamış.", en: "You kneel beside her. Somewhere inside you a number, four hundred and nineteen, stirs like it recognizes her. But the System doesn't have a give-it-back button. It never has." }
          - { tr: "Oru-Venn kör gözlerini sana çeviriyor. \"Sıcaksın,\" diyor. \"İçinde benden bir parça var, hissediyorum. Seni de.\"", en: "Oru-Venn turns her blind eyes toward you. \"You're warm,\" she says. \"There's a piece of me in you. I can feel it. And you.\"" }
        secenekler:
          - id: "yanki"
            etiket: { tr: "{npc:yanki} sayıyı ayıklasın; neye mal olursa olsun", en: "Have {npc:yanki} pick the number out. Whatever it costs" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - stat: { wil: -4, per: -2 }
              - dikkat: -3
              - ahlak: { merhamet: 6, insanlik: 4 }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
            sonraki: "kesh_oru_don"
          - id: "sok"
            tur: "gosteris"
            etiket: { tr: "Sayıyı kendi ellerinle sök; acısı senin olsun", en: "Tear the number out yourself. The pain is yours" }
            gerekli: { stat: { wil: 300 } }
            etkiler:
              - stat: { str: -3, end: -3, wil: -3 }
              - dikkat: -4
              - dikkat: 3
              - ahlak: { merhamet: 5, insanlik: 2 }
            sonraki: "kesh_oru_don"
          - id: "el"
            etiket: { tr: "Elini tut; sonuna kadar yanında kal", en: "Hold her hand. Stay till the end" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
            sonraki: "kesh_oru_veda"

      - id: "kesh_oru_don"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Acı soğuk soğuk geliyor; kökünden sökülen bir diş gibi, ama içeriden. Avucunda küçük, sönük bir pencere beliriyor, üstünde tek bir sayı: 419.", en: "The pain comes cold, like a tooth pulled at the root, but from the inside. A small, dim window shows up in your palm with just one number on it: 419." }
          - { tr: "Pencereyi Oru-Venn'in göğsüne bastırıyorsun. Bir süre hiçbir şey olmuyor; derken kadın derin, hırıltılı bir nefes alıyor ve kör gözlerini kırpıştırıyor.", en: "You press the window to Oru-Venn's chest. For a while nothing happens. Then she pulls in a deep, rattling breath, and her blind eyes blink." }
          - { tr: "Kesh zıpkınını yere bırakıyor, ama bu kez senin ayaklarının dibine değil, ikinizin arasındaki taşa. Sistem bunu çevirmiyor; gerek de yok.", en: "Kesh lays his harpoon down, not at your feet this time, but on the stone between the two of you. The System doesn't translate it. It doesn't need to." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Seviye kaybı: kaynak sahibine iade edildi]", en: "[Level loss: source returned to owner]" }
            satirlar:
              - { tr: "Sistem bu işlemi tanımıyor. Yine de kaydedildi.", en: "The System does not recognize this operation. Logged anyway." }
        secenekler:
          - id: "veda"
            etiket: { tr: "Suya, sonra alnına dokun", en: "Touch the water, then your brow" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Bir gece daha fenerde kal", en: "Stay one more night at the Light" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "kesh_oru_veda"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Elini tutuyorsun. Avucu tuzlu, kuru ve sandığından sıcak. Güneş kulelerin ardına inerken sana bir şey anlatıyor; Sistem bir süre çeviriyor, sonra çevirmeyi bırakıyor, ama sen dinlemeyi sürdürüyorsun.", en: "You take her hand. Her palm is salty, dry, warmer than you expected. As the sun goes down behind the towers she tells you something, and the System translates, then stops translating, and you keep listening anyway." }
          - { tr: "Son nefesinde içindeki sayı bir kez ısınıp soğuyor. Artık yalnızca bir sayı.", en: "With her last breath, the number inside you warms once, then goes cold. Now it's just a number." }
          - { tr: "Kesh zıpkınını kadının göğsüne bırakıyor ve sana bakmadan fenerin çanını çalıyor: tek, uzun bir vuruş. Takımadanın dört bir yanından çanlar karşılık veriyor.", en: "Kesh lays his harpoon across her chest and, without looking at you, rings the Light's bell: one long stroke. Bells answer from every corner of the archipelago." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Çanlar susana kadar orada kal", en: "Stay until the bells go quiet" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Sessizce kapıya yürü", en: "Walk back to the door in silence" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: -1 }
            sonraki: "@akis"

      - id: "kesh_benim"
        yer: "kule"
        paragraflar:
          - { tr: "Kesh uzun uzun sana bakıyor. Sonra zıpkınının ucunu yere değdirip kemiği taşa sürte sürte ikinizin arasına bir çizgi çekiyor.", en: "Kesh looks at you for a long time. Then he touches the point of his harpoon to the ground and drags it, bone scraping stone, drawing a line between the two of you." }
          - { tr: "\"Başakçı da öyle derdi,\" diyor; Sistem bu kez sesini düzleştirmiyor. Geçide dönüp suya dalmadan önce çanını son bir kez çalıyor. Öbür taraftan hiçbir karşılık yok.", en: "\"The Gleaner used to say that too,\" he says, and this time the System doesn't flatten his voice. He turns back to the gate and, before he dives, rings his bell one last time. Nothing answers from the other side." }
          - metin: { tr: "{npc:yanki}: dört yüz on dokuz. şimdi daha sessiz. bu iyiye işaret değil.", en: "{npc:yanki}: four hundred and nineteen. it's quieter now. that's not a good thing." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "don"
            etiket: { tr: "Arkanı dön", en: "Turn your back" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "kesh_sokum"
        yer: "kule"
        paragraflar:
          - { tr: "İçine uzanıyorsun; elinle değil, iradenle. Sistem uyarı üstüne uyarı basıyor, sen hepsini kapatıyorsun. Sonunda dört yüz on dokuzu buluyorsun: öbür sayılarının arasında yabancı bir dilde konuşan biri gibi duruyor.", en: "You reach inside, not with your hand but with your will. The System throws up warning after warning and you close every one. Then you find four hundred and nineteen, sitting among your other numbers like someone speaking a foreign language." }
          - { tr: "Söktüğün an dizlerinin bağı çözülüyor ve {yer:kule_dibi|in} taşlarına yığılıyorsun. Avucunda küçük, sönük bir pencere: 419.", en: "When you tear it loose, your knees give out and you go down on the stones of {yer:kule_dibi}. In your palm, a small, dim window: 419." }
          - { tr: "Kesh pencereyi bir yumurtayı tutar gibi iki eliyle alıyor ve tek söz etmeden geçide koşup suya dalıyor. Bir saat sonra geçidin ardından bir çan sesi geliyor: tek ve uzun.", en: "Kesh takes the window in both hands like he's holding an egg. Without a word, he runs for the gate and dives. An hour later a bell sounds from the other side: once, long." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Seviye kaybı]", en: "[Level loss]" }
            satirlar:
              - { tr: "Kaynak: gönüllü. Sistem bunu bir hata olarak kaydetti.", en: "Source: voluntary. The System has logged this as an error." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk", en: "Get up" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            sonraki: "@akis"
