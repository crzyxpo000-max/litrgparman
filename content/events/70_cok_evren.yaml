# Parti I — Çok-evren (Perde 3–4). docs/PERDE2_4.md §4 "Parti I".
# cok_evren_kapisi (AY 200): Kule'nin 50. katının ardındaki geçit açılır (cok_evren_acik).
# Batık Takımada (Nehhalar; Hasat sonunun aynası): batik_ilk_adim, batik_son_fener, batik_tuz_arsivi, batik_son_basakci, batik_tilu (tohum).
# Pirinç Kervan (Tavvarlar; Vassal sonunun aynası): kervan_tarti_carsisi, kervan_ondalik, kervan_sayman, kervan_bos_kefe.
# Yedi Taht (Kadim sarayı; Yükseliş/tanrı sonunun aynası): taht_kabul_salonu, taht_yedinci_koltuk, taht_uyuyan_tanrilar, taht_varis_duellosu (tohum).
olaylar:
  # ================================================================== ANA YAY: ÇOK-EVREN GEÇİDİ (gün 200)
  - id: "cok_evren_kapisi"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "cok_evren", "kule"]
    gerilim: 4
    ana_yay: { gun: 200 }
    onemli: true
    kart: { tr: "Ellinci katın ardı", en: "Past the fiftieth floor" }
    sahne: "gecit_1"
    sahneler:
      - id: "gecit_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gün doğmadan Kule nabız gibi atmaya başlıyor. Gövdesi boyunca yukarı doğru bir ışık halkası tırmanıyor, kat kat, ve tam ellinci katın hizasında duruyor.", en: "Before sunrise, the Spire starts to throb like a pulse. A ring of light climbs its body floor by floor and stops dead at the fiftieth." }
          - { tr: "Kule Dibi'ndeki çadırlardan, tezgâhlardan, yarı yıkık apartmanların balkonlarından binlerce yüz aynı noktaya kalkıyor. Sonra herkesin penceresi aynı anda çalıyor.", en: "Out of the tents and stalls of Spire Plaza, off the balconies of half-gutted apartment blocks, thousands of faces tip up toward the same spot. Then everybody's window goes off at once." }
          - metin: { tr: "Ellinci katın ardındaki o kapıyı zaten gördün. Önünde durdun, eline soğuk bir mühür değdi ve geri döndün. Şimdi mühür yok.", en: "You've already seen that door behind the fiftieth floor. You stood in front of it, felt a cold seal under your palm, and turned back. Now the seal is gone." }
            kosul: { degisken_min: { kule_kat: 50 } }
          - metin: { tr: "Körfezin üstünde asılı duran Kadim gemisinin karnından ince, beyaz bir ışık iniyor ve Kule'nin ellinci katına dokunuyor. Biri, çok uzaktan, kapının açıldığını onaylıyor.", en: "From the belly of the Ancient ship hanging over the bay, a thin white beam comes down and touches the Spire's fiftieth floor. Somebody, a long way off, is signing for the delivery." }
            kosul: { bayrak: "thessar_indi" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[ÇOK-EVREN AĞI · BAĞLANTI AÇILDI]", en: "[MULTIVERSE NETWORK · CONNECTION ESTABLISHED]" }
            satirlar:
              - { tr: "Dünya Katmanı, komşu Katmanlarla temas düzeyine yükseltildi.", en: "Earth Layer has been upgraded to contact status with neighboring Layers." }
              - { tr: "Geçit: Kule, Kat 50. Ziyaret serbesttir. Dönüş garanti edilmez.", en: "Gate: The Spire, Floor 50. Visitation is unrestricted. Return is not guaranteed." }
              - { tr: "Not: Komşularınız da sizi ziyaret edebilir.", en: "Note: Your neighbors may also visit you." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Işık halkası ellinci katta durmadı; orada kırıldı. Halkanın bir parçası Kule'nin içine değil, bambaşka bir yöne, yukarıya da aşağıya da olmayan bir yöne akıyor.", en: "The ring of light didn't stop at the fiftieth floor. It broke there. Part of it isn't flowing into the Spire at all, but off in some other direction, one that isn't up and isn't down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu kapıyı tanıyorum. ben buradan geçmedim. ama geçen bir şeyden kopmuş olabilirim.", en: "i know this door. i didn't come through it. but i might have broken off something that did." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Başka dünyalar. Gerçekten başka dünyalar. Ve sen şimdiden kapıya bakıyorsun, değil mi?\"", en: "\"Other worlds. Actual other worlds. And you're already eyeing the door, aren't you?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir yarış daha. Ama bu sefer bitiş çizgisi başka bir gezegende.\"", en: "\"Another race. Only this time the finish line's on another planet.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sistem 'ziyaret serbest' diyor. Sistem bir şeye serbest dediğinde ben cüzdanımı kontrol ederim.\"", en: "\"The System says 'visitation is unrestricted.' When the System says something's free, I check my wallet.\"" }
        secenekler:
          - id: "kos"
            tur: "gosteris"
            etiket: { tr: "Kule'nin dış cephesinden ellinci kata koş", en: "Run up the Spire's outer wall to fifty" }
            gerekli: { stat: { agi: 160 } }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - bayrak: "gecit_ilk_giren"
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -3, insanlik: -1 }
              - itibar: { lonca: 4, yukselenler: 4 }
            kronik: { tr: "Ellinci kata herkesten önce, duvardan koşarak çıktın; o sabah bütün şehir başka dünyalara giden yolu senin sırtında gördü.", en: "You ran up the wall to the fiftieth floor ahead of everyone. That morning the whole city saw the road to other worlds on your back." }
            sonraki: "gecit_kosu"
          - id: "topla"
            etiket: { tr: "Avcıları topla; geçide birlikte yürüyün", en: "Gather the hunters. Walk to the gate together" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3, lonca: 3 }
              - xp_seviye: 20
            kronik: { tr: "Geçide yalnız değil, bir avcı kalabalığının başında yürüdün; çok-evrene ilk giren insanlar senin adımlarını saydı.", en: "You didn't walk to the gate alone. You led a crowd of hunters, and the first humans into the multiverse matched your stride." }
            sonraki: "gecit_esik"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kalabalığın arasında kal; önce kim gidiyor, izle", en: "Stay in the crowd. Watch who goes first" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - gizle: 5
              - ahlak: { duzen: 1, insanlik: 1 }
            kronik: { tr: "Geçit açıldığında kalabalığın içinde bekledin ve başkalarının cesaretini izledin; kimse ilk adımı senin attığını hatırlamadı.", en: "When the gate opened, you waited in the crowd and watched other people be brave. No one remembers you taking the first step." }
            sonraki: "gecit_izle"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bu kapıdan kimin geçtiğini sor", en: "Ask {npc:yanki} who came through this door" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "cok_evren_acik"
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 6, baglilik: 3 } }
            kronik: { tr: "Geçit açılırken ilk soruyu dünyaya değil, kafandaki sese sordun; o da sana ilk kez geçmişinden bir kırıntı verdi.", en: "When the gate opened, you asked your first question of the voice in your head instead of the world, and for the first time it gave you a crumb of its past." }
            sonraki: "gecit_yanki"

      - id: "gecit_kosu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin cephesi cam değil; dokununca ılık, nefes alan bir taş. Ayakların ona değdiği her yerde küçük mavi pencereler açılıp kapanıyor ve sen onlar kapanmadan bir sonrakine basıyorsun.", en: "The Spire's face isn't glass. It's warm stone, and it breathes when you touch it. Everywhere your feet land, little blue windows blink open and shut, and you're on the next one before they close." }
          - { tr: "Aşağıda kalabalık bir karınca yuvası kadar küçülüyor. Otuzuncu katta biri adını bağırıyor; kırkıncıda artık hiçbir ses gelmiyor, yalnızca rüzgâr.", en: "Below you the crowd shrinks to an anthill. Somebody yells your name around the thirtieth floor. By the fortieth there's no sound at all, just wind." }
          - { tr: "Ellinci katın kırık penceresinden içeri yuvarlandığında Sistem seni senden önce karşılıyor.", en: "When you roll in through the broken window of the fiftieth floor, the System is already there to greet you." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[Unvan: İlk Katman Gezgini]", en: "[Title: First Layer-Walker]" }
            satirlar:
              - { tr: "Bu duyuru tüm Dünya Katmanı'na yapıldı.", en: "This announcement has been made to all of Earth Layer." }
              - { tr: "Komşularınıza da.", en: "And to your neighbors." }
        secenekler:
          - id: "ilerle"
            etiket: { tr: "Nefesini topla ve eşikten geç", en: "Catch your breath. Cross the threshold" }
            etkiler:
              - unvan: "ilk_katman_gezgini"
              - xp_seviye: 30
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir dünyanın sınırını geçen ilk insan oldun; Sistem bunu komşulara da duyurdu.", en: "You became the first human to cross a world's border, and the System made sure the neighbors heard about it." }
            sonraki: "gecit_esik"

      - id: "gecit_izle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk kıpırdayan Lonca'nın avcıları oluyor; omuz omuza, silahları çekili, merdivenlere yürüyorlar. Arkalarından Sığınak gönüllüleri bir sedye ve iki ilk yardım çantasıyla geliyor; kimse onları çağırmadı.", en: "The Guild's hunters move first: shoulder to shoulder, weapons out, headed for the stairs. Haven volunteers trail behind them with a stretcher and two first-aid kits. Nobody asked them to come." }
          - { tr: "Meydanın ortasında beyazlar giymiş bir Yükselen avazı çıktığı kadar bağırıyor: \"Cennetin kapısı açıldı!\" Sessiz Ağ'dan birileri bir anteni Kule'nin duvarına bantlıyor.", en: "Dead center in the plaza, an Ascended in white is screaming at the top of his lungs: \"The gates of heaven are open!\" A couple of Quiet Network techs are duct-taping an antenna to the Spire's wall." }
          - { tr: "Saatler geçiyor. Yukarı çıkanlardan kimse geri inmiyor; ama telsizden bir ses, cızırtının arasında, yalnızca bir kelime söylüyor: \"Okyanus.\"", en: "Hours go by. Nobody who went up comes back down. But a voice on the radio, through the static, says exactly one word: \"Ocean.\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Antenin ekranındaki dalga boyu Dünya'nın hiçbir frekansına uymuyor. Bir dalganın içinde ritmik bir tını var: çan sesi.", en: "The waveform on that antenna's screen doesn't match any frequency on Earth. Buried in it is a rhythmic chime: bells." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Artık sıra sende; yukarı çık", en: "Your turn. Head up" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bilgi: "gecidin_kapilari"
            kronik: { tr: "Geçide herkesten sonra, ne beklediğini bilerek girdin.", en: "You went through the gate after everyone else, knowing what was waiting." }
            sonraki: "gecit_esik"

      - id: "gecit_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Sonra pencerenin kenarında, yalnızca senin görebildiğin, titreyen bir satır beliriyor.", en: "{npc:yanki} doesn't answer for a long time. Then a shaky line shows up at the edge of your window, where only you can see it." }
          - { tr: "{npc:yanki}: bu kapı açıldığında her seferinde bir şey içeri girer, bir şey dışarı çıkar. bu sefer neyin çıkacağını bilmiyorum. ama bir şey giriyorsa, o sen olmalısın.", en: "{npc:yanki}: every time this door opens, something goes in and something comes out. i don't know what's coming out this time. but if something's going in, it should be you." }
          - { tr: "'Her seferinde' kelimeleri bir an orada kalıyor, sonra satır kendini siliyor; sanki fazla konuşmuş gibi.", en: "The words 'every time' hang there for a second. Then the line erases itself, like it said too much." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Merdivenlere yürü", en: "Head for the stairs" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bilgi: "gecidin_kapilari"
            kronik: { tr: "Geçide, kafandaki sesin 'her seferinde' dediğini aklından çıkaramadan girdin.", en: "You went through the gate unable to stop hearing the voice in your head say 'every time.'" }
            sonraki: "gecit_esik"
          - id: "sor"
            etiket: { tr: "'Her seferinde' ne demek, sor", en: "Ask what 'every time' means" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: -2, saygi: 3 } }
            kronik: { tr: "Kafandaki sesi bir kelimeden yakaladın; cevap vermedi ama sorduğunu unutmadı.", en: "You caught the voice in your head on a single word. It didn't answer, but it didn't forget you asked." }
            sonraki: "gecit_esik"

      - id: "gecit_esik"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci katın ardında koridor yok; yuvarlak, kubbeli bir boşluk var. Duvarlarında üç kapı duruyor ve hiçbiri bu dünyadan değil.", en: "There's no hallway behind the fiftieth floor, just a round, domed hollow. Three doors stand in its walls, and none of them is from this world." }
          - { tr: "Birincisi suyun kendisinden yapılmış; yüzeyinde ılık, tuzlu bir rüzgâr dalgalanıyor ve derinden çan sesleri geliyor. İkincisi pirinçten; kenarlarından tütsü ve yağ kokusu sızıyor, ardında binlerce sesin pazarlığı.", en: "The first is made of water itself; a warm, salty breeze ripples its surface, and bells ring somewhere deep inside it. The second is brass. Incense and lamp oil leak around its edges, and behind it, a thousand voices haggling." }
          - { tr: "Üçüncüsü kapalı. Üstünde ışıktan bir mühür, mühürde eklemleri yanlış yerlerden bükülen uzun bir figürün kabartması. Kabartmanın yüzü yok; yine de sana bakıyor.", en: "The third is shut. On it is a seal made of light, and on the seal, a relief of a tall figure whose joints bend in all the wrong places. It has no face. It's looking at you anyway." }
          - metin: { tr: "Bu figürü tanıyorsun. Öğretici'de, kuzeydeki sırtın üstünde duran şey de böyle eğiliyordu.", en: "You know that figure. The thing on the north ridge back in the Tutorial bent just like that." }
            kosul: { bayrak: "yeni_tavan_goruldu" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KATMAN VİZESİ]", en: "[LAYER VISA]" }
            satirlar:
              - { tr: "Ilunnar · durum: hasat edildi.", en: "Ilunnar · status: harvested." }
              - { tr: "Tavvar Kervanı · durum: bağlı Katman.", en: "Tavvari Caravan · status: bonded Layer." }
              - { tr: "Yedi Taht · durum: erişim davetle.", en: "Sevenfold Court · status: access by invitation." }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Su kapısının yüzeyi tek yönlü değil. Kırışıkların yarısı içeri, yarısı dışarı doğru akıyor. Birisi öbür taraftan geliyor.", en: "The water door's surface isn't one-way. Half the ripples flow in, half flow out. Somebody's coming from the other side." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Su kapısının önünde dur ve bekle", en: "Stand at the water door and wait" }
            etkiler:
              - bilgi: "gecidin_kapilari"
              - ahlak: { duzen: 1 }
            kronik: { tr: "Başka bir dünyanın kapısında beklemeyi seçtin ve ilk gelen yolcuyu sen karşıladın.", en: "You chose to wait at another world's door, and you were the one who met its first traveler." }
            sonraki: "gecit_cocuk"
          - id: "muhur"
            etiket: { tr: "Mühürlü kapıya avucunu daya", en: "Press your palm to the sealed door" }
            etkiler:
              - bilgi: "gecidin_kapilari"
              - dikkat: 4
              - ahlak: { duzen: -2 }
            kronik: { tr: "İlk gün mühürlü kapıyı zorladın; ardındakiler senin avucunun sıcaklığını hatırladı.", en: "On the first day you pushed on the sealed door, and whatever was behind it remembered the heat of your palm." }
            sonraki: "gecit_muhur"

      - id: "gecit_muhur"
        yer: "kule"
        paragraflar:
          - { tr: "Mühür avucunun altında soğuk değil, kayıtsız. Bir an parmaklarının arasından bir şey seni okuyor; seviyeni, kademeni, kaç gün yaşadığını.", en: "The seal under your palm isn't cold. It's indifferent. For a second something reads you between your fingers: your level, your Grade, how many days you've been alive." }
          - { tr: "Sonra mühürde tek bir satır yanıyor: [Davetsiz. Not edildi.] Arkandan, su kapısından bir şıpırtı geliyor.", en: "Then one line lights up on the seal: [Uninvited. Noted.] Behind you, the water door splashes." }
        secenekler:
          - id: "don"
            etiket: { tr: "Su kapısına dön", en: "Turn back to the water door" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Mühürden elini çektin ve başka bir dünyadan gelen sese döndün.", en: "You pulled your hand off the seal and turned toward the sound coming from another world." }
            sonraki: "gecit_cocuk"

      - id: "gecit_cocuk"
        yer: "kule"
        paragraflar:
          - { tr: "Su kapısı şişiyor ve içinden bir çocuk düşüyor. İnce, gri-mavi tenli, omuzlarında tuz lekeleri, parmakları ikinci boğumlarına kadar perdeli bir çocuk; nefes almaya çalışıyor ve havayı sevmiyor.", en: "The water door bulges, and a kid tumbles out. Thin, blue-gray skin, salt freckles across the shoulders, fingers webbed up to the second knuckle. The kid is trying to breathe and doesn't like the taste of the air." }
          - { tr: "Gözlerinin iki göz kapağı var; ikincisi korkuyla kapanıp açılıyor. Elinde yeşile çalmış küçük bir çan sıkıyor, hiç bırakmayacakmış gibi.", en: "Its eyes have two lids, and the second one keeps flicking shut in fear. It's clutching a little bell gone green with age like it'll never let go." }
          - { tr: "Arkanda metal sesleri. Lonca'nın öncü avcıları girişte, silahları çocuğa doğrulmuş: \"Kapıdan canavar çıktı!\" Aralarından Sessiz Ağ'ın bir teknisyeni bağırıyor: \"Ateş etmeyin! O bir veri!\"", en: "Metal clicks behind you. The Guild's lead hunters are in the doorway, weapons trained on the kid: \"Monster out of the Gate!\" One of the Quiet Network techs shoves between them: \"Don't shoot! That's data!\"" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Çocuğun seviyesi yok. Sıfır değil; yok. Sistem onun üstünde hiçbir şey göstermiyor, sanki orada kimse durmuyormuş gibi.", en: "The kid has no level. Not zero. None. The System shows nothing over its head, like nobody's standing there at all." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem'i yok. toplanmış. bu çocuk hasattan geriye kalan. ve seni gördü; ışıldıyorsun.", en: "no System. it's been collected. this kid is what's left after a harvest. and it saw you. you're glowing." }
        secenekler:
          - id: "koru"
            etiket: { tr: "Çocukla silahların arasına geç", en: "Step between the kid and the guns" }
            etkiler:
              - bayrak: "tilu_korundu"
              - ahlak: { merhamet: 6, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - dikkat: 3
              - tohum: { olay: "batik_tilu", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Başka bir dünyadan gelen ilk yolcu bir çocuktu ve sen onunla insanların silahları arasında durdun.", en: "The first traveler from another world was a child, and you stood between it and humanity's guns." }
            sonraki: "gecit_korundu"
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Avcılara tek bir bakış at; silahlar insin", en: "Give the hunters one look. Guns down" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - bayrak: "tilu_korundu"
              - aciga_vur: true
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { lonca: 3, siginak: 3 }
              - tohum: { olay: "batik_tilu", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Bir bakışla bir avcı birliğinin silahlarını indirdin; o gün Kule'de kimse başka bir dünyadan gelen bir çocuğa ateş etmedi.", en: "One look from you and a whole squad of hunters lowered their guns. Nobody in the Spire shot a child from another world that day." }
            sonraki: "gecit_korundu"
          - id: "ag"
            etiket: { tr: "Ağ'ın teknisyenine bırak; incelesinler", en: "Hand it to the Network. Let them study it" }
            etkiler:
              - bayrak: "tilu_ag_teslim"
              - ahlak: { duzen: 3, merhamet: -3, insanlik: -1 }
              - itibar: { sessiz_ag: 6 }
              - tohum: { olay: "batik_tilu", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Başka bir dünyadan gelen ilk çocuğu bir teknisyenin battaniyesine sardın ve bir deney masasına gönderdin.", en: "You wrapped the first child from another world in a tech's blanket and sent it off to a lab table." }
            sonraki: "gecit_ag"
          - id: "karisma"
            etiket: { tr: "Karışma; avcılar karar versin", en: "Stay out of it. Let the hunters decide" }
            etkiler:
              - bayrak: "tilu_vuruldu"
              - ahlak: { merhamet: -8, insanlik: -4 }
              - itibar: { lonca: 3, siginak: -5 }
            kronik: { tr: "Kule'nin ellinci katında bir çocuğun vurulmasını seyrettin; Batık Takımada'nın çanları o gün yas için çaldı.", en: "On the Spire's fiftieth floor, you watched a child get shot. The bells of the Drowned Reach rang for mourning that day." }
            sonraki: "gecit_vuruldu"

      - id: "gecit_korundu"
        yer: "kule"
        paragraflar:
          - { tr: "Çocuk arkana saklanıp ceketinin eteğini iki eliyle yakalıyor. Avcılar bir süre daha nişan alıyor, sonra birer birer namlularını indiriyor; içlerinden biri yere tükürüp merdivenlere dönüyor.", en: "The kid ducks behind you and grabs the hem of your jacket with both hands. The hunters hold their aim a while longer, then one by one the barrels come down. One of them spits on the floor and heads back to the stairs." }
          - { tr: "Çocuk dilini damağında tıklatarak konuşuyor; Sistem cümleyi yarım yamalak çeviriyor: [Çeviri: kısmi] \"Seviyeli. Sen seviyelisin. Başakçı seni duyacak.\" Sonra çanı avucuna bırakıyor, sanki borcunu ödüyormuş gibi.", en: "The kid talks by clicking its tongue against the roof of its mouth, and the System half-translates: [Translation: partial] \"Leveled. You're leveled. The Gleaner will hear you.\" Then it drops the bell into your palm, like it's settling a debt." }
          - { tr: "Su kapısına dönmüyor. Dönmek istemediği o kadar belli ki kimse ona zorlamıyor.", en: "It won't go back through the water door. It's so obvious it doesn't want to that nobody tries to make it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bana ver onu. Hipotermide, korkuyor ve bizim havamız ona ağır geliyor. Sonra kahraman olursun.\"", en: "\"Give the kid to me. Hypothermic, scared, and our air's too heavy for it. You can be a hero later.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onu aşağıdaki Sığınak çadırına götür", en: "Take it to the Haven tent downstairs" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Başka bir dünyanın çocuğunu Kule Dibi'ndeki bir sahra çadırına emanet ettin; çadır o geceden sonra hiç boş kalmadı.", en: "You left another world's child in a field tent in Spire Plaza. After that night, the tent was never empty again." }
            sonraki: "gecit_karar"
          - id: "yanina"
            etiket: { tr: "Onu yanında tut; eve sen götüreceksin", en: "Keep it with you. You'll take it home" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { merhamet: 4, duzen: -1 }
            kronik: { tr: "Başka bir dünyanın çocuğuna onu eve senin götüreceğine söz verdin.", en: "You promised a child from another world you'd be the one to take it home." }
            sonraki: "gecit_karar"

      - id: "gecit_ag"
        yer: "kule"
        paragraflar:
          - { tr: "Teknisyen çocuğu gümüş renkli bir termal battaniyeye sarıyor, bileğine bir sensör bağlıyor. Çocuk karşı koymuyor; yalnızca çanı göğsüne bastırıyor.", en: "The tech wraps the kid in a silver thermal blanket and straps a sensor to its wrist. It doesn't fight. It just presses the bell to its chest." }
          - { tr: "Merdivenlerin başında dönüp sana bakıyor. İkinci göz kapağı kapanıyor ve öyle kalıyor.", en: "At the top of the stairs it turns to look at you. Its second eyelid slides shut and stays that way." }
          - { tr: "\"Kimseye zarar gelmeyecek,\" diyor teknisyen, sana değil kendine söylüyormuş gibi. \"Yalnızca ölçeceğiz.\"", en: "\"Nobody's getting hurt,\" the tech says, like he's telling himself instead of you. \"We're just going to take some measurements.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Çocuğa bir gün geri döneceğini söyle", en: "Tell the kid you'll come back for it" }
            etkiler:
              - ahlak: { merhamet: 2 }
            kronik: { tr: "Ağ'a teslim ettiğin çocuğa geri döneceğini söyledin; o seni bekledi.", en: "You told the child you handed to the Network that you'd come back. It waited for you." }
            sonraki: "gecit_karar"
          - id: "don"
            etiket: { tr: "Arkanı dön; işin bitti", en: "Turn around. You're done here" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Ağ'ın götürdüğü çocuğa arkanı döndün ve bir daha düşünmemeye çalıştın.", en: "You turned your back on the child the Network took and tried not to think about it again." }
            sonraki: "gecit_karar"

      - id: "gecit_vuruldu"
        yer: "kule"
        paragraflar:
          - { tr: "Silah sesi kubbede üç kez yankılanıyor. Çocuk geriye, su kapısının içine düşüyor ve kapı onu bir damla gibi yutuyor.", en: "The shot echoes three times around the dome. The kid falls backward into the water door, and the door swallows it like a drop of rain." }
          - { tr: "Kapının yüzeyi bir an pembeleşiyor, sonra yeniden berraklaşıyor. Derinlerdeki çanlar susuyor; yerlerine tek, ağır bir çan, aralıklarla, çalmaya başlıyor.", en: "For a moment the door's surface goes pink. Then it clears. The bells deep inside go quiet, and in their place one heavy bell starts tolling, slow and spaced out." }
          - { tr: "Avcılardan biri omzunu silkiyor: \"Canavardı.\" Yerde, kubbenin taşında, küçük, yeşile çalmış bir çan duruyor.", en: "One of the hunters shrugs. \"It was a monster.\" On the stone floor of the dome lies a small bell, gone green with age." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Katman ziyaretçisi öldü]", en: "[Layer visitor deceased]" }
            satirlar:
              - { tr: "Diplomatik kayıt oluşturuldu. Kayıt, ziyaretçinin Katmanı'na iletildi.", en: "Diplomatic record created. Record forwarded to the visitor's Layer." }
        secenekler:
          - id: "can"
            etiket: { tr: "Çanı yerden al", en: "Pick the bell up off the floor" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Vurulan çocuğun çanını yerden aldın ve yanında taşıdın; bazı yerlerde bu, bir itiraf gibi okundu.", en: "You picked up the shot child's bell and carried it with you. In some places that read like a confession." }
            sonraki: "gecit_karar"
          - id: "silah"
            etiket: { tr: "Ateş edenin tüfeğini elinden al ve kır", en: "Take the shooter's rifle and snap it" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 2 }
              - itibar: { lonca: -4 }
              - dikkat: 2
            kronik: { tr: "Çocuk vurulduktan sonra tüfeği kırdın; geç kalan öfke kimseyi geri getirmedi ama avcılar seni unutmadı.", en: "You broke the rifle after the child was already shot. Late anger brought no one back, but the hunters didn't forget it." }
            sonraki: "gecit_karar"

      - id: "gecit_karar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşam olduğunda Kule Dibi bir pazar yerinden çok bir mahkeme salonuna benziyor. Lonca, Sığınak, Sessiz Ağ ve Yükselenler'in sözcüleri merdivenlerin dibinde bağırışıyor: geçit kimin, kim geçecek, kim geçemeyecek.", en: "By evening, Spire Plaza looks less like a market and more like a courtroom. Spokespeople from the Guild, the Haven, the Quiet Network and the Ascended are shouting at each other at the foot of the stairs: whose gate is it, who goes through, who doesn't." }
          - { tr: "Sonra biri seni görüyor ve bağırışlar duruyor. Kimse söylemiyor ama herkes biliyor: bu meydanda geçitten geçip başka bir dünyanın havasını soluyan ve hiç yorulmamış görünen tek kişi sensin.", en: "Then somebody spots you, and the shouting stops. Nobody says it, but everybody knows: you're the only person in this plaza who went through that gate, breathed another world's air and doesn't look the least bit tired." }
          - metin: { tr: "Kasaba Çekirdeği sana bağlı. Hiçbiri bunu yüksek sesle söylemese de, kararın son sözü zaten senin.", en: "The Town Core is bound to you. Nobody says it out loud, but the last word on this was always going to be yours." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Kalabalığın arasında siyah bir ceket kıpırdıyor. {npc:aras_kurt} geçide bakıyor; sana değil. Bu, onun için yeni bir şey.", en: "A black jacket shifts in the crowd. {npc:aras_kurt} is looking at the gate, not at you. That's new for him." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
        secenekler:
          - id: "acik"
            etiket: { tr: "Geçit herkese açık kalsın", en: "The gate stays open to everyone" }
            etkiler:
              - bayrak: "gecit_herkese_acik"
              - ahlak: { duzen: -6, insanlik: 2 }
              - itibar: { sessiz_ag: 4, yukselenler: 3, lonca: -3 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Geçidi herkese açık bıraktın; insanlar başka dünyalara, başka dünyalar da insanlara aynı kapıdan yürüdü.", en: "You left the gate open to everyone. Humans walked out into other worlds, and other worlds walked in through the same door." }
            sonraki: "gecit_son"
          - id: "denetim"
            etiket: { tr: "Lonca nöbet tutsun; geçiş izinle olsun", en: "The Guild stands watch. Passage by permit" }
            etkiler:
              - bayrak: "gecit_denetimli"
              - ahlak: { duzen: 6, merhamet: -2 }
              - itibar: { lonca: 6, siginak: -2, sessiz_ag: -2 }
              - degisken: { kadim_tehdit: -2 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Geçide nöbetçi ve izin kâğıdı koydun; çok-evrene giden yol bir gümrük kapısına döndü.", en: "You put guards and permits on the gate. The road to the multiverse turned into a customs checkpoint." }
            sonraki: "gecit_son"
          - id: "benim"
            etiket: { tr: "Geçidi mühürle; yalnızca sen geçeceksin", en: "Seal the gate. Only you go through" }
            etkiler:
              - bayrak: "gecit_oyuncunun"
              - ahlak: { duzen: 3, insanlik: -4 }
              - itibar: { lonca: -2, siginak: -2, sessiz_ag: -3, yukselenler: 2 }
              - dikkat: 5
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 2, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Çok-evrenin kapısının anahtarını cebine koydun; insanlık başka dünyaları yalnızca senin anlattıklarından tanıdı.", en: "You pocketed the key to the multiverse. Humanity only knew other worlds from the stories you brought back." }
            sonraki: "gecit_son"

      - id: "gecit_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı Kule'nin ellinci katı hâlâ ışıldıyor; şehrin yeni bir yıldızı varmış gibi. Meydanda kimse uyumuyor.", en: "At midnight the Spire's fiftieth floor is still glowing, like the city picked up a new star. Nobody in the plaza is sleeping." }
          - { tr: "Bir yerlerden, çok uzaktan, rüzgâr bir çan sesi getiriyor. Bir yerlerden pirinç tartıların şıngırtısı. Ve mühürlü kapının ardından hiçbir şey; bekleyen bir şeyin sessizliği.", en: "From somewhere far off, the wind carries the sound of a bell. From somewhere else, the clink of brass scales. And from behind the sealed door, nothing at all: the silence of something waiting." }
          - metin: { tr: "Bu gece kapının öbür yanındaki bir dünyada, adını bilmediğin bir anne bir çanı tek başına çalıyor.", en: "Tonight, in a world on the other side of that door, a mother whose name you don't know is ringing a bell all by herself." }
            kosul: { bayrak: "tilu_vuruldu" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Işığa bak ve yarını düşün", en: "Watch the light and think about tomorrow" }
            etkiler:
              - xp_seviye: 40
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Çok-evren açıldığı gece ellinci kattaki ışığa bakıp yarını düşündün; yarın, üç ayrı dünyada seni bekliyordu.", en: "The night the multiverse opened, you watched the light on the fiftieth floor and thought about tomorrow. Tomorrow was waiting for you in three different worlds." }
            sonraki: "@akis"

  # ================================================================== BATIK TAKIMADA (Nehhalar · Hasat'ın aynası)
  - id: "batik_ilk_adim"
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak_yok: "batik_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "batik", "kesif"]
    gerilim: 2
    kart: { tr: "Tuzlu kapı", en: "The salt door" }
    sahne: "batik_ilk_1"
    sahneler:
      - id: "batik_ilk_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısından geçtiğin an dizlerine kadar ılık bir denize basıyorsun. Gökyüzü fazla büyük, güneş fazla beyaz ve ufka kadar her yer su.", en: "The moment you step through the water door, you're knee-deep in a warm sea. The sky's too big, the sun's too white, and it's water all the way to the horizon." }
          - { tr: "Sudan kuleler yükseliyor; yarısı batmış, yeşile çalmış çan kuleleri. Her dalga geldiğinde içlerindeki çanlar kendiliğinden çalıyor ve bütün takımada bir nefes gibi aynı anda inliyor.", en: "Towers jut out of the water: half-drowned bell towers gone green with age. Every time a wave rolls in, the bells inside them ring on their own, and the whole archipelago moans at once, like one long breath." }
          - { tr: "Sistem sessiz. Pencereni açıyorsun; açılıyor, ama her şey bir bardağın dibinden okunuyormuş gibi bulanık.", en: "The System is quiet. You open your window, and it opens, but everything in it looks blurry, like you're reading it through the bottom of a glass." }
          - metin: { tr: "En yakın kulenin kemerine kırmızı bir bez ve küçük deniz kabuklarından bir kolye bağlanmış. Su kapısının bu yanında, suyun üstünde hâlâ soluk pembe bir iz yüzüyor.", en: "Somebody's tied a red rag and a little necklace of seashells to the arch of the nearest tower. On this side of the water door, a faint pink stain still floats on the surface." }
            kosul: { bayrak: "tilu_vuruldu" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[KATMAN ANALİZİ: Ilunnar]", en: "[LAYER ANALYSIS: Ilunnar]" }
            satirlar:
              - { tr: "Durum: hasat edildi. Hasat tarihi: 212 yıl önce.", en: "Status: harvested. Harvest date: 212 years ago." }
              - { tr: "Yaşayan seviye: tespit edilemedi.", en: "Living levels: none detected." }
              - { tr: "Uyarı: ziyaretçinin seviyesi bu Katman'da tek ışık kaynağıdır.", en: "Warning: the visitor's level is the only light source in this Layer." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Suyun altında sokaklar var. Kaldırım taşları, bir çeşmenin kenarı, bir okul bahçesinin yarısı. Bu bir deniz değil; boğulmuş bir kıta.", en: "There are streets under the water. Cobblestones, the rim of a fountain, half a schoolyard. This isn't a sea. It's a drowned continent." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burada Sistem'in sesi yok. her şey toplanmış. ilk kez kendimi bu kadar net duyuyorum ve bu hiç hoşuma gitmiyor.", en: "no System voice here. everything's been collected. it's the first time i can hear myself this clearly, and i don't like it at all." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu ses. Bütün bu çanlar. Sanki biri hâlâ yardım çağırıyor ama artık kimin geleceğini unutmuş.\"", en: "\"That sound. All those bells. It's like somebody's still calling for help, but they forgot who they were calling.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Hasat edilmiş bir dünya. Demek bizim de son sayfamız buna benziyor.\"", en: "\"A harvested world. So this is what our last page looks like.\"" }
        secenekler:
          - id: "kule"
            etiket: { tr: "En yakın çan kulesine doğru yürü", en: "Wade toward the nearest bell tower" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
            sonraki: "batik_ilk_sal"
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Suyun altındaki sokakları bir haritaya dök", en: "Map the streets under the water by eye" }
            gerekli: { stat: { per: 140 } }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - xp_seviye: 15
              - egilim: { gizlilik: 2 }
            sonraki: "batik_ilk_harita"
          - id: "tirman"
            etiket: { tr: "En yüksek kuleye tırman, takımadayı gör", en: "Climb the tallest tower. Get eyes on the Reach" }
            zar: { stat: "agi", zorluk: 380, tek: false, basarisiz: "batik_ilk_dusus", basarisiz_etkiler: [{ can: -60 }] }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - xp_seviye: 10
            sonraki: "batik_ilk_tepe"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} Sistem'in neden sustuğunu sor", en: "Ask {npc:yanki} why the System went quiet" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - iliski: { yanki: { guven: 5, baglilik: 3 } }
            sonraki: "batik_ilk_yanki"

      - id: "batik_ilk_harita"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Gözlerini kısıyorsun ve dünya katman katman açılıyor. Kıyıda bir liman, limanın arkasında yokuş yukarı tırmanan bir çarşı, çarşının tepesinde kubbeli bir yapı; hepsi on kulaç suyun altında.", en: "You narrow your eyes, and the world peels open layer by layer. A harbor at the shore, a market climbing the hill behind it, a domed building at the top, all of it sixty feet underwater." }
          - { tr: "Kulelerin dizilişi rastgele değil. Her biri bir zamanlar bir mahallenin ortasındaymış; çanlar, mahalleler birbirini duyabilsin diye.", en: "The towers aren't scattered at random. Each one used to stand in the middle of a neighborhood, so the neighborhoods could hear each other." }
          - { tr: "Kubbenin içinde bir hava cebi parlıyor. Ve doğuda, en uzak kulenin dibinde, bir ateşin dumanı.", en: "There's a pocket of air shining inside that dome. And to the east, at the foot of the farthest tower, smoke from a fire." }
        secenekler:
          - id: "duman"
            etiket: { tr: "Dumanın olduğu yöne git", en: "Head toward the smoke" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_dusus"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kulenin yeşil bronz basamakları üçüncü katta elinde ufalanıyor ve suya, sırtının üstüne düşüyorsun. Dibe değmeden bir şey gözüne çarpıyor: aşağıda, sokakların arasında, cam gibi parlayan uzun bir şey ağır ağır kıpırdıyor.", en: "The tower's green bronze rungs crumble in your hand on the third floor, and you go into the water flat on your back. Before you hit bottom, something catches your eye: down between the streets, something long and glassy is moving, slow." }
          - { tr: "Su yüzüne çıktığında kıpırtı gitmiş. Ama göğsünde, pencerenin kenarında, bir anlığına kırmızı bir satır yanıp sönmüş: [Okundu.]", en: "By the time you break the surface, the movement's gone. But for a second, at the edge of your window, a red line blinked: [Read.]" }
        secenekler:
          - id: "yuz"
            etiket: { tr: "Kıyıya yüz; dumanın olduğu yere", en: "Swim for the shore. Toward the smoke" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_tepe"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kulenin tepesinde çanın kendisi duruyor: bir ev kadar büyük, içi kuş yuvası dolu. Buradan bakınca takımada bir harita gibi; yüzlerce kule, aralarında sığ sular, kum dilleri.", en: "The bell itself hangs at the top of the tower, big as a house and full of bird nests. From up here the archipelago looks like a map: hundreds of towers, shallow water between them, spits of sand." }
          - { tr: "Doğuda, en uzaktaki kulenin çevresinde tuz bloklarından bir sal köyü var. Batıda deniz koyulaşıyor; orada hiç kule yok ve suyun rengi yanlış.", en: "To the east, around the farthest tower, there's a village of rafts built from salt blocks. To the west, the sea gets darker. No towers there, and the water's the wrong color." }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Batıdaki koyu suyun içinde belli belirsiz ışıklar yanıp sönüyor; sanki aşağıda biri yüzlerce pencereyi aynı anda kapatıp açıyor.", en: "Faint lights blink in that dark water to the west, like somebody down there is opening and closing hundreds of windows at once." }
        secenekler:
          - id: "dogu"
            etiket: { tr: "Doğudaki sal köyüne in", en: "Climb down and head for the raft village" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_yanki"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:yanki}: çünkü dinleyecek kimse kalmadı. Sistem burada işini bitirdi, toparlandı ve gitti. ama bir şey unuttu.", en: "{npc:yanki}: because there's nobody left to listen. the System finished its job here, packed up and left. but it forgot something." }
          - { tr: "Bir süre yalnızca dalgaların ve çanların sesi. Sonra, çok daha alçak bir satır.", en: "For a while there's only the sound of waves and bells. Then a much quieter line." }
          - { tr: "{npc:yanki}: ne unuttuğunu bilmiyorum. ama bilmek istemediğimi biliyorum. doğuda duman var. insanlara benzeyen şeyler.", en: "{npc:yanki}: i don't know what it forgot. but i know i don't want to know. there's smoke to the east. things that look like people." }
        secenekler:
          - id: "git"
            etiket: { tr: "Dumanın peşine düş", en: "Follow the smoke" }
            sonraki: "batik_ilk_sal"

      - id: "batik_ilk_sal"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Doğudaki kulenin dibinde tuz bloklarından yapılmış bir salın üstünde dört kişi ağ topluyor. İnce, gri-mavi tenli, omuzları tuz lekeli, parmakları perdeli insanlar; ama kaburgaları her nefeste sayılabiliyor.", en: "At the foot of the eastern tower, four people are hauling a net onto a raft made of salt blocks. Thin, blue-gray skin, salt-freckled shoulders, webbed fingers. People, more or less, and you can count their ribs with every breath." }
          - { tr: "Seni gördükleri an ağı bırakıyorlar. Biri, yaşlıca bir kadın, dizlerinin üstüne çöküyor; ötekiler kemik uçlu zıpkınlarını kaldırıyor.", en: "The moment they see you they drop the net. One of them, an older woman, falls to her knees. The others raise bone-tipped harpoons." }
          - { tr: "Analiz penceren açılıyor ve kapanıyor, açılıyor ve kapanıyor. Dördünün de başının üstünde aynı şey yazıyor: [Seviye: —]", en: "Your Analysis window opens and closes, opens and closes. Over all four heads it shows the same thing: [Level: —]" }
          - metin: { tr: "Zıpkınların ucu doğrudan sana dönük. Kadınlardan biri ağlıyor ve aynı kelimeyi tekrarlıyor; Sistem çevirmeye tenezzül etmiyor ama anlamak için çeviriye gerek yok.", en: "The harpoon points are aimed straight at you. One of the women is crying and repeating the same word. The System doesn't bother translating it, but you don't need a translation." }
            kosul: { bayrak: "tilu_vuruldu" }
        sezgiler:
          - kosul: { stat: { int: 140 } }
            metin: { tr: "Seviyeleri sıfır değil; tanımsız. Sistem onları artık bir kayıt olarak bile tutmuyor. Hasat yalnızca güçlerini değil, sayılmayı da almış.", en: "Their levels aren't zero. They're undefined. The System doesn't even keep them on file anymore. The Harvest didn't just take their power. It took being counted." }
        secenekler:
          - id: "eller"
            etiket: { tr: "Ellerini aç, yavaşça yaklaş", en: "Open your hands. Come in slow" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "batik_ilk_temas"
          - id: "konus"
            tur: "gosteris"
            etiket: { tr: "Konuş; sesin bütün kuleleri titretsin", en: "Speak, and let your voice shake every tower" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - bayrak: "batik_tanri_sanildi"
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { insanlik: -3 }
            sonraki: "batik_ilk_donen"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Pencereni karart; onlardan biri gibi görün", en: "Dim your window. Look like one of them" }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "batik_ilk_temas"
          - id: "geri"
            etiket: { tr: "Geri çekil; onları rahat bırak", en: "Back off. Leave them in peace" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "batik_ilk_gece"

      - id: "batik_ilk_donen"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sesin suyun üstünden yayılıyor ve en yakın üç kulenin çanı aynı anda çalıyor. Zıpkınlar teker teker suya düşüyor.", en: "Your voice rolls out across the water, and the bells in the three nearest towers ring at once. The harpoons drop into the water one by one." }
          - { tr: "Diz çöken kadın başını kaldırıyor. Sistem bu kez çeviriyor: [Çeviri: kısmi] \"Dönen. Çanların söylediği gibi. Seviyeli olan bir gün dönecek ve son çanı çalacak.\"", en: "The kneeling woman lifts her head. This time the System translates: [Translation: partial] \"The Returner. Like the bells said. One with a level will come back one day and ring the last bell.\"" }
          - { tr: "Salın ucundaki genç bir adam suya tükürüyor. \"Seviyeli olan her şey Başakçı'yı çağırır, Saye,\" diyor. \"Dönen değil bu. Yem.\"", en: "A young man at the end of the raft spits into the water. \"Anything with a level calls the Gleaner, Saye,\" he says. \"That's no Returner. That's bait.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Sustur onu; evet, sen Dönen'sin", en: "Shut him up. Yes, you're the Returner" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - dikkat: 2
            sonraki: "batik_ilk_temas"
          - id: "red"
            etiket: { tr: "Tanrı olmadığını söyle", en: "Tell them you're no god" }
            etkiler:
              - bayrak_kaldir: "batik_tanri_sanildi"
              - ahlak: { insanlik: 4 }
            sonraki: "batik_ilk_temas"
          - id: "basakci"
            etiket: { tr: "Gence Başakçı'nın ne olduğunu sor", en: "Ask the young one what the Gleaner is" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "batik_ilk_temas"

      - id: "batik_ilk_temas"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yaşlı kadın, Saye, avucunu suya batırıyor, sonra ıslak avucunu alnına bastırıyor. Selam bu. Senin de aynısını yapmanı bekliyor.", en: "The old woman, Saye, dips her palm in the water, then presses the wet palm to her forehead. It's a greeting. She's waiting for you to do the same." }
          - { tr: "Konuştukça Sistem çeviriyi toparlıyor. Onlar Nehha. Bu dünyanın adı Ilunnar'dı; iki yüz on iki yıl önce bir gece Hasat geldi, bütün seviyeleri topladı ve gitti. Sonra denizler yükseldi, çünkü kıyıları tutan büyüyü de götürmüştü.", en: "The more they talk, the better the System gets at translating. They're the Nehha. This world was called Ilunnar. Two hundred and twelve years ago, one night, the Harvest came, collected every level and left. Then the seas rose, because it took the magic holding the shorelines too." }
          - { tr: "\"Geride kalanlara Sönükler diyoruz,\" diyor Saye. \"Bizim gibi. Ve bir de Başakçı kaldı; Hasat'ın unuttuğu şey. Seviyesi olan ne varsa bulur. Sen, ışıldıyorsun.\"", en: "\"We call the ones left behind the Dimmed,\" Saye says. \"Like us. And the Gleaner was left, too, the thing the Harvest forgot. It finds anything with a level. And you, you're shining.\"" }
          - metin: { tr: "Genç adam, Kesh, zıpkınını hâlâ bırakmamış. \"Kapının öbür yanında bir çocuğumuz vuruldu,\" diyor. \"Senin dünyanda. Bunu da çeviriyor mu o kutun?\"", en: "The young one, Kesh, still hasn't put his harpoon down. \"One of our children got shot on the other side of that door,\" he says. \"In your world. Does your little box translate that too?\"" }
            kosul: { bayrak: "tilu_vuruldu" }
          - metin: { tr: "\"Kapıdan bir çocuğumuz geçti,\" diyor Saye, gözleri senin yüzünde. \"Tilu. Bir çan götürmüştü yanında. Gördün mü onu?\"", en: "\"One of our children went through the door,\" Saye says, eyes on your face. \"Tilu. Took a bell along. Did you see her?\"" }
            kosul: { bayrak_yok: "tilu_vuruldu" }
        secenekler:
          - id: "selam"
            etiket: { tr: "Suya, sonra alnına dokun", en: "Touch the water, then your forehead" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 } }
            sonraki: "batik_ilk_gece"
          - id: "tilu"
            etiket: { tr: "Tilu'nun güvende olduğunu söyle", en: "Tell her Tilu is safe" }
            goster: { bayrak: "tilu_korundu" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 2 } }
            sonraki: "batik_ilk_gece"
          - id: "ozur"
            etiket: { tr: "Kesh'in gözüne bak ve özür dile", en: "Look Kesh in the eye and apologize" }
            goster: { bayrak: "tilu_vuruldu" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 2, max: 4 } }
            sonraki: "batik_ilk_gece"
          - id: "fener"
            etiket: { tr: "Sönüklerin nerede toplandığını sor", en: "Ask where the Dimmed gather" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 2 } }
            sonraki: "batik_ilk_gece"

      - id: "batik_ilk_gece"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Güneş, fazla beyaz güneş, denize gömülürken çanlar yavaşlıyor. Gece düşüyor ve bu dünyanın gecesinde yıldız az; çoğunun da çok uzun zaman önce söndüğünü hissediyorsun.", en: "As the sun, that too-white sun, sinks into the sea, the bells slow down. Night falls, and this world's night doesn't have many stars. You get the feeling most of them went out a long time ago." }
          - { tr: "Batıda, koyu suların altında, ışıklar yanıp sönüyor. Bir değil, yüzlerce; minicik, mavi, dikdörtgen ışıklar. Pencereler.", en: "Out west, under the dark water, lights are blinking. Not one: hundreds. Tiny, blue, rectangular lights. Windows." }
          - { tr: "Işıklar bir süre bir yöne akıyor, sonra duruyor. Sana doğru dönmüş gibiler.", en: "For a while the lights drift one way. Then they stop. Like they've turned toward you." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Seviye taraması algılandı]", en: "[Level scan detected]" }
            satirlar:
              - { tr: "Kaynak: tanımsız. Sınıflandırma: Hasat artığı.", en: "Source: undefined. Classification: Harvest remnant." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Işıklara bakmaya devam et", en: "Keep watching the lights" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"
          - id: "karart"
            tur: "gizle"
            etiket: { tr: "Pencereni kapat ve kulenin gölgesine çekil", en: "Close your window. Get into the tower's shadow" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SON FENER (önemli)
  - id: "batik_son_fener"
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "batik", "ahlak"]
    gerilim: 3
    onemli: true
    kart: { tr: "Son Fener", en: "The Last Light" }
    sahne: "fener_1"
    sahneler:
      - id: "fener_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kesh seni buluyor; zıpkınını sırtına asmış, nefes nefese. \"Bekçi seni çağırıyor,\" diyor. Onu takımadanın doğusuna, Son Fener'e kadar izliyorsun.", en: "Kesh finds you, harpoon slung across his back, out of breath. \"The keeper's asking for you,\" he says. You follow him to the east end of {yer:batik_takimada}, to the Last Light." }
          - { tr: "Son Fener, batmış bir deniz fenerinin denizden çıkan son on katı. Tepesindeki lamba mana değil balık yağı yakıyor; ışığı sarı, titrek ve inatçı.", en: "The Last Light is the top ten floors of a drowned lighthouse, the only part still above water. The lamp up top doesn't burn mana; it burns fish oil. The light is yellow, shaky and stubborn." }
          - { tr: "Fenerin dibinde, tuz bloklarından sallar birbirine bağlanmış ve üstlerinde iki yüz kadar Sönük yaşıyor. Hiçbirinin gözleri havada bir pencere aramıyor; unutmuşlar.", en: "Rafts of salt blocks are lashed together at its base, and about two hundred of the Dimmed live on them. None of their eyes go looking for a window in the air anymore. They've forgotten how." }
          - { tr: "Salların birinde çocuklar oyun oynuyor. Biri havaya parmağıyla bir kare çiziyor, ötekiler bağırıyor: \"Seviye on! Seviye yirmi!\" Oyunun adını sormana gerek yok.", en: "On one of the rafts some kids are playing a game. One of them draws a square in the air with a finger, and the others shout: \"Level ten! Level twenty!\" You don't need to ask what the game's called." }
          - metin: { tr: "Merdivenlerin iki yanına dizilmişler. Sen geçerken başlarını eğiyor, aynı kelimeyi fısıldıyorlar: Dönen.", en: "They've lined up on both sides of the stairs. As you pass, they bow their heads and whisper the same word: Returner." }
            kosul: { bayrak: "batik_tanri_sanildi" }
          - metin: { tr: "Annelerden bazıları sen yaklaşınca çocuklarını salın öbür ucuna çekiyor ve sırtlarını dönüyor. Kapıda olanı biliyorlar.", en: "Some of the mothers pull their kids to the far end of the raft when you come close, and turn their backs. They know what happened at the door." }
            kosul: { bayrak: "tilu_vuruldu" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Ağlar boş. Sal köyünün yarım mil çevresinde tek bir balık yok; bir şey onları buradan uzak tutuyor ya da hepsini yemiş.", en: "The nets are empty. There's not one fish within half a mile of this raft village. Something's keeping them away, or something ate them all." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar sizin olabilirdiniz. bunu söylemek zorunda olduğum için üzgünüm. ama olabilirdiniz.", en: "this could be you. i'm sorry i have to say it. but this could be you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çocukların yarısı yetersiz beslenmiş, yaşlıların hepsi. Hasat bitmemiş burada; yalnızca yavaşlamış.\"", en: "\"Half these kids are malnourished, and every one of the elders. The Harvest isn't over here. It just slowed down.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O oyun. 'Seviye on.' Bizim çocuklar da öyle oynuyor artık. Fark ettin mi?\"", en: "\"That game. 'Level ten.' Our kids play it too now. Did you notice?\"" }
        secenekler:
          - id: "cik"
            etiket: { tr: "Fenerin bekçisine çık", en: "Climb up to the keeper of the light" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - ahlak: { duzen: 1 }
            kronik: { tr: "Son Fener'in bekçisine çıktın ve hasat edilmiş bir dünyanın son sözlerini dinledin.", en: "You climbed up to the keeper of the Last Light and heard a harvested world's last words." }
            sonraki: "fener_bekci"
          - id: "erzak"
            etiket: { tr: "Çantandaki erzakı çocuklara dağıt", en: "Hand out your rations to the kids" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - kredi: -150
              - ahlak: { merhamet: 5, insanlik: 2 }
            kronik: { tr: "Son Fener'in çocuklarına kendi erzakını dağıttın; o hafta sallarda kimse aç uyumadı.", en: "You handed your own rations out to the children of the Last Light. Nobody on those rafts went to bed hungry that week." }
            sonraki: "fener_bekci"
          - id: "lamba"
            tur: "gosteris"
            etiket: { tr: "Lambaya kendi ışığını ver", en: "Feed the lamp your own light" }
            gerekli: { stat: { int: 170 } }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "batik_fener_goruldu"
              - bayrak: "batik_lamba_yakildi"
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { merhamet: 3, insanlik: -2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Son Fener'in lambasını kendi manana bağladın; iki yüz yıl sonra ilk kez bütün takımada aydınlandı ve karanlıktaki şey de bunu gördü.", en: "You tied the Last Light's lamp to your own mana. For the first time in two hundred years the whole archipelago lit up, and the thing in the dark saw it too." }
            sonraki: "fener_lamba"

      - id: "fener_lamba"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Avucunu lambanın camına dayıyorsun ve mana kolundan akıyor. Sarı alev bir an söner gibi oluyor, sonra beyaz, sonra masmavi bir ışığa dönüşüp bütün takımadayı yalayıp geçiyor.", en: "You lay your palm on the lamp's glass and let the mana run down your arm. The yellow flame almost goes out, then turns white, then a deep blue that sweeps across the entire archipelago." }
          - { tr: "Aşağıda iki yüz kişi aynı anda bağırıyor. Çocuklar havaya kare çizmeyi bırakıp ışığa el sallıyor.", en: "Two hundred people shout at once down below. The kids stop drawing squares in the air and wave at the light instead." }
          - { tr: "Batıda, koyu suyun altında, yüzlerce minik pencere aynı anda yanıyor. Ve bu kez yanıp sönmüyorlar.", en: "To the west, under the dark water, hundreds of tiny windows light up at once. This time they don't blink off." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Bekçinin odasına gir", en: "Go into the keeper's room" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "Fenerin ışığını Başakçı'ya rağmen yaktın ve sonra bekçinin kapısını çaldın.", en: "You lit the Light in spite of the Gleaner, and then you knocked on the keeper's door." }
            sonraki: "fener_bekci"

      - id: "fener_bekci"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Lambanın altındaki dar odada kör, çok yaşlı bir Nehha kadını oturuyor. Kolları hâlâ bir savaşçının kolları; eski yaraların izleri, bir zamanlar bir kılıcın kabzasını tutmaktan şekil almış parmaklar.", en: "In the cramped room under the lamp sits a blind, very old Nehha woman. Her arms are still a fighter's arms: old scars, fingers shaped by years of holding a sword hilt." }
          - { tr: "\"Ben Oru-Venn,\" diyor. \"İki yüz on iki yıl önce bu dünyanın en güçlüsüydüm. Seviyem dört yüz on dokuzdu. Senin kademende bir adı vardı ama artık hatırlamıyorum.\"", en: "\"I am Oru-Venn,\" she says. \"Two hundred and twelve years ago I was the strongest thing on this world. My level was four hundred and nineteen. There was a name for that Grade, but I don't remember it anymore.\"" }
          - { tr: "\"Son yılımızda dört kampa bölündük. Biri kalkan istedi, biri demir, biri ışığa taptı, biri sessizce okudu. Hepimiz hazır olduğumuzu sandık. Bir sabah uyandım ve içim sessizdi.\"", en: "\"In our last year we split into four camps. One wanted a shield, one wanted iron, one worshiped the light, one read quietly in the dark. Every one of us thought we were ready. One morning I woke up and it was quiet inside me.\"" }
          - { tr: "Elini uzatıp yüzüne dokunuyor ve parmakları bir an duruyor. \"Sende iki ses var,\" diyor. \"Bizden birinde de vardı. Arşive git. Ama önce bana bir şey söyle: ne yapacaksın?\"", en: "She reaches out and touches your face, and her fingers stop for a second. \"There are two voices in you,\" she says. \"One of us had that too. Go to the Archive. But first, tell me something: what are you going to do?\"" }
        sezgiler:
          - kosul: { stat: { wis: 140 } }
            metin: { tr: "Kadının gözleri kör ama bakışı tam pencerenin durduğu yere, havada, senin göğsünün önüne sabitlenmiş. Bir zamanlar bir pencere okumayı çok iyi biliyormuş.", en: "The woman's eyes are blind, but her gaze is fixed on exactly the spot in the air in front of your chest where your window hangs. Once upon a time she was very, very good at reading windows." }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "Çocukları kendi dünyama götüreyim", en: "Let me take the children to my world" }
            etkiler:
              - bayrak: "batik_cocuklar_dunyada"
              - ahlak: { merhamet: 8, duzen: -2 }
              - itibar: { siginak: 5, lonca: -2 }
              - dikkat: 3
            kronik: { tr: "Son Fener'in çocuklarını kendi dünyana taşıdın; Kıyıkent'in sokaklarında bir süre perdeli parmaklı çocuklar 'seviye on' oynadı.", en: "You carried the children of the Last Light back to your own world. For a while, kids with webbed fingers played 'level ten' in the streets of Port Harlow." }
            sonraki: "fener_goc"
          - id: "basakci"
            etiket: { tr: "Başakçı'yı öldüreceğim", en: "I'm going to kill the Gleaner" }
            etkiler:
              - bayrak: "batik_basakci_sozu"
              - ahlak: { merhamet: 4, duzen: -2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 4 } }
            kronik: { tr: "Hasat edilmiş bir dünyanın son bekçisine, Hasat'ın geride bıraktığı şeyi öldüreceğine söz verdin.", en: "You promised the last keeper of a harvested world that you'd kill the thing the Harvest left behind." }
            sonraki: "fener_soz"
          - id: "gorunur"
            etiket: { tr: "{npc:yanki} onları Sistem'e yeniden göstersin", en: "Have {npc:yanki} make them visible to the System" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "batik_gorunur"
              - yozlasma: 6
              - ahlak: { merhamet: 4, insanlik: -3 }
              - iliski: { yanki: { guven: 8, baglilik: 5 } }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Kafandaki ses, hasat edilmiş iki yüz kişiyi yeniden Sistem'in kayıtlarına yazdı; birinci seviyeden başladılar ve bu, bir dünyanın sonunda başlayan ilk şeydi.", en: "The voice in your head wrote two hundred harvested people back into the System's records. They started over at level one, and it was the first thing to begin at the end of that world." }
            sonraki: "fener_gorunur"
          - id: "mercek"
            etiket: { tr: "Fenerin merceğini karşılık olarak iste", en: "Ask for the lamp's lens in return" }
            etkiler:
              - bayrak: "batik_fener_soyuldu"
              - ahlak: { merhamet: -8, insanlik: -5 }
              - esya: { tuz_tableti: 3 }
              - oz_kristali: 30
              - xp_seviye: 25
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Son Fener'in merceğini söküp götürdün; hasat edilmiş bir dünyayı ikinci kez hasat eden sen oldun.", en: "You pried the lens out of the Last Light and took it with you. You were the one who harvested a harvested world a second time." }
            sonraki: "fener_soyuldu"
          - id: "hicbir"
            etiket: { tr: "Hiçbir şey vaat etme", en: "Promise nothing" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 3, max: 6 } }
            kronik: { tr: "Son Fener'in bekçisine hiçbir şey vaat etmedin; o da senden hiçbir şey beklemedi ve bu ikinizin de tanıdığı bir sessizlikti.", en: "You promised the keeper of the Last Light nothing. She expected nothing back, and it was a silence you both knew." }
            sonraki: "fener_sessiz"

      - id: "fener_goc"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn uzun süre bir şey söylemiyor. Sonra, \"Senin dünyanda da Hasat gelecek,\" diyor. \"Biliyorum; gözlerin söylüyor. Onları bir yangından ötekine mi taşıyorsun?\"", en: "Oru-Venn doesn't say anything for a long time. Then: \"The Harvest is coming to your world too. I know. Your eyes say so. Are you carrying them out of one fire into another?\"" }
          - { tr: "\"Belki,\" diyorsun. Ve şaşırtıcı biçimde gülümsüyor: \"Belki. Burada 'belki' kalmadı. Al onları.\"", en: "\"Maybe,\" you say. And to your surprise, she smiles. \"Maybe. We're all out of 'maybe' here. Take them.\"" }
          - { tr: "Şafakta otuz yedi çocuk, tuz bloklarından bir salın üstünde, su kapısına doğru yüzüyor. Annelerin hiçbiri ağlamıyor; ağlamayı iki yüz yıl önce bitirmişler.", en: "At dawn, thirty-seven kids float toward the water door on a raft of salt blocks. None of the mothers cry. They finished crying two hundred years ago." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Otuz yedi. Sığınak'ta yer açarız. Yer her zaman açılır; yeter ki biri kapıyı tutsun.\"", en: "\"Thirty-seven. We'll make room at the Haven. There's always room if somebody holds the door.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Salı kapıya sen it", en: "Push the raft to the door yourself" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Otuz yedi çocuğu taşıyan salı kendi ellerinle bir dünyadan ötekine ittin.", en: "With your own hands, you pushed a raft of thirty-seven children from one world into the next." }
            sonraki: "fener_gece"

      - id: "fener_soz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn gülüyor; bu kez acı bir gülüş. \"Ben de söz vermiştim,\" diyor. \"Seviyem dört yüz on dokuzken. Onu yalnızca yaralayabildim; ağına takılan kendi seviyemi seyrettim.\"", en: "Oru-Venn laughs, and it's a bitter laugh this time. \"I made that promise too,\" she says. \"At level four hundred and nineteen. All I managed was to wound it. Then I watched my own level get caught in its net.\"" }
          - { tr: "Masanın altından yeşile çalmış bir çan çıkarıyor ve kucağına koyuyor. \"Çanlar,\" diyor. \"Hasat'tan önce bu dünyada Sistem'e ait olmayan tek ses. Başakçı onları duyunca yönünü kaybeder. Ben çok geç öğrendim.\"", en: "She pulls a green-tarnished bell from under the table and sets it in your lap. \"The bells,\" she says. \"Before the Harvest, the only sound on this world that didn't belong to the System. When the Gleaner hears them, it loses its way. I learned that too late.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Çanı al ve teşekkür et", en: "Take the bell. Thank her" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - bilgi: "basakci_cani"
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın en güçlü savaşçısı sana çanını verdi; sen onun yarım kalan sözünü taşıdın.", en: "A harvested world's greatest fighter gave you her bell, and you carried the promise she never got to keep." }
            sonraki: "fener_gece"

      - id: "fener_gorunur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:yanki} sessizce çalışıyor. Penceren titriyor, harfler geriye doğru akıyor ve aşağıda, sallarda, bir çocuk çığlık atıyor.", en: "{npc:yanki} works in silence. Your window shudders, letters run backward, and down on the rafts, a kid screams." }
          - { tr: "Korkudan değil. Çocuğun başının üstünde, iki yüz yıldır bu dünyada görülmemiş bir şey yanıyor: [Seviye 1]. Sonra bir tane daha. Sonra bir tane daha.", en: "Not out of fear. Over the kid's head, something nobody on this world has seen in two hundred years is glowing: [Level 1]. Then another. Then another." }
          - { tr: "{npc:yanki}: yaptım. onları yeniden saydım. ama dinle: artık sayılıyorlarsa, toplanabilirler de. ben yalnızca ne yaptığımı söylüyorum.", en: "{npc:yanki}: done. i counted them again. but listen: if they're being counted, they can be collected too. i'm just telling you what i did." }
          - { tr: "Oru-Venn'in kör gözlerinden yaşlar akıyor. Kendi başının üstünde hiçbir şey yok; yalnızca çocuklarınkinde.", en: "Tears run out of Oru-Venn's blind eyes. Nothing has appeared over her own head. Only over the children's." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[k̷ayıt geri yüklendi: 204 varlık]", en: "[r̷ecord restored: 204 entities]" }
            satirlar:
              - { tr: "kaynak: yetkisiz. Sistem bunu fark edecek.", en: "source: unauthorized. the System will notice." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bedeli ne olursa olsun, buna değdi", en: "Whatever it costs, it was worth it" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Bir dünyanın sonunda iki yüz dört kişiye yeniden birinci seviye verdin ve bedelini sormadın.", en: "At the end of a world, you gave two hundred and four people level one again, and you didn't ask what it would cost." }
            sonraki: "fener_gece"

      - id: "fener_soyuldu"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Oru-Venn hiçbir şey söylemiyor. Yalnızca başıyla lambayı gösteriyor; sanki 'nasıl istersen' der gibi, sanki bunu daha önce de görmüş gibi.", en: "Oru-Venn doesn't say a word. She just nods toward the lamp, like 'suit yourself,' like she's seen this before." }
          - { tr: "Merceği yuvasından söktüğünde ışık sönüyor. Aşağıdaki iki yüz kişi aynı anda susuyor ve sen merdivenlerden inerken hiçbiri sana bakmıyor.", en: "When you pry the lens out of its housing, the light goes out. Two hundred people go quiet at once down below, and as you come down the stairs, not one of them looks at you." }
          - { tr: "Merceğin içinde yüzlerce yıllık birikmiş mana var; elinde ağır ve sıcak. Sistem bunu bir ganimet olarak sayıyor.", en: "There are centuries of built-up mana inside that lens, heavy and warm in your hands. The System counts it as loot." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Hasat da tam olarak böyle hissettiriyordu. bunu sana söylemem gerektiğini düşündüm.", en: "this is exactly how the Harvest felt. i thought you should know." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk away without looking back" }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Söndürdüğün fenerin altından arkana bakmadan yürüdün.", en: "You walked out from under the light you'd put out and never looked back." }
            sonraki: "fener_gece"

      - id: "fener_sessiz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "\"İyi,\" diyor Oru-Venn. \"Benim zamanımda herkes vaat ederdi. Vaatler bizi kurtarmadı.\"", en: "\"Good,\" Oru-Venn says. \"In my day, everybody made promises. Promises didn't save us.\"" }
          - { tr: "Başını lambaya doğru kaldırıyor, ışığını göremediği halde. \"Arşive git,\" diyor yeniden. \"Bizim yaptığımız hataları oku. Sonra kendi dünyana dön ve onları yapma.\"", en: "She lifts her face toward the lamp even though she can't see it. \"Go to the Archive,\" she says again. \"Read the mistakes we made. Then go back to your world and don't make them.\"" }
        secenekler:
          - id: "arsiv"
            etiket: { tr: "Arşivin yerini sor", en: "Ask where the Archive is" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "batik_tuz_arsivi", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Bir dünyanın son bekçisinden vaat değil, bir adres aldın.", en: "From a world's last keeper you took an address, not a promise." }
            sonraki: "fener_gece"

      - id: "fener_gece"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Gece Son Fener'in dibinde, salların arasında oturuyorsun. Biri sana kurutulmuş yosundan bir dilim uzatıyor; reddetmek ayıp olacak.", en: "That night you sit among the rafts at the foot of the Last Light. Someone passes you a strip of dried seaweed. Turning it down would be rude." }
          - metin: { tr: "Çocukların başlarının üstünde minicik [Seviye 1] yazıları yanıyor. Hiçbiri uyumak istemiyor.", en: "Tiny [Level 1] tags glow over the kids' heads. None of them want to go to sleep." }
            kosul: { bayrak: "batik_gorunur" }
          - metin: { tr: "Lamba sönük. Karanlıkta yalnızca dalgaların ve uzak çanların sesi var; bir de birinin alçak sesle, çok eski bir şarkıyı mırıldanması.", en: "The lamp is dark. There's nothing in the dark but the waves and the distant bells, and somebody humming a very old song, low." }
            kosul: { bayrak: "batik_fener_soyuldu" }
          - { tr: "Batıda, koyu suyun altında, pencere ışıkları biraz daha yakın.", en: "Out west, under the dark water, the window lights are a little closer than before." }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Sabaha kadar nöbet tut", en: "Stand watch till morning" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - xp_seviye: 20
            kronik: { tr: "Hasat edilmiş bir dünyanın son köyünde, sabaha kadar nöbet tuttun.", en: "In the last village of a harvested world, you stood watch until morning." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Kapıya dön; kendi dünyanı düşün", en: "Head back to the door. Think about home" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 15
            kronik: { tr: "Son Fener'den kendi dünyana dönerken Hasat'ın neye benzediğini artık biliyordun.", en: "Walking back from the Last Light to your own world, you knew what the Harvest looked like now." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ TUZ ARŞİVİ
  - id: "batik_tuz_arsivi"
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "batik", "kesif", "sir"]
    gerilim: 3
    kart: { tr: "Tuz Arşivi", en: "The Salt Archive" }
    sahne: "arsiv_1"
    sahneler:
      - id: "arsiv_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yolun sonu seni takımadanın ortasındaki kubbeye getiriyor. Bir zamanlar yokuşlu bir şehrin en tepesindeymiş; şimdi on kulaç suyun altında, içinde gümüş gibi parlayan bir hava cebiyle duruyor.", en: "The road finally brings you to the dome in the middle of {yer:batik_takimada}. It used to crown a hillside city. Now it sits sixty feet underwater, with a pocket of air inside it shining like a silver bubble." }
          - { tr: "Kubbenin girişine, suyun altında, Nehha harfleriyle tek bir satır kazınmış. Sistem çeviriyor: [Bizden sonra gelen, oku. Bizi değil; hatalarımızı.]", en: "Underwater, over the dome's entrance, a single line is carved in Nehha letters. The System translates: [Whoever comes after us, read. Not us. Our mistakes.]" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Girişin dibinde bir şey kıpırdıyor. Beyaz, kırılgan, insan biçimli bir şey; suyun içinde ayakta duruyor ve kubbeyi bekliyor.", en: "Something shifts at the foot of the entrance. White, brittle, human-shaped, standing upright in the water, guarding the dome." }
        secenekler:
          - id: "dal"
            etiket: { tr: "Dal ve kubbenin kapısına yüz", en: "Dive. Swim for the dome's door" }
            etkiler:
              - bolge: "batik_takimada"
              - savas: { dusmanlar: ["tuz_yuruyeni@dunya"], ortam: ["su"], kazan: "arsiv_ic", kaybet: "arsiv_yenilgi", kac: "arsiv_kacis" }
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Suyu ikiye ayır; kubbeye kuru yürü", en: "Split the water. Walk to the dome dry" }
            gerekli: { stat: { int: 180 } }
            etkiler:
              - bolge: "batik_takimada"
              - aciga_vur: true
              - dikkat: 4
              - xp_seviye: 20
            sonraki: "arsiv_yarik"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Yürüyenin arkasından süzül", en: "Slip past the Saltwalker" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "arsiv_fark", basarisiz_etkiler: [{ bolge: "batik_takimada" }, { can: -50 }, { dikkat: 2 }] }
            etkiler:
              - bolge: "batik_takimada"
              - gizle: 5
            sonraki: "arsiv_ic"

      - id: "arsiv_yarik"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kollarını açıyorsun ve deniz, gönülsüzce, iki yana çekiliyor. Ortada ıslak kaldırım taşlarından bir yol beliriyor; yosun kaplı, kayık parçaları, bir çocuk ayakkabısı.", en: "You spread your arms, and the sea, reluctantly, pulls aside. A road of wet cobblestones opens down the middle: seaweed, boat wreckage, a child's shoe." }
          - { tr: "Kubbenin dibindeki beyaz figür kuru havada kalınca kıpırdayamıyor. Tuzdan bedeni çatlıyor, sonra yavaşça, neredeyse minnetle, dökülüyor.", en: "Left standing in dry air, the white figure at the dome's base can't move. Its salt body cracks, then slowly, almost gratefully, crumbles." }
        secenekler:
          - id: "gir"
            etiket: { tr: "Kubbeye gir", en: "Go into the dome" }
            sonraki: "arsiv_ic"

      - id: "arsiv_fark"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yürüyenin yanından geçerken bir kabarcık ağzından kaçıyor. Beyaz baş sana dönüyor ve göğsündeki sönük pencere çerçevesi bir an, yalnızca bir an, yanıyor.", en: "A bubble slips out of your mouth as you pass it. The white head turns toward you, and the dead window frame in its chest lights up for a second. Just a second." }
          - { tr: "Kolları seni yakalıyor ve tuz derine gömülüyor. Kaçış yok; burada, dibin dibinde dövüşeceksin.", en: "Its arms catch you, and the salt grinds into your skin. No getting out of it. You'll fight here, at the bottom of the bottom." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Dövüş", en: "Fight" }
            etkiler:
              - savas: { dusmanlar: ["tuz_yuruyeni@dunya"], ortam: ["su"], kazan: "arsiv_ic", kaybet: "arsiv_yenilgi", kac: "arsiv_kacis" }

      - id: "arsiv_yenilgi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Tuz ciğerlerine doluyor ve dünya beyaza kesiyor. Kendine geldiğinde bir salın üstündesin; birisi seni sudan çekmiş.", en: "Salt fills your lungs, and the world whites out. When you come to, you're on a raft. Somebody pulled you out of the water." }
          - { tr: "Kesh. Zıpkınını yanına bırakmış, yüzüne bakıyor. \"Seviyeli olanlar da boğuluyormuş,\" diyor. \"Bunu bilmek iyi.\"", en: "Kesh. He's set his harpoon down beside you and he's studying your face. \"So leveled ones drown too,\" he says. \"Good to know.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve teşekkür et", en: "Get up. Thank him" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "arsiv_kacis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yüzeye vuruyorsun, ciğerlerin yanıyor. Aşağıda beyaz figür kubbenin önüne geri dönüp duruyor; seni kovalamıyor bile. Görevi seni öldürmek değil, okutmamak.", en: "You break the surface, lungs on fire. Down below, the white figure goes back to its post in front of the dome. It doesn't even chase you. Its job isn't killing you. It's keeping you from reading." }
        secenekler:
          - id: "don"
            etiket: { tr: "Başka bir gün gel", en: "Come back another day" }
            sonraki: "@akis"

      - id: "arsiv_ic"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kubbenin içi kuru ve soğuk. Duvarlar raf, raflar tuz tabletleriyle dolu; binlerce, on binlerce. Her biri gelgitleri sayan çentiklerle başlıyor ve çoğu bir isimle bitiyor.", en: "The inside of the dome is dry and cold. The walls are shelves, and the shelves are full of salt tablets: thousands, tens of thousands. Every one starts with notches counting tides, and most end with a name." }
          - { tr: "Ortadaki masada dört tablet, dört ayrı yığın halinde, birbirinden uzak durulsun diye ayrılmış. Her yığının başında bir sembol: bir kalkan, bir demir halka, açılmış bir göz, kapalı bir ağız.", en: "On the table in the middle sit four stacks of tablets, set apart like they're supposed to keep their distance. Each stack has a symbol at the top: a shield, an iron ring, an open eye, a closed mouth." }
          - { tr: "Tanıdık geliyor. Fazla tanıdık.", en: "It looks familiar. Way too familiar." }
        sezgiler:
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Dört yığının son tabletleri aynı gelgite tarihli. Dördü de aynı gece yazılmış; hiçbiri ötekinin ne yazdığını bilmeden.", en: "The last tablet in each of the four stacks is dated to the same tide. All four were written the same night, none of them knowing what the others were writing." }
        secenekler:
          - id: "kalkan"
            etiket: { tr: "Kalkan yığınının son tabletini oku", en: "Read the last tablet in the shield stack" }
            sonraki: "arsiv_dort"
          - id: "hepsi"
            tur: "gosteris"
            etiket: { tr: "Dört yığını birden, bir solukta oku", en: "Read all four stacks in one breath" }
            gerekli: { stat: { int: 200 } }
            etkiler:
              - xp_seviye: 25
            sonraki: "arsiv_dort"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} rafları taramasını söyle", en: "Have {npc:yanki} scan the shelves" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4 } }
            sonraki: "arsiv_fisilti"

      - id: "arsiv_dort"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Kalkan yazıyor: [Halkı koruyacağız. Kalkan hazır. Ötekiler bize güvenmiyor.] Demir halka yazıyor: [Güçlüler yönetecek. Zayıflar bunu anlayacak. Ötekiler engel.]", en: "The shield writes: [We will protect the people. The shield is ready. The others don't trust us.] The iron ring writes: [The strong will rule. The weak will understand. The others are in the way.]" }
          - { tr: "Açık göz yazıyor: [Sistem bizi seçti. Yakıt olacaklar yakıt olacak. Ötekiler kör.] Kapalı ağız yazıyor: [Kaynağa ulaştık. Bir gün daha. Ötekilere söylemeyeceğiz.]", en: "The open eye writes: [The System has chosen us. Those meant to be fuel will be fuel. The others are blind.] The closed mouth writes: [We have reached the source. One more day. We will not tell the others.]" }
          - { tr: "Dört tablet, aynı gece. Ertesi sabah için kimse bir şey yazmamış.", en: "Four tablets, the same night. Nobody wrote anything for the next morning." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"'Ötekilere söylemeyeceğiz.' Bunu biz de söyledik. Geçen ay. Kelimesi kelimesine.\"", en: "\"'We will not tell the others.' We said that. Last month. Word for word.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dört kamp. Dört. Bu bir arşiv değil; bir ayna.\"", en: "\"Four camps. Four. This isn't an archive. It's a mirror.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Rafların arkasına bak", en: "Look behind the shelves" }
            etkiler:
              - bilgi: "batik_son_yili"
            sonraki: "arsiv_fisilti"

      - id: "arsiv_fisilti"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Rafların en arkasında, duvara gömülü tek bir tablet var. Öbürleri gibi düzgün değil; çentikler titrek, harfler birbirine binmiş, sanki yazan kişi bir başkasının dikte ettiğini aceleyle kazımış.", en: "At the very back of the shelves, a single tablet is set into the wall. It isn't neat like the others. The notches shake, the letters run into each other, like whoever wrote it was scratching down someone else's dictation in a hurry." }
          - { tr: "Sistem çeviriyor ve çeviri bozuk çıkıyor: [Bana bir ses konuşuyordu. Yalnızca bana. Sistem'den kopmuş bir parça olduğunu söyledi. Son gece bana tek bir kelime söyledi: yeniden.]", en: "The System translates, and the translation comes out broken: [A voice spoke to me. Only to me. It said it was a piece broken off the System. On the last night it said one word to me: again.]" }
          - { tr: "Altında bir isim yok. İsim kazınıp silinmiş; kasten, derin ve öfkeli çizgilerle.", en: "There's no name under it. The name has been scratched out: on purpose, in deep, angry strokes." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[b̷u el yazısını tanıyorum]", en: "[i̷ know this handwriting]" }
            satirlar:
              - { tr: "hayır. tanımıyorum. tanımamalıyım.", en: "no. i don't. i shouldn't." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "lütfen bunu yanına alma. lütfen. bunu neden istediğimi bilmiyorum ve bu beni korkutuyor.", en: "please don't take this with you. please. i don't know why i'm asking, and that scares me." }
        secenekler:
          - id: "al"
            etiket: { tr: "Tableti duvardan sök ve yanına al", en: "Pry the tablet loose and take it" }
            etkiler:
              - bilgi: "nehha_fisildayani"
              - esya: { tuz_tableti: 1 }
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { yanki: { guven: -6, korku: 6 } }
              - itibar: { sessiz_ag: 4 }
            sonraki: "arsiv_cikis"
          - id: "birak"
            etiket: { tr: "{npc:yanki} için tableti yerinde bırak", en: "Leave the tablet where it is, for {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bilgi: "nehha_fisildayani"
              - ahlak: { merhamet: 2 }
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "arsiv_cikis"
          - id: "kir"
            etiket: { tr: "Tableti kır; kimse okumasın", en: "Smash the tablet. Nobody reads it" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { yanki: { guven: 4, korku: 3 } }
            sonraki: "arsiv_cikis"

      - id: "arsiv_cikis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çıkarken dört yığının önünde bir an duruyorsun. Kalkan, demir halka, açık göz, kapalı ağız. Dördü de haklı olduğundan emin.", en: "On your way out you stop in front of the four stacks for a second. Shield, iron ring, open eye, closed mouth. All four sure they were right." }
          - { tr: "Raflarda boş bir yer var; bir zamanlar bir yığın daha varmış gibi. Belki beşinci bir kamp vardı. Belki biri bir şey yazmayı unuttu.", en: "There's an empty spot on the shelves, like there used to be one more stack. Maybe there was a fifth camp. Maybe somebody forgot to write something." }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Dört tableti Dünya'ya götür; herkes okusun", en: "Take the four tablets home. Let everyone read" }
            etkiler:
              - esya: { tuz_tableti: 4 }
              - ahlak: { duzen: -1, insanlik: 3 }
              - itibar: { siginak: 3, lonca: 3, sessiz_ag: 3, yukselenler: 3 }
              - xp_seviye: 30
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 } }
            sonraki: "@akis"
          - id: "yaz"
            etiket: { tr: "Boş rafa kendi tabletini kazı", en: "Carve your own tablet for the empty shelf" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - xp_seviye: 25
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 2, max: 5 } }
            sonraki: "arsiv_yaz"
          - id: "birak"
            etiket: { tr: "Her şeyi olduğu gibi bırak", en: "Leave everything the way it is" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 20
              - tohum: { olay: "batik_son_basakci", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "arsiv_yaz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Tuzu bir bıçağın ucuyla kazıyorsun. Nehha harflerini bilmiyorsun; Sistem'in alfabesini kullanıyorsun, herkesin okuyabileceği tek alfabeyi.", en: "You scratch into the salt with the tip of a knife. You don't know the Nehha letters, so you use the System's alphabet, the only one anybody anywhere can read." }
          - { tr: "Tek satır yazıyorsun. Ne yazdığını kimseye söylemiyorsun. Tableti boş rafa koyduğunda kubbe bir an, belli belirsiz, bir çan gibi çınlıyor.", en: "You write one line. You don't tell anyone what it says. When you set the tablet on the empty shelf, the dome rings for a second, faintly, like a bell." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Yüzeye çık", en: "Head for the surface" }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SON BAŞAKÇI (boss · önemli)
  - id: "batik_son_basakci"
    perde: [3, 4]
    bolge: ["batik_takimada"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "batik_fener_goruldu" }
    agirlik: 4
    etiketler: ["cok_evren", "batik", "boss"]
    gerilim: 4
    onemli: true
    kart: { tr: "Son Başakçı", en: "The Last Gleaner" }
    sahne: "basakci_1"
    sahneler:
      - id: "basakci_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çanlar düzensiz, telaşlı çalıyor; öyle yüksek ki sesleri su kapısından bile taşıyor. Takımadaya vardığında deniz geri çekiliyor; kuleler dibine kadar çıplak, aralarındaki batık sokaklar iki yüz yıl sonra ilk kez kuru.", en: "The bells are ringing wild and ragged, loud enough to carry through the water door. By the time you reach the archipelago the sea is pulling back: the towers stand bare to their roots, and the drowned streets between them are dry for the first time in two hundred years." }
          - { tr: "Kuru sokakların ortasında, sığ bir çukurdan, bir şey doğruluyor. Ağlar, cam bıçaklar ve on binlerce sönük pencereden örülmüş, bir kule kadar uzun bir şey; ağlarındaki pencereler hâlâ yanıp sönüyor.", en: "In the middle of the dry streets, out of a shallow trench, something stands up. A thing as tall as a tower, woven out of nets and glass blades and tens of thousands of dead windows, and the windows in its nets are still blinking." }
          - { tr: "Son Fener'e doğru yürüyor. Acele etmiyor; tarlasının ucuna yürüyen bir çiftçi gibi.", en: "It's walking toward the Last Light. No hurry. Like a farmer walking out to the far end of his field." }
          - metin: { tr: "Fenerin dibindeki çocukların başlarının üstünde minicik [Seviye 1] yazıları yanıyor. Başakçı'nın başı onlara dönük.", en: "Tiny [Level 1] tags glow over the heads of the children at the foot of the Light. The Gleaner's head is turned toward them." }
            kosul: { bayrak: "batik_gorunur" }
          - metin: { tr: "Sallarda çocuk yok; otuz yedisi senin dünyanda. Fenerin dibinde yalnızca yaşlılar kalmış, ellerinde kemik zıpkınlar.", en: "There are no kids on the rafts. All thirty-seven are in your world. Only the old ones are left at the foot of the Light, bone harpoons in hand." }
            kosul: { bayrak: "batik_cocuklar_dunyada" }
          - metin: { tr: "Fener karanlık. Başakçı ona hiç bakmıyor; senin dünyandan gelen tek ışığa, sana doğru dönüyor.", en: "The Light is dark. The Gleaner doesn't so much as glance at it. It's turning toward the only light that came from your world. Toward you." }
            kosul: { bayrak: "batik_fener_soyuldu" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[HASAT ARTIĞI: Son Başakçı]", en: "[HARVEST REMNANT: The Last Gleaner]" }
            satirlar:
              - { tr: "Görev: kalan seviyelerin toplanması. Durum: 212 yıldır devam ediyor.", en: "Task: collection of remaining levels. Status: ongoing for 212 years." }
              - { tr: "Hedef öncelik: en parlak kaynak.", en: "Target priority: brightest source." }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Ağlarındaki pencereler rastgele değil; her biri bir Nehha. Ve ağın en altında, en eskisi, dört yüz on dokuz yazıyor.", en: "The windows in its nets aren't random. Each one is a Nehha. And at the very bottom of the net, the oldest one reads four hundred and nineteen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu Sistem'in bir parçası. benim gibi. ama o geride bırakıldı, ben kaçtım. aradaki fark bu kadar ince.", en: "it's a piece of the System. like me. but it got left behind, and i ran. that's how thin the difference is." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben fenerdeyim. Ne olursa olsun, oradan kimse ağa düşmeyecek.\"", en: "\"I've got the Light. Whatever happens, nobody up there goes into that net.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kule kadar büyük ve iki yüz yaşında. Güzel. Sonunda terlemeye değecek bir şey.\"", en: "\"Big as a tower and two hundred years old. Nice. Finally something worth breaking a sweat over.\"" }
        secenekler:
          - id: "karsila"
            etiket: { tr: "Fenerin önünde dur ve onu karşıla", en: "Stand in front of the Light and meet it" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 4, duzen: -1 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+5"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Son Fener'in önünde, hasat edilmiş bir dünyanın son insanlarıyla Hasat'ın geride bıraktığı şeyin arasında durdun.", en: "You stood in front of the Last Light, between a harvested world's last people and the thing the Harvest left behind." }
          - id: "canlar"
            etiket: { tr: "Önce çanları çaldır; sonra saldır", en: "Get the bells ringing first. Then attack" }
            goster: { bilgi: "basakci_cani" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 3, duzen: 2 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+2"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Bir dünyanın bütün çanlarını aynı anda çaldırdın; Başakçı iki yüz yılda ilk kez yolunu kaybetti.", en: "You got every bell in a world ringing at once, and for the first time in two hundred years the Gleaner lost its way." }
          - id: "cek"
            etiket: { tr: "Onu fenerden uzağa, derin suya çek", en: "Draw it away from the Light, into deep water" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "basakci_yakalandi", basarisiz_etkiler: [{ bolge: "batik_takimada" }, { can: -80 }, { ahlak: { merhamet: 3 } }] }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 6 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+4"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı'yı kendi ışığınla fenerden uzağa çektin; o gece sallarda kimse toplanmadı.", en: "You used your own light to draw the Gleaner away from the Light, and nobody on the rafts got collected that night." }
          - id: "konus"
            etiket: { tr: "{npc:yanki} onunla konuşsun", en: "Let {npc:yanki} talk to it" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "batik_takimada"
              - ahlak: { merhamet: 4, insanlik: -2 }
              - iliski: { yanki: { guven: 6, saygi: 6 } }
            kronik: { tr: "Hasat'ın artığıyla kafandaki sesi konuşturdun; iki kopuk parça birbirini tanıdı.", en: "You let the voice in your head talk to the Harvest's leftover, and two broken-off pieces recognized each other." }
            sonraki: "basakci_konus"
          - id: "terk"
            etiket: { tr: "Feneri bırak; kapıya koş", en: "Leave the Light. Run for the door" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -10, insanlik: -3 }
            kronik: { tr: "Son Fener'i Başakçı'ya bıraktın; Batık Takımada'nın son çanı arkandan sustu.", en: "You left the Last Light to the Gleaner, and behind you the last bell of the Drowned Reach went silent." }
            sonraki: "basakci_terk"

      - id: "basakci_yakalandi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ağ, sen kuru sokağın yarısındayken üstüne iniyor. İplikler bileklerine dolanıyor ve her düğümde bir sayı, senin sayın, gevşiyor.", en: "The net comes down on you halfway across the dry street. The lines wrap your wrists, and at every knot a number, one of yours, starts working loose." }
          - { tr: "Derin suya ulaşamadın. Burada, fenerin dibinde, dövüşmek zorundasın.", en: "You didn't make deep water. You're fighting it here, at the foot of the Light." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ağı yırt ve dövüş", en: "Tear free of the net and fight" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["son_basakci@oyuncu+5"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı'nın ağından yırtılarak kurtuldun ve onunla fenerin dibinde dövüştün.", en: "You tore your way out of the Gleaner's net and fought it at the foot of the Light." }

      - id: "basakci_konus"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Penceren titriyor ve {npc:yanki} konuşuyor; ama sana değil. Satırlar pencerenden dışarı, havaya, Başakçı'nın ağlarına doğru akıyor.", en: "Your window shudders and {npc:yanki} starts talking, but not to you. The lines flow out of your window, into the air, toward the Gleaner's nets." }
          - { tr: "Başakçı duruyor. Ağlarındaki pencerelerden biri, en büyüğü, yavaşça dönüyor ve üstünde bozuk bir satır beliriyor: [b̷en hasat etmedim. ben yalnızca artığım. geride kalanı topluyorum.]", en: "The Gleaner stops. One window in its nets, the biggest, turns slowly, and a broken line shows up on it: [i̷ didn't harvest anything. i'm only what was left over. i gather what's left behind.]" }
          - { tr: "{npc:yanki}: o zaman kendini topla. senden geriye kalan bu. bırak onları.", en: "{npc:yanki}: then gather yourself. that's what's left of you. let them go." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Sessizce bekle", en: "Wait in silence" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
            kronik: { tr: "İki artığın konuşmasını sessizce bekledin; sonunda biri ötekini dinledi.", en: "You waited in silence while two leftovers talked, and in the end one of them listened to the other." }
            sonraki: "basakci_huzur"
          - id: "saldir"
            etiket: { tr: "Durduğu an saldır", en: "Hit it while it's standing still" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - iliski: { yanki: { guven: -8, saygi: -4 } }
              - savas: { dusmanlar: ["son_basakci@oyuncu+1"], ortam: ["su"], kazan: "basakci_zafer", kaybet: "basakci_yenilgi", kac: "basakci_kacis" }
            kronik: { tr: "Başakçı kafandaki sesi dinlerken ona saldırdın; ses bunu sana hiç unutturmadı.", en: "You attacked the Gleaner while it was listening to the voice in your head. The voice never let you forget it." }

      - id: "basakci_huzur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Başakçı ağlarını kendi gövdesinin üstüne çekiyor; bir balıkçının ağını katlaması gibi, düzgün ve özenle. Sonra katlanmış ağ kuru sokağa çöküyor ve deniz, iki yüz yılın ağırlığıyla, geri geliyor.", en: "The Gleaner draws its nets in over its own body, neat and careful, the way a fisherman folds his net. Then the folded net collapses onto the dry street, and the sea comes back with two hundred years of weight behind it." }
          - { tr: "Suyun yüzeyine binlerce minik pencere yükseliyor. Yanmıyorlar, sönmüyorlar; yalnızca yüzüyorlar, fener ışığında, bir sürü küçük fener gibi.", en: "Thousands of tiny windows rise to the surface. They aren't lit and they aren't dark. They just float in the lamplight, like a crowd of little lanterns." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[a̷rtık kapatıldı]", en: "[r̷emnant closed]" }
            satirlar:
              - { tr: "kaynak: yetkisiz. işlem: rıza ile.", en: "source: unauthorized. process: consensual." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Pencerelerin denize dağılmasını izle", en: "Watch the windows drift out to sea" }
            etkiler:
              - bayrak: "basakci_saldi"
              - gorev: { cok_evren_batik: tamam }
              - ahlak: { merhamet: 5, insanlik: 6 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - xp_seviye: 120
            kronik: { tr: "Son Başakçı'yı öldürmedin; kendini toplamasına izin verdin ve iki yüz yıllık hasat denize, sahiplerine geri döndü.", en: "You didn't kill the Last Gleaner. You let it gather itself up, and two hundred years of harvest went back to the sea, back to the people it belonged to." }
            sonraki: "basakci_sabah"

      - id: "basakci_zafer"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Başakçı'nın göğsündeki son ağ yırtılıyor ve dev gövde, cam bıçaklarını şıngırdatarak, kuru sokağa yığılıyor. Su, iki yüz yılın ağırlığıyla geri geliyor ve onu örtüyor.", en: "The last net in the Gleaner's chest tears open, and the huge body crashes down onto the dry street, glass blades jangling. The sea comes back with two hundred years of weight behind it and covers it over." }
          - { tr: "Suyun yüzeyine binlerce minik pencere yükseliyor; ağlarında tuttuğu bütün Nehha seviyeleri. Yanmıyorlar, sönmüyorlar. Bir sahip bekliyorlar.", en: "Thousands of tiny windows rise to the surface: every Nehha level it was holding in its nets. They aren't lit and they aren't dark. They're waiting for an owner." }
          - { tr: "Penceren bir an çok uzun bir sayıyı gösteriyor; bütün bunları içine çekersen ulaşacağın sayıyı. Sistem bu seçeneği, hiç sormadan, sana sunuyor.", en: "For a second your window shows a very long number: the number you'd hit if you pulled all of this into yourself. The System offers you the option without being asked." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[Unvan: Başakçı'yı Kıran]", en: "[Title: Gleaner-Breaker]" }
            satirlar:
              - { tr: "Hasat artığı yok edildi. Toplanmış kaynaklar sahipsiz.", en: "Harvest remnant destroyed. Collected resources unclaimed." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Alma onları. Bana bak. Bunlar insanlar. Alma.\"", en: "\"Don't take them. Look at me. Those are people. Don't.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bu kadar seviye öylece yüzüyor. Sen almazsan biri alır. Söylüyorum, o kadar.\"", en: "\"That many levels just floating there. If you don't take them, somebody will. Just saying.\"" }
        secenekler:
          - id: "ozgur"
            etiket: { tr: "Pencereleri serbest bırak; denize dağılsınlar", en: "Let the windows go. Let them scatter" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { merhamet: 4, insanlik: 6 }
              - degisken: { kadim_tehdit: -3 }
              - xp_seviye: 100
            kronik: { tr: "Son Başakçı'yı devirdin ve topladığı iki yüz yıllık hasadı denize saldın; Batık Takımada'nın denizinde ilk kez bir çan kendi isteğiyle çaldı.", en: "You brought down the Last Gleaner and let two hundred years of harvest go into the sea. For the first time, a bell in the Drowned Reach rang because it wanted to." }
            sonraki: "basakci_sabah"
          - id: "yut"
            etiket: { tr: "Hepsini içine çek", en: "Pull every last one into yourself" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - bayrak: "batik_hasat_yutuldu"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { insanlik: -12, merhamet: -6 }
              - yozlasma: 8
              - xp_seviye: 220
              - stat: { str: 8, end: 8, wil: 8 }
              - itibar: { yukselenler: 6, siginak: -6 }
            kronik: { tr: "Son Başakçı'yı devirdin ve onun iki yüz yıl boyunca topladığı her şeyi içine çektin; Hasat'ın işini sen bitirdin.", en: "You brought down the Last Gleaner and pulled in everything it had spent two hundred years collecting. You finished the Harvest's job." }
            sonraki: "basakci_sabah"
          - id: "sonuklere"
            etiket: { tr: "{npc:yanki} pencereleri Sönüklere dağıtsın", en: "Have {npc:yanki} hand the windows to the Dimmed" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "basakci_olduruldu"
              - bayrak: "batik_gorunur"
              - unvan: "basakci_kiran"
              - gorev: { cok_evren_batik: tamam }
              - esya: { basakci_cekirdegi: 1 }
              - ahlak: { merhamet: 8, duzen: -3 }
              - yozlasma: 5
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - xp_seviye: 120
            kronik: { tr: "Son Başakçı'yı devirdin ve topladığı seviyeleri hasat edilmiş bir halka geri dağıttın; Sönükler iki yüz yıl sonra yeniden sayılmaya başladı.", en: "You brought down the Last Gleaner and handed what it had collected back to a harvested people. Two hundred years later, the Dimmed started being counted again." }
            sonraki: "basakci_sabah"

      - id: "basakci_yenilgi"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Ağ seni yere çiviliyor. Durum pencerende seviyenin altındaki kırmızı çizgi kalınlaşıyor, kalınlaşıyor ve bir an, yalnızca bir an, rakamların sana değil ona ait olduğunu hissediyorsun.", en: "The net pins you to the ground. The red line under the level in your Status window keeps getting thicker, thicker, and for a second, just a second, you feel your numbers belonging to it instead of you." }
          - { tr: "Sonra bir çan çalıyor. Fenerin tepesinde, kör gözleriyle, Oru-Venn yeşile çalmış bir çanı iki eliyle sallıyor. Başakçı'nın başı sarsılıyor; ağ gevşiyor.", en: "Then a bell rings. At the top of the Light, blind eyes and all, Oru-Venn is swinging a green-tarnished bell with both hands. The Gleaner's head jerks. The net goes slack." }
          - { tr: "Sürünerek kurtuluyorsun. Arkanda Başakçı fenere dönüyor; çanın sesi kesiliyor ve lamba sönüyor.", en: "You crawl free. Behind you, the Gleaner turns toward the Light. The bell stops, and the lamp goes out." }
        secenekler:
          - id: "kac"
            etiket: { tr: "Kapıya sürün; yaşamak zorundasın", en: "Crawl for the door. You have to live" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -2, insanlik: 2 }
              - can: 50
            kronik: { tr: "Son Başakçı'ya yenildin; seni kurtaran çanı çalan kadın, o gece fenerle birlikte söndü.", en: "You lost to the Last Gleaner. The woman who rang the bell that saved you went out with the Light that night." }
            sonraki: "@akis"

      - id: "basakci_kacis"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısına doğru koşuyorsun ve Başakçı peşinden gelmiyor. Gelmesine gerek yok; arkanda daha kolay bir hasat var.", en: "You run for the water door, and the Gleaner doesn't follow. It doesn't need to. There's an easier harvest behind you." }
          - { tr: "Kapıdan geçmeden önce dönüp bakıyorsun. Fenerin ışığı bir kez titriyor ve sönüyor.", en: "Before you go through the door, you look back. The Light flickers once and goes out." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Kapıdan geç", en: "Go through the door" }
            etkiler:
              - bayrak: "batik_fener_dustu"
              - gorev: { cok_evren_batik: basarisiz }
              - ahlak: { merhamet: -5 }
            kronik: { tr: "Başakçı'dan kaçtın ve Son Fener arkandan söndü.", en: "You ran from the Gleaner, and the Last Light went out behind you." }
            sonraki: "@akis"

      - id: "basakci_terk"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Koşuyorsun. Arkanda çanlar teker teker susuyor; önce uzaktakiler, sonra yakındakiler. En son fenerin çanı susuyor.", en: "You run. Behind you the bells go quiet one at a time, the far ones first, then the near ones. The Light's bell is the last to stop." }
          - { tr: "Su kapısının önünde durduğunda takımada tamamen sessiz. Sistem bu dünyaya ait son kaydı kapatıyor.", en: "By the time you reach the water door, the archipelago is completely silent. The System closes the last record it had for this world." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Ilunnar · kayıt kapatıldı]", en: "[Ilunnar · record closed]" }
            satirlar:
              - { tr: "Kalan seviye: yok. Kalan nüfus: önemsiz.", en: "Remaining levels: none. Remaining population: negligible." }
        secenekler:
          - id: "gec"
            etiket: { tr: "Kapıdan geç ve kendi dünyana dön", en: "Go through the door. Go home" }
            etkiler:
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın son kaydının kapanışını seyrettin ve kendi dünyana döndün; Hasat'ın neye benzediğini artık biliyordun.", en: "You watched a harvested world's last record close and went home. Now you knew what the Harvest looked like." }
            sonraki: "@akis"

      - id: "basakci_sabah"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sabah takımadanın bütün çanları çalıyor; ama bu kez telaşla değil. Bir düğünde ya da bir doğumda çalınan çanlar gibi.", en: "In the morning every bell in the archipelago rings, but not in a panic this time. Like bells at a wedding, or a birth." }
          - metin: { tr: "Oru-Venn fenerin merdivenlerinde oturuyor, yüzü güneşe dönük. \"Benim seviyem de oradaydı,\" diyor. \"En altta. Dört yüz on dokuz. Gitti mi?\" Gitti. Gülümsüyor: \"İyi.\"", en: "Oru-Venn is sitting on the Light's stairs, face turned to the sun. \"My level was in there too,\" she says. \"At the very bottom. Four hundred and nineteen. Is it gone?\" It is. She smiles. \"Good.\"" }
            kosul: { bayrak_yok: "batik_hasat_yutuldu" }
          - metin: { tr: "Oru-Venn fenerin merdivenlerinde oturuyor ve sana yüzünü dönmüyor. \"Benim seviyem de oradaydı,\" diyor. \"En altta.\" Artık senin içinde; bunu ikiniz de biliyorsunuz.", en: "Oru-Venn is sitting on the Light's stairs, and she won't turn her face to you. \"My level was in there too,\" she says. \"At the very bottom.\" It's inside you now. You both know it." }
            kosul: { bayrak: "batik_hasat_yutuldu" }
          - { tr: "Kesh zıpkınını önüne, ayaklarının dibine bırakıyor. Nehhalarda bunun ne anlama geldiğini sormana gerek yok.", en: "Kesh lays his harpoon down at your feet. You don't need to ask what that means to the Nehha." }
        secenekler:
          - id: "veda"
            etiket: { tr: "Suya, sonra alnına dokun; veda et", en: "Touch the water, then your brow. Say goodbye" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Batık Takımada'ya onların selamıyla veda ettin.", en: "You said goodbye to the Drowned Reach with their own greeting." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Kendi dünyanı düşün; Gün 365'i", en: "Think about your own world. About Day 365" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın sabahında kendi dünyanın son gününü düşündün.", en: "On the morning of a harvested world, you thought about your own world's last day." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ TİLU (tohum: cok_evren_kapisi)
  - id: "batik_tilu"
    perde: [3, 4]
    agirlik: 1
    etiketler: ["cok_evren", "batik", "kurtarma"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Eve giden çocuk", en: "The kid going home" }
    sahne: "tilu_1"
    sahneler:
      - id: "tilu_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Sığınak'ın Kule Dibi'ndeki sahra çadırından bir gönüllü seni buluyor. \"Kapıdan gelen çocuk,\" diyor. \"Yemiyor, uyumuyor, çanını sallayıp duruyor. Seni soruyor; yani seni tarif ediyor.\"", en: "A volunteer from the Haven's field tent in Spire Plaza tracks you down. \"The kid from the door,\" she says. \"Won't eat, won't sleep, just keeps shaking that bell. Asking for you. Well, describing you.\"" }
            kosul: { bayrak: "tilu_korundu" }
          - metin: { tr: "Sessiz Ağ'dan bir teknisyen seni buluyor, gözlerinin altı mor. \"Çocuk,\" diyor. \"Ölçümler bitti. Yemek yemiyor. Ekip... ekip onu senin götürmeni istiyor. Ya da ölçmeye devam etmemizi. Sana soruyorlar.\"", en: "A Quiet Network tech finds you, dark circles under his eyes. \"The kid,\" he says. \"Measurements are done. It's not eating. The team... the team wants you to take it home. Or for us to keep measuring. They're asking you.\"" }
            kosul: { bayrak: "tilu_ag_teslim" }
          - { tr: "Çocuk, Tilu, seni görünce ayağa fırlıyor. Perdeli parmaklarıyla bileğini yakalıyor ve ilk kez Sistem'in çevirisini beklemeden, senin dilinde tek bir kelime söylüyor: \"Ev.\"", en: "The kid, Tilu, jumps up the second she sees you. She grabs your wrist with webbed fingers and, for the first time, without waiting for the System to translate, says one word in your language: \"Home.\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Bileğinde hâlâ bir sensörün bıraktığı kırmızı iz var. Çanı hiç bırakmamış; parmakları çanın sapında morarmış.", en: "There's still a red mark on her wrist from a sensor. She never once let go of the bell. Her fingers have gone purple around the handle." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu çocuk senin sayılarını görebiliyor. Sönükler bazen görür. seni çok parlak buluyor. bunu bir iltifat olarak al.", en: "this kid can see your numbers. the Dimmed sometimes can. she thinks you're very bright. take it as a compliment." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir çocuğun evine dönmesi tıbbi bir ihtiyaçtır. Bunu raporuma öyle yazacağım.\"", en: "\"A kid getting home is a medical necessity. That's how I'm writing it up.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Veriler bende. Yeterince bende. Götür onu.\"", en: "\"I've got the data. I've got plenty. Take her.\"" }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Elinden tut; eve götür", en: "Take her hand. Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 5 }
              - itibar: { siginak: 3 }
            sonraki: "tilu_yol"
          - id: "olc"
            etiket: { tr: "Ağ biraz daha ölçsün; sonra götürürsün", en: "Let the Network measure a bit more first" }
            goster: { bayrak: "tilu_ag_teslim" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 3 }
              - itibar: { sessiz_ag: 5 }
              - bilgi: "basakci_cani"
            sonraki: "tilu_olcum"
          - id: "kos"
            tur: "gosteris"
            etiket: { tr: "Onu sırtına al; Kule'yi bir solukta çık", en: "Piggyback her up the Spire in one breath" }
            gerekli: { stat: { end: 170 } }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 4 }
              - dikkat: 3
              - xp_seviye: 10
            sonraki: "tilu_yol"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} çocuğun gördüğünü sor", en: "Ask {npc:yanki} what the kid sees" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
            sonraki: "tilu_yanki"

      - id: "tilu_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki}: seni görüyor. ve beni. iki ışık diyor. biri parlak, biri titrek. titrek olanın ben olduğumu tahmin ediyorsun.", en: "{npc:yanki}: she sees you. and me. two lights, she says. one bright, one flickering. you can guess which one i am." }
          - { tr: "Tilu başını yana eğip pencerenin durduğu yere, göğsünün önüne bakıyor. Sonra küçük, perdeli bir parmağı uzatıp havaya dokunuyor; tam {npc:yanki|in} satırlarının durduğu yere.", en: "Tilu tilts her head and looks at the spot in front of your chest where your window hangs. Then she reaches out one small webbed finger and touches the air, right where {npc:yanki|pos} lines sit." }
          - { tr: "{npc:yanki}: ...bana kimse dokunmamıştı.", en: "{npc:yanki}: ...nobody's ever touched me before." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Onu eve götür", en: "Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 4 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "tilu_yol"

      - id: "tilu_olcum"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Üç gün daha. Teknisyenler çocuğun çanını ölçüyor ve buluyor: çanın sesi Sistem'in kayıt frekansının tam karşıtında titreşiyor. Sistem'e ait olmayan bir ses; Başakçı'yı şaşırtan da bu.", en: "Three more days. The techs measure the kid's bell and find it: the bell's tone vibrates at the exact inverse of the System's logging frequency. A sound that doesn't belong to the System. That's what throws the Gleaner off." }
          - { tr: "Dördüncü gün Tilu artık çanı sallamıyor. Yalnızca tutuyor ve kapının olduğu yöne bakıyor.", en: "On the fourth day Tilu stops shaking the bell. She just holds it and stares in the direction of the door." }
        secenekler:
          - id: "gotur"
            etiket: { tr: "Yeter. Onu eve götür", en: "Enough. Take her home" }
            etkiler:
              - bolge: "batik_takimada"
              - bayrak: "tilu_eve_dondu"
              - ahlak: { merhamet: 2, insanlik: 1 }
            sonraki: "tilu_yol"
          - id: "tut"
            etiket: { tr: "Ağ'da kalsın; bilgi daha değerli", en: "She stays with the Network. Data's worth more" }
            etkiler:
              - bayrak: "tilu_ag_tutsak"
              - ahlak: { merhamet: -8, insanlik: -5, duzen: 2 }
              - itibar: { sessiz_ag: 6, siginak: -5 }
            sonraki: "tilu_tutsak"

      - id: "tilu_tutsak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Teknisyen başını sallıyor ve gözlerini kaçırıyor. Tilu'nun çadırının kapısı kapanıyor.", en: "The tech nods and won't meet your eyes. The flap of Tilu's tent closes." }
          - { tr: "O gece, çok uzaktan, su kapısının ardından, bir çan çalıyor. Kimse cevap vermiyor.", en: "That night, from very far away, from somewhere behind the water door, a bell rings. Nobody answers it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Uzaklaş", en: "Walk away" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "tilu_yol"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Su kapısından geçtiğiniz an Tilu elini bırakıp suya dalıyor. Bir balık gibi; havada boğulan çocuk gitmiş, yerine kendi denizine dönmüş bir şey gelmiş.", en: "The second you come through the water door, Tilu lets go of your hand and dives. Like a fish. The kid who was drowning in your air is gone, and in her place is something that's back in its own sea." }
          - { tr: "Sonra başını sudan çıkarıp çanını sallıyor. Bir, iki, üç kez. Uzaktan bir çan cevap veriyor; sonra bir tane daha.", en: "Then she pops her head up and shakes her bell. Once, twice, three times. A bell answers from far off. Then another." }
          - { tr: "Doğudaki salların birinden bir kadın suya atlıyor ve yüzüyor; daha önce hiç kimsenin bu kadar hızlı yüzdüğünü görmedin.", en: "On one of the rafts to the east, a woman dives into the water and starts swimming. You've never seen anybody swim that fast." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Kıyıda bekle; onlar kavuşsun", en: "Wait on the shore. Let them have this" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "tilu_anne"
          - id: "yuz"
            etiket: { tr: "Onların peşinden yüz", en: "Swim out after them" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "tilu_anne"

      - id: "tilu_anne"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Annesi Tilu'yu sudan çekip göğsüne bastırıyor ve uzun süre bırakmıyor. Sonra sana bakıyor; başının üstünde hiçbir şey yazmayan bir kadın, senin başının üstündeki sayıya bakıyor.", en: "Her mother pulls Tilu out of the water and crushes her to her chest and doesn't let go for a long time. Then she looks at you: a woman with nothing over her head, looking at the number over yours." }
          - { tr: "Avucunu suya batırıyor, sonra alnına bastırıyor. Sonra, yavaşça, ıslak avucunu senin alnına da bastırıyor.", en: "She dips her palm in the water and presses it to her forehead. Then, slowly, she presses her wet palm to yours, too." }
          - { tr: "Tilu çanını sana uzatıyor. Annesi bir şey söylüyor ve Sistem çeviriyor: [Çanı al. Başakçı çanı duyunca yolunu kaybeder. Bunu herkes bilir; seviyeliler hariç.]", en: "Tilu holds her bell out to you. Her mother says something, and the System translates: [Take the bell. When the Gleaner hears it, it loses its way. Everybody knows that. Except the leveled ones.]" }
        secenekler:
          - id: "al"
            etiket: { tr: "Çanı al", en: "Take the bell" }
            etkiler:
              - esya: { nehha_cani: 1 }
              - bilgi: "basakci_cani"
              - ahlak: { merhamet: 1 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 } }
            sonraki: "tilu_son"
          - id: "red"
            etiket: { tr: "Çan onun kalsın; yalnızca bilgiyi al", en: "Let her keep the bell. Just take the advice" }
            etkiler:
              - bilgi: "basakci_cani"
              - ahlak: { insanlik: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 } }
            sonraki: "tilu_son"
          - id: "goc"
            etiket: { tr: "Onları da Dünya'ya davet et", en: "Invite them both back to Earth" }
            etkiler:
              - bilgi: "basakci_cani"
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { siginak: 3 }
              - tohum: { olay: "batik_son_fener", gecikme: { min: 1, max: 3 } }
            sonraki: "tilu_davet"

      - id: "tilu_davet"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Anne başını sallıyor; hayır. Eliyle denizi, kuleleri, doğudaki dumanı gösteriyor. Burası onların evi; boğulmuş olsa bile.", en: "The mother shakes her head. No. She gestures at the sea, the towers, the smoke out east. This is their home, drowned or not." }
          - { tr: "Tilu sana bir kez daha sarılıyor ve annesinin arkasından suya dalıyor.", en: "Tilu hugs you one more time and dives in after her mother." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Anlıyorum", en: "I get it" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "tilu_son"

      - id: "tilu_son"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Doğudaki sal köyünden biri sana el sallıyor. Sonra bir başkası. Bir dünyanın kalıntısı sana el sallıyor ve sen ne yapacağını bilemeden elini kaldırıyorsun.", en: "Somebody in the raft village out east waves at you. Then somebody else. The leftovers of a whole world are waving at you, and you lift your hand without really knowing what else to do." }
          - metin: { tr: "Takımadaya ilk kez geliyorsun ve ilk gördüğün şey bir kavuşma oldu. Bu dünyada bunun ne kadar nadir olduğunu henüz bilmiyorsun.", en: "It's your first time in the Drowned Reach, and the first thing you saw here was a reunion. You don't know yet how rare that is in this world." }
            kosul: { bayrak_yok: "batik_varildi" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "El salla ve sal köyüne yürü", en: "Wave back. Head for the raft village" }
            etkiler:
              - bayrak: "batik_varildi"
              - gorev: { cok_evren_batik: basla }
              - ahlak: { merhamet: 1 }
              - xp_seviye: 20
            sonraki: "@akis"

  # ================================================================== PİRİNÇ KERVAN (Tavvarlar · Vassal'ın aynası)
  - id: "kervan_tarti_carsisi"
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak_yok: "kervan_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "kervan", "kesif"]
    gerilim: 2
    kart: { tr: "Tartı Çarşısı", en: "The Weighing Bazaar" }
    sahne: "tarti_1"
    sahneler:
      - id: "tarti_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Pirinç kapıdan bir güverteye çıkıyorsun ve güverte bitmiyor. Ufuk yukarı doğru kıvrılıyor; bütün bir şehir, bütün bir ülke, dev bir geminin karnına sığdırılmış ve gemi yıldızların arasında ağır ağır ilerliyor.", en: "You step out of the brass door onto a deck, and the deck doesn't end. The horizon curves up instead of down: a whole city, a whole country, packed into the belly of an enormous ship crawling between the stars." }
          - { tr: "Her yer pirinç. Kubbeler, köprüler, kapı tokmakları, tütsü kazanları. Kalabalığın içinde uzun, ince, altı parmaklı insanlar yürüyor; derileri pirinç pullarla kaplı ve her pul bir hece.", en: "Everything's brass. Domes, bridges, door knockers, incense burners. The crowd is full of tall, thin, six-fingered people, and their skin is studded with brass chits, every chit a syllable." }
          - { tr: "Konuşmadan önce birbirlerine küçük pullar uzatıyorlar. Burada her söz bir bedel; her cümle bir alışveriş.", en: "Before they talk, they hand each other little chits. Here every word costs something. Every sentence is a transaction." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[KATMAN ANALİZİ: Tavvar Kervanı]", en: "[LAYER ANALYSIS: Tavvari Caravan]" }
            satirlar:
              - { tr: "Durum: bağlı Katman. Bağ: Boyun Senedi (Kadim). Süre: 412 yıl.", en: "Status: bonded Layer. Bond: the Neckbond (Ancient). Duration: 412 years." }
              - { tr: "Hasat durumu: ertelendi. Bedel: süregelen.", en: "Harvest status: deferred. Price: ongoing." }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Derilerindeki pullar süs değil, defter. Doğum, borç, evlilik, ölüm. Bazı pulların yerinde boşluk var; söküldükleri yerde ince, beyaz izler.", en: "The chits in their skin aren't decoration. They're a ledger: birth, debt, marriage, death. Some have gaps where chits used to be, thin white scars where they were pried out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem burada konuşuyor. ama başka biri adına. her satırın sonunda bir Kadim imzası var. buraya sahip olmanın neye benzediğini görmek istiyordun, değil mi?", en: "the System talks here. but on someone else's behalf. there's an Ancient signature at the end of every line. you wanted to see what being owned looks like, didn't you?" }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Konuşmak için para ödüyorlar. Benim kâbusum bu, biliyorsun değil mi? Tam olarak bu.\"", en: "\"They pay to talk. That's my nightmare, you know that? This exactly.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes gülümsüyor. Herkes tok görünüyor. Neden tüylerim diken diken?\"", en: "\"Everybody's smiling. Everybody looks well-fed. So why's my skin crawling?\"" }
        secenekler:
          - id: "carsi"
            etiket: { tr: "Kalabalığın aktığı yöne, çarşıya yürü", en: "Follow the crowd into the bazaar" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
            sonraki: "tarti_terazi"
          - id: "pazarlik"
            etiket: { tr: "Bir tezgâhtan söz pulu almaya çalış", en: "Try to buy word-chits off a stall" }
            zar: { stat: "cha", zorluk: 380, tek: false, basarisiz: "tarti_kazik", basarisiz_etkiler: [{ kredi: -200 }] }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - esya: { pirinc_pul: 20 }
              - kredi: -100
            sonraki: "tarti_terazi"
          - id: "agirlik"
            tur: "gosteris"
            etiket: { tr: "Dev terazinin karşı ağırlığını tek elle kaldır", en: "Lift the great scale's counterweight one-handed" }
            gerekli: { stat: { str: 180 } }
            etkiler:
              - bayrak: "kervan_varildi"
              - bayrak: "kervan_tartilamadi"
              - gorev: { cok_evren_kervan: basla }
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3 }
            sonraki: "tarti_kirildi"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} derilerdeki defterleri okusun", en: "Have {npc:yanki} read the ledgers in their skin" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - bilgi: "kervan_boyun_senedi"
              - iliski: { yanki: { guven: 4, saygi: 3 } }
            sonraki: "tarti_defter"

      - id: "tarti_kazik"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tezgâhtaki Tavvar senin kredilerine bakıyor, sonra sana, sonra yeniden kredilere. Pazarlığın ilk cümlesinde ona yirmi pul borçlanmışsın; ikinci cümlede kırk.", en: "The Tavvari at the stall looks at your credits, then at you, then back at the credits. Your first sentence of haggling cost you twenty chits. Your second cost forty." }
          - { tr: "Kalabalığın içinden birkaç kişi gülüyor. Burada konuşmayı bilmeyen biri, ne kadar güçlü olursa olsun, yoksuldur.", en: "A few people in the crowd laugh. Here, somebody who doesn't know how to talk is poor, no matter how strong they are." }
        secenekler:
          - id: "ode"
            etiket: { tr: "Öde ve dersini al", en: "Pay up. Learn the lesson" }
            etkiler:
              - bayrak: "kervan_varildi"
              - gorev: { cok_evren_kervan: basla }
              - esya: { pirinc_pul: 5 }
              - ahlak: { duzen: 1 }
            sonraki: "tarti_terazi"

      - id: "tarti_defter"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:yanki} kalabalığı tarıyor ve satırları pencerene diziyor. Bir kadın: üç çocuk doğurmuş; biri onda bir olarak gitmiş. Bir yaşlı adam: dört kardeş; ikisi gitmiş. Bir genç: henüz bir şey yok; ama derisinde, onda birin seçileceği yaşı gösteren bir pul boş bırakılmış.", en: "{npc:yanki} sweeps the crowd and lines them up in your window. A woman: three children, one gone as the tithe. An old man: four siblings, two gone. A kid: nothing yet, but there's a blank chit in her skin marking the age the tithe gets picked." }
          - { tr: "{npc:yanki}: herkesin defterinde aynı satır var. her ailede bir boşluk. bu bir halk değil; bir taksit planı.", en: "{npc:yanki}: same line in every ledger. a gap in every family. this isn't a people. it's an installment plan." }
        secenekler:
          - id: "carsi"
            etiket: { tr: "Çarşıya, terazilerin olduğu yere yürü", en: "Head into the bazaar, to the scales" }
            sonraki: "tarti_terazi"

      - id: "tarti_terazi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tartı Çarşısı'nın ortasında bir ev büyüklüğünde bir terazi duruyor. Tavvarlar ona her şeyi koyuyor: tahıl, kumaş, köle sözleşmeleri, çocukların gelecekteki emekleri. Ve yabancıları.", en: "In the middle of the Weighing Bazaar stands a scale the size of a house. The Tavvari weigh everything on it: grain, cloth, indenture contracts, children's future labor. And strangers." }
          - { tr: "Derisi bütünüyle pullarla kaplı yaşlı bir tartıcı sana el ediyor. \"Yabancı,\" diyor, ve bunun için kendi kendine bir pul ödüyor. \"Burada her şeyin bir fiyatı var. Seninkini öğrenelim.\"", en: "An old weigher whose skin is covered head to toe in chits waves you over. \"Stranger,\" he says, and pays himself a chit for it. \"Everything here has a price. Let's learn yours.\"" }
        secenekler:
          - id: "tartil"
            etiket: { tr: "Kefeye çık; tartılmayı kabul et", en: "Step onto the pan. Let them weigh you" }
            etkiler:
              - bayrak: "kervan_tartilamadi"
              - dikkat: 3
              - ahlak: { duzen: 2 }
            sonraki: "tarti_kirildi"
          - id: "red"
            etiket: { tr: "Kimse beni tartamaz", en: "Nobody weighs me" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
            sonraki: "tarti_ondalikci"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Görünen seviyenle tartıl; gerisini sakla", en: "Get weighed at your visible level. Hide the rest" }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: 1 }
            sonraki: "tarti_gizli"

      - id: "tarti_gizli"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe hafifçe iniyor. Tartıcı bir pula sayı kazıyor ve sana uzatıyor: orta halli bir Tavvar kadar. Satılmaya değmez, satın alınmaya da.", en: "The pan dips a little. The weigher scratches a number into a chit and hands it over: about what an average Tavvari would weigh. Not worth selling, not worth buying." }
          - { tr: "Kalabalık ilgisini kaybediyor. Yalnızca çarşının kenarındaki pirinç kaplı, yüzsüz bir figür başını sana çeviriyor ve uzun süre öyle kalıyor.", en: "The crowd loses interest. Only a faceless figure plated in brass at the edge of the bazaar turns its head toward you, and stays that way a long time." }
        secenekler:
          - id: "git"
            etiket: { tr: "Figürü görmezden gel; çarşıda dolaş", en: "Ignore the figure. Wander the bazaar" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "tarti_kesra"

      - id: "tarti_kirildi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe bir kaya gibi iniyor. Öbür kefedeki pirinç ağırlıklar havaya fırlıyor, zincirler gerilip kopuyor ve dev terazinin kolu, dört yüz yıldır ilk kez, ortasından çatlıyor.", en: "The pan drops like a rock. The brass weights in the other pan go flying, the chains snap taut and break, and the arm of the great scale cracks down the middle for the first time in four hundred years." }
          - { tr: "Çarşı susuyor. Bu sessizlik burada çok pahalı; yüzlerce Tavvar konuşmamak için aynı anda bedel ödüyor.", en: "The bazaar goes silent. Silence costs a lot here. Hundreds of Tavvari are paying, all at once, not to talk." }
          - { tr: "Tartıcı kırık kola bakıyor, sonra sana. \"Ölçülemez,\" diye fısıldıyor; bu kelime için on pul ödüyor ve elleri titriyor.", en: "The weigher stares at the broken arm, then at you. \"Unweighable,\" he whispers. He pays ten chits for that word, and his hands are shaking." }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Kalabalığın bir kısmı başını eğiyor; seni bir Kadim sanıyorlar. Bir kısmı ise birbirine bakıyor ve bakışlarında hesap var: kaçak bir ondalık, sahibine geri götürülse ne eder?", en: "Part of the crowd bows; they think you're an Ancient. Another part is trading looks, and those looks are doing math: a runaway tithe, how much would that fetch, returned to its owner?" }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Kırık kefenin üstünde dur ve bekle", en: "Stand on the broken pan and wait" }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "tarti_ondalikci"

      - id: "tarti_ondalikci"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kalabalık ikiye ayrılıyor. Aradan pirinç kaplı, yüzsüz bir figür yürüyor; derisinde tek bir pul yok, onun yerine kesintisiz bir levha. Elinde bir terazi; küçük, zarif ve kusursuz.", en: "The crowd splits down the middle. Through the gap walks a faceless figure plated in brass. There isn't a single chit on its skin, just one seamless plate. In its hand, a set of scales: small, elegant, perfect." }
          - { tr: "Önünde duruyor. Sesi yok; ama terazisini kaldırıyor ve boş kefelerden biri senin ağırlığınla yere iniyor. Sonra levhasının göğsünden bir mühür uzatıyor. Kadim mührü. Kayıt mührü.", en: "It stops in front of you. It has no voice, but it raises its scales, and one empty pan sinks under your weight. Then a seal slides out of the plate on its chest. An Ancient seal. A registration seal." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kayıt talebi: Kadim Mülkiyet Dairesi]", en: "[Registration request: Ancient Office of Holdings]" }
            satirlar:
              - { tr: "Kayıtlı varlıklar Kervan'da serbestçe dolaşabilir.", en: "Registered entities may move freely on the Caravan." }
              - { tr: "Kayıtsız varlıklar ondalığa tabidir.", en: "Unregistered entities are subject to the tithe." }
        secenekler:
          - id: "damga"
            etiket: { tr: "Mührü kabul et; kayıt ol", en: "Accept the seal. Register" }
            etkiler:
              - bayrak: "kervan_damgali"
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 6 }
              - degisken: { kadim_tehdit: 2 }
            sonraki: "tarti_kesra"
          - id: "kir"
            etiket: { tr: "Mührü elinden al ve avucunda ez", en: "Take the seal and crush it in your fist" }
            etkiler:
              - bayrak: "kervan_muhur_ezildi"
              - ahlak: { duzen: -5, insanlik: 2 }
              - itibar: { kadimler: -6 }
              - dikkat: 5
            sonraki: "tarti_ezildi"
          - id: "dovus"
            etiket: { tr: "Mühürle değil, yumrukla cevap ver", en: "Answer with a fist, not a seal" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: -1 }
              - itibar: { kadimler: -8 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@dunya"], ortam: ["dar_gecit"], kazan: "tarti_zafer", kaybet: "tarti_yenilgi", kac: "tarti_kesra" }

      - id: "tarti_ezildi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mühür avucunda bir kuru yaprak gibi ufalanıyor. Figür bir süre parmaklarının arasından dökülen pirinç tozuna bakıyor. Sonra terazisini indiriyor, döner ve gider.", en: "The seal crumbles in your fist like a dry leaf. The figure watches the brass dust sift between your fingers for a while. Then it lowers its scales, turns and leaves." }
          - { tr: "Arkasından kimse konuşmuyor. Ama çarşının kenarında, genç bir Tavvar kadını sana bakıyor ve ilk kez, burada, birinin bedavaya gülümsediğini görüyorsun.", en: "Nobody says anything after it's gone. But at the edge of the bazaar, a young Tavvari woman is watching you, and for the first time here you see somebody smile for free." }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadına doğru yürü", en: "Walk over to the woman" }
            sonraki: "tarti_kesra"

      - id: "tarti_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Pirinç levha ortasından açılıyor ve figür dizlerinin üstüne çöküyor. Levhanın altında, perçinlerin arasında, bir zamanlar pullarla kaplı olmuş bir derinin izleri var; bir zamanlar bir Tavvarmış.", en: "The brass plate splits open down the middle, and the figure drops to its knees. Under the plate, between the rivets, are the scars of skin that used to be covered in chits. It used to be a Tavvari." }
          - { tr: "Çarşı nefesini tutuyor. Kimse bedel ödemiyor; kimse konuşmuyor. Bir Ondalıkçı'nın yere düştüğünü burada kimse görmemiş.", en: "The bazaar holds its breath. Nobody's paying. Nobody's talking. Nobody here has ever seen a Tithe-Taker hit the ground." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu orada bırak; çarşı görsün", en: "Leave it there. Let the bazaar see" }
            etkiler:
              - bayrak: "kervan_muhur_ezildi"
              - ahlak: { duzen: -2 }
              - itibar: { kadimler: -4 }
            sonraki: "tarti_kesra"

      - id: "tarti_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe şakağına iniyor ve dünya pirinç rengine kesiyor. Kendine geldiğinde çarşının kenarında, bir tezgâhın altındasın; birisi seni oraya sürüklemiş.", en: "The scale-pan connects with your temple, and the world goes brass-colored. When you come to, you're under a stall at the edge of the bazaar. Somebody dragged you there." }
          - { tr: "Genç bir Tavvar kadını yanında diz çökmüş. \"Burada kimse Ondalıkçı'ya vurmaz,\" diyor. \"Ama sen vurdun. Bu bir şey.\"", en: "A young Tavvari woman is kneeling next to you. \"Nobody here hits a Tithe-Taker,\" she says. \"But you did. That counts for something.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Doğrul ve dinle", en: "Sit up and listen" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "tarti_kesra"

      - id: "tarti_kesra"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Genç bir Tavvar kadını yanına geliyor. Derisinin sol yanında, kalbinin üstünde, söküldüğü belli olan bir pulun beyaz izi var.", en: "A young Tavvari woman comes up beside you. On the left side of her skin, over her heart, is the white scar of a chit somebody pried out." }
          - { tr: "\"Kesra,\" diyor ve bunun için pul ödemiyor. \"Bu çarşıda pul ödemeden konuşan tek kişi benim. Çünkü artık hiçbir şeyim yok; onu da sökmüşler.\"", en: "\"Kesra,\" she says, and doesn't pay for it. \"I'm the only one in this bazaar who talks without paying. Because I don't have anything left. They pried that out too.\"" }
          - { tr: "\"Yarın Ondalık günü,\" diyor. \"Gel ve gör. Sonra bize neyin fiyatı olduğunu söyle.\"", en: "\"Tomorrow is Tithe Day,\" she says. \"Come and see. Then you tell us what has a price.\"" }
        secenekler:
          - id: "gelecegim"
            etiket: { tr: "Geleceğim", en: "I'll be there" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "neden"
            etiket: { tr: "Neden bana söylüyorsun?", en: "Why are you telling me?" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 1, max: 2 } }
            sonraki: "tarti_neden"
          - id: "ilgilenmez"
            etiket: { tr: "Bu benim işim değil", en: "Not my business" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - tohum: { olay: "kervan_ondalik", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "tarti_neden"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra omzunu silkiyor. \"Senin dünyana da bir senet gelecek,\" diyor. \"Her dünyaya gelir. Bizimkini görmeni istiyorum ki imzalamadan önce okuyasın.\"", en: "Kesra shrugs. \"A treaty's coming to your world too,\" she says. \"It comes to every world. I want you to see ours, so you read yours before you sign it.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yarın görüşürüz", en: "See you tomorrow" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ ONDALIK (önemli)
  - id: "kervan_ondalik"
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "kervan", "ahlak", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Ondalık günü", en: "Tithe Day" }
    sahne: "ondalik_1"
    sahneler:
      - id: "ondalik_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Pirinç Kervan'ın bütün çanları değil, bütün terazileri çalıyor; binlerce kefe aynı anda inip kalkıyor. Ondalık günü. Senet Kulesi'nin önündeki meydan aile aile dolmuş.", en: "It isn't the Brass Caravan's bells that ring, it's every scale aboard; thousands of pans rise and fall at once. Tithe Day. The square in front of the Bond Tower is packed, family by family." }
          - { tr: "Seçilme yaşına gelmiş gençler ön sırada, derilerindeki boş pul yuvaları parlatılmış. Ondalıkçı aralarında sessizce yürüyor, küçük terazisini her birinin önünde bir kez kaldırıyor.", en: "The kids who've come of age stand in the front row, the empty chit sockets in their skin polished bright. The Tithe-Taker walks between them in silence, raising its little scales once in front of each one." }
          - { tr: "Onuncu gencin önünde kefe iniyor. Bir kız; ince, korkmuş, gözleri annesinin kalabalıktaki yüzünde. Ninu. Babası bir çığlık atıyor ve sesi için kimse pul istemiyor.", en: "In front of the tenth kid, the pan sinks. A girl: skinny, terrified, eyes locked on her mother's face in the crowd. Ninu. Her father lets out a scream, and nobody charges him for it." }
          - metin: { tr: "Ondalıkçı seni görüyor; göğsündeki Kadim mührünü görüyor. Terazisini indirip sana, bir memurun amirine yaptığı gibi, hafifçe eğiliyor.", en: "The Tithe-Taker sees you. Sees the Ancient seal on your chest. It lowers its scales and dips toward you slightly, the way a clerk would to a supervisor." }
            kosul: { bayrak: "kervan_damgali" }
          - metin: { tr: "Ondalıkçı seni görüyor. Terazisini bir an sana doğru çeviriyor, sonra geri çeviriyor. Mührü ezen yabancıyı unutmamış.", en: "The Tithe-Taker sees you. It turns its scales your way for a second, then turns them back. It hasn't forgotten the stranger who crushed its seal." }
            kosul: { bayrak: "kervan_muhur_ezildi" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Kızın babası kalabalığın arasından sana doğru itiliyor. Derisindeki bütün pulları, hayatının bütün defterini, söküp avucuna toplamış.", en: "The girl's father is shoving through the crowd toward you. He's pried every chit out of his skin, his whole life's ledger, and he's holding them out in his cupped hands." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onda bir. onda bir. biri seçilmezse terazi bir sonrakine geçer. bu bir kural değil, bir matematik. bunu bilerek seç.", en: "one in ten. one in ten. if one isn't taken, the scale moves on to the next. that's not a rule, it's arithmetic. choose knowing that." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir çocuğu kurtarıp ötekini seçtirmek kurtarmak değildir. Ama hiçbir şey yapmamak da değil.\"", en: "\"Saving one kid so the scale picks another isn't saving anyone. But neither is doing nothing.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"O pirinç şeyi indir ve bütün bu tiyatro biter. Neden herkes benim kadar basit düşünmüyor?\"", en: "\"Drop the brass guy and the whole show's over. Why doesn't anybody think as simple as me?\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşimi de böyle götürmüşler gibi hissediyorum. Bir şey yap. Lütfen.\"", en: "\"Feels like this is how they took my sister. Do something. Please.\"" }
        secenekler:
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Kızı kalabalığın içinde sakla", en: "Hide the girl in the crowd" }
            zar: { stat: "agi", zorluk: 380, tek: true, basarisiz: "ondalik_yakalandi", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { itibar: { kadimler: -4 } }] }
            etkiler:
              - bayrak: "ninu_saklandi"
              - gizle: 4
              - ahlak: { merhamet: 6, duzen: -4 }
            kronik: { tr: "Ondalık günü bir kızı kalabalığın içinde sakladın; terazi onun yerine başka bir çocuğu seçti.", en: "On Tithe Day you hid a girl in the crowd, and the scale picked another child in her place." }
            sonraki: "ondalik_siradaki"
          - id: "meydan"
            etiket: { tr: "Ondalıkçı'nın önüne çık; töreni durdur", en: "Step in front of the Tithe-Taker. Stop it" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -6 }
              - itibar: { kadimler: -10 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Dört yüz yıllık bir törenin ortasında Ondalıkçı'nın önüne çıktın; Pirinç Kervan o gün ilk kez bir Kadim memurunun düştüğünü gördü.", en: "In the middle of a four-hundred-year-old ceremony, you stepped in front of the Tithe-Taker. That day the Brass Caravan saw an Ancient official fall for the first time." }
          - id: "muaf"
            etiket: { tr: "Mührünü göster; kızı muaf tut", en: "Show your seal. Exempt the girl" }
            goster: { bayrak: "kervan_damgali" }
            etkiler:
              - bayrak: "ninu_muaf"
              - ahlak: { duzen: 4, insanlik: -3, merhamet: 2 }
              - itibar: { kadimler: 3 }
            kronik: { tr: "Kadim mührünü kullanıp bir kızı ondalıktan muaf tuttun; terazi bir sonrakine geçti ve herkes kimin adına konuştuğunu gördü.", en: "You used your Ancient seal to exempt a girl from the tithe. The scale moved on to the next one, and everybody saw whose name you were speaking in." }
            sonraki: "ondalik_siradaki"
          - id: "izle"
            etiket: { tr: "Karışma; bir vassallığın nasıl işlediğini izle", en: "Stay out of it. Watch how vassalage works" }
            etkiler:
              - bayrak: "ninu_teslim"
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { merhamet: -6, duzen: 6 }
              - degisken: { kadim_tehdit: 2 }
            kronik: { tr: "Ondalık gününde bir kızın götürülüşünü sessizce izledin; vassallığın nasıl işlediğini artık biliyordun.", en: "On Tithe Day you watched a girl get taken without a word. Now you knew how vassalage works." }
            sonraki: "ondalik_gidis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} terazinin hesabını bozsun", en: "Have {npc:yanki} break the scale's math" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "ondalik_bozuldu"
              - yozlasma: 4
              - ahlak: { duzen: -8, merhamet: 4 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - itibar: { kadimler: -6 }
              - degisken: { kadim_tehdit: 2 }
            kronik: { tr: "Kafandaki ses Pirinç Kervan'ın ondalık terazisini bozdu; o yıl kimse seçilmedi ve Kadimler bir açığı ilk kez fark etti.", en: "The voice in your head broke the Brass Caravan's tithe scale. Nobody was picked that year, and the Ancients noticed a shortfall for the first time." }
            sonraki: "ondalik_bozuk"

      - id: "ondalik_yakalandi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kızı omuzlardan kalabalığın içine çekiyorsun ama Ondalıkçı'nın terazisi daha hızlı. Kefe senin elinin üstüne iniyor; ağırlığı bir dünyanınki kadar.", en: "You pull the girl back into the crowd by the shoulders, but the Tithe-Taker's scales are faster. The pan comes down on your hand with the weight of a whole world." }
          - { tr: "Kalabalık senden uzaklaşıyor. Artık saklanacak yer yok; ya bırakacaksın ya dövüşeceksin.", en: "The crowd pulls back from you. There's nowhere left to hide. You either let go or you fight." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kızı bırakma; dövüş", en: "Don't let go of her. Fight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -4 }
              - dikkat: 4
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Saklayamadığın kızın elini bırakmadın ve Ondalıkçı'yla meydanın ortasında dövüştün.", en: "You couldn't hide the girl, so you didn't let go of her hand, and you fought the Tithe-Taker in the middle of the square." }
          - id: "birak"
            etiket: { tr: "Elini bırak", en: "Let go of her hand" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: -6, insanlik: -2 }
            kronik: { tr: "Ondalık günü bir kızın elini tuttun ve sonra bıraktın.", en: "On Tithe Day you held a girl's hand, and then you let go." }
            sonraki: "ondalik_gidis"

      - id: "ondalik_siradaki"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı bir an duruyor. Sonra hiçbir şey olmamış gibi bir sonraki gencin önüne geçiyor ve terazisini kaldırıyor. Kefe iniyor.", en: "The Tithe-Taker pauses for a second. Then, like nothing happened, it moves on to the next kid in line and raises its scales. The pan sinks." }
          - { tr: "Bu kez bir oğlan. Kimse onun adını söylemiyor; ailesi kalabalığın en arkasında, babasının elleri boş. Pul sökecek kadar zengin bile değil.", en: "A boy this time. Nobody says his name. His family is at the very back of the crowd, his father's hands empty. They aren't even rich enough to have chits to pry out." }
          - { tr: "Ninu annesinin kollarında ağlıyor. Oğlan Senet Kulesi'ne doğru yürüyor ve arkasına bakmıyor.", en: "Ninu is sobbing in her mother's arms. The boy walks toward the Bond Tower and doesn't look back." }
        secenekler:
          - id: "oglan"
            etiket: { tr: "Oğlanın da önüne geç", en: "Step in front of the boy too" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -6 }
              - itibar: { kadimler: -10 }
              - dikkat: 6
              - savas: { dusmanlar: ["ondalikci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "ondalik_zafer", kaybet: "ondalik_yenilgi", kac: "ondalik_kacis" }
            kronik: { tr: "Bir çocuğu kurtardıktan sonra terazinin yerine seçtiği çocuk için de dövüştün; Ondalık, o gün kimseyi götüremedi.", en: "After you saved one child, you fought for the one the scale picked in her place, and the Tithe took no one that day." }
          - id: "bak"
            etiket: { tr: "Oğlanın gidişini izle", en: "Watch the boy go" }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -1 }
            kronik: { tr: "Bir kızı kurtardın ve onun yerine götürülen oğlanın gidişini izledin; adını hiç öğrenmedin.", en: "You saved one girl and watched the boy taken in her place walk away. You never learned his name." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_gidis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ninu Senet Kulesi'ne doğru yürüyor. Annesi bağırmıyor; babası avucundaki pulları yere döküyor ve dizlerinin üstüne çöküyor.", en: "Ninu walks toward the Bond Tower. Her mother doesn't scream. Her father drops the chits out of his hands and goes down on his knees." }
          - { tr: "Kulenin kapısı açılıyor, kapanıyor. Meydandaki herkes aynı anda bir pul ödüyor, sessizce; yas tutmanın burada da bir bedeli var.", en: "The tower door opens, then closes. Everyone in the square pays one chit at the same time, in silence. Here, even grief costs something." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Meydanın dağılmasını bekle", en: "Wait for the square to empty" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "Ondalık meydanı boşalana kadar bekledin; Tavvarların yasını bir alışveriş gibi izledin.", en: "You waited until the tithe square emptied out, and watched the Tavvari grieve like it was a transaction." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_bozuk"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı terazisini Ninu'nun önünde kaldırıyor ve kefe inmiyor. Bir sonrakinin önünde de inmiyor. Bir sonrakinin de.", en: "The Tithe-Taker raises its scales in front of Ninu, and the pan doesn't sink. It doesn't sink for the next one, either. Or the next." }
          - { tr: "Meydanda bir uğultu yükseliyor ve kimse bunun için pul ödemiyor. Ondalıkçı terazisine bakıyor, sallıyor, yeniden kaldırıyor. Hiçbir şey.", en: "A murmur goes up across the square, and nobody pays a single chit for it. The Tithe-Taker looks at its scales, shakes them, raises them again. Nothing." }
          - { tr: "{npc:yanki}: on, onda bir. ben bölmeyi biraz bozdum. Kadimler bunu fark edecek. ama bu yıl değil.", en: "{npc:yanki}: ten, one in ten. i broke the division a little. the Ancients will notice. just not this year." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[o̷ndalık: 0]", en: "[t̷ithe: 0]" }
            satirlar:
              - { tr: "hesap hatası raporlandı. raporlayan: kimse.", en: "calculation error reported. reported by: nobody." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ninu'nun ailesine kavuşmasını izle", en: "Watch Ninu go back to her family" }
            etkiler:
              - ahlak: { merhamet: 3 }
            kronik: { tr: "Bir yıllığına Pirinç Kervan'da hiçbir çocuk seçilmedi; bunun kimin işi olduğunu yalnızca sen ve kafandaki ses bildi.", en: "For one year, no child on the Brass Caravan was picked. Only you and the voice in your head knew whose doing it was." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Ondalıkçı'nın levhası ortasından ikiye ayrılıyor ve küçük, kusursuz terazisi meydanın pirinç zeminine düşüp tıngırdıyor. Dört yüz yıldır kimse o sesi duymamış.", en: "The Tithe-Taker's plate splits in two, and its little perfect scales hit the brass floor of the square with a clang. Nobody's heard that sound in four hundred years." }
          - { tr: "Önce kimse kıpırdamıyor. Sonra bir çocuk koşup teraziyi alıyor ve kulenin önündeki kanala fırlatıyor. Kalabalık bağırıyor; ama bunun öfke mi sevinç mi olduğunu kestiremiyorsun.", en: "At first, nobody moves. Then a kid runs out, grabs the scales and hurls them into the canal in front of the tower. The crowd roars, and you can't tell if it's rage or joy." }
          - { tr: "Senet Kulesi'nin tepesinde pirinç bir ışık yanıyor. Bir şey, kulenin derinlerinde, uyanıyor.", en: "At the top of the Bond Tower, a brass light comes on. Something deep inside the tower is waking up." }
        secenekler:
          - id: "ninu"
            etiket: { tr: "Ninu'yu ve oğlanı ailelerine geri götür", en: "Bring Ninu and the boy back to their families" }
            etkiler:
              - bayrak: "ondalikci_olduruldu"
              - bayrak: "ninu_saklandi"
              - ahlak: { merhamet: 4, duzen: -2 }
              - xp_seviye: 40
            kronik: { tr: "Ondalıkçı'yı devirdin ve o yıl seçilen bütün çocukları ailelerine geri götürdün.", en: "You took down the Tithe-Taker and brought every child picked that year back to their families." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kefe seni yere seriyor. Gözlerinin önünde kusursuz terazi kalkıyor ve üstünde bir sayı yanıyor: senin fiyatın. Ondalıkçı onu ilk kez ölçebiliyor.", en: "The pan knocks you flat. Above you the perfect scales lift, and a number glows on them: your price. For the first time, the Tithe-Taker can measure it." }
          - { tr: "Kesra ve iki genç seni kollarından tutup kalabalığın içine çekiyor. Ninu'yu kulenin kapısında son kez görüyorsun.", en: "Kesra and two kids grab you under the arms and drag you into the crowd. The last time you see Ninu, she's at the door of the tower." }
        secenekler:
          - id: "kac"
            etiket: { tr: "Kalabalığın içinde kaybol", en: "Disappear into the crowd" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: 1, insanlik: 1 }
              - can: 40
            kronik: { tr: "Ondalıkçı'ya yenildin ve kurtarmaya çalıştığın kız Senet Kulesi'ne yürüdü.", en: "You lost to the Tithe-Taker, and the girl you tried to save walked into the Bond Tower." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Ondalıkçı peşinden gelmiyor; terazisini yeniden Ninu'nun önünde kaldırıyor ve kefe iniyor.", en: "You back off. The Tithe-Taker doesn't follow. It raises its scales in front of Ninu again, and the pan sinks." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Uzaktan izle", en: "Watch from a distance" }
            etkiler:
              - bayrak: "ninu_teslim"
              - ahlak: { merhamet: -4 }
            kronik: { tr: "Ondalıkçı'nın önünden çekildin ve bir kızın götürülüşünü uzaktan izledin.", en: "You backed away from the Tithe-Taker and watched a girl get taken from a distance." }
            sonraki: "ondalik_kesra"

      - id: "ondalik_kesra"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Gece, Kervan'ın kıç güvertelerinde, makinelerin gürültüsünün sözleri yuttuğu yerde Kesra seni buluyor. Burada pul ödenmiyor; çünkü kimse duymuyor.", en: "That night, down on the Caravan's stern decks, where the roar of the engines swallows every word, Kesra finds you. Nobody pays chits down here, because nobody can hear." }
          - { tr: "\"Onda birin nereye gittiğini biliyor musun?\" diye soruyor. \"Hizmetkâr olmuyorlar. Yedi Taht'ta seviyeleri sağılıyor ve bir Kadim'in derisinin altına yıldız olarak gömülüyorlar. Kardeşim şimdi birinin omzunda parlıyor.\"", en: "\"Do you know where the tithe goes?\" she asks. \"They don't become servants. In the Sevenfold Court they get milked for their levels and buried under some Ancient's skin as stars. My brother's shining on somebody's shoulder right now.\"" }
          - { tr: "\"Senedin mühür makinesi Kervan'ın kalbinde,\" diyor. \"Biz ona Boş Kefe diyoruz; tartılacak hiçbir şeyimiz kalmadığı için. Kırmak istiyoruz. Seninle.\"", en: "\"The treaty's seal engine is in the Caravan's heart,\" she says. \"We call ourselves the Empty Pan, because we've got nothing left to weigh. We want to break it. With you.\"" }
          - metin: { tr: "Bakışları göğsündeki Kadim mührüne kayıyor ve bir an duruyor. \"Ya da sen onların adamısın,\" diyor. \"O zaman bunu söylediğime pişman olacağım.\"", en: "Her eyes slide to the Ancient seal on your chest and stay there a second. \"Or you're one of theirs,\" she says. \"In which case I'm going to regret telling you this.\"" }
            kosul: { bayrak: "kervan_damgali" }
        secenekler:
          - id: "dusun"
            etiket: { tr: "Düşüneceğim", en: "I'll think about it" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Pirinç Kervan'ın isyancılarına düşüneceğini söyledin; düşündüğün sürede onlar bekledi.", en: "You told the Brass Caravan's rebels you'd think about it, and they waited while you did." }
            sonraki: "@akis"
          - id: "evet"
            etiket: { tr: "Ne zaman başlıyoruz?", en: "When do we start?" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: -4, merhamet: 2 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Pirinç Kervan'ın isyancılarına daha planlarını duymadan evet dedin.", en: "You said yes to the Brass Caravan's rebels before you'd even heard the plan." }
            sonraki: "@akis"
          - id: "sayman"
            etiket: { tr: "Önce Sayman'ı dinlemek istiyorum", en: "I want to hear the Reckoner out first" }
            etkiler:
              - bilgi: "ondalik_gercegi"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 3 }
              - tohum: { olay: "kervan_sayman", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "İsyancıların teklifinden önce Kervan'ın efendisini dinlemeyi seçtin.", en: "Before you'd answer the rebels, you chose to hear out the Caravan's master." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ SAYMAN (yedi_taht_davet)
  - id: "kervan_sayman"
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "kervan", "kadimler", "siyaset"]
    gerilim: 2
    kart: { tr: "Sayman", en: "The Reckoner" }
    sahne: "sayman_1"
    sahneler:
      - id: "sayman_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Senet Kulesi'nin tepesine bir davetle çağrılıyorsun; davet bir pul, üstünde tek hece. Pirinç Kervan'a geldiysen bir gün mutlaka çağrılırsın; Sayman herkesi tartar.", en: "You get summoned to the top of the Bond Tower. The summons is a single chit with one syllable on it. Come to the Brass Caravan, and sooner or later you get called up; the Reckoner weighs everyone." }
          - { tr: "Sayman çok yaşlı bir Tavvar. Derisinin tek bir boş yeri yok; tepeden tırnağa pul, Kervan'ın dört yüz yıllık bütün defteri onun bedeninde yazılı.", en: "The Reckoner is a very old Tavvari. There isn't a bare inch on him. He's chits from crown to heel, the Caravan's entire four-hundred-year ledger written on his body." }
          - { tr: "Konuşmadan önce kolundan bir pul söküyor ve masaya bırakıyor. Kan yok; yalnızca ince, beyaz bir iz. \"Her söz bir bedeldir,\" diyor. \"Seninle konuşmak için kendimden ödüyorum. Bunu bil.\"", en: "Before he speaks, he pries a chit off his own arm and sets it on the table. No blood, just a thin white scar. \"Every word has a price,\" he says. \"To talk to you, I pay out of myself. Know that.\"" }
        sezgiler:
          - kosul: { stat: { per: 130 } }
            metin: { tr: "Sökülen pul rastgele değil. Kolunun en eski satırından, kendi doğumunu yazan pulun hemen yanından alınmış.", en: "The chit he pulled isn't random. It came from the oldest line on his arm, right next to the one recording his own birth." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu adam bir defter değil, bir bedel listesi. ve listenin en başında bir çocuk var.", en: "this man isn't a ledger. he's an invoice. and at the very top of the invoice is a child." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Otur ve dinle", en: "Sit down and listen" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "sayman_senet"
          - id: "ode"
            etiket: { tr: "Sen de bir pul öde; eşit konuşalım", en: "Pay a chit yourself. Talk as equals" }
            gerekli: { esya: { pirinc_pul: 1 } }
            etkiler:
              - esya: { pirinc_pul: -1 }
              - ahlak: { insanlik: 2, duzen: 1 }
            sonraki: "sayman_senet"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} derisinin en başını okusun", en: "Have {npc:yanki} read the top of his skin" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, saygi: 2 } }
              - ahlak: { insanlik: -1 }
            sonraki: "sayman_kizi"

      - id: "sayman_kizi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:yanki} satırları dizdikçe bir isim beliriyor; Sayman'ın kalbinin üstündeki ilk pul: bir kız, ilk çocuğu. Altında tek bir hece: ondalık.", en: "As {npc:yanki} lines up the entries, a name surfaces: the first chit over the Reckoner's heart. A girl, his firstborn. Under it, a single syllable: tithe." }
          - { tr: "Sayman senin gözlerinin nereye kaydığını görüyor. Pulunu ödemeden, bedavaya, \"Evet,\" diyor. \"İlk ben verdim. Sayman olmanın şartı bu.\"", en: "The Reckoner sees where your eyes went. Without paying, for free, he says: \"Yes. I gave first. That's the price of being Reckoner.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Anlatmasına izin ver", en: "Let him tell it" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "sayman_senet"

      - id: "sayman_senet"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "\"Dört yüz on iki yıl önce Kadimler bizi hasat etmeye geldi,\" diyor Sayman ve her cümlede bir pul daha masaya düşüyor. \"Bizim de üç yüz altmış beş günümüz vardı. Savaşabilirdik. Ölürdük.\"", en: "\"Four hundred and twelve years ago, the Ancients came to harvest us,\" the Reckoner says, and a chit hits the table with every sentence. \"We had three hundred and sixty-five days too. We could have fought. We'd have died.\"" }
          - { tr: "\"Büyükannem onlara bir teklif yaptı: hasat edilmek yerine sahiplenilmek. Dünyamızı bir gemiye çevirdik, her kuşağın onda birini verdik ve senedi kendi sırtına yazdırdı. Dokuzda biz yaşadık. Bin yıl sürerse bin yıl yaşarız.\"", en: "\"My grandmother made them an offer: own us instead of harvesting us. We turned our world into a ship, we gave a tenth of every generation, and she had the treaty written on her own back. On the other nine, we live. If it lasts a thousand years, we live a thousand years.\"" }
          - { tr: "\"Senin dünyana da bir elçi geldi,\" diyor. \"Bir senet getirecek. Herkese getirirler. Ben sana o senedin neye benzediğini gösteriyorum: bize.\"", en: "\"An envoy has come to your world too,\" he says. \"He'll bring a treaty. They bring one to everyone. I'm showing you what that treaty looks like. It looks like us.\"" }
          - metin: { tr: "\"Elçinizin adını biliyorum,\" diye ekliyor. \"{npc:thessar}. Raporları Yedi Taht'ta okunuyor. Senin adın da o raporlarda.\"", en: "\"I know your envoy's name,\" he adds. \"{npc:thessar}. His reports are read in the Sevenfold Court. Your name is in those reports.\"" }
            kosul: { bayrak: "thessar_indi" }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Dokuzda biz yaşadık. Bunu bir başarı hikâyesi gibi anlatıyor. Bu beni her şeyden çok korkutuyor.\"", en: "\"'On the other nine, we live.' He's telling it like a success story. That scares me more than anything.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yaşamak yaşamaktır. Ama ben onda birin annesine bunu söyleyemem.\"", en: "\"Living is living. But I couldn't say that to the mother of the tenth.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Benden ne istiyorsun?", en: "What do you want from me?" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: 1 }
            sonraki: "sayman_teklif"
          - id: "haklisin"
            etiket: { tr: "Doğru seçimi yapmışsınız", en: "You made the right call" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 4 }
            sonraki: "sayman_teklif"
          - id: "yanlis"
            etiket: { tr: "Bu yaşamak değil; taksitle ölmek", en: "That's not living. That's dying in installments" }
            etkiler:
              - bilgi: "kervan_boyun_senedi"
              - ahlak: { duzen: -4, insanlik: 3 }
              - itibar: { kadimler: -3 }
            sonraki: "sayman_teklif"

      - id: "sayman_teklif"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sayman masaya iki şey koyuyor. Biri mühürlü bir mektup: Kadim yazısıyla, ışıktan bir şeritle bağlı. \"Yedi Taht'a giriş,\" diyor. \"Davetsiz kimse giremez. Ben seni davet ettirebilirim.\"", en: "The Reckoner lays two things on the table. One is a sealed letter in Ancient script, tied with a ribbon of light. \"Entry to the Sevenfold Court,\" he says. \"No one gets in uninvited. I can get you invited.\"" }
          - { tr: "Öteki bir pirinç levha: bir ticaret yolu. \"Senin şehrinle Kervan arasında,\" diyor. \"Tahıl, ilaç, pirinç, mühendis. Kadimler onaylar; bizim üstümüzden yapılan her ticareti onaylarlar.\"", en: "The other is a brass plate: a trade route. \"Between your city and the Caravan,\" he says. \"Grain, medicine, brass, engineers. The Ancients will approve it. They approve any trade that runs through us.\"" }
          - { tr: "\"Karşılığında,\" diyor ve bu kez iki pul birden söküyor, \"Boş Kefe'yi durdur. Kesra'nın çocuklarını. Mührü kırarlarsa koruma biter ve Kadimler bizi bir gecede toplar. Özgürlük bizi öldürür.\"", en: "\"In exchange,\" he says, and this time he pries off two chits at once, \"stop the Empty Pan. Kesra's children. If they break the seal, the protection ends, and the Ancients collect us in a single night. Freedom will kill us.\"" }
        sezgiler:
          - kosul: { stat: { int: 160 } }
            metin: { tr: "Mektubun Kadim yazısını okuyabiliyorsun; kıvrımları bir pencerenin satırlarına benziyor. Seni 'konuk' olarak değil, 'numune' olarak tanıtıyor.", en: "You can read the Ancient script on the letter; its curls look like the lines of a window. It doesn't introduce you as a 'guest.' It introduces you as a 'specimen.'" }
        secenekler:
          - id: "mektup"
            etiket: { tr: "Mektubu olduğu gibi al", en: "Take the letter as it is" }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - bayrak: "sayman_numune_mektubu"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 } }
            sonraki: "sayman_kefe"
          - id: "yazdir"
            tur: "gosteris"
            etiket: { tr: "Mektubu oku; 'numune'yi 'konuk' yaptır", en: "Read it. Make him change 'specimen' to 'guest'" }
            gerekli: { stat: { int: 160, cha: 150 } }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - aciga_vur: true
              - ahlak: { duzen: -1, insanlik: 2 }
              - itibar: { kadimler: 2 }
              - dikkat: 3
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 } }
            sonraki: "sayman_yazdi"
          - id: "ticaret"
            etiket: { tr: "Ticaret yolunu al; şehrin buna muhtaç", en: "Take the trade route. Your city needs it" }
            etkiler:
              - bayrak: "kervan_ticaret"
              - ahlak: { duzen: 4, insanlik: -2, merhamet: 2 }
              - itibar: { lonca: 5, siginak: 3, kadimler: 6 }
              - degisken: { kadim_tehdit: 3, hayatta_kalan: 2 }
            sonraki: "sayman_kefe"
          - id: "hicbiri"
            etiket: { tr: "İkisini de geri it", en: "Push both back across the table" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { kadimler: -3 }
            sonraki: "sayman_kefe"

      - id: "sayman_yazdi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mektubu açıp yüksek sesle okuyorsun; Kadim kelimelerini doğru telaffuz ettiğin anda Sayman'ın derisindeki pullar ürperiyor. \"Numune,\" diyorsun. \"Yanlış yazılmış.\"", en: "You open the letter and read it out loud. The moment you pronounce the Ancient words right, the chits on the Reckoner's skin shiver. \"Specimen,\" you say. \"That's a typo.\"" }
          - { tr: "Uzun bir sessizlik; Sayman bunun için yedi pul ödüyor. Sonra kalemi alıp tek bir kelimeyi değiştiriyor. \"Kadimler bunu sevmeyecek,\" diyor. \"Ben de sevmedim. Ama seni tartamadım; bunu da yazmam gerekirdi.\"", en: "A long silence. The Reckoner pays seven chits for it. Then he picks up the pen and changes one word. \"The Ancients won't like this,\" he says. \"Neither do I. But I couldn't weigh you, and I'd have had to write that down too.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Mektubu al", en: "Take the letter" }
            sonraki: "sayman_kefe"

      - id: "sayman_kefe"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kalkarken Sayman bir pul daha söküyor ama masaya koymuyor; sana uzatıyor. Üstünde tek hece var: 'lütfen'.", en: "As you get up, the Reckoner pries off one more chit, but instead of putting it on the table he holds it out to you. One syllable on it: 'please.'" }
          - metin: { tr: "\"Ondalıkçı'yı yere serdin,\" diyor. \"Kesra'nın çocukları artık yüzlerce. Yarın binlerce olurlar. Sen onların bayrağısın, istesen de istemesen de.\"", en: "\"You put the Tithe-Taker on the ground,\" he says. \"Kesra's children number in the hundreds now. Tomorrow it'll be thousands. You're their flag, whether you want to be or not.\"" }
            kosul: { bayrak: "ondalikci_olduruldu" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Pulu al; Boş Kefe'yi durduracağına söz ver", en: "Take the chit. Promise to stop the Empty Pan" }
            etkiler:
              - bayrak: "sayman_soz"
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 4 } }
            sonraki: "@akis"
          - id: "red"
            etiket: { tr: "Pulu geri ver; söz yok", en: "Give the chit back. No promises" }
            etkiler:
              - bayrak: "kervan_kefe_daveti"
              - ahlak: { duzen: -2, insanlik: 1 }
              - tohum: { olay: "kervan_bos_kefe", gecikme: { min: 1, max: 4 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ BOŞ KEFE (boss · önemli)
  - id: "kervan_bos_kefe"
    perde: [3, 4]
    bolge: ["pirinc_kervan"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "kervan_kefe_daveti" }
    agirlik: 4
    etiketler: ["cok_evren", "kervan", "boss", "kadimler"]
    gerilim: 4
    onemli: true
    kart: { tr: "Boş Kefe", en: "The Empty Pan" }
    sahne: "kefe_1"
    sahneler:
      - id: "kefe_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra'nın haberi seni bulduğunda yanına bir pul bile koymamış; yalnızca bir yer ve bir saat. Pirinç Kervan'ın kıç güvertelerine, makinelerin sözleri yuttuğu yere iniyorsun.", en: "When Kesra's message reaches you, she hasn't sent a single chit with it, just a place and a time. You go down to the Brass Caravan's stern decks, where the engines swallow every word." }
          - { tr: "Kırk Tavvar bekliyor; hepsinin derisinde sökülmüş pulların beyaz izleri. Kesra ortalarında, elinde Kervan'ın kalbinin bir çizimi: dişliler, zincirler ve ortada, camın içinde, bir Tavvar sırtından alınmış bir deri. Senet.", en: "Forty Tavvari are waiting, all of them marked with the white scars of pried-out chits. Kesra stands in the middle with a drawing of the Caravan's heart: gears, chains, and in the center, under glass, a hide taken off a Tavvari back. The treaty." }
          - { tr: "\"Mührü kırarsak senet biter,\" diyor. \"Kadimler gelir. Kervan'ı Karanlık Rota'ya, hiçbir Katman'ın olmadığı yere sürüp kaçacağız. Belki ölürüz. Ama onda birimizi vermeyiz.\"", en: "\"If we break the seal, the treaty's void,\" she says. \"The Ancients will come. We'll drive the Caravan onto the Dark Route, out where there are no Layers, and run. Maybe we die. But we don't hand over our tenth.\"" }
          - metin: { tr: "Kırk değil, yüzlerce. Ondalıkçı'nın düştüğü günden beri güverteler doldu; kalabalığın en önünde perdeli değil, altı parmaklı bir el sana bir pul uzatıyor. Ninu.", en: "Not forty. Hundreds. The decks have been filling up since the day the Tithe-Taker fell, and at the front of the crowd a six-fingered hand holds out a chit to you. Ninu." }
            kosul: { bayrak: "ondalikci_olduruldu" }
          - metin: { tr: "Kesra'nın gözü göğsündeki Kadim mühründe. \"Sayman'ın pulunu aldın mı?\" diye soruyor. \"Söyle. Burada yalan bedava değil.\"", en: "Kesra's eyes are on the Ancient seal on your chest. \"Did you take the Reckoner's chit?\" she asks. \"Say it. Lies aren't free down here.\"" }
            kosul: { bayrak: "sayman_soz" }
        sezgiler:
          - kosul: { stat: { int: 160 } }
            metin: { tr: "Çizime bakılırsa mühür makinesi Kervan'ın ana motoruna bağlı. Kırılırsa gemi bir süre sürüklenecek; Karanlık Rota'ya varmaları için birinin onu itmesi gerekecek.", en: "Going by the drawing, the seal engine is wired into the Caravan's main drive. Break it, and the ship drifts for a while. Somebody's going to have to push it onto the Dark Route." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir senedi kırmak bir zinciri kırmaktır. ama zincir aynı zamanda bir çapa. bunu onlar da biliyor. yine de istiyorlar.", en: "breaking a treaty is breaking a chain. but a chain is also an anchor. they know that. they want it anyway." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kalbe giden yol, bekçi, büyük bir makine. Bana sorarsan bu bir davet.\"", en: "\"Road to the heart, a guardian, one big machine. If you ask me, that's an invitation.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bin kişinin özgürlüğü için kaç kişi ölür, hesapladın mı? Onlar hesapladı. Asıl korkunç olan bu.\"", en: "\"Did you do the math on how many die so a thousand go free? They did. That's the terrifying part.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir senet, bir mühür, bir makine. Bizim Sistem'e bu kadar yakın bir şey hiç görmedim. Kır onu.\"", en: "\"A treaty, a seal, a machine. Never seen anything this close to our System. Break it.\"" }
        secenekler:
          - id: "liderlik"
            etiket: { tr: "Saldırıyı sen yönet; kalbe in", en: "Lead the strike. Go down to the heart" }
            etkiler:
              - ahlak: { duzen: -6, merhamet: 2 }
              - itibar: { kadimler: -6 }
              - iliski: { yanki: { saygi: 3 } }
            kronik: { tr: "Pirinç Kervan'ın isyancılarını geminin kalbine kendin götürdün.", en: "You led the Brass Caravan's rebels down into the heart of the ship yourself." }
            sonraki: "kefe_kalp"
          - id: "oylama"
            tur: "gosteris"
            etiket: { tr: "Bütün Kervan oylasın; sesini çarşıya duyur", en: "Let the whole Caravan vote. Make the bazaar hear" }
            gerekli: { stat: { cha: 190 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: 2, insanlik: 4 }
            kronik: { tr: "Dört yüz yılda ilk kez Pirinç Kervan'ın bütün halkına neyin bedelini ödemek istediklerini sordun.", en: "For the first time in four hundred years, you asked the whole Brass Caravan what price they actually wanted to pay." }
            sonraki: "kefe_oylama"
          - id: "ihanet"
            etiket: { tr: "Sayman'a ve Kadimler'e haber ver", en: "Tip off the Reckoner and the Ancients" }
            etkiler:
              - bayrak: "kervan_muhur_korundu"
              - ahlak: { duzen: 8, merhamet: -6, insanlik: -3 }
              - itibar: { kadimler: 12 }
              - degisken: { kadim_tehdit: 4 }
            kronik: { tr: "Boş Kefe'yi Kadimler'e sattın; Pirinç Kervan'ın senedi bir dört yüz yıl daha sürdü.", en: "You sold the Empty Pan to the Ancients, and the Brass Caravan's treaty held for another four hundred years." }
            sonraki: "kefe_ihanet"
          - id: "ayril"
            etiket: { tr: "Bu sizin savaşınız; ben yokum", en: "This is your fight. Count me out" }
            etkiler:
              - bayrak: "kervan_isyan_yalniz"
              - ahlak: { duzen: 2, merhamet: -3 }
            kronik: { tr: "Pirinç Kervan'ın isyancılarını kendi savaşlarıyla yalnız bıraktın.", en: "You left the Brass Caravan's rebels alone with their own war." }
            sonraki: "kefe_ayril"

      - id: "kefe_oylama"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sesin Tartı Çarşısı'nda yankılanıyor ve kimse senden pul istemiyor. Kesra'nın gençleri dev terazinin kırık kolunu zincirlerle onarıyor; bir kefeye 'kal', ötekine 'kır' yazıyorlar.", en: "Your voice booms across the Weighing Bazaar, and nobody asks you for a chit. Kesra's kids patch the great scale's broken arm with chains and label the pans: 'stay' on one, 'break' on the other." }
          - { tr: "Bütün gece Tavvarlar sıraya giriyor. Her biri derisinden bir pul söküp bir kefeye atıyor. Bazıları ağlıyor; bazıları dört yüz yıldır ilk kez kendi sesleriyle bir şey söylüyor.", en: "All night the Tavvari line up. Each one pries a chit out of their skin and drops it in a pan. Some are crying. Some are saying something in their own voice for the first time in four hundred years." }
          - { tr: "Şafakta terazi 'kır' tarafına iniyor. Senet Kulesi'nde Sayman başını eğiyor. Ve Kervan'ın kalbinde, dişliler ters yöne dönmeye başlıyor.", en: "At dawn the scale tips toward 'break.' Up in the Bond Tower, the Reckoner bows his head. And in the Caravan's heart, the gears start to turn backward." }
        secenekler:
          - id: "kalp"
            etiket: { tr: "Kalbe in; halkın kararını uygula", en: "Go down to the heart. Carry out the vote" }
            etkiler:
              - bayrak: "kervan_oylandi"
              - ahlak: { duzen: -3, insanlik: 2 }
            kronik: { tr: "Bir halkın oyunu kendi ellerinle mühür makinesine taşıdın.", en: "You carried a people's vote down to the seal engine with your own hands." }
            sonraki: "kefe_kalp"

      - id: "kefe_kalp"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kervan'ın kalbi bir katedral kadar büyük. Dişliler evler kadar, zincirler gövde kalınlığında; her şey pirinç, her şey ağır ve sıcak. Ortada, camın içinde, senet: üstündeki Kadim yazısı hâlâ hafifçe ışıldıyor.", en: "The Caravan's heart is the size of a cathedral. Gears as big as houses, chains as thick as a body, everything brass, everything heavy and hot. In the middle, under glass, the treaty, the Ancient script on it still faintly glowing." }
          - { tr: "Camın önüne yaklaştığında dişliler duruyor. Sonra hepsi aynı anda ters yöne dönüyor ve makinenin içinden binlerce imzanın sesi aynı cümleyi kuruyor: [Senet bozulamaz.]", en: "When you get close to the glass, the gears stop. Then every one of them spins backward at once, and from inside the machine the voice of a thousand signatures says one sentence: [The bond cannot be broken.]" }
          - { tr: "Zincirler, dişliler, pirinç levhalar birbirine geçiyor ve önünde bir şey doğruluyor. Mühürdar.", en: "Chains, gears and brass plates lock together, and something rises up in front of you. The Sealwarden." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[SENET BEKÇİSİ: Mühürdar]", en: "[TREATY GUARDIAN: The Sealwarden]" }
            satirlar:
              - { tr: "Yetki: Kadim. Süre: 412 yıl. İhlal: tespit edildi.", en: "Authority: Ancient. Term: 412 years. Breach: detected." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Mühürdar'la yüzleş", en: "Face the Sealwarden" }
            etkiler:
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["muhurdar@oyuncu+6"], ortam: ["dar_gecit"], kazan: "kefe_zafer", kaybet: "kefe_yenilgi", kac: "kefe_kacis" }
            kronik: { tr: "Dört yüz yıllık bir senedin bekçisiyle Pirinç Kervan'ın kalbinde dövüştün.", en: "You fought the guardian of a four-hundred-year-old treaty in the heart of the Brass Caravan." }
          - id: "zincir"
            etiket: { tr: "Önce Kesra'nın gençleri zincirleri kessin", en: "Have Kesra's kids cut the chains first" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -2 }
              - savas: { dusmanlar: ["muhurdar@oyuncu+3"], ortam: ["dar_gecit"], kazan: "kefe_zafer", kaybet: "kefe_yenilgi", kac: "kefe_kacis" }
            kronik: { tr: "Mühürdar'ın zincirlerini isyancıların ellerine kestirdin; bazıları bunu canlarıyla ödedi.", en: "You had the rebels cut the Sealwarden's chains by hand. Some of them paid for it with their lives." }

      - id: "kefe_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Mühürdar'ın göğsü açılıyor ve dişliler birer birer kırılıyor. İmzaların sesi dağılıyor; en son bir çocuk sesi kalıyor ve o da susuyor.", en: "The Sealwarden's chest splits open, and the gears break one by one. The voice of the signatures falls apart, until only a child's voice is left, and then that goes quiet too." }
          - { tr: "Camın içindeki senet artık ışıldamıyor. Bütün Kervan bir an sarsılıyor; motorlar susuyor ve dört yüz yıl sonra ilk kez gemi kimseye ait değil.", en: "The treaty under the glass doesn't glow anymore. The whole Caravan shudders. The engines cut out, and for the first time in four hundred years the ship belongs to no one." }
          - { tr: "Kesra camın önünde duruyor; elinde bir meşale. Sana bakıyor. Bu kararı sana bırakıyor, çünkü kalbe kadar seni izlediler.", en: "Kesra is standing in front of the glass with a torch in her hand. She's looking at you. She's leaving this one to you, because they followed you all the way to the heart." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[Bağ durumu: geçersiz]", en: "[Bond status: void]" }
            satirlar:
              - { tr: "Tavvar Kervanı: bağsız Katman. Hasat koruması: yok.", en: "Tavvari Caravan: unbonded Layer. Harvest protection: none." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Meşaleyi al ve senedi yak", en: "Take the torch. Burn the treaty" }
            etkiler:
              - bayrak: "kervan_ozgur"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 1 }
              - ahlak: { duzen: -6, insanlik: 4, merhamet: 2 }
              - itibar: { kadimler: -15 }
              - degisken: { kadim_tehdit: -6 }
              - xp_seviye: 120
            kronik: { tr: "Pirinç Kervan'ın dört yüz yıllık senedini kendi ellerinle yaktın; Tavvarlar sahiplerini kaybetti ve Karanlık Rota'ya kendi başlarına açıldılar.", en: "You burned the Brass Caravan's four-hundred-year-old treaty with your own hands. The Tavvari lost their owners and set out onto the Dark Route on their own." }
            sonraki: "kefe_ozgur"
          - id: "yeniden"
            etiket: { tr: "Senedi yeniden yaz; kendi adına", en: "Rewrite the treaty. In your own name" }
            etkiler:
              - bayrak: "kervan_sahibi"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 1 }
              - ahlak: { duzen: 8, insanlik: -8, merhamet: -3 }
              - itibar: { kadimler: -10, lonca: 4 }
              - degisken: { kadim_tehdit: -3 }
              - ordu_kazan: 40
              - xp_seviye: 120
            kronik: { tr: "Pirinç Kervan'ın senedini kırdın ve yerine kendi adını yazdın; Tavvarlar bir efendiden kurtulup ötekine geçti.", en: "You broke the Brass Caravan's treaty and wrote your own name in its place. The Tavvari traded one master for another." }
            sonraki: "kefe_sahip"
          - id: "parca"
            etiket: { tr: "Mührün kalbini sök; gücü senin olsun", en: "Rip out the seal's core. Its power is yours" }
            etkiler:
              - bayrak: "kervan_ozgur"
              - unvan: "muhur_kiran"
              - gorev: { cok_evren_kervan: tamam }
              - esya: { muhur_parcasi: 3 }
              - ahlak: { insanlik: -6, duzen: -2 }
              - yozlasma: 6
              - stat: { int: 10, wil: 10 }
              - itibar: { kadimler: -12 }
              - degisken: { kadim_tehdit: -5 }
              - xp_seviye: 150
            kronik: { tr: "Pirinç Kervan'ı özgür bıraktın ama mühür makinesinin kalbini kendi göğsüne taşıdın.", en: "You set the Brass Caravan free, but you carried the seal engine's heart away in your own chest." }
            sonraki: "kefe_ozgur"

      - id: "kefe_ozgur"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Güvertelerde kimse pul ödemiyor. Binlerce Tavvar aynı anda konuşuyor, bağırıyor, şarkı söylüyor; dört yüz yıllık bir sessizliğin borcu bir gecede kapanıyor.", en: "Nobody on the decks is paying chits. Thousands of Tavvari are talking, yelling, singing all at once. Four hundred years of silence gets paid off in a single night." }
          - { tr: "Kervan'ın motorları yeniden çalışıyor; ama bu kez Kesra'nın gençlerinin elleriyle. Dev gemi yavaşça dönüyor; burnu yıldızların olmadığı bir karanlığa, Karanlık Rota'ya.", en: "The Caravan's engines kick back on, but this time Kesra's kids are running them by hand. The giant ship turns slowly, nose toward a dark with no stars in it: the Dark Route." }
          - metin: { tr: "Ninu güvertenin kenarında sana el sallıyor. Derisindeki boş pul yuvasına bir şey kazımış; tek bir hece, ödenmemiş. 'Özgür'.", en: "Ninu waves at you from the rail. She's scratched something into the empty chit socket in her skin: one syllable, unpaid for. 'Free.'" }
            kosul: { bayrak: "ninu_saklandi" }
          - { tr: "\"Belki ölürüz,\" diyor Kesra yanında. \"Ama kendi ölümümüz olacak.\" Sonra, bedavaya, gülümsüyor.", en: "\"Maybe we die,\" Kesra says beside you. \"But it'll be our own death.\" Then she smiles, for free." }
        secenekler:
          - id: "veda"
            etiket: { tr: "Pirinç kapıya dön; onları yolcu et", en: "Head back to the brass door. See them off" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
            kronik: { tr: "Özgür bıraktığın bir halkı, hiçbir haritada olmayan bir karanlığa uğurladın.", en: "You saw a people you'd freed off into a dark that isn't on any map." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Kendi dünyanın senedini düşün", en: "Think about the treaty coming to your world" }
            etkiler:
              - ahlak: { duzen: -2 }
            kronik: { tr: "Bir senedin yanışını izlerken kendi dünyana gelecek olanı düşündün.", en: "Watching one treaty burn, you thought about the one coming to your world." }
            sonraki: "@akis"

      - id: "kefe_sahip"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra'nın meşalesi yere düşüyor. Senedin derisine, Kadim yazısının üstüne, senin adın yazılıyor ve Sistem bunu bir mülk devri olarak kaydediyor.", en: "Kesra's torch hits the floor. Your name gets written onto the hide of the treaty, over the Ancient script, and the System logs it as a transfer of property." }
          - { tr: "Güvertelerde kimse bağırmıyor. Binlerce Tavvar, aynı anda, derisinden bir pul söküp yere bırakıyor. Yeni sahiplerine ilk vergilerini ödüyorlar.", en: "Nobody on the decks is yelling. Thousands of Tavvari, all at once, pry a chit out of their skin and set it down. They're paying their new owner their first tax." }
          - { tr: "Kesra sana bakmıyor. \"Onda bir mi istiyorsun?\" diye soruyor. \"Yoksa daha az mı? Sahipler hep daha azını istediklerini söyler.\"", en: "Kesra won't look at you. \"Do you want a tenth?\" she asks. \"Or less? Owners always say they want less.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bağ durumu: devredildi]", en: "[Bond status: transferred]" }
            satirlar:
              - { tr: "Tavvar Kervanı: bağlı Katman. Sahip: sen.", en: "Tavvari Caravan: bonded Layer. Owner: you." }
        secenekler:
          - id: "hicbir"
            etiket: { tr: "Ondalık yok; yalnızca sadakat", en: "No tithe. Just loyalty" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
            kronik: { tr: "Pirinç Kervan'ın sahibi oldun ve ondalığı kaldırdın; Tavvarlar sana bunun için mi minnet duysun, senden mi korksun, hiç karar veremedi.", en: "You became the Brass Caravan's owner and abolished the tithe. The Tavvari never could decide whether to be grateful or afraid." }
            sonraki: "@akis"
          - id: "ondalik"
            etiket: { tr: "Onda bir; bana, Kadimler'e değil", en: "A tenth. To me, not to the Ancients" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4, duzen: 4 }
              - ordu_kazan: 40
            kronik: { tr: "Pirinç Kervan'ın ondalığını Kadimler'den aldın ve kendine yazdın; onda bir artık senin ordunda yürüyordu.", en: "You took the Brass Caravan's tithe away from the Ancients and wrote it over to yourself. A tenth of them marched in your army now." }
            sonraki: "@akis"

      - id: "kefe_ihanet"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sayman'ın pulunu masasına bırakıyorsun; üstünde yalnızca bir saat ve bir yer. Ertesi gece kıç güvertelerinde makinelerin sesi bile Kadim muhafızlarının ayak seslerini bastıramıyor.", en: "You leave the Reckoner's chit on his table with nothing on it but a time and a place. The next night, down on the stern decks, even the roar of the engines can't drown out the footsteps of the Ancient guards." }
          - { tr: "Kırk Tavvar diz çöktürülüyor. Kesra ayakta kalıyor. Seni kalabalığın arasında görüyor ve hiçbir şey söylemiyor; burada sessizlik pahalı, o da ödüyor.", en: "Forty Tavvari are forced to their knees. Kesra stays standing. She spots you in the crowd and says nothing. Silence is expensive down here, and she pays for it." }
          - { tr: "Yeni bir Ondalıkçı terazisini Kesra'nın önünde kaldırıyor. Kefe iniyor.", en: "A new Tithe-Taker raises its scales in front of Kesra. The pan sinks." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "epik"
            baslik: { tr: "[Unvan: Senedin Koruyucusu]", en: "[Title: Keeper of the Bond]" }
            satirlar:
              - { tr: "Kadim Mülkiyet Dairesi hizmetinizi kaydetti. Yedi Taht'a davetiniz hazırlandı.", en: "The Ancient Office of Holdings has recorded your service. Your invitation to the Sevenfold Court has been prepared." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kesra'nın götürülüşünü izle", en: "Watch Kesra get taken" }
            etkiler:
              - unvan: "senet_koruyucu"
              - bayrak: "yedi_taht_davet"
              - gorev: { cok_evren_kervan: tamam }
              - ahlak: { merhamet: -4, duzen: 3 }
              - xp_seviye: 80
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Pirinç Kervan'ın isyancısı Kesra'yı Kadimler'e verdin ve karşılığında Yedi Taht'a davet aldın.", en: "You handed the Brass Caravan's rebel Kesra to the Ancients and got an invitation to the Sevenfold Court for it." }
            sonraki: "@akis"
          - id: "kurtar"
            etiket: { tr: "Son anda Kesra'yı kefeden çek", en: "Pull Kesra off the pan at the last second" }
            etkiler:
              - unvan: "senet_koruyucu"
              - bayrak: "yedi_taht_davet"
              - gorev: { cok_evren_kervan: tamam }
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { kadimler: -4 }
              - xp_seviye: 60
              - tohum: { olay: "taht_kabul_salonu", gecikme: { min: 2, max: 5 } }
            kronik: { tr: "Boş Kefe'yi Kadimler'e sattın, sonra liderini kefeden çektin; ikisini de unutmadılar.", en: "You sold the Empty Pan to the Ancients, then pulled its leader off the scale. Neither side forgot either one." }
            sonraki: "kefe_kesra_kurtuldu"

      - id: "kefe_kesra_kurtuldu"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra'yı kolundan çekip kefeden indiriyorsun. Ondalıkçı terazisini sana çeviriyor, sonra göğsündeki unvanı okuyor ve indiriyor. Kefe bir sonrakinin önünde iniyor.", en: "You grab Kesra by the arm and haul her off the pan. The Tithe-Taker turns its scales toward you, reads the title on your chest and lowers them. The pan sinks in front of the next one in line." }
          - { tr: "Kesra sana teşekkür etmiyor. \"Beni kurtardın,\" diyor, \"ve onu seçtirdin. Bizim dilimizde bunun bir adı var. Sizinkinde de vardır.\"", en: "Kesra doesn't thank you. \"You saved me,\" she says, \"and you got him picked instead. We have a word for that in our language. I bet you've got one in yours.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Sessizce uzaklaş", en: "Walk away without a word" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Kurtardığın isyancının yüzüne bakamadan Pirinç Kervan'dan ayrıldın.", en: "You left the Brass Caravan unable to look the rebel you'd saved in the face." }
            sonraki: "@akis"

      - id: "kefe_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Zincirler boynuna dolanıyor ve makine seni kendi dişlilerinin arasına çekiyor. Bilincin kararırken binlerce imzanın sesini duyuyorsun: [Borç, borçlunun ölümüyle kapanmaz.]", en: "The chains loop your neck and the machine hauls you in between its own gears. As you black out, you hear the voice of a thousand signatures: [The debt does not close with the debtor's death.]" }
          - { tr: "Kendine geldiğinde kıç güvertesindesin. Kesra yanında; yüzü is içinde, kolları kan. Kırk kişiden on bir kişi kalmış.", en: "When you come to, you're on the stern deck. Kesra's beside you, face black with soot, arms bloody. Out of forty, eleven are left." }
          - { tr: "\"Denedik,\" diyor. \"Senet hâlâ orada. Biz hâlâ buradayız. Bu da bir şey.\" Bu kez gülümsemiyor.", en: "\"We tried,\" she says. \"The treaty's still there. We're still here. That's something.\" She doesn't smile this time." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; ölüleri say", en: "Get up. Count the dead" }
            etkiler:
              - bayrak: "kervan_isyan_basarisiz"
              - gorev: { cok_evren_kervan: basarisiz }
              - ahlak: { insanlik: 2, merhamet: 1 }
              - can: 60
            kronik: { tr: "Pirinç Kervan'ın isyanı senin önderliğinde yenildi; kırk isyancıdan on biri sağ kaldı.", en: "The Brass Caravan's uprising failed with you leading it. Eleven of forty rebels lived." }
            sonraki: "@akis"

      - id: "kefe_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Dişlilerin arasından geri kayıyorsun. Mühürdar seni kovalamıyor; zincirlerini isyancıların üstüne çeviriyor.", en: "You slip back out between the gears. The Sealwarden doesn't chase you. It turns its chains on the rebels instead." }
          - { tr: "Kalbin kapısı arkandan kapanıyor. İçeriden, uzun süre, metalin metale çarpan sesi geliyor.", en: "The door to the heart slams shut behind you. For a long time, from the other side, comes the sound of metal hitting metal." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıdan uzaklaş", en: "Get away from the door" }
            etkiler:
              - bayrak: "kervan_isyan_basarisiz"
              - gorev: { cok_evren_kervan: basarisiz }
              - ahlak: { merhamet: -5 }
            kronik: { tr: "Mühürdar'ın önünden kaçtın ve kalbin kapısı isyancıların üstüne kapandı.", en: "You ran from the Sealwarden, and the door to the heart closed on the rebels." }
            sonraki: "@akis"

      - id: "kefe_ayril"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kesra başını sallıyor; bunu bekliyormuş gibi. \"Senin dünyan, senin savaşın,\" diyor. \"Bizimki de bizim.\"", en: "Kesra nods, like she saw it coming. \"Your world, your war,\" she says. \"Ours is ours.\"" }
          - { tr: "Pirinç kapıya doğru yürürken arkanda kıç güvertelerinin ışıkları birer birer sönüyor. Bu gece bir şey olacak; sen orada olmayacaksın.", en: "As you walk toward the brass door, the lights on the stern decks go out behind you one by one. Something's going to happen tonight, and you won't be there for it." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıdan geç", en: "Go through the door" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
            kronik: { tr: "Pirinç Kervan'ın kaderini kendi halkına bıraktın ve sonucunu hiç öğrenmedin.", en: "You left the Brass Caravan's fate to its own people and never learned how it turned out." }
            sonraki: "@akis"

  # ================================================================== YEDİ TAHT (Kadim sarayı · Yükseliş'in aynası)
  - id: "taht_kabul_salonu"
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "yedi_taht_davet", bayrak_yok: "taht_varildi" }
    agirlik: 8
    etiketler: ["cok_evren", "taht", "kadimler", "siyaset"]
    gerilim: 3
    kart: { tr: "Kabul Salonu", en: "The Hall of Reception" }
    sahne: "salon_1"
    sahneler:
      - id: "salon_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Davet mektubu avucunda ısınıyor ve seni Kule'nin ellinci katına, mühürlü kapının önüne çağırıyor. Bu kez mühür avucunu okumuyor; mektubu okuyor ve açılıyor.", en: "The invitation warms in your palm and pulls you to the Spire's fiftieth floor, to the sealed door. This time the seal doesn't read your hand. It reads the letter, and it opens." }
          - { tr: "Öbür yanda bir saray var; ama inşa edilmemiş, yetiştirilmiş. Duvarları hasat edilmiş bir ayın kabuğundan, sütunları yıldız ışığı gibi soğuk bir taştan. Ve zemin cam.", en: "On the other side is a palace, except nobody built it. It was grown. The walls are the crust of a harvested moon, the pillars a stone as cold as starlight. And the floor is glass." }
          - { tr: "Cam değil. Pencereler. Ayaklarının altında milyonlarca Sistem penceresi, yan yana döşenmiş; her biri son bildirimini hâlâ gösteriyor. Hasat edilmiş dünyaların son satırları üstünde yürüyorsun.", en: "Not glass. Windows. Millions of System windows laid side by side under your feet, every one still showing its final notification. You're walking on the last lines of harvested worlds." }
          - metin: { tr: "Bir pencere tanıdık. Nehha harfleri; altında dört yüz on dokuz. Oru-Venn'in seviyesi burada bir döşeme taşı olmuş.", en: "One of the windows is familiar. Nehha letters, and under them, four hundred and nineteen. Oru-Venn's level ended up as a floor tile here." }
            kosul: { bayrak: "batik_fener_goruldu" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YEDİ TAHT · Konuk kaydı]", en: "[SEVENFOLD COURT · Guest registry]" }
            satirlar:
              - { tr: "Konuğun karşılanmasına karar verildi.", en: "It has been decided that the guest shall be received." }
              - { tr: "Konuğun ne zaman ayrılacağına henüz karar verilmedi.", en: "It has not yet been decided when the guest shall leave." }
        sezgiler:
          - kosul: { stat: { per: 140 } }
            metin: { tr: "Salonun kenarlarındaki heykellerin hepsi nefes alıyor. Muhafızlar; eklemleri yanlış yerlerden bükülen, derilerinin altında yıldızlar taşıyan uzun varlıklar.", en: "Every statue along the edges of the hall is breathing. Guards: tall things with joints bending the wrong way and stars moving under their skin." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burası. burayı biliyorum. ya da bilmemem gereken bir şeyi biliyorum. lütfen beni onlara gösterme.", en: "this place. i know this place. or i know something i'm not supposed to. please don't show me to them." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Tanrıların oturma odası. Ve yerlere bizim gibileri döşemişler. Sakin ol, ben de sakinim. Neredeyse.\"", en: "\"The gods' living room. And they tiled the floor with people like us. Stay calm. I'm calm. Mostly.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Aşağı bakma. Ben baktım. Aşağı bakma.\"", en: "\"Don't look down. I did. Don't look down.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Pencerelerin üstünden salonun ortasına yürü", en: "Walk across the windows to the center of the hall" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - gorev: { cok_evren_taht: basla }
              - ahlak: { duzen: 1 }
            sonraki: "salon_karsilama"
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Zemindeki pencereleri adım adım oku", en: "Read the floor windows, step by step" }
            gerekli: { stat: { int: 190 } }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - gorev: { cok_evren_taht: basla }
              - bilgi: "ondalik_gercegi"
              - xp_seviye: 15
              - ahlak: { insanlik: 3 }
            sonraki: "salon_zemin"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Yalnızca görünen seviyeni göster; gerisini sakla", en: "Show only your visible level. Hide the rest" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_varildi"
              - bayrak: "taht_hafife_alindi"
              - gorev: { cok_evren_taht: basla }
              - gizle: 8
            sonraki: "salon_karsilama"

      - id: "salon_zemin"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Pencereler bir kitabın sayfaları gibi ayaklarının altından akıyor. Nehha, Tavvar, adını hiç duymadığın başka ırklar. Hepsinin son satırı aynı: [Toplandı.]", en: "The windows scroll under your feet like pages of a book. Nehha, Tavvari, races you've never even heard of. Every one ends on the same line: [Collected.]" }
          - { tr: "Salonun ortasına vardığında son pencerede bir Tavvar adı okuyorsun; bir çocuk, onda bir. Altında Kadim yazısıyla bir not: [Yıldız olarak işlendi. Taşıyan: İkinci Taht.]", en: "When you reach the middle of the hall, the last window shows a Tavvari name: a kid, a tithe. Under it, a note in Ancient script: [Processed as star. Bearer: the Second Throne.]" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Başını kaldır; karşılayıcıya bak", en: "Look up. Face whoever's greeting you" }
            sonraki: "salon_karsilama"

      - id: "salon_karsilama"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Salonun ortasında biri seni bekliyor. Uzun, ince, eklemleri yanlış yerlerden bükülen bir Kadim; derisinin altında bir dünyanın takımyıldızları yavaşça dönüyor. Yüzü var ama ifadesi yok, bir maske gibi değil, bir ölçü aleti gibi.", en: "Someone's waiting for you in the middle of the hall. A tall, thin Ancient, joints bending the wrong way, a whole world's constellations turning slowly under its skin. It has a face but no expression. Not like a mask. Like a measuring instrument." }
          - { tr: "\"Ben Ulvenne,\" diyor. \"İkinci Taht'ın Nazırı. Senin buraya getirilmene karar verildi. Ne olduğuna da yakında karar verilecek.\"", en: "\"I am Ulvenne,\" it says. \"Chamberlain of the Second Throne. It was decided that you would be brought here. What you are will be decided soon.\"" }
          - metin: { tr: "\"Elçimizin raporları seni önceden getirdi,\" diye ekliyor Ulvenne. \"{npc:thessar} seni 'ilginç' diye tanımladı. Bu kelimeyi bin yıldır kullanmamıştı.\"", en: "\"Our envoy's reports preceded you,\" Ulvenne adds. \"{npc:thessar} described you as 'interesting.' He had not used that word in a thousand years.\"" }
            kosul: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar" }
          - metin: { tr: "\"Elçimiz bize ihanet etti,\" diyor Ulvenne, sesinde hiçbir şey yokken. \"{npc:thessar}. Senin dünyanda. Bu yüzden salonun yarısı bugün seni öldürmeyi oyluyor.\"", en: "\"Our envoy betrayed us,\" Ulvenne says, with nothing at all in its voice. \"{npc:thessar}. On your world. Which is why half this hall is voting today on whether to kill you.\"" }
            kosul: { bayrak: "ihanet_thessar" }
          - metin: { tr: "Ulvenne sana bir bakış atıyor; yalnızca görünen seviyeni görüyor. \"Bu mu?\" diye soruyor salona. Arkadaki muhafızlardan biri bir ses çıkarıyor; Kadim dilinde bunun bir gülüş olduğunu tahmin ediyorsun.", en: "Ulvenne gives you a once-over and only sees your visible level. \"This?\" it asks the hall. One of the guards in the back makes a noise. In the Ancient language, you guess that's a laugh." }
            kosul: { bayrak: "taht_hafife_alindi" }
        secenekler:
          - id: "egil"
            etiket: { tr: "Protokole uy; başını eğ", en: "Follow protocol. Bow your head" }
            etkiler:
              - bayrak: "taht_egildi"
              - ahlak: { duzen: 3, insanlik: -2 }
              - itibar: { kadimler: 5 }
            sonraki: "salon_inceleme"
          - id: "dik"
            etiket: { tr: "Dik dur; kimseye eğilmezsin", en: "Stand straight. You don't bow to anyone" }
            etkiler:
              - bayrak: "taht_egilmedi"
              - ahlak: { insanlik: 3, duzen: -1 }
              - dikkat: 3
              - itibar: { kadimler: -3 }
            sonraki: "salon_inceleme"
          - id: "ezici"
            tur: "gosteris"
            etiket: { tr: "Gerçek seviyeni bir an salona aç", en: "Flash your real level at the whole hall" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - bayrak: "taht_egilmedi"
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: -3, insanlik: -2 }
              - itibar: { kadimler: 2 }
            sonraki: "salon_aciga"

      - id: "salon_aciga"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Penceren bir anlığına bütün salona açılıyor. Muhafızların derisindeki yıldızlar aynı anda dağılıyor; bir an kendi bedenlerini tanımıyorlar.", en: "For one second your window opens up to the entire hall. The stars under the guards' skin scatter all at once. For a beat they don't recognize their own bodies." }
          - { tr: "Ulvenne kıpırdamıyor. Ama ölçü aletine benzeyen yüzünde, ilk kez, bir çizgi beliriyor. \"Ah,\" diyor. \"Demek raporlar abartmamış. Bu çok uygunsuz.\"", en: "Ulvenne doesn't move. But on that measuring-instrument face, for the first time, a line appears. \"Ah,\" it says. \"So the reports did not exaggerate. This is very improper.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Pencereni kapat ve bekle", en: "Close your window and wait" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "salon_inceleme"

      - id: "salon_inceleme"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Bir Kadim âlim yaklaşıyor ve uzun parmaklarını pencerenin kenarına koyuyor; izin istemeden. Seviyeni, kademeni, büyüme hızını okuyor ve her satırda biraz daha yavaşlıyor.", en: "An Ancient scholar comes over and sets its long fingers on the edge of your window without asking. It reads your level, your Grade, your growth rate, and it slows down a little more with every line." }
          - { tr: "\"Hasat edilmemiş bir türden,\" diye mırıldanıyor. \"Tek bir yılda. Ya bir hata ya bir tohum. Bir tohumsa dikmek isteriz. Bir hataysa budamak.\"", en: "\"From an unharvested species,\" it murmurs. \"In a single year. Either an error or a seed. If it is a seed, we would like to plant it. If it is an error, to prune it.\"" }
          - { tr: "Parmakları satırların arasında bir şeye takılıyor; senin penceren olmayan, titreyen bir şeye.", en: "Its fingers snag on something between the lines: something flickering that isn't part of your window." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "{npc:yanki} kendini saklasın", en: "Let {npc:yanki} hide itself" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "taht_yanki_gizli"
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
            sonraki: "salon_ziyafet"
          - id: "goster"
            etiket: { tr: "Bıraksın görsün; ne olduğunu söylesinler", en: "Let it look. Let them tell you what it is" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - dikkat: 5
              - iliski: { yanki: { guven: -8, korku: 6 } }
            sonraki: "salon_artik"
          - id: "cek"
            etiket: { tr: "Parmaklarını pencerenden çek", en: "Pull its fingers off your window" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - itibar: { kadimler: -2 }
            sonraki: "salon_ziyafet"

      - id: "salon_artik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Âlim titreyen şeyi parmaklarının arasında tutuyor ve uzun süre bakıyor. \"Bir artık,\" diyor sonunda, salona. \"Eski bir şeyden kopmuş. Bunları yakarız.\"", en: "The scholar holds the flickering thing between its fingers and stares at it a long time. \"A remnant,\" it finally tells the hall. \"Broken off something old. We burn these.\"" }
          - { tr: "Ulvenne elini kaldırıyor. \"Konuk kaydında,\" diyor. \"Henüz değil.\" Âlim parmaklarını çekiyor; {npc:yanki} pencerenin en dibine, bir köşeye büzülmüş.", en: "Ulvenne raises a hand. \"It is on the guest registry,\" it says. \"Not yet.\" The scholar lets go, and {npc:yanki} has curled up in the very bottom corner of your window." }
          - { tr: "{npc:yanki}: beni yakmak istediler. sen izin verdin bakmalarına. bunu hatırlayacağım. kızgın değilim. yalnızca hatırlayacağım.", en: "{npc:yanki}: they wanted to burn me. you let them look. i'll remember that. i'm not angry. i'll just remember." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ziyafete geç", en: "Move on to the feast" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
            sonraki: "salon_ziyafet"

      - id: "salon_ziyafet"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ziyafet sofrası uzun ve boş; Kadimler yemek yemiyor. Yalnızca içiyorlar. Önüne bir kadeh konuyor; içindeki sıvı ışık gibi, ılık ve hafifçe titreşiyor.", en: "The banquet table is long and empty. The Ancients don't eat. They only drink. A goblet is set down in front of you; the liquid inside is like light, warm and faintly humming." }
          - { tr: "\"Ondalık şarabı,\" diyor Ulvenne. \"Bağlı Katmanlardan. Bir konuğa sunulabilecek en büyük onur.\"", en: "\"Tithe wine,\" Ulvenne says. \"From the bonded Layers. The highest honor that can be offered to a guest.\"" }
          - metin: { tr: "Kadehin dibinde, ışığın arasında, minicik bir pirinç pul parlıyor. Üstünde tek hece. Ninu.", en: "At the bottom of the goblet, in the light, a tiny brass chit glints. One syllable on it. Ninu." }
            kosul: { bayrak: "ninu_teslim" }
        sezgiler:
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "Kadehteki şey sıvı değil; seviye. Birinin sağılmış birkaç yılı. İçersen bir parçası senin olur.", en: "What's in the goblet isn't liquid. It's level. A few years of somebody's life, milked. Drink it and a piece of them becomes yours." }
        secenekler:
          - id: "ic"
            etiket: { tr: "Kadehi kaldır ve iç", en: "Raise the goblet and drink" }
            etkiler:
              - bayrak: "taht_ondalik_icildi"
              - ahlak: { insanlik: -5, merhamet: -2 }
              - itibar: { kadimler: 6 }
              - stat: { wil: 5 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 } }
            sonraki: "salon_son"
          - id: "dok"
            etiket: { tr: "Kadehi pencereli zemine boşalt", en: "Pour it out onto the window floor" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -3 }
              - itibar: { kadimler: -6 }
              - dikkat: 3
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 } }
            sonraki: "salon_son"
          - id: "kaldir"
            tur: "gosteris"
            etiket: { tr: "Kadehi kaldır, içme; salonu güldür", en: "Raise the goblet, don't drink. Make the hall laugh" }
            gerekli: { stat: { cha: 180 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - itibar: { kadimler: 3 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 } }
            sonraki: "salon_kahkaha"

      - id: "salon_kahkaha"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Kadehi kaldırıyorsun ve Kadim dilinde, âlimden duyduğun tek kelimeyle, bir kadeh kaldırma sözü söylüyorsun: \"Uygunsuzluğa.\"", en: "You raise the goblet and make a toast in the Ancient language, using the one word you picked up from the scholar: \"To impropriety.\"" }
          - { tr: "Bir an hiçbir şey. Sonra salonun dört bir yanından o garip, eklemsiz ses yükseliyor; Kadimler gülüyor. Bin yıldır kimse onları güldürmemiş gibi, beceriksizce.", en: "Nothing for a second. Then that weird, jointless sound goes up from every corner of the hall. The Ancients are laughing. Awkwardly, like nobody's made them laugh in a thousand years." }
          - { tr: "Kadehi el değmemiş bırakıyorsun ve kimse fark etmiyor. Ya da herkes fark ediyor ve bunu da uygunsuzluğa sayıyor.", en: "You set the goblet down untouched, and nobody notices. Or everybody notices, and counts that as impropriety too." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ulvenne'nin yanına geç", en: "Go stand beside Ulvenne" }
            sonraki: "salon_son"

      - id: "salon_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ziyafetin sonunda Ulvenne yanına eğiliyor; uzun boynu yanlış yerden bükülüyor. \"Sana yedinci koltuğu göstermeye karar verildi,\" diye fısıldıyor. \"Henüz kimin kararıyla olduğuna karar verilmedi.\"", en: "At the end of the feast, Ulvenne leans down beside you, long neck bending in the wrong place. \"It has been decided that you will be shown the seventh seat,\" it whispers. \"It has not yet been decided on whose authority.\"" }
          - { tr: "Salonun öbür ucunda biri seni izliyor. Derisinin altında üç ayrı dünyanın yıldızları dönüyor ve dördüncüsü için boş bir yer bırakılmış.", en: "At the far end of the hall, someone is watching you. Three separate worlds' worth of stars turn under its skin, and there's an empty space left for a fourth." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Bakışına karşılık ver", en: "Stare right back" }
            etkiler:
              - ahlak: { duzen: -2 }
              - dikkat: 2
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Ulvenne'ye onun kim olduğunu sor", en: "Ask Ulvenne who that is" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "salon_varis"

      - id: "salon_varis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "\"Ossiran,\" diyor Ulvenne. \"Yedinci Taht'ın varisi; kendi ilan ettiği. Üç dünya hasat etti. Dördüncüsü için seninkini seçti.\"", en: "\"Ossiran,\" Ulvenne says. \"Heir to the Seventh Throne, by his own declaration. He has harvested three worlds. For the fourth, he has chosen yours.\"" }
          - { tr: "\"Bazılarımız onun koltuğa oturmasını istemiyor,\" diye ekliyor, bir şey söylemediğini söylermiş gibi. \"Bir koltuk, bir talibin daha olduğunda çok daha ilginç olur.\"", en: "\"Some of us would prefer he did not take the seat,\" it adds, like it's not saying anything at all. \"A seat becomes much more interesting when it has a second claimant.\"" }
        secenekler:
          - id: "anla"
            etiket: { tr: "Ne demek istediğini anladım", en: "I get what you're saying" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bilgi: "yedinci_taht_sirri"
            sonraki: "@akis"

  # ------------------------------------------------------------------ YEDİNCİ KOLTUK (önemli)
  - id: "taht_yedinci_koltuk"
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "taht_varildi" }
    agirlik: 6
    etiketler: ["cok_evren", "taht", "kadimler", "ahlak"]
    gerilim: 4
    onemli: true
    kart: { tr: "Yedinci koltuk", en: "The seventh seat" }
    sahne: "koltuk_1"
    sahneler:
      - id: "koltuk_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ulvenne seni Yedi Taht'ın kalbine, taht salonuna götürüyor. Yedi koltuk bir yarım ay biçiminde dizilmiş; altısında birer Kadim oturuyor, her biri bir Hane'nin Sesi. Yedincisi boş.", en: "Ulvenne leads you into the heart of the Sevenfold Court: the throne room. Seven seats stand in a half-moon. On six sit Ancients, each one the Voice of a House. The seventh is empty." }
          - { tr: "Boş koltuk ötekilerden farklı. Taştan değil; binlerce ince, saydam pencerenin üst üste örülmesinden yapılmış ve içinde bir şey bekliyor. Bir dünya büyüklüğünde bir boşluk.", en: "The empty seat isn't like the others. It isn't stone. It's woven from thousands of thin, clear windows layered one over another, and something inside it is waiting: an emptiness the size of a world." }
          - { tr: "\"Yedinci koltuk bin yıldır boş,\" diyor Ulvenne. \"Bir dünyayı tek başına hasat edene verilir. Gün 365'te senin dünyanın hasadı kime yazılırsa, koltuk onun olacak. Bunun bir Kadim olması gerekmiyor.\"", en: "\"The seventh seat has been empty for a thousand years,\" Ulvenne says. \"It goes to whoever harvests a world single-handed. On Day 365, whoever your world's harvest is credited to will have it. That does not have to be an Ancient.\"" }
          - { tr: "Altı Ses aynı anda sana bakıyor. Odanın öbür ucunda Ossiran gülümsüyor; derisinde dördüncü dünya için ayrılmış karanlık nabız gibi atıyor.", en: "All six Voices look at you at once. Across the room Ossiran is smiling, and the dark he's saved in his skin for a fourth world is throbbing like a pulse." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[YEDİNCİ TAHT · talip kaydı]", en: "[SEVENTH THRONE · claimant registry]" }
            satirlar:
              - { tr: "Talip 1: Ossiran (Kadim). Hedef: Dünya Katmanı.", en: "Claimant 1: Ossiran (Ancient). Target: Earth Layer." }
              - { tr: "Talip 2: kayıt bekliyor.", en: "Claimant 2: pending registration." }
        sezgiler:
          - kosul: { stat: { wis: 160 } }
            metin: { tr: "Koltuğun içindeki boşluk senin dünyanın şeklinde. Kıyı çizgileri, dağlar, Kıyıkent'in körfezi. Biri onu çoktan ölçmüş.", en: "The emptiness inside the seat is shaped like your world. Coastlines, mountains, the bay at Port Harlow. Somebody's already measured it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ona oturma. ya da otur, bilmiyorum. ama oturursan ben sende yer bulamayabilirim. oraya sekiz milyar kişi sığar ve ben çok küçüğüm.", en: "don't sit in it. or do, i don't know. but if you sit, i might not find room in you anymore. eight billion people fit in there, and i'm very small." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bak bana. Hayır, bana bak, ona değil. Tanrı olmak istediğini söyle ve ben şimdi giderim. Söyleme.\"", en: "\"Look at me. No, at me, not at that. Tell me you want to be a god and I'll walk out right now. Don't say it.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir dünya karşılığında bir koltuk. Ben bile bu kadar hırslı değilim. Galiba.\"", en: "\"One world for one chair. Even I'm not that hungry. I think.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir koltuk değil, bir arayüz. Sistem'e doğrudan bağlı. Oturursan geri dönüşü olmayabilir.\"", en: "\"That's not a chair, it's an interface. Wired straight into the System. Sit down and there might be no getting up.\"" }
        secenekler:
          - id: "otur"
            etiket: { tr: "Koltuğa yürü ve otur", en: "Walk to the seat and sit" }
            etkiler:
              - bolge: "yedi_taht"
              - ahlak: { insanlik: -6 }
              - dikkat: 5
            kronik: { tr: "Yedi Taht'ın boş koltuğuna oturdun ve bir dünyanın ağırlığını üstünde hissettin.", en: "You sat in the empty seat of the Sevenfold Court and felt a world's weight settle on you." }
            sonraki: "koltuk_otur"
          - id: "red"
            etiket: { tr: "Koltuğa sırtını dön", en: "Turn your back on the seat" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_reddedildi"
              - unvan: "taht_reddeden"
              - ahlak: { insanlik: 8, duzen: -2 }
              - itibar: { kadimler: -5 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Kadimler sana bir tanrının koltuğunu gösterdi ve sen ona sırtını döndün.", en: "The Ancients showed you a god's seat, and you turned your back on it." }
            sonraki: "koltuk_red"
          - id: "pazarlik"
            etiket: { tr: "Koltuğu değil, dünyamı istiyorum; pazarlık et", en: "I don't want the seat. I want my world. Deal" }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_ittifak"
              - ahlak: { duzen: 6, insanlik: -2 }
              - itibar: { kadimler: 10 }
              - degisken: { kadim_tehdit: 4 }
            kronik: { tr: "Yedi Taht'ın siyasetine girdin ve dünyanı korumak için Kadimler'le pazarlık masasına oturdun.", en: "You stepped into the politics of the Sevenfold Court and sat down at the Ancients' bargaining table to protect your world." }
            sonraki: "koltuk_pazarlik"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Koltuğun kolunu kopar ve Ossiran'a fırlat", en: "Rip off the seat's armrest. Throw it at Ossiran" }
            gerekli: { stat: { str: 230 } }
            etkiler:
              - bolge: "yedi_taht"
              - bayrak: "taht_reddedildi"
              - unvan: "taht_reddeden"
              - aciga_vur: true
              - dikkat: 10
              - ahlak: { duzen: -8, insanlik: 4 }
              - itibar: { kadimler: -10 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 0, max: 1 } }
            kronik: { tr: "Yedi Taht'ın bin yıllık boş koltuğunu kırdın ve parçasını talibinin yüzüne fırlattın.", en: "You broke the Sevenfold Court's thousand-year-old empty seat and threw a piece of it in its claimant's face." }
            sonraki: "koltuk_kirildi"

      - id: "koltuk_otur"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Oturduğun an koltuk açılıyor; içindeki boşluk değil, sen. Sekiz milyar pencere aynı anda önünde yanıyor; her biri bir insan, her biri bir seviye ve her biri sana doğru eğilmiş, rüzgâra yatan başaklar gibi.", en: "The moment you sit, the seat opens. Not the emptiness inside it. You. Eight billion windows light up in front of you at once, every one a person, every one a level, every one leaning toward you like wheat bending in the wind." }
          - { tr: "Tek bir düşünce yeter. Hepsi akar ve sen bir tanrı olursun. Bunun ne kadar kolay olacağını hissediyorsun ve bu kolaylık, gördüğün en korkunç şey.", en: "One thought would do it. All of it would flow in, and you'd be a god. You can feel exactly how easy it would be, and that easiness is the most horrifying thing you've ever seen." }
          - { tr: "Pencerelerin arasında tanıdık olanlar var. Kıyıkent'ten. Seninle Öğretici'den çıkanlar.", en: "Some of the windows are familiar. People from Port Harlow. People who walked out of the Tutorial with you." }
          - metin: { tr: "Bir pencere ötekilerden daha parlak ve sana eğilmiyor; tam tersine, geri çekiliyor. {npc:deniz_arman}.", en: "One window is brighter than the rest, and it doesn't lean toward you. It pulls away. {npc:deniz_arman}." }
            kosul: { npc_hayatta: "deniz_arman" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[Unvan: Yedinci Koltukta Oturan]", en: "[Title: Who Sat the Seventh Seat]" }
            satirlar:
              - { tr: "Talip 2: kaydedildi.", en: "Claimant 2: registered." }
        secenekler:
          - id: "kal"
            etiket: { tr: "Biraz daha otur; başakları hisset", en: "Sit a while longer. Feel the wheat lean" }
            etkiler:
              - bayrak: "taht_koltuga_oturdu"
              - bayrak: "taht_talip"
              - unvan: "yedinci_koltuk"
              - ahlak: { insanlik: -15, merhamet: -4 }
              - yozlasma: 10
              - itibar: { yukselenler: 8, kadimler: 4 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Yedinci koltukta, sekiz milyar insanın sana doğru eğildiğini hissedecek kadar uzun oturdun; Yedi Taht seni Dünya'nın hasadına ikinci talip olarak yazdı.", en: "You sat in the seventh seat long enough to feel eight billion people lean toward you. The Sevenfold Court wrote you down as the second claimant to Earth's harvest." }
            sonraki: "koltuk_kalkis"
          - id: "kalk"
            etiket: { tr: "Kalk. Hemen", en: "Get up. Now" }
            etkiler:
              - bayrak: "taht_koltuga_oturdu"
              - unvan: "yedinci_koltuk"
              - ahlak: { insanlik: 6 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Yedinci koltuğa oturdun ve bir tanrı olmanın ne kadar kolay olduğunu görünce hemen kalktın.", en: "You sat in the seventh seat, saw how easy it would be to become a god, and got up immediately." }
            sonraki: "koltuk_kalkis"

      - id: "koltuk_kalkis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ayağa kalktığında dizlerin titriyor. Sekiz milyar pencere sönüyor ama içinde bir yerde hâlâ eğiliyorlar.", en: "When you stand, your knees are shaking. Eight billion windows go dark, but somewhere inside you they're still leaning." }
          - { tr: "Ossiran salonun öbür ucundan sana doğru yürüyor. Gülümsemesi gitmiş. \"Bir hasat,\" diyor yavaşça, \"hasatçısının koltuğuna oturmaz.\"", en: "Ossiran is crossing the room toward you. The smile is gone. \"A crop,\" he says slowly, \"does not sit in its harvester's chair.\"" }
        secenekler:
          - id: "cevap"
            etiket: { tr: "O zaman gel ve kaldır beni", en: "Then come get me out of it" }
            etkiler:
              - ahlak: { duzen: -3 }
              - dikkat: 3
            kronik: { tr: "Yedi Taht'ın varisine meydan okudun.", en: "You challenged the heir of the Sevenfold Court." }
            sonraki: "koltuk_son"
          - id: "sus"
            etiket: { tr: "Bir şey söyleme; yanından geç", en: "Say nothing. Walk past him" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "Yedi Taht'ın varisinin yanından tek kelime etmeden geçtin.", en: "You walked past the heir of the Sevenfold Court without a word." }
            sonraki: "koltuk_son"

      - id: "koltuk_red"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Sırtını koltuğa dönüyorsun. Taht salonunda bin yıldır duyulmamış bir ses yükseliyor: altı Ses aynı anda nefes alıyor.", en: "You turn your back on the seat. A sound nobody's heard in this throne room for a thousand years goes up: six Voices inhaling at the same time." }
          - { tr: "\"Hiçbir ölümlü,\" diyor Ulvenne, ve sesinde ilk kez bir şey var, \"bunu bize yapmamıştı.\"", en: "\"No mortal,\" Ulvenne says, and for the first time there's something in its voice, \"has ever done that to us.\"" }
          - { tr: "Ossiran kahkaha atıyor. \"O zaman koltuk benim,\" diyor. \"Ve dünyan da.\"", en: "Ossiran laughs. \"Then the seat is mine,\" he says. \"And so is your world.\"" }
        secenekler:
          - id: "hayir"
            etiket: { tr: "Ne koltuk ne dünya", en: "Neither one" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - dikkat: 3
            kronik: { tr: "Yedinci koltuğu reddettin ve onu isteyen Kadim'e dünyanın da onun olmayacağını söyledin.", en: "You refused the seventh seat and told the Ancient who wanted it that your world wouldn't be his either." }
            sonraki: "koltuk_son"

      - id: "koltuk_kirildi"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Koltuğun kolu, bin pencereden örülmüş o saydam kol, bir buz sarkıtı gibi kopuyor. Fırlatıyorsun ve Ossiran'ın göğsünde, derisinin altındaki karanlık boşluğun tam ortasında, paramparça oluyor.", en: "The seat's armrest, that clear arm woven from a thousand windows, snaps off like an icicle. You throw it, and it shatters dead center on Ossiran's chest, right in the dark hollow under his skin." }
          - { tr: "Altı Ses kıpırdamıyor. Ama altısının da derisindeki yıldızlar bir an titriyor; bin yıllık bir hesap, salonun ortasında, yanlış sonuç veriyor.", en: "None of the six Voices move. But the stars under all six skins shiver for a second. A thousand-year calculation just came out wrong, right in the middle of the room." }
          - { tr: "Ossiran göğsündeki cam tozunu silkeliyor. \"Yarın,\" diyor. \"Hüküm salonunda. Altı tahtın önünde.\"", en: "Ossiran brushes the glass dust off his chest. \"Tomorrow,\" he says. \"In the Hall of Decree. Before all six thrones.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Yarın", en: "Tomorrow" }
            etkiler:
              - ahlak: { duzen: -2 }
            kronik: { tr: "Yedi Taht'ın varisinin düello davetini tek kelimeyle kabul ettin.", en: "You accepted the Sevenfold Court heir's challenge with one word." }
            sonraki: "koltuk_son"

      - id: "koltuk_pazarlik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Altı Ses birbirine bakıyor. Sonra Beşinci Taht'ın Sesi, bir çocuk büyüklüğünde ve bin yaşında bir Kadim, konuşuyor: \"Bir hasat pazarlık etmez. Ama bir talip eder.\"", en: "The six Voices look at each other. Then the Voice of the Fifth Throne, an Ancient the size of a child and a thousand years old, speaks: \"A crop does not bargain. But a claimant does.\"" }
          - { tr: "Ulvenne teklifi açıklıyor: Ossiran'ı yenersen, Dünya'nın hasadı bu döngüde 'talipsiz' kalacak. Kadimler yine gelecek; ama bir Kadim'in koltuğu için değil. Bir anlaşma için.", en: "Ulvenne spells out the offer: beat Ossiran, and Earth's harvest stays 'unclaimed' this cycle. The Ancients will still come. But not for an Ancient's throne. For a treaty." }
          - { tr: "Bir anlaşma. Pirinç Kervan'ın derisine yazılı olan türden. Bunu fark ettiğini görüyorlar ve kimse bir şey söylemiyor.", en: "A treaty. The kind written on the Brass Caravan's hide. They can see you realize it, and nobody says a word." }
          - metin: { tr: "\"Elçimiz {npc:thessar} senin dünyanla masaya oturacak,\" diyor Ulvenne. \"Bu salon, onun getireceği senedi senin imzanla görmek istiyor.\"", en: "\"Our envoy {npc:thessar} will sit down at the table with your world,\" Ulvenne says. \"This hall would like to see the treaty he brings carry your signature.\"" }
            kosul: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; önce Ossiran", en: "Accept. Ossiran first" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: -3 }
              - itibar: { kadimler: 6 }
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Yedi Taht'la anlaşma yaptın: varisi yenecek, karşılığında dünyanın hasadını bir senede çevireceklerdi.", en: "You cut a deal with the Sevenfold Court: you'd beat the heir, and in exchange they'd turn your world's harvest into a treaty." }
            sonraki: "koltuk_son"
          - id: "elci"
            etiket: { tr: "Elçinize söyleyin: imzalayan ben olacağım", en: "Tell your envoy I'll be the one who signs" }
            goster: { bayrak: "thessar_indi", bayrak_yok: "ihanet_thessar", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { duzen: 6, insanlik: -5 }
              - itibar: { kadimler: 8 }
              - iliski: { thessar: { saygi: 6, baglilik: 4 } }
              - degisken: { kadim_tehdit: 5 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Yedi Taht'a, dünyanın senedini senin imzalayacağını söyledin; elçileri bunu raporuna yazdı.", en: "You told the Sevenfold Court you'd be the one to sign your world's treaty, and their envoy put it in his report." }
            sonraki: "koltuk_son"
          - id: "geri"
            etiket: { tr: "Sözünü geri al; senet yok", en: "Take it back. No treaty" }
            etkiler:
              - bayrak_kaldir: "taht_ittifak"
              - ahlak: { insanlik: 4, duzen: -3 }
              - itibar: { kadimler: -8 }
              - tohum: { olay: "taht_varis_duellosu", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Kadimler'in pazarlık masasından bir senedin ne demek olduğunu anlayınca kalktın.", en: "You got up from the Ancients' bargaining table the moment you understood what a treaty meant." }
            sonraki: "koltuk_son"

      - id: "koltuk_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Taht salonundan çıkarken boş koltuk arkanda hafifçe parlıyor; içindeki boşluk hâlâ senin dünyanın şeklinde.", en: "As you leave the throne room, the empty seat glows faintly behind you, the hollow inside it still shaped like your world." }
          - { tr: "Ulvenne kapıda seni durduruyor. \"Hüküm salonunda,\" diyor, \"altı taht seyreder ama karışmaz. Bu da bir oydur. Unutma.\"", en: "Ulvenne stops you at the door. \"In the Hall of Decree,\" it says, \"the six thrones watch, but do not intervene. That is also a vote. Remember that.\"" }
        secenekler:
          - id: "hazir"
            etiket: { tr: "Hazırlan", en: "Get ready" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 30
            kronik: { tr: "Yedi Taht'ın hüküm salonuna hazırlandın.", en: "You got ready for the Sevenfold Court's Hall of Decree." }
            sonraki: "@akis"
          - id: "dunya"
            etiket: { tr: "Bir gece için dünyana dön", en: "Go home for one night" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            kronik: { tr: "Bir tanrının koltuğunu gördükten sonra bir geceliğine kendi dünyana döndün.", en: "After seeing a god's seat, you went home to your own world for a night." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ UYUYAN TANRILAR
  - id: "taht_uyuyan_tanrilar"
    perde: [3, 4]
    bolge: ["yedi_taht"]
    gun: { min: 200, max: 364 }
    kosul: { bayrak: "taht_varildi" }
    agirlik: 5
    etiketler: ["cok_evren", "taht", "kesif", "sir"]
    gerilim: 2
    kart: { tr: "Uyuyan tanrılar bahçesi", en: "Garden of the sleeping gods" }
    sahne: "bahce_1"
    sahneler:
      - id: "bahce_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Sarayın arka yüzünde, hasat edilmiş ayın kabuğunun bittiği yerde bir bahçe var. Ağaç yok, çiçek yok. Yalnızca dev, hareketsiz Kadimler; dağ büyüklüğünde, gözleri açık, derileri yıldızlarla dolu.", en: "On the back side of the palace, where the harvested moon's crust ends, there's a garden. No trees, no flowers. Just huge, motionless Ancients, big as mountains, eyes open, skin packed with stars." }
          - { tr: "Aralarında genç Kadimler dolaşıyor, ellerinde uzun cam çubuklar. Çubukları devlerin derisine batırıp ışık çekiyorlar ve çektikleri ışığı sarayın içine taşıyorlar.", en: "Young Ancients move between them carrying long glass rods. They push the rods into the giants' skin, draw out light, and carry the light back into the palace." }
          - { tr: "Bahçıvanlardan biri seni fark ediyor ve başını eğiyor. \"Uyuyan tanrılar,\" diyor. \"En yaşlılarımız. Onlara iyi bakıyoruz.\"", en: "One of the gardeners notices you and bows. \"The sleeping gods,\" it says. \"Our eldest. We take good care of them.\"" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Devlerin gözleri açık ama bakışları yok. Derilerindeki yıldızlar dönüyor; ama içlerinde, yıldızların arasında, onlara ait hiçbir şey yok.", en: "The giants' eyes are open, but there's no looking in them. The stars in their skin keep turning, but inside, between the stars, there's nothing that belongs to them." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar uyumuyor. bunlar boş. ne kadar çok dünya yutarsan içinde kendine o kadar az yer kalıyor. bunu bilmen gerekiyordu.", en: "they're not asleep. they're empty. the more worlds you swallow, the less room is left for you. you needed to know that." }
        secenekler:
          - id: "yaklas"
            etiket: { tr: "En yakın devin yanına git", en: "Walk up to the nearest giant" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "bahce_tanri"
          - id: "bahcivan"
            etiket: { tr: "Bahçıvana çektiği ışığı sor", en: "Ask the gardener about the light it draws" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - ahlak: { duzen: 1 }
            sonraki: "bahce_bahcivan"
          - id: "dokun"
            tur: "gosteris"
            etiket: { tr: "Devin derisine dokun; içini oku", en: "Touch the giant's skin. Read what's inside" }
            gerekli: { stat: { wis: 180 } }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - xp_seviye: 20
              - ahlak: { insanlik: 2 }
            sonraki: "bahce_tanri"

      - id: "bahce_bahcivan"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "\"Işık sarayı aydınlatır,\" diyor bahçıvan, sanki bir çocuğa anlatır gibi. \"Tahtları ısıtır. Ondalık şarabını tatlandırır. Tanrılar artık kullanmıyor; biz kullanıyoruz.\"", en: "\"The light keeps the palace lit,\" the gardener says, like it's explaining to a child. \"It warms the thrones. It sweetens the tithe wine. The gods don't use it anymore. We do.\"" }
          - { tr: "\"Bir gün ben de burada olacağım,\" diye ekliyor, gururla. \"Yeterince dünya yuttuğumda. Ve benden de ışık çekecekler.\"", en: "\"Someday I'll be here too,\" it adds, proudly. \"When I've swallowed enough worlds. And they'll draw light out of me.\"" }
        secenekler:
          - id: "yaklas"
            etiket: { tr: "Devlerden birine yaklaş", en: "Go up to one of the giants" }
            sonraki: "bahce_tanri"

      - id: "bahce_tanri"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Yaklaştıkça devin derisindeki yıldızlar sana doğru kayıyor; bir çiçeğin güneşe dönmesi gibi, yavaş ve kendiliğinden. Bin yıldır hiçbir şeye dönmemişler.", en: "As you get closer, the stars in the giant's skin drift toward you, slow and on their own, like a flower turning toward the sun. They haven't turned toward anything in a thousand years." }
          - { tr: "Devin dudakları kıpırdıyor. Ses yıldızların arasından, bin dünyanın uzaklığından geliyor: \"Biz de bir zamanlar bir şey kalmak istemiştik.\"", en: "The giant's lips move. The voice comes from between the stars, from a thousand worlds away: \"We too once wished to remain something.\"" }
          - { tr: "\"Sende bir anomali var,\" diyor. \"Bir boşluk ki dolmuyor. Onu kullan. Bitir bunu. Lütfen.\"", en: "\"There is an anomaly in you,\" it says. \"A hollow that does not fill. Use it. End this. Please.\"" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Uyuyan varlık uyarıldı]", en: "[Dormant entity stimulated]" }
            satirlar:
              - { tr: "Bahçe nöbetçileri bilgilendirildi.", en: "Garden wardens have been notified." }
        secenekler:
          - id: "bitir"
            etiket: { tr: "İsteğini yerine getir; onu bitir", en: "Grant what it asks. End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "dinle"
            etiket: { tr: "Yalnızca dinle; ne istediğini anlat", en: "Just listen. Let it tell you" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - ahlak: { insanlik: 3 }
            sonraki: "bahce_hikaye"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bunun ne olduğunu sor", en: "Ask {npc:yanki} what this thing is" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bilgi: "uyuyan_tanrilar"
              - iliski: { yanki: { guven: 5, saygi: 3 } }
              - ahlak: { insanlik: 1 }
            sonraki: "bahce_yanki"

      - id: "bahce_yanki"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "{npc:yanki}: bu bir tanrı. ya da bir tanrının kabuğu. içinde bin dünya var ve hiçbiri o değil.", en: "{npc:yanki}: it's a god. or a god's shell. there are a thousand worlds inside it, and none of them is it." }
          - { tr: "{npc:yanki}: senin dünyanın sonlarından biri buna benziyor. sistemle birleşmek. tanrı olmak. sana söylemem gerekiyordu, değil mi? söyledim.", en: "{npc:yanki}: one of your world's endings looks like this. merging with the System. becoming a god. i was supposed to tell you that, right? i told you." }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir", en: "End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "birak"
            etiket: { tr: "Onu olduğu gibi bırak", en: "Leave it the way it is" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            sonraki: "bahce_ayril"

      - id: "bahce_hikaye"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Dev anlatıyor; cümleleri yıldızlardan oluşuyor, bazıları sönmüş. Bir zamanlar küçük bir ırkın kahramanıymış. Sonra ilk dünyasını hasat etmiş, halkını kurtarmak için. Sonra ikincisini, çünkü birincisi yetmemiş.", en: "The giant talks, and its sentences are made of stars, some of them burnt out. Once it was the hero of a small people. Then it harvested its first world, to save its own. Then a second, because the first wasn't enough." }
          - { tr: "\"Yüzüncüsünde halkımın adını unuttum,\" diyor. \"Bininci dünyada kendiminkini. Şimdi bahçıvanlar benden ışık çekiyor ve ben onlara teşekkür ediyorum, çünkü başka hiçbir şey hissetmiyorum.\"", en: "\"By the hundredth, I had forgotten my people's name,\" it says. \"By the thousandth world, my own. Now the gardeners draw light from me, and I thank them, because I feel nothing else.\"" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir", en: "End it" }
            etkiler:
              - bayrak: "uyuyan_tanri_bitirildi"
              - ahlak: { merhamet: 6, duzen: -4 }
              - itibar: { kadimler: -8 }
              - dikkat: 5
            sonraki: "bahce_son_isik"
          - id: "birak"
            etiket: { tr: "Kalk ve git", en: "Get up and go" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "bahce_ayril"

      - id: "bahce_son_isik"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Avucunu devin derisine bastırıyorsun ve senin içindeki o dolmayan boşluk açılıyor. Bin dünyanın yıldızları devin içinden çıkıp bahçenin göğüne yükseliyor; sönmüyorlar, yalnızca dağılıyorlar.", en: "You press your palm to the giant's skin, and the hollow in you that never fills opens up. A thousand worlds' stars lift out of the giant and rise into the garden's sky. They don't go out. They just scatter." }
          - { tr: "Dev kapanan gözleriyle bir şey söylüyor; bir isim, çok eski ve çok kısa. Kendi adı. Sonra bir dağ kadar sessiz.", en: "With its closing eyes, the giant says something: a name, very old and very short. Its own name. Then it's as quiet as a mountain." }
          - { tr: "Yıldızların bazıları hâlâ avucunun üstünde, bir sahip arıyor gibi titriyor.", en: "Some of the stars are still hovering over your palm, quivering like they're looking for an owner." }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Yıldızları göğe bırak", en: "Let the stars go to the sky" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - xp_seviye: 40
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 } }
            sonraki: "bahce_ayril"
          - id: "al"
            etiket: { tr: "Kalan yıldızları içine çek", en: "Pull the leftover stars into yourself" }
            etkiler:
              - ahlak: { insanlik: -8 }
              - yozlasma: 6
              - stat: { wis: 8, wil: 8 }
              - xp_seviye: 90
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 3 } }
            sonraki: "bahce_ayril"

      - id: "bahce_ayril"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Bahçeden çıkarken bahçıvanlar cam çubuklarını indirip sana bakıyor. Bir tanrının ne olduğunu bir ölümlünün önünde ilk kez merak ediyorlar.", en: "As you leave the garden, the gardeners lower their glass rods and watch you go. For the first time, in front of a mortal, they're wondering what a god actually is." }
          - metin: { tr: "Arkanda, devin olduğu yerde, sönmüş bir dağ duruyor. Bahçıvanlardan biri ona dokunuyor ve ağlamayı bilmediği için yalnızca başını eğiyor.", en: "Behind you, where the giant was, a dead mountain stands. One of the gardeners touches it and, not knowing how to cry, just bows its head." }
            kosul: { bayrak: "uyuyan_tanri_bitirildi" }
        secenekler:
          - id: "dusun"
            etiket: { tr: "Kendi gücünü düşün", en: "Think about your own power" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Saraya dön", en: "Head back into the palace" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "taht_yedinci_koltuk", gecikme: { min: 1, max: 4 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ VARİS DÜELLOSU (boss · önemli · tohum)
  - id: "taht_varis_duellosu"
    perde: [3, 4]
    agirlik: 1
    etiketler: ["cok_evren", "taht", "boss", "kadimler"]
    gerilim: 4
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Hüküm salonu", en: "The Hall of Decree" }
    sahne: "varis_1"
    sahneler:
      - id: "varis_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Hüküm salonunun çağrısı pencerende bir mühür olarak beliriyor ve seni nerede olursan ol Kule'nin ellinci katına, oradan da Yedi Taht'a çekiyor. Salon yuvarlak ve boş; tavanı yok, yerine yıldızsız bir karanlık.", en: "The Hall of Decree's summons shows up in your window as a seal, and wherever you are, it pulls you to the Spire's fiftieth floor and from there into the Sevenfold Court. The hall is round and empty. No ceiling, just a starless dark." }
          - { tr: "Duvarların yerine altı taht, altı Ses. Seyrediyorlar. Karışmayacaklar.", en: "Instead of walls, six thrones, six Voices. Watching. They won't step in." }
          - { tr: "Ossiran ortada duruyor. Derisinin altında üç dünyanın yıldızları dönüyor ve dördüncü için ayrılmış boşluk artık senin şeklinde. \"Bir hasat,\" diyor, \"hasatçısına meydan okumaz. Bunu sana öğretmek benim için bir onur olacak.\"", en: "Ossiran stands in the middle. Three worlds' stars turn under his skin, and the space reserved for the fourth is shaped like you now. \"A crop,\" he says, \"does not challenge its harvester. It will be my honor to teach you that.\"" }
          - metin: { tr: "Altı Ses'ten biri, Beşinci Taht'ınki, sana hafifçe başını eğiyor. Anlaşmanız hâlâ geçerli.", en: "One of the six Voices, the Fifth Throne's, dips its head at you, just slightly. Your deal still stands." }
            kosul: { bayrak: "taht_ittifak" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[HÜKÜM DÜELLOSU]", en: "[DUEL OF DECREE]" }
            satirlar:
              - { tr: "Talip: Ossiran. Karşı taraf: kayıtlı ya da değil, fark etmez.", en: "Claimant: Ossiran. Opponent: registered or not, irrelevant." }
              - { tr: "Sonuç Dünya Katmanı'nın hasat kaydına işlenecek.", en: "The outcome will be entered into Earth Layer's harvest record." }
        sezgiler:
          - kosul: { stat: { per: 170 } }
            metin: { tr: "Ossiran'ın görünen seviyesi tek bir varlığın değil; üç dünyanın toplamı. Yıldızları çıkarırsan altında kalan şey şaşırtıcı derecede küçük.", en: "Ossiran's visible level isn't one being's. It's three worlds added together. Take the stars away and what's left underneath is surprisingly small." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onun içindeki üç dünya birbirini sevmiyor. onları biraz karıştırabilirim. ama bunu yaparsam ben de biraz karışırım.", en: "the three worlds inside him don't like each other. i could stir them up a little. but if i do, i get a little stirred up too." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kenarda duracağım. Bu senin dövüşün. Ama düşersen, o kenar çok kısa sürer.\"", en: "\"I'll be on the sidelines. This one's yours. But if you go down, those sidelines won't last long.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kazan. Ve sonra onun içindekileri alma. Söz ver bana.\"", en: "\"Win. And then don't take what's inside him. Promise me.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ortaya yürü ve dövüş", en: "Walk out to the center and fight" }
            etkiler:
              - bolge: "yedi_taht"
              - ahlak: { duzen: -3, merhamet: 1 }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+8"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "Yedi Taht'ın hüküm salonunda, altı tahtın önünde, dünyanı isteyen Kadim'le dövüştün.", en: "In the Sevenfold Court's Hall of Decree, before all six thrones, you fought the Ancient who wanted your world." }
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Gerçek seviyesini salona yüksek sesle oku", en: "Read his real level out loud to the hall" }
            gerekli: { stat: { per: 170 } }
            etkiler:
              - bolge: "yedi_taht"
              - bilgi: "ossiran_gercek_seviye"
              - aciga_vur: true
              - ahlak: { duzen: -2, insanlik: 2 }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+5"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "Yedi Taht'ın varisinin gerçek seviyesini altı tahtın önünde yüksek sesle okudun; bir tanrının ne kadarının ödünç olduğunu herkes duydu.", en: "You read the Sevenfold Court heir's real level out loud before all six thrones, and everyone heard how much of a god was borrowed." }
          - id: "yanki"
            etiket: { tr: "{npc:yanki} içindeki üç dünyayı karıştırsın", en: "Have {npc:yanki} stir up the three worlds in him" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bolge: "yedi_taht"
              - yozlasma: 5
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - savas: { dusmanlar: ["varis_ossiran@oyuncu+4"], kazan: "varis_zafer", kaybet: "varis_yenilgi", kac: "varis_kacis" }
            kronik: { tr: "Kafandaki ses, Yedi Taht'ın varisinin içindeki üç dünyayı birbirine düşürdü; bedelini ikiniz birlikte ödediniz.", en: "The voice in your head turned the three worlds inside the Sevenfold Court's heir against each other, and the two of you paid for it together." }
          - id: "reddet"
            etiket: { tr: "Düelloyu reddet ve salondan çık", en: "Refuse the duel. Walk out of the hall" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_duellosu_reddedildi"
              - ahlak: { duzen: 2, merhamet: -2 }
              - itibar: { kadimler: -5 }
              - degisken: { kadim_tehdit: 6 }
            kronik: { tr: "Yedi Taht'ın varisinin düellosunu reddettin; Ossiran dünyanı hasat listesine kendi adıyla yazdırdı.", en: "You refused the Sevenfold Court heir's duel, and Ossiran had your world entered on the harvest list under his own name." }
            sonraki: "varis_ret"

      - id: "varis_zafer"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ossiran dizlerinin üstüne çöküyor. Derisi çatlamış; çatlaklardan üç dünyanın ışığı sızıyor ve o ışığın içinde bir sürü küçük, şaşkın yüz görüyorsun. Onun hasat ettikleri.", en: "Ossiran drops to his knees. His skin is cracked, light from three worlds leaking out of the seams, and inside that light you can see a crowd of small, bewildered faces. The ones he harvested." }
          - { tr: "Altı taht kıpırdamıyor. Karışmadılar; bu da bir oydu. Şimdi senin ne yapacağını bekliyorlar.", en: "The six thrones don't move. They didn't step in, and that was a vote too. Now they're waiting to see what you'll do." }
          - { tr: "\"Bitir,\" diyor Ossiran. \"Ya da al. Biz ikisinin arasında bir fark görmeyiz.\"", en: "\"Finish it,\" Ossiran says. \"Or take it. We do not see a difference between the two.\"" }
        bildirimler:
          - tur: "unvan"
            nadirlik: "mitik"
            baslik: { tr: "[Talip yenildi]", en: "[Claimant defeated]" }
            satirlar:
              - { tr: "Dünya Katmanı'nın hasat kaydı: talipsiz.", en: "Earth Layer harvest record: unclaimed." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Söz vermiştin.\"", en: "\"You promised.\"" }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Onu bitir; içindeki dünyaları serbest bırak", en: "Finish him. Set the worlds inside him free" }
            etkiler:
              - bayrak: "ossiran_olduruldu"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - esya: { ossiran_tac_parcasi: 1 }
              - ahlak: { merhamet: 4, duzen: -4, insanlik: 4 }
              - itibar: { kadimler: -15 }
              - degisken: { kadim_tehdit: -8 }
              - xp_seviye: 150
            kronik: { tr: "Yedi Taht'ın varisini kendi sarayında öldürdün ve içinde taşıdığı üç dünyanın ışığını serbest bıraktın; Kadimler dünyanı bir daha kolay bir hasat olarak görmedi.", en: "You killed the Sevenfold Court's heir in his own palace and set free the light of the three worlds he carried. The Ancients never saw your world as an easy harvest again." }
            sonraki: "varis_son"
          - id: "bagisla"
            etiket: { tr: "Bağışla; yaşasın ve hatırlasın", en: "Spare him. Let him live and remember" }
            etkiler:
              - bayrak: "ossiran_bagislandi"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - ahlak: { merhamet: 8, insanlik: 4 }
              - itibar: { kadimler: -4 }
              - degisken: { kadim_tehdit: -4 }
              - xp_seviye: 120
            kronik: { tr: "Yedi Taht'ın varisini yendin ve bağışladın; Kadimler bunu ya bir zayıflık ya da hiç anlamadıkları bir güç olarak kaydetti.", en: "You beat the Sevenfold Court's heir and spared him. The Ancients logged it either as weakness or as a kind of strength they never understood." }
            sonraki: "varis_son"
          - id: "yut"
            etiket: { tr: "Üç dünyayı içine çek", en: "Pull the three worlds into yourself" }
            etkiler:
              - bayrak: "ossiran_olduruldu"
              - bayrak: "ossiran_yutuldu"
              - unvan: "varis_katili"
              - gorev: { cok_evren_taht: tamam }
              - esya: { ossiran_tac_parcasi: 1 }
              - ahlak: { insanlik: -14, merhamet: -6 }
              - yozlasma: 10
              - stat: { str: 10, int: 10, wil: 10 }
              - itibar: { kadimler: 5, yukselenler: 8 }
              - degisken: { kadim_tehdit: -6 }
              - xp_seviye: 260
            kronik: { tr: "Yedi Taht'ın varisini yendin ve onun hasat ettiği üç dünyayı içine çektin; altı taht seni ilk kez kendilerinden biri gibi selamladı.", en: "You beat the Sevenfold Court's heir and pulled the three worlds he'd harvested into yourself. For the first time, the six thrones saluted you like one of their own." }
            sonraki: "varis_son"

      - id: "varis_yenilgi"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Ossiran'ın avucu göğsünde. İtmiyor; çekiyor. Sayıların ona doğru eğiliyor ve derisindeki dördüncü boşluk senin ışığınla dolmaya başlıyor.", en: "Ossiran's palm is flat on your chest. He isn't pushing. He's pulling. Your numbers lean toward him, and the fourth hollow in his skin starts filling with your light." }
          - { tr: "Sonra altı tahttan biri konuşuyor. Ulvenne'nin Sesi, İkinci Taht'tan: \"Konuk kaydında.\" Tek bir cümle; ama bu salonda bir yasa.", en: "Then one of the six thrones speaks. Ulvenne's Voice, from the Second Throne: \"It is on the guest registry.\" One sentence. In this hall, it's law." }
          - { tr: "Ossiran elini çekiyor ve sen, yarısı boşalmış, pencereli zeminden aşağı, Kule'nin ellinci katına düşüyorsun.", en: "Ossiran pulls his hand back, and you, half drained, fall down through the window floor to the Spire's fiftieth floor." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kule'nin taşında nefeslen", en: "Catch your breath on the Spire's stone" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_yenilgisi"
              - gorev: { cok_evren_taht: basarisiz }
              - ahlak: { insanlik: 2 }
              - degisken: { kadim_tehdit: 6 }
              - can: 60
            kronik: { tr: "Yedi Taht'ın varisine yenildin; dünyan onun hasat listesine yazıldı ve seni yalnızca bir misafirlik kuralı kurtardı.", en: "You lost to the Sevenfold Court's heir. Your world went onto his harvest list, and the only thing that saved you was a rule about guests." }
            sonraki: "@akis"

      - id: "varis_kacis"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Pencereli zemine yumruğunu indiriyorsun ve cam açılıyor; aşağı, Kule'ye düşüyorsun. Yukarıda altı taht kıpırdamıyor.", en: "You slam your fist into the window floor and the glass gives way. You drop through it, down into the Spire. Up above, the six thrones don't move." }
          - { tr: "Ossiran'ın sesi peşinden geliyor: \"Kaçan bir hasat hâlâ bir hasattır.\"", en: "Ossiran's voice follows you down: \"A crop that runs is still a crop.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Ayağa kalk", en: "Get up" }
            etkiler:
              - bolge: "kule_dibi"
              - bayrak: "varis_yenilgisi"
              - gorev: { cok_evren_taht: basarisiz }
              - ahlak: { duzen: 1, merhamet: -2 }
              - degisken: { kadim_tehdit: 5 }
            kronik: { tr: "Yedi Taht'ın hüküm salonundan kaçtın; Ossiran dünyanı kendi listesine yazdırdı.", en: "You ran from the Sevenfold Court's Hall of Decree, and Ossiran entered your world on his own list." }
            sonraki: "@akis"

      - id: "varis_ret"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Salondan çıkıyorsun ve mühürlü kapı arkandan kapanıyor. Kule Dibi'nde akşam; insanlar tezgâhlarını topluyor.", en: "You walk out of the hall, and the sealed door shuts behind you. It's evening in Spire Plaza. People are packing up their stalls." }
          - { tr: "Gece yarısı herkesin penceresi aynı anda çalıyor: [Dünya Katmanı · hasat talibi kaydedildi: Ossiran.] Kimse bunun ne demek olduğunu bilmiyor. Sen biliyorsun.", en: "At midnight everybody's window goes off at once: [Earth Layer · harvest claimant registered: Ossiran.] Nobody knows what that means. You do." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Ellinci kata bak ve bekle", en: "Look up at the fiftieth floor and wait" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: 1 }
            kronik: { tr: "Dünyanın hasat talibinin adını bütün şehirle aynı anda okudun ve bunun ne demek olduğunu bilen tek kişi sendin.", en: "You read the name of your world's harvest claimant at the same moment as the whole city, and you were the only one who knew what it meant." }
            sonraki: "@akis"

      - id: "varis_son"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Altı taht ayağa kalkıyor. Bu, bin yıldır olmamış. Ulvenne hüküm salonunun ortasına yürüyor ve Kadim dilinde bir şey okuyor; Sistem çeviriyor: [Dünya Katmanı'nın hasadının talipsiz kalmasına karar verildi.]", en: "The six thrones rise. That hasn't happened in a thousand years. Ulvenne walks into the middle of the Hall of Decree and reads something in the Ancient language, and the System translates: [It has been decided that the harvest of Earth Layer shall remain unclaimed.]" }
          - metin: { tr: "\"Bu döngüde,\" diye ekliyor Ulvenne, alçak sesle, yalnızca sana. \"Gerisi elçimizin masasına kaldı. Anlaşmamızı unutmadık.\"", en: "\"For this cycle,\" Ulvenne adds quietly, only to you. \"The rest is left to our envoy's table. We have not forgotten our arrangement.\"" }
            kosul: { bayrak: "taht_ittifak" }
          - metin: { tr: "Altı Ses'in derilerindeki yıldızlar sana doğru kayıyor; bir çiçeğin güneşe dönmesi gibi. İçindeki üç dünya onları tanıyor ve selamlıyor.", en: "The stars under the six Voices' skin drift toward you, like a flower turning to the sun. The three worlds inside you recognize them, and salute." }
            kosul: { bayrak: "ossiran_yutuldu" }
          - { tr: "Pencereli zemin ayaklarının altında hafifçe ısınıyor. Hasat edilmiş dünyaların son satırları; ve bu gece, aralarında, seninki yok.", en: "The window floor warms a little under your feet. The last lines of harvested worlds, and tonight, yours isn't one of them." }
        secenekler:
          - id: "don"
            etiket: { tr: "Kendi dünyana dön", en: "Go home to your world" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Yedi Taht'tan, dünyanın hasadını talipsiz bıraktırmış olarak döndün.", en: "You came home from the Sevenfold Court having left your world's harvest unclaimed." }
            sonraki: "@akis"
          - id: "koltuk"
            etiket: { tr: "Çıkmadan önce boş koltuğa son kez bak", en: "Take one last look at the empty seat" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            kronik: { tr: "Yedi Taht'tan ayrılmadan önce boş koltuğa son kez baktın; koltuk da sana baktı.", en: "Before leaving the Sevenfold Court, you took one last look at the empty seat. It looked back." }
            sonraki: "varis_koltuk"

      - id: "varis_koltuk"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Taht salonu boş. Yedinci koltuğun içindeki boşluk hâlâ senin dünyanın şeklinde; ama artık kıyıları biraz bulanık, sanki biri silmeye başlamış.", en: "The throne room is empty. The hollow inside the seventh seat is still shaped like your world, but the coastlines are a little blurry now, like somebody started erasing them." }
          - { tr: "Koltuk seni bekliyor. Her zaman bekleyecek.", en: "The seat is waiting for you. It always will be." }
        secenekler:
          - id: "git"
            etiket: { tr: "Arkanı dön ve git", en: "Turn around and go" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Bir tanrının koltuğunun seni beklediğini bilerek ona arkanı döndün.", en: "Knowing a god's seat would wait for you, you turned your back on it." }
            sonraki: "@akis"
