# Genel eşik olayları (GDD: Dinamik karakterler → Eşik olayları). Motor tohumlar; odak NPC "@":
# {npc:@} adı, {npc_hedef:@} NPC'nin hedefi, {zamir:@|o} İngilizce zamir (he/she/they/it + fiil uyumu:
# |s says/say, |is, |has, |does; |onu him/them, |onun his/their, |b büyük harf). Türkçede zamir belirteci kullanılmaz.
# Etkilerde/koşullarda "@" o NPC'dir. NPC'ye özel sürüm `esik_<tur>_<npc>` yazılırsa genelin yerine o gelir.
# Kişisel görev, kaçış, itaat ve ayrılık yalnızca yoldaşlarda; ihanet ve rakiplik bedeni olan (savaşabilen) her tanıdıkta.
olaylar:
  # ------------------------------------------------------------------ ihanet
  - id: "esik_ihanet"
    agirlik: 1
    etiketler: ["ihanet", "npc"]
    gerilim: 4
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Sırtındaki bıçak", en: "The knife in your back" }
    sahne: "esik_ihanet_1"
    sahneler:
      - id: "esik_ihanet_1"
        paragraflar:
          - { tr: "Akşam çökerken yolun kenarındaki gölge kımıldıyor. {npc:@} karanlıktan çıkıyor; yüzünde ne utanç var ne korku.", en: "As night falls, the shadow by the road moves. {npc:@} steps out of the dark. No shame on that face. No fear either." }
          - { tr: "\"Hesap ortada,\" diyor {npc:@}. \"Sen yukarı tırmandıkça ben aşağıda kalıyorum. Artık değil.\"", en: "\"Do the math,\" {npc:@} says. \"Every rung you climb, I stay at the bottom. Not anymore.\"" }
          - { tr: "Arkasındaki sis kıpırdıyor. Yalnız gelmemiş olabilir; ya da sen öyle sanmanı istiyor.", en: "The fog behind {zamir:@|onu} shifts. Maybe {zamir:@|o} didn't come alone. Or maybe that's what you're supposed to think." }
        sezgiler:
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Sisin içinde kimse yok. Ayak izleri tek kişilik.", en: "There's nobody in the fog. One set of footprints." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "B̷unu sen yaptın. Güveni sıfırın altına sen ittin. Şimdi ne olacak?", en: "Y̷ou did this. You pushed the trust below zero. So what now?" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Silahını çek. Bunu burada bitir", en: "Draw. End this here" }
            goster: { npc_savasabilir: "@" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - npc_isaret: { "@": "hain" }
              - yoldas_ayril: "@"
              - savas: { dusmanlar: ["npc:@"], ortam: ["karanlik"], kazan: "esik_ihanet_zafer", kaybet: "esik_ihanet_yenilgi", kac: "esik_ihanet_kopus" }
          - id: "konus"
            etiket: { tr: "Yaklaş. Onu konuşturmaya çalış", en: "Step closer. Keep the talk going" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "esik_ihanet_kopus", basarisiz_etkiler: [{ npc_isaret: { "@": "hain" } }, { yoldas_ayril: "@" }, { iliski: { "@": { guven: -10 } } }] }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - iliski: { "@": { guven: 35, saygi: 5 } }
              - hafiza: { npc: "@", id: "ihanetten_dondu", agirlik: 45 }
            sonraki: "esik_ihanet_barisma"
          - id: "birak"
            etiket: { tr: "Kenara çekil. Gitmek istiyorsa gitsin", en: "Step aside. Whoever wants to leave can leave" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - npc_isaret: { "@": "hain" }
              - yoldas_ayril: "@"
              - iliski: { "@": { saygi: -10 } }
              - hafiza: { npc: "@", id: "ihanette_birakildi", agirlik: -40 }
            sonraki: "esik_ihanet_kopus"

      - id: "esik_ihanet_zafer"
        paragraflar:
          - metin: { tr: "Toz yatışıyor. Nefesin yerine geliyor; {npc:@} yerden kalkmaya çalışmıyor bile.", en: "The dust settles. Your breath comes back. {npc:@} doesn't even try to get up." }
            kosul: { npc_hayatta: "@" }
          - metin: { tr: "Toz yatışıyor. {npc:@} artık hiçbir şey hesaplamayacak.", en: "The dust settles. {npc:@} won't be doing any more math." }
            kosul: { npc_olu: "@" }
          - { tr: "Bir zamanlar aynı yolu yürüyordunuz. Şimdi aranızdaki mesafe bir kılıç boyu ve bir ömür.", en: "Not long ago you walked the same road. Now the distance between you is one blade's length and a whole lifetime." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk away without looking back" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - npc_gitti: "@"
            sonraki: "@akis"
          - id: "son_soz"
            etiket: { tr: "Son bir kez neden diye sor", en: "Ask one last time: why?" }
            goster: { npc_hayatta: "@" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - hafiza: { npc: "@", id: "ihanet_sorgu", agirlik: 20 }
              - npc_gitti: "@"
            sonraki: "esik_ihanet_neden"
          - id: "gom"
            etiket: { tr: "Onu toprağa ver. Bunu en azından hak ediyor", en: "Bury the body. That much is owed" }
            goster: { npc_olu: "@" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
            sonraki: "@akis"
      - id: "esik_ihanet_neden"
        paragraflar:
          - { tr: "\"Çünkü sen hep bir adım öndeydin,\" diyor {npc:@}. \"Ve bir gün dönüp bakmayı bıraktın.\"", en: "\"Because you were always one step ahead,\" {npc:@} says. \"And one day you stopped looking back.\"" }
          - { tr: "Cevap seni rahatlatmıyor. Belki de rahatlatması gerekmiyordu.", en: "The answer doesn't make you feel better. Maybe it was never supposed to." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bunu da taşı ve devam et", en: "Carry that too, and keep going" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
      - id: "esik_ihanet_yenilgi"
        paragraflar:
          - { tr: "Yerdesin. {npc:@} üstünde duruyor; nefesi senin kadar hızlı.", en: "You're on the ground. {npc:@} stands over you, breathing as hard as you are." }
          - { tr: "Son darbe gelmiyor. \"Bunu hatırla,\" diyor {npc:@} ve sisin içine kayboluyor.", en: "The last blow never comes. \"Remember this,\" {npc:@} says, and melts into the fog." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Yarayı sar", en: "Get up. Bind the wound" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { "@": { saygi: -15 } }
              - npc_gitti: "@"
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "Bir dahaki sefere hazır olacağına yemin et", en: "Swear you'll be ready next time" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - stat: { wil: 1 }
              - npc_gitti: "@"
            sonraki: "@akis"
      - id: "esik_ihanet_barisma"
        paragraflar:
          - { tr: "Konuşuyorsunuz. Uzun uzun, dişlerinizi sıkarak. Sonunda {npc:@} silahını indiriyor.", en: "You talk. For a long time, through clenched teeth. Eventually {npc:@} lowers the weapon." }
          - { tr: "\"Bunu bir daha yapma,\" diyor. Hanginize söylediği belli değil.", en: "\"Don't make me do this again,\" {zamir:@|o} say{zamir:@|s}. It's not clear which of you {zamir:@|o} mean{zamir:@|s}." }
        secenekler:
          - id: "el_uzat"
            etiket: { tr: "Elini uzat", en: "Offer your hand" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { "@": { baglilik: 10 } }
            sonraki: "@akis"
          - id: "mesafe"
            etiket: { tr: "Mesafeni koru. Güven zamanla gelir", en: "Keep your distance. Trust takes time" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "@akis"
      - id: "esik_ihanet_kopus"
        paragraflar:
          - { tr: "{npc:@} sana son bir kez bakıyor ve dönüp gidiyor. Ayak sesleri sisin içinde boğuluyor.", en: "{npc:@} gives you one last look, turns, and goes. The footsteps drown in the fog." }
          - { tr: "Sistem bunu bir satırla geçiyor. Senin içinse bu gece uzun.", en: "The System logs it in a single line. For you, it's going to be a long night." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşi yeniden yak", en: "Get the fire going again" }
            etkiler:
              - ahlak: { duzen: 1 }
              - npc_gitti: "@"
            sonraki: "@akis"
          - id: "iz_sur"
            etiket: { tr: "İzini aklına kazı. Bir gün lazım olacak", en: "Memorize the trail. You'll need it someday" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - egilim: { gizlilik: 1 }
              - npc_gitti: "@"
            sonraki: "@akis"

  # ------------------------------------------------------------------ kişisel görev (yoldaş)
  - id: "esik_kisisel"
    agirlik: 1
    etiketler: ["kisisel", "npc"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Bir ricası var", en: "A favor to ask" }
    sahne: "esik_kisisel_1"
    sahneler:
      - id: "esik_kisisel_1"
        paragraflar:
          - { tr: "{npc:@} bütün gün bir şey söyleyecekmiş gibi dolaştı. Akşam, ateşin karşısına oturuyor ve sonunda söylüyor.", en: "{npc:@} has been circling something all day. That night, across the fire, it finally comes out." }
          - { tr: "Aslında biliyorsun; hep oradaydı, konuşmaların altında: {npc_hedef:@}. Şimdi ilk kez yüksek sesle söylüyor.", en: "You already knew, really. It was always there under every conversation: {npc_hedef:@}. Now {zamir:@|o} finally say{zamir:@|s} it out loud." }
          - { tr: "\"Bunu yalnız yapamam,\" diyor. \"Yardım eder misin?\"", en: "\"I can't do this alone,\" {zamir:@|o} say{zamir:@|s}. \"Will you help?\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Ne gerekiyorsa. Birlikte.\"", en: "\"Whatever it takes. Together.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - kisisel_gorev: { "@": "basla" }
              - iliski: { "@": { guven: 8, baglilik: 5 } }
              - tohum: { olay: "esik_kisisel_son", gecikme: { min: 3, max: 6 }, kosul: { yoldas: "@" }, npc: "@" }
            sonraki: "@akis"
          - id: "sonra"
            etiket: { tr: "\"Şimdi değil. Ama söz, döneceğiz buna.\"", en: "\"Not now. But I promise we'll come back to it.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - kisisel_gorev: { "@": "basla" }
              - iliski: { "@": { baglilik: -5 } }
              - tohum: { olay: "esik_kisisel_son", gecikme: { min: 9, max: 14 }, kosul: { yoldas: "@" }, npc: "@" }
            sonraki: "@akis"
          - id: "red"
            etiket: { tr: "\"Kendi derdimiz yetiyor.\"", en: "\"We've got enough problems of our own.\"" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -2 }
              - iliski: { "@": { baglilik: -20, guven: -5 } }
              - hafiza: { npc: "@", id: "rica_reddedildi", agirlik: -30 }
            sonraki: "@akis"

  - id: "esik_kisisel_son"
    agirlik: 1
    etiketler: ["kisisel", "npc"]
    gerilim: 3
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Verilen söz", en: "A promise kept" }
    sahne: "esik_kisisel_son_1"
    sahneler:
      - id: "esik_kisisel_son_1"
        paragraflar:
          - { tr: "Gün geldi. {npc:@} hazır; ellerinin titrediğini saklamaya çalışıyor ama beceremiyor.", en: "The day's here. {npc:@} is ready, trying to hide the shake in {zamir:@|onun} hands and not quite pulling it off." }
          - { tr: "Bunca zamandır konuştuğunuz şey bu: {npc_hedef:@}. Aradaki son engel önünüzde duruyor ve kolay olmayacak.", en: "This is what all those talks were about: {npc_hedef:@}. The last thing in the way is right in front of you, and it won't be easy." }
          - { tr: "\"Ben öne geçeyim,\" diyor {npc:@}. \"Bu benim işim.\"", en: "\"Let me go first,\" {npc:@} says. \"This one's mine.\"" }
        yoldas_tepkileri:
          - npc: "@"
            metin: { tr: "\"Yanımda olman yeter. Gerisini ben hallederim... galiba.\"", en: "\"Just be there. I'll handle the rest... I think.\"" }
        secenekler:
          - id: "one_gec"
            etiket: { tr: "Öne sen geç; darbeyi sen al", en: "Take point yourself. Eat the hit" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - can: -15
              - kisisel_gorev: { "@": "tamam" }
              - npc_odul: "@"
            sonraki: "esik_kisisel_son_tamam"
          - id: "guc"
            etiket: { tr: "Gücünü saklama. Engeli ez geç", en: "Stop holding back. Flatten it" }
            tur: "aciga_vur"
            etkiler:
              - ahlak: { duzen: 2 }
              - aciga_vur: true
              - kisisel_gorev: { "@": "tamam" }
              - npc_odul: "@"
              - iliski: { "@": { korku: 5, saygi: 5 } }
            sonraki: "esik_kisisel_son_tamam"
          - id: "ona_birak"
            etiket: { tr: "Ona bırak; arkasından yönlendir", en: "Let {zamir:@|onu} do it. Coach from behind" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "esik_kisisel_son_kayip", basarisiz_etkiler: [{ kisisel_gorev: { "@": "basarisiz" } }, { iliski: { "@": { baglilik: -10 } } }, { npc_iz: { "@": "yara_izi" } }] }
            etkiler:
              - ahlak: { insanlik: 5 }
              - kisisel_gorev: { "@": "tamam" }
              - npc_odul: "@"
              - iliski: { "@": { saygi: 10 } }
            sonraki: "esik_kisisel_son_tamam"
      - id: "esik_kisisel_son_tamam"
        paragraflar:
          - { tr: "Bitti. {npc:@} uzun süre hiçbir şey söylemiyor; sonra gülmeye başlıyor, gözleri ıslak.", en: "It's done. For a long time {npc:@} doesn't say a word. Then the laughter comes, eyes wet." }
          - { tr: "\"Borçlandım,\" diyor. \"Ve bunu hiç ödeyemeyeceğim. Ödemek de istemiyorum.\"", en: "\"I owe you,\" {zamir:@|o} say{zamir:@|s}. \"And I'm never paying it back. Don't want to.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Omzuna hafifçe vur", en: "Clap a hand on that shoulder" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
      - id: "esik_kisisel_son_kayip"
        paragraflar:
          - { tr: "Olmadı. Engel {npc:@} için fazla geldi ve sen yeterince hızlı değildin.", en: "It didn't work. The obstacle was too much for {npc:@}, and you weren't fast enough." }
          - { tr: "{npc:@} yarasını sarıyor ve sana bakmıyor. \"Benim hatam,\" diyor. İkiniz de bunun doğru olmadığını biliyorsunuz.", en: "{npc:@} binds the wound and won't meet your eyes. \"My fault.\" You both know that's not true." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile", en: "Apologize" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { "@": { guven: 5 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme", en: "Say nothing" }
            etkiler:
              - ahlak: { merhamet: -1 }
            sonraki: "@akis"

  # ------------------------------------------------------------------ kaçış (yoldaş)
  - id: "esik_kacis"
    agirlik: 1
    etiketler: ["korku", "npc"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Boş uyku tulumu", en: "An empty bedroll" }
    sahne: "esik_kacis_1"
    sahneler:
      - id: "esik_kacis_1"
        paragraflar:
          - { tr: "Sabah {npc:@|in} yeri boş. Uyku tulumu katlanmış, ateşin yanına bir taşla tutturulmuş bir not bırakılmış.", en: "Come morning, {npc:@|pos} spot is empty. Bedroll folded. A note pinned under a rock by the fire." }
          - { tr: "\"Senden korkuyorum. Bunu yüzüne söyleyemedim. Arama beni.\"", en: "\"I'm scared of you. I couldn't say it to your face. Don't come looking for me.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Notu katla, cebine koy. Gitsin", en: "Fold the note, pocket it. Let it be" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - npc_isaret: { "@": "kacti" }
              - iliski: { "@": { korku: -15 } }
              - npc_gitti: "@"
            sonraki: "@akis"
          - id: "pesinden"
            etiket: { tr: "İzleri takip et; konuşmanız lazım", en: "Follow the tracks. You two need to talk" }
            zar: { stat: "per", zorluk: 12, basarisiz: "@akis", basarisiz_etkiler: [{ npc_isaret: { "@": "kacti" } }, { npc_gitti: "@" }] }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { "@": { korku: -25, guven: 10 } }
              - hafiza: { npc: "@", id: "kacinca_aradi", agirlik: 35 }
            sonraki: "esik_kacis_bulundu"
          - id: "tehdit"
            etiket: { tr: "Bul ve geri getir. Kimse senden kaçmaz", en: "Hunt down and drag back. Nobody runs from you" }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 3 }
              - iliski: { "@": { korku: 15, guven: -20 } }
              - npc_iz: { "@": "korku_izi" }
              - npc_isaret: { "@": "itaatkar" }
            sonraki: "@akis"
      - id: "esik_kacis_bulundu"
        paragraflar:
          - { tr: "{npc:@} bir ağacın dibinde, dizlerini göğsüne çekmiş oturuyor. Seni görünce kaçmıyor; artık gücü kalmamış.", en: "{npc:@} is sitting at the base of a tree, knees pulled up tight. No running when you show up. Nothing left to run with." }
          - { tr: "Silahını yere bırakıp yanına oturuyorsun. Bir süre ikiniz de konuşmuyorsunuz.", en: "You set your weapon down and sit close by. For a while neither of you says anything." }
        secenekler:
          - id: "geri_don"
            etiket: { tr: "\"Benimle gel. Ama istersen.\"", en: "\"Come back with me. Only if you want to.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { "@": { baglilik: 10 } }
            sonraki: "@akis"
          - id: "yollar"
            etiket: { tr: "\"Burada ayrılalım. Kin yok.\"", en: "\"Let's split here. No hard feelings.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { "@": { guven: 10 } }
              - npc_gitti: "@"
            sonraki: "@akis"

  # ------------------------------------------------------------------ itaat (yoldaş)
  - id: "esik_itaat"
    agirlik: 1
    etiketler: ["korku", "npc"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Diz çöken", en: "Down on one knee" }
    sahne: "esik_itaat_1"
    sahneler:
      - id: "esik_itaat_1"
        paragraflar:
          - { tr: "{npc:@} önünde diz çöküyor. Bunu kimse istemedi; kendiliğinden yapıyor.", en: "{npc:@} kneels in front of you. Nobody asked for it." }
          - { tr: "\"Ne istersen,\" diyor gözlerini yerden kaldırmadan. \"Ne dersen yaparım. Yeter ki bana döndüğün gün o şey olma.\"", en: "\"Whatever you want,\" {zamir:@|o} say{zamir:@|s}, eyes on the dirt. \"Anything you say. Just don't turn into that thing when you look at me.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Korku sadakate benzer. Uzaktan.", en: "Fear looks a lot like loyalty. From a distance." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"İyi. O zaman dediğimi yap.\"", en: "\"Good. Then do as I say.\"" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -5 }
              - npc_isaret: { "@": "itaatkar" }
              - iliski: { "@": { korku: 10, baglilik: 10 } }
            sonraki: "@akis"
          - id: "kaldir"
            etiket: { tr: "Ayağa kaldır. \"Benden korkma.\"", en: "Pull {zamir:@|onu} up. \"Don't be afraid of me.\"" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - iliski: { "@": { korku: -25, guven: 10 } }
              - hafiza: { npc: "@", id: "ayaga_kaldirdi", agirlik: 40 }
            sonraki: "@akis"
          - id: "kullan"
            etiket: { tr: "Önden gönder; tehlikeli yolu o koklasın", en: "Send {zamir:@|onu} ahead to sniff out the danger" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4 }
              - npc_isaret: { "@": "itaatkar" }
              - iliski: { "@": { korku: 10, guven: -10 } }
              - npc_iz: { "@": "korku_izi" }
              - xp: 40
            sonraki: "@akis"

  # ------------------------------------------------------------------ rakiplik
  - id: "esik_rakip"
    agirlik: 1
    etiketler: ["rakip", "duello", "npc"]
    gerilim: 3
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Meydan okuma", en: "The challenge" }
    sahne: "esik_rakip_1"
    sahneler:
      - id: "esik_rakip_1"
        paragraflar:
          - { tr: "{npc:@} yolunu kesiyor; elinde silahı, yüzünde tuhaf bir saygı.", en: "{npc:@} blocks your path, weapon out, a strange kind of respect written all over that face." }
          - { tr: "\"Herkes senden bahsediyor,\" diyor. \"Ben de görmek istiyorum. Sen ve ben. Şimdi.\"", en: "\"Everybody's talking about you,\" {zamir:@|o} say{zamir:@|s}. \"I want to see for myself. You and me. Right now.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et. Kimin daha iyi olduğunu görelim", en: "Accept. Let's see who's better" }
            goster: { npc_savasabilir: "@" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["npc:@"], ortam: [], kazan: "esik_rakip_zafer", kaybet: "esik_rakip_yenilgi", kac: "esik_rakip_kacis" }
          - id: "maske"
            etiket: { tr: "Fısılda: \"Listedeki ben, gerçek ben değilim.\"", en: "Whisper: \"The me on the board isn't the real me.\"" }
            goster: { bilgi: "sirala_maske" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { "@": { saygi: 10, korku: 10 } }
              - dikkat: 3
              - hafiza: { npc: "@", id: "maskeyi_gordu", agirlik: 30 }
            sonraki: "esik_rakip_maske"
          - id: "reddet"
            etiket: { tr: "\"Seninle dövüşmem için bir sebep yok.\"", en: "\"I've got no reason to fight you.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { "@": { saygi: -15, guven: 5 } }
            sonraki: "@akis"
          - id: "kucumse"
            etiket: { tr: "Gül. \"Sen mi? Bana?\"", en: "Laugh. \"You? Against me?\"" }
            tur: "gosteris"
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - iliski: { "@": { saygi: -5, guven: -15, korku: 10 } }
              - hafiza: { npc: "@", id: "kucumsendi", agirlik: -35 }
            sonraki: "@akis"
      - id: "esik_rakip_maske"
        paragraflar:
          - { tr: "{npc:@} bir an sana bakıyor; sonra yüzünden renk çekiliyor. Bir şey görmüş, ama ne gördüğünü kendine bile söyleyemiyor.", en: "{npc:@} stares at you for a beat. Then the color drains out. Something just got seen, and it can't even be put into words." }
          - { tr: "\"Başka bir gün,\" diyor, silahını indirip geri çekilirken. \"Belki.\"", en: "\"Another day,\" {zamir:@|o} say{zamir:@|s}, lowering the weapon and backing off. \"Maybe.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gitmesine izin ver", en: "Let it go" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "@akis"
      - id: "esik_rakip_zafer"
        paragraflar:
          - metin: { tr: "{npc:@} yerde, nefes nefese. Sonra, inanılmaz biçimde, gülüyor.", en: "{npc:@} is down, gasping. And then, unbelievably, laughing." }
            kosul: { npc_hayatta: "@" }
          - metin: { tr: "\"Tamam,\" diyor. \"Tamam. Şimdi anlıyorum.\"", en: "\"Okay,\" {zamir:@|o} say{zamir:@|s}. \"Okay. Now I get it.\"" }
            kosul: { npc_hayatta: "@" }
          - metin: { tr: "Meydan okumayı {npc:@} istedi. Bedelini sen belirledin.", en: "{npc:@} asked for this fight. You set the price." }
            kosul: { npc_olu: "@" }
          - metin: { tr: "Etraf sessiz. Seyredenler varsa, bundan sonra adını başka türlü anacaklar.", en: "Everything's quiet. If anyone was watching, they'll say your name differently from now on." }
            kosul: { npc_olu: "@" }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini uzat, kaldır", en: "Reach down and help {zamir:@|onu} up" }
            goster: { npc_hayatta: "@" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { "@": { guven: 15, saygi: 5 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Dön ve git", en: "Turn and leave" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
      - id: "esik_rakip_yenilgi"
        paragraflar:
          - { tr: "Toprağın tadını alıyorsun. {npc:@} yüzüne eğiliyor.", en: "You get a mouthful of dirt. {npc:@} leans down over you." }
          - { tr: "\"Demek ki herkes abartıyormuş,\" diyor ve gidiyor. Ama gözlerinde bir hayal kırıklığı var; bunu bekleyen birinin değil.", en: "\"Guess everybody was exaggerating.\" Then {zamir:@|o} walk{zamir:@|s} away. But there's disappointment in those eyes. Not the look of someone who expected this." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Daha çok çalış", en: "Get up. Train harder" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { "@": { saygi: -20 } }
              - gunluk: { antrenman: 1 }
            sonraki: "@akis"
      - id: "esik_rakip_kacis"
        paragraflar:
          - { tr: "Geri çekiliyorsun. {npc:@} peşinden gelmiyor; sadece seslenmekle yetiniyor.", en: "You back off. {npc:@} doesn't follow. Just yells after you." }
          - { tr: "\"Kaçtığını herkese anlatacağım!\" Anlatacak da.", en: "\"I'm telling everybody you ran!\" And {zamir:@|o} will." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bırak anlatsın", en: "Let the talk spread" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { "@": { saygi: -15 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ ayrılık (yoldaş)
  - id: "esik_ayrilik"
    agirlik: 1
    etiketler: ["ayrilik", "npc"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Ayrı yollar", en: "Separate roads" }
    sahne: "esik_ayrilik_1"
    sahneler:
      - id: "esik_ayrilik_1"
        paragraflar:
          - { tr: "{npc:@} çantasını çoktan toplamış. Seni bekliyormuş.", en: "{npc:@} already has a pack ready. Was waiting for you." }
          - { tr: "\"Yaptıklarını izledim,\" diyor. \"Bir kısmını anladım, bir kısmını asla anlamayacağım.\"", en: "\"I've been watching what you do,\" {zamir:@|o} say{zamir:@|s}. \"Some of it I get. Some of it I never will.\"" }
          - { tr: "\"Bu yolda seninle yürüyemem.\"", en: "\"I can't walk this road with you.\"" }
        secenekler:
          - id: "ugurla"
            etiket: { tr: "Uğurla. \"Kendine iyi bak.\"", en: "Say goodbye. \"Take care of yourself.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { "@": { guven: 10 } }
              - hafiza: { npc: "@", id: "ayrilirken_ugurladi", agirlik: 30 }
              - npc_gitti: "@"
            sonraki: "@akis"
          - id: "ikna"
            etiket: { tr: "Değişebileceğini söyle; kalmasını iste", en: "Say you can change. Ask for one more chance" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "@akis", basarisiz_etkiler: [{ iliski: { "@": { guven: -5 } } }, { npc_gitti: "@" }] }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { "@": { baglilik: 10 } }
              - hafiza: { npc: "@", id: "degisecegine_soz", agirlik: 25 }
            sonraki: "@akis"
          - id: "zorla"
            etiket: { tr: "\"Gitmene izin verdiğimi kim söyledi?\"", en: "\"Who said I'm letting you go?\"" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -5, duzen: 3 }
              - iliski: { "@": { korku: 25, guven: -25 } }
              - npc_iz: { "@": "korku_izi" }
              - npc_isaret: { "@": "itaatkar" }
            sonraki: "@akis"

  # ------------------------------------------------------------------ yalan ortaya çıktı
  - id: "esik_yalan"
    agirlik: 1
    etiketler: ["yalan", "npc"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    tekrar: true
    kart: { tr: "Yalanın bedeli", en: "The price of a lie" }
    sahne: "esik_yalan_1"
    sahneler:
      - id: "esik_yalan_1"
        paragraflar:
          - { tr: "{npc:@} karşına dikiliyor. Sesi sakin; sakin olmak için çok uğraşan birinin sakinliği.", en: "{npc:@} plants {zamir:@|kendi} in front of you. Voice calm. The kind of calm that takes real effort." }
          - { tr: "\"Bana yalan söyledin. Biliyorum artık. Sadece neden diye soracağım ve bu sefer doğrusunu duymak istiyorum.\"", en: "\"You lied to me. I know now. I'm only going to ask why, and this time I want the truth.\"" }
        secenekler:
          - id: "itiraf"
            etiket: { tr: "Her şeyi anlat. Bahane yok", en: "Tell the whole truth. No excuses" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { "@": { guven: 12, saygi: 5 } }
              - hafiza: { npc: "@", id: "yalani_itiraf_etti", agirlik: 30 }
            sonraki: "@akis"
          - id: "inkar"
            etiket: { tr: "Yanlış anladığını söyle", en: "Insist it's all a misunderstanding" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "@akis", basarisiz_etkiler: [{ iliski: { "@": { guven: -15 } } }, { npc_iz: { "@": "yarali_guven" } }, { ahlak: { duzen: -2 } }] }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -2 }
              - iliski: { "@": { guven: 5 } }
            sonraki: "@akis"
          - id: "omuz"
            etiket: { tr: "\"Yaptım. Ne olmuş?\"", en: "\"Yeah, I did. So what?\"" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -2 }
              - iliski: { "@": { guven: -10, korku: 5, saygi: -5 } }
            sonraki: "@akis"
