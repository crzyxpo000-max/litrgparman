# Parti E — Kadimler zinciri + Elçi Thessar'ın yayı (docs/PERDE2_4.md "Parti E").
#
# Kadimler (kendi dillerinde Ithren, "hâlâ sayanlar"): bin dünya görmüş, hasatla güçlenmiş yaşlı bir çok-evren ırkı. Bir zamanlar onlara da
# 365 gün verildi; hasat edilmemek için imzaladılar ve hasatçı oldular (bilgi `kadim_imzasi`). Kültürleri bir muhasebedir: Defter (yasa ve
# kutsal kitap), "Hesap kapanır." (anlaşma sözü), vel (hasat payı; sayım çadırlarında insanın adını Defter'e yazdırmak = mülk olmak),
# thael (konuk hakkı; `kadim_konugu` unvanı), kesh (ancak kanla ödenen borç), Meclis (Yedi Taht'ın yedi koltuğu), Budayıcı (sapmaları budar).
# Bedenler: fazla uzun, yanlış bükülen eklemler, güneşe doğru düşen gölgeler, hesap defteri gibi çentikli gri deri, iki katmanlı ses
# (ikincisi yarım nefes geriden). Gemi: körfezin üstünde ucu suya dönük asılı ters bir kule, "Onuncu Sabır".
# Elçi Thessar: soğuk, nazik, muhasebeci; otuz dokuz dünya hasat etmiş, Dünya kırkıncı sayfa. Anomaliyi incelemek ister (OP MC).
#
# Thessar'ın kaderleri:
#   • Vassal ortağı: zincir (kadimler_1…5) işbirliğiyle gider, `kadim_vassal_imzalandi`, `kadim_teslim_tamam`; Bağlılık ≥ 50 ve
#     kadim_tehdit ≥ 70 tutarlı bir oyunla kolayca birikir; `thessar_son_duello` vassal dalı → `thessar_ortak`.
#   • Kendi ırkına ihanet eden müttefik: `thessar_ihanet_fisiltisi` → `thessar_ihanete_hazir` + kendi tohum olayımız `thessar_kirik_muhur`
#     (`ihanet_thessar` henüz konmadıysa koyar; Parti J'nin `buyuk_ihanet`i de koyabilir) → son düelloda Budayıcı'ya karşı birlikte.
#   • Son boss: hiçbir dala girmeyen ya da Kadimler'e düşman olan oyuncu için `thessar_son_duello` (AY 346) `thessar_elci@oyuncu+5`.
# Zincir: kadimler_1_ticaret → kadimler_2_vergi → kadimler_3_muhbir → kadimler_4_vassal_sozlesmesi → kadimler_5_teslim (gorev tamam).
# Her düğüm bir sonrakini tohumlar (zorunlu gelir) ve ayrıca havuzdadır (yedek).
olaylar:
  # ================================================================== THESSAR'IN İNİŞİ (AY 181)
  - id: "thessar_inis"
    perde: [3]
    agirlik: 1
    etiketler: ["ana_yay", "kadimler", "thessar", "elcilik"]
    gerilim: 4
    ana_yay: { gun: 181 }
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Elçi iniyor", en: "The Envoy comes down" }
    sahne: "thessar_inis_1"
    sahneler:
      - id: "thessar_inis_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yüz seksen birinci günün şafağında körfezin üstündeki gemi ilk kez kıpırdıyor. Üç gündür ucu suya dönük asılı duran o ters kule, kemik rengi taştan dev bir diş gibi yavaşça dönüyor. Altındaki su hâlâ dalgasız, gölgesi hâlâ güneşe doğru düşüyor.", en: "At dawn on Day 181, the ship over the bay moves for the first time. For three days that upside-down tower has hung point-first above the water, and now it turns, slow, like a bone-white tooth working itself loose. The water under it still doesn't have a single wave. Its shadow still falls toward the sun." }
          - { tr: "Ucundan {yer:kiyikent_liman|e} bir merdiven iniyor. Basamakları yok; yalnızca kendi üstüne katlanmış ışık, her katta biraz daha katılaşan. Rıhtımda dört kamp omuz omuza dizilmiş: silahlar kalkık, kimse kimseye bakmıyor, herkes yukarı bakıyor.", en: "A stairway lowers from the tip down to {yer:kiyikent_liman}. No steps, just light folded over on itself, a little more solid with every fold. Four camps line the pier shoulder to shoulder, weapons up, nobody looking at anybody. Everybody's looking up." }
          - { tr: "Önce muhafızlar iniyor: neredeyse üç metre boyunda, eklemleri yanlış yerden bükülen, cilalı defter sayfalarından zırh giymiş figürler. Sonra o geliyor. Uzun, sabırlı, elinde zincire bağlı bir kalem; derisi baştan sona ince çentiklerle, bir hesap defterinin satırları gibi çizilmiş.", en: "The guards come down first: nearly ten feet tall, joints bending in the wrong places, armored in lacquered ledger pages. Then he comes. Tall, patient, a stylus swinging on a chain from one hand, his skin scored head to toe with fine notches, like the ruled lines of an account book." }
          - metin: { tr: "Duruşunu tanıyorsun. Öğretici'de, sırtın üstünde, Kemik Taçlı Geyik'in önünde eğildiği şey de böyle duruyordu: fazla uzun, fazla hareketsiz.", en: "You know that posture. Back in the Tutorial, up on the ridge, the thing the Bonecrown Stag bowed to stood exactly like that. Too tall. Too still." }
            kosul: { bayrak: "yeni_tavan_goruldu" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[ÇOK-EVREN ELÇİSİ]", en: "[MULTIVERSAL ENVOY]" }
            satirlar:
              - { tr: "Kadimler'in elçisi Katman'a giriş yaptı. Diplomatik dokunulmazlık: etkin.", en: "An envoy of the Ancients has entered the Layer. Diplomatic immunity: active." }
              - { tr: "Seviye: okunamıyor.", en: "Level: unreadable." }
              - { tr: "Sistem tarafsızdır. Sistem bunu herkese hatırlatmak ister.", en: "The System is neutral. The System would like to remind everyone of that." }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "On iki muhafızın hiçbiri kalabalığa bakmıyor. Hepsi elçiye bakıyor; onu korumak için değil, izlemek için.", en: "None of the twelve guards is watching the crowd. They're all watching the envoy. Not to protect him. To keep an eye on him." }
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Derisindeki çentikler gruplar hâlinde: otuz dokuz grup. Her grup bir dünya.", en: "The notches on his skin come in clusters. Thirty-nine clusters. One per world." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu sefer sırtta değil. kapının önünde. lütfen ona adımı söyleme.", en: "not on the ridge this time. at the front door. please don't tell him my name." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Öğretici'deki şey bu, değil mi? Bu sefer kaçacak bir sırt yok.\"", en: "\"That's the thing from the Tutorial, isn't it? No ridge to run to this time.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bütün telsizler aynı anda sustu. Hepsi. Bu fiziksel olarak... tamam, artık fizik diye bir şey yok.\"", en: "\"Every radio just died at the same time. Every one. That's not physically... okay. Physics is over.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yaralıları rıhtımdan geri çekin. Ne olacaksa önce onlara olur.\"", en: "\"Get the wounded off the pier. Whatever happens, it happens to them first.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Seviyesini okuyamıyorum. Sen okuyabiliyor musun? Tabii ki okuyabiliyorsun.\"", en: "\"I can't read his level. Can you? Of course you can.\"" }
        secenekler:
          - id: "on"
            etiket: { tr: "Rıhtımın önüne çık, onu karşıla", en: "Step to the front of the pier. Meet him" }
            etkiler:
              - bolge: "kiyikent_liman"
              - tanis: "thessar"
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { thessar: { saygi: 5 } }
            kronik: { tr: "Elçiyi rıhtımın önünde, dört kampın önünde karşıladın; o günden sonra Kadimler insanlığın kapısını çalarken hep seni aradı.", en: "You met the Envoy at the front of the pier, ahead of all four camps. From then on, whenever the Ancients knocked on humanity's door, they asked for you." }
            sonraki: "thessar_inis_selam"
          - id: "kalabalik"
            tur: "gizle"
            etiket: { tr: "Kalabalığın içinde kal; liderler konuşsun", en: "Stay in the crowd. Let the leaders talk" }
            etkiler:
              - bolge: "kiyikent_liman"
              - tanis: "thessar"
              - gizle: 6
              - ahlak: { duzen: 3 }
            kronik: { tr: "Elçinin inişinde kalabalığa karıştın; o yine de seni buldu ve herkes bunu gördü.", en: "You blended into the crowd when the Envoy came down. He found you anyway, and everybody saw it." }
            sonraki: "thessar_inis_bulundu"
          - id: "saldir"
            etiket: { tr: "Merdiven yere değmeden öncülere saldır", en: "Hit the vanguard before the stairs touch down" }
            etkiler:
              - bolge: "kiyikent_liman"
              - tanis: "thessar"
              - bayrak: "thessar_inis_saldiri"
              - ahlak: { merhamet: -3, duzen: -6, insanlik: 3 }
              - dikkat: 8
              - iliski: { thessar: { saygi: 10, guven: -20, baglilik: -10 } }
              - savas: { dusmanlar: ["kadim_muhafiz@oyuncu+1", "kadim_defter_askeri@oyuncu"], ortam: ["su"], kazan: "thessar_inis_kan", kaybet: "thessar_inis_yenilgi" }
            kronik: { tr: "Elçinin merdiveni yere değmeden kan döktün; Kadimler Dünya'ya ilk adımlarını bir cesedin yanına attı.", en: "You drew blood before the Envoy's stairs touched the ground. The Ancients took their first step on Earth next to a corpse." }
          - id: "goz"
            tur: "gosteris"
            etiket: { tr: "Gerçek seviyeni bir anlığına yalnızca ona göster", en: "Let your real level slip. Just for him" }
            gerekli: { stat: { wil: 150 } }
            etkiler:
              - bolge: "kiyikent_liman"
              - tanis: "thessar"
              - dikkat: 6
              - ahlak: { insanlik: -3, duzen: -2 }
              - iliski: { thessar: { saygi: 15, korku: 5, baglilik: 5 } }
            kronik: { tr: "Elçiye gerçek seviyeni gösterdin ve otuz dokuz dünya görmüş gözler ilk kez kırpıldı.", en: "You showed the Envoy your real level, and eyes that had watched thirty-nine worlds end blinked for the first time." }
            sonraki: "thessar_inis_goz"

      - id: "thessar_inis_selam"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elçi son basamaktan rıhtıma iniyor ve taş, ayağının altında bir kâğıt gibi hafifçe kırışıyor. Liderler öne çıkıyor. O, liderlerin yanından bir müşterinin vitrin önünden geçişi gibi geçiyor.", en: "The Envoy steps off the last stair onto the pier, and the stone crinkles under his foot like paper. The leaders step forward. He walks past them the way a shopper walks past a window display." }
          - metin: { tr: "{npc:kaya_demir} elini silahının kabzasından çekmiyor. Elçi ona bir kez bakıyor, bir sayıyı not eder gibi; sonra bakmayı bırakıyor.", en: "{npc:kaya_demir} keeps his hand on his weapon. The Envoy glances at him once, the way you'd jot down a number, and then stops looking." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:vahit} dizlerinin üstüne çöküyor. \"Sistem'in büyükleri,\" diye fısıldıyor. Elçi ona bakmıyor bile.", en: "{npc:vahit} drops to his knees. \"Elders of the System,\" he whispers. The Envoy doesn't even look at him." }
            kosul: { npc_hayatta: "vahit" }
          - { tr: "Önünde duruyor ve başını tam üç derece eğiyor; ne bir eksik ne bir fazla. İki sesle konuşuyor, ikincisi birincinin yarım nefes gerisinden geliyor: \"Ben {npc:thessar|tam}. Ithren'in Defteri adına buradayım. Sen okunmayansın.\"", en: "He stops in front of you and tips his head exactly three degrees. Not one more, not one less. He speaks in two voices, the second half a breath behind the first: \"I am {npc:thessar|tam}. I am here on behalf of the Ledger of the Ithren. You are the one who does not read.\"" }
          - metin: { tr: "\"Seni bir kez okudum,\" diye ekliyor. \"Yirmi dördüncü gün, bir sırtın üstünden. O gün sayıların bir çocuğunkiydi. Bugün değil.\"", en: "\"I read you once,\" he adds. \"Day twenty-four, from a ridge. That day your numbers were a child's. Not today.\"" }
            kosul: { bayrak: "yeni_tavan_goruldu" }
        secenekler:
          - id: "egil"
            etiket: { tr: "Ondan daha derin eğil", en: "Bow lower than he did" }
            etkiler:
              - bayrak: "thessar_inis_egildi"
              - ahlak: { duzen: 5, insanlik: -3 }
              - itibar: { kadimler: 5, lonca: -3 }
              - iliski: { thessar: { baglilik: 6, saygi: -5 } }
            kronik: { tr: "Dört kampın önünde bir Kadim'e eğildin; {yer:kiyikent} o eğilişi aylarca konuştu, bazıları utançla, bazıları umutla.", en: "You bowed to an Ancient in front of all four camps. {yer:kiyikent} talked about that bow for months, some out of shame, some out of hope." }
            sonraki: "thessar_inis_okuma"
          - id: "egilme"
            etiket: { tr: "Eğilme. Gözlerinin içine bak", en: "Don't bow. Look him in the eye" }
            etkiler:
              - hafiza: { npc: "thessar", id: "bas_egmedi", agirlik: 45 }
              - ahlak: { duzen: -4, insanlik: 3 }
              - dikkat: 3
              - iliski: { thessar: { saygi: 10, guven: -5 } }
            kronik: { tr: "Elçinin önünde başını eğmedin; o bunu Defter'e yazdı ve hiç unutmadı.", en: "You didn't bow to the Envoy. He wrote it in the Ledger, and he never forgot it." }
            sonraki: "thessar_inis_okuma"
          - id: "uc_derece"
            etiket: { tr: "Aynı açıyla, tam üç derece eğil", en: "Tip your head back. Exactly three degrees" }
            gerekli: { stat: { per: 120 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { thessar: { saygi: 15, guven: 5, baglilik: 4 } }
            kronik: { tr: "Elçinin selamını aynı açıyla geri verdin; Kadimler'in protokolünde bu, iki eşitin selamlaşmasıydı.", en: "You returned the Envoy's greeting at the exact same angle. In Ancient protocol, that's how two equals say hello." }
            sonraki: "thessar_inis_okuma"
          - id: "liderler"
            etiket: { tr: "Liderleri göster: \"Onlarla konuş, benimle değil\"", en: "Point at the leaders: \"Talk to them, not me\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { siginak: 3, lonca: 3 }
              - iliski: { thessar: { saygi: -5, guven: 3 } }
            kronik: { tr: "Elçiyi insanlığın liderlerine yönlendirdin; o yine de yalnızca seninle konuştu.", en: "You sent the Envoy to humanity's leaders. He kept talking only to you anyway." }
            sonraki: "thessar_inis_okuma"

      - id: "thessar_inis_bulundu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Liderler öne çıkıyor, sen geri çekiliyorsun. Kalabalık seni bir dalga gibi yutuyor; omuzlar, sırt çantaları, ter ve tuz kokusu.", en: "The leaders step forward. You step back. The crowd swallows you like a wave: shoulders, backpacks, the smell of sweat and salt." }
          - { tr: "Elçi liderlerin önünden geçiyor. Sonra ilk sırayı, ikinciyi, onuncuyu. Kimseye çarpmıyor; insanlar onun önünden, görmeden, sudan çekilir gibi çekiliyor.", en: "The Envoy walks past the leaders. Then the first row, the second, the tenth. He doesn't bump into anyone. People just move out of his way without looking, like water pulling back." }
          - { tr: "Önünde duruyor ve başını tam üç derece eğiyor. \"Kalabalığın içinde saklanmak,\" diyor iki sesiyle. \"Ne sevimli. Ben {npc:thessar|tam}; sen de okunmayansın.\"", en: "He stops in front of you and tips his head exactly three degrees. \"Hiding in a crowd,\" he says in both his voices. \"How charming. I am {npc:thessar|tam}, and you are the one who does not read.\"" }
        secenekler:
          - id: "cik"
            etiket: { tr: "Kalabalıktan çık, onunla yüzleş", en: "Step out of the crowd. Face him" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { thessar: { saygi: 5 } }
            kronik: { tr: "Kalabalıkta saklanmayı bıraktın ve elçinin önüne çıktın; insanlar bir yabancının seni neden aradığını o gün merak etmeye başladı.", en: "You quit hiding in the crowd and stepped up to the Envoy. That was the day people started wondering why an alien was looking for you." }
            sonraki: "thessar_inis_okuma"
          - id: "inkar"
            etiket: { tr: "\"Yanlış kişi\" de, gözünü kaçırma", en: "Say \"Wrong person\" and hold his gaze" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1, merhamet: -1 }
              - yalan: { npc: "thessar", konu: "yanlis_kisi_yalani" }
              - iliski: { thessar: { saygi: -3 } }
            kronik: { tr: "Elçiye yanlış kişi olduğunu söyledin; muhasebeciler yalanı unutmaz.", en: "You told the Envoy he had the wrong person. Accountants don't forget a lie." }
            sonraki: "thessar_inis_okuma"

      - id: "thessar_inis_goz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir anlığına bırakıyorsun. Gerçek sayın penceresinden taşıyor; yanındaki birkaç kişinin bildirimleri cızırdıyor, rıhtımdaki martılar aynı anda havalanıyor.", en: "For one second, you let go. Your real number spills out of its window. The notifications of the people next to you crackle, and every gull on the pier takes off at once." }
          - { tr: "Elçinin gözleri ıslak arduvaz gibi; göz bebeği yok. O gözler bir kez kırpılıyor. Arkasındaki muhafızlardan biri bir adım geri atıyor ve sonra bunu yaptığına utanmış gibi duruyor.", en: "The Envoy's eyes are like wet slate, no pupils at all. Those eyes blink once. One of the guards behind him takes a step back, then freezes like it's ashamed it moved." }
          - { tr: "\"Etkileyici,\" diyor sonunda. \"Ben {npc:thessar|tam}. Raporuma bir insan için bu kelimeyi ilk kez yazacağım.\" Başını eğiyor: üç derece değil, dört.", en: "\"Impressive,\" he says at last. \"I am {npc:thessar|tam}. This will be the first time I have used that word about a human in a report.\" He tips his head. Not three degrees. Four." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[DIŞ OKUMA BAŞARISIZ]", en: "[EXTERNAL READ FAILED]" }
            satirlar:
              - { tr: "Bir Kadim Okuyucu'su seviyeni okumayı denedi. Sonuç: taşma.", en: "An Ancient Reader attempted to read your level. Result: overflow." }
        secenekler:
          - id: "geri_cek"
            etiket: { tr: "Gücünü geri çek, sakin kal", en: "Pull it back in. Stay calm" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { saygi: 4 } }
            kronik: { tr: "Elçiye gücünü gösterip geri çektin; o günden sonra Kadimler seni bir tehdit değil, bir soru olarak gördü.", en: "You showed the Envoy your power and reeled it back in. From then on the Ancients saw you not as a threat, but as a question." }
            sonraki: "thessar_inis_okuma"
          - id: "birak"
            etiket: { tr: "Bir an daha akmasına izin ver", en: "Let it run one more second" }
            etkiler:
              - dikkat: 4
              - ahlak: { insanlik: -3, merhamet: -1 }
              - iliski: { thessar: { korku: 6, saygi: 4 } }
            kronik: { tr: "Gücünü elçinin yüzüne bir an fazla tuttun; rıhtımdaki herkes bunun neye benzediğini gördü.", en: "You held your power in the Envoy's face one second too long. Everyone on the pier saw what that looked like." }
            sonraki: "thessar_inis_okuma"

      - id: "thessar_inis_kan"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Muhafız mühürlü kalkanının üstüne yığılıyor. Kanı siyah, mürekkep gibi; rıhtımın taşlarına değince düzgün satırlar hâlinde akıyor.", en: "The Warden collapses onto its sealed shield. Its blood is black, like ink, and when it hits the stones of the pier it runs in neat, straight lines." }
          - { tr: "Elçi kıpırdamıyor. Zincirli kalemini kaldırıp derisine, bileğinin içine küçük bir çentik atıyor. \"Bir muhafız,\" diyor. \"Kayıt düşüldü. Kan, kanla kapanır; buna kesh deriz. Ama bugün değil. Bugün ben bir elçiyim.\"", en: "The Envoy doesn't move. He lifts his chained stylus and cuts a small notch on the inside of his own wrist. \"One Warden,\" he says. \"Entered. Blood closes with blood. We call that kesh. But not today. Today I am an envoy.\"" }
          - { tr: "Kalabalığın içinden bir ses yükseliyor, sonra bir başkası. Ne olduğunu anlayamıyorsun: tezahürat mı, korku mu.", en: "A voice goes up from the crowd, then another. You can't tell what it is. Cheering, or fear." }
        bildirimler:
          - tur: "unvan"
            nadirlik: "efsanevi"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Bir insan, bir Kadim'i öldürdü.", en: "A human has killed one of the Ancients." }
              - { tr: "Sistem tarafsızdır. Sistem bu satırı iki kez okudu.", en: "The System is neutral. The System read that line twice." }
        secenekler:
          - id: "indir"
            etiket: { tr: "Silahını indir; elçiyle konuş", en: "Lower your weapon. Talk to the Envoy" }
            etkiler:
              - unvan: "ilk_kadim_avcisi"
              - hafiza: { npc: "thessar", id: "elcisini_oldurdu", agirlik: 60 }
              - degisken: { kadim_tehdit: -3 }
              - xp_seviye: 40
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { thessar: { saygi: 6 } }
            kronik: { tr: "İlk Kadim'i öldürdün ve sonra elçiyle konuşmaya oturdun; ne savaş ne barış, ikisinin arasında bir şey başladı.", en: "You killed the first Ancient, then sat down to talk with the Envoy. Neither war nor peace began that day. Something in between did." }
            sonraki: "thessar_inis_okuma"
          - id: "ust"
            tur: "aciga_vur"
            etiket: { tr: "Cesedin üstüne bas; kalabalık görsün", en: "Plant a foot on the body. Let the crowd see" }
            etkiler:
              - unvan: "ilk_kadim_avcisi"
              - hafiza: { npc: "thessar", id: "elcisini_oldurdu", agirlik: 70 }
              - bayrak: "thessar_dusman"
              - aciga_vur: true
              - degisken: { kadim_tehdit: -5 }
              - xp_seviye: 40
              - ahlak: { merhamet: -5, insanlik: -2 }
              - itibar: { lonca: 8, yukselenler: -5, kadimler: -15 }
              - iliski: { thessar: { korku: 8, guven: -10 } }
            kronik: { tr: "Bir Kadim'in cesedinin üstünde durdun ve bütün {yer:kiyikent_liman} seni alkışladı; elçi o gün seni sapma değil, düşman olarak kaydetti.", en: "You stood on an Ancient's corpse while the whole Waterfront cheered. That day the Envoy entered you not as a deviation, but as an enemy." }
            sonraki: "thessar_inis_okuma"

      - id: "thessar_inis_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mühürlü kalkan üstüne bir kapı gibi kapanıyor ve rıhtımın taşı yüzüne geliyor. Kalkmaya çalışıyorsun; dizin bir hüküm dinler gibi taşa çivileniyor.", en: "The sealed shield shuts on you like a door, and the pier comes up to meet your face. You try to get up. Your knee stays nailed to the stone like it's listening to a verdict." }
          - { tr: "Elçi iki parmağını kaldırıyor; muhafızlar duruyor. \"Malın zarar görmesin,\" diyor onlara, sesi sakin. Sonra sana dönüyor: \"Kalk. Seni yere yatırmak için gelmedim. Seni okumak için geldim.\"", en: "The Envoy raises two fingers, and the guards stop. \"Do not damage the stock,\" he tells them, calm. Then he turns to you. \"Get up. I did not come here to put you on the ground. I came here to read you.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Yüzündeki kanı silme", en: "Get up. Leave the blood on your face" }
            etkiler:
              - can: 300
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Elçinin muhafızlarına yenildin ve kanlı yüzünle ayağa kalktın; {yer:kiyikent_liman} bu görüntüyü hiç unutmadı.", en: "The Envoy's guards put you down, and you got back up with blood on your face. The Waterfront never forgot that picture." }
            sonraki: "thessar_inis_okuma"
          - id: "yat"
            etiket: { tr: "Yerde kal. Bırak o gelsin", en: "Stay down. Make him come to you" }
            etkiler:
              - can: 300
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { thessar: { saygi: -4, baglilik: 2 } }
            kronik: { tr: "Elçiyi yerden karşıladın; o eğilip seninle konuştu ve Kadimler'in Dünya'daki ilk konuşması diz çökmüş bir insanla yapıldı.", en: "You met the Envoy from the ground. He crouched down to talk to you, and the Ancients' first conversation on Earth happened with a human on their knees." }
            sonraki: "thessar_inis_okuma"

      - id: "thessar_inis_okuma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elçinin arkasından ince bir figür öne çıkıyor. Yüzü yok, yalnızca dikey bir yarık. Durum pencerenin kenarı griye dönmeye başlıyor; tıpkı Öğretici'deki sırtta olduğu gibi.", en: "A thin figure steps out from behind the Envoy. No face, just a single vertical slit. The edge of your Status window starts to go gray, exactly the way it did on that ridge in the Tutorial." }
          - { tr: "\"Okuyucu,\" diyor {npc:thessar}. \"Buraya bir hasadı hazırlamaya geldim; bu doğru. Ama bir de seni incelemeye geldim. İzin verirsen seni okuyacağım. Vermezsen yine okuyacağım; ama izinli okuma daha temiz olur.\"", en: "\"A Reader,\" {npc:thessar} says. \"I came here to prepare a harvest. That is true. But I also came here to study you. If you allow it, I will read you. If you do not, I will read you anyway. A permitted reading is simply cleaner.\"" }
          - metin: { tr: "Kalabalığın kenarında {npc:mert_kilic} not defterine bir şeyler karalıyor. Elleri titriyor ama yazmayı bırakmıyor.", en: "At the edge of the crowd, {npc:mert_kilic} is scribbling in a notebook. His hands are shaking, but he doesn't stop writing." }
            kosul: { npc_hayatta: "mert_kilic" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hayır hayır hayır. o yarık beni görürse beni de sayar. sayılan şeyler budanır.", en: "no no no. if that slit sees me, it counts me. things that get counted get pruned." }
          - kosul: { stat: { wis: 150 } }
            metin: { tr: "\"İzinli okuma daha temiz\" derken elçinin sesi değişmedi. Bunu bir tehdit olarak söylemiyor; gerçekten temizlik meselesi.", en: "When he said a permitted reading is cleaner, the Envoy's voice didn't change. He doesn't mean it as a threat. It really is about tidiness." }
        secenekler:
          - id: "izin"
            etiket: { tr: "İzin ver; okusun", en: "Let him read you" }
            etkiler:
              - bayrak: "thessar_okuma_izni"
              - yozlasma: 3
              - dikkat: 5
              - ahlak: { insanlik: -4, duzen: 2 }
              - iliski: { thessar: { baglilik: 8, guven: 6 }, yanki: { guven: -8 } }
            kronik: { tr: "Bir Kadim Okuyucu'sunun seni okumasına izin verdin; o gün Defter'de senin adına bir sayfa açıldı.", en: "You let an Ancient Reader read you. That day a page opened in the Ledger with your name on it." }
            sonraki: "thessar_inis_okundu"
          - id: "red"
            etiket: { tr: "Reddet: \"Senin defterine yazılmam\"", en: "Refuse: \"I don't go in your ledger\"" }
            etkiler:
              - bayrak: "thessar_okuma_reddi"
              - ahlak: { insanlik: 4, duzen: -2 }
              - iliski: { thessar: { saygi: 8, baglilik: -4 } }
            kronik: { tr: "Elçinin seni okumasını reddettin; Kadimler Dünya'da ilk kez bir \"hayır\" duydu.", en: "You refused to let the Envoy read you. It was the first time the Ancients heard \"no\" on Earth." }
            sonraki: "thessar_inis_red"
          - id: "sahte"
            etiket: { tr: "{npc:yanki|den} ona sahte bir okuma vermesini iste", en: "Have {npc:yanki} feed him a fake reading" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - yozlasma: 2
              - yalan: { npc: "thessar", konu: "sahte_okuma_yalani" }
              - ahlak: { duzen: -3, insanlik: 1 }
              - iliski: { yanki: { guven: 10, baglilik: 6 }, thessar: { saygi: 2 } }
            kronik: { tr: "Kafandaki bozuk ses bir Kadim'e yalan okuttu; elçinin Defteri'ndeki ilk sayfan bir kurguydu.", en: "The broken voice in your head made an Ancient read a lie. Your first page in the Envoy's Ledger was fiction." }
            sonraki: "thessar_inis_sahte"
          - id: "ters"
            tur: "gosteris"
            etiket: { tr: "Önce sen: Okuyucu'yu sen oku", en: "You first: read the Reader" }
            gerekli: { stat: { per: 160 } }
            etkiler:
              - bilgi: "thessar_gercek_seviye"
              - bilgi: "kadim_ithren"
              - dikkat: 4
              - ahlak: { duzen: -2, insanlik: -1 }
              - iliski: { thessar: { saygi: 12, korku: 6 } }
            kronik: { tr: "Bir Kadim Okuyucu'sunu sen okudun; elçi o gün bir insanın da sayabildiğini öğrendi.", en: "You read an Ancient Reader right back. That day the Envoy learned that a human could count, too." }
            sonraki: "thessar_inis_ters"

      - id: "thessar_inis_okundu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yarık açılıyor. Önce statların griye dönüyor, sonra seviyen, sonra unvanların; bir an pencerende hiçbir şey kalmıyor, sanki biri seni baştan sona bir hesap tablosuna aktarıyor.", en: "The slit opens. First your stats go gray, then your level, then your titles. For a moment there's nothing left in your window, like somebody's copying you line by line into a spreadsheet." }
          - { tr: "Okuyucu bir adım geri çekiliyor ve yarığı titriyor. {npc:thessar} ona bakıyor; Okuyucu tek bir hece fısıldıyor. Elçinin yüzünde ilk kez bir şey kıpırdıyor: merak mı, hesap mı, ikisi aynı şey mi, bilemiyorsun.", en: "The Reader steps back, its slit trembling. {npc:thessar} looks at it, and the Reader whispers a single syllable. For the first time, something moves in the Envoy's face. Curiosity, or arithmetic. You can't tell if those are different things for him." }
          - { tr: "\"Büyüme eğrin üstel,\" diyor sonunda. \"Bin dünyada iki kez gördüm. İkisi de iyi bitmedi; hasat edilenler için değil, hasat edenler için.\"", en: "\"Your growth curve is exponential,\" he says at last. \"I have seen that twice in a thousand worlds. Neither one ended well. Not for the harvested. For the harvesters.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Hangi iki dünya?\" diye sor", en: "Ask \"Which two worlds?\"" }
            etkiler:
              - bilgi: "kadim_ithren"
              - ahlak: { insanlik: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Elçiye seni okuduktan sonra hangi dünyaları hatırladığını sordun; cevabı Kadimler'in kendi adıydı.", en: "After he read you, you asked the Envoy which worlds he was thinking of. The answer was the Ancients' own name." }
            sonraki: "thessar_inis_son"

      - id: "thessar_inis_red"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Okuyucu'nun yarığı yarı açık kalıyor. {npc:thessar} iki parmağını kaldırıyor; yarık kapanıyor.", en: "The Reader's slit stays half open. {npc:thessar} raises two fingers, and the slit closes." }
          - { tr: "\"Hayır,\" diyor elçi, kelimeyi ağzında tartar gibi. \"Bu gezegende ilk kez duyuyorum. Kayda geçiyorum.\" Kalemiyle bileğinin içine küçük bir işaret çiziyor; çentik değil, bir soru işaretine benzeyen bir şey.", en: "\"No,\" the Envoy says, weighing the word in his mouth. \"The first time I have heard it on this planet. Entered.\" He marks the inside of his wrist with the stylus. Not a notch. Something more like a question mark." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Bakışını ondan ayırma", en: "Don't look away from him" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Elçiye hayır dedin ve gözünü ondan ayırmadın; Defter'deki sayfan bir soru işaretiyle açıldı.", en: "You told the Envoy no and didn't look away. Your page in the Ledger opened with a question mark." }
            sonraki: "thessar_inis_son"

      - id: "thessar_inis_sahte"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:yanki} bir şey yapıyor. Pencerendeki sayılar bir an kayıyor, küçülüyor, sıradanlaşıyor; Okuyucu'nun yarığı açılıp o küçük, sıradan seni okuyor.", en: "{npc:yanki} does something. The numbers in your window slide for a second, shrink, go ordinary, and the Reader's slit opens and reads that small, ordinary you." }
          - { tr: "Okuyucu bir hece fısıldıyor. {npc:thessar} başını çok hafif yana eğiyor; bir muhasebecinin toplamı ikinci kez kontrol etmesi gibi. \"İlginç,\" diyor. \"Beklediğimden az.\" Sesinde hayal kırıklığı yok. Bir şey yok.", en: "The Reader whispers a syllable. {npc:thessar} tilts his head, very slightly, the way an accountant checks a total a second time. \"Interesting,\" he says. \"Less than I expected.\" No disappointment in his voice. Nothing at all." }
          - { tr: "Kafanın içinde {npc:yanki}: sayamadığı şeyi silemez. ama muhasebeciler hesabı tutmayan sayfaya geri döner. hep.", en: "Inside your head, {npc:yanki}: what it can't count, it can't delete. but accountants always go back to a page that doesn't balance. always." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yüzünü kıpırdatma", en: "Keep your face still" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -1 }
              - iliski: { thessar: { guven: -2 } }
            kronik: { tr: "Elçinin Okuyucu'su seni küçük ve sıradan okudu; Kadimler aylarca yanlış bir sayıyla hesap yaptı.", en: "The Envoy's Reader read you small and ordinary. The Ancients ran their numbers on the wrong figure for months." }
            sonraki: "thessar_inis_son"

      - id: "thessar_inis_ters"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Okuyucu'nun yarığı açılırken sen de bakıyorsun. Bakış bakışa çarpıyor ve bir an iki pencere aynı anda griye dönüyor: seninki ve onunki.", en: "As the Reader's slit opens, you look back. The two reads collide, and for a second two windows go gray at once. Yours, and its." }
          - { tr: "Onunkinde bir satır var: [Elçi {npc:thessar}: gösterilen Seviye 120. Gerçek: kayıt dışı.] Altında bir kelime daha, kendi dillerinde: Ithren. Pencere sana o kelimenin anlamını veriyor: hâlâ sayanlar.", en: "There's a line in its window: [Envoy {npc:thessar}: displayed Level 120. Actual: off the books.] Under it, one more word in their own language: Ithren. The window gives you the meaning: the ones still counting." }
          - { tr: "Okuyucu yarığını kapatıp geri çekiliyor. {npc:thessar} bir süre sana bakıyor. \"Bizi okudun,\" diyor. \"Defter'in kendi okuyucusunu okuyan bir hasat. Bunun için bir sütunumuz bile yok.\"", en: "The Reader snaps its slit shut and backs off. {npc:thessar} looks at you for a long moment. \"You read us,\" he says. \"A harvest that reads the Ledger's own reader. We do not even have a column for that.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"O zaman bir tane aç\"", en: "\"Then open one\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - iliski: { thessar: { saygi: 4, baglilik: 2 } }
            kronik: { tr: "Kadimler'in Defteri'nde senin için yeni bir sütun açtırdın.", en: "You made the Ancients open a brand-new column in the Ledger, just for you." }
            sonraki: "thessar_inis_son"

      - id: "thessar_inis_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} rıhtımın ortasına dönüp herkese konuşuyor; iki sesi {yer:kiyikent_liman|in} bütün hoparlörlerinden, bütün pencerelerden aynı anda çıkıyor. \"Gün üç yüz altmış beşe kadar elçiliğim açıktır. Ticaret yaparız. Konuşuruz. Hesaplarınızı tutarız.\"", en: "{npc:thessar} turns to face the whole pier, and his two voices come out of every speaker on {yer:kiyikent_liman} and every window at once. \"Until Day three hundred sixty-five, my embassy is open. We will trade. We will talk. We will keep your books for you.\"" }
          - { tr: "\"O gün geldiğinde,\" diye devam ediyor, \"hesap kapanır. Nasıl kapanacağı sizin elinizde. Ve onun.\" Bir an, yalnızca bir an, sana bakıyor.", en: "\"When that day comes,\" he goes on, \"the account closes. How it closes is up to you. And to that one.\" For one second, just one, he looks at you." }
          - metin: { tr: "Dört kampın liderleri birbirine bakıyor. Hiçbiri sana bakmak istemiyor ama hepsi bakıyor.", en: "The leaders of the four camps look at each other. None of them wants to look at you, and all of them do." }
            kosul: { bayrak: "perde2_basladi" }
          - { tr: "Sonra merdiven yeniden ışığa katlanıyor. Kemik rengi kule, körfezin üstünde hâlâ asılı; artık kapısı açık.", en: "Then the stairway folds back up into light. The bone-white tower still hangs over the bay. Only now its door is open." }
        secenekler:
          - id: "kapi_acik"
            etiket: { tr: "Elçiliğin kapısını açık tut; ticarete izin ver", en: "Keep the embassy door open. Allow trade" }
            etkiler:
              - bayrak: "thessar_indi"
              - degisken: { kadim_tehdit: 2 }
              - itibar: { kadimler: 5 }
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { thessar: { baglilik: 3 } }
              - xp_seviye: 30
              - tohum: { olay: "kadimler_1_ticaret", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "thessar" } }
              - tohum: { olay: "thessar_ticaret_masasi", gecikme: { min: 19, max: 28 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadimler'in elçiliğine kapıyı açık bıraktın; {yer:kiyikent_liman|de} ilk sayım çadırları bir hafta sonra kuruldu.", en: "You left the door open to the Ancients' embassy. The first tally tents went up on {yer:kiyikent_liman} a week later." }
            sonraki: "@akis"
          - id: "cizgi"
            etiket: { tr: "Herkesin önünde ona bir sınır çiz", en: "Draw him a line in front of everyone" }
            etkiler:
              - bayrak: "thessar_indi"
              - itibar: { siginak: 4, lonca: 4, kadimler: -3 }
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { thessar: { saygi: 5 } }
              - xp_seviye: 30
              - tohum: { olay: "kadimler_1_ticaret", gecikme: { min: 5, max: 9 }, kosul: { npc_hayatta: "thessar" } }
              - tohum: { olay: "thessar_ticaret_masasi", gecikme: { min: 19, max: 28 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Elçiye rıhtımın taşına bir çizgi çektin ve \"Bunun ötesi insanlarındır\" dedin; o çizgi aylarca kimse silmeden orada kaldı.", en: "You scratched a line into the pier stone and told the Envoy everything past it belonged to people. Nobody scrubbed that line away for months." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Sessizce çekil; ilk hamleyi o yapsın", en: "Back off quietly. Let him make the first move" }
            etkiler:
              - bayrak: "thessar_indi"
              - gizle: 3
              - ahlak: { duzen: -1, merhamet: 1 }
              - iliski: { thessar: { guven: 2 } }
              - xp_seviye: 30
              - tohum: { olay: "kadimler_1_ticaret", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "thessar" } }
              - tohum: { olay: "thessar_ticaret_masasi", gecikme: { min: 19, max: 28 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Elçinin inişinden sonra sessizce çekildin; Kadimler ilk hamleyi yaptı ve sen onu izledin.", en: "After the Envoy came down, you stepped back without a word. The Ancients made the first move, and you watched them make it." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 1: SAYIM ÇADIRI
  - id: "kadimler_1_ticaret"
    perde: [3]
    gun: { min: 184, max: 235 }
    kosul: { bayrak: "thessar_indi" }
    agirlik: 6
    etiketler: ["kadimler", "zincir", "ticaret"]
    gerilim: 3
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Sayım çadırı", en: "The tally tent" }
    sahne: "kadimler_1_ticaret_1"
    sahneler:
      - id: "kadimler_1_ticaret_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} eski balık halinin önüne bir çadır kurulmuş. Bezden değil, gerilmiş soluk bir deriden; güneş içinden geçerken üstündeki ince satırlar görünüyor. Şafaktan beri önünde iki yüz kişilik bir sıra var.", en: "Somebody's pitched a tent in front of the old fish market on {yer:kiyikent_liman}. Not canvas. Pale stretched hide, thin enough that when the sun comes through you can see the fine lines written on it. There's been a line of two hundred people in front of it since dawn." }
          - { tr: "Sırada ateşi düşmeyen çocuklarını kucaklamış anneler, kapı yanığı taşıyan avcılar, kimsenin adını bilmediği yaşlılar var. Çadırın ağzındaki masada bir Kadim oturuyor; her gelene koyu, soğuk bir şurup veriyor ve karşılığında tek bir şey istiyor: adını.", en: "The line is mothers holding kids whose fevers won't break, hunters with gate burns, old folks nobody knows the names of. At a table in the mouth of the tent sits one of the Ancients. It hands each person a dark, cold syrup and asks for exactly one thing in return: their name." }
          - { tr: "Masanın arkasında, kemik rengi bir sandalyede {npc:thessar} oturuyor. Seni görünce kalemiyle sırayı gösteriyor. \"Halkın sana güveniyor,\" diyor. \"Sen sıranın başında durursan sıra uzar.\"", en: "Behind the table, in a bone-white chair, sits {npc:thessar}. When he sees you, he points his stylus at the line. \"Your people trust you,\" he says. \"If you stand at the head of this line, the line gets longer.\"" }
          - metin: { tr: "Sıradakilerin yarısı {yer:kordon|den}. {yer:kordon} düştüğünden beri evleri, ilaçları, hekimleri yok.", en: "Half the people in line are from {yer:kordon}. Ever since {yer:kordon} fell, they don't have homes, or medicine, or doctors." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Şehrin yarısı ya hasta ya yaralı. Sığınak'ın revirinde yatak değil, yer kalmamış.", en: "Half the city's sick or hurt. The Haven clinic isn't out of beds, it's out of floor." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Kadim'in yazdığı her isim, mürekkep kurumadan önce bir an parlıyor; tıpkı bir Durum penceresi gibi.", en: "Every name the Ancient writes glows for a second before the ink dries. Just like a Status window." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "isimleri yazıyor. yazılan isimler artık sahiplerine ait değil. bunu biliyorum çünkü bir zamanlar benim de bir adım vardı.", en: "it's writing down names. once a name's written, it doesn't belong to its owner anymore. i know because i used to have a name too." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O şurubu inceledim. İşe yarıyor. Asıl korkutucu olan da bu.\"", en: "\"I tested that syrup. It works. That's the scary part.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir isim karşılığında ilaç mı? Bunun bir yerinde çengel var.\"", en: "\"Medicine for a name? There's a hook in that somewhere.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bedava olan her şeyin ürünü sensin. Bunu internet öğretti bize. Şey, öğretmişti.\"", en: "\"If it's free, you're the product. The internet taught us that. Well. Used to.\"" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Çadırın önünde dur; sıraya güven ver", en: "Stand by the tent. Let the line see you" }
            etkiler:
              - gorev: { zincir_kadimler: "basla" }
              - bayrak: "kadim_ticaret_acik"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: 3 }
              - ahlak: { duzen: 4, insanlik: -3, merhamet: 2 }
              - itibar: { kadimler: 8, siginak: -2 }
              - iliski: { thessar: { baglilik: 6, guven: 4 } }
              - tohum: { olay: "kadimler_2_vergi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadim sayım çadırının önünde durdun; o gün iki yüz kişi ilacını aldı ve adını Defter'e verdi.", en: "You stood guard at the Ancients' tally tent. Two hundred people got their medicine that day and gave their names to the Ledger." }
            sonraki: "kadimler_1_ticaret_nobet"
          - id: "sart"
            etiket: { tr: "Şartı sen koy: çocuklar yazılmayacak", en: "Set the terms: no kids go in the book" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - gorev: { zincir_kadimler: "basla" }
              - bayrak: "kadim_ticaret_acik"
              - bayrak: "kadim_ticaret_kosullu"
              - degisken: { kadim_tehdit: 3, hayatta_kalan: 2 }
              - ahlak: { merhamet: 5, duzen: 2 }
              - iliski: { thessar: { saygi: 8, baglilik: 4 } }
              - tohum: { olay: "kadimler_2_vergi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'le ilk ticaretin şartını sen koydun; o yıl hiçbir çocuğun adı Defter'e girmedi.", en: "You set the terms of the first trade with the Ancients. That year, not one child's name went into the Ledger." }
            sonraki: "kadimler_1_ticaret_sart"
          - id: "fiyat"
            tur: "gosteris"
            etiket: { tr: "Kimsenin okuyamadığı fiyat etiketini oku", en: "Read the price tag nobody else can" }
            gerekli: { stat: { per: 150 } }
            etkiler:
              - bilgi: "vel_bedeli"
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: 6 } }
            kronik: { tr: "Sayım çadırının gerçek fiyatını okudun; {yer:kiyikent|de} Vel'in neye mal olduğunu bilen ilk insan sendin.", en: "You read the real price at the tally tent. You were the first person in {yer:kiyikent} to know what vel actually cost." }
            sonraki: "kadimler_1_ticaret_fiyat"
          - id: "yik"
            etiket: { tr: "Çadırı yık; kimse kendini satmasın", en: "Tear the tent down. Nobody sells themselves" }
            etkiler:
              - bayrak: "kadim_ticaret_reddedildi"
              - degisken: { kadim_tehdit: -4, hayatta_kalan: -2 }
              - ahlak: { insanlik: 5, duzen: -4, merhamet: -2 }
              - itibar: { kadimler: -10, sessiz_ag: 3 }
              - iliski: { thessar: { saygi: 3, baglilik: -8, guven: -6 } }
              - savas: { dusmanlar: ["kadim_defter_askeri@dunya+20", "kadim_defter_askeri@dunya+20"], kazan: "kadimler_1_ticaret_yikildi", kaybet: "kadimler_1_ticaret_yenilgi" }
            kronik: { tr: "Kadimler'in ilk sayım çadırını yıktın; o gün kimse adını satmadı, bazıları da ilacını alamadı.", en: "You tore down the Ancients' first tally tent. Nobody sold their name that day. Some people didn't get their medicine, either." }

      - id: "kadimler_1_ticaret_fiyat"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Masanın kenarındaki deri parçasına bakıyorsun; satırlar bir an bulanıklaşıyor, sonra pencerende yeniden diziliyor: [Vel: 1 kayıt. Kayıtlı mal, Hasat günü korunur. Kayıtlı mal devredilebilir.]", en: "You look at the strip of hide on the edge of the table. The lines blur for a second, then rearrange themselves in your window: [Vel: 1 entry. Entered stock is protected on Harvest Day. Entered stock is transferable.]" }
          - { tr: "Mal. Sıradakilerin hiçbiri bunu okuyamıyor. Onlar için masadaki yaratık bir hayır kurumu, şurup bir mucize.", en: "Stock. Nobody in that line can read this. To them, the creature at the table is a charity, and the syrup is a miracle." }
          - { tr: "{npc:thessar} senin neye baktığını görüyor ve hiçbir şey saklamıyor. \"Doğru okudun,\" diyor. \"Kaydedilen yaşar. Yaşayan bize aittir. Hangisinin daha kötü olduğuna siz karar verirsiniz.\"", en: "{npc:thessar} sees what you're looking at and doesn't hide a thing. \"You read it correctly,\" he says. \"What is entered, lives. What lives, belongs to us. Which part is worse is for your kind to decide.\"" }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Sıradakilere gerçeği söyle", en: "Tell the line the truth" }
            etkiler:
              - degisken: { hayatta_kalan: -1, kadim_tehdit: -2 }
              - ahlak: { insanlik: 5, duzen: -1 }
              - itibar: { siginak: 4 }
              - iliski: { thessar: { saygi: 5 } }
            kronik: { tr: "Sayım çadırının önünde Vel'in gerçek bedelini yüksek sesle okudun; sıranın yarısı dağıldı, yarısı kaldı.", en: "You read the real price of vel out loud in front of the tally tent. Half the line walked away. Half stayed." }
            sonraki: "kadimler_1_ticaret_anlatildi"
          - id: "sus"
            etiket: { tr: "Sus ve çadırın önünde dur", en: "Keep your mouth shut. Stand by the tent" }
            etkiler:
              - gorev: { zincir_kadimler: "basla" }
              - bayrak: "kadim_ticaret_acik"
              - degisken: { kadim_tehdit: 6, hayatta_kalan: 3 }
              - ahlak: { insanlik: -6, duzen: 3 }
              - itibar: { kadimler: 8 }
              - iliski: { thessar: { baglilik: 8, guven: 4 } }
              - tohum: { olay: "kadimler_2_vergi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Vel'in gerçek bedelini bildin ve sustun; o gün iki yüz kişi neye imza attığını bilmeden kaydoldu.", en: "You knew the real price of vel and kept quiet. Two hundred people signed up that day without knowing what they'd signed." }
            sonraki: "kadimler_1_ticaret_nobet"
          - id: "yik"
            etiket: { tr: "Okuduğunu haykır ve çadırı yık", en: "Shout what you read. Tear the tent down" }
            etkiler:
              - bayrak: "kadim_ticaret_reddedildi"
              - degisken: { kadim_tehdit: -5, hayatta_kalan: -1 }
              - ahlak: { insanlik: 6, duzen: -5 }
              - itibar: { kadimler: -12, siginak: 3, sessiz_ag: 3 }
              - iliski: { thessar: { saygi: 5, baglilik: -8, guven: -6 } }
              - savas: { dusmanlar: ["kadim_defter_askeri@dunya+20", "kadim_defter_askeri@dunya+20"], kazan: "kadimler_1_ticaret_yikildi", kaybet: "kadimler_1_ticaret_yenilgi" }
            kronik: { tr: "Vel'in bedelini herkese okudun ve sayım çadırını yerle bir ettin; {yer:kiyikent_liman|de} o yıl kimse kendini satmadı.", en: "You read everyone the price of vel and leveled the tally tent. Nobody on {yer:kiyikent_liman} sold themselves that year." }

      - id: "kadimler_1_ticaret_anlatildi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sözlerin sıranın üstünden bir rüzgâr gibi geçiyor. Önce birkaç kişi çıkıyor, sonra onlarcası. Bir adam şişesini yere atıp kırıyor; kimse ona bir şey demiyor.", en: "Your words roll down the line like wind. A few people step out first, then dozens. One man throws his bottle on the ground and smashes it. Nobody says anything to him." }
          - { tr: "Ama bir kadın kalıyor. Kucağındaki kız çocuğu nefes almakta zorlanıyor. \"Kızım yarın ölecek,\" diyor sana, sakin. \"Adım onların olsun. Kızım benim kalsın.\"", en: "But one woman stays. The little girl in her arms is struggling to breathe. \"My daughter dies tomorrow,\" she tells you, calm. \"Let them have my name. My daughter stays mine.\"" }
          - { tr: "{npc:thessar} başını üç derece eğiyor. \"Gördün mü? Sizi hiç zorlamadık. Zorlamaya hiç gerek olmadı.\"", en: "{npc:thessar} tips his head three degrees. \"You see? We never forced you. We never needed to.\"" }
        secenekler:
          - id: "koru"
            etiket: { tr: "Kalanların sırasını koru", en: "Guard the ones who stayed" }
            etkiler:
              - gorev: { zincir_kadimler: "basla" }
              - bayrak: "kadim_ticaret_acik"
              - bayrak: "kadim_ticaret_kosullu"
              - degisken: { kadim_tehdit: 4, hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, duzen: 2 }
              - iliski: { thessar: { baglilik: 5, saygi: 3 } }
              - tohum: { olay: "kadimler_2_vergi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Gerçeği söyledin ve sonra kalanların sırasını korudun; Defter'e yazılan her isim neye yazıldığını bilerek yazıldı.", en: "You told the truth, then guarded the people who stayed anyway. Every name that went into the Ledger went in with its eyes open." }
            sonraki: "@akis"
          - id: "kes"
            etiket: { tr: "Çadırın ipini kes; bugün kimse yazılmayacak", en: "Cut the tent rope. Nobody gets written today" }
            etkiler:
              - bayrak: "kadim_ticaret_reddedildi"
              - degisken: { kadim_tehdit: -3, hayatta_kalan: -2 }
              - ahlak: { merhamet: -3, insanlik: 4 }
              - iliski: { thessar: { baglilik: -6, saygi: 4 } }
            kronik: { tr: "Kızını kurtarmak için adını vermek isteyen bir annenin önünde çadırın ipini kestin; ertesi sabah o çocuk yaşıyor muydu, hiç öğrenmedin.", en: "You cut the tent rope in front of a mother who wanted to trade her name for her daughter. You never found out if that kid was alive the next morning." }
            sonraki: "@akis"

      - id: "kadimler_1_ticaret_nobet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sıranın başında duruyorsun ve sıra, söylediği gibi, uzuyor. İnsanlar seni görünce rahatlıyor; seni görünce adlarını daha kolay veriyorlar.", en: "You stand at the head of the line, and the line, just like he said, gets longer. People relax when they see you. When they see you, they give up their names more easily." }
          - { tr: "Çocuklar şurubu içiyor ve ateşleri dakikalar içinde düşüyor. Masadaki Kadim her ismi yazıyor; her isim bir an parlıyor, sonra sönüyor.", en: "The kids drink the syrup, and their fevers break within minutes. The Ancient at the table writes down every name. Each one glows for a second, then goes out." }
          - { tr: "Akşam {npc:thessar} yanına geliyor. \"İnsanlar yazılmaktan korkar,\" diyor, \"ta ki yazılmayanların öldüğünü görene kadar.\" Elinde iki şişe var. \"Elçilikten. Hediye değil; yalnızca hesaba yazılmıyor.\"", en: "That evening {npc:thessar} comes to stand beside you. \"People are afraid of being written down,\" he says, \"until they see what happens to the ones who are not.\" He's holding two bottles. \"From the embassy. Not a gift. It simply does not go on the bill.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Şişeleri al", en: "Take the bottles" }
            etkiler:
              - esya: { vel_damlasi: 2 }
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Elçinin hesaba yazmadığı iki şişeyi aldın; Kadimler'le ilk kişisel alışverişin buydu.", en: "You took the two bottles the Envoy left off the bill. That was your first personal deal with the Ancients." }
            sonraki: "@akis"
          - id: "ver"
            etiket: { tr: "Şişeleri sıranın sonundaki çocuklara ver", en: "Give the bottles to the kids at the back" }
            etkiler:
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 3 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Elçinin hediyesini sıranın sonundaki iki çocuğa verdin; ikisinin de adı Defter'e girmedi.", en: "You gave the Envoy's gift to the two kids at the back of the line. Neither of their names ever went into the Ledger." }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} yazılan isimlerin nereye gittiğini sor", en: "Ask {npc:yanki} where the names go" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 5, baglilik: 3 } }
            kronik: { tr: "Kafandaki sese Defter'e yazılan isimlerin nereye gittiğini sordun; cevabı seni o gece uyutmadı.", en: "You asked the voice in your head where the names in the Ledger go. Its answer kept you up all night." }
            sonraki: "kadimler_1_ticaret_yanki"

      - id: "kadimler_1_ticaret_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Sonra pencerenin kenarında, bozuk harflerle: bir yere gitmiyorlar. yerinde kalıyorlar. sadece artık kendilerine ait değiller.", en: "{npc:yanki} is quiet for a long time. Then, at the edge of your window, in broken letters: they don't go anywhere. they stay right where they are. they just don't belong to themselves anymore." }
          - { tr: "Bir satır daha, daha küçük: ben de bir defterdeydim bir zamanlar. çıkmak çok uzun sürdü.", en: "One more line, smaller: i was in a ledger once. getting out took a very long time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Artık buradasın\" de", en: "Say \"You're here now\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
            kronik: { tr: "Kafandaki sese artık bir defterde olmadığını söyledin; bir süre pencerelerin hiç bozulmadı.", en: "You told the voice in your head it wasn't in a ledger anymore. For a while after that, your windows didn't glitch once." }
            sonraki: "@akis"

      - id: "kadimler_1_ticaret_sart"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Masadaki Kadim kalemini kaldırıp donuyor. {npc:thessar} seni süzüyor; bir muhasebecinin bütçede olmayan bir kalemi incelemesi gibi.", en: "The Ancient at the table lifts its pen and freezes. {npc:thessar} studies you the way an accountant studies a line item nobody budgeted for." }
          - { tr: "\"Kabul,\" diyor sonunda. \"On altı yaşından küçükler yazılmaz; şurubu yine alırlar. Bu bir indirim değil. Yatırım. Çocuklar büyür.\"", en: "\"Agreed,\" he says at last. \"No one under sixteen is entered. They still get the syrup. This is not a discount. It is an investment. Children grow.\"" }
          - { tr: "Söylediğinin ne kadar soğuk olduğunun farkında değil gibi. Ya da farkında ve umursamıyor; Kadimler'de ikisi aynı şey olabilir.", en: "He doesn't seem to notice how cold that sounds. Or he notices and doesn't care. With the Ancients, those might be the same thing." }
        secenekler:
          - id: "el"
            etiket: { tr: "Anlaşmayı sıkışmak için elini uzat", en: "Hold out your hand to seal it" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { thessar: { saygi: 3, baglilik: 3 } }
            kronik: { tr: "Bir Kadim'e el sıkışmak için elini uzattın; o elini bir müze parçası gibi inceledi ve sonra, garip bir özenle, sıktı.", en: "You held out your hand to an Ancient. He studied it like a museum piece, then, with strange care, shook it." }
            sonraki: "kadimler_1_ticaret_el"
          - id: "git"
            etiket: { tr: "Başınla onayla ve git", en: "Nod and walk away" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Kadimler'le ilk şartını koydun ve arkana bakmadan gittin.", en: "You laid down your first terms with the Ancients and walked off without looking back." }
            sonraki: "@akis"

      - id: "kadimler_1_ticaret_el"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Elini saran uzun, fazla eklemli parmaklar soğuk; kâğıt gibi kuru. {npc:thessar} elini bir an fazla tutuyor, sanki bir şeyi ölçüyor.", en: "The long, too-many-jointed fingers around your hand are cold, and dry as paper. {npc:thessar} holds on one beat too long, like he's measuring something." }
          - { tr: "\"Sizin türünüz anlaşmaları elle kapatır,\" diyor. \"Bizimki kanla. Sizinki daha az lekeli. Daha az da bağlayıcı.\" Bıraktığında avucunda ince bir çentik var; acımıyor.", en: "\"Your kind closes deals with a hand,\" he says. \"Mine closes them in blood. Yours is less messy. Less binding, too.\" When he lets go, there's a thin notch in your palm. It doesn't hurt." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Avucundaki çentiğe bak ve sus", en: "Look at the notch in your palm. Say nothing" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Elçinin el sıkışmasından avucunda bir çentik kaldı; Kadimler'in seni kendi usulleriyle kaydettiği ilk gündü.", en: "The Envoy's handshake left a notch in your palm. It was the first time the Ancients entered you their own way." }
            sonraki: "@akis"

      - id: "kadimler_1_ticaret_yikildi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Son Defter Askeri yaprak yaprak dağılarak yere düşüyor. Çadırın derisi yırtılmış; şişeler taşların üstünde kırık, koyu şurup çatlaklardan denize akıyor.", en: "The last Ledger Soldier comes apart page by page as it falls. The tent hide is torn open. Bottles lie smashed on the stones, and the dark syrup runs through the cracks into the sea." }
          - { tr: "Sıra dağılmış. Bir anne kırık bir şişenin dibinde kalan birkaç damlayı parmağıyla toplayıp çocuğunun dudağına sürüyor.", en: "The line's scattered. A mother scrapes the last few drops out of the bottom of a broken bottle with her finger and wipes them on her kid's lips." }
          - { tr: "{npc:thessar} kemik sandalyesinden kalkmadı bile. \"Bugün otuz bir kişi ölecek,\" diyor. \"Kesin sayıyı yarın söylerim. Hesabı sana yazıyorum.\"", en: "{npc:thessar} never even got up from his bone chair. \"Thirty-one people will die today,\" he says. \"I will have the exact count tomorrow. I am putting it on your account.\"" }
        secenekler:
          - id: "topla"
            etiket: { tr: "Kırık şişelerden kalanları topla", en: "Gather what's left in the broken bottles" }
            etkiler:
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { merhamet: 3 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Yıktığın çadırın kırık şişelerinden kalanları tek tek topladın; birkaç çocuk yine de o geceyi atlattı.", en: "You picked through the broken bottles from the tent you'd wrecked. A few kids made it through the night anyway." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Elçiye arkanı dön", en: "Turn your back on the Envoy" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -1 }
              - iliski: { thessar: { saygi: -3, guven: -3 } }
            kronik: { tr: "Elçiye ve onun otuz bir ölüsüne arkanı döndün; o hesabı yine de senin adına tuttu.", en: "You turned your back on the Envoy and his thirty-one dead. He kept that account in your name anyway." }
            sonraki: "@akis"

      - id: "kadimler_1_ticaret_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kâğıt inceliğindeki kılıçlar seni çadırın direğine çiviliyor. Masadaki Kadim bir an bile yazmayı bırakmadı; sıra bir adım bile kıpırdamadı.", en: "Paper-thin blades pin you to the tent pole. The Ancient at the table never stopped writing, not for a second, and the line never moved an inch." }
          - { tr: "{npc:thessar} yanına eğiliyor. \"Mal kendini satmak istiyor,\" diyor. \"Sen kimsin ki engelleyesin? Kalk. Yarın da burada olacağız.\"", en: "{npc:thessar} leans down beside you. \"The stock wants to sell itself,\" he says. \"Who are you to stop it? Get up. We will be here tomorrow, too.\"" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve sıranın yanından geç", en: "Get up and walk past the line" }
            etkiler:
              - can: 400
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Sayım çadırını yıkamadın; sıradakiler seni yerde gördü ve yine de adlarını verdi.", en: "You couldn't bring down the tally tent. The people in line saw you on the ground and gave up their names anyway." }
            sonraki: "@akis"

  # ================================================================== THESSAR: TİCARET MASASI
  - id: "thessar_ticaret_masasi"
    perde: [3]
    gun: { min: 198, max: 255 }
    kosul: { bayrak: "thessar_indi" }
    agirlik: 5
    etiketler: ["kadimler", "thessar", "ticaret", "elcilik"]
    gerilim: 2
    npc: ["thessar"]
    kart: { tr: "Onuncu Sabır'da bir masa", en: "A table aboard the Tenth Patience" }
    sahne: "thessar_ticaret_masasi_1"
    sahneler:
      - id: "thessar_ticaret_masasi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah kapının altından bir yaprak kaymış: cilalı, soğuk, tek bir satırla. Pencerene düşen çeviri kısa: [Davet. Öğle. Yalnız.] Öğlen körfezin üstündeki kulenin ucundan katlanmış ışıktan merdiven iniyor; yalnızca senin için.", en: "Somebody slid a leaf under your door this morning: lacquered, cold, one line of script. The translation that drops into your window is short: [Invitation. Noon. Alone.] At noon the stair of folded light comes down from the tip of the tower over the bay. Just for you." }
          - { tr: "Geminin içi bir kütüphane gibi; raflar yukarıya, gözün seçemeyeceği kadar yukarıya uzanıyor ve her rafta ciltler var. Kadimler gemilerine Onuncu Sabır diyor; içindeki her şey sabırla sayılmış.", en: "The inside of the ship is like a library. Shelves run up and up, farther than your eyes can follow, and every shelf is full of bound volumes. The Ancients call the ship the Tenth Patience, and everything in it has been patiently counted." }
          - { tr: "Ortada siyah taştan bir masa var. Üstünde otuz dokuz dünyadan birer parça: bir kavanozda hâlâ dalgalanan bir deniz, artık var olmayan bir ormanın tohumları, kırık bir taç. {npc:thessar} karşına oturuyor. \"Bu bir ticaret masasıdır,\" diyor. \"Ticarette iki taraf da bir şey verir. Ben bir saat istiyorum. Seni okuyacağım bir saat.\"", en: "In the middle is a table of black stone. On it sits one piece from each of thirty-nine worlds: a sea in a jar that's still making waves, seeds from a forest that doesn't exist anymore, a broken crown. {npc:thessar} sits down across from you. \"This is a trading table,\" he says. \"In a trade, both sides give something. I want one hour. One hour in which I read you.\"" }
          - metin: { tr: "\"İlk okumam eksikti,\" diye ekliyor. \"Okuyucum bir şeyi sayamadı. Eksik bir hesabı sevmem.\"", en: "\"My first reading was incomplete,\" he adds. \"My Reader could not count something. I do not like an incomplete account.\"" }
            kosul: { bayrak: "thessar_okuma_izni" }
          - metin: { tr: "\"İlk okumam tutmadı,\" diyor, sesinde hiçbir şey yok. \"Okuyucum küçük bir sayı getirdi. Sonra sen küçük bir sayının yapamayacağı şeyler yaptın.\"", en: "\"My first reading did not balance,\" he says, with nothing at all in his voice. \"My Reader brought me back a small number. Then you did things a small number cannot do.\"" }
            kosul: { hafiza: { thessar: "yalan:sahte_okuma_yalani" } }
          - metin: { tr: "Masanın kenarında kırık bir mühür duruyor: {yer:kiyikent_liman|de} öldürdüğün muhafızın kalkan mührü. {npc:thessar} onu kaldırmamış.", en: "On the edge of the table sits a broken seal: the shield seal off the Warden you killed on {yer:kiyikent_liman}. {npc:thessar} never put it away." }
            kosul: { bayrak: "thessar_inis_saldiri" }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Kırık tacın iç yüzünde küçük bir çentik var. Elçinin bileğindeki çentiklerle aynı el.", en: "There's a small notch inside the broken crown. Same hand as the notches on the Envoy's wrist." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o kavanozdaki deniz hâlâ dalgalanıyor çünkü kimse ona bittiğini söylemedi. bana da kimse söylemedi.", en: "the sea in that jar is still making waves because nobody told it it was over. nobody told me either." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Seni okumak istiyor. Beni değil. Bunu kafama yazıyorum, haberin olsun.\"", en: "\"He wants to read you. Not me. I'm writing that down, just so you know.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir saat. Bir saatte bir sistemin bütün loglarını kopyalarsın. Yapma. Ya da yap ama bana anlat.\"", en: "\"One hour. You can copy a whole system's logs in an hour. Don't. Or do, but tell me everything.\"" }
        secenekler:
          - id: "okut"
            etiket: { tr: "Bir saatini sat; okusun", en: "Sell him the hour. Let him read" }
            etkiler:
              - bayrak: "ticaret_masasi_okundu"
              - yozlasma: 4
              - dikkat: 4
              - degisken: { kadim_tehdit: 4 }
              - ahlak: { insanlik: -4, duzen: 2 }
              - itibar: { kadimler: 6 }
              - iliski: { thessar: { baglilik: 10, guven: 6 }, yanki: { guven: -5 } }
            sonraki: "thessar_ticaret_masasi_okuma"
          - id: "mal"
            etiket: { tr: "Okuma yok; Kule ganimetiyle takas et", en: "No reading. Trade him Spire loot instead" }
            etkiler:
              - esya: { vel_damlasi: 3, sayim_murekkebi: 2 }
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { baglilik: 4 } }
            sonraki: "thessar_ticaret_masasi_mal"
          - id: "gercek"
            tur: "gosteris"
            etiket: { tr: "Mal değil, gerçek iste: sizin Gün 365'iniz", en: "Ask for truth, not goods: your own Day 365" }
            gerekli: { stat: { cha: 200 } }
            etkiler:
              - bilgi: "kadim_imzasi"
              - unvan: "defter_tanigi"
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 10, guven: 4 } }
            sonraki: "thessar_ticaret_masasi_gercek"
          - id: "sirt"
            etiket: { tr: "Öğretici'deki sırtı sor: o sen miydin?", en: "Ask about the ridge in the Tutorial. Was that you?" }
            goster: { bayrak: "yeni_tavan_goruldu" }
            etkiler:
              - hafiza: { npc: "thessar", id: "olay:thessar_ticaret_masasi", agirlik: 40 }
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { guven: 5 } }
            sonraki: "thessar_ticaret_masasi_sirt"
          - id: "kalk"
            etiket: { tr: "Masadan kalk; hiçbir şeyini almayacaksın", en: "Get up from the table. You'll take nothing" }
            etkiler:
              - bayrak: "ticaret_masasi_reddedildi"
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { thessar: { saygi: 4, baglilik: -6 } }
            sonraki: "thessar_ticaret_masasi_kalk"

      - id: "thessar_ticaret_masasi_sirt"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} kavanozdaki denize bakıyor. \"Okuyucu değildi,\" diyor. \"Bendim. Yirmi dördüncü gün o sırtta duran bendim; geyik benim önümde eğildi.\"", en: "{npc:thessar} looks at the sea in the jar. \"It was not a Reader,\" he says. \"It was me. On day twenty-four, the one standing on that ridge was me. The stag bowed to me.\"" }
          - { tr: "\"Otuz dokuz dünya bana verildi,\" diye devam ediyor. \"Bu dünyayı ben istedim. Bir sırtın üstünde, sayıları bir çocuğunki gibi olan bir hasada bakarken. Neden istediğimi hâlâ hesaplıyorum.\"", en: "\"Thirty-nine worlds were assigned to me,\" he goes on. \"This one, I requested. While standing on a ridge, looking at a harvest whose numbers were a child's. I am still working out why I requested it.\"" }
        secenekler:
          - id: "okut"
            etiket: { tr: "\"O zaman oku. Hesabını bitir\"", en: "\"Then read. Finish your math\"" }
            etkiler:
              - bayrak: "ticaret_masasi_okundu"
              - yozlasma: 4
              - dikkat: 4
              - degisken: { kadim_tehdit: 4 }
              - ahlak: { insanlik: -4, duzen: 2 }
              - itibar: { kadimler: 6 }
              - iliski: { thessar: { baglilik: 12, guven: 6 }, yanki: { guven: -5 } }
            sonraki: "thessar_ticaret_masasi_okuma"
          - id: "mal"
            etiket: { tr: "\"Ben bir merak konusu değilim.\" Takasa geç", en: "\"I'm not a curiosity.\" Move on to trading" }
            etkiler:
              - esya: { vel_damlasi: 3, sayim_murekkebi: 2 }
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: 3 } }
            sonraki: "thessar_ticaret_masasi_mal"

      - id: "thessar_ticaret_masasi_okuma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Seni geminin derinliklerine, bir kuyunun dibine benzeyen yuvarlak bir odaya götürüyorlar. Duvarlar baştan sona okuyucularla dolu; yarıklar birer birer açılıyor ve pencerendeki her satır, tek tek, griye dönüyor.", en: "They take you deep into the ship, to a round room like the bottom of a well. The walls are lined with Readers. The slits open one by one, and every line in your window goes gray, one at a time." }
          - { tr: "Bir saat uzun bir süre. {npc:thessar} her sayfayı izliyor. Kırk dakika sonra bir el kaldırıp okumayı durduruyor; yarıklar donuyor.", en: "An hour is a long time. {npc:thessar} watches every page. Forty minutes in, he raises a hand and stops the reading. The slits freeze." }
          - { tr: "\"Senin içinde ikinci bir el yazısı var,\" diyor yavaşça. \"Seninkinden eski. Bizimkinden eski olabilir.\"", en: "\"There is a second handwriting inside you,\" he says slowly. \"Older than yours. Possibly older than ours.\"" }
          - metin: { tr: "Pencerenin kenarında {npc:yanki} titriyor: hayır. bana bakmasın. son bakan budadı.", en: "At the edge of your window, {npc:yanki} is shaking: no. don't let it look at me. the last one that looked, pruned." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "baksin"
            etiket: { tr: "Bırak baksın; ne bulduğunu öğren", en: "Let him look. Find out what he found" }
            etkiler:
              - bilgi: "defterdeki_ilk_anomali"
              - yozlasma: 3
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { thessar: { baglilik: 6, guven: 5 }, yanki: { guven: -10, korku: 6 } }
            sonraki: "thessar_ticaret_masasi_ilk_sayfa"
          - id: "kapat"
            etiket: { tr: "Okumayı kapat; o el yazısı senin", en: "Shut the reading down. That handwriting is yours" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 6 }, yanki: { guven: 8, baglilik: 6 } }
            sonraki: "thessar_ticaret_masasi_davet"

      - id: "thessar_ticaret_masasi_ilk_sayfa"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} raflardan birinin en altına uzanıp tek bir cildi çıkarıyor. Kapağı taş gibi; açtığında sayfa sararmış, kırılgan. \"Defter'in ilk sayfası,\" diyor. \"Kopyası. Asıl sayfayı yalnızca Meclis görür.\"", en: "{npc:thessar} reaches to the bottom of one of the shelves and pulls out a single volume. The cover is like stone. When he opens it, the page is yellowed and brittle. \"The first page of the Ledger,\" he says. \"A copy. Only the Conclave sees the original.\"" }
          - { tr: "En üstte bir ad var: Ithren. Hemen altında bir satır daha; okumaya çalıştığında harfler kayıyor, yerinde durmuyor. Tıpkı senin pencerendeki bozuk satırlar gibi.", en: "At the very top there's a name: Ithren. Right under it, one more line. When you try to read it, the letters slide and won't hold still. Just like the broken lines in your own window." }
          - { tr: "\"Bizim de bir sapmamız vardı,\" diyor {npc:thessar}. \"Okunmayan, sayılmayan bir şey. Onu budadık. Sonra imzaladık. Sonra on bin yıl başkalarının dünyalarını saydık. Bazı geceler merak ediyorum: budamasaydık ne olurdu?\"", en: "\"We had a deviation, too,\" {npc:thessar} says. \"Something that would not read, would not count. We pruned it. Then we signed. Then we spent ten thousand years counting other people's worlds. Some nights I wonder what would have happened if we had not pruned it.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sayfayı kapat; ona geri ver", en: "Close the page. Hand it back to him" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { guven: 4, baglilik: 3 } }
            sonraki: "thessar_ticaret_masasi_davet"
          - id: "sor"
            etiket: { tr: "\"Bunu bana neden gösteriyorsun?\" diye sor", en: "Ask \"Why are you showing me this?\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { thessar: { guven: 6 } }
            sonraki: "thessar_ticaret_masasi_neden"

      - id: "thessar_ticaret_masasi_neden"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} uzun süre cevap vermiyor. Raflardaki ciltlerin arasında bir yerde bir sayfa kendi kendine çevriliyor.", en: "{npc:thessar} doesn't answer for a long time. Somewhere in the shelves, a page turns by itself." }
          - { tr: "\"Çünkü muhasebeci olmak,\" diyor sonunda, \"bir hesabın nasıl kapanacağını önceden bilmek demektir. Bu hesabın nasıl kapanacağını bilmiyorum. On bin yıldır ilk kez.\" Sesinin ikinci katmanı bu kez birincinin gerisinde kalmıyor; ikisi aynı anda konuşuyor.", en: "\"Because being an accountant,\" he says at last, \"means knowing in advance how an account will close. I do not know how this one closes. For the first time in ten thousand years.\" This time the second layer of his voice doesn't trail behind. Both of them speak at once." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sessizce başını salla", en: "Nod. Say nothing" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - iliski: { thessar: { baglilik: 4 } }
            sonraki: "thessar_ticaret_masasi_davet"

      - id: "thessar_ticaret_masasi_mal"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kule'den getirdiklerini masaya diziyorsun: çekirdekler, kemikler, bir kat bekçisinin kırık maskesi. {npc:thessar} her birini kalemiyle bir kez dürtüp tartıyor; bir kuyumcu gibi değil, bir hurdacı gibi.", en: "You lay out what you brought down from the Spire: cores, bones, a floor guardian's broken mask. {npc:thessar} pokes each one once with his stylus and weighs it. Not like a jeweler. Like a scrap dealer." }
          - { tr: "Karşılığında şişeler ve koyu mavi bir mürekkep veriyor. \"Adil,\" diyor. \"Adil ticaretten hoşlanmam; kimse bir şey öğrenmez. Ama kayda geçiyorum.\"", en: "In exchange he hands over bottles and a dark blue ink. \"Fair,\" he says. \"I do not care for fair trades. Nobody learns anything. But it is entered.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Takası kapat", en: "Close the deal" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 2 } }
            sonraki: "thessar_ticaret_masasi_davet"

      - id: "thessar_ticaret_masasi_gercek"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} seni bir süre okumadan izliyor; okumadan izlemek onun için zor bir şey gibi. \"Mal değil gerçek isteyen bir hasat,\" diyor. \"Pekâlâ. Bu masanın adı ticaret.\"", en: "{npc:thessar} watches you for a while without reading you. For him that seems to take effort. \"A harvest that asks for truth instead of goods,\" he says. \"Very well. This is a trading table.\"" }
          - { tr: "\"Bize de üç yüz altmış beş gün verildi. Bizim de bir Sistem'imiz, bir Kule'miz, fraksiyonlarımız, kahramanlarımız vardı. Son gün geldiğinde masaya bizden yaşlı bir şey oturdu ve iki seçenek sundu: hasat edilmek ya da hasat etmek.\"", en: "\"We were given three hundred sixty-five days, too. We had a System, a Spire, factions, heroes. When the last day came, something older than us sat down at the table and offered two choices: be harvested, or harvest.\"" }
          - { tr: "\"İmzaladık,\" diyor, sesi düz. \"Sizin tarihiniz bunun adını boyunduruk koyar. Bizimki hayatta kalış der. Benim kollarımda otuz dokuz dünya var. Hiçbirinin adı benimki kadar eski değil.\"", en: "\"We signed,\" he says, flat. \"Your history would call that a yoke. Ours calls it survival. There are thirty-nine worlds on my arms. Not one of their names is as old as mine.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Bu masada başka seçenek yok muydu?\" diye sor", en: "Ask \"Was there no other choice at that table?\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { guven: 4, baglilik: 3 } }
            sonraki: "thessar_ticaret_masasi_davet"

      - id: "thessar_ticaret_masasi_kalk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ayağa kalkıyorsun. {npc:thessar} seni durdurmuyor; yalnızca kalemiyle masanın kenarına küçük bir işaret çiziyor.", en: "You stand up. {npc:thessar} doesn't try to stop you. He just draws a small mark on the edge of the table with his stylus." }
          - { tr: "Merdivenden inerken arkandan bir yaprak süzülüp elinin üstüne konuyor: siyah, yedi çentikli. Pencerene düşen çeviri: [Yedi Taht'a davet. Reddedilebilir. Reddedilmesi de kaydedilir.]", en: "As you head down the stair, a leaf drifts after you and settles on the back of your hand: black, with seven notches. The translation that drops into your window: [Invitation to the Sevenfold Court. May be declined. Declining will also be entered.]" }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Yaprağı cebine koy", en: "Pocket the leaf" }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { guven: 2 } }
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 20, max: 32 }, kosul: { npc_hayatta: "thessar" } }
            sonraki: "@akis"
          - id: "yak"
            etiket: { tr: "Yaprağı rüzgâra bırak", en: "Let the wind take the leaf" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: 2, baglilik: -2 } }
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 20, max: 32 }, kosul: { npc_hayatta: "thessar" } }
            sonraki: "@akis"

      - id: "thessar_ticaret_masasi_davet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} masanın üstüne siyah bir yaprak bırakıyor; kenarında yedi çentik var. \"Meclis seni görmek isteyecek,\" diyor. \"Yedi Taht. Bir sapmayı görmek isterler; budamadan önce, genellikle.\"", en: "{npc:thessar} lays a black leaf on the table. There are seven notches along its edge. \"The Conclave will want to see you,\" he says. \"The Sevenfold Court. They like to see a deviation. Before they prune it, usually.\"" }
          - { tr: "\"Kule'nin ellinci katının ardındaki kapı açıldığında,\" diye ekliyor, \"bu yaprak sana yolu gösterir. Benimle gelirsen konuk olarak girersin. Yalnız gelirsen mal olarak.\"", en: "\"When the door behind the Spire's fiftieth floor opens,\" he adds, \"this leaf will show you the way. If you come with me, you enter as a guest. If you come alone, you enter as stock.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Daveti kabul et", en: "Accept the invitation" }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { thessar: { baglilik: 5 } }
              - xp_seviye: 25
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 20, max: 32 }, kosul: { npc_hayatta: "thessar" } }
            sonraki: "@akis"
          - id: "thael"
            tur: "gosteris"
            etiket: { tr: "Davet değil, konuk hakkı iste", en: "Don't take an invitation. Demand guest-right" }
            gerekli: { stat: { cha: 240 }, iliski_min: { thessar: { baglilik: 15 } } }
            etkiler:
              - bayrak: "yedi_taht_davet"
              - bilgi: "thael_kelimesi"
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { thessar: { saygi: 10, baglilik: 6 } }
              - xp_seviye: 35
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 20, max: 32 }, kosul: { npc_hayatta: "thessar" } }
            sonraki: "thessar_ticaret_masasi_thael"
          - id: "red"
            etiket: { tr: "Daveti masada bırak", en: "Leave the invitation on the table" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 3, baglilik: -3 } }
              - xp_seviye: 25
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 20, max: 32 }, kosul: { npc_hayatta: "thessar" } }
            sonraki: "@akis"

      - id: "thessar_ticaret_masasi_thael"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Raflardaki okuyucuların yarıkları aynı anda sana dönüyor. {npc:thessar} kalemini masaya bırakıyor; ilk kez elinde bir şey tutmuyor.", en: "Every Reader's slit on the shelves turns toward you at once. {npc:thessar} sets his stylus down on the table. For the first time, his hands are empty." }
          - { tr: "\"Thael,\" diyor, kelimeyi ağzında bir sikke gibi çevirerek. \"Konuk hakkı. Bin yılda üç kez söylendi. Bir Ithren onu söylerse, söylediği kişiyi hasat etmek ödenemeyecek bir borca dönüşür.\" Bir süre susuyor. \"Henüz söylemiyorum. Ama sorduğun kaydedildi. Kimse sormamıştı.\"", en: "\"Thael,\" he says, turning the word over in his mouth like a coin. \"Guest-right. Spoken three times in a thousand years. If an Ithren says it, harvesting the one it is said to becomes a debt that can never be paid.\" He's quiet a moment. \"I do not say it yet. But that you asked is entered. No one has ever asked.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yaprağı al ve merdivene yürü", en: "Take the leaf. Walk to the stair" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { guven: 3 } }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 2: VEL VERGİSİ
  - id: "kadimler_2_vergi"
    perde: [3]
    gun: { min: 212, max: 278 }
    kosul: { bayrak: "kadim_ticaret_acik", gorev: { zincir_kadimler: "basla" } }
    agirlik: 6
    etiketler: ["kadimler", "zincir", "vergi"]
    gerilim: 3
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Mevsim payı", en: "The season's share" }
    sahne: "kadimler_2_vergi_1"
    sahneler:
      - id: "kadimler_2_vergi_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bir sabah {yer:kiyikent|in} bütün kapılarına aynı yaprak çakılmış: cilalı, soğuk, tek satırlık. Herkesin penceresine düşen çeviri aynı: [Mevsim payı. On günlük Öz Kristali üretimi ya da her yüz kayıtlıdan biri. Teslim: yedi gün.]", en: "One morning the same leaf is nailed to every door in {yer:kiyikent}: lacquered, cold, one line long. The translation that drops into everybody's window is identical: [The season's share. Ten days' Essence Crystal output, or one of every hundred entered. Due in seven days.]" }
          - { tr: "{yer:eski_sehir|de}ki belediye binasının yarısı çökmüş meclis salonunda liderler toplanmış. Hepsi aynı anda konuşuyor; sen içeri girince susuyorlar. Kadimler'in kapısını açan sendin, kapıyı kapatmanın yolunu da senden bekliyorlar.", en: "The leaders have packed into the half-collapsed council chamber of {yer:eski_sehir|pos} city hall. They're all talking at once, and when you walk in, they stop. You're the one who opened the door to the Ancients. They're waiting for you to tell them how to shut it." }
          - metin: { tr: "{npc:elif_sari} masaya avucuyla vuruyor: \"Kimseyi vermeyiz. Yüzde bir bir sayı değil; bir isim listesi.\"", en: "{npc:elif_sari} slaps the table with her palm. \"We hand over nobody. One percent isn't a number. It's a list of names.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:kaya_demir} kollarını kavuşturmuş. \"Kristalleri veririz. On gün açlık çekeriz. Sonra o gemiyi indirmenin yolunu buluruz.\"", en: "{npc:kaya_demir} has his arms crossed. \"We give them the crystals. We go hungry for ten days. Then we figure out how to bring that ship down.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Kayıtlıların listesinde hiç çocuk yok. Çadırda koyduğun şart tutulmuş; yüzde bir, yalnızca yetişkinlerden.", en: "There isn't a single kid on the list of the entered. The terms you set at the tent held. One percent means adults only." }
            kosul: { bayrak: "kadim_ticaret_kosullu" }
          - { tr: "Kapı açılıyor. {npc:thessar} içeri giriyor; arkasında bir Okuyucu. Kimseyi selamlamıyor; doğrudan sana bakıyor. \"Pay tartışılmaz,\" diyor. \"Yalnızca nasıl ödeneceği tartışılır.\"", en: "The door opens. {npc:thessar} walks in with a Reader behind him. He doesn't greet anybody. He looks straight at you. \"The share is not up for discussion,\" he says. \"Only the manner of payment is.\"" }
        sezgiler:
          - kosul: { stat: { int: 200 } }
            metin: { tr: "On günlük kristal üretimi, kışın şehrin ısısının üçte biri demek. Yüzde bir, aşağı yukarı dört yüz kişi.", en: "Ten days of crystal output is a third of the city's winter heat. One percent is roughly four hundred people." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "okuyucu masadaki herkesi okuyor ama en çok seni. sende bir pay daha var, değil mi? onu da biliyor.", en: "the reader's reading everybody at the table, but mostly you. there's another way to pay sitting right inside you, isn't there? it knows that too." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"İnsan verirsen bir daha yüzüme bakma.\"", en: "\"Hand over people and don't ever look me in the face again.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kimseyi verme, hiçbir şey verme. Gelsinler de alsınlar. Ne olacağını görürler.\"", en: "\"Don't give them anyone. Don't give them anything. Let them come take it. They'll see what happens.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir yolu vardır. Senin her zaman bir yolun vardır. Bu sefer de olsun.\"", en: "\"There's a way. You always have a way. Have one this time.\"" }
        secenekler:
          - id: "kristal"
            etiket: { tr: "Kristalle öde; şehrin on günü gitsin", en: "Pay in crystals. The city loses ten days" }
            etkiler:
              - bayrak: "kadim_vergi_odendi"
              - degisken: { kadim_tehdit: 8, hayatta_kalan: -2 }
              - ahlak: { duzen: 5, merhamet: -2 }
              - itibar: { kadimler: 6, lonca: -4 }
              - iliski: { thessar: { baglilik: 6, guven: 4 } }
              - tohum: { olay: "kadimler_3_muhbir", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'in ilk mevsim payını kristalle ödedin; {yer:kiyikent} o kış soğuktan titredi ama kimseyi vermedi.", en: "You paid the Ancients' first season share in crystals. {yer:kiyikent} shivered all winter, but nobody got handed over." }
            sonraki: "kadimler_2_vergi_kristal"
          - id: "kendin"
            etiket: { tr: "Payı kendinle öde: Okuyucu seni üç gün okusun", en: "Pay with yourself. Let the Reader have three days" }
            etkiler:
              - bayrak: "kadim_vergi_odendi"
              - bayrak: "kadim_vergi_kendisi"
              - yozlasma: 6
              - dikkat: 6
              - degisken: { kadim_tehdit: 6, hayatta_kalan: 1 }
              - ahlak: { merhamet: 6, insanlik: -5 }
              - itibar: { siginak: 6, kadimler: 6 }
              - iliski: { thessar: { baglilik: 10, saygi: 6 }, yanki: { guven: -6 } }
              - tohum: { olay: "kadimler_3_muhbir", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Şehrin payını kendinle ödedin; üç gün boyunca bir Kadim Okuyucu'su seni okudu ve {yer:kiyikent|den} tek bir kristal, tek bir insan gitmedi.", en: "You paid the city's share with yourself. For three days an Ancient Reader read you, and {yer:kiyikent} didn't lose a single crystal or a single person." }
            sonraki: "kadimler_2_vergi_kendin"
          - id: "liste"
            etiket: { tr: "Kayıtlılardan yüzde birini ver", en: "Hand over one percent of the entered" }
            etkiler:
              - bayrak: "kadim_vergi_odendi"
              - bayrak: "kadim_vergi_listesi"
              - degisken: { kadim_tehdit: 10, hayatta_kalan: -4 }
              - ahlak: { merhamet: -10, duzen: 6, insanlik: -6 }
              - itibar: { yukselenler: 6, siginak: -12, kadimler: 10 }
              - iliski: { thessar: { baglilik: 8 }, elif_sari: { guven: -25, saygi: -10 } }
              - tohum: { olay: "kadimler_3_muhbir", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'e kayıtlıların yüzde birini verdin; dört yüz insan katlanmış ışıktan bir merdivenden yukarı çıktı ve bir daha inmedi.", en: "You gave the Ancients one percent of the entered. Four hundred people climbed a stairway of folded light and never came back down." }
            sonraki: "kadimler_2_vergi_liste"
          - id: "sahte"
            etiket: { tr: "Sahte kristallerle öde; gözünün içine bakarak", en: "Pay with fake crystals. Look him in the eye" }
            gerekli: { stat: { int: 200 } }
            etkiler:
              - bayrak: "kadim_vergi_odendi"
              - bayrak: "kadim_vergi_sahte"
              - yalan: { npc: "thessar", konu: "vergi_yalani" }
              - degisken: { kadim_tehdit: 2 }
              - ahlak: { duzen: -5, merhamet: 3 }
              - itibar: { sessiz_ag: 6 }
              - iliski: { thessar: { guven: 2 } }
              - tohum: { olay: "kadimler_3_muhbir", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'e içi boş camdan kristallerle vergi ödedin; bir muhasebeci ırkına ilk sahte faturayı sen kestin.", en: "You paid the Ancients' tax with hollow glass. You were the first to stiff a whole species of accountants." }
            sonraki: "kadimler_2_vergi_sahte"
          - id: "yari"
            tur: "gosteris"
            etiket: { tr: "Payı yarıya indir; bir de teşekkür ettir", en: "Cut the share in half. Make him thank you" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - bayrak: "kadim_vergi_odendi"
              - dikkat: 4
              - degisken: { kadim_tehdit: 5, hayatta_kalan: -1 }
              - ahlak: { duzen: 3, insanlik: -1 }
              - itibar: { lonca: 4, siginak: 4 }
              - iliski: { thessar: { saygi: 10, baglilik: 4 } }
              - tohum: { olay: "kadimler_3_muhbir", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'in vergisini masada yarıya indirdin ve elçi sana teşekkür etti; meclis salonundaki herkes bunu gördü.", en: "You cut the Ancients' tax in half at the table, and the Envoy thanked you for it. Everyone in that council chamber saw it." }
            sonraki: "kadimler_2_vergi_yari"
          - id: "red"
            etiket: { tr: "Ödemeyi reddet; gelsinler, alsınlar", en: "Refuse to pay. Let them come take it" }
            etkiler:
              - bayrak: "kadim_vergi_reddedildi"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -4 }
              - ahlak: { insanlik: 6, duzen: -6 }
              - itibar: { siginak: 6, lonca: 4, kadimler: -15 }
              - iliski: { thessar: { baglilik: -10, saygi: 4 } }
            kronik: { tr: "Kadimler'in mevsim payını reddettin; o gece {yer:eski_sehir|e} tazılar indi ve sabah elçiliğin kapısı sana kapalıydı.", en: "You refused the Ancients' season share. That night hounds came down into {yer:eski_sehir}, and by morning the embassy's door was closed to you." }
            sonraki: "kadimler_2_vergi_red"

      - id: "kadimler_2_vergi_kristal"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kristaller yedi gün boyunca toplanıyor: santrallerden, revirlerden, kapı avcılarının ceplerinden. Sonunda {yer:kiyikent_liman|de} bir yığın oluyor; mavi, sıcak, şehrin on günlük nefesi.", en: "For seven days the crystals get collected: from the generators, the clinics, the pockets of gate hunters. In the end they make a pile on {yer:kiyikent_liman}. Blue, warm, ten days of the city's breath." }
          - { tr: "Okuyucu yığını bir kez okuyor ve yarığını kapatıyor. {npc:thessar} başını üç derece eğiyor. \"Hesap kapanır,\" diyor. \"Bu mevsimlik.\"", en: "The Reader reads the pile once and closes its slit. {npc:thessar} tips his head three degrees. \"The account closes,\" he says. \"For this season.\"" }
          - { tr: "O gece {yer:eski_sehir|de} ışıklar erken sönüyor. İnsanlar battaniyelere sarılıp kapılarındaki yaprağa bakıyor: hâlâ orada, bir sonraki mevsimi bekliyor.", en: "That night the lights in {yer:eski_sehir} go out early. People wrap themselves in blankets and stare at the leaf on their doors. It's still there. Waiting on next season." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yaprakları kapılardan söktür", en: "Have the leaves pulled off the doors" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: -2 } }
            kronik: { tr: "Pay ödendikten sonra Kadim yapraklarını kapılardan söktürdün; insanlar en azından onlara bakmak zorunda kalmadı.", en: "Once the share was paid, you had the Ancient leaves pulled off every door. At least people didn't have to look at them." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Yaprakları bırak; herkes hatırlasın", en: "Leave the leaves up. Let everyone remember" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Kadim yapraklarını kapılarda bıraktın; {yer:kiyikent} her sabah kime borçlu olduğunu okuyarak uyandı.", en: "You left the Ancient leaves up on the doors. {yer:kiyikent} woke every morning reading who it owed." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_kendin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Üç gün boyunca geminin kuyu biçimli odasında oturuyorsun. Okuyucular nöbetleşe geliyor; her biri seni baştan sona okuyup gidiyor. Yemek yok, uyku yok; yalnızca griye dönen satırlar.", en: "For three days you sit in the well-shaped room inside the ship. The Readers come in shifts. Each one reads you from top to bottom and leaves. No food, no sleep. Just lines going gray." }
          - { tr: "Üçüncü günün sonunda {npc:thessar} yanına oturuyor. Okuyucuların topladıkları ciltler masanın üstünde yığılı: bir şehrin on günlük kristalinden daha ağır.", en: "At the end of the third day, {npc:thessar} sits down next to you. The volumes the Readers filled are stacked on the table, heavier than ten days of a whole city's crystals." }
          - { tr: "\"Bir şehrin payını tek bir gövdeyle ödedin,\" diyor. \"Meclis bunu nasıl kaydedeceğini bilmeyecek. Ben de bilmiyorum.\" Durum pencerende bir satır, kimsenin yazmadığı bir satır: [Değer: tahmin edilemiyor.]", en: "\"You paid a city's share with a single body,\" he says. \"The Conclave will not know how to enter that. Neither do I.\" A line shows up in your Status window that nobody wrote: [Value: cannot be estimated.]" }
          - metin: { tr: "{npc:yanki} üç gün boyunca hiç konuşmadı. Şimdi, çok kısık: beni de okudular mı? söyle. okudular mı?", en: "{npc:yanki} hasn't said a word in three days. Now, very faint: did they read me too? tell me. did they?" }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} \"Hayır, seni sakladım\" de", en: "Tell {npc:yanki} \"No. I hid you\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            kronik: { tr: "Kadimler seni üç gün okurken kafandaki sesi sakladın; o bunu hiç unutmadı.", en: "While the Ancients read you for three days, you kept the voice in your head hidden. It never forgot that." }
            sonraki: "@akis"
          - id: "devam"
            etiket: { tr: "Kalk; sendeleyerek merdivene yürü", en: "Get up. Stagger to the stair" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Kadim gemisinden üç günlük okumanın ardından sendeleyerek indin; {yer:kiyikent_liman|de} seni bekleyenler alkışlamadı, yalnızca sarıldılar.", en: "You staggered down off the Ancient ship after three days of reading. The people waiting on {yer:kiyikent_liman} didn't clap. They just hugged you." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_liste"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Liste yedi günde hazırlanıyor. Kimin hazırladığını kimse söylemiyor; ama herkes senin onayladığını biliyor.", en: "The list takes seven days to put together. Nobody will say who put it together. But everybody knows you signed off on it." }
          - metin: { tr: "{npc:vahit} listeye kendi Yükselenler'inden bir sütun ekliyor: \"Yakıt,\" diyor, gülümseyerek. \"Sistem'e yakın olmak bir şereftir.\"", en: "{npc:vahit} adds a column from his own Ascended to the list. \"Fuel,\" he says, smiling. \"To be near the System is an honor.\"" }
            kosul: { npc_hayatta: "vahit" }
          - { tr: "Yedinci gün dört yüz kişi {yer:kiyikent_liman|de} sıraya giriyor. Bazıları ağlıyor, bazıları sessiz, birkaçı neredeyse rahatlamış görünüyor. Katlanmış ışıktan merdiven iniyor ve onları birer birer yukarı alıyor.", en: "On the seventh day, four hundred people line up on {yer:kiyikent_liman}. Some are crying, some are quiet, a few look almost relieved. The stair of folded light comes down and takes them up, one at a time." }
          - { tr: "Sonuncusu genç bir adam; merdivenin başında dönüp sana bakıyor. Bir şey söylemiyor. Bakışı yeterli.", en: "The last one's a young guy. At the top of the stair he turns and looks at you. He doesn't say anything. The look is enough." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Bakışına karşılık ver", en: "Hold his gaze" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Kadimler'e verdiğin dört yüz kişinin sonuncusunun bakışına karşılık verdin; o yüzü hiç unutmadın.", en: "You held the gaze of the last of the four hundred you gave the Ancients. You never forgot that face." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Arkanı dön; iş bitti", en: "Turn around. It's done" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - iliski: { thessar: { baglilik: 3 } }
            kronik: { tr: "Kadimler'e verdiğin dört yüz kişinin sonuncusu merdivene çıkarken arkanı döndün.", en: "You turned your back while the last of the four hundred you gave the Ancients climbed the stair." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_sahte"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kristallerin yarısı içi boş cam; Sessiz Ağ'ın atölyesinde üç gecede üflendi, dışları gerçek kristal tozuyla kaplandı. Yığın {yer:kiyikent_liman|de} parlıyor, gerçeğinden ayırt edilemiyor.", en: "Half the crystals are hollow glass, blown over three nights in a Quiet Network workshop and dusted with real crystal powder. The pile glitters on {yer:kiyikent_liman}. You can't tell it from the real thing." }
          - { tr: "Okuyucu yığını okuyor; yarığı bir an duraksıyor. {npc:thessar} sana bakıyor. \"Hepsi gerçek mi?\" diye soruyor, sesi düz.", en: "The Reader reads the pile, and its slit hesitates for a second. {npc:thessar} looks at you. \"Are they all real?\" he asks, flat." }
          - { tr: "\"Hepsi,\" diyorsun. Gözlerinin içine bakarak. O bir süre bakıyor; sonra başını üç derece eğiyor. \"Hesap kapanır,\" diyor. Ama kalemiyle bileğine çentik atmıyor.", en: "\"All of them,\" you say, looking him straight in the eye. He looks back a while. Then he tips his head three degrees. \"The account closes,\" he says. But he doesn't cut a notch into his wrist." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yüzünü kıpırdatmadan uzaklaş", en: "Walk away without twitching a muscle" }
            etkiler:
              - unvan: "cift_defter"
              - ahlak: { duzen: -1 }
              - iliski: { thessar: { guven: -2 } }
            kronik: { tr: "Bir Kadim'in gözünün içine bakıp yalan söyledin; o hesabı kapattı ama bileğine çentik atmadı.", en: "You looked an Ancient in the eye and lied. He closed the account, but he didn't cut a notch into his wrist." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_yari"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Masaya eğiliyorsun. Söylediğin şey uzun değil: şehrin taşıyabileceği payı, taşıyamayacağı payı ve Kadimler'in ikisinin farkından ne kazanacağını sayıyorsun. Okuyucu her cümlenden sonra yarığını biraz daha açıyor.", en: "You lean over the table. What you say isn't long. You lay out the share the city can carry, the share it can't, and exactly what the Ancients gain from the difference. After every sentence, the Reader opens its slit a little wider." }
          - { tr: "{npc:thessar} bir süre hesaplıyor. Sonra, meclis salonundaki herkesin önünde: \"Haklısın. Yarısı. Ve teşekkür ederim; bir hasattan muhasebe dersi almak bin yılda bir olur.\"", en: "{npc:thessar} runs the math for a while. Then, in front of the whole chamber: \"You are right. Half. And thank you. A lesson in accounting from a harvest happens once in a thousand years.\"" }
          - metin: { tr: "{npc:kaya_demir} ıslık çalıyor, alçaktan. {npc:elif_sari} ilk kez gülümsüyor; yorgun ama gerçek.", en: "{npc:kaya_demir} lets out a low whistle. {npc:elif_sari} smiles for the first time. Tired, but real." }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Teşekkürünü kabul et", en: "Accept his thanks" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { baglilik: 3 } }
            kronik: { tr: "Bir Kadim elçisinden muhasebe dersi için teşekkür aldın; {yer:kiyikent} o kışı yarı payla atlattı.", en: "You got thanked by an Ancient envoy for an accounting lesson. {yer:kiyikent} made it through that winter on half the share." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_red"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{npc:thessar} reddini dinliyor ve hiçbir şey söylemiyor. Okuyucusuyla birlikte çıkıyor; kapı arkasından kendi kendine kapanıyor.", en: "{npc:thessar} hears your refusal and says nothing. He leaves with his Reader, and the door swings shut behind them on its own." }
          - { tr: "Gece yarısı {yer:eski_sehir|in} dar sokaklarında uluma başlıyor; bir sayı gibi, ritmik. Sayım Tazıları kapılardaki yapraklara bakıp kayıtlıların evlerini buluyor.", en: "At midnight, howling starts up in the narrow streets of {yer:eski_sehir}. Rhythmic, like counting. The Tally Hounds are reading the leaves on the doors and finding the houses of the entered." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sokağa in; tazıları karşıla", en: "Get down to the street. Meet the hounds" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - savas: { dusmanlar: ["kadim_sayim_tazisi@dunya+30", "kadim_sayim_tazisi@dunya+30", "kadim_sayim_tazisi@dunya+30"], ortam: ["dar_gecit", "karanlik"], kazan: "kadimler_2_vergi_tazi_zafer", kaybet: "kadimler_2_vergi_tazi_yenilgi" }
            kronik: { tr: "Vergiyi reddettiğin gece {yer:eski_sehir|in} sokaklarında Kadim tazılarını karşıladın.", en: "The night you refused the tax, you met the Ancients' hounds in the streets of {yer:eski_sehir}." }
          - id: "ses"
            tur: "gosteris"
            etiket: { tr: "Bütün şehri uyandıracak kadar yüksek bir ses çıkar", en: "Make a noise loud enough to wake the city" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - dikkat: 5
              - degisken: { kadim_tehdit: -2, hayatta_kalan: 1 }
              - ahlak: { merhamet: 3, duzen: -2 }
              - iliski: { thessar: { saygi: 6 } }
            kronik: { tr: "Kadim tazılarının sayımını tek bir haykırışla bozdun; o gece hiçbir kapı açılmadı.", en: "You wrecked the Ancient hounds' count with a single shout. Not one door opened that night." }
            sonraki: "kadimler_2_vergi_tazi_zafer"

      - id: "kadimler_2_vergi_tazi_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sabah sokakta tazılardan geriye yalnızca uzun bacaklar ve çentikli deriler kalıyor. Kapılar birer birer aralanıyor; insanlar çıkıp yaprakları kendi elleriyle söküyor.", en: "By morning, all that's left of the hounds in the street is long legs and notched hides. Doors creak open one at a time, and people come out and tear the leaves down with their own hands." }
          - { tr: "Körfezin üstündeki kule kıpırdamıyor. Ama elçiliğin kapısından inen katlanmış ışık o gün hiç inmiyor.", en: "The tower over the bay doesn't move. But that day, the folded light never comes down from the embassy door." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Söktükleri yaprakları bir ateşte yaktır", en: "Have the torn-down leaves burned" }
            etkiler:
              - degisken: { kadim_tehdit: -2, hayatta_kalan: 1 }
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { siginak: 4 }
              - iliski: { thessar: { saygi: 3, guven: -4 } }
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 10, max: 20 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadim yapraklarını {yer:eski_sehir|in} ortasında bir ateşte yaktırdın; o ateşin dumanı körfezin üstündeki gemiye kadar yükseldi.", en: "You had the Ancient leaves burned in a bonfire in the middle of {yer:eski_sehir}. The smoke rose all the way to the ship over the bay." }
            sonraki: "@akis"

      - id: "kadimler_2_vergi_tazi_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Tazılar seni bir kaldırıma yapıştırıp bırakıyor; öldürmüyorlar, sayıyorlar. Gece boyunca kapılar açılıyor ve kayıtlılar sokağa çekiliyor.", en: "The hounds pin you to a curb and leave you there. They don't kill you. They count you. All night, doors open, and the entered get dragged into the street." }
          - { tr: "Sabah {npc:thessar|in} sesi bütün pencerelerden aynı anda geliyor: \"Pay alındı. Ödenmeyen pay, kendi kendini öder.\"", en: "In the morning, {npc:thessar|pos} voice comes out of every window at once: \"The share has been collected. A share left unpaid pays itself.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalk ve kaybolanları say", en: "Get up and count who's missing" }
            etkiler:
              - can: 400
              - degisken: { hayatta_kalan: -3 }
              - ahlak: { insanlik: 3 }
              - iliski: { thessar: { saygi: -2 } }
              - tohum: { olay: "thessar_vassal_teklifi", gecikme: { min: 10, max: 20 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Vergiyi reddettiğin gece Kadim tazıları kayıtlıları kendi kendilerine topladı; sabah kaybolanları tek tek saydın.", en: "The night you refused the tax, the Ancient hounds collected the entered on their own. In the morning, you counted the missing one by one." }
            sonraki: "@akis"

  # ================================================================== THESSAR: BOYUNDURUK TEKLİFİ
  - id: "thessar_vassal_teklifi"
    perde: [3]
    gun: { min: 226, max: 290 }
    kosul: { bayrak: "thessar_indi" }
    agirlik: 5
    etiketler: ["kadimler", "thessar", "antlasma", "elcilik"]
    gerilim: 4
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Boyunduruk teklifi", en: "The vassal offer" }
    sahne: "thessar_vassal_teklifi_1"
    sahneler:
      - id: "thessar_vassal_teklifi_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Gün batarken {yer:kordon|in} kırık iskelesinde dört kamp yine yan yana duruyor. Bu kez silahlar kalkık değil; herkes elçinin elindeki şeye bakıyor. Kâğıt değil, ince ve soluk bir deri; iki ucu rüzgârda kıpırdamıyor.", en: "At sundown, the four camps stand side by side again on {yer:kordon|pos} broken pier. This time the weapons are down. Everybody's looking at what the Envoy is holding. Not paper. A thin, pale hide. The wind can't make either end of it move." }
          - { tr: "{npc:thessar} okumaya başlıyor; iki sesi iskelenin tahtalarında yankılanıyor. \"Birinci madde: Dünya hasat edilmez. Ithren Defteri'ne bir Katman olarak yazılır ve yaşar. İkinci madde: her mevsim vel ödenir; kristal olarak ve örnek olarak.\"", en: "{npc:thessar} begins to read, his two voices echoing off the boards of the pier. \"Article one: Earth is not harvested. It is entered in the Ledger of the Ithren as a Layer, and it lives. Article two: each season, vel is paid. In crystals, and in samples.\"" }
          - { tr: "\"Üçüncü madde: hiçbir insan B kademesini geçmez; tek bir istisna dışında. Dördüncü madde: o istisna imzacıdır. İmzacı Defter Bekçisi olur ve Dünya'yı Ithren adına yönetir.\" Başını kaldırıyor ve rıhtımdaki yüzlerce kişinin arasından yalnızca birine bakıyor.", en: "\"Article three: no human advances past Grade B, with a single exception. Article four: that exception is the signatory. The signatory becomes Keeper of the Ledger and governs Earth on behalf of the Ithren.\" He looks up, and out of the hundreds on the pier, he looks at exactly one person." }
          - metin: { tr: "{npc:kaya_demir} yere tükürüyor. \"Kafesi altınla süsleyince kafes olmaktan çıkmaz.\"", en: "{npc:kaya_demir} spits on the boards. \"Gild a cage all you want. It's still a cage.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:elif_sari|in} sesi titremiyor: \"Örnek dediğin kaç kişi? Bir sayı söyle.\"", en: "{npc:elif_sari|pos} voice doesn't shake. \"How many is a sample? Give me a number.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:vahit} ellerini göğe kaldırmış. \"Bu bir lütuf! Sistem'in büyükleri bize bir sıra veriyor!\"", en: "{npc:vahit} has his hands raised to the sky. \"This is grace! The elders of the System are giving us a place in line!\"" }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:mert_kilic} kalabalığın en arkasında; gözlerini hiç kaldırmıyor.", en: "{npc:mert_kilic} hangs at the very back of the crowd. He never once looks up." }
            kosul: { bayrak: "mert_kadimlere_satti" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Derinin alt kenarında iki imza boşluğu var. Biri senin için. Öbürünün altında küçük harflerle bir ad yazılı ve henüz kurumamış: elçinin kendi adı.", en: "There are two signature lines at the bottom of that hide. One is for you. Under the other, in small letters, there's a name, and the ink isn't dry yet. The Envoy's own." }
          - kosul: { bayrak: "gercek_hasat" }
            metin: { tr: "Sistem bir hasat aracıysa, bu antlaşma hasattan kaçış değil; hasatçının çiftliğine kayıt.", en: "If the System is a harvesting tool, this treaty isn't an escape from the harvest. It's registration on the harvester's farm." }
          - kosul: { bayrak: "gercek_kurtarma" }
            metin: { tr: "Sistem bir kurtarma protokolüyse, Kadimler neden Gün 365'ten önce gelip kurtarılacak olanı satın almak istiyor?", en: "If the System is a rescue protocol, why are the Ancients showing up before Day 365 trying to buy what's about to be rescued?" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "imzacı. bekçi. bu kelimeleri daha önce duydum. imzalayanların hepsi sonunda imzalandı.", en: "signatory. keeper. i've heard those words before. everyone who signed ended up signed for." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes B'de kalacak, sen hariç. Sana teklif ettiği şey bir taç. Bize ettiği şey bir tavan.\"", en: "\"Everybody stays at B except you. What he's offering you is a crown. What he's offering us is a ceiling.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Hasat yok demek, ölüm yok demek değil. Bunu ikimiz de biliyoruz.\"", en: "\"No harvest doesn't mean no dying. We both know that.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"B kademesi mi? Benim için mi? İmzalarsan seni ben öldürürüm, haberin olsun.\"", en: "\"Grade B? For me? Sign that and I'll kill you myself. Just so you know.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Sözünü kesmeden sonuna kadar dinle", en: "Hear him out to the end. Don't interrupt" }
            etkiler:
              - hafiza: { npc: "thessar", id: "teklifi_dinledi", agirlik: 50 }
              - ahlak: { duzen: 3 }
              - iliski: { thessar: { baglilik: 6, saygi: 4 } }
            kronik: { tr: "Kadimler'in boyunduruk teklifini sözünü kesmeden sonuna kadar dinledin; elçi bunu Defter'e bir erdem olarak yazdı.", en: "You heard the Ancients' vassal offer all the way through without interrupting. The Envoy entered that in the Ledger as a virtue." }
            sonraki: "thessar_vassal_teklifi_itiraf"
          - id: "kes"
            etiket: { tr: "Sözünü kes; deriyi elinden al", en: "Cut him off. Take the hide out of his hands" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 4 }
              - dikkat: 3
              - iliski: { thessar: { saygi: -6, guven: -6 } }
            kronik: { tr: "Elçinin sözünü kesip antlaşmayı elinden aldın; Kadimler bir anlaşmanın ortasında ilk kez bölündü.", en: "You cut the Envoy off and took the treaty out of his hands. It was the first time the Ancients ever got interrupted in the middle of a deal." }
            sonraki: "thessar_vassal_teklifi_kes"
          - id: "liderler"
            etiket: { tr: "Önce liderlere sor; sonra o konuşsun", en: "Ask the leaders first. Then he talks" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { siginak: 3, lonca: 3 }
              - iliski: { thessar: { saygi: -3 } }
            kronik: { tr: "Boyunduruk teklifinden önce insanlığın liderlerine söz verdin; elçi beklemeyi bilmediği kadar uzun bekledi.", en: "Before answering the vassal offer, you gave humanity's leaders the floor. The Envoy waited longer than he knew how to." }
            sonraki: "thessar_vassal_teklifi_liderler"
          - id: "madde"
            tur: "gosteris"
            etiket: { tr: "Bir maddeyi değiştirt: \"örnek\" silinsin", en: "Get an article changed. Strike \"samples\"" }
            gerekli: { stat: { wil: 250 } }
            etkiler:
              - bayrak: "vassal_ornek_silindi"   # QA P1-6: Vassal sonu bu maddeyi hatırlar
              - dikkat: 4
              - ahlak: { merhamet: 5, duzen: 2 }
              - iliski: { thessar: { saygi: 12, baglilik: 4 } }
            kronik: { tr: "Kadimler'in antlaşmasından \"örnek\" kelimesini elçinin kendi kalemiyle sildirdin; o satırın yerinde bir çentik kaldı.", en: "You made the Envoy strike the word \"samples\" from the Ancients' treaty with his own stylus. All that's left on that line is a notch." }
            sonraki: "thessar_vassal_teklifi_madde"

      - id: "thessar_vassal_teklifi_kes"
        yer: "kordon"
        paragraflar:
          - { tr: "Deri avucunda soğuk ve beklediğinden ağır. Okumaya çalışıyorsun; satırlar senin için sırayla İngilizce, Türkçe, sonra tanımadığın dillerde diziliyor. Her dilde aynı şey yazıyor.", en: "The hide is cold in your hands and heavier than you expected. You try to read it. The lines line up for you in English, then Turkish, then in languages you don't know. Every language says the same thing." }
          - { tr: "{npc:thessar} geri almaya çalışmıyor. \"Oku,\" diyor. \"Daha hızlı olur. Benim türüm bölünmeye alışkın değil; ama senin türün dinlemeye hiç alışkın değil.\"", en: "{npc:thessar} doesn't try to take it back. \"Read it,\" he says. \"It will be faster. My kind is not used to being interrupted. Then again, yours has never been used to listening.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Sonuna kadar oku", en: "Read it to the end" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Kadimler'in antlaşmasını elçinin elinden alıp kendin okudun.", en: "You took the Ancients' treaty out of the Envoy's hands and read it yourself." }
            sonraki: "thessar_vassal_teklifi_itiraf"
          - id: "yirt"
            etiket: { tr: "Dört kampın önünde ikiye yırt", en: "Tear it in two in front of all four camps" }
            etkiler:
              - bayrak: "vassal_teklifi_red"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -6 }
              - ahlak: { insanlik: 8, duzen: -6 }
              - itibar: { lonca: 6, siginak: 4, kadimler: -20 }
              - iliski: { thessar: { baglilik: -20, saygi: 8, korku: 4, guven: -15 } }
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadimler'in boyunduruk antlaşmasını dört kampın önünde ikiye yırttın; o gün {yer:kiyikent} seni ilk kez tek sesle alkışladı ve körfezin üstündeki gemi ilk kez kıpırdamadı.", en: "You tore the Ancients' vassal treaty in two in front of all four camps. That day {yer:kiyikent} cheered you with one voice for the first time, and the ship over the bay went completely still." }
            sonraki: "thessar_vassal_teklifi_yirtildi"

      - id: "thessar_vassal_teklifi_liderler"
        yer: "kordon"
        paragraflar:
          - { tr: "Liderler konuşuyor. Kimse kimseyi dinlemiyor; her kamp kendi korkusunu bağırıyor. {npc:thessar} kalemini zincirinden sarkıtıp bekliyor, bir saatin sarkacı gibi.", en: "The leaders talk. Nobody listens to anybody. Each camp yells its own fear. {npc:thessar} lets his stylus swing from its chain and waits, like the pendulum of a clock." }
          - { tr: "Sonunda herkes susuyor ve hepsi aynı anda sana dönüyor. Bir kişinin daha konuşması gerekiyor; o kişinin sen olduğunu herkes biliyor, en çok da elçi.", en: "Eventually everyone runs out of breath, and they all turn to you at once. One more person has to speak. Everybody knows it's you. The Envoy knows it best of all." }
          - { tr: "\"İnsanlar oy verir,\" diyor {npc:thessar}. \"Bunu kayda geçtim; sevimli bir gelenek. Ama Defter yalnızca bir imza okur.\"", en: "\"Humans vote,\" {npc:thessar} says. \"I have entered that. A charming tradition. But the Ledger only reads one signature.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Devam et. Sonuna kadar oku\"", en: "\"Go on. Read it to the end\"" }
            etkiler:
              - hafiza: { npc: "thessar", id: "teklifi_dinledi", agirlik: 40 }
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { baglilik: 3 } }
            kronik: { tr: "Liderleri dinledikten sonra elçinin antlaşmayı bitirmesine izin verdin.", en: "After hearing out the leaders, you let the Envoy finish reading the treaty." }
            sonraki: "thessar_vassal_teklifi_itiraf"

      - id: "thessar_vassal_teklifi_madde"
        yer: "kordon"
        paragraflar:
          - { tr: "Sesini yükseltmiyorsun. Yalnızca ona bakıyorsun ve iskelenin tahtaları altında su, ilk kez, geri çekiliyor. Rıhtımdaki herkesin penceresi bir anlığına titriyor.", en: "You don't raise your voice. You just look at him, and under the boards of the pier the water pulls back for the first time. Every window on the pier flickers for a second." }
          - { tr: "{npc:thessar} kalemini kaldırıyor ve ikinci maddedeki tek bir kelimenin üstüne bir çizgi çekiyor. \"Kayda geçiyorum,\" diyor. \"Müzakere. Bir hasatla. Meclis bunu okuduğunda üç gün konuşmayacak.\"", en: "{npc:thessar} raises his stylus and draws a single line through one word in article two. \"Entered,\" he says. \"A negotiation. With a harvest. When the Conclave reads this, they will not speak for three days.\"" }
          - metin: { tr: "{npc:elif_sari} gözlerini kapatıp derin bir nefes alıyor.", en: "{npc:elif_sari} closes her eyes and takes a long breath." }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Şimdi bitir\"", en: "\"Now finish it\"" }
            etkiler:
              - hafiza: { npc: "thessar", id: "teklifi_dinledi", agirlik: 40 }
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 2 }
              - iliski: { thessar: { baglilik: 3 } }
            kronik: { tr: "Antlaşmadan \"örnek\" maddesini sildirdikten sonra elçinin okumayı bitirmesine izin verdin.", en: "Once \"samples\" was struck from the treaty, you let the Envoy finish reading." }
            sonraki: "thessar_vassal_teklifi_itiraf"

      - id: "thessar_vassal_teklifi_itiraf"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:thessar} deriyi katlıyor. Rüzgâr hâlâ ona dokunamıyor. Sonra herkesin duyacağı, ama yalnızca sana söylediği bir sesle konuşuyor.", en: "{npc:thessar} folds the hide. The wind still can't touch it. Then he speaks in a voice everyone can hear, though he's saying it only to you." }
          - { tr: "\"Bize de üç yüz altmış beş gün verilmişti. Bizim de bir Kule'miz, fraksiyonlarımız, kahramanlarımız vardı. Son gün masaya bizden yaşlı bir şey oturdu ve bu deriyi uzattı. İmzaladık.\"", en: "\"We were given three hundred sixty-five days, too. We had a Spire, factions, heroes. On the last day, something older than us sat down at the table and held out this hide. We signed.\"" }
          - { tr: "\"Sizin tarihiniz bunun adını boyunduruk koyar,\" diyor. \"Bizimki hayatta kalış der. Ben bugün otuz dokuz dünyanın defterini tutuyorum. Hasat bir kez öder; vassal sonsuza dek. Bunu sana bir muhasebeci olarak söylüyorum, bir dost olarak değil. Dostun yok.\"", en: "\"Your history would call it a yoke,\" he says. \"Ours calls it survival. Today I keep the books on thirty-nine worlds. A harvest pays once. A vassal pays forever. I tell you this as an accountant, not as a friend. You have no friend here.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "İlke olarak kabul et", en: "Accept it in principle" }
            etkiler:
              - bayrak: "vassal_teklifi_kabul"
              - bilgi: "kadim_imzasi"
              - gorev: { zincir_kadimler: "basla" }
              - degisken: { kadim_tehdit: 10 }
              - ahlak: { duzen: 6, insanlik: -6 }
              - itibar: { kadimler: 10, yukselenler: 6, siginak: -8, lonca: -6 }
              - iliski: { thessar: { baglilik: 12, guven: 6 } }
              - xp_seviye: 60
              - tohum: { olay: "kadimler_2_vergi", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "{yer:kordon|in} kırık iskelesinde Kadimler'in boyunduruk antlaşmasını ilke olarak kabul ettin; {yer:kiyikent|in} yarısı o gece seni bir kurtarıcı, yarısı bir hain olarak andı.", en: "On {yer:kordon|pos} broken pier, you accepted the Ancients' vassal treaty in principle. That night half of {yer:kiyikent} called you a savior, and the other half called you a traitor." }
            sonraki: "thessar_vassal_teklifi_kabul"
          - id: "red"
            etiket: { tr: "Reddet: \"Biz imzalamayız\"", en: "Refuse: \"We don't sign\"" }
            etkiler:
              - bayrak: "vassal_teklifi_red"
              - bilgi: "kadim_imzasi"
              - degisken: { kadim_tehdit: -3 }
              - ahlak: { insanlik: 6, duzen: -3 }
              - itibar: { siginak: 6, kadimler: -10 }
              - iliski: { thessar: { baglilik: -10, saygi: 6 } }
              - xp_seviye: 60
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadimler'in boyunduruk teklifini reddettin; elçi kalemini bileğine götürdü ama çentik atmadı, bir soru işareti çizdi.", en: "You refused the Ancients' vassal offer. The Envoy put his stylus to his wrist, but instead of a notch, he drew a question mark." }
            sonraki: "thessar_vassal_teklifi_red"
          - id: "ertele"
            etiket: { tr: "Zaman iste: \"Gün 365 henüz gelmedi\"", en: "Ask for time: \"Day 365 isn't here yet\"" }
            etkiler:
              - bayrak: "vassal_teklifi_ertelendi"
              - bilgi: "kadim_imzasi"
              - ahlak: { duzen: 1, merhamet: 1 }
              - iliski: { thessar: { guven: 2 } }
              - xp_seviye: 50
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 15, max: 25 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Boyunduruk teklifine evet de hayır da demedin; elçi bekledi ve Kadimler beklemekte insanlardan iyidir.", en: "You didn't say yes or no to the vassal offer. The Envoy waited, and the Ancients are better at waiting than people are." }
            sonraki: "thessar_vassal_teklifi_ertele"

      - id: "thessar_vassal_teklifi_kabul"
        yer: "kordon"
        paragraflar:
          - { tr: "Rıhtımda bir uğultu yükseliyor. Biri bağırıyor, biri ağlıyor, biri alkışlıyor; hangisi kimden geliyor, ayırt edemiyorsun.", en: "A roar goes up from the pier. Somebody's shouting, somebody's crying, somebody's clapping. You can't tell which is coming from who." }
          - { tr: "{npc:thessar} deriyi ceketinin içine yerleştiriyor. \"İlke, imza değildir,\" diyor. \"Ama Defter ilkeyi de okur. Sözleşmenin kendisi daha sonra gelecek; masaya oturduğumuzda.\" Başını eğiyor: üç derece değil, beş.", en: "{npc:thessar} tucks the hide inside his coat. \"A principle is not a signature,\" he says. \"But the Ledger reads principles, too. The contract itself comes later, when we sit down at the table.\" He tips his head. Not three degrees. Five." }
          - metin: { tr: "{npc:kaya_demir} arkasını dönüp gidiyor. Adamlarının yarısı onunla gidiyor.", en: "{npc:kaya_demir} turns and walks off. Half his people go with him." }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Rıhtımdakilerin yüzüne bak", en: "Look at the faces on the pier" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Boyunduruğu kabul ettikten sonra rıhtımdaki yüzlere tek tek baktın.", en: "After you accepted the yoke, you looked at every face on the pier, one by one." }
            sonraki: "@akis"

      - id: "thessar_vassal_teklifi_red"
        yer: "kordon"
        paragraflar:
          - { tr: "Rıhtım bir an sessiz kalıyor; sonra biri alkışlıyor, sonra bir başkası. Alkış {yer:kordon} boyunca, kırık iskeleden yıkık sahil yoluna kadar yayılıyor.", en: "The pier stays silent for a second. Then somebody claps, then somebody else. The applause rolls down the whole Esplanade, from the broken pier to the wrecked beach road." }
          - { tr: "{npc:thessar} alkışı bir istatistik gibi dinliyor. \"Ret bir müzakere pozisyonudur,\" diyor. \"Sizin türünüzde öyle; bizimkinde de öyleydi. Gün üç yüz altmış beşte herkes imzalamak ister. Soru, kimin elinde kalem olduğudur.\"", en: "{npc:thessar} listens to the applause like it's a statistic. \"Refusal is a negotiating position,\" he says. \"It is in your species. It was in mine. On Day three hundred sixty-five, everyone wants to sign. The question is who is holding the pen.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Kalem bizde kalacak\"", en: "\"We're keeping the pen\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Elçiye kalemin insanlarda kalacağını söyledin; o bunu bir tehdit olarak değil, bir öngörü olarak not aldı.", en: "You told the Envoy the pen would stay in human hands. He wrote it down not as a threat, but as a forecast." }
            sonraki: "@akis"

      - id: "thessar_vassal_teklifi_ertele"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:thessar} başını hafifçe yana eğiyor. \"Zaman,\" diyor. \"Sizin en kıt malınız. Kalan gün sayınızı biliyorum; sizden iyi.\"", en: "{npc:thessar} tilts his head slightly. \"Time,\" he says. \"Your scarcest commodity. I know how many days you have left. Better than you do.\"" }
          - { tr: "Deriyi ceketine koyup merdivene yürüyor. İlk basamakta duruyor. \"Bekleyeceğim. Ama Defter beklemez; ve Meclis hiç beklemez.\"", en: "He puts the hide in his coat and walks to the stair. On the first step he stops. \"I will wait. But the Ledger does not wait. And the Conclave never does.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Merdivenin katlanmasını izle", en: "Watch the stair fold away" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { guven: 1 } }
            kronik: { tr: "Boyunduruk teklifini erteledin ve elçinin merdiveninin ışığa katlanmasını izledin.", en: "You put off the vassal offer and watched the Envoy's stair fold back into light." }
            sonraki: "@akis"

      - id: "thessar_vassal_teklifi_yirtildi"
        yer: "kordon"
        paragraflar:
          - { tr: "Deri yırtılırken bir ses çıkarıyor; kâğıt sesi değil, canlı bir şeyin sesi. İki parça elinde kıvranıyor, sonra kuruyup bir sonbahar yaprağı gibi kıvrılıyor.", en: "The hide makes a sound as it tears. Not a paper sound. The sound of something alive. The two halves writhe in your hands, then dry out and curl up like autumn leaves." }
          - { tr: "Rıhtım bir an nefesini tutuyor, sonra patlıyor. Dört kamp ilk kez aynı şeyi bağırıyor.", en: "The pier holds its breath for a second, then explodes. For the first time, all four camps are yelling the same thing." }
          - { tr: "{npc:thessar} yırtılmış parçalara bakıyor. Yüzünde hiçbir şey yok. \"Bu bir kopyaydı,\" diyor. \"Asıl antlaşmayı yırtamazsın. Ama sen de bunu biliyordun; yırttığın şey kopya değildi. Kayda geçiyorum.\"", en: "{npc:thessar} looks at the torn pieces. Nothing on his face. \"That was a copy,\" he says. \"You cannot tear the original. But you knew that. What you tore was not the copy. Entered.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Parçaları denize at", en: "Throw the pieces in the sea" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Yırttığın antlaşmanın parçalarını {yer:kordon|den} denize attın; dalgalar onları gemiye doğru taşıdı.", en: "You threw the pieces of the torn treaty off {yer:kordon}. The waves carried them toward the ship." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 3: MUHBİR
  - id: "kadimler_3_muhbir"
    perde: [3]
    gun: { min: 245, max: 305 }
    kosul: { gorev: { zincir_kadimler: "basla" }, bayrak: "kadim_vergi_odendi" }
    agirlik: 6
    etiketler: ["kadimler", "zincir", "muhbir"]
    gerilim: 3
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Defterdeki isimler", en: "Names in the Ledger" }
    sahne: "kadimler_3_muhbir_1"
    sahneler:
      - id: "kadimler_3_muhbir_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece geç saatte {npc:thessar} seni {yer:kiyikent_liman|de}ki boş bir ambara çağırıyor. Muhafızları dışarıda bekliyor; içeride yalnızca o, bir Okuyucu ve bir masa var. Masanın üstünde boş bir yaprak.", en: "Late at night, {npc:thessar} calls you to an empty warehouse on {yer:kiyikent_liman}. His Wardens wait outside. Inside it's just him, a Reader, and a table. On the table, a blank leaf." }
          - { tr: "\"Gün üç yüz altmış beşte,\" diyor, \"birileri direnecek. Hep direnirler. Direnenler hesabı bozar: fazladan ölüm, fazladan kayıp, fazladan sayım. Kimlerin direneceğini bilmek istiyorum. Önceden.\"", en: "\"On Day three hundred sixty-five,\" he says, \"someone will resist. Someone always does. Resistance spoils the books: extra deaths, extra losses, extra counting. I want to know who will resist. In advance.\"" }
          - { tr: "Kalemini masaya, yaprağın yanına bırakıyor. \"Senin listen temiz olur. Kimse sana yalan söylemez; herkes sana bakar.\"", en: "He sets his stylus on the table beside the leaf. \"Your list would be clean. Nobody lies to you. Everybody watches you.\"" }
          - metin: { tr: "Yaprağın altında başka yapraklar var; dolu. El yazısını tanıyorsun: hızlı, sıkışık, cümleleri yarıda kesilmiş. \"Zaten bir muhbirim var,\" diyor {npc:thessar}. \"Raporları... duygusal. Yarısı senin hakkında.\"", en: "There are more leaves under the blank one, and they're full. You know the handwriting: fast, cramped, sentences chopped off halfway. \"I already have an informant,\" {npc:thessar} says. \"His reports are... emotional. Half of them are about you.\"" }
            kosul: { bayrak: "mert_kadimlere_satti" }
        sezgiler:
          - kosul: { stat: { per: 240 } }
            metin: { tr: "Okuyucu masayı değil seni okuyor; listeye ne yazacağını değil, yazarken ne hissettiğini.", en: "The Reader isn't reading the table. It's reading you. Not what you'll write, but what you'll feel while you write it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "liste yaz, liste yazma. ama bil: defter bir kez okuduğu adı unutmaz. benimkini hâlâ hatırlıyor.", en: "write the list, don't write the list. but know this: the ledger never forgets a name it's read once. it still remembers mine." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir liste mi? Kimin? Benim adım var mı? Şaka yaptım. Şaka değildi.\"", en: "\"A list? Of who? Am I on it? Kidding. I wasn't kidding.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bunu yaparsan, ben de bir gün o listede olurum. Biliyorsun, değil mi?\"", en: "\"Do this, and someday I'm on that list too. You know that, right?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Benim adımı en üste yaz. Direneceğim. Bilsinler.\"", en: "\"Put my name at the top. I'm gonna resist. Let them know.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Yaprağa uzan; önce düşün", en: "Reach for the leaf. Think first" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Kadimler'in muhbir yaprağına uzandın; elin bir süre havada kaldı.", en: "You reached for the Ancients' informant leaf. Your hand hung there in the air for a while." }
            sonraki: "kadimler_3_muhbir_karar"
          - id: "mert"
            etiket: { tr: "Önce {npc:mert_kilic|in} dosyasını iste", en: "Ask for {npc:mert_kilic|pos} file first" }
            goster: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" }
            etkiler:
              - bilgi: "mert_kadim_dosyasi"
              - ahlak: { duzen: -1, merhamet: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Kadimler'den kendi muhbirlerinin dosyasını istedin ve aldın.", en: "You asked the Ancients for their own informant's file, and you got it." }
            sonraki: "kadimler_3_muhbir_mert"
          - id: "liste_oku"
            tur: "gosteris"
            etiket: { tr: "Okuyucu'nun gizli listesini omzunun üstünden oku", en: "Read the Reader's secret list over its shoulder" }
            gerekli: { stat: { per: 250 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -2 }
              - iliski: { thessar: { saygi: 8, korku: 4 } }
            kronik: { tr: "Kadimler'in direnişçi listesini bir Okuyucu'nun omzunun üstünden okudun; isimlerin çoğunu zaten biliyorlardı.", en: "You read the Ancients' resistance list over a Reader's shoulder. They already knew most of the names." }
            sonraki: "kadimler_3_muhbir_liste"
          - id: "ifsa"
            etiket: { tr: "Yaprağı yırt; bu ambarı herkese anlat", en: "Rip the leaf. Tell everyone about this warehouse" }
            etkiler:
              - bayrak: "kadim_agi_ifsa"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -6 }
              - ahlak: { insanlik: 6, duzen: -4, merhamet: 2 }
              - itibar: { siginak: 6, sessiz_ag: 6, kadimler: -15 }
              - iliski: { thessar: { baglilik: -12, saygi: 5 } }
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 12, max: 20 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadimler'in muhbir ağını {yer:kiyikent|e} ifşa ettin; o hafta {yer:kiyikent_liman|de}ki üç ambarın kapısı kırıldı ve hiçbirinde artık kimse yoktu.", en: "You exposed the Ancients' informant network to all of {yer:kiyikent}. That week three warehouse doors on {yer:kiyikent_liman} got kicked in, and nobody was inside any of them anymore." }
            sonraki: "kadimler_3_muhbir_ifsa"

      - id: "kadimler_3_muhbir_mert"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} yaprakları sana uzatıyor. Raporlar düzenli: Sessiz Ağ'ın frekansları, depolarının yerleri, Kule'de buldukları kod parçaları. Ve senin hakkında, her biri tarihli, sayfalarca.", en: "{npc:thessar} hands you the leaves. The reports are neat: the Quiet Network's frequencies, where they keep their stashes, code fragments they found in the Spire. And pages and pages about you, every one of them dated." }
          - { tr: "Her raporun sonunda aynı not, aynı titrek el: \"Bana dokunmayacaklarına söz verdiler.\"", en: "At the end of every report, the same note in the same shaky hand: \"They promised they wouldn't touch me.\"" }
          - { tr: "\"Ona söz verdim,\" diyor {npc:thessar}. \"Kadimler sözlerini tutar. Sözün kapsamadığı şeyler hakkında ise hiçbir şey söylemedim.\"", en: "\"I did promise him,\" {npc:thessar} says. \"The Ancients keep their promises. About the things the promise does not cover, I said nothing.\"" }
        secenekler:
          - id: "yak"
            etiket: { tr: "Dosyayı yak; {npc:mert_kilic|i} koru", en: "Burn the file. Protect {npc:mert_kilic}" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -2 }
              - iliski: { mert_kilic: { guven: 15, baglilik: 10 }, thessar: { saygi: -3 } }
              - hafiza: { npc: "mert_kilic", id: "olay:kadimler_3_muhbir", agirlik: 50 }
            kronik: { tr: "Kadimler'e satılan arkadaşının dosyasını yaktın; o hiçbir zaman ne kadar yakına geldiğini tam öğrenmedi.", en: "You burned the file on the friend who sold out to the Ancients. He never quite found out how close it came." }
            sonraki: "kadimler_3_muhbir_karar"
          - id: "ag"
            etiket: { tr: "Dosyayı Sessiz Ağ'a götürmek için sakla", en: "Keep the file for the Quiet Network" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -4 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: -30 }, thessar: { saygi: 3 } }
            kronik: { tr: "Kadimler'e satılan arkadaşının dosyasını Sessiz Ağ'a götürmek için sakladın.", en: "You held onto the file on the friend who'd sold out to the Ancients, to hand it over to the Quiet Network." }
            sonraki: "kadimler_3_muhbir_karar"

      - id: "kadimler_3_muhbir_liste"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir anlığına bakıyorsun ve yeterli. Okuyucu'nun tuttuğu yaprakta yüzlerce isim var; Lonca'dan, Sığınak'tan, Sessiz Ağ'dan. Çoğunun yanında bir çentik: kesin. Birkaçının yanında bir soru işareti.", en: "You look for one second, and it's enough. The leaf the Reader's holding has hundreds of names on it, from the Guild, the Haven, the Quiet Network. Most have a notch next to them: confirmed. A few have a question mark." }
          - { tr: "En altta, tek başına, senin adın. Yanında ne çentik var ne soru işareti; yalnızca boşluk.", en: "At the very bottom, all by itself, is your name. No notch beside it, no question mark. Just blank space." }
          - { tr: "{npc:thessar} Okuyucu'yu bir bakışla geri gönderiyor. \"Evet,\" diyor. \"Listeyi zaten biliyoruz. Senden istediğim liste değildi. İmzandı.\"", en: "{npc:thessar} sends the Reader back with a glance. \"Yes,\" he says. \"We already know the list. What I wanted from you was not the list. It was your signature on it.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"O zaman ne istediğini açıkça söyle\"", en: "\"Then say what you want, plainly\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Elçinin listeyi zaten bildiğini öğrendin; senden istediği şeyin bir imza olduğunu da.", en: "You found out the Envoy already knew the list, and that what he really wanted from you was a signature." }
            sonraki: "kadimler_3_muhbir_karar"

      - id: "kadimler_3_muhbir_karar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Boş yaprak önünde duruyor. Kalem ılık; birinin elinden yeni bırakılmış gibi.", en: "The blank leaf sits in front of you. The stylus is warm, like someone just put it down." }
          - { tr: "{npc:thessar} bekliyor. Okuyucu bekliyor. Dışarıda muhafızlar, rıhtımda dalgalar, körfezin üstünde ters kule; hepsi bekliyor.", en: "{npc:thessar} waits. The Reader waits. Outside, the Wardens, the waves on the pier, the upside-down tower over the bay. All of it waits." }
        secenekler:
          - id: "ver"
            etiket: { tr: "İsimleri yaz", en: "Write the names" }
            etkiler:
              - bayrak: "kadim_muhbiri"
              - degisken: { kadim_tehdit: 8 }
              - ahlak: { merhamet: -8, duzen: 6, insanlik: -4 }
              - itibar: { kadimler: 10 }
              - iliski: { thessar: { baglilik: 8, guven: 6 } }
              - tohum: { olay: "kadimler_4_vassal_sozlesmesi", gecikme: { min: 18, max: 28 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'e Gün 365'te direnecek olanların listesini kendi elinle yazdın; o listedeki hiç kimse bunu öğrenmedi, hiçbiri de o günü görmedi.", en: "You wrote the Ancients a list of who would resist on Day 365, in your own hand. Nobody on that list ever found out. None of them lived to see that day." }
            sonraki: "kadimler_3_muhbir_yazildi"
          - id: "cift"
            etiket: { tr: "Ölülerin ve hiç var olmamışların adlarını yaz", en: "Write the names of the dead and the never-born" }
            gerekli: { stat: { int: 240 } }
            etkiler:
              - bayrak: "kadim_muhbiri"
              - bayrak: "kadim_muhbir_cift"
              - yalan: { npc: "thessar", konu: "muhbir_yalani" }
              - degisken: { kadim_tehdit: -3 }
              - ahlak: { duzen: -4, merhamet: 4 }
              - iliski: { thessar: { guven: 4, baglilik: 3 } }
              - tohum: { olay: "kadimler_4_vassal_sozlesmesi", gecikme: { min: 18, max: 28 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler'e verdiğin direnişçi listesi ölülerle ve hiç doğmamış insanlarla doluydu; Defter aylarca hayaletleri saydı.", en: "The resistance list you gave the Ancients was full of the dead and people who never existed. The Ledger spent months counting ghosts." }
            sonraki: "kadimler_3_muhbir_cift"
          - id: "kendin"
            etiket: { tr: "Yalnızca bir ad yaz: kendi adını", en: "Write one name only: your own" }
            etkiler:
              - bayrak: "kadim_muhbiri"
              - dikkat: 5
              - degisken: { kadim_tehdit: 2 }
              - ahlak: { merhamet: 5, insanlik: 3, duzen: -2 }
              - iliski: { thessar: { saygi: 12, baglilik: 6 } }
              - tohum: { olay: "kadimler_4_vassal_sozlesmesi", gecikme: { min: 18, max: 28 }, kosul: { npc_hayatta: "thessar", gorev: { zincir_kadimler: "basla" } } }
            kronik: { tr: "Kadimler direnecek olanları sorduğunda yaprağa yalnızca kendi adını yazdın; elçi o yaprağı Meclis'e göndermedi, kendine sakladı.", en: "When the Ancients asked who would resist, you wrote only your own name on the leaf. The Envoy never sent that leaf to the Conclave. He kept it." }
            sonraki: "kadimler_3_muhbir_kendin"
          - id: "ifsa"
            etiket: { tr: "Kalemi kır; bu ambarı herkese anlat", en: "Snap the stylus. Tell everyone about this warehouse" }
            etkiler:
              - bayrak: "kadim_agi_ifsa"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -6 }
              - ahlak: { insanlik: 6, duzen: -4, merhamet: 2 }
              - itibar: { siginak: 6, sessiz_ag: 6, kadimler: -15 }
              - iliski: { thessar: { baglilik: -12, saygi: 5 } }
              - tohum: { olay: "thessar_ihanet_fisiltisi", gecikme: { min: 12, max: 20 }, kosul: { npc_hayatta: "thessar" } }
            kronik: { tr: "Kadimler'in muhbir yaprağını ve elçinin kalemini aynı gece kırdın; ertesi gün {yer:kiyikent|in} her köşesinde o ambarın adı konuşuluyordu.", en: "You broke the Ancients' informant leaf and the Envoy's stylus on the same night. The next day, every corner of {yer:kiyikent} was talking about that warehouse." }
            sonraki: "kadimler_3_muhbir_ifsa"

      - id: "kadimler_3_muhbir_yazildi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yazarken elin titremiyor. Bu seni şaşırtıyor; sonra şaşırmadığın için daha çok şaşırıyorsun. Her ad bir an parlıyor, sonra sönüyor.", en: "Your hand doesn't shake while you write. That surprises you. Then it surprises you more that you aren't more surprised. Every name glows for a second, then goes out." }
          - { tr: "{npc:thessar} yaprağı alıp Okuyucu'ya veriyor. \"Temiz,\" diyor. \"Bu listedeki herkes Gün üç yüz altmış beşte ilk sayılanlar olacak. Ya da son. Hangisi daha merhametli, bunu sizin türünüz tartışsın.\"", en: "{npc:thessar} takes the leaf and hands it to the Reader. \"Clean,\" he says. \"Everyone on this list will be the first counted on Day three hundred sixty-five. Or the last. Which is the more merciful, I leave for your species to argue about.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ambardan çık; arkana bakma", en: "Walk out of the warehouse. Don't look back" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Muhbir listesini yazdığın ambardan arkana bakmadan çıktın.", en: "You walked out of the warehouse where you wrote the informant list without looking back." }
            sonraki: "@akis"

      - id: "kadimler_3_muhbir_cift"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Öğretici'de ölenlerin adlarını yazıyorsun; sonra çocukluğundan hatırladığın çizgi film karakterlerini, sonra uydurduğun soyadlarını. Hepsi bir an parlıyor, sonra sönüyor; Defter neyin gerçek olduğunu sormuyor.", en: "You write the names of people who died in the Tutorial. Then cartoon characters you remember from when you were a kid. Then last names you make up on the spot. Every one glows for a second, then goes out. The Ledger doesn't ask what's real." }
          - { tr: "Okuyucu'nun yarığı bir an uzun açık kalıyor. {npc:thessar} yaprağa bakıyor, sonra sana. \"Temiz,\" diyor. Bir süre daha bakıyor. \"Çok temiz.\"", en: "The Reader's slit stays open one beat too long. {npc:thessar} looks at the leaf, then at you. \"Clean,\" he says. He keeps looking a little longer. \"Very clean.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Gülümseme; yalnızca başınla onayla", en: "Don't smile. Just nod" }
            etkiler:
              - unvan: "cift_defter"
              - ahlak: { duzen: -1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Bir Kadim elçisine hayaletlerle dolu bir liste verdin ve yüzün hiç kıpırdamadı.", en: "You handed an Ancient envoy a list full of ghosts, and your face never moved." }
            sonraki: "@akis"

      - id: "kadimler_3_muhbir_kendin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tek bir ad. Yaprağın ortasında, yalnız. Parlıyor ve sönmüyor; Defter onu okuyamıyor gibi.", en: "One name, alone in the middle of the leaf. It glows, and it doesn't go out. Like the Ledger can't read it." }
          - { tr: "{npc:thessar} uzun süre bakıyor. \"Gün üç yüz altmış beşte direnecek olanlar,\" diyor yavaşça. \"Bir kişi. Bu doğru bir liste. Belki şimdiye kadar okuduğum en doğru liste.\" Yaprağı katlayıp Okuyucu'ya değil, kendi ceketinin içine koyuyor.", en: "{npc:thessar} stares at it for a long time. \"Those who will resist on Day three hundred sixty-five,\" he says slowly. \"One person. That is an accurate list. Possibly the most accurate list I have ever read.\" He folds the leaf and puts it, not in the Reader's hands, but inside his own coat." }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Onu Meclis'e gönder\"", en: "\"Send it to the Conclave\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { guven: 4 } }
            kronik: { tr: "Elçiye kendi adının yazılı olduğu listeyi Meclis'e göndermesini söyledin; o göndermedi.", en: "You told the Envoy to send the list with only your name on it to the Conclave. He didn't." }
            sonraki: "@akis"

      - id: "kadimler_3_muhbir_ifsa"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ertesi sabah {yer:kiyikent_liman|in} her duvarına aynı şey yazılmış: ambarın adresi, Kadim yaprakları, elçinin muhbir aradığı. Kalabalık ambarın kapısını kırıyor; içeride yalnızca boş bir masa var.", en: "By the next morning, the same thing is written on every wall on {yer:kiyikent_liman}: the warehouse address, the Ancient leaves, the Envoy shopping for informants. A crowd kicks in the warehouse door. There's nothing inside but an empty table." }
          - { tr: "Akşam körfezin üstündeki kulenin ucundan katlanmış ışık inmiyor. Elçilik ilk kez kapısını kapatmış.", en: "That evening no folded light comes down from the tip of the tower over the bay. For the first time, the embassy's closed its door." }
          - metin: { tr: "Sessiz Ağ'ın frekanslarında bir mesaj dolaşıyor, kısa: \"Teşekkürler. Sıradaki biziz, biliyoruz.\"", en: "A message makes the rounds on the Quiet Network's frequencies, short: \"Thanks. We know we're next.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kapalı kapıya, kuleye bak", en: "Look up at the shut door, at the tower" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Kadimler'in muhbir ağını ifşa ettiğin akşam elçilik kapısını ilk kez kapattı.", en: "The evening you exposed the Ancients' informants, the embassy shut its door for the first time." }
            sonraki: "@akis"

  # ================================================================== THESSAR: İHANET FISILTISI
  - id: "thessar_ihanet_fisiltisi"
    perde: [3]
    gun: { min: 255, max: 312 }
    kosul: { bayrak: "thessar_indi", bayrak_yok: "thessar_ihanete_hazir" }
    agirlik: 4
    etiketler: ["kadimler", "thessar", "ihanet", "gece"]
    gerilim: 4
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Muhafızsız bir gece", en: "A night without Wardens" }
    sahne: "thessar_ihanet_fisiltisi_1"
    sahneler:
      - id: "thessar_ihanet_fisiltisi_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı Kule Dibi'nde, kapalı avcı pazarının tezgâhları arasında biri seni bekliyor. Önce gölgesini görüyorsun: ay ışığına doğru düşüyor. Sonra onu.", en: "At midnight on {yer:kule_dibi}, somebody's waiting for you between the shuttered stalls of the hunters' market. First you see the shadow, falling toward the moonlight. Then you see him." }
          - { tr: "{npc:thessar} yalnız. Arkasında muhafız yok, Okuyucu yok. Kalemini zincirinden çıkarıp avucuna almış; ilk kez onu bir silah gibi değil, bir şeye tutunur gibi tutuyor.", en: "{npc:thessar} is alone. No Wardens behind him, no Reader. He's taken the stylus off its chain and closed it in his fist. For the first time he isn't holding it like a weapon. He's holding it like something to hang on to." }
          - { tr: "\"Raporumu okudular,\" diyor. İkinci sesi birincinin gerisinde kalmıyor; ikisi de fısıldıyor. \"Meclis kararını verdi. Sapma budanacak. Ve sapmayı raporlayıp duran elçi de sapmanın bir parçası sayılıyor. Budayıcı yolda. Senin için. Benim için.\"", en: "\"They read my report,\" he says. His second voice doesn't lag behind the first. Both of them are whispering. \"The Conclave has ruled. The deviation is to be pruned. And the envoy who kept filing reports on the deviation counts as part of the deviation. The Pruner is on its way. For you. For me.\"" }
          - metin: { tr: "\"Sana güvendiğim için gelmedim,\" diye ekliyor. \"Başka kimse kalmadığı için geldim.\"", en: "\"I did not come because I trust you,\" he adds. \"I came because there is no one else left.\"" }
            kosul: { iliski_max: { thessar: { guven: 0 } } }
          - metin: { tr: "\"İmzalamaya razı oldun,\" diyor. \"Bu yüzden önce sana soruyorum: imzayı mı istersin, yoksa imzalanacak kimsenin kalmadığı bir dünyayı mı?\"", en: "\"You agreed to sign,\" he says. \"So I ask you first. Do you want the signature? Or a world where there is no one left to sign it?\"" }
            kosul: { bayrak: "vassal_teklifi_kabul" }
        sezgiler:
          - kosul: { stat: { per: 260 } }
            metin: { tr: "Sol kolunun içinde, otuz dokuz dünyanın çentiklerinin arasında taze bir kesik var. Biri oradaki bir şeyi çıkarmaya çalışmış ve vazgeçmiş.", en: "On the inside of his left arm, among the notches of thirty-nine worlds, there's a fresh cut. Someone tried to dig something out of there and gave up halfway." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "budayıcı. bu kelimeyi biliyorum. bu kelime beni bir kez kesti. ikinci kez kesmesine izin verme.", en: "pruner. i know that word. that word cut me once. don't let it cut me twice." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kendi türüne ihanet edecek. Ona güvenme. Ama dinle.\"", en: "\"He's about to sell out his own kind. Don't trust him. But listen.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Korkuyor. Bunu ilk kez görüyorum. Korkan bir hasta yalan söylemez; çoğunlukla.\"", en: "\"He's scared. First time I've seen it. Scared patients don't lie. Mostly.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir tuzak olabilir. Ya da değil. İkisinin de olasılığı... tamam, hesaplayamıyorum.\"", en: "\"Could be a trap. Or not. The odds on both are... okay, I can't do the math on this.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "\"Ne öneriyorsun?\"", en: "\"What are you proposing?\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { thessar: { guven: 3 } }
            kronik: { tr: "Muhafızsız gelen elçiye ne önerdiğini sordun.", en: "You asked the Envoy, who came with no Wardens, what he was proposing." }
            sonraki: "thessar_ihanet_fisiltisi_teklif"
          - id: "pencere"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni aç; okunmayan satırları ona göster", en: "Open your window. Show him the lines that won't read" }
            etkiler:
              - aciga_vur: true
              - bayrak: "thessar_pencere_goruldu"
              - bilgi: "defterdeki_ilk_anomali"
              - ahlak: { insanlik: 3, duzen: -3 }
              - iliski: { thessar: { guven: 10, saygi: 6 } }
            kronik: { tr: "Budayıcı'nın yolda olduğunu söyleyen elçiye kendi pencereni açtın; on bin yıldır kimse ona okunmayan bir şeyi kendi isteğiyle göstermemişti.", en: "When the Envoy told you the Pruner was coming, you opened your own window to him. In ten thousand years, nobody had ever shown him something unreadable of their own free will." }
            sonraki: "thessar_ihanet_fisiltisi_pencere"
          - id: "ihbar"
            etiket: { tr: "Onu dinleme; Meclis'e ihbar et", en: "Don't listen. Report him to the Conclave" }
            etkiler:
              - bayrak: "thessar_ihbar_edildi"
              - bayrak: "thessar_dusman"
              - degisken: { kadim_tehdit: 8 }
              - ahlak: { merhamet: -8, insanlik: -6, duzen: 4 }
              - itibar: { kadimler: 15 }
              - iliski: { thessar: { guven: -40, baglilik: -20, korku: 10 } }
            kronik: { tr: "Sana sığınmaya gelen Kadim elçisini kendi Meclis'ine ihbar ettin; o gece Defter'de onun adının yanına ilk çentik atıldı.", en: "The Ancient envoy came to you for shelter, and you reported him to his own Conclave. That night, the first notch went in beside his name in the Ledger." }
            sonraki: "thessar_ihanet_fisiltisi_ihbar"

      - id: "thessar_ihanet_fisiltisi_teklif"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "\"Defter'in ilk sayfasında senin gibi bir satır var,\" diyor {npc:thessar}. \"Okunmayan, sayılmayan bir şey. Biz onu budadık ve imzaladık. On bin yıldır merak ediyorum: budamasaydık ne olurdu?\"", en: "\"On the first page of the Ledger there is a line like you,\" {npc:thessar} says. \"Something that would not read, would not count. We pruned it, and we signed. For ten thousand years I have wondered what would have happened if we had not.\"" }
            kosul: { bayrak_yok: "thessar_pencere_goruldu" }
          - metin: { tr: "\"O satırı budadık ve imzaladık,\" diyor {npc:thessar}. \"On bin yıldır merak ediyorum: budamasaydık ne olurdu? Şimdi cevap karşımda duruyor ve onu hâlâ okuyamıyorum.\"", en: "\"We pruned that line, and we signed,\" {npc:thessar} says. \"For ten thousand years I have wondered what would have happened if we had not. Now the answer is standing in front of me, and I still cannot read it.\"" }
            kosul: { bayrak: "thessar_pencere_goruldu" }
          - { tr: "Sol kolunu gösteriyor; taze kesiği. \"Filonun hasat yetkisi burada. Defter Mührü. Her elçi onu kendi derisinde taşır. Zamanı geldiğinde onu söküp sana vereceğim. Onunla basılan her emir Meclis'in emri sayılır; geri çekilme emri de.\"", en: "He shows you his left arm, the fresh cut. \"The fleet's authority to harvest is in here. The Ledger Seal. Every envoy carries it in his own skin. When the time comes, I will cut it out and give it to you. Any order stamped with it counts as an order of the Conclave. Including an order to withdraw.\"" }
          - { tr: "\"Karşılığında,\" diyor ve sesi ilk kez bir şey istemenin ağırlığını taşıyor, \"bana Defter'de yazılı olmayan bir son ver.\"", en: "\"In exchange,\" he says, and for the first time his voice carries the weight of someone asking for something, \"give me an ending that is not written in the Ledger.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kabul et; mührü bekle", en: "Accept. Wait for the seal" }
            gerekli: { iliski_min: { thessar: { guven: 15 } } }
            etkiler:
              - bayrak: "thessar_ihanete_hazir"
              - bilgi: "meclis_budamasi"
              - bilgi: "defterdeki_ilk_anomali"
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { duzen: -6, insanlik: 4, merhamet: 2 }
              - iliski: { thessar: { baglilik: 15, guven: 15 } }
              - xp_seviye: 80
              - tohum: { olay: "thessar_kirik_muhur", gecikme: { min: 12, max: 20 }, kosul: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" } }
            kronik: { tr: "Kendi ırkına ihanet etmeye hazırlanan bir Kadim'e söz verdin; o gece Kule Dibi'nde iki sapma aynı tarafa geçti.", en: "You gave your word to an Ancient getting ready to betray his own kind. That night on {yer:kule_dibi}, two deviations switched to the same side." }
            sonraki: "thessar_ihanet_fisiltisi_kabul"
          - id: "ikna"
            tur: "gosteris"
            etiket: { tr: "Güvenmiyor; yine de seni seçmesini sağla", en: "He doesn't trust you. Make him pick you anyway" }
            goster: { iliski_max: { thessar: { guven: 14 } } }
            gerekli: { stat: { cha: 260 } }
            etkiler:
              - bayrak: "thessar_ihanete_hazir"
              - bilgi: "meclis_budamasi"
              - bilgi: "defterdeki_ilk_anomali"
              - dikkat: 4
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { duzen: -6, insanlik: 4 }
              - iliski: { thessar: { baglilik: 15, guven: 25, saygi: 6 } }
              - xp_seviye: 80
              - tohum: { olay: "thessar_kirik_muhur", gecikme: { min: 12, max: 20 }, kosul: { npc_hayatta: "thessar", bayrak_yok: "ihanet_thessar" } }
            kronik: { tr: "Sana güvenmeyen bir Kadim'i yine de seni seçmeye ikna ettin; o güveni Gün 365'e kadar hiç bozmadın.", en: "An Ancient who didn't trust you chose you anyway, because you talked him into it. You never broke that trust before Day 365." }
            sonraki: "thessar_ihanet_fisiltisi_kabul"
          - id: "sadakat"
            etiket: { tr: "Reddet: \"Ben imzaya geldim, ihanete değil\"", en: "Refuse: \"I came to sign, not to betray\"" }
            etkiler:
              - bayrak: "thessar_sadakat_secildi"
              - bilgi: "meclis_budamasi"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { duzen: 6, insanlik: -4 }
              - iliski: { thessar: { baglilik: 10, saygi: 6 } }
              - xp_seviye: 60
            kronik: { tr: "Kendi ırkına ihanet etmeyi teklif eden elçiye Defter'e sadık kalmasını söyledin; o seni Meclis'e budanacak bir sapma olarak değil, imzacı olarak yazdı.", en: "When the Envoy offered to betray his own kind, you told him to stay loyal to the Ledger. He entered you with the Conclave not as a deviation to prune, but as a signatory." }
            sonraki: "thessar_ihanet_fisiltisi_sadakat"
          - id: "yalniz"
            etiket: { tr: "\"Kendi hesabını kendin kapat\"", en: "\"Close your own account\"" }
            etkiler:
              - bayrak: "thessar_yalniz_birakildi"
              - bilgi: "meclis_budamasi"
              - ahlak: { duzen: 1, insanlik: 1, merhamet: -2 }
              - iliski: { thessar: { guven: -8, saygi: 3 } }
              - xp_seviye: 50
            kronik: { tr: "Sana sığınmaya gelen elçiyi kendi hesabıyla baş başa bıraktın; o da Defter'e döndü.", en: "The Envoy came to you for shelter, and you left him alone with his own account. So he went back to the Ledger." }
            sonraki: "thessar_ihanet_fisiltisi_yalniz"
          - id: "ihbar"
            etiket: { tr: "Sözleri kaydet; Meclis'e ihbar et", en: "Record his words. Report him to the Conclave" }
            etkiler:
              - bayrak: "thessar_ihbar_edildi"
              - bayrak: "thessar_dusman"
              - bilgi: "meclis_budamasi"
              - degisken: { kadim_tehdit: 8 }
              - ahlak: { merhamet: -8, insanlik: -6, duzen: 4 }
              - itibar: { kadimler: 15 }
              - iliski: { thessar: { guven: -40, baglilik: -20, korku: 10 } }
            kronik: { tr: "Elçinin ihanet teklifini sonuna kadar dinledin ve sonra her kelimesini Meclis'e ihbar ettin.", en: "You heard the Envoy's offer of treason all the way through, then reported every word of it to the Conclave." }
            sonraki: "thessar_ihanet_fisiltisi_ihbar"

      - id: "thessar_ihanet_fisiltisi_pencere"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pencereni açıp ona çeviriyorsun; bir sayfayı ışığa tutar gibi. Durumun, seviyen ve onların altında kimsenin okuyamadığı satırlar: kırık harfler, sayılmayan sayılar, kenar boşluğuna sıkışmış ikinci bir el yazısı. Sistem seni durdurmuyor; izliyor gibi.", en: "You open your window and turn it toward him, the way you'd hold a page up to the light. Your status, your level, and under them the lines nobody has ever been able to read: broken letters, numbers that won't count, a second handwriting crammed into the margins. The System doesn't stop you. It seems to be watching." }
          - { tr: "{npc:thessar} kalemini kullanmıyor. Kendi gözleriyle, satır satır, bir mezar taşındaki adı okur gibi yavaş okuyor. Bir satırda ikinci sesi tamamen susuyor; ilk kez.", en: "{npc:thessar} doesn't use his stylus. He reads with his own eyes, line by line, slow, the way you'd read a name on a headstone. At one line his second voice goes completely silent. For the first time." }
          - { tr: "\"Bunu biliyorum,\" diyor. \"Defter'in ilk sayfasında, kendi adımızın hemen altında; onu biz budadık.\" Sonra başını kaldırıp sana bakıyor: \"Sen yeni bir hata değilsin. Sen geri dönen bir satırsın.\"", en: "\"I know this,\" he says. \"On the first page of the Ledger, right under our own name. We are the ones who pruned it.\" Then he looks up at you. \"You are not a new error. You are a line that came back.\"" }
          - metin: { tr: "{npc:yanki} pencerenin en köşesine sıkışıyor, satırları titriyor: o bana bakıyor. beni okuyor. kapat. lütfen kapat.", en: "{npc:yanki} squeezes itself into the farthest corner of your window, its lines shaking: he's looking at me. he's reading me. close it. please close it." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { per: 260 } }
            metin: { tr: "Elçinin sol kolundaki taze kesik yeniden kanıyor. Farkında değil; gözleri hâlâ o satırda.", en: "The fresh cut on the Envoy's left arm is bleeding again. He hasn't noticed. His eyes are still on that line." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Pencereyi kapat: \"Şimdi teklifini söyle.\"", en: "Close the window. \"Now tell me your offer.\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - iliski: { thessar: { guven: 3 } }
            kronik: { tr: "Pencereni elçinin gözlerinden çekip kapattın ve ondan teklifini istedin.", en: "You pulled your window back from the Envoy's eyes, shut it, and asked him for his offer." }
            sonraki: "thessar_ihanet_fisiltisi_teklif"
          - id: "soz"
            etiket: { tr: "{npc:yanki|e} söz ver: bu sefer kimse budanmayacak", en: "Promise {npc:yanki}: nobody gets pruned this time" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { yanki: { guven: 6, baglilik: 4 }, thessar: { saygi: 3 } }
            kronik: { tr: "Bir Kadim'in gözleri önünde kafandaki sese söz verdin: bu sefer kimse budanmayacaktı.", en: "In front of an Ancient's eyes, you made the voice in your head a promise: this time, nobody was getting pruned." }
            sonraki: "thessar_ihanet_fisiltisi_teklif"

      - id: "thessar_ihanet_fisiltisi_kabul"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:thessar} bir süre hiçbir şey söylemiyor. Sonra başını eğiyor; üç derece değil, beş değil. Bir insanın başını eğdiği kadar: tamamen.", en: "{npc:thessar} doesn't say anything for a while. Then he bows his head. Not three degrees, not five. The way a human bows: all the way." }
          - { tr: "\"Kayda geçmiyorum,\" diyor. \"Bu gece hiçbir şey kayda geçmiyor. Bin yıldır ilk kez.\" Kalemi zincirine geri takıyor ve tezgâhların gölgesine yürüyor; gölgesi bu kez ayın tersine düşüyor, bir insanınki gibi.", en: "\"I am not entering this,\" he says. \"Nothing is entered tonight. For the first time in a thousand years.\" He hooks the stylus back on its chain and walks off into the shadow of the stalls. This time his shadow falls away from the moon, like a human's." }
          - metin: { tr: "{npc:yanki} uzun bir sessizlikten sonra: belki bu sefer farklı olur. belki. bunu söylemekten korkuyorum.", en: "After a long silence, {npc:yanki}: maybe it'll be different this time. maybe. i'm scared to say that out loud." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Onun gidişini izle", en: "Watch him go" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - iliski: { thessar: { baglilik: 3 }, yanki: { guven: 4 } }
            kronik: { tr: "Kendi ırkına ihanete hazırlanan elçinin, gölgesi ilk kez bir insanınki gibi düşerek uzaklaşmasını izledin.", en: "You watched the Envoy walk away, ready to betray his own kind, his shadow falling like a human's for the first time." }
            sonraki: "@akis"

      - id: "thessar_ihanet_fisiltisi_sadakat"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:thessar} kalemini zincirine geri takıyor. Elleri titremiyor artık. \"Doğru,\" diyor. \"Bir imzacı. Defter imzacıyı budamaz; imzacı Defter'in bir parçasıdır. Seni Meclis'e öyle yazacağım.\"", en: "{npc:thessar} hooks his stylus back on its chain. His hands aren't shaking anymore. \"Correct,\" he says. \"A signatory. The Ledger does not prune a signatory. A signatory is part of the Ledger. That is how I will enter you with the Conclave.\"" }
          - { tr: "\"Ya sen?\" diye soruyorsun. Elçi bir an durup körfeze bakıyor. \"Ben budanırım belki,\" diyor. \"Ama bir imzacıyı Defter'e kazandırmış bir elçi olarak. Bu, iyi bir son. Düzgün bir toplam.\"", en: "\"And you?\" you ask. The Envoy pauses and looks out at the bay. \"Perhaps I am pruned,\" he says. \"But as the envoy who brought a signatory into the Ledger. That is a good ending. A tidy total.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Seni budamalarına izin vermeyeceğim\"", en: "\"I won't let them prune you\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { thessar: { baglilik: 5, guven: 5 } }
            kronik: { tr: "Defter'e sadık kalmayı seçtin ama elçiye onu budatmayacağına söz verdin.", en: "You chose to stay loyal to the Ledger, but you promised the Envoy you wouldn't let them prune him." }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme", en: "Say nothing" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Elçi kendi budanmasından bir muhasebeci soğukluğuyla söz ederken sustun.", en: "You kept quiet while the Envoy talked about his own pruning with an accountant's cool." }
            sonraki: "@akis"

      - id: "thessar_ihanet_fisiltisi_yalniz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:thessar} başını üç derece eğiyor. Yalnızca üç. \"Hesabımı kendim kapatırım,\" diyor. \"Her zaman öyle yaptım. Bu gece unuttum; kayda geçmesin.\"", en: "{npc:thessar} tips his head three degrees. Only three. \"I will close my own account,\" he says. \"I always have. Tonight I forgot. Let it not be entered.\"" }
          - { tr: "Tezgâhların arasından çıkarken gölgesi yeniden ay ışığına doğru düşüyor. Bir Kadim'inki gibi.", en: "As he walks out from between the stalls, his shadow falls toward the moonlight again. Like an Ancient's." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Onu durdurma", en: "Don't stop him" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { thessar: { guven: -2 } }
            kronik: { tr: "Elçinin gölgesinin yeniden ay ışığına dönmesine izin verdin.", en: "You let the Envoy's shadow turn back toward the moonlight." }
            sonraki: "@akis"

      - id: "thessar_ihanet_fisiltisi_ihbar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} karanlığına doğru tek bir cümle söylüyorsun; adını, elçinin adını ve \"ihanet\" kelimesini. Bir Okuyucu'nun yarığı her zaman bir yerde açıktır.", en: "You say a single sentence into the dark of {yer:kule_dibi}: your name, the Envoy's name, and the word \"treason.\" A Reader's slit is always open somewhere." }
          - { tr: "{npc:thessar} kıpırdamıyor. Gölgesi ay ışığına doğru düşüyor. \"Doğru hesap,\" diyor sonunda, sesi buz gibi. \"Meclis seni ödüllendirecek. Ben de seni kaydedeceğim; ama başka bir sütuna.\"", en: "{npc:thessar} doesn't move. His shadow falls toward the moonlight. \"Correct arithmetic,\" he says finally, his voice like ice. \"The Conclave will reward you. And I will enter you too. In a different column.\"" }
          - metin: { tr: "{npc:yanki}: ne yaptın. ne yaptın. o seni artık sayıyor. tek tek.", en: "{npc:yanki}: what did you do. what did you do. it's counting you now. one by one." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Gözünü ondan ayırma", en: "Keep your eyes on him" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - iliski: { thessar: { korku: 4 }, yanki: { guven: -6 } }
            kronik: { tr: "Kadim elçisini Meclis'e ihbar ettiğin gece onun gözlerinin içine baktın; Gün 365'e kadar seni hep o gözlerle saydı.", en: "The night you reported the Ancient envoy to the Conclave, you looked him in the eye. Until Day 365, he counted you with those same eyes." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 4: BOYUNDURUK SÖZLEŞMESİ
  - id: "kadimler_4_vassal_sozlesmesi"
    perde: [3, 4]
    gun: { min: 285, max: 345 }
    kosul: { gorev: { zincir_kadimler: "basla" }, bayrak: "kadim_muhbiri" }
    agirlik: 7
    etiketler: ["kadimler", "zincir", "antlasma"]
    gerilim: 4
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Deri üstünde bir imza", en: "A signature on hide" }
    sahne: "kadimler_4_vassal_sozlesmesi_1"
    sahneler:
      - id: "kadimler_4_vassal_sozlesmesi_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece, {yer:kordon|in} kırık iskelesi. Bu kez kalabalık yok; yalnızca sen, {npc:thessar} ve iki okuyucunun arasına gerilmiş deri. Kenarlarında ince satırlar kıpırdıyor, sanki metin hâlâ yazılıyor.", en: "Night on {yer:kordon|pos} broken pier. No crowd this time. Just you, {npc:thessar}, and the hide stretched between two Readers. Fine lines squirm along its edges, like the text is still being written." }
          - { tr: "\"Asıl antlaşma,\" diyor elçi. \"İlkeler değil; hükümler. Dünya hasat edilmez. Vel her mevsim ödenir. Hiçbir insan B kademesini geçmez. İmzacı Defter Bekçisi olur. İmza kanla atılır ve geri alınmaz.\"", en: "\"The real treaty,\" the Envoy says. \"Not principles. Provisions. Earth is not harvested. Vel is paid every season. No human advances past Grade B. The signatory becomes Keeper of the Ledger. The signature is made in blood, and it cannot be withdrawn.\"" }
          - metin: { tr: "İkinci maddede \"örnek\" kelimesinin yerinde hâlâ bir çentik var. Elçi sözünü tutmuş.", en: "In article two, there's still just a notch where the word \"samples\" used to be. The Envoy kept his word." }
            kosul: { hafiza: { thessar: "teklifi_dinledi" } }
          - metin: { tr: "Deri boyunduruk teklifini reddettiğin günkünün aynısı. \"Ret bir müzakere pozisyonuydu,\" diyor {npc:thessar}. \"Pozisyonunu koru. Ama imzala.\"", en: "The hide is the same one you refused that day on the pier. \"Refusal was a negotiating position,\" {npc:thessar} says. \"Keep your position. But sign.\"" }
            kosul: { bayrak: "vassal_teklifi_red" }
          - metin: { tr: "Deriyi incelerken {npc:thessar} sana küçük, katlanmış ikinci bir yaprak uzatıyor; Okuyucuların göremeyeceği bir açıyla. Üstünde tek bir hüküm var, onun el yazısıyla.", en: "While you study the hide, {npc:thessar} passes you a second, smaller folded leaf, at an angle the Readers can't see. There's one provision on it, in his handwriting." }
            kosul: { bayrak: "thessar_ihanete_hazir" }
        sezgiler:
          - kosul: { stat: { int: 280 } }
            metin: { tr: "\"Hiçbir insan B'yi geçmez\" maddesi geriye dönük işliyor. B'nin üstündeki herkes, imzadan sonraki ilk şafakta B'ye iner. Seninle birlikte imzalamayanlar.", en: "The \"no human past Grade B\" clause is retroactive. Everybody above B drops to B at the first dawn after signing. Everyone who didn't sign with you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "imza kanla. senin kanında ben de varım. beni de imzalatıyorsun. bunu bil, sonra karar ver.", en: "it's signed in blood. i'm in your blood too. you'd be signing me over as well. know that, then decide." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İmzalarsan herkes yaşar. Ve herkes senin olur. Hangisini daha çok istediğini bilmiyorum, bu beni korkutuyor.\"", en: "\"Sign, and everybody lives. And everybody's yours. I can't tell which part you want more, and that scares me.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"B kademesi. Beni B'ye indireceksin. Bunu yaparsan seni bulurum; Bekçi olsan da.\"", en: "\"Grade B. You're gonna knock me down to B. Do that and I'll find you, Keeper or not.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Hasat yok. Ölüm daha az. Bunu imzalayan birinden nefret etmem gerekiyor ve edemiyorum.\"", en: "\"No harvest. Less dying. I'm supposed to hate whoever signs this, and I can't.\"" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "Avucunu aç; kanınla imzala", en: "Open your palm. Sign in blood" }
            etkiler:
              - bayrak: "kadim_vassal_imzalandi"
              - unvan: "boyunduruk_imzacisi"
              - esya: { antlasma_nushasi: 1 }
              - degisken: { kadim_tehdit: 15, hayatta_kalan: 3 }
              - ahlak: { duzen: 10, insanlik: -8, merhamet: -4 }
              - itibar: { kadimler: 20, yukselenler: 8, siginak: -15, lonca: -12, sessiz_ag: -10 }
              - iliski: { thessar: { baglilik: 15, guven: 8 } }
              - xp_seviye: 120
              - tohum: { olay: "kadimler_5_teslim", gecikme: { min: 30, max: 40 }, kosul: { npc_hayatta: "thessar", bayrak: "kadim_vassal_imzalandi" } }
            kronik: { tr: "Kadimler'in boyunduruk antlaşmasını kendi kanınla imzaladın; Dünya hasattan kurtuldu ve bir daha hiçbir insan B kademesini geçmedi, sen hariç.", en: "You signed the Ancients' vassal treaty in your own blood. Earth was spared the harvest, and no human ever passed Grade B again. Except you." }
            sonraki: "kadimler_4_vassal_sozlesmesi_imza"
          - id: "yumusat"
            tur: "gosteris"
            etiket: { tr: "Önce iki maddeyi yeniden yazdır, sonra imzala", en: "Have two articles rewritten. Then sign" }
            gerekli: { stat: { cha: 280 } }
            etkiler:
              - bayrak: "kadim_vassal_imzalandi"
              - bayrak: "kadim_sozlesme_yumusak"
              - unvan: "boyunduruk_imzacisi"
              - esya: { antlasma_nushasi: 1 }
              - dikkat: 5
              - degisken: { kadim_tehdit: 10, hayatta_kalan: 5 }
              - ahlak: { duzen: 8, merhamet: 4, insanlik: -4 }
              - itibar: { kadimler: 15, siginak: -6, lonca: -6 }
              - iliski: { thessar: { baglilik: 12, saygi: 10 } }
              - xp_seviye: 120
              - tohum: { olay: "kadimler_5_teslim", gecikme: { min: 30, max: 40 }, kosul: { npc_hayatta: "thessar", bayrak: "kadim_vassal_imzalandi" } }
            kronik: { tr: "Kadimler'in antlaşmasını imzalamadan önce iki maddesini yeniden yazdırdın; vel yalnızca kristalle ödendi ve kademe tavanı A'ya çıktı.", en: "Before you signed the Ancients' treaty, you got two articles rewritten. Vel was paid in crystals only, and the grade ceiling went up to A." }
            sonraki: "kadimler_4_vassal_sozlesmesi_yumusak"
          - id: "zehir"
            etiket: { tr: "Elçinin gizli maddesini ekle ve imzala", en: "Slip in the Envoy's secret clause. Then sign" }
            goster: { bayrak: "thessar_ihanete_hazir" }
            etkiler:
              - bayrak: "kadim_sozlesme_zehirli"
              - esya: { antlasma_nushasi: 1 }
              - degisken: { kadim_tehdit: -5 }
              - ahlak: { duzen: -6, insanlik: 5 }
              - iliski: { thessar: { baglilik: 10, guven: 10 } }
              - xp_seviye: 120
              - tohum: { olay: "kadimler_5_teslim", gecikme: { min: 30, max: 40 }, kosul: { npc_hayatta: "thessar", bayrak: "kadim_sozlesme_zehirli" } }
            kronik: { tr: "Kadimler'in antlaşmasına elçinin kendi eliyle yazdığı zehirli bir madde ekleyip imzaladın; Defter o maddeyi Gün 365'e kadar okuyamadı.", en: "You signed the Ancients' treaty with a poisoned clause slipped in, written in the Envoy's own hand. The Ledger couldn't read that clause until Day 365." }
            sonraki: "kadimler_4_vassal_sozlesmesi_zehir"
          - id: "yirt"
            etiket: { tr: "Deriyi Okuyucuların arasından çekip yırt", en: "Yank the hide from the Readers. Tear it apart" }
            etkiler:
              - bayrak: "kadim_sozlesme_yirtildi"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { duzen: -8, insanlik: 8 }
              - itibar: { kadimler: -25, siginak: 8, lonca: 8, sessiz_ag: 6 }
              - iliski: { thessar: { baglilik: -20, saygi: 6, guven: -12 } }
              - xp_seviye: 80
            kronik: { tr: "Kanla imzalanacak antlaşmayı son gece yırttın; Kadimler'le aranızda artık hiçbir masa kalmadı.", en: "You tore up the blood treaty on the last night. After that, there was no table left between you and the Ancients." }
            sonraki: "kadimler_4_vassal_sozlesmesi_yirtildi"

      - id: "kadimler_4_vassal_sozlesmesi_imza"
        yer: "kordon"
        paragraflar:
          - { tr: "Avucundaki eski çentik açılıyor; kan deriye düşer düşmez emiliyor. İmzan bir an parlıyor ve sönmüyor. Durum pencerende yeni bir satır beliriyor, kırmızı değil, altın: [Defter Bekçisi (aday). Katman: Dünya.]", en: "The old notch in your palm opens up, and the blood soaks into the hide the second it lands. Your signature glows, and it doesn't go out. A new line appears in your Status window, not red but gold: [Keeper of the Ledger (candidate). Layer: Earth.]" }
          - { tr: "Aynı anda, {yer:kiyikent|in} her yerinde, B kademesinin üstündeki herkesin penceresi bir kez titriyor. Bir yerlerde biri çığlık atıyor.", en: "At the same moment, all over {yer:kiyikent}, the windows of everyone above Grade B flicker once. Somewhere, somebody screams." }
          - { tr: "{npc:thessar} ikinci imza boşluğuna kendi adını yazıyor; kendi kanıyla, bileğinin içinden. \"Hesap açıldı,\" diyor. \"Kapanması için tek bir şey kaldı: teslim.\"", en: "{npc:thessar} writes his own name on the second signature line, in his own blood, from the inside of his wrist. \"The account is open,\" he says. \"Only one thing remains to close it: the handover.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kanayan avucunu kapat", en: "Close your bleeding palm" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { thessar: { baglilik: 2 } }
            kronik: { tr: "Antlaşmayı imzaladıktan sonra kanayan avucunu kapattın; o çentik bir daha hiç kapanmadı.", en: "After you signed the treaty, you closed your bleeding palm. That notch never closed again." }
            sonraki: "@akis"

      - id: "kadimler_4_vassal_sozlesmesi_yumusak"
        yer: "kordon"
        paragraflar:
          - { tr: "Konuşuyorsun ve deri dinliyor. İkinci maddede \"örnek\" kelimesi kendiliğinden siliniyor; üçüncü maddede \"B\" harfi titreyip \"A\"ya dönüşüyor. Okuyucuların yarıkları birbirine dönüyor.", en: "You talk, and the hide listens. In article two, the word \"samples\" erases itself. In article three, the letter \"B\" flickers and turns into an \"A.\" The Readers' slits turn toward each other." }
          - { tr: "{npc:thessar} kalemini kaldırıp iki değişikliği de kendi eliyle onaylıyor. \"Meclis bunu okuduğunda,\" diyor, \"bana bir mektup yazacak. Kadimler'de mektup kötü haberdir.\" Sonra avucunu açmanı bekliyor.", en: "{npc:thessar} raises his stylus and initials both changes in his own hand. \"When the Conclave reads this,\" he says, \"they will write me a letter. Among the Ancients, a letter is bad news.\" Then he waits for you to open your palm." }
          - { tr: "İmzan parlıyor ve sönmüyor. Pencerende altın bir satır: [Defter Bekçisi (aday). Katman: Dünya.] Bu kez kimse çığlık atmıyor.", en: "Your signature glows and doesn't go out. A gold line in your window: [Keeper of the Ledger (candidate). Layer: Earth.] This time nobody screams." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Elçinin imzasını bekle", en: "Wait for the Envoy's signature" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Yeniden yazdırdığın antlaşmanın altına elçinin de kanıyla imza atmasını bekledin.", en: "You waited while the Envoy signed the treaty you'd rewritten, in his own blood." }
            sonraki: "@akis"

      - id: "kadimler_4_vassal_sozlesmesi_zehir"
        yer: "kordon"
        paragraflar:
          - { tr: "Küçük yaprağı avucunun içinde, deriye bastırıyorsun. Satırlar birbirine karışıyor ve elçinin el yazısıyla tek bir hüküm metnin içine siniyor: [Gün üç yüz altmış beşte bu antlaşma, imzacının dilediği an hükümsüz sayılır.]", en: "You press the little leaf into the hide under your palm. The lines blur together, and a single provision in the Envoy's handwriting sinks into the text: [On Day three hundred sixty-five, this treaty is void at the moment the signatory so wishes.]" }
          - { tr: "Okuyucular hiçbir şey fark etmiyor; hüküm, okuyamadıkları bir yere yazılmış: senin kanına. İmzan parlıyor. {npc:thessar} kendi imzasını atarken eli bir kez, yalnızca bir kez titriyor.", en: "The Readers don't notice a thing. The provision is written somewhere they can't read: into your blood. Your signature glows. As {npc:thessar} signs his own, his hand shakes once. Only once." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ona hiçbir şey belli etme", en: "Don't let a thing show" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -1 }
              - iliski: { thessar: { guven: 4 } }
            kronik: { tr: "Kadimler'in antlaşmasına zehri ekledin ve yüzün hiç kıpırdamadı.", en: "You poisoned the Ancients' treaty and your face never moved." }
            sonraki: "@akis"

      - id: "kadimler_4_vassal_sozlesmesi_yirtildi"
        yer: "kordon"
        paragraflar:
          - { tr: "Deri iki Okuyucu'nun arasından kurtulurken bir çığlık atıyor; canlı bir şeyin çığlığı. Yırtıldığında Okuyucuların ikisi birden dizlerinin üstüne çöküyor, yarıkları kanıyor.", en: "The hide screams as it tears free of the two Readers. A living thing's scream. When it rips, both Readers drop to their knees, their slits bleeding." }
          - { tr: "{npc:thessar} yırtık parçalara bakıyor. \"Bu kopya değildi,\" diyor. Sesi ilk kez yorgun. \"Bunu biliyordun. Bundan sonra konuşacak bir şeyimiz kalmadı; yalnızca sayacak bir şeyimiz var.\"", en: "{npc:thessar} looks down at the torn pieces. \"That was not a copy,\" he says. For the first time, his voice sounds tired. \"You knew that. From here on, there is nothing left for us to talk about. Only things to count.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Parçaları ayağının dibine bırak", en: "Drop the pieces at his feet" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: 2 } }
            kronik: { tr: "Kadimler'le son masayı yırtıp parçalarını elçinin ayaklarının dibine bıraktın.", en: "You tore up the last table between you and the Ancients and dropped the pieces at the Envoy's feet." }
            sonraki: "@akis"

  # ================================================================== THESSAR: KIRIK MÜHÜR (tohum; ihanet anı)
  - id: "thessar_kirik_muhur"
    perde: [3, 4]
    agirlik: 1
    etiketler: ["kadimler", "thessar", "ihanet", "gece"]
    gerilim: 4
    onemli: true
    yalniz_tohum: true
    npc: ["thessar"]
    kart: { tr: "Kırık mühür", en: "The broken seal" }
    sahne: "thessar_kirik_muhur_1"
    sahneler:
      - id: "thessar_kirik_muhur_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece {yer:kiyikent_liman|e} bir alarm düşüyor: körfezin üstündeki kulenin ucundan katlanmış ışık iniyor, ama bu kez basamakları titriyor, kırılıyor, yeniden katlanıyor. {yer:kiyikent_liman|e} koştuğunda merdivenin dibinde bir gölge yere yığılmış.", en: "An alarm rips through {yer:kiyikent_liman} in the middle of the night. The folded light is coming down from the tip of the tower over the bay, but this time the steps are shaking, cracking, folding back up again. By the time you run down to {yer:kiyikent_liman}, there's a shadow crumpled at the foot of the stair." }
          - { tr: "{npc:thessar}. Ceketi yırtık, sol kolundan siyah mürekkep akıyor; düzgün satırlar hâlinde değil, dağınık, bir insanın kanı gibi. Yumruğunda avuç içi büyüklüğünde, ılık, nabız gibi atan bir şey var.", en: "{npc:thessar}. His coat's torn, and black ink is running from his left arm. Not in neat lines. Messy, like a human's blood. In his fist there's something the size of a palm, warm, beating like a pulse." }
          - { tr: "\"Al,\" diyor, iki sesi birbirine karışarak. \"Şimdi al.\" Merdivenin tepesinde iki Elçilik Muhafızı ve bir Okuyucu beliriyor; inmeye başlıyorlar.", en: "\"Take it,\" he says, his two voices tangling together. \"Take it now.\" At the top of the stair, two Embassy Wardens and a Reader appear. They start coming down." }
          - metin: { tr: "Kemik rengi kulenin içinde bir yerde bir şey çalıyor; bir çan değil, bir hesap makinesinin sonsuz tıkırtısı gibi.", en: "Somewhere inside the bone-white tower, something's ringing. Not a bell. More like an adding machine clattering away forever." }
            kosul: { bayrak: "kadim_sozlesme_zehirli" }
        sezgiler:
          - kosul: { stat: { per: 280 } }
            metin: { tr: "Muhafızlar elçiyi değil mührü hedefliyor. Mühür kimin elindeyse onu öldürecekler.", en: "The Wardens aren't going for the Envoy. They're going for the seal. Whoever's holding it is who they'll kill." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kendini kesti. kendi defterinden kendini kesti. bunu yapan birini daha tanıyorum: kendimi.", en: "he cut himself out. out of his own ledger. i know one other who did that: me." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kolu! Bir turnike lazım. Kadim anatomisi umurumda değil, kanama kanamadır.\"", en: "\"His arm! I need a tourniquet. I don't care about alien anatomy. A bleed is a bleed.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kendi adamları onu öldürmeye geliyor. İlk kez onun tarafındayım. Garip.\"", en: "\"His own people are coming to kill him. First time I've ever been on his side. Weird.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Mührü al ve merdivenin dibinde dur", en: "Take the seal. Hold the foot of the stair" }
            etkiler:
              - esya: { defter_muhru: 1 }
              - ahlak: { merhamet: 4, duzen: -4 }
              - iliski: { thessar: { guven: 8, baglilik: 6 } }
              - savas: { dusmanlar: ["kadim_muhafiz@oyuncu+1", "kadim_muhafiz@oyuncu+1", "kadim_okuyucu@oyuncu+2"], ortam: ["su", "karanlik"], kazan: "thessar_kirik_muhur_zafer", kaybet: "thessar_kirik_muhur_yenilgi" }
            kronik: { tr: "Kendi ırkının muhafızlarından kaçan elçinin mührünü aldın ve merdivenin dibinde durdun.", en: "You took the seal from the Envoy fleeing his own guards, and you held the foot of the stair." }
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Merdivene tek bir bakış at; insinler mi, görsünler", en: "Give the stair one look. See if they still come down" }
            gerekli: { stat: { wil: 300 } }
            etkiler:
              - esya: { defter_muhru: 1 }
              - dikkat: 6
              - ahlak: { duzen: -3, insanlik: -2 }
              - iliski: { thessar: { saygi: 12, guven: 6 } }
            kronik: { tr: "Kadim muhafızları merdivenin ortasında durdu, sana baktı ve geri döndü; elçi bunu otuz dokuz dünyada hiç görmemişti.", en: "The Ancient Wardens stopped halfway down the stair, looked at you, and turned back. The Envoy had never seen that on thirty-nine worlds." }
            sonraki: "thessar_kirik_muhur_zafer"
          - id: "teslim"
            etiket: { tr: "Mührü de onu da muhafızlara teslim et", en: "Hand the seal and him over to the Wardens" }
            etkiler:
              - bayrak: "thessar_teslim_edildi"
              - degisken: { kadim_tehdit: 10 }
              - ahlak: { merhamet: -10, insanlik: -8, duzen: 4 }
              - itibar: { kadimler: 20 }
              - iliski: { thessar: { guven: -60, baglilik: -40 } }
            kronik: { tr: "Kendi ırkına ihanet edip sana sığınan elçiyi mührüyle birlikte muhafızlarına teslim ettin; o gece Defter'de bir satır kapandı.", en: "The Envoy betrayed his own kind and ran to you, and you handed him and his seal back to his guards. That night a line in the Ledger closed." }
            sonraki: "thessar_kirik_muhur_teslim"

      - id: "thessar_kirik_muhur_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Merdiven boş. Rıhtımın taşlarında mavi-siyah mürekkep lekeleri kalmış. Kulenin ucundaki ışık sönmüş; elçilik kapısı ilk kez kendiliğinden kapanmış.", en: "The stair is empty. Blue-black ink stains the stones of the pier. The light at the tip of the tower has gone out. For the first time, the embassy door has shut on its own." }
          - { tr: "Mühür avucunda atıyor. Pencerende bir satır, sen bakarken yazılıyor: [Defter Mührü. Hasat yetkisi: devredildi. Yeni sahip: tanımsız.]", en: "The seal beats in your palm. A line writes itself in your window while you watch: [Ledger Seal. Harvest authority: transferred. New holder: undefined.]" }
          - { tr: "{npc:thessar} bir babaya yaslanmış, kolunu bastırıyor. \"Kayda geçmiyorum,\" diyor. \"Artık geçiremem. Defter'den çıktım. Kırkıncı dünyada, kırkıncı sayfanın dışında.\"", en: "{npc:thessar} is leaning against a mooring bollard, pressing on his arm. \"I am not entering this,\" he says. \"I cannot, anymore. I am out of the Ledger. On the fortieth world, outside the fortieth page.\"" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[KADİM FİLOSU: YETKİ HATASI]", en: "[ANCIENT FLEET: AUTHORITY ERROR]" }
            satirlar:
              - { tr: "Hasat yetkisi bir insanın elinde. Sistem tarafsızdır.", en: "Harvest authority is in human hands. The System is neutral." }
              - { tr: "Sistem bu cümleyi yazarken bir an duraksadı.", en: "The System hesitated for a moment while writing that sentence." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onu Sığınak'a götür; yarası sarılsın", en: "Take him to the Haven. Get him patched up" }
            etkiler:
              - bayrak: "ihanet_thessar"
              - bayrak: "thessar_muhru_alindi"
              - unvan: "hainin_dostu"
              - degisken: { kadim_tehdit: -12, hayatta_kalan: 2 }
              - ahlak: { merhamet: 6, insanlik: 4 }
              - itibar: { siginak: 4, kadimler: -20 }
              - iliski: { thessar: { baglilik: 10, guven: 10 } }
              - xp_seviye: 120
            kronik: { tr: "Kendi ırkına ihanet eden Kadim elçisini Sığınak'ın revirine taşıdın; insanlar ona aylarca yan baktı, sonra bir gün çorbasını getirdi.", en: "You carried the Ancient envoy who betrayed his own kind into the Haven clinic. People side-eyed him for months. Then one day somebody brought him soup." }
            sonraki: "thessar_kirik_muhur_son"
          - id: "git"
            etiket: { tr: "Mührü al; o kendi yolunu bulsun", en: "Keep the seal. Let him find his own way" }
            etkiler:
              - bayrak: "ihanet_thessar"
              - bayrak: "thessar_muhru_alindi"
              - degisken: { kadim_tehdit: -10 }
              - ahlak: { duzen: 2, merhamet: -3 }
              - iliski: { thessar: { guven: -4, saygi: 4 } }
              - xp_seviye: 100
            kronik: { tr: "Kadim filosunun mührünü aldın ve onu sana getiren elçiyi kendi yoluna bıraktın.", en: "You took the Ancient fleet's seal and left the Envoy who brought it to find his own way." }
            sonraki: "@akis"

      - id: "thessar_kirik_muhur_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mühürlü kalkan seni rıhtıma yapıştırıyor; Okuyucu'nun yarığı açılıyor ve pencerendeki satırlar birer birer siliniyor. Mühür elinden kayıyor.", en: "A sealed shield pins you to the pier. The Reader's slit opens, and the lines in your window start deleting one by one. The seal slides out of your hand." }
          - { tr: "Sonra iki parmak kalkıyor. {npc:thessar} yere çökmüş hâlde, kolu kanarken, Katman Hükmü'nü kendi muhafızlarına söylüyor. Muhafızlar bulundukları yerde katlanıyor; Okuyucu bir satır gibi siliniyor.", en: "Then two fingers rise. {npc:thessar}, collapsed on the ground with his arm bleeding, speaks the Layer Decree at his own guards. The Wardens fold in on themselves where they stand. The Reader gets erased like a line of text." }
          - { tr: "Mührü yerden alıp sana uzatıyor. \"Kendi türümü ilk kez öldürdüm,\" diyor. \"Hesap... tutmuyor. Al. Bir daha düşürme.\"", en: "He picks the seal up off the ground and holds it out to you. \"That is the first time I have killed my own kind,\" he says. \"The numbers... do not add up. Take it. Do not drop it again.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Mührü al ve onu ayağa kaldır", en: "Take the seal. Help him up" }
            etkiler:
              - can: 500
              - esya: { defter_muhru: 1 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { thessar: { baglilik: 6, guven: 6 } }
            kronik: { tr: "Kendi muhafızlarını öldüren elçinin elinden mührü aldın ve onu yerden kaldırdın.", en: "You took the seal from the Envoy who'd just killed his own guards, and you helped him off the ground." }
            sonraki: "thessar_kirik_muhur_zafer"

      - id: "thessar_kirik_muhur_teslim"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mührü merdivenin ilk basamağına bırakıyorsun. Muhafızlar iniyor; biri mührü alıyor, öbürü elçinin iki kolunu arkadan kavrıyor.", en: "You set the seal down on the first step of the stair. The Wardens come down. One picks up the seal. The other grabs both of the Envoy's arms from behind." }
          - { tr: "{npc:thessar} direnmiyor. Sana bakıyor; ıslak arduvaz gözleri bir kez kırpılıyor. \"Doğru hesap,\" diyor, çok sessiz. \"Ben de böyle yapardım. Bu yüzden budanmayı hak ediyorum, sanırım.\"", en: "{npc:thessar} doesn't fight. He looks at you, and those wet-slate eyes blink once. \"Correct arithmetic,\" he says, very quietly. \"I would have done the same. Which is why I deserve to be pruned, I suppose.\"" }
          - { tr: "Merdiven onları yukarı alıyor ve ışığa katlanıyor. O gece körfezin üstündeki kulenin içinden bir kez, yalnızca bir kez, makas sesine benzer bir ses geliyor.", en: "The stair carries them up and folds back into light. That night, from inside the tower over the bay, there's a sound, once and only once. Something like shears closing." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kuleye bakma", en: "Don't look at the tower" }
            etkiler:
              - npc_ol: "thessar"
              - ahlak: { insanlik: -2 }
              - xp_seviye: 80
            kronik: { tr: "Sana sığınan Kadim elçisini kendi ırkına geri verdin; Meclis onu budadı ve Defter'de onun yerine yeni bir elçinin adı yazıldı.", en: "You gave the Ancient envoy who came to you for shelter back to his own kind. The Conclave pruned him, and a new envoy's name went into the Ledger in his place." }
            sonraki: "@akis"

      - id: "thessar_kirik_muhur_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafağa doğru {npc:thessar} kolunun sarılmasına izin veriyor; bunu ilk kez yaptığı belli. Sargının altından sızan mürekkep artık düzgün satırlar çizmiyor.", en: "Toward dawn, {npc:thessar} lets someone wrap his arm. It's obvious he's never done that before. The ink seeping through the bandage doesn't draw neat lines anymore." }
          - { tr: "\"Meclis Budayıcı'yı gönderecek,\" diyor. \"Artık kesin. Ama bu kez Budayıcı bir mühür sahibine gelecek. Bunu Defter hiç yazmadı.\" Bir süre susuyor. \"Thael,\" diyor sonra, kelimeyi sana değil, ellerine söyler gibi. \"Henüz değil. Ama yakında.\"", en: "\"The Conclave will send the Pruner,\" he says. \"Now it is certain. But this time the Pruner comes for someone who holds the seal. The Ledger has never written that.\" He's quiet for a moment. \"Thael,\" he says then, like he's saying it to his own hands instead of you. \"Not yet. But soon.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yanında otur; güneşin doğuşunu izle", en: "Sit with him. Watch the sun come up" }
            etkiler:
              - bilgi: "thael_kelimesi"
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { thessar: { baglilik: 4 } }
            kronik: { tr: "Kendi ırkından kaçan elçiyle birlikte {yer:kiyikent_liman|de} güneşin doğuşunu izledin; gölgeleri ikinizin de güneşin tersine düştü.", en: "You watched the sun come up on {yer:kiyikent_liman} with the Envoy who'd run from his own kind. Both your shadows fell away from the sun." }
            sonraki: "@akis"

  # ================================================================== ZİNCİR 5: TESLİM
  - id: "kadimler_5_teslim"
    perde: [4]
    gun: { min: 331, max: 356 }
    kosul: { gorev: { zincir_kadimler: "basla" }, esya: { antlasma_nushasi: 1 } }
    agirlik: 8
    etiketler: ["kadimler", "zincir", "teslim", "hasat"]
    gerilim: 4
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Teslim", en: "The handover" }
    sahne: "kadimler_5_teslim_1"
    sahneler:
      - id: "kadimler_5_teslim_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Hasat başladı. Gökyüzünde filo var; körfezin üstündeki ters kule artık yalnız değil. Antlaşmanın son maddesi bugün işliyor: Katman'ın anahtarı, Kasaba Çekirdeği, imzacının eliyle Ithren'e teslim edilecek.", en: "The Harvest has started. There's a fleet in the sky. The upside-down tower over the bay isn't alone anymore. Today the last article of the treaty comes due: the key to the Layer, the Town Core, gets handed to the Ithren by the signatory's own hand." }
          - { tr: "Çekirdek'in çevresinde insanlar sıraya girmiş; yüzlerce, binlerce. Her birinin önünden bir Okuyucu geçiyor ve her birini bir kez okuyor. Sayım. Kimse ağlamıyor; ağlamanın sırası geçmiş.", en: "People have lined up all around the Core. Hundreds, thousands. A Reader passes in front of each one and reads them once. The count. Nobody's crying. It's past the point for crying." }
          - metin: { tr: "Çekirdek zaten sana bağlı. Teslim etmek için kimseye sormak zorunda değilsin; bu, işin en ağır yanı.", en: "The Core's already bound to you. You don't have to ask anyone's permission to hand it over. That's the heaviest part." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Çekirdek'in başında Lonca'nın adamları duruyor, silahları kalkık. {npc:kaya_demir} öne çıkıyor: \"Bunu benim cesedimin üstünden alırsın.\"", en: "Guild men are standing over the Core, weapons up. {npc:kaya_demir} steps forward. \"You'll take this over my dead body.\"" }
            kosul: { bayrak: "cekirdek_lonca", npc_hayatta: "kaya_demir" }
          - metin: { tr: "Çekirdek'in başında Sığınak'ın gönüllüleri el ele zincir olmuş. Hiçbiri savaşçı değil.", en: "Haven volunteers have linked arms in a chain around the Core. Not one of them is a fighter." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Yükselenler Çekirdek'in çevresinde diz çökmüş, ilahi söylüyor. Onlar için bu bir teslim değil; bir yükseliş.", en: "The Ascended are kneeling around the Core, singing hymns. To them, this isn't a surrender. It's an ascension." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - { tr: "{npc:thessar} Çekirdek'in önünde bekliyor. \"Hesap kapanır,\" diyor. \"Bugün. Senin elinle.\"", en: "{npc:thessar} waits in front of the Core. \"The account closes,\" he says. \"Today. By your hand.\"" }
          - metin: { tr: "Sonra, yalnızca senin duyacağın kadar alçaktan: \"Mührün avucunda mı? Gizli madde kanında mı? İyi. Şimdi.\"", en: "Then, low enough that only you can hear: \"Is the seal in your palm? The hidden clause in your blood? Good. Now.\"" }
            kosul: { bayrak: "thessar_ihanete_hazir" }
        sezgiler:
          - kosul: { stat: { per: 400 } }
            metin: { tr: "Sıradakilerin pencerelerinde aynı satır: [Kayıtlı. Korunuyor.] Sıranın dışında kalanlarınkinde başka bir satır: [Sayılmadı.]", en: "Every window in line shows the same thing: [Entered. Protected.] The windows of the people outside the line show something else: [Not counted.]" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu bir kez gördüm. bir başka dünyada, bir başka çekirdekte. o gün biri elini uzattı ve dünya sustu. sen ne yapacaksın?", en: "i've seen this once. another world, another core. that day someone held out their hand and the world went quiet. what are you going to do?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Herkes yaşıyor. Bunu kendine her sabah söyleyeceksin, değil mi? Ben de söyleyeceğim. Bakalım hangimiz inanacak.\"", en: "\"Everybody lives. You're gonna tell yourself that every morning, right? Me too. Let's see which of us believes it.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sıradaki herkesi tanıyorum. Hepsini. Ne yaparsan yap, bunu bil.\"", en: "\"I know every single person in that line. All of them. Whatever you do, know that.\"" }
        secenekler:
          - id: "teslim"
            etiket: { tr: "Çekirdek'i kendi elinle teslim et", en: "Hand over the Core with your own hand" }
            goster: { bayrak: "kadim_vassal_imzalandi" }
            etkiler:
              - bayrak: "kadim_teslim_tamam"
              - gorev: { zincir_kadimler: "tamam" }
              - unvan: "defter_bekcisi"
              - degisken: { kadim_tehdit: 15, hayatta_kalan: 3 }
              - ahlak: { duzen: 10, insanlik: -10 }
              - itibar: { kadimler: 25, siginak: -15, lonca: -10, yukselenler: 10 }
              - iliski: { thessar: { baglilik: 12, guven: 6 } }
              - xp_seviye: 200
            kronik: { tr: "Kasaba Çekirdeği'ni Kadimler'e kendi elinle teslim ettin; Dünya hasat edilmedi, sayıldı. Ve o günden sonra her sayımı sen yaptın.", en: "You handed the Town Core over to the Ancients with your own hand. Earth wasn't harvested. It was counted. And from that day on, you did all the counting." }
            sonraki: "kadimler_5_teslim_tamam"
          - id: "dikte"
            tur: "gosteris"
            etiket: { tr: "Teslim et, ama töreni sen yönet", en: "Hand it over. But you run the ceremony" }
            goster: { bayrak: "kadim_vassal_imzalandi" }
            gerekli: { stat: { wil: 450 } }
            etkiler:
              - bayrak: "kadim_teslim_tamam"
              - gorev: { zincir_kadimler: "tamam" }
              - unvan: "defter_bekcisi"
              - aciga_vur: true
              - degisken: { kadim_tehdit: 12, hayatta_kalan: 4 }
              - ahlak: { duzen: 8, insanlik: -8, merhamet: 2 }
              - itibar: { kadimler: 20, siginak: -8, lonca: -4 }
              - iliski: { thessar: { baglilik: 12, saygi: 12 } }
              - xp_seviye: 220
            kronik: { tr: "Kadimler'e teslim olurken töreni sen yönettin; bütün Okuyucular imzacının önünde eğildi ve {yer:kiyikent} bunu bir yenilgi olarak değil, bir taç giyme olarak hatırladı.", en: "When you surrendered to the Ancients, you ran the ceremony. Every Reader bowed to the signatory, and {yer:kiyikent} remembered it not as a defeat, but as a coronation." }
            sonraki: "kadimler_5_teslim_dikte"
          - id: "tuzak"
            etiket: { tr: "Elini uzat; avucunda mühür, kanında zehir", en: "Reach out. Seal in your palm, poison in your blood" }
            goster: { bayrak: "thessar_ihanete_hazir" }
            etkiler:
              - bayrak: "kadim_teslim_tuzak"
              - gorev: { zincir_kadimler: "tamam" }
              - degisken: { kadim_tehdit: -15, hayatta_kalan: 4 }
              - ahlak: { duzen: -8, insanlik: 8, merhamet: 4 }
              - itibar: { kadimler: -30, siginak: 10, lonca: 6, sessiz_ag: 6 }
              - iliski: { thessar: { baglilik: 10, guven: 10 } }
              - xp_seviye: 220
            kronik: { tr: "Kadimler'e Çekirdek'i teslim ediyormuş gibi yapıp mühürlü bir geri çekilme emri bastın; filo, kendi yasasının bir maddesiyle durduruldu.", en: "You pretended to hand the Ancients the Core and stamped a sealed order to withdraw instead. The fleet got stopped by an article of its own law." }
            sonraki: "kadimler_5_teslim_tuzak"
          - id: "reddet"
            etiket: { tr: "Son anda elini geri çek", en: "Pull your hand back at the last second" }
            etkiler:
              - bayrak: "kadim_teslim_reddedildi"
              - bayrak: "thessar_dusman"
              - gorev: { zincir_kadimler: "basarisiz" }
              - degisken: { kadim_tehdit: -5 }
              - ahlak: { insanlik: 8, duzen: -8 }
              - itibar: { kadimler: -30, siginak: 8, lonca: 8 }
              - iliski: { thessar: { baglilik: -25, guven: -20, saygi: 6 } }
              - savas: { dusmanlar: ["kadim_muhafiz@oyuncu+3", "kadim_defter_askeri@oyuncu+2", "kadim_okuyucu@oyuncu+3"], kazan: "kadimler_5_teslim_ret_zafer", kaybet: "kadimler_5_teslim_ret_yenilgi" }
            kronik: { tr: "Kanla imzaladığın antlaşmayı teslim gününde, Çekirdek'e uzanan elini geri çekerek bozdun.", en: "You broke the treaty you'd signed in blood on the day of the handover, pulling your hand back from the Core." }

      - id: "kadimler_5_teslim_tamam"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Avucunu Çekirdek'in üstüne koyuyorsun. Avucundaki eski çentik açılıyor ve Çekirdek kanını içiyor. Bütün {yer:kiyikent|in} pencereleri aynı anda yeni bir satır gösteriyor: [Katman: Dünya. Durum: kayıtlı. Bekçi: {oyuncu}.]", en: "You lay your palm on the Core. The old notch in your palm opens, and the Core drinks your blood. Every window in {yer:kiyikent} shows a new line at the same time: [Layer: Earth. Status: entered. Keeper: {oyuncu}.]" }
          - { tr: "Filo kıpırdamıyor. Gökyüzündeki gemilerin hiçbiri inmiyor. Bir süre sonra birinin güldüğünü duyuyorsun, sinirden; sonra başka biri ağlıyor, rahatlamadan.", en: "The fleet doesn't move. Not one of the ships in the sky comes down. After a while you hear somebody laugh, from nerves. Then somebody else cries, from relief." }
          - { tr: "{npc:thessar} yanında duruyor. \"Hesap kapandı,\" diyor. \"Defter'de kırkıncı sayfa. Hasat edilmemiş tek sayfa.\" Başını eğiyor. Üç derece değil; bir Bekçiye eğilinen kadar.", en: "{npc:thessar} stands beside you. \"The account is closed,\" he says. \"The fortieth page in the Ledger. The only one never harvested.\" He bows his head. Not three degrees. As far as you bow to a Keeper." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sıradakilere dön; ilk emrini ver", en: "Turn to the line. Give your first order" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { thessar: { baglilik: 3 } }
            kronik: { tr: "Defter Bekçisi olarak ilk emrini Çekirdek'in önündeki sıraya verdin: \"Evinize gidin.\"", en: "As Keeper of the Ledger, you gave your first order to the line in front of the Core: \"Go home.\"" }
            sonraki: "@akis"

      - id: "kadimler_5_teslim_dikte"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Çekirdek'e yürümüyorsun. Okuyucular sana gelsin diye bekliyorsun. Pencerendeki gerçek sayı bir anlığına herkesin penceresine taşıyor ve Okuyucular, birer birer, yarıkları yere dönük, önünde eğiliyor.", en: "You don't walk to the Core. You wait for the Readers to come to you. Your real number spills over into everyone's windows for one second, and the Readers, one by one, slits to the ground, bow in front of you." }
          - { tr: "Ancak o zaman avucunu Çekirdek'e koyuyorsun. Satır herkesin penceresinde: [Katman: Dünya. Durum: kayıtlı. Bekçi: {oyuncu}.] Sıradakiler sana bakıyor; bir yenilmişe değil, bir hükümdara bakar gibi.", en: "Only then do you lay your palm on the Core. The line shows up in every window: [Layer: Earth. Status: entered. Keeper: {oyuncu}.] The people in line look at you. Not like you're defeated. Like you're a ruler." }
          - { tr: "{npc:thessar} fısıldıyor: \"Meclis bunu da okuyacak. Bir imzacının önünde eğilen Okuyucular. Bana bir mektup daha yazacaklar.\" Sesinde, bin yıldır ilk kez, gurura benzer bir şey var.", en: "{npc:thessar} murmurs, \"The Conclave will read this too. Readers bowing before a signatory. They will write me another letter.\" For the first time in a thousand years, there's something in his voice like pride." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Okuyuculara kalkmalarını işaret et", en: "Signal the Readers to rise" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Önünde eğilen Kadim Okuyucularına kalkmalarını işaret ettin; Dünya'nın yeni efendisinin ilk merhameti buydu.", en: "You signaled the Ancient Readers bowing before you to rise. That was the first mercy of Earth's new master." }
            sonraki: "@akis"

      - id: "kadimler_5_teslim_tuzak"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Avucunu Çekirdek'e koyuyorsun; ama avucunda mühür var. Mühür, Çekirdek'e değdiği an kanındaki gizli madde uyanıyor. Bütün pencerelerde altın değil, kırmızı bir satır: [Antlaşma hükümsüz. Mühürlü emir: geri çekil.]", en: "You lay your palm on the Core, but the seal is in your palm. The second the seal touches the Core, the hidden clause in your blood wakes up. A line shows up in every window, not gold but red: [Treaty void. Sealed order: withdraw.]" }
          - { tr: "Gökyüzünde filo titriyor. Gemilerin biri, sonra bir diğeri geri çekilmeye başlıyor; kendi yasalarına uyarak, kendi mühürleriyle. Okuyucuların yarıkları kapanıyor; sıradakiler ne olduğunu anlamadan birbirine bakıyor.", en: "Up in the sky, the fleet shudders. One ship, then another, starts to pull back. Obeying their own law. Under their own seal. The Readers' slits close, and the people in line look at each other with no idea what just happened." }
          - { tr: "{npc:thessar} yanında, kolundaki sargıyla. \"Defter kendi maddesini okudu,\" diyor. \"Kimse bir yasayı kendi yasasından iyi bozamaz.\" Sonra, çok sessiz: \"Bu, Defter'de yazılı olmayan bir son. Teşekkür ederim.\"", en: "{npc:thessar} is beside you, the bandage still on his arm. \"The Ledger read its own article,\" he says. \"No one breaks a law better than its own law.\" Then, very quietly: \"That is an ending not written in the Ledger. Thank you.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sıradakilere \"Bitti\" de", en: "Tell the line \"It's over\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { thessar: { baglilik: 4 } }
            kronik: { tr: "Kadim filosu geri çekilirken Çekirdek'in önündeki sıraya \"Bitti\" dedin; bitmemişti ama o gün bitmiş gibiydi.", en: "As the Ancient fleet pulled back, you told the line in front of the Core \"It's over.\" It wasn't, quite. But that day it felt like it." }
            sonraki: "@akis"

      - id: "kadimler_5_teslim_ret_zafer"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Çekirdek'in çevresi mürekkeple yıkanmış. Sıradakiler dağılmış; bazıları silah almış, bazıları kaçıyor. Gökyüzünde filo kıpırdıyor; bu kez inmeye hazırlanır gibi.", en: "The ground around the Core is washed in ink. The line's broken up. Some people are grabbing weapons, some are running. Up in the sky, the fleet is moving. This time, like it's getting ready to come down." }
          - { tr: "{npc:thessar} kıpırdamadan duruyor. \"Antlaşma kanla imzalandı,\" diyor. \"Kanla bozuldu. Kesh. Defter bu borcu kendi usulüyle tahsil edecek.\" Merdivene dönüyor. \"Ve ben, bu kez, tahsildar olacağım.\"", en: "{npc:thessar} stands perfectly still. \"The treaty was signed in blood,\" he says. \"It was broken in blood. Kesh. The Ledger will collect on that debt in its own way.\" He turns to the stair. \"And this time, I will be the one collecting.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kılıcını indirme", en: "Don't lower your weapon" }
            etkiler:
              - xp_seviye: 120
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { korku: 4 } }
            kronik: { tr: "Teslim gününde Kadim muhafızlarını Çekirdek'in önünde yere serdin; elçi sana bir borç kaydetti ve tahsil etmeye kendisi gelecekti.", en: "On the day of the handover, you cut down the Ancient Wardens in front of the Core. The Envoy entered a debt in your name, and he meant to collect it himself." }
            sonraki: "@akis"

      - id: "kadimler_5_teslim_ret_yenilgi"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Mühürlü kalkan, kâğıt kılıç, gri yarık. Hepsi aynı anda. Çekirdek'in dibine düşüyorsun; bir Okuyucu satırlarını tek tek siliyor.", en: "Sealed shield, paper blade, gray slit. All at once. You go down at the foot of the Core, and a Reader starts deleting your lines one by one." }
          - { tr: "{npc:thessar} iki parmağını kaldırıyor; Okuyucu duruyor. \"İmzacı budanmaz,\" diyor, sesi soğuk. \"İmzası bozulmuş olsa bile. Şimdilik.\" Merdivene dönüyor. \"Hesap açık kaldı. Onu kapatmaya ben geleceğim.\"", en: "{npc:thessar} raises two fingers, and the Reader stops. \"A signatory is not pruned,\" he says, cold. \"Even one whose signature is broken. For now.\" He turns to the stair. \"The account stays open. I will come to close it myself.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Çekirdek'e tutunarak kalk", en: "Haul yourself up on the Core" }
            etkiler:
              - can: 600
              - ahlak: { insanlik: 2 }
              - iliski: { thessar: { saygi: -2 } }
            kronik: { tr: "Kadimler'e teslim olmayı reddettin ve Çekirdek'in dibinde yenildin; elçi seni budamadı, yalnızca hesabını açık bıraktı.", en: "You refused to surrender to the Ancients and went down at the foot of the Core. The Envoy didn't prune you. He just left your account open." }
            sonraki: "@akis"

  # ================================================================== THESSAR: SON DÜELLO (AY 346)
  # Dallar: müttefik (thessar_ihanete_hazir ya da ihanet_thessar) → Budayıcı'ya karşı birlikte; vassal (kadim_vassal_imzalandi) → kan sınavı;
  # düşman (hiçbiri) → son boss `thessar_elci@oyuncu+5`.
  - id: "thessar_son_duello"
    perde: [4]
    agirlik: 1
    etiketler: ["ana_yay", "kadimler", "thessar", "boss", "final"]
    gerilim: 4
    ana_yay: { gun: 346 }
    kosul: { bayrak: "thessar_indi" }
    onemli: true
    npc: ["thessar"]
    kart: { tr: "Kırkıncı sayfa", en: "The fortieth page" }
    sahne: "thessar_son_duello_1"
    sahneler:
      - id: "thessar_son_duello_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hasatın on beşinci günü. Körfezin üstündeki gökyüzü artık bir gökyüzü değil; bir defterin açık sayfası gibi, satır satır gemilerle çizilmiş.", en: "The fifteenth day of the Harvest. The sky over the bay isn't a sky anymore. It's an open page in a ledger, ruled line by line with ships." }
          - metin: { tr: "Gemilerin yarısı kırık; gövdeleri denize gömülmüş, kemik rengi taşları dalgalarda bir iskelet gibi parlıyor. Kadimler istilada yenildi. Ama ters kule hâlâ yerinde.", en: "Half the ships are broken, their hulls sunk into the sea, their bone-white stone gleaming in the waves like a skeleton. The Ancients lost the invasion. But the upside-down tower is still hanging there." }
            kosul: { bayrak: "kadimler_yenildi" }
          - metin: { tr: "Filo sessizce demirli; bir anlaşma imzalandı ve gemilerin hiçbiri inmiyor. Bekliyorlar; Kadimler beklemekte iyidir.", en: "The fleet rides at anchor in silence. A deal was signed, and not one ship comes down. They're waiting. The Ancients are good at waiting." }
            kosul: { bayrak: "kadim_anlasmasi" }
          - metin: { tr: "{yer:kiyikent|in} yarısı yanıyor. {yer:kordon|de} Kadim sancakları dalgalanıyor; her birinde tek bir çentik.", en: "Half of {yer:kiyikent} is burning. Ancient banners hang over {yer:kordon}, each one marked with a single notch." }
            kosul: { bayrak: "kiyikent_dustu" }
          - metin: { tr: "Bu kez katlanmış ışık inmiyor; {npc:thessar} {yer:kiyikent_liman|in} taşları üstünde, yanında, sargılı koluyla bekliyor. Gökyüzü yukarıda bir makasın iki ağzı gibi açılıyor. Meclis'in Budayıcı'sı geldi.", en: "No folded light comes down this time. {npc:thessar} is already on {yer:kiyikent_liman} stones next to you, bandaged arm and all. Up above, the sky opens like the two blades of a pair of shears. The Conclave's Pruner has arrived." }
            kosul: { bayrak: "thessar_ihanete_hazir" }
          - metin: { tr: "Katlanmış ışık iniyor ve {npc:thessar} yalnız iniyor; sonra yanına dönüp gökyüzüne bakıyor. Kendi ırkına sırtını döndüğü günden beri Meclis'in Budayıcı'sını bekliyordu. Gökyüzü bir makas gibi açılıyor.", en: "The folded light comes down, and {npc:thessar} comes down it alone. Then he turns to stand beside you and looks up. Ever since the day he turned his back on his own kind, he's been waiting for the Conclave's Pruner. The sky opens like a pair of shears." }
            kosul: { bayrak: "ihanet_thessar", bayrak_yok: "thessar_ihanete_hazir" }
          - metin: { tr: "Katlanmış ışık iniyor. {npc:thessar} ve arkasında yedi Okuyucu. \"Meclis bir kan sınavı istiyor,\" diyor. \"İmzacı, elçinin yedi hükmüne dayanmalı. Dayanırsa Bekçi olur. Dayanamazsa yine Bekçi olur; ama diz çökmüş bir Bekçi.\"", en: "The folded light comes down. {npc:thessar}, with seven Readers behind him. \"The Conclave demands a blood trial,\" he says. \"The signatory must withstand seven of the envoy's decrees. Withstand them, and become Keeper. Fail, and still become Keeper. But a Keeper on their knees.\"" }
            kosul: { bayrak: "kadim_vassal_imzalandi", bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar"] }
          - metin: { tr: "Katlanmış ışık iniyor. {npc:thessar} yalnız iniyor; muhafızsız, okuyucusuz. Kalemi zincirinden çıkmış, elinde bir kılıç gibi duruyor. \"Meclis sapmanın budanmasını istedi,\" diyor. \"Budayıcı'yı göndermeyecekler. Beni gönderdiler. Kırkıncı sayfa açık; onu kapatmaya geldim.\"", en: "The folded light comes down, and {npc:thessar} comes down it alone. No Wardens, no Readers. His stylus is off its chain and he's holding it like a sword. \"The Conclave wanted the deviation pruned,\" he says. \"They are not sending the Pruner. They sent me. The fortieth page is open. I have come to close it.\"" }
            kosul: { bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar", "kadim_vassal_imzalandi"] }
          - metin: { tr: "\"Beni yalnız bıraktın,\" diye ekliyor, sesi düz. \"Ben de Defter'e döndüm. Hesap budur.\"", en: "\"You left me alone,\" he adds, flat. \"So I went back to the Ledger. That is the math.\"" }
            kosul: { bayrak: "thessar_yalniz_birakildi", bayrak_yok: "kadim_vassal_imzalandi" }
          - metin: { tr: "\"Beni Meclis'e ihbar ettin,\" diyor. \"Beni affettiler; seni kapatmam şartıyla. Bunu istemezdim. Ama istemek bir muhasebe kalemi değil.\"", en: "\"You reported me to the Conclave,\" he says. \"They forgave me, on the condition that I close you. I would not have chosen this. But wanting is not a line item.\"" }
            kosul: { bayrak: "thessar_ihbar_edildi" }
        sezgiler:
          - kosul: { stat: { per: 450 } }
            metin: { tr: "Elçinin kolundaki otuz dokuz dünyanın çentikleri soluyor. Kırkıncının yeri boş; ama kenarlarına bir çizgi çekilmiş, bir çerçeve gibi.", en: "The notches of thirty-nine worlds on the Envoy's arm are fading. The spot for a fortieth is empty, but somebody's drawn a line around its edges, like a frame." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "son sayfa. bunu hatırlıyorum. son sayfada herkes ne olduğunu söyler. sen ne olduğunu söyleyeceksin?", en: "the last page. i remember this. on the last page, everyone says what they are. what are you going to say you are?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu son, değil mi? Bunu bitir. Sonra eve gidelim. Ev kaldıysa.\"", en: "\"This is the last one, right? Finish it. Then let's go home. If there's a home left.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kırkıncı sayfa mı? Yazsın bakalım. Ben de seninkini yazarım.\"", en: "\"The fortieth page? Let him write it. I'll write yours.\"" }
        secenekler:
          - id: "muttefik"
            etiket: { tr: "Onun yanında dur; Budayıcı'yı karşıla", en: "Stand with him. Meet the Pruner" }
            goster: { bayrak: "thessar_ihanete_hazir" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4, duzen: -3 }
              - iliski: { thessar: { baglilik: 6, guven: 6 } }
              - savas: { dusmanlar: ["kadim_budayici@oyuncu+6"], ortam: ["su"], kazan: "thessar_son_duello_budayici_zafer", kaybet: "thessar_son_duello_budayici_yenilgi" }
            kronik: { tr: "Kendi ırkına ihanet eden Kadim'in yanında durup Meclis'in Budayıcı'sını karşıladın.", en: "You stood beside the Ancient who betrayed his own kind and faced the Conclave's Pruner." }
          - id: "muttefik_j"
            etiket: { tr: "Onun yanında dur; Budayıcı'yı karşıla", en: "Stand with him. Meet the Pruner" }
            goster: { bayrak: "ihanet_thessar", bayrak_yok: "thessar_ihanete_hazir" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4, duzen: -3 }
              - iliski: { thessar: { baglilik: 6, guven: 6 } }
              - savas: { dusmanlar: ["kadim_budayici@oyuncu+6"], ortam: ["su"], kazan: "thessar_son_duello_budayici_zafer", kaybet: "thessar_son_duello_budayici_yenilgi" }
            kronik: { tr: "Kendi ırkına ihanet eden Kadim'in yanında durup Meclis'in Budayıcı'sını karşıladın.", en: "You stood beside the Ancient who betrayed his own kind and faced the Conclave's Pruner." }
          - id: "ele_ver"
            etiket: { tr: "Bir adım geri çekil; Budayıcı onu alsın", en: "Step back. Let the Pruner take him" }
            goster: { bayrak: "ihanet_thessar" }
            etkiler:
              - degisken: { kadim_tehdit: 10 }
              - ahlak: { merhamet: -10, insanlik: -6, duzen: 4 }
              - itibar: { kadimler: 20 }
              - iliski: { thessar: { guven: -50, baglilik: -30 } }
            kronik: { tr: "Son anda bir adım geri çekildin ve Meclis'in Budayıcı'sı sana güvenen Kadim'i senin önünde kesti.", en: "At the last second you took one step back, and the Conclave's Pruner cut down the Ancient who trusted you, right in front of you." }
            sonraki: "thessar_son_duello_ele_ver"
          - id: "sinav"
            etiket: { tr: "Kan sınavını kabul et", en: "Accept the blood trial" }
            goster: { bayrak: "kadim_vassal_imzalandi", bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar"] }
            etkiler:
              - ahlak: { duzen: 5, insanlik: -3 }
              - iliski: { thessar: { saygi: 4 } }
              - savas: { dusmanlar: ["thessar_elci@oyuncu+2"], kazan: "thessar_son_duello_sinav_zafer", kaybet: "thessar_son_duello_sinav_yenilgi" }
            kronik: { tr: "Kadimler'in kan sınavını kabul ettin ve elçinin yedi hükmüne göğsünü açtın.", en: "You accepted the Ancients' blood trial and bared your chest to the Envoy's seven decrees." }
          - id: "sinav_el"
            tur: "gosteris"
            etiket: { tr: "Yedi hükme elini kaldırmadan dayan", en: "Take all seven decrees without raising a hand" }
            goster: { bayrak: "kadim_vassal_imzalandi", bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar"] }
            gerekli: { stat: { wil: 450 } }
            etkiler:
              - dikkat: 6
              - ahlak: { duzen: 3, insanlik: -2 }
              - iliski: { thessar: { saygi: 15, baglilik: 10 } }
            kronik: { tr: "Kadim elçisinin yedi hükmüne elini bile kaldırmadan dayandın; Okuyucular sınavı kaydedecek bir sayı bulamadı.", en: "You took the Ancient envoy's seven decrees without so much as raising a hand. The Readers couldn't find a number to record the trial with." }
            sonraki: "thessar_son_duello_sinav_gosteris"
          - id: "sinav_kan"
            etiket: { tr: "Sınavı ölümcül yap; antlaşmayı kanla boz", en: "Make the trial lethal. Break the treaty in blood" }
            goster: { bayrak: "kadim_vassal_imzalandi", bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar"] }
            etkiler:
              - bayrak: "kadim_sozlesme_yirtildi"
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { duzen: -8, insanlik: 6 }
              - itibar: { kadimler: -30, siginak: 6, lonca: 6 }
              - iliski: { thessar: { baglilik: -30, guven: -20 } }
              - savas: { dusmanlar: ["thessar_elci@oyuncu+5"], kazan: "thessar_son_duello_elci_zafer", kaybet: "thessar_son_duello_elci_yenilgi" }
            kronik: { tr: "Kan sınavının ortasında antlaşmayı bozdun ve elçiye gerçekten vurdun; Bekçi olacak kişi son anda kılıcı çekti.", en: "In the middle of the blood trial, you broke the treaty and swung for real. The one who was supposed to become Keeper drew steel at the last second." }
          - id: "duello"
            etiket: { tr: "Son düelloyu kabul et", en: "Accept the last duel" }
            goster: { bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar", "kadim_vassal_imzalandi"] }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - iliski: { thessar: { saygi: 6 } }
              - savas: { dusmanlar: ["thessar_elci@oyuncu+5"], kazan: "thessar_son_duello_elci_zafer", kaybet: "thessar_son_duello_elci_yenilgi" }
            kronik: { tr: "Kırkıncı sayfayı kapatmaya gelen Kadim elçisinin son düellosunu kabul ettin.", en: "You accepted the last duel from the Ancient envoy who came to close the fortieth page." }
          - id: "konus"
            etiket: { tr: "Son bir kez konuşmayı dene", en: "Try talking to him one last time" }
            goster: { bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar", "kadim_vassal_imzalandi"] }
            gerekli: { iliski_min: { thessar: { saygi: 25 } } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { thessar: { guven: 4 } }
            kronik: { tr: "Son düellodan önce Kadim elçisiyle bir kez daha konuşmayı denedin.", en: "Before the last duel, you tried talking to the Ancient envoy one more time." }
            sonraki: "thessar_son_duello_konusma"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Gerçek gücünü tamamen aç; düello başlamasın", en: "Open up your full power. Don't let it start" }
            goster: { bayrak_yok: ["thessar_ihanete_hazir", "ihanet_thessar", "kadim_vassal_imzalandi"] }
            gerekli: { stat: { wil: 500 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 10
              - ahlak: { insanlik: -5, duzen: -2 }
              - iliski: { thessar: { korku: 15, saygi: 15 } }
            kronik: { tr: "Kadim elçisinin önünde gerçek gücünü sonuna kadar açtın ve düello hiç başlamadı.", en: "You opened your full power in front of the Ancient envoy, and the duel never even started." }
            sonraki: "thessar_son_duello_ezme"

      - id: "thessar_son_duello_konusma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ona Ithren'in ilk sayfasını hatırlatıyorsun; budanan satırı, imzalanan deriyi, on bin yıldır sorduğu soruyu. {npc:thessar} kalemini indirmiyor ama kaldırmıyor da.", en: "You remind him of the first page of the Ithren. The pruned line, the signed hide, the question he's been asking for ten thousand years. {npc:thessar} doesn't lower his stylus. He doesn't raise it, either." }
          - { tr: "\"Bunu biliyorum,\" diyor. \"Biliyorum ve yine de buradayım. Muhasebeci olmak budur: sonucu bilip toplamı yine de yazmak.\" Sesinin ikinci katmanı birincinin gerisinde kalıyor; sanki ikinci ses ikna olmamış.", en: "\"I know this,\" he says. \"I know, and I am here anyway. That is what it means to be an accountant: knowing the result and writing the total anyway.\" The second layer of his voice lags behind the first. Like the second voice isn't convinced." }
        secenekler:
          - id: "kal"
            tur: "gosteris"
            etiket: { tr: "\"Defter'i bırak. Burada, bizimle kal\"", en: "\"Drop the Ledger. Stay here, with us\"" }
            gerekli: { stat: { cha: 450 } }
            etkiler:
              - bayrak: "ihanet_thessar"
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { merhamet: 6, insanlik: 4 }
              - itibar: { kadimler: -20 }
              - iliski: { thessar: { guven: 25, baglilik: 20 } }
            kronik: { tr: "Kırkıncı sayfayı kapatmaya gelen Kadim'i son anda kendi ırkını bırakıp sizinle kalmaya ikna ettin; aynı saat gökyüzünde bir makas açıldı.", en: "At the last minute, you talked the Ancient who came to close the fortieth page into leaving his own kind and staying with you. In that same hour, a pair of shears opened in the sky." }
            sonraki: "thessar_son_duello_donus"
          - id: "duello"
            etiket: { tr: "\"O zaman yaz. Ben de seninkini\"", en: "\"Then write it. I'll write yours\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 6 } }
              - savas: { dusmanlar: ["thessar_elci@oyuncu+4"], kazan: "thessar_son_duello_elci_zafer", kaybet: "thessar_son_duello_elci_yenilgi" }
            kronik: { tr: "Son sözler bittiğinde Kadim elçisiyle düelloya girdin; ikiniz de toplamı bildiğiniz hâlde.", en: "When the last words ran out, you went into the duel with the Ancient envoy. Both of you already knew the total." }

      - id: "thessar_son_duello_donus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} kalemini zincirine geri takıyor. Sonra sol kolunu kaldırıyor ve sargısız, kesiksiz derisinin içinden ılık, atan bir şeyi tırnaklarıyla söküp çıkarıyor. Mürekkep düzgün satırlar hâlinde değil, bir insanın kanı gibi akıyor.", en: "{npc:thessar} hooks his stylus back on its chain. Then he raises his left arm and digs something warm and beating out of his own unbroken skin with his nails. The ink doesn't run in neat lines. It runs like a human's blood." }
          - { tr: "\"Defter Mührü,\" diyor ve onu avucuna bırakıyor. \"Al. Ve hazırlan. Kendi ırkına sırtını dönen bir elçi için Meclis Budayıcı'yı gönderir. Şimdi.\" Gökyüzü bir makasın iki ağzı gibi açılıyor.", en: "\"The Ledger Seal,\" he says, and drops it in your palm. \"Take it. And get ready. When an envoy turns his back on his own kind, the Conclave sends the Pruner. Now.\" The sky opens like the two blades of a pair of shears." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Onun yanında dur; Budayıcı'yı karşıla", en: "Stand with him. Meet the Pruner" }
            etkiler:
              - esya: { defter_muhru: 1 }
              - bayrak: "thessar_muhru_alindi"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { thessar: { baglilik: 6 } }
              - savas: { dusmanlar: ["kadim_budayici@oyuncu+6"], ortam: ["su"], kazan: "thessar_son_duello_budayici_zafer", kaybet: "thessar_son_duello_budayici_yenilgi" }
            kronik: { tr: "Kırkıncı sayfayı kapatmaya gelen elçinin mührünü aldın ve onunla birlikte Meclis'in Budayıcı'sını karşıladın.", en: "You took the seal from the envoy who came to close the fortieth page, and you faced the Conclave's Pruner side by side." }

      - id: "thessar_son_duello_ezme"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bırakıyorsun. Hepsini. Pencerendeki sayı bir sayı olmaktan çıkıyor; {yer:kiyikent_liman|de}ki her pencere aynı anda beyaza dönüyor, körfezin üstündeki gemilerin satırları titriyor.", en: "You let go. All of it. The number in your window stops being a number. Every window on {yer:kiyikent_liman} goes white at once, and the lines of the ships over the bay start to shake." }
          - { tr: "{npc:thessar} kalemini kaldırmıyor. Kaldıramıyor. Bir süre bakıyor, sonra yavaşça, çok yavaşça diz çöküyor; otuz dokuz dünyada hiç yapmadığı bir şeyi yapıyor. \"Hesap kapanmadı,\" diyor. \"Ben kapattım. Bu farklı.\"", en: "{npc:thessar} doesn't raise his stylus. He can't. He stares for a while, then slowly, very slowly, goes down on one knee, doing something he never did on thirty-nine worlds. \"The account did not close,\" he says. \"I closed it. That is different.\"" }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Onu ayağa kaldır", en: "Pull him to his feet" }
            etkiler:
              - bayrak: "thessar_yenildi"
              - bayrak: "thessar_bagislandi"
              - unvan: "hesabi_kapatan"
              - degisken: { kadim_tehdit: -12 }
              - ahlak: { merhamet: 6, insanlik: 2 }
              - iliski: { thessar: { saygi: 15, guven: 10, baglilik: 10 } }
              - xp_seviye: 250
            kronik: { tr: "Önünde diz çöken Kadim elçisini ayağa kaldırdın; Meclis o gün kırkıncı sayfayı bir daha açmadı.", en: "You pulled the kneeling Ancient envoy back to his feet. The Conclave never opened the fortieth page again." }
            sonraki: "thessar_son_duello_bagis"
          - id: "birak"
            etiket: { tr: "Diz çökmüş hâlde bırak; filoya dönsün", en: "Leave him kneeling. Let him crawl back to the fleet" }
            etkiler:
              - bayrak: "thessar_yenildi"
              - unvan: "hesabi_kapatan"
              - npc_gitti: "thessar"
              - degisken: { kadim_tehdit: -15 }
              - ahlak: { merhamet: -4, insanlik: -3, duzen: 2 }
              - itibar: { lonca: 8, kadimler: -20 }
              - iliski: { thessar: { korku: 20, saygi: 10 } }
              - xp_seviye: 250
            kronik: { tr: "Kadim elçisini {yer:kiyikent_liman|in} taşlarında diz çökmüş bıraktın; filosuna dönen elçi Meclis'e tek bir satır yazdı: \"Bu dünya sayılamaz.\"", en: "You left the Ancient envoy kneeling on {yer:kiyikent_liman} stones. When he got back to his fleet, he wrote the Conclave a single line: \"This world cannot be counted.\"" }
            sonraki: "@akis"

      - id: "thessar_son_duello_budayici_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Budayıcı'nın tek gözü sonunda kapanıyor. Makas kolları bir daha açılmamak üzere kapanıyor; dev gövde {yer:kiyikent_liman|in} taşlarına bir ağaç gibi devriliyor ve denize kayıyor.", en: "The Pruner's single eye finally closes. Its shear-arms snap shut for the last time, and the huge body topples onto {yer:kiyikent_liman} stones like a tree and slides into the sea." }
          - { tr: "Gökyüzündeki gemilerin hepsi aynı anda titriyor. Pencerende yazılmamış bir satır: [Meclis: bir koltuk boş.]", en: "Every ship in the sky shudders at once. An unwritten line appears in your window: [Conclave: one seat vacant.]" }
          - { tr: "{npc:thessar} denize, Budayıcı'nın battığı yere bakıyor. \"Defter'de ilk kez boş bir satır var,\" diyor. \"Ne bir çentik, ne bir toplam. Hiçbir şey.\" Sonra sana dönüyor ve kelimeyi söylüyor, bin yılda dördüncü kez: \"Thael.\"", en: "{npc:thessar} looks at the sea, at the spot where the Pruner went under. \"For the first time, there is an empty line in the Ledger,\" he says. \"No notch. No total. Nothing.\" Then he turns to you and says the word, for the fourth time in a thousand years: \"Thael.\"" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Meclis'in Budayıcı'sı Katman'da yenildi.", en: "The Conclave's Pruner has been defeated in the Layer." }
              - { tr: "Sistem tarafsızdır. Sistem bu satırı silmeyi denedi ve başaramadı.", en: "The System is neutral. The System tried to delete this line and failed." }
        secenekler:
          - id: "kal"
            etiket: { tr: "\"Burada kal. Bu dünyada bir yerin var\"", en: "\"Stay. You've got a place on this world\"" }
            etkiler:
              - bayrak: "budayici_yenildi"
              - bayrak: "thessar_muttefik"
              - bayrak: "ihanet_thessar"
              - unvan: "budayici_kiran"
              - bilgi: "thael_kelimesi"
              - degisken: { kadim_tehdit: -10, hayatta_kalan: 2 }
              - ahlak: { merhamet: 6, insanlik: 4 }
              - itibar: { siginak: 6, kadimler: -20 }
              - iliski: { thessar: { baglilik: 15, guven: 15 } }
              - xp_seviye: 280
            kronik: { tr: "Meclis'in Budayıcı'sını kendi ırkına ihanet eden elçinin yanında yendin ve ona bu dünyada bir yer verdin; kırkıncı sayfa hasat değil, bir konuk kaydı oldu.", en: "You beat the Conclave's Pruner beside the envoy who betrayed his own kind, then gave him a place on this world. The fortieth page didn't become a harvest. It became a guest book." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "\"Git. Kendi sonunu kendin yaz\"", en: "\"Go. Write your own ending\"" }
            etkiler:
              - bayrak: "budayici_yenildi"
              - bayrak: "thessar_muttefik"
              - bayrak: "ihanet_thessar"
              - unvan: "budayici_kiran"
              - degisken: { kadim_tehdit: -10 }
              - ahlak: { duzen: -3, insanlik: 3 }
              - itibar: { kadimler: -20 }
              - iliski: { thessar: { saygi: 10, baglilik: 8 } }
              - xp_seviye: 280
            kronik: { tr: "Budayıcı'yı birlikte yendiğiniz elçiye kendi sonunu yazmasını söyledin; o, Defter'de olmayan bir dünyaya doğru yürüdü.", en: "You told the envoy you beat the Pruner with to go write his own ending. He walked off toward a world that isn't in the Ledger." }
            sonraki: "@akis"

      - id: "thessar_son_duello_budayici_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Makas kolları üstüne kapanıyor ve bir an her şey kesilmiş gibi: ses, ışık, ağırlık. Sonra bir gölge aranıza giriyor.", en: "The shear-arms close over you, and for a second everything feels cut away: sound, light, weight. Then a shadow steps between you." }
          - { tr: "{npc:thessar}. Makasın iki ağzı onun üstünde kapanıyor. Mürekkep düzgün satırlar hâlinde akmıyor; bir insanın kanı gibi, her yöne. Budayıcı'nın tek gözü bir an kırpılıyor; bu bir sapma.", en: "{npc:thessar}. Both blades of the shears close on him. The ink doesn't run in neat lines. It runs like a human's blood, every direction. The Pruner's single eye blinks once. That's a deviation." }
          - { tr: "\"Bir dal için iki budama olmaz,\" diyor Budayıcı, kuru ve yorgun. Geri çekiliyor; gökyüzündeki makas kapanıyor. {npc:thessar|in} başını kucağına alıyorsun. \"Bu,\" diyor, \"Defter'de yazılı değil.\" Ve gülümsüyor; ilk ve son kez.", en: "\"One branch is never pruned twice,\" the Pruner says, dry and tired. It withdraws, and the shears in the sky close. You pull {npc:thessar|pos} head into your lap. \"This,\" he says, \"is not written in the Ledger.\" And he smiles. The first time, and the last." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Gözlerini kapat", en: "Close his eyes" }
            etkiler:
              - bayrak: "ihanet_thessar"
              - bayrak: "thessar_muttefik"
              - npc_ol: "thessar"
              - degisken: { kadim_tehdit: -8 }
              - ahlak: { merhamet: 4, insanlik: 4 }
              - xp_seviye: 150
            kronik: { tr: "Kendi ırkına ihanet eden Kadim elçisi Budayıcı'nın makasına seni korumak için girdi; gözlerini sen kapattın.", en: "The Ancient envoy who betrayed his own kind stepped into the Pruner's shears to protect you. You were the one who closed his eyes." }
            sonraki: "@akis"

      - id: "thessar_son_duello_ele_ver"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir adım geri çekiliyorsun. Bu kadar. {npc:thessar} başını çevirip sana bakıyor; ıslak arduvaz gözleri bir kez kırpılıyor.", en: "You take one step back. That's all. {npc:thessar} turns his head to look at you, and those wet-slate eyes blink once." }
          - { tr: "Makasın iki ağzı kapanıyor. Ses yok. Elçinin gövdesi {yer:kiyikent_liman|in} taşlarına sessizce, bir sayfa gibi düşüyor. Budayıcı tek gözünü sana çeviriyor, uzun uzun bakıyor ve sonra başını eğiyor: üç derece.", en: "The shears close. No sound. The Envoy's body falls to {yer:kiyikent_liman} stones quietly, like a page. The Pruner turns its single eye on you, stares a long time, then tips its head. Three degrees." }
          - { tr: "Pencerende altın bir satır: [Meclis: sadakat kaydedildi.] Gökyüzündeki makas kapanıyor.", en: "A gold line in your window: [Conclave: loyalty entered.] The shears in the sky close." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ona bakma", en: "Don't look at him" }
            etkiler:
              - npc_ol: "thessar"
              - ahlak: { insanlik: -3 }
              - xp_seviye: 150
            kronik: { tr: "Sana güvenen Kadim'i Budayıcı'ya bıraktın ve Meclis seni sadık olarak kaydetti.", en: "You left the Ancient who trusted you to the Pruner, and the Conclave entered you as loyal." }
            sonraki: "@akis"

      - id: "thessar_son_duello_sinav_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yedinci hüküm de geçiyor. Hâlâ ayaktasın. {npc:thessar} kalemini indiriyor; yedi Okuyucu yarıklarını aynı anda kapatıyor.", en: "The seventh decree passes, too. You're still standing. {npc:thessar} lowers his stylus, and the seven Readers close their slits at once." }
          - { tr: "\"Yedi hükmün yedisine dayandın,\" diyor. \"Bekçi ayakta.\" Sonra, kayda geçmeyen bir sesle: \"Bir ortağım oldu. On bin yılda ilk kez. Bunun bir sütunu yok; ben açacağım.\"", en: "\"You withstood seven of seven,\" he says. \"The Keeper stands.\" Then, in a voice that doesn't go on the record: \"I have a partner. For the first time in ten thousand years. There is no column for that. I will open one.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ona elini uzat", en: "Hold out your hand to him" }
            etkiler:
              - bayrak: "thessar_ortak"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { duzen: 4, insanlik: -2 }
              - iliski: { thessar: { baglilik: 15, guven: 8 } }
              - xp_seviye: 250
            kronik: { tr: "Kan sınavını ayakta bitirdin ve Kadim elçisi Dünya'nın Bekçisi'nin ortağı oldu.", en: "You finished the blood trial on your feet, and the Ancient envoy became the partner of Earth's Keeper." }
            sonraki: "@akis"

      - id: "thessar_son_duello_sinav_gosteris"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Birinci hüküm üstüne iniyor; kemiklerin kıpırdamıyor. İkincisi, üçüncüsü. Yedincisinde Okuyucuların yarıkları kanıyor; sayacak bir şey bulamıyorlar.", en: "The first decree comes down on you, and your bones don't budge. The second, the third. By the seventh, the Readers' slits are bleeding. They can't find anything to count." }
          - { tr: "{npc:thessar} kalemini indiriyor ve uzun süre sana bakıyor. \"Ellerini kaldırmadın,\" diyor. \"Meclis bunu okuduğunda bana bir mektup yazmayacak. Sana yazacak.\" Başını eğiyor; bir ortağa eğilinen kadar.", en: "{npc:thessar} lowers his stylus and looks at you for a long time. \"You never raised your hands,\" he says. \"When the Conclave reads this, they will not write me a letter. They will write you one.\" He bows his head. As far as you bow to a partner." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Selamına aynı açıyla karşılık ver", en: "Return the bow at the same angle" }
            etkiler:
              - bayrak: "thessar_ortak"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { duzen: 3, insanlik: -1 }
              - iliski: { thessar: { baglilik: 12, saygi: 6 } }
              - xp_seviye: 280
            kronik: { tr: "Kadim elçisinin yedi hükmüne elini kaldırmadan dayandın ve onun ortağı oldun; Meclis sana bir mektup yazdı.", en: "You took the Ancient envoy's seven decrees without lifting a hand and became his partner. The Conclave wrote you a letter." }
            sonraki: "@akis"

      - id: "thessar_son_duello_sinav_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Beşinci hükümde dizin taşa değiyor. Altıncıda ellerin. Yedinci hüküm geliyor ve geçiyor; hâlâ yaşıyorsun ama ayakta değilsin.", en: "On the fifth decree, your knee hits the stone. On the sixth, your hands. The seventh comes and goes. You're still alive, but you're not standing." }
          - { tr: "{npc:thessar} yanına eğiliyor. \"İmzacı düşer,\" diyor. \"İmza düşmez. Bekçisin; diz çökmüş bir Bekçi. Meclis bundan hoşlanır.\" Kalkmana yardım ediyor; bunu yapmak zorunda değildi.", en: "{npc:thessar} crouches beside you. \"The signatory falls,\" he says. \"The signature does not. You are Keeper. A Keeper on their knees. The Conclave likes that.\" He helps you up. He didn't have to." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Elini tut ve kalk", en: "Take his hand. Get up" }
            etkiler:
              - bayrak: "thessar_ortak"
              - can: 800
              - degisken: { kadim_tehdit: 8 }
              - ahlak: { duzen: 3, insanlik: -3 }
              - iliski: { thessar: { baglilik: 8, guven: 4 } }
              - xp_seviye: 180
            kronik: { tr: "Kan sınavında diz çöktün ve Kadim elçisi seni ayağa kaldırdı; Dünya'nın Bekçisi bir Kadim'in elini tutarak kalktı.", en: "You went to your knees in the blood trial, and the Ancient envoy pulled you up. Earth's Keeper got to their feet holding an Ancient's hand." }
            sonraki: "@akis"

      - id: "thessar_son_duello_elci_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kalemin ucu kırık; mürekkep bitmiş. {npc:thessar} {yer:kiyikent_liman|in} taşlarında, otuz dokuz dünyanın çentikleri derisinde sönmüş hâlde yatıyor. Kırkıncının yerindeki çerçeve hâlâ boş.", en: "The stylus nib is broken, the ink run dry. {npc:thessar} lies on {yer:kiyikent_liman} stones, the notches of thirty-nine worlds gone dark on his skin. The frame where the fortieth should go is still empty." }
          - { tr: "\"Hesap kapanmadı,\" diyor, iki sesi artık tek. \"Bu bir ilk. Kayda geçir; benim yerime.\"", en: "\"The account did not close,\" he says, his two voices one voice now. \"That is a first. Enter it. On my behalf.\"" }
          - metin: { tr: "\"Beni ihbar ettiğin gece,\" diye ekliyor, \"bunun böyle biteceğini hesaplamıştım. Hesabım tuttu. Hiç bu kadar üzülmemiştim.\"", en: "\"The night you reported me,\" he adds, \"I calculated it would end this way. My math was correct. I have never been so sorry to be right.\"" }
            kosul: { bayrak: "thessar_ihbar_edildi" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Bir Kadim elçisi Katman'da yenildi.", en: "An Ancient envoy has been defeated in the Layer." }
              - { tr: "Kırkıncı sayfa: boş.", en: "Fortieth page: blank." }
        secenekler:
          - id: "oldur"
            etiket: { tr: "Kırık kalemini al ve hesabı kapat", en: "Take his broken stylus. Close the account" }
            etkiler:
              - bayrak: "thessar_yenildi"
              - bayrak: "thessar_olduruldu"
              - npc_ol: "thessar"
              - unvan: "hesabi_kapatan"
              - degisken: { kadim_tehdit: -15 }
              - ahlak: { merhamet: -6, insanlik: -2, duzen: 2 }
              - itibar: { lonca: 8, siginak: 4, kadimler: -25 }
              - xp_seviye: 300
            kronik: { tr: "Otuz dokuz dünyayı hasat eden Kadim elçisini kendi kırık kalemiyle öldürdün; Defter'deki kırkıncı sayfa sonsuza dek boş kaldı.", en: "You killed the Ancient envoy who harvested thirty-nine worlds with his own broken stylus. The fortieth page in the Ledger stayed blank forever." }
            sonraki: "@akis"
          - id: "bagisla"
            etiket: { tr: "Onu bağışla; Meclis'e ne gördüğünü anlatsın", en: "Spare him. Let him tell the Conclave what he saw" }
            etkiler:
              - bayrak: "thessar_yenildi"
              - bayrak: "thessar_bagislandi"
              - unvan: "hesabi_kapatan"
              - npc_gitti: "thessar"
              - degisken: { kadim_tehdit: -10 }
              - ahlak: { merhamet: 8, insanlik: 2 }
              - iliski: { thessar: { saygi: 20, guven: 10, baglilik: 6 } }
              - xp_seviye: 300
            kronik: { tr: "Yendiğin Kadim elçisini bağışladın ve Meclis'e ne gördüğünü anlatması için geri gönderdin; Yedi Taht'ta o gün yedi koltuğun hiçbiri konuşmadı.", en: "You spared the Ancient envoy you'd beaten and sent him back to tell the Conclave what he'd seen. That day, not one of the seven seats at the Sevenfold Court said a word." }
            sonraki: "thessar_son_duello_bagis"
          - id: "defter"
            tur: "aciga_vur"
            etiket: { tr: "Kalemini al; kırkıncı sayfaya kendi adını yaz", en: "Take his stylus. Write your own name on page forty" }
            etkiler:
              - bayrak: "thessar_yenildi"
              - unvan: "hesabi_kapatan"
              - aciga_vur: true
              - npc_gitti: "thessar"
              - dikkat: 10
              - degisken: { kadim_tehdit: -12 }
              - ahlak: { insanlik: -8, duzen: 4 }
              - iliski: { thessar: { korku: 20, saygi: 15 } }
              - xp_seviye: 300
            kronik: { tr: "Yendiğin Kadim elçisinin kalemiyle Defter'in kırkıncı sayfasına kendi adını yazdın; Kadimler o sayfayı hiçbir zaman okuyamadı.", en: "With the beaten Ancient envoy's own stylus, you wrote your name on the fortieth page of the Ledger. The Ancients were never able to read that page." }
            sonraki: "@akis"

      - id: "thessar_son_duello_bagis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} ayağa kalkıyor; yavaş, bir şeyi ilk kez yapan biri gibi. Merdiven iniyor, katlanmış ışık titrek.", en: "{npc:thessar} gets to his feet. Slow, like someone doing something for the first time. The stair comes down, the folded light shaky." }
          - { tr: "İlk basamakta duruyor ve geri dönüp sana bakıyor. \"Meclis'e ne anlatacağımı biliyorum,\" diyor. \"Kırkıncı sayfanın neden boş olduğunu. Bana inanmayacaklar.\" Başını eğiyor; derece saymadan.", en: "On the first step he stops, turns, and looks back at you. \"I know what I will tell the Conclave,\" he says. \"Why the fortieth page is blank. They will not believe me.\" He bows his head, without counting the degrees." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Merdivenin ışığa katlanmasını izle", en: "Watch the stair fold into light" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - iliski: { thessar: { saygi: 3 } }
            kronik: { tr: "Bağışladığın Kadim elçisinin merdiveninin son kez ışığa katlanmasını izledin.", en: "You watched the stair of the Ancient envoy you'd spared fold back into light for the last time." }
            sonraki: "@akis"

      - id: "thessar_son_duello_elci_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kalemin çizdiği yatay çizgi üstüne iniyor ve altında kalan her şey bir sütunun toplamı gibi kapanmaya başlıyor. Nefesin, sesin, adın.", en: "The horizontal stroke of the stylus comes down on you, and everything under that line starts to close like the bottom of a column. Your breath, your voice, your name." }
          - { tr: "Son satırda {npc:thessar} duruyor. Kalemi havada kalıyor; toplam yazılmıyor. \"Seni budamayacağım,\" diyor sonunda. \"Defter'e 'kapanmadı' yazacağım. Meclis beni bunun için budar belki. Ama bir sapmayı budamak, ondan ne çıkacağını hiç öğrenmemek demek. Bunu bir kez yaptık.\"", en: "On the very last line, {npc:thessar} stops. His stylus hangs in the air, and the total never gets written. \"I will not prune you,\" he says at last. \"I will enter 'not closed' in the Ledger. Perhaps the Conclave prunes me for it. But pruning a deviation means never learning what it would have become. We did that once.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalk; gidişini izle", en: "Get up. Watch him go" }
            etkiler:
              - can: 800
              - npc_gitti: "thessar"
              - degisken: { kadim_tehdit: 8 }
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { thessar: { saygi: 10 } }
              - xp_seviye: 150
            kronik: { tr: "Kadim elçisi seni son düelloda yendi ama budamadı; Defter'e senin için \"kapanmadı\" yazıp gitti.", en: "The Ancient envoy beat you in the last duel but didn't prune you. He wrote \"not closed\" in the Ledger next to your name and left." }
            sonraki: "@akis"
