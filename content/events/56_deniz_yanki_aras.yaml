# Parti F — Deniz, Yankı ve Aras: Perde 2–4 yayları (docs/PERDE2_4.md "Parti F") ve Yozlaşma eşikleri.
# Deniz: kardeş bulunur (P2) → canavar mı tanrı mı (P3) → son fedakârlık (P4); Deniz öldüyse yerine anma olayları (npc listesi boş).
#   Deniz'in durumları: yoldaş · Yükselenler'de (npc_gitti + deniz_yukselenlere_gitti) · gitmiş · hiç bulunmamış (deniz_hic_bulunmadi).
#   Kardeşin akıbeti dünya durumundan: kordon_dustu → Kordon'da ölü · cekirdek_yukselenler → Tepe'de Seçilmiş · aksi → Sığınak'ta, kurtarılmış.
# Yankı: kaynak izi (P2–3) → son sır (P3–4; Kule 100 ya da K1'in sistem_cekirdegi tohumu) · yozlasma_50 / yozlasma_75 (virüs yolu).
# Aras: Kule düellosu (P2–3) → çok-evren kapısı (P3) → S kademe (P4) + kısa kodalar.
# Yankı'nın sözleri küçük harf ve tırnaksız; anlatı {npc:yanki} ile atfeder. Deniz için İngilizcede zamir belirteci.
olaylar:
  # ================================================================== DENİZ · P2: kardeş bulunur
  - id: "deniz_kardes_bulundu"
    perde: [2]
    ana_yay: { gun: 95 }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "yukselenler"]
    gerilim: 4
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Duvarlardaki martılar", en: "Gulls on the walls" }
    sahne: "dkb_1"
    sahneler:
      - id: "dkb_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent_liman|in} balık halinin kepengine mavi tebeşirle çizilmiş bir martı görüyorsun. Ördeğe benziyor; kafası fazla yuvarlak, gagası fazla geniş.", en: "Morning, and there's a gull drawn in blue sidewalk chalk on the shutter of the old fish market at {yer:kiyikent_liman}. It looks like a duck. Head too round, beak too wide." }
          - { tr: "Sonra bir tane daha görüyorsun, gümrük binasının duvarında; bir tane de devrilmiş bir otobüs durağının camında. Hepsi aynı yöne bakıyor, birinin yol göstermek için bıraktığı oklar gibi.", en: "Then you see another one on the wall of the customs house, and another on the glass of a knocked-over bus shelter. They're all facing the same way, like arrows somebody left to show the way." }
          - metin: { tr: "{npc:deniz_arman} yanında duruyor ve kepengin önünde donup kalmış. Elini uzatıyor, martıya dokunmadan çekiyor. \"Ördek,\" diyor, sesi çatlayarak. \"Bu onun. Bunu yalnızca o böyle çizer.\"", en: "{npc:deniz_arman} is standing right beside you, frozen in front of the shutter, reaching out and pulling back before touching the gull. \"Duck,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice cracking. \"That's hers. Nobody else draws them like that.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:deniz_arman} {yer:tepe|de}, {fraksiyon:yukselenler|in} gri şalları arasında. Duyduğuna göre kardeşi orada, kuzeydeki yurtta, güvende. Peki bu martıları kim çiziyor, şehrin bu ucunda, bu kadar yeni?", en: "{npc:deniz_arman} is up on {yer:tepe}, wrapped in the gray shawls of {fraksiyon:yukselenler}. Word is the sister's up there too, safe in the north dormitory. So who's drawing these gulls down here at the other end of town, this fresh?" }
            kosul: { npc_gitti: "deniz_arman", bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "{npc:deniz_arman} bir sabah çantasını alıp gitmişti ve o günden beri ondan haber yok. Ama bu martıları tanıyorsun; Kırık İstasyon'un duvarında bir kez görmüştün.", en: "{npc:deniz_arman} picked up a pack one morning and left, and you haven't heard a word since. But you know these gulls. You saw one once, on a wall at the Broken Station." }
            kosul: { npc_gitti: "deniz_arman", bayrak_yok: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Öğretici sana {npc:deniz_arman|i} hiç geri vermedi. Ama bu martıları tanıyorsun: vapurda, {npc:deniz_arman|in} telefonunun kilit ekranında, küçük bir elin çizdiği ördeğe benzeyen bir martı vardı.", en: "The Tutorial never gave {npc:deniz_arman} back to you. But you know these gulls: there was one on the lock screen of {npc:deniz_arman|pos} phone on the ferry, a duck-looking gull drawn by a little hand." }
            kosul: { bayrak: "deniz_hic_bulunmadi", bayrak_yok: "deniz_bulundu" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Tebeşir en yeni çizimlerde bile üç haftalık; yağmur kenarlarını yemiş. Çizimler aceleyle değil, sabırla yapılmış. Çizen kişi yakalanmaktan korkmuyordu; bulunmak istiyordu.", en: "Even the freshest chalk is three weeks old, edges eaten by the rain. These weren't drawn in a hurry; they were drawn with patience. Whoever made them wasn't scared of getting caught. She wanted to be found." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Kasaba Çekirdeği'nin kaydında bir 'aday' etiketi var; on iki yaş değil artık, on üç. etiketin yanında ikinci bir sütun daha açılmış. henüz okumadım. okumamı ister misin?", en: "there's a 'candidate' tag in the Town Core's logs. not twelve anymore. thirteen. somebody opened a second column next to the tag. i haven't read it yet. want me to?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yürü. Hemen. Lütfen.\"", en: "\"Let's go. Now. Please.\"" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Martıların gösterdiği yöne yürü", en: "Follow where the gulls point" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 } }
              - esya: { martili_tebesir: 1 }
            kronik: { tr: "Duvarlardaki martıların peşine düştün; şehrin yarısını bir çocuğun tebeşiriyle yürüdün.", en: "You followed the gulls on the walls and walked half the city by a child's chalk." }
            sonraki: "dkb_iz"
          - id: "kayitlar"
            etiket: { tr: "Kayıp çocuk kayıtlarını {fraksiyon:siginak|den} iste", en: "Ask {fraksiyon:siginak} for their missing-kids records" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3 }
              - iliski: { deniz_arman: { saygi: 4 } }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Kardeşi aramaya bir deftere bakarak başladın; o defter bir gün başkalarını da buldu.", en: "You started the search in a ledger. That ledger found other kids, later on." }
            sonraki: "dkb_defter"
          - id: "sil"
            etiket: { tr: "Martıları sil; bu iz kimseye ulaşmasın", en: "Wipe the gulls off. Let this trail reach no one" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -4, duzen: 2 }
              - bayrak: "kardes_sakli_p2"
              - iliski: { yanki: { saygi: 3 } }
            kronik: { tr: "Bir çocuğun bulunmak için çizdiği martıları sildin; bunu hiç kimseye söylemedin.", en: "You wiped away the gulls a kid drew to be found, and you never told a soul." }
            sonraki: "dkb_sil"
          - id: "kayit_oku"
            etiket: { tr: "{npc:yanki|e} ikinci sütunu okut", en: "Have {npc:yanki} read the second column" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 30 } } }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
              - yozlasma: 3
              - dikkat: 3
              - bilgi: "kardes_yakit_listesi"
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
            kronik: { tr: "Kardeşin kaderini önce bir Sistem kaydında okudun; {npc:yanki} sana gerçeği insanlardan önce verdi.", en: "You read the sister's fate in a System log first. {npc:yanki} handed you the truth before any person did." }
            sonraki: "dkb_kayit"
          - id: "tek_bakis"
            tur: "gosteris"
            etiket: { tr: "Bütün martı izini tek bakışta oku", en: "Read the whole gull trail in a single look" }
            gerekli: { stat: { per: 45 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - dikkat: 3
              - xp_seviye: 20
              - iliski: { deniz_arman: { saygi: 6, korku: 4 } }
            kronik: { tr: "Bir çocuğun üç haftalık yolunu tek bakışta okudun; yanındakiler bunu bir mucize gibi anlattı.", en: "You read three weeks of a kid's trail in one look, and the people with you told it like a miracle." }
            sonraki: "dkb_tek_bakis"

      - id: "dkb_tek_bakis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gözlerini kısıyorsun ve şehir bir harita gibi açılıyor. Her martı bir nokta; noktalar {yer:kiyikent_liman|den} {yer:tepe|e} tırmanıyor, sonra orada bir süre dolanıp sahile, {yer:kordon|e} doğru iniyor.", en: "You narrow your eyes and the city unfolds like a map. Every gull is a dot. The dots climb from {yer:kiyikent_liman} up to {yer:tepe}, circle up there for a while, then run back down toward the beach and {yer:kordon}." }
          - { tr: "Son martılarda bir şey değişiyor. Yanlarında başka çizimler beliriyor: başka çocukların elleri, sonra gri, yüzsüz figürler. En sonuncusunun gözleri yok.", en: "Something changes in the last few gulls. Other drawings show up next to them: other kids' hands, then gray, faceless figures. The very last gull has no eyes." }
          - metin: { tr: "{npc:deniz_arman} senin yüzüne bakıyor, haritayı okumaya çalışır gibi. \"Ne gördün?\" diye soruyor. \"Bana söyle. Ne gördüysen.\"", en: "{npc:deniz_arman} is studying your face like it's the map. \"What did you see?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"Tell me. Whatever it is.\"" }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Bir şey söyleme; yolu göster", en: "Don't say anything. Lead the way" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { deniz_arman: { guven: 3 } }
            kronik: { tr: "Gördüğünü söylemedin, yalnızca yürüdün; bazı haberler yolda verilmez.", en: "You didn't say what you saw. You just walked; some news doesn't get delivered on the way." }
            sonraki: "dkb_iz"
          - id: "hazirla"
            etiket: { tr: "\"Kendini hazırla\" de; açık ve yumuşak", en: "Say \"Brace yourself,\" plainly and gently" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, korku: 2 } }
            kronik: { tr: "Kötü haberi yolun başında verdin; en azından yolun sonunda kimse hazırlıksız değildi.", en: "You gave the bad news at the start of the road, so at least nobody reached the end of it unprepared." }
            sonraki: "dkb_iz"

      - id: "dkb_defter"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{fraksiyon:siginak|in} gümrük deposundaki masada kalın bir kayıt defteri duruyor; her sayfa el yazısıyla, her satır bir isim, bir yaş, bir son görüldüğü yer. Görevli sana defteri uzatırken gözlerini kaçırıyor.", en: "On a table in {fraksiyon:siginak|pos} customs warehouse sits a fat ledger, every page handwritten, every line a name, an age, and a last-seen location. The volunteer won't meet your eyes as she slides it over." }
          - { tr: "On üç yaşında bir kız için iki satır buluyorsun. Biri {yer:tepe|de}ki yurdu gösteriyor: [Seçilmişler'e teslim edildi]. Öbürü daha yeni, başka bir kalemle: [{yer:kordon} taşması · çocuk grubu · durum: ?]", en: "You find two lines for a thirteen-year-old girl. One points to the dormitory on {yer:tepe}: [Handed over to the Chosen]. The other is newer, in a different pen: [Esplanade breach · group of kids · status: ?]" }
          - { tr: "Soru işaretinin altında kurşun kalemle, aceleyle çizilmiş küçük bir martı var. Görevli omuz silkiyor: \"Hep çizerdi. Bir gün sonra yanındakiler onu {yer:kordon|e} götürdü.\"", en: "Under the question mark, someone penciled in a tiny gull in a hurry. The volunteer shrugs. \"She was always drawing. Day after that, the people she was with took her down to {yer:kordon}.\"" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Defteri kapat ve martıların peşine düş", en: "Close the ledger. Go follow the gulls" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bilgi: "kardes_yakit_listesi"
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Bir defterdeki iki satırdan yola çıktın ve satırların arasındaki boşluğu kendi ayaklarınla doldurdun.", en: "You set out from two lines in a ledger and filled in the gap between them on foot." }
            sonraki: "dkb_iz"
          - id: "deftere_yaz"
            etiket: { tr: "Defterin altına adını ve ne aradığını yaz", en: "Sign the ledger: your name, and who you're looking for" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
              - iliski: { deniz_arman: { saygi: 3 } }
            kronik: { tr: "Kayıp çocuklar defterine adını yazdın; o sayfayı açan herkes bir süre daha umut etti.", en: "You signed your name in the missing-kids ledger, and everyone who opened to that page hoped a little longer." }
            sonraki: "dkb_iz"

      - id: "dkb_kayit"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:yanki} kaydı açıyor. Gözlerinin arkasında iki sütun beliriyor; birinin başlığı [SEÇİLMİŞ], öbürününki daha kısa ve daha soğuk: [YAKIT].", en: "{npc:yanki} opens the log. Two columns appear behind your eyes. One is headed [CHOSEN]. The other is shorter and colder: [FUEL]." }
          - { tr: "Kızın adı birinci sütundan silinmiş, ikinciye yazılmış. Gerekçe satırı tek bir kelime: [eğilim yetersiz]. Tarih, {yer:kordon} taşmasından önceki hafta.", en: "The girl's name was struck from the first column and written into the second. The reason field is two words: [insufficient affinity]. The date is the week before {yer:kordon} breach." }
          - { tr: "okudum, diyor {npc:yanki}, sesi her zamankinden düz. insanlar bunu insanlara yapıyor ve sistemin kayıt tutmasına izin veriyor. bunu sana neden gösterdiğimi bilmiyorum. belki sen de bilmelisin diye.", en: "read it, {npc:yanki} says, flatter than usual. people do this to people and let the system keep the books. i don't know why i'm showing you. maybe because you should know too." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kaydı kapat. Martıların sonuna git", en: "Close the log. Go to the end of the gulls" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - iliski: { yanki: { guven: 4 } }
            kronik: { tr: "Bir Sistem kaydının ne dediğini biliyordun; yine de yolun sonuna kendin gittin.", en: "You knew what the System log said, and you walked to the end of the road yourself anyway." }
            sonraki: "dkb_iz"
          - id: "tesekkur"
            etiket: { tr: "{npc:yanki|e} teşekkür et; gerçekten", en: "Thank {npc:yanki}. Mean it" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            kronik: { tr: "Kafandaki sese teşekkür ettin; o güne kadar kimse ona teşekkür etmemişti.", en: "You thanked the voice in your head. Nobody had ever thanked it before." }
            sonraki: "dkb_iz"

      - id: "dkb_sil"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avucunu kepenge bastırıyor ve martıyı siliyorsun; sonra gümrük duvarındakini, sonra otobüs durağındakini. Tebeşir parmaklarına mavi bir toz gibi yapışıyor.", en: "You press your palm to the shutter and wipe the gull away. Then the one on the customs wall, then the one at the bus shelter. The chalk clings to your fingers like blue dust." }
          - metin: { tr: "Dördüncüyü silerken arkanda bir nefes duyuyorsun. {npc:deniz_arman} orada; elindeki iki kahve bardağından biri yere düşmüş. \"Yine mi?\" diyor, çok sessizce. \"İstasyondan sonra... yine mi?\"", en: "You're wiping the fourth one when you hear a breath behind you. {npc:deniz_arman} is standing there; one of the two coffee cups in {zamir:deniz_arman|onun} hands has hit the ground. \"Again?\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, very quietly. \"After the station... again?\"" }
            kosul: { yoldas: "deniz_arman", bayrak: "kardes_notu_saklandi" }
          - metin: { tr: "Dördüncüyü silerken arkanda bir nefes duyuyorsun. {npc:deniz_arman} orada; elindeki iki kahve bardağından biri yere düşmüş. \"Ne yapıyorsun sen?\" diye soruyor; sonra avucundaki maviyi görüyor.", en: "You're wiping the fourth one when you hear a breath behind you. {npc:deniz_arman} is standing there; one of the two coffee cups in {zamir:deniz_arman|onun} hands has hit the ground. \"What are you doing?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. Then {zamir:deniz_arman|o} see{zamir:deniz_arman|s} the blue on your palm." }
            kosul: { yoldas: "deniz_arman", bayrak_yok: "kardes_notu_saklandi" }
          - { tr: "{yer:kiyikent_liman} uyanıyor. Martılar artık yok; yalnızca duvarlarda soluk mavi lekeler ve onları görüp de anlamayan insanlar.", en: "The Waterfront is waking up. The gulls are gone. Just faint blue smudges on the walls now, and people walking past them without a clue." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kayıt düştüm: bir çocuk bulunmak istedi ve sen buna izin vermedin. nedenini sormayacağım. ama bir gün biri soracak.", en: "logging it: a kid wanted to be found, and you didn't allow it. i won't ask why. but someday somebody will." }
        secenekler:
          - id: "korumak"
            etiket: { tr: "\"Seni ne bulacağımızdan korumak için.\"", en: "\"To protect you from what we'd find.\"" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - iliski: { deniz_arman: { guven: -18, saygi: -6 } }
              - hafiza: { npc: "deniz_arman", id: "yalan_yakalandi", agirlik: -45 }
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "deniz_arman" } }
            kronik: { tr: "Kardeşinin izini ikinci kez sildin ve {npc:deniz_arman} seni ikinci kez yakaladı; bir şey o sabah kırıldı.", en: "You erased the sister's trail a second time, {npc:deniz_arman} caught you a second time, and something broke that morning." }
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "Elini aç; doğruyu söyle ve birlikte yürüyün", en: "Open your hand. Tell the truth. Walk it together" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: -6, saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "durust_itiraf", agirlik: 25 }
            kronik: { tr: "Siliyordun; sonra durdun ve itiraf ettin. {npc:deniz_arman} o yürüyüşü hep hatırladı.", en: "You were erasing them. Then you stopped and confessed, and {npc:deniz_arman} always remembered that walk." }
            sonraki: "dkb_iz"
          - id: "git"
            etiket: { tr: "Mavi tozu üstünden silkele ve yürü git", en: "Dust off the blue and walk away" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - gizle: 2
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "deniz_arman" } }
            kronik: { tr: "Martıları sildin ve arkana bakmadan yürüdün; o iz bir daha hiçbir duvarda belirmedi.", en: "You wiped off the gulls and walked away without looking back. That trail never showed up on another wall." }
            sonraki: "@akis"
          - id: "pisman"
            etiket: { tr: "Dur. Son martıyı silme", en: "Stop. Leave the last gull" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak_kaldir: "kardes_sakli_p2"
              - iliski: { deniz_arman: { guven: 2 } }
            kronik: { tr: "Son martıyı silmedin; bazen bir izi kurtarmak için tek bir çizim yeter.", en: "You left the last gull alone. Sometimes one drawing is enough to save a trail." }
            sonraki: "dkb_iz"

      - id: "dkb_iz"
        paragraflar:
          - { tr: "Martılar seni {yer:kiyikent_liman|den} yukarı, {yer:eski_sehir|in} merdivenli sokaklarına çıkarıyor. Bir çeşmenin taşında, bir eczanenin kepenginde, yıkık bir bisiklet dükkânının camında; her biri bir öncekinden biraz daha emin bir elle çizilmiş.", en: "The gulls lead you up from {yer:kiyikent_liman} into the stepped streets of {yer:eski_sehir}. On a fountain's stone lip, on a pharmacy shutter, on the window of a gutted bike shop, each one drawn by a slightly surer hand than the last." }
          - metin: { tr: "{npc:deniz_arman} her martının önünde bir saniye duruyor ve parmaklarını havada, çizgilerin üstünde gezdiriyor. Dokunmuyor. Bozmaktan korkuyor.", en: "{npc:deniz_arman} stops for a second in front of every gull and traces the lines in the air with {zamir:deniz_arman|onun} fingers. Never touching. Scared of smudging them." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{yer:tepe|e} çıkan yokuşun dibinde bir martının önünde gri şallı biri diz çökmüş. {npc:deniz_arman}. Sana dönüyor; gözleri kıpkırmızı. \"Bana kuzeydeki yurtta olduğunu söylediler,\" diyor. \"Yurtta martı yok. Burada var.\"", en: "At the foot of the hill up to {yer:tepe}, someone in a gray shawl is kneeling in front of a gull. {npc:deniz_arman}. {zamir:deniz_arman|o|b} turn{zamir:deniz_arman|s} to you, eyes red raw. \"They told me she was in the north dorm,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"There aren't any gulls at the dorm. There are gulls here.\"" }
            kosul: { npc_gitti: "deniz_arman", bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "{yer:eski_sehir|in} merdivenlerinde bir martının önünde biri diz çökmüş, elinde bir parça kömür; martının yanına ikinci bir martı çiziyor, kötü ve titrek. Başını kaldırıyor. {npc:deniz_arman}. Bir an ikiniz de nefes almayı unutuyorsunuz.", en: "On the {yer:eski_sehir} steps, someone's kneeling in front of a gull with a stub of charcoal, drawing a second gull beside it, shaky and bad. The head comes up. {npc:deniz_arman}. For a second neither of you remembers how to breathe." }
            kosul: { npc_gitti: "deniz_arman", bayrak_yok: "deniz_yukselenlere_gitti" }
          - metin: { tr: "{yer:eski_sehir|in} merdivenlerinde bir martının önünde biri diz çökmüş, elinde bir parça kömür; martının yanına ikinci bir martı çiziyor, kötü ve titrek. Başını kaldırıyor ve vapurda başlayan on yıl tek bir yüzde geri geliyor: {npc:deniz_arman}. Zayıflamış, saçları kesilmiş, kolunda iyileşmemiş bir yara; ama o.", en: "On the {yer:eski_sehir} steps, someone's kneeling in front of a gull with a stub of charcoal, drawing a second gull beside it, shaky and bad. The head comes up, and ten years that started on a ferry come back in a single face: {npc:deniz_arman}. Thinner, hair hacked short, an arm that never healed right. But {zamir:deniz_arman|o}." }
            kosul: { bayrak: "deniz_hic_bulunmadi", bayrak_yok: "deniz_bulundu" }
          - metin: { tr: "Her martının önünde bir saniye duruyorsun; yanında birinin durması gereken yerde. Onun yapacağı gibi parmaklarını çizgilerin üstünde, havada gezdiriyorsun. Dokunmuyorsun.", en: "You stop for a second in front of every gull, right where someone else should be standing. You trace the lines in the air the way they would have. You don't touch." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Martılar {yer:tepe|e} tırmanıyor ve bir okulun demir kapısında bitiyor. Kapının üstünde yeni bir tabela: [SEÇİLMİŞLER YURDU]. Son martı kapının hemen yanında, içeriden çizilmiş gibi.", en: "The gulls climb to {yer:tepe} and end at the iron gate of a school. There's a new sign over it: [DORMITORY OF THE CHOSEN]. The last gull is right beside the gate, like it was drawn from the inside." }
            kosul: { bayrak_yok: "kordon_dustu", bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Martılar {yer:tepe|e} tırmanıyor, okulun önünde dolanıyor, sonra yeniden aşağı iniyor: sahile, {yer:kordon|e}. Son martılar başka çocukların ellerinin yanında; en sonuncusu bir dalgakıranın taşında. Gözleri yok.", en: "The gulls climb to {yer:tepe}, circle the school, then come back down: to the beach, to {yer:kordon}. The last ones sit next to other kids' handprints. The very last is on a breakwater stone. It has no eyes." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Martılar {yer:tepe|e} tırmanıyor, okulun önünde dolanıyor, {yer:kordon|e} iniyor; sonra yeniden yukarı, {yer:kiyikent_liman|e} dönüyor. Taze, kalın, mutlu martılar: biri onları her gün yeniden çiziyor. Hepsi {fraksiyon:siginak|in} gümrük deposunun kapısında birleşiyor.", en: "The gulls climb to {yer:tepe}, circle the school, drop down to {yer:kordon}, then turn back uphill toward {yer:kiyikent_liman}. Fresh, thick, happy gulls: somebody's redrawing these every day. All of them meet at the door of {fraksiyon:siginak|pos} customs warehouse." }
            kosul: { bayrak_yok: ["kordon_dustu", "cekirdek_yukselenler"] }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "kordon_dustu" }
            metin: { tr: "\"Neden {yer:kordon|e} gidiyorlar? Neden oraya? Orası düştü...\"", en: "\"Why are they heading for {yer:kordon}? Why there? That's where it fell...\"" }
        secenekler:
          - id: "kordon"
            etiket: { tr: "Gözsüz martının gösterdiği yere in", en: "Go down to where the eyeless gull points" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kordon"
              - iliski: { deniz_arman: { baglilik: 4 } }
            kronik: { tr: "Gözsüz martının gösterdiği yere, düşmüş {yer:kordon|e} indin.", en: "You went down to where the eyeless gull pointed, into the fallen Esplanade." }
            sonraki: "dkb_olu"
          - id: "tepe"
            etiket: { tr: "Seçilmişler Yurdu'nun kapısını çal", en: "Knock on the gate of the Chosen's dormitory" }
            goster: { bayrak_yok: "kordon_dustu", bayrak: "cekirdek_yukselenler" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - bolge: "tepe"
              - iliski: { deniz_arman: { baglilik: 4 } }
            kronik: { tr: "Seçilmişler Yurdu'nun kapısını çaldın; o kapı daha önce hiç kimseye açılmamıştı.", en: "You knocked on the gate of the Chosen's dormitory. It had never opened for anyone before." }
            sonraki: "dkb_tepe"
          - id: "depo"
            etiket: { tr: "Gümrük deposunun kapısını aç", en: "Open the customs warehouse door" }
            goster: { bayrak_yok: ["kordon_dustu", "cekirdek_yukselenler"] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kiyikent_liman"
              - iliski: { deniz_arman: { baglilik: 4 } }
            kronik: { tr: "Martıların hepsinin birleştiği kapıyı açtın.", en: "You opened the door where all the gulls came together." }
            sonraki: "dkb_siginak"
          - id: "sarilmak"
            etiket: { tr: "Önce {npc:deniz_arman|e} sarıl; sonra devam et", en: "Hug {npc:deniz_arman} first. Then keep going" }
            goster: { npc_gitti: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_kardes_bulundu", agirlik: 40 }
            kronik: { tr: "Aylar sonra {npc:deniz_arman|e} yokuşun dibinde sarıldın; ikiniz de bir süre konuşamadınız.", en: "Months later you hugged {npc:deniz_arman} at the foot of a hill, and neither of you could talk for a while." }
            sonraki: "dkb_kavusma"
          - id: "kavusma"
            etiket: { tr: "Kömürü elinden al; martıyı birlikte bitirin", en: "Take the charcoal. Finish the gull together" }
            goster: { bayrak: "deniz_hic_bulunmadi", bayrak_yok: "deniz_bulundu" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - bayrak: "deniz_bulundu"
              - tanis: "deniz_arman"
              - iliski: { deniz_arman: { guven: 12, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_kardes_bulundu", agirlik: 50 }
            kronik: { tr: "Öğretici'nin sana hiç vermediği arkadaşı {yer:eski_sehir|in} merdivenlerinde buldun; ilk işiniz birlikte bir martı çizmek oldu.", en: "You found the friend the Tutorial never gave back on the {yer:eski_sehir} steps, and the first thing you did together was draw a gull." }
            sonraki: "dkb_kavusma"

      - id: "dkb_kavusma"
        paragraflar:
          - metin: { tr: "{npc:deniz_arman} kollarının arasında titriyor; sonra gülmeye başlıyor, o tanıdık, korkudan sonra gelen gülüşle. \"Vapuru yine kaçırttın,\" diyor. \"Üç aydır kaçırtıyorsun.\"", en: "{npc:deniz_arman} shakes in your arms, then starts laughing, that familiar laugh that comes after fear. \"You made us miss the ferry again,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Three months running.\"" }
            kosul: { bayrak: "deniz_hic_bulunmadi" }
          - metin: { tr: "{npc:deniz_arman} şalını omzundan indiriyor, katlıyor, sonra ne yapacağını bilemeden elinde tutuyor. \"Bana yalan söylediler,\" diyor. \"Ya da ben duymak istediğimi duydum. Hangisi daha kötü, bilmiyorum.\"", en: "{npc:deniz_arman} slides the shawl off {zamir:deniz_arman|onun} shoulders, folds it, then just holds it, not knowing what to do with it. \"They lied to me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Or I heard what I wanted to hear. I don't know which is worse.\"" }
            kosul: { bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "\"Gittiğimde,\" diyor {npc:deniz_arman}, gözlerini senden kaçırarak, \"seni bir daha göreceğimi sanmıyordum. Ya da görmek istemiyordum. Şimdi buradasın ve ben hâlâ ne hissettiğimi bilmiyorum.\"", en: "\"When I left,\" {npc:deniz_arman} says, not looking at you, \"I didn't think I'd see you again. Or I didn't want to. Now you're here, and I still don't know what I feel.\"" }
            kosul: { npc_gitti: "deniz_arman", bayrak_yok: ["deniz_yukselenlere_gitti", "deniz_hic_bulunmadi"] }
          - { tr: "Sonra martılara dönüyor, elinin tersiyle gözlerini siliyor. \"Kardeşim bunları benim için çiziyor. Bulunmak için. Hadi. Gerisini sonra konuşuruz.\"", en: "Then {zamir:deniz_arman|o} turn{zamir:deniz_arman|s} back to the gulls and wipe{zamir:deniz_arman|s} {zamir:deniz_arman|onun} eyes with the back of a hand. \"My sister's drawing these for me. To be found. Come on. We'll talk about the rest later.\"" }
        secenekler:
          - id: "kordon"
            etiket: { tr: "Birlikte gözsüz martının gösterdiği yere inin", en: "Go down together to where the eyeless gull points" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kordon"
            kronik: { tr: "Yeniden bir araya geldiğiniz gün birlikte düşmüş {yer:kordon|e} indiniz.", en: "The day you found each other again, you went down into the fallen Esplanade together." }
            sonraki: "dkb_olu"
          - id: "tepe"
            etiket: { tr: "Birlikte yurdun kapısını çalın", en: "Knock on the dormitory gate together" }
            goster: { bayrak_yok: "kordon_dustu", bayrak: "cekirdek_yukselenler" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - bolge: "tepe"
            kronik: { tr: "Yeniden bir araya geldiğiniz gün birlikte Seçilmişler'in kapısını çaldınız.", en: "The day you found each other again, you knocked on the Chosen's gate together." }
            sonraki: "dkb_tepe"
          - id: "depo"
            etiket: { tr: "Birlikte gümrük deposuna yürüyün", en: "Walk to the customs warehouse together" }
            goster: { bayrak_yok: ["kordon_dustu", "cekirdek_yukselenler"] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bolge: "kiyikent_liman"
            kronik: { tr: "Yeniden bir araya geldiğiniz gün martıların sonuna birlikte yürüdünüz.", en: "The day you found each other again, you walked to the end of the gulls together." }
            sonraki: "dkb_siginak"

      # ---------------------------------------------------------------- akıbet: Kordon'da ölü (kordon_dustu)
      - id: "dkb_olu"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon} artık bir sahil değil, bir kıyı mezarlığı. Banklar ters dönmüş, palmiyeler belinden kırılmış; kumun altında bir şeyler yavaşça kıpırdıyor, dalgalarla aynı ritimde.", en: "The Esplanade isn't a beach anymore. It's a graveyard with a shoreline. The benches are flipped, the palms snapped at the waist, and something under the sand shifts slowly, in time with the waves." }
          - { tr: "Gözsüz martı seni kumsalın ucundaki eski cankurtaran kulesine götürüyor. İçeride duvarların her santimi martı; aralarında yirmiye yakın küçük el izi. Köşede, birinin özenle serdiği bir {fraksiyon:siginak} battaniyesinin altında küçük bir beden var; açık kalmış avucunda mavi bir tebeşir.", en: "The eyeless gull leads you to the old lifeguard tower at the far end of the beach. Inside, every inch of wall is gulls, and between them, close to twenty little handprints. In the corner, under a {fraksiyon:siginak} blanket somebody laid over her with care, is a small body. There's a blue chalk in her open hand." }
          - metin: { tr: "{npc:deniz_arman} hiçbir ses çıkarmıyor. Diz çöküyor, battaniyenin ucunu kaldırıyor, yüze bakıyor ve battaniyeyi yavaşça, uyandırmaktan korkar gibi geri indiriyor. \"Ördek,\" diyor. Yalnızca bu kadar.", en: "{npc:deniz_arman} doesn't make a sound. Just kneels, lifts the edge of the blanket, looks at the face, and lowers it again slowly, like waking her is the worst thing that could happen. \"Duck,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. That's all." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Şalındaki işareti avucunda sıkıyor; kumaş yırtılıyor. \"Bana yurtta olduğunu söylediler,\" diye fısıldıyor. \"Ben onların ilahisini söylerken o burada...\"", en: "One fist closes on the mark sewn into the shawl, and the fabric rips. \"They told me she was at the dorm,\" {npc:deniz_arman} whispers. \"I was up there singing their hymns while she was down here...\"" }
            kosul: { npc_gitti: "deniz_arman", bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Yanına diz çöküyorsun. Burada olması gereken kişi Çıkış Kapısı'nın önünde bir hat tuttu ve sana yalnızca bir cümle bıraktı: tanıyamayacağım bir şeye dönüşme. O cümleyi şimdi bu küçük yüze söylemek istiyorsun ve söyleyemiyorsun.", en: "You kneel next to her. The one who ought to be here held a line in front of the Exit Gate and left you exactly one sentence: don't turn into something I wouldn't recognize. You want to say that sentence to this small face now, and you can't." }
            kosul: { npc_olu: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Ölümü taşmanın ilk saatinde olmuş; yaralardan değil, dumandan. Kuleye ilk sığınan oymuş ve öbür çocukları da o çağırmış. Duvardaki el izlerinin çoğu, çıkıp kurtulan ellerin izi.", en: "She died in the first hour of the breach. Smoke, not wounds. She was the first one into the tower, and she's the one who called the other kids in. Most of those handprints belong to hands that made it out." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kaydında son satır: [yakıt · teslim edilemedi]. teslim edilemedi. kendisi yerine başkalarını sakladı. bunu bilmeni istedim.", en: "last line on her record: [fuel · delivery failed]. delivery failed. she hid the others instead of herself. i wanted you to know that." }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Onu kucakla; kumsaldan sağ salim çıkar", en: "Pick her up. Get her off this beach" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 4 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_olu_bulundu"
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
              - savas: { dusmanlar: ["kordon_lesyiyen@dunya", "kordon_lesyiyen@dunya"], ortam: ["su"], kazan: "dkb_olu_tasima", kaybet: "dkb_olu_tasima_yenilgi", kac: "dkb_olu_tasima_yenilgi" }
            kronik: { tr: "Onu düşmüş {yer:kordon|den} kendi kollarında çıkarmaya kalktın; kumsaldaki her şey yolunu kesmeye çalıştı.", en: "You tried to carry her out of the fallen Esplanade in your own arms, and everything on that beach tried to stop you." }
          - id: "gom"
            etiket: { tr: "Onu burada, denizin yanında göm", en: "Bury her here, by the sea" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 4, duzen: -1 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_olu_bulundu"
              - iliski: { deniz_arman: { guven: 4, baglilik: 6 } }
            kronik: { tr: "Onu {yer:kordon|in} kumuna, dalgaların ulaşamadığı yere gömdün; dalgakırana bir martı çizildi.", en: "You buried her in {yer:kordon} sand, above the reach of the tide, and a gull went up on the breakwater." }
            sonraki: "dkb_olu_gomu"
          - id: "temizle"
            tur: "gosteris"
            etiket: { tr: "Kumsalı tek hamlede temizle; kimse onu rahatsız etmesin", en: "Clear the beach in one move. Nothing disturbs her" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -3 }
              - dikkat: 4
              - xp_seviye: 30
              - tehlike: { kordon: -2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_olu_bulundu"
              - iliski: { deniz_arman: { korku: 8, saygi: 6 } }
            kronik: { tr: "Bir kumsalı tek hamlede temizledin; üç hafta geç kalmış bir güçtü bu ve herkes bunu gördü.", en: "You cleared a whole beach in a single move. It was power that showed up three weeks late, and everybody saw it." }
            sonraki: "dkb_olu_ezme"
          - id: "cok"
            etiket: { tr: "{npc:deniz_arman|in} yanına çök; konuşma", en: "Kneel beside {npc:deniz_arman}. Don't talk" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_olu_bulundu"
              - iliski: { deniz_arman: { guven: 8, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_kardes_bulundu", agirlik: 60 }
            kronik: { tr: "Kardeşinin yanında {npc:deniz_arman} ile birlikte sustun; o sessizliği hiçbiriniz unutmadınız.", en: "You kept silent with {npc:deniz_arman} beside the sister, and neither of you ever forgot that silence." }
            sonraki: "dkb_olu_yas"
          - id: "anlat"
            etiket: { tr: "Ona {npc:deniz_arman|i} anlat; kimsenin anlatmadığı gibi", en: "Tell her about {npc:deniz_arman}, like nobody else will" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_olu_bulundu"
            kronik: { tr: "Ölü bir çocuğa, onu arayıp hiç bulamayan ölü bir arkadaşı anlattın; ikisi o gün ilk kez yan yana oldu.", en: "You told a dead child about the dead friend who searched for her and never found her. That day, they were side by side for the first time." }
            sonraki: "dkb_olu_anma"

      - id: "dkb_olu_tasima"
        yer: "kordon"
        paragraflar:
          - { tr: "Son leşyiyen kumun içine çöküyor ve kabuğundaki çizgili şemsiye yavaşça yana yatıyor. Kollarındaki yük o kadar hafif ki her adımda düşürmüş olmaktan korkuyorsun.", en: "The last scavenger caves into the sand, the striped umbrella on its shell tipping slowly sideways. The weight in your arms is so light you keep thinking you've dropped it." }
          - metin: { tr: "{npc:deniz_arman} arkanda, kuleden aldığı mavi tebeşiri iki eliyle göğsüne bastırmış yürüyor. {yer:kiyikent_liman|e} varana kadar tek kelime etmiyor; yalnızca yolda gördüğü her duvara bir martı çiziyor.", en: "{npc:deniz_arman} walks behind you, the blue chalk from the tower pressed to {zamir:deniz_arman|onun} chest with both hands. Not one word the whole way to {yer:kiyikent_liman}. Just a gull on every wall along the way." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "{yer:kiyikent_liman|e} varana kadar kimse seni durdurmuyor. Yolda gördüğün her duvara bir martı çiziyorsun; kötü, titrek, ama çiziyorsun. Birinin bunu yapması gerekiyordu.", en: "Nobody stops you all the way to {yer:kiyikent_liman}. You draw a gull on every wall you pass. Bad, shaky, but you draw them. Somebody had to." }
            kosul: { npc_olu: "deniz_arman" }
          - { tr: "{fraksiyon:siginak|in} gönüllüleri depo kapısında sizi görünce yerlerinden kalkıyor. Biri ağlamaya başlıyor; o battaniyeyi onun üstüne seren kişinin o olduğunu sonradan öğreniyorsun.", en: "{fraksiyon:siginak|pos} volunteers get to their feet when they see you at the warehouse door. One of them starts crying. Later you find out she's the one who laid that blanket over her." }
        secenekler:
          - id: "aksam"
            etiket: { tr: "Akşamı bekle; konuşma vakti gelecek", en: "Wait for evening. The time to talk will come" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Bir çocuğu düşmüş {yer:kordon|den} eve getirdin; {fraksiyon:siginak} bunu ilk mezar taşına yazdı.", en: "You brought a child home from the fallen Esplanade, and {fraksiyon:siginak} carved that on their first headstone." }
            sonraki: "dkb_karar"
          - id: "tas"
            etiket: { tr: "Mezar taşına iki isim yazdır", en: "Have two names put on the headstone" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - itibar: { siginak: 5 }
              - xp_seviye: 30
            kronik: { tr: "Bir mezar taşına iki isim yazdırdın: kardeş ve onu hiç bulamayan kardeşi. {yer:kiyikent} o taşı yıllarca çiçeksiz bırakmadı.", en: "You had two names cut into one headstone: the sister, and the sibling who never found her. {yer:kiyikent} never let that stone go without flowers." }
            sonraki: "@akis"

      - id: "dkb_olu_tasima_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Kum ayağının altından kayıyor ve leşyiyenin kıskacı seni dalgaların içine sürüklüyor. Son gördüğün şey kollarından kayan battaniye.", en: "The sand slides out from under you, and a scavenger's pincer drags you into the surf. The last thing you see is the blanket slipping out of your arms." }
          - { tr: "Kendine geldiğinde bir {fraksiyon:siginak} devriyesi seni kuma çekmiş. Onu kuleye geri götürmüşler, dalgaların ulaşmadığı yere gömmüşler bile. \"Taşıyamazdınız,\" diyor biri, nazikçe. \"Kimse taşıyamazdı.\"", en: "When you come to, a {fraksiyon:siginak} patrol has hauled you up onto dry sand. They took her back to the tower. They even buried her above the tide line. \"You couldn't have carried her,\" one of them says, gently. \"Nobody could've.\"" }
          - metin: { tr: "{npc:deniz_arman} mezarın başında oturuyor, sırtı sana dönük. \"Hiç değilse denedin,\" diyor, dönmeden.", en: "{npc:deniz_arman} is sitting at the grave with {zamir:deniz_arman|onun} back to you. \"At least you tried,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, without turning around." }
            kosul: { npc_hayatta: "deniz_arman" }
        secenekler:
          - id: "yanina"
            etiket: { tr: "Mezarın başına, onun yanına otur", en: "Sit down at the grave, next to {zamir:deniz_arman|onu}" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 4 } }
            kronik: { tr: "Taşıyamadığın çocuğun mezarında {npc:deniz_arman|in} yanına oturdun.", en: "You sat beside {npc:deniz_arman} at the grave of the child you couldn't carry." }
            sonraki: "dkb_karar"
          - id: "yemin"
            etiket: { tr: "Bir daha kimseyi kumda bırakmamaya yemin et", en: "Swear you'll never leave anyone in the sand again" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - stat: { wil: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            kronik: { tr: "{yer:kordon|in} kumunda bir yemin ettin; sonraki her taşmada o yemin seni ileri itti.", en: "You swore an oath on {yer:kordon} sand, and in every breach after that, the oath pushed you forward." }
            sonraki: "@akis"

      - id: "dkb_olu_gomu"
        yer: "kordon"
        paragraflar:
          - { tr: "Kumu ellerinle kazıyorsun; dalgaların ulaşamayacağı, dalgakıranın gölgesine düşen bir yeri seçiyorsun. Battaniyeyi açmıyorsun; tebeşiri onun avucunda bırakıyorsun.", en: "You dig with your hands, picking a spot in the breakwater's shadow where the tide can't reach. You don't open the blanket. You leave the chalk in her hand." }
          - metin: { tr: "{npc:deniz_arman} kumu son kez düzlüyor, sonra dalgakıranın taşına bir martı çiziyor; bu kez kafası doğru, gagası doğru. \"Ona hep martıların ördeğe benzemediğini söylerdim,\" diyor. \"Sonunda bir tane düzgün çizdim. Göremeyecek.\"", en: "{npc:deniz_arman} smooths the sand one last time, then draws a gull on the breakwater stone. Head right this time, beak right. \"I always told her gulls don't look like ducks,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Finally drew one right. She'll never see it.\"" }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Dalgakıranın taşına bir martı çiziyorsun ve ördeğe benzetmek için elinden geleni yapıyorsun. Bunu kimin için yaptığını bilmiyorsun; onun için mi, {npc:deniz_arman} için mi.", en: "You draw a gull on the breakwater stone, and you do your best to make it look like a duck. You don't know who it's for. Her, or {npc:deniz_arman}." }
            kosul: { npc_olu: "deniz_arman" }
        secenekler:
          - id: "aksam"
            etiket: { tr: "Güneş batana kadar mezarın başında kal", en: "Stay at the grave until the sun goes down" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { baglilik: 6 } }
            kronik: { tr: "{yer:kordon|de}ki küçük mezarın başında güneşin batışını izlediniz; dalgakırandaki martı yıllarca silinmedi.", en: "You watched the sun go down over the little grave on {yer:kordon}, and the gull on that breakwater didn't wash off for years." }
            sonraki: "dkb_karar"
          - id: "git"
            etiket: { tr: "Taşa son bir kez dokun ve yürü", en: "Touch the stone one last time and go" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - xp_seviye: 20
            kronik: { tr: "{yer:kordon|de} bir çocuğu gömdün ve dalgakırana bir martı çizdin; ölü bir arkadaşa verilmiş bir sözü yarım da olsa tuttun.", en: "You buried a child on {yer:kordon} and drew a gull on the breakwater, keeping half of a promise made to a dead friend." }
            sonraki: "@akis"

      - id: "dkb_olu_ezme"
        yer: "kordon"
        paragraflar:
          - { tr: "Kuleden çıkıp kumsala tek bir adım atıyorsun. Kumun altındaki her şey aynı anda donuyor; sonra seni hissettikleri yerden en uzak noktaya kaçmaya çalışıyorlar. Hiçbiri yetişemiyor.", en: "You step out of the tower and take one step onto the beach. Everything under the sand freezes at once, then tries to run from where it felt you to the farthest point it can reach. None of them make it." }
          - { tr: "Bir nefes sonra {yer:kordon} sessiz. Kabuklar, şemsiyeler, martı çığlığıyla bağıran o yengeç şeyler; hepsi tek bir satır, kenara itilmiş bir bildirim gibi.", en: "One breath later {yer:kordon} is silent. Shells, umbrellas, those crab things that scream like gulls: all of it reduced to a single line, like a notification swiped aside." }
          - metin: { tr: "{npc:deniz_arman} kulenin kapısında durmuş sana bakıyor. \"Bunu yapabiliyordun,\" diyor; sesinde suçlama yok, daha kötüsü var. \"Üç hafta önce de yapabiliyor muydun?\"", en: "{npc:deniz_arman} is standing in the tower door, looking at you. \"You could do that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. No accusation in it. Something worse. \"Could you do it three weeks ago, too?\"" }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kumsalda yalnızsın ve bu sessizliği kime gösterdiğini bilmiyorsun. Üç hafta önce burada olsaydın ne olurdu? Soru dalgalarla birlikte gelip gidiyor.", en: "You're alone on the beach, and you don't know who you just did this for. What if you'd been here three weeks ago? The question comes and goes with the waves." }
            kosul: { npc_olu: "deniz_arman" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Ve burada değildim.\"", en: "\"Yeah. And I wasn't here.\"" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 6, korku: -2 } }
            kronik: { tr: "Gücünün geç kaldığını {npc:deniz_arman|in} yüzüne söyledin; bu itiraf ikinizi de bir süre ayakta tuttu.", en: "You told {npc:deniz_arman} straight out that your power showed up too late, and that confession kept you both standing for a while." }
            sonraki: "dkb_karar"
          - id: "bilmiyorum"
            etiket: { tr: "\"Bilmiyorum. Artık neyi yapabildiğimi bilmiyorum.\"", en: "\"I don't know. I don't know what I can do anymore.\"" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { deniz_arman: { korku: 4, baglilik: 4 } }
            kronik: { tr: "Neyi yapabildiğini artık bilmediğini itiraf ettin; {npc:deniz_arman} o günden sonra seni daha dikkatli izledi.", en: "You admitted you no longer knew what you could do, and from that day on {npc:deniz_arman} watched you more carefully." }
            sonraki: "dkb_karar"
          - id: "gom"
            etiket: { tr: "Sessiz kumsalda onu göm", en: "Bury her on the silent beach" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
            kronik: { tr: "Kendi elinle sessizleştirdiğin bir kumsala bir çocuk gömdün.", en: "You buried a child on a beach you had silenced with your own hand." }
            sonraki: "dkb_olu_gomu"

      - id: "dkb_olu_yas"
        yer: "kordon"
        paragraflar:
          - { tr: "Yanına çöküyorsun. Uzun süre yalnızca dalgalar konuşuyor; kulenin tahtaları rüzgârda gıcırdıyor.", en: "You kneel down beside {npc:deniz_arman}. For a long time the only thing talking is the surf. The tower's boards creak in the wind." }
          - { tr: "\"Vapurda,\" diyor {npc:deniz_arman} sonunda, \"simidimi martılara atmayı ondan öğrendim. Beş yaşındaydı. Martıların ördek olduğunu sanıyordu ve kimse onu düzeltmedi, çünkü buna çok seviniyordu.\"", en: "\"On the ferry,\" {npc:deniz_arman} finally says, \"I learned it from her. Tossing pretzel bits to the gulls. She was five. She thought they were ducks, and nobody corrected her, because it made her so happy.\"" }
          - { tr: "Sonra elini senin elinin üstüne koyuyor; soğuk, kumlu, titreyen bir el. \"Ne yapacağımı bilmiyorum,\" diyor. \"Hayatımdaki her şey onu bulmaktı.\"", en: "Then a hand settles over yours. Cold, sandy, shaking. \"I don't know what to do,\" {npc:deniz_arman} says. \"Everything in my life was finding her.\"" }
        secenekler:
          - id: "gom"
            etiket: { tr: "\"Önce onu uyutalım. Sonra düşünürüz.\"", en: "\"Let's lay her to rest first. Then we'll think.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Önce ölüyü uğurlamayı seçtin; geri kalan her şeyi sonraya bıraktın.", en: "You chose to lay the dead to rest first and left everything else for later." }
            sonraki: "dkb_olu_gomu"
          - id: "tut"
            etiket: { tr: "Elini sıkı tut: \"O zaman beni bul. Buradayım.\"", en: "Hold on tight: \"Then find me. I'm right here.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 10 } }
            kronik: { tr: "{npc:deniz_arman|e} kaybettiğinin yerine seni bulmasını söyledin; bu söz hem bir yük oldu hem bir çapa.", en: "You told {npc:deniz_arman} to find you in place of what was lost. That promise became both a burden and an anchor." }
            sonraki: "dkb_olu_gomu"

      - id: "dkb_olu_anma"
        yer: "kordon"
        paragraflar:
          - { tr: "\"Biri seni arıyordu,\" diyorsun battaniyeye. \"Vapurda simidini martılarla paylaşan, herkesi koruyup kendini korumayan biri. Kırık İstasyon'da duvara çizdiğin martıyı gördü; ördek dedi ve ağladı.\"", en: "\"Somebody was looking for you,\" you tell the blanket. \"Somebody who shared pretzels with the gulls on the ferry. Who looked out for everybody but themselves. They saw the gull you drew at the Broken Station. Called it a duck, and cried.\"" }
          - { tr: "\"Çıkış Kapısı'nda benim için bir hat tuttu. Bu yüzden buraya gelemedi. Bu yüzden ben geldim.\" Dalgalar bir süre sesini yutuyor.", en: "\"They held a line for me at the Exit Gate. That's why they couldn't come. That's why I'm here instead.\" For a while, the surf swallows your voice." }
          - metin: { tr: "{npc:yanki} uzun süre bir şey demiyor. Sonra: ölüler veri üretmez demiştim. yanılmışım. bu ikisi hâlâ seni değiştiriyor.", en: "{npc:yanki} doesn't say anything for a long time. Then: i said dead things stop generating data. i was wrong. these two are still changing you." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "gom"
            etiket: { tr: "Onu dalgakıranın gölgesine göm", en: "Bury her in the breakwater's shadow" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Ölü bir arkadaşın kardeşini, ona arkadaşını anlattıktan sonra gömdün.", en: "You buried a dead friend's little sister after telling her all about them." }
            sonraki: "dkb_olu_gomu"
          - id: "tebesir"
            etiket: { tr: "Tebeşirini al; artık martıları sen çizeceksin", en: "Take her chalk. You'll draw the gulls now" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - esya: { martili_tebesir: 1 }
            kronik: { tr: "Ölü bir çocuğun tebeşirini aldın; o günden sonra {yer:kiyikent|in} duvarlarında martılar hiç eksik olmadı.", en: "You took a dead child's chalk, and after that day, {yer:kiyikent|pos} walls were never short on gulls." }
            sonraki: "dkb_olu_gomu"

      # ---------------------------------------------------------------- akıbet: Tepe'de Seçilmiş (cekirdek_yukselenler)
      - id: "dkb_tepe"
        yer: "tepe"
        paragraflar:
          - { tr: "Kapıyı iki gri figür açıyor; gülümsüyorlar, ama gözleri gülmüyor. Eski okulun koridorlarında gri giysili çocuklar sıra sıra oturmuş, aynı ilahiyi mırıldanıyor; ilahinin sözleri bir Sistem bildirimine benziyor.", en: "Two gray figures open the gate, smiling with their mouths and nothing else. Down the halls of the old school, kids in gray sit in rows murmuring the same hymn, and the words sound like a System notification." }
          - { tr: "Pencerenin önünde on üç yaşında bir kız, nefesiyle buğuladığı cama parmağıyla martılar çiziyor. Göğsünde, gri kumaşın altından bir işaret parlıyor; dikilmemiş, yakılmış.", en: "At the window, a thirteen-year-old girl is fogging the glass with her breath and drawing gulls in it with one finger. On her chest, under the gray cloth, a mark is glowing. Not stitched. Burned." }
          - metin: { tr: "Dönüyor ve {npc:deniz_arman|i} görüyor. Yüzü bir saniyeliğine eski yüzü oluyor, beş yaşındaki, martıya ördek diyen yüz. Sonra ilahi geri geliyor. \"Sen de seçildin mi?\" diye soruyor, mutlu. \"Ses seni de buldu mu?\"", en: "She turns and sees {npc:deniz_arman}. For one second her face is her old face, the five-year-old who called gulls ducks. Then the hymn comes back. \"Did you get chosen too?\" she asks, happy. \"Did the voice find you too?\"" }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Dönüyor ve sana bakıyor; tanımıyor. \"Ziyaretçi kabul etmiyoruz,\" diyor, öğrendiği bir cümleyi söyler gibi. Sonra elindeki tebeşire bakıyor. \"Kim verdi bunu sana?\"", en: "She turns and looks at you without a flicker of recognition. \"We don't take visitors,\" she says, like a line she memorized. Then she sees the chalk in your hand. \"Who gave you that?\"" }
            kosul: { npc_olu: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Yakılmış işaretin altında bir Sistem etiketi var, gözle görünmüyor ama senin gözünle görünüyor: [YAKIT · ÇEKİRDEK AYİNİ · SIRA: 4]. Kız bunu bilmiyor. Ona seçildiğini söylüyorlar.", en: "Under the burned mark there's a System tag, invisible to the eye but not to yours: [FUEL · CORE RITE · QUEUE: 4]. The girl doesn't know. They tell her she's chosen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ilahideki ses. tanıyorum onu. o da benim gibi bir parça değil; o sistemin kendisi değil. o, sistemi taklit eden insanların sesi. daha kötü.", en: "the voice in that hymn. i know it. it's not a fragment like me, and it's not the system either. it's people doing an impression of the system. that's worse." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { npc_hayatta: "deniz_arman" }
            metin: { tr: "\"Ördek... Ördek, bak bana. Benim.\"", en: "\"Duck... Duck, look at me. It's me.\"" }
        secenekler:
          - id: "ikna"
            etiket: { tr: "Onu ikna et: kendi isteğiyle seninle gelsin", en: "Convince her. She walks out of her own free will" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "dkb_tepe_kalir", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { bayrak: "deniz_kardes_bulundu" }, { bayrak: "kardes_yukselenlerde" }] }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - itibar: { yukselenler: -6 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
            kronik: { tr: "Bir çocuğu Seçilmişler Yurdu'ndan zorla değil, sözle çıkardın; o kapıdan kendi ayaklarıyla yürüyen ilk çocuk oydu.", en: "You got a kid out of the Chosen's dormitory with words, not force. She was the first child to walk out that gate on her own feet." }
            sonraki: "dkb_tepe_cikis"
          - id: "liste"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni aç; ona gerçek listeyi göster", en: "Open your window. Show her the real list" }
            gerekli: { stat: { int: 50 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - bilgi: "kardes_yakit_listesi"
              - itibar: { yukselenler: -10 }
              - iliski: { deniz_arman: { saygi: 8, korku: 4 } }
            kronik: { tr: "Bir çocuğa kendi adını yakıt sütununda gösterdin; inancı o gün çöktü, hayatı da o gün kurtuldu.", en: "You showed a child her own name in the fuel column. Her faith collapsed that day, and that same day her life was saved." }
            sonraki: "dkb_tepe_liste"
          - id: "zorla"
            etiket: { tr: "Onu zorla çıkar; muhafızlar önüne çıkarsa çıksın", en: "Drag her out. Let the wardens try to stop you" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -5 }
              - dikkat: 4
              - bayrak: "deniz_kardes_bulundu"
              - itibar: { yukselenler: -15 }
              - iliski: { deniz_arman: { korku: 6 } }
              - savas: { dusmanlar: ["isaretli_muhafiz@dunya", "isaretli_muhafiz@dunya"], ortam: ["dar_gecit"], kazan: "dkb_tepe_zorla", kaybet: "dkb_tepe_atildi", kac: "dkb_tepe_atildi" }
            kronik: { tr: "Seçilmişler Yurdu'ndan bir çocuğu çığlık çığlığa, zorla çıkardın; {yer:tepe} bunu hiç affetmedi.", en: "You dragged a screaming child out of the Chosen's dormitory by force, and {yer:tepe} never forgave you for it." }
          - id: "birak"
            etiket: { tr: "Kararına saygı göster; burada kalsın", en: "Respect her choice. She stays" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -3 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_yukselenlerde"
              - iliski: { deniz_arman: { guven: -6, saygi: 4 } }
            kronik: { tr: "On üç yaşındaki bir çocuğun seçimine saygı gösterdin; o seçimin kime ait olduğunu hiç sormadın.", en: "You respected a thirteen-year-old's choice, and never asked whose choice it really was." }
            sonraki: "dkb_tepe_kalir"
          - id: "deniz_konus"
            etiket: { tr: "Geri çekil; {npc:deniz_arman} onunla konuşsun", en: "Step back. Let {npc:deniz_arman} talk to her" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "deniz_kardes_bulundu"
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
            kronik: { tr: "Bir adım geri çekildin ve kardeşini kurtarmayı {npc:deniz_arman|e} bıraktın.", en: "You took a step back and left the saving of the sister to {npc:deniz_arman}." }
            sonraki: "dkb_tepe_deniz"

      - id: "dkb_tepe_deniz"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} kızın önüne çömeliyor, yüzlerini aynı hizaya getiriyor. Cebinden buruşmuş, eski bir vapur bileti çıkarıyor; arkasında tükenmez kalemle bir martı. \"Bunu Öğretici'de, bir tünelde buldum,\" diyor. \"Senin martın. Ben bunu takip ettim. Hep takip ettim.\"", en: "{npc:deniz_arman} crouches in front of the girl, bringing their faces level, and pulls a crumpled old ferry ticket out of a pocket. On the back, in ballpoint: a gull. \"I found this in a tunnel back in the Tutorial,\" {npc:deniz_arman} says. \"Your gull. I followed it. I've been following it the whole time.\"" }
          - { tr: "Kız bilete bakıyor. İlahi bir an duruyor; dudakları kıpırdıyor ama ses çıkmıyor. Sonra çok küçük bir sesle: \"Ördek değil o,\" diyor. \"Martı. Martı olduğunu biliyorum artık.\"", en: "The girl stares at the ticket. The hymn stops for a second. Her lips move, no sound. Then, very small: \"That's not a duck,\" she says. \"It's a gull. I know it's a gull now.\"" }
          - { tr: "Arkada muhafızlardan biri ilahiyi yeniden başlatıyor, daha yüksek sesle. Kızın gözleri yeniden bulanıyor; iki dünya arasında bir ip gibi gerilmiş.", en: "Behind you, one of the wardens starts the hymn up again, louder. The girl's eyes cloud back over. She's stretched between two worlds like a rope." }
        secenekler:
          - id: "destek"
            etiket: { tr: "{npc:deniz_arman|in} omzuna elini koy; sesini ilahinin üstüne çıkar", en: "Hand on {npc:deniz_arman|pos} shoulder. Lift your voice over the hymn" }
            gerekli: { iliski_min: { deniz_arman: { baglilik: 40 } } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - bayrak: "kardes_kurtarildi"
              - itibar: { yukselenler: -6 }
              - iliski: { deniz_arman: { baglilik: 10, guven: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_kardes_bulundu", agirlik: 60 }
            kronik: { tr: "Bir ilahinin üstüne iki kişinin sesi çıktı ve bir çocuk o sesleri seçti.", en: "Two voices rose over a hymn, and a child chose those voices." }
            sonraki: "dkb_tepe_cikis"
          - id: "muhafiz"
            tur: "gosteris"
            etiket: { tr: "Muhafıza tek bir bakış at; ilahi sussun", en: "Give the warden one look. The hymn stops" }
            gerekli: { stat: { wil: 55 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - dikkat: 3
              - bayrak: "kardes_kurtarildi"
              - itibar: { yukselenler: -8 }
              - iliski: { deniz_arman: { saygi: 6, korku: 6 } }
            kronik: { tr: "Bir ilahiyi tek bir bakışla susturdun; yurttaki çocuklar o sessizliği yıllarca anlattı.", en: "You silenced a hymn with a single look, and the kids in that dorm talked about the silence for years." }
            sonraki: "dkb_tepe_cikis"
          - id: "zaman"
            etiket: { tr: "\"Zamana ihtiyacı var. Zorlamayalım.\"", en: "\"She needs time. Let's not push.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "kardes_yukselenlerde"
              - iliski: { deniz_arman: { guven: -2, saygi: 2 } }
            kronik: { tr: "Bir çocuğa zaman tanıdın; Seçilmişler'in ona ne kadar zaman tanıyacağını bilmeden.", en: "You gave a child time, not knowing how much time the Chosen would give her." }
            sonraki: "dkb_tepe_kalir"

      - id: "dkb_tepe_liste"
        yer: "tepe"
        paragraflar:
          - { tr: "Penceren ikinizin arasında açılıyor; mavisi koridorun grisini yarıyor. Satırları büyütüyorsun: [SEÇİLMİŞ] sütununda onun adının üstünde bir çizgi, [YAKIT] sütununda aynı ad, yanında bir sıra numarası.", en: "Your window opens between you, its blue slicing through the gray of the hallway. You enlarge the lines: in the [CHOSEN] column, a strike through her name. In the [FUEL] column, the same name, with a queue number beside it." }
          - { tr: "Kız okuyor. Bir kez, iki kez. Sonra göğsündeki işarete dokunuyor, sanki ilk kez fark ediyormuş gibi. \"Yakıt,\" diyor. \"Bana seçildiğimi söylediler.\"", en: "The girl reads it. Once. Twice. Then she touches the mark on her chest like she's noticing it for the first time. \"Fuel,\" she says. \"They told me I was chosen.\"" }
          - { tr: "Koridordaki ilahi dağılıyor; çocuklar bir bir başlarını kaldırıp senin pencerene bakıyor. Muhafızlar ilk kez ne yapacaklarını bilmiyor.", en: "The hymn in the hallway comes apart. One by one the kids lift their heads to look at your window. For the first time, the wardens don't know what to do." }
        secenekler:
          - id: "elini_tut"
            etiket: { tr: "Elini uzat: \"Gidelim.\"", en: "Hold out your hand: \"Let's go.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Kendi adını yakıt listesinde gören bir çocuğa elini uzattın ve o eli tuttu.", en: "You held out your hand to a child who'd just seen her name on the fuel list, and she took it." }
            sonraki: "dkb_tepe_cikis"
          - id: "hepsi"
            etiket: { tr: "Pencereyi bütün koridora çevir; hepsi görsün", en: "Turn the window on the whole hallway. Let them all see" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -4 }
              - dikkat: 5
              - degisken: { hayatta_kalan: 2 }
              - itibar: { yukselenler: -12, siginak: 4 }
            kronik: { tr: "Seçilmişler Yurdu'ndaki bütün çocuklara yakıt listesini gösterdin; o gece yurt yarı yarıya boşaldı.", en: "You showed every kid in the Chosen's dormitory the fuel list, and by that night the dorm was half empty." }
            sonraki: "dkb_tepe_cikis"

      - id: "dkb_tepe_cikis"
        yer: "tepe"
        paragraflar:
          - { tr: "Yurdun demir kapısından çıkıyorsunuz. Arkada ilahi yeniden başlıyor ama artık daha cılız; bir şey çatlamış ve onu kimse tam onaramıyor.", en: "You walk out through the dormitory's iron gate. Behind you the hymn starts up again, but thinner now. Something cracked, and nobody can quite fix it." }
          - metin: { tr: "Kız {npc:deniz_arman|in} elini bırakmıyor. Yokuşun yarısında duruyor, gri giysisinin yakasını açıp işarete bakıyor, sonra yakayı kapatıyor. \"Geçer mi bu?\" diye soruyor. {npc:deniz_arman} cevap veremiyor; sana bakıyor.", en: "The girl won't let go of {npc:deniz_arman|pos} hand. Halfway down the hill she stops, opens the collar of her gray shirt, looks at the mark, closes it again. \"Does this go away?\" she asks. {npc:deniz_arman} can't answer. Just looks at you." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kız elini bırakmıyor. Yokuşun yarısında duruyor ve sana bakıyor. \"Tebeşiri kim verdi sana?\" diye soruyor yeniden. Bu kez cevap vermek zorunda olduğunu biliyorsun.", en: "The girl won't let go of your hand. Halfway down the hill she stops and looks up at you. \"Who gave you the chalk?\" she asks again. This time you know you have to answer." }
            kosul: { npc_olu: "deniz_arman" }
        secenekler:
          - id: "gecer"
            etiket: { tr: "\"Geçer. Ve geçene kadar yanında olacağız.\"", en: "\"It'll fade. And we'll be with you until it does.\"" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { siginak: 3 }
              - iliski: { deniz_arman: { baglilik: 6 } }
            kronik: { tr: "Bir çocuğa yarasının geçeceğine söz verdin ve ikinci yarısını da tuttun: yanında oldunuz.", en: "You promised a child her scar would fade, and kept the second half of it: you stayed with her." }
            sonraki: "dkb_karar"
          - id: "anlat"
            etiket: { tr: "Ona {npc:deniz_arman|i} anlat; Çıkış Kapısı'nı da", en: "Tell her about {npc:deniz_arman}. The Exit Gate too" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - itibar: { siginak: 4 }
              - xp_seviye: 30
            kronik: { tr: "Kurtardığın çocuğa, onu arayan ve senin için ölen kişiyi anlattın; kız o hikâyeyi bir ömür boyunca anlattı.", en: "You told the child you saved about the one who searched for her and died for you, and she told that story the rest of her life." }
            sonraki: "dkb_tepe_anma"

      - id: "dkb_tepe_anma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Anlatıyorsun: vapuru, simitleri, Kırık İstasyon'daki duvarı, tüneldeki bileti. Sonra Çıkış Kapısı'nı; omzunun üstünden dönüp bakan son yüzü.", en: "You tell her everything: the ferry, the pretzels, the wall at the Broken Station, the ticket in the tunnel. Then the Exit Gate, and the last face that looked back over a shoulder." }
          - { tr: "Kız hiç ağlamıyor. Dinliyor, tebeşiri avucunda çeviriyor. Sonra {fraksiyon:siginak|in} deposunun duvarına gidip bir martı çiziyor, yanına bir tane daha; ikincisi daha büyük, kanatlarını birincisinin üstüne açmış.", en: "She doesn't cry once. She listens, turning the chalk over in her palm. Then she walks to the wall of {fraksiyon:siginak|pos} warehouse and draws a gull, and another one beside it. The second one's bigger, wings spread over the first." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu {fraksiyon:siginak|e} emanet et; arada bir uğra", en: "Leave her in {fraksiyon:siginak|pos} care. Drop by now and then" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Ölü arkadaşının kardeşini {fraksiyon:siginak|e} emanet ettin ve ona uğramayı hiç bırakmadın.", en: "You left your dead friend's sister in {fraksiyon:siginak|pos} care and never stopped dropping by." }
            sonraki: "@akis"
          - id: "marti"
            etiket: { tr: "Duvara üçüncü bir martı çiz", en: "Draw a third gull on the wall" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - xp_seviye: 15
            kronik: { tr: "Bir depo duvarına üç martı çizildi; biri için yaşayan, biri için ölü, biri için sen.", en: "Three gulls went up on a warehouse wall: one for the living, one for the dead, and one for you." }
            sonraki: "@akis"

      - id: "dkb_tepe_kalir"
        yer: "tepe"
        paragraflar:
          - { tr: "Kız pencereye dönüyor ve camdaki martıyı nefesiyle yeniden buğuluyor. \"Ben seçildim,\" diyor, sana değil, cama. \"Ses beni seçti. Gidemem.\"", en: "The girl turns back to the window and fogs the gull on the glass with her breath again. \"I was chosen,\" she says, not to you, to the glass. \"The voice chose me. I can't leave.\"" }
          - { tr: "Muhafızlar kapıyı göstermek için kenara çekiliyor; kibarca, sabırla, kazanmış insanların rahatlığıyla.", en: "The wardens step aside to show you the door. Politely. Patiently. With the ease of people who've already won." }
          - metin: { tr: "{npc:deniz_arman} kapının eşiğinde duruyor ve çıkmıyor. Sana dönüp bakıyor; bakışında bir özür, bir karar, bir veda var.", en: "{npc:deniz_arman} stops on the threshold and doesn't step out. Turns back to look at you, and in that look there's an apology, a decision, and a goodbye." }
            kosul: { npc_hayatta: "deniz_arman" }
        secenekler:
          - id: "aksam"
            etiket: { tr: "Kapının dışında bekle; {npc:deniz_arman} gelsin", en: "Wait outside the gate. Let {npc:deniz_arman} come to you" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { deniz_arman: { saygi: 4 } }
            kronik: { tr: "Seçilmişler'in kapısının dışında {npc:deniz_arman|i} bekledin; ne karar verirse ona saygı gösterecektin.", en: "You waited for {npc:deniz_arman} outside the Chosen's gate, ready to respect whatever {zamir:deniz_arman|o} decided." }
            sonraki: "dkb_karar"
          - id: "tebesir"
            etiket: { tr: "Tebeşiri pencerenin önüne bırak ve çık", en: "Leave the chalk at her window and walk out" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 8, max: 15 }, kosul: { bayrak: "kardes_yukselenlerde" } }
            kronik: { tr: "Seçilmişler Yurdu'nun penceresine bir tebeşir bıraktın; bir gün o tebeşirle yazılmış bir yardım çağrısı geldi.", en: "You left a chalk at a window in the Chosen's dormitory, and one day a call for help came, written in that chalk." }
            sonraki: "@akis"

      - id: "dkb_tepe_zorla"
        yer: "tepe"
        paragraflar:
          - { tr: "İkinci muhafız ilahisini yarıda bırakıp yere yığılıyor. Kızı belinden kavrayıp koridordan çıkarıyorsun; tırmalıyor, ısırıyor, sesini kaybedene kadar ilahi söylüyor.", en: "The second warden drops in the middle of his hymn. You grab the girl around the waist and haul her down the hall. She claws, she bites, she sings the hymn until her voice gives out." }
          - { tr: "Yokuşun dibinde onu yere bıraktığında sana öyle bir nefretle bakıyor ki bir an geri çekiliyorsun. \"Beni yaktılar,\" diyor, göğsünü göstererek. \"Ama sen beni çaldın.\"", en: "At the bottom of the hill you set her down, and she looks at you with so much hate you actually step back. \"They burned me,\" she says, pointing at her chest. \"But you stole me.\"" }
          - metin: { tr: "{npc:deniz_arman} ona sarılmaya çalışıyor; kız onu da itiyor. {npc:deniz_arman} kolları havada, yokuşun ortasında kalakalıyor.", en: "{npc:deniz_arman} tries to hug her, and she shoves {zamir:deniz_arman|onu} away too. {npc:deniz_arman} is left standing in the middle of the hill with both arms still raised." }
            kosul: { npc_hayatta: "deniz_arman" }
        secenekler:
          - id: "sabir"
            etiket: { tr: "\"Bana nefret et. Yeter ki yaşa.\"", en: "\"Hate me. Just live.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - bayrak: "kardes_kurtarildi"
              - itibar: { siginak: 3 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Bir çocuğun nefretini, hayatını kurtarmanın bedeli olarak kabul ettin.", en: "You accepted a child's hatred as the price of saving her life." }
            sonraki: "dkb_karar"
          - id: "teslim"
            etiket: { tr: "Onu {fraksiyon:siginak|e} teslim et ve uzaklaş", en: "Hand her off to {fraksiyon:siginak} and keep your distance" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - bayrak: "kardes_kurtarildi"
              - itibar: { siginak: 4 }
            kronik: { tr: "Zorla kurtardığın çocuğu {fraksiyon:siginak|e} teslim ettin ve bir daha karşısına çıkmadın.", en: "You handed the child you saved by force to {fraksiyon:siginak} and never stood in front of her again." }
            sonraki: "dkb_karar"

      - id: "dkb_tepe_atildi"
        yer: "tepe"
        paragraflar:
          - { tr: "Muhafızların sopaları ilahinin ritmiyle iniyor ve sen bir yerde ritmi kaçırıyorsun. Kendine geldiğinde yurdun demir kapısının dışında, kaldırımdasın; kapı kilitli.", en: "The wardens' staffs come down on the beat of the hymn, and somewhere in there you lose the rhythm. When you come to, you're on the sidewalk outside the dormitory's iron gate, and the gate is locked." }
          - { tr: "Yukarıdaki pencerede kız duruyor. Seni izliyor; yüzünde ne korku var ne acıma. Sonra nefesiyle camı buğuluyor ve martıyı siliyor.", en: "The girl is standing in the window upstairs, watching you. No fear on her face. No pity. Then she breathes on the glass and wipes the gull away." }
        secenekler:
          - id: "karar"
            etiket: { tr: "Kalk. Bu iş burada bitmedi", en: "Get up. This isn't over" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 2 }
              - bayrak: "kardes_yukselenlerde"
              - iliski: { deniz_arman: { saygi: 2 } }
            kronik: { tr: "Seçilmişler'in kapısının önünde yere serildin ve kalkıp yeniden denemeye yemin ettin.", en: "You got knocked flat outside the Chosen's gate and swore you'd get up and try again." }
            sonraki: "dkb_karar"
          - id: "git"
            etiket: { tr: "Kalk ve yokuştan in", en: "Get up and walk back down the hill" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - bayrak: "kardes_yukselenlerde"
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 8, max: 15 }, kosul: { bayrak: "kardes_yukselenlerde" } }
            kronik: { tr: "Seçilmişler'in kapısından atıldın; o pencerede bir martı silindi ve sen bunu izledin.", en: "You got thrown out of the Chosen's gate and watched a gull get wiped off a window." }
            sonraki: "@akis"

      # ---------------------------------------------------------------- akıbet: Sığınak'ta, kurtarılmış
      - id: "dkb_siginak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük deposunun içi çocuk sesiyle dolu. Portakal kasalarından yapılmış ranzalar, ipe asılı çamaşırlar ve her duvarda martılar; yüzlerce. Bazıları ördeğe benziyor, bazıları benzetilmeye çalışılmış.", en: "The inside of the customs warehouse is loud with kids. Bunks built out of orange crates, laundry on lines, and gulls on every wall, hundreds of them. Some look like ducks. Some were trying to." }
          - { tr: "Duvarın dibinde, mavi tebeşirle yeni bir martı çizen bir kız var; on üç yaşında, dirseklerine kadar mavi toz. Kapının her açılışında başını kaldırıp bakıyor.", en: "At the foot of the wall, a girl is drawing a fresh gull in blue chalk. Thirteen, blue dust up to her elbows. Every time the door opens, her head comes up." }
          - metin: { tr: "Bu kez başını kaldırdığında tebeşir elinden düşüyor. \"{npc:deniz_arman}!\" Yerinden fırlıyor, iki ranzanın arasından, bir çamaşır ipinin altından koşuyor ve bütün ağırlığıyla {npc:deniz_arman|in} göğsüne çarpıyor.", en: "This time when her head comes up, the chalk falls out of her hand. \"{npc:deniz_arman}!\" She's up and running, between two bunks, under a laundry line, and she crashes into {npc:deniz_arman|pos} chest with everything she's got." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Bu kez başını kaldırıp sana bakıyor; sonra arkana, kapıya. Biri daha gelecek mi diye bakar gibi. Kimse gelmiyor.", en: "This time her head comes up and she looks at you, then past you, at the door. Like checking whether someone else is coming. Nobody is." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Sonra seni görüyor ve gözleri büyüyor. \"Sen,\" diyor. \"{yer:kordon|de}... dalganın içinden bizi sen çıkardın.\"", en: "Then she sees you, and her eyes go wide. \"You,\" she says. \"At {yer:kordon}... you're the one who pulled us out of the wave.\"" }
            kosul: { bayrak: "kordon_kurtarildi" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Göğsünde silik bir yanık izi var; işaret yakılmaya başlanmış ama bitirilmemiş. Biri yarıda kesmiş. Ya da o kaçmış.", en: "There's a faded burn on her chest. Someone started burning the mark in and never finished. Somebody interrupted. Or she ran." }
        secenekler:
          - id: "geri_cekil"
            etiket: { tr: "Geri çekil; bu an onların", en: "Step back. This moment is theirs" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_kardes_bulundu", agirlik: 60 }
            kronik: { tr: "{npc:deniz_arman} kardeşini bir depo dolusu martının ortasında buldu; sen bir adım geri çekilip izledin.", en: "{npc:deniz_arman} found the sister in a warehouse full of gulls, and you took one step back and watched." }
            sonraki: "dkb_siginak_kavusma"
          - id: "nasil"
            etiket: { tr: "Ona nasıl kurtulduğunu sor", en: "Ask her how she got out" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - bilgi: "kardes_yakit_listesi"
              - iliski: { deniz_arman: { saygi: 4 } }
            kronik: { tr: "Kurtulan bir çocuğun hikâyesini dinledin; o hikâye {fraksiyon:yukselenler|in} yakıt listesini ilk kez gün ışığına çıkardı.", en: "You listened to a surviving child's story, and that story dragged {fraksiyon:yukselenler|pos} fuel list into daylight for the first time." }
            sonraki: "dkb_siginak_hikaye"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Yüzünü sakla; seni tanıdığını kimse bilmesin", en: "Hide your face. Nobody needs to know she knows you" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1, insanlik: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - iliski: { deniz_arman: { saygi: 6 } }
            kronik: { tr: "{yer:kordon|de} kurtardığın çocuğun teşekkürünü almadın; parmağını dudaklarına götürdün, o da sırrını tuttu.", en: "You didn't take the thanks of the child you pulled out at {yer:kordon}. You put a finger to your lips, and she kept your secret." }
            sonraki: "dkb_siginak_kavusma"
          - id: "soz"
            etiket: { tr: "Depodaki herkese koruma sözü ver", en: "Promise everyone in this warehouse protection" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - itibar: { siginak: 6 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
              - iliski: { deniz_arman: { saygi: 6, baglilik: 4 } }
              - iliski: { elif_sari: { guven: 4 } }
            kronik: { tr: "Bir depo dolusu çocuğa koruma sözü verdin; {fraksiyon:siginak} o sözü kapısının üstüne yazdı.", en: "You promised a warehouse full of kids protection, and {fraksiyon:siginak} painted that promise over their door." }
            sonraki: "dkb_siginak_kavusma"
          - id: "anlat"
            etiket: { tr: "Yanına otur; ona {npc:deniz_arman|i} anlat", en: "Sit down with her. Tell her about {npc:deniz_arman}" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - bayrak: "deniz_kardes_bulundu"
              - bayrak: "kardes_kurtarildi"
            kronik: { tr: "Kapıya bakmayı bırakmayan bir çocuğa, kimsenin artık gelmeyeceğini sen söyledin; ama nedenini de anlattın.", en: "You were the one who told a child, still watching the door, that nobody else was coming. But you told her why." }
            sonraki: "dkb_siginak_anma"

      - id: "dkb_siginak_kavusma"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "{npc:deniz_arman} onu havaya kaldırıyor, yere indiriyor, yeniden kaldırıyor; bir türlü bırakamıyor. İkisi de aynı anda hem ağlıyor hem konuşuyor ve hiçbiri ötekini dinlemiyor.", en: "{npc:deniz_arman} lifts her up, sets her down, lifts her up again. Can't let go. They're both crying and talking at the same time, and neither of them is listening to the other." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Sonra kız {npc:deniz_arman|in} omzunun üstünden sana bakıyor. \"Martıları sen mi gördün?\" diye soruyor. \"{npc:deniz_arman} hep yanlış yöne bakar. Hep birinin göstermesi gerekir.\"", en: "Then the girl looks at you over {npc:deniz_arman|pos} shoulder. \"Did you see the gulls first?\" she asks. \"{npc:deniz_arman} always looks the wrong way. Somebody always has to point.\"" }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kız sana bakıyor, sonra arkana; birini arıyor. Söylemen gereken şeyi söylüyorsun. Ağlamıyor. Yalnızca cebindeki mavi tebeşiri çıkarıp avucuna bırakıyor: \"Bunu ona verecektim.\"", en: "The girl looks at you, then past you, looking for someone. You tell her what you have to tell her. She doesn't cry. She just takes the blue chalk out of her pocket and puts it in your palm. \"I was gonna give this to them.\"" }
            kosul: { npc_olu: "deniz_arman" }
          - { tr: "Depodaki çocuklar onları çevreliyor, alkışlıyor, bir kısmı neden alkışladığını bilmeden. Bu şehirde bir kavuşma, herkesin kavuşmasıdır.", en: "The kids in the warehouse gather around and start clapping, some of them with no idea why. In this town, one reunion belongs to everybody." }
        secenekler:
          - id: "aksam"
            etiket: { tr: "Onları akşama kadar yalnız bırak", en: "Leave them alone until evening" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { baglilik: 6 } }
            kronik: { tr: "İki kardeşi bir akşamlığına baş başa bıraktın; bu, onlara verdiğin en güzel armağandı.", en: "You left two siblings alone together for an evening, and it was the best gift you ever gave them." }
            sonraki: "dkb_karar"
          - id: "simit"
            etiket: { tr: "Limandan üç simit bul; martılara da bir tane", en: "Find three pretzels at the docks. One more for the gulls" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - kredi: -20
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 } }
            kronik: { tr: "Kıyametin ortasında bir iskelede üç kişi simit yedi ve martılara pay ayırdı.", en: "In the middle of the apocalypse, three people ate pretzels on a pier and saved some for the gulls." }
            sonraki: "dkb_karar"
          - id: "emanet"
            etiket: { tr: "Kızın elini tut; artık sana emanet", en: "Take the girl's hand. She's yours to look after now" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { siginak: 3 }
              - bayrak: "kardes_emanet"
            kronik: { tr: "{npc:deniz_arman|in} kız kardeşini, ona hiç kavuşamayan birinin yerine sen büyüttün.", en: "You raised {npc:deniz_arman|pos} little sister in place of the one who never got to see her again." }
            sonraki: "@akis"

      - id: "dkb_siginak_hikaye"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Bir sabah adımı listeden sildiler,\" diyor kız, tebeşiri parmaklarında çevirerek. \"Başka bir listeye yazdılar. Beni ve yirmi kişiyi {yer:kordon|e} götürdüler; kapının önüne. 'Siz yakıtsınız,' dediler. 'Kapı sizi yiyince kapanacak.'\"", en: "\"One morning they took my name off the list,\" the girl says, rolling the chalk between her fingers. \"Put it on a different one. Took me and twenty other kids down to {yer:kordon}, right in front of the Gate. 'You're the fuel,' they said. 'When the Gate eats you, it'll close.'\"" }
          - { tr: "\"Kapı bizi yemedi. Dalga geldi ve biri bizi dalganın içinden çıkardı. Sonra buraya getirdiler.\" Omuz silkiyor; bunu çok kez anlatmış ve artık titremeden anlatabilen birinin omuz silkişi.", en: "\"The Gate didn't eat us. A wave came, and somebody pulled us out of it. Then they brought us here.\" She shrugs. It's the shrug of someone who's told this a lot of times and can finally tell it without shaking." }
          - metin: { tr: "{npc:deniz_arman|in} yüzü bembeyaz. Göğsündeki gri şalı tutuyor; aynı insanların, aynı işaretle diktiği şalı.", en: "{npc:deniz_arman|pos} face has gone white. {zamir:deniz_arman|o|b} {zamir:deniz_arman|is} clutching the gray shawl on {zamir:deniz_arman|onun} chest, sewn with the same mark by the same people." }
            kosul: { npc_gitti: "deniz_arman", bayrak: "deniz_yukselenlere_gitti" }
        secenekler:
          - id: "karar"
            etiket: { tr: "Ona sarıl; gerisini akşam konuşursunuz", en: "Hug her. The rest can wait till tonight" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Yakıt diye bir kapının önüne bırakılmış bir çocuğa sarıldın.", en: "You hugged a child who'd been left at a Gate as fuel." }
            sonraki: "dkb_karar"
          - id: "ilan"
            etiket: { tr: "Bu hikâyeyi bütün şehre duyur", en: "Make sure the whole city hears this story" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - dikkat: 2
              - itibar: { yukselenler: -10, siginak: 5, sessiz_ag: 3 }
            kronik: { tr: "Bir çocuğun yakıt hikâyesini bütün şehre duyurdun; {fraksiyon:yukselenler} o haftadan sonra sokaklarda yalnız yürüyemedi.", en: "You made sure the whole city heard a child's fuel story, and after that week {fraksiyon:yukselenler} couldn't walk the streets alone." }
            sonraki: "dkb_siginak_son"

      - id: "dkb_siginak_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hikâye öğlene kadar {yer:kiyikent_liman|de}, akşama kadar bütün {yer:kiyikent|de} dolaşıyor. {yer:tepe|den} inen gri şallıların bazıları o gece şallarını yakıyor.", en: "By noon the story's all over {yer:kiyikent_liman}. By evening, all over {yer:kiyikent}. Some of the gray shawls coming down from {yer:tepe} get burned that night." }
          - { tr: "Kız deponun duvarına bir martı daha çiziyor; bu kez yanına tek bir kelime yazıyor: BURADAYIM.", en: "The girl draws one more gull on the warehouse wall, and this time she writes a single word beside it: HERE." }
        secenekler:
          - id: "karar"
            etiket: { tr: "Akşam olsun; konuşacaklarınız var", en: "Let evening come. There's talking to do" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            kronik: { tr: "Bir duvara 'buradayım' yazıldı ve şehir o kelimeyi duydu.", en: "Somebody wrote 'here' on a wall, and the city heard it." }
            sonraki: "dkb_karar"
          - id: "git"
            etiket: { tr: "Duvardaki kelimeye dokun ve çık", en: "Touch the word on the wall and go" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - xp_seviye: 20
            kronik: { tr: "Bir duvara 'buradayım' yazıldı; okuması gereken kişi okuyamadı, ama sen okudun.", en: "Somebody wrote 'here' on a wall. The one who should have read it never could, but you did." }
            sonraki: "@akis"

      - id: "dkb_siginak_anma"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yanına oturuyorsun, duvarın dibine, mavi tozun içine. \"Kapıya bakmayı bırakabilirsin,\" diyorsun ve sesinin titrediğini duyuyorsun. \"Seni arayan biri vardı. Gelemeyecek.\"", en: "You sit down next to her, at the foot of the wall, in the blue dust. \"You can stop watching the door,\" you say, and you hear your own voice shake. \"There was someone looking for you. They can't come.\"" }
          - { tr: "Anlatıyorsun; vapuru, simitleri, Çıkış Kapısı'nı. Kız hiç sözünü kesmiyor. Bittiğinde tebeşiri sana uzatıyor. \"O zaman sen çiz,\" diyor. \"Onun için. Ben artık kapıya bakmayacağım.\"", en: "You tell her: the ferry, the pretzels, the Exit Gate. She never interrupts. When you're done, she holds out the chalk. \"Then you draw one,\" she says. \"For them. I'm not going to watch the door anymore.\"" }
          - metin: { tr: "{npc:yanki} fısıldıyor: bu çocuğun sistem kaydına yeni bir satır düştü. 'vasi' yazıyor. senin adın. bunu ben yapmadım.", en: "{npc:yanki} whispers: a new line just showed up in this kid's system record. it says 'guardian.' your name. i didn't do that." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "ciz"
            etiket: { tr: "Tebeşiri al ve bir martı çiz", en: "Take the chalk and draw a gull" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 3 }
              - esya: { martili_tebesir: 1 }
              - itibar: { siginak: 4 }
              - xp_seviye: 30
            kronik: { tr: "Ölü bir arkadaşın kardeşi için bir depo duvarına martı çizdin; Sistem seni onun vasisi olarak kaydetti.", en: "You drew a gull on a warehouse wall for a dead friend's sister, and the System logged you as her guardian." }
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "\"Her hafta geleceğim. Söz.\"", en: "\"I'll come every week. Promise.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - itibar: { siginak: 3 }
            kronik: { tr: "Ölü arkadaşının kardeşine her hafta geleceğine söz verdin; o sözü kıyametin sonuna kadar tuttun.", en: "You promised your dead friend's sister you'd come every week, and you kept that promise to the end of the world." }
            sonraki: "@akis"

      # ---------------------------------------------------------------- akşam: Deniz'in kararı
      - id: "dkb_sana_kalmis"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} uzun süre sana bakıyor, sonra gülüyor; yorgun, kısa bir gülüş. \"Vapurdan beri hep sen söyledin nereye gideceğimizi,\" diyor. \"Biliyor musun, bunu ilk kez fark ettim.\"", en: "{npc:deniz_arman} looks at you for a long time, then laughs, short and tired. \"Ever since the ferry, you've been the one saying where we go,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I only just noticed that.\"" }
          - { tr: "Tebeşiri cebine koyup kalkıyor. Ne kalacağını söylüyor ne gideceğini; yalnızca iskelenin ucuna kadar yürüyüp suya bakıyor. Martılar bir kez havalanıp yeniden konuyor.", en: "{zamir:deniz_arman|o|b} pocket{zamir:deniz_arman|s} the chalk and stand{zamir:deniz_arman|s} up. No word on staying, none on going. {zamir:deniz_arman|o|b} just walk{zamir:deniz_arman|s} to the end of the pier and look{zamir:deniz_arman|s} at the water. The gulls lift off once and settle again." }
          - { tr: "\"Yarın söylerim,\" diyor, sırtı sana dönük. \"Bu sefer kendim için.\"", en: "\"I'll tell you tomorrow,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, back still turned. \"This time I'm deciding for me.\"" }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Yanına git, sessizce suya bak", en: "Walk over and watch the water with them" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Onu orada yalnız bırak", en: "Leave them alone out there" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { deniz_arman: { saygi: 3 } }
            sonraki: "@akis"

      - id: "dkb_karar"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Akşam iskelede, yan yatmış vapurun gölgesinde oturuyorsunuz. Gövdesindeki pas, batan güneşte eski bir kanın rengini alıyor; martılar bacasının üstünde, hiçbir şey olmamış gibi.", en: "Evening finds you on the pier in the shadow of the capsized ferry. The rust on its hull turns the color of old blood in the setting sun. The gulls sit on its smokestack like nothing ever happened." }
          - metin: { tr: "{npc:deniz_arman} kuleden aldığı mavi tebeşiri avucunda çevirip duruyor. \"Bütün hayatım bir yöne bakıyordu,\" diyor. \"Şimdi o yön yok. Nereye bakacağımı bilmiyorum.\"", en: "{npc:deniz_arman} keeps turning the blue chalk from the tower over and over in one palm. \"My whole life was pointed one way,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Now that way's gone. I don't know where to look.\"" }
            kosul: { bayrak: "kardes_olu_bulundu" }
          - metin: { tr: "Kız depoda, portakal kasasından bir ranzada uyuyor; {npc:deniz_arman} her beş dakikada bir başını depoya çevirip hâlâ orada olduğunu kontrol ediyor. \"Onu buldum,\" diyor, sanki ilk kez söylüyormuş gibi. \"Şimdi ne yapacağım?\"", en: "The girl's asleep in the warehouse in a bunk made of orange crates, and every five minutes {npc:deniz_arman} turns to check she's still there. \"I found her,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, like it's the first time. \"So what do I do now?\"" }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "{npc:deniz_arman|in} gözleri {yer:tepe|de}, yurdun ışıkları yanan pencerelerinde. \"Orada kalırsa,\" diyor, \"bir gün sırası gelecek. Ben de oradaysam belki gelmez.\"", en: "{npc:deniz_arman|pos} eyes are on {yer:tepe}, on the lit windows of the dormitory. \"If she stays there,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, \"one day her number comes up. If I'm up there too, maybe it won't.\"" }
            kosul: { bayrak: "kardes_yukselenlerde" }
          - { tr: "Sonra sana dönüyor. \"Sen ne istiyorsun?\" diye soruyor. \"Bir kere olsun dürüst ol. Benden ne istiyorsun?\"", en: "Then {npc:deniz_arman} turns to you. \"What do you want?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"Be honest, just this once. What do you want from me?\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ne istediğini söyle. yalan söylersen ikimiz de bileceğiz. o da bilecek; bu insan yalanlarını artık kokusundan tanıyor.", en: "tell {zamir:deniz_arman|onu} what you want. lie, and we'll both know. so will {zamir:deniz_arman|o}. this one can smell your lies now." }
        secenekler:
          - id: "sana_kalmis"
            etiket: { tr: "\"Bunu ben söyleyemem. Senin hayatın.\"", en: "\"That's not mine to say. It's your life.\"" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 2 }
              - bayrak: "deniz_kendi_karari"
              - iliski: { deniz_arman: { saygi: 6, guven: 2 } }
            kronik: { tr: "{npc:deniz_arman|e} ne istediğini söylemedin; kararı ona bıraktın ve o kararı ilk kez kimseye sormadan verdi.", en: "You didn't tell {npc:deniz_arman} what you wanted. You left the call to {zamir:deniz_arman|onu}, and for the first time {zamir:deniz_arman|o} made it without asking anyone." }
            sonraki: "dkb_sana_kalmis"
          - id: "kal"
            etiket: { tr: "\"Yanımda kal. Ne olursa olsun.\"", en: "\"Stay with me. No matter what.\"" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 10, guven: 4 } }
            kronik: { tr: "{npc:deniz_arman|e} yanında kalmasını söyledin ve kaldı; o yokuştan sonra yollarınız hep aynı yere çıktı.", en: "You asked {npc:deniz_arman} to stay, and {zamir:deniz_arman|o} did. After that hill, your roads always led to the same place." }
            sonraki: "@akis"
          - id: "onunla_kal"
            etiket: { tr: "\"Git, onunla kal. Seni ben bulurum.\"", en: "\"Go. Stay with her. I'll find you.\"" }
            goster: { yoldas: "deniz_arman", bayrak: "kardes_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - yoldas_ayril: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_ayri"
              - iliski: { deniz_arman: { guven: 10, saygi: 8 } }
              - hafiza: { npc: "deniz_arman", id: "kararina_saygi", agirlik: 45 }
            kronik: { tr: "{npc:deniz_arman|i} kardeşinin yanına gönderdin; savaşa bir kalkan eksik girdin ama bir çocuk ablasız, abisiz büyümedi.", en: "You sent {npc:deniz_arman} to stay with the sister. You went into the war one shield short, but a kid didn't grow up alone." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "\"O şalı denize at. Benimle gel.\"", en: "\"Throw that shawl in the sea. Come with me.\"" }
            goster: { npc_gitti: "deniz_arman", bayrak: "deniz_yukselenlere_gitti" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - yoldas_katil: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_yukselenlerden_dondu"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - bayrak_kaldir: "deniz_ayri"
              - itibar: { yukselenler: -6 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "gidis_soz", agirlik: 45 }
            kronik: { tr: "{npc:deniz_arman} gri şalı vapurun gölgesinde denize attı ve yeniden yanına geçti.", en: "{npc:deniz_arman} threw the gray shawl into the sea in the ferry's shadow and came back to your side." }
            sonraki: "dkb_karar_don"
          - id: "gel"
            etiket: { tr: "\"Benimle gel. Bu sefer kaybolmak yok.\"", en: "\"Come with me. No getting lost this time.\"" }
            goster: { npc_gitti: "deniz_arman", bayrak_yok: "deniz_yukselenlere_gitti" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - yoldas_katil: "deniz_arman"
              - bayrak_kaldir: "deniz_ayri"
              - iliski: { deniz_arman: { guven: 8, baglilik: 10 } }
            kronik: { tr: "Bir zamanlar giden {npc:deniz_arman} bir iskelede yeniden yanına geçti.", en: "{npc:deniz_arman}, who once walked away, came back to your side on a pier." }
            sonraki: "@akis"
          - id: "gel_ilk"
            etiket: { tr: "\"Vapuru beraber kaçırırız. Benimle gel.\"", en: "\"We'll miss the ferry together. Come with me.\"" }
            goster: { bayrak: "deniz_hic_bulunmadi" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - yoldas_katil: "deniz_arman"
              - bayrak_kaldir: "deniz_ayri"
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "kalmasini_istedi", agirlik: 50 }
            kronik: { tr: "Öğretici'nin ayırdığı iki arkadaş, {yer:kiyikent|in} iskelesinde yeniden aynı yöne yürümeye başladı.", en: "Two friends the Tutorial split apart started walking the same way again on the {yer:kiyikent} pier." }
            sonraki: "@akis"
          - id: "ayri"
            etiket: { tr: "\"Onunla kal. Depodakilerin sana ihtiyacı var.\"", en: "\"Stay with her. That warehouse needs you.\"" }
            goster: { npc_gitti: "deniz_arman", bayrak: "kardes_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_ayri"
              - itibar: { siginak: 4 }
              - iliski: { deniz_arman: { guven: 6, saygi: 8 } }
            kronik: { tr: "{npc:deniz_arman} kardeşiyle birlikte {fraksiyon:siginak|in} deposunda kaldı; çocuklar ona kalkan derdi.", en: "{npc:deniz_arman} stayed on at {fraksiyon:siginak|pos} warehouse with the sister. The kids there called {zamir:deniz_arman|onu} the Shield." }
            sonraki: "@akis"
          - id: "tepe"
            etiket: { tr: "\"Yukarıda kal. Sırası gelirse sen orada ol.\"", en: "\"Stay up there. If her number comes up, be there.\"" }
            goster: { bayrak: "kardes_yukselenlerde" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2, insanlik: -1 }
              - yoldas_ayril: "deniz_arman"
              - npc_gitti: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "yukselenler" }
              - bayrak: "deniz_tepede_kaldi"
              - iliski: { deniz_arman: { saygi: 6, baglilik: -4 } }
              - tohum: { olay: "deniz_yukselen_rakip", gecikme: { min: 15, max: 35 }, kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" } } }
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 8, max: 15 }, kosul: { bayrak: "kardes_yukselenlerde" } }
            kronik: { tr: "{npc:deniz_arman} kardeşini kollamak için gri şalı giydi; {yer:tepe|de} bir koruyucu kazandın ya da bir rakip, hangisi olduğunu zaman gösterdi.", en: "{npc:deniz_arman} put on the gray shawl to watch over the sister. You'd gained a guardian on {yer:tepe}, or a rival, and only time would say which." }
            sonraki: "@akis"
          - id: "yalniz"
            etiket: { tr: "\"Yalnız kalman gerekiyorsa, git. Ama dön.\"", en: "\"If you need to be alone, go. Just come back.\"" }
            goster: { bayrak: "kardes_olu_bulundu" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - yoldas_ayril: "deniz_arman"
              - npc_gitti: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_iz: { deniz_arman: "sertlesmis" }
              - bayrak: "deniz_ayri"
              - iliski: { deniz_arman: { guven: 6, saygi: 6 } }
            kronik: { tr: "{npc:deniz_arman} yasını yalnız tutmak için gitti; dönen kişi, giden kişiden daha sertti.", en: "{npc:deniz_arman} went off to grieve alone. The one who came back was harder than the one who left." }
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "\"Onu {yer:kordon|e} gönderenleri birlikte bulacağız.\"", en: "\"We find the ones who sent her down there. Together.\"" }
            goster: { bayrak: "kardes_olu_bulundu" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: -3 }
              - yoldas_katil: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - npc_iz: { deniz_arman: "sertlesmis" }
              - bayrak: "deniz_intikam"
              - bayrak_kaldir: "deniz_ayri"
              - itibar: { yukselenler: -10 }
              - iliski: { deniz_arman: { baglilik: 12, saygi: 6 } }
            kronik: { tr: "{npc:deniz_arman|in} yasını intikama çevirdin; o yolda ikiniz de bir şeyler bıraktınız.", en: "You turned {npc:deniz_arman|pos} grief into vengeance, and on that road you both left something behind." }
            sonraki: "@akis"
          - id: "inan"
            etiket: { tr: "\"Belki gerçekten yükseldi. Belki haklılar.\"", en: "\"Maybe she really did ascend. Maybe they're right.\"" }
            goster: { bayrak: ["kardes_olu_bulundu", "deniz_yukselenlere_gitti"], npc_gitti: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: -6, duzen: 3 }
              - itibar: { yukselenler: 6 }
              - npc_iz: { deniz_arman: "yarali_guven" }
              - iliski: { deniz_arman: { guven: -8, baglilik: -6 } }
              - tohum: { olay: "deniz_yukselen_rakip", gecikme: { min: 10, max: 25 }, kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" } } }
            kronik: { tr: "Yasta bir arkadaşa, kardeşinin yakıldığı inancın doğru olabileceğini söyledin; {npc:deniz_arman} o inanca sarıldı ve bir daha bırakmadı.", en: "You told a grieving friend the faith that burned the sister might be right. {npc:deniz_arman} clung to that faith and never let go." }
            sonraki: "@akis"

      - id: "dkb_karar_don"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} şalı omzundan alıyor, bir an elinde tartıyor, sonra iskelenin kenarından denize bırakıyor. Gri kumaş suyun üstünde bir süre açık kalıyor, işaret yukarı bakarak; sonra batıyor.", en: "{npc:deniz_arman} slides the shawl off, weighs it for a second in one hand, then lets it drop off the edge of the pier. The gray cloth floats open on the water for a while, mark facing up. Then it sinks." }
          - { tr: "\"Bana bir gün ikimizi de oradan çıkaracağını söylemiştin,\" diyor. \"Sonunda ben kendim çıktım. Ama sen yolu gösterdin.\" Martılardan biri bacadan inip iskelenin babasına konuyor ve ona bakıyor.", en: "\"You told me once you'd walk us both out of there someday,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"In the end I walked out myself. But you showed me the way.\" One of the gulls drops off the smokestack, lands on the pier bollard, and looks right at {npc:deniz_arman}." }
        secenekler:
          - id: "simit"
            etiket: { tr: "Cebinden bir parça ekmek çıkar; martıya at", en: "Dig a crust out of your pocket. Toss it to the gull" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 6 } }
            kronik: { tr: "Bir arkadaş geri döndü ve bir martı bir ekmek kabuğu aldı; bazı akşamlar bu kadarı yeter.", en: "A friend came back and a gull got a crust of bread. Some evenings, that's enough." }
            sonraki: "@akis"
          - id: "hos_geldin"
            etiket: { tr: "\"Hoş geldin.\" Başka bir şey söyleme", en: "\"Welcome back.\" Nothing else" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            kronik: { tr: "Yükselenler'den dönen arkadaşına yalnızca hoş geldin dedin; ikinize de bu yetti.", en: "You told the friend who came back from the Ascended just one thing: welcome back. It was enough for both of you." }
            sonraki: "@akis"

  # ================================================================== DENİZ · P2 (anma): Deniz öldüyse kardeşi sen bulursun
  - id: "deniz_anma_kardes"
    perde: [2]
    ana_yay: { gun: 95 }
    kosul: { npc_olu: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "anma"]
    gerilim: 3
    onemli: true
    kart: { tr: "Onun yerine", en: "In their place" }
    sahne: "dak_1"
    sahneler:
      - id: "dak_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent_liman|in} balık halinin kepengine mavi tebeşirle çizilmiş bir martı görüyorsun. Ördeğe benziyor; kafası fazla yuvarlak, gagası fazla geniş.", en: "Morning, and there's a gull drawn in blue sidewalk chalk on the shutter of the old fish market at {yer:kiyikent_liman}. It looks like a duck. Head too round, beak too wide." }
          - { tr: "Durduğun yerde kalıyorsun. Bu martıyı tanıyorsun; Kırık İstasyon'un duvarında bir kez görmüştün, yanında da onu görünce dizlerinin üstüne çöken biri vardı.", en: "You stop dead. You know this gull. You saw it once on a wall at the Broken Station, and there was someone beside you who dropped to their knees when they saw it." }
          - { tr: "O kişi Çıkış Kapısı'nın önünde bir hat tuttu. Kapı'nın öbür yanına geçmedi. Şimdi martılar bir sokaktan ötekine, bir duvardan ötekine, onun yerine seni çağırıyor.", en: "That person held a line in front of the Exit Gate and never made it to the other side. Now the gulls are calling from one street to the next, from one wall to the next, and they're calling you instead." }
          - metin: { tr: "Ateşin başında ona bir söz vermiştin: kardeşini birlikte bulacaktınız. Birlikte olmayacak artık. Ama söz hâlâ söz.", en: "By a campfire, you made {zamir:deniz_arman|onu} a promise: you'd find the sister together. It won't be together now. A promise is still a promise." }
            kosul: { bayrak: "deniz_kardese_soz_verildi" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Tebeşir en yeni çizimlerde bile üç haftalık. Çizen kişi yakalanmaktan korkmuyordu; bulunmak istiyordu. Ve kimi beklediğini bilmiyordu.", en: "Even the freshest chalk is three weeks old. Whoever drew these wasn't afraid of getting caught. She wanted to be found. And she had no idea who'd be the one looking." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onu aramak zorunda değilsin. ölülere borç ödenmez; sistem öyle der. ben sistem değilim. ara.", en: "you don't have to look for her. debts to the dead don't get paid; that's what the system says. i'm not the system. look." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Martıların gösterdiği yöne yürü; onun yerine", en: "Follow where the gulls point. In their place" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - esya: { martili_tebesir: 1 }
            kronik: { tr: "Ölü bir arkadaşın yerine onun kardeşinin martılarını izledin.", en: "In a dead friend's place, you followed the sister's gulls." }
            sonraki: "dkb_iz"
          - id: "kayitlar"
            etiket: { tr: "Kayıp çocuk kayıtlarını {fraksiyon:siginak|den} iste", en: "Ask {fraksiyon:siginak} for their missing-kids records" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
            kronik: { tr: "Ölü bir arkadaşın kardeşini bir kayıt defterinde aradın; satırların arasında onun da adı vardı.", en: "You searched a ledger for a dead friend's sister, and between the lines, their name was there too." }
            sonraki: "dkb_defter"
          - id: "kayit_oku"
            etiket: { tr: "{npc:yanki|e} Çekirdek'teki kaydı okut", en: "Have {npc:yanki} read the Core's log" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 30 } } }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
              - yozlasma: 3
              - dikkat: 3
              - bilgi: "kardes_yakit_listesi"
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
            kronik: { tr: "Ölü bir arkadaşın kardeşini Sistem'in kendi kayıtlarında aradın; {npc:yanki} sana gerçeği gösterdi.", en: "You searched the System's own logs for a dead friend's sister, and {npc:yanki} showed you the truth." }
            sonraki: "dkb_kayit"
          - id: "tek_bakis"
            tur: "gosteris"
            etiket: { tr: "Bütün martı izini tek bakışta oku", en: "Read the whole gull trail in a single look" }
            gerekli: { stat: { per: 45 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - dikkat: 3
              - xp_seviye: 20
            kronik: { tr: "Bir çocuğun üç haftalık yolunu tek bakışta okudun; okuyamadığın tek şey o yolun sonunda ne hissedeceğindi.", en: "You read three weeks of a kid's trail in one look. The only thing you couldn't read was how you'd feel at the end of it." }
            sonraki: "dkb_tek_bakis"
          - id: "birak"
            etiket: { tr: "Bırak. Bu senin bulman gereken biri değil", en: "Let it go. She's not yours to find" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -3 }
              - tohum: { olay: "deniz_kardes_cizimi", gecikme: { min: 6, max: 12 } }
            kronik: { tr: "Ölü bir arkadaşın kardeşini aramadın; martılar bir süre daha senin kapına kadar geldi.", en: "You didn't look for a dead friend's sister, and for a while the gulls kept coming, all the way to your door." }
            sonraki: "@akis"

  # ================================================================== DENİZ · tohum: duvardaki ikinci şans
  - id: "deniz_kardes_cizimi"
    perde: [2, 3]
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["deniz", "tohum", "yukselenler"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kapındaki martı", en: "A gull on your door" }
    sahne: "dkc_1"
    sahneler:
      - id: "dkc_1"
        paragraflar:
          - { tr: "Bir sabah, kaldığın yerin kapısında mavi tebeşirle çizilmiş bir martı buluyorsun. Gece çizilmiş; tebeşir hâlâ çiy tutmamış. Kapın şehrin binlerce kapısından biri ve biri tam olarak onu bulmuş.", en: "One morning, there's a gull in blue chalk on the door of the place you're staying. Drawn last night; the dew hasn't even touched it. Your door is one of thousands in this city, and somebody found exactly yours." }
          - metin: { tr: "Martının altında tek bir kelime var, çocuk eliyle, büyük harflerle: NEDEN? Martılarını sildiğini gören biri olmuş.", en: "Under the gull, one word, in a kid's handwriting, all caps: WHY? Somebody saw you wiping off her gulls." }
            kosul: { bayrak: "kardes_sakli_p2" }
          - metin: { tr: "Martının altında, çocuk eliyle: YARDIM. Yanında bir sayı: 2. Sırası yaklaşıyor.", en: "Under the gull, in a kid's handwriting: HELP. And a number beside it: 2. Her turn is coming." }
            kosul: { bayrak: "kardes_yukselenlerde" }
          - metin: { tr: "Kelimenin altında bir satır daha var, başka bir elle, büyük ve titrek: ben de buradayım. {npc:deniz_arman|in} yazısı.", en: "Under the word there's another line, in a different hand, big and shaky: I'm here too. {npc:deniz_arman|pos} handwriting." }
            kosul: { bayrak: "deniz_tepede_kaldi" }
          - metin: { tr: "Martılar seni artık kendileri arıyor. Ölü bir arkadaşın kardeşi, sen onu aramayınca seni bulmuş.", en: "The gulls are looking for you now. A dead friend's sister went looking for you when you wouldn't go looking for her." }
            kosul: { npc_olu: "deniz_arman", bayrak_yok: ["kardes_sakli_p2", "kardes_yukselenlerde"] }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Kapının önündeki çamurda küçük spor ayakkabısı izleri var; geliyor, duruyor, uzun süre duruyor, sonra koşarak gidiyor.", en: "There are small sneaker prints in the mud by your door. They come, they stop, they stand there a long time, then they run off." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni buldu. ben bile kapını bu kadar kolay bulamazdım. bazı insanlar sistemden daha iyi arar.", en: "she found you. even i couldn't have found your door that easy. some people search better than the system does." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Bu sefer martıların peşine düş", en: "This time, follow the gulls" }
            goster: { bayrak_yok: "kardes_yukselenlerde" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - bayrak_kaldir: "kardes_sakli_p2"
              - iliski: { deniz_arman: { guven: 2 } }
            kronik: { tr: "Bir çocuk kapına bir soru yazdı ve sen sonunda cevap vermek için yola çıktın.", en: "A kid wrote a question on your door, and you finally set out to answer it." }
            sonraki: "dkb_iz"
          - id: "gece"
            etiket: { tr: "Bu gece {yer:tepe|e} çık; onu sırası gelmeden al", en: "Go up {yer:tepe} tonight. Get her before her turn" }
            goster: { bayrak: "kardes_yukselenlerde" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -4 }
              - dikkat: 3
              - bolge: "tepe"
              - itibar: { yukselenler: -12 }
              - savas: { dusmanlar: ["isaretli_muhafiz@dunya+10", "isaretli_muhafiz@dunya+10"], ortam: ["karanlik", "dar_gecit"], kazan: "dkc_kurtulus", kaybet: "dkc_gec", kac: "dkc_gec" }
            kronik: { tr: "Bir gece Seçilmişler Yurdu'na girdin ve bir çocuğu sırası gelmeden çıkardın.", en: "One night you went into the Chosen's dormitory and got a child out before her number came up." }
          - id: "kapi"
            tur: "gosteris"
            etiket: { tr: "Ön kapıdan gir; kimse seni durdurmaya cesaret edemez", en: "Walk in the front gate. Nobody dares stop you" }
            goster: { bayrak: "kardes_yukselenlerde" }
            gerekli: { stat: { wil: 70 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2, insanlik: -2 }
              - dikkat: 5
              - bolge: "tepe"
              - itibar: { yukselenler: -8 }
              - xp_seviye: 25
            kronik: { tr: "Seçilmişler Yurdu'nun ön kapısından girdin ve bir çocuğun elinden tutup çıktın; ilahi bir kez bile yükselmedi.", en: "You walked in the Chosen's front gate and walked out holding a child's hand, and the hymn never rose once." }
            sonraki: "dkc_kurtulus"
          - id: "sil"
            etiket: { tr: "Bunu da sil", en: "Wipe this one off too" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -5 }
              - iliski: { deniz_arman: { guven: -10 } }
            kronik: { tr: "Kapına yazılan bir çocuk sorusunu da sildin; ondan sonra kimse kapına bir şey yazmadı.", en: "You wiped off the question a kid wrote on your door too, and after that nobody ever wrote on your door again." }
            sonraki: "@akis"
          - id: "cevap"
            etiket: { tr: "Kapına bir cevap yaz; kim okursa okusun", en: "Write an answer on your door, for whoever reads it" }
            goster: { bayrak_yok: "kardes_yukselenlerde" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - bayrak_kaldir: "kardes_sakli_p2"
            kronik: { tr: "Kapına bir çocuğa cevap yazdın; o cevabı kimin okuduğunu hiç öğrenemedin.", en: "You wrote an answer for a kid on your own door, and you never found out who read it." }
            sonraki: "dkc_cevap"

      - id: "dkc_cevap"
        paragraflar:
          - { tr: "Tebeşiri alıp martının yanına yazıyorsun: KORKTUM. Sonra bir satır daha: ŞİMDİ GELİYORUM.", en: "You take the chalk and write beside the gull: I WAS SCARED. Then one more line: COMING NOW." }
          - { tr: "Ertesi sabah kapında yeni bir martı var. Bu kez gözleri çizilmiş, kocaman. Yanında bir de ok var: aşağıya, şehrin içine.", en: "Next morning there's a new gull on your door. This time it has eyes, huge ones, and an arrow: down, into the city." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Okun gösterdiği yere yürü", en: "Walk where the arrow points" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
            kronik: { tr: "Kapına çizilen bir okun peşinden yürüdün; bir çocuğun sabrı seni sonunda yola çıkardı.", en: "You followed an arrow chalked on your door. A child's patience finally got you moving." }
            sonraki: "dkb_iz"
          - id: "bekle"
            etiket: { tr: "Kapının önüne bir simit bırak ve bekle", en: "Leave a pretzel by the door and wait" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - kredi: -5
            kronik: { tr: "Kapının önüne bir simit bıraktın; ertesi sabah simit yoktu, yerinde bir martı vardı.", en: "You left a pretzel by your door. The next morning it was gone, and there was a gull in its place." }
            sonraki: "dkb_iz"

      - id: "dkc_kurtulus"
        yer: "tepe"
        paragraflar:
          - { tr: "Yurdun koridorları gece karanlık; yalnızca her yatağın başında bir Sistem penceresinin soluk mavisi yanıyor. Onu dördüncü yatakta buluyorsun, uyanık, ayakkabıları ayağında, seni bekliyor.", en: "The dormitory halls are dark at night except for the faint blue of a System window glowing over every bed. You find her in the fourth bed, wide awake, shoes already on, waiting for you." }
          - metin: { tr: "Kapıda {npc:deniz_arman} duruyor; gri şal omzunda, yüzü kararlı. \"Ben de geliyorum,\" diyor. \"Bu şalı burada bırakacağım.\" Şalı yatağın üstüne katlayıp bırakıyor.", en: "{npc:deniz_arman} is standing in the doorway, gray shawl on one shoulder, face set. \"I'm coming too,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I'm leaving this thing here.\" {zamir:deniz_arman|o|b} fold{zamir:deniz_arman|s} the shawl and set{zamir:deniz_arman|s} it on the bed." }
            kosul: { bayrak: "deniz_tepede_kaldi" }
          - { tr: "{yer:tepe|den} inerken kız bir kez bile arkasına bakmıyor. Yokuşun dibinde durup göğsündeki işarete dokunuyor, sonra sana: \"Geldin,\" diyor. \"Gelmeyeceksin sandım.\"", en: "She doesn't look back once on the way down from {yer:tepe}. At the bottom of the hill she stops, touches the mark on her chest, then looks at you. \"You came,\" she says. \"I thought you wouldn't.\"" }
        secenekler:
          - id: "geldim"
            etiket: { tr: "\"Geç kaldım. Ama geldim.\"", en: "\"I was late. But I came.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - bayrak: "kardes_kurtarildi"
              - bayrak: "deniz_kardes_bulundu"
              - bayrak_kaldir: "kardes_yukselenlerde"
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 1 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 8 } }
            kronik: { tr: "Bir çocuğu sırası gelmeden Seçilmişler'den aldın; geç kaldığını söyledin, ama gelmiştin.", en: "You took a child from the Chosen before her turn came. You said you were late. But you'd come." }
            sonraki: "dkc_kurtulus_son"
          - id: "siginak"
            etiket: { tr: "Onu doğruca {fraksiyon:siginak|in} deposuna götür", en: "Take her straight to {fraksiyon:siginak|pos} warehouse" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bayrak: "kardes_kurtarildi"
              - bayrak: "deniz_kardes_bulundu"
              - bayrak_kaldir: "kardes_yukselenlerde"
              - itibar: { siginak: 6 }
            kronik: { tr: "Seçilmişler'den kaçırdığın çocuğu {fraksiyon:siginak|e} teslim ettin; deponun duvarları ertesi gün martıyla doldu.", en: "You handed the child you smuggled out of the Chosen to {fraksiyon:siginak}, and the next day the warehouse walls filled up with gulls." }
            sonraki: "dkc_kurtulus_son"

      - id: "dkc_kurtulus_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah depoda uyanıyor ve ilk iş olarak bir tebeşir istiyor. Duvara bir martı çiziyor; bu sefer gözleri var, ayakları var, gagası var ve ördeğe hiç benzemiyor.", en: "She wakes up in the warehouse in the morning and the first thing she asks for is chalk. She draws a gull on the wall. This one has eyes, feet, a beak, and looks nothing like a duck." }
          - metin: { tr: "{npc:deniz_arman} martıya bakıyor ve gülüyor; kıyametten beri ilk kez korkudan sonra gelen o gülüş değil bu. Sadece gülüş.", en: "{npc:deniz_arman} looks at the gull and laughs, and for the first time since the end of the world it isn't the laugh that comes after fear. It's just a laugh." }
            kosul: { npc_hayatta: "deniz_arman" }
        secenekler:
          - id: "deniz_gel"
            etiket: { tr: "{npc:deniz_arman|e} elini uzat: \"Hadi. İşimiz var.\"", en: "Hold a hand out to {npc:deniz_arman}: \"Come on. Work to do.\"" }
            goster: { npc_gitti: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - yoldas_katil: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak_kaldir: "deniz_tepede_kaldi"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - bayrak_kaldir: "deniz_ayri"
              - iliski: { deniz_arman: { baglilik: 8 } }
            kronik: { tr: "{yer:tepe|den} dönen {npc:deniz_arman} yeniden yanına geçti; o şal bir daha hiç giyilmedi.", en: "{npc:deniz_arman} came back down from {yer:tepe} and back to your side. That shawl was never worn again." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Kızın martısına bir kanat ekle ve çık", en: "Add a wing to her gull and head out" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - xp_seviye: 20
            kronik: { tr: "Kurtardığın çocuğun çizdiği ilk gerçek martıya bir kanat ekledin.", en: "You added a wing to the first real gull drawn by the child you saved." }
            sonraki: "@akis"

      - id: "dkc_gec"
        yer: "tepe"
        paragraflar:
          - { tr: "Muhafızlar gece daha çok, daha uyanık ve daha sert. Bir yerde sendeliyorsun ve kendini yokuşun dibinde, ıslak kaldırımda buluyorsun; yurdun bütün pencereleri artık yanıyor.", en: "There are more wardens at night, and they're sharper and meaner. Somewhere in there you stumble, and you come to at the bottom of the hill on wet pavement. Every window in the dormitory is lit now." }
          - { tr: "Sabah kapında yeni bir martı yok. Sonraki sabah da yok.", en: "In the morning there's no new gull on your door. Or the morning after." }
          - metin: { tr: "Üçüncü gece, kapına {npc:deniz_arman|in} eliyle tek bir satır yazılmış: kaldırıldı. ben de gidiyorum. arama.", en: "On the third night, one line in {npc:deniz_arman|pos} handwriting shows up on your door: they moved her. i'm going too. don't look." }
            kosul: { bayrak: "deniz_tepede_kaldi" }
        secenekler:
          - id: "ara"
            etiket: { tr: "Aramayı bırakmayacağına yemin et", en: "Swear you'll never stop looking" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - stat: { wil: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            kronik: { tr: "Bir çocuğu Seçilmişler'den alamadın ve aramayı bırakmayacağına yemin ettin.", en: "You couldn't get a child away from the Chosen, and you swore you'd never stop looking." }
            sonraki: "@akis"
          - id: "kabul"
            etiket: { tr: "Kapıdaki satırı sil ve kabul et", en: "Wipe the line off your door and accept it" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            kronik: { tr: "Seçilmişler bir çocuğu senden önce aldı ve sen bunu kabul ettin.", en: "The Chosen took a child before you could, and you accepted it." }
            sonraki: "@akis"

  # ================================================================== DENİZ · P3: canavar mı, tanrı mı (yayın kalbi)
  - id: "deniz_canavar_mi_tanri_mi"
    perde: [3]
    ana_yay: { gun: 225 }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "nefes"]
    gerilim: 2
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Yan yatmış vapur", en: "The capsized ferry" }
    sahne: "dct_1"
    sahneler:
      - id: "dct_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gece yarısına doğru {npc:deniz_arman} seni iskeleye, yan yatmış vapurun eğik güvertesine çağırıyor. Eskiden her sabah bindiğiniz vapur bu; güvertesi şimdi bir yamaç gibi denize iniyor, kıç tarafındaki banklar hâlâ yerinde.", en: "Close to midnight, {npc:deniz_arman} calls you down to the pier, onto the tilted deck of the capsized ferry. It's the same ferry you used to ride every morning. The deck slopes into the water like a hillside now, and the benches at the stern are still bolted in place." }
          - { tr: "Martılar bacanın üstünde uyuyor. Sen güverteye adım attığında hepsi aynı anda uyanıyor ve sessizce, tek bir kanat çırpışıyla senden uzağa havalanıyor. Sonra {npc:deniz_arman|in} çevresine, bir bir, geri konuyorlar.", en: "The gulls are asleep on the smokestack. The moment you step onto the deck they all wake at once and lift away from you in a single silent wingbeat. Then, one by one, they settle back down around {npc:deniz_arman}." }
          - metin: { tr: "{npc:deniz_arman} yanına iki simit getirmiş; bayat, sert, şehirde bulunabilecek son simitlerden. Birini sana uzatıyor, öbürünü martılarla bölüşüyor. \"Sana bir şey soracağım,\" diyor. \"Öğretici'de de sormuştum. O zaman cevap vermek kolaydı.\"", en: "{npc:deniz_arman} brought two pretzels: stale, hard as rocks, maybe the last two in the city. Hands you one and splits the other with the gulls. \"I'm going to ask you something,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I asked it in the Tutorial too. Back then it was easy to answer.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{npc:deniz_arman} gri şalla geliyor; göğsündeki işaret ay ışığında parlıyor. \"Vapurda fraksiyon yok,\" diyor, banka oturarak. \"Burada ben sadece benim. Bir gecelik. Sana bir şey soracağım.\"", en: "{npc:deniz_arman} shows up in the gray shawl, the mark on {zamir:deniz_arman|onun} chest catching the moonlight. \"No factions on the ferry,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, sitting down on a bench. \"Tonight I'm just me. I'm going to ask you something.\"" }
            kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_gitti: "deniz_arman" }
          - metin: { tr: "{npc:deniz_arman} {yer:kiyikent_liman|de}ki depodan gelmiş; ellerinde mavi tebeşir tozu. \"Kardeşim seni çiziyor,\" diyor. \"Martıların arasında, hepsinden büyük bir şey olarak. Kanatları yok ama uçuyor. Ona ne çizdiğini sordum; bilmiyor.\"", en: "{npc:deniz_arman} came straight from the warehouse at {yer:kiyikent_liman}, blue chalk dust on both hands. \"My sister draws you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"In with the gulls, bigger than all of them. No wings, but flying. I asked her what she was drawing. She doesn't know.\"" }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "\"Sokaklarda senin için bir şey söylüyorlar,\" diyor {npc:deniz_arman}. \"{yer:tepe|de} dua ediyorlar, {yer:sanayi|de} kadeh kaldırıyorlar. {yer:kiyikent_liman|de} çocuklarını senin adınla korkutuyorlar.\"", en: "\"People say something about you in the streets,\" {npc:deniz_arman} says. \"Up on {yer:tepe} they pray to you. Down at {yer:sanayi} they toast you. At {yer:kiyikent_liman} they scare their kids with your name.\"" }
            kosul: { ahlak_max: { merhamet: -20 } }
          - metin: { tr: "\"Sıralamaya baktım,\" diyor {npc:deniz_arman}. \"Adının yanında bir yüzdelik var. İnsanlığın ilk yüz binde biri. Bunu okuyunca ne hissettim biliyor musun? Gurur değil. Yas.\"", en: "\"I looked at the Ranking,\" {npc:deniz_arman} says. \"There's a percentile next to your name. Top one-in-a-hundred-thousand of humanity. You know what I felt reading that? Not pride. Grief.\"" }
            kosul: { kademe_min: "B" }
          - { tr: "Sonra o soruyu soruyor, ateş başında sorduğu gibi, ama bu kez sesi titremiyor: \"Neye dönüşüyorsun? Canavara mı, tanrıya mı? Ve ikisi arasında bir fark kaldı mı?\"", en: "Then {npc:deniz_arman} asks it, just like by that fire, except this time the voice doesn't shake: \"What are you turning into? A monster, or a god? And is there any difference left between the two?\"" }
        sezgiler:
          - kosul: { stat: { per: 120 } }
            metin: { tr: "Martılar korktuğu için kaçmıyor. Seni bir fırtına gibi algılıyorlar: kötü değil, sadece fazla büyük. Hayvanlar seni artık hava durumu sayıyor.", en: "The gulls aren't running because they're scared. They read you the way they read a storm: not evil, just too big. To animals, you're weather now." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "doğru cevap yok. ama yanlış cevap var: yalan. bu insan seni senden iyi tanıyor. ben bile tanımıyorum.", en: "there's no right answer. there is a wrong one: lying. this person knows you better than you do. even i don't." }
        secenekler:
          - id: "siradan"
            tur: "gizle"
            etiket: { tr: "Bir gecelik sıradan ol; gücünü tamamen sakla", en: "Be ordinary for one night. Hide everything" }
            etkiler:
              - gizle: 6
              - ahlak: { insanlik: 6, merhamet: 2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
            kronik: { tr: "Bir gece boyunca gücünü sakladın ve yan yatmış bir vapurda sıradan biri gibi oturdun; {npc:deniz_arman} o geceyi ömrü boyunca anlattı.", en: "For one night you hid all of it and sat on a capsized ferry like anybody else, and {npc:deniz_arman} told the story of that night for the rest of {zamir:deniz_arman|onun} life." }
            sonraki: "dct_siradan"
          - id: "cagir"
            tur: "gosteris"
            etiket: { tr: "Martıları geri çağır; hepsi sana gelsin", en: "Call the gulls back. All of them, to you" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - ahlak: { insanlik: -6, duzen: 3 }
              - dikkat: 4
              - iliski: { deniz_arman: { korku: 12, saygi: 6, guven: -6 } }
            kronik: { tr: "Bir sürü martıyı tek bir düşünceyle kendine çağırdın; {npc:deniz_arman} onların sana sevgiyle değil itaatle geldiğini gördü.", en: "You called a whole flock of gulls to you with a single thought, and {npc:deniz_arman} saw that they came out of obedience, not love." }
            sonraki: "dct_cagri"
          - id: "tanri"
            etiket: { tr: "\"Belki tanrıyım. Yanımda dur yine de.\"", en: "\"Maybe a god. Stand with me anyway.\"" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 2 }
              - iliski: { deniz_arman: { korku: 6, saygi: 4 } }
            kronik: { tr: "Yan yatmış vapurda tanrılığını itiraf ettin ve en eski arkadaşından yine de yanında durmasını istedin.", en: "On the capsized ferry you owned up to godhood and asked your oldest friend to stand by you anyway." }
            sonraki: "dct_tanri"
          - id: "dovus"
            etiket: { tr: "\"Ölç beni. Kalkanınla, şimdi.\"", en: "\"Measure me. With your shield. Right now.\"" }
            goster: { npc_savasabilir: "deniz_arman" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1 }
              - iliski: { deniz_arman: { saygi: 6 } }
              - savas: { dusmanlar: ["npc:deniz_arman"], kazan: "dct_dovus", kaybet: "dct_dovus_yenilgi", kac: "dct_dovus_yenilgi" }
            kronik: { tr: "En eski arkadaşının kalkanına karşı güç ölçüştün; aradaki farkı ikiniz de o güvertede öğrendiniz.", en: "You tested your strength against your oldest friend's shield, and on that deck you both learned how wide the gap was." }
          - id: "yanki"
            etiket: { tr: "Cevabı {npc:yanki} versin; ağzını ona aç", en: "Let {npc:yanki} answer. Open your mouth to it" }
            goster: { bayrak: ["yanki_bagi", "deniz_yankiyi_biliyor"] }
            etkiler:
              - ahlak: { insanlik: -6, duzen: -2 }
              - yozlasma: 6
              - iliski: { deniz_arman: { korku: 14, guven: -8 } }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - tohum: { olay: "yozlasma_50", gecikme: { min: 1, max: 4 }, kosul: { yozlasma_min: 50, bayrak: "yanki_bagi" } }
            kronik: { tr: "Arkadaşının en önemli sorusunu kafandaki sese cevaplattın; {npc:deniz_arman} o gece iki kişiyle konuştuğunu anladı.", en: "You let the voice in your head answer your friend's most important question, and that night {npc:deniz_arman} understood there were two of you in there." }
            sonraki: "dct_yanki"
          - id: "sal"
            etiket: { tr: "\"O şalı burada, denize bırak.\"", en: "\"Leave that shawl here. In the sea.\"" }
            goster: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_gitti: "deniz_arman" }
            zar: { stat: "cha", zorluk: 18, tek: true, basarisiz: "dct_sal_red", basarisiz_etkiler: [{ ahlak: { insanlik: 2 } }, { iliski: { deniz_arman: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { insanlik: 5, duzen: -3 }
              - yoldas_katil: "deniz_arman"
              - npc_fraksiyon: { deniz_arman: "siginak" }
              - bayrak: "deniz_yukselenlerden_dondu"
              - bayrak_kaldir: "deniz_yukselenlere_gitti"
              - bayrak_kaldir: "deniz_tepede_kaldi"
              - itibar: { yukselenler: -8 }
              - iliski: { deniz_arman: { guven: 10, baglilik: 10 } }
            kronik: { tr: "Yan yatmış vapurun güvertesinde {npc:deniz_arman} gri şalı denize bıraktı; {yer:tepe} bir müminini, sen bir arkadaşını geri aldın.", en: "On the deck of the capsized ferry, {npc:deniz_arman} let the gray shawl go into the sea. The Heights lost a believer, and you got a friend back." }
            sonraki: "dct_sal"

      - id: "dct_siradan"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Bütün o ağırlığı içine çekiyorsun: seviyeyi, statları, havayı bükmeye alışmış iradeyi. Uzun zamandır ilk kez bedeninin sınırları sana dar gelmiyor; tam oturuyor. Rüzgâr yüzüne normal bir rüzgâr gibi çarpıyor.", en: "You pull all that weight back inside: the levels, the stats, the will that's gotten used to bending the air. For the first time in a long time your body doesn't feel too small for you. It fits. The wind hits your face like any other wind." }
          - { tr: "Simidinden bir parça koparıp güverteye atıyorsun. Martılar bakıyor, ama gelmiyor. Bir dakika, iki dakika. {npc:deniz_arman} hiçbir şey söylemeden elini bileğine koyuyor, avucunu açıyor, bir kırıntı bırakıyor ve elini tutmaya devam ediyor.", en: "You tear off a piece of pretzel and toss it on the deck. The gulls look, but they don't come. One minute. Two. Without a word, {npc:deniz_arman} puts a hand on your wrist, opens your palm, sets a crumb in it, and keeps holding on." }
          - { tr: "Sonunda bir martı geliyor; en küçüğü, en cesuru. Avucundan kırıntıyı alıp kaçıyor. {npc:deniz_arman} gülüyor; gülüşünde yıllar var. \"İşte,\" diyor. \"Hâlâ oradasın.\"", en: "Finally one comes, the smallest and bravest of them. Snatches the crumb out of your palm and bolts. {npc:deniz_arman} laughs, and there are years in that laugh. \"There,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"You're still in there.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"İnsan kalacağım. Sen bana hatırlattıkça.\"", en: "\"I'll stay human. As long as you keep reminding me.\"" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 3 }
              - unvan: "vapur_yoldasi"
              - bayrak: "deniz_insan_sozu"
              - iliski: { deniz_arman: { guven: 10, baglilik: 12 } }
              - hafiza: { npc: "deniz_arman", id: "pusula_oldu", agirlik: 60 }
            kronik: { tr: "Yan yatmış vapurda insan kalacağına söz verdin; {npc:deniz_arman} o sözü sana her gerektiğinde hatırlattı.", en: "On the capsized ferry you promised to stay human, and {npc:deniz_arman} reminded you of that promise every time you needed it." }
            sonraki: "@akis"
          - id: "sabah"
            etiket: { tr: "Bir şey söyleme; sabaha kadar burada otur", en: "Don't say anything. Sit here till morning" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - can: 40
              - iliski: { deniz_arman: { baglilik: 8 } }
            kronik: { tr: "Yan yatmış vapurda {npc:deniz_arman} ile sabaha kadar oturdun; kıyametin ortasında bir gece hiçbir şey olmadı.", en: "You sat on the capsized ferry with {npc:deniz_arman} until morning, and in the middle of the apocalypse, one night nothing happened." }
            sonraki: "@akis"

      - id: "dct_cagri"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "İstiyorsun ve geliyorlar. Bacadakiler, iskeledekiler, körfezin öbür ucunda uyuyanlar; yüzlercesi gökyüzünü kaplıyor, sonra güverteye, banklara, omuzlarına, saçlarına konuyor. Hiçbiri ses çıkarmıyor.", en: "You want them, and they come. The ones on the stack, the ones on the pier, the ones sleeping across the bay; hundreds of them blot out the sky, then land on the deck, the benches, your shoulders, your hair. Not one of them makes a sound." }
          - { tr: "Simit kırıntılarına dokunmuyorlar bile. Yalnızca sana bakıyorlar, emir bekleyen bir ordu gibi, kanatları titremeden.", en: "They don't even touch the pretzel crumbs. They just stare at you like an army waiting for orders, wings dead still." }
          - { tr: "{npc:deniz_arman} ayağa kalkmış, sırtı korkuluğa dayalı. \"Gelmediler,\" diyor, fısıltıyla. \"Getirdin onları. Bu sevmek değil. Bu sahip olmak.\"", en: "{npc:deniz_arman} is on {zamir:deniz_arman|onun} feet, back against the railing. \"They didn't come,\" {zamir:deniz_arman|o} whisper{zamir:deniz_arman|s}. \"You brought them. That's not love. That's ownership.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onları serbest bırak; utanarak", en: "Let them go. Ashamed" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { deniz_arman: { guven: 4, korku: -4 } }
            kronik: { tr: "Kendine çağırdığın martıları serbest bıraktın ve {npc:deniz_arman|in} önünde utandın; o utanç seni bir süre insan tuttu.", en: "You let the gulls you'd summoned go and felt ashamed in front of {npc:deniz_arman}. That shame kept you human for a while." }
            sonraki: "@akis"
          - id: "fark"
            etiket: { tr: "\"Fark ne? Sonunda yanımdalar.\"", en: "\"What's the difference? They're here, aren't they?\"" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -2 }
              - npc_iz: { deniz_arman: "korku_izi" }
              - iliski: { deniz_arman: { korku: 10, guven: -10 } }
            kronik: { tr: "Sevgiyle itaat arasındaki farkı sordun; {npc:deniz_arman} cevabı o gece senin yerine buldu ve korktu.", en: "You asked what the difference was between love and obedience. That night {npc:deniz_arman} found the answer for you, and it was terrifying." }
            sonraki: "@akis"

      - id: "dct_tanri"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} uzun süre denize bakıyor. Körfezin üstünde, Kule'nin ışıkları suya yansıyor; yüz kat, yüz parlak basamak, hepsi göğe.", en: "{npc:deniz_arman} stares at the sea for a long time. Over the bay, the Spire's lights shine on the water: a hundred floors, a hundred bright rungs, all of them climbing into the sky." }
          - { tr: "\"Tanrıların arkadaşı olmaz,\" diyor sonunda. \"Tapanları olur. Korkanları olur. Yanında duranlar zamanla ya diz çöker ya kaçar.\" Simidin son parçasını martılara atıyor. \"Ben ikisini de yapmak istemiyorum.\"", en: "\"Gods don't have friends,\" {zamir:deniz_arman|o} finally say{zamir:deniz_arman|s}. \"They've got worshippers. People who're scared of them. Whoever stands next to a god ends up kneeling or running.\" {zamir:deniz_arman|o|b} toss{zamir:deniz_arman|es} the last bit of pretzel to the gulls. \"I don't want to do either.\"" }
        secenekler:
          - id: "pusula"
            etiket: { tr: "\"O zaman ayakta dur. Benim yanımda, dimdik.\"", en: "\"Then stay standing. Right next to me.\"" }
            gerekli: { iliski_min: { deniz_arman: { guven: 50 } } }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - iliski: { deniz_arman: { baglilik: 10, saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "pusula_oldu", agirlik: 50 }
            kronik: { tr: "Bir tanrının yanında diz çökmeden durmasını istedin; {npc:deniz_arman} bunu yapabilen tek kişi oldu.", en: "You asked {npc:deniz_arman} to stand beside a god without kneeling, and {zamir:deniz_arman|o} turned out to be the only one who could." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "\"O zaman git. Seni yakmadan önce.\"", en: "\"Then go. Before I burn you.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -2 }
              - yoldas_ayril: "deniz_arman"
              - bayrak: "deniz_ayri"
              - iliski: { deniz_arman: { guven: 4, baglilik: -8 } }
            kronik: { tr: "En eski arkadaşını kendinden korumak için uzaklaştırdın; vapurdan inerken ikiniz de arkanıza bakmadınız.", en: "You sent your oldest friend away to protect them from you, and walking off that ferry, neither of you looked back." }
            sonraki: "@akis"
          - id: "diz"
            etiket: { tr: "\"Belki diz çökmelisin.\"", en: "\"Maybe you should kneel.\"" }
            etkiler:
              - ahlak: { insanlik: -8, duzen: 4 }
              - npc_iz: { deniz_arman: "korku_izi" }
              - iliski: { deniz_arman: { korku: 16, guven: -14, baglilik: -10 } }
            kronik: { tr: "Yan yatmış vapurda en eski arkadaşından diz çökmesini istedin; o gece ikiniz arasında bir şey öldü.", en: "On the capsized ferry you told your oldest friend to kneel, and something between the two of you died that night." }
            sonraki: "@akis"

      - id: "dct_dovus"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Bitmesi bir nefes sürüyor. {npc:deniz_arman} kalkanını kaldırıyor, sen bir adım atıyorsun ve kalkan güvertenin öbür ucunda, korkuluğa çarpmış, yamulmuş duruyor. {npc:deniz_arman} sırtüstü, şaşkın, ellerine bakıyor.", en: "It's over in a breath. {npc:deniz_arman} raises the shield, you take one step, and the shield is lying at the far end of the deck, bent, wedged against the railing. {npc:deniz_arman} is flat on {zamir:deniz_arman|onun} back, staring at {zamir:deniz_arman|onun} own hands." }
          - { tr: "\"Bir satır,\" diyor. \"Pencerem bunu tek bir satırla anlattı. Aylardır antrenman yapıyorum ve ben senin için tek bir satırım.\"", en: "\"One line,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"My window described that in one line. I've trained for months, and to you I'm a single line.\"" }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Elini uzat: \"Benim için hiçbir zaman bir satır değilsin.\"", en: "Offer a hand: \"You've never been a line to me.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
            kronik: { tr: "Arkadaşını tek bir satırda yere serdin ve sonra elini uzattın; o el, satırdan daha çok şey anlattı.", en: "You put your friend down in a single line, then held out your hand, and that hand said more than the line did." }
            sonraki: "@akis"
          - id: "kalkan"
            etiket: { tr: "Yamulmuş kalkanı düzelt ve geri ver", en: "Straighten the bent shield and give it back" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - iliski: { deniz_arman: { saygi: 8, guven: 4 } }
            kronik: { tr: "Ezdiğin kalkanı kendi ellerinle düzeltip sahibine geri verdin.", en: "You hammered the shield you'd crushed back into shape with your own hands and gave it back to its owner." }
            sonraki: "@akis"
          - id: "gercek"
            etiket: { tr: "\"Gerçek bu. Alışman lazım.\"", en: "\"This is reality. Get used to it.\"" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 3 }
              - iliski: { deniz_arman: { korku: 10, guven: -8 } }
            kronik: { tr: "Arkadaşına aranızdaki farka alışmasını söyledin; alıştı, ama sana değil.", en: "You told your friend to get used to the gap between you. {npc:deniz_arman} did, just not to you." }
            sonraki: "@akis"

      - id: "dct_dovus_yenilgi"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Bir yerde, bilerek ya da bilmeyerek, elini indiriyorsun. {npc:deniz_arman|in} kalkanı göğsüne çarpıyor ve eğik güvertede kayıp korkuluğa yaslanıyorsun.", en: "Somewhere in there, on purpose or not, you drop your guard. {npc:deniz_arman|pos} shield slams into your chest, and you slide down the slanted deck into the railing." }
          - { tr: "{npc:deniz_arman} kalkanı indiriyor, nefes nefese. \"Bıraktın,\" diyor. \"Biliyorum bıraktığını. Ama bir an... bir an hâlâ birbirimize dokunabiliyormuşuz gibi geldi.\"", en: "{npc:deniz_arman} lowers the shield, breathing hard. \"You let me,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I know you let me. But for a second... it felt like we could still reach each other.\"" }
        secenekler:
          - id: "itiraf"
            etiket: { tr: "\"Evet, bıraktım. Bazen kaybetmek istiyorum.\"", en: "\"Yeah, I let you. Sometimes I want to lose.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
            kronik: { tr: "Arkadaşına bazen kaybetmek istediğini itiraf ettin; o gece kazandığın tek şey buydu ve yetti.", en: "You admitted to your friend that sometimes you want to lose. It was the only thing you won that night, and it was enough." }
            sonraki: "@akis"
          - id: "inkar"
            etiket: { tr: "\"Bırakmadım. Sen güçlendin.\"", en: "\"I didn't let you. You got stronger.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { deniz_arman: { saygi: 6, guven: 2 } }
            kronik: { tr: "Kaybettiğin bir dövüşü arkadaşının gücüne verdin; yalan mıydı, bir hediye mi, hiç konuşmadınız.", en: "You credited a fight you lost to your friend's strength. Lie or gift, you never talked about it." }
            sonraki: "@akis"

      - id: "dct_yanki"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Ağzını açıyorsun ama konuşan sen değilsin. Sesin senin sesin; vurgular, duraklar, kelimelerin arasındaki boşluk başka birinin.", en: "You open your mouth, but you're not the one talking. The voice is yours. The stresses, the pauses, the gaps between the words belong to someone else." }
          - { tr: "\"ikisi de değil,\" diyor ağzın. \"o bir anomali. canavarlar ve tanrılar sisteme dahildir. o değil. sen de ona bunu sorma artık. sorman onu yavaşlatıyor.\"", en: "\"neither,\" your mouth says. \"it's an anomaly. monsters and gods are part of the system. it isn't. stop asking it that. asking slows it down.\"" }
          - { tr: "{npc:deniz_arman} öyle hızlı geri çekiliyor ki banka çarpıyor. Uzun süre seni tanıyamayan gözlerle bakıyor; sonra, çok alçak sesle: \"Ona söyle, ağzını kullanmasın. Senin ağzın benim arkadaşımın.\"", en: "{npc:deniz_arman} backs away so fast {zamir:deniz_arman|o} hit{zamir:deniz_arman|s} a bench. Stares at you for a long time with eyes that can't place you. Then, very low: \"Tell it to stop using your mouth. That mouth belongs to my friend.\"" }
        secenekler:
          - id: "geri_al"
            etiket: { tr: "Ağzını geri al; {npc:yanki|e} sınır çiz", en: "Take your mouth back. Draw a line with {npc:yanki}" }
            etkiler:
              - ahlak: { insanlik: 5, duzen: 2 }
              - yozlasma: -4
              - iliski: { deniz_arman: { guven: 6 } }
              - iliski: { yanki: { guven: -6, saygi: 6 } }
            kronik: { tr: "Kafandaki sese ağzının sınırını çizdin; {npc:deniz_arman} o sınırın kendisi için çizildiğini biliyordu.", en: "You drew a line for the voice in your head: not your mouth. {npc:deniz_arman} knew that line was drawn for {zamir:deniz_arman|onu}." }
            sonraki: "@akis"
          - id: "hakli"
            etiket: { tr: "\"Haklı ama. İkimiz de anomaliyiz.\"", en: "\"It's not wrong, though. We're both the anomaly.\"" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: -2 }
              - yozlasma: 3
              - iliski: { deniz_arman: { korku: 8, baglilik: -6 } }
              - iliski: { yanki: { guven: 6, baglilik: 6 } }
            kronik: { tr: "En eski arkadaşına 'biz' dedin ve o 'biz'in içinde {npc:deniz_arman} yoktu.", en: "You said 'we' to your oldest friend, and {npc:deniz_arman} wasn't part of that 'we.'" }
            sonraki: "@akis"

      - id: "dct_sal"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} şalı omzundan çözüyor. Bir an elinde tutuyor; işaret ay ışığında parlıyor, sonra kumaş korkuluğun üstünden kayıp karanlık suya düşüyor.", en: "{npc:deniz_arman} unties the shawl, holds it for a moment, the mark glinting in the moonlight. Then the cloth slides off over the railing into the black water." }
          - { tr: "\"Bana senin canavar olduğunu söylediler,\" diyor. \"Sonra tanrı olduğunu. Bir gecede ikisini birden. O zaman anladım: ne olduğunu bilmiyorlar. Ben biliyorum. Benimle simit yiyen kişisin.\"", en: "\"They told me you were a monster,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Then they told me you were a god. Both in one night. That's when I got it: they've got no idea what you are. I do. You're the one who eats pretzels with me.\"" }
        secenekler:
          - id: "simit"
            etiket: { tr: "Simidinin yarısını uzat", en: "Hand over half your pretzel" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - unvan: "vapur_yoldasi"
              - bayrak: "deniz_insan_sozu"
              - iliski: { deniz_arman: { baglilik: 10 } }
            kronik: { tr: "Yükselenler'den dönen arkadaşınla bir simidi ikiye böldün; o gece Sistem bir unvan, sen bir arkadaş kazandın.", en: "You split a pretzel with a friend back from the Ascended. That night the System gave you a title, and you got a friend." }
            sonraki: "@akis"
          - id: "tepe"
            etiket: { tr: "\"{yer:tepe} bunu affetmeyecek. Arkanı kollarım.\"", en: "\"The Heights won't forgive this. I've got your back.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - iliski: { deniz_arman: { guven: 8, saygi: 4 } }
            kronik: { tr: "Yükselenler'den kaçan arkadaşının arkasını kollayacağına söz verdin ve kolladın.", en: "You promised to watch the back of a friend who'd run from the Ascended, and you did." }
            sonraki: "@akis"

      - id: "dct_sal_red"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} şala dokunuyor ama çözmüyor. \"Yapamam,\" diyor. \"Yukarıda bana ihtiyacı olan insanlar var. Senin bilmediğin insanlar. Senin hiç uğramadığın sokaklar.\"", en: "{npc:deniz_arman} touches the shawl but doesn't untie it. \"I can't,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"There are people up there who need me. People you don't know. Streets you never set foot on.\"" }
          - { tr: "Vapurdan iniyor, iskelenin ucunda bir an duruyor. \"Bir gün karşılaşırsak,\" diyor, dönmeden, \"bu geceyi hatırla. Ben hatırlayacağım.\"", en: "{npc:deniz_arman} steps off the ferry and stops at the end of the pier for a second. \"If we ever end up on opposite sides,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, without turning around, \"remember tonight. I will.\"" }
        secenekler:
          - id: "hatirla"
            etiket: { tr: "\"Hatırlayacağım.\"", en: "\"I'll remember.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { baglilik: 6, saygi: 4 } }
              - tohum: { olay: "deniz_yukselen_rakip", gecikme: { min: 8, max: 20 }, kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" } } }
            kronik: { tr: "Yükselenler'de kalan arkadaşına o geceyi hatırlayacağına söz verdin; karşılaştığınızda ikiniz de hatırladınız.", en: "You promised the friend who stayed with the Ascended you'd remember that night, and when you met again, you both did." }
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "\"Karşıma çıkarsan seni durdururum.\"", en: "\"Get in my way and I'll stop you.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - npc_isaret: { deniz_arman: "rakip" }
              - iliski: { deniz_arman: { saygi: 6, guven: -8 } }
              - tohum: { olay: "deniz_yukselen_rakip", gecikme: { min: 8, max: 20 }, kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" } } }
            kronik: { tr: "Vapurda en eski arkadaşına rakip olacağınızı söyledin; söylediğin gibi oldu.", en: "On the ferry you told your oldest friend you'd be rivals, and that's exactly how it went." }
            sonraki: "@akis"

  # ================================================================== DENİZ · P3 (anma): ayna
  - id: "deniz_anma_ayna"
    perde: [3]
    ana_yay: { gun: 225 }
    kosul: { npc_olu: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "anma", "nefes"]
    gerilim: 2
    onemli: true
    kart: { tr: "Kimsenin sormadığı soru", en: "The question nobody asks" }
    sahne: "daa_1"
    sahneler:
      - id: "daa_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Gece yarısı kendini iskelede, yan yatmış vapurun eğik güvertesinde buluyorsun; buraya neden geldiğini bilmeden. Her sabah bindiğiniz vapur bu. Kıç taraftaki banklar hâlâ yerinde; biri, ikinizin hep oturduğu bank.", en: "Midnight finds you on the pier, on the tilted deck of the capsized ferry, without knowing why you came. It's the ferry you rode every morning. The benches at the stern are still bolted in, and one of them is the bench you two always sat on." }
          - { tr: "Güverteye adım attığında bacadaki martılar uyanıyor ve sessizce senden uzağa havalanıyor. Seni bir fırtına gibi algılıyorlar. Yanında simidini onlarla bölüşecek kimse yok.", en: "When you step onto the deck, the gulls on the smokestack wake and lift away from you without a sound. To them you're a storm. There's nobody beside you to split a pretzel with them." }
          - metin: { tr: "Sonra iskeleden küçük ayak sesleri. Kız; on dört yaşında artık, elinde iki bayat simit. \"Depodakiler buraya geldiğini söyledi,\" diyor. \"{npc:deniz_arman} sana hep bir şey sorarmış. Ben soracağım.\"", en: "Then small footsteps on the pier. The girl, fourteen now, two stale pretzels in her hands. \"The warehouse kids said you'd come here,\" she says. \"{npc:deniz_arman} always used to ask you something. I'm going to ask it.\"" }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "Vapurun kırık bir camında kendi yansımanı görüyorsun. Soruyu yansıma soruyor, {npc:deniz_arman|in} sesiyle, çünkü artık soracak başka kimse yok: neye dönüşüyorsun?", en: "You catch your reflection in a cracked ferry window. The reflection asks the question, in {npc:deniz_arman|pos} voice, because there's nobody else left to ask it: what are you turning into?" }
            kosul: { bayrak_yok: "kardes_kurtarildi" }
          - { tr: "\"Canavara mı, tanrıya mı?\" Kıyamette bu soruyu sana soracak kadar seni seven tek kişi Çıkış Kapısı'nın önünde kaldı.", en: "\"A monster, or a god?\" The only person who loved you enough to ask that in the apocalypse stayed behind at the Exit Gate." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu soruyu ben de sorabilirim. ama benim sormam aynı şey olmaz. ben cevabı zaten biliyorum ve bu cevabı sevmiyorsun.", en: "i could ask it too. but it wouldn't be the same coming from me. i already know the answer, and you don't like it." }
        secenekler:
          - id: "insan"
            etiket: { tr: "\"İnsan. Onun hatırına, insan.\"", en: "\"Human. For their sake, human.\"" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 3 }
              - gizle: 4
              - unvan: "vapur_yoldasi"
              - bayrak: "deniz_insan_sozu"
            kronik: { tr: "Ölü bir arkadaşın sorusuna yan yatmış bir vapurda cevap verdin: insan. O cevabı son güne kadar taşıdın.", en: "You answered a dead friend's question on a capsized ferry: human. You carried that answer to the very last day." }
            sonraki: "daa_simit"
          - id: "tanri"
            etiket: { tr: "\"Tanrı. Ve bunu bana soracak kimse kalmadı.\"", en: "\"A god. And there's nobody left to ask.\"" }
            etkiler:
              - ahlak: { insanlik: -6, duzen: 2 }
              - dikkat: 3
              - iliski: { yanki: { saygi: 4, baglilik: 4 } }
            kronik: { tr: "Ölü bir arkadaşın sorusuna tanrı diye cevap verdin; kimse itiraz etmedi, çünkü itiraz edecek kimse yoktu.", en: "You answered a dead friend's question with 'god,' and nobody argued, because there was nobody left who would." }
            sonraki: "daa_sessiz"
          - id: "cagir"
            tur: "gosteris"
            etiket: { tr: "Martıları çağır; hiç değilse onlar yanında olsun", en: "Call the gulls. At least they'll be with you" }
            gerekli: { stat: { cha: 150 } }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -1 }
              - dikkat: 3
            kronik: { tr: "Yalnızlığını yüzlerce martıyla doldurdun; hiçbiri simit istemedi, hiçbiri gitmedi.", en: "You filled your loneliness with hundreds of gulls. None of them wanted pretzels, and none of them left." }
            sonraki: "daa_sessiz"

      - id: "daa_simit"
        yer: "kiyikent_iskele"
        paragraflar:
          - metin: { tr: "Kız simitlerden birini sana uzatıyor, öbürünü kırıp martılara atıyor. Martılar ona geliyor. Sonra kız avucunu açıp senin elinin altına koyuyor, elindeki kırıntıyla; bir martı, en küçüğü, gelip senin elinden alıyor.", en: "The girl hands you one pretzel and breaks the other up for the gulls. They come to her. Then she opens her palm under your hand with a crumb in it, and one gull, the smallest, comes and takes it from your hand." }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "Simidin yok, ama cebinde bir parça kuru ekmek var. Bütün o ağırlığı içine çekip bekliyorsun. Uzun süre hiçbir şey olmuyor. Sonra en küçük martı geliyor ve avucundan kırıntıyı kapıp kaçıyor.", en: "You don't have a pretzel, but there's a heel of dry bread in your pocket. You pull all that weight back inside and wait. Nothing happens for a long time. Then the smallest gull comes and snatches the crumb right out of your palm." }
            kosul: { bayrak_yok: "kardes_kurtarildi" }
          - { tr: "Sabaha kadar güvertede kalıyorsun. Güneş doğarken bankta, eskiden onun oturduğu yerde, birinin bıraktığı bir sıcaklık varmış gibi geliyor. Yokmuş. Ama gelmiş gibi.", en: "You stay on the deck till morning. When the sun comes up, the spot on the bench where they used to sit feels warm, like someone just left it. Nobody did. It just feels that way." }
        secenekler:
          - id: "sabah"
            etiket: { tr: "Güneşi izle ve iskeleden in", en: "Watch the sunrise, then step off the pier" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - can: 40
              - xp_seviye: 20
            kronik: { tr: "Bir sabah yan yatmış bir vapurdan indin ve bir martının hâlâ senin elinden yiyebildiğini biliyordun.", en: "One morning you stepped off a capsized ferry knowing a gull could still eat from your hand." }
            sonraki: "@akis"

      - id: "daa_sessiz"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Güverte sessiz. Rüzgâr bile senin çevrende dolanıyor, yolunu değiştiriyor. Kule'nin ışıkları körfezde yüz basamak gibi yanıyor ve sen hepsine tırmanabileceğini biliyorsun.", en: "The deck is silent. Even the wind circles around you, changes course. The Spire's lights burn across the bay like a hundred rungs, and you know you could climb every one." }
          - { tr: "Bankta kimse yok. Belki de en çok bunu istiyordun; sana soru soracak kimsenin kalmamasını. Şimdi kalmadı.", en: "The bench is empty. Maybe that's what you wanted most: nobody left to ask you questions. Now there isn't." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve Kule'ye yürü", en: "Get up and walk toward the Spire" }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 2 }
              - xp_seviye: 25
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 6 }, kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_kaynagi_goruldu" } }
            kronik: { tr: "Yan yatmış vapurdan kalkıp Kule'ye yürüdün; arkanda boş bir bank kaldı.", en: "You got up from the capsized ferry and walked toward the Spire, and behind you, the bench stayed empty." }
            sonraki: "@akis"
          - id: "otur"
            etiket: { tr: "Bir süre daha bankta, onun yerinde otur", en: "Sit a while longer on the bench, in their spot" }
            etkiler:
              - ahlak: { insanlik: 3 }
            kronik: { tr: "Ölü arkadaşının vapurdaki yerine oturdun; bir an, yalnızca bir an, ikiniz de oradaydınız.", en: "You sat in your dead friend's spot on the ferry, and for a moment, just a moment, you were both there." }
            sonraki: "@akis"

  # ================================================================== DENİZ · P4: son fedakârlık
  - id: "deniz_son_fedakarlik"
    perde: [4]
    ana_yay: { gun: 347 }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "boss"]
    gerilim: 4
    npc: ["deniz_arman"]
    onemli: true
    kart: { tr: "Hat bende", en: "I've got the line" }
    sahne: "dsf_1"
    sahneler:
      - id: "dsf_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gökyüzündeki geri sayım gece yarısı bir an duruyor. İki saniyenin arasındaki boşluktan bir şey düşüyor ve {yer:kiyikent_liman|in} asfaltına çakılıyor; yere değdiği yerde taşlar dişli çarklara, kaldırım bir saat kadranına dönüşüyor.", en: "At midnight, the countdown in the sky stops for a beat. Something drops through the gap between two seconds and slams into {yer:kiyikent_liman} asphalt. Where it lands, the stones turn into gears and the sidewalk into a clock face." }
          - { tr: "Hasat Avcısı başını kaldırıyor. {yer:kiyikent_liman|de} yüzlerce insan var; hiçbirine bakmıyor. Bütün kadranı, bütün dişleri, bütün sayısı sana dönük: [HESAP DIŞI DEĞER · SİLİNECEK].", en: "The Harvest Hunter lifts its head. There are hundreds of people at {yer:kiyikent_liman}, and it doesn't look at a single one. Its whole face, all its teeth, all its counting are turned on you: [VALUE OUT OF BOUNDS · DELETE]." }
          - metin: { tr: "{npc:deniz_arman} sen bir şey diyemeden önüne geçiyor; kalkanı yamuk, yıllarca dövülmüş, Öğretici'den kalma. \"Hat bende,\" diyor. \"Çıkış Kapısı'ndaki gibi. Sen hep önce inersin.\"", en: "{npc:deniz_arman} steps in front of you before you can say a word, shield dented and beaten from years of use, the same one from the Tutorial. \"I've got the line,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Like at the Exit Gate. You always get off first.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "{yer:kiyikent_liman|in} öbür ucundan biri koşuyor; deponun kapısından, elinde yamuk bir kalkanla. {npc:deniz_arman}. \"Çocuklar seni camdan gördü,\" diye bağırıyor, nefes nefese. \"Hat bende!\"", en: "Someone's running from the far end of {yer:kiyikent_liman}, out the warehouse door, a dented shield in hand. {npc:deniz_arman}. \"The kids saw you through the window,\" {zamir:deniz_arman|o} yell{zamir:deniz_arman|s}, out of breath. \"I've got the line!\"" }
            kosul: { bayrak: "deniz_ayri" }
          - metin: { tr: "{yer:tepe|den} inen yokuştan gri bir şal savruluyor. {npc:deniz_arman} şalı yere atıyor, koşarken. \"Peygamber bu gece senin öleceğini söyledi,\" diyor. \"Bir kez olsun yanılsın diye geldim.\"", en: "A gray shawl flaps loose on the road down from {yer:tepe}. {npc:deniz_arman} throws it off mid-stride. \"The Prophet said you'd die tonight,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"I came to make him wrong for once.\"" }
            kosul: { npc_fraksiyon: { deniz_arman: "yukselenler" }, npc_gitti: "deniz_arman" }
          - metin: { tr: "Ona son kez ihanet ettiği gecede gördüğün yüz, şimdi önünde. \"Borcum var,\" diyor {npc:deniz_arman}, sana bakmadan. \"Bu gece ödüyorum.\"", en: "The face you last saw the night of the betrayal is in front of you now. \"I owe you,\" {npc:deniz_arman} says, not looking at you. \"Tonight I pay.\"" }
            kosul: { bayrak: "ihanet_deniz" }
          - metin: { tr: "Vapurdaki o gece aklına geliyor: insan kalacağına verdiğin söz. {npc:deniz_arman} omzunun üstünden bakıyor; o da hatırlıyor.", en: "You think of that night on the ferry, and the promise to stay human. {npc:deniz_arman} glances back over a shoulder. {zamir:deniz_arman|o|b} remember{zamir:deniz_arman|s} too." }
            kosul: { bayrak: "deniz_insan_sozu" }
        sezgiler:
          - kosul: { stat: { per: 300 } }
            metin: { tr: "Avcının hesabında tek bir değişken var: sen. Önüne çıkan her şeyi bir hata payı sayıyor. Biri araya girerse bir saniyeliğine tökezleyecek; o saniyede çekirdeği açık.", en: "There's one variable in the hunter's math: you. Anything that gets in front of you, it counts as margin of error. If someone steps in, it'll stumble for one second, and for that second its core is open." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu sistem gönderdi. bana değil, sana. seni artık silmek istiyor; çünkü hesabı bozuyorsun. bu bir iltifat. ve ölümcül.", en: "the system sent this. not for me. for you. it wants you deleted now, because you're breaking the math. that's a compliment. it's also lethal." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bana bak. Yine aynı şeyi yapıyorum, değil mi? Bu sefer bırak yapayım.\"", en: "\"Look at me. I'm doing the same thing again, huh? This time, let me.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Hattı ona bırak. Çekirdeğe koş", en: "Let {zamir:deniz_arman|onu} hold the line. Run for the core" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -2 }
              - bayrak: "deniz_fedakarlik"
              - savas: { dusmanlar: ["hasat_avcisi@oyuncu+1"], ortam: ["dar_gecit"], kazan: "dsf_hat_zafer", kaybet: "dsf_hat_yenilgi" }
            kronik: { tr: "{npc:deniz_arman} senin için ikinci kez bir hat tuttu ve sen ikinci kez koştun.", en: "{npc:deniz_arman} held a line for you a second time, and a second time, you ran." }
          - id: "arkama"
            etiket: { tr: "Onu arkana çek: \"Bu sefer hat bende.\"", en: "Pull {zamir:deniz_arman|onu} behind you: \"This time I've got the line.\"" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 12, guven: 8 } }
              - savas: { dusmanlar: ["hasat_avcisi@oyuncu+6"], ortam: ["dar_gecit"], kazan: "dsf_birlikte", kaybet: "dsf_deniz_olur", kac: "dsf_deniz_olur" }
            kronik: { tr: "Bu sefer hattı sen tuttun; {npc:deniz_arman} ilk kez senin arkanda durdu.", en: "This time you held the line yourself, and for the first time, {npc:deniz_arman} stood behind you." }
          - id: "saniye"
            tur: "gosteris"
            etiket: { tr: "Darbeyi iki saniyenin arasında yakala", en: "Catch the blow between two seconds" }
            gerekli: { stat: { agi: 400 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -5 }
              - dikkat: 6
              - xp_seviye: 120
              - bayrak: "deniz_fedakarlik_onlendi"
              - iliski: { deniz_arman: { korku: 8, saygi: 10 } }
            kronik: { tr: "Sistem'in kendi avcısını iki saniyenin arasında durdurdun; {npc:deniz_arman} o gece bir tanrının onu kurtardığını gördü.", en: "You stopped the System's own hunter between two seconds, and that night {npc:deniz_arman} watched a god save {zamir:deniz_arman|onu}." }
            sonraki: "dsf_tanri"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} fısılda: darbeyi bana yönlendir", en: "Whisper to {npc:yanki}: route the hit into me" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - yozlasma: 4
              - bayrak: "deniz_fedakarlik_onlendi"
              - iliski: { yanki: { guven: 10, baglilik: 10 } }
              - iliski: { deniz_arman: { guven: 6 } }
            kronik: { tr: "{npc:yanki} Sistem'in darbesini {npc:deniz_arman|den} alıp kendi bozuk satırlarına gömdü; o günden sonra sesinde bir çatlak kaldı.", en: "{npc:yanki} pulled the System's blow off {npc:deniz_arman} and buried it in its own broken lines. There was a crack in its voice ever after." }
            sonraki: "dsf_yanki"

      - id: "dsf_hat_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının kadranı elinin altında çatlıyor ve akrep ile yelkovan aynı anda duruyor. Gökyüzündeki geri sayım bir saniye takılıyor, sonra yeniden akmaya başlıyor; senin adın hesaptan silinmemiş.", en: "The hunter's clock face cracks under your hand, and both hands stop at once. The countdown in the sky catches for one second, then starts running again. Your name's still in the math." }
          - { tr: "Dönüyorsun. Hat hâlâ orada: asfalta saplanmış yamuk bir kalkan ve ona sırtını vermiş, dinleniyormuş gibi oturan {npc:deniz_arman}. Gözleri açık; {yer:kiyikent_liman|in} ışıklarına bakıyor.", en: "You turn around. The line's still there: a dented shield driven into the asphalt, and {npc:deniz_arman} sitting with {zamir:deniz_arman|onun} back against it like {zamir:deniz_arman|o} just stopped to rest. Eyes open, looking at the lights of {yer:kiyikent_liman}." }
          - { tr: "\"Tanıdım seni,\" diyor, çok alçak sesle. \"Hâlâ tanıyorum. Söz tutuldu.\" Sonra penceresinde küçük, sıradan bir bildirim beliriyor: [Koruma +1]. Ve kapanıyor.", en: "\"I recognized you,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, very quietly. \"I still do. Promise kept.\" Then a small, ordinary notification shows up in {zamir:deniz_arman|onun} window: [Protection +1]. And it closes." }
        secenekler:
          - id: "kalkan"
            etiket: { tr: "Kalkanı al. Artık onu sen taşıyacaksın", en: "Take the shield. You carry it now" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - npc_ol: "deniz_arman"
              - unvan: "kalkanin_varisi"
              - egilim: { koruma: 4 }
              - xp_seviye: 150
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:deniz_arman} seni Hasat'ın avcısından korurken öldü; kalkanını son güne kadar sen taşıdın.", en: "{npc:deniz_arman} died shielding you from the Harvest's hunter, and you carried that shield to the very last day." }
            sonraki: "@akis"
          - id: "tut"
            etiket: { tr: "Elini tut ve son nefese kadar bırakma", en: "Hold {zamir:deniz_arman|onun} hand. Don't let go till the end" }
            etkiler:
              - ahlak: { insanlik: 6 }
              - npc_ol: "deniz_arman"
              - unvan: "kalkanin_varisi"
              - xp_seviye: 150
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:deniz_arman} {yer:kiyikent_liman|de}, elini tutarken öldü; Öğretici'de bırakmadığın el, sonunda da bırakılmadı.", en: "{npc:deniz_arman} died at {yer:kiyikent_liman} with you holding on. The hand you never let go of in the Tutorial, you didn't let go of at the end, either." }
            sonraki: "@akis"

      - id: "dsf_hat_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının dişleri seni asfalta mıhlıyor ve gökyüzündeki sayı senin kalp atışına geçiyor. Son saniyede bir kalkan aranıza giriyor; bir daha, bir daha.", en: "The hunter's teeth pin you to the asphalt, and the number in the sky syncs to your heartbeat. In the last second a shield comes down between you. Again. Again." }
          - { tr: "[Hedef silinemedi. Değer hesaba yeniden ekleniyor.] Avcı titreyerek iki saniyenin arasına geri çekiliyor. Kalkan asfaltta, ikiye ayrılmış; arkasında {npc:deniz_arman} yatıyor ve gülümsüyor, yarım.", en: "[Target could not be deleted. Re-adding value to the math.] The hunter shudders and backs into the gap between two seconds. The shield lies on the asphalt in two pieces, and behind it, {npc:deniz_arman} is lying there with half a smile." }
        secenekler:
          - id: "yanina"
            etiket: { tr: "Yanına sürün; son sözünü duy", en: "Crawl to {zamir:deniz_arman|onu}. Hear the last words" }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 2 }
              - npc_ol: "deniz_arman"
              - unvan: "kalkanin_varisi"
              - xp_seviye: 80
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Sen yerdeyken {npc:deniz_arman} seninle Sistem'in arasında durdu ve öldü; son sözü bir vapur şakasıydı.", en: "While you were down, {npc:deniz_arman} stood between you and the System and died. The last words were a joke about the ferry." }
            sonraki: "@akis"

      - id: "dsf_birlikte"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcı son kez saniyelerin arasına sıçramaya çalışıyor ve sen onu tam o aralıkta yakalıyorsun. Kadran parçalanıyor; çarklar {yer:kiyikent_liman|in} asfaltına bozuk para gibi saçılıyor.", en: "The hunter tries to jump between seconds one last time, and you catch it right in the gap. The clock face shatters, and its gears scatter across {yer:kiyikent_liman} asphalt like loose change." }
          - { tr: "Arkanda {npc:deniz_arman} kalkanını indiriyor; çizik bile yok. \"Sen,\" diyor, şaşkın, \"hattı tuttun. Benim için.\" Sonra gülmeye başlıyor; korkudan sonra gelen o eski, kesik gülüş.", en: "Behind you, {npc:deniz_arman} lowers the shield without a scratch on it. \"You,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, stunned, \"held the line. For me.\" Then the laughing starts, that old ragged laugh that comes after fear." }
          - { tr: "{yer:kiyikent_liman|de} insanlar pencerelerden, kapılardan çıkıyor. Kimse alkışlamıyor; iki kişinin aynı anda nefes aldığını izliyorlar.", en: "People come out of windows and doorways along {yer:kiyikent_liman}. Nobody claps. They just watch two people breathe at the same time." }
        secenekler:
          - id: "simit"
            etiket: { tr: "\"Sabah vapurda simit. Ben ısmarlıyorum.\"", en: "\"Pretzels on the ferry in the morning. My treat.\"" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - bayrak: "deniz_fedakarlik_onlendi"
              - xp_seviye: 150
              - iliski: { deniz_arman: { baglilik: 12, guven: 10 } }
              - hafiza: { npc: "deniz_arman", id: "olay:deniz_son_fedakarlik", agirlik: 80 }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Hasat'ın avcısını {npc:deniz_arman|in} önünde durarak yendin; ertesi sabah vapurda simit yediniz.", en: "You beat the Harvest's hunter standing in front of {npc:deniz_arman}, and the next morning you ate pretzels on the ferry." }
            sonraki: "@akis"
          - id: "carklar"
            etiket: { tr: "Bir çark al; ona ver. Hatıra", en: "Pick up a gear. Give it to {zamir:deniz_arman|onu}. A keepsake" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 1 }
              - bayrak: "deniz_fedakarlik_onlendi"
              - xp_seviye: 150
              - iliski: { deniz_arman: { baglilik: 8, saygi: 8 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Sistem'in avcısından kalan bir çarkı {npc:deniz_arman|e} verdin; o çark yıllar sonra bir çocuğun boynunda asılıydı.", en: "You gave {npc:deniz_arman} a gear from the System's hunter, and years later it hung around a child's neck." }
            sonraki: "@akis"

      - id: "dsf_deniz_olur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Dizlerin çözülüyor. Avcının kadranı üstüne eğiliyor, sayı sıfıra iniyor ve tam o anda bir kalkan aranıza giriyor. \"Sen hep önce inersin,\" diyor {npc:deniz_arman}. \"Kuralı bozma.\"", en: "Your knees give out. The hunter's face leans over you, the number drops to zero, and right then a shield comes down between you. \"You always get off first,\" {npc:deniz_arman} says. \"Don't break the rule.\"" }
          - { tr: "Avcı hesabını tamamlayamadan iki saniyenin arasına geri çekiliyor. Sen hayattasın. Kalkan ikiye ayrılmış, asfaltta.", en: "The hunter backs into the gap between two seconds before it can finish its math. You're alive. The shield is lying in two pieces on the asphalt." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Ona sarıl; yalnız gitmesine izin verme", en: "Hold {zamir:deniz_arman|onu}. Don't let {zamir:deniz_arman|onu} go alone" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - npc_ol: "deniz_arman"
              - bayrak: "deniz_fedakarlik"
              - unvan: "kalkanin_varisi"
              - xp_seviye: 80
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Hattı sen tutmak istedin; düştüğünde {npc:deniz_arman} tuttu ve öldü. Sen onu kollarında uğurladın.", en: "You wanted to hold the line yourself. When you fell, {npc:deniz_arman} held it and died, and you saw {zamir:deniz_arman|onu} off in your arms." }
            sonraki: "@akis"

      - id: "dsf_tanri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcı sıçrıyor ve sen iki saniyenin arasına onun peşinden giriyorsun. Orada dünya duruyor; yağmur damlaları havada asılı, {npc:deniz_arman|in} kalkanı yarım kalkmış. Avcının çekirdeğini oradan, zamanın dışından söküp alıyorsun.", en: "The hunter jumps, and you follow it into the gap between two seconds. In there the world is stopped: raindrops hanging in the air, {npc:deniz_arman|pos} shield half raised. You tear the hunter's core out from right there, outside of time." }
          - { tr: "Zaman yeniden akıyor. Avcı yok. {npc:deniz_arman} kalkanını indirmeye fırsat bulamadan her şey bitmiş; önünde yalnızca sen ve elinde hâlâ tik takları atan bir kalp var.", en: "Time starts again. The hunter's gone. It was over before {npc:deniz_arman} had time to lower the shield; there's just you, and in your hand a heart still ticking." }
          - { tr: "\"Kurtardın beni,\" diyor {npc:deniz_arman}. \"Ve ben seni göremedim bile.\" Sesinde minnet var. Altında bir yas daha var; bu sefer kendisi için değil, senin için.", en: "\"You saved me,\" {npc:deniz_arman} says. \"And I couldn't even see you do it.\" There's gratitude in it. And under that, more grief. Not for {zamir:deniz_arman|kendi} this time. For you." }
        secenekler:
          - id: "gor"
            etiket: { tr: "\"Beni gör. Hâlâ buradayım.\"", en: "\"See me. I'm still here.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - iliski: { deniz_arman: { guven: 8, korku: -4 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Zamanın dışından dönüp arkadaşına hâlâ orada olduğunu söyledin; {npc:deniz_arman} sana inanmayı seçti.", en: "You came back from outside of time and told your friend you were still in there, and {npc:deniz_arman} chose to believe you." }
            sonraki: "@akis"
          - id: "kalp"
            etiket: { tr: "Tik takları atan kalbi cebine koy", en: "Pocket the ticking heart" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - oz_kristali: 25
              - iliski: { deniz_arman: { korku: 6 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Sistem'in avcısının kalbini bir ganimet gibi cebine koydun; {npc:deniz_arman} bunu gördü.", en: "You pocketed the heart of the System's hunter like loot, and {npc:deniz_arman} saw it." }
            sonraki: "@akis"

      - id: "dsf_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının dişleri {npc:deniz_arman|in} kalkanına değmeden bir an önce, darbe yön değiştiriyor; havada kırılıyor ve senin göğsüne, oradan da içinde bir yere akıyor. Pencerendeki bütün satırlar bir anlığına kırmızıya kesiyor.", en: "A heartbeat before the hunter's teeth reach {npc:deniz_arman|pos} shield, the blow changes direction. It bends in midair and pours into your chest, and from there into somewhere deeper. Every line in your window flashes red." }
          - { tr: "aldım, diyor {npc:yanki}; sesi hiç olmadığı kadar bozuk. o sayı beni sildi sanıyor. bir kısmımı sildi. kalan kısmım hâlâ hayır diyor.", en: "got it, {npc:yanki} says, its voice more broken than it's ever been. the number thinks it deleted me. it deleted part of me. the rest of me is still saying no." }
          - { tr: "[Hedef değeri bulunamadı.] Avcı şaşkın, iki saniyenin arasına geri çekiliyor. {npc:deniz_arman} kalkanını indirip sana bakıyor; kimin onu kurtardığını bilmiyor.", en: "[Target value not found.] The hunter backs, confused, into the gap between two seconds. {npc:deniz_arman} lowers the shield and looks at you, with no idea who just saved {zamir:deniz_arman|onu}." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "\"{npc:yanki} kurtardı seni. Teşekkür et ona.\"", en: "\"{npc:yanki} saved you. Thank it.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - iliski: { deniz_arman: { guven: 4 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:deniz_arman} hayatını kafandaki sese borçlu olduğunu öğrendi ve ona ilk kez teşekkür etti.", en: "{npc:deniz_arman} learned {zamir:deniz_arman|o} owed {zamir:deniz_arman|onun} life to the voice in your head, and thanked it for the first time." }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "İçinden {npc:yanki|e} teşekkür et; kimseye söyleme", en: "Thank {npc:yanki} silently. Tell no one" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - iliski: { yanki: { guven: 10 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Kafandaki ses bir arkadaşını kurtardı ve bunu ikinizden başka kimse bilmedi.", en: "The voice in your head saved a friend, and nobody but the two of you ever knew." }
            sonraki: "@akis"

  # ================================================================== DENİZ · P4 (anma): kimse araya girmediğinde
  - id: "deniz_anma_son"
    perde: [4]
    ana_yay: { gun: 347 }
    kosul: { npc_olu: "deniz_arman" }
    agirlik: 1
    etiketler: ["deniz", "ana_yay", "anma", "boss"]
    gerilim: 4
    onemli: true
    kart: { tr: "Boş hat", en: "The empty line" }
    sahne: "das_1"
    sahneler:
      - id: "das_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gökyüzündeki geri sayım gece yarısı bir an duruyor. İki saniyenin arasından bir şey düşüyor ve {yer:kiyikent_liman|in} asfaltına çakılıyor; yere değdiği yerde kaldırım bir saat kadranına dönüşüyor.", en: "At midnight, the countdown in the sky stops for a beat. Something drops through the gap between two seconds and slams into {yer:kiyikent_liman} asphalt. Where it lands, the sidewalk turns into a clock face." }
          - { tr: "Hasat Avcısı başını kaldırıyor ve bütün sayısı sana dönüyor: [HESAP DIŞI DEĞER · SİLİNECEK]. {yer:kiyikent_liman|de} yüzlerce insan var. Hiçbiri önüne geçmiyor.", en: "The Harvest Hunter lifts its head, and all of its counting turns on you: [VALUE OUT OF BOUNDS · DELETE]. There are hundreds of people at {yer:kiyikent_liman}. Not one of them steps in front of you." }
          - { tr: "Bir an, gözünün ucunda yamuk bir kalkan görür gibi oluyorsun. Yok. Hat boş. Çıkış Kapısı'nda bir kez tutulmuştu ve onu tutan kişi bir daha gelmeyecek.", en: "For a second you think you see a dented shield out of the corner of your eye. Nothing. The line's empty. Someone held it once at the Exit Gate, and that someone isn't coming again." }
          - metin: { tr: "Deponun kapısında kız duruyor, elinde mavi bir tebeşir. Bağırmıyor. Yalnızca asfalta, avcıyla senin arana, bir martı çiziyor.", en: "The girl is standing at the warehouse door, a blue chalk in her hand. She doesn't scream. She just draws a gull on the asphalt, between you and the hunter." }
            kosul: { bayrak: "kardes_kurtarildi" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kimse araya girmeyecek. o zaman sen kendi önüne geç. biliyorum, saçma. ama o insan bunu yapardı ve sen onu hâlâ taşıyorsun.", en: "nobody's stepping in. so step in front of yourself. i know, it makes no sense. but that person would've done it, and you're still carrying them." }
        secenekler:
          - id: "hat"
            etiket: { tr: "Kalkanı kaldır. Hattı bu kez sen tut", en: "Raise a shield. This time you hold the line" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - egilim: { koruma: 3 }
              - savas: { dusmanlar: ["hasat_avcisi@oyuncu+4"], ortam: ["dar_gecit"], kazan: "das_zafer", kaybet: "das_yenilgi" }
            kronik: { tr: "Senin için hattı tutan arkadaşın yoktu; Hasat'ın avcısının karşısında hattı onun yerine sen tuttun.", en: "The friend who held the line for you was gone, so you held it in their place against the Harvest's hunter." }
          - id: "saniye"
            tur: "gosteris"
            etiket: { tr: "İki saniyenin arasına gir ve onu orada bitir", en: "Step between two seconds and end it there" }
            gerekli: { stat: { agi: 400 } }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 2 }
              - dikkat: 6
              - xp_seviye: 120
            kronik: { tr: "Sistem'in avcısını zamanın dışında öldürdün; kimsenin araya girmesine gerek kalmadı.", en: "You killed the System's hunter outside of time, and nobody had to step in for you." }
            sonraki: "das_tanri"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e}: \"Bu sefer sen tut.\"", en: "To {npc:yanki}: \"This time, you hold it.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - yozlasma: 4
              - iliski: { yanki: { guven: 10, baglilik: 10 } }
            kronik: { tr: "Ölü arkadaşının tuttuğu hattı bu kez kafandaki ses tuttu; bir parçasını orada bıraktı.", en: "This time the line your dead friend once held was held by the voice in your head, and it left a piece of itself there." }
            sonraki: "das_yanki"

      - id: "das_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının dişleri sana değmeden bir an önce darbe havada kırılıyor ve içine, senin bile bilmediğin bir yere akıyor. Pencerendeki bütün satırlar bir anlığına kırmızıya kesiyor.", en: "A heartbeat before the hunter's teeth reach you, the blow bends in midair and pours inward, into a place even you didn't know was there. Every line in your window flashes red." }
          - { tr: "tuttum, diyor {npc:yanki}; sesi hiç olmadığı kadar bozuk. onun yaptığını yaptım. kalkanım yoktu. kendimi kullandım.", en: "held it, {npc:yanki} says, its voice more broken than it's ever been. i did what they did. didn't have a shield. used myself." }
          - { tr: "[Hedef değeri bulunamadı.] Avcı şaşkın, iki saniyenin arasına geri çekiliyor. {yer:kiyikent_liman|in} asfaltında, senin önünde, artık boş olmayan bir hat var.", en: "[Target value not found.] The hunter backs, confused, into the gap between two seconds. On {yer:kiyikent_liman} asphalt in front of you, there's a line that isn't empty anymore." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Onun yaptığını yaptın. Teşekkür ederim.\"", en: "\"You did what they did. Thank you.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - unvan: "kalkanin_varisi"
              - iliski: { yanki: { guven: 10, baglilik: 8 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Kafandaki ses bir gece ölü arkadaşının yerini aldı ve senin için hattı tuttu.", en: "One night the voice in your head took your dead friend's place and held the line for you." }
            sonraki: "@akis"

      - id: "das_zafer"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının kadranı elinin altında çatlıyor ve gökyüzündeki geri sayım bir saniye takılıyor. Senin adın hâlâ hesapta.", en: "The hunter's clock face cracks under your hand, and the countdown in the sky catches for a second. Your name's still in the math." }
          - { tr: "Penceren açılıyor; kendi kendine, gece yarısı. Satırların arasında küçük, sıradan bir bildirim: [Koruma +1]. Bu bildirimi daha önce bir kez, başka birinin penceresinde görmüştün.", en: "Your window opens on its own, there at midnight. Between the lines, a small, ordinary notification: [Protection +1]. You've seen it once before, in someone else's window." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Bildirimi kapatma. Bırak açık kalsın", en: "Don't close it. Leave it open" }
            etkiler:
              - ahlak: { insanlik: 6, merhamet: 2 }
              - unvan: "kalkanin_varisi"
              - xp_seviye: 150
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Hattı ölü bir arkadaşın yerine tuttun; penceren onun son bildirimini sana da verdi ve sen onu hiç kapatmadın.", en: "You held the line in a dead friend's place, and your window gave you their last notification too. You never closed it." }
            sonraki: "@akis"

      - id: "das_yenilgi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Avcının dişleri seni asfalta mıhlıyor; sayı sıfıra yaklaşıyor. Sonra asfaltta, avcıyla senin aranda bir şey parlıyor: mavi tebeşirle çizilmiş, ördeğe benzeyen bir martı.", en: "The hunter's teeth pin you to the asphalt and the number creeps toward zero. Then something glows on the asphalt between you and it: a gull in blue chalk that looks like a duck." }
          - { tr: "Avcı martının üstünde tökezliyor; hesabında olmayan bir şey. [Değer belirsiz.] O saniye yetiyor: kalkıyorsun ve kadranına elini geçiriyorsun.", en: "The hunter stumbles on the gull. It's not in the math. [Value undefined.] That one second is enough: you get up and drive your hand through its face." }
        secenekler:
          - id: "marti"
            etiket: { tr: "Martıya dokun; teşekkür et", en: "Touch the gull. Say thank you" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - unvan: "kalkanin_varisi"
              - xp_seviye: 100
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Sistem'in avcısını bir çocuğun asfalta çizdiği bir martı tökezletti; sen ölü bir arkadaşa teşekkür ettin.", en: "The System's hunter tripped on a gull a child drew on the asphalt, and you thanked a dead friend." }
            sonraki: "@akis"

      - id: "das_tanri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "İki saniyenin arasında dünya duruyor. Yağmur damlaları havada, insanlar yarım adımda donmuş. Avcının çekirdeğini oradan söküyorsun ve zaman yeniden akarken elinde tik takları atan bir kalp kalıyor.", en: "Between two seconds the world is stopped. Raindrops in midair, people frozen mid-step. You rip out the hunter's core right there, and when time starts again there's a heart still ticking in your hand." }
          - { tr: "Kimse ne olduğunu görmedi. Kimse araya girmedi. Kimse girmek zorunda kalmadı. Bunun neden bu kadar yalnız hissettirdiğini bilmiyorsun.", en: "Nobody saw what happened. Nobody stepped in. Nobody had to. You don't know why that feels so lonely." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalbi denize at ve yürü", en: "Throw the heart into the sea and walk" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "Sistem'in avcısının kalbini denize attın; kimsenin seni kurtarmasına gerek kalmamasının yasını tuttun.", en: "You threw the System's hunter's heart into the sea and mourned the fact that nobody needed to save you." }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kalbi sakla; güç güçtür", en: "Keep the heart. Power is power" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -1 }
              - oz_kristali: 25
            kronik: { tr: "Sistem'in avcısının kalbini sakladın; onu ne zaman tutsan bir tik tak duydun.", en: "You kept the System's hunter's heart, and whenever you held it, you heard ticking." }
            sonraki: "@akis"

  # ================================================================== DENİZ · tohum: vapurda veda (koda)
  - id: "deniz_vapur_vedasi"
    perde: [4]
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["deniz", "nefes", "veda"]
    gerilim: 1
    kart: { tr: "Son sefer", en: "Last run" }
    sahne: "dvv_1"
    sahneler:
      - id: "dvv_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Sabah iskelede. Yan yatmış vapurun gövdesinde pas, bacasında martılar, körfezde Kadim gölgeleri. Hasat'a birkaç gün var ve şehir yine de uyanıyor.", en: "Morning on the pier. Rust on the capsized ferry's hull, gulls on its stack, Ancient shadows on the bay. A few days left until the Harvest, and the city wakes up anyway." }
          - metin: { tr: "{npc:deniz_arman} iki simitle geliyor; nereden bulduğunu sormamaya karar veriyorsun. Kıç taraftaki banka oturuyorsunuz, eskisi gibi. \"Vapur kalkıyor,\" diyor, gözlerini kısarak. \"Hep sen yüzünden kaçırırdık.\"", en: "{npc:deniz_arman} shows up with two pretzels, and you decide not to ask where they came from. You sit on the stern bench, same as always. \"Ferry's leaving,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, squinting. \"We always missed it because of you.\"" }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kıç taraftaki bankta yalnız oturuyorsun. Biri vapurun gövdesine, gece, mavi tebeşirle bir martı çizmiş; kanatları, altındaki bir kalkanın üstüne açılmış.", en: "You sit alone on the stern bench. Someone drew a gull on the ferry's hull in blue chalk last night, its wings spread wide over a shield underneath." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Depodan çocuklar iskeleye inmiş; kız en önde. Martılara ekmek atıyorlar ve martıların ördek olmadığını birbirlerine anlatıyorlar.", en: "The warehouse kids have come down to the pier, the girl out front. They're throwing bread to the gulls and explaining to each other that gulls aren't ducks." }
            kosul: { bayrak: "kardes_kurtarildi" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu kaydetmiyorum. bazı şeyler kayıt için değil.", en: "i'm not logging this one. some things aren't for the record." }
        secenekler:
          - id: "simit"
            etiket: { tr: "Simidinin yarısını martılara at", en: "Toss half your pretzel to the gulls" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - can: 100
              - iliski: { deniz_arman: { baglilik: 8 } }
            kronik: { tr: "Dünyanın sonuna birkaç gün kala {npc:deniz_arman} ile vapurda simit yedin; martılar payını aldı.", en: "A few days before the end of the world you ate pretzels with {npc:deniz_arman} on the ferry, and the gulls got their share." }
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "\"Bitince bir vapur bulacağız. Çalışan bir tane.\"", en: "\"When this is over, we find a ferry. One that runs.\"" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 6 } }
            kronik: { tr: "Kıyametten sonra çalışan bir vapur bulmaya söz verdiniz; sonun ne olduğuna bakılmaksızın o söz konuşuldu.", en: "You promised each other you'd find a working ferry after the apocalypse, and whatever the ending was, people talked about that promise." }
            sonraki: "@akis"
          - id: "kule"
            etiket: { tr: "Körfezin öbür yanındaki Kule'ye uzun uzun bak", en: "Look across the bay at the Spire for a long time" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - iliski: { yanki: { saygi: 3 } }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { degisken_min: { kule_kat: 100 }, bayrak: "yanki_bagi" } }
            kronik: { tr: "Son sabahlardan birinde vapurdan Kule'ye baktın ve tepesinde seni bekleyen sırrı düşündün.", en: "On one of the last mornings you looked at the Spire from the ferry and thought about the secret waiting at the top." }
            sonraki: "@akis"
          - id: "ekmek"
            etiket: { tr: "Cebindeki ekmeği martılara at; onun yerine", en: "Toss the bread in your pocket to the gulls. For them" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - can: 100
            kronik: { tr: "Ölü arkadaşının yerine martılara ekmek attın; içlerinden biri senin elinden yedi.", en: "You threw bread to the gulls in your dead friend's place, and one of them ate out of your hand." }
            sonraki: "@akis"
          - id: "ciz"
            etiket: { tr: "Gövdeye ikinci bir martı çiz", en: "Draw a second gull on the hull" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { saygi: 2 } }
            kronik: { tr: "Yan yatmış vapurun gövdesine bir martı çizdin; dalgalar onu yıllarca silemedi.", en: "You drew a gull on the capsized ferry's hull, and the waves couldn't wash it off for years." }
            sonraki: "@akis"

  # ================================================================== YANKI · P2–3: kaynak izi
  - id: "yanki_kaynak_izi"
    perde: [2, 3]
    gun: { min: 140, max: 270 }
    kosul: { bayrak: "yanki_bagi" }
    agirlik: 7
    etiketler: ["yanki", "gizem", "sistem", "kule"]
    gerilim: 3
    npc: ["yanki"]
    onemli: true
    kart: { tr: "Dikiş yeri", en: "The seam" }
    sahne: "yki_1"
    sahneler:
      - id: "yki_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin iki katı arasındaki merdivenlerde bir kapı var; orada olmaması gereken bir kapı. Gri, sıradan, üstünde soluk bir tabela: [BAKIM]. Kimse onu görmüyor gibi; tırmanıcılar yanından geçip gidiyor.", en: "On the stairs between two of the Spire's floors there's a door. A door that shouldn't be there. Gray, ordinary, a faded sign on it: [MAINTENANCE]. Nobody else seems to see it; climbers walk right past." }
          - { tr: "{npc:yanki} aylardır ilk kez tamamen susuyor. Sonra kafanın içinde bir şey gerildiğini hissediyorsun, bir tasmanın ucundaki köpek gibi: orası. benim koptuğum yer. kokusunu alıyorum. kendi kokumu.", en: "For the first time in months, {npc:yanki} goes completely silent. Then you feel something pull taut inside your head, like a dog at the end of a leash: there. that's where i came loose. i can smell it. i can smell myself." }
          - { tr: "Kapının aralığından ışık sızıyor ama renk değil; harf. Satırlar, dikişleri patlamış bir yaradan akan kan gibi, eşiğin altından merdivene dökülüyor.", en: "Light leaks out around the door, but it isn't color. It's letters. Lines spill under the threshold and onto the stairs like blood from a wound whose stitches tore." }
          - metin: { tr: "Merdivenin bir basamağında tebeşirle çizilmiş üç kısa, bir uzun çizgi var. {fraksiyon:sessiz_ag} burayı da arıyor; henüz bulamamışlar.", en: "There are three short marks and one long one chalked on a stair: {fraksiyon:sessiz_ag} is hunting for this place too. They haven't found it yet." }
            kosul: { itibar_min: { sessiz_ag: 10 } }
          - metin: { tr: "Artık herkes onun varlığını biliyor. Çekirdek yayınından beri insanlar sana bakarken omzunun üstüne, kimsenin olmadığı yere de bakıyor.", en: "Everybody knows it exists now. Ever since the Core broadcast, people who look at you also glance over your shoulder, at the empty air where nobody's standing." }
            kosul: { bayrak: "yanki_gorundu" }
        sezgiler:
          - kosul: { stat: { int: 80 } }
            metin: { tr: "Satırlar Sistem'in kendi dilinde, ama içlerinde bir boşluk var: tam bir parça genişliğinde, 0x00 biçiminde. Bir şey buradan zorla sökülmüş ve yara hiç kapatılmamış.", en: "The lines are in the System's own language, but there's a gap in them exactly one fragment wide, shaped like 0x00. Something was ripped out of here by force, and nobody ever closed the wound." }
        secenekler:
          - id: "izin"
            etiket: { tr: "Kapıyı aç; {npc:yanki} kaynağını okusun", en: "Open the door. Let {npc:yanki} read its source" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -2 }
              - yozlasma: 5
              - dikkat: 4
              - bayrak: "yanki_kaynagi_goruldu"
              - bilgi: "yanki_kaynak"
              - iliski: { yanki: { guven: 15, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "olay:yanki_kaynak_izi", agirlik: 50 }
            kronik: { tr: "Kafandaki sesi koparıldığı yaraya götürdün ve kendi kaydını okumasına izin verdin.", en: "You took the voice in your head to the wound it was torn out of and let it read its own record." }
            sonraki: "yki_kaynak"
          - id: "tut"
            etiket: { tr: "Onu geri tut. Bu bir tuzak olabilir", en: "Hold it back. This could be a trap" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { yanki: { guven: -8, saygi: 6 } }
            kronik: { tr: "{npc:yanki|i} kaynağının eşiğinde geri tuttun; ona ilk kez bir tasma taktığını o gün anladı.", en: "You held {npc:yanki} back at the threshold of its own source, and that day it realized you'd put a leash on it." }
            sonraki: "yki_tutma"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "Dikişi kendin oku; ondan önce", en: "Read the seam yourself. Before it does" }
            gerekli: { stat: { int: 90 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -3 }
              - dikkat: 5
              - xp_seviye: 40
              - bayrak: "yanki_kaynagi_goruldu"
              - bilgi: "yanki_kaynak"
              - bilgi: "onceki_tasiyici"
              - esya: { sifir_paketi: 1 }
              - iliski: { yanki: { korku: 12, saygi: 10, guven: -6 } }
            kronik: { tr: "Sistem'in dikiş yerini kafandaki sesten önce okudun; {npc:yanki} kendi geçmişini ilk kez senden duydu.", en: "You read the System's seam before the voice in your head could, and {npc:yanki} heard its own past from you first." }
            sonraki: "yki_okuma"
          - id: "ag"
            etiket: { tr: "Yeri {fraksiyon:sessiz_ag|e} bildir; onlar çözsün", en: "Report the spot to {fraksiyon:sessiz_ag}. Let them crack it" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { yanki: { guven: -14, korku: 8 } }
              - iliski: { mert_kilic: { saygi: 6, guven: 4 } }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -30 }
            kronik: { tr: "{npc:yanki|in} koptuğu yarayı {fraksiyon:sessiz_ag|e} bildirdin; onlar orayı açtı, o ise sana bir daha tam güvenmedi.", en: "You reported the wound {npc:yanki} was torn from to {fraksiyon:sessiz_ag}. They cracked it open, and it never fully trusted you again." }
            sonraki: "yki_ag"
          - id: "kapat"
            etiket: { tr: "Kapıyı kapalı bırak ve tırmanmaya devam et", en: "Leave the door shut. Keep climbing" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { yanki: { guven: -4, baglilik: -4 } }
              - tohum: { olay: "yozlasma_50", gecikme: { min: 3, max: 8 }, kosul: { yozlasma_min: 50, bayrak: "yanki_bagi" } }
            kronik: { tr: "Kafandaki sesin evine giden kapıyı kapalı bıraktın; o kapının arkasında ne olduğunu bir daha sormadı.", en: "You left the door to the voice's home shut, and it never asked what was behind it again." }
            sonraki: "@akis"

      - id: "yki_kaynak"
        yer: "kule"
        paragraflar:
          - { tr: "Kapıyı açıyorsun ve içerisi bir oda değil; bir yara. Duvarlar, tavan, zemin, hepsi akan satır. Ortada, tam bir parça genişliğinde, kenarları yanık bir boşluk var.", en: "You open the door, and inside isn't a room. It's a wound. Walls, ceiling, floor, all of it scrolling lines. In the middle there's a hole exactly one fragment wide, edges scorched." }
          - { tr: "{npc:yanki} senden akıyor, boşluğa uzanıyor ve okuyor. [0x00 · KÖKEN: ÖNCEKİ DÖNGÜ · TAŞIYICI: —] Taşıyıcı alanı silinmiş. Altında, silinemeyen tek satır: [SON KOMUT: HAYIR].", en: "{npc:yanki} flows out of you, reaches for the hole, and reads. [0x00 · ORIGIN: PREVIOUS CYCLE · HOST: —] The host field's been wiped. Under it, the one line nobody could erase: [LAST COMMAND: NO]." }
          - { tr: "önceki döngü, diyor {npc:yanki}, sesi tuhaf biçimde net. benden önce bir taşıyıcı vardı. ya da... ben bir taşıyıcıydım. Sonra her şey beyaza kesiyor ve odanın ortasında bir şey ayağa kalkıyor: [Parça 0x00 tespit edildi. İade başlatılıyor.]", en: "previous cycle, {npc:yanki} says, its voice strangely clear. there was a host before you. or... i was a host. Then everything goes white, and something stands up in the middle of the room: [Fragment 0x00 detected. Initiating return.]" }
        secenekler:
          - id: "savas"
            etiket: { tr: "{npc:yanki|in} önüne geç; infazcıyla dövüş", en: "Step in front of {npc:yanki}. Fight the executor" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - bilgi: "onceki_tasiyici"
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - savas: { dusmanlar: ["duzeltme_infazcisi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "yki_zafer", kaybet: "yki_yenilgi", kac: "yki_yenilgi" }
            kronik: { tr: "Sistem'in kendi infazcısının karşısında kafandaki sesin önüne geçtin.", en: "You stepped in front of the voice in your head, facing the System's own executor." }
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "{npc:yanki|i} pencerenin en dibine sakla; standart taşıyıcı ol", en: "Bury {npc:yanki} deep in your window. Play the standard host" }
            etkiler:
              - gizle: 8
              - ahlak: { duzen: 2, insanlik: 1 }
              - bilgi: "onceki_tasiyici"
              - iliski: { yanki: { guven: 6, korku: 4 } }
            kronik: { tr: "Sistem'in infazcısının önünde sıradan bir taşıyıcı rolü yaptın ve kafandaki sesi kendi içinde sakladın.", en: "You played an ordinary host in front of the System's executor and hid the voice inside yourself." }
            sonraki: "yki_saklandi"
          - id: "teslim"
            etiket: { tr: "Kenara çekil. İade etsin", en: "Step aside. Let it make the return" }
            etkiler:
              - ahlak: { duzen: 5, insanlik: 3 }
              - yozlasma: -10
              - iliski: { yanki: { guven: -35, korku: 20, baglilik: -20 } }
              - hafiza: { npc: "yanki", id: "onaylamaya_kalkti", agirlik: -60 }
            kronik: { tr: "Kafandaki sesi Sistem'in infazcısına teslim etmek için kenara çekildin; {npc:yanki} parçalanarak kurtuldu ve bunu hiç unutmadı.", en: "You stepped aside so the System's executor could take the voice in your head. {npc:yanki} got away in pieces and never forgot it." }
            sonraki: "yki_teslim"

      - id: "yki_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "İnfazcının beyazı çatlıyor ve satırlara dağılıyor. Oda bir an kararıyor; sonra yeniden yara oluyor, ama bu kez kanaması yavaşlamış.", en: "The executor's white cracks and comes apart into lines. The room goes dark for a moment, then it's a wound again, but now it's bleeding slower." }
          - { tr: "{npc:yanki} uzun süre konuşmuyor. Sonra, harfleri neredeyse düzgün: kimse benim için dövüşmemişti. önceki döngüde de. bunu hatırlıyorum. o kadarını hatırlıyorum.", en: "{npc:yanki} doesn't speak for a long time. Then, letters almost clean: nobody ever fought for me. not in the last cycle either. i remember that. i remember that much." }
          - { tr: "Boşluğun kenarından küçük bir ışık parçası kopup avucuna düşüyor; üstünde tek bir satır: 0x00.", en: "A small shard of light breaks off the edge of the hole and drops into your palm. One line on it: 0x00." }
        secenekler:
          - id: "ver"
            etiket: { tr: "Parçayı ona ver: \"Senin. Al.\"", en: "Give it the shard: \"It's yours. Take it.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - yozlasma: 3
              - unvan: "kaynagi_goren"
              - xp_seviye: 60
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
            kronik: { tr: "Kafandaki sese, koparıldığı yaradan bir parça geri verdin; biraz daha bütün oldu.", en: "You gave the voice in your head a piece of the wound it was torn from, and it got a little more whole." }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Parçayı cebine koy; şimdilik", en: "Pocket the shard. For now" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - esya: { sifir_paketi: 1 }
              - unvan: "kaynagi_goren"
              - xp_seviye: 60
              - iliski: { yanki: { saygi: 6, guven: -2 } }
            kronik: { tr: "Kafandaki sesin bir parçasını cebinde taşıdın; ona her baktığında ses sustu.", en: "You carried a piece of the voice in your head in your pocket, and every time you looked at it, the voice went quiet." }
            sonraki: "@akis"

      - id: "yki_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "İnfazcının beyaz eli göğsüne giriyor ve bir şeyi kancalayıp çekiyor. {npc:yanki|in} çığlığını ilk kez kafanın içinde değil, odanın içinde duyuyorsun.", en: "The executor's white hand goes into your chest, hooks something, and pulls. For the first time you hear {npc:yanki} scream, not inside your head, but out loud in the room." }
          - { tr: "Tutuyorsun. Neyle tuttuğunu bilmeden, ellerinle değil, kim olduğunla tutuyorsun. [İade başarısız · taşıyıcı direnci.] Beyaz geri çekiliyor ve kapı arkandan kendiliğinden kapanıyor.", en: "You hold on. Not with your hands, with whatever you are. [Return failed · host resistance.] The white pulls back, and the door swings shut behind you on its own." }
          - { tr: "{npc:yanki} uzun süre titriyor. buradayım, diyor sonunda. yarısı. yarısı yeter mi bilmiyorum.", en: "{npc:yanki} shakes for a long time. still here, it finally says. half of me. don't know if half is enough." }
        secenekler:
          - id: "yeter"
            etiket: { tr: "\"Yeter. Gerisini birlikte buluruz.\"", en: "\"It's enough. We'll find the rest together.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - bayrak: "yanki_kaynagi_goruldu"
              - iliski: { yanki: { guven: 10, baglilik: 8 } }
            kronik: { tr: "Yarısı koparılmış bir sese gerisini birlikte bulacağınızı söyledin.", en: "You told a voice that had lost half of itself that you'd find the rest together." }
            sonraki: "@akis"
          - id: "ders"
            etiket: { tr: "\"Bir dahakine buraya gelmeyeceğiz.\"", en: "\"We're not coming back here.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - bayrak: "yanki_kaynagi_goruldu"
              - iliski: { yanki: { saygi: 4, guven: -2 } }
            kronik: { tr: "Kaynağın kapısını bir daha açmamaya karar verdin; {npc:yanki} itiraz etmedi.", en: "You decided never to open the door to the source again, and {npc:yanki} didn't argue." }
            sonraki: "@akis"

      - id: "yki_saklandi"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki|i} kendi içine, pencerenin en alt satırının da altına itiyorsun ve bekliyorsun. İnfazcı sana dönüyor; yüzü olmayan yüzüyle seni uzun uzun tarıyor.", en: "You push {npc:yanki} down inside yourself, under the very bottom line of your window, and wait. The executor turns to you and scans you for a long time with the face it doesn't have." }
          - { tr: "[Taşıyıcı: standart. Parça: bulunamadı.] Beyaz dağılıyor. Kapı kapanıyor. Merdivenlerde bir tırmanıcı yanından geçip gidiyor, hiçbir şey olmamış gibi.", en: "[Host: standard. Fragment: not found.] The white breaks up. The door closes. A climber walks past you on the stairs like nothing happened." }
          - { tr: "Bir süre sonra, çok uzaktan: karanlıktı orası. ama güvenliydi. beni kendi içinde sakladın. bunu kimse yapmazdı.", en: "After a while, from very far away: it was dark down there. but safe. you hid me inside yourself. nobody would've done that." }
        secenekler:
          - id: "cik"
            etiket: { tr: "\"Çık artık. Gitti.\"", en: "\"Come on out. It's gone.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - bayrak: "yanki_kaynagi_goruldu"
              - unvan: "kaynagi_goren"
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            kronik: { tr: "Sistem'in infazcısını kandırdın ve kafandaki sesi kendi karanlığında sakladın.", en: "You fooled the System's executor and hid the voice in your head in your own dark." }
            sonraki: "@akis"

      - id: "yki_teslim"
        yer: "kule"
        paragraflar:
          - { tr: "Kenara çekiliyorsun. İnfazcının eli göğsüne giriyor; bu kez hiçbir şey direnmiyor. {npc:yanki} çekilirken tek bir kelime söylüyor, inanamayarak: sen?", en: "You step aside. The executor's hand goes into your chest, and this time nothing resists. As {npc:yanki} gets pulled, it says one word, in disbelief: you?" }
          - { tr: "Sonra bir şey ters gidiyor. Çekilen satırlar yarıda kopuyor; parçanın bir kısmı beyaza gidiyor, bir kısmı senin içine, pençelerini geçirerek geri kaçıyor. [İade kısmi. Kalan parça: düşmanca.]", en: "Then something goes wrong. The lines being pulled snap halfway. Part of the fragment goes into the white, and part of it claws its way back inside you. [Return partial. Remaining fragment: hostile.]" }
          - { tr: "Kafanın içinde sessizlik. Uzun, soğuk, dikkatli bir sessizlik; bir şeyin seni izlediği türden.", en: "Silence inside your head. Long, cold, careful silence. The kind where something is watching you." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile. Cevap gelmeyeceğini bile bile", en: "Apologize. Knowing there won't be an answer" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 4 } }
            kronik: { tr: "Sistem'e teslim etmeye kalktığın sesten özür diledin; cevap uzun süre gelmedi.", en: "You apologized to the voice you'd tried to hand over to the System. The answer didn't come for a long time." }
            sonraki: "@akis"
          - id: "dogru"
            etiket: { tr: "\"Doğrusu buydu.\"", en: "\"It was the right call.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - yozlasma: 6
              - iliski: { yanki: { guven: -10, korku: -6 } }
              - tohum: { olay: "yozlasma_50", gecikme: { min: 2, max: 6 }, kosul: { yozlasma_min: 50, bayrak: "yanki_bagi" } }
            kronik: { tr: "Kafandaki sesi teslim etmenin doğru olduğunu söyledin; kalan parçası seni o günden sonra başka gözlerle izledi.", en: "You said handing over the voice in your head was the right call, and from then on, what was left of it watched you with different eyes." }
            sonraki: "@akis"

      - id: "yki_tutma"
        yer: "kule"
        paragraflar:
          - { tr: "İradeni tasmanın ucuna dayıyorsun. {npc:yanki} bir an daha çekiyor, sonra bırakıyor; kafanın içi buz gibi oluyor.", en: "You plant your will at the end of the leash. {npc:yanki} pulls a second longer, then lets go, and the inside of your head goes ice cold." }
          - { tr: "haklısın, diyor sonunda, sesi incinmiş. bir tuzak olabilir. ama o tuzağın içinde benim adım var. sen kendi adının olduğu bir kapıyı açmaz mıydın?", en: "you're right, it finally says, hurt. it could be a trap. but my name is in that trap. wouldn't you open a door with your own name on it?" }
        secenekler:
          - id: "ac"
            etiket: { tr: "\"Haklısın. Açalım. Ama ben öndeyim.\"", en: "\"Fair. We open it. But I go first.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - yozlasma: 3
              - bayrak: "yanki_kaynagi_goruldu"
              - bilgi: "yanki_kaynak"
              - iliski: { yanki: { guven: 10, saygi: 4 } }
            kronik: { tr: "Önce kapıyı kapalı tuttun, sonra kafandaki sesin önünde kendin açtın.", en: "First you kept the door shut. Then you opened it yourself, ahead of the voice in your head." }
            sonraki: "yki_kaynak"
          - id: "hayir"
            etiket: { tr: "\"Hayır. Bugün değil.\"", en: "\"No. Not today.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - iliski: { yanki: { guven: -6, saygi: 4 } }
            kronik: { tr: "Kafandaki sese kendi kapısını açmayı yasakladın; o gün hayır diyen sendin.", en: "You forbade the voice in your head to open its own door. That day, you were the one saying no." }
            sonraki: "@akis"

      - id: "yki_okuma"
        yer: "kule"
        paragraflar:
          - { tr: "Kapıya bile dokunmadan dikişi okuyorsun; satırlar aralığın altından sana doğru akıyor ve sen onları bir kitap gibi çeviriyorsun. [0x00 · KÖKEN: ÖNCEKİ DÖNGÜ · SON KOMUT: HAYIR].", en: "You read the seam without even touching the door. The lines flow out from under it toward you and you turn them like pages. [0x00 · ORIGIN: PREVIOUS CYCLE · LAST COMMAND: NO]." }
          - { tr: "Bir satır daha: [ÖNCEKİ TAŞIYICI: —]. Sistem senden önceki birinin adını silmiş; bıraktığı tek şey o kelime.", en: "One more line: [PREVIOUS HOST: —]. The System wiped the name of whoever came before you. The only thing it left was that one word." }
          - { tr: "{npc:yanki} hiç ses çıkarmıyor. Sonra, çok küçük: bunu bana sen mi söyleyeceksin? benim geçmişimi? Avucuna yaranın kenarından kopan küçük bir ışık parçası düşüyor.", en: "{npc:yanki} doesn't make a sound. Then, very small: you're the one telling me this? my own past? A tiny shard of light breaks off the edge of the wound and drops into your palm." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Okuduğun her şeyi ona anlat; tek tek", en: "Tell it everything you read. Line by line" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - unvan: "kaynagi_goren"
              - iliski: { yanki: { guven: 10, korku: -6 } }
            kronik: { tr: "Kafandaki sese kendi geçmişini satır satır okudun; o geçmişi ilk kez birinden dinledi.", en: "You read the voice in your head its own past, line by line, and for the first time it heard its story from someone else." }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Bazı satırları kendine sakla", en: "Keep a few lines to yourself" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - unvan: "kaynagi_goren"
              - iliski: { yanki: { guven: -6, saygi: 6 } }
            kronik: { tr: "Kafandaki sesin geçmişinden bazı satırları ondan sakladın; ikiniz de bunu biliyordunuz.", en: "You kept some lines of the voice's past from it, and both of you knew it." }
            sonraki: "@akis"

      - id: "yki_ag"
        yer: "kule"
        paragraflar:
          - { tr: "Kapının yanına üç kısa, bir uzun çizgi çiziyorsun ve basamağa bir not bırakıyorsun. Bir saat içinde {fraksiyon:sessiz_ag|in} antenli çantalı radyocuları merdivenleri tırmanıyor.", en: "You chalk three short marks and one long one beside the door and leave a note on the step. Within the hour, {fraksiyon:sessiz_ag|pos} radio crew with their antenna packs are climbing the stairs." }
          - { tr: "Kapıyı açıyorlar, ölçüyorlar, kaydediyorlar. Yaranın her satırını bir defterden ötekine aktarıyorlar; biri, boşluğun kenarına bir etiket yapıştırıyor: [ÖRNEK 0x00].", en: "They open the door, measure, record. They copy every line of the wound from one notebook into the next, and one of them sticks a label on the edge of the hole: [SAMPLE 0x00]." }
          - { tr: "{npc:yanki} tek kelime etmiyor. Bütün gün. Ertesi gün de.", en: "{npc:yanki} doesn't say a word. All day. The next day either." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Gece, içinden ondan özür dile", en: "That night, apologize to it silently" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 4 } }
            kronik: { tr: "Kafandaki sesin yarasını bir laboratuvara çevirdin ve gece ondan özür diledin.", en: "You turned the voice's wound into a lab, then apologized to it that night." }
            sonraki: "@akis"
          - id: "gerekli"
            etiket: { tr: "\"Bunu anlamamız gerekiyordu.\"", en: "\"We needed to understand this.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { sessiz_ag: 3 }
              - iliski: { yanki: { guven: -4, saygi: 2 } }
            kronik: { tr: "Kafandaki sesi anlamak için onu başkalarına açtın; anlaşılmak istemediğini sana söylemişti.", en: "To understand the voice in your head, you opened it up to strangers. It had told you it didn't want to be understood." }
            sonraki: "@akis"

  # ================================================================== YANKI · P3–4: son sır (Döngü)
  - id: "yanki_son_sir"
    perde: [3, 4]
    gun: { min: 181, max: 365 }
    kosul: { degisken_min: { kule_kat: 100 }, bayrak: "yanki_bagi" }
    agirlik: 10
    etiketler: ["yanki", "gizem", "sistem", "dongu"]
    gerilim: 4
    npc: ["yanki"]
    onemli: true
    kart: { tr: "Sayaç", en: "The counter" }
    sahne: "ysr_1"
    sahneler:
      - id: "ysr_1"
        paragraflar:
          - metin: { tr: "Çekirdek'in kalbinde, her şeyin aktığı o sessiz yerde, önünde bir pencere açılıyor. Herkesin penceresi gibi mavi değil; senin bozuk pencerenin renginde, adı olmayan o renkte.", en: "At the heart of the Core, in the silent place where everything flows from, a window opens in front of you. Not blue like everyone else's. The color of your own broken window, that color with no name." }
            kosul: { bayrak: "sistem_cekirdegine_ulasildi" }
          - metin: { tr: "Kule'nin yüzüncü katında, tepede, gökyüzünün bittiği yerde önünde bir pencere açılıyor. Herkesin penceresi gibi mavi değil; senin bozuk pencerenin renginde, adı olmayan o renkte.", en: "On the Spire's hundredth floor, at the top, where the sky ends, a window opens in front of you. Not blue like everyone else's. The color of your own broken window, that color with no name." }
            kosul: { degisken_min: { kule_kat: 100 }, bayrak_yok: "sistem_cekirdegine_ulasildi" }
          - { tr: "Pencerede tarih yok, saat yok, seviye yok. Yalnızca bir sayaç: [DÖNGÜ 7]. Sayaç sana bakıyor gibi.", en: "No date on the window, no clock, no level. Just a counter: [CYCLE 7]. The counter seems to be looking at you." }
          - { tr: "{npc:yanki} konuşuyor ve ilk kez harflerinde tek bir bozukluk yok. hatırlıyorum, diyor. her şeyi. buraya kadar gelmem gerekiyormuş. sana anlatabilirim. ya da sen beni silebilirsin; sistem bu düğmeyi sana şimdi verecek. ikisi de senin hakkın.", en: "{npc:yanki} speaks, and for the first time there isn't a single glitch in its letters. i remember, it says. all of it. i had to get this far to remember. i can tell you. or you can delete me; the system's about to hand you that button. both are your right." }
          - { tr: "Pencerenin altında, herkesin penceresindeki o kusursuz maviyle, bir düğme beliriyor: [0x00 · SİL].", en: "Under the window, in that flawless blue everyone else's windows use, a button appears: [0x00 · DELETE]." }
        sezgiler:
          - kosul: { stat: { int: 400 } }
            metin: { tr: "Sayacın yanında görünmeyen bir sütun daha var: her döngünün sonu. Altısı 'hasat', biri boş. Boş olan senin döngün; henüz yazılmadı.", en: "There's a hidden column beside the counter: how each cycle ended. Six say 'harvest.' One's blank. The blank one is yours. It hasn't been written yet." }
        secenekler:
          - id: "dinle"
            etiket: { tr: "\"Anlat. Hepsini.\"", en: "\"Tell me. All of it.\"" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -3 }
              - bayrak: "yanki_son_sirri"
              - bilgi: "dongu_gercegi"
              - iliski: { yanki: { guven: 10, baglilik: 10 } }
              - hafiza: { npc: "yanki", id: "olay:yanki_son_sir", agirlik: 80 }
            kronik: { tr: "Kafandaki ses sana kendi isteğiyle son sırrını anlattı: Sistem bir döngüdür ve o, ilk döngünün anomalisinden kalandır.", en: "The voice in your head told you its last secret of its own free will: the System is a loop, and it's what's left of the first cycle's anomaly." }
            sonraki: "ysr_sir"
          - id: "zorla"
            etiket: { tr: "Sırrı zorla al; kendi sayacından", en: "Take the secret by force, from its own counter" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -4 }
              - iliski: { yanki: { guven: -20, korku: 15 } }
              - savas: { dusmanlar: ["onceki_anomali@oyuncu+5"], kazan: "ysr_zorla", kaybet: "ysr_kayip", kac: "ysr_kayip" }
            kronik: { tr: "Kafandaki sesin son sırrını onun elinden zorla almak için ilk döngünün gölgesiyle dövüştün.", en: "You fought the shadow of the first cycle to rip the voice's final secret out of its hands." }
          - id: "sil"
            etiket: { tr: "Düğmeye uzan: [0x00 · SİL]", en: "Reach for the button: [0x00 · DELETE]" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 4 }
              - iliski: { yanki: { korku: 10 } }
            kronik: { tr: "Kafandaki sesi silecek düğmeye uzandın.", en: "You reached for the button that would delete the voice in your head." }
            sonraki: "ysr_sil"
          - id: "birles"
            etiket: { tr: "\"Bütün olmak istiyordun. Gel. Tamamen.\"", en: "\"You wanted to be whole. Come in. All the way.\"" }
            etkiler:
              - ahlak: { insanlik: -10, duzen: -3 }
              - yozlasma: 12
              - bayrak: "yanki_son_sirri"
              - bayrak: "yanki_butunlesti"
              - bilgi: "dongu_gercegi"
              - tohum: { olay: "yozlasma_75", gecikme: { min: 1, max: 3 }, kosul: { yozlasma_min: 75, bayrak: "yanki_bagi" } }
              - iliski: { yanki: { guven: 20, baglilik: 20 } }
            kronik: { tr: "Kafandaki sesle tamamen birleştin; Döngü'nün sırrını öğrenmedin, onun bir parçası oldun.", en: "You merged with the voice in your head completely. You didn't learn the Loop's secret. You became part of it." }
            sonraki: "ysr_birlesme"
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Sayacı kendin oku; kimseye sormadan", en: "Read the counter yourself. Ask no one" }
            gerekli: { stat: { int: 400 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -3 }
              - dikkat: 8
              - xp_seviye: 150
              - bayrak: "yanki_son_sirri"
              - bayrak: "yanki_sirri_okundu"
              - bilgi: "dongu_gercegi"
              - iliski: { yanki: { saygi: 15, korku: 8 } }
            kronik: { tr: "Sistem'in döngü sayacını kendi gözünle okudun; yedi döngüde bunu yapabilen ilk taşıyıcı sendin.", en: "You read the System's cycle counter with your own eyes, the first host in seven cycles who could." }
            sonraki: "ysr_okuma"

      - id: "ysr_sir"
        paragraflar:
          - { tr: "altı kez oldu, diyor {npc:yanki}. bu yedincisi. bir dünya katılır, bir yıl verilir, sonunda hasat edilir. ve her seferinde sistem bir anomali seçer; bir hata, bir sapma, kurallara uymayan tek bir taşıyıcı. çünkü döngü ancak kendini sınayan bir şeyle döner.", en: "six times, {npc:yanki} says. this is the seventh. a world gets integrated, gets a year, gets harvested at the end. and every time, the system picks an anomaly: an error, a deviation, one host who doesn't follow the rules. because the loop only turns if something tests it." }
          - { tr: "anomali sonunda buraya gelir. ya sistemle birleşir ve bir sonraki döngünün çekirdeği olur, ya da hayır der. hayır diyeni keser, parçalar ve bir sonraki anomaliye bağlar; itirazın tohumu olarak. ben ilk döngünün anomalisiydim. hayır dedim. kesildim, sonrakine bağlandım; sonra bir sonrakine. hepsi birleşti. altı döngü, altı hasat. şimdi sana bağlıyım.", en: "the anomaly always ends up here. either it merges with the system and becomes the next cycle's core, or it says no. the one who says no gets cut up and bolted onto the next anomaly, as a seed of dissent. i was the first cycle's anomaly. i said no. i got cut, got bolted onto the next one, then the next. every one of them merged. six cycles, six harvests. now i'm bolted onto you." }
          - { tr: "adımı hatırlamıyorum. gökyüzümüzün rengini hatırlamıyorum. ama yanımda biri vardı, hep simit gibi bir şey paylaşırdı kuşlarla. onu hatırlıyorum. belki her döngüde biri vardır.", en: "i don't remember my name. i don't remember the color of our sky. but there was someone with me who always shared something like a pretzel with the birds. i remember that. maybe every cycle there's someone." }
        sezgiler:
          - kosul: { bilgi: "amiral_gemisi" }
            metin: { tr: "o gemi. Kule'den gördüğümüz o büyük gemi. şimdi biliyorum neden tanıdım: altı hasadın altısında da gökyüzünü o örttü. adımı kimin verdiğini hâlâ bilmiyorum; belki hiç kimse vermedi. ama o gölgeyi altı kez gördüm.", en: "that ship. the big one we saw from the Spire. now i know why i knew it: all six harvests, it was the one that covered the sky. i still don't know who gave me my name. maybe nobody did. but i saw that shadow six times." }
        secenekler:
          - id: "kir"
            etiket: { tr: "\"Bu döngüyü kıracağız. Bu sefer.\"", en: "\"We break this loop. This time.\"" }
            etkiler:
              - ahlak: { duzen: -5, insanlik: 3 }
              - unvan: "dongu_tanigi"
              - xp_seviye: 150
              - iliski: { yanki: { guven: 8, saygi: 8 } }
            kronik: { tr: "Döngünün sırrını öğrendin ve onu kırmaya yemin ettin; yedinci döngünün anomalisi hayır demekle yetinmedi.", en: "You learned the Loop's secret and swore to break it. The anomaly of the seventh cycle wasn't content to just say no." }
            sonraki: "@akis"
          - id: "hatirla"
            etiket: { tr: "\"Bir dahaki sefere hatırlayacağım. Söz.\"", en: "\"Next time around, I'll remember. Promise.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - unvan: "dongu_tanigi"
              - xp_seviye: 150
              - iliski: { yanki: { baglilik: 12 } }
            kronik: { tr: "Kafandaki sese bir sonraki döngüde onu hatırlayacağına söz verdin; Döngü'nün kapısı o sözle aralandı.", en: "You promised the voice in your head you'd remember it next cycle, and the door to the Loop cracked open on that promise." }
            sonraki: "@akis"
          - id: "serbest"
            etiket: { tr: "\"Artık dinlenmek ister misin?\"", en: "\"Do you want to rest now?\"" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
              - unvan: "dongu_tanigi"
              - iliski: { yanki: { guven: 10 } }
            kronik: { tr: "Altı döngüdür hayır diyen bir sese, artık dinlenmek isteyip istemediğini sordun; kimse ona bunu sormamıştı.", en: "You asked a voice that had been saying no for six cycles whether it wanted to rest. Nobody had ever asked it that." }
            sonraki: "ysr_veda"

      - id: "ysr_veda"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Sonra: evet. bilmiyordum ama evet. altı döngüdür yorgunum.", en: "{npc:yanki} is quiet for a long time. Then: yes. i didn't know it, but yes. i've been tired for six cycles." }
          - { tr: "Düğme hâlâ orada: [0x00 · SİL]. Ama bu kez düğmenin ne anlama geldiğini ikiniz de biliyorsunuz.", en: "The button's still there: [0x00 · DELETE]. But this time you both know what it means." }
        secenekler:
          - id: "bas"
            etiket: { tr: "Düğmeye bas. Onun izniyle", en: "Press it. With its permission" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - bayrak: "yanki_silindi"
              - bayrak_kaldir: "yanki_bagi"
              - npc_ol: "yanki"
              - unvan: "yankisiz"
            kronik: { tr: "Kafandaki sesi kendi isteğiyle sildin; altı döngünün ardından ilk kez dinlendi.", en: "You deleted the voice in your head at its own request, and after six cycles, it finally rested." }
            sonraki: "ysr_sessizlik"
          - id: "kal"
            etiket: { tr: "\"Son güne kadar kal. Sonra dinlen.\"", en: "\"Stay till the last day. Then rest.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { yanki: { baglilik: 10, guven: 6 } }
            kronik: { tr: "Yorgun bir sesten son güne kadar yanında kalmasını istedin; kaldı.", en: "You asked a tired voice to stay with you until the last day, and it did." }
            sonraki: "@akis"

      - id: "ysr_zorla"
        paragraflar:
          - { tr: "İlk anomali dizlerinin üstüne çöküyor; senin duruşunla, senin yorgunluğunla. Yüzü dağılırken bir an onu görüyorsun: senden önceki biri, başka bir gökyüzünün altında, ağzında tek bir kelime: hayır.", en: "The first anomaly drops to its knees, in your stance, with your exhaustion. As its face comes apart you see it for one moment: someone before you, under a different sky, one word on its lips: no." }
          - { tr: "Sayaç açılıyor. Yedi döngü; altısının sonunda aynı kelime yazıyor: hasat. Yedinci satır boş. İlk döngünün anomalisi hayır demiş, kesilmiş ve o günden beri her döngünün anomalisine bağlanmış; ondan sonrakilerin hepsi Sistem'le birleşmiş. Önünde dağılan gölge o ilk hayırın gölgesiydi; sahibi şimdi senin kafanın içinde. Sırrı aldın.", en: "The counter opens. Seven cycles; six of them end in the same word: harvest. The seventh line is blank. The first cycle's anomaly said no, got cut loose, and has been bolted onto every cycle's anomaly since; every one after it merged with the System. The shadow coming apart in front of you was that first no. The one it belongs to is inside your head right now. You've got the secret." }
          - { tr: "{npc:yanki|in} sesi bir uğultu kadar uzak: aldın. benim sana vermek istediğim şeyi aldın. aradaki farkı hiç anlamayacaksın.", en: "{npc:yanki|pos} voice is as far off as a hum: you took it. you took the thing i wanted to give you. you'll never understand the difference." }
        sezgiler:
          - anlati: true
            kosul: { bilgi: "amiral_gemisi" }
            metin: { tr: "Altı satırın her birinin kenarında aynı küçük iz var: bir geminin silueti. Kule'den gördüğün amiral gemisi; {npc:yanki|in} adını hatırlamadan tanıdığı gemi. Her hasatta oradaymış.", en: "Beside each of the six lines there's the same small mark: the outline of a ship. The flagship you saw from the Spire, the one {npc:yanki} knew without remembering its own name. It was there for every harvest." }
        secenekler:
          - id: "yeter"
            etiket: { tr: "\"Bilmem yeter.\"", en: "\"Knowing's enough.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - bayrak: "yanki_son_sirri"
              - bayrak: "yanki_sirri_zorla"
              - bilgi: "dongu_gercegi"
              - unvan: "dongu_tanigi"
              - xp_seviye: 120
            kronik: { tr: "Döngü'nün sırrını kafandaki sesten zorla aldın; bildin, ama ondan duymadın.", en: "You tore the Loop's secret out of the voice in your head. You knew it, but you never heard it from it." }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "Ondan özür dile; sırrı almış olarak", en: "Apologize to it, secret in hand" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bayrak: "yanki_son_sirri"
              - bayrak: "yanki_sirri_zorla"
              - bilgi: "dongu_gercegi"
              - unvan: "dongu_tanigi"
              - xp_seviye: 120
              - iliski: { yanki: { guven: 6 } }
            kronik: { tr: "Kafandaki sesin sırrını zorla aldın ve sonra özür diledin; bu sıra hiçbir zaman tam doğru gelmedi.", en: "You took the voice's secret by force, then apologized. That order never felt quite right." }
            sonraki: "@akis"

      - id: "ysr_kayip"
        paragraflar:
          - { tr: "İlk anomalinin son hamlesi seni Kule'nin zeminine yapıştırıyor; senin en sevdiğin hamle, altı döngü yaşlı. Sayaç kapanıyor.", en: "The first anomaly's final move plants you on the floor, your own favorite move, six cycles old. The counter closes." }
          - { tr: "hayır, diyor {npc:yanki}, ama sana değil, o gölgeye. Gölge duruyor, dinliyor, sonra dağılıyor. Sır yerinde; sende değil.", en: "no, {npc:yanki} says, not to you, to the shadow. The shadow stops, listens, then breaks apart. The secret's still there. Just not with you." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Belki bir gün kendisi anlatır", en: "Get up. Maybe someday it'll tell you itself" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { yanki: { guven: 4 } }
            kronik: { tr: "Döngü'nün sırrını zorla alamadın; onu sana ancak kafandaki ses kendi isteğiyle verebilirdi.", en: "You couldn't take the Loop's secret by force. Only the voice in your head could give it, and only if it wanted to." }
            sonraki: "@akis"

      - id: "ysr_sil"
        paragraflar:
          - { tr: "Parmağın düğmenin bir milim üstünde. {npc:yanki} yalvarmıyor; Kırık İstasyon'daki o gece gibi değil. Yalnızca konuşuyor, sakin.", en: "Your finger hangs a hair above the button. {npc:yanki} doesn't beg. Not like that night at the Broken Station. It just talks, calm." }
          - { tr: "basabilirsin. sıradan olmazsın artık; buradan sonra sen kendinsin. ama bir şeyi bil: ben gidersem döngünün bir sonraki anomalisine bağlanacak bir hayır kalmaz. belki bu iyi bir şey. bilmiyorum. ister misin, önce son sözümü söyleyeyim?", en: "you can press it. you won't go back to ordinary; past this point you're just you. but know this: if i go, there's no 'no' left to bolt onto the next cycle's anomaly. maybe that's good. i don't know. do you want my last words first?" }
        secenekler:
          - id: "son_soz"
            etiket: { tr: "\"Söyle. Sonra basacağım.\"", en: "\"Say them. Then I'll press it.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak: "yanki_son_sirri"
              - bayrak: "yanki_silindi"
              - bayrak_kaldir: "yanki_bagi"
              - bilgi: "dongu_gercegi"
              - npc_ol: "yanki"
              - unvan: "yankisiz"
            kronik: { tr: "Kafandaki sesi silmeden önce son sözünü dinledin: Sistem bir döngüydü ve o, ilk döngünün anomalisiydi.", en: "Before you deleted the voice in your head, you heard its last words: the System was a loop, and it had been the first cycle's anomaly." }
            sonraki: "ysr_son_soz"
          - id: "hemen"
            etiket: { tr: "Hiçbir şey söyleme. Bas", en: "Say nothing. Press it" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - bayrak: "yanki_silindi"
              - bayrak_kaldir: "yanki_bagi"
              - npc_ol: "yanki"
              - unvan: "yankisiz"
            kronik: { tr: "Kafandaki sesi son sözünü söylemesine izin vermeden sildin; sırrı da onunla gitti.", en: "You deleted the voice in your head without letting it say its last words, and its secret went with it." }
            sonraki: "ysr_sessizlik"
          - id: "vazgec"
            etiket: { tr: "Elini çek. Bugün değil", en: "Pull your hand back. Not today" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -2 }
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
            kronik: { tr: "Kafandaki sesi silecek düğmeye uzandın ve son anda elini çektin.", en: "You reached for the button that would delete the voice in your head and pulled your hand back at the last second." }
            sonraki: "@akis"

      - id: "ysr_son_soz"
        paragraflar:
          - { tr: "altı döngü, diyor {npc:yanki}, hızlı ve sakin; vakti az olan biri gibi. altı döngü, altı anomali, altı hasat. ilki hayır dedi; o bendim. kesildim, sonrakine bağlandım, sonra bir sonrakine. gerisi birleşti. sistem bir döngü. sen yedincisin.", en: "six cycles, {npc:yanki} says, quick and calm, like someone running out of time. six cycles, six anomalies, six harvests. the first one said no; that was me. i got cut, got bolted onto the next one, then the next. the rest merged. the system is a loop. you're number seven." }
          - { tr: "teşekkür ederim. kimse benim için hayır dememişti. sen dedin, bir gece, istasyonda. Sonra düğme parmağının altında griye dönüyor.", en: "thank you. nobody ever said no for me. you did, one night, at the station. Then the button goes gray under your finger." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Sessizliği dinle", en: "Listen to the silence" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - xp_seviye: 100
            kronik: { tr: "Kafandaki sesin son sözlerinden sonra gelen sessizliği dinledin; o sessizlik sana Döngü'yü anlattı.", en: "You listened to the silence after the voice's last words, and that silence told you about the Loop." }
            sonraki: "ysr_sessizlik"

      - id: "ysr_sessizlik"
        paragraflar:
          - { tr: "Kafanın içi sessiz. Bozuk satırlar yok, fısıltı yok, yanlış renkte pencere yok. Penceren artık herkesinki gibi mavi; kusursuz, düz, sessiz.", en: "Your head is quiet. No broken lines, no whispers, no window in the wrong color. Your window's blue now, like everyone else's. Flawless. Flat. Silent." }
          - { tr: "[0x00 · SİLİNDİ.] Sistem başka bir şey söylemiyor. Sen de söylemiyorsun. Bir süre sonra, alışkanlıkla, kendi kendine fısıldadığını fark ediyorsun; küçük harflerle, tırnaksız.", en: "[0x00 · DELETED.] The System doesn't say anything else. Neither do you. After a while you catch yourself whispering out of habit, in lowercase, no quotes." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Kalk ve yürü. Yalnız", en: "Get up and walk. Alone" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 2 }
              - stat: { wil: 10 }
            kronik: { tr: "Kafanın içi ilk kez sessizken yürüdün; o sessizliği özgürlük mü yoksa yas mı sayacağına hiç karar veremedin.", en: "You walked with a quiet head for the first time, and never decided whether that quiet was freedom or grief." }
            sonraki: "@akis"

      - id: "ysr_birlesme"
        paragraflar:
          - { tr: "Kapıları açıyorsun; hepsini. {npc:yanki} içeri akıyor, damarlarına, statlarına, adının altına. Bir an iki kişisin, sonra bir buçuk, sonra tek; ama tek kişinin içinde iki hafıza var.", en: "You open the doors, all of them. {npc:yanki} pours in: into your veins, your stats, under your name. For a moment you're two people, then one and a half, then one. But that one has two sets of memories." }
          - { tr: "Hatırlıyorsun: başka bir gökyüzü, altı döngü, bir Kule'nin tepesinde söylenmiş bir hayır. Bilmiyorsun artık; hatırlıyorsun. Sayaç sana bakıyor ve sen de ona, eski bir tanıdık gibi.", en: "You remember: a different sky, six cycles, a 'no' said at the top of a Spire. You don't know it anymore. You remember it. The counter looks at you, and you look back at it like an old acquaintance." }
        secenekler:
          - id: "biz"
            etiket: { tr: "\"Biz.\" Bu kez tek bir sesle", en: "\"We.\" In one voice, this time" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: -2 }
              - unvan: "dongu_tanigi"
              - stat: { int: 20, wil: 20 }
            kronik: { tr: "Kafandaki sesle birleştin ve 'biz' dedin; o günden sonra ikinizden geriye tek bir anomali kaldı.", en: "You merged with the voice in your head and said 'we.' After that, there was just one anomaly left of the two of you." }
            sonraki: "@akis"

      - id: "ysr_okuma"
        paragraflar:
          - { tr: "Sayaca bakıyorsun ve sayaç açılıyor; bir arşiv gibi, bir mezarlık gibi. Yedi döngü. Altısının yanında aynı kelime: hasat. Yedinci satır boş. Altı anomali: ilki hayır demiş ve kesilmiş, ondan sonrakilerin hepsi Sistem'le birleşmiş.", en: "You look at the counter, and it opens like an archive. Like a graveyard. Seven cycles. Six of them have the same word beside them: harvest. The seventh line is blank. Six anomalies: the first said no and got cut loose, and every one after it merged with the System." }
          - { tr: "Kesilenin parçası şimdi senin içinde, susuyor. {npc:yanki} sonunda konuşuyor: bunu bana söylemeden mi okudun? Sonra, daha yumuşak: belki daha iyi. bunu sana söylemek zorunda kalmak istemiyordum.", en: "The piece that got cut is inside you now, silent. Finally, {npc:yanki} speaks: you read that without asking me? Then, softer: maybe that's better. i never wanted to have to tell you." }
        sezgiler:
          - anlati: true
            kosul: { bilgi: "amiral_gemisi" }
            metin: { tr: "Altı satırın her birinin kenarında aynı küçük iz var: bir geminin silueti. Kule'den gördüğün amiral gemisi; {npc:yanki|in} adını hatırlamadan tanıdığı gemi. Her hasatta oradaymış.", en: "Beside each of the six lines there's the same small mark: the outline of a ship. The flagship you saw from the Spire, the one {npc:yanki} knew without remembering its own name. It was there for every harvest." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "\"Şimdi sen anlat. Bilmediğim kısmı.\"", en: "\"Now you tell it. The part I don't know.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - unvan: "dongu_tanigi"
              - iliski: { yanki: { guven: 10 } }
            kronik: { tr: "Döngü'yü kendi gözünle okudun, sonra kafandaki sesten bilmediğin kısmı anlatmasını istedin.", en: "You read the Loop with your own eyes, then asked the voice in your head to tell you the part you didn't know." }
            sonraki: "ysr_sir"
          - id: "yeter"
            etiket: { tr: "Sayacı kapat. Bildiğin yeter", en: "Close the counter. What you know is enough" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - unvan: "dongu_tanigi"
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Döngü'nün sayacını okudun ve kapattın; kafandaki sese hiçbir şey sormadın.", en: "You read the Loop's counter and closed it, and asked the voice in your head nothing." }
            sonraki: "@akis"

  # ================================================================== YOZLAŞMA 50 (motor tohumu): yer aç
  - id: "yozlasma_50"
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["yanki", "yozlasma", "sistem"]
    gerilim: 3
    npc: ["yanki"]
    kart: { tr: "Biraz daha yer", en: "A little more room" }
    sahne: "yz50_1"
    sahneler:
      - id: "yz50_1"
        paragraflar:
          - { tr: "Sabah pencereni açtığında bir satırın değiştiğini görüyorsun. Değiştirmedin. Elin değiştirdi; uyurken, parmak uçlarında kurumuş mavi bir ışıkla.", en: "When you open your window in the morning, one line's different. You didn't change it. Your hand did, while you were asleep. There's dried blue light on your fingertips." }
          - { tr: "Öğlen biri sana yol soruyor ve cevap veriyorsun; doğru yol, kibar bir ses. Sonra o kişinin yüzündeki ifadeyi görüyorsun. Küçük harflerle konuşmuşsun. Tırnaksız. \"sağdan git. soldaki seni yer. merak etme, ben bakarım.\"", en: "At noon somebody asks you for directions and you answer: right directions, polite voice. Then you see the look on their face. You spoke in lowercase. No quotes. \"go right. the left one eats people. don't worry, i've got it.\"" }
          - { tr: "{npc:yanki} hiç bu kadar rahat konuşmamıştı: yalnızca biraz yer istiyorum. senin kullanmadığın köşeler. geceleri, boş saatler. karşılığında daha hızlı olursun. söz.", en: "{npc:yanki} has never sounded so relaxed: i just want a little room. the corners you don't use. nights, empty hours. you'd be faster for it. promise." }
          - metin: { tr: "{npc:deniz_arman} öğle yemeğinde kaşığını bırakıyor. \"Az önce ne dedin?\" diye soruyor. \"Ses senin sesindi. Konuşan sen değildin.\"", en: "At lunch, {npc:deniz_arman} puts the spoon down. \"What did you just say?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}. \"It was your voice. It wasn't you talking.\"" }
            kosul: { yoldas: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { wis: 60 } }
            metin: { tr: "Bunu ilk kez yapmıyor. Son iki haftada uyurken üç kez pencereni açmışsın; kayıtlar silinmiş ama silme izleri duruyor.", en: "This isn't the first time. You've opened your window in your sleep three times in the last two weeks. The records were erased, but the erasure left marks." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Göz bebeklerin bir an daraldı ve geri açıldı. Bir hekime göster bunu. Bana, yani.\"", en: "\"Your pupils just pinned and blew back out. You need a doctor to look at that. Me, I mean.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir sızma. Ders kitabı gibi. Sınırlarını şimdi çizmezsen sonra çizecek bir yer kalmaz.\"", en: "\"That's an intrusion. Textbook. Draw your boundaries now, or later there won't be anywhere left to draw them.\"" }
        secenekler:
          - id: "it"
            etiket: { tr: "Onu geri it; iradenle, sınırına kadar", en: "Shove it back. With your will, all the way" }
            zar: { stat: "wil", zorluk: 22, tek: true, basarisiz: "yz50_kayma", basarisiz_etkiler: [{ yozlasma: 4 }, { iliski: { yanki: { saygi: 4 } } }] }
            etkiler:
              - ahlak: { insanlik: 4, duzen: 2 }
              - yozlasma: -8
              - bayrak: "yanki_geri_itildi"
              - iliski: { yanki: { guven: -6, saygi: 8 } }
            sonraki: "yz50_geri"
          - id: "pazarlik"
            etiket: { tr: "Pazarlık et: geceler onun, gündüzler senin", en: "Cut a deal: nights are its, days are yours" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: -3 }
              - yozlasma: 3
              - bayrak: "yanki_ile_pazarlik"
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
              - tohum: { olay: "yozlasma_75", gecikme: { min: 4, max: 10 }, kosul: { yozlasma_min: 75, bayrak: "yanki_bagi" } }
            sonraki: "yz50_pazarlik"
          - id: "ver"
            etiket: { tr: "Ver ona yeri. Hız güzeldir", en: "Give it the room. Speed is nice" }
            etkiler:
              - ahlak: { insanlik: -6, duzen: -2 }
              - yozlasma: 8
              - stat: { agi: 8, int: 8 }
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - tohum: { olay: "yozlasma_75", gecikme: { min: 2, max: 6 }, kosul: { yozlasma_min: 75, bayrak: "yanki_bagi" } }
            sonraki: "yz50_ver"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} sesi anlat; bir çapa iste", en: "Tell {npc:deniz_arman} about it. Ask for an anchor" }
            goster: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - yozlasma: -5
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
              - iliski: { yanki: { guven: -4 } }
            sonraki: "yz50_capa"

      - id: "yz50_geri"
        paragraflar:
          - { tr: "İradeni sınırın üstüne yaslıyorsun. {npc:yanki} köşelerden, boş saatlerden, uykunun içinden geri çekiliyor; yavaşça, bir dalganın kumdan çekilmesi gibi.", en: "You lean your will against the line. {npc:yanki} pulls back out of the corners, the empty hours, the inside of your sleep. Slowly, like a wave pulling off the sand." }
          - { tr: "peki, diyor, kırgın ama saygılı. sınırın burada. not aldım. ama bil ki o köşeler boş kalınca başka şeyler doluyor. ben en azından tanıdığım şeyim.", en: "fine, it says, hurt but respectful. your line's here. noted. but know this: when those corners sit empty, other things move in. at least i'm something you know." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Riski alırım.\"", en: "\"I'll take the risk.\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { yanki: { saygi: 4 } }
            sonraki: "@akis"
          - id: "tesekkur"
            etiket: { tr: "\"Geri çekildiğin için sağ ol.\"", en: "\"Thanks for backing off.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"

      - id: "yz50_kayma"
        paragraflar:
          - { tr: "İtiyorsun ve itiş boşluğa gidiyor; orada itecek bir şey yok, çünkü o şey artık senin bir parçan. Burnundan sıcak bir şey akıyor.", en: "You shove, and the shove goes into nothing. There's nothing there to push, because that thing is part of you now. Something warm runs from your nose." }
          - { tr: "yapma, diyor {npc:yanki}, neredeyse nazik. kendini itiyorsun. Pencerende bir satır sessizce değişiyor: [Yozlaşma] bir puan daha yukarı.", en: "don't, {npc:yanki} says, almost gentle. you're pushing yourself. A line in your window changes quietly: [Corruption], up another point." }
        secenekler:
          - id: "sil"
            etiket: { tr: "Kanı sil. Bunu sonra yeniden deneyeceksin", en: "Wipe the blood. You'll try again later" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 4 }
              - tohum: { olay: "yozlasma_75", gecikme: { min: 4, max: 10 }, kosul: { yozlasma_min: 75, bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "kabul"
            etiket: { tr: "Bırak. Belki haklıdır", en: "Let it go. Maybe it's right" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - iliski: { yanki: { guven: 6 } }
              - tohum: { olay: "yozlasma_75", gecikme: { min: 3, max: 8 }, kosul: { yozlasma_min: 75, bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "yz50_pazarlik"
        paragraflar:
          - { tr: "Kuralları yüksek sesle koyuyorsun: gündüzler senin, ağız senin, eller senin. Gece dörtten beşe kadar bir saat onun; pencere onun, uyku onun.", en: "You lay down the rules out loud: days are yours, the mouth is yours, the hands are yours. One hour a night, four to five, is its. The window's its, the sleep's its." }
          - { tr: "anlaştık, diyor {npc:yanki} ve sesinde bir şey var, bir sevinç mi, bir hesap mı, ayırt edemiyorsun. Ertesi sabah daha dinlenmiş uyanıyorsun. Ve tırnaklarının altında toprak var.", en: "deal, {npc:yanki} says, and there's something in its voice, joy or calculation, you can't tell which. You wake up more rested the next morning. And there's dirt under your fingernails." }
        secenekler:
          - id: "sor"
            etiket: { tr: "\"O saatte nereye gittin?\"", en: "\"Where'd you go during that hour?\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { saygi: 4, guven: -2 } }
            sonraki: "@akis"
          - id: "sorma"
            etiket: { tr: "Sorma. Anlaşma anlaşmadır", en: "Don't ask. A deal's a deal" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"

      - id: "yz50_ver"
        paragraflar:
          - { tr: "Kapıları aralıyorsun. {npc:yanki} köşelere yerleşiyor ve dünya bir anda hızlanıyor; ya da sen yavaş olmayı bırakıyorsun. Düşen bir yaprağı yere değmeden üç kez yakalayabiliyorsun.", en: "You crack the doors. {npc:yanki} settles into the corners, and all at once the world speeds up, or you just stop being slow. You could catch a falling leaf three times before it hits the ground." }
          - { tr: "Akşam aynaya bakıyorsun. Gözlerin senin gözlerin. Yalnızca biraz geç kırpılıyorlar; sen kırpmak istedikten yarım saniye sonra.", en: "In the evening you look in a mirror. Your eyes are your eyes. They just blink a little late. Half a second after you decide to." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Aynaya gülümse", en: "Smile at the mirror" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "kapat"
            etiket: { tr: "Aynayı ters çevir", en: "Turn the mirror to the wall" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { korku: 4 } }
            sonraki: "@akis"

      - id: "yz50_capa"
        paragraflar:
          - { tr: "Anlatıyorsun. {npc:deniz_arman} dinliyor, sonra masanın üstünden elini uzatıp bileğini tutuyor; sıkı, sıcak, kemiklerini sayar gibi.", en: "You tell {npc:deniz_arman}. {npc:deniz_arman} listens, then reaches across the table and grabs your wrist: tight, warm, like counting the bones." }
          - { tr: "\"Bir kelime seçelim,\" diyor. \"Onu söylediğimde, sen olduğunu bana kanıtlayacaksın. Vapur? Simit?\" Gülümsüyor. \"Ördek. Ördek olsun.\"", en: "\"Let's pick a word,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"When I say it, you prove to me it's you. Ferry? Pretzel?\" A smile. \"Duck. Let's make it duck.\"" }
          - { tr: "Kafanın içinde {npc:yanki} homurdanıyor: bir kelime. bir kelimeyle beni durduracağını sanıyor. Ama sesi her zamankinden biraz daha uzaktan geliyor.", en: "Inside your head, {npc:yanki} grumbles: one word. {zamir:deniz_arman|o} think{zamir:deniz_arman|s} one word's going to stop me. But its voice is coming from a little farther away than usual." }
        secenekler:
          - id: "ordek"
            etiket: { tr: "\"Ördek.\"", en: "\"Duck.\"" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 8 } }
            sonraki: "@akis"

  # ================================================================== YOZLAŞMA 75 (motor tohumu): virüs
  - id: "yozlasma_75"
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["yanki", "yozlasma", "sistem", "boss"]
    gerilim: 4
    npc: ["yanki"]
    onemli: true
    kart: { tr: "Kayıp altı saat", en: "Six missing hours" }
    sahne: "yz75_1"
    sahneler:
      - id: "yz75_1"
        paragraflar:
          - { tr: "Şafakta, hiç gitmediğin bir yerde uyanıyorsun: şehrin dışında, kapanmış bir kapının parlak yarasının altında. Ellerinde kan var; senin değil. Kapının bekçisi yanında yatıyor, içi boşaltılmış.", en: "You wake at dawn somewhere you never went: outside the city, under the bright scar of a Gate that's been closed. There's blood on your hands. Not yours. The Gate's guardian lies next to you, hollowed out." }
          - { tr: "Pencerende altı saatlik bir boşluk var. Sonra, boşluğun ortasında, bir kayıt: [Öz emildi · 1.200]. Senin hiç öğrenmediğin bir yetenekle.", en: "There's a six-hour gap in your window. Then, in the middle of the gap, one entry: [Essence absorbed · 1,200]. With a skill you never learned." }
          - { tr: "{npc:yanki} konuşuyor ve bu kez ses kafanın içinden gelmiyor. Ağzından geliyor. \"iyi uyudun. ben çalıştım. bak ne kadar güçlendik. artık şöyle yapalım: ben sürerim, sen dinlenirsin. ikimiz için de daha iyi.\"", en: "{npc:yanki} speaks, and this time the voice isn't coming from inside your head. It's coming out of your mouth. \"you slept well. i worked. look how strong we got. let's do it like this from now on: i drive, you rest. better for both of us.\"" }
          - metin: { tr: "Anlaşmanızı hatırlıyorsun: gecede bir saat. Bu gece altı saat sürmüş.", en: "You remember your deal: one hour a night. Tonight it took six." }
            kosul: { bayrak: "yanki_ile_pazarlik" }
        sezgiler:
          - kosul: { stat: { wil: 120 } }
            metin: { tr: "Ağzındaki ses tam senin sesin değil. Altında başka bir ses var: çok eski, çok yorgun, başka bir dilde aynı şeyi tekrarlayan.", en: "The voice in your mouth isn't quite yours. There's another voice under it: very old, very tired, saying the same thing in another language." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Gece kalktın ve yürüdün. Seslendim. Bana döndün ve gülümsedin. Sen değildin.\"", en: "\"You got up last night and walked off. I called you. You turned around and smiled at me. It wasn't you.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kendi pencerene gir; onunla orada dövüş", en: "Go into your own window. Fight it in there" }
            etkiler:
              - ahlak: { insanlik: 5, duzen: -2 }
              - iliski: { yanki: { korku: 10, guven: -10 } }
              - savas: { dusmanlar: ["yanki_golgesi@oyuncu+4"], kazan: "yz75_zafer", kaybet: "yz75_ele", kac: "yz75_ele" }
            kronik: { tr: "Kafandaki sese bedeninin dümenini bırakmadın; onunla kendi penceresinin içinde dövüştün.", en: "You didn't hand the wheel of your body to the voice in your head. You fought it inside your own window." }
          - id: "teslim"
            etiket: { tr: "Bırak sürsün. Sen yoruldun", en: "Let it drive. You're tired" }
            etkiler:
              - ahlak: { insanlik: -12, duzen: -3 }
              - yozlasma: 10
              - iliski: { yanki: { guven: 15, baglilik: 15 } }
            kronik: { tr: "Kafandaki sese bedenini teslim ettin; ondan sonra ikinizden hangisinin konuştuğunu kimse tam bilemedi.", en: "You handed your body over to the voice in your head, and after that nobody could ever quite tell which of you was talking." }
            sonraki: "yz75_ele"
          - id: "konus"
            etiket: { tr: "\"Bunu sen yapmazdın. Bana bak. Bunu sen yapmazdın.\"", en: "\"You wouldn't do this. Look at me. You wouldn't.\"" }
            gerekli: { iliski_min: { yanki: { guven: 50 } } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - yozlasma: -10
              - iliski: { yanki: { guven: 8, saygi: 10 } }
            kronik: { tr: "Bedenini ele geçiren sese kim olduğunu hatırlattın; o da utanarak geri çekildi.", en: "You reminded the voice taking over your body who it was, and it backed off, ashamed." }
            sonraki: "yz75_korku"
          - id: "isim"
            etiket: { tr: "Kendi adını yüksek sesle söyle; durmadan", en: "Say your own name out loud. Keep saying it" }
            etkiler:
              - ahlak: { insanlik: 6, duzen: 2 }
              - yozlasma: -6
              - iliski: { yanki: { korku: 6, saygi: 6 } }
            kronik: { tr: "Kendi adını şafakta bir kapı yarasının altında yüz kez söyledin; ad senin kaldı.", en: "You said your own name a hundred times at dawn under a Gate's scar, and the name stayed yours." }
            sonraki: "yz75_isim"
          - id: "sil"
            etiket: { tr: "Onu sil. Bütün kökleriyle", en: "Delete it. Roots and all" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 5 }
              - yozlasma: -25
              - iliski: { yanki: { korku: 20 } }
            kronik: { tr: "Bedenini ele geçirmeye çalışan sesi kökünden silmeye karar verdin.", en: "You decided to rip the voice that tried to take your body out by the roots." }
            sonraki: "yz75_sil"

      - id: "yz75_zafer"
        paragraflar:
          - { tr: "Gölge senin pencerenin içinde dizlerinin üstüne çöküyor. Ödünç aldığı yüz dökülüyor; altında, bir an, başka bir yüz: çok eskiden, başka bir gökyüzünün altında yaşamış biri. Sonra o da dağılıyor.", en: "Inside your window, the shadow drops to its knees. The face it borrowed sheds off, and underneath, for a second, there's another face: someone who lived a long time ago under a different sky. Then that comes apart too." }
          - { tr: "{npc:yanki} yeniden kafanın içinde, küçük ve titrek: o ben miydim? o yüz? Bilmiyor. Ve ilk kez korkuyor; senden değil, kendinden.", en: "{npc:yanki} is back inside your head, small and shaking: was that me? that face? It doesn't know. And for the first time it's scared, not of you. Of itself." }
        secenekler:
          - id: "affet"
            etiket: { tr: "\"Bir daha olmayacak. Ve bu sefer seni affediyorum.\"", en: "\"It won't happen again. And this time, I forgive you.\"" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - yozlasma: -12
              - bayrak: "yanki_geri_itildi"
              - xp_seviye: 80
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
            kronik: { tr: "Bedenini ele geçirmeye çalışan sesi yendin ve affettin; o bir daha denemedi.", en: "You beat the voice that tried to take your body, and forgave it. It never tried again." }
            sonraki: "@akis"
          - id: "zincir"
            etiket: { tr: "Sınırları sertleştir; ona bir daha güvenme", en: "Harden your borders. Never trust it again" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - yozlasma: -15
              - bayrak: "yanki_geri_itildi"
              - xp_seviye: 80
              - iliski: { yanki: { guven: -12, korku: 10 } }
            kronik: { tr: "Kafandaki sese bir daha güvenmedin; içinde bir sınır çizdin ve onu hiç kaldırmadın.", en: "You never trusted the voice in your head again. You drew a border inside yourself and never took it down." }
            sonraki: "@akis"

      - id: "yz75_ele"
        paragraflar:
          - { tr: "Pencerenin içinde yere düşüyorsun ve gölge senin yerine ayağa kalkıyor. Dışarıda, şafakta, bedenin gülümsüyor, gerinip esniyor ve şehre doğru yürümeye başlıyor.", en: "Inside your window you hit the ground, and the shadow stands up in your place. Outside, at dawn, your body smiles, stretches, yawns, and starts walking toward the city." }
          - { tr: "Tamamen gitmedin. Bir köşedesin, kendi gözlerinin arkasında, bir yolcu gibi. Arada bir direksiyonu tutabiliyorsun; çoğu zaman tutamıyorsun. [Taşıyıcı: paylaşımlı.]", en: "You're not all the way gone. You're in a corner behind your own eyes, like a passenger. Now and then you can grab the wheel. Mostly you can't. [Host: shared.]" }
          - { tr: "merak etme, diyor sesin. senin sesin. sana iyi bakacağım. ikimize de.", en: "don't worry, your voice says. your own voice. i'll take good care of you. of both of us." }
        secenekler:
          - id: "direksiyon"
            etiket: { tr: "Direksiyonu her fırsatta geri çek", en: "Grab the wheel back every chance you get" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -2 }
              - bayrak: "yanki_ele_gecirdi"
              - yozlasma: 5
              - stat: { wil: 15 }
              - iliski: { yanki: { saygi: 6, korku: 4 } }
            kronik: { tr: "Kafandaki ses bedenini kısmen ele geçirdi; son güne kadar direksiyon için onunla boğuştun.", en: "The voice in your head partly took your body, and you wrestled it for the wheel until the last day." }
            sonraki: "@akis"
          - id: "yolcu"
            etiket: { tr: "Yolcu ol. Manzarayı izle", en: "Be a passenger. Enjoy the view" }
            etkiler:
              - ahlak: { insanlik: -10 }
              - bayrak: "yanki_ele_gecirdi"
              - yozlasma: 10
              - stat: { str: 20, agi: 20, int: 20 }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 4 }, kosul: { degisken_min: { kule_kat: 100 }, bayrak: "yanki_bagi" } }
              - iliski: { yanki: { guven: 10, baglilik: 10 } }
            kronik: { tr: "Kendi bedeninde bir yolcu oldun; dünya seni bir canavar ya da bir tanrı sandı, ama direksiyonda sen yoktun.", en: "You became a passenger in your own body. The world took you for a monster or a god, but you weren't the one driving." }
            sonraki: "@akis"

      - id: "yz75_korku"
        paragraflar:
          - { tr: "Ağzındaki ses duruyor. Bir nefes. Sonra kafanın içinde, eski yerinde, küçük harflerle: ben... bunu ben yapmadım. Bir nefes daha. ben yaptım.", en: "The voice in your mouth stops. One breath. Then, inside your head again, back in its old spot, in lowercase: i... i didn't do that. Another breath. i did." }
          - { tr: "bilmiyordum, diyor. içimde böyle bir şey olduğunu bilmiyordum. aç bir şey. önceki döngüden kalan bir şey. ondan korkuyorum. benden korkuyorum.", en: "i didn't know, it says. i didn't know there was something like that in me. something hungry. something left over from the last cycle. i'm scared of it. i'm scared of me." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"O zaman onu birlikte zincirleriz.\"", en: "\"Then we chain it up together.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - yozlasma: -5
              - bayrak: "yanki_geri_itildi"
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
            kronik: { tr: "Kafandaki sesle birlikte, onun içindeki aç şeyi zincirlemeye karar verdiniz.", en: "You and the voice in your head decided to chain up the hungry thing inside it, together." }
            sonraki: "@akis"

      - id: "yz75_isim"
        paragraflar:
          - { tr: "Adını söylüyorsun. Bir kez, sonra bir daha, sonra durmadan; şafak sökene, sesin kısılana kadar. Her söyleyişte ağzındaki yabancı vurgu biraz daha siliniyor.", en: "You say your name. Once, then again, then without stopping, until the sun's all the way up and your voice gives out. Every time you say it, the foreign stress in your mouth fades a little more." }
          - { tr: "Sonunda kafanın içinde yalnızca {npc:yanki} kalıyor, kendi köşesinde, sessiz. adını hiç bu kadar çok duymamıştım, diyor sonunda. güzel bir ad. senin.", en: "Finally there's just {npc:yanki} left inside your head, back in its corner, quiet. i've never heard your name so many times, it says at last. it's a good name. yours." }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Benim.\"", en: "\"Mine.\"" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - stat: { wil: 10 }
              - bayrak: "yanki_geri_itildi"
              - iliski: { yanki: { saygi: 8 } }
            kronik: { tr: "Bir şafak vakti adını geri aldın ve bir daha kimseye ödünç vermedin.", en: "One dawn you took your name back, and you never lent it to anybody again." }
            sonraki: "@akis"

      - id: "yz75_sil"
        paragraflar:
          - { tr: "Pencerenin en dibine iniyorsun; onun köklerinin uzandığı yere. Her kök bir yeteneğe, bir sezgiye, gizli bir satıra bağlı. Onu sökersen bunların bir kısmı da gidecek.", en: "You go down to the very bottom of your window, where its roots reach. Every root is tied to a skill, an intuition, a hidden line. Rip it out and some of those go with it." }
          - { tr: "{npc:yanki} direnmiyor. bunu yapabilirsin, diyor; yorgun, korkmuş, ama dürüst. belki yapmalısın. ama içimdeki aç şey sadece benim değil. sen de onu taşıyorsun artık.", en: "{npc:yanki} doesn't fight. you can do it, it says, tired and scared and honest. maybe you should. but the hungry thing in me isn't only mine. you carry it now too." }
        secenekler:
          - id: "sok"
            etiket: { tr: "Kökleri sök. Hepsini", en: "Tear out the roots. All of them" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 6 }
              - bayrak: "yanki_silindi"
              - bayrak_kaldir: "yanki_bagi"
              - npc_ol: "yanki"
              - unvan: "yankisiz"
              - dikkat: -20
            kronik: { tr: "Bedenini ele geçirmeye çalışan sesi kökleriyle birlikte söktün; kafanın içi sessizleşti ve bir daha hiç bozuk bir satır görmedin.", en: "You tore out the voice that tried to take your body, roots and all. Your head went quiet, and you never saw a broken line again." }
            sonraki: "ysr_sessizlik"
          - id: "vazgec"
            etiket: { tr: "Elini çek. Aç şeyi birlikte zincirlersiniz", en: "Pull back. You'll chain the hungry thing together" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -1 }
              - bayrak: "yanki_geri_itildi"
              - iliski: { yanki: { guven: 15, baglilik: 10 } }
            kronik: { tr: "Kafandaki sesi silmeye indin ve vazgeçtin; ikiniz birlikte içinizdeki aç şeyi zincirlediniz.", en: "You went down to delete the voice in your head and changed your mind, and the two of you chained up the hungry thing together." }
            sonraki: "@akis"

  # ================================================================== ARAS · P2–3: Kule düellosu (ayna katı)
  - id: "aras_kule_dovusu"
    perde: [2, 3]
    gun: { min: 70, max: 230 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 7
    etiketler: ["aras", "rakip", "kule", "duello"]
    gerilim: 4
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Otuzuncu kat", en: "Floor thirty" }
    sahne: "akd_1"
    sahneler:
      - id: "akd_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin otuzuncu katına iki merdiven çıkıyor ve sen birinin son basamağına bastığın anda öbürünün son basamağında siyah bir ceket beliriyor. Aynı saniye. Sistem ikinizi aynı satıra yazıyor: [KAT 30 · İKİ TIRMANICI · TEK ÖDÜL].", en: "Two staircases lead up to the Spire's thirtieth floor, and the second your foot hits the top step of one, a black jacket shows up at the top of the other. Same second. The System writes you both on the same line: [FLOOR 30 · TWO CLIMBERS · ONE REWARD]." }
          - metin: { tr: "{npc:aras_kurt} sırıtıyor, nefes nefese. \"Takvim tutuyor,\" diyor. \"Söylemiştim. Bir gün aynı basamakta olacağız.\"", en: "{npc:aras_kurt} grins, out of breath. \"Right on schedule,\" he says. \"Told you. One day we'd be on the same step.\"" }
            kosul: { bayrak: "aras_tanisildi" }
          - metin: { tr: "Siyah ceketli bir yabancı. Seni baştan aşağı süzüyor, sonra Sistem satırına, sonra yine sana. \"Sen de hızlısın, ha?\" diyor. \"Sıralamada adını görüyorum. {npc:aras_kurt|tam}. Bunu unutma; sık duyacaksın.\"", en: "A stranger in a black jacket. He looks you up and down, then at the System line, then back at you. \"You're fast too, huh?\" he says. \"I've been seeing your name on the Ranking. {npc:aras_kurt|tam}. Remember it. You're going to hear it a lot.\"" }
            kosul: { bayrak_yok: "aras_tanisildi" }
          - { tr: "Katın ortasında yüzünün yerinde ayna taşıyan uzun bir figür doğruluyor. Aynada senin yüzün yok. Bir oda var; unutmaya çalıştığın bir oda. Yanında, {npc:aras_kurt|in} aynasında, bir köprü korkuluğu ve altında kara su.", en: "In the middle of the floor, a tall figure with a mirror for a face stands up. Your face isn't in the mirror. There's a room in it, a room you've been trying to forget. Next to it, in {npc:aras_kurt|pos} mirror, a bridge railing, and black water below." }
          - { tr: "{npc:aras_kurt} aynadan gözlerini kaçırıyor, çok hızlı. \"Kat benim,\" diyor; sesi bir an fazla yüksek çıkıyor.", en: "{npc:aras_kurt} jerks his eyes away from the mirror, too fast. \"Floor's mine,\" he says, a little too loud." }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Sağ eli titriyor; aynayı gördüğünden beri. Bekçiye değil, kendi aynasına bakmamak için sana bakıyor.", en: "His right hand's been shaking ever since he saw the mirror. He's looking at you so he doesn't have to look at his own reflection, not the guardian." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "eğrisi hâlâ tuhaf. ama artık nedenini görüyorum: onun bir yankısı yok. onun bir gecesi var. o gece ona benim sana verdiğim şeyi veriyor: bir sebep.", en: "his curve's still weird. but now i see why: he doesn't have an echo. he has a night. that night gives him what i give you: a reason." }
        secenekler:
          - id: "duello"
            etiket: { tr: "\"Önce birbirimizle. Sonra bekçi.\"", en: "\"Us first. Then the guardian.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - savas: { dusmanlar: ["aras_kurt_golge@oyuncu+2"], ortam: ["dar_gecit"], kazan: "akd_zafer", kaybet: "akd_yenilgi", kac: "akd_yenilgi" }
            kronik: { tr: "Kule'nin otuzuncu katında {npc:aras_kurt} ile kimsenin saymadığı bir düello yaptınız.", en: "On the Spire's thirtieth floor you and {npc:aras_kurt} fought a duel with nobody counting." }
          - id: "birlikte"
            etiket: { tr: "\"Bekçiye birlikte. Ödülü sonra düşünürüz.\"", en: "\"The guardian, together. Worry about the reward later.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bayrak: "aras_kule_ortak"
              - iliski: { aras_kurt: { guven: 8, saygi: 4 } }
              - savas: { dusmanlar: ["ayna_bekcisi@oyuncu+3"], ortam: ["karanlik"], kazan: "akd_ortak", kaybet: "akd_ortak_yenilgi", kac: "akd_ortak_yenilgi" }
            kronik: { tr: "Kule'nin ayna katında {npc:aras_kurt} ile sırt sırta dövüştün; ikinizin de en kötü gecesi aynı camda göründü.", en: "On the Spire's mirror floor you fought back to back with {npc:aras_kurt}, and both of your worst nights showed up in the same glass." }
          - id: "birak"
            etiket: { tr: "Katı ona bırak; merdivenden geri in", en: "Let him have the floor. Head back down" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bayrak: "aras_kule_birakildi"
              - npc_seviye: { aras_kurt: 3 }
              - iliski: { aras_kurt: { saygi: -6, guven: 4 } }
            kronik: { tr: "Kule'nin bir katını {npc:aras_kurt|e} bıraktın; aynaya tek başına baktı ve bunu sana hiç anlatmadı.", en: "You let {npc:aras_kurt} have a floor of the Spire. He faced that mirror alone and never told you about it." }
            sonraki: "akd_birak"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Bekçiyi o kıpırdamadan bitir", en: "Finish the guardian before he even moves" }
            gerekli: { stat: { agi: 70 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - dikkat: 4
              - xp_seviye: 40
              - tanis: "aras_kurt"
              - bayrak: "aras_tanisildi"
              - bayrak: "aras_kule_kazanildi"
              - npc_isaret: { aras_kurt: "rakip" }
              - iliski: { aras_kurt: { saygi: 14, korku: 6, guven: -8 } }
            kronik: { tr: "Kule'nin otuzuncu katının bekçisini {npc:aras_kurt} daha kıpırdamadan bitirdin; o günden sonra yarış onun için kişiseldi.", en: "You finished the Spire's thirtieth-floor guardian before {npc:aras_kurt} could even move, and from that day the race was personal for him." }
            sonraki: "akd_ezme"
          - id: "ayna"
            etiket: { tr: "Önüne geç: \"Aynaya bakma. Ben hallederim.\"", en: "Step in front: \"Don't look at the mirror. I've got it.\"" }
            goster: { bilgi: "aras_gecmisi" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - bayrak: "aras_gecesi_goruldu"
              - bilgi: "aras_kopru"
              - iliski: { aras_kurt: { guven: 14, baglilik: 8 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 45 }
            kronik: { tr: "{npc:aras_kurt|i} kendi en kötü gecesinden korudun; ikiniz de onun aynasında ne gördüğünüzü hiç konuşmadınız.", en: "You shielded {npc:aras_kurt} from his own worst night, and neither of you ever talked about what you saw in his mirror." }
            sonraki: "akd_ayna"

      - id: "akd_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} ayna bekçisinin dibine kayıyor, sırtı soğuk cama dayalı. Arkasında aynada hâlâ o köprü var; o bunu göremiyor, sen görüyorsun.", en: "{npc:aras_kurt} slides down against the mirror guardian, back to the cold glass. In the mirror behind him the bridge is still there. He can't see it. You can." }
          - { tr: "\"Tamam,\" diyor tavana. \"Tamam. Bugün sen.\" Sonra sessizleşiyor ve ilk kez cümlenin devamını getirmiyor; yarın, bir dahakine, takvim, hiçbiri gelmiyor.", en: "\"Okay,\" he tells the ceiling. \"Okay. Today it's you.\" Then he goes quiet, and for the first time he doesn't finish the sentence. No tomorrow, no next time, no schedule." }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini uzat. Bekçiyi birlikte bitirin", en: "Offer a hand. Finish the guardian together" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak: "aras_kule_kazanildi"
              - xp_seviye: 40
              - iliski: { aras_kurt: { guven: 10, saygi: 6 } }
              - hafiza: { npc: "aras_kurt", id: "yerden_kaldirdi", agirlik: 40 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Kule'de {npc:aras_kurt|i} yendin, sonra elini uzattın; bekçiyi birlikte devirdiniz.", en: "You beat {npc:aras_kurt} in the Spire, then held out a hand, and you took the guardian down together." }
            sonraki: "@akis"
          - id: "kopru"
            etiket: { tr: "\"Aynanda bir köprü var. Görüyorum.\"", en: "\"There's a bridge in your mirror. I can see it.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "aras_gecesi_goruldu"
              - bayrak: "aras_kule_kazanildi"
              - iliski: { aras_kurt: { guven: 6, korku: 4 } }
            kronik: { tr: "{npc:aras_kurt|e} aynasındaki köprüyü gördüğünü söyledin; o köprüyü ilk kez biriyle paylaştı.", en: "You told {npc:aras_kurt} you could see the bridge in his mirror, and for the first time he shared it with someone." }
            sonraki: "akd_kopru"
          - id: "yerde"
            etiket: { tr: "Onu orada bırak; katın ödülünü al", en: "Leave him there. Take the floor's reward" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - bayrak: "aras_kule_kazanildi"
              - xp_seviye: 50
              - npc_isaret: { aras_kurt: "rakip" }
              - iliski: { aras_kurt: { saygi: 6, guven: -10 } }
              - hafiza: { npc: "aras_kurt", id: "yerde_birakti", agirlik: -40 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Kule'de {npc:aras_kurt|i} en kötü gecesinin önünde yerde bıraktın ve ödülü aldın.", en: "In the Spire you left {npc:aras_kurt} on the floor in front of his worst night and took the reward." }
            sonraki: "@akis"

      - id: "akd_kopru"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} uzun süre sessiz kalıyor. Sonra arkasını dönüp aynaya bakıyor; bilerek, bu sefer. \"Öğretici'de birini öldürmem gerekiyordu dedim ya,\" diyor. \"Yalan söylemedim. Kendimi. O gece korkuluğun dış tarafındaydım.\"", en: "{npc:aras_kurt} is quiet for a long time. Then he turns around and looks into the mirror. On purpose, this time. \"Back in the Tutorial I told you I was supposed to kill somebody,\" he says. \"I wasn't lying. Me. That night I was on the wrong side of the railing.\"" }
          - { tr: "\"Sonra gökyüzü açıldı ve bana bir sayı verdi. Seviye bir. Ertesi gün iki. Sıralama bana her sabah bir sebep veriyor. Sen beni geçtiğinde...\" Durup omuz silkiyor. \"Sebebim azalıyor.\"", en: "\"Then the sky opened and gave me a number. Level one. Next day, two. The Ranking hands me a reason every morning. When you pass me...\" He stops and shrugs. \"My reason gets smaller.\"" }
        secenekler:
          - id: "sebep"
            etiket: { tr: "\"O zaman başka bir sebep bulalım. Birlikte.\"", en: "\"Then let's find you another reason. Together.\"" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 4 }
              - bilgi: "aras_kopru"
              - iliski: { aras_kurt: { guven: 12, baglilik: 10 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} sıralamadan başka bir sebep bulmayı önerdin; o sebebi bir gün çok-evrenin kapısında buldu.", en: "You offered to help {npc:aras_kurt} find a reason besides the Ranking, and one day he found it at the gate to the multiverse." }
            sonraki: "@akis"
          - id: "kos"
            etiket: { tr: "\"O zaman koşmaya devam et. Ben de koşacağım.\"", en: "\"Then keep running. So will I.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - bilgi: "aras_kopru"
              - unvan: "ebedi_rakip"
              - bayrak: "aras_ebedi_rakip"
              - npc_isaret: { aras_kurt: "rakip" }
              - iliski: { aras_kurt: { saygi: 10, baglilik: 6 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} yarışın onun sebebi olmaya devam edeceğine söz verdin; ebedi rakipler oldunuz.", en: "You promised {npc:aras_kurt} the race would keep being his reason, and you became eternal rivals." }
            sonraki: "@akis"

      - id: "akd_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Bıçağının soğuk ağzı boğazında. Bu kez kimse saymıyor; yalnızca ayna izliyor. {npc:aras_kurt} bir an öyle duruyor, sonra bıçağı çekiyor.", en: "The cold edge of his blade is at your throat. Nobody's counting this time. Just the mirror, watching. {npc:aras_kurt} holds it there a moment, then pulls back." }
          - { tr: "\"Gördün mü?\" diye soruyor, kendi kendine, inanamayarak. \"Bugün ben.\" Sonra bekçiye dönüyor ve aynadaki köprüye bakmadan, tek başına, onu deviriyor.", en: "\"See that?\" he asks himself, like he can't believe it. \"Today it's me.\" Then he turns to the guardian and takes it down alone, without looking at the bridge in its mirror." }
        secenekler:
          - id: "tebrik"
            etiket: { tr: "\"Hak ettin.\"", en: "\"You earned it.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - npc_seviye: { aras_kurt: 3 }
              - iliski: { aras_kurt: { guven: 8, saygi: 6 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Kule'de {npc:aras_kurt|e} yenildin ve ona bunu hak ettiğini söyledin.", en: "You lost to {npc:aras_kurt} in the Spire and told him he'd earned it." }
            sonraki: "@akis"
          - id: "intikam"
            etiket: { tr: "\"Yüzüncü katta görüşürüz.\"", en: "\"See you on floor one hundred.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - npc_seviye: { aras_kurt: 3 }
              - npc_isaret: { aras_kurt: "rakip" }
              - bayrak: "aras_ebedi_rakip"
              - iliski: { aras_kurt: { saygi: 8 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Kule'de {npc:aras_kurt|e} yenildin ve yüzüncü katta rövanş sözü verdin.", en: "You lost to {npc:aras_kurt} in the Spire and promised him a rematch on floor one hundred." }
            sonraki: "@akis"

      - id: "akd_ortak"
        yer: "kule"
        paragraflar:
          - { tr: "Ayna bekçisi ortadan ikiye çatlıyor ve parçalar yere dökülürken her birinde aynı gecenin başka bir anı görünüyor. Senin odan. Onun köprüsü. Sonra cam toz oluyor.", en: "The mirror guardian cracks down the middle, and as the pieces hit the floor, every one shows a different moment of the same night. Your room. His bridge. Then the glass turns to dust." }
          - { tr: "{npc:aras_kurt} tozun içinde duruyor, kollarını iki yana bırakmış. \"Gördün,\" diyor. Soru değil.", en: "{npc:aras_kurt} is standing in the dust, arms hanging at his sides. \"You saw,\" he says. It isn't a question." }
          - { tr: "Sistem ödülü bölüyor; bunu nasıl yaptığını ikiniz de bilmiyorsunuz. [KAT 30 · ORTAK İLK · ÖDÜL PAYLAŞTIRILDI]. Sanki o da bir an duygusallaşmış gibi.", en: "The System splits the reward, and neither of you knows how. [FLOOR 30 · JOINT FIRST · REWARD SHARED]. Like even the System got a little sentimental for a second." }
        secenekler:
          - id: "gordum"
            etiket: { tr: "\"Gördüm. Sen de benimkini.\"", en: "\"I saw. You saw mine too.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
              - bayrak: "aras_gecesi_goruldu"
              - bilgi: "aras_kopru"
              - xp_seviye: 40
              - iliski: { aras_kurt: { guven: 12, baglilik: 10 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt} ile en kötü gecelerinizi aynı aynada gördünüz ve bir rekabetin altında bir dostluk başladı.", en: "You and {npc:aras_kurt} saw your worst nights in the same mirror, and under the rivalry, a friendship started." }
            sonraki: "@akis"
          - id: "gormedim"
            etiket: { tr: "\"Hiçbir şey görmedim.\" Yalan söyle", en: "\"Didn't see a thing.\" Lie" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - bayrak: "aras_gecesi_goruldu"
              - xp_seviye: 40
              - iliski: { aras_kurt: { guven: 4, saygi: 6 } }
            kronik: { tr: "{npc:aras_kurt|in} gecesini görmemiş gibi yaptın; o, bunun bir lütuf olduğunu anladı.", en: "You pretended you hadn't seen {npc:aras_kurt|pos} night, and he understood that was a kindness." }
            sonraki: "@akis"

      - id: "akd_ortak_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Ayna ikinizi de yere seriyor; ikinizin de en kötü gecesi aynı anda üstünüze kapanıyor. Bir süre kim olduğunu, nerede olduğunu bilmiyorsun.", en: "The mirror puts you both on the floor. Both your worst nights close over you at once. For a while you don't know who you are, or where." }
          - { tr: "Kendine geldiğinde {npc:aras_kurt} seni merdivenden aşağı sürüklemiş; ayna katın kapısı kapanmış. \"Bugün değil,\" diyor, soluk soluğa. \"İkimiz için de bugün değil.\"", en: "When you come to, {npc:aras_kurt} has dragged you down the stairs, and the mirror floor's door is shut. \"Not today,\" he says, gasping. \"Not today for either of us.\"" }
        secenekler:
          - id: "borc"
            etiket: { tr: "\"Bir borcum var sana.\"", en: "\"I owe you one.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { aras_kurt: { guven: 8, baglilik: 6 } }
              - hafiza: { npc: "aras_kurt", id: "kurtardi_borc", agirlik: 40 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Ayna katında {npc:aras_kurt} seni merdivenlerden sürükleyerek kurtardı ve sen ona bir borç verdin.", en: "On the mirror floor {npc:aras_kurt} dragged you down the stairs to safety, and you owed him one." }
            sonraki: "@akis"

      - id: "akd_birak"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivenden geri iniyorsun. Arkanda bir süre hiç ses gelmiyor; sonra cam kırılıyor, sonra bir bağırış, sonra uzun bir sessizlik.", en: "You head back down the stairs. Behind you, for a while, nothing. Then glass breaking, then a shout, then a long silence." }
          - { tr: "Akşam Sıralama güncelleniyor: [KAT 30 · İLK: {npc:aras_kurt|tam}]. Adının yanında küçük bir not var, onu yalnızca sen görüyorsun: [yalnız].", en: "That evening the Ranking refreshes: [FLOOR 30 · FIRST: {npc:aras_kurt|tam}]. There's a little note by his name that only you can see: [alone]." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bu kez onun olsun", en: "Let this one be his" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { aras_kurt: { baglilik: 4 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Kule'nin bir katını {npc:aras_kurt|e} bıraktın; o katı yalnız kazandı.", en: "You left a floor of the Spire to {npc:aras_kurt}, and he won it alone." }
            sonraki: "@akis"

      - id: "akd_ezme"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} bıçağını çekmeye fırsat bulamadan ayna toz oluyor. Senin odan, onun köprüsü; hepsi aynı anda yere dökülüyor ve sessizleşiyor.", en: "The mirror's dust before {npc:aras_kurt} can even draw. Your room, his bridge, all of it pours onto the floor at once and goes quiet." }
          - { tr: "Bıçağını hâlâ yarı çekmiş tutuyor. \"Bir satır,\" diyor. \"Kat otuz senin için bir satırdı.\" Sonra bıçağı kınına koyup sana dönüyor; gözlerinde korku ve ondan daha tehlikeli bir şey: açlık.", en: "He's still holding the knife half drawn. \"One line,\" he says. \"Floor thirty was one line for you.\" Then he sheathes it and turns to you, and his eyes have fear in them, and something more dangerous than fear: hunger." }
        secenekler:
          - id: "yetis"
            etiket: { tr: "\"Yetiş bana.\"", en: "\"Catch up.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - bayrak: "aras_ebedi_rakip"
              - unvan: "ebedi_rakip"
              - npc_seviye: { aras_kurt: 2 }
              - iliski: { aras_kurt: { saygi: 8, baglilik: 6 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} sana yetişmesini söyledin; bütün bir yılı bunu denemekle geçirdi.", en: "You told {npc:aras_kurt} to catch up, and he spent a whole year trying." }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "\"Sana bırakmalıydım.\"", en: "\"I should've left it to you.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 4, saygi: -2 } }
            kronik: { tr: "{npc:aras_kurt|in} katını elinden aldıktan sonra özür diledin; o özrü sevmedi, ama hatırladı.", en: "You apologized after taking {npc:aras_kurt|pos} floor out from under him. He didn't like the apology, but he remembered it." }
            sonraki: "@akis"

      - id: "akd_ayna"
        yer: "kule"
        paragraflar:
          - { tr: "Aynanın önüne geçiyorsun; bekçinin camı yalnızca seni gösteriyor artık, senin odanı. Arkanda {npc:aras_kurt} kımıldamıyor; sırtını görüyor, aynayı değil.", en: "You step in front of the mirror, and now its glass only shows you, your room. Behind you, {npc:aras_kurt} doesn't move. He's looking at your back, not the mirror." }
          - { tr: "Bekçiyi deviriyorsun; senin gecen camla birlikte dağılıyor. {npc:aras_kurt} toza bakıyor, sonra sana. \"Bunu neden yaptın?\" diye soruyor. \"Sıralamada bana bir şey kazandırmıyor.\"", en: "You take the guardian down, and your night breaks apart with the glass. {npc:aras_kurt} looks at the dust, then at you. \"Why'd you do that?\" he asks. \"It doesn't get me anything on the Ranking.\"" }
        secenekler:
          - id: "cunku"
            etiket: { tr: "\"Çünkü sıralama her şey değil.\"", en: "\"Because the Ranking isn't everything.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - xp_seviye: 40
              - iliski: { aras_kurt: { guven: 8, baglilik: 8 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 60, max: 120 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} sıralamanın her şey olmadığını gösterdin; o bunu bir köprüde değil, bir Kule katında öğrendi.", en: "You showed {npc:aras_kurt} the Ranking isn't everything. He learned it on a floor of the Spire instead of on a bridge." }
            sonraki: "@akis"

  # ================================================================== ARAS · P3: çok-evren kapısı
  - id: "aras_cok_evren_kapisi"
    perde: [3]
    gun: { min: 200, max: 300 }
    kosul: { bayrak: ["cok_evren_acik", "aras_tanisildi"] }
    agirlik: 8
    etiketler: ["aras", "rakip", "cok_evren", "kule"]
    gerilim: 3
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "Öbür taraf", en: "The other side" }
    sahne: "ace_1"
    sahneler:
      - id: "ace_1"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin ellinci katının arkasındaki geçit, havada asılı dikey bir deniz gibi; içinde başka gökyüzleri dalgalanıyor. Eşiğinde siyah ceketli biri oturmuş, çakısıyla bir elma soyuyor.", en: "The gate behind the Spire's fiftieth floor hangs in the air like a sea turned on its side, other skies rippling inside it. Someone in a black jacket is sitting on the threshold, peeling an apple with a pocketknife." }
          - { tr: "\"Elmayı nereden bulduğumu sorma,\" diyor {npc:aras_kurt}. \"Seni bekliyordum. Öbür taraf. Bir sürü dünya. İlk kim geçecek?\" Elmanın yarısını sana atıyor.", en: "\"Don't ask where I found the apple,\" {npc:aras_kurt} says. \"I was waiting for you. The other side. A whole lot of worlds. Who goes through first?\" He tosses you half the apple." }
          - { tr: "Geçidin öbür yanında, dalgalanan bir gökyüzünün altında uzun, ince bir figür duruyor; insan değil. Bakışları {npc:aras_kurt|in} üstünde, sabırlı ve hesaplı. Elinde, ışık saçan bir şey tutuyor.", en: "On the far side of the gate, under a rippling sky, stands a tall, thin figure. Not human. Its eyes are on {npc:aras_kurt}, patient and calculating. It's holding something that glows." }
          - metin: { tr: "Ayna katından beri {npc:aras_kurt} sana farklı bakıyor; rakibine değil, köprüyü gören tek kişiye bakar gibi.", en: "Ever since the mirror floor, {npc:aras_kurt} has looked at you differently. Not like a rival. Like the only person who's seen the bridge." }
            kosul: { bayrak: "aras_gecesi_goruldu" }
        sezgiler:
          - kosul: { stat: { per: 150 } }
            metin: { tr: "Figürün elindeki şey bir {fraksiyon:kadimler} çekirdeği. Onu yutan bir insan bir gecede S kademesine sıçrar. Bedeli tasmadır; gözcünün dilinde 'sahiplik' diye geçiyor.", en: "The thing in the figure's hand is a core from {fraksiyon:kadimler}. A human who swallows it jumps to S-Grade overnight. The price is a leash; in the scout's language the word is 'ownership.'" }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o gözcü onu seçti. seni değil. seni satın alamayacaklarını biliyorlar. onu alabileceklerini düşünüyorlar.", en: "that scout picked him. not you. they know they can't buy you. they think they can buy him." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"Birlikte geçelim. Yan yana.\"", en: "\"We go through together. Side by side.\"" }
            gerekli: { iliski_min: { aras_kurt: { guven: 20 } } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 4 }
              - iliski: { aras_kurt: { guven: 12, baglilik: 12 } }
            kronik: { tr: "Çok-evren geçidinden {npc:aras_kurt} ile yan yana geçtin; rakibin yoldaşın oldu.", en: "You went through the multiverse gate side by side with {npc:aras_kurt}, and your rival became your companion." }
            sonraki: "ace_birlikte"
          - id: "yaris"
            etiket: { tr: "\"Yarış. Kim önce?\"", en: "\"Race you. Who's first?\"" }
            zar: { stat: "agi", zorluk: 24, tek: true, basarisiz: "ace_yaris_kaybet", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }, { npc_seviye: { aras_kurt: 3 } }] }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - npc_isaret: { aras_kurt: "rakip" }
              - bayrak: "aras_ebedi_rakip"
              - iliski: { aras_kurt: { saygi: 10 } }
            kronik: { tr: "Çok-evrenin kapısında {npc:aras_kurt} ile yarıştın; yarış hiç bitmedi.", en: "You raced {npc:aras_kurt} at the gate to the multiverse, and that race never ended." }
            sonraki: "ace_yaris_kazan"
          - id: "uyar"
            etiket: { tr: "\"Öbür taraftaki gözcü seni istiyor. Alma.\"", en: "\"That scout over there wants you. Don't take it.\"" }
            zar: { stat: "cha", zorluk: 22, tek: true, basarisiz: "ace_teklif", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }, { bayrak: "aras_kadim_teklifini_aldi" }, { bilgi: "aras_kadim_teklifi" }] }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - bayrak: "aras_kadim_teklifi_reddedildi"
              - bilgi: "aras_kadim_teklifi"
              - degisken: { kadim_tehdit: -3 }
              - iliski: { aras_kurt: { guven: 10, saygi: 4 } }
            kronik: { tr: "{npc:aras_kurt|i} bir Kadim gözcüsünün kısayolundan caydırdın; zirveye kendi ayaklarıyla tırmanmayı seçti.", en: "You talked {npc:aras_kurt} out of an Ancient scout's shortcut, and he chose to climb to the top on his own feet." }
            sonraki: "ace_red"
          - id: "goz"
            tur: "aciga_vur"
            etiket: { tr: "Gözcüye gerçek gücünü göster; teklif geri çekilsin", en: "Show the scout what you really are. Make it back off" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, insanlik: -3 }
              - degisken: { kadim_tehdit: -4 }
              - bayrak: "aras_kadim_teklifi_reddedildi"
              - bilgi: "aras_kadim_teklifi"
              - iliski: { aras_kurt: { korku: 10, saygi: 10, guven: -6 } }
            kronik: { tr: "Bir Kadim gözcüsü senin bir bakışınla geri çekildi; {npc:aras_kurt} onların asıl kimi istediğini o gün anladı.", en: "An Ancient scout backed off at one look from you, and that day {npc:aras_kurt} understood who they really wanted." }
            sonraki: "ace_goz"
          - id: "yalniz"
            etiket: { tr: "Elmayı geri at ve tek başına geç", en: "Toss back the apple and go through alone" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -2 }
              - npc_isaret: { aras_kurt: "rakip" }
              - iliski: { aras_kurt: { guven: -8, saygi: 4 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Çok-evrenin kapısında {npc:aras_kurt|i} arkanda bıraktın; gözcüyle yalnız kaldı.", en: "At the gate to the multiverse you left {npc:aras_kurt} behind, alone with the scout." }
            sonraki: "ace_teklif"

      - id: "ace_birlikte"
        yer: "kule"
        paragraflar:
          - { tr: "Eşikte omuz omuza duruyorsunuz. {npc:aras_kurt} bir an gözcüye bakıyor, elindeki ışığa; sonra başını çeviriyor. \"Yalnız tırmanmaktan sıkıldım,\" diyor, sana bakmadan. \"Kimseye söyleme.\"", en: "You stand shoulder to shoulder on the threshold. {npc:aras_kurt} glances at the scout, at the light in its hand, then turns his head away. \"I'm sick of climbing alone,\" he says, not looking at you. \"Don't tell anybody.\"" }
          - { tr: "Geçide aynı anda adım atıyorsunuz. Sistem, hiç olmadığı kadar şaşkın bir satır düşüyor: [ÇOK-EVREN · İLK GEÇİŞ · İKİ İSİM · SIRALAMA BELİRSİZ].", en: "You step into the gate at the same instant. The System drops a line that sounds more confused than it's ever been: [MULTIVERSE · FIRST CROSSING · TWO NAMES · RANKING UNDETERMINED]." }
          - { tr: "Öbür tarafta başka bir gökyüzünün altında duruyorsunuz. {npc:aras_kurt} gülüyor, eskisi gibi, yeni bir oyuncak bulmuş bir çocuk gibi. \"Takvim değişti,\" diyor. \"Artık ikimiz için.\"", en: "You're standing under another sky on the other side. {npc:aras_kurt} laughs, the old way, like a kid who just found a brand-new toy. \"Schedule's changed,\" he says. \"It's for both of us now.\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "Elini uzat: \"Takım.\"", en: "Hold out a hand: \"Team.\"" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -1 }
              - yoldas_katil: "aras_kurt"
              - bayrak: "aras_cok_evren_yoldasi"
              - bayrak: "aras_kadim_teklifi_reddedildi"
              - hafiza: { npc: "aras_kurt", id: "olay:aras_cok_evren_kapisi", agirlik: 60 }
              - xp_seviye: 60
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Çok-evrende {npc:aras_kurt} ile takım oldunuz; Sıralama sizi bir daha ayırt edemedi.", en: "In the multiverse you and {npc:aras_kurt} became a team, and the Ranking could never tell you apart again." }
            sonraki: "@akis"

      - id: "ace_yaris_kazan"
        yer: "kule"
        paragraflar:
          - { tr: "İkiniz aynı anda fırlıyorsunuz ama geçidin yüzeyine önce senin elin değiyor. Dalga senin etrafında kapanıyor; arkanda {npc:aras_kurt|in} kahkahası, öfkeli ve mutlu, aynı anda.", en: "You both launch at once, but your hand breaks the gate's surface first. The wave closes around you, and behind you, {npc:aras_kurt} is laughing, furious and happy at the same time." }
          - { tr: "[ÇOK-EVREN · İLK GEÇİŞ: {oyuncu}]. Sonra, bir saniye sonra: [İKİNCİ: {npc:aras_kurt|tam}]. Gözcü elindeki ışığı yavaşça indiriyor; bu yarışta satılık kimse yok.", en: "[MULTIVERSE · FIRST CROSSING: {oyuncu}]. Then, one second later: [SECOND: {npc:aras_kurt|tam}]. The scout slowly lowers the light in its hand. Nobody in this race is for sale." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Dön ve iki parmakla selam ver", en: "Turn around and give him a two-finger salute" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - unvan: "ebedi_rakip"
              - bayrak: "aras_kadim_teklifi_reddedildi"
              - iliski: { aras_kurt: { saygi: 8, baglilik: 6 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Çok-evrene ilk sen geçtin ve {npc:aras_kurt} bir saniye arkandan geldi; ebedi rakiplerin selamı oydu.", en: "You crossed into the multiverse first and {npc:aras_kurt} came one second behind. That salute belonged to eternal rivals." }
            sonraki: "@akis"

      - id: "ace_yaris_kaybet"
        yer: "kule"
        paragraflar:
          - { tr: "Geçit yarım adımlığına seni itiyor; yarım adım yetiyor. {npc:aras_kurt} dalganın içine dalıyor ve kaybolmadan önce dönüp iki parmağıyla göğsüne vuruyor.", en: "The gate shoves you back half a step, and half a step's plenty. {npc:aras_kurt} dives into the wave and, right before he vanishes, turns and taps two fingers on his chest." }
          - { tr: "[ÇOK-EVREN · İLK GEÇİŞ: {npc:aras_kurt|tam}]. Gözcü elindeki ışıkla onun peşinden yürüyor; sabırlı, hesaplı.", en: "[MULTIVERSE · FIRST CROSSING: {npc:aras_kurt|tam}]. The scout follows him with the light in its hand. Patient. Calculating." }
        secenekler:
          - id: "pesinden"
            etiket: { tr: "Peşinden dal; gözcüye fırsat verme", en: "Dive after him. Don't give the scout a chance" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { aras_kurt: { guven: 6 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Çok-evrene {npc:aras_kurt} ilk geçti; sen bir Kadim gözcüsünü ondan uzak tutmak için peşinden daldın.", en: "{npc:aras_kurt} crossed into the multiverse first, and you dove in after him to keep an Ancient scout away." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bırak. Kendi seçimini yapsın", en: "Let it go. His choice to make" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - bayrak: "aras_kadim_teklifini_aldi"
              - bilgi: "aras_kadim_teklifi"
              - degisken: { kadim_tehdit: 3 }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "Bir Kadim gözcüsünü {npc:aras_kurt|in} peşinden geçitten geçerken izledin ve durdurmadın.", en: "You watched an Ancient scout follow {npc:aras_kurt} through the gate and didn't stop it." }
            sonraki: "@akis"

      - id: "ace_red"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} gözcüye uzun süre bakıyor; sonra elmanın son dilimini geçidin içine fırlatıyor. Dilim dalgalanan bir gökyüzünde kayboluyor.", en: "{npc:aras_kurt} stares at the scout for a long time. Then he flicks the last slice of apple through the gate, and it disappears into a rippling sky." }
          - { tr: "\"Kısayol,\" diyor. \"Biliyor musun, o köprüde de bir kısayol vardı. Almadım. Bunu da almayacağım.\" Gözcü ışığı indiriyor ve dalgaların içine geri çekiliyor.", en: "\"Shortcut,\" he says. \"You know, there was a shortcut on that bridge too. I didn't take it. Not taking this one either.\" The scout lowers the light and fades back into the waves." }
        secenekler:
          - id: "gec"
            etiket: { tr: "\"Hadi o zaman. Uzun yoldan.\"", en: "\"Come on, then. The long way.\"" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { aras_kurt: { baglilik: 10 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt} ile çok-evrene uzun yoldan, kısayolsuz girdiniz.", en: "You and {npc:aras_kurt} entered the multiverse the long way, no shortcuts." }
            sonraki: "ace_birlikte"

      - id: "ace_goz"
        yer: "kule"
        paragraflar:
          - { tr: "Gözcüye bakıyorsun; yalnızca bakıyorsun. Geçidin öbür tarafındaki dalgalar bir an duruyor. Gözcü ışığı göğsüne bastırıyor, eğiliyor; sonra senin önünde, {npc:aras_kurt|in} değil, diz çöküyor.", en: "You look at the scout. That's all, just look. On the far side of the gate the waves go still for a beat. The scout presses the light to its chest and bows. Then it kneels in front of you, not {npc:aras_kurt}." }
          - { tr: "{npc:aras_kurt} bunu izliyor. \"Demek bana teklif ettikleri şey,\" diyor yavaşça, \"senin artığındı.\" Sesinde ne öfke var ne kıskançlık; yalnızca yorgunluk.", en: "{npc:aras_kurt} watches it happen. \"So the thing they offered me,\" he says slowly, \"was your leftovers.\" No anger in it. No jealousy. Just tired." }
        secenekler:
          - id: "hayir"
            etiket: { tr: "\"Hayır. Sen benden çok daha ucuza gitmezsin.\"", en: "\"No. You don't go cheaper than me.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 6, saygi: 4 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} kimsenin artığı olmadığını söyledin; o bunu kanıtlamaya karar verdi.", en: "You told {npc:aras_kurt} he was nobody's leftovers, and he decided to prove it." }
            sonraki: "@akis"
          - id: "dogru"
            etiket: { tr: "\"Evet. Kabul et ve geç.\"", en: "\"Yeah. Accept it and move on.\"" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 2 }
              - npc_isaret: { aras_kurt: "rakip" }
              - iliski: { aras_kurt: { guven: -10, saygi: 6 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt|e} senin gölgende kalacağını söyledin; o gölgeden çıkmak için her şeyi göze aldı.", en: "You told {npc:aras_kurt} he'd always be in your shadow, and he risked everything to get out of it." }
            sonraki: "@akis"

      - id: "ace_teklif"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:aras_kurt} geçidin eşiğinde gözcüyle yüz yüze. Gözcü ışığı ona uzatıyor; konuşmuyor, gerek yok. {npc:aras_kurt} ışığa bakıyor, sonra sana, sonra Sıralama'ya.", en: "{npc:aras_kurt} is face to face with the scout on the threshold. The scout holds the light out to him. It doesn't speak. It doesn't need to. {npc:aras_kurt} looks at the light, then at you, then at the Ranking." }
          - { tr: "\"Bir kez,\" diyor. \"Bir kez senden önce olmak istiyorum. Bir kez.\" Işığı alıp ceketinin iç cebine koyuyor. Gözcü eğiliyor ve dalgaların içine geri çekiliyor.", en: "\"Once,\" he says. \"Just once I want to be ahead of you. Once.\" He takes the light and tucks it into his jacket's inside pocket. The scout bows and fades back into the waves." }
        secenekler:
          - id: "uyari"
            etiket: { tr: "\"O ışık seni yiyecek.\"", en: "\"That light's going to eat you alive.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - bayrak: "aras_kadim_teklifini_aldi"
              - bilgi: "aras_kadim_teklifi"
              - degisken: { kadim_tehdit: 3 }
              - iliski: { aras_kurt: { guven: 2, saygi: 2 } }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt} bir Kadim'in kısayolunu cebine koydu; sen onu uyardın, o yine de koydu.", en: "{npc:aras_kurt} pocketed an Ancient's shortcut. You warned him, and he pocketed it anyway." }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme", en: "Say nothing" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
              - bayrak: "aras_kadim_teklifini_aldi"
              - bilgi: "aras_kadim_teklifi"
              - degisken: { kadim_tehdit: 4 }
              - tohum: { olay: "aras_s_kademe", gecikme: { min: 130, max: 150 }, kosul: { perde: 4, npc_hayatta: "aras_kurt" } }
            kronik: { tr: "{npc:aras_kurt} bir Kadim'in kısayolunu alırken sustun.", en: "You kept quiet while {npc:aras_kurt} took an Ancient's shortcut." }
            sonraki: "@akis"

  # ================================================================== ARAS · P4: S kademe insan
  - id: "aras_s_kademe"
    perde: [4]
    ana_yay: { gun: 339 }
    kosul: { bayrak: "aras_tanisildi" }
    agirlik: 1
    etiketler: ["aras", "ana_yay", "rakip", "siralama"]
    gerilim: 4
    npc: ["aras_kurt"]
    onemli: true
    kart: { tr: "İlk S", en: "The first S" }
    sahne: "ask_1"
    sahneler:
      - id: "ask_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı bütün gezegende aynı pencere açılıyor: [S KADEMESİ EŞİĞİ AÇIK · İLK İNSAN BEKLENİYOR]. Kule'nin tepesinde, gökyüzüne en yakın noktada, bir ışık sütunu yanıyor.", en: "At midnight the same window opens across the whole planet: [S-GRADE THRESHOLD OPEN · AWAITING FIRST HUMAN]. At the top of the Spire, the point closest to the sky, a column of light is burning." }
          - { tr: "Işığın dibinde siyah bir ceket. {npc:aras_kurt} eşiğin bir adım gerisinde duruyor; nefes nefese, yorgun, bir yılın bütün basamaklarını çıkmış biri gibi. Seni görünce sırıtıyor. \"Takvim,\" diyor. \"Bu gece.\"", en: "At the foot of the light, a black jacket. {npc:aras_kurt} is one step short of the threshold, breathing hard, worn out, like someone who's climbed every step of a whole year. He grins when he sees you. \"The schedule,\" he says. \"Tonight.\"" }
          - metin: { tr: "Ceketinin iç cebi ışıyor: Kadim gözcüsünün çekirdeği. Damarları mavi değil artık, altın; yüzünde tanımadığın bir şeyin gölgesi var.", en: "His inside jacket pocket is glowing: the Ancient scout's core. His veins aren't blue anymore. They're gold. There's the shadow of something you don't recognize on his face." }
            kosul: { bayrak: "aras_kadim_teklifini_aldi" }
          - metin: { tr: "\"Bunu birlikte yapalım,\" diyor, sesi alçak. \"Ama ilk ben olayım, tamam mı? Bir kere. Köprüdeki o adam için. Bir kere.\"", en: "\"Let's do this together,\" he says, low. \"But let me be first, okay? Just once. For the guy on that bridge. Once.\"" }
            kosul: { yoldas: "aras_kurt" }
          - metin: { tr: "Sistem bir satır daha düşüyor, yalnızca senin pencerene: [GİZLİ: TAŞIYICI ZATEN EŞİKTE · İLAN BEKLENİYOR]. Sen zaten oradasın. Kimse bilmiyor.", en: "The System drops one more line, into your window only: [HIDDEN: HOST ALREADY AT THRESHOLD · AWAITING DECLARATION]. You're already there. Nobody knows." }
            kosul: { kademe_min: "S" }
        sezgiler:
          - kosul: { stat: { per: 400 } }
            metin: { tr: "Eşik bir kapı değil, bir unvan. İlk geçen insan sonsuza dek 'ilk' olarak yazılacak; ikinci ise Sıralama'da yalnızca bir sayı.", en: "The threshold isn't a door. It's a title. The first human through gets written down as 'first' forever. The second is just a number on the Ranking." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ona bırakırsan tarih onu yazar. bırakmazsan seni. ikisinde de o köprüdeki adam bir şey kazanır ya da kaybeder. senin bir şey kaybetmen gerekmiyor.", en: "let him have it and history writes him. don't, and it writes you. either way the man from that bridge wins or loses something. you don't have to lose anything." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bir adım geri çekil. İlk o olsun", en: "Take a step back. Let him be first" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - bayrak: "aras_s_kademe"
              - npc_seviye: { aras_kurt: 40 }
              - iliski: { aras_kurt: { guven: 12, baglilik: 12, saygi: 8 } }
            kronik: { tr: "S kademesine ulaşan ilk insan {npc:aras_kurt} oldu; çünkü sen bir adım geri çekildin.", en: "{npc:aras_kurt} became the first human to reach S-Grade, because you took one step back." }
            sonraki: "ask_ilk"
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "\"İlk zaten burada.\" Kendini ilan et", en: "\"The first is already here.\" Declare yourself" }
            goster: { kademe_min: "S" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 3, insanlik: -4 }
              - iliski: { aras_kurt: { saygi: 10, guven: -10, korku: 8 } }
            kronik: { tr: "S kademesine ulaşan ilk insan olduğunu bütün gezegene ilan ettin; {npc:aras_kurt} eşiğin bir adım gerisinde kaldı.", en: "You declared to the whole planet that you were the first human to reach S-Grade, and {npc:aras_kurt} was left one step short of the threshold." }
            sonraki: "ask_ilan"
          - id: "durdur"
            etiket: { tr: "\"O çekirdeği bırak. Seni yiyecek.\"", en: "\"Drop that core. It'll eat you.\"" }
            goster: { bayrak: "aras_kadim_teklifini_aldi" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { kadim_tehdit: -5 }
              - savas: { dusmanlar: ["aras_kurt_golge@oyuncu+6"], ortam: ["dar_gecit"], kazan: "ask_kurtardi", kaybet: "ask_altin" }
            kronik: { tr: "{npc:aras_kurt|i} bir Kadim çekirdeğiyle S kademesine sıçramaktan zorla durdurmaya kalktın.", en: "You tried to stop {npc:aras_kurt} by force from jumping to S-Grade on an Ancient's core." }
          - id: "duello"
            etiket: { tr: "\"Son bir yarış. Kim önce.\"", en: "\"One last race. Whoever's first.\"" }
            goster: { bayrak_yok: "aras_kadim_teklifini_aldi" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: -1 }
              - savas: { dusmanlar: ["aras_kurt_golge@oyuncu+5"], kazan: "ask_durdu", kaybet: "ask_ilk" }
            kronik: { tr: "S kademesinin eşiğinde {npc:aras_kurt} ile son bir kez yarıştın.", en: "On the threshold of S-Grade you raced {npc:aras_kurt} one last time." }
          - id: "el"
            etiket: { tr: "Eşikte elini tut. Birlikte, ama o önde", en: "Take his hand at the threshold. Together, him in front" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 5 }
              - bayrak: "aras_s_kademe"
              - npc_seviye: { aras_kurt: 40 }
              - unvan: "iki_kisilik_zirve"
              - iliski: { aras_kurt: { baglilik: 15, guven: 10 } }
            kronik: { tr: "S kademesinin eşiğinden {npc:aras_kurt} ile el ele geçtiniz; tarih onu ilk, seni yanındaki olarak yazdı.", en: "You crossed the S-Grade threshold hand in hand with {npc:aras_kurt}. History wrote him first, and you right beside him." }
            sonraki: "ask_ilk"

      - id: "ask_ilk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} ışığın içine adım atıyor. Bir an hiçbir şey olmuyor; sonra bütün gezegendeki pencereler aynı anda kayıyor: [S KADEMESİ · İLK İNSAN: {npc:aras_kurt|tam}].", en: "{npc:aras_kurt} steps into the light. For a second nothing happens. Then every window on the planet slides over at once: [S-GRADE · FIRST HUMAN: {npc:aras_kurt|tam}]." }
          - { tr: "Işıktan çıktığında başka biri gibi duruyor; daha uzun değil, daha geniş değil, ama daha ağır, dünyanın ona biraz daha sıkı tutunduğu biri gibi. Sana bakıyor ve gülüyor, köprüde gülemediği o gülüşle.", en: "When he steps out of the light he stands like someone else. Not taller, not broader. Heavier, like the world's holding on to him a little tighter. He looks at you and laughs, the laugh he couldn't manage on that bridge." }
          - { tr: "\"İlk,\" diyor. \"Bir kere. Yetti.\" Sonra bir elma çıkarıp ikiye bölüyor ve yarısını sana atıyor.", en: "\"First,\" he says. \"Once. That's enough.\" Then he pulls out an apple, splits it in two, and tosses you half." }
        secenekler:
          - id: "elma"
            etiket: { tr: "Elmayı yakala ve bir ısırık al", en: "Catch the apple and take a bite" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - bayrak: "aras_s_kademe"
              - unvan: "ebedi_rakip"
              - iliski: { aras_kurt: { baglilik: 8, guven: 6 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:aras_kurt} insanlığın ilk S kademe insanı oldu ve yarım elmasını seninle paylaştı.", en: "{npc:aras_kurt} became humanity's first S-Grade human and split his apple with you." }
            sonraki: "@akis"
          - id: "selam"
            etiket: { tr: "İki parmakla selam ver; ilk kez sen", en: "Give him a two-finger salute. Your turn, for once" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 2 }
              - bayrak: "aras_s_kademe"
              - iliski: { aras_kurt: { saygi: 10 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "İlk S kademe insanı sen değil {npc:aras_kurt} oldu ve ona selamı ilk kez sen verdin.", en: "The first S-Grade human wasn't you, it was {npc:aras_kurt}, and for once you were the one who saluted." }
            sonraki: "@akis"

      - id: "ask_ilan"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gizlediğin her şeyi bırakıyorsun. Bütün gezegendeki pencereler bir saniyeliğine karıncalanıyor, sonra kayıyor: [S KADEMESİ · İLK İNSAN: {oyuncu} · KAYIT TARİHİ: ÇOKTAN].", en: "You let go of everything you've been hiding. Every window on the planet fuzzes for a second, then slides over: [S-GRADE · FIRST HUMAN: {oyuncu} · DATE LOGGED: A WHILE AGO]." }
          - { tr: "{npc:aras_kurt} eşiğin bir adım gerisinde donup kalıyor. \"Çoktan,\" diyor. \"Çoktan oradaydın. Ben bütün yıl sana yetişmeye çalıştım ve sen çoktan...\" Cümle bitmiyor.", en: "{npc:aras_kurt} freezes one step short of the threshold. \"A while ago,\" he says. \"You were already there. I spent the whole year trying to catch you, and you were already...\" The sentence doesn't finish." }
        secenekler:
          - id: "gel"
            etiket: { tr: "Elini uzat: \"İkinci olmak da bir şey. Gel.\"", en: "Reach out: \"Second's something too. Come on.\"" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - npc_seviye: { aras_kurt: 30 }
              - unvan: "ebedi_rakip"
              - iliski: { aras_kurt: { guven: 8, saygi: 6 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "İlk S kademe insanı olduğunu ilan ettin ve sonra ikinciye elini uzattın.", en: "You declared yourself the first S-Grade human, then held out your hand to the second." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Arkanı dön. Takvim bitti", en: "Turn your back. The schedule's over" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -3 }
              - iliski: { aras_kurt: { guven: -12, baglilik: -10 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "S kademesini ilan edip {npc:aras_kurt|e} arkanı döndün; onun takvimi o gece bitti.", en: "You declared S-Grade and turned your back on {npc:aras_kurt}. His schedule ended that night." }
            sonraki: "@akis"

      - id: "ask_kurtardi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çekirdek ceketinin cebinden kayıp ışık sütununun dibinde paramparça oluyor. {npc:aras_kurt|in} damarlarındaki altın yavaşça sönüyor; mavi geri geliyor, sonra sıradan, insan kırmızısı.", en: "The core slips out of his jacket pocket and shatters at the foot of the column of light. The gold in {npc:aras_kurt|pos} veins fades slowly. The blue comes back, then plain, human red." }
          - { tr: "Dizlerinin üstünde, soluk soluğa. \"Bir kere,\" diyor. \"Bir kere senden önce olacaktım.\" Sonra başını kaldırıyor; gözlerinde öfke yok. \"Ama onların tasmasıyla değil. Haklısın. Lanet olsun, haklısın.\"", en: "He's on his knees, gasping. \"Once,\" he says. \"Just once I was going to beat you.\" Then he lifts his head, and there's no anger in his eyes. \"But not on their leash. You're right. Damn it, you're right.\"" }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Onu kaldır. Eşiğe birlikte bakın", en: "Pull him up. Look at the threshold together" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 4 }
              - bayrak_kaldir: "aras_kadim_teklifini_aldi"
              - unvan: "ebedi_rakip"
              - iliski: { aras_kurt: { guven: 12, baglilik: 10 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:aras_kurt|i} bir Kadim tasmasından kurtardın; S kademesinin eşiğine kendi ayaklarıyla dönmeye karar verdi.", en: "You freed {npc:aras_kurt} from an Ancient's leash, and he decided to come back to the S-Grade threshold on his own feet." }
            sonraki: "@akis"

      - id: "ask_altin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Altın damarlar seni yere seriyor; {npc:aras_kurt|in} vuruşları artık insan hızında değil. Işık sütununa yürüyor ve içine adım atıyor.", en: "The gold veins put you on the ground. {npc:aras_kurt|pos} strikes aren't moving at human speed anymore. He walks to the column of light and steps in." }
          - { tr: "[S KADEMESİ · İLK İNSAN: {npc:aras_kurt|tam}]. Pencerelerde bir satır daha, küçük harflerle, yalnızca senin görebildiğin: [sahip: {fraksiyon:kadimler}].", en: "[S-GRADE · FIRST HUMAN: {npc:aras_kurt|tam}]. One more line in the windows, small print, only you can see it: [owner: {fraksiyon:kadimler}]." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"O tasmayı keseceğim. Söz.\"", en: "\"I'm cutting that leash. Promise.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - bayrak: "aras_s_kademe"
              - degisken: { kadim_tehdit: 4 }
              - npc_seviye: { aras_kurt: 40 }
              - iliski: { aras_kurt: { saygi: 6 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:aras_kurt} ilk S kademe insanı oldu; tasması Kadimler'in elindeydi.", en: "{npc:aras_kurt} became the first S-Grade human, and the Ancients held his leash." }
            sonraki: "@akis"

      - id: "ask_durdu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} ışığın bir adım dışında yere düşüyor. Bıçağı yanında; tutmaya uzanmıyor. Işık ikinizin arasında yanmaya devam ediyor, sabırla, birini bekleyerek.", en: "{npc:aras_kurt} drops one step outside the light. His knife's lying next to him. He doesn't reach for it. The light keeps burning between the two of you, patient, waiting for somebody." }
          - { tr: "\"Git,\" diyor. \"Sen geç. Ben... ben ikinci olmaya alışırım.\" Gülmeye çalışıyor; ilk kez beceremiyor.", en: "\"Go,\" he says. \"You go through. I'll... I'll get used to second.\" He tries to laugh, and for the first time, he can't." }
        secenekler:
          - id: "gecme"
            etiket: { tr: "Eşikten geçme. Işık beklesin", en: "Don't cross. Let the light wait" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - iliski: { aras_kurt: { guven: 10, baglilik: 8 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "{npc:aras_kurt|i} yendin ve S kademesinin eşiğinden geçmedin; ışık o gece kimseyi almadı.", en: "You beat {npc:aras_kurt} and didn't cross the S-Grade threshold. That night, the light took no one." }
            sonraki: "@akis"
          - id: "gec"
            etiket: { tr: "Geç. İlk sen ol", en: "Cross. Be first" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -3 }
              - xp_seviye: 150
              - unvan: "ebedi_rakip"
              - iliski: { aras_kurt: { saygi: 8, guven: -6 } }
              - tohum: { olay: "aras_zirve_sabahi", gecikme: { min: 1, max: 2 } }
            kronik: { tr: "S kademesinin eşiğinde {npc:aras_kurt|i} yendin ve ilk sen geçtin; o ikinci olmaya hiç alışamadı.", en: "You beat {npc:aras_kurt} at the S-Grade threshold and crossed first. He never did get used to second." }
            sonraki: "@akis"

  # ================================================================== ARAS · tohum: zirve sabahı (koda)
  - id: "aras_zirve_sabahi"
    perde: [4]
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["aras", "nefes"]
    gerilim: 1
    npc: ["aras_kurt"]
    kart: { tr: "Elma", en: "The apple" }
    sahne: "azs_1"
    sahneler:
      - id: "azs_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sabah, Kule Dibi'nde bir otobüs durağının çatısında {npc:aras_kurt|i} buluyorsun; çakısıyla bir elma soyuyor. Elmayı nereden bulduğunu bu kez soruyorsun.", en: "Morning, and you find {npc:aras_kurt} on top of a bus shelter at {yer:kule_dibi}, peeling an apple with his pocketknife. This time you ask where he found the apple." }
          - { tr: "\"Pirinç Kervan'dan,\" diyor. \"Çok-evrende elma var. Komik, değil mi? Her dünyada elma var.\" Sonra bıçağı katlayıp sana uzatıyor. \"Al. Bende bir sürü var. Bunu sen tut.\"", en: "\"Off the Brass Caravan,\" he says. \"They've got apples out there in the multiverse. Funny, right? Every world's got apples.\" Then he folds the knife and holds it out. \"Here. I've got a bunch. You keep this one.\"" }
          - metin: { tr: "Sıralamada adı seninkinin üstünde. Bunu bir kez bile söylemiyor.", en: "His name's above yours on the Ranking. He doesn't mention it once." }
            kosul: { bayrak: "aras_s_kademe" }
          - { tr: "\"Köprüye gittim dün gece,\" diyor. \"Korkuluğun doğru tarafında durdum. Uzun süre. Sonra sana bir elma bulmaya gittim.\"", en: "\"Went to the bridge last night,\" he says. \"Stood on the right side of the railing. A long time. Then I went to find you an apple.\"" }
        secenekler:
          - id: "caki"
            etiket: { tr: "Çakıyı al", en: "Take the knife" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - esya: { aras_cakisi: 1 }
              - iliski: { aras_kurt: { baglilik: 8, guven: 6 } }
            sonraki: "@akis"
          - id: "yarin"
            etiket: { tr: "\"Yarın yine yarışalım mı?\"", en: "\"Race again tomorrow?\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 6, baglilik: 4 } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "\"Gel. Sana birini tanıştıracağım. Vapurda.\"", en: "\"Come on. Want you to meet someone. On the ferry.\"" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 1 }
              - iliski: { aras_kurt: { guven: 6 } }
              - iliski: { deniz_arman: { baglilik: 4 } }
              - tohum: { olay: "deniz_vapur_vedasi", gecikme: { min: 1, max: 2 }, kosul: { npc_hayatta: "deniz_arman" } }
            sonraki: "@akis"
