# Bölüm 13 (Kapı Fırtınası, gün 261–292) · bölge olayları, üs olayları, saha kampı sahneleri (DECISIONS #144, bölge brifi).
# Kule Dibi (7): bl13_kd_police → bl13_kd_police_liste · bl13_kd_bekci → bl13_kd_bekci_halka · bl13_kd_catilar (→ bl13_us_kapidakiler)
#   · bl13_kd_alay (tohum: bl13_tepe_prova) · bl13_kd_oymaci (tohum: bl13_kervan_oyma). Kamp (3): bl13_kamp_deniz, bl13_kamp_mert, bl13_kamp_elif.
# Üs (3, hepsi tohum): bl13_us_kapidakiler (bl13_kd_catilar, bl13_sanayi_sac, bl13_kordon_samandira) · bl13_us_can (bl13_batik_canlar)
#   · bl13_us_kurye (bl13_taht_bahis).
# Tek olaylı bölgeler: bl13_kervan_oyma, bl13_tepe_prova, bl13_taht_bahis, bl13_sanayi_sac, bl13_batik_canlar, bl13_kordon_samandira.
# Bölümün ortak izi: kapılar aynı ritimle atıyor (dört vuruş, bir es); merkez Sanayi'deki eski döküm fırını; fırtına gün 292.
# Bazı sonuçlar fırtına gecesinin hayatta_kalan sayacını oynatır. Yankı'nın sözleri küçük harfli ve tırnaksız.
olaylar:
  # ================================================================== KULE DİBİ · FIRTINA POLİÇESİ (1/2)
  - id: "bl13_kd_police"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 262, max: 286 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "kule_dibi", "kapi", "toplum"]
    gerilim: 2
    kart: { tr: "Fırtına poliçesi", en: "Storm Coverage" }
    sahne: "bl13_kd_police_1"
    sahneler:
      - id: "bl13_kd_police_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} pazarında tezgâhların yarısı kapanmış. Açık kalanlar fırtına malı satıyor: kum torbası, pilli fener, herkesin kapı kokusunu bastırdığına yemin ettiği kaba tuz. Kalabalık en çok bir masanın önüne yığılmış.", en: "Half the stalls in the {yer:kule_dibi} market have shut down. The ones still open are selling storm goods: sandbags, battery lanterns, coarse salt that everybody swears kills the Gate smell. The biggest crowd is packed around one table." }
          - { tr: "Masanın başında kravatını gevşetmiş bir adam karton kartlar dağıtıyor. Her kartın tepesinde bir mühür, altında bir avcının adı ve seviyesi yazılı. \"Fırtına poliçesi!\" diye bağırıyor. \"Kapı sizin sokakta açılırsa kartta adı yazan avcı yarım saatte kapınızda olur. Üç kristale ömür boyu güvence!\"", en: "A guy with his tie loosened is handing out cardboard cards. Each one has a seal at the top and a hunter's name and level underneath. \"Storm coverage!\" he's yelling. \"Gate opens on your street, the hunter on your card is at your door in thirty minutes. Three crystals, lifetime guarantee!\"" }
          - { tr: "Kartı alanlardan kimi göğüs cebine tıkıyor, kimi cüzdanına yerleştiriyor, kimi ipe geçirip çocuğunun boynuna asıyor. Adamın arkasındaki panoda tebeşirle yazılmış bir sayı duruyor: 412 poliçe. Sayının altında altı avcının adı var, yalnızca altı.", en: "People tuck the cards into shirt pockets, slide them into wallets, string them on cords and hang them around their kids' necks. On the board behind him, in chalk: 412 policies sold. Under that number are the names of six hunters. Just six." }
          - metin: { tr: "Kuyruktakilerin çoğu {yer:kordon|den} kaçıp gelmiş. O gece kimse yetişmemişti; bu kez birinin geleceğine dair yazılı bir söz istiyorlar, karton da olsa.", en: "Most of the people in line got out of {yer:kordon}. Nobody came for them that night. This time they want it in writing that somebody will, even if it's on cardboard." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Kartlardaki mühür Lonca halkasına benzetilmiş. Yakından bakınca halkanın ters basıldığını görüyorsun.", en: "The seal on the cards is made to look like the Guild ring. Up close, you can see it's been stamped backwards." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Adam seni görünce bir an duraksıyor, sonra yüzüne kocaman bir gülümseme yapıştırıyor. Satış konuşmasına adını da katsa ne olur diye tartıyor gibi.", en: "He spots you and hesitates for half a second, then slaps on a big smile. Looks like he's figuring out what happens if he works your name into the pitch." }
            kosul: { gorunen_seviye_min: 150 }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Panodaki altı addan dördünü bu sabah pazarın girişindeki tahtada okudun: Kule'den dönmeyenlerin listesinde.", en: "You read four of those six names on the board at the market entrance this morning. On the list of climbers who never came back down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "altı avcı, dört yüz on iki kapı. hesabı o da biliyor. bilmeyen yalnızca kartı alanlar.", en: "six hunters, four hundred and twelve doors. he can do the math too. the only ones who can't are the ones buying." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Üç kristal. Annem bir zamanlar ömür boyu garantili buzdolabı almıştı, o da üç ay dayanmıştı.\"", en: "\"Three crystals. My mom bought a fridge once with a lifetime warranty. It lasted three months.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Dört yüz on iki bölü altı. Fırtına gecesi her avcıya altmış dokuz kapı düşüyor. Yarım saatte.\"", en: "\"Four-twelve divided by six. That's sixty-nine doors per hunter on storm night. In thirty minutes.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Panodaki adları yüksek sesle oku", en: "Read the names on the board out loud" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "bl13_police_ifsa"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_kd_police_liste", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "{yer:kule_dibi|in} pazarında okuduğun altı ad hâlâ kulağında çınlıyor.", en: "The six names you read out in the {yer:kule_dibi} market are still ringing in your ears." } }
            sonraki: "bl13_kd_police_ifsa"
          - id: "ustlen"
            tur: "gosteris"
            etiket: { tr: "\"Bu kartları ben karşılarım. Hepsini.\"", en: "\"I'll cover these cards. Every one of them.\"" }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 3, duzen: -1 }
              - bayrak: "bl13_police_ustlenildi"
              - iliski: { yanki: { guven: 2, korku: 1 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_kd_police_liste", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Pazarda verdiğin söz dört yüz on iki kartın üstünde duruyor.", en: "The promise you made in the market is sitting on four hundred and twelve cards." } }
            sonraki: "bl13_kd_police_ustlen"
          - id: "lonca"
            etiket: { tr: "Adamı Lonca'ya teslim et; kartları Lonca karşılasın", en: "Hand him to the Guild. Let the Guild cover the cards" }
            goster: { herhangi: [{ bayrak: "uye_lonca" }, { lider_fraksiyon: "lonca" }] }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
              - bayrak: "bl13_police_lonca"
              - iliski: { kaya_demir: { saygi: 2 } }
              - xp_seviye: 8
              - tohum: { olay: "bl13_kd_police_liste", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Lonca'ya teslim ettiğin poliçeci meselesi kapanmadı.", en: "That business with the policy guy you handed to the Guild isn't over." } }
            sonraki: "bl13_kd_police_lonca"
          - id: "pay"
            etiket: { tr: "Masaya otur; kârdan payını iste", en: "Pull up a chair. Ask for your cut" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - bayrak: "bl13_police_ortak"
              - oz_kristali: 12
              - tohum: { olay: "bl13_kd_police_liste", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Poliçecinin masasından aldığın pay cebinde ağırlaşıyor.", en: "The cut you took from the policy table is getting heavy in your pocket." } }
            sonraki: "bl13_kd_police_pay"
          - id: "gec"
            etiket: { tr: "Yürü geç; herkes kendi kartını seçer", en: "Keep walking. Everybody picks their own card" }
            etkiler:
              - ahlak: { merhamet: -1 }
            sonraki: "@akis"

      - id: "bl13_kd_police_ifsa"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk adı okuduğunda kalabalığın uğultusu kesiliyor. İkincisinde arkalardan bir kadın çığlığı kopuyor: \"Oğlum o! Kırk gündür yukarıda!\" Üçüncüyü okumana gerek kalmıyor.", en: "When you read the first name, the crowd goes quiet. On the second, a woman screams from the back. \"That's my son! He's been up there forty days!\" You don't need to read the third." }
          - { tr: "Poliçeci kasasını koltuğunun altına sıkıştırıp masanın arkasından sıvışmaya kalkıyor ama kalabalık ondan hızlı. Birkaç saniye içinde masa devrilmiş, kartlar havada uçuşuyor, adamın kravatı birinin yumruğunda.", en: "The policy guy tucks his cashbox under his arm and tries to slip out behind the table, but the crowd's faster. In a few seconds the table's over, cards are flying, and his tie is in somebody's fist." }
          - { tr: "Oğlunun adını duyan kadın kalabalığın içinde durmuş, elindeki kartı sana uzatıyor. \"Peki şimdi bizim sokağa kim gelecek?\"", en: "The woman who heard her son's name is standing in the middle of it all, holding her card out to you. \"So who's coming to our street now?\"" }
        secenekler:
          - id: "koru"
            etiket: { tr: "Adamı kalabalıktan çek; kristalleri geri dağıtsın", en: "Pull him out of the crowd. Make him hand the crystals back" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Kalabalığa karışma", en: "Let the crowd handle it" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -1 }
            sonraki: "@akis"

      - id: "bl13_kd_police_ustlen"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sesin pazarın bir ucundan öbür ucuna ulaşıyor. Poliçeci ağzı açık kalakalırken kalabalık önce ona, sonra başının üstündeki sayıya, en sonunda sana bakıyor.", en: "Your voice carries from one end of the market to the other. The policy guy's mouth falls open. The crowd looks at him, then at the number over your head, then at you." }
          - { tr: "Önce yaşlı bir adam kartını çıkarıp avcının adının üstünü tükenmez kalemle çiziyor, yanına senin adını yazıyor. Ardından bir kadın, sonra bir çocuk. Az sonra pazarın her köşesinde kalemler gıcırdıyor.", en: "An old man goes first, takes out his card, scratches out the hunter's name with a ballpoint and writes yours next to it. Then a woman, then a kid. Pretty soon pens are scratching in every corner of the market." }
          - metin: { tr: "Poliçeci yutkunup kasasını sana uzatıyor. \"Madem öyle,\" diyor, \"bu da senin.\"", en: "The policy guy swallows hard and holds out his cashbox. \"Well, if that's how it is,\" he says, \"this is yours too.\"" }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Kasadaki kristalleri sahiplerine geri dağıt", en: "Give the crystals back to the people who paid" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "@akis"
          - id: "tut"
            etiket: { tr: "Kasayı al; fırtına gecesi işe yarar", en: "Take the cashbox. It'll come in handy on storm night" }
            etkiler:
              - oz_kristali: 8
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "bl13_kd_police_lonca"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Telsizle çağırdığın iki Lonca avcısı poliçeciyi masasıyla birlikte kaldırıp götürüyor. Kartları bir çuvala doldururken görevli sana dönüyor: \"Komutanlık bunları inceler. Karşılanacak sokaklar listeye girer.\"", en: "The two Guild hunters you radioed for haul off the policy guy, table and all. While the cards go into a sack, the one in charge turns to you. \"Command will review these. The streets that qualify go on the list.\"" }
          - { tr: "Kalabalıktaki yüzler bir süre çuvalın ardından bakıyor. \"Karşılanacak\" sözcüğü kimsenin hoşuna gitmemiş.", en: "The faces in the crowd watch the sack go. Nobody liked the word \"qualify.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Liste çıkınca bana da bir kopya.\"", en: "\"When that list comes out, I want a copy.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey söyleme", en: "Don't say anything" }
            sonraki: "@akis"

      - id: "bl13_kd_police_pay"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Poliçeci bir an seni süzüyor, sonra kahkahayı basıp masanın altından ikinci bir sandalye çekiyor. \"Akıllı adamsın,\" diyor. \"Adının yanına bir yıldız koyarım; yıldızlı kart beş kristal.\"", en: "The policy guy sizes you up for a second, then laughs and drags a second chair out from under the table. \"Smart,\" he says. \"I'll put a star next to your name. Starred cards go for five crystals.\"" }
          - { tr: "Akşama kadar panodaki sayı 412'den 600'e çıkıyor. Kartların yarısında artık senin adın yazılı.", en: "By evening the number on the board has gone from 412 to 600. Half the cards have your name on them now." }
        secenekler:
          - id: "say"
            etiket: { tr: "Kristalleri say", en: "Count the crystals" }
            sonraki: "@akis"
          - id: "kalk"
            etiket: { tr: "Masadan kalk; arkana bakma", en: "Get up from the table. Don't look back" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · FIRTINA POLİÇESİ (2/2 · tohum)
  - id: "bl13_kd_police_liste"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["kule_dibi", "kapi", "toplum"]
    gerilim: 2
    kart: { tr: "Dört yüz on iki adres", en: "Four Hundred and Twelve Addresses" }
    sahne: "bl13_kd_police_liste_1"
    sahneler:
      - id: "bl13_kd_police_liste_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın ardındaki kemerin altında yaşlı bir adam seni bekliyor. Kucağında lastikle bağlanmış bir ayakkabı kutusu var; kutu kartla, kartların arkası da el yazısıyla dolu: adres, kat, evde kaç kişi kaldığı.", en: "An old man's waiting for you under the arch behind the market. In his lap there's a shoebox held shut with a rubber band. It's full of cards, and the backs of the cards are full of handwriting: address, floor, how many people are still in the place." }
          - metin: { tr: "\"Adını yazdılar,\" diyor kutuyu uzatarak. \"Hepsi. Biz de oturup adresleri yazdık ki bulman kolay olsun. Dört yüz on iki tane. Bir kısmı aynı ev; bir ailede dört kart var.\"", en: "\"They wrote your name in,\" he says, holding out the box. \"All of them. So we sat down and wrote out the addresses, to make it easier for you to find us. Four hundred and twelve. Some are the same house. One family's got four cards.\"" }
            kosul: { bayrak: "bl13_police_ustlenildi" }
          - metin: { tr: "\"Lonca kartları geri verdi,\" diyor. Her kartın köşesine kırmızı bir damga basılmış: KARŞILANIR ya da KARŞILANMAZ. \"Benim sokağım karşılanmıyormuş. Vergi borcu varmış. Kapı vergi borcuna bakar mı?\"", en: "\"The Guild gave the cards back,\" he says. Every card has a red stamp in the corner: COVERED or NOT COVERED. \"Mine's not covered. Says we owe back taxes. You think a Gate checks for back taxes?\"" }
            kosul: { bayrak: "bl13_police_lonca" }
          - metin: { tr: "\"Poliçeci kaçtı,\" diyor. \"Ama kartlar duruyor ve üstlerinde adın var, yıldızlı. Altı yüz kişi senin geleceğini sanıyor. Ben de sandım.\"", en: "\"The policy guy skipped town,\" he says. \"But the cards are still around, and your name's on them, with a star. Six hundred people think you're coming. I thought so too.\"" }
            kosul: { bayrak: "bl13_police_ortak" }
          - metin: { tr: "\"O gün adları okudun,\" diyor. \"Haklıydın. Ama kartı yırtınca kapı da yırtılmıyor. Biz de oturup adresleri yazdık. Belki birileri işine yarar diye.\"", en: "\"You read those names that day,\" he says. \"You were right. But tearing up the card doesn't tear up the Gate. So we sat down and wrote out the addresses. Figured maybe somebody could use them.\"" }
            kosul: { bayrak: "bl13_police_ifsa" }
          - { tr: "Kutunun en üstündeki kartın arkasında çocuk yazısıyla tek satır var: Kedimiz de var, adı Pamuk.", en: "On the back of the top card, in a kid's handwriting, there's one line: We have a cat too, her name is Cotton." }
        sezgiler:
          - kosul: { stat: { int: 200 } }
            metin: { tr: "Adresleri mahallelere göre ayırınca yedi küme çıkıyor; yedi kümeden biri tam {yer:sanayi|in} kenarına oturuyor.", en: "Sort the addresses by neighborhood and you get seven clusters. One of the seven sits right on the edge of {yer:sanayi}." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kedinin adını da yazmışlar. insanlar böyle işte. kapı geliyor, onlar kediyi düşünüyor.", en: "they wrote down the cat's name too. that's people for you. a gate's coming and they're thinking about the cat." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Evde kaç kişi kaldığını yazmışlar. Benim sedyecilerim bunu bilse iki kat hızlı çalışır.\"", en: "\"They wrote down how many people are still in each house. If my stretcher teams knew that, they'd move twice as fast.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Dört yüz kapı mı? Ver bana yarısını, bakalım hangimiz önce bitiriyor.\"", en: "\"Four hundred doors? Give me half. Let's see who finishes first.\"" }
        secenekler:
          - id: "sokak"
            etiket: { tr: "Kartları sokak sokak ayır; her sokağa bir nöbetçi", en: "Sort the cards by street. One lookout per street" }
            etkiler:
              - iliski: { yanki: { saygi: 2 } }
              - ahlak: { duzen: 2, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_liste_sokak"
              - xp_seviye: 9
            sonraki: "bl13_kd_police_liste_sokak"
          - id: "elif"
            etiket: { tr: "Kutuyu {npc:elif_sari|e} götür; sedye ekipleri kullansın", en: "Take the box to {npc:elif_sari|pos} stretcher teams" }
            etkiler:
              - iliski: { elif_sari: { guven: 4, baglilik: 2 } }
              - ahlak: { merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_liste_elifte"
              - xp_seviye: 9
            sonraki: "bl13_kd_police_liste_elif"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "\"Kutu bende kalsın. Fırtına gecesi bu kapıları ben çalarım.\"", en: "\"The box stays with me. I'll knock on those doors.\"" }
            gerekli: { stat: { wil: 240 } }
            etkiler:
              - dikkat: 2
              - iliski: { yanki: { saygi: 3 } }
              - ahlak: { merhamet: 3 }
              - tehlike: { kule_dibi: -3 }
              - bayrak: "bl13_liste_sende"
              - xp_seviye: 12
            sonraki: "bl13_kd_police_liste_kendin"
          - id: "durust"
            etiket: { tr: "\"Hepsine yetişemem. Bunu senden saklamayacağım.\"", en: "\"I can't get to all of them. I won't lie to you about that.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { yanki: { guven: 2 } }
              - bayrak: "bl13_liste_durust"
              - xp_seviye: 8
            sonraki: "bl13_kd_police_liste_durust"

      - id: "bl13_kd_police_liste_sokak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yaşlı adamla kemerin altında oturup kartları sokak sokak ayırıyorsunuz. Her destenin en üstüne o sokakta en uzun oturan kart sahibinin adını yazıyorsun; kapı açılınca kapı kapı dolaşacak olan o.", en: "You sit under the arch with the old man and sort the cards street by street. On top of each pile you write the name of whoever's lived on that street the longest. When a Gate opens, they're the one who goes door to door." }
          - { tr: "Akşama kadar kırk bir deste çıkıyor, kırk bir de nöbetçi. Pamuk'un kartı kendi sokağının destesinde, en üstte duruyor.", en: "By evening there are forty-one piles and forty-one lookouts. Cotton's card sits on top of her street's pile." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pamuk'un kartını yerinde bırak", en: "Leave Cotton's card where it is" }
            sonraki: "@akis"

      - id: "bl13_kd_police_liste_elif"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} kutuyu açıp ilk on kartı okuyor, sonra okumayı bırakıp sana bakıyor. \"Biliyor musun bu ne?\" diyor. \"Triyaj, ama tersten. Önce kim nerede, sonra kim ne halde. Hep tersinden başlıyorduk.\"", en: "{npc:elif_sari} opens the box and reads the first ten cards, then stops and looks at you. \"Know what this is?\" she says. \"Triage, backwards. Who's where first, then who's how bad. We've been doing it upside down this whole time.\"" }
          - { tr: "Akşama kadar sedye ekiplerinin her birinin cebinde bir avuç kart oluyor.", en: "By evening, every stretcher team has a handful of cards in their pocket." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kutuyu ona bırak", en: "Leave the box with her" }
            sonraki: "@akis"

      - id: "bl13_kd_police_liste_kendin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kutuyu koltuğunun altına alıyorsun. O gece adresleri tek tek ezberleyip her mahallede kapıların en çok açıldığı sokakları kartların yanına çiziyorsun.", en: "You tuck the box under your arm. That night you memorize the addresses one by one and sketch in, next to the cards, the streets in each neighborhood where Gates open most." }
          - { tr: "Sabaha karşı kutunun kapağına kendi el yazınla bir satır ekliyorsun: Dört yüz on iki kapı, bir de kedi.", en: "Near dawn you add a line to the lid of the box in your own handwriting: Four hundred and twelve doors. Plus one cat." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kutuyu kapat", en: "Close the box" }
            sonraki: "@akis"

      - id: "bl13_kd_police_liste_durust"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yaşlı adam uzun bir süre susuyor. Sonra kutuyu kucağına geri alıp lastiğini sıkıca bağlıyor.", en: "The old man doesn't say anything for a long time. Then he takes the box back into his lap and snaps the rubber band tight." }
          - { tr: "\"Kart satan adam bunu söyleseydi kimse ona üç kristal vermezdi,\" diyor. \"Sana hâlâ veririm. Söz verme, yeter. Biz de birbirimize koşarız; sokak dediğin bunun için var.\"", en: "\"If the card guy had said that, nobody would've paid him three crystals,\" he says. \"I'd still pay you. Just don't promise. We'll run to each other. That's what a street is for.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Elini sık", en: "Shake his hand" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · KAÇAK BEKÇİLER (1/2)
  - id: "bl13_kd_bekci"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "kule_dibi", "kapi", "canavar"]
    gerilim: 3
    kart: { tr: "Katını bırakan bekçi", en: "The Warden Who Left Its Floor" }
    sahne: "bl13_kd_bekci_1"
    sahneler:
      - id: "bl13_kd_bekci_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşam çökerken Kule'nin dibindeki kapıdan çatlak zırhlı bir şey çıkıyor. Ne meydana ne insanlara bakıyor; tramvay rayının üstüne basıp güneydoğuya doğru yürümeye koyuluyor. Önünde mavi bir pencere asılı: [Kat 4 Kuralı: Sağdan yürünür.]", en: "At dusk, something in cracked armor walks out of the door at the foot of the Spire. It doesn't look at the plaza or the people. It steps onto the streetcar tracks and starts walking southeast. A blue window hangs in front of it: [Floor 4 Rule: Keep to the right.]" }
          - { tr: "Pazarcılar telaşsızca yol açıyor; belli ki alışmışlar. Kestane satan bir kadın sesini alçaltıyor: \"Her akşam iniyorlar. Kural çiğnenmedikçe kimseye dokunmazlar.\"", en: "The vendors step aside without fuss. They're used to it. A woman selling roasted chestnuts drops her voice. \"They come down every evening. Don't touch anybody, long as you don't break the rule.\"" }
          - { tr: "\"Dün bir seyyar satıcı soldan geçti,\" diye ekliyor. \"Arabasından geriye kalanı toplamaya iki kişi uğraştı.\"", en: "\"Yesterday a pushcart guy passed on the left,\" she adds. \"Took two people to pick up what was left of his cart.\"" }
          - { tr: "İlkinin ardından ikincisi çıkıyor: [Kat 7 Kuralı: Koşmak yasaktır.] Sonra üçüncüsü. Üçü de aynı rayı izliyor, aynı yöne yürüyor, aynı adımla.", en: "A second one comes out behind the first: [Floor 7 Rule: No running.] Then a third. All three follow the same track, walking the same way, in step." }
          - metin: { tr: "Bir çatının kenarında Ağ'ın iki genci oturmuş, defterlerine çentik atıyor. Bu haftanın sayısı bu akşamki çentikle on bire çıkmış.", en: "Two Network kids are sitting on the edge of a roof, notching tallies in a notebook. Tonight's notch makes it eleven this week." }
            kosul: { herhangi: [{ bayrak: "uye_sessiz_ag" }, { bayrak: "cekirdek_sessiz_ag" }] }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Zırh plakaları adımlarıyla değil, başka bir şeyle titriyor: dört vuruş, bir es. Bekçiler o ritme uyup yürüyor.", en: "Their armor plates aren't rattling with their steps. They're rattling with something else. Four beats, a rest. The wardens are marching to it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onlar da duyuyor. katlarını bırakıp gidiyorlar. ben olsam ben de giderdim. sen olmasaydın.", en: "they hear it too. they're leaving their floors. i'd go too, if i were them. if it weren't for you." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "{npc:aras_kurt} elini göğsüne bastırıyor, farkında olmadan. \"Bunlar nereye gidiyor, biliyorum,\" diyor. \"Sorma nasıl.\"", en: "{npc:aras_kurt} presses a hand to his chest without seeming to notice. \"I know where they're going,\" he says. \"Don't ask me how.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sağdan yürünür. Tamam. Sağdan yürüyoruz. Herkes sağdan.\"", en: "\"Keep to the right. Okay. We're keeping right. Everybody keep right.\"" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kurallara uyup peşlerine takıl", en: "Follow them. Obey the rules while you do" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl13_bekci_izlendi"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_kd_bekci_halka", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Kule'den inen bekçiler her akşam aynı yere yürüyor.", en: "The wardens coming down from the Spire walk to the same place every evening." } }
            sonraki: "bl13_kd_bekci_izle"
          - id: "pencere"
            etiket: { tr: "Yanına sokulup penceresini oku", en: "Fall in beside one and read its window" }
            gerekli: { stat: { wis: 200 } }
            etkiler:
              - bayrak: "bl13_bekci_kural"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_kd_bekci_halka", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Bekçinin penceresinde okuduğun yeni kural aklından çıkmıyor.", en: "You can't shake the new rule you read in that warden's window." } }
            sonraki: "bl13_kd_bekci_pencere"
          - id: "kes"
            etiket: { tr: "Sonuncusunu meydandan çıkmadan indir", en: "Drop the last one before it leaves the plaza" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_bekci_zafer", kaybet: "bl13_kd_bekci_yenilgi", kac: "bl13_kd_bekci_kacis" }
          - id: "ag"
            etiket: { tr: "Ağ'a haber ver; bekçileri işaretlesinler", en: "Tip off the Network. Have them tag the wardens" }
            goster: { herhangi: [{ bayrak: "uye_sessiz_ag" }, { yoldas: "mert_kilic" }] }
            etkiler:
              - iliski: { mert_kilic: { saygi: 3, guven: 2 } }
              - itibar: { sessiz_ag: 2 }
              - bayrak: "bl13_bekci_ag"
              - xp_seviye: 8
              - tohum: { olay: "bl13_kd_bekci_halka", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Ağ'ın işaretlediği bekçilerin hepsi aynı noktada duruyormuş.", en: "Word from the Network: every warden they tagged stops at the same spot." } }
            sonraki: "bl13_kd_bekci_ag"
          - id: "cekil"
            etiket: { tr: "Yollarından çekil", en: "Get out of their way" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_izle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Rayın sağından, koşmadan yürüyorsun. Bekçiler meydanın güney ucuna, eski tramvay deposunun önüne varınca birden duruyor. Hep birlikte {yer:sanayi|in} bacalarına dönüp öylece kalıyorlar.", en: "You walk the right side of the tracks, no running. When the wardens reach the south end of the plaza, out front of the old streetcar barn, they stop all at once. They turn to face the smokestacks of {yer:sanayi} and just stay like that." }
          - { tr: "Deponun önünde başkaları da var: dün inenler, evvelsi gün inenler. Halka gittikçe büyüyor; bekçilerin hepsi hafifçe, aynı ritimle sallanıyor.", en: "There are others out front of the barn: the ones from yesterday, the ones from the day before. The ring keeps getting bigger. All of them are swaying, just slightly, to the same rhythm." }
        secenekler:
          - id: "say"
            etiket: { tr: "Kaç tane olduklarını say", en: "Count how many there are" }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Sessizce geri dön", en: "Back away quietly" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_pencere"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sağdan, onunla aynı adımla yürüyorsun. Bekçi başını çevirip seni süzüyor, sonra kural ihlali bulamayınca yoluna devam ediyor. Penceresi bir an titriyor.", en: "You walk on its right, in step. The warden turns its head and looks you over, finds no violation and keeps going. Its window flickers for a second." }
          - { tr: "Pencerenin altına yeni bir satır yazılmış, Kule'nin değil, yabancı bir elin yazısıyla: [Kat 4 Kuralı (güncellendi): Merkeze yürünür.]", en: "There's a new line written under the old one. Not in the Spire's script. In some other hand: [Floor 4 Rule (updated): Walk to the center.]" }
        secenekler:
          - id: "merkez"
            etiket: { tr: "\"Hangi merkez?\" diye mırıldan", en: "Mutter, \"What center?\"" }
            sonraki: "@akis"
          - id: "ayril"
            etiket: { tr: "Yanından ayrıl", en: "Peel away from it" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_ag"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ağ'ın gençleri çatılardan inip bekçilerin zırh çatlaklarına parmak boyunda vericiler sıkıştırıyor. Bekçiler aldırmıyor bile. Kural dışı bir şey değil bu.", en: "The Network kids come down off the roofs and wedge finger-sized transmitters into the cracks in the wardens' armor. The wardens don't even notice. Nothing in the rules against it." }
          - { tr: "Gece yarısı Ağ'ın çaycı çıraklarından biri nefes nefese yanına geliyor: \"Hepsi aynı yerde durdu. Tramvay deposu. Yüzleri {yer:sanayi|e} dönük.\"", en: "Around midnight one of the Network's errand kids comes running up, out of breath. \"They all stopped at the same spot. The streetcar barn. Facing {yer:sanayi}.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kaydı sakla", en: "Save the recording" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçi dizlerinin üstüne çöküyor. Penceresi sönmeden önce son bir kez yanıp sönüyor: [Kat 7 Kuralı: Merkeze yürünür.] Ardından boş zırh rayların üstüne devriliyor.", en: "The warden drops to its knees. Before its window goes dark, it blinks one last time: [Floor 7 Rule: Walk to the center.] Then the empty armor topples onto the rails." }
          - { tr: "Zırhın içinden ceviz büyüklüğünde gri bir parça yuvarlanıyor. Avucuna aldığında hâlâ atıyor: dört vuruş, bir es.", en: "A gray piece about the size of a walnut rolls out of the armor. When you pick it up, it's still beating. Four beats, a rest." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Parçayı cebine koy; ötekilerin nereye gittiğine bak", en: "Pocket it. Go see where the others went" }
            etkiler:
              - bayrak: "bl13_bekci_parca"
              - tehlike: { kule_dibi: -3 }
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 12
              - tohum: { olay: "bl13_kd_bekci_halka", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Cebindeki gri parça hâlâ atıyor; ötekiler de hâlâ aynı yere yürüyor.", en: "The gray piece in your pocket is still beating, and the others are still walking to the same place." } }
            sonraki: "@akis"
          - id: "ez"
            etiket: { tr: "Parçayı topuğunla ez", en: "Crush it under your heel" }
            etkiler:
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl13_kd_bekci_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin kalkanı kaburgalarına iniyor ve meydanın taşları gözünün önünde dönüyor. Kendine geldiğinde kestaneci kadın başında, ıslak bir bezle alnını siliyor.", en: "The warden's shield slams into your ribs and the plaza's paving stones spin in front of your eyes. When you come to, the chestnut woman is kneeling over you, wiping your forehead with a wet rag." }
          - { tr: "\"Koştun,\" diyor. \"Yedinci katın kuralı. Ben söylemedim mi?\" Bekçi çoktan gitmiş; ötekilerle birlikte güneydoğuya.", en: "\"You ran,\" she says. \"Floor seven rule. Didn't I tell you?\" The warden's long gone, southeast with the others." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk; bu kez koşmadan yetiş", en: "Get up. Catch it this time without running" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_bekci_zafer", kaybet: "bl13_kd_bekci_kacis", kac: "bl13_kd_bekci_kacis" }
          - id: "birak"
            etiket: { tr: "Bugünlük bırak; kadına teşekkür et", en: "Let it go for today. Thank the woman" }
            etkiler:
              - can: 20
            sonraki: "@akis"

      - id: "bl13_kd_bekci_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekiliyorsun; bekçi peşine düşmüyor. Seni ihlal listesinden silip rayların üstünde yoluna devam ediyor, sanki hiç karşılaşmamışsınız.", en: "You fall back, and the warden doesn't follow. It just crosses you off its violation list and keeps going down the tracks like you never met." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Uzaklaşmasını izle", en: "Watch it go" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · BEKÇİ HALKASI (2/2 · tohum)
  - id: "bl13_kd_bekci_halka"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["kesif", "kule_dibi", "kapi", "canavar", "savas"]
    gerilim: 3
    kart: { tr: "Tramvay deposundaki halka", en: "The Ring at the Streetcar Barn" }
    sahne: "bl13_kd_bekci_halka_1"
    sahneler:
      - id: "bl13_kd_bekci_halka_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Eski tramvay deposunun önündeki halka on bire çıkmış. Bekçiler omuz omuza dizilmiş, yüzleri {yer:sanayi|e} dönük, aynı ritimle sallanıyor. Pencereleri artık tek bir satır gösteriyor, hepsi aynı: [Kural: Bekle.]", en: "The ring out front of the old streetcar barn has grown to eleven wardens. The wardens stand shoulder to shoulder, facing {yer:sanayi}, swaying to the same rhythm. Their windows all show one line now, every one the same: [Rule: Wait.]" }
          - { tr: "Mahalleli deponun çevresine şerit çekmiş, şeridin dışında küçük bir kalabalık birikmiş. Biri yüksek sesle hesap yapıyor: \"Her gün bir iki tane geliyor. Fırtına gecesi yirmiyi bulur. Yirmisi birden yürürse...\"", en: "The neighborhood has strung tape around the barn, and a little crowd has gathered outside it. Somebody's doing the math out loud. \"One or two more every day. By storm night that's twenty. If twenty of them start walking at once...\"" }
          - metin: { tr: "Cebindeki gri parça halkaya yaklaştıkça hızlanıyor.", en: "The gray piece in your pocket speeds up the closer you get to the ring." }
            kosul: { bayrak: "bl13_bekci_parca" }
          - metin: { tr: "Ağ'ın vericileri hâlâ zırh çatlaklarında yanıp sönüyor. Çatıdaki gencin defterinde tek satır var: On bir sinyal, tek nabız.", en: "The Network's transmitters are still blinking in the armor cracks. The kid on the roof has one line in the notebook: Eleven signals, one pulse." }
            kosul: { bayrak: "bl13_bekci_ag" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Halkanın ortasındaki taşlar ısınmış. Bekçiler bir şey beklemiyor; bir şeyi ısıtıyor.", en: "The paving stones in the middle of the ring have gone warm. The wardens aren't waiting for something. They're warming it up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bekle diyor. kime söylüyor sence? onlara mı, sana mı?", en: "it says wait. who do you think it's talking to? them, or you?" }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yönleri aynı, ritimleri aynı, kuralları aynı. Biri bunları yeniden yazmış. Kule'nin kodunu.\"", en: "\"Same heading, same rhythm, same rule. Somebody rewrote them. The Spire's own code.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Şeridin dışındakileri biraz daha geri çekelim. Yirmi tanesi yürürse önce bunları ezerler.\"", en: "\"Let's move the people outside the tape back a little. If twenty of those walk, these folks get trampled first.\"" }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Halkayı şimdi, on birken dağıt", en: "Break the ring now, while it's only eleven" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya", "kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_bekci_halka_zafer", kaybet: "bl13_kd_bekci_halka_yenilgi", kac: "bl13_kd_bekci_halka_kacis" }
          - id: "dinle"
            etiket: { tr: "Halkanın ortasına gir; neyi beklediklerini dinle", en: "Step into the ring. Listen for what they're waiting on" }
            gerekli: { stat: { wis: 220 } }
            etkiler:
              - iliski: { yanki: { guven: 3, saygi: 2 } }
              - bayrak: "bl13_merkez_duyuldu"
              - xp_seviye: 12
            sonraki: "bl13_kd_bekci_halka_dinle"
          - id: "kule"
            tur: "gosteris"
            etiket: { tr: "Kendi kuralını koy: \"Katınıza dönün.\"", en: "Lay down your own rule: \"Back to your floors.\"" }
            gerekli: { stat: { wil: 260 } }
            etkiler:
              - dikkat: 4
              - tehlike: { kule_dibi: -4 }
              - iliski: { yanki: { korku: 2, saygi: 3 } }
              - bayrak: "bl13_halka_geri"
              - xp_seviye: 14
            sonraki: "bl13_kd_bekci_halka_kule"
          - id: "birak"
            etiket: { tr: "Şeridi sağlamlaştır; halkaya dokunma", en: "Reinforce the tape. Leave the ring alone" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - tehlike: { kule_dibi: 5 }
              - bayrak: "bl13_halka_kaldi"
              - iliski: { elif_sari: { saygi: -1 } }
            sonraki: "bl13_kd_bekci_halka_birak"

      - id: "bl13_kd_bekci_halka_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk ikisi düşünce halka bozuluyor. Kalanlar ne saldırıyor ne kaçıyor; pencereleri bir an karışıyor, sonra her biri eski kuralını hatırlayıp başka bir yöne yürüyüp gidiyor.", en: "When the first two go down, the ring breaks. The rest don't attack and don't run. Their windows scramble for a second, then each one remembers its old rule and wanders off in a different direction." }
          - { tr: "Şeridin dışındaki kalabalıktan alkış kopuyor. Halkanın ortasındaki taşlar yavaş yavaş soğuyor.", en: "The crowd outside the tape breaks into applause. The stones in the middle of the ring slowly cool." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Taşlara dokun; soğuduklarından emin ol", en: "Touch the stones. Make sure they're cooling" }
            etkiler:
              - tehlike: { kule_dibi: -5 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_halka_dagildi"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl13_kd_bekci_halka_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İki bekçi seni aynı anda karşılıyor; birinin kuralı ötekinin kuralını tamamlıyor ve kaçacak yer kalmıyor. Şeridin dışına savrulup asfalta yığılıyorsun.", en: "Two wardens meet you at once. One warden's rule covers the gap the other's leaves open, and there's nowhere to go. You get thrown out past the tape and land in a heap on the asphalt." }
          - { tr: "Halka seni umursamadan yeniden kapanıyor. Pencerelerde aynı satır: [Kural: Bekle.]", en: "The ring closes up again without paying you any attention. Same line in every window: [Rule: Wait.]" }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Doğrul ve yeniden gir", en: "Get up and go back in" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya", "kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_bekci_halka_zafer", kaybet: "bl13_kd_bekci_halka_kacis", kac: "bl13_kd_bekci_halka_kacis" }
          - id: "birak"
            etiket: { tr: "Geri çekil; şeridi bir adım geriye taşı", en: "Fall back. Move the tape back a step" }
            etkiler:
              - can: 20
              - tehlike: { kule_dibi: 3 }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_halka_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şeridin dışına çekiliyorsun. Bekçiler peşine düşmüyor; halka kapanıyor ve ritim kaldığı yerden devam ediyor.", en: "You pull back past the tape. The wardens don't come after you. The ring closes and the rhythm picks up right where it left off." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Mahalleliyi uzaklaştır", en: "Get the neighbors clear" }
            etkiler:
              - tehlike: { kule_dibi: 2 }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_halka_dinle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şeridin altından geçip halkanın ortasına yürüyorsun. Bekçiler seni ihlal saymıyor; bekleyenlerden biri sanıyorlar belki. Gözlerini kapatınca ısınmış taşların altından gelen davulu duyuyorsun.", en: "You duck under the tape and walk into the middle of the ring. The wardens don't count you as a violation. Maybe they think you're one more thing waiting. When you close your eyes, you hear the drum coming up through the warm stones." }
          - { tr: "Davul burada değil. Burası yalnızca bir yankı, bir aktarma. Asıl vuruş güneydoğuda, {yer:sanayi|in} ortasında bir yerden geliyor: eski, büyük, ateşle yapılmış bir boşluktan. Bir fırının karnından.", en: "The drum isn't here. This is just an echo, a relay. The real beat is coming from the southeast, somewhere in the middle of {yer:sanayi}. Something old and big, a hollow built for fire. The belly of a furnace." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gözlerini aç; yönü aklına yaz", en: "Open your eyes. Lock in the direction" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_halka_kule"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sesin meydanı yarıyor. On bir pencere birden titriyor; satırlar silinip yeniden yazılıyor, ardından bir daha silinip yazılıyor. Sonunda hepsinde aynı şey kalıyor: senin sözün.", en: "Your voice cuts across the plaza. Eleven windows flicker at once. The lines erase and rewrite, erase and rewrite again. In the end they all hold the same thing: your words." }
          - { tr: "Bekçiler tek sıra halinde Kule'ye geri yürüyor. Şeridin dışındakiler alkışlamıyor; sana az önce bekçilere baktıkları gibi bakıyorlar.", en: "The wardens march back to the Spire in single file. The people outside the tape don't clap. They look at you the way they were looking at the wardens a minute ago." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kalabalığa dönme", en: "Don't turn to face the crowd" }
            sonraki: "@akis"

      - id: "bl13_kd_bekci_halka_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Mahalleliyle birlikte şeridi ikiye katlıyor, deponun kapısına kum torbası diziyorsun. Halka seni görmezden geliyor. O gece on ikinci bekçi de geliyor.", en: "You and the neighbors double up the tape and stack sandbags in front of the barn door. The ring ignores you. That night a twelfth warden shows up." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kum torbalarını say", en: "Count the sandbags" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · ÇATI KEDİLERİ
  - id: "bl13_kd_catilar"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 4
    etiketler: ["kesif", "kule_dibi", "toplum", "cocuk"]
    gerilim: 2
    kart: { tr: "Çatıdaki tebeşir", en: "Chalk on the Rooftop" }
    sahne: "bl13_kd_catilar_1"
    sahneler:
      - id: "bl13_kd_catilar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapıların bu hafta hangi sokaklarda açıldığını görmek için pazarın üstündeki bir apartmanın çatısına çıkıyorsun. Katran kaplı damın üstü baştan sona tebeşirle çizilmiş: oklar, sayılar, çatıdan çatıya kesik çizgiler.", en: "You climb onto the roof of an apartment building over the market to see which streets the Gates opened on this week. The tar roof is covered in chalk from end to end: arrows, numbers, dashed lines running from roof to roof." }
          - { tr: "Bazı binaların üstüne kocaman harflerle BOŞ yazılmış. Fırtına gecesi sığınaklara inilince boşalacak binalar bunlar. Yanlarına küçük işaretler konmuş: televizyon, ilaç dolabı, kristal.", en: "Some of the buildings have EMPTY written over them in big letters. The ones that'll clear out on storm night when everybody goes down to the shelters. Little symbols next to them: TV, medicine cabinet, crystals." }
          - { tr: "Arkandaki su deposunun gölgesinden üç genç çıkıyor; en büyüğü on beşinde ya var ya yok. Önlerindeki kız kollarını kavuşturmuş. \"Haritamıza basıyorsun,\" diyor. Adı Fare'ymiş, öyle diyorlar.", en: "Three kids step out of the shadow of the water tank behind you. The oldest can't be more than fifteen. The girl in front has her arms crossed. \"You're standing on our map,\" she says. They call her Mouse." }
          - { tr: "\"Kapı açılırsa her şey zaten yanacak,\" diyor Fare omuz silkerek. \"Biz yanmadan alırız. Çatıdan çatıya {yer:kule_dibi|den} dört mahalleye sokaktan hızlı gideriz. Kimse bizi görmez.\"", en: "\"Gate opens, it all burns anyway,\" Mouse says with a shrug. \"We just grab it before it does. Roof to roof, we can get from {yer:kule_dibi} to four neighborhoods faster than the street. Nobody ever sees us.\"" }
          - metin: { tr: "Çocuklardan birinin kolunda {fraksiyon:siginak|in} kayıt bilekliği var. {yer:kordon|in} kaçkınlarından.", en: "One of the kids is wearing a {fraksiyon:siginak} intake wristband. A refugee from {yer:kordon}." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Kesik çizgiler rastgele değil. Kapıların en çok açıldığı sokakları atlıyor; bu çocuklar kapıların yerini hepinizden iyi biliyor.", en: "The dashed lines aren't random. They skip the streets where Gates open most. These kids know where the Gates are better than any of you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hırsız diyeceksin. sonra bak, şehri senden iyi tanıyorlar. hangisini önce söyleyeceksin?", en: "you're going to call them thieves. then look again. they know the city better than you. which one are you going to say first?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On beş. Ben on beşimde otobüs biletine para bulamazdım. Bunlar dört mahalle planlamış.\"", en: "\"Fifteen. At fifteen I couldn't scrape together bus fare. These kids planned four neighborhoods.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"İlaç dolabı işareti. Hangi ilacı arıyorsun, Fare? Birine mi lazım?\"", en: "\"The medicine cabinet symbol. What are you looking for, Mouse? Somebody need something?\"" }
        secenekler:
          - id: "haberci"
            etiket: { tr: "\"Rotalarınızı bana verin. Fırtına gecesi habercim olun.\"", en: "\"Give me your routes. Be my runners on storm night.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "bl13_kediler_haberci"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Çatı Kedileri sözlerini tuttu mu, bilmiyorsun. Sığınak'ın kapısında birilerinin seni sorduğunu duydun.", en: "You don't know yet if the Roof Cats kept their word. You heard somebody's been asking for you at the Haven gate." } }
            sonraki: "bl13_kd_catilar_haberci"
          - id: "uyar"
            etiket: { tr: "\"Fırtına gecesi çatı en kötü yer. Kapı yukarıda da açılır.\"", en: "\"Storm night, stay off roofs. Gates open up high too.\"" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "bl13_kediler_uyarildi"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 8
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Çatıdaki uyarın Fare'nin aklına yatmış olmalı; Sığınak'ın kapısında seni soruyorlarmış.", en: "Your warning on the roof must've gotten through to Mouse. Somebody's been asking for you at the Haven gate." } }
            sonraki: "bl13_kd_catilar_uyar"
          - id: "ihbar"
            etiket: { tr: "Konsey nöbetini çağır; çocukları teslim et", en: "Call the Council watch. Turn the kids in" }
            goster: { herhangi: [{ bayrak: "uye_siginak" }, { lider_fraksiyon: "siginak" }] }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { siginak: 2 }
              - bayrak: "bl13_kediler_ihbar"
              - iliski: { elif_sari: { saygi: 1, guven: -1 } }
              - xp_seviye: 8
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Teslim ettiğin çatı çocukları Konsey'in nezarethanesinde bekliyor.", en: "The roof kids you turned in are sitting in the Council lockup." } }
            sonraki: "bl13_kd_catilar_ihbar"
          - id: "sil"
            tur: "gosteris"
            etiket: { tr: "Haritayı ayağınla sil; bir daha görmeyeyim", en: "Scrub the map out with your boot. Don't let me see it again" }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: 2, merhamet: -1 }
              - tehlike: { kule_dibi: 2 }
              - bayrak: "bl13_kediler_kovuldu"
            sonraki: "bl13_kd_catilar_sil"

      - id: "bl13_kd_catilar_haberci"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Fare kaşlarını çatıp seni süzüyor. \"Haberci ne alır?\"", en: "Mouse narrows her eyes and looks you over. \"What's a runner get paid?\"" }
          - { tr: "\"Fırtınadan sağ çıkarsa ne isterse,\" diyorsun. Çocuklar birbirine bakıyor. Sonunda Fare cebinden bir tebeşir çıkarıp sana uzatıyor. \"Çiz o zaman. Hangi mahalle kimin?\"", en: "\"Whatever they want, if they make it through the storm,\" you say. The kids look at each other. Finally Mouse pulls a piece of chalk out of her pocket and holds it out. \"Draw it, then. Which neighborhood's whose?\"" }
        secenekler:
          - id: "ciz"
            etiket: { tr: "Tebeşiri al; BOŞ yazılarının üstünü çiz", en: "Take the chalk. Cross out every EMPTY" }
            sonraki: "@akis"

      - id: "bl13_kd_catilar_uyar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Fare bir an susuyor. \"Yukarıda da mı?\" diyor, ilk kez yaşına uygun bir sesle.", en: "Mouse goes quiet for a second. \"Up high too?\" she says, sounding her age for the first time." }
          - { tr: "Sonra kendini toplayıp omuz silkiyor, ama gözü kesik çizgilerin üstünde dolaşıyor. Hesabı yeniden yapıyor.", en: "Then she pulls herself together and shrugs, but her eyes keep moving over the dashed lines. She's redoing the math." }
        secenekler:
          - id: "git"
            etiket: { tr: "Onları haritalarıyla baş başa bırak", en: "Leave them alone with their map" }
            sonraki: "@akis"

      - id: "bl13_kd_catilar_ihbar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Nöbetçiler çatıya çıktığında çocuklardan ikisi kaçmayı başarıyor bile; çatıdan çatıya, haritada çizdikleri gibi. Fare kaçmıyor. Kollarını kavuşturmuş, nöbetçilere değil sana bakıyor.", en: "By the time the watch gets up to the roof, two of the kids have already gotten away, roof to roof, just like on the map. Mouse doesn't run. Arms crossed, she's looking at you, not the watch." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Bakışına karşılık ver", en: "Hold her stare" }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Arkanı dön", en: "Turn your back" }
            sonraki: "@akis"

      - id: "bl13_kd_catilar_sil"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Botunun ucuyla okları, sayıları, kesik çizgileri siliyorsun. Çocuklar ses çıkarmadan izliyor. İşin bitince Fare su deposunun merdivenine tırmanıp oradan sesleniyor:", en: "You scrub out the arrows, the numbers, the dashed lines with the toe of your boot. The kids watch without a word. When you're done, Mouse climbs the ladder up the water tank and calls down." }
          - { tr: "\"Haritayı silersin, çatıları silemezsin.\"", en: "\"You can wipe out the map. You can't wipe out the roofs.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çatıdan in", en: "Climb down off the roof" }
            sonraki: "@akis"

  # ================================================================== TEPE · KAPI PROVASI
  - id: "bl13_tepe_prova"
    konum: ["tepe"]
    perde: [3]
    gun: { min: 262, max: 284 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "tepe", "yukselenler", "kapi"]
    gerilim: 3
    kart: { tr: "Kapı provası", en: "Gate Rehearsal" }
    sahne: "bl13_tepe_prova_1"
    sahneler:
      - id: "bl13_tepe_prova_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|de} sokak lambaları yakılmıyor artık; müritler kapıların ışığını daha iyi görmek için söndürmüş. Su deposunun ardındaki eski çay bahçesinde, çınarın dibinde avuç içi kadar küçük bir kapı her gece aynı saatte açılıyor.", en: "They don't light the streetlamps in {yer:tepe} anymore. The disciples shut them off to see the Gates' light better. In the old tea garden behind the water tower, at the foot of the sycamore, a Gate no bigger than your palm opens at the same hour every night." }
          - { tr: "Kapının önünde beyazlı bir sıra uzanıyor. Bir diyakoz alçak sesle sayıyor: bir, iki, üç, dört... ve susuyor. Sustuğu anda sıranın başındaki kişi gözlerini kapatıp elini kapının ışığına sokuyor. Kimi bağırarak çekiyor elini, kimi gülümseyerek.", en: "A line of people in white stretches out in front of it. A deacon counts under his breath: one, two, three, four... and stops. On the stop, whoever's at the head of the line closes their eyes and puts a hand into the Gate's light. Some pull it back screaming. Some pull it back smiling." }
          - { tr: "\"Prova,\" diyor diyakoz seni görünce, gururla. \"Fırtına gecesi kapılar büyüyecek. Hazır olan içeri yürüyecek, yükselmiş olarak çıkacak. Hazır olmayan...\" Cümlesini bitirmiyor.", en: "\"A rehearsal,\" the deacon says proudly when he sees you. \"On storm night the Gates will grow. Whoever's ready will walk in and come out ascended. Whoever isn't...\" He doesn't finish." }
          - { tr: "Sıranın sonunda bir kadın elinde küçük bir çocuk ayakkabısıyla bekliyor.", en: "At the back of the line, a woman is waiting with a little kid's shoe in her hand." }
          - metin: { tr: "Peygamberin maskesi düştüğünden beri {yer:tepe|de} kimse ona ne olduğunu yüksek sesle sormuyor. Provalar o günden sonra başlamış.", en: "Since the Prophet's mask came off, nobody in {yer:tepe} asks out loud what happened to him. The rehearsals started right after." }
            kosul: { bayrak: "vahit_maskesi_dustu" }
          - metin: { tr: "Diyakoz önünde hafifçe eğiliyor. \"Kardeşimiz,\" diyor sıraya, \"provayı onurlandırmaya geldi.\"", en: "The deacon gives you a little bow. \"Our brother,\" he tells the line, \"has come to honor the rehearsal.\"" }
            kosul: { bayrak: "uye_yukselenler" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Elini sokanların bir kısmının parmak uçları griye dönmüş. Kapı onlara bir şey vermiyor, onlardan bir şey alıyor; çok az, her seferinde biraz.", en: "Some of the ones who put their hands in have fingertips gone gray. The Gate isn't giving them anything. It's taking. A little, every time." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dört vuruşa kadar sayıyorlar. esi de sen doldur diye bekliyorlar galiba. sakın.", en: "they count to four. i think they're waiting for you to fill in the rest. don't." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Parmak uçlarına bak. Bu soğuk yanığı değil. Doku ölüyor.\"", en: "\"Look at their fingertips. That's not frostbite. The tissue's dying.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Elindeki ayakkabı... Sıranın sonundaki kadın. Kime ait onu sormaya korkuyorum.\"", en: "\"That shoe she's holding... The woman at the back. I'm scared to ask whose it is.\"" }
        secenekler:
          - id: "anne"
            etiket: { tr: "Ayakkabılı kadının yanına git", en: "Go over to the woman with the shoe" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { yanki: { guven: 1 } }
              - bayrak: "bl13_prova_anne"
              - xp_seviye: 9
              - tohum: { olay: "bl13_kd_alay", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Ayakkabılı kadının söylediği tarih geldi: beyazlılar büyük prova için Kule'ye iniyor.", en: "The date the woman with the shoe told you about is here. The people in white are heading down to the Spire for the big rehearsal." } }
            sonraki: "bl13_tepe_prova_anne"
          - id: "kapat"
            tur: "gosteris"
            etiket: { tr: "Kapıyı çınarın dibinde avucunla kapat", en: "Close the Gate at the foot of the tree with your bare hand" }
            gerekli: { stat: { wil: 240 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { yukselenler: -3 }
              - tehlike: { tepe: -4 }
              - bayrak: "bl13_prova_kapandi"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 12
              - tohum: { olay: "bl13_kd_alay", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Çay bahçesindeki kapıyı kapattın; beyazlılar provayı Kule'nin dibine taşımış.", en: "You closed the Gate in the tea garden, so the people in white took the rehearsal down to the foot of the Spire." } }
            sonraki: "bl13_tepe_prova_kapat"
          - id: "yonet"
            etiket: { tr: "Provayı devral: \"Kimse ışığa dokunmayacak.\"", en: "Take over the rehearsal. \"Nobody touches the light.\"" }
            goster: { herhangi: [{ bayrak: "uye_yukselenler" }, { lider_fraksiyon: "yukselenler" }] }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { yukselenler: 2 }
              - tehlike: { tepe: -2 }
              - bayrak: "bl13_prova_yonetildi"
              - iliski: { vahit: { saygi: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_kd_alay", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Yukarıdaki provayı devraldın; büyük provayı da senin yönetmeni bekliyorlar.", en: "You took over the rehearsal up in {yer:tepe}. Now they're expecting you to lead the big one too." } }
            sonraki: "bl13_tepe_prova_yonet"
          - id: "say"
            etiket: { tr: "Karışma; girenleri ve dönenleri say", en: "Stay out of it. Count who goes in and who comes back" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - tehlike: { tepe: 2 }
              - bayrak: "bl13_prova_sayildi"
            sonraki: "bl13_tepe_prova_say"

      - id: "bl13_tepe_prova_anne"
        yer: "tepe"
        paragraflar:
          - { tr: "Kadın ayakkabıyı göğsüne bastırıyor. \"Oğlum iki gece önce elini değil, kendini soktu,\" diyor. \"Diyakoz hazırmış dedi. Dönmedi. Ben de hazır olursam belki içeride bulurum diye bekliyorum.\"", en: "The woman presses the shoe to her chest. \"Two nights ago my son didn't put his hand in. He put himself in,\" she says. \"The deacon said he was ready. He didn't come back. I figure if I get ready too, maybe I'll find him in there.\"" }
          - { tr: "Sesini alçaltıyor: \"Bu kapı küçük. Asıl provayı Kule'nin dibinde yapacaklar, her gün kapı açılan meydanda. Hepimiz birlikte, iki yüz kişi. Diyakoz tarihi söyledi.\"", en: "She drops her voice. \"This one's small. The real rehearsal's going to be at the foot of the Spire, in the plaza where a Gate opens every day. All of us together, two hundred people. The deacon gave us the date.\"" }
        secenekler:
          - id: "gel"
            etiket: { tr: "\"O gün ben de orada olacağım.\"", en: "\"I'll be there that day too.\"" }
            sonraki: "@akis"
          - id: "ayakkabi"
            etiket: { tr: "Ayakkabıya bak; bir şey söyleme", en: "Look at the shoe. Don't say anything" }
            sonraki: "@akis"

      - id: "bl13_tepe_prova_kapat"
        yer: "tepe"
        paragraflar:
          - { tr: "Sıranın yanından yürüyüp çınarın dibine diz çöküyorsun. Kapının ışığı avucunu yakıyor ama geri çekmiyorsun; parmaklarını kapatınca kapı da onlarla birlikte kapanıyor, bir şişenin ağzı gibi.", en: "You walk past the line and kneel at the foot of the tree. The Gate's light burns your palm, but you don't pull back. When you close your fingers, the Gate closes with them, like the mouth of a bottle." }
          - { tr: "Bahçeye zifiri karanlık çöküyor. Sıradan bir uğultu yükseliyor, sonra biri ağlamaya başlıyor. Diyakozun sesi titriyor: \"Provayı sen bozdun. Fırtına gecesi kapılar senin elinden büyük olacak.\"", en: "Pitch dark falls over the garden. A murmur rises from the line, then somebody starts crying. The deacon's voice shakes. \"You ruined the rehearsal. On storm night the Gates will be bigger, and it'll be your hand that did it.\"" }
        secenekler:
          - id: "ac"
            etiket: { tr: "Avucunu aç; boş olduğunu göster", en: "Open your hand. Show them it's empty" }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Karanlıkta yürüyüp git", en: "Walk off into the dark" }
            sonraki: "@akis"

      - id: "bl13_tepe_prova_yonet"
        yer: "tepe"
        paragraflar:
          - { tr: "Sesini yükseltmeden konuşuyorsun; yine de sıra dalgalanıp susuyor. \"Prova kapıya girmek değil,\" diyorsun. \"Kapının yanında durmak. Fırtına gecesi biri durmayı bilmeli.\"", en: "You don't raise your voice, but the line still ripples and goes quiet. \"The rehearsal isn't walking into the Gate,\" you say. \"It's standing next to it. On storm night, somebody needs to know how to stand.\"" }
          - { tr: "Diyakoz önce itiraz etmeye davranıyor, sonra sıranın kendinden çok sana baktığını görüp geri çekiliyor. O gece kapının ışığına kimse dokunmuyor.", en: "The deacon starts to object, then sees the line is looking at you, not him, and backs off. Nobody touches the Gate's light that night." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapının yanında sabaha kadar dur", en: "Stand by the Gate until morning" }
            sonraki: "@akis"

      - id: "bl13_tepe_prova_say"
        yer: "tepe"
        paragraflar:
          - { tr: "Bir ağacın gölgesinde oturup sayıyorsun. Kırk üç kişi elini sokuyor; kırk üçü de geri çekiyor. Biri, genç bir adam, elini değil kolunu omzuna kadar sokuyor ve geri çektiğinde kolu gri, kupkuru.", en: "You sit in the shade of a tree and count. Forty-three people put a hand in. All forty-three pull it back. One, a young man, puts in not his hand but his whole arm to the shoulder, and when he pulls it back, it's gray and bone-dry." }
          - { tr: "Diyakoz onun gri kolunu kaldırıp sıraya gösteriyor: \"Kapı onu seçti!\" Sıra alkışlıyor.", en: "The deacon holds the gray arm up for the line to see. \"The Gate chose him!\" The line applauds." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defterine kırk üç yaz", en: "Write forty-three in your notebook" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · BEYAZ ALAY (tohum: bl13_tepe_prova)
  - id: "bl13_kd_alay"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["kule_dibi", "yukselenler", "kapi", "savas"]
    gerilim: 3
    kart: { tr: "Beyaz alay", en: "The White Procession" }
    sahne: "bl13_kd_alay_1"
    sahneler:
      - id: "bl13_kd_alay_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşamüstü {yer:kule_dibi|e} bir alay iniyor: iki yüz kişi, hepsi beyazlar içinde, ellerinde söndürülmüş fenerler. Pazarcılar tezgâhlarının ardından ıslık çalıyor, biri çürük bir domates fırlatıyor. Alay aldırmıyor; meydanın ortasına, her gün bir kapının açıldığı noktaya yürüyüp halka oluyor.", en: "Late in the afternoon a procession comes down into {yer:kule_dibi}: two hundred people, all in white, carrying lanterns they haven't lit. Vendors whistle from behind their stalls, and somebody throws a rotten tomato. The procession doesn't care. They walk to the middle of the plaza, the spot where a Gate opens every day, and form a ring." }
          - { tr: "Diyakoz sayıyor. Halka bir, iki, üç, dört diye bir adım öne çıkıyor, sonra duruyor. Taşların ortasında hava titremeye başlıyor; bugünkü kapı her zamankinden erken geliyor, sanki çağrılmış gibi.", en: "The deacon counts. The ring steps forward on one, two, three, four, then stops. In the middle of the stones the air starts to shimmer. Today's Gate is coming early, like it was called." }
          - metin: { tr: "Sıranın en önünde ayakkabılı kadın var. Ayakkabıyı bu kez boynuna asmış.", en: "The woman with the shoe is at the very front. This time she's wearing the shoe on a cord around her neck." }
            kosul: { bayrak: "bl13_prova_anne" }
          - metin: { tr: "Halka seni görünce açılıyor; diyakoz geri çekilip ortadaki yeri sana gösteriyor.", en: "The ring opens up when it sees you. The deacon steps back and offers you the spot in the middle." }
            kosul: { bayrak: "bl13_prova_yonetildi" }
          - metin: { tr: "Diyakoz seni kalabalığın içinde görüyor. \"Çay bahçesinde kapımızı elinden aldın,\" diyor yüksek sesle. \"Bu kapı Kule'nin. Bunu alamazsın.\"", en: "The deacon spots you in the crowd. \"You took our Gate from us in the tea garden,\" he says loudly. \"This Gate belongs to the Spire. This one you can't take.\"" }
            kosul: { bayrak: "bl13_prova_kapandi" }
          - { tr: "Tepede, Kule'nin gövdesinin çevresinde, geniş bir gölge daire çizmeye başlıyor. Gölge küçülüyor; bir akbaba alçalıyor.", en: "Up high, around the body of the Spire, a wide shadow starts to circle. The shadow is shrinking. A vulture is coming down." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Akbaba halkaya değil, tek bir noktaya bakıyor: en önde, boynunda ayakkabı taşıyan kadına. Halkanın en zayıf yerine.", en: "The vulture isn't watching the ring. It's watching one spot: the front, the woman with the shoe around her neck. The weakest point in the ring." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "iki yüz kişi aynı ritimle sayıyor. kapı da duyuyor. akbaba da. bir sen duymamazlıktan geliyorsun.", en: "two hundred people counting in the same rhythm. the gate hears it. so does the vulture. only you're pretending not to." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kapıyı ben tutarım, akbaba senin. Tartışma.\"", en: "\"I'll hold the Gate, you take the bird. Don't argue.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Saymayı bıraksınlar. Ciddiyim, sayınca kapı hızlanıyor. Ölçtüm.\"", en: "\"Make them stop counting. I'm serious, the Gate speeds up when they count. I measured it.\"" }
        secenekler:
          - id: "akbaba"
            etiket: { tr: "Akbabanın önüne çık", en: "Get between the vulture and the ring" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_alay_zafer", kaybet: "bl13_kd_alay_yenilgi", kac: "bl13_kd_alay_kacis" }
          - id: "sayim"
            etiket: { tr: "Diyakozun sayımını kes: \"Beşi yok. Beşinci adım yok.\"", en: "Cut off the count. \"There's no five. No fifth step.\"" }
            gerekli: { stat: { cha: 220 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { yukselenler: -1 }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl13_alay_dagildi"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 12
            sonraki: "bl13_kd_alay_sayim"
          - id: "orta"
            etiket: { tr: "Halkanın ortasına geç; kapının önünde sen dur", en: "Take the middle of the ring. You stand in front of the Gate" }
            goster: { bayrak: "bl13_prova_yonetildi" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { yukselenler: 3 }
              - dikkat: 2
              - bayrak: "bl13_alay_yonetildi"
              - iliski: { vahit: { saygi: 3 } }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 14
            sonraki: "bl13_kd_alay_orta"
          - id: "seyret"
            etiket: { tr: "Pazarcıların yanında kal; beyazlılar kendi seçimini yaptı", en: "Stay with the vendors. The people in white made their choice" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - tehlike: { kule_dibi: 3 }
              - bayrak: "bl13_alay_seyredildi"
            sonraki: "bl13_kd_alay_seyret"

      - id: "bl13_kd_alay_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akbaba halkanın tam üstünde, kanatlarını yarı açık bırakmış halde taşlara çakılıyor. Beyazlılar ilk kez saymayı unutuyor. Ortadaki kapı ritmini kaybedip titriyor, sonra kendi kendine sönüyor.", en: "The vulture slams into the stones right over the ring with its wings half spread. For the first time, the people in white forget to count. The Gate in the middle loses its rhythm, flickers, then goes out on its own." }
          - { tr: "Ayakkabılı kadın akbabanın kanadının dibinde dizlerinin üstüne çökmüş, sana bakıyor. Diyakoz bir şey söylemek için ağzını açıyor, sonra kapatıyor.", en: "The woman with the shoe has dropped to her knees by the vulture's wing, looking up at you. The deacon opens his mouth to say something, then shuts it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Eve dönün. Fırtına gecesi sığınağa inin.\"", en: "\"Go home. On storm night, get down into a shelter.\"" }
            etkiler:
              - tehlike: { kule_dibi: -4 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_alay_kurtarildi"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl13_kd_alay_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akbabanın pençesi seni yerden kaldırıp pazarın tentelerinin üstüne fırlatıyor. Tenteler yırtılıyor, sen de tezgâhların arasına yuvarlanıyorsun.", en: "The vulture's talons lift you off the ground and fling you onto the market awnings. The canvas tears and you tumble down between the stalls." }
          - { tr: "Ayağa kalktığında akbaba çoktan havalanmış; pençesinde beyaz bir şey var. Halka dağılmış, kapı sönmüş. Meydanın ortasında yalnızca bir çocuk ayakkabısı kalmış.", en: "By the time you're on your feet, the vulture's already airborne with something white in its claws. The ring's scattered and the Gate's gone out. In the middle of the plaza, all that's left is a little kid's shoe." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Tezgâhın üstüne çık; akbabaya yetiş", en: "Climb up on a stall. Go after the vulture" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_alay_zafer", kaybet: "bl13_kd_alay_kacis", kac: "bl13_kd_alay_kacis" }
          - id: "ayakkabi"
            etiket: { tr: "Ayakkabıyı yerden al", en: "Pick the shoe up off the ground" }
            etkiler:
              - can: 20
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "bl13_alay_kayip"
            sonraki: "@akis"

      - id: "bl13_kd_alay_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Akbaba halkanın üstüne iniyor, beyazlılar çığlık çığlığa dağılıyor. Kapı ritmini kaybedip sönüyor ama halkanın önünde duran kadın artık orada değil.", en: "You fall back. The vulture comes down on the ring and the people in white scatter, screaming. The Gate loses its rhythm and goes out, but the woman who was standing at the front isn't there anymore." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Meydanın ortasına yürü", en: "Walk to the middle of the plaza" }
            etkiler:
              - degisken: { hayatta_kalan: -1 }
              - bayrak: "bl13_alay_kayip"
            sonraki: "@akis"

      - id: "bl13_kd_alay_sayim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sesin diyakozun sayımının tam esine oturuyor. Halka dördüncü adımda kalakalıyor; kimse beşinciyi atmıyor. Ortadaki kapı bir an bekliyor, sonra sabrı tükenmiş gibi kendi içine çöküyor.", en: "Your voice lands right in the rest of the deacon's count. The ring freezes on the fourth step. Nobody takes a fifth. The Gate in the middle waits a second, then caves in on itself like it ran out of patience." }
          - { tr: "Akbaba bir tur daha atıp yükseliyor. Beyazlılar şaşkın şaşkın birbirine bakıyor; bazıları fenerlerini yakıyor, ilk kez.", en: "The vulture makes one more pass and climbs away. The people in white look at each other, lost. A few of them light their lanterns, for the first time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yakılan fenerleri say", en: "Count the lit lanterns" }
            sonraki: "@akis"

      - id: "bl13_kd_alay_orta"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halkanın ortasına geçip kapının önüne dikiliyorsun. Akbaba alçalırken gölgesi seni buluyor, ama halkanın en zayıf yerinde artık sen varsın. Bir tur atıp vazgeçiyor.", en: "You step into the middle of the ring and plant yourself in front of the Gate. As the vulture drops, its shadow finds you, but the weakest point in the ring is you now. It makes one pass and gives up." }
          - { tr: "Kapı önünde durmanı bir süre tartıyor. Sonra kendiliğinden sönüyor. Arkandaki iki yüz kişi tek ağızdan bir ilahiye başlıyor; senin adın da geçiyor içinde.", en: "The Gate seems to weigh you standing there for a while. Then it goes out on its own. Behind you, two hundred people start a hymn in one voice. Your name's in it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İlahinin bitmesini bekle", en: "Wait for the hymn to end" }
            sonraki: "@akis"

      - id: "bl13_kd_alay_seyret"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarcıların arasından izliyorsun. Akbaba halkanın önüne iniyor ve yeniden havalandığında beyazlılardan biri eksik. Kalanlar saymaya devam ediyor; dördüncü adımda kapı kendiliğinden sönüyor.", en: "You watch from among the vendors. The vulture comes down at the front of the ring, and when it lifts off again, one of the people in white is missing. The rest keep counting. On the fourth step, the Gate goes out by itself." }
          - { tr: "Diyakoz sesini yükseltiyor: \"Biri seçildi!\" Kestaneci kadın tezgâhın ardından başını sallıyor, sonra kömürü karıştırmaya dönüyor.", en: "The deacon raises his voice. \"One has been chosen!\" Behind her stall, the chestnut woman shakes her head and goes back to stirring the coals." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pazardan ayrıl", en: "Leave the market" }
            etkiler:
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

  # ================================================================== PİRİNÇ KERVAN · AYAR TAŞLARI
  - id: "bl13_kervan_oyma"
    konum: ["pirinc_kervan"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "pirinc_kervan", "kadimler", "kapi"]
    gerilim: 3
    kart: { tr: "Oymacı güvertesi", en: "The Carvers' Deck" }
    sahne: "bl13_kervan_oyma_1"
    sahneler:
      - id: "bl13_kervan_oyma_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Kervanın alt güvertelerinden birinde çekiç sesleri hiç durmuyor. Uzun bir tezgâhın başında yirmi Tavvar oymacı yan yana oturmuş, avuç içi kadar kara taşlara aynı deseni kazıyor: dört çentik, bir boşluk. Dört çentik, bir boşluk.", en: "On one of the Caravan's lower decks, the hammering never stops. Twenty Tavvar carvers sit side by side along a long bench, cutting the same pattern into palm-sized black stones. Four notches, a gap. Four notches, a gap." }
          - { tr: "Tezgâhın ucunda pirinç bir sandık duruyor, kapağında Kadim yazısıyla bir sipariş pusulası çivili. Pusulanın altına Tavvar harfleriyle bir çeviri iliştirilmiş: Teslim yeri, Toprak Katmanı. Adet, yedi. Ödeme, senetten düşülecek.", en: "At the end of the bench sits a brass chest with an order slip in Ancient script nailed to the lid. Under it, someone has pinned a translation in Tavvar letters: Delivery, Earth Layer. Quantity, seven. Payment, deducted from the bond." }
          - { tr: "Oymacılardan biri, yaşlı ve tek gözlü bir kadın, çekicini bırakıp sana küçük bir pul uzatıyor; konuşmak istiyor. Derisinin pulları arasında yeni sökülmüş üç yuvanın izi kızarıyor. Adı Tasu.", en: "One of the carvers, an old woman with one eye, sets down her hammer and holds out a little scale to you. She wants to talk. Between the scales on her skin, three fresh gaps where scales were pried out are still red. Her name is Tasu." }
          - metin: { tr: "Tasu seni tanıyor. \"Senet senin adına yazıldı,\" diyor, başını eğmeden. \"Yani bu taşlar da senin borcundan düşülüyor. Biliyor muydun?\"", en: "Tasu knows who you are. \"The bond was rewritten in your name,\" she says, without bowing. \"So these stones come off your debt too. Did you know that?\"" }
            kosul: { bayrak: "kervan_sahibi" }
          - metin: { tr: "\"Kervan özgür,\" diyor Tasu acı acı gülerek. \"Senet kırıldı. Ama eski siparişler kırılmadı; borcun son taksitleri bunlar. Son yedi taş.\"", en: "\"The Caravan's free,\" Tasu says with a bitter laugh. \"The bond's broken. The old orders aren't, though. These are the last installments on the debt. The last seven stones.\"" }
            kosul: { bayrak: "kervan_ozgur" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Bitmiş taşlar sandığın içinde birbirine değince hafifçe titriyor. Dört vuruş, bir es. Şehirdeki kapıların ritmi, burada, bir tezgâhın üstünde kazınıyor.", en: "The finished stones hum faintly where they touch in the chest. Four beats, a rest. The rhythm of the Gates back home, being carved by hand on a workbench." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yedi taş. yedi kapı. birileri fırtınayı sipariş vermiş, taksitle.", en: "seven stones. seven gates. somebody ordered the storm. on an installment plan." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu desen... Kızın mırıldandığı ritim. Ağ'ın kayıtlarındaki. Taşa kazınmış hali bu.\"", en: "\"That pattern... it's the rhythm. The one in the Network's recordings. This is it, carved in stone.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Toprak Katmanı. Bizi böyle mi yazıyorlar? Toprak? Saksı gibi?\"", en: "\"Earth Layer. That's what they call us? Like potting soil?\"" }
        secenekler:
          - id: "sor"
            etiket: { tr: "Pulu al; siparişi kimin verdiğini sor", en: "Take the scale. Ask who placed the order" }
            gerekli: { stat: { cha: 200 } }
            etkiler:
              - bayrak: "bl13_tas_siparis"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_kd_oymaci", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Kervandaki oymacının söyledikleri peşini bırakmıyor: {yer:kule_dibi|de} pirinç pullu biri seni soruyormuş.", en: "What the Caravan carver told you won't leave you alone. And somebody with brass scales is asking for you in {yer:kule_dibi}." } }
            sonraki: "bl13_kervan_oyma_sor"
          - id: "kacir"
            etiket: { tr: "Tasu'ya geçidi göster: \"Benimle gel.\"", en: "Show Tasu the passage. \"Come with me.\"" }
            goster: { herhangi: [{ bayrak: "kervan_muhur_ezildi" }, { bayrak: "kervan_kefe_daveti" }, { bayrak: "kervan_ozgur" }] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - bayrak: "bl13_tasu_kacti"
              - iliski: { thessar: { guven: -2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_kd_oymaci", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Tasu'yu {yer:kule_dibi|e} indirdin; peşinden gelen olup olmadığını merak ediyorsun.", en: "You brought Tasu down to {yer:kule_dibi}. You keep wondering whether anybody followed her." } }
            sonraki: "bl13_kervan_oyma_kacir"
          - id: "al"
            etiket: { tr: "Sandıktan bir taş al; cebine koy", en: "Take one stone from the chest. Pocket it" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bayrak: "bl13_tas_alindi"
              - iliski: { yanki: { guven: 1 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_kd_oymaci", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Cebindeki kara taş üç gündür dört vuruşta bir titriyor.", en: "The black stone in your pocket has been humming every fourth beat for three days." } }
            sonraki: "bl13_kervan_oyma_al"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Sandığı devir; bitmiş taşları güvertede ez", en: "Kick over the chest. Crush the finished stones on the deck" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -2, merhamet: 1 }
              - bayrak: "bl13_taslar_kirildi"
              - iliski: { thessar: { saygi: 2, guven: -3 } }
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya"], ortam: ["dar_gecit"], kazan: "bl13_kervan_oyma_zafer", kaybet: "bl13_kervan_oyma_yenilgi", kac: "bl13_kervan_oyma_kacis" }
          - id: "git"
            etiket: { tr: "Pulu geri ver; başka güverteye geç", en: "Hand back the scale. Move on to another deck" }
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_sor"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tasu pulu avucuna kapatıp eğiliyor, sesini çekiç seslerinin altına gömüyor. \"Sipariş {yer:yedi_taht|den}. Kâtibin mührü İkinci Taht'ın. Taşlar ayar taşı; kapıyı açmaz, akort eder. Yedisi bir arada çalınca kapılar aynı anda açılır.\"", en: "Tasu closes the scale in her fist and leans in, burying her voice under the hammering. \"The order's from {yer:yedi_taht}. The clerk's seal belongs to the Second Throne. These are tuning stones. They don't open Gates. They tune them. Play all seven together, and the Gates open at once.\"" }
          - { tr: "\"Bizde de kazınmıştı,\" diye ekliyor. \"Dört yüz yıl önce. Kervan senedi imzalamadan bir ay önce.\" Çekicini yeniden eline alıyor. \"Bu kadarı bir pul eder. Fazlası bir göze mal olur.\"", en: "\"They carved them for us too,\" she adds. \"Four hundred years ago. A month before the Caravan signed the bond.\" She picks her hammer back up. \"That much is worth one scale. Any more costs an eye.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Teşekkür et; sandığa son bir kez bak", en: "Thank her. Take one last look at the chest" }
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_kacir"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tasu uzun süre sana bakıyor; tek gözünde yıllar ağır ağır dönüyor. Sonra çekicini tezgâha bırakıp önlüğünü çıkarıyor. \"Pullarımın yarısı burada kalacak,\" diyor. \"Defterimin yarısı. Doğumum, evliliğim. Ölümümü öbür tarafta yazarım.\"", en: "Tasu looks at you for a long time, years turning slowly in her one eye. Then she sets her hammer on the bench and takes off her apron. \"Half my scales stay here,\" she says. \"Half my ledger. My birth, my marriage. I'll write my death on the other side.\"" }
          - { tr: "Öbür oymacılar başlarını kaldırmıyor. Çekiçleri yalnızca bir an duruyor; Tasu'nun vuruşlarının yeri boş kalıyor, sonra yeniden başlıyorlar.", en: "The other carvers don't look up. Their hammers just stop for a moment, leaving a space where Tasu's used to be, then start again." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu geçide götür", en: "Take her to the passage" }
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_al"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Sandığın kapağını kaldırıp bitmiş taşlardan birini avucuna alıyorsun. Taş sıcak; avucunda dört kez atıp susuyor. Tasu görmezden geliyor. Öbür oymacılar da.", en: "You lift the lid and take one of the finished stones in your palm. It's warm. It beats four times in your hand and goes quiet. Tasu pretends not to see. So do the other carvers." }
          - { tr: "Güvertenin ucunda pirinç zırhlı bir muhafız duruyor. Kaskının yarığı ağır ağır sana dönüyor, sonra yeniden önüne.", en: "At the end of the deck stands a guard in brass armor. The slit in its helmet turns slowly toward you, then back to the front." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ağır adımlarla güverteden çık", en: "Walk off the deck, nice and slow" }
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_zafer"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Muhafızın zırhı güvertenin pirinç döşemesine yığılıyor. Etrafına saçılmış taşların çoğu ikiye ayrılmış; içleri boş, kurumuş bir kalbin odacıkları gibi.", en: "The guard's armor crashes onto the brass deck plates. Most of the stones scattered around it have split in two. They're hollow inside, like the chambers of a dried-out heart." }
          - { tr: "Tasu kırık taşlardan birini alıp çentiklerine bakıyor. \"Yeniden oyarlar,\" diyor. \"Ama bu kez bir hafta geç. Fırtınan bir hafta geç gelir belki.\"", en: "Tasu picks up one of the broken stones and studies the notches. \"They'll carve them again,\" she says. \"But a week late this time. Maybe your storm comes a week late.\"" }
          - { tr: "Sandığın dibinde ezilmemiş tek bir taş kalmış. Ötekilerin hepsi parçalanırken o kıpırdamamış bile.", en: "There's one stone left uncrushed at the bottom of the chest. While all the others shattered, it never even moved." }
        secenekler:
          - id: "son"
            etiket: { tr: "Son taşı da cebine al", en: "Pocket that last stone too" }
            etkiler:
              - bayrak: "bl13_tas_alindi"
              - xp_seviye: 12
              - tohum: { olay: "bl13_kd_oymaci", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Kervandan aldığın son taş cebinde titreyip duruyor.", en: "The last stone you took off the Caravan keeps humming in your pocket." } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Taşı orada bırak; güverteden çık", en: "Leave the stone. Get off the deck" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_yenilgi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Muhafızın mızrağı seni güvertenin korkuluğuna çiviliyor. Makine sesiyle bir cümle tekrarlıyor: \"Değerlendirme tamamlandı. Hasar: bir sandık. Bedel: kaydedildi.\"", en: "The guard's pike pins you to the deck railing. In its machine voice, it repeats a line: \"Assessment complete. Damage: one chest. Cost: recorded.\"" }
          - { tr: "Kendine geldiğinde güverte boş. Sandık yeni taşlarla doldurulmuş; oymacılar hiçbir şey olmamış gibi çalışıyor. Tasu'nun oturduğu yer ise boş.", en: "When you come to, the deck is empty. The chest has been refilled with new stones, and the carvers are working like nothing happened. Tasu's seat, though, is empty." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Doğrul; muhafızı bul", en: "Get up. Find the guard" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya"], ortam: ["dar_gecit"], kazan: "bl13_kervan_oyma_zafer", kaybet: "bl13_kervan_oyma_kacis", kac: "bl13_kervan_oyma_kacis" }
          - id: "birak"
            etiket: { tr: "Bırak; yaralarını sar", en: "Let it go. Patch yourself up" }
            etkiler:
              - can: 20
              - bayrak: "bl13_tasu_cezalandi"
            sonraki: "@akis"

      - id: "bl13_kervan_oyma_kacis"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Güverteden geri çekiliyorsun. Muhafız seni kovalamıyor; yalnızca devrilen sandığın başında durup kırılan her taşı tek tek sayıyor. Sayının yanına bir ad yazılacak; senin değil, Tasu'nun.", en: "You fall back off the deck. The guard doesn't chase you. It just stands over the toppled chest and counts every broken stone, one at a time. A name will be written next to that number. Not yours. Tasu's." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kervanın kalabalığına karış", en: "Disappear into the Caravan crowds" }
            etkiler:
              - bayrak: "bl13_tasu_cezalandi"
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · PİRİNÇ PULLU KONUK (tohum: bl13_kervan_oyma)
  - id: "bl13_kd_oymaci"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["kule_dibi", "kadimler", "kapi"]
    gerilim: 3
    kart: { tr: "Pirinç pullu konuk", en: "The Guest with Brass Scales" }
    sahne: "bl13_kd_oymaci_1"
    sahneler:
      - id: "bl13_kd_oymaci_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{yer:kule_dibi|in} pazarında, ölü tırmanıcıların eşyalarını satan tezgâhların arasında bir kalabalık birikmiş. Ortada pirinç rengi bir şey parlıyor.", en: "In the {yer:kule_dibi} market, between the stalls that sell dead climbers' gear, a crowd has gathered. Something brass-colored is glinting in the middle of it." }
          - metin: { tr: "Tasu bir tezgâhın arkasına sinmiş, önüne oyduğu pirinç bilezikleri dizmiş, satıyor. Kalabalık onu altı parmaklı ellerinden, derisindeki pullardan tanıyıp çevresini sarmış; kimi bileziğe, kimi pullara uzanıyor.", en: "Tasu is crouched behind a stall with brass bracelets she carved laid out in front of her, selling. The crowd has recognized her by her six-fingered hands and the scales on her skin, and they've closed in, some reaching for the bracelets, some for the scales." }
            kosul: { bayrak: "bl13_tasu_kacti" }
          - metin: { tr: "Seni görünce tek gözü irileşiyor. \"Geldiler,\" diyor. \"Dün gece. Geçitten.\"", en: "When she sees you, her one eye goes wide. \"They came,\" she says. \"Last night. Through the passage.\"" }
            kosul: { bayrak: "bl13_tasu_kacti" }
          - metin: { tr: "Kalabalığın ortasında pirinç zırhlı bir muhafız duruyor. Mızrağını pazarın taşlarına dikmiş, makine sesiyle bir cümleyi tekrarlıyor: \"Beyan edilmemiş yük. Taşıyıcı bu meydanda.\"", en: "In the middle of the crowd stands a guard in brass armor. Its pike is planted in the market paving, and it's repeating a line in its machine voice: \"Undeclared cargo. Carrier present in this square.\"" }
            kosul: { bayrak: "bl13_tas_alindi", bayrak_yok: "bl13_tasu_kacti" }
          - metin: { tr: "Cebindeki taş dört kez atıp susuyor. Kask ağır ağır sana dönüyor.", en: "The stone in your pocket beats four times and goes quiet. The helmet turns slowly toward you." }
            kosul: { bayrak: "bl13_tas_alindi", bayrak_yok: "bl13_tasu_kacti" }
          - metin: { tr: "Kalabalığın ortasında Tasu duruyor. Bir tezgâhın önünde, ölü tırmanıcıların zırhlarını tek tek eline alıp tartıyor.", en: "Tasu is standing in the middle of the crowd. She's at a stall, picking up dead climbers' armor piece by piece and weighing it in her hands." }
            kosul: { bayrak: "bl13_tas_siparis", bayrak_yok: ["bl13_tasu_kacti", "bl13_tas_alindi"] }
          - metin: { tr: "Seni görünce eğilmiyor. \"Seninle konuştuğum duyuldu,\" diyor. \"Fazlası bir göze mal olur demiştim; ikincisini vermeden geçide kaçtım.\"", en: "She doesn't bow when she sees you. \"Word got around that I talked to you,\" she says. \"I told you more would cost an eye. I ran for the passage before they took the second one.\"" }
            kosul: { bayrak: "bl13_tas_siparis", bayrak_yok: ["bl13_tasu_kacti", "bl13_tas_alindi"] }
          - { tr: "Kule'nin gölgesi meydanın üstünden kayıyor. Pazarın öbür ucunda bugünkü kapı titremeye başlamış.", en: "The Spire's shadow slides across the plaza. At the far end of the market, today's Gate has started to shimmer." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Muhafızın zırhında da aynı çentikler var: dört çentik, bir boşluk. Taşların peşinden gelen şey, onlarla aynı elden çıkmış.", en: "The guard's armor carries the same notches: four, then a gap. Whatever's come after the stones was made by the same hands." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "öbür tarafın borcu buraya taşındı. borç böyledir, kapı tanımaz.", en: "the other side's debt followed it over here. debt's like that. it doesn't know what a gate is." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sökülen pulların yerleri iltihaplanmış. Önce onu bir sarayım, sonra kime ait olduğuna karar verirsiniz.\"", en: "\"The sockets where they pulled her scales are infected. Let me dress those first. Then you can all decide who she belongs to.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "{npc:aras_kurt} pirinç zırha bakarken yüzü gerginleşiyor. \"Göğsümdeki şey bunları tanıyor,\" diyor. \"Selam veriyor.\"", en: "{npc:aras_kurt|pos} face goes tight as he looks at the brass armor. \"The thing in my chest knows these,\" he says. \"It's saying hello.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Muhafızla meydanda hesaplaş", en: "Settle it with the guard here in the plaza" }
            goster: { bayrak: "bl13_tas_alindi" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_oymaci_zafer", kaybet: "bl13_kd_oymaci_yenilgi", kac: "bl13_kd_oymaci_kacis" }
          - id: "ver"
            etiket: { tr: "Taşı Ağ'a ver; muhafızın elinden geçmesin", en: "Hand the stone to the Network, out of the guard's reach" }
            goster: { bayrak: "bl13_tas_alindi" }
            etkiler:
              - iliski: { mert_kilic: { guven: 4, saygi: 2 } }
              - itibar: { sessiz_ag: 3 }
              - bayrak: "bl13_tas_agda"
              - xp_seviye: 10
            sonraki: "bl13_kd_oymaci_ag"
          - id: "siginak"
            etiket: { tr: "Tasu'yu Sığınak'a götür; Konsey'in koruması altına al", en: "Take Tasu to the Haven, under the Council's protection" }
            goster: { herhangi: [{ bayrak: "bl13_tasu_kacti" }, { bayrak: "bl13_tas_siparis" }] }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - itibar: { siginak: 2 }
              - bayrak: "bl13_tasu_siginakta"
              - xp_seviye: 10
            sonraki: "bl13_kd_oymaci_siginak"
          - id: "teslim"
            etiket: { tr: "{fraksiyon:kadimler|e} haber yolla; borçlarını kendileri toplasın", en: "Send word to {fraksiyon:kadimler|k}. Let them collect" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -3 }
              - itibar: { kadimler: 3 }
              - iliski: { thessar: { saygi: 3, guven: 2 } }
              - bayrak: "bl13_oymaci_teslim"
              - xp_seviye: 8
            sonraki: "bl13_kd_oymaci_teslim"
          - id: "tasi_sor"
            etiket: { tr: "\"Taşları susturmanın yolu var mı?\"", en: "\"Is there a way to silence the stones?\"" }
            gerekli: { stat: { int: 220 } }
            etkiler:
              - bayrak: "bl13_tas_susturma"
              - iliski: { yanki: { saygi: 2 } }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 12
            sonraki: "bl13_kd_oymaci_sor"

      - id: "bl13_kd_oymaci_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Muhafız pazarın taşlarına yığılınca zırhının içinden yalnızca pirinç tozu dökülüyor. Kalabalık bir adım geri çekilip ardından toza saldırıyor; birkaç saniye içinde son zerresine kadar ceplere doluşuyor.", en: "When the guard collapses onto the paving stones, nothing pours out of its armor but brass dust. The crowd takes a step back, then lunges for the dust. In a few seconds every last grain of it is in somebody's pocket." }
          - { tr: "Cebindeki taş artık atmıyor. Belki de yalnızca bekliyor.", en: "The stone in your pocket isn't beating anymore. Or maybe it's just waiting." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Taşı cebinde tut", en: "Keep the stone in your pocket" }
            etkiler:
              - tehlike: { kule_dibi: -2 }
              - iliski: { yanki: { saygi: 2 } }
              - bayrak: "bl13_muhafiz_yenildi"
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pirinç mızrak seni tezgâhların arasından geçirip bir zırh yığınının içine savuruyor. Toparlandığında muhafız cebini çoktan boşaltmış, geçide doğru yürüyor.", en: "The brass pike sweeps you through the stalls and into a pile of armor. By the time you pull yourself together, the guard has already emptied your pocket and is walking back toward the passage." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk; geçide varmadan yetiş", en: "Get up. Catch it before it reaches the passage" }
            etkiler:
              - savas: { dusmanlar: ["gumruk_muhafizi@dunya"], ortam: ["tavan"], kazan: "bl13_kd_oymaci_zafer", kaybet: "bl13_kd_oymaci_kacis", kac: "bl13_kd_oymaci_kacis" }
          - id: "birak"
            etiket: { tr: "Bırak gitsin", en: "Let it go" }
            etkiler:
              - can: 20
              - bayrak: "bl13_tas_geri_alindi"
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kalabalığın arasına karışıp uzaklaşıyorsun. Muhafız taşı yakalayamıyor ama meydandan da çıkmıyor; pazarın ortasında, mızrağı taşlara dikili, bekliyor. Tezgâhlar birer birer kapanıyor.", en: "You slip into the crowd and get clear. The guard can't get to the stone, but it doesn't leave the plaza either. It just stands in the middle of the market, pike planted in the stones, waiting. One by one, the stalls close up." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pazardan ayrıl", en: "Leave the market" }
            etkiler:
              - tehlike: { kule_dibi: 3 }
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_ag"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ağ'ın bir koşucusu taşı kurşun kaplı bir kutuya koyup kalabalığın arasında kayboluyor. Muhafızın kaskı bir an kutunun ardından dönüyor, sonra sinyali yitirip geçide doğru yürüyüp gidiyor.", en: "A Network runner drops the stone into a lead-lined box and vanishes into the crowd. The guard's helmet swings after the box for a moment, then it loses the signal and walks off toward the passage." }
          - { tr: "O akşam Ağ'dan elden bir kaset geliyor; üstünde tek bir kayıt var: \"Taşı açtık. İçinde bir frekans var. Fırtına gecesi bunu tersine çalarsak belki birini susturabiliriz.\"", en: "That evening a cassette comes over from the Network by hand, with one message on it. \"We opened the stone. There's a frequency inside. If we play it backwards on storm night, maybe we can shut one of them up.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Belki mi?\"", en: "\"Maybe?\"" }
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_siginak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tasu'yu Sığınak'a, gümrük binasının arkasındaki bir odaya yerleştiriyorsun. Oda küçük ve penceresiz. Tasu duvara dokunup gülümsüyor. \"Pirinç değil,\" diyor. \"Taş. Kimse tartmamış.\"", en: "You set Tasu up in a room behind the Customs House at the Haven. It's small and has no windows. Tasu touches the wall and smiles. \"Not brass,\" she says. \"Stone. Nobody's weighed it.\"" }
          - metin: { tr: "Kapıdan çıkarken arkandan sesleniyor: \"Taşlar yedi. Yedisinin sesini biliyorum. Fırtına gecesi kulağım sizde.\"", en: "As you head out, she calls after you. \"There are seven stones. I know the voice of every one. On storm night, my ears are yours.\"" }
            kosul: { bayrak: "bl13_tas_siparis" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapıyı arkandan yavaşça kapat", en: "Close the door gently behind you" }
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_teslim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haberin yerine ulaşması bir saat sürüyor. Geçitten iki muhafız daha iniyor, kalabalığı yarıp geçiyor ve aradıklarını alıp geri dönüyor. Kimse karşı koymuyor.", en: "It takes an hour for word to get where it's going. Two more guards come down through the passage, cut through the crowd, take what they came for and go back up. Nobody puts up a fight." }
          - { tr: "Akşam {fraksiyon:kadimler|den} bir pul geliyor: üstünde tek bir hece. Teşekkür etmenin pirinç dilindeki karşılığı bu; bedeli de ödenmiş.", en: "That evening a scale arrives from {fraksiyon:kadimler|k}, with a single syllable on it. It's how you say thank you in brass. Already paid for." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pulu cebine at", en: "Drop the scale in your pocket" }
            sonraki: "@akis"

      - id: "bl13_kd_oymaci_sor"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Soruna Tasu cevap vermiyor; altı parmağıyla havada bir şey çiziyor: dört çentik, bir boşluk, ardından boşluğun tam ortasına tek bir çentik. \"Esi doldur,\" diyor. \"Yedisi bir arada çalarken biri esin ortasına vurursa akort bozulur. Kapılar aynı anda değil, sırayla açılır.\"", en: "Tasu doesn't answer out loud. With six fingers she draws something in the air: four notches, a gap, then one single notch in the very middle of the gap. \"Fill the rest,\" she says. \"If somebody strikes the middle of the rest while all seven are playing, the tuning breaks. The Gates open one at a time instead of all at once.\"" }
            kosul: { herhangi: [{ bayrak: "bl13_tasu_kacti" }, { bayrak: "bl13_tas_siparis" }] }
          - metin: { tr: "Tasu orada değil; cevabı muhafızın zırhındaki çentiklerden kendin okuyorsun. Dört çentik, bir boşluk; boşluğun ortasında da çizik bir iz, sanki biri bir zamanlar oraya vurmaya kalkmış.", en: "Tasu isn't there, so you read the answer yourself off the notches in the guard's armor. Four notches, a gap, and in the middle of the gap a scratch, like somebody once tried to strike right there." }
            kosul: { bayrak_yok: ["bl13_tasu_kacti", "bl13_tas_siparis"] }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Esin ortasını aklına kazı", en: "Burn the middle of the rest into your memory" }
            sonraki: "@akis"

  # ================================================================== SANAYİ · SACLAR
  - id: "bl13_sanayi_sac"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "sanayi", "lonca", "kapi"]
    gerilim: 3
    kart: { tr: "Gece vardiyası", en: "Night Shift" }
    sahne: "bl13_sanayi_sac_1"
    sahneler:
      - id: "bl13_sanayi_sac_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısı {yer:sanayi|in} haddehane avlusunda kaynak ışığı ha bire çakıp sönüyor. Vinçlerin altına on iki kamyon dizilmiş; her birinin burnuna kalın çelik saclar puntalanıyor. Kapının üstündeki tahtada tebeşirle yazılmış: FIRTINA ZIRHI. ACİL.", en: "At midnight, welding light keeps flaring and dying in the rolling-mill yard out in {yer:sanayi}. Twelve trucks are lined up under the cranes, and thick steel plate is being tacked onto the front of every one. On the board over the gate, in chalk: STORM ARMOR. RUSH." }
          - { tr: "Kamyonlardan birinin altından maskesini alnına kaldırmış bir kadın sürünerek çıkıyor. Elleri yanık izleriyle dolu, sesi kaynak dumanından kısılmış. \"Sen avcısın,\" diyor. \"Bir şey soracağım. Kapı canavarına yandan mı ateş edilir?\"", en: "A woman slides out from under one of the trucks with her welding mask pushed up on her forehead. Her hands are covered in old burns, her voice rough from the fumes. \"You're a hunter,\" she says. \"Let me ask you something. Do you shoot a Gate monster from the side?\"" }
          - { tr: "Eldiveniyle kamyonun yan sacını gösteriyor: göz hizasında, yan yana dizilmiş, tüfek namlusu genişliğinde mazgallar. Burundaki sac da düz değil; koçbaşı gibi sivri. \"Kapıdan koçbaşıyla girilmez, içeri yürünür,\" diyor. \"Koçbaşı bina kapısı kırar; bu kapıyı değil.\"", en: "She points her glove at the side plate: gun ports, rifle-barrel wide, in a row at eye level. The plate on the nose isn't flat either. It's pointed like a battering ram. \"You don't ram your way into a Gate, you walk in,\" she says. \"A ram's for breaking down a building's door. Not that kind of gate.\"" }
          - { tr: "Adı Hatice'ymiş; yirmi yıl tersanede gemi kaynatmış.", en: "Her name's Hattie. Twenty years welding hulls at the shipyard." }
          - metin: { tr: "Avlunun öbür ucunda, kollarını kavuşturmuş bir adam işçileri seyrediyor; omzunda bir balyoz. Örs, {npc:kaya_demir|in} adamı. Seni görünce gözünü kaçırmıyor.", en: "At the far end of the yard, a man with a sledgehammer over his shoulder stands with his arms crossed, watching the crew. Anvil. {npc:kaya_demir|pos} man. He sees you and doesn't look away." }
            kosul: { degisken_min: { kaya_tanidik: 1 }, bayrak_yok: ["kaya_devrildi", "lonca_cozuldu"] }
          - metin: { tr: "Hatice parmağındaki halkayı görünce sesini alçaltıyor ama susmuyor. \"Lonca'dansın, biliyorum. Lonca'dan olduğun için soruyorum zaten.\"", en: "Hattie spots the ring on your finger and drops her voice, but she doesn't stop. \"You're Guild, I know. That's exactly why I'm asking.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Kamyonların plakaları sökülmüş, kapı numaraları boyanmış. Biri bunların kime ait olduğunun bilinmesini istemiyor.", en: "The trucks' plates have been pulled and the door numbers painted over. Somebody doesn't want anybody knowing whose these are." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aynı gece iki fırtına. biri kapılardan gelecek, öbürü bu avludan. hangisini ölçmek istiyorlar, merak ediyorum.", en: "two storms the same night. one coming out of the gates, one out of this yard. makes you wonder which one they really want to measure." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "{npc:elif_sari} mazgalların hizasına bakıyor. Göğüs hizası. Yüzünden kan çekiliyor ama bir şey söylemiyor.", en: "{npc:elif_sari} looks at how high the gun ports sit. Chest height. The color drains out of her face, but she doesn't say a word." }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"On iki kamyon, plakasız. Bunlar fırtına için değil. Ya da evet, fırtına için. Başka bir fırtına.\"", en: "\"Twelve trucks, no plates. These aren't for the storm. Or, okay, they are. A different storm.\"" }
        secenekler:
          - id: "cikar"
            etiket: { tr: "\"Topla eşyanı. Seni {npc:elif_sari|e} götürüyorum.\"", en: "\"Grab your stuff. I'm taking you to {npc:elif_sari}.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -2 }
              - bayrak: "bl13_kaynakci_kacti"
              - iliski: { elif_sari: { guven: 3 }, kaya_demir: { guven: -2 } }
              - xp_seviye: 9
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "{yer:sanayi|den} çıkardığın kaynakçı Sığınak'a varmış; seni soruyormuş.", en: "The welder you got out of {yer:sanayi} made it to the Haven. She's been asking for you." } }
            sonraki: "bl13_sanayi_sac_cikar"
          - id: "defter"
            etiket: { tr: "Lonca rütbeni göster; sevkiyat defterini iste", en: "Pull Guild rank. Ask to see the shipping log" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - bayrak: "bl13_sac_defter"
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Sevkiyat defterinde okuduğun adres aklından çıkmıyor; Hatice de Sığınak'a gelmiş.", en: "You can't stop thinking about the address in that shipping log. And Hattie's turned up at the Haven." } }
            sonraki: "bl13_sanayi_sac_defter"
          - id: "gevset"
            etiket: { tr: "Bir kamyonun koçbaşı kaynağını gizlice gevşet", en: "Quietly weaken the weld on one truck's ram" }
            zar: { stat: "agi", zorluk: 230, tek: true, basarisiz: "bl13_sanayi_sac_yakalandi", basarisiz_etkiler: [{ itibar: { lonca: -3 } }, { bayrak: "bl13_sac_yakalandi" }] }
            etkiler:
              - ahlak: { duzen: -2 }
              - bayrak: "bl13_sac_gevsek"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Haddehanedeki kaynakçı seni unutmamış; Sığınak'a gelip seni soruyormuş.", en: "The welder from the rolling mill didn't forget you. She came to the Haven asking for you." } }
            sonraki: "bl13_sanayi_sac_gevset"
          - id: "kaynak"
            etiket: { tr: "\"Kaynağına devam et. Gördüğünü unut.\"", en: "\"Keep welding. Forget what you saw.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1, insanlik: -1 }
              - itibar: { lonca: 1 }
              - bayrak: "bl13_sac_sustu"
            sonraki: "bl13_sanayi_sac_kaynak"

      - id: "bl13_sanayi_sac_cikar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Hatice maskesini çıkarıp kamyonun basamağına bırakıyor. Avludaki kimse onu durdurmuyor; kaynak ışıkları çakıp sönmeye devam ediyor, sanki aralarından biri eksilmemiş gibi.", en: "Hattie pulls off her mask and leaves it on the truck's running board. Nobody in the yard stops her. The welding lights keep flaring and dying like none of them went missing." }
          - { tr: "Raylar boyunca yürürken bir kez dönüp arkasına bakıyor. \"Yirmi yıl gemi yaptım,\" diyor. \"Hiçbiri batmak için yapılmamıştı. Bunlar kırmak için yapılıyor. Fark bu.\"", en: "Walking out along the tracks, she looks back once. \"Twenty years I built ships,\" she says. \"Not one of them was built to sink. These are being built to break things. That's the difference.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Raylar boyunca yürümeye devam et", en: "Keep walking down the tracks" }
            sonraki: "@akis"

      - id: "bl13_sanayi_sac_defter"
        yer: "sanayi"
        paragraflar:
          - { tr: "Vardiya amiri halkanı görünce defteri tereddüt etmeden uzatıyor. Son sayfada on iki kamyon, on iki sürücü adı ve tek bir varış yeri yazılı: {yer:kiyikent_liman}, Konsey binası. Gün 292, şafaktan önce.", en: "The shift boss sees your ring and hands over the log without a second thought. On the last page: twelve trucks, twelve driver names, one destination. {yer:kiyikent_liman|b}, Council building. Day 292, before dawn." }
          - { tr: "Fırtınanın beklendiği gece, fırtınadan hemen önce. Kapı canavarına gidilen yol bu değil.", en: "Storm night, right before the storm. That's not the road you take to a Gate monster." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defteri kapatıp geri ver", en: "Close the log and hand it back" }
            sonraki: "@akis"

      - id: "bl13_sanayi_sac_gevset"
        yer: "sanayi"
        paragraflar:
          - { tr: "Hatice'nin maskesini ödünç alıp kamyonların arasına karışıyorsun. Sıradaki kamyonun koçbaşı kaynağının içine bir avuç kum serpip üstünü kapatıyorsun. Dışarıdan sağlam görünüyor; ilk darbede çatlayacak.", en: "You borrow Hattie's mask and blend in among the trucks. Into the weld on the next ram you sprinkle a handful of sand and seal it over. From the outside it looks solid. It'll crack on the first hit." }
          - { tr: "Hatice maskesini geri alırken gülümsemiyor ama başını bir kez sallıyor. \"Bir tanesi,\" diyor. \"On iki taneden bir tanesi. Az değil.\"", en: "Hattie doesn't smile when she takes her mask back, but she nods once. \"One,\" she says. \"One out of twelve. That's not nothing.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Avludan sessizce çık", en: "Slip out of the yard" }
            sonraki: "@akis"

      - id: "bl13_sanayi_sac_yakalandi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kumu kaynağa serperken arkanda bir el feneri yanıyor. Vardiya amiri ışığı yüzüne tutuyor, sonra kuma, sonra yeniden yüzüne. \"Bu kamyona bir daha yaklaşma,\" diyor. \"Adını yazdım.\"", en: "You're sprinkling the sand into the weld when a flashlight snaps on behind you. The shift boss holds the light on your face, then the sand, then your face again. \"Don't come near this truck again,\" he says. \"I've got your name.\"" }
          - { tr: "Kaynak baştan yapılıyor, bu kez iki kat kalın. Hatice uzaktan izliyor; maskesini indirmiş, yüzü görünmüyor.", en: "The weld gets redone, twice as thick this time. Hattie watches from a distance with her mask down. You can't see her face." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Avludan çık", en: "Leave the yard" }
            sonraki: "@akis"

      - id: "bl13_sanayi_sac_kaynak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Hatice maskesini yüzüne indiriyor. \"Peki,\" diyor maskenin ardından. \"Yirmi yıldır bunu duyuyorum zaten.\" Kaynak ışığı yeniden çakıyor.", en: "Hattie pulls her mask down over her face. \"Fine,\" she says from behind it. \"Been hearing that for twenty years anyway.\" The welding light flares again." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Avludan çık", en: "Leave the yard" }
            sonraki: "@akis"

  # ================================================================== BATIK TAKIMADA · ÇANLAR
  - id: "bl13_batik_canlar"
    konum: ["batik_takimada"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "batik_takimada", "kapi", "hasat"]
    gerilim: 2
    kart: { tr: "Ritmini şaşıran çanlar", en: "Bells Out of Time" }
    sahne: "bl13_batik_canlar_1"
    sahneler:
      - id: "bl13_batik_canlar_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{yer:batik_takimada|de} çanlar dalgayla çalar; her dalga vurduğunda bütün kuleler birden inler. Bu sabah öyle değil. Dalgalar gelip gidiyor ama çanlar başka bir şeye uymuş: dört vuruş, bir es.", en: "In {yer:batik_takimada} the bells ring with the waves. Every time one breaks, all the towers groan at once. Not this morning. The waves come and go, but the bells have locked onto something else. Four beats, a rest." }
          - { tr: "Sudan yarı batık bir kulenin kemerinde yaşlı bir Nehha kadın oturmuş, çanın tokmağını yosunla sarıyor. Elleri titriyor, yosun ha bire kayıyor. Seni görünce de durmuyor, konuşurken de sarmayı sürdürüyor.", en: "In the arch of a half-sunken tower, an old Nehha woman sits wrapping a bell clapper in seaweed. Her hands shake and the seaweed keeps slipping. She doesn't stop when she sees you. She keeps wrapping while she talks." }
          - { tr: "\"Toplanmadan önceki kış da böyle çalmışlardı,\" diyor. \"Ben küçüktüm, çoğunu annemden dinledim. Bütün bir mevsim dört vurup susmuşlar. Kapılar hep birlikte açılmaya başlamış. Sonra bir sabah çanların hepsi birden susmuş, deniz de yükselmiş.\" Adı Sela-Om'muş. İki yüz on iki yıldır bu kulede çan bekliyormuş.", en: "\"They rang like this the winter before the gathering too,\" she says. \"I was a little girl. Most of it I heard from my mother. A whole season, beating four and going quiet. The Gates started opening all together. Then one morning every bell went silent at once, and the sea came up.\" Her name is Sela-Om. She's been keeping the bell in this tower for two hundred and twelve years." }
          - metin: { tr: "Kulenin kemerinde kırmızı bir bezle bağlanmış deniz kabuğu kolye hâlâ asılı. Sela-Om onu görmeni istiyor gibi; gözü bir kolyeye bir sana gidip geliyor.", en: "The seashell necklace tied with a red rag is still hanging in the tower arch. Sela-Om seems to want you to see it. Her eyes keep going from the necklace to you." }
            kosul: { bayrak: "tilu_vuruldu" }
          - metin: { tr: "\"Tilu anlattı,\" diyor Sela-Om. \"Senin dünyanda da çanlar varmış. Taştan değil, demirden. Onlar da böyle çalıyor mu?\"", en: "\"Tilu told us,\" Sela-Om says. \"Your world has bells too. Not stone ones. Iron. Do they ring like this now?\"" }
            kosul: { bayrak: "tilu_eve_dondu" }
          - metin: { tr: "Uzaktaki Son Fener sönük; kulelerin çoğunun kemerinde artık kimse yok.", en: "Out in the distance the Last Lantern is dark, and most of the tower arches are empty now." }
            kosul: { bayrak: "batik_fener_dustu" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Çanlar buradaki bir şeye uymuyor. Çok uzaktan gelen bir davula cevap veriyorlar, bir geçidin öbür yanından. Senin şehrinden.", en: "The bells aren't keeping time with anything here. They're answering a drum from very far away, from the other side of a passage. From your city." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "iki yüz on iki yıl önce de böyle başlamış. sana söylemiyorum. ona söylüyorum, belki bu sefer biri duyar diye.", en: "it started like this two hundred and twelve years ago too. i'm not telling you. i'm telling her. maybe someone listens this time." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "{npc:deniz_arman} suyun altındaki okul bahçesine bakıyor, sonra kulaklarını kapatıyor. \"Bunu evde de duyuyorum. Uyurken.\"", en: "{npc:deniz_arman} looks down at the schoolyard under the water, then covers their ears. \"I hear this back home too. In my sleep.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Aynı aralık. Saniyesi saniyesine. İki dünya, tek metronom.\"", en: "\"Same interval. To the second. Two worlds, one metronome.\"" }
        secenekler:
          - id: "can"
            etiket: { tr: "\"Bir çanını ver. Benim dünyama götüreyim, onlar da duysun.\"", en: "\"Give me a bell. I'll take it home so they hear it too.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "bl13_can_alindi"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_can", gecikme: { min: 1, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Sela-Om'un verdiği el çanı Sığınak'a ulaştı.", en: "The hand bell Sela-Om gave you has made it to the Haven." } }
            sonraki: "bl13_batik_canlar_can"
          - id: "dinle"
            etiket: { tr: "Çanın altında dur; neye cevap verdiğini dinle", en: "Stand under the bell. Listen to what it's answering" }
            gerekli: { stat: { wis: 220 } }
            etkiler:
              - bayrak: "bl13_canlar_dinlendi"
              - iliski: { yanki: { saygi: 3 } }
              - xp_seviye: 12
              - tohum: { olay: "bl13_us_can", gecikme: { min: 1, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Sela-Om çanlarından birini peşinden yollamış; Sığınak'a ulaşmış.", en: "Sela-Om sent one of her bells after you. It's reached the Haven." } }
            sonraki: "bl13_batik_canlar_dinle"
          - id: "cocuklar"
            etiket: { tr: "Dünya'daki otuz yedi çocuğun haberini ver", en: "Tell her about the thirty-seven children on Earth" }
            goster: { bayrak: "batik_cocuklar_dunyada" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl13_canlar_cocuklar"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_can", gecikme: { min: 1, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Sela-Om çocuklar için bir çan göndermiş; Sığınak'a ulaşmış.", en: "Sela-Om sent a bell for the children. It's reached the Haven." } }
            sonraki: "bl13_batik_canlar_cocuklar"
          - id: "sar"
            etiket: { tr: "Yosunu al; tokmağı onun yerine sen sar", en: "Take the seaweed. Wrap the clapper for her" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tehlike: { batik_takimada: -2 }
              - bayrak: "bl13_canlar_susturuldu"
              - xp_seviye: 8
            sonraki: "bl13_batik_canlar_sar"

      - id: "bl13_batik_canlar_can"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sela-Om bir süre seni süzüyor, sonra kemerin içindeki bir oyuktan avuç büyüklüğünde, yeşile çalmış bir el çanı çıkarıyor. \"Toplanmadan önce çalan ilk çan bu,\" diyor. \"Annem onu bu oyuğa susturmak için koymuş. Susmadı.\"", en: "Sela-Om studies you for a while, then reaches into a hollow in the arch and pulls out a hand bell, palm-sized, gone green. \"This is the first bell that rang before the gathering,\" she says. \"My mother put it in this hollow to shut it up. It didn't.\"" }
          - { tr: "Çanı avucuna bırakıyor. Çan dördüncü vuruşta titreyip susuyor. \"Senin dünyan bizimkinden genç,\" diyor. \"Genç dünyalar uyarı dinlemez. Belki seninki dinler.\"", en: "She sets it in your palm. It trembles on the fourth beat and goes still. \"Your world is younger than ours,\" she says. \"Young worlds don't listen to warnings. Maybe yours will.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çanı ıslak bir beze sar", en: "Wrap the bell in a wet cloth" }
            sonraki: "@akis"

      - id: "bl13_batik_canlar_dinle"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Çanın altında, suyun dizine vurduğu yerde gözlerini kapatıyorsun. Önce dalgaları duyuyorsun, sonra dalgaların altında başka bir şeyi: geçidin öbür yanından, Kule'nin içinden süzülüp gelen bir davulu. {yer:kiyikent|in} davulunu.", en: "Under the bell, with the water at your knees, you close your eyes. First you hear the waves, then something under the waves: a drum filtering in from the other side of the passage, down through the Spire. {yer:kiyikent|pos} drum." }
          - { tr: "Gözlerini açtığında Sela-Om sana bakıyor. \"Seninki de çalıyor,\" diyor. \"Biliyorum, yüzünden anladım. Hiç değilse bir çanımı al da götür. Biri sizi uyarsın; bizi kimse uyarmamıştı.\"", en: "When you open your eyes, Sela-Om is watching you. \"Yours is ringing too,\" she says. \"I can see it on your face. At least take one of my bells back with you. Let somebody warn you. Nobody warned us.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Uzattığı el çanını al", en: "Take the hand bell she's holding out" }
            sonraki: "@akis"

      - id: "bl13_batik_canlar_cocuklar"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Sela-Om'un elleri bir anlığına duruyor. \"Otuz yedi,\" diyor. \"Son Fener'in çocukları. Senin dünyanda.\" Yosunu bırakıp ilk kez sana tam karşıdan bakıyor.", en: "Sela-Om's hands stop for a moment. \"Thirty-seven,\" she says. \"The Last Lantern's children. In your world.\" She lets go of the seaweed and looks you full in the face for the first time." }
          - { tr: "Kemerin oyuğundan küçük, yeşile çalmış bir el çanı çıkarıp sana uzatıyor. \"Onlara götür,\" diyor. \"Fırtına gecesi çanın sesini tanırlar. Hangi kapıdan kaçacaklarını bilirler.\"", en: "She pulls a small, green-tinged hand bell out of a hollow in the arch and holds it out. \"Take this to them,\" she says. \"On storm night they'll know its voice. They'll know which door to run from.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çanı göğsüne bastır", en: "Hold the bell against your chest" }
            sonraki: "@akis"

      - id: "bl13_batik_canlar_sar"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yosunu alıp tokmağı sıkı sıkı sarıyorsun. Çan susuyor. Bir sonraki kulede de, ondan sonrakinde de aynısını yapıyorsun; öğlene kadar yakındaki yedi kule susmuş oluyor.", en: "You take the seaweed and wrap the clapper tight. The bell goes quiet. You do the same in the next tower, and the one after that. By noon the seven nearest towers are silent." }
          - { tr: "Sela-Om başını sallıyor ama gözü uzaktaki kulelerde. Orada çanlar hâlâ dört vurup susuyor. \"Susturmak bir şeydir,\" diyor. \"Durdurmak başka.\"", en: "Sela-Om nods, but her eyes are on the far towers, where the bells are still beating four and going quiet. \"Silencing is one thing,\" she says. \"Stopping is another.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Uzaktaki kulelere bak", en: "Look out at the far towers" }
            sonraki: "@akis"

  # ================================================================== YEDİ TAHT · BAHİS GALERİSİ
  - id: "bl13_taht_bahis"
    konum: ["yedi_taht"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13, bayrak: "yedi_taht_davet" }
    agirlik: 5
    etiketler: ["kesif", "yedi_taht", "kadimler", "kapi"]
    gerilim: 3
    kart: { tr: "Bahis galerisi", en: "The Wagering Gallery" }
    sahne: "bl13_taht_bahis_1"
    sahneler:
      - id: "bl13_taht_bahis_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Sarayın kuzey kanadındaki uzun galeride havada bir harita asılı duruyor, kül renginde ışıktan örülmüş. Haritada bir körfez var, bir kule, yedi mahalle. Senin şehrin.", en: "In the long gallery of the palace's north wing, a map hangs in the air, woven out of ash-colored light. On it there's a bay, a tower, seven neighborhoods. Your city." }
          - { tr: "Haritanın çevresinde uzun boylu Kadimler toplanmış. Parmak uçlarından küçük yıldızlar koparıp mahallelerin üstüne bırakıyorlar; yıldızlar orada asılı kalıp sayıya dönüşüyor. Her mahallenin yanında iki sütun var: DÜŞER, DAYANIR. DÜŞER sütunu çoğunda daha kalabalık.", en: "Tall Ancients are gathered around the map. They pinch little stars off their fingertips and drop them over the neighborhoods, where the stars hang and turn into numbers. Beside every neighborhood are two columns: FALLS and STANDS. In most of them, FALLS is the longer column." }
          - { tr: "Haritanın altında ayrı bir sütun daha var; başında senin adın, altında tek bir soru: KAÇINI KURTARIR? Yıldızların çoğu iki ile üç arasında birikmiş.", en: "Under the map there's one more column on its own. Your name at the top, and under it a single question: HOW MANY WILL IT SAVE? Most of the stars have piled up between two and three." }
          - { tr: "Kadimlerden biri, derisinin altında dar bir takımyıldız dönen bir kâtip, sana dönüp eğiliyor. \"Konuk,\" diyor sesi bir terazi gibi dengeli, \"kendi üzerine oynamak ister mi?\"", en: "One of them, a clerk with a narrow constellation turning under its skin, turns and bows. \"Guest,\" it says, its voice as even as a scale, \"would you care to bet on yourself?\"" }
          - metin: { tr: "Kâtip sesini alçaltıyor: \"İkinci talibin bahsi özel bir defterde tutulur. Kazanırsan şehrin hasadından payın büyür.\"", en: "The clerk lowers its voice. \"The second claimant's wagers are kept in a private ledger. If you win, your share of the city's harvest grows.\"" }
            kosul: { bayrak: "taht_talip" }
          - metin: { tr: "Salonda eğilmeyen konuğu tanıyan birkaç Kadim, bahislerini senin sütunundan çekip DÜŞER sütunlarına aktarıyor.", en: "A few Ancients who remember the guest who wouldn't bow pull their stars out of your column and move them over to FALLS." }
            kosul: { bayrak: "taht_egilmedi" }
        sezgiler:
          - kosul: { stat: { int: 220 } }
            metin: { tr: "Haritadaki yedi noktadan biri ötekilerden parlak: {yer:sanayi|in} ortasında. Bahislerin çoğu oraya bağlı; o nokta düşerse ötekiler de düşer diye hesaplamışlar.", en: "One of the seven points on the map is brighter than the rest, in the middle of {yer:sanayi}. Most of the wagers hang on it. They've figured that if it falls, the rest fall with it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni görmesinler. sen de bana bakma. bir yıldız fazla ya da eksik, onlar için ikisi de eğlence.", en: "don't let them see me. don't look at me either. one star more or one star less, to them both are entertainment." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İki ile üç arası mı?\" {npc:aras_kurt} dişlerinin arasından gülüyor. \"Ben bir yıldız atayım. Yedinin üstüne.\"", en: "\"Two to three?\" {npc:aras_kurt} laughs through his teeth. \"Let me throw a star. On seven.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Mahallemiz şurada. Dokuz yıldız DÜŞER'de. Dokuz.\"", en: "\"Our neighborhood's right there. Nine stars on FALLS. Nine.\"" }
        secenekler:
          - id: "bahis"
            tur: "gosteris"
            etiket: { tr: "\"Yedi. Yedisini de kurtaracağım.\"", en: "\"Seven. I'll save all seven.\"" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -1 }
              - bayrak: "bl13_bahis_yedi"
              - iliski: { yanki: { korku: 2, saygi: 2 } }
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_kurye", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "{yer:yedi_taht|de}ki bahsin kayda geçmiş; bir kurye yolda.", en: "Your bet in {yer:yedi_taht} has been entered in the ledger. A courier's on the way." } }
            sonraki: "bl13_taht_bahis_yedi"
          - id: "oku"
            etiket: { tr: "Haritayı oku; neden iki ile üç dediklerini anla", en: "Study the map. Figure out why they're saying two to three" }
            gerekli: { stat: { int: 220 } }
            etkiler:
              - bayrak: "bl13_bahis_okundu"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 12
              - tohum: { olay: "bl13_us_kurye", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Galerideki haritayı fazla uzun okudun; {yer:yedi_taht} bunu fark etmiş, bir kurye yolda.", en: "You studied the gallery map a little too long. {yer:yedi_taht|b} noticed. A courier's on the way." } }
            sonraki: "bl13_taht_bahis_oku"
          - id: "devir"
            tur: "gosteris"
            etiket: { tr: "Haritayı ikiye yar; yıldızlar yere saçılsın", en: "Tear the map in two. Let the stars scatter" }
            gerekli: { stat: { wil: 260 } }
            etkiler:
              - dikkat: 5
              - ahlak: { insanlik: 2, duzen: -2 }
              - itibar: { kadimler: -4 }
              - bayrak: "bl13_bahis_yirtildi"
              - iliski: { thessar: { korku: 3, guven: -2 } }
              - xp_seviye: 14
              - tohum: { olay: "bl13_us_kurye", gecikme: { min: 2, max: 3 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Galerideki haritanın hesabı sorulacak; {yer:yedi_taht|den} bir kurye yolda.", en: "{yer:yedi_taht|b} means to collect for that map. A courier's on the way." } }
            sonraki: "bl13_taht_bahis_devir"
          - id: "ret"
            etiket: { tr: "\"Bir şehir bahis tahtası değildir.\" Galeriden çık", en: "\"A city isn't a betting board.\" Walk out of the gallery" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { saygi: 1 } }
              - bayrak: "bl13_bahis_ret"
            sonraki: "bl13_taht_bahis_ret"

      - id: "bl13_taht_bahis_yedi"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Kâtip başını eğip parmağının ucundan tek bir yıldız koparıyor, senin sütununun en tepesine, yedinin üstüne bırakıyor. Galeride bir uğultu dolaşıyor; Kadimler gülmez ama bu ona yakın bir şey.", en: "The clerk bows its head, pinches a single star from its fingertip and drops it at the very top of your column, on seven. A murmur goes around the gallery. Ancients don't laugh, but this is close." }
          - { tr: "\"Kayda geçti,\" diyor kâtip. \"Bedeli fırtınadan sonra konuşulur. Kazanırsan bir şey isteyebilirsin. Kaybedersen biz isteriz.\"", en: "\"Entered,\" the clerk says. \"The stakes are discussed after the storm. If you win, you may ask for something. If you lose, we ask.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Hazırlan o zaman.\"", en: "\"Better get ready, then.\"" }
            sonraki: "@akis"

      - id: "bl13_taht_bahis_oku"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Yedi noktanın altında daha soluk çizgiler var: her noktadan ötekine uzanan ince ışık telleri, hepsi {yer:sanayi|in} ortasındaki parlak noktada düğümleniyor. Kadimler mahallelere değil, bu düğüme oynuyor.", en: "Under the seven points there are fainter lines: thin threads of light running from each point to the others, all knotted together at the bright point in {yer:sanayi}. The Ancients aren't betting on the neighborhoods. They're betting on the knot." }
          - { tr: "İki ile üç arası, çünkü önce düğüme koşacağını varsayıyorlar. Düğüme koşarsan altı mahalle sensiz kalır; düğüme koşmazsan yedisi birden düşer. Bahis sana değil, senin hesabına oynanıyor.", en: "Two to three, because they assume you'll run for the knot first. Run for the knot and six neighborhoods are on their own. Don't run for it and all seven go down at once. They aren't betting on you. They're betting on your math." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Haritadan gözünü ayır", en: "Tear your eyes away from the map" }
            sonraki: "@akis"

      - id: "bl13_taht_bahis_devir"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Elini kül rengi ışığın ortasına daldırıp iki yana açıyorsun. Harita bir perde gibi yırtılıyor; yıldızlar cam bir yağmur gibi galerinin zeminine, hasat edilmiş dünyaların pencerelerinin üstüne dökülüyor.", en: "You plunge your hands into the middle of the ash-colored light and pull them apart. The map tears like a curtain, and the stars pour down like glass rain onto the gallery floor, onto the windows of harvested worlds." }
          - { tr: "Hiçbir Kadim kıpırdamıyor. Kâtip yalnızca başını yana eğiyor, bir ölçü aletinin ibresi gibi. \"Konuk bahsi bozdu,\" diyor. \"Bozulan bahis de bir bahistir. Kayda geçti.\"", en: "Not one Ancient moves. The clerk just tilts its head, like the needle on a gauge. \"The guest has spoiled the wager,\" it says. \"A spoiled wager is still a wager. Entered.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yıldızların üstünden yürüyüp çık", en: "Walk out over the stars" }
            sonraki: "@akis"

      - id: "bl13_taht_bahis_ret"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Kâtip seni kapıya kadar gözleriyle uğurluyor. Arkandan ne bir ses geliyor ne bir itiraz. Galeriden çıkarken son bir kez dönüp bakıyorsun: senin sütununa yeni bir yıldız eklenmiş, ikinin üstüne.", en: "The clerk's eyes follow you all the way to the door. No sound comes after you, no objection. On your way out you look back one last time. A new star has been added to your column. On two." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Koridora çık", en: "Step out into the hallway" }
            sonraki: "@akis"

  # ================================================================== KORDON · ŞAMANDIRA HATTI
  - id: "bl13_kordon_samandira"
    konum: ["kordon"]
    perde: [3]
    gun: { min: 262, max: 285 }
    kosul: { bolum: 13 }
    agirlik: 5
    etiketler: ["kesif", "kordon", "kapi", "toplum"]
    gerilim: 2
    kart: { tr: "Şamandıra hattı", en: "The Buoy Line" }
    sahne: "bl13_kordon_samandira_1"
    sahneler:
      - id: "bl13_kordon_samandira_1"
        yer: "kordon"
        paragraflar:
          - { tr: "{yer:kordon|in} kırık iskelesinde dört yaşlı balıkçı eski seyir şamandıralarının tepesine teneke çanlar bağlıyor. Şamandıralar körfezin ağzına doğru sıra sıra dizilmiş, aralarına bakır tel gerilmiş.", en: "On the broken pier at {yer:kordon}, four old fishermen are tying tin bells to the tops of old navigation buoys. The buoys run in a line out toward the mouth of the bay, with copper wire strung between them." }
          - { tr: "\"Kapı açılmadan önce su ters döner,\" diyor içlerinden en yaşlısı, ağzındaki sönük sigarayı çıkarmadan. \"Ters dönen su teli çeker, tel de çanı çalar. Fırtına gecesi telsizden önce biz duyarız.\" Ona Hüsnü Reis diyorlar.", en: "\"Before a Gate opens, the water turns backward,\" says the oldest, without taking the dead cigarette out of his mouth. \"Backward water pulls the wire, the wire rings the bell. Storm night, we'll hear it before any radio does.\" They call him Cap'n Hank." }
          - { tr: "Hat neredeyse bitmiş. Eksik tek bir şamandıra var: en sondaki, eski dalgakıranın ucuna bağlanacak olan. Dalgakıranın taşlarında köpük birikip duruyor; balıkçılar oraya bakmamaya çalışıyor.", en: "The line's almost done. One buoy's missing: the last one, which has to be tied off at the end of the old breakwater. Foam keeps piling up on the breakwater stones, and the fishermen are trying not to look at it." }
          - metin: { tr: "Hepsi {yer:kordon|in} düştüğü gece kaçabilenlerden. Evlerine dönmemişler, ama iskeleye dönmüşler.", en: "All of them got out the night {yer:kordon} fell. They never went back to their homes, but they came back to the pier." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Arkalarında fenerler yanıyor. {yer:kordon|in} geri alındığından beri balıkçılar geceleri de iskelede.", en: "Behind them the lanterns are lit. Ever since {yer:kordon} was taken back, the fishermen have been out on the pier at night too." }
            kosul: { bayrak: "p3_kordon_geri_alindi" }
          - metin: { tr: "\"Bakırın yarısını Lonca topladı,\" diyor Hüsnü Reis. \"Zırh yapacaklarmış. Biz de kalanıyla idare ediyoruz.\"", en: "\"The Guild hauled off half our copper,\" Cap'n Hank says. \"For armor, they said. We're making do with the rest.\"" }
            kosul: { bayrak_yok: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Dalgakıranın ucundaki köpük dalgayla gelip gitmiyor. Orada duruyor, bir şey kıvrılıp oturmuş gibi.", en: "The foam at the end of the breakwater isn't coming and going with the waves. It's just sitting there, like something curled up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "teneke çanlar. iki dünya önce taş çanlar da aynı işi görmüştü. bu sefer belki biri dinler.", en: "tin bells. two worlds ago, stone bells did the same job. maybe this time someone listens." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Babam da böyle çan bağlardı ağlarına. Balık girince çalsın diye. Hiç çalmazdı.\"", en: "\"My dad used to tie bells on his nets like this. So they'd ring when a fish got in. They never rang.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çan çalarsa sedyeler hangi yoldan gelecek? Sahil yolu yarıda kesik.\"", en: "\"If the bells ring, which way do the stretchers come in? The shore road's cut in half.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Son şamandırayı dalgakıranın ucuna kendin bağla", en: "Tie off the last buoy at the end of the breakwater yourself" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kopuk_ruhu@dunya"], ortam: ["su"], kazan: "bl13_kordon_samandira_zafer", kaybet: "bl13_kordon_samandira_yenilgi", kac: "bl13_kordon_samandira_kacis" }
          - id: "ag"
            etiket: { tr: "Hattın ucunu iskeledeki eski sis düdüğüne bağla", en: "Rig the line to the pier's old foghorn" }
            gerekli: { stat: { int: 200 } }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { saygi: 2 } }
              - tehlike: { kordon: -3 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_samandira_duduk"
              - xp_seviye: 10
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Hüsnü Reis'in balıkçıları Sığınak'a gelmiş; düdüğü duyuramadıkları yerler için adam istiyorlar.", en: "Cap'n Hank's fishermen have come to the Haven. They need people for the places the foghorn doesn't reach." } }
            sonraki: "bl13_kordon_samandira_ag"
          - id: "bakir"
            etiket: { tr: "Lonca deposundan bakır tel çıkart", en: "Pull copper wire out of the Guild depot" }
            goster: { herhangi: [{ bayrak: "uye_lonca" }, { itibar_min: { lonca: 40 } }] }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -1 }
              - iliski: { kaya_demir: { saygi: -1 } }
              - tehlike: { kordon: -2 }
              - bayrak: "bl13_samandira_bakir"
              - xp_seviye: 9
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Bakır telin hesabını soran yok henüz; Hüsnü Reis ise Sığınak'a gelip seni sormuş.", en: "Nobody's asked about the copper wire yet. Cap'n Hank, though, came to the Haven asking for you." } }
            sonraki: "bl13_kordon_samandira_bakir"
          - id: "durust"
            etiket: { tr: "\"Kapı suyun altında açılırsa çanınız çalmaz.\"", en: "\"If the Gate opens underwater, your bells won't ring.\"" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: -1 }
              - tehlike: { kordon: 3 }
              - bayrak: "bl13_samandira_birakildi"
            sonraki: "bl13_kordon_samandira_durust"

      - id: "bl13_kordon_samandira_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Köpük ruhu son bir dalga sesi çıkararak taşların arasına dağılıyor. Şamandırayı dalgakıranın ucuna bağlayıp teli gerdiğinde körfezin ağzından iskeleye kadar bütün çanlar bir kez, hep birlikte çalıyor.", en: "The Spindrift breaks apart between the stones with one last sound like surf. When you tie the buoy off at the end of the breakwater and pull the wire tight, every bell from the mouth of the bay to the pier rings once, all together." }
          - { tr: "İskelede Hüsnü Reis sigarasını ilk kez ağzından çıkarıyor. \"Duydun mu?\" diyor balıkçılara. \"Hat çalışıyor.\"", en: "Out on the pier, Cap'n Hank takes the cigarette out of his mouth for the first time. \"You hear that?\" he says to the others. \"Line works.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Fırtına gecesi telsizi açık tutun. Ben de dinlerim.\"", en: "\"Keep a radio on storm night. I'll be listening too.\"" }
            etkiler:
              - tehlike: { kordon: -5 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_samandira_tamam"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 14
              - tohum: { olay: "bl13_us_kapidakiler", gecikme: { min: 2, max: 4 }, kosul: { bolum: 13, gun_max: 291 }, hatirlatma: { tr: "Hüsnü Reis'in balıkçıları Sığınak'a gelmiş; seni soruyorlar.", en: "Cap'n Hank's fishermen have turned up at the Haven, asking for you." } }
            sonraki: "@akis"

      - id: "bl13_kordon_samandira_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Köpük ruhu seni dalgakıranın taşlarından denize çekiyor. Tuzlu su ağzına, burnuna doluyor; bir an hangi yönün yukarı olduğunu bilemiyorsun.", en: "The Spindrift drags you off the breakwater stones into the sea. Salt water fills your mouth and nose, and for a second you can't tell which way is up." }
          - { tr: "Hüsnü Reis'in kancası yakana takılıyor. Seni iskeleye çektiklerinde son şamandıra hâlâ dalgakıranın dibinde yüzüyor; çanı tek başına, ritimsiz çalıyor.", en: "Cap'n Hank's boat hook catches your collar. By the time they haul you onto the pier, the last buoy is still bobbing at the foot of the breakwater, its bell ringing alone, out of rhythm." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Tuzu tükür; yeniden dalgakırana çık", en: "Spit out the salt. Head back out on the breakwater" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["kopuk_ruhu@dunya"], ortam: ["su"], kazan: "bl13_kordon_samandira_zafer", kaybet: "bl13_kordon_samandira_kacis", kac: "bl13_kordon_samandira_kacis" }
          - id: "birak"
            etiket: { tr: "Bugünlük bırak; balıkçılara teşekkür et", en: "Let it go for today. Thank the fishermen" }
            etkiler:
              - can: 20
            sonraki: "@akis"

      - id: "bl13_kordon_samandira_kacis"
        yer: "kordon"
        paragraflar:
          - { tr: "Dalgakırandan geri çekiliyorsun. Köpük ruhu peşine düşmüyor; ucundaki taşlara yeniden kıvrılıp oturuyor. Hat bir şamandıra eksik kalıyor.", en: "You fall back off the breakwater. The Spindrift doesn't follow. It just curls back up on the stones at the end. The line stays one buoy short." }
          - { tr: "\"Eksik hat da hattır,\" diyor Hüsnü Reis, sesi hiç inandırıcı değil.", en: "\"A line that's one short is still a line,\" Cap'n Hank says. He doesn't sound like he believes it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İskeleden ayrıl", en: "Leave the pier" }
            etkiler:
              - tehlike: { kordon: 2 }
            sonraki: "@akis"

      - id: "bl13_kordon_samandira_ag"
        yer: "kordon"
        paragraflar:
          - { tr: "Hattın son telini iskelenin ucundaki paslı sis düdüğünün koluna, araya da eski bir araba aküsü bağlıyorsun. Bir çan çalınca tel gerilip kolu çekiyor; düdük boğuk boğuk ötüyor.", en: "You run the last wire of the line to the lever on the rusty foghorn at the end of the pier, with an old car battery in between. When a bell rings, the wire pulls tight and yanks the lever, and the horn lets out a hoarse blast." }
          - { tr: "Hüsnü Reis düdüğü dinleyip başını sallıyor. \"Çanı kulak duyar, düdüğü bütün körfez,\" diyor. \"Ama çanlar yerinde kalsın. Teneke de olsa bizim.\"", en: "Cap'n Hank listens to the horn and nods. \"An ear hears a bell. The whole bay hears that horn,\" he says. \"But leave the bells where they are. Tin or not, they're ours.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çanlara dokunma", en: "Leave the bells alone" }
            sonraki: "@akis"

      - id: "bl13_kordon_samandira_bakir"
        yer: "kordon"
        paragraflar:
          - { tr: "Akşama kadar iki makara bakır tel iskeleye varıyor. Balıkçılar teli sökük şamandıraların arasına gererken Hüsnü Reis makaraların üstündeki Lonca mührüne uzun uzun bakıyor.", en: "By evening two spools of copper wire have made it to the pier. While the fishermen string it between the gaps in the line, Cap'n Hank stares a long time at the Guild seal on the spools." }
          - { tr: "\"Zırh olacaktı bunlar,\" diyor. \"Şimdi kulak oldu. Hangisi daha çok can kurtarır, fırtınadan sonra konuşuruz.\"", en: "\"This was gonna be armor,\" he says. \"Now it's ears. We'll talk about which one saves more lives after the storm.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Makaraları açmalarına yardım et", en: "Help them unspool the wire" }
            sonraki: "@akis"

      - id: "bl13_kordon_samandira_durust"
        yer: "kordon"
        paragraflar:
          - { tr: "Balıkçılar bir süre birbirine bakıyor. Hüsnü Reis sönük sigarayı ağzından alıp denize fırlatıyor.", en: "The fishermen look at each other for a while. Cap'n Hank takes the dead cigarette out of his mouth and flicks it into the sea." }
          - { tr: "\"Belki çalmaz,\" diyor. \"Ama altmış yıl bu denizde balık tuttum. Ters dönen suyu çandan önce ben duyarım. Çan benim için değil, uyuyanlar için.\" Son şamandırayı omzuna alıp dalgakırana doğru yürümeye başlıyor.", en: "\"Maybe they won't,\" he says. \"But I've fished this water sixty years. I'll hear backward water before any bell does. The bells aren't for me. They're for the ones asleep.\" He hoists the last buoy onto his shoulder and starts walking toward the breakwater." }
        secenekler:
          - id: "dur"
            etiket: { tr: "Onu durdur", en: "Stop him" }
            sonraki: "@akis"
          - id: "izle"
            etiket: { tr: "Gitmesine izin ver", en: "Let him go" }
            etkiler:
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

  # ================================================================== ÜS · KAPIDAKİLER (tohum: bl13_kd_catilar, bl13_sanayi_sac, bl13_kordon_samandira)
  - id: "bl13_us_kapidakiler"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["us", "kapi", "toplum"]
    gerilim: 2
    kart: { tr: "Kapıda seni soranlar", en: "Asking for You at the Gate" }
    sahne: "bl13_us_kapidakiler_1"
    sahneler:
      - id: "bl13_us_kapidakiler_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşamüstü Sığınak'ın kapı nöbetçisi seni çağırtıyor. Bariyerin önünde birkaç kişi bekliyor; hiçbiri kayıt sırasına girmemiş, hepsi aynı şeyi söylemiş: \"Onu soruyoruz.\"", en: "Late in the afternoon, the Haven gate guard sends for you. A few people are waiting outside the barrier. None of them got in the intake line. Every one of them said the same thing: \"We're here for that one.\"" }
          - metin: { tr: "Fare bariyerin üstüne tünemiş, yanında dört çocuk. Ellerinde katlanmış bir karton var; açınca {yer:kule_dibi|den} dört mahalleye uzanan çatı rotalarını görüyorsun.", en: "Mouse is perched on top of the barrier with four kids next to her. They've got a folded piece of cardboard, and when you open it you see the rooftop routes from {yer:kule_dibi} out to four neighborhoods." }
            kosul: { bayrak: "bl13_kediler_haberci" }
          - metin: { tr: "BOŞ yazılarının hepsinin üstü çizilmiş. \"Haberci istemiştin,\" diyor Fare. \"Telsiz de lazım; bağırarak olmaz.\"", en: "Every EMPTY is crossed out. \"You wanted runners,\" Mouse says. \"We need radios, though. Yelling won't cut it.\"" }
            kosul: { bayrak: "bl13_kediler_haberci" }
          - metin: { tr: "Fare iki çocukla birlikte bariyerin dibinde oturuyor, kollarını kavuşturmuş. Çocuklardan birinin kaşı dikişli.", en: "Mouse is sitting at the foot of the barrier with two of the kids, arms crossed. One of the kids has stitches in his eyebrow." }
            kosul: { bayrak: "bl13_kediler_uyarildi" }
          - metin: { tr: "\"Çatıda uyardığın şey,\" diyor gözünü kaçırarak. \"Kapı yukarıda da açılır demiştin. Dün gece açıldı; biz de oradaydık.\"", en: "\"What you warned us about on the roof,\" she says, not meeting your eyes. \"You said Gates open up high too. One did last night. We were up there.\"" }
            kosul: { bayrak: "bl13_kediler_uyarildi" }
          - metin: { tr: "Nöbetçi kulübesinin ardındaki nezarethanenin parmaklıklarından Fare'nin yüzü görünüyor. Seni görünce parmaklıkları kavrıyor. \"Fırtına gecesi de burada mı tutacaksınız bizi?\" diye bağırıyor. \"Bu kafes kapı tanır mı?\"", en: "Through the bars of the lockup behind the guard booth, you can see Mouse's face. When she sees you, she grabs the bars. \"You gonna keep us in here on storm night too?\" she yells. \"You think this cage knows what a Gate is?\"" }
            kosul: { bayrak: "bl13_kediler_ihbar" }
          - metin: { tr: "Hatice bariyere yaslanmış, kaynak maskesini kolunun altına sıkıştırmış. \"Doktor hanım beni dinledi,\" diyor. \"Not aldı. Ama not almak kamyon durdurmaz. Bana iş ver. Elim boş kalınca aklım o mazgallara gidiyor.\"", en: "Hattie is leaning on the barrier with her welding mask tucked under her arm. \"The doctor heard me out,\" she says. \"Took notes. But notes don't stop trucks. Give me something to do. When my hands are empty, my mind goes back to those gun ports.\"" }
            kosul: { herhangi: [{ bayrak: "bl13_kaynakci_kacti" }, { bayrak: "bl13_sac_defter" }, { bayrak: "bl13_sac_gevsek" }, { bayrak: "bl13_sac_yakalandi" }] }
          - metin: { tr: "Hüsnü Reis iki balıkçıyla gelmiş, sırtlarında birer teneke çan. \"Şamandıralar çalıyor,\" diyor. \"Ama {yer:kordon|den} buraya ses gelmez. Biri koşacak, biri bağıracak. Bize bir telsiz, bir de koşacak genç lazım.\"", en: "Cap'n Hank has come with two of his fishermen, each with a tin bell slung over his back. \"The buoys are ringing,\" he says. \"But you can't hear them from {yer:kordon} to here. Somebody's got to run, somebody's got to holler. We need a radio, and a young pair of legs.\"" }
            kosul: { herhangi: [{ bayrak: "bl13_samandira_tamam" }, { bayrak: "bl13_samandira_duduk" }, { bayrak: "bl13_samandira_bakir" }] }
          - { tr: "Nöbetçi omuz silkiyor. \"Kayıtlara giremezler, yer yok. Ama sen dersen yer açılır.\"", en: "The guard shrugs. \"They can't go on the rolls, we're out of room. But you say the word and we'll find some.\"" }
        sezgiler:
          - kosul: { stat: { int: 200 } }
            metin: { tr: "Kedilerin çatı rotaları, balıkçıların çanları, kaynakçının bildikleri: üçü yan yana gelince fırtına gecesi şehrin yarısında telsizden önce haber dolaşabilir.", en: "The cats' rooftop routes, the fishermen's bells, what the welder knows. Put the three side by side and on storm night word could cross half the city faster than any radio." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni sordular. bir yıl önce kimse seni sormazdı. bunu bir yere yaz.", en: "they asked for you. a year ago nobody asked for you. write that down somewhere." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çocukların telsizi benden. Bir şartla: her biri bileklik takacak.\"", en: "\"The kids' radios are on me. One condition: every one of them wears a wristband.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Dokuz kanalım boşta. Sana yedisini verebilirim. Sekizinci benim, dokuzuncuyu sorma.\"", en: "\"I've got nine open channels. I can give you seven. Eight's mine. Don't ask about nine.\"" }
        secenekler:
          - id: "ag"
            etiket: { tr: "Hepsini Ağ'ın telsiz ağına bağla", en: "Patch all of them into the Network's radio grid" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - itibar: { sessiz_ag: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_kapidakiler_agda"
              - xp_seviye: 10
            sonraki: "bl13_us_kapidakiler_ag"
          - id: "sancak"
            etiket: { tr: "\"Benim sancağımın altına yazılın.\"", en: "\"Sign on under my banner.\"" }
            etkiler:
              - ordu_kazan: 3
              - dikkat: 2
              - iliski: { yanki: { saygi: 2 } }
              - bayrak: "bl13_kapidakiler_sancak"
              - xp_seviye: 10
            sonraki: "bl13_us_kapidakiler_sancak"
          - id: "serbest"
            etiket: { tr: "Kedileri nezarethaneden çıkar; kefilleri sen ol", en: "Get the cats out of the lockup. Vouch for them yourself" }
            goster: { bayrak: "bl13_kediler_ihbar" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: -1 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl13_kediler_serbest"
              - xp_seviye: 9
            sonraki: "bl13_us_kapidakiler_serbest"
          - id: "hatice"
            etiket: { tr: "Hatice'yi {npc:elif_sari|in} sedye ekiplerine ver", en: "Put Hattie on {npc:elif_sari|pos} stretcher crews" }
            goster: { herhangi: [{ bayrak: "bl13_kaynakci_kacti" }, { bayrak: "bl13_sac_defter" }, { bayrak: "bl13_sac_gevsek" }, { bayrak: "bl13_sac_yakalandi" }] }
            etkiler:
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - ahlak: { merhamet: 2 }
              - bayrak: "bl13_hatice_sedyede"
              - xp_seviye: 9
            sonraki: "bl13_us_kapidakiler_hatice"
          - id: "gonder"
            etiket: { tr: "\"Fırtına gecesi evlerinizde kalın. Bu iş sizin değil.\"", en: "\"On storm night, stay home. This isn't your job.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { yanki: { guven: -1 } }
              - bayrak: "bl13_kapidakiler_gonderildi"
            sonraki: "bl13_us_kapidakiler_gonder"

      - id: "bl13_us_kapidakiler_ag"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ağ'ın iki operatörü gelenleri bir masanın çevresine oturtup her birine bir kanal numarası veriyor. Çatı rotaları, çan sesleri, kaynakçının hatırladığı sokaklar aynı kâğıda işleniyor.", en: "Two Network operators sit everybody down around a table and give each of them a channel number. The rooftop routes, the bells, the streets the welder remembers, all of it goes onto the same sheet of paper." }
          - { tr: "Gece yarısı sınama yapılıyor: {yer:kordon|de} bir çan çalıyor, cızırtı telsize düşüyor, bir çocuk çatıdan çatıya koşup {yer:kule_dibi|e} haber yetiştiriyor. Yedi dakika. Nöbetçi saatine bakıp ıslık çalıyor.", en: "Around midnight they run a drill. A bell rings on {yer:kordon}, the crackle hits the radio, a kid runs roof to roof and gets word to {yer:kule_dibi}. Seven minutes. The guard checks his watch and whistles." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bir daha. Altı dakikaya indirin.\"", en: "\"Again. Get it down to six.\"" }
            sonraki: "@akis"

      - id: "bl13_us_kapidakiler_sancak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nöbetçi kayıt defterini açıp adları bir bir yazıyor; her adın yanına işaretini koyuyor. Gelenler birbirine bakıyor. Bir defterde ilk kez aynı sayfadalar.", en: "The guard opens the roll book and writes the names in one by one, putting your mark next to each. The newcomers look at each other. For the first time, they're on the same page of a book." }
          - metin: { tr: "Kâğıda bakan Hüsnü Reis homurdanıyor: \"Altmış yıl kimsenin sancağı altına girmedim. Bu da fırtına yüzünden.\"", en: "Cap'n Hank looks at the page and grumbles. \"Sixty years I never signed on under anybody's banner. Blame the storm.\"" }
            kosul: { herhangi: [{ bayrak: "bl13_samandira_tamam" }, { bayrak: "bl13_samandira_duduk" }, { bayrak: "bl13_samandira_bakir" }] }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defterdeki son ada bak", en: "Look at the last name in the book" }
            sonraki: "@akis"

      - id: "bl13_us_kapidakiler_serbest"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nöbetçi kilidi açarken söylenip duruyor. Fare parmaklıklardan çıkınca doğruca sana yürüyor ve burnunun dibinde durup bakıyor.", en: "The guard grumbles the whole time he's working the lock. When Mouse comes out from behind the bars, she walks straight up to you and stops right under your nose." }
          - { tr: "\"Bir kere teslim ettin, bir kere çıkardın,\" diyor. \"Ödeştik. Fırtına gecesi çatılar bizim, sokaklar senin.\"", en: "\"You turned us in once, you got us out once,\" she says. \"We're even. Storm night, the roofs are ours. The streets are yours.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Anlaştık.\"", en: "\"Deal.\"" }
            sonraki: "@akis"

      - id: "bl13_us_kapidakiler_hatice"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hatice sedye ekiplerinin çadırına ilk girdiğinde bir süre ortada dikilip kalıyor. Sonra kırık bir sedyenin bacağını alıp, sanki eli aleti bırakmayı unutmuş gibi kaynak yapmaya başlıyor.", en: "When Hattie first walks into the stretcher crews' tent, she just stands in the middle for a while. Then she picks up a broken stretcher leg and starts welding it like her hands forgot how to let go of the torch." }
          - { tr: "Sabaha kadar on bir sedyeyi onarıyor. Ellerindeki yanıkların üstüne biri merhem sürüyor; ilk kez kimse kotasını sormuyor.", en: "By morning she's fixed eleven stretchers. Somebody puts salve on the burns on her hands. For the first time, nobody asks about her quota." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onarılan sedyeleri say", en: "Count the fixed stretchers" }
            sonraki: "@akis"

      - id: "bl13_us_kapidakiler_gonder"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kimse itiraz etmiyor. Bariyerin önündekiler birer birer dağılıyor; giderken dönüp arkalarına bakan olmuyor.", en: "Nobody argues. The people outside the barrier drift off one by one. Nobody looks back on the way out." }
          - { tr: "Nöbetçi kulübesine dönüp telsizin sesini açıyor. Telsizde bir şarkı çalıyor; araya bir teneke çan sesi karışıyor, çok uzaktan.", en: "The guard goes back into his booth and turns up the radio. A song's playing, and under it, very far off, the sound of a tin bell." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kulübenin önünden ayrıl", en: "Walk away from the booth" }
            sonraki: "@akis"

  # ================================================================== ÜS · NEHHA ÇANI (tohum: bl13_batik_canlar)
  - id: "bl13_us_can"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["us", "kapi", "hasat"]
    gerilim: 2
    kart: { tr: "Yeşil çan", en: "The Green Bell" }
    sahne: "bl13_us_can_1"
    sahneler:
      - id: "bl13_us_can_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nehha çanını Sığınak'taki çadırına astığın ilk gece uyanıyorsun. Çan çalıyor: dört vuruş, bir es. Telsiz sessiz; yirmi saniye sonra cızırdayıp {yer:tepe|de} bir kapının açıldığını bildiriyor.", en: "The first night you hang the Nehha bell in your tent at the Haven, you wake up to it ringing. Four beats, a rest. The radio's silent. Twenty seconds later it crackles: a Gate's opened in {yer:tepe}." }
          - { tr: "Ertesi gece aynısı oluyor, bu kez {yer:sanayi} için. Çan, nöbetçilerden de telsizden de önce duyuyor. Ama küçük bir el çanı bu; sesi çadırın dışına zor çıkıyor.", en: "The next night it happens again, this time for {yer:sanayi}. The bell hears it before any lookout, before any radio. But it's a little hand bell. Its voice barely makes it out of the tent." }
          - metin: { tr: "Sela-Om çanı verirken Son Fener'in çocuklarından söz etmişti. Onlar Sığınak'ın arka çadırlarında kalıyor; ikisi daha ilk gece çadırının önüne gelip sesi dinlemiş.", en: "When Sela-Om gave you the bell, she said it was for the Last Lantern's children. They're staying in the back tents at the Haven. Two of them came to your tent flap the very first night to listen." }
            kosul: { bayrak: "bl13_canlar_cocuklar" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Çan kapının açıldığı anı değil, kapının ısındığı anı duyuyor. Arada yirmi saniye var. Fırtına gecesi yirmi saniye bir sokak eder.", en: "The bell doesn't hear the moment a Gate opens. It hears the moment it warms up. There's twenty seconds between the two. On storm night, twenty seconds is a whole street." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu çan bir dünyanın son uyarısıydı. kimse dinlemedi. şimdi senin çadırında. ağır bir şey bu.", en: "this bell was a whole world's last warning. nobody listened. now it's in your tent. that's a heavy thing." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Benim uykumdaki ses bu. Aynısı. Bir dahaki sefere çalınca beni de uyandır.\"", en: "\"That's the sound from my sleep. Exactly that. Next time it rings, wake me up too.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sesini kaydetmeme izin ver. Yalnız kaydedeceğim, söz. Böyle bir aralığı hiçbir cihaz yakalayamıyor.\"", en: "\"Let me record it. Just record, I promise. No instrument I've got can catch an interval like that.\"" }
        secenekler:
          - id: "vinc"
            etiket: { tr: "Çanı tersanedeki vincin tepesine as; herkes duysun", en: "Hang the bell from the shipyard crane for all to hear" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_can_vincte"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 10
            sonraki: "bl13_us_can_vinc"
          - id: "kiz"
            etiket: { tr: "Çanı tebeşir dairelerini çizen kıza götür", en: "Take the bell to the chalk-circle girl" }
            goster: { herhangi: [{ bayrak: "sb13_kiz_yaninda" }, { bayrak: "sb13_kiz_annede" }, { bayrak: "sb13_kiz_korundu" }] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - bayrak: "bl13_can_kizda"
              - iliski: { yanki: { guven: 3 } }
              - xp_seviye: 10
            sonraki: "bl13_us_can_kiz"
          - id: "cocuklar"
            etiket: { tr: "Çanı Son Fener'in çocuklarına ver", en: "Give the bell to the Last Lantern's children" }
            goster: { bayrak: "batik_cocuklar_dunyada" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl13_can_cocuklarda"
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 9
            sonraki: "bl13_us_can_cocuklar"
          - id: "nobet"
            etiket: { tr: "Çanı nöbet kulübesine as; nöbetçiler sirene bağlasın", en: "Hang the bell in the guard booth, tied to the siren" }
            gerekli: { stat: { int: 200 } }
            etkiler:
              - iliski: { elif_sari: { guven: 2 } }
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl13_can_nobette"
              - xp_seviye: 10
            sonraki: "bl13_us_can_nobet"

      - id: "bl13_us_can_vinc"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Vincin koluna tırmanıp çanı en uca, rüzgârın ve suyun ortasına bağlıyorsun. Aşağıda kuru havuzda çalışan gece vardiyası kazmalarını indirip yukarı bakıyor.", en: "You climb the crane arm and tie the bell to the very tip, out where the wind and the water meet. Down in the drydock, the night shift lowers their picks and looks up." }
          - { tr: "O gece çan iki kez çalıyor. İkisinde de, telsiz cızırdamadan önce, liman çadırlarının ışıkları birer birer yanıyor.", en: "That night the bell rings twice. Both times, before the radio even crackles, the lights in the waterfront tents come on one by one." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Vincin kolunda biraz daha otur", en: "Sit out on the crane arm a while longer" }
            sonraki: "@akis"

      - id: "bl13_us_can_kiz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kız çanı iki eliyle alıp kulağına götürüyor, gözlerini kapatıyor. Uzun süre öylece kalıyor. Sonra gözlerini açıyor: \"Bu da duyuyor. Benim gibi. Ama çok yaşlı.\"", en: "The girl takes the bell in both hands and holds it to her ear with her eyes closed. She stays like that a long time. Then she opens her eyes. \"This one hears it too. Like me. But it's really old.\"" }
          - { tr: "O geceden sonra kız tebeşirle daire çizmiyor. Çan çaldığında yalnızca hangi yönü gösterdiğini söylüyor; yanındaki de koşup nöbetçiye haber veriyor.", en: "After that night, the girl stops drawing chalk circles. When the bell rings, she just says which way it's pointing, and whoever's with her runs to tell the guard." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İkisini baş başa bırak", en: "Leave the two of them together" }
            sonraki: "@akis"

      - id: "bl13_us_can_cocuklar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Arka çadırlarda otuz yedi çocuk çanın çevresinde bir halka oluyor. En büyükleri çanı alıp eski bir Nehha şarkısı mırıldanıyor; ötekiler dördüncü vuruşta susup esi birlikte bekliyor.", en: "In the back tents, thirty-seven children form a ring around the bell. The oldest takes it and hums an old Nehha song, and the others go quiet on the fourth beat and wait out the rest together." }
          - { tr: "\"Bu sefer kaçacağımız yeri biliyoruz,\" diyor en büyükleri. Senin dilinde söylediği ilk cümle bu.", en: "\"This time we know where to run,\" the oldest says. It's the first sentence the oldest has ever said in your language." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Şarkının bitmesini bekle", en: "Wait for the song to end" }
            sonraki: "@akis"

      - id: "bl13_us_can_nobet"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nöbetçiler çanı kulübenin tavanına, tokmağını da ince bir telle eski hava saldırısı sireninin şalterine bağlıyor. İlk denemede siren öyle bir uluyor ki martılar hep birlikte havalanıyor.", en: "The guards hang the bell from the booth ceiling and tie its clapper with a thin wire to the switch on the old air-raid siren. On the first test the siren howls so loud that every gull takes off at once." }
          - { tr: "Bir sonraki çalışında telsizden önce bütün liman uyanıyor. Kimse şikâyet etmiyor.", en: "The next time it rings, the whole waterfront wakes up before the radio does. Nobody complains." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Hoparlörlerin kablolarını kontrol et", en: "Check the speaker cables" }
            sonraki: "@akis"

  # ================================================================== ÜS · YEDİ TAHT KURYESİ (tohum: bl13_taht_bahis)
  - id: "bl13_us_kurye"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 13 }
    etiketler: ["us", "kadimler", "kapi"]
    gerilim: 3
    kart: { tr: "Altın mühürlü mektup", en: "The Gold-Sealed Letter" }
    sahne: "bl13_us_kurye_1"
    sahneler:
      - id: "bl13_us_kurye_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafak sökerken Sığınak'ın rıhtımında biri bekliyor: uzun, ince, eklemleri yanlış yerlerden bükülen bir Kadim kurye. Nöbetçiler ona silah doğrultmuş, ama yaklaşmaya kimse cesaret edemiyor. Kurye kıpırdamıyor; avucunda altın mühürlü bir mektup, gözü sende.", en: "At dawn someone is waiting on the Haven dock: a tall, thin Ancient courier whose joints bend in the wrong places. The guards have their guns on it, but nobody's brave enough to get close. The courier waits for you without moving, a gold-sealed letter in its palm." }
          - metin: { tr: "Mektupta tek satır var: [Bahsiniz kayda geçmiştir: yedi. Fırtınadan sonra bedel konuşulacaktır. Ek: İkinci Taht yedinin karşısına bir yıldız daha koydu.]", en: "The letter has one line. [Your wager has been entered: seven. The stakes will be discussed after the storm. Addendum: the Second Throne has placed one more star against seven.]" }
            kosul: { bayrak: "bl13_bahis_yedi" }
          - metin: { tr: "Mektup bir davetiye: [Konuk, fırtına gecesini galerimizden izlemeye davetlidir. Şehirden uzakta, güvende. Yer ayrılmıştır.] Altında ince, Kadim harfleriyle bir not var: hesabını okudun; biz de seninkini okuduk.", en: "The letter's an invitation. [The guest is invited to watch storm night from our gallery. Far from the city, in safety. A seat has been reserved.] Under it, in thin Ancient letters, a note: you read our math. we read yours." }
            kosul: { bayrak: "bl13_bahis_okundu" }
          - metin: { tr: "Mektup bir fatura: [Hasar: bir harita, iki yüz on yedi yıldız. Bedel: fırtına gecesi bir mahalle. Hangisi olduğuna konuk karar verecektir.]", en: "The letter's a bill. [Damages: one map, two hundred and seventeen stars. Payment: one neighborhood on storm night. The guest will decide which.]" }
            kosul: { bayrak: "bl13_bahis_yirtildi" }
          - metin: { tr: "Mektup kısa: [Konuk bahse girmedi. Bahse girmeyen de bir bahis yapmış olur. İki.]", en: "The letter is short. [The guest declined to wager. To decline is also a wager. Two.]" }
            kosul: { bayrak: "bl13_bahis_ret" }
          - metin: { tr: "Kurye seni tanıyor; mektubu uzatırken başını, bir elçiyi selamlar gibi hafifçe eğiyor. Kabul Salonu'ndaki konuğu unutmamışlar.", en: "The courier knows you. As it holds out the letter, it inclines its head slightly, the way one greets an envoy. The Court hasn't forgotten its guest from the reception hall." }
            kosul: { herhangi: [{ bayrak: "taht_egildi" }, { bayrak: "taht_ittifak" }] }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Kuryenin derisinin altındaki takımyıldız dar ve düzensiz; yıldızlarından biri yerinden oynamış. Onu da birisi bir bahiste kaybetmiş.", en: "The constellation under the courier's skin is narrow and uneven, with one star knocked out of place. Somebody lost that one on a bet too." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "mektubu okuma diyeceğim, okuyacaksın. o yüzden şunu diyeyim: cevap verme. her cevabın da bir kaydı var.", en: "i'd tell you not to read it, but you will. so i'll say this instead: don't answer. every answer gets entered too." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "{npc:aras_kurt} elini göğsüne bastırıyor. \"Bununla aynı yerden geliyor,\" diyor dişlerinin arasından. \"Gönder şunu.\"", en: "{npc:aras_kurt} presses a hand to his chest. \"It comes from the same place this does,\" he says through his teeth. \"Send it back.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nöbetçiler bir saattir silahlarını indirmedi. Kolları titriyor. Bitir şu işi.\"", en: "\"The guards haven't lowered their guns in an hour. Their arms are shaking. Wrap this up.\"" }
        secenekler:
          - id: "yak"
            etiket: { tr: "Mektubu kuryenin önünde yak", en: "Burn the letter in front of the courier" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { kadimler: -2 }
              - iliski: { thessar: { saygi: 2, guven: -2 } }
              - bayrak: "bl13_mektup_yakildi"
              - xp_seviye: 9
            sonraki: "bl13_us_kurye_yak"
          - id: "cevap"
            etiket: { tr: "Mektubun arkasına cevap yaz: \"Fırtınadan sonra konuşuruz.\"", en: "Write on the back: \"We'll talk after the storm.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { thessar: { saygi: 3 } }
              - bayrak: "bl13_mektup_cevap"
              - xp_seviye: 9
            sonraki: "bl13_us_kurye_cevap"
          - id: "sor"
            etiket: { tr: "Kuryeye sor: \"Taşları kim yerleştirdi?\"", en: "Ask the courier: \"Who placed the stones?\"" }
            gerekli: { stat: { cha: 220 } }
            goster: { herhangi: [{ bayrak: "bl13_tas_siparis" }, { bayrak: "bl13_tas_alindi" }, { bayrak: "bl13_bahis_okundu" }] }
            etkiler:
              - bayrak: "bl13_kurye_konustu"
              - iliski: { yanki: { saygi: 2 } }
              - xp_seviye: 12
            sonraki: "bl13_us_kurye_sor"
          - id: "sakla"
            etiket: { tr: "Mektubu katlayıp cebine koy; kuryeye yol göster", en: "Pocket the letter. Show the courier the way out" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { yanki: { guven: -1 } }
              - bayrak: "bl13_mektup_saklandi"
            sonraki: "bl13_us_kurye_sakla"

      - id: "bl13_us_kurye_yak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çakmağı mührün altına tutuyorsun. Kâğıt yanmıyor önce; sonra birden, kül bile bırakmadan, yıldız tozu gibi dağılıp havaya karışıyor.", en: "You hold a lighter under the seal. At first the paper won't catch. Then, all at once, it scatters into the air like stardust, without leaving so much as ash." }
          - { tr: "Kurye bunu izliyor, ifadesi hiç değişmiyor. Sonra eğilip geldiği gibi gidiyor. Nöbetçiler silahlarını indiriyor; biri dizlerinin üstüne çöküp kusuyor.", en: "The courier watches, its expression never changing. Then it bows and leaves the way it came. The guards lower their guns. One drops to his knees and throws up." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Nöbetçinin yanına git", en: "Go over to the guard" }
            sonraki: "@akis"

      - id: "bl13_us_kurye_cevap"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kurye cevabı okuyor, kâğıdı katlayıp kendi derisinin altına, takımyıldızının yanına sokuyor. \"Kayda geçti,\" diyor; sanki o iki sözcük tehdit değilmiş gibi.", en: "The courier reads your answer, folds the paper and tucks it under its own skin, next to its constellation. \"Entered,\" it says, like those words aren't a threat." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gidişini izle", en: "Watch it go" }
            sonraki: "@akis"

      - id: "bl13_us_kurye_sor"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kurye bir an susuyor; Kadimler soruya yanıt vermez, onu tartar. Sonra tek bir cümle kuruyor: \"Taşları koyan el bahse girmez. Bahse girenler taşı koyan eli tanımaz. İkinci Taht yalnızca siparişi imzaladı.\"", en: "The courier goes quiet for a moment. Ancients don't answer questions. They weigh them. Then it puts together one sentence. \"The hand that places the stones does not wager. Those who wager do not know the hand. The Second Throne only signed the order.\"" }
          - { tr: "\"Taşlardan biri sizin kıyınızda,\" diye ekliyor, istemeden ağzından kaçmış gibi. \"Ateşle yapılmış bir boşlukta.\" Sonra eğilip gidiyor.", en: "\"One of the stones is on your shore,\" it adds, like it slipped out. \"In a hollow made for fire.\" Then it bows and leaves." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşle yapılmış boşluğu düşün", en: "Think about that hollow made for fire" }
            sonraki: "@akis"

      - id: "bl13_us_kurye_sakla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mektubu cebine koyup kuryeye rıhtımın ucunu gösteriyorsun. Kurye eğilip gidiyor. Cebindeki kâğıt bütün gün sıcak kalıyor, bir elin içi gibi.", en: "You put the letter in your pocket and point the courier to the end of the dock. It bows and goes. All day the paper in your pocket stays warm, like the inside of a hand." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Elini cebinden çek", en: "Take your hand out of your pocket" }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · KULE DİBİ · DENİZ
  - id: "bl13_kamp_deniz"
    konum: ["kule_dibi"]
    kamp: true
    perde: [3]
    gun: { min: 262, max: 291 }
    kosul: { bolum: 13 }
    etiketler: ["kamp", "npc", "deniz"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Şimşek saymak", en: "Counting the Lightning" }
    sahne: "bl13_kamp_deniz_1"
    sahneler:
      - id: "bl13_kamp_deniz_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kampı Kule'nin gölgesine yakın bir apartmanın çatısına kurmuşsunuz. Şehrin üstünde kapılar birer birer açılıyor; her biri bir an mor bir şimşek gibi çakıp sönüyor. {npc:deniz_arman} dizlerini kucaklamış, dudakları kıpırdıyor.", en: "You've set up camp on the roof of an apartment building close to the Spire's shadow. Gates are opening over the city one at a time, each flashing for a second like purple lightning and going dark. {npc:deniz_arman} is hugging their knees, lips moving." }
          - { tr: "\"Çocukken şimşek sayardık,\" diyor sonunda. \"Çakınca saymaya başlarsın, gök gürleyince durursun. Kaç saydıysan fırtına o kadar uzakta. Bunlarda gürleme yok. Saymaya başlıyorum, bitiremiyorum.\"", en: "\"When we were kids, we used to count lightning,\" {npc:deniz_arman} finally says. \"It flashes, you start counting, you stop at the thunder. However far you got, that's how far off the storm is. These don't have thunder. I start counting and I can't stop.\"" }
          - { tr: "Bir kapı daha çakıyor, {yer:eski_sehir} tarafında. {npc:deniz_arman} gözünü ondan ayırmadan soruyor: \"Fırtına gecesi yedi kapı açılacak, sen birine yetişeceksin. Hangisine?\"", en: "Another Gate flashes, over toward {yer:eski_sehir}. Without taking their eyes off it, {npc:deniz_arman} asks: \"Storm night, seven Gates open, and you get to one. Which one?\"" }
          - metin: { tr: "Geçen gün çapa için seçtiğiniz sözcük hâlâ aranızda duruyor. {npc:deniz_arman} onu söylemeden ağzının içinde döndürüyor, bir şeker gibi.", en: "The anchor word you picked together the other day is still hanging between you. {npc:deniz_arman} turns it over in their mouth without saying it, like a piece of candy." }
            kosul: { herhangi: [{ bayrak: "sb12_deniz_capa_ani" }, { bayrak: "sb12_deniz_capa_durust" }] }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Sayarken nefesini tutuyor. Dördüncü sayıda bırakıyor, sonra yeniden tutuyor. Farkında değil.", en: "They hold their breath while they count. Let it out on four, then hold it again. They don't even notice." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "doğru cevap yok. ama yanlış cevap var: yalan olanı.", en: "there's no right answer. there is a wrong one, though. the one that's a lie." }
        secenekler:
          - id: "senin"
            etiket: { tr: "\"Seninkine. Hangisinde olursan.\"", en: "\"Yours. Whichever one you're at.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 4, baglilik: 4 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl13_kamp_deniz", agirlik: 20 }
              - bayrak: "bl13_deniz_seninkine"
            sonraki: "bl13_kamp_deniz_senin"
          - id: "kalabalik"
            etiket: { tr: "\"En kalabalık olanına. Sen de olsan, olmasan da.\"", en: "\"The most crowded one. Whether you're there or not.\"" }
            etkiler:
              - iliski: { deniz_arman: { saygi: 5, guven: 2 } }
              - ahlak: { insanlik: 2 }
              - bayrak: "bl13_deniz_kalabalik"
            sonraki: "bl13_kamp_deniz_kalabalik"
          - id: "yanimda"
            etiket: { tr: "\"Ayrı kapı yok. O gece yanımdan ayrılmıyorsun.\"", en: "\"No separate Gates. That night you stay by my side.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, baglilik: 3, saygi: -2 } }
              - bayrak: "bl13_deniz_yaninda"
            sonraki: "bl13_kamp_deniz_yanimda"

      - id: "bl13_kamp_deniz_senin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre sana bakıyor, sonra gülmeye başlıyor; kısa, kırık bir gülüş. \"Yalan,\" diyor. \"Ama güzel bir yalan. Kardeşim de böyle yalanlar söylerdi.\"", en: "{npc:deniz_arman} looks at you for a while, then starts laughing, a short, cracked laugh. \"Liar,\" they say. \"But it's a nice lie. My sister used to tell lies like that.\"" }
          - { tr: "Başını omzuna yaslıyor. Bir kapı daha çakıyor; bu sefer saymıyor.", en: "They lean their head on your shoulder. Another Gate flashes. This time, they don't count." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kıpırdama", en: "Don't move" }
            sonraki: "@akis"

      - id: "bl13_kamp_deniz_kalabalik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} başını sallıyor, yavaşça. \"Doğrusu bu,\" diyor. \"Biliyorum. Duymak istediğim de bu değildi, onu da biliyorum.\"", en: "{npc:deniz_arman} nods, slowly. \"That's the right answer,\" they say. \"I know. And I know it's not the one I wanted to hear.\"" }
          - { tr: "Bir süre sonra ekliyor: \"O gece ben de en kalabalığına gideceğim. Belki orada karşılaşırız. Karşılaşmazsak da birbirimizin nerede olduğunu biliriz.\"", en: "After a while they add: \"That night I'll go to the most crowded one too. Maybe we'll run into each other there. And if we don't, at least we'll know where the other one is.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Orada görüşürüz.\"", en: "\"See you there.\"" }
            sonraki: "@akis"

      - id: "bl13_kamp_deniz_yanimda"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} kaşlarını çatıyor. \"Beni korumak için mi, yoksa ben seni korumak için mi?\" diye soruyor. Cevap beklemiyor. \"Neyse. İkisi de olur.\"", en: "{npc:deniz_arman} frowns. \"To protect me, or so I can protect you?\" they ask. They don't wait for an answer. \"Whatever. Either works.\"" }
          - { tr: "Yine de gözü şehrin üstünde, yedi kapının açılacağı yedi noktada dolaşıyor. Altı tanesini bırakmanın ne demek olduğunu sen söylemeden hesaplıyor.", en: "Still, their eyes keep moving over the city, over the seven spots where the seven Gates will open. Without you saying it, they're working out what it means to leave six of them." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çatının kenarından şehre bak", en: "Look out over the edge of the roof" }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · KULE DİBİ · MERT
  - id: "bl13_kamp_mert"
    konum: ["kule_dibi"]
    kamp: true
    perde: [3]
    gun: { min: 262, max: 291 }
    kosul: { bolum: 13 }
    etiketler: ["kamp", "npc", "sessiz_ag"]
    gerilim: 1
    npc: ["mert_kilic"]
    kart: { tr: "Kısalan es", en: "The Shrinking Rest" }
    sahne: "bl13_kamp_mert_1"
    sahneler:
      - id: "bl13_kamp_mert_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateşin başında {npc:mert_kilic} dizüstü bilgisayarını açmış, kablolarından birini Kule'nin dış duvarına dayadığı bir mikrofona bağlamış. Ekranda yeşil bir dalga kıvrılıp duruyor: dört tepe, bir düzlük. Dört tepe, bir düzlük.", en: "By the fire, {npc:mert_kilic} has his laptop open, one cable run to a mic he's pressed against the Spire's outer wall. A green wave keeps curling across the screen. Four peaks, a flat stretch. Four peaks, a flat stretch." }
          - { tr: "\"Kule de atıyor,\" diyor gözünü ekrandan ayırmadan. \"Ama asıl mesele bu değil. Bak.\" Ekranı sana çeviriyor; üst üste on iki gecenin kaydı dizilmiş. Düzlükler her gece biraz daha kısalmış.", en: "\"The Spire's beating too,\" he says, eyes glued to the screen. \"But that's not the point. Look.\" He turns the screen toward you. Twelve nights of recordings, stacked one on top of the other. Every night, the flat stretch is a little shorter." }
          - { tr: "\"Es kısalıyor,\" diyor. \"Sıfıra indiği an dört vuruş tek vuruşa dönecek. Hesapladım. Gün 292, sabaha karşı, dördü biraz geçe. Dakikasını söyleyemem; dakikası için on üçüncü gece lazım.\"", en: "\"The rest is shrinking,\" he says. \"The moment it hits zero, four beats turn into one. I ran the numbers. Day 292, early morning, a little after four. I can't give you the minute. For the minute I need a thirteenth night.\"" }
          - metin: { tr: "Bilgisayarın kenarına bir kâğıt yapıştırılmış: kızın tebeşir haritasının fotokopisi. {npc:mert_kilic} kendi eğrisini onun dairelerinin üstüne çizmiş; ikisi birbirini tutuyor.", en: "There's a sheet of paper taped to the edge of the laptop: a photocopy of the girl's chalk map. {npc:mert_kilic} has drawn his curve over her circles, and the two line up." }
            kosul: { herhangi: [{ bayrak: "sb13_harita_dagitildi" }, { bayrak: "sb13_kiz_kayit" }] }
        sezgiler:
          - kosul: { stat: { int: 220 } }
            metin: { tr: "Hesabı doğru. Kısalmanın hızı da sabit değil, hızlanıyor; biri esi elle kısaltıyor gibi.", en: "His math checks out. And the shrinking isn't steady. It's speeding up, like somebody's shortening the rest by hand." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "on üçüncü gece için uyumayacak. ona uyumasını sen söylemezsen kimse söylemeyecek.", en: "he's not going to sleep, not with a thirteenth night to record. if you don't tell him, nobody will." }
        secenekler:
          - id: "kaydet"
            etiket: { tr: "\"Kaydet. Ben nöbet tutarım, sen dinle.\"", en: "\"Record it. I'll keep watch, you listen.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 4, saygi: 3 } }
              - bayrak: "bl13_mert_dakika"
              - hafiza: { npc: "mert_kilic", id: "olay:bl13_kamp_mert", agirlik: 15 }
            sonraki: "bl13_kamp_mert_kaydet"
          - id: "uyu"
            etiket: { tr: "Bilgisayarın kapağını kapat: \"Bu gece uyuyacaksın.\"", en: "Close the laptop. \"You're sleeping tonight.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 4, saygi: -2 } }
              - bayrak: "bl13_mert_uyudu"
            sonraki: "bl13_kamp_mert_uyu"
          - id: "kim"
            etiket: { tr: "\"Esi kim kısaltıyor?\"", en: "\"Who's shortening the rest?\"" }
            gerekli: { stat: { int: 220 } }
            etkiler:
              - iliski: { mert_kilic: { saygi: 5 } }
              - bayrak: "bl13_mert_metronom"
            sonraki: "bl13_kamp_mert_kim"

      - id: "bl13_kamp_mert_kaydet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece boyu ateşin başında oturuyorsun; {npc:mert_kilic} kulaklıkları takmış, gözlerini kapamış, arada bir parmağıyla dizinin üstüne vuruyor. Dört vuruş, bir es.", en: "You sit by the fire all night while {npc:mert_kilic} listens with headphones on and eyes shut, tapping a finger on his knee every so often. Four beats, a rest." }
          - { tr: "Şafak sökerken gözlerini açıp ekrana bir satır yazıyor ve sana çeviriyor: 04:12. \"Artı eksi bir dakika,\" diyor. \"Ağ'a ben iletirim. Teşekkür ederim. Nöbet için.\"", en: "At dawn he opens his eyes, types one line on the screen and turns it toward you: 4:12. \"Give or take a minute,\" he says. \"I'll pass it to the Network. Thanks. For keeping watch.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Saati aklına yaz", en: "Commit the time to memory" }
            sonraki: "@akis"

      - id: "bl13_kamp_mert_uyu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} itiraz etmek için ağzını açıyor, sonra vazgeçip kulaklıklarını boynuna indiriyor. On dakika sonra uyumuş; elinde hâlâ bilgisayar faresi duruyor.", en: "{npc:mert_kilic} opens his mouth to argue, then gives up and slides the headphones down around his neck. Ten minutes later he's asleep, still holding the mouse." }
          - { tr: "Ekran kararmadan önce son kaydı görüyorsun: düzlük bu gece biraz daha kısa. Onu yarın da kaydeder. Bu gece kaydetmese de olur.", en: "Before the screen goes dark you catch the last recording. The flat stretch is a little shorter tonight. He can record it tomorrow. Tonight it can wait." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Üstüne bir battaniye ört", en: "Throw a blanket over him" }
            sonraki: "@akis"

      - id: "bl13_kamp_mert_kim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} ekrana bir süre bakıyor. \"Doğal bir şey kendi kendine hızlanmaz,\" diyor. \"Ya yavaşlar ya düzensizleşir. Bu tam tersi; her gece biri biraz daha sıkıyor. Biri metronom kurmuş.\"", en: "{npc:mert_kilic} stares at the screen for a while. \"Natural things don't speed themselves up,\" he says. \"They slow down, or they go irregular. This is the opposite. Every night somebody's cranking it a little tighter. Somebody set a metronome.\"" }
          - { tr: "Sesini alçaltıyor: \"Metronomu kuran el nerede bilmiyorum. Ama metronomun nerede durduğunu bulabilirim. Bana iki gece ver.\"", en: "He drops his voice. \"I don't know where the hand that set it is. But I can find where the metronome is sitting. Give me two nights.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"İki gece senin.\"", en: "\"The two nights are yours.\"" }
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · KULE DİBİ · ELİF
  - id: "bl13_kamp_elif"
    konum: ["kule_dibi"]
    kamp: true
    perde: [3]
    gun: { min: 262, max: 291 }
    kosul: { bolum: 13 }
    etiketler: ["kamp", "npc", "siginak"]
    gerilim: 1
    npc: ["elif_sari"]
    kart: { tr: "Kimseye söylemediği dikiş", en: "The Stitches She Didn't Mention" }
    sahne: "bl13_kamp_elif_1"
    sahneler:
      - id: "bl13_kamp_elif_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateş sönmeye yüz tuttuğunda {npc:elif_sari|in} kolunu sıvadığını görüyorsun. Önkolunda, dirseğe yakın, dikiş yeri açılmış bir kesik var. İğneyi dişleriyle tutup ipliği tek eliyle geçiriyor; dudakları sımsıkı.", en: "As the fire burns down, you see {npc:elif_sari} roll up her sleeve. On her forearm, near the elbow, there's a cut where the stitches have pulled open. She holds the needle in her teeth and threads it one-handed, lips pressed tight." }
          - { tr: "\"Üç gün önce,\" diyor, sen sormadan. \"{yer:sanayi|in} kapısında. Kimseye söylemedim. Söyleseydim beni sedyeden indirirlerdi. Fırtınaya günler kala doktorunu sedyeden indiremezsin.\"", en: "\"Three days ago,\" she says before you can ask. \"At the Gate in {yer:sanayi}. I didn't tell anybody. If I had, they'd have pulled me off the stretchers. You don't pull your doctor off the stretchers days before a storm.\"" }
          - { tr: "İlk dikişi atıp ipliği kesiyor. \"Fırtına gecesi kimi bırakacağıma şimdiden karar vermem lazım,\" diyor. \"Şimdi karar verirsem o gece ağlamadan yaparım. O gece karar verirsem ağlarım, ağlarken de biri ölür.\"", en: "She ties off the first stitch and cuts the thread. \"I need to decide now who I'm going to leave behind on storm night,\" she says. \"If I decide now, I can do it that night without crying. If I decide that night, I'll cry, and while I'm crying somebody dies.\"" }
          - metin: { tr: "Bileğindeki plastik bileklik ateşin ışığında parlıyor. Bileklikteki \"en yakın akraba\" satırına bakmamaya çalışıyorsun.", en: "The plastic wristband on her arm catches the firelight. You try not to look at the next-of-kin line." }
            kosul: { herhangi: [{ bayrak: "sb13_elif_gece" }, { bayrak: "sb13_elif_bileklik" }] }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Kesiğin kenarları kızarmış. Enfeksiyon başlamak üzere; yarın, bilemedin öbür gün ateşlenir.", en: "The edges of the cut have gone red. Infection's about to set in. She'll run a fever tomorrow, the day after at the latest." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "başkalarının yarasını sayıyor, kendisininkini saymıyor. senin gibi. sen de saymıyorsun.", en: "she counts everybody's wounds but her own. like you. you don't count yours either." }
        secenekler:
          - id: "dik"
            etiket: { tr: "İğneyi al; dikişi sen at", en: "Take the needle. Do the stitches yourself" }
            etkiler:
              - iliski: { elif_sari: { guven: 4, baglilik: 3 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl13_kamp_elif", agirlik: 20 }
              - bayrak: "bl13_elif_dikis"
            sonraki: "bl13_kamp_elif_dik"
          - id: "liste"
            etiket: { tr: "\"Listeyi birlikte yapalım. Ağlamak da ikimizin olsun.\"", en: "\"Let's make the list together. And cry together.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: 3, saygi: 3 } }
              - ahlak: { insanlik: 2 }
              - bayrak: "bl13_elif_liste"
            sonraki: "bl13_kamp_elif_liste"
          - id: "soyle"
            etiket: { tr: "\"Yaranı Konsey'e söyleyeceğim.\"", en: "\"I'm telling the Council about that cut.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: -3, saygi: 2 } }
              - ahlak: { duzen: 2 }
              - bayrak: "bl13_elif_ihbar"
            sonraki: "bl13_kamp_elif_soyle"

      - id: "bl13_kamp_elif_dik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İğneyi elinden alıyorsun; bırakması bir an sürüyor. Dikişleri sen atarken {npc:elif_sari} her birini sayıyor, sesli, bir hemşireye talimat verir gibi: \"Daha sık. Daha sık. İyi.\"", en: "You take the needle from her. It takes her a second to let go. As you put in the stitches, {npc:elif_sari} counts each one out loud, like she's coaching a nurse. \"Tighter. Tighter. Good.\"" }
          - { tr: "Son dikişte sesi çatallanıyor. \"Bunu bana kimse yapmamıştı,\" diyor. \"Hep ben yapardım.\"", en: "On the last stitch her voice cracks. \"Nobody's ever done this for me,\" she says. \"It was always me doing it.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sargıyı bağla", en: "Tie off the bandage" }
            sonraki: "@akis"

      - id: "bl13_kamp_elif_liste"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} çantasından bir defter çıkarıyor. Sayfayı ikiye bölüyorsunuz: bir yanda \"önce\", öbür yanda \"sonra\". \"Hiç\" diye bir sütun açmaya ikiniz de yanaşmıyorsunuz.", en: "{npc:elif_sari} pulls a notebook out of her bag. You split the page down the middle: \"first\" on one side, \"later\" on the other. Neither of you is willing to start a column for \"never.\"" }
          - { tr: "Sabaha karşı defteri kapatıyor. Gözleri kızarmış ama kuru. \"Bir sütun eksik kaldı,\" diyor. \"Onu o gece yazarız. İkimiz.\"", en: "Near dawn she closes the notebook. Her eyes are red but dry. \"We left one column out,\" she says. \"We'll write that one that night. Both of us.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defteri ona geri ver", en: "Hand the notebook back" }
            sonraki: "@akis"

      - id: "bl13_kamp_elif_soyle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} dikişi yarıda bırakıp sana bakıyor. Bakışında öfke yok; bir doktorun kötü haberi tartarkenki bakışı bu. \"Söyle,\" diyor. \"Haklısın. Ama fırtınadan sonra söyle. O gece bana bir sedye lazım, bir de sen.\"", en: "{npc:elif_sari} stops mid-stitch and looks at you. There's no anger in it. It's the look of a doctor weighing bad news. \"Tell them,\" she says. \"You're right. But tell them after the storm. That night I need a stretcher. And you.\"" }
          - { tr: "Son dikişi kendi atıyor. İpliği kestikten sonra iğneyi uzun süre elinde tutuyor.", en: "She does the last stitch herself. After she cuts the thread, she holds onto the needle for a long time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Fırtınadan sonra.\"", en: "\"After the storm.\"" }
            sonraki: "@akis"
