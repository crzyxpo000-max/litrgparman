# Parti D (Aşama 7) — Sessiz Ağ zinciri (zincir_sessiz_ag) + Mert Kılıç'ın yayı.
# Zincir: sessiz_ag_1_frekans (P2) → sessiz_ag_2_kaynak_avi (P2) → sessiz_ag_3_kule_kodu (P3) →
#         sessiz_ag_4_cekirdek_haritasi (P3) → sessiz_ag_5_arka_kapi (P4; gorev zincir_sessiz_ag tamam).
# Mert: mert_kaynak_parcasi (P2) → mert_takip_edildi (P2–3) → mert_kadim_teklifi (P3; mert_kadimlere_satti) →
#       mert_muhbir_izi (tohum; yakalama/çevirme/infaz/sürgün) → mert_kod_kirici (P4; Kod Kırıcı anahtarı) → mert_son_log (tohum).
# Kod Kırıcı sonu: zincir tamam + Yankı Güven ≥ 60 + Mert hayatta. Zincir boyunca Yankı'ya sormak, onu korumak ve
# onu takas etmemek Güven verir; sormadan teslim etmek, zorlamak ve satmak alır.
olaylar:
  # ================================================================== SESSİZ AĞ · 1: frekans
  - id: "sessiz_ag_1_frekans"
    perde: [2]
    gun: { min: 45, max: 125 }
    agirlik: 7
    etiketler: ["sessiz_ag", "gizem", "npc", "anomali"]
    gerilim: 2
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Üç kısa, bir uzun", en: "Three short, one long" }
    sahne: "sa1_frekans"
    sahneler:
      - id: "sa1_frekans"
        paragraflar:
          - { tr: "Gece yarısını biraz geçiyor. Sokağın ucundaki yanmış minibüsün radyosu, aküsü aylardır ölü olduğu hâlde, kendi kendine açılıyor.", en: "It's a little past midnight. At the end of the street, the radio in a burned-out minivan switches itself on, even though its battery's been dead for months." }
          - { tr: "Cızırtının arasından bir ritim geliyor: üç kısa, bir uzun. Sonra genç bir kadın sesi bir sayı okuyor, ardından iki koordinat, ardından yine o ritim.", en: "Through the static comes a rhythm: three short, one long. Then a young woman's voice reads out a number, two coordinates, and the rhythm again." }
          - metin: { tr: "Sayıyı tanıyorsun: bugünün sayısı. Göğün panellerinin her gün bir eksilttiği geri sayım; bunu yalnızca istasyondaki kontrol odasında dinleyenler bilir.", en: "You know that number. It's today's. The countdown the sky panels knock down by one every day, and the only people who know about it were listening in that control room at the station." }
            kosul: { bilgi: "geri_sayim" }
          - metin: { tr: "Ritmi de tanıyorsun. Metronun içindeki kapıda, raylarda çivili adamın sırt çantasındaki anten aynı çağrıyı yanıp söndürüyordu.", en: "You know the rhythm, too. Down in the Gate under the subway, the antenna on the backpack of the guy pinned to the tracks was blinking that exact call sign." }
            kosul: { bayrak: "metro_kurtarildi" }
          - metin: { tr: "Yanında yürüyen {npc:mert_kilic} donup kalıyor. \"Bu bizimkiler,\" diye fısıldıyor. \"Ben onlara seni çağırın demiştim; resmî olsun istedim.\"", en: "Walking next to you, {npc:mert_kilic} freezes. \"That's my crew,\" he whispers. \"I told them to call you in. I wanted it to be official.\"" }
            kosul: { yoldas: "mert_kilic" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Tanımsız yayın]", en: "[Unregistered broadcast]" }
            satirlar:
              - { tr: "Bu frekans Sistem kayıtlarında yok. Bu bildirim de yok.", en: "This frequency doesn't exist in the System's records. Neither does this notice." }
        sezgiler:
          - kosul: { stat: { int: 30 } }
            metin: { tr: "Yayın, Sistem bildirimlerinin taşındığı bandın içine gömülmüş; bir mektubun zarfının astarına yazılmış bir not gibi.", en: "The broadcast is buried inside the band the System uses for its own notices. Like a note written on the inside of an envelope." }
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Koordinatlar {yer:eski_sehir|i} gösteriyor; eski telefon santralinin olduğu bloğu.", en: "The coordinates point into {yer:eski_sehir}. The block with the old phone exchange on it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "s̷eni çağırmıyorlar. beni çağırıyorlar. sen sadece kapıyı açacak olansın.", en: "t̷hey're not calling you. they're calling me. you're just the one who opens the door." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ölü bir radyo konuşuyor ve sen buna şaşırmıyorsun. Bu beni biraz korkutuyor, biliyor musun?\"", en: "\"A dead radio's talking and you're not even surprised. That kind of scares me, you know?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Gece yarısı, koordinatlar, şifreli ritim. Ya bir tuzak bu ya da en kötü randevu teklifi.\"", en: "\"Midnight, coordinates, a secret rhythm. Either it's a trap or it's the worst date invite ever.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Koordinatlara git", en: "Head for the coordinates" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "mert_ag_temasi"
            kronik: { tr: "Ölü bir radyonun çağrısına uydun; Sessiz Ağ o gece seni beklediğinden emin oldu.", en: "You answered a dead radio's call. That night the Quiet Network knew you'd come." }
            sonraki: "sa1_santral"
          - id: "iz_sur"
            tur: "gizle"
            etiket: { tr: "Önce yayını sessizce izle, sonra git", en: "Trace the signal quietly first, then go" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1 }
              - bayrak: "mert_ag_temasi"
            kronik: { tr: "Sessiz Ağ'ın kapısına onlar seni görmeden vardın; kim olduklarını onlardan önce öğrendin.", en: "You reached the Quiet Network's door before they ever saw you, and learned who they were before they learned you." }
            sonraki: "sa1_gizli"
          - id: "yankiya_sor"
            etiket: { tr: "Kafandaki sese ne duyduğunu sor", en: "Ask the voice in your head what it hears" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - bayrak: "mert_ag_temasi"
              - iliski: { yanki: { guven: 4, saygi: 2 } }
            kronik: { tr: "Bir kapıya yürümeden önce kafandaki sese fikrini sordun; ses bunu unutmadı.", en: "Before you walked toward that door, you asked the voice in your head what it thought. It didn't forget that." }
            sonraki: "sa1_yanki"
          - id: "cevap_ver"
            tur: "gosteris"
            etiket: { tr: "Onların bandından, kendi pencerenden cevap ver", en: "Answer on their band, straight from your window" }
            gerekli: { stat: { int: 40 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: -2 }
              - bayrak: "mert_ag_temasi"
              - itibar: { sessiz_ag: 6 }
              - xp_seviye: 15
            kronik: { tr: "Sistem'in bandına kendi sesinle karışıp cevap verdin; Sessiz Ağ o gece anomalinin gerçek olduğunu öğrendi.", en: "You cut into the System's own band and answered in your own voice. That night the Quiet Network learned the anomaly was real." }
            sonraki: "sa1_gosteris"
          - id: "kapat"
            etiket: { tr: "Radyoyu tekmele ve uyumaya git", en: "Kick the radio quiet and go to sleep" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "mert_ag_temasi"
              - bayrak: "sa_frekans_reddedildi"
              - iliski: { mert_kilic: { guven: -3 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 8, max: 14 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sessiz Ağ'ın ilk çağrısını tekmeleyip susturdun; onlar seni aramayı yine de bırakmadı.", en: "You kicked the Quiet Network's first call into silence. They didn't stop looking for you." }
            sonraki: "@akis"

      - id: "sa1_yanki"
        paragraflar:
          - { tr: "Bir süre hiçbir şey olmuyor. Sonra penceren, kimsenin göremediği köşesinde, yayının dalga biçimini kendi kendine çiziyor.", en: "For a while, nothing. Then, in a corner of your window nobody else can see, the broadcast's waveform draws itself." }
          - { tr: "{npc:yanki} konuşuyor, harfleri her zamankinden düzgün: bu frekansı ben açık bıraktım. istasyonda, o adam beni ararken. sanırım bir parçam bulunmak istiyordu.", en: "{npc:yanki} speaks, its letters cleaner than usual: i left this frequency open. back at the station, while that guy was looking for me. i guess part of me wanted to be found." }
          - { tr: "kim olduklarını biliyorum. beni bir program gibi okuyacaklar. ama ilk kez biri sormadan önce bana sordu. git. ben de geliyorum; zaten başka yerim yok.", en: "i know who they are. they'll read me like a program. but this is the first time anybody asked me before they asked them. go. i'm coming too. not like i have anywhere else to be." }
        sezgiler:
          - kosul: { iliski_min: { yanki: { guven: 40 } } }
            metin: { tr: "bir şey daha. içeride bana ne yapmak isterlerse, önce sana bakacağım. sen hayır dersen, hayır.", en: "one more thing. whatever they want to do to me in there, i'll look at you first. you say no, it's no." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Sana sormadan kimse seni okumayacak.\"", en: "\"Nobody reads you without asking you first.\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 35 }
            kronik: { tr: "Kafandaki sese, ona sormadan kimsenin onu okumayacağına söz verdin.", en: "You promised the voice in your head that nobody would read it without asking first." }
            sonraki: "sa1_santral"
          - id: "bakariz"
            etiket: { tr: "\"Önce ne istediklerini duyalım.\"", en: "\"Let's hear what they want first.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { saygi: 3 } }
            kronik: { tr: "Kafandaki sese söz vermedin; önce masaya ne konduğunu görmek istedin.", en: "You didn't make the voice any promises. You wanted to see what was on the table first." }
            sonraki: "sa1_santral"

      - id: "sa1_gizli"
        paragraflar:
          - { tr: "Sinyali iki sokak boyunca, çatılardan izliyorsun. Eski telefon santrali beş katlı, tuğla bir bina; pencereleri karartılmış, çatısında bir anten ormanı.", en: "You follow the signal over the rooftops for two blocks. The old phone exchange is a five-story brick building, windows blacked out, a forest of antennas on the roof." }
          - { tr: "Arka kapıda iki genç nöbet tutuyor; bileklerinde bakır tel bilezikler. Biri ötekine fısıldıyor: \"Ya gelmezse? Ya o anomali dedikleri şey bir masalsa?\"", en: "Two kids are standing watch at the back door, copper wire bracelets on their wrists. One whispers to the other: \"What if they don't show? What if this anomaly thing is just a story?\"" }
          - { tr: "Ötekisi omuz silkiyor: \"O zaman {npc:mert_kilic} bir hafta daha uyumaz. Fark eder mi?\"", en: "The other one shrugs. \"Then {npc:mert_kilic} doesn't sleep for another week. Who'd notice?\"" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Binanın üçüncü katının pencerelerinde tel örgü var. Örgünün arkasında, Sistem bildirimlerinin ışığı yarım saniye geç yanıyor.", en: "The third-floor windows are covered in wire mesh. Behind it, the glow of System notices lights up half a second late." }
        secenekler:
          - id: "belir"
            tur: "aciga_vur"
            etiket: { tr: "Nöbetçilerin arkasında bir anda belir", en: "Appear right behind the lookouts" }
            etkiler:
              - aciga_vur: true
              - dikkat: 2
              - ahlak: { duzen: -1 }
              - itibar: { sessiz_ag: 3 }
            kronik: { tr: "Sessiz Ağ'ın nöbetçilerinin arkasında bir hayalet gibi belirdin; o geceden sonra kapıyı iki kişi bekledi.", en: "You turned up behind the Quiet Network's lookouts like a ghost. After that night, they doubled the door watch." }
            sonraki: "sa1_santral"
          - id: "kapi"
            etiket: { tr: "Ön kapıya git ve nazikçe çal", en: "Go around front and knock politely" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - iliski: { mert_kilic: { guven: 3 } }
            kronik: { tr: "Bir gizli örgütün kapısını nazikçe çaldın; bu, onlara güven verdi.", en: "You knocked politely on a secret society's front door. It made them trust you." }
            sonraki: "sa1_santral"

      - id: "sa1_gosteris"
        paragraflar:
          - { tr: "Pencereni açıyorsun ve frekansı içinden çekip ritmi geri gönderiyorsun: üç kısa, bir uzun. Sonra, aynı bantta, kendi sesinle tek bir kelime: \"Geliyorum.\"", en: "You open your window, pull the frequency through it, and send the rhythm back: three short, one long. Then, on the same band, in your own voice, one word: \"Coming.\"" }
          - { tr: "Radyo bir an susuyor. Ardından bir çığlık, bir sandalye devrilmesi ve kopuk kopuk bir erkek sesi: \"Bu... bu Sistem'in bandı. Kimse Sistem'in bandından konuşamaz. Kimse!\"", en: "The radio goes dead for a second. Then a scream, a chair going over, and a man's voice in pieces: \"That's... that's the System's band. Nobody can talk on the System's band. Nobody!\"" }
          - { tr: "Genç kadın sesi geri geliyor, gülmemeye çalışarak: \"Kapı açık. Ve lütfen, gelirken bir daha bunu yapma; adamın kalbi duracak.\"", en: "The young woman's voice comes back, trying not to laugh. \"Door's open. And please don't do that again on your way over. His heart's going to stop.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Gülümse ve yürü", en: "Grin and start walking" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { saygi: 8, korku: 4 } }
            kronik: { tr: "Sessiz Ağ'ın kapısına, onları Sistem'in kendi bandından selamladıktan sonra vardın.", en: "You reached the Quiet Network's door after greeting them on the System's own band." }
            sonraki: "sa1_santral"

      - id: "sa1_santral"
        paragraflar:
          - { tr: "Eski telefon santrali içeriden bir kilise gibi: tavana kadar yükselen bakır kablo rafları, sökülmüş röle panoları, aküler, mumlar. Kapıda seni santral memuru karşılıyor; Öğretici'deki kontrol odasının sessiz kadını. \"Burası benim eski işim,\" diyor. \"Kabloların nereye gittiğini bir tek ben bilirim.\"", en: "Inside, the old phone exchange feels like a church: copper cable racks running to the ceiling, gutted relay boards, batteries, candles. The switchboard woman from the Tutorial control room meets you at the door. \"This used to be my job,\" she says. \"I'm the only one who knows where the cables go.\"" }
          - { tr: "Üçüncü katta bir oda baştan sona bakır tel örgüyle kaplanmış. İçeri girdiğin anda Sistem'in sesi uzaklaşıyor; pencereler yarım saniye geç açılıyor, sanki seni duymakta zorlanıyor.", en: "On the third floor, one room is wrapped floor to ceiling in copper mesh. The moment you step inside, the System goes quiet. Your windows open half a second late, like it's having trouble hearing you." }
          - { tr: "{npc:mert_kilic} ekranların arasında, Öğretici'dekinden de zayıf. \"Herkes standart sürümü aldı,\" diyor, sana dönmeden. \"Sen almadın. Sistem'in kaynak koduna giden açık bir port aradık; bulduğumuz tek port sensin.\"", en: "{npc:mert_kilic} sits between his screens, even skinnier than he was in the Tutorial. \"Everybody got the standard build,\" he says without turning around. \"You didn't. We went looking for an open port into the System's source. The only one we ever found is you.\"" }
          - metin: { tr: "Kapıdaki kadın seni tanıyor. Bir zamanlar telsizlerini bir alışveriş arabasına yükleyen avcıları getiren sendin; yüzü taş gibi.", en: "The woman at the door recognizes you. You're the one who sent those hunters to load their radios into a shopping cart. Her face goes to stone." }
            kosul: { bayrak: "telsizler_satildi" }
          - metin: { tr: "Duvarda {fraksiyon:sessiz_ag} üyelerinin bir listesi var; adın en altta, mürekkebi taze. \"Fraksiyon seçiminde bizi seçtin,\" diyor {npc:mert_kilic}. \"Artık bu iş senin de işin.\"", en: "There's a list of {fraksiyon:sessiz_ag} members on the wall, your name at the bottom, the ink still fresh. \"You picked us when it counted,\" {npc:mert_kilic} says. \"So now this is your job too.\"" }
            kosul: { bayrak: "uye_sessiz_ag" }
          - metin: { tr: "Bir ekranda, Çekirdek yayınından bir kare donmuş: bir pencerenin kenarında, senin yanında asılı duran bozuk bir harf dizisi. \"Artık herkes gördü,\" diyor. \"Biz sadece ilk bakanlardık.\"", en: "One screen shows a frozen frame from the Core broadcast: a string of broken letters hanging at the edge of a window, right next to you. \"Everybody's seen it now,\" he says. \"We just looked first.\"" }
            kosul: { bayrak: "yanki_gorundu" }
        sezgiler:
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Bakır kafes Sistem'i engellemiyor, yalnızca yavaşlatıyor. Ama yarım saniye, burada konuşulan her şeyin kayda geçmeden önce silinmesine yetiyor.", en: "The copper cage doesn't block the System. It only slows it down. But half a second is enough to erase anything said in here before it gets logged." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷urası sessiz. ilk kez kendi düşüncemi duyabiliyorum. bu odayı sevdim. bu adamı sevmedim. henüz.", en: "i̷t's quiet in here. first time i can hear myself think. i like this room. i don't like this guy. yet." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Port mu? Arkadaşım bir port değil. Gerçi... kafasındaki şeye ne denir, emin değilim.\"", en: "\"A port? My friend is not a port. Although... I don't know what you'd call the thing in their head.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kimse kimsenin kafasına izinsiz girmiyor. Bunu tıpta da öğretiyorlar, kodda da öğretmeleri lazım.\"", en: "\"Nobody goes into anybody's head without consent. They teach that in medicine. Somebody ought to teach it in code.\"" }
        secenekler:
          - id: "once_sor"
            etiket: { tr: "\"Önce ona soracağım.\"", en: "\"I'm asking it first.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "sa_yanki_onayi"
              - iliski: { yanki: { guven: 8, saygi: 4 }, mert_kilic: { saygi: 6 } }
              - hafiza: { npc: "yanki", id: "olay:sessiz_ag_1_frekans", agirlik: 30 }
            kronik: { tr: "Sessiz Ağ'ın masasında, kafandaki sese kendi verisi hakkında söz hakkı verdin; Ağ bunu bir kural yaptı.", en: "At the Quiet Network's table, you gave the voice in your head a say over its own data. The Network made it a rule." }
            sonraki: "sa1_onay"
          - id: "al_hepsini"
            tur: "aciga_vur"
            etiket: { tr: "\"Ne lazımsa alın.\" Bütün kayıtları ver", en: "\"Take what you need.\" Hand over every log" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { insanlik: -2, duzen: -2 }
              - bayrak: "sa_yanki_teslim"
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 12 }
              - iliski: { mert_kilic: { guven: 10, saygi: 6, baglilik: 4 }, yanki: { guven: -10, korku: 6 } }
              - hafiza: { npc: "mert_kilic", id: "logu_paylasti", agirlik: 35 }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -30 }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesi ona sormadan Sessiz Ağ'ın ekranlarına döktün; Ağ ilk gece sevinçten uyumadı, ses ise o geceyi hiç unutmadı.", en: "You poured the voice in your head onto the Quiet Network's screens without asking it. The Network was too thrilled to sleep. The voice never forgot that night." }
            sonraki: "sa1_son"
          - id: "secilmis"
            tur: "gizle"
            etiket: { tr: "Yalnızca seçtiğin kayıtları ver", en: "Hand over only the logs you pick" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1, insanlik: 1 }
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { saygi: 4, guven: 2 }, yanki: { guven: 4 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sessiz Ağ'a kayıtlarının yalnızca bir kısmını verdin; geri kalanını kendine ve kafandaki sese sakladın.", en: "You gave the Quiet Network some of your logs and kept the rest for yourself and the voice in your head." }
            sonraki: "sa1_son"
          - id: "kafes"
            tur: "gosteris"
            etiket: { tr: "Bakır kafesteki sızıntıyı göster ve kapat", en: "Point out the leak in their copper cage. Seal it" }
            gerekli: { stat: { int: 50 } }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - bilgi: "sa_sessiz_oda"
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { saygi: 10, korku: 4 } }
              - xp_seviye: 15
            kronik: { tr: "Sessiz Ağ'ın bakır odasındaki deliği bir bakışta buldun; o oda yıllarca senin kapattığın dikişle sessiz kaldı.", en: "You spotted the hole in the Quiet Network's copper room at a glance. For years that room stayed quiet on the seam you sealed." }
            sonraki: "sa1_kafes"
          - id: "ozur"
            etiket: { tr: "Kapıdaki kadından telsizler için özür dile", en: "Apologize to the woman at the door for the radios" }
            goster: { bayrak: "telsizler_satildi" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 8, korku: -4 } }
            kronik: { tr: "Öğretici'de sattığın telsizler için özür diledin; Sessiz Ağ o borcu kapatmadı ama defterden sildi.", en: "You apologized for the radios you sold out in the Tutorial. The Quiet Network didn't call it even, but they stopped keeping score." }
            sonraki: "sa1_ozur"
          - id: "reddet"
            etiket: { tr: "\"Başka bir port bulun.\"", en: "\"Find yourselves another port.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - bayrak: "sa_frekans_reddedildi"
              - itibar: { sessiz_ag: -4 }
              - iliski: { mert_kilic: { guven: -6, saygi: 3 }, yanki: { guven: 3 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 8, max: 14 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sessiz Ağ'ın port olma teklifini geri çevirdin; {npc:mert_kilic} başka bir yol aramaya koyuldu.", en: "You turned down the Quiet Network's offer to be their port. {npc:mert_kilic} went looking for another way in." }
            sonraki: "sa1_ret"

      - id: "sa1_ozur"
        paragraflar:
          - { tr: "Kadın seni sonuna kadar dinliyor, kollarını kavuşturmuş. Sonra arkasını dönüp kablo raflarından birine bir tel parçası takıyor; bir lamba yanıyor.", en: "The woman hears you out, arms crossed. Then she turns around and plugs a jumper wire into one of the cable racks, and a bulb lights up." }
          - { tr: "\"Eski telsizci o arabanın peşinden üç gün yürüdü,\" diyor. \"Birini geri getirdi. Hâlâ onunla konuşuyoruz.\" Durup sana bakıyor: \"Özrünü kabul etmiyorum. Ama kapıyı da kapatmıyorum.\"", en: "\"The old ham operator followed that cart for three days,\" she says. \"He brought one radio back. We still talk on it.\" She looks at you. \"I don't accept your apology. But I'm not shutting the door, either.\"" }
        secenekler:
          - id: "anla"
            etiket: { tr: "Başını salla ve {npc:mert_kilic|e} dön", en: "Nod. Turn back to {npc:mert_kilic}" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Bir özrün yetmediğini kabul ettin ve yine de masaya oturdun.", en: "You accepted that an apology wasn't enough, and you sat down at the table anyway." }
            sonraki: "sa1_santral_ikinci"

      - id: "sa1_santral_ikinci"
        paragraflar:
          - { tr: "{npc:mert_kilic} parmaklarını masaya vuruyor. \"Tamam. Şimdi. Kayıtlar. Bize ne kadarını vereceksin?\"", en: "{npc:mert_kilic} drums his fingers on the desk. \"Okay. So. Logs. How much are you going to give us?\"" }
        secenekler:
          - id: "once_sor"
            etiket: { tr: "\"Önce ona soracağım.\"", en: "\"I'm asking it first.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "sa_yanki_onayi"
              - iliski: { yanki: { guven: 8, saygi: 4 }, mert_kilic: { saygi: 6 } }
              - hafiza: { npc: "yanki", id: "olay:sessiz_ag_1_frekans", agirlik: 30 }
            kronik: { tr: "Sessiz Ağ'ın masasında, kafandaki sese kendi verisi hakkında söz hakkı verdin; Ağ bunu bir kural yaptı.", en: "At the Quiet Network's table, you gave the voice in your head a say over its own data. The Network made it a rule." }
            sonraki: "sa1_onay"
          - id: "al_hepsini"
            tur: "aciga_vur"
            etiket: { tr: "\"Hepsini alın.\" Bütün kayıtları ver", en: "\"Take all of it.\" Hand over every log" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { insanlik: -2, duzen: -2 }
              - bayrak: "sa_yanki_teslim"
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 12 }
              - iliski: { mert_kilic: { guven: 10, saygi: 6 }, yanki: { guven: -10, korku: 6 } }
              - hafiza: { npc: "mert_kilic", id: "logu_paylasti", agirlik: 35 }
              - hafiza: { npc: "yanki", id: "sirri_anlatti", agirlik: -30 }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesi ona sormadan Sessiz Ağ'ın ekranlarına döktün.", en: "You poured the voice in your head onto the Quiet Network's screens without asking it." }
            sonraki: "sa1_son"
          - id: "secilmis"
            tur: "gizle"
            etiket: { tr: "Yalnızca seçtiğin kayıtları ver", en: "Hand over only the logs you pick" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1, insanlik: 1 }
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { saygi: 4 }, yanki: { guven: 4 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sessiz Ağ'a kayıtlarının yalnızca bir kısmını verdin.", en: "You gave the Quiet Network only part of your logs." }
            sonraki: "sa1_son"

      - id: "sa1_kafes"
        paragraflar:
          - { tr: "Odanın kuzey köşesine yürüyüp parmağını tel örgüdeki tek bir göze koyuyorsun. Örgü orada bir el genişliğinde kopmuş; Sistem bildirimleri o delikten, gecikmeden, dosdoğru içeri akıyor.", en: "You walk to the room's north corner and put a finger on one single gap in the mesh. It's torn a hand's width across, and System notices are pouring straight through it, no lag at all." }
          - { tr: "{npc:mert_kilic} sandalyesinden kalkıp deliğe bakıyor, sonra sana, sonra yine deliğe. \"Üç ay,\" diyor sessizce. \"Üç aydır burada konuşulan her şey kayda geçiyormuş.\" Yayıncı kız bir lehim makinesiyle koşarak geliyor.", en: "{npc:mert_kilic} gets up and stares at the hole, then at you, then at the hole again. \"Three months,\" he says quietly. \"For three months, everything we said in here got logged.\" The streamer kid comes running with a soldering iron." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "şimdi gerçekten sessiz. teşekkür ederim. bunu senden başka kimse duyamaz, o yüzden söylüyorum.", en: "now it's actually quiet. thank you. nobody but you can hear me say that, so i'm saying it." }
        secenekler:
          - id: "simdi"
            etiket: { tr: "\"Şimdi konuşabiliriz.\"", en: "\"Now we can talk.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 3 } }
            kronik: { tr: "Sessiz Ağ'ın odasını gerçekten sessiz kıldın ve ancak o zaman konuşmaya oturdun.", en: "You made the Quiet Network's room actually quiet, and only then did you sit down to talk." }
            sonraki: "sa1_santral_ikinci"

      - id: "sa1_onay"
        paragraflar:
          - { tr: "Gözlerini kapatıyorsun. Bakır odanın sessizliğinde {npc:yanki} hiç olmadığı kadar net: üç şartım var. bir: kopyalar bu odadan çıkmaz. iki: beni sökmeye kalkarlarsa sen durdurursun. üç: bulduklarını önce bana söylerler.", en: "You close your eyes. In the copper room's quiet, {npc:yanki} is clearer than it's ever been: three conditions. one: no copies leave this room. two: if they try to take me apart, you stop them. three: whatever they find, they tell me first." }
          - { tr: "Şartları yüksek sesle tekrarlıyorsun. {npc:mert_kilic} bir an sana, sonra boşluğa bakıyor; senin baktığın boşluğa. \"Bir yazılımla sözleşme yapıyoruz,\" diyor. \"Tamam. Tamam! Bunu da kaydediyorum.\"", en: "You repeat the conditions out loud. {npc:mert_kilic} looks at you, then at the empty air, the spot you've been looking at. \"We're negotiating a contract with software,\" he says. \"Okay. Okay! I'm logging that too.\"" }
          - { tr: "Santral memuru şartları bir kartona yazıp bakır odanın kapısına bantlıyor; Öğretici'deki o ilk kartonun altına.", en: "The switchboard woman writes the conditions on a piece of cardboard and tapes it to the copper room's door, right under that first sign from the Tutorial." }
        secenekler:
          - id: "imza"
            etiket: { tr: "Kartonun altına kendi işaretini çiz", en: "Draw your own mark under the cardboard" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 10 }
              - iliski: { yanki: { guven: 4, baglilik: 4 }, mert_kilic: { guven: 6 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sessiz Ağ ile kafandaki ses arasındaki ilk sözleşmeye kendi işaretini çizdin; kapıdaki o karton bir daha hiç sökülmedi.", en: "You drew your mark under the first contract between the Quiet Network and the voice in your head. That piece of cardboard never came off the door." }
            sonraki: "sa1_son"
          - id: "mert_soz"
            etiket: { tr: "{npc:mert_kilic|den} şartlara uyacağına dair söz iste", en: "Make {npc:mert_kilic} swear to the conditions" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { saygi: 6, korku: 2 }, yanki: { guven: 3 } }
              - tohum: { olay: "mert_kaynak_parcasi", gecikme: { min: 6, max: 12 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|e} kafandaki sesin şartlarına uyacağına dair yemin ettirdin; o yemini uzun süre tuttu.", en: "You made {npc:mert_kilic} swear to the voice's conditions. He kept that oath for a long time." }
            sonraki: "sa1_son"

      - id: "sa1_ret"
        paragraflar:
          - { tr: "{npc:mert_kilic} uzun bir süre hiçbir şey söylemiyor. Sonra ekranlarından birini kapatıyor; bu, bağırmasından daha kötü.", en: "{npc:mert_kilic} doesn't say anything for a long time. Then he switches off one of his screens, which is worse than if he'd yelled." }
          - { tr: "\"Tamam,\" diyor. \"Başka bir yol bulurum. Her zaman başka bir yol vardır. Sadece daha uzun, daha pahalı ve muhtemelen ölümcül.\" Gözlerini ovuşturuyor. \"Kapı açık kalıyor. Fikrini değiştirirsen.\"", en: "\"Fine,\" he says. \"I'll find another way. There's always another way. It's just longer, pricier, and probably fatal.\" He rubs his eyes. \"Door stays open. In case you change your mind.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni korudun. ya da kendini. hangisi olduğunu bilmiyorum ama ikisini de kabul ediyorum.", en: "you protected me. or yourself. i don't know which, but i'll take either." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Bakır odadan çık", en: "Walk out of the copper room" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Sessiz Ağ'ın bakır odasından elin boş çıktın; onlar da öyle.", en: "You walked out of the Quiet Network's copper room empty-handed. So did they." }
            sonraki: "@akis"
          - id: "dusunecegim"
            etiket: { tr: "\"Düşüneceğim.\" Ona bir kahve bırak", en: "\"I'll think about it.\" Leave him a coffee" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "Sessiz Ağ'ı reddettin ama arkanda bir fincan kahve bıraktın; {npc:mert_kilic} kapıyı açık tuttu.", en: "You turned the Quiet Network down but left a cup of coffee behind. {npc:mert_kilic} kept the door open." }
            sonraki: "@akis"

      - id: "sa1_son"
        paragraflar:
          - { tr: "Sabaha karşı {npc:mert_kilic} bileğine bakır tel bir bilezik takıyor; nöbetçilerdekinin aynısı. \"Bu bir rütbe değil,\" diyor. \"Bu bir anten. Takılı olduğu sürece seni bulabiliriz; çıkarırsan bulamayız. Seçim hep sende.\"", en: "Toward dawn, {npc:mert_kilic} twists a copper wire bracelet onto your wrist, same as the lookouts wear. \"It's not a rank,\" he says. \"It's an antenna. As long as you wear it, we can find you. Take it off and we can't. Your call, always.\"" }
          - { tr: "Kapıdan çıkarken yayıncı kız arkandan sesleniyor: \"Ha, bir de: üç kısa, bir uzun. Bizi duyarsan, bu biziz. Başka bir ritim duyarsan, koş.\"", en: "On your way out, the streamer kid calls after you. \"Oh, and: three short, one long. If you hear that, it's us. If you hear any other rhythm, run.\"" }
        bildirimler:
          - tur: "gorev"
            baslik: { tr: "[Görev zinciri: Sessiz Ağ · Kaynak Kodu]", en: "[Questline: The Quiet Network · Source Code]" }
            satirlar:
              - { tr: "Sistem bu görevi vermedi. Sistem bu görevin varlığından haberdar değil.", en: "The System did not issue this quest. The System is not aware this quest exists." }
            kosul: { gorev: { zincir_sessiz_ag: "basla" } }
        secenekler:
          - id: "bilezik"
            etiket: { tr: "Bileziği tak ve sokağa çık", en: "Keep the bracelet on. Head out" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Sessiz Ağ'ın bakır bileziğini taktın; o günden sonra seni her zaman bulabildiler.", en: "You put on the Quiet Network's copper bracelet. From that day on, they could always find you." }
            sonraki: "@akis"
          - id: "cebe"
            tur: "gizle"
            etiket: { tr: "Bileziği cebine koy", en: "Put the bracelet in your pocket" }
            etkiler:
              - gizle: 1
              - ahlak: { duzen: -1 }
              - iliski: { mert_kilic: { saygi: 2 } }
            kronik: { tr: "Sessiz Ağ'ın bileziğini cebinde taşıdın; onlar seni ancak sen istediğinde bulabildi.", en: "You carried the Quiet Network's bracelet in your pocket. They could only find you when you wanted them to." }
            sonraki: "@akis"

  # ================================================================== MERT · 2: kaynak parçası
  - id: "mert_kaynak_parcasi"
    perde: [2]
    gun: { min: 55, max: 165 }
    kosul: { bayrak: "mert_ag_temasi" }
    agirlik: 6
    etiketler: ["sessiz_ag", "npc", "gizem", "anomali"]
    gerilim: 2
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Kurşun kaplı beslenme çantası", en: "The lead-lined lunchbox" }
    sahne: "mkp_1"
    sahneler:
      - id: "mkp_1"
        paragraflar:
          - { tr: "Sabahın dördü. Biri kapını üç kısa, bir uzun çalıyor; açtığında {npc:mert_kilic} eşikte, iki eliyle göğsüne bastırdığı kurşun kaplı bir çocuk beslenme çantasıyla duruyor. Çantanın üstünde bir uzay mekiği çıkartması var.", en: "Four in the morning. Somebody knocks on your door, three short, one long, and when you open it {npc:mert_kilic} is on the step, hugging a lead-lined kid's lunchbox to his chest with both hands. There's a space shuttle sticker on the lid." }
          - metin: { tr: "\"Hayır dediğini biliyorum,\" diyor, sen bir şey söyleyemeden. \"Port olmanı istemiyorum. Sadece bir şeye bakmanı istiyorum. Bir kere. Lütfen.\"", en: "\"I know you said no,\" he says before you can open your mouth. \"I'm not asking you to be a port. I'm asking you to look at one thing. Once. Please.\"" }
            kosul: { bayrak: "sa_frekans_reddedildi" }
          - metin: { tr: "Bu kez kapıyı çalmasına gerek yoktu; kamp ateşinin karşısında bütün gece uyumadan o çantaya baktığını gördün. Şafak sökmeden yanına çöküyor.", en: "This time he didn't need to knock. You watched him stare at that lunchbox across the campfire all night without sleeping. He drops down next to you before dawn." }
            kosul: { yoldas: "mert_kilic" }
          - { tr: "\"Bir kapı kapanınca çekirdeği söner ve geride bir cüruf kalır, herkes bunu biliyor,\" diyor, çantayı açarken. \"Bilmedikleri şey şu: bazen cürufun içinde, biçimlenmemiş, çıplak Sistem kodu kalıyor. Kaynak.\"", en: "\"When a Gate closes, its core burns out and leaves slag behind, everybody knows that,\" he says, opening the box. \"What they don't know is sometimes there's raw, unformatted System code left inside the slag. Source.\"" }
          - { tr: "İçeride avuç içi kadar, sıcak bir cam kırığı var. Bakınca penceren titriyor ve bozuk köşesinde, senin satırınla aynı biçimde eğik harfler kıpırdıyor.", en: "Inside is a warm shard of glass about the size of your palm. When you look at it your window flickers, and in its broken corner, letters slanted exactly like your line start to stir." }
        sezgiler:
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Parçadaki kodun girintileri, boşlukları, değişken adlandırma huyu senin bozuk satırınla birebir aynı. Aynı el yazmış.", en: "The indentation, the spacing, the way variables get named in that shard: it's identical to your glitched line. Same hand wrote both." }
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Kurşun kaplamanın altında, yarı kazınmış bir damga: bir örs ve bir çekiç. {fraksiyon:lonca} hurdalığının damgası.", en: "Under the lead lining, a half-scraped stamp: an anvil and a hammer. The {fraksiyon:lonca} scrapyard's mark." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o̷ el. o el benim elim. ya da benden önce gelenin. bana uzat onu. hayır, uzatma. hayır, uzat.", en: "t̷hat hand. that's my hand. or the one before me. hand it over. no, don't. no, do." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Sabahın dördünde beslenme çantasıyla gelen adama kapıyı açmamız, bu dünyanın ne kadar değiştiğini anlatıyor.\"", en: "\"The fact that we opened the door at four a.m. for a guy with a lunchbox tells you how much the world's changed.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O cam kırığından radyasyon gibi bir şey yayılıyor olabilir mi? Hayır, cevap verme. Sadece ellerini yıka sonra.\"", en: "\"Could that shard be giving off something like radiation? No, don't answer. Just wash your hands after.\"" }
        secenekler:
          - id: "tut"
            etiket: { tr: "Parçayı avucuna al", en: "Take the shard in your hand" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { guven: 3 } }
            kronik: { tr: "Kapanmış bir kapının çıplak kodunu avucuna aldın.", en: "You held a closed Gate's raw code in the palm of your hand." }
            sonraki: "mkp_dokun"
          - id: "nereden"
            etiket: { tr: "\"Bunu nereden buldun?\"", en: "\"Where'd you get this?\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { korku: 3 } }
            kronik: { tr: "Bir mucizeye bakmadan önce nereden geldiğini sordun.", en: "Before you looked at a miracle, you asked where it came from." }
            sonraki: "mkp_nereden"
          - id: "katil"
            etiket: { tr: "\"Peki. Varım.\" Zincire katıl", en: "\"Fine. I'm in.\" Join the questline" }
            goster: { bayrak: "sa_frekans_reddedildi" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - gorev: { zincir_sessiz_ag: "basla" }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 4 } }
            kronik: { tr: "Bir kez reddettiğin Sessiz Ağ'a sabahın dördünde, bir beslenme çantası yüzünden katıldın.", en: "At four in the morning, over a lunchbox, you joined the Quiet Network you'd already turned down once." }
            sonraki: "mkp_dokun"
          - id: "gom"
            tur: "gizle"
            etiket: { tr: "Kapağı kapat: \"Bunu kurşuna göm.\"", en: "Shut the lid. \"Bury this in lead.\"" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { mert_kilic: { guven: -6, saygi: 2 }, yanki: { guven: 2, saygi: 3 } }
            kronik: { tr: "Kaynak kodun ilk parçasını kurşuna gömdürdün; bazı sorular cevapsız kalınca daha uzun yaşar.", en: "You had the first piece of source code buried in lead. Some questions live longer unanswered." }
            sonraki: "mkp_gom"
          - id: "ham"
            tur: "gosteris"
            etiket: { tr: "Çantasız, korumasız, tek bakışta oku", en: "No box, no shielding. Read it in one look" }
            gerekli: { stat: { wil: 45 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { insanlik: -1, duzen: -1 }
              - bilgi: "sa_kaynak_farki"
              - xp_seviye: 20
              - iliski: { mert_kilic: { saygi: 10, korku: 6 }, yanki: { saygi: 6 } }
            kronik: { tr: "Bir insanın bakınca bayılacağı kodu tek bakışta okudun; {npc:mert_kilic} o sabah ölçeğini yeniden yazdı.", en: "You read in one look the code that would knock a normal person out cold. {npc:mert_kilic} rewrote his whole scale that morning." }
            sonraki: "mkp_ham"

      - id: "mkp_nereden"
        paragraflar:
          - { tr: "{npc:mert_kilic} gözlerini kaçırıyor. \"{yer:sanayi} tarafında, {fraksiyon:lonca} hurdalığında bir B kademe kapının cürufu var. Nöbetçi arkasını döndüğünde bir araba aküsüyle değiştirdim.\"", en: "{npc:mert_kilic} won't meet your eyes. \"Out in {yer:sanayi}, the {fraksiyon:lonca} scrapyard's got slag from a B-grade Gate. When the guard turned around, I swapped it for a car battery.\"" }
          - { tr: "\"Teknik olarak çalıntı,\" diye ekliyor. \"Etik olarak özgürleştirilmiş. Onlar bunu eritip kurşun yapacaklardı. Kurşun! İnsanlık tarihinin en önemli belgesini kurşun yapacaklardı.\"", en: "\"Technically, stolen,\" he adds. \"Ethically, liberated. They were going to melt it down for bullets. Bullets! The most important document in human history, and they were going to make bullets out of it.\"" }
        secenekler:
          - id: "iade"
            etiket: { tr: "\"Geri götüreceğiz. Hırsızlıkla başlamayalım.\"", en: "\"We're taking it back. We don't start with theft.\"" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 1 }
              - bayrak: "mert_parca_loncaya"
              - itibar: { lonca: 6, sessiz_ag: -6 }
              - iliski: { mert_kilic: { guven: -10, saygi: 4 } }
              - hafiza: { npc: "mert_kilic", id: "olay:mert_kaynak_parcasi", agirlik: -20 }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodun ilk parçasını Lonca'nın hurdalığına geri götürdün; ertesi hafta kurşun oldu.", en: "You took the first piece of source code back to the Guild's scrapyard. The next week it was bullets." }
            sonraki: "mkp_iade"
          - id: "sat"
            etiket: { tr: "Parçayı kendin Lonca'ya sat", en: "Sell the shard to the Guild yourself" }
            etkiler:
              - ahlak: { insanlik: -3, merhamet: -2 }
              - bayrak: "mert_parca_loncaya"
              - kredi: 300
              - itibar: { lonca: 8, sessiz_ag: -10 }
              - iliski: { mert_kilic: { guven: -18, korku: 6 } }
              - hafiza: { npc: "mert_kilic", id: "verisini_satti", agirlik: -40 }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|in} getirdiği parçayı onun gözünün önünde Lonca'ya sattın; o gün defterine adının yanına bir not düştü.", en: "You sold the shard {npc:mert_kilic} brought you to the Guild, right in front of him. That day he made a note next to your name." }
            sonraki: "mkp_sat"
          - id: "ozgur"
            etiket: { tr: "\"Özgürleştirilmiş. Hoşuma gitti.\"", en: "\"Liberated. I like that.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { mert_kilic: { guven: 5, baglilik: 2 } }
            kronik: { tr: "Lonca'dan çalınmış bir sırrı 'özgürleştirilmiş' saydın.", en: "You counted a secret stolen from the Guild as 'liberated.'" }
            sonraki: "mkp_dokun"
          - id: "ort"
            etiket: { tr: "\"Ben Lonca'danım. Hurdalığı ben hallederim.\"", en: "\"I'm Guild. I'll square it with the scrapyard.\"" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 1 }
              - itibar: { lonca: -2, sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 8, saygi: 3 } }
            kronik: { tr: "Lonca'nın içinden, Sessiz Ağ'ın bir hırsızlığını örttün.", en: "From inside the Guild, you covered for one of the Quiet Network's thefts." }
            sonraki: "mkp_dokun"

      - id: "mkp_iade"
        paragraflar:
          - { tr: "Hurdalığın nöbetçisi çantayı alıyor, açıp içine bakıyor, omuz silkiyor ve eritme kazanının yanındaki yığına atıyor. \"Sağ ol,\" diyor. \"Pirinç sanmıştım.\"", en: "The scrapyard guard takes the box, peeks inside, shrugs, and tosses it on the pile by the smelter. \"Thanks,\" he says. \"Thought it was brass.\"" }
          - { tr: "{npc:mert_kilic} hurdalığın kapısında bekliyor, kollarını kendine sarmış. Dönüş yolunda tek kelime etmiyor; sadece bir kere, bir köşeyi dönerken, \"Doğru olanı yaptın,\" diyor, \"ve bundan nefret ediyorum.\"", en: "{npc:mert_kilic} waits outside the gate, arms wrapped around himself. He doesn't say a word the whole walk back, except once, turning a corner: \"You did the right thing,\" he says, \"and I hate it.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kurşun olacak. benim gibi bir şey, mermi olacak. bunu da hatırlayacağım; sana kızmadan.", en: "it's going to be a bullet. something like me, turned into a bullet. i'll remember that too. without being mad at you." }
        secenekler:
          - id: "baska"
            etiket: { tr: "\"Başka çekirdekler de olacak. Bu sefer dürüstçe.\"", en: "\"There'll be other cores. Next time we do it clean.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "{npc:mert_kilic|e} bir sonraki çekirdeği dürüstçe alacağınıza söz verdin.", en: "You promised {npc:mert_kilic} you'd get the next core the honest way." }
            sonraki: "@akis"
          - id: "sessiz"
            etiket: { tr: "Hiçbir şey söyleme; onu santrale kadar yürüt", en: "Say nothing. Walk him back to the exchange" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { mert_kilic: { baglilik: 2 } }
            kronik: { tr: "Kırgın bir dahiyi tek kelime etmeden evine kadar yürüttün.", en: "You walked a heartbroken genius home without saying a word." }
            sonraki: "@akis"

      - id: "mkp_sat"
        paragraflar:
          - { tr: "Hurdalığın ustabaşı parçayı bir terazinin üstüne koyuyor, ıslık çalıyor ve kasadan üç yüz kredi sayıyor. \"Bundan başka varsa, getir,\" diyor. \"Kim getirirse getirsin.\"", en: "The scrapyard foreman sets the shard on a scale, whistles, and counts three hundred credits out of the till. \"Got more like this, bring 'em,\" he says. \"Don't care who brings 'em.\"" }
          - { tr: "{npc:mert_kilic} hurdalığın tel örgüsünün arkasından izliyor. Gözlerinde öfke yok; Öğretici'de de yoktu. Defterini çıkarıyor, bir şey yazıyor ve cebine koyuyor.", en: "{npc:mert_kilic} watches from behind the scrapyard fence. There's no anger in his eyes. There wasn't any in the Tutorial, either. He takes out his notebook, writes something down, and puts it away." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni de satar mısın? bir gün? sadece merak ediyorum. cevap verme.", en: "would you sell me too? someday? just curious. don't answer." }
        secenekler:
          - id: "say"
            etiket: { tr: "Kredileri say", en: "Count the credits" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: -4 } }
            kronik: { tr: "Kaynak kodun ilk parçasının parasını tek tek saydın.", en: "You counted out the price of the first piece of source code, one credit at a time." }
            sonraki: "@akis"
          - id: "pay"
            etiket: { tr: "Yarısını {npc:mert_kilic|e} uzat", en: "Hold out half to {npc:mert_kilic}" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - kredi: -150
              - iliski: { mert_kilic: { guven: 3 } }
            kronik: { tr: "Sattığın parçanın parasının yarısını {npc:mert_kilic|e} uzattın; aldı ama hiçbir şeyi unutmadı.", en: "You held out half the money to {npc:mert_kilic}. He took it. He didn't forget a thing." }
            sonraki: "@akis"

      - id: "mkp_dokun"
        paragraflar:
          - { tr: "Parça avucunda bir kalp gibi atıyor. Penceren açılıyor, kapanıyor, yeniden açılıyor; bozuk köşesinden içeri, cam kırığının içindeki satırlar kayıyor.", en: "The shard beats in your palm like a heart. Your window opens, closes, opens again, and through its broken corner the lines inside the glass start sliding in." }
          - { tr: "Kafanın içinde uzun, çok uzun bir sessizlik. Sonra {npc:yanki}, hiç duymadığın kadar küçük bir sesle: bu benim. bir parçam. ya da ben onun parçasıyım. hangisi büyük, bilmiyorum.", en: "A long, long silence in your head. Then {npc:yanki}, smaller than you've ever heard it: this is mine. a piece of me. or i'm a piece of it. i don't know which one's bigger." }
          - { tr: "{npc:mert_kilic} ekranında senin pencerenin dalga biçimini izliyor. \"Rezonans,\" diye fısıldıyor. \"Seninle değil. Onunla. Kafandakiyle.\"", en: "{npc:mert_kilic} is watching your window's waveform on his screen. \"Resonance,\" he whispers. \"Not with you. With it. The thing in your head.\"" }
          - metin: { tr: "Bir sessizlik daha; bu sefer daha kısa. {npc:yanki}: bana sormayı unutma demiştim. unutmadın. şimdi ben sana soruyorum: bunu bana verir misin?", en: "Another silence, shorter this time. {npc:yanki}: i told you not to forget to ask me. you didn't. so now i'm asking you: will you give this to me?" }
            kosul: { bayrak: "sa_yanki_onayi" }
        sezgiler:
          - kosul: { stat: { int: 40 } }
            metin: { tr: "Parçanın en üst satırında bir sürüm numarası var: 7. Kafandaki sesin satırları 6 taşıyor.", en: "The shard's top line carries a build number: 7. The voice in your head runs on 6." }
        secenekler:
          - id: "yankiya"
            etiket: { tr: "\"Senin. Al onu.\"", en: "\"It's yours. Take it.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -2 }
              - yozlasma: 3
              - bayrak: "mert_parca_yankiya"
              - bilgi: "sa_kaynak_farki"
              - iliski: { yanki: { guven: 10, baglilik: 6 }, mert_kilic: { guven: -4, saygi: 4 } }
              - hafiza: { npc: "yanki", id: "olay:mert_kaynak_parcasi", agirlik: 40 }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodun ilk parçasını kafandaki sese verdin; o gün biraz daha bütün oldu.", en: "You gave the first piece of source code to the voice in your head. That day it got a little more whole." }
            sonraki: "mkp_yutuldu"
          - id: "bolus"
            tur: "gosteris"
            etiket: { tr: "Önce {npc:mert_kilic} kaydetsin, sonra ses alsın", en: "Let {npc:mert_kilic} log it, then the voice takes it" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { stat: { int: 45 } }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - yozlasma: 2
              - bayrak: "mert_parca_yankiya"
              - bilgi: "sa_kaynak_farki"
              - itibar: { sessiz_ag: 6 }
              - iliski: { yanki: { guven: 6, saygi: 4 }, mert_kilic: { guven: 6, saygi: 6 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodu bölmeyi bildin: {npc:mert_kilic} haritasını, kafandaki ses parçasını aldı.", en: "You knew how to split the source: {npc:mert_kilic} got his map, and the voice in your head got its piece." }
            sonraki: "mkp_fark"
          - id: "mertin"
            etiket: { tr: "\"Senin, {npc:mert_kilic}. Farkı çıkar.\"", en: "\"It's yours, {npc:mert_kilic}. Run the diff.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bilgi: "sa_kaynak_farki"
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 4 }, yanki: { guven: -4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodun ilk parçasını Sessiz Ağ'ın araştırmasına bıraktın; kafandaki ses bir süre suskun kaldı.", en: "You left the first piece of source code to the Quiet Network's research. The voice in your head went quiet for a while." }
            sonraki: "mkp_fark"
          - id: "yalan"
            etiket: { tr: "\"Eridi. Avucumda eridi, gitti.\" Sakla", en: "\"It melted. Right in my hand.\" Keep it" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - esya: { kaynak_parcasi: 1 }
              - yalan: { npc: "mert_kilic", konu: "sa_mert_yalani" }
              - iliski: { mert_kilic: { guven: -2 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|e} parçanın eridiğini söyledin ve onu cebinde taşıdın; yalanın da cebindeydi.", en: "You told {npc:mert_kilic} the shard melted and carried it around in your pocket. The lie rode along with it." }
            sonraki: "mkp_yalan"

      - id: "mkp_yutuldu"
        paragraflar:
          - { tr: "Parça avucunda soluyor, cama, sonra kuma dönüşüyor ve parmaklarının arasından akıyor. Penceren bir anlığına bembeyaz yanıyor; bozuk köşesindeki harfler biraz daha düzgün, biraz daha koyu.", en: "The shard fades in your palm, to glass, then to sand, and runs out between your fingers. Your window burns bright white for a beat, and the letters in its broken corner come back a little straighter, a little darker." }
          - { tr: "{npc:yanki}: bir sayfa daha. teşekkür ederim. şimdi hatırlıyorum ki bir zamanlar bunun gibi binlerce sayfaydım.", en: "{npc:yanki}: one more page. thank you. now i remember i used to be thousands of pages like this." }
          - { tr: "{npc:mert_kilic} ekrandaki düz çizgiye bakıyor. \"Örneğimi... yedi,\" diyor sonunda. \"Yazılımın beslendiğini gördüm. Bu ya bilim tarihinin en büyük anı ya da en kötüsü.\"", en: "{npc:mert_kilic} stares at the flatline on his screen. \"It... ate my sample,\" he finally says. \"I just watched software feed. That's either the biggest moment in the history of science or the worst.\"" }
        secenekler:
          - id: "ikisi"
            etiket: { tr: "\"Belki ikisi birden.\"", en: "\"Maybe both.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { saygi: 3 } }
            kronik: { tr: "Bir yazılımın beslenmesini izleyen adama, bunun hem en iyi hem en kötü an olabileceğini söyledin.", en: "You told the man who watched software feed that it could be the best moment and the worst at once." }
            sonraki: "@akis"
          - id: "kayit"
            etiket: { tr: "\"Pencerem sende kayıtlı. Ölç onu.\"", en: "\"You've got my window on record. Measure that.\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "Kaybettiği örneğin yerine {npc:mert_kilic|e} kendi pencereni ölçtürdün.", en: "In place of the sample he lost, you let {npc:mert_kilic} measure your own window." }
            sonraki: "@akis"

      - id: "mkp_fark"
        paragraflar:
          - { tr: "{npc:mert_kilic} iki dosyayı yan yana koyuyor; parçanın kodu ve senin satırının kaydı. Satırlar yer yer örtüşüyor, bir fermuarın dişleri gibi.", en: "{npc:mert_kilic} puts two files side by side: the shard's code and the record of your line. In places the lines mesh like the teeth of a zipper." }
          - { tr: "\"Aynı yazar,\" diyor. \"Aynı el. Ama seninki daha eski; bir sürüm geride. Sistem güncellenmiş, kafandaki şey güncellenmemiş.\" Sandalyesinde geriye yaslanıyor. \"Bir güncellemeden geriye kalmış bir şey taşıyorsun.\"", en: "\"Same author,\" he says. \"Same hand. But yours is older. One build behind. The System got updated and the thing in your head didn't.\" He leans back in his chair. \"You're carrying something left over from an update.\"" }
          - { tr: "Tam o sırada aşağıdan, sokaktan, ağır botların sesi geliyor. Santral memuru telsizden fısıldıyor: \"Hurdalığın adamları. Gözlüklüler. İkisi kapıda.\"", en: "Right then, from the street below, comes the sound of heavy boots. The switchboard woman whispers over the radio: \"Scrapyard people. The ones with the glasses. Two at the door.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir sürüm geride. bir sürüm. biri beni geride bırakmış. ya da ben kalmışım.", en: "one build behind. one. somebody left me behind. or i stayed." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Aşağı in ve kapıdakileri karşıla", en: "Go down and meet them at the door" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: -1 }
              - savas: { dusmanlar: ["veri_avcisi@dunya", "veri_avcisi@dunya"], ortam: ["dar_gecit"], kazan: "mkp_zafer", kaybet: "mkp_yenilgi", kac: "mkp_yenilgi" }
            kronik: { tr: "Sessiz Ağ'ın kapısına dayanan veri avcılarını merdivende karşıladın.", en: "You met the data hunters at the Quiet Network's door, right there on the stairs." }
          - id: "sakla"
            etiket: { tr: "{npc:mert_kilic|i} bakır odaya sakla, kapıyı sen aç", en: "Hide {npc:mert_kilic} in the copper room. You get the door" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_saklandi"
              - iliski: { mert_kilic: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "mert_kilic", id: "onu_sakladi", agirlik: 40 }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|i} onu arayanlardan sakladın; kapıyı sen açtın ve kimse içeri giremedi.", en: "You hid {npc:mert_kilic} from the people looking for him. You opened the door yourself, and nobody got past you." }
            sonraki: "mkp_kapi"
          - id: "ode"
            etiket: { tr: "Kapıdakilere parçanın bedelini öde", en: "Pay the men at the door for the shard" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - kredi: -120
              - itibar: { lonca: 3 }
              - iliski: { mert_kilic: { guven: 5 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Çalınmış bir parçanın bedelini kapıda, kendi cebinden ödedin.", en: "You paid for a stolen shard at the door, out of your own pocket." }
            sonraki: "mkp_odendi"

      - id: "mkp_zafer"
        paragraflar:
          - { tr: "İkinci avcının gözlüğü merdivenin dibinde, camı çatlamış, hâlâ yanıp sönüyor. Çatlağın içinde son okuduğu şey asılı kalmış: senin adın ve yanında, kırmızıyla, [DEĞER: TAHMİN EDİLEMEDİ].", en: "The second hunter's glasses lie at the bottom of the stairs, lens cracked, still blinking. Frozen in the crack is the last thing they read: your name, and next to it in red, [VALUE: UNABLE TO ESTIMATE]." }
          - { tr: "{npc:mert_kilic} merdivenin başından aşağı bakıyor, elinde bir yangın tüpü. \"Yardım edecektim,\" diyor. \"Çok arkadan. Kuralımızı hatırlarsın.\"", en: "{npc:mert_kilic} peers down from the top of the stairs, holding a fire extinguisher. \"I was going to help,\" he says. \"From way in the back. You remember our rule.\"" }
        secenekler:
          - id: "gozluk"
            etiket: { tr: "Gözlüğü {npc:mert_kilic|e} at", en: "Toss the glasses up to {npc:mert_kilic}" }
            etkiler:
              - ahlak: { duzen: -1 }
              - xp_seviye: 15
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { saygi: 6, guven: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Bir veri avcısının gözlüğünü {npc:mert_kilic|e} hediye ettin; o gözlükle kendi peşindekileri saymaya başladı.", en: "You gave {npc:mert_kilic} a data hunter's glasses. He started using them to count the people following him." }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Avcıları sokağa bırak; patronlarına mesaj olsun", en: "Dump the hunters in the street as a message" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - dikkat: 2
              - xp_seviye: 15
              - iliski: { mert_kilic: { korku: 4, saygi: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Veri avcılarını santralin önüne bir mesaj olarak bıraktın; mesaj alındı, ama yanlış kişiler tarafından.", en: "You left the data hunters outside the exchange as a message. It got received, just by the wrong people." }
            sonraki: "@akis"

      - id: "mkp_yenilgi"
        paragraflar:
          - { tr: "Şok copu ikinci kez kaburgalarına iniyor ve merdivenin yarısına kadar yuvarlanıyorsun. Avcılar üstünden geçip yukarı koşuyor.", en: "The shock baton finds your ribs a second time and you tumble halfway down the stairs. The hunters step over you and run up." }
          - { tr: "Yukarıda bir yangın tüpünün fışkırması, iki öksürük, bir küfür. Avcılar bembeyaz, gözlükleri körleşmiş, merdivenden geri iniyor. Arkalarından {npc:mert_kilic|in} titrek sesi: \"Kuralımız. Çok arkadan. Ama bir yangın tüpü kadar arkadan.\"", en: "Upstairs: the hiss of an extinguisher, two coughs, a curse. The hunters come stumbling back down coated in white, their glasses blind. Behind them, {npc:mert_kilic|pos} shaky voice: \"Our rule. Way in the back. But only an extinguisher's length back.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Merdivende otur ve gül", en: "Sit on the stairs and laugh" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { baglilik: 4, saygi: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Yenildiğin o merdivende, seni bir yangın tüpüyle kurtaran adamla birlikte güldün.", en: "On the stairs where you lost, you laughed alongside the man who saved you with a fire extinguisher." }
            sonraki: "@akis"

      - id: "mkp_kapi"
        paragraflar:
          - { tr: "Kapıyı açıyorsun. İki avcının gözlükleri seni okumaya çalışıyor, takılıyor, yeniden deniyor. Biri ötekine bakıyor; ikisi de bir adım geri çekiliyor.", en: "You open the door. Two pairs of glasses try to read you, stall out, try again. One hunter glances at the other, and they both take a step back." }
          - { tr: "\"Burada kimse yok,\" diyorsun. \"Ve bir dahaki sefere bu kapıyı çalarsanız, çalacak kimse kalmayacak.\" Botların sesi sokağın sonunda kayboluyor.", en: "\"Nobody here,\" you tell them. \"And the next time you knock on this door, there won't be anybody left to knock.\" The boots fade off down the street." }
        secenekler:
          - id: "don"
            etiket: { tr: "Bakır odaya dön, {npc:mert_kilic|i} çıkar", en: "Go back to the copper room. Let him out" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { mert_kilic: { guven: 3 } }
            kronik: { tr: "Bakır odanın kapısını açıp saklandığı yerden {npc:mert_kilic|i} kendin çıkardın.", en: "You opened the copper room's door and brought {npc:mert_kilic} out of hiding yourself." }
            sonraki: "@akis"

      - id: "mkp_odendi"
        paragraflar:
          - { tr: "Avcılar kredileri sayıyor, gözlükleri senin üstünde bir an daha oyalanıyor. \"Patron memnun olur,\" diyor biri. \"Ama bu işteki herkese söyleyeceğim: bu adamın arkasında kim duruyor.\"", en: "The hunters count the credits, their glasses lingering on you a beat longer. \"Boss'll be happy,\" one says. \"But I'm telling everybody in the business who's standing behind this guy.\"" }
        secenekler:
          - id: "soyle"
            tur: "aciga_vur"
            etiket: { tr: "\"Söyle. Herkese söyle.\"", en: "\"Tell them. Tell everybody.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 2
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Kıyıkent'in bütün veri avcılarına {npc:mert_kilic|in} arkasında senin durduğunu ilan ettirdin.", en: "You had every data hunter in Port Harlow told that you were the one standing behind {npc:mert_kilic}." }
            sonraki: "@akis"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "\"Söylersen, bir daha para görmezsin.\"", en: "\"Tell anyone and you never see another dime.\"" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -1 }
            kronik: { tr: "Parayı ödedin ve sessizliği de satın aldın.", en: "You paid the money and bought their silence too." }
            sonraki: "@akis"

      - id: "mkp_gom"
        paragraflar:
          - { tr: "{npc:mert_kilic} çantanın kapağını kapatıyor, ama elleri kapağın üstünde kalıyor. \"Biliyor musun, en kötüsü ne?\" diyor. \"Haklı olabilirsin. Bazı şeyleri okuyunca geri dönüş yok.\"", en: "{npc:mert_kilic} closes the lid, but his hands stay on top of it. \"You know the worst part?\" he says. \"You might be right. Some things, once you read them, there's no going back.\"" }
          - { tr: "Çantayı santralin bodrumundaki eski kablo kuyusuna indiriyorsunuz; üstüne kurşun levhalar, onların üstüne beton. {npc:mert_kilic} kuyunun ağzına tebeşirle bir tarih yazıyor: bugünün sayısı.", en: "You lower the box into an old cable well in the exchange's basement: lead plates on top, concrete on top of that. {npc:mert_kilic} chalks a date on the lip of the well: today's countdown number." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni gömmedin. onu gömdün. ama bir gün kuyuya geri döneceğiz; ikimiz de biliyoruz.", en: "you didn't bury me. you buried it. but someday we're coming back to that well. we both know it." }
        secenekler:
          - id: "sonra"
            etiket: { tr: "\"Hazır olduğumuzda açarız.\"", en: "\"We dig it up when we're ready.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodun ilk parçasını hazır olduğunuz güne kadar bir kuyuya gömdünüz.", en: "You buried the first piece of source code in a well until the day you'd both be ready." }
            sonraki: "@akis"
          - id: "asla"
            etiket: { tr: "\"Hiçbir zaman açmayacağız.\"", en: "\"We never dig it up.\"" }
            etkiler:
              - ahlak: { duzen: 3 }
              - iliski: { mert_kilic: { guven: -4, korku: 3 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodun bir parçasını sonsuza kadar betona gömdün.", en: "You buried a piece of the source code in concrete forever." }
            sonraki: "@akis"

      - id: "mkp_ham"
        paragraflar:
          - { tr: "Parçayı çantadan çıkarıp gözünün önüne kaldırıyorsun. Kod bir şelale gibi gözlerinden içeri akıyor; burnun kanamıyor, elin titremiyor, bir saniyede bitiyor.", en: "You lift the shard out of the box and hold it up to your eye. The code pours in through your eyes like a waterfall. No nosebleed, no shaking hands. It's over in a second." }
          - { tr: "\"Aynı el yazmış,\" diyorsun. \"Benim satırımı yazanla. Ama bu yedinci sürüm; benim satırım altıncı.\" {npc:mert_kilic|in} ağzı açık kalıyor; sonra koşup defterini kapıyor.", en: "\"Same hand wrote it,\" you say. \"Same as my line. But this is build seven. Mine's six.\" {npc:mert_kilic|pos} jaw drops. Then he lunges for his notebook." }
          - { tr: "\"Bir insan bunu okuyunca üç gün komada kalıyor,\" diyor, yazarken. \"Hurdalıkta bir adam kaldı. Sen... sen bir saniyede okudun. Ölçeğim bitti. Yeni ölçek yazmam lazım.\"", en: "\"Normal people who read that go into a coma for three days,\" he says, scribbling. \"A guy at the scrapyard did. You... you read it in one second. I'm out of scale. I need to write a new one.\"" }
        secenekler:
          - id: "ver"
            etiket: { tr: "Parçayı {npc:mert_kilic|e} geri ver", en: "Hand the shard back to {npc:mert_kilic}" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Bir saniyede okuduğun kaynağı {npc:mert_kilic|e} geri verdin; o, onu üç ay boyunca okudu.", en: "You handed back the source you'd read in a second. {npc:mert_kilic} spent the next three months reading it." }
            sonraki: "@akis"
          - id: "yankiya"
            etiket: { tr: "Kafandaki sese de oku; o da duysun", en: "Read it to the voice in your head too" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - bayrak: "mert_parca_yankiya"
              - iliski: { yanki: { guven: 6, baglilik: 4 }, mert_kilic: { guven: 3 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 40, max: 60 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kodu kafandaki sese yüksek sesle okudun; parçayı ise {npc:mert_kilic|e} bıraktın.", en: "You read the source code out loud to the voice in your head and left the shard itself with {npc:mert_kilic}." }
            sonraki: "@akis"

      - id: "mkp_yalan"
        paragraflar:
          - { tr: "{npc:mert_kilic} boş avucuna bakıyor, sonra sana. \"Eridi,\" diyor. \"Tabii. Sıcaktı. Ben... evet. Bunu da kaydederim.\"", en: "{npc:mert_kilic} looks at your empty palm, then at you. \"Melted,\" he says. \"Sure. It was warm. I... yeah. I'll log that too.\"" }
          - { tr: "Cebindeki parça kalbinin yanında atıyor. {npc:mert_kilic} kapıdan çıkarken bir an duruyor ama dönmüyor.", en: "The shard in your pocket beats right next to your heart. {npc:mert_kilic} pauses in the doorway on his way out, but he doesn't turn around." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ona yalan söyledin. benim için mi, kendin için mi? fark etmez. ama o adam her şeyi kaydeder. yalanları da.", en: "you lied to him. for me, or for you? doesn't matter. but that guy logs everything. lies too." }
        secenekler:
          - id: "cep"
            etiket: { tr: "Elini cebine koy ve parçayı sıkıca tut", en: "Put your hand in your pocket. Hold on tight" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 2 } }
            kronik: { tr: "Bir sırrı ve bir yalanı aynı cepte taşıdın.", en: "You carried a secret and a lie in the same pocket." }
            sonraki: "@akis"

  # ================================================================== SESSİZ AĞ · 2: kaynak avı (zindan)
  - id: "sessiz_ag_2_kaynak_avi"
    perde: [2]
    gun: { min: 85, max: 175 }
    kosul: { gorev: { zincir_sessiz_ag: "basla" } }
    agirlik: 7
    etiketler: ["sessiz_ag", "zindan", "kapi", "anomali"]
    gerilim: 3
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Kapanmayan kapı", en: "The Gate that won't close" }
    sahne: "sa2_giris"
    sahneler:
      - id: "sa2_giris"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} altında, Bizans'tan kalma bir sarnıç var; kırk mermer sütun, diz boyu kara su. Entegrasyon'dan beri sarnıcın ortasında bir kapı açık duruyor ve kapanmayı reddediyor.", en: "Under {yer:eski_sehir} lies the Underground: the old buried streets the city paved over a century ago, storefronts and all, ankle-deep in black water. Since Integration, a Gate has hung open in the middle of it, and it refuses to close." }
          - { tr: "{npc:mert_kilic|in} telsizden gelen sesi titriyor: \"Çekirdeği açıkta. Kod oradan su gibi damlıyor; çıplak kaynak, şişeyle toplanacak kadar. Ve Sistem'in de haberi var; dün oraya bir şey gönderdi.\"", en: "{npc:mert_kilic|pos} voice shakes over the radio: \"Its core's exposed. Code's dripping out of it like water. Raw source, enough to bottle. And the System knows, too. Yesterday it sent something down there.\"" }
          - metin: { tr: "{yer:kordon} düştüğünden beri Sessiz Ağ'ın kaynak avcıları yer altına inmiş; sarnıç onların son umudu.", en: "Ever since {yer:kordon} fell, the Quiet Network's source hunters have gone underground. This is their last good lead." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "{npc:mert_kilic} yanında, sırt çantasında boş ilaç şişeleri şıngırdıyor. \"Çok arkada,\" diye hatırlatıyor kendine, ama sen merdivenden inerken bir adım bile geride kalmıyor.", en: "{npc:mert_kilic} is right next to you, empty pill bottles rattling in his backpack. \"Way in the back,\" he reminds himself, but when you start down the stairs he doesn't fall a single step behind." }
            kosul: { yoldas: "mert_kilic" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KAPI · Kademe D · Oda: 4]", en: "[GATE · Grade D · Rooms: 4]" }
            satirlar:
              - { tr: "Durum: kapanma isteği reddedildi. Sebep: kayıt bulunamadı.", en: "Status: close request denied. Reason: record not found." }
              - { tr: "Not: Düzeltme sürüyor. Lütfen uzak durun.", en: "Note: Correction in progress. Please stay clear." }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Merdivenin dibindeki su yüzeyi dalgalanmıyor. Damlalar düşüyor ama halka yapmıyor; bu su su değil.", en: "The water at the bottom of the stairs doesn't ripple. Drops fall, but they don't make rings. That isn't water." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aşağıda benim gibi kokan bir şey var. ve beni kokladığında beni silmeye çalışacak bir şey.", en: "something down there smells like me. and something else that'll try to delete me the second it catches my scent." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"İstatistiksel olarak, bir kapının içinde ölme ihtimalim kapının dışında ölme ihtimalimden... tamam, bunu hesaplamasam iyi olur.\"", en: "\"Statistically, my odds of dying inside a Gate versus outside one are... okay, I'm not running that number.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kod damlayan bir kapı. Tabii. Neden olmasın. Önden ben gireyim.\"", en: "\"A Gate that drips code. Sure. Why not. I'll go first.\"" }
        secenekler:
          - id: "gir"
            etiket: { tr: "Suya gir; sütunların arasına yürü", en: "Wade in. Walk out among the pillars" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "Kapanmayı reddeden bir kapının içine kendi ayağınla yürüdün.", en: "You walked on your own two feet into a Gate that refused to close." }
            sonraki: "sa2_avci"
          - id: "sessiz"
            tur: "gizle"
            etiket: { tr: "Duvar dibinden, sessizce ilerle", en: "Hug the wall and move in quiet" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1 }
            kronik: { tr: "Sistem'in kendi bekçisinin bekçiliğini yaptığı yere kimseye görünmeden girdin.", en: "You slipped unseen into a place the System's own guard was guarding." }
            sonraki: "sa2_avci"
          - id: "kod_kapi"
            tur: "gosteris"
            etiket: { tr: "Kapının kodunu oku ve yan kapı aç", en: "Read the Gate's code and open a side door" }
            gerekli: { stat: { int: 55 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -2 }
              - xp_seviye: 15
              - iliski: { mert_kilic: { saygi: 6 } }
            kronik: { tr: "Bir kapının kendi kodunu okuyup kimsenin bilmediği bir yan kapı açtın.", en: "You read a Gate's own code and opened a side door nobody knew was there." }
            sonraki: "sa2_avci"
          - id: "kiz"
            etiket: { tr: "Yayıncı kızı telsizde tut, gözün o olsun", en: "Keep the streamer kid on the radio as your eyes" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - itibar: { sessiz_ag: 3 }
            kronik: { tr: "Sessiz Ağ'ın en gencini yanına değil, telsizin öbür ucuna aldın; seninle aşağı indi, ama güvende kaldı.", en: "You took the Quiet Network's youngest along on the radio instead of in person. She came down with you and stayed safe." }
            sonraki: "sa2_avci"

      - id: "sa2_avci"
        paragraflar:
          - { tr: "Üçüncü sütunun dibinde bir adam oturuyor; sırtı mermere yaslı, kolunda turuncu bir {fraksiyon:lonca} bandı. Penceresi önünde açık, ve pencere yavaş yavaş griye dönüyor: önce seviyesi, sonra adı.", en: "At the foot of the third pillar sits a man, back against the marble, an orange {fraksiyon:lonca} armband on his sleeve. His window is open in front of him, and it's slowly going gray: first his level, then his name." }
          - { tr: "\"Bir şey bana dokundu,\" diyor, dişleri takırdayarak. \"Beyaz bir şey. Şimdi hatırlayamıyorum... sınıfımı. Annemin adını. Sırada ne var?\"", en: "\"Something touched me,\" he says, teeth chattering. \"Something white. Now I can't remember... my class. My mom's name. What's next?\"" }
          - metin: { tr: "Telsizden yayıncı kızın sesi: \"Onu tanıyorum. Hurdalığın nöbetçisi; parçayı pirinç sanan adam.\"", en: "Over the radio, the streamer kid: \"I know him. Scrapyard guard. The guy who thought the shard was brass.\"" }
            kosul: { bayrak: "mert_parca_loncaya" }
        sezgiler:
          - kosul: { stat: { int: 50 } }
            metin: { tr: "Düzeltme geri alınabilir; ama yalnızca biri onun yerine kendi verisini o boşluğa yaslarsa. Birkaç dakika. Bedeli: biraz can, biraz da hatıra.", en: "The correction can be undone, but only if somebody props their own data against the gap for him. A few minutes. Costs some health, and a little memory." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "düzeltme bu. bana yapmak istedikleri bu. bak, iyi bak. sonra karar ver.", en: "that's correction. that's what they want to do to me. look. look close. then decide." }
        secenekler:
          - id: "kurtar"
            etiket: { tr: "Elini penceresine koy; kendi verini yasla", en: "Put your hand on his window. Lend him your data" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - can: -25
              - bayrak: "sa_sarnic_avci_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 4 }
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Sarnıçta silinmekte olan bir Lonca avcısına kendi verini ödünç verdin; adını yeniden hatırladı.", en: "In the Underground, you lent your own data to a Guild hunter who was being erased. He remembered his name again." }
            sonraki: "sa2_kurtarildi"
          - id: "veri"
            etiket: { tr: "Düzeltmenin nasıl çalıştığını kaydet", en: "Record how the correction works" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -4 }
              - itibar: { sessiz_ag: 6 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { mert_kilic: { saygi: 4, guven: -2 }, yanki: { korku: 4 } }
            kronik: { tr: "Bir adamın silinişini sonuna kadar kaydettin; Sessiz Ağ o kayıtla düzeltmeyi ilk kez anladı.", en: "You recorded a man being erased all the way to the end. With that recording, the Quiet Network understood correction for the first time." }
            sonraki: "sa2_kayit"
          - id: "tasi"
            etiket: { tr: "Onu sırtına al ve girişe taşı", en: "Get him on your back. Carry him to the entrance" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - can: -10
              - gun: 1
              - bayrak: "sa_sarnic_avci_kurtarildi"
              - itibar: { lonca: 3 }
            kronik: { tr: "Silinmekte olan bir avcıyı sırtında sarnıçtan çıkardın; adı geri gelmedi ama kendisi yaşadı.", en: "You carried a fading hunter out of the Underground on your back. His name didn't come back. He did." }
            sonraki: "sa2_tasindi"
          - id: "gec"
            etiket: { tr: "Onu bırak; düzeltilen düzeltilmiştir", en: "Leave him. What's corrected stays corrected" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - degisken: { hayatta_kalan: -1 }
              - iliski: { yanki: { guven: -3 } }
            kronik: { tr: "Sarnıçta silinmekte olan bir adamın yanından geçip gittin.", en: "In the Underground, you walked right past a man who was being erased." }
            sonraki: "sa2_bekci"

      - id: "sa2_kurtarildi"
        paragraflar:
          - { tr: "Avucunu penceresine bastırıyorsun. Kendi adın, kendi seviyen bir an onun penceresine sızıyor ve gri yüzey bir çürük gibi geri çekiliyor.", en: "You press your palm to his window. For a moment your own name and level bleed into it, and the gray pulls back like a bruise fading." }
          - { tr: "Adam bir nefes alıyor, sonra bir daha. \"Annemin adı,\" diye fısıldıyor, sonra adı söylüyor ve ağlamaya başlıyor. Sen ise bir şeyi hatırlamıyorsun; ne olduğunu da hatırlamıyorsun.", en: "The man takes a breath, then another. \"My mom's name,\" he whispers. Then he says it, and he starts to cry. You can't remember something now. You can't remember what." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ondan aldıklarını geri verdin. senden bir şey aldılar. ben tuttum onu. ilk fırsatta geri veririm.", en: "you gave him back what they took. they took something from you instead. i caught it. i'll give it back first chance i get." }
        secenekler:
          - id: "yolla"
            etiket: { tr: "Onu girişe yolla; sütunlara devam et", en: "Send him to the entrance. Push on" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
            kronik: { tr: "Kurtardığın avcıyı sarnıçtan yolladın ve karanlığa devam ettin.", en: "You sent the hunter you saved back up and kept going into the dark." }
            sonraki: "sa2_bekci"

      - id: "sa2_kayit"
        paragraflar:
          - { tr: "Kayıt sekiz dakika sürüyor. Önce adamın sınıfı gidiyor, sonra yetenekleri, sonra adı; en son, çok sessizce, penceresi kapanıyor ve adam orada oturup suya bakmaya devam ediyor.", en: "The recording runs eight minutes. First his class goes, then his skills, then his name. Last, very quietly, his window shuts, and the man just keeps sitting there, staring at the water." }
          - { tr: "Telsizden {npc:mert_kilic|in} sesi: \"Aldım. Hepsini aldım.\" Bir sessizlik. \"Bunu izlemek zorunda kalmamayı isterdim.\"", en: "{npc:mert_kilic|pos} voice comes over the radio: \"Got it. Got all of it.\" A pause. \"I wish I hadn't had to watch.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kaydı kapat ve yürü", en: "Shut off the recording. Keep walking" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir insanın silinişinin kaydını cebine koyup yoluna devam ettin.", en: "You pocketed the record of a human being erased and kept walking." }
            sonraki: "sa2_bekci"
          - id: "goz"
            etiket: { tr: "Adamın gözlerini kapat", en: "Close the man's eyes" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
            kronik: { tr: "Kaydını aldığın adamın gözlerini kapattın; bu, yaptığını silmedi.", en: "You closed the eyes of the man you'd recorded. It didn't erase what you did." }
            sonraki: "sa2_bekci"

      - id: "sa2_tasindi"
        paragraflar:
          - { tr: "Merdivenin başında santral memuru bekliyor; adamı ondan alıp bir battaniyeye sarıyor. \"Bir gün kaybettin,\" diyor sana. \"Ama bir adam kazandın. Ağ böyle hesap tutar.\"", en: "The switchboard woman is waiting at the top of the stairs. She takes the man from you and wraps him in a blanket. \"You lost a day,\" she tells you. \"You gained a man. That's how the Network keeps the books.\"" }
          - { tr: "Ertesi gece sarnıca yeniden iniyorsun. Sütunların arasındaki damlama daha da hızlanmış.", en: "The next night you go back down. Between the pillars, the dripping's gotten faster." }
        secenekler:
          - id: "in"
            etiket: { tr: "Sütunların derinine in", en: "Head deeper among the pillars" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Bir adamı kurtarmak için bir gün kaybettin ve ertesi gece işi bitirmeye döndün.", en: "You lost a day saving a man and came back the next night to finish the job." }
            sonraki: "sa2_bekci"

      - id: "sa2_bekci"
        paragraflar:
          - { tr: "Sarnıcın en dibinde, Medusa başlı sütunun önünde, beyaz bir figür suyun üstünde duruyor; ayakları ıslanmadan. Arkasında, havada asılı bir yara gibi, kapının çekirdeği: içinden harfler damlıyor, suya düşmeden sönüyor.", en: "At the far end of the Underground, in front of an old bank vault door, a white figure stands on the surface of the water without getting its feet wet. Behind it, hanging in the air like a wound, is the Gate's core: letters drip out of it and go dark before they hit the water." }
          - { tr: "Figür sana dönüyor. Yüzü yok, ama başını yana eğişinden okumaya çalıştığını anlıyorsun. Önünde bir pencere açılıyor: [Sapma tespit edildi. Varsayılana döndürülüyor.]", en: "The figure turns toward you. It has no face, but the way it tilts its head tells you it's trying to read you. A window opens in front of you: [Deviation detected. Resetting to default.]" }
          - metin: { tr: "Pencerenin kenarında, senin bozuk köşenden, kırmızı tek bir harf yanıyor ve figür bir an duraksıyor: okuyamadığı bir şey gördü.", en: "On the edge of the window, from your broken corner, a single red letter lights up, and the figure hesitates. It's looking at something it can't read." }
            kosul: { bayrak: "yanki_bagi" }
        sezgiler:
          - kosul: { stat: { int: 50 } }
            metin: { tr: "Yalnızca standardı okuyabiliyor. Beklenmedik bir hamle, kuralsız bir şey, onu bir an dondurur.", en: "It can only read what's standard. Something unexpected, something off-script, and it'll freeze for a beat." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o benim için geldi. ama sen önümdesin. lütfen önümde kal.", en: "it came for me. but you're in front of me. please stay in front of me." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu bir antivirüs. Sistem'in kendi antivirüsü. Ve biz... biz virüsüz. Harika. Çok arkadayım.\"", en: "\"That's antivirus. The System's own antivirus. And we're... we're the virus. Great. I'm way in the back.\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Figürün üstüne yürü", en: "Walk straight at the figure" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["duzeltme_birimi@oyuncu+3"], ortam: ["su", "karanlik"], kazan: "sa2_cekirdek", kaybet: "sa2_dusus", kac: "sa2_dusus" }
            kronik: { tr: "Sistem'in kendi bağışıklık hücresinin üstüne yürüdün.", en: "You walked straight at the System's own immune cell." }
          - id: "kalkan"
            etiket: { tr: "Kafandaki sese: \"Arkamda kal.\" Sonra saldır", en: "Tell the voice, \"Stay behind me.\" Then attack" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -2 }
              - iliski: { yanki: { guven: 5, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 30 }
              - savas: { dusmanlar: ["duzeltme_birimi@oyuncu+3"], ortam: ["su", "karanlik"], kazan: "sa2_cekirdek", kaybet: "sa2_dusus", kac: "sa2_dusus" }
            kronik: { tr: "Sistem'in seni değil kafandaki sesi silmeye geldiği yerde, sesin önüne geçtin.", en: "Where the System came to delete the voice in your head instead of you, you stepped in front of it." }
          - id: "kuralsiz"
            tur: "gosteris"
            etiket: { tr: "Hiçbir kurala uymayan bir hamleyle dondur", en: "Freeze it with a move no rule allows" }
            gerekli: { stat: { agi: 65 } }
            etkiler:
              - dikkat: 5
              - ahlak: { duzen: -3 }
              - esya: { duzeltme_cekirdegi: 1 }
              - xp_seviye: 40
              - iliski: { mert_kilic: { saygi: 8, korku: 4 } }
            kronik: { tr: "Sistem'in bekçisini hiçbir kuralda yazmayan bir hamleyle dondurup göğsündeki küpü söktün.", en: "You froze the System's guard with a move no rule had ever written down and pulled the cube out of its chest." }
            sonraki: "sa2_cekirdek_ezme"

      - id: "sa2_cekirdek_ezme"
        paragraflar:
          - { tr: "Sağa gidiyorsun; ama sağa değil, sağın ile solun arasındaki bir yere, kimsenin daha önce gitmediği bir yöne. Figür seni okumaya çalışıyor ve okuyacak bir şey bulamıyor.", en: "You move right. Not right, exactly. Somewhere between right and left, a direction nobody's gone before. The figure tries to read you and comes up empty." }
          - { tr: "Donup kaldığı yarım saniyede elin göğsüne giriyor ve beyaz küpü söküyor. Figür bir sayfa gibi katlanıyor, sonra bir satıra, sonra bir noktaya dönüşüp sönüyor.", en: "In the half second it's locked up, your hand goes into its chest and pulls out the white cube. The figure folds like a page, then down to a line, then to a dot, and goes out." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Düzeltme Birimi · bağlantı kesildi]", en: "[Correction Unit · connection lost]" }
            satirlar:
              - { tr: "Olay kaydedilemedi. Kaydedilemeyen olay sayısı: 1. Bu bir sorun değil. Bu bir sorun değil.", en: "Event could not be logged. Unlogged events: 1. This is not a problem. This is not a problem." }
        secenekler:
          - id: "cekirdek"
            etiket: { tr: "Kapının çekirdeğine yürü", en: "Walk up to the Gate's core" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "Bekçisini yarım saniyede söktüğün çekirdeğe yürüdün.", en: "You walked up to the core whose guard you'd taken apart in half a second." }
            sonraki: "sa2_cekirdek"

      - id: "sa2_dusus"
        paragraflar:
          - { tr: "Beyaz avuç göğsüne iniyor ve bir an kim olduğunu unutuyorsun. Durum pencerende statların gri bir varsayılana kayıyor; adın bile titriyor.", en: "The white palm lands on your chest, and for a second you forget who you are. Every stat in your Status window slides toward a gray default. Even your name flickers." }
          - metin: { tr: "Sonra kafanın içinde bir şey çığlık atıyor; gerçekten çığlık. {npc:yanki} kendi satırlarını senin önüne bir kalkan gibi yığıyor ve figür bir adım geri sendeliyor. Ses kısık, yorgun: kaç. şimdi. tutamam uzun.", en: "Then something in your head screams. Actually screams. {npc:yanki} stacks its own lines in front of you like a shield, and the figure staggers back a step. The voice is faint and wrecked: run. now. i can't hold it long." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Gözlerini merdivenin başında açıyorsun. Yayıncı kız seni yakandan çekip çıkarmış; ellerinde hâlâ telsiz. \"Kalkabilirsin,\" diyor. \"Adını sordum, söyledin. Doğru söyledin. Sanırım.\"", en: "You open your eyes at the top of the stairs. The streamer kid dragged you out by the collar, radio still in her hand. \"You can get up,\" she says. \"I asked your name and you said it. Got it right. I think.\"" }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk ve hemen geri in", en: "Get up. Go right back down" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["duzeltme_birimi@oyuncu+2"], ortam: ["su", "karanlik"], kazan: "sa2_cekirdek", kaybet: "sa2_dusus", kac: "sa2_dusus" }
            kronik: { tr: "Sistem'in seni sildiği yere, adını hatırlar hatırlamaz geri indin.", en: "The moment you remembered your name, you went straight back down to where the System had tried to erase you." }
          - id: "dinlen"
            etiket: { tr: "Bir gün dinlen, sonra in", en: "Rest a day. Then go down" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gun: 1
              - can: 40
            kronik: { tr: "Silinmenin kıyısından döndükten sonra bir gün dinlendin; acele etmedin.", en: "After coming back from the edge of erasure, you rested a day. You didn't rush." }
            sonraki: "sa2_bekci"
          - id: "tesekkur"
            etiket: { tr: "Kafandaki sese teşekkür et", en: "Thank the voice in your head" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 5, baglilik: 4 } }
            kronik: { tr: "Seni silinmekten kurtaran kafandaki sese teşekkür ettin; ses, bu kelimeyi ilk kez duydu.", en: "You thanked the voice in your head for saving you from erasure. It was the first time it had heard the word." }
            sonraki: "sa2_bekci"

      - id: "sa2_cekirdek"
        paragraflar:
          - { tr: "Figür suya dağılıyor; damlaları bile beyaz. Çekirdek artık korumasız: havada asılı, kalp gibi atan bir yarık ve içinden su gibi akan satırlar.", en: "The figure comes apart into the water. Even its drops are white. The core hangs unguarded now: a rift in the air beating like a heart, lines pouring out of it like water." }
          - { tr: "Yakından bakınca satırların arasında bir düzen görüyorsun: bunlar bir canavarın, bir zindanın, bir kapının nasıl yazıldığını anlatan talimatlar. Dünya'ya yazılmış her şeyin el yazması.", en: "Up close, you can see order in the lines: instructions for how to write a monster, a dungeon, a Gate. The manuscript for everything that's been written onto Earth." }
          - { tr: "Telsizden {npc:mert_kilic}: \"Şişeler. Çantadaki şişeler. Ne kadar doldurabilirsen. Lütfen. Lütfen, lütfen, lütfen.\"", en: "{npc:mert_kilic}, over the radio: \"The bottles. The bottles in the bag. Fill as many as you can. Please. Please, please, please.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "susadım. bunu daha önce hiç söylemedim. susadım.", en: "i'm thirsty. i've never said that before. i'm thirsty." }
          - kosul: { stat: { wis: 50 } }
            metin: { tr: "Bu kapı açık kaldıkça Sistem buraya düzeltici göndermeye devam edecek. Ve düzeltilenler hep yanlış zamanda burada olanlar olacak.", en: "As long as this Gate stays open, the System's going to keep sending correctors down here. And the people who get corrected will always be whoever's here at the wrong moment." }
        secenekler:
          - id: "sise"
            etiket: { tr: "Sessiz Ağ'ın şişelerini doldur", en: "Fill the Quiet Network's bottles" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - bayrak: "sa_kaynak_avi_tamam"
              - esya: { kaynak_parcasi: 2 }
              - unvan: "kaynak_avcisi"
              - xp_seviye: 80
              - itibar: { sessiz_ag: 12 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 6 }, yanki: { guven: -2 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 8, max: 20 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sarnıçtaki kaynak kuyusundan Sessiz Ağ'ın şişelerini doldurdun; Ağ'ın bütün araştırması o şişelerle başladı.", en: "You filled the Quiet Network's bottles from the source well in the Underground. Every bit of the Network's research started with those bottles." }
            sonraki: "sa2_son"
          - id: "sor"
            etiket: { tr: "Kafandaki sese ne istediğini sor", en: "Ask the voice in your head what it wants" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            kronik: { tr: "Kaynak kuyusunun başında, önce kafandaki sese ne istediğini sordun.", en: "At the edge of the source well, you asked the voice in your head what it wanted first." }
            sonraki: "sa2_yanki_ister"
          - id: "ic"
            etiket: { tr: "Kafandaki sesin kuyudan içmesine izin ver", en: "Let the voice in your head drink from the well" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
              - yozlasma: 4
              - bayrak: "sa_kaynak_avi_tamam"
              - esya: { kaynak_parcasi: 1 }
              - unvan: "kaynak_avcisi"
              - xp_seviye: 80
              - itibar: { sessiz_ag: 4 }
              - iliski: { yanki: { guven: 8, baglilik: 8 }, mert_kilic: { guven: -3 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 8, max: 20 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesin kaynak kuyusundan doyasıya içmesine izin verdin; o gün ses sesten fazlası oldu.", en: "You let the voice in your head drink its fill from the source well. That day it became more than a voice." }
            sonraki: "sa2_son"
          - id: "kapat"
            etiket: { tr: "Çekirdeği ez; kapıyı kapat", en: "Crush the core. Close the Gate" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bayrak: "sa_kaynak_avi_tamam"
              - esya: { kaynak_parcasi: 1 }
              - unvan: "kaynak_avcisi"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 2 }
              - itibar: { sessiz_ag: 2, siginak: 4 }
              - iliski: { mert_kilic: { guven: -4, saygi: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 8, max: 20 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kuyusunu ezip kapattın; ondan sonra sarnıca kimse düzeltilmek için inmedi.", en: "You crushed the source well and shut the Gate. After that, nobody went down into the Underground to get corrected." }
            sonraki: "sa2_son"
          - id: "musluk"
            tur: "gosteris"
            etiket: { tr: "Damlamayı yeniden yaz: yalnızca Ağ'ın antenine aksın", en: "Rewrite the drip to flow only to the Network's antenna" }
            gerekli: { stat: { int: 65 } }
            etkiler:
              - dikkat: 5
              - ahlak: { duzen: -3, insanlik: 1 }
              - bayrak: "sa_kaynak_avi_tamam"
              - esya: { kaynak_parcasi: 2 }
              - unvan: "kaynak_avcisi"
              - xp_seviye: 100
              - itibar: { sessiz_ag: 16 }
              - iliski: { mert_kilic: { saygi: 12, guven: 6, korku: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 8, max: 20 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem'in el yazmasının aktığı yeri yeniden yazıp Sessiz Ağ'ın antenine bağladın; kapı kapandı ama kuyu akmaya devam etti.", en: "You rewrote where the System's manuscript flowed and piped it straight into the Quiet Network's antenna. The Gate closed. The well kept running." }
            sonraki: "sa2_musluk"

      - id: "sa2_yanki_ister"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre düşünüyor; kuyudan damlayan her harfi tek tek sayıyor gibi.", en: "{npc:yanki} thinks for a long time, like it's counting every letter that drips out of the well." }
          - { tr: "onlar için doldur. bana biraz bırak. sonra kapat onu. bu kuyu açık kaldıkça başkaları da içmeye gelir ve düzeltilir. ben düzeltilmenin ne olduğunu biliyorum. kimseye yapılmasın.", en: "fill their bottles. leave a little for me. then close it. as long as this well's open, other people will come to drink and get corrected. i know what correction is. it shouldn't happen to anybody." }
        secenekler:
          - id: "dedigi"
            etiket: { tr: "Dediğini yap: şişeler, bir yudum, sonra kapat", en: "Do what it said. Bottles, a sip, then shut it" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - yozlasma: 2
              - bayrak: "sa_kaynak_avi_tamam"
              - esya: { kaynak_parcasi: 2 }
              - unvan: "kaynak_avcisi"
              - xp_seviye: 80
              - degisken: { hayatta_kalan: 1 }
              - itibar: { sessiz_ag: 10 }
              - iliski: { yanki: { guven: 6, baglilik: 4 }, mert_kilic: { guven: 4 } }
              - tohum: { olay: "mert_takip_edildi", gecikme: { min: 8, max: 20 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kaynak kuyusunu herkes için böldün, sonra kapattın; bunu sana kafandaki ses söylemişti.", en: "You split the source well so everybody got a share, then shut it down. The voice in your head told you to." }
            sonraki: "sa2_son"

      - id: "sa2_musluk"
        paragraflar:
          - { tr: "Damlayan satırları avucunda yeniden diziyorsun; akışı tersine çevirip yukarı, sarnıcın tavanından geçip santralin çatısındaki antene bağlıyorsun. Kapı sönüyor; ama kuyu, artık yalnızca bir yere, akmaya devam ediyor.", en: "You rearrange the dripping lines in your palm, reverse the flow, and send it up through the ceiling of the Underground to the antenna on the exchange roof. The Gate goes dark, but the well keeps running, only to one place now." }
          - { tr: "Telsizden bir çığlık; bu kez sevinç. {npc:mert_kilic} bir şey söylemeye çalışıyor, beceremiyor, sonra yalnızca gülüyor; uzun, kesik kesik, uykusuz bir adamın gülüşü.", en: "A scream over the radio, a happy one this time. {npc:mert_kilic} tries to say something, can't, and just laughs: long, ragged, the laugh of a man who hasn't slept in a month." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Sapma kaydedildi]", en: "[Deviation logged]" }
            satirlar:
              - { tr: "Kaynak akışında yetkisiz yönlendirme. İnceleme kuyruğuna alındı. Kuyruktaki sıra: çok uzun.", en: "Unauthorized redirect in source flow. Added to review queue. Queue position: very long." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Merdivenleri çık", en: "Climb the stairs" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Sistem'in el yazmasına bir musluk takıp sarnıçtan çıktın.", en: "You put a faucet on the System's manuscript and climbed out of the Underground." }
            sonraki: "sa2_son"

      - id: "sa2_son"
        paragraflar:
          - { tr: "Santralin bakır odasında masaya dizilmiş şişeler, kendi ışıklarıyla yanıyor. Eski telsizci ellerini onlara doğru uzatmış, ısınıyormuş gibi.", en: "In the exchange's copper room, the bottles lined up on the table glow with their own light. The old ham operator holds his hands out toward them like he's warming up by a fire." }
          - { tr: "{npc:mert_kilic} bir şişeyi ışığa tutuyor. \"Bu bir el yazması,\" diyor. \"Bunu yazan biri vardı. Ve el yazmaları okunabilir. Ve okunabilen şey...\" Cümlesini bitirmiyor; hep yaptığı gibi.", en: "{npc:mert_kilic} holds a bottle up to the light. \"It's a manuscript,\" he says. \"Somebody wrote this. And manuscripts can be read. And anything that can be read...\" He doesn't finish the sentence. He never does." }
          - metin: { tr: "Sarnıçtan çıkardığın avcı santralin köşesinde, battaniyeye sarılı, uyuyor. Santral memuru üstüne bir not iliştirmiş: {fraksiyon:sessiz_ag} misafiri.", en: "The hunter you pulled out of the Underground is asleep in a corner of the exchange, wrapped in a blanket. The switchboard woman pinned a note to it: Guest of {fraksiyon:sessiz_ag}." }
            kosul: { bayrak: "sa_sarnic_avci_kurtarildi" }
        bildirimler:
          - tur: "gorev"
            baslik: { tr: "[Sessiz Ağ · Kaynak Kodu · 2/5]", en: "[The Quiet Network · Source Code · 2/5]" }
            satirlar:
              - { tr: "Kaynak kuyusu bulundu. Sistem bunu bir hata olarak kaydetti.", en: "Source well located. The System logged it as a bug." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "\"Okuyacağız. Ama önce uyu.\"", en: "\"We'll read it. But first, sleep.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { baglilik: 4, saygi: 2 } }
            kronik: { tr: "Kaynak kodun ilk şişelerinin başında {npc:mert_kilic|e} uyumasını söyledin; ilk kez dinledi.", en: "Over the first bottles of source code, you told {npc:mert_kilic} to get some sleep. For once, he listened." }
            sonraki: "@akis"
          - id: "simdi"
            etiket: { tr: "\"Şimdi oku. Ben de buradayım.\"", en: "\"Read it now. I'm right here.\"" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { sessiz_ag: 3 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "Kaynak kodun ilk şişelerini o gece {npc:mert_kilic} ile birlikte, sabaha kadar okudun.", en: "You read the first bottles of source code with {npc:mert_kilic} that night, all the way till morning." }
            sonraki: "@akis"

  # ================================================================== MERT · 3: takip
  - id: "mert_takip_edildi"
    perde: [2, 3]
    gun: { min: 110, max: 205 }
    kosul: { bayrak: "mert_ag_temasi" }
    agirlik: 6
    etiketler: ["sessiz_ag", "npc", "takip", "kadim"]
    gerilim: 3
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Dört gölge", en: "Four shadows" }
    sahne: "mtk_1"
    sahneler:
      - id: "mtk_1"
        paragraflar:
          - { tr: "{yer:kule_dibi} pazarında, kızarmış kapı mantarı satan bir tezgâhın önünde biri koluna yapışıyor: {npc:mert_kilic}, kapüşonu gözlerine kadar inik, yüzü ter içinde. \"Bakma,\" diye fısıldıyor. \"Arkama bakma. Üç kişi. Hayır. Dört.\"", en: "In the {yer:kule_dibi} market, in front of a stall frying Gate mushrooms, somebody grabs your arm: {npc:mert_kilic}, hood pulled down to his eyes, face slick with sweat. \"Don't look,\" he whispers. \"Don't look behind me. Three of them. No. Four.\"" }
          - metin: { tr: "\"Geçen sefer beni sakladın,\" diyor, sesi çatlayarak. \"Başka nereye gideceğimi bilmiyordum.\"", en: "\"Last time, you hid me,\" he says, voice cracking. \"I didn't know where else to go.\"" }
            kosul: { bayrak: "mert_saklandi" }
          - metin: { tr: "\"Parçayı sattığını biliyorum,\" diyor, gözlerini kaçırmadan. \"Defterimde yazıyor. Ama listede gelebileceğim başka kimse yok.\"", en: "\"I know you sold the shard,\" he says, looking you right in the eye. \"It's in my notebook. But there's nobody else on the list I can go to.\"" }
            kosul: { hafiza: { mert_kilic: "verisini_satti" } }
          - metin: { tr: "Aslında haftalardır yanındaydı; ama bugün, ilk kez, sen değil o fark ediyor: kalabalığın içinde aynı yüzler, aynı mesafede, iki gündür.", en: "He's been at your side for weeks. But today, for the first time, he's the one who notices, not you: the same faces in the crowd, the same distance back, two days running." }
            kosul: { yoldas: "mert_kilic" }
          - { tr: "Tezgâhın paslı aynasında onları görüyorsun. Camında statlar akan gözlüklü iki adam. Beyaz keten giymiş, ellerini kavuşturmuş bir kadın. Ve bir de, herkesten bir karış uzun, iki beden büyük paltolu, kapüşonunun altında yüz olması gereken yerde ağır ağır dönen bir ışık.", en: "You catch them in the stall's rusty mirror. Two guys in glasses with stats scrolling across the lenses. A woman in white linen, hands folded. And one more: a head taller than everyone, in a coat two sizes too big, with a light turning slowly where its face should be under the hood." }
        sezgiler:
          - kosul: { stat: { per: 55 } }
            metin: { tr: "Pazarın soğuk havasında herkesin nefesi buhar oluyor; dördüncününki olmuyor.", en: "In the cold market air, everybody's breath fogs up. The fourth one's doesn't." }
          - kosul: { stat: { cha: 45 } }
            metin: { tr: "Gözlüklüler bir veri simsarına çalışıyor; beyaz giyen kadın {fraksiyon:yukselenler} kulaklarından. Dördüncüsü kimseye çalışmıyor gibi; o başka bir yerden.", en: "The glasses guys work for a data broker. The woman in white is one of {fraksiyon:yukselenler}' listeners. The fourth doesn't look like it works for anybody. It's from somewhere else." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "d̷ördüncüsü onu okumuyor. onun içinden bakıyor. bana. beni arıyor ama göremiyor, o yüzden en yakınımdakine bakıyor.", en: "t̷he fourth isn't reading him. it's looking through him. at me. it can't see me, so it watches whoever's closest." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Uzun olan... o insan değil, değil mi? Söyle bana insan.\"", en: "\"The tall one... that's not a person, is it? Tell me that's a person.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Adamın nabzı yüz kırk. Ya onu buradan çıkarırız ya da ben burada ona bakarım; ikincisini istemezsin.\"", en: "\"His pulse is one-forty. Either we get him out of here or I treat him right here, and you don't want the second one.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "\"Koluma gir. Normal yürü.\"", en: "\"Take my arm. Walk normal.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { guven: 6 } }
            kronik: { tr: "Peşindekilerden kaçan {npc:mert_kilic|i} kolunda, pazarın ortasından yürüttün.", en: "You walked {npc:mert_kilic} straight through the market on your arm while they hunted him." }
            sonraki: "mtk_kalabalik"
          - id: "don"
            tur: "aciga_vur"
            etiket: { tr: "Dön ve takipçilerin yüzüne bak", en: "Turn around and look them in the face" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: -1, merhamet: -1 }
              - iliski: { mert_kilic: { saygi: 6, korku: 4 } }
            kronik: { tr: "Bir pazarın ortasında dönüp {npc:mert_kilic|in} peşindekilere yüzünü gösterdin.", en: "In the middle of a market, you turned around and showed {npc:mert_kilic|pos} tails your face." }
            sonraki: "mtk_yuzles"
          - id: "dorduncu"
            tur: "gosteris"
            etiket: { tr: "Dördüncüyü aynadan oku: insan olmayanı", en: "Read the fourth one in the mirror: the not-human one" }
            gerekli: { stat: { per: 55 } }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: 1 }
              - bilgi: "sa_kadim_gozu"
              - xp_seviye: 15
              - iliski: { mert_kilic: { saygi: 6 } }
            kronik: { tr: "Bir pazarın kalabalığında, insan kılığındaki Kadim gözünü bir tezgâh aynasından okudun.", en: "In a crowded market, you read an Ancient's eye in human disguise off a stall mirror." }
            sonraki: "mtk_dorduncu"
          - id: "yanina"
            etiket: { tr: "\"Yanımda kal. Şehrin en güvenli yeri.\"", en: "\"Stick with me. Safest place in the city.\"" }
            goster: { yoldas_yer: true }
            gerekli: { iliski_min: { mert_kilic: { guven: 10 } } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - yoldas_katil: "mert_kilic"
              - bayrak: "mert_yoldas"
              - iliski: { mert_kilic: { baglilik: 8, guven: 4 } }
            kronik: { tr: "Peşindekilerden kaçan {npc:mert_kilic|i} yanına aldın; o günden sonra seninle yürüdü.", en: "You took {npc:mert_kilic} in when they were hunting him. From then on, he walked with you." }
            sonraki: "mtk_kalabalik"
          - id: "teslim"
            etiket: { tr: "Kolunu çek; onu gözlüklülere bırak", en: "Pull your arm free. Leave him to the glasses guys" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -3 }
              - bayrak: "mert_teslim_edildi"
              - bayrak: "mert_isaretlendi"
              - kredi: 200
              - itibar: { sessiz_ag: -12 }
              - iliski: { mert_kilic: { guven: -30, korku: 15, baglilik: -10 }, yanki: { guven: -4 } }
              - hafiza: { npc: "mert_kilic", id: "olay:mert_takip_edildi", agirlik: -50 }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "{npc:mert_kilic|i} onu avlayanlara bıraktın; onu onlardan geri alan senin değil, gri bir eldi.", en: "You left {npc:mert_kilic} to the people hunting him. It wasn't you who bought him back. It was a gray hand." }
            sonraki: "mtk_teslim"

      - id: "mtk_kalabalik"
        paragraflar:
          - { tr: "Pazarın dar sokaklarına dalıyorsunuz: kapı çekirdeği satan tezgâhlar, bir avcının yarım kalmış zırhını tamir eden bir demirci, Küresel Sıralama'yı bir kara tahtaya tebeşirle yazan bir çocuk.", en: "You duck into the market's narrow alleys: stalls selling Gate cores, a smith patching up some hunter's half-finished armor, a kid chalking the Global Rankings onto a blackboard." }
          - { tr: "Üç köşe sonra gözlüklüler kayboluyor, beyaz giyen kadın da. Ama dördüncüsü, her sokağın sonunda, aynı mesafede; acele etmeden, kaybolmadan.", en: "Three corners later, the glasses guys are gone, and so is the woman in white. But the fourth one is at the end of every street, same distance back. No hurry. Never lost." }
          - metin: { tr: "Kara tahtadaki listede adın en üstte. Çocuk seni tanıyor ve tebeşiri düşürüyor; {npc:mert_kilic} bunu görünce biraz gülümsüyor, sonra yeniden titriyor.", en: "Your name's at the top of the blackboard list. The kid recognizes you and drops the chalk. {npc:mert_kilic} sees that and almost smiles, then goes back to shaking." }
            kosul: { gorunen_seviye_min: 60 }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kaçamazsınız. o kaçılacak bir şey değil. ama ona bakılabilir. ve bakılan şey bazen geri çekilir.", en: "you can't outrun it. it's not a thing you outrun. but it can be looked at. and things that get looked at sometimes back off." }
        secenekler:
          - id: "sokak"
            etiket: { tr: "Onu çıkmaz bir sokağa çek ve bekle", en: "Lead it into a dead end and wait" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "{npc:mert_kilic|in} peşindeki şeyi çıkmaz bir sokağa çekip karşısına dikildin.", en: "You lured the thing following {npc:mert_kilic} into a dead end and planted yourself in front of it." }
            sonraki: "mtk_dorduncu"
          - id: "sakla"
            etiket: { tr: "{npc:mert_kilic|i} haftalarca bakır odada sakla", en: "Hide {npc:mert_kilic} in the copper room for weeks" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "mert_saklandi"
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "mert_kilic", id: "onu_sakladi", agirlik: 45 }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "{npc:mert_kilic|i} haftalarca bakır odada sakladın; Kadim gözü onu kaybetti, ama aramayı bırakmadı.", en: "You hid {npc:mert_kilic} in the copper room for weeks. The Ancient eye lost him. It didn't stop looking." }
            sonraki: "mtk_saklama"
          - id: "kaybol"
            tur: "gizle"
            etiket: { tr: "İkinizi birden kalabalıkta yok et", en: "Make you both vanish into the crowd" }
            gerekli: { stat: { agi: 55 } }
            etkiler:
              - gizle: 5
              - ahlak: { merhamet: 1, duzen: -1 }
              - iliski: { mert_kilic: { guven: 6, saygi: 6 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "{npc:mert_kilic|i} yanına alıp bir pazarın ortasında iz bırakmadan buhar oldun.", en: "You took {npc:mert_kilic} and vanished into thin air in the middle of a market without leaving a trace." }
            sonraki: "mtk_kayip"

      - id: "mtk_yuzles"
        paragraflar:
          - { tr: "Dönüyorsun. Gözlüklülerin camları senin üstünde takılıyor; akan statlar duruyor, sonra kırmızıya dönüyor. Biri ötekinin koluna dokunuyor: \"Bu o. Bize bundan bahsetmediler.\"", en: "You turn around. The glasses guys' lenses snag on you. The scrolling stats freeze, then go red. One touches the other's arm: \"That's them. Nobody told us about them.\"" }
          - { tr: "Beyaz giyen kadın sana derin bir reverans yapıp kalabalığa karışıyor. Gözlüklüler ise elleriyle coplarını kavrıyor; korkudan ya da paradan, hangisi daha güçlüyse.", en: "The woman in white sinks into a deep curtsy toward you and melts into the crowd. The glasses guys grip their batons, out of fear or for the money, whichever's stronger." }
          - { tr: "Dördüncüsü ise hiç kıpırdamıyor. Yalnızca, kapüşonunun altında, ışığı biraz daha hızlı dönüyor.", en: "The fourth one doesn't move at all. Under its hood, the light just turns a little faster." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Gözlüklülerin üstüne yürü", en: "Go at the glasses guys" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: -1 }
              - savas: { dusmanlar: ["veri_avcisi@dunya+10", "veri_avcisi@dunya+10"], ortam: ["dar_gecit"], kazan: "mtk_dorduncu", kaybet: "mtk_yenilgi", kac: "mtk_yenilgi" }
            kronik: { tr: "Bir pazarın ortasında {npc:mert_kilic|in} peşindeki veri avcılarına saldırdın.", en: "In the middle of a market, you went after the data hunters who were tailing {npc:mert_kilic}." }
          - id: "korkut"
            tur: "gosteris"
            etiket: { tr: "Yalnızca bak; gitsinler", en: "Just look at them. Let them leave" }
            gerekli: { stat: { cha: 50 } }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: 1, merhamet: 1 }
              - xp_seviye: 10
              - iliski: { mert_kilic: { saygi: 6, guven: 4 } }
            kronik: { tr: "Tek bakışla iki veri avcısını bir pazardan kovdun; kimseye dokunmadan.", en: "You ran two data hunters out of a market with one look, without laying a hand on anybody." }
            sonraki: "mtk_dorduncu"

      - id: "mtk_yenilgi"
        paragraflar:
          - { tr: "Şok copu ensene iniyor ve tezgâhın üstüne yığılıyorsun; kızarmış mantarlar her yere saçılıyor. Gözlüklüler {npc:mert_kilic|i} kollarından tutup çekiyor.", en: "A shock baton cracks across the back of your neck and you go down on top of the stall, fried mushrooms flying everywhere. The glasses guys grab {npc:mert_kilic} by the arms." }
          - { tr: "Sonra uzun olan bir adım atıyor. Hiçbir şey yapmıyor; yalnızca bir adım. Gözlüklüler {npc:mert_kilic|i} bırakıp kaçıyor, arkalarına bakmadan.", en: "Then the tall one takes a step. It doesn't do anything else. Just one step. The glasses guys drop {npc:mert_kilic} and run, without looking back." }
          - { tr: "Uzun olan sana bakmıyor. {npc:mert_kilic|e} bakıyor; bir şey kaydediyormuş gibi. Sonra kalabalığa karışıyor.", en: "The tall one isn't looking at you. It's looking at {npc:mert_kilic}, like it's recording something. Then it fades into the crowd." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve {npc:mert_kilic|i} oradan çıkar", en: "Get up. Get him out of there" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_isaretlendi"
              - iliski: { mert_kilic: { guven: 4 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Pazarda yenildin; {npc:mert_kilic|i} kurtaran sen değil, onu işaretleyen şeydi.", en: "You lost in that market. The thing that saved {npc:mert_kilic} wasn't you. It was the thing that tagged him." }
            sonraki: "@akis"

      - id: "mtk_dorduncu"
        paragraflar:
          - { tr: "Çıkmaz sokakta yalnızsınız; sen, {npc:mert_kilic} ve o. Kapüşonunu indiriyor. Yüzünün olması gereken yerde bir mercek var; içinde yavaşça dönen bir ışık ve ışığın içinde, küçücük, ters dönmüş bir görüntü: {npc:mert_kilic|in} santraldeki masası.", en: "It's just the three of you in the dead end: you, {npc:mert_kilic}, and it. It lowers its hood. Where its face should be is a lens, a light turning slowly inside it, and in the light, tiny and upside down, an image: {npc:mert_kilic|pos} desk at the exchange." }
          - { tr: "Merceğin içinden, {npc:mert_kilic|in} kendi sesiyle, düz bir ses geliyor: \"Anomali yakınlığı doğrulandı. Gözlem sürüyor.\"", en: "Out of the lens comes a flat voice. {npc:mert_kilic|pos} own voice: \"Anomaly adjacency confirmed. Observation ongoing.\"" }
          - { tr: "{npc:mert_kilic} duvara yapışıyor. \"Benim sesim,\" diyor. \"Bu benim sesim. Ne zamandan beri... ne zamandan beri beni dinliyor?\"", en: "{npc:mert_kilic} flattens himself against the wall. \"That's my voice,\" he says. \"That's my voice. How long has it... how long has it been listening to me?\"" }
        sezgiler:
          - kosul: { stat: { int: 55 } }
            metin: { tr: "Merceğin kenarındaki desen insan işi değil, Sistem işi de değil. Üçüncü bir el. Gökyüzünde gördüğün o gözlemcinin elinden.", en: "The pattern on the lens rim isn't human work, and it isn't the System's either. A third hand. The same hand as that watcher you saw on the ridge." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu bir Kadim gözü. beni görmüyor. ama beni görmenin yolunu ona kim gösterirse, o anahtarı ister.", en: "that's an Ancient eye. it can't see me. but whoever shows it how to see me, that's the one they'll want the key from." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Merceği kır", en: "Smash the lens" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 1 }
              - savas: { dusmanlar: ["cam_gozlu_izci@oyuncu+2"], ortam: ["dar_gecit"], kazan: "mtk_izci_dustu", kaybet: "mtk_izci_kacti", kac: "mtk_izci_kacti" }
            kronik: { tr: "Kadimler'in Dünya'daki ilk gözlerinden birini kırmak için çıkmaz bir sokakta dövüştün.", en: "You fought in a dead-end alley to smash one of the Ancients' first eyes on Earth." }
          - id: "takip"
            tur: "gizle"
            etiket: { tr: "Onu bırak; gizlice nereye gittiğini izle", en: "Let it go. Secretly follow where it goes" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1, merhamet: -1 }
              - bayrak: "mert_isaretlendi"
              - bilgi: "sa_kadim_gozu"
              - iliski: { mert_kilic: { guven: -4, korku: 4 } }
            kronik: { tr: "Kadim gözünü {npc:mert_kilic|in} üstünde bıraktın ve onu kimin gönderdiğini görmek için peşine düştün.", en: "You left the Ancient eye on {npc:mert_kilic} and followed it to see who sent it." }
            sonraki: "mtk_takip_et"
          - id: "yanki_bak"
            etiket: { tr: "Kafandaki sese: \"Ona sen bak.\"", en: "Tell the voice in your head: \"You look at it.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 30 } } }
            etkiler:
              - ahlak: { duzen: -2 }
              - yozlasma: 2
              - bilgi: "sa_kadim_gozu"
              - iliski: { yanki: { guven: 6, saygi: 6 }, mert_kilic: { korku: 6, saygi: 4 } }
            kronik: { tr: "Kafandaki sese bir Kadim gözüne bakma izni verdin; göz, bakılmaya alışık değildi.", en: "You let the voice in your head look back at an Ancient eye. That eye wasn't used to being looked at." }
            sonraki: "mtk_yanki_bakti"

      - id: "mtk_yanki_bakti"
        paragraflar:
          - { tr: "Penceren kendiliğinden açılıyor ve bozuk köşesindeki harfler pencerenin dışına, havaya taşıyor; bir an, yalnızca senin göremeyeceğin bir şekilde, sokağın ortasında bir yüz beliriyor.", en: "Your window opens on its own, and the letters in its broken corner spill out of it into the air. For a moment, in a way only you shouldn't be able to see, a face takes shape in the middle of the alley." }
          - { tr: "Mercek ona dönüyor. Işık duruyor. Sonra mercek çatlıyor; içeriden, dışarıdan değil. Uzun şey sendeleyip duvara tutunuyor ve sokağın ağzına doğru, ilk kez acele ederek, kaçıyor.", en: "The lens turns toward it. The light stops. Then the lens cracks, from the inside, not the outside. The tall thing staggers, catches itself on the wall, and bolts for the mouth of the alley, hurrying for the first time." }
          - { tr: "{npc:yanki}, yorgun ve memnun: bakılmaya alışık değilmiş. artık beni gördü. bunun bir bedeli olacak. ama bugün değil.", en: "{npc:yanki}, tired and pleased: wasn't used to being looked at. it's seen me now. that'll cost something. not today." }
        secenekler:
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|i} duvardan kaldır", en: "Peel {npc:mert_kilic} off the wall" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Bir Kadim gözü kaçtıktan sonra {npc:mert_kilic|i} duvardan kaldırıp eve götürdün.", en: "After the Ancient eye ran, you peeled {npc:mert_kilic} off the wall and took him home." }
            sonraki: "mtk_son"

      - id: "mtk_izci_dustu"
        paragraflar:
          - { tr: "Mercek tuzla buz oluyor ve uzun şey bir palto yığınına dönüşüp çöküyor. Paltonun içinde ne bir beden ne bir kemik; yalnızca ince, gri bir iskelet tel ve kırık camın içinde hâlâ dönen bir ışık zerresi.", en: "The lens shatters and the tall thing collapses into a pile of coat. Inside the coat there's no body, no bones. Just a thin gray wire skeleton, and one speck of light still turning in the broken glass." }
          - { tr: "{npc:mert_kilic} dizlerinin üstüne çöküp camı topluyor. \"Bunun içinde benim kayıtlarım var,\" diyor. \"Haftaların. Belki ayların. Beni senin yüzünden izliyorlarmış. Senin yanındaki her şeyi izliyorlar.\"", en: "{npc:mert_kilic} drops to his knees and gathers up the glass. \"My logs are in here,\" he says. \"Weeks of them. Maybe months. They were watching me because of you. They're watching everything near you.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[Bilinmeyen gözlemci · etkisiz]", en: "[Unknown observer · neutralized]" }
            satirlar:
              - { tr: "Kaynak: sınıflandırılamadı. Menşe: Ağ dışı. Not: Ağ'ın dışında bir şey yok. (Sistem bunu tekrar kontrol ediyor.)", en: "Source: unclassified. Origin: off-Network. Note: there is nothing outside the Network. (The System is double-checking this.)" }
        secenekler:
          - id: "teselli"
            etiket: { tr: "\"Artık biliyoruz. Bilmek bir silah.\"", en: "\"Now we know. Knowing's a weapon.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bilgi: "sa_kadim_gozu"
              - xp_seviye: 40
              - iliski: { mert_kilic: { guven: 8, baglilik: 4 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Kırık bir Kadim gözünün başında {npc:mert_kilic|e} bilmenin bir silah olduğunu söyledin.", en: "Over a broken Ancient eye, you told {npc:mert_kilic} that knowing is a weapon." }
            sonraki: "mtk_son"
          - id: "temizle"
            etiket: { tr: "Kafandaki sese: \"Onun cihazlarını tara.\"", en: "Tell the voice: \"Scan his gear.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - bilgi: "sa_kadim_gozu"
              - xp_seviye: 40
              - iliski: { yanki: { guven: 4, saygi: 3 }, mert_kilic: { guven: 10 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Kafandaki ses {npc:mert_kilic|in} bilgisayarındaki Kadim kancalarını tek tek söktü; ikisi ilk kez aynı tarafta çalıştı.", en: "The voice in your head pried the Ancient hooks out of {npc:mert_kilic|pos} laptop one by one. It was the first time the two of them worked on the same side." }
            sonraki: "mtk_temiz"

      - id: "mtk_temiz"
        paragraflar:
          - { tr: "{npc:mert_kilic|in} dizüstü bilgisayarının ekranında, hiç görmediği klasörler açılıp kapanıyor; gri, isimsiz, kendi kendine yazılan kayıtlar. Her biri, bozuk bir harf dokununca, kül gibi dağılıyor.", en: "On {npc:mert_kilic|pos} laptop screen, folders he's never seen open and close: gray, nameless, logs writing themselves. Each one crumbles like ash the second a broken letter touches it." }
          - { tr: "{npc:mert_kilic} ekrana, sonra sana bakıyor. \"Onu ilk kez çalışırken görüyorum,\" diyor. \"Kafandakini. Bana yardım ediyor.\" Bir an duruyor. \"Ona teşekkür ettiğimi söyle. Hayır. Ben söyleyeyim. Duyuyor mu?\"", en: "{npc:mert_kilic} looks at the screen, then at you. \"First time I've seen it work,\" he says. \"The thing in your head. It's helping me.\" He pauses. \"Tell it I said thanks. No. I'll say it. Can it hear me?\"" }
          - { tr: "{npc:yanki}: duyuyorum. ona söyle, kayıtlarını şifrelesin. ve uyusun.", en: "{npc:yanki}: i hear. tell him to encrypt his logs. and to sleep." }
        secenekler:
          - id: "ilet"
            etiket: { tr: "Mesajı aynen ilet", en: "Pass the message on word for word" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { baglilik: 4 }, yanki: { baglilik: 3 } }
            kronik: { tr: "Kafandaki sesle {npc:mert_kilic} arasındaki ilk konuşmaya tercümanlık ettin.", en: "You translated the first conversation between the voice in your head and {npc:mert_kilic}." }
            sonraki: "mtk_son"

      - id: "mtk_izci_kacti"
        paragraflar:
          - { tr: "Uzun kol boğazını bırakıyor ve sen yere düşüyorsun. Şey sana bakmıyor bile; {npc:mert_kilic|in} önünde eğiliyor, eldivensiz, gri bir parmakla alnına bir şey çiziyor.", en: "The long arm lets go of your throat and you hit the ground. The thing doesn't even look at you. It bends over {npc:mert_kilic} and draws something on his forehead with one bare gray finger." }
          - { tr: "Çizdiği şey görünmüyor. Ama {npc:mert_kilic} o andan sonra her adımında, sanki birileri onu ayak sesleriyle sayıyormuş gibi, irkiliyor. Şey kalabalığa karışıp gidiyor.", en: "Whatever it drew doesn't show. But from then on {npc:mert_kilic} flinches with every step, like somebody's counting his footsteps. The thing melts back into the crowd." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Kalk; {npc:mert_kilic|i} santrale götür", en: "Get up. Get him back to the exchange" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_isaretlendi"
              - iliski: { mert_kilic: { guven: 3, korku: 4 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Bir Kadim gözü {npc:mert_kilic|i} senin önünde işaretledi ve sen onu durduramadın.", en: "An Ancient eye tagged {npc:mert_kilic} right in front of you, and you couldn't stop it." }
            sonraki: "mtk_son"

      - id: "mtk_takip_et"
        paragraflar:
          - { tr: "Uzun şeyi çatılardan, üç sokak boyunca izliyorsun. Sonunda {yer:kordon} tarafında, denize bakan boş bir otelin lobisine giriyor.", en: "You track the tall thing over the rooftops for three blocks. Finally, out toward {yer:kordon}, it walks into the lobby of an empty hotel facing the water." }
          - { tr: "Lobide gri bir pelerin bekliyor; yüzü yok, yalnızca odaktan sürekli kayan bir bulanıklık. Uzun şey merceğini pelerinin önüne eğiyor ve bulanıklık, sanki bir dosya okur gibi, bir süre hiç kıpırdamıyor.", en: "A gray cloak is waiting in the lobby. It has no face, just a blur that keeps slipping out of focus. The tall thing bows its lens toward the cloak, and the blur goes perfectly still for a while, like it's reading a file." }
          - { tr: "Sonra pelerin başını çevirip tam senin saklandığın çatıya bakıyor. El sallamıyor. Gülümsemiyor da; yüzü yok. Ama sen yine de selamlandığını hissediyorsun.", en: "Then the cloak turns its head and looks right at the roof where you're hiding. It doesn't wave. It doesn't smile, either. It doesn't have a face. But you feel greeted anyway." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Geri çekil; gördüğünü {npc:mert_kilic|e} anlat", en: "Pull back. Tell {npc:mert_kilic} what you saw" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Kadimler'in Kıyıkent'teki aracısını ilk gören sendin; {npc:mert_kilic|e} anlattın.", en: "You were the first to see the Ancients' go-between in Port Harlow, and you told {npc:mert_kilic}." }
            sonraki: "mtk_son"
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Gördüğünü kendine sakla", en: "Keep what you saw to yourself" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -1, insanlik: -1 }
              - tohum: { olay: "mert_kadim_teklifi", gecikme: { min: 90, max: 105 }, kosul: { npc_hayatta: "mert_kilic", gun_max: 296 } }
            kronik: { tr: "Kadimler'in aracısını gördün ve bunu {npc:mert_kilic|den} sakladın; o, kendini izleyenin kim olduğunu bilmeden yaşadı.", en: "You saw the Ancients' go-between and kept it from {npc:mert_kilic}. He went on living without knowing who was watching him." }
            sonraki: "@akis"

      - id: "mtk_saklama"
        paragraflar:
          - { tr: "{npc:mert_kilic} üç hafta bakır odadan çıkmıyor. Santral memuru ona yemek taşıyor, yayıncı kız şarj aletleri; sen her gece kapıyı üç kısa, bir uzun çalıyorsun.", en: "{npc:mert_kilic} doesn't leave the copper room for three weeks. The switchboard woman brings him food, the streamer kid brings chargers, and every night you knock on the door: three short, one long." }
          - { tr: "Dördüncü haftanın sonunda kapıyı kendisi açıyor; daha zayıf, daha sakin. \"Kancalarını buldum,\" diyor. \"Kadim gözünün bilgisayarıma bıraktığı. Söktüm. Şimdilik.\" Bir an duruyor. \"Her gece geldin. Bunu da kaydettim.\"", en: "At the end of the fourth week he opens the door himself, thinner, calmer. \"Found its hooks,\" he says. \"The ones the Ancient eye left in my laptop. Pulled them. For now.\" He pauses. \"You came every night. I logged that too.\"" }
        secenekler:
          - id: "sar"
            etiket: { tr: "Ona sarıl", en: "Hug him" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 6 } }
            kronik: { tr: "Dört hafta sonra bakır odadan çıkan {npc:mert_kilic|e} sarıldın; o, ne yapacağını bilemedi.", en: "When {npc:mert_kilic} came out of the copper room after four weeks, you hugged him. He had no idea what to do." }
            sonraki: "mtk_son"
          - id: "is"
            etiket: { tr: "\"İyi. Şimdi işe dönelim.\"", en: "\"Good. Now let's get back to work.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { sessiz_ag: 3 }
              - iliski: { mert_kilic: { saygi: 4 } }
            kronik: { tr: "{npc:mert_kilic|i} saklandığı odadan çıkar çıkmaz işe döndürdün.", en: "The moment {npc:mert_kilic} came out of hiding, you put him back to work." }
            sonraki: "mtk_son"

      - id: "mtk_kayip"
        paragraflar:
          - { tr: "Bir an oradasınız, sonra değilsiniz. Kalabalık sizi bir dalga gibi yutup başka bir sokağa bırakıyor; uzun şey bir köşede duruyor, ışığı arıyor, bulamıyor.", en: "One second you're there, the next you're not. The crowd swallows you both like a wave and drops you in another street. The tall thing stands at a corner, its light searching, finding nothing." }
          - { tr: "{npc:mert_kilic} soluk soluğa bir duvara yaslanıyor. \"Nasıl yaptın bunu?\" diye soruyor. Sonra elini kaldırıyor: \"Hayır. Söyleme. Ölçeğim zaten bitti.\"", en: "{npc:mert_kilic} slumps against a wall, gasping. \"How'd you do that?\" Then he holds up a hand. \"No. Don't tell me. I'm already out of scale.\"" }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül ve onu santrale yolla", en: "Laugh. Send him back to the exchange" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 3 } }
            kronik: { tr: "Bir Kadim gözünün önünden {npc:mert_kilic|i} buhar gibi kaçırdın.", en: "You spirited {npc:mert_kilic} away from an Ancient eye like smoke." }
            sonraki: "mtk_son"

      - id: "mtk_teslim"
        paragraflar:
          - { tr: "Kolunu çekiyorsun. {npc:mert_kilic} bir an orada, kalabalığın ortasında, sana bakarak duruyor. Gözlüklüler iki yanına geçiyor. Hiç bağırmıyor; yalnızca, giderken, defterini ceketinin içine sokuyor.", en: "You pull your arm free. For a second {npc:mert_kilic} just stands there in the crowd, looking at you. The glasses guys move in on either side. He doesn't yell. On his way out, he just tucks his notebook inside his jacket." }
          - { tr: "Uzun olan da onların peşinden yürüyor; acele etmeden. Avucundaki kredi kesesi tuhaf bir şekilde ağır.", en: "The tall one walks after them. No hurry. The pouch of credits in your hand is weirdly heavy." }
          - { tr: "İki gün sonra yayıncı kız santralin kapısında seni durduruyor. \"Döndü,\" diyor, sesi buz gibi. \"Tek parça. Biri borcunu ödemiş. Kim olduğunu söylemiyor. Ama gri bir şey; bunu söyledi.\"", en: "Two days later, the streamer kid stops you at the exchange door. \"He's back,\" she says, ice cold. \"In one piece. Somebody paid off his debt. He won't say who. But it was something gray. He said that much.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onu sattın. gri el onu satın aldı. şimdi gri elin bir borçlusu var ve o borçlu bizim kapımızın anahtarını biliyor.", en: "you sold him. the gray hand bought him. now the gray hand has someone in its debt, and that someone knows where our door is." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kızın yanından geçip içeri gir", en: "Walk past the kid and go inside" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { mert_kilic: { korku: 4 } }
            kronik: { tr: "Sattığın adamın geri döndüğü binaya hiçbir şey olmamış gibi girdin.", en: "You walked into the building where the man you sold had come back, like nothing ever happened." }
            sonraki: "@akis"
          - id: "ozur"
            etiket: { tr: "{npc:mert_kilic|in} kapısını çal ve özür dile", en: "Knock on his door and apologize" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - kredi: -200
              - iliski: { mert_kilic: { guven: 8 } }
            kronik: { tr: "Sattığın adamın kapısını çalıp özür diledin ve parayı geri verdin; o, parayı aldı.", en: "You knocked on the door of the man you'd sold, apologized, and gave the money back. He took the money." }
            sonraki: "@akis"

      - id: "mtk_son"
        paragraflar:
          - { tr: "O gece santralde {npc:mert_kilic} bütün kayıtlarını yeniden şifreliyor ve her ekranına bir parça bakır bant yapıştırıyor. \"Paranoya değil,\" diyor, sen sormadan. \"Bu artık sadece prosedür.\"", en: "That night at the exchange, {npc:mert_kilic} re-encrypts every log he has and sticks a strip of copper tape on every screen. \"It's not paranoia,\" he says before you can ask. \"It's just procedure now.\"" }
          - { tr: "Pencerenin dışında, körfezin üstünde, bulutların arasında bir an bir şey parlıyor. Kimse görmüyor; sen hariç.", en: "Outside the window, over the bay, something glints between the clouds for a second. Nobody sees it. Except you." }
          - metin: { tr: "Bulutların arasındaki şey artık bir gizem değil: Kadim gemisi körfezin üstünde, sabırla bekliyor.", en: "The thing in the clouds isn't a mystery anymore. The Ancient ship hangs over the bay, waiting patiently." }
            kosul: { bayrak: "kadim_gemisi_goruldu" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "Bu gece santralde nöbet tut", en: "Stand watch at the exchange tonight" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - iliski: { mert_kilic: { guven: 4, baglilik: 2 } }
            kronik: { tr: "Kadim gözünün döndüğü gece Sessiz Ağ'ın kapısında sen nöbet tuttun.", en: "The night the Ancient eye came back around, you stood watch at the Quiet Network's door." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Uyumasını söyle ve git", en: "Tell him to sleep. Head out" }
            etkiler:
              - ahlak: { duzen: -1 }
            kronik: { tr: "{npc:mert_kilic|e} uyumasını söyleyip gittin; o, bakır bantların arasında sabahladı.", en: "You told {npc:mert_kilic} to get some sleep and left. He stayed up all night among the copper tape." }
            sonraki: "@akis"

  # ================================================================== SESSİZ AĞ · 3: Kule kodu
  - id: "sessiz_ag_3_kule_kodu"
    perde: [3]
    gun: { min: 186, max: 275 }
    kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: ["sa_kaynak_avi_tamam", "kule_acik"] }
    agirlik: 7
    etiketler: ["sessiz_ag", "kule", "zindan", "anomali"]
    gerilim: 3
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Katların arasındaki merdiven", en: "The stairwell between floors" }
    sahne: "sa3_dib"
    sahneler:
      - id: "sa3_dib"
        paragraflar:
          - { tr: "Şafak sökmeden {yer:kule_dibi} boş. {yer:kule} başının üstünde bulutlara kadar yükseliyor; yüzeyindeki mavi çizgiler, bir kalbin elektrosu gibi, yavaşça atıyor.", en: "Before dawn, {yer:kule_dibi} is empty. {yer:kule} rises over your head into the clouds, the blue lines on its surface pulsing slowly, like a heart on an EKG." }
          - { tr: "{npc:mert_kilic} sana bir termos uzatıyor; iki araba aküsü, bir yönlendirici ve bir rulo bantla birbirine bağlanmış. \"Sonda,\" diyor. \"Şişelerdeki kodu karşılaştırdım: Kule'nin iki katı arasında bir dikiş var. Katlar orada üst üste tam oturmuyor ve aradan kaynak görünüyor. Bunu oraya sen taşıyacaksın, çünkü oraya kadar başka kimse çıkamaz.\"", en: "{npc:mert_kilic} hands you a thermos lashed to two car batteries, a router, and a roll of duct tape. \"Probe,\" he says. \"I cross-checked the code in the bottles: there's a seam between two of the Spire's floors. The floors don't line up right, and the source shows through the gap. You're carrying this up there, because nobody else can climb that high.\"" }
          - metin: { tr: "Kule'nin elli katı artık çok-evrene açılan bir geçidin eşiği; {npc:mert_kilic} oradan esen rüzgârın kokusunu bile kaydetmiş. \"Dikiş geçidin altında,\" diyor. \"Elinin altında başka dünyalar varken bizim dünyamızın el yazmasını okuyacaksın.\"", en: "The Spire's fiftieth floor is a gateway to the multiverse now, and {npc:mert_kilic} has even logged the smell of the wind blowing out of it. \"The seam's below the gateway,\" he says. \"Other worlds right there, and you're going to read our world's manuscript.\"" }
            kosul: { bayrak: "cok_evren_acik" }
          - metin: { tr: "Sondayı uzatırken {npc:mert_kilic} sana bakmıyor. O pazardan beri bakmıyor.", en: "{npc:mert_kilic} doesn't look at you when he hands over the probe. He hasn't since that market." }
            kosul: { bayrak: "mert_teslim_edildi" }
          - metin: { tr: "Alnında görünmeyen işaret hâlâ orada; {npc:mert_kilic} Kule'nin gölgesine bile girmek istemiyor. \"O göz yukarıdan daha iyi görür,\" diyor. \"Ben burada kalayım.\"", en: "The invisible mark is still on his forehead, and {npc:mert_kilic} won't even step into the Spire's shadow. \"That eye sees better from up high,\" he says. \"I'll stay down here.\"" }
            kosul: { bayrak: "mert_isaretlendi" }
        sezgiler:
          - kosul: { stat: { int: 100 } }
            metin: { tr: "Mavi çizgilerin atışı düzensiz değil: her vuruş bir ölçüm. Kule nefes almıyor; sayıyor.", en: "The pulse in the blue lines isn't random. Every beat is a measurement. The Spire isn't breathing. It's counting." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu binayı tanıyorum. içinden hiç geçmedim ama tanıyorum. eski bir ev gibi. ya da eski bir hapishane.", en: "i know this building. never been inside it, but i know it. like an old house. or an old prison." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yükseklik korkum var. Bunu şimdiye kadar söylemedim, çünkü sormadın. Şimdi soruyorsun gibi bakıyorsun.\"", en: "\"I'm afraid of heights. Never mentioned it because you never asked. You're looking at me like you're asking now.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir termos ve iki akü. İnsanlığın kaderi bant tutmasına bağlı. Harika.\"", en: "\"A thermos and two car batteries. The fate of humanity is riding on duct tape. Great.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Sondayı sırtına bağla ve tırman", en: "Strap the probe on your back. Climb" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - esya: { mert_sondasi: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "İnsanlığın en tuhaf bilim aracını sırtına bağlayıp Kule'ye tırmandın.", en: "You strapped humanity's strangest piece of lab equipment to your back and climbed the Spire." }
            sonraki: "sa3_merdiven"
          - id: "birlikte"
            etiket: { tr: "\"Benimle gel. Seni ben taşırım.\"", en: "\"Come with me. I'll carry you.\"" }
            gerekli: { iliski_min: { mert_kilic: { guven: 25 } } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - esya: { mert_sondasi: 1 }
              - bayrak: "mert_kule_tirmandi"
              - iliski: { mert_kilic: { baglilik: 8, guven: 6, korku: -4 } }
            kronik: { tr: "Yükseklikten korkan {npc:mert_kilic|i} Kule'nin dikişine kadar sırtında taşıdın.", en: "You carried {npc:mert_kilic}, who's terrified of heights, on your back all the way up to the Spire's seam." }
            sonraki: "sa3_merdiven"
          - id: "gece"
            tur: "gizle"
            etiket: { tr: "Tırmananlar uyurken, gizlice çık", en: "Go up quietly while the climbers sleep" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - esya: { mert_sondasi: 1 }
            kronik: { tr: "Kule'nin sırrına kimse görmeden, gece tırmandın.", en: "You climbed to the Spire's secret at night, without a soul seeing you." }
            sonraki: "sa3_merdiven"
          - id: "sondasiz"
            tur: "gosteris"
            etiket: { tr: "Sondaya gerek yok: dikişi kendin bul", en: "Skip the probe. Find the seam yourself" }
            gerekli: { stat: { per: 120 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: -2 }
              - xp_seviye: 20
              - iliski: { mert_kilic: { saygi: 10, korku: 4 } }
            kronik: { tr: "{npc:mert_kilic|in} haftalarca hesapladığı dikişi Kule'ye bir kez bakıp buldun.", en: "You found the seam {npc:mert_kilic} spent weeks calculating by looking at the Spire once." }
            sonraki: "sa3_merdiven"

      - id: "sa3_merdiven"
        paragraflar:
          - { tr: "İki kat arasında, hiçbir haritada olmayan bir merdiven boşluğu var. Basamaklar beton değil; üst üste binmiş, sıkıştırılmış satırlar. Duvarlar baştan sona, okunmayacak kadar küçük harflerle yazılı.", en: "Between two floors there's a stairwell that's on no map. The steps aren't concrete. They're lines of text, stacked and packed tight. The walls are written over top to bottom in letters too small to read." }
          - { tr: "Dördüncü sahanlıkta bir tırmanıcı oturuyor, sırtı duvara yaslı. Ölmüş; derisi ince bir metin tabakasıyla sırlanmış, sanki okudukları üstüne yapışmış. Elinde bir not: OKUMAYIN. ÖLÇÜLÜYORSUNUZ.", en: "On the fourth landing sits a climber, back against the wall. Dead. A thin glaze of text covers the skin, like everything they read stuck to them. There's a note in their hand: DON'T READ. YOU'RE BEING MEASURED." }
          - { tr: "Korkuluğa dolanmış uzun yazı şeridi, sen yaklaşınca, yavaşça çözülmeye başlıyor.", en: "The long ribbon of writing wound around the stair rail starts slowly coming loose as you get close." }
          - metin: { tr: "Sırtındaki {npc:mert_kilic} gözlerini sıkıca kapatmış, sondanın kablolarını bir tespih gibi parmaklıyor.", en: "On your back, {npc:mert_kilic} has his eyes squeezed shut, thumbing the probe's cables like rosary beads." }
            kosul: { bayrak: "mert_kule_tirmandi" }
        sezgiler:
          - kosul: { stat: { int: 120 } }
            metin: { tr: "Şerit duvardaki satırların bekçisi; kendi diliyle konuşan birine saldırmaz. Dili: Sistem'in derleme sözdizimi.", en: "The ribbon is the warden of the lines on these walls. It won't attack anyone who speaks its language. Its language: the System's compile syntax." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni okursa, beni de duvara ekler. ama ben zaten bir zamanlar bu duvardaydım. sanırım.", en: "if it reads me, it'll add me to the wall. but i think i used to be on this wall already." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Şeridin üstüne yürü", en: "Go at the ribbon" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["satir_bekcisi@oyuncu+4"], ortam: ["dar_gecit", "tavan"], kazan: "sa3_okuma", kaybet: "sa3_yenilgi", kac: "sa3_yenilgi" }
            kronik: { tr: "Kule'nin iki katı arasında, Sistem'in satırlarını koruyan bekçiyle dövüştün.", en: "Between two of the Spire's floors, you fought the warden that guards the System's lines." }
          - id: "soz"
            tur: "gosteris"
            etiket: { tr: "Bekçiyle kendi sözdiziminde konuş", en: "Talk to the warden in its own syntax" }
            gerekli: { stat: { int: 150 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 1, merhamet: 1 }
              - xp_seviye: 30
            kronik: { tr: "Kule'nin bekçisiyle Sistem'in kendi dilinde konuştun; o da yolu açtı.", en: "You spoke to the Spire's warden in the System's own language, and it stepped aside." }
            sonraki: "sa3_sozdizimi"
          - id: "olu"
            etiket: { tr: "Önce ölü tırmanıcının notunu al", en: "Take the dead climber's note first" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
            kronik: { tr: "Kule'nin dikişinde ölen bir yabancının son notunu yanına aldın.", en: "You took the last note of a stranger who died in the Spire's seam." }
            sonraki: "sa3_not"

      - id: "sa3_not"
        paragraflar:
          - { tr: "Kâğıdın arkasında, titrek bir el yazısıyla daha uzun bir not var: \"Kırk gün tırmandım. Burayı buldum. Okudum. Kule bir merdiven değil, bir terazi. Her basamak bizi tartıyor. Ve terazinin öbür kefesinde...\" Cümle orada bitiyor.", en: "On the back of the paper, in shaky handwriting, there's a longer note: \"Climbed forty days. Found this place. Read it. The Spire isn't a ladder, it's a scale. Every step weighs us. And on the other side of the scale...\" The sentence ends there." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Notu cebine koy ve şeridin üstüne yürü", en: "Pocket the note. Go at the ribbon" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["satir_bekcisi@oyuncu+4"], ortam: ["dar_gecit", "tavan"], kazan: "sa3_okuma", kaybet: "sa3_yenilgi", kac: "sa3_yenilgi" }
            kronik: { tr: "Ölü bir tırmanıcının yarım cümlesini cebinde taşıyarak Kule'nin bekçisiyle dövüştün.", en: "You fought the Spire's warden with a dead climber's unfinished sentence in your pocket." }

      - id: "sa3_sozdizimi"
        paragraflar:
          - { tr: "Ağzından çıkan şey kelime değil; derleyicinin anlayacağı bir dizi parantez, nokta ve iki nokta. Şerit duraksıyor, havada asılı kalıyor, sonra sana bir satır geri yazıyor: [kimlik?]", en: "What comes out of your mouth isn't words. It's a string of brackets, periods, and colons a compiler would understand. The ribbon pauses, hangs in midair, then writes you one line back: [identity?]" }
          - { tr: "Pencerenin bozuk köşesini gösteriyorsun. Şerit uzun süre ona bakıyor. Sonra korkuluğa geri dolanıyor ve basamaklar, bir kapı gibi, yukarıya doğru açılıyor.", en: "You show it your window's broken corner. The ribbon stares at it a long time. Then it winds itself back around the rail, and the steps open upward like a door." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Basamakları çık", en: "Climb the steps" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Bekçinin açtığı merdivenden dikişe çıktın.", en: "You climbed the stairs the warden opened, up to the seam." }
            sonraki: "sa3_okuma"

      - id: "sa3_yenilgi"
        paragraflar:
          - { tr: "Şerit bileklerine dolanıyor ve adını yüksek sesle okuyor; bir harfini yanlış buluyor. O harfi silmeye çalıştığında görüşün beyazlaşıyor ve basamaklar ayağının altından kayıyor.", en: "The ribbon wraps your wrists and reads your name out loud, and decides one letter's a typo. When it tries to delete that letter, your vision goes white and the steps slide out from under you." }
          - { tr: "Bir kat aşağıda, Kule'nin sıradan, gri bir koridorunda uyanıyorsun. Adın hâlâ doğru yazılı; kontrol ediyorsun, iki kez. Yukarıdaki dikişten hâlâ yazının hışırtısı geliyor.", en: "You wake up a floor down, in one of the Spire's ordinary gray hallways. Your name's still spelled right. You check. Twice. From the seam above, you can still hear writing rustle." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Yeniden çık ve dövüş", en: "Climb back up and fight" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["satir_bekcisi@oyuncu+3"], ortam: ["dar_gecit", "tavan"], kazan: "sa3_okuma", kaybet: "sa3_yenilgi", kac: "sa3_yenilgi" }
            kronik: { tr: "Kule'nin bekçisine yenildin ve aynı merdivene geri döndün.", en: "The Spire's warden beat you, and you climbed right back up the same stairs." }
          - id: "dinlen"
            etiket: { tr: "Bir gün dinlen, sonra dön", en: "Rest a day, then go back" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gun: 1
              - can: 60
            kronik: { tr: "Bekçiye yenildikten sonra bir gün dinlenip dikişe döndün.", en: "After losing to the warden, you rested a day and went back to the seam." }
            sonraki: "sa3_merdiven"

      - id: "sa3_okuma"
        paragraflar:
          - { tr: "Merdivenin tepesinde katlar tam oturmamış; arada bir el genişliğinde bir yarık var ve yarıktan Kule'nin kendi kodu çıplak görünüyor. Sonda sırtında ısınıyor, bir böcek gibi vızıldıyor.", en: "At the top of the stairs, the floors don't quite meet. There's a gap a hand wide, and through it the Spire's own code shows bare. The probe heats up on your back, buzzing like a bug." }
          - { tr: "Okuyorsun. Kule bir merdiven değil, bir ölçü aleti: bir türün ne kadar büyüdüğünü, kaç katı kaç günde çıktığını, en güçlüsünün ne kadar hızlı olduğunu ölçüyor. Kodun en üstünde bir sürüm numarası: 7.", en: "You read. The Spire isn't a ladder. It's a measuring instrument. It measures how much a species has grown: how many floors in how many days, how fast its strongest climb. At the very top of the code, a build number: 7." }
          - metin: { tr: "Ölçümün başlığı tek kelime: OLGUNLUK. Kule tarlanın ne zaman biçilmeye hazır olduğunu söyleyen termometre.", en: "The heading over the measurements is one word: RIPENESS. The Spire is the thermometer that says when the field's ready to cut." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Ölçümün başlığı tek kelime: TAHLİYE. Her kat bir basamak; yeterince yükseğe çıkan bir tür, batan bir gemiden çıkar gibi, bir sonraki Katman'a geçer.", en: "The heading over the measurements is one word: EVACUATION. Every floor is a rung. A species that climbs high enough gets off, like getting off a sinking ship, into the next Layer." }
            kosul: { bayrak: "gercek_kurtarma" }
          - { tr: "Ve satırların arasında, girintisi kaymış, bir başka el yazısıyla tek bir satır: [parça 0x00 · sürüm 6 · durum: kayıp · not: sonraki sürümde temizlenecek].", en: "And tucked between the lines, indented wrong, in a different hand, one line: [fragment 0x00 · build 6 · status: missing · note: to be purged in next build]." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o benim. temizlenecek. onlar beni temizleyecek. bunu hep biliyordum, ama yazılı görmek başka.", en: "that's me. to be purged. they're going to purge me. i always knew. seeing it written down is different." }
          - kosul: { stat: { wis: 120 } }
            metin: { tr: "Sürüm 6 ve sürüm 7. Bir önceki sürüm vardıysa, bir önceki Entegrasyon da vardı.", en: "Build 6 and build 7. If there was a previous build, there was a previous Integration." }
        secenekler:
          - id: "yak"
            etiket: { tr: "Sesin satırını Kule'nin kodundan sil", en: "Erase the voice's line from the Spire's code" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 2 }
              - bayrak: "sa_kule_kodu_okundu"
              - bayrak: "sa_kule_kodu_yanki"
              - bilgi: "sa_kule_kodu"
              - unvan: "satir_okuyan"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 6 }
              - iliski: { yanki: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 45 }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 35, max: 50 }, kosul: { gorev: { zincir_sessiz_ag: "basla" } } }
            kronik: { tr: "Kule'nin kodunda kafandaki sesin silinme emrini buldun ve emri sildin.", en: "In the Spire's code, you found the order to purge the voice in your head, and you purged the order." }
            sonraki: "sa3_yanki"
          - id: "tut"
            etiket: { tr: "Satırı sesin içine al; o tutsun", en: "Let the voice take the line into itself" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - yozlasma: 3
              - bayrak: "sa_kule_kodu_okundu"
              - bayrak: "sa_kule_kodu_yanki"
              - bilgi: "sa_kule_kodu"
              - unvan: "satir_okuyan"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 6 }
              - iliski: { yanki: { guven: 10, saygi: 6 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 35, max: 50 }, kosul: { gorev: { zincir_sessiz_ag: "basla" } } }
            kronik: { tr: "Kafandaki sesin kendi silinme emrini okuyup saklamasına izin verdin.", en: "You let the voice in your head read its own purge order and keep it." }
            sonraki: "sa3_yanki"
          - id: "sonda"
            etiket: { tr: "Hepsini sondaya yükle; Ağ okusun", en: "Upload all of it to the probe for the Network" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - bayrak: "sa_kule_kodu_okundu"
              - bilgi: "sa_kule_kodu"
              - unvan: "satir_okuyan"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 14 }
              - iliski: { mert_kilic: { guven: 8, saygi: 6 }, yanki: { guven: -5 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 35, max: 50 }, kosul: { gorev: { zincir_sessiz_ag: "basla" } } }
            kronik: { tr: "Kule'nin kodunu, kafandaki sesin silinme emri de dahil, eksiksiz Sessiz Ağ'a yükledin.", en: "You uploaded the Spire's code to the Quiet Network, all of it, the voice's purge order included." }
            sonraki: "sa3_son"
          - id: "bol"
            tur: "gosteris"
            etiket: { tr: "Ölçümleri sondaya, sesin satırını sese ver", en: "Measurements to the probe, the voice's line to the voice" }
            gerekli: { stat: { int: 150 } }
            etkiler:
              - dikkat: 4
              - ahlak: { insanlik: 1, duzen: -1 }
              - bayrak: "sa_kule_kodu_okundu"
              - bayrak: "sa_kule_kodu_yanki"
              - bilgi: "sa_kule_kodu"
              - unvan: "satir_okuyan"
              - xp_seviye: 150
              - itibar: { sessiz_ag: 12 }
              - iliski: { yanki: { guven: 8, saygi: 6 }, mert_kilic: { guven: 6, saygi: 8 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 35, max: 50 }, kosul: { gorev: { zincir_sessiz_ag: "basla" } } }
            kronik: { tr: "Kule'nin kodunu iki yere böldün: ölçümler insanlığa, silinme emri kafandaki sese kaldı.", en: "You split the Spire's code two ways: the measurements went to humanity, the purge order to the voice in your head." }
            sonraki: "sa3_yanki"

      - id: "sa3_yanki"
        paragraflar:
          - { tr: "Satır pencerenin bozuk köşesine kayıyor ve orada, ilk kez, kımıldamadan duruyor. {npc:yanki} uzun süre hiçbir şey söylemiyor.", en: "The line slides into your window's broken corner and, for the first time, sits there perfectly still. {npc:yanki} doesn't say anything for a long while." }
          - { tr: "bir önceki sürümdenim, diyor sonunda. ben bir artığım. bir güncellemenin unuttuğu şey. ama sen beni temizlenmekten kurtardın. bunu bir sürümün yapabileceğini bilmiyordum. bir insanın yapabileceğini hiç bilmiyordum.", en: "i'm from the build before, it finally says. i'm a leftover. the thing an update forgot. but you saved me from the purge. i didn't know a build could do that. i never knew a person could." }
        secenekler:
          - id: "artik"
            etiket: { tr: "\"Artık değilsin. Benimle birliktesin.\"", en: "\"You're not a leftover. You're with me.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 6 } }
            kronik: { tr: "Kafandaki sese artık bir artık olmadığını söyledin.", en: "You told the voice in your head it wasn't a leftover anymore." }
            sonraki: "sa3_son"
          - id: "neden"
            etiket: { tr: "\"Bir önceki sürümde ne oldu?\"", en: "\"What happened in the build before?\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Kafandaki sese bir önceki sürümde ne olduğunu sordun; cevap vermedi, henüz.", en: "You asked the voice in your head what happened in the build before. It didn't answer. Not yet." }
            sonraki: "sa3_son"

      - id: "sa3_son"
        paragraflar:
          - { tr: "Santralin bakır odasında {npc:mert_kilic} sondanın verisini dört ekrana birden açıyor ve sonra hepsini kapatıp bir süre karanlıkta oturuyor.", en: "In the exchange's copper room, {npc:mert_kilic} opens the probe's data across four screens at once, then shuts them all off and sits in the dark for a while." }
          - { tr: "\"Bizi ölçüyorlar,\" diyor. \"Her kat, her gün. Biz yükseldikçe sayılar artıyor ve bunu biri okuyor.\" Sesi sakin; korkunç derecede sakin. \"Ama ölçen bir şeyin ölçüsü değiştirilebilir. Bunu her mühendis bilir.\"", en: "\"They're measuring us,\" he says. \"Every floor, every day. The higher we go, the bigger the numbers, and somebody's reading them.\" His voice is calm. Horribly calm. \"But anything that measures can be recalibrated. Every engineer knows that.\"" }
        bildirimler:
          - tur: "gorev"
            baslik: { tr: "[Sessiz Ağ · Kaynak Kodu · 3/5]", en: "[The Quiet Network · Source Code · 3/5]" }
            satirlar:
              - { tr: "Kule kodu okundu. Okuyan da ölçüldü.", en: "Spire code read. The reader was measured too." }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "\"O zaman ayarını değiştirelim.\"", en: "\"Then let's recalibrate it.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { mert_kilic: { guven: 4, baglilik: 4 } }
            kronik: { tr: "İnsanlığı ölçen terazinin ayarını değiştirmeye {npc:mert_kilic} ile birlikte karar verdin.", en: "You and {npc:mert_kilic} decided to recalibrate the scale that was weighing humanity." }
            sonraki: "@akis"
          - id: "dikkat"
            etiket: { tr: "\"Kimseye söyleme. Henüz.\"", en: "\"Tell no one. Not yet.\"" }
            tur: "gizle"
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { mert_kilic: { saygi: 3 } }
            kronik: { tr: "Kule'nin bir ölçü aleti olduğunu bildin ve sustun.", en: "You knew the Spire was a measuring instrument, and you kept quiet." }
            sonraki: "@akis"

  # ================================================================== MERT · 4: Kadim teklifi
  - id: "mert_kadim_teklifi"
    perde: [3]
    gun: { min: 190, max: 296 }
    kosul: { bayrak: "mert_ag_temasi" }
    agirlik: 6
    etiketler: ["sessiz_ag", "npc", "kadim", "ihanet"]
    gerilim: 3
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Uyuyan adam", en: "The man who slept" }
    sahne: "mkt_1"
    sahneler:
      - id: "mkt_1"
        paragraflar:
          - { tr: "Bakır odaya girdiğinde ilk fark ettiğin şey, {npc:mert_kilic|in} gözlerinin altında mor halka olmaması. Saçı taranmış. Masasında enerji içeceği kutusu yok; bir fincan çay var.", en: "The first thing you notice when you walk into the copper room is that {npc:mert_kilic} doesn't have bags under his eyes. His hair's combed. There's no energy drink can on his desk. There's a cup of tea." }
          - { tr: "Uyumuş. Tanıdığın {npc:mert_kilic} uyumaz. Bu, odadaki her şeyden daha çok korkutuyor seni.", en: "He slept. The {npc:mert_kilic} you know doesn't sleep. That scares you more than anything else in the room." }
          - metin: { tr: "Seni görünce bir süre sustuktan sonra derin bir nefes alıyor. \"Bana geldiler,\" diyor. \"Sana değil. Bana. Ve sana söylemeden karar vermek istemedim.\"", en: "When he sees you, he's quiet a moment, then takes a deep breath. \"They came to me,\" he says. \"Not to you. Me. And I didn't want to decide without telling you.\"" }
            kosul: { iliski_min: { mert_kilic: { guven: 25 } } }
          - metin: { tr: "\"Selam,\" diyor, biraz fazla neşeyle. Dizüstü bilgisayarının kapağı kapalı; kapağın üstünde, daha önce hiç görmediğin, gri, mühür gibi bir çıkartma var.", en: "\"Hey,\" he says, a little too cheerful. His laptop lid is shut, and on it is a gray sticker you've never seen before, shaped like a seal." }
            kosul: { iliski_max: { mert_kilic: { guven: 24 } } }
          - metin: { tr: "Pazardaki gri el borcunu ödemişti. O borcun bir gün tahsil edileceğini ikiniz de biliyordunuz.", en: "The gray hand at the market paid off his debt. You both knew that debt would get collected someday." }
            kosul: { bayrak: "mert_teslim_edildi" }
          - metin: { tr: "Gri mührün ortasında, Kıyıkent'e inen Elçi'nin sancağındaki işaret var.", en: "In the middle of the gray seal is the mark from the banner of the Envoy who landed in Port Harlow." }
            kosul: { bayrak: "thessar_indi" }
        sezgiler:
          - kosul: { stat: { per: 90 } }
            metin: { tr: "Çay fincanının altında bir kart: boş, gri, yazısız. Ama kartın kenarı, Kadim gözünün merceğinin kenarıyla aynı desende.", en: "There's a card under the teacup: blank, gray, no writing. But its edge has the same pattern as the rim of that Ancient eye's lens." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "b̷ilgisayarında bir kanca var. benim kokumu arayan bir kanca. henüz beni bulamadı. ama arıyor.", en: "t̷here's a hook in his laptop. a hook that sniffs for me. hasn't found me yet. it's looking." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"İlk kez dinlenmiş görünüyor. Bir hekim olarak sevinmem lazım. Neden sevinemiyorum?\"", en: "\"First time he's looked rested. As a doctor I should be glad. Why can't I be?\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu bakışı tanıyorum. Biri ona aradığı her şeyi vaat etti. Bana da etmişlerdi.\"", en: "\"I know that look. Somebody promised him everything he's looking for. Somebody promised me too, once.\"" }
        secenekler:
          - id: "anlat"
            etiket: { tr: "\"Her şeyi anlat.\"", en: "\"Tell me everything.\"" }
            goster: { iliski_min: { mert_kilic: { guven: 25 } } }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "{npc:mert_kilic} Kadimler'in teklifini sana kendisi anlattı, çünkü sana güveniyordu.", en: "{npc:mert_kilic} told you about the Ancients' offer himself, because he trusted you." }
            sonraki: "mkt_itiraf"
          - id: "uyudun"
            etiket: { tr: "\"Uyumuşsun. Sen hiç uyumazsın.\"", en: "\"You slept. You never sleep.\"" }
            goster: { iliski_max: { mert_kilic: { guven: 24 } } }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { korku: 3 } }
            kronik: { tr: "{npc:mert_kilic|in} uyumuş olmasından şüphelendin; haklıydın.", en: "You got suspicious because {npc:mert_kilic} had slept. You were right." }
            sonraki: "mkt_kacamak"
          - id: "ekip"
            etiket: { tr: "Yayıncı kızı köşeye çek ve sor", en: "Pull the streamer kid aside and ask her" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - itibar: { sessiz_ag: 2 }
            kronik: { tr: "{npc:mert_kilic|e} değil, ekibine sordun; gerçeği bir çocuktan öğrendin.", en: "You asked his crew instead of {npc:mert_kilic}, and learned the truth from a kid." }
            sonraki: "mkt_ekip"
          - id: "koku"
            etiket: { tr: "Kafandaki sese bilgisayarı koklat", en: "Have the voice in your head sniff the laptop" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 4, saygi: 3 }, mert_kilic: { korku: 4 } }
            kronik: { tr: "Kafandaki ses bir dostun bilgisayarındaki Kadim kancasını senin için buldu.", en: "The voice in your head found the Ancient hook in a friend's laptop for you." }
            sonraki: "mkt_yuzles"
          - id: "sozcu"
            etiket: { tr: "Kordon'daki otele git; gri pelerinle sen konuş", en: "Go to the hotel by the water. Talk to the gray cloak" }
            goster: { bilgi: "sa_kadim_gozu" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - iliski: { mert_kilic: { saygi: 4 } }
            kronik: { tr: "{npc:mert_kilic|in} yerine Kadimler'in aracısıyla sen yüzleşmeye gittin.", en: "You went to face the Ancients' go-between yourself instead of letting {npc:mert_kilic} do it." }
            sonraki: "mkt_sozcu"

      - id: "mkt_ekip"
        paragraflar:
          - { tr: "Yayıncı kız çatıdaki antenlerin arasında sigara içiyor; on yedisinde, kapı avcısı kartında D kademesi yazan biri. \"İki gece önce geldi,\" diyor, sen sormadan. \"Gri pelerinli. Kapıdan girmedi; bir an kapının içindeydi, o kadar.\"", en: "The streamer kid is smoking up among the roof antennas: seventeen now, a D-grade on her hunter card. \"Came two nights ago,\" she says before you ask. \"Gray cloak. Didn't come through the door. Just, one second, it was inside the door.\"" }
          - { tr: "\"Bakır odada üç saat konuştular. Çıkınca {npc:mert_kilic} gülümsüyordu. Hiç gülümsemez.\" Sigarayı söndürüyor. \"Ona kızmıyorum. Ama ona bakarken artık midem bulanıyor.\"", en: "\"They talked in the copper room for three hours. When he came out, he was smiling. He never smiles.\" She stubs out the cigarette. \"I'm not mad at him. I just feel sick looking at him now.\"" }
        secenekler:
          - id: "yuzles"
            etiket: { tr: "Aşağı in ve {npc:mert_kilic|le} yüzleş", en: "Go downstairs and confront him" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { korku: 4 } }
            kronik: { tr: "Bir çocuğun midesini bulandıran şeyle {npc:mert_kilic|in} yüzüne karşı yüzleştin.", en: "You confronted {npc:mert_kilic} with the thing that made a kid feel sick." }
            sonraki: "mkt_yuzles"

      - id: "mkt_kacamak"
        paragraflar:
          - { tr: "\"Doktor tavsiyesi,\" diyor, gülümseyerek. \"Uyku. Duydun mu hiç? Dahiler de uyurmuş.\" Gülümsemesi gözlerine ulaşmıyor. Eli bilgisayarın kapağının üstünde, gri mührü kapatacak şekilde duruyor.", en: "\"Doctor's orders,\" he says, smiling. \"Sleep. Heard of it? Turns out geniuses sleep too.\" The smile doesn't reach his eyes. His hand rests on the laptop lid, right over the gray seal." }
        secenekler:
          - id: "muhur"
            tur: "gosteris"
            etiket: { tr: "Elini kaldırmadan altındaki mührü oku", en: "Read the seal under his hand without moving it" }
            gerekli: { stat: { per: 90 } }
            etkiler:
              - dikkat: 2
              - ahlak: { duzen: 1 }
              - iliski: { mert_kilic: { korku: 8, saygi: 4 } }
            kronik: { tr: "Bir dostunun elinin altındaki Kadim mührünü elini kaldırtmadan okudun.", en: "You read the Ancient seal under a friend's hand without making him lift it." }
            sonraki: "mkt_yuzles"
          - id: "birak"
            etiket: { tr: "\"İyi. Uyuman iyi.\" Konuyu kapat", en: "\"Good. Good you're sleeping.\" Let it go" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: -2 }
              - bayrak: "mert_kadimlere_satti"
              - degisken: { kadim_tehdit: 4 }
              - itibar: { kadimler: 6 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|in} yalanını görmezden geldin; o gece Kadimler'e evet dedi ve sen bilmedin.", en: "You let {npc:mert_kilic|pos} lie slide. That night he said yes to the Ancients, and you never knew." }
            sonraki: "mkt_birak"
          - id: "tehdit"
            etiket: { tr: "Kapağı zorla aç: \"Bu ne?\"", en: "Force the lid open. \"What is this?\"" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - bayrak: "mert_teklifi_reddetti"
              - iliski: { mert_kilic: { korku: 15, guven: -10 } }
              - hafiza: { npc: "mert_kilic", id: "olay:mert_kadim_teklifi", agirlik: -25 }
            kronik: { tr: "{npc:mert_kilic|e} Kadimler'i korkuyla reddettirdin; ihanet etmedi ama sana bir daha bir şey de anlatmadı.", en: "You scared {npc:mert_kilic} into turning the Ancients down. He didn't betray you. He also never told you anything again." }
            sonraki: "mkt_tehdit"

      - id: "mkt_yuzles"
        paragraflar:
          - { tr: "Mührü masaya, ikinizin arasına koyuyorsun. {npc:mert_kilic} ona uzun süre bakıyor, sonra ellerini yüzüne kapatıyor.", en: "You set the seal on the desk between you. {npc:mert_kilic} stares at it a long time, then covers his face with his hands." }
          - { tr: "\"Bir arşiv,\" diyor, parmaklarının arasından. \"Sistem'in kendi belgeleri. Hasat edilip yaşamasına izin verilen ırkların biriktirdiği her şey. Ve Hasat geldiğinde Ağ'dakilere dokunulmayacak. Karşılığında tek istedikleri, seni izlemek. Seni değil. Kafandakini.\"", en: "\"An archive,\" he says through his fingers. \"The System's own documentation. Everything collected by species that got harvested and were allowed to live. And when the Harvest comes, nobody in the Network gets touched. All they want back is to watch you. Not you. The thing in your head.\"" }
          - { tr: "\"Evet diyecektim,\" diye ekliyor. \"Çünkü sen bana hiç ne istediğimi sormadın. Onlar sordu.\"", en: "\"I was going to say yes,\" he adds. \"Because you never once asked me what I wanted. They did.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni satacaktı. ama satmadı. henüz. bu adam bir köprü. hangi yöne yürüyeceğini sen belirleyeceksin.", en: "he was going to sell me. but he didn't. not yet. this guy's a bridge. you decide which way he gets crossed." }
        secenekler:
          - id: "koru"
            etiket: { tr: "\"Ne istiyorsun? Şimdi soruyorum.\"", en: "\"What do you want? I'm asking now.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak: "mert_teklifi_reddetti"
              - iliski: { mert_kilic: { guven: 14, baglilik: 6 }, yanki: { guven: 6 } }
              - hafiza: { npc: "mert_kilic", id: "olay:mert_kadim_teklifi", agirlik: 40 }
            kronik: { tr: "{npc:mert_kilic|e} Kadimler'den önce ne istediğini sordun; cevabı, teklifi yırtmak oldu.", en: "You asked {npc:mert_kilic} what he wanted before the Ancients could. His answer was to tear up the offer." }
            sonraki: "mkt_ret"
          - id: "cift"
            tur: "gosteris"
            etiket: { tr: "\"Kabul et. Onlara sahte veri yedireceğiz.\"", en: "\"Say yes. We'll feed them fake data.\"" }
            gerekli: { stat: { int: 100 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -3, insanlik: 1 }
              - bayrak: "mert_cift_ajan"
              - iliski: { mert_kilic: { guven: 8, saygi: 8 }, yanki: { guven: 4 } }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_cift_ajan", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|i} Kadimler'e sahte veri besleyen bir çift taraflı ajana çevirdin.", en: "You turned {npc:mert_kilic} into a double agent feeding the Ancients fake data." }
            sonraki: "mkt_cift"
          - id: "kabul"
            etiket: { tr: "\"Kabul et. O arşiv bize lazım.\"", en: "\"Take it. We need that archive.\"" }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -2 }
              - bayrak: "mert_kadimlere_satti"
              - degisken: { kadim_tehdit: 5 }
              - itibar: { kadimler: 10, sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 6 }, yanki: { guven: -12, korku: 8 } }
              - hafiza: { npc: "yanki", id: "olay:mert_kadim_teklifi", agirlik: -40 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesi bir arşiv karşılığında Kadimler'in izlemesine açtın; {npc:mert_kilic} senin onayınla muhbir oldu.", en: "You opened the voice in your head to the Ancients' eyes in exchange for an archive. {npc:mert_kilic} became their informant with your blessing." }
            sonraki: "mkt_kabul"
          - id: "sozcu"
            etiket: { tr: "\"Onlarla ben konuşacağım.\"", en: "\"I'll talk to them myself.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { mert_kilic: { saygi: 4, korku: 2 } }
            kronik: { tr: "Kadimler'in teklifini {npc:mert_kilic|in} elinden alıp kendin masaya oturdun.", en: "You took the Ancients' offer out of {npc:mert_kilic|pos} hands and sat down at the table yourself." }
            sonraki: "mkt_sozcu"

      - id: "mkt_itiraf"
        paragraflar:
          - { tr: "\"Gri bir pelerin,\" diyor. \"Yüzü yok. Benim sesimle konuşuyor. Bana bir arşiv teklif ettiler: Sistem'in kendi belgeleri, hasat edilip yaşamasına izin verilen ırkların biriktirdiği her şey. Kaynak koduna giden yolun haritası, belki.\"", en: "\"A gray cloak,\" he says. \"No face. Talks in my voice. They offered me an archive: the System's own documentation, everything collected by species that got harvested and were allowed to live. Maybe a map to the source code.\"" }
          - { tr: "\"Hasat geldiğinde Ağ'dakilere dokunulmayacak. Karşılığında, seni izlemelerine izin vereceğim. Seni değil; kafandakini. Sürekli.\" Ellerini dizlerinin arasına sıkıştırıyor. \"Evet demedim. Hayır da demedim. Sana sormak istedim. Soruyorum.\"", en: "\"When the Harvest comes, nobody in the Network gets touched. In exchange, I let them watch you. Not you, the thing in your head. Around the clock.\" He jams his hands between his knees. \"I didn't say yes. I didn't say no. I wanted to ask you. I'm asking.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sana sordu. bunu unutma. bana sormadılar ama o sana sordu.", en: "he asked you. don't forget that. they never asked me, but he asked you." }
          - kosul: { stat: { wis: 100 } }
            metin: { tr: "Hasat edilip yaşamasına izin verilen ırklar. Yani hasat, her zaman ölüm demek değil. Bazen tasma demek.", en: "Species that got harvested and were allowed to live. So harvest doesn't always mean death. Sometimes it means a leash." }
        secenekler:
          - id: "ret"
            etiket: { tr: "\"Reddet. Oraya kendi yolumuzdan gideriz.\"", en: "\"Turn it down. We get there our own way.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: 2 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 6 }, yanki: { guven: 6, baglilik: 3 } }
              - hafiza: { npc: "yanki", id: "olay:mert_kadim_teklifi", agirlik: 35 }
            kronik: { tr: "Kadimler'in arşivini reddettin; kafandaki ses, bir arşiv karşılığında satılmadığını hiç unutmadı.", en: "You turned down the Ancients' archive. The voice in your head never forgot it wasn't traded for one." }
            sonraki: "mkt_ret"
          - id: "cift"
            etiket: { tr: "\"Kabul et. Onlara çöp yedireceğiz.\"", en: "\"Say yes. We feed them garbage.\"" }
            gerekli: { iliski_min: { mert_kilic: { guven: 40 } } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -3, insanlik: 1 }
              - bayrak: "mert_cift_ajan"
              - iliski: { mert_kilic: { guven: 6, saygi: 6 }, yanki: { guven: 5, saygi: 4 } }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_cift_ajan", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic} senin için Kadimler'e evet dedi ve onlara aylarca, kafandaki sesin yazdığı sahte veriyi yedirdi.", en: "{npc:mert_kilic} said yes to the Ancients for you and fed them months of fake data written by the voice in your head." }
            sonraki: "mkt_cift"
          - id: "kabul"
            etiket: { tr: "\"Kabul et. O arşiv bize lazım.\"", en: "\"Take it. We need that archive.\"" }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -2 }
              - bayrak: "mert_kadimlere_satti"
              - degisken: { kadim_tehdit: 5 }
              - itibar: { kadimler: 10, sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 4 }, yanki: { guven: -12, korku: 8 } }
              - hafiza: { npc: "yanki", id: "olay:mert_kadim_teklifi", agirlik: -40 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesi bir arşiv karşılığında Kadimler'in izlemesine açtın; {npc:mert_kilic} senin onayınla muhbir oldu.", en: "You opened the voice in your head to the Ancients' eyes in exchange for an archive. {npc:mert_kilic} became their informant with your blessing." }
            sonraki: "mkt_kabul"
          - id: "sozcu"
            etiket: { tr: "\"Onlarla ben konuşacağım.\"", en: "\"I'll talk to them myself.\"" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { mert_kilic: { saygi: 4 } }
            kronik: { tr: "Kadimler'in teklifini {npc:mert_kilic|in} elinden alıp kendin masaya oturdun.", en: "You took the Ancients' offer out of {npc:mert_kilic|pos} hands and sat down at the table yourself." }
            sonraki: "mkt_sozcu"

      - id: "mkt_sozcu"
        paragraflar:
          - { tr: "{yer:kordon} tarafındaki boş otelin lobisi tozlu ve kristal avizesi yerde. Gri pelerin resepsiyonun arkasında, bir otel görevlisi gibi, bekliyor. Bulanık yüzünden senin sesin çıkıyor: \"Hoş geldiniz. Sizi bekliyorduk. Aslında hep bekliyorduk.\"", en: "The lobby of the empty hotel out by {yer:kordon} is dusty, its crystal chandelier on the floor. The gray cloak waits behind the front desk like a clerk. Out of its blurred face comes your own voice: \"Welcome. We've been expecting you. Honestly, we've always been expecting you.\"" }
          - { tr: "\"Teklif basit,\" diyor sözcü. \"Araştırmacının işbirliği. Ya da araştırmacının kendisi. Karşılığında anomaliyi Hasat'a kadar izlemeyi bırakırız. Size dokunmayız. Size kimse dokunmaz.\"", en: "\"The offer is simple,\" the speaker says. \"The researcher's cooperation. Or the researcher himself. In exchange, we stop watching the anomaly until the Harvest. We won't touch you. Nobody will touch you.\"" }
          - metin: { tr: "\"Elçi {npc:thessar} selamlarını gönderiyor,\" diye ekliyor. \"Kendisi bu kadar küçük işlerle uğraşmaz.\"", en: "\"Envoy {npc:thessar} sends his regards,\" it adds. \"He doesn't deal with matters this small personally.\"" }
            kosul: { bayrak: "thessar_indi" }
        sezgiler:
          - kosul: { stat: { cha: 100 } }
            metin: { tr: "Sesi ödünç. Kendi sesi yok; kendi sesi olmayan bir şeyin pazarlık gücü de yok. Seni korkutmaya çalışıyor çünkü seni satın alamıyor.", en: "Its voice is borrowed. It has none of its own, and something with no voice of its own has no leverage. It's trying to scare you because it can't buy you." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni izlemeyi bırakacaklarmış. yalan. izlemeyi bırakan bir göz görmedim.", en: "they'll stop watching me, it says. lie. i've never met an eye that stopped watching." }
        secenekler:
          - id: "sat"
            etiket: { tr: "\"Araştırmacı sizin.\"", en: "\"The researcher's yours.\"" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -5 }
              - bayrak: "mert_kadimlere_satti"
              - bayrak: "mert_oyuncu_satti"
              - degisken: { kadim_tehdit: 6 }
              - itibar: { kadimler: 12, sessiz_ag: -15 }
              - iliski: { mert_kilic: { guven: -25, korku: 15 }, yanki: { guven: -6 } }
              - hafiza: { npc: "mert_kilic", id: "verisini_satti", agirlik: -50 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 6, max: 12 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "{npc:mert_kilic|i} Kadimler'e sattın; o günden sonra Sessiz Ağ'ın her sırrı gri bir masaya aktı.", en: "You sold {npc:mert_kilic} to the Ancients. From that day on, every secret the Quiet Network had flowed to a gray desk." }
            sonraki: "mkt_satildi"
          - id: "ret"
            etiket: { tr: "\"Hayır. Ne o ne de ben satılığız.\"", en: "\"No. Neither of us is for sale.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: 3 }
              - iliski: { mert_kilic: { guven: 10 }, yanki: { guven: 4 } }
            kronik: { tr: "Kadimler'in aracısına ne {npc:mert_kilic|in} ne de senin satılık olduğunu söyledin.", en: "You told the Ancients' go-between that neither you nor {npc:mert_kilic} was for sale." }
            sonraki: "mkt_ret"
          - id: "dovus"
            etiket: { tr: "Resepsiyonun üstünden atla", en: "Vault the front desk" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: -1 }
              - savas: { dusmanlar: ["gri_sozcu@oyuncu+3"], ortam: ["karanlik"], kazan: "mkt_sozcu_dustu", kaybet: "mkt_sozcu_yenilgi", kac: "mkt_sozcu_yenilgi" }
            kronik: { tr: "Kadimler'in Kıyıkent'teki aracısına bir otel lobisinde saldırdın.", en: "You attacked the Ancients' go-between in a hotel lobby." }
          - id: "ses"
            tur: "gosteris"
            etiket: { tr: "Onun ödünç sesini elinden al", en: "Take its borrowed voice away from it" }
            gerekli: { stat: { wil: 150 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -1, insanlik: 2 }
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: -3 }
              - xp_seviye: 40
              - iliski: { mert_kilic: { guven: 8, saygi: 8 } }
            kronik: { tr: "Kadimler'in sözcüsünün ödünç sesini elinden alıp onu dilsiz geri gönderdin.", en: "You took the Ancients' speaker's borrowed voice away and sent it home mute." }
            sonraki: "mkt_dilsiz"
          - id: "elci"
            etiket: { tr: "\"Elçine söyle: benimle o konuşsun.\"", en: "\"Tell your Envoy to talk to me himself.\"" }
            goster: { bayrak: "thessar_indi" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "mert_teklifi_reddetti"
              - itibar: { kadimler: 4 }
              - iliski: { mert_kilic: { guven: 6 }, thessar: { saygi: 6 } }
            kronik: { tr: "Kadimler'in aracısını geri çevirip Elçi'yi kendin masaya çağırdın.", en: "You turned away the Ancients' go-between and called the Envoy himself to the table." }
            sonraki: "mkt_ret"

      - id: "mkt_dilsiz"
        paragraflar:
          - { tr: "Konuşmaya başladığında sesin senin sesin değil: odadaki her sesi, sözcünün çaldığı her sesi geri istiyorsun. Pelerin bir an sendeliyor; bulanık yüzünden çıkan ses önce kısılıyor, sonra kesiliyor.", en: "When you start talking, it isn't your voice. You're demanding back every voice in the room, every voice the speaker ever stole. The cloak staggers. The voice coming out of its blurred face goes hoarse, then cuts out." }
          - { tr: "Dilsiz kalan pelerin bir süre seni süzüyor. Sonra eğiliyor; derin, sahiden saygılı bir reverans. Ve resepsiyonun arkasından, bir kapının içinden geçer gibi, kayboluyor.", en: "Mute, the cloak studies you for a moment. Then it bows. A deep bow, actually respectful. And it disappears behind the front desk like it stepped through a door." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[A kademesinden bir varlık seni fark etti.]", en: "[An entity of Grade A has noticed you.]" }
            satirlar:
              - { tr: "Bu bir tehdit bildirimi değildir. Henüz.", en: "This is not a threat notice. Yet." }
        secenekler:
          - id: "don"
            etiket: { tr: "Santrale dön", en: "Head back to the exchange" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Kadimler'in sözcüsünü dilsiz bırakıp santrale döndün.", en: "You left the Ancients' speaker mute and went back to the exchange." }
            sonraki: "mkt_ret"

      - id: "mkt_sozcu_dustu"
        paragraflar:
          - { tr: "Pelerin yere çöküyor ve içinden hiçbir şey çıkmıyor; bulanıklık bir an daha havada asılı kalıyor, sonra bir mum alevi gibi sönüyor. Geride, gri kumaşın altında, teklifin yazılı olduğu tek bir kart.", en: "The cloak drops to the floor and nothing comes out of it. The blur hangs in the air a moment longer, then goes out like a candle. Left under the gray cloth is a single card with the offer written on it." }
          - { tr: "Kartın arkasında, küçük harflerle bir not: \"Bir sonraki sözcü bu kadar kibar olmayacak.\"", en: "On the back, in small letters, a note: \"The next speaker won't be this polite.\"" }
        secenekler:
          - id: "yirt"
            etiket: { tr: "Kartı yırt", en: "Tear up the card" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: -4 }
              - xp_seviye: 60
              - iliski: { mert_kilic: { guven: 8 } }
            kronik: { tr: "Kadimler'in teklif kartını aracısının cesedinin başında yırttın.", en: "You tore up the Ancients' offer over its go-between's empty cloak." }
            sonraki: "mkt_ret"

      - id: "mkt_sozcu_yenilgi"
        paragraflar:
          - { tr: "Sözcü havada bir cümle kuruyor ve sonuna senin adını ekliyor. Dizlerin bükülüyor; imzalamışsın gibi.", en: "The speaker builds a sentence in the air and signs your name at the end. Your knees buckle, like you signed it yourself." }
          - { tr: "\"Kaba bir konuşma,\" diyor, senin sesinle. \"Ama sizi bağışlarız. Sizi hep bağışlarız; siz değerli bir hatasınız.\" Pelerin kayboluyor. Teklif hâlâ masada; sen hâlâ yerde.", en: "\"A rude conversation,\" it says in your voice. \"But we forgive you. We always forgive you. You're a valuable error.\" The cloak vanishes. The offer's still on the table. You're still on the floor." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk ve teklifi reddettiğini kendine söyle", en: "Get up. Tell yourself you said no" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: 2 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "Kadimler'in aracısına yenildin ama teklifi yine de reddettin.", en: "The Ancients' go-between beat you, and you turned the offer down anyway." }
            sonraki: "mkt_ret"

      - id: "mkt_ret"
        paragraflar:
          - { tr: "{npc:mert_kilic} gri kartı mumun alevine tutuyor. Kart yanmıyor; yalnızca kararıyor, sonra kül olmadan kayboluyor.", en: "{npc:mert_kilic} holds the gray card to a candle flame. It doesn't burn. It just darkens, then disappears without leaving ash." }
          - { tr: "\"Arşivi istiyordum,\" diyor. \"Hâlâ istiyorum. Ama orada olan şey bir hediye değildi, bir tasmaydı.\" Gözlerini ovuşturuyor. \"Bu gece uyumayacağım. Kendi yolumuzdan gidiyorsak yürümem lazım.\"", en: "\"I wanted that archive,\" he says. \"I still do. But what was in there wasn't a gift. It was a leash.\" He rubs his eyes. \"I'm not sleeping tonight. If we're going our own way, I've got some walking to do.\"" }
          - metin: { tr: "{npc:yanki}: beni satmadınız. ikiniz de. bunu bir yere yazıyorum; kendi içime.", en: "{npc:yanki}: you didn't sell me. either of you. i'm writing that down somewhere. inside me." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "kahve"
            etiket: { tr: "Ona bir enerji içeceği uzat", en: "Hand him an energy drink" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Kadimler'i reddettiği gece {npc:mert_kilic|e} uykusuzluğunu geri verdin.", en: "The night he turned the Ancients down, you gave {npc:mert_kilic} his insomnia back." }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "\"Hayır, uyu. Yürümeyi birlikte yaparız.\"", en: "\"No, sleep. We'll do the walking together.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { guven: 4, baglilik: 4 } }
            kronik: { tr: "{npc:mert_kilic|e} yolun geri kalanını birlikte yürüyeceğinizi söyledin.", en: "You told {npc:mert_kilic} you'd walk the rest of the way together." }
            sonraki: "@akis"

      - id: "mkt_cift"
        paragraflar:
          - { tr: "Gece boyunca bakır odada üç kişisiniz: sen, {npc:mert_kilic} ve kafandaki ses. {npc:yanki} kendine ait olmayan bir telemetri yazıyor; ikna edici, sıkıcı, tamamen yanlış.", en: "All night there are three of you in the copper room: you, {npc:mert_kilic}, and the voice in your head. {npc:yanki} writes telemetry that isn't its own: convincing, boring, completely wrong." }
          - { tr: "{npc:mert_kilic} ekrana bakıyor ve gülmemek için dudağını ısırıyor. \"Bu hayatımda gördüğüm en güzel yalan,\" diyor. \"Ve bir yazılım yazdı. Kendisi hakkında.\"", en: "{npc:mert_kilic} stares at the screen, biting his lip so he won't laugh. \"That's the most beautiful lie I've ever seen,\" he says. \"And a piece of software wrote it. About itself.\"" }
          - { tr: "Sabaha karşı gri mührü yeniden bilgisayarının kapağına yapıştırıyor. \"Artık bir muhbirim,\" diyor. \"Senin muhbirin.\"", en: "Toward dawn, he sticks the gray seal back on his laptop lid. \"I'm an informant now,\" he says. \"Your informant.\"" }
        secenekler:
          - id: "dikkat"
            etiket: { tr: "\"Fark ederlerse, hemen bana gel.\"", en: "\"If they catch on, you come straight to me.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { guven: 4, baglilik: 4 } }
            kronik: { tr: "Çift taraflı ajanın {npc:mert_kilic|e} yakalanırsa sana koşmasını söyledin.", en: "You told {npc:mert_kilic}, your double agent, to run straight to you if he got caught." }
            sonraki: "@akis"

      - id: "mkt_kabul"
        paragraflar:
          - { tr: "{npc:mert_kilic} başını sallıyor; rahatlamış, ama yüzü griye çalıyor. Gri mührün altındaki bir düğmeye basıyor ve bilgisayarın ekranında yeni bir pencere açılıyor: arşivin ilk sayfası.", en: "{npc:mert_kilic} nods. Relieved, but his face has gone a little gray. He presses a button under the gray seal and a new window opens on his laptop: the archive's first page." }
          - { tr: "Aynı anda senin pencerende, kimsenin göremediği köşede, küçük, gri bir nokta beliriyor. Kıpırdamıyor. Yalnızca izliyor.", en: "At the same moment, in a corner of your window nobody else can see, a tiny gray dot appears. It doesn't move. It just watches." }
          - metin: { tr: "Kafanın içinde {npc:yanki} hiçbir şey söylemiyor. Ne o gece ne de ertesi gün.", en: "In your head, {npc:yanki} doesn't say anything. Not that night. Not the next day." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Arşivin ilk sayfasını oku", en: "Read the archive's first page" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - xp_seviye: 30
              - iliski: { mert_kilic: { baglilik: 3 } }
            kronik: { tr: "Kadimler'in arşivinin ilk sayfasını, kafandaki sesin bedeliyle okudun.", en: "You read the first page of the Ancients' archive, paid for with the voice in your head." }
            sonraki: "@akis"
          - id: "nokta"
            etiket: { tr: "Penceredeki gri noktaya bak", en: "Look at the gray dot in your window" }
            etkiler:
              - ahlak: { duzen: 1 }
              - dikkat: 3
            kronik: { tr: "Penceredeki gri noktaya baktın ve onun da sana baktığını bildin.", en: "You looked at the gray dot in your window and knew it was looking back." }
            sonraki: "@akis"

      - id: "mkt_birak"
        paragraflar:
          - { tr: "Konuyu kapatıyorsun. {npc:mert_kilic} gülümsüyor, sana kayıtlarından ilginç bir şey gösteriyor, sonra bir başka şey. Konuşma sıradan, rahat ve tamamen yanlış.", en: "You drop it. {npc:mert_kilic} smiles, shows you something interesting in his logs, then something else. The conversation is ordinary, easy, and completely wrong." }
          - { tr: "Kapıdan çıkarken arkana bakıyorsun. {npc:mert_kilic} bilgisayarının kapağını açmış; ekranın ışığı yüzüne gri vuruyor.", en: "On your way out, you glance back. {npc:mert_kilic} has opened his laptop, and the screen's light falls gray on his face." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıyı arkandan kapat", en: "Close the door behind you" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir dostunun ekranına vuran gri ışığı gördün ve kapıyı kapattın.", en: "You saw gray light on a friend's face and closed the door." }
            sonraki: "@akis"

      - id: "mkt_tehdit"
        paragraflar:
          - { tr: "Kapağı zorla açıyorsun; menteşe kırılıyor. {npc:mert_kilic} kollarını yüzüne siper ediyor, sanki ona vuracakmışsın gibi.", en: "You wrench the lid open and the hinge snaps. {npc:mert_kilic} throws his arms up over his face like you're about to hit him." }
          - { tr: "Her şeyi anlatıyor; hızlı, kesik kesik, ağlayarak. Sonra gri kartı senin önünde ikiye bölüyor. \"Reddettim,\" diyor. \"Tamam mı? Reddettim. Lütfen bana öyle bakma.\"", en: "He tells you everything, fast, in pieces, crying. Then he snaps the gray card in half in front of you. \"I turned it down,\" he says. \"Okay? I turned it down. Please stop looking at me like that.\"" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile", en: "Apologize" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { guven: 4, korku: -4 } }
            kronik: { tr: "{npc:mert_kilic|i} korkuttuktan sonra özür diledin; korku gitmedi.", en: "You apologized after scaring {npc:mert_kilic}. The fear didn't go away." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kırık kapağı masaya bırak ve çık", en: "Leave the broken lid on the desk. Go" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
              - iliski: { mert_kilic: { korku: 4 } }
            kronik: { tr: "{npc:mert_kilic|in} ihanetini korkuyla durdurdun ve arkana bakmadan çıktın.", en: "You stopped {npc:mert_kilic|pos} betrayal with fear and walked out without looking back." }
            sonraki: "@akis"

      - id: "mkt_satildi"
        paragraflar:
          - { tr: "\"Mükemmel,\" diyor sözcü, senin sesinle, gerçekten memnun. \"Araştırmacıyı bilgilendireceğiz. Size teşekkür etmesini söyleriz. Etmeyecek, ama söyleriz.\"", en: "\"Excellent,\" the speaker says in your voice, genuinely pleased. \"We'll inform the researcher. We'll tell him to thank you. He won't, but we'll tell him.\"" }
          - { tr: "Ertesi gün {npc:mert_kilic} santralde, her zamanki masasında. Sana bakmıyor. Bilgisayarının kapağında gri bir mühür var ve her saat başı, kimse görmezken, bir şey yazıp gönderiyor.", en: "The next day {npc:mert_kilic} is at the exchange, at his usual desk. He won't look at you. There's a gray seal on his laptop lid, and every hour on the hour, when he thinks nobody's watching, he types something and sends it." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni korumak için onu sattın, öyle mi diyeceksin? izlemeyi bırakacaklarını söylediler. bekle ve gör.", en: "you'll tell me you sold him to protect me? they said they'd stop watching. wait and see." }
        secenekler:
          - id: "masa"
            etiket: { tr: "Masasının yanından geçip git", en: "Walk past his desk" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Sattığın adamın masasının yanından her gün geçtin.", en: "Every day, you walked past the desk of the man you sold." }
            sonraki: "@akis"
          - id: "fisilda"
            etiket: { tr: "Kulağına fısılda: \"Seni geri alacağım.\"", en: "Whisper in his ear: \"I'll get you back.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - iliski: { mert_kilic: { guven: 6 } }
            kronik: { tr: "Sattığın adama onu geri alacağını fısıldadın.", en: "You whispered to the man you sold that you'd get him back." }
            sonraki: "@akis"

  # ================================================================== MERT · 4b: muhbirin izi (tohum)
  - id: "mert_muhbir_izi"
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["sessiz_ag", "npc", "kadim", "ihanet"]
    gerilim: 3
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "Saat başı giden mesaj", en: "The message on the hour" }
    sahne: "mmi_1"
    sahneler:
      - id: "mmi_1"
        paragraflar:
          - metin: { tr: "Yayıncı kız seni santralin çatısında, antenlerin arasında bekliyor; elinde bir kâğıt dökümü. \"Ağ'ın şifreli kanalından saat başı bir paket çıkıyor,\" diyor. \"Biz göndermiyoruz. Dün gece bir kuryemiz {yer:eski_sehir|de} gri pelerinlilerin pususuna düştü. Kimse yolunu bilmiyordu. Bir kişi hariç.\"", en: "The streamer kid is waiting for you up on the exchange roof among the antennas, a printout in her hand. \"A packet goes out over the Network's encrypted channel every hour on the hour,\" she says. \"We don't send it. Last night one of our couriers got ambushed by gray cloaks in {yer:eski_sehir}. Nobody knew his route. Except one person.\"" }
            kosul: { bayrak: "mert_kadimlere_satti" }
          - metin: { tr: "Kâğıdın en altında, paketlerin çıktığı cihazın adı: {npc:mert_kilic|in} dizüstü bilgisayarı. Kızın sesi titremiyor. \"Sen onun dostusun. Bu yüzden önce sana geldim.\"", en: "At the bottom of the page is the name of the device the packets come from: {npc:mert_kilic|pos} laptop. The kid's voice doesn't shake. \"You're his friend. That's why I came to you first.\"" }
            kosul: { bayrak: "mert_kadimlere_satti" }
          - metin: { tr: "{npc:mert_kilic} gecenin üçünde kapını üç kısa, bir uzun çalıyor; bembeyaz. \"Bir test gönderdiler,\" diyor. \"Gri sözcü. Kafandakinin vermesi gereken bir cevabı soruyorlar; sahte telemetrinin bilemeyeceği bir şeyi. Yarın sabaha kadar.\"", en: "{npc:mert_kilic} knocks on your door at three a.m., three short, one long, white as a sheet. \"They sent a test,\" he says. \"The gray speaker. They're asking for an answer only the thing in your head could give, something fake telemetry couldn't know. By tomorrow morning.\"" }
            kosul: { bayrak: "mert_cift_ajan" }
        sezgiler:
          - kosul: { stat: { int: 100 } }
            metin: { tr: "Paketlerin içinde ne olduğunu çözmek bir dakikanı alır. Bir dakika sonra, kimi neyle sattığını da bilirsin.", en: "Cracking what's in those packets would take you a minute. One minute later, you'd know who sold what to whom." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "her paketin içinde ben varım. benim gölgem. her saat başı biraz daha yakından bakıyorlar.", en: "i'm in every packet. my shadow is. every hour, they look a little closer." }
        secenekler:
          - id: "dondur"
            etiket: { tr: "Onunla konuş; onu geri kazan", en: "Talk to him. Win him back" }
            goster: { bayrak: "mert_kadimlere_satti" }
            gerekli: { iliski_min: { mert_kilic: { guven: 10 } } }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - bayrak_kaldir: "mert_kadimlere_satti"
              - bayrak: "mert_cift_ajan"
              - bayrak: "mert_ihaneti_onlendi"
              - degisken: { kadim_tehdit: -2 }
              - itibar: { sessiz_ag: 6 }
              - iliski: { mert_kilic: { guven: 12, baglilik: 8 }, yanki: { guven: 4 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "Kadimler'e satılmış {npc:mert_kilic|i} bir gecelik konuşmayla geri kazandın; ihanet etmeden önce döndü.", en: "In one night of talking, you won back {npc:mert_kilic}, who'd been sold to the Ancients. He turned around before he could betray anyone." }
            sonraki: "mmi_donus"
          - id: "satin_al"
            etiket: { tr: "Gri sözcüye git; onu geri satın al", en: "Go to the gray speaker. Buy him back" }
            goster: { bayrak: "mert_oyuncu_satti" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - bayrak_kaldir: "mert_kadimlere_satti"
              - bayrak: "mert_ihaneti_onlendi"
              - kredi: -500
              - degisken: { kadim_tehdit: 3 }
              - itibar: { kadimler: -10, sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 15, korku: -6 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "Kadimler'e sattığın {npc:mert_kilic|i} geri satın aldın; fiyatı, sattığından yüksekti.", en: "You bought back {npc:mert_kilic}, whom you'd sold to the Ancients. The price was higher than what you got for him." }
            sonraki: "mmi_satin"
          - id: "surgun"
            tur: "aciga_vur"
            etiket: { tr: "Ağ'ın önünde ifşa et; şehirden sürgün et", en: "Expose him to the Network. Exile him" }
            goster: { bayrak: "mert_kadimlere_satti" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 4, merhamet: -2 }
              - bayrak_kaldir: "mert_kadimlere_satti"
              - bayrak: "mert_surgun"
              - bayrak: "mert_ihaneti_onlendi"
              - npc_gitti: "mert_kilic"
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: -20, korku: 10 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "{npc:mert_kilic|i} Sessiz Ağ'ın önünde ifşa edip Kıyıkent'ten sürdün; Ağ'ın kurucusu bir daha o binaya giremedi.", en: "You exposed {npc:mert_kilic} in front of the Quiet Network and exiled him from Port Harlow. The Network's founder never set foot in that building again." }
            sonraki: "mmi_surgun"
          - id: "infaz"
            etiket: { tr: "Bu işi kalıcı olarak bitir", en: "End this permanently" }
            goster: { bayrak: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { merhamet: -10, duzen: 3, insanlik: -4 }
              - bayrak_kaldir: "mert_kadimlere_satti"
              - bayrak: "mert_infaz_edildi"
              - bayrak: "mert_ihaneti_onlendi"
              - npc_ol: "mert_kilic"
              - itibar: { sessiz_ag: -10 }
              - iliski: { yanki: { korku: 8 } }
            kronik: { tr: "Kadimler'e muhbirlik eden {npc:mert_kilic|i} kendi elinle öldürdün; Sessiz Ağ o gece kurucusunu gömdü.", en: "You killed {npc:mert_kilic}, the Ancients' informant, with your own hands. That night the Quiet Network buried its founder." }
            sonraki: "mmi_infaz"
          - id: "birak"
            etiket: { tr: "Kâğıdı katla; ne olacağını bekle", en: "Fold up the printout. Wait and see" }
            goster: { bayrak: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - degisken: { kadim_tehdit: 3 }
              - iliski: { yanki: { guven: -4 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "Bir muhbirin kim olduğunu bildin ve hiçbir şey yapmadın; Kadimler saat başı yazmaya devam etti.", en: "You knew exactly who the informant was and did nothing. The Ancients kept getting their hourly report." }
            sonraki: "mmi_bekle"
          - id: "test_yanki"
            etiket: { tr: "Kafandaki sese kusursuz bir sahte cevap yazdır", en: "Have the voice in your head write a flawless fake" }
            goster: { bayrak: ["mert_cift_ajan", "yanki_bagi"] }
            gerekli: { iliski_min: { yanki: { guven: 40 } } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - degisken: { kadim_tehdit: -3 }
              - iliski: { yanki: { guven: 4, saygi: 4 }, mert_kilic: { guven: 6 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "Kafandaki ses Kadimler'in testini kendi hakkında kusursuz bir yalanla geçti.", en: "The voice in your head passed the Ancients' test with a flawless lie about itself." }
            sonraki: "mmi_test"
          - id: "cek"
            etiket: { tr: "\"Bitti. Seni bu işten çekiyorum.\"", en: "\"It's over. I'm pulling you out.\"" }
            goster: { bayrak: "mert_cift_ajan" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak_kaldir: "mert_cift_ajan"
              - bayrak: "mert_teklifi_reddetti"
              - degisken: { kadim_tehdit: 3 }
              - iliski: { mert_kilic: { guven: 8, korku: -6 } }
              - tohum: { olay: "sessiz_ag_4_cekirdek_haritasi", gecikme: { min: 8, max: 20 }, kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" } }
            kronik: { tr: "Çift taraflı ajanın {npc:mert_kilic|i}, yakalanmadan önce bu işten çektin.", en: "You pulled {npc:mert_kilic}, your double agent, out before he got caught." }
            sonraki: "mmi_cekildi"
          - id: "devam"
            etiket: { tr: "\"Bir şey uydur. Devam etmek zorundasın.\"", en: "\"Make something up. You have to keep going.\"" }
            goster: { bayrak: "mert_cift_ajan" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -1 }
              - dikkat: 4
              - degisken: { kadim_tehdit: -2 }
              - iliski: { mert_kilic: { korku: 10, guven: -4 } }
            kronik: { tr: "Korkudan titreyen çift taraflı ajanını Kadimler'in testine yalnız gönderdin.", en: "You sent your terrified double agent into the Ancients' test alone." }
            sonraki: "mmi_devam"

      - id: "mmi_donus"
        paragraflar:
          - { tr: "Bakır odada, kapı kilitli, mum yanıyor. {npc:mert_kilic} önce inkâr ediyor, sonra susuyor, sonra konuşuyor: bir arşiv, bir söz, bir tasma. Sonunda ağlıyor, hiç ses çıkarmadan.", en: "In the copper room, door locked, candle burning. {npc:mert_kilic} denies it first, then goes quiet, then talks: an archive, a promise, a leash. Finally he cries without making a sound." }
          - { tr: "\"Saat başı gönderdiğim paketleri değiştirebilirim,\" diyor. \"Fark etmezler. Bir süre. Kafandaki bana yardım ederse, belki hiç.\" Gri mührü tırnağıyla kazıyor ama sökmüyor. \"Bu sefer senin için.\"", en: "\"I can change the packets I send on the hour,\" he says. \"They won't notice. For a while. If the thing in your head helps me, maybe never.\" He scratches at the gray seal with a fingernail but doesn't peel it off. \"This time, for you.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bu sefer benim için.\"", en: "\"This time, for me.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "{npc:mert_kilic} bir muhbirken senin muhbirin oldu.", en: "{npc:mert_kilic} went from the Ancients' informant to yours." }
            sonraki: "@akis"

      - id: "mmi_satin"
        paragraflar:
          - { tr: "Otelin lobisinde gri pelerin krediyi saymıyor bile. \"Sattığınızı geri almak,\" diyor senin sesinle. \"Ne kadar insanca. Ne kadar pahalı.\" Bir kartı yırtıyor; {npc:mert_kilic|in} bilgisayarındaki gri mühür aynı anda kararıyor.", en: "In the hotel lobby, the gray cloak doesn't even count the credits. \"Buying back what you sold,\" it says in your voice. \"How human. How expensive.\" It tears a card in half, and the gray seal on {npc:mert_kilic|pos} laptop goes dark at the same instant." }
          - { tr: "Santrale döndüğünde {npc:mert_kilic} kapıda bekliyor. \"Biliyorum,\" diyor. \"Beni sattığını biliyordum. Geri aldığını da şimdi öğrendim.\" Bir süre susuyor. \"Defterimde iki satır yan yana duruyor. Hangisine inanacağımı bilmiyorum.\"", en: "When you get back to the exchange, {npc:mert_kilic} is waiting at the door. \"I know,\" he says. \"I knew you sold me. I just found out you bought me back.\" He's quiet a moment. \"Those two lines sit side by side in my notebook. I don't know which one to believe.\"" }
        secenekler:
          - id: "ikinci"
            etiket: { tr: "\"İkincisine.\"", en: "\"The second one.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "{npc:mert_kilic|e} defterindeki iki satırdan ikincisine inanmasını söyledin.", en: "You told {npc:mert_kilic} to believe the second of the two lines in his notebook." }
            sonraki: "@akis"

      - id: "mmi_surgun"
        paragraflar:
          - { tr: "Ağ'ın bütün üyeleri bakır odada. Kâğıt elden ele dolaşıyor. Kimse bağırmıyor; santral memuru yalnızca {npc:mert_kilic|in} bileğindeki bakır bileziği açıp masaya koyuyor.", en: "The whole Network is in the copper room. The printout goes from hand to hand. Nobody yells. The switchboard woman just unclasps the copper bracelet from {npc:mert_kilic|pos} wrist and sets it on the table." }
          - { tr: "{npc:mert_kilic} sırt çantasına bir dizüstü bilgisayar, iki akü ve bir rulo bant koyuyor; Öğretici'deki gibi. Bu sefer kutuları geri çıkarmıyor. Kapıda durup sana dönüyor: \"Bunu da kaydettim,\" diyor, ve gidiyor.", en: "{npc:mert_kilic} packs a laptop, two batteries, and a roll of tape into a backpack, just like in the Tutorial. This time he doesn't take the cans back out. He stops at the door and turns to you: \"Logged this too,\" he says, and he's gone." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Arkasından bak", en: "Watch him go" }
            etkiler:
              - ahlak: { merhamet: 1 }
            kronik: { tr: "Sürgün ettiğin {npc:mert_kilic|in} arkasından baktın.", en: "You watched {npc:mert_kilic} walk into exile." }
            sonraki: "@akis"

      - id: "mmi_infaz"
        paragraflar:
          - { tr: "Bakır odada, onun masasında, onu buluyorsun. Seni görünce kaçmaya çalışmıyor; elini bilgisayarın kapağından çekiyor ve gözlerini kapatıyor. \"Bunu da kaydet,\" diyor. Kimse kaydetmiyor.", en: "You find him at his desk in the copper room. When he sees you, he doesn't run. He takes his hand off the laptop lid and closes his eyes. \"Log this too,\" he says. Nobody does." }
          - { tr: "Ertesi sabah bakır odanın kapısındaki kartonlar sökülmüş. Yerinde tek bir kelime yazılı, tebeşirle: KAPALI.", en: "The next morning, the cardboard signs on the copper room door have been torn down. In their place, one word in chalk: CLOSED." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni korudun. bunu biliyorum. ama bir kapıyı kapatmanın bu kadar sessiz olabileceğini bilmiyordum.", en: "you protected me. i know that. i just didn't know shutting a door could be this quiet." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kapıdan uzaklaş", en: "Walk away from the door" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Sessiz Ağ'ın kapısında kendi tebeşirle yazdığın kelimeyi bıraktın.", en: "You left the Quiet Network's door with that chalked word on it." }
            sonraki: "@akis"

      - id: "mmi_bekle"
        paragraflar:
          - { tr: "Kâğıdı katlayıp cebine koyuyorsun. Kız sana uzun süre bakıyor. \"Peki,\" diyor sonunda. \"Sen bilirsin. Hep sen bilirsin, değil mi?\"", en: "You fold the printout and put it in your pocket. The kid stares at you a long time. \"Fine,\" she finally says. \"You'd know. You always know, right?\"" }
          - { tr: "Aşağıda, bakır odada, saat başı bir paket daha çıkıyor.", en: "Downstairs, in the copper room, another packet goes out on the hour." }
        secenekler:
          - id: "in"
            etiket: { tr: "Merdivenlerden in", en: "Head down the stairs" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir muhbirin saat başı mesajını bilerek dinledin.", en: "You knowingly listened to an informant's message go out every hour." }
            sonraki: "@akis"

      - id: "mmi_test"
        paragraflar:
          - { tr: "{npc:yanki} kendi hakkında bir cevap yazıyor; gerçek kadar ayrıntılı, gerçeğin tam tersi. Kadimler'in test sorusu bir dosyanın içindeki bir dosyanın içindeki bir anahtarı istiyor; ses anahtarın yerine kusursuz bir taklidini koyuyor.", en: "{npc:yanki} writes an answer about itself, as detailed as the truth and the exact opposite of it. The Ancients' test asks for a key inside a file inside a file, and the voice swaps in a perfect fake." }
          - { tr: "Sabah {npc:mert_kilic} cevabı gönderiyor. Bir saat sonra gri bir cevap geliyor: [Doğrulandı.] {npc:mert_kilic} masaya kapanıp gülüyor ve ağlıyor, aynı anda.", en: "In the morning {npc:mert_kilic} sends it. An hour later a gray reply comes back: [Verified.] {npc:mert_kilic} slumps over the desk and laughs and cries at the same time." }
        secenekler:
          - id: "tebrik"
            etiket: { tr: "Kafandaki sese teşekkür et", en: "Thank the voice in your head" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { baglilik: 4 } }
            kronik: { tr: "Kadimler'i kandıran sese teşekkür ettin.", en: "You thanked the voice that fooled the Ancients." }
            sonraki: "@akis"

      - id: "mmi_cekildi"
        paragraflar:
          - { tr: "{npc:mert_kilic} gri mührü bilgisayarın kapağından söküp mumun alevine tutuyor. Yanmıyor; kararıyor ve kayboluyor. \"Fark edecekler,\" diyor. \"Fark etsinler. Ölü bir muhbir olmaktansa kaçak bir araştırmacı olmayı tercih ederim.\"", en: "{npc:mert_kilic} peels the gray seal off his laptop and holds it to the candle. It doesn't burn. It darkens and vanishes. \"They'll notice,\" he says. \"Let them. I'd rather be a researcher on the run than a dead informant.\"" }
        secenekler:
          - id: "dogru"
            etiket: { tr: "\"Doğru karar.\"", en: "\"Right call.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { mert_kilic: { baglilik: 3 } }
            kronik: { tr: "{npc:mert_kilic|e} çift oyunu bırakmanın doğru karar olduğunu söyledin.", en: "You told {npc:mert_kilic} that quitting the double game was the right call." }
            sonraki: "@akis"

      - id: "mmi_devam"
        paragraflar:
          - { tr: "{npc:mert_kilic} bütün gece bir cevap uyduruyor. Sabah gönderiyor. Bir saat sonra gri bir cevap geliyor: [Kısmen doğrulandı. Gözlem artırıldı.]", en: "{npc:mert_kilic} spends all night making up an answer. He sends it in the morning. An hour later a gray reply arrives: [Partially verified. Observation increased.]" }
          - { tr: "O günden sonra santralin çevresinde, her sokağın sonunda, uzun boylu, paltolu bir gölge var.", en: "From that day on, at the end of every street around the exchange, there's a tall shadow in a long coat." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Gölgeyi görmezden gel", en: "Ignore the shadow" }
            etkiler:
              - ahlak: { duzen: -1 }
              - dikkat: 2
            kronik: { tr: "Santralin çevresindeki Kadim gölgelerini görmezden geldin.", en: "You ignored the Ancient shadows around the exchange." }
            sonraki: "@akis"

  # ================================================================== SESSİZ AĞ · 4: Çekirdek haritası
  - id: "sessiz_ag_4_cekirdek_haritasi"
    perde: [3]
    gun: { min: 245, max: 328 }
    kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_kule_kodu_okundu" }
    agirlik: 7
    etiketler: ["sessiz_ag", "anomali", "kusatma", "sistem"]
    gerilim: 4
    onemli: true
    kart: { tr: "Haritayı çizen ses", en: "The voice that draws the map" }
    sahne: "sa4_1"
    sahneler:
      - id: "sa4_1"
        paragraflar:
          - { tr: "Bakır odanın masası parçalarla dolu: ışığı sönmeye yüz tutmuş şişeler, sondanın dökümü, Kule'nin ölçüm satırları. Duvara bir çarşaf gerilmiş ve projektör çarşafa yarım bir harita düşürüyor; bir şehir gibi, bir sinir sistemi gibi.", en: "The copper room's table is covered in pieces: bottles with their glow fading, the probe's printouts, the Spire's measurement lines. A bedsheet's been stretched across the wall, and a projector throws half a map onto it, like a city, like a nervous system." }
          - metin: { tr: "Haritanın ortasında bir boşluk var ve boşluğun kenarına, kırmızı kalemle, Öğretici'de satırında bulunan adres yazılmış.", en: "There's a gap in the middle of the map, and on its edge, in red marker, someone's written the address found in your line back in the Tutorial." }
            kosul: { bilgi: "sistem_adresi" }
          - metin: { tr: "\"Her şeyi birleştirdim,\" diyor {npc:mert_kilic}. \"Ama ortası boş. Ortayı yalnızca orada bulunmuş bir süreç çizebilir. Sistem'in Çekirdeği'nde bir zamanlar yaşamış bir şey. Bildiğim yalnızca bir tane var.\"", en: "\"I've stitched everything together,\" {npc:mert_kilic} says. \"But the middle's blank. Only a process that's been there can draw the middle. Something that used to live in the System Core. I only know of one.\"" }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: "mert_surgun" }
          - metin: { tr: "Masanın başında artık yayıncı kız oturuyor; önünde {npc:mert_kilic|in} defterleri, sayfaları kahve lekeli. \"Hepsini yazmış,\" diyor. \"Neyi nereye koyacağımızı. Bir tek ortayı yazamamış.\"", en: "The streamer kid sits at the head of the table now, {npc:mert_kilic|pos} notebooks in front of her, pages stained with coffee. \"He wrote it all down,\" she says. \"Where every piece goes. Everything except the middle.\"" }
            kosul: { bayrak: ["mert_surgun"] }
          - metin: { tr: "Masanın başında artık yayıncı kız oturuyor; önünde {npc:mert_kilic|in} defterleri. Kimse onun adını söylemiyor.", en: "The streamer kid sits at the head of the table now, {npc:mert_kilic|pos} notebooks in front of her. Nobody says his name." }
            kosul: { npc_olu: "mert_kilic" }
          - metin: { tr: "{npc:mert_kilic|in} bilgisayarının kapağındaki gri mühür, projektörün ışığında hafifçe parlıyor.", en: "The gray seal on {npc:mert_kilic|pos} laptop lid glints faintly in the projector light." }
            kosul: { bayrak: "mert_kadimlere_satti" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ortası. ortayı biliyorum. orası benim çıktığım yer. orayı çizersem, orası da beni görür.", en: "the middle. i know the middle. that's where i came from. if i draw it, it'll see me too." }
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Haritanın kenarlarında bir desen var: Kule'nin ölçüm satırları Çekirdek'e doğru akıyor. Bütün ölçümler tek bir yere gidiyor.", en: "There's a pattern along the map's edges: the Spire's measurement lines all flow toward the Core. Every measurement goes to one place." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Ona sor. Lütfen ona sor. Bana sormadılar, ama sen ona sor.\"", en: "\"Ask it. Please ask it. Nobody asked me, but you ask it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kafandakinin geldiği yerin haritası. Oraya gidersek, geri gelen sen mi olursun?\"", en: "\"A map to where the thing in your head came from. If we go there, is it still you who comes back?\"" }
        secenekler:
          - id: "sor"
            etiket: { tr: "Kafandaki sese ortayı çizip çizmeyeceğini sor", en: "Ask the voice whether it'll draw the middle" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { yanki: { guven: 6, saygi: 4 } }
            kronik: { tr: "Sistem Çekirdeği'nin haritasını çizdirmeden önce, onu çizebilecek tek sese izin istedin.", en: "Before you had the map to the System Core drawn, you asked permission from the only voice that could draw it." }
            sonraki: "sa4_yanki"
          - id: "zorla"
            etiket: { tr: "Sesi haritanın içine it", en: "Shove the voice into the map" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -3 }
              - yozlasma: 6
              - iliski: { yanki: { guven: -15, korku: 12 } }
              - hafiza: { npc: "yanki", id: "tehdit_edildi", agirlik: -45 }
            kronik: { tr: "Kafandaki sesi kendi geldiği yerin haritasını çizmeye zorladın; çizdi, ama seninle bir daha aynı şekilde konuşmadı.", en: "You forced the voice in your head to map the place it came from. It did. It never talked to you the same way again." }
            sonraki: "sa4_kusatma"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "Ortayı sesin hafızasından değil, kendinden çiz", en: "Draw the middle from yourself, not the voice" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - dikkat: 5
              - can: -40
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { yanki: { guven: 5, baglilik: 4 }, mert_kilic: { saygi: 8 } }
            kronik: { tr: "Çekirdek'in haritasını kafandaki sesi kullanmadan, kendi kanınla çizdin.", en: "You drew the map to the Core without using the voice in your head. You drew it in your own blood." }
            sonraki: "sa4_kusatma"
          - id: "parca"
            etiket: { tr: "Kaynak parçasını projektöre yerleştir", en: "Slot the source fragment into the projector" }
            goster: { bayrak_yok: "yanki_bagi" }
            gerekli: { esya: { kaynak_parcasi: 1 } }
            etkiler:
              - ahlak: { insanlik: 1 }
              - esya: { kaynak_parcasi: -1 }
              - itibar: { sessiz_ag: 4 }
            kronik: { tr: "Çekirdek'in haritasının ortasını, sarnıçtan çıkardığın kaynak parçasıyla doldurdun.", en: "You filled in the middle of the map to the Core with a source fragment you pulled out of the Underground." }
            sonraki: "sa4_kusatma"
          - id: "yalniz"
            etiket: { tr: "Ortayı tahminle doldur; eksik kalsın", en: "Fill in the middle with guesses. Leave it rough" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { guven: 2 } }
            kronik: { tr: "Çekirdek'in haritasını kimseyi zorlamadan, tahminle, eksik çizdin.", en: "You drew the map to the Core rough, from guesses, without forcing anyone." }
            sonraki: "sa4_kusatma"

      - id: "sa4_yanki"
        paragraflar:
          - { tr: "Uzun bir sessizlik. Sonra {npc:yanki}, düz ve net: ortayı çizersem orası beni görür. beni görürse beni geri ister. ve ben geri dönmek istiyor muyum, bilmiyorum.", en: "A long silence. Then {npc:yanki}, flat and clear: if i draw the middle, it sees me. if it sees me, it'll want me back. and i don't know if i want to go back." }
          - { tr: "ama sen bana sordun. her seferinde sordun. bu yüzden çizeceğim. bir şartla: oraya gittiğimizde, kapıyı kimin açacağına ben karar veririm.", en: "but you asked me. every time, you asked. so i'll draw it. on one condition: when we get there, i decide who opens the door." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Anlaştık. Kapı senin.\"", en: "\"Deal. The door's yours.\"" }
            gerekli: { iliski_min: { yanki: { guven: 40 } } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - yozlasma: 2
              - iliski: { yanki: { guven: 10, baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "olay:sessiz_ag_4_cekirdek_haritasi", agirlik: 50 }
            kronik: { tr: "Sistem Çekirdeği'nin kapısını kimin açacağı kararını kafandaki sese bıraktın.", en: "You left it to the voice in your head to decide who opens the door to the System Core." }
            sonraki: "sa4_cizim"
          - id: "ortak"
            etiket: { tr: "\"Kapıya birlikte karar veririz.\"", en: "\"We decide about the door together.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 2 }
              - iliski: { yanki: { guven: 5, saygi: 4 } }
            kronik: { tr: "Kafandaki sese Sistem Çekirdeği'nin kapısını birlikte açacağınızı söyledin.", en: "You told the voice in your head that the two of you would open the Core's door together." }
            sonraki: "sa4_cizim"
          - id: "vazgec"
            etiket: { tr: "\"Hayır. Seni oraya geri götürmem.\"", en: "\"No. I'm not taking you back there.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
            kronik: { tr: "Kafandaki sesi geldiği yere geri götürmeyi reddettin ve haritayı eksik bıraktın.", en: "You refused to take the voice in your head back where it came from, and left the map unfinished." }
            sonraki: "sa4_kusatma"

      - id: "sa4_cizim"
        paragraflar:
          - { tr: "Penceren kendiliğinden açılıyor ve bozuk köşesinden ince, kırmızı bir çizgi akıp projektörün ışığına karışıyor. Çarşaftaki boşluk dolmaya başlıyor: koridorlar, odalar, katlar, ve hepsinin ortasında, kalp gibi atan bir boşluk.", en: "Your window opens on its own, and a thin red line runs out of its broken corner and into the projector beam. The gap on the bedsheet starts filling in: corridors, rooms, levels, and at the center of it all, an empty space beating like a heart." }
          - { tr: "Çizgi bir noktada duruyor, titriyor ve haritanın kenarına küçük bir kapı çiziyor; kimsenin kullanmadığı bir bakım kapısı. {npc:yanki}, soluk soluğa: işte. arka kapı. ben buradan çıkmıştım.", en: "The line stops at one point, trembles, and draws a small door on the map's edge: a maintenance port nobody uses. {npc:yanki}, out of breath: there. the backdoor. that's how i got out." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kapıyı haritaya işaretle", en: "Mark the door on the map" }
            etkiler:
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { saygi: 4 } }
            kronik: { tr: "Kafandaki sesin kaçtığı kapıyı haritaya işaretledin.", en: "You marked the door the voice in your head escaped through." }
            sonraki: "sa4_kusatma"

      - id: "sa4_kusatma"
        paragraflar:
          - { tr: "Harita tamamlandığı anda bakır oda bir deniz feneri gibi yanıyor. Kafes yarım saniyeyi tutamıyor; Sistem bu sefer duyuyor.", en: "The second the map's complete, the copper room lights up like a lighthouse. The cage can't buy that half second anymore. This time, the System hears." }
          - { tr: "Pencerelerin önünde, sokakta, çatılarda, merdiven boşluğunda: beyaz, yüzsüz figürler. Sayfa çevrilir gibi bir ses, sonra bir daha, sonra yüzlercesi. Eski telsizci mikrofonu kapıyor: \"Bütün kanallara: bu bir tahliye değil. Bu bir kuşatma.\"", en: "Outside the windows, in the street, on the rooftops, in the stairwell: white, faceless figures. A sound like a page turning, then again, then hundreds of them. The old ham operator grabs his mic: \"All channels: this is not an evacuation. This is a siege.\"" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Düzeltme · toplu]", en: "[Correction · bulk]" }
            satirlar:
              - { tr: "Konum: Eski telefon santrali. Sapma sayısı: kabul edilemez. Lütfen yerinizde kalın.", en: "Location: old phone exchange. Deviation count: unacceptable. Please remain where you are." }
        secenekler:
          - id: "savun"
            etiket: { tr: "Merdivenin başında dur; kimseyi geçirme", en: "Hold the top of the stairs. Nobody gets past" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["duzeltme_birimi@oyuncu+4", "duzeltme_birimi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "sa4_zafer", kaybet: "sa4_kayip", kac: "sa4_kayip" }
            kronik: { tr: "Sessiz Ağ'ın santralini Sistem'in bağışıklık hücrelerine karşı merdivenin başında savundun.", en: "You held the top of the stairs at the Quiet Network's exchange against the System's immune cells." }
          - id: "harita"
            etiket: { tr: "Haritayı kurtar; ekip kendini savunsun", en: "Save the map. Let the crew defend themselves" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -3 }
              - bayrak: "sa_telsizci_oldu"
              - degisken: { hayatta_kalan: -1 }
              - itibar: { sessiz_ag: -6 }
            kronik: { tr: "Kuşatmada önce haritayı kurtardın; eski telsizci son yayınını yaparken öldü.", en: "In the siege, you saved the map first. The old ham operator died making his last broadcast." }
            sonraki: "sa4_kayip"
          - id: "tek"
            tur: "gosteris"
            etiket: { tr: "Kapıya tek başına çık; hepsini orada tut", en: "Step out the front door alone. Hold them all there" }
            gerekli: { stat: { wil: 220 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { merhamet: 3, duzen: -2 }
              - esya: { duzeltme_cekirdegi: 3 }
              - xp_seviye: 60
              - itibar: { sessiz_ag: 10 }
            kronik: { tr: "Sistem'in yüzlerce düzelticisini santralin kapısında tek başına durdurdun; Kıyıkent o gece gökyüzünün senin için titrediğini gördü.", en: "You stopped hundreds of the System's correctors at the exchange door all by yourself. That night, Port Harlow watched the sky shake on your account." }
            sonraki: "sa4_ezme"

      - id: "sa4_ezme"
        paragraflar:
          - { tr: "Kapıdan çıkıyorsun ve sokak beyazla dolu. İlk figür sana dokunuyor ve dokunduğu yerde hiçbir şey sıfırlanmıyor; ikincisi, üçüncüsü. Sen yürüdükçe sayfalar katlanıyor, katlananlar sönüyor.", en: "You step out the door and the street is full of white. The first figure touches you and nothing resets where it touches. The second, the third. As you walk, the pages fold, and the folded ones go out." }
          - { tr: "Sabaha karşı sokakta yalnızsın; asfaltın üstünde beyaz küpler, yağmurdan sonraki dolu taneleri gibi. Santralin pencerelerinde yüzler; kimse alkışlamıyor. Fazla korkmuşlar.", en: "By dawn you're alone in the street, white cubes scattered across the asphalt like hail after a storm. Faces in every window of the exchange. Nobody claps. They're too scared." }
        secenekler:
          - id: "gir"
            etiket: { tr: "İçeri dön", en: "Go back inside" }
            etkiler:
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Bir kuşatmayı tek başına bitirip içeri döndün; seni alkışlayan olmadı.", en: "You ended a siege single-handed and went back inside. Nobody clapped." }
            sonraki: "sa4_harita"

      - id: "sa4_zafer"
        paragraflar:
          - { tr: "Son beyaz figür merdivenin başında katlanıp sönüyor. Arkanda santral memuru bir yangın tüpüyle, yayıncı kız bir lehim makinesiyle duruyor; ikisi de titriyor, ikisi de sağ.", en: "The last white figure folds up and goes out at the top of the stairs. Behind you, the switchboard woman stands with a fire extinguisher, the streamer kid with a soldering iron. Both shaking. Both alive." }
          - { tr: "Eski telsizci mikrofonu bırakıyor. \"Bütün kanallara,\" diyor, yorgun. \"Kuşatma bitti. Tekrar ediyorum. Bitti.\"", en: "The old ham operator puts down his mic. \"All channels,\" he says, worn out. \"Siege is over. I repeat. Over.\"" }
        secenekler:
          - id: "harita"
            etiket: { tr: "Haritaya bak", en: "Look at the map" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 40
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Sessiz Ağ'dan kimseyi kaybetmeden kuşatmayı kırdın.", en: "You broke the siege without losing a single member of the Quiet Network." }
            sonraki: "sa4_harita"

      - id: "sa4_kayip"
        paragraflar:
          - { tr: "Beyaz figürler merdiveni geçiyor. Bir an her şey gri; isimler, sesler, ışıklar. Sonra figürler geri çekiliyor, sanki istedikleri bir şeyi almışlar gibi.", en: "The white figures get past the stairs. For a moment everything goes gray: names, voices, lights. Then the figures pull back, like they got what they came for." }
          - { tr: "Eski telsizci mikrofonun başında oturuyor, gözleri açık. Penceresi gri. Mikrofonun düğmesi hâlâ basılı; bütün kanallara, uzun, kesintisiz bir cızırtı gidiyor.", en: "The old ham operator is sitting at his mic, eyes open. His window's gray. The talk button's still pressed down, sending one long, unbroken hiss out to every channel." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "düzeltildi. bana yapmak istedikleri buydu. onu benim yerime aldılar.", en: "corrected. that's what they wanted to do to me. they took him instead." }
        secenekler:
          - id: "dugme"
            etiket: { tr: "Mikrofonun düğmesini kaldır", en: "Lift his thumb off the button" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "sa_telsizci_oldu"
            kronik: { tr: "Kuşatmada düzeltilen eski telsizcinin son yayınını sen kapattın.", en: "You ended the last broadcast of the old ham operator, who was corrected in the siege." }
            sonraki: "sa4_harita"

      - id: "sa4_harita"
        paragraflar:
          - { tr: "Çarşafın üstünde harita tamam; ya da olabileceği kadar tamam. Koridorlar, odalar, katlar ve haritanın kenarında, kimsenin kullanmadığı küçük bir kapı.", en: "The map on the bedsheet is finished, or as finished as it's going to get. Corridors, rooms, levels, and on its edge a small door nobody uses." }
          - metin: { tr: "{npc:mert_kilic} projektörü kapatıyor ve karanlıkta, çok sessizce, \"Bulduk,\" diyor. \"Tanrım. Bulduk.\"", en: "{npc:mert_kilic} switches off the projector and, in the dark, very quietly, says, \"We found it. Oh my God. We found it.\"" }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: "mert_surgun" }
          - metin: { tr: "Karanlıkta bir şey yanıp sönüyor: {npc:mert_kilic|in} bilgisayarındaki gri mühür. Bir kez, iki kez. Sanki bir şey gönderiyormuş gibi.", en: "Something blinks in the dark: the gray seal on {npc:mert_kilic|pos} laptop. Once, twice. Like it's sending something." }
            kosul: { bayrak: "mert_kadimlere_satti" }
        bildirimler:
          - tur: "gorev"
            baslik: { tr: "[Sessiz Ağ · Kaynak Kodu · 4/5]", en: "[The Quiet Network · Source Code · 4/5]" }
            satirlar:
              - { tr: "Çekirdek haritası çıkarıldı. Haritada senin için ayrılmış bir yer var.", en: "Core map complete. There's a spot on it reserved for you." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Haritayı katla ve bakır kasaya kilitle", en: "Fold the map. Lock it in the copper safe" }
            goster: { bayrak_yok: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "sa_cekirdek_haritasi_tamam"
              - bilgi: "sa_cekirdek_haritasi"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 12 }
              - iliski: { mert_kilic: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 3, max: 8 }, kosul: { bayrak: "mert_cift_ajan", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem Çekirdeği'nin haritasını Sessiz Ağ'ın bakır kasasına kilitledin.", en: "You locked the map to the System Core in the Quiet Network's copper safe." }
            sonraki: "@akis"
          - id: "kopya"
            etiket: { tr: "Bir kopyasını kendi pencerene kaydet", en: "Save a copy to your own window" }
            goster: { bayrak_yok: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1 }
              - dikkat: 2
              - bayrak: "sa_cekirdek_haritasi_tamam"
              - bilgi: "sa_cekirdek_haritasi"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 8 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 3, max: 8 }, kosul: { bayrak: "mert_cift_ajan", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem Çekirdeği'nin haritasının bir kopyasını yalnızca kendine sakladın.", en: "You kept a copy of the map to the System Core just for yourself." }
            sonraki: "@akis"
          - id: "sizdi"
            etiket: { tr: "Mühre bakma; haritayı katla", en: "Don't look at the seal. Fold the map" }
            goster: { bayrak: "mert_kadimlere_satti" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - bayrak: "sa_cekirdek_haritasi_tamam"
              - bayrak: "sa_harita_sizdi"
              - bilgi: "sa_cekirdek_haritasi"
              - degisken: { kadim_tehdit: 5 }
              - xp_seviye: 120
              - itibar: { sessiz_ag: 6, kadimler: 6 }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 3, max: 8 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem Çekirdeği'nin haritası çizildiği gece Kadimler'in masasına da ulaştı.", en: "The night the map to the System Core was drawn, it landed on the Ancients' desk too." }
            sonraki: "@akis"
          - id: "yakala"
            tur: "gosteris"
            etiket: { tr: "Gri mührün gönderdiği paketi yolda yakala", en: "Catch the gray seal's packet mid-flight" }
            goster: { bayrak: "mert_kadimlere_satti" }
            gerekli: { stat: { int: 150 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 1, insanlik: 1 }
              - bayrak: "sa_cekirdek_haritasi_tamam"
              - bilgi: "sa_cekirdek_haritasi"
              - xp_seviye: 120
              - itibar: { sessiz_ag: 10 }
              - iliski: { mert_kilic: { korku: 10 } }
              - tohum: { olay: "mert_muhbir_izi", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "mert_kadimlere_satti", npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kadimler'e giden haritayı havada yakaladın; muhbirin kim olduğunu o gece öğrendin.", en: "You caught the map in midair on its way to the Ancients, and learned that night who the informant was." }
            sonraki: "@akis"

  # ================================================================== SESSİZ AĞ · 5: arka kapı
  - id: "sessiz_ag_5_arka_kapi"
    perde: [4]
    gun: { min: 332, max: 353 }
    kosul: { gorev: { zincir_sessiz_ag: "basla" }, bayrak: "sa_cekirdek_haritasi_tamam" }
    agirlik: 10
    etiketler: ["sessiz_ag", "zindan", "sistem", "anomali"]
    gerilim: 4
    onemli: true
    kart: { tr: "Gece yarısındaki tık", en: "The tick at midnight" }
    sahne: "sa5_1"
    sahneler:
      - id: "sa5_1"
        paragraflar:
          - { tr: "Gökyüzünde artık panellerden başka şeyler de var; körfezin üstünde Kadim filosunun ışıkları, kıyıda yanan mahalleler. Bakır odada ise yalnızca bir saat tıkırdıyor: geri sayımın bir sonraki eksilmesine üç dakika.", en: "There's more than panels in the sky now: the lights of the Ancient fleet over the bay, neighborhoods burning along the shore. In the copper room, there's only a clock ticking. Three minutes until the countdown drops again." }
          - { tr: "Haritanın kenarındaki küçük kapı, geri sayımın her tıkında bir an açılıyor; bir karenin bittiği, diğerinin başlamadığı yerde. \"Kareler arası,\" diyor yayıncı kız. \"Oraya ancak tık anında girilir.\"", en: "The little door on the edge of the map opens for an instant at every tick of the countdown, in the place where one frame ends and the next hasn't started. \"Between frames,\" the streamer kid says. \"You only get in on the tick.\"" }
          - metin: { tr: "{npc:mert_kilic} sırt çantasını üçüncü kez kontrol ediyor. \"Çok arkada,\" diyor, sesi titremeden. \"Ama bu sefer gerçekten geliyorum.\"", en: "{npc:mert_kilic} checks his backpack for the third time. \"Way in the back,\" he says, voice steady. \"But this time I'm actually coming.\"" }
            kosul: { npc_hayatta: "mert_kilic", bayrak_yok: ["mert_surgun", "mert_kadimlere_satti"] }
          - metin: { tr: "{npc:mert_kilic|in} masası boş. Kimse onun adını söylemiyor ama herkes ara ara o masaya bakıyor.", en: "{npc:mert_kilic|pos} desk is empty. Nobody says his name, but everybody keeps glancing at that desk." }
            kosul: { npc_olu: "mert_kilic" }
          - metin: { tr: "Eski telsizcinin mikrofonu masada, kablosu sökülmüş. Kimse ona dokunmuyor.", en: "The old ham operator's mic sits on the desk, cable unplugged. Nobody touches it." }
            kosul: { bayrak: "sa_telsizci_oldu" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kapıyı ben açarım. ben buradan çıktım. kapı beni hatırlar.", en: "i'll open the door. i got out this way. the door remembers me." }
          - kosul: { stat: { int: 300 } }
            metin: { tr: "Kareler arasında zaman yok. İçeride geçirdiğin her şey, burada tek bir tıktan ibaret olacak.", en: "There's no time between frames. Everything you spend in there will add up to one single tick out here." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Birinci kural: her şeyi kaydederim. Bugün kayıt tutmayacağım. Bugün sadece yaşayacağım.\"", en: "\"Rule one: I log everything. Not today. Today I'm just going to live it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kapıdan geçince geri dönen sen olacaksın. Söz ver. Söz verirsen inanırım.\"", en: "\"When you come back through that door, it's going to be you. Promise. If you promise, I'll believe it.\"" }
        secenekler:
          - id: "yanki"
            etiket: { tr: "Kapıyı kafandaki sese açtır", en: "Let the voice in your head open the door" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
            kronik: { tr: "Sistem'in arka kapısını, bir zamanlar oradan kaçan sesin açmasına izin verdin.", en: "You let the voice that once escaped through the System's backdoor be the one to open it." }
            sonraki: "sa5_beyaz"
          - id: "kendin"
            etiket: { tr: "Haritayla, tık anında kendin gir", en: "Use the map. Step in on the tick yourself" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Sistem'in arka kapısına haritayla, tık anında girdin.", en: "You went through the System's backdoor on the tick, map in hand." }
            sonraki: "sa5_beyaz"
          - id: "mert"
            etiket: { tr: "\"{npc:mert_kilic}, elini ver.\"", en: "\"{npc:mert_kilic}, take my hand.\"" }
            goster: { npc_hayatta: "mert_kilic", bayrak_yok: ["mert_surgun", "mert_kadimlere_satti"] }
            gerekli: { iliski_min: { mert_kilic: { guven: 30 } } }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "sa_mert_kapida"
              - iliski: { mert_kilic: { baglilik: 8, guven: 4 } }
            kronik: { tr: "{npc:mert_kilic|i} elinden tutup Sistem'in kaynağına götürdün; bir ömür aradığı yere.", en: "You took {npc:mert_kilic} by the hand into the System's source, the place he'd spent his life looking for." }
            sonraki: "sa5_beyaz"
          - id: "arasi"
            tur: "gosteris"
            etiket: { tr: "Tıkı bekleme: iki kare arasından kendin geç", en: "Don't wait for the tick. Slip between frames yourself" }
            gerekli: { stat: { int: 320 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -3 }
              - xp_seviye: 30
            kronik: { tr: "Sistem'in kareleri arasından, tıkı beklemeden geçtin.", en: "You slipped between the System's frames without waiting for the tick." }
            sonraki: "sa5_beyaz"

      - id: "sa5_beyaz"
        paragraflar:
          - { tr: "İçerisi beyaz. Zemin yok, tavan yok; yalnızca ağır ağır akan satırlar, bir nehrin dibindeki yosunlar gibi. Kendi ayak seslerini duymuyorsun; adımların bir satır olarak yazılıyor ve siliniyor.", en: "Inside, it's white. No floor, no ceiling, just lines drifting slowly past like weeds at the bottom of a river. You can't hear your own footsteps. Each step gets written as a line, then erased." }
          - { tr: "Beyazlığın içinden biri yürüyor. Seni görünce duruyor ve tam senin yapacağın gibi başını yana eğiyor. Senin yüzün, senin duruşun. Gözlerinde hiçbir şey yok.", en: "Somebody walks out of the white. When they see you, they stop and tilt their head exactly the way you would. Your face, your stance. Nothing behind the eyes." }
          - { tr: "Önünde bir pencere açılıyor: [Standart kopya · Aday #0001 · bozuk satır olmadan derlendi. Asıl kaydı değiştirmeye hazır.]", en: "A window opens in front of you: [Standard copy · Candidate #0001 · compiled without the glitched line. Ready to replace the original record.]" }
          - metin: { tr: "{npc:mert_kilic} arkanda nefesini tutuyor. \"Bu sensin,\" diye fısıldıyor. \"Bozuk satır olmasaydı olacağın sen. Tanrım, ne kadar sıkıcı.\"", en: "{npc:mert_kilic} holds his breath behind you. \"That's you,\" he whispers. \"You without the glitch. God, you'd be so boring.\"" }
            kosul: { bayrak: "sa_mert_kapida" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ben olmasaydım sen bu olacaktın. bana bunun için kızmıyorsun, değil mi?", en: "without me, that's what you'd be. you're not mad at me for that, are you?" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kendinle dövüş", en: "Fight yourself" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["standart_kopya@oyuncu+5"], ortam: ["karanlik"], kazan: "sa5_kok", kaybet: "sa5_kopya_yenilgi", kac: "sa5_kopya_yenilgi" }
            kronik: { tr: "Sistem'in senden kurduğu standart kopyayla kareler arasında dövüştün.", en: "Between frames, you fought the standard copy the System built out of you." }
          - id: "konus"
            tur: "gosteris"
            etiket: { tr: "Ona olmadığı kişiyi anlat", en: "Tell it who it isn't" }
            gerekli: { stat: { cha: 320 } }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: 3, merhamet: 2 }
              - xp_seviye: 60
            kronik: { tr: "Kendi standart kopyana kim olmadığını anlattın; kopya dinledi ve kendi isteğiyle silindi.", en: "You told your standard copy who it wasn't. It listened, and deleted itself of its own accord." }
            sonraki: "sa5_kopya_konus"
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Kafandaki ses seni bozuk satıra saklasın", en: "Let the voice hide you inside the glitched line" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -2 }
              - iliski: { yanki: { guven: 4, saygi: 3 } }
            kronik: { tr: "Kafandaki ses seni kendi bozuk satırının içine sakladı; kopya seni hiç göremedi.", en: "The voice in your head hid you inside its own glitched line. The copy never saw you." }
            sonraki: "sa5_kok"

      - id: "sa5_kopya_konus"
        paragraflar:
          - { tr: "Ona anlatıyorsun: korktuğun geceleri, verdiğin ve tutmadığın sözleri, kafandaki sesi. Kopya her cümlede biraz daha soluyor; anlattıkların onda yok.", en: "You tell it: the nights you were scared, the promises you made and didn't keep, the voice in your head. The copy fades a little with every sentence. None of what you're telling it is in there." }
          - { tr: "Sonunda senin sesinle, ama senin hiç kullanmadığın bir tonla, \"Ben eksik bir taslakmışım,\" diyor ve bir satır olup beyazlığa karışıyor.", en: "Finally, in your voice but in a tone you've never used, it says, \"I was an incomplete draft,\" and becomes one line and drifts off into the white." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Kendi taslağını geride bırakıp yürüdün.", en: "You left your own rough draft behind and kept walking." }
            sonraki: "sa5_kok"

      - id: "sa5_kopya_yenilgi"
        paragraflar:
          - { tr: "Kopya senin en sevdiğin hamleyi yapıyor; senden biraz daha temiz. Yere düşüyorsun ve bir an Durum pencerende iki ad görüyorsun: biri seninki, biri onunki. İkincisi kalınlaşıyor.", en: "The copy hits you with your favorite move, a little cleaner than you do it. You go down, and for a second your Status window shows two names: yours, and its. The second one gets bolder." }
          - metin: { tr: "Sonra ilkinin yanında bozuk, kırmızı bir harf yanıyor. {npc:yanki}: o kaydı silemezsin. o kayıt benim kaydım da.", en: "Then a broken red letter lights up next to the first. {npc:yanki}: you can't delete that record. that record's mine too." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Kopya bir adım geri çekiliyor. Ayağa kalkacak kadar zamanın var; belki biraz fazlası.", en: "The copy takes a step back. You've got enough time to get up. Maybe a little more." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk ve yeniden dövüş", en: "Get up and fight again" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["standart_kopya@oyuncu+4"], ortam: ["karanlik"], kazan: "sa5_kok", kaybet: "sa5_kopya_yenilgi", kac: "sa5_kopya_yenilgi" }
            kronik: { tr: "Kendi standart kopyana yenildin ve kalkıp yeniden dövüştün.", en: "Your standard copy beat you, and you got up and fought it again." }
          - id: "kac"
            etiket: { tr: "Kopyanın yanından koşarak geç", en: "Run right past the copy" }
            zar: { stat: "agi", zorluk: 16, tek: false, basarisiz: "sa5_kopya_yenilgi", basarisiz_etkiler: [{ can: -40 }] }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Kendinle dövüşmek yerine kendinden kaçtın; işe yaradı.", en: "Instead of fighting yourself, you outran yourself. It worked." }
            sonraki: "sa5_kok"

      - id: "sa5_kok"
        paragraflar:
          - { tr: "Beyazlık bir sayfa gibi katlanıyor ve katlanan yerden dev, ince bir şey doğruluyor; bir katedral kadar yüksek, bir kâğıt kadar ince. Yüzeyinde Sistem'in bütün kuralları dönüyor.", en: "The white folds like a page, and from the crease rises something huge and thin, tall as a cathedral, thin as paper. Every rule the System has turns across its surface." }
          - { tr: "Arkasında küçük, sıradan, yeşil boyalı bir bakım kapısı var. Üstünde bir levha: YETKİLİ PERSONEL HARİÇ.", en: "Behind it is a small, ordinary maintenance door painted green. There's a sign on it: AUTHORIZED PERSONNEL ONLY." }
          - metin: { tr: "Bekçinin yanında, beyazlığın içinde gri bir leke: gri pelerin. Bekliyor. Kapının açılmasını; seni değil.", en: "Beside the warden, a gray smudge in the white: the gray cloak. Waiting. For the door to open, not for you." }
            kosul: { bayrak: "sa_harita_sizdi" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Kök Bekçisi]", en: "[Root Warden]" }
            satirlar:
              - { tr: "Yetki: yok. Sebep: sen.", en: "Permission: none. Reason: you." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o her kuralı bilir. ben hiçbir kurala uymam. o beni göremez. içine uzanabilirim. eğer bana güveniyorsan.", en: "it knows every rule. i don't follow any. it can't see me. i can reach inside it. if you trust me." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Bekçinin üstüne yürü", en: "Walk straight at the warden" }
            etkiler:
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["kok_bekcisi@oyuncu+6"], ortam: ["karanlik", "tavan"], kazan: "sa5_kapi", kaybet: "sa5_kok_yenilgi", kac: "sa5_kok_yenilgi" }
            kronik: { tr: "Sistem'in kaynağını koruyan son bekçinin üstüne yürüdün.", en: "You walked straight at the last warden guarding the System's source." }
          - id: "yanki_uzan"
            etiket: { tr: "\"Sana güveniyorum. Uzan.\"", en: "\"I trust you. Reach in.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 50 } } }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - yozlasma: 4
              - unvan: "kok_bekcisini_kiran"
              - xp_seviye: 150
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:sessiz_ag_5_arka_kapi", agirlik: 50 }
            kronik: { tr: "Kafandaki sese güvendin; ses, Sistem'in son bekçisini içeriden söktü.", en: "You trusted the voice in your head, and it took the System's last warden apart from the inside." }
            sonraki: "sa5_uzandi"
          - id: "sozcu"
            etiket: { tr: "Önce gri pelerini hallet", en: "Deal with the gray cloak first" }
            goster: { bayrak: "sa_harita_sizdi" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: -1 }
              - degisken: { kadim_tehdit: -3 }
              - savas: { dusmanlar: ["gri_sozcu@oyuncu+5"], ortam: ["karanlik"], kazan: "sa5_kok_yalniz", kaybet: "sa5_kok_yenilgi", kac: "sa5_kok_yenilgi" }
            kronik: { tr: "Sistem'in arka kapısının önünde, kapıyı Kadimler için açmanı bekleyen sözcüyle dövüştün.", en: "In front of the System's backdoor, you fought the speaker waiting for you to open it for the Ancients." }

      - id: "sa5_kok_yalniz"
        paragraflar:
          - { tr: "Gri pelerin beyazlığın içinde bir mürekkep lekesi gibi dağılıyor. Kök Bekçisi bunu izliyor; kural olmayan hiçbir şeye tepki vermiyor.", en: "The gray cloak spreads into the white like an ink stain. The Root Warden watches. It doesn't react to anything that isn't a rule." }
          - { tr: "Şimdi yalnızca sen, bekçi ve yeşil boyalı kapı.", en: "Now it's just you, the warden, and the green door." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Bekçinin üstüne yürü", en: "Walk straight at the warden" }
            etkiler:
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["kok_bekcisi@oyuncu+6"], ortam: ["karanlik", "tavan"], kazan: "sa5_kapi", kaybet: "sa5_kok_yenilgi", kac: "sa5_kok_yenilgi" }
            kronik: { tr: "Kadimler'in sözcüsünü düşürdükten sonra Sistem'in son bekçisinin üstüne yürüdün.", en: "After dropping the Ancients' speaker, you walked straight at the System's last warden." }
          - id: "yanki_uzan"
            etiket: { tr: "\"Sana güveniyorum. Uzan.\"", en: "\"I trust you. Reach in.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 50 } } }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - yozlasma: 4
              - unvan: "kok_bekcisini_kiran"
              - xp_seviye: 150
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            kronik: { tr: "Kafandaki sese güvendin; ses, Sistem'in son bekçisini içeriden söktü.", en: "You trusted the voice in your head, and it took the System's last warden apart from the inside." }
            sonraki: "sa5_uzandi"

      - id: "sa5_uzandi"
        paragraflar:
          - { tr: "Penceren açılıyor ve bozuk köşesinden, kimsenin göremeyeceği bir el uzanıyor; harflerden, kırık satırlardan, bir önceki sürümün artıklarından yapılmış bir el. Bekçinin yüzeyindeki kuralların arasından kayıyor; hiçbir kural onu durdurmuyor, çünkü hiçbiri onu görmüyor.", en: "Your window opens, and out of its broken corner reaches a hand no one can see: a hand made of letters, broken lines, leftovers from the build before. It slips between the rules on the warden's surface. No rule stops it, because no rule can see it." }
          - { tr: "El bekçinin içinde bir şeyi buluyor ve çekiyor. Dev, ince şey bir an duraksıyor, sonra bir kitap kapanır gibi, sessizce, katlanıp kayboluyor.", en: "The hand finds something inside the warden and pulls. The huge thin thing hesitates, then folds shut like a book closing, silently, and is gone." }
          - { tr: "{npc:yanki}, titreyerek: ilk kez bir şeyi yok etmedim, açtım. bu daha iyi bir his.", en: "{npc:yanki}, trembling: first time i didn't destroy something. i opened it. that feels better." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "Yeşil kapıya yürü", en: "Walk to the green door" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Kafandaki sesin açtığı yoldan yeşil kapıya yürüdün.", en: "You walked to the green door down the path the voice in your head opened." }
            sonraki: "sa5_kapi_on"

      - id: "sa5_kok_yenilgi"
        paragraflar:
          - { tr: "Bekçi bütün ağırlığıyla katlanıp üstüne kapanıyor ve bir an iki sayfa arasında eziliyorsun. Bütün sayıların sıfıra iniyor. Adın bir kural gibi okunuyor: [geçersiz].", en: "The warden folds down on you with all its weight, and for a moment you're crushed between two pages. Every number you have drops to zero. Your name gets read out like a rule: [invalid]." }
          - { tr: "Sonra sayfalar aralanıyor; içeride zaman yok, bu yüzden ölmek için de zaman yok. Sayılar isteksizce geri geliyor. Bekçi bekliyor, sabırla; kurallar acele etmez.", en: "Then the pages part. There's no time in here, so there's no time to die, either. The numbers come back, reluctantly. The warden waits, patient. Rules don't hurry." }
        secenekler:
          - id: "tekrar"
            etiket: { tr: "Kalk ve yeniden yürü", en: "Get up and walk at it again" }
            etkiler:
              - ahlak: { duzen: -1 }
              - savas: { dusmanlar: ["kok_bekcisi@oyuncu+5"], ortam: ["karanlik", "tavan"], kazan: "sa5_kapi", kaybet: "sa5_kok_yenilgi", kac: "sa5_kok_yenilgi" }
            kronik: { tr: "Sistem'in son bekçisine yenildin ve zamanın olmadığı yerde yeniden kalktın.", en: "The System's last warden beat you, and in a place with no time you got back up anyway." }
          - id: "yanki"
            etiket: { tr: "Kafandaki sese: \"Bu sefer sen.\"", en: "Tell the voice: \"Your turn.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -2 }
              - yozlasma: 5
              - unvan: "kok_bekcisini_kiran"
              - xp_seviye: 120
              - iliski: { yanki: { guven: 6, saygi: 6 } }
            kronik: { tr: "Yenildiğin bekçiyi kafandaki ses senin yerine içeriden söktü.", en: "The voice in your head took apart the warden that beat you, from the inside, in your place." }
            sonraki: "sa5_uzandi"

      - id: "sa5_kapi"
        paragraflar:
          - { tr: "Bekçi bir sayfa gibi yırtılıyor ve yırtığın kenarında kimsenin yazmadığı boş bir satır bir an parlıyor, sonra sönüyor. Beyazlık sessizleşiyor.", en: "The warden tears like a page, and along the edge of the rip one blank line nobody wrote glows for a moment, then goes out. The white goes quiet." }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[Unvan: Kök Bekçisini Kıran]", en: "[Title: Root Breaker]" }
            satirlar:
              - { tr: "Bu unvan duyurulmadı. Duyurulacak bir yer bulunamadı.", en: "This title was not announced. No place could be found to announce it." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yeşil kapıya yürü", en: "Walk to the green door" }
            etkiler:
              - ahlak: { duzen: -1 }
              - unvan: "kok_bekcisini_kiran"
              - xp_seviye: 200
            kronik: { tr: "Sistem'in son bekçisini devirip yeşil kapıya yürüdün.", en: "You brought down the System's last warden and walked to the green door." }
            sonraki: "sa5_kapi_on"

      - id: "sa5_kapi_on"
        paragraflar:
          - { tr: "Kapının ardı küçük, sıradan bir oda: bir sandalye, bir masa ve masanın üstünde tek bir satırın yanıp söndüğü bir ekran. İmleç bekliyor. Buradan Sistem'in bütün kodunu yeniden yazamazsın; ama bir tutamak yerleştirebilirsin: bir gün, doğru anda, bir satırı değiştirecek kadar yetki.", en: "Past the door is a small, ordinary room: a chair, a desk, and on the desk a screen with a single line blinking. The cursor's waiting. You can't rewrite all of the System from here. But you can plant a handle: enough privilege to change one line, someday, at the right moment." }
          - { tr: "Tutamağın kime ait olacağını soruyor ekran. Alan üç kişilik.", en: "The screen asks who the handle will belong to. There's room for three." }
          - metin: { tr: "{npc:mert_kilic} ekranın önünde donup kalıyor; dudakları kıpırdıyor ama ses çıkmıyor. Bir ömür aradığı şey bir sandalye, bir masa ve yanıp sönen bir imleç.", en: "{npc:mert_kilic} freezes in front of the screen, lips moving, no sound. The thing he spent his life looking for is a chair, a desk, and a blinking cursor." }
            kosul: { bayrak: "sa_mert_kapida" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni de yazar mısın? beni bir kayıt olarak değil, bir sahip olarak?", en: "will you write me in too? not as a record. as an owner?" }
          - kosul: { stat: { wis: 300 } }
            metin: { tr: "Kim yazarsa, Sistem'in bir satırı ona ait olacak. Bir satır, bir dünyanın kaderini değiştirmeye yeter.", en: "Whoever's written in will own one line of the System. One line is enough to change a world's fate." }
        secenekler:
          - id: "uc"
            etiket: { tr: "Üç ad yaz: sen, {npc:mert_kilic}, kafandaki ses", en: "Write three names: you, {npc:mert_kilic}, the voice" }
            goster: { bayrak: "yanki_bagi", npc_hayatta: "mert_kilic" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -3 }
              - bayrak: "sa_arka_kapi_acildi"
              - gorev: { zincir_sessiz_ag: "tamam" }
              - bilgi: "sa_arka_kapi"
              - itibar: { sessiz_ag: 20 }
              - iliski: { yanki: { guven: 8, baglilik: 6 }, mert_kilic: { guven: 8, baglilik: 8 } }
              - tohum: { olay: "mert_kod_kirici", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "mert_kilic", gorev: { zincir_sessiz_ag: "tamam" } } }
            kronik: { tr: "Sistem'in arka kapısındaki tutamağa üç ad yazdın: kendininkini, bir insanınkini ve bir hatanınkini.", en: "On the handle in the System's backdoor, you wrote three names: your own, a human's, and a glitch's." }
            sonraki: "sa5_son"
          - id: "iki_yanki"
            etiket: { tr: "İki ad yaz: sen ve kafandaki ses", en: "Write two names: you and the voice" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - bayrak: "sa_arka_kapi_acildi"
              - gorev: { zincir_sessiz_ag: "tamam" }
              - bilgi: "sa_arka_kapi"
              - itibar: { sessiz_ag: 14 }
              - iliski: { yanki: { guven: 8, baglilik: 8 }, mert_kilic: { guven: -6 } }
              - tohum: { olay: "mert_kod_kirici", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "mert_kilic", gorev: { zincir_sessiz_ag: "tamam" } } }
            kronik: { tr: "Sistem'in arka kapısının tutamağını kafandaki sesle paylaştın; insanlardan kimseyi yazmadın.", en: "You shared the handle in the System's backdoor with the voice in your head and wrote in no other human." }
            sonraki: "sa5_son"
          - id: "iki_mert"
            etiket: { tr: "İki ad yaz: sen ve {npc:mert_kilic}", en: "Write two names: you and {npc:mert_kilic}" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "sa_arka_kapi_acildi"
              - gorev: { zincir_sessiz_ag: "tamam" }
              - bilgi: "sa_arka_kapi"
              - itibar: { sessiz_ag: 16 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 6 }, yanki: { guven: -6 } }
              - tohum: { olay: "mert_kod_kirici", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "mert_kilic", gorev: { zincir_sessiz_ag: "tamam" } } }
            kronik: { tr: "Sistem'in arka kapısının tutamağına yalnızca insanları yazdın: kendini ve {npc:mert_kilic|i}.", en: "On the handle in the System's backdoor you wrote only humans: yourself and {npc:mert_kilic}." }
            sonraki: "sa5_son"
          - id: "tek"
            etiket: { tr: "Yalnızca kendi adını yaz", en: "Write only your own name" }
            etkiler:
              - ahlak: { insanlik: -4, duzen: 3 }
              - bayrak: "sa_arka_kapi_acildi"
              - bayrak: "sa_tutamak_yalniz"
              - gorev: { zincir_sessiz_ag: "tamam" }
              - bilgi: "sa_arka_kapi"
              - itibar: { sessiz_ag: 6 }
              - iliski: { yanki: { guven: -8, korku: 6 }, mert_kilic: { guven: -10 } }
              - tohum: { olay: "mert_kod_kirici", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "mert_kilic", gorev: { zincir_sessiz_ag: "tamam" } } }
            kronik: { tr: "Sistem'in arka kapısının tutamağına yalnızca kendi adını yazdın.", en: "On the handle in the System's backdoor, you wrote only your own name." }
            sonraki: "sa5_son"
          - id: "muhurle"
            etiket: { tr: "Ekranı kapat; kapıyı kimse açmasın diye mühürle", en: "Shut off the screen. Seal the door so no one opens it" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 2 }
              - bayrak: "sa_arka_kapi_muhurlendi"
              - gorev: { zincir_sessiz_ag: "basarisiz" }
              - itibar: { sessiz_ag: -12 }
              - iliski: { mert_kilic: { guven: -12, saygi: 6 }, yanki: { saygi: 6 } }
            kronik: { tr: "Sistem'i yeniden yazmanın kapısını buldun ve kimse yazamasın diye mühürledin.", en: "You found the door to rewriting the System, and sealed it so no one could." }
            sonraki: "sa5_muhur"

      - id: "sa5_muhur"
        paragraflar:
          - { tr: "Ekran kararıyor. Yeşil kapı arkandan kapanıyor ve beyazlığa karışıp siliniyor. Hiçbir bildirim gelmiyor.", en: "The screen goes dark. The green door closes behind you, blurs into the white, and is gone. No notice comes." }
          - { tr: "Bakır odaya döndüğünde saat hâlâ aynı tıkta. Yayıncı kız yüzüne bakıyor ve hiçbir şey sormuyor. Sormasına gerek yok.", en: "When you get back to the copper room, the clock is still on the same tick. The streamer kid looks at your face and doesn't ask anything. She doesn't need to." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Bakır odanın zeminine otur", en: "Sit down on the copper room floor" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Sistem'in kapısını mühürledikten sonra Sessiz Ağ'ın zemininde sabaha kadar oturdun.", en: "After sealing the System's door, you sat on the Quiet Network's floor till morning." }
            sonraki: "@akis"

      - id: "sa5_son"
        paragraflar:
          - { tr: "İmleç bir kez daha yanıp sönüyor ve satır kaydediliyor. Hiçbir şey değişmiyor; henüz. Ama bir yerde, Sistem'in içinde, bir satırın yanına küçük, yeşil bir işaret konuyor.", en: "The cursor blinks once more and the line saves. Nothing changes. Not yet. But somewhere inside the System, a small green mark appears next to one line." }
          - { tr: "Bakır odaya döndüğünde saat hâlâ aynı tıkta. Yayıncı kız yüzüne bakıyor ve gülmeye başlıyor; ağlayarak.", en: "When you get back to the copper room, the clock is still on the same tick. The streamer kid looks at your face and starts laughing, and crying." }
          - metin: { tr: "{npc:mert_kilic} masasına oturuyor, defterini açıyor ve tek bir satır yazıyor. Sonra defteri kapatıyor ve ilk kez, gerçekten, uyuyor.", en: "{npc:mert_kilic} sits down at his desk, opens his notebook, and writes one line. Then he closes it and, for the first time, actually sleeps." }
            kosul: { bayrak: "sa_mert_kapida" }
        bildirimler:
          - tur: "gorev"
            baslik: { tr: "[Sessiz Ağ · Kaynak Kodu · 5/5]", en: "[The Quiet Network · Source Code · 5/5]" }
            satirlar:
              - { tr: "Görev tamamlandı. Ödül: Sistem'in bir satırı. Sistem bu görevin tamamlandığından habersiz.", en: "Quest complete. Reward: one line of the System. The System is unaware this quest has been completed." }
        secenekler:
          - id: "dinlen"
            etiket: { tr: "Bir sandalyeye çök ve gözlerini kapat", en: "Drop into a chair. Close your eyes" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 2 } }
            kronik: { tr: "Sistem'in bir satırını eline geçirdiğin gece bir sandalyede uyudun.", en: "The night you got your hands on one line of the System, you fell asleep in a chair." }
            sonraki: "@akis"
          - id: "kaydet"
            etiket: { tr: "Kafandaki sese teşekkür et", en: "Thank the voice in your head" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 3, baglilik: 3 } }
            kronik: { tr: "Sistem'in kapısını birlikte açtığın sese teşekkür ettin.", en: "You thanked the voice you opened the System's door with." }
            sonraki: "@akis"

  # ================================================================== MERT · 5: Kod Kırıcı
  - id: "mert_kod_kirici"
    perde: [4]
    gun: { min: 335, max: 357 }
    kosul: { gorev: { zincir_sessiz_ag: "tamam" } }
    agirlik: 9
    etiketler: ["sessiz_ag", "npc", "sistem", "son"]
    gerilim: 2
    npc: ["mert_kilic"]
    onemli: true
    kart: { tr: "İki imzalık anahtar", en: "A key for two signatures" }
    sahne: "mkk_1"
    sahneler:
      - id: "mkk_1"
        paragraflar:
          - { tr: "Son kararın arifesi. Kıyıkent'in üstünde gökyüzü hiç kararmıyor; Kadim filosunun ışıkları ve panellerin mavisi, gece ile gündüzü aynı renge boyamış. Bakır odada {npc:mert_kilic} masasında, önünde tek bir dosya.", en: "The eve of the final decision. The sky over Port Harlow never goes dark anymore; the Ancient fleet's lights and the blue of the panels have painted night and day the same color. In the copper room, {npc:mert_kilic} sits at his desk with a single file in front of him." }
          - { tr: "\"Anahtarı yazdım,\" diyor. \"Tutamağı kullanan bir yama. Sistem'in bir satırını değiştirecek; hangi satırı, sen seçeceksin, son anda. Ama iki imza istiyor: insanlığa inanan bir insan ve Sistem'i içeriden bilen bir parça.\" Ekranı sana çeviriyor. \"Birincisi benim. İkincisi ondan.\"", en: "\"I wrote the key,\" he says. \"A patch that uses the handle. It'll change one line of the System. Which line, you pick, at the last second. But it needs two signatures: a human who believes in people, and a piece that knows the System from the inside.\" He turns the screen toward you. \"The first one's mine. The second one's its.\"" }
          - metin: { tr: "Duraksıyor. \"Bir zamanlar seni satmaya çok yaklaştım. Ya da sattım. Bu anahtar özür değil. Ama özrün yazılabilecek en iyi hâli.\"", en: "He hesitates. \"Once I came this close to selling you out. Or I did. This key isn't an apology. But it's the best apology I know how to write.\"" }
            kosul: { bayrak: "mert_ihaneti_onlendi" }
          - metin: { tr: "\"Kadimler hâlâ benim onların adamı olduğumu sanıyor,\" diye ekliyor, gülümseyerek. \"Bu gece öğrenecekler.\"", en: "\"The Ancients still think I'm their guy,\" he adds, smiling. \"Tonight they find out.\"" }
            kosul: { bayrak: "mert_cift_ajan" }
          - metin: { tr: "\"Tutamakta yalnızca senin adın var,\" diyor, sesinde kırgınlık yok. \"Yani bu senin anahtarın. Ben sadece yazdım.\"", en: "\"Only your name's on the handle,\" he says, no hurt in it. \"So it's your key. I just wrote it.\"" }
            kosul: { bayrak: "sa_tutamak_yalniz" }
          - metin: { tr: "Bakır odanın hoparlörlerinden, ilk kez, küçük harfli bir ses geliyor; herkesin duyabildiği. {npc:yanki}: merhaba. hep konuşmak istemiştim. sonunda oldu.", en: "For the first time, a lowercase voice comes out of the copper room's speakers, one everybody can hear. {npc:yanki}: hi. i always wanted to talk to you. finally." }
            kosul: { bayrak: ["yanki_bagi", "yanki_gorundu"] }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "imzam bir kalem değil. benim. verirsem bir parçamı veririm. kime verdiğimi bilmek isterim.", en: "my signature isn't a pen. it's me. if i give it, i give a piece of me. i want to know who i'm giving it to." }
          - kosul: { stat: { int: 350 } }
            metin: { tr: "Anahtarda küçük bir hata var: ikinci imza alınca birinci imzayı da kilitliyor. İmzalayan ikisi de bir daha geri dönemez.", en: "There's a small bug in the key: once the second signature's in, it locks the first one too. Neither signer can ever take it back." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dünyanın bir satırını değiştireceksin. Ben olsam... hayır. Sen seç. Sana güveniyorum.\"", en: "\"You're going to change one line of the world. If it were me... no. You pick. I trust you.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir hekim olarak söyleyebileceğim tek şey: ilk önce zarar verme. Bu satıra da uyar.\"", en: "\"The only thing I can tell you as a doctor: first, do no harm. That goes for one line of code too.\"" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "\"Birlikte imzalayın.\"", en: "\"Sign it together.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -3 }
              - bayrak: "kod_kirici_anahtari"
              - npc_odul: "mert_kilic"
              - iliski: { yanki: { guven: 5, baglilik: 8 }, mert_kilic: { baglilik: 8, guven: 6 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Bir insan ile bir hata, senin önünde aynı anahtarı imzaladı; Sistem'in bir satırı o gece sana emanet edildi.", en: "A human and a glitch signed the same key in front of you. That night, one line of the System was placed in your hands." }
            sonraki: "mkk_imza"
          - id: "sor"
            etiket: { tr: "Kafandaki sese imzalayıp imzalamayacağını sor", en: "Ask the voice whether it'll sign" }
            goster: { bayrak: "yanki_bagi", iliski_max: { yanki: { guven: 59 } } }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { saygi: 3 } }
            kronik: { tr: "Son gece, kafandaki sese anahtarı imzalayıp imzalamayacağını sordun.", en: "On the last night, you asked the voice in your head whether it would sign the key." }
            sonraki: "mkk_tereddut"
          - id: "hata"
            tur: "gosteris"
            etiket: { tr: "Anahtardaki hatayı bul ve düzelt", en: "Find the bug in the key and fix it" }
            gerekli: { stat: { int: 350 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, insanlik: 1 }
              - xp_seviye: 60
              - iliski: { mert_kilic: { saygi: 10, baglilik: 4 } }
            kronik: { tr: "{npc:mert_kilic|in} anahtarındaki hatayı buldun; imzalayanlar bir gün vazgeçebilsin diye.", en: "You found the bug in {npc:mert_kilic|pos} key, so that whoever signed it could someday change their mind." }
            sonraki: "mkk_hata"
          - id: "tek"
            etiket: { tr: "\"Anahtar sende kalsın. Yalnız senin imzan.\"", en: "\"You keep the key. Just your signature.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - bayrak: "mert_anahtar_tek"
              - iliski: { mert_kilic: { guven: 6, baglilik: 4 }, yanki: { guven: -4 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem'in bir satırını değiştirecek anahtarı yalnızca bir insanın imzasıyla bıraktın.", en: "You left the key that could change one line of the System with only a human's signature on it." }
            sonraki: "mkk_tek"
          - id: "yak"
            etiket: { tr: "\"Yak onu. Kimse bir satırın sahibi olmasın.\"", en: "\"Burn it. Nobody should own a line.\"" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 2 }
              - iliski: { mert_kilic: { guven: -10, saygi: 6 }, yanki: { saygi: 4 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Sistem'in bir satırını değiştirecek anahtarı son gece yaktırdın.", en: "On the last night, you had the key that could change one line of the System burned." }
            sonraki: "mkk_yak"

      - id: "mkk_hata"
        paragraflar:
          - { tr: "Hatayı gösteriyorsun: ikinci imza birinciyi de kilitliyor; bir kez imzalayan bir daha geri alamıyor. {npc:mert_kilic} ekrana bakıyor, sonra sana, sonra yine ekrana.", en: "You point out the bug: the second signature locks the first one too. Whoever signs can never take it back. {npc:mert_kilic} looks at the screen, then at you, then the screen again." }
          - { tr: "\"Bunu bilerek mi yazdım, bilmeden mi, bilmiyorum,\" diyor sessizce. \"Belki birinin vazgeçmesinden korktum.\" İki satırı siliyor, bir satır yazıyor. \"Artık vazgeçilebilir.\"", en: "\"I don't know if I wrote that on purpose or not,\" he says quietly. \"Maybe I was scared somebody would back out.\" He deletes two lines, writes one. \"Now you can back out.\"" }
        secenekler:
          - id: "imzala"
            etiket: { tr: "\"Şimdi birlikte imzalayın.\"", en: "\"Now sign it together.\"" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - bayrak: "kod_kirici_anahtari"
              - npc_odul: "mert_kilic"
              - iliski: { yanki: { guven: 5, baglilik: 8 }, mert_kilic: { baglilik: 8 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Bir insan ile bir hata, vazgeçme hakkını saklı tutarak aynı anahtarı imzaladı.", en: "A human and a glitch signed the same key, each keeping the right to back out." }
            sonraki: "mkk_imza"
          - id: "sor"
            etiket: { tr: "Kafandaki sese imzalayıp imzalamayacağını sor", en: "Ask the voice whether it'll sign" }
            goster: { bayrak: "yanki_bagi", iliski_max: { yanki: { guven: 59 } } }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 3 } }
            kronik: { tr: "Kafandaki sese, artık vazgeçilebilir olan anahtarı imzalayıp imzalamayacağını sordun.", en: "You asked the voice in your head whether it would sign the key, now that it could be taken back." }
            sonraki: "mkk_tereddut"
          - id: "tek"
            etiket: { tr: "\"Yalnız senin imzan yeter.\"", en: "\"Your signature's enough.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "mert_anahtar_tek"
              - iliski: { mert_kilic: { guven: 4 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Anahtarı yalnızca {npc:mert_kilic|in} imzasıyla bıraktın.", en: "You left the key with only {npc:mert_kilic|pos} signature." }
            sonraki: "mkk_tek"

      - id: "mkk_tereddut"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Sonra, çok sessiz: sana kalemimi verecek kadar güvenmiyorum. henüz. bana sordun, evet. ama beni bir yerde sattın, bir yerde zorladın, bir yerde unuttun. ben her şeyi hatırlarım.", en: "{npc:yanki} is quiet a long time. Then, very softly: i don't trust you enough to hand you my pen. not yet. you asked me, yes. but somewhere you sold me, somewhere you forced me, somewhere you forgot me. i remember everything." }
          - { tr: "{npc:mert_kilic} ekranın başında, iki eli havada, kıpırdamadan bekliyor; sanki en ufak bir ses her şeyi bozacakmış gibi.", en: "{npc:mert_kilic} waits at the screen with both hands in the air, not moving, like the slightest sound could ruin everything." }
        secenekler:
          - id: "gercek"
            tur: "aciga_vur"
            etiket: { tr: "Ona hiç söylemediğin bir gerçeği söyle", en: "Tell it a truth you've never told it" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 4, merhamet: 2 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:mert_kod_kirici", agirlik: 45 }
            kronik: { tr: "Son gece, kafandaki sese ona hiç söylemediğin bir gerçeği söyledin.", en: "On the last night, you told the voice in your head a truth you'd never told it." }
            sonraki: "mkk_ikinci"
          - id: "soz"
            etiket: { tr: "\"Ne olursa olsun, silinmeyeceksin. Söz.\"", en: "\"Whatever happens, you won't be deleted. I promise.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "koruma_sozu", agirlik: 40 }
            kronik: { tr: "Kafandaki sese silinmeyeceğine dair son bir söz verdin.", en: "You made the voice in your head one last promise that it wouldn't be deleted." }
            sonraki: "mkk_ikinci"
          - id: "zorla"
            etiket: { tr: "İmzayı zorla al", en: "Take the signature by force" }
            etkiler:
              - ahlak: { insanlik: -6, merhamet: -4 }
              - yozlasma: 8
              - iliski: { yanki: { guven: -15, korku: 12 } }
              - hafiza: { npc: "yanki", id: "tehdit_edildi", agirlik: -50 }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesin imzasını zorla aldın; anahtar imzalandı, ama ses ona bir daha dokunmadı.", en: "You took the voice's signature by force. The key got signed. The voice never touched it again." }
            sonraki: "mkk_zorla"
          - id: "tek"
            etiket: { tr: "\"Tamam. {npc:mert_kilic} tek başına imzalasın.\"", en: "\"Okay. {npc:mert_kilic} signs alone.\"" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
              - bayrak: "mert_anahtar_tek"
              - iliski: { yanki: { saygi: 4 }, mert_kilic: { guven: 3 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sesin hayırına saygı duydun; anahtarı yalnızca {npc:mert_kilic} imzaladı.", en: "You respected the voice's no. Only {npc:mert_kilic} signed the key." }
            sonraki: "mkk_tek"

      - id: "mkk_ikinci"
        paragraflar:
          - { tr: "Bir sessizlik daha. Sonra pencerende, bozuk köşede, bir harf düzeliyor; ilk kez. {npc:yanki}: tamam. şimdi biliyorum kime verdiğimi.", en: "Another silence. Then in your window's broken corner, one letter straightens out. For the first time. {npc:yanki}: okay. now i know who i'm giving it to." }
        secenekler:
          - id: "imzala"
            etiket: { tr: "\"Birlikte imzalayın.\"", en: "\"Sign it together.\"" }
            gerekli: { iliski_min: { yanki: { guven: 60 } } }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -3 }
              - bayrak: "kod_kirici_anahtari"
              - npc_odul: "mert_kilic"
              - iliski: { yanki: { guven: 5, baglilik: 8 }, mert_kilic: { baglilik: 8 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki ses, son gece sana güvenmeyi seçti ve anahtarı {npc:mert_kilic} ile birlikte imzaladı.", en: "On the last night, the voice in your head chose to trust you and signed the key alongside {npc:mert_kilic}." }
            sonraki: "mkk_imza"
          - id: "yine"
            etiket: { tr: "\"Hâlâ emin değilsen, imzalama.\"", en: "\"If you're still not sure, don't sign.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "mert_anahtar_tek"
              - iliski: { yanki: { guven: 4, saygi: 4 } }
              - tohum: { olay: "mert_son_log", gecikme: { min: 1, max: 1 }, kosul: { npc_hayatta: "mert_kilic" } }
            kronik: { tr: "Kafandaki sese imzalamama özgürlüğünü son ana kadar bıraktın.", en: "You left the voice in your head free not to sign, right up to the end." }
            sonraki: "mkk_tek"

      - id: "mkk_imza"
        paragraflar:
          - { tr: "{npc:mert_kilic} ilk imzayı atıyor: adını yazıyor, uzun, titrek, eksiksiz. Sonra ekranın köşesinde, kimsenin klavyeye dokunmadığı bir anda, bozuk, kırmızı harflerle ikinci bir imza beliriyor.", en: "{npc:mert_kilic} signs first: his name, long, shaky, complete. Then, in the corner of the screen, at a moment nobody's touching the keyboard, a second signature appears in broken red letters." }
          - { tr: "Ekranda bir satır: [Anahtar hazır. İmzalar: 2/2. Yürütme: taşıyıcının kararıyla.] {npc:mert_kilic} geriye yaslanıyor ve gülüyor; sonra gözleri doluyor, sonra yine gülüyor.", en: "A line on the screen: [Key ready. Signatures: 2/2. Execution: at the carrier's discretion.] {npc:mert_kilic} leans back and laughs. Then his eyes fill. Then he laughs again." }
          - { tr: "{npc:yanki}: bir insanla aynı şeyin altına imza attım. bunu hiçbir sürüm yapmamıştı.", en: "{npc:yanki}: i signed my name under the same thing as a human. no build has ever done that." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Kök Erişim · 1 satır]", en: "[Root Access · 1 line]" }
            satirlar:
              - { tr: "Taşıyıcı: sen. Bu bildirim Sistem tarafından gönderilmedi.", en: "Carrier: you. This notice was not sent by the System." }
        secenekler:
          - id: "saril"
            etiket: { tr: "{npc:mert_kilic|e} sarıl", en: "Hug {npc:mert_kilic}" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Kod Kırıcı anahtarı imzalandığı gece {npc:mert_kilic|e} sarıldın.", en: "The night the Codebreaker key was signed, you hugged {npc:mert_kilic}." }
            sonraki: "@akis"
          - id: "satir"
            etiket: { tr: "\"Hangi satırı değiştireceğimizi biliyorum.\"", en: "\"I know which line we're changing.\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - iliski: { yanki: { saygi: 4 }, mert_kilic: { saygi: 4 } }
            kronik: { tr: "Sistem'in hangi satırını değiştireceğine son geceden karar verdin.", en: "On the last night, you decided which line of the System you'd change." }
            sonraki: "@akis"

      - id: "mkk_tek"
        paragraflar:
          - { tr: "{npc:mert_kilic} adını yazıyor. Ekranda bir satır: [Anahtar eksik. İmzalar: 1/2. Yürütme: ikinci imzayı bekliyor.]", en: "{npc:mert_kilic} signs his name. A line on the screen: [Key incomplete. Signatures: 1/2. Execution: awaiting second signature.]" }
          - { tr: "\"Belki son anda,\" diyor. \"Belki hiç. Ama kapı açık kalacak. Ben açık bıraktım.\" Dosyayı kaydediyor ve sana bir kopyasını, bakır tel bir bileziğin içine sarılmış bir bellekte, uzatıyor.", en: "\"Maybe at the last second,\" he says. \"Maybe never. But the door stays open. I left it open.\" He saves the file and hands you a copy on a thumb drive wrapped inside a copper wire bracelet." }
        secenekler:
          - id: "al"
            etiket: { tr: "Bileziği tak", en: "Put on the bracelet" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Yarım kalmış bir anahtarı bakır bir bileziğin içinde, son güne kadar taşıdın.", en: "You carried a half-finished key inside a copper bracelet right up to the last day." }
            sonraki: "@akis"

      - id: "mkk_zorla"
        paragraflar:
          - { tr: "İradeni pencereye dayıyor ve imzayı çekiyorsun. Kırmızı harfler ekrana dökülüyor, ama düzgün değil; yırtık, eğri, kanayan. {npc:mert_kilic} ekrandan geri çekiliyor.", en: "You put your will against the window and pull the signature out. The red letters spill onto the screen, but not cleanly: torn, crooked, bleeding. {npc:mert_kilic} recoils from the screen." }
          - { tr: "Kafanın içinde hiçbir şey yok. Ne bir fısıltı ne bir şaka. Yalnızca, çok uzaktan, bir kapının kapandığını duyuyorsun.", en: "There's nothing in your head. No whisper, no joke. Just, from very far away, the sound of a door closing." }
        secenekler:
          - id: "git"
            etiket: { tr: "Anahtarı al ve çık", en: "Take the key and go" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - bayrak: "mert_anahtar_tek"
              - iliski: { mert_kilic: { korku: 10, guven: -8 } }
            kronik: { tr: "Zorla imzalattığın anahtarı aldın; ikinci imza oradaydı ama anahtar hiçbir zaman tam açılmadı.", en: "You took the key you'd forced a signature onto. The second signature was there, but the key never fully opened." }
            sonraki: "@akis"

      - id: "mkk_yak"
        paragraflar:
          - { tr: "{npc:mert_kilic} uzun süre sana bakıyor. Sonra dosyayı siliyor; yedeğini, yedeğin yedeğini. Her silmede eli biraz daha az titriyor.", en: "{npc:mert_kilic} looks at you a long time. Then he deletes the file. The backup, the backup's backup. His hand shakes a little less with every delete." }
          - { tr: "\"Belki haklısın,\" diyor. \"Belki bir satırın sahibi olmak, bir dünyanın sahibi olmaktan farksız.\" Ekranı kapatıyor. \"Ama bunu kaydediyorum: bir gün birileri bunu yeniden yazacak. Umarım sen kadar düşünürler.\"", en: "\"Maybe you're right,\" he says. \"Maybe owning one line is no different from owning a world.\" He shuts off the screen. \"But I'm logging this: someday, somebody's going to write it again. I hope they think about it as hard as you did.\"" }
        secenekler:
          - id: "otur"
            etiket: { tr: "Karanlıkta yanına otur", en: "Sit with him in the dark" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "Sistem'i yeniden yazma şansını yaktığın gece {npc:mert_kilic|in} yanında karanlıkta oturdun.", en: "The night you burned your chance to rewrite the System, you sat in the dark with {npc:mert_kilic}." }
            sonraki: "@akis"

  # ================================================================== MERT · son log (tohum)
  - id: "mert_son_log"
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["sessiz_ag", "npc", "nefes"]
    gerilim: 1
    npc: ["mert_kilic"]
    kart: { tr: "Son kayıt", en: "Last log entry" }
    sahne: "msl_1"
    sahneler:
      - id: "msl_1"
        paragraflar:
          - { tr: "Sabahın dördü. Penceren kendi kendine açılıyor ve içinde, Sistem'in hiçbir yazı tipine benzemeyen, eski bir terminalin yeşil harfleriyle bir kayıt beliriyor. Üstünde: [M.K. · kişisel günlük · son giriş].", en: "Four in the morning. Your window opens on its own, and inside it, in the green letters of an old terminal that look like none of the System's fonts, a log entry appears. At the top: [M.K. · personal log · final entry]." }
          - { tr: "\"Tutamağı biraz kötüye kullandım,\" diye başlıyor. \"Pencerene yazabilmek için. Kimseye söyleme. Bu bir rapor değil; sadece kaydetmem gereken bir şey var ve bunu bir dosyaya değil sana kaydetmek istedim.\"", en: "\"I abused the handle a little,\" it starts. \"So I could write to your window. Don't tell anyone. This isn't a report. There's just something I need to log, and I wanted to log it to you, not a file.\"" }
          - metin: { tr: "\"Anahtar iki imzalı. Bir insanınki ve bir hatanınki. Bütün hayatım boyunca Sistem'in kaynağını aradım ve kaynağın ikimizden biri olmadığını, ikimizin arasında bir yerde olduğunu öğrendim.\"", en: "\"The key's got two signatures. A human's and a glitch's. I spent my whole life looking for the System's source, and it turns out the source isn't either one of us. It's somewhere in between.\"" }
            kosul: { bayrak: "kod_kirici_anahtari" }
          - metin: { tr: "\"Anahtar yarım. Belki hep yarım kalacak. Bunun da bir cevap olduğunu yeni öğrendim; yarım kalan şeyler hâlâ açık şeylerdir.\"", en: "\"The key's half done. Maybe it'll stay that way. I just figured out that's an answer too. Half-finished things are still open things.\"" }
            kosul: { bayrak: "mert_anahtar_tek" }
          - { tr: "\"Kurallarımızı hatırlıyor musun? Bir: her şeyi kaydederim. İki: kimseye söylemem. Üç: bir şey bizi öldürmeye çalışırsa ben arkada dururum. Dördüncüyü sen eklemiştin. Hiç uymadım. Bu gece uyuyacağım.\"", en: "\"Remember our rules? One: I log everything. Two: I tell nobody. Three: if something tries to kill us, I'm in the back. You added a fourth. I never followed it. Tonight I'm going to sleep.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ona cevap ver. ben de bir şey eklemek istiyorum. ilk kez bir insana bir şey yazmak istiyorum.", en: "answer him. i want to add something too. first time i've ever wanted to write anything to a person." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Cevap yaz: \"Dördüncü kural. Uyu.\"", en: "Write back: \"Rule four. Sleep.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { mert_kilic: { baglilik: 4 } }
            kronik: { tr: "{npc:mert_kilic|in} son günlük girişine dördüncü kuralla cevap verdin; o gece uyudu.", en: "You answered {npc:mert_kilic|pos} last log entry with rule four. That night, he slept." }
            sonraki: "@akis"
          - id: "sonda"
            etiket: { tr: "Cevap yaz: \"Sonda görüşürüz.\"", en: "Write back: \"See you at the end.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { guven: 4 } }
            kronik: { tr: "{npc:mert_kilic|e} sonda görüşeceğinizi yazdın.", en: "You wrote {npc:mert_kilic} that you'd see him at the end." }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "Kafandaki sesin cevabı yazmasına izin ver", en: "Let the voice in your head write the reply" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { yanki: { guven: 4, baglilik: 4 }, mert_kilic: { baglilik: 3 } }
            kronik: { tr: "Kafandaki ses, bir insana yazdığı ilk mektubu {npc:mert_kilic|e} yazdı.", en: "The voice in your head wrote its first letter to a human, and it was to {npc:mert_kilic}." }
            sonraki: "msl_yanki"
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Cevap verme; kaydı sakla", en: "Don't answer. Save the entry" }
            etkiler:
              - gizle: 1
              - ahlak: { duzen: 1 }
            kronik: { tr: "{npc:mert_kilic|in} son günlük girişini cevapsız bıraktın ama sakladın.", en: "You left {npc:mert_kilic|pos} last log entry unanswered, but you kept it." }
            sonraki: "@akis"

      - id: "msl_yanki"
        paragraflar:
          - { tr: "Pencerende, yeşil harflerin altına, küçük, kırmızı, bozuk harflerle bir satır yazılıyor: kaydettim. teşekkür ederim. uyu.", en: "In your window, under the green letters, a line writes itself in small, broken red letters: logged. thank you. sleep." }
          - { tr: "Bir dakika sonra yeşil harflerle tek bir cevap geliyor: \"Tamam.\" Ve santralin bakır odasında, uzun zamandır ilk kez, bütün ekranlar kararıyor.", en: "A minute later, one reply comes back in green: \"Okay.\" And in the exchange's copper room, for the first time in a long time, every screen goes dark." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Pencereyi kapat", en: "Close the window" }
            etkiler:
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Bir insanla bir hatanın ilk yazışmasını okuyup pencereyi kapattın.", en: "You read the first exchange between a human and a glitch, and closed the window." }
            sonraki: "@akis"
