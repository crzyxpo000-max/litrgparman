# Parti H — Perde 2 Kıyıkent: Sanayi, Tepe, Kule Dibi (docs/PERDE2_4.md §4 "Parti H").
# Lonca'nın sanayisi (atölyeler, disiplin, kapı ilanları, grev, sıralama tabelası), Yükselenler'in tepesi (seçilmişler, korkulu
# aileler, Dinleyiciler, şehit duvarı) ve Kule'nin dibinde kurulan avcı pazarı (kuyruk, geri dönmeyenler, sahte rekor, sıralama çanı).
# Ana olaylar havuzdan gelir; takip olayları yalniz_tohum'dur ve yalnızca bu dosyadaki olaylar tarafından tohumlanır:
# sanayi_ocak_cocuklari, sanayi_kacak_avci, sokak_efsanesi, tepe_sinav_sonrasi, tepe_cati_arasi_sonrasi, kule_dibi_donus.
# Dünya durumu: cekirdek_* (Kasaba Çekirdeği'nin sahibi), uye_* (oyuncunun fraksiyonu), kule_acik, kule_kat değişkeni, Deniz'in akıbeti.
olaylar:
  # ================================================================== OCAK BAŞINDA (Sanayi)
  - id: "sanayi_ocak_basi"
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 33, max: 150 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["sanayi", "lonca", "hakimiyet"]
    gerilim: 2
    kart: { tr: "Ocak başında", en: "At the forge" }
    sahne: "sanayi_ocak_basi_1"
    sahneler:
      - id: "sanayi_ocak_basi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Eski tersanenin kuru havuzu artık bir ocak sırası. On iki baca aynı anda tütüyor; hava demir, kömür ve yanık canavar yağı tadında.", en: "The old shipyard's dry dock is a row of forges now. Twelve stacks smoke at once, and the air tastes like iron, coal, and burnt monster fat." }
          - { tr: "En büyük ocağın başında geniş omuzlu bir demirci kadın, kabzasına kapı çekirdeği gömülmüş bir kılıç dövüyor. Çekirdek her çekiç darbesinde mavi mavi atıyor ve yalnızca köpeklerin duyabileceği bir perdeden çığlık atıyor; köpeklerin ve senin.", en: "At the biggest forge, a broad-shouldered smith is hammering out a sword with a Gate core sunk into the hilt. The core pulses blue with every strike, screaming at a pitch only dogs can hear. Dogs, and you." }
          - { tr: "Körükleri on iki, on üç yaşlarında çocuklar basıyor. Boyunlarında Lonca'nın demir halkasıyla damgalanmış tayın fişleri asılı; kapıdaki tahtada tebeşirle yazılmış: Çekirdek başına iki öğün.", en: "The bellows are worked by kids, twelve, thirteen years old, ration chits stamped with the Guild's iron ring hanging from strings around their necks. On the board by the door, in chalk: Two meals per core." }
          - metin: { tr: "Kasaba Çekirdeği Lonca'ya bağlandığından beri ocak sırasının kablolarında onun mavi ışığı akıyor. Ocaklar hiç sönmüyor; çocuklar da hiç uyumuyor.", en: "Ever since the Town Core went to the Guild, its blue light has been running down the forge-row cables. The forges never go out now. Neither do the kids." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kapıda Konsey'in bir duyurusu asılı: On altı yaşından küçükler ocaklarda çalışamaz. Birisi rakamın tam üstüne bir tayın fişi çivilemiş.", en: "There's a Council notice on the gate: No one under sixteen works the forges. Somebody has nailed a ration chit right over the number." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Demirci kadın parmağındaki Lonca halkasını görüyor ve çekici bir an havada tutuyor. \"Loncanın yeni gözdesi,\" diyor; övgü mü alay mı, belli değil.", en: "The smith clocks the Guild ring on your finger and holds her hammer up a beat. \"The Guild's new golden child,\" she says. Could be praise. Could be the other thing." }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "[ALG] Çekirdeğin içinden kıl kadar ince bir çatlak geçiyor ve her darbede biraz daha açılıyor. Üç darbe daha; belki dört.", en: "[PER] There's a hairline crack running through the core, and every strike opens it a little wider. Three more hits. Maybe four." }
          - kosul: { stat: { per: 45 } }
            metin: { tr: "[ALG] Çatlak açılınca içindeki şey önce en yakın sıcaklığa atılacak: körüğü basan çocuğa.", en: "[PER] When it splits, whatever's inside goes for the nearest heat first. That's the kid on the bellows." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o çekirdeğin içinde hâlâ bir şey var. bağırıyor ve senden başka kimse duymuyor. ne kadar tanıdık, değil mi?", en: "there's still something inside that core. it's screaming, and nobody hears it but you. sound familiar?" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Körükteki çocuk... Kardeşim de o yaşta. O yaştaydı. Her neyse.\"", en: "\"The kid on the bellows... My sister's that age. Was that age. Whatever.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ellerine bak. Yanık değil o, nasır. Haftalardır buradalar.\"", en: "\"Look at their hands. Those aren't burns, they're calluses. They've been here for weeks.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Çekirdeğin atışı düzensiz. Düzensiz bir sinyal hiçbir zaman iyi haber değildir.\"", en: "\"That core's pulse is irregular. An irregular signal is never good news.\"" }
        secenekler:
          - id: "uyar"
            etiket: { tr: "Ustaya çekirdeğin çatladığını söyle", en: "Tell the smith the core is cracking" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
            sonraki: "sanayi_ocak_basi_uyari"
          - id: "kavra"
            tur: "gosteris"
            etiket: { tr: "Çekirdeği çıplak elle kavra ve söndür", en: "Grab the core bare-handed and snuff it" }
            gerekli: { stat: { end: 40 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, insanlik: -1 }
            sonraki: "sanayi_ocak_basi_ezme"
          - id: "cocuklar"
            etiket: { tr: "Çocukları körüklerden uzaklaştır", en: "Pull the kids off the bellows" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
            sonraki: "sanayi_ocak_basi_cocuklar"
          - id: "halka"
            etiket: { tr: "Halkanı göster; işi durdurmasını emret", en: "Flash your ring. Order her to stop the job" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
            sonraki: "sanayi_ocak_basi_emir"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Uzaktan izle; Lonca'nın ocağı, Lonca'nın derdi", en: "Watch from a distance. Guild forge, Guild problem" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -2 }
            sonraki: "sanayi_ocak_basi_patlama"

      - id: "sanayi_ocak_basi_uyari"
        yer: "sanayi"
        paragraflar:
          - { tr: "Demirci kadın çekici indirmiyor. Gözlerini başının üstünde asılı duran sayıya kaldırıyor, sonra yeniden örse indiriyor.", en: "The smith doesn't lower the hammer. Her eyes go up to the number hanging over your head, then back down to the anvil." }
          - { tr: "\"O seviyeyle bana çekirdek mi öğreteceksin?\" diyor. \"Yirmi yıl bu tersanede gemi kaynakladım evlat; çatlak sesini senden iyi bilirim.\"", en: "\"You're gonna teach me about cores with that number?\" she says. \"Twenty years I welded hulls in this yard, kid. I know what a crack sounds like better than you do.\"" }
          - metin: { tr: "Görünen seviyen ona hiçbir şey söylemiyor. Gerçeğini görse çekici çoktan bırakmıştı.", en: "Your public number tells her nothing. If she could see the real one, she'd have dropped that hammer already." }
            kosul: { gizli_fark_min: 1 }
          - { tr: "Çekiç iniyor. Çekirdeğin çığlığı bir perde yükseliyor ve körükteki çocuk kulaklarını tutuyor; demek ki artık o da duyuyor.", en: "The hammer comes down. The core's scream climbs a step, and the kid on the bellows clamps his hands over his ears. So now he hears it too." }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; çekici bıraksın", en: "Open your true level. Make her drop the hammer" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
            sonraki: "sanayi_ocak_basi_acik"
          - id: "ikna"
            etiket: { tr: "Çocuğu göster: \"O da duyuyor artık\"", en: "Point at the kid. \"He can hear it now too\"" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "sanayi_ocak_basi_patlama", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "sanayi_ocak_basi_cocuklar"
          - id: "omuz"
            etiket: { tr: "Omuz silk; uyardın, gerisi onun işi", en: "Shrug. You warned her. The rest is on her" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
            sonraki: "sanayi_ocak_basi_patlama"

      - id: "sanayi_ocak_basi_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pencereni açıyorsun ve gerçek satırını ocak dumanının içinde asılı bırakıyorsun. Demirci kadının çekici havada kalıyor, sonra yavaşça yanına iniyor.", en: "You open your window and leave your real line hanging in the forge smoke. The smith's hammer stops in midair, then drops slowly to her side." }
          - { tr: "\"Herkes ocaktan çıksın,\" diyor; sesi değişmiş. \"Şimdi.\" Çocuklar fişlerini avuçlayıp kapıya koşuyor.", en: "\"Everybody out of the forge,\" she says, and her voice has changed. \"Now.\" The kids grab their chits and run for the door." }
          - { tr: "Çekirdek örsün üstünde bir anlığına susuyor; sanki o da seni görmüş gibi. Sonra ikiye ayrılıyor.", en: "For one second the core goes quiet on the anvil, like it saw you too. Then it splits in two." }
        secenekler:
          - id: "kavra"
            etiket: { tr: "Ayrılan çekirdeği iki elinle kapat", en: "Close both hands over the splitting core" }
            gerekli: { stat: { end: 40 } }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: -1 }
            sonraki: "sanayi_ocak_basi_ezme"
          - id: "savas"
            etiket: { tr: "İçinden çıkanın karşısına geç", en: "Square up to whatever climbs out" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["erimis_cekirdek@dunya"], ortam: ["yanici"], kazan: "sanayi_ocak_basi_zafer", kaybet: "sanayi_ocak_basi_yenilgi", kac: "sanayi_ocak_basi_kacis" }

      - id: "sanayi_ocak_basi_emir"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halkayı kaldırdığında demirci kadının çenesi kasılıyor. Lonca'da emir emirdir; seviyesi kimin yüksekse onunki.", en: "When you hold up the ring, the smith's jaw tightens. In the Guild an order is an order, and it belongs to whoever has the bigger number." }
          - { tr: "\"Bu kılıç bu akşam kuzey hattına gidecek,\" diyor. \"Teslim etmezsem iki öğün değil, sıfır öğün.\" Ama çekici örsün yanına bırakıyor.", en: "\"This blade ships to the north line tonight,\" she says. \"If I don't deliver, it's not two meals. It's zero.\" But she sets the hammer down beside the anvil." }
          - { tr: "Çocuklar körüklerden çekiliyor. Ateş düşüyor ve çekirdek, sıcaklığını kaybedince, örsün üstünde titreyerek ikiye ayrılıyor.", en: "The kids step back from the bellows. The fire drops, and the core, losing its heat, shudders on the anvil and splits in two." }
        secenekler:
          - id: "kavra"
            tur: "gosteris"
            etiket: { tr: "Çekirdeği avucunda söndür", en: "Snuff the core in your palm" }
            gerekli: { stat: { end: 40 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 1, insanlik: -1 }
            sonraki: "sanayi_ocak_basi_ezme"
          - id: "savas"
            etiket: { tr: "İçinden çıkanın karşısına geç", en: "Square up to whatever climbs out" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["erimis_cekirdek@dunya"], ortam: ["yanici"], kazan: "sanayi_ocak_basi_zafer", kaybet: "sanayi_ocak_basi_yenilgi", kac: "sanayi_ocak_basi_kacis" }

      - id: "sanayi_ocak_basi_cocuklar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Körükteki çocuğu kolundan tutup kaldırıyorsun, öbürlerine kapıyı gösteriyorsun. Fişlerini avuçlarına alıp sana bakıyorlar: ocaktan ayrılan, öğününden de ayrılır.", en: "You take the bellows kid by the arm and lift him clear, then point the others at the door. They clutch their chits and stare at you. Walk away from the forge, you walk away from your meal." }
          - { tr: "Demirci kadın kükrüyor: \"Ateş düşerse çelik çiğ kalır! Kim verdi sana bu yetkiyi?\" Cevap veremeden çekirdek ikiye ayrılıyor.", en: "The smith roars. \"Fire drops, the steel goes raw! Who gave you the authority?\" Before you can answer, the core splits in two." }
          - { tr: "Örsün üstünde erimiş bir şey doğruluyor: mavi camdan bir iskelet, kaburgalarının arasında dönen sıvı demir. İlk baktığı yer, çocukların az önce durduğu boş körük.", en: "Something molten pulls itself upright on the anvil: a skeleton of blue glass with liquid iron churning between its ribs. The first place it looks is the empty bellows where the kids were standing a second ago." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Erimiş şeyin önüne geç", en: "Get in front of the molten thing" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["erimis_cekirdek@dunya"], ortam: ["yanici"], kazan: "sanayi_ocak_basi_zafer", kaybet: "sanayi_ocak_basi_yenilgi", kac: "sanayi_ocak_basi_kacis" }
          - id: "tekne"
            tur: "gosteris"
            etiket: { tr: "Su teknesini kaldır ve üstüne boşalt", en: "Lift the quench tank and dump it on the thing" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2 }
            sonraki: "sanayi_ocak_basi_tekne"

      - id: "sanayi_ocak_basi_tekne"
        yer: "sanayi"
        paragraflar:
          - { tr: "Su teknesi bir ton çeker, belki daha fazla. Kenarından tutup kaldırıyorsun ve içindeki kara su, ocak ışığında bir dalga gibi devriliyor.", en: "The quench tank weighs a ton, maybe more. You grab the lip, heave it up, and the black water inside rolls over in the forge light like a breaking wave." }
          - { tr: "Buhar tavanı dolduruyor. Cam iskelet tıslıyor, çatırdıyor ve sıvı demir kaburgalarının arasında griye dönüp donuyor; geriye çökmüş bir heykel kalıyor.", en: "Steam fills the rafters. The glass skeleton hisses, crackles, and the liquid iron between its ribs goes gray and sets. What's left is a slumped statue." }
          - { tr: "Boş tekneyi yere bıraktığında ocak sırasında kimse çekicini kaldırmıyor. Demirci kadın bir sana, bir yüz litrelik tekneye bakıyor ve bir şey demiyor.", en: "When you set the empty tank down, nobody up and down the forge row is swinging a hammer. The smith looks at you, then at the thirty-gallon tank, and says nothing." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ellerini silkele ve ustaya dön", en: "Shake off your hands and turn to the smith" }
            etkiler:
              - bayrak: "sanayi_ocak_kurtarildi"
              - bayrak: "sanayi_ocak_ezme"
            sonraki: "sanayi_ocak_basi_son"

      - id: "sanayi_ocak_basi_ezme"
        yer: "sanayi"
        paragraflar:
          - { tr: "Elini örsün üstündeki çekirdeğe kapatıyorsun. Avucunda bir yıldız patlıyor ve yanık deri kokusu ocak dumanına karışıyor.", en: "You close your hand over the core on the anvil. A star goes off in your palm, and the smell of burnt skin joins the forge smoke." }
          - { tr: "İçindeki şey parmaklarının arasından çıkmaya çalışıyor; bir saniye, iki saniye. Sonra sıkıyorsun ve çığlık kesiliyor, sanki bir radyonun fişi çekilmiş gibi.", en: "Whatever's inside tries to squeeze out between your fingers. One second. Two. Then you squeeze, and the scream cuts off like somebody yanked a radio's plug." }
          - { tr: "Elini su teknesine daldırdığında buhar tavana kadar yükseliyor. Çıkardığında avucundaki yanık çoktan pembeleşmiş; ocak sırasında kimse çekicini kaldırmıyor.", en: "When you plunge your hand in the quench tank, steam rolls up to the rafters. By the time you pull it out, the burn on your palm has already gone pink. Up and down the forge row, nobody's swinging a hammer." }
        bildirimler:
          - tur: "durum"
            baslik: { tr: "Derin yanık", en: "Deep burn" }
            satirlar:
              - { tr: "İyileşiyor. Sistem bunun normal olmadığını not ediyor.", en: "Healing. The System notes that this is not normal." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Avucunu aç; söndürdüğün çekirdeği uzat", en: "Open your palm. Hold out the dead core" }
            etkiler:
              - bayrak: "sanayi_ocak_kurtarildi"
              - bayrak: "sanayi_ocak_ezme"
            sonraki: "sanayi_ocak_basi_son"

      - id: "sanayi_ocak_basi_patlama"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çekiç dördüncü kez iniyor ve çekirdek ikiye ayrılıyor. Örsün üstünde mavi camdan bir iskelet doğruluyor; kaburgalarının arasında sıvı demir dönüyor.", en: "The hammer comes down a fourth time and the core splits in two. A skeleton of blue glass pulls itself up on the anvil, liquid iron churning between its ribs." }
          - { tr: "İlk baktığı yer körük. Körükteki çocuk kulaklarını tutmuş, olduğu yerde donmuş.", en: "The first place it looks is the bellows. The kid there has his hands over his ears, frozen solid." }
          - { tr: "Demirci kadın çekici ona savuruyor. Çekiç başı cam kaburgalara değdiği yerde eriyor ve sıçrayan demir kadının kolunu yakıyor; kadın dizlerinin üstüne çöküyor.", en: "The smith swings her hammer at it. The hammerhead melts where it touches the glass ribs, molten iron spatters up her arm, and she drops to her knees." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Çocukla şeyin arasına gir", en: "Get between the kid and that thing" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "sanayi_usta_yarali"
              - savas: { dusmanlar: ["erimis_cekirdek@dunya"], ortam: ["yanici"], kazan: "sanayi_ocak_basi_zafer", kaybet: "sanayi_ocak_basi_yenilgi", kac: "sanayi_ocak_basi_kacis" }
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "Dumanın içinden vur; kimse seni görmesin", en: "Strike from the smoke. Let nobody see you" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 2
              - bayrak: "sanayi_usta_yarali"
              - bayrak: "sanayi_ocak_gizli"
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["erimis_cekirdek@dunya"], ortam: ["yanici", "karanlik"], kazan: "sanayi_ocak_basi_zafer", kaybet: "sanayi_ocak_basi_yenilgi", kac: "sanayi_ocak_basi_kacis" }
          - id: "cekil"
            etiket: { tr: "Geri çekil; Lonca'nın avcıları gelsin", en: "Back off. Let the Guild's hunters handle it" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -1 }
              - bayrak: "sanayi_usta_yarali"
            sonraki: "sanayi_ocak_basi_kacis"

      - id: "sanayi_ocak_basi_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Erimiş şey tek hamlede dağılıyor. Cam kaburgalar zemine yağmur gibi dökülüyor ve sıvı demir kumun üstünde tıslayarak soğuyor.", en: "The molten thing comes apart in one move. Glass ribs rain across the floor, and the liquid iron hisses itself cold on the sand." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son darbede cam iskelet içe doğru çöküyor. Sıvı demir zemine yayılıp tıslıyor, sonra griye dönüyor; ellerindeki kabarcıklar şimdiden sönüyor.", en: "On the last hit, the glass skeleton caves in on itself. The liquid iron spreads across the floor, hissing, then goes gray. The blisters on your hands are already going down." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Ocak sırası bir an sessiz kalıyor. Sonra on iki çekiç aynı anda örslere iniyor: Lonca'da alkış böyle yapılıyor.", en: "The forge row stays quiet for a second. Then twelve hammers hit twelve anvils at once. That's how the Guild applauds." }
            kosul: { bayrak_yok: "sanayi_ocak_gizli" }
          - metin: { tr: "Duman dağıldığında kimse ne olduğunu görmemiş. Çekiçler yine de örslere iniyor: Lonca'da alkış böyle yapılıyor, ama kime yapıldığını kimse bilmiyor.", en: "When the smoke clears, nobody saw what happened. The hammers come down on the anvils anyway. That's how the Guild applauds, except nobody knows who they're applauding." }
            kosul: { bayrak: "sanayi_ocak_gizli" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Cüruftan çıkıp ustanın yanına git", en: "Step out of the slag and go to the smith" }
            etkiler:
              - bayrak: "sanayi_ocak_kurtarildi"
            sonraki: "sanayi_ocak_basi_son"

      - id: "sanayi_ocak_basi_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Sıvı demir göğsüne çarpıyor ve dünya beyaza dönüyor. Son duyduğun şey çocuğun çığlığı değil, kendi derinin cızırtısı.", en: "Liquid iron hits you square in the chest and the world goes white. The last thing you hear isn't the kid screaming. It's your own skin sizzling." }
          - { tr: "Gözünü açtığında Lonca'nın avcıları zincirler ve yangın hortumlarıyla şeyi bir köşeye çivilemiş. Ocağın yarısı kül; demirci kadının kolu ıslak bir bezle sarılı.", en: "When you open your eyes, Guild hunters have the thing pinned in a corner with chains and fire hoses. Half the forge is ash. The smith's arm is wrapped in a wet rag." }
          - { tr: "\"Çocuğa dokunamadı,\" diyor sana, dişlerinin arasından. \"Önünde sen vardın. O kadarını gördüm.\"", en: "\"It never touched the kid,\" she tells you through her teeth. \"You were in the way. I saw that much.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Doğrul ve küle bak", en: "Sit up and look at the ashes" }
            etkiler:
              - bayrak: "sanayi_ocak_yandi"
              - can: 20
            sonraki: "sanayi_ocak_basi_son"

      - id: "sanayi_ocak_basi_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Lonca'nın avcıları zincirler ve yangın hortumlarıyla geliyor; şeyi bir köşeye sıkıştırmaları bir saati buluyor.", en: "You fall back. Guild hunters show up with chains and fire hoses, and it takes them an hour to pin the thing in a corner." }
          - { tr: "O bir saatte ocağın yarısı yanıyor. Körükteki çocuk kurtuluyor, ama kolunda bir ömür taşıyacağı bir iz kalıyor.", en: "Half the forge burns in that hour. The bellows kid makes it out, but with a mark on his arm he'll carry for the rest of his life." }
          - { tr: "Demirci kadın küllerin arasında oturmuş, sargılı koluna bakıyor. Seni görüyor ve bakışını kaçırmıyor; asıl ağır olan da bu.", en: "The smith sits in the ashes, staring at her bandaged arm. She sees you and doesn't look away. That's the part that weighs the most." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Küllerin arasına yürü", en: "Walk into the ashes" }
            etkiler:
              - bayrak: "sanayi_ocak_yandi"
              - degisken: { hayatta_kalan: -1 }
            sonraki: "sanayi_ocak_basi_son"

      - id: "sanayi_ocak_basi_son"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Demirci kadın söndürdüğün çekirdeğe, sonra avucuna bakıyor. \"Yirmi yıl,\" diyor. \"Yirmi yıl kaynak yaptım ve böyle el görmedim.\"", en: "The smith looks at the dead core, then at your palm. \"Twenty years,\" she says. \"Twenty years welding, and I never saw a hand like that.\"" }
            kosul: { bayrak: "sanayi_ocak_ezme" }
          - metin: { tr: "Demirci kadın cürufu çekicinin ucuyla dürtüyor. \"Lonca'nın defterine senin seviyeni kim yazdıysa,\" diyor, \"yanlış yazmış.\"", en: "The smith pokes the slag with the head of her hammer. \"Whoever wrote your level down in the Guild ledger,\" she says, \"wrote it wrong.\"" }
            kosul: { bayrak: "sanayi_ocak_kurtarildi", bayrak_yok: ["sanayi_ocak_ezme", "sanayi_ocak_gizli"] }
          - metin: { tr: "Demirci kadın şeyi sokaktan geçen bir Lonca avcısının indirdiğine inanıyor. Yine de sana olması gerekenden uzun bakıyor.", en: "The smith's convinced some Guild hunter passing by took the thing down. She still looks at you a little longer than she should." }
            kosul: { bayrak: "sanayi_ocak_gizli", bayrak_yok: "sanayi_ocak_yandi" }
          - metin: { tr: "Ocağın yarısı kül. Çocuklar fişlerini avuçlarında tutarak yanık körüğün başında duruyor; ocak sönükse öğün de yok.", en: "Half the forge is ash. The kids stand by the burnt bellows, chits clenched in their fists. Forge goes dark, meals go with it." }
            kosul: { bayrak: "sanayi_ocak_yandi" }
          - { tr: "Kapının yanındaki tahtada tebeşir hâlâ duruyor: Çekirdek başına iki öğün. Rıhtımdan yeni bir el arabası dolusu çekirdek geliyor.", en: "The chalk's still up on the board by the door: Two meals per core. A fresh wheelbarrow of cores is already rolling up from the dock." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İki öğün. Bir çocuğun canı iki öğün. Bunu kim yazdı, onu bulmak istiyorum.\"", en: "\"Two meals. A kid's life is worth two meals. I want to find whoever wrote that.\"" }
        secenekler:
          - id: "dovdur"
            etiket: { tr: "Bu ateşte kendine bir şey dövdür", en: "Have her forge you something in this fire" }
            goster: { bayrak_yok: "sanayi_ocak_yandi" }
            etkiler:
              - esya: { ocak_tavli_cekirdek: 1 }
              - xp_seviye: 15
              - ahlak: { duzen: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "@akis"
          - id: "cocuklara"
            etiket: { tr: "Ödülünü çıraklara bırak", en: "Leave your reward to the apprentices" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "sanayi_cocuklar_odul"
              - xp_seviye: 10
              - tohum: { olay: "sanayi_ocak_cocuklari", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "rapor"
            etiket: { tr: "Kusurlu çekirdekleri {npc:kaya_demir|e} raporla", en: "Report the faulty cores to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 3 } }
              - bayrak: "sanayi_ocak_raporlandi"
              - xp_seviye: 15
              - tohum: { olay: "sanayi_ocak_cocuklari", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "unutun"
            tur: "gizle"
            etiket: { tr: "Gördüklerini unutmalarını söyle", en: "Tell them to forget what they saw" }
            goster: { bayrak: "sanayi_ocak_ezme" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: -1, insanlik: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Cüruftaki çekirdeği al ve yürü", en: "Pocket the core from the slag and walk" }
            etkiler:
              - esya: { canavar_cekirdegi: 1 }
              - ahlak: { merhamet: -2 }
              - xp_seviye: 10
            sonraki: "@akis"

  # ------------------------------------------------------------------ ocak çocukları (tohum)
  - id: "sanayi_ocak_cocuklari"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["sanayi", "lonca", "ahlak"]
    gerilim: 1
    yalniz_tohum: true
    kart: { tr: "Körükçü çocuk", en: "The bellows kid" }
    sahne: "sanayi_ocak_cocuklari_1"
    sahneler:
      - id: "sanayi_ocak_cocuklari_1"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Sanayinin kapısında, rıhtımdan gelen el arabalarının arasında birisi adını sesleniyor. Ocaktaki körükçü çocuk; boynunda bu kez iki fiş asılı.", en: "Somebody's calling your name at the Ironworks gate, in between the wheelbarrows rolling up from the dock. It's the bellows kid from the forge, and this time he's got two chits hanging around his neck." }
            kosul: { bayrak: "sanayi_cocuklar_odul" }
          - metin: { tr: "Sanayinin kapısında birisi adını sesleniyor. Ocaktaki körükçü çocuk; boynunda fiş yok. Lonca'nın denetçileri ocağı kapatınca fişleri de toplamışlar.", en: "Somebody's calling your name at the Ironworks gate. It's the bellows kid from the forge, and there's no chit around his neck. When the Guild inspectors shut the forge down, they collected the chits too." }
            kosul: { bayrak: "sanayi_ocak_raporlandi", bayrak_yok: "sanayi_cocuklar_odul" }
          - metin: { tr: "Sanayinin kapısında birisi adını sesleniyor. Yanan ocaktaki körükçü çocuk; kolunda pembe, parlak bir yanık izi, boynunda fiş yok.", en: "Somebody's calling your name at the Ironworks gate. It's the bellows kid from the burnt forge, a shiny pink scar on his arm and no chit around his neck." }
            kosul: { bayrak: "sanayi_ocak_yandi", bayrak_yok: ["sanayi_cocuklar_odul", "sanayi_ocak_raporlandi"] }
          - metin: { tr: "Bir sokak başında birisi adını sesleniyor. Sanayideki ocağın körükçü çocuğu; sana yetişmek için yarım şehri koşmuş.", en: "Somebody's calling your name at a street corner. It's the bellows kid from the Ironworks forge. He's run half the city to catch up with you." }
            kosul: { bayrak_yok: ["sanayi_cocuklar_odul", "sanayi_ocak_raporlandi", "sanayi_ocak_yandi"] }
          - { tr: "Elinde paslı bir boru var; bir kılıç gibi tutuyor. \"Bana dövüşmeyi öğret,\" diyor. \"Avcı olursam çekirdeği ben getiririm, öğünü ben belirlerim.\"", en: "He's holding a rusty pipe like it's a sword. \"Teach me to fight,\" he says. \"If I'm a hunter, I bring in the cores. I decide how many meals.\"" }
          - { tr: "On üç yaşında. Kıyamet onu ancak ikinci seviyeye çıkarabilmiş; bir kapının ilk odasında ölmek için fazlasıyla yeterli.", en: "He's thirteen. The apocalypse has gotten him all the way to Level 2. Plenty enough to die in the first room of a Gate." }
        sezgiler:
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "[BİL] Borunun ucunda kurumuş kan var. Bunu birine karşı denemiş bile.", en: "[WIS] There's dried blood on the end of that pipe. He's already tried it on somebody." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sana benziyor. ilk gün. elinde ne varsa onu tutuyordun. ben de seni öyle buldum.", en: "he looks like you. day one. you were holding whatever you could grab. that's how i found you." }
        secenekler:
          - id: "ogret"
            etiket: { tr: "Bir gün ona ayır; doğru tutmayı öğret", en: "Give him a day. Teach him how to hold it right" }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 3, insanlik: 2 }
              - gunluk: { antrenman: 1 }
              - bayrak: "ocak_cocugu_egitildi"
            sonraki: "sanayi_ocak_cocuklari_egitim"
          - id: "okul"
            etiket: { tr: "Onu {fraksiyon:siginak|in} okuluna götür", en: "Take him to the {fraksiyon:siginak} school" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - bayrak: "ocak_cocugu_okulda"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "Onu Lonca'nın talim yerine yazdır", en: "Sign him up at the Guild training yard" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "ocak_cocugu_loncada"
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "fis"
            etiket: { tr: "Ocağa geri dönmesini sağla; ustayla konuş", en: "Get him back on at the forge. Talk to the smith" }
            gerekli: { stat: { cha: 35 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "ocak_cocugu_ocakta"
              - xp_seviye: 10
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "sanayi_ocak_cocuklari_usta"
          - id: "yolla"
            etiket: { tr: "Boruyu elinden al; eve gitmesini söyle", en: "Take the pipe. Tell him to go home" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: -1 }
            sonraki: "sanayi_ocak_cocuklari_boru"

      - id: "sanayi_ocak_cocuklari_egitim"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bütün günü eski bir vinç platformunun altında geçiriyorsunuz. Ona boruyu nasıl tutacağını değil, ne zaman bırakıp kaçacağını öğretiyorsun; ilki kolay, ikincisi hayat kurtarır.", en: "You spend the whole day under an old crane platform. You don't teach him how to hold the pipe. You teach him when to drop it and run. The first one's easy. The second one keeps you alive." }
          - { tr: "Akşama doğru gözlerinin önünde bir pencere açılıyor ve çocuk bağırıyor: [Yetenek kazanıldı: Geri Çekilme (Sıradan)]. Hayatında alacağı en önemli hediye bu, ama bunu yıllar sonra anlayacak.", en: "Toward evening a window pops open in front of his face and he yells: [Skill acquired: Fall Back (Common)]. Most important gift he'll ever get, but he won't figure that out for years." }
          - metin: { tr: "Ocak sırasının kapısında demirci kadın sizi izliyor; kolları kavuşturulmuş. Bir şey demiyor ama ertesi sabah çocuğun fişini iki öğünden üçe çıkarıyor.", en: "The smith watches the two of you from the forge-row gate, arms crossed. She doesn't say anything, but the next morning she bumps the kid's chit from two meals to three." }
            kosul: { bayrak_yok: "sanayi_ocak_yandi" }
        secenekler:
          - id: "soz"
            etiket: { tr: "Ondan bir söz al: kapıya yalnız girmeyecek", en: "Make him promise: no Gates alone" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "adin"
            etiket: { tr: "Adını kullanmasına izin ver; korur onu", en: "Let him use your name. It'll protect him" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - dikkat: 2
              - xp_seviye: 15
              - bayrak: "ocak_cocugu_adini_tasir"
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "sanayi_ocak_cocuklari_usta"
        yer: "sanayi"
        paragraflar:
          - { tr: "Demirci kadın seni dinlerken çekici bir an bile durdurmuyor. \"Lonca'nın kuralı açık: verimi düşen fişini kaybeder,\" diyor. \"Bu çocuğun verimi düştü.\"", en: "The smith doesn't stop hammering once while you talk. \"Guild rule's simple: your output drops, you lose your chit,\" she says. \"This kid's output dropped.\"" }
          - { tr: "\"Çünkü ocak onun kolunu yaktı,\" diyorsun, \"ve o ocağı sen yaktın.\" Çekiç havada kalıyor ve kadın, uzun bir sessizlikten sonra, ilk kez gülümsüyor.", en: "\"Because the forge burned his arm,\" you say, \"and you lit the forge.\" The hammer hangs in the air, and after a long silence, she smiles for the first time." }
          - { tr: "\"Körük senin,\" diyor çocuğa. \"Kolun iyileşene kadar yalnızca kömür taşırsın. Öğün aynı.\"", en: "\"Bellows are yours,\" she tells the kid. \"Till that arm heals, you just haul coal. Same meals.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Ustaya başınla selam ver ve çık", en: "Give the smith a nod and head out" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { kaya_demir: { saygi: 1 } }
            sonraki: "@akis"
          - id: "kural"
            etiket: { tr: "Kuralı değiştirmesi için Lonca'ya yaz", en: "Write the Guild to change the rule" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { lonca: -1, siginak: 2 }
              - iliski: { kaya_demir: { saygi: -1, guven: 1 } }
            sonraki: "@akis"

      - id: "sanayi_ocak_cocuklari_boru"
        yer: "sanayi"
        paragraflar:
          - { tr: "Boruyu elinden alıyorsun; direnmiyor bile. Gözlerinde bir şey sönüyor ve yerini daha sert bir şey alıyor.", en: "You take the pipe out of his hands. He doesn't even fight it. Something goes out in his eyes, and something harder moves in." }
          - { tr: "\"Evim ocaktı,\" diyor ve arkasını dönüyor. Rıhtıma doğru, el arabalarının arasında kayboluyor.", en: "\"The forge was home,\" he says, and turns around. He disappears toward the dock, in between the wheelbarrows." }
        secenekler:
          - id: "pesinden"
            etiket: { tr: "Peşinden git; bir öğün ısmarla", en: "Go after him. Buy him a meal" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { saygi: 1 } }
              - kredi: -10
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Bırak gitsin; seninle ölmesinden iyidir", en: "Let him go. Better than dying with you" }
            etkiler:
              - ahlak: { merhamet: -1, insanlik: -1 }
            sonraki: "@akis"

  # ================================================================== DİSİPLİN AVLUSU (Sanayi, önemli)
  - id: "sanayi_disiplin_meydani"
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 38, max: 160 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["sanayi", "lonca", "ahlak"]
    gerilim: 3
    onemli: true
    kart: { tr: "Kural yedi", en: "Rule Seven" }
    sahne: "sanayi_disiplin_meydani_1"
    sahneler:
      - id: "sanayi_disiplin_meydani_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Eski tramvay deposunun avlusu Lonca'nın sabah içtimasıyla dolu. Avcılar sıra sıra dizilmiş; ortada, raylar arasında, on dokuz yaşlarında bir avcı diz çökmüş ve sırtı çıplak.", en: "The yard of the old streetcar barn is packed for the Guild's morning muster. Hunters stand in rows. In the middle, between the rails, a hunter maybe nineteen years old kneels with his back bare." }
          - { tr: "Önünde kalın enseli bir disiplin subayı duruyor; elinde iki metrelik, ucu çözülmüş bir çelik halat. \"Kural yedi,\" diyor, sesi avlunun sonuna kadar gidiyor. \"Ekibini bırakan, ekmeğini de bırakır.\"", en: "A thick-necked provost stands over him with six feet of steel cable, the end frayed loose. \"Rule Seven,\" he says, and his voice carries to the back of the yard. \"Leave your squad, leave your bread.\"" }
          - { tr: "Söylenen hikâye kısa: tahıl silosundaki kapı çöktü, çocuk kaçtı, üç kişi geri gelmedi. Ceza on kırbaç ve tayın kartının yırtılması; bu şehirde ikincisi birincisinden daha uzun sürer.", en: "The story going around is short. The Gate at the grain silo collapsed, the kid ran, three people didn't come back. Sentence: ten lashes and his ration card torn up. In this city, the second part lasts longer than the first." }
          - metin: { tr: "Lonca üyesi olarak sen de saflardasın. Subayın gözü bir an seni buluyor: yeni gözdeden, kırpmadan izlemesi bekleniyor.", en: "As a Guild member, you're standing in the ranks yourself. The provost's eyes find you for a second. The new favorite is expected to watch without blinking." }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Avlunun üstünde Kasaba Çekirdeği'nin mavi penceresi açılmış ve cezayı bütün sanayiye yayınlıyor: [Lonca Disiplini · Kural 7 · Uygulanıyor].", en: "The Town Core has opened a blue window over the yard and is broadcasting the sentence to the whole Ironworks: [Guild Discipline · Rule 7 · In Progress]." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kapıda beyaz kol bantlı iki Konsey gözlemcisi not alıyor. Lonca avcıları onları omuzlarıyla itip duruyor; Çekirdek Konsey'de ama avlu hâlâ Lonca'nın.", en: "Two Council observers in white armbands are taking notes by the gate. Guild hunters keep shouldering them aside. The Core may belong to the Council, but this yard still belongs to the Guild." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Tel örgünün ardında Yükselenler'in vaizleri ilahi okuyor: \"Güçsüz yakıttır, yakıt yanar.\" Kimse onları susturmuyor.", en: "Past the chain-link fence, Ascended preachers are chanting: \"The weak are fuel, and fuel burns.\" Nobody tells them to shut up." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Subayın sol cebi şişkin ve oradan soluk bir mavi ışık sızıyor: kayda geçmemiş bir C kademe çekirdek. Halatı tutan eli de titriyor; öfkeden değil.", en: "[PER] The provost's left pocket is bulging, and a faint blue light is leaking out of it: an unregistered C-Grade core. The hand on the cable is shaking too. Not from anger." }
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "[BİL] Çocuk halata değil, avlunun köşesindeki revirin penceresine bakıyor. Orada onun için kırbaçtan önemli biri var.", en: "[WIS] The kid isn't looking at the cable. He's looking at the infirmary window in the corner of the yard. Somebody in there matters more to him than the lashing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "halat bir ses çıkaracak ama asıl ses subayın göğsünden geliyor. çok hızlı atıyor. yalan söyleyenlerin kalbi böyle atar.", en: "the cable's going to make a sound, but the real noise is in the provost's chest. it's beating way too fast. that's how a liar's heart sounds." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bunu izlersek onlardan biri oluruz. Sadece söylüyorum.\"", en: "\"If we just watch this, we're one of them. I'm just saying.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çelik halatla on kırbaç. Omurgasını görürsün. Durdur bunu.\"", en: "\"Ten lashes with steel cable. You'll see his spine. Stop this.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kimse silonun kaydını istemiyor. Kayıt istenmiyorsa, kayıtta bir şey vardır.\"", en: "\"Nobody's asking for the silo logs. When nobody asks for the logs, there's something in the logs.\"" }
        secenekler:
          - id: "yakala"
            tur: "gosteris"
            etiket: { tr: "Halatı havada yakala", en: "Catch the cable midair" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 3, duzen: -3 }
            kronik: { tr: "Disiplin avlusunda halatı havada yakaladın; Lonca'da kimse o sabahı unutmadı.", en: "You caught the cable midair in the Guild yard. Nobody in the Guild ever forgot that morning." }
            sonraki: "sanayi_disiplin_meydani_halat"
          - id: "sor"
            etiket: { tr: "Avcıya silonda ne olduğunu sor", en: "Ask the hunter what happened at the silo" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
            kronik: { tr: "Kırbaçtan önce kaçak avcıya silonda gerçekte ne olduğunu sordun.", en: "Before the first lash, you asked the deserter what really happened at the silo." }
            sonraki: "sanayi_disiplin_meydani_sorgu"
          - id: "vur"
            etiket: { tr: "Halatı sen al; rütben bunu gerektirir", en: "Take the cable. Your rank demands it" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -4 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Lonca'nın yeni gözdesi olarak halatı kendi eline aldın.", en: "As the Guild's rising star, you picked up the cable yourself." }
            sonraki: "sanayi_disiplin_meydani_ceza"
          - id: "yerine"
            etiket: { tr: "Onun yerine kapıya girmeyi teklif et", en: "Offer to take a Gate in his place" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
            kronik: { tr: "Bir kaçağın cezasını bir kapıyla ödemeyi teklif ettin.", en: "You offered to pay a deserter's debt with a Gate." }
            sonraki: "sanayi_disiplin_meydani_teklif"
          - id: "karis"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış ve izle", en: "Blend into the crowd and watch" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -3, insanlik: -1 }
            kronik: { tr: "Lonca'nın bir avcıyı kırbaçlamasını kalabalığın içinden izledin.", en: "You watched the Guild whip a hunter from somewhere in the crowd." }
            sonraki: "sanayi_disiplin_meydani_izle"

      - id: "sanayi_disiplin_meydani_halat"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halat bileğine dolanıyor; şaklaması avluda bir tabanca sesi gibi yankılanıyor. Kıpırdamıyorsun bile. Çözük uçlar derine değil, havaya saçılıyor.", en: "The cable wraps around your wrist with a crack that echoes across the yard like a gunshot. You don't even flinch. The frayed end sprays apart in the air instead of in skin." }
          - { tr: "\"Lonca disiplinine karışan kim?\" Subay başının üstündeki sayıya bakıyor ve dudağı bükülüyor. \"Bu seviyeyle mi?\"", en: "\"Who the hell interferes with Guild discipline?\" The provost glances at the number over your head and his lip curls. \"With that level?\"" }
          - metin: { tr: "Görünen sayın ona cesaret veriyor. Gerçeğini görse halatı çoktan bırakmıştı.", en: "Your public number is giving him courage. If he could see the real one, he'd have let go of the cable already." }
            kosul: { gizli_fark_min: 1 }
          - { tr: "Saflarda bir uğultu dolaşıyor. Diz çökmüş çocuk ilk kez başını kaldırıp sana bakıyor; gözlerinde umut değil, korku var: sana bir şey olacak diye.", en: "A murmur runs through the ranks. The kneeling kid lifts his head and looks at you for the first time. It isn't hope in his eyes. It's fear. Fear for you." }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç ve halatı kopar", en: "Open your true level and snap the cable" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -2, insanlik: -1 }
              - itibar: { lonca: 3 }
              - bilgi: "lonca_kacak_emri"
            kronik: { tr: "Lonca'nın avlusunda gerçek seviyeni açtın; disiplin subayı o gün senden korkmayı öğrendi.", en: "You opened your true level in the Guild yard. The provost learned to fear you that day." }
            sonraki: "sanayi_disiplin_meydani_acik"
          - id: "emir"
            etiket: { tr: "Geri çekilme emrini kimin verdiğini sor", en: "Ask who gave the order to retreat" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bilgi: "lonca_kacak_emri"
            kronik: { tr: "Geri çekilme emrini kimin verdiğini herkesin önünde sordun.", en: "You asked, in front of everyone, who gave the order to retreat." }
            sonraki: "sanayi_disiplin_meydani_hesap"
          - id: "pazarlik"
            etiket: { tr: "Halatı geri ver; cezayı üçe indirmesini iste", en: "Hand the cable back. Talk it down to three" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "Halatı geri verdin ve cezayı pazarlıkla üç kırbaca indirdin.", en: "You handed the cable back and haggled the sentence down to three lashes." }
            sonraki: "sanayi_disiplin_meydani_ortayol"

      - id: "sanayi_disiplin_meydani_acik"
        yer: "sanayi"
        paragraflar:
          - { tr: "Pencereni açıyorsun ve gerçek satırın avlunun üstünde, Lonca'nın bütün saflarının göreceği yükseklikte asılı kalıyor. Halatı tek bir bilek hareketiyle koparıyorsun; çelik telleri bir saman demeti gibi dağılıyor.", en: "You open your window, and your real line hangs over the yard, high enough for every rank in the Guild to read. One flick of the wrist and the cable snaps. The steel strands come apart like a bundle of straw." }
          - { tr: "Subay geri adım atıyor; eli istemsizce sol cebine gidiyor. Diz çökmüş çocuk o eli görüyor ve bir şeye karar veriyor.", en: "The provost takes a step back, and his hand drifts to his left pocket on its own. The kneeling kid sees that hand and makes up his mind about something." }
          - { tr: "\"Geri çekilme emrini o verdi,\" diyor çocuk, avlunun duyacağı kadar yüksek sesle. \"Cebindeki çekirdek için. Üçü sandığı korurken öldü.\"", en: "\"He gave the order to fall back,\" the kid says, loud enough for the whole yard. \"For the core in his pocket. The three of them died guarding the crate.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Subayın cebine uzan", en: "Reach for the provost's pocket" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "Disiplin subayının cebinden kayda geçmemiş çekirdeği herkesin önünde çıkardın.", en: "You pulled the unregistered core out of the provost's pocket in front of everyone." }
            sonraki: "sanayi_disiplin_meydani_hesap"

      - id: "sanayi_disiplin_meydani_sorgu"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çocuk cevap vermeden önce subaya bakıyor. Sonra yere. \"Ben kaçtım,\" diyor. \"Kapı çöktü, ben koştum. Üçü kaldı.\"", en: "Before he answers, the kid looks at the provost. Then at the ground. \"I ran,\" he says. \"The Gate came down and I ran. The other three stayed.\"" }
          - { tr: "Cümleler ezberlenmiş gibi düzgün. Söylerken gözleri bir an avlunun köşesindeki revir penceresine kayıyor ve hemen geri dönüyor.", en: "The sentences come out too clean, like he memorized them. While he's saying them, his eyes slide to the infirmary window in the corner of the yard and snap right back." }
          - { tr: "Subay halatı yeniden kaldırıyor. \"Duydunuz,\" diyor saflara. \"İtiraf etti.\"", en: "The provost raises the cable again. \"You heard him,\" he tells the ranks. \"He confessed.\"" }
        secenekler:
          - id: "yalan"
            etiket: { tr: "Gözlerindeki yalanı yüksek sesle söyle", en: "Call out the lie in his eyes, out loud" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - bilgi: "lonca_kacak_emri"
            kronik: { tr: "Kaçak avcının ezberlettirilmiş itirafını herkesin önünde söktün.", en: "You pulled apart the deserter's rehearsed confession in front of everyone." }
            sonraki: "sanayi_disiplin_meydani_hesap"
          - id: "kardes"
            etiket: { tr: "Revirdekini koruyacağına söz ver", en: "Promise to protect whoever's in the infirmary" }
            gerekli: { stat: { wis: 35 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
            kronik: { tr: "Revirdeki bir kıza dokunulmayacağına söz verdin; ağabeyi de sana gerçeği söyledi.", en: "You promised a girl in the infirmary would be safe, and her brother told you the truth." }
            sonraki: "sanayi_disiplin_meydani_itiraf"
          - id: "kabul"
            etiket: { tr: "Cevabını kabul et; kural kuraldır", en: "Accept his answer. Rules are rules" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
            kronik: { tr: "Kaçağın itirafını olduğu gibi kabul ettin; kural, kural olarak kaldı.", en: "You took the deserter's confession at face value. The rule stayed the rule." }
            sonraki: "sanayi_disiplin_meydani_izle"

      - id: "sanayi_disiplin_meydani_itiraf"
        yer: "sanayi"
        paragraflar:
          - { tr: "Yanına çömeliyorsun ve sesini yalnızca onun duyacağı kadar alçaltıyorsun. Çocuğun dudakları titriyor; sonra her şey bir çırpıda dökülüyor.", en: "You crouch down next to him and drop your voice so only he can hear. His lips tremble. Then it all comes out at once." }
          - { tr: "\"Geri çekilme emrini o verdi. Siloda kayda geçmemiş bir sandık C çekirdeği vardı; Tepe'dekilere satıyor. Üçü sandığı taşırken öldü, ben de sandığı taşıdım.\"", en: "\"He gave the order to fall back. There was a crate of unregistered C cores in the silo. He sells them to the people up in the Heights. The other three died carrying it. I carried it too.\"" }
          - { tr: "\"Kız kardeşim revirde,\" diye fısıldıyor. \"Konuşursam yatağı daha yüksek sayılı birine gider.\"", en: "\"My little sister's in the infirmary,\" he whispers. \"If I talk, her bed goes to somebody with a bigger number.\"" }
        secenekler:
          - id: "acikla"
            etiket: { tr: "Ayağa kalk ve bunu avluya duyur", en: "Stand up and tell the whole yard" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - bilgi: "lonca_kacak_emri"
            kronik: { tr: "Kaçak avcının fısıldadığı gerçeği bütün Lonca avlusuna duyurdun.", en: "You took the truth the deserter whispered and said it to the whole Guild yard." }
            sonraki: "sanayi_disiplin_meydani_hesap"
          - id: "tasi"
            etiket: { tr: "Kızı {fraksiyon:siginak|e} taşımayı teklif et", en: "Offer to move the girl to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { siginak: 3, lonca: -2 }
              - iliski: { elif_sari: { guven: 3 } }
              - bilgi: "lonca_kacak_emri"
              - bayrak: "sanayi_kardes_siginakta"
            kronik: { tr: "Revirdeki kızı Sığınak'a taşıdın; ağabeyi artık korkmadan konuşabildi.", en: "You moved the girl out of the infirmary to the Haven, and her brother could finally talk without fear." }
            sonraki: "sanayi_disiplin_meydani_hesap"
          - id: "sakla"
            etiket: { tr: "Sırrı sakla; ileride kullanırsın", en: "Keep the secret. It'll be useful later" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -2 }
              - bilgi: "lonca_kacak_emri"
              - bayrak: "sanayi_subay_sirri"
            kronik: { tr: "Bir subayın sırrını avucunda tuttun ve bir çocuğun kırbaçlanmasına göz yumdun.", en: "You held an officer's secret in your fist and let a kid take the lash." }
            sonraki: "sanayi_disiplin_meydani_izle"

      - id: "sanayi_disiplin_meydani_hesap"
        yer: "sanayi"
        paragraflar:
          - { tr: "Subayın cebinden çıkan çekirdek avlunun ortasında mavi mavi yanıyor. Lonca'nın kayıt mührü üstünde yok; olması gereken yerde Tepe'nin göz işareti kazınmış.", en: "The core from the provost's pocket burns blue in the middle of the yard. There's no Guild registry stamp on it. Where the stamp should be, somebody has scratched the eye sigil of the Heights." }
          - { tr: "Saflarda üç isim dolaşmaya başlıyor; silodan dönmeyen üç isim. Avcılar halata değil, subaya bakıyor artık.", en: "Three names start moving through the ranks, the three who never came back from the silo. The hunters aren't looking at the cable anymore. They're looking at the provost." }
          - metin: { tr: "Lonca'da bir üyenin sözü bir subayınkinden ağır gelmez; ama saflar sana bakıyor ve seninki geliyor.", en: "In the Guild, a member's word doesn't outweigh an officer's. But the ranks are looking at you, and yours does." }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Avlunun üstündeki Çekirdek penceresi titriyor ve sönüyor. Birisi, Lonca'nın bu kısmı yayınlamasını istemiyor.", en: "The Core window over the yard flickers and goes dark. Somebody doesn't want the Guild broadcasting this part." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kapıdaki Konsey gözlemcileri artık yazmıyor; koşuyorlar. Bu akşam Konsey toplantısının tek gündemi bu olacak.", en: "The Council observers at the gate aren't writing anymore. They're running. This is going to be the only thing on the Council's agenda tonight." }
            kosul: { bayrak: "cekirdek_siginak" }
        secenekler:
          - id: "kaya"
            etiket: { tr: "Subayı {npc:kaya_demir|e} teslim et", en: "Hand the provost over to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 1 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { saygi: 5, guven: 3 } }
              - bayrak: "sanayi_subay_teslim"
              - bayrak: "sanayi_avci_kurtarildi"
              - xp_seviye: 30
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Disiplin subayını {npc:kaya_demir|e} teslim ettin; Lonca kendi kuralını ilk kez bir subaya uyguladı.", en: "You turned the provost over to {npc:kaya_demir}. For the first time, the Guild applied its own rule to an officer." }
            sonraki: "@akis"
          - id: "cevir"
            etiket: { tr: "Halatı subaya çevir; avlu izlesin", en: "Turn the cable on the provost. Let the yard watch" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 2, insanlik: -3 }
              - dikkat: 3
              - itibar: { lonca: 2, siginak: -3 }
              - iliski: { kaya_demir: { saygi: 3, guven: -2 } }
              - bayrak: "sanayi_subay_kirbaclandi"
              - bayrak: "sanayi_avci_kurtarildi"
              - xp_seviye: 30
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Halatı subaya çevirdin; avlu o gün kimin haklı olduğuna değil, kimin daha güçlü olduğuna baktı.", en: "You turned the cable on the provost. That day the yard didn't care who was right, only who was stronger." }
            sonraki: "@akis"
          - id: "siginak"
            etiket: { tr: "Avcıyı ve kardeşini {fraksiyon:siginak|e} götür", en: "Take the hunter and his sister to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - itibar: { siginak: 5, lonca: -4 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 }, kaya_demir: { saygi: -2 } }
              - bayrak: "sanayi_avci_siginakta"
              - bayrak: "sanayi_avci_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 30
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kaçak avcıyı ve kız kardeşini Lonca'nın avlusundan alıp Sığınak'a götürdün.", en: "You walked the deserter and his little sister out of the Guild yard and over to the Haven." }
            sonraki: "@akis"
          - id: "sizdir"
            etiket: { tr: "Çekirdek defterini {npc:mert_kilic|e} sızdır", en: "Leak the core ledger to {npc:mert_kilic}" }
            goster: { itibar_min: { sessiz_ag: 15 } }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 1 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - bayrak: "sanayi_defter_sizdi"
              - bayrak: "sanayi_avci_kurtarildi"
              - xp_seviye: 30
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Lonca ile Tepe arasındaki kaçak çekirdek defterini Sessiz Ağ'a sızdırdın.", en: "You leaked the Guild-to-Heights core-smuggling ledger to the Quiet Network." }
            sonraki: "@akis"

      - id: "sanayi_disiplin_meydani_ceza"
        yer: "sanayi"
        paragraflar:
          - { tr: "Subay halatı sana uzatıyor; yüzünde ince bir gülümseme var. \"Kural yedi,\" diyor. \"On kırbaç. Say ki herkes duysun.\"", en: "The provost hands you the cable with a thin smile. \"Rule Seven,\" he says. \"Ten lashes. Count 'em out so everybody hears.\"" }
          - { tr: "Çocuğun sırtında zaten bir kapının bıraktığı izler var: kürek kemiklerinden beline inen üç paralel pençe yarası. Halat elinde ağır değil; ağır olan, avlunun sessizliği.", en: "The kid's back already has a Gate's signature on it: three parallel claw scars running from his shoulder blades down to his waist. The cable isn't heavy in your hand. The quiet in the yard is." }
          - { tr: "Saflarda kimse kıpırdamıyor. Herkes yeni gözdenin nasıl vurduğunu görmek istiyor.", en: "Nobody in the ranks moves. Everybody wants to see how the new favorite swings." }
        secenekler:
          - id: "tam"
            etiket: { tr: "On kırbacın onunu da vur", en: "Swing all ten" }
            etkiler:
              - ahlak: { merhamet: -7, duzen: 4, insanlik: -2 }
              - itibar: { lonca: 6, siginak: -4 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - dikkat: 2
              - bayrak: "sanayi_avci_kirbaclandi"
              - xp_seviye: 25
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Lonca avlusunda on kırbacın onunu da sen vurdun.", en: "In the Guild yard, you swung all ten lashes yourself." }
            sonraki: "@akis"
          - id: "iskala"
            tur: "gosteris"
            etiket: { tr: "Vuruyormuş gibi yap; halatı derisine değdirme", en: "Make it look real. Never let it touch skin" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - bayrak: "sanayi_avci_hafif"
              - xp_seviye: 25
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Halatı on kez indirdin ve on kez ıskaladın; bunu yalnızca sen ve o avcı bildiniz.", en: "You brought the cable down ten times and missed ten times. Only you and that hunter ever knew." }
            sonraki: "sanayi_disiplin_meydani_iskala"
          - id: "at"
            etiket: { tr: "Halatı yere at: \"Bu bir ceza değil\"", en: "Throw down the cable. \"This isn't justice\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -4 }
              - iliski: { kaya_demir: { saygi: -2 } }
              - itibar: { lonca: -2 }
            kronik: { tr: "Lonca'nın eline tutuşturduğu halatı yere attın.", en: "You threw down the cable the Guild had put in your hand." }
            sonraki: "sanayi_disiplin_meydani_sorgu"

      - id: "sanayi_disiplin_meydani_iskala"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halat her seferinde ıslık çalarak iniyor ve her seferinde çocuğun sırtının bir parmak üstünde, havada patlıyor. Şaklama sesi gerçek; acı değil.", en: "Every time, the cable comes down whistling, and every time it cracks in the air a finger's width above the kid's back. The sound is real. The pain isn't." }
          - { tr: "Çocuk anlıyor ve her şaklamada inliyor; iyi bir oyuncu. Onuncuda subay bile bir şey fark etmiyor, çünkü senin kadar hızlı göremiyor.", en: "The kid catches on and groans at every crack. He's a good actor. By the tenth, even the provost hasn't noticed anything, because he can't see as fast as you move." }
        secenekler:
          - id: "bitir"
            etiket: { tr: "Halatı subaya geri ver ve avludan çık", en: "Hand the cable back and walk out of the yard" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - itibar: { lonca: 3 }
            kronik: { tr: "Kırbaç cezasını bir oyuna çevirdin ve Lonca seni yine de alkışladı.", en: "You turned a lashing into a performance, and the Guild applauded you anyway." }
            sonraki: "@akis"

      - id: "sanayi_disiplin_meydani_teklif"
        yer: "sanayi"
        paragraflar:
          - { tr: "Subay kahkahayı basıyor. \"Tahıl silosundaki kapı bu sabah yeniden açıldı. D kademe. Tek başına mı? O sayıyla mı?\"", en: "The provost busts out laughing. \"Gate at the grain silo opened back up this morning. D-Grade. Solo? With that number?\"" }
          - { tr: "Ama saflar dinliyor ve Lonca'da herkesin önünde verilen söz geri alınmaz. \"Öğlen çanından önce çekirdeğini getir,\" diyor, \"çocuk özgür. Getiremezsen ikiniz de kırbacı yersiniz.\"", en: "But the ranks are listening, and in the Guild you don't take back a promise made in front of everybody. \"Bring me its core before the noon bell,\" he says, \"and the kid walks. Don't, and you both eat the cable.\"" }
          - { tr: "Avlunun kenarında birileri şimdiden bahis tutuyor. Oranlar senin aleyhine; görünen seviyene bakılırsa haklılar da.", en: "At the edge of the yard, somebody's already taking bets. The odds are against you, and going by your public number, they're not wrong." }
        secenekler:
          - id: "gir"
            etiket: { tr: "Siloya yalnız gir", en: "Go into the silo alone" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["run_kabuklu@dunya+10", "kazan_yutan@dunya"], ortam: ["tavan", "karanlik"], kazan: "sanayi_disiplin_meydani_teklif_zafer", kaybet: "sanayi_disiplin_meydani_teklif_yenilgi", kac: "sanayi_disiplin_meydani_teklif_yenilgi" }
            kronik: { tr: "Bir kaçağın özgürlüğü için tahıl silosundaki kapıya yalnız girdin.", en: "You went into the Gate at the grain silo alone to buy a deserter his freedom." }
          - id: "birlikte"
            etiket: { tr: "Avcıyı da yanına al; borcunu kendi ödesin", en: "Bring the hunter along. Let him pay his own debt" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "sanayi_avci_yaninda"
              - savas: { dusmanlar: ["run_kabuklu@dunya+10", "kazan_yutan@dunya"], ortam: ["tavan", "karanlik"], kazan: "sanayi_disiplin_meydani_teklif_zafer", kaybet: "sanayi_disiplin_meydani_teklif_yenilgi", kac: "sanayi_disiplin_meydani_teklif_yenilgi" }
            kronik: { tr: "Kaçağı yanında kapıya soktun; borcunu kendi bıçağıyla ödedi.", en: "You took the deserter into the Gate with you. He paid his debt with his own blade." }

      - id: "sanayi_disiplin_meydani_teklif_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Yirmi dakika sonra avludasın. Kapının çekirdeği bir elinde, çanın ipi hâlâ hareketsiz; bahisçinin yüzü kireç gibi.", en: "Twenty minutes later you're back in the yard, the Gate's core in one hand. The noon bell's rope hasn't even twitched, and the bookie's face is white as chalk." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Öğlen çanı çalmadan hemen önce avluya giriyorsun; kanlı, tozlu, bir elinde kapının çekirdeği. Bahisçi parayı ödemeden önce iki kez sayıyor.", en: "You walk into the yard right before the noon bell, bloody and filthy, the Gate's core in one hand. The bookie counts the money twice before he pays out." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - metin: { tr: "Çocuk yanında, kılıcının ucunda kendi öldürdüğü kabuklunun kara kanıyla. Saflardan biri onun adını söylüyor, sonra bir başkası.", en: "The kid's right beside you, the black blood of the shellback he killed himself still on the tip of his blade. Somebody in the ranks says his name. Then somebody else does." }
            kosul: { bayrak: "sanayi_avci_yaninda" }
          - { tr: "Subay çekirdeği alıyor ve bir süre ona bakıyor. Herkesin önünde verilen söz; geri alamaz. \"Özgür,\" diyor, kelimeyi çiğner gibi.", en: "The provost takes the core and stares at it for a while. A promise made in front of everybody. He can't take it back. \"He walks,\" he says, chewing the word like gristle." }
        secenekler:
          - id: "serbest"
            etiket: { tr: "Avcıyı al ve avludan çık", en: "Take the hunter and walk out of the yard" }
            goster: { bayrak_yok: "sanayi_avci_yaninda" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - efsane: "kapiyi_yalniz_kapatti"
              - bayrak: "sanayi_avci_kurtarildi"
              - xp_seviye: 40
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Öğlen çanından önce bir kapıyı tek başına kapatıp bir kaçağı Lonca'dan satın aldın.", en: "You closed a Gate solo before the noon bell and bought a deserter back from the Guild." }
            sonraki: "@akis"
          - id: "serbest_ikili"
            etiket: { tr: "Avcının omzuna vur; birlikte çıkın", en: "Clap the hunter on the shoulder. Walk out together" }
            goster: { bayrak: "sanayi_avci_yaninda" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "sanayi_avci_kurtarildi"
              - xp_seviye: 40
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir kaçağı kendi borcunu ödeyen bir avcıya çevirdin.", en: "You turned a deserter into a hunter who paid off his own debt." }
            sonraki: "@akis"
          - id: "cep"
            etiket: { tr: "Subayın cebindeki ışığı herkese göster", en: "Show everyone the light in the provost's pocket" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "lonca_kacak_emri"
            kronik: { tr: "Kapıdan döner dönmez disiplin subayının cebindeki kaçak çekirdeği ortaya döktün.", en: "The minute you came back from the Gate, you exposed the smuggled core in the provost's pocket." }
            sonraki: "sanayi_disiplin_meydani_hesap"

      - id: "sanayi_disiplin_meydani_teklif_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Silodan akşamüstü sürünerek çıkıyorsun. Kapıyı senin yarım bıraktığın yerden Lonca'nın bir ekibi kapatıyor; çekirdek onların cebinde.", en: "You crawl out of the silo late in the afternoon. A Guild crew finishes the Gate from where you left off, and the core goes in their pocket." }
          - { tr: "\"Borç ödenmedi,\" diyor subay. Ama saflardan biri, sonra bir başkası homurdanıyor: senin kanın da sayılmalı.", en: "\"Debt's unpaid,\" says the provost. But somebody in the ranks grumbles, then somebody else. Your blood ought to count for something." }
          - { tr: "Subay geri adım atıyor. Çocuk on yerine beş kırbaç yiyor ve beşincide bile sesini çıkarmıyor.", en: "The provost backs down. The kid takes five lashes instead of ten, and he doesn't make a sound, not even on the fifth." }
        secenekler:
          - id: "sar"
            etiket: { tr: "Önce onun, sonra kendi yaralarını sar", en: "Bind his wounds first, then yours" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - can: 15
              - bayrak: "sanayi_avci_kirbaclandi"
              - xp_seviye: 15
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir kaçak için siloya girdin, yenildin; o yine de kırbacın yarısını senin sayende yemedi.", en: "You went into the silo for a deserter and lost, and he still dodged half the lash because of you." }
            sonraki: "@akis"
          - id: "yarin"
            etiket: { tr: "Subaya dön: \"Yarın yine gireceğim\"", en: "Turn to the provost. \"I'm going back in tomorrow\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - itibar: { lonca: 2 }
              - bayrak: "sanayi_avci_kirbaclandi"
              - xp_seviye: 15
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kaybettiğin günün akşamında subaya ertesi gün yine geleceğini söyledin; Lonca bunu hiç unutmadı.", en: "On the evening of the day you lost, you told the provost you'd be back tomorrow. The Guild never forgot that." }
            sonraki: "@akis"

      - id: "sanayi_disiplin_meydani_izle"
        yer: "sanayi"
        paragraflar:
          - { tr: "Halat iniyor. Çelik teller derinin üstünde ince kırmızı çizgiler bırakıyor; çocuk bağırmıyor, yalnızca her darbede raylara biraz daha eğiliyor.", en: "The cable comes down. The steel strands leave thin red lines across his skin. The kid doesn't scream. He just bends a little closer to the rails with every stroke." }
          - { tr: "Dördüncüde saflardan biri gözünü kaçırıyor. Altıncıda çocuğun dizleri gidiyor ve subay ikinci bir avcıya onu tutmasını işaret ediyor.", en: "At four, somebody in the ranks looks away. At six, the kid's knees give out, and the provost signals another hunter to hold him up." }
          - metin: { tr: "Cebindeki sır her şaklamada biraz daha ağırlaşıyor. Gerçeği biliyorsun; çocuk da senin bildiğini biliyor.", en: "The secret in your pocket gets heavier with every crack. You know the truth. And the kid knows you know." }
            kosul: { bayrak: "sanayi_subay_sirri" }
        secenekler:
          - id: "araya"
            etiket: { tr: "Altıncı kırbaçta araya gir", en: "Step in at the sixth lash" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
            kronik: { tr: "Altıncı kırbaçta araya girdin; geç kaldın, ama girdin.", en: "You stepped in at the sixth lash. Late, but you stepped in." }
            sonraki: "sanayi_disiplin_meydani_halat"
          - id: "sonuna"
            etiket: { tr: "Sonuna kadar izle", en: "Watch it through to the end" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - bayrak: "sanayi_avci_kirbaclandi"
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "On kırbacın hepsini saydın ve hiçbir şey yapmadın.", en: "You counted all ten lashes and did nothing." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Arkanı dön ve avludan çık", en: "Turn around and leave the yard" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -2 }
              - bayrak: "sanayi_avci_kirbaclandi"
            kronik: { tr: "Halatın şaklaması sırtında yankılanırken avludan çıktın.", en: "You walked out of the yard with the crack of the cable echoing at your back." }
            sonraki: "@akis"

      - id: "sanayi_disiplin_meydani_ortayol"
        yer: "sanayi"
        paragraflar:
          - { tr: "Subay halatı alıyor ve seni baştan aşağı süzüyor. \"Üç,\" diyor sonunda, \"ve kartı yarıya indiriyorum, yırtmıyorum. Lonca cömerttir.\"", en: "The provost takes the cable and looks you up and down. \"Three,\" he finally says, \"and I'm cutting his card in half, not tearing it up. The Guild is generous.\"" }
          - { tr: "Üç kırbaç iniyor. Çocuk üçünde de raylara bakıyor; kalktığında sana teşekkür etmiyor ama yanından geçerken omzu omzuna değiyor.", en: "Three lashes come down. The kid stares at the rails through all three. When he gets up he doesn't thank you, but his shoulder brushes yours as he walks past." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Başınla onayla ve saflara dön", en: "Nod and step back into the ranks" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
              - bayrak: "sanayi_avci_hafif"
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "On kırbacı üçe indirdin; kuralı kırmadın, yalnızca eğdin.", en: "You talked ten lashes down to three. You didn't break the rule. You bent it." }
            sonraki: "@akis"
          - id: "iksir"
            etiket: { tr: "Revirdeki kıza bir iksir bırak", en: "Leave a potion for the girl in the infirmary" }
            gerekli: { esya: { kucuk_iyilesme_iksiri: 1 } }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: -1 }
              - ahlak: { merhamet: 3, insanlik: 1 }
              - bayrak: "sanayi_avci_hafif"
              - tohum: { olay: "sanayi_kacak_avci", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Revirde bir kızın başucuna iksir bıraktın; ağabeyi bunu ondan duydu.", en: "You left a potion at a girl's bedside in the infirmary. Her brother heard about it from her." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ kaçak avcı (tohum)
  - id: "sanayi_kacak_avci"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["sanayi", "lonca", "yoldas_adayi"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Silodan dönen", en: "Back from the silo" }
    sahne: "sanayi_kacak_avci_1"
    sahneler:
      - id: "sanayi_kacak_avci_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir akşam, kaldığın yerin önünde biri bekliyor: Lonca avlusunda raylara diz çöken avcı. Sırtında bir çanta, belinde kısa bir bıçak var.", en: "One evening, somebody's waiting outside wherever you're bunking: the hunter who knelt on the rails in the Guild yard. Pack on his back, short blade on his belt." }
          - metin: { tr: "Parmağında yeni bir Lonca halkası parlıyor. Subayı kuzey hattına er olarak gönderdiklerini, çekirdek defterinin yakıldığını anlatıyor.", en: "There's a new Guild ring shining on his finger. He tells you they sent the provost up to the north line as a private and burned the core ledger." }
            kosul: { bayrak: "sanayi_subay_teslim" }
          - metin: { tr: "Kolunda Konsey'in beyaz bandı var. Kız kardeşinin ateşi düşmüş; Sığınak'ın revirinde kimse kimsenin sayısına bakmıyormuş.", en: "He's wearing the Council's white armband. His sister's fever broke. Over at the Haven infirmary, he says, nobody looks at anybody's number." }
            kosul: { bayrak: "sanayi_avci_siginakta" }
          - metin: { tr: "Topallıyor. Kırbacın izleri gömleğinin yakasından taşıyor ve son günlerde Tepe'nin vaizleri onun peşini bırakmamış: güçsüz yakıttır, yakıt yanar.", en: "He's limping. The lash marks spill up past his collar, and the preachers from the Heights have been on him for days: the weak are fuel, and fuel burns." }
            kosul: { bayrak: "sanayi_avci_kirbaclandi" }
          - metin: { tr: "Sırtında tek bir iz yok. \"On şaklama,\" diyor gülerek, \"sıfır yara. Lonca'da hâlâ bunu konuşuyorlar, ama kimse ne olduğunu anlamadı.\"", en: "There's not a mark on his back. \"Ten cracks,\" he says, grinning, \"zero scars. They're still talking about it in the Guild, and nobody's figured it out.\"" }
            kosul: { bayrak: "sanayi_avci_hafif" }
          - { tr: "\"Silodan beri düşünüyorum,\" diyor. \"Senin yanında olmak istiyorum. Hamal, nöbetçi, yem; ne olursa.\"", en: "\"I've been thinking since the silo,\" he says. \"I want to be wherever you are. Porter, lookout, bait, whatever.\"" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Seviye 14, ki bu yaşına göre iyi. Ama bıçağı hâlâ kaçmaya hazır biri gibi tutuyor.", en: "[PER] Level 14, which is good for his age. But he still holds that blade like somebody getting ready to run." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir takipçi. ilki. sonra on tane olur, sonra yüz. sayıları sevmeye başladığını hissediyorum.", en: "a follower. your first. then it's ten, then a hundred. i can feel you starting to like the numbers." }
        secenekler:
          - id: "al"
            etiket: { tr: "Onu yanına al; bayrağının altında dursun", en: "Take him on. Let him stand under your banner" }
            etkiler:
              - ordu: { lonca_avcisi: 1 }
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: -1 } }
              - bayrak: "kacak_avci_yaninda"
              - xp_seviye: 15
            sonraki: "sanayi_kacak_avci_yemin"
          - id: "siginak"
            etiket: { tr: "Onu {fraksiyon:siginak|in} nöbetçilerine öner", en: "Recommend him to the {fraksiyon:siginak} watch" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 2 } }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "vaiz"
            etiket: { tr: "Tepe'nin vaizlerinden uzak durmasını söyle", en: "Tell him to stay away from the Heights preachers" }
            goster: { bayrak: "sanayi_avci_kirbaclandi" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "sanayi_kacak_avci_tepe", basarisiz_etkiler: [{ bayrak: "kacak_avci_yukselenlerde" }, { itibar: { yukselenler: 2 } }] }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { vahit: { saygi: -1 } }
              - xp_seviye: 10
            sonraki: "sanayi_kacak_avci_kal"
          - id: "sir"
            etiket: { tr: "Sakladığın sırrı şimdi {npc:kaya_demir|e} götür", en: "Take the secret you kept to {npc:kaya_demir} now" }
            goster: { bayrak: "sanayi_subay_sirri" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: -1 } }
              - bayrak: "sanayi_subay_teslim"
              - bayrak_kaldir: "sanayi_subay_sirri"
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "Yanında birini istemediğini söyle", en: "Tell him you don't take followers" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kacak_avci_yemin"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bıçağını çekip önünde diz çökmek istiyor; onu kolundan tutup kaldırıyorsun. Lonca'da bir kez diz çöktü, o kadarı yeter.", en: "He goes to draw his blade and kneel. You catch him by the arm and pull him up. He's knelt once in the Guild. That's enough." }
          - { tr: "Önünde bir Sistem penceresi açılıyor, sonra seninkinde de: [Takipçi katıldı]. Çocuk penceresine bakıyor, sonra sana; ilk kez kıyametten önceki yaşına benziyor.", en: "A System window pops open in front of him, then one in front of you: [Follower joined]. He looks at his window, then at you, and for the first time he looks like the age he was before the end of the world." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "Ordu", en: "Army" }
            satirlar:
              - { tr: "Bayrağın altında bir avcı. Sistem bunun bir başlangıç olduğunu hatırlatır.", en: "One hunter under your banner. The System would like to remind you that this is how it starts." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ona ilk görevini ver: dinlen", en: "Give him his first order: get some sleep" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kacak_avci_kal"
        yer: "sanayi"
        paragraflar:
          - { tr: "Uzun süre konuşuyorsunuz. Vaizlerin ona söylediklerini, kırbacın her darbesinde içinde büyüyen o sesi anlatıyor; sen dinliyorsun.", en: "You talk for a long time. He tells you what the preachers said to him, about the voice that got louder in him with every stroke of the cable. You listen." }
          - { tr: "\"Yakıt değilim,\" diyor sonunda, kendine söyler gibi. Sesi hâlâ titriyor ama cümle yerinde duruyor.", en: "\"I'm not fuel,\" he finally says, like he's telling himself. His voice still shakes, but the sentence holds." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ona bir yer göster: Lonca değil, Tepe değil", en: "Show him somewhere that isn't the Guild or the Heights" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kacak_avci_tepe"
        yer: "sanayi"
        paragraflar:
          - { tr: "Sözlerin ona ulaşmıyor. Kırbacın izleri senin sesinden daha yüksek konuşuyor.", en: "Your words don't reach him. The lash marks are talking louder than you are." }
          - { tr: "\"Sen güçlüsün,\" diyor, \"o yüzden kolay konuşuyorsun.\" Ertesi sabah Tepe'nin yolunda, göğsüne kömürle çizilmiş bir gözle görülüyor.", en: "\"You're strong,\" he says, \"so it's easy for you to talk.\" Next morning, somebody sees him on the road up to the Heights with an eye drawn on his chest in charcoal." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Bunu da hesaba yaz", en: "Add it to the tab" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

  # ================================================================== KAPI İLANLARI (Sanayi, keşif)
  - id: "sanayi_kapi_ilanlari"
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 34, max: 175 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["sanayi", "kapi", "hakimiyet", "kesif"]
    gerilim: 2
    kart: { tr: "Hamal aranıyor", en: "Porter wanted" }
    sahne: "sanayi_kapi_ilanlari_1"
    sahneler:
      - id: "sanayi_kapi_ilanlari_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Eski gümrük ambarının duvarı baştan başa ilan. Her kâğıtta bir kapı: yeri, kademesi, ödülü ve altta küçük harflerle Lonca'nın payı.", en: "The wall of the old bonded warehouse is papered end to end with notices. Every sheet is a Gate: location, Grade, payout, and down at the bottom in fine print, the Guild's cut." }
          - { tr: "Önünde dört kişilik bir ekip ilan kopartıyor: kanalda batmış şilepteki D kademe kapı. Liderleri yüksek sesle konuşuyor; başının üstündeki sayıyı herkes görsün diye pencere ayarını açık bırakmış.", en: "A four-person crew is tearing down a notice right in front of you: a D-Grade Gate inside the freighter sunk in the canal. Their leader's talking loud, and he's left his window setting on public so everybody can see the number over his head." }
          - { tr: "Gözü sana takılıyor; başının üstündeki sayıya bakıp sırıtıyor. \"Hamal lazım,\" diyor. \"Sırt çantası taşır, çeneni kapalı tutarsın. Günlüğü beş kredi.\"", en: "His eyes land on you. He checks the number over your head and grins. \"We need a porter,\" he says. \"You carry the packs and keep your mouth shut. Five credits a day.\"" }
          - metin: { tr: "İlanların yarısı artık kapı değil, Kule: \"Beşinci kata kadar eşlik, kat başı on kredi.\" Şehrin yarısı yukarı bakıyor.", en: "Half the notices aren't Gates anymore. They're the Spire. \"Escort to Floor 5, ten credits a floor.\" Half the city's looking up." }
            kosul: { bayrak: "kule_acik" }
          - metin: { tr: "Duvarın tepesinde Kasaba Çekirdeği'nin mavi panosu yanıyor; Lonca'nın onayladığı kapılar orada, onaylamadıkları burada, kâğıtta.", en: "Across the top of the wall the Town Core's blue board is lit up. The Gates the Guild approved go up there. The ones it didn't stay down here, on paper." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Bazı ilanların köşesine küçük, beyaz bir çıkartma yapıştırılmış: bir dalga işareti ve bir sayı. Sessiz Ağ kendi düzeltmelerini yapıyor.", en: "Somebody's stuck little white stickers in the corners of some notices: a wave symbol and a number. The Quiet Network is posting its own corrections." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] İlandaki fotoğrafta şilebin gövdesindeki pas, kapının çevresinde halka halka büyümüş. D kademe kapı böyle iz bırakmaz; bu C.", en: "[PER] In the photo on the notice, the rust on the freighter's hull has spread out from the Gate in rings. A D-Grade doesn't leave a mark like that. That's a C." }
          - kosul: { stat: { per: 50 } }
            metin: { tr: "[ALG] Liderin sayısının üçte biri bir unvandan geliyor. Kılıcı tutuşu, sayısının yarısını bile hak etmiyor.", en: "[PER] A third of the leader's number comes from a title. The way he holds that sword doesn't earn half of it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beş kredi. senin için. ben gülmek için bir ağız bulsam şimdi gülerdim.", en: "five credits. for you. if i had a mouth i'd be laughing." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hamal mı? Sana mı? ... Tamam, kabul et. Yüzünü görmek istiyorum sonra.\"", en: "\"Porter? You? ...Okay, take it. I want to see his face later.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"İlanın kademe alanı elle düzeltilmiş. Mürekkep farklı. Biri bu kapıyı ucuza satıyor.\"", en: "\"The Grade field on that notice was corrected by hand. Different ink. Somebody's selling this Gate cheap.\"" }
        secenekler:
          - id: "hamal"
            tur: "gizle"
            etiket: { tr: "Hamal ol; seviyeni gizli tut", en: "Be the porter. Keep your level hidden" }
            etkiler:
              - gizle: 3
              - bayrak: "sanayi_hamal"
            sonraki: "sanayi_kapi_ilanlari_kapi"
          - id: "tek"
            tur: "gosteris"
            etiket: { tr: "İlanı elinden al; kapıyı tek başına temizle", en: "Take the notice from him. Clear it solo" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - dikkat: 3
              - savas: { dusmanlar: ["kazan_yutan@dunya+15"], ortam: ["su", "dar_gecit"], kazan: "sanayi_kapi_ilanlari_tek_zafer", kaybet: "sanayi_kapi_ilanlari_yenilgi", kac: "sanayi_kapi_ilanlari_kacis" }
          - id: "oku"
            etiket: { tr: "İlandaki fotoğrafa yakından bak", en: "Take a closer look at the photo on the notice" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - bilgi: "yanlis_kademe_ilani"
            sonraki: "sanayi_kapi_ilanlari_okuma"
          - id: "halka"
            etiket: { tr: "Lonca halkanı göster; ilanı kendine ayırt", en: "Show your Guild ring. Claim the notice" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - itibar: { lonca: 2 }
              - savas: { dusmanlar: ["kazan_yutan@dunya+15"], ortam: ["su", "dar_gecit"], kazan: "sanayi_kapi_ilanlari_tek_zafer", kaybet: "sanayi_kapi_ilanlari_yenilgi", kac: "sanayi_kapi_ilanlari_kacis" }
          - id: "gec"
            etiket: { tr: "Omuz silk ve duvarın önünden geç", en: "Shrug and walk on past the wall" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_okuma"
        yer: "sanayi"
        paragraflar:
          - { tr: "Fotoğrafa yaklaştıkça pas halkaları netleşiyor. Kademe alanındaki C harfi kazınmış, üstüne başka bir mürekkeple D yazılmış; D kapısının ödülü C'ninkinin üçte biri.", en: "The closer you get, the clearer the rust rings get. The C in the Grade field has been scraped off and a D written over it in different ink. A D-Grade payout is a third of a C." }
          - { tr: "\"Kâğıda bakmayı bırak, okuyamazsın zaten,\" diyor ekip lideri ve arkadaşları gülüyor. \"Geliyor musun, gelmiyor musun?\"", en: "\"Quit staring at the paper, you can't read anyway,\" the crew leader says, and his buddies laugh. \"You coming or not?\"" }
        secenekler:
          - id: "uyar"
            etiket: { tr: "Kapının C kademe olduğunu söyle", en: "Tell them the Gate is a C" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "sanayi_ekip_uyarildi"
              - bayrak: "sanayi_hamal"
            sonraki: "sanayi_kapi_ilanlari_uyari"
          - id: "katip"
            etiket: { tr: "Kâtibe ilanı düzelttir", en: "Make the clerk fix the notice" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "sanayi_kapi_ilanlari_katip_red", basarisiz_etkiler: [{ bayrak: "sanayi_hamal" }] }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "sanayi_kapi_ilanlari_katip"
          - id: "sus"
            tur: "gizle"
            etiket: { tr: "Sus ve çantaları sırtla", en: "Shut up and shoulder the packs" }
            etkiler:
              - gizle: 2
              - bayrak: "sanayi_hamal"
            sonraki: "sanayi_kapi_ilanlari_kapi"

      - id: "sanayi_kapi_ilanlari_uyari"
        yer: "sanayi"
        paragraflar:
          - { tr: "Lider kahkahayı basıyor. \"Hamal kademe okuyor! Beş kredilik adam bize kapı dersi veriyor!\"", en: "The leader cracks up. \"The porter reads Grades now! Five-credit porter's giving us a lesson on Gates!\"" }
          - { tr: "Ekipteki en genç kız gülmüyor. Fotoğrafa bakıyor, sonra sana, sonra yine fotoğrafa; ama bir şey demiyor.", en: "The youngest one on the crew doesn't laugh. She looks at the photo, then at you, then at the photo again. But she doesn't say anything." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Çantaları sırtla ve peşlerinden git", en: "Shoulder the packs and follow them" }
            etkiler:
              - gizle: 1
            sonraki: "sanayi_kapi_ilanlari_kapi"

      - id: "sanayi_kapi_ilanlari_katip"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kâtip mürekkebe uzun uzun bakıyor, sonra ekip liderine. \"C,\" diyor sonunda, kâğıdı duvardan sökerek. \"Bu ekiple olmaz.\"", en: "The clerk stares at the ink for a long time, then at the crew leader. \"C,\" she finally says, tearing the sheet off the wall. \"Not with this crew.\"" }
          - { tr: "Lider kızarıyor, sonra sana dönüyor. \"Madem bu kadar iyi okuyorsun,\" diyor, \"gir de gör.\" Kâtip kâğıdı sana uzatıyor; onun gözünde bu bir şaka değil.", en: "The leader goes red, then turns on you. \"Since you read so good,\" he says, \"go on in and see for yourself.\" The clerk holds the sheet out to you. To her, it's not a joke." }
        secenekler:
          - id: "gir"
            etiket: { tr: "Kâğıdı al ve şilebe yürü", en: "Take the sheet and head for the freighter" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kazan_yutan@dunya+15"], ortam: ["su", "dar_gecit"], kazan: "sanayi_kapi_ilanlari_tek_zafer", kaybet: "sanayi_kapi_ilanlari_yenilgi", kac: "sanayi_kapi_ilanlari_kacis" }
          - id: "birak"
            etiket: { tr: "Kapıyı Lonca'nın bir C ekibine bırak", en: "Leave the Gate to a proper Guild C crew" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 10
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_katip_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kâtip seni dinlemiyor bile. \"Kademeyi Lonca belirler, hamallar değil,\" diyor ve önündeki deftere dönüyor.", en: "The clerk doesn't even listen. \"The Guild sets Grades, not porters,\" she says, and goes back to her ledger." }
          - { tr: "Ekip lideri omzuna bir çanta fırlatıyor. \"Hadi, profesör. Ders bitti.\"", en: "The crew leader tosses a pack onto your shoulder. \"Come on, professor. Class is over.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Çantayı sırtla ve yürü", en: "Shoulder the pack and walk" }
            etkiler:
              - gizle: 1
            sonraki: "sanayi_kapi_ilanlari_kapi"

      - id: "sanayi_kapi_ilanlari_kapi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kapının ardında şilebin makine dairesi bir katedrale dönüşmüş: pas kemerler, tavandan sarkan zincirler, bel hizasına kadar kara su. Dört çanta senin sırtında; dördü de lideri.", en: "Past the Gate, the freighter's engine room has turned into a cathedral: rust arches, chains hanging from the ceiling, black water up to your waist. All four packs are on your back. All four belong to the leader." }
          - { tr: "Lider küçük kabukluları devirirken arkasına dönüp poz veriyor. \"Yaz bunu hamal,\" diyor. \"Bir gün torunlarına anlatırsın.\"", en: "The leader knocks over a couple of little shellbacks and turns around to pose. \"Write this down, porter,\" he says. \"Tell your grandkids someday.\"" }
          - { tr: "Sonra dairenin dibindeki kazan açılıyor. İçinden pas dişli, kömür gözlü bir şey çıkıyor; liderin kalkanı ilk darbede bir teneke gibi katlanıyor ve en genç kız bir zincirin altında kalıyor.", en: "Then the boiler at the far end of the room swings open. Something with rust teeth and coal eyes climbs out. The leader's shield folds like a soda can on the first hit, and the youngest one goes down under a falling chain." }
          - metin: { tr: "Lider sana bakıyor. Gözlerinde artık alay yok; yalnızca \"bir şey yap\" var, kime söylediğini bilmeden.", en: "The leader looks at you. There's no smirk left in his eyes. Just do something, and he doesn't even know who he's saying it to." }
            kosul: { bayrak: "sanayi_ekip_uyarildi" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Kazan Yutan · C kademe. Ekibin dördünün toplamı onun yarısı etmiyor.", en: "[PER] Boilerjaw · C-Grade. All four of them together aren't worth half of it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çantaları bırakacak mısın, yoksa önce birinin ölmesini mi bekleyeceğiz?", en: "you going to put the bags down, or are we waiting for somebody to die first?" }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Çantaları bırak; gerçek seviyeni aç", en: "Drop the packs. Open your true level" }
            etkiler:
              - aciga_vur: true
              - itibar: { lonca: 3 }
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kazan_yutan@dunya+15"], ortam: ["su", "dar_gecit"], kazan: "sanayi_kapi_ilanlari_kurtarma", kaybet: "sanayi_kapi_ilanlari_yenilgi", kac: "sanayi_kapi_ilanlari_kacis" }
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "Karanlıktan vur; kimse seni görmesin", en: "Hit it from the dark. Let nobody see you" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 2
              - bayrak: "sanayi_hamal_gizli"
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["kazan_yutan@dunya+15"], ortam: ["su", "karanlik"], kazan: "sanayi_kapi_ilanlari_gizli_zafer", kaybet: "sanayi_kapi_ilanlari_yenilgi", kac: "sanayi_kapi_ilanlari_kacis" }
          - id: "birak"
            etiket: { tr: "Çantaları bırak ve çıkışa yürü", en: "Drop the packs and walk for the exit" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -2 }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "sanayi_ekip_olu"
            sonraki: "sanayi_kapi_ilanlari_birak"

      - id: "sanayi_kapi_ilanlari_kurtarma"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Çantalar daha suya değmeden şey ikiye ayrılıyor. Kömür gözleri sönüyor; kazan kapağı yavaşça, bir mezar kapağı gibi kapanıyor.", en: "The thing comes apart before the packs even hit the water. Its coal eyes go dark, and the boiler door swings shut, slow, like the lid on a tomb." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Pas dişler son kez kapanıyor ve kazan yutan suya devriliyor. Dalga ekibi dizlerine kadar ıslatıyor; sen yaralarını sayarken onlar seni sayıyor.", en: "The rust teeth snap shut one last time and the Boilerjaw topples into the water. The wave soaks the crew to the knees. While you count your wounds, they're counting you." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "En genç kızın üstündeki zinciri tek elle kaldırıyorsun. Lider senin başının üstündeki yeni sayıya bakıyor, sonra kendininkine; birinin yanında öbürü bir telefon numarasına benziyor.", en: "You lift the chain off the youngest one with one hand. The leader looks at the new number over your head, then at his own. Next to yours, his looks like a phone extension." }
        secenekler:
          - id: "tam"
            etiket: { tr: "Kapı ödülünün tamamını al", en: "Take the whole Gate payout" }
            etkiler:
              - kredi: 120
              - xp_seviye: 30
              - iliski: { kaya_demir: { saygi: 2 } }
              - ahlak: { duzen: 1, merhamet: -1 }
            sonraki: "@akis"
          - id: "paylas"
            etiket: { tr: "Ödülü ekiple paylaş; kıza bir iksir ısmarla", en: "Split the pay with the crew. Buy the girl a potion" }
            etkiler:
              - kredi: 40
              - xp_seviye: 30
              - ahlak: { merhamet: 3 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "ders"
            etiket: { tr: "Lidere dön: \"Bir dahakine hamalına iyi bak\"", en: "Turn to the leader. \"Next time, treat your porter right\"" }
            etkiler:
              - kredi: 80
              - xp_seviye: 30
              - dikkat: 1
              - ahlak: { duzen: 1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_gizli_zafer"
        yer: "sanayi"
        paragraflar:
          - { tr: "Zincirlerin gölgesinden çıkıp çıkıp vuruyorsun; kazan yutan neyin onu parçaladığını göremeden suya devriliyor. Lider, kılıcı titreyerek, son anda ona bir kez dokunuyor.", en: "You hit it from the shadows of the chains, again and again, and the Boilerjaw goes down in the water without ever seeing what tore it apart. At the last second the leader, sword shaking, pokes it once." }
          - { tr: "Dışarıda, ambarın önünde, hikâye çoktan değişmiş: lider kazan yutanı tek başına devirmiş. Kâtip deftere onun adını yazıyor; Küresel Sıralama'da bir basamak tırmanıyor.", en: "Outside the warehouse, the story's already changed. The leader took down the Boilerjaw single-handed. The clerk writes his name in the ledger, and he climbs one rung on the Global Ranking." }
          - { tr: "Sana beş kredi uzatıyor. En genç kız ise uzatmıyor; bir şey biliyor ama söylemiyor.", en: "He hands you five credits. The youngest one doesn't hand you anything. She knows something, and she isn't saying it." }
        secenekler:
          - id: "gulumse"
            etiket: { tr: "Beş krediyi al ve gülümse", en: "Take the five credits and smile" }
            etkiler:
              - kredi: 5
              - xp_seviye: 30
              - gizle: 2
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "kiz"
            etiket: { tr: "Kıza göz kırp; o seni ele vermez", en: "Wink at the girl. She won't give you up" }
            etkiler:
              - kredi: 5
              - xp_seviye: 30
              - ahlak: { merhamet: 1, duzen: -1 }
              - bayrak: "sanayi_kiz_biliyor"
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_tek_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Yirmi dakika sonra ambara dönüyorsun; elinde kazan yutanın kömür gözü, çizmelerinde kanal suyu. Kâtip saati iki kez kontrol ediyor.", en: "Twenty minutes later you're back at the warehouse with the Boilerjaw's coal eye in your hand and canal water in your boots. The clerk checks the clock twice." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Akşamüstü ambara dönüyorsun; yırtık, ıslak ve elinde kazan yutanın kömür gözüyle. Kâtip gözü deftere değil, sana yazıyor.", en: "You make it back to the warehouse in the late afternoon, torn up and soaked, the Boilerjaw's coal eye in your hand. The clerk writes it down, looking at you instead of the ledger." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Dört kişilik ekip hâlâ duvarın önünde. Lider yeni bir ilana uzanırken elini geri çekiyor, sanki kâğıt sıcakmış gibi.", en: "The four-person crew is still standing at the wall. The leader reaches for a new notice and pulls his hand back like the paper's hot." }
        secenekler:
          - id: "odul"
            etiket: { tr: "Ödülü al ve imzanı at", en: "Collect the payout and sign for it" }
            etkiler:
              - kredi: 150
              - xp_seviye: 35
              - efsane: "kapiyi_yalniz_kapatti"
              - iliski: { kaya_demir: { saygi: 3 } }
              - ahlak: { duzen: 2 }
            sonraki: "@akis"
          - id: "ekip"
            etiket: { tr: "Ödülün bir kısmını ekibe bırak", en: "Leave some of the payout for the crew" }
            etkiler:
              - kredi: 90
              - xp_seviye: 35
              - efsane: "kapiyi_yalniz_kapatti"
              - ahlak: { merhamet: 2 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_birak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Çantaları kara suya bırakıyorsun ve çıkışa yürüyorsun. Arkanda zincirlerin şakırtısı, bir çığlık, sonra ikinci bir çığlık.", en: "You let the packs sink into the black water and walk for the exit. Behind you: the rattle of chains, a scream, then a second scream." }
          - { tr: "Kapıdan çıktığında kanal sessiz. Ertesi gün ambarın duvarına aynı kapı için yeni bir ilan asılıyor; bu kez kademe alanında C yazıyor.", en: "When you step out of the Gate, the canal is quiet. Next day, a new notice for the same Gate goes up on the warehouse wall. This time the Grade field says C." }
        secenekler:
          - id: "devam"
            etiket: { tr: "İlana bakmadan geç", en: "Walk past without looking at the notice" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kazanın kapağı üstüne kapanıyor ve dünya kömür karası. Biri ayak bileğinden tutup seni suyun içinden sürüklüyor.", en: "The boiler door slams down on top of you and the world goes coal black. Somebody grabs your ankle and drags you through the water." }
          - metin: { tr: "Gözünü açtığında kanalın kenarındasın. Seni dışarı taşıyan ekip; hamallarını sırtlamışlar. Lider bir şey demiyor, ama çantaları bu kez kendisi taşıyor.", en: "When you open your eyes you're on the bank of the canal. The crew carried you out, their own porter on their backs. The leader doesn't say a word, but this time he's carrying the packs himself." }
            kosul: { bayrak: "sanayi_hamal" }
          - metin: { tr: "Gözünü açtığında kanalın kenarındasın. Lonca'nın bir C ekibi kapıyı senin bıraktığın yerden kapatıyor; kâtip deftere bir şey yazıyor ve üstünü çiziyor.", en: "When you open your eyes you're on the bank of the canal. A Guild C crew is finishing the Gate from where you left off. The clerk writes something in her ledger and crosses it out." }
            kosul: { bayrak_yok: "sanayi_hamal" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalk, suyu tükür ve yürü", en: "Get up, spit out the canal, and walk" }
            etkiler:
              - can: 20
              - xp_seviye: 10
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "sanayi_kapi_ilanlari_kacis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Geri çekiliyorsun; kara su göğsüne kadar çıkıyor. Kazan yutan peşinden gelmiyor, çünkü kazanından uzaklaşamıyor.", en: "You fall back with the black water up to your chest. The Boilerjaw doesn't follow, because it can't get far from its boiler." }
          - metin: { tr: "Ekibi de beraberinde sürüklüyorsun. Kimse ölmüyor; ama kapı açık kalıyor ve ertesi gün Lonca, ödülü kimseye vermediği için hepinizden ceza kesiyor.", en: "You drag the crew out with you. Nobody dies. But the Gate stays open, and the next day the Guild docks all of you for a payout nobody earned." }
            kosul: { bayrak: "sanayi_hamal" }
          - metin: { tr: "Kapı açık kalıyor. Ertesi sabah ambarın duvarında aynı ilan, kademe alanında bir soru işaretiyle yeniden asılı.", en: "The Gate stays open. Next morning the same notice is back up on the warehouse wall with a question mark in the Grade field." }
            kosul: { bayrak_yok: "sanayi_hamal" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Islak çizmelerini çıkar ve dinlen", en: "Pull off your wet boots and rest" }
            etkiler:
              - can: 10
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

  # ================================================================== KURAL ON İKİ: GREV (Sanayi, önemli)
  - id: "sanayi_grev"
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 50, max: 170 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["sanayi", "lonca", "ahlak", "fraksiyon"]
    gerilim: 3
    onemli: true
    kart: { tr: "Sayın kadar ye", en: "Eat by your number" }
    sahne: "sanayi_grev_1"
    sahneler:
      - id: "sanayi_grev_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin kapısı hurda bir barikatla kapanmış: devrilmiş forkliftler, kaynakla birbirine tutturulmuş çelik levhalar, üstünde boyayla yazılmış tek bir cümle. SAYI DEĞİLİZ.", en: "The rolling mill's gate is shut behind a scrap barricade: tipped-over forklifts, steel plates welded edge to edge, and one sentence painted across the top. WE ARE NOT NUMBERS." }
          - { tr: "Lonca'nın yeni kuralı, kural on iki, bir hafta önce asıldı: tayın seviyeyle orantılı. Onuncu seviyenin altındakiler yarım tayın alıyor; haddehanede çalışanların neredeyse hepsi onuncu seviyenin altında.", en: "The Guild posted its new rule a week ago. Rule Twelve: rations scale with level. Anybody under Level 10 gets half. Almost everyone who works the mill is under Level 10." }
          - { tr: "Barikatın önünde on iki Lonca icracısı sıra olmuş; copları, kalkanları ve sabırsızlıkları hazır. İcracı yüzbaşısı seni görüyor ve yüzü aydınlanıyor: \"Tam aradığım güç.\"", en: "A dozen Guild enforcers are lined up in front of the barricade, batons, shields and short tempers all ready to go. The enforcer captain spots you and his face lights up. \"Just the muscle I was looking for.\"" }
          - { tr: "Barikatın tepesinde, vinç kabininden inmiş elli yaşlarında bir kadın duruyor. \"Bizi kim yönetirse yönetsin,\" diye bağırıyor aşağıya, \"karnımız aynı yerde acıkıyor!\"", en: "Up on top of the barricade stands a woman around fifty, the crane operator, down from her cab. \"I don't care who runs this town,\" she yells down, \"we all get hungry in the same place!\"" }
          - metin: { tr: "Kasaba Çekirdeği Lonca'da. Grevcilerin pencereleri şimdiden sönük; Çekirdek onların tayın satırlarını kendiliğinden yarıya indirmiş.", en: "The Town Core belongs to the Guild. The strikers' windows have already gone dim. The Core cut their ration lines in half on its own." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Konsey kural on ikiyi geçersiz ilan etti; Çekirdek onların. Ama Lonca'nın icracıları burada, Konsey'in kâğıtları ise başka yerde.", en: "The Council declared Rule Twelve void, and the Core is theirs. But the Guild's enforcers are standing right here, and the Council's paperwork is somewhere else." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Tel örgünün ötesinde iki Yükselen grevcileri sayıyor, defterlerine işaret koyuyor. Yakıt listesi uzuyor.", en: "Past the fence, two of the Ascended are counting the strikers and making marks in a notebook. The fuel list is getting longer." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Grevciler sana bakıyor; icracılar da. Kasaba Çekirdeği senin. Kural on ikiyi bozmak ya da onaylamak, şu an bütün sanayide yalnızca senin elinde.", en: "The strikers are looking at you. So are the enforcers. The Town Core is yours. Right now, in the whole Ironworks, you're the only one who can kill Rule Twelve or sign off on it." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Lonca üyesi olarak yüzbaşı seni bir emir gibi çağırıyor. Halkan parmağında ağırlaşıyor.", en: "As a Guild member, you're being called up by the captain like it's an order. The ring on your finger gets heavier." }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Sığınak'ın kol bandı kolunda. Barikatın arkasındakiler bunu görüyor; yüzlerinde bir şey kıpırdıyor.", en: "You're wearing the Haven armband. The people behind the barricade see it, and something shifts in their faces." }
            kosul: { bayrak: "uye_siginak" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "[ALG] Barikatın arkasında dokuz çocuk var. Yüzbaşı bunu bilmiyor; coplar ilk inişte çocuklara da iner.", en: "[PER] There are nine kids behind the barricade. The captain doesn't know. When the batons come down, they'll come down on the kids too." }
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "[BİL] Vinççi kadın dört gündür yemek yemiyor; payını çocuklara bırakıyor. Bir gün daha dayanır, belki iki.", en: "[WIS] The crane operator hasn't eaten in four days. She's giving her share to the kids. She'll last one more day. Two, maybe." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sayı değiliz, diyorlar. haklılar. sen de değilsin. sen sayıların dışındasın. bunu onlara söyleme.", en: "we are not numbers, they say. they're right. neither are you. you're outside the numbers. don't tell them that." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yarım tayın on gün sürerse çocuklarda verem başlar. Bunu bir hekim olarak söylüyorum, bir Konsey üyesi olarak değil.\"", en: "\"Ten days on half rations and the kids start coming down with TB. I'm saying that as a doctor, not a Council member.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kıyametten önce de böyleydi, biliyor musun? Sadece sayılar görünmüyordu.\"", en: "\"It was like this before the end of the world too, you know? You just couldn't see the numbers.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Barikatın altından geçen kablolar Lonca'nın ana hattı. Grevciler farkında değil ama bu kapı bizim için de açık.\"", en: "\"Those cables under the barricade are the Guild's main line. The strikers don't know it, but this door's open for us too.\"" }
        secenekler:
          - id: "dagit"
            tur: "gosteris"
            etiket: { tr: "Barikatı tek başına sök", en: "Tear the barricade down by yourself" }
            gerekli: { stat: { str: 50 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 5, merhamet: -4 }
            kronik: { tr: "Haddehanedeki grevin barikatını tek başına söktün.", en: "You tore down the strikers' barricade at the rolling mill by yourself." }
            sonraki: "sanayi_grev_dagit"
          - id: "arabulucu"
            etiket: { tr: "İki taraf arasında arabuluculuk yap", en: "Broker a deal between the two sides" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "sanayi_grev_patlak", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
            kronik: { tr: "Haddehanenin kapısında Lonca ile grevciler arasında arabulucu oldun.", en: "At the rolling mill's gate, you stood between the Guild and the strikers as a go-between." }
            sonraki: "sanayi_grev_masa"
          - id: "katil"
            etiket: { tr: "Barikatın arkasına geç; grevcilerle dur", en: "Climb over the barricade. Stand with the strikers" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -4 }
            kronik: { tr: "Kural on ikiye karşı haddehanenin barikatında sırasızlarla birlikte durdun.", en: "You stood on the rolling mill barricade with the unranked against Rule Twelve." }
            sonraki: "sanayi_grev_barikat"
          - id: "ferman"
            etiket: { tr: "Çekirdeğin sahibi olarak kuralı askıya al", en: "As the Core's holder, suspend the rule" }
            goster: { bayrak: "cekirdek_oyuncu" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
            kronik: { tr: "Kasaba Çekirdeği'nin sahibi olarak Lonca'nın kural on ikisini askıya aldın.", en: "As holder of the Town Core, you suspended the Guild's Rule Twelve." }
            sonraki: "sanayi_grev_ferman"
          - id: "uzak"
            tur: "gizle"
            etiket: { tr: "Uzak dur; bu senin kavgan değil", en: "Stay out of it. Not your fight" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -2, insanlik: -1 }
            kronik: { tr: "Haddehanedeki grevin önünden durmadan geçtin.", en: "You walked past the strike at the rolling mill without stopping." }
            sonraki: "sanayi_grev_uzak"

      - id: "sanayi_grev_dagit"
        yer: "sanayi"
        paragraflar:
          - { tr: "İlk forkliftı bir oyuncak gibi kaldırıp kenara bırakıyorsun. Kaynaklı levhalar parmaklarının arasında kâğıt gibi yırtılıyor; barikat bir dakika içinde bir hurda yığınına dönüyor.", en: "You lift the first forklift like a toy and set it aside. The welded plates rip like paper between your fingers. In a minute, the barricade's just a scrap pile." }
          - { tr: "Arkasındakiler geri çekiliyor. Kimseye dokunmadın; ama vinççi kadın sana bakıyor ve tek kelime söylüyor: \"Sen de mi?\"", en: "The people behind it back away. You didn't touch a single one of them. But the crane operator looks at you and says two words. \"You too?\"" }
          - { tr: "Yüzbaşı sırıtarak icracılarına işaret veriyor. \"Liderleri toplayın,\" diyor. \"Kadından başlayın.\"", en: "The captain grins and signals his enforcers. \"Round up the ringleaders,\" he says. \"Start with the woman.\"" }
        secenekler:
          - id: "teslim"
            etiket: { tr: "Liderleri icracılara bırak", en: "Let the enforcers take the ringleaders" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5 }
              - itibar: { lonca: 6, siginak: -4 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "sanayi_grev_ezildi"
              - degisken: { hayatta_kalan: -2 }
              - xp_seviye: 30
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Grevin liderlerini Lonca'nın icracılarına bıraktın; vinççi kadın bir daha kabinine çıkmadı.", en: "You handed the strike leaders over to the Guild's enforcers. The crane operator never climbed back into her cab." }
            sonraki: "@akis"
          - id: "koru"
            etiket: { tr: "Yüzbaşının önüne geç: \"Kimseye dokunulmayacak\"", en: "Step in front of the captain. \"Nobody gets touched\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { lonca: 2 }
            kronik: { tr: "Barikatı söktün ama kimsenin tutuklanmasına izin vermedin.", en: "You tore down the barricade, but you didn't let them arrest anyone." }
            sonraki: "sanayi_grev_masa"
          - id: "tayin"
            etiket: { tr: "Tayınlarını kendi payından ver; işe dönsünler", en: "Pay their rations out of your own cut. Back to work" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - kredi: -50
              - itibar: { lonca: 3, siginak: 1 }
              - bayrak: "sanayi_grev_uzlasma"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 30
            kronik: { tr: "Grevi kırdın, sonra grevcilerin tayınını kendi cebinden ödedin.", en: "You broke the strike, then paid the strikers' rations out of your own pocket." }
            sonraki: "@akis"

      - id: "sanayi_grev_masa"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin bekçi kulübesinde bir masa kuruluyor: bir yanda vinççi kadın, öbür yanda yüzbaşı, ortada sen. Masanın üstünde soğumuş bir çaydanlık ve kural on ikinin yırtık bir kopyası.", en: "They set up a table in the mill's guard shack: the crane operator on one side, the captain on the other, you in the middle. On the table: a cold teakettle and a torn copy of Rule Twelve." }
          - { tr: "\"Onuncu seviyenin altındakiler kapıya girmiyor,\" diyor yüzbaşı. \"Lonca, kapıya giren karnı doyurur.\" Vinççi kadın gülüyor: \"Senin kılıcını kim dövüyor sanıyorsun?\"", en: "\"Nobody under Level 10 goes into a Gate,\" the captain says. \"The Guild feeds whoever goes into the Gates.\" The crane operator laughs. \"And who do you think forges your sword?\"" }
          - { tr: "İkisi de sana bakıyor. Bu masada kimin sayısı en büyükse kararı o veriyor; ikisi de bunu biliyor.", en: "They both look at you. At this table, whoever has the biggest number makes the call, and they both know it." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Kural on ikiyi tamamen kaldırt", en: "Get Rule Twelve thrown out completely" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { siginak: 4, lonca: -3 }
              - iliski: { kaya_demir: { guven: -2 }, elif_sari: { guven: 3 } }
              - bayrak: "sanayi_grev_kazanildi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 40
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Kural on ikiyi masada yırttırdın; haddehanenin sırasızları o kış aç kalmadı.", en: "You got Rule Twelve torn up at the table. The mill's unranked didn't go hungry that winter." }
            sonraki: "@akis"
          - id: "is"
            etiket: { tr: "Seviyeye değil, işe göre tayın öner", en: "Propose rations by work, not by level" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { lonca: 2, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2, guven: 2 } }
              - bayrak: "sanayi_grev_uzlasma"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 40
            kronik: { tr: "Haddehanede tayını sayıya değil emeğe bağlayan bir uzlaşma yazdın.", en: "At the rolling mill, you wrote a compromise that tied rations to work instead of numbers." }
            sonraki: "@akis"
          - id: "koru"
            etiket: { tr: "Kural kalsın; ama kimse cezalandırılmasın", en: "The rule stays. But nobody gets punished" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - itibar: { lonca: 4, siginak: -1 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "sanayi_grev_ezildi"
              - xp_seviye: 40
            kronik: { tr: "Kural on ikiyi korudun, karşılığında grevcileri cezadan kurtardın.", en: "You kept Rule Twelve on the books and kept the strikers out of the stockade in exchange." }
            sonraki: "@akis"

      - id: "sanayi_grev_patlak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Sözlerin barikatın iki yanında da yanlış duyuluyor. Bir icracı copunu kaldırıyor, barikattan bir cıvata uçuyor ve icracının kaskında çınlıyor.", en: "Your words land wrong on both sides of the barricade. An enforcer raises his baton, a bolt comes flying off the barricade and rings off his helmet." }
          - { tr: "Yüzbaşı \"İleri!\" diye bağırıyor. İcracılar kalkanlarını birbirine kenetleyip barikata yürüyor; arkada dokuz çocuk var.", en: "The captain yells, \"Forward!\" The enforcers lock shields and march on the barricade. There are nine kids behind it." }
        secenekler:
          - id: "one"
            etiket: { tr: "İcracıların önüne geç", en: "Get in front of the enforcers" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -4 }
              - iliski: { kaya_demir: { saygi: -2 } }
              - savas: { dusmanlar: ["lonca_icracisi@dunya", "lonca_icracisi@dunya+10"], ortam: ["yanici"], kazan: "sanayi_grev_barikat_zafer", kaybet: "sanayi_grev_barikat_yenilgi", kac: "sanayi_grev_barikat_yenilgi" }
            kronik: { tr: "Lonca'nın icracılarıyla grevcilerin arasında bizzat savaştın.", en: "You fought the Guild's enforcers yourself to keep them off the strikers." }
          - id: "yatir"
            etiket: { tr: "Grevcileri yere yatır; kimse ölmesin", en: "Put the strikers on the ground. Nobody dies" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - itibar: { lonca: 3, siginak: -2 }
              - bayrak: "sanayi_grev_ezildi"
              - xp_seviye: 25
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Grev kana dönerken grevcileri yere yatırıp kimsenin ölmemesini sağladın.", en: "When the strike turned bloody, you put the strikers on the ground and made sure nobody died." }
            sonraki: "@akis"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; herkes dursun", en: "Open your true level. Everybody stops" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 2, siginak: 2 }
            kronik: { tr: "Haddehanenin önünde gerçek seviyeni açtın; iki taraf da aynı anda sustu.", en: "You opened your true level outside the rolling mill, and both sides went quiet at the same time." }
            sonraki: "sanayi_grev_masa"

      - id: "sanayi_grev_barikat"
        yer: "sanayi"
        paragraflar:
          - { tr: "Barikata tırmanıp vinççi kadının yanına iniyorsun. İçeridekiler bir an susuyor, sonra biri ıslık çalıyor, sonra hepsi.", en: "You climb the barricade and drop down next to the crane operator. Everyone inside goes quiet for a beat. Then somebody whistles. Then all of them do." }
          - { tr: "Yüzbaşı başının üstündeki sayıya bakıyor ve gülüyor. \"Bir kişi daha,\" diyor icracılarına. \"Hepsi aynı kafa. İleri.\"", en: "The captain checks the number over your head and laughs. \"One more,\" he tells his enforcers. \"Same as the rest. Forward.\"" }
          - metin: { tr: "Görünen sayın onu cesaretlendiriyor. Bir hata yapmak üzere ve bunu bilmiyor.", en: "Your public number is egging him on. He's about to make a mistake, and he has no idea." }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "savas"
            etiket: { tr: "İcracıları barikatın önünde karşıla", en: "Meet the enforcers in front of the barricade" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - savas: { dusmanlar: ["lonca_icracisi@dunya", "lonca_icracisi@dunya+10"], ortam: ["yanici"], kazan: "sanayi_grev_barikat_zafer", kaybet: "sanayi_grev_barikat_yenilgi", kac: "sanayi_grev_barikat_yenilgi" }
            kronik: { tr: "Grevcilerin barikatını Lonca'nın icracılarına karşı savundun.", en: "You defended the strikers' barricade against the Guild's enforcers." }
          - id: "bakis"
            tur: "gosteris"
            etiket: { tr: "Tek bakışla icracıları durdur", en: "Stop the enforcers with one look" }
            gerekli: { stat: { wil: 50 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 2, merhamet: 1 }
            kronik: { tr: "On iki icracı, sen yalnızca baktın diye barikatın önünde durdu.", en: "Twelve enforcers stopped dead at the barricade because you looked at them." }
            sonraki: "sanayi_grev_bakis"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; yüzbaşı görsün", en: "Open your true level. Let the captain see it" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 1, merhamet: 2 }
              - itibar: { siginak: 2 }
            kronik: { tr: "Barikatın tepesinde gerçek seviyeni açtın ve icracıların yürüyüşü yarıda kaldı.", en: "You opened your true level on top of the barricade, and the enforcers' advance stopped halfway." }
            sonraki: "sanayi_grev_masa"

      - id: "sanayi_grev_bakis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir şey yapmıyorsun; yalnızca bakıyorsun. Ön sıradaki icracının kalkanı titriyor, sonra ikincisininki. Üçüncü sıra kendiliğinden duruyor.", en: "You don't do anything. You just look. The shield on the front-rank enforcer starts shaking, then the next one's. The third rank stops on its own." }
          - { tr: "Yüzbaşı \"İleri\" diyor, sesi bu kez çatlıyor. Kimse ilerlemiyor. Haddehanenin içinden biri gülmeye başlıyor; sonra herkes.", en: "The captain says \"Forward,\" and this time his voice cracks. Nobody moves forward. Inside the mill somebody starts laughing. Then everybody does." }
        secenekler:
          - id: "masa"
            etiket: { tr: "Şimdi masaya otur; güç sende", en: "Now sit down at the table. You hold the cards" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "İcracıları bir bakışla durdurduktan sonra pazarlığı sen yönettin.", en: "After you stopped the enforcers with a look, you ran the negotiation." }
            sonraki: "sanayi_grev_masa"

      - id: "sanayi_grev_barikat_zafer"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Kavga diye bir şey olmuyor. Kalkanlar yere saçılıyor, coplar hurdanın arasına uçuyor; on iki icracı otuz saniye sonra haddehanenin önünde oturmuş, nefes nefese.", en: "It isn't a fight. Shields scatter, batons go flying into the scrap, and thirty seconds later twelve enforcers are sitting in front of the mill, gasping." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son icracı kalkanını bırakıp geri çekiliyor. Yaraların kanıyor ama barikat ayakta; arkasındaki dokuz çocuk da.", en: "The last enforcer drops his shield and backs off. You're bleeding, but the barricade's still standing. So are the nine kids behind it." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Yüzbaşı adamlarını toplayıp çekiliyor. \"Lonca bunu unutmaz,\" diyor giderken. Vinççi kadın arkasından bağırıyor: \"Biz de!\"", en: "The captain gathers up his people and pulls back. \"The Guild won't forget this,\" he says on his way out. The crane operator yells after him, \"Neither will we!\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "Kural kalkana kadar barikatta kal", en: "Stay on the barricade until the rule is gone" }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 4, duzen: -4 }
              - itibar: { siginak: 5, lonca: -6 }
              - iliski: { kaya_demir: { saygi: 2, guven: -4 }, elif_sari: { guven: 3 } }
              - bayrak: "sanayi_grev_kazanildi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 40
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Bir gün bir gece haddehanenin barikatında bekledin; Lonca kural on ikiyi geri çekti.", en: "You held the rolling mill barricade for a day and a night, and the Guild withdrew Rule Twelve." }
            sonraki: "@akis"
          - id: "masa"
            etiket: { tr: "Şimdi masaya otur; güç sende", en: "Now sit down at the table. You hold the cards" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "İcracıları yendikten sonra pazarlık masasına sen oturdun.", en: "After you beat the enforcers, you were the one who sat down to negotiate." }
            sonraki: "sanayi_grev_masa"

      - id: "sanayi_grev_barikat_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bir kalkan kenarı şakağına iniyor ve sesler uzaklaşıyor. Hurdanın üstüne düşerken icracıların barikatı aştığını görüyorsun.", en: "The edge of a shield catches you in the temple and the sounds go far away. As you hit the scrap, you watch the enforcers come over the barricade." }
          - { tr: "Kendine geldiğinde haddehane boş. Vinççi kadını kollarından tutup götürmüşler; dokuz çocuk bekçi kulübesinin arkasında, birbirine sarılmış.", en: "When you come to, the mill is empty. They hauled the crane operator off by her arms. The nine kids are huddled behind the guard shack, holding on to each other." }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "Çocukları {fraksiyon:siginak|e} taşı", en: "Carry the kids to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 3 }
              - bayrak: "sanayi_grev_ezildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 15
            kronik: { tr: "Grev kırıldıktan sonra barikatın arkasındaki çocukları Sığınak'a taşıdın.", en: "After the strike was broken, you carried the kids from behind the barricade to the Haven." }
            sonraki: "@akis"
          - id: "kalk"
            etiket: { tr: "Kalk ve vinççiyi götürdükleri yere yürü", en: "Get up and walk to wherever they took her" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { lonca: -2 }
              - bayrak: "sanayi_grev_ezildi"
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Yenildiğin akşam Lonca'nın kapısına gidip vinççi kadını geri istedin.", en: "The evening you lost, you walked up to the Guild's door and demanded the crane operator back." }
            sonraki: "@akis"

      - id: "sanayi_grev_ferman"
        yer: "sanayi"
        paragraflar:
          - { tr: "Elini kaldırıyorsun ve Kasaba Çekirdeği'nin penceresi haddehanenin üstünde açılıyor. Kural on iki orada, mavi ışıkta, senin imzanı bekliyor.", en: "You raise your hand, and the Town Core's window opens over the mill. Rule Twelve is right there in the blue light, waiting on your signature." }
          - { tr: "Yüzbaşı sesini alçaltıyor. \"Lonca bunu kabul etmez,\" diyor. \"Çekirdek senin olabilir, ama kapılara giren biziz.\"", en: "The captain drops his voice. \"The Guild won't stand for this,\" he says. \"The Core might be yours, but we're the ones going into the Gates.\"" }
          - { tr: "Vinççi kadın barikatın tepesinden sana bakıyor. Hiçbir şey istemiyor; yalnızca bekliyor, kıyametten beri herkesin beklediği gibi.", en: "The crane operator watches you from the top of the barricade. She isn't asking for anything. She's just waiting, the way everybody has been waiting since the end of the world." }
        secenekler:
          - id: "iptal"
            etiket: { tr: "Kuralı sil; tayın herkese eşit", en: "Delete the rule. Equal rations for everybody" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2, insanlik: 2 }
              - itibar: { siginak: 5, lonca: -5 }
              - iliski: { kaya_demir: { saygi: -3, guven: -3 } }
              - bayrak: "sanayi_grev_kazanildi"
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 40
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Kasaba Çekirdeği'nden kural on ikiyi sildin; şehirde tayın bir daha sayıya bağlanmadı.", en: "You deleted Rule Twelve from the Town Core. Rations in this city were never tied to a number again." }
            sonraki: "@akis"
          - id: "yaz"
            etiket: { tr: "Kendi kuralını yaz: emeğe göre tayın", en: "Write your own rule: rations by work" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { lonca: 1, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "sanayi_grev_uzlasma"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 40
            kronik: { tr: "Kasaba Çekirdeği'ne kendi tayın kuralını yazdın: emek, sayıdan önce gelir.", en: "You wrote your own ration rule into the Town Core: work comes before numbers." }
            sonraki: "@akis"
          - id: "onayla"
            etiket: { tr: "Kuralı onayla; Çekirdek düzen ister", en: "Sign off on the rule. The Core needs order" }
            etkiler:
              - ahlak: { duzen: 5, merhamet: -5, insanlik: -2 }
              - itibar: { lonca: 6, siginak: -5 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
              - bayrak: "sanayi_grev_ezildi"
              - degisken: { hayatta_kalan: -2 }
              - xp_seviye: 40
            kronik: { tr: "Kural on ikiyi Kasaba Çekirdeği'ne kendi elinle işledin.", en: "You wrote Rule Twelve into the Town Core with your own hand." }
            sonraki: "@akis"

      - id: "sanayi_grev_uzak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin önünden geçip gidiyorsun. Gece, kaldığın yerin penceresinden sanayinin üstünde bir turuncu ışık görüyorsun; sonra sirenler.", en: "You walk on past the mill. That night, from your window, you see an orange glow over the Ironworks. Then sirens." }
          - { tr: "Sabah haberi duyuyorsun: icracılar barikatı gece yarısı aşmış, iki kişi ölmüş. Vinççi kadın kabinine geri dönmüş; artık oradan inmiyor.", en: "In the morning you hear the news. The enforcers came over the barricade at midnight, and two people died. The crane operator went back up to her cab. She won't come down anymore." }
        secenekler:
          - id: "cenaze"
            etiket: { tr: "Cenazeye git; arkada dur", en: "Go to the funeral. Stand at the back" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "sanayi_grev_kanli"
              - degisken: { hayatta_kalan: -2 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            kronik: { tr: "Uzak durduğun grevin iki ölüsünün cenazesinde en arkada durdun.", en: "You stood at the very back at the funeral of the two who died in the strike you stayed out of." }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - bayrak: "sanayi_grev_kanli"
              - degisken: { hayatta_kalan: -2 }
            kronik: { tr: "Haddehanede iki kişi öldü; sen o sabah da yürümeye devam ettin.", en: "Two people died at the rolling mill, and that morning you just kept walking." }
            sonraki: "@akis"

  # ================================================================== SIRALAMA TAHTASI (Sanayi)
  - id: "sanayi_siralama_tabelasi"
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 36, max: 175 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["sanayi", "siralama", "hakimiyet", "gizli_guc"]
    gerilim: 2
    kart: { tr: "Tebeşirle yazılmış sıra", en: "Ranked in chalk" }
    sahne: "sanayi_siralama_tabelasi_1"
    sahneler:
      - id: "sanayi_siralama_tabelasi_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tersanenin eski yemekhanesinde bütün bir duvarı kaplayan kara tahta var. Her şafak Sistem Küresel Sıralama'yı gökyüzüne yazınca bir kâtip merdivene tırmanıp şehrin ilk yüz avcısını tebeşirle buraya geçiriyor.", en: "There's a blackboard covering an entire wall of the old shipyard mess hall. Every dawn, when the System writes the Global Ranking across the sky, a clerk climbs a ladder and copies the city's top hundred hunters onto it in chalk." }
          - { tr: "İlk yüzdekiler çift tayın alıyor; geri kalanlar tek kuyrukta. Yemekhanenin yarısı tahtaya bakarak yemek yiyor, öbür yarısı bahis defterine bakarak.", en: "The top hundred eat double rations. Everybody else gets in the one line. Half the mess hall eats staring at the board. The other half eats staring at a betting book." }
          - metin: { tr: "Senin adın tahtanın en altında, yüzüncü sıranın da altında, birinin elle iliştirdiği bir kâğıtta; görünen seviyen seni ancak oraya sığdırıyor. Bir avcı kâğıdı tırnağıyla kazıyıp kendi adını yazmaya çalışıyor.", en: "Your name's at the very bottom of the board, below number one hundred, on a scrap of paper somebody pinned up by hand. Your public level only gets you that far. A hunter is scratching at the paper with his thumbnail, trying to write his own name over it." }
            kosul: { gizli_fark_min: 1 }
          - metin: { tr: "Senin adın tahtanın tepesine yakın, tebeşir tozunun en kalın olduğu yerde. Biri adının yanına küçük bir taç çizmiş, bir başkası da üstünü çizip yanına bir soru işareti koymuş.", en: "Your name's up near the top of the board, where the chalk dust is thickest. Somebody drew a little crown next to it. Somebody else crossed the crown out and put a question mark beside it." }
            kosul: { bayrak: "sirala_acildi" }
          - metin: { tr: "{npc:aras_kurt|in} adı ilk ondaki yerinde; siyah tebeşirle yazılmış, çünkü kimse onun adını beyazla yazmaya cesaret edemiyor.", en: "{npc:aras_kurt|pos} name sits in the top ten, written in black chalk, because nobody's got the nerve to write it in white." }
            kosul: { npc_hayatta: "aras_kurt" }
          - { tr: "Çift tayın kuyruğunun başında, tahtada seksen sekizinci sırada yazan bir avcı tepsileri dağıtıyor; aşağıdakilerden kendi payını alarak. Herkes ona Seksen Sekiz diyor ve o bundan hoşlanıyor.", en: "At the head of the double-ration line, the hunter at number eighty-eight on the board is handing out trays, skimming his own cut from everybody below him. Everyone calls him Eighty-Eight, and he likes it." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Seksen Sekiz'in gerçek seviyesi tahtadaki sayının üç altında. Bir unvanla şişirilmiş; tahtaya o unvan sayesinde girmiş.", en: "[PER] Eighty-Eight's real level is three below the number on the board. It's padded with a title. That title's the only reason he's up there." }
          - kosul: { stat: { int: 40 } }
            metin: { tr: "[ZEK] Bahis defterindeki oranlar seni dördüncü yüzlükte tutuyor. Yanılan herkes kırk katı öder.", en: "[INT] The odds in the betting book put you somewhere in the fourth hundred. Anybody betting against that pays forty to one." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "tahtada adın küçük duruyor çünkü ben öyle istiyorum. istersen silerim. istersen en üste yazarım. bana sorman yeter.", en: "your name looks small on that board because i want it to. say the word and i'll erase it. or write it at the top. all you have to do is ask." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Tahtaya bak. Kıyametten önce de herkes bir yerde sayıydı, değil mi? Şimdi tebeşirle yazıyorlar, o kadar.\"", en: "\"Look at that board. Everybody was a number somewhere before the end of the world too, right? Now they just write it in chalk.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Çift tayın. Yaralılarım tek tayınla iyileşmeye çalışıyor ve burada tebeşirle ekmek bölüşüyorlar.\"", en: "\"Double rations. My wounded are trying to heal on single rations, and here they split bread by chalk.\"" }
        secenekler:
          - id: "sira"
            tur: "gizle"
            etiket: { tr: "Tek kuyruğa gir; payını ver", en: "Get in the single line. Pay his cut" }
            etkiler:
              - gizle: 3
            sonraki: "sanayi_siralama_tabelasi_sira"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; tahta kendini düzeltsin", en: "Open your true level. Let the board fix itself" }
            etkiler:
              - aciga_vur: true
              - itibar: { lonca: 3 }
            sonraki: "sanayi_siralama_tabelasi_duzelt"
          - id: "bahis"
            etiket: { tr: "Kendi adına kırk kat bahis tut", en: "Bet on yourself at forty to one" }
            goster: { gizli_fark_min: 1 }
            gerekli: { stat: { int: 40 } }
            etkiler:
              - ahlak: { duzen: -2 }
            sonraki: "sanayi_siralama_tabelasi_bahis"
          - id: "tepsi"
            tur: "gosteris"
            etiket: { tr: "Seksen Sekiz'in tepsisini tek parmakla durdur", en: "Stop Eighty-Eight's tray with one finger" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 2
            sonraki: "sanayi_siralama_tabelasi_tepsi"
          - id: "aras"
            etiket: { tr: "Kâtibe {npc:aras_kurt|in} hızını sor", en: "Ask the clerk how fast {npc:aras_kurt} is climbing" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - bilgi: "aras_hizi"
            sonraki: "sanayi_siralama_tabelasi_aras"

      - id: "sanayi_siralama_tabelasi_sira"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tek kuyruğa giriyorsun. Sıra sana geldiğinde Seksen Sekiz tepsindeki ekmeğin yarısını alıp kendi tabağına koyuyor ve yanağını iki kez okşuyor.", en: "You get in the single line. When it's your turn, Eighty-Eight takes half the bread off your tray, drops it on his own plate, and pats your cheek twice." }
          - { tr: "\"Sayın büyüyünce gel,\" diyor. Masalardan bir kahkaha yükseliyor; kimse senin kim olduğunu bilmiyor ve bu kahkaha bir an için dünyanın en komik şeyi.", en: "\"Come back when your number grows up,\" he says. A laugh goes up from the tables. Nobody knows who you are, and for one second that laugh is the funniest thing in the world." }
        secenekler:
          - id: "sabret"
            etiket: { tr: "Gülümse ve yarım ekmeğini al", en: "Smile and take your half loaf" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "aksam"
            etiket: { tr: "Akşam onu talim sahasında yalnız yakala", en: "Catch him alone on the training ground tonight" }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["sirali_avci@dunya+10"], ortam: ["karanlik"], kazan: "sanayi_siralama_tabelasi_aksam", kaybet: "sanayi_siralama_tabelasi_aksam_yenilgi", kac: "sanayi_siralama_tabelasi_aksam_yenilgi" }

      - id: "sanayi_siralama_tabelasi_aksam"
        yer: "sanayi"
        paragraflar:
          - { tr: "Talim sahasının ışıkları sönük. Seksen Sekiz seni görmüyor bile; ne olduğunu anladığında çoktan kumun üstünde, yüzünü kumdan kaldıramadan yatıyor.", en: "The lights on the training ground are out. Eighty-Eight never even sees you. By the time he figures out what's happening, he's facedown in the sand and can't lift his head out of it." }
          - { tr: "Eğilip kulağına tek bir cümle söylüyorsun. Ertesi sabah çift tayın kuyruğunda kimseden pay alınmıyor; Seksen Sekiz nedenini kimseye anlatmıyor.", en: "You lean down and say one sentence in his ear. The next morning nobody in the double-ration line gets skimmed. Eighty-Eight never tells anybody why." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ertesi sabah tek kuyrukta yerini al", en: "Take your place in the single line next morning" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - gizle: 1
              - xp_seviye: 20
              - bayrak: "sanayi_seksen_sekiz_susturuldu"
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"

      - id: "sanayi_siralama_tabelasi_aksam_yenilgi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Karanlıkta yanlış adım atıyorsun; Seksen Sekiz sandığından iyi. Kumun üstünde sırtüstü yatarken yıldızlara bakıyorsun ve onun gülüşünü duyuyorsun.", en: "You misstep in the dark. Eighty-Eight's better than you figured. You end up flat on your back in the sand staring at the stars, listening to him laugh." }
          - { tr: "\"Sayın büyüyünce,\" diyor yine ve gidiyor. Bu kez cümle o kadar komik gelmiyor.", en: "\"When your number grows up,\" he says again, and walks off. This time the line isn't so funny." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalk ve tozunu silkele", en: "Get up and dust yourself off" }
            etkiler:
              - can: 10
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "sanayi_siralama_tabelasi_bahis"
        yer: "sanayi"
        paragraflar:
          - { tr: "Bahis defterini tutan tek gözlü kâtip seni baştan aşağı süzüyor. \"Kendi adına? İlk yirmiye? Bu akşama kadar?\" Gülüyor ve kırk kat yazıyor.", en: "The one-eyed clerk who keeps the betting book looks you up and down. \"On yourself? Top twenty? By tonight?\" He laughs and writes down forty to one." }
          - { tr: "Parayı masaya koyuyorsun. Sonra tahtanın önüne yürüyorsun, herkesin görebileceği yere, ve pencereni açıyorsun.", en: "You put the money on the table. Then you walk up to the board, right where everyone can see you, and open your window." }
        secenekler:
          - id: "devam"
            tur: "aciga_vur"
            etiket: { tr: "Maskeni indir ve tahtaya bak", en: "Drop the mask and look at the board" }
            etkiler:
              - aciga_vur: true
              - kredi: 200
              - dikkat: 2
              - itibar: { lonca: 2 }
              - bayrak: "sanayi_bahis_kazanildi"
            sonraki: "sanayi_siralama_tabelasi_duzelt"

      - id: "sanayi_siralama_tabelasi_duzelt"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gökyüzündeki Sıralama bir an titriyor ve yeniden yazılıyor. Kâtip merdivenine tırmanıyor, adını tahtanın altından siliyor ve yukarı, yukarı, yukarı taşıyor; tebeşiri kırılıyor, yenisini alıyor.", en: "The Ranking up in the sky stutters and rewrites itself. The clerk climbs his ladder, wipes your name off the bottom of the board and carries it up, up, up. His chalk snaps. He grabs another stick." }
          - metin: { tr: "Kâtip adını {npc:aras_kurt|in} siyah tebeşirle yazılı adının yakınına yazarken eli bir an duruyor. Hangi renk tebeşir kullanacağını bilmiyor.", en: "When the clerk writes your name up near {npc:aras_kurt|pos} black-chalk entry, his hand stops for a second. He doesn't know what color chalk to use." }
            kosul: { npc_hayatta: "aras_kurt" }
          - { tr: "Yemekhanede çatal sesi bile yok. Seksen Sekiz tepsiyi elinden bırakıyor; tepsinin yere çarpma sesi, bütün sanayinin duyacağı kadar yüksek.", en: "There isn't so much as a fork scraping in the mess hall. Eighty-Eight drops his tray. It hits the floor loud enough for the whole Ironworks to hear." }
          - metin: { tr: "Bahis defterini tutan kâtip sana doğru yürüyor, cüzdanını boşaltıyor ve bir şey söylemeden önüne koyuyor.", en: "The clerk with the betting book walks over, empties his wallet, and sets it down in front of you without a word." }
            kosul: { bayrak: "sanayi_bahis_kazanildi" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "işte. herkes görüyor. sence bu iyi bir fikir miydi? ben bilmiyorum. ama güzel görünüyor.", en: "there. everybody sees it. was that a good idea? i honestly don't know. it looks nice though." }
        secenekler:
          - id: "tek_kuyruk"
            etiket: { tr: "Çift tayını kaldır: herkes tek kuyrukta", en: "Kill the double rations. One line for everybody" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { siginak: 2, lonca: -2 }
              - iliski: { kaya_demir: { saygi: -1 } }
              - xp_seviye: 20
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Seksen Sekiz'e kestiği payları geri dağıttır", en: "Make Eighty-Eight pay back every cut he took" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "sanayi_seksen_sekiz_susturuldu"
              - xp_seviye: 20
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Çift tayın senin hakkın; al ve otur", en: "Double rations are yours now. Take them, sit down" }
            etkiler:
              - ahlak: { merhamet: -1, insanlik: -1 }
              - itibar: { lonca: 3 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "sanayi_siralama_tabelasi_tepsi"
        yer: "sanayi"
        paragraflar:
          - { tr: "Seksen Sekiz tepsini almak için uzanıyor; işaret parmağını tepsinin kenarına koyuyorsun. Çekiyor. Tepsi kıpırdamıyor.", en: "Eighty-Eight reaches over to take your tray. You set one index finger on the rim. He pulls. The tray doesn't move." }
          - { tr: "İki eliyle çekiyor, sonra bütün ağırlığıyla. Alüminyum tepsi senin parmağının çevresinde yavaşça bükülüyor; sen kıpırdamıyorsun.", en: "He pulls with both hands, then with his whole body. The aluminum tray slowly bends around your finger. You don't budge." }
          - { tr: "Masalar susuyor. Seksen Sekiz elini bırakıyor ve bir adım geri çekiliyor; tahtaya bakıyor, sonra sana, ve sayıların bir yerde yanlış olduğunu ilk kez anlıyor.", en: "The tables go quiet. Eighty-Eight lets go and takes a step back. He looks at the board, then at you, and for the first time he realizes the numbers are wrong somewhere." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bükük tepsiyi ona geri ver", en: "Hand him back the bent tray" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - xp_seviye: 15
              - bayrak: "sanayi_seksen_sekiz_susturuldu"
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "yaz"
            etiket: { tr: "Tahtanın altına tebeşirle yaz: \"Pay yok.\"", en: "Chalk it under the board: \"No more cuts.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 1, lonca: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - xp_seviye: 15
              - bayrak: "sanayi_seksen_sekiz_susturuldu"
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "sanayi_siralama_tabelasi_aras"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kâtip merdivenden inmeden cevap veriyor. \"Her şafak bir ya da iki basamak. Kule'ye her gece giriyor, kimseyle girmiyor.\"", en: "The clerk answers without coming down off the ladder. \"Every dawn, a rung or two. Goes up the Spire every night. Never takes anybody.\"" }
          - { tr: "\"Geçen hafta buraya geldi,\" diye ekliyor, sesini alçaltarak. \"Tahtanın önünde durdu, bir adı aradı. Seninkini.\"", en: "\"Came by here last week,\" he adds, lowering his voice. \"Stood in front of the board, looking for one name. Yours.\"" }
          - metin: { tr: "\"Bulamayınca güldü,\" diyor kâtip. \"'Saklanıyor,' dedi. 'Ben de saklanırdım.'\"", en: "\"When he couldn't find it, he laughed,\" says the clerk. \"Said, 'Hiding. I'd hide too.'\"" }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "mesaj"
            etiket: { tr: "Kâtibe {npc:aras_kurt} için bir mesaj bırak", en: "Leave the clerk a message for {npc:aras_kurt}" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3 } }
              - xp_seviye: 10
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "sessiz"
            tur: "gizle"
            etiket: { tr: "Kâtibe seni görmediğini söylet", en: "Have the clerk say he never saw you" }
            etkiler:
              - gizle: 2
              - kredi: -10
              - iliski: { aras_kurt: { saygi: -1 } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ sokak efsanesi (tohum; birçok olay eker)
  - id: "sokak_efsanesi"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["efsane", "hakimiyet", "gizli_guc"]
    gerilim: 1
    yalniz_tohum: true
    kart: { tr: "Senin hakkında bir hikâye", en: "A story about you" }
    sahne: "sokak_efsanesi_1"
    sahneler:
      - id: "sokak_efsanesi_1"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Bir akşam, bir ateş varilinin başında, yarım düzine avcıya hikâye anlatan bir adama denk geliyorsun. Hikâyenin kahramanının adı yok; ona Görünmeyen diyorlar.", en: "One evening, at a burn barrel, you come across a man telling stories to half a dozen hunters. The hero of the story doesn't have a name. They just call them the Nobody." }
          - metin: { tr: "\"Hamaldı,\" diyor adam. \"Beş krediye çanta taşıyordu. Kazan yutan çıktığında ekip lideri altına yaptı; hamal karanlığa girdi ve kazan yutan bir daha çıkmadı. Lider hâlâ sıralamada onun sayesinde.\"", en: "\"He was a porter,\" the man says. \"Hauling packs for five credits. When the Boilerjaw came out, the crew boss wet himself. The porter walked into the dark, and the Boilerjaw never came back out. That crew boss is still on the Ranking because of that porter.\"" }
            kosul: { bayrak: "sanayi_hamal_gizli" }
          - metin: { tr: "\"Çığlık atan bir çekirdeği çıplak eliyle sıktı,\" diyor bir başkası. \"Avucu yandı ve gözümün önünde iyileşti. Ocak sırasındaki demirci kadın yemin ediyor.\"", en: "\"Squeezed a screaming core in his bare hand,\" somebody else says. \"Burned his palm and it healed right in front of me. The smith on the forge row swears to it.\"" }
            kosul: { bayrak: "sanayi_ocak_ezme" }
          - metin: { tr: "\"Lonca avlusunda kırbacın önüne geçti,\" diyor bir kadın, \"bir kaçak için. Bir kaçak için, düşünebiliyor musun?\"", en: "\"Stepped right in front of the lash in the Guild yard,\" a woman says. \"For a deserter. A deserter, can you believe it?\"" }
            kosul: { bayrak: "sanayi_avci_kurtarildi" }
          - metin: { tr: "\"Haddehanenin barikatında sırasızlarla durdu,\" diyor hikâyeci ve dinleyenlerin yarısı başını sallıyor. \"Kural on iki onun yüzünden yok artık.\"", en: "\"The Nobody stood on the rolling mill barricade with the unranked,\" the storyteller says, and half the listeners nod. \"Rule Twelve's gone because of the Nobody.\"" }
            kosul: { bayrak: "sanayi_grev_kazanildi" }
          - metin: { tr: "\"Barikatı tek eliyle söktü,\" diyor biri, sesini alçaltarak, sanki bir korku hikâyesi anlatıyormuş gibi. \"Vinççi kadın bir daha konuşmadı.\"", en: "\"Tore the barricade down one-handed,\" somebody says, voice low, like it's a ghost story. \"The crane operator never said another word.\"" }
            kosul: { bayrak: "sanayi_grev_ezildi" }
          - metin: { tr: "\"Kule Dibi'nde sahte rekorcuların maskesini düşürdü,\" diyor genç bir avcı. \"Yirminci kat dediler; o on dördüncüde kaldıklarını herkese gösterdi.\"", en: "\"Down at Spire Plaza he ripped the mask off those fake record guys,\" says a young hunter. \"They claimed Floor 20. Showed everybody they never got past 14.\"" }
            kosul: { bayrak: "kuledibi_sahte_ifsa" }
          - metin: { tr: "\"Tepe'deki beşik kapısına bir çocuğun peşinden girdi,\" diyor hikâyeci, sesi titreyerek. \"Yükselenler hâlâ ne olduğunu anlatamıyor.\"", en: "\"Went into the cradle Gate up in the Heights after a kid,\" the storyteller says, his voice shaking. \"The Ascended still can't explain what happened.\"" }
            kosul: { bayrak: "tepe_sinav_bozuldu" }
          - metin: { tr: "Sanayide bir çocuk, ona dokunmaya kalkanlara senin adını söylüyormuş. Söylenene göre o ad bir kalkandan daha iyi işliyor.", en: "There's a kid in the Ironworks, they say, who says your name to anybody who tries to lay a hand on him. Word is, it works better than a shield." }
            kosul: { bayrak: "ocak_cocugu_adini_tasir" }
          - metin: { tr: "Hikâyelerin bazısı aynı yerde bitiyor: gri paltolu adamların gelip soru sormasıyla. Kimse onların kim olduğunu bilmiyor.", en: "Some versions all end the same way: men in gray coats showing up to ask questions. Nobody knows who they are." }
            kosul: { dikkat_min: 50 }
          - { tr: "Hikâyeci senin tam yanında duruyor ve seni tanımıyor. Hikâyedeki kişinin boyunu, sesini, gözlerini anlatıyor; hepsi yanlış ve hepsi seninkinden daha görkemli.", en: "The storyteller's standing right next to you and has no idea who you are. He describes the hero's height, their voice, their eyes. Every detail is wrong, and every one of them is grander than yours." }
        sezgiler:
          - kosul: { stat: { cha: 35 } }
            metin: { tr: "[KAR] Dinleyenlerin hepsi hikâyeye inanıyor ve hepsi bu kişiyi bulmak istiyor. Kimisi ona katılmak, kimisi onu geçmek için.", en: "[CHA] Everybody listening believes it, and every one of them wants to find the Nobody. Some to join. Some to beat." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "efsane böyle doğuyor. yalanların ve gerçeklerin aynı ateşte kaynaması. ben de bir zamanlar bir efsaneydim.", en: "this is how a legend gets born. lies and truth boiling in the same barrel. i used to be a legend too, once." }
        secenekler:
          - id: "dinle"
            tur: "gizle"
            etiket: { tr: "Ateşin başında otur ve sonuna kadar dinle", en: "Sit by the fire and hear it out" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "sanayi_ocak_cocuklari", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "sanayi_cocuklar_odul" } }
            sonraki: "@akis"
          - id: "ben"
            tur: "aciga_vur"
            etiket: { tr: "Ayağa kalk: \"O bendim.\"", en: "Stand up. \"That was me.\"" }
            etkiler:
              - aciga_vur: true
              - itibar: { lonca: 2, yukselenler: 2 }
              - ahlak: { insanlik: -1 }
            sonraki: "sokak_efsanesi_ben"
          - id: "ekle"
            tur: "gosteris"
            etiket: { tr: "Hikâyeye kendi bölümünü ekle; ateşi coştur", en: "Add a chapter of your own. Fire up the crowd" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - dikkat: 1
              - itibar: { lonca: 2, siginak: 1 }
              - xp_seviye: 15
            sonraki: "sokak_efsanesi_ekle"
          - id: "sustur"
            etiket: { tr: "Hikâyeciye kredi ver; başka bir hikâye anlatsın", en: "Pay the storyteller to tell a different story" }
            etkiler:
              - kredi: -20
              - gizle: 4
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: bu hikâye kimin işine yarar?", en: "Ask {npc:yanki}: who does this story help?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 2 } }
            sonraki: "sokak_efsanesi_yanki"

      - id: "sokak_efsanesi_ben"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Ayağa kalkıyorsun ve pencereni açıyorsun. Hikâyeci cümlesinin ortasında susuyor; ateşin başındakiler bir sana, bir gerçek satırına bakıyor.", en: "You stand up and open your window. The storyteller stops mid-sentence. The people around the barrel look at you, then at your real line." }
          - { tr: "Kimse alkışlamıyor. Biri yavaşça geri çekiliyor, bir başkası diz çökmek üzere; en genç avcı ise gözlerini kısıyor, sanki seni ilk fırsatta geçmeye şimdiden karar vermiş gibi.", en: "Nobody claps. Somebody slowly backs away, somebody else is about to drop to one knee, and the youngest hunter narrows his eyes like he's already decided to pass you first chance he gets." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ateşin başında yerine geri otur", en: "Sit back down by the barrel" }
            etkiler:
              - dikkat: 2
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "sokak_efsanesi_ekle"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Hikâyeciden sözü alıyorsun ve Görünmeyen'in bir macerasını daha anlatıyorsun. Ateşin başındakiler soluk almadan dinliyor; anlattığın her şey doğru, ama hiçbiri seni ele vermiyor.", en: "You take the floor from the storyteller and tell one more adventure of the Nobody. The crowd at the barrel hangs on every word. Everything you say is true, and none of it gives you away." }
          - { tr: "Bitirdiğinde hikâyeci sana bakıyor. \"Bunu nereden biliyorsun?\" diye soruyor. \"Bir arkadaşımın başından geçti,\" diyorsun.", en: "When you finish, the storyteller stares at you. \"How do you know all that?\" he asks. \"Happened to a friend of mine,\" you tell him." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Ateşin başından kalk ve yürü", en: "Get up from the barrel and walk" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "sokak_efsanesi_yanki"
        yer: "kiyikent"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Sonra görüş alanının köşesinde, bozuk harflerle bir satır beliriyor.", en: "{npc:yanki} doesn't answer for a long time. Then, in the corner of your vision, a line shows up in broken letters." }
          - { tr: "{npc:yanki} fısıldıyor: herkesin. efsane, korkuyu bir yere toplar. korku sende toplanırsa başkasında azalır. ama toplanan şey bir gün taşar.", en: "{npc:yanki} whispers: everybody's. a legend gathers fear into one place. if it gathers on you, there's less of it everywhere else. but whatever gathers eventually spills." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Bunu aklında tut", en: "Keep that in mind" }
            etkiler:
              - iliski: { yanki: { saygi: 1 } }
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== BEŞİK SINAVI (Tepe, önemli)
  - id: "tepe_besik_sinavi"
    perde: [2]
    bolge: ["tepe"]
    gun: { min: 40, max: 170 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["tepe", "yukselenler", "ahlak", "kurtarma"]
    gerilim: 4
    onemli: true
    npc: ["vahit"]
    kart: { tr: "On iki yaşında", en: "Twelve years old" }
    sahne: "tepe_besik_sinavi_1"
    sahneler:
      - id: "tepe_besik_sinavi_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepe'nin deniz gören villalarından birinin boşaltılmış yüzme havuzunda bir kapı açık duruyor: küçük, solgun, kenarları bir yara gibi kabarık. Yükselenler ona Beşik diyor.", en: "In the drained swimming pool of one of the Heights' ocean-view mansions, a Gate stands open: small, pale, its edges puffed up like a wound. The Ascended call it the Cradle." }
          - { tr: "Havuzun kenarında beyaz giysili bir Kutsayıcı ve on iki yaşında bir kız duruyor; saçında mavi bir kurdele var. Tepe'de her çocuk on iki yaşında Beşik'e iner: bir yetenekle çıkan Seçilmiş olur, çıkamayan ya da boş elle çıkan yakıt.", en: "At the pool's edge stand an Anointer in white and a twelve-year-old girl with a blue ribbon in her hair. In the Heights, every kid goes down into the Cradle at twelve. Come out with a skill, you're Chosen. Come out empty-handed, or don't come out, you're fuel." }
          - { tr: "Kalabalığın en önünde bir kadın iki Seçilmiş muhafızın kolları arasında kıvranıyor. \"Hemşireydim,\" diye bağırıyor kimseye. \"Kıyametten önce hemşireydim, çocuk doğurttum, bu bir sınav değil!\"", en: "At the front of the crowd, a woman's twisting in the grip of two Chosen guards. \"I was a nurse,\" she screams at nobody. \"Before the end of the world I was a nurse, I delivered babies, this isn't a test!\"" }
          - metin: { tr: "Kasaba Çekirdeği Yükselenler'de ve sınavı bütün Tepe'ye yayınlıyor; her pencerede havuzun kenarı, her pencerede kurdeleli kız. Bayram havası var.", en: "The Town Core belongs to the Ascended, and it's broadcasting the trial across the whole Heights: every window showing the pool's edge, every window showing the girl with the ribbon. It feels like a holiday." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Konsey bu sınavları yasakladı; Çekirdek onların. Bu yüzden şafakta, perdeler kapalıyken yapılıyor ve kalabalık fısıltıyla konuşuyor.", en: "The Council banned these trials, and the Core is theirs. So they hold them at dawn with the curtains drawn, and the crowd talks in whispers." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Yükselenler'in bir üyesi olarak sen de davetlisin. Kutsayıcı seni görünce gülümsüyor ve elini kızın başına koymanı bekliyor.", en: "As one of the Ascended, you're an invited guest. The Anointer smiles when he sees you and waits for you to lay your hand on the girl's head." }
            kosul: { bayrak: "uye_yukselenler" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "[ALG] Havuzun kenarında yarım düzine boş çekirdek kabuğu var. Beşik'in bekçisi bu sabah zaten beslenmiş; ama yalnızca zengin ailelerin çocukları girmeden önce.", en: "[PER] There are half a dozen empty core shells at the pool's edge. The Cradle's keeper was already fed this morning. But only right before the rich families' kids went in." }
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "[BİL] Anne kollarını kurtarmaya çalışmıyor; ağırlığını ayarlıyor. Muhafızlar gevşediği an kendini kapıya atacak.", en: "[WIS] The mother isn't trying to pull free. She's setting her weight. The second the guards ease up, she's going to throw herself into that Gate." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocukları sisteme yem ediyorlar ve buna ibadet diyorlar. sistem bunu istemedi. sanırım. ya da istedi. emin değilim ve bu beni korkutuyor.", en: "they're feeding children to the system and calling it worship. the system didn't ask for this. i think. or it did. i'm not sure, and that scares me." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşim on iki yaşındaydı. Bunu bir daha düşünmeyeceğim; sen de düşünme. Git al onu.\"", en: "\"My sister was twelve. I'm not going to think about that again, and neither are you. Go get her.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O kadın benim meslektaşım. Bunu sana ben söylüyorum: kızı kurtar, sonra her şeyi konuşuruz.\"", en: "\"That woman's a colleague of mine. So I'm the one telling you: save the girl, then we talk about everything else.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kapının imzası yapay. Biri bu kapıyı açık tutuyor, kendi kendine böyle duramaz.\"", en: "\"That Gate's signature is artificial. Somebody's holding it open. It can't stay like that on its own.\"" }
        secenekler:
          - id: "atla"
            etiket: { tr: "Kızın peşinden Beşik'e atla", en: "Jump into the Cradle after her" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: -4 }
              - savas: { dusmanlar: ["besik_bekcisi@oyuncu+3"], ortam: ["dar_gecit", "karanlik"], kazan: "tepe_besik_sinavi_zafer", kaybet: "tepe_besik_sinavi_yenilgi", kac: "tepe_besik_sinavi_kacis" }
            kronik: { tr: "Yükselenler'in Beşik'ine on iki yaşında bir kızın peşinden atladın.", en: "You jumped into the Ascended's Cradle after a twelve-year-old girl." }
          - id: "kapat"
            tur: "gosteris"
            etiket: { tr: "Kapının kenarlarını kavra ve kapat", en: "Grab the edges of the Gate and fold it shut" }
            gerekli: { stat: { wil: 55 } }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 3, duzen: -3, insanlik: -1 }
            kronik: { tr: "Tepe'nin Beşik kapısını çıplak ellerinle katlayıp kapattın.", en: "You folded the Heights' Cradle Gate shut with your bare hands." }
            sonraki: "tepe_besik_sinavi_kapat"
          - id: "ifsa"
            etiket: { tr: "Sınavın hileli olduğunu kalabalığa göster", en: "Show the crowd the trial is rigged" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 3 }
              - bilgi: "besik_sinavi_hilesi"
            kronik: { tr: "Beşik sınavının yalnızca yoksul çocuklar için ölümcül olduğunu bütün Tepe'nin önünde söyledin.", en: "In front of the whole Heights, you said out loud that the Cradle trial was only deadly for poor kids." }
            sonraki: "tepe_besik_sinavi_ifsa"
          - id: "kutsa"
            etiket: { tr: "Elini kızın başına koy; onu kutsa", en: "Lay your hand on the girl's head. Anoint her" }
            goster: { bayrak: "uye_yukselenler" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -5 }
              - itibar: { yukselenler: 5 }
              - iliski: { vahit: { saygi: 4, guven: 2 } }
            kronik: { tr: "Beşik'in kenarında elini on iki yaşında bir kızın başına koydun.", en: "At the edge of the Cradle, you laid your hand on a twelve-year-old girl's head." }
            sonraki: "tepe_besik_sinavi_kutsa"
          - id: "anne"
            etiket: { tr: "Anneyi tut; kendini kapıya atmasın", en: "Hold the mother back. Don't let her jump" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
            kronik: { tr: "Beşik sınavında kızı değil, annesini tutmayı seçtin.", en: "At the Cradle trial, you chose to hold back the mother instead of going after the girl." }
            sonraki: "tepe_besik_sinavi_anne"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kalabalığın arasından izle", en: "Watch from inside the crowd" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -3, insanlik: -2 }
            kronik: { tr: "Beşik sınavını kalabalığın arasından, kıpırdamadan izledin.", en: "You watched the Cradle trial from inside the crowd and never moved." }
            sonraki: "tepe_besik_sinavi_bekle"

      - id: "tepe_besik_sinavi_kapat"
        yer: "tepe"
        paragraflar:
          - { tr: "Havuzun dibine iniyorsun ve kapının iki kenarını kavrıyorsun. Kenarlar avuçlarını ısırıyor; diş gibi, sanki kapı canlıymış ve kapanmak istemiyormuş gibi.", en: "You drop to the bottom of the pool and grab both edges of the Gate. They bite into your palms like teeth, like the Gate's alive and doesn't want to close." }
          - { tr: "Sonra katlıyorsun. Bir çadırı toplar gibi, bir mektubu kapatır gibi; kapı bir kilise çanı gibi çınlayarak içine çöküyor ve içerideki bekçinin uluması yarıda kesiliyor.", en: "Then you fold it. Like striking a tent, like sealing a letter. The Gate collapses into itself with a sound like a church bell, and the howl of the keeper inside cuts off halfway." }
          - { tr: "Havuzun kenarında kimse konuşmuyor. Kutsayıcı dizlerinin üstüne çöküyor. \"Sen,\" diyor, sesi titreyerek, \"Sistem'in elisin.\"", en: "Nobody at the pool's edge says a word. The Anointer drops to his knees. \"You,\" he says, voice shaking, \"you're the System's own hand.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "Kapı kapatıldı", en: "Gate closed" }
            satirlar:
              - { tr: "Yöntem: kayıtlı değil. Sistem yöntemi kaydetmeyi reddediyor.", en: "Method: unregistered. The System declines to register the method." }
        secenekler:
          - id: "tap"
            tur: "aciga_vur"
            etiket: { tr: "Sana tapmalarına izin ver", en: "Let them worship you" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -4, duzen: 2 }
              - itibar: { yukselenler: 6, siginak: -2 }
              - iliski: { vahit: { saygi: 5, korku: 2 } }
              - dikkat: 3
              - bayrak: "tepe_sinav_bozuldu"
              - xp_seviye: 60
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'i kapattıktan sonra Tepe'nin önünde diz çökmelerine izin verdin.", en: "After you closed the Cradle, you let the Heights kneel to you." }
            sonraki: "@akis"
          - id: "in"
            etiket: { tr: "Kızı al ve tek kelime etmeden in", en: "Take the girl and walk down without a word" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { yukselenler: -2, siginak: 3 }
              - iliski: { vahit: { saygi: 2, guven: -2 } }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 60
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'i kapattın, kurdeleli kızı ve annesini Tepe'den indirdin.", en: "You closed the Cradle and walked the girl with the ribbon and her mother down off the Heights." }
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "Kutsayıcıya: \"Bir daha açarsan kapatırım\"", en: "Tell the Anointer: \"Open another, I'll close it\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { yukselenler: -1 }
              - iliski: { vahit: { korku: 4, saygi: 2 } }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - xp_seviye: 60
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Kutsayıcıya Tepe'de açılacak her Beşik'i kapatacağını söyledin; bir süre kimse açmaya cesaret edemedi.", en: "You told the Anointer you'd close every Cradle they opened in the Heights. For a while, nobody dared open one." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_ifsa"
        yer: "tepe"
        paragraflar:
          - { tr: "Havuzun kenarındaki boş çekirdek kabuklarını tek tek kaldırıp kalabalığa gösteriyorsun. \"Bu sabah altı çocuk girdi,\" diyorsun. \"Hepsinden önce bekçi beslendi. Bu kızdan önce beslenmeyecek.\"", en: "You pick up the empty core shells at the pool's edge one by one and hold them up to the crowd. \"Six kids went in this morning,\" you say. \"The keeper got fed before every one of them. It's not getting fed before this girl.\"" }
          - { tr: "Kalabalığın arka sıralarında bir uğultu, sonra bir çığlık. Annelerden biri kendi çocuğunun sırtındaki temiz, yarasız teni görüyor ve yüzü bembeyaz oluyor.", en: "A murmur goes through the back of the crowd, then a scream. One of the mothers looks at the clean, unmarked skin on her own kid's back and her face goes white." }
          - { tr: "\"Sistem seçer,\" diye bağırıyor Kutsayıcı, \"biz değil!\" Ama sesi ilk kez kalabalığa yetmiyor.", en: "\"The System chooses,\" the Anointer shouts, \"not us!\" But for the first time, his voice isn't big enough for the crowd." }
        secenekler:
          - id: "zorla"
            etiket: { tr: "Kutsayıcıyı Beşik'e kendisi girmeye zorla", en: "Make the Anointer go into the Cradle himself" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2, insanlik: -2 }
              - itibar: { yukselenler: -5 }
              - iliski: { vahit: { saygi: 2, korku: 3, guven: -3 } }
              - dikkat: 2
              - bayrak: "tepe_kutsayici_besikte"
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - xp_seviye: 50
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'in Kutsayıcısını kendi kapısına soktun; çıktığında artık kimseyi kutsamıyordu.", en: "You put the Anointer into his own Cradle. When he came out, he wasn't anointing anybody anymore." }
            sonraki: "@akis"
          - id: "aileler"
            etiket: { tr: "Ailelere: \"Çocuklarınızı alın ve gidin\"", en: "Tell the families: \"Take your kids and go\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { yukselenler: -4, siginak: 3 }
              - iliski: { vahit: { guven: -2 }, elif_sari: { saygi: 2 } }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik sınavının hilesini açığa çıkardın ve Tepe'nin aileleri çocuklarını alıp gitti.", en: "You exposed the Cradle trial, and the families of the Heights took their kids and left." }
            sonraki: "@akis"
          - id: "kapat"
            tur: "gosteris"
            etiket: { tr: "Şimdi kapıyı kapat; herkes görsün", en: "Now fold the Gate shut. Let everyone see" }
            gerekli: { stat: { wil: 55 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, duzen: -2 }
            kronik: { tr: "Hileyi açığa çıkardıktan sonra Beşik'i herkesin gözü önünde kapattın.", en: "After you exposed the con, you shut the Cradle in front of everyone." }
            sonraki: "tepe_besik_sinavi_kapat"

      - id: "tepe_besik_sinavi_kutsa"
        yer: "tepe"
        paragraflar:
          - { tr: "Elini kızın başına koyuyorsun. Saçları ince ve sıcak; kurdelenin düğümü avucunun altında. Kız başını kaldırıp sana bakıyor ve bir şey soruyor gibi.", en: "You lay your hand on the girl's head. Her hair is fine and warm, the ribbon's knot under your palm. She tilts her head back to look at you, like she's asking something." }
          - { tr: "Kutsayıcı fısıldıyor: \"Şimdi it. Seçilmişin eli onu Sistem'e taşır.\" Kalabalık nefesini tutuyor; anne artık bağırmıyor.", en: "The Anointer whispers, \"Now push. The hand of the Chosen carries her to the System.\" The crowd holds its breath. The mother isn't screaming anymore." }
        secenekler:
          - id: "it"
            etiket: { tr: "İt", en: "Push" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -4 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "On iki yaşında bir kızı kendi elinle Beşik'e ittin.", en: "With your own hand, you pushed a twelve-year-old girl into the Cradle." }
            sonraki: "tepe_besik_sinavi_itildi"
          - id: "cek"
            etiket: { tr: "Son anda elini çek; kızı geri al", en: "Pull your hand back at the last second. Take her back" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - itibar: { yukselenler: -4 }
              - iliski: { vahit: { guven: -3 } }
            kronik: { tr: "Elin kızın başındayken son anda vazgeçtin ve onu Beşik'in kenarından çektin.", en: "With your hand already on her head, you changed your mind at the last second and pulled her back from the Cradle's edge." }
            sonraki: "tepe_besik_sinavi_ifsa"

      - id: "tepe_besik_sinavi_itildi"
        yer: "tepe"
        paragraflar:
          - { tr: "Kız kapının solgun ışığına düşüyor; kurdele bir an havada kalıyor, sonra o da gidiyor. Dokuz dakika boyunca havuzun kenarında kimse konuşmuyor.", en: "The girl drops into the Gate's pale light. The ribbon hangs in the air for a second, then it goes too. For nine minutes, nobody at the pool's edge says a word." }
          - { tr: "Onuncu dakikada küçük bir el havuzun kenarını kavrıyor. Kız çıkıyor; kolları kan içinde, gözlerinin önünde bir pencere açık. Yetenek kazanılmış. Kalabalık ilahiye başlıyor.", en: "In the tenth minute, a small hand grabs the pool's edge. The girl climbs out, arms covered in blood, a window open in front of her eyes. Skill acquired. The crowd starts to chant." }
          - { tr: "Kız sana bakıyor. Gözlerinde artık soru yok; artık bir cevap var ve o cevabı senden öğrendi.", en: "The girl looks at you. There isn't a question in her eyes anymore. There's an answer now, and she learned it from you." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kutsayıcının elini sık", en: "Shake the Anointer's hand" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - bayrak: "tepe_kiz_secilmis"
              - xp_seviye: 40
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'ten çıkan kız bir Seçilmiş oldu; ona bunun ne demek olduğunu sen öğrettin.", en: "The girl came out of the Cradle one of the Chosen. You're the one who taught her what that means." }
            sonraki: "@akis"
          - id: "anne"
            etiket: { tr: "Annesine bak", en: "Look at her mother" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - bayrak: "tepe_kiz_secilmis"
              - xp_seviye: 40
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Kızı ittikten sonra annesinin yüzüne baktın; o yüz seninle kaldı.", en: "After you pushed the girl, you looked her mother in the face. That face stayed with you." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_anne"
        yer: "tepe"
        paragraflar:
          - { tr: "Muhafızların arasından anneyi alıp kendi kollarına çekiyorsun. Isırıyor, tırmalıyor, bağırıyor: \"Bırak beni!\" Seni hiç tanımıyor ve senden nefret ediyor.", en: "You pull the mother out of the guards' grip and into your own arms. She bites, she claws, she screams, \"Let me go!\" She doesn't know you at all, and she hates you." }
          - { tr: "Kız bir kez arkasına bakıyor; annesine, sonra sana. Sonra kurdelesini düzeltiyor ve kapının solgun ışığına adım atıyor.", en: "The girl looks back once, at her mother, then at you. Then she fixes her ribbon and steps into the Gate's pale light." }
        secenekler:
          - id: "atla"
            etiket: { tr: "Anneyi bırak; kızın peşinden sen atla", en: "Let go of the mother. Jump in after the girl" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -3 }
              - savas: { dusmanlar: ["besik_bekcisi@oyuncu+3"], ortam: ["dar_gecit", "karanlik"], kazan: "tepe_besik_sinavi_zafer", kaybet: "tepe_besik_sinavi_yenilgi", kac: "tepe_besik_sinavi_kacis" }
            kronik: { tr: "Anneyi bırakıp kızın peşinden Beşik'e atladın.", en: "You let go of the mother and jumped into the Cradle after her daughter." }
          - id: "bekle"
            etiket: { tr: "Anneyle birlikte bekle", en: "Wait with the mother" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 2 }
            kronik: { tr: "Beşik'in kenarında bir anneyle birlikte, kızının çıkmasını bekledin.", en: "At the edge of the Cradle, you waited with a mother for her daughter to come out." }
            sonraki: "tepe_besik_sinavi_bekle"

      - id: "tepe_besik_sinavi_bekle"
        yer: "tepe"
        paragraflar:
          - { tr: "On dört dakika. Sonra küçük bir el havuzun kenarını kavrıyor ve kız çıkıyor: kolunda bekçinin pençe izleri, gözlerinin önünde hiçbir pencere yok.", en: "Fourteen minutes. Then a small hand grabs the pool's edge and the girl climbs out, the keeper's claw marks on her arm and no window in front of her eyes." }
          - { tr: "Kutsayıcı elini kaldırıyor. \"Yakıt,\" diyor, sesinde ne öfke ne üzüntü; bir kâtibin sesi. İki muhafız kızı kollarından tutup aşağı evlere doğru götürmeye başlıyor.", en: "The Anointer raises his hand. \"Fuel,\" he says. No anger, no sorrow in it. A clerk's voice. Two guards take the girl by the arms and start walking her toward the lower houses." }
          - { tr: "Anne bu kez bağırmıyor. Sessizce çöküyor; o sessizlik bütün çığlıklardan yüksek.", en: "This time the mother doesn't scream. She just folds up without a sound, and that silence is louder than any scream." }
        secenekler:
          - id: "al"
            tur: "gosteris"
            etiket: { tr: "Kızı muhafızların elinden çekip al", en: "Pull the girl right out of the guards' hands" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 5, duzen: -3 }
              - itibar: { yukselenler: -3 }
            kronik: { tr: "Yakıt ilan edilen kızı iki Seçilmiş muhafızın elinden çekip aldın.", en: "You pulled the girl they'd declared fuel right out of the hands of two Chosen guards." }
            sonraki: "tepe_besik_sinavi_kurtar"
          - id: "dovus"
            etiket: { tr: "Muhafızların önünü kes", en: "Cut the guards off" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - savas: { dusmanlar: ["secilmis_muhafiz@dunya", "secilmis_muhafiz@dunya"], ortam: ["karanlik"], kazan: "tepe_besik_sinavi_kurtar", kaybet: "tepe_besik_sinavi_yenilgi", kac: "tepe_besik_sinavi_yenilgi" }
            kronik: { tr: "Yakıt ilan edilen bir kız için Tepe'nin muhafızlarıyla dövüştün.", en: "You fought the Heights' guards over a girl they'd declared fuel." }
          - id: "birak"
            etiket: { tr: "Bırak; Tepe'nin kuralı bu", en: "Let it go. That's the law up here" }
            etkiler:
              - ahlak: { merhamet: -5, insanlik: -3 }
              - bayrak: "tepe_kiz_yakit"
              - degisken: { hayatta_kalan: -1 }
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Kurdeleli kız yakıt evlerine götürülürken arkasından baktın.", en: "You watched them walk the girl with the ribbon down to the fuel houses." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_kurtar"
        yer: "tepe"
        paragraflar:
          - metin: { tr: "Muhafızlar yerde, kılıçları havuzun dibinde. Ezme diye buna denir; kalabalık bir an kimin kutsandığını şaşırıyor.", en: "The guards are on the ground, their swords at the bottom of the pool. That's what a curb-stomp looks like, and for a second the crowd isn't sure who just got anointed." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - { tr: "Kızı kucağına alıyorsun; annesi elini tutuyor ve bırakmıyor. Tepe'den aşağı inerken arkanızdan kimse gelmiyor; yalnızca villaların perdeleri bir bir aralanıyor.", en: "You pick the girl up. Her mother takes her hand and won't let go. Nobody follows you down off the Heights. The curtains in the mansion windows just twitch open, one by one." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "İkisini {fraksiyon:siginak|e} götür", en: "Take them both to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - itibar: { siginak: 4, yukselenler: -3 }
              - iliski: { elif_sari: { guven: 3 }, vahit: { guven: -2 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: 25 }
              - bayrak: "tepe_kiz_indirildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 45
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Yakıt ilan edilen kızı ve annesini Tepe'den Sığınak'a taşıdın.", en: "You carried a girl they'd declared fuel, and her mother, from the Heights down to the Haven." }
            sonraki: "@akis"
          - id: "kendin"
            etiket: { tr: "Onları kendi korumana al", en: "Take them under your own protection" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2, duzen: -1 }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: 25 }
              - iliski: { vahit: { saygi: 1, guven: -2 } }
              - bayrak: "tepe_kiz_indirildi"
              - bayrak: "tepe_kiz_korumada"
              - dikkat: 1
              - xp_seviye: 45
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'ten yakıt olarak çıkan kızı kendi adının koruması altına aldın.", en: "You put the girl who came out of the Cradle as fuel under the protection of your own name." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_zafer"
        yer: "tepe"
        paragraflar:
          - metin: { tr: "Beşik'in içi bir kuyu gibi, beyaz kemiklerden örülmüş. Bekçi seni gördüğü an geri çekiliyor; birkaç saniye sonra geri çekilecek bir yeri kalmıyor.", en: "Inside, the Cradle is like a well walled with white bones. The keeper backs away the second it sees you. A few seconds later, it's out of places to back away to." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Beşik'in içi bir kuyu gibi, beyaz kemiklerden örülmüş. Bekçiyle kemiklerin üstünde, kızın çığlıkları arasında boğuşuyorsun; sonunda o düşüyor, sen ayakta kalıyorsun.", en: "Inside, the Cradle is like a well walled with white bones. You and the keeper grapple on the bones with the girl screaming the whole time. Finally it goes down, and you're still standing." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Kızı sırtına alıp kapıdan çıkıyorsun. Havuzun kenarındaki kalabalık geri çekiliyor; Kutsayıcı bembeyaz, \"Sınav bozuldu,\" diye fısıldıyor. Seçilmiş muhafızlar ellerini kılıçlarına götürüyor.", en: "You climb out of the Gate with the girl on your back. The crowd at the pool's edge backs up. The Anointer's gone white. \"The trial is broken,\" he whispers. The Chosen guards put their hands on their swords." }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; kimse kıpırdamasın", en: "Open your true level. Nobody moves" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 4, korku: 2 } }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - xp_seviye: 80
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'ten bir kızla çıktın ve gerçek seviyenle Tepe'nin muhafızlarını yerlerine çiviledin.", en: "You came out of the Cradle with a girl on your back and froze the Heights' guards in place with your true level." }
            sonraki: "@akis"
          - id: "annesine"
            etiket: { tr: "Kızı annesine ver ve Tepe'den inin", en: "Give the girl to her mother. Walk down the hill" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { yukselenler: -4, siginak: 4 }
              - iliski: { vahit: { saygi: -2, guven: -3 }, elif_sari: { guven: 2 } }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: 30 }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_indirildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 80
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'in bekçisini öldürdün ve kurdeleli kızı annesine geri verdin.", en: "You killed the Cradle's keeper and gave the girl with the ribbon back to her mother." }
            sonraki: "@akis"
          - id: "secilmis"
            etiket: { tr: "Kızı Seçilmiş ilan ettir; artık onlardan biri", en: "Have her declared Chosen. She's one of them now" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1, insanlik: -2 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { saygi: 2 } }
              - bayrak: "tepe_sinav_bozuldu"
              - bayrak: "tepe_kiz_secilmis"
              - xp_seviye: 80
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'ten kurtardığın kızı Yükselenler'in Seçilmişleri arasına yazdırdın; onu böyle koruyabileceğini düşündün.", en: "You had the girl you saved from the Cradle written in among the Ascended's Chosen. You figured that was how to keep her safe." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Bir şey seni kemik duvarlara çarpıyor, bir kez, iki kez. Kendine geldiğinde havuzun dibindesin; kız kucağında, ikiniz de kan içinde, kapı hâlâ açık.", en: "Something slams you into the bone walls, once, twice. When you come to, you're at the bottom of the pool, the girl in your arms, both of you soaked in blood, the Gate still open." }
          - { tr: "Kutsayıcı havuzun kenarından sana bakıyor ve ne diyeceğini bilmiyor. Yakıt mı, Seçilmiş mi; kitabında senin için bir sayfa yok.", en: "The Anointer stares down at you from the pool's edge and doesn't know what to say. Fuel or Chosen, there's no page in his book for you." }
        secenekler:
          - id: "in"
            etiket: { tr: "Kızı al ve Tepe'den in; kimse durdurmasın", en: "Carry the girl down the hill. Dare them to stop you" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { yukselenler: -2, siginak: 2 }
              - hafiza: { npc: "vahit", id: "kurbani_kurtardi", agirlik: 20 }
              - bayrak: "tepe_kiz_indirildi"
              - xp_seviye: 30
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Beşik'te yenildin ama kızı yine de kucağında Tepe'den indirdin.", en: "You lost inside the Cradle, but you still carried the girl down off the Heights." }
            sonraki: "@akis"
          - id: "pazarlik"
            etiket: { tr: "Kutsayıcıyla pazarlık et: kız yakıt sayılmasın", en: "Bargain with the Anointer: she isn't fuel" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - kredi: -40
              - itibar: { yukselenler: 1 }
              - iliski: { vahit: { saygi: 1 } }
              - bayrak: "tepe_kiz_secilmis"
              - xp_seviye: 30
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Bir kızın yakıt sayılmaması için Kutsayıcıya kredi saydın.", en: "You counted out credits to the Anointer so a girl wouldn't be counted as fuel." }
            sonraki: "@akis"

      - id: "tepe_besik_sinavi_kacis"
        yer: "tepe"
        paragraflar:
          - { tr: "Kızı kolundan yakalayıp kapının ağzına doğru atılıyorsun; bekçi peşinizden geliyor ama çıkışın ışığında duruyor. Kapının dışına çıkamıyor.", en: "You grab the girl by the arm and dive for the mouth of the Gate. The keeper comes after you, but it stops at the edge of the light. It can't leave." }
          - { tr: "Havuzun dibinde nefes nefese oturuyorsunuz. Kız yaşıyor; bekçi de. Kutsayıcı kalabalığa dönüyor: \"Yarın sıra kimdeydi?\"", en: "The two of you sit gasping at the bottom of the pool. The girl's alive. So is the keeper. The Anointer turns to the crowd. \"Whose turn was it tomorrow?\"" }
        secenekler:
          - id: "in"
            etiket: { tr: "Kızı al ve git; yarını sonra düşün", en: "Take the girl and go. Worry about tomorrow later" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "tepe_kiz_indirildi"
              - bayrak: "tepe_sinav_suruyor"
              - xp_seviye: 25
              - tohum: { olay: "tepe_sinav_sonrasi", gecikme: { min: 5, max: 9 } }
            kronik: { tr: "Bir kızı Beşik'ten kurtardın ama Beşik açık kaldı; ertesi gün başka bir çocuk indi.", en: "You got one girl out of the Cradle, but the Cradle stayed open. The next day another kid went down." }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Kızı annesine bırak ve yeniden in", en: "Leave the girl with her mother. Go back down" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - savas: { dusmanlar: ["besik_bekcisi@oyuncu+3"], ortam: ["dar_gecit", "karanlik"], kazan: "tepe_besik_sinavi_zafer", kaybet: "tepe_besik_sinavi_yenilgi", kac: "tepe_besik_sinavi_yenilgi" }
            kronik: { tr: "Kızı çıkardıktan sonra bekçiyi bitirmek için Beşik'e geri döndün.", en: "After you got the girl out, you went back into the Cradle to finish the keeper." }

  # ------------------------------------------------------------------ beşik sınavının sonrası (tohum)
  - id: "tepe_sinav_sonrasi"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["tepe", "yukselenler", "ahlak"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Mavi kurdele", en: "The blue ribbon" }
    sahne: "tepe_sinav_sonrasi_1"
    sahneler:
      - id: "tepe_sinav_sonrasi_1"
        yer: "kiyikent"
        paragraflar:
          - metin: { tr: "Bir sabah kapında bir kız duruyor; saçında mavi bir kurdele, kolunda iyileşmekte olan pençe izleri. Arkasında annesi, kıyametten önceki hemşire üniformasının üstüne Sığınak'ın beyaz bandını takmış.", en: "One morning there's a girl at your door, blue ribbon in her hair, half-healed claw marks on her arm. Her mother's behind her, wearing the Haven's white armband over her old nursing scrubs." }
            kosul: { bayrak: "tepe_kiz_indirildi" }
          - metin: { tr: "Bir sabah sokakta önüne beyaz giysili bir kız çıkıyor; saçında mavi kurdele, gözlerinin önünde yeni bir pencere. Seçilmişlerin selamını veriyor ve sana Kutsayan diyor.", en: "One morning a girl in white steps into your path on the street, blue ribbon in her hair, a brand-new window in front of her eyes. She gives you the Chosen salute and calls you the Anointer." }
            kosul: { bayrak: "tepe_kiz_secilmis" }
          - metin: { tr: "Bir sabah kapında bir kadın duruyor; eski bir hemşire üniforması giyiyor ve elinde mavi bir kurdele var. Kızı yakıt evlerinde. Senden bir şey istemiyor; yalnızca kurdeleyi uzatıyor.", en: "One morning there's a woman at your door in old nursing scrubs, a blue ribbon in her hand. Her daughter's in the fuel houses. She isn't asking you for anything. She just holds out the ribbon." }
            kosul: { bayrak: "tepe_kiz_yakit" }
          - metin: { tr: "Tepe'de yeni bir havuz kazılıyor. Kutsayıcılar yeni bir Beşik arıyor; ama her kazmanın sesinde artık bir tereddüt var.", en: "Up in the Heights they're digging a new pool. The Anointers are looking for a new Cradle. But there's a hesitation in every swing of the pick now." }
            kosul: { bayrak: "tepe_sinav_bozuldu" }
          - metin: { tr: "Tepe'deki Beşik hâlâ açık. Dün bir çocuk daha indi; çıkıp çıkmadığını kimse söylemiyor.", en: "The Cradle up in the Heights is still open. Another kid went down yesterday. Nobody will say whether they came back up." }
            kosul: { bayrak: "tepe_sinav_suruyor" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "[BİL] Kız sana bakarken kendi ellerine de bakıyor. Bir şeyi tartıyor: o gün havuzun kenarında olanla, şimdi olacak olanı.", en: "[WIS] When the girl looks at you, she keeps looking at her own hands too. She's weighing something: what happened at the edge of that pool, against what's about to happen now." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocuklar seni hatırlar. her zaman. ne yaptığını değil; nasıl baktığını.", en: "kids remember you. always. not what you did. how you looked at them." }
        secenekler:
          - id: "ogret"
            etiket: { tr: "Kıza yeteneği olmadan da yaşamayı öğret", en: "Teach the girl to live without a skill" }
            goster: { bayrak: "tepe_kiz_indirildi" }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { elif_sari: { saygi: 2 } }
              - xp_seviye: 20
            sonraki: "tepe_sinav_sonrasi_ders"
          - id: "geri_al"
            etiket: { tr: "Kıza beyazı çıkarmasını söyle", en: "Tell the girl to take off the white" }
            goster: { bayrak: "tepe_kiz_secilmis" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "tepe_sinav_sonrasi_beyaz", basarisiz_etkiler: [{ ahlak: { insanlik: -1 } }] }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - itibar: { yukselenler: -2 }
              - iliski: { vahit: { guven: -2 } }
              - bayrak: "tepe_kiz_indirildi"
              - bayrak_kaldir: "tepe_kiz_secilmis"
              - xp_seviye: 20
            sonraki: "tepe_sinav_sonrasi_ders"
          - id: "yakit_evi"
            etiket: { tr: "Kurdeleyi al ve yakıt evlerine yürü", en: "Take the ribbon and walk to the fuel houses" }
            goster: { bayrak: "tepe_kiz_yakit" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { guven: -3, saygi: 2 } }
              - bayrak_kaldir: "tepe_kiz_yakit"
              - bayrak: "tepe_kiz_indirildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 25
            sonraki: "tepe_sinav_sonrasi_yakit"
          - id: "kazi"
            etiket: { tr: "Tepe'ye çık ve yeni havuzu doldur", en: "Go up the hill and fill in the new pool" }
            goster: { bayrak: "tepe_sinav_bozuldu" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 2 }
              - itibar: { yukselenler: -2 }
              - iliski: { vahit: { korku: 2 } }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "selam"
            etiket: { tr: "Başınla selam ver ve yoluna devam et", en: "Give them a nod and keep going" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "tepe_sinav_sonrasi_ders"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Bir gün boyunca ona kapılardan, yeteneklerden değil, kapıların dışındaki dünyadan söz ediyorsun: su nasıl kaynatılır, yara nasıl temizlenir, kim yalan söylerken gözünü kaçırır.", en: "For a whole day you talk to her about the world outside the Gates, not Gates or skills. How to boil water. How to clean a wound. Who looks away when they lie." }
          - { tr: "Akşama doğru kurdelesini çıkarıp sana uzatıyor. \"Artık buna ihtiyacım yok,\" diyor. \"O kurdeleyi annem Beşik için bağlamıştı.\"", en: "Toward evening she takes off her ribbon and hands it to you. \"I don't need this anymore,\" she says. \"My mom tied it on for the Cradle.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kurdeleyi cebine koy", en: "Put the ribbon in your pocket" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "tepe_sinav_sonrasi_beyaz"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Kız beyaz giysisinin yakasını düzeltiyor. \"Sen beni ittin,\" diyor, sakin. \"Sen öğrettin. Şimdi geri mi alıyorsun?\"", en: "The girl straightens the collar of her white robe. \"You pushed me,\" she says, calm. \"You taught me. Now you want to take it back?\"" }
          - { tr: "Arkasını dönüp Tepe'ye doğru yürüyor. Kurdelesi, adımlarının ritminde sallanıyor.", en: "She turns and walks back toward the Heights. Her ribbon swings in time with her steps." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Arkasından bakakal", en: "Watch her go" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "tepe_sinav_sonrasi_yakit"
        yer: "tepe"
        paragraflar:
          - { tr: "Yakıt evleri Tepe'nin arka yamacında, eskiden hizmetçilerin kaldığı alçak binalar. Kapıda bir muhafız var; seni görünce kapıyı açıyor ve bir şey sormuyor.", en: "The fuel houses sit on the back slope of the Heights, low buildings where the servants used to live. There's a guard at the door. He sees you, opens the door, and doesn't ask a thing." }
          - { tr: "Kız bir ranzanın köşesinde oturuyor, saçı kesilmiş. Kurdeleyi gördüğünde ayağa kalkıyor; ilk kez gülüyor.", en: "The girl's sitting on the corner of a bunk, her hair cut short. When she sees the ribbon, she stands up. For the first time, she smiles." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kızı al ve annesine götür", en: "Take the girl home to her mother" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"

  # ================================================================== SAYIM GECESİ (Tepe, önemli)
  - id: "tepe_sayim_gecesi"
    perde: [2]
    bolge: ["tepe"]
    gun: { min: 35, max: 175 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 5
    etiketler: ["tepe", "yukselenler", "ahlak", "gizli_guc"]
    gerilim: 3
    onemli: true
    kart: { tr: "Çatı arasındaki dede", en: "Grandpa in the attic" }
    sahne: "tepe_sayim_gecesi_1"
    sahneler:
      - id: "tepe_sayim_gecesi_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepe'de akşam sayımı var. Beyaz giysili üç Yükselen bir fenerle evden eve dolaşıyor; fenerin ışığı kime değerse başının üstünde seviyesi beliriyor ve kâtip deftere yazıyor: Seçilmiş, hizmetli, yakıt.", en: "It's evening census in the Heights. Three Ascended in white go house to house with a lantern. Whoever its light touches, their level pops up over their head, and the clerk writes it in the book: Chosen, servant, fuel." }
          - { tr: "Sokağın sonundaki evin kapısı aralanıyor ve otuzlarında bir kadın seni kolundan içeri çekiyor. \"Babam çatı arasında,\" diye fısıldıyor. \"Üçüncü seviye. Yetmiş iki yaşında. Fener onu görürse yakıt evlerine götürürler.\"", en: "The door of the last house on the street cracks open and a woman in her thirties pulls you inside by the arm. \"My dad's in the attic,\" she whispers. \"Level 3. He's seventy-two. If that lantern sees him, they'll take him to the fuel houses.\"" }
          - { tr: "Merdivenin başında iki çocuk oturuyor. Büyüğü, on yaşlarında bir oğlan, annesine değil sana bakıyor; sayıyı görmüş ve bundan bir şey bekliyor.", en: "Two kids sit at the top of the stairs. The older one, a boy of about ten, isn't looking at his mother. He's looking at you. He saw your number, and he expects something from it." }
          - metin: { tr: "Kasaba Çekirdeği Yükselenler'de. Fenerin ışığı Çekirdek'ten besleniyor; ondan kaçmak, Çekirdek'ten kaçmak demek.", en: "The Town Core belongs to the Ascended. The lantern draws its light straight from the Core. Hiding from one means hiding from the other." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Kasaba Çekirdeği Yükselenler'de değil, bu yüzden fener sönük ve kısa menzilli. Yine de bir çatı arasını aydınlatmaya yeter.", en: "The Town Core doesn't belong to the Ascended, so the lantern's dim and short-ranged. Still plenty to light up one attic." }
            kosul: { bayrak_yok: "cekirdek_yukselenler" }
          - metin: { tr: "Kadın boynundaki Yükselenler kolyesine bakıyor, sonra seninkine. \"Sen onlardansın,\" diyor. \"Ama çaldığım tek kapı seninkiydi.\"", en: "The woman looks at the Ascended pendant around your neck. \"You're one of them,\" she says. \"But yours was the only door I could knock on.\"" }
            kosul: { bayrak: "uye_yukselenler" }
        sezgiler:
          - kosul: { stat: { int: 45 } }
            metin: { tr: "[ZEK] Fener bir yetenek değil, bir alet: içinde Çekirdek'e bağlı bir kapı kristali. Kristalin ritmini bozan biri onu bir mum gibi söndürebilir.", en: "[INT] The lantern isn't a skill, it's a tool: a Gate crystal inside, tethered to the Core. Somebody who can throw off the crystal's rhythm could snuff it like a candle." }
          - kosul: { stat: { per: 40 } }
            metin: { tr: "[ALG] Çatı arasında iki kalp atışı var, bir değil. Dedenin yanında biri daha saklanıyor.", en: "[PER] There are two heartbeats in the attic, not one. Somebody's hiding up there with the old man." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "fener seni de okuyacak. ne göstermesini istersin? söyle, ben ayarlarım.", en: "the lantern's going to read you too. what do you want it to show? tell me and i'll set it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yetmiş iki yaşında bir adam. Yakıt. Bu kelimeyi duyduğum her seferinde bir şey kırılıyor.\"", en: "\"A seventy-two-year-old man. Fuel. Every time I hear that word, something breaks.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Onu Sığınak'a indirebiliriz. Yolu biliyorum; yeter ki fener bu evden geçsin.\"", en: "\"We can get him down to the Haven. I know the way. The lantern just has to get past this house first.\"" }
        secenekler:
          - id: "fener"
            tur: "gosteris"
            etiket: { tr: "Kapıda durup feneri bakışınla söndür", en: "Stand in the door and snuff the lantern with a look" }
            gerekli: { stat: { int: 45 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 4, duzen: -3 }
            kronik: { tr: "Tepe'nin sayım fenerini bir bakışla söndürdün ve bir yaşlı adam yakıt sayılmadı.", en: "You snuffed the Heights' census lantern with one look, and an old man didn't get counted as fuel." }
            sonraki: "tepe_sayim_gecesi_fener"
          - id: "kapi"
            etiket: { tr: "Kapıda dur; sayımı içeri sokma", en: "Block the door. The census doesn't come in" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
            kronik: { tr: "Sayım gecesi Tepe'de bir evin kapısında durdun ve fenerin içeri girmesine izin vermedin.", en: "On census night in the Heights, you stood in a doorway and wouldn't let the lantern in." }
            sonraki: "tepe_sayim_gecesi_kapi"
          - id: "kacir"
            etiket: { tr: "Dedeyi damlardan Eski Şehir'e kaçır", en: "Sneak grandpa over the rooftops to Old Town" }
            zar: { stat: "agi", zorluk: 15, tek: true, basarisiz: "tepe_sayim_gecesi_yakalandi", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
            kronik: { tr: "Sayım gecesi yetmiş iki yaşında bir adamı Tepe'nin damlarından aşağı kaçırdın.", en: "On census night, you smuggled a seventy-two-year-old man down off the Heights over the rooftops." }
            sonraki: "tepe_sayim_gecesi_kacir"
          - id: "muaf"
            etiket: { tr: "Bir Yükselen olarak aileyi muaf ilan et", en: "As one of the Ascended, declare the family exempt" }
            goster: { bayrak: "uye_yukselenler" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { yukselenler: -1 }
            kronik: { tr: "Yükselenler'in sayımında bir aileyi kendi adınla muaf ilan ettin.", en: "During the Ascended census, you declared a family exempt on your own name." }
            sonraki: "tepe_sayim_gecesi_muaf"
          - id: "goster"
            etiket: { tr: "Sayımcılara çatı arasını göster", en: "Show the census team the attic" }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 4, insanlik: -3 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "Sayım gecesi çatı arasında saklanan yaşlı adamı Yükselenler'e sen gösterdin.", en: "On census night, you're the one who showed the Ascended the old man hiding in the attic." }
            sonraki: "tepe_sayim_gecesi_teslim"

      - id: "tepe_sayim_gecesi_fener"
        yer: "tepe"
        paragraflar:
          - { tr: "Sayımcılar kapıya geliyor ve fener yükseliyor. Kristalin içindeki ritmi duyuyorsun, bir kalp atışı gibi; ona bakıyorsun ve ritmi kendi ritminle bozuyorsun.", en: "The census team reaches the door and the lantern comes up. You can hear the rhythm inside the crystal, like a heartbeat. You look at it and break its rhythm with your own." }
          - { tr: "Fener bir kez kırpıştırıyor ve sönüyor. Kâtip feneri sallıyor, vuruyor, küfrediyor; sonra omuz silkip deftere \"boş ev\" yazıyor ve sonraki kapıya geçiyorlar.", en: "The lantern blinks once and goes out. The clerk shakes it, smacks it, swears at it. Then he shrugs, writes \"empty house\" in his book, and they move on to the next door." }
          - { tr: "Çatı arasından önce bir baston, sonra yaşlı bir adam, sonra on beş yaşlarında bir kız iniyor; kız da sayılmaktan kaçıyormuş. Evdekiler sana bakıyor; kimse bir şey sormuyor, sormaya korkuyorlar.", en: "First a cane comes down from the attic, then an old man, then a girl about fifteen. She was hiding from the count too. The family stares at you. Nobody asks anything. They're afraid to." }
        secenekler:
          - id: "in"
            etiket: { tr: "İkisini de gece yarısı Tepe'den indir", en: "Get them both off the Heights by midnight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 3, yukselenler: -1 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 40
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Fenerin sönük kaldığı gece bir dedeyle bir kızı Tepe'den indirdin.", en: "The night the lantern stayed dark, you got an old man and a girl down off the Heights." }
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Evde kalsınlar; sayım bir daha bu kapıya uğramaz", en: "They stay. The census won't hit this door again" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 40
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Bir aileyi Tepe'de, sayımın görmediği bir evde bıraktın.", en: "You left a family in the Heights, in a house the census never saw." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_kapi"
        yer: "tepe"
        paragraflar:
          - { tr: "Kapıya yaslanıyorsun. Sayımın başındaki uzun boylu Seçilmiş feneri yüzüne tutuyor; görünen seviyen ışıkta beliriyor ve adam dudak büküyor.", en: "You lean in the doorway. The tall Chosen leading the census holds the lantern up to your face. Your public level shows up in the light, and he curls his lip." }
          - { tr: "\"Kenara çekil,\" diyor. \"Sistem sayılmayı ister. Saklanan, kendini yakıt ilan eder.\" Arkasındaki iki muhafız ellerini kılıçlarına koyuyor.", en: "\"Step aside,\" he says. \"The System wants a count. Whoever hides declares himself fuel.\" The two guards behind him rest their hands on their swords." }
          - metin: { tr: "Fenerin ışığı senin görünen sayını gösteriyor, gerçeğini değil. Adam bir hata yapmak üzere.", en: "The lantern's showing your public number, not the real one. The man's about to make a mistake." }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Fenere gerçek seviyeni oku", en: "Let the lantern read your true level" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 1, merhamet: 2 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { saygi: 3 } }
            kronik: { tr: "Sayım fenerine gerçek seviyeni okuttun; Seçilmiş başını eğip geri çekildi.", en: "You let the census lantern read your true level. The Chosen bowed his head and backed off." }
            sonraki: "tepe_sayim_gecesi_egildi"
          - id: "savas"
            etiket: { tr: "Kılıçlar çekilmeden önce sen davran", en: "Move before those swords clear the scabbard" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -4 }
              - itibar: { yukselenler: -3 }
              - savas: { dusmanlar: ["secilmis_muhafiz@dunya", "secilmis_muhafiz@dunya"], ortam: ["karanlik", "dar_gecit"], kazan: "tepe_sayim_gecesi_zafer", kaybet: "tepe_sayim_gecesi_yenilgi", kac: "tepe_sayim_gecesi_yenilgi" }
            kronik: { tr: "Sayım gecesi bir evin kapısında Yükselenler'in muhafızlarıyla dövüştün.", en: "On census night you fought the Ascended's guards in a family's doorway." }
          - id: "rusvet"
            etiket: { tr: "Seçilmişe kredi uzat; bu evi saymasın", en: "Slip the Chosen some credits. Skip this house" }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 1 }
              - kredi: -40
            kronik: { tr: "Bir yaşlı adamın hayatını Tepe'nin sayımcısından kırk krediye satın aldın.", en: "You bought an old man's life from the Heights' census taker for forty credits." }
            sonraki: "tepe_sayim_gecesi_rusvet"

      - id: "tepe_sayim_gecesi_egildi"
        yer: "tepe"
        paragraflar:
          - { tr: "Fener titriyor; ışığı senin satırını taşıyamıyor gibi. Seçilmiş sayıyı okuyor, yeniden okuyor ve başını eğiyor; arkasındaki muhafızlar da.", en: "The lantern trembles like its light can't hold your line. The Chosen reads the number, reads it again, and bows his head. So do the guards behind him." }
          - { tr: "\"Bu ev,\" diyor kâtibe, gözlerini yerden kaldırmadan, \"sayılmış sayılır.\" Sonraki kapıya geçiyorlar; geçerken içlerinden biri sana dönüp dua eder gibi dudak kıpırdatıyor.", en: "\"This house,\" he tells the clerk, eyes still on the ground, \"counts as counted.\" They move on to the next door. On the way, one of them turns back and moves his lips at you like he's praying." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kapıyı kapat ve çatı arasına seslen", en: "Close the door and call up to the attic" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - dikkat: 1
              - xp_seviye: 40
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Tepe'nin sayımcıları senin önünde eğildi ve bir ev sayılmadan kaldı.", en: "The Heights' census team bowed to you, and one house went uncounted." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_rusvet"
        yer: "tepe"
        paragraflar:
          - { tr: "Seçilmiş kredileri saymadan cebine atıyor. \"Bu ay,\" diyor. \"Gelecek ay fener yine gelir; yine sen burada olursun, değil mi?\"", en: "The Chosen pockets the credits without counting them. \"This month,\" he says. \"Next month the lantern comes back. And you'll be here again, right?\"" }
          - { tr: "Gidiyorlar. Kadın kapıyı kapatıyor, sırtını ona dayıyor ve kayıyor; yerde, sessizce ağlıyor.", en: "They leave. The woman shuts the door, puts her back to it and slides down. On the floor, she cries without a sound." }
        secenekler:
          - id: "in"
            etiket: { tr: "Bir ay bekleme; dedeyi bu gece indir", en: "Don't wait a month. Get grandpa out tonight" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: 2 }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 30
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Sayımcıya rüşvet verdin, sonra yine de dedeyi o gece Tepe'den indirdin.", en: "You bribed the census taker, then got grandpa off the Heights that same night anyway." }
            sonraki: "@akis"
          - id: "her_ay"
            etiket: { tr: "Her ay gelip ödeyeceğine söz ver", en: "Promise to come back and pay every month" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - bayrak: "tepe_dede_kurtarildi"
              - bayrak: "tepe_aylik_rusvet"
              - xp_seviye: 30
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Bir ailenin her ayki sayımını kendi cebinden ödemeye söz verdin.", en: "You promised to pay off a family's census out of your own pocket, every month." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_zafer"
        yer: "tepe"
        paragraflar:
          - metin: { tr: "Kılıçlar kınlarından çıkamıyor bile. İki muhafız kapının önünde yan yana yatıyor ve fener sokağın taşlarında yuvarlanarak sönüyor.", en: "The swords never even clear their scabbards. The two guards end up lying side by side in front of the door, and the lantern rolls across the cobblestones and goes out." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Sonuncu muhafız da sokağın taşlarına düşüyor. Fener elinden kayıp bir duvara çarpıyor ve sönüyor; sokağın bütün perdeleri aynı anda kapanıyor.", en: "The last guard hits the cobblestones. The lantern slips out of his hand, cracks against a wall and goes dark, and every curtain on the street snaps shut at the same time." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
          - { tr: "Uzun boylu Seçilmiş geri geri kaçıyor. \"Bu ev artık yakıt değil,\" diye bağırıyor, \"bu ev lanetli!\" Kâtip defteri bırakıp peşinden koşuyor.", en: "The tall Chosen backpedals down the street. \"This house isn't fuel anymore,\" he shouts, \"this house is cursed!\" The clerk drops the book and runs after him." }
        secenekler:
          - id: "defter"
            etiket: { tr: "Sayım defterini al ve yak", en: "Pick up the census book and burn it" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -4 }
              - itibar: { yukselenler: -4, siginak: 2 }
              - iliski: { vahit: { guven: -3, saygi: 1 } }
              - bayrak: "tepe_dede_kurtarildi"
              - bayrak: "tepe_defter_yandi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 45
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Tepe'nin sayım defterini sokağın ortasında yaktın; o sokakta bir daha kimse sayılmadı.", en: "You burned the Heights' census book in the middle of the street. Nobody on that street ever got counted again." }
            sonraki: "@akis"
          - id: "dede"
            etiket: { tr: "Defteri bırak; dedeyi aşağı indir", en: "Leave the book. Get grandpa down the hill" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - itibar: { yukselenler: -2 }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 45
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Muhafızları yere serdin ve yetmiş iki yaşında bir adamı Tepe'den indirdin.", en: "You put the guards down and walked a seventy-two-year-old man off the Heights." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_yenilgi"
        yer: "tepe"
        paragraflar:
          - { tr: "Bir kılıç kabzası çenene iniyor; dünya bir an kararıyor. Gözünü açtığında fener çatı arasının merdiveninde, ışığı tavana vuruyor.", en: "A sword pommel catches you on the jaw and the world blacks out for a second. When you open your eyes, the lantern's on the attic stairs, its light hitting the ceiling." }
          - { tr: "Yaşlı adam bastonuyla iniyor, kendiliğinden. \"Kimse benim için dövüşmesin,\" diyor. \"Yetmiş iki yıl yaşadım; yeter.\" Muhafızlar onu kollarından tutup götürüyor.", en: "The old man comes down on his own, leaning on his cane. \"Nobody fights over me,\" he says. \"I've had seventy-two years. That's enough.\" The guards take him by the arms and walk him off." }
        secenekler:
          - id: "pesinden"
            etiket: { tr: "Kalk ve yakıt evlerine kadar peşlerinden git", en: "Get up and follow them all the way to the fuel houses" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - bayrak: "tepe_dede_teslim"
              - xp_seviye: 20
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Yakıt evlerine götürülen yaşlı adamın peşinden kapıya kadar yürüdün.", en: "You followed the old man they took all the way to the door of the fuel houses." }
            sonraki: "@akis"
          - id: "aile"
            etiket: { tr: "Ailenin yanında kal", en: "Stay with the family" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 2 }
              - bayrak: "tepe_dede_teslim"
              - degisken: { hayatta_kalan: -1 }
              - xp_seviye: 20
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Dedeyi götürdükleri gece ailesinin yanında oturdun.", en: "The night they took grandpa, you sat with his family." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_kacir"
        yer: "tepe"
        paragraflar:
          - { tr: "Yaşlı adamı sırtına alıyorsun; bastonu kemerine sıkıştırıyorsun. Çatı penceresinden çıkıp villaların kiremitleri üstünde, fenerin ışığının bir adım önünde koşuyorsun.", en: "You get the old man on your back and jam his cane through your belt. Out the attic window, across the mansion roof tiles, one step ahead of the lantern's light." }
          - { tr: "Şafak sökerken Eski Şehir'in dar sokaklarındasınız. Yaşlı adam sırtından iniyor, nefes nefese gülüyor. \"Kırk yıl tarih öğrettim,\" diyor. \"Hiçbir kitapta böyle bir kaçış okumadım.\"", en: "By dawn you're in the narrow streets of Old Town. The old man slides off your back, laughing and out of breath. \"Forty years I taught history,\" he says. \"Never read an escape like that in any book.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onu Eski Şehir'de güvenli bir yere bırak", en: "Leave him somewhere safe in Old Town" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 35
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Kırk yıl tarih öğretmiş bir adamı Tepe'nin damlarından Eski Şehir'e taşıdın.", en: "You carried a man who'd taught history for forty years over the Heights' rooftops to Old Town." }
            sonraki: "@akis"
          - id: "siginak"
            etiket: { tr: "Onu {fraksiyon:siginak|e} teslim et", en: "Hand him over to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 35
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Tepe'den kaçırdığın yaşlı adamı Sığınak'ın kapısına bıraktın.", en: "You left the old man you smuggled off the Heights at the Haven's door." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_yakalandi"
        yer: "tepe"
        paragraflar:
          - { tr: "Bir kiremit ayağının altında kırılıyor ve sesi bütün sokağa yayılıyor. Fenerin ışığı damın üstüne çıkıyor ve sırtındaki adamın seviyesini gökyüzüne yazıyor: 3.", en: "A roof tile snaps under your foot and the sound carries down the whole street. The lantern's light comes up over the roofline and writes the old man's level against the sky: 3." }
          - { tr: "Aşağıda iki Seçilmiş muhafız damın saçağına tırmanıyor. \"Yakıtı bırak,\" diye bağırıyor biri. \"Seni sayıya katmayız.\"", en: "Down below, two Chosen guards are climbing up to the eaves. \"Drop the fuel,\" one of them yells. \"We won't count you.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Dedeyi baca dibine bırak ve dön", en: "Set grandpa by the chimney and turn around" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - savas: { dusmanlar: ["secilmis_muhafiz@dunya", "secilmis_muhafiz@dunya"], ortam: ["karanlik"], kazan: "tepe_sayim_gecesi_zafer", kaybet: "tepe_sayim_gecesi_yenilgi", kac: "tepe_sayim_gecesi_yenilgi" }
            kronik: { tr: "Bir yaşlı adamı baca dibine bırakıp Tepe'nin damlarında muhafızlarla dövüştün.", en: "You set an old man down by a chimney and fought the guards on the Heights' rooftops." }
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni gökyüzüne yaz", en: "Write your true level across the sky" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 1, merhamet: 2 }
              - itibar: { yukselenler: 2 }
            kronik: { tr: "Tepe'nin damlarında gerçek seviyeni açtın; muhafızlar saçaktan aşağı indi.", en: "You opened your true level on the Heights' rooftops, and the guards climbed back down off the eaves." }
            sonraki: "tepe_sayim_gecesi_egildi"

      - id: "tepe_sayim_gecesi_muaf"
        yer: "tepe"
        paragraflar:
          - { tr: "Kapıyı sen açıyorsun. Sayımcılar kolyeni görüyor ve feneri indiriyor. \"Bu ev benim himayemde,\" diyorsun. Kâtip bir şey diyecek oluyor, sonra deftere senin adını yazıyor.", en: "You open the door yourself. The census team sees your pendant and lowers the lantern. \"This house is under my protection,\" you say. The clerk starts to say something, then writes your name in the book." }
          - { tr: "Gidiyorlar. Ama defterde artık bu evin yanında senin adın var; bu evde ne olursa, Yükselenler bunu senden soracak.", en: "They leave. But now your name is in the book next to this house. Whatever happens here, the Ascended will ask you about it." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Bedelini kabul et", en: "Accept the price" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "tepe_aile_muaf"
              - bayrak: "tepe_dede_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - iliski: { vahit: { saygi: 1, guven: -1 } }
              - xp_seviye: 30
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Bir ailenin adını Yükselenler'in defterinde kendi adının yanına yazdırdın.", en: "You had a family's name written next to yours in the Ascended's book." }
            sonraki: "@akis"

      - id: "tepe_sayim_gecesi_teslim"
        yer: "tepe"
        paragraflar:
          - { tr: "Kapıyı açıp sayımcılara merdiveni gösteriyorsun. Kadın bir çığlık atıyor, sonra susuyor; çocuklar merdivenin başında taş kesilmiş.", en: "You open the door and point the census team at the stairs. The woman screams once, then goes silent. The kids at the top of the stairs have turned to stone." }
          - { tr: "Yaşlı adam bastonuyla iniyor ve sana bakıyor. \"Kırk yıl tarih öğrettim,\" diyor. \"Her çağda senin gibi biri vardı. Hiçbiri kitapta iyi kalmadı.\"", en: "The old man comes down on his cane and looks right at you. \"Forty years I taught history,\" he says. \"Every age had somebody like you. None of them came out well in the books.\"" }
          - { tr: "Merdivenin başındaki oğlan sana hâlâ bakıyor. Sayından bir şey bekliyordu; şimdi ne olduğunu öğrendi.", en: "The boy at the top of the stairs is still looking at you. He expected something from your number. Now he knows what it was." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Sayımla birlikte sonraki eve yürü", en: "Walk on to the next house with the census" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - itibar: { yukselenler: 3 }
              - bayrak: "tepe_dede_teslim"
              - degisken: { hayatta_kalan: -1 }
              - xp_seviye: 30
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Bir dedeyi Yükselenler'e teslim ettin ve sayımla birlikte sonraki kapıya yürüdün.", en: "You handed a grandfather over to the Ascended and walked on to the next door with the census." }
            sonraki: "@akis"
          - id: "pisman"
            etiket: { tr: "Kapıda dur; bir şey söylemeye çalış", en: "Stop in the doorway. Try to say something" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - bayrak: "tepe_dede_teslim"
              - degisken: { hayatta_kalan: -1 }
              - xp_seviye: 30
              - tohum: { olay: "tepe_cati_arasi_sonrasi", gecikme: { min: 5, max: 10 } }
            kronik: { tr: "Dedeyi teslim ettikten sonra kapıda durup ailesine bir şey söylemeye çalıştın; söyleyemedin.", en: "After you gave grandpa up, you stopped in the doorway and tried to say something to his family. You couldn't." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ çatı arasının sonrası (tohum)
  - id: "tepe_cati_arasi_sonrasi"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["tepe", "yukselenler", "ahlak"]
    gerilim: 1
    yalniz_tohum: true
    kart: { tr: "Tarih öğretmeni", en: "The history teacher" }
    sahne: "tepe_cati_arasi_sonrasi_1"
    sahneler:
      - id: "tepe_cati_arasi_sonrasi_1"
        yer: "kiyikent"
        paragraflar:
          - metin: { tr: "Bir harabenin önünde, bir tebeşir tahtasının başında yaşlı bir adam on iki çocuğa ders veriyor: çatı arasındaki dede. Tahtada bir tarih ve altında tek bir cümle: İnsanlar sayılardan önce de vardı.", en: "In front of a ruin, at a chalkboard, an old man is teaching twelve kids: grandpa from the attic. On the board, a date, and under it, one sentence: People existed before numbers did." }
            kosul: { bayrak: "tepe_dede_kurtarildi" }
          - metin: { tr: "Bir sokak başında kadın seni bekliyor; Tepe'deki evin kadını. Babası yakıt evlerinde üç gün dayandı. \"Seni suçlamıyorum,\" diyor ve bunu söylemek ona her şeyden ağır geliyor.", en: "The woman from the house in the Heights is waiting for you on a street corner. Her father lasted three days in the fuel houses. \"I don't blame you,\" she says, and saying it costs her more than anything." }
            kosul: { bayrak: "tepe_dede_teslim" }
          - metin: { tr: "Kapının önünde bir kuyruk var: Tepe'den aileler. Yükselenler'in defterinde adının yanında bir ev olduğu duyulmuş; herkes kendi evinin de oraya yazılmasını istiyor.", en: "There's a line outside your door: families from the Heights. Word got around that there's a house next to your name in the Ascended book. Everybody wants theirs written in too." }
            kosul: { bayrak: "tepe_aile_muaf" }
          - metin: { tr: "Merdivenin başındaki oğlan da orada; artık on bir yaşında ve bir şeyi kesin biliyor: sayılar insanları korumuyor, insanlar insanları koruyor.", en: "The boy from the top of the stairs is there too. He's eleven now, and he's sure of one thing: numbers don't protect people. People protect people." }
            kosul: { bayrak: "tepe_dede_kurtarildi" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "[BİL] Herkes senden bir şey bekliyor. Bu bekleyiş bir gün bir zincire dönüşür, ya da bir kalkana.", en: "[WIS] Everybody wants something from you. Someday that wanting turns into a chain. Or a shield." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "insanlar sayılardan önce de vardı. ben ise sayılardan sonra geldim. bu tahtaya benim için bir satır yazılmaz.", en: "people existed before numbers. i came after. nobody's writing a line on that board for me." }
        secenekler:
          - id: "ders"
            etiket: { tr: "Çocukların arasına otur ve dersi dinle", en: "Sit down with the kids and listen to the lesson" }
            goster: { bayrak: "tepe_dede_kurtarildi" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - xp_seviye: 15
            sonraki: "tepe_cati_arasi_sonrasi_ders"
          - id: "ozur"
            etiket: { tr: "Kadından özür dile", en: "Apologize to the woman" }
            goster: { bayrak: "tepe_dede_teslim" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { elif_sari: { saygi: 1 } }
            sonraki: "@akis"
          - id: "kuyruk"
            etiket: { tr: "Kuyruktaki her aileyi deftere yazdır", en: "Get every family in line written into the book" }
            goster: { bayrak: "tepe_aile_muaf" }
            gerekli: { stat: { cha: 45 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
              - itibar: { yukselenler: -3, siginak: 3 }
              - iliski: { vahit: { guven: -3, saygi: 2 } }
              - degisken: { hayatta_kalan: 3 }
              - dikkat: 2
              - xp_seviye: 30
            sonraki: "@akis"
          - id: "geri_cevir"
            etiket: { tr: "Kuyruğu dağıt; bir evi kurtardın, şehri değil", en: "Send the line home. You saved one house, not a city" }
            goster: { bayrak: "tepe_aile_muaf" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
            sonraki: "@akis"
          - id: "gec"
            etiket: { tr: "Başınla selam ver ve yürü", en: "Nod and keep walking" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "tepe_cati_arasi_sonrasi_ders"
        yer: "kiyikent"
        paragraflar:
          - { tr: "Yaşlı adam veba yıllarını anlatıyor, kıtlıkları, savaşları; her birinde insanların birbirini nasıl sınıflandırdığını ve sınıflandıranların sonunda nasıl unutulduğunu.", en: "The old man talks about the plague years, the famines, the wars. How people sorted each other in every one of them, and how the ones doing the sorting were always forgotten in the end." }
          - { tr: "Ders bitince sana dönüyor. \"Sen bir gün bir kitapta olacaksın,\" diyor. \"Hangi sayfada olacağına hâlâ sen karar veriyorsun.\"", en: "When the lesson's over he turns to you. \"Someday you'll be in a book,\" he says. \"You're still the one deciding which page.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Tahtadaki cümleyi aklına yaz", en: "Commit the sentence on the board to memory" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

  # ================================================================== DİNLEYİCİLER (Tepe)
  - id: "tepe_dinleyiciler"
    perde: [2]
    bolge: ["tepe"]
    gun: { min: 38, max: 175 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 4
    etiketler: ["tepe", "yukselenler", "yanki", "gizem", "kesif"]
    gerilim: 2
    npc: ["vahit"]
    kart: { tr: "Sistem'i dinleyenler", en: "Those who listen to the System" }
    sahne: "tepe_dinleyiciler_1"
    sahneler:
      - id: "tepe_dinleyiciler_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepe'nin zirvesindeki eski gözlemevinin kubbesi yarı açık. İçeride yirmi kişi kulaklıklarla oturuyor; önlerinde eski radyolar, hepsi aynı cızırtıya ayarlı. Yükselenler onlara Dinleyiciler diyor.", en: "The dome of the old observatory at the top of the Heights is half open. Inside, twenty people sit in headphones in front of old radios, all tuned to the same static. The Ascended call them the Listeners." }
          - { tr: "Başlarında gözleri bantlı, kıyametten önce gece yarısı programı yapan bir spiker var. \"Sistem uğulduyor,\" diyor sana, yüzünü sesine çevirerek. \"Biz uğultunun arasındaki kelimeleri yazıyoruz. {npc:vahit} Efendi'ye gidiyor hepsi.\"", en: "Their leader has a bandage over his eyes. He used to host a late-night radio show before the end of the world. \"The System hums,\" he tells you, turning his face toward your voice. \"We write down the words in between. All of it goes to {npc:vahit|tam}.\"" }
          - { tr: "Sen içeri girdiğin anda bütün radyolar aynı anda cızırdıyor. Dinleyicilerden biri kulaklığını çıkarıp sana dönüyor, ağzı açık.", en: "The second you walk in, every radio in the room crackles at once. One of the Listeners pulls off her headphones and turns to stare at you, mouth hanging open." }
          - metin: { tr: "Gözlemevinin duvarında Kule'nin bir çizimi var; her katın yanında Dinleyicilerin duyduğunu iddia ettiği bir kelime yazılı.", en: "There's a drawing of the Spire on the observatory wall. Next to every floor is a word the Listeners claim to have heard." }
            kosul: { bayrak: "kule_acik" }
        sezgiler:
          - kosul: { stat: { int: 40 } }
            metin: { tr: "[ZEK] Cızırtı rastgele değil. Bir sayaç: bir şey sayıyor, sıfıra gelince başa dönüyor ve yeniden sayıyor.", en: "[INT] That static isn't random. It's a counter. Something counts down, hits zero, starts over, and counts again." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni duyuyorlar. tam değil. kenarlarımı. gitmemiz lazım. ya da kalmamız. bilmiyorum. ilk kez biri beni duyuyor.", en: "they can hear me. not all of me. my edges. we should go. or stay. i don't know. it's the first time anybody's heard me." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Şu radyolar... Bu kayıtlar bizim aylardır aradığımız şey olabilir. Bir kopya almalıyız.\"", en: "\"Those radios... These logs could be exactly what we've been hunting for months. We need a copy.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Radyolar sen girince öttü. Bunu ben de gördüm. Bir şey söyleyecek misin, yoksa ben mi soracağım?\"", en: "\"The radios went off when you walked in. I saw that too. Are you going to say something, or do I have to ask?\"" }
        secenekler:
          - id: "kaydet"
            etiket: { tr: "Kaydetmelerine izin ver", en: "Let them record you" }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: -1 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { saygi: 2 } }
            sonraki: "tepe_dinleyiciler_kayit"
          - id: "boz"
            tur: "gosteris"
            etiket: { tr: "Bütün radyoları tek bir düşünceyle sustur", en: "Silence every radio with a single thought" }
            gerekli: { stat: { int: 45 } }
            etkiler:
              - dikkat: 2
              - gizle: 2
              - ahlak: { duzen: -1 }
            sonraki: "tepe_dinleyiciler_sessiz"
          - id: "sor"
            etiket: { tr: "Spikere ne duyduklarını sor", en: "Ask the DJ what they've heard" }
            etkiler:
              - bilgi: "dinleyici_sayaci"
              - ahlak: { insanlik: 1 }
            sonraki: "tepe_dinleyiciler_sayac"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: konuşmak ister misin?", en: "Ask {npc:yanki}: do you want to talk to them?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
            sonraki: "tepe_dinleyiciler_yanki"
          - id: "cik"
            tur: "gizle"
            etiket: { tr: "Geri geri çık; cızırtı seninle gitsin", en: "Back out slow. Take the static with you" }
            etkiler:
              - gizle: 2
            sonraki: "@akis"

      - id: "tepe_dinleyiciler_kayit"
        yer: "tepe"
        paragraflar:
          - { tr: "Spiker bir mikrofonu sana doğru uzatıyor. Kayıt makarası dönmeye başlıyor ve cızırtı değişiyor: kısık, kırık, küçük harfli bir şeye dönüşüyor.", en: "The DJ holds a microphone out toward you. The tape reel starts to turn and the static changes. It goes thin, broken, into something small and lowercase." }
          - { tr: "Dinleyiciler kalemlerini kâğıda bastırıyor. Biri ağlamaya başlıyor; ne duyduğunu bilmiyor ama onu sevdiğini biliyor.", en: "The Listeners press their pencils to paper. One of them starts crying. She doesn't know what she's hearing, but she knows she loves it." }
          - { tr: "Spiker makarayı dikkatle kutusuna koyuyor. \"Bunu {npc:vahit} Efendi dinleyecek,\" diyor. \"Sonra belki herkes.\"", en: "The DJ packs the reel into its box very carefully. \"{npc:vahit|tam} will hear this,\" he says. \"And then maybe everybody.\"" }
        secenekler:
          - id: "ver"
            etiket: { tr: "Makarayı götürmelerine izin ver", en: "Let them take the reel" }
            etkiler:
              - bayrak: "tepe_kayit_alindi"
              - xp_seviye: 20
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "al"
            etiket: { tr: "Makarayı elinden al", en: "Take the reel out of his hands" }
            etkiler:
              - ahlak: { duzen: -2 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { guven: -2 }, yanki: { guven: 2 } }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "Bir kopyasını {npc:mert_kilic|e} gönder", en: "Send a copy to {npc:mert_kilic}" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - bayrak: "tepe_kayit_alindi"
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "tepe_dinleyiciler_sessiz"
        yer: "tepe"
        paragraflar:
          - { tr: "Tek bir düşünce; kendi sesini bastırmak, {npc:yanki|in} kenarlarını içeri çekmek. Radyolar bir bir susuyor ve gözlemevi, kubbenin gıcırtısı dışında, sessizliğe gömülüyor.", en: "One thought: pull your own noise in, fold the edges of the thing inside you back in. The radios die one by one, and the observatory sinks into silence except for the creak of the dome." }
          - { tr: "Spiker kulaklığını iki eliyle bastırıyor, sonra yavaşça çıkarıyor. \"Gitti,\" diyor, sesi kırık. \"Kırk gündür dinliyorum ve ilk kez sustu.\"", en: "The DJ presses his headphones to his ears with both hands, then slowly takes them off. \"It's gone,\" he says, and his voice cracks. \"Forty days I've been listening, and this is the first time it's ever gone quiet.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Sessizliği bırak ve çık; cızırtı geri gelsin", en: "Let go of the silence and walk out. Let it come back" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "inandir"
            etiket: { tr: "Onlara Sistem'in onları dinlemediğini söyle", en: "Tell them the System isn't listening back" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - itibar: { yukselenler: -2 }
              - iliski: { vahit: { guven: -2 } }
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"

      - id: "tepe_dinleyiciler_sayac"
        yer: "tepe"
        paragraflar:
          - { tr: "Spiker bir defter açıyor; sayfalar sayılarla dolu. \"Her gece aynı,\" diyor. \"Üç yüz altmış beşten geri sayıyor. Ama bazı geceler, kısa bir an, sıfırdan sonra yeniden üç yüz altmış beşi duyuyoruz.\"", en: "The DJ opens a notebook full of numbers. \"Same every night,\" he says. \"It counts down from three sixty-five. But some nights, just for a second, after zero we hear three sixty-five again.\"" }
          - { tr: "\"{npc:vahit} Efendi buna yeniden doğuş diyor,\" diye ekliyor. \"Ben kıyametten önce otuz yıl gece radyosu yaptım. Bana bant başa sarıyor gibi geliyor.\"", en: "\"{npc:vahit|tam} calls it rebirth,\" he adds. \"I did thirty years of late-night radio before the end of the world. Sounds to me like a tape rewinding.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Defterin bir sayfasını iste", en: "Ask for a page from the notebook" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 20
              - iliski: { vahit: { saygi: 1 } }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "Bunu {npc:mert_kilic|e} anlat", en: "Tell {npc:mert_kilic} about this" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - itibar: { sessiz_ag: 3 }
              - iliski: { mert_kilic: { guven: 2 } }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "tepe_dinleyiciler_yanki"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Radyoların cızırtısı inip çıkıyor, sanki o da düşünüyor.", en: "{npc:yanki} stays quiet for a long time. The radios' static rises and falls, like it's thinking too." }
          - { tr: "{npc:yanki} fısıldıyor: henüz değil. beni duyarlarsa seni de duyarlar. sorduğun için teşekkür ederim. kimse bana sormamıştı.", en: "{npc:yanki} whispers: not yet. if they hear me, they hear you. thanks for asking. nobody's ever asked me before." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sessizce gözlemevinden çık", en: "Leave the observatory quietly" }
            etkiler:
              - iliski: { yanki: { guven: 2, baglilik: 2 } }
              - gizle: 1
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "israr"
            etiket: { tr: "Israr et: \"Bir kelime. Yalnızca bir.\"", en: "Push it. \"One word. Just one.\"" }
            etkiler:
              - iliski: { yanki: { guven: -2 } }
              - dikkat: 2
              - xp_seviye: 15
            sonraki: "tepe_dinleyiciler_kayit"

  # ================================================================== YAKIT DUVARI (Tepe; Deniz'in akıbetini okur)
  - id: "tepe_yakit_duvari"
    perde: [2]
    bolge: ["tepe"]
    gun: { min: 34, max: 175 }
    kosul: { bayrak: "perde2_basladi" }
    agirlik: 4
    etiketler: ["tepe", "yukselenler", "anma", "deniz"]
    gerilim: 2
    kart: { tr: "Yandı, ışık verdi", en: "Burned, and gave light" }
    sahne: "tepe_yakit_duvari_1"
    sahneler:
      - id: "tepe_yakit_duvari_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepe'ye çıkan yolun dibindeki istinat duvarı baştan sona isimlerle boyanmış: Öğretici Katman'da ölenlerin isimleri. Her ismin altında aynı üç kelime var: Yandı, ışık verdi.", en: "The retaining wall at the bottom of the road up to the Heights is painted end to end with names: the people who died in the Tutorial Layer. Under every name, the same four words: Burned, and gave light." }
          - { tr: "Yükselenler duvarın önüne mumlar diziyor. Bir kadın, yeni boyanmış bir ismin önünde dua eder gibi duruyor; ama dudakları dua etmiyor, küfrediyor.", en: "The Ascended keep candles lined up in front of the wall. A woman stands before a freshly painted name like she's praying, except her lips aren't praying. They're cursing." }
          - metin: { tr: "Duvarın tam ortasında, altın boyayla ve herkesinkinden büyük harflerle bir isim yazılı: {npc:deniz_arman|tam}. Altında üç kelime değil, beş: Anomali için yandı, en çok ışık verdi.", en: "Dead center on the wall, in gold paint and bigger letters than anybody else's, is one name: {npc:deniz_arman|tam}. Under it, not four words but seven: Burned for the anomaly. Gave the most light." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Duvarın önünde, iskelenin üstünde, beyaz giysili biri yeni bir ismi boyuyor. Fırçayı tutuş biçimini tanıyorsun; sonra omuzlarını, sonra sesini. {npc:deniz_arman}.", en: "Up on a scaffold in front of the wall, somebody in white is painting a new name. You know the way they hold that brush. Then the shoulders. Then the voice. {npc:deniz_arman}." }
            kosul: { bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "{npc:deniz_arman} duvarın önünde durmuş, isimleri tek tek okuyor; parmağı her satırda biraz duruyor. Bir ismi arıyor ve bulamamak istiyor.", en: "{npc:deniz_arman} stands at the wall reading the names one by one, a finger pausing on every line. Looking for one name, and hoping not to find it." }
            kosul: { yoldas: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Boyanın altında daha eski bir yazı var: aynı isimler, ama altlarında başka bir cümle. Biri onu kazıyıp üstünü boyamış.", en: "[PER] There's older writing under the paint: the same names, but with a different line under each one. Somebody scraped it off and painted over it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yandı, ışık verdi. hayır. öldü. sadece öldü. ışık başka bir yere gitti. nereye gittiğini biliyorum ama bunu sevmeyeceksin.", en: "burned, and gave light. no. they died. they just died. the light went somewhere else. i know where. you won't like it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "kardes_izi_bulundu" }
            metin: { tr: "\"Burada değil. Burada değil, değil mi? Bir kez daha bak. Lütfen.\"", en: "\"She's not here. She's not here, right? Look one more time. Please.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu isimlerin yarısını ben kapattım; gözlerini. Hiçbiri ışık vermedi. Hepsi annesini istedi.\"", en: "\"I closed the eyes on half these names. None of them gave light. Every one of them wanted their mom.\"" }
        secenekler:
          - id: "kazi"
            etiket: { tr: "Boyayı kazı; altındaki cümleyi oku", en: "Scrape the paint. Read what's underneath" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - itibar: { yukselenler: -1 }
            sonraki: "tepe_yakit_duvari_alti"
          - id: "boya"
            etiket: { tr: "Bir fırça al; \"Yakıt\" kelimelerinin üstünü çiz", en: "Grab a brush. Paint over every \"burned\"" }
            etkiler:
              - gun: 1
              - ahlak: { insanlik: 4, duzen: -2 }
              - itibar: { yukselenler: -4, siginak: 2 }
              - iliski: { vahit: { guven: -2 } }
              - bayrak: "tepe_duvar_boyandi"
              - xp_seviye: 20
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "tepe_yakit_duvari_boya"
          - id: "deniz_sil"
            etiket: { tr: "Altın ismi duvardan kazı", en: "Scrape the gold name off the wall" }
            goster: { npc_olu: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { saygi: 1, guven: -2 } }
              - bayrak: "tepe_deniz_adi_silindi"
            sonraki: "tepe_yakit_duvari_deniz_olu"
          - id: "deniz_konus"
            etiket: { tr: "İskelenin dibine git ve {npc:deniz_arman|e} seslen", en: "Walk up to the scaffold and call up to {npc:deniz_arman}" }
            goster: { bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "tepe_yakit_duvari_deniz_beyaz"
          - id: "deniz_yanina"
            etiket: { tr: "{npc:deniz_arman|in} yanına git; birlikte oku", en: "Go stand with {npc:deniz_arman}. Read it together" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, baglilik: 3 } }
              - ahlak: { merhamet: 2 }
            sonraki: "tepe_yakit_duvari_deniz_yoldas"
          - id: "mum"
            etiket: { tr: "Bir mum yak ve sessizce git", en: "Light a candle and leave quietly" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - itibar: { yukselenler: 1 }
            sonraki: "@akis"

      - id: "tepe_yakit_duvari_alti"
        yer: "tepe"
        paragraflar:
          - { tr: "Tırnağınla boyayı kazıyorsun. Altından tebeşirle yazılmış, aceleyle, titreyen bir el: Seni bulamadık. Affet.", en: "You scrape at the paint with your thumbnail. Underneath, in chalk, rushed, a shaky hand: We couldn't find you. Forgive us." }
          - { tr: "Bir isim daha kazıyorsun, bir tane daha. Hepsinin altında aynı şey: biri çocuğuna, biri kocasına, biri tanımadığı birine. Yükselenler bunların hepsini \"ışık\" diye boyamış.", en: "You scrape another name, and another. Same thing under all of them. Somebody's kid, somebody's husband, somebody's stranger. The Ascended painted over every one of them with \"light.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Kazıdığın yerleri açık bırak", en: "Leave the scraped spots bare" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "tepe_duvar_kazindi"
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "hepsi"
            etiket: { tr: "Bütün gece kazı; hepsi okunsun", en: "Scrape all night. Let every one be read" }
            etkiler:
              - gun: 1
              - ahlak: { insanlik: 4, duzen: -2 }
              - itibar: { yukselenler: -4, siginak: 3 }
              - iliski: { vahit: { guven: -3, saygi: 1 } }
              - bayrak: "tepe_duvar_kazindi"
              - xp_seviye: 25
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"

      - id: "tepe_yakit_duvari_boya"
        yer: "tepe"
        paragraflar:
          - { tr: "Sabaha kadar boyuyorsun. Her \"Yandı, ışık verdi\"nin üstüne tek bir kelime yazıyorsun: Özlendi.", en: "You paint until morning. Over every \"Burned, and gave light,\" you write one word: Missed." }
          - { tr: "Şafakta iki Yükselen geliyor; duvara, sonra sana, sonra başının üstündeki sayıya bakıyorlar. Hiçbiri bir şey demiyor. Akşama kadar duvarın önüne bırakılan mumların sayısı ikiye katlanıyor.", en: "At dawn two of the Ascended show up. They look at the wall, then at you, then at the number over your head. Neither one says a word. By evening the number of candles at the wall has doubled." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Fırçayı duvarın dibine bırak", en: "Leave the brush at the foot of the wall" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
            sonraki: "@akis"

      - id: "tepe_yakit_duvari_deniz_olu"
        yer: "tepe"
        paragraflar:
          - { tr: "Altın boya kolay kazınmıyor. Tırnakların kırılıyor, parmak uçların kanıyor; harf harf, {npc:deniz_arman|in} adını Yükselenler'in duvarından söküyorsun.", en: "Gold paint doesn't scrape off easy. Your nails split, your fingertips bleed, and letter by letter you tear {npc:deniz_arman|pos} name off the Ascended's wall." }
          - { tr: "Mumları diken yaşlı bir Yükselen seni izliyor. \"Anomali için yandı,\" diyor yumuşak bir sesle. \"Senin için. Bu bir onur.\"", en: "An old Ascended setting out candles watches you work. \"They burned for the anomaly,\" he says softly. \"For you. It's an honor.\"" }
          - { tr: "\"Benim için öldü,\" diyorsun. \"Bu bir onur değil. Bu bir borç.\"", en: "\"They died for me,\" you say. \"That's not an honor. That's a debt.\"" }
        secenekler:
          - id: "tebesir"
            etiket: { tr: "Yerine tebeşirle kendi cümleni yaz", en: "Chalk your own line where it was" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - xp_seviye: 20
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 7 } }
            sonraki: "@akis"
          - id: "bos"
            etiket: { tr: "Yeri boş bırak", en: "Leave the space empty" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 20
            sonraki: "@akis"

      - id: "tepe_yakit_duvari_deniz_beyaz"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} fırçayı indiriyor ve iskelenin üstünden sana bakıyor. Beyaz giysi ona yakışmıyor; bunu ikiniz de biliyorsunuz.", en: "{npc:deniz_arman} lowers the brush and looks down at you from the scaffold. The white doesn't suit them. You both know it." }
          - { tr: "\"Her gün on isim,\" diyor. \"Her birini boyarken kardeşimin adını yazmamak için dua ediyorum. Burada en azından dua edecek biri var.\"", en: "\"Ten names a day,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Every one I paint, I pray it's not my sister's. At least up here there's somebody to pray to.\"" }
          - { tr: "Fırçayı yeniden boyaya batırıyor. \"Gitmen gerek,\" diyor, ama sesi gitmeni istemiyor.", en: "They dip the brush in the paint again. \"You should go,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, but the voice doesn't want you to." }
        secenekler:
          - id: "otur"
            etiket: { tr: "İskelenin dibine otur; bir isim boyayana kadar kal", en: "Sit at the foot of the scaffold. Stay for one name" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
              - ahlak: { merhamet: 2 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "dua"
            etiket: { tr: "\"Kime dua ettiğini biliyor musun?\" diye sor", en: "Ask, \"Do you know who you're praying to?\"" }
            etkiler:
              - iliski: { deniz_arman: { saygi: 2, guven: -1 } }
              - ahlak: { insanlik: 2 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "tepe_yakit_duvari_deniz_yoldas"
        yer: "tepe"
        paragraflar:
          - { tr: "Yan yana duvarı okuyorsunuz; harf harf, satır satır. Bir yerde {npc:deniz_arman} duruyor, nefesini tutuyor; isim tutmuyor, soyadı başka. Nefes geri geliyor.", en: "You read the wall side by side, letter by letter, line by line. At one point {npc:deniz_arman} stops and holds their breath. Wrong name. The last name's different. The breath comes back." }
          - { tr: "Duvarın sonuna geldiğinizde {npc:deniz_arman} gülüyor; yorgun, çatlak bir gülüş. \"Burada değil,\" diyor. \"Bir yerde hâlâ yanmıyor.\"", en: "When you reach the end of the wall, {npc:deniz_arman} laughs, a tired, cracked laugh. \"She's not here,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Somewhere, she's still not burning.\"" }
        secenekler:
          - id: "sar"
            etiket: { tr: "Omzuna bir kol at", en: "Put an arm around their shoulders" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, baglilik: 3 } }
              - ahlak: { merhamet: 2 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "soz"
            etiket: { tr: "\"Onu bulacağız\" de", en: "Say, \"We'll find her\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, saygi: 1 } }
              - ahlak: { merhamet: 1, insanlik: 1 }
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"

  # ================================================================== AVCI PAZARI (Kule Dibi, keşif)
  - id: "kule_dibi_avci_pazari"
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 41, max: 178 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 6
    etiketler: ["kule", "pazar", "hakimiyet", "kesif"]
    gerilim: 1
    kart: { tr: "Kule'nin gölgesinde pazar", en: "Market in the Spire's shadow" }
    sahne: "kule_dibi_avci_pazari_1"
    sahneler:
      - id: "kule_dibi_avci_pazari_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin dibindeki meydan bir haftada pazara dönmüş. Tezgâhlar Kule'nin kendisi kadar eski görünüyor ama hepsi yeni: kat haritaları, çekirdek kristali takası, \"ilk beş kat garantili\" muskaları.", en: "In a week, the plaza at the foot of the Spire turned into a market. The stalls look as old as the Spire itself, but every one is new: floor maps, core crystal exchange, \"first five floors guaranteed\" charms." }
          - { tr: "Kule'nin karanlık gövdesi tepende, bulutlara kadar. Kapısından her saat bir grup girip daha küçük bir grup çıkıyor.", en: "The Spire's black body runs up over your head, all the way into the clouds. Every hour a group goes in through its door, and a smaller group comes out." }
          - metin: { tr: "Meydanın girişinde Lonca'nın gişesi var: Çekirdek'ten beslenen bir pencere her tezgâhtan payını kendiliğinden kesiyor.", en: "There's a Guild booth at the plaza entrance. A window fed by the Core skims every stall's cut automatically." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Meydanın bir köşesinde Konsey'in beyaz çadırı var; Kule'den yaralı inenlere ücretsiz sargı. Kuyruk, pazarın en uzun kuyruğu.", en: "In one corner of the plaza there's a white Council tent handing out free bandages to whoever comes down off the Spire hurt. Its line is the longest line in the market." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Yükselenler her tezgâhın önünde vaaz veriyor: Kule Sistem'in merdivenidir, tırmanan kutsanır, düşen yakıt olur.", en: "The Ascended preach in front of every stall. The Spire is the System's staircase. Whoever climbs is blessed. Whoever falls is fuel." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Tezgâhların arasında kulaklıklı gençler dolaşıyor, avcılardan kat bilgisi satın alıyor. Sessiz Ağ Kule'nin haritasını parça parça topluyor.", en: "Kids in headphones drift between the stalls, buying floor intel off hunters. The Quiet Network is putting together a map of the Spire, one scrap at a time." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Bir harita satıcısı seni görünce susuyor ve yanındakini dürtüyor: \"Onuncu katı geçen bu.\" Pazarın bir köşesi seni izlemeye başlıyor.", en: "A map seller sees you and shuts up mid-pitch, elbowing the guy next to him. \"That's the one who cleared Floor 10.\" A whole corner of the market starts watching you." }
            kosul: { degisken_min: { kule_kat: 10 } }
          - { tr: "Bir tezgâhta yaşlıca bir adam on beş yaşında üç çocuğa \"beşinci kata kadar kesin güvenli rota\" satıyor. Haritanın mürekkebi daha kurumamış.", en: "At one stall, an older guy is selling three fifteen-year-olds a \"guaranteed safe route to Floor 5.\" The ink on the map isn't even dry yet." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "[ALG] Haritadaki üçüncü kat koridoru, Kule'nin dışından görülen pencere sırasıyla tutmuyor. Bu haritayı çizen içeri hiç girmemiş.", en: "[PER] The third-floor hallway on that map doesn't line up with the window rows you can see from outside. Whoever drew it never went in." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule kendi haritasını her gece değiştiriyor. satıcı bunu bilmiyor. kule biliyor. ben de.", en: "the spire redraws its own map every night. the seller doesn't know that. the spire does. so do i." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu tezgâhların yarısı sahte, öbür yarısı da sahte olduğunu bilmiyor. Pazar dediğin bu.\"", en: "\"Half these stalls are fake, and the other half don't know they're fake. That's a market for you.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"On beş yaşında, beşinci kat. Biz on beşindeyken sınav kaygısı yaşıyorduk.\"", en: "\"Fifteen, and Floor 5. When we were fifteen, we were stressing over midterms.\"" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Haritanın sahte olduğunu çocuklara göster", en: "Show the kids the map is fake" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bilgi: "sahte_kat_haritalari"
            sonraki: "kule_dibi_avci_pazari_ifsa"
          - id: "ezber"
            tur: "gosteris"
            etiket: { tr: "Çocuklara gerçek rotayı ezberden çiz", en: "Draw the kids the real route from memory" }
            gerekli: { degisken_min: { kule_kat: 10 } }
            etkiler:
              - dikkat: 1
              - ahlak: { merhamet: 3 }
              - itibar: { lonca: 1, sessiz_ag: 2 }
            sonraki: "kule_dibi_avci_pazari_ezber"
          - id: "al"
            etiket: { tr: "Bir harita al; ne olur ne olmaz", en: "Buy a map. Just in case" }
            etkiler:
              - kredi: -15
              - esya: { sahte_kat_haritasi: 1 }
            sonraki: "kule_dibi_avci_pazari_dolas"
          - id: "merhem"
            etiket: { tr: "Konsey çadırından Kule merhemi iste", en: "Ask the Council tent for Spire salve" }
            goster: { bayrak: "cekirdek_siginak" }
            etkiler:
              - esya: { kule_merhemi: 1 }
              - itibar: { siginak: 1 }
              - iliski: { elif_sari: { guven: 1 } }
            sonraki: "kule_dibi_avci_pazari_dolas"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Kalabalığa karış ve pazarı dolaş", en: "Melt into the crowd and browse" }
            etkiler:
              - gizle: 2
            sonraki: "kule_dibi_avci_pazari_dolas"

      - id: "kule_dibi_avci_pazari_ifsa"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haritayı çocukların elinden alıp Kule'ye doğru tutuyorsun. \"Üçüncü katta bu koridor yok,\" diyorsun. \"Pencerelere bakın: duvar var. Bu haritayla gidersen bir duvara koşarsın, arkandan gelen ne varsa ona yakalanırsın.\"", en: "You take the map out of the kids' hands and hold it up against the Spire. \"There's no hallway on Floor 3,\" you say. \"Look at the windows. That's a wall. Run this route and you run into a wall, with whatever's behind you catching up.\"" }
          - { tr: "Satıcı kızarıyor. \"Sen kimsin de—\" diye başlıyor, sonra başının üstündeki sayıya bakıp cümleyi değiştiriyor: \"—bunu bana söylüyorsun.\"", en: "The seller goes red. \"Who the hell are you to—\" he starts, then checks the number over your head and changes the sentence. \"—be telling me this.\"" }
        secenekler:
          - id: "iade"
            etiket: { tr: "Çocukların parasını geri verdir", en: "Make him refund the kids" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - xp_seviye: 15
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"
          - id: "tezgah"
            etiket: { tr: "Tezgâhı kapattır; pazarın önünde", en: "Shut his stall down, in front of the whole market" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "kule_dibi_avci_pazari_ezber"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir tezgâhın arka yüzüne kömürle çizmeye başlıyorsun: birinci kattan beşinciye, her köşe, her tuzak, her merdiven boşluğu. Etrafında bir kalabalık birikiyor.", en: "You start sketching in charcoal on the back of a stall: Floor 1 to Floor 5, every corner, every trap, every stairwell. A crowd builds up around you." }
          - { tr: "Bitirdiğinde harita satıcısı bile kendi defterine kopyalıyor. Çocuklardan biri sana kim olduğunu soruyor; cevap vermeden kömürü ona uzatıyorsun.", en: "By the time you finish, even the map seller is copying it into his notebook. One of the kids asks who you are. You hand him the charcoal instead of an answer." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "Bilgi paylaşıldı", en: "Information shared" }
            satirlar:
              - { tr: "Kule bu davranışı not etti. Kule, Sistem'e bunu bildirmedi.", en: "The Spire has noted this behavior. The Spire did not report it to the System." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalabalıktan sıyrıl ve yürü", en: "Slip out of the crowd and walk" }
            etkiler:
              - xp_seviye: 20
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 4, max: 8 } }
            sonraki: "@akis"

      - id: "kule_dibi_avci_pazari_dolas"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın içinde dolaşıyorsun. Bir tezgâhta çekirdek kristali tartılıyor, bir başkasında Kule'nin üçüncü katından çıkmış diye kırık bir kask satılıyor; on kredi, içinde birinin saçı hâlâ var.", en: "You wander the market. At one stall they're weighing core crystals. At another they're selling a cracked helmet that supposedly came off Floor 3. Ten credits, and there's still somebody's hair inside." }
          - { tr: "Pazarın sonunda bir duvar var, Kule'nin taşına yaslanmış: tebeşirle yazılmış isimler. Altında bir başlık: Geri dönmeyenler.", en: "At the end of the market there's a wall leaning against the Spire's stone, covered in chalked names. Above them, a heading: The Unreturned." }
        secenekler:
          - id: "kask"
            etiket: { tr: "Kaskı satın al ve sahibini bulmaya çalış", en: "Buy the helmet. Try to find its owner" }
            etkiler:
              - kredi: -10
              - ahlak: { merhamet: 2, insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
              - bayrak: "kuledibi_kask_alindi"
            sonraki: "@akis"
          - id: "devam"
            etiket: { tr: "Duvara bir bakış at ve yoluna devam et", en: "Glance at the wall and keep going" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== TIRMANIŞ KUYRUĞU (Kule Dibi, önemli)
  - id: "kule_dibi_tirmanis_kuyrugu"
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 42, max: 178 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kule", "ahlak", "kurtarma"]
    gerilim: 3
    onemli: true
    kart: { tr: "Beşinci kata bilet", en: "A ticket to Floor 5" }
    sahne: "kule_dibi_tirmanis_kuyrugu_1"
    sahneler:
      - id: "kule_dibi_tirmanis_kuyrugu_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısında bir kuyruk var, meydanın yarısına kadar. Kapıda iki Lonca bekçisi duruyor ve kat başına yirmi kredi alıyor; parası olmayan sırayı başkasına satıyor.", en: "There's a line at the Spire's door stretching halfway across the plaza. Two Guild gatekeepers stand at the door charging twenty credits a floor. Whoever can't pay sells their spot to somebody who can." }
          - { tr: "Kuyruğun ortasında on altı yaşlarında bir oğlan paslı bir kılıç tutuyor. Elindeki kâğıtta bir hekimin el yazısı: Akciğer çürümesi. Beşinci kat kristaliyle yapılan ilaç. Fiyat: dört kristal.", en: "In the middle of the line, a boy about sixteen is holding a rusty sword. The paper in his other hand is in a doctor's handwriting: Lung rot. Medicine made from Floor 5 crystals. Price: four crystals." }
          - { tr: "Seviyesi 6. Beşinci katta 6'nın ne kadar yaşadığını Kule Dibi'nde herkes biliyor; çocuğun kendisi hariç.", en: "He's Level 6. Everybody at Spire Plaza knows how long a Level 6 lasts on Floor 5. Everybody except him." }
          - metin: { tr: "Kasaba Çekirdeği Lonca'da ve kapının üstündeki pencere her girenin seviyesini, ödediği krediyi ve dönme ihtimalini yazıyor. Oğlanın satırında bir yüzde var: %11.", en: "The Town Core belongs to the Guild, and the window over the door lists everybody going in: level, credits paid, odds of coming back. There's a percentage on the boy's line: 11%." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Lonca halkasını görünce bekçiler seni kuyruğun dışından, doğrudan kapıya çağırıyor.", en: "The gatekeepers spot your Guild ring and wave you straight up to the door, past the whole line." }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "[BİL] Oğlan öksürüğünü bastırıyor. Hasta olan yalnızca annesi değil; o da başlamış.", en: "[WIS] The boy's swallowing a cough. It isn't just his mom who's sick. He's started too." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yüzde on bir. sistem ona söylemiyor. ben sana söylüyorum. sen ne yapacaksın?", en: "eleven percent. the system isn't telling him. i'm telling you. what are you going to do?" }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Akciğer çürümesi. Kristal ilacı işe yarar, ama oğlan kendisi de öksürüyor. Ona da bakmam gerek.\"", en: "\"Lung rot. The crystal medicine works, but the kid's coughing too. I need to look at him as well.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Annesi için gidiyor. Ben kardeşim için giderdim. Onu yalnız bırakma.\"", en: "\"He's going for his mom. I'd go for my sister. Don't let him go alone.\"" }
        secenekler:
          - id: "eslik"
            etiket: { tr: "Ücretini öde ve onunla birlikte çık", en: "Pay his fee and climb with him" }
            etkiler:
              - kredi: -100
              - ahlak: { merhamet: 5, insanlik: 1 }
            kronik: { tr: "Annesine ilaç arayan on altı yaşında bir oğlanla birlikte Kule'ye tırmandın.", en: "You climbed the Spire with a sixteen-year-old looking for his mother's medicine." }
            sonraki: "kule_dibi_tirmanis_kuyrugu_kule"
          - id: "kendin"
            tur: "gosteris"
            etiket: { tr: "Oğlanı bekleme; dört kristali sen getir", en: "Tell him to wait. You bring back four crystals" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 4, duzen: -1 }
            kronik: { tr: "Bir oğlanı kuyrukta bekletip beşinci kattan annesinin ilacını kendin getirdin.", en: "You had a boy wait in line while you brought his mother's medicine down from Floor 5 yourself." }
            sonraki: "kule_dibi_tirmanis_kuyrugu_kendin"
          - id: "ode"
            etiket: { tr: "Ücretini öde; kendi yolunu kendisi bulsun", en: "Pay his fee. Let him find his own way" }
            etkiler:
              - kredi: -100
              - ahlak: { merhamet: 1, duzen: 2 }
              - bayrak: "kuledibi_genc_tek"
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir oğlanın Kule'ye giriş ücretini ödedin ve kapıdan yalnız girmesine izin verdin.", en: "You paid a boy's way into the Spire and let him walk through the door alone." }
            sonraki: "@akis"
          - id: "eve"
            etiket: { tr: "Kılıcını elinden al; eve gönder", en: "Take his sword. Send him home" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - bayrak: "kuledibi_genc_eve"
            kronik: { tr: "Kule'nin kapısından on altı yaşında bir oğlanı kılıcını alarak geri çevirdin.", en: "You turned a sixteen-year-old away from the Spire's door by taking his sword." }
            sonraki: "kule_dibi_tirmanis_kuyrugu_eve"
          - id: "bekci"
            etiket: { tr: "Bekçilere dön: \"Çocuklardan ücret yok\"", en: "Turn on the gatekeepers. \"No fees for kids\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
              - itibar: { lonca: -3, siginak: 2 }
            kronik: { tr: "Kule'nin kapısında Lonca bekçilerine çocuklardan ücret alınmayacağını söyledin.", en: "At the Spire's door, you told the Guild gatekeepers that kids don't pay." }
            sonraki: "kule_dibi_tirmanis_kuyrugu_bekci"

      - id: "kule_dibi_tirmanis_kuyrugu_kule"
        yer: "kule"
        paragraflar:
          - { tr: "İlk dört kat kolay geçiyor; senin için. Oğlan her köşede kılıcını iki eliyle kaldırıyor ve her köşede onun yerine sen vuruyorsun.", en: "The first four floors go easy. For you. The boy raises his sword two-handed at every corner, and at every corner you're the one who swings." }
          - { tr: "Beşinci katın kristal odasında bir şey bekliyor: Kule'nin taşından kopmuş, kristalleri gövdesine gömmüş bir kırıntı yığını. Oğlan geri adım atıyor; bu kez kılıcını kaldırmıyor bile.", en: "Something's waiting in the crystal room on Floor 5: a pile of rubble broken off the Spire's own stone, crystals sunk into its body. The boy takes a step back. This time he doesn't even raise his sword." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Oğlanı arkana al ve kırıntının karşısına geç", en: "Put the boy behind you and face the rubble" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kule_kirintisi@dunya+10"], ortam: ["tavan"], kazan: "kule_dibi_tirmanis_kuyrugu_zafer", kaybet: "kule_dibi_tirmanis_kuyrugu_yenilgi", kac: "kule_dibi_tirmanis_kuyrugu_yenilgi" }
            kronik: { tr: "Beşinci katın kristal odasında bir oğlanı arkana alıp savaştın.", en: "In Floor 5's crystal room, you put a boy behind you and fought." }
          - id: "ogret"
            etiket: { tr: "Oğlana nereye vuracağını göster; kendisi vursun", en: "Show the boy where to hit. Let him land it" }
            gerekli: { stat: { wis: 40 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "kuledibi_genc_vurdu"
              - savas: { dusmanlar: ["kule_kirintisi@dunya"], ortam: ["tavan"], kazan: "kule_dibi_tirmanis_kuyrugu_zafer", kaybet: "kule_dibi_tirmanis_kuyrugu_yenilgi", kac: "kule_dibi_tirmanis_kuyrugu_yenilgi" }
            kronik: { tr: "Beşinci katta bir oğlana son darbeyi kendisinin vurmasını öğrettin.", en: "On Floor 5, you taught a boy how to land the last hit himself." }

      - id: "kule_dibi_tirmanis_kuyrugu_zafer"
        yer: "kule"
        paragraflar:
          - metin: { tr: "Kırıntı yığını bir nefeste dağılıyor. Kristaller taş tozunun içinde parlıyor; oğlan dizlerinin üstüne çöküp onları avuçluyor.", en: "The rubble pile comes apart in one breath. The crystals glitter in the stone dust, and the boy drops to his knees and scoops them up." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Oğlanın paslı kılıcı son darbede kırıntının çatlağına giriyor ve yığın çöküyor. Bir pencere açılıyor önünde; ağlıyor ve bunu saklamıyor.", en: "On the last hit, the boy's rusty sword finds the crack and the pile collapses. A window opens in front of him. He's crying and doesn't care who sees." }
            kosul: { bayrak: "kuledibi_genc_vurdu" }
          - { tr: "Dört kristal. Beşinci bulduğunda oğlan onu sana uzatıyor. \"Bu senin,\" diyor. \"Annemin ilacının dört kristal olduğunu biliyordun, değil mi? Beşinciyi bana bırakmak için saydın.\"", en: "Four crystals. When he finds a fifth, he holds it out to you. \"This one's yours,\" he says. \"You knew Mom's medicine was four, right? You counted so you could leave me the fifth.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Beşinciyi ona bırak; kendi ilacı için", en: "Leave him the fifth. For his own medicine" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak: "kuledibi_genc_eslik"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Beşinci kattan bir oğlanı annesinin ilacıyla ve kendi ilacıyla indirdin.", en: "You brought a boy down from Floor 5 with his mother's medicine, and his own." }
            sonraki: "@akis"
          - id: "ucret"
            etiket: { tr: "Beşinciyi al; ücretin karşılığı", en: "Take the fifth. That covers the fee" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - esya: { canavar_cekirdegi: 1 }
              - bayrak: "kuledibi_genc_eslik"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 50
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir oğlanı beşinci kattan sağ indirdin ve ücretini bir kristalle aldın.", en: "You got a boy down from Floor 5 alive and took your fee in crystal." }
            sonraki: "@akis"

      - id: "kule_dibi_tirmanis_kuyrugu_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Tavandan bir taş bloğu iniyor ve seni duvara çiviliyor. Son gördüğün, kristal odasının kapısına koşan oğlan; kaçmıyor, yardım çağırıyor.", en: "A stone block comes down from the ceiling and pins you to the wall. The last thing you see is the boy running for the crystal room's door. He isn't running away. He's going for help." }
          - { tr: "Kendine geldiğinde üçüncü kattaki bir ekip seni aşağı taşıyor. Oğlan yanında; elinde iki kristal, ikisini de kırıntı yığınının dibinden, sen yerdeyken toplamış.", en: "When you come to, a crew from Floor 3 is carrying you down. The boy's beside you with two crystals in his hand. He picked them out from under the rubble pile while you were down." }
        secenekler:
          - id: "tamamla"
            etiket: { tr: "Eksik iki kristali kendi cebinden tamamla", en: "Cover the two missing crystals out of your own pocket" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - kredi: -60
              - bayrak: "kuledibi_genc_eslik"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 20
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kule'de yenildin, ama bir annenin ilacındaki eksik kristalleri kendi cebinden ödedin.", en: "You lost in the Spire, but you paid for the missing crystals in a mother's medicine out of your own pocket." }
            sonraki: "@akis"
          - id: "yarin"
            etiket: { tr: "\"Yarın yine çıkacağız\" de", en: "Say, \"We go back up tomorrow\"" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - bayrak: "kuledibi_genc_eslik"
              - xp_seviye: 20
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Yenildiğin gün bir oğlana ertesi gün yine birlikte tırmanacağınızı söyledin.", en: "The day you lost, you told a boy you'd climb again together tomorrow." }
            sonraki: "@akis"

      - id: "kule_dibi_tirmanis_kuyrugu_kendin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kuyruğun yanından geçip kapıdan giriyorsun; bekçiler daha ücreti söyleyemeden. Yirmi dakika sonra çıkıyorsun, avucunda dört kristal, ceketinde taş tozu.", en: "You walk right past the line and through the door before the gatekeepers can even name the fee. Twenty minutes later you walk back out with four crystals in your palm and stone dust on your jacket." }
          - { tr: "Kristalleri oğlanın avucuna bırakıyorsun. Kuyruk susuyor. Oğlan sana bakıyor, sonra kılıcına, sonra yine sana; bir şey öğreniyor ve bunun ne olduğunu henüz bilmiyor.", en: "You drop the crystals into the boy's hand. The line goes quiet. The boy looks at you, then at his sword, then back at you. He's learning something and doesn't know what it is yet." }
        secenekler:
          - id: "kilic"
            etiket: { tr: "Kılıcını da al; artık gerek yok", en: "Take his sword too. He won't need it" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "kuledibi_kristal_getirildi"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 40
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir oğlanın annesinin ilacını getirdin ve kılıcını da elinden aldın.", en: "You brought a boy his mother's medicine and took his sword away too." }
            sonraki: "@akis"
          - id: "kuyruk"
            etiket: { tr: "Kuyruğa dön: \"Başka kimin kaç kristale ihtiyacı var?\"", en: "Turn to the line. \"Who else needs how many?\"" }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 5, duzen: -2 }
              - itibar: { lonca: -3, siginak: 4 }
              - dikkat: 3
              - bayrak: "kuledibi_kristal_getirildi"
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 60
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            kronik: { tr: "Bir gün boyunca Kule'nin kuyruğundaki herkes için kristal taşıdın; Lonca'nın bekçileri o gün tek kredi kazanamadı.", en: "For a whole day you hauled crystals down for everyone in the Spire line. The Guild's gatekeepers didn't make a single credit." }
            sonraki: "@akis"

      - id: "kule_dibi_tirmanis_kuyrugu_eve"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kılıcı elinden alıyorsun. Oğlan direnmiyor; kâğıdı göğsüne bastırıyor. \"Annem ne olacak?\" diye soruyor, sesi kırılarak.", en: "You take the sword out of his hand. He doesn't fight it. He presses the paper against his chest. \"What about my mom?\" he asks, voice cracking." }
          - { tr: "Kuyruk ona bakıyor, sonra sana. Kimse bir şey söylemiyor; Kule'nin kapısı herkesi yutmaya devam ediyor.", en: "The line looks at him, then at you. Nobody says anything. The Spire's door keeps swallowing everybody else." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onu ve annesini {fraksiyon:siginak|e} götür", en: "Take him and his mom to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 20
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kule'den geri çevirdiğin oğlanı ve annesini Sığınak'ın hekimlerine götürdün.", en: "You took the boy you turned away from the Spire, and his mother, to the Haven's doctors." }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kılıcı bekçilere bırak ve yürü", en: "Leave the sword with the gatekeepers and walk" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - degisken: { hayatta_kalan: -1 }
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Bir oğlanı Kule'den çevirdin ve annesinin ne olacağını sormadın.", en: "You turned a boy away from the Spire and never asked what happened to his mother." }
            sonraki: "@akis"

      - id: "kule_dibi_tirmanis_kuyrugu_bekci"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçilerden büyüğü güler gibi oluyor, sonra başının üstündeki sayıya bakıyor. \"Lonca'nın kapısı bu,\" diyor. \"Kural koymak istiyorsan önce kapının sahibi ol.\"", en: "The bigger gatekeeper almost laughs, then checks the number over your head. \"This is the Guild's door,\" he says. \"You want to make rules, own the door first.\"" }
          - metin: { tr: "Görünen sayın ona cesaret veriyor. Gerçeğini bilseydi kapıyı sana anahtarıyla birlikte verirdi.", en: "Your public number's giving him nerve. If he knew the real one, he'd hand you the door and the key with it." }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni aç; kapının sahibi kim, görsün", en: "Open your true level. Show him who owns the door" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -1, merhamet: 3 }
              - itibar: { lonca: 1, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - bayrak: "kuledibi_cocuk_ucretsiz"
              - xp_seviye: 30
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kule'nin kapısında gerçek seviyeni açtın; o günden sonra çocuklardan ücret alınmadı.", en: "You opened your true level at the Spire's door. After that day, no kid paid to go in." }
            sonraki: "@akis"
          - id: "kaya"
            etiket: { tr: "Bunu {npc:kaya_demir|e} götüreceğini söyle", en: "Say you're taking this to {npc:kaya_demir}" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: 2, guven: 1 } }
              - bayrak: "kuledibi_genc_tek"
              - xp_seviye: 20
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 4, max: 8 } }
            kronik: { tr: "Kule'nin kapısındaki ücretleri Lonca'nın başına şikâyet ettin; oğlan o arada içeri girdi.", en: "You took the Spire door fees up with the head of the Guild. Meanwhile, the boy went in." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Kule'den dönüş (tohum; kuyruk ve pazar)
  - id: "kule_dibi_donus"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["kule", "ahlak"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Kule'den dönen", en: "Back from the Spire" }
    sahne: "kule_dibi_donus_1"
    sahneler:
      - id: "kule_dibi_donus_1"
        yer: "kiyikent"
        paragraflar:
          - metin: { tr: "Kule Dibi'ndeki oğlan seni buluyor; öksürüğü geçmiş, yanında annesi. Kadın elini tutuyor ve bırakmıyor; hekim kıyafeti bile böyle sıkı tutmazdı.", en: "The boy from Spire Plaza finds you, his cough gone, his mother with him. She takes your hand and won't let go. Not even a surgeon's grip holds that tight." }
            kosul: { bayrak_yok: ["kuledibi_genc_tek", "kuledibi_genc_eve", "kuledibi_kask_alindi"] }
          - metin: { tr: "Kule Dibi'ndeki oğlan seni buluyor. Kule'den dönmüş, bir kristal ve iki eksik parmakla. Annesi yaşıyor. \"Beşinci kat,\" diyor gururla. \"Tek başıma.\"", en: "The boy from Spire Plaza finds you. He made it back from the Spire with one crystal and two fewer fingers. His mom's alive. \"Floor 5,\" he says, proud. \"By myself.\"" }
            kosul: { bayrak: "kuledibi_genc_tek" }
          - metin: { tr: "Kule Dibi'ndeki oğlanın annesi seni buluyor. Oğlu kılıçsız da gitmiş; bir mutfak bıçağıyla. Üç gündür dönmedi. Senden bir şey istemiyor; yalnızca söylüyor.", en: "The mother of the boy from Spire Plaza finds you. He went anyway, without the sword. With a kitchen knife. That was three days ago. She isn't asking you for anything. She's just telling you." }
            kosul: { bayrak: "kuledibi_genc_eve" }
          - metin: { tr: "Pazardan aldığın kaskın sahibini buluyorsun: üçüncü katta kaybolmuş, ikinci kattan sürünerek inmiş bir kadın. Kaskı görünce gülüyor. \"Saçımı da mı sattılar?\"", en: "You track down the owner of the helmet you bought at the market: a woman who got lost on Floor 3 and crawled down from Floor 2. She sees the helmet and laughs. \"They sold my hair too?\"" }
            kosul: { bayrak: "kuledibi_kask_alindi" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule herkesi biraz eksik geri verir. parmak. saç. bir şey. seni hiç eksik vermedi. bunu fark ettin mi?", en: "the spire gives everybody back a little short. a finger. some hair. something. it's never kept anything of yours. have you noticed?" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Teşekkürü kabul et", en: "Take the thanks" }
            goster: { bayrak_yok: "kuledibi_genc_eve" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - xp_seviye: 10
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "ara"
            etiket: { tr: "Kule'ye gir ve oğlanı ara", en: "Go into the Spire and look for the boy" }
            goster: { bayrak: "kuledibi_genc_eve" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["dusmus_tirmanici@dunya"], ortam: ["tavan", "karanlik"], kazan: "kule_dibi_donus_bulundu", kaybet: "kule_dibi_donus_kayip", kac: "kule_dibi_donus_kayip" }
          - id: "ogret"
            etiket: { tr: "Oğlana bir parmakla nasıl kılıç tutulur, göster", en: "Show the boy how to grip a sword short two fingers" }
            goster: { bayrak: "kuledibi_genc_tek" }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 2, duzen: 1 }
              - gunluk: { antrenman: 1 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "Kadına sor: üçüncü katta ne gördün?", en: "Ask the woman: what did you see on Floor 3?" }
            goster: { bayrak: "kuledibi_kask_alindi" }
            etkiler:
              - iliski: { mert_kilic: { guven: 1 } }
              - itibar: { sessiz_ag: 2 }
              - xp_seviye: 15
            sonraki: "kule_dibi_donus_ucuncu"

      - id: "kule_dibi_donus_ucuncu"
        yer: "kiyikent"
        paragraflar:
          - { tr: "\"Bir kapı,\" diyor kadın. \"Duvarda bir kapı; açıldı, içinde bizim mahalle vardı. Kıyametten önceki hâli. Annemi gördüm balkonda.\"", en: "\"A door,\" the woman says. \"A door in the wall. It opened, and our neighborhood was inside. The way it was before the end. I saw my mom out on the balcony.\"" }
          - { tr: "\"Girmedim,\" diyor ve kaskı kucağına alıyor. \"Girseydim burada olmazdım. Girmediğim için de her gece rüyamda görüyorum.\"", en: "\"I didn't go in,\" she says, hugging the helmet to her chest. \"If I had, I wouldn't be here. And because I didn't, I see it every night in my dreams.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Bunu aklında tut ve Kule'ye bak", en: "Keep that in mind. Look up at the Spire" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "kule_dibi_donus_bulundu"
        yer: "kule"
        paragraflar:
          - { tr: "Üçüncü katta, düşmüş bir tırmanıcının kabuğunu deviriyorsun; arkasındaki dar bir nişte oğlan oturuyor, mutfak bıçağı hâlâ elinde. Üç gündür orada, kıpırdamaya korkarak.", en: "On Floor 3 you put down a fallen climber's husk. In a narrow niche behind it sits the boy, kitchen knife still in his hand. He's been there three days, too scared to move." }
          - { tr: "Onu sırtına alıp iniyorsun. Annesi kapıda; bir şey demiyor, yalnızca oğlunun yüzünü iki eliyle tutuyor.", en: "You carry him down on your back. His mother's at the door. She doesn't say anything. She just takes her son's face in both hands." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Bu kez onları {fraksiyon:siginak|e} götür", en: "This time, take them to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 2 }
              - bayrak_kaldir: "kuledibi_genc_eve"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 30
            sonraki: "@akis"

      - id: "kule_dibi_donus_kayip"
        yer: "kule"
        paragraflar:
          - { tr: "Düşmüş tırmanıcı seni merdiven boşluğundan aşağı atıyor. Kalktığında kat değişmiş; Kule kendi haritasını yeniden çizmiş ve nişi bulamıyorsun.", en: "The fallen climber throws you down the stairwell. When you get up, the floor's changed. The Spire's redrawn its own map, and you can't find the niche." }
          - { tr: "Akşam meydanda, geri dönmeyenler duvarına bir isim daha ekleniyor. Annesi tebeşiri sana uzatıyor.", en: "That evening at the plaza, one more name goes up on the wall of the Unreturned. His mother holds the chalk out to you." }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını sen yaz", en: "Write his name yourself" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 2 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

  # ================================================================== GERİ DÖNMEYENLER (Kule Dibi)
  - id: "kule_dibi_geri_donmeyenler"
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 45, max: 178 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kule", "kurtarma", "anma"]
    gerilim: 3
    npc: ["aras_kurt"]
    kart: { tr: "On ikinci kattaki adam", en: "The man on Floor 12" }
    sahne: "kule_dibi_geri_donmeyenler_1"
    sahneler:
      - id: "kule_dibi_geri_donmeyenler_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin taşına yaslanmış bir duvar var; tebeşirle yazılmış yüzlerce isim, her birinin yanında bir kat numarası ve bir tarih. Başlıkta: Geri dönmeyenler.", en: "There's a wall leaning against the Spire's stone with hundreds of names in chalk, a floor number and a date next to each one. Across the top: The Unreturned." }
          - { tr: "Duvarın dibinde bir kadın oturuyor; bir termos, bir battaniye, bir tabure. Dokuz gündür burada. Kocası on ikinci kata çıktı ve tebeşirle yazılmasını istemiyor; o yüzden duvarın önünde oturuyor, adı yazılmasın diye.", en: "A woman sits at the foot of the wall with a thermos, a blanket and a stool. She's been here nine days. Her husband went up to Floor 12, and she won't let anyone chalk his name. So she sits in front of the wall, to keep it from being written." }
          - metin: { tr: "On ikinci katı geçtin. Orada ne olduğunu biliyorsun: koridorların sonunda, tırmanmayı bırakmış insanların kabukları duruyor.", en: "You've been past Floor 12. You know what's up there: at the ends of the hallways stand the husks of people who stopped climbing." }
            kosul: { degisken_min: { kule_kat: 12 } }
          - metin: { tr: "Kadının yanındaki taşa siyah bir ceketin ucuyla silinmiş bir iz var; biri buraya oturmuş, bir şey bırakmış ve gitmiş. Kadın elinde tuttuğu şeye bakmıyor: kocasının alyansı.", en: "On the stone beside the woman there's a smear where the hem of a black jacket brushed it. Somebody sat here, left something, and went. The woman won't look at what she's holding: her husband's wedding ring." }
            kosul: { npc_hayatta: "aras_kurt" }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "[ALG] Alyansın iç yüzünde taze bir çizik var: üç kısa çizgi. Biri katı işaretlemiş, ama alyans sahibinin ölü olduğunu yazmamış.", en: "[PER] There's a fresh scratch on the inside of the ring: three short lines. Somebody marked the floor, but didn't mark the owner dead." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule her tırmanıcıyı biraz yer. bazılarını hepsini. bu adam henüz yarısında.", en: "the spire eats a little of every climber. some, it eats whole. this guy's only half gone." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dokuz gün. Ben kardeşim için kaç gün beklerdim? Hepsini.\"", en: "\"Nine days. How many days would I wait for my sister? All of them.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Termostaki çay soğumuş. Kendine bakmayı bırakmış. Bir şey yapacaksak bugün.\"", en: "\"The tea in that thermos went cold days ago. She's stopped taking care of herself. If we're doing something, it's today.\"" }
        secenekler:
          - id: "cik"
            etiket: { tr: "On ikinci kata çık ve onu bul", en: "Go up to Floor 12 and find him" }
            etkiler:
              - ahlak: { merhamet: 4 }
            sonraki: "kule_dibi_geri_donmeyenler_kat"
          - id: "gercek"
            etiket: { tr: "Kadına on ikinci katta ne olduğunu anlat", en: "Tell her what's really on Floor 12" }
            gerekli: { degisken_min: { kule_kat: 12 } }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_gercek"
          - id: "ekip"
            etiket: { tr: "Lonca'dan bir arama ekibi kirala", en: "Hire a Guild search crew" }
            etkiler:
              - kredi: -80
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 1 } }
              - bayrak: "kuledibi_ekip_tutuldu"
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "termos"
            etiket: { tr: "Termosuna sıcak çay doldur ve yanına otur", en: "Fill her thermos with hot tea and sit with her" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_cay"

      - id: "kule_dibi_geri_donmeyenler_cay"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir süre hiçbir şey konuşmuyorsunuz. Sonra kadın kocasını anlatıyor: liman vincinde çalışırmış, ıslık çalarak; Kule'ye borcunu ödemek için girmiş, ilk kez korkarak.", en: "For a while neither of you says anything. Then she tells you about her husband. He worked a crane down at the port, whistling the whole shift. He went into the Spire to pay off a debt, scared for the first time in his life." }
          - { tr: "\"Bir tebeşir alırsam,\" diyor, \"elim yazar. Elim yazarsa, olur.\" Tebeşir taburenin dibinde, el değmemiş duruyor.", en: "\"If I pick up the chalk,\" she says, \"my hand will write it. And if my hand writes it, it's true.\" The chalk sits at the foot of the stool, untouched." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Ayağa kalk: \"Ben gidip bakarım\"", en: "Stand up. \"I'll go look\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_kat"
          - id: "tebesir"
            etiket: { tr: "Tebeşiri cebine koy; kimse yazmasın", en: "Pocket the chalk. Nobody writes anything" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - xp_seviye: 10
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "kule_dibi_geri_donmeyenler_gercek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ona anlatıyorsun: on ikinci katın koridorlarını, tırmanmayı bırakanları, Kule'nin onları nasıl kabuğa çevirdiğini. Kadın her kelimede biraz daha dik oturuyor.", en: "You tell her: the hallways of Floor 12, the ones who stopped climbing, how the Spire turns them into husks. With every word, she sits up a little straighter." }
          - { tr: "\"Kabuk,\" diyor sonunda. \"Ölü değil. Kabuk.\" Termosu yere bırakıyor. \"O zaman hâlâ içinde biri var.\"", en: "\"Husk,\" she finally says. \"Not dead. A husk.\" She sets the thermos down. \"Then there's still somebody inside.\"" }
        secenekler:
          - id: "cik"
            etiket: { tr: "\"Varsa, ben çıkarırım\" de", en: "Say, \"If there is, I'll get him out\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "kule_dibi_geri_donmeyenler_kat"
          - id: "umut"
            etiket: { tr: "Ona sahte bir umut vermediğini söyle", en: "Tell her you're not selling her false hope" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - xp_seviye: 10
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "kule_dibi_geri_donmeyenler_kat"
        yer: "kule"
        paragraflar:
          - { tr: "On ikinci kat soğuk ve sessiz. Koridorların sonunda insan biçimli kabuklar duruyor, yüzleri duvara dönük; sanki tırmanmaktan bir an vazgeçip dinlenmeye durmuşlar ve kalkmayı unutmuşlar.", en: "Floor 12 is cold and quiet. At the ends of the hallways stand human-shaped husks, faces to the wall, like they stopped climbing for a second to rest and forgot to get back up." }
          - { tr: "Birinin elinde ıslığa benzer bir ses var; dudaklarından değil, göğsünden geliyor. Sana döndüğünde içinden bir vinç operatörünün melodisi yükseliyor ve kabuk saldırıyor.", en: "One of them is making something like a whistle, not from its lips but from its chest. When it turns toward you, a crane operator's tune comes up out of it, and the husk attacks." }
          - metin: { tr: "Koridorun sonunda, yarım kalmış bir kabuğun yanına çakılmış bir bıçak var; bıçağın sapına siyah bir şerit bağlı. {npc:aras_kurt} buradan geçmiş, kabuğu öldürmemiş ve bir işaret bırakmış.", en: "At the end of the hallway there's a knife stuck in the wall next to a half-finished husk, a black strip tied around its handle. {npc:aras_kurt} came through here, didn't kill the husk, and left a marker." }
            kosul: { npc_hayatta: "aras_kurt" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kabukla dövüş; içindekini öldürmeden", en: "Fight the husk. Don't kill what's inside" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["dusmus_tirmanici@dunya+10"], ortam: ["tavan", "karanlik"], kazan: "kule_dibi_geri_donmeyenler_zafer", kaybet: "kule_dibi_geri_donmeyenler_yenilgi", kac: "kule_dibi_geri_donmeyenler_yenilgi" }
          - id: "islik"
            etiket: { tr: "Melodiyi sen de ıslıkla çal", en: "Whistle the tune back at it" }
            gerekli: { stat: { cha: 45 } }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
            sonraki: "kule_dibi_geri_donmeyenler_islik"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Kabuğu tek darbede kır; adamı içinden çek", en: "Crack the husk in one hit. Pull the man out" }
            gerekli: { stat: { str: 55 } }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_kurtar"

      - id: "kule_dibi_geri_donmeyenler_islik"
        yer: "kule"
        paragraflar:
          - { tr: "Melodiyi duyduğun kadarıyla ıslıkla çalıyorsun; eski bir halk şarkısı, liman işçilerinin vardiya sonunda söylediği türden. Kabuk duruyor.", en: "You whistle the tune back as best you heard it: an old folk song, the kind dockworkers sing at the end of a shift. The husk stops." }
          - { tr: "Kabuğun yüzünde bir çatlak açılıyor ve oradan bir göz bakıyor, insan gözü. Sonra çatlak büyüyor ve içinden zayıflamış, titreyen bir adam dizlerinin üstüne düşüyor.", en: "A crack opens across the husk's face and an eye looks out of it. A human eye. Then the crack spreads, and a thin, shaking man falls out of it onto his knees." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Adamı sırtına al ve in", en: "Get him on your back and head down" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_kurtar"

      - id: "kule_dibi_geri_donmeyenler_zafer"
        yer: "kule"
        paragraflar:
          - metin: { tr: "Kabuk tek darbede çatlıyor; kırığın arasından bir adamın yüzü görünüyor. Zayıf, gözleri kapalı, ama soluyor.", en: "The husk cracks on a single hit, and through the break you can see a man's face. Thin, eyes shut, but breathing." }
            kosul: { degisken_min: { _savas_ezme: 1 } }
          - metin: { tr: "Son darbende kabuk yere devriliyor ve parça parça dağılıyor. İçinde bir adam var; soğuk, zayıf, nefesi o kadar ince ki ancak eğilince duyuyorsun.", en: "Your last hit knocks the husk over and it comes apart in pieces. There's a man inside, cold and thin, his breathing so faint you only hear it when you lean in close." }
            kosul: { degisken_max: { _savas_ezme: 0 } }
        secenekler:
          - id: "devam"
            etiket: { tr: "Adamı sırtına al ve in", en: "Get him on your back and head down" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "kule_dibi_geri_donmeyenler_kurtar"

      - id: "kule_dibi_geri_donmeyenler_kurtar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydana indiğinde pazar susuyor. Kadın tabureden kalkıyor, termos devriliyor; kocasının yüzüne dokunuyor ve ilk kez ağlıyor, dokuz günün hepsi birden.", en: "When you come down into the plaza, the market goes quiet. The woman stands up off her stool and the thermos tips over. She touches her husband's face and cries for the first time, all nine days at once." }
          - { tr: "Geri dönmeyenler duvarının önünde biri tebeşirle küçük bir şey yazıyor: bir ok, yukarıdan aşağıya. Kule'den ilk dönen işareti.", en: "In front of the wall of the Unreturned, somebody chalks something small: an arrow, pointing from top to bottom. The first sign for somebody who came back." }
        secenekler:
          - id: "alyans"
            etiket: { tr: "Alyansı adamın parmağına geri tak", en: "Slide the ring back on his finger" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - bayrak: "kuledibi_koca_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 60
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "aras"
            etiket: { tr: "Bıçağı ve siyah şeridi {npc:aras_kurt|e} geri götür", en: "Take the knife and black strip back to {npc:aras_kurt}" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - iliski: { aras_kurt: { saygi: 4, guven: 2 } }
              - bayrak: "kuledibi_koca_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 60
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "kule_dibi_geri_donmeyenler_aras"

      - id: "kule_dibi_geri_donmeyenler_aras"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt|i} pazarın kenarında, bir tezgâhın çatısında buluyorsun; bacaklarını sallıyor. Bıçağı görünce gülüyor.", en: "You find {npc:aras_kurt} at the edge of the market, sitting on a stall roof, swinging his legs. He sees the knife and grins." }
          - { tr: "\"Kabuğu kırabilirdim,\" diyor. \"İçindekini öldürmeden kıramazdım. Sen kırmışsın.\" Bıçağı alıyor ve bir süre ona bakıyor. \"Hızlı değilsin sadece. Bu daha kötü.\"", en: "\"I could've cracked the husk,\" he says. \"Couldn't have done it without killing what was inside. You did.\" He takes the knife and stares at it a while. \"You're not just fast. That's worse.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Omuz silk ve yürü", en: "Shrug and walk off" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"
          - id: "teklif"
            etiket: { tr: "\"Bir dahaki sefere birlikte çıkalım\" de", en: "Say, \"Next time, we climb together\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2, baglilik: 1 } }
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "kule_dibi_geri_donmeyenler_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Kabuk seni duvara savuruyor ve melodisini bir kez daha çalıyor; sonra koridorun sonuna, yüzünü duvara dönüp yerine geri gidiyor. Seni öldürmek istemiyor; yalnızca rahat bırakılmak istiyor.", en: "The husk slams you into the wall and whistles its tune one more time. Then it walks back to the end of the hallway and puts its face to the wall again. It doesn't want to kill you. It just wants to be left alone." }
          - { tr: "Meydana indiğinde kadın sana bakıyor ve bir şey sormuyor. Sonra tebeşiri alıyor; eli yazmıyor, yalnızca tutuyor.", en: "When you come down into the plaza, the woman looks at you and doesn't ask a thing. Then she picks up the chalk. Her hand doesn't write. It just holds it." }
        secenekler:
          - id: "yarin"
            etiket: { tr: "\"Yarın yine çıkacağım\" de", en: "Say, \"I'm going back up tomorrow\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - xp_seviye: 20
              - tohum: { olay: "kule_dibi_donus", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Yanına otur; bir şey söyleme", en: "Sit down next to her. Don't say anything" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - xp_seviye: 20
            sonraki: "@akis"

  # ================================================================== SAHTE REKOR (Kule Dibi)
  - id: "kule_dibi_sahte_rekor"
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 48, max: 178 }
    kosul: { bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kule", "siralama", "hakimiyet", "gizli_guc"]
    gerilim: 2
    kart: { tr: "Yirminci kat iddiası", en: "The Floor 20 claim" }
    sahne: "kule_dibi_sahte_rekor_1"
    sahneler:
      - id: "kule_dibi_sahte_rekor_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydanın ortasına bir sahne kurulmuş; üstünde kırmızı pelerinli altı avcı. Kendilerine Kızıl Merdiven diyorlar ve yirminci katı ilk geçen insanlar olduklarını ilan ediyorlar.", en: "Somebody's built a stage in the middle of the plaza, and up on it stand six hunters in red capes. They call themselves the Red Ladder, and they're announcing they're the first humans to clear Floor 20." }
          - { tr: "Liderleri bir torba kristali kalabalığa gösteriyor. \"Bizimle tırmanan, bizimle yükselir!\" Sahnenin önünde on beş, on altı yaşında elli çocuk, isimlerini yazdırmak için itişiyor.", en: "Their leader holds up a bag of crystals for the crowd. \"Climb with us, rise with us!\" In front of the stage, fifty kids, fifteen and sixteen years old, are shoving each other to sign up." }
          - metin: { tr: "Sahnenin arkasında Lonca'nın bayrağı asılı; Lonca, Kızıl Merdiven'in her yeni çocuğu için bir pay alıyor.", en: "There's a Guild banner hanging behind the stage. The Guild takes a cut for every new kid the Red Ladder signs." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Sahnenin arkasında Yükselenler'in göz işareti var; Kızıl Merdiven'e katılan çocuklar Seçilmiş sayılacakmış.", en: "There's an Ascended eye sigil behind the stage. Kids who join the Red Ladder will supposedly count as Chosen." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Sen yirminci katı gördün. Orada ne olduğunu biliyorsun; bu altı kişinin orada olmadığını da.", en: "You've seen Floor 20. You know what's up there. You also know these six have never been." }
            kosul: { degisken_min: { kule_kat: 20 } }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "[ALG] Torbadaki kristallerin rengi on dördüncü katın rengi. Yirminci kattakiler morumsu olur; bunlar hâlâ mavi.", en: "[PER] The crystals in that bag are Floor 14 color. Floor 20 crystals go purplish. These are still blue." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "on dört. üstüne altı eklemişler. senin de görünen sayın böyle bir şey, biliyorsun. farkımız: onlar yukarı yalan söylüyor, sen aşağı.", en: "fourteen. they padded six on top. your public number's the same kind of thing, you know. the difference: they lie up. you lie down." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Elli çocuk. Bir yalanın arkasından yirminci kata. Bunu durdurmazsan ben durduracağım ve kötü olacak.\"", en: "\"Fifty kids, following a lie up to Floor 20. If you don't stop this, I will, and it'll be ugly.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sıralama onları yirminci kattan değil, kristal sayısından tanıyor. Sistem onların yalanını onaylamadı ama düzeltmedi de.\"", en: "\"The Ranking's crediting them for crystal count, not Floor 20. The System didn't confirm their lie, but it didn't correct it either.\"" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Kristallerin on dördüncü kattan olduğunu söyle", en: "Call out the crystals as Floor 14 stock" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - bilgi: "sahte_rekor_gercegi"
            sonraki: "kule_dibi_sahte_rekor_ifsa"
          - id: "yaris"
            tur: "gosteris"
            etiket: { tr: "Onları yirminci kata yarışa çağır", en: "Challenge them to a race to Floor 20" }
            gerekli: { stat: { agi: 55 } }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: 1 }
            sonraki: "kule_dibi_sahte_rekor_yaris"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Kendi kat kaydını ve seviyeni aç", en: "Open your own floor record and level" }
            gerekli: { degisken_min: { kule_kat: 20 } }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
              - bilgi: "sahte_rekor_gercegi"
            sonraki: "kule_dibi_sahte_rekor_ifsa"
          - id: "katil"
            tur: "gizle"
            etiket: { tr: "Kızıl Merdiven'e katıl; çocukları içeriden koru", en: "Join the Red Ladder. Protect the kids from inside" }
            etkiler:
              - gizle: 3
              - ahlak: { merhamet: 2, duzen: -1 }
            sonraki: "kule_dibi_sahte_rekor_iceri"
          - id: "gec"
            etiket: { tr: "Sahnenin önünden geç", en: "Walk past the stage" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

      - id: "kule_dibi_sahte_rekor_ifsa"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sahneye çıkıyorsun ve torbadan bir kristal alıp güneşe tutuyorsun. \"Mavi,\" diyorsun kalabalığa. \"On dördüncü kat. Yirminci katta kristaller mor olur. Bu altısı yirminci katı hiç görmedi.\"", en: "You climb onto the stage, pull one crystal out of the bag and hold it up to the sun. \"Blue,\" you tell the crowd. \"Floor 14. Up on 20 the crystals go purple. These six have never seen Floor 20.\"" }
          - { tr: "Kızıl Merdiven'in lideri gülüyor, sonra gülüşü yarıda kalıyor. Kalabalığın arkasından biri bağırıyor: \"On dördüncüde üç kişi bıraktılar! Benim kardeşim de!\"", en: "The Red Ladder's leader laughs, and the laugh dies halfway. Somebody at the back of the crowd yells, \"They left three people behind on 14! My brother was one!\"" }
          - { tr: "Elli çocuk geri çekiliyor. Kırmızı pelerinler birden çok kırmızı görünüyor.", en: "The fifty kids back away. Suddenly those red capes look very red." }
        secenekler:
          - id: "dagit"
            etiket: { tr: "Kızıl Merdiven'i dağıt; pelerinleri bıraksınlar", en: "Break up the Red Ladder. Capes come off" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { lonca: 1, siginak: 2 }
              - iliski: { aras_kurt: { saygi: 2 } }
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 30
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "on_dort"
            etiket: { tr: "Onları on dördüncüye geri gönder; üçünü bulsunlar", en: "Send them back up to 14. Find the three they left" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 30
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "cocuklar"
            etiket: { tr: "Çocuklara gerçek bir tırmanış dersi ver", en: "Give the kids a real climbing lesson" }
            gerekli: { stat: { wis: 45 } }
            etkiler:
              - gun: 1
              - ahlak: { merhamet: 3, duzen: 2 }
              - itibar: { siginak: 2, lonca: 2 }
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 40
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "kule_dibi_sahte_rekor_yaris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Yirminci kat,\" diyorsun Kızıl Merdiven'in liderine. \"Kim önce inerse. Mor kristalle.\" Lider kalabalığa bakıyor; reddedemiyor.", en: "\"Floor 20,\" you tell the Red Ladder's leader. \"First one back down wins. With a purple crystal.\" The leader looks out at the crowd. He can't say no." }
          - { tr: "Kapıdan birlikte giriyorsunuz. Kırk dakika sonra meydana tek başına, avucunda mor bir kristalle iniyorsun; Kızıl Merdiven ise üç gün sonra, on dördüncü kattan, eksik inecek.", en: "You go in through the door together. Forty minutes later you walk back into the plaza alone with a purple crystal in your fist. The Red Ladder comes down three days later, from Floor 14, short a few people." }
          - metin: { tr: "Sıralama gökyüzünde titriyor; bir satır yer değiştiriyor. Kalabalık başını kaldırıp bakıyor ve sayıyı arıyor.", en: "The Ranking up in the sky flickers. One line changes places. The crowd tips their heads back, looking for the number." }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "kristal"
            etiket: { tr: "Mor kristali sahnenin ortasına bırak", en: "Set the purple crystal down center stage" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - itibar: { lonca: 3, yukselenler: 2 }
              - iliski: { aras_kurt: { saygi: 3 } }
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "kurtar"
            etiket: { tr: "Kızıl Merdiven'i on dördüncüden kendin indir", en: "Go back up and bring the Red Ladder down yourself" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 1 }
              - itibar: { siginak: 2 }
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 50
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "kule_dibi_sahte_rekor_iceri"
        yer: "kule"
        paragraflar:
          - { tr: "Kırmızı bir pelerin giyip görünen sayınla en arkaya yazılıyorsun. Kızıl Merdiven elli çocuğu ertesi sabah Kule'ye sokuyor; sen en arkadasın.", en: "You put on a red cape and sign up at the back, under your public number. The next morning the Red Ladder marches fifty kids into the Spire. You're at the very back." }
          - { tr: "On ikinci katta altı kırmızı pelerin ilk tehlikede çocukların arkasına çekiliyor. Çocuklar sana dönüyor; en arkadaki hamal sandıkları kişiye.", en: "On Floor 12, at the first sign of trouble, the six red capes duck behind the kids. The kids turn around and look at you, the one they thought was just the porter at the back." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Pelerini çıkar ve öne geç", en: "Throw off the cape and step up front" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["kule_kirintisi@dunya+10", "kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "kule_dibi_sahte_rekor_iceri_zafer", kaybet: "kule_dibi_sahte_rekor_iceri_zafer", kac: "kule_dibi_sahte_rekor_iceri_zafer" }

      - id: "kule_dibi_sahte_rekor_iceri_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Elli çocuğun ellisi de meydana iniyor. Bazıları kanıyor, bazıları ağlıyor, hepsi yaşıyor. Altı kırmızı pelerin onlardan bir saat sonra, sessizce iniyor.", en: "All fifty kids make it back down into the plaza. Some are bleeding, some are crying, every one of them is alive. The six red capes come down an hour behind them, quiet." }
          - { tr: "Çocuklar kimseye bir şey anlatmıyor; ama ertesi gün Kızıl Merdiven'in sahnesinin önünde tek bir kişi bile yok.", en: "The kids don't tell anybody anything. But the next day, there isn't a single person in front of the Red Ladder's stage." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kırmızı pelerini sahneye as ve yürü", en: "Hang the red cape on the stage and walk" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - gizle: 1
              - bayrak: "kuledibi_sahte_ifsa"
              - degisken: { hayatta_kalan: 3 }
              - xp_seviye: 45
              - iliski: { aras_kurt: { saygi: 2 } }
              - tohum: { olay: "sokak_efsanesi", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
