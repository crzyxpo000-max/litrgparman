# Bildirim olayları (Aşama 9): oturumlar arası Android bildirimine dokununca bir sonraki gün akışında açılır
# (story/Notifier.kt). Perdeden bağımsızdır; tekrar edebilir. Seyrek gelirler (uygulama en az iki günde bir gösterir).
olaylar:
  - id: "bildirim_rakip"
    yalniz_tohum: true
    tekrar: true
    etiketler: ["aras", "rakip", "siralama"]
    gerilim: 2
    npc: ["aras_kurt"]
    kart: { tr: "Sıralamada bir isim", en: "A name on the board" }
    sahne: "bldr_rakip_1"
    sahneler:
      - id: "bldr_rakip_1"
        paragraflar:
          - { tr: "Gözünü açar açmaz pencere zaten orada; gece boyunca beklemiş gibi. Küresel Sıralama'da senin adının hemen üstünde bir ad duruyor ve dün orada değildi.", en: "The window's already there the second you open your eyes, like it waited up all night. On the Global Ranking there's a name sitting right above yours, and it wasn't there yesterday." }
          - { tr: "{npc:aras_kurt|tam}. Seviyesinin yanında küçük, yeşil bir ok var. Sistem bunu sana özellikle göstermek istemiş gibi.", en: "{npc:aras_kurt|tam}. There's a small green arrow next to the level, like the System wanted to make extra sure you saw it." }
          - metin: { tr: "Bir saat sonra telsizinde tek bir cümle cızırdıyor; ses tanıdık: \"Uyandın mı? Ben çoktan yoldayım.\"", en: "An hour later a single line crackles over your radio, in a voice you know: \"You up yet? I'm already on the road.\"" }
            kosul: { iliski_min: { aras_kurt: { saygi: 20 } } }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "listede senin görünen seviyen var. gerçeği değil. istersen bu sabah düzeltebiliriz. istersen de bırak, hafife alsınlar.", en: "the list shows your public level. not the real one. we could fix that this morning. or let them underestimate you." }
        secenekler:
          - id: "gecis"
            etiket: { tr: "Pencereyi kapat ve bugün onu geç", en: "Close the window and pass him today" }
            etkiler:
              - xp_seviye: 15
              - ahlak: { duzen: -1 }
              - iliski: { aras_kurt: { saygi: 3 } }
            sonraki: "bldr_rakip_gecis"
          - id: "goster"
            etiket: { tr: "Gerçek seviyeni listeye yaz", en: "Put your real level on the board" }
            tur: "aciga_vur"
            etkiler:
              - aciga_vur: true
              - iliski: { aras_kurt: { saygi: 6, korku: 3 } }
            sonraki: "bldr_rakip_aciga"
          - id: "telsiz"
            etiket: { tr: "Telsizi aç: \"Keyfini çıkar. Uzun sürmez.\"", en: "Key the radio: \"Enjoy it. Won't last.\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { aras_kurt: { saygi: 4, guven: 2 } }
              - hafiza: { npc: "aras_kurt", id: "siralama_atismasi", agirlik: 10 }
            sonraki: "bldr_rakip_telsiz"
          - id: "bosver"
            etiket: { tr: "Listeye bakma; işine dön", en: "Ignore the board. Get back to work" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "bldr_rakip_gecis"
        paragraflar:
          - { tr: "Gün boyunca her savaşta o oku düşünüyorsun. Akşama doğru pencere bir kez daha açılıyor: iki ad yer değiştirmiş.", en: "All day, every fight, you're thinking about that arrow. Toward evening the window pops up one more time. The two names have traded places." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pencereyi kapat", en: "Close the window" }
            sonraki: "@akis"

      - id: "bldr_rakip_aciga"
        paragraflar:
          - { tr: "Liste titriyor; adın yukarı kayıyor, kayıyor, sonra bir yerde duruyor. Şehrin dört bir yanında, aynı anda, birileri pencerelerine bakıp susuyor.", en: "The list flickers. Your name slides up, and up, and then stops somewhere. All over the city, at the same moment, people look at their windows and go quiet." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bırak baksınlar", en: "Let them look" }
            sonraki: "@akis"

      - id: "bldr_rakip_telsiz"
        paragraflar:
          - { tr: "Telsiz bir süre sessiz. Sonra kısa, gerçek bir gülüş: \"Göreceğiz.\" Bağlantı kesiliyor.", en: "The radio stays quiet for a while. Then a short laugh, a real one: \"We'll see.\" The line goes dead." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Telsizi kemerine as", en: "Clip the radio back on your belt" }
            sonraki: "@akis"

  - id: "bildirim_goz"
    yalniz_tohum: true
    tekrar: true
    etiketler: ["dikkat", "gozlemci"]
    gerilim: 3
    kart: { tr: "Yukarıdan bir bakış", en: "Eyes from above" }
    sahne: "bldr_goz_1"
    sahneler:
      - id: "bldr_goz_1"
        paragraflar:
          - { tr: "Uyandığında oda fazla sessiz. Pencerenin camında, dışarıdan değil içeriden çizilmiş gibi ince bir satır var: senin adın, bir de yanında hiç görmediğin bir işaret.", en: "When you wake up, the room is too quiet. There's a thin line on the window glass, like it was scratched from the inside, not the outside: your name, and next to it a symbol you've never seen." }
          - { tr: "Sistem penceresi açılmıyor. Bu kez açılmasına gerek yok; birinin seni okuduğunu, bir kitabın sayfasını çevirir gibi okuduğunu biliyorsun.", en: "No System window opens. This time it doesn't have to. You know someone is reading you, the way you'd turn a page in a book." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "biri sayfayı açtı. kapatamam. ama ne okuyacağını seçebiliriz.", en: "someone opened the page. i can't close it. but we can choose what they read." }
          - kosul: { stat: { per: 60 } }
            metin: { tr: "İşaretin çizgileri yedi köşeli; Kadimlerin pullarında gördüğün biçime benziyor ama daha eski.", en: "The symbol has seven points. It looks like the marks on the Ancients' scales, only older." }
        secenekler:
          - id: "sil"
            etiket: { tr: "Camdaki satırı elinle sil", en: "Wipe the line off the glass" }
            etkiler:
              - gizle: 8
              - ahlak: { insanlik: 2 }
            sonraki: "bldr_goz_sil"
          - id: "bak"
            etiket: { tr: "İşarete uzun uzun bak; geri bakıldığını bilsin", en: "Stare at the symbol. Let it know you're looking back" }
            etkiler:
              - dikkat: 4
              - stat: { wil: 1 }
              - ahlak: { insanlik: -2 }
            sonraki: "bldr_goz_bak"
          - id: "yanki"
            etiket: { tr: "Kafandaki sese sor: \"Kim?\"", en: "Ask the voice in your head: \"Who?\"" }
            goster: { bayrak: "yanki_bagi", npc_hayatta: "yanki" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
              - ahlak: { duzen: -1 }
            sonraki: "bldr_goz_yanki"

      - id: "bldr_goz_sil"
        paragraflar:
          - { tr: "Satır parmaklarının altında soğuk bir is gibi dağılıyor. Gün boyunca sırtında bir ağırlık var; akşama doğru o da gidiyor. Şimdilik.", en: "The line comes apart under your fingers like cold soot. All day there's a weight between your shoulder blades. By evening that's gone too. For now." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Güne başla", en: "Start the day" }
            sonraki: "@akis"

      - id: "bldr_goz_bak"
        paragraflar:
          - { tr: "İşaret bir an parlıyor, sonra sönüyor; bir göz kırpması gibi. Ne düşündüğünü bilmiyorsun ama biliyorsun ki artık seni unutmayacak.", en: "The symbol flares for a second, then goes dark, like a blink. You don't know what it thinks of you. You do know it won't forget you now." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Güne başla", en: "Start the day" }
            sonraki: "@akis"

      - id: "bldr_goz_yanki"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Sonra: adı yok. benim de yok. bir zamanlar ikimizin de vardı.", en: "{npc:yanki} is quiet for a long time. Then: it has no name. neither do i. once, we both did." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bunu bir kenara yaz", en: "File that away" }
            sonraki: "@akis"

  - id: "bildirim_kapi"
    yalniz_tohum: true
    tekrar: true
    etiketler: ["kapi", "tasma"]
    gerilim: 3
    kart: { tr: "Taşmak üzere", en: "About to overflow" }
    sahne: "bldr_kapi_1"
    sahneler:
      - id: "bldr_kapi_1"
        paragraflar:
          - { tr: "Sabaha karşı sokakta bir köpek uluyor, sonra bir tane daha. Kapının dikişleri gece boyunca gerilmiş; kenarlarından mavi değil, kırmızı bir ışık sızıyor.", en: "Just before dawn a dog starts howling in the street, then another. The Gate's seams stretched all night, and the light leaking out the edges isn't blue anymore. It's red." }
          - { tr: "Sistem kısa ve kuru: yarın bu saatte kapı taşacak. Kapı hâlâ açık; bugün içeri girmek senin elinde.", en: "The System keeps it short and dry: by this time tomorrow, the Gate overflows. It's still open. Going in today is up to you." }
        secenekler:
          - id: "uyar"
            etiket: { tr: "Önce mahalleyi uyar, sonra kapıya dön", en: "Warn the block first, then head back to the Gate" }
            etkiler:
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 2 }
              - ahlak: { merhamet: 2 }
            sonraki: "bldr_kapi_uyar"
          - id: "bekle"
            etiket: { tr: "Taşmasına izin ver; çıkanları sokakta karşıla", en: "Let it overflow. Meet whatever comes out in the street" }
            etkiler:
              - kredi: 40
              - ahlak: { merhamet: -3, insanlik: -1 }
            sonraki: "bldr_kapi_bekle"
          - id: "dikis"
            etiket: { tr: "Dikişleri oku; nereden yırtılacağını bul", en: "Read the seams. Find where it'll tear" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - xp_seviye: 10
              - ahlak: { duzen: 1 }
            sonraki: "bldr_kapi_dikis"

      - id: "bldr_kapi_uyar"
        paragraflar:
          - { tr: "Kapı kapı dolaşıyorsun. Kimi bavulunu çoktan hazırlamış, kimi sana inanmıyor. Öğlene doğru sokak boşalıyor; geriye bir sen, bir de kırmızı ışık kalıyor.", en: "You go door to door. Some people already have a bag packed. Some don't believe you. By noon the street's empty, and it's just you and the red light." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapıya dön", en: "Head back to the Gate" }
            sonraki: "@akis"

      - id: "bldr_kapi_bekle"
        paragraflar:
          - { tr: "Pencereni kapatıp bir çatıya çıkıyorsun. Taşma olduğunda sokakta çok şey olacak; bir kısmı satılabilir şeyler.", en: "You close the window and climb onto a roof. When it overflows there'll be a lot going on in that street, and some of it'll be worth money." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Beklemeye başla", en: "Settle in and wait" }
            sonraki: "@akis"

      - id: "bldr_kapi_dikis"
        paragraflar:
          - { tr: "Dikişin en ince yeri kuzey kenarı; orası yırtılınca içeriden gelen ilk dalga ana caddeye akacak. Şimdi nerede durman gerektiğini biliyorsun.", en: "The thinnest part of the seam is the north edge. When that tears, the first wave out is going to pour straight onto the main drag. Now you know where to stand." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yerini al", en: "Take your spot" }
            sonraki: "@akis"
