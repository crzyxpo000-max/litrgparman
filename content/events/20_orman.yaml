# Parti B — Orman ve genel olaylar (Perde 1, docs/PERDE1.md).
# Mücadele evresi (gün 1–11) gerçek savaş ve kıt kaynak; `kirilma_yasandi` sonrası hakimiyet seçenekleri
# (gösteriş, gizle/açığa vur) koşulla açılır. Hayatta kalan oranı: `degisken: { hayatta_kalan: ±n }`.
# Tohum hedefleri: kendi olaylarımız (avci_haberi, gece_baskini, isaretli_agaclar) ve PERDE1.md listesindekiler.
# Yankı'nın sözleri küçük harfle ve tırnaksız (fısıltı); paragraf en çok 3 cümle.
olaylar:
  # ================================================================== yaralı avcı
  - id: "yarali_avci"
    perde: [1]
    bolge: ["ogretici_orman", "kirik_istasyon"]
    gun: { min: 2, max: 30 }
    agirlik: 5
    etiketler: ["ahlak", "karsilasma", "kurtarma"]
    gerilim: 2
    onemli: true
    kart: { tr: "Yaralı avcı", en: "The wounded hunter" }
    sahne: "yarali_avci_1"
    sahneler:
      - id: "yarali_avci_1"
        paragraflar:
          - metin: { tr: "Eğreltilerin arasına taze kan damlamış. İzi sürüp bir kayanın dibinde yatan bir kadına varıyorsun: sol baldırı dizinden bileğine kadar yarılmış, yanı başında kırık bir diken domuzu dişi.", en: "There's fresh blood in the ferns. You follow it to a woman lying at the foot of a boulder, her left calf laid open from knee to ankle, a snapped Thornboar tusk in the dirt beside her." }
            kosul: { bolge: "ogretici_orman" }
          - metin: { tr: "Peronun ucunda, devrilmiş bilet makinesinin ardından bir inilti geliyor. Sol baldırı dizinden bileğine kadar yarılmış bir kadın; yanındaki kırık diken domuzu dişine bakılırsa buraya kadar sürünerek gelmiş.", en: "At the far end of the platform, behind a toppled ticket machine, somebody's groaning. It's a woman with her left calf laid open from knee to ankle. Judging by the snapped Thornboar tusk beside her, she crawled all the way here." }
            kosul: { bolge: "kirik_istasyon" }
          - { tr: "Sırtında ağzına kadar dolu bir çanta, kucağında kirişi kopmuş bir yay. Ok kılıfı boşalmış; son okun nereye gittiğini kestirmek zor değil.", en: "Full pack on her back, a bow with a snapped string across her lap. Her quiver's empty, and it's not hard to guess where the last arrow went." }
          - { tr: "Seni görünce elini bıçağına bile götürmüyor. \"Ya yardım et ya da çantayı alıp git,\" diye mırıldanıyor dişlerinin arasından. \"Hangisini yapsan anlarım.\"", en: "She sees you and doesn't even reach for her knife. \"Help me, or take the bag and go,\" she says through her teeth. \"I'd get it either way.\"" }
          - { tr: "Uzakta, sisin içinden bir uluma kopuyor. Kan kokusu yalnız seni çekmemiş.", en: "Somewhere off in the fog, a howl goes up. You're not the only thing the blood brought in." }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Yaranın kenarları parçalanmış ama atardamar sağlam. Kanama durursa yürür; bir saat içinde durmazsa yürüyemez.", en: "The edges are ragged, but the artery's intact. Stop the bleeding and she walks; leave it an hour and she won't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çantada üç günlük erzak, bir harita, on beş kredi. ölürse hepsi senin. ben yalnızca sayıyorum.", en: "three days of food in that pack, a map, fifteen credits. if she dies, it's all yours. i'm just counting." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Onu burada bırakmıyoruz. Bana öyle bakma, bırakmıyoruz.\"", en: "\"We're not leaving her. Don't look at me like that, we're not.\"" }
        secenekler:
          - id: "iksir"
            etiket: { tr: "İksirini ona ver", en: "Give her your potion" }
            gerekli: { esya: { kucuk_iyilesme_iksiri: 1 } }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: -1 }
              - ahlak: { merhamet: 8, insanlik: 2 }
              - efsane: "yabancilari_iyilestirdi"
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
            sonraki: "yarali_avci_iksir"
          - id: "sar"
            etiket: { tr: "Bacağını sar, onu sırtına al", en: "Bind the leg and get her on your back" }
            etkiler:
              - ahlak: { merhamet: 5 }
            sonraki: "yarali_avci_tasima"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} taşısın, sen arkayı kolla", en: "Let {npc:deniz_arman} carry her. You cover the rear" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
            sonraki: "yarali_avci_tasima"
          - id: "omuz"
            tur: "gosteris"
            etiket: { tr: "Omzuna at, sisi geride bırak", en: "Sling her over a shoulder and outrun the fog" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { end: 14 } }
            etkiler:
              - ahlak: { merhamet: 5 }
              - dikkat: 2
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
            sonraki: "yarali_avci_kurtuldu"
          - id: "canta"
            etiket: { tr: "Çantayı alıp git", en: "Take the bag and go" }
            etkiler:
              - ahlak: { merhamet: -12, insanlik: -5 }
              - kredi: 15
              - esya: { kirmizi_ot: 2, kizarmis_et: 2 }
              - egilim: { karanlik: 2 }
              - bayrak: "avci_yagmalandi"
              - tohum: { olay: "avci_haberi", gecikme: { min: 4, max: 8 }, kosul: { bayrak: "avci_yagmalandi" } }
            sonraki: "yarali_avci_yagma"

      - id: "yarali_avci_iksir"
        paragraflar:
          - { tr: "Şişeyi dudaklarına dayamanla kırmızı sıvının boğazından inmesi bir oluyor; baldırdaki yarığın kenarları birbirine doğru kıvrılıp kapanıyor. Geriye ince, pembe bir çizgi kalmış.", en: "You tip the vial to her lips. The red stuff barely goes down before the edges of the gash curl toward each other, until all that's left is a thin pink line." }
          - { tr: "Kadın önce boş şişeye, sonra sana bakıyor. \"Bunu bir yabancıya mı verdin?\" Sesinde minnetten çok şaşkınlık var.", en: "She stares at the empty vial, then at you. \"You gave that to a stranger?\" She sounds more stunned than grateful." }
          - { tr: "Uluma yeniden kopuyor, bu kez daha yakından. Kadın doğrulup ayağa kalkıyor; topallasa da kendi bacaklarının üstünde.", en: "The howl goes up again, closer this time. She gets to her feet, limping but on her own two legs." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Koluna gir, buradan uzaklaşın", en: "Take her arm and get clear of here" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "yarali_avci_kurtuldu"

      - id: "yarali_avci_tasima"
        paragraflar:
          - { tr: "Gömleğinden bir şerit yırtıp baldırını sıkı sıkı sarıyorsun. Kadın bir kez haykırdıktan sonra dudağını ısırıp sesini kesiyor.", en: "You tear a strip off your shirt and cinch it around her calf. She yells once, then bites her lip and goes quiet." }
          - metin: { tr: "{npc:deniz_arman} öbür koluna giriyor. \"Üç deyince,\" diyor, \"bir, iki...\" Üçe sıra gelmiyor, çünkü çoktan yola koyulmuşsunuz.", en: "{npc:deniz_arman} gets under her other arm. \"On three,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, \"one, two...\" Three never comes, because you're already moving." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Daha yüz adım gitmeden sis koyulaşıyor. Önünüzde, yolun tam ortasında uzun bacaklı bir gölge dikilmiş; ağzından buhar tütüyor.", en: "You don't make a hundred yards before the fog thickens. Dead center of the path ahead stands a long-legged shadow, steam curling out of its mouth." }
          - { tr: "\"Şimdilik bir tane,\" diye fısıldıyor kadın kulağına. \"Sürüsü hiçbir zaman uzakta olmaz.\"", en: "\"Just the one, for now,\" she says in your ear. \"The pack's never far behind.\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Tazının sol omzunda kabuk bağlamış bir ok yarası var. O tarafa dönerken bir an gecikiyor.", en: "There's a scabbed-over arrow wound in the hound's left shoulder. It hesitates a beat every time it turns that way." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onu yere bırakırsan iki kat hızlı koşarsın. bu ahlak değil, matematik.", en: "put her down and you run twice as fast. that's math, not morals." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Onu bir kayaya yasla, tazıyı karşıla", en: "Prop her on a rock and face the hound" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["sis_tazisi"], ortam: ["karanlik"], kazan: "yarali_avci_kurtuldu", kaybet: "yarali_avci_yenilgi", kac: "yarali_avci_kacis" }
          - id: "su"
            etiket: { tr: "Suya koş; su kokunuzu siler", en: "Make for the water. It'll kill your scent" }
            zar: { stat: "agi", zorluk: 13, tek: true, basarisiz: "yarali_avci_sikisti", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }, { can: -8 }] }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
            sonraki: "yarali_avci_kurtuldu"
          - id: "birak"
            etiket: { tr: "Onu yere bırakıp koş", en: "Put her down and run" }
            etkiler:
              - ahlak: { merhamet: -10, insanlik: -4 }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "avci_birakildi"
            sonraki: "yarali_avci_terk"

      - id: "yarali_avci_sikisti"
        paragraflar:
          - { tr: "Ayağın ıslak bir köke takılınca ikiniz birden çamura yuvarlanıyorsunuz. Doğrulduğunda tazı tam karşında: başını yana eğmiş, hiç acelesi yok.", en: "Your boot catches a slick root and you both go down in the mud. When you get up, the hound's right there, head cocked, in no hurry at all." }
          - { tr: "Kadın çamurun içinde dirseklerine dayanıp kırık yayını sopa gibi kavrıyor. \"Ya şimdi ya hiç,\" diyor.", en: "She props herself up in the mud and grips her broken bow like a club. \"Now or never,\" she says." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Önüne geç, tazıyı karşıla", en: "Get in front of her and meet the hound" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["sis_tazisi"], ortam: ["karanlik"], kazan: "yarali_avci_kurtuldu", kaybet: "yarali_avci_yenilgi", kac: "yarali_avci_kacis" }
          - id: "birak"
            etiket: { tr: "Onu çamurda bırakıp koş", en: "Leave her in the mud and run" }
            etkiler:
              - ahlak: { merhamet: -10, insanlik: -4 }
              - degisken: { hayatta_kalan: -2 }
              - bayrak: "avci_birakildi"
            sonraki: "yarali_avci_terk"

      - id: "yarali_avci_kurtuldu"
        paragraflar:
          - { tr: "Ulumalar artık geride. Kadın bir ağaç kökünün dibine çöküp derin bir nefes aldıktan sonra ilk kez sana gerçekten bakıyor.", en: "The howling falls behind you. She slumps against a tree root, drags in a long breath and looks at you for real for the first time." }
          - { tr: "\"Bu katmanda kimse kimse için durmaz,\" diyor. \"Sen durdun. Borcumu nasıl ödeyeceğimi bilmiyorum ama ödeyeceğim.\"", en: "\"Nobody stops for anybody in this place,\" she says. \"You did. I don't know how I'll pay that back yet, but I will.\"" }
          - { tr: "Bacağı için ateş de temiz sargı da şart. Dediklerine göre {yer:harabe_carsi|de} bir hekim sahra hastanesi kurmuş; ormanın kuzeyinde de kırmızı kol bantlı, silahlı avcıların kampı var.", en: "That leg needs a fire and a clean dressing. Word is a doctor's set up a field hospital in the {yer:harabe_carsi}, and north of the woods there's a camp of armed hunters with red armbands." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Hastaneye. Bu bacakla kimseye borçlanmasın.\"", en: "\"The hospital. Don't let her owe anybody with her leg like that.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Onu çarşıdaki hekime götür", en: "Take her to the doctor at the mall" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
              - bayrak: "avci_kurtarildi"
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "Onu kuzeydeki avcı kampına götür", en: "Take her to the hunters' camp up north" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - bayrak: "avci_kurtarildi"
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"
          - id: "ucret"
            etiket: { tr: "Kurtarmanın bedelini hemen iste", en: "Ask for your fee. Right now" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - kredi: 15
              - bayrak: "avci_kurtarildi"
              - bayrak: "avci_ucret"
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"

      - id: "yarali_avci_yenilgi"
        paragraflar:
          - { tr: "Gözünü açtığında yüzün çamura gömülü, sırtın alev alev yanıyor. Tazı yanı başında yatıyor; gözünün tam ortasına bir ok saplanmış.", en: "You come to face-down in the mud, your back on fire. The hound's lying next to you with an arrow dead center in its eye." }
          - { tr: "Kadın kırık yayını kendi ayakkabı bağcığıyla yeniden germiş. Son oku nereden bulduğunu sormana gerek yok; tazının omzundaki eski yaradan söküp aldığı belli.", en: "She's restrung the bow with her own bootlace. You don't ask where the last arrow came from, because the hound's shoulder says she yanked it out of an old wound." }
          - { tr: "\"Şimdi ödeştik,\" diyor, sonra biraz düşünüyor. \"Yok, hâlâ borçluyum. Önce sen durdun.\"", en: "\"Now we're even,\" she says, then thinks about it. \"No, I still owe you. You stopped first.\"" }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Elini tutup ayağa kalk", en: "Take her hand and get up" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"
          - id: "gurur"
            etiket: { tr: "Yardımına ihtiyacın olmadığını söyle", en: "Tell her you didn't need the help" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"

      - id: "yarali_avci_kacis"
        paragraflar:
          - { tr: "Tazının dişleri omzunu sıyırıp geçerken kadını kucaklayıp kendini yamaçtan aşağı bırakıyorsun. Taş, dal, çamur… ardından buz gibi su.", en: "The hound's teeth rake your shoulder as you grab her and throw yourself down the slope. Rocks, branches and mud, then ice-cold water." }
          - { tr: "Akıntı ikinizi birden sürükleyip götürüyor. Kıyıya çıktığınızda uluma çok uzakta kalmış, şaşkın ve öfkeli yankılanıyor.", en: "The current drags you both downstream. By the time you crawl out, the howling is far off, confused and angry." }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Onu en yakın ateşe kadar taşı", en: "Carry her to the nearest fire" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "avci_haberi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"
          - id: "kiyi"
            etiket: { tr: "Onu kıyıda bırak; buradan sonrası onun işi", en: "Leave her on the bank. She can take it from here" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - bayrak: "avci_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - tohum: { olay: "avci_haberi", gecikme: { min: 5, max: 9 }, kosul: { bayrak: "avci_kurtarildi" } }
            sonraki: "@akis"

      - id: "yarali_avci_yagma"
        paragraflar:
          - { tr: "Askıyı omzundan sıyırırken sesini çıkarmıyor, yalnızca seni süzüyor: önce yüzünü, sonra ellerini, ayakkabılarını, ardından yine yüzünü.", en: "She doesn't fight you when you slide the strap off her shoulder. She just watches you: your face, your hands, your shoes and your face again." }
          - { tr: "\"Akıllıca. Ben de öyle yapardım,\" diyor. Sesinde alay yok; asıl kötüsü de bu.", en: "\"Smart call. I'd have done it too,\" she says. There's no sarcasm in it, and that's worse." }
          - { tr: "Uluma yaklaştıkça arkandaki nefes hızlanıyor ama kadın yalvarmıyor.", en: "The howl's getting closer. Behind you her breathing picks up, but she doesn't beg." }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Seni ezberliyor. Bunu ilk kez yapmadığı belli.", en: "She's memorizing you. You can tell it's not her first time doing that." }
        secenekler:
          - id: "su"
            etiket: { tr: "Hiç değilse suyunu yanına bırak", en: "Leave her your water. At least that" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk. Don't look back" }
            etkiler:
              - ahlak: { insanlik: -2 }
            sonraki: "@akis"

      - id: "yarali_avci_terk"
        paragraflar:
          - { tr: "Onu bir ağacın dibine bırakıyorsun. \"Anlıyorum,\" diyor; o tek sözcük sırtına bıçak gibi saplanıyor.", en: "You set her down at the base of a tree. \"I get it,\" she says, and the words go into your back like a blade." }
          - { tr: "Koşarken arkandan önce bir uluma, ardından yay çatırtısı, en son da kısa bir çığlık geliyor. Derken sis hepsini yutuyor.", en: "As you run you hear a howl behind you, the crack of a bow and one short scream. Then the fog swallows all of it." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "verimli. sistem bunu alınmış bir ders diye kaydetti. ben kaydetmedim.", en: "efficient. the system logged that as a lesson learned. i didn't." }
        secenekler:
          - id: "kos"
            etiket: { tr: "Koşmaya devam et", en: "Keep running" }
            etkiler:
              - ahlak: { insanlik: -2 }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Geri dön. Belki hâlâ...", en: "Go back. Maybe she's still..." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
            sonraki: "yarali_avci_geri"

      - id: "yarali_avci_geri"
        paragraflar:
          - { tr: "Döndüğünde ağacın dibinde kırık bir yaydan, ezilmiş eğreltilerden ve bıraktığın çantadan başka bir şey yok. Gerisini sis çoktan alıp götürmüş.", en: "When you get back there's nothing at the foot of the tree but a broken bow, flattened ferns and the pack you left. The fog's already taken the rest." }
          - { tr: "Yayın kabzasına bıçak ucuyla bir isim kazınmış ama üstünde kuruyan kan yüzünden okunmuyor.", en: "Someone carved a name into the bow's grip. You can't read it, because the blood's dried over it." }
        secenekler:
          - id: "al"
            etiket: { tr: "Çantayı al; artık kimsenin değil", en: "Take the pack. It's nobody's now" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - kredi: 15
              - esya: { kirmizi_ot: 2 }
            sonraki: "@akis"
          - id: "gom"
            etiket: { tr: "Yayı toprağa gömüp üstüne bir taş koy", en: "Bury the bow and set a stone on it" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"

  # ================================================================== avcının borcu
  - id: "avci_haberi"
    perde: [1]
    agirlik: 1
    etiketler: ["karsilasma", "tohum", "ahlak"]
    gerilim: 2
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Avcının borcu", en: "A hunter's debt" }
    sahne: "avci_haberi_1"
    sahneler:
      - id: "avci_haberi_1"
        paragraflar:
          - metin: { tr: "Kamp ateşinin ışığına biri topallayarak giriyor: kurtardığın avcı. Baldırında temiz bir sargı, sırtında kirişi yeni gerilmiş bir yay var.", en: "Someone limps into the light of your fire. It's the hunter you saved, with a clean dressing on her calf and a freshly strung bow across her back." }
            kosul: { bayrak: "avci_kurtarildi" }
          - metin: { tr: "\"Ücretini almıştın, biliyorum,\" diyor. \"Ama o para bacağımın bedeliydi; hayatımın bedeli başka.\"", en: "\"I know you already got paid,\" she says. \"But that was for the leg. My life's a different price.\"" }
            kosul: { bayrak: "avci_ucret" }
          - metin: { tr: "Ateşin karşısına geçip oturuyor. \"Param yok ama bildiğim bir şey var,\" diyor. \"Ortağım {yer:kirik_istasyon|de} öldü. Penceresi hâlâ açık, ganimeti de orada duruyor; yerini bir tek ben biliyorum.\"", en: "She sits down across the fire. \"I don't have money, but I've got something I know,\" she says. \"My partner died at the {yer:kirik_istasyon}, his window's still open with the loot in it, and I'm the only one who knows where.\"" }
            kosul: { bayrak: "avci_kurtarildi" }
          - metin: { tr: "Kamp ateşinin ışığına biri giriyor; topallasa da yürüyor. Çantasını aldığın avcı bu. Arkasındaki iki kişiden biri elindeki boruyu sabırla, belli bir tempoyla yere vurup duruyor.", en: "Someone steps into the light of your fire, limping but walking. It's the hunter whose pack you took. One of the two people behind her keeps tapping a pipe against the ground, slow and patient." }
            kosul: { bayrak: "avci_yagmalandi" }
          - metin: { tr: "\"Ölmedim, hayal kırıklığına uğrattıysam kusura bakma,\" diyor. \"Çantamı geri istiyorum. İçindeki harita ortağımındı.\"", en: "\"Didn't die. Sorry if that's a letdown,\" she says. \"I want my bag back, because the map in it was my partner's.\"" }
            kosul: { bayrak: "avci_yagmalandi" }
        sezgiler:
          - kosul: { stat: { per: 8 }, bayrak: "avci_kurtarildi" }
            metin: { tr: "Yalan söylemiyor; yine de söz ortağının nasıl öldüğüne gelince gözlerini kaçırıyor.", en: "She's not lying. But when she gets to how her partner died, she won't meet your eyes." }
          - kosul: { stat: { per: 8 }, bayrak: "avci_yagmalandi" }
            metin: { tr: "Borulu adamın dizleri titriyor. Kavgada gözü yok; buraya gelsin diye eline bir şey tutuşturulmuş.", en: "The guy with the pipe has shaky knees. He doesn't want a fight; somebody paid him to be here." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ölü bir avcının açık penceresi. sistem onları kapatmayı bazen unutur. ben unutmam.", en: "a dead hunter's open window. sometimes the system forgets to close those. i don't." }
        secenekler:
          - id: "harita"
            etiket: { tr: "Haritayı alıp teşekkür et", en: "Take the map and thank her" }
            goster: { bayrak: "avci_kurtarildi" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - arayuz: "harita"
              - bilgi: "avci_ortagi"
              - xp: 40
              - tohum: { olay: "olu_avci_penceresi", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "birlikte"
            etiket: { tr: "Pencereye birlikte gitmeyi teklif et", en: "Offer to go to the window together" }
            goster: { bayrak: "avci_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bilgi: "avci_ortagi"
              - xp: 20
              - tohum: { olay: "olu_avci_penceresi", gecikme: { min: 1, max: 2 } }
            sonraki: "avci_haberi_birlikte"
          - id: "deniz"
            etiket: { tr: "Bırak {npc:deniz_arman} bacağına baksın", en: "Let {npc:deniz_arman} take a look at that leg" }
            goster: { bayrak: "avci_kurtarildi", yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { saygi: 3, baglilik: 3 } }
              - arayuz: "harita"
              - bilgi: "avci_ortagi"
              - tohum: { olay: "olu_avci_penceresi", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "fazlasi"
            etiket: { tr: "Borcunun bundan büyük olduğunu söyle", en: "Tell her she owes you more than that" }
            goster: { bayrak: "avci_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: -4 }
              - kredi: 15
              - bilgi: "avci_ortagi"
              - tohum: { olay: "olu_avci_penceresi", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "borc_yok"
            etiket: { tr: "Borç olmadığını söyle; bacağına iyi baksın", en: "Tell her there's no debt. Mind the leg" }
            goster: { bayrak: "avci_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - itibar: { siginak: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"
          - id: "iade"
            etiket: { tr: "Çantayı içindekilerle birlikte geri ver", en: "Give the bag back, everything in it" }
            goster: { bayrak: "avci_yagmalandi" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 3 }
              - kredi: -15
              - itibar: { lonca: 2 }
            sonraki: "avci_haberi_iade"
          - id: "inkar"
            etiket: { tr: "O çantayı hiç görmediğini söyle", en: "Say you've never seen that bag" }
            goster: { bayrak: "avci_yagmalandi" }
            zar: { stat: "cha", zorluk: 14, tek: true, basarisiz: "avci_haberi_kavga", basarisiz_etkiler: [{ ahlak: { insanlik: -2 } }] }
            etkiler:
              - ahlak: { duzen: -3 }
            sonraki: "avci_haberi_inkar"
          - id: "tehdit"
            tur: "aciga_vur"
            etiket: { tr: "Maskeni indir; boru elinden düşsün", en: "Drop the mask. Watch the pipe hit the dirt" }
            goster: { bayrak: "kirilma_yasandi", bayrak_yok: "avci_kurtarildi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: -3, duzen: 2 }
            sonraki: "avci_haberi_tehdit"
          - id: "kavga"
            etiket: { tr: "Borulu adamla yüzleş", en: "Square up to the guy with the pipe" }
            goster: { bayrak: "avci_yagmalandi" }
            etkiler:
              - ahlak: { merhamet: -4 }
              - savas: { dusmanlar: ["cop_avcisi"], ortam: ["karanlik"], kazan: "avci_haberi_zafer", kaybet: "avci_haberi_yenilgi", kac: "avci_haberi_kacis" }

      - id: "avci_haberi_birlikte"
        paragraflar:
          - { tr: "\"Akıllı olan ortağımdı,\" diyor gözünü ateşten ayırmadan. \"İstasyondaki kapıyı ilk o fark etti. İçeri bir göz atmak istedi; ben de dışarıda bekledim.\"", en: "\"My partner was the smart one,\" she says, watching the fire. \"He spotted the Gate at the station first and wanted a look inside, so I waited out front.\"" }
          - { tr: "\"Kapı onu beline kadar yutup geri tükürdü. Penceresi o günden beri cesedinin üstünde asılı duruyor; bir türlü elimi süremedim.\"", en: "\"The Gate swallowed him to the waist and spat him back out. His window's been hanging over the body ever since, and I couldn't make myself touch it.\"" }
          - { tr: "\"Benimle gelirsen ganimet yarı yarıya,\" diyor. \"Ama künyesi benim.\"", en: "\"Come with me and the loot's split down the middle,\" she says. \"But his dog tags are mine.\"" }
        secenekler:
          - id: "anlas"
            etiket: { tr: "Anlaştık: yarı yarıya, künye onun", en: "Deal. Half and half, the tags are hers" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 2 }
            sonraki: "@akis"
          - id: "istemez"
            etiket: { tr: "Ganimeti istemediğini söyle", en: "Tell her you don't want the loot" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"

      - id: "avci_haberi_iade"
        paragraflar:
          - { tr: "Çantayı önüne bırakıyorsun. Açıp bakmıyor bile; eliyle harita cebini yokluyor, harita yerinde.", en: "You set the bag down in front of her. She doesn't even open it; she just pats the map pocket, and the map's still there." }
          - { tr: "\"Bir dahaki sefere iste, belki veririm,\" diyor. Borulu adam boruyu omzuna atıp sırıtıyor; onun da içi rahatlamış.", en: "\"Next time, ask. I might just give it to you,\" she says. The pipe guy slings his pipe over his shoulder and grins, just as relieved." }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile", en: "Apologize" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "basini_salla"
            etiket: { tr: "Hiçbir şey deme, yalnızca başını salla", en: "Say nothing. Just nod" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "avci_haberi_inkar"
        paragraflar:
          - { tr: "Kadın yüzünü uzun uzun süzdükten sonra omuz silkip \"Belki de sisteki başka biriydi,\" diyor. Öyle olmadığını ikiniz de biliyorsunuz.", en: "She studies your face for a long time, then shrugs. \"Maybe it was somebody else in the fog,\" she says, and you both know it wasn't." }
          - { tr: "Giderken borulu adamın kulağına bir şey fısıldıyor. Adam boruyu bir kez daha yere vuruyor, bu kez gözünü sana dikerek.", en: "On her way out she whispers something to the pipe guy. He taps the pipe on the ground one more time, looking right at you." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Gidişlerini izle", en: "Watch them go" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bayrak: "avci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "avci_dusman" } }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Bu gece uyuma; nöbet tut", en: "Don't sleep tonight. Stand watch" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - bayrak: "avci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "avci_dusman" } }
            sonraki: "@akis"

      - id: "avci_haberi_kavga"
        paragraflar:
          - { tr: "\"Yalancı,\" diyor kadın, sesini hiç yükseltmeden. \"Askıdaki o düğümü ben attım. Çanta da şu an ateşinin dibinde duruyor.\"", en: "\"Liar,\" she says, without raising her voice. \"I tied that knot on the strap myself, and that bag is sitting right there by your fire.\"" }
          - { tr: "Borulu adam öne çıkıyor. Dizleri titrese de geri adım atamayacak kadar ileri gitmiş artık.", en: "The pipe guy steps forward. His knees are shaking, but he's come too far to back down now." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Borulu adamı karşıla", en: "Meet the guy with the pipe" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - savas: { dusmanlar: ["cop_avcisi"], ortam: ["karanlik"], kazan: "avci_haberi_zafer", kaybet: "avci_haberi_yenilgi", kac: "avci_haberi_kacis" }
          - id: "ver"
            etiket: { tr: "Çantayı ver; bu gecelik utanç yeter", en: "Hand over the bag. Enough shame for one night" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - kredi: -15
            sonraki: "avci_haberi_iade"

      - id: "avci_haberi_tehdit"
        paragraflar:
          - { tr: "Parmağını bile kıpırdatmıyorsun, yalnızca maskeni indiriyorsun. Borulu adamın penceresinde gerçek satırın belirdiği anda boru elinden kayıp düşüyor.", en: "You don't do anything. You just drop the mask, and the second your real line shows up in the pipe guy's window, the pipe slides out of his hand." }
          - { tr: "Kadın bir adım geriliyor. \"Çanta sende kalsın,\" diyor, sesi kupkuru. \"Ama bunu ne ben unuturum ne de başkası.\"", en: "She takes a step back. \"Keep the bag,\" she says, her voice bone dry. \"But I won't forget this, and neither will anybody else.\"" }
        secenekler:
          - id: "geri_ver"
            etiket: { tr: "Çantayı yine de geri ver", en: "Give the bag back anyway" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - kredi: -15
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 3 } }
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Arkalarından bak", en: "Watch their backs as they go" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - itibar: { lonca: 1, siginak: -2 }
            sonraki: "@akis"

      - id: "avci_haberi_zafer"
        paragraflar:
          - { tr: "Önce boru yere düşüyor, ardından adamın kendisi. Bayılmış değil; yalnızca kalkmamaya karar vermiş.", en: "The pipe hits the ground, then the guy holding it. He doesn't black out; he just decides to stay down." }
          - { tr: "Kadın çantasını kendi eliyle alıyor, sen de engel olmuyorsun. \"Aferin,\" diyor. \"Bu katmanda kazananı herkes hatırlar; nasıl kazandığını da.\"", en: "She picks up her bag herself and you don't stop her. \"Congrats,\" she says. \"Everybody in this place remembers who won, and how.\"" }
        secenekler:
          - id: "gitsin"
            etiket: { tr: "Gitmelerine izin ver", en: "Let them go" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "avci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_dusman" } }
            sonraki: "@akis"
          - id: "boru"
            etiket: { tr: "Boruyu da al; ganimet ganimettir", en: "Take the pipe too. Spoils are spoils" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - esya: { hurda: 1 }
              - itibar: { lonca: 1 }
              - bayrak: "avci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_dusman" } }
            sonraki: "@akis"

      - id: "avci_haberi_yenilgi"
        paragraflar:
          - { tr: "Boru kaburgalarına inince nefesin kesiliyor. Sen daha yerden doğrulamadan kadın çantasını kapmış bile.", en: "The pipe lands on your ribs and the air goes out of you. Before you can get up, she's already taken her bag." }
          - { tr: "\"Şimdilik ödeştik,\" diyor. Ateşinin ışığı, uzaklaşan üç sırtın üstünde yavaş yavaş sönüyor.", en: "\"We're square, for now,\" she says. Your firelight fades off the three of their backs." }
        secenekler:
          - id: "yerde"
            etiket: { tr: "Yerde kalıp gökyüzüne bak", en: "Stay down. Look at the sky" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "kin"
            etiket: { tr: "Yüzlerini aklına kazı", en: "Memorize their faces" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - bayrak: "avci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "avci_dusman" } }
            sonraki: "@akis"

      - id: "avci_haberi_kacis"
        paragraflar:
          - { tr: "Boru başının bir karış yanından vınlayarak geçerken ateşini, battaniyeni, çantayı geride bırakıp karanlığa dalıyorsun.", en: "The pipe whistles past your ear and you dive into the dark, leaving your fire, your blanket and the bag behind." }
          - { tr: "Döndüğünde kamp yerin bomboş. Çanta gitmiş; seninkini de yanında götürmüşler.", en: "When you come back, your campsite's empty. The bag's gone, and so is yours." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Elinde kalanla yola devam et", en: "Move on with whatever you've got left" }
            etkiler:
              - ahlak: { duzen: -1 }
              - kredi: -10
              - bayrak: "avci_dusman"
            sonraki: "@akis"

  # ================================================================== bıraktığın yabancı
  - id: "yabanci_geri_donus"
    perde: [1]
    agirlik: 1
    etiketler: ["tohum", "ahlak", "intikam"]
    gerilim: 3
    onemli: true
    yalniz_tohum: true
    kart: { tr: "Bıraktığın yüz", en: "The face you left behind" }
    sahne: "yabanci_geri_donus_1"
    sahneler:
      - id: "yabanci_geri_donus_1"
        paragraflar:
          - { tr: "Patikanın ortasına biri dikilmiş, yol vermiyor. Sol dizi tuhaf bir açıyla bükük kalmış; bütün ağırlığını sağ bacağına vermiş.", en: "Somebody's standing in the middle of the trail and isn't moving aside. Their left knee bends at a wrong angle, all their weight on the right leg." }
          - { tr: "O yüzü bir yere oturtman bir saniyeni alıyor. Sonra hepsi aklına geliyor: fare, ağaç kökü, inilti ve arkana bakmadan koşuşun.", en: "It takes you a second to place the face. The rat, the tree root, the groaning, and you running without looking back." }
          - { tr: "Göğsüne kömürle tek bir göz çizilmiş: {fraksiyon:yukselenler|in} işareti. Arkasında aynı işareti taşıyan üç kişi bekliyor; birinin elindeki zincirin ucunda ağzı bağlı bir diken domuzu var.", en: "A single eye has been drawn on their chest in charcoal, the mark of {fraksiyon:yukselenler}. Three more people wearing it wait behind them, one holding a chain with a muzzled Thornboar on the end." }
          - { tr: "\"O fare az kalsın beni yiyordu,\" diyor yabancı. \"Kökün yarısına kadar sürükledi; sen dönüp arkana bile bakmadın.\"", en: "\"That rat almost ate me,\" the stranger says. \"It dragged me halfway up that root, and you didn't even look back.\"" }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Yabancının elleri titriyor. Öfkeden değil, korkudan.", en: "The stranger's hands are shaking. That isn't anger. It's fear." }
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Zincir eski bir asma kilitten geçirilmiş ama kilit kapalı değil. Biri domuzu salmaya hazır.", en: "The chain's run through an old padlock, but the lock isn't shut. Somebody's ready to let that boar go." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "vaizleri onlara seçilmişler diyor. arka sıradakilerin hiçbiri seviye 3'ü geçmiyor. burada seçilmiş tek kişi vaizin kendisi.", en: "their preacher calls them the chosen. not one of them in the back row is over level 3. the only one chosen here is the preacher." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bunu bana hiç anlatmamıştın.\"", en: "\"You never told me about this.\"" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "Özür dile, korktuğunu söyle", en: "Apologize. Tell them you were scared" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "yabanci_geri_donus_kin", basarisiz_etkiler: [{ ahlak: { insanlik: 2 } }, { bayrak: "yabanci_dusman" }] }
            etkiler:
              - ahlak: { insanlik: 5, merhamet: 3 }
            sonraki: "yabanci_geri_donus_ozur"
          - id: "yalan"
            etiket: { tr: "Geri döndüğünü ama onu bulamadığını söyle", en: "Say you went back and they were gone" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "yabanci_geri_donus_kin", basarisiz_etkiler: [{ ahlak: { duzen: -3, insanlik: -2 } }, { bayrak: "yabanci_dusman" }] }
            etkiler:
              - ahlak: { duzen: -3 }
            sonraki: "yabanci_geri_donus_yalan"
          - id: "sus"
            etiket: { tr: "Sus; bırak sözünü bitirsin", en: "Stay quiet. Let them finish" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "yabanci_geri_donus_hesap"
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Ne olduğunu göster; geri çekilsinler", en: "Show them what you are now. Make them back off" }
            goster: { bayrak: "kirilma_yasandi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: -3, duzen: 2 }
              - iliski: { vahit: { saygi: 8, korku: 4 } }
              - itibar: { yukselenler: 4, siginak: -2 }
            sonraki: "yabanci_geri_donus_tapinma"

      - id: "yabanci_geri_donus_ozur"
        paragraflar:
          - { tr: "Sözcükler ağzından ağır ağır dökülüyor. Ne bahane var ne plan; yalnızca o gün dizlerinin titrediği, bazı geceler hâlâ titrediği gerçeği.", en: "The words come out heavy. No excuses and no plan, just that your knees were shaking that day and some nights they still are." }
          - { tr: "Yabancının yüzünde bir şey çatlıyor. Göğsündeki kömür gözü eliyle örtüyor, sanki o göz de utanıyormuş gibi.", en: "Something cracks in the stranger's face. They cover the charcoal eye on their chest with one hand, like it's embarrassed too." }
          - { tr: "\"Bana yakıt diyorlar ama karnımı doyuruyorlar,\" diyor usulca. \"Senin verdiğinden fazlası.\"", en: "\"They call me fuel, but they feed me,\" they say quietly. \"That's more than you ever gave me.\"" }
        secenekler:
          - id: "davet"
            etiket: { tr: "Seninle gelmesini teklif et", en: "Ask them to come with you" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { yukselenler: -3, siginak: 3 }
              - iliski: { vahit: { guven: -5 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "hekim"
            etiket: { tr: "Dizi için onu çarşıdaki hekime gönder", en: "Point them to the mall doctor for that knee" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
              - itibar: { siginak: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "yolunu"
            etiket: { tr: "Bırak, kendi yolunu seçsin", en: "Let them choose their own road" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "yabanci_affetti"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "yabanci_geri_donus_yalan"
        paragraflar:
          - { tr: "\"Geri mi döndün?\" diye soruyor yabancı, gözünü uzun uzun senden ayırmadan. \"Ben o kökün üstünde fare kulağımı kemirirken bekledim. Gelen olmadı.\"", en: "\"You came back?\" the stranger asks, studying you a long time. \"I waited on that root with the rat chewing my ear, and nobody came.\"" }
          - { tr: "Yine de omuzları düşüyor; inanmak istediği belli. İnanmak, nefret etmekten daha az yorar insanı.", en: "Still, their shoulders drop. They want to believe it, because believing is less tiring than hating." }
          - { tr: "\"Belki,\" diyor sonunda, adamlarına geri dönmelerini işaret ederek. Zincirli domuz homurdana homurdana sürükleniyor.", en: "\"Maybe,\" they finally say, and signal their people to turn around. The chained boar grunts as it's dragged off." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Gidişlerini izle", en: "Watch them go" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "itiraf"
            etiket: { tr: "Arkasından seslen; gerçeği söyle", en: "Call after them. Tell the truth" }
            etkiler:
              - ahlak: { insanlik: 5 }
            sonraki: "yabanci_geri_donus_ozur"

      - id: "yabanci_geri_donus_hesap"
        paragraflar:
          - { tr: "Yabancı her şeyi bir bir anlatıyor: fareyi, kökü, iki gece boyunca yanıp tutuştuğu ateşi, sonunda kendisini bulan beyazlar giymiş insanları. Sesi bir kez bile yükselmiyor.", en: "The stranger tells it all: the rat, the root, two nights of fever and the people in white who found them. Their voice never rises once." }
          - { tr: "\"Vaiz bana bir şey öğretti,\" diyor. \"Güçlü olan kaçabilir, zayıf olan diz çöker. Bugün senin hangisi olduğunu görmek istiyorum.\"", en: "\"The preacher taught me something,\" they say. \"The strong get to run and the weak get to kneel, so I want to see which one you are.\"" }
          - { tr: "Zincirli domuz burnundan soluyor. Arkadaki üç kişinin gözü sende değil, yabancıda; onlar da kendilerinin hangisi olduğunu merak ediyor.", en: "The chained boar snorts. The three in back aren't watching you but the stranger, wondering which one they are." }
        secenekler:
          - id: "diz"
            etiket: { tr: "Diz çök", en: "Kneel" }
            etkiler:
              - ahlak: { insanlik: 4, duzen: -3 }
              - itibar: { yukselenler: 2 }
              - iliski: { vahit: { saygi: -5, guven: 3 } }
            sonraki: "yabanci_geri_donus_diz"
          - id: "hicbiri"
            etiket: { tr: "Hiçbiri. Yürü git", en: "Neither. Walk away" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            sonraki: "yabanci_geri_donus_kin"
          - id: "domuz"
            etiket: { tr: "Zinciri çözmelerini söyle", en: "Tell them to let the boar off the chain" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
              - savas: { dusmanlar: ["diken_domuzu"], kazan: "yabanci_geri_donus_zafer", kaybet: "yabanci_geri_donus_yenilgi", kac: "yabanci_geri_donus_kacis" }

      - id: "yabanci_geri_donus_kin"
        paragraflar:
          - { tr: "Yabancının yüzü kapı gibi kapanıyor. \"Aynı ses,\" diyor. \"O gün kaçarken de bu sesle bir şeyler mırıldanıyordun.\"", en: "The stranger's face shuts like a door. \"Same voice,\" they say. \"You were muttering in that voice while you ran.\"" }
          - { tr: "Zinciri tutana başıyla işaret ediyor. Kilit tık diye açılıyor, bez domuzun ağzından kayıp düşüyor.", en: "They nod to the one holding the chain. The padlock clicks open and the muzzle slides off the boar." }
          - { tr: "\"Şimdi önünde canavar var, arkanda kimse yok,\" diyor yabancı. \"Bakalım ne yapacaksın.\"", en: "\"Now you've got a monster in front of you and nobody behind you,\" the stranger says. \"Let's see what you do.\"" }
        secenekler:
          - id: "karsila"
            etiket: { tr: "Domuzu karşıla", en: "Face the boar" }
            etkiler:
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["diken_domuzu"], kazan: "yabanci_geri_donus_zafer", kaybet: "yabanci_geri_donus_yenilgi", kac: "yabanci_geri_donus_kacis" }
          - id: "kac"
            etiket: { tr: "Yine kaç", en: "Run. Again" }
            etkiler:
              - ahlak: { insanlik: -4, merhamet: -2 }
              - bayrak: "yabanci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yabanci_dusman" } }
            sonraki: "yabanci_geri_donus_kacis"

      - id: "yabanci_geri_donus_tapinma"
        paragraflar:
          - { tr: "Bir an hiçbir şey olmuyor. Derken zinciri tutan kişi tek dizinin üstüne çöküyor, ardından ikincisi, üçüncüsü.", en: "For a second nothing happens. Then the one holding the chain goes down on one knee, followed by the second and the third." }
          - { tr: "Ayakta bir tek yabancı kalıyor. Yüzündeki öfke silinmiş, yerine daha kötü bir şey gelmiş: hayranlık.", en: "The stranger's the only one left standing. There's no anger in their face anymore, only something worse: awe." }
          - { tr: "\"Vaiz haklıymış,\" diye fısıldıyor. \"Seçilmişler kaçar. Sen de seçildiğin için kaçtın.\"", en: "\"The preacher was right,\" they whisper. \"The chosen run, and you ran because you were chosen.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "az önce bir tarikata yepyeni bir aziz armağan ettin. aferin.", en: "you just handed a cult a brand-new saint. congrats." }
        secenekler:
          - id: "duzelt"
            etiket: { tr: "Söyle: bu seçilmişlik değil, korkaklıktı", en: "Tell them it wasn't chosen. It was cowardice" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - itibar: { yukselenler: -2 }
              - iliski: { vahit: { guven: -5 } }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "kabul"
            etiket: { tr: "Bırak, sana tapsınlar", en: "Let them worship" }
            etkiler:
              - ahlak: { insanlik: -5, duzen: 2 }
              - itibar: { yukselenler: 5 }
              - iliski: { vahit: { saygi: 5 } }
              - bayrak: "yabanci_tapiyor"
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "serbest"
            etiket: { tr: "Domuzun zincirini çözüp gitmelerini emret", en: "Order them to free the boar and leave" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 3 }
              - itibar: { yukselenler: 2 }
              - bayrak: "yabanci_tapiyor"
            sonraki: "@akis"

      - id: "yabanci_geri_donus_diz"
        paragraflar:
          - { tr: "Dizin toprağa değer değmez yabancı bir adım geriliyor. Bunu beklemiyormuş; belki de kimse beklemiyormuş.", en: "The second your knee touches dirt, the stranger takes a step back. They weren't expecting it, and maybe nobody was." }
          - { tr: "Arkadaki üç kişi birbirine bakakalıyor. Vaizin kitabında güçlünün diz çöktüğü bir sayfa yok.", en: "The three in back trade looks. There's no page in the preacher's book where the strong one kneels." }
          - { tr: "\"Kalk be, lanet olsun,\" diyor yabancı; sesi titriyor. \"Ben bunu istemedim.\"", en: "\"Get up, damn it,\" the stranger says, voice shaking. \"I didn't want this.\"" }
        secenekler:
          - id: "el"
            etiket: { tr: "Kalkıp elini uzat", en: "Stand up and offer your hand" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { yukselenler: -3, siginak: 3 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Kalk, tek kelime etmeden yürü", en: "Get up and walk on without a word" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"

      - id: "yabanci_geri_donus_zafer"
        paragraflar:
          - { tr: "Domuz son bir kez böğürüp yan yatıyor. Dikenleri hâlâ titriyor; ellerin de öyle.", en: "The boar gives one last bellow and rolls onto its side. Its quills are still trembling, and so are your hands." }
          - { tr: "Yabancı önce sana, ardından ölü domuza, en sonunda da kendi bükük dizine bakıyor. Arkadaki üç kişi usul usul geri çekiliyor.", en: "The stranger looks at you, then at the dead boar, then down at their own twisted knee. The three in back are slowly edging away." }
          - { tr: "\"Demek kaçmayabiliyormuşsun,\" diyor, sesi çatallanarak. \"O gün de kaçmayabilirdin.\"", en: "\"So you can stand your ground,\" they say, voice cracking. \"You could've done it that day too.\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Kaçmamalıydım.\"", en: "Say it. Yes. I shouldn't have run" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "paylas"
            etiket: { tr: "Domuzun etini onlarla paylaş", en: "Share the boar meat with them" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - esya: { diken_domuzu_eti: 1 }
              - itibar: { yukselenler: 1 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "kes"
            etiket: { tr: "Ağzını açmadan domuzun etini kes", en: "Say nothing. Start butchering the boar" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - esya: { diken_domuzu_eti: 2 }
              - bayrak: "yabanci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yabanci_dusman" } }
            sonraki: "@akis"

      - id: "yabanci_geri_donus_yenilgi"
        paragraflar:
          - { tr: "Domuzun omzu göğsüne çarpınca dünya tersine dönüyor. Gözünü açtığında sırtüstü yatıyorsun; domuz yeniden zincire vurulmuş, yabancı da başucuna dikilmiş.", en: "When the boar's shoulder hits your chest, the world flips over. You open your eyes flat on your back, the boar back on its chain and the stranger standing over you." }
          - { tr: "\"İşte, artık biliyorsun,\" diyor. Elini uzatmıyor ama domuzu da üstüne salmıyor.", en: "\"There. Now you know,\" they say. They don't offer a hand, but they don't let the boar finish it either." }
          - { tr: "Çekip gidiyorlar; içlerinden biri bile dönüp arkasına bakmıyor.", en: "They leave, and none of them look back." }
        secenekler:
          - id: "kabul"
            etiket: { tr: "Kalk; bunu hak ettiğini kabul et", en: "Get up. Admit you had that coming" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bayrak: "yabanci_affetti"
            sonraki: "@akis"
          - id: "yemin"
            etiket: { tr: "Bir dahakine hazır olacağına yemin et", en: "Swear you'll be ready next time" }
            etkiler:
              - ahlak: { merhamet: -3 }
              - stat: { wil: 1 }
              - bayrak: "yabanci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yabanci_dusman" } }
            sonraki: "@akis"

      - id: "yabanci_geri_donus_kacis"
        paragraflar:
          - { tr: "Ağaçların, köklerin, sisin arasından, ezbere bildiğin bir yoldan koşuyorsun. Arkandan önce bir böğürme, ardından bir kahkaha kopuyor.", en: "You run through trees, roots and fog along a route you know too well. Behind you comes a bellow, and then laughter." }
          - { tr: "\"Gördünüz mü?\" diye bağırıyor yabancı arkandan. \"Tıpatıp aynısı!\"", en: "\"See?\" the stranger yells after you. \"The exact same thing!\"" }
          - { tr: "O kahkaha uzun süre kulaklarından gitmiyor. Sis bile onu yutmakta zorlanıyor.", en: "You hear that laugh for a long time. Even the fog has trouble swallowing it." }
        secenekler:
          - id: "kos"
            etiket: { tr: "Koşmaya devam et", en: "Keep running" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - bayrak: "yabanci_dusman"
              - tohum: { olay: "gece_baskini", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yabanci_dusman" } }
            sonraki: "@akis"
          - id: "utanc"
            etiket: { tr: "Dur, bu utancı aklına kazı", en: "Stop. Burn this shame into memory" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - stat: { wil: 1 }
              - bayrak: "yabanci_dusman"
            sonraki: "@akis"

  # ================================================================== kurtardığın yabancı
  - id: "yabanci_minnet"
    perde: [1]
    agirlik: 1
    etiketler: ["tohum", "minnet", "kurtarma"]
    gerilim: 1
    yalniz_tohum: true
    kart: { tr: "Bir iyiliğin karşılığı", en: "A favor returned" }
    sahne: "yabanci_minnet_1"
    sahneler:
      - id: "yabanci_minnet_1"
        paragraflar:
          - { tr: "Sabah ateşini yeniden tutuştururken biri sana sesleniyor. Adını bilmediğinden bağırdığı şey şu: \"Hey, fareci!\"", en: "You're getting the morning fire going when somebody calls out to you. They don't know your name, so what they actually yell is: \"Hey, rat person!\"" }
          - { tr: "Fareden kurtardığın yabancı bu. Hâlâ hafiften topallıyor ama yanaklarına renk gelmiş; elinde de bez bir bohça var.", en: "It's the stranger you saved from the rat. Still limping a little, but there's color in their cheeks and a cloth bundle in their hands." }
          - { tr: "\"Seni bulana kadar günlerce aradım,\" diyor nefes nefese. \"O gün senden başka duran olmadı. Bunu sana söylemem lazımdı.\"", en: "\"Took me days to find you,\" they say, out of breath. \"Nobody but you stopped that day, and I needed to tell you that.\"" }
          - { tr: "Bohçayı açınca kırmızı sıvılı iki küçük şişe çıkıyor ortaya. \"Bir de... çakım hâlâ sende mi?\"", en: "They unwrap the bundle to show two little vials of something red. \"Also, you still carrying my pocketknife?\"" }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Bohçayı tutan parmak uçları mosmor. Bu iksirlere karşılık bir şey vermiş; büyük ihtimalle kendi yemeğini.", en: "The fingertips holding that bundle are purple. They traded something for those potions, probably their own food." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "geri dönen bir iyilik. istatistiksel olarak nadir. kaydettim.", en: "a favor coming back around. statistically rare. logged." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Gördün mü? Bazen dünya borcunu öder.\"", en: "\"See? Sometimes the world pays you back.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Bohçayı alıp teşekkür et", en: "Take the bundle and thank them" }
            etkiler:
              - esya: { kucuk_iyilesme_iksiri: 2 }
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"
          - id: "reddet"
            etiket: { tr: "Kendine saklasın; ona daha çok lazım", en: "Tell them to keep it. They need it more" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 2 }
            sonraki: "yabanci_minnet_ret"
          - id: "bilgi"
            etiket: { tr: "Eşya yerine dışarıda ne gördüğünü sor", en: "Ask what they've seen out there instead" }
            gerekli: { stat: { per: 7 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp: 30
            sonraki: "yabanci_minnet_bilgi"
          - id: "caki"
            etiket: { tr: "Çakıyı ona geri ver", en: "Give them back the pocketknife" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - esya: { kucuk_iyilesme_iksiri: 1 }
            sonraki: "yabanci_minnet_caki"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} dizine bir baksın", en: "Let {npc:deniz_arman} take a look at that knee" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 3 } }
              - esya: { kucuk_iyilesme_iksiri: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

      - id: "yabanci_minnet_caki"
        paragraflar:
          - { tr: "Çakıyı avucuna bırakıyorsun. Yabancı onu bir süre evirip çevirince sapındaki küçük çentiği buluyor: ilk gece tırnağınla açmaya uğraşırken sen bırakmıştın onu.", en: "You drop the knife into their palm. They turn it over a while, finding the little nick you left in the handle prying it open that first night." }
          - { tr: "\"Babamındı,\" diyor. \"Onu da herkes gibi kaybettim sanıyordum.\"", en: "\"It was my dad's,\" they say. \"I thought I'd lost it, same as everybody.\"" }
          - { tr: "Şişelerden birini zorla eline tutuşturuyor; hayır demene fırsat bile vermiyor.", en: "They press one of the vials into your hand. They won't take no for an answer." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Şişeyi alıp omzunu sık", en: "Take the vial. Squeeze their shoulder" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "yabanci_minnet_ret"
        paragraflar:
          - { tr: "Yabancı bohçayı göğsüne bastırıp bir süre sana bakıyor. \"O zaman gel, kendin gör,\" diyor sonunda.", en: "The stranger hugs the bundle to their chest and looks at you a while. \"Then come see for yourself,\" they finally say." }
          - { tr: "\"Bir yağmur kanalında saklanıyoruz, dokuz kişiyiz; ikimiz hasta. Onlara senden bahsettim, ne yapacağını görmek istiyorlar.\"", en: "\"There are nine of us hiding in a storm culvert, and two are sick. I told them about you, and they want to see what you'll do.\"" }
        secenekler:
          - id: "git"
            etiket: { tr: "Kanala git", en: "Go to the culvert" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "yabanci_minnet_grup"
          - id: "simdi_degil"
            etiket: { tr: "Şimdi olmayacağını söyle; yerini aklında tut", en: "Say not now, but remember where it is" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "yabanci_minnet_bilgi"
        paragraflar:
          - { tr: "Yabancı yere çömelip bir dalla toprağa harita çiziyor. \"Burası benim kanalım,\" diyor. \"Şurası da her akşam aynı saatte geçen tazıların yolu.\"", en: "The stranger squats and draws a map in the dirt with a stick. \"That's my culvert,\" they say. \"And that's the hounds' route; they come through the same time every evening.\"" }
          - { tr: "Kuzeye bir çarpı atıp \"Biri ağaçlara ok işaretleri kazımış,\" diyor. \"Bazıları bir yere çıkarıyor, bazılarının peşine düşenleriyse bir daha görmedim.\"", en: "They scratch an X to the north. \"Somebody's carved arrows into the trees,\" they say. \"Some lead somewhere, and some, I never saw the people who followed them again.\"" }
          - { tr: "\"Dokuz kişiyiz, ikimiz hasta,\" diye ekliyor sesini alçaltarak. \"Gelip bir bakar mısın?\"", en: "\"There are nine of us, and two are sick,\" they add, quieter. \"Would you come take a look?\"" }
        secenekler:
          - id: "oklar"
            etiket: { tr: "Okların yerini iyice belle", en: "Fix the arrows' location in your head" }
            etkiler:
              - ahlak: { duzen: 2 }
              - tohum: { olay: "isaretli_agaclar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Önce hastalara bak", en: "Check on the sick ones first" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - tohum: { olay: "isaretli_agaclar", gecikme: { min: 2, max: 4 } }
            sonraki: "yabanci_minnet_grup"

      - id: "yabanci_minnet_grup"
        paragraflar:
          - { tr: "Kurumuş bir yağmur kanalının içine dokuz kişi sığınmış. Ateş yakmaya korktuklarından birbirlerine sokulup ısınmaya çalışıyorlar.", en: "Nine people are inside a dried-out storm culvert. Too scared to light a fire, they're huddled together for warmth." }
          - { tr: "İkisi ateşler içinde: yaşlı bir adamla on yaşlarında bir kız. İkisinin de kolları iğne tavşanı dikenleriyle çizik çizik.", en: "Two of them are burning up, an old man and a girl of maybe ten. Both their arms are scratched raw by Needle Hare quills." }
          - { tr: "Yabancı sana dönüyor. \"İşte,\" diyor, \"hepimiz bu kadarız.\"", en: "The stranger turns to you. \"This is it,\" they say. \"This is all of us.\"" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Çizikler iltihaplanmış ama zehir yok. Kırmızı otla kaynamış su yeter.", en: "The scratches are infected, but there's no venom. Red herb and boiled water would do it." }
        secenekler:
          - id: "tedavi"
            etiket: { tr: "Kırmızı otla yaralarını temizle", en: "Clean their wounds with red herb" }
            gerekli: { esya: { kirmizi_ot: 2 } }
            etkiler:
              - esya: { kirmizi_ot: -2 }
              - ahlak: { merhamet: 5 }
              - degisken: { hayatta_kalan: 2 }
              - efsane: "yabancilari_iyilestirdi"
              - itibar: { siginak: 2 }
            sonraki: "@akis"
          - id: "siginak"
            etiket: { tr: "Onları çarşıdaki sahra hastanesine götür", en: "Lead them to the field hospital at the mall" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 5, saygi: 4 } }
              - bayrak: "minnet_grubu"
              - tohum: { olay: "elif_sahra_hastanesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "Onları kuzeydeki avcı kampına teslim et", en: "Hand them over to the hunters' camp up north" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "ates"
            etiket: { tr: "Dumansız ateş yakmayı öğretip yoluna git", en: "Teach them a smokeless fire, then move on" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "@akis"

  # ================================================================== sisteki çocuk
  - id: "kayip_cocuk"
    perde: [1]
    bolge: ["ogretici_orman"]
    gun: { min: 2, max: 16 }
    agirlik: 5
    etiketler: ["kurtarma", "ahlak", "kesif"]
    gerilim: 3
    onemli: true
    kart: { tr: "Sisteki çocuk", en: "The kid in the fog" }
    sahne: "kayip_cocuk_1"
    sahneler:
      - id: "kayip_cocuk_1"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin kenarında bir kadın ağaçlara doğru durmadan tek bir isim haykırıyor. Sesi çoktan kısılmış; boğazından çıkan artık bağırıştan çok hırıltı.", en: "At the edge of the fog a woman is screaming one name into the trees, over and over. Her voice gave out a while ago, and it's more of a rasp now." }
          - { tr: "Seni görür görmez koluna yapışıyor. Yedi yaşındaki oğlu bir iğne tavşanının peşine takılıp sise dalmış; iki saattir dönmemiş.", en: "When she sees you she grabs your arm. Her seven-year-old chased a Needle Hare into the fog two hours ago and hasn't come back." }
          - { tr: "Tam o sırada sisin içinden ince bir ses yükseliyor: \"Anne?\" Ardından bambaşka bir yönden tıpatıp aynısı duyuluyor.", en: "Right then a thin voice floats out of the fog: \"Mom?\" Then the exact same word comes from a completely different direction." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "İki ses aynı değil. Soldaki her seferinde aynı tonda tekrarlıyor, sağdaki titreyip yoruluyor. Gerçek olan sağdaki.", en: "The two voices aren't the same. The left one repeats on the exact same pitch every time, while the right one wobbles and tires. The right one's real." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ormanda ses çalan bir şey var. çocuğu kimse bulmadan önce sesini bulmuş.", en: "something in these woods steals voices. it found the kid's voice before anyone found the kid." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bir kız kardeşim var, biliyorsun. Bunun yanından öylece geçip gidemem.\"", en: "\"I've got a little sister, you know that. I can't walk past this.\"" }
        secenekler:
          - id: "dal"
            etiket: { tr: "Sese doğru sise dal", en: "Plunge into the fog after the voice" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - gorev: { sisteki_cocuk: "basla" }
            sonraki: "kayip_cocuk_sis"
          - id: "dinle"
            etiket: { tr: "Dur, dinle; gerçek sesi ayırt et", en: "Stop. Listen. Pick out the real voice" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - gorev: { sisteki_cocuk: "basla" }
            sonraki: "kayip_cocuk_kovuk"
          - id: "zincir"
            etiket: { tr: "Etraftakileri toplayıp arama zinciri kur", en: "Rally the bystanders into a search line" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "kayip_cocuk_yalniz", basarisiz_etkiler: [{ ahlak: { duzen: 1 } }, { gorev: { sisteki_cocuk: "basla" } }] }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - gorev: { sisteki_cocuk: "basla" }
              - itibar: { siginak: 2 }
            sonraki: "kayip_cocuk_zincir"
          - id: "ayril"
            etiket: { tr: "Ayrılın: {npc:deniz_arman} doğuya, sen batıya", en: "Split up. {npc:deniz_arman} east, you west" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - iliski: { deniz_arman: { guven: 5, saygi: 4 } }
              - gorev: { sisteki_cocuk: "basla" }
            sonraki: "kayip_cocuk_sis"
          - id: "vazgec"
            etiket: { tr: "Sisin kaybolanı geri vermediğini söyle", en: "Tell her the fog doesn't give people back" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - gorev: { sisteki_cocuk: "basla" }
            sonraki: "kayip_cocuk_vazgec"

      - id: "kayip_cocuk_yalniz"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sesin kampın bir ucundan öbür ucuna ulaşıyor ama kimse kılını kıpırdatmıyor. Herkesin gözü yerde, ateşte ya da kendi çocuğunda.", en: "Your voice carries across the camp, but nobody moves. Everyone looks at the ground, the fire or their own kids." }
          - { tr: "Yaşlı bir adam başını iki yana sallıyor. \"Sise giren geri dönmez evlat,\" diyerek sana bir sopa uzatıyor; elinden gelen yardım bu kadar.", en: "An old man shakes his head. \"Whoever goes in doesn't come out, kid,\" he says, and hands you a stick, the only help he's got." }
        secenekler:
          - id: "yalniz"
            etiket: { tr: "Sopayı alıp sise tek başına gir", en: "Take the stick and go in alone" }
            etkiler:
              - ahlak: { merhamet: 4 }
            sonraki: "kayip_cocuk_sis"
          - id: "vazgec"
            etiket: { tr: "Sopayı geri ver; sen de girmiyorsun", en: "Hand back the stick. You're not going either" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3 }
            sonraki: "kayip_cocuk_vazgec"

      - id: "kayip_cocuk_sis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "İçeri girdikçe sis koyulaşıyor, on adım sonra kendi ellerini zor seçer oluyorsun. \"Anne?\" sesi bu kez tam tependen, bir dalın üstünden geliyor.", en: "The fog thickens the deeper you go, until ten steps in you can barely see your own hands. \"Mom?\" This time the voice is right above you, on a branch." }
          - metin: { tr: "Uzaklarda, doğu tarafında {npc:deniz_arman} iki kısa ıslık çalıyor: buradayım, iyiyim. İçine bir parça cesaret geliyor.", en: "Far off to the east, {npc:deniz_arman} whistles twice, short. It means here and okay, and it buys you a little nerve." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Dalda kara tüylü bir karga tünemiş; gagasını kıpırdatmadan çocuğun sesiyle konuşuyor: \"Anne, korkuyorum.\" Ardından kıkır kıkır gülüyor.", en: "There's a black-feathered crow on the branch, and without moving its beak it talks in the kid's voice: \"Mom, I'm scared.\" Then it giggles." }
          - { tr: "Daha ileride, sağ tarafta bir şey ağlıyor; öyle düzensiz, öyle kesik kesik ki taklit olamaz.", en: "Further on, to the right, something's crying. It's too ragged and uneven to be faked." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Karga ikide bir sağa, ağlamanın geldiği yere bakıyor. O da çocuğu arıyor; senden önce bulmak istiyor.", en: "The crow keeps glancing right, toward the crying. It's hunting the kid too, and it wants to get there first." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "fısıldayan karga. ölülerin son sözlerini toplar. bu çocuğunkini henüz toplamadı.", en: "rumor crow. it collects the last words of the dead. it hasn't collected this kid's yet." }
        secenekler:
          - id: "karga"
            etiket: { tr: "Kargayı o daldan indir", en: "Knock that crow off its branch" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - savas: { dusmanlar: ["fisildayan_karga"], ortam: ["karanlik"], kazan: "kayip_cocuk_kovuk", kaybet: "kayip_cocuk_yenilgi", kac: "kayip_cocuk_kacis" }
          - id: "agla"
            etiket: { tr: "Kargayı boş ver, ağlayana koş", en: "Forget the crow. Run for the crying" }
            zar: { stat: "agi", zorluk: 13, tek: true, basarisiz: "kayip_cocuk_pusu", basarisiz_etkiler: [{ ahlak: { merhamet: 1 } }] }
            etkiler:
              - ahlak: { merhamet: 4 }
            sonraki: "kayip_cocuk_kovuk"
          - id: "tas"
            etiket: { tr: "Taş fırlatıp kargayı ürküt", en: "Throw a rock and spook the crow" }
            gerekli: { egilim_min: { menzilli: 2 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - egilim: { menzilli: 1 }
              - xp: 30
            sonraki: "kayip_cocuk_kovuk"

      - id: "kayip_cocuk_pusu"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Geç kaldın. Karga kovuklu bir ağacın önüne konmuş, senin sesinle konuşuyor: \"Gel, korkma, ben buradayım.\"", en: "You're too late. The crow has landed in front of a hollow tree, and it's talking in your voice: \"Come on out, it's okay, I'm here.\"" }
          - { tr: "Kovuğun içinden küçük bir el uzanıyor.", en: "A small hand reaches out of the hollow." }
        secenekler:
          - id: "atil"
            etiket: { tr: "Kargaya atıl", en: "Lunge at the crow" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["fisildayan_karga"], ortam: ["karanlik"], kazan: "kayip_cocuk_kovuk", kaybet: "kayip_cocuk_yenilgi", kac: "kayip_cocuk_kacis" }
          - id: "bagir"
            etiket: { tr: "Bağır: \"İçeride kal!\" Sonra saldır", en: "Shout \"Stay inside!\" Then attack" }
            gerekli: { stat: { wil: 7 } }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - savas: { dusmanlar: ["fisildayan_karga"], ortam: ["karanlik"], kazan: "kayip_cocuk_kovuk", kaybet: "kayip_cocuk_yenilgi", kac: "kayip_cocuk_kacis" }

      - id: "kayip_cocuk_zincir"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sesin kampın bir ucundan öbür ucuna ulaşıyor; bir an kimse kımıldamıyor. Derken yaşlı bir adam bastonunu bırakıp elini uzatıyor, ardından ikinci, üçüncü kişi geliyor.", en: "Your voice carries across the camp and for a second nobody moves. Then an old man drops his cane and reaches out a hand, and a second and a third person follow." }
          - { tr: "Sekiz kişi el ele sise doğru yürüyorsunuz, zincirin başında da sen.", en: "Eight of you walk into the fog hand in hand. You're at the front of the line." }
          - { tr: "Karga zinciri görünce susuyor; bunca ses kafasını karıştırmış. Ortada yalnız ağlama kalıyor, izini sürmek de kolay.", en: "When the crow sees the line it goes quiet, because that many voices throws it off. The crying is left all on its own, easy to follow." }
        secenekler:
          - id: "yonlendir"
            etiket: { tr: "Zinciri ağlamaya doğru yönlendir", en: "Lead the line toward the crying" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "kayip_cocuk_kovuk"
          - id: "avla"
            etiket: { tr: "Zinciri bırak; kargayı tek başına avla", en: "Leave the line. Hunt the crow yourself" }
            etkiler:
              - ahlak: { duzen: -1, merhamet: 1 }
              - savas: { dusmanlar: ["fisildayan_karga"], ortam: ["karanlik"], kazan: "kayip_cocuk_kovuk", kaybet: "kayip_cocuk_yenilgi", kac: "kayip_cocuk_kacis" }

      - id: "kayip_cocuk_kovuk"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Kovuklu bir ağacın içinde, dizlerini göğsüne çekmiş bir çocuk oturuyor. Kucağında iğneleri kabarmış, zangır zangır titreyen bir iğne tavşanı var.", en: "Inside a hollow tree sits a little boy with his knees pulled up to his chest. In his lap he's holding a Needle Hare, quills bristling, shaking like a leaf." }
          - { tr: "Kolları çizik içinde ama tavşanı bırakmıyor. \"Ayağı sıkışmıştı, ben kurtardım,\" diyor. \"Sonra yolu kaybettim.\"", en: "His arms are scratched to ribbons, but he won't let go of the hare. \"Its foot was stuck, so I saved it,\" he says. \"Then I got lost.\"" }
          - { tr: "Tavşan kocaman, korku dolu iki gözle sana bakıyor. Sistem onu Seviye 1 diye gösteriyor; çantan ise iki gündür bomboş.", en: "The hare stares at you with two huge, terrified eyes. The System says it's Level 1, and your pack's been empty for two days." }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Tavşanın arka bacağı kırık. Ormana bırakılırsa sabahı göremez.", en: "The hare's back leg is broken. Turn it loose in the woods and it won't see morning." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seviye 1, kırk xp. çocuk biraz ağlar, sonra geçer. söylemeden edemezdim.", en: "level 1, forty xp. the kid cries a little, then gets over it. i had to mention it." }
        secenekler:
          - id: "ikisi"
            etiket: { tr: "İkisini birden kucaklayıp geri dön", en: "Scoop up both of them and head back" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 3 }
              - efsane: "canavari_bagisladi"
              - bayrak: "cocuk_kurtarildi"
              - bayrak: "tavsan_bagislandi"
            sonraki: "kayip_cocuk_donus"
          - id: "birak"
            etiket: { tr: "Tavşanı bıraktır; yalnızca çocuğu al", en: "Make him drop the hare. Take just the boy" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - bayrak: "cocuk_kurtarildi"
            sonraki: "kayip_cocuk_donus"
          - id: "yemek"
            etiket: { tr: "Tavşanı al; bu akşam karnın doyacak", en: "Take the hare. That's dinner tonight" }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -4 }
              - esya: { kizarmis_et: 1 }
              - xp: 40
              - bayrak: "cocuk_kurtarildi"
              - bayrak: "tavsan_yendi"
            sonraki: "kayip_cocuk_donus"

      - id: "kayip_cocuk_donus"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin kenarından çıktığınızda kadın dizlerinin üstüne yığılıyor. Oğluna öyle sıkı sarılıyor ki çocuğun bir an nefesi kesiliyor.", en: "When you come out of the fog, the woman drops to her knees. She hugs her son so hard he can't breathe for a second." }
          - metin: { tr: "Çocuğun kucağındaki tavşan kalabalığın ortasında bile iğnelerini indirmiyor. Ona çocuktan başka dokunmaya cesaret eden yok.", en: "The hare in the boy's arms keeps its quills up even in the middle of the crowd. Nobody dares touch it except him." }
            kosul: { bayrak: "tavsan_bagislandi" }
          - metin: { tr: "Çocuk dönüş yolu boyunca sana tek kelime etmedi. Şimdi annesinin omzunun üstünden, yedi yaşında bir çocukta olmaması gereken bir bakışla seni süzüyor.", en: "The boy didn't say a word to you the whole way back. Now he's watching you over his mother's shoulder with a look no seven-year-old should have." }
            kosul: { bayrak: "tavsan_yendi" }
          - { tr: "Kadının arkasına kampın geri kalanı toplanmış: on bir kişi, üç çadır, tek bir ateş. Bütün gözler sende.", en: "Behind her, the rest of the camp has gathered: eleven people, three tents, one fire. All of them are looking at you." }
          - { tr: "Çocuk birden söze giriyor: \"Ormanda beyazlı bir amca vardı, başka çocukları ışığa götürüyordu.\" Bir an duraksıyor. \"Bana da gel dedi.\"", en: "Then the boy pipes up: \"There was a man in white in the woods, taking other kids to the light.\" He pauses. \"He told me to come too.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beyaz giysi, bir de ışık. bunu daha önce de duymuştum. o zaman da hoşuma gitmemişti.", en: "white clothes and the light. i've heard that one before. didn't like it then either." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Kampı çarşıdaki hekime gönder", en: "Point the camp toward the doctor at the mall" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4 } }
              - gorev: { sisteki_cocuk: "tamam" }
            sonraki: "@akis"
          - id: "beyazli"
            etiket: { tr: "Beyazlı adamı sor; çocuklar nereye gitti?", en: "Ask about the man in white. Where'd the kids go?" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { vahit: { guven: -5 } }
              - bilgi: "beyazli_adam"
              - gorev: { sisteki_cocuk: "tamam" }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "odul"
            etiket: { tr: "Ödül iste; bu riske bedavaya girmedin", en: "Ask for a reward. You didn't risk it for free" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 2 }
              - kredi: 10
              - degisken: { hayatta_kalan: 2 }
              - gorev: { sisteki_cocuk: "tamam" }
            sonraki: "@akis"

      - id: "kayip_cocuk_yenilgi"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Gaga şakağına inince sis kapkara kesiliyor. Kendine geldiğinde küçük, inatçı iki el seni sarsıp duruyor.", en: "Its beak catches your temple and the fog goes black. When you come to, small, stubborn hands are shaking you." }
          - { tr: "Çocuk kovuktan fırlattığı bir taşla kargayı kaçırmış. Şimdi de seni sürüklemeye uğraşıyor; tavşan hâlâ koltuğunun altında.", en: "The kid ran the crow off with a rock from the hollow. Now he's trying to drag you, the hare still tucked under one arm." }
          - { tr: "\"Sen beni kurtarmaya geldin, o zaman ben de seni kurtarırım,\" diyor ciddi ciddi. \"Kural bu.\"", en: "\"You came to save me, so I save you back,\" he says, dead serious. \"That's the rule.\"" }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Gülüp onu omuzlarına al", en: "Laugh and hoist him onto your shoulders" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - efsane: "canavari_bagisladi"
              - bayrak: "cocuk_kurtarildi"
              - bayrak: "tavsan_bagislandi"
            sonraki: "kayip_cocuk_donus"
          - id: "ciddi"
            etiket: { tr: "Elini sık: \"Anlaştık, ortak.\"", en: "Shake his hand. \"Deal, partner.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - bayrak: "cocuk_kurtarildi"
              - bayrak: "tavsan_bagislandi"
            sonraki: "kayip_cocuk_donus"

      - id: "kayip_cocuk_kacis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Kargayla boğuşmayı bırakıp ağlamanın geldiği yere koşuyorsun. Çocuğu kovuktan çekip bağrına basarken kucağındaki tavşanın iğneleri koluna batıyor.", en: "You break off from the crow and run for the crying. You haul the boy out of the hollow and into your arms, the quills of the hare in his arms jabbing your forearm." }
          - { tr: "Arkanızdan, sisin içinden kendi sesin geliyor: \"Gel, korkma!\" O kargaya hiçbir şey öğretmemek gerek; duyduğu her şeyi aklında tutuyor.", en: "Your own voice chases you out of the fog: \"Come here, it's okay!\" You should never teach that crow anything, because it remembers everything." }
        secenekler:
          - id: "kos"
            etiket: { tr: "Sisin kenarına kadar durma", en: "Don't stop until you're out of the fog" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "cocuk_kurtarildi"
              - bayrak: "tavsan_bagislandi"
            sonraki: "kayip_cocuk_donus"

      - id: "kayip_cocuk_vazgec"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Kadın kolunu bırakıyor. Ağzını açıp tek söz etmiyor; söylenecek bir şey kalmamış.", en: "She lets go of your arm. She doesn't say anything, because there's nothing left to say." }
          - { tr: "Sonra arkasını dönüp tek başına sise yürüyor. \"Anne?\" sesi iki yönden birden yükseliyor; kadın ikisine birden koşmaya çalışıyor.", en: "Then she turns and walks into the fog alone. \"Mom?\" comes from two directions at once, and she tries to run toward both." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yoluna devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { insanlik: -3 }
              - degisken: { hayatta_kalan: -3 }
              - bayrak: "cocuk_kayboldu"
              - gorev: { sisteki_cocuk: "basarisiz" }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Peşinden sise dal", en: "Go in after her" }
            etkiler:
              - ahlak: { merhamet: 6, insanlik: 2 }
            sonraki: "kayip_cocuk_sis"

  # ================================================================== zehirli bereket
  - id: "zehirli_bereket"
    perde: [1]
    bolge: ["ogretici_orman"]
    gun: { min: 3, max: 20 }
    agirlik: 5
    etiketler: ["ahlak", "kaynak", "kesif"]
    gerilim: 2
    onemli: true
    kart: { tr: "Zehirli bereket", en: "Poisoned plenty" }
    sahne: "zehirli_bereket_1"
    sahneler:
      - id: "zehirli_bereket_1"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin seyreldiği yerde bir açıklık beliriyor; ağaçlar meyvenin ağırlığından iki büklüm olmuş. İri, kıpkızıl, şeftali kokan meyvelerle yüklü dallar toprağa değecek kadar sarkmış.", en: "Where the fog thins out there's a clearing, and the trees are bent double with fruit. Branches heavy with big, red, peach-scented fruit sag all the way to the ground." }
          - { tr: "Açıklığa senden önce on iki kişi gelmiş: üç gündür ağzına doğru dürüst lokma girmemiş bir kampın tamamı. Biri ağzı dolu dolu gülüyor, bir anne de meyveyi dişlerinde ezip bebeğinin ağzına veriyor.", en: "There are already twelve people in the clearing, a whole camp that hasn't eaten right in three days. Someone's laughing with their mouth full, and a mother is chewing fruit soft to feed her baby." }
          - { tr: "İçini bir tuhaflık kemiriyor ama adını koyamıyorsun. Belki de açlıktan başka bir şey değildir.", en: "Something about this place feels off, but you can't put your finger on it. Maybe it's just the hunger talking." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Açıklıkta ne kuş var ne böcek; çimenlerin arasında didiklenip ağarmış küçük kemikler duruyor. Zehir alçak dallardaki meyvelerde, yem onlar çünkü. Tepedekilere hiçbir hayvan uzanamamış.", en: "There isn't a single bird or bug in this clearing, just small bones in the grass, picked clean and bleached white. The poison is in the low fruit, because that's the bait. Nothing has ever reached the high stuff." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu koru bir ders, konusu da sabır. sınıfın çoğu kalacak.", en: "this grove is a lesson. subject: patience. most of the class is about to fail." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Kokusu nefis. Peki içim neden rahat etmiyor?\"", en: "\"Smells amazing. So why's my gut saying no?\"" }
        secenekler:
          - id: "isaret"
            etiket: { tr: "Zehirlileri göster: alçaktakiler!", en: "Point out the poisoned ones. The low fruit!" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "bereket_uyarildi"
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_paylasim"
          - id: "bagir"
            etiket: { tr: "Bağır: \"Kimse yemesin!\"", en: "Shout: \"Nobody eat that!\"" }
            zar: { stat: "cha", zorluk: 12, tek: true, basarisiz: "zehirli_bereket_alay", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }] }
            etkiler:
              - ahlak: { merhamet: 4 }
            sonraki: "zehirli_bereket_dene"
          - id: "kendin"
            etiket: { tr: "Önce birkaçını kendin tat", en: "Test a few yourself first" }
            zar: { stat: "end", zorluk: 12, tek: true, basarisiz: "zehirli_bereket_zehir", basarisiz_etkiler: [{ ahlak: { insanlik: 2 } }, { can: -20 }] }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: -5
            sonraki: "zehirli_bereket_tat"
          - id: "sakla"
            etiket: { tr: "Kimseye bir şey deme; güvenli olanları alıp git", en: "Tell no one. Grab the safe fruit and go" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - degisken: { hayatta_kalan: -3 }
              - can: 20
              - bilgi: "bereket_zehri"
              - bayrak: "bereket_saklandi"
            sonraki: "zehirli_bereket_terk"
          - id: "ye"
            etiket: { tr: "Sen de oturup ye", en: "Sit down and eat with them" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: -15
            sonraki: "zehirli_bereket_zehir"
          - id: "sicra"
            tur: "gosteris"
            etiket: { tr: "Tepeye sıçra; güvenlileri tek hamlede indir", en: "Leap up top. Strip the safe fruit in one go" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { agi: 15 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - dikkat: 2
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "bereket_uyarildi"
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_paylasim"

      - id: "zehirli_bereket_dene"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sesin açıklıkta çınlayınca on iki ağız birden duruyor. Bebeğin annesi elindeki meyveyi ağır ağır indiriyor.", en: "Your voice rings across the clearing and twelve mouths stop chewing at once. The baby's mother slowly lowers the fruit in her hand." }
          - { tr: "\"Nereden biliyorsun?\" diye soruyor biri. Soru yerinde ama elinde cevap yok, bir histen başka.", en: "\"How do you know?\" somebody asks. It's a fair question, and you've got no answer, just a feeling." }
          - { tr: "Derken gözüne çarpıyor: açıklıkta tek bir kuş, tek bir böcek bile yok.", en: "Then it hits you: there isn't a single bird or bug in this clearing." }
        secenekler:
          - id: "kemik"
            etiket: { tr: "Çimenlerdeki kemikleri onlara göster", en: "Show them the bones in the grass" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "bereket_uyarildi"
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_paylasim"
          - id: "kanit"
            etiket: { tr: "Kanıtlamak için birini kendin ısır", en: "Bite one yourself, for proof" }
            zar: { stat: "end", zorluk: 12, tek: true, basarisiz: "zehirli_bereket_zehir", basarisiz_etkiler: [{ ahlak: { merhamet: 2 } }, { can: -20 }] }
            etkiler:
              - ahlak: { merhamet: 4 }
              - can: -5
            sonraki: "zehirli_bereket_tat"

      - id: "zehirli_bereket_alay"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Biri kahkahayı basıyor: \"Kimse yemesin de hepsini sen mi ye?\" Gülüş aç kalabalığın içinde dalga dalga yayılıyor.", en: "Somebody laughs. \"Nobody eats, so you get it all, huh?\" The laugh spreads through the hungry crowd." }
          - { tr: "Ağzı dolu adam sana bir meyve fırlatıyor. Ayaklarının dibine düşen meyve çatlayıp açılıyor; içi olması gerekenden kırmızı.", en: "The guy with his mouth full tosses you one. It lands at your feet and splits open, and the inside is too red." }
        secenekler:
          - id: "kanit"
            etiket: { tr: "Meyveyi yerden al, gözlerinin önünde ısır", en: "Pick it up and bite it in front of them" }
            etkiler:
              - ahlak: { merhamet: 6 }
              - can: -20
              - degisken: { hayatta_kalan: 1 }
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_zehir"
          - id: "birak"
            etiket: { tr: "Omuz silk: uyardın, gerisi onların bileceği iş", en: "Shrug. You warned them. Their call now" }
            etkiler:
              - ahlak: { merhamet: -5, duzen: 1 }
              - degisken: { hayatta_kalan: -3 }
            sonraki: "zehirli_bereket_sessiz"

      - id: "zehirli_bereket_sessiz"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sen açıklıktan çıkarken arkandaki kahkahalar yavaş yavaş öğürtülere dönüyor. Seni geri çağıran olmuyor.", en: "As you leave the clearing, the laughter behind you slowly turns to retching. Nobody calls you back." }
          - { tr: "Haklı çıktın ama haklı çıkmak umduğun kadar iyi gelmiyor.", en: "You were right. It doesn't feel nearly as good as you expected." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { insanlik: -2 }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Geri dönüp yardım et", en: "Turn back and help" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
            sonraki: "zehirli_bereket_zehir"

      - id: "zehirli_bereket_tat"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Önce tepeden kopardığın meyveyi ısırıyorsun: tatlı, sulu, zararsız. Ardından alçak bir daldan birini deniyorsun; daha ilk lokmada dilin uyuşuveriyor.", en: "First you bite into one from up high, and it's sweet, juicy and harmless. Then you try one off a low branch, and your tongue goes numb on the first bite." }
          - { tr: "Tükürüp atıyorsun ama boğazında bir yanma kalıyor. Artık biliyorsun; şimdi bunu on iki aç insana anlatmak sana düşüyor.", en: "You spit it out, but your throat's still burning. Now you know, and you've got to explain it to twelve starving people." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Herkese anlat: tepedekiler güvenli", en: "Tell everyone. The high fruit is safe" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 3 }
              - bayrak: "bereket_uyarildi"
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_paylasim"
          - id: "sus"
            etiket: { tr: "Bildiğini kendine sakla", en: "Keep what you know to yourself" }
            etkiler:
              - ahlak: { merhamet: -8, insanlik: -4 }
              - degisken: { hayatta_kalan: -3 }
              - bilgi: "bereket_zehri"
              - bayrak: "bereket_saklandi"
            sonraki: "zehirli_bereket_terk"

      - id: "zehirli_bereket_zehir"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "İlk kusan, ağzı dolu gülen adam oluyor. Ardından bir kadın, onun ardından iki kişi birden derken açıklık bir anda inlemelerle doluyor.", en: "The first to throw up is the guy who was laughing with his mouth full. Then a woman, then two at once, and in a heartbeat the clearing is full of groaning." }
          - { tr: "Senin mideni de bir ateş sarmış. Dizlerin çözülüyor ama yine de ayakta duruyorsun.", en: "There's fire in your gut too. Your knees go loose, but you stay on your feet." }
          - { tr: "Bebek ağlamıyor. Annesi onu sallayıp duruyor, sallayıp duruyor; bebekten yine ses çıkmıyor.", en: "The baby isn't crying. Its mother rocks it and rocks it, and it still doesn't cry." }
        sezgiler:
          - kosul: { stat: { per: 7 } }
            metin: { tr: "Zehir hızlı ama hafif. Kusturmak ve su vermek çoğunu kurtarır; bebek için panzehir şart.", en: "The poison's fast but weak. Making them puke and getting water in them will save most, but the baby needs an antidote." }
        secenekler:
          - id: "panzehir"
            etiket: { tr: "Panzehiri bebeğe ver, sonra ötekilere koş", en: "Antidote to the baby, then run to the others" }
            gerekli: { esya: { panzehir: 1 } }
            etkiler:
              - esya: { panzehir: -1 }
              - ahlak: { merhamet: 8 }
              - efsane: "yabancilari_iyilestirdi"
              - bayrak: "bereket_bebek"
            sonraki: "zehirli_bereket_sonra"
          - id: "kustur"
            etiket: { tr: "Herkesi kustur, su taşı", en: "Make them all throw up. Haul water" }
            etkiler:
              - ahlak: { merhamet: 5, duzen: 3 }
              - can: -10
              - degisken: { hayatta_kalan: -2 }
            sonraki: "zehirli_bereket_sonra"
          - id: "kendin"
            etiket: { tr: "Kendi başının çaresine bak, oradan uzaklaş", en: "Look after yourself. Crawl clear" }
            etkiler:
              - ahlak: { merhamet: -6, insanlik: -3 }
              - degisken: { hayatta_kalan: -4 }
            sonraki: "@akis"

      - id: "zehirli_bereket_sonra"
        yer: "ogretici_orman"
        paragraflar:
          - metin: { tr: "Sonunda bebek ağlamaya başlıyor: cılız, öfkeli, canlı bir ağlayış. Annesi hem gülüyor hem ağlıyor.", en: "The baby finally cries, thin and angry and alive. Its mother is laughing and sobbing at the same time." }
            kosul: { bayrak: "bereket_bebek" }
          - metin: { tr: "Akşam çöktüğünde açıklıkta çıt çıkmıyor. Uyanmayanlar oluyor; annenin kucağındaki küçücük beden de onlardan biri.", en: "By evening the clearing is quiet. Not everyone wakes up, and the little bundle in its mother's arms doesn't either." }
            kosul: { bayrak_yok: "bereket_bebek" }
          - { tr: "Sağ kalanlar artık hangi meyvenin yem olduğunu biliyor; alçak dallara kimse dönüp bakmıyor bile.", en: "The living know now which fruit is bait. Nobody so much as glances at the low branches." }
        secenekler:
          - id: "topla"
            etiket: { tr: "Tepedeki meyveleri toplamalarına yardım et", en: "Help them pick the high fruit" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bilgi: "bereket_zehri"
            sonraki: "zehirli_bereket_paylasim"
          - id: "git"
            etiket: { tr: "Gördüğün yeter; git", en: "You've seen enough. Leave" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bilgi: "bereket_zehri"
            sonraki: "@akis"

      - id: "zehirli_bereket_paylasim"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Alçak dallardaki meyveler bir kenara yığılıyor, tepedekilere ulaşmak için de omuz omuza bir insan merdiveni kuruluyor. Toplanan meyve on iki kişiyi iki gün, belki üç gün idare eder.", en: "The low fruit gets piled to one side, and people build a human ladder for the high stuff. What they pick could feed twelve people for two days, maybe three." }
          - { tr: "Derken ağaçların arasından dört kişi çıkıyor; omuzlarında sivri kazıklar, kollarında kırmızı bezler var. Kuzeydeki silahlı avcıların adamları bunlar.", en: "Then four people step out of the trees with sharpened stakes on their shoulders and red rags around their arms. They're men from the armed hunters' camp up north." }
          - { tr: "\"Bu koru {fraksiyon:lonca|in},\" diyor içlerinden biri. \"Sizi koruyan biziz, yarısı da bizim.\"", en: "\"This grove belongs to the {fraksiyon:lonca},\" one of them says. \"Seeing as we're the ones keeping you alive, we're taking half.\"" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Dördünün de görünen seviyesi senin altında. Kazıklar taze yontulmuş, bu sabah kesilmiş.", en: "All four of them show a lower level than you. Their stakes are freshly whittled, cut this morning." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunlar lonca falan değil. loncanın adını ödünç almış dört aç adam.", en: "that's not the guild. that's four hungry guys borrowing the guild's name." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Yarısı mı? Burada bebek var, bebek!\"", en: "\"Half? There's a baby here.\"" }
        secenekler:
          - id: "esit"
            etiket: { tr: "Önce çocuklar ve hastalar, sonra herkes eşit", en: "Kids and the sick first, then equal shares" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3, lonca: -1 }
              - bayrak: "bereket_kamp"
              - tohum: { olay: "gece_baskini", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "bereket_kamp" } }
            sonraki: "@akis"
          - id: "ver"
            etiket: { tr: "Yarısını Lonca'ya ver; düzen düzendir", en: "Give the Guild its half. Rules are rules" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { guven: 4, saygi: 3 } }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"
          - id: "utandir"
            etiket: { tr: "Dördünü de utandır: koru herkesindir", en: "Shame them. This grove belongs to everyone" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "zehirli_bereket_ret", basarisiz_etkiler: [{ ahlak: { duzen: -2 } }, { itibar: { lonca: -3 } }, { degisken: { hayatta_kalan: -1 } }] }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { lonca: -2, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "bereket_kamp"
              - tohum: { olay: "gece_baskini", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "bereket_kamp" } }
            sonraki: "zehirli_bereket_utanc"
          - id: "kazik"
            tur: "gosteris"
            etiket: { tr: "Kazıklarından birini iki parmakla kır", en: "Snap one of their stakes with two fingers" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { str: 15 } }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 2 }
              - dikkat: 3
              - iliski: { kaya_demir: { saygi: 6, korku: 2 } }
              - itibar: { lonca: 2, siginak: 2 }
              - degisken: { hayatta_kalan: 2 }
            sonraki: "@akis"

      - id: "zehirli_bereket_utanc"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Dört adam birbirine bakakalıyor. En gençleri kazığını yere indirip bebeğin annesine bir avuç meyve uzatıyor.", en: "The four men trade looks. The youngest lowers his stake and hands a fistful of fruit to the baby's mother." }
          - { tr: "\"Kimseye söylemeyin,\" diye mırıldanıyor. Ardından dördü de ağaçların arasında gözden kayboluyor.", en: "\"Don't tell anybody,\" he mutters. Then they disappear into the trees." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kampın ateşini yakmalarına yardım et", en: "Help the camp get a fire going" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "zehirli_bereket_ret"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sözlerin kazıkların ucunda bir yere takılıp kalıyor. En irileri kahkahayı basıyor; meyvelerin yarısını çuvallara dolduruveriyorlar.", en: "Your words snag somewhere on the tips of their stakes. The biggest one laughs, and they shovel half the fruit into their sacks." }
          - { tr: "\"Kahramanlık karın doyurmaz,\" diyor giderken. Bebeğin annesi geriye kalan yığına bakıp tek söz etmiyor.", en: "\"Heroics don't fill bellies,\" he says on the way out. The baby's mother looks at what's left and says nothing." }
        secenekler:
          - id: "paylas"
            etiket: { tr: "Kalanı eşit böl", en: "Split what's left evenly" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "bereket_kamp"
              - tohum: { olay: "gece_baskini", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "bereket_kamp" } }
            sonraki: "@akis"
          - id: "kendi"
            etiket: { tr: "Payını alıp git", en: "Take your share and go" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - can: 10
            sonraki: "@akis"

      - id: "zehirli_bereket_terk"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Çantanı tepedeki meyvelerle dolduruyorsun; herkes yemeğe dalmış, dönüp sana bakan yok. Açıklıktan çıkarken arkandan ilk öğürtü yükseliyor.", en: "You fill your pack from the high branches; everyone's too busy eating to watch you. On your way out of the clearing you hear the first retch behind you." }
          - { tr: "Bebek ağlamıyor. Bunu duyman imkânsız olmalıydı ama duyuyorsun: bir ağlayışın yokluğunu.", en: "The baby isn't crying. You shouldn't be able to hear that, but you do: the absence of a cry." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sabır dersini geçtin. öbür dersten kaldın.", en: "you passed the patience test. flunked the other one." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - ahlak: { insanlik: -3 }
            sonraki: "@akis"
          - id: "don"
            etiket: { tr: "Geri dön; henüz çok geç değil", en: "Turn back. It's not too late" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak_kaldir: "bereket_saklandi"
            sonraki: "zehirli_bereket_zehir"

  # ================================================================== işaretli ağaçlar
  - id: "isaretli_agaclar"
    perde: [1]
    bolge: ["ogretici_orman"]
    gun: { min: 4, max: 22 }
    agirlik: 4
    etiketler: ["gizem", "kesif", "tuzak"]
    gerilim: 2
    kart: { tr: "İşaretli ağaçlar", en: "The marked trees" }
    sahne: "isaretli_agaclar_1"
    sahneler:
      - id: "isaretli_agaclar_1"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Sisin içinde, bir ağaç gövdesine kazınmış bir ok seçiyorsun; derken ikincisini, üçüncüsünü. Biri bu ormanda yol işaretlemiş.", en: "Through the fog you spot an arrow carved into a tree trunk, then a second and a third. Somebody's been marking trails out here." }
          - { tr: "Ama oklar iki türlü. Ucunda küçük bir daire olanlar batıyı, {yer:kirik_istasyon|i} gösteriyor; derin, çentikli olanlarsa insanı kuzeye, sisin en koyulaştığı yere çağırıyor.", en: "But there are two kinds. The ones with a little circle at the tip point west, toward the {yer:kirik_istasyon}, while the deep, notched ones beckon north, where the fog is thickest." }
          - { tr: "Çentikli oklardan birinin altında bir bez parçası asılı. Biri üstüne, belki de kanla, tek bir sözcük yazmış: SU.", en: "Under one of the notched arrows hangs a scrap of cloth. Someone's written one word on it, maybe in blood: WATER." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Çentikli okları insan eli kazımamış. Hepsi aynı açıda, aynı derinlikte, yerden aynı yükseklikte; oyukların içinde ince, yapışkan iplikler duruyor.", en: "No human hand carved the notched arrows. Every one is the same angle, the same depth and the same height off the ground, with sticky thread in the grooves." }
          - kosul: { stat: { per: 11 } }
            metin: { tr: "Daireli okların yanına minicik bir sayı çizilmiş: bir saat. Biri bu yolu her gün aynı saatte kullanıyor.", en: "Next to the circled arrows someone's scratched a tiny number. It's a time of day; somebody walks this path at the same hour every day." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sis dokuyucu, sabırlı bir şeydir. insanların oka uyduğunu öğrenmiş, ok çizmeyi de öğrenmiş.", en: "fog weaver. patient thing. it figured out people follow arrows, so it learned to draw them." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Su yazıyor ama. Ya birinin gerçekten suya ihtiyacı varsa?\"", en: "\"It says water. What if somebody really needs water?\"" }
        secenekler:
          - id: "centik"
            etiket: { tr: "Çentikli okların peşine düş; su o tarafta", en: "Follow the notched arrows. Water's that way" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
            sonraki: "isaretli_agaclar_ag"
          - id: "daire"
            etiket: { tr: "Daireli okların peşine düş", en: "Follow the circled arrows" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "isaretli_agaclar_sakli"
          - id: "kazi"
            etiket: { tr: "Çentikli okların üstüne uyarı kazı", en: "Carve warnings over the notched arrows" }
            gerekli: { stat: { per: 8 } }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { sessiz_ag: 2 }
              - bilgi: "dokuyucu_isaretleri"
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 } }
            sonraki: "isaretli_agaclar_uyari"
          - id: "yuva"
            tur: "gosteris"
            etiket: { tr: "Okları geriye doğru izle, yuvayı sök", en: "Track the arrows back and tear out the nest" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { str: 14 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - dikkat: 2
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["karanlik"], kazan: "isaretli_agaclar_koza", kac: "isaretli_agaclar_kacis" }
          - id: "hicbiri"
            etiket: { tr: "Hiçbirine uyma; kendi yoluna git", en: "Follow neither. Go your own way" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "isaretli_agaclar_ag"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Oklar seni kuzeye, sisin iyice koyulaştığı yere götürüyor. Ortada su sesi yok; rüzgârsız bir sessizlikle yüzüne sürtünen ince iplikler var yalnız.", en: "The arrows lead you north, deeper into the fog. There's no sound of water, only a windless quiet and thin threads brushing your face." }
          - { tr: "Ağaçların arasında, bir boy yukarıda, ipeğe sarılmış üç uzun karaltı asılı duruyor. Biri belli belirsiz kıpırdıyor.", en: "Between the trees, six feet off the ground, hang three long shapes wrapped in silk. One of them is moving, just a little." }
          - { tr: "Tepede sekiz göz birden açılıyor.", en: "Up above, eight eyes open at once." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Kıpırdayan kozadaki kişi hâlâ nefes alıyor, yanındaki de alıyor ama daha zayıf. Üçüncü koza çoktan boşalmış.", en: "Whoever is in the moving cocoon is still breathing, and so is the one beside it, more weakly. The third has been empty a while." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kozaları kes, örümcekle yüzleş", en: "Cut the cocoons down and face the spider" }
            etkiler:
              - ahlak: { merhamet: 5 }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["karanlik", "dar_gecit"], kazan: "isaretli_agaclar_koza", kaybet: "isaretli_agaclar_yenilgi", kac: "isaretli_agaclar_kacis" }
          - id: "ates"
            etiket: { tr: "Ağı bir ateş şişesiyle tutuştur", en: "Torch the web with a fire flask" }
            gerekli: { esya: { ates_sisesi: 1 } }
            etkiler:
              - esya: { ates_sisesi: -1 }
              - ahlak: { merhamet: 3, duzen: -1 }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["karanlik", "yanici"], kazan: "isaretli_agaclar_koza", kaybet: "isaretli_agaclar_yenilgi", kac: "isaretli_agaclar_kacis" }
          - id: "geri"
            etiket: { tr: "Ağa düşmeden geri çekil", en: "Back off before you're stuck too" }
            etkiler:
              - ahlak: { merhamet: -4 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "isaretli_agaclar_kacis"

      - id: "isaretli_agaclar_koza"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Örümcek son bir kez kıvrılıp kendi ağının içine çöküyor. Kozaları kesip açarken ipek ellerine yapışıyor, bir türlü bırakmıyor.", en: "The spider curls one last time and collapses into its own web. You cut the cocoons open, and the silk clings to your hands and won't let go." }
          - { tr: "İkisinden canlı insan çıkıyor: dudakları morarmış, gözleri açık ama seni görmeyen bir adamla bir kadın. Üçüncüsünde bir çantayla bir isim etiketinden başka şey yok.", en: "Two of them hold living people, a man and a woman with blue lips and open eyes that don't see you. The third holds nothing but a backpack and a name tag." }
          - { tr: "Kadının dili sonunda çözüldüğünde ağzından çıkan ilk söz şu oluyor: \"Oklar su yazıyordu.\"", en: "When the woman can finally talk, the first thing she says is: \"The arrows said water.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "İkisini de en yakın kampa taşı", en: "Carry them both to the nearest camp" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 3 }
              - can: -5
              - itibar: { siginak: 2 }
              - bayrak: "dokuyucu_olduruldu"
            sonraki: "@akis"
          - id: "kazi"
            etiket: { tr: "Önce her okun üstüne uyarı kazı", en: "First, carve a warning over every arrow" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { sessiz_ag: 2 }
              - bilgi: "dokuyucu_isaretleri"
              - bayrak: "dokuyucu_olduruldu"
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "etiket"
            etiket: { tr: "Ölünün etiketini al; biri onu arıyordur", en: "Take the dead one's tag. Someone's looking for them" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { hayatta_kalan: 2 }
              - bayrak: "dokuyucu_olduruldu"
            sonraki: "@akis"

      - id: "isaretli_agaclar_yenilgi"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "İpek bileklerine dolandıkça dünya ağırlaşıp yavaşlıyor. Sonrasından aklında kalan tek şey, ipeği kesen bir bıçağın sesi.", en: "Silk wraps your wrists and the world slows down. All you remember after that is the sound of a knife slicing through silk." }
          - { tr: "Gözünü açtığında daireli oklardan birinin dibinde yatıyorsun; etrafta kimsecikler yok. Kabuğa yeni kazınmış küçük bir daire, altında da bir saat duruyor.", en: "When you open your eyes you're lying at the foot of one of the circled arrows, and nobody's around. There's a fresh little circle carved into the bark, with a time of day beneath it." }
          - { tr: "Biri seni kurtarmış ama yüzünü göstermemiş. Kozalar hâlâ kuzeyde, oldukları yerde asılı.", en: "Somebody saved you and didn't stick around to be thanked. The cocoons are still hanging up north." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Geri dönüp işi bitir", en: "Go back and finish the job" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["sis_dokuyucu"], ortam: ["karanlik"], kazan: "isaretli_agaclar_koza", kaybet: "isaretli_agaclar_kacis", kac: "isaretli_agaclar_kacis" }
          - id: "iz"
            etiket: { tr: "Seni kurtaranın izini sür", en: "Track whoever saved you" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - degisken: { hayatta_kalan: -2 }
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - bilgi: "agin_isaretleri"
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "isaretli_agaclar_kacis"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Ağdan kurtulmanın bedeli, kolundan bir şerit deri oluyor. Ağaçların arasından geri geri çekilirken sekiz göz seni izliyor ama gövde peşine düşmüyor.", en: "You leave a strip of skin from your forearm in the web getting loose. As you back off through the trees, eight eyes follow you, but the body doesn't." }
          - { tr: "Hiç acelesi yok onun. Kozalar orada duruyor, ağaçlardaki oklar da hâlâ aynı sözcüğü tekrarlıyor: SU.", en: "It's in no hurry. The cocoons are still there, and the arrows on the trees still say the same word: WATER." }
        secenekler:
          - id: "carpi"
            etiket: { tr: "Dönüş yolunda her oka çarpı at", en: "X out every arrow on your way back" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bilgi: "dokuyucu_isaretleri"
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Arkana bakmadan uzaklaş", en: "Get clear and don't look back" }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "@akis"

      - id: "isaretli_agaclar_sakli"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Daireli oklar seni batıya, yosun tutmuş bir kaya yığınına götürüyor. Kayaların arasına, yağmur almayacak bir kuytuya bir naylon torba sıkıştırılmış.", en: "The circled arrows lead you west, to a heap of mossy boulders. Tucked between them, out of the rain, sits a plastic bag." }
          - { tr: "İçinden iki şişe temiz su, bir avuç pil, el yapımı bir anten ve bir kâğıt çıkıyor. Kâğıttaki sayılar, harfler okunuyor okunmasına ama hiçbir anlam taşımıyor.", en: "Inside are two bottles of clean water, a handful of batteries, a homemade antenna and a sheet of paper. The numbers and letters on it are readable and mean nothing." }
          - { tr: "Kâğıdın altına biri karakalemle küçük bir not düşmüş: \"Bir şey alırsan bir şey bırak. Ağ böyle yaşar.\"", en: "At the bottom someone's penciled a little note: \"Take something, leave something. That's how the network stays alive.\"" }
        secenekler:
          - id: "hepsi"
            etiket: { tr: "Hepsini al", en: "Take all of it" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - esya: { kaynak_suyu: 2 }
              - itibar: { sessiz_ag: -3 }
              - iliski: { mert_kilic: { guven: -5 } }
            sonraki: "@akis"
          - id: "takas"
            etiket: { tr: "Suyu al, yerine kırmızı ot bırak", en: "Take the water, leave red herb in trade" }
            gerekli: { esya: { kirmizi_ot: 1 } }
            etkiler:
              - esya: { kirmizi_ot: -1, kaynak_suyu: 2 }
              - ahlak: { duzen: 3 }
              - itibar: { sessiz_ag: 3 }
              - iliski: { mert_kilic: { guven: 4 } }
            sonraki: "@akis"
          - id: "coz"
            etiket: { tr: "Kâğıttaki şifreyi çöz", en: "Crack the code on the paper" }
            gerekli: { stat: { int: 8 } }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bilgi: "agin_isaretleri"
              - xp: 40
              - itibar: { sessiz_ag: 2 }
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "not"
            etiket: { tr: "Kâğıdın arkasına sen de bir not yaz", en: "Leave a note of your own on the back" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - bayrak: "ag_mesaji_birakildi"
              - tohum: { olay: "mert_sifreli_mesaj", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "isaretli_agaclar_uyari"
        yer: "ogretici_orman"
        paragraflar:
          - { tr: "Bıçağınla her çentikli okun üstüne derin bir çarpı atıp yanına kaba bir kafatası kazıyorsun. Güzel olmuyor ama okunuyor.", en: "With your knife you gouge a deep X over every notched arrow and scratch a crude skull beside it. It isn't pretty, but it's legible." }
          - { tr: "Son ağaca geldiğinde, batıdaki daireli oklardan birinin yanına taze bir işaret eklendiğini görüyorsun: senin çarpın küçültülüp çizilmiş, yanına da bir soru işareti konmuş.", en: "At the last tree you notice a fresh mark beside one of the circled arrows to the west. It's your X, drawn small, with a question mark next to it." }
          - { tr: "Birileri seni izliyor; düşmanca değil, merakla.", en: "Somebody's watching you. Not hostile. Curious." }
        secenekler:
          - id: "cevap"
            etiket: { tr: "Soru işaretinin yanına bir daire çiz", en: "Draw a circle next to the question mark" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { mert_kilic: { guven: 3 } }
              - bayrak: "ag_mesaji_birakildi"
            sonraki: "@akis"
          - id: "sil"
            tur: "gizle"
            etiket: { tr: "İşareti kazıyıp sil; iz bırakma", en: "Scrape the mark off. Leave no trail" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

  # ================================================================== gece baskını
  - id: "gece_baskini"
    perde: [1]
    gun: { min: 6, max: 26 }
    agirlik: 4
    etiketler: ["savas", "kurtarma", "ahlak", "gece"]
    gerilim: 4
    onemli: true
    kart: { tr: "Gece baskını", en: "Night raid" }
    sahne: "gece_baskini_1"
    sahneler:
      - id: "gece_baskini_1"
        paragraflar:
          - { tr: "Gece yarısı çoktan geçmiş. Yolda rastladığın on beş kişilik bir grupla aynı ateşin başındasın: üç çadır, bir el arabası dolusu erzak, uyuyan altı çocuk.", en: "It's past midnight. You're sharing a fire with fifteen people you met on the road: three tents, one wheelbarrow of supplies and six sleeping kids." }
          - metin: { tr: "Akşam sırtta bir fener görmüştün. Işığında {fraksiyon:yukselenler|in} göz işareti bir an parlamış, ardından fener sönmüştü.", en: "Earlier tonight you saw a lantern up on the ridge. For a second the eye sigil of {fraksiyon:yukselenler} caught its light, and then the lantern went dark." }
            kosul: { bayrak: "yabanci_dusman" }
          - metin: { tr: "Kamp meyve korusunun dibine kurulmuş. Bugün kimse aç kalmadı ama gece çökünce koru başka açları da kendine çağırır.", en: "The camp's at the foot of the fruit grove. Nobody went hungry today, but at night the grove calls in other hungry things." }
            kosul: { bayrak: "bereket_kamp" }
          - metin: { tr: "Ateşin ötesindeki karanlıktan iki kez, düzenli aralıklarla yere vurulan bir borunun tıkırtısını duydun.", en: "Twice tonight, out past the firelight, you heard a pipe tapping the ground in slow, patient time." }
            kosul: { bayrak: "avci_dusman" }
          - { tr: "Ateş, biri üflemişçesine bir anda yere yatıyor. Ardından dört bir yandan birden uluma kopuyor.", en: "The fire flattens all at once, like somebody blew on it. Then the howling starts from every direction at once." }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Sürü iki koldan geliyor. Doğudaki gürültü yem; asıl saldırı batıdan, çocukların çadırına.", en: "The pack's coming in two waves. The racket to the east is a feint, and the real hit is coming from the west, straight at the kids' tent." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "herkesi kurtaramazsın. ama kimin yaşayacağını seçebilirsin. o da bir güç; hoşuna gitmeyecek kadar büyük bir güç.", en: "you can't save everyone. but you can pick who lives. that's power too, more than you're going to like." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Sen çocuklara koş! Erzak bende!\"", en: "\"You get the kids! I'll hold the supplies!\"" }
        secenekler:
          - id: "cocuklar"
            etiket: { tr: "Çocukların çadırının önüne dikil", en: "Plant yourself in front of the kids' tent" }
            etkiler:
              - ahlak: { merhamet: 6 }
              - savas: { dusmanlar: ["sis_tazisi", "sis_tazisi"], ortam: ["karanlik"], kazan: "gece_baskini_cocuklar", kaybet: "gece_baskini_yenilgi", kac: "gece_baskini_kacis" }
          - id: "erzak"
            etiket: { tr: "Erzağı ve ateşi koru", en: "Guard the supplies and the fire" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -3 }
              - degisken: { hayatta_kalan: -2 }
              - savas: { dusmanlar: ["sis_tazisi"], ortam: ["karanlik"], kazan: "gece_baskini_erzak", kaybet: "gece_baskini_yenilgi", kac: "gece_baskini_kacis" }
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|in} yanına koş", en: "Run to {npc:deniz_arman|pos} side" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -2 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
              - degisken: { hayatta_kalan: -3 }
              - savas: { dusmanlar: ["sis_tazisi"], ortam: ["karanlik"], kazan: "gece_baskini_deniz", kaybet: "gece_baskini_yenilgi", kac: "gece_baskini_kacis" }
          - id: "ates"
            etiket: { tr: "Yanan dalları kampın çevresine saç", en: "Scatter burning branches in a ring around camp" }
            gerekli: { stat: { int: 8 } }
            etkiler:
              - ahlak: { duzen: -2, merhamet: 3 }
            sonraki: "gece_baskini_atesli"
          - id: "ezme"
            tur: "gosteris"
            etiket: { tr: "Ateşin ışığına çık; sürü seni görsün", en: "Step into the firelight. Let the pack see you" }
            goster: { bayrak: "kirilma_yasandi" }
            gerekli: { stat: { str: 15 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 3 }
              - dikkat: 3
              - efsane: "tek_basina_suru"
              - degisken: { hayatta_kalan: 4 }
            sonraki: "gece_baskini_ezme"
          - id: "kac"
            tur: "gizle"
            etiket: { tr: "Karanlığa sıvış; kendini kurtar", en: "Slip into the dark and save yourself" }
            etkiler:
              - gizle: 3
              - ahlak: { merhamet: -8, insanlik: -4 }
              - degisken: { hayatta_kalan: -4 }
              - bayrak: "baskin_kacti"
            sonraki: "gece_baskini_terk"

      - id: "gece_baskini_cocuklar"
        paragraflar:
          - { tr: "Son tazı da buhar olup dağılıyor. Arkanda, çadırın girişinde altı çocuk soluğunu tutmuş bekliyor; hiçbiri ağlamıyor.", en: "The last hound comes apart into steam. Behind you, in the tent flap, six kids are holding their breath, and not one of them is crying." }
          - { tr: "Ama doğu tarafı fazla sessiz. Erzak arabası devrilmiş; ateşin yanında yatan iki kişi yerden kalkmıyor.", en: "But the east side is too quiet. The supply cart's on its side, and two people are lying by the fire, not getting up." }
          - { tr: "Sabaha karşı ağaçların arasında fenerler beliriyor: kollarında kırmızı bant taşıyan silahlı avcılar, ateşin ışığını görüp gelmişler.", en: "Toward dawn, lanterns show up between the trees. Armed hunters with red armbands saw the fire and came." }
        secenekler:
          - id: "goster"
            etiket: { tr: "Avcılara yaralıları göster", en: "Show the hunters the wounded" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
              - bayrak: "baskin_cocuklar"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "gom"
            etiket: { tr: "Ölüler gömülmeden kimse yola çıkmasın", en: "Nobody moves until the dead are buried" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3 }
              - bayrak: "baskin_cocuklar"
            sonraki: "@akis"
          - id: "anlasma"
            etiket: { tr: "Pazarlık et: kamp avcılara katılsın", en: "Cut a deal. The camp joins the hunters" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -1 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { lonca: 5 }
              - iliski: { kaya_demir: { guven: 3, saygi: 3 } }
              - bayrak: "baskin_cocuklar"
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "gece_baskini_erzak"
        paragraflar:
          - { tr: "Ateş yanıyor, erzak arabası yerli yerinde. Ne var ki batıdan bir çığlık kopuyor; sen oraya varana kadar çadırın bezi lime lime olmuş.", en: "The fire's still going and the cart's still standing. But a scream goes up from the west, and by the time you get there the tent's in shreds." }
          - { tr: "Altı çocuktan ikisi yok. Annelerden biri sise doğru haykırıyor; öteki toprağa çöküp kalmış, kılını kıpırdatmıyor.", en: "Two of the six kids are gone. One mother is screaming into the fog, and the other has sat down in the dirt and isn't moving." }
          - { tr: "Kurtardığın erzak üç gün idare eder. Sana teşekkür eden çıkmıyor.", en: "The supplies you saved will last three days. Nobody thanks you." }
        secenekler:
          - id: "ara"
            etiket: { tr: "Sise dal; eksik çocukları ara", en: "Go into the fog after the missing kids" }
            zar: { stat: "per", zorluk: 13, tek: true, basarisiz: "gece_baskini_bos", basarisiz_etkiler: [{ ahlak: { insanlik: 2 } }] }
            etkiler:
              - ahlak: { merhamet: 5 }
              - degisken: { hayatta_kalan: 2 }
            sonraki: "gece_baskini_bulundu"
          - id: "paylas"
            etiket: { tr: "Erzağı annelere ver", en: "Give the supplies to the mothers" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"
          - id: "hesap"
            etiket: { tr: "Erzağı say, paylaştır; yaşayan yaşamalı", en: "Count it, ration it. The living have to live" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "@akis"

      - id: "gece_baskini_bulundu"
        paragraflar:
          - { tr: "Sisin içinde, bir kökün altındaki oyukta iki çocuk birbirine sarılmış duruyor. Oyuk öyle dar ki tazılar onları çıkaramamış.", en: "In the fog, in a hollow under a root, two kids are clinging to each other. The gap was too narrow for the hounds to dig them out." }
          - { tr: "Seni görünce ikisi birden hüngür hüngür ağlamaya başlıyor; bütün gece duyduğun en güzel ses bu.", en: "When they see you, they both start bawling. It's the best sound you've heard all night." }
        secenekler:
          - id: "tasi"
            etiket: { tr: "İkisini de kampa taşı", en: "Carry them both back to camp" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"

      - id: "gece_baskini_bos"
        paragraflar:
          - { tr: "Sabaha kadar arayıp tarıyorsun. Eline geçen bir tek ayakkabıyla yırtık bir battaniye; başka hiçbir şey yok.", en: "You search until morning. You find one shoe and a torn blanket, and nothing else." }
          - { tr: "Gün ağarırken sis inceliyor ama yuttuklarından hiçbirini geri vermiyor.", en: "As the sky grays, the fog thins out, but it gives nothing back." }
        secenekler:
          - id: "ayakkabi"
            etiket: { tr: "Ayakkabıyı annesine götür", en: "Take the shoe back to the mother" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Kimseye bir şey söyleme", en: "Don't tell anyone anything" }
            etkiler:
              - ahlak: { insanlik: -2 }
            sonraki: "@akis"

      - id: "gece_baskini_deniz"
        paragraflar:
          - { tr: "{npc:deniz_arman} sırtını senin sırtına dayıyor; ikiniz bir pergel gibi dönüp duruyorsunuz. Son tazı da düşünce nefes nefese gülmeye başlıyorsunuz, neye güldüğünüzü ikiniz de bilmeden.", en: "{npc:deniz_arman} puts {zamir:deniz_arman|onun} back to yours and the two of you turn like a compass. When the last hound drops you're both gasping and laughing, and neither of you knows why." }
          - { tr: "Sonra çocukların çadırına kulak kesiliyorsunuz. Oradan tek ses gelmiyor.", en: "Then you both listen for the kids' tent. No sound is coming from it." }
          - { tr: "{npc:deniz_arman} önce çadıra, sonra sana bakıyor. \"Benim için mi geldin?\" diye soruyor; sesinde teşekkürden eser yok.", en: "{npc:deniz_arman} looks at the tent, then at you. \"You came for me?\" {zamir:deniz_arman|o} ask{zamir:deniz_arman|s}, and there's no thank-you in it." }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Evet. Seni kaybedemezdim.\"", en: "Yes. I couldn't lose you" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: -1 }
              - iliski: { deniz_arman: { baglilik: 6, guven: -2 } }
            sonraki: "@akis"
          - id: "cadir"
            etiket: { tr: "Çadıra koş; belki hâlâ...", en: "Run to the tent. Maybe there's still..." }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "@akis"

      - id: "gece_baskini_atesli"
        paragraflar:
          - { tr: "Yanan dallar kampın çevresinde kesik kesik bir halka çiziyor. Tazılar ateşin kıyısında dönüp hırlıyor ama içeri adım atamıyor.", en: "The burning branches make a broken ring around the camp. The hounds circle at the edge of the fire, snarling, but they don't come in." }
          - { tr: "Sabaha kadar halkayı besleyip duruyorsun. Bir çadır alev alınca onu gözden çıkarıyorsun; içinde kimse yok, yalnız grubun bütün battaniyeleri.", en: "You feed the ring until dawn. One tent catches and you let it go; nobody's inside, just every blanket the group owns." }
          - { tr: "Gün ağardığında tazılardan eser kalmamış. On beş kişinin on beşi de ayakta.", en: "When the sky goes gray, the hounds are gone. Fifteen people, and all fifteen are standing." }
        secenekler:
          - id: "ogret"
            etiket: { tr: "Ateş halkasını herkese öğret", en: "Teach everyone how to build the fire ring" }
            etkiler:
              - ahlak: { duzen: 3 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 2, sessiz_ag: 1 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "@akis"
          - id: "yola"
            etiket: { tr: "İlk ışıkla onları yola çıkar", en: "Get them moving at first light" }
            etkiler:
              - ahlak: { duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - tohum: { olay: "kaya_ilk_tanisma", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "gece_baskini_ezme"
        paragraflar:
          - { tr: "Ateşin ışığına adım atıp olduğun yerde duruyorsun. Hiçbir şey yapmadan, öylece bakıyorsun.", en: "You step into the firelight and stay there. You don't do anything; you just look." }
          - { tr: "Sürünün başı daha ilk adımında donakalıyor; kulaklarını geriye yatırıp kuyruğunu bacaklarının arasına kıstırıyor. Ardından hepsi birden, geldikleri gibi sessizce sise karışıp gidiyor.", en: "The pack leader freezes mid-stride, ears flat and tail tucked. Then all of them melt back into the fog at once, as quietly as they came." }
          - { tr: "Arkanda on beş kişi soluğunu tutmuş. Çocuklardan biri fısıldıyor: \"Bu insan mı?\"", en: "Behind you, fifteen people hold their breath. One of the kids whispers, \"Is that a person?\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistem bunu kaydetti. ben de kaydettim. bir de başka biri kaydetti; kim, bilmiyorum.", en: "the system logged that. so did i. someone else did too, and i don't know who." }
        secenekler:
          - id: "aciga"
            tur: "aciga_vur"
            etiket: { tr: "Onlara ne olduğunu açıkça söyle", en: "Tell them exactly what you are" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 4, yukselenler: 3, siginak: -1 }
              - iliski: { vahit: { saygi: 4 } }
            sonraki: "@akis"
          - id: "sans"
            tur: "gizle"
            etiket: { tr: "\"Şans işte. Tazılar ateşten korktu.\"", en: "Call it luck. The hounds were scared of the fire" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"
          - id: "cocuk"
            etiket: { tr: "Çocuğun yanına çömel: \"Evet. Hâlâ.\"", en: "Crouch down by the kid. \"Yeah. Still.\"" }
            etkiler:
              - ahlak: { insanlik: 5 }
              - itibar: { siginak: 2 }
            sonraki: "@akis"

      - id: "gece_baskini_yenilgi"
        paragraflar:
          - { tr: "Bir tazının dişleri omzuna geçince yere yıkılıyorsun. Sis gözlerinin içine doluyor.", en: "A hound's teeth sink into your shoulder and you go down. The fog pours into your eyes." }
          - { tr: "Uyandığında gün ağarmış, ateş sönmüş. Biri seni battaniyeye sarmış, başucuna da su bırakmış.", en: "When you wake up it's dawn and the fire's out. Somebody wrapped you in a blanket and left water by your head." }
          - { tr: "Kampın yarısı gece kaçmış ya da başına daha kötüsü gelmiş. Kalanlar sana kızgın değil; yorgun gözlerle bakıyorlar, o kadar.", en: "Half the camp is gone, run off in the night or worse. The ones left aren't angry with you, just looking at you with tired eyes." }
        secenekler:
          - id: "topla"
            etiket: { tr: "Kalk, geride kalanları topla", en: "Get up and gather who's left" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "battaniye"
            etiket: { tr: "Battaniyenin kimin olduğunu sor", en: "Ask whose blanket this is" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - degisken: { hayatta_kalan: -2 }
              - itibar: { siginak: 1 }
            sonraki: "@akis"

      - id: "gece_baskini_kacis"
        paragraflar:
          - { tr: "Bir anlığına, yalnızca bir anlığına tazıların arasında bir boşluk gözüne çarpıyor; hemen oradan sıvışıyorsun.", en: "For a second, just one, you see a gap between the hounds, and you slip through it." }
          - { tr: "Arkandan gelen sesler uzun sürmüyor. Sabah döndüğünde ateşin çevresinde kimsecikler yok; geriye ayak izleri, kan ve devrilmiş bir el arabası kalmış.", en: "The noise behind you doesn't last long. When you come back in the morning there's nobody around the fire, only footprints, blood and an overturned wheelbarrow." }
        secenekler:
          - id: "iz"
            etiket: { tr: "İzlerin peşine düş; kurtulanları bul", en: "Follow the tracks. Find the survivors" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - degisken: { hayatta_kalan: -2 }
            sonraki: "@akis"
          - id: "topla"
            etiket: { tr: "Arabadan kalanları toplayıp git", en: "Pick through the wreck and go" }
            etkiler:
              - ahlak: { insanlik: -4 }
              - esya: { kizarmis_et: 2 }
              - degisken: { hayatta_kalan: -4 }
            sonraki: "@akis"

      - id: "gece_baskini_terk"
        paragraflar:
          - { tr: "Karanlığa sıvışıyorsun. Arkanda ulumalar, çığlıklar yükselip alçalıyor, derken kesiliveriyor.", en: "You slip into the dark. The howls and the screams rise behind you, then fall, then stop." }
          - { tr: "Sabah kampın dumanını uzaktan görüyorsun: ince, dümdüz yükselen bir duman. Artık kimsenin beslemediği bir ateşin dumanı.", en: "In the morning you see the camp's smoke from far off. It's thin and dead straight, the smoke of a fire nobody's feeding anymore." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hayatta kaldın. sistem bunu başarı sayıyor. ben saymıyorum ama ne de olsa ben bir hatayım, değil mi?", en: "you survived. the system counts that as a win. i don't, but i'm just a glitch, right?" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Dumanı izle", en: "Watch the smoke" }
            etkiler:
              - ahlak: { insanlik: -2 }
            sonraki: "@akis"
          - id: "gom"
            etiket: { tr: "Geri dönüp kalanları göm", en: "Go back and bury what's left" }
            etkiler:
              - ahlak: { insanlik: 4 }
            sonraki: "@akis"

  # ================================================================== sıralama günü
  - id: "siralama_gunu"
    perde: [1]
    gun: { min: 6, max: 10 }
    agirlik: 7
    etiketler: ["sistem", "siralama", "gizli_guc"]
    gerilim: 2
    kart: { tr: "İlk sıralama", en: "The first ranking" }
    sahne: "siralama_gunu_1"
    sahneler:
      - id: "siralama_gunu_1"
        paragraflar:
          - { tr: "Öğle vakti gökyüzü kararıyor. Kararan bulut değil: ufuktan ufka uzanan tek bir pencere, herkesin başının üstünde birden açılıyor.", en: "At noon the sky goes dark. It isn't clouds but a single window stretching horizon to horizon, opening over every head at once." }
          - { tr: "Sütun sütun isimler akarken gözün ikisine takılıyor: {npc:kaya_demir|tam} ile {npc:aras_kurt|tam}. İkisinin de adı şimdiden dilden dile dolaşıyor.", en: "Names pour down in columns, and two of them snag your eye: {npc:kaya_demir|tam} and {npc:aras_kurt|tam}. People are already talking about both." }
          - { tr: "Ardından pencere kişiye özel hâle gelip herkesin önüne kendi satırını çıkarıyor: ad, sıra, seviye. Çevrendekiler ya bağırmaya başlıyor ya da derin bir sessizliğe gömülüyor.", en: "Then the window gets personal, and everyone's own line appears in front of them: name, rank, level. Around you, people either start yelling or go very quiet." }
          - metin: { tr: "Senin satırında iki sayı var; birini yalnızca sen görebiliyorsun. {npc:yanki} sır veren bir çocuk gibi fısıldıyor: onlar küçüğünü görüyor, büyüğü bizim.", en: "Your line has two numbers, and only you can see one of them. {npc:yanki} whispers like a kid sharing a secret: they see the little one. the big one's ours." }
            kosul: { gizli_fark_min: 1 }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "KÜRESEL SIRALAMA · İLK YAYIN", en: "GLOBAL RANKING · FIRST BROADCAST" }
            satirlar:
              - { tr: "Öğretici Katman'daki tüm katılımcılar sıralandı.", en: "All Tutorial Layer participants have been ranked." }
              - { tr: "Sıralama gerçek zamanlı güncellenir. Ölen katılımcı listeden otomatik olarak çıkarılır.", en: "Rankings update in real time. Death triggers automatic removal." }
              - { tr: "İyi şanslar. (İsteğe bağlı.)", en: "Good luck. (Optional.)" }
        sezgiler:
          - kosul: { stat: { per: 8 } }
            metin: { tr: "Liste bir an bile durmuyor. Birkaç saniyede bir satırlardan biri siliniyor, altındaki bütün isimler bir sıra yukarı kayıyor.", en: "The list never stops moving. Every few seconds a line vanishes and every name below it slides up one." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onlara bir sayı verdim. gerçeğini bende saklıyorum. rica ederim.", en: "i gave them a number. i'm keeping the real one. you're welcome." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Ben kaçıncıyım? Yok, söyleme. Ya da söyle.\"", en: "\"Where am I on there? No, don't tell me. Or do.\"" }
        secenekler:
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "{npc:yanki|e} söyle, sayını daha da düşürsün", en: "Tell {npc:yanki} to push your number even lower" }
            etkiler:
              - gizle: 6
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 5 } }
              - bilgi: "sirala_maske"
              - bayrak: "sirala_gizlendi"
            sonraki: "siralama_gunu_golge"
          - id: "isik"
            tur: "aciga_vur"
            etiket: { tr: "Maskeyi indir; gerçek sayın görünsün", en: "Drop the mask. Let them see the real number" }
            goster: { gizli_fark_min: 1 }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 4, yukselenler: 4, siginak: -1 }
              - iliski: { aras_kurt: { saygi: 10, guven: -5 } }
              - iliski: { kaya_demir: { saygi: 5 } }
              - bilgi: "sirala_maske"
              - bayrak: "sirala_acildi"
              - tohum: { olay: "rakip_iz", gecikme: { min: 1, max: 3 } }
            sonraki: "siralama_gunu_isik"
          - id: "kalabalik"
            etiket: { tr: "Kalabalığı izle: kim seviniyor, kim yıkılıyor", en: "Watch the crowd. Who's cheering, who's breaking" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "siralama_gunu_kalabalik"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} sırasını kendin söyle", en: "Tell {npc:deniz_arman} {zamir:deniz_arman|onun} rank yourself" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "siralama_gunu_deniz"

      - id: "siralama_gunu_golge"
        paragraflar:
          - { tr: "Satırındaki sayı titreyip küçülüyor; liste seni yüzlerce isim aşağıya, kimsenin dönüp bakmadığı bir yere itiyor.", en: "The number on your line flickers and shrinks. The list shoves you hundreds of names down, somewhere nobody bothers to look." }
          - { tr: "{npc:yanki} kulağının dibinde fısıldıyor: görünmezlik bir zırhtır. ama zırh ağırdır. bir gün çıkarıp atmak isteyeceksin.", en: "{npc:yanki} whispers right in your ear: invisibility is armor. but armor's heavy. someday you'll want to take it off." }
          - { tr: "Çevrende dönüp sana bakan tek kişi yok. Şu an dünyada bundan daha rahatlatıcı bir şey olamaz.", en: "Nobody around you turns to look. Right now that's the most comforting thing in the world." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Sessizce yoluna devam et", en: "Move on quietly" }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 2
            sonraki: "@akis"
          - id: "neden"
            etiket: { tr: "{npc:yanki|e} seni neden sakladığını sor", en: "Ask {npc:yanki} why it's hiding you" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 3, baglilik: 2 } }
            sonraki: "siralama_gunu_yanki"

      - id: "siralama_gunu_yanki"
        paragraflar:
          - { tr: "{npc:yanki} uzun uzun susuyor. Sonunda fısıltısı geliyor: çünkü liste bir menü. menüyü okuyanların da hepsi insan değil.", en: "{npc:yanki} is silent a long time. Then the whisper comes: because the list is a menu. and not everyone reading it is human." }
          - { tr: "Fazlasını söylemiyor. Yeniden sorduğunda iki istasyon arasında kalmış bir radyo gibi cızırdamaktan başka bir şey yapmıyor.", en: "It won't say more. When you ask again there's only static, like a radio stuck between stations." }
        secenekler:
          - id: "not"
            etiket: { tr: "Bunu aklının bir köşesine yaz", en: "File that away somewhere safe" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "siralama_gunu_isik"
        paragraflar:
          - { tr: "Satırındaki sayı titreyip gerçeğine dönüşüyor. Liste bir an duraksıyor, ardından adın yüzlerce sıra yukarı fırlıyor.", en: "The number on your line flickers and becomes the real one. The list hitches for a second, then your name rockets up hundreds of rows." }
          - { tr: "Çevrendekiler sana dönüyor. Biri bir adım geri çekiliyor, öteki bir adım yaklaşıyor; ikisinin de nedeni aynı.", en: "The people around you turn. One takes a step back and one takes a step closer, for exactly the same reason." }
          - { tr: "Pencerenin köşesinde yalnızca sana görünen küçük bir satır beliriyor: [{npc:aras_kurt} profilini görüntüledi.]", en: "A small line pops up in the corner of the window, just for you: [{npc:aras_kurt} viewed your profile.]" }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Yaklaşanları bekle", en: "Wait for the ones walking over" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - dikkat: 2
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kalabalığın ortasından çekip git", en: "Walk straight out through the crowd" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "siralama_gunu_kalabalik"
        paragraflar:
          - { tr: "Kalabalığın içinde, ilk bine girmiş bir kadın kahkahalarla zıplayıp duruyor. Yanındaki adamsa son yüzün arasında, listenin en dibinde; gözünü pencereden ayırmadan ha bire kolunu çimdikliyor.", en: "In the crowd, a woman who made the top thousand is jumping up and down, laughing. The man next to her keeps staring at his window and pinching his own arm, because he's in the last hundred." }
          - { tr: "{npc:vahit|in} beyazlılarından biri bir kütüğün üstüne çıkmış, avazı çıktığı kadar bağırıyor: \"Sistem hükmünü verdi! Üsttekiler seçilmiş, alttakiler yakıt!\" Kalabalığın bir kısmı başını sallayarak onaylıyor.", en: "One of {npc:vahit|pos} people in white has climbed a stump, shouting, \"The System has spoken! The top are the Chosen and the bottom is fuel!\" Part of the crowd is nodding." }
          - { tr: "Dipteki adam pencereyi kapatıp sise doğru yürümeye başlıyor; ağır ağır, hiç acele etmeden, geri dönmeyecek birinin yürüyüşüyle.", en: "The man from the bottom closes his window and starts walking toward the fog. He walks slowly, without hurry, the way people walk when they aren't coming back." }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Vaizin görünen seviyesi 4. Ama o kendi satırına hiç bakmıyor; gözü hep kalabalığın yüzlerinde.", en: "The preacher's showing level 4. But he never looks at his own line, only at the faces in the crowd." }
        secenekler:
          - id: "adam"
            etiket: { tr: "Dipteki adamın peşinden git", en: "Go after the man from the bottom" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
            sonraki: "siralama_gunu_dip"
          - id: "indir"
            etiket: { tr: "Vaizi kütükten indir", en: "Pull the preacher off his stump" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { yukselenler: -4, siginak: 2 }
              - degisken: { hayatta_kalan: -1 }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Vaizi sonuna kadar dinle", en: "Hear the preacher out" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - itibar: { yukselenler: 3 }
              - degisken: { hayatta_kalan: -1 }
              - tohum: { olay: "vahit_vaaz", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "siralama_gunu_dip"
        paragraflar:
          - { tr: "Sisin kıyısında ona yetişiyorsun. Adam durmuyor bile; yalnızca \"Sıralamayı gördün mü? Ben yakıtmışım,\" diyor.", en: "You catch up to him at the edge of the fog. He doesn't stop, just says, \"You see the ranking? Turns out I'm fuel.\"" }
          - { tr: "Elleri bir muhasebecininki gibi yumuşak, mürekkep lekeli. Kırk iki yaşında; Entegrasyon'dan beri tek bir canlı öldürememiş, artık denemek de istemiyor.", en: "He's got an accountant's hands, soft and ink-stained. Forty-two years old, he hasn't killed a single thing since Integration, and he doesn't want to try anymore." }
        secenekler:
          - id: "sayi"
            etiket: { tr: "Listenin bir anlamı olmadığını söyle; sayılar değişir", en: "Tell him the list's nothing. Numbers change" }
            zar: { stat: "cha", zorluk: 11, tek: true, basarisiz: "siralama_gunu_sis", basarisiz_etkiler: [{ ahlak: { insanlik: 1 } }, { degisken: { hayatta_kalan: -1 } }] }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "siralama_gunu_kalir"
          - id: "sir"
            etiket: { tr: "Ona bir sır ver: sayılar yalan söyler", en: "Let him in on a secret. The numbers lie" }
            goster: { gizli_fark_min: 1 }
            etkiler:
              - ahlak: { insanlik: 4 }
              - degisken: { hayatta_kalan: 1 }
              - dikkat: 1
            sonraki: "siralama_gunu_kalir"
          - id: "is"
            etiket: { tr: "Ona bir iş ver: kampın hesabını tutsun", en: "Put him to work keeping the camp's books" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 2 }
            sonraki: "siralama_gunu_kalir"

      - id: "siralama_gunu_kalir"
        paragraflar:
          - { tr: "Adam durup uzun uzun sise bakıyor. Sonra geri dönüp seninle birlikte ateşe doğru yürüyor.", en: "He stops and looks at the fog for a long time. Then he turns around and walks back toward the fire with you." }
          - { tr: "Yol boyunca ağzını açmıyor. Ama bir kez, yalnızca bir kez pencereyi açıyor ve satırına bakmadan geri kapatıyor.", en: "He doesn't talk the whole way. But once, just once, he opens his window and closes it again without looking at his line." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu ateşin yanına oturt", en: "Sit him down by the fire" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "siralama_gunu_sis"
        paragraflar:
          - { tr: "Sözlerin ona ulaşmıyor. \"Sen ilk bindesindir herhalde,\" diyor yüzüne bakmadan. \"Senin için konuşmak kolay.\"", en: "Your words don't reach him. \"You're probably top thousand,\" he says without looking at you. \"Easy for you to say.\"" }
          - { tr: "Sise adımını atar atmaz sis onu bir solukta yutuyor. Bir dakika sonra listedeki satırlardan biri sessizce siliniyor.", en: "He steps into the fog, and it swallows him in a single breath. A minute later, one of the lines on the list quietly disappears." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Listede isimlerin bir sıra yukarı kaymasını izle", en: "Watch the names below slide up one" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"
          - id: "hatirla"
            etiket: { tr: "Adını sormadığın için kendine kız", en: "Curse yourself for never asking his name" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "siralama_gunu_deniz"
        paragraflar:
          - { tr: "{npc:deniz_arman} önce kendi satırına, sonra seninkine, ardından yine kendininkine bakıyor. Aradaki mesafe bir sayıdan fazlası gibi.", en: "{npc:deniz_arman} looks at {zamir:deniz_arman|onun} own line, then at yours, then back at {zamir:deniz_arman|onun} own. The distance between them feels like more than a number." }
          - { tr: "\"Ben şuralarda bir yerdeyim,\" diyor, parmağıyla listenin ortasını göstererek. \"Sen aslında orada yazan yerde değilsin, değil mi?\"", en: "\"I'm somewhere around here,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, tapping the middle of the list. \"You're not really where it says, are you?\"" }
        secenekler:
          - id: "dogru"
            etiket: { tr: "Gerçeği söyle: sayın sahte", en: "Tell the truth. Your number's a fake" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { guven: 8, baglilik: 4 } }
              - bilgi: "sirala_maske"
              - dikkat: 1
            sonraki: "@akis"
          - id: "yalan"
            etiket: { tr: "Bunun bir Sistem hatası olduğunu söyle", en: "Say it's a System glitch. Nothing more" }
            etkiler:
              - ahlak: { duzen: -2 }
              - iliski: { deniz_arman: { guven: -2 } }
              - yalan: { npc: "deniz_arman", konu: "sirala_maske" }
            sonraki: "@akis"
          - id: "birlikte"
            etiket: { tr: "\"Sıra önemli değil. Birlikte tırmanırız.\"", en: "\"Rank doesn't matter. We climb together.\"" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 2 }
              - iliski: { deniz_arman: { baglilik: 6 } }
            sonraki: "@akis"

  # ================================================================== sahte seviye
  - id: "sahte_seviye"
    perde: [1]
    bolge: ["harabe_carsi"]
    gun: { min: 12, max: 26 }
    kosul: { bayrak: "kirilma_yasandi" }
    agirlik: 5
    etiketler: ["ahlak", "gizli_guc", "hakimiyet"]
    gerilim: 2
    onemli: true
    kart: { tr: "On dokuzuncu seviye", en: "Level nineteen" }
    sahne: "sahte_seviye_1"
    sahneler:
      - id: "sahte_seviye_1"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Durmuş yürüyen merdivenin dibinde otuz kişilik bir kuyruk uzanıyor; herkesin elinde ya bir konserve ya bir pil ya da bir çift ayakkabı. Kuyruğun başında, bir mağaza tezgâhının ardında iri yarı bir adam oturuyor.", en: "There's a line of thirty people at the foot of the dead escalator, each holding a can of food, a battery or a pair of shoes. At the head of the line, behind a store counter, sits a big guy." }
          - { tr: "Başının üstünde, herkesin görebileceği yerde bir analiz penceresi asılı: Seviye 19. Öğretici'de bu sayıyı taşıyan bir avuç insan var; itiraz eden de çıkmıyor.", en: "Hanging over his head, where everybody can see it, is an analysis window: Level 19. Only a handful of people in the Tutorial carry a number like that, and nobody argues." }
          - { tr: "Kuyruktaki yaşlı bir kadın sana fısıldıyor: \"Koruma ücreti bu. Vermezsen gece çete gelirmiş, verirsen o kovarmış. Öyle diyor.\"", en: "An old woman in line whispers to you: \"It's a protection fee. Don't pay and the gang comes at night, pay and he runs them off. That's what he says.\"" }
          - metin: { tr: "Adam seni görünce bir an duraksıyor; sıralamadan tanımış. Yüzünün rengi bir ton atıyor.", en: "The guy spots you and freezes for half a second. He knows you from the ranking, and his face goes a shade paler." }
            kosul: { bayrak: "sirala_acildi" }
        bildirimler:
          - tur: "analiz"
            nadirlik: "siradan"
            baslik: { tr: "Tezgâhtaki adam", en: "The man at the counter" }
            satirlar:
              - { tr: "Görünen Sv. 19 · Gerçek Sv. 4", en: "Shown Lv. 19 · True Lv. 4" }
              - { tr: "Etkin yetenek: Vitrin Işığı (Sıradan) · yanılsama", en: "Active skill: Storefront Glow (Common) · illusion" }
            kosul: { stat: { per: 14 } }
        sezgiler:
          - kosul: { stat: { per: 10 } }
            metin: { tr: "Tezgâhın altında adamın bacakları titriyor. On dokuzuncu seviyedeki biri böyle oturmaz.", en: "Under the counter, his legs are shaking. A level nineteen doesn't sit like that." }
          - kosul: { stat: { per: 14 } }
            metin: { tr: "Penceresinin kenarları her nefeste biraz daha soluyor. Korkuya kapılırsa yanılsamayı tutamaz.", en: "The edges of his window fade a little with every breath. If he gets scared, he won't be able to hold it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onun kendisi için yaptığını ben senin için yapıyorum. farkımız şu: benim yalanım işe yarıyor.", en: "he's doing for himself what i do for you. difference is, my lie actually works." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            metin: { tr: "\"Bir terslik var. Adam korkudan ölüyor, görmüyor musun?\"", en: "\"Something's off. That guy's scared, can't you see it?\"" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Gerçek seviyesini kuyruğa söyle", en: "Tell the line his real level" }
            gerekli: { stat: { per: 14 } }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
              - bilgi: "sahte_seviye_gercek"
              - bayrak: "sahte_ifsa"
            sonraki: "sahte_seviye_kalabalik"
          - id: "tezgah"
            tur: "gosteris"
            etiket: { tr: "Tezgâhın kenarını iki parmakla kopar", en: "Pinch a chunk off the counter with two fingers" }
            gerekli: { stat: { str: 16 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - dikkat: 3
            sonraki: "sahte_seviye_titreme"
          - id: "ozel"
            etiket: { tr: "Kuyruktan çık; onunla baş başa konuş", en: "Step out of line. Talk to him alone" }
            zar: { stat: "cha", zorluk: 13, tek: true, basarisiz: "sahte_seviye_tehdit", basarisiz_etkiler: [{ ahlak: { duzen: -1 } }] }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "sahte_seviye_itiraf"
          - id: "ortak"
            etiket: { tr: "Ona ortaklık teklif et; payını al", en: "Offer him a partnership. Take a cut" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: -3 }
              - kredi: 40
              - itibar: { siginak: -3 }
              - bayrak: "sahte_ortak"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 2, max: 4 } }
            sonraki: "sahte_seviye_ortak"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Kuyruğun yanından geç; senin işin değil", en: "Walk past the line. Not your problem" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -3 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "@akis"

      - id: "sahte_seviye_kalabalik"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "\"Dört,\" diyorsun kuyruğun başındakilere; bağırmana gerek yok. Sözcük kuyruk boyunca ağızdan ağıza geçiyor: dört, dört, dört.", en: "\"Four,\" you tell the people at the front of the line; there's no need to shout. The word travels down the line hand to hand: four, four, four." }
          - { tr: "Adamın başındaki pencere titreyip sönüyor. Geriye kırk yaşlarında, ter içinde kalmış, gömleği iki beden büyük gelen bir adam kalıyor.", en: "The window over his head flickers and goes out. What's left underneath is a sweaty forty-something guy in a shirt two sizes too big." }
          - { tr: "Kuyruk dağılıp öfkeli bir kalabalığa dönüşüyor; ilk taş tezgâha, ikincisi adamın omzuna çarpıyor. Tezgâhın arkasından ince bir ses haykırıyor: \"Baba!\"", en: "The line turns into a mob, and the first rock hits the counter, the second his shoulder. From behind the counter, a small voice screams, \"Daddy!\"" }
        sezgiler:
          - kosul: { stat: { per: 9 } }
            metin: { tr: "Tezgâhın arkasında, battaniyelerin arasında on yaşlarında bir kız var. Toplanan konservelerin yarısı onun yatağının altında; hiçbiri açılmamış.", en: "Behind the counter, in a nest of blankets, there's a girl of maybe ten. Half the cans he's collected are under her cot, and none of them have been opened." }
        secenekler:
          - id: "koru"
            etiket: { tr: "Adamla kalabalığın arasına gir", en: "Step between him and the mob" }
            etkiler:
              - ahlak: { merhamet: 6, duzen: 2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 3 }
            sonraki: "sahte_seviye_sonra"
          - id: "izle"
            etiket: { tr: "Bırak, kalabalık hükmünü kendi versin", en: "Let the mob pass its own sentence" }
            etkiler:
              - ahlak: { merhamet: -8, duzen: -2, insanlik: -3 }
              - degisken: { hayatta_kalan: -1 }
              - itibar: { yukselenler: 3 }
              - iliski: { vahit: { saygi: 3 } }
            sonraki: "sahte_seviye_hukum"
          - id: "dur"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek gücünü göster; herkes donsun", en: "Show your real power. Everybody freezes" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 3, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 5 } }
            sonraki: "sahte_seviye_sonra"

      - id: "sahte_seviye_titreme"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Tezgâhın kenarı parmaklarının arasında bayat bir bisküvi gibi kopup kalıyor. Kuyruktakilerin soluğu kesiliyor.", en: "The edge of the counter snaps off between your fingers like a stale cracker. Nobody in line breathes." }
          - { tr: "Adamın başındaki pencere titreyip duruyor; korkudan yanılsamayı tutamıyor artık. Bir anlığına herkes gerçeği görüyor: Seviye 4.", en: "The window over his head stutters, because he's too scared to hold the illusion. For one second, everyone sees the truth: Level 4." }
          - { tr: "Adam sana bakıyor; dudakları sessizce kıpırdıyor: lütfen.", en: "He looks at you, and his lips move without a sound: please." }
        secenekler:
          - id: "bitti"
            etiket: { tr: "Kuyruğa dön: \"Ücret falan yok artık. Eşyalarınızı alın.\"", en: "Turn to the line. \"Fee's over. Take your stuff back.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3 }
              - bilgi: "sahte_seviye_gercek"
              - bayrak: "sahte_ifsa"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 2, max: 4 } }
            sonraki: "sahte_seviye_sonra"
          - id: "fisilda"
            etiket: { tr: "Ona eğilip fısılda: \"Bir daha olmayacak.\"", en: "Lean in and whisper: \"Never again.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - bilgi: "sahte_seviye_gercek"
            sonraki: "@akis"
          - id: "koltuk"
            etiket: { tr: "Yerine otur; ücreti artık sen topla", en: "Take his seat. You collect the fee now" }
            etkiler:
              - ahlak: { merhamet: -10, duzen: 2, insanlik: -4 }
              - kredi: 60
              - itibar: { siginak: -5, yukselenler: 3 }
              - dikkat: 3
              - iliski: { vahit: { saygi: 5 } }
            sonraki: "@akis"

      - id: "sahte_seviye_maske"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Maskeni indirdiğin an kuyruktaki herkesin penceresinde gerçek satırın beliriyor. Adamın on dokuzu onun yanında çocuk oyuncağı gibi kalıyor.", en: "You drop the mask, and your real line appears in every window in the line. Next to it, his nineteen looks like a kid's toy." }
          - { tr: "Adamın başındaki pencere titreyip duruyor; korkudan yanılsamayı tutamıyor artık. Bir anlığına herkes gerçeği görüyor: Seviye 4.", en: "The window over his head stutters, because he's too scared to hold the illusion. For one second, everyone sees the truth: Level 4." }
          - { tr: "Adam sana bakıyor; dudakları sessizce kıpırdıyor: lütfen.", en: "He looks at you, and his lips move without a sound: please." }
        secenekler:
          - id: "bitti"
            etiket: { tr: "Kuyruğa dön: \"Ücret falan yok artık. Eşyalarınızı alın.\"", en: "Turn to the line. \"Fee's over. Take your stuff back.\"" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3 }
              - bilgi: "sahte_seviye_gercek"
              - bayrak: "sahte_ifsa"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 2, max: 4 } }
            sonraki: "sahte_seviye_sonra"
          - id: "fisilda"
            etiket: { tr: "Ona eğilip fısılda: \"Bir daha olmayacak.\"", en: "Lean in and whisper: \"Never again.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - bilgi: "sahte_seviye_gercek"
            sonraki: "@akis"
          - id: "koltuk"
            etiket: { tr: "Yerine otur; ücreti artık sen topla", en: "Take his seat. You collect the fee now" }
            etkiler:
              - ahlak: { merhamet: -10, duzen: 2, insanlik: -4 }
              - kredi: 60
              - itibar: { siginak: -5, yukselenler: 3 }
              - dikkat: 3
              - iliski: { vahit: { saygi: 5 } }
            sonraki: "@akis"

      - id: "sahte_seviye_itiraf"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Seni tezgâhın arkasındaki depoya alıyor. Kapı kapanır kapanmaz başındaki pencere sönüyor, omuzları bir karış çöküyor.", en: "He takes you into the stockroom behind the counter. The second the door shuts, the window over his head goes out and his shoulders drop a foot." }
          - { tr: "\"Vitrin aydınlatmaya yarayan sıradan bir yetenek bu,\" diyor. \"Bir gece çete geldi, panikledim, sayıyı büyüttüm; kaçıp gittiler.\"", en: "\"It's a nothing skill for lighting up store displays,\" he says. \"The gang came one night, I panicked and made the number big, and they ran.\"" }
          - { tr: "Battaniyelerin arasında uyuyan on yaşlarında bir kızı gösteriyor: \"Konservelerin yarısı onun için, öbür yarısını da çeteye veriyorum. Benim sayım artık onları kandırmaz.\"", en: "He nods at a girl of about ten asleep in a pile of blankets. \"Half the cans are for her, and I pay the other half to the gang,\" he says. \"My number doesn't fool them anymore.\"" }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "Çeteyi birlikte durdurmayı teklif et", en: "Offer to stop the gang together" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
              - bilgi: "sahte_seviye_gercek"
              - bayrak: "sahte_dost"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "iade"
            etiket: { tr: "Herkesin eşyasını geri vermesini iste", en: "Make him give everybody's stuff back" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { saygi: 3 } }
              - bilgi: "sahte_seviye_gercek"
            sonraki: "@akis"
          - id: "sir"
            etiket: { tr: "Sırrını sakla; karşılığında bilgi al", en: "Keep his secret. In exchange for intel" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - bilgi: "sahte_seviye_gercek"
              - xp: 40
              - itibar: { sessiz_ag: 2 }
            sonraki: "@akis"

      - id: "sahte_seviye_tehdit"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "\"Sen kiminle konuştuğunu biliyor musun?\" Adam ayağa kalkarken başındaki sayı parlıyor: \"On dokuz. Geç sırana.\"", en: "\"You know who you're talking to?\" He stands up, and the number over his head flares: \"Nineteen. Get back in line.\"" }
          - { tr: "Bütün kuyruk sana bakıyor. Görünen seviyen onunkinin yanında küçük kalıyor; en azından onların gözünde.", en: "The whole line is looking at you. Next to his, your public number looks small, at least to them." }
        secenekler:
          - id: "geri"
            tur: "gizle"
            etiket: { tr: "Kuyruğa geri dön", en: "Step back in line" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"
          - id: "maske"
            tur: "aciga_vur"
            etiket: { tr: "Maskeni indir; on dokuzunu kendi sayınla ez", en: "Drop the mask. Bury his nineteen under yours" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, merhamet: -2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "sahte_seviye_maske"
          - id: "ifsa"
            etiket: { tr: "Gerçek seviyesini kuyruğa söyle", en: "Tell the line his real level" }
            gerekli: { stat: { per: 14 } }
            etkiler:
              - ahlak: { duzen: 3 }
              - bilgi: "sahte_seviye_gercek"
              - bayrak: "sahte_ifsa"
            sonraki: "sahte_seviye_kalabalik"

      - id: "sahte_seviye_sonra"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Kalabalık bir an kararsız kalıp yavaş yavaş geri çekiliyor. Kimse kimsenin yüzüne bakamıyor.", en: "The crowd hangs there a moment, undecided, then slowly backs off. Nobody will meet anybody's eyes." }
          - { tr: "Adam kızına sarılmış, ikisi birden titriyor. \"Yalan söyledim, doğru, ama çete gerçek,\" diye fısıldıyor sana. \"Benim sayım onları uzak tutuyordu.\"", en: "He's got his arms around his daughter and they're both shaking. \"I lied, but the gang is real,\" he whispers to you. \"My number was keeping them away.\"" }
          - { tr: "Yaşlı kadın konservesini göğsüne bastırıyor. \"Şimdi bizi kim koruyacak?\" diye soruyor; sorusu hem hiç kimseye hem herkese.", en: "The old woman clutches her can to her chest. \"So who protects us now?\" she asks, to nobody and everybody." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Herkesi {fraksiyon:siginak|e} götür", en: "Take everyone to the {fraksiyon:siginak}" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 3 }
              - degisken: { hayatta_kalan: 3 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 5, saygi: 3 } }
            sonraki: "@akis"
          - id: "koruyucu"
            etiket: { tr: "Koruyuculuğu sen üstlen, parasız", en: "Take over as their protector. No fee" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - dikkat: 2
              - itibar: { siginak: 2, lonca: 2 }
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "Adamı {fraksiyon:lonca|e} öner; yanılsaması işe yarar", en: "Pitch him to the {fraksiyon:lonca}. That trick's useful" }
            etkiler:
              - ahlak: { duzen: 4, insanlik: 1 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4, guven: 2 } }
            sonraki: "@akis"

      - id: "sahte_seviye_hukum"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Sen kenarda dururken kalabalık işini görüyor. Uzun sürmüyor; kalabalığın işi hiçbir zaman uzun sürmez.", en: "You stand off to the side and the mob does its thing. It doesn't take long, because mobs never do." }
          - { tr: "Adam kızını koltuğunun altına almış, bir bacağını sürükleye sürükleye durmuş merdivenden yukarı kaçıyor. Ardında kan, saçılmış konserveler ve sönmüş bir pencere kalıyor.", en: "He drags one leg up the dead escalator with his daughter tucked under his arm. Behind him he leaves blood, scattered cans and a window gone dark." }
          - { tr: "Kalabalık konserveleri adilce değil ama çabucak bölüşüyor. Sana teşekkür eden olmuyor; zaten kimse senden bir şey beklememişti.", en: "The crowd splits up the cans, not fairly but fast. Nobody thanks you, and nobody was expecting anything from you anyway." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Merdivenin tepesine kadar onları izle", en: "Watch them all the way to the top" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bayrak: "sahte_kacti"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "sahte_kacti" } }
            sonraki: "@akis"
          - id: "konserve"
            etiket: { tr: "Kızın yatağının altındakileri onlara götür", en: "Bring them the cans from under the girl's cot" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "sahte_kacti"
              - tohum: { olay: "carsi_cetesi", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "sahte_kacti" } }
            sonraki: "@akis"

      - id: "sahte_seviye_ortak"
        yer: "harabe_carsi"
        paragraflar:
          - { tr: "Adam önce anlamıyor; anlayınca yüzüne bir gülümseme yayılıyor. \"Senin gibi biri yanımda olursa fiyatı ikiye katlarız,\" diyor.", en: "At first he doesn't get it, then he does and smiles. \"With somebody like you next to me, we double the price,\" he says." }
          - { tr: "Yaşlı kadın konservesini tezgâha bırakıyor. Yüzüne bakmıyor; bundan sonra kimse bakmayacak.", en: "The old woman sets her can on the counter. She doesn't look at you, and from now on nobody will." }
        secenekler:
          - id: "cep"
            etiket: { tr: "Payını cebine koy", en: "Pocket your cut" }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "@akis"
          - id: "vazgec"
            etiket: { tr: "Son anda vazgeç; konservesini geri ver", en: "Back out. Give the old woman her can back" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
              - kredi: -40
              - itibar: { siginak: 2 }
              - bayrak_kaldir: "sahte_ortak"
            sonraki: "@akis"
