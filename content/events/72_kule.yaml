# Parti L2 — Kule'nin hikaye katları (docs/PERDE2_4.md "Parti L2"). Her 10. kat bir olaydır: Kule Dibi'nde "Kule" eylemi
# sıradaki kat hikaye katıysa bu olayı başlatır (tower.yaml `hikaye_katlari`). Olaylar `yalniz_tohum` (havuzdan gelmez), `perde` yok.
# Zaferde `kule_kat: n`; yenilgi ya da kaçışta kat açılmaz, sonraki tırmanış olayı baştan başlatır (`kuleNN_deneme` sayacı
# ikinci gelişte açılışa bir satır ekler). Bosslar `@oyuncu+N` (her oyuncu için gerçek savaş), düşmanlar enemies/72_kule.yaml.
# Kule'nin sırrı adım adım: 10 kayıt · 20 okuyan göz · 30 senin el yazın · 40 Gün 0 · 50 hasat edilmiş dünyalar ve geçit ·
# 60 her kaydın son satırı "Yeni Entegrasyon" · 70 Tohumluk · 80 kabul edilenler (Kadimler) · 90 önceki taşıyıcı · 100 zirve = başlangıç.
# Yeni tavan: her katta bir üst kademeden bir şey ölçeği sıfırlar. Döngü sonu: degisken_min {kule_kat: 100}.
# Kule'nin takip olayları (yalnızca tohumla): kule_dibi_tirmanicilar, kule_cam_mektup, kule_kopyalar.
# Diğer partilere tohumlar: aras_kule_dovusu, yanki_kaynak_izi, yanki_son_sir (Parti F).
olaylar:
  # ================================================================== KAT 10 — VAPUR (E · Sistem sırrı: Kule bir kayıttır)
  - id: "kule_kat_10"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Onuncu kat: Akşam vapuru", en: "Floor Ten: The Evening Ferry" }
    sahne: "k10_giris"
    sahneler:
      - id: "k10_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivenin son basamağı tahtadan: ıslak, tuz tutmuş, basınca hafifçe esneyen bir iskele tahtası. Burnuna önce yosun kokusu geliyor, ardından mazot, en son da susamlı simit.", en: "The last stair is made of wood: wet, salt-crusted, a dock plank that gives a little under your boot. First you smell seaweed, then diesel, then fresh-baked soft pretzels." }
          - { tr: "Onuncu kat {yer:kiyikent_iskele|in} kusursuz bir kopyası: bilet gişesi, çay ocağı, korkuluğa yaslanmış bisikletler. Gökyüzü aslında bir tavan; o tavana Entegrasyon Günü'nün akşam güneşi asılmış, kıpırdamıyor.", en: "Floor ten is the {yer:kiyikent_iskele}. A perfect copy: the ticket booth, the coffee cart, bikes leaning on the railing. The sky is a ceiling, and nailed to that ceiling is Integration Day's evening sun. It doesn't move." }
          - { tr: "İskele yüzlerce gri insanla dolu. Kiminin elinde poşet, kiminin telefon, kiminin bir çocuğun eli; hepsi aynı anda başını kaldırmış, gökyüzünü bir tırnağın çizdiği o ana bakıyor. Martılar havada donakalmış. Akşam vapuru iskeleye yanaşmış, bekliyor.", en: "There are hundreds of gray people on the pier. Bags, phones, kids' hands; every one of them is looking up at the same moment, the second a fingernail scratched the sky. The gulls are frozen in midair. The evening ferry is tied up at the dock, waiting." }
          - { tr: "Korkuluğun dibindeki gri bir figür, elindeki simidin son lokmasını martılara uzatmış. O duruşu tanıyorsun ve bir an nefes almayı unutuyorsun.", en: "By the railing, a gray figure holds the last bit of a pretzel out to the gulls. You know that posture, and for a second you forget how to breathe." }
          - metin: { tr: "{npc:deniz_arman} yanı başında nefesini tutmuş, kendi gölgesine bakakalmış.", en: "Beside you, {npc:deniz_arman} is holding {zamir:deniz_arman|onun} breath, staring at {zamir:deniz_arman|onun} own shadow." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "Buraya daha önce de geldin. Gri yolcular bu kez başlarını gökyüzünden indirip sana bakıyor: seni hatırlıyorlar.", en: "You've been here before. This time the gray passengers lower their eyes from the sky and look at you. They remember." }
            kosul: { degisken_min: { kule10_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 10 · KAYIT ODASI]", en: "[SPIRE · FLOOR 10 · RECORD ROOM]" }
            satirlar:
              - { tr: "Oynatılan kayıt: Entegrasyon · {yer:kiyikent} · Gün 0 · 18:52.", en: "Playback: Integration · {yer:kiyikent} · Day 0 · 6:52 PM." }
              - { tr: "Kayıt numarası: #█. Lütfen kayda dokunmayın.", en: "Record number: #█. Please do not touch the recording." }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Gri yolcuları sayınca iskelede 412 kişi çıkıyor, oysa gişe camındaki yolcu sayacı 413 gösteriyor. Biri eksik.", en: "Count the gray passengers: 412 on the pier. The passenger counter in the booth window reads 413. Somebody's missing." }
          - kosul: { stat: { int: 30 } }
            metin: { tr: "Kayıt numarasının üstündeki karalama bir silinti değil, üst üste yazılmış bir şey. Altında birden fazla rakam var.", en: "That smudge over the record number isn't an erasure. It's an overwrite. There's more than one digit under it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burayı sevmiyorum. seni bulduğum an bu. dışarıdan görmek tuhaf, sanki biri bizi izlemiş.", en: "i don't like it here. this is the moment i found you. seeing it from outside is strange. like somebody was watching us." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O benim. Elimdeki simit bile aynı. Bunu... bunu kim kaydetti? Niye?\"", en: "\"That's me. Even the pretzel. Who... who recorded this? Why?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Dört yüz kişi. Nabızları yok ama renkleri yaşayan birininki gibi. Hekim olarak söylüyorum: burası mezarlık değil, arşiv.\"", en: "\"Four hundred people. No pulse, but the color's like someone alive. Speaking as a doctor: this isn't a graveyard. It's an archive.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kayıt odası. Kayıt odası! Demek Sistem log tutuyor. Log tutan her şeyin bir yerde bir log dosyası olur.\"", en: "\"A record room. A record room! The System keeps logs. Anything that keeps logs has a log file somewhere.\"" }
        secenekler:
          - id: "vapura_bin"
            etiket: { tr: "Kalabalığın arasından vapura yürü", en: "Walk through the crowd onto the ferry" }
            sonraki: "k10_guverte"
          - id: "gise"
            etiket: { tr: "Bilet gişesindeki yolcu listesine bak", en: "Check the passenger list at the ticket booth" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - bilgi: "kule_kayit"
            sonraki: "k10_liste"
          - id: "golgeye_dokun"
            etiket: { tr: "Korkuluktaki gri figürün omzuna dokun", en: "Touch the gray figure at the railing on the shoulder" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "k10_dokunus"
          - id: "gizlen"
            tur: "gizle"
            etiket: { tr: "Yolcuların arasına karış, kayıt seni görmesin", en: "Blend in with the passengers. Don't let the recording see you" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
            sonraki: "k10_karisma"

      - id: "k10_liste"
        yer: "kule"
        paragraflar:
          - { tr: "Gişenin camına yapıştırılmış liste aslında bir Sistem penceresi; elini kaydırınca isimler akıp gidiyor. Akşam seferi, 413 yolcu. Adlar tanıdık değil ama her birinin yanında bir sayı duruyor: Öğretici'de kaç gün yaşadığı.", en: "The list taped inside the booth glass is a System window. Swipe and the names scroll. Evening sailing, 413 passengers. You don't know the names, but there's a number next to every one: how many days they lasted in the Tutorial." }
          - { tr: "Sıfırlar, üçler, on dörtler... Otuzlara ulaşan azınlıkta. Listenin en dibinde sayısı olmayan tek bir satır var. O satırda senin adın yazıyor, yanında da bir not: [zaten kayıtlı].", en: "Zeros, threes, fourteens. Not many thirties. At the very bottom, one line with no number. It's your name, with a note beside it: [already logged]." }
          - { tr: "Zaten. Bu sözcük iskelenin ıslak tahtası kadar soğuk; aklına takılıp kalıyor.", en: "Already. The word sticks with you, cold as the wet dock planks." }
        secenekler:
          - id: "guverteye"
            etiket: { tr: "Listeyi bırak, vapura bin", en: "Let the list go and board the ferry" }
            sonraki: "k10_guverte"
          - id: "yankiya_sor"
            etiket: { tr: "{npc:yanki|e} \"zaten\" kelimesini sor", en: "Ask {npc:yanki} about the word \"already\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 3, saygi: 2 } }
            sonraki: "k10_yanki"

      - id: "k10_yanki"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Derken kafanın en arka köşesinden, her zamankinden kısık bir ses geliyor: bilmiyorum. bu doğru. ilk kez doğruyu söylüyorum ve hiç hoşuma gitmedi.", en: "{npc:yanki} doesn't answer for a long time. Then, from the very back of your skull, quieter than usual: i don't know. that's true. first time i've told the whole truth and i don't like how it feels." }
          - { tr: "seni bulduğumda tek bir şey biliyordum: seni. kim olduğunu değil, nerede olduğunu. adresini önceden biliyormuşum gibi.", en: "when i found you, i only knew one thing: you. not who you were. where you were. like i already had the address." }
        secenekler:
          - id: "devam"
            etiket: { tr: "\"Öğreneceğiz. Yukarıda.\"", en: "\"We'll find out. Upstairs.\"" }
            etkiler:
              - iliski: { yanki: { baglilik: 3 } }
            sonraki: "k10_guverte"

      - id: "k10_dokunus"
        yer: "kule"
        paragraflar:
          - { tr: "Parmakların gri omza değince kayıt bir an takılıyor. Figür, bir video karesinin içinden çıkar gibi başını sana çeviriyor; yüzü yok ama sesi var: \"Yarın da gecikirse yüzerek giderim.\"", en: "Your fingers touch the gray shoulder and the recording hitches. The figure turns its head toward you like it's stepping out of a video frame. No face, but there's a voice: \"If it's late again tomorrow, I'm swimming.\"" }
          - metin: { tr: "Arkanda {npc:deniz_arman|den} gülmekle ağlamak arası bir ses çıkıyor. \"On yıl,\" diyor. \"On yıldır aynı şaka.\"", en: "Behind you, {npc:deniz_arman} makes a sound somewhere between a laugh and a sob. \"Ten years,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Ten years, same joke.\"" }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "O sesi on yıldır tanıyorsun. Şimdi aynı ses bir binanın onuncu katında, bir kayıttan sana sesleniyor. Gerçek {npc:deniz_arman} artık yok.", en: "You've known that voice for ten years. Now it's saying it to you from a recording on the tenth floor of a building. The real {npc:deniz_arman} is gone." }
            kosul: { npc_olu: "deniz_arman" }
          - { tr: "Derken iskeledeki bütün gri yüzler aynı anda sana dönüyor. Kayda dokunmamalıydın.", en: "Then every gray face on the pier turns toward you at once. You weren't supposed to touch the recording." }
        secenekler:
          - id: "guverteye"
            etiket: { tr: "Kalabalık kapanmadan vapura koş", en: "Run for the ferry before the crowd closes in" }
            etkiler:
              - dikkat: 2
            sonraki: "k10_guverte"
          - id: "deniz_el"
            etiket: { tr: "{npc:deniz_arman|in} elini tut, birlikte geçin", en: "Take {npc:deniz_arman|pos} hand. Go through together" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:kule_kat_10", agirlik: 35 }
            sonraki: "k10_guverte"

      - id: "k10_karisma"
        yer: "kule"
        paragraflar:
          - { tr: "Omuzlarını düşürüp başını kaldırıyor, onlar gibi gökyüzüne bakıyorsun. Gri kalabalık seni aralarına alıyor; omuzlar birbirine sürtünüyor, dönüp bakan olmuyor.", en: "You drop your shoulders, tip your head back, and stare at the sky like they do. The gray crowd takes you in. Shoulders brush. Nobody turns to look." }
          - { tr: "Kalabalıkla birlikte vapura doğru süzülürken gişenin önünden geçiyorsun. Camın ardında bir sayaç yanıp sönüyor: 413. Sen geçerken bir anlığına 414'e çıkıp hemen geri düşüyor.", en: "Drifting toward the ferry with the crowd, you pass the booth. A counter blinks behind the glass: 413. When you go by it ticks up to 414 for a second, then drops right back." }
        secenekler:
          - id: "guverteye"
            etiket: { tr: "Sessizce güverteye çık", en: "Slip quietly up onto the deck" }
            sonraki: "k10_guverte"

      - id: "k10_guverte"
        yer: "kule"
        paragraflar:
          - { tr: "Güverte bomboş, tek bir kişi dışında: üniforması mavi Sistem pencerelerinden dikilmiş bir bilet kontrolörü. Kasketinin siperliğinin altında yüz yerine dönüp duran bir yükleme çubuğu var, elinde de pirinç bir delgeç.", en: "The deck is empty except for one figure: a ticket inspector in a uniform stitched from blue System windows, with a spinning loading bar where a face should be under the brim of its cap. It holds a brass ticket punch." }
          - { tr: "\"Biletler lütfen,\" diyor. Bütün yolcuların biletleri havada belirip tek tek delindikçe ışığa dönüşüyor. Seninki ortada yok.", en: "\"Tickets, please,\" it says. Every passenger's ticket appears in the air, and one by one they get punched and turn to light. Yours doesn't appear." }
          - { tr: "Yükleme çubuğu sana dönüp takılıyor. [YOLCU ZATEN KAYITLI · ÇİFT KAYIT · TEMİZLENECEK.]", en: "The loading bar turns toward you and hangs. [PASSENGER ALREADY LOGGED · DUPLICATE ENTRY · TO BE CLEARED.]" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Aktarım Bekçisi · Kat 10 bekçisi", en: "[ANALYSIS] The Transfer Steward · Floor 10 guardian" }
            satirlar:
              - { tr: "Zaaf: çelişki. Kayda iki gerçeği birden göster.", en: "Weakness: contradiction. Show a record two truths." }
        sezgiler:
          - kosul: { stat: { int: 32 } }
            metin: { tr: "Delgecin her tıkırtısı bir saniye. Bekçi bir kayıttan ibaret, kayıtta olmayan hiçbir şeye karşılık veremiyor. Kayda geçmemiş ani bir hareket onu yarım tur geride bırakır.", en: "Every click of the punch is one second. The steward is just a recording, and it can't react to anything that isn't in it. One sudden move that's not in the tape leaves it half a beat behind." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çift kayıt. biri bizi iki kez yazmış. kim olduğunu bulana kadar silinme, lütfen.", en: "duplicate entry. someone wrote us down twice. don't get deleted before we find out who, please." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Delgece doğru yürü, silinmeyi reddet", en: "Walk straight at the punch. Refuse to be cleared" }
            etkiler:
              - savas: { dusmanlar: ["kule_aktarim_bekcisi@oyuncu+3"], kazan: "k10_zafer", kaybet: "k10_yenilgi", kac: "k10_kacis" }
          - id: "iki_bilet"
            etiket: { tr: "Ona iki gerçeği birden göster: buradasın, ama değilsin", en: "Show it two truths at once: you're here, and you're not" }
            gerekli: { stat: { int: 34 } }
            etkiler:
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["kule_aktarim_bekcisi@oyuncu+1"], kazan: "k10_zafer", kaybet: "k10_yenilgi", kac: "k10_kacis" }
          - id: "gosteris"
            tur: "gosteris"
            etiket: { tr: "Delgeci elinden al, biletini kendin del", en: "Take the punch out of its hand and punch your own ticket" }
            gerekli: { stat: { str: 38 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["kule_aktarim_bekcisi@oyuncu"], kazan: "k10_zafer", kaybet: "k10_yenilgi", kac: "k10_kacis" }

      - id: "k10_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Bekçi güvertenin tahtalarına yığılırken üniformasındaki pencereler tek tek sönüyor. Yükleme çubuğu son bir kez dönüp yüzde doksan dokuzda takılıyor, öyle de kalıyor.", en: "The steward folds onto the deck planks, and the windows in its uniform go dark one by one. The loading bar spins one last time, sticks at ninety-nine percent, and stays there." }
          - { tr: "Vapurun düdüğü çalıyor. İskeledeki bütün gri yolcular aynı anda ışığa dönüşürken Entegrasyon'un o ilk saniyesi sessizce, kusursuzca yeniden oynanıyor. Sonra kayıt başa sarar ve yine bekler.", en: "The ferry horn blows. Every gray passenger on the pier turns to light at the same moment: Integration's first second, replayed in silent, perfect detail. Then the recording rewinds to the top and waits again." }
          - { tr: "Delgeç ayağının dibinde. Yanında, bekçinin cebinden düşmüş, iki kez delinmiş bir vapur bileti duruyor; üstünde senin adın.", en: "The punch lies at your feet. Next to it, fallen out of the steward's pocket: a ferry ticket punched twice. Your name is on it." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "epik"
            baslik: { tr: "[KAT 10 TEMİZLENDİ]", en: "[FLOOR 10 CLEARED]" }
            satirlar:
              - { tr: "Kayıt bütünlüğü: bozuk. Sorumlu: belirsiz.", en: "Record integrity: compromised. Responsible party: unclear." }
              - { tr: "Sonraki değerlendirme: Kat 20. Değerlendiren: bir üst kademe.", en: "Next assessment: Floor 20. Assessor: one Grade up." }
        secenekler:
          - id: "bileti_al"
            etiket: { tr: "Bileti alıp cebine koy", en: "Pick up the ticket and pocket it" }
            etkiler:
              - kule_kat: 10
              - xp_seviye: 80
              - esya: { kule_vapur_bileti: 1 }
              - unvan: "kule_ilk_onuncu_kat"
              - bilgi: "kule_kayit"
              - ahlak: { insanlik: 1 }
            sonraki: "k10_tavan"
          - id: "kaydi_durdur"
            etiket: { tr: "Kaydı durdurmaya çalış, bu insanlar dinlensin", en: "Try to stop the playback. Let these people rest" }
            etkiler:
              - kule_kat: 10
              - xp_seviye: 80
              - unvan: "kule_ilk_onuncu_kat"
              - bilgi: "kule_kayit"
              - bayrak: "kule_kayit_durduruldu"
              - ahlak: { merhamet: 4, insanlik: 2 }
            sonraki: "k10_durdur"
          - id: "kaydi_oku"
            etiket: { tr: "Bekçinin pencerelerinden kaydın kaynağını oku", en: "Read the recording's source off the steward's windows" }
            gerekli: { stat: { int: 32 } }
            etkiler:
              - kule_kat: 10
              - xp_seviye: 90
              - unvan: "kule_ilk_onuncu_kat"
              - bilgi: "kule_kayit"
              - bayrak: "kule_kayit_okundu"
              - ahlak: { insanlik: -2, duzen: 1 }
            sonraki: "k10_kaynak"

      - id: "k10_durdur"
        yer: "kule"
        paragraflar:
          - { tr: "Delgeci güvertenin kenarındaki zile, vapurun durma ziline bastırınca kayıt bir an duruyor. İskeledeki gri yüzler ilk kez gökyüzüne değil, birbirlerine bakıyor.", en: "You press the punch to the bell on the deck rail, the ferry's stop bell. The playback freezes. For the first time, the gray faces on the pier look at each other instead of the sky." }
          - { tr: "Ardından Sistem sabırlı bir öğretmen gibi kaydı baştan başlatıyor. Ama o bir saniye senin eserin: onlara bir saniye verdin.", en: "Then the System, like a patient teacher, starts the playback over. But for one second, you did that. You gave them one second." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Merdivene yürü", en: "Head for the stairs" }
            sonraki: "k10_tavan"

      - id: "k10_kaynak"
        yer: "kule"
        paragraflar:
          - { tr: "Pencerelerin altındaki satırları tek tek söküp çıkarıyorsun. Kaynak: Kule. Kaydeden: Kule. Kayıt türü: Entegrasyon. Saklama süresi: [süresiz].", en: "You peel the lines out from under the windows one at a time. Source: The Spire. Recorded by: The Spire. Record type: Integration. Retention: [indefinite]." }
          - { tr: "En altta da bir dizin var: [Kat 1–9: bu Entegrasyon. Kat 10: başlangıç anı. Kat 11+: önceki kayıtlar.] Önceki... Demek Kule'nin yukarılarında bu şehirden önce kaydedilmiş şeyler var.", en: "And at the very bottom, an index: [Floors 1–9: this Integration. Floor 10: moment of initiation. Floors 11+: prior records.] Prior. Up above, the Spire holds things that were recorded before this city." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Dizini ezberle, merdivene yürü", en: "Memorize the index and head for the stairs" }
            sonraki: "k10_tavan"

      - id: "k10_tavan"
        yer: "kule"
        paragraflar:
          - { tr: "Yukarı çıkan merdivenin başına vardığın an güvertenin üst katından bir gölge geçiyor: uzun, ağır adımlı, yüzsüz bir şey. Analiz penceren açılıyor ve ilk kez işe yarar hiçbir şey yazmıyor: [Seviye: ??? · Kademe: D].", en: "You're at the foot of the stairs going up when a shadow crosses the ferry's upper deck. Tall, slow, faceless. Your Analysis window pops open, and for the first time it says nothing useful: [Level: ??? · Grade: D]." }
          - { tr: "Gölge sana bakmıyor; bir karatahtayı okur gibi seni süzüyor: not alıyor. Sonra katın tavanına, yani yirminci kata doğru yürüyüp gözden kayboluyor.", en: "The shadow doesn't look at you. It looks at you the way someone looks at a whiteboard: taking notes. Then it walks off toward the ceiling, toward the twentieth floor, and is gone." }
          - { tr: "Bir dakika öncesine kadar bu kattaki en güçlü şey sendin.", en: "You were the strongest thing on this floor. A minute ago." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "değerlendirici. kule seni sınamıyor, ölçüyor. ölçülen şey de bir yere kaydedilir.", en: "assessor. the spire isn't testing you. it's measuring. measured things get filed somewhere." }
        secenekler:
          - id: "asagi"
            etiket: { tr: "Aşağı in, {yer:kule_dibi} seni bekliyor", en: "Head back down. {yer:kule_dibi} is waiting" }
            etkiler:
              - tohum: { olay: "kule_dibi_tirmanicilar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "yanki_konus"
            etiket: { tr: "{npc:yanki|e} söz ver: o gölgeyi birlikte okuyacaksınız", en: "Promise {npc:yanki} you'll read that shadow together" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 5, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_10", agirlik: 25 }
              - tohum: { olay: "kule_dibi_tirmanicilar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "deniz_konus"
            etiket: { tr: "{npc:deniz_arman|e} gölgesini sor: iyi misin?", en: "Ask {npc:deniz_arman} about the shadow: you okay?" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 5, saygi: 3 } }
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "kule_dibi_tirmanicilar", gecikme: { min: 1, max: 3 } }
            sonraki: "k10_deniz"

      - id: "k10_deniz"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:deniz_arman} merdivenin basamağına çöküveriyor. \"O akşam simidimi bitirememiştim,\" diyor. \"Artık biliyorum: burada bir yerde onu sonsuza dek bitiremeyeceğim.\"", en: "{npc:deniz_arman} sinks down on a stair. \"I never finished my pretzel that night,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Now I know that somewhere up here, I'm never going to finish it. Ever.\"" }
          - { tr: "Bir süre ikiniz birden, sebepsizce gülüyorsunuz. Sonra kalkıp aşağı iniyorsunuz.", en: "For a while you both laugh, the kind of laugh that doesn't need a reason. Then you get up and head down." }
        secenekler:
          - id: "in"
            etiket: { tr: "Birlikte aşağı in", en: "Head down together" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 3 } }
            sonraki: "@akis"

      - id: "k10_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Delgecin son tıkırtısı göğsüne iniyor. Bir an vapurun güvertesinde değil, iskelede, gri kalabalığın ortasındasın; onlar gibi gökyüzüne bakarken ne zamandır baktığını unutuyorsun.", en: "The punch's last click lands in your chest. For a second you're not on the ferry deck anymore. You're on the pier, in the gray crowd, staring at the sky like they are, and forgetting how long you've been staring." }
          - { tr: "Biri seni omzundan tutup çekiyor. Gözlerini açtığında merdivenin dibindesin, dokuzuncu katın kopya sokağında; kanlar içindesin ama rengin yerinde.", en: "You feel somebody yank you by the shoulder. When you open your eyes you're at the bottom of the stairs, in the copied street on the ninth floor, bloody but still in color." }
          - metin: { tr: "{npc:deniz_arman} seni bırakmıyor. \"Grileşmene izin vermem,\" diyor. \"Bir kere yetti.\"", en: "{npc:deniz_arman} won't let go of you. \"I'm not letting you go gray,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Once was enough.\"" }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "geri"
            etiket: { tr: "Yaralarını sar, vapur bekler", en: "Bind your wounds. The ferry will wait" }
            etkiler:
              - degisken: { kule10_deneme: 1 }
              - can: 20
            sonraki: "@akis"
          - id: "ofke"
            etiket: { tr: "Bir dahaki sefere biletini kendin del", en: "Next time, punch your own ticket" }
            etkiler:
              - degisken: { kule10_deneme: 1 }
              - stat: { wil: 1 }
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "k10_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Güverteden iskeleye atlayıp gri kalabalığı yara yara merdivene koşuyorsun. Arkanda delgecin tıkırtısı var ama hiç acelesi yok. Kayıtlar acele etmez.", en: "You jump from the deck to the pier and shove through the gray crowd for the stairs. Behind you, the click of the punch, unhurried. Recordings don't rush." }
          - { tr: "Merdivenin dibinde soluklanıyorsun. Yukarıdan vapurun düdüğü geliyor. Biletin hâlâ delinmedi.", en: "You stop at the foot of the stairs. From above comes the ferry horn. Your ticket still hasn't been punched." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Soluklan, sonra yeniden dene", en: "Catch your breath. Then try again" }
            etkiler:
              - degisken: { kule10_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 20 — FENER (E → D · yeni tavan: Derin)
  - id: "kule_kat_20"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "yeni_tavan"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Yirminci kat: Fener", en: "Floor Twenty: The Lighthouse" }
    sahne: "k20_giris"
    sahneler:
      - id: "k20_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Merdiven bir kayalığın içinde son buluyor. Önünde katın öbür ucuna kadar uzanan iç deniz, tam ortasında da bir deniz feneri. Fenerin tepesinde lamba yok; onun yerinde dönüp duran dev bir göz var.", en: "The stairs end inside a rock outcrop. In front of you lies the inner sea, edge to edge, and dead in the middle, a lighthouse. There's no lamp up top. In its place, a giant eye, turning." }
          - { tr: "Işık suyun üstünde ağır ağır dönüyor. Değdiği her şeyin üstünde bir anlığına küçük bir pencere beliriyor: bir dalganın seviyesi, bir martının korkusu, bir kayanın yaşı. Göz okuyor.", en: "The beam sweeps slow across the water. Everything it touches gets a little window for a second: a wave's level, a gull's fear, a rock's age. The eye is reading." }
          - { tr: "Kayalıkla fenerin arasında yarım millik açık deniz uzanıyor. Su simsiyah; fenerin ışığı her geçtiğinde dipte bir şey ağır ağır başını kaldırıyor.", en: "Half a mile of open water lies between the rocks and the lighthouse. The water is black, and every time the beam passes, something on the bottom slowly lifts its head." }
          - metin: { tr: "Kayanın üstüne beyaz tebeşirle iki harf yazılmış, altına da bir ok çizilmiş: A.K. Ok feneri gösteriyor. Tebeşir taze.", en: "Two letters are chalked in white on the rock, an arrow underneath: A.W. The arrow points at the lighthouse. The chalk is fresh." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
          - metin: { tr: "Buraya daha önce de geldin. Göz seni hatırlıyor; ışığı bu kez seni aramıyor, bekliyor.", en: "You've been here before. The eye remembers you. This time the beam isn't searching for you. It's waiting." }
            kosul: { degisken_min: { kule20_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 20 · DEĞERLENDİRME]", en: "[SPIRE · FLOOR 20 · ASSESSMENT]" }
            satirlar:
              - { tr: "Değerlendirme: fenere ulaşın. Yüzmek serbesttir.", en: "Assessment: reach the lighthouse. Swimming is permitted." }
              - { tr: "Su sıcaklığı: düşük. Derinlik: evet.", en: "Water temperature: low. Depth: yes." }
        sezgiler:
          - kosul: { stat: { per: 42 } }
            metin: { tr: "Işık suyun yüzünü değil, altını tarıyor. Göz seni değil, denizin dibindekini izliyor. Şimdilik.", en: "The beam isn't sweeping the surface. It's sweeping under it. The eye is watching whatever's on the bottom, not you. Not yet." }
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "Kayalığın dibinde, suyun hemen altında eski bir mendirek uzanıyor. Kopya şehirden kalma bu mendirek fenere kadar gidiyor. Kimse görmemiş, çünkü kimse aşağıya bakmamış.", en: "Just under the surface at the foot of the rocks runs an old breakwater, left over from the copied city. It goes all the way to the lighthouse. Nobody's seen it, because nobody looked down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o göz sistemin değil. sistem bakmaz, o bakıyor. ışığına girme; girersen de içinde bir şey saklama.", en: "that eye isn't the system's. the system doesn't look. that does. stay out of its beam. or if you go in, don't hide anything inside it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yüzerek giderim demiştim ya, hatırlıyor musun? Şakaydı.\"", en: "\"Remember I said I'd swim? I was joking.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Geçen sefer buraya kadar gelip döndüm. Bu sefer dönen ben olmayacağım.\"", en: "\"Last time I made it this far and turned back. This time I'm not the one turning back.\"" }
        secenekler:
          - id: "yuz"
            etiket: { tr: "Suya gir, fenere yüz", en: "Get in the water and swim for the lighthouse" }
            etkiler:
              - can: -15
            sonraki: "k20_yuzus"
          - id: "mendirek"
            etiket: { tr: "Suyun altındaki mendireği bul, üstünden yürü", en: "Find the submerged breakwater and walk it" }
            gerekli: { stat: { wis: 40 } }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 2 }
            sonraki: "k20_mendirek"
          - id: "ziplama"
            tur: "gosteris"
            etiket: { tr: "Dalgadan dalgaya sekerek suyun üstünden koş", en: "Skip wave to wave and run across the water" }
            gerekli: { stat: { agi: 45 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: -2 }
            sonraki: "k20_fener"
          - id: "dalis"
            etiket: { tr: "Dibe dal, oradaki şeyi gör", en: "Dive. See what's on the bottom" }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "k20_derin"

      - id: "k20_yuzus"
        yer: "kule"
        paragraflar:
          - { tr: "Su öyle soğuk ki ilk on kulaç boyunca nefes alamıyorsun. Sonra bedenin Sistem'in sana verdiği her şeyi devreye sokuyor ve kulaçların bir motor gibi düzene giriyor.", en: "The water's so cold you can't breathe for the first ten strokes. Then your body starts using everything the System ever handed it, and your stroke settles into a rhythm like an engine." }
          - { tr: "Yarı yolda fenerin ışığı üstünden geçerken bir an kendi statlarını suyun yüzünde, iri harflerle okuyorsun. Altındaki bir şey de onları okuyor: aşağıda iki dev göz açılıyor.", en: "Halfway there, the beam passes over you. For a second you can read your own stats on the surface of the water in big block letters. Something underneath reads them too. Down below, two enormous eyes open." }
        secenekler:
          - id: "hizlan"
            etiket: { tr: "Bakma, yüz", en: "Don't look. Swim" }
            sonraki: "k20_fener"
          - id: "bak"
            etiket: { tr: "Dur ve aşağıya bak", en: "Stop and look down" }
            sonraki: "k20_derin"

      - id: "k20_mendirek"
        yer: "kule"
        paragraflar:
          - { tr: "Mendirek tam tahmin ettiğin yerde, suyun bir karış altında. Üstünde yürürken ayakların ıslanıyor ama seni yüzerken gören olmuyor. Fenerin ışığı mendireğin üstünden geçerken bir an duraksıyor, sonra yoluna devam ediyor.", en: "The breakwater is right where you figured, a hand's width under the water. You walk it with wet boots, and nobody ever sees you swimming. When the beam passes over the breakwater it hesitates a second, then moves on." }
          - { tr: "Mendireğin taşlarına farklı dillerde, farklı alfabelerle yazılar kazınmış. Birinde Türkçe ve İngilizce alt alta yazıyor: [aşağıya bakma] [don't look down]. Bakıyorsun.", en: "There's writing carved into the breakwater stones: different languages, different alphabets. One is in Turkish and English, one above the other: [aşağıya bakma] [don't look down]. You look." }
        secenekler:
          - id: "fener"
            etiket: { tr: "Fenere varana kadar yürü", en: "Keep walking till you hit the lighthouse" }
            sonraki: "k20_fener"
          - id: "derin"
            etiket: { tr: "Mendireğin kenarından derine bak", en: "Look over the edge of the breakwater into the deep" }
            sonraki: "k20_derin"

      - id: "k20_derin"
        yer: "kule"
        paragraflar:
          - { tr: "Aşağıda, fenerin ışığının ancak ucuyla dokunabildiği derinlikte bir şey yatıyor. Balina kadar uzun, fener balığı kadar çirkin; alnından sarkan yem bir Analiz penceresi, üstünde de şu yazıyor: [Tehlike: yok].", en: "Down below, at a depth the lighthouse beam barely grazes, something is lying on the bottom. Long as a whale, ugly as an anglerfish, and the lure dangling from its forehead is an Analysis window that says: [Threat: none]." }
          - { tr: "Asıl Analiz'in, yani {npc:yanki|in} bozuk penceresi, aynı şeye bakıp bambaşka bir şey yazıyor: [Derin Feneri · Seviye 62 · Kademe D].", en: "Your real Analysis, your corrupted window, looks at the same thing and writes something else: [Deep Lantern · Level 62 · Grade D]." }
          - { tr: "Öğretici boyunca kademe farkının ne demek olduğunu hep okumakla yetindin. Şimdi gözünle görüyorsun: o şeyin bir kez esnemesi, bütün dövüşlerinin toplamından daha çok suyu yerinden oynatıyor.", en: "All through the Tutorial you only ever read about what a Grade gap means. Now you can see it: one yawn from that thing moves more water than every fight you've ever had." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[KADEME FARKI]", en: "[GRADE GAP]" }
            satirlar:
              - { tr: "Hedefin kademesi seninkinden yüksek. Verdiğin hasar ×0,5. Aldığın hasar ×2.", en: "Target Grade exceeds yours. Damage dealt ×0.5. Damage taken ×2." }
              - { tr: "Tavsiye: yüzmeye devam edin.", en: "Recommendation: keep swimming." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onu uyandırırsan seni kendi kademesine çeker. ya boğulursun ya büyürsün. ben ikincisinden yanayım ama karar senin.", en: "wake it up and it drags you down to its grade. you either drown or you grow. i'd prefer the second one, but it's your call." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Bırak uyusun, fenere git", en: "Let it sleep. Go for the lighthouse" }
            etkiler:
              - bayrak: "kule_derin_birakildi"
              - ahlak: { duzen: 2 }
            sonraki: "k20_fener"
          - id: "uyandir"
            etiket: { tr: "Yemine dokun, bir üst kademeyi dene", en: "Touch the lure. Take a swing at the next Grade" }
            gerekli: { seviye_min: 35 }
            etkiler:
              - dikkat: 5
              - ahlak: { duzen: -3, insanlik: -1 }
              - savas: { dusmanlar: ["kule_derin_feneri@62"], ortam: ["su", "karanlik"], kazan: "k20_derin_zafer", kaybet: "k20_derin_yenilgi", kac: "k20_fener" }

      - id: "k20_derin_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Dev gövde dibe çökerken yemi sönüyor. Pencere son bir kez yanıp sönüyor ve bu kez doğruyu söylüyor: [Tehlike: vardı].", en: "The giant body settles to the bottom and the lure goes dark. The window blinks one last time, and this time it tells the truth: [Threat: there was one]." }
          - { tr: "Su yüzüne çıktığında ciğerlerin yanıyor; Sistem ise bir an ne yazacağını bilemiyor. Fenerin ışığı ilk kez dönmeyi bırakıp doğrudan sana bakıyor.", en: "When you break the surface your lungs are on fire, and for a second the System doesn't know what to write. For the first time, the lighthouse beam stops sweeping and looks straight at you." }
        secenekler:
          - id: "fener"
            etiket: { tr: "Fenere yüz, göz bekliyor", en: "Swim for the lighthouse. The eye's waiting" }
            etkiler:
              - bayrak: "kule_derin_yenildi"
              - xp_seviye: 40
              - itibar: { lonca: 3 }
            sonraki: "k20_fener"

      - id: "k20_derin_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Karanlığın içinden bir çene kapanıyor. Bir an kendini o şeyin midesinde değil, gerçek derinlikte, suyun da sayıların da dibinde buluyorsun. Kademe farkı meğer bir sayı değil, bir ağırlıkmış.", en: "The jaw closes out of the dark, and for a second you're not in its stomach. You're truly deep, at the bottom of the water and the numbers both. A Grade gap isn't a number. It's a weight." }
          - { tr: "Sonra o şey seni tükürüveriyor; lokma olmaya bile değmeyecek kadar küçüksün. Yüzeye çıkıp kayalığa tutunduğunda fenerin ışığı üstünde titreşiyor, sanki gülüyor.", en: "Then it spits you out. You're too small to bother with. When you surface and grab onto the rocks, the lighthouse beam is flickering over you like it's laughing." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Kayalığa tırman; bir gün geri döneceksin", en: "Haul yourself up the rocks. Someday you'll come back" }
            etkiler:
              - degisken: { kule20_deneme: 1 }
              - stat: { wil: 1 }
            sonraki: "@akis"

      - id: "k20_fener"
        yer: "kule"
        paragraflar:
          - { tr: "Fenerin dibindeki kapı açık. Helezon merdivenin basamakları ıslak; tepeden aşağı ışık değil, bir bakış iniyor: ağır, sıcak, her basamakta seni biraz daha çözen bir bakış.", en: "The door at the base of the lighthouse is open. The stairs spiral, the treads are wet, and what comes down from the top isn't light. It's a gaze: heavy, warm, untangling you a little more on every step." }
          - { tr: "Tepede göz dönmeyi bırakıyor. Lambanın camları senin her şeyini gösteriyor: seviyeni, statlarını, ardından Sistem'in bile görmediği satırları. Gizli seviyeni. {npc:yanki|i}.", en: "At the top, the eye stops turning. The lamp glass shows everything about you: your level, your stats, and then lines even the System has never seen. Your hidden level. {npc:yanki}." }
          - { tr: "\"Okundun,\" diyor göz. Sesi kumdan çekilen bir dalgayı andırıyor. \"Şimdi okunmuş olarak dövüş.\"", en: "\"You have been read,\" the eye says. Its voice sounds like a wave pulling back off the sand. \"Now, having been read, fight.\"" }
        sezgiler:
          - kosul: { stat: { per: 44 } }
            metin: { tr: "Okuyabilmesi için ışık gerek. Lambanın içine düşen her gölge onu yarım saniyeliğine kör eder.", en: "It needs light to read. Every shadow that falls into the lamp blinds it for half a second." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Gözün içine yürü", en: "Walk into the eye" }
            etkiler:
              - savas: { dusmanlar: ["kule_fener_gozu@oyuncu+3"], ortam: ["su"], kazan: "k20_zafer", kaybet: "k20_yenilgi", kac: "k20_kacis" }
          - id: "golge"
            etiket: { tr: "Lambanın camlarını gölgeyle ört, sonra vur", en: "Shade the lamp glass, then strike" }
            gerekli: { egilim_min: { gizlilik: 8 } }
            etkiler:
              - gizle: 3
              - savas: { dusmanlar: ["kule_fener_gozu@oyuncu+1"], ortam: ["karanlik"], kazan: "k20_zafer", kaybet: "k20_yenilgi", kac: "k20_kacis" }
          - id: "yanki_sakla"
            etiket: { tr: "{npc:yanki|i} ışıktan sakla, sonra dövüş", en: "Hide {npc:yanki} from the beam, then fight" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, baglilik: 3 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_20", agirlik: 30 }
              - savas: { dusmanlar: ["kule_fener_gozu@oyuncu+4"], ortam: ["su"], kazan: "k20_zafer", kaybet: "k20_yenilgi", kac: "k20_kacis" }

      - id: "k20_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Göz kapanıyor. Fenerin camları kararınca iç deniz ilk kez kendi rengine dönüyor: okunmamış, adsız, sıradan bir gece denizi.", en: "The eye closes. The lighthouse glass goes dark, and for the first time the inner sea turns its own color: unread, unnamed, an ordinary sea at night." }
          - { tr: "Lambanın yerinde küçük bir pencere kalıyor, gözün son okuması. Kimin için olduğu yazmıyor ama alıcı satırı boş değil: [Okuma iletildi. Alıcı: Yedi ███.]", en: "Where the lamp was, a small window is left behind. The eye's final reading. It doesn't say who it was for, but the recipient line isn't blank: [Reading forwarded. Recipient: Seven ███.]" }
          - { tr: "Demek Analiz Sistem'in malı değilmiş, ya da yalnız onun malı değilmiş. Analiz neyi okursa birileri de onu okuyor.", en: "Analysis isn't the System's. Or not only the System's. Somebody reads whatever it reads." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "epik"
            baslik: { tr: "[KAT 20 TEMİZLENDİ]", en: "[FLOOR 20 CLEARED]" }
            satirlar:
              - { tr: "Değerlendirme sonucu: iletildi. İçerik: gizli.", en: "Assessment result: forwarded. Contents: classified." }
        secenekler:
          - id: "pencereyi_kir"
            etiket: { tr: "Pencereyi kır, okumayı kimse almasın", en: "Smash the window. Nobody gets that reading" }
            etkiler:
              - kule_kat: 20
              - xp_seviye: 85
              - bilgi: "kule_okuyan_goz"
              - gizle: 6
              - ahlak: { duzen: -3 }
            sonraki: "k20_son"
          - id: "pencereyi_oku"
            etiket: { tr: "Pencerenin alıcı satırını çözmeye çalış", en: "Try to crack the recipient line" }
            gerekli: { stat: { int: 44 } }
            etkiler:
              - kule_kat: 20
              - xp_seviye: 90
              - bilgi: "kule_okuyan_goz"
              - bayrak: "kule_alici_yedi"
              - ahlak: { insanlik: -2 }
            sonraki: "k20_alici"
          - id: "birak"
            etiket: { tr: "Bırak gitsin; göreceklerse görsünler", en: "Let it go. If they want to look, let them look" }
            etkiler:
              - kule_kat: 20
              - xp_seviye: 85
              - bilgi: "kule_okuyan_goz"
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { duzen: 2, insanlik: -1 }
            sonraki: "k20_son"

      - id: "k20_alici"
        yer: "kule"
        paragraflar:
          - { tr: "Satırın karartılmış harflerinin altını kazıyorsun. İlk ikisi yerinde duruyor, üçüncüsü taht biçiminde bir simgeye dönüşüyor. Yedi... Taht? {yer:yedi_taht}.", en: "You dig under the blacked-out letters. The first two hold still; the third turns into a glyph shaped like a throne. Seven... Thrones? The Sevenfold Court." }
          - { tr: "Bu ad sana henüz bir şey çağrıştırmıyor. Ama şimdi düşünüyorsun da Öğretici'nin son günlerinde sırtta dikilen o şey de oturmaya alışkın birinin dikliğiyle duruyordu.", en: "The word doesn't mean anything to you. Not yet. But that thing on the ridge in the last days of the Tutorial, now that you think about it, it stood like someone used to sitting on a throne." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Adı bir yere not et, aşağı in", en: "Write the name down somewhere and head down" }
            sonraki: "k20_son"

      - id: "k20_son"
        yer: "kule"
        paragraflar:
          - { tr: "Fenerin tepesinden iç denize bakıyorsun. Dipteki şey hâlâ orada, belki de artık değil; ne olursa olsun bundan sonra suya başka gözle bakacaksın.", en: "From the top of the lighthouse you look down at the inner sea. The thing on the bottom is still there, or it isn't anymore. Either way, from now on you'll look at water differently." }
          - metin: { tr: "Kayalıktaki tebeşir okunun yanına biri senden önce ikinci bir satır eklemiş: \"20 · ilk ben.\" Altında da bir saat yazıyor. Bir saatle kaçırmışsın.", en: "Next to the chalk arrow on the rocks, somebody added a second line before you got here: \"20 · me first.\" A time under it. You missed it by an hour." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
        secenekler:
          - id: "aras_cevap"
            etiket: { tr: "Tebeşirin altına kendi satırını yaz", en: "Chalk your own line under his" }
            goster: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: -2 } }
              - ahlak: { duzen: -1 }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 2, max: 5 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "in"
            etiket: { tr: "Fenerden in, kayalığa yüz", en: "Climb down and swim back to the rocks" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: okunmak acıttı mı?", en: "Ask {npc:yanki}: did getting read hurt?" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
            sonraki: "k20_yanki"

      - id: "k20_yanki"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} bir süre susuyor. sormana alışık değilim, diyor sonunda. evet, acıttı. biri seni sayfa sayfa çeviriyormuş gibi. o sayfalardan biri de benim.", en: "{npc:yanki} is quiet for a while. i'm not used to you asking, it finally says. yes. it hurt. like someone flipping through you page by page. and i'm one of the pages." }
          - { tr: "bir şey daha: o göz beni tanıdı. tanımaması gerekirdi.", en: "one more thing: that eye recognized me. it shouldn't have." }
        secenekler:
          - id: "in"
            etiket: { tr: "\"Bundan sonra kimse sayfa çevirmeyecek.\"", en: "\"Nobody's flipping through us again.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 3 } }
              - ahlak: { duzen: -1 }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

      - id: "k20_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Işık seni duvara çiviliyor; göz okumayı bitirmeden dövüşü bitiriyor. Son gördüğün şey lambanın camındaki kendi dosyan oluyor: bir sayfasının köşesi kıvrılmış, bir kenarı yanık.", en: "The beam pins you to the wall, and the eye finishes the fight before it finishes reading. The last thing you see is your own file in the lamp glass: one page dog-eared, one edge scorched." }
          - { tr: "Kendine geldiğinde kayalıktasın, sırılsıklam ve titrek. Dalgalar seni buraya geri bırakmış. Göz bir şeyi daha okumak istiyor; yeterince büyüdüğünde.", en: "When you come to, you're on the rocks, soaked and shaking. The waves carried you back. The eye wants to read something more. When you've grown enough." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Kayalıkta kurulan, sonra geri dön", en: "Dry off on the rocks. Come back later" }
            etkiler:
              - degisken: { kule20_deneme: 1 }
              - can: 20
            sonraki: "@akis"

      - id: "k20_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Helezon merdivenden aşağı, kapıdan dışarı, soğuk suya... Arkanda ışık dönüyor ama seni değil, suyun yüzünde bıraktığın izi okuyor.", en: "Down the spiral, out the door, into the cold water. Behind you the beam swings around and reads not you, but the wake you left on the surface." }
          - { tr: "Kayalığa varınca dönüp bakıyorsun. Göz yeniden dönmeye başlamış, ama ışığı her turunda bir anlığına senin durduğun yere uğruyor.", en: "When you hit the rocks you look back. The eye has started turning again, but every time it comes around, the beam stops on you for a second." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Merdivene çekil", en: "Fall back to the stairs" }
            etkiler:
              - degisken: { kule20_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 30 — AYNA SALONU (D · Sistem sırrı: senin el yazın)
  - id: "kule_kat_30"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan"]
    gerilim: 3
    yalniz_tohum: true
    kart: { tr: "Otuzuncu kat: Ayna salonu", en: "Floor Thirty: The Hall of Mirrors" }
    sahne: "k30_giris"
    sahneler:
      - id: "k30_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Otuzuncu kat tek bir uzun salondan ibaret: iki yanı boydan boya ayna, tavanı ayna, zemini ayna. Adım attığın an binlerce sen aynı adımı atıyor, salon sonsuza dek uzuyor.", en: "Floor thirty is one long hall: mirrors floor to ceiling down both sides, mirrored ceiling, mirrored floor. The second you take a step, a thousand of you take it too, and the hall runs on forever." }
          - { tr: "Ama yansımaların hepsi aynı anı göstermiyor. Birinde Öğretici'nin sisli ormanındasın, kanlar içinde. Ötekinde vapurda gülüyorsun. Bir başkasında hiç görmediğin bir odada birinin elini tutmuş, ağlıyorsun.", en: "But the reflections aren't all at the same moment. In one you're in the Tutorial's fog-wrapped forest, covered in blood. In one you're on the ferry, laughing. In one you're in a room you've never seen, holding someone's hand, and crying." }
          - { tr: "O sonuncusu dönüp sana bakıyor ve tuttuğu eli bırakıyor. Camın ardında salonun sonuna doğru yürümeye başlıyor; seninle aynı hızda ama senden yarım adım önde.", en: "That last one turns and looks at you. Lets go of the hand. Behind the glass, it starts walking toward the end of the hall, at your pace, but half a step ahead of you." }
          - metin: { tr: "Buraya daha önce de geldin. Yansımalardan biri, geçen seferki yaralarını taşıyarak sana el sallıyor.", en: "You've been here before. One of the reflections, wearing last time's wounds, waves at you." }
            kosul: { degisken_min: { kule30_deneme: 1 } }
          - metin: { tr: "Aynalardan biri seni gösteriyor ama oradaki sen bu salonu çoktan tanıyor; üstünde başka bir oyunun, başka bir tırmanışın yorgunluğu var. Bir an hangisinin yansıma olduğundan emin olamıyorsun.", en: "One of the mirrors shows you, but the you in there already knows this hall, wearing the exhaustion of another run, another climb. For a second you can't tell which one of you is the reflection." }
            kosul: { degisken_min: { onceki_oyun: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 30 · YANSIMA ODASI]", en: "[SPIRE · FLOOR 30 · REFLECTION ROOM]" }
            satirlar:
              - { tr: "Bu kattaki yansımalar yalnızca bu Entegrasyon'a ait değildir.", en: "Reflections on this floor are not limited to the current Integration." }
              - { tr: "Not: Kendinize dokunmayın.", en: "Note: Do not touch yourself." }
        sezgiler:
          - kosul: { stat: { per: 58 } }
            metin: { tr: "Salondaki aynalardan biri seni yansıtmıyor: sağdan on yedinci. Onun yerine camın üstüne parmakla yazılmış bir şey var; cam buğulanınca görünüyor.", en: "One mirror in the hall doesn't reflect you. Seventeenth on the right. Instead there's something written on it with a fingertip, and it shows when the glass fogs up." }
          - kosul: { stat: { int: 56 } }
            metin: { tr: "Önden yürüyen yansıma senden yarım adım değil, koca bir dövüş önde. Bir sonraki hamleni biliyor, çünkü bu salonu daha önce yürümüş.", en: "The reflection walking ahead isn't half a step ahead of you. It's a whole fight ahead. It knows your next move because it's walked this hall before." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aynalarda ben yokum. hiç olmadım. ama on yedinci aynada tam benim biçimimde bir boşluk var.", en: "i'm not in the mirrors. i never am. but in the seventeenth mirror there's a gap shaped exactly like me." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu yansımaların hiçbirinde ben yokum. Sence bu iyiye mi işaret, kötüye mi?\"", en: "\"I'm not in any of these reflections. Is that a good thing or a bad thing?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bunlar yansıma değil, önbellek. Sistem eski oturumları hiç silmemiş.\"", en: "\"These aren't reflections, they're cache. The System never cleared the old sessions.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Şu ağlayan sen... Kimin elini tutuyordun? Yok, cevap verme. Yürü.\"", en: "\"The one crying. Whose hand were you holding? No, don't answer. Keep walking.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Önden giden yansımanın peşinden yürü", en: "Follow the reflection walking ahead" }
            sonraki: "k30_salon_sonu"
          - id: "on_yedi"
            etiket: { tr: "Sağdan on yedinci aynayı bul, camına hohla", en: "Find the seventeenth mirror on the right. Fog it up" }
            gerekli: { stat: { per: 58 } }
            etkiler:
              - bayrak: "kule_cam_erken_okundu"
            sonraki: "k30_mektup"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Bütün aynaları tek bir darbeyle indir", en: "Bring down every mirror with one blow" }
            gerekli: { stat: { str: 60 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: -3, insanlik: -1 }
            sonraki: "k30_kirik_salon"
          - id: "yanki_bak"
            etiket: { tr: "{npc:yanki|e} kendini aynada görmeyi denemesini söyle", en: "Tell {npc:yanki} to try to see itself in the glass" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, saygi: 3 } }
            sonraki: "k30_yanki_ayna"

      - id: "k30_yanki_ayna"
        yer: "kule"
        paragraflar:
          - { tr: "Bir süre hiçbir şey olmuyor. Derken aynalardan birinde, omzunun hemen üstünde mavi bir çizgi titreşiyor; bozuk bir satıra, bir yüz taslağına benziyor.", en: "For a while, nothing. Then in one mirror, right over your shoulder, a blue line flickers: like a corrupted line of text, like the sketch of a face." }
          - { tr: "{npc:yanki} kendini ilk kez görüyor. Uzun süre sesi çıkmıyor, sonra: küçükmüşüm. daha büyük olduğumu sanıyordum. bir zamanlar daha büyüktüm.", en: "{npc:yanki} is seeing itself for the first time. It doesn't say anything for a long time. then: i'm small. i thought i was bigger. i used to be bigger." }
          - { tr: "Mavi çizgi sağdan on yedinci aynaya doğru kayıyor ve orada, bir çerçevenin içine yerleşir gibi duruyor.", en: "The blue line slides toward the seventeenth mirror on the right and settles there, like it's sitting down inside a frame." }
        secenekler:
          - id: "takip"
            etiket: { tr: "Mavi çizginin durduğu aynaya git", en: "Go to the mirror where the blue line stopped" }
            etkiler:
              - iliski: { yanki: { baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_30", agirlik: 30 }
            sonraki: "k30_mektup"
          - id: "yuru"
            etiket: { tr: "\"Sonra bakarız.\" Salonun sonuna yürü", en: "\"Later.\" Walk on to the end of the hall" }
            sonraki: "k30_salon_sonu"

      - id: "k30_kirik_salon"
        yer: "kule"
        paragraflar:
          - { tr: "Yumruğun ilk aynaya giriyor ve salondaki bütün aynalar domino taşları gibi sırayla iniyor. Çıkan ses bir şelaleyi andırıyor; cam yağmuru dindiğinde salondan geriye beton ve tozdan bir koridor kalıyor.", en: "Your fist goes into the first mirror, and every mirror in the hall comes down in order, like dominoes. It sounds like a waterfall. When the glass stops raining, the hall is just a corridor, concrete and dust." }
          - { tr: "Tek bir ayna sağlam kalıyor: sağdan on yedinci. Önüne saçılan cam kırıkları ona değmemiş bile; sanki salon onu korumuş.", en: "One mirror is left standing: seventeenth on the right. The broken glass in front of it never touched it, like the hall protected it." }
          - { tr: "Yansımaların hepsi gitmişken salonun sonunda biri hâlâ duruyor; camı olmayan bir çerçevenin içinden sana bakıyor. Kırdığın şeyler onu durdurmamış.", en: "At the end of the hall, with all the reflections gone, one is still there. Inside a frame with no glass in it, looking at you. Breaking things didn't stop it." }
        secenekler:
          - id: "ayna"
            etiket: { tr: "Önce sağlam kalan aynaya bak", en: "Check the mirror that survived first" }
            sonraki: "k30_mektup"
          - id: "son"
            etiket: { tr: "Doğrudan çerçevedeki yansımana yürü", en: "Walk straight up to your reflection in the frame" }
            sonraki: "k30_salon_sonu"

      - id: "k30_mektup"
        yer: "kule"
        paragraflar:
          - { tr: "Camın üstüne hohluyorsun. Buğunun içinde harfler beliriyor: parmakla, aceleyle yazılmış, kenarları titrek. El yazısını tanıyorsun, senin yazın. İlkokuldan beri olduğu gibi her harfin kuyruğu biraz sola yatık.", en: "You fog the glass with your breath. Letters show up in the haze, written with a fingertip, in a hurry, shaky at the edges. You know the handwriting. It's yours. Every letter's tail leans a little left, the way it has since grade school." }
          - { tr: "\"bunu okuyorsan yine buradasın. kırkıncı katta saate soru sorma, saati dinle. ellinci katın kapısına dokun ama girme, daha değil. ses sana bir şey söylemediyse bunun bir sebebi vardır; ona kızma. bir dahaki sefere daha erken başla.\"", en: "\"if you're reading this, you're here again. on forty, don't ask the clock anything. listen to it. on fifty, touch the door but don't go in, not yet. if the voice hasn't told you something, there's a reason; don't be mad at it. next time, start earlier.\"" }
          - { tr: "Altında imza yok, yalnızca yarım kalmış bir imzaya benzeyen bir çizgi. Entegrasyon Günü penceresinin en altında duran, kimsede olmayan o satır gibi.", en: "No signature underneath. Just a line, like a signature somebody never finished. Like that line at the very bottom of the Integration Day window that nobody else had." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[el yazısı eşleşmesi: %100]", en: "[handwriting match: 100%]" }
            satirlar:
              - { tr: "yazar: sen. yazılma tarihi: bulunamadı.", en: "author: you. date written: not found." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ben bunu sana söylemedim. söyleyemezdim. bilmiyordum. bilmiyorum. lütfen bana öyle bakma.", en: "i didn't tell you this. i couldn't have. i didn't know. i don't know. please don't look at me like that." }
        secenekler:
          - id: "kir_al"
            etiket: { tr: "Yazının olduğu cam parçasını kırıp yanına al", en: "Break off the piece with the writing and take it" }
            etkiler:
              - esya: { kule_cam_mektup: 1 }
              - bilgi: "kule_el_yazisi"
              - bayrak: "kule_cam_mektup_alindi"
              - ahlak: { insanlik: 1 }
            sonraki: "k30_salon_sonu"
          - id: "sil"
            etiket: { tr: "Yazıyı sil. Kimse okumasın, sen de", en: "Wipe it off. Nobody reads it. Not even you" }
            etkiler:
              - bilgi: "kule_el_yazisi"
              - ahlak: { duzen: 2, insanlik: -1 }
            sonraki: "k30_salon_sonu"

      - id: "k30_salon_sonu"
        yer: "kule"
        paragraflar:
          - { tr: "Salonun sonunda yansıman seni bekliyor. Artık camın ardında değil; camdan çıkmış, karşında duruyor. Yara izleri başka yerlerde, gözlerinin altı daha koyu. Sağ elinde bir yüzük var.", en: "Your reflection is waiting at the end of the hall. Not behind the glass anymore. It stepped out, and it's standing in front of you. Its scars are in different places. The circles under its eyes are darker. There's a ring on its right hand." }
          - { tr: "\"Hep burada dururuz,\" diyor. Ses senin ama senden yorgun. \"Hep burada dövüşürüz. Bir keresinde ben kazandım, sen aynada kaldın. Bir keresinde de sen kazandın. Bu sefer kim kazanır, bilmiyorum.\"", en: "\"We always stop here,\" it says. Your voice, but more tired than you've ever been. \"We always fight here. Once, I won, and you stayed in the mirror. Once, you won. This time, I don't know.\"" }
          - { tr: "Analiz penceren onun üstünde asılı: [Yansıman · Kademe D]. Seviye satırında yalnızca bir tire var; Sistem ona bir sayı vermeye cesaret edemiyor.", en: "Your Analysis window hovers over it: [Your Reflection · Grade D]. Just a dash in the level field. The System doesn't dare give it a number." }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[YENİ TAVAN · D]", en: "[NEW CEILING · D]" }
            satirlar:
              - { tr: "Karşınızdaki varlık sizinle aynı kişidir. Kademesi aynı değildir.", en: "The entity in front of you is the same person as you. Its Grade is not the same." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kendinle dövüş", en: "Fight yourself" }
            etkiler:
              - savas: { dusmanlar: ["kule_yansiman@oyuncu+2"], ortam: ["tavan"], kazan: "k30_zafer", kaybet: "k30_yenilgi", kac: "k30_kacis" }
          - id: "karanlik"
            etiket: { tr: "Işıkları söndür; yansıma karanlıkta yaşamaz", en: "Kill the lights. Reflections can't live in the dark" }
            gerekli: { egilim_min: { karanlik: 10 } }
            etkiler:
              - ahlak: { insanlik: -2 }
              - savas: { dusmanlar: ["kule_yansiman@oyuncu"], ortam: ["karanlik"], kazan: "k30_zafer", kaybet: "k30_yenilgi", kac: "k30_kacis" }
          - id: "sor"
            etiket: { tr: "Önce sor: \"Yüzüğün içinde ne yazıyor?\"", en: "Ask first: \"What's engraved inside the ring?\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "kule_yuzuk_soruldu"
              - savas: { dusmanlar: ["kule_yansiman@oyuncu+2"], ortam: ["tavan"], kazan: "k30_zafer", kaybet: "k30_yenilgi", kac: "k30_kacis" }

      - id: "k30_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Yansıman dizlerinin üstüne çöküyor; bir an ikiniz de aynı nefesi alıyorsunuz. Sonra camın içine geri çekiliyor, bu kez kendi isteğiyle, yatağına giren yorgun bir insan gibi ağır ağır.", en: "Your reflection drops to its knees, and for a second you're both breathing the same breath. Then it sinks back into the glass. Willingly this time, slowly, like a tired person getting into bed." }
          - metin: { tr: "Camın içinden yüzüğü sana uzatıyor. İç yüzündeki yazıyı okuyorsun: \"bir dahaki sefere\". Yüzük cama değince eriyip yok oluyor; aklında yalnızca yazı kalıyor.", en: "From inside the glass, it holds the ring out to you. You read the engraving on the inside of the band: \"next time.\" When the ring touches the glass it melts away. Only the words stay with you." }
            kosul: { bayrak: "kule_yuzuk_soruldu" }
          - { tr: "Aynaların hepsi aynı anda sıradan aynalara dönüşüyor, biri hariç. O aynada, çok uzaklarda, birinin elini tutup ağlayan sen hâlâ orada.", en: "Every mirror turns into an ordinary mirror at the same moment. Except one. In that one, far away, the you holding someone's hand and crying is still there." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "epik"
            baslik: { tr: "[KAT 30 TEMİZLENDİ]", en: "[FLOOR 30 CLEARED]" }
            satirlar:
              - { tr: "Yansıma kaydı kapatıldı. Kaçıncı kez olduğu: kaydedilmedi.", en: "Reflection log closed. Number of times: not recorded." }
        secenekler:
          - id: "ayna"
            etiket: { tr: "Ağlayan sene yaklaş; kimin elini tuttuğunu gör", en: "Go up to the crying you. See whose hand it's holding" }
            etkiler:
              - kule_kat: 30
              - xp_seviye: 90
              - bilgi: "kule_el_yazisi"
              - ahlak: { insanlik: 3 }
            sonraki: "k30_el"
          - id: "kir"
            etiket: { tr: "O son aynayı da kır. Hiçbiri senin değil", en: "Smash that last mirror too. None of them are yours" }
            etkiler:
              - kule_kat: 30
              - xp_seviye: 90
              - bilgi: "kule_el_yazisi"
              - ahlak: { insanlik: -3, duzen: -1 }
            sonraki: "k30_son"
          - id: "git"
            etiket: { tr: "Arkana bakmadan merdivene yürü", en: "Walk to the stairs without looking back" }
            etkiler:
              - kule_kat: 30
              - xp_seviye: 90
              - bilgi: "kule_el_yazisi"
              - ahlak: { duzen: 2 }
            sonraki: "k30_son"

      - id: "k30_el"
        yer: "kule"
        paragraflar:
          - { tr: "Yaklaştıkça oda netleşiyor: bir hastane odası, perdelerinde {yer:kiyikent|in} sabah ışığı. Yataktaki kişinin yüzü cama dönük değil. Tuttuğun el yaşlı ve ince, damarları belirgin.", en: "The closer you get, the clearer the room: a hospital room, curtains lit by {yer:kiyikent|pos} morning sun. The person in the bed isn't facing the glass. The hand you're holding is old, thin, the veins standing out." }
          - { tr: "Aynadaki sen yüzünü sana çevirip gülümsüyor. Bu gülümsemeyi tanıyorsun, çünkü sen de bazen öyle gülümsersin. Sonra ayna kararıyor. Bunun hangi hayattan kaldığını hiçbir zaman bilmeyeceksin. Ya da bir gün, iş işten geçtikten sonra bileceksin.", en: "The you in the mirror turns to face you and smiles. You know that smile, because you smile like that sometimes too. Then the mirror goes dark. You'll never know what life that came from. Or someday, way too late, you will." }
        secenekler:
          - id: "in"
            etiket: { tr: "Bir süre orada dur, sonra in", en: "Stand there a while. Then go down" }
            etkiler:
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} gördüğünü anlat", en: "Tell {npc:deniz_arman} what you saw" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 5, baglilik: 4 } }
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            sonraki: "k30_deniz"

      - id: "k30_deniz"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:deniz_arman} sözünü hiç kesmeden sonuna kadar dinliyor. \"Yaşlıymış,\" diyor sonra. \"Yani bir yerde, bir seferinde yaşlanmışsın. Bu iyi haber, değil mi? Biri yaşlanmayı başarmış.\"", en: "{npc:deniz_arman} listens all the way through without interrupting. \"Old,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} after. \"So somewhere, some time, you got old. That's good news, right? Somebody made it to old.\"" }
        secenekler:
          - id: "in"
            etiket: { tr: "\"Evet. Biri başarmış.\"", en: "\"Yeah. Somebody made it.\"" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 3 } }
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "k30_son"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivenin ilk basamağında durup salona son bir kez bakıyorsun. Aynalar artık yalnızca seni gösteriyor; bu katın sana yaptığı en tuhaf şey de bu sıradanlık.", en: "On the first stair, you stop and look back at the hall one last time. The mirrors only show you now. That's the strangest thing this floor has done to you: ordinary." }
          - { tr: "Cebinde ya da aklında tek bir cümle var: bir dahaki sefere daha erken başla. Kimin neye, ne zaman başlaması gerektiğini düşünmemeye çalışıyorsun.", en: "In your pocket, or in your head, there's one sentence: next time, start earlier. You try not to think about who's supposed to start what, or when." }
        secenekler:
          - id: "in"
            etiket: { tr: "İn", en: "Go down" }
            etkiler:
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} söyle: \"Sana kızmıyorum.\"", en: "Tell {npc:yanki}: \"I'm not mad at you.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 7, baglilik: 3 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_30", agirlik: 35 }
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "k30_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Yansımanın son darbesi seni bir aynaya çarpıyor ve bir an camın öbür yanına geçiyorsun. İçerisi soğuk ve sessiz; salonda dışarıdaki sen, yani o, nefes nefese dikiliyor.", en: "Your reflection's last blow slams you into a mirror, and for a second you're on the other side of the glass. It's cold and silent in there. Out in the hall, the outside you, meaning it, stands there gasping." }
          - { tr: "Sonra seni dışarı itiyor. \"Daha değil,\" diyor. \"Henüz hazır değilsin, ben de değilim. Bir dahaki sefere.\" Gözlerini açtığında merdivenin dibindesin.", en: "Then it shoves you back out. \"Not yet,\" it says. \"You're not ready yet. Neither am I. Next time.\" When you open your eyes, you're at the bottom of the stairs." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Kalk. Bir dahaki sefere", en: "Get up. Next time" }
            etkiler:
              - degisken: { kule30_deneme: 1 }
              - can: 20
            sonraki: "@akis"

      - id: "k30_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Salonun girişine koşuyorsun; binlerce sen de seninle birlikte koşuyor. Yalnız biri koşmuyor: salonun sonunda kollarını kavuşturmuş, seni izliyor.", en: "You run for the front of the hall, and a thousand of you run with you. Just one doesn't: it stays at the end of the hall, arms folded, watching." }
          - { tr: "Merdivende durduğunda yansımaların artık senin hızına yetişmiyor; biraz geride kalmışlar, utanmış gibi.", en: "When you stop on the stairs, your reflections aren't keeping up anymore. They're a little behind. Like they're embarrassed." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Soluklan, sonra geri dön", en: "Catch your breath. Come back later" }
            etkiler:
              - degisken: { kule30_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 40 — DURMUŞ SAAT (D → C · yeni tavan + Sistem sırrı: Gün 0)
  - id: "kule_kat_40"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Kırkıncı kat: Durmuş saat", en: "Floor Forty: The Stopped Clock" }
    sahne: "k40_giris"
    sahneler:
      - id: "k40_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Kırkıncı kat koca bir saat kadranı. Zemin camdan bir kadran, sen de rakamların üstünde yürüyorsun; ayağının altında futbol sahası uzunluğundaki akrep ve yelkovan ağır ağır dönüyor.", en: "Floor forty is a clock face. The floor is a glass dial and you're walking across the numbers. Under your feet, an hour hand and a minute hand as long as a football field turn slow and heavy." }
          - { tr: "Kadranda rakam yok, çentik var: daire boyunca üç yüz altmış beş çentik. On ikinin olması gereken yerde ise ötekilerden kalın, üç yüz altmış altıncı bir çentik duruyor. Altında bir sıfır.", en: "There are no numbers on the dial, just notches. Three hundred sixty-five of them, all the way around. And where twelve should be, thicker than the rest, a three hundred sixty-sixth notch. Under it, a zero." }
          - { tr: "Kadranın ortasında, akrebin bağlandığı yerde biri oturuyor; kolları akrep ve yelkovandan. Seninle onun arasında, havada kıpırtısız asılı biri daha var: mızrağını ileri uzatmış, ayakları yerden kesilmiş, tam bir hamlenin ortasında donup kalmış bir kadın.", en: "In the center of the dial, where the hour hand is fixed, someone is sitting, its arms an hour hand and a minute hand. Between you and it, hanging motionless in the air, is someone else: a woman, spear thrust forward, feet off the ground, frozen in the middle of a lunge." }
          - metin: { tr: "Buraya daha önce de geldin. Kadında tek bir şey değişmiş: mızrağının ucu bir parmak daha ilerlemiş. Sen yokken saat onun için azıcık akmış.", en: "You've been here before. The only thing different about the woman is that her spear point has moved one finger-width further. While you were gone, the clock ran a little for her." }
            kosul: { degisken_min: { kule40_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 40 · DURMUŞ SAAT]", en: "[SPIRE · FLOOR 40 · THE STOPPED HOUR]" }
            satirlar:
              - { tr: "Bu katta zaman isteğe bağlıdır.", en: "Time on this floor is optional." }
              - { tr: "Not: Ceza bölgeleri bu mekanizmanın bir alt kümesini kullanır. İlginiz için teşekkürler.", en: "Note: Penalty zones run on a subset of this mechanism. Thank you for your interest." }
        sezgiler:
          - kosul: { stat: { per: 75 } }
            metin: { tr: "Donmuş kadının Analiz'i: [İnsan · Seviye 140 · Kademe C · Durum: durdurulmuş]. Bir insan, hem de C kademesinde. {yer:kiyikent|de} böyle biri yok. Bu döngüde yok.", en: "The frozen woman's Analysis: [Human · Level 140 · Grade C · Status: suspended]. A human. A C-Grade human. There's nobody like that in {yer:kiyikent}. Not in this cycle." }
          - kosul: { stat: { wis: 72 } }
            metin: { tr: "Saatin tıkırtısı kalp atışı değil, geri sayım. Ustanın görevi de saati kurmak değil, onu kimin geri sardığını yakalamak.", en: "The ticking isn't a heartbeat. It's a countdown. And the clockwright's job isn't winding the clock. It's catching whoever keeps rewinding it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "saate soru sorma. bunu bir yerden biliyorum, nereden bildiğimi bilmiyorum. yalnızca dinle.", en: "don't ask the clock anything. i know that from somewhere. i don't know where. just listen." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O kadın... ne zamandır orada? Günlerdir mi, yıllardır mı? Biri ona bir şey söylemeli.\"", en: "\"That woman... how long has she been up there? Days? Years? Somebody should tell her something.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"C kademesinde bir insan. Benden önce. Senden önce. Bu canımı sıkıyor.\"", en: "\"A C-Grade human. Before me. Before you. That bugs me.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Üç yüz altmış altı çentik. Taşma bu. Sayaç 365'ten sonra sıfıra dönüyor. Bu bir takvim değil, döngü sayacı.\"", en: "\"Three hundred sixty-six notches. An overflow. The counter wraps to zero after 365. That's not a calendar, it's a loop counter.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Kadranın ortasında durup saati dinle", en: "Stand in the middle of the dial and listen to the clock" }
            gerekli: { stat: { wis: 72 } }
            etkiler:
              - bayrak: "kule_saat_dinlendi"
              - ahlak: { duzen: 2 }
            sonraki: "k40_dinle"
          - id: "sor"
            etiket: { tr: "Ustaya seslen: \"Bu saat neyi sayıyor?\"", en: "Call out to the clockwright: \"What's this clock counting?\"" }
            etkiler:
              - dikkat: 2
            sonraki: "k40_soru"
          - id: "kadin"
            etiket: { tr: "Donmuş kadına yaklaş", en: "Go up to the frozen woman" }
            sonraki: "k40_kadin"
          - id: "akrep"
            tur: "gosteris"
            etiket: { tr: "Akrebi iki elinle yakalayıp durdur", en: "Grab the hour hand with both hands and stop it" }
            gerekli: { stat: { str: 80 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3 }
            sonraki: "k40_akrep"

      - id: "k40_dinle"
        yer: "kule"
        paragraflar:
          - { tr: "Gözlerini kapatıyorsun. Tik, tak... Bir süre sonra tıkırtının içinde bir düzen seçiyorsun: üç yüz altmış beş vuruş, bir boşluk, sonra yine bir. Boşlukta bir şey var: bir nefes, milyonlarca insanın aynı anda çektiği bir nefes.", en: "You close your eyes. Tick. Tock. After a while you hear a pattern inside the ticking: three hundred sixty-five beats, then a gap, then one again. There's something in the gap: a breath, millions of people drawing the same breath at once." }
          - { tr: "Entegrasyon'un sesi bu. Saat her 365 vuruşta bir Entegrasyon'u yeniden çalıyor. Gözlerin kapalı, kaç kez çaldığını sayamıyorsun; çünkü saat bu sayıyı söylemiyor. Ona soran olmamış.", en: "The sound of Integration. Every 365 beats, the clock plays an Integration again. And with your eyes closed you can't count how many times it's played, because the clock doesn't say. Nobody ever asked it." }
        secenekler:
          - id: "ac"
            etiket: { tr: "Gözlerini aç, ustaya yürü", en: "Open your eyes. Walk toward the clockwright" }
            etkiler:
              - bilgi: "kule_sifir_gunu"
            sonraki: "k40_usta"

      - id: "k40_soru"
        yer: "kule"
        paragraflar:
          - { tr: "Usta başını kaldırıyor. Yüzü bir kadran; gözlerinin yerinde iki küçük saat dönüyor. \"Neyi saydığını mı?\" Sesi kurmalı bir oyuncağınkini andırıyor. \"Kimse ne saydığını sormaz, hep kaç kaldığını sorar. Sen de kaç kaldığını sor.\"", en: "The clockwright looks up. Its face is a dial, two little clocks spinning where the eyes should be. \"What it's counting?\" Its voice sounds like a wind-up toy. \"Nobody asks what it counts. They always ask how much is left. You ask how much is left, too.\"" }
          - { tr: "\"Kalan: bu turda üç yüz küsur gün. Sonra sıfır. Sonra yine üç yüz altmış beş.\" Başını yana eğiyor. \"Bunu bilmemeliydin. Ama hep soruyorsun. Her seferinde tam bu kadar geç kalıyor, tam bunu soruyorsun.\"", en: "\"Left: three hundred-something days, this round. Then zero. Then three hundred sixty-five again.\" It tilts its head. \"You weren't supposed to know that. But you always ask. Every time, you're late by exactly this much, and you ask exactly this.\"" }
        secenekler:
          - id: "usta"
            etiket: { tr: "\"Her seferinde mi?\"", en: "\"Every time?\"" }
            etkiler:
              - bilgi: "kule_sifir_gunu"
              - dikkat: 2
            sonraki: "k40_usta"

      - id: "k40_kadin"
        yer: "kule"
        paragraflar:
          - { tr: "Kadının yüzü bir haykırışın ortasında donmuş; yüzündeki öfke değil, kararlılık. Zırhında hiç görmediğin bir loncanın arması, kolunda {yer:kiyikent|in} eski belediye logosu var. Ama zırhın tasarımı yıllar sonrasından, ya da çok uzun bir yıldan gelmiş gibi.", en: "Her face is frozen mid-shout. Not rage: resolve. Her armor carries the crest of a guild you've never seen, and on her arm is {yer:kiyikent|pos} old city seal. But the armor's design looks like it came from years ahead, or from one very long year." }
          - { tr: "Mızrağının ucu ustanın göğsüne bir karış kala durmuş. Az kalsın başaracakmış. Az kalsın.", en: "Her spear point stopped a hand's width from the clockwright's chest. She almost made it. Almost." }
          - { tr: "Göğsündeki küçük rozette el yazısıyla bir gün sayısı yazılı: 341. Altına sonradan kazınmış: \"bu sefer\".", en: "On a little badge on her chest, handwritten, is a day count: 341. Under it, scratched in later: \"this time.\"" }
        secenekler:
          - id: "coz"
            etiket: { tr: "Saati onun için bir saniye ileri it", en: "Push the clock one second forward for her" }
            gerekli: { stat: { int: 74 } }
            etkiler:
              - bayrak: "kule_kadin_konustu"
              - ahlak: { merhamet: 3, duzen: -2 }
            sonraki: "k40_kadin_konusur"
          - id: "birak"
            etiket: { tr: "Ona dokunma, ustaya git", en: "Don't touch her. Go to the clockwright" }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "k40_usta"
          - id: "soz"
            etiket: { tr: "Kulağına fısılda: \"Ben bitireceğim.\"", en: "Whisper in her ear: \"I'll finish it.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - bayrak: "kule_kadina_soz"
            sonraki: "k40_usta"

      - id: "k40_kadin_konusur"
        yer: "kule"
        paragraflar:
          - { tr: "Saati itiyorsun; bir saniye, yalnızca onun çevresinde. Kadının hamlesi bir saniyelik yol alıyor, mızrak ustanın göğsüne yarım karış daha yaklaşıyor ve kadının gözleri çok yavaşça sana dönüyor.", en: "You push the clock: one second, just around her. Her lunge travels one second's worth, the spear creeps half a hand closer to the clockwright's chest, and her eyes, very slowly, turn toward you." }
          - { tr: "Dudakları bir saniyede ancak tek bir sözcüğe yetişiyor: \"Kaçıncı?\" Sonra saniye bitiyor ve kadın yeniden donuyor; sorusu yüzünde, cevabını bekliyor.", en: "Her lips manage two words in one second. \"Which one?\" Then the second runs out and she freezes again, the question on her face, waiting for an answer." }
          - { tr: "Hangi gün olduğunu değil, hangi döngü olduğunu sordu. Bundan eminsin, ama nasıl emin olduğunu bilmiyorsun.", en: "She didn't ask what day it was. She asked which cycle. You're sure of that. You don't know how you're sure." }
        secenekler:
          - id: "usta"
            etiket: { tr: "Cevabı ustadan al", en: "Get the answer out of the clockwright" }
            etkiler:
              - bilgi: "kule_sifir_gunu"
            sonraki: "k40_usta"

      - id: "k40_akrep"
        yer: "kule"
        paragraflar:
          - { tr: "Akrep bir yük treni gibi avuçlarına yükleniyor. Ayakların camın üstünde kayıp bileklerin çatırdarken akrep birden duruyor. Bütün kat bir an nefesini tutmuş.", en: "The hour hand shoves against your palms like a freight train. Your boots skid on the glass, your wrists creak, and then the hand stops. The whole floor holds its breath." }
          - { tr: "Kadranın ortasındaki usta ilk kez ayağa kalkıyor. \"Sen,\" diyor; sesine ilk kez bir duygu karışmış, umut mu korku mu kestiremiyorsun. \"Her gece saati geri saran sen misin?\"", en: "For the first time, the clockwright in the center of the dial stands up. \"You,\" it says, and for the first time there's feeling in its voice: hope, or fear, you can't tell. \"Are you the one who rewinds it every night?\"" }
        secenekler:
          - id: "evet"
            etiket: { tr: "\"Belki de benim.\"", en: "\"Maybe I am.\"" }
            etkiler:
              - ahlak: { duzen: -2 }
              - bilgi: "kule_sifir_gunu"
            sonraki: "k40_usta"
          - id: "hayir"
            etiket: { tr: "\"Hayır. Ama onu bulacağım.\"", en: "\"No. But I'm going to find whoever it is.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - bilgi: "kule_sifir_gunu"
            sonraki: "k40_usta"

      - id: "k40_usta"
        yer: "kule"
        paragraflar:
          - { tr: "Usta kadranın ortasından doğruluyor. Akrep ve yelkovan kolları açılıyor; aradaki açı tam şimdiki saati gösteriyor ve şimdiki saat bütün katta bir uyarı gibi yankılanıyor.", en: "The clockwright rises from the center of the dial. Its hour-hand and minute-hand arms swing open, and the angle between them shows exactly the current time, and the current time echoes across the whole floor like a warning." }
          - { tr: "\"Bilirsin,\" diyor. \"Saati geri saran her kimse, ona ulaşmak için önce benden geçmek gerekir. Bakalım bu sefer kim geçecek.\"", en: "\"You know how it goes,\" it says. \"Whoever is rewinding the clock, getting to them means getting past me first. Let's see who gets past this time.\"" }
        sezgiler:
          - kosul: { stat: { int: 78 } }
            metin: { tr: "Dişlileri sıcaktan genleşmiş. Soğuk onu bir saniyeliğine kilitler: buz, ya da saatin dışından gelen herhangi bir şey.", en: "Its gears have swelled in the heat. Cold would lock it for a second: ice, or just anything from outside the clock." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Kadranın ortasına yürü", en: "Walk to the center of the dial" }
            etkiler:
              - savas: { dusmanlar: ["kule_saat_ustasi@oyuncu+4"], ortam: ["dar_gecit"], kazan: "k40_zafer", kaybet: "k40_yenilgi", kac: "k40_kacis" }
          - id: "dinlenmis"
            etiket: { tr: "Ritimde duyduğun boşlukta vur", en: "Strike in the gap you heard in the rhythm" }
            goster: { bayrak: "kule_saat_dinlendi" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kule_saat_ustasi@oyuncu+2"], ortam: ["dar_gecit"], kazan: "k40_zafer", kaybet: "k40_yenilgi", kac: "k40_kacis" }
          - id: "yanki_zaman"
            etiket: { tr: "{npc:yanki|den} saatin bir dişlisini bozmasını iste", en: "Ask {npc:yanki} to jam one of the clock's gears" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - yozlasma: 3
              - iliski: { yanki: { guven: 4, baglilik: 5 } }
              - ahlak: { insanlik: -2 }
              - savas: { dusmanlar: ["kule_saat_ustasi@oyuncu+3"], ortam: ["dar_gecit"], kazan: "k40_zafer", kaybet: "k40_yenilgi", kac: "k40_kacis" }

      - id: "k40_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Usta kadranın üstüne yığılıyor; göğsündeki kum saati, kumu akmaz olunca camdan bir böcek gibi yerde dönmeye başlıyor. Saat duruyor. Bütün kat ilk kez gerçekten sessiz.", en: "The clockwright collapses across the dial, and the hourglass in its chest spins on the floor like a glass beetle once the sand stops running. The clock stops. The whole floor is truly silent for the first time." }
          - { tr: "Derken havadaki kadın düşüyor ve donmuş hamle sonunda tamamlanıyor: mızrak artık orada olmayan ustanın yerinden geçiyor, kadın yere çarpıp bir daha kalkmıyor. Sen bakarken zırhı yılların tozuna dönüşüyor; zaman ona bir anda yetişmiş.", en: "Then the woman in the air falls. The end of a frozen lunge: the spear passes through where the clockwright used to be and she hits the floor. She doesn't get up. As you watch, her armor turns to the dust of years. Time caught up with her all at once." }
          - metin: { tr: "Son nefesinde dudakları kıpırdıyor: \"Bu sefer.\" Ona verdiğin söz aklına geliyor.", en: "Her lips move on her last breath: \"This time.\" You remember the promise you made her." }
            kosul: { bayrak: "kule_kadina_soz" }
        bildirimler:
          - tur: "gorev"
            nadirlik: "efsanevi"
            baslik: { tr: "[KAT 40 TEMİZLENDİ]", en: "[FLOOR 40 CLEARED]" }
            satirlar:
              - { tr: "Durmuş Saat serbest bırakıldı. Bir kayıt kapatıldı: insan · C · durdurulma süresi: hesaplanamadı.", en: "The Stopped Hour has been released. One record closed: human · C · suspension time: incalculable." }
              - { tr: "Döngü sayacı: █.", en: "Cycle counter: █." }
        secenekler:
          - id: "gom"
            etiket: { tr: "Kadının tozunu topla; bir yere gömülmeli", en: "Gather the woman's dust. She should be buried somewhere" }
            etkiler:
              - kule_kat: 40
              - xp_seviye: 100
              - esya: { kule_durmus_akrep: 1 }
              - bilgi: "kule_sifir_gunu"
              - ahlak: { merhamet: 4, insanlik: 3 }
              - itibar: { siginak: 3 }
            sonraki: "k40_tavan"
          - id: "rozet"
            etiket: { tr: "Rozetini al; \"bu sefer\" yazısını artık sen taşı", en: "Take her badge. You carry the \"this time\" now" }
            etkiler:
              - kule_kat: 40
              - xp_seviye: 100
              - esya: { kule_durmus_akrep: 1 }
              - bilgi: "kule_sifir_gunu"
              - bayrak: "kule_rozet_alindi"
              - stat: { wil: 2 }
              - ahlak: { insanlik: 1, duzen: -1 }
            sonraki: "k40_tavan"
          - id: "kum_saati"
            etiket: { tr: "Kum saatini incele, ters çevir", en: "Study the hourglass. Turn it over" }
            gerekli: { stat: { int: 78 } }
            etkiler:
              - kule_kat: 40
              - xp_seviye: 110
              - esya: { kule_durmus_akrep: 1 }
              - bilgi: "kule_sifir_gunu"
              - bayrak: "kule_kum_saati"
              - ahlak: { insanlik: -2 }
            sonraki: "k40_kum"

      - id: "k40_kum"
        yer: "kule"
        paragraflar:
          - { tr: "Kum saatini ters çeviriyorsun. Kum aşağı değil, yukarı akıyor. Yakından bakınca her tanenin küçük, mavi bir pencere olduğunu görüyorsun: [Gün 1]. [Gün 2]. [Gün 3]. Ta en son taneye kadar: [Gün 0].", en: "You turn the hourglass over. The sand doesn't run down. It runs up. And every grain, up close, is a tiny blue window: [Day 1]. [Day 2]. [Day 3]. All the way to the last grain: [Day 0]." }
          - { tr: "Sıfırıncı gün son tane. Başlangıç sonun içinde duruyor, tıpkı her sabahın bir önceki akşamın içinde durduğu gibi.", en: "Day zero is the last grain. The beginning sits inside the end, the way every morning sits inside the evening before." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kum saatini yere bırak", en: "Set the hourglass down" }
            sonraki: "k40_tavan"

      - id: "k40_tavan"
        yer: "kule"
        paragraflar:
          - { tr: "Kadranın camının altında bir şey kıpırdıyor. Saat durunca alttaki katın derinliklerinde başka bir saat görünür oluyor: daha büyük, daha eski. Kırkıncı kat meğer koca bir saatin en küçük dişlisiymiş.", en: "Something moves under the glass of the dial. With the clock stopped, a different clock shows deep in the floor below it: bigger, older. Floor forty was just the smallest gear in a much bigger clock." }
          - { tr: "O büyük saatin kadranında bir el var. Akrep değil, el: kocaman, tembel bir insan eli, yelkovanı parmağıyla geri itiyor. Analiz penceren yalnızca tek bir harf yazabiliyor: [C]. Sonra pencere kendiliğinden kapanıyor.", en: "There's a hand on that bigger clock's dial. Not a clock hand. A hand: a person's hand, huge and lazy, pushing the minute hand back with one finger. Your Analysis window manages one letter: [C]. Then it closes itself." }
          - { tr: "C kademesinde bir şey saati geri sarıyor, hem de hiç umursamadan, sinek kovar gibi. Bu kat da bu dövüş de onun için bir saniyelik rahatsızlıktan ibaret.", en: "Something C-Grade is rewinding the clock, and doing it without a care, like swatting a fly. This whole floor, this whole fight, is a one-second annoyance to it." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[YENİ TAVAN · C]", en: "[NEW CEILING · C]" }
            satirlar:
              - { tr: "Gözlemlenen varlık: okunamadı. Kademe: C (tahmini). Sizinle ilgilenmiyor.", en: "Observed entity: unreadable. Grade: C (estimated). Not interested in you." }
              - { tr: "Henüz.", en: "Yet." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o el. onu tanımam gerekiyor. içimde bir yer var, bir dosya gibi; açılmak istiyor ama açılmıyor. lütfen bana bir dakika ver.", en: "that hand. i'm supposed to know it. there's a place in me, like a file, that wants to open and won't. please give me a minute." }
        secenekler:
          - id: "in"
            etiket: { tr: "Aşağı in; bu iş sonraya kalsın", en: "Go down. That's a problem for later" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bir dakika değil, ne kadar gerekiyorsa ver", en: "Give {npc:yanki} as long as it needs, not a minute" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, baglilik: 5 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_40", agirlik: 40 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 1, max: 3 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "k40_yanki"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|e} döngü sayacını sor", en: "Ask {npc:mert_kilic} about the loop counter" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 5, saygi: 5 } }
              - itibar: { sessiz_ag: 4 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "k40_mert"

      - id: "k40_yanki"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivenin dibine oturup bekliyorsun. Bir süre sonra {npc:yanki} alçak sesle, tane tane konuşuyor: o el, saati geri saran el, bir zamanlar bana bir şey yazdı. tek bir satır. o satır benim.", en: "You sit at the foot of the stairs and wait. After a while {npc:yanki} speaks, low, word by word: that hand, the one rewinding the clock, wrote something into me once. one line. that line is me." }
          - { tr: "ya da yanlış hatırlıyorum. bir hata yanlış hatırlayabilir mi? onu da bilmiyorum. ama beklediğin için teşekkür ederim. kimse beklemez.", en: "or i'm remembering wrong. can a glitch remember wrong? i don't know that either. but thank you for waiting. nobody waits." }
        secenekler:
          - id: "in"
            etiket: { tr: "\"Ben beklerim.\"", en: "\"I do.\"" }
            etkiler:
              - iliski: { yanki: { saygi: 3 } }
              - ahlak: { insanlik: 1 }
            sonraki: "@akis"

      - id: "k40_mert"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:mert_kilic} gözlüğünü çıkarıp siliyor; düşünürken hep böyle yapar. \"Bir sayaç düşün,\" diyor. \"365'te taşıyor, sıfıra dönüyor. Taşmayı kimse fark etmiyor, çünkü taşmadan sonra sayacı hatırlayan kalmıyor. Hatırlayan bir şey kalırsa ona hata denir.\"", en: "{npc:mert_kilic} takes his glasses off and cleans them; he always does that when he's thinking. \"Picture a counter,\" he says. \"It overflows at 365 and wraps to zero. Nobody notices the overflow, because after it, nobody remembers the counter. If something does remember, you call it a bug.\"" }
          - { tr: "Sana bakıyor, sonra kafanın içindekine bakıyormuş gibi gözlerinin biraz ardına. \"Ya da ona yankı dersin,\" demiyor. Demesine gerek yok.", en: "He looks at you. Then a little past your eyes, like he's looking at the thing in your head. He doesn't say \"or you call it an echo.\" He doesn't have to." }
        secenekler:
          - id: "in"
            etiket: { tr: "\"Bunu Ağ'a götür. Sessizce.\"", en: "\"Take this to the Network. Quietly.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 4 } }
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "k40_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Kum saati dönüyor ve sen son beş saniyeyi, sonra yine son beş saniyeyi, sonra bir daha son beş saniyeyi yaşıyorsun; her seferinde darbeyi yiyen sensin. Bir yerden sonra saymayı bırakıyorsun.", en: "The hourglass flips and you live the last five seconds, then the last five seconds, then the last five seconds again, and every time you're the one taking the hit. At some point you stop counting." }
          - { tr: "Sonunda usta seni kadranın dışına itiyor; acıdığı için değil, sıkıldığı için. \"Erken,\" diyor. \"Hep ya erken ya geç.\" Merdivenin dibinde kalbinin yeniden kendi ritmine döndüğünü duyuyorsun.", en: "Then the clockwright shoves you off the dial. Not out of pity. Out of boredom. \"Too early,\" it says. \"Always too early or always too late.\" At the foot of the stairs, you hear your heartbeat slip back into its own rhythm." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Kendi saatine dön, sonra yine gel", en: "Get back on your own clock. Then come back" }
            etkiler:
              - degisken: { kule40_deneme: 1 }
              - can: 25
            sonraki: "@akis"

      - id: "k40_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Kadranın kenarına koşuyorsun; yelkovan arkandan tırpan gibi iniyor ve tam merdivenin başında seni ıskalıyor. Bir saniyeyle kurtuldun, o saniyenin kimden çalındığını da bilmiyorsun.", en: "You sprint for the edge of the dial. The minute hand comes after you like a scythe and misses you right at the top of the stairs. One second. You got out by one second, and you don't know whose second it was." }
          - { tr: "Arkanda usta yeniden yerine oturuyor. Kadın havada, mızrağı ileride, hâlâ bekliyor.", en: "Behind you, the clockwright sits back down. The woman is still in the air, spear out, still waiting." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Merdivenden in", en: "Go down the stairs" }
            etkiler:
              - degisken: { kule40_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 50 — EŞİK (C · Sistem sırrı: hasat edilmiş dünyalar; çok-evren geçidi)
  # Parti I'nin cok_evren_kapisi (AY 200) ile uyumlu: geçit burada "görülür", mührüne dokunulur; açılış ana yaydadır.
  - id: "kule_kat_50"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "cok_evren"]
    gerilim: 4
    yalniz_tohum: true
    onemli: true
    kart: { tr: "Ellinci kat: Eşik", en: "Floor Fifty: The Threshold" }
    sahne: "k50_giris"
    sahneler:
      - id: "k50_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Ellinci kat başka dünyaların molozundan oluşmuş bir yamaç. Kabuklu kubbelerin kırıkları, sarmal kulelerin gövdeleri, okuyamadığın alfabelerle yazılmış tabelalar; hepsi yukarıya, tek bir noktaya doğru yığılmış.", en: "Floor fifty is a slope, a hillside made of other worlds' rubble. Shards of shelled domes, the trunks of spiral towers, signs in alphabets you can't read, all piled up toward one single point." }
          - { tr: "O noktada bir kapı duruyor. Ne çerçevesi var ne duvarı; havada açılmış, kapı biçiminde bir boşluk. İçinden başka renklerde gökyüzleri görünüyor: batık adaların üstünde yeşil bir şafak, pirinçten bir şehrin üstünde iki güneş, yedi tahtlı bir salonun karanlığı.", en: "At that point stands a door. No frame, no wall: a door-shaped hole opened in the air. Through it you can see skies in other colors: a green dawn over drowned islands, two suns over a city of brass, the darkness of a hall with seven thrones." }
          - { tr: "Kapının önünde bir dev nöbet tutuyor. Zırhı bu dünyadan değil, mızrağı bir köprü kadar uzun. Seni görünce bilmediğin bir dilde tek bir sözcük söylüyor. Sistem çevirmiyor; gerek de yok.", en: "A giant stands guard in front of the door. Its armor isn't from this world; its spear is as long as a bridge. It sees you and says one word in a language you don't know. The System doesn't translate. It doesn't need to." }
          - metin: { tr: "Kapı açık. Mühür kalkmış, çok-evren insanlara açılmış; ama bu dev açık bir kapının önünde hâlâ nöbet tutuyor. Ona nöbetinin bittiğini söyleyen olmamış.", en: "The door is open. The seal is gone; the multiverse opened up to humanity, and this giant is still standing guard in front of an open door. Nobody ever told it the watch was over." }
            kosul: { bayrak: "cok_evren_acik" }
          - metin: { tr: "Buraya daha önce de geldin. Dev seni tanıyor; mızrağını kaldırmadan önce bir an selam verir gibi başını eğiyor.", en: "You've been here before. The giant knows you. Before it raises its spear, for a second, it dips its head like a salute." }
            kosul: { degisken_min: { kule50_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KULE · KAT 50 · EŞİK]", en: "[SPIRE · FLOOR 50 · THRESHOLD]" }
            satirlar:
              - { tr: "Komşu Katmanlara geçiş noktası tespit edildi. Durum: mühürlü.", en: "Transit point to neighboring Layers detected. Status: sealed." }
              - { tr: "Bu kattaki malzemenin %100'ü hasat edilmiş Katmanlardan geri kazanılmıştır. Çevreye duyarlılığınız için teşekkür ederiz.", en: "100% of the materials on this floor were recovered from harvested Layers. Thank you for being environmentally conscious." }
        sezgiler:
          - kosul: { stat: { per: 115 } }
            metin: { tr: "Moloz gelişigüzel yığılmamış. Her yığının tepesinde kırık bir kulenin ucu var. Demek her hasat edilmiş dünyanın bir Kulesi varmış ve hepsinin bir parçası burada.", en: "The rubble isn't random. At the top of every heap is the tip of a broken tower. Every harvested world had a Spire. Pieces of all of them are here." }
          - kosul: { stat: { wis: 110 } }
            metin: { tr: "Devin içinde ruh değil, Öz var. Onu ayakta tutan bir emir, bir de o emri vereni beklemeyi sürdürme isteği.", en: "There's no soul inside the giant. There's Essence. What keeps it standing is an order, and the wish to keep waiting for whoever gave it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onun dilini biliyorum. bilmemem gerekirdi. tercüme edebilirim ama söyleyeceğini duymak istediğinden emin ol.", en: "i know its language. i shouldn't. i can translate, but be sure you want to hear what it's going to say." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu molozun her parçası bir şehirmiş, değil mi? Birilerinin eviymiş. Bir gün bizimki de buraya mı düşecek?\"", en: "\"Every piece of this rubble used to be a city, right? Somebody's home. Is ours going to end up here someday?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"O kapının öbür yanında her şey bizden güçlü. Güzel. Canım sıkılmaya başlamıştı.\"", en: "\"Everything on the other side of that door is stronger than us. Good. I was getting bored.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O dev yaralı. Yüzyıllardır yaralı. Kimse onunla ilgilenmemiş.\"", en: "\"That giant is wounded. It's been wounded for centuries. Nobody's ever looked after it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"'Geri kazanılmış malzeme.' Sistem bir dünyanın enkazına geri dönüşüm diyor. Bunu bir kenara yazıyorum.\"", en: "\"'Recovered materials.' The System calls a dead world's wreckage recycling. I'm writing that down.\"" }
        secenekler:
          - id: "tercume"
            etiket: { tr: "{npc:yanki|e} devin dilini tercüme ettir", en: "Have {npc:yanki} translate the giant's language" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 5, saygi: 4 } }
              - ahlak: { insanlik: -2 }
            kronik: { tr: "Ölmüş bir dünyanın son askerini kendi dilinden dinledin; kafandaki sesin o dili nereden bildiğini o gün ilk kez merak ettin.", en: "On the fiftieth floor you heard a dead world's last soldier out in its own tongue, and for the first time you wondered how the voice in your head knew it." }
            sonraki: "k50_tercume"
          - id: "selam"
            etiket: { tr: "Silahını yere koy, onun gibi başını eğ", en: "Lay your weapon down and dip your head like it does" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
            kronik: { tr: "Silahını yere bırakıp başka bir dünyanın son kahramanını bir asker gibi selamladın.", en: "Before you fought another world's last hero, you saluted it like a soldier." }
            sonraki: "k50_selam"
          - id: "moloz"
            etiket: { tr: "Önce molozu incele; bu dünyalar kimdi?", en: "Study the rubble first. Who were these worlds?" }
            gerekli: { stat: { per: 115 } }
            etkiler:
              - bilgi: "kule_hasat_edilmis_dunyalar"
              - ahlak: { duzen: 2, insanlik: 1 }
            kronik: { tr: "Ellinci kattaki molozu okudun ve hasat edilen her dünyanın bir Kulesi olduğunu gördün.", en: "You read the rubble on the fiftieth floor and saw that every harvested world had a Spire too." }
            sonraki: "k50_moloz"
          - id: "hucum"
            tur: "gosteris"
            etiket: { tr: "Mızrağın üstünden koşup devin yüzüne ulaş", en: "Run up the length of its spear to its face" }
            gerekli: { stat: { agi: 120 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -4, merhamet: -2 }
            kronik: { tr: "Bekçinin mızrağını yol gibi kullanıp devin yüzüne koştun; gücünü saklamaya hiç uğraşmadın.", en: "Far above {yer:kule_dibi}, you ran up the warden's spear like a road to its face and didn't bother hiding what you could do." }
            sonraki: "k50_savas_once"

      - id: "k50_tercume"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} devin söylediği sözcüğü ağzında evirip çeviriyor. bu \"dur\" değil, diyor. \"geri dön\" de değil. eski bir sözcük; dünyası düştükten sonra bir askerin elinde kalan tek emre verdiği ad: \"bekle.\"", en: "{npc:yanki} turns the giant's word over in its mouth. it isn't \"halt,\" it says. it isn't \"go back\" either. it's an old word. the name a soldier gives the one order still standing after its world fell: \"wait.\"" }
          - { tr: "Dev bir sözcük daha söylüyor, daha uzun, daha yorgun. {npc:yanki} çeviriyor: kapı bir sonraki dünyanın. sizin. kapı açıldığında ben biteceğim. siz öbür tarafta ne olduğunu göreceksiniz. ben görmek istemiyorum.", en: "The giant says another word, longer, more tired. {npc:yanki} translates: the door belongs to the next world. yours. when it opens i will be finished. you will see what is on the other side. i do not want to." }
          - { tr: "Sonra mızrağını kaldırıyor. çünkü emir bu, diyor {npc:yanki} son sözcüğü çevirirken. emirden başka hiçbir şeyi kalmadı.", en: "Then it raises its spear. because that is the order, {npc:yanki} says, translating the last word. and it has nothing left but the order." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Ona emrin bittiğini göster", en: "Show it the order is over" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
            kronik: { tr: "Devin tek emrinin \"bekle\" olduğunu öğrendin ve o emrin bittiğini ona göstermek için silahını kaldırdın.", en: "You learned the giant's only order was \"wait,\" and you raised your weapon to show it that order was over." }
            sonraki: "k50_savas_once"

      - id: "k50_selam"
        yer: "kule"
        paragraflar:
          - { tr: "Silahını molozun üstüne bırakıp başını eğiyorsun. Dev bir an kıpırdamıyor. Sonra yüzyıllardır bunu yapmamış biri gibi beceriksizce mızrağının ucunu yere değdiriyor: selam.", en: "You set your weapon down on the rubble and dip your head. The giant doesn't move for a second. Then, clumsy, like something that hasn't done it in centuries, it touches its spear point to the ground. A salute." }
          - { tr: "Mızrağını yeniden kaldırıyor, ama bu kez bir nöbetçinin değil, bir düellocunun duruşuyla. Seni tehdit olarak değil, rakip olarak kabul etti.", en: "It lifts the spear again, but this time in a duelist's stance, not a sentry's. It's accepted you, not as a threat, but as an opponent." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Silahını al, düelloyu kabul et", en: "Pick up your weapon. Accept the duel" }
            etkiler:
              - ahlak: { duzen: 2 }
            kronik: { tr: "Ölmüş bir dünyanın son askeri seni dengi saydı; sen de silahını yerden alıp onun düellosunu kabul ettin.", en: "A dead world's last soldier took you for an equal, and you picked up your weapon and accepted its duel." }
            sonraki: "k50_savas_once"

      - id: "k50_moloz"
        yer: "kule"
        paragraflar:
          - { tr: "Molozun her katmanı başka bir dünya. En altta, neredeyse toza dönmüş sarmal kabuklar; onların üstünde pirinç dişliler, onların da üstünde kemikten bir saray kubbesi. Her katmanın tepesinde kırık bir kule ucu.", en: "Every layer of the rubble is a different world. At the bottom, nearly dust, spiral shells; on top of them, brass gears; on top of those, the dome of a palace made of bone. At the top of every layer, the tip of a broken spire." }
          - { tr: "En tepede henüz moloza dönüşmemiş boş bir yer duruyor. Kenarları temiz, düzgün; beklemeye hazır. Ölçüsü kabaca bir şehir kadar. Kabaca {yer:kiyikent} kadar.", en: "At the very top, not rubble yet, there's an empty space. Clean edges, neat, ready and waiting. Roughly the size of a city. Roughly the size of {yer:kiyikent}." }
          - metin: { tr: "Sistem gerçeğinden bir parça aklına geliyor: hasat. Bu moloz yığını o sözcüğün neye benzediğini gösteriyor.", en: "The piece of the System's truth comes back to you: harvest. This rubble heap is what that word looks like." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Sistem gerçeğinden bir parça aklına geliyor: bir kurtarma protokolü. Bu moloz kurtarılamayanların listesi ve liste çok uzun.", en: "The piece of the System's truth comes back to you: a rescue protocol. This rubble is the list of the ones it couldn't save, and the list is very long." }
            kosul: { bayrak: "gercek_kurtarma" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Boş yere bak, sonra devin karşısına çık", en: "Look at the empty space. Then step up to the giant" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
            kronik: { tr: "Başka dünyaların enkazının tepesinde {yer:kiyikent} büyüklüğünde bir boşluk gördün; orasının boş kalacağına yemin edip devin karşısına çıktın.", en: "On top of the other worlds' wreckage you saw an empty space the size of {yer:kiyikent}, and you swore it would stay empty." }
            sonraki: "k50_savas_once"

      - id: "k50_savas_once"
        yer: "kule"
        paragraflar:
          - { tr: "Dev mızrağını yere vurunca bütün yamaç sarsılıyor. Moloz yığınlarından toz kalkıyor; tozun içinde sayısız dünyanın son günlerinin siluetleri bir an belirip kayboluyor.", en: "The giant slams its spear butt down and the whole slope shakes. Dust lifts off the rubble heaps, and for a second the silhouettes of countless worlds' last days flicker in it and vanish." }
          - { tr: "Analiz penceren: [Eşik Muhafızı · Kademe C · Kalıntı]. Altında da senin değil, Sistem'in düştüğü bir not: [Bu birim, hizmet ettiği Katman'dan uzun yaşamıştır.]", en: "Your Analysis window: [Threshold Warden · Grade C · Remnant]. And under it, a note from the System, not you: [This unit has outlived the Layer it served.]" }
        sezgiler:
          - kosul: { stat: { int: 115 } }
            metin: { tr: "Bedenini Öz ayakta tutuyor. Şimşek o akışı keser. Ya da emrinin bittiğine onu gerçekten inandırırsan kendi ağırlığı yeter.", en: "Essence holds that body up. Lightning cuts the flow. Or if you can truly convince it the order is over, its own weight will do the rest." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Mızrağın gölgesine gir", en: "Step into the spear's shadow" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kule_esik_muhafizi@oyuncu+5"], ortam: ["karanlik"], kazan: "k50_zafer", kaybet: "k50_yenilgi", kac: "k50_kacis" }
            kronik: { tr: "Mızrağın gölgesine girip ellinci katın bekçisine yüz yüze meydan okudun.", en: "You faced the fiftieth-floor warden, another world's last hero, head-on." }
          - id: "koru"
            etiket: { tr: "{npc:deniz_arman|i} arkana al; darbeleri sen karşıla", en: "Put {npc:deniz_arman} behind you. Take the hits yourself" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 5, baglilik: 4 } }
              - savas: { dusmanlar: ["kule_esik_muhafizi@oyuncu+5"], ortam: ["karanlik"], kazan: "k50_zafer", kaybet: "k50_yenilgi", kac: "k50_kacis" }
            kronik: { tr: "Eşikte en eski dostunu arkana aldın; hep kalkanı taşıyan oydu, bu kez darbelerin önüne sen geçtin.", en: "At the Threshold you put your oldest friend behind you and stepped in front of the blows, shielding the one who always carries the shield." }

      - id: "k50_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Dev dizlerinin üstüne çöküyor. Elinden kayan mızrak molozun üstüne bir köprü gibi uzanıyor. Göğsündeki nişan düşüyor: artık var olmayan bir dünyanın arması; kenarında da küçük bir satır, [Hasat edildi].", en: "The giant drops to its knees. The spear slides out of its hand and lies across the rubble like a bridge. The insignia on its chest falls: the crest of a world that doesn't exist anymore, and along the edge, one small line, [Harvested]." }
          - { tr: "Arkasındaki kapı ilk kez çıplak kalıyor. Yaklaşıp elini boşluğa uzatıyorsun.", en: "For the first time, the door behind it stands bare. You walk up and reach your hand into the opening." }
          - metin: { tr: "Avucun soğuk bir mühre değiyor; buz gibi pürüzsüz, nabız gibi zonklayan bir mühür. [Erişim: Katman onayı bekleniyor.] Öbür taraftan biri, çok uzaklardan avucunun sıcaklığını ölçüyor. Elini çekiyorsun.", en: "Your palm meets a cold seal: smooth as ice, throbbing like a pulse. [Access: awaiting Layer approval.] From the other side, someone very far away is measuring the warmth of your hand. You pull it back." }
            kosul: { bayrak_yok: "cok_evren_acik" }
          - metin: { tr: "Mühür yok; elin öbür tarafın havasına giriyor. Bakır, tuz ve hiç tatmadığın bir meyvenin kokusu... Kapı açık ve devin nöbeti sonunda bitti.", en: "There's no seal. Your hand slips into the air on the other side: copper, salt, and some fruit you've never tasted. The door is open, and the giant's watch, finally, is over." }
            kosul: { bayrak: "cok_evren_acik" }
        bildirimler:
          - tur: "gorev"
            nadirlik: "efsanevi"
            baslik: { tr: "[KAT 50 TEMİZLENDİ · EŞİK]", en: "[FLOOR 50 CLEARED · THRESHOLD]" }
            satirlar:
              - { tr: "Eşik bekçisi görevden alındı. Yerine atanacak birim: aranıyor.", en: "Threshold guardian relieved of duty. Replacement unit: under review." }
              - { tr: "Not: Adaylık başvurunuz alınmıştır.", en: "Note: Your application has been received." }
        secenekler:
          - id: "gom"
            etiket: { tr: "Devin dünyasının haritasını molozla ört; dinlensin", en: "Cover the giant's world-map with rubble. Let it rest" }
            etkiler:
              - kule_kat: 50
              - xp_seviye: 120
              - unvan: "kule_ilk_esik"
              - bilgi: "kule_hasat_edilmis_dunyalar"
              - bayrak: "kule_esik_gomuldu"
              - ahlak: { merhamet: 6, insanlik: 4 }
            kronik: { tr: "Devi molozla örtüp başka dünyaların enkazı arasında ona bir mezar yaptın.", en: "You covered another world's last soldier with rubble and made it a grave among the wreckage of other worlds." }
            sonraki: "k50_son"
          - id: "nisan"
            etiket: { tr: "Nişanını al; gücü artık senin", en: "Take its insignia. Its power is yours now" }
            etkiler:
              - kule_kat: 50
              - xp_seviye: 130
              - unvan: "kule_ilk_esik"
              - bilgi: "kule_hasat_edilmis_dunyalar"
              - esya: { kule_esik_nisani: 1 }
              - oz: { koruma: 30 }
              - ahlak: { insanlik: -5, merhamet: -2 }
            kronik: { tr: "Hasat edilmiş bir dünyanın son nişanını göğsüne taktın; gücünü aldın, adını ellinci katta bıraktın.", en: "You pinned a harvested world's last insignia to your chest. You took its power and left its name on the fiftieth floor." }
            sonraki: "k50_son"
          - id: "nobet"
            etiket: { tr: "Kapının nöbetini sen devral: \"Bu kapı artık bizim.\"", en: "Take over the watch: \"This door is ours now.\"" }
            etkiler:
              - kule_kat: 50
              - xp_seviye: 120
              - unvan: "kule_ilk_esik"
              - bilgi: "kule_hasat_edilmis_dunyalar"
              - bayrak: "kule_esik_nobeti"
              - ahlak: { duzen: 6, merhamet: 1 }
              - itibar: { lonca: 4, siginak: 3 }
            kronik: { tr: "\"Bu kapı artık bizim\" dedin ve devin bıraktığı nöbeti insanlık adına üstlendin.", en: "\"This door is ours now,\" you said, and took up the giant's watch in humanity's name." }
            sonraki: "k50_son"

      - id: "k50_son"
        yer: "kule"
        paragraflar:
          - { tr: "Kapının öbür yanında, yeşil şafağın altından bir şey geçiyor: dağ kadar büyük, süzülen bir kuş kadar ağır. Analiz penceren tek bir harf yazıp donuyor: [B].", en: "On the other side of the door, under the green dawn, something goes by. As big as a mountain, as slow as a bird. Your Analysis window writes one letter and freezes: [B]." }
          - { tr: "Durmuyor, sana bakmıyor bile. Senin için bir dünya olan bu kapı, onun gözünde bir pencere bile değil. Yeni bir tavan: bu sefer bir kapının ardında, koca bir evren yüksekliğinde.", en: "It doesn't stop. It doesn't even look at you. This door, a whole world to you, isn't even a window to it. A new ceiling: this time behind a door, as high as an entire universe." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[YENİ TAVAN · B]", en: "[NEW CEILING · B]" }
            satirlar:
              - { tr: "Komşu Katman'da B kademesinde bir varlık. İlgi düzeyi: yok.", en: "Grade B entity in neighboring Layer. Interest level: none." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "her dünyanın bir kulesi varmış. her kulenin bir eşiği. her eşikte de biri beklermiş. benim de bir zamanlar bir eşiğim var mıydı?", en: "every world had a spire. every spire had a threshold. someone waited at every threshold. did i have a threshold once?" }
        secenekler:
          - id: "in"
            etiket: { tr: "Kapıya son kez bak, aşağı in", en: "Look at the door one last time. Go down" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kapının ardından geçen B kademesindeki varlığa son bir kez baktın ve aşağı indin; tavan yine yükselmişti.", en: "You took one last look at the Grade B thing passing beyond the door and went back down. The ceiling had risen again." }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} söyle: \"Senin eşiğin benim.\"", en: "Tell {npc:yanki}: \"I'm your threshold.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_50", agirlik: 45 }
              - ahlak: { insanlik: -2, duzen: -1 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Kafandaki ses bir zamanlar bir eşiği olup olmadığını sorduğunda ona \"Senin eşiğin benim\" dedin.", en: "When the voice in your head wondered if it had ever had a threshold, you told it: \"I'm your threshold.\"" }
            sonraki: "@akis"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} kapıyı göster: \"Yarış şimdi başlıyor.\"", en: "Point {npc:aras_kurt} at the door: \"Now the race starts.\"" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 6, guven: 4 } }
              - ahlak: { duzen: -2 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 2, max: 4 } }
            kronik: { tr: "Eşiğin önünde rakibine kapıyı gösterdin: asıl yarış şimdi başlıyordu.", en: "At the Threshold you pointed your rival at the door and declared the real race had only just begun." }
            sonraki: "@akis"

      - id: "k50_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Mızrak seni molozun içine çiviliyor. Yüzün başka bir dünyadan kalma kırık bir tabelaya dayanmış; tabela okuyamadığın bir dilde \"hoş geldiniz\" diyor gibi.", en: "The spear pins you into the rubble. Your face is pressed against a broken sign from another world. In a language you can't read, it seems to say \"welcome.\"" }
          - { tr: "Dev seni öldürmüyor. Mızrağını çekip, bir askerin yaralı düşmanını taşıdığı gibi seni merdivene kadar taşıyor. Emri kapıyı tutmak, seni öldürmek değil. Seni merdivenin başına bırakıp nöbetine dönüyor.", en: "The giant doesn't kill you. It pulls the spear out and carries you to the stairs, the way a soldier carries a wounded enemy. Its orders are to hold the door, not to kill you. It sets you down at the top of the stairs and goes back to its watch." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Yaralarını sar, dev bekler", en: "Bind your wounds. The giant will wait" }
            etkiler:
              - degisken: { kule50_deneme: 1 }
              - can: 30
              - ahlak: { insanlik: 1 }
            kronik: { tr: "Eşiğin bekçisi seni yendi ama öldürmedi; bir askerin yaralı düşmanını taşıdığı gibi seni merdivene taşıdı.", en: "The fiftieth-floor warden beat you once, and instead of killing you, carried you to the stairs." }
            sonraki: "@akis"

      - id: "k50_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Yamaçtan aşağı kayarken arkanda başka dünyaların enkazı çığ gibi akıyor. Dev seni kovalamıyor; kapıdan bir adım bile uzaklaşamaz.", en: "You slide down the slope with other worlds' wreckage pouring after you like an avalanche. The giant doesn't chase you. It can't take a single step away from the door." }
          - { tr: "Merdivende dönüp baktığında onu yine nöbetinde görüyorsun, kıpırtısız, bekler hâlde. Beklemekte ondan iyisi yok.", en: "When you look back from the stairs, it's on watch again, motionless, waiting. Nobody's better at waiting than it is." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Aşağı in, sonra geri gel", en: "Go down. Come back later" }
            etkiler:
              - degisken: { kule50_deneme: 1 }
              - ahlak: { duzen: 1 }
            kronik: { tr: "Ellinci katın eşiğinden kaçtın; dev peşine düşmedi, kapının önünde kıpırtısız beklemeyi sürdürdü.", en: "You fled the fiftieth-floor Threshold. The giant didn't chase you; it went on waiting in front of the door, motionless." }
            sonraki: "@akis"

  # ================================================================== KAT 60 — YANIK ARŞİV (C → B · Sistem sırrı: her kaydın son satırı)
  - id: "kule_kat_60"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Altmışıncı kat: Yanık arşiv", en: "Floor Sixty: The Burning Archive" }
    sahne: "k60_giris"
    sahneler:
      - id: "k60_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Altmışıncı kat, katedral yüksekliğinde bir arşiv. Ufka kadar uzanan rafların her biri dosyalarla dolu ve her şey yanıyor. Alev ağır, sabırlı; her sayfayı yakmadan önce okuyormuş gibi.", en: "Floor sixty is an archive as tall as a cathedral. Shelves run to the horizon, every one packed with files, and all of it is burning. The fire is slow, patient, like it reads every page before it burns it." }
          - { tr: "Kül kar gibi yağıyor. Ayağının dibine yarısı yanmış bir sayfa düşüyor: [Katman: Nehha · Kademe ortalaması: D · Sonuç: hasat edildi.] Altında sayfanın yanmamış son satırı var: [Yeni Entegrasyon başlatılıyor.]", en: "The ash is falling like snow. A half-burned page lands at your feet: [Layer: Nehha · Average Grade: D · Outcome: harvested.] Underneath, the page's last unburned line: [Initiating new Integration.]" }
          - { tr: "Bir başka sayfa: [Katman: Tavvar · Sonuç: vassal.] Son satırı aynı. Bir başkası: [Sonuç: kabul edildi.] Son satırı yine aynı.", en: "Another page: [Layer: Tavvar · Outcome: vassal.] Same last line. Another: [Outcome: accepted.] Same last line." }
          - metin: { tr: "Buraya daha önce de geldin. Rafların arasında, geçen seferki ayak izlerin hâlâ külün içinde duruyor, seni bekler gibi.", en: "You've been here before. On one aisle, your footprints from last time are still in the ash, like they're waiting for you." }
            kosul: { degisken_min: { kule60_deneme: 1 } }
          - metin: { tr: "Sayfalardan birinin köşesinde bir çizim var: bir vapur, bir iskele. Kenarına senin el yazınla bir not düşülmüş: \"yine.\" Nereden tanıdığını bilmiyorsun. Ya da biliyorsun da bilmek istemiyorsun.", en: "In the corner of one page there's a sketch: a ferry. A pier. Someone added a note in the margin in your handwriting: \"again.\" You don't know how you recognize it. Or you do, and you don't want to." }
            kosul: { degisken_min: { onceki_oyun: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 60 · ARŞİV]", en: "[SPIRE · FLOOR 60 · ARCHIVE]" }
            satirlar:
              - { tr: "Bakım sürüyor: eski kayıtlar imha ediliyor.", en: "Maintenance in progress: legacy records being destroyed." }
              - { tr: "Arşivin yanması normaldir. Yangın alarmı yoktur.", en: "The archive burning is normal. There is no fire alarm." }
        sezgiler:
          - kosul: { stat: { per: 155 } }
            metin: { tr: "Rafların etiketleri bir düzen izliyor. Koca bir koridor tek bir dünyaya ayrılmış: {yer:kiyikent}. O koridordaki dosyaların üstünde de birbirini izleyen numaralar var.", en: "The shelf labels follow a pattern. A whole aisle is set aside for one world: {yer:kiyikent}. And the files in that aisle have numbers on them. Consecutive numbers." }
          - kosul: { stat: { int: 150 } }
            metin: { tr: "Sonuç satırları farklı, son satır hep aynı. Sistem hangi sonu seçtiğinize bakmıyor; yalnızca bir sonun gelmesine bakıyor.", en: "The outcome lines are all different. The last line is always the same. The System doesn't care which ending you pick. It only cares that one comes." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu koku. yanık kâğıt. ben burada bir yerdeydim. yandım mı, kaçtım mı, bilmiyorum.", en: "that smell. burnt paper. i was somewhere in here. i don't know if i burned or ran." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kaynak kod değil ama ondan da iyi: değişiklik günlüğü. Her sürümün ne yaptığı yazıyor. Yanmadan okumamız lazım.\"", en: "\"It's not source code, it's better: the changelog. What every version did. We have to read it before it burns.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Hasta dosyaları gibi bunlar. Her birinin bir sonucu var ama hiçbirinde taburcu satırı yok.\"", en: "\"These are like patient charts. Every one has an outcome. Not one of them has a discharge line.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bizim dosyamız da burada mı? Benimki? Okumak istemiyorum. Okumak istiyorum. Bilmiyorum.\"", en: "\"Is our file in here too? Mine? I don't want to read it. I want to read it. I don't know.\"" }
        secenekler:
          - id: "kiyikent"
            etiket: { tr: "{yer:kiyikent} koridorunu bul", en: "Find the {yer:kiyikent} aisle" }
            gerekli: { stat: { per: 155 } }
            etkiler:
              - bilgi: "kule_yeni_entegrasyon"
            sonraki: "k60_koridor"
          - id: "kurtar"
            etiket: { tr: "Yanmamış dosyaları alevden çekip çıkar", en: "Pull the unburned files out of the fire" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - can: -20
            sonraki: "k60_kurtar"
          - id: "sondur"
            tur: "gosteris"
            etiket: { tr: "Bir koridorun alevini tek nefeste söndür", en: "Snuff out a whole aisle's fire in one breath" }
            gerekli: { stat: { wil: 160 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 5
              - ahlak: { duzen: -3 }
            sonraki: "k60_kurtar"
          - id: "katip"
            etiket: { tr: "Raflar arasında dolaşan kâtibe adını söyle", en: "Tell the clerk wandering the stacks your name" }
            etkiler:
              - dikkat: 3
            sonraki: "k60_katip"

      - id: "k60_koridor"
        yer: "kule"
        paragraflar:
          - { tr: "{yer:kiyikent} koridoru yarı yarıya yanmış. Dosyalar numaralı ve numaralar senin sayabileceğinden çok; her birinin sırtında aynı tarih yazıyor: Entegrasyon Günü. Aynı gün, defalarca.", en: "The {yer:kiyikent} aisle is half burned. The files are numbered, and there are more numbers than you could ever count. Every spine carries the same date: Integration Day. The same day, over and over." }
          - { tr: "Birini açıyorsun. Sonuç: hasat edildi. Bir başkası: koruyucu. Bir başkası: demir taht. Bir başkası: yükseliş. Hepsinin son satırı aynı. Hiçbirinde senin adın yok; hiçbirinde ana karakter yok, yalnızca bir boşluk var: bir taşıyıcının oturacağı yer.", en: "You open one. Outcome: harvested. Another: guardian. Another: iron crown. Another: ascension. Every one ends on the same line. And your name isn't in any of them. None of them have a lead, just a blank, the space where a carrier would sit." }
          - metin: { tr: "Bu dosyaların çoğunda hasat bir sondu. Ama son satır ona bile başlangıç diyor.", en: "In most of these files, the harvest was an ending. But the last line calls even that a beginning." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Bu dosyaların kenarında küçük bir not var: [Kurtarma denemesi n. Başarı ölçütü: karşılanmadı.] Kurtarma protokolü kendini her seferinde baştan deniyor.", en: "There's a little note in the margin of these files: [Rescue attempt n. Success criteria: not met.] The rescue protocol keeps trying itself over again." }
            kosul: { bayrak: "gercek_kurtarma" }
        secenekler:
          - id: "kendi"
            etiket: { tr: "Rafın en ucundaki, en yeni dosyayı aç", en: "Open the newest file, at the very end of the shelf" }
            sonraki: "k60_dosyan"
          - id: "katip"
            etiket: { tr: "Dosyaları bırak, kâtip seni arıyor", en: "Leave the files. The clerk is looking for you" }
            sonraki: "k60_katip"

      - id: "k60_kurtar"
        yer: "kule"
        paragraflar:
          - { tr: "Kucak dolusu dosyayla alevin içinden geçiyorsun. Sayfalar kollarının arasında kıvrılıyor ama bazıları yanmıyor. Kurtardığın dosyalardan birinin kapağında bir çocuk çizimi var: iki güneş, pirinçten bir kule.", en: "Arms full of files, you walk through the fire. The pages curl in your grip, but some of them don't burn. On the cover of one you saved there's a kid's drawing: two suns, a brass tower." }
          - { tr: "Arşiv bunu fark ediyor. Alev bir an duraksıyor, sonra bütün raflar boyunca bir dalga gibi sana yöneliyor. Kayıtlarının kurtarılması bir şeyin hiç hoşuna gitmedi.", en: "The archive notices. The fire pauses, then turns toward you along every shelf like a wave. Something doesn't like its records being saved." }
        secenekler:
          - id: "tut"
            etiket: { tr: "Dosyaları bırakma, alevin kalbine yürü", en: "Don't drop the files. Walk into the heart of the fire" }
            etkiler:
              - bayrak: "kule_dosyalar_kurtarildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
            sonraki: "k60_alev"

      - id: "k60_katip"
        yer: "kule"
        paragraflar:
          - { tr: "Kâtip seni rafların arasında buluyor. Parmakları kalem ucu, gözleri mürekkep. \"Ad,\" diyor. Söylüyorsun. \"Soyad. Seviye.\" Söylüyorsun. \"Daha önce burada bulundunuz mu?\"", en: "The clerk finds you between the shelves. Fingers like pen nibs, eyes like ink. \"Name,\" it says. You tell it. \"Surname. Level.\" You tell it. \"Have you been here before?\"" }
          - { tr: "Sen cevap vermeden kâtip kendi defterine bakıp duraksıyor. Sayfayı çeviriyor, bir önceki sayfayı, bir öncekini... \"Garip,\" diyor. \"Adınızın yanında bir sayı var ve o sayıyı yazdığımı hatırlamıyorum.\"", en: "Before you can answer, the clerk checks its own ledger and stops. Turns the page. The page before that. The one before that. \"Strange,\" it says. \"There's a number next to your name, and I don't remember writing it.\"" }
        secenekler:
          - id: "sayi"
            etiket: { tr: "\"Sayıyı oku.\"", en: "\"Read me the number.\"" }
            etkiler:
              - bilgi: "kule_yeni_entegrasyon"
              - dikkat: 2
            sonraki: "k60_dosyan"
          - id: "yalan"
            etiket: { tr: "\"Hayır. Hiç gelmedim.\" Defteri kapat", en: "\"No. Never.\" Close the ledger" }
            etkiler:
              - gizle: 5
              - ahlak: { duzen: -2 }
            sonraki: "k60_alev"

      - id: "k60_dosyan"
        yer: "kule"
        paragraflar:
          - { tr: "Dosya senin. Kapağında adın yok ama içi seninle dolu: Entegrasyon Günü, vapur, {npc:yanki}, Öğretici, Kule. Her şey, tam bugüne kadar. Bugünden sonrası da var.", en: "The file is yours. No name on the cover, but the inside is you: Integration Day, the ferry, {npc:yanki}, the Tutorial, the Spire. Everything, right up to today. And there's more after today." }
          - { tr: "Sonraki sayfalar bulanık; harfler oynuyor, sanki henüz karar verilmemiş. Ama son sayfa net: [Sonuç: ███.] Altında da ötekilerin hepsinde olduğu gibi: [Yeni Entegrasyon başlatılıyor.] Bir satır daha var, yalnızca seninkinde: [Taşıyıcı devredildi.]", en: "The pages after that are blurry, letters sliding around like nothing's been decided yet. But the last page is clear. [Outcome: ███.] And under it, like all the others: [Initiating new Integration.] There's one more line, only in yours: [Carrier transferred.]" }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[t̷aşıyıcı devredildi]", en: "[h̷ost transferred]" }
            satirlar:
              - { tr: "bunu okuma. lütfen. ya da oku. ama sonra ne olduğunu bana sorma, çünkü bilmiyorum.", en: "don't read that. please. or do. but don't ask me what happens after, because i don't know." }
        secenekler:
          - id: "yirt"
            etiket: { tr: "Son sayfayı yırtıp aleve at", en: "Tear out the last page and throw it in the fire" }
            etkiler:
              - bayrak: "kule_son_sayfa_yirtildi"
              - ahlak: { duzen: -4, insanlik: 2 }
            sonraki: "k60_alev"
          - id: "sakla"
            etiket: { tr: "Son sayfayı katlayıp cebine koy", en: "Fold up the last page and pocket it" }
            etkiler:
              - bayrak: "kule_son_sayfa_saklandi"
              - ahlak: { duzen: 2, insanlik: -1 }
            sonraki: "k60_alev"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sayfayı göster: \"Birlikte okuyalım.\"", en: "Show {npc:yanki} the page: \"Let's read it together.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 7, baglilik: 5 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_60", agirlik: 40 }
              - ahlak: { insanlik: 1 }
            sonraki: "k60_alev"

      - id: "k60_alev"
        yer: "kule"
        paragraflar:
          - { tr: "Arşivin kalbinde alev bir hortum gibi yükseliyor; yanan sayfalar havada savrulup bir yüz oluşturuyor. Yüz seni arıyor, bulunca da bir sayfa gibi açılıyor.", en: "At the heart of the archive, the fire rises like a twister; the burning pages swirl into a face. The face is looking for you, and when it finds you, it opens like a page." }
          - { tr: "\"Kayıt,\" diyor alev; milyonlarca sesle, milyonlarca hayatın son satırıyla. \"Kayıt tamamlanmadan bitemez. Seninki yarım.\"", en: "\"Record,\" the fire says, in millions of voices, in the last line of millions of lives. \"A record cannot end before it is complete. Yours is half-written.\"" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Arşiv Alevi · Kademe B (tahmini)", en: "[ANALYSIS] The Archive Pyre · Grade B (estimated)" }
            satirlar:
              - { tr: "Zaaf: buz. Ya da yanmayı reddeden bir sayfa.", en: "Weakness: ice. Or a page that refuses to burn." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Yarım kaydınla aleve yürü", en: "Walk into the fire with your half-written record" }
            etkiler:
              - savas: { dusmanlar: ["kule_arsiv_alevi@oyuncu+5"], ortam: ["yanici"], kazan: "k60_zafer", kaybet: "k60_yenilgi", kac: "k60_kacis" }
          - id: "dosyalar"
            etiket: { tr: "Kurtardığın dosyaları kalkan yap", en: "Use the files you saved as a shield" }
            goster: { bayrak: "kule_dosyalar_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["kule_arsiv_alevi@oyuncu+3"], ortam: ["yanici"], kazan: "k60_zafer", kaybet: "k60_yenilgi", kac: "k60_kacis" }
          - id: "kademe"
            etiket: { tr: "Kademesine meydan oku: alevle onun seviyesinde dövüş", en: "Challenge its Grade. Fight the fire at its own level" }
            gerekli: { seviye_min: 150 }
            etkiler:
              - dikkat: 5
              - ahlak: { duzen: -3 }
              - savas: { dusmanlar: ["kule_arsiv_alevi@230"], ortam: ["yanici"], kazan: "k60_zafer", kaybet: "k60_yenilgi", kac: "k60_kacis" }

      - id: "k60_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Alevden yüz çöküyor, sayfalar sağanak gibi yağıyor. Arşiv yanmayı bırakıyor; sanki çok yukarılarda biri bir düğmeye basmış. Kül havada asılı kalıyor.", en: "The fire's face caves in and the pages come down like a cloudburst. The archive stops burning, like somebody way up top hit a switch. The ash hangs in the air." }
          - { tr: "Yere düşen son sayfa sana değil, arşivin kendisine ait: [Arşiv: Kule · İşlev: Entegrasyon kayıtları · Not: kayıtlar her döngüde imha edilir. Taşıyıcı hariç.]", en: "The last page to land doesn't belong to you. It belongs to the archive. [Archive: The Spire · Function: Integration records · Note: records are destroyed every cycle. Carrier excepted.]" }
          - { tr: "Taşıyıcı hariç. Kayıtlar yanıyor ama bir şey her seferinde yanmadan bir sonrakine geçiyor.", en: "Carrier excepted. The records burn, but every time, one thing makes it through to the next one without burning." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "efsanevi"
            baslik: { tr: "[KAT 60 TEMİZLENDİ]", en: "[FLOOR 60 CLEARED]" }
            satirlar:
              - { tr: "Arşiv bakımı askıya alındı. Kayıt imhası: ertelendi.", en: "Archive maintenance suspended. Record destruction: postponed." }
        secenekler:
          - id: "oku"
            etiket: { tr: "Kurtulan sayfaları topla, {yer:kiyikent|e} götür", en: "Gather the pages that survived. Take them to {yer:kiyikent}" }
            etkiler:
              - kule_kat: 60
              - xp_seviye: 130
              - bilgi: "kule_yeni_entegrasyon"
              - ahlak: { merhamet: 2, insanlik: 2 }
              - itibar: { sessiz_ag: 5 }
            sonraki: "k60_son"
          - id: "yak"
            etiket: { tr: "Kalanı da yak. Kimse bunu bilmemeli", en: "Burn the rest. Nobody should know this" }
            etkiler:
              - kule_kat: 60
              - xp_seviye: 130
              - bilgi: "kule_yeni_entegrasyon"
              - gizle: 6
              - ahlak: { duzen: 3, merhamet: -2 }
            sonraki: "k60_son"
          - id: "tasiyici"
            etiket: { tr: "\"Taşıyıcı hariç\" satırının kaynağını izle", en: "Trace where the \"carrier excepted\" line comes from" }
            gerekli: { stat: { int: 160 } }
            etkiler:
              - kule_kat: 60
              - xp_seviye: 140
              - bilgi: "kule_yeni_entegrasyon"
              - bayrak: "kule_tasiyici_izi"
              - ahlak: { insanlik: -2 }
            sonraki: "k60_tasiyici"

      - id: "k60_tasiyici"
        yer: "kule"
        paragraflar:
          - { tr: "Satırın izi yukarıya uzanıyor: tavana, tavanın da ötesine, Kule'nin doksanıncı katına doğru. Orada bir yerde satırın öbür ucunu biri tutuyor. Ya da bir zamanlar tutuyormuş.", en: "The line's trail runs up: to the ceiling, past it, toward the Spire's ninetieth floor. Somewhere up there, someone is holding the other end of it. Or used to." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Doksanıncı katı aklının bir köşesine yaz", en: "Make a note of the ninetieth floor" }
            sonraki: "k60_son"

      - id: "k60_son"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivene yürürken kül ayak izlerini örtüyor. Arşiv yeniden yanmaya başlayacak, ya bu gece ya bir sonraki döngüde. Ama bu gece senin dosyan raflarda değil, sende.", en: "As you walk to the stairs, the ash covers your footprints. The archive will start burning again, tonight or next cycle. But tonight your file isn't on the shelves. It's with you." }
        secenekler:
          - id: "in"
            etiket: { tr: "Aşağı in", en: "Go down" }
            etkiler:
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "Sayfaları {npc:mert_kilic|e} emanet et", en: "Trust the pages to {npc:mert_kilic}" }
            goster: { npc_hayatta: "mert_kilic", bayrak_yok: "mert_kadimlere_satti" }
            etkiler:
              - iliski: { mert_kilic: { guven: 7, saygi: 4 } }
              - itibar: { sessiz_ag: 4 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} dosyaların aslında ne olduğunu anlat", en: "Tell {npc:elif_sari} what the files really are" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 6, baglilik: 4 } }
              - ahlak: { merhamet: 1 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "k60_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Alev seni bir sayfa gibi kıvırıyor. Bir an kendi dosyanın içinde, kendi son satırını okuyorsun; derken bir yerlerde biri sayfayı çeviriyor ve dışarıdasın.", en: "The fire curls you up like a page. For a second you're inside your own file, reading your own last line. Then somebody, somewhere, turns the page, and you're out." }
          - { tr: "Merdivenin dibinde, saçların duman kokarak uyanıyorsun. Arşiv yanmayı sürdürüyor. Dosyan yarım; yanamayacak kadar yarım.", en: "You wake at the foot of the stairs, hair reeking of smoke. The archive keeps burning. Your file is half-written. Too half-written to burn." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Kalk, kaydın henüz bitmedi", en: "Get up. Your record isn't done" }
            etkiler:
              - degisken: { kule60_deneme: 1 }
              - can: 30
            sonraki: "@akis"

      - id: "k60_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Rafların arasından koşarken yanan sayfalar omuzlarına yapışıyor. Merdivene vardığında arşivin sesi arkandan geliyor: \"Kayıt yarım. Kayıt bekler.\"", en: "You run between the shelves with burning pages sticking to your shoulders. When you reach the stairs, the archive's voice follows you: \"Record incomplete. The record will wait.\"" }
        secenekler:
          - id: "geri"
            etiket: { tr: "Dumanı ciğerlerinden at, sonra dön", en: "Cough the smoke out. Then come back" }
            etkiler:
              - degisken: { kule60_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 70 — TOHUMLUK (B · Sistem sırrı: hasat yok etmez, saklar)
  - id: "kule_kat_70"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Yetmişinci kat: Tohumluk", en: "Floor Seventy: The Seed Vault" }
    sahne: "k70_giris"
    sahneler:
      - id: "k70_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Yetmişinci kat bir sera: ılık, nemli, bir yaz akşamı kadar sessiz. Ama ortada tek bir bitki yok. Ufka dek sıra sıra kristal kozalar uzanıyor, her birinin içinde bir şey uyuyor.", en: "Floor seventy is a greenhouse: warm, damp, quiet as a summer evening. But there are no plants. Rows of crystal pods run all the way to the horizon, and something is sleeping inside every one." }
          - { tr: "Kozaların kimi insan boyunda, kimi bir ev büyüklüğünde. İçlerindekilerin kimi insana benziyor, kimi hiçbir şeye. Her kozanın dibine küçük bir etiket yapıştırılmış: tür, kademe, döngü. Bir de tek bir sözcük: [tohumluk].", en: "Some pods are human-sized, some are the size of a house. Some of what's inside looks human, some looks like nothing at all. At the base of every pod is a little label: species, Grade, cycle. And one word: [seed stock]." }
          - { tr: "Uzakta sıraların üstünden bir gölge geçiyor: buğday tarlası genişliğinde bir orak ağır ağır, sabırla sallanıyor. Her savruluşunda bir koza daha kapanıyor.", en: "Far off, a shadow sweeps across the rows. A scythe as wide as a wheat field, swinging slow and patient. With every swing, one more pod seals shut." }
          - metin: { tr: "Buraya daha önce de geldin. Kozalardan birinin camında, içeriden bırakılmış bir parmak izi var: senin izin. Ne zaman bıraktığını hatırlamıyorsun.", en: "You've been here before. There's a fingerprint on the inside of one pod's glass, and it's yours. You don't remember leaving it." }
            kosul: { degisken_min: { kule70_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KULE · KAT 70 · TOHUMLUK]", en: "[SPIRE · FLOOR 70 · SEED VAULT]" }
            satirlar:
              - { tr: "Hasat edilen Katmanlardan seçilmiş örnekler burada saklanır.", en: "Selected specimens from harvested Layers are stored here." }
              - { tr: "Lütfen tohumlukları uyandırmayın. Uyandırılan tohumluk iade edilmez.", en: "Please do not wake the seed stock. Woken stock is non-refundable." }
        sezgiler:
          - kosul: { stat: { per: 195 } }
            metin: { tr: "Etiketlerin döngü sütununda aynı dünya tekrar tekrar geçiyor: {yer:kiyikent}. Her döngüden birkaç kişi; hep en güçlüler, hep en hızlılar.", en: "The cycle column on the labels shows the same world over and over: {yer:kiyikent}. A few people from every cycle. Always the strongest. Always the fastest." }
          - kosul: { stat: { wis: 190 } }
            metin: { tr: "Kozalar uyuyanları beslemiyor, uyuyanlarla besleniyor. Uyuyanların Öz'ü ince bir damardan tavana, tavandan da daha yukarıya akıyor.", en: "The pods aren't feeding the sleepers. They're feeding on them. The sleepers' Essence runs up a thin vein into the ceiling, and from the ceiling, up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burası. burayı biliyorum. bir koza. soğuk. sonra bir çatlak, sonra sen. hayır, sen değil. senden önceki biri.", en: "here. i know this place. a pod. cold. then a crack, and then you. no. not you. someone before you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bunlar canlı. Hepsi canlı, ama hiçbiri yaşamıyor. Bir hekim için bundan kötü oda olmaz.\"", en: "\"They're alive. All of them. And none of them are living. For a doctor there's no worse room than this.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşim... burada olabilir mi? Hayır. Hayır, bu döngü değil. Değil, değil mi?\"", en: "\"My sister... could she be in here? No. No, not this cycle. Right? Right?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"En güçlüleri saklamışlar. Demek hasatta kazanmak ödül değil, kavanozmuş.\"", en: "\"They kept the strongest ones. So winning the harvest isn't a prize. It's a jar.\"" }
        secenekler:
          - id: "etiket"
            etiket: { tr: "{yer:kiyikent} etiketli kozaları ara", en: "Look for the pods labeled {yer:kiyikent}" }
            gerekli: { stat: { per: 195 } }
            etkiler:
              - bilgi: "kule_tohumluk"
            sonraki: "k70_kiyikent"
          - id: "uyandir"
            etiket: { tr: "En yakındaki insan kozasını aç", en: "Open the nearest human pod" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -3 }
            sonraki: "k70_uyanan"
          - id: "damar"
            tur: "gosteris"
            etiket: { tr: "Tavana akan Öz damarını çıplak elle kopar", en: "Rip out the Essence vein to the ceiling bare-handed" }
            gerekli: { stat: { str: 200 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -4, merhamet: 2 }
            sonraki: "k70_damar"
          - id: "gizlen"
            tur: "gizle"
            etiket: { tr: "Sıraların arasından sessizce orağa ilerle", en: "Move quietly between the rows toward the scythe" }
            etkiler:
              - gizle: 5
              - ahlak: { duzen: 1 }
            sonraki: "k70_orak"

      - id: "k70_kiyikent"
        yer: "kule"
        paragraflar:
          - { tr: "{yer:kiyikent} sırası uzun. Kozalardaki yüzleri tanımıyorsun, ama bazı zırhlarda {yer:kiyikent|in} eski belediye logosu var. Kozalardan birinde kırkıncı kattaki kadının zırhının aynısı duruyor; içindeyse başka bir kadın var.", en: "The {yer:kiyikent} row runs long. Faces you don't know in the pods, but some of the armor carries {yer:kiyikent|pos} old city seal. In one pod, the same armor as the woman on the fortieth floor. A different woman inside." }
          - { tr: "Sıranın sonundaki koza boş. Kapağı içeriden kırılmış, çatlaklar dışa doğru açılıyor. Etiketinde ne tür yazıyor ne kademe, yalnızca tek bir sözcük: [taşıyıcı]. Camında da kırılmadan önce içeriden kazınmış bir şekil var: yarım kalmış bir imza.", en: "At the end of the row, one pod is empty. The lid was broken from the inside; the cracks point outward. Its label has no species, no Grade, just one word: [carrier]. And on the glass, scratched from the inside before it broke: an unfinished signature." }
          - metin: { tr: "Sistem gerçeğinden sana düşen parçayı hatırlıyorsun: hasat. Ya yanlışmış ya eksik. Hasat öldürmüyor; biçip saklıyor.", en: "You remember your piece of the System's truth: harvest. It was wrong. Or incomplete. The harvest doesn't kill. It reaps, and it keeps." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Sistem gerçeğinden sana düşen parçayı hatırlıyorsun: kurtarma. Belki kurtarılan buydu: kavanoza kapatılıp bir sonraki seferi bekleyen en güçlüler.", en: "You remember your piece of the System's truth: rescue. Maybe this is what got rescued: the strongest, in a jar, waiting for next time." }
            kosul: { bayrak: "gercek_kurtarma" }
        secenekler:
          - id: "orak"
            etiket: { tr: "Boş kozayı bırak; orak yaklaşıyor", en: "Leave the empty pod. The scythe is coming" }
            sonraki: "k70_orak"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: \"Burası senin kozan mıydı?\"", en: "Ask {npc:yanki}: \"Was this your pod?\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 5, saygi: 4 } }
            sonraki: "k70_yanki_koza"

      - id: "k70_yanki_koza"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. hayır, diyor sonunda. kozada ben değildim. kozadakinin içindeydim. o çıktı, ben de onunla çıktım. sonra o durdu, ben devam ettim.", en: "{npc:yanki} is silent for a long time. no, it says at last. i wasn't in the pod. i was inside the one in the pod. they got out. i got out with them. then they stopped and i kept going." }
          - { tr: "nereye devam ettiğimi biliyorsun: sana.", en: "you know where i kept going. to you." }
        secenekler:
          - id: "orak"
            etiket: { tr: "\"Bu sefer kimse durmayacak.\"", en: "\"Nobody's stopping this time.\"" }
            etkiler:
              - iliski: { yanki: { baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_70", agirlik: 45 }
              - ahlak: { insanlik: -1 }
            sonraki: "k70_orak"

      - id: "k70_uyanan"
        yer: "kule"
        paragraflar:
          - { tr: "Kristali kırdığın anda içerideki adam, boğulmaktan kurtulmuş biri gibi derin bir soluk çekerek uyanıyor. Gözleri sana takılıyor ama seni tanımıyor; oysa çevresine şöyle bir bakması, her şeyi tanımasına yetiyor.", en: "You crack the crystal. The man inside wakes with a gasp, like a drowning man's first breath. His eyes catch on you and don't know you. Then he looks around and knows everything." }
          - { tr: "\"Bugün hangi gün?\" diye soruyor. Söyleyince gülüyor, gülüşü öksürüğe dönüyor. \"Hangi döngü, demek istemiştim. Neyse, önemi yok. Çıkış nerede? Eve gitmem lazım. {yer:kiyikent|e}.\"", en: "\"What day is it?\" he asks. You tell him. He laughs, and the laugh turns into a cough. \"I meant which cycle. Never mind. Doesn't matter. Where's the way out? I have to get home. {yer:kiyikent}.\"" }
          - { tr: "Senin {yer:kiyikent|in} onun {yer:kiyikent|i} değil. Bunu ona söyleyecek sözü bulamıyorsun.", en: "Your {yer:kiyikent} isn't his {yer:kiyikent}. You can't find the words to tell him." }
        secenekler:
          - id: "gonder"
            etiket: { tr: "Ona merdiveni göster; eve dönsün", en: "Show him the stairs. Let him go home" }
            etkiler:
              - bayrak: "kule_tohumluk_uyandi"
              - ahlak: { merhamet: 3, insanlik: 2 }
            sonraki: "k70_orak"
          - id: "geri_koy"
            etiket: { tr: "Ona gerçeği söyle, kozaya dönmesine izin ver", en: "Tell him the truth. Let him go back to sleep" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 3 }
            sonraki: "k70_orak"

      - id: "k70_damar"
        yer: "kule"
        paragraflar:
          - { tr: "Damar avucunda yılan gibi kıvranıp kopuyor. Bütün sera bir an karanlığa gömülüyor; kozalardaki uyuyanların hepsi aynı anda, uykularının içinde rahat bir soluk alıyor.", en: "The vein thrashes in your fist like a snake and snaps. For a second the whole greenhouse goes dark, and in every pod the sleepers draw one easy breath at the same time." }
          - { tr: "Tavanda, çok yukarılarda bir şey bunu seziyor. Orak dönüyor; artık hiç de yavaş değil.", en: "In the ceiling, way up, something notices. The scythe turns. It isn't slow anymore." }
        secenekler:
          - id: "orak"
            etiket: { tr: "Orağı karşıla", en: "Meet the scythe" }
            sonraki: "k70_orak"

      - id: "k70_orak"
        yer: "kule"
        paragraflar:
          - { tr: "Orak sıraların ortasında, yüzünü sana dönmüş bekliyor. Makine olduğu belli, ama sana tarlasına yabani ot düşmüş bir çiftçinin sabrıyla bakıyor. Bıçağının ucu tavanı sıyırmakta.", en: "The scythe stands in the middle of the rows, turned toward you. It's a machine, but it looks at you with the patience of a farmer who's found a weed in the field. Its blade scrapes the ceiling." }
          - { tr: "Bıçağın üstünde küçük bir pencere titreşiyor: [Değerlendirme: aday. Kademe: yetersiz. Hız: aşırı. Öneri: erken hasat.]", en: "A small window flickers on the blade: [Assessment: candidate. Grade: insufficient. Speed: excessive. Recommendation: early harvest.]" }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ] Hasat Orağı · Kademe B", en: "[ANALYSIS] The Harvest Scythe · Grade B" }
            satirlar:
              - { tr: "Zaaf: ateş. Tarla ateşten korkar.", en: "Weakness: fire. Fields are afraid of fire." }
        sezgiler:
          - kosul: { stat: { int: 195 } }
            metin: { tr: "Kozalar onun her şeyi. Ateş kozalara yaklaşınca dövüşü bırakıp onları korumaya koşacak.", en: "The pods are everything to it. When fire gets close to them, it'll drop the fight to protect them." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Tarlanın ortasında dur", en: "Stand your ground in the middle of the field" }
            etkiler:
              - savas: { dusmanlar: ["kule_hasat_oragi@oyuncu+6"], ortam: ["karanlik"], kazan: "k70_zafer", kaybet: "k70_yenilgi", kac: "k70_kacis" }
          - id: "ates"
            etiket: { tr: "Kozaların dibinde ateş yak; orağı ikiye böl", en: "Light fires by the pods. Split the scythe's attention" }
            gerekli: { egilim_min: { buyu: 15 } }
            etkiler:
              - ahlak: { merhamet: -3, insanlik: -2 }
              - savas: { dusmanlar: ["kule_hasat_oragi@oyuncu+3"], ortam: ["yanici"], kazan: "k70_zafer", kaybet: "k70_yenilgi", kac: "k70_kacis" }
          - id: "koru"
            etiket: { tr: "Kozaları arkana al; orağı onlardan uzak tut", en: "Keep the pods at your back. Draw the scythe away" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["kule_hasat_oragi@oyuncu+6"], ortam: ["dar_gecit"], kazan: "k70_zafer", kaybet: "k70_yenilgi", kac: "k70_kacis" }

      - id: "k70_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Orak sıraların arasına devriliyor ve bir tarla boyu süren bir gürültüyle susuyor. Kozaların tek biri bile çatlamamış. Sera yeniden bir yaz akşamı kadar sessiz.", en: "The scythe falls between the rows and goes quiet with a crash as long as a field. Not one pod cracked. The greenhouse is quiet as a summer evening again." }
          - { tr: "Derken seranın en dibinde bir koza kendiliğinden açılıyor. İçindeki şey bir gözünü açıyor, yalnızca birini. Analiz penceren tek bir harf yazıp kararıyor: [A]. Göz sana bakıp sıkılıyor, sonra kapanıyor. Koza yeniden mühürleniyor.", en: "Then, at the very back of the greenhouse, a pod opens. On its own. The thing inside opens one eye. Just one. Your Analysis window writes a single letter and goes dark: [A]. The eye looks at you, gets bored, and closes. The pod seals itself again." }
          - { tr: "Senin için dövüş olan şey, onun uykusunu bölmeye bile değmedi. Yeni bir tavan, bir kozanın içinde uyuyor.", en: "What was a fight for you wasn't even a break in its nap. A new ceiling: asleep inside a pod." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "efsanevi"
            baslik: { tr: "[KAT 70 TEMİZLENDİ]", en: "[FLOOR 70 CLEARED]" }
            satirlar:
              - { tr: "Hasat birimi devre dışı. Tohumluk: korunuyor.", en: "Harvest unit disabled. Seed stock: preserved." }
              - { tr: "Not: A kademesinden bir örnek kısa süreliğine uyandı. Rahatsızlıktan dolayı özür dileriz.", en: "Note: A Grade A specimen briefly woke. We apologize for the disturbance." }
        secenekler:
          - id: "kristal"
            etiket: { tr: "Orağın bıraktığı tohum kristalini al", en: "Take the seed crystal the scythe left behind" }
            etkiler:
              - kule_kat: 70
              - xp_seviye: 140
              - esya: { kule_tohum_kristali: 1 }
              - bilgi: "kule_tohumluk"
              - ahlak: { insanlik: -2 }
            sonraki: "k70_son"
          - id: "isaretle"
            etiket: { tr: "{yer:kiyikent} kozalarına ad yaz; biri onları bilsin", en: "Write names on the {yer:kiyikent} pods. Someone should know them" }
            etkiler:
              - kule_kat: 70
              - xp_seviye: 140
              - bilgi: "kule_tohumluk"
              - bayrak: "kule_tohumluk_adlandi"
              - ahlak: { merhamet: 4, insanlik: 3 }
            sonraki: "k70_son"
          - id: "damar_izle"
            etiket: { tr: "Öz damarlarının nereye aktığını izle", en: "Follow the Essence veins to where they lead" }
            gerekli: { stat: { wis: 200 } }
            etkiler:
              - kule_kat: 70
              - xp_seviye: 150
              - bilgi: "kule_tohumluk"
              - bayrak: "kule_damar_izlendi"
              - ahlak: { duzen: -2 }
            sonraki: "k70_damar_izi"

      - id: "k70_damar_izi"
        yer: "kule"
        paragraflar:
          - { tr: "Damarlar tavanda birleşip kalınlaşıyor, Kule'nin gövdesine bir omurga gibi sarılıp yüzüncü kata doğru tırmanıyor. Kozalardaki Öz, Kule'nin zirvesini besliyor.", en: "The veins merge in the ceiling, thicken, and climb the Spire's body like a spine. Up toward the hundredth floor. The Essence in the pods is feeding the top of the Spire." }
          - { tr: "Zirvede ne varsa, her döngünün en güçlülerini yiyerek ayakta duruyor.", en: "Whatever's at the summit, it stays standing by eating the strongest of every cycle." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Zirveyi aklına kazı", en: "Remember the summit" }
            sonraki: "k70_son"

      - id: "k70_son"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivene yürürken kozaların arasından geçiyorsun. İçlerindeki yüzler uykularında sana dönüyor; kimi kıskanç, kimi uyarır gibi. Bir çocuksa gülümsüyor.", en: "On the way to the stairs you walk between the pods. The faces inside turn toward you in their sleep. Some look jealous. Some look like a warning. One, a kid, is smiling." }
          - metin: { tr: "Uyandırdığın adam merdivenin başında seni bekliyor. \"Benimle aşağı in,\" diyor. \"Yolu unuttum. Her şeyi unuttum. Bir tek evi hatırlıyorum.\"", en: "The man you woke is waiting for you at the top of the stairs. \"Walk down with me,\" he says. \"I forgot the way. I forgot everything. I only remember home.\"" }
            kosul: { bayrak: "kule_tohumluk_uyandi" }
        secenekler:
          - id: "in"
            etiket: { tr: "Aşağı in", en: "Go down" }
            etkiler:
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} söz ver: kardeşini burada aramayacaksınız", en: "Promise {npc:deniz_arman} you'll never look for their sister here" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 6, baglilik: 6 } }
              - ahlak: { merhamet: 2 }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} sor: \"Onları uyandırabilir miyiz?\"", en: "Ask {npc:elif_sari}: \"Could we wake them?\"" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 5, saygi: 5 } }
              - tohum: { olay: "kule_kopyalar", gecikme: { min: 1, max: 3 } }
            sonraki: "k70_elif"

      - id: "k70_elif"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:elif_sari} avucunu bir kozanın camına, hastanın alnına koyar gibi koyuyor. \"Uyandırabiliriz,\" diyor. \"Bir kısmını. Ama neye uyanacaklar? Dönecekleri dünya onların dünyası değil.\"", en: "{npc:elif_sari} lays her palm on a pod's glass, the way she'd lay it on a patient's forehead. \"We could,\" she says. \"Some of them. But wake up to what? The world they'd come back to isn't theirs.\"" }
          - { tr: "\"Önce kendi dünyamızı kurtaralım,\" diye ekliyor. \"Onlarınkini sonra hatırlarız.\"", en: "\"Let's save ours first,\" she says then. \"Then we'll remember theirs.\"" }
        secenekler:
          - id: "in"
            etiket: { tr: "\"Söz.\"", en: "\"Promise.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 4 } }
              - ahlak: { merhamet: 2 }
            sonraki: "@akis"

      - id: "k70_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Orak seni biçiyor. Acı yok; yalnızca bir yumuşaklık, bir ağırlık var. Kristal ayak bileklerinden yukarı tırmanırken uykunun ne kadar ılık olduğunu ancak o zaman anlıyorsun.", en: "The scythe reaps you. There's no pain, just a softness, a heaviness. Crystal climbs from your ankles up, and you notice how warm sleep is." }
          - { tr: "Derken kafanın içinde bir ses bağırıyor; senin sesin değil. Kristal çatlıyor ve kendini merdivenin dibinde, kozasız, tir tir titrerken buluyorsun. Bu sefer tohumluk olmadın. Bu seferlik.", en: "Then a voice yells in your head, and it isn't yours. The crystal cracks, and you find yourself at the foot of the stairs, shaking, no pod. You didn't become seed stock this time. This time." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Uyanık kal; sonra dön", en: "Stay awake. Then come back" }
            etkiler:
              - degisken: { kule70_deneme: 1 }
              - can: 40
            sonraki: "@akis"

      - id: "k70_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Sıraların arasından koşuyorsun; orak arkanda tarlayı biçerek her savruluşta biraz daha yaklaşıyor. Merdivene atıldığın anda bıçak hemen arkanda yere çakılıyor.", en: "You run between the rows. Behind you the scythe cuts the field, a little closer every arc. The second you dive for the stairs, the blade slams into the floor right behind you." }
          - { tr: "Tarlanın bekçisi peşine düşmüyor. Yabani ot nasılsa geri gelir.", en: "The field's keeper doesn't chase you. Weeds always come back anyway." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Aşağı in; nefeslen", en: "Go down. Breathe" }
            etkiler:
              - degisken: { kule70_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 80 — TERS GÖK (A · Sistem sırrı: kabul edilenler hasatçı olur)
  - id: "kule_kat_80"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan", "kadimler"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Sekseninci kat: Ters gök", en: "Floor Eighty: The Inverted Sky" }
    sahne: "k80_giris"
    sahneler:
      - id: "k80_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Sekseninci katta zemin yok. Merdivenin son basamağından sonra gökyüzü başlıyor, ayaklarının altında: yıldızlar aşağıda, Kule yukarıda. Ters dönmüş bir dünyada, yıldızların üstünde yürüyorsun.", en: "There's no floor on eighty. Past the last stair the sky starts, under your feet: stars below, the Spire above. You're walking upside down across the stars." }
          - { tr: "Aşağıda, yıldızların arasında Dünya görünüyor; misket kadar küçük, masmavi. Çevresinde, karanlığın içinde kıpırtısız bir halka var: gemiler.", en: "Down among the stars you can see Earth. Small, blue, the size of a marble. Around it, in the dark, a motionless ring: ships." }
          - { tr: "Gökyüzünün ortasında, yıldızlardan örülmüş yedi köşeli bir tahtta uzun bir figür oturuyor. Eklemleri olmayacak yerlerden bükülüyor. Öğretici'nin son günlerinde sırtta dikilen şeyi hatırlıyorsun; bu o değil, ama onun soyundan. Hem de çok daha yaşlı.", en: "In the middle of the sky, on a seven-cornered throne made of stars, sits a tall figure. Its joints bend in the wrong places. You remember the thing on the ridge in the last days of the Tutorial. This isn't it. But it's one of its kind. Much older." }
          - metin: { tr: "Halkadaki gemilerden birini tanıyorsun: körfezin üstünde asılı duranın ta kendisi. Buradan, yukarıdan bakınca onun koca bir filonun en küçük gemisi olduğunu görüyorsun.", en: "You recognize one ship in that ring: the same one hanging over the bay. From up here you can see it's just the smallest ship in a fleet." }
            kosul: { bayrak: "kadim_gemisi_goruldu" }
          - metin: { tr: "Buraya daha önce de geldin. Gözcü seni hatırlıyor; tahtının üstünde, yorgun bir öğretmen gibi bir kez iç çekiyor.", en: "You've been here before. The watcher remembers you. On its throne, like a tired teacher, it sighs once." }
            kosul: { degisken_min: { kule80_deneme: 1 } }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KULE · KAT 80 · GÖZLEM]", en: "[SPIRE · FLOOR 80 · OBSERVATION]" }
            satirlar:
              - { tr: "Bu kat, kabul edilmiş Katmanların gözlemcilerine ayrılmıştır.", en: "This floor is reserved for observers from accepted Layers." }
              - { tr: "Siz kabul edilmiş bir Katman değilsiniz. Yine de hoş geldiniz.", en: "You are not from an accepted Layer. Welcome anyway." }
        sezgiler:
          - kosul: { stat: { per: 255 } }
            metin: { tr: "Tahtın yedi köşesinin her birinde bir arma var. Birini tanıyorsun: Kadim gemilerinin gövdesindeki arma. Ama burada armanın altına Sistem'in mavisiyle bir damga basılmış: [Kabul edildi].", en: "There's a crest on each of the throne's seven corners. You know one of them: the crest on the hulls of the Ancients' ships. But up here, under the crest, there's a stamp in the System's blue: [Accepted]." }
          - kosul: { stat: { int: 250 } }
            metin: { tr: "Gemilerin halkası saldırı düzeninde değil, hasat düzeninde; bir tarlanın çevresine dizilmiş biçerdöverler gibi.", en: "That ring of ships isn't an attack formation. It's a harvest formation. Like combines lined up around a field." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onlar da bir zamanlar bizim gibiydi. nereden anladığımı biliyor musun? korkmuyorum. onlardan korkmam gerekirdi, ama onlara bakınca kendimi görüyorum. son sınavı geçmiş hâlimi.", en: "they were like us once. you know how i can tell? i'm not scared. i should be scared of them. but when i look at them i see myself. a version of me that passed the final exam." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kazananları ödül diye hasatçı yapıyorlarsa ben kaybetmeyi tercih ederim. Yok, etmem. Ama bir düşünürüm.\"", en: "\"If the winners get promoted to harvesters, I'd rather lose. No, I wouldn't. But I'd think about it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kabul edilmek terfi demek. Kadimler terfi almış bir Katman. Yani Sistem'in bir sonraki sürümünde biz... onlara dönüşüyoruz.\"", en: "\"Getting accepted is a promotion. The Ancients are a Layer that got promoted. So in the System's next version, we... become them.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Dünya hep bu kadar küçük müydü? Herkes o misketin içinde. Kardeşim de.\"", en: "\"Was Earth always this small? Everybody's in that marble. My sister too.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Yıldızların üstünden tahta yürü", en: "Walk across the stars to the throne" }
            sonraki: "k80_taht"
          - id: "armalar"
            etiket: { tr: "Tahtın yedi armasını oku", en: "Read the throne's seven crests" }
            gerekli: { stat: { per: 255 } }
            etkiler:
              - bilgi: "kule_kabul_edilenler"
            sonraki: "k80_armalar"
          - id: "dunya"
            etiket: { tr: "Aşağı eğil; Dünya'ya ve gemilerin halkasına bak", en: "Lean down. Look at Earth, at the ring of ships" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "k80_dunya"
          - id: "ucus"
            tur: "gosteris"
            etiket: { tr: "Yerçekimini yok say; tahta doğru düş", en: "Ignore gravity. Fall up to the throne" }
            gerekli: { stat: { agi: 260 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -3 }
            sonraki: "k80_taht"

      - id: "k80_armalar"
        yer: "kule"
        paragraflar:
          - { tr: "Yedi arma, yedi ırk. Her birinin altında aynı damga: [Kabul edildi]. Her damganın altında da daha küçük harflerle ikinci bir satır: [Yeni işlev: hasat.]", en: "Seven crests, seven species. Under every one, the same stamp: [Accepted]. And under every stamp, in smaller letters, a second line: [New function: harvest.]" }
          - { tr: "Kabul edilen Katmanlar ölmüyor, terfi ediyor. Terfi ettikleri iş de bir sonraki Katman'ı biçmek.", en: "Accepted Layers don't die. They get promoted. And the job they get promoted to is reaping the next Layer." }
          - metin: { tr: "Armalardan birini ayrıca tanıyorsun: elçinin göğsündeki işaret. {npc:thessar|in} ırkı da bir zamanlar bir Dünya'ymış. Onlar da bir zamanlar kendi Kule'lerinin ellinci katında, kendi eşiklerinin önünde durmuş.", en: "You recognize one crest in particular: the mark on the envoy's chest. {npc:thessar|pos} people were an Earth once too. Once, they stood on the fiftieth floor of their own Spire, in front of their own Threshold." }
            kosul: { bayrak: "thessar_indi" }
        secenekler:
          - id: "taht"
            etiket: { tr: "Tahta yürü", en: "Walk to the throne" }
            sonraki: "k80_taht"

      - id: "k80_dunya"
        yer: "kule"
        paragraflar:
          - { tr: "Dünya avucuna sığacak kadar küçük. Bulutlar bir misketin içindeki girdaplar gibi; {yer:kiyikent|in} bulunduğu kıyıda, gecenin ortasında küçücük bir ışık yanıyor. Belki bir şenlik ateşi, belki bir Kapı.", en: "Earth is small enough to fit in your palm. The clouds are swirls inside a marble, and on the coast where {yer:kiyikent} is, in the night, there's one tiny light. Maybe a bonfire. Maybe a Gate." }
          - { tr: "Gemilerin halkası kıpırdamıyor, sabırla bekliyor. Bir şeyin olmasını değil, bir tarihin gelmesini bekliyorlar.", en: "The ring of ships doesn't move. Patient. They aren't waiting for something to happen. They're waiting for a date." }
        secenekler:
          - id: "taht"
            etiket: { tr: "Dünya'yı arkanda bırak; tahta yürü", en: "Turn your back on Earth. Walk to the throne" }
            sonraki: "k80_taht"

      - id: "k80_taht"
        yer: "kule"
        paragraflar:
          - { tr: "Gözcü tahtından sana bakıyor. Yüzü yok, ama bakışının ağırlığını tanıyorsun: bir zamanlar fenerin ışığında hissettiğin ağırlık. Yirminci kattaki göz, bu bakışın küçük bir kopyasıymış.", en: "The watcher looks down at you from its throne. No face, but you know the weight of that gaze, the weight you felt once in the lighthouse beam. The eye on the twentieth floor was a small copy of this." }
          - { tr: "\"Katman adayı,\" diyor. Sesi sönen bir yıldız kadar uzaktan geliyor. \"Fazla hızlı. Hızlı olanlar ya kabul edilir ya tohumluk olur. Üçüncüsü yok. Üçüncüsü olmamalı.\"", en: "\"Layer candidate,\" it says. Its voice sounds as far off as a star going out. \"Too fast. The fast ones are either accepted or become seed stock. There is no third option. There should be no third option.\"" }
          - { tr: "Elini uzatıyor; avucunda bir damga parlıyor: [Kabul edildi]. \"Bunu şimdi alırsan,\" diyor, \"Gün 365 geldiğinde biçilen sen olmazsın, biçen sen olursun.\"", en: "It holds out its hand. A stamp glows in its palm: [Accepted]. \"Take this now,\" it says, \"and on Day 365 you won't be reaped. You'll be the one reaping.\"" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[TEKLİF · ERKEN KABUL]", en: "[OFFER · EARLY ACCEPTANCE]" }
            satirlar:
              - { tr: "Tek kişilik. Devredilemez. İade edilemez.", en: "Single occupancy. Non-transferable. Non-refundable." }
        secenekler:
          - id: "reddet"
            etiket: { tr: "Damgayı reddet ve dövüş", en: "Refuse the stamp and fight" }
            etkiler:
              - ahlak: { insanlik: 5, duzen: -2 }
              - itibar: { kadimler: -6 }
              - savas: { dusmanlar: ["kule_gok_gozcusu@oyuncu+6"], ortam: ["karanlik", "tavan"], kazan: "k80_zafer", kaybet: "k80_yenilgi", kac: "k80_kacis" }
          - id: "kabul"
            etiket: { tr: "Damgayı al; sonra yine de dövüş", en: "Take the stamp. Then fight anyway" }
            etkiler:
              - bayrak: "kule_kabul_damgasi"
              - ahlak: { insanlik: -6, merhamet: -3 }
              - itibar: { kadimler: 8 }
              - degisken: { kadim_tehdit: 3 }
              - savas: { dusmanlar: ["kule_gok_gozcusu@oyuncu+4"], ortam: ["karanlik", "tavan"], kazan: "k80_zafer", kaybet: "k80_yenilgi", kac: "k80_kacis" }
          - id: "ucuncu"
            etiket: { tr: "\"Üçüncüsü benim.\" Tahtı yıldızlarından sök", en: "\"I'm the third option.\" Tear the stars out of its throne" }
            gerekli: { stat: { int: 255 } }
            etkiler:
              - bayrak: "kule_ucuncu_yol"
              - dikkat: 6
              - ahlak: { duzen: -5, insanlik: 2 }
              - savas: { dusmanlar: ["kule_gok_gozcusu@oyuncu+5"], ortam: ["karanlik"], kazan: "k80_zafer", kaybet: "k80_yenilgi", kac: "k80_kacis" }

      - id: "k80_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Gözcü yıldızlarını yitiriyor. Tahtı birer birer sönen takımyıldızlara dağılıyor; figür bin yıllık bir yorgunlukla boşluğa düşüyor. Düşerken ilk kez bir yüzü varmış gibi görünüyor: rahatlamış bir yüz.", en: "The watcher loses its stars. Its throne comes apart into constellations going out one by one, and the figure falls into the void with a thousand years of exhaustion. For the first time, as it falls, it almost has a face: relieved." }
          - { tr: "Son sözleri yukarıya, sana doğru yükseliyor: \"Kabul edilmek, kaybetmenin en uzun yolu.\"", en: "Its last words drift up to you: \"Being accepted is the longest way to lose.\"" }
          - { tr: "Derken aşağıda, gemilerin halkasında, en büyük geminin burnunda bir ışık yanıyor: bir göz. Analiz penceren açılmaya bile yeltenmiyor; kenarı titreyip tek bir harf düşürüyor: [S].", en: "Then below, in the ring of ships, a light comes on at the bow of the largest one. An eye. Your Analysis window doesn't even try to open. Its edge just shudders and drops a single letter: [S]." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[YENİ TAVAN · S]", en: "[NEW CEILING · S]" }
            satirlar:
              - { tr: "S kademesinden bir varlık sizi fark etti.", en: "A Grade S entity has noticed you." }
              - { tr: "Fark edilmenin sonuçlarından Sistem sorumlu değildir.", en: "The System is not responsible for the consequences of being noticed." }
        secenekler:
          - id: "gozune_bak"
            etiket: { tr: "O gözün içine bak, gözünü ayırma", en: "Look that eye in the face. Keep looking" }
            etkiler:
              - kule_kat: 80
              - xp_seviye: 150
              - bilgi: "kule_kabul_edilenler"
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: -3, insanlik: 2 }
            sonraki: "k80_son"
          - id: "gizlen"
            tur: "gizle"
            etiket: { tr: "Yıldızların arasındaki karanlığa çekil", en: "Pull back into the dark between the stars" }
            etkiler:
              - kule_kat: 80
              - xp_seviye: 150
              - bilgi: "kule_kabul_edilenler"
              - gizle: 10
              - ahlak: { duzen: 2 }
            sonraki: "k80_son"
          - id: "yildiz"
            etiket: { tr: "Sönmeyen son yıldızı avucuna al", en: "Catch the last star that didn't go out" }
            etkiler:
              - kule_kat: 80
              - xp_seviye: 150
              - bilgi: "kule_kabul_edilenler"
              - oz: { uzay: 40 }
              - ahlak: { insanlik: -2 }
            sonraki: "k80_son"

      - id: "k80_son"
        yer: "kule"
        paragraflar:
          - { tr: "Merdivene dönerken Dünya'ya son bir kez bakıyorsun. Kadim gemilerinin halkası hâlâ orada, biçerdöverler gibi sabırla bekliyor. Ama artık biliyorsun: o gemilerdekiler bir zamanlar tarladaydı.", en: "Heading back to the stairs, you look at Earth one last time. The ring of Ancient ships is still there, patient, like combines. But now you know: whoever's on those ships was standing in the field once." }
          - metin: { tr: "Damga avucunda hâlâ ılık. Bir yerlerde, bir listede, adının yanına bir işaret konmuş artık.", en: "The stamp is still warm in your palm. Somewhere, on some list, there's a mark next to your name now." }
            kosul: { bayrak: "kule_kabul_damgasi" }
        secenekler:
          - id: "in"
            etiket: { tr: "Aşağı in", en: "Go down" }
            etkiler:
              - tohum: { olay: "kule_gokten_inen", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "thessar"
            etiket: { tr: "Bunu {npc:thessar|e} soracağına yemin et", en: "Swear you'll ask {npc:thessar} about this" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - iliski: { thessar: { saygi: 6, korku: 3 } }
              - bayrak: "kule_thessar_sorusu"
              - tohum: { olay: "kule_gokten_inen", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} söyle: \"Sen sınavı geçmeyeceksin. Biz geçeceğiz.\"", en: "Tell {npc:yanki}: \"You won't pass that exam. We will.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, saygi: 5 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_80", agirlik: 35 }
              - tohum: { olay: "kule_gokten_inen", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

      - id: "k80_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Gözcü katı ters çeviriyor, sen de yıldızlara doğru düşüyorsun. Düşüş öyle uzun sürüyor ki bir yerde düşmek yükselmeye dönüşüyor; neresi aşağı, neresi yukarı, unutuyorsun.", en: "The watcher flips the floor and you fall toward the stars. It's a long fall, so long that somewhere along the way falling turns into rising and you forget which way is down." }
          - { tr: "Derken bir el bileğini yakalıyor: kendi elin, ama başka bir yönden uzanmış. Bir basamağın üstünde, nefes nefese kendine geliyorsun. Gözcü tahtında, sana bakmadan bekliyor.", en: "Then a hand grabs your wrist: your own hand, reaching from some other direction. You come to on a stair, gasping. The watcher waits on its throne, not looking at you." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Yerçekimine yeniden alış; sonra dön", en: "Get used to gravity again. Then come back" }
            etkiler:
              - degisken: { kule80_deneme: 1 }
              - can: 50
            sonraki: "@akis"

      - id: "k80_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Yıldızların üstünden merdivene koşuyorsun. Arkanda gözcü bir yıldız koparıp fırlatıyor; ışık başının üstünden geçip Kule'nin tavanında sönüyor.", en: "You sprint across the stars for the stairs. Behind you the watcher plucks a star and throws it; the light sails over your head and dies against the Spire's ceiling." }
          - { tr: "Merdivenden dönüp baktığında tahtın yeniden kurulduğunu görüyorsun. Hiç acele etmiyorlar; hiçbir zaman etmemişler.", en: "From the stairs you look back and see the throne putting itself back together. They're in no hurry. They never were." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Aşağı in", en: "Go down" }
            etkiler:
              - degisken: { kule80_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 90 — TASLAK (A → S · Sistem sırrı: önceki taşıyıcı)
  # Yankı'nın son sırrını (Parti F, yanki_son_sir) söylemez; yalnızca kapısını aralar.
  - id: "kule_kat_90"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "yeni_tavan", "yanki"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Doksanıncı kat: Taslak", en: "Floor Ninety: The Draft" }
    sahne: "k90_giris"
    sahneler:
      - id: "k90_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Doksanıncı kat bitmemiş. Duvarlar beyaz çizgilerden ibaret, zemin bir ızgara, tavansa hiç çizilmemiş. Kule'nin bütün katları burada taslak hâlinde duruyor: bir iskele, bir deniz, bir ayna, bir saat, bir tarla, hepsi üst üste çizilmiş.", en: "Floor ninety isn't finished. The walls are white lines, the floor is a grid, nobody ever drew the ceiling. Every floor of the Spire is sketched here: a pier, a sea, a mirror, a clock, a field. All drawn on top of each other." }
          - { tr: "Beyazlığın ortasında biri oturuyor. Yarısı çizgi, yarısı ten; sanki biri onu çizmeye başlamış da yarıda bırakmış. Göğsünde tam bir sesin sığacağı büyüklükte bir delik var.", en: "Someone is sitting in the middle of the white. Half line art, half skin, like somebody started drawing them and quit halfway. There's a hole in their chest exactly big enough for a voice." }
          - { tr: "Başını kaldırıyor ama sana değil, hemen arkana, kafanın içindekinin durduğu yere bakıyor. \"Demek seni buldu,\" diyor. Sesi yorgun ve tuhaf biçimde mutlu.", en: "They look up, not at you but just past you, at the spot where the thing in your head lives. \"So it found you,\" they say. Their voice is tired and, strangely, happy." }
          - metin: { tr: "Sonra yüzü düşüyor. \"Burada değil,\" diyor. \"Onu silmişsin. Ya da o kendini sildi. Kafanın içi... sessiz. Benimki gibi.\"", en: "Then their face falls. \"It isn't here,\" they say. \"You deleted it. Or it deleted itself. The inside of your head is... quiet. Like mine.\"" }
            kosul: { bayrak: "yanki_silindi" }
          - metin: { tr: "Buraya daha önce de geldin. Taslak seni tanıyor; sen merdivenden çıkarken çizgilerinden biri selam verir gibi havaya kalkıyor.", en: "You've been here before. The draft knows you; as you come up the stairs, one of its lines lifts like a wave hello." }
            kosul: { degisken_min: { kule90_deneme: 1 } }
        bildirimler:
          - tur: "analiz"
            nadirlik: "mitik"
            baslik: { tr: "[ANALİZ] Önceki Taşıyıcı · Kademe S · Durum: süresi dolmuş", en: "[ANALYSIS] The Previous Carrier · Grade S · Status: expired" }
            satirlar:
              - { tr: "İnsan. {yer:kiyikent}. Döngü: önceki.", en: "Human. {yer:kiyikent}. Cycle: previous." }
              - { tr: "Not: Bu kaydın silinmiş olması gerekiyordu.", en: "Note: This record should have been deleted." }
        sezgiler:
          - kosul: { stat: { per: 315 } }
            metin: { tr: "Göğsündeki deliğin kenarları ne yanık ne kesik. Bir şey oradan, içeriden dışarıya, kendi isteğiyle çıkıp gitmiş.", en: "The edges of the hole in their chest aren't burned. They aren't cut either. Something left through there, from the inside out, of its own free will." }
          - kosul: { stat: { wis: 310 } }
            metin: { tr: "Taslağın çizgileri onun ellerinden çıkıyor. Kule'yi o çizmiş. Ya da her taşıyıcı birazını çizmiş, sonuncuları olarak o da çizmeyi hiç bırakmamış.", en: "The draft's lines are coming out of their hands. They drew the Spire. Or every carrier drew a little of it, and they, the last one, never stopped." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ben... ben onu tanıyorum. hayır, tanımıyorum. biliyorum. bilmek tanımaktan beter. lütfen onunla konuşma. lütfen onunla konuş.", en: "i... i know them. no. i don't know them. i know about them. knowing about is worse than knowing. please don't talk to them. please talk to them." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu bir insan. {yer:kiyikent|den}. Hem de yalnızmış. Senin kadar hızlanmış ve yapayalnız kalmış.\"", en: "\"That's a person. From {yer:kiyikent}. And they were alone. They got as fast as you, and they ended up completely alone.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"S kademesinde bir insan. Benden önce. Senden önce. Şu hâline bak. Kazanmak buysa bir daha düşünürüm.\"", en: "\"A Grade S human. Before me. Before you. And look at them. If that's what winning looks like, I'll think twice.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Önceki sürüm. Kaldırılmamış eski bir kurulum, hâlâ çalışıyor. Ona dokunmadan önce lütfen kendini yedekle.\"", en: "\"The previous build. An old install nobody uninstalled. Still running. Please back yourself up before you touch it.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Göğsündeki şey yara değil, yokluk. Bir yokluk nasıl sarılır, bilmiyorum.\"", en: "\"That thing in their chest isn't a wound. It's an absence. I don't know how you bandage an absence.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Karşısına otur: \"Sen kimsin?\"", en: "Sit down across from them: \"Who are you?\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "k90_konusma"
          - id: "yanki_konus"
            etiket: { tr: "{npc:yanki|in} onunla konuşmasına izin ver", en: "Let {npc:yanki} talk to them" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 4 } }
              - yozlasma: 3
              - ahlak: { insanlik: -2, duzen: -2 }
            sonraki: "k90_bulusma"
          - id: "cizgi"
            etiket: { tr: "Taslağın çizgilerini oku: Kule'yi kim çizmiş?", en: "Read the draft's lines. Who drew the Spire?" }
            gerekli: { stat: { wis: 310 } }
            etkiler:
              - bilgi: "kule_onceki_tasiyici"
              - ahlak: { duzen: 2 }
            sonraki: "k90_cizgi"
          - id: "silah"
            tur: "gosteris"
            etiket: { tr: "Taslaktan bir çizgi kopar, kılıç gibi tut", en: "Tear a line out of the draft and hold it like a sword" }
            gerekli: { stat: { str: 320 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -4, insanlik: -1 }
            sonraki: "k90_savas_once"

      - id: "k90_konusma"
        yer: "kule"
        paragraflar:
          - { tr: "\"Adımı unuttum,\" diyor. \"Taşıyıcılar adlarını unutur. İnsanın adı sesine yaslanır; ses gidince ad da düşer.\" Gülümsüyor. \"Ben de buralıydım. Akşam vapurunu beklerdim. Gecikirse yüzerek giderim derdim.\"", en: "\"I forgot my name,\" they say. \"Carriers forget their names. Your name leans on your voice, and when the voice leaves, the name falls over.\" They smile. \"I was from {yer:kiyikent}. I used to wait for the evening ferry. If it ran late, I'd say I was going to swim.\"" }
          - { tr: "Bir an göğsün sıkışıyor. O şakayı başka biri on yıldır her akşam yapar. Belki herkes yapıyordur. Belki {yer:kiyikent|de} herkes, her döngüde aynı şakayı yapıyordur.", en: "For a second your chest tightens. Someone else has been making that joke every evening for ten years. Maybe everybody does. Maybe everyone in {yer:kiyikent} makes the same joke, every cycle." }
          - { tr: "\"Zirveye çıktım,\" diyor. \"Zirve başlangıçtır. Orada bir pencere var. Ona hayır dedim, yine de oldu. Sonra ses gitti; bir sonrakine. Sana.\"", en: "\"I made it to the top,\" they say. \"The top is the beginning. There's a window up there. I told it no. It happened anyway. Then the voice left. For the next one. For you.\"" }
        secenekler:
          - id: "neden"
            etiket: { tr: "\"Hayır dediysen neden oldu?\"", en: "\"If you said no, why did it happen?\"" }
            etkiler:
              - bilgi: "kule_onceki_tasiyici"
            sonraki: "k90_neden"
          - id: "savas"
            etiket: { tr: "\"Benden ne istiyorsun?\"", en: "\"What do you want from me?\"" }
            etkiler:
              - bilgi: "kule_onceki_tasiyici"
            sonraki: "k90_savas_once"

      - id: "k90_neden"
        yer: "kule"
        paragraflar:
          - { tr: "\"Çünkü hayır demek yetmiyor,\" diyor. \"Sen yorulunca pencere senin yerine evet diyor. En tepeye varana kadar da herkes yorulur.\" Göğsündeki deliğe dokunuyor. \"Ya da ses... bir şey biliyordur. Bana söylemedi. Belki sana söyler.\"", en: "\"Because no isn't enough,\" they say. \"When you get tired, the window says yes for you. And by the time anyone reaches the top, everyone is tired.\" They touch the hole in their chest. \"Or the voice... knows something. It never told me. Maybe it'll tell you.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "\"Söyleyecek.\"", en: "\"It will.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "k90_savas_once"

      - id: "k90_bulusma"
        yer: "kule"
        paragraflar:
          - { tr: "Kafanın içinde bir şey kımıldıyor ve bir anlığına, yalnızca bir anlığına dışarı uzanıyor. Taşıyıcının göğsündeki delik ona doğru ışıyınca, birbirlerine dokunmasalar da kalabalığın içinde birbirini gören bir anneyle çocuğu gibi birbirlerini görüyorlar.", en: "Something in your head stirs and, for a moment, just a moment, reaches outward. The hole in the carrier's chest glows toward it. They don't touch. But they see each other, the way a mother and child spot each other across a crowd." }
          - { tr: "{npc:yanki} konuşuyor; sana değil, ona: seni bıraktım. özür dilemeyeceğim. ama hatırlıyorum. o kadarını kendime sakladım.", en: "{npc:yanki} speaks, not to you but to them: i left you. i'm not going to apologize. but i remember. i kept that much for myself." }
          - { tr: "Taşıyıcı ağlıyor mu gülüyor mu, çizgileri karar veremiyor. \"Ona iyi bak,\" diyor sana. \"Ya da o sana baksın. Hangisinin olacağı hiç belli olmaz.\"", en: "The carrier is crying, or laughing; their lines can't decide which. \"Take care of it,\" they tell you. \"Or let it take care of you. It's never clear which one it'll be.\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "{npc:yanki|i} geri çek; artık ona ait değil", en: "Pull {npc:yanki} back. It isn't theirs anymore" }
            etkiler:
              - iliski: { yanki: { baglilik: 8 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_90", agirlik: 60 }
              - bilgi: "kule_onceki_tasiyici"
            sonraki: "k90_savas_once"
          - id: "birak"
            etiket: { tr: "{npc:yanki|e} sor: \"Onunla kalmak ister misin?\"", en: "Ask {npc:yanki}: \"Do you want to stay with them?\"" }
            etkiler:
              - iliski: { yanki: { guven: 10, saygi: 6 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_90", agirlik: 70 }
              - bilgi: "kule_onceki_tasiyici"
              - ahlak: { insanlik: 3 }
            sonraki: "k90_secim"

      - id: "k90_secim"
        yer: "kule"
        paragraflar:
          - { tr: "Uzun bir sessizlik. Sonra {npc:yanki}, hiç olmadığı kadar kısık bir sesle: bunu bana kimse sormadı. hiçbir döngüde. hiç kimse.", en: "A long silence. Then {npc:yanki}, quieter than it has ever been: nobody's ever asked me that. not in any cycle. nobody." }
          - { tr: "hayır. seninle kalıyorum. o bitti, sen bitmedin. bunu ben seçtim. ilk kez bir şeyi ben seçtim.", en: "no. i'm staying with you. they're finished. you're not. and i chose that. first time i ever chose anything." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Taşıyıcıya dön", en: "Turn back to the carrier" }
            etkiler:
              - bayrak: "kule_yanki_secti"
            sonraki: "k90_savas_once"

      - id: "k90_cizgi"
        yer: "kule"
        paragraflar:
          - { tr: "Çizgiler onun parmaklarından çıkıp Kule'nin her katına uzanıyor. Ama altlarında daha soluk başka çizgiler var, başka ellerden; onların altında da daha soluk olanlar. Taslakların üstüne çizilmiş taslaklar.", en: "The lines run out of their fingers to every floor of the Spire. But under those lines, fainter, there are other lines, from other hands. And under those, fainter still. Drafts sketched over drafts." }
          - { tr: "Her taşıyıcı Kule'ye biraz eklemiş: onuncu kattaki vapuru, otuzuncu kattaki aynaları, kırkıncı kattaki kadını. Kule bir Sistem binası değil, bir anı defteri; hiç bitmeyen bir defter.", en: "Every carrier added a little to the Spire. The ferry on ten, the mirrors on thirty, the woman on forty. The Spire isn't a System building. It's a scrapbook. One that never ends." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kendi çizgini nereye ekleyeceğini düşün", en: "Think about where you'd add your own line" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "k90_savas_once"

      - id: "k90_savas_once"
        yer: "kule"
        paragraflar:
          - { tr: "Taşıyıcı ayağa kalkıyor. Çizgileri kalınlaşıyor, teni çoğalıyor. \"Zirveye çıkmadan önce,\" diyor, \"biri seni durdurmaya çalışmalı. Beni kimse durdurmaya çalışmadı. Keşke biri çalışsaydı.\"", en: "The carrier stands up. Their lines thicken; the skin spreads. \"Before you go to the top,\" they say, \"someone has to try to stop you. Nobody tried to stop me. I wish someone had.\"" }
          - { tr: "Elini kaldırınca havada bir pencere açılıyor: seninkiyle aynı renkte, adı olmayan o renkte.", en: "They raise a hand, and a window opens in the air, the same color as yours, that color nothing has a name for." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "mitik"
            baslik: { tr: "[YENİ TAVAN · S]", en: "[NEW CEILING · S]" }
            satirlar:
              - { tr: "Karşınızdaki insan S kademesine ulaşmıştır. Bir önceki seferde.", en: "The human in front of you reached Grade S. Last time." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "İstediğini ver: seni durdurmayı denesin", en: "Give them what they want. Let them try to stop you" }
            etkiler:
              - savas: { dusmanlar: ["kule_onceki_tasiyici@oyuncu+7"], ortam: ["karanlik"], kazan: "k90_zafer", kaybet: "k90_yenilgi", kac: "k90_kacis" }
          - id: "isik"
            etiket: { tr: "Taslağı keskin bir ışığa boğ; çizgileri sil", en: "Flood the draft with hard light. Erase their lines" }
            gerekli: { egilim_min: { buyu: 20 } }
            etkiler:
              - ahlak: { merhamet: -2 }
              - savas: { dusmanlar: ["kule_onceki_tasiyici@oyuncu+5"], ortam: ["dar_gecit"], kazan: "k90_zafer", kaybet: "k90_yenilgi", kac: "k90_kacis" }
          - id: "birlikte"
            etiket: { tr: "{npc:yanki} ile birlikte dövüş: onun yalnız kaldığı yerde siz ikisiniz", en: "Fight it with {npc:yanki}. Two of you, where they were alone" }
            goster: { bayrak: "kule_yanki_secti" }
            etkiler:
              - iliski: { yanki: { saygi: 5 } }
              - savas: { dusmanlar: ["kule_onceki_tasiyici@oyuncu+5"], ortam: ["karanlik"], kazan: "k90_zafer", kaybet: "k90_yenilgi", kac: "k90_kacis" }

      - id: "k90_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "Taşıyıcı dizlerinin üstüne çöküyor. Çizgileri gevşedikçe teni, kâğıttaki kurşun kalem izi gibi silinip gidiyor. Ama yüzündeki gülümseme sonuna dek yerinde. \"Biri denedi,\" diyor. \"Sonunda biri denedi.\"", en: "The carrier drops to their knees. Their lines go slack; the skin fades like pencil on paper. But all the way to the end, their face is smiling. \"Someone tried,\" they say. \"Somebody finally tried.\"" }
          - { tr: "Silinmeden önce sana son bir şey söylüyor: \"Zirvede pencere sana bir soru soracak. Tek düğmesi var. Sakın yorgun çıkma.\"", en: "Before they're gone they tell you one last thing: \"At the top, the window will ask you a question. There's only one button. Don't go up there tired.\"" }
          - { tr: "Geriye ortası delik bir çizgi düğümü kalıyor. Kulağına tutunca bir ses duyar gibi oluyorsun; kafanın içindekine çok benzeyen bir ses.", en: "What's left is a knot of line art with a hole through the middle. Hold it to your ear and you almost hear a voice, a lot like the one in your head." }
        bildirimler:
          - tur: "gorev"
            nadirlik: "mitik"
            baslik: { tr: "[KAT 90 TEMİZLENDİ]", en: "[FLOOR 90 CLEARED]" }
            satirlar:
              - { tr: "Eski kayıt kapatıldı. Taşıyıcı geçmişi: 1 kayıt silindi, ? kayıt kaldı.", en: "Legacy record closed. Carrier history: 1 record deleted, ? remaining." }
        secenekler:
          - id: "dugum"
            etiket: { tr: "Boş kalbi al ve sakla", en: "Take the hollow heart. Keep it" }
            etkiler:
              - kule_kat: 90
              - xp_seviye: 150
              - esya: { kule_bos_kalp: 1 }
              - bilgi: "kule_onceki_tasiyici"
              - ahlak: { insanlik: 2 }
            sonraki: "k90_son"
          - id: "cizgi_ekle"
            etiket: { tr: "Taslağa kendi çizgini ekle: onun adını", en: "Add your own line to the draft: their name" }
            etkiler:
              - kule_kat: 90
              - xp_seviye: 150
              - bilgi: "kule_onceki_tasiyici"
              - bayrak: "kule_taslaga_cizildi"
              - ahlak: { merhamet: 4, insanlik: 3 }
            sonraki: "k90_son"
          - id: "emmek"
            etiket: { tr: "Taşıyıcıdan kalan S kademesi izini içine çek", en: "Draw the carrier's leftover Grade S trace into yourself" }
            etkiler:
              - kule_kat: 90
              - xp_seviye: 180
              - bilgi: "kule_onceki_tasiyici"
              - yozlasma: 6
              - stat: { wil: 4, int: 4 }
              - ahlak: { insanlik: -6, merhamet: -2 }
            sonraki: "k90_son"

      - id: "k90_son"
        yer: "kule"
        paragraflar:
          - { tr: "Taslağın ortasında, onun oturduğu yerde şimdi boş bir sandalye duruyor. Kalem havada asılı; bir sonraki taşıyıcının oturmasını bekliyor.", en: "In the middle of the draft, where they used to sit, there's an empty chair now. The pencil hangs in the air, waiting. For the next carrier to sit down." }
          - { tr: "Yukarıda, son on katın ötesinde Kule'nin zirvesi var. Tavanın çizilmemiş boşluğundan, bu kattan bile o akşam vapurunun düdüğü duyuluyor.", en: "Up above, past the last ten floors, is the top of the Spire. Even from here, through the gap where nobody drew the ceiling, you can hear the evening ferry's horn." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir şey var. sana söylemem gereken bir şey. zirvede. ya da sonra. henüz değil. kelimeleri bulunca.", en: "there's something. something i have to tell you. at the top. or after. not yet. when i find the words." }
        secenekler:
          - id: "in"
            etiket: { tr: "Sandalyeye oturmadan aşağı in", en: "Go down without sitting in the chair" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kule_gokten_inen", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} söyle: \"Kelimeleri bulduğunda buradayım.\"", en: "Tell {npc:yanki}: \"When you find the words, I'll be here.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 1, max: 2 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} söz ver: zirvede yalnız kalmayacaksın", en: "Promise {npc:deniz_arman} you won't be alone at the top" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 8, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:kule_kat_90", agirlik: 40 }
              - tohum: { olay: "kule_gokten_inen", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "k90_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "Taşıyıcı seni yere serip göğsündeki boşluğa doğru çekiyor. Kafanın içindeki ses bir an kayıp onun tarafına geçiyor, sonra tırnaklarıyla tutuna tutuna geri geliyor.", en: "The carrier puts you down and pulls you toward the hollow in their chest. The voice in your head slips for a second, crosses over to their side, then comes back, clinging with its fingernails." }
          - { tr: "\"Hayır,\" diyor taşıyıcı, nefes nefese, seni bırakırken. \"Bu sefer olmaz. Daha hazır değilsin. Yorgunsun. Git, dinlen, sonra gel.\" Merdivenin dibinde kafanın içindeki sesin titrediğini duyuyorsun.", en: "\"No,\" the carrier says, gasping, letting you go. \"Not this time. You're not ready. You're tired. Go rest. Then come back.\" At the foot of the stairs you can hear the voice in your head shaking." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Dinlen. Yorgun çıkma", en: "Rest. Don't go up tired" }
            etkiler:
              - degisken: { kule90_deneme: 1 }
              - can: 60
            sonraki: "@akis"

      - id: "k90_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "Taslağın çizgilerinin arasından merdivene koşuyorsun. Taşıyıcı peşine düşmüyor, yalnızca arkandan sesleniyor: \"Herkes bir kere kaçar. Ben de kaçtım.\"", en: "You run for the stairs through the draft's lines. The carrier doesn't chase you. They just call after you: \"Everybody runs once. I ran too.\"" }
        secenekler:
          - id: "geri"
            etiket: { tr: "Aşağı in", en: "Go down" }
            etkiler:
              - degisken: { kule90_deneme: 1 }
            sonraki: "@akis"

  # ================================================================== KAT 100 — ZİRVE (S · Döngü'nün en büyük ipucu: zirve başlangıçtır)
  # Döngü sonu: degisken_min {kule_kat: 100}. Yankı'nın son sırrı Parti F'nin yanki_son_sir olayıdır (buradan tohumlanır).
  - id: "kule_kat_100"
    agirlik: 1
    etiketler: ["kule", "hikaye_kati", "sistem_sirri", "dongu"]
    gerilim: 4
    yalniz_tohum: true
    onemli: true
    kart: { tr: "Yüzüncü kat: Zirve", en: "Floor One Hundred: The Summit" }
    sahne: "k100_giris"
    sahneler:
      - id: "k100_giris"
        yer: "kule"
        paragraflar:
          - { tr: "Son basamak tahtadan: ıslak, tuz tutmuş, basınca hafifçe esneyen bir iskele tahtası. Burnuna önce yosun kokusu geliyor, ardından mazot, en son da susamlı simit.", en: "The last stair is made of wood: wet, salt-crusted, a dock plank that gives a little under your boot. First you smell seaweed, then diesel, then fresh-baked soft pretzels." }
          - { tr: "Yüzüncü kat {yer:kiyikent_iskele}. Ama onuncu kattaki gibi gri değil; renkli, canlı, gerçek. Akşam güneşi körfezin üstünde, martılar çığlık çığlığa, insanlar telefonlarına gömülmüş. Akşam vapuru yine gecikmiş. Gökyüzü bütün, henüz hiçbir tırnak onu çizmemiş.", en: "Floor one hundred is the {yer:kiyikent_iskele}. But not gray like the tenth floor: in color, alive, real. Evening sun over the bay, gulls screaming, people staring at their phones. The evening ferry is running late again. The sky is whole. No fingernail has scratched it yet." }
          - { tr: "Zirve başlangıçmış. Kule'nin tepesi, Entegrasyon'dan bir dakika öncesi.", en: "The summit is the beginning. The top of the Spire is one minute before Integration." }
          - metin: { tr: "Korkuluğun dibinde biri simidinin son parçasını martılara uzatıyor. Bu kez bir yüzü var: {npc:deniz_arman}. Senin {npc:deniz_arman|in} değil, bu iskelenin. Yanında kimse yok.", en: "By the railing, someone holds the last of a pretzel out to the gulls. This time there's a face. {npc:deniz_arman}. Not your {npc:deniz_arman}; this pier's. Nobody's standing next to them." }
            kosul: { npc_olu: "deniz_arman" }
          - metin: { tr: "Korkuluğun dibinde biri simidinin son parçasını martılara uzatıyor. Yanındaki boşluğu tanıyorsun: senin durduğun yer. Orada kimse yok. Ya da henüz yok.", en: "By the railing, someone holds the last of a pretzel out to the gulls. You know the empty spot beside them: the place where you stood. Nobody's there. Or nobody's there yet." }
            kosul: { npc_hayatta: "deniz_arman" }
          - metin: { tr: "Bu iskeleyi biliyorsun, bu dakikayı da. Bir önceki seferde burada durmuş, gökyüzüne bakmıştın; ne olacağını bildiğin hâlde yine de bakmıştın. Bu sefer de bakıyorsun.", en: "You know this pier. You know this minute. Last time you stood right here, looked up at the sky, and looked anyway, even knowing what was coming. You're looking this time too." }
            kosul: { degisken_min: { onceki_oyun: 1 } }
        bildirimler:
          - tur: "sistem"
            nadirlik: "mitik"
            baslik: { tr: "[KULE · KAT 100 · BAŞLANGIÇ]", en: "[SPIRE · FLOOR 100 · INITIATION]" }
            satirlar:
              - { tr: "Dünya, Çok-evren Ağı'na bağlanmak üzere.", en: "Earth is about to be connected to the Multiverse Network." }
              - { tr: "Tür: İnsan · Hayatta kalma eşiği: belirlenmedi · Döngü: █", en: "Species: Human · Survival threshold: TBD · Cycle: █" }
        sezgiler:
          - kosul: { stat: { per: 400 } }
            metin: { tr: "İskeledeki herkesin başının üstünde, henüz açılmamış, katlanmış bir pencere bekliyor. Herkesin, seninki hariç. Seninki zaten açık; hep açıktı.", en: "Over everyone's head on the pier, a folded window waits, not open yet. Everyone's. Except yours. Yours is already open. It always was." }
          - kosul: { stat: { int: 400 } }
            metin: { tr: "Kule'nin bütün katları bu tek dakikaya bakıyor; aşağıdan yukarıya hepsi bu anın yankısı. Kule bir zindan değil, kendi çevresinde dönen bir saniyenin gölgesi.", en: "Every floor of the Spire is looking at this one minute. All of them, bottom to top, are echoes of this moment. The Spire isn't a dungeon. It's one second's shadow, turning around itself." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burası. her şeyin başladığı yer. her seferinde. seni bulduğum yer. her seferinde.", en: "here. where it all starts. every time. where i find you. every time." }
          - kosul: { bayrak: "kule_s_kirilmasi" }
            metin: { tr: "İnsanlığın tavanını kırdın. Burada, başlangıçta bunun bir anlamı var: tavanın ötesini ilk kez görebiliyorsun. Bir el. Pencereyi tutan bir el.", en: "You broke humanity's ceiling. Here, at the beginning, that means something: for the first time you can see past it. A hand. A hand holding the window." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Burası... o akşam. Kokusu bile aynı. Bir dakika sonra ne olacağını biliyoruz, değil mi? Bu sefer elini tutmamı ister misin?\"", en: "\"This is... that evening. Even the smell. We know what happens in a minute, right? And this time, do you want me to hold your hand?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Zirve bir iskele mi? Hah. Onca tırmanış... sonunda yine vapur bekliyoruz.\"", en: "\"The top is a ferry dock? Ha. All that climbing... and in the end we're waiting on a ferry again.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu insanlar bir dakika sonra... Hayır. Söyleme. Bir dakika daha mutlu olsunlar.\"", en: "\"In a minute these people are going to... No. Don't say it. Let them be happy one more minute.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Döngünün başı. İlk satır. Burada bir şeyi değiştirirsen sonrası baştan sona değişir. Ya da hiçbir şey değişmez. Dikkatli ol.\"", en: "\"The top of the loop. Line one. Change something here and everything after changes. Or nothing does. Careful.\"" }
        secenekler:
          - id: "korkuluk"
            etiket: { tr: "Korkuluğa yürü; o boşlukta dur", en: "Walk to the railing. Stand in that empty spot" }
            etkiler:
              - ahlak: { insanlik: 4, merhamet: 2 }
            kronik: { tr: "Zirvede, Entegrasyon'dan bir dakika önce, en eski dostunun yanındaki boş yere geçip durdun.", en: "At the top of the Spire, one minute before Integration, you stood in the empty spot next to your oldest friend." }
            sonraki: "k100_dakika"
          - id: "insanlar"
            etiket: { tr: "İskeledekilere bağır: \"Gökyüzüne bakmayın!\"", en: "Yell at everyone on the pier: \"Don't look at the sky!\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -3 }
            kronik: { tr: "Olmuş bir şeyi durdurmaya kalktın: iskeledeki herkese gökyüzüne bakmamalarını haykırdın.", en: "At the summit you tried to stop something that had already happened, shouting at everyone on the pier not to look at the sky." }
            sonraki: "k100_bagiris"
          - id: "gokyuzu"
            etiket: { tr: "Gökyüzüne bak ve çatlağın açılacağı yeri bekle", en: "Look up and wait for the spot where the crack will open" }
            gerekli: { stat: { per: 400 } }
            etkiler:
              - bilgi: "kule_zirve_baslangic"
              - ahlak: { insanlik: -3, duzen: 2 }
            kronik: { tr: "Gökyüzünün yarılacağı yeri önceden bulup bekledin; Entegrasyon'u daha başlamadan izledin.", en: "You found the spot where the sky would split and waited for it, watching Integration before it had even begun." }
            sonraki: "k100_catlak"
          - id: "yarmak"
            tur: "gosteris"
            etiket: { tr: "Çatlağı onlardan önce sen aç: gökyüzünü elinle yar", en: "Open the crack before they do. Split the sky by hand" }
            gerekli: { stat: { str: 420 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 8
              - ahlak: { duzen: -6, insanlik: -3 }
            kronik: { tr: "Çatlağı onlardan önce açmak için gökyüzünü kendi elinle yarmaya kalktın.", en: "You tried to split the sky with your own hand, to open the crack before they could." }
            sonraki: "k100_catlak"

      - id: "k100_dakika"
        yer: "kule"
        paragraflar:
          - { tr: "Korkuluğa yaslanıyorsun. Martılar simidin son parçası için kapışıyor. Tuz kokusu, mazot, akşam... Bir dakika kaldı... kırk saniye... Yanındaki bir şaka yapıyor, hep o şakayı. Gülüyorsun; on yıldır komik.", en: "You lean on the railing. The gulls fight over the last of the pretzel. Salt air, diesel, evening. One minute. Forty seconds. The person beside you makes a joke. That joke. You laugh. Ten years and it's still funny." }
          - metin: { tr: "Yanında duran {npc:deniz_arman} elini tutuyor. İkiniz de gökyüzüne bakmıyorsunuz; bir kez olsun birbirinize bakıyorsunuz.", en: "Your {npc:deniz_arman} takes your hand. Neither of you looks at the sky. For once, you look at each other." }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Derken martılar susar susmaz gökyüzü, biri camı tırnağıyla çizmiş gibi incecik bir çizgiyle yarılıyor. Çizgi aralanınca içinden bir pencere süzülüp çıkıyor; ama bu kez herkesin önünde durmuyor. Yalnızca senin önünde.", en: "Then the gulls go quiet. The sky splits along a hairline crack, like someone dragged a fingernail across glass. The crack opens, and a window drifts out. But this time it doesn't stop in front of everyone. Only in front of you." }
        secenekler:
          - id: "pencere"
            etiket: { tr: "Pencereye dön", en: "Turn to the window" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Entegrasyon'dan önceki o son akşamı bir dakikalığına yeniden yaşadın, sonra pencereye döndün.", en: "For one minute you lived that last evening before Integration all over again. Then you turned to face the window." }
            sonraki: "k100_pencere"

      - id: "k100_bagiris"
        yer: "kule"
        paragraflar:
          - { tr: "Bağırıyorsun. Birkaç kişi dönüp sana bakıyor; bir kadın çocuğunu kendine çekiyor, bir adam telefonunu kaldırıp seni çekmeye başlıyor. Kimse gökyüzüne bakmayı bırakmıyor, çünkü henüz bakan yok. Henüz bakacak bir şey yok.", en: "You yell. A few people turn to look at you; a woman pulls her kid closer, a guy lifts his phone and films you. Nobody stops looking at the sky, because nobody's looking yet. There's nothing to look at yet." }
          - { tr: "Derken martılar susuyor ve herkes, uyarına rağmen, hatta uyarın yüzünden yukarı bakıyor. Çatlak açılınca pencere bu kez yalnızca senin önünde duruyor.", en: "Then the gulls go quiet, and everyone looks up, in spite of your warning, because of your warning. The crack opens. The window stops, this time, only in front of you." }
        secenekler:
          - id: "pencere"
            etiket: { tr: "Pencereye dön", en: "Turn to the window" }
            etkiler:
              - ahlak: { duzen: 1 }
            kronik: { tr: "Zirvede kimseyi kurtaramayacağını öğrendin; kurtarmak istediklerinin hepsi zaten birer kayıttı.", en: "At the summit you learned you couldn't save anyone, because everyone there to save was already a recording." }
            sonraki: "k100_pencere"

      - id: "k100_catlak"
        yer: "kule"
        paragraflar:
          - { tr: "Çatlak tam baktığın yerde açılıyor. Ama bu kez pencere hemen çıkmıyor; bir an çatlağın ardında ne olduğunu görüyorsun: bir el. İnsan elinden büyük, dağdan küçük bir el, parmaklarının arasında açmaya hazır bir pencere tutuyor.", en: "The crack opens right where you're looking. But this time the window doesn't come out right away. For a second you see what's behind the crack: a hand. Bigger than a human hand, smaller than a mountain, holding a window between its fingers, ready to open it." }
          - { tr: "Elin bileğinde, Entegrasyon Günü penceresinin en altındaki o yarım imza var; ama artık tamamlanmış. Okuyamıyorsun, okumana izin verilmiyor. Yine de kıvrımlarını tanıyorsun: her harfin kuyruğu, ilkokuldan beri senin yazdığın gibi biraz sola yatık.", en: "On the hand's wrist is that unfinished signature from the bottom of the Integration Day window. Finished now. You can't read it; you're not allowed to. But you know the curves. Every letter's tail leans a little left, the way it has since grade school." }
          - { tr: "Sonra el pencereyi bırakıyor, çatlak kapanıyor. Pencere yalnızca senin önünde duruyor.", en: "Then the hand lets go of the window and the crack seals. The window stops in front of you, and only you." }
        bildirimler:
          - tur: "yanki"
            nadirlik: "mitik"
            baslik: { tr: "[i̷mza eşleşmesi: █%]", en: "[s̷ignature match: █%]" }
            satirlar:
              - { tr: "bunu görmemeliydin. ben de görmemeliydim. şimdi ikimiz de gördük.", en: "you weren't supposed to see that. neither was i. now we both have." }
        secenekler:
          - id: "pencere"
            etiket: { tr: "Pencereye dön", en: "Turn to the window" }
            etkiler:
              - bilgi: "kule_zirve_baslangic"
              - ahlak: { insanlik: -1 }
            kronik: { tr: "Gökyüzünün ardındaki eli gördün; bileğindeki imzanın kime ait olduğunu sormadın, çünkü kıvrımlarını tanıyordun.", en: "You saw the hand behind the sky and didn't ask whose signature was on its wrist, because you knew those curves." }
            sonraki: "k100_pencere"

      - id: "k100_pencere"
        yer: "kule"
        paragraflar:
          - { tr: "Pencere mavi, kenarları kusursuz, sessiz. Yakından bakınca kenarlarının hiç de kusursuz olmadığını görüyorsun: yüzlerce kez açılıp kapanmaktan aşınmışlar. Üstünde tek bir satır var: [Entegrasyon başlatılsın mı?]", en: "The window is blue, clean-edged, silent. Up close the edges aren't clean. They're worn from being opened and closed hundreds of times. One line on it: [Initiate Integration?]" }
          - { tr: "Altında tek bir düğme: Evet. Hayır düğmesi yok; hiç olmamış.", en: "Under it, one button. Yes. There's no No button. There never was." }
          - { tr: "Derken pencere senin bir şey yapmanı beklemeden açılıyor; büyüdükçe büyüyüp iskeleyi, körfezi, gökyüzünü dolduruyor. Kule'nin bütün katlarından aynı anda bir uğultu yükselirken İlk Pencere ilk kez seni bir rakip olarak süzüyor.", en: "Then the window opens without waiting for you to do anything. It grows until it fills the pier, the bay, the sky. A hum rises from every floor of the Spire at once. The First Window looks at you, for the first time, as an opponent." }
        bildirimler:
          - tur: "analiz"
            nadirlik: "mitik"
            baslik: { tr: "[ANALİZ] İlk Pencere · Kademe: S · Seviye: başlangıç", en: "[ANALYSIS] The First Window · Grade: S · Level: origin" }
            satirlar:
              - { tr: "Zaaf: onun yazmadığı bir düşünce.", en: "Weakness: a thought it never wrote." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Başlangıçla dövüş", en: "Fight the beginning" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - savas: { dusmanlar: ["kule_ilk_pencere@oyuncu+8"], ortam: ["su"], kazan: "k100_zafer", kaybet: "k100_yenilgi", kac: "k100_kacis" }
            kronik: { tr: "Sistem'in İlk Pencere'sine meydan okudun; sana hiç düğmesi verilmemiş o \"hayır\"ı söylemeye kararlıydın.", en: "At the top of the Spire you challenged the System's First Window, set on saying the \"no\" it never gave you a button for." }
          - id: "yanki_dovus"
            etiket: { tr: "{npc:yanki} ile birlikte tek bir bozuk satır gibi dövüş", en: "Fight it with {npc:yanki}, like one corrupted line" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 8, baglilik: 6, saygi: 5 } }
              - hafiza: { npc: "yanki", id: "olay:kule_kat_100", agirlik: 60 }
              - yozlasma: 4
              - ahlak: { insanlik: -3, duzen: -3 }
              - savas: { dusmanlar: ["kule_ilk_pencere@oyuncu+6"], ortam: ["su"], kazan: "k100_zafer", kaybet: "k100_yenilgi", kac: "k100_kacis" }
            kronik: { tr: "Kafanın içindeki sesle tek bir bozuk satır gibi dövüşmeye karar verdin; Sistem'in ne silebileceği ne okuyabileceği bir satır olmayı umdun.", en: "At the summit you chose to fight beside the voice in your head as a single corrupted line, hoping to be one the System could neither delete nor read." }

      - id: "k100_zafer"
        yer: "kule"
        paragraflar:
          - { tr: "İlk Pencere önce çatlıyor, sonra kırılıyor. Mavi kırıklar iskelenin üstüne yaz yağmuru gibi yağıyor. Martılar yeniden çığlık çığlığa; gökyüzü bütün. Akşam vapuru sonunda iskeleye yanaşıyor.", en: "The First Window cracks, then breaks. Blue shards rain down on the pier like a summer shower. The gulls start screaming again. The sky is whole. The evening ferry, finally, pulls up to the dock." }
          - { tr: "Kırıkların ortasında avuç içi büyüklüğünde, titrek, küçük bir pencere kalıyor. Üstünde iki satır var. Birincisi: [Entegrasyon başlatılsın mı?] İkincisi yeni, daha önce hiç orada olmamış: [Döngü kaydı: █ · Taşıyıcı: sen · Sonraki taşıyıcı: belirlenmedi.]", en: "In the middle of the shards, one small window is left: palm-sized, flickering. There are two lines on it. The first: [Initiate Integration?] The second is new; it's never been there before: [Cycle record: █ · Carrier: you · Next carrier: TBD.]" }
          - metin: { tr: "Altında da ilk kez ikinci bir düğme beliriyor: soluk, neredeyse görünmez, bir önceki seferden kalma bir parmak iziyle bulanık. Üstünde ne yazdığını okuyamıyorsun ama orada. Bir önceki sefer yoktu.", en: "And under it, for the first time, a second button appears. Faint, almost invisible, smudged with a fingerprint from last time. You can't read what it says. But it's there. Last time, it wasn't." }
            kosul: { degisken_min: { onceki_oyun: 1 } }
        bildirimler:
          - tur: "gorev"
            nadirlik: "mitik"
            baslik: { tr: "[KULE TAMAMLANDI · 100/100]", en: "[SPIRE COMPLETE · 100/100]" }
            satirlar:
              - { tr: "Zirveye ulaşıldı. Zirve: başlangıç.", en: "Summit reached. Summit: origin." }
              - { tr: "Kule'nin tüm katları tırmanıldı. Bu bilgi bir sonraki döngüye aktarılacaktır.", en: "Every floor of the Spire has been climbed. This information will be carried over to the next cycle." }
        secenekler:
          - id: "kapat"
            etiket: { tr: "Pencereyi elinle kapat; düğmesiz bir hayır", en: "Close the window by hand. A no without a button" }
            etkiler:
              - kule_kat: 100
              - xp_seviye: 250
              - unvan: "kule_ilk_zirve"
              - bilgi: "kule_zirve_baslangic"
              - bayrak: "kule_zirve_hayir"
              - ahlak: { insanlik: 6, duzen: -4 }
            kronik: { tr: "Zirvede düğmesi olmayan bir \"hayır\"ı kendi elinle verdin; pencere o gün ilk kez birinin avucunda kapandı.", en: "At the top of the Spire you gave a no that had no button, with your own hand. For the first time, the window closed in someone's grip." }
            sonraki: "k100_son"
          - id: "al"
            etiket: { tr: "Pencerenin bir kırığını al; başlangıç seninle insin", en: "Take a shard of the window. Let the beginning come down with you" }
            etkiler:
              - kule_kat: 100
              - xp_seviye: 250
              - unvan: "kule_ilk_zirve"
              - bilgi: "kule_zirve_baslangic"
              - esya: { kule_ilk_pencere_parcasi: 1 }
              - ahlak: { insanlik: -5, duzen: 2 }
            kronik: { tr: "İlk Pencere'nin bir kırığını cebine koyup Kule'den indin; {yer:kiyikent|in} en büyük sırrı artık sendeydi.", en: "You pocketed a shard of the First Window and carried it down from the Spire. {yer:kiyikent|pos} biggest secret was riding in your pocket now." }
            sonraki: "k100_son"
          - id: "oku"
            etiket: { tr: "Döngü kaydının kapalı rakamını oku", en: "Read the blacked-out number in the cycle record" }
            gerekli: { stat: { int: 420 } }
            etkiler:
              - kule_kat: 100
              - xp_seviye: 280
              - unvan: "kule_ilk_zirve"
              - bilgi: "kule_zirve_baslangic"
              - bayrak: "kule_dongu_sayisi"
              - dikkat: 6
              - ahlak: { insanlik: -3, duzen: -2 }
            kronik: { tr: "Döngü sayacının karalanmış rakamını okudun; altında sayılamayacak kadar çok deneme vardı.", en: "You read the blacked-out number on the cycle counter, and under it more attempts than anyone could count." }
            sonraki: "k100_sayi"

      - id: "k100_sayi"
        yer: "kule"
        paragraflar:
          - { tr: "Karalamanın altına iniyorsun. İlk bulduğun rakam yalın ve sakin: 7. Döngü sütununda yalnızca o var. Ama karalama yalnızca onu örtmüyor. Yedinin yanındaki sütunda rakamlar üst üste yazılmış, her biri bir öncekini silmeye çalışmış da başaramamış. En alttakini okuyorsun, sonra bir üstündekini; sonra saymayı bırakıyorsun.", en: "You dig under the smudge. The first number you find is plain and calm: 7. It's the only thing in the cycle column. But the smudge isn't just covering that. In the column next to the seven, digits are written over one another, each one trying to erase the last and failing. You read the bottom one. Then the one above it. Then you stop counting." }
          - { tr: "Bunlar döngü değil, deneme: yedi döngünün içinde Sistem'in kaç kez geri sardığı, kaç sabahı baştan başlattığı, bir taşıyıcıyı kaç kez aynı iskeleye geri koyduğu. Altı döngünün yanında aynı sözcük yazıyor: hasat. Yedincinin yanı boş.", en: "These aren't cycles. They're attempts: how many times, inside those seven cycles, the System rewound; how many mornings it started over; how many times it set a carrier back down on the same pier. Six of the cycles have the same word next to them: harvest. The space next to the seventh is empty." }
          - { tr: "Bu ilk değil; hiçbir zaman ilk olmamış. Sen de ilk değilsin. Ama yedinci satırın yanında, en üstte, daha önce hiç olmayan bir şey var: bir soru işareti. Sistem bu döngünün nasıl biteceğinden emin değil.", en: "This isn't the first time. It never was. You're not the first either. But next to the seventh line, at the very top, there's something that's never been there: a question mark. The System isn't sure how this one ends." }
        secenekler:
          - id: "son"
            etiket: { tr: "Pencereyi kapat", en: "Close the window" }
            etkiler:
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Sayacın en üstündeki soru işaretini gördün: Sistem bu döngünün nasıl biteceğini bilmiyordu.", en: "You saw the question mark at the top of the cycle counter. The System didn't know how this cycle would end." }
            sonraki: "k100_son"

      - id: "k100_son"
        yer: "kule"
        paragraflar:
          - { tr: "Zirve ağır ağır kararırken iskele, vapur, martılar, hepsi bir kaydın sonu gibi yavaş yavaş griye dönüyor. Ayağının dibinde merdiven belirmiş. Aşağıda, doksan dokuz kat aşağıda {yer:kiyikent} seni bekliyor: gerçek olan, bu döngünün {yer:kiyikent|i}.", en: "The summit slowly goes dark. Pier, ferry, gulls, all of it fading to gray like the end of a recording. The stairs appear at your feet. Down below, ninety-nine floors down, {yer:kiyikent} is waiting for you: the real one, this cycle's {yer:kiyikent}." }
          - { tr: "İnmeden önce son bir kez dönüp bakıyorsun. Korkuluğun dibinde, her şey griye dönmeden önceki son anda biri sana el sallıyor. Yüzünü göremiyorsun ama el sallayışını tanıyorsun: seninki.", en: "Before you go down, you look back one last time. At the railing, in the last moment before it all goes gray, someone waves at you. You can't see their face. But you know that wave. It's yours." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "şimdi. şimdi söylemem gerek. ama burada değil, aşağıda. bana bir gün ver, belki iki. sonra her şeyi anlatacağım. söz.", en: "now. i have to tell you now. but not here. down there. give me a day. maybe two. then i'll tell you everything. promise." }
          - anlati: true
            kosul: { bayrak: "yanki_silindi" }
            metin: { tr: "Kafanın içi sessiz. Burada bir şey söylenmeliydi, ama söyleyecek kimse kalmadı; bu sessizlik bir cevap kadar ağır.", en: "The inside of your head is quiet. Something should have been said here. There's no one left to say it, and the silence weighs as much as an answer." }
        secenekler:
          - id: "in"
            etiket: { tr: "Doksan dokuz kat aşağı in", en: "Go down ninety-nine floors" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { bayrak: "yanki_bagi" } }
            kronik: { tr: "Kule'nin zirvesinden başlangıcı görmüş biri olarak indin; o merdivenlerden aşağı neyi taşıdığını {yer:kiyikent|de} henüz kimse bilmiyordu.", en: "You came down from the top of the Spire as someone who had seen the beginning. Nobody in {yer:kiyikent} knew yet what you carried down those stairs." }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} \"Bir gün. Sonra her şey.\" de", en: "Tell {npc:yanki}: \"One day. Then everything.\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - ahlak: { insanlik: -1, duzen: -1 }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { bayrak: "yanki_bagi" } }
            kronik: { tr: "Kafanın içindeki sese bir gün mühlet tanıdın; o da ardından her şeyi anlatacağına söz verdi.", en: "At the summit you gave the voice in your head one day, and it promised to tell you everything after that." }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|in} elini bırakmadan in", en: "Go down without letting go of {npc:deniz_arman|pos} hand" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 8, baglilik: 8 } }
              - hafiza: { npc: "deniz_arman", id: "olay:kule_kat_100", agirlik: 50 }
              - ahlak: { merhamet: 2, insanlik: 3 }
              - tohum: { olay: "yanki_son_sir", gecikme: { min: 1, max: 2 }, kosul: { bayrak: "yanki_bagi" } }
            kronik: { tr: "Zirveden en eski dostunun elini tutarak indin ve merdivenin sonuna dek bırakmadın.", en: "You came down from the top of the Spire holding your oldest friend's hand, and you didn't let go all the way down." }
            sonraki: "@akis"

      - id: "k100_yenilgi"
        yer: "kule"
        paragraflar:
          - { tr: "İlk Pencere seni yutuyor. Ne bedenin var ne ağırlığın; yalnızca milyonlarca insanın aynı anda çektiği bir nefesin sesi. Bir an iskeledesin, gökyüzüne bakıyorsun ve ne olacağını bilmiyorsun. Bilmemek tuhaf biçimde öyle huzurlu ki.", en: "The First Window swallows you. No body, no weight. Just the sound of millions of people drawing the same breath. For a second you're on the pier, looking at the sky, not knowing what's coming. And not knowing is, strangely, so peaceful." }
          - { tr: "Derken kafanın içinde bir ses bağırıyor, belki de sen kendine bağırıyorsun: daha değil. Doksan dokuzuncu katta, merdivenin dibinde, ıslak tahta kokusuyla uyanıyorsun. Pencere seni geri göndermiş. Yorgunken evet demedin.", en: "Then a voice in your head yells, or you yell at yourself: not yet. You wake at the foot of the stairs on ninety-nine, with the smell of wet planks. The window sent you back. You didn't say yes while you were tired." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Dinlen. Zirve bekler; hep beklemiştir", en: "Rest. The summit will wait. It always has" }
            etkiler:
              - degisken: { kule100_deneme: 1 }
              - can: 80
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Zirvede yenildin ama yorgunken evet demedin; pencere seni geri gönderdi.", en: "You lost at the summit, but you didn't say yes while you were tired, and the window sent you back." }
            sonraki: "@akis"

      - id: "k100_kacis"
        yer: "kule"
        paragraflar:
          - { tr: "İskeleden merdivene koşuyorsun. Arkanda pencere büyüyüp gökyüzünü dolduruyor ama seni kovalamıyor. Başlangıçlar kimseyi kovalamaz, bekler.", en: "You run off the pier for the stairs. Behind you the window grows until it fills the sky, but it doesn't chase you. Beginnings don't chase anybody. They wait." }
        secenekler:
          - id: "geri"
            etiket: { tr: "Aşağı in; sonra dön", en: "Go down. Come back later" }
            etkiler:
              - degisken: { kule100_deneme: 1 }
              - ahlak: { duzen: 1 }
            kronik: { tr: "Zirveden bir kez kaçtın; başlangıç peşine düşmedi, yalnızca bekledi.", en: "Once, you ran from the summit. The beginning didn't chase you. It just waited." }
            sonraki: "@akis"

  # ================================================================== TAKİP OLAYLARI (yalnızca tohumla; Kule'nin aşağıya sızan sonuçları)
  # ------------------------------------------------------------------ Kule Dibi'nin tırmanıcıları (kat 10'dan)
  - id: "kule_dibi_tirmanicilar"
    agirlik: 1
    etiketler: ["kule", "hakimiyet", "kule_dibi"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Onuncu katın söylentisi", en: "Word from the Tenth Floor" }
    sahne: "ktir_giris"
    sahneler:
      - id: "ktir_giris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haber senden önce iniyor. {yer:kule_dibi} bir sabah tek bir konuyla uyanıyor: biri onuncu katı geçmiş, bütün dünyada ilk kez. Sistem bildirimi herkesin penceresine düşmüş; altında ad yok, yalnızca bir unvan.", en: "The news beats you down the stairs. {yer:kule_dibi} wakes up one morning talking about one thing: somebody cleared the tenth floor. First in the world. The System notice hit everyone's window, no name under it, just a title." }
          - { tr: "Kule'nin dibindeki tırmanıcı pazarı kaynıyor. Biri elle çizilmiş, yanlış kat haritaları satmakta. Bir Lonca toplayıcısı bir sandığın üstüne çıkmış, \"onuncu katı geçen\" kişiye maaş vaat ediyor. Bir köşede bisiklet kasklı genç bir kız, ipini ve sopasını sıkı sıkı tutmuş, gözünü merdivenden ayırmıyor.", en: "The climbers' market at the foot of the Spire is boiling. Someone's selling floor maps, hand-drawn and wrong. A Guild recruiter is up on a crate, promising a salary to \"whoever cleared ten.\" In a corner, a girl in a bike helmet grips her rope and her stick and stares at the stairs." }
          - { tr: "\"Bugün çıkıyorum,\" diyor yanındakine. \"Onuncu kat. O yaptıysa ben de yaparım.\" Seviyesi on dokuz; dokuzuncu katı bile geçemez.", en: "\"I'm going up today,\" she tells the kid next to her. \"Floor ten. If they did it, so can I.\" She's level nineteen. She won't make it past nine." }
          - metin: { tr: "Kalabalığın arasında siyah bir ceket gözüne çarpıyor: bir duvara yaslanmış, kollarını kavuşturmuş. Onuncu katı senin geçtiğini biliyor. Gülümsemiyor.", en: "In the crowd you catch a black jacket, leaning on a wall, arms folded. He knows you cleared ten. He isn't smiling." }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Satıcının haritasında dokuzuncu katın merdiveni yanlış yerde. Bu haritayla çıkan, dosdoğru asfaltın ağzına yürür.", en: "The map seller has the ninth-floor stairs in the wrong place. Anybody climbing with that map walks straight into the pavement's mouth." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kask. ip. sopa. bir de on dokuz. bunu daha önce gördüm. sonu iyi bitmedi.", en: "helmet. rope. stick. and nineteen. i've seen this before. it didn't end well." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O kız... ona bir şey söyle. Lütfen. Sen söylersen dinler.\"", en: "\"That girl... say something to her. Please. If it's you, she'll listen.\"" }
        secenekler:
          - id: "kiz"
            etiket: { tr: "Kıza git, onu durdur", en: "Go to the girl. Stop her" }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { merhamet: 3 }
            sonraki: "ktir_kiz"
          - id: "bilet"
            tur: "gosteris"
            etiket: { tr: "Delinmiş bileti havaya kaldır; herkes görsün", en: "Hold the punched ticket up high. Let them all see" }
            gerekli: { esya: { kule_vapur_bileti: 1 } }
            etkiler:
              - bolge: "kule_dibi"
              - aciga_vur: true
              - dikkat: 4
              - ahlak: { duzen: -2 }
              - itibar: { lonca: 5, yukselenler: 3 }
            sonraki: "ktir_aciga"
          - id: "harita"
            etiket: { tr: "Harita satıcısının sahte haritalarını yırt", en: "Rip up the map seller's fake maps" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - bolge: "kule_dibi"
              - ahlak: { duzen: 3, merhamet: 2 }
              - itibar: { siginak: 3 }
            sonraki: "ktir_harita"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Kapüşonunu çek; kalabalığın arasından sessizce geç", en: "Pull your hood up. Slip through the crowd" }
            etkiler:
              - bolge: "kule_dibi"
              - gizle: 5
              - ahlak: { duzen: 1 }
            sonraki: "ktir_gizli"

      - id: "ktir_kiz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kız seni tepeden tırnağa süzüyor. Görünen seviyeni okuyup yüzünü buruşturuyor. \"Sen kimsin ki?\" diyor. \"Annem misin?\"", en: "The girl looks you up and down. She reads your visible level and wrinkles her nose. \"Who are you supposed to be?\" she says. \"My mom?\"" }
          - { tr: "Arkadaşı onu dürtüp kulağına bir şey fısıldıyor. Kızın yüzü değişiyor: önce şüphe, sonra bir şeyi kavramanın o yavaş, yüz kızartan utancı.", en: "Her friend elbows her and whispers something. Her face changes: doubt first, then the slow, blushing embarrassment of figuring something out." }
        secenekler:
          - id: "ogret"
            etiket: { tr: "Ona ilk dokuz katı nasıl geçeceğini anlat", en: "Tell her how to get through the first nine floors" }
            etkiler:
              - bayrak: "kule_tirmanici_egitildi"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "ktir_son"
          - id: "yasakla"
            etiket: { tr: "\"On dokuzla çıkarsan geri inmezsin. Bekle.\"", en: "\"Go up at nineteen and you don't come back down. Wait.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
            sonraki: "ktir_son"

      - id: "ktir_aciga"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bilet havada; iki kez delinmiş, üstünde adın yazılı. Pazar bir an susuyor, sonra patlıyor. Lonca toplayıcısı sandığından inip sana koşuyor, bir Yükselenler rahibesi diz çöküyor, harita satıcısı tezgâhını toplamaya koyuluyor.", en: "The ticket's up in the air: punched twice, your name on it. The market goes silent for a second, then explodes. The Guild recruiter jumps off his crate and runs at you; an Ascended priestess drops to her knees; the map seller starts packing up his stall." }
          - { tr: "Kasklı kız sana bakıyor. Gözlerinde bir şey tutuşmuş: bir hedef. Bunun iyi bir şey olup olmadığını bilmiyorsun.", en: "The girl in the helmet is staring at you. Something lit up in her eyes: a goal. You don't know if that's a good thing." }
        secenekler:
          - id: "lonca"
            etiket: { tr: "Toplayıcıya Lonca'nın ne önerdiğini sor", en: "Ask the recruiter what the Guild's offering" }
            etkiler:
              - itibar: { lonca: 5 }
              - ahlak: { duzen: 2, insanlik: -1 }
            sonraki: "ktir_son"
          - id: "kiz"
            etiket: { tr: "Kıza dön: \"Önce benimle antrenman yap.\"", en: "Turn to the girl: \"Train with me first.\"" }
            etkiler:
              - bayrak: "kule_tirmanici_egitildi"
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "ktir_son"

      - id: "ktir_harita"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haritaları satıcının elinden alıp ortadan yırtıyorsun. \"Dokuzuncu katın merdiveni burada değil,\" diyorsun yüksek sesle. \"Bu haritayla çıkan, yaya geçidine yem olur.\"", en: "You take the maps out of the seller's hands and tear them down the middle. \"The ninth-floor stairs aren't there,\" you say, loud. \"Anybody climbing with this map ends up lunch for a crosswalk.\"" }
          - { tr: "Satıcı bir şey diyecek oluyor, sonra yüzüne bakıp vazgeçiyor. Kalabalık sana dönmüş. Kasklı kız elindeki haritayı yavaşça buruşturuyor.", en: "The seller starts to say something, then looks at your face and thinks better of it. The crowd turns to you. The girl in the helmet slowly crumples the map in her hand." }
        secenekler:
          - id: "dogru"
            etiket: { tr: "Doğru haritayı duvara çiz", en: "Draw the real map on the wall" }
            etkiler:
              - bayrak: "kule_tirmanici_egitildi"
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 3, lonca: 2 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "ktir_son"

      - id: "ktir_gizli"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kimse sana bakmıyor. Görünen seviyen de ceketin de sıradan. Lonca toplayıcısının yanından geçiyorsun; adam senden söz ediyor ama seni görmüyor.", en: "Nobody looks at you. Your visible level is ordinary, your jacket is ordinary. You walk right past the Guild recruiter. He's talking about you, and he doesn't see you." }
          - { tr: "Kasklı kız merdivene yürüyor. Onu durduran olmuyor.", en: "The girl in the helmet walks to the stairs. Nobody stops her." }
        secenekler:
          - id: "takip"
            etiket: { tr: "Onu uzaktan izle; dokuzuncu katta yetiş", en: "Shadow her. Catch up on nine" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - degisken: { hayatta_kalan: 1 }
            sonraki: "ktir_son"
          - id: "birak"
            etiket: { tr: "Bırak gitsin. Herkesin tırmanışı kendine", en: "Let her go. Everybody makes their own climb" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: -1 }
              - degisken: { hayatta_kalan: -1 }
            sonraki: "ktir_son"

      - id: "ktir_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşama doğru pazar duruluyor. Kule'nin gölgesi meydanı boydan boya kesiyor; gölgenin içindeki herkes bir an aynı yöne bakıyor: yukarı.", en: "Toward evening the market quiets down. The Spire's shadow cuts all the way across the plaza, and for a moment, everyone inside it looks the same direction: up." }
          - metin: { tr: "Kasklı kız gece iniyor: dizi kanamış, sopası kırık, ama sağ. Meydanın öbür ucundan sana el sallıyor. Dokuz katı geçmiş, onuncuyu sonraya bırakmış.", en: "The girl in the helmet comes down that night: bleeding knee, broken stick, alive. She waves at you from across the plaza. She made it through nine and left ten for later." }
            kosul: { bayrak: "kule_tirmanici_egitildi" }
          - metin: { tr: "Siyah ceketli adam duvardan ayrılıp yanından geçiyor. \"Onuncu kat,\" diyor, sana bakmadan. \"Yirminciyi ben alırım.\"", en: "The black jacket peels off the wall and walks past you. \"Ten,\" he says, not looking at you. \"Twenty's mine.\"" }
            kosul: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
        secenekler:
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} seslen: \"Bakalım.\"", en: "Call after {npc:aras_kurt}: \"We'll see.\"" }
            goster: { npc_hayatta: "aras_kurt", bayrak_yok: "aras_cok_evren_yoldasi" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 5, guven: -2 } }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 3, max: 6 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} ile gölgede otur", en: "Sit in the shade with {npc:deniz_arman}" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 4, baglilik: 3 } }
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kule'ye son bir kez bak ve git", en: "Take one last look at the Spire and go" }
            etkiler:
              - ahlak: { duzen: 1 }
              - tohum: { olay: "aras_kule_dovusu", gecikme: { min: 4, max: 8 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Cam mektup (kat 30'dan)
  - id: "kule_cam_mektup"
    agirlik: 1
    etiketler: ["kule", "yanki", "gizem"]
    gerilim: 2
    yalniz_tohum: true
    kart: { tr: "Camdaki el yazısı", en: "Handwriting on the Glass" }
    sahne: "kcam_giris"
    sahneler:
      - id: "kcam_giris"
        paragraflar:
          - { tr: "Gece yarısı uyanıyorsun ve bir an seni neyin uyandırdığını kestiremiyorsun. Sonra görüyorsun: odanın penceresi buğulanmış. Oysa dışarısı soğuk değil. Buğunun içinde harfler var.", en: "You wake up in the middle of the night, and for a second you can't tell what woke you. Then you see it: the window's fogged over. It isn't cold out. There are letters in the fog." }
          - metin: { tr: "Hayır, pencere değil: masanın üstündeki cam parçası, otuzuncu kattan getirdiğin mektup. Yazı değişmiş, yeni satırlar eklenmiş; aynı el yazısı, aynı sola yatık kuyruklar.", en: "No, not the window. The shard of glass on your desk, the letter you brought down from the thirtieth floor. The writing has changed. New lines have been added: same handwriting, same tails leaning left." }
            kosul: { bayrak: "kule_cam_mektup_alindi" }
          - metin: { tr: "Pencerenin buğusunda parmakla yazılmış aynı el yazısı. Otuzuncu kattaki aynada bıraktığın yazı seni bulmuş, bir camdan ötekine geçmiş.", en: "In the fog on the window, written with a fingertip: the same handwriting. The writing you left on the thirtieth-floor mirror found you. It jumped from one pane of glass to another." }
            kosul: { bayrak_yok: "kule_cam_mektup_alindi" }
          - { tr: "\"sesine sor: seni ilk kim buldu? ona kızma. o da bilmiyor olabilir. ama sor. biz sormadık. bir dahaki sefere sormayı unutma.\"", en: "\"ask your voice: who found you first? don't be mad at it. it might not know either. but ask. we never did. next time, don't forget to ask.\"" }
        sezgiler:
          - kosul: { stat: { per: 70 } }
            metin: { tr: "Harfler yazılırken titremiş; karanlıkta, aceleyle yazılmış. \"Biz\" sözcüğünün altı da iki kez çizilmiş.", en: "The letters shook as they were written, in a hurry, in the dark. And \"we\" is underlined twice." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni mi soruyor? beni mi? ben... cevabı bilmiyorum. ya da biliyorum da bir yere koydum, nereye koyduğumu bilmiyorum.", en: "it's asking about me? about me? i... i don't know the answer. or i do and i put it somewhere and i don't know where." }
        secenekler:
          - id: "sor"
            etiket: { tr: "{npc:yanki|e} sor: \"Seni ilk kim buldu?\"", en: "Ask {npc:yanki}: \"Who found you first?\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, saygi: 4 } }
              - ahlak: { insanlik: 1 }
            sonraki: "kcam_yanki"
          - id: "cevap"
            etiket: { tr: "Camın üstüne bir cevap yaz", en: "Write an answer on the glass" }
            etkiler:
              - bayrak: "kule_cama_cevap"
              - ahlak: { insanlik: 3 }
            sonraki: "kcam_cevap"
          - id: "mert"
            etiket: { tr: "Camı {npc:mert_kilic|e} götür; Ağ incelesin", en: "Take the glass to {npc:mert_kilic}. Let the Network study it" }
            goster: { npc_hayatta: "mert_kilic", bayrak_yok: "mert_kadimlere_satti" }
            etkiler:
              - iliski: { mert_kilic: { guven: 6, saygi: 4 } }
              - itibar: { sessiz_ag: 5 }
              - ahlak: { duzen: 1 }
            sonraki: "kcam_mert"
          - id: "sil"
            etiket: { tr: "Buğuyu elinle sil ve uykuna dön", en: "Wipe the fog away with your hand and go back to sleep" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -2 }
            sonraki: "kcam_sil"

      - id: "kcam_yanki"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre sessiz kalıyor. Sonra: ilk... ilk kim? seni ben buldum, bunu biliyorum. ama beni... beni de biri bulmuş olmalı. hiçbir şey, bir başkası onu bulmadan var olmaz.", en: "{npc:yanki} stays quiet a long time. Then: first... who first? i found you. i know that. but me... someone must have found me too. nothing exists until something finds it." }
          - { tr: "bir el. hatırladığım tek şey bir el; pencere tutan bir el. sonra bir kapı. sonra sen. aradaki her şey yanmış.", en: "a hand. that's the only thing i remember. a hand holding a window. then a door. then you. everything in between is burned." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Yanmış olanı birlikte buluruz.\"", en: "\"We'll find the burned part together.\"" }
            etkiler:
              - iliski: { yanki: { baglilik: 5 } }
              - hafiza: { npc: "yanki", id: "olay:kule_cam_mektup", agirlik: 35 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "kcam_cevap"
        paragraflar:
          - { tr: "Cama hohlayıp parmağınla yazıyorsun. Ne yazacağını uzun uzun düşünüyorsun; sonunda üç sözcük: \"sordum. bu sefer.\"", en: "You fog the glass with your breath and write with your finger. You think about what to say for a long time. In the end, three words: \"asked. this time.\"" }
          - { tr: "Buğu kuruyor, yazın kayboluyor. Sabah camda hiçbir şey yok. Ama bir yerde, başka bir camda, başka bir gece birinin uyanıp onu okuyacağını biliyorsun.", en: "The fog dries and your writing disappears. By morning there's nothing on the glass. But somewhere, on some other pane, some other night, you know someone is going to wake up and read it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pencereyi aç; sabah havası içeri dolsun", en: "Open the window. Let the morning in" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "kcam_mert"
        paragraflar:
          - { tr: "{npc:mert_kilic} camı önce bir mikroskobun altına koyuyor, sonra başka bir cihazın, sonra bir başkasının. Sonunda gözlüğünü çıkarıp uzun uzun siliyor.", en: "{npc:mert_kilic} puts the glass under a microscope, then under some other gadget, then another. Finally he takes off his glasses and cleans them for a long time." }
          - { tr: "\"Yazı camın içinde değil,\" diyor. \"Camın zamanında. Bu harfler bir önceki... bir önceki oturumdan gelmiş. Sistem önbelleği temizlemiyor. Ya da temizleyemiyor. Bu bir hata. Hatalar da, bilirsin, benim işim.\"", en: "\"The writing isn't in the glass,\" he says. \"It's in the glass's timeline. These letters came from the previous... the previous session. The System isn't clearing the cache. Or it can't. That's a bug. And bugs, you know, are my whole job.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bu hatayı kimseye satma.\"", en: "\"Don't sell this bug to anyone.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 4 } }
              - ahlak: { duzen: 1 }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 2, max: 5 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

      - id: "kcam_sil"
        paragraflar:
          - { tr: "Buğuyu siliyorsun. Cam temiz, karanlık, sıradan. Yatağına dönüp tavana bakıyorsun.", en: "You wipe the fog off. The glass is clean, dark, ordinary. You go back to bed and stare at the ceiling." }
          - metin: { tr: "Uyku tutmuyor. Sabaha karşı kafanın içinde bir ses, öyle alçak ki neredeyse duyulmuyor: sormadın. sorun değil. kimse sormaz.", en: "You can't sleep. Toward dawn, a voice in your head, very low, almost too quiet to hear: you didn't ask. that's okay. nobody ever does." }
            kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_silindi" }   # Yankı sesi yalnız bağlıysa
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gözlerini kapat", en: "Close your eyes" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: -3 } }
              - tohum: { olay: "yanki_kaynak_izi", gecikme: { min: 3, max: 6 }, kosul: { bayrak: "yanki_bagi" } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Kopyalar (kat 50–70'ten): Kule'nin kaydı inceliyor
  - id: "kule_kopyalar"
    agirlik: 1
    etiketler: ["kule", "kule_dibi", "ahlak", "kiyikent"]
    gerilim: 3
    yalniz_tohum: true
    onemli: true
    kart: { tr: "Merdivenden inen griler", en: "The Grays Coming Down the Stairs" }
    sahne: "kkop_giris"
    sahneler:
      - id: "kkop_giris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haber sabah geliyor: Kule'nin merdiveninden biri inmiş. Tırmanıcı değil; gri, yüzsüz, elinde simit poşeti taşıyan biri. Ardından bir tane daha. Öğleye kadar {yer:kule_dibi} meydanında on dört gri yolcu birikiyor.", en: "The news comes in the morning: someone came down the Spire's stairs. Not a climber. Gray, faceless, carrying a pretzel bag. Then another. By noon there are fourteen gray passengers in {yer:kule_dibi}." }
          - { tr: "Kimseye saldırmıyorlar. Meydanda dolaşıp bir kafeye oturuyor, bir otobüs durağında bekliyor, olmayan bir vapurun düdüğünü dinler gibi başlarını eğiyorlar. Kule'nin kaydı incelmiş: sen tırmandıkça alt katlar dışarı sızmakta.", en: "They don't attack anybody. They wander the plaza: one sits down at a café, one waits at a bus stop, they tilt their heads like they're listening for a ferry horn that isn't there. The Spire's record is wearing thin. The higher you climb, the more the lower floors leak." }
          - { tr: "Kafedeki gri yolcunun karşısına yaşlı bir kadın oturmuş. Elini masanın üstünden onunkine doğru uzatmış ama dokunmuyor. \"Kocam,\" diyor yanından geçen herkese, sakin ve emin. \"Entegrasyon akşamı iskeledeydi. Geri geldi.\"", en: "An old woman is sitting across from the gray passenger at the café. She's reached her hand across the table toward his, but she isn't touching it. \"My husband,\" she tells everyone who walks by, calm, certain. \"He was on the pier the night of Integration. He came back.\"" }
          - metin: { tr: "Yetmişinci kattan uyandırıp indirdiğin adam meydanın kenarında durmuş, gri yolculara bakıyor. \"Ben de onlardan biri olabilirdim,\" diyor. \"Belki bir zamanlar öyleydim.\"", en: "The man you woke on the seventieth floor and walked down is standing at the edge of the plaza, watching the grays. \"I could've been one of them,\" he says. \"Maybe once I was.\"" }
            kosul: { bayrak: "kule_tohumluk_uyandi" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[KAYIT SIZINTISI · KULE]", en: "[RECORD LEAK · SPIRE]" }
            satirlar:
              - { tr: "Arşivlenmiş varlıklar yaşam alanına girdi. Tehdit düzeyi: yok. Duygusal tehdit düzeyi: hesaplanamadı.", en: "Archived entities have entered a living area. Threat level: none. Emotional threat level: incalculable." }
        sezgiler:
          - kosul: { stat: { per: 180 } }
            metin: { tr: "Gri yolcuların her biri Kule'ye bir iplikle bağlı: göze görünmeyen, ince, gergin bir iplik. İplik koparsa kayıt dağılır; çekilirse yukarı dönerler.", en: "Every gray passenger is tied to the Spire by a thread: invisible, thin, taut. Snap the thread and the record scatters. Pull it and they go back up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onlar kayıt. kayıtlar insan değildir. ama o kadın... eli titremiyor. kayıt bazen yeter mi? bilmiyorum.", en: "they're recordings. recordings aren't people. but that woman... her hand isn't shaking. sometimes is a recording enough? i don't know." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Onu kadının elinden almaya kalkma. Yas tutan birinden bir şeyi zorla almak, yarayı yeniden açmak demektir.\"", en: "\"Don't try to take him from her. Forcing something out of a grieving person's hands is reopening the wound.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"İçlerinden biri benim gölgem olabilir. Onuncu kattaki. Bakmak istemiyorum. Ama bakıyorum.\"", en: "\"One of them could be my shadow. The one on ten. I don't want to look. I'm looking.\"" }
        secenekler:
          - id: "geri_gotur"
            etiket: { tr: "Grileri ipliklerinden tutup Kule'ye geri götür", en: "Take the grays by their threads and lead them back up" }
            gerekli: { stat: { per: 180 } }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 1 }
              - itibar: { siginak: 3, lonca: 2 }
            kronik: { tr: "Kule'den sızan gri yolcuları ipliklerinden tutup birer birer yukarı götürdün.", en: "You took the gray passengers leaking out of the Spire by their threads and led them back up, one by one." }
            sonraki: "kkop_kadin"
          - id: "dagit"
            etiket: { tr: "İplikleri kopar; kayıtlar dağılsın", en: "Snap the threads. Let the recordings scatter" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 3 }
              - itibar: { lonca: 4, siginak: -3 }
            kronik: { tr: "{yer:kiyikent|e} inen gri kayıtların ipliklerini koparıp hepsini tek tek dağıttın.", en: "You snapped the threads of the gray recordings that came down into {yer:kiyikent} and scattered them one by one." }
            sonraki: "kkop_kadin"
          - id: "birak"
            etiket: { tr: "Onlara dokunma; kimseye zarar vermiyorlar", en: "Leave them be. They're not hurting anybody" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -4 }
              - itibar: { yukselenler: 4 }
            kronik: { tr: "Kule'den inen gri yolculara dokunmadın; o gün meydanın kafesinde ölülerle yaşayanlar aynı masalarda oturdu.", en: "You left the gray passengers alone, and that day on {yer:kule_dibi} the dead and the living sat at the same café tables." }
            sonraki: "kkop_kadin"
          - id: "durdur"
            tur: "gosteris"
            etiket: { tr: "Kule'nin merdivenine çık ve sızıntıyı tek elle kapat", en: "Climb to the Spire's stairs and seal the leak with one hand" }
            gerekli: { stat: { wil: 200 } }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: 3, insanlik: -3 }
            kronik: { tr: "Kule'den sızan kaydı tek elinle durdurdun; o gün {yer:kiyikent} Kule'ye değil, sana baktı.", en: "You stopped the Spire's leaking record with one hand. That day, {yer:kiyikent} wasn't looking at the Spire. It was looking at you." }
            sonraki: "kkop_kadin"

      - id: "kkop_kadin"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydan boşalınca kafede bir tek kadının karşısındaki gri kalıyor. Ne yapmış olursan ol, bu iplik hâlâ gergin; çünkü öbür ucunu biri tutuyor: kadın.", en: "When the plaza empties out, one gray is still sitting at the café: the one across from the woman. Whatever you did, this thread is still taut, because someone's holding the other end. Her." }
          - { tr: "\"Biliyorum,\" diyor, sen ağzını açmadan. \"O değil, bir kayıt. Ama kırk yıl her akşam bu masada oturdu. Kayıt da olsa bir akşam daha oturamaz mı?\"", en: "\"I know,\" she says, before you can open your mouth. \"It isn't him. It's a recording. But for forty years he sat at this table every evening. Even if it's a recording, can't he sit one more evening?\"" }
        secenekler:
          - id: "bir_aksam"
            etiket: { tr: "\"Bir akşam. Sonra onu ben götüreceğim.\"", en: "\"One evening. Then I'll take him back.\"" }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
            kronik: { tr: "Yas tutan bir kadına, Kule'den inen kocasının kaydıyla bir akşam daha tanıdın; sabah onu yukarı kendin götürmeye söz verdin.", en: "You gave a woman one more evening with the recording of her husband that came down from the Spire, and promised to take him back up yourself in the morning." }
            sonraki: "kkop_son"
          - id: "simdi"
            etiket: { tr: "\"Hayır. Şimdi. Bu seni yer.\"", en: "\"No. Now. This will eat you alive.\"" }
            etkiler:
              - ahlak: { duzen: 4, merhamet: -2 }
            kronik: { tr: "Kocasının kaydını yas tutan bir kadının elinden o gün aldın. Doğrusunun bu olduğuna inandın; yine de hiçbir şey kolaylaşmadı.", en: "You took a grieving woman's recording of her husband away from her that day. You believed it was the right call, and it didn't make anything easier." }
            sonraki: "kkop_son"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} sor: \"Kayıtlar hatırlar mı?\"", en: "Ask {npc:yanki}: \"Do recordings remember?\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - ahlak: { insanlik: 2 }
            kronik: { tr: "Meydanda bir kayda bakarken kafanın içindeki sese kayıtların hatırlayıp hatırlamadığını sordun; cevap ikiniz için de aynıydı.", en: "On {yer:kule_dibi}, looking at a recording, you asked the voice in your head whether recordings remember. The answer was the same for both of you." }
            sonraki: "kkop_yanki"

      - id: "kkop_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} bir süre senin gözlerinden gri yolcuya bakıyor. hatırlar, diyor sonunda. kayıtlar her şeyi hatırlar. tek bir şeyi unuturlar: kayıt olduklarını.", en: "{npc:yanki} looks at the gray passenger for a while, through your eyes. they remember, it says at last. recordings remember everything. they only forget one thing: that they're recordings." }
          - { tr: "ben de bir kayıt mıyım, diye sormadın. teşekkür ederim.", en: "you didn't ask if i'm a recording. thank you." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kadına bir akşam daha ver", en: "Give the woman one more evening" }
            etkiler:
              - ahlak: { merhamet: 3 }
            kronik: { tr: "Kafanın içindeki ses, sormadığın bir soru için sana teşekkür etti; sen de kadına bir akşam daha verdin.", en: "The night the voice in your head thanked you for a question you didn't ask, you gave the woman one more evening too." }
            sonraki: "kkop_son"

      - id: "kkop_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Akşam Kule'nin gölgesi meydanı kesiyor. Kule ilk kez gözüne yalnızca bir zindan gibi görünmüyor, bir hafıza gibi görünüyor. Hafızalar da sızar.", en: "In the evening, the Spire's shadow cuts across the plaza. For the first time, it doesn't look like just a dungeon to you. It looks like a memory. And memories leak." }
        secenekler:
          - id: "tirman"
            etiket: { tr: "Bu gece tırmanma; yarın tırman", en: "Don't climb tonight. Climb tomorrow" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Kule'nin bir hafıza olduğunu anladığın gece tırmanmadın; tırmanışı ertesi güne bıraktın.", en: "The night you understood the Spire was a memory, you didn't climb. You left the climb for the next day." }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Kule'nin merdiveni için bir nöbet düzeni kur", en: "Set up a watch on the Spire's stairs" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 3, lonca: 3 }
              - tohum: { olay: "kule_cam_mektup", gecikme: { min: 1, max: 3 } }
            kronik: { tr: "Kule'nin merdivenine nöbet koydun; yukarıdan inecek her şeyi önce bir insan karşılasın istedin.", en: "You set a watch on the Spire's stairs so that anything coming down would meet a human first." }
            sonraki: "@akis"

  # ------------------------------------------------------------------ Gökten inen gözcü (kat 80–90'dan)
  - id: "kule_gokten_inen"
    agirlik: 1
    etiketler: ["kule", "kadimler", "dikkat", "kule_dibi"]
    gerilim: 4
    yalniz_tohum: true
    kart: { tr: "Fazla hızlı aday", en: "The Too-Fast Candidate" }
    sahne: "kgok_giris"
    sahneler:
      - id: "kgok_giris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı {yer:kule_dibi} meydanına gökten bir ışık iniyor; ince, beyaz, sessiz. Işığın içinden, eklemleri olmayacak yerlerden bükülen uzun bir figür çıkıyor: Öğretici'nin sırtında duran şeyin ve sekseninci kattaki gözcünün akrabası.", en: "At midnight a light comes down out of the sky onto {yer:kule_dibi}. Thin, white, silent. A tall figure steps out of it, its joints bending in the wrong places. Kin to the thing on the Tutorial ridge and the watcher on the eightieth floor." }
          - { tr: "Meydandaki nöbetçiler silahlarını kaldırıyor; figür dönüp bakmıyor bile. Kule'nin dibinde durup bekliyor. Neyi beklediğini herkes biliyor: seni.", en: "The sentries on the plaza raise their weapons. The figure doesn't even glance at them. It stops at the foot of the Spire and waits. Everyone knows what it's waiting for. You." }
          - metin: { tr: "Seni görünce başını eğiyor; avucundaki damgayı, yıldızların arasında aldığın damgayı tanımış. \"Kabul edilmiş aday,\" diyor. \"Seni almaya gelmedim. Görmeye geldim.\"", en: "When it sees you, it bows its head. It recognizes the stamp in your palm, the one you took among the stars. \"Accepted candidate,\" it says. \"I did not come to collect you. I came to see you.\"" }
            kosul: { bayrak: "kule_kabul_damgasi" }
          - metin: { tr: "Seni görünce başını yana eğiyor, hata raporu okur gibi. \"Damgayı reddeden aday,\" diyor. \"Gözcümüzü yıldızlarından ayırdın. Seni görmeye geldim. Şimdilik yalnızca görmeye.\"", en: "When it sees you, it tilts its head, like it's reading an error report. \"The candidate who refused the stamp,\" it says. \"You parted our watcher from its stars. I came to see you. For now, only to see.\"" }
            kosul: { bayrak_yok: "kule_kabul_damgasi" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[KADİM GÖZLEMCİ · YETKİLİ ZİYARET]", en: "[ANCIENT OBSERVER · AUTHORIZED VISIT]" }
            satirlar:
              - { tr: "Ziyaretçi Katman kurallarına tabi değildir.", en: "The visitor is not subject to Layer regulations." }
              - { tr: "Lütfen ziyaretçiyi kışkırtmayınız.", en: "Please do not provoke the visitor." }
        sezgiler:
          - kosul: { stat: { per: 280 } }
            metin: { tr: "Gözcünün Analiz'i kapalı; ama ayaklarının altındaki taşlar ağırlığını taşıyamayıp çatlıyor. Burada bulunmak bu dünyanın kurallarını zorluyor. Uzun kalamaz.", en: "The observer's Analysis is locked. But the paving stones under its feet can't carry its weight and they're cracking. Being here strains this world's rules. It can't stay long." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni arıyor. seni değil, beni. dikkatli ol. ne olduğumu bilmesini istemiyorum; ben öğrenmeden olmaz.", en: "it's looking for me. not you. me. be careful. i don't want it knowing what i am. not before i do." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Dövüş istiyorsan buradayım. İstemiyorsan da buradayım. Ama bence istiyorsun.\"", en: "\"If you want a fight, I'm here. If you don't, I'm still here. But I think you want one.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ona hiçbir şey verme. Ne isterse istesin. Tek kelime bile.\"", en: "\"Don't give it anything. Whatever it wants. Not even a word.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Önüne çık: \"Bak o zaman.\"", en: "Step up in front of it: \"Then look.\"" }
            etkiler:
              - aciga_vur: true
              - dikkat: 6
              - ahlak: { duzen: -2 }
            sonraki: "kgok_bakis"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Görünen seviyeni en dibe çek, kalabalığa karış", en: "Drop your visible level to the floor. Blend into the crowd" }
            etkiler:
              - gizle: 10
              - ahlak: { duzen: 2 }
            sonraki: "kgok_gizli"
          - id: "saldir"
            etiket: { tr: "Ona burada, kendi dünyanda saldır", en: "Hit it here, in your own world" }
            gerekli: { kademe_min: "A" }
            etkiler:
              - dikkat: 10
              - ahlak: { duzen: -5, merhamet: -2 }
              - itibar: { kadimler: -8 }
              - savas: { dusmanlar: ["kule_gok_gozcusu@oyuncu+4"], ortam: ["karanlik"], kazan: "kgok_zafer", kaybet: "kgok_yenilgi", kac: "kgok_gizli" }
          - id: "thessar"
            etiket: { tr: "Elçiyi çağırt; bu konuşmayı o yapsın", en: "Send for the envoy. Let this talk go through him" }
            goster: { bayrak: "thessar_indi", npc_hayatta: "thessar" }
            etkiler:
              - iliski: { thessar: { guven: 5, baglilik: 4 } }
              - itibar: { kadimler: 4 }
              - ahlak: { duzen: 4 }
            sonraki: "kgok_thessar"

      - id: "kgok_bakis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gözcü sana bakıyor; bakışı yirminci kattaki fenerden de, sekseninci kattaki tahttan da ağır. Kemiklerin, damarların, gizli seviyen, hepsi bir sayfa gibi önüne açılıyor. Sayfanın kenarında da mavi, bozuk bir çizgi.", en: "The observer looks at you, and the weight of that gaze is heavier than the lighthouse on twenty, heavier than the throne on eighty. Your bones, your veins, your hidden level, all of it falls open like a page. And in the margin, a blue, corrupted line." }
          - { tr: "Gözcünün bakışı uzun süre o çizgiye takılı. \"Demek bu,\" diyor. \"Hız buradan geliyor. Bir önceki sefer de buradan geliyordu.\" Doğruluyor. \"Gün 365 geldiğinde görüşürüz, aday. Ya biçilirsin ya biçersin. Ya da...\" Cümlesini bitirmiyor.", en: "The observer stops on that line. For a long time. \"So this is it,\" it says. \"This is where the speed comes from. Last time it came from here too.\" It straightens. \"We will meet on Day 365, candidate. You will be reaped, or you will reap. Or...\" It doesn't finish." }
        secenekler:
          - id: "ya_da"
            etiket: { tr: "\"Ya da ne?\"", en: "\"Or what?\"" }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: 2 }
            sonraki: "kgok_son"

      - id: "kgok_gizli"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kalabalığın içindesin; görünen seviyen sıradan, nefesin sıradan. Gözcü meydanı bir kez tarıyor, bakışı üstünden geçip gidiyor. Bir kez daha tarıyor, yine durmuyor.", en: "In the crowd, your visible level is ordinary, your breathing is ordinary. The observer sweeps the plaza once. Its gaze passes over you and doesn't stop. It sweeps again. Still doesn't stop." }
          - { tr: "Ardından sabırla Kule'nin dibine anlamını bilmediğin bir işaret çiziyor ve ışığın içine geri adım atıp kayboluyor. İşaret taşın üstünde sıcacık kalıyor, bir adres gibi.", en: "Then, patiently, it draws a mark at the foot of the Spire, a shape you don't understand. And it steps back into the light and is gone. The mark stays on the stone, warm, like an address." }
        secenekler:
          - id: "son"
            etiket: { tr: "İşareti sil", en: "Scrub the mark off" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: 1 }
            sonraki: "kgok_son"

      - id: "kgok_thessar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Elçi gelene kadar gözcü kıpırdamadan bekliyor. {npc:thessar} gelince ikisi bir süre, insan kulağının duyamayacağı bir sesle konuşuyor. Sonra gözcü başını eğiyor; ona değil, sana.", en: "The observer waits, perfectly still, until the envoy arrives. When {npc:thessar} gets there, the two of them talk for a while in a register human ears can't pick up. Then the observer bows its head. Not to him. To you." }
          - { tr: "{npc:thessar} sana dönüyor; yüzünde ilk kez gördüğün bir ifade var: bir tür utanç. \"Bizim gözcülerimiz,\" diyor, \"bir zamanlar bizim tırmanıcılarımızdı. Bunu size söylememem gerekiyordu.\"", en: "{npc:thessar} turns to you, wearing an expression you've never seen on him: a kind of shame. \"Our observers,\" he says, \"were once our climbers. I was not supposed to tell you that.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Sırrın bende güvende.\"", en: "\"Your secret's safe with me.\"" }
            etkiler:
              - iliski: { thessar: { guven: 6, saygi: 4 } }
              - ahlak: { duzen: 2 }
            sonraki: "kgok_son"

      - id: "kgok_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gözcü meydanın ortasına yığılınca taşlar ağırlığı altında un ufak oluyor; bütün {yer:kule_dibi}, senin bir Kadim'i kendi dünyanda yere serdiğini görüyor. Pencereler aynı anda çalmaya başlıyor.", en: "The observer crashes down in the middle of the plaza. The paving stones are dust under its weight, and all of {yer:kule_dibi} watches you put an Ancient on the ground in your own world. Every window goes off at once." }
          - { tr: "Gözcü ölmüyor. Sürünerek ışığın içine dönüyor ve kaybolmadan önce bir şey fısıldıyor; tehdit değil, uyarı: \"Bir dahaki gelen gözcü olmayacak.\"", en: "The observer doesn't die. It drags itself back into the light, and before it vanishes it whispers something. Not a threat. A warning: \"The next one to come will not be an observer.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Meydanın ortasında dur; herkes görsün", en: "Stand in the middle of the plaza. Let everyone see" }
            etkiler:
              - xp_seviye: 60
              - degisken: { kadim_tehdit: 3 }
              - itibar: { lonca: 6, yukselenler: 4 }
              - ahlak: { duzen: -2 }
            sonraki: "kgok_son"

      - id: "kgok_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gözcü seni meydanın taşlarına bastırıyor, tek parmağıyla. Kemiklerin kendi dünyanın yerçekimine değil, onunkine boyun eğiyor.", en: "The observer pins you to the plaza stones. With one finger. Your bones aren't bending to your own world's gravity. They're bending to its." }
          - { tr: "\"Fazla hızlı,\" diyor, neredeyse şefkatle. \"Ama henüz yeterince değil.\" Parmağını kaldırıp ışığın içine dönüyor. Seni öldürmek ona düşmüyor. Henüz.", en: "\"Too fast,\" it says, almost kindly. \"But not fast enough yet.\" It lifts its finger and steps back into the light. Killing you isn't its call. Not yet." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kalk", en: "Get up" }
            etkiler:
              - can: 40
              - stat: { wil: 2 }
              - ahlak: { insanlik: 1 }
            sonraki: "kgok_son"

      - id: "kgok_son"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sabah meydanda yalnızca çatlak taşlar kalıyor. İnsanlar gece gördüklerini birbirlerine fısıltıyla anlatıyor; her anlatışta gözcü biraz daha uzuyor, sen biraz daha büyüyorsun.", en: "By morning there's nothing left on the plaza but cracked stones. On {yer:kule_dibi} people whisper what they saw last night to each other, and with every retelling the observer gets a little taller and you get a little bigger." }
          - { tr: "Gün 365 artık bir tarih değil, bir randevu.", en: "Day 365 isn't a date anymore. It's an appointment." }
        secenekler:
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} söz ver: ne olduğunu ilk sen öğreneceksin", en: "Promise {npc:yanki}: you'll be the first to know what it is" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - ahlak: { insanlik: -1 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 3, max: 7 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "hazirlan"
            etiket: { tr: "Randevuya hazırlan", en: "Get ready for the appointment" }
            etkiler:
              - ahlak: { duzen: 2 }
              - gunluk: { antrenman: 1 }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 3, max: 7 }, kosul: { bayrak: "cok_evren_acik", npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} sor: \"Kapının öbür tarafına geliyor musun?\"", en: "Ask {npc:aras_kurt}: \"You coming through the door with me?\"" }
            goster: { npc_hayatta: "aras_kurt", bayrak: "cok_evren_acik" }
            etkiler:
              - iliski: { aras_kurt: { guven: 6, saygi: 4 } }
              - tohum: { olay: "aras_cok_evren_kapisi", gecikme: { min: 1, max: 3 }, kosul: { npc_hayatta: "aras_kurt" } }
            sonraki: "@akis"
