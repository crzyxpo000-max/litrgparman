# Bölge olayları · Bölüm 9 "Kadim Gemisi" (gün 151 → 178; DECISIONS #144, hikayesiz gün ölçütü).
# Gemi henüz görünmüyor: bulutların hemen üstünde yedi soluk ışık, her gece biraz daha alçakta (brifing_9, perde2_son).
# Sayılar (bölge olayı / kamp): kule_dibi 6/2, sanayi 1/1, us 3, eski_sehir 1/1, tepe 1, kordon 1. Toplam 17.
# Zincirler (hepsi bu dosyada):
#   bl9_kat_fiyati (havuz) → bl9_kat_son (tohum)
#   bl9_bekci (havuz) → bl9_bekci_iz (tohum)
#   bl9_saat (eski_sehir, havuz) → bl9_isik_olcer (kule_dibi, havuz) → bl9_olcum_konsey (us, tohum) ← bl9_kordon (havuz)
#   bl9_zipkin_ocak (sanayi, havuz) → bl9_zipkin_deneme (kule_dibi, havuz) → bl9_ambar (us, havuz) ← bl9_tepe (havuz)
#   bl9_ambar → bl9_ambar_gece (us, tohum)
# Ara karakterler (düz adlı, tek seferlik): komisyoncu Sinan / Sid, ölçücü Halit Usta / Hal Brandt, saatçi Bedri Bey /
# Mr. Bertram, ustabaşı Nevzat / Foreman Nate, Sevim / Sylvia ve oğlu, balıkçı Cemal Dayı / old Gus ve torunu Barış / Bobby,
# makinist Hayri / Hank. Rıza Reis ve başhemşire Nurhan: events/51_siginak_elif.yaml.
olaylar:
  # ================================================================== KULE DİBİ 1/6 · kat fiyatları
  - id: "bl9_kat_fiyati"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 152, max: 174 }
    kosul: { bolum: 9, bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kesif", "kule", "pazar", "kadim"]
    gerilim: 2
    kart: { tr: "Kırkıncı kattan yer", en: "A spot on forty" }
    sahne: "bl9_kat_fiyati_1"
    sahneler:
      - id: "bl9_kat_fiyati_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin gölgesindeki pazara bu sabah yeni bir tezgâh kurulmuş. Tahtaya tebeşirle kat numaraları yazılmış, her birinin yanında bir fiyat: Kat 12 iki çekirdek, Kat 18 dört, Kat 22 bir ailenin aylık tayın kartı.", en: "There's a new stall in the market in the Spire's shadow this morning. Floor numbers are chalked on a board, a price next to each: Floor 12, two cores. Floor 18, four. Floor 22, a family's ration card for the month." }
          - { tr: "Tezgâhın arkasında ütülü gömleğiyle eski bir emlakçı oturuyor; adı Sinan. \"Gelen ne olursa olsun Kule'ye dokunmaz,\" diye anlatıyor kuyruğa. \"Kule onların. Kimse kendi evini yakmaz. Bu şehrin en güvenli adresi yukarısı.\"", en: "Behind the stall sits a former real estate agent named Sid, in a pressed shirt. \"Whatever's coming, it won't touch the Spire,\" he tells the line. \"The Spire's theirs. Nobody burns down their own house. Up there is the safest address in town.\"" }
          - { tr: "Kuyruğun başında üç kuşak bir aile bekliyor: bastonlu bir nine, avucunda katlanmış tayın kartını sıkan bir baba, babasının bacağına sarılmış altı yaşlarında bir oğlan. Kartı uzatan el titriyor. Komisyoncunun arkasındaki iki eskort o sırada bıçak bileylemekle meşgul.", en: "At the front of the line is a family, three generations of it: a grandmother on a cane, a father squeezing a folded ration card, a boy of about six wrapped around his dad's leg. The hand holding out the card is shaking. The two escorts behind the broker are busy sharpening knives." }
          - metin: { tr: "Kırkıncı kattaki gözcü yerine çıkarken o katların neye benzediğini kendi gözünle gördün. On ikinci kattan sonra merdivenlerde kemikten başka bir şey yok.", en: "You've seen those floors with your own eyes on the way up to your lookout on forty. Past twelve, there's nothing on the stairs but bones." }
            kosul: { bayrak: "hazirlik_gemi_gozcu" }
          - metin: { tr: "Tezgâhın direğinde {fraksiyon:lonca|in} demir halkası asılı. Pazar {fraksiyon:lonca|in} izniyle kuruluyor; demek komisyoncu kirasını ödemiş.", en: "The {fraksiyon:lonca|pos} iron ring hangs on the stall's post. The market runs on Guild permits, so the broker's paid his rent." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Tahtanın en üstüne biri kırmızı kalemle bir satır eklemiş: Bekleyenler yukarıdakileri önce görür.", en: "Someone's added a line across the top of the board in red marker: The Waiting Ones see the ones up high first." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Eskortlardan birinin başının üstünde 9 yazıyor, öbürününkinde 11. On ikinci katın sahanlığında dolaşan kırıntılar bunun iki katı.", en: "One escort's number reads 9, the other's 11. The shards prowling the twelfth-floor landing run about double that." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule onların, doğru. ama kimse evindeki fareleri korumaz.", en: "the spire's theirs, sure. but nobody looks after the mice in their own house." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kule'den inenleri gördüm ben. İnebilenleri yani.\"", en: "\"I've seen the people who come back down from that thing. The ones who make it.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Yirmi iki mi? İki çekirdeğe ben de çıkarırım. Geri indirmek ayrı tarife.\"", en: "\"Twenty-two? I'd take 'em up for two cores. Getting 'em back down is extra.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ninenin bastonuna bak. İlk sahanlıkta kalır o kadın.\"", en: "\"Look at that cane. She won't make the first landing.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sattığı şey kat değil ki. His satıyor, güvende olma hissi. Piyasadaki en pahalı ürün.\"", en: "\"He's not selling floors. He's selling a feeling. Feeling safe. Priciest product on the market.\"" }
        secenekler:
          - id: "ifsa"
            etiket: { tr: "Eskortların seviyesini kuyruğa yüksek sesle oku", en: "Read the escorts' levels out loud to the line" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl9_kat_ifsa"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_ifsa"
          - id: "cek"
            etiket: { tr: "Kartı babanın elinden al, aileyi kuyruktan çek", en: "Take the card from the father. Pull the family out of line" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - bayrak: "bl9_kat_aile_indi"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_cek"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|i} oğlanın yanına gönder", en: "Send {npc:deniz_arman} over to the boy" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
              - bayrak: "bl9_kat_aile_indi"
              - bayrak: "bl9_kat_deniz"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_cek"
          - id: "eslik"
            tur: "gosteris"
            etiket: { tr: "Aileyi yukarı sen çıkar; komisyoncuya tek kuruş yok", en: "Take the family up yourself. The broker gets nothing" }
            etkiler:
              - dikkat: 2
              - ahlak: { merhamet: 1, duzen: -1 }
              - bayrak: "bl9_kat_aile_seninle"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_eslik"
          - id: "pay"
            etiket: { tr: "Komisyoncuya eğil: \"Benim payım ne?\"", en: "Lean on the broker. \"What's my cut?\"" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
              - oz_kristali: 2
              - bayrak: "bl9_kat_pay"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_gitti"
          - id: "karisma"
            tur: "gizle"
            etiket: { tr: "Karışma; herkesin kartı kendi cebinde", en: "Stay out of it. Everybody's card is their own business" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -1 }
              - bayrak: "bl9_kat_karismadi"
              - tohum: { olay: "bl9_kat_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} komisyoncunun tezgâhı o günden beri bir gün bile boş kalmadı.", en: "The broker's stall in {yer:kule_dibi} hasn't been empty a single day since." } }
            sonraki: "bl9_kat_fiyati_gitti"

      - id: "bl9_kat_fiyati_ifsa"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Dokuz,\" diyorsun, sesini pazarın uğultusunun üstüne çıkararak. \"Öbürü on bir. On ikinci katın sahanlığında yirminin altında bir şey dolaşmaz.\" Kuyruk bir anda susuyor; bileği taşı da havada kalıyor.", en: "\"Nine,\" you say, loud enough to carry over the market. \"The other one's eleven. Nothing on the twelfth-floor landing is under twenty.\" The line goes dead quiet. So does the whetstone." }
          - { tr: "Komisyoncu gülümsemesini bozmadan kartları toplamayı sürdürmek istiyor ama baba kendi kartını çoktan geri çekmiş. Yaşlı kadın bastonunu tezgâhın ayağına vurup tükürüyor; arkadaki kuyruk dağılmaya başlıyor.", en: "The broker tries to keep smiling and keep collecting, but the father's already pulled his card back. The grandmother raps her cane on the stall's leg and spits. Behind her, the line starts breaking up." }
          - { tr: "Sinan tahtasını koltuğunun altına alırken sana bakmadan konuşuyor: \"Yarın başka bir kapıda kurarım. Korku bitmez, kardeşim. Benim malım hiç tükenmez.\"", en: "Sid tucks his board under his arm and talks without looking at you. \"I'll set up at another door tomorrow. Fear doesn't run out, pal. My inventory never does.\"" }
        secenekler:
          - id: "tahta"
            etiket: { tr: "Tahtayı elinden alıp ikiye kır", en: "Take the board and snap it in half" }
            etkiler:
              - ahlak: { duzen: -1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "ambar"
            etiket: { tr: "Aileye {yer:kiyikent_liman|in} altındaki ambarları anlat", en: "Tell the family about the storerooms under {yer:kiyikent_liman}" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl9_kat_fiyati_cek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kartı parmaklarının arasından alıyorsun; baba direnmiyor, belki de birinin almasını bekliyordu. \"Annem merdiven çıkamaz,\" diyor, \"ama burada da kalamaz. Evimizin çatısı {yer:kiyikent_liman|de} geçen hafta çöktü.\"", en: "You slip the card out of his fingers. He doesn't fight it. Maybe he was waiting for someone to. \"My mother can't do stairs,\" he says, \"but she can't stay down here either. The roof of our place on {yer:kiyikent_liman} caved in last week.\"" }
          - metin: { tr: "{npc:deniz_arman} çoktan oğlanın önüne çömelmiş, cebinden çıkardığı buruşuk kâğıda bir martı çiziyor. Oğlan babasının bacağını bırakıp kâğıda uzanıyor.", en: "{npc:deniz_arman} is already crouched in front of the boy, drawing a gull on a crumpled scrap of paper. The boy lets go of his dad's leg and reaches for it." }
            kosul: { bayrak: "bl9_kat_deniz" }
          - { tr: "Komisyoncu omuz silkip sıradakine dönüyor. Kuyruk bir aile kısaldı, o kadar; tahtadaki fiyatlar yerli yerinde.", en: "The broker shrugs and turns to the next in line. The line's one family shorter. That's all. The prices on the board haven't moved." }
        secenekler:
          - id: "ambar"
            etiket: { tr: "Onları {yer:kiyikent_liman|in} altındaki ambarlara götür", en: "Walk them to the storerooms under {yer:kiyikent_liman}" }
            etkiler:
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "kart"
            etiket: { tr: "Kartı babaya geri ver: \"Karar sizin, ama yukarısı bu.\"", en: "Hand the card back. \"Your call. But that's what's up there.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl9_kat_fiyati_eslik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Komisyoncu itiraz edecek oluyor, sonra başının üstündeki sayıya bakıp susuyor. Nineyi sırtına alıp Kule'nin kapısından giriyorsun; baba oğlanın elini sıkı sıkı tutmuş, peşinden geliyor.", en: "The broker starts to object, then glances at the number over your head and thinks better of it. You get the grandmother onto your back and head in through the Spire's door, the father right behind you with a death grip on the boy's hand." }
          - { tr: "Nine basamakları yüksek sesle sayıyor; yüz yirmide sesi kısılıyor, iki yüzde susuyor. Altıncı katın sahanlığında körfezi gören bir pencere var. Sahanlığı iki kırıntıdan temizleyip pencerenin önüne bir battaniye seriyorsun.", en: "The grandmother counts the steps out loud. At a hundred and twenty her voice gets thin, and by two hundred she's quit. The sixth-floor landing has a window looking out over the bay. You clear two shards off the landing and spread a blanket under the window." }
          - { tr: "Oğlan burnunu cama dayamış. \"Işıklar bizi buradan da görüyor mu?\" diye soruyor. Gündüz olduğu için ışıklar ortada yok, ama oğlan yine de el sallıyor.", en: "The boy has his nose pressed to the glass. \"Can the lights see us from here?\" he asks. It's daytime and the lights aren't even out, but he waves anyway." }
        secenekler:
          - id: "kal"
            etiket: { tr: "\"Burası yeter. Daha yukarı çıkmayın, söz verin.\"", en: "\"This is far enough. Promise me you won't go higher.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Bir sonraki inişinde onlara su getireceğini söyle", en: "Tell them you'll bring water next time you're down" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_kat_fiyati_gitti"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Komisyoncu kartı alıp avucuna iki kristal sayıyor. \"Ortaklığımıza,\" diyor göz kırparak. \"Senin gibi biri kuyruğun başında durunca müşteri kendiliğinden geliyor.\"", en: "The broker takes the card and counts two crystals into your palm. \"To the partnership,\" he says with a wink. \"Somebody like you standing near the line, the customers just show up.\"" }
            kosul: { bayrak: "bl9_kat_pay" }
          - { tr: "Eskortlar bıçaklarını kınlarına sokup aileyi Kule'nin kapısına doğru yürütüyor. Nine her adımda bastonunu bir taşa vuruyor, baba bir kez bile arkasına bakmıyor.", en: "The escorts sheathe their knives and walk the family to the Spire's door. The grandmother's cane clacks on every stone. The father doesn't look back once." }
          - { tr: "Kapıdan girmeden oğlan dönüp sana el sallıyor. Kule'nin karanlığı onları ağır ağır yutuyor.", en: "Right before the door the boy turns around and waves at you. The dark inside the Spire swallows them, slow." }
        secenekler:
          - id: "pazar"
            etiket: { tr: "Pazarın içine karış", en: "Disappear into the market" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "kapi"
            etiket: { tr: "Bir süre kapıya bakıp bekle", en: "Watch the door a while" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== KULE DİBİ 2/6 · komisyoncunun son grubu (tohum)
  - id: "bl9_kat_son"
    konum: ["kule_dibi"]
    perde: [2]
    yalniz_tohum: true
    kosul: { bolum: 9 }
    gerilim: 3
    etiketler: ["kule", "pazar", "kurtarma"]
    kart: { tr: "On beşinci kattaki oda", en: "The room on fifteen" }
    sahne: "bl9_kat_son_1"
    sahneler:
      - id: "bl9_kat_son_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın ortasında bir kadın komisyoncunun boş tezgâhını yumrukluyor. Elindeki kâğıtta dokuz ad yazılı: iki gece önce komisyoncunun yukarı yolladığı grup. Eskortlar dün gece yalnız indi; birinin kolu omzundan bileğine kadar yarık.", en: "In the middle of the market, a woman is pounding on the broker's empty stall. The paper in her hand has nine names on it: the group the broker sent up two nights ago. The escorts came down alone last night, one with his arm split open from shoulder to wrist." }
          - { tr: "Yaralı eskort bir kasanın üstüne çökmüş, başını kaldırmadan anlatıyor: \"Kırıntılar on beşte sardı bizi. Hepsini bir odaya tıktık, kapıyı dolapla destekledik. Kapı tutar mı... Bilmiyorum.\"", en: "The injured escort is slumped on a crate and doesn't look up while he talks. \"Shards jumped us on fifteen. We shoved everybody into a room and wedged the door with a cabinet. Whether the door holds... I don't know.\"" }
          - metin: { tr: "Komisyoncunun tezgâhı senin yüzünden bir gün kapalı kalmış, sonra Kule'nin öbür kapısında yeniden açılmış. Tahtadaki fiyatlar bile aynı.", en: "Because of you, the broker's stall stayed shut for a day. Then it opened back up at the Spire's other door. Same prices on the board." }
            kosul: { bayrak: "bl9_kat_ifsa" }
          - metin: { tr: "Kuyruktan çektiğin aile kalabalığın içinde; baba oğlanı omzuna almış, sana bakıyor. Onların adı kâğıtta yok.", en: "The family you pulled out of line is in the crowd, the boy up on his dad's shoulders, the father looking right at you. Their names aren't on the paper." }
            kosul: { bayrak: "bl9_kat_aile_indi" }
          - metin: { tr: "Başını kaldırınca altıncı katın penceresinde küçük bir elin sallandığını görüyorsun. Bıraktığın aile hâlâ orada.", en: "You look up and there's a little hand waving in the sixth-floor window. The family you left up there hasn't moved." }
            kosul: { bayrak: "bl9_kat_aile_seninle" }
          - metin: { tr: "Kâğıttaki dokuz addan üçü yan yana yazılmış, yanlarına bir not düşülmüş: bastonlu, oğlan altı yaşında.", en: "Three of the nine names are written next to each other, with a note beside them: cane, boy is six." }
            kosul: { herhangi: [{ bayrak: "bl9_kat_karismadi" }, { bayrak: "bl9_kat_pay" }] }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Kule'nin duvarından, çok yukarıdan, belli belirsiz bir tıkırtı iniyor. Biri on beşinci katta dolabın arkasından düzenli aralıklarla vuruyor: hâlâ yaşıyorlar.", en: "Faint, from way up the Spire's wall, a tapping comes down. Somebody on fifteen is knocking on the back of that cabinet, steady and spaced out. They're still alive." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "on beşinci katın kuralı basit: sessiz olan yaşar. çocuğu susturabilirler mi dersin?", en: "the rule on fifteen is simple: the quiet ones live. think they can keep the kid quiet?" }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"İki gündür susuzlar. Ne yapacaksak bugün.\"", en: "\"Two days without water. Whatever we're doing, it's today.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Komisyoncu bunu yine yapacak. Yine, yine. Bunu biliyorsun, değil mi?\"", en: "\"The broker's going to do this again. And again. You know that, right?\"" }
        secenekler:
          - id: "tirman"
            etiket: { tr: "Merdivene koş; on beşinci kata çık", en: "Hit the stairs. Get to fifteen" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kule_kirintisi@dunya", "kule_kirintisi@dunya"], ortam: ["tavan"], kazan: "bl9_kat_son_zafer", kaybet: "bl9_kat_son_yenilgi", kac: "bl9_kat_son_kacis" }
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} dön: \"On beşe kim önce?\"", en: "Turn to {npc:aras_kurt}. \"First one to fifteen?\"" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, baglilik: 2 } }
              - bayrak: "bl9_kat_aras"
              - savas: { dusmanlar: ["kule_kirintisi@dunya", "kule_kirintisi@dunya"], ortam: ["tavan"], kazan: "bl9_kat_son_zafer", kaybet: "bl9_kat_son_yenilgi", kac: "bl9_kat_son_kacis" }
          - id: "avci"
            etiket: { tr: "Pazardaki avcıları topla; bedeli sen öde", en: "Round up the market's hunters. You pay" }
            gerekli: { stat: { cha: 25 } }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - itibar: { lonca: 1 }
            sonraki: "bl9_kat_son_avci"
          - id: "birak"
            etiket: { tr: "Kadına \"Başın sağ olsun\" de ve yürü", en: "Tell the woman \"I'm sorry for your loss,\" and walk" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - bayrak: "bl9_kat_kayip"
              - tehlike: { kule_dibi: 2 }
            sonraki: "bl9_kat_son_birak"

      - id: "bl9_kat_son_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Son kırıntı merdiven boşluğuna düşüp aşağıda tuzla buz oluyor. On beşinci katın koridoru cam tozuyla kaplı. Dolabı itince kapının ardında tutulan dokuz kişilik nefes birden dışarı taşıyor.", en: "The last shard drops down the stairwell and shatters somewhere below. The fifteenth-floor hallway is carpeted in glass dust. You shove the cabinet aside and nine people's worth of held breath comes pouring out the door." }
          - metin: { tr: "Bastonlu nine en arkada oturuyor, oğlan kucağında uyuyakalmış. Nine sana bakıp tek bir şey söylüyor: \"Geç kaldın.\" Sonra ayağa kalkmak için koluna tutunuyor.", en: "The grandmother with the cane is sitting at the very back with the boy asleep in her lap. She looks up at you and says one thing: \"You're late.\" Then she grabs your arm to get to her feet." }
            kosul: { herhangi: [{ bayrak: "bl9_kat_karismadi" }, { bayrak: "bl9_kat_pay" }] }
          - metin: { tr: "{npc:aras_kurt} sahanlıkta soluklanıyor. \"Bir kat önce vardım,\" diyor. Yalan, ama bu sefer düzeltmiyorsun.", en: "{npc:aras_kurt} is catching his breath on the landing. \"Beat you by a floor,\" he says. It's a lie, and this time you let it go." }
            kosul: { bayrak: "bl9_kat_aras" }
          - { tr: "Dokuz kişiyi on beş kat aşağı indirmek bütün bir öğleden sonrayı alıyor. Meydana vardığınızda komisyoncunun ikinci tezgâhı da ortadan kalkmış.", en: "Getting nine people down fifteen floors takes the whole afternoon. By the time you reach the plaza, the broker's second stall is gone too." }
        secenekler:
          - id: "ilan"
            etiket: { tr: "Kule'nin kapısına not as: On ikiden yukarısı mezar", en: "Post a note on the Spire's door: Past twelve is a grave" }
            etkiler:
              - bayrak: "bl9_kat_kurtarildi"
              - tehlike: { kule_dibi: -2 }
              - ahlak: { duzen: 1 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Önce herkese su dağıt", en: "Water for everybody first" }
            etkiler:
              - bayrak: "bl9_kat_kurtarildi"
              - tehlike: { kule_dibi: -2 }
              - ahlak: { merhamet: 1 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl9_kat_son_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir kırıntı seni sahanlığın demir korkuluğuna çarpıyor. Gözünü açtığında merdivenin dibinde yatıyorsun, biri de yüzüne su döküyor. Pazarın avcıları senin ardından çıkmış.", en: "A shard slams you into the landing's iron railing. When you open your eyes you're at the bottom of the stairs and somebody's pouring water on your face. The market's hunters went up after you." }
          - { tr: "Dokuz kişiden beşini indirebilmişler. Kadın kâğıttaki adlardan dördünün üstünü kurşun kalemle tek tek çiziyor.", en: "They got five of the nine down. The woman crosses four names off her paper with a pencil, one at a time." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Doğrul ve kalabalıktan uzaklaş", en: "Get up and get clear of the crowd" }
            etkiler:
              - bayrak: "bl9_kat_kismen"
              - can: 20
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl9_kat_son_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Merdiven boşluğu kırıntılarla dolunca geri çekiliyorsun. Kapının önünde soluklanırken pazarın avcıları yanından geçip yukarı koşuyor.", en: "When the stairwell fills up with shards, you fall back. You're catching your breath by the door when the market's hunters run past you and up." }
          - { tr: "Akşama doğru beş kişiyle iniyorlar. Kadın kâğıdı katlayıp cebine koyuyor; artık kimseye bakmıyor.", en: "Toward evening they come back down with five people. The woman folds her paper and puts it away. She isn't looking at anybody now." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kapıdan uzaklaş", en: "Walk away from the door" }
            etkiler:
              - bayrak: "bl9_kat_kismen"
              - xp_seviye: 6
            sonraki: "@akis"

      - id: "bl9_kat_son_avci"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın ortasında bir kasanın üstüne çıkıp fiyatı söylüyorsun. Önce kimse kıpırdamıyor; sonra kolunda yara izi olan bir kadın avcı kılıcını omzuna alıyor, ardından on kişi daha.", en: "You climb onto a crate in the middle of the market and name the price. Nobody moves at first. Then a hunter with a scarred arm hoists her sword onto her shoulder, and ten more follow." }
          - { tr: "On ikinci katta iki avcı yaralanıyor ama on beşinci katın kapısı tutmuş. Güneş batmadan dokuz kişinin dokuzu da meydanda.", en: "Two hunters get hurt on twelve, but the door on fifteen held. All nine are in the plaza by sundown." }
          - { tr: "Avcılar paralarını alırken kolu yaralı kadın sana dönüyor: \"Bunu bir daha yaparsan önceden haber ver. Fiyatı ikiye katlarım.\"", en: "While the hunters collect, the scarred one turns to you. \"Next time you pull this, give me a heads-up. I'll double my rate.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bir dahaki sefere komisyoncuyu da getir.\"", en: "\"Next time, bring the broker too.\"" }
            etkiler:
              - bayrak: "bl9_kat_kurtarildi"
              - tehlike: { kule_dibi: -1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Ödemeyi yap, kalabalığa karış", en: "Pay up and melt into the crowd" }
            etkiler:
              - bayrak: "bl9_kat_kurtarildi"
              - gizle: 1
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_kat_son_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kadın cevap vermiyor; kâğıdı göğsüne bastırıp tezgâha vurmayı sürdürüyor. Meydanın öbür ucuna varana dek yumruklarının sesi peşini bırakmıyor.", en: "She doesn't answer. She just clutches the paper to her chest and keeps pounding on the stall. The sound of it follows you all the way across the plaza." }
          - { tr: "Akşama doğru tıkırtı kesiliyor. Kimse bunu fark etmiyor; ya da herkes fark edip susuyor.", en: "Toward evening the tapping stops. Nobody notices. Or everybody does and keeps quiet about it." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yoluna devam et", en: "Keep moving" }
            etkiler:
              - xp_seviye: 6
            sonraki: "@akis"
          - id: "bak"
            etiket: { tr: "Dön ve Kule'ye bir kez bak", en: "Turn around and look at the Spire once" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - xp_seviye: 6
            sonraki: "@akis"

  # ================================================================== KULE DİBİ 3/6 · ışık ölçer (havuz; bl9_saat tohumlar)
  - id: "bl9_isik_olcer"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 152, max: 173 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["kesif", "kadim", "kule", "olcum"]
    gerilim: 2
    kart: { tr: "Üç ayaklı adam", en: "The man with the tripod" }
    sahne: "bl9_isik_olcer_1"
    sahneler:
      - id: "bl9_isik_olcer_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Saatçi doğru söylemiş: Kule'nin dibinde, avcıların arasında üç ayak üstünde bir alet duruyor, başında da turuncu yelekli bir adam.", en: "The clock keeper wasn't kidding. Down at the foot of the Spire, in among the hunters, there's an instrument on a tripod and a man in an orange vest bent over it." }
            kosul: { herhangi: [{ bayrak: "bl9_saat_susturuldu" }, { bayrak: "bl9_saat_muhur" }, { bayrak: "bl9_saat_calsin" }] }
          - { tr: "Akşam iniyor. Meydanın ortasına kurulmuş bir teodolitin başında altmışlarında bir adam, gözünü dürbünden ayırmadan defterine rakam yazıyor; yeleğinin sırtında soluk harflerle Kadastro Müdürlüğü okunuyor. Adı Halit, otuz yıl bu şehrin parsellerini ölçmüş.", en: "Evening's coming on. In the middle of the plaza a man in his sixties stands over a theodolite, writing numbers in a notebook without taking his eye off the scope. The back of his vest says COUNTY SURVEYOR in faded letters. His name's Hal Brandt, and he measured every lot line in this city for thirty years." }
          - { tr: "Geçen avcılar laf atıyor: \"Kule'yi tapuya mı geçireceksin dayı?\" Halit Usta istifini bozmuyor. Sonra seni görüp kalemini kulağının arkasına sıkıştırıyor. \"Sen tırmanıyorsun, değil mi? Bana yüksek bir nokta lazım. Üçüncü nokta.\"", en: "Hunters rag on him as they go by. \"Gonna get the Spire a deed, old-timer?\" He doesn't so much as twitch. Then he spots you and tucks his pencil behind his ear. \"You climb, right? I need a high point. A third point.\"" }
          - { tr: "\"Birinci nokta {yer:eski_sehir|in} saat kulesi, ikincisi burası,\" diye anlatıyor. \"Kesin bir şey söyleyemem daha, ama şu kadarı belli: o ışıklar şehrin üstünde değil, Kule'nin üstünde. Tam tepesinde, çember gibi dizilmişler.\"", en: "\"Point one's the clock tower up in {yer:eski_sehir},\" he explains. \"Point two is right here. I can't swear to anything yet, but this much is clear: those lights aren't over the city. They're over the Spire. Dead center, set in a ring.\"" }
          - metin: { tr: "Kırkıncı kattaki gözcü yeri aklına geliyor; Halit Usta'nın istediğinden otuz kat yüksek.", en: "Your lookout on forty comes to mind. That's thirty floors higher than he's asking for." }
            kosul: { bayrak: "hazirlik_gemi_gozcu" }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Teodolitin dürbününden bakınca ışıklardan biri, tam sen baktığın anda bir kez sönüp yanıyor.", en: "When you look through the scope, one of the lights blinks off and on, right as you look." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ölçmek iyidir. ölçtüğün şey de seni ölçüyor ama. adil alışveriş.", en: "measuring's good. the thing you're measuring is measuring you back, though. fair trade." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Üçgenleme. Analog ama sağlam. Benim veriyle karşılaştırırsak hata payı yarıya iner.\"", en: "\"Triangulation. Analog, but solid. Cross it with my data and the margin of error drops by half.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben her gece sayıyorum onları. Ölçmek hiç aklıma gelmedi.\"", en: "\"I count them every night. Never thought about measuring them.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Teodoliti dokuzuncu kata sen çıkar", en: "Carry the theodolite up to nine yourself" }
            zar: { stat: "agi", zorluk: 15, tek: true, basarisiz: "bl9_isik_olcer_dusus", basarisiz_etkiler: [{ bayrak: "bl9_olcum_yarim" }, { tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } } }] }
            etkiler:
              - bayrak: "bl9_olcum_tam"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_isik_olcer_veri"
          - id: "gozcu"
            etiket: { tr: "Onu kırkıncı kattaki gözcü yerine çıkar", en: "Take him up to your lookout on forty" }
            goster: { bayrak: "hazirlik_gemi_gozcu" }
            etkiler:
              - bayrak: "bl9_olcum_tam"
              - bayrak: "bl9_olcum_gozcu"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_isik_olcer_veri"
          - id: "hesap"
            etiket: { tr: "Defteri al; hesabı onunla birlikte yap", en: "Take the notebook. Run the math with him" }
            gerekli: { stat: { int: 30 } }
            etkiler:
              - bayrak: "bl9_olcum_tam"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_isik_olcer_veri"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|in} kayıtlarını ustanın defteriyle karşılaştır", en: "Check {npc:mert_kilic|pos} logs against Hal's notebook" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2, saygi: 3 } }
              - bayrak: "bl9_olcum_tam"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_isik_olcer_veri"
          - id: "neden"
            etiket: { tr: "\"Bilmek neyi değiştirecek, usta?\"", en: "\"What does knowing change, Hal?\"" }
            sonraki: "bl9_isik_olcer_neden"

      - id: "bl9_isik_olcer_neden"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halit Usta gözünü dürbünden ilk kez ayırıyor. \"Kaç gün kaldığını değiştirmez,\" diyor. \"Panellerdeki sayaç onu zaten söylüyor. Ama gölgenin nereye düşeceğini bilirsen insanları nereye saklayacağını da bilirsin.\"", en: "For the first time, Hal takes his eye off the scope. \"Doesn't change how many days are left,\" he says. \"The counter on the panels already tells you that. But if you know where the shadow's going to fall, you know where to hide people.\"" }
          - { tr: "\"Otuz yıl sınır çizdim ben,\" diye ekliyor. \"İnsan bahçesinin nerede bittiğini bilmeden rahat edemez. Bu da öyle.\"", en: "\"Thirty years I drew property lines,\" he adds. \"People can't rest till they know where their yard ends. This is no different.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "Teodoliti sırtla: \"Hangi kat?\"", en: "Shoulder the theodolite. \"Which floor?\"" }
            etkiler:
              - bayrak: "bl9_olcum_tam"
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_isik_olcer_veri"
          - id: "git"
            etiket: { tr: "Başını salla ve meydandan ayrıl", en: "Nod and leave the plaza" }
            etkiler:
              - xp_seviye: 4
            sonraki: "@akis"

      - id: "bl9_isik_olcer_dusus"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yedinci katın sahanlığında bir basamak ayağının altında ufalanıyor. Teodoliti kurtarıyorsun ama merceği taşa çarpıp çatlıyor.", en: "On the seventh-floor landing, a step crumbles under your foot. You save the theodolite, but the lens smacks the stone and cracks." }
          - { tr: "Halit Usta aleti çatlak merceğiyle kurup yine de ölçüyor. Her rakamın yanına bir artı eksi yazıyor, artı eksiler gittikçe büyüyor. \"Yarım bilgi,\" diye mırıldanıyor. \"Hiç yoktan iyidir. Bazen de değildir.\"", en: "Hal sets it up with the cracked lens and measures anyway. He writes a plus-or-minus next to every number, and the plus-or-minuses keep getting bigger. \"Half an answer,\" he mutters. \"Better than none. Sometimes it isn't.\"" }
        secenekler:
          - id: "ozur"
            etiket: { tr: "\"Sana yeni bir mercek bulacağım.\"", en: "\"I'll find you a new lens.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "yeter"
            etiket: { tr: "\"Yarım bilgi de bir şeydir, usta.\"", en: "\"Half an answer's still something, Hal.\"" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl9_isik_olcer_veri"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Kırkıncı katın penceresinden körfez avucunun içi gibi görünüyor. Halit Usta teodoliti pervaza kurarken dizleri titriyor, ama elleri sapasağlam.", en: "From the fortieth-floor window, the bay looks small enough to hold. Hal's knees are shaking as he sets the theodolite on the sill, but his hands are rock steady." }
            kosul: { bayrak: "bl9_olcum_gozcu" }
          - { tr: "Hesap gece yarısına doğru bitiyor. Halit Usta defterin arka sayfasına bir çember çizip çevresine yedi nokta koyuyor. Çemberin ortasında küçük bir kare var: Kule.", en: "The math's done around midnight. On the back page of the notebook, Hal draws a circle and puts seven dots around it. Smack in the middle is a little square: the Spire." }
          - { tr: "\"Yedi ışık birbirinden kilometrelerce uzakta,\" diyor, \"ama hepsi aynı hızla iniyor, santimi santimine. Yedi ayrı şey böyle inmez evlat. Tek bir şeyin yedi köşesi böyle iner. Çemberin içi körfezden geniş.\"", en: "\"The seven lights are miles apart,\" he says, \"but they're all coming down at the same speed, to the inch. Seven separate things don't do that, son. Seven corners of one thing do. That ring's wider than the bay.\"" }
          - { tr: "Son satırı yazıp kalemi bırakıyor. İnişin bittiği gün, panellerdeki sayacın sıfıra vardığı günle aynı. \"Sayaç yalan söylemiyor,\" diyor. \"Keşke söyleseydi.\"", en: "He writes one last line and puts the pencil down. The day the descent bottoms out is the same day the counter on the panels hits zero. \"The counter isn't lying,\" he says. \"Wish it was.\"" }
          - metin: { tr: "{npc:mert_kilic} iki veri setini üst üste koyunca hata payı bir sokak genişliğine iniyor. \"Analog adam,\" diyor, sesinde gönülsüz bir hayranlık. \"Analog ama haklı.\"", en: "When {npc:mert_kilic} lays the two data sets over each other, the margin of error shrinks to the width of a street. \"Analog guy,\" he says, grudgingly impressed. \"Analog, but right.\"" }
            kosul: { yoldas: "mert_kilic" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çemberin ortasında bir kare. hedef tahtası gibi, değil mi? tahtanın ortasında da hep aynı şey durur.", en: "a square in the middle of a ring. like a target, right? and the middle of a target's always the same thing." }
        secenekler:
          - id: "birlikte"
            etiket: { tr: "\"Bunu Konsey'e birlikte götürelim.\"", en: "\"We take this to the Council together.\"" }
            etkiler:
              - bayrak: "bl9_olcum_birlikte"
              - ahlak: { duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sen"
            etiket: { tr: "\"Sen götür, usta. Senin rakamların.\"", en: "\"You take it, Hal. Your numbers.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== KULE DİBİ 4/6 · yukarı bakmak yasak (havuz)
  - id: "bl9_bekci"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 152, max: 172 }
    kosul: { bolum: 9, bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kesif", "kule", "canavar", "kadim"]
    gerilim: 3
    kart: { tr: "Yukarı bakmak yasak", en: "No looking up" }
    sahne: "bl9_bekci_1"
    sahneler:
      - id: "bl9_bekci_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydana alışılmadık bir sessizlik çökmüş. Avcılar, hamallar, tezgâhçılar başlarını öne eğmiş yürüyor; kimse gözünü kaldırımdan ayırmıyor. Kilisedeymiş gibi.", en: "The plaza's gone strangely quiet. Hunters, porters, stall owners, all walking with their heads down, nobody taking their eyes off the pavement. Like church." }
          - { tr: "Ortada kırık zırhlı bir kat bekçisi dikiliyor. Önünde, Sistem'inden gelmeyen mavi bir pencere asılı: [Kat 7 Kuralı: Yukarı bakmak yasaktır.] Ayaklarının dibinde iki avcı inleyerek kıvranıyor; ikisi de ışıklara bakmış.", en: "In the middle stands a floorwarden in cracked armor. A blue window hangs in front of it, and it isn't from your System: [Floor 7 Rule: No looking up.] Two hunters are writhing at its feet, groaning. Both of them looked at the lights." }
          - { tr: "Bir tezgâhçı yanından geçerken fısıldıyor: \"Eskiden kural şuydu: koşmak yasak. Işıklar çıktığı gece değişti.\" Meydanın kenarında zincirli, zıpkınlı bir avcı ekibi toplanırken bekçinin çekirdeğine konan ödül panoda yazılı.", en: "A vendor whispers as he passes. \"The rule used to be no running. It changed the night the lights showed up.\" At the edge of the plaza a hunting crew is gathering with chains and harpoons. The bounty on the warden's core is up on the board." }
          - metin: { tr: "Bekçinin penceresinin altında, yalnızca senin görebildiğin soluk bir satır titreşiyor: [Kuralı güncelleyen: █████.]", en: "Under the warden's window, a faint line only you can see flickers: [Rule updated by: █████.]" }
            kosul: { gizli_fark_min: 1 }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Yere serilen avcıların gözbebeklerinde soluk, yedi köşeli bir iz var. Işıklara uzun uzun bakan herkesin gözünde aynısından. Bekçi bakanları vuruyor, ama ondan önce bakanlar okunuyor.", en: "There's a faint seven-sided mark in the downed hunters' pupils. Everybody who's stared at the lights too long has the same one. The warden hits the ones who look, but by then the ones who look have already been read." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kurala göre işleyen bir şey. kuralını da biri değiştirmiş. ben olsam o biriyle ilgilenirdim.", en: "it runs on rules. and somebody changed its rule. if i were you i'd want to know who." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Panodaki ödüle bak. O çekirdek beni iki sıra yukarı taşır.\"", en: "\"Look at that bounty. That core's worth two spots on the Ranking to me.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Yerdekilerin nabzı düzenli. Bayılmışlar, ölmemişler. Bu şey öldürmek istemiyor.\"", en: "\"The ones on the ground have steady pulses. They're out, not dead. This thing isn't trying to kill anybody.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben her gece o ışıklara bakıyorum. Benim gözüme de bir şey oldu mu?\"", en: "\"I look at those lights every night. Did something happen to my eyes too?\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Avcılardan önce davran; bekçinin karşısına geç", en: "Move before the hunters do. Face the warden" }
            etkiler:
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl9_bekci_zafer", kaybet: "bl9_bekci_yenilgi", kac: "bl9_bekci_kacis" }
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt} kılıcına davranmış bile; yanında dur", en: "{npc:aras_kurt} already has his blade out. Stand with him" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 2, baglilik: 2 } }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl9_bekci_zafer", kaybet: "bl9_bekci_yenilgi", kac: "bl9_bekci_kacis" }
          - id: "goz"
            etiket: { tr: "Yere serilenlerin gözlerine eğilip bak", en: "Crouch down and look at the downed hunters' eyes" }
            gerekli: { stat: { per: 30 } }
            sonraki: "bl9_bekci_goz"
          - id: "yere"
            tur: "gizle"
            etiket: { tr: "Gözünü kaldırıma indir, yanından geç", en: "Eyes on the pavement. Walk past it" }
            etkiler:
              - gizle: 2
              - bayrak: "bl9_bekci_itaat"
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} insanlar hâlâ başları önde yürüyor.", en: "People in {yer:kule_dibi} are still walking around with their heads down." } }
            sonraki: "bl9_bekci_itaat"
          - id: "bak"
            tur: "gosteris"
            etiket: { tr: "Başını kaldır, ışıklara dimdik bak", en: "Lift your head. Stare straight up at the lights" }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: -1 }
              - bayrak: "bl9_bekci_diz"
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} insanlar hâlâ başları önde yürüyor; yalnız sen geçerken birkaçı gözünü kaldırıyor.", en: "People in {yer:kule_dibi} still walk with their heads down. When you go by, a few of them sneak a look up." } }
            sonraki: "bl9_bekci_bakis"

      - id: "bl9_bekci_goz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avcılardan birinin göz kapağını başparmağınla aralıyorsun. Gözbebeğinin içinde mürekkep damlası gibi yayılmış yedi köşeli bir iz duruyor; sen bakarken ağır ağır soluyor.", en: "You thumb one hunter's eyelid open. In his pupil there's a seven-sided mark, spread like a drop of ink, and it's fading slowly while you watch." }
          - { tr: "Bekçinin kuralı ışıklar çıktığı gece değişmiş. Şimdi anlıyorsun: yukarı bakanı ışıklar okuyor, onu yere seren de bekçi. Bekçi okumayı yarıda kesiyor.", en: "The warden's rule changed the night the lights came out. Now you get it. The lights read whoever looks up, and the warden knocks them flat. It's cutting the reading short." }
          - { tr: "Avcı ekibi zincirlerini savurmaya başlamış bile.", en: "The hunting crew is already starting to swing their chains." }
        secenekler:
          - id: "ikna"
            etiket: { tr: "Avcıların önüne geç: \"Bu şey sizi koruyor.\"", en: "Step in front of the hunters. \"That thing's protecting you.\"" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "bl9_bekci_ikna_bozuk", basarisiz_etkiler: [{ bayrak: "bl9_bekci_olduruldu" }, { bayrak: "bl9_bekci_satildi" }, { tehlike: { kule_dibi: -2 } }, { tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "Bekçinin çekirdeği o günden beri {yer:kule_dibi|in} pazarında elden ele dolaşıyor.", en: "The warden's core has been changing hands in the {yer:kule_dibi} market ever since." } } }] }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "bl9_bekci_korundu"
              - tehlike: { kule_dibi: 1 }
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} insanlar hâlâ başları önde yürüyor.", en: "People in {yer:kule_dibi} are still walking around with their heads down." } }
            sonraki: "bl9_bekci_korundu"
          - id: "yine"
            etiket: { tr: "Yine de çekirdeği avcılara bırakma; kendin al", en: "Either way, don't leave the core to the hunters. Take it yourself" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan"], kazan: "bl9_bekci_zafer", kaybet: "bl9_bekci_yenilgi", kac: "bl9_bekci_kacis" }
          - id: "yere"
            tur: "gizle"
            etiket: { tr: "Gözünü kaldırıma indir ve sus", en: "Eyes down. Keep your mouth shut" }
            etkiler:
              - gizle: 2
              - bayrak: "bl9_bekci_itaat"
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "{yer:kule_dibi|de} insanlar hâlâ başları önde yürüyor.", en: "People in {yer:kule_dibi} are still walking around with their heads down." } }
            sonraki: "bl9_bekci_itaat"

      - id: "bl9_bekci_korundu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ekibin başı göz kapağını kendi eliyle aralıyor, izi görünce zincirini yavaşça yere bırakıyor. \"Ödülü kim ödeyecek peki?\" diye soruyor. Cevabı kimsede yok; ekip söylene söylene dağılıyor.", en: "The crew boss thumbs the eyelid open himself, sees the mark, and slowly lowers his chain. \"So who pays the bounty?\" he asks. Nobody has an answer, and the crew breaks up, grumbling." }
          - { tr: "Bekçi bütün bu süre boyunca kıpırdamıyor. Yalnız penceresi bir an titreşiyor, ardından yeni bir satır beliriyor: [Kat 7: Bir ziyaretçi kurala uydu. Not edildi.]", en: "The warden doesn't move the whole time. Its window just flickers once, and a new line appears: [Floor 7: One visitor complied. Noted.]" }
        secenekler:
          - id: "git"
            etiket: { tr: "Başın önde, meydandan çık", en: "Head down, leave the plaza" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "uyar"
            etiket: { tr: "Pazarın girişine tebeşirle yaz: Yukarı bakmayın", en: "Chalk a warning at the market entrance: Don't look up" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_bekci_ikna_bozuk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Koruyormuş!\" diye gülüyor ekibin başı. \"İki adamımı yere serdi, koruyormuş.\" Sen daha cevap veremeden zincirler havalanıyor.", en: "\"Protecting us!\" the crew boss laughs. \"Laid out two of my guys, and it's protecting us.\" Before you can answer, the chains are in the air." }
          - { tr: "Bekçi karşılık vermiyor; penceresi son bir kez titreşiyor: [Kat 7 Kuralı: Yukarı bakmak yasakt—] Zıpkın zırhın çatlağından içeri giriyor. Ekip çekirdeği söküp havaya kaldırınca meydandaki bütün başlar yukarı kalkıyor.", en: "The warden doesn't fight back. Its window flickers one last time: [Floor 7 Rule: No looking u—] A harpoon punches through the crack in its armor. When the crew pries out the core and holds it up, every head in the plaza tips back to look." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalabalıktan uzaklaş", en: "Get away from the crowd" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "su"
            etiket: { tr: "Yere serilen avcıların yüzüne su serp", en: "Splash water on the downed hunters" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl9_bekci_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçi dizlerinin üstüne çöküyor; penceresi bir süre daha havada kalıp sönüyor. Zırhın içinden çıkardığın çekirdek avucunda hâlâ ılık, ritmi de yedi vuruşlu.", en: "The warden drops to its knees. Its window hangs there a moment longer, then goes out. The core you pull from the armor is still warm in your palm, and it beats in sevens." }
          - { tr: "Avcı ekibi homurdanarak dağılıyor; ödül ellerinden gitti. Meydandakiler birer ikişer başlarını kaldırıyor. Biri yukarı bakıp gülüyor, öbürü ağlamaya başlıyor.", en: "The hunting crew scatters, grumbling. There goes the bounty. One by one, people in the plaza lift their heads. One of them looks up and laughs. Another starts crying." }
        secenekler:
          - id: "sat"
            etiket: { tr: "Çekirdeği pazarda sat", en: "Sell the core in the market" }
            etkiler:
              - oz_kristali: 3
              - bayrak: "bl9_bekci_olduruldu"
              - bayrak: "bl9_bekci_satildi"
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 15
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "Bekçinin çekirdeği o günden beri {yer:kule_dibi|in} pazarında elden ele dolaşıyor.", en: "The warden's core has been changing hands in the {yer:kule_dibi} market ever since." } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Çekirdeği cebine koy; ritmini dinle", en: "Pocket the core. Listen to its rhythm" }
            etkiler:
              - bayrak: "bl9_bekci_olduruldu"
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 15
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "Bekçiden kalan çekirdek o günden beri cebinde, geceleri yedi kez atıyor.", en: "The warden's core has been in your pocket ever since. At night it beats seven times." } }
            sonraki: "@akis"

      - id: "bl9_bekci_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin zırhlı eli göğsüne iniyor, kaldırım da yüzüne doğru yükseliyor. Kendine geldiğinde avcı ekibi işini bitirmiş; çekirdek ekibin başının elinde, sen de iki baygın avcının yanında yatıyorsun.", en: "The warden's armored hand comes down on your chest and the pavement comes up at your face. When you come to, the crew's done the job. The core's in the boss's hand, and you're lying next to the two knocked-out hunters." }
          - { tr: "\"Sağ ol,\" diyor ekibin başı, sırıtarak. \"Onu güzel oyaladın.\"", en: "\"Thanks,\" the crew boss says with a grin. \"Kept it nice and busy for us.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Doğrul ve üstünün tozunu silk", en: "Get up and dust yourself off" }
            etkiler:
              - bayrak: "bl9_bekci_olduruldu"
              - bayrak: "bl9_bekci_satildi"
              - tehlike: { kule_dibi: -2 }
              - can: 20
              - xp_seviye: 8
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "Bekçinin çekirdeği o günden beri {yer:kule_dibi|in} pazarında elden ele dolaşıyor.", en: "The warden's core has been changing hands in the {yer:kule_dibi} market ever since." } }
            sonraki: "@akis"

      - id: "bl9_bekci_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekilip meydanın kenarına çıkıyorsun. Avcılar zincirleriyle bekçiyi sarıyor; bekçi tek bir darbe bile savurmadan yere iniyor.", en: "You back off to the edge of the plaza. The hunters wrap the warden in chains, and it goes down without throwing a single punch." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalabalığa karış", en: "Blend into the crowd" }
            etkiler:
              - bayrak: "bl9_bekci_olduruldu"
              - bayrak: "bl9_bekci_satildi"
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 6
              - tohum: { olay: "bl9_bekci_iz", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 177 }, hatirlatma: { tr: "Bekçinin çekirdeği o günden beri {yer:kule_dibi|in} pazarında elden ele dolaşıyor.", en: "The warden's core has been changing hands in the {yer:kule_dibi} market ever since." } }
            sonraki: "@akis"

      - id: "bl9_bekci_itaat"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gözünü kaldırımın taşlarına dikip yürüyorsun. Yanından geçerken bekçinin dikkatinin sırtında gezindiğini hissediyorsun: ağır, sabırlı, sürüsüne bakan bir çoban gibi.", en: "You fix your eyes on the paving stones and walk. Going past the warden you can feel its attention move across your back, heavy and patient, like a shepherd watching a flock." }
          - { tr: "Meydanın öbür ucunda yaşlı bir kadın başını kaldıracak gibi oluyor. Bekçi tek adım atınca kadın başını yeniden eğiyor. Kimse yere düşmüyor.", en: "At the far end of the plaza an old woman starts to lift her head. The warden takes one step, and she drops it again. Nobody goes down." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "dur"
            etiket: { tr: "Pazarın kenarında durup bekçiyi izle", en: "Stop at the market's edge and watch the warden" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl9_bekci_bakis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Başını kaldırıyorsun. Gündüz olduğu için ışıklar görünmüyor, ama nerede olduklarını biliyorsun; gözünü oraya dikiyorsun. Bekçinin penceresi art arda titreşiyor: [İhlal.] [İhlal eden: tanımsız.] [Kural uygulanamıyor.]", en: "You lift your head. It's daytime, so the lights aren't out, but you know exactly where they are, and you look there. The warden's window flickers again and again: [Violation.] [Violator: undefined.] [Rule cannot be enforced.]" }
          - { tr: "Bekçi tek dizinin üstüne çöküyor. Meydandakiler bunu görüp bir adım geri çekiliyor; korkudan mı saygıdan mı, kestiremiyorsun. Gökte, gündüz gözüyle görünmemesi gereken bir ışık bir kez yanıp sönüyor.", en: "The warden sinks to one knee. People in the plaza see it and take a step back. Fear or respect, you can't tell. Up in the sky, a light that shouldn't be visible in daylight blinks once." }
        secenekler:
          - id: "git"
            etiket: { tr: "Başını indir ve meydandan çık", en: "Lower your head and leave the plaza" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Işığa bakmayı sürdür", en: "Keep staring at the light" }
            etkiler:
              - dikkat: 2
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== KULE DİBİ 5/6 · bekçinin izi (tohum)
  - id: "bl9_bekci_iz"
    konum: ["kule_dibi"]
    perde: [2]
    yalniz_tohum: true
    kosul: { bolum: 9 }
    gerilim: 2
    etiketler: ["kule", "canavar", "kadim"]
    kart: { tr: "Yedinci katın yeni kuralı", en: "Floor 7's new rule" }
    sahne: "bl9_bekci_iz_1"
    sahneler:
      - id: "bl9_bekci_iz_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Güneş batarken bekçi meydanda dolaşıp insanları Kule'nin zemin katındaki büyük salona doğru itiyor. Penceresinde yeni bir satır var: [Kat 7 Kuralı: Gün batımından sonra dışarıda kalmak yasaktır.]", en: "As the sun goes down, the warden is making rounds in the plaza, herding people toward the big hall on the Spire's ground floor. There's a new line in its window: [Floor 7 Rule: No being outside after sundown.]" }
            kosul: { bayrak_yok: "bl9_bekci_olduruldu" }
          - metin: { tr: "Salonda yüzden fazla kişi var: tezgâhçılar, avcıların çocukları, {yer:kiyikent_liman|den} gelmiş bir iki aile. Kimi battaniyesini sermiş bile, kimi kapının dibinde öfkeyle bekliyor. Bekçi girişe dikilmiş, kapıyı tutuyor.", en: "There are more than a hundred people in the hall: vendors, hunters' kids, a couple of families up from {yer:kiyikent_liman}. Some have already spread out blankets, others are waiting by the door, furious. The warden plants itself in the entrance and holds the door." }
            kosul: { bayrak_yok: "bl9_bekci_olduruldu" }
          - metin: { tr: "Sen yaklaşınca bekçinin penceresi bir an titreşiyor: [Kurala uyan ziyaretçi. Giriş serbest.]", en: "The warden's window flickers as you come up: [Compliant visitor. Entry permitted.]" }
            kosul: { herhangi: [{ bayrak: "bl9_bekci_itaat" }, { bayrak: "bl9_bekci_korundu" }] }
          - metin: { tr: "Bekçi seni görünce yine tek dizinin üstüne çöküyor. Salondakiler bu kez sana bakıyor; meydanda anlatılan hikâye buraya kadar gelmiş.", en: "When the warden sees you, it drops to one knee again. This time the people in the hall are looking at you. The story's made it all the way in here." }
            kosul: { bayrak: "bl9_bekci_diz" }
          - metin: { tr: "Pazarın köşesindeki kuyumcu tezgâhında, cam fanusun altında bekçinin çekirdeği duruyor. Gün batarken çekirdeğin üstünde kendiliğinden mavi bir pencere açılıyor: [Kat 7 Kuralı: Yukarı bakmak yasaktır.] Uygulayacak kimse kalmadığı için pencere boşlukta asılı kalıyor.", en: "In a jeweler's stall at the corner of the market, the warden's core sits under a glass dome. As the sun goes down a blue window opens over it all by itself: [Floor 7 Rule: No looking up.] There's no one left to enforce it, so the window just hangs there." }
            kosul: { bayrak: "bl9_bekci_satildi" }
          - metin: { tr: "Kuyumcunun on dört yaşındaki kızı tezgâhın arkasında oturuyor. Babası ışıklara bakmasın diye onu her gece içeri kilitlemiş, ama kız penceresinden bakmış. Gözbebeklerindeki yedi köşeli iz öyle koyulaşmış ki karşısındakini görmekte zorlanıyor.", en: "The jeweler's fourteen-year-old daughter sits behind the counter. Her father locked her in every night so she wouldn't look at the lights, but she looked through her window. The seven-sided mark in her pupils has gone so dark she can barely look at you." }
            kosul: { bayrak: "bl9_bekci_satildi" }
          - metin: { tr: "Cebindeki çekirdek gün batarken ısınıyor. Çıkarınca üstünde kendiliğinden mavi bir pencere açılıyor: [Kat 7 Kuralı: Yukarı bakmak yasaktır.] Uygulayacak kimse kalmadığı için pencere avucunun üstünde asılı kalıyor.", en: "The core in your pocket heats up as the sun goes down. You take it out, and a blue window opens over it on its own: [Floor 7 Rule: No looking up.] There's no one left to enforce it, so the window just hangs over your palm." }
            kosul: { bayrak: "bl9_bekci_olduruldu", bayrak_yok: "bl9_bekci_satildi" }
        sezgiler:
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Zemin katın tavanı kalın, penceresi yok. Gökten bakan hiçbir şey içeriyi okuyamaz. Bekçi bildiği tek dille bir sığınak kurmuş: kuralla.", en: "The ground floor's ceiling is thick, and there are no windows. Nothing looking down from the sky can read what's inside. The warden's built a shelter in the only language it knows: rules." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kural koyan şeyler kural bozanları sever mi bilmem. ama bu sana diz çöküyor. nedenini bir kendine sor.", en: "i don't know if things that make rules like the ones who break them. but this one kneels to you. ask yourself why." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari", bayrak: "bl9_bekci_satildi" }
            metin: { tr: "\"Kızın gözlerine ışık tutunca hâlâ tepki veriyor. Henüz geç değil.\"", en: "\"Her pupils still react when I shine a light. It's not too late yet.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak_yok: "bl9_bekci_olduruldu" }
            metin: { tr: "\"Sığınak kurmuş. Bir canavar. Biz Konsey'e üç toplantıda bunu yaptıramadık.\"", en: "\"It built a shelter. A monster did. We couldn't get the Council to do that in three meetings.\"" }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Kapının dibindekileri salona sen ikna et", en: "Talk the people at the door into the hall yourself" }
            goster: { bayrak_yok: "bl9_bekci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl9_bekci_siginagi"
              - xp_seviye: 12
            sonraki: "bl9_bekci_iz_son"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|le} battaniye taşıyıp salonu düzenle", en: "Haul blankets with {npc:deniz_arman} and set up the hall" }
            goster: { yoldas: "deniz_arman", bayrak_yok: "bl9_bekci_olduruldu" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, baglilik: 3 } }
              - ahlak: { merhamet: 1 }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl9_bekci_siginagi"
              - xp_seviye: 12
            sonraki: "bl9_bekci_iz_son"
          - id: "sor"
            etiket: { tr: "Bekçinin penceresine sor: \"Kuralı kim değiştirdi?\"", en: "Ask the warden's window: \"Who changed the rule?\"" }
            goster: { bayrak_yok: "bl9_bekci_olduruldu" }
            gerekli: { stat: { wis: 25 } }
            etkiler:
              - bayrak: "bl9_bekci_soruldu"
              - xp_seviye: 12
            sonraki: "bl9_bekci_iz_soru"
          - id: "ac"
            etiket: { tr: "Salonu boşalt; Kule'nin içi kimseye güvenli değil", en: "Clear the hall. Nowhere inside the Spire is safe" }
            goster: { bayrak_yok: "bl9_bekci_olduruldu" }
            etkiler:
              - ahlak: { duzen: -1 }
              - tehlike: { kule_dibi: 1 }
              - xp_seviye: 9
            sonraki: "bl9_bekci_iz_son"
          - id: "geri"
            etiket: { tr: "Çekirdeği Kule'nin yedinci katına geri götür", en: "Take the core back up to the Spire's seventh floor" }
            goster: { bayrak: "bl9_bekci_olduruldu" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
              - tehlike: { kule_dibi: 1 }
              - bayrak: "bl9_bekci_geri"
              - xp_seviye: 12
            sonraki: "bl9_bekci_iz_son"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} kızın gözlerine baksın", en: "Have {npc:elif_sari} look at the girl's eyes" }
            goster: { yoldas: "elif_sari", bayrak: "bl9_bekci_satildi" }
            etkiler:
              - iliski: { elif_sari: { guven: 2, saygi: 2 } }
              - ahlak: { merhamet: 2 }
              - bayrak: "bl9_bekci_kiz_iyilesti"
              - xp_seviye: 12
            sonraki: "bl9_bekci_iz_son"
          - id: "kiz"
            etiket: { tr: "Fanusu kaldır; kız pencereye baksın", en: "Lift the dome. Let the girl look at the window" }
            goster: { bayrak: "bl9_bekci_satildi" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl9_bekci_kiz_iyilesti"
              - xp_seviye: 9
            sonraki: "bl9_bekci_iz_son"
          - id: "cep"
            etiket: { tr: "Pencereyi avucunda kapat, çekirdeği cebine geri koy", en: "Close your hand over the window. Put the core back in your pocket" }
            goster: { bayrak: "bl9_bekci_olduruldu", bayrak_yok: "bl9_bekci_satildi" }
            etkiler:
              - gizle: 1
              - xp_seviye: 9
            sonraki: "bl9_bekci_iz_son"
          - id: "parcala"
            etiket: { tr: "Çekirdeği taşın üstünde parçala", en: "Smash the core on the stones" }
            goster: { bayrak: "bl9_bekci_olduruldu" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1 }
              - xp_seviye: 9
            sonraki: "bl9_bekci_iz_son"

      - id: "bl9_bekci_iz_soru"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Soruyu doğrudan pencereye yöneltiyorsun. Pencere uzun uzun boş kalıyor; sonra tek bir satır beliriyor: [Kat 7 kurallarını Kat 7 sahibi yazar.]", en: "You ask it out loud, right at the window. The window stays blank a long time. Then a single line appears: [Floor 7 rules are written by Floor 7's owner.]" }
          - { tr: "Bir satır daha: [Sahip: Kule'nin sahibi. Kule'nin sahibi: geliyor.]", en: "One more line: [Owner: the Spire's owner. The Spire's owner: arriving.]" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ev sahibi geliyor. kiracılarını başları önde bulmak istiyor. ya da hiç bulmamak.", en: "the landlord's coming. wants to find the tenants with their heads down. or not find them at all." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Yine de salondakilere yardım et", en: "Help the people in the hall anyway" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl9_bekci_siginagi"
              - tehlike: { kule_dibi: -1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Meydandan uzaklaş; düşünecek çok şey var", en: "Leave the plaza. Plenty to think about" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl9_bekci_iz_son"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Gece çöktüğünde salonun kapısı kapanıyor. İçeride biri gitar çalmaya başlıyor; bekçi kapının önünde, sırtı içeriye dönük, nöbet tutuyor.", en: "When night falls, the hall door swings shut. Inside, somebody starts playing a guitar. The warden stands guard outside, its back to the door." }
            kosul: { bayrak: "bl9_bekci_siginagi" }
          - metin: { tr: "Kuyumcunun kızı pencereyi uzun uzun seyrediyor. Göz kapakları ağır ağır kapanıyor; açıldığında gözbebeklerindeki iz solmuş.", en: "The jeweler's daughter stares at the window a long time. Her eyelids slide shut, and when they open, the mark in her pupils has faded." }
            kosul: { bayrak: "bl9_bekci_kiz_iyilesti" }
          - metin: { tr: "Kuyumcudan aldığın çekirdeği yedinci katın sahanlığına çıkarıp kırık bir zırhın boş oyuğuna yerleştiriyorsun. Zırh kıpırdamıyor, ama koridorun ucunda soluk bir pencere yanıyor: [Kat 7 Kuralı: Yukarı bakmak yasaktır.]", en: "You get the core and climb to the seventh-floor landing, and you set it into the empty socket of a broken suit of armor. The armor doesn't move, but at the end of the hall a faint window lights up: [Floor 7 Rule: No looking up.]" }
            kosul: { bayrak: "bl9_bekci_geri" }
          - { tr: "Gökte yedi ışık yerinde; dün geceden bir parmak daha alçakta.", en: "Up in the sky the seven lights are right where they always are. One finger lower than last night." }
        secenekler:
          - id: "git"
            etiket: { tr: "Kule'nin gölgesinden çık", en: "Step out of the Spire's shadow" }
            etkiler:
              - xp_seviye: 6
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "Işıkları uzun uzun say, sonra yürü", en: "Take your time counting the lights, then go" }
            etkiler:
              - xp_seviye: 6
            sonraki: "@akis"

  # ================================================================== KULE DİBİ 6/6 · göğe zıpkın (havuz; bl9_zipkin_ocak tohumlar)
  - id: "bl9_zipkin_deneme"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 155, max: 174 }
    kosul: { bolum: 9 }
    agirlik: 4
    etiketler: ["kesif", "lonca", "kadim", "gosteri"]
    gerilim: 3
    kart: { tr: "Göğe zıpkın", en: "A harpoon for the sky" }
    sahne: "bl9_zipkin_deneme_1"
    sahneler:
      - id: "bl9_zipkin_deneme_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{fraksiyon:lonca} askerleri meydanı halatlarla çevirmiş. Ortada, bir kamyon kasasına cıvatalanmış dev bir zıpkın topu yükseliyor; namlusu yedi ışığın en alçakta olanına çevrili. Ucundaki çengel yan yatmış vapurun çapasından dövülmüş, zinciri de çapanın kendi zinciri.", en: "{fraksiyon:lonca|b} soldiers have roped off the plaza. In the middle, bolted to a truck bed, sits a giant harpoon gun, its barrel aimed at the lowest of the seven lights. The barbed head was forged from the capsized ferry's anchor, and the chain is the anchor's own." }
          - { tr: "Halatların dışında bütün meydan toplanmış. Bahisçiler bağırıyor, çocuklar omuzlara çıkmış. {fraksiyon:lonca|in} topçu çavuşu megafonla sesleniyor: \"Gelen her neyse, elini ilk sıkan biz olacağız!\"", en: "The whole plaza's crowded up outside the ropes. Bookies are yelling odds, kids are up on shoulders. The Guild's gunnery sergeant is on a bullhorn. \"Whatever's coming, we're gonna be the first ones to shake its hand!\"" }
          - metin: { tr: "{npc:kaya_demir} kamyonun yanında, kollarını kavuşturmuş duruyor. Seni görünce başıyla selam veriyor ama yüzünden hiçbir şey okunmuyor.", en: "{npc:kaya_demir} stands by the truck with his arms crossed. He gives you a nod when he sees you, but his face gives away nothing." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Zıpkının ateşleme yuvasında senin verdiğin çekirdek parlıyor. Ritmini tanıyorsun; senin nabzınla atıyor.", en: "The core you gave them glows in the harpoon's firing cradle. You know that rhythm. It beats with your pulse." }
            kosul: { bayrak: "bl9_zipkin_cekirdek" }
          - metin: { tr: "Ateşleme yuvasında {yer:kiyikent_liman|in} su pompalarından sökülmüş üç çekirdek yan yana duruyor. Ambarların suyunu bu hafta kovalarla taşıyorlar.", en: "Three cores pulled from {yer:kiyikent_liman|pos} water pumps sit side by side in the firing cradle. This week they're hauling water to the storerooms by the bucket." }
            kosul: { bayrak: "bl9_pompalar_sokuldu" }
          - metin: { tr: "Gevşettiğin halka zincirin ortasında, kimsenin bakmadığı yerde duruyor. Ateş edildiği anda ne olacağını yalnızca sen biliyorsun.", en: "The link you loosened sits in the middle of the chain, where nobody's looking. You're the only one who knows what happens the second it fires." }
            kosul: { bayrak: "bl9_zipkin_sabote" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "En alçak ışık bile bulutların üstünde. Bu zıpkının menzili birkaç yüz metre; ışık ondan kat kat yüksekte.", en: "Even the lowest light is above the clouds. This harpoon's got a range of a few hundred yards. The light's way, way past that." }
          - kosul: { bayrak: "bl9_olcum_tam" }
            metin: { tr: "Halit Usta'nın defteri aklına geliyor. Zıpkın ışığa varsa bile yedi köşeden birine değer, o kadar; dağa iğne batırmak gibi.", en: "You remember Hal's notebook. Even if it reached, it'd hit one corner out of seven. A pin stuck in a mountain." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "taş atmak. insanlar önce hep taş atar. sonra özür diler. sonra da diz çöker.", en: "throwing rocks. people always throw rocks first. then they apologize. then they kneel." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Ben de bahse girdim. Ne yöne, söylemem.\"", en: "\"I've got money on this. Not telling you which way.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Ping atıyorlar. Gökteki şeye resmen 'buradayız' diyorlar. Harika fikir.\"", en: "\"They're pinging it. Literally telling the thing in the sky 'we're here.' Great plan.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Zincir kopup kalabalığa savrulursa... Sedyeleri buraya getirin.\"", en: "\"If that chain snaps and whips into the crowd... somebody bring the stretchers over here.\"" }
        secenekler:
          - id: "izle"
            etiket: { tr: "Bırak atsınlar; halatın dışında bekle", en: "Let them fire. Wait outside the ropes" }
            sonraki: "bl9_zipkin_deneme_atis"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|in} yanına geç: \"Tetiği birlikte çekelim.\"", en: "Step up next to {npc:kaya_demir}. \"Let's pull the trigger together.\"" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 3, baglilik: 2 } }
              - itibar: { lonca: 2 }
              - bayrak: "bl9_zipkin_kaya"
            sonraki: "bl9_zipkin_deneme_atis"
          - id: "durdur"
            etiket: { tr: "Çavuşu ikna et: atışı asıl güne saklasınlar", en: "Talk the sergeant into saving the shot for the real day" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { lonca: 1 }
              - bayrak: "bl9_zipkin_saklandi"
              - tehlike: { kule_dibi: -1 }
            sonraki: "bl9_zipkin_deneme_sakla"
          - id: "guc"
            tur: "gosteris"
            etiket: { tr: "Ateşleme yuvasına kendi gücünden ver", en: "Pour your own power into the firing cradle" }
            etkiler:
              - dikkat: 4
              - ahlak: { insanlik: -1 }
              - bayrak: "bl9_zipkin_isik_sondu"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_zipkin_deneme_guc"

      - id: "bl9_zipkin_deneme_atis"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Ateşle birlikte zincir gerilip ortadaki halkadan kopuyor. Kopan uç kırbaç gibi kalabalığa savruluyor; üç tezgâh devriliyor, bir hamalın bacağı kırılıyor. Çengel otuz metre kadar yükselip Kule'nin duvarına saplanıyor.", en: "The gun fires, the chain snaps taut, and it parts at the middle link. The loose end whips into the crowd like a bullwhip. Three stalls go over, and a porter's leg breaks. The barbed head climbs maybe a hundred feet and sinks into the Spire's wall." }
            kosul: { bayrak: "bl9_zipkin_sabote" }
          - metin: { tr: "Zıpkın bir gök gürültüsüyle havalanıyor. Zincir saniyeler boyunca çözülüp gidiyor; çengel bulutların altında bir an asılı kalıyor, sonra körfeze doğru eğilip suya gömülüyor. Kalabalık önce alkışlıyor, ardından susuyor.", en: "The harpoon goes up with a thunderclap. The chain pays out for seconds on end. The barbed head hangs under the clouds for a moment, then arcs toward the bay and buries itself in the water. The crowd cheers, then goes quiet." }
            kosul: { bayrak_yok: "bl9_zipkin_sabote" }
          - metin: { tr: "{npc:kaya_demir} tetiği bırakırken sana dönüyor. \"Ulaşmayacağını biliyordum,\" diyor alçak sesle. \"Ama bu şehrin, gökteki şeye bir şey fırlatan birini görmesi gerekiyordu.\"", en: "{npc:kaya_demir} lets go of the trigger and turns to you. \"I knew it wouldn't reach,\" he says, low. \"But this city needed to see somebody throw something back at that thing.\"" }
            kosul: { bayrak: "bl9_zipkin_kaya" }
          - { tr: "Gece olunca yedi ışık birden iki kez sönüp yanıyor; hepsi aynı anda, hepsi bu meydanın üstünde. Sabaha karşı {yer:kiyikent_liman|de} ambarların önünde kuyruk oluşmaya başlıyor.", en: "That night, all seven lights blink twice at once. All of them at the same moment, all of them right over this plaza. By early morning a line is starting to form outside the storerooms on {yer:kiyikent_liman}." }
        secenekler:
          - id: "yarali"
            etiket: { tr: "Yaralıları sedyelere taşı", en: "Carry the injured to the stretchers" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - tehlike: { kule_dibi: 1 }
              - bayrak: "bl9_zipkin_atildi"
              - xp_seviye: 10
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"
          - id: "liman"
            etiket: { tr: "Ambarlar dolmadan doğruca {yer:kiyikent_liman|e} in", en: "Head straight down to {yer:kiyikent_liman} before the storerooms fill" }
            etkiler:
              - tehlike: { kule_dibi: 1 }
              - bayrak: "bl9_zipkin_atildi"
              - xp_seviye: 10
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"

      - id: "bl9_zipkin_deneme_sakla"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Tek atış hakkın var,\" diyorsun çavuşa. \"Bugün atarsan o gün elinde ne kalacak? Bir zincir mi?\" Çavuş megafonu indirip bir süre namluya bakıyor.", en: "\"You get one shot,\" you tell the sergeant. \"Fire it today, and what've you got on the day it counts? A chain?\" The sergeant lowers the bullhorn and looks at the barrel a while." }
          - { tr: "Halatlar çözülüyor. Bahisçiler parayı geri vermemek için bağıra çağıra kavga ederken zıpkın brandaya sarılıp kamyonla Kule'nin arkasına çekiliyor.", en: "The ropes come down. While the bookies scream at each other over refunds, the harpoon gets wrapped in a tarp and the truck hauls it around behind the Spire." }
          - metin: { tr: "{npc:kaya_demir} yanından geçerken omzuna dokunuyor. \"İyi akıl,\" diyor. \"Benimkinden iyi.\"", en: "{npc:kaya_demir} touches your shoulder on his way past. \"Good thinking,\" he says. \"Better than mine.\"" }
            kosul: { npc_hayatta: "kaya_demir" }
        secenekler:
          - id: "git"
            etiket: { tr: "Kalabalık dağılırken sen de çık", en: "Slip out as the crowd breaks up" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "branda"
            etiket: { tr: "Brandanın altındaki namluya uzun uzun bak", en: "Take a long look at the barrel under the tarp" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_zipkin_deneme_guc"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avucunu ateşleme yuvasına bastırıyorsun. Çekirdekler gücünü emerken kamyonun kasası inleyip bükülüyor. Zıpkın havalanırken ses yerine basıncı duyuyorsun; meydandaki bütün camlar aynı anda çatlıyor.", en: "You press your palm to the firing cradle. The truck bed groans and bends as the cores drink your power. When the harpoon goes up, what you hear isn't sound but pressure, and every window in the plaza cracks at once." }
          - { tr: "Zincir bitiyor, çengel durmuyor. Bulutu delip gözden kayboluyor ve gündüz gözüyle görünmemesi gereken en alçak ışık üç saniyeliğine sönüyor.", en: "The chain runs out. The harpoon keeps going. It punches through the clouds and vanishes, and the lowest light, which shouldn't even be visible by day, goes dark for three seconds." }
          - { tr: "Sonra yeniden yanıyor ve yedisi birden bu meydana dönüyor. Halatların dışında kimse alkışlamıyor. Bir kadının fısıltısı bütün meydana yayılıyor: \"Onları kızdırdı.\"", en: "Then it comes back on, and all seven turn on this plaza at once. Nobody outside the ropes is clapping. One woman's whisper carries across the whole plaza: \"It made them mad.\"" }
        bildirimler:
          - tur: "uyari"
            baslik: { tr: "[Gözlem]", en: "[Observation]" }
            satirlar:
              - { tr: "Katman ziyaretçisinin bir algılayıcısı kısa süreliğine devre dışı kaldı. Kaynak işaretlendi.", en: "One of the layer visitor's sensors was briefly disabled. Source flagged." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aferin. ilk kez bir şeye kendimizi tanıttık. adımız artık listenin ilk satırında.", en: "congrats. first time we've ever introduced ourselves to anything. we're on the first line of the list now." }
        secenekler:
          - id: "dimdik"
            etiket: { tr: "Kalabalığın gözü önünde başını dik tut", en: "Keep your head up in front of everyone" }
            etkiler:
              - dikkat: 2
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "kaybol"
            etiket: { tr: "Kalabalık kendine gelmeden kaybol", en: "Vanish before the crowd comes to its senses" }
            etkiler:
              - gizle: 2
              - xp_seviye: 15
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · kamp 1/2 · Deniz
  - id: "bl9_kamp_deniz"
    kamp: true
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 152, max: 177 }
    kosul: { bolum: 9 }
    npc: ["deniz_arman"]
    gerilim: 1
    etiketler: ["kamp", "deniz", "npc"]
    kart: { tr: "Defterin son sayfası", en: "The last page" }
    sahne: "bl9_kamp_deniz_1"
    sahneler:
      - id: "bl9_kamp_deniz_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateşi devrilmiş bir reklam panosunun rüzgâr almayan yüzüne yakmışsınız. Kule sırtınızda kapkara yükseliyor, tepesi görünmüyor. {npc:deniz_arman} o eski okul defterini dizine açmış; balkon listesinden sonra boş kalan sayfalara yedi küçük daire çizmiş.", en: "You built the fire on the sheltered side of a fallen billboard. The Spire rises black at your backs, its top out of sight. {npc:deniz_arman} has that old school notebook open on one knee. On the empty pages past the balcony list are seven little circles." }
          - { tr: "\"Yedi,\" diyor başını kaldırmadan. \"Hep yedi. Bir gece sekiz olsa korkardım, altı olsa da korkardım. Yedi olunca alışıyorsun. En kötüsü de bu galiba.\"", en: "\"Seven,\" {npc:deniz_arman} says without looking up. \"Always seven. If one night it was eight I'd freak out. Six, same thing. When it's seven, you get used to it. I think that's the worst part.\"" }
          - { tr: "Sayfanın kenarına, dairelerin altına yine martılar karalanmış. Biri ötekilerden büyük; kanatlarını açıp yedi dairenin altına girmiş, onları sırtında taşıyor gibi.", en: "Down the margin, under the circles, there are gulls again. One's bigger than the rest, wings spread, tucked under the seven circles like it's carrying them on its back." }
          - metin: { tr: "\"Kardeşim aşağıda, ambarda uyuyor,\" diyor. \"Her akşam bana ışıkları soruyor. Ben de her akşam biraz daha yukarıda olduklarını söylüyorum.\"", en: "\"My sister's asleep down in the storerooms,\" {npc:deniz_arman} says. \"Every night she asks me about the lights. And every night I tell her they're a little higher.\"" }
            kosul: { bayrak: "kardes_kurtarildi" }
          - metin: { tr: "\"Kardeşim olsa şimdiye ad koymuştu onlara,\" diyor. \"Yedisine yedi ayrı ad. Biri mutlaka saçma olurdu.\" Kalem bir süre kâğıdın üstünde kıpırdamadan duruyor.", en: "\"If my sister were here, she'd have named them by now,\" {npc:deniz_arman} says. \"Seven names for seven lights. One of them would definitely be dumb.\" The pencil sits still on the paper for a while." }
            kosul: { bayrak: "kardes_olu_bulundu" }
          - metin: { tr: "\"Kardeşim {yer:tepe|de}, o yurtta,\" diyor. \"Oradan da görüyordur bunları. Ona ne anlatıyorlardır, kim bilir.\" Kalemin ucu kâğıdı deliyor.", en: "\"My sister's up on {yer:tepe}, in that dorm,\" {npc:deniz_arman} says. \"She can probably see them from there too. God knows what they're telling her about them.\" The pencil tip goes through the paper." }
            kosul: { bayrak: "kardes_yukselenlerde" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sırtında yedi şey taşıyan bir martı. o kuşun sen olduğunu bilmiyor mu sanıyorsun?", en: "a gull carrying seven things on its back. you think they don't know that bird is you?" }
        secenekler:
          - id: "yaz"
            etiket: { tr: "\"Listende bir ad eksik. Kendi adın.\"", en: "\"Your list's missing a name. Yours.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { deniz_arman: { guven: 3, baglilik: 3 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl9_kamp_deniz", agirlik: 20 }
              - bayrak: "bl9_kamp_deniz_liste"
            sonraki: "bl9_kamp_deniz_2"
          - id: "ben"
            etiket: { tr: "\"O gün senin adını ben taşırım.\"", en: "\"On the day, I'll carry your name.\"" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 4, saygi: 1 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl9_kamp_deniz", agirlik: 15 }
            sonraki: "bl9_kamp_deniz_2"
          - id: "nobet"
            etiket: { tr: "\"Uyu sen. Bu gece ışıkları ben sayarım.\"", en: "\"Get some sleep. I'll count the lights tonight.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2 } }
            sonraki: "bl9_kamp_deniz_2"

      - id: "bl9_kamp_deniz_2"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "{npc:deniz_arman} uzun süre sayfaya bakıyor. Sonra listenin en altına, bütün apartman adlarının altına küçük harflerle kendi adını yazıyor; yanına bir çentik bile atmıyor.", en: "{npc:deniz_arman} stares at the page a long time. Then, at the very bottom of the list, under all the building names, writes their own name in small letters. Doesn't even put a tally next to it." }
            kosul: { bayrak: "bl9_kamp_deniz_liste" }
          - { tr: "Ateş çıtırdıyor. Kule'nin yukarılarında bir akbaba çığlık atıyor, sonra gece yeniden sessizleşiyor. {npc:deniz_arman} defteri kapatıp göğsüne bastırıyor.", en: "The fire crackles. Somewhere up the Spire a vulture screams, and then the night goes quiet again. {npc:deniz_arman} shuts the notebook and holds it close." }
          - { tr: "\"Biliyor musun,\" diyor, \"o vapurda simidimi martılara atarken dünyanın en büyük derdi bir sonraki iskeleye kaç dakika kaldığıydı.\" Sesinde ilk kez özlemden çok bir gülümseme var.", en: "\"You know,\" {npc:deniz_arman} says, \"back on that ferry, tossing my pretzel to the gulls, the biggest problem in the world was how many minutes to the next stop.\" For the first time there's more smile than longing in it." }
        secenekler:
          - id: "gul"
            etiket: { tr: "\"Bir sonraki iskele. Oraya da varacağız.\"", en: "\"Next stop. We'll make that one too.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 1 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey deme; ateşe bir dal daha at", en: "Don't say anything. Throw another stick on the fire" }
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · kamp 2/2 · Aras
  - id: "bl9_kamp_aras"
    kamp: true
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 152, max: 177 }
    kosul: { bolum: 9 }
    npc: ["aras_kurt"]
    gerilim: 1
    etiketler: ["kamp", "aras", "npc", "siralama"]
    kart: { tr: "Listenin üstündeki liste", en: "The list above the list" }
    sahne: "bl9_kamp_aras_1"
    sahneler:
      - id: "bl9_kamp_aras_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} Kule'nin ilk basamağına sırtüstü uzanmış, duvara çakıl atıyor. Her çakıl biraz daha yükseğe çarpıp geri düşüyor, o da her seferinde bir kat sayıyor. \"Otuz bir,\" diyor sonunda. \"Bende bu kadar. Sende kaç?\"", en: "{npc:aras_kurt} is lying on his back on the Spire's first step, tossing pebbles at the wall. Each one hits a little higher and drops back, and every time, he counts a floor. \"Thirty-one,\" he says at last. \"That's me. What's your number?\"" }
          - { tr: "Cevabını beklemeden çakılı bırakıp yukarıyı, ışıkların olduğu yeri gösteriyor. \"Orada yedi tane var. Hiçbiri Sıralama'da değil. Benim adımın hiç geçmediği bir liste.\" Bir süre susuyor. \"Hoşuma gitmiyor.\"", en: "He doesn't wait for an answer. He drops the pebble and points up, where the lights are. \"There are seven of them up there. Not one's on the Ranking. A list my name's not even on.\" He's quiet a moment. \"I don't like it.\"" }
          - metin: { tr: "\"Otuzuncu katı bana bıraktın,\" diyor. \"Hâlâ sana borçluymuşum gibi geliyor. Midem bulanıyor.\"", en: "\"You let me have thirty,\" he says. \"I still feel like I owe you. Makes me sick.\"" }
            kosul: { bayrak: "aras_kule_birakildi" }
          - metin: { tr: "\"Otuzuncu katta benden önce vardın,\" diyor. \"Bunda öyle olmayacak, haberin olsun.\"", en: "\"You beat me to thirty,\" he says. \"Not happening this time, just so you know.\"" }
            kosul: { bayrak: "aras_kule_kazanildi" }
          - metin: { tr: "\"Otuzuncu katı birlikte aldık,\" diyor. \"Tuhaf. Hâlâ kimin önce vardığını tartışabiliriz.\"", en: "\"We took thirty together,\" he says. \"Weird. We could still argue about who got there first.\"" }
            kosul: { bayrak: "aras_kule_ortak" }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Çakıl atan eli bir an titriyor. Soğuktan değil.", en: "His throwing hand shakes for a second. Not from the cold." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "korkuyor. sana söylemeyecek. ama senden başka kimseye de söylemeyecek, onu bil.", en: "he's scared. he won't tell you. but he won't tell anybody else either, keep that in mind." }
        secenekler:
          - id: "korku"
            etiket: { tr: "\"Korkuyor musun?\"", en: "\"Are you scared?\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2, saygi: -1 } }
            sonraki: "bl9_kamp_aras_korku"
          - id: "yan"
            etiket: { tr: "\"O gün yanımda dur. Sonra yarışırız.\"", en: "\"Stand with me on the day. We can race after.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 3, saygi: 2 } }
              - bayrak: "bl9_kamp_aras_soz"
            sonraki: "bl9_kamp_aras_soz"
          - id: "sayi"
            etiket: { tr: "Kendi sayını söyle; bir çakıl da sen at", en: "Tell him your number. Throw a pebble yourself" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3 } }
            sonraki: "bl9_kamp_aras_cakil"

      - id: "bl9_kamp_aras_korku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} gülüyor, ama gülüşü yarıda kalıyor. \"Bazen kırıntılara bakıyorum,\" diyor. \"Onuncu katın kırıntılarına. Bizim gözümüzde ne kadar küçükler. Ya biz de onların gözünde öyleysek?\"", en: "{npc:aras_kurt} laughs, but it doesn't finish. \"I look at the shards sometimes,\" he says. \"The ones on ten. How small they look to us. What if that's how we look to them?\"" }
          - { tr: "Çakılı avucunda evirip çeviriyor. \"Korkmuyorum. Yalnız... bir şeyin bana bakmadığını ilk kez biliyorum. Bana değil, sana bakıyorlar. Bunu kıskanmalı mıyım, onu da bilmiyorum.\"", en: "He turns the pebble over in his palm. \"I'm not scared. Just... first time I know something isn't looking at me. They're looking at you, not me. I can't tell if I should be jealous of that.\"" }
        secenekler:
          - id: "kiskanma"
            etiket: { tr: "\"Kıskanma. İstersen yerimi al.\"", en: "\"Don't be. You can have my spot.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2 } }
            sonraki: "@akis"
          - id: "uyu"
            etiket: { tr: "\"Uyu, {npc:aras_kurt}. Sabah otuz ikiye çıkarız.\"", en: "\"Get some sleep, {npc:aras_kurt}. We'll hit thirty-two in the morning.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 1 } }
            sonraki: "@akis"

      - id: "bl9_kamp_aras_soz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} doğrulup sana uzun uzun bakıyor. \"Bu bir ittifak teklifi mi?\" diyor. \"Çünkü kulağa öyle geldi. Ben ittifak yapmam.\"", en: "{npc:aras_kurt} sits up and gives you a long look. \"Is that an alliance offer?\" he says. \"'Cause it sounded like one. I don't do alliances.\"" }
          - { tr: "Sonra yeniden uzanıp bir çakıl atıyor; bu sefer çok yükseğe. \"Tamam,\" diyor duvara. \"O gün. Bir günlüğüne. Sonra seni geçerim.\"", en: "Then he lies back down and throws a pebble, way higher this time. \"Fine,\" he tells the wall. \"On the day. For one day. Then I pass you.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bir günlüğüne.\"", en: "\"For one day.\"" }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Elini uzat", en: "Hold out your hand" }
            etkiler:
              - iliski: { aras_kurt: { guven: 1 } }
            sonraki: "@akis"

      - id: "bl9_kamp_aras_cakil"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sayını söyleyip bir çakıl fırlatıyorsun. Çakıl karanlıkta kayboluyor; düştüğünü bile duymuyorsunuz.", en: "You tell him your number and throw a pebble. It disappears into the dark. Neither of you even hears it come down." }
          - { tr: "{npc:aras_kurt} bir süre bekleyip homurdanıyor. \"Gösterişçi,\" diyor. Yine de ağzının kenarında bir şey kıpırdıyor. \"Yarın daha yükseğe atacağım.\"", en: "{npc:aras_kurt} waits a bit, then grunts. \"Show-off,\" he says. Still, something tugs at the corner of his mouth. \"I'm throwing higher tomorrow.\"" }
        secenekler:
          - id: "at"
            etiket: { tr: "\"At bakalım.\"", en: "\"Let's see it.\"" }
            sonraki: "@akis"
          - id: "ates"
            etiket: { tr: "Ateşin başına dön", en: "Head back to the fire" }
            sonraki: "@akis"

  # ================================================================== SANAYİ 1/1 · zıpkının ocağı (havuz)
  - id: "bl9_zipkin_ocak"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 152, max: 170 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["kesif", "sanayi", "lonca", "siginak"]
    gerilim: 2
    kart: { tr: "Çapadan çengel", en: "Anchor into barb" }
    sahne: "bl9_zipkin_ocak_1"
    sahneler:
      - id: "bl9_zipkin_ocak_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kuru havuzun en dibinde, yan yatmış vapurun çapası yeniden ateşe girmiş. Altı demirci sırayla vuruyor; çapanın kolları her darbede biraz daha içe kıvrılıp bir çengele dönüşüyor. Yanında halka halka sökülmüş zincir yılan gibi çöreklenmiş yatıyor.", en: "Down at the bottom of the dry dock, the capsized ferry's anchor is back in the fire. Six smiths take turns hammering it, and with every strike its arms curl in a little more, turning into a barb. Next to it the anchor chain lies coiled like a snake, link after link." }
          - { tr: "Ustabaşı Nevzat elindeki kâğıdı sana uzatıyor: {fraksiyon:lonca} mühürlü bir emir. Zıpkını ateşlemek için {yer:kiyikent_liman|in} su pompalarındaki çekirdekler sökülecek. \"Gökteki şeye taş atacağız,\" diyor. \"Taşı atacak kol da o pompalar.\"", en: "Foreman Nate holds out a sheet of paper with the Guild's seal on it. An order: the cores in {yer:kiyikent_liman|pos} water pumps are to be pulled to fire the harpoon. \"We're gonna throw a rock at that thing in the sky,\" he says. \"Those pumps are the arm that throws it.\"" }
          - { tr: "Havuzun kenarında Konsey'in pompacısı, yirmilik bir kız, aynı kâğıdın bir kopyasını yumruğunda buruşturmuş. \"O pompalar ambarlara su basıyor,\" diyor. \"O gün aşağıda üç yüz kişi olacak. Susuz.\"", en: "At the edge of the dock, the Council's pump tech, a young woman of about twenty, has a copy of the same order crumpled in her fist. \"Those pumps feed water to the storerooms,\" she says. \"Three hundred people are going to be down there on the day. With no water.\"" }
          - metin: { tr: "{npc:kaya_demir} havuzun üst kenarında, ellerini korkuluğa dayamış, işi izliyor. Emrin altındaki imza onun.", en: "{npc:kaya_demir} is up on the dock's rim, hands on the railing, watching the work. The signature on that order is his." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "Ambarları sen doldurdun. Kapılarına tebeşirle yazılan sayıları biliyorsun; hepsi o pompalara göre hesaplandı.", en: "You're the one who stocked those storerooms. You know the numbers chalked on their doors, and every one of them assumed those pumps." }
            kosul: { bayrak: "hazirlik_gemi_siginak" }
        sezgiler:
          - kosul: { stat: { int: 30 } }
            metin: { tr: "Zincirin halkaları vapurun çapasına göre dövülmüş, bir zıpkının ani çekişine göre değil. Ateşleme yükünde önce ortadaki halkalar uzar.", en: "The chain links were forged for a ferry's anchor, not for the sudden jerk of a harpoon. Under a firing load, the middle links stretch first." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "suyu verip taş alıyorlar. insanlar hep bunu yapar. sonra taşı içemeyince şaşırırlar.", en: "they're trading water for a rock. people always do that. then they're surprised when they can't drink the rock." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Üç yüz kişi, kapalı bir ambar, iki gün susuz. Sonunu ben mi anlatayım?\"", en: "\"Three hundred people, a sealed storeroom, two days without water. Want me to tell you how that ends?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bence havalı. Yanlış, ama havalı.\"", en: "\"Honestly? It's cool. Wrong, but cool.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Fiziksel saldırı. Kadim seviyesinde bir sisteme. Bunu kayda geçirmem lazım; tarihin en kısa kaydı olacak.\"", en: "\"A physical attack. On an Ancient-tier system. I have to log this. It'll be the shortest log in history.\"" }
        secenekler:
          - id: "cekirdek"
            etiket: { tr: "Kendi çekirdeklerinden birini ver; pompalara dokunulmasın", en: "Give up one of your own cores. The pumps stay put" }
            etkiler:
              - dikkat: 1
              - ahlak: { merhamet: 2 }
              - itibar: { lonca: 1, siginak: 1 }
              - bayrak: "bl9_zipkin_cekirdek"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_son"
          - id: "hesap"
            etiket: { tr: "Zincirin hesabını ustabaşının önüne koy", en: "Lay out the chain's math for the foreman" }
            gerekli: { stat: { int: 30 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_zipkin_duzeltildi"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_hesap"
          - id: "siginak"
            etiket: { tr: "Konsey adına pompaların önüne geç", en: "Stand in front of the pumps on the Council's behalf" }
            goster: { bayrak: "uye_siginak" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - itibar: { siginak: 2, lonca: -2 }
              - bayrak: "bl9_pompalar_korundu"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_son"
          - id: "kaya"
            etiket: { tr: "Korkuluğa çık, {npc:kaya_demir|le} yüz yüze konuş", en: "Climb up to the railing. Talk to {npc:kaya_demir} face to face" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 2, guven: 1 } }
            sonraki: "bl9_zipkin_ocak_kaya"
          - id: "sabote"
            tur: "gizle"
            etiket: { tr: "Gece dönüp zincirin bir halkasını gevşet", en: "Come back at night and loosen a link in the chain" }
            etkiler:
              - gizle: 1
              - ahlak: { duzen: -2 }
              - bayrak: "bl9_zipkin_sabote"
              - bayrak: "bl9_pompalar_sokuldu"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "Gevşettiğin halkayı taşıyan zıpkını bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Word is they're hauling the harpoon to {yer:kule_dibi} today. The one with your loosened link in its chain." } }
            sonraki: "bl9_zipkin_ocak_sabote"
          - id: "birak"
            etiket: { tr: "\"Pompalar mı zıpkın mı, {fraksiyon:lonca} bilir.\"", en: "\"Pumps or harpoon, that's the Guild's call.\"" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: 1 }
              - bayrak: "bl9_pompalar_sokuldu"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_son"

      - id: "bl9_zipkin_ocak_kaya"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} gözünü havuzdan ayırmadan dinliyor. \"Pompaları biliyorum,\" diyor sonunda. \"Bu şehrin üç haftadır başını kaldıramadığını da biliyorum. İnsan korkudan önce umutsuzluktan ölür, evlat. Ben onlara bir silah gösteriyorum.\"", en: "{npc:kaya_demir} listens without taking his eyes off the dock. \"I know about the pumps,\" he says finally. \"I also know this city hasn't lifted its head in three weeks. People die of hopelessness before they die of fear, kid. I'm showing them a weapon.\"" }
          - { tr: "\"Bana daha iyi bir kol getir,\" diye ekliyor, \"pompaları geri takarım. Getiremiyorsan çekil önümden.\"", en: "\"Bring me a better arm,\" he adds, \"and I'll put the pumps back. If you can't, get out of my way.\"" }
        secenekler:
          - id: "cekirdek"
            etiket: { tr: "Kendi çekirdeğini korkuluğun üstüne koy", en: "Set one of your own cores on the railing" }
            etkiler:
              - dikkat: 1
              - iliski: { kaya_demir: { saygi: 2 } }
              - itibar: { lonca: 2 }
              - bayrak: "bl9_zipkin_cekirdek"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_son"
          - id: "cekil"
            etiket: { tr: "Çekil; karar {fraksiyon:lonca|in}", en: "Step aside. The Guild's call" }
            etkiler:
              - bayrak: "bl9_pompalar_sokuldu"
              - tohum: { olay: "bl9_zipkin_deneme", gecikme: { min: 2, max: 3 }, kosul: { bolum: 9, gun_max: 174 }, hatirlatma: { tr: "{yer:sanayi|de} dövülen zıpkın o günden beri herkesin ağzında; bugün {yer:kule_dibi|e} çekiyorlarmış.", en: "Everybody's been talking about the harpoon they forged in {yer:sanayi}. Word is they're hauling it to {yer:kule_dibi} today." } }
            sonraki: "bl9_zipkin_ocak_son"

      - id: "bl9_zipkin_ocak_hesap"
        yer: "sanayi"
        paragraflar:
          - { tr: "Havuzun beton kenarına tebeşirle çiziyorsun: çekiş yükü, halka kalınlığı, ateşleme anındaki sarsıntı. Ustabaşı Nevzat çizgileri uzun uzun süzüyor, sonra yanındaki demirciye bağırıyor: \"Ortadaki on halkayı yeniden döv! Çift kat!\"", en: "You chalk it out on the dock's concrete lip: pull load, link thickness, the jolt at the moment of firing. Foreman Nate studies the lines a long time, then hollers at the smith beside him. \"Reforge the middle ten links! Double thickness!\"" }
          - { tr: "\"Menzili değişmez ama,\" diyorsun. \"Işığa varmaz.\" Nevzat omuz silkiyor. \"Varması gerekmiyor ki. Uçması gerekiyor. Ok yaydan çıkarken insanlar başını kaldırır.\"", en: "\"Doesn't change the range,\" you say. \"It won't reach the light.\" Nate shrugs. \"Doesn't have to reach. Has to fly. People look up when the arrow leaves the bow.\"" }
        secenekler:
          - id: "pompa"
            etiket: { tr: "\"O zaman pompaları geri tak, kolu ben bulurum.\"", en: "\"Then put the pumps back. I'll find you an arm.\"" }
            etkiler:
              - dikkat: 1
              - itibar: { siginak: 1 }
              - bayrak: "bl9_zipkin_cekirdek"
            sonraki: "bl9_zipkin_ocak_son"
          - id: "tamam"
            etiket: { tr: "Tebeşiri bırak; gerisi onların işi", en: "Put down the chalk. The rest is on them" }
            etkiler:
              - bayrak: "bl9_pompalar_sokuldu"
            sonraki: "bl9_zipkin_ocak_son"

      - id: "bl9_zipkin_ocak_sabote"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısı havuzda bir tek bekçi köpeği uyanık; seni koklayıp başını yeniden patilerine koyuyor. Zincirin ortasındaki bir halkayı keskiyle kertip kertiği isle sıvıyorsun. Kimse fark etmeyecek; ta ki zincir gerilene dek.", en: "At midnight the only thing awake in the dock is the guard dog, and it sniffs you and puts its head back on its paws. You notch a link in the middle of the chain with a chisel and smear the notch with soot. Nobody's going to notice. Not till the chain goes taut." }
          - { tr: "Çıkarken pompacı kızı havuzun kenarında oturur buluyorsun; pompaları çoktan sökmüşler. Seni görmüyor. Dizlerinin arasına bir kova almış, boş kovanın dibine bakıyor.", en: "On your way out you find the pump tech sitting at the edge of the dock. The pumps are already pulled. She doesn't see you. She's got a bucket between her knees and she's staring into it. It's empty." }
        secenekler:
          - id: "git"
            etiket: { tr: "Sessizce uzaklaş", en: "Slip away quietly" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "kova"
            etiket: { tr: "Yanına otur; kovayı birlikte doldurun", en: "Sit down with her. Fill the bucket together" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl9_zipkin_ocak_son"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "Çekirdeği ustabaşına uzattığında kuru havuz bir an susuyor. Çekirdek elinden çıkınca ritmini değiştirmiyor; hâlâ senin nabzınla atıyor. Nevzat onu ateşleme yuvasına yerleştirirken bir şey söylemiyor ama elleri biraz titriyor.", en: "When you hand the core to the foreman, the dry dock goes quiet for a second. Out of your hand, the core doesn't change rhythm. It's still beating with your pulse. Nate doesn't say anything as he fits it into the firing cradle, but his hands shake a little." }
            kosul: { bayrak: "bl9_zipkin_cekirdek" }
          - metin: { tr: "Pompacı kız buruşuk kâğıdı açıp düzeltiyor, sana bakıp başıyla teşekkür ediyor. Pompalar yerinde kalacak.", en: "The pump tech smooths out her crumpled copy, looks at you, and nods her thanks. The pumps are staying." }
            kosul: { herhangi: [{ bayrak: "bl9_zipkin_cekirdek" }, { bayrak: "bl9_pompalar_korundu" }] }
          - metin: { tr: "Kamyon akşamüstü {yer:kiyikent_liman|den} üç çekirdekle dönüyor. Pompacı kız arkasından yürüyor, elinde kimsenin okumayacağı bir kâğıt.", en: "Late afternoon, the truck comes back from {yer:kiyikent_liman} with three cores. The pump tech walks behind it, holding a piece of paper nobody's going to read." }
            kosul: { bayrak: "bl9_pompalar_sokuldu", bayrak_yok: "bl9_zipkin_cekirdek" }
          - { tr: "Çapanın kolları artık tamamen kıvrılmış. Demirciler çengeli suya daldırıyor, buhar bir bulut gibi kuru havuzu dolduruyor. Bir an kimse ışıklara bakmıyor; herkes kendi yaptığı şeye bakıyor.", en: "The anchor's arms are curled all the way in now. The smiths plunge the barb into water, and steam fills the dry dock like a cloud. For a moment nobody's looking at the lights. Everybody's looking at the thing they made." }
        secenekler:
          - id: "git"
            etiket: { tr: "Buharın içinden yürüyüp çık", en: "Walk out through the steam" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "dokun"
            etiket: { tr: "Soğuyan çengele bir an dokun", en: "Touch the cooling barb once" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== SANAYİ · kamp 1/1 · Elif
  - id: "bl9_kamp_elif"
    kamp: true
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 152, max: 177 }
    kosul: { bolum: 9 }
    npc: ["elif_sari"]
    gerilim: 1
    etiketler: ["kamp", "elif", "npc", "siginak"]
    kart: { tr: "Siyah etiketler", en: "Black tags" }
    sahne: "bl9_kamp_elif_1"
    sahneler:
      - id: "bl9_kamp_elif_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Ocaklardan biri hâlâ sönmemiş; kamp ateşi yerine onun közünün başına oturmuşsunuz. {npc:elif_sari} kucağındaki sac parçalarından küçük etiketler kesiyor, her birini bir boya kutusuna batırıyor: kırmızı, sarı, yeşil, siyah.", en: "One of the forges is still banked, so instead of a campfire you're sitting by its coals. {npc:elif_sari} is cutting little tags out of scrap sheet metal in her lap and dipping each one in a paint can: red, yellow, green, black." }
          - { tr: "\"Kâğıt yanar,\" diyor, sen sormadan. \"O gün ne olacağını bilmiyoruz. Bildiğimiz tek şey, aynı anda çok kişinin yaralanacağı. Triyaj etiketi bunlar. Kırmızı hemen, sarı bekleyebilir, yeşil yürüyebilir.\"", en: "\"Paper burns,\" she says before you can ask. \"We don't know what happens on the day. All we know is a lot of people get hurt at once. Triage tags. Red's now, yellow can wait, green can walk.\"" }
          - { tr: "Siyahları ayrı bir yığına koyuyor; onlara dokunurken elleri yavaşlıyor. \"Siyah, kurtarılamaz demek. Onu bağlayan, kalbini bir dakikalığına kapatmalı. Ben bunu yıllarca yaptım. Artık... yapabileceğimden emin değilim.\"", en: "She puts the black ones in their own pile. Her hands slow down when she touches them. \"Black means can't be saved. Whoever ties it has to shut their heart off for a minute. I did that for years. Now... I'm not sure I still can.\"" }
          - metin: { tr: "Uyku ilacı kuyruğundaki o geceden beri çantasındaki kutuları bir daha saymamış.", en: "She hasn't counted the boxes in her bag again since that night with the sleeping-pill line." }
            kosul: { herhangi: [{ bayrak: "sb9_elif_ilac_dagitildi" }, { bayrak: "sb9_elif_stok_kilit" }, { bayrak: "sb9_elif_ayiklandi" }] }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Siyah yığında yirmi etiket var. Kesip boyadığı ilk yirmi etiket.", en: "There are twenty tags in the black pile. The first twenty she cut and painted." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "siyahı kimin bağlayacağını soruyor. asıl sorduğu, kime bağlanacağı. ikisini birden düşün.", en: "she's asking who ties the black ones. what she really means is who gets one. think about both." }
        secenekler:
          - id: "ben"
            etiket: { tr: "\"O gün siyahları ben bağlarım.\"", en: "\"On the day, I'll tie the black ones.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl9_kamp_elif", agirlik: 20 }
              - bayrak: "bl9_kamp_elif_siyah"
            sonraki: "bl9_kamp_elif_2"
          - id: "hic"
            etiket: { tr: "\"Kimseye siyah bağlamayacağız.\"", en: "\"Nobody's getting a black tag.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { baglilik: 3, saygi: -1 } }
            sonraki: "bl9_kamp_elif_2"
          - id: "birak"
            etiket: { tr: "Makası elinden al: \"Bir dakikalığına sen bırak.\"", en: "Take the shears from her. \"You put it down for a minute.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 2, guven: 2 } }
            sonraki: "bl9_kamp_elif_2"

      - id: "bl9_kamp_elif_2"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:elif_sari} siyah yığını kucağından alıp önüne koyuyor. \"Tamam,\" diyor. Sesi titremiyor, ama siyahları elinden bırakınca omuzları ilk kez düşüyor.", en: "{npc:elif_sari} picks up the black pile and sets it down in front of you. \"Okay,\" she says. Her voice doesn't shake, but when she lets go of them her shoulders drop for the first time." }
            kosul: { bayrak: "bl9_kamp_elif_siyah" }
          - { tr: "Bir süre ikiniz de közlere bakıyorsunuz. {yer:sanayi|in} sessizliği tuhaf: gündüzleri çekiç sesinden kulak duymuyor, geceleri bir köpeğin havlaması bile duvarlarda yankılanıyor.", en: "For a while you both just watch the coals. {yer:sanayi|b} is weirdly quiet. By day you can't hear yourself think over the hammers, and at night even one dog barking echoes off the walls." }
          - { tr: "\"Hastanede gece nöbetinde de böyle olurdu,\" diyor {npc:elif_sari}. \"Herkes uyurken ben koridorda yürürdüm. Bir yatak gıcırdasa kalkardım. Dünya bitti, ben hâlâ gıcırtı bekliyorum.\"", en: "\"Night shift at the hospital was like this,\" {npc:elif_sari} says. \"Everybody asleep, me walking the halls. One bed squeaks and I'm up. The world ended and I'm still listening for squeaks.\"" }
        secenekler:
          - id: "nobet"
            etiket: { tr: "\"Bu gece gıcırtıları ben dinlerim.\"", en: "\"I'll listen for squeaks tonight.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: 1 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Közleri karıştır; konuşmaya gerek yok", en: "Stir the coals. No need to talk" }
            sonraki: "@akis"

  # ================================================================== ESKİ ŞEHİR 1/1 · yedi vuruş (havuz; bl9_isik_olcer'i tohumlar)
  - id: "bl9_saat"
    konum: ["eski_sehir"]
    perde: [2]
    gun: { min: 152, max: 171 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["kesif", "eski_sehir", "kadim", "olcum"]
    gerilim: 2
    kart: { tr: "Her saat yedi", en: "Seven, every hour" }
    sahne: "bl9_saat_1"
    sahneler:
      - id: "bl9_saat_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} dar sokaklarında öğleden sonra üçü geçerken saat kulesi yedi kez çalıyor. Çan sesi taş evlerin arasında yuvarlanıp sönerken kimse şaşırmıyor; herkesin gözlerinin altı mor.", en: "It's past three in the afternoon in the narrow streets of {yer:eski_sehir} when the clock tower chimes seven times. The bell rolls between the stone houses and dies away, and nobody looks surprised. Everybody's got dark circles under their eyes." }
          - { tr: "Kulenin kapısına bir dilekçe çivilenmiş, altında yüzlerce imza: Susturun şunu. Kapının önünde yetmişini aşkın saatçi Bedri Bey duruyor; yeleği yağ lekesi içinde, elinde bir yağdanlık. \"Makinede arıza yok,\" diyor imzalara bakmadan. \"Her saatin başında çekici kendim kuruyorum. Biri gelip yediye ayarlıyor.\"", en: "There's a petition nailed to the tower door with hundreds of signatures under it: SHUT IT UP. Out front stands Mr. Bertram, the clock keeper, seventy if he's a day, vest spotted with oil, an oilcan in his hand. \"Nothing wrong with the works,\" he says without looking at the signatures. \"I set the hammer myself at the top of every hour. Something comes along and sets it to seven.\"" }
          - { tr: "\"Işıklar çıktığından beri böyle,\" diye ekliyor. \"Geceleri kadastrodan emekli bir ölçücü {yer:kule_dibi|den} aynayla kuleye işaret veriyor, ben de buradan cevap veriyorum. Çana bir tek o aldırmıyor.\"", en: "\"Ever since the lights,\" he adds. \"Nights, a retired county surveyor flashes a mirror up at the tower from {yer:kule_dibi}, and I answer him from up top. He's the only one who doesn't mind the bell.\"" }
          - metin: { tr: "Kulenin dibinde beyaz giysili iki Yükselen bekliyor. Çan her yedinci vuruşu bitirdiğinde diz çöküp alınlarını taşa koyuyorlar.", en: "Two of {fraksiyon:yukselenler|k} in white wait at the foot of the tower. Every time the bell finishes its seventh stroke, they kneel and press their foreheads to the stones." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Köşedeki {fraksiyon:lonca} kulübesinde nöbetçi kulaklarına pamuk tıkamış.", en: "The {fraksiyon:lonca} sentry in the corner booth has cotton stuffed in his ears." }
            kosul: { bayrak: "cekirdek_lonca" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Çan her yedinci vuruşta bir nefes kadar gecikiyor. Işıkların yanıp sönme aralığı da tam bu kadar.", en: "The bell lags by about one breath on every seventh stroke. That's exactly how far apart the lights blink." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "biri bu şehrin saatini kuruyor. ev sahipleri böyledir: gelmeden önce bütün saatleri kendi saatine ayarlar.", en: "somebody's setting this city's clock. that's how landlords are. before they show up, they set every clock to their own time." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yedi vuruş, aralar eşit değil. Bu bir sinyal. Kopyalanmış bir sinyal.\"", en: "\"Seven strokes, uneven spacing. That's a signal. A copied signal.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bu mahallede üç gündür kimse uyumadı. Uykusuzluk insanı ışıklardan önce öldürür.\"", en: "\"Nobody in this neighborhood's slept in three days. Sleep deprivation will kill people before the lights do.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bana sorsalar çanı söküp atardım. Soran olmadı tabii.\"", en: "\"If anybody asked me, I'd rip the bell out. Nobody asked, obviously.\"" }
        secenekler:
          - id: "sustur"
            etiket: { tr: "Kuleye çıkıp çekici bağla; mahalle bir gece uyusun", en: "Climb up and tie off the hammer. Let the neighborhood sleep one night" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - bayrak: "bl9_saat_susturuldu"
              - tohum: { olay: "bl9_isik_olcer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 173 } }
            sonraki: "bl9_saat_sustur"
          - id: "dinle"
            etiket: { tr: "Kuleye çık, çanın iç dudağına dokun", en: "Climb the tower. Touch the inside lip of the bell" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - bayrak: "bl9_saat_muhur"
              - tohum: { olay: "bl9_isik_olcer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 173 } }
            sonraki: "bl9_saat_muhur"
          - id: "calsin"
            etiket: { tr: "Bedri Bey'e bırak: \"Saat senin, usta.\"", en: "Leave it to Mr. Bertram. \"It's your clock, sir.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_saat_calsin"
              - tohum: { olay: "bl9_isik_olcer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 173 } }
            sonraki: "bl9_saat_calsin"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic} vuruşları kaydetsin", en: "Have {npc:mert_kilic} record the strokes" }
            goster: { yoldas: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2, saygi: 2 } }
              - bayrak: "bl9_saat_calsin"
              - bayrak: "bl9_saat_mert"
              - tohum: { olay: "bl9_isik_olcer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 173 } }
            sonraki: "bl9_saat_calsin"
          - id: "imza"
            etiket: { tr: "Dilekçeye sen de imza at", en: "Sign the petition yourself" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl9_saat_susturuldu"
              - tohum: { olay: "bl9_isik_olcer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 173 } }
            sonraki: "bl9_saat_sustur"

      - id: "bl9_saat_sustur"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kulenin dar merdiveninden çıkıp çekici çelik telle çerçeveye bağlıyorsun. Saat dörtte çark inleyip zorluyor, tel geriliyor ama kopmuyor. Sonra hiçbir şey olmuyor.", en: "You climb the tower's narrow stairs and wire the hammer to its frame. At four o'clock the gears groan and strain and the wire goes taut, but it holds. And then nothing happens." }
          - { tr: "Sokak bir an kulak kabartıyor. Ardından bir pencere kapanıyor, bir tane daha; aşağıda bir çocuk kahkaha atıyor. Bedri Bey parmaklarını kadranın camında gezdiriyor. \"Kırk yıldır bir kez susmamıştı,\" diyor.", en: "The street holds its breath for a second. Then a window shuts, then another, and down below a kid laughs out loud. Mr. Bertram runs his fingers across the glass of the clock face. \"Forty years, it never once went quiet,\" he says." }
          - { tr: "Kulenin tepesinden bakınca {yer:kule_dibi|de} bir ayna parlıyor: bir uzun, iki kısa. Ölçücü buradan cevap bekliyor.", en: "From the top of the tower you can see a mirror flashing down in {yer:kule_dibi}: one long, two short. The surveyor's waiting for an answer from up here." }
        secenekler:
          - id: "ayna"
            etiket: { tr: "Bedri Bey'in aynasını al; ölçücüye cevap ver", en: "Take Mr. Bertram's mirror. Answer the surveyor" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "in"
            etiket: { tr: "Aşağı in; mahalle uyusun", en: "Head down. Let the neighborhood sleep" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl9_saat_muhur"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Çanın altına girip parmağını bronzun iç dudağında gezdiriyorsun. Dışarıda yaz sıcağı var, ama metalin içi buz kesmiş; ince bir kırağı yedi köşeli bir desen çizmiş. Parmak ucun uyuşuyor.", en: "You duck under the bell and run a finger along the inside lip of the bronze. Outside it's summer-hot, but the inside of the metal is ice cold, and a fine frost has drawn a seven-sided pattern on it. Your fingertip goes numb." }
          - { tr: "Önünde bir pencere açılıyor, bu kez senin Sistem'inden: [Bilinmeyen zaman eşitlemesi. Kaynak: yörünge. Kalan süre panellerle uyumlu.]", en: "A window opens in front of you, from your own System this time: [Unknown time synchronization. Source: orbit. Remaining time matches the panels.]" }
          - { tr: "Aşağıda {yer:kule_dibi|de} bir ayna parlıyor: bir uzun, iki kısa. Ölçücü kuleden cevap bekliyor.", en: "Down in {yer:kule_dibi}, a mirror flashes: one long, two short. The surveyor's waiting for an answer from the tower." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kırağı. yukarıda hava hep soğuktur. bir şey elini çana koymuş, sen de onun parmak izine dokundun.", en: "frost. it's always cold up there. something put its hand on that bell, and you just touched its fingerprint." }
        secenekler:
          - id: "kazi"
            etiket: { tr: "Kırağıyı tırnağınla kazı", en: "Scrape the frost off with your nail" }
            etkiler:
              - dikkat: 1
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "ayna"
            etiket: { tr: "Aynayı alıp ölçücüye cevap ver", en: "Grab the mirror and answer the surveyor" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_saat_calsin"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Bedri Bey yağdanlığı yeleğinin cebine sokuyor. \"Saat yalan söylemez,\" diyor. \"Bir şey anlatıyor bize. Belki yedi gün kaldı diyor, belki yedi kişi. Ben dinlemeye devam edeceğim.\"", en: "Mr. Bertram tucks the oilcan into his vest pocket. \"A clock doesn't lie,\" he says. \"It's telling us something. Maybe seven days left, maybe seven people. I'm going to keep listening.\"" }
          - metin: { tr: "{npc:mert_kilic} telefonunu kuleye doğru tutmuş, beş vuruşu kaydedip ekrana bakıyor. \"Aralıklar ışıklarla aynı,\" diyor alçak sesle. \"Saniyesi saniyesine. Biri bu şehrin bütün saatlerini aynı ritme bağlıyor.\"", en: "{npc:mert_kilic} has his phone up at the tower, records five strokes, and stares at the screen. \"Same intervals as the lights,\" he says quietly. \"To the second. Somebody's syncing every clock in this city to one rhythm.\"" }
            kosul: { bayrak: "bl9_saat_mert" }
          - { tr: "Dilekçenin altına biri yeni bir satır eklemiş: Saatçiye dokunmayın. Altında tek bir imza var.", en: "Someone's added a new line under the petition: Leave the clock keeper alone. There's one signature under it." }
        secenekler:
          - id: "imza"
            etiket: { tr: "İkinci imzayı sen at", en: "Add the second signature" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Bir sonraki vuruşu beklemeden yürü", en: "Leave before the next stroke" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== ESKİ ŞEHİR · kamp 1/1 · Mert
  - id: "bl9_kamp_mert"
    kamp: true
    konum: ["eski_sehir"]
    perde: [2]
    gun: { min: 152, max: 177 }
    kosul: { bolum: 9, npc_hayatta: "mert_kilic" }
    npc: ["mert_kilic"]
    gerilim: 1
    etiketler: ["kamp", "mert", "npc", "sessiz_ag"]
    kart: { tr: "Pilsiz gece", en: "Dead battery" }
    sahne: "bl9_kamp_mert_1"
    sahneler:
      - id: "bl9_kamp_mert_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Gece için bir taş evin düz damına çıkmışsınız. {npc:mert_kilic|in} dizüstü bilgisayarının pili akşamüstü bitmiş; hayatında ilk kez önünde ekran olmadan oturuyor. Ellerini nereye koyacağını bilemiyor.", en: "You've set up for the night on the flat roof of a stone house. {npc:mert_kilic|pos} laptop died late in the afternoon, and for the first time in his life he's sitting there with no screen in front of him. He doesn't know what to do with his hands." }
          - { tr: "Sonunda çantasından spiralli bir defter çıkarıyor, el fenerini dişlerinin arasına alıp yazmaya başlıyor. Yazısı berbat. Sayfanın başında büyük harflerle: BENİOKU.", en: "Eventually he digs a spiral notebook out of his bag, clamps a flashlight between his teeth, and starts writing. His handwriting is terrible. Across the top of the page, in capitals: README." }
          - metin: { tr: "Saat kulesi uzakta sessiz duruyor. Mahallede ışıklar çıktığından beri ilk kez biri horluyor.", en: "The clock tower stands silent in the distance. For the first time since the lights showed up, somebody in the neighborhood is snoring." }
            kosul: { bayrak: "bl9_saat_susturuldu" }
          - metin: { tr: "Saat kulesi gece yarısını yedi vuruşla haber veriyor. {npc:mert_kilic} kalemini durdurmadan vuruşları sayıyor.", en: "The clock tower announces midnight with seven strokes. {npc:mert_kilic} counts them without lifting his pen." }
            kosul: { bayrak_yok: "bl9_saat_susturuldu" }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Sayfanın ortasında senin adın var. İki kez yazılmış, ikisinin de üstü çizilmiş, sonra üçüncü kez yazılmış.", en: "Your name's in the middle of the page. Written twice, crossed out twice, then written a third time." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "makineler kaybolunca insanlar el yazısına döner. el yazısı yalan söyleyemez. ona bak.", en: "when the machines die people go back to handwriting. handwriting can't lie. look at it." }
        secenekler:
          - id: "oku"
            etiket: { tr: "\"Okuyabilir miyim?\"", en: "\"Can I read it?\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3 } }
              - bayrak: "bl9_kamp_mert_okundu"
            sonraki: "bl9_kamp_mert_2"
          - id: "satir"
            etiket: { tr: "\"Benim için de bir satır ekle.\"", en: "\"Add a line for me.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 3, saygi: 1 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl9_kamp_mert", agirlik: 15 }
            sonraki: "bl9_kamp_mert_2"
          - id: "uyu"
            etiket: { tr: "\"Pil bitmişken sen de bitir. Uyu biraz.\"", en: "\"Battery's dead. Call it a night too. Get some sleep.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { mert_kilic: { baglilik: 2, guven: 1 } }
            sonraki: "bl9_kamp_mert_2"

      - id: "bl9_kamp_mert_2"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Defteri sana uzatırken kulakları kızarıyor. Maddeler halinde: 1. Bilgisayarın şifresi yok, aç. 2. Sistem bir program; kaynak kodu var, bulamadım. 3. Kayıtlar tarih sırasında. 4. Bunu okuyorsan ben yokum demektir. Panik yapma. Sonra güvenebileceğin tek kişinin adı geliyor: seninki.", en: "His ears go red as he hands you the notebook. It's a list: 1. Laptop has no password, just open it. 2. The System is a program. It has source code. I didn't find it. 3. Logs are in date order. 4. If you're reading this, I'm gone. Don't panic. And then the name of the one person you can trust: yours." }
            kosul: { bayrak: "bl9_kamp_mert_okundu" }
          - { tr: "{npc:mert_kilic} feneri söndürüp sırtüstü uzanıyor. Gökte yedi ışık, her zamanki yerlerinde. \"Hep bir ekranın arkasından baktım onlara,\" diyor. \"Çıplak gözle daha büyükler.\"", en: "{npc:mert_kilic} clicks off the flashlight and lies back. Up in the sky, seven lights, right where they always are. \"I've always looked at them through a screen,\" he says. \"They're bigger with your naked eye.\"" }
          - { tr: "Bir süre sonra nefesi ağırlaşıyor. Uyuyakalmış; defter göğsünün üstünde, kalem hâlâ parmaklarının arasında.", en: "After a while his breathing slows. He's fallen asleep with the notebook on his chest and the pen still between his fingers." }
        secenekler:
          - id: "ortu"
            etiket: { tr: "Ceketini üstüne ört", en: "Drape your jacket over him" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 1 } }
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Defteri kapatıp ışıkları sen izle", en: "Close the notebook and watch the lights yourself" }
            sonraki: "@akis"

  # ================================================================== TEPE 1/1 · kireçten yedigen (havuz; bl9_ambar'ı tohumlar)
  - id: "bl9_tepe"
    konum: ["tepe"]
    perde: [2]
    gun: { min: 152, max: 174 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["kesif", "tepe", "yukselenler", "kadim", "cocuk"]
    gerilim: 3
    kart: { tr: "Kireçten yedigen", en: "A heptagon in lime" }
    sahne: "bl9_tepe_1"
    sahneler:
      - id: "bl9_tepe_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} doruğundaki eski futbol sahası bembeyaz bir çizgiyle bölünmüş. Beyaz giysili Yükselenler el arabalarıyla kireç taşıyıp sahaya dev bir yedigen çiziyor; köşeleri ışıkların gökteki yerine denk gelecek biçimde ölçülmüş.", en: "The old soccer field at the top of {yer:tepe} has been cut up with a bright white line. {fraksiyon:yukselenler|b} in white are wheeling in barrows of lime and laying out a giant heptagon on the grass, its corners measured to match where the lights sit in the sky." }
          - { tr: "Yedigenin ortasında yalınayak bir düzine çocuk ilahi provası yapıyor. Hoparlörlerden {npc:vahit|in} kayıtlı sesi yayılıyor: \"Bekleyenler yukarıdakini değil, hazır olanı seçer. Hazır olun.\"", en: "In the middle of the heptagon a dozen barefoot kids are rehearsing a hymn. {npc:vahit|pos} recorded voice rolls out of the loudspeakers. \"The Waiting Ones don't choose the ones up high. They choose the ones who are ready. Be ready.\"" }
          - { tr: "Sahanın tel örgüsünün dışında Sevim adında bir kadın parmaklarını tellere geçirmiş, çocuklardan birine bakıyor. On yaşındaki oğlu; o gün yedigenin tam ortasında duracak çocuk olarak seçilmiş. Kapıdaki rehber kadını içeri almıyor.", en: "Outside the chain-link fence, a woman named Sylvia has her fingers hooked through the wire, watching one of the kids. Her son, ten years old, picked to stand dead center in the heptagon on the day. The guide at the gate won't let her in." }
          - metin: { tr: "Rehber seni görünce başını eğiyor. \"Kardeş,\" diyor. \"Provayı onurlandırdın.\"", en: "The guide bows his head when he sees you. \"Brother,\" he says. \"You honor the rehearsal.\"" }
            kosul: { bayrak: "uye_yukselenler" }
          - metin: { tr: "{yer:kasaba_cekirdegi} {fraksiyon:yukselenler|e} geçtiğinden beri tepedeki hoparlörler hiç susmuyor; kablolar Çekirdek'in mavi ışığıyla besleniyor.", en: "Ever since {yer:kasaba_cekirdegi} went to {fraksiyon:yukselenler|k}, the loudspeakers on the hill never shut off. The cables run on the Core's blue light." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { wis: 30 } }
            metin: { tr: "Köşelerdeki kirecin içine ezilmiş kapı çekirdeği karıştırılmış. Gece ışık verecek. Bu bir süs değil, bir işaret ateşi; yukarıya \"buradayız\" diyor.", en: "There's crushed Gate core mixed into the lime at the corners. It'll glow at night. This isn't decoration. It's a signal fire, telling whatever's up there: here we are." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "aşağıdan yukarıya bir hedef tahtası çiziyorlar. ortasına da bir çocuk koyuyorlar. insanlar işte.", en: "they're drawing a target that faces up. and putting a kid in the middle of it. people, man." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "kardes_yukselenlerde" }
            metin: { tr: "\"Kardeşim bunların arasında mı? Bak. Bak bir. Lütfen.\"", en: "\"Is my sister in there with them? Look. Just look. Please.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kireç çıplak tene değerse yakar. O çocuklar o çizgide saatlerdir yalınayak.\"", en: "\"Lime burns bare skin. Those kids have been barefoot on that line for hours.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Karşılama komitesi. Bir pankart eksik, o kadar.\"", en: "\"Welcome committee. All that's missing is a banner.\"" }
        secenekler:
          - id: "kacir"
            tur: "gizle"
            etiket: { tr: "Gece telin altından oğlanı çıkar, anneyle {yer:kiyikent_liman|e} yolla", en: "Tonight, get the boy out under the fence and send them to {yer:kiyikent_liman}" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { yukselenler: -2 }
              - bayrak: "bl9_tepe_kacti"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_tepe_kacis"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} Sevim'le konuşsun; geceyi birlikte planlayın", en: "Let {npc:deniz_arman} talk to Sylvia. Plan the night together" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, baglilik: 3 } }
              - ahlak: { merhamet: 2 }
              - itibar: { yukselenler: -1 }
              - bayrak: "bl9_tepe_kacti"
              - bayrak: "bl9_tepe_deniz"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_tepe_kacis"
          - id: "sil"
            tur: "gosteris"
            etiket: { tr: "Kireç çizgisini herkesin önünde tek hamlede sil", en: "Wipe out the lime line in one sweep, in front of everyone" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -1, merhamet: 1 }
              - itibar: { yukselenler: -3 }
              - tehlike: { tepe: 2 }
              - bayrak: "bl9_tepe_cizgi_silindi"
              - bayrak: "bl9_tepe_kacti"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_tepe_sil"
          - id: "emir"
            etiket: { tr: "Rehbere {npc:vahit|in} adını an: \"Oğlan annesine dönsün.\"", en: "Invoke {npc:vahit|pos} name to the guide. \"The boy goes back to his mother.\"" }
            goster: { bayrak: "uye_yukselenler", npc_hayatta: "vahit" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { vahit: { saygi: 2, guven: -2 } }
              - bayrak: "bl9_tepe_birakildi"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_tepe_emir"
          - id: "kirec"
            etiket: { tr: "Köşelerden birindeki kirece avucunu bastır", en: "Press your palm into the lime at one of the corners" }
            gerekli: { stat: { wis: 30 } }
            etkiler:
              - bayrak: "bl9_tepe_isaret"
            sonraki: "bl9_tepe_kirec"
          - id: "birak"
            etiket: { tr: "Omuz silk; bu senin kavgan değil", en: "Shrug. Not your fight" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - bayrak: "bl9_tepe_kaldi"
            sonraki: "bl9_tepe_birak"

      - id: "bl9_tepe_kirec"
        yer: "tepe"
        paragraflar:
          - { tr: "Kireç avucunu yakarken altında bir şey kıpırdıyor: ezilmiş çekirdeklerin soluk mavi nabzı, yedi köşede yedi ayrı nabız, hepsi birlikte atıyor. Akşam inince bu saha gökten bakana bir fener gibi parlayacak.", en: "The lime burns your palm, and underneath it something stirs: the faint blue pulse of crushed cores, seven corners, seven pulses, all in time. When night comes down this field will light up like a beacon to anything looking from the sky." }
          - { tr: "Ortadaki oğlan provayı bırakıp sana bakıyor. Annesi telin öbür yanında nefesini tutmuş.", en: "The boy in the middle stops singing and looks at you. On the other side of the fence, his mother's holding her breath." }
        secenekler:
          - id: "sondur"
            etiket: { tr: "Köşelere su dök; feneri yakmadan söndür", en: "Pour water on the corners. Kill the beacon before it lights" }
            etkiler:
              - ahlak: { duzen: -1 }
              - itibar: { yukselenler: -1 }
              - tehlike: { tepe: -1 }
              - bayrak: "bl9_tepe_sonduruldu"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "kacir"
            etiket: { tr: "Sevim'e başınla işaret et: bu gece", en: "Give Sylvia a nod. Tonight" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { yukselenler: -2 }
              - bayrak: "bl9_tepe_kacti"
              - tohum: { olay: "bl9_ambar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_tepe_kacis"

      - id: "bl9_tepe_kacis"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece yarısı telin altını kazıyorsunuz. Oğlanın beyaz giysisi karanlıkta fazla parlıyor; üstüne çamur sürüyorsun. Gözetleme dronu sahanın üstünden bir kez geçiyor, ışığı yedigenin parlayan köşelerine takılıp kalıyor.", en: "At midnight you dig under the fence. The boy's white clothes glow too much in the dark, so you smear them with mud. A surveillance drone sweeps over the field once, and its beam gets stuck on the heptagon's glowing corners." }
          - metin: { tr: "{npc:deniz_arman} oğlanı sırtına almış, Sevim'in elini bırakmadan yokuşu iniyor. Arkasına bir kez bile bakmıyor.", en: "{npc:deniz_arman} has the boy on their back and doesn't let go of Sylvia's hand all the way down the hill. Doesn't look back once." }
            kosul: { bayrak: "bl9_tepe_deniz" }
          - { tr: "{yer:kiyikent_liman} yoluna vardığınızda oğlan annesinin omzundan başını kaldırıyor. \"Ama ben ortada duracaktım,\" diyor. Sesinde korkudan çok kırgınlık var.", en: "When you reach the road to {yer:kiyikent_liman}, the boy lifts his head off his mother's shoulder. \"But I was supposed to stand in the middle,\" he says. There's more hurt in it than fear." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "\"Ortada durmak için daha çok vaktin var.\"", en: "\"You've got plenty of time to stand in the middle.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey deme; yürümeye devam et", en: "Don't say anything. Keep walking" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_tepe_sil"
        yer: "tepe"
        paragraflar:
          - { tr: "Telin üstünden atlayıp ayağını kireç çizgisinde sürüyorsun; tek hamlede yedigenin bir kenarı toz bulutuna dönüşüyor. Beyaz giysililer çığlık atarken hoparlördeki ses cümlenin ortasında cızırdayıp kesiliyor.", en: "You vault the fence and drag your foot along the lime line, and in one sweep a whole side of the heptagon turns to a cloud of dust. The people in white scream as the voice on the loudspeakers crackles and cuts off mid-sentence." }
          - { tr: "Kargaşada Sevim kapıdan dalıp oğlunu kucaklıyor. Rehberler onları durdurmaya çalışmıyor; hepsi sana bakıyor, kimi korkuyla, kimi hiç saklamadığı bir nefretle.", en: "In the chaos Sylvia charges through the gate and scoops up her son. The guides don't try to stop them. They're all staring at you, some scared, some with a hatred they don't bother hiding." }
          - { tr: "Akşam olunca yedigenin kalan altı köşesi yine parlıyor. Gökteki ışıklardan biri, eksik köşenin üstünde, bir kez sönüp yanıyor.", en: "When evening comes, the heptagon's six remaining corners glow anyway. Up in the sky, one of the lights, the one over the missing corner, blinks once." }
        secenekler:
          - id: "git"
            etiket: { tr: "Sevim'le oğlunu yokuştan aşağı götür", en: "Walk Sylvia and her son down the hill" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "dur"
            etiket: { tr: "Rehberlerin bakışlarına karşılık ver", en: "Stare the guides down" }
            etkiler:
              - dikkat: 1
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl9_tepe_emir"
        yer: "tepe"
        paragraflar:
          - { tr: "Rehber bir an bocalıyor, sonra kapıyı açıp oğlanı kolundan çıkarıyor. Sevim çocuğunu tutar tutmaz yokuşa doğru yürümeye başlıyor; bir kez bile durmuyor.", en: "The guide hesitates a second, then opens the gate and walks the boy out by the arm. The instant Sylvia has hold of him she starts down the hill and doesn't stop once." }
          - { tr: "Rehber cebinden küçük bir defter çıkarıp adını yazıyor. \"Peygamber her şeyi bilmek ister, kardeş,\" diyor. Hoparlörlerde ses hiç durmadan devam ediyor.", en: "The guide pulls a little notebook from his pocket and writes down your name. \"The Prophet likes to know everything, brother,\" he says. The voice on the loudspeakers keeps going, never pausing." }
        secenekler:
          - id: "git"
            etiket: { tr: "Başını salla ve sahadan ayrıl", en: "Nod and leave the field" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "ilahi"
            etiket: { tr: "Kalan çocuklara bir kez daha bak", en: "Look at the rest of the kids one more time" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl9_tepe_birak"
        yer: "tepe"
        paragraflar:
          - { tr: "Arkanı dönüp yokuşa yürüyorsun. İlahi peşini bırakmıyor; çocuk sesleri hoparlörün cızırtısına karışıp tepenin her yanına yayılıyor.", en: "You turn your back and head down the hill. The hymn follows you, kids' voices mixed in with the loudspeaker crackle, spreading all over the hill." }
          - { tr: "Son kez dönüp baktığında Sevim hâlâ orada; parmakları tellere geçmiş, kıpırdamadan duruyor.", en: "When you look back one last time, Sylvia is still there, fingers hooked in the wire, not moving." }
        secenekler:
          - id: "git"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "dur"
            etiket: { tr: "Bir an dur, sonra yine yürü", en: "Stop for a second, then keep going" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== KORDON 1/1 · göğe kabaran su (havuz; bl9_olcum_konsey'i tohumlar)
  - id: "bl9_kordon"
    konum: ["kordon"]
    perde: [2]
    gun: { min: 152, max: 174 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["kesif", "kordon", "kadim", "deniz"]
    gerilim: 2
    kart: { tr: "Kazıktaki çizgiler", en: "Marks on the piling" }
    sahne: "bl9_kordon_1"
    sahneler:
      - id: "bl9_kordon_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Gün doğmadan {yer:kordon|in} iskelesinde balıkçılar ağlarını topluyor; ışıklar sönmeden işi bitirmek, onlara bakmamak istiyorlar. İskelenin ucundaki ahşap kazıkta alt alta boya çizgileri var, her biri bir öncekinden bir parmak yukarıda.", en: "Before sunrise on the pier along {yer:kordon}, the fishermen are hauling in their nets. They want to be done before the lights fade, without ever looking up at them. On the wooden piling at the end of the pier there's a column of paint marks, each one a finger higher than the last." }
          - { tr: "Çizgileri her sabah yetmişlik Cemal Dayı çekiyor. \"Su yükseliyor,\" diyor. \"Gelgit değil bu. Körfezin ortası kabarıyor, ışıkların tam altı. Su göğe doğru çekiliyor evlat; masa örtüsünü ortasından tutup kaldırır gibi.\"", en: "Old Gus, seventy-some, paints a new mark every morning. \"Water's rising,\" he says. \"That's no tide. The middle of the bay's swelling up, right under the lights. The water's being pulled toward the sky, son, like somebody lifting a tablecloth by the middle.\"" }
          - { tr: "On yedi yaşındaki torunu Barış bir kayığın ıskarmozlarını yağlıyor. Bu gece kabarmanın üstüne kürek çekip ne olduğuna bakacakmış. Dedesi bağırıyor, torunu duymazdan geliyor.", en: "His grandson Bobby, seventeen, is greasing the oarlocks on a skiff. Tonight he's going to row out over the swell and see what it is. His grandfather yells at him. He pretends not to hear." }
          - metin: { tr: "{yer:kordon} düştüğünden beri iskelede yalnız üç kayık kalmış. Ötekilerin sahipleri ya kaçmış ya da balkonlardan bir daha inmemiş.", en: "Since {yer:kordon} fell, there are only three boats left at the pier. The owners of the rest either ran or never came down off their balconies again." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Balkonlarda çamaşırlar yeniden asılı, iskele eskisi kadar kalabalık. Geçen herkes Cemal Dayı'nın çizgilerine bir göz atıp hızlanıyor.", en: "Laundry's back up on the balconies, and the pier's as busy as it ever was. Everybody who walks by sneaks a glance at Gus's marks and picks up the pace." }
            kosul: { bayrak: "kordon_kurtarildi" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Kabarmanın üstündeki su rüzgâr esse de kırışmıyor. Altında bir şey yok; çeken şey üstünde.", en: "The water on top of the swell doesn't ripple, even with the wind blowing. There's nothing underneath it. Whatever's pulling is above." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "suyu kaldırıp tartıyorlar. ne kadar ağır olduğuna bakıyorlar. her şeyi tartarlar. bizi de.", en: "they're lifting the water to weigh it. seeing how heavy it is. they weigh everything. us too." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Gece kürek çekmek mi? Ben gelirim. Yani... biri onunla gitmeli.\"", en: "\"Rowing out at night? I'll go. I mean... somebody should go with him.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"On yedi yaşında. Ben o yaştayken... neyse. Ben de aptaldım.\"", en: "\"He's seventeen. When I was seventeen... never mind. I was an idiot too.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Su yüzeyinin profilini çıkarabilirsem kütleyi hesaplarım. Neyin kütlesini, onu sorma.\"", en: "\"If I can profile the water surface, I can calculate the mass. Don't ask me the mass of what.\"" }
        secenekler:
          - id: "kurek"
            etiket: { tr: "Gece Barış'la birlikte kürek çek", en: "Row out with Bobby tonight" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["kopuk_ruhu@dunya", "kopuk_ruhu@dunya"], ortam: ["su", "karanlik"], kazan: "bl9_kordon_zafer", kaybet: "bl9_kordon_yenilgi", kac: "bl9_kordon_kacis" }
          - id: "durdur"
            etiket: { tr: "Kayığın küreklerini al: \"Bu gece değil.\"", en: "Take the skiff's oars. \"Not tonight.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_kordon_genc_kaldi"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_kordon_durdur"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} Barış'la konuşsun", en: "Let {npc:deniz_arman} talk to Bobby" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, baglilik: 2 } }
              - ahlak: { merhamet: 1 }
              - bayrak: "bl9_kordon_genc_kaldi"
              - bayrak: "bl9_kordon_deniz"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_kordon_durdur"
          - id: "olcum"
            etiket: { tr: "Cemal Dayı'nın çizgilerini Konsey'e taşımayı teklif et", en: "Offer to take Gus's marks to the Council" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_kordon_olcum"
              - bayrak: "bl9_kordon_genc_kaldi"
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_kordon_olcum"
          - id: "dinle"
            etiket: { tr: "Kıyıya çömel, suyun sesini dinle", en: "Crouch at the edge and listen to the water" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - bayrak: "bl9_kordon_dinlendi"
            sonraki: "bl9_kordon_dinle"
          - id: "birak"
            etiket: { tr: "Barış'a iyi şanslar dile", en: "Wish Bobby luck" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - bayrak: "bl9_kordon_genc_kayip"
              - tehlike: { kordon: 2 }
            sonraki: "bl9_kordon_birak"

      - id: "bl9_kordon_dinle"
        yer: "kordon"
        paragraflar:
          - { tr: "Kulağını suya yaklaştırınca bir uğultu duyuyorsun; dalga sesi değil, çok uzaklardan gelen bir nefes. Körfez içine soluk çekiyor ve vermiyor.", en: "You put your ear close to the water and hear a hum. Not waves. A breath, from very far away. The bay is breathing in, and it isn't breathing out." }
          - { tr: "Barış'a ne duyduğunu anlatıyorsun. Çocuk kürekleri elinde tutup bir süre suya bakıyor, sonra yavaşça yere bırakıyor.", en: "You tell Bobby what you heard. He stands there holding the oars and stares at the water a while, then sets them down slowly." }
        secenekler:
          - id: "konsey"
            etiket: { tr: "\"Bunu Konsey duymalı. Çizgileri ben götürürüm.\"", en: "\"The Council needs to hear this. I'll take the marks to them.\"" }
            etkiler:
              - bayrak: "bl9_kordon_olcum"
              - bayrak: "bl9_kordon_genc_kaldi"
              - xp_seviye: 12
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"
          - id: "dede"
            etiket: { tr: "Cemal Dayı'nın yanına otur; bir çizgi de sen çek", en: "Sit with Gus. Paint the next mark yourself" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl9_kordon_genc_kaldi"
              - xp_seviye: 12
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"

      - id: "bl9_kordon_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Son köpük ruhu küreğinin altında dağılıp suya karışıyor. Kabarmanın üstünde deniz cam gibi; kayığın burnu yavaş yavaş yukarı kalkıyor, sanki görünmeyen bir rampaya tırmanıyorsunuz.", en: "The last foam wraith breaks apart under your oar and melts into the water. On top of the swell the sea is like glass, and the skiff's bow is slowly lifting, like you're climbing an invisible ramp." }
          - { tr: "Barış elini suya uzatıyor. \"Ilık,\" diye fısıldıyor. \"Uğulduyor.\" Kayık bir karış havalandığı anda onu yakasından çekip küreklere asılıyorsun.", en: "Bobby reaches down into the water. \"It's warm,\" he whispers. \"It's humming.\" The moment the skiff lifts a hand's width off the surface, you haul him back by the collar and throw yourself on the oars." }
          - { tr: "İskeleye vardığınızda Cemal Dayı fenerle bekliyor. Torununu görünce feneri yere bırakıp ona bir tokat atıyor, sonra sarılıp bırakmıyor.", en: "When you make the pier, Gus is waiting with a lantern. When he sees his grandson he sets the lantern down and smacks him across the face, then grabs him in a hug and won't let go." }
        secenekler:
          - id: "konsey"
            etiket: { tr: "\"Gördüklerimizi Konsey'e anlatacağız.\"", en: "\"We're telling the Council what we saw.\"" }
            etkiler:
              - bayrak: "bl9_kordon_genc_dondu"
              - bayrak: "bl9_kordon_olcum"
              - tehlike: { kordon: -2 }
              - xp_seviye: 15
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Kayığı kıyıya çek, kimseye bir şey söyleme", en: "Drag the skiff up the beach. Say nothing to anybody" }
            etkiler:
              - bayrak: "bl9_kordon_genc_dondu"
              - tehlike: { kordon: -2 }
              - gizle: 1
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl9_kordon_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Köpük ruhları seni kayıktan çekip ılık, uğuldayan suya gömüyor. Gözünü açtığında iskelenin tahtaları sırtının altında; Barış üstüne eğilmiş, sırılsıklam.", en: "The foam wraiths drag you out of the skiff and down into the warm, humming water. When you open your eyes, the pier boards are under your back and Bobby's leaning over you, soaked." }
          - { tr: "\"Seni ben çektim,\" diyor dişleri birbirine vurarak. \"Kayık havalandı. Bir karış. Yemin ederim havalandı.\"", en: "\"I pulled you out,\" he says, teeth chattering. \"The boat lifted. A whole hand. I swear it lifted.\"" }
        secenekler:
          - id: "devam"
            etiket: { tr: "Doğrul; Cemal Dayı'ya olanları anlatın", en: "Sit up. Tell Gus what happened" }
            etkiler:
              - bayrak: "bl9_kordon_genc_dondu"
              - bayrak: "bl9_kordon_olcum"
              - can: 20
              - xp_seviye: 8
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"

      - id: "bl9_kordon_kacis"
        yer: "kordon"
        paragraflar:
          - { tr: "Köpük ruhları kayığın çevresinde çoğalınca küreği kıyıya çeviriyorsun. Barış itiraz etmiyor; o da gördü.", en: "When the foam wraiths start multiplying around the skiff, you swing the bow back toward shore. Bobby doesn't argue. He saw it too." }
          - { tr: "İskeleye vardığınızda Cemal Dayı kazığa yeni bir çizgi çekiyor. Bu gecenin çizgisi dünkünden iki parmak yukarıda.", en: "When you reach the pier, Gus is painting a new mark on the piling. Tonight's line is two fingers higher than yesterday's." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kayığı bağla", en: "Tie up the skiff" }
            etkiler:
              - bayrak: "bl9_kordon_genc_dondu"
              - xp_seviye: 6
              - tohum: { olay: "bl9_olcum_konsey", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "@akis"

      - id: "bl9_kordon_durdur"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Barış küreklere yapışıyor, bağırıyor, sonra birden bırakıyor. \"Babam o vapurdaydı,\" diyor. \"Suyun altında ne varsa onu görmek istedim, o kadar.\" Cemal Dayı torununun başını göğsüne bastırıyor.", en: "Bobby hangs onto the oars, yelling, then all at once he lets go. \"My dad was on that ferry,\" he says. \"I just wanted to see what's down there. That's all.\" Gus pulls his grandson's head against his chest." }
            kosul: { bayrak_yok: "bl9_kordon_deniz" }
          - metin: { tr: "{npc:deniz_arman} Barış'ın yanına oturup kayığın kenarına bir martı çiziyor. \"Ben de o vapurdaydım,\" diyor. \"Suyun altında bir şey yok. Olan her şey yukarıda.\" Barış uzun süre martıya bakıyor, sonra kürekleri bırakıyor.", en: "{npc:deniz_arman} sits down next to Bobby and draws a gull on the side of the skiff. \"I was on that ferry too,\" {npc:deniz_arman} says. \"There's nothing down there. Everything's up there.\" Bobby stares at the gull a long time, then lets go of the oars." }
            kosul: { bayrak: "bl9_kordon_deniz" }
          - { tr: "Güneş doğarken Cemal Dayı kazığa günün çizgisini çekiyor. Bu sabah fırçayı Barış tutuyor.", en: "As the sun comes up, Gus paints the day's mark on the piling. This morning Bobby's the one holding the brush." }
        secenekler:
          - id: "git"
            etiket: { tr: "İskeleden ayrıl", en: "Leave the pier" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Güneş tamamen doğana dek onlarla bekle", en: "Wait with them till the sun's all the way up" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl9_kordon_olcum"
        yer: "kordon"
        paragraflar:
          - { tr: "Cemal Dayı bir an seni süzüyor, sonra kazığın çizgili kısmını testereyle kesip eline tutuşturuyor. \"Işıklar çıktığından beri her gece,\" diyor. \"Her gece bir parmak. Konsey'deki o kalem efendilerine bunu okusunlar.\"", en: "Gus sizes you up for a second, then saws off the marked section of the piling and puts it in your hands. \"Every night since the lights showed up,\" he says. \"A finger a night. Let those pencil pushers on the Council read that.\"" }
          - { tr: "Barış kürekleri yağlamayı bırakıp başını kaldırıyor. \"Konsey dinlerse beklerim,\" diyor. \"Dinlemezse giderim.\"", en: "Bobby stops greasing the oarlocks and looks up. \"If the Council listens, I'll wait,\" he says. \"If they don't, I'm going.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Dinleyecekler. Söz.\"", en: "\"They'll listen. I promise.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Tahtayı koltuğunun altına alıp yürü", en: "Tuck the board under your arm and go" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl9_kordon_birak"
        yer: "kordon"
        paragraflar:
          - { tr: "Barış sırıtıp sana el sallıyor. O gece kayığın feneri körfezin ortasına doğru küçülüyor, küçülüyor, sonra kabarmanın üstünde bir an asılı kalıp sönüyor.", en: "Bobby grins and waves at you. That night the skiff's lantern shrinks toward the middle of the bay, smaller and smaller, then hangs on top of the swell for a moment and goes out." }
          - { tr: "Sabah Cemal Dayı kazığa yine bir çizgi çekiyor. Yanına fırçayla, titrek harflerle bir ad yazıyor.", en: "In the morning Gus paints another mark on the piling. Next to it, in shaky brushstrokes, he writes a name." }
        secenekler:
          - id: "git"
            etiket: { tr: "Başını eğip iskeleden ayrıl", en: "Bow your head and leave the pier" }
            etkiler:
              - xp_seviye: 6
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Cemal Dayı'nın yanında bir süre otur", en: "Sit with Gus a while" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 6
            sonraki: "@akis"

  # ================================================================== ÜS 1/3 · ambarların kapısı (havuz; bl9_zipkin_deneme ve bl9_tepe tohumlar)
  - id: "bl9_ambar"
    konum: ["us"]
    perde: [2]
    gun: { min: 153, max: 176 }
    kosul: { bolum: 9 }
    agirlik: 5
    etiketler: ["liman", "siginak", "kalabalik"]
    gerilim: 3
    kart: { tr: "Tebeşirle yazılmış kapılar", en: "Chalked doors" }
    sahne: "bl9_ambar_1"
    sahneler:
      - id: "bl9_ambar_1"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "{yer:kule_dibi|de} yapılan atıştan sonra şehirde tek bir söz dolaşıyor: ışıklar meydana döndü. İnsanlar o geceden beri ambarlara akın ediyor.", en: "Since the shot at {yer:kule_dibi}, there's only one thing anybody in the city is saying: the lights turned toward the plaza. People have been pouring into the storerooms ever since." }
            kosul: { herhangi: [{ bayrak: "bl9_zipkin_atildi" }, { bayrak: "bl9_zipkin_isik_sondu" }] }
          - { tr: "{yer:kiyikent_liman|in} altındaki ambarların demir kapıları önünde gece yarısı bir kalabalık birikmiş. Kapıların üstünde tebeşirle yazılmış sayılar var: kırk, otuz beş, elli. Başhemşire Nurhan elinde kayıt sırasına göre yazılmış bir listeyle kapının önünde dikiliyor.", en: "Past midnight, a crowd has piled up at the iron doors of the storerooms under {yer:kiyikent_liman}. There are numbers chalked over the doors: forty, thirty-five, fifty. Nora, the head nurse, stands out front holding a list in order of sign-up." }
          - { tr: "{yer:kiyikent_liman|de} oturanlar bağırıyor: \"Biz önce yazıldık!\" {yer:tepe|den}, {yer:kordon|den} inenler kapıya yükleniyor. Nurhan'ın sesi uğultuda kayboluyor, bir adam da tebeşirle yazılmış sayıyı parmağıyla silip yerine daha büyüğünü yazmaya uğraşıyor.", en: "{yer:kiyikent_liman|b} folks are yelling. \"We signed up first!\" The people down from {yer:tepe} and {yer:kordon} are shoving at the doors. Nora's voice gets lost in the noise. One man is rubbing out a chalked number with his finger and trying to write a bigger one." }
          - metin: { tr: "Kalabalığın en arkasında Sevim duruyor, oğlunun omzuna bir battaniye sarmış. {yer:tepe|den} kaçtıkları gece doğruca buraya gelmişler; listede adları yok.", en: "At the very back of the crowd stands Sylvia, a blanket around her son's shoulders. They came straight here the night they fled {yer:tepe}. Their names aren't on the list." }
            kosul: { bayrak: "bl9_tepe_kacti" }
          - metin: { tr: "Raflardaki bidon ve çuvalların hesabını ezbere biliyorsun; hepsini kendin taşıdın.", en: "You know the count of every jug and sack on those shelves by heart. You carried them all down yourself." }
            kosul: { bayrak: "hazirlik_gemi_siginak" }
          - metin: { tr: "Ambarların yarısı hâlâ boş; raflarda sandık yerine örümcek ağı var.", en: "Half the storerooms are still empty. There are cobwebs on the shelves where the crates should be." }
            kosul: { bayrak_yok: "hazirlik_gemi_siginak" }
          - metin: { tr: "Pompalar söküldüğünden beri ambarlara su kovalarla taşınıyor. Kapının önünde bidon bidon bir zincir uzanıyor.", en: "Since the pumps got pulled, water's been hauled down to the storerooms by the bucket. There's a chain of jugs stretched out in front of the doors." }
            kosul: { bayrak: "bl9_pompalar_sokuldu" }
          - metin: { tr: "Rıza Reis megafonla kalabalığı yatıştırmaya çalışıyor, ama megafonun pili zayıf.", en: "Skipper Reese is on a bullhorn trying to calm the crowd down, but the batteries are going." }
            kosul: { bayrak: "riza_konsey_basi" }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Kalabalığın arkası aslında ilerlemiyor; öne yüklenenlerin hepsi kucağında çocuk taşıyor. Korku arkadan geliyor.", en: "The back of the crowd isn't actually moving forward. Everybody shoving up front is carrying a kid. The fear's coming from behind." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kapının dışında kalanlar içeridekileri hiç affetmez. bunu bilerek seç.", en: "the ones left outside a door never forgive the ones behind it. choose knowing that." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Liste benim fikrimdi. Şu an listeden nefret ediyorum.\"", en: "\"The list was my idea. Right now I hate that list.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Balkon defterimi getireyim mi? Kimin bacağı tutmuyor, orada yazıyor.\"", en: "\"Want me to grab my balcony notebook? It says who can't do stairs.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kura. Adil olan tek algoritma rastgelelik.\"", en: "\"Lottery. Randomness is the only fair algorithm.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kapıyı ben tutarım. Kimse geçemez. Kimin gireceğine siz karar verin.\"", en: "\"I'll hold the door. Nobody gets through. You all figure out who goes in.\"" }
        secenekler:
          - id: "liste"
            etiket: { tr: "Nurhan'ın yanına geç: liste listedir", en: "Stand with Nora. The list is the list" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl9_ambar_liste"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"
          - id: "ac"
            etiket: { tr: "Kapıları aç; liste sonra yazılır", en: "Open the doors. The list can wait" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl9_ambar_acildi"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"
          - id: "kura"
            etiket: { tr: "Kura çektir; şans herkese eşit", en: "Hold a lottery. Same odds for everybody" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl9_ambar_kura"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"
          - id: "kapasite"
            etiket: { tr: "Gerçek kapasiteyi söyle: tebeşirdeki sayılar eksik", en: "Tell them the real capacity. The chalked numbers are low" }
            goster: { bayrak: "hazirlik_gemi_siginak" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl9_ambar_kapasite"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} kalabalığa konuşsun; sen yanında dur", en: "Let {npc:elif_sari} address the crowd. Stand beside her" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_ambar_elif"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"
          - id: "sustur"
            etiket: { tr: "Bir kasaya çık, kalabalığı tek sesle sustur", en: "Get up on a crate and silence the crowd with one word" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - dikkat: 1
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_ambar_sustu"
              - tohum: { olay: "bl9_ambar_gece", gecikme: { min: 1, max: 2 }, kosul: { bolum: 9, gun_max: 177 } }
            sonraki: "bl9_ambar_son"

      - id: "bl9_ambar_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Nurhan listeyi iki eliyle göğsüne bastırıp başıyla teşekkür ediyor. Herkes sırasıyla içeri giriyor; listede olmayanlar merdivenlere oturup bekliyor. Kimse bağırmıyor artık, ama kimse kimseye bakmıyor da.", en: "Nora holds the list to her chest with both hands and nods her thanks. People go in in list order. The ones who aren't on it sit down on the stairs and wait. Nobody's yelling anymore, but nobody's looking at anybody either." }
            kosul: { bayrak: "bl9_ambar_liste" }
          - metin: { tr: "Kapılar ardına kadar açılınca kalabalık içeri akıyor. Kırk kişilik odalara elli kişi giriyor; kimi sandığın üstünde, kimi yerde. Nurhan listeyi katlayıp cebine koyuyor ve yeni bir sayfa açıyor.", en: "When the doors swing wide, the crowd floods in. Fifty people pack into rooms meant for forty, some on crates, some on the floor. Nora folds up her list, puts it in her pocket, and starts a fresh page." }
            kosul: { bayrak: "bl9_ambar_acildi" }
          - metin: { tr: "Biri bir kova buluyor, defterden koparılan yapraklara adlar yazılıp kovaya atılıyor. Kurada adı çıkan her aile bir alkış alıyor, çıkmayanlar birbirine sarılıyor. Adil mi, bilen yok; ama kimse hile yapıldığını söyleyemiyor.", en: "Somebody finds a bucket, somebody tears pages out of a notebook, and the names go in. Every family that gets drawn gets a round of applause. The ones who don't hold on to each other. Fair? Nobody knows. But nobody can say it was rigged." }
            kosul: { bayrak: "bl9_ambar_kura" }
          - metin: { tr: "Tebeşiri alıp her kapının sayısını yeniden yazıyorsun: kırk yerine elli beş, otuz beş yerine kırk sekiz. Raflardaki su da un da buna yeter. Kalabalık sayıların büyüdüğünü görünce ağır ağır sakinleşiyor.", en: "You take the chalk and rewrite every door: fifty-five instead of forty, forty-eight instead of thirty-five. The water and flour on the shelves will stretch that far. Watching the numbers go up, the crowd slowly settles down." }
            kosul: { bayrak: "bl9_ambar_kapasite" }
          - metin: { tr: "{npc:elif_sari} kasanın üstüne çıkıp sesini hiç yükseltmeden konuşuyor; kalabalık onu duymak için susmak zorunda kalıyor. \"Hepinize yer bulacağım,\" diyor. \"Bu gece değilse yarın. Ama itenler en son girecek.\" Kimse itmiyor.", en: "{npc:elif_sari} gets up on a crate and talks without raising her voice at all, so the crowd has to shut up to hear her. \"I'll find room for every one of you,\" she says. \"If not tonight, tomorrow. But whoever shoves goes in last.\" Nobody shoves." }
            kosul: { bayrak: "bl9_ambar_elif" }
          - metin: { tr: "Kasaya çıkıp tek bir söz söylüyorsun. Sesin limanın üstünden geçip suya varıyor; kalabalık olduğu yerde donup kalıyor. Bir dakika sonra Nurhan herkesi sıraya diziyor, ama kimi sana minnetle, kimi korkuyla bakıyor.", en: "You get up on a crate and say one word. Your voice carries across the harbor and out over the water, and the crowd freezes where it stands. A minute later Nora has everybody lined up, though some of them are looking at you with gratitude and some with fear." }
            kosul: { bayrak: "bl9_ambar_sustu" }
          - metin: { tr: "Sevim oğluyla birlikte kapıdan giriyor. Oğlan eşikte durup sana el sallıyor; giysisini ters çevirmişler, beyazı içte kalmış.", en: "Sylvia goes through the doors with her son. The boy stops on the threshold and waves at you. They've turned his clothes inside out so the white doesn't show." }
            kosul: { bayrak: "bl9_tepe_kacti", bayrak_yok: "bl9_ambar_liste" }
          - { tr: "Işıklardan biri tam ambarların üstünde, öbürlerinden bir parça alçakta duruyor. Kapının önündeki tebeşir tozu rüzgârla dağılıyor.", en: "One of the lights hangs right over the storerooms, a little lower than the rest. The chalk dust in front of the doors scatters on the wind." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Bidonları içeri taşımaya yardım et", en: "Help haul the water jugs inside" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "Sabaha kadar kapının önünde nöbet tut", en: "Stand watch at the doors till morning" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== ÜS 2/3 · içeri açılan kapı (tohum)
  - id: "bl9_ambar_gece"
    konum: ["us"]
    perde: [2]
    yalniz_tohum: true
    kosul: { bolum: 9 }
    gerilim: 3
    etiketler: ["liman", "siginak", "kalabalik"]
    kart: { tr: "İçeri açılan kapı", en: "The door that opens in" }
    sahne: "bl9_ambar_gece_1"
    sahneler:
      - id: "bl9_ambar_gece_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ambarlarda ilk gece. Kırk kişilik odada elli kişi var; tavandaki tek ampul göz kırpıp duruyor. Vapurun eski çarkçısı Hayri Usta kapının menteşesini parmağıyla gösteriyor.", en: "First night in the storerooms. Fifty people in a room for forty, and the single bulb in the ceiling flutters like a moth. Hank, an old ship's engineer who used to run the ferry's engine room, points a finger at the door hinges." }
          - { tr: "\"Bu kapı içeri açılıyor,\" diyor. \"Panikte herkes kapıya yüklenir; kapı da kapanır, bir daha açılmaz. Vapurda böyle kapı takanı denize atarlardı.\"", en: "\"This door opens in,\" he says. \"Panic hits, everybody piles against it, and it shuts and never opens again. On a ferry, they'd throw the guy who hung a door like that overboard.\"" }
          - metin: { tr: "Kurada çıkan adlar duvara çivilenmiş; kimin hangi odada kalacağı yazılı.", en: "The lottery names are nailed to the wall, each one with a room next to it." }
            kosul: { bayrak: "bl9_ambar_kura" }
          - metin: { tr: "Listeye giremeyenler dışarıda, merdivenlerde yatıyor. Kapının aralığından ayakları görünüyor.", en: "The ones who didn't make the list are sleeping out on the stairs. You can see their feet through the gap under the door." }
            kosul: { bayrak: "bl9_ambar_liste" }
          - metin: { tr: "Sevim'in oğlu duvarın dibinde uyuyor, ters çevrilmiş beyaz giysisinin içinde.", en: "Sylvia's son is asleep against the wall in his inside-out whites." }
            kosul: { bayrak: "bl9_tepe_kacti" }
          - metin: { tr: "Köşede kovalar dizili; suyun yarısı yolda dökülmüş.", en: "There's a row of buckets in the corner. Half the water spilled on the way down." }
            kosul: { bayrak: "bl9_pompalar_sokuldu" }
          - { tr: "Tam o sırada havalandırma ızgarasından bir ışık sızıyor. Yedi ışıktan biri sönüp yanarken ızgaranın gölgesi duvarda kıpırdıyor. Oda bir an susuyor; sonra biri çığlık atıyor ve herkes aynı anda kapıya yükleniyor.", en: "Right then, light seeps in through the vent grate. One of the seven blinks off and on, and the grate's shadow jerks across the wall. The room goes silent for a second. Then somebody screams, and everybody lunges for the door at once." }
        sezgiler:
          - kosul: { stat: { per: 25 } }
            metin: { tr: "Kapının dibinde biri yere düşmüş. Kalabalık üstüne basmadan önce iki, belki üç saniye var.", en: "Somebody's gone down at the foot of the door. Two seconds before the crowd steps on them, maybe three." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir ışık söndü yandı, elli kişi birbirini ezmeye kalktı. onlara dokunmaları gerekmiyor bile.", en: "one light blinked and fifty people tried to trample each other. they don't even have to touch them." }
        secenekler:
          - id: "omuz"
            etiket: { tr: "Kapıya sırtını ver, kalabalığı tek başına tut", en: "Put your back to the door. Hold the crowd off alone" }
            gerekli: { stat: { str: 30 } }
            etkiler:
              - dikkat: 1
              - ahlak: { merhamet: 1 }
              - bayrak: "bl9_ambar_kapi_tutuldu"
            sonraki: "bl9_ambar_gece_son"
          - id: "izgara"
            etiket: { tr: "Ceketini çıkarıp ızgaraya bastır; ışığı kes", en: "Strip off your jacket and jam it over the grate. Cut the light" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_ambar_izgara"
            sonraki: "bl9_ambar_gece_son"
          - id: "hayri"
            etiket: { tr: "Hayri'ye bağır: \"Menteşenin pimini çek!\"", en: "Yell at Hank. \"Pull the hinge pins!\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_ambar_mentese"
            sonraki: "bl9_ambar_gece_son"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} çocukları köşeye toplasın", en: "Have {npc:deniz_arman} gather the kids in the corner" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 2, saygi: 2 } }
              - ahlak: { merhamet: 1 }
              - bayrak: "bl9_ambar_deniz"
            sonraki: "bl9_ambar_gece_son"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt} kapının önüne geçsin", en: "Get {npc:aras_kurt} in front of the door" }
            goster: { yoldas: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 2, guven: 1 } }
              - bayrak: "bl9_ambar_kapi_tutuldu"
            sonraki: "bl9_ambar_gece_son"

      - id: "bl9_ambar_gece_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Kalabalığın ağırlığı sırtına biniyor; demir kapı arkanda inlerken sen kıpırdamıyorsun. Öndekiler dönüp kimin önlerinde durduğunu görünce teker teker geri çekiliyor. Yere düşen kadını biri kolundan tutup kaldırıyor.", en: "The weight of the crowd lands on your back, and the iron door groans behind you, but you don't budge. The ones up front turn around, see who's standing in their way, and back off one at a time. Somebody grabs the woman on the floor by the arm and hauls her up." }
            kosul: { bayrak: "bl9_ambar_kapi_tutuldu", bayrak_yok: "bl9_ambar_deniz" }
          - metin: { tr: "Ceketini ızgaraya bastırınca oda karanlığa gömülüyor. Işık yok olunca korku da ağır ağır çekiliyor; biri gülüyor, biri ağlıyor, biri ampulü yeniden yakıyor.", en: "You jam your jacket over the grate and the room drops into darkness. With the light gone, the fear drains off slowly. Somebody laughs, somebody cries, somebody switches the bulb back on." }
            kosul: { bayrak: "bl9_ambar_izgara" }
          - metin: { tr: "Hayri tornavidayla menteşe pimlerini söküyor; kapı bir yana yatıyor, kalabalık dışarıya, merdivene taşıp dağılıyor. Kimse ezilmiyor. Yaşlı adam yere oturup soluklanıyor. \"Denizde böyle olur,\" diyor. \"Kapı tutmazsa kapıyı sökersin.\"", en: "Hank goes at the hinge pins with a screwdriver. The door tips aside, the crowd spills out onto the stairs and spreads out, and nobody gets crushed. The old man sits down on the floor to catch his breath. \"That's how it goes at sea,\" he says. \"Door won't hold, you take the door off.\"" }
            kosul: { bayrak: "bl9_ambar_mentese" }
          - metin: { tr: "{npc:deniz_arman} kollarını açıp çocukları köşeye topluyor, onlara bir şarkı söylemeye başlıyor; vapurda martılara söylediği şarkı. Kalabalık yavaşlıyor, çünkü çocuklar artık ağlamıyor.", en: "{npc:deniz_arman} spreads both arms, herds the kids into the corner, and starts singing to them, the song from the ferry, the one for the gulls. The crowd slows down, because the kids aren't crying anymore." }
            kosul: { bayrak: "bl9_ambar_deniz" }
          - { tr: "Sabaha karşı Hayri kapıyı menteşelerinden söküp ters takıyor; artık dışarı açılıyor. \"Vapurda nasılsa öyle,\" diyor. Ambarın öbür kapılarına da aynısını yapmak için alet çantasını topluyor.", en: "Toward morning Hank takes the door off its hinges and rehangs it the other way. Now it opens out. \"The way it's done on a ferry,\" he says, and packs up his toolbox to do the same to every other storeroom door." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Hayri'ye öbür kapılarda yardım et", en: "Help Hank with the other doors" }
            etkiler:
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl9_ambar_kapi_disa"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "tatbikat"
            etiket: { tr: "Her gece bir tatbikat yapılsın", en: "Run a drill every night from now on" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl9_ambar_kapi_disa"
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ÜS 3/3 · Konsey'deki rakamlar (tohum; bl9_isik_olcer ya da bl9_kordon)
  - id: "bl9_olcum_konsey"
    konum: ["us"]
    perde: [2]
    yalniz_tohum: true
    kosul: { bolum: 9 }
    gerilim: 2
    etiketler: ["liman", "siginak", "kadim", "olcum"]
    kart: { tr: "Masadaki rakamlar", en: "Numbers on the table" }
    sahne: "bl9_olcum_konsey_1"
    sahneler:
      - id: "bl9_olcum_konsey_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük binasının üst katındaki Konsey odası tıklım tıklım. Masanın üstünde rakamlar var; kimse onlara uzun uzun bakmak istemiyor.", en: "The Council room on the top floor of the Customs House is packed. There are numbers on the table, and nobody wants to look at them too long." }
          - metin: { tr: "Halit Usta defterinin arka sayfasını masaya yaymış: bir çember, yedi nokta, ortada bir kare. \"Çemberin içi körfezden geniş,\" diyor. \"Gölge düştüğünde {yer:kiyikent_liman} baştan başa altında kalır. Ambarlar dahil.\"", en: "Hal has the back page of his notebook spread on the table: a circle, seven dots, a square in the middle. \"That ring's wider than the bay,\" he says. \"When the shadow falls, all of {yer:kiyikent_liman} is under it. Storerooms included.\"" }
            kosul: { bayrak: "bl9_olcum_tam" }
          - metin: { tr: "Halit Usta'nın rakamlarının her birinin yanında koca bir artı eksi var. Konsey üyelerinden biri bunu parmağıyla gösterip gülüyor: \"Belki de körfezin öbür ucuna düşer, değil mi usta?\"", en: "Every one of Hal's numbers has a big plus-or-minus next to it. One of the Council members taps it and laughs. \"Maybe it lands on the other side of the bay, huh, Hal?\"" }
            kosul: { bayrak: "bl9_olcum_yarim", bayrak_yok: "bl9_olcum_tam" }
          - metin: { tr: "Cemal Dayı iskele kazığından kesilmiş boyalı tahtayı masaya dayamış. Her çizgi bir gece. \"Su göğe çekiliyor,\" diyor. \"Altında ne varsa onunla birlikte.\"", en: "Gus has propped the painted chunk of piling against the table. Every mark is one night. \"The water's being pulled up into the sky,\" he says. \"Along with whatever's under it.\"" }
            kosul: { bayrak: "bl9_kordon_olcum" }
          - metin: { tr: "Barış dedesinin arkasında duruyor; kayığın kabarmanın üstünde nasıl havalandığını anlatırken sesi hâlâ titriyor.", en: "Bobby stands behind his grandfather. His voice still shakes as he tells them how the skiff lifted off the top of the swell." }
            kosul: { bayrak: "bl9_kordon_genc_dondu" }
          - metin: { tr: "Toplantıdan önce {yer:kiyikent_liman|de} bir söz dolaşıyordu: {yer:kordon|de} bir balıkçı çocuğu kayığıyla kabarmanın üstüne çıkmış ve dönmemiş.", en: "Before the meeting, word was going around {yer:kiyikent_liman}: a fisherman's kid on {yer:kordon} rowed out on top of the swell and never came back." }
            kosul: { bayrak: "bl9_kordon_genc_kayip" }
          - metin: { tr: "{npc:elif_sari} masanın başında, rakamları dinlerken kalemini parmaklarının arasında çeviriyor.", en: "{npc:elif_sari} sits at the head of the table, twirling a pen between her fingers as she listens to the numbers." }
            kosul: { npc_hayatta: "elif_sari", bayrak_yok: "riza_konsey_basi" }
          - metin: { tr: "Rıza Reis masanın başında, sönmüş piposunu dişlerinin arasında çiğneyerek dinliyor.", en: "Skipper Reese sits at the head of the table, chewing on a cold pipe as he listens." }
            kosul: { bayrak: "riza_konsey_basi" }
          - { tr: "Konsey ikiye bölünmüş. Yarısı ambarları boşaltıp insanları {yer:eski_sehir|in} mahzenlerine taşımak istiyor; öbür yarısı haftalardır taşınan erzakın, suyun, tebeşirle yazılmış sayıların bir gecede çöpe gitmesine razı değil. Herkes sana dönüyor.", en: "The Council's split down the middle. Half of them want to empty the storerooms and move everyone up into the cellars in {yer:eski_sehir}. The other half won't stand for weeks of hauled supplies, water and chalked numbers going in the trash overnight. Everybody turns to you." }
        sezgiler:
          - kosul: { stat: { int: 30 } }
            metin: { tr: "{yer:eski_sehir|in} mahzenleri yüksekte ve dar; gölgenin kenarında kalıyorlar. Ama üç yüz kişiyi oraya bir günde taşımak, yolda üç yüz ayrı panik demek.", en: "The cellars in {yer:eski_sehir} are high up and cramped, right on the edge of the shadow. But moving three hundred people up there in one day means three hundred separate panics on the road." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "gölgenin altına saklanmak ya da gölgeden kaçmak. ikisi de gölgeyi tanımak demek. tanımadığın şeyden saklanamazsın.", en: "hide under the shadow or run from it. either way you're admitting the shadow's real. can't hide from something you don't believe in." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Veri tek bir şey söylüyor: altında olmayın. Gerisi politika.\"", en: "\"The data says one thing: don't be under it. The rest is politics.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Taşıyacaksak kimin bacağı tutmuyor, ben biliyorum. Listem hazır.\"", en: "\"If we're moving people, I know who can't walk. My list's ready.\"" }
        secenekler:
          - id: "tasi"
            etiket: { tr: "\"İnsanları {yer:eski_sehir|in} mahzenlerine taşıyın.\"", en: "\"Move everyone up to the cellars in {yer:eski_sehir}.\"" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 1 }
              - bayrak: "bl9_siginak_ice"
            sonraki: "bl9_olcum_konsey_karar"
          - id: "kal"
            etiket: { tr: "\"Ambarlar kalsın. Yerin altı yerin altıdır.\"", en: "\"The storerooms stay. Underground is underground.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "bl9_siginak_liman"
            sonraki: "bl9_olcum_konsey_karar"
          - id: "bol"
            etiket: { tr: "\"İkisini birden yapın: çocuklar ve yaşlılar yukarı.\"", en: "\"Do both. Kids and old folks go up the hill.\"" }
            gerekli: { stat: { cha: 30 } }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 2 }
              - bayrak: "bl9_siginak_bolundu"
            sonraki: "bl9_olcum_konsey_karar"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "\"Rakamları masadan kaldırın. Bu odadan dışarı çıkmasın.\"", en: "\"Get those numbers off the table. They don't leave this room.\"" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1, insanlik: -1 }
              - bayrak: "bl9_olcum_gizlendi"
            sonraki: "bl9_olcum_konsey_karar"
          - id: "elif"
            etiket: { tr: "Kararı {npc:elif_sari|e} bırak; sen yanında dur", en: "Leave the call to {npc:elif_sari}. Back her up" }
            goster: { npc_hayatta: "elif_sari", bayrak_yok: "riza_konsey_basi" }
            etkiler:
              - iliski: { elif_sari: { guven: 3, saygi: 2 } }
              - degisken: { hayatta_kalan: 1 }
              - bayrak: "bl9_siginak_bolundu"
              - bayrak: "bl9_siginak_elif"
            sonraki: "bl9_olcum_konsey_karar"

      - id: "bl9_olcum_konsey_karar"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Oylama kısa sürüyor. Ertesi sabah {yer:eski_sehir|in} yokuşunda el arabaları, sedyeler, sırtında bidon taşıyan çocuklar sıralanıyor. Saat kulesinin dibindeki mahzenlerin kapıları kırk yıl sonra ilk kez açılıyor.", en: "The vote doesn't take long. The next morning the hill up to {yer:eski_sehir} is lined with wheelbarrows, stretchers, and kids carrying water jugs on their backs. The cellar doors under the clock tower open for the first time in forty years." }
            kosul: { bayrak: "bl9_siginak_ice" }
          - metin: { tr: "Konsey ambarlarda kalma kararını alkışla onaylıyor. Halit Usta defterini kapatıp kimseye bir şey demeden odadan çıkıyor. Kapıların üstündeki tebeşir sayıları yerinde.", en: "The Council votes by applause to stay in the storerooms. Hal shuts his notebook and walks out of the room without a word to anyone. The chalked numbers over the doors stay right where they are." }
            kosul: { bayrak: "bl9_siginak_liman" }
          - metin: { tr: "Ertesi sabah iki kafile yola çıkıyor: biri çocuklar ve yaşlılarla {yer:eski_sehir|in} mahzenlerine, öbürü kalanların suyunu ambarlara taşımaya. Kimse her şeyi almıyor, kimse her şeyi kaybetmiyor.", en: "The next morning two convoys head out: one with the kids and old folks up to the cellars in {yer:eski_sehir}, the other hauling water to the storerooms for everyone staying. Nobody gets everything. Nobody loses everything." }
            kosul: { bayrak: "bl9_siginak_bolundu" }
          - metin: { tr: "{npc:elif_sari} kalemini masaya bırakıp ayağa kalkıyor. \"Bölüyoruz,\" diyor. Sesi yumuşak, kararı değil. Konsey odadan çıkarken sana dönüp yalnızca sen duyacak kadar alçak sesle ekliyor: \"Sağ ol. Tek başıma olsam bunu söyleyemezdim.\"", en: "{npc:elif_sari} sets her pen down and stands. \"We split it,\" she says. Her voice is soft. The decision isn't. As the Council files out, she turns to you and adds, just loud enough for you to hear: \"Thanks. On my own, I couldn't have said that.\"" }
            kosul: { bayrak: "bl9_siginak_elif" }
          - metin: { tr: "Rakamlar bir dosyaya girip Konsey'in kasasına kilitleniyor. Kimse ambarlara gölgeden söz etmiyor. Halit Usta kapıda duraklayıp sana bakıyor; bakışında suçlama yok, yalnız yorgunluk var.", en: "The numbers go into a folder and get locked in the Council's safe. Nobody says a word to the storerooms about the shadow. Hal stops in the doorway and looks at you. There's no accusation in it. Just tired." }
            kosul: { bayrak: "bl9_olcum_gizlendi" }
          - { tr: "Toplantıdan sonra Gümrük'ün çatısına çıkıyorsun. Aşağıda {yer:kiyikent_liman|in} lambaları birer birer sönüyor; yukarıda ışıklar, dünkünden biraz daha yakın.", en: "After the meeting you climb up to the Customs House roof. Down below, {yer:kiyikent_liman|pos} lamps are going out one by one. Up above, the lights hang a little closer than yesterday." }
        secenekler:
          - id: "say"
            etiket: { tr: "Çatının kenarına otur, sonra aşağı in", en: "Sit on the edge of the roof a while, then head down" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "kal"
            etiket: { tr: "Bir süre çatıda kal", en: "Stay up on the roof a while" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
