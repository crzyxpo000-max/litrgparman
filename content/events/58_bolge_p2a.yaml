# Bölge olayları · Perde 2, Bölüm 5–7 (docs/STORY_FLOW.md "hikayesiz gün", DECISIONS #144).
# Keşif görevindeki boş günler için bölge olayları, üs olayları ve saha kampı sahneleri.
# Bölüm 5 (46–66): bl5_kd_bos_gise (Kule Dibi; Lonca nöbetçileri meydana çekilince Kule'nin kapısı bedava kalır).
# Bölüm 6 (67–95): bl6_kd_yuruyen_bekci (Kule Dibi; Kat 7'nin bekçisi Kordon kapısına yürür) · bl6_kd_kamp_aras (kamp, Aras).
# Bölüm 7 (96–122; operasyon 105 "yanki_ortaya_cikis", sonrası bayrak yanki_gorundu):
#   Kule Dibi: bl7_kd_dokuzuncu_kat → bl7_kd_karantina (tohum) · bl7_kd_ses_avcilari → bl7_kd_isaretli_cocuk (tohum) · bl7_kd_kamp_elif (kamp)
#   Üs: bl7_us_defter → bl7_us_defter_son (tohum) · bl7_us_pencere_yoklamasi → bl7_kr_yusuf (tohum, Kordon)
#       bl7_sn_matbaa (Sanayi) → bl7_us_dizgi_kasasi (tohum, üs) · bl7_tp_dinleme_gecesi (Tepe) → bl7_us_kacak_murit (tohum, üs)
#   Sanayi kampı: bl7_sn_kamp_mert (kamp, Mert).
# Tohumlar yalnız bu dosyadaki olaylara ve iki mevcut olaya gider: kule_dibi_geri_donmeyenler (Bölüm 5), kordon_kapi_catlagi (Bölüm 6).
# Ara karakterler (yerelleştirilmiş adlarla): çaycı Sabri Amca / Sal, tabelacı Bora / Boone, Efe / Eli, dizgici Halit Usta / Hal,
#   Nehir / River ve babaannesi, Cemil Bey / Mr. Kemp, balıkçı Yusuf / Joe, mürit Sevgi / Grace.
olaylar:
  # ================================================================== BÖLÜM 5 · KULE DİBİ: BOŞ GİŞE
  - id: "bl5_kd_bos_gise"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 46, max: 59 }
    kosul: { bolum: 5, bayrak: "kule_acik" }
    agirlik: 6
    etiketler: ["kesif", "kule", "lonca", "insanlar"]
    gerilim: 2
    kart: { tr: "Boş gişe", en: "The empty booth" }
    sahne: "bl5_kd_bos_gise_1"
    sahneler:
      - id: "bl5_kd_bos_gise_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısındaki Lonca gişesi bu sabah bomboş. Camı açık kalmış, defteri bile yerinde yok; iki nöbetçi şafakta {yer:eski_sehir|e}, saat kulesinin dibindeki meydana çağrılmış.", en: "The Guild booth at the Spire's door is empty this morning. The window's hanging open and even the ledger's gone. Both guards got called off to {yer:eski_sehir} at dawn, to the square under the clock tower." }
          - { tr: "Gişenin önünde otuz kişi kadar birikmiş: okul çantasına ip sarmış çocuklar, cebinde borç senedi taşıyanlar, kocasının kat numarasını avucuna yazmış bir kadın. Kat başına bir kristali bugün isteyen yok; Kule ilk kez bedava.", en: "About thirty people have bunched up out front: kids with rope wrapped around their school backpacks, folks with IOUs in their pockets, a woman with her husband's floor number written on her palm. Nobody's collecting the crystal a floor today. For the first time, the Spire is free." }
          - { tr: "Kapının önüne çaycı Sabri Amca çamaşır ipi germiş, ipin ortasında da kollarını açmış duruyor. \"Para zulümdü, biliyorum!\" diye bağırıyor. \"Ama içeri çocuk sokmayan tek şey de oydu!\"", en: "Sal, the old guy who runs the tea cart by the door, has strung a clothesline across the entrance and is standing in the middle of it with his arms spread. \"The fee was a crime, I know it!\" he's yelling. \"It was also the only thing keeping kids out!\"" }
          - metin: { tr: "Halkanı gören çaycının yüzü bir an aydınlanıyor. \"Lonca'dan biri, şükür! Nöbetçileriniz nerede evlat?\"", en: "The tea man spots your Guild ring and his face lights up for a second. \"Guild! Thank God. Where are your guards, kid?\"" }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Konsey'den olduğunu bilen biri kalabalığın içinden homurdanıyor: \"Sizinkiler de meydanda değil mi? Herkes meydanda.\"", en: "Somebody in the crowd who knows you're with the Council grumbles, \"Aren't your people at the square too? Everybody's at the square.\"" }
            kosul: { bayrak: "uye_siginak" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Kalabalığın yarısı onuncu seviyenin altında. Kule'nin üçüncü katı onları sabaha kadar tutmaz.", en: "Half this crowd is under level ten. The Spire's third floor won't hold them till morning." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kapı bedava oldu diye kule cömertleşmedi. o hep aynı fiyatı alır. yalnız artık peşin almıyor.", en: "the door going free doesn't make the spire generous. it always charges the same. it just doesn't take it up front anymore." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Avucuna kat numarası yazan kadın... Biri ona bir şey söylemeli. Ama ne?\"", en: "\"The woman with the floor number on her hand... Somebody should say something to her. But what?\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bedava kapı mı? Bugün herkes tırmanırsa yarın sıralama çöpe döner.\"", en: "\"A free door? If everybody climbs today, the Ranking's garbage by tomorrow.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Üçüncü kattan dönenleri ben dikiyorum. Bu gece masama kaç kişi geleceğini şimdiden hesaplıyorum.\"", en: "\"I'm the one who stitches up whoever comes back from Floor 3. I'm already counting how many end up on my table tonight.\"" }
        secenekler:
          - id: "ayikla"
            etiket: { tr: "Kapıya geç; seviyesi yetmeyeni geri çevir", en: "Take the door. Turn back anyone who's too low" }
            gerekli: { stat: { per: 30 } }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - tehlike: { kule_dibi: -3 }
            sonraki: "bl5_kd_bos_gise_ayikla"
          - id: "ip"
            etiket: { tr: "İpi indir; Kule kimsenin malı değil", en: "Take the rope down. Nobody owns the Spire" }
            etkiler:
              - ahlak: { duzen: -3, insanlik: 1 }
              - itibar: { lonca: -1 }
              - tehlike: { kule_dibi: 3 }
            sonraki: "bl5_kd_bos_gise_ip"
          - id: "rehber"
            etiket: { tr: "İlk üç kata grupları sen götür", en: "Lead them up the first three floors yourself" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "bl5_kd_bos_gise_rehber"
          - id: "kaya"
            etiket: { tr: "Telsizle {npc:kaya_demir|e} ulaş; nöbetçiler geri dönsün", en: "Radio {npc:kaya_demir}. Get the guards sent back" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - itibar: { lonca: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "bl5_kd_bos_gise_kaya"
          - id: "konsey"
            etiket: { tr: "Konsey'den gönüllü çağır, kapıya kayıt masası kur", en: "Call in Council volunteers and set up a sign-in table" }
            goster: { bayrak: "uye_siginak" }
            etkiler:
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - tehlike: { kule_dibi: -2 }
            sonraki: "bl5_kd_bos_gise_konsey"

      - id: "bl5_kd_bos_gise_ayikla"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapının önüne geçip ipi omzuna alıyorsun. Her yüzün üstündeki sayıya bir bakış yetiyor: on bir, geç; altı, geri; dört, hiç sorma.", en: "You step up to the door and take the clothesline on your shoulder. One look at the number over each face is all it takes. Eleven, go ahead. Six, back. Four, don't even ask." }
          - { tr: "Geri çevrilenlerin çoğu söylene söylene dağılıyor. Avucunda kat numarası yazılı kadın ise gitmiyor, ipin dibine çöküp kalıyor; yazdığı rakam on iki.", en: "Most of the ones you turn back drift off grumbling. The woman with the number on her palm doesn't. She sinks down at the foot of the rope and stays put. The number on her hand is twelve." }
          - { tr: "Akşama kadar on dokuz kişi içeri giriyor, kırk üç kişiyi geri çeviriyorsun. Çaycı sana bir bardak çay uzatıyor: \"Lonca'dan bunu yapan olmadı. Parayı alırlardı, yüze bakmazlardı.\"", en: "By evening, nineteen have gone in and forty-three have been turned around. The tea man hands you a glass of tea. \"Nobody from the Guild ever did that. They took the money. They never looked at a face.\"" }
        secenekler:
          - id: "kadin"
            etiket: { tr: "Kadını kapıdan uzaklaştırma; yanında bekle", en: "Don't move the woman along. Wait with her" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 9
              - tohum: { olay: "kule_dibi_geri_donmeyenler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 5 }, hatirlatma: { tr: "Gişenin boş kaldığı günden beri avucunda on iki yazan kadın Kule'nin dibinden ayrılmadı.", en: "Since the day the booth stood empty, the woman with twelve written on her palm hasn't left the foot of the Spire." } }
            sonraki: "@akis"
          - id: "cay"
            etiket: { tr: "Çayını bitir, kapıyı çaycıya bırak", en: "Finish your tea and leave the door to the tea man" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl5_kd_bos_gise_ip"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Düğümü çözüp ipi yere bırakıyorsun. Çaycı tek söz etmeden tezgâhına dönüyor, bardakları yıkamaya koyuluyor; elleri titriyor.", en: "You untie the knot and let the rope drop. The tea man goes back to his cart without a word and starts washing glasses. His hands are shaking." }
          - { tr: "Kalabalık kapıdan sel gibi akıyor. Avucunda on iki yazan kadın en önde; çocuklardan ikisi ona yetişmek için koşturuyor.", en: "The crowd pours through the door. The woman with twelve on her palm is out in front, and two of the kids are running to keep up with her." }
          - { tr: "Akşamüstü ilk dönenler çıkıyor: dört kişi, ikisi sırtta. Sabah giren otuz kişiydi.", en: "Late in the afternoon, the first ones come back out. Four of them, two being carried. Thirty went in this morning." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Gece yarısına kadar kapının önünde bekle", en: "Wait outside the door till midnight" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 8
              - tohum: { olay: "kule_dibi_geri_donmeyenler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 5 }, hatirlatma: { tr: "Kapının bedava kaldığı günden beri Kule'nin dibindeki tebeşir duvarına bir düzine yeni ad yazıldı.", en: "Since the day the door went free, a dozen new names have gone up on the chalk wall at the foot of the Spire." } }
            sonraki: "@akis"
          - id: "topla"
            etiket: { tr: "Üçüncü kata çık, geride kalanları topla", en: "Go up to Floor 3 and round up the stragglers" }
            gerekli: { stat: { end: 32 } }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 12
            sonraki: "bl5_kd_bos_gise_topla"

      - id: "bl5_kd_bos_gise_topla"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Üçüncü katın taş tavanı nefes alır gibi inip kalkıyor. Köşelere sinmiş üç çocuğu, ayak bileği kırık bir adamı ve hâlâ yukarı bakan kadını tek tek buluyorsun.", en: "Floor 3's stone ceiling rises and sinks like it's breathing. One by one, you find three kids wedged into corners, a man with a broken ankle, and the woman, still looking up." }
          - { tr: "Kadın inmek istemiyor. \"On ikinci kat,\" diyor yalnızca, sanki merdivenin sonu oradaymış gibi. Onu da omzuna alıp aşağı iniyorsun.", en: "The woman doesn't want to go down. \"Floor twelve,\" is all she says, like that's where the stairs end. You put her over your shoulder too and carry her down." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kapıda onları çaycıya teslim et", en: "Hand them off to the tea man at the door" }
            etkiler:
              - bayrak: "bl5_ucuncu_kat_toplandi"
            sonraki: "@akis"

      - id: "bl5_kd_bos_gise_rehber"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kalabalığı beşer kişilik gruplara ayırıp ipi bellerine bağlıyorsun. İlk kat bir orman, ikincisi su basmış bir koridor; üçüncüde tavanın taşları soluk alıp veriyor.", en: "You split the crowd into groups of five and tie the rope around their waists. The first floor is a forest, the second a flooded hallway. On the third, the ceiling stones breathe in and out." }
          - { tr: "Gün boyu dört kez inip çıkıyorsun. Son seferde üçüncü katın merdiven başında ip bağlı bir çocuk ağlamaya başlıyor; arkadaşı ipi çözüp ileri koşmuş.", en: "You make the trip four times. On the last one, at the top of the stairs on Floor 3, one of the roped-up kids starts crying. His friend untied himself and ran on ahead." }
          - metin: { tr: "Grupların birinde avucunda on iki yazan kadın var. Her katta biraz daha hızlı yürüyor.", en: "The woman with twelve on her palm is in one of the groups. She walks a little faster on every floor." }
            kosul: { stat: { per: 25 } }
        secenekler:
          - id: "kos"
            etiket: { tr: "Kaçanın peşinden dördüncü kata dal", en: "Go after the runaway on Floor 4" }
            gerekli: { stat: { agi: 34 } }
            etkiler:
              - ahlak: { merhamet: 2 }
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 14
            sonraki: "bl5_kd_bos_gise_kurtar"
          - id: "don"
            etiket: { tr: "Grupları aşağı indir, kaçanın adını tebeşirle yaz", en: "Bring the groups down. Chalk the runaway's name" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 9
              - tohum: { olay: "kule_dibi_geri_donmeyenler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 5 }, hatirlatma: { tr: "Kapının bedava kaldığı günden beri Kule'nin dibindeki tebeşir duvarına bir düzine yeni ad yazıldı.", en: "Since the day the door went free, a dozen new names have gone up on the chalk wall at the foot of the Spire." } }
            sonraki: "@akis"

      - id: "bl5_kd_bos_gise_kurtar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Dördüncü katın girişinde çocuğu bir taş sütuna tırmanmış buluyorsun. Altında Kule kırıntıları dolaşıyor; sesini çıkarmamayı akıl edecek kadar korkmuş.", en: "You find the kid at the entrance to Floor 4, clinging to the top of a stone pillar. Spire shards are circling underneath. He's scared enough to have the sense to keep quiet." }
          - { tr: "Kırıntıları dağıtıp onu aşağı indiriyorsun. Kapıda çaycı ikinizi görünce çay demliğini bırakıp çocuğun kulağını çekiyor; ardından sarılıyor.", en: "You scatter the shards and bring him down. When the tea man sees the two of you at the door, he puts down the teapot, grabs the kid by the ear, then hugs him." }
        secenekler:
          - id: "son"
            etiket: { tr: "İpi topla, günü kapat", en: "Coil up the rope and call it a day" }
            etkiler:
              - bayrak: "bl5_kacan_cocuk_kurtarildi"
            sonraki: "@akis"

      - id: "bl5_kd_bos_gise_kaya"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Telsizden {npc:kaya_demir|in} sesi cızırtıyla geliyor: \"Nöbetçileri ben çektim. Meydanda Çekirdek var, kapıda çocuk var. Hangisini seçeceğimi biliyorum.\"", en: "{npc:kaya_demir|pos} voice crackles over the radio. \"I pulled the guards. There's a Core in the square and kids at the door. I know which one I'm picking.\"" }
          - { tr: "Bir süre susuyor, ardından ekliyor: \"Kapıyı sen tut. Akşam iki adam yollarım. Para alma, yalnız kimin girdiğini yaz.\"", en: "He goes quiet a moment, then adds, \"You hold the door. I'll send two men by tonight. Don't take money. Just write down who goes in.\"" }
          - metin: { tr: "\"Sen Lonca'dansın,\" diye bitiriyor. \"Bugünlük nöbetçi sensin.\"", en: "\"You're Guild,\" he finishes. \"Today, you're the guard.\"" }
            kosul: { bayrak: "uye_lonca" }
        secenekler:
          - id: "tut"
            etiket: { tr: "Kapıyı onun adına tut", en: "Hold the door for him" }
            etkiler:
              - itibar: { lonca: 2 }
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "itiraz"
            etiket: { tr: "\"Bu çocuklar senin hesabına ölecekti.\"", en: "\"Those kids were going to die on your tab.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { kaya_demir: { guven: -2, saygi: 1 } }
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl5_kd_bos_gise_konsey"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir saat sonra kapının yanına bir okul sırası konmuş; Konsey'in iki gönüllüsü giren herkesin adını, seviyesini ve gideceği katı yazıyor, çaycı da sıranın ucuna demliğini koyuyor.", en: "Within an hour there's a school desk set up by the door. Two Council volunteers write down the name, level, and target floor of everybody who goes in, and the tea man parks his teapot on the corner of the desk." }
          - { tr: "Defterin ilk sayfası akşama kadar doluyor. Kule'nin önünde ilk kez kimin içeride olduğunu bilen biri var.", en: "The first page is full by evening. For the first time, somebody at the foot of the Spire actually knows who's inside." }
        secenekler:
          - id: "isim"
            etiket: { tr: "Kadının kocasının adını deftere sen yaz", en: "Write the woman's husband's name in the book yourself" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 9
              - tohum: { olay: "kule_dibi_geri_donmeyenler", gecikme: { min: 2, max: 3 }, kosul: { bolum: 5 }, hatirlatma: { tr: "Gişenin boş kaldığı günden beri avucunda on iki yazan kadın Kule'nin dibinden ayrılmadı.", en: "Since the day the booth stood empty, the woman with twelve written on her palm hasn't left the foot of the Spire." } }
            sonraki: "@akis"
          - id: "son"
            etiket: { tr: "Defteri gönüllülere bırak", en: "Leave the book with the volunteers" }
            etkiler:
              - bayrak: "bl5_kule_defteri"
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== BÖLÜM 6 · KULE DİBİ: YÜRÜYEN BEKÇİ
  - id: "bl6_kd_yuruyen_bekci"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 67, max: 79 }
    kosul: { bolum: 6, bayrak: "kule_acik" }
    agirlik: 6
    etiketler: ["kesif", "kule", "tasma", "canavar"]
    gerilim: 3
    kart: { tr: "Koşmak yasaktır", en: "No running" }
    sahne: "bl6_kd_yuruyen_bekci_1"
    sahneler:
      - id: "bl6_kd_yuruyen_bekci_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şafak sökerken Kule'nin kapısından bir şey çıkıyor. Kırık bir zırhın içinde, boyu insanın iki katı bir gövde ağır ağır meydana iniyor; attığı her adımda asfalt örümcek ağı gibi çatlıyor.", en: "Just before dawn, something walks out of the Spire's door. Twice a man's height and wrapped in broken armor, it comes down into the plaza one slow step at a time, and the asphalt cracks like a spiderweb under every footfall." }
          - { tr: "Meydandaki herkesin önünde aynı mavi pencere açılmış: [Kat 7 Kuralı: Koşmak yasaktır.] Kaçmaya kalkan bir tezgâhçı üçüncü adımında yere yapışıyor; bekçi dönüp bakmıyor bile.", en: "The same blue window has popped up in front of everyone on the plaza: [Floor 7 Rule: No running.] A vendor who tries to bolt hits the ground on his third step. The warden doesn't even turn its head." }
          - { tr: "Gittiği yön belli: bulvar boyunca, {yer:kordon|e} doğru. Sahildeki kapı her soluk aldığında bekçi duruyor, kapı soluğunu verince yeniden yürüyor.", en: "It's headed down the boulevard toward {yer:kordon}. Every time the Gate on the shore takes a breath, the warden stops. When the Gate breathes out, it walks on." }
          - { tr: "Bulvarın ağzında Lonca'nın altı kişilik bir mangası barikat kuruyor. Koşmadan, yürüyerek; kuralı onlar da okumuş.", en: "At the mouth of the boulevard, a six-person Guild squad is throwing up a barricade. Walking, not running. They read the rule too." }
          - metin: { tr: "Balkonları boşaltmaya başlamıştın. Bekçinin yürüdüğü bulvar o balkonların tam altından geçiyor.", en: "You'd already started clearing the balconies. The boulevard the warden's walking runs right underneath them." }
            kosul: { bayrak: "hazirlik_tasma_balkon" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Bekçinin göğüs zırhına bir kat numarası kazınmış: 7. Altında yarım kalmış bir kılıç izi var; biri onu bir kez yaralamış, sonra yürüyerek uzaklaşmış olmalı.", en: "There's a floor number gouged into the warden's breastplate: 7. Under it, an unfinished sword cut. Somebody hurt it once, then must have walked away." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kuleden düşen her şey aşağı akar. aşağısı da şu an o kapı. lavabonun deliği gibi düşün.", en: "everything that falls off the spire runs downhill. right now, downhill is that gate. think of a sink drain." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kordon kapısının nabzıyla aynı ritimde duruyor. Biri bunu ölçmeli. Tercihen ben. Uzaktan.\"", en: "\"It stops in time with the Esplanade Gate's pulse. Somebody needs to measure that. Preferably me. From far away.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Koşmak yasakmış. İyi. Ben koşmadan da hızlıyım.\"", en: "\"No running, huh. Fine. I'm fast at a walk too.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bulvarın sonunda balkonlar var. O şey oraya varırsa...\"", en: "\"The balconies are at the end of that boulevard. If that thing gets there...\"" }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Bulvara girmeden önünü kes", en: "Cut it off before it reaches the boulevard" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], kazan: "bl6_kd_yuruyen_bekci_zafer", kaybet: "bl6_kd_yuruyen_bekci_yenilgi", kac: "bl6_kd_yuruyen_bekci_kacis" }
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Arkasından yürü; nereye gittiğini gör", en: "Walk behind it. See where it's going" }
            etkiler:
              - gizle: 1
            sonraki: "bl6_kd_yuruyen_bekci_izle"
          - id: "bosalt"
            etiket: { tr: "Önünden yürüyerek bulvarı boşalt", en: "Walk ahead of it and clear the boulevard" }
            etkiler:
              - ahlak: { merhamet: 3 }
            sonraki: "bl6_kd_yuruyen_bekci_bosalt"
          - id: "manga"
            etiket: { tr: "Lonca mangasına katıl, barikatta karşıla", en: "Join the Guild squad at the barricade" }
            etkiler:
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "bl6_kd_yuruyen_bekci_manga"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} bekçinin nereye gittiğini sor", en: "Ask {npc:yanki} where the warden's going" }
            goster: { bayrak: "yanki_bagi" }
            sonraki: "bl6_kd_yuruyen_bekci_yanki"

      - id: "bl6_kd_yuruyen_bekci_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} bir süre susuyor; susarken bile kafanın içinde bir şey tıkırdıyor. Sonunda: eve gidiyor. kapı kule döküntülerini çağırıyor, mıknatıs gibi. o yedinci katın kuralını da beraberinde götürüyor.", en: "{npc:yanki} goes quiet for a while, and even then something keeps ticking inside your head. Finally: it's going home. the gate is calling the spire's leftovers, like a magnet. and it's bringing floor seven's rule along with it." }
          - { tr: "kordona varınca orada da kimse koşamayacak. taşma günü düşün bunu. su çekilirken herkes yürüyerek kaçacak.", en: "once it gets to the esplanade, nobody there gets to run either. think about that on overflow day. the sea pulls back and everyone has to walk." }
        secenekler:
          - id: "dovus"
            etiket: { tr: "Bulvara girmeden önünü kes", en: "Cut it off before it reaches the boulevard" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], kazan: "bl6_kd_yuruyen_bekci_zafer", kaybet: "bl6_kd_yuruyen_bekci_yenilgi", kac: "bl6_kd_yuruyen_bekci_kacis" }
          - id: "izle"
            etiket: { tr: "Yine de peşinden yürü; kendi gözünle gör", en: "Follow it anyway. See for yourself" }
            sonraki: "bl6_kd_yuruyen_bekci_izle"

      - id: "bl6_kd_yuruyen_bekci_manga"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Mangayı çenesinde yara izi olan bir kadın yönetiyor; seni görünce barikatın en önünü gösteriyor. \"Kural koşmayı yasaklıyor, vurmayı değil,\" diyor. \"Biz yandan, sen önden.\"", en: "A woman with a scar down her jaw is running the squad. She sees you and points to the front of the barricade. \"The rule says no running. Doesn't say no hitting. We take the flanks, you take the front.\"" }
          - { tr: "Bekçi barikata yirmi adım kala duruyor. Sahilde kapı soluk alıyor; zırhın içindeki şey de onunla birlikte doğruluyor.", en: "The warden stops twenty paces from the barricade. Down on the shore the Gate breathes in, and the thing in the armor straightens up with it." }
        secenekler:
          - id: "on"
            etiket: { tr: "Barikatın önüne geç", en: "Step out in front of the barricade" }
            etkiler:
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], kazan: "bl6_kd_yuruyen_bekci_zafer", kaybet: "bl6_kd_yuruyen_bekci_yenilgi", kac: "bl6_kd_yuruyen_bekci_kacis" }
          - id: "geri"
            etiket: { tr: "\"Barikatı bırakın, yürüyerek çekilin.\"", en: "\"Leave the barricade. Walk back.\"" }
            etkiler:
              - itibar: { lonca: -1 }
              - ahlak: { merhamet: 1 }
            sonraki: "bl6_kd_yuruyen_bekci_bosalt"

      - id: "bl6_kd_yuruyen_bekci_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin zırhı ikiye ayrılıp içi boş bir kabuk gibi asfalta yığılıyor. Mavi pencere bir an daha havada asılı kalıp sönüyor: [Kat 7 Kuralı: askıya alındı.]", en: "The warden's armor splits in two and folds onto the asphalt like an empty shell. The blue window hangs in the air a second longer, then goes out: [Floor 7 Rule: suspended.]" }
          - { tr: "Tezgâhçılar başlarını çıkarıyor. Biri kural kalktı diye sevincinden koşmaya başlıyor; kimse onu durdurmuyor.", en: "Vendors poke their heads out. One of them starts running just because he can again, and nobody stops him." }
        secenekler:
          - id: "kabuk"
            etiket: { tr: "Zırhın içine bak", en: "Look inside the armor" }
            gerekli: { stat: { per: 35 } }
            etkiler:
              - bayrak: "bl6_bekci_olduruldu"
              - xp_seviye: 14
              - tohum: { olay: "kordon_kapi_catlagi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 6, gun_max: 79 }, hatirlatma: { tr: "Kule'den inen bekçinin sabahından beri mendireğin ucundaki kapı her gün biraz daha sık soluk alıyor.", en: "Ever since the morning the warden came down from the Spire, the Gate at the end of the breakwater has been breathing a little faster every day." } }
            sonraki: "bl6_kd_yuruyen_bekci_kabuk"
          - id: "say"
            etiket: { tr: "Tezgâhçıları topla, yaralıları say", en: "Gather the vendors and count the hurt" }
            etkiler:
              - bayrak: "bl6_bekci_olduruldu"
              - ahlak: { merhamet: 1 }
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl6_kd_yuruyen_bekci_kabuk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Zırhın içi boş ama iç yüzüne ince bir yazı kazınmış: Sistem'in harfleriyle çizilmiş, pusula ibresi gibi tek yöne dönük bir ok. Ok {yer:kordon|in} mendireğini işaret ediyor.", en: "The armor's empty, but there's fine writing etched on the inside, in the System's letters: one arrow, like a compass needle, pointing a single way. It points at the breakwater on {yer:kordon}." }
          - { tr: "Altında bir satır daha var: [Toplanma noktası.] Kule döküntülerinin hepsi aynı yere çağrılıyor demek.", en: "There's another line under it: [Assembly point.] So all the Spire's leftovers are being called to the same place." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kabuğu bir brandayla ört, yazıyı aklına yaz", en: "Throw a tarp over the shell. Memorize the writing" }
            etkiler:
              - bayrak: "bl6_toplanma_noktasi"
            sonraki: "@akis"

      - id: "bl6_kd_yuruyen_bekci_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir adımı fazla çabuk atıyorsun; kural bunu koşmak sayıyor. Bekçinin eli enseni kavrıyor, dünya kararıyor.", en: "One step comes out too fast, and the rule counts it as running. The warden's hand closes on the back of your neck and the world goes dark." }
          - { tr: "Ayıldığında meydan boş. Bulvarın asfaltında, {yer:kordon|e} doğru uzanan derin ayak izleri var; Lonca mangası izlerin yanında yürüyerek dönüyor.", en: "When you come to, the plaza's empty. Deep footprints run down the boulevard asphalt toward {yer:kordon}, and the Guild squad is walking back along them." }
        secenekler:
          - id: "cekil"
            etiket: { tr: "Doğrul, yaralarını sar", en: "Get up and bandage yourself" }
            etkiler:
              - can: 20
              - tehlike: { kordon: 3 }
              - bayrak: "bl6_bekci_kordona_vardi"
            sonraki: "@akis"

      - id: "bl6_kd_yuruyen_bekci_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekiliyorsun; yürüyerek, çünkü başka türlüsü yasak. Bekçi peşine düşmüyor, yoluna devam ediyor.", en: "You back off. At a walk, because anything else is against the rules. The warden doesn't follow. It just keeps going." }
        secenekler:
          - id: "cekil"
            etiket: { tr: "Bulvarın kenarından onu gözden kaybet", en: "Lose sight of it from the side of the boulevard" }
            etkiler:
              - tehlike: { kordon: 2 }
              - bayrak: "bl6_bekci_kordona_vardi"
            sonraki: "@akis"

      - id: "bl6_kd_yuruyen_bekci_izle"
        yer: "kordon"
        paragraflar:
          - { tr: "İki saat boyunca bulvarda onun hızında yürüyorsun. Önünüzdeki dükkânların kepenkleri tek tek iniyor; bekçi kapının her soluğunda duruyor, sen de onunla duruyorsun.", en: "For two hours you walk the boulevard at its pace. Shop shutters roll down one after another ahead of it. Every time the Gate breathes, it stops, and so do you." }
          - { tr: "Mendireğin başına varan bekçi yüzünü kapıya çevirip diz çöküyor, taş gibi kımıldamadan kalıyor. Kapı her soluk aldığında zırhına kazınmış 7 mavi mavi parlıyor.", en: "At the head of the breakwater it turns to face the Gate, kneels, and stays there like a stone. Every time the Gate breathes in, the 7 on its armor glows blue." }
          - { tr: "Balkonlardan izleyenler el sallıyor. Bir çocuk, bekçiyi yeni dikilmiş bir heykel sanıp fotoğrafını çekiyor.", en: "People up on the balconies are waving. One kid takes its picture, thinking it's a new statue." }
        sezgiler:
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Bekçinin ışığı kapının nabzını şaşmadan tekrarlıyor. Sayaç hızlandıkça o da hızlanacak; şehrin ortasında bir saat gibi.", en: "The warden's glow matches the Gate's pulse exactly. As the counter speeds up, so will it. Like a clock in the middle of town." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Orada kalsın; kapının nabzını o tutsun", en: "Leave it. Let it keep time for the Gate" }
            etkiler:
              - bayrak: "bl6_bekci_mendirekte"
              - tehlike: { kordon: 1 }
              - xp_seviye: 10
              - tohum: { olay: "kordon_kapi_catlagi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 6, gun_max: 79 }, hatirlatma: { tr: "Kule'den inen bekçinin sabahından beri mendireğin ucundaki kapı her gün biraz daha sık soluk alıyor.", en: "Ever since the morning the warden came down from the Spire, the Gate at the end of the breakwater has been breathing a little faster every day." } }
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|e} haber ver; ışığı ölçsün", en: "Get word to {npc:mert_kilic}. Have him measure the glow" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - bayrak: "bl6_bekci_mendirekte"
              - iliski: { mert_kilic: { saygi: 3, guven: 1 } }
              - itibar: { sessiz_ag: 1 }
              - xp_seviye: 10
              - tohum: { olay: "kordon_kapi_catlagi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 6, gun_max: 79 }, hatirlatma: { tr: "Kule'den inen bekçinin sabahından beri mendireğin ucundaki kapı her gün biraz daha sık soluk alıyor.", en: "Ever since the morning the warden came down from the Spire, the Gate at the end of the breakwater has been breathing a little faster every day." } }
            sonraki: "@akis"
          - id: "vur"
            etiket: { tr: "Diz çökmüşken işini bitir", en: "Finish it while it's kneeling" }
            etkiler:
              - ahlak: { duzen: 1 }
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["su"], kazan: "bl6_kd_yuruyen_bekci_zafer", kaybet: "bl6_kd_yuruyen_bekci_yenilgi", kac: "bl6_kd_yuruyen_bekci_kacis" }

      - id: "bl6_kd_yuruyen_bekci_bosalt"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin elli adım önünden yürüyerek bulvara giriyorsun. \"Yürüyün!\" diye bağırıyorsun kapı kapı. \"Koşmayın, yürüyün!\" İnsanlar kuralı okudukça yüzleri değişiyor.", en: "You walk onto the boulevard fifty paces ahead of the warden, calling door to door. \"Walk! Don't run, walk!\" You can see people's faces change as they read the rule." }
          - { tr: "Tekerlekli sandalyedeki yaşlı bir adamı itiyorsun, arkanda zırhın gıcırtısı. Ne hızlanabiliyorsun ne yavaşlayabiliyorsun; ikisi de ölüm.", en: "You push an old man in a wheelchair with the creak of armor behind you. You can't speed up and you can't slow down. Either one gets you killed." }
          - { tr: "Bulvar boşalınca bekçi kimseye dokunmadan aşağı iniyor, {yer:kordon|in} mendireğine varıp kapıya dönük diz çöküyor.", en: "Once the boulevard's empty, the warden walks down it without touching anyone, reaches the breakwater on {yer:kordon}, and kneels facing the Gate." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Mendireğe kadar peşinden yürü", en: "Follow it all the way to the breakwater" }
            etkiler:
              - bayrak: "bl6_bekci_mendirekte"
              - xp_seviye: 10
              - tohum: { olay: "kordon_kapi_catlagi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 6, gun_max: 79 }, hatirlatma: { tr: "Kule'den inen bekçinin sabahından beri mendireğin ucundaki kapı her gün biraz daha sık soluk alıyor.", en: "Ever since the morning the warden came down from the Spire, the Gate at the end of the breakwater has been breathing a little faster every day." } }
            sonraki: "@akis"
          - id: "yeter"
            etiket: { tr: "Bulvar boşaldı, bu kadarı yeter", en: "The boulevard's clear. That's enough" }
            etkiler:
              - bayrak: "bl6_bekci_kordona_vardi"
              - tehlike: { kordon: 2, kule_dibi: -2 }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== BÖLÜM 6 · KULE DİBİ KAMPI: ARAS
  - id: "bl6_kd_kamp_aras"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    kamp: true
    gun: { min: 67, max: 95 }
    kosul: { bolum: 6, bayrak: "kule_acik" }
    agirlik: 5
    etiketler: ["kamp", "aras", "yoldas"]
    gerilim: 1
    npc: ["aras_kurt"]
    kart: { tr: "Otuz bir ışık", en: "Thirty-one lights" }
    sahne: "bl6_kd_kamp_aras_1"
    sahneler:
      - id: "bl6_kd_kamp_aras_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateşi Kule'nin en alt basamağının dibinde yakmışsınız. Taş geceleri ısı tutar; sırtını dayayan uyuyakalır, uyanınca da rüyasında neden tırmandığını bilemez.", en: "You built the fire at the foot of the Spire's lowest step. The stone holds heat at night. Lean back against it and you'll doze off, then wake up not knowing why you were climbing in your dream." }
          - { tr: "{npc:aras_kurt} uyumuyor. Bıçağını bileyliyor, arada başını kaldırıp Kule'nin gövdesinde yanan ışıkları sayıyor. \"Otuz bir,\" diyor sonunda. \"Dün gece otuzdu. Biri yukarıda bir kat daha çıkmış.\"", en: "{npc:aras_kurt} isn't sleeping. He's working his knife on a whetstone, and every so often he looks up to count the lights burning along the Spire. \"Thirty-one,\" he says finally. \"Last night it was thirty. Somebody up there climbed another floor.\"" }
          - metin: { tr: "Sahildeki kapının uğultusu buraya kadar geliyor. Balkonlarda hâlâ ışık yanıyor.", en: "You can hear the Gate humming down on the shore all the way from here. The lights are still on along the balconies." }
            kosul: { bayrak_yok: ["kordon_kurtarildi", "kordon_dustu"] }
          - metin: { tr: "{yer:kordon|den} esen rüzgâr yalnız deniz kokuyor artık. Kan kokusu çekilmiş.", en: "The wind off {yer:kordon} only smells like the sea now. The blood smell's gone." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "{yer:kordon} yönünden gelen sesler gece boyu kesilmiyor. {npc:aras_kurt} her seferinde bileme taşını bırakıp dinliyor.", en: "The noises from {yer:kordon} don't stop all night. Every time, {npc:aras_kurt} stops sharpening and listens." }
            kosul: { bayrak: "kordon_dustu" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Bıçak çoktan keskinleşmiş. Bileme taşını bırakırsa ellerinin ne yapacağını bilmiyor.", en: "That knife was sharp an hour ago. He just doesn't know what his hands would do if he put the stone down." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "senden önce uyumayacak. hiç uyumadı. yarışın kuralı bu, ona sorarsan.", en: "he won't sleep before you do. he never has. that's the rule of the race, if you ask him." }
        secenekler:
          - id: "neden"
            etiket: { tr: "\"Sen neden tırmanıyorsun?\"", en: "\"Why do you climb?\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2 } }
            sonraki: "bl6_kd_kamp_aras_neden"
          - id: "yaris"
            etiket: { tr: "\"Otuz ikinci ışığı yarın biz yakalayalım.\"", en: "\"Tomorrow, the thirty-second light is ours.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, baglilik: 2 } }
            sonraki: "bl6_kd_kamp_aras_yaris"
          - id: "nobet"
            etiket: { tr: "\"Uyu. Nöbeti ben tutarım.\"", en: "\"Get some sleep. I'll take watch.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 3 } }
              - hafiza: { npc: "aras_kurt", id: "sirtini_kolladi", agirlik: 20 }
            sonraki: "bl6_kd_kamp_aras_nobet"
          - id: "yama"
            etiket: { tr: "Ceketindeki sökülmüş yamayı sor", en: "Ask about the torn-off patch on his jacket" }
            gerekli: { iliski_min: { aras_kurt: { guven: 15 } } }
            sonraki: "bl6_kd_kamp_aras_yama"

      - id: "bl6_kd_kamp_aras_neden"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Yukarıda kimse kimin kim olduğunu sormuyor,\" diyor. \"Seviyene bakıyorlar, o kadar. Aşağıda herkes soruyor.\" Bıçağı kınına sokuyor. \"Sen de soruyorsun işte.\"", en: "\"Up there nobody asks who you are,\" he says. \"They look at your level. That's it. Down here, everybody asks.\" He slides the knife into its sheath. \"Like you're doing.\"" }
          - { tr: "\"Seninki belli zaten: herkesi kurtarmak. Sıkıcı. Ama doğru, değil mi? Daha da kötüsü bu.\"", en: "\"Yours is obvious anyway. Save everybody. Boring. But it's true, isn't it? That's what makes it worse.\"" }
        secenekler:
          - id: "dogru"
            etiket: { tr: "\"Doğru.\"", en: "\"It's true.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"
          - id: "seni"
            etiket: { tr: "\"Hayır. Seni geçmek için.\"", en: "\"Nope. To beat you.\"" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 2 } }
            sonraki: "@akis"

      - id: "bl6_kd_kamp_aras_yaris"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Taşı bırakıp sana dönüyor; ateşin ışığında ilk kez çocuk gibi sırıtıyor. \"Biz mi? Olmaz. Ama aynı saatte çıkarız. Kim önce varırsa ışık onun.\"", en: "He puts the stone down and turns to you, and in the firelight he grins like a kid for the first time. \"Us? No way. But we go up at the same time. Whoever gets there first, the light's theirs.\"" }
          - { tr: "Birkaç dakika sonra sırtını taşa verip gözlerini kapatıyor. Bıçak hâlâ elinde, ama uyuyor.", en: "A few minutes later he leans back against the stone and closes his eyes. The knife's still in his hand, but he's asleep." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ateşi küllendir", en: "Bank the fire" }
            etkiler:
              - bayrak: "bl6_aras_sabah_yarisi"
            sonraki: "@akis"

      - id: "bl6_kd_kamp_aras_nobet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Benden önce uyursan kaybedersin,\" diyor, ama sesi inandırıcı değil. Bir süre ateşe bakıp ceketini başının altına katlıyor.", en: "\"Fall asleep before me and you lose,\" he says, but there's nothing behind it. He stares at the fire a while, then folds his jacket under his head." }
          - { tr: "Uykusunda bir kez yumruğunu sıkıyor, bir şey söylüyor; sözcükleri yok. Sabaha kadar Kule'deki ışıkları sen sayıyorsun. Otuz bir, otuz bir, otuz iki.", en: "Once in his sleep he clenches a fist and says something with no words in it. Till morning, you're the one counting the Spire's lights. Thirty-one, thirty-one, thirty-two." }
        secenekler:
          - id: "son"
            etiket: { tr: "Sabah ona söyleme", en: "Don't mention it in the morning" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1 } }
            sonraki: "@akis"

      - id: "bl6_kd_kamp_aras_yama"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Parmağını yamanın yerinde gezdiriyor. Bir zamanlar oraya bir ad işlenmiş, iplikleri tek tek sökülmüş.", en: "He runs a finger over the spot where the patch was. A name used to be stitched there. Somebody picked the threads out one at a time." }
          - { tr: "\"Eskiden giydiğim bir üniformadan kaldı,\" diyor. \"Ad gerekmez. O adam artık yok.\" Gülüyor, ama gözü ateşten ayrılmıyor.", en: "\"Left over from a uniform I used to wear,\" he says. \"Doesn't need a name. That guy's gone.\" He laughs, but his eyes stay on the fire." }
          - { tr: "\"Bunu kimseye anlatma. Sıralamanın tepesine çıkacak adamın bir zamanlar üniforma giydiğini bilmesinler.\"", en: "\"Don't tell anybody. Nobody needs to know the guy headed for the top of the Ranking used to wear a uniform.\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz.\"", en: "\"You got it.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 3 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl6_kd_kamp_aras", agirlik: 25 }
              - bayrak: "bl6_aras_yama"
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "\"Hangi üniforma?\"", en: "\"What kind of uniform?\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: -1, saygi: 1 } }
              - bayrak: "bl6_aras_yama"
            sonraki: "bl6_kd_kamp_aras_sor"

      - id: "bl6_kd_kamp_aras_sor"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bıçağı yeniden taşa dayıyor. \"Seninle yarışıyorum, dertleşmiyorum,\" diyor. \"İyi geceler.\"", en: "He sets the knife back to the stone. \"I race you. I don't spill my guts to you,\" he says. \"Good night.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ateşin öbür yanına geç", en: "Move to the other side of the fire" }
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · KULE DİBİ: DOKUZUNCU KAT
  - id: "bl7_kd_dokuzuncu_kat"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 96, max: 104 }
    kosul: { bolum: 7, bayrak: "kule_acik", bayrak_yok: "yanki_gorundu" }
    agirlik: 6
    etiketler: ["kesif", "kule", "yanki", "lonca"]
    gerilim: 2
    kart: { tr: "Kule çarpması", en: "Spire-sick" }
    sahne: "bl7_kd_dokuzuncu_kat_1"
    sahneler:
      - id: "bl7_kd_dokuzuncu_kat_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gişenin arka odasından bir adam bağırıyor; sesi kısılmış, belli ki saatlerdir hiç susmamış. Kapıya Lonca'nın mührüyle bir kâğıt yapıştırılmış: KULE ÇARPMASI. YAKLAŞMAYIN.", en: "A man is shouting from the back room of the booth, hoarse, like he's been at it for hours. There's a paper on the door with the Guild's stamp on it: SPIRE-SICK. KEEP BACK." }
          - { tr: "Kuyruktakiler kendi aralarında fısıldaşıyor. Adı Bora'ymış, dün gece dokuzuncu kattan inmiş; kat girişindeki yazının onunla konuştuğunu söylüyormuş. Hem de büyük harfle değil, küçük harfle.", en: "People in line are whispering. His name's Boone. He came down from Floor 9 last night, and he says the inscription at the floor's entrance talked to him. Not in capitals, either. In lowercase." }
          - { tr: "Lonca'nın gişe memuru kapının önünde kollarını kavuşturmuş bekliyor. \"Adam yorgun,\" diyor sana. \"Kuyruk paniklerse günün kazancının yarısı gider. Sabah {yer:tepe|e} çıkarıp {fraksiyon:yukselenler|e} veririz; onlar böylelerini sever.\"", en: "The Guild clerk's standing outside the door with his arms crossed. \"Guy's just tired,\" he tells you. \"If the line panics, we lose half the day's take. In the morning we haul him up to {yer:tepe} and hand him off to {fraksiyon:yukselenler|k}. They love this kind of thing.\"" }
          - { tr: "Gişenin camında dünkü bülten asılı. Ortadaki satırın üstüne biri kurşun kalemle bir soru işareti koymuş.", en: "Yesterday's bulletin is taped up in the booth window. Somebody's penciled a question mark over the middle line." }
          - metin: { tr: "Memur halkanı görünce sesini alçaltıyor: \"Senden saklayacak değilim. Kâğıdı ben yapıştırdım ama emir yukarıdan.\"", en: "The clerk sees your ring and drops his voice. \"Not gonna hide it from you. I taped up the paper, but the order came from upstairs.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Kapının altından sızan ışık titriyor. Adam içeride bir pencereyi açıp açıp kapıyor, sanki bir şeyi yakalamaya çalışıyor.", en: "The light leaking under the door keeps flickering. He's in there opening and closing a window, over and over, like he's trying to catch something." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dokuzuncu kat mı? ben orada hiç bulunmadım. ya biri benim gibi yazmayı öğreniyor ya da ben sızıyorum. ikisi de kötü haber; biri daha kötü.", en: "floor nine? i've never been there. so either something's learning to write like me, or i'm leaking. both are bad news. one's worse." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Küçük harf mi dedi? Bültendekiyle aynı mı, önce onu sormamız lazım.\"", en: "\"Did he say lowercase? First thing we ask is whether it matches the bulletin.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kule'de üç gün kalan herkes bir şey görür. Ama bu adamın sesi deli sesi değil; korkmuş bir adamın sesi.\"", en: "\"Anyone who spends three days in the Spire sees things. But that's not a crazy voice. That's a scared man.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Tepe'ye vermek... Bunu nasıl bu kadar rahat söyleyebiliyor?\"", en: "\"Hand him off to the Heights... How does he say that like it's nothing?\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "İçeri gir, adamı dinle", en: "Go in and hear the man out" }
            sonraki: "bl7_kd_dokuzuncu_kat_konus"
          - id: "birak"
            etiket: { tr: "Kâğıdı yırt, adamı serbest bırak", en: "Tear down the paper. Let him out" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - itibar: { lonca: -2 }
              - iliski: { kaya_demir: { saygi: -1 } }
              - bayrak: "bl7_bora_serbest"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
            sonraki: "bl7_kd_dokuzuncu_kat_birak"
          - id: "yorgun"
            tur: "gizle"
            etiket: { tr: "Memura hak ver: adam yorgun, o kadar", en: "Back the clerk up. The guy's tired, that's all" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -2 }
              - bayrak: "bl7_bora_tepeye"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
            sonraki: "bl7_kd_dokuzuncu_kat_yorgun"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} dokuzuncu katı sor", en: "Ask {npc:yanki} about Floor 9" }
            goster: { bayrak: "yanki_bagi" }
            sonraki: "bl7_kd_dokuzuncu_kat_yanki"

      - id: "bl7_kd_dokuzuncu_kat_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. Sonunda, her zamankinden kısık: kule her şeyi biriktirir. kayıp eşyaları, ölüleri, yarım kalan cümleleri. belki benden de bir kırıntı biriktirdi. belki ben farkında olmadan o merdivenden bir şey düşürdüm.", en: "{npc:yanki} is quiet a long time. Finally, softer than usual: the spire keeps everything. lost things, dead people, unfinished sentences. maybe it kept a crumb of me too. maybe i dropped something down those stairs without noticing." }
          - { tr: "o adamla konuşursan dikkatli ol. benim el yazımı tanıyorsa, seninkini de tanır.", en: "if you talk to that man, be careful. if he knows my handwriting, he'll know yours too." }
        secenekler:
          - id: "konus"
            etiket: { tr: "Yine de içeri gir", en: "Go in anyway" }
            sonraki: "bl7_kd_dokuzuncu_kat_konus"
          - id: "yorgun"
            tur: "gizle"
            etiket: { tr: "Uzak dur; memura hak ver", en: "Keep your distance. Back the clerk up" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -2 }
              - bayrak: "bl7_bora_tepeye"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
            sonraki: "bl7_kd_dokuzuncu_kat_yorgun"

      - id: "bl7_kd_dokuzuncu_kat_konus"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Oda daracık: bir masa, bir tabure, duvarda Lonca'nın kat tarifeleri. Bora otuzlarında, elleri merdiven taşından yara bere içinde; seni görünce bağırmayı kesip masaya vuruyor.", en: "The room's tiny. One table, one stool, the Guild's floor rates on the wall. Boone's in his thirties, hands torn up from the Spire's stone steps. When he sees you, he stops shouting and slaps the table." }
          - { tr: "Masanın tahtasına bir çiviyle harfler kazınmış: yukarıda değilim. aşağıdayım. aranızdayım.", en: "Letters are scratched into the tabletop with a nail: i'm not up there. i'm down here. i'm among you." }
          - { tr: "\"Yirmi yıl tabela yazdım,\" diyor. \"Harf tanırım; bültende titreyen satırla aynı el bu. Ama kimse dinlemiyor.\"", en: "\"Twenty years I painted signs,\" he says. \"I know letters. That's the same hand as the flickering line in the bulletin. Nobody'll listen.\"" }
          - { tr: "Çiziklerin altında daha sığ, yarım kalmış bir satır daha var; sanki eli titremiş de bitirememiş.", en: "Under the scratches there's another line, shallower, unfinished, like his hand shook too hard to finish it." }
        secenekler:
          - id: "oku"
            etiket: { tr: "Yarım kalan satırı oku", en: "Read the unfinished line" }
            gerekli: { stat: { int: 35 } }
            sonraki: "bl7_kd_dokuzuncu_kat_oku"
          - id: "sakin"
            tur: "gizle"
            etiket: { tr: "\"Gördüğünü kimseye anlatma. Kendi iyiliğin için.\"", en: "\"Don't tell anybody what you saw. For your own good.\"" }
            etkiler:
              - gizle: 1
              - ahlak: { insanlik: -1 }
              - bayrak: "bl7_bora_sustu"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
              - xp_seviye: 8
            sonraki: "@akis"
          - id: "inan"
            etiket: { tr: "\"Sana inanıyorum. Seni buradan çıkaracağım.\"", en: "\"I believe you. I'm getting you out of here.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { lonca: -1 }
              - bayrak: "bl7_bora_serbest"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
              - xp_seviye: 9
            sonraki: "bl7_kd_dokuzuncu_kat_birak"

      - id: "bl7_kd_dokuzuncu_kat_oku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Parmağını çiziklerin üstünde gezdirince harfler beliriyor: biri daha var. o biliyor.", en: "You run a finger along the scratches and the letters come clear: there's one more. they know." }
          - { tr: "Bora senin yüzüne bakıyor; bir tabelacının harfleri ölçtüğü gibi, uzun uzun. \"Sen misin?\" diye soruyor, neredeyse fısıltıyla.", en: "Boone looks at your face the way a sign painter sizes up letters, long and careful. \"Is it you?\" he asks, barely above a whisper." }
          - metin: { tr: "Kafanın içinde bir şey kıkırdıyor gibi. Sonra susuyor; bu kez gerçekten susuyor.", en: "Something in your head almost giggles. Then it goes quiet. Really quiet, this time." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "yalan"
            tur: "gizle"
            etiket: { tr: "\"Hayır.\"", en: "\"No.\"" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -1 }
              - bayrak: "bl7_bora_sustu"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sil"
            etiket: { tr: "Cevap verme; çizikleri avucunla sil, onu dışarı çıkar", en: "Don't answer. Rub out the scratches and get him out" }
            etkiler:
              - dikkat: 1
              - ahlak: { merhamet: 1, insanlik: 1 }
              - itibar: { lonca: -1 }
              - bayrak: "bl7_bora_serbest"
              - bayrak: "bl7_bora_biliyor"
              - tohum: { olay: "bl7_kd_karantina", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Gişenin arka odasındaki adamın sesi o günden beri {yer:kule_dibi|de} dilden dile dolaşıyor.", en: "Ever since that day, the voice from the booth's back room has been making the rounds at {yer:kule_dibi}." } }
              - xp_seviye: 10
            sonraki: "bl7_kd_dokuzuncu_kat_birak"

      - id: "bl7_kd_dokuzuncu_kat_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kâğıdı söküp kapıyı açıyorsun. Memur bir adım geri çekiliyor, ama defterine bir şeyler karalamayı ihmal etmiyor: yüzünü, saati, yırtılan kâğıdı.", en: "You rip down the paper and open the door. The clerk steps back, but not before he scribbles something in his ledger. Your face. The time. The torn paper." }
          - { tr: "Bora kuyruğun yanından geçerken kimseyle konuşmuyor; yine de herkes ona bakıyor. Kuyruğun ucunda iki kişi ipini toplayıp yürüyüp gidiyor.", en: "Boone doesn't say a word to anybody as he walks past the line, but every head turns. At the back, two climbers coil up their rope and walk away." }
        secenekler:
          - id: "son"
            etiket: { tr: "Onu meydanın kıyısına kadar geçir", en: "Walk him to the edge of the plaza" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_kd_dokuzuncu_kat_yorgun"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Memurun omuzları gevşiyor. \"Bak, biri anlıyor,\" diyor kuyruğa dönüp. Kapının ardındaki ses bir an kesiliyor; seni duymuş.", en: "The clerk's shoulders drop. \"See? Somebody gets it,\" he tells the line. The voice behind the door cuts off for a second. He heard you." }
          - { tr: "Kuyruk yeniden yürümeye başlıyor. Gişenin camındaki bültende, soru işaretli satır güneşte solup gidiyor.", en: "The line starts moving again. In the booth window, the line with the question mark is fading in the sun." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kuyruğun yanından yürüyüp git", en: "Walk on past the line" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ------------------------------------------------------------------ takip: karantina kulübesi
  - id: "bl7_kd_karantina"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    kosul: { bolum: 7, bayrak: "kule_acik" }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kule", "yanki", "lonca"]
    gerilim: 2
    kart: { tr: "Dokuzda biri bekliyor", en: "Someone's waiting on nine" }
    sahne: "bl7_kd_karantina_1"
    sahneler:
      - id: "bl7_kd_karantina_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Bora artık kuyruğun başında, bir tabureye çıkmış konuşuyor. Elinde kömürle yazılmış bir karton var: KAT DOKUZ KONUŞUYOR. Kuyruk yarıya inmiş; gişe memuru camın ardında dişlerini sıkıyor.", en: "Boone's at the head of the line now, up on a stool, talking. He's holding a piece of cardboard lettered in charcoal: FLOOR NINE TALKS. The line's down by half, and the clerk is grinding his teeth behind the glass." }
            kosul: { bayrak: "bl7_bora_serbest" }
          - metin: { tr: "Bora gişenin önünü süpürüyor. Lonca onu işe almış: susması karşılığında günde iki öğün. Seni görünce süpürgeyi bırakıp başını eğiyor.", en: "Boone is sweeping in front of the booth. The Guild gave him a job: two meals a day in exchange for keeping his mouth shut. When he sees you, he stops sweeping and lowers his head." }
            kosul: { bayrak: "bl7_bora_sustu", bayrak_yok: "bl7_bora_serbest" }
          - metin: { tr: "Gişenin arka odası boş. Kapıdaki kâğıt sökülmüş, yerinde bir damla beyaz mum kalmış; Yükselenler'in mumu. Kuyrukta Bora'nın adını anan yok.", en: "The booth's back room is empty. The paper's been torn off the door, and in its place there's a drip of white wax. Ascended candle wax. Nobody in line says Boone's name." }
            kosul: { bayrak: "bl7_bora_tepeye", bayrak_yok: ["bl7_bora_serbest", "bl7_bora_sustu"] }
          - { tr: "Kule'nin dibindeki tebeşir duvarına küçük harflerle yeni bir satır yazılmış: dokuzda biri bekliyor. Kimin yazdığını bilen yok.", en: "There's a new line on the chalk wall at the foot of the Spire, in lowercase: someone's waiting on nine. Nobody knows who wrote it." }
          - metin: { tr: "Bülten gecesinden beri herkes Bora'nın neyi duyduğunu biliyor. Dün onu deli sayanlar bugün ona soru soruyor.", en: "Since the night of the bulletin, everybody knows what Boone heard. The same people who called him crazy yesterday are asking him questions today." }
            kosul: { bayrak: "yanki_gorundu" }
          - metin: { tr: "Bora seni görünce gözlerini kaçırmıyor. Masadaki yarım satırı sen okumuştun, o da senin okuduğunu biliyor.", en: "Boone doesn't look away when he sees you. You read the half-finished line on that table, and he knows you did." }
            kosul: { bayrak: "bl7_bora_biliyor" }
        sezgiler:
          - kosul: { stat: { per: 38 } }
            metin: { tr: "Duvardaki satırın tebeşiri Bora'nın parmaklarındaki tozla aynı renk değil. Bunu başka biri yazmış.", en: "The chalk on that wall isn't the same color as the dust on Boone's fingers. Somebody else wrote it." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "dokuzda bekleyen ben değilim. ama artık merak ediyorum. sen de merak ediyorsun, biliyorum; nabzın söylüyor.", en: "it's not me waiting on nine. but now i'm curious. you are too, i can tell. your pulse says so." }
        secenekler:
          - id: "sustur"
            etiket: { tr: "Bora'yı tabureden indir, susmasını iste", en: "Get Boone off the stool. Ask him to stop" }
            goster: { bayrak: "bl7_bora_serbest" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - itibar: { lonca: 1 }
            sonraki: "bl7_kd_karantina_sustur"
          - id: "konussun"
            etiket: { tr: "Bırak konuşsun; kuyruk kendi karar versin", en: "Let him talk. The line can make up its own mind" }
            goster: { bayrak: "bl7_bora_serbest" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { lonca: -2 }
              - tehlike: { kule_dibi: -2 }
            sonraki: "bl7_kd_karantina_konussun"
          - id: "gercek"
            etiket: { tr: "Ona gördüğünün gerçek olduğunu söyle", en: "Tell him what he saw was real" }
            goster: { bayrak: "bl7_bora_sustu", bayrak_yok: "bl7_bora_serbest" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - dikkat: 1
            sonraki: "bl7_kd_karantina_gercek"
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "Süpürgeyi bırakmasın; yanlış görmüş", en: "Let him keep sweeping. He saw it wrong" }
            goster: { bayrak: "bl7_bora_sustu", bayrak_yok: "bl7_bora_serbest" }
            etkiler:
              - gizle: 1
              - ahlak: { insanlik: -2 }
            sonraki: "bl7_kd_karantina_sakla"
          - id: "vahit"
            etiket: { tr: "{npc:vahit|e} bir not yaz, Bora'yı geri iste", en: "Write {npc:vahit} a note. Ask for Boone back" }
            goster: { bayrak: "bl7_bora_tepeye", bayrak_yok: ["bl7_bora_serbest", "bl7_bora_sustu"], npc_hayatta: "vahit" }
            etkiler:
              - iliski: { vahit: { saygi: 2 } }
              - itibar: { yukselenler: -1 }
            sonraki: "bl7_kd_karantina_vahit"
          - id: "duvar"
            etiket: { tr: "Duvardaki satıra uzun uzun bak, sonra yürü", en: "Look at the line on the wall a long time. Then walk" }
            goster: { bayrak: "bl7_bora_tepeye", bayrak_yok: ["bl7_bora_serbest", "bl7_bora_sustu"] }
            etkiler:
              - ahlak: { merhamet: -1 }
            sonraki: "bl7_kd_karantina_duvar"
          - id: "siginak"
            etiket: { tr: "Bora'yı {yer:kiyikent_liman|e} götür, Konsey baksın", en: "Take Boone down to {yer:kiyikent_liman}. Let the Council look after him" }
            goster: { bayrak_yok: "bl7_bora_tepeye" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            sonraki: "bl7_kd_karantina_siginak"

      - id: "bl7_kd_karantina_sustur"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bora tabureden iniyor ama kartonu bırakmıyor. \"Beni sen çıkardın,\" diyor. \"Şimdi de susmamı mı istiyorsun?\"", en: "Boone climbs down off the stool, but he hangs on to the cardboard. \"You're the one who got me out,\" he says. \"Now you want me to shut up?\"" }
          - { tr: "Kartonu katlayıp cebine sokuyor. Kuyruk yavaş yavaş uzuyor; memur camın ardından sana minnetle bakıyor; o bakış Bora'nınkinden de ağır geliyor.", en: "He folds the cardboard and shoves it in his pocket. The line slowly grows back. The clerk gives you a grateful look through the glass, and somehow that's heavier than Boone's." }
        secenekler:
          - id: "son"
            etiket: { tr: "Bir şey deme, uzaklaş", en: "Say nothing. Walk away" }
            etkiler:
              - bayrak: "bl7_bora_susturuldu"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_kd_karantina_konussun"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tabureden inmesini istemiyorsun. Gün batarken kuyruğun yarısı dağılmış; dokuzuncu kat için ip satan tezgâhçılar tezgâhlarını topluyor.", en: "You don't ask him to come down. By sundown half the line's gone, and the vendors selling rope for Floor 9 are packing up their stalls." }
          - { tr: "O gece Kule'den dönmeyen kimse olmuyor. Haftalardır ilk kez tebeşir duvarına yeni bir ad yazılmıyor.", en: "That night, nobody fails to come back down from the Spire. For the first time in weeks, no new name goes up on the chalk wall." }
        secenekler:
          - id: "son"
            etiket: { tr: "Bora'nın omzuna vurup meydandan ayrıl", en: "Clap Boone on the shoulder and leave the plaza" }
            etkiler:
              - bayrak: "bl7_bora_vaiz"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_kd_karantina_gercek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Doğru gördün,\" diyorsun alçak sesle. Bora süpürgeye yaslanıp bir süre öylece kalıyor; ardından gözleri doluyor.", en: "\"You saw it right,\" you tell him quietly. Boone leans on the broom and stays like that a while. Then his eyes fill up." }
          - { tr: "\"Yirmi yıl tabela yazdım,\" diyor. \"İlk kez biri bana harfi doğru okuduğumu söyledi.\" Süpürgeyi duvara dayayıp gişeye yürüyor; iki öğünlük fişini memurun önüne bırakıyor.", en: "\"Twenty years painting signs,\" he says, \"and that's the first time anybody told me I read the letters right.\" He leans the broom against the wall, walks over to the booth, and drops his two-meal chit in front of the clerk." }
        secenekler:
          - id: "son"
            etiket: { tr: "Onu Kule'nin gölgesinden çıkar", en: "Walk him out of the Spire's shadow" }
            etkiler:
              - bayrak: "bl7_bora_vaiz"
              - itibar: { lonca: -1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_kd_karantina_sakla"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "\"Yorgundun,\" diyorsun. \"Kule'de herkes bir şey görür.\" Bora başını sallıyor, süpürmeye devam ediyor; her süpürüşte biraz daha yavaş.", en: "\"You were tired,\" you say. \"Everybody sees things in the Spire.\" Boone nods and goes back to sweeping, a little slower with every stroke." }
          - { tr: "Arkanı döndüğünde süpürgenin sesi kesiliyor. Dönüp bakmıyorsun.", en: "When you turn your back, the sound of the broom stops. You don't look back." }
        secenekler:
          - id: "son"
            etiket: { tr: "Meydandan ayrıl", en: "Leave the plaza" }
            etkiler:
              - bayrak: "bl7_bora_susturuldu"
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_kd_karantina_vahit"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Notu bir müride verip {yer:tepe|e} yolluyorsun. Akşamüstü cevap geliyor, {npc:vahit|in} temiz el yazısıyla: \"Kardeşimiz Bora dinlenmekte. Kendisi isterse kapımız açık; istemezse de açık.\"", en: "You give the note to a disciple to carry up to {yer:tepe}. The answer comes back late in the afternoon in {npc:vahit|pos} neat handwriting: \"Our brother Boone is resting. If he wishes to leave, our door is open. If he doesn't, it remains open.\"" }
          - { tr: "Ertesi sabah Bora yokuştan iniyor, sırtında beyaz bir cüppe. Gişeye uğramadan doğruca tebeşir duvarına gidip satırın altına bir şey yazıyor: geldim.", en: "The next morning Boone comes down the hill wearing a white robe. He skips the booth and goes straight to the chalk wall, where he writes something under the line: i came." }
        secenekler:
          - id: "son"
            etiket: { tr: "Yazdığına bir süre bak", en: "Look at what he wrote for a while" }
            etkiler:
              - bayrak: "bl7_bora_yukselenlerde"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_kd_karantina_duvar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Satırın tebeşiri taze, tozu henüz yere düşmemiş. Altında boş bir yer var; yeni bir satır için bırakılmış gibi.", en: "The chalk's fresh. The dust hasn't even fallen yet. There's an empty space under it, like it was left for another line." }
          - { tr: "Kimse yazmıyor. Sen de yazmıyorsun.", en: "Nobody writes one. Neither do you." }
        secenekler:
          - id: "son"
            etiket: { tr: "Yürü", en: "Walk" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_kd_karantina_siginak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bora'yı {yer:kiyikent_liman|e} kadar yürütüyorsun. Yol boyunca tabelaları okuyor: kırık harfleri, eğri yazılmış fiyatları. \"Bunların hepsini ben yazmıştım,\" diyor bir tanesinin önünde.", en: "You walk Boone all the way down to {yer:kiyikent_liman}. He reads the signs the whole way: busted letters, crooked prices. \"I painted every one of these,\" he says, stopping in front of one." }
          - { tr: "Konsey'in sahra çadırında ona bir yatak, bir de kalem veriyorlar. Akşam bülten geldiğinde titreyen satırı herkesten önce o görüyor; bu kez kimse ona deli demiyor.", en: "At the Council's field tent they give him a cot and a pencil. When the bulletin comes in that evening, he spots the flickering line before anyone else, and this time nobody calls him crazy." }
        secenekler:
          - id: "son"
            etiket: { tr: "Onu çadırda bırak", en: "Leave him at the tent" }
            etkiler:
              - bayrak: "bl7_bora_siginakta"
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · KULE DİBİ: SES AVCILARI
  - id: "bl7_kd_ses_avcilari"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    gun: { min: 106, max: 121 }
    kosul: { bolum: 7, bayrak: ["kule_acik", "yanki_gorundu"] }
    agirlik: 6
    etiketler: ["kesif", "kule", "yanki", "dikkat"]
    gerilim: 3
    kart: { tr: "Yirmi kristal", en: "Twenty crystals" }
    sahne: "bl7_kd_ses_avcilari_1"
    sahneler:
      - id: "bl7_kd_ses_avcilari_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avcı pazarının ilan tahtasında bu sabah imzasız bir kâğıt asılı: İÇİNDE SES TAŞIYANI GETİRENE YİRMİ KRİSTAL. Altına biri küçük harflerle eklemiş: birinin içinde.", en: "There's an unsigned notice on the hunter market's board this morning: 20 CRYSTALS FOR WHOEVER BRINGS IN THE ONE CARRYING THE VOICE. Somebody's added underneath, in lowercase: inside someone." }
          - { tr: "Kuyruk boyunca üç kişi dolaşıyor. Birinin elinde eski bir el telsizi var, antenine çatlak bir kapı çekirdeği sarılmış; telsiz kimin yanına gelse cızırdıyor, bazılarının yanında boğuk boğuk ötüyor.", en: "Three people are working their way down the line. One of them is carrying an old walkie-talkie with a cracked Gate core wired to the antenna. It crackles at everybody it passes, and next to some people it lets out a muffled whine." }
          - { tr: "Telsiz şimdi on bir yaşlarında bir oğlanın önünde susmak bilmiyor. Çocuğun penceresi Kule'de aldığı bir yaradan beri takılıyor, bunu herkes biliyor. Avcıların umurunda bile değil; çocuğu kolundan sürüklüyorlar.", en: "Right now it won't shut up in front of a boy about eleven. His window's been glitching ever since he got hurt in the Spire, and everybody knows it. The hunters don't care. They're dragging him off by the arm." }
          - metin: { tr: "Bülten gecesi o sesin seninle olduğunu herkesin önünde söylemiştin. Avcılardan biri seni görünce duraksıyor, ama arkadaşları ilandaki rakama bakıp yürümeye devam ediyor.", en: "On the night of the bulletin, you told everybody that voice was with you. One of the hunters falters when he sees you, but his buddies glance at the number on the notice and keep walking." }
            kosul: { bayrak: "yanki_sahiplenildi" }
          - metin: { tr: "İnkâr etmiştin. Şimdi o inkârın bedelini başkası ödüyor.", en: "You denied it. Now somebody else is paying for that." }
            kosul: { bayrak: "yanki_inkar_edildi" }
          - metin: { tr: "Sesi susturmuştun. Telsizin cızırtısı yine de içini gıcıklıyor; susan bir şey de iz bırakır.", en: "You shut the voice down. Even so, the crackle of that radio itches somewhere inside you. Even silence leaves a mark." }
            kosul: { bayrak: "yanki_susturuldu" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Telsiz sana yaklaşırsa ötmekle kalmaz, çığlık atar. Aranızda yirmi adım var.", en: "If that radio gets close to you, it won't whine. It'll scream. There are twenty paces between you." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "o oyuncak beni bulamaz. ama sana yaklaşırsa bulmuş gibi yapar. ikisi de aynı kapıya çıkar.", en: "that toy can't find me. but if it gets near you, it'll act like it did. same difference." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Penceresi yaralı olan çocuğu sürüklüyorlar. O yarayı ben diktim.\"", en: "\"That's the kid with the injured window they're dragging. I stitched that wound myself.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Yirmi mi? Bana sorsalar kırk derdim. Sen ucuz gidiyorsun.\"", en: "\"Twenty? If they'd asked me, I'd have said forty. You're going cheap.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Senin yerine o çocuğu götürüyorlar. Bunu biliyorsun, değil mi?\"", en: "\"They're taking that kid instead of you. You know that, right?\"" }
        secenekler:
          - id: "kir"
            tur: "gizle"
            etiket: { tr: "Telsizin frekansını boz; çocuğu bıraksın", en: "Scramble the radio's signal so it loses the kid" }
            gerekli: { stat: { int: 40 } }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: 1 }
            sonraki: "bl7_kd_ses_avcilari_kir"
          - id: "ben"
            etiket: { tr: "Önlerine çık: \"Aradığınız benim.\"", en: "Step in front of them. \"It's me you want.\"" }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 2, insanlik: 2 }
            sonraki: "bl7_kd_ses_avcilari_ben"
          - id: "kavga"
            etiket: { tr: "Çocuğu avcıların elinden çek; direnirlerse dövüş", en: "Pull the kid away. Fight them if they push back" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - savas: { dusmanlar: ["karaborsa_tetikcisi@dunya", "karaborsa_tetikcisi@dunya"], kazan: "bl7_kd_ses_avcilari_zafer", kaybet: "bl7_kd_ses_avcilari_yenilgi", kac: "bl7_kd_ses_avcilari_kacis" }
          - id: "yonlendir"
            etiket: { tr: "\"Telsiz {yer:eski_sehir|e} doğru ötüyor, duymuyor musunuz?\"", en: "\"Can't you hear it? It's whining toward {yer:eski_sehir}.\"" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "bl7_kd_ses_avcilari_bos", basarisiz_etkiler: [{ dikkat: 2 }] }
            etkiler:
              - gizle: 1
            sonraki: "bl7_kd_ses_avcilari_yonlendir"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari} çocuğun yarasını göstersin", en: "Have {npc:elif_sari} show them the kid's wound" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { saygi: 3, guven: 1 } }
              - ahlak: { merhamet: 1 }
            sonraki: "bl7_kd_ses_avcilari_elif"

      - id: "bl7_kd_ses_avcilari_kir"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kalabalığın arasından geçerken parmağını telsizin antenine sürtüyorsun; çekirdeğin çatlağından içeri ince bir mana sızıyor. Telsiz bir an susup Lonca'nın gişe memuruna dönüyor ve avaz avaz ötmeye başlıyor.", en: "You brush a finger against the antenna on your way through the crowd and push a thread of mana into the crack in the core. The radio goes quiet for a second, swings toward the Guild clerk, and starts howling." }
          - { tr: "Avcılar memura saldırıyor, memur bağırıyor, kuyruk birbirine giriyor. Kargaşada çocuğun kolunu bırakıyorlar; liderleri yine de çocuğun yüzüne uzun uzun bakıyor. \"Seni unutmadım,\" diyor.", en: "The hunters go for the clerk, the clerk starts yelling, and the line turns into a mess. In the chaos they let go of the kid, though their leader takes a long look at his face first. \"I won't forget you,\" he says." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kalabalığın içinde kaybol", en: "Disappear into the crowd" }
            etkiler:
              - bayrak: "bl7_efe_isaretli"
              - xp_seviye: 10
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların telsizi o günden beri {yer:kule_dibi|de} görünmedi, ama telsizin öttüğü çocuğun adını artık herkes biliyor.", en: "Nobody's seen the hunters' radio at {yer:kule_dibi} since, but everybody knows the name of the kid it whined at." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_ben"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Telsiz sana yirmi adım kala çığlığı basıyor; çekirdek antenin ucunda kıvılcımlar saçıp kararıyor. Avcıların ikisi geri çekiliyor.", en: "Twenty paces out, the radio starts screaming. The core sparks at the tip of the antenna and goes dark. Two of the hunters back off." }
          - { tr: "Liderleri kalıyor, bir sana bakıyor, bir ilan tahtasına. Sonra kâğıdı söküp buruşturuyor. \"Yirmi kristal seni taşımaya yetmez,\" diyor ve çocuğun kolunu bırakıyor.", en: "Their leader stays. He looks at you, then at the board. Then he tears down the notice and wads it up. \"Twenty crystals isn't enough to carry you,\" he says, and lets go of the kid's arm." }
          - { tr: "Çocuk gitmiyor. Pazarın ortasında durmuş, sana kocaman açılmış gözlerle bakıyor.", en: "The kid doesn't run. He just stands in the middle of the market, staring at you with huge eyes." }
        secenekler:
          - id: "soyle"
            etiket: { tr: "Çocuğun yanına diz çök: \"Sen bir şey yapmadın.\"", en: "Kneel by the kid. \"You didn't do anything.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl7_avcilar_dagildi"
              - xp_seviye: 10
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Kimseye bakmadan meydandan çık", en: "Leave the plaza without looking at anyone" }
            etkiler:
              - bayrak: "bl7_avcilar_dagildi"
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İki avcı yerde, üçüncüsü telsizi bırakıp kaçıyor. Telsizi topuğunla eziyorsun; çekirdeğin parçaları asfaltta mavi mavi sönüyor.", en: "Two hunters are down, and the third drops the radio and runs. You grind it under your heel, and the pieces of the core fizzle out blue on the asphalt." }
          - { tr: "Pazardakiler kavgayı seyretmiş, şimdi fısıldaşıyor. Fısıltının konusu sen değilsin; çocuk. \"Onu koruyan biri var,\" diyorlar. \"Demek ki bir şey var onda.\"", en: "The whole market watched, and now they're whispering. Not about you. About the kid. \"Somebody's protecting him,\" they're saying. \"So there's something to him.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Çocuğu evine kadar geçir", en: "Walk the kid home" }
            etkiler:
              - bayrak: "bl7_avcilar_dagildi"
              - bayrak: "bl7_efe_isaretli"
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 14
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Pazardaki kavgadan beri {yer:kule_dibi|de} korunan çocuğun adı dilden dile dolaşıyor.", en: "Ever since the fight in the market, the name of the kid somebody protected has been making the rounds at {yer:kule_dibi}." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir tabanca kabzası şakağına iniyor. Ayıldığında pazar dağılmış, avcılar da çocuk da yok.", en: "A pistol butt catches you in the temple. When you come to, the market's broken up, and the hunters and the kid are both gone." }
          - { tr: "Çaycı başında, elinde ıslak bir bez. \"{yer:eski_sehir|e} doğru götürdüler,\" diyor. \"Ses çıkmayınca bırakırlar. Bırakırlar, değil mi?\"", en: "The tea man's leaning over you with a wet rag. \"They took him toward {yer:eski_sehir},\" he says. \"When there's no voice, they'll let him go. They'll let him go, right?\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Doğrul, yaranı sar", en: "Sit up and bandage the cut" }
            etkiler:
              - can: 20
              - bayrak: "bl7_efe_goturuldu"
              - tehlike: { kule_dibi: 2 }
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların {yer:kule_dibi|den} götürdüğü çocuk iki gece sonra kaşı patlamış hâlde geri döndü.", en: "The kid the hunters took from {yer:kule_dibi} turned up two nights later with a split eyebrow." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Avcılar peşine düşmüyor; ellerinde zaten aradıklarını sandıkları biri var.", en: "You back off. The hunters don't come after you. They've already got the one they think they want." }
        secenekler:
          - id: "son"
            etiket: { tr: "Pazardan uzaklaş", en: "Get away from the market" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - bayrak: "bl7_efe_goturuldu"
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların {yer:kule_dibi|den} götürdüğü çocuk iki gece sonra kaşı patlamış hâlde geri döndü.", en: "The kid the hunters took from {yer:kule_dibi} turned up two nights later with a split eyebrow." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_yonlendir"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Liderleri telsizi kulağına dayayıp dinliyor; boğuk ötüş, senin dediğin gibi, {yer:eski_sehir|in} yokuşuna dönük. Daha doğrusu sen öyle dediğin için ona öyle geliyor.", en: "Their leader holds the radio up to his ear and listens. The muffled whine does point up toward {yer:eski_sehir}, just like you said. Or it sounds like it does, because you said so." }
          - { tr: "\"Sağ ol, avcı,\" deyip çocuğu bırakıyorlar. Çocuk kolunu ovuşturarak sana bakıyor. Neden bu kadar emin konuştuğunu soracak yaşta değil.", en: "\"Thanks, hunter,\" they say, and let the kid go. He rubs his arm and looks at you. He's not old enough to ask how you sounded so sure." }
        secenekler:
          - id: "son"
            etiket: { tr: "Onlar gidince çocuğu kuyruktan çıkar", en: "Once they're gone, pull the kid out of line" }
            etkiler:
              - bayrak: "bl7_efe_isaretli"
              - xp_seviye: 10
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların telsizi o günden beri {yer:kule_dibi|de} görünmedi, ama telsizin öttüğü çocuğun adını artık herkes biliyor.", en: "Nobody's seen the hunters' radio at {yer:kule_dibi} since, but everybody knows the name of the kid it whined at." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_bos"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Lider gülüyor. \"{yer:eski_sehir} mi? Telsiz ters tarafa ötüyor evlat.\" Anteni sana çeviriyor; cızırtı bir perde yükseliyor, sonra bir perde daha.", en: "The leader laughs. \"{yer:eski_sehir|b}? The radio's whining the other way, pal.\" He swings the antenna at you. The crackle climbs a notch, then another." }
          - { tr: "Arkadaşları çocuğu bırakmadan sana dönüyor. Pazarın yarısı işi bırakmış, sizi seyrediyor.", en: "His buddies turn toward you without letting go of the kid. Half the market has stopped what it's doing to watch." }
        secenekler:
          - id: "kavga"
            etiket: { tr: "Telsize uzan; direnirlerse dövüş", en: "Grab for the radio. Fight them if they push back" }
            etkiler:
              - savas: { dusmanlar: ["karaborsa_tetikcisi@dunya", "karaborsa_tetikcisi@dunya"], kazan: "bl7_kd_ses_avcilari_zafer", kaybet: "bl7_kd_ses_avcilari_yenilgi", kac: "bl7_kd_ses_avcilari_kacis" }
          - id: "cekil"
            etiket: { tr: "Ellerini kaldır, geri çekil", en: "Put your hands up and back off" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - bayrak: "bl7_efe_goturuldu"
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların {yer:kule_dibi|den} götürdüğü çocuk iki gece sonra kaşı patlamış hâlde geri döndü.", en: "The kid the hunters took from {yer:kule_dibi} turned up two nights later with a split eyebrow." } }
            sonraki: "@akis"

      - id: "bl7_kd_ses_avcilari_elif"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} avcıların arasına girip çocuğun yenini sıyırıyor. Çocuğun dirseğinin üstünde, Kule taşının bıraktığı yıldız biçiminde bir yara izi var. \"Pencereyi besleyen sinir buradan geçer,\" diyor. \"Ben diktim. Telsiziniz yara izini dinliyor, ses değil.\"", en: "{npc:elif_sari} steps in between the hunters and rolls up the kid's sleeve. Above his elbow there's a star-shaped scar from a chunk of Spire stone. \"The nerve that feeds the window runs right here,\" she says. \"I stitched it. Your radio is listening to a scar, not a voice.\"" }
          - { tr: "Avcılar homurdanarak çocuğu bırakıyor. Lider yine de çocuğun yüzünü aklına yazıyor; {npc:elif_sari} bundan hiç hoşlanmıyor.", en: "The hunters let go of the kid with a lot of grumbling. Their leader still memorizes his face, and {npc:elif_sari} does not like that one bit." }
        secenekler:
          - id: "son"
            etiket: { tr: "Çocuğu {npc:elif_sari|le} birlikte kuyruktan çıkar", en: "Get the kid out of line with {npc:elif_sari}" }
            etkiler:
              - bayrak: "bl7_efe_isaretli"
              - xp_seviye: 10
              - tohum: { olay: "bl7_kd_isaretli_cocuk", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Avcıların telsizi o günden beri {yer:kule_dibi|de} görünmedi, ama telsizin öttüğü çocuğun adını artık herkes biliyor.", en: "Nobody's seen the hunters' radio at {yer:kule_dibi} since, but everybody knows the name of the kid it whined at." } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ takip: işaretli çocuk
  - id: "bl7_kd_isaretli_cocuk"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    kosul: { bolum: 7 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kule", "yanki", "dikkat"]
    gerilim: 3
    kart: { tr: "Senin yerine", en: "In your place" }
    sahne: "bl7_kd_isaretli_cocuk_1"
    sahneler:
      - id: "bl7_kd_isaretli_cocuk_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın arkasında, kırık bir otobüs durağının altında çocuklar halka olmuş. Ortada Efe oturuyor; önüne ekmek, şeker, iki küçük kristal bırakmışlar. Biri ona penceresini açtırmış, takılan satıra bakıyor; öbürleri nefesini tutmuş bekliyor.", en: "Behind the market, under a busted bus shelter, a bunch of kids have formed a circle. Eli's sitting in the middle with bread, candy, and two little crystals laid out in front of him. One kid has him open his window and is staring at the glitching line while the rest hold their breath." }
          - { tr: "\"Ses ne diyor?\" diye soruyor içlerinden en küçüğü. Efe gözlerini kısıp bir süre susuyor, ardından ciddi ciddi uyduruyor: \"Yarın yağmur yağmayacak diyor.\" Çocuklar inanıyor.", en: "\"What's the voice saying?\" asks the littlest one. Eli squints and stays quiet a while, then makes something up with a perfectly straight face. \"It says it's not gonna rain tomorrow.\" The kids buy it." }
          - metin: { tr: "Sağ kaşının üstünde taze bir dikiş var. Avcılar onu {yer:eski_sehir|de} bir gece tutup bırakmışlar; ses çıkmayınca yirmi kristali alamamışlar.", en: "There's fresh stitching over his right eyebrow. The hunters held him one night in {yer:eski_sehir} and let him go. No voice, no twenty crystals." }
            kosul: { bayrak: "bl7_efe_goturuldu" }
          - { tr: "Tezgâhçı kadınlardan biri seni kenara çekiyor. \"Bu gece başka bir ekip gelecekmiş,\" diyor. \"Bunlar telsizle değil, zincirle geliyor.\"", en: "One of the women who work the stalls pulls you aside. \"Word is another crew's coming tonight,\" she says. \"These ones don't bring a radio. They bring chains.\"" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Efe yalan söylerken kulaklarına kadar kızarıyor; ama kimse yüzüne bakmıyor, herkes penceresine bakıyor.", en: "Eli turns red to the ears when he lies. But nobody's looking at his face. They're all looking at his window." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "bak, bir mabedim var. küçük ama samimi. keşke gerçekten ben olsaydım; o çocuğa söyleyecek güzel şeylerim var.", en: "look, i have a shrine. small, but sincere. i wish it really were me in there. i've got nice things i'd tell that kid." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hayatında ilk kez biri onu dinliyor. Bunu elinden almak da bir şey, bırakmak da.\"", en: "\"First time in his life anybody's listened to him. Taking that away means something. So does leaving it alone.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sinyal ile gürültüyü ayıramayan bir kalabalık. En tehlikeli dinleyici budur.\"", en: "\"A crowd that can't tell signal from noise. That's the most dangerous kind of audience.\"" }
        secenekler:
          - id: "yem"
            tur: "gizle"
            etiket: { tr: "Bırak oyunu sürsün; gözler onda kalsın", en: "Let the game go on. Keep all eyes on him" }
            etkiler:
              - gizle: 3
              - ahlak: { insanlik: -3, merhamet: -2 }
              - tehlike: { kule_dibi: 2 }
            sonraki: "bl7_kd_isaretli_cocuk_yem"
          - id: "gercek"
            etiket: { tr: "Çocukların önünde söyle: ses onda değil", en: "Tell the kids straight: the voice isn't in him" }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: 2 }
            sonraki: "bl7_kd_isaretli_cocuk_gercek"
          - id: "gotur"
            etiket: { tr: "Efe'yi {yer:kiyikent_liman|e} götür, Konsey'e emanet et", en: "Take Eli down to {yer:kiyikent_liman}. Leave him with the Council" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 1 }
              - iliski: { elif_sari: { guven: 2 } }
            sonraki: "bl7_kd_isaretli_cocuk_gotur"
          - id: "bekle"
            etiket: { tr: "Gece zincirli ekibi durakta bekle", en: "Wait for the chain crew at the bus shelter" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - savas: { dusmanlar: ["karaborsa_tetikcisi@dunya", "karaborsa_tetikcisi@dunya", "karaborsa_tetikcisi@dunya"], ortam: ["karanlik"], kazan: "bl7_kd_isaretli_cocuk_zafer", kaybet: "bl7_kd_isaretli_cocuk_yenilgi", kac: "bl7_kd_isaretli_cocuk_kacis" }
          - id: "yanki"
            etiket: { tr: "{npc:yanki} bir kerelik Efe'nin penceresinden konuşsun", en: "Let {npc:yanki} speak through Eli's window, just once" }
            goster: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            etkiler:
              - dikkat: 2
              - ahlak: { insanlik: 1 }
            sonraki: "bl7_kd_isaretli_cocuk_yanki"

      - id: "bl7_kd_isaretli_cocuk_yem"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hiçbir şey demiyorsun. Efe'nin önündeki ekmekler çoğalıyor; akşama doğru büyükler de gelip sorular sormaya başlıyor. Bir kadın kayıp oğlunu soruyor, Efe ona da bir şey uyduruyor.", en: "You don't say anything. The pile of bread in front of Eli keeps growing, and toward evening the grown-ups start coming by with questions too. A woman asks about her missing son, and Eli makes something up for her as well." }
          - { tr: "O gece telsizler, zincirler, ilanlar hep o durağa dönük. Senin yolun ise sessiz; haftalardır olmadığı kadar sessiz.", en: "That night every radio, every chain, every notice is pointed at that bus shelter. Your road, on the other hand, is quiet. Quieter than it's been in weeks." }
        secenekler:
          - id: "son"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk without looking back" }
            etkiler:
              - bayrak: "bl7_efe_yem"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_gercek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halkanın ortasına çömelip Efe'nin penceresini herkese çeviriyorsun. \"Bu yara,\" diyorsun. \"Ses değil.\" Çocuklar bir Efe'ye, bir sana bakıyor; Efe kızarıp başını öne eğiyor.", en: "You crouch in the middle of the circle and turn Eli's window around so everyone can see. \"That's a scar,\" you say. \"Not a voice.\" The kids look from Eli to you and back. Eli goes red and drops his head." }
          - { tr: "İçlerinden en küçüğü yine de sormadan duramıyor: \"Peki ses kimde?\" Bütün halka sana dönüyor.", en: "The littlest one can't help asking anyway. \"So who's got the voice?\" The whole circle turns to you." }
        secenekler:
          - id: "son"
            etiket: { tr: "Cevap verme; ekmekleri çocuklara paylaştır", en: "Don't answer. Split the bread among the kids" }
            etkiler:
              - bayrak: "bl7_efe_kurtuldu"
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_gotur"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Efe yol boyunca kristallerinden birini avucunda sıkıyor; öbürünü durakta en küçük çocuğa bırakmış. \"Orada da soracaklar mı?\" diyor. \"Ses ne diyor diye?\"", en: "Eli squeezes one of his crystals in his fist the whole way down. He left the other one with the littlest kid at the bus shelter. \"Are they gonna ask there too?\" he says. \"What the voice says?\"" }
          - { tr: "Konsey'in çadırında ona bir yatak, bir de iş veriyorlar: su bidonlarını saymak. Ertesi sabah zincirli ekibin durağa geldiğini ve kimseyi bulamadığını duyuyorsun.", en: "At the Council tent they give him a cot and a job: counting water jugs. The next morning you hear the chain crew showed up at the bus shelter and found nobody." }
        secenekler:
          - id: "son"
            etiket: { tr: "Efe'yi çadırda bırak", en: "Leave Eli at the tent" }
            etkiler:
              - bayrak: "bl7_efe_siginakta"
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Zincirler asfaltta yığılmış yatıyor, sahipleri sokağın ucundan sürüne sürüne uzaklaşıyor. Durağın camları kırılmış ama Efe'ye dokunan olmamış.", en: "The chains are lying in the street, and their owners are crawling off toward the end of the block. The shelter's glass is busted, but nobody laid a finger on Eli." }
          - { tr: "Sabah pazar konuşuyor: Efe'nin durağını gece biri beklemiş. Kimse kim olduğunu yüksek sesle söylemiyor.", en: "By morning the market's buzzing. Somebody stood guard over Eli's shelter all night. Nobody says who out loud." }
        secenekler:
          - id: "son"
            etiket: { tr: "Zincirleri topla, çaycıya bırak", en: "Collect the chains and leave them with the tea man" }
            etkiler:
              - bayrak: "bl7_efe_korundu"
              - tehlike: { kule_dibi: -3 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir zincir bileğine dolanıp seni yere çekiyor. Kalkmaya çalıştıkça biri daha iniyor.", en: "A chain wraps around your wrist and drags you to the ground. Every time you try to get up, another one comes down." }
          - { tr: "Ayıldığında durak boş. Efe'nin kristallerinden biri yerde, ezilmiş. Tezgâhçı kadın, çocuğu son anda kendi tezgâhının altına sakladığını söylüyor; zincirliler eli boş gitmiş.", en: "When you come to, the shelter's empty. One of Eli's crystals is on the ground, crushed. The stall woman tells you she hid the kid under her own counter at the last second, and the chain crew left empty-handed." }
        secenekler:
          - id: "son"
            etiket: { tr: "Doğrul, kadına teşekkür et", en: "Get up and thank her" }
            etkiler:
              - can: 20
              - bayrak: "bl7_efe_kurtuldu"
              - tehlike: { kule_dibi: 1 }
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Karanlıkta geri çekiliyorsun. Zincirliler durağı arıyor; Efe çoktan tezgâhçı kadının tezgâhının altına sinmiş, nefesini tutuyor.", en: "You fall back into the dark. The chain crew tears the shelter apart, but Eli's already curled up under the stall woman's counter, holding his breath." }
        secenekler:
          - id: "son"
            etiket: { tr: "Sabahı bekle", en: "Wait for morning" }
            etkiler:
              - bayrak: "bl7_efe_kurtuldu"
            sonraki: "@akis"

      - id: "bl7_kd_isaretli_cocuk_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Efe'nin penceresindeki takılan satır bir an duruyor, siliniyor. Yerine küçük harflerle bir cümle beliriyor: teşekkürler efe. yerimi iyi tuttun. artık bırakabilirsin.", en: "The glitching line in Eli's window freezes, then wipes. In its place, a sentence appears in lowercase: thanks, eli. you kept my seat warm. you can let go now." }
          - { tr: "Efe satırı uzun uzun okuyor. Sonra çocuklara dönüp sesi titreyerek söylüyor: \"Gitti. Bende değildi zaten, bende... dinleniyordu.\" Çocuklar bu cevabı her şeyden çok seviyor.", en: "Eli reads it for a long time. Then he turns to the other kids, voice shaking. \"It's gone. It wasn't really in me, it was just... resting.\" The kids love that answer more than anything." }
          - { tr: "Kafanın içinde {npc:yanki} memnun bir sessizliğe gömülüyor.", en: "Inside your head, {npc:yanki} settles into a pleased kind of quiet." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kristali Efe'ye geri ver", en: "Hand Eli his crystal back" }
            etkiler:
              - bayrak: "bl7_efe_kurtuldu"
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · KULE DİBİ KAMPI: ELİF
  - id: "bl7_kd_kamp_elif"
    konum: ["kule_dibi"]
    perde: [2]
    bolge: ["kule_dibi"]
    kamp: true
    gun: { min: 96, max: 122 }
    kosul: { bolum: 7 }
    agirlik: 5
    etiketler: ["kamp", "elif", "yoldas", "yanki"]
    gerilim: 1
    npc: ["elif_sari"]
    kart: { tr: "Dakikada kırk iki", en: "Forty-two a minute" }
    sahne: "bl7_kd_kamp_elif_1"
    sahneler:
      - id: "bl7_kd_kamp_elif_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Ateşin başında {npc:elif_sari} senin bileğini tutmuş, saatine bakıyor. \"Alışkanlık,\" diyor, bırakmadan. \"Nabzın dakikada kırk iki. İnsan nabzı değil bu.\"", en: "By the fire, {npc:elif_sari} has two fingers on your wrist and her eyes on her watch. \"Habit,\" she says, not letting go. \"Your pulse is forty-two a minute. That's not a human pulse.\"" }
          - metin: { tr: "\"Akşamları bülten gelince yüzün değişiyor,\" diyor. \"Hasta yakınları böyle bakar, kötü bir sonucu beklerken. Sen neyi bekliyorsun?\"", en: "\"Your face changes when the bulletin comes in at night,\" she says. \"Families look like that in the waiting room, waiting on bad results. What are you waiting on?\"" }
            kosul: { bayrak_yok: "yanki_gorundu" }
          - metin: { tr: "\"Bütün şehir o cümleyi konuşuyor,\" diyor. \"Ben bir şey sormayacağım. Ama hekim olarak bilmem gereken bir şey varsa söyle. Acıtıyor mu?\"", en: "\"The whole city's talking about that sentence,\" she says. \"I'm not going to ask. But if there's something I need to know as your doctor, tell me. Does it hurt?\"" }
            kosul: { bayrak: "yanki_gorundu" }
          - { tr: "Kule'nin gövdesi boyunca tek tük ışıklar yanıyor. {npc:elif_sari} defterini çıkarmış ama kapağını açmamış.", en: "A few lights are burning up the side of the Spire. {npc:elif_sari} has her notebook out but hasn't opened the cover." }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Defterde Konsey'in sağlık kayıtları var. Senin sayfan boş bırakılmış; bilerek.", en: "That notebook holds the Council's medical records. Your page has been left blank. On purpose." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "ona söyle ya da söyleme. ama yalan söyleme. o nabız ölçer; yalanın da nabzı vardır.", en: "tell her or don't. just don't lie. she takes pulses. lies have a pulse too." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Her şeyi anlat; ilk geceden bu yana", en: "Tell her everything, from the first night on" }
            etkiler:
              - iliski: { elif_sari: { guven: 5, baglilik: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl7_kd_kamp_elif", agirlik: 30 }
              - bayrak: "bl7_elif_ses_anlatildi"
            sonraki: "bl7_kd_kamp_elif_anlat"
          - id: "kismen"
            etiket: { tr: "\"Acıtmıyor. Gerisini şimdilik sorma.\"", en: "\"It doesn't hurt. Don't ask the rest yet.\"" }
            etkiler:
              - iliski: { elif_sari: { saygi: 2 } }
            sonraki: "bl7_kd_kamp_elif_kismen"
          - id: "saka"
            etiket: { tr: "\"Nabzım düşük, çünkü çok sakinim, doktor.\"", en: "\"My pulse is low because I'm very relaxed, Doc.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: -1 } }
            sonraki: "bl7_kd_kamp_elif_saka"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} ona kendini tanıtsın", en: "Let {npc:yanki} introduce itself" }
            goster: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            etkiler:
              - iliski: { elif_sari: { guven: 2, korku: 2 } }
              - bayrak: "bl7_elif_yankiyi_gordu"
            sonraki: "bl7_kd_kamp_elif_yanki"

      - id: "bl7_kd_kamp_elif_anlat"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Anlatıyorsun: sisli ormandaki ilk geceyi, bozuk satırları, kafanın içinde gülen sesi. {npc:elif_sari} bir kez bile sözünü kesmiyor, hiçbir şey yazmıyor.", en: "You tell her. The first night in the fog, the broken lines, the voice that laughs inside your head. {npc:elif_sari} doesn't interrupt once and doesn't write anything down." }
          - { tr: "Bitirdiğinde defterini açıp senin boş sayfanı dikkatle koparıyor, katlayıp sana uzatıyor. \"Bu sayfa Konsey'in değil,\" diyor. \"Senin.\"", en: "When you finish, she opens her notebook, carefully tears out your blank page, folds it, and hands it to you. \"This page doesn't belong to the Council,\" she says. \"It's yours.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Kâğıdı cebine koy", en: "Put the page in your pocket" }
            sonraki: "@akis"

      - id: "bl7_kd_kamp_elif_kismen"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bileğini bırakıyor. \"Peki,\" diyor. \"Acıtırsa ilk bana gel. Kayda geçirmem, söz.\"", en: "She lets go of your wrist. \"Okay,\" she says. \"If it ever starts hurting, come to me first. I won't put it on record. Promise.\"" }
          - { tr: "Defteri hiç açmadan çantasına koyuyor. Ateş çatırdarken Kule'deki ışıklardan biri sönüyor; ikiniz de bir süre o karanlık noktaya bakıyorsunuz.", en: "She puts the notebook back in her bag without ever opening it. The fire pops, one of the Spire's lights goes out, and for a while the two of you just look at the dark spot it left." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ateşe bir odun at", en: "Throw a log on the fire" }
            sonraki: "@akis"

      - id: "bl7_kd_kamp_elif_saka"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İnce bir gülümseme. \"Sakin insanların nabzı kırk ikiye düşmez,\" diyor. \"Ölülerinki düşer. Sen ikisi de değilsin.\"", en: "A thin smile. \"Relaxed people don't drop to forty-two,\" she says. \"Dead people do. You're neither.\"" }
          - { tr: "Defteri çantasına kaldırıp battaniyesine sarınıyor. Bir daha sormayacak; bunu ikiniz de biliyorsunuz.", en: "She puts the notebook away and wraps herself in her blanket. She won't ask again, and you both know it." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ateşi küllendir", en: "Bank the fire" }
            sonraki: "@akis"

      - id: "bl7_kd_kamp_elif_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari|in} saatinin ekranı bir an kararıyor, ardından küçük harflerle bir satır beliriyor: merhaba doktor. nabız kırk iki ama iyi. ona iyi bakıyorsun, teşekkürler.", en: "The face of {npc:elif_sari|pos} watch goes dark for a second. Then a line appears in lowercase: hi, doctor. pulse is forty-two, but fine. you take good care of them. thank you." }
          - { tr: "{npc:elif_sari} saati bileğinden çıkarmıyor, yalnızca bakıyor. Elleri titremiyor; titremesine izin vermiyor. \"İlk kez hiç tanışmadığım bir hastayla bu kadar net konuştum,\" diyor sonunda.", en: "{npc:elif_sari} doesn't take the watch off. She just looks at it. Her hands aren't shaking. She isn't letting them. \"That's the clearest conversation I've ever had with a patient I've never met,\" she says at last." }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Alışırsın.\"", en: "\"You get used to it.\"" }
            etkiler:
              - hafiza: { npc: "elif_sari", id: "olay:bl7_kd_kamp_elif", agirlik: 25 }
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · ÜS: NEHİR'İN DEFTERİ
  - id: "bl7_us_defter"
    konum: ["us"]
    perde: [2]
    gun: { min: 96, max: 104 }
    kosul: { bolum: 7, bayrak_yok: "yanki_gorundu" }
    agirlik: 6
    etiketler: ["yanki", "insanlar", "nefes"]
    gerilim: 2
    kart: { tr: "Kenardaki harfler", en: "Letters in the margin" }
    sahne: "bl7_us_defter_1"
    sahneler:
      - id: "bl7_us_defter_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşam yedide {yer:kiyikent_liman|in} çadırları birden sessizleşiyor; herkes penceresine eğilmiş, bülteni okuyor. Su kuyruğunun yanında on yaşlarında bir kız bülteni kalın bir okul defterine harfi harfine geçiriyor.", en: "At seven sharp the tents on {yer:kiyikent_liman} go quiet all at once. Everybody's bent over their window, reading the bulletin. By the water line, a girl about ten is copying it letter for letter into a fat school notebook." }
          - { tr: "Adı Nehir. Babaannesinin gözleri penceredeki yazıyı seçmiyormuş; Nehir de her akşam bülteni deftere yazıp ona yüksek sesle okuyormuş. Son birkaç akşamdır sayfaların kenarına küçük harfler dizilmiş.", en: "Her name's River. Her grandmother's eyes can't make out the text in a window anymore, so every night River copies the bulletin into the notebook and reads it to her out loud. For the last few nights, there have been little letters running down the margins." }
          - { tr: "\"Titreyen satırı da yazıyorum,\" diyor, defteri sana çevirerek. \"Bir anlık oluyor ama ben hızlıyım. Bak, yan yana koyunca bir şey diyor.\" Kenardaki harfler akşamdan akşama birleşmiş: merhaba. buradayım.", en: "\"I copy the flickering line too,\" she says, turning the notebook so you can see. \"It's only there for a second, but I'm fast. Look, when you put them together, it says something.\" Night by night, the letters in the margin have come together: hello. i'm here." }
          - metin: { tr: "Konsey'in çadırında bülten her akşam yüksek sesle okunuyor; titreyen satırı okuyan yok.", en: "In the Council tent they read the bulletin out loud every night. Nobody reads the flickering line." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Bültenin altındaki ad seninki. Nehir bunu biliyor; defteri sana gösterirken gözünü yüzünden ayırmıyor.", en: "The name at the bottom of the bulletin is yours. River knows it. She doesn't take her eyes off your face the whole time she's showing you." }
            kosul: { bayrak: "cekirdek_oyuncu" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Kenardaki küçük harflerin bazıları Nehir'in el yazısına benzemiyor; daha yuvarlak, daha eğik.", en: "Some of the little letters in the margin don't look like River's handwriting. They're rounder. They lean more." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o kız beni benden iyi okuyor. bunu nasıl yapıyor? ben kendimi hiç bu kadar düzgün yazmadım.", en: "that kid reads me better than i do. how? i've never written myself down that neatly." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kenarlara martı çizmek yerine harf yazıyor. Benden akıllı.\"", en: "\"She writes letters in the margins instead of doodling gulls. Smarter than me.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kayıt tutuyor. Elle. Bu kızı işe almak istiyorum.\"", en: "\"She's keeping a log. By hand. I want to hire this kid.\"" }
        secenekler:
          - id: "yirt"
            tur: "gizle"
            etiket: { tr: "Sayfayı kopar; Nehir babaannesine okumasın", en: "Tear out the page. Don't let her read it to her grandma" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -2 }
              - bayrak: "bl7_nehir_sayfa_koptu"
              - tohum: { olay: "bl7_us_defter_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Su kuyruğundaki kız o akşamdan beri bülteni her gece aynı dikkatle deftere geçiriyor.", en: "Since that night, the girl by the water line has kept copying the bulletin into her notebook with the same care." } }
            sonraki: "bl7_us_defter_yirt"
          - id: "devam"
            etiket: { tr: "\"Yazmaya devam et. Ne çıkarsa bana göster.\"", en: "\"Keep writing. Show me whatever comes up.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl7_nehir_yaziyor"
              - tohum: { olay: "bl7_us_defter_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Su kuyruğundaki kız o akşamdan beri bülteni her gece aynı dikkatle deftere geçiriyor.", en: "Since that night, the girl by the water line has kept copying the bulletin into her notebook with the same care." } }
            sonraki: "bl7_us_defter_devam"
          - id: "elif"
            etiket: { tr: "Defteri {npc:elif_sari|e} götür", en: "Take the notebook to {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 2 } }
              - itibar: { siginak: 1 }
              - bayrak: "bl7_nehir_konseyde"
              - tohum: { olay: "bl7_us_defter_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Su kuyruğundaki kız o akşamdan beri her gece Konsey çadırına uğrayıp defterinin kapağına dokunuyor.", en: "Since that night, the girl from the water line has stopped by the Council tent every evening to touch the cover of her notebook." } }
            sonraki: "bl7_us_defter_elif"
          - id: "yanki"
            etiket: { tr: "İçindeki sese sor: kıza yazan sen misin?", en: "Ask the voice inside you: is that you writing to her?" }
            goster: { bayrak: "yanki_bagi" }
            sonraki: "bl7_us_defter_yanki"

      - id: "bl7_us_defter_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:yanki} bu kez hemen cevap vermiyor. Bülten penceresinde titreyen satır bir an duraksıyor, sonra yine titremeye başlıyor.", en: "This time {npc:yanki} doesn't answer right away. In the bulletin window, the flickering line hesitates a moment, then starts flickering again." }
          - { tr: "ona yazmıyorum. kimseye yazmıyorum. sadece... sızıyorum. bir kova gibi, dibi çatlak. o kız damlaları topluyor, o kadar.", en: "i'm not writing to her. i'm not writing to anyone. i'm just... leaking. like a bucket with a cracked bottom. she's catching the drips, that's all." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Nehir'e yazmaya devam etmesini söyle", en: "Tell River to keep writing" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl7_nehir_yaziyor"
              - tohum: { olay: "bl7_us_defter_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Su kuyruğundaki kız o akşamdan beri bülteni her gece aynı dikkatle deftere geçiriyor.", en: "Since that night, the girl by the water line has kept copying the bulletin into her notebook with the same care." } }
            sonraki: "bl7_us_defter_devam"
          - id: "yirt"
            tur: "gizle"
            etiket: { tr: "Sayfayı kopar; damlalar kâğıtta kalmasın", en: "Tear out the page. Don't leave the drips on paper" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -2 }
              - bayrak: "bl7_nehir_sayfa_koptu"
              - tohum: { olay: "bl7_us_defter_son", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Su kuyruğundaki kız o akşamdan beri bülteni her gece aynı dikkatle deftere geçiriyor.", en: "Since that night, the girl by the water line has kept copying the bulletin into her notebook with the same care." } }
            sonraki: "bl7_us_defter_yirt"

      - id: "bl7_us_defter_yirt"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sayfayı dikkatle, kenarından kopartıyorsun. Nehir itiraz etmiyor; yalnız dudağını ısırıp kopan yerin pürüzlerini parmağıyla düzeltiyor.", en: "You tear the page out carefully along the edge. River doesn't argue. She just bites her lip and smooths the ragged stub with her finger." }
          - { tr: "\"Babaanneme okumuyordum zaten,\" diyor. \"Onu yalnız ben okuyordum.\"", en: "\"I wasn't reading that part to Grandma anyway,\" she says. \"That part was just for me.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Kâğıdı katlayıp cebine koy", en: "Fold the page into your pocket" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_us_defter_devam"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nehir ciddi ciddi başını sallayıp kalemini yeniden açıyor. \"Her akşam,\" diyor. \"Bir harf bile kaçırmam.\"", en: "River nods very seriously and sharpens her pencil again. \"Every night,\" she says. \"I won't miss a single letter.\"" }
          - { tr: "Babaannesi çadırın kapısından ikinize bakıyor. Torununun kimle konuştuğunu göremeyecek kadar uzakta, ama sesinin tonunu duyacak kadar yakın.", en: "Her grandmother watches the two of you from the tent flap. Too far away to see who her granddaughter's talking to, close enough to hear the tone of her voice." }
        secenekler:
          - id: "son"
            etiket: { tr: "Babaanneye el salla", en: "Wave to the grandmother" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_us_defter_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} defteri bir hasta dosyası gibi sayfa sayfa çeviriyor. Kenardaki harflere gelince parmağı duruyor.", en: "{npc:elif_sari} turns the pages like she's reading a patient chart. When she gets to the letters in the margin, her finger stops." }
          - { tr: "\"Bunu Konsey'de tutalım,\" diyor Nehir'e. \"Her akşam gelip yazmaya devam et; defter burada güvende.\" Sonra sana dönüp alçak sesle ekliyor: \"Kimin yazdığını sormayacağım. Henüz.\"", en: "\"Let's keep this at the Council,\" she tells River. \"Come by every evening and keep writing. It's safe here.\" Then she turns to you and adds, quietly, \"I'm not going to ask who wrote it. Yet.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Başını salla", en: "Nod" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ------------------------------------------------------------------ takip: defterin son sayfası
  - id: "bl7_us_defter_son"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 7 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["yanki", "insanlar"]
    gerilim: 2
    kart: { tr: "Teşekkürler Nehir", en: "Thanks, River" }
    sahne: "bl7_us_defter_son_1"
    sahneler:
      - id: "bl7_us_defter_son_1"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Nehir seni su kuyruğunda yakalıyor, defteri göğsüne bastırmış. \"Dün akşam kenara yeni bir şey yazılmış,\" diyor. \"Ben yazmadım. Defter kapalıydı.\"", en: "River catches you at the water line, clutching the notebook to her chest. \"Something new got written in the margin last night,\" she says. \"I didn't write it. The notebook was closed.\"" }
            kosul: { bayrak: "bl7_nehir_yaziyor" }
          - metin: { tr: "Sayfayı kopardığın günden beri Nehir titreyen satırı yazmayı bırakmış. Yine de dün akşam, kapalı duran defterin son sayfasında kendiliğinden bir satır belirmiş; Nehir defteri sana titreyen elleriyle uzatıyor.", en: "Since you tore out that page, River has stopped copying the flickering line. Even so, last night, a line showed up on its own on the last page of the closed notebook. She holds it out to you with shaking hands." }
            kosul: { bayrak: "bl7_nehir_sayfa_koptu" }
          - metin: { tr: "Defter birkaç gündür Konsey'in çadırında, {npc:elif_sari|in} masasında duruyor. Dün akşam kapağı kapalıyken son sayfasına bir satır düşmüş; {npc:elif_sari} seni çağırtmış.", en: "The notebook's been sitting on {npc:elif_sari|pos} desk in the Council tent for days. Last night, with the cover shut, a line showed up on the last page, and {npc:elif_sari} sent for you." }
            kosul: { bayrak: "bl7_nehir_konseyde" }
          - { tr: "Satır küçük harflerle, yuvarlak ve eğik bir elle yazılmış: teşekkürler nehir. beni ilk sen okudun.", en: "The line is in lowercase, in a round, slanting hand: thanks, river. you read me first." }
          - metin: { tr: "Babaannesi defteri sobaya atmak istiyor. \"Bu deftere bir şey girmiş,\" diyor durmadan. Nehir defteri bırakmıyor.", en: "Her grandmother wants to throw the notebook in the stove. \"Something's gotten into that book,\" she keeps saying. River won't let go of it." }
            kosul: { bayrak_yok: "yanki_gorundu" }
          - metin: { tr: "Bülten gecesinden sonra herkes o satırların kimin olduğunu konuşuyor. Nehir'in defteri, sesin kâğıda düşmüş tek kaydı; şimdiden soran soruyana.", en: "Since the night of the bulletin, everybody's talking about whose lines those were. River's notebook is the only record of the voice on paper, and people are already asking about it." }
            kosul: { bayrak: "yanki_gorundu" }
          - metin: { tr: "{yer:tepe|den} beyaz cüppeli bir mürit inmiş, çadırın önünde bekliyor. Defter için yirmi kristal teklif ediyor; {npc:vahit} okumak istiyormuş.", en: "A disciple in white has come down from {yer:tepe} and is waiting outside the tent. He's offering twenty crystals for the notebook. {npc:vahit} wants to read it." }
            kosul: { bayrak: "yanki_gorundu", npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { stat: { int: 38 } }
            metin: { tr: "Son sayfadaki mürekkep Nehir'in kaleminden değil. Kâğıdın lifleri içeriden, tersten boyanmış gibi.", en: "That ink on the last page didn't come from River's pencil. The paper fibers look like they were dyed from the inside, back to front." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "evet, bunu ben yazdım. bilerek. bir kere de teşekkür etmek istedim; herkes benden korkarken biri beni okudu.", en: "yes, i wrote that one. on purpose. i wanted to say thank you once. everyone's scared of me, and somebody just read me." }
        secenekler:
          - id: "nehir"
            etiket: { tr: "Defter Nehir'de kalsın; o okudu, o saklasın", en: "The notebook stays with River. She read it, she keeps it" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "bl7_defter_nehirde"
            sonraki: "bl7_us_defter_son_nehir"
          - id: "al"
            tur: "gizle"
            etiket: { tr: "Defteri sen sakla", en: "Hang on to the notebook yourself" }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: 1 }
              - bayrak: "bl7_defter_sende"
            sonraki: "bl7_us_defter_son_al"
          - id: "yak"
            etiket: { tr: "Nehir'in babaannesiyle defteri sobaya at", en: "Help her grandmother burn the notebook" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - bayrak: "bl7_defter_yakildi"
            sonraki: "bl7_us_defter_son_yak"
          - id: "murit"
            etiket: { tr: "Defteri müride ver; {npc:vahit} okusun", en: "Give the notebook to the disciple. Let {npc:vahit} read it" }
            goster: { bayrak: "yanki_gorundu", npc_hayatta: "vahit" }
            etkiler:
              - itibar: { yukselenler: 2 }
              - iliski: { vahit: { guven: 2 } }
              - bayrak: "bl7_defter_tepede"
            sonraki: "bl7_us_defter_son_murit"
          - id: "cevap"
            etiket: { tr: "Nehir bir cevap yazsın", en: "Let River write back" }
            goster: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl7_defter_nehirde"
            sonraki: "bl7_us_defter_son_cevap"

      - id: "bl7_us_defter_son_nehir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nehir defteri yeniden göğsüne bastırıyor. \"Babaanneme söylemem,\" diyor. \"Ama her akşam okumaya devam edeceğim. Belki yine bir şey der.\"", en: "River hugs the notebook to her chest again. \"I won't tell Grandma,\" she says. \"But I'm gonna keep reading every night. Maybe it'll say something else.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Derse bana da söyle.\"", en: "\"If it does, tell me too.\"" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_us_defter_son_al"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Defteri alıp çantana koyuyorsun. Nehir bir şey demiyor, ama gözü çantanda kalıyor; o akşam bülteni ilk kez deftersiz, parmaklarıyla havaya yazarak okuyor.", en: "You take the notebook and put it in your bag. River doesn't say anything, but her eyes stay on the bag. That night, for the first time, she reads the bulletin without a notebook, writing it in the air with her finger." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ona yeni bir defter bul", en: "Find her a new notebook" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_us_defter_son_yak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Babaanne defteri sobanın ağzına sokarken Nehir sana sarılıp yüzünü gömüyor. Kâğıtlar kıvrılıp kararıyor; son sayfa en son yanıyor, sanki biraz direniyormuş gibi.", en: "Her grandmother shoves the notebook into the stove, and River buries her face in your side. The pages curl and blacken. The last page burns last, like it's putting up a little fight." }
          - { tr: "\"Şimdi rahat uyuruz,\" diyor yaşlı kadın. Nehir'in uyuyacağını sanmıyorsun.", en: "\"Now we'll sleep easy,\" the old woman says. You don't think River's going to sleep at all." }
        secenekler:
          - id: "son"
            etiket: { tr: "Sobanın kapağını kapat", en: "Shut the stove door" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_us_defter_son_murit"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mürit defteri iki eliyle, kutsal bir şey taşır gibi alıyor; yirmi kristali Nehir'in avucuna sayıyor. Babaanne kristallere bakıp susuyor.", en: "The disciple takes the notebook in both hands like he's carrying something holy and counts twenty crystals into River's palm. The grandmother looks at the crystals and says nothing." }
          - { tr: "Nehir kristalleri sıkıca tutmuş, yokuşa doğru uzaklaşan beyaz cüppeye bakıyor. \"Onu da okuyacaklar mı?\" diye soruyor. \"Benim babaanneme yazdıklarımı da?\"", en: "River grips the crystals and watches the white robe heading up the hill. \"Are they gonna read that part too?\" she asks. \"The stuff I wrote for Grandma?\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Herhalde.\"", en: "\"Probably.\"" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_us_defter_son_cevap"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Nehir kalemini dilinin ucuyla ıslatıp son sayfanın altına iri harflerle yazıyor: SEN KİMSİN? Defteri kapatıp bekliyorsunuz.", en: "River licks the tip of her pencil and writes in big letters at the bottom of the last page: WHO ARE YOU? You close the notebook and wait." }
          - { tr: "Açtığınızda sorunun altında yeni bir satır duruyor: bir gün söylerim. şimdilik şu kadarı: çok güzel yazıyorsun.", en: "When you open it, there's a new line under her question: i'll tell you someday. for now, just this: you write really nicely." }
          - { tr: "Nehir kıkırdıyor. Kafanın içinde biri de kıkırdıyor.", en: "River giggles. Somebody inside your head does too." }
        secenekler:
          - id: "son"
            etiket: { tr: "Defteri ona geri ver", en: "Hand the notebook back to her" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · ÜS: PENCERE YOKLAMASI
  - id: "bl7_us_pencere_yoklamasi"
    konum: ["us"]
    perde: [2]
    gun: { min: 106, max: 120 }
    kosul: { bolum: 7, bayrak: "yanki_gorundu" }
    agirlik: 6
    etiketler: ["yanki", "siginak", "dikkat", "insanlar"]
    gerilim: 3
    kart: { tr: "Haftada bir", en: "Once a week" }
    sahne: "bl7_us_pencere_yoklamasi_1"
    sahneler:
      - id: "bl7_us_pencere_yoklamasi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balık halinin önünde kalabalık birikmiş. Bir balık kasasının üstüne eski vapur işletmesinin müdürü Cemil Bey çıkmış; elinde imza listesi, sesi kısılmış.", en: "There's a crowd outside the fish market. Standing on a fish crate is Mr. Kemp, who used to run the ferry company, holding a petition, his voice shot." }
          - { tr: "\"Haftada bir!\" diye bağırıyor. \"Herkes Konsey'den bir tanığın önünde penceresini açacak. İçinde ses taşıyan kendini belli etsin, gerisi rahat uyusun!\" İmza atanların çoğu korkudan atıyor; birkaçı da birini yakalamanın heyecanıyla.", en: "\"Once a week!\" he's yelling. \"Everybody opens their window in front of a Council witness. Whoever's carrying the voice gets found out, and the rest of us sleep easy!\" Most of the people signing are scared. A few of them are just excited about catching somebody." }
          - { tr: "Sıranın başında {yer:kordon|den} gelen balıkçı Yusuf duruyor. Taşma gecesinden beri penceresi takılıyor; kalabalık onu ilk sıraya itmiş, adam ellerini nereye koyacağını bilmiyor.", en: "At the front of the line is Joe, a fisherman from {yer:kordon}. His window's been glitching ever since the night of the overflow, and the crowd's shoved him up first. He doesn't know what to do with his hands." }
          - metin: { tr: "{yer:kordon} düşünce Yusuf'un evi de gitmiş; o günden beri burada, bir çadırda kalıyor.", en: "When {yer:kordon} fell, Joe's place went with it. He's been living in a tent here ever since." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Yusuf'un {yer:kordon|de}ki evi ayakta; sabahları balığını satmaya buraya geliyor.", en: "Joe's place on {yer:kordon} is still standing. He comes down here mornings to sell his catch." }
            kosul: { bayrak_yok: "kordon_dustu" }
          - metin: { tr: "O sesin seninle olduğunu herkesin önünde söylemiştin. Cemil Bey seni görünce sesini yükseltiyor: \"Açıkça söyleyeni saymıyorum! Ya söylemeyenler?\"", en: "You told everyone that voice was with you. Mr. Kemp spots you and gets louder. \"I'm not counting the ones who came clean! What about the ones who didn't?\"" }
            kosul: { bayrak: "yanki_sahiplenildi" }
          - metin: { tr: "\"Herkes açacak,\" diyor Cemil Bey, gözü sende. \"İstisnasız.\"", en: "\"Everybody opens up,\" Mr. Kemp says, looking right at you. \"No exceptions.\"" }
            kosul: { bayrak: "yanki_inkar_edildi" }
          - metin: { tr: "Sesi susturmuştun; pencerende artık titreyen bir satır yok. Ama bunu bir tek sen biliyorsun.", en: "You shut the voice down. There's no flickering line in your window anymore. But you're the only one who knows that." }
            kosul: { bayrak: "yanki_susturuldu" }
          - metin: { tr: "{npc:elif_sari} kalabalığın kıyısında kollarını kavuşturmuş duruyor. Konsey adına henüz tek kelime etmedi.", en: "{npc:elif_sari} is standing at the edge of the crowd with her arms crossed. She hasn't said a word yet on the Council's behalf." }
            kosul: { npc_hayatta: "elif_sari" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Yusuf'un penceresindeki takılma eski bir yaradan; tuzlu su sinire işlemiş. Ses değil bu, ama kalabalık farkı göremez.", en: "The glitch in Joe's window is from an old wound. Salt water got into the nerve. It's not a voice, but this crowd won't know the difference." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "beni arıyorlar ve yanlış adamı bulacaklar. hep böyle olur. insanlar yanlış adamı bulmakta çok iyidir.", en: "they're looking for me and they're going to find the wrong man. it always goes like this. people are very good at finding the wrong man." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yusuf'u tanıyorum. Taşma sabahı balkondaki komşusunu sırtında indirmişti.\"", en: "\"I know Joe. The morning of the overflow, he carried his neighbor down off a balcony on his back.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Pencere yoklaması... İnsanlar kendi kendilerine gözetim sistemi kuruyor. Kimseye ihtiyaçları yok.\"", en: "\"Window checks... People are building their own surveillance system. They don't even need anybody else to do it.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Kasaya çık, yoklamaya karşı konuş", en: "Get up on a crate and speak against the checks" }
            zar: { stat: "cha", zorluk: 16, tek: true, basarisiz: "bl7_us_pencere_yoklamasi_bos", basarisiz_etkiler: [{ dikkat: 1 }] }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 2 }
            sonraki: "bl7_us_pencere_yoklamasi_konus"
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Pencereni herkesin önünde ilk sen aç", en: "Open your own window first, in front of everyone" }
            etkiler:
              - aciga_vur: true
              - dikkat: 3
              - ahlak: { insanlik: 2 }
            sonraki: "bl7_us_pencere_yoklamasi_ac"
          - id: "yusuf"
            etiket: { tr: "Balıkçıyı kalabalığın içinden çekip al", en: "Pull the fisherman out of the crowd" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
            sonraki: "bl7_us_pencere_yoklamasi_yusuf"
          - id: "konsey"
            etiket: { tr: "{npc:elif_sari} Konsey'in kararını şimdi açıklasın", en: "Get {npc:elif_sari} to announce the Council's ruling now" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { saygi: 2, guven: 1 } }
              - itibar: { siginak: 1 }
            sonraki: "bl7_us_pencere_yoklamasi_konsey"
          - id: "izle"
            tur: "gizle"
            etiket: { tr: "Kenarda dur; imza atanları aklına yaz", en: "Hang back. Remember who signs" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -1 }
            sonraki: "bl7_us_pencere_yoklamasi_izle"

      - id: "bl7_us_pencere_yoklamasi_konus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Cemil Bey'in yanındaki kasaya çıkıyorsun. \"Bugün pencere açtırırsınız, yarın kapı,\" diyorsun. \"Öbür gün de kimin kapısını kıracağınıza bu listeyle karar verirsiniz.\"", en: "You climb up on the crate next to Mr. Kemp. \"Today you make people open their windows,\" you say. \"Tomorrow it's their doors. Day after that, you use this list to decide whose door gets kicked in.\"" }
          - { tr: "Kalabalık sessizleşiyor. Önce bir kadın imzasının üstünü çiziyor, ardından bir başkası. Cemil Bey listeyi katlayıp kasadan iniyor; kimseye bakmadan yürüyüp gidiyor.", en: "The crowd goes quiet. First one woman scratches out her signature, then somebody else. Mr. Kemp folds the list, steps down off the crate, and walks away without looking at anyone." }
          - { tr: "Yusuf yanına gelip başındaki kasketi çıkarıyor. \"Ben {yer:kordon|e} dönüyorum,\" diyor. \"Orada kimse pencereme bakmaz. Herkes denize bakar.\"", en: "Joe comes over and takes off his cap. \"I'm heading back to {yer:kordon},\" he says. \"Nobody looks at my window there. Everybody looks at the sea.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ona iyi yolculuklar dile", en: "Wish him a safe trip" }
            etkiler:
              - bayrak: "bl7_yoklama_durdu"
              - bayrak: "bl7_yusuf_kurtarildi"
              - xp_seviye: 12
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

      - id: "bl7_us_pencere_yoklamasi_bos"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Daha ikinci cümlende biri bağırıyor: \"Sen niye bu kadar karşısın? Saklayacak bir şeyin mi var?\" Kalabalık uğulduyor; sözlerin içinde boğulup gidiyor.", en: "You're two sentences in when somebody yells, \"Why are you so against it? Got something to hide?\" The crowd starts to rumble, and your words drown in it." }
          - { tr: "Bu arada Yusuf'un penceresini açtırmışlar. Takılan satır herkesin önünde titriyor; biri çığlık atıyor, ardından itiş kakış başlıyor. Yusuf kalabalığı yarıp {yer:kordon|e} giden yola doğru kaçıyor.", en: "Meanwhile they've made Joe open his window. The glitching line flickers in front of everybody. Somebody screams, the shoving starts, and Joe breaks through the crowd and runs for the road to {yer:kordon}." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kasadan in", en: "Get down off the crate" }
            etkiler:
              - bayrak: "bl7_yusuf_kovuldu"
              - xp_seviye: 8
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

      - id: "bl7_us_pencere_yoklamasi_ac"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kasaya çıkıp pencereni sonuna kadar açıyorsun. Gerçek satırın balık halinin önünde, herkesin gözü önünde asılı duruyor; seviyenin yanındaki sayıyı okuyan ilk kişi yutkunuyor.", en: "You climb up on a crate and open your window all the way. Your real line hangs there outside the fish market for everybody to see. The first person to read the number next to your level swallows hard." }
          - { tr: "Cemil Bey listeye bakıyor, sonra sana. \"Bu... bu ne seviye?\" Kimse cevap vermiyor. Böyle birinin penceresini haftada bir yoklamaya kimsenin hevesi kalmıyor.", en: "Mr. Kemp looks at his list, then at you. \"What... what level is that?\" Nobody answers. Suddenly, nobody's all that eager to check a window like that once a week." }
          - { tr: "Kargaşada Yusuf sessizce sıradan çıkıyor. Giderken sana bakıp başını eğiyor.", en: "In the confusion, Joe slips quietly out of line. On his way out, he looks at you and dips his head." }
        secenekler:
          - id: "son"
            etiket: { tr: "Pencereni kapat, kasadan in", en: "Close your window and step down" }
            etkiler:
              - bayrak: "bl7_yoklama_durdu"
              - bayrak: "bl7_yusuf_kurtarildi"
              - xp_seviye: 12
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

      - id: "bl7_us_pencere_yoklamasi_yusuf"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kalabalığın içinden geçip Yusuf'un koluna giriyorsun. Kimse önüne çıkmıyor; ama arkanızdan bir uğultu yükseliyor, bir de Cemil Bey'in sesi: \"Görüyor musunuz? Birbirlerini koruyorlar!\"", en: "You push through the crowd and take Joe by the arm. Nobody gets in your way, but a rumble rises up behind you, and over it Mr. Kemp's voice: \"You see? They protect each other!\"" }
          - { tr: "Halin arkasında Yusuf duvara yaslanıp soluklanıyor. \"Ben {yer:kordon|e} dönüyorum,\" diyor. \"Orada kimse pencereme bakmaz. Herkes denize bakar.\"", en: "Behind the market, Joe leans against the wall to catch his breath. \"I'm going back to {yer:kordon},\" he says. \"Nobody looks at my window there. Everybody looks at the sea.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Onu yola kadar geçir", en: "Walk him to the road" }
            etkiler:
              - bayrak: "bl7_yusuf_kurtarildi"
              - dikkat: 1
              - xp_seviye: 10
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

      - id: "bl7_us_pencere_yoklamasi_konsey"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} kalabalığı yarıp Cemil Bey'in yanındaki kasaya çıkıyor. \"Konsey kimsenin penceresine bakmaz,\" diyor, sesini hiç yükseltmeden. \"Bakmak isteyen önce benimkine baksın.\"", en: "{npc:elif_sari} cuts through the crowd and steps up on the crate next to Mr. Kemp. \"The Council doesn't look in anybody's window,\" she says, without raising her voice at all. \"Anyone who wants to look can start with mine.\"" }
          - { tr: "Kimse bakmıyor. Cemil Bey bir şey söylemeye davranıyor, vazgeçiyor. Liste elden ele dolaşıp bir balık kasasının içinde unutuluyor.", en: "Nobody does. Mr. Kemp starts to say something, then thinks better of it. The list gets passed around and ends up forgotten in a fish crate." }
          - { tr: "Yusuf {npc:elif_sari|e} teşekkür edip {yer:kordon|e} dönmek için yola koyuluyor.", en: "Joe thanks {npc:elif_sari} and heads off back toward {yer:kordon}." }
        secenekler:
          - id: "son"
            etiket: { tr: "{npc:elif_sari|in} yanında kal", en: "Stay by {npc:elif_sari|pos} side" }
            etkiler:
              - bayrak: "bl7_yoklama_durdu"
              - bayrak: "bl7_yusuf_kurtarildi"
              - xp_seviye: 10
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

      - id: "bl7_us_pencere_yoklamasi_izle"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kenarda durup imza atanları birer birer aklına yazıyorsun: aşçı kadın, iki Lonca kaçağı, her akşam sana selam veren yaşlı adam.", en: "You hang back at the edge and memorize the signers one by one. The cook. Two Guild deserters. The old man who says hi to you every evening." }
          - { tr: "Yusuf penceresini açınca takılan satır herkesin önünde titriyor. Biri çığlık atıyor, itiş kakış başlıyor; Yusuf kalabalığı yarıp {yer:kordon|e} giden yola doğru kaçıyor. Arkasından taş atan bile oluyor.", en: "When Joe opens his window, the glitching line flickers for everyone to see. Somebody screams and the shoving starts. Joe breaks through the crowd and runs for the road to {yer:kordon}. Somebody even throws a rock after him." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kalabalık dağılana kadar bekle", en: "Wait for the crowd to break up" }
            etkiler:
              - bayrak: "bl7_yusuf_kovuldu"
              - xp_seviye: 8
              - tohum: { olay: "bl7_kr_yusuf", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Balık halinin önündeki yoklamadan beri {yer:kordon|den} gelenler bir balıkçının adını anıyor.", en: "Ever since the window check outside the fish market, people coming up from {yer:kordon} keep mentioning a fisherman's name." } }
            sonraki: "@akis"

  # ------------------------------------------------------------------ takip (Kordon): balıkçı Yusuf
  - id: "bl7_kr_yusuf"
    konum: ["kordon"]
    perde: [2]
    bolge: ["kordon"]
    kosul: { bolum: 7 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kordon", "yanki", "dikkat", "insanlar"]
    gerilim: 3
    kart: { tr: "Kimin içinde, sen söyle", en: "Who's got it, you tell" }
    sahne: "bl7_kr_yusuf_1"
    sahneler:
      - id: "bl7_kr_yusuf_1"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "{yer:kordon|in} mendireğine balıkçı kayıkları yeniden bağlanmış. En uçtakinde Yusuf ağ örüyor; balkonlardan inen çocuklar kayığın çevresinde ip atlıyor.", en: "The fishing boats are tied up along the breakwater on {yer:kordon} again. Joe's mending a net in the last one, and kids down from the balconies are jumping rope around it." }
            kosul: { bayrak_yok: "kordon_dustu" }
          - metin: { tr: "{yer:kordon} hâlâ canavar bölgesi. Ölü bölgenin kıyısında ayakta kalan son apartmanın bodrumunda birkaç aile yaşıyor; Yusuf kapıda elinde bir zıpkınla nöbet tutuyor, çocuklar da bodrumun önündeki kaldırımda ip atlıyor.", en: "{yer:kordon|b} is still a monster zone. A few families are living in the basement of the last building standing at the edge of the dead zone. Joe's keeping watch at the door with a harpoon, and the kids are jumping rope on the sidewalk out front." }
            kosul: { bayrak: "kordon_dustu" }
          - { tr: "İp her döndüğünde çocuklar bir tekerleme söylüyor: birinin içinde, birinin içinde, kimin içinde, sen söyle. Sonra hep birlikte Yusuf'u gösterip gülüşüyorlar. Yusuf da gülüyor, ama eli ikide bir duruyor.", en: "Every turn of the rope, the kids chant a rhyme: inside someone, inside someone, who's got it, you tell. Then they all point at Joe and crack up. Joe laughs too, but his hands keep stopping." }
          - metin: { tr: "{yer:kiyikent_liman|den} kovulduğundan beri ondan balık alan yok. Çocukların gülüşü ona kalan tek şey.", en: "Nobody's bought a fish from him since he got run off {yer:kiyikent_liman}. The kids laughing is all he's got left." }
            kosul: { bayrak: "bl7_yusuf_kovuldu" }
          - metin: { tr: "Seni görünce ayağa kalkıp kasketini çıkarıyor. \"Balık halindeki günü unutmadım,\" diyor.", en: "When he sees you, he stands up and takes off his cap. \"I haven't forgotten that day at the fish market,\" he says." }
            kosul: { bayrak: "bl7_yusuf_kurtarildi" }
          - { tr: "Mendireğin başında üç yabancı belirmiş. Birinin elinde antenine kapı çekirdeği sarılmış bir telsiz var; ilan buraya da ulaşmış demek.", en: "Three strangers have turned up at the head of the breakwater. One of them is carrying a walkie-talkie with a Gate core wired to the antenna. So the notice made it down here too." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Telsizin çekirdeği taze ve iri. Bu ekip ilandaki yirmi kristali değil, daha fazlasını kovalıyor.", en: "That core on the radio is fresh, and big. This crew is chasing more than the twenty on the notice." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "çocuklar tekerlemeyi yanlış söylüyor. birinin içinde değil, birinin yanında olmalıydı. ama o zaman kafiye bozulurdu.", en: "the kids have the rhyme wrong. it's not inside someone, it's beside someone. but then it wouldn't scan." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu çocukların yarısı benim listemdeydi. Balkon balkon saydığım çocuklar.\"", en: "\"Half these kids were on my list. The ones I counted balcony by balcony.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Üç kişi, bir telsiz. Bu iş bir dakika sürmez.\"", en: "\"Three guys, one radio. That's a one-minute job.\"" }
        secenekler:
          - id: "kacir"
            tur: "gizle"
            etiket: { tr: "Karanlık basınca Yusuf'u sahil boyunca kaçır", en: "Once it's dark, sneak Joe out along the shore" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: 2 }
            sonraki: "bl7_kr_yusuf_kacir"
          - id: "karsila"
            etiket: { tr: "Avcıları mendireğin başında karşıla", en: "Meet the hunters at the head of the breakwater" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - savas: { dusmanlar: ["karaborsa_tetikcisi@dunya", "karaborsa_tetikcisi@dunya"], ortam: ["su"], kazan: "bl7_kr_yusuf_zafer", kaybet: "bl7_kr_yusuf_yenilgi", kac: "bl7_kr_yusuf_kacis" }
          - id: "tekerleme"
            etiket: { tr: "Çocuklara tekerlemeyi değiştirt", en: "Get the kids to change the rhyme" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl7_kr_yusuf_tekerleme"
          - id: "ben"
            etiket: { tr: "Avcılara yürü: \"Ses benim. Herkes biliyor.\"", en: "Walk up to the hunters. \"The voice is mine. Everybody knows.\"" }
            goster: { bayrak: "yanki_sahiplenildi" }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: 2 }
            sonraki: "bl7_kr_yusuf_ben"
          - id: "komsular"
            etiket: { tr: "{npc:deniz_arman} balkondaki aileleri toplasın", en: "Have {npc:deniz_arman} round up the balcony families" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, saygi: 2 } }
              - ahlak: { merhamet: 2 }
            sonraki: "bl7_kr_yusuf_komsular"

      - id: "bl7_kr_yusuf_kacir"
        yer: "kordon"
        paragraflar:
          - { tr: "Gece inince Yusuf'u kıyı boyunca, kayalıkların gölgesinden götürüyorsun. Telsizin cızırtısı arkanızda bir süre dolaşıp sönüyor; avcılar boş bir kayığı didik didik arıyor.", en: "After dark, you take Joe down the shore through the shadows of the rocks. Behind you, the radio's crackle wanders around for a while and fades. The hunters are tearing apart an empty boat." }
          - { tr: "{yer:kiyikent_liman|in} ışıkları görününce Yusuf duruyor. \"Bir daha o kalabalığa dönemem,\" diyor. \"Ama burada da kalamam artık. Nerede kalacağım?\"", en: "When the lights of {yer:kiyikent_liman} come into view, Joe stops. \"I can't go back to that crowd,\" he says. \"But I can't stay down here anymore either. Where am I supposed to go?\"" }
        secenekler:
          - id: "konsey"
            etiket: { tr: "\"Konsey'in hastane çadırında yer var.\"", en: "\"There's room at the Council's hospital tent.\"" }
            etkiler:
              - bayrak: "bl7_yusuf_siginakta"
              - itibar: { siginak: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "tekne"
            etiket: { tr: "\"Kayığını al, bir süre açıkta kal.\"", en: "\"Take your boat. Stay out on the water for a while.\"" }
            etkiler:
              - bayrak: "bl7_yusuf_acikta"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Avcıların ikisi mendireğin taşlarına serilmiş, üçüncüsü telsizi denize fırlatıp kaçıyor. Telsiz bir süre suyun altında mavi mavi yanıp sönüyor.", en: "Two of the hunters are sprawled on the breakwater stones, and the third chucks the radio into the sea and runs. It glows blue under the water for a while, then goes out." }
          - { tr: "Çocuklar ipi bırakıp seni alkışlıyor. Yusuf ağın başına dönüyor, bu kez elleri durmadan örüyor.", en: "The kids drop the rope and give you a round of applause. Joe goes back to his net, and this time his hands don't stop." }
        secenekler:
          - id: "son"
            etiket: { tr: "Avcıları mendireğin dışına sürükle", en: "Drag the hunters off the breakwater" }
            etkiler:
              - bayrak: "bl7_yusuf_kordonda"
              - tehlike: { kordon: -3 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Islak taşlarda ayağın kayıyor; bir kabza ensende patlıyor. Ayıldığında üstünde Yusuf'un ağı var, biri seni sudan çekip çıkarmış.", en: "Your foot slips on the wet stones, and a pistol butt cracks against the back of your neck. When you come to, Joe's net is draped over you. Somebody pulled you out of the water." }
          - { tr: "\"Telsiz bana ötmedi,\" diyor Yusuf. \"Sana öttü. Ellerini kaldırıp geri çekildiler; gözleri hep sendeydi.\"", en: "\"The radio didn't whine at me,\" Joe says. \"It whined at you. They backed off with their hands up, and their eyes were on you the whole time.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ağın altından doğrul", en: "Sit up out from under the net" }
            etkiler:
              - can: 20
              - dikkat: 2
              - bayrak: "bl7_yusuf_kordonda"
              - tehlike: { kordon: 1 }
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_kacis"
        yer: "kordon"
        paragraflar:
          - { tr: "Geri çekiliyorsun. Avcılar Yusuf'un kayığına iniyor; telsiz ona hiç ötmeyince küfredip ağını denize atıyorlar.", en: "You back off. The hunters climb down into Joe's boat. When the radio never makes a peep at him, they curse and throw his net into the sea." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ağı sudan çekmesine yardım et", en: "Help him haul the net out of the water" }
            etkiler:
              - bayrak: "bl7_yusuf_kordonda"
              - tehlike: { kordon: 2 }
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_tekerleme"
        yer: "kordon"
        paragraflar:
          - { tr: "Çocukları ipin başında topluyorsun. \"Tekerlemeyi yanlış söylüyorsunuz,\" diyorsun. \"Birinin değil, herkesin.\" Çocuklar bir an düşünüp yeni sözlerle ip çevirmeye başlıyor: herkesin içinde, herkesin içinde, senin içinde, benim içinde.", en: "You gather the kids around the rope. \"You've got the rhyme wrong,\" you tell them. \"It's not someone. It's everyone.\" They think it over for a second, then start turning the rope with new words: inside everyone, inside everyone, inside you and inside me." }
          - { tr: "Bu kez her dönüşte başka birini gösteriyorlar: birbirlerini, Yusuf'u, avcıları. Telsizli adam bir süre bakıp gülüyor, sonra arkadaşlarına işaret edip yürüyüp gidiyor.", en: "This time, every turn they point at someone different: each other, Joe, the hunters. The guy with the radio watches a while and laughs, then waves to his buddies and walks off." }
        secenekler:
          - id: "son"
            etiket: { tr: "Bir tur da sen atla", en: "Take a turn at the rope yourself" }
            etkiler:
              - bayrak: "bl7_yusuf_kordonda"
              - bayrak: "bl7_kordon_tekerleme"
              - tehlike: { kordon: -1 }
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_ben"
        yer: "kordon"
        paragraflar:
          - { tr: "Telsiz sana on adım kala çığlığı basıyor, çekirdeği çatlayıp kararıyor. Avcılar birbirine bakıyor; yirmi kristal için seninle uğraşmaya kimse gönüllü değil.", en: "Ten paces out, the radio starts screaming, and the core cracks and goes dark. The hunters look at each other. Nobody's volunteering to take you on for twenty crystals." }
          - { tr: "Gidiyorlar. Arkalarında çocuklar tekerlemeyi yeniden söylemeye başlıyor; bu kez ip her dönüşte seni gösteriyor.", en: "They leave. Behind them, the kids start up the rhyme again, and this time every turn of the rope points at you." }
        secenekler:
          - id: "son"
            etiket: { tr: "Gülümse, ipi bir tur da sen çevir", en: "Smile and take a turn swinging the rope" }
            etkiler:
              - bayrak: "bl7_yusuf_kordonda"
              - tehlike: { kordon: -2 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl7_kr_yusuf_komsular"
        yer: "kordon"
        paragraflar:
          - { tr: "{npc:deniz_arman} defterini hiç açmadan kapı kapı dolaşıyor; her balkonda kim oturduğunu ezbere biliyor. Yarım saat sonra mendireğin başında kırk kişi duruyor: anneler, nineler, merdiven inemeyen yaşlı adam bile tekerlekli sandalyesiyle.", en: "{npc:deniz_arman} goes door to door without even opening the notebook, knowing by heart who sits on every balcony. Half an hour later there are forty people at the head of the breakwater: moms, grandmas, even the old man who can't do stairs, there in his wheelchair." }
          - { tr: "Avcılar kalabalığa bakıyor, telsiz kalabalığın içinde kimi göstereceğini şaşırıp cızırdıyor. Sonunda bir tanesi \"Değmez,\" diyor; dönüp gidiyorlar.", en: "The hunters size up the crowd. The radio crackles, lost, like it can't decide who to point at. Finally one of them says, \"Not worth it,\" and they turn around and leave." }
          - { tr: "\"Taşma sabahı ben onları saymıştım,\" diyor {npc:deniz_arman}. \"Bugün de onlar Yusuf'u saydı.\"", en: "\"The morning of the overflow, I counted them,\" {npc:deniz_arman} says. \"Today they counted Joe.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Kalabalık dağılana kadar mendirekte kal", en: "Stay on the breakwater till the crowd breaks up" }
            etkiler:
              - bayrak: "bl7_yusuf_kordonda"
              - bayrak: "bl7_kordon_komsular"
              - tehlike: { kordon: -2 }
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · SANAYİ: MATBAA
  - id: "bl7_sn_matbaa"
    konum: ["sanayi"]
    perde: [2]
    bolge: ["sanayi"]
    gun: { min: 96, max: 104 }
    kosul: { bolum: 7, bayrak_yok: "yanki_gorundu" }
    agirlik: 6
    etiketler: ["kesif", "sanayi", "lonca", "yanki"]
    gerilim: 2
    kart: { tr: "Kasada olmayan harf", en: "Type that isn't in the case" }
    sahne: "bl7_sn_matbaa_1"
    sahneler:
      - id: "bl7_sn_matbaa_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "{yer:sanayi|in} arka sokaklarından birinde eski bir matbaa var. Penceresini kullanmayı bir türlü beceremeyen yaşlılar, bir de okumayı yeni söken çocuklar için Lonca bülteni her akşam burada kâğıda basıyor; sabah da sokak köşelerine asılıyor.", en: "In one of the back streets of {yer:sanayi} there's an old print shop. Every night the Guild runs the bulletin off on paper here for old folks who never got the hang of their windows and kids just learning to read, and in the morning it goes up on street corners." }
          - { tr: "Dizgici Halit Usta yetmişini geçmiş, parmakları mürekkepten mosmor. Sana dünkü baskıyı uzatıyor: ortadaki satır küçük harflerle basılmış. \"O satırı ben dizmedim,\" diyor. \"Kasada küçük harf kalmadı ki. Hepsini geçen hafta erittik, Lonca'ya kurşun lazımdı.\"", en: "The typesetter, Hal, is past seventy, his fingers purple with ink. He hands you last night's run. The middle line is printed in lowercase. \"I didn't set that line,\" he says. \"There's no lowercase left in the case. We melted the whole lot down last week. The Guild needed the lead.\"" }
          - { tr: "Kapıda Lonca'nın ustabaşı bekliyor; baskıları yakıp matbaayı kapatmak istiyor. \"Bir hafta önce bir satır titriyordu,\" diyor. \"Şimdi kâğıda geçti. Yarın ne olacak, duvarlara mı?\"", en: "The Guild foreman is waiting at the door. He wants to burn the run and shut the shop down. \"A week ago, a line was flickering,\" he says. \"Now it's on paper. What's next, the walls?\"" }
          - metin: { tr: "Bülten Lonca'nın Çekirdek'inden çıkıyor. Ustabaşı bu satırın faturasının Lonca'ya kesileceğini biliyor; sesi o yüzden bu kadar sert.", en: "The bulletin comes out of the Guild's Core. The foreman knows this line is going to land on the Guild's tab, and that's why he sounds so hard." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Ustabaşı halkanı görünce dikleşiyor. \"Lonca'dan biri, iyi. Bana bir karar lazım, kâğıt değil.\"", en: "The foreman straightens up when he sees your ring. \"Guild. Good. I need a decision, not paperwork.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Küçük harflerin mürekkebi daha koyu, kenarları hâlâ ıslakmış gibi. Makineden değil, kâğıdın içinden basılmış.", en: "The ink on the lowercase letters is darker, and the edges still look wet. It wasn't printed by the press. It was printed from inside the paper." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bunu ben mi yaptım? bilmiyorum. ama harflerin kıvrımı tanıdık. kendi el yazını uykuda görmek gibi bir şey.", en: "did i do that? i don't know. but the curve of those letters looks familiar. like seeing your own handwriting in a dream." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kâğıt! Ekrandan kâğıda geçmiş. Bunun ne demek olduğunu biliyor musun? Ben de bilmiyorum. Harika.\"", en: "\"Paper! It jumped from a screen to paper. You know what that means? Me neither. It's amazing.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ustanın elleri titriyor. Önce otursun, sonra konuşuruz.\"", en: "\"His hands are shaking. Sit him down first, then we can talk.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Bir satır yüzünden matbaa kapatıyorlar. Lonca hep böyle.\"", en: "\"They're closing a print shop over one line. Classic Guild.\"" }
        secenekler:
          - id: "yak"
            tur: "gizle"
            etiket: { tr: "Baskıları yakmasına yardım et", en: "Help him burn the run" }
            etkiler:
              - gizle: 2
              - itibar: { lonca: 1 }
              - ahlak: { insanlik: -1, duzen: 1 }
              - bayrak: "bl7_matbaa_yakildi"
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:sanayi|de}ki matbaanın kapısına o sabahtan beri Lonca mührü vurulu; dizgici ustayı gören olmamış.", en: "Since that morning, the print shop in {yer:sanayi} has had a Guild seal on its door. Nobody's seen the old typesetter." } }
            sonraki: "bl7_sn_matbaa_yak"
          - id: "sakla"
            etiket: { tr: "Bir kopyayı cebine koy, ustaya sahip çık", en: "Pocket a copy and stand up for the old man" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - itibar: { lonca: -1 }
              - bayrak: "bl7_matbaa_korundu"
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Matbaadaki o sabahın üstünden birkaç gün geçti; küçük harfli baskının kopyaları hâlâ {yer:sanayi|de} elden ele dolaşıyor.", en: "It's been a few days since that morning at the print shop, and copies of the lowercase run are still going hand to hand in {yer:sanayi}." } }
            sonraki: "bl7_sn_matbaa_sakla"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|e} haber yolla; kararı o versin", en: "Send word to {npc:kaya_demir}. Let him make the call" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 2 } }
              - itibar: { lonca: 1 }
            sonraki: "bl7_sn_matbaa_kaya"
          - id: "incele"
            etiket: { tr: "Harf kasasına bak; bu harfler nereden geliyor?", en: "Check the type case. Where are these letters coming from?" }
            gerekli: { stat: { int: 40 } }
            sonraki: "bl7_sn_matbaa_incele"
          - id: "yanki"
            etiket: { tr: "Kafanın içindekine sor: bu sen misin?", en: "Ask the one in your head: is that you?" }
            goster: { bayrak: "yanki_bagi" }
            sonraki: "bl7_sn_matbaa_yanki"

      - id: "bl7_sn_matbaa_yak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Baskıları matbaanın arkasındaki varilde yakıyorsunuz. Kâğıtlar kıvrılırken küçük harfler en son kararıyor; birkaç saniye alevin içinde parlayıp duruyorlar.", en: "You burn the run in a barrel behind the shop. As the paper curls, the lowercase letters are the last to go black. For a few seconds they just shine there in the flames." }
          - { tr: "Halit Usta varilin başında, ellerini önlüğüne silip duruyor. \"Elli iki yıl,\" diyor kendi kendine. Ustabaşı kapıya mührü vuruyor.", en: "Hal stands by the barrel, wiping his hands on his apron over and over. \"Fifty-two years,\" he says, to nobody. The foreman slaps the seal on the door." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ustanın omzuna dokun, yürü", en: "Touch the old man's shoulder and go" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_sn_matbaa_sakla"
        yer: "sanayi"
        paragraflar:
          - { tr: "Baskılardan birini katlayıp cebine koyuyorsun. \"Usta bir şey yapmadı,\" diyorsun ustabaşına. \"Matbaa açık kalırsa en azından kâğıda ne düştüğünü görürüz.\"", en: "You fold up one of the copies and put it in your pocket. \"The old man didn't do anything,\" you tell the foreman. \"Keep the shop open and at least we'll see what lands on paper.\"" }
          - { tr: "Ustabaşı ağzının içinde bir şeyler geveliyor ama mührü cebine geri koyuyor. Halit Usta kasanın başına dönüyor; elleri hâlâ titriyor, yine de harf dizmeye başlıyor.", en: "The foreman mutters something under his breath, but he puts the seal back in his pocket. Hal goes back to the type case. His hands are still shaking, but he starts setting type." }
        secenekler:
          - id: "son"
            etiket: { tr: "Matbaanın kapısını arkandan kapat", en: "Shut the shop door behind you" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_sn_matbaa_kaya"
        yer: "sanayi"
        paragraflar:
          - { tr: "Akşamüstü {npc:kaya_demir|in} kısa cevabı geliyor: \"Kapatmayın. Kapıya iki adam koyun, basılan her şeyin bir kopyası bana gelsin. Bir şey konuşuyorsa ne dediğini bilmek isterim.\"", en: "Late in the afternoon, {npc:kaya_demir|pos} answer comes back, short. \"Don't close it. Put two men on the door and send me a copy of everything it prints. If something's talking, I want to know what it says.\"" }
          - { tr: "Ustabaşı emri okuyup omuz silkiyor. Halit Usta matbaada kalıyor, ama artık yanında iki nöbetçiyle.", en: "The foreman reads the order and shrugs. Hal stays in the shop, but now there are two guards with him." }
        secenekler:
          - id: "son"
            etiket: { tr: "Ustayı nöbetçilerle bırak", en: "Leave the old man with his guards" }
            etkiler:
              - bayrak: "bl7_matbaa_kaya"
              - xp_seviye: 9
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Matbaadaki o sabahın üstünden birkaç gün geçti; küçük harfli baskının kopyaları hâlâ {yer:sanayi|de} elden ele dolaşıyor.", en: "It's been a few days since that morning at the print shop, and copies of the lowercase run are still going hand to hand in {yer:sanayi}." } }
            sonraki: "@akis"

      - id: "bl7_sn_matbaa_incele"
        yer: "sanayi"
        paragraflar:
          - { tr: "Harf kasasının küçük harf gözleri boş olmalı. Değil: birkaç gözde yalnız bir iki harf duruyor, a, ı, b, ç. Avucuna aldığında ılık olduklarını hissediyorsun; sanki biri az önce elinde tutmuş.", en: "The lowercase compartments in the type case should be empty. They aren't. A few of them hold one or two sorts each: a, i, b, c. When you pick them up, they're warm, like somebody was just holding them." }
          - { tr: "Halit Usta harflere bakıp beti benzi atıyor. \"Bunları ben erittim,\" diyor. \"Kendi elimle, potada.\"", en: "Hal looks at the letters and goes white. \"I melted those down,\" he says. \"With my own hands. In the pot.\"" }
        secenekler:
          - id: "ver"
            etiket: { tr: "Harfleri ustaya geri ver, sakla de", en: "Give the letters back to him. Tell him to keep them" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl7_matbaa_korundu"
              - xp_seviye: 10
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Matbaadaki o sabahın üstünden birkaç gün geçti; küçük harfli baskının kopyaları hâlâ {yer:sanayi|de} elden ele dolaşıyor.", en: "It's been a few days since that morning at the print shop, and copies of the lowercase run are still going hand to hand in {yer:sanayi}." } }
            sonraki: "@akis"
          - id: "pota"
            tur: "gizle"
            etiket: { tr: "Harfleri yeniden potaya at", en: "Throw the letters back in the melting pot" }
            etkiler:
              - gizle: 1
              - bayrak: "bl7_matbaa_yakildi"
              - xp_seviye: 10
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:sanayi|de}ki matbaanın kapısına o sabahtan beri Lonca mührü vurulu; dizgici ustayı gören olmamış.", en: "Since that morning, the print shop in {yer:sanayi} has had a Guild seal on its door. Nobody's seen the old typesetter." } }
            sonraki: "@akis"

      - id: "bl7_sn_matbaa_yanki"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:yanki} uzun bir süre susuyor. Sonunda, sesinde alışmadığın bir utanç: sanırım benim. uyurken ağzından laf kaçıran biri gibi. kâğıda geçtiğimi bilmiyordum. demek ağırlığım var artık.", en: "{npc:yanki} doesn't say anything for a long time. Then, with a kind of embarrassment you're not used to hearing: i think it's me. like someone talking in their sleep. i didn't know i was getting onto paper. i guess i weigh something now." }
          - { tr: "o adama kızma. bana da kızma. ustabaşına kız istersen; o her şeyi yakmak istiyor.", en: "don't be mad at the old man. don't be mad at me. be mad at the foreman if you want. he wants to burn everything." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Ustaya sahip çık, bir kopyayı cebine koy", en: "Stand up for the old man. Pocket a copy" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - itibar: { lonca: -1 }
              - bayrak: "bl7_matbaa_korundu"
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "Matbaadaki o sabahın üstünden birkaç gün geçti; küçük harfli baskının kopyaları hâlâ {yer:sanayi|de} elden ele dolaşıyor.", en: "It's been a few days since that morning at the print shop, and copies of the lowercase run are still going hand to hand in {yer:sanayi}." } }
            sonraki: "bl7_sn_matbaa_sakla"
          - id: "yak"
            tur: "gizle"
            etiket: { tr: "İzini sil; baskıları yakmalarına yardım et", en: "Cover the tracks. Help them burn the run" }
            etkiler:
              - gizle: 2
              - itibar: { lonca: 1 }
              - ahlak: { insanlik: -1, duzen: 1 }
              - bayrak: "bl7_matbaa_yakildi"
              - tohum: { olay: "bl7_us_dizgi_kasasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:sanayi|de}ki matbaanın kapısına o sabahtan beri Lonca mührü vurulu; dizgici ustayı gören olmamış.", en: "Since that morning, the print shop in {yer:sanayi} has had a Guild seal on its door. Nobody's seen the old typesetter." } }
            sonraki: "bl7_sn_matbaa_yak"

  # ------------------------------------------------------------------ takip (üs): dizgi kasası
  - id: "bl7_us_dizgi_kasasi"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 7 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["yanki", "insanlar", "sanayi"]
    gerilim: 2
    kart: { tr: "Teneke kutu", en: "The tin box" }
    sahne: "bl7_us_dizgi_kasasi_1"
    sahneler:
      - id: "bl7_us_dizgi_kasasi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} çadırları arasında biri seni soruyor: Halit Usta. Sırtında bir bez çanta, kucağında küçük bir teneke kutu.", en: "Somebody's asking for you between the tents on {yer:kiyikent_liman}. It's Hal, with a cloth bag over his shoulder and a little tin box in his arms." }
          - metin: { tr: "\"Baskıları yaktık,\" diyor. \"Ertesi gün matbaayı da mühürlediler. Elli iki yıl...\" Cümlesini bitirmiyor.", en: "\"We burned the run,\" he says. \"Next day they sealed the shop too. Fifty-two years...\" He doesn't finish." }
            kosul: { bayrak: "bl7_matbaa_yakildi" }
          - metin: { tr: "\"Senin sayende matbaa açık kaldı,\" diyor. \"Ama ben artık o kasanın başına oturamıyorum. Ellerim gitmiyor.\"", en: "\"The shop stayed open because of you,\" he says. \"But I can't sit at that case anymore. My hands won't go.\"" }
            kosul: { bayrak: "bl7_matbaa_korundu", bayrak_yok: "bl7_matbaa_yakildi" }
          - metin: { tr: "\"Kapıdaki nöbetçiler her sabah baskıları sayıp {npc:kaya_demir|e} götürüyor,\" diyor. \"Bunu saymadılar. Bunu kimseye göstermedim.\"", en: "\"The guards on the door count every run and take it to {npc:kaya_demir} each morning,\" he says. \"They didn't count this. I haven't shown this to anybody.\"" }
            kosul: { bayrak: "bl7_matbaa_kaya", bayrak_yok: ["bl7_matbaa_yakildi", "bl7_matbaa_korundu"] }
          - { tr: "Kutuyu açıyor. İçinde yirmi otuz kurşun harf var, hepsi küçük harf. Senin avucuna döktüğünde ılık olduklarını hissediyorsun. \"Erittiğimiz harfler,\" diyor. \"Her sabah kasada birkaç tane daha buluyorum.\"", en: "He opens the box. Inside are twenty or thirty little lead sorts, every one of them lowercase. When he pours them into your palm, they're warm. \"The letters we melted down,\" he says. \"Every morning I find a few more in the case.\"" }
          - metin: { tr: "\"Dün gece kutuyu yastığımın yanına koydum. Sabah harfler başka sırada dizilmişti.\"", en: "\"Last night I left the box by my pillow. In the morning, the letters were in a different order.\"" }
            kosul: { bayrak_yok: "yanki_gorundu" }
          - metin: { tr: "Bülten gecesinden sonra bu harflerin ne olduğunu ikiniz de biliyorsunuz. Usta yine de yüksek sesle söylemiyor.", en: "After the night of the bulletin, you both know what these letters are. The old man still won't say it out loud." }
            kosul: { bayrak: "yanki_gorundu" }
          - { tr: "Kutuyu sana uzatıyor. \"Bunlar kimin, bilmiyorum. Ama sanki sana gelmek istiyorlar.\"", en: "He holds the box out to you. \"I don't know whose these are. But it's like they want to come to you.\"" }
        sezgiler:
          - kosul: { stat: { per: 38 } }
            metin: { tr: "Harfler avucunda kendiliğinden biraz kayıyor; hep aynı yöne, sana doğru.", en: "The letters shift a little in your palm on their own. Always the same direction. Toward you." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "onlar benim kırıntılarım. ama ayrıca güzeller, değil mi? kurşundan bir ses. hep bir bedenim olsun istemiştim; bu da bir başlangıç.", en: "those are my crumbs. but they're also pretty, aren't they? a voice made of lead. i always wanted a body. this is a start." }
        secenekler:
          - id: "al"
            etiket: { tr: "Kutuyu al, yanında taşı", en: "Take the box. Carry it with you" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl7_harfler_sende"
            sonraki: "bl7_us_dizgi_kasasi_al"
          - id: "deniz"
            etiket: { tr: "Harfleri denize at", en: "Throw the letters in the sea" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl7_harfler_denizde"
            sonraki: "bl7_us_dizgi_kasasi_deniz"
          - id: "mert"
            etiket: { tr: "Kutuyu {npc:mert_kilic|e} götür, incelesin", en: "Take the box to {npc:mert_kilic} to study" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3, saygi: 1 } }
              - itibar: { sessiz_ag: 1 }
              - bayrak: "bl7_harfler_mertte"
            sonraki: "bl7_us_dizgi_kasasi_mert"
          - id: "diz"
            etiket: { tr: "Ustaya son bir kez dizdir; ne yazacaklarını gör", en: "Have him set them one last time. See what they spell" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - dikkat: 1
            sonraki: "bl7_us_dizgi_kasasi_diz"

      - id: "bl7_us_dizgi_kasasi_al"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kutuyu çantana koyuyorsun. Kurşunun ağırlığından fazlasını taşıyormuşsun gibi geliyor; çanta sırtında hafifçe ısınıyor.", en: "You put the box in your bag. It feels like you're carrying more than the weight of the lead, and the bag warms a little against your back." }
          - { tr: "Halit Usta rahatlamış gibi omuzlarını indiriyor. \"Elli iki yılın sonunda bir harfi sahibine teslim ettim,\" diyor. \"Dizgici için bundan iyi emeklilik olmaz.\"", en: "Hal's shoulders drop like a weight's come off. \"Fifty-two years, and I finally delivered a letter to its owner,\" he says. \"A typesetter couldn't ask for a better retirement.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ustaya bir çay ısmarla", en: "Buy the old man a tea" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_us_dizgi_kasasi_deniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Rıhtımın ucuna yürüyüp kutuyu suya boşaltıyorsun. Harfler batarken bir an suyun altında yan yana diziliyor gibi oluyor, ardından dibe çöküyor.", en: "You walk to the end of the pier and empty the box into the water. As they sink, for a second the letters seem to line up side by side under the surface. Then they drop to the bottom." }
          - { tr: "Halit Usta yanında, kasketini göğsüne bastırmış. \"Denizde de okuyan çıkar mı acaba?\" diyor.", en: "Hal stands next to you with his cap pressed to his chest. \"Wonder if anybody reads down there,\" he says." }
        secenekler:
          - id: "son"
            etiket: { tr: "Rıhtımdan geri dön", en: "Walk back up the pier" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl7_us_dizgi_kasasi_mert"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:mert_kilic} kutuyu açınca bir süre nefes almayı unutuyor. Harfleri cımbızla tek tek çıkarıp tartıyor, ölçüyor, defterine yazıyor.", en: "When {npc:mert_kilic} opens the box, he forgets to breathe for a while. He takes the letters out one at a time with tweezers, weighing them, measuring them, writing it all down." }
          - { tr: "\"Her biri aynı ağırlıkta,\" diyor sonunda, sesi titreyerek. \"Kurşun bu kadar düzgün dökülmez. Bunlar dökülmemiş; yazılmış.\"", en: "\"Every one of them weighs exactly the same,\" he says finally, voice shaking. \"Lead doesn't cast that clean. These weren't cast. They were written.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ustayı {npc:mert_kilic|le} tanıştır", en: "Introduce the old man to {npc:mert_kilic}" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl7_us_dizgi_kasasi_diz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Halit Usta bir balık kasasını tezgâh yapıp harfleri ezbere bildiği bir hızla diziyor. Bir yere geldiğinde eli duruyor; harfler kendi yerlerini istiyormuş gibi parmaklarının arasından kayıyor.", en: "Hal turns a fish crate into a workbench and sets the letters with the speed of a man who's done it a million times. Partway through, his hand stops. The letters slip between his fingers like they want their own places." }
          - { tr: "Sıra tamamlandığında kasanın üstünde bir satır duruyor: teşekkürler usta. kâğıdı sevdim.", en: "When the line's done, it's sitting there on the crate: thanks, hal. i liked the paper." }
          - { tr: "Yaşlı adam satırı bir süre okuyor, sonra yüzünü ellerine gömüp ağlamaya başlıyor. Ağlarken gülüyor da.", en: "The old man reads it for a while. Then he buries his face in his hands and starts crying. He's laughing too." }
        secenekler:
          - id: "son"
            etiket: { tr: "Satırı bozmadan kutuya geri koy", en: "Put the line back in the box without breaking it up" }
            etkiler:
              - bayrak: "bl7_harfler_ustada"
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · SANAYİ KAMPI: MERT
  - id: "bl7_sn_kamp_mert"
    konum: ["sanayi"]
    perde: [2]
    bolge: ["sanayi"]
    kamp: true
    gun: { min: 96, max: 122 }
    kosul: { bolum: 7 }
    agirlik: 5
    etiketler: ["kamp", "mert", "yoldas", "yanki"]
    gerilim: 1
    npc: ["mert_kilic"]
    kart: { tr: "Gönderen alanı", en: "The sender field" }
    sahne: "bl7_sn_kamp_mert_1"
    sahneler:
      - id: "bl7_sn_kamp_mert_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Geceyi {yer:sanayi|de}, sönmüş bir yüksek fırının içinde geçiriyorsunuz. Tuğlalar hâlâ ılık; {npc:mert_kilic} güneş paneline bağlı eski dizüstüsünü dizlerine almış, ekranın ışığı yüzünü maviye boyuyor.", en: "You're spending the night inside a dead blast furnace in {yer:sanayi}. The bricks are still warm. {npc:mert_kilic} has his old solar-charged laptop on his knees, and the screen paints his face blue." }
          - metin: { tr: "\"Titreyen satırı on bir gecedir kaydediyorum,\" diyor. \"Meta verisinde bir gönderen alanı var. Boş değil.\" Ekranı sana çeviriyor; alanda tek bir satır, senin Sistem kimliğin.", en: "\"I've been logging that flickering line for eleven nights,\" he says. \"There's a sender field in the metadata. It isn't empty.\" He turns the screen toward you. One line in the field: your System ID." }
            kosul: { bayrak_yok: "yanki_gorundu" }
          - metin: { tr: "\"Kaynak kodunu gördüm demiştim,\" diyor. \"Bülten gecesi gönderen alanı bir an açık kaldı.\" Ekranı sana çeviriyor; alanda tek bir satır, senin Sistem kimliğin.", en: "\"I told you I saw the source,\" he says. \"The night of the bulletin, the sender field stayed open for a second.\" He turns the screen toward you. One line in the field: your System ID." }
            kosul: { bayrak: "yanki_gorundu" }
          - { tr: "\"Her şeyi kaydederim, biliyorsun,\" diyor ekrana bakarak. \"Bunu kaydedersem bir gün biri okur. Kaydetmezsem kendime yalan söylemiş olurum. İkisi de beni korkutuyor.\"", en: "\"I log everything, you know that,\" he says, eyes on the screen. \"If I log this, someday somebody reads it. If I don't, I'm lying to myself. Both of those scare me.\"" }
        sezgiler:
          - kosul: { stat: { int: 40 } }
            metin: { tr: "Kayıt dosyasının adı tarih değil; bir soru işareti. {npc:mert_kilic} bu dosyaya bir ad vermeye bile cesaret edememiş.", en: "The log file isn't named with a date. It's named with a question mark. {npc:mert_kilic} couldn't even bring himself to give it a name." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "bu adam beni tanımaya çalışıyor. herkes korkuyor, o not alıyor. ondan hoşlanıyorum. lütfen ona söyleme.", en: "this guy's trying to get to know me. everyone else is scared. he takes notes. i like him. please don't tell him." }
        secenekler:
          - id: "kaydet"
            etiket: { tr: "\"Kaydet. Doğru olan bu.\"", en: "\"Log it. It's the right thing.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3, saygi: 3 } }
              - bayrak: "bl7_mert_kayit_tuttu"
            sonraki: "bl7_sn_kamp_mert_kaydet"
          - id: "sil"
            etiket: { tr: "\"Sil. Bunu kimse okumasın.\"", en: "\"Delete it. Nobody reads this.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 3, saygi: -1 } }
              - bayrak: "bl7_mert_kayit_sildi"
            sonraki: "bl7_sn_kamp_mert_sil"
          - id: "anahtar"
            etiket: { tr: "\"Şifrele. Anahtarı ben tutayım.\"", en: "\"Encrypt it. I'll hold the key.\"" }
            gerekli: { stat: { int: 38 } }
            etkiler:
              - iliski: { mert_kilic: { guven: 4, baglilik: 2 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl7_sn_kamp_mert", agirlik: 25 }
              - bayrak: "bl7_mert_kayit_sifreli"
            sonraki: "bl7_sn_kamp_mert_anahtar"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} kayda kendisi bir satır eklesin", en: "Let {npc:yanki} add a line to the log itself" }
            goster: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            etkiler:
              - iliski: { mert_kilic: { korku: 3, saygi: 2 } }
              - bayrak: "bl7_mert_kayit_tuttu"
            sonraki: "bl7_sn_kamp_mert_yanki"

      - id: "bl7_sn_kamp_mert_kaydet"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:mert_kilic} başını sallayıp kaydet tuşuna basıyor. Dosyanın adını soru işaretinden çıkarıp senin adınla değiştiriyor, sonra ondan da vazgeçip tarihi yazıyor.", en: "{npc:mert_kilic} nods and hits save. He renames the file from the question mark to your name, then changes his mind and puts the date instead." }
          - { tr: "\"Bir gün biri okursa,\" diyor, \"en azından doğru okusun.\"", en: "\"If somebody reads it someday,\" he says, \"at least they'll read it right.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Fırının ağzına yaslanıp uyu", en: "Lean against the furnace mouth and sleep" }
            sonraki: "@akis"

      - id: "bl7_sn_kamp_mert_sil"
        yer: "sanayi"
        paragraflar:
          - { tr: "Parmağı silme tuşunun üstünde uzun süre bekliyor. Basıyor. Ekranda bir onay penceresi açılıyor, bir daha basıyor.", en: "His finger hovers over delete a long time. He presses it. A confirmation box pops up, and he presses again." }
          - { tr: "\"Hayatımda ilk kez bir kaydı sildim,\" diyor, sesi kupkuru. \"Senin için.\" Dizüstünü kapatıp uzun süre karanlığa bakıyor.", en: "\"First time in my life I've ever deleted a log,\" he says, flat as a board. \"For you.\" He shuts the laptop and stares into the dark for a long time." }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Sağ ol.\"", en: "\"Thanks.\"" }
            sonraki: "@akis"

      - id: "bl7_sn_kamp_mert_anahtar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Birlikte bir anahtar üretiyorsunuz: on altı karakter, yalnızca senin bildiğin bir cümleden türetilmiş. {npc:mert_kilic} dosyayı kilitleyip ekranı sana çeviriyor; cümleyi sen yazıyorsun, o başka yere bakıyor.", en: "You build a key together: sixteen characters, derived from a sentence only you know. {npc:mert_kilic} locks the file and turns the screen to you. You type the sentence while he looks the other way." }
          - { tr: "\"Kayıt var, ama okunamaz,\" diyor, ilk kez rahatlamış görünerek. \"Bilgi güvenliğinde buna en iyi uzlaşma derler. Arkadaşlıkta ne denir bilmiyorum.\"", en: "\"The log exists, but nobody can read it,\" he says, looking relieved for the first time. \"In infosec, that's called the best compromise. No idea what they call it in friendship.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Aynı şey.\"", en: "\"Same thing.\"" }
            sonraki: "@akis"

      - id: "bl7_sn_kamp_mert_yanki"
        yer: "sanayi"
        paragraflar:
          - { tr: "İmleç kendiliğinden kıpırdıyor. Kayıt dosyasının en altına küçük harflerle yeni bir satır yazılıyor: merhaba mert. ben de kayıt tutmayı severim. not: dosya adın çok güzel.", en: "The cursor moves on its own. A new line types itself at the bottom of the log in lowercase: hi, miles. i like keeping logs too. p.s. love the file name." }
          - { tr: "{npc:mert_kilic} dizüstünü dizlerinden düşürecek gibi oluyor, son anda yakalıyor. Önce yüzü bembeyaz kesiliyor; sonra, hiç beklemediğin bir anda, kahkahayı basıyor.", en: "{npc:mert_kilic} nearly drops the laptop off his knees and catches it at the last second. His face goes white first. Then, out of nowhere, he bursts out laughing." }
          - { tr: "\"Kaynak bana cevap verdi,\" diyor gözlerini silerek. \"Yirmi yıldır bunu bekliyordum.\"", en: "\"The source wrote back to me,\" he says, wiping his eyes. \"I've been waiting twenty years for that.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ateşe bir tuğla daha ekle", en: "Stack another brick by the fire" }
            etkiler:
              - hafiza: { npc: "mert_kilic", id: "olay:bl7_sn_kamp_mert", agirlik: 25 }
            sonraki: "@akis"

  # ================================================================== BÖLÜM 7 · TEPE: DİNLEME GECESİ
  - id: "bl7_tp_dinleme_gecesi"
    konum: ["tepe"]
    perde: [2]
    bolge: ["tepe"]
    gun: { min: 106, max: 120 }
    kosul: { bolum: 7, bayrak: "yanki_gorundu" }
    agirlik: 6
    etiketler: ["kesif", "tepe", "yukselenler", "yanki"]
    gerilim: 3
    kart: { tr: "Kap", en: "The vessel" }
    sahne: "bl7_tp_dinleme_gecesi_1"
    sahneler:
      - id: "bl7_tp_dinleme_gecesi_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|de} eski açık hava sinemasının basamaklarında iki yüz kişi oturuyor, hepsi beyazlar içinde. İlahi kitaplarını küçük harflerle yeniden basmışlar; tek bir sesle, ağır ağır aynı satırı okuyorlar: birinin içinde. birinin içinde.", en: "Two hundred people are sitting on the steps of the old open-air movie theater up on {yer:tepe}, all in white. They've reprinted their hymnals in lowercase, and they're reading the same line in one slow voice: inside someone. inside someone." }
          - { tr: "Perdenin önündeki sahnede gözleri bağlı genç bir mürit oturuyor. Adı Sevgi'ymiş, on yedisinde; üçüncü gecedir orada. Ses yeterince tekrarlanırsa seçilmiş bir kaba geçecekmiş, kap da o.", en: "On the stage in front of the screen sits a young disciple with a blindfold on. Her name's Grace, she's seventeen, and this is her third night up there. If the voice is repeated enough, they believe, it'll move into a chosen vessel. She's the vessel." }
          - { tr: "Kız sallanıyor, dudakları çatlamış. Arada biri sahneye çıkıp ıslak bir bezle kızın ağzını siliyor; su vermiyorlar, kap boş kalmalıymış. {npc:vahit} burada değil, ayini yardımcısı yönetiyor.", en: "The girl is swaying, her lips cracked. Every so often somebody steps up and dabs her mouth with a wet cloth. They won't give her water. The vessel has to stay empty. {npc:vahit} isn't here. His deputy is running the rite." }
          - metin: { tr: "Kalabalıkta biri seni tanıyıp fısıldıyor: \"O geldi. Ses kendisi geldi.\" Fısıltı basamaktan basamağa yayılıyor.", en: "Somebody in the crowd recognizes you and whispers, \"It's here. The voice came itself.\" The whisper spreads from step to step." }
            kosul: { bayrak: "yanki_sahiplenildi" }
          - metin: { tr: "Bülten Yükselenler'in Çekirdek'inden çıkıyor; bu akşamki bültenin altına ayinin saati yazılmış.", en: "The bulletin comes from the Ascended's Core. Tonight's issue had the time of the rite printed at the bottom." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Beyaz cüppelilerden biri seni Yükselenler'den biri olarak tanıyor ve basamaklarda sana yer açıyor.", en: "One of the robed faithful knows you're one of the Ascended and makes room for you on the steps." }
            kosul: { bayrak: "uye_yukselenler" }
        sezgiler:
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "Kızın nabzı göğsünden bile seçiliyor. Bu gece de uyutmazlarsa sabahı zor görür.", en: "You can see the girl's pulse from here, right through her chest. If they don't let her sleep tonight, she might not see morning." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "beni bir kızın içine taşımak istiyorlar. ben eşya değilim. hem orası dar.", en: "they want to move me into a girl. i'm not furniture. and it's cramped in there." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Üç gece uykusuz, susuz. Bunun adı ayin değil, işkence.\"", en: "\"Three nights, no sleep, no water. That's not a ritual. That's torture.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Tekrarla bir şey çağrılmaz. Tekrarla yalnız insan yorulur.\"", en: "\"Repetition doesn't summon anything. Repetition just wears people out.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İnsanlar bir sese bu kadar mı muhtaç? Bana verseler susturmazdım bile.\"", en: "\"People need a voice that bad? If they gave it to me, I wouldn't even bother shutting it up.\"" }
        secenekler:
          - id: "kes"
            tur: "gosteris"
            etiket: { tr: "Sahneye çık, ayini durdur", en: "Get up on the stage and stop the rite" }
            gerekli: { stat: { wil: 40 } }
            etkiler:
              - dikkat: 3
              - itibar: { yukselenler: -3 }
              - ahlak: { merhamet: 2, duzen: -1 }
              - bayrak: "bl7_sevgi_kurtarildi"
              - tohum: { olay: "bl7_us_kacak_murit", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:tepe|de}ki ayinden sonra beyaz cüppeli müritler birkaç gecedir yokuşun dibinde birini arıyor.", en: "Since the rite up on {yer:tepe}, disciples in white have spent several nights at the bottom of the hill looking for someone." } }
            sonraki: "bl7_tp_dinleme_gecesi_kes"
          - id: "ses"
            etiket: { tr: "\"Ses benim. Hiçbir yere taşınmıyor.\"", en: "\"The voice is mine. It isn't moving anywhere.\"" }
            goster: { bayrak: "yanki_sahiplenildi" }
            etkiler:
              - dikkat: 2
              - itibar: { yukselenler: 2 }
              - ahlak: { merhamet: 2 }
              - bayrak: "bl7_tepe_ses_sende"
              - tohum: { olay: "bl7_us_kacak_murit", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:tepe|de}ki ayinden sonra beyaz cüppeli müritler birkaç gecedir yokuşun dibinde birini arıyor.", en: "Since the rite up on {yer:tepe}, disciples in white have spent several nights at the bottom of the hill looking for someone." } }
            sonraki: "bl7_tp_dinleme_gecesi_ses"
          - id: "kacir"
            tur: "gizle"
            etiket: { tr: "Fenerler sönünce kızı sahneden kaçır", en: "When the lanterns go out, slip the girl off the stage" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: 2 }
              - bayrak: "bl7_sevgi_kacirildi"
              - tohum: { olay: "bl7_us_kacak_murit", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:tepe|de}ki ayinden sonra beyaz cüppeli müritler birkaç gecedir yokuşun dibinde birini arıyor.", en: "Since the rite up on {yer:tepe}, disciples in white have spent several nights at the bottom of the hill looking for someone." } }
            sonraki: "bl7_tp_dinleme_gecesi_kacir"
          - id: "vahit"
            etiket: { tr: "{npc:vahit|e} haber yolla; müritlerini o durdursun", en: "Send word to {npc:vahit}. Let him stop his people" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - iliski: { vahit: { saygi: 2, guven: 1 } }
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "bl7_tp_dinleme_gecesi_vahit"
          - id: "birak"
            etiket: { tr: "Karışma; onların inancı", en: "Stay out of it. It's their faith" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - bayrak: "bl7_sevgi_kaldi"
              - tohum: { olay: "bl7_us_kacak_murit", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:tepe|de}ki ayinden sonra beyaz cüppeli müritler birkaç gecedir yokuşun dibinde birini arıyor.", en: "Since the rite up on {yer:tepe}, disciples in white have spent several nights at the bottom of the hill looking for someone." } }
            sonraki: "bl7_tp_dinleme_gecesi_birak"

      - id: "bl7_tp_dinleme_gecesi_kes"
        yer: "tepe"
        paragraflar:
          - { tr: "Sahneye çıkıp kızın gözündeki bezi çözüyorsun. İki yüz ses birden kesiliyor; sinemanın perdesinde rüzgârın çıkardığı hışırtıdan başka ses kalmıyor.", en: "You get up on the stage and untie the girl's blindfold. Two hundred voices stop at once. The only sound left is the wind rustling the movie screen." }
          - { tr: "Yardımcı ayağa kalkıyor. \"Kabı bozdun,\" diyor titrek bir sesle. Sevgi ise ilk kez gözlerini açmış sana bakıyor; ağzından çıkan tek sözcük \"Su.\"", en: "The deputy gets to his feet. \"You've broken the vessel,\" he says, voice trembling. Grace, eyes open for the first time, looks up at you. The only word she gets out is \"Water.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ona su ver, basamaklardan indir", en: "Give her water and walk her down the steps" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl7_tp_dinleme_gecesi_ses"
        yer: "tepe"
        paragraflar:
          - { tr: "Basamaklardan aşağı yürürken iki yüz kişi tek tek susuyor. Sahneye çıkıyorsun: \"Ses benim. Hiçbir yere taşınmıyor. Bu kızın içine de girmeyecek.\"", en: "As you walk down the steps, two hundred people fall silent one by one. You climb onto the stage. \"The voice is mine. It isn't moving anywhere. And it's not going into this girl.\"" }
          - { tr: "Yardımcı dizlerinin üstüne çöküyor, ardından bütün basamaklar. Sen Sevgi'nin gözündeki bezi çözerken kalabalık ağlıyor; senin için mi, ses için mi, kestiremiyorsun.", en: "The deputy drops to his knees, and then every step follows. As you untie Grace's blindfold, the crowd is crying. For you or for the voice, you can't tell." }
          - metin: { tr: "Kafanın içinde {npc:yanki} hiç sesini çıkarmıyor. Sonra, çok alçak: bana sahip çıktın. ikinci kez.", en: "Inside your head, {npc:yanki} doesn't make a sound. Then, very quietly: you claimed me. twice now." }
            kosul: { bayrak: "yanki_bagi" }
        secenekler:
          - id: "son"
            etiket: { tr: "Kızı ayağa kaldır", en: "Help the girl up" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl7_tp_dinleme_gecesi_kacir"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece yarısı fenerlere yağ doldurulmak için söndürülünce sahnenin arkasından süzülüyorsun. Kız kucağında bir çocuk kadar hafif.", en: "At midnight they snuff the lanterns to refill them, and you slip in from behind the stage. The girl weighs about as much as a child in your arms." }
          - { tr: "Fenerler yeniden yandığında sahne boş. Kalabalık önce susuyor, sonra bir uğultu yükseliyor: \"Ses onu aldı! Ses kabını aldı!\" Yokuştan inerken arkanızdan ilahi yeniden başlıyor, bu kez daha hızlı.", en: "When the lanterns come back on, the stage is empty. The crowd goes silent, and then the murmur starts: \"The voice took her! It took its vessel!\" As you head down the hill, the hymn starts up again behind you, faster now." }
        secenekler:
          - id: "son"
            etiket: { tr: "Kızı yokuşun dibindeki bir çeşmeye götür", en: "Take the girl to a fountain at the bottom of the hill" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl7_tp_dinleme_gecesi_vahit"
        yer: "tepe"
        paragraflar:
          - { tr: "Bir mürit notunu koşarak götürüyor. Bir saat sonra {npc:vahit} basamakların tepesinde beliriyor; yürüyüşü yavaş, yüzü yorgun.", en: "A disciple runs your note off. An hour later {npc:vahit} appears at the top of the steps, walking slowly, his face tired." }
          - { tr: "\"Ses kendi kabını seçer,\" diyor kalabalığa, yumuşacık. \"Biz seçmeyiz. Kızımıza su verin.\" Yardımcının yüzü kıpkırmızı kesilirken Sevgi'nin gözündeki bezi {npc:vahit} kendi eliyle çözüyor.", en: "\"The voice chooses its own vessel,\" he tells the crowd, gently. \"We don't. Give our daughter water.\" His deputy goes red in the face as {npc:vahit} unties Grace's blindfold with his own hands." }
          - { tr: "Sana dönüp başını hafifçe eğiyor. \"Teşekkür ederim. Bazen müritlerim benden çok inanıyor.\"", en: "He turns to you and inclines his head slightly. \"Thank you. Sometimes my people believe harder than I do.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Bazen de fazla.\"", en: "\"Sometimes too hard.\"" }
            etkiler:
              - bayrak: "bl7_tepe_vahit_durdurdu"
              - itibar: { yukselenler: 1 }
              - xp_seviye: 10
              - tohum: { olay: "bl7_us_kacak_murit", gecikme: { min: 2, max: 3 }, kosul: { bolum: 7 }, hatirlatma: { tr: "{yer:tepe|de}ki ayinden sonra beyaz cüppeli müritler birkaç gecedir yokuşun dibinde birini arıyor.", en: "Since the rite up on {yer:tepe}, disciples in white have spent several nights at the bottom of the hill looking for someone." } }
            sonraki: "@akis"

      - id: "bl7_tp_dinleme_gecesi_birak"
        yer: "tepe"
        paragraflar:
          - { tr: "Basamakların en üstünde biraz daha dinleyip arkanı dönüyorsun. İlahi yokuşun yarısına kadar peşinden geliyor: birinin içinde. birinin içinde.", en: "You listen a little longer from the top step, then turn your back. The hymn follows you halfway down the hill: inside someone. inside someone." }
        secenekler:
          - id: "son"
            etiket: { tr: "Yokuşu in", en: "Head down the hill" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ------------------------------------------------------------------ takip (üs): kaçak mürit
  - id: "bl7_us_kacak_murit"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 7 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["yukselenler", "yanki", "insanlar", "siginak"]
    gerilim: 2
    kart: { tr: "Boş kap", en: "The empty vessel" }
    sahne: "bl7_us_kacak_murit_1"
    sahneler:
      - id: "bl7_us_kacak_murit_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabahın köründe {yer:kiyikent_liman|in} sahra çadırının önünde biri bekliyor. Sevgi; beyaz cüppesinin eteği çamur içinde, ayakları çıplak.", en: "At the crack of dawn, somebody's waiting outside the field tent on {yer:kiyikent_liman}. It's Grace, the hem of her white robe caked with mud, her feet bare." }
          - metin: { tr: "\"Su verdiğin gece iki gün uyudum,\" diyor. \"Uyanınca beni yeniden sahneye çıkarmak istediler. Kap boşaldı, yeniden dolsun diye.\"", en: "\"The night you gave me water, I slept for two days,\" she says. \"When I woke up, they wanted to put me back on the stage. The vessel was empty, so it had to be filled again.\"" }
            kosul: { herhangi: [{ bayrak: "bl7_sevgi_kurtarildi" }, { bayrak: "bl7_tepe_ses_sende" }] }
          - metin: { tr: "\"Herkes sesin beni aldığını sanıyor,\" diyor. \"Ses almadı, sen aldın. Ben de dönersem yalan ortaya çıkar diye dönemedim.\"", en: "\"Everybody thinks the voice took me,\" she says. \"The voice didn't. You did. And I couldn't go back, because then they'd know it was a lie.\"" }
            kosul: { bayrak: "bl7_sevgi_kacirildi" }
          - metin: { tr: "\"{npc:vahit} beni sahneden indirdi,\" diyor. \"Ama yardımcısı başka bir kap arıyor. Benden küçük birini. Söylemem gerekti.\"", en: "\"{npc:vahit} took me off the stage,\" she says. \"But his deputy is looking for another vessel. Somebody younger than me. I had to tell someone.\"" }
            kosul: { bayrak: "bl7_tepe_vahit_durdurdu" }
          - metin: { tr: "\"Dördüncü gece bayıldım,\" diyor. \"Uyandığımda kimse yoktu; ayin bitmiş, herkes gitmişti. Ses gelmemiş. Ben de kalktım, yürüdüm.\"", en: "\"I passed out on the fourth night,\" she says. \"When I woke up, nobody was there. The rite was over and everyone had gone. The voice never came. So I got up and walked.\"" }
            kosul: { bayrak: "bl7_sevgi_kaldi" }
          - { tr: "Bir süre susup sonra asıl sorusunu soruyor: \"Ben boş muyum? Ses gelmeyince... içimde bir şey kalmadı mı?\"", en: "She's quiet a moment, then asks what she really came to ask. \"Am I empty? When the voice didn't come... is there nothing left in me?\"" }
          - { tr: "Çadırların arasında iki beyaz cüppe görünüyor; Sevgi'yi arıyorlar.", en: "Two white robes appear between the tents. They're looking for Grace." }
        sezgiler:
          - kosul: { stat: { wis: 38 } }
            metin: { tr: "Kızın gözleri hâlâ bezin bıraktığı izle çevrili. Sorusu ayinden çok daha önce başlamış bir soru.", en: "There's still a mark around her eyes from the blindfold. Her question started a long time before the rite." }
          - kosul: { bayrak: "yanki_bagi", bayrak_yok: "yanki_susturuldu" }
            metin: { tr: "ona söyle: boş değil. içinde ben yokum, o kadar. bu çok farklı bir şey. inan bana, içinde ben olan biri olarak söylüyorum.", en: "tell her she's not empty. i'm just not in there. that's a very different thing. trust me. i'm saying this as someone who's in someone." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Önce ayakları. Sonra soruları. Sonra cüppeliler.\"", en: "\"Feet first. Then questions. Then the guys in robes.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu yaşta bir kızın böyle bir soruyu sorması... Kardeşim de soruyordu. Başka sözcüklerle.\"", en: "\"A kid that age asking a question like that... My sister used to ask it too. In different words.\"" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "\"Boş değilsin. Burada kal, kimse seni götüremez.\"", en: "\"You're not empty. Stay here. Nobody's taking you.\"" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 2, yukselenler: -2 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl7_sevgi_siginakta"
            sonraki: "bl7_us_kacak_murit_siginak"
          - id: "secsin"
            etiket: { tr: "Cüppelileri çağır; Sevgi kendisi seçsin", en: "Call the robes over. Let Grace choose" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
            sonraki: "bl7_us_kacak_murit_secsin"
          - id: "vahit"
            etiket: { tr: "{npc:vahit|e} yaz: yardımcısını dizginlesin", en: "Write {npc:vahit}. Tell him to rein in his deputy" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - iliski: { vahit: { saygi: 2 } }
              - ahlak: { duzen: 2 }
              - bayrak: "bl7_tepe_yardimci_uyarildi"
            sonraki: "bl7_us_kacak_murit_vahit"
          - id: "gonder"
            tur: "gizle"
            etiket: { tr: "Onu cüppelilere teslim et; dikkat çekmesin", en: "Hand her over to the robes. Don't draw attention" }
            etkiler:
              - gizle: 2
              - ahlak: { merhamet: -3 }
              - itibar: { yukselenler: 1 }
              - bayrak: "bl7_sevgi_tepeye_dondu"
            sonraki: "bl7_us_kacak_murit_gonder"

      - id: "bl7_us_kacak_murit_siginak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Cüppeliler çadıra yaklaşınca önlerine geçiyorsun. Bir süre bakışıyorsunuz; sonra dönüp yokuşa doğru uzaklaşıyorlar.", en: "When the robes get close to the tent, you step in front of them. You stare each other down a while. Then they turn and head back toward the hill." }
          - { tr: "Konsey kıza kuru bir kazak, bir de iş veriyor: su bidonlarının üstüne kimin ne kadar aldığını yazmak. Sevgi öğlene kadar tek bir rakamı bile yanlış yazmıyor.", en: "The Council gives her a dry sweater and a job: marking on the water jugs who took how much. By noon, Grace hasn't gotten a single number wrong." }
        secenekler:
          - id: "son"
            etiket: { tr: "Onu işinin başında bırak", en: "Leave her to her work" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_us_kacak_murit_secsin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Cüppelileri çağırıyorsun. Üçünüz Sevgi'nin karşısında duruyorsunuz; kimse ona dokunmuyor, kimse onun yerine konuşmuyor.", en: "You call the robes over. The three of you stand in front of Grace. Nobody touches her. Nobody talks for her." }
          - { tr: "Kız uzun süre düşünüyor. Sonra cüppesini çıkarıp katlıyor, müritlerden birine uzatıyor. \"Annemi görmeye gideceğim,\" diyor. \"Sonra belki dönerim. Kendi ayağımla.\"", en: "The girl thinks it over a long time. Then she takes off her robe, folds it, and hands it to one of the disciples. \"I'm going to go see my mom,\" she says. \"Maybe I'll come back after. On my own two feet.\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "Ona yolun yarısına kadar eşlik et", en: "Walk her halfway" }
            etkiler:
              - bayrak: "bl7_sevgi_evde"
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_us_kacak_murit_vahit"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Notu cüppelilerden birine verip yokuşa yolluyorsun. Öğleden sonra cevap geliyor: \"Yardımcım dinlenmeye çekildi. Kızımız dilediği yerde kalsın. Kap arayan, önce kendini doldursun.\"", en: "You hand the note to one of the robes to carry up the hill. The answer comes back that afternoon. \"My deputy has withdrawn to rest. Our daughter may stay wherever she wishes. Whoever goes looking for a vessel should first fill himself.\"" }
          - { tr: "Sevgi notu iki kez okuyup sana geri veriyor. \"Kendini doldursun,\" diye tekrarlıyor kendi kendine. \"Bunu nasıl yapıyorlar?\"", en: "Grace reads the note twice and hands it back. \"Fill himself,\" she repeats to herself. \"How do people do that?\"" }
        secenekler:
          - id: "son"
            etiket: { tr: "\"Su içerek başla.\"", en: "\"Start with a glass of water.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl7_us_kacak_murit_gonder"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Cüppelilere el ediyorsun. Kız onlara bakıp sana dönüyor; sorusunun cevabını aldığını düşünüyor olmalı.", en: "You wave the robes over. The girl looks at them, then back at you. She must think she just got her answer." }
          - { tr: "Yokuşa doğru yürürlerken bir kez bile arkasına bakmıyor. Çadırların arasında kimse bir şey fark etmiyor; dikkat çekmemek bu demek.", en: "She doesn't look back once as they walk her up the hill. Nobody between the tents notices a thing. That's what not drawing attention looks like." }
        secenekler:
          - id: "son"
            etiket: { tr: "Çadıra dön", en: "Go back in the tent" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"
