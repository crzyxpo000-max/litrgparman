# Bölge olayları · Perde 2 · Bölüm 8 "Başlık" (gün 123–150; docs/STORY_FLOW.md "hikayesiz gün", DECISIONS #144).
# Bölümün havası: Kasaba Çekirdeği'nin kristali geceleri atıyor, birini arıyor; oyuncunun penceresinde [ERİŞİM İSTEĞİ BEKLEMEDE].
# Operasyon (sistem_gercegi, gün ≤ 135) erken girilebilir: olaylar gercek_hasat / gercek_kurtarma bayraklarıyla iki duruma da uyar.
# Zincirler (havuz → yalnız tohum; hepsi bu dosyada):
#   Kule Dibi: bl8_kule_nabiz → bl8_kule_tas_sogudu · bl8_kule_deger_sutunu → bl8_kule_yuzde_on_iki
#   Sanayi → Kule Dibi: bl8_sanayi_gise → bl8_kule_gise_gunu · Eski Şehir → Kule Dibi: bl8_eski_sehir_pul → bl8_kule_akbabalar
#   Üs: bl8_us_cizimler → bl8_us_uyurgezer · bl8_us_ikinci_ses → bl8_us_fisildayan
#   Tepe → Üs: bl8_tepe_ayna → bl8_us_tepeden_inen · Kordon → Üs: bl8_kordon_gece_ucte → bl8_us_camur_parasi
# Saha kampı sahneleri (kamp: true): bl8_kamp_aras, bl8_kamp_mert (Kule Dibi), bl8_kamp_deniz (Tepe), bl8_kamp_elif (Sanayi).
# Ara karakterler (düz ad): süpürgeci kadın; Kepçe Necmi / Scoop; kâtip Hayri / Harv; Sıla / Sadie; Levazımcı Şükran /
#   Quartermaster Shirley; Nezihe Hanım / Miss Nettie, torunu Yusuf / Joey; Emrah / Eddie; Rahibe Zerrin / Sister Zara,
#   acemi Onur / Owen; öğretmen Sevim / Ms. Simmons, Ece / Evie; Barış / Brody.
# Bu dosyanın bayrakları: flags/58_bolge_p2b.yaml.
olaylar:
  # ================================================================== KULE DİBİ · Zemindeki nabız (havuz)
  - id: "bl8_kule_nabiz"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "kule", "sistem", "sir"]
    gerilim: 2
    kart: { tr: "Zemindeki nabız", en: "A pulse in the floor" }
    sahne: "bl8_kule_nabiz_1"
    sahneler:
      - id: "bl8_kule_nabiz_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin giriş holünde sabah kuyruğu her zamanki kadar uzun, ama bugün kimse kapıya bakmıyor. Avcılar holün ortasında çember olmuş, gözlerini yere dikmişler.", en: "The morning line in the Spire's entrance hall is as long as ever, but today nobody's looking at the door. The hunters have formed a ring in the middle of the hall, eyes on the floor." }
          - { tr: "Çemberin ortasında, Kule'nin kara taşından zeminde avuç kadar bir yer ılık. Kule çıktığından beri holü süpüren yaşlı kadın elini taşa bastırmış: \"Üç gecedir böyle,\" diyor. \"Isınıyor, soğuyor. Isınıyor, soğuyor. Saat gibi.\"", en: "In the middle of the ring, a palm-sized patch of the Spire's black stone floor is warm. The old woman who's swept this hall since the Spire went up has her hand pressed flat on it. \"Three nights now,\" she says. \"Warm, cold. Warm, cold. Like a clock.\"" }
          - { tr: "Kuyruk kendi arasında kararını çoktan vermiş: altta bir Kapı açılıyor. Kazmalar, levyeler elden ele dolaşırken herkes aynı hesabı yapıyor; içeriden ne çıkarsa ilk vuranın olacak.", en: "The line has already made up its mind: there's a Gate opening down there. Picks and pry bars are going hand to hand, and everybody's doing the same math. Whatever crawls out belongs to whoever hits it first." }
          - metin: { tr: "Pencerendeki satır, [ERİŞİM İSTEĞİ BEKLEMEDE], taş her ısındığında bir kez yanıp sönüyor. İkisinin arasında bir bağ olduğunu görmek için Sistem olmaya gerek yok.", en: "The line in your window, [ACCESS REQUEST PENDING], blinks once every time the stone warms up. You don't need to be the System to see the two are connected." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - metin: { tr: "Merdivenden indiğin geceden beri bu ritmi uykunda bile duyuyorsun. Beyaz basamaklarda attığın her adım tam bu aralıkla yankılanmıştı.", en: "Ever since the night you went down those stairs, you've heard this rhythm in your sleep. Every step you took on the white stairs echoed at exactly this interval." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - metin: { tr: "Kuyruktaki Lonca avcılarından biri parmağındaki halkayı görünce sana dönüyor: \"Sen söyle, kazalım mı? Senin sözünü dinlerler.\"", en: "One of the Guild hunters in line spots the ring on your finger and turns to you. \"You call it. Do we dig? They'll listen to you.\"" }
            kosul: { bayrak: "uye_lonca" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Isınmalar eşit aralıkla gelmiyor. Her nabız bir öncekinin iki katı uzun sürüyor; bu gidişle biri yakında bütün geceyi kaplayacak.", en: "The warm spells aren't evenly spaced. Each pulse lasts twice as long as the one before. At this rate, one of them's going to take up a whole night." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "burayı sevmedim. aşağısı boş değil, dolu da değil. bekleme odası gibi.", en: "i don't like this. it's not empty down there. it's not full either. like a waiting room." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bunu ölçmem lazım. Yok, dur, önce kimse dokunmasın. Sonra ölçmem lazım.\"", en: "\"I need to measure this. No, wait, first nobody touch it. Then I need to measure it.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kadın üç gecedir burada yatıyor, fark ettin mi? Süpürgesini yastık yapmış.\"", en: "\"She's been sleeping here three nights, did you catch that? She's using her broom for a pillow.\"" }
        secenekler:
          - id: "dinle"
            etiket: { tr: "Diz çök, kulağını taşa daya", en: "Kneel and put your ear to the stone" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - bayrak: "bl8_nabiz_dinlendi"
              - tohum: { olay: "bl8_kule_tas_sogudu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule'nin holündeki ılık taştan beri kuyrukta başka bir şey konuşulmuyor.", en: "Since the warm stone in the Spire's entrance hall, the line hasn't talked about anything else." } }
            sonraki: "bl8_kule_nabiz_dinle"
          - id: "nobet"
            etiket: { tr: "Çemberi dağıt, taşın başına nöbetçi dik", en: "Break up the ring. Put a watch on the stone" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "bl8_nabiz_nobet"
              - tehlike: { kule_dibi: -2 }
              - tohum: { olay: "bl8_kule_tas_sogudu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule'nin holündeki ılık taştan beri kuyrukta başka bir şey konuşulmuyor.", en: "Since the warm stone in the Spire's entrance hall, the line hasn't talked about anything else." } }
            sonraki: "bl8_kule_nabiz_nobet"
          - id: "kaz"
            etiket: { tr: "Kazsınlar; içinden ne çıkarsa sen karşıla", en: "Let them dig. You'll meet whatever comes out" }
            etkiler:
              - ahlak: { duzen: -1 }
              - bayrak: "bl8_nabiz_kazildi"
              - tohum: { olay: "bl8_kule_tas_sogudu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule'nin holündeki ılık taştan beri kuyrukta başka bir şey konuşulmuyor.", en: "Since the warm stone in the Spire's entrance hall, the line hasn't talked about anything else." } }
            sonraki: "bl8_kule_nabiz_kaz"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|e} haber yolla; bunu görmesi lazım", en: "Send word to {npc:mert_kilic}. He needs to see this" }
            goster: { npc_hayatta: "mert_kilic" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - itibar: { sessiz_ag: 2 }
              - bayrak: "bl8_nabiz_mert"
              - tohum: { olay: "bl8_kule_tas_sogudu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule'nin holündeki ılık taştan beri kuyrukta başka bir şey konuşulmuyor.", en: "Since the warm stone in the Spire's entrance hall, the line hasn't talked about anything else." } }
            sonraki: "bl8_kule_nabiz_mert"
          - id: "birak"
            tur: "gizle"
            etiket: { tr: "Omuz silk; Kule'nin taşı Kule'nin derdi", en: "Shrug. The Spire's floor is the Spire's problem" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -1 }
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_dinle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Taş yanağını ısıtıyor. Duyduğun şey Kapıların o tanıdık uğultusu değil; biri aşağıdan bir kapıya vuruyor sanki, sabırla, her vuruşu bir öncekinin iki katı uzatarak.", en: "The stone warms your cheek. What you hear isn't that familiar Gate hum. It's more like somebody knocking on a door from underneath. Patient. Each knock held twice as long as the last." }
          - { tr: "Doğrulduğunda süpürgeci kadın yüzüne bakıyor. \"Sana da mı vuruyor?\" diye soruyor. \"Bana vurmuyor. Ben yalnızca sıcağını duyuyorum.\"", en: "When you sit up, the sweeper is studying your face. \"It's knocking for you too?\" she asks. \"It doesn't knock for me. I just feel the warm.\"" }
          - { tr: "Kazmalar hâlâ havada. Kuyruktakiler senin ağzından çıkacak sözü bekliyor.", en: "The picks are still up. The line is waiting to hear what you say." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "vuran kimse sana vuruyor. kapıyı açma demeyeceğim. hiç dinlemedin ki.", en: "whoever's knocking is knocking for you. i'm not going to say don't open it. you never listen anyway." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "Kalabalığa bunun bir Kapı olmadığını anlat", en: "Tell the crowd this isn't a Gate" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "bl8_kule_nabiz_red", basarisiz_etkiler: [{ bayrak: "bl8_nabiz_kazildi" }] }
            etkiler:
              - ahlak: { duzen: 2 }
              - tehlike: { kule_dibi: -2 }
            sonraki: "bl8_kule_nabiz_ikna"
          - id: "sus"
            etiket: { tr: "Duyduğunu kendine sakla, kalk", en: "Keep what you heard to yourself and get up" }
            etkiler:
              - gizle: 2
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} vuranın kim olduğunu sor", en: "Ask {npc:yanki} who's knocking" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 2 } }
              - xp_seviye: 9
            sonraki: "bl8_kule_nabiz_yanki"

      - id: "bl8_kule_nabiz_ikna"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapı ile kapı çalmak arasındaki farkı sakin sakin anlatıyorsun. Kapılar beklemez, açılır; bu ise bekliyor. Kimin için beklediğini söylemiyorsun.", en: "You walk them through the difference between a Gate and a knock. Gates don't wait, they open. This is waiting. You leave out who it's waiting for." }
          - { tr: "Kazmalar teker teker iniyor. Biri homurdanıp kuyruğa dönüyor, ardından bir başkası. Süpürgeci kadın taşın üstüne katlanmış bir battaniye seriyor, sanki üşümesin diye.", en: "The picks come down one at a time. Somebody grumbles and heads back to the line, then somebody else. The sweeper spreads a folded blanket over the stone, like she doesn't want it to catch cold." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Battaniyenin köşesini düzelt, kuyruğa dön", en: "Straighten a corner of the blanket and rejoin the line" }
            etkiler:
              - bayrak: "bl8_nabiz_dagildi"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_red"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Söze başlar başlamaz arkadan biri bağırıyor: \"Ganimeti kendine ayırıyor!\" Kahkahalar, ıslıklar... Kimse senin ne duyduğunu merak etmiyor; herkes ne bulacağını merak ediyor.", en: "You barely get started before somebody in back yells, \"Wants the loot for themselves!\" Laughter, whistles. Nobody cares what you heard. They care what they'll find." }
          - { tr: "Kazmalar taşa iniyor. Kıvılcımlar sıçrıyor, ama taşta tek bir çizik bile kalmıyor. Süpürgeci kadın süpürgesini göğsüne bastırıp duvara çekiliyor.", en: "The picks hit the stone. Sparks fly, and the stone doesn't take so much as a scratch. The sweeper hugs her broom to her chest and backs against the wall." }
        secenekler:
          - id: "izle"
            etiket: { tr: "Kollarını kavuştur; kendileri görsünler", en: "Cross your arms. Let them find out" }
            etkiler:
              - xp_seviye: 8
            sonraki: "bl8_kule_nabiz_kaz"

      - id: "bl8_kule_nabiz_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Uzun bir süre cevap gelmiyor. Sonra {npc:yanki} her zamankinden kısık bir sesle fısıldıyor:", en: "For a long time there's no answer. Then {npc:yanki}, quieter than usual:" }
          - { tr: "kimse değil. bir şey. adresi olan bir şey. senin adresini biliyor. benimkini de bilirdi, eskiden.", en: "not a who. a what. something with an address. it knows yours. it used to know mine." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; holün soğuk tarafına geç", en: "Get up. Move to the cold side of the hall" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_nobet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kuyruktan en ayık görünen iki avcıyı seçip taşın başına dikiyorsun. Dağılan kalabalık söylene söylene kapıya dönüyor; kazmalar yeniden kemerlere asılıyor.", en: "You pick the two most sober-looking hunters in line and post them by the stone. The crowd breaks up, griping, and drifts back toward the door. The picks go back on their belts." }
          - { tr: "Süpürgeci kadın nöbetçilere ince belli bardaklarda çay getiriyor. Sana da uzatıyor. \"Bu taş bir şey bekliyor evladım,\" diyor. \"Beklemeyi ben bilirim. Kocam on iki yıl hastanede yattı.\"", en: "The sweeper brings the sentries tea in little glasses and holds one out to you too. \"This stone's waiting on something, honey,\" she says. \"I know waiting. My husband was in the hospital twelve years.\"" }
        secenekler:
          - id: "yine"
            etiket: { tr: "\"Yine uğrarım,\" de; çayı bitir", en: "Say you'll come by again, and finish the tea" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "kuyruk"
            etiket: { tr: "Bardağı bırak, kuyruğu kapıya yeniden diz", en: "Set the glass down and get the line moving again" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_mert"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Bir saat geçmeden {npc:mert_kilic} taşın başında. Çantasını yere bırakıp taşın dört köşesine birer bakır tel yapıştırıyor. \"Söyleme,\" diyor sen ağzını açmadan. \"Biliyorum. Kristalle aynı aralık. Yüzde doksan dokuz.\"", en: "Inside an hour, {npc:mert_kilic} is crouched over the stone. He drops his bag and tapes copper leads to its four corners. \"Don't say it,\" he says before you can open your mouth. \"I know. Same interval as the crystal. Ninety-nine percent.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
          - { tr: "Taşın üstünde, kimsenin görmediği bir yerde, minicik bir kırmızı ışık yanıp sönmeye başlıyor. Artık biri bu nabzı kayda geçiriyor.", en: "On the stone, somewhere nobody will notice, a tiny red light starts to blink. Somebody's logging this pulse now." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kırmızı ışığın üstüne biraz toz serp", en: "Dust a little grit over the red light" }
            etkiler:
              - gizle: 1
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_kaz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kazmalar inip kalkıyor ama taş kırılmıyor. Derken her darbenin değdiği yerden ince, kapkara kıymıklar kopuyor; havada asılı kalıp dönmeye başlıyorlar.", en: "The picks rise and fall and the stone doesn't break. Then, wherever a blow lands, thin black splinters peel away, hang in the air and start to spin." }
          - { tr: "İlk kıymık en öndeki avcının yanağını açıyor. Kuyruk çığlıklar içinde geri çekilirken kıymıklar birbirine kenetlenip iki kat yüksekliğinde bir gövdeye dönüşüyor.", en: "The first splinter opens up the front hunter's cheek. The line scrambles back, screaming, while the splinters lock together into a body two stories tall." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kıymıkların önüne geç", en: "Step in front of the splinters" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - savas: { dusmanlar: ["kule_kirintisi@dunya", "kule_kirintisi@dunya"], ortam: ["tavan"], kazan: "bl8_kule_nabiz_zafer", kaybet: "bl8_kule_nabiz_yenilgi", kac: "bl8_kule_nabiz_kacis" }
          - id: "cek"
            etiket: { tr: "Yaralıyı kap, herkesi dışarı çıkar", en: "Grab the wounded hunter and get everyone out" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "bl8_kule_nabiz_kacis"

      - id: "bl8_kule_nabiz_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Son kıymık da yere düşüp tuz gibi dağılıyor. Kazmanın değdiği yere baktığında taş yeniden pürüzsüz; sanki kendi kendini onarmış.", en: "The last splinter hits the floor and scatters like salt. When you look where the picks struck, the stone is smooth again, like it fixed itself." }
          - { tr: "Elini bastırınca anlıyorsun: sıcaklık çekilmiş, daha derine inmiş. Kuyruk sessizce kapıya dönüyor. Bu sabah kimse ganimetten söz etmiyor.", en: "You press your palm to it and get it: the warmth has pulled back, gone deeper. The line drifts quietly back toward the door. Nobody mentions loot this morning." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yaralı avcının yanağına bak", en: "Check the hunter's cheek" }
            etkiler:
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kıymıklardan biri göğsüne saplanınca hol kararıyor. Gözünü açtığında süpürgeci kadın başını dizine almış, alnına ıslak bir mendil bastırıyor.", en: "One of the splinters punches into your chest and the hall goes dark. When you open your eyes, the sweeper has your head in her lap and a wet handkerchief pressed to your forehead." }
          - { tr: "\"Dağıldılar,\" diyor. \"Taş onları geri çağırdı, ben gördüm. Sen yatarken hepsi gidip yerine oturdu.\"", en: "\"They broke apart,\" she says. \"The stone called them back. I saw it. While you were down, they all went and settled back in.\"" }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "Kalk, taşı bir kez daha kazdır", en: "Get up and have them dig one more time" }
            etkiler:
              - can: 60
              - savas: { dusmanlar: ["kule_kirintisi@dunya", "kule_kirintisi@dunya"], ortam: ["tavan"], kazan: "bl8_kule_nabiz_zafer", kaybet: "bl8_kule_nabiz_yenilgi", kac: "bl8_kule_nabiz_kacis" }
          - id: "birak"
            etiket: { tr: "Mendili al, holden çık", en: "Take the handkerchief and leave the hall" }
            etkiler:
              - can: 20
            sonraki: "@akis"

      - id: "bl8_kule_nabiz_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Holü boşaltıyorsun. Kıymıklar bir süre boşlukta dönüp duruyor, sonra birer birer taşa geri yağıyor. İki avcının kolu sargıda, birinin yanağı dikiş bekliyor.", en: "You clear the hall. The splinters spin in the empty air for a while, then rain back into the stone one by one. Two hunters have their arms bandaged and one's cheek needs stitches." }
          - { tr: "Akşama doğru kuyruğa söylenti yayılıyor: Kule'nin dibinde kendini koruyan bir şey varmış. Kapıya yaklaşan avcıların sayısı azalıyor.", en: "By evening there's a rumor going down the line: something under the Spire protects itself. Fewer hunters come near the door." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Duvara yaslan, nefeslen", en: "Lean on the wall and catch your breath" }
            etkiler:
              - tehlike: { kule_dibi: 2 }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · Soğuyan taş (tohum: bl8_kule_nabiz)
  - id: "bl8_kule_tas_sogudu"
    konum: ["kule_dibi"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kesif", "kule", "sistem", "sir"]
    gerilim: 3
    kart: { tr: "Soğuyan taş", en: "The stone goes cold" }
    sahne: "bl8_kule_tas_sogudu_1"
    sahneler:
      - id: "bl8_kule_tas_sogudu_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Taş soğumuş. Holde kuyruk falan yok; herkes duvar diplerine çekilmiş, ortadaki çukura bakıyor.", en: "The stone has gone cold. There's no line in the hall. Everybody's pulled back against the walls, staring at the hole in the middle." }
          - metin: { tr: "Diktiğin nöbetçiler sabaha karşı uyuyakalmış. Uyandıklarında çukur kazılmıştı bile.", en: "The watch you posted dozed off toward dawn. By the time they woke up, the hole was already dug." }
            kosul: { bayrak: "bl8_nabiz_nobet" }
          - metin: { tr: "O gün kırılmayan taşı biri geceleyin yine denemiş; bu sefer bir yolunu bulmuş.", en: "Somebody went back at the stone that wouldn't break that day. This time they found a way." }
            kosul: { bayrak: "bl8_nabiz_kazildi" }
          - metin: { tr: "Taşın soğuduğu gece, senin merdivenden indiğin geceymiş. Süpürgeci kadın saatini bile biliyor: üç.", en: "The night the stone went cold was the night you went down the stairs. The sweeper even knows the hour: three." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - metin: { tr: "Süpürgeci kadın taşın dün gece birden soğuduğunu anlatıyor. Aşağıdaki şey sanki beklemekten vazgeçmiş.", en: "The sweeper says the stone went cold all at once last night, like whatever was down there got tired of waiting." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - { tr: "Çukurun dibinde toprak yok. Kırık taşın altından süt beyazı, pürüzsüz bir yüzey görünüyor; ışığı ne yutuyor ne geri veriyor. Kenarında, kazması dizinde, bir adam oturuyor. Kuyrukta ona Kepçe Necmi diyorlar.", en: "There's no dirt at the bottom of the hole. Under the broken stone is a smooth, milk-white surface that neither swallows the light nor gives it back. A man sits at the edge with a pick across his knees. The line calls him Scoop." }
          - { tr: "Necmi'nin başının üstünde sayı yok. Ne seviye kalmış ne ad; yalnızca boşluk. \"Dokundum,\" diyor, sesi çocuk sesi gibi. \"Tek satır yazdı: erişim reddedildi. Sonra neyim varsa gitti.\"", en: "There's no number over Scoop's head. No level, no name. Just blank. \"I touched it,\" he says, sounding like a little kid. \"It wrote one line: access denied. Then everything I had was gone.\"" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Necmi'nin sayısı silinmemiş, gizlenmiş. Boşluğun altında hâlâ soluk bir rakam titreşiyor.", en: "Scoop's number wasn't deleted. It's hidden. There's still a faint figure flickering under the blank." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "reddedildi. kibarca. sistem hep kibardır. sana ne yazacağını merak ediyorum.", en: "denied. politely. the system's always polite. i wonder what it would write for you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nabzı yerinde, gözbebekleri normal. Hasta değil bu adam. Silinmiş sanki.\"", en: "\"Pulse is fine. Pupils normal. He's not sick. It's like he's been... erased.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İşte merakın sonu. Ben olsam dokunmazdım. Yalan, dokunurdum.\"", en: "\"That's where curiosity gets you. I wouldn't have touched it. Okay, I would've.\"" }
        secenekler:
          - id: "muhur"
            etiket: { tr: "Çukuru molozla doldurt, üstüne beton döktür", en: "Have the hole filled with rubble and concrete poured over it" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "bl8_zemin_muhurlu"
              - tehlike: { kule_dibi: -3 }
            sonraki: "bl8_kule_tas_sogudu_muhur"
          - id: "necmi"
            etiket: { tr: "Necmi'nin yanına otur, sayısını geri çağır", en: "Sit with Scoop. Coax his number back" }
            gerekli: { stat: { wis: 40 } }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl8_necmi_dondu"
            sonraki: "bl8_kule_tas_sogudu_necmi"
          - id: "dokun"
            etiket: { tr: "Beyaz yüzeye kendin dokun", en: "Touch the white surface yourself" }
            etkiler:
              - dikkat: 4
              - bayrak: "bl8_zemin_dokunuldu"
            sonraki: "bl8_kule_tas_sogudu_dokun"
          - id: "ag"
            etiket: { tr: "Çukuru incelesin diye Sessiz Ağ'a bırak", en: "Leave the hole to the Quiet Network to study" }
            goster: { herhangi: [{ bayrak: "uye_sessiz_ag" }, { bayrak: "cekirdek_sessiz_ag" }, { bayrak: "bl8_nabiz_mert" }] }
            etkiler:
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 3, saygi: 2 } }
              - ahlak: { duzen: -1, insanlik: 1 }
              - bayrak: "bl8_zemin_ag"
            sonraki: "bl8_kule_tas_sogudu_ag"

      - id: "bl8_kule_tas_sogudu_muhur"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kuyruk bu kez itiraz etmiyor. Avcılar kazmaları kürekle değiştirip dışarıdan moloz taşıyor; beyaz yüzey çakılın altında kaybolunca holde herkes rahat bir nefes alıyor.", en: "This time the line doesn't argue. Hunters trade their picks for shovels and haul rubble in from outside, and when the white surface disappears under the gravel, the whole hall lets out a breath." }
          - metin: { tr: "Çimentoyu Lonca'nın el arabaları getiriyor. Teslim fişinde {npc:kaya_demir|in} imzası var, altına bir not düşülmüş: \"Kapatın ve unutun.\"", en: "The cement comes in on Guild wheelbarrows. The delivery slip has {npc:kaya_demir|pos} signature and a note under it: \"Seal it and forget it.\"" }
            kosul: { bayrak: "cekirdek_lonca" }
          - { tr: "Beton kururken süpürgeci kadın süpürgesini yaş yüzeyin üstüne yatırıp iz bırakıyor. \"Ben bilirim nerede olduğunu,\" diyor. \"Biri bir gün sorarsa.\"", en: "While the concrete sets, the sweeper lays her broom across the wet surface and leaves a mark. \"So I'll know where it is,\" she says. \"In case somebody asks someday.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Süpürgenin bıraktığı ize bak", en: "Look at the mark the broom left" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "kuyruk"
            etiket: { tr: "Kuyruğu yeniden aç", en: "Open the line back up" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_tas_sogudu_necmi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Necmi'nin yanına oturup ona sorular soruyorsun: ilk kestiği canavarı, ilk seviye atladığında ne hissettiğini, annesinin adını. Cevap verdikçe başının üstündeki boşluk bulanıklaşıyor.", en: "You sit down next to Scoop and ask him things. The first monster he killed. What it felt like the first time he leveled. His mother's name. Every time he answers, the blank over his head gets a little blurrier." }
          - { tr: "Bir saat sonra sayı geri geliyor, ama bir eksiğiyle. Necmi rakama uzun uzun bakıyor. \"Bir tanesini almış,\" diyor. \"Fiyatı buymuş demek.\"", en: "An hour later the number comes back, one short. Scoop stares at it for a long time. \"It kept one,\" he says. \"Guess that was the price.\"" }
          - { tr: "Kazmasını çukurun kenarına bırakıp kalkıyor. \"Ben bu işi bırakıyorum,\" diyor. \"Balığa çıkarım. Balık kimseye satır yazmaz.\"", en: "He leaves his pick at the edge of the hole and stands up. \"I'm done with this,\" he says. \"I'll go fishing. Fish don't write anybody lines.\"" }
        secenekler:
          - id: "ugurla"
            etiket: { tr: "Elini sık, yolcu et", en: "Shake his hand and see him off" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "kazma"
            etiket: { tr: "Bıraktığı kazmayı al", en: "Pick up the pick he left" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_tas_sogudu_dokun"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Parmak uçların değer değmez yüzey ısınıyor; yalnız sana ısınıyor. Hol buz kesmiş, avuç içinde ise yaz öğleden sonrası.", en: "The second your fingertips touch it, the surface warms. For you, and only you. The hall is freezing, and in your palm it's a summer afternoon." }
          - { tr: "Pencerende tek satır beliriyor: [İKİNCİ GİRİŞ · KAPALI · YÖNETİCİ ADAYI TANINDI]. Arkanda kuyruğun nefesi kesilmiş. Herkes yüzeyin senin elinin altında parladığını görmüş.", en: "A single line shows up in your window: [SECONDARY ENTRY · CLOSED · ADMIN CANDIDATE RECOGNIZED]. Behind you, the line has stopped breathing. Every one of them saw the surface glow under your hand." }
          - metin: { tr: "\"Yalnız sana açılıyor,\" diye fısıldıyor biri. Fısıltı ağızdan ağıza geçiyor; akşama {yer:kiyikent} bunu konuşacak.", en: "\"It opens for you,\" somebody whispers. The whisper goes mouth to mouth. By tonight {yer:kiyikent} will be talking about it." }
            kosul: { bayrak_yok: "yanki_susturuldu" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ikinci giriş. demek bir tane daha var. not al. ben aldım.", en: "secondary entry. so there's another one. make a note. i did." }
        secenekler:
          - id: "cek"
            etiket: { tr: "Elini çek, kimseye bakmadan çık", en: "Pull your hand back and leave without looking at anyone" }
            etkiler:
              - gizle: 2
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "soyle"
            etiket: { tr: "Kalabalığa dön: \"Beni tanıyor. Kimse dokunmasın.\"", en: "Turn to the crowd. \"It knows me. Nobody touch it.\"" }
            etkiler:
              - dikkat: 2
              - itibar: { yukselenler: 2 }
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_tas_sogudu_ag"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sessiz Ağ'ın adamları gece yarısı, ellerinde portatif lambalar ve rulo rulo kabloyla geliyor. Çukurun etrafına bez gerip hol kapısına \"inşaat\" yazılı bir tahta asıyorlar.", en: "The Quiet Network's people show up at midnight with work lights and coils of cable. They hang a tarp around the hole and nail a sign to the hall door: CONSTRUCTION." }
          - metin: { tr: "{npc:mert_kilic} bezin altından başını çıkarıp sana bakıyor; gözlerinin altı mosmor, ama yıllardır bu kadar mutlu görünmemiş. \"Bu bir bağlantı noktası,\" diyor. \"Çekirdekle aynı ağda. Teşekkür ederim. Gerçekten.\"", en: "{npc:mert_kilic} pokes his head out from under the tarp. The bags under his eyes are purple, and he hasn't looked this happy in years. \"It's a node,\" he says. \"Same network as the Core. Thank you. Seriously.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bezin kenarını indir, gölgede kal", en: "Drop the tarp's edge and stay in the shadows" }
            etkiler:
              - gizle: 1
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · Değer sütunu (havuz)
  - id: "bl8_kule_deger_sutunu"
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "kule", "sistem", "siralama"]
    gerilim: 2
    kart: { tr: "Değer sütunu", en: "The value column" }
    sahne: "bl8_kule_deger_sutunu_1"
    sahneler:
      - id: "bl8_kule_deger_sutunu_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule kapısının yanındaki katlanır masada belediyenin eski nüfus kâtibi Hayri oturuyor. Kule açıldığından beri içeri giren herkesi deftere işliyor: ad, seviye, saat. Kimse ondan istememiş, o da kimseye sormamış.", en: "At the folding table beside the Spire's door sits Harv, who used to be the county clerk. Since the Spire opened, he's logged everybody who goes in: name, level, time. Nobody asked him to. He didn't ask anybody." }
          - { tr: "Bu hafta deftere bir sütun eklemiş. Çekirdek yanıp sönmeye başladığından beri Hayri'nin Analiz yeteneği her adın yanında bir yüzde gösteriyormuş. Ne anlama geldiğini bilen yok, ama en yüksek yirmisi kapının yanındaki kara tahtaya tebeşirle yazılmış.", en: "This week he added a column. Ever since the Core started pulsing, Harv's Analyze skill shows a percentage next to every name. Nobody knows what it means, but the top twenty are chalked up on the blackboard by the door." }
          - { tr: "Tahtanın önü mahşer yeri. Yüzdesi yüksek olanları partiler kapışıyor, düşükleri sıradan çıkarıp evlerine yolluyorlar. Kuyrukta bir yüzde on ikiden söz ediliyor; on yedi yaşında bir kız. Hiçbir parti almamış onu.", en: "The board's mobbed. Parties are snapping up the high numbers and pulling the low ones out of line and sending them home. People in line keep mentioning a twelve percent. A seventeen-year-old girl. No party would take her." }
          - { tr: "Tahtanın kenarına beyaz şallı biri tek bir kelime eklemiş, harfleri özenle yuvarlatarak: OLGUNLAR.", en: "Someone in a white shawl has added one word down the side of the board, the letters carefully rounded: THE RIPE." }
          - metin: { tr: "Listenin en üstünde, yüzde doksan birle {npc:aras_kurt} var. Kendisi de tahtanın dibinde, kollarını kavuşturmuş okuyor; karne günü gelmiş de takdir almış gibi keyfi yerinde.", en: "Top of the list, ninety-one percent: {npc:aras_kurt}. He's right there under the board with his arms crossed, reading it like it's report card day and he got straight A's." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Sütunun ne olduğunu biliyorsun. Merdivenin dibindeki satırda aynı kelimeler geçiyordu: beklenen verim.", en: "You know what that column is. The line at the bottom of the stairs used the same words: projected yield." }
            kosul: { bayrak: "gercek_hasat" }
        sezgiler:
          - kosul: { stat: { int: 45 } }
            metin: { tr: "Yüzdeler seviyeyle artmıyor. Seviyesi düşük olup yüzdesi yüksek olanlar var; hepsinin ortak yanı son haftalarda çok hızlı büyümüş olmaları.", en: "The percentages don't track level. There are low levels with high numbers. What they share is that they've all grown fast in the last few weeks." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yüzde. bir bütünün parçası demek. kimin bütünü, onu sor.", en: "percent. it means a piece of a whole. ask whose whole." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Beden dersinde boy sırasına dizilmek gibi. Ben hep en arkadaydım.\"", en: "\"It's like lining up by height in gym class. I was always in the back.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir ölçüt ortaya atarsın, insanlar ona göre davranmaya başlar. Ölçüm ölçüleni bozar. Ders kitabı bilgisi.\"", en: "\"You publish a metric and people start optimizing for it. The measurement breaks the thing it measures. Textbook.\"" }
        secenekler:
          - id: "oku"
            etiket: { tr: "Hayri'ye kendi yüzdeni okut", en: "Have Harv read your percentage" }
            etkiler:
              - dikkat: 2
              - tohum: { olay: "bl8_kule_yuzde_on_iki", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule kapısındaki tahtadan beri kuyrukta herkes birbirinin yüzdesini soruyor; yüzde on ikilik kızın adı hâlâ dillerde.", en: "Since the board went up at the Spire door, everyone in line asks everyone else their percentage. The twelve-percent girl's name is still going around." } }
            sonraki: "bl8_kule_deger_sutunu_oku"
          - id: "sil"
            etiket: { tr: "Tahtayı sil, defterden sütunu yırt", en: "Wipe the board. Tear the column out of the ledger" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - bayrak: "bl8_sutun_silindi"
              - tohum: { olay: "bl8_kule_yuzde_on_iki", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule kapısındaki tahtadan beri kuyrukta herkes birbirinin yüzdesini soruyor; yüzde on ikilik kızın adı hâlâ dillerde.", en: "Since the board went up at the Spire door, everyone in line asks everyone else their percentage. The twelve-percent girl's name is still going around." } }
            sonraki: "bl8_kule_deger_sutunu_sil"
          - id: "coz"
            etiket: { tr: "Sütunun neyi ölçtüğünü çöz", en: "Work out what the column measures" }
            gerekli: { stat: { int: 45 } }
            etkiler:
              - bayrak: "bl8_sutun_cozuldu"
              - tohum: { olay: "bl8_kule_yuzde_on_iki", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule kapısındaki tahtadan beri kuyrukta herkes birbirinin yüzdesini soruyor; yüzde on ikilik kızın adı hâlâ dillerde.", en: "Since the board went up at the Spire door, everyone in line asks everyone else their percentage. The twelve-percent girl's name is still going around." } }
            sonraki: "bl8_kule_deger_sutunu_coz"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} takıl: \"Doksan bir mi? Kime göre?\"", en: "Needle {npc:aras_kurt}: \"Ninety-one? Says who?\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3 } }
              - tohum: { olay: "bl8_kule_yuzde_on_iki", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Kule kapısındaki tahtadan beri kuyrukta herkes birbirinin yüzdesini soruyor; yüzde on ikilik kızın adı hâlâ dillerde.", en: "Since the board went up at the Spire door, everyone in line asks everyone else their percentage. The twelve-percent girl's name is still going around." } }
            sonraki: "bl8_kule_deger_sutunu_aras"
          - id: "gec"
            etiket: { tr: "Tahtaya bakma, kuyruğa gir", en: "Don't look at the board. Get in line" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl8_kule_deger_sutunu_oku"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hayri gözlüklerini burnunun ucuna indirip sana uzun uzun bakıyor; sonra kalemi deftere değdirip öylece bekliyor. Mürekkep kâğıtta yayılıp koca bir leke olmuş.", en: "Harv slides his glasses down his nose and looks at you. He keeps looking. Then he sets his pen to the ledger and just holds it there. The ink spreads into a big blot." }
          - { tr: "\"Hesaplanamıyor,\" diyor sonunda. \"Yetenek bana öyle diyor. Otuz yıl nüfus kâğıdı doldurdum, ilk defa bir insanı yazamıyorum.\"", en: "\"Incalculable,\" he finally says. \"That's what the skill tells me. Thirty years filling out birth certificates and this is the first time I can't write a person down.\"" }
          - { tr: "Arkadan biri duymuş. \"Hesaplanamıyor\" sözü kuyruğun sonuna kadar gidip geri dönüyor; döndüğünde hiçbir yüzdenin taşıyamayacağı kadar ağırlaşmış.", en: "Somebody behind you heard. \"Incalculable\" travels to the end of the line and back, and by the time it comes back it weighs more than any percentage could." }
          - metin: { tr: "Gerçek sayınla görünen sayın arasındaki fark, Hayri'nin yeteneğinin bile kaldıramayacağı kadar büyük.", en: "The gap between your real number and the one people see is too big for even Harv's skill to handle." }
            kosul: { gizli_fark_min: 1 }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gülüp geç: \"Yetenekte arıza var herhalde.\"", en: "Laugh it off. \"Guess your skill's on the fritz.\"" }
            etkiler:
              - gizle: 2
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sifir"
            etiket: { tr: "\"Sıfır yaz. Kimse sormasın.\"", en: "\"Write zero. So nobody asks.\"" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: -1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_deger_sutunu_sil"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Islak bezi tahtada gezdirdikçe yüzdeler gri bir buluta dönüşüyor. Hayri seni durdurmuyor; defteri kendisi açıp sütunun olduğu sayfayı uzatıyor. \"Ben yalnızca gördüğümü yazarım,\" diyor. \"Yırtacaksan düzgün yırt.\"", en: "As you drag the wet rag across the board, the percentages smear into a gray cloud. Harv doesn't stop you. He opens the ledger himself and holds out the page with the column. \"I just write what I see,\" he says. \"If you're going to tear it, do it clean.\"" }
          - { tr: "Yüzdesi yüksek bir avcı sana sövüp uzaklaşıyor. Kuyruğun sonundaki gençler ise alkışlıyor; ürkek bir alkış bu, ama alkış.", en: "A hunter with a high number swears at you and storms off. The kids at the back of the line clap. It's a nervous kind of clapping, but it's clapping." }
          - { tr: "Yine de herkes biliyor: sayılar silinmedi, yalnızca artık kimse yazmıyor. Tahtadakileri kuyruğun yarısı çoktan ezberledi.", en: "Still, everybody knows the numbers aren't gone. Nobody's writing them down anymore, that's all. Half the line has already memorized the board." }
        secenekler:
          - id: "kagit"
            etiket: { tr: "Yırttığın sayfayı katlayıp cebine koy", en: "Fold the torn page into your pocket" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "yak"
            etiket: { tr: "Sayfayı Hayri'nin gözü önünde yak", en: "Burn the page right in front of Harv" }
            etkiler:
              - ahlak: { duzen: -1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_deger_sutunu_coz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hayri'nin defterini baştan sona karıştırıp yüzdeleri seviyelerin yanına koyuyorsun, sonra son iki haftanın kayıtlarıyla karşılaştırıyorsun. Örüntü sana göz kırpıyor: ölçülen şey güç değil, büyümenin hızı.", en: "You flip through Harv's ledger front to back, lining the percentages up against the levels, then against the last two weeks of entries. The pattern winks at you. It isn't measuring power. It's measuring how fast you grow." }
          - { tr: "Tarlada hangi başak en hızlı boy atıyorsa en yüksek sayı onun. Bu sütunun sahibi kimse, kimin güçlü olduğuyla ilgilenmiyor; kimin ne zaman olgunlaşacağıyla ilgileniyor.", en: "Whichever stalk in the field shoots up fastest gets the highest number. Whoever owns this column doesn't care who's strong. It cares who'll be ripe, and when." }
          - metin: { tr: "Artık tahmin etmiyorsun, biliyorsun. Merdivenin dibinde okuduğun satır da aynı dili konuşuyordu.", en: "You're not guessing anymore. You know. The line at the bottom of the stairs spoke the same language." }
            kosul: { bayrak: "gercek_hasat" }
        secenekler:
          - id: "durdur"
            etiket: { tr: "Hayri'ye tahtaya yazmayı bırakmasını söyle", en: "Tell Harv to stop putting it on the board" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - bayrak: "bl8_hayri_durdu"
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 12
            sonraki: "bl8_kule_deger_sutunu_durdu"
          - id: "sakla"
            etiket: { tr: "Çözdüğünü kendine sakla", en: "Keep what you worked out to yourself" }
            etkiler:
              - gizle: 2
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_deger_sutunu_durdu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Hayri dinliyor, sonra tebeşiri masanın çekmecesine kaldırıyor. \"Ben bu sayıları insanlar birbirini bulsun diye yazıyordum,\" diyor. \"Biri birilerini ayıklasın diye değil.\"", en: "Harv listens, then puts the chalk away in the table drawer. \"I was writing those numbers so people could find each other,\" he says. \"Not so somebody could sort them.\"" }
          - { tr: "Tahta öğleden sonra boş kalıyor. Partiler eskisi gibi kurulmaya başlıyor: arkadaş, akraba, aynı sokaktan komşu.", en: "The board stays blank that afternoon. Parties go back to forming the old way: friends, cousins, people from the same street." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Hayri'nin omzuna dokun", en: "Touch Harv's shoulder" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl8_kule_deger_sutunu_aras"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:aras_kurt} başını çevirmeden sırıtıyor. \"Kime göre olacak, Sistem'e göre,\" diyor. \"Hayri yalnızca kâtibi. Asıl soru şu: seninki kaç?\"", en: "{npc:aras_kurt} grins without turning his head. \"Says who? The System,\" he says. \"Harv's just the clerk. Real question is, what's yours?\"" }
          - { tr: "Tahtaya bir adım yaklaşıp adının yanındaki doksan biri başparmağıyla siliyor, yerine bir soru işareti çiziyor. \"Seninkini öğrenene kadar,\" diyor, \"benimki geçici.\"", en: "He steps up to the board, wipes the ninety-one next to his name with his thumb, and draws a question mark in its place. \"Until I find out yours,\" he says, \"mine's provisional.\"" }
        secenekler:
          - id: "soyle"
            etiket: { tr: "\"Hayri hesaplayamadı. Sen de hesaplayamazsın.\"", en: "\"Harv couldn't work it out. Neither can you.\"" }
            etkiler:
              - dikkat: 2
              - iliski: { aras_kurt: { saygi: 2, guven: -1 } }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "omuz"
            etiket: { tr: "Omuz silk: \"Ben tahtaya bakmam.\"", en: "Shrug. \"I don't read boards.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 1 } }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · Yüzde on iki (tohum: bl8_kule_deger_sutunu)
  - id: "bl8_kule_yuzde_on_iki"
    konum: ["kule_dibi"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kesif", "kule", "siralama"]
    gerilim: 2
    kart: { tr: "Yüzde on iki", en: "Twelve percent" }
    sahne: "bl8_kule_yuzde_on_iki_1"
    sahneler:
      - id: "bl8_kule_yuzde_on_iki_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sabahın köründe Kule kapısından topallayarak bir kız çıkıyor. On yedisinde ya var ya yok; sırtında kendinden büyük bir çanta, bacağındaki sargı kandan kapkara olmuş. Kuyruk onu hemen tanıyor: yüzde on iki.", en: "At the crack of dawn, a girl limps out of the Spire's door. Seventeen, maybe. A pack on her back bigger than she is, the bandage on her leg soaked black. The line knows her right away: twelve percent." }
          - { tr: "Adı Sıla. Doğruca Hayri'nin masasına gidip defteri kendi eliyle çeviriyor. \"Yaz,\" diyor. \"Üçüncü kata tek başıma çıktım. Bak bakalım şimdi kaçım.\"", en: "Her name's Sadie. She goes straight to Harv's table and turns the ledger around herself. \"Write it down,\" she says. \"I went to the third floor alone. Go on, check what I am now.\"" }
          - { tr: "Hayri gözlüklerini takıp bakıyor, bir süre susuyor. \"On dokuz.\" Sıla gülmeye başlıyor; gülerken dizlerinin bağı çözülüyor, olduğu yere çöküveriyor.", en: "Harv puts his glasses on, looks, and doesn't say anything for a second. \"Nineteen.\" Sadie starts laughing, and while she's laughing her knees give out and she sits down hard right where she is." }
          - metin: { tr: "Tahta hâlâ boş; sildiğin yere kimse yeni bir şey yazmamış. Ama Sıla'nın sayısını herkes ezbere biliyor.", en: "The board's still blank. Nobody's written anything where you wiped it. But everybody knows Sadie's number by heart." }
            kosul: { bayrak: "bl8_sutun_silindi" }
          - metin: { tr: "Neyi ölçtüğünü biliyorsun: büyümeyi. Sıla bir gecede yedi puan atlamış, tahtadaki herkesten hızlı.", en: "You know what it measures: growth. Sadie jumped seven points overnight. Faster than anyone on the board." }
            kosul: { bayrak: "bl8_sutun_cozuldu" }
          - metin: { tr: "Aklına merdivenin dibindeki satır geliyor. Sıla'nın sayısı her yükseldiğinde birileri için biraz daha değerli oluyor.", en: "You think of the line at the bottom of the stairs. Every point Sadie climbs makes her worth a little more to someone." }
            kosul: { bayrak: "gercek_hasat" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Sargının altındaki yara bir kat bekçisinin pençesinden: üç paralel çizgi. Kıl payı kurtulmuş.", en: "The wound under the bandage is from a floor warden's claws. Three parallel lines. She got away by a hair." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "on dokuz. kız mutlu. ben olsam o sayıdan korkardım.", en: "nineteen. she's happy. i'd be scared of that number." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu inadı tanıyorum. Her sabah aynada görüyorum.\"", en: "\"I know that kind of stubborn. I see it in the mirror every morning.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O bacak dikiş ister. Şimdi, burada.\"", en: "\"That leg needs stitches. Now. Right here.\"" }
        secenekler:
          - id: "sar"
            etiket: { tr: "Önce bacağını sar, sonra konuşursunuz", en: "Wrap her leg first. Talk after" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "bl8_kule_yuzde_on_iki_sar"
          - id: "cik"
            etiket: { tr: "Onu yanına al, dördüncü kata birlikte çık", en: "Take her with you up to the fourth floor" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
            sonraki: "bl8_kule_yuzde_on_iki_cik"
          - id: "gercek"
            etiket: { tr: "\"O sayının yükselmesi iyi bir şey değil, Sıla.\"", en: "\"That number going up isn't a good thing, Sadie.\"" }
            goster: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "bl8_sutun_cozuldu" }] }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl8_kule_yuzde_on_iki_gercek"
          - id: "kaya"
            etiket: { tr: "Onu {npc:kaya_demir|in} talimgâhına yolla", en: "Send her to {npc:kaya_demir|pos} training yard" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "bl8_sila_lonca"
            sonraki: "bl8_kule_yuzde_on_iki_lonca"

      - id: "bl8_kule_yuzde_on_iki_sar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sargıyı çözüp yarayı temizlerken Sıla dişlerini sıkıyor, ama konuşmayı bırakmıyor. Annesiyle babası Entegrasyon gününde kaybolmuş. {yer:kiyikent_liman|de} dokuz yaşında bir kardeşi varmış; Lonca tayın fişlerini de seviyeye göre dağıtıyormuş.", en: "While you unwrap the bandage and clean the wound, Sadie grits her teeth and keeps talking. Her parents vanished on Integration Day. She has a nine-year-old brother down at {yer:kiyikent_liman}, and the Guild hands out ration chits by level." }
          - { tr: "\"On iki dediler,\" diyor. \"Parti almaz dediler. Bir gecede on dokuz oldum. Haftaya otuz olurum, o zaman görürüz kim kimi almıyormuş.\"", en: "\"They said twelve,\" she says. \"Said no party would take me. I made nineteen in one night. Next week I'll be thirty, and then we'll see who won't take who.\"" }
        secenekler:
          - id: "harita"
            etiket: { tr: "Dördüncü katın krokisini çizip ona ver", en: "Sketch her a map of the fourth floor" }
            etkiler:
              - bayrak: "bl8_sila_harita"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "yalniz"
            etiket: { tr: "\"Bir daha tek başına çıkma. Söz ver.\"", en: "\"Don't go up alone again. Promise me.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_yuzde_on_iki_cik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sıla sargısını sıkılaştırıp ayağa kalkıyor. Merdivende bir adım arkandan geliyor; kısa mızrağını ters tutuyor, ama sen tutuşunu düzeltince sesini çıkarmıyor.", en: "Sadie cinches her bandage and gets up. On the stairs she stays one step behind you. She's holding her short spear backwards, and when you fix her grip, she doesn't say a word." }
          - { tr: "Dördüncü katın girişinde, Sıla'nın bacağını açan şey bekliyor. Bekçi seni değil, onu tanıyor; başını eğip pençelerini taşa sürtüyor.", en: "At the entrance to the fourth floor, the thing that opened Sadie's leg is waiting. The warden doesn't recognize you. It recognizes her. It lowers its head and drags its claws across the stone." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Sıla'yı arkana al, bekçinin üstüne yürü", en: "Put Sadie behind you and go at the warden" }
            etkiler:
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan", "dar_gecit"], kazan: "bl8_kule_yuzde_on_iki_zafer", kaybet: "bl8_kule_yuzde_on_iki_yenilgi", kac: "bl8_kule_yuzde_on_iki_kacis" }
          - id: "don"
            etiket: { tr: "\"Bugün değil.\" Kolundan tutup aşağı indir", en: "\"Not today.\" Take her by the arm and head back down" }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "bl8_kule_yuzde_on_iki_kacis"

      - id: "bl8_kule_yuzde_on_iki_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçi dizlerinin üstüne çöktüğünde son darbeyi sen vurmuyorsun. Sıla mızrağını düzeltip boynuna saplıyor, sonra mızrağı bırakıp ellerine bakakalıyor.", en: "When the warden drops to its knees, you're not the one who lands the last blow. Sadie fixes her grip and drives the spear into its neck, then lets go and stares at her hands." }
          - { tr: "Aşağıda Hayri onu yeniden okuyor. \"Yirmi altı,\" diyor. Bu kez Sıla gülmüyor; çantasını omzuna alıp kardeşine ekmek götürmek için {yer:kiyikent_liman} yoluna düşüyor.", en: "Back downstairs, Harv reads her again. \"Twenty-six,\" he says. This time Sadie doesn't laugh. She shoulders her pack and heads for {yer:kiyikent_liman} to bring her brother some bread." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Arkasından bak, bir şey deme", en: "Watch her go. Don't say anything" }
            etkiler:
              - bayrak: "bl8_sila_kurtuldu"
              - tehlike: { kule_dibi: -2 }
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl8_kule_yuzde_on_iki_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin pençesi seni duvara yapıştırınca dünya kararıyor. Kendine geldiğinde Sıla seni merdivenden aşağı sürüklüyor, her basamakta bir küfür savurarak.", en: "The warden's claw slams you into the wall and everything goes black. When you come to, Sadie is dragging you down the stairs, cursing on every step." }
          - { tr: "\"Bak sen,\" diyor soluk soluğa. \"Ben de seni taşıyabiliyormuşum. Bunu bir yere yaz.\"", en: "\"Look at that,\" she pants. \"Turns out I can carry you too. Write that down somewhere.\"" }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "Doğrul, dördüncü kata yeniden çık", en: "Get up and go back to the fourth floor" }
            etkiler:
              - can: 60
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["tavan", "dar_gecit"], kazan: "bl8_kule_yuzde_on_iki_zafer", kaybet: "bl8_kule_yuzde_on_iki_yenilgi", kac: "bl8_kule_yuzde_on_iki_kacis" }
          - id: "birak"
            etiket: { tr: "Bugünlük bu kadar; aşağıda dinlen", en: "That's enough for today. Rest downstairs" }
            etkiler:
              - can: 20
              - bayrak: "bl8_sila_tasidi"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_yuzde_on_iki_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Merdivenden inerken Sıla dönüp dönüp yukarı bakıyor. \"Yarın yine gelirim,\" diyor; sana mı söylüyor kendine mi, belli değil.", en: "On the way down, Sadie keeps looking back up the stairs. \"I'll be back tomorrow,\" she says. Whether to you or to herself, it's hard to tell." }
          - { tr: "Kapıda Hayri onu okuyup başını sallıyor: sayı yerinde. Kuyruktan biri ona yer açıyor, ilk defa.", en: "At the door, Harv reads her and nods. The number holds. Someone in line makes room for her, for the first time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kuyrukta onun yanında dur", en: "Stand next to her in line" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_yuzde_on_iki_gercek"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sıla yüzünü buruşturuyor. \"Ne yani, büyümeyelim mi? Kardeşim aç yatsın, ben de yüzde on ikide kalayım, öyle mi?\"", en: "Sadie screws up her face. \"So what, we just don't grow? My brother goes to bed hungry and I stay at twelve percent? That's the plan?\"" }
          - { tr: "Bu sorunun cevabı sende yok. Tarlayı anlatıyorsun, başakları; o da bacağındaki sargıya bakarak dinliyor. Sen susunca o da uzun süre susuyor.", en: "You don't have an answer for that. You tell her about the field, the stalks. She looks at the bandage on her leg and listens. When you stop, she's quiet for a long time." }
          - { tr: "\"Yine de çıkacağım,\" diyor sonunda. \"Ama artık kimin için büyüdüğümü biliyorum. Bilmek de bir şeydir.\"", en: "\"I'm still going up,\" she says at last. \"But now I know who I'm growing for. That counts for something.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bilmek de bir şeydir.\" Başını salla", en: "\"It counts.\" Nod" }
            etkiler:
              - bayrak: "bl8_sila_biliyor"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_yuzde_on_iki_lonca"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kâğıda kısa bir not karalayıp Sıla'ya veriyorsun; talimgâhın kapısındaki nöbetçiye gösterecek. \"Lonca seviyeye bakmıyor mu?\" diye soruyor.", en: "You scribble a short note and hand it to Sadie. She's supposed to show it to the sentry at the training yard gate. \"Doesn't the Guild go by level?\" she asks." }
          - { tr: "\"Bakar,\" diyorsun. \"Ama kimin çabuk büyüdüğüne daha çok bakar.\" Sıla notu göğüs cebine sokup topallaya topallaya {yer:sanayi} yoluna koyuluyor.", en: "\"It does,\" you tell her. \"But it cares more about who grows fast.\" Sadie tucks the note into her breast pocket and limps off toward {yer:sanayi}." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kuyruğa dön", en: "Go back to the line" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== SANAYİ · Gişe (havuz)
  - id: "bl8_sanayi_gise"
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "lonca", "kule", "hakimiyet"]
    gerilim: 2
    kart: { tr: "Kule'ye gişe", en: "A toll gate for the Spire" }
    sahne: "bl8_sanayi_gise_1"
    sahneler:
      - id: "bl8_sanayi_gise_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin en büyük salonunda kızıl demirden bir turnike dövülüyor: dört kollu, insan boyunda, her kolunda Lonca'nın halkası kabartma. Yanında yarım kalmış bir parmaklık duruyor.", en: "In the rolling mill's biggest hall, they're forging a turnstile out of red-hot iron. Four arms, as tall as a man, the Guild's ring raised on every one. Next to it stands a half-finished iron grate." }
          - { tr: "Levazımcı Şükran elindeki listeyi sana uzatıyor. \"Kule kapısına,\" diyor. \"Çekirdek yanıp sönmeye başlayalı herkes sayısını büyütmek için içeri dalıyor. Bu ay kırk bir kişi dönmedi. Otuzuncu seviyenin altı girmeyecek; giren de kapıya bir çekirdek bırakacak.\"", en: "Quartermaster Shirley hands you her list. \"For the Spire door,\" she says. \"Ever since the Core started blinking, everybody's diving in to pump their numbers. Forty-one didn't come back this month. Nobody under level thirty gets in, and anybody who does leaves a core at the gate.\"" }
          - { tr: "Örslerin başındaki işçilerin çoğu dişini sıkarak çalışıyor. İçlerinden birinin oğlu geçen hafta Kule'ye girmiş, dönmemiş; yirmi iki seviyedeymiş. Çekici en sert inen de o.", en: "Most of the crew at the anvils are working with their jaws clenched. One of them has a son who went into the Spire last week and never came out. Level twenty-two. His hammer comes down hardest of all." }
          - metin: { tr: "Çekirdek Lonca'ya geçtiğinden beri {npc:kaya_demir} şehrin her kapısını kendi kapısı sayıyor. Kule'ninki de buna dahil.", en: "Since the Core went to the Guild, {npc:kaya_demir} treats every door in the city like it's his. The Spire's included." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Şükran listeyi uzatırken gözünü halkana dikiyor: \"İmzan lazım. Sen de Lonca'dansın.\"", en: "Shirley's eyes go to your ring as she hands it over. \"I need your signature. You're Guild too.\"" }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Kırk bir adın arasında tanıdık birini arıyorsun. Kule kapısındaki tahtada yüzdesi yüksek yazılmış iki avcı da listede.", en: "You scan the forty-one names for anyone you know. Two hunters who had high numbers on the board at the Spire door are on the list." }
            kosul: { herhangi: [{ bayrak: "bl8_sutun_silindi" }, { bayrak: "bl8_sutun_cozuldu" }, { bayrak: "bl8_hayri_durdu" }] }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Parmaklığın kilidi dışarıdan değil, içeriden açılıyor. Kule'den çıkmak isteyen de Lonca'dan izin alacak.", en: "The grate's lock opens from the inside, not the outside. Anyone trying to get out of the Spire will need the Guild's say-so too." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kapının önüne kapı. sistem de böyle başladı. önce herkesin iyiliği için.", en: "a door in front of a door. that's how the system started too. for everyone's good, at first." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Turnike sayım demek. Sayım kayıt demek. Kayıt kimin elindeyse ona bak.\"", en: "\"A turnstile means a count. A count means a record. Watch who holds the record.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Kırk bir kişi. Bunu Konsey'e de söylediler mi acaba?\"", en: "\"Forty-one people. Did anybody think to tell the Council?\"" }
        secenekler:
          - id: "kota"
            etiket: { tr: "Seviyesi düşükler için haftada bir serbest gün iste", en: "Ask for one free day a week for low levels" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "bl8_sanayi_gise_red", basarisiz_etkiler: [{ tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki turnike bitti; Lonca'nın el arabaları dün gece onu {yer:kule_dibi|e} taşıdı.", en: "The turnstile from the rolling mill is done. Last night Guild wagons hauled it over to {yer:kule_dibi}." } } }] }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { lonca: 1 }
              - bayrak: "bl8_gise_kota"
              - tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki turnike bitti; Lonca'nın el arabaları dün gece onu {yer:kule_dibi|e} taşıdı.", en: "The turnstile from the rolling mill is done. Last night Guild wagons hauled it over to {yer:kule_dibi}." } }
            sonraki: "bl8_sanayi_gise_kota"
          - id: "imza"
            etiket: { tr: "Listeyi imzala; kırk bir kişi az değil", en: "Sign the list. Forty-one people is a lot" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - itibar: { lonca: 3 }
              - bayrak: "bl8_gise_imza"
              - tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki turnike bitti; Lonca'nın el arabaları dün gece onu {yer:kule_dibi|e} taşıdı.", en: "The turnstile from the rolling mill is done. Last night Guild wagons hauled it over to {yer:kule_dibi}." } }
            sonraki: "bl8_sanayi_gise_imza"
          - id: "boz"
            tur: "gizle"
            etiket: { tr: "Gece döküm kalıbına gizlice su kaçır", en: "Sneak water into the casting mold tonight" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -3 }
              - bayrak: "bl8_gise_bozuldu"
              - tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki döküm çatladı; Lonca turnike yerine {yer:kule_dibi|e} zincir götürdü.", en: "The casting at the rolling mill cracked. The Guild hauled a chain over to {yer:kule_dibi} instead." } }
            sonraki: "bl8_sanayi_gise_boz"
          - id: "isci"
            etiket: { tr: "Oğlunu kaybeden işçiyle konuş", en: "Talk to the worker who lost his son" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki turnike bitti; Lonca'nın el arabaları dün gece onu {yer:kule_dibi|e} taşıdı.", en: "The turnstile from the rolling mill is done. Last night Guild wagons hauled it over to {yer:kule_dibi}." } }
            sonraki: "bl8_sanayi_gise_isci"
          - id: "kaya"
            etiket: { tr: "Doğrudan {npc:kaya_demir|e} git", en: "Take it straight to {npc:kaya_demir}" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 2 } }
              - tohum: { olay: "bl8_kule_gise_gunu", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Haddehanedeki turnike bitti; Lonca'nın el arabaları dün gece onu {yer:kule_dibi|e} taşıdı.", en: "The turnstile from the rolling mill is done. Last night Guild wagons hauled it over to {yer:kule_dibi}." } }
            sonraki: "bl8_sanayi_gise_kaya"

      - id: "bl8_sanayi_gise_kota"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şükran kalemin arkasını dişleri arasında gezdirip düşünüyor. Sonra listenin altına iri harflerle yazıyor: SALI SERBEST.", en: "Shirley chews the end of her pencil and thinks it over. Then she writes across the bottom of the list in big letters: TUESDAYS FREE." }
          - { tr: "\"{npc:kaya_demir|e} ben söylerim,\" diyor. \"Ama salı günü biri ölürse, adını sana yazarım. Senin hesabına.\"", en: "\"I'll tell {npc:kaya_demir},\" she says. \"But if somebody dies on a Tuesday, I'm writing their name down under yours. Your tab.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Yaz.\" Elini uzat", en: "\"Write it.\" Shake on it" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_sanayi_gise_red"
        yer: "sanayi"
        paragraflar:
          - { tr: "Şükran seni sonuna kadar dinliyor, sonra listeyi geri alıyor. \"Kırk bir kişi,\" diyor yalnızca. \"Salı günü hangisine serbest diyecektin?\"", en: "Shirley hears you out, then takes the list back. \"Forty-one people,\" is all she says. \"Which one of them were you going to give Tuesday off?\"" }
          - { tr: "Cevap vermene fırsat kalmadan örslere dönüyor. Çekiçler yeniden inmeye başlıyor, senin sesini bastıracak kadar gür.", en: "She turns back to the anvils before you can answer. The hammers start up again, loud enough to drown you out." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Salondan çık", en: "Walk out of the hall" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl8_sanayi_gise_imza"
        yer: "sanayi"
        paragraflar:
          - { tr: "Adını listenin altına yazıyorsun. Oğlunu kaybeden işçi çekici bir an durdurup sana başıyla selam veriyor; ötekilerin bir kısmı gözünü örse indiriyor.", en: "You sign at the bottom of the list. The worker who lost his son pauses his hammer and gives you a nod. A few of the others drop their eyes to the anvil." }
          - { tr: "Şükran listeyi katlayıp önlüğünün cebine sokuyor. \"Bir hafta sonra Kule'nin kapısında gişe olacak,\" diyor. \"Biri sorarsa, sen de evet dedin.\"", en: "Shirley folds the list into her apron pocket. \"A week from now there'll be a toll gate on the Spire door,\" she says. \"Anybody asks, you said yes too.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Evet dedim.\"", en: "\"I said yes.\"" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "isci"
            etiket: { tr: "Çıkarken işçinin omzuna dokun", en: "Touch the worker's shoulder on the way out" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_sanayi_gise_boz"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece yarısı haddehanenin arka kapısından süzülüp döküm kumuna bir matara su boşaltıyorsun. Sabah eriyik kalıba dökülünce salonda çan sesine benzer bir çatırtı kopuyor: turnike daha soğumadan ortadan yarılıyor.", en: "At midnight you slip in through the mill's back door and empty a canteen into the casting sand. In the morning, when the melt hits the mold, a crack rings through the hall like a bell. The turnstile splits down the middle before it's even cooled." }
          - { tr: "Şükran çatlağa uzun uzun bakıyor, sonra gece vardiyasına dönüyor. \"Kalıbı kim hazırladıysa bu hafta yarım tayın alacak,\" diyor.", en: "Shirley stares at the crack for a long time, then turns to the night shift. \"Whoever packed that mold is on half rations this week,\" she says." }
        secenekler:
          - id: "itiraf"
            etiket: { tr: "Öne çık: \"Kalıba ben dokundum.\"", en: "Step forward. \"I'm the one who messed with the mold.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 2 }
              - itibar: { lonca: -2 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Sesini çıkarma; vardiya yarım tayını çeksin", en: "Keep quiet. Let the shift eat half rations" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_sanayi_gise_isci"
        yer: "sanayi"
        paragraflar:
          - { tr: "Adam çekici örsün kenarına bırakıp alnını önlüğüne siliyor. \"Oğlum yirmi ikiydi,\" diyor. \"Bu demir onu kapıda durdururdu. Bana kızardı belki. Ama yaşardı.\"", en: "The man sets his hammer on the edge of the anvil and wipes his forehead on his apron. \"My boy was level twenty-two,\" he says. \"This iron would've stopped him at the door. He'd have been mad at me, maybe. But he'd be alive.\"" }
          - { tr: "Turnikenin soğumakta olan koluna avucunu bastırıyor, eti cızırdayana kadar çekmiyor. \"Kimse benim gibi beklemesin diye,\" diyor.", en: "He presses his palm against the turnstile's cooling arm and doesn't pull it away until it sizzles. \"So nobody else has to wait like I'm waiting,\" he says." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Örsün öbür ucuna geç, onunla birlikte döv", en: "Take the other side of the anvil and hammer with him" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "elini"
            etiket: { tr: "Yanan elini sar, bir şey söyleme", en: "Wrap his burned hand. Don't say anything" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_sanayi_gise_kaya"
        yer: "sanayi"
        paragraflar:
          - { tr: "{npc:kaya_demir} haddehanenin üst katındaki camlı odada, önünde bir harita, kahvesi soğumuş. Seni dinlerken bir kez bile sözünü kesmiyor.", en: "{npc:kaya_demir} is in the glassed-in office over the mill floor with a map in front of him and his coffee gone cold. He doesn't interrupt you once." }
          - { tr: "\"Kapı koymazsam dönmeyen avcının hesabını kim verecek?\" diyor sonunda. \"Sen mi? Kule herkesi çağırıyor. Birinin hayır demesi lazım. O biri ben olurum, sorun değil.\"", en: "\"If I don't put a gate there, who answers for the hunters who don't come back?\" he finally says. \"You? The Spire's calling everybody. Somebody has to say no. If that somebody's me, fine.\"" }
        secenekler:
          - id: "ozgur"
            etiket: { tr: "\"İnsanın kendi canına karar vermesine de bir kapı mı koyacaksın?\"", en: "\"So now you're gating people's right to risk their own lives?\"" }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { kaya_demir: { saygi: 2, guven: -1 } }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sart"
            etiket: { tr: "\"Koy. Ama parmaklık dışarıdan da açılsın.\"", en: "\"Put it in. But the grate opens from the outside too.\"" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - iliski: { kaya_demir: { guven: 2 } }
              - bayrak: "bl8_gise_disaridan"
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · Gişe günü (tohum: bl8_sanayi_gise)
  - id: "bl8_kule_gise_gunu"
    konum: ["kule_dibi"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kesif", "kule", "lonca", "hakimiyet"]
    gerilim: 3
    kart: { tr: "Gişe günü", en: "Toll day" }
    sahne: "bl8_kule_gise_gunu_1"
    sahneler:
      - id: "bl8_kule_gise_gunu_1"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "Kule kapısına haddehanedeki turnike oturtulmuş. Kolları güneşte kararmış, kabartma halkalar parmak izleriyle dolmuş bile. Yanındaki tabelada tebeşirle: OTUZUN ALTI GİREMEZ · GEÇİŞ: BİR ÇEKİRDEK.", en: "The turnstile from the rolling mill is bolted into the Spire's doorway. Its arms have darkened in the sun and the raised rings are already smudged with fingerprints. The sign next to it says, in chalk: NO ONE UNDER LEVEL 30 · ENTRY: ONE CORE." }
            kosul: { bayrak_yok: "bl8_gise_bozuldu" }
          - metin: { tr: "Döküm çatladığı için Lonca turnike yerine kapıya kalın bir zincir germiş. Yanındaki tabelada tebeşirle: OTUZUN ALTI GİREMEZ · GEÇİŞ: BİR ÇEKİRDEK.", en: "Since the casting cracked, the Guild has strung a heavy chain across the door instead. The sign next to it says, in chalk: NO ONE UNDER LEVEL 30 · ENTRY: ONE CORE." }
            kosul: { bayrak: "bl8_gise_bozuldu" }
          - { tr: "Önünde kalabalık birikmiş; çoğu yirmili seviyelerde, kiminin elinde çekirdek bile yok. Dört Lonca nöbetçisi coplarını göğüslerine çaprazlamış bekliyor.", en: "A crowd has piled up in front of it, mostly level twenties, some without a single core to their name. Four Guild sentries wait with their batons crossed over their chests." }
          - { tr: "Derken yirmi dört seviyesinde bir oğlan koşup turnikenin üstünden atlamaya kalkıyor. En yakın nöbetçi copunu kaldırıyor.", en: "Then a level twenty-four kid takes a running start and tries to vault the gate. The nearest sentry raises his baton." }
          - metin: { tr: "Tabelanın altında senin pazarlığın da yazılı: SALI SERBEST. Bugün çarşamba.", en: "Your deal's on the sign too, down at the bottom: TUESDAYS FREE. Today's Wednesday." }
            kosul: { bayrak: "bl8_gise_kota" }
          - metin: { tr: "Kalabalıktan biri seni görüp tabelayı gösteriyor: \"Bu da imzalayanlardan!\"", en: "Somebody in the crowd spots you and points at the sign. \"That's one of the ones who signed it!\"" }
            kosul: { bayrak: "bl8_gise_imza" }
          - metin: { tr: "Parmaklığın kilidi artık iki yandan da açılıyor. Kule'den çıkmak isteyene kimse hayır diyemeyecek.", en: "The grate's lock opens from both sides now. Nobody can stop a person trying to leave the Spire." }
            kosul: { bayrak: "bl8_gise_disaridan" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Nöbetçinin copu kaldırışında bir tereddüt var. Bu işi ilk kez yapıyor; sen olmasan vuramayacak belki de.", en: "There's a hesitation in the way the sentry lifts that baton. First time doing this. If you weren't here watching, he might not be able to swing." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "otuzun altı giremez. yukarıdakiler de böyle bir tabela asmıştır bize. biz okuyamadık sadece.", en: "no one under thirty. the ones upstairs probably hung a sign like that for us. we just couldn't read it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O çocuk benim mahalleden. Annesi her sabah iskelede balık ayıklıyor.\"", en: "\"That kid's from my neighborhood. His mom cleans fish on the dock every morning.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Gişe ha. Ben girdiğimde kapı bile yoktu. Şimdi bilet kesiyorlar.\"", en: "\"A toll gate, huh. When I went in, there wasn't even a door. Now they're selling tickets.\"" }
        secenekler:
          - id: "araya"
            etiket: { tr: "Copla çocuğun arasına gir", en: "Step between the baton and the kid" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { lonca: -1 }
            sonraki: "bl8_kule_gise_gunu_araya"
          - id: "uygula"
            etiket: { tr: "Kuralı uygula: otuzun altı geri dönsün", en: "Enforce the rule. Under level thirty goes home" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { lonca: 2 }
              - bayrak: "bl8_gise_duruyor"
              - tehlike: { kule_dibi: -3 }
            sonraki: "bl8_kule_gise_gunu_uygula"
          - id: "kir"
            tur: "gosteris"
            etiket: { tr: "Turnikeyi yerinden sök, kenara fırlat", en: "Rip the gate out of the doorway and toss it aside" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 4
              - ahlak: { duzen: -3 }
              - itibar: { lonca: -4 }
              - bayrak: "bl8_gise_kirildi"
              - tehlike: { kule_dibi: 2 }
            sonraki: "bl8_kule_gise_gunu_kir"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|e} haber yolla, kendisi gelsin", en: "Send for {npc:kaya_demir}. Let him come see this himself" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - iliski: { kaya_demir: { saygi: 2 } }
            sonraki: "bl8_kule_gise_gunu_kaya"

      - id: "bl8_kule_gise_gunu_araya"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Cop omzuna iniyor; sana bir sinek konması kadar bile gelmiyor. Nöbetçi elindeki sopaya, sonra sana bakıp bir adım geri çekiliyor.", en: "The baton lands on your shoulder. To you it feels like a fly landing. The sentry looks at his stick, then at you, and takes a step back." }
          - { tr: "Oğlan turnikenin öbür yanına düşmüş, dizi kanıyor. Kalabalık uğulduyor; nöbetçiler ne yapacaklarını bilemiyor. Kural da sen de kapının önünde duruyorsunuz.", en: "The kid has landed on the far side of the gate with a bloody knee. The crowd's buzzing and the sentries don't know what to do. The rule's standing at the door, and so are you." }
        secenekler:
          - id: "gecir"
            etiket: { tr: "Oğlanı Kule'ye kendin götür; sorumluluğu al", en: "Take the kid into the Spire yourself. It's on you" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Oğlanı kaldır, annesinin yanına yolla", en: "Help the kid up and send him home to his mom" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_gise_gunu_uygula"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Oğlanı yakasından tutup turnikenin berisine indiriyorsun. Nöbetçi rahatlamış gibi copunu aşağı alıyor. Kalabalık söylene söylene dağılıyor; birkaç kişi yere tükürüyor.", en: "You catch the kid by the collar and set him back down on the near side of the gate. The sentry lowers his baton like he's relieved. The crowd breaks up, muttering. A few people spit on the ground." }
          - { tr: "Akşam Hayri'nin defterinde ilk kez boş bir sayfa kalıyor: o gün Kule'ye girip de dönmeyen yok.", en: "That evening, for the first time, Harv's ledger has a blank page. Everybody who went into the Spire that day came back out." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Boş sayfaya bak", en: "Look at the blank page" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_gise_gunu_kir"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Turnikenin kolunu kavrayıp çekiyorsun. Cıvatalar taştan bir bir sökülüyor; demir, dört koluyla birden meydanın ortasına yuvarlanıyor.", en: "You grab an arm of the gate and pull. The bolts tear out of the stone one after another, and the iron goes tumbling into the middle of the plaza, all four arms at once." }
          - { tr: "Nöbetçiler coplarını bırakıp geri çekiliyor. Kalabalık bir an donup kalıyor, sonra tezahürat başlıyor. Yirmili seviyeler Kule'ye akın ediyor; kimse durup kaçının geri döneceğini sormuyor.", en: "The sentries drop their batons and back off. The crowd freezes for a second, then starts cheering. The low-level crowd floods into the Spire, and nobody stops to ask how many of them will come back out." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "güzel. özgürlük. şimdi de hayri'nin defterini say.", en: "nice. freedom. now go count harv's ledger." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Devrilen demirin üstüne otur", en: "Sit down on the toppled iron" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kule_gise_gunu_kaya"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:kaya_demir} yarım saat sonra, kollarını sıvamış hâlde çıkageliyor. Oğlana, nöbetçiye, sonra sana bakıyor.", en: "{npc:kaya_demir} shows up half an hour later with his sleeves rolled up. He looks at the kid, then the sentry, then you." }
          - { tr: "\"Bu çocuğu sen götürürsen girer,\" diyor. \"Senin sorumluluğunda. Ölürse senin hanene yazılır. Lonca'da kural böyle işler: güçlü olan, zayıfın kapısı olur.\"", en: "\"He goes in if you take him,\" he says. \"He's on your head. He dies, it goes on your record. That's how it works in the Guild. The strong one is the weak one's door.\"" }
        secenekler:
          - id: "kabul"
            etiket: { tr: "\"Benim hanem.\" Oğlanı yanına al", en: "\"My record.\" Take the kid with you" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - iliski: { kaya_demir: { guven: 2 } }
              - bayrak: "bl8_gise_kefil"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "red"
            etiket: { tr: "\"Kapı olmak istemiyorum.\" Geri çekil", en: "\"I don't want to be anybody's door.\" Step back" }
            etkiler:
              - iliski: { kaya_demir: { saygi: -1 } }
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ESKİ ŞEHİR · Erişim pulu (havuz)
  - id: "bl8_eski_sehir_pul"
    konum: ["eski_sehir"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "sistem", "cekirdek", "carsi"]
    gerilim: 2
    kart: { tr: "Erişim pulu", en: "Access flakes" }
    sahne: "bl8_eski_sehir_pul_1"
    sahneler:
      - id: "bl8_eski_sehir_pul_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} kapalı çarşısında, iki kepenk arasına serilmiş bir battaniyenin üstünde on üç yaşlarında bir çocuk tezgâh açmış. Önündeki kibrit kutularında tırnak büyüklüğünde, buz gibi parlayan pullar dizili.", en: "In {yer:eski_sehir|pos} covered bazaar, a kid of maybe thirteen has set up shop on a blanket between two shutters. Laid out in front of him in matchboxes are fingernail-sized flakes that glitter like ice." }
          - { tr: "\"Erişim pulu!\" diye bağırıyor. \"Çekirdek'in kendi kabuğu! Avucunda tut, pencerende kapı açılsın! Tanesi bir çekirdek, üçü iki!\" Adı Emrah. Kristal geceleri attıkça yılan gibi kabuk değiştiriyormuş; nöbetçilerin süpürdüğü pulları da biri ona satıyormuş.", en: "\"Access flakes!\" he hollers. \"Shed straight off the Core! Hold one in your palm and watch your window open a door! One core apiece, three for two!\" His name's Eddie. Word is the crystal sheds like a snake every time it pulses at night, and somebody's been selling him the flakes the guards sweep up." }
          - { tr: "Tezgâhın yanında bir adam pulu yumruğunda sıkmış, gözleri havada. \"Yazdı!\" diyor. \"Erişim istendi, yazdı!\" Burnundan ince bir kan sızıyor, farkında bile değil.", en: "Next to the blanket, a man has a flake squeezed in his fist, eyes rolled up. \"It said something!\" he says. \"Access requested, it said!\" A thin line of blood runs from his nose, and he hasn't noticed." }
          - metin: { tr: "Çekirdek senin. Demek nöbetçilerinden biri pul satıyor.", en: "The Core's yours. Which means one of your guards is selling flakes." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - metin: { tr: "Kristalin başında Lonca nöbet tutuyor. Lonca'nın nöbetçisi hiçbir şeyi bedavaya süpürmez.", en: "The Guild stands watch over the crystal. A Guild sentry doesn't sweep anything up for free." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kristalin başındaki beyaz şallılar pulları kutsal emanet diye topluyormuş. Kimin cebine girdiğini sormak kimsenin aklına gelmemiş.", en: "The white shawls guarding the crystal supposedly collect the flakes as holy relics. Nobody's thought to ask whose pocket they end up in." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Merdivenden indiğin geceden beri kristal sakin. Emrah'ın kutularındakiler ya eski stok ya da ezilmiş şişe camı.", en: "The crystal's been calm since the night you went down the stairs. What's in Eddie's matchboxes is either old stock or crushed bottle glass." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Çarşının tavanındaki kirişlere üç akbaba tünemiş, üçü de tezgâha bakıyor. Kule'nin akbabaları {yer:eski_sehir|e} pek inmez.", en: "Three vultures are perched on the bazaar's roof beams, all three watching the blanket. The Spire's vultures don't usually come down to {yer:eski_sehir}." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o pullar birini arıyor. herkese bir kez soruyorlar: sen misin? değilsin. burun kanaması o hayırın sesi.", en: "those flakes are looking for someone. they ask everybody once: is it you? it's not. the nosebleed is what the no sounds like." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Burnu kanayan üçüncü kişi bu. Sabahtan beri sayıyorum.\"", en: "\"That's the third nosebleed. I've been counting since this morning.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir tane alalım. Yalnızca bir tane. Bilim için.\"", en: "\"Let's get one. Just one. For science.\"" }
        secenekler:
          - id: "topla"
            etiket: { tr: "Tezgâhı kapat, pullara el koy", en: "Shut the stand down. Confiscate the flakes" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - bayrak: "bl8_pul_toplandi"
              - tohum: { olay: "bl8_kule_akbabalar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Çarşıdaki pul tezgâhından beri Kule'nin akbabaları geceleri şehrin üstünde daha alçaktan dönüyor.", en: "Ever since the flake stand in the bazaar, the Spire's vultures have been circling lower over the city at night." } }
            sonraki: "bl8_eski_sehir_pul_topla"
          - id: "iz"
            etiket: { tr: "Pulları Emrah'a kimin sattığını bul", en: "Find out who's been selling Eddie the flakes" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - bayrak: "bl8_pul_tedarikci"
              - tohum: { olay: "bl8_kule_akbabalar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Çarşıdaki pul tezgâhından beri Kule'nin akbabaları geceleri şehrin üstünde daha alçaktan dönüyor.", en: "Ever since the flake stand in the bazaar, the Spire's vultures have been circling lower over the city at night." } }
            sonraki: "bl8_eski_sehir_pul_iz"
          - id: "tut"
            etiket: { tr: "Bir pulu avucunda tut", en: "Hold one of the flakes in your palm" }
            etkiler:
              - dikkat: 3
              - bayrak: "bl8_pul_tutuldu"
              - tohum: { olay: "bl8_kule_akbabalar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Çarşıdaki pul tezgâhından beri Kule'nin akbabaları geceleri şehrin üstünde daha alçaktan dönüyor.", en: "Ever since the flake stand in the bazaar, the Spire's vultures have been circling lower over the city at night." } }
            sonraki: "bl8_eski_sehir_pul_tut"
          - id: "elif"
            etiket: { tr: "Burnu kanayanları {npc:elif_sari|in} hastanesine yolla", en: "Send the nosebleeds to {npc:elif_sari|pos} hospital" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - itibar: { siginak: 1 }
              - tohum: { olay: "bl8_kule_akbabalar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Çarşıdaki pul tezgâhından beri Kule'nin akbabaları geceleri şehrin üstünde daha alçaktan dönüyor.", en: "Ever since the flake stand in the bazaar, the Spire's vultures have been circling lower over the city at night." } }
            sonraki: "bl8_eski_sehir_pul_elif"
          - id: "gec"
            tur: "gizle"
            etiket: { tr: "Çarşıdan geç; kimin ne aldığı seni ilgilendirmez", en: "Walk on through. Who buys what is none of your business" }
            etkiler:
              - gizle: 1
              - ahlak: { merhamet: -1 }
            sonraki: "@akis"

      - id: "bl8_eski_sehir_pul_topla"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kibrit kutularını birer birer toplayıp bir bez torbaya boşaltıyorsun. Emrah önce bağırıyor, sonra yalvarıyor, en sonunda battaniyenin üstüne oturup ağlıyor. \"Annemin ilacına biriktiriyordum,\" diyor.", en: "You scoop up the matchboxes one by one and empty them into a cloth sack. Eddie yells first, then begs, then finally sits down on the blanket and cries. \"I was saving for my mom's medicine,\" he says." }
          - { tr: "Torbanın içindeki pullar birbirine sürtündükçe tıslıyor. Çarşının tavanındaki akbabalar kanat çırpıp seninle birlikte kapıya kadar geliyor, sonra Kule'ye doğru havalanıyor.", en: "The flakes hiss as they rub against each other in the sack. The vultures in the rafters flap after you as far as the door, then lift off toward the Spire." }
        secenekler:
          - id: "ilac"
            etiket: { tr: "Emrah'a annesinin ilacını nereden bulacağını söyle", en: "Tell Eddie where he can get his mom's medicine" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Torbayı omzuna at, yürü", en: "Sling the sack over your shoulder and go" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_eski_sehir_pul_iz"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Emrah'ı iki sokak öteden izliyorsun. Akşamüstü bir aşevinin arka kapısında tezgâhı kapatıp birine para sayıyor: kolunda Çekirdek nöbetçilerinin bandı olan, yirmili yaşlarında bir adama.", en: "You tail Eddie from two blocks back. Around dusk, at the back door of a soup kitchen, he packs up and counts out money for someone: a guy in his twenties wearing the Core guards' armband." }
          - { tr: "Nöbetçi seni görünce benzi atıyor. \"Bak,\" diyor. \"Bunlar zaten yere dökülüyor. Süpürüp çöpe atıyorduk. Ben de... çöpe atmadım işte.\"", en: "The guard goes pale when he sees you. \"Look,\" he says. \"They just fall on the ground. We were sweeping them into the trash. I just... didn't put them in the trash.\"" }
          - { tr: "Arkasında, aşevinin duvarına yaslı kalın bir çuval var. \"Gerisi Kule pazarına gitti,\" diye ekliyor. \"Avcılar daha iyi para veriyor.\"", en: "Behind him, a fat sack leans against the soup kitchen wall. \"The rest went to the Spire market,\" he adds. \"Hunters pay better.\"" }
        secenekler:
          - id: "teslim"
            etiket: { tr: "Nöbetçiyi Çekirdek'in sahiplerine teslim et", en: "Turn the guard over to whoever holds the Core" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 1, lonca: 1, yukselenler: 1, sessiz_ag: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "affet"
            etiket: { tr: "Çuvalı al, nöbetçiye bir daha yapmamasını söyle", en: "Take the sack. Tell the guard not to do it again" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_eski_sehir_pul_tut"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Pul avucuna değdiği anda erimeye başlıyor. Pencerende tek satır yanıp sönüyor: [ERİŞİM İSTEĞİ · ADAY DOĞRULANDI]. Burnun kanamıyor; pul suya dönüp parmaklarının arasından akıyor.", en: "The flake starts melting the second it touches your palm. A single line flashes in your window: [ACCESS REQUEST · CANDIDATE CONFIRMED]. Your nose doesn't bleed. The flake turns to water and runs between your fingers." }
          - { tr: "Emrah ağzı açık bakıyor. Etraftakiler de bakıyor. Az önce pul için çekirdek sayan adam bir adım geri çekiliyor, sanki senin avucun ateşmiş gibi.", en: "Eddie stares, mouth open. So does everyone else. The man who was counting out cores for a flake a minute ago takes a step back, like your palm's on fire." }
          - metin: { tr: "Satırın altında küçük harflerle bir not daha beliriyor: [ADAY ZATEN İNDİ]. Pul ne aradığını biliyor, ama geç kalmış.", en: "Under the line, in small letters, a second note appears: [CANDIDATE HAS ALREADY DESCENDED]. The flake knows what it's looking for. It's just late." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "doğrulandı. herkesin önünde. alkış bekleme.", en: "confirmed. in front of everybody. don't wait for applause." }
        secenekler:
          - id: "sat"
            etiket: { tr: "\"Bunlar kimseye kapı açmaz.\" Tezgâhı kapattır", en: "\"These don't open doors for anybody.\" Shut the stand down" }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Islak avucunu pantolonuna sil, çarşıdan çık", en: "Wipe your wet palm on your pants and leave the bazaar" }
            etkiler:
              - gizle: 1
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_eski_sehir_pul_elif"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Burnu kanayan üç kişiyi bir el arabasına bindirip {yer:kiyikent_liman|e} yolluyorsun; arabayı çeken çocuğa yol parası olarak bir çekirdek veriyorsun.", en: "You load the three nosebleeds onto a handcart and send them off to {yer:kiyikent_liman}, and you give the kid pulling it a core for his trouble." }
          - metin: { tr: "Akşam {npc:elif_sari|den} kısa bir not geliyor: \"Üçü de iyi. Hepsi aynı şeyi anlatıyor: bir ses sordu, onlar da hayır dedi. O hayrı ben de duymak isterdim.\"", en: "That evening a short note comes from {npc:elif_sari}: \"All three are fine. They all tell the same story. A voice asked them something and they said no. I'd have liked to hear that no myself.\"" }
            kosul: { npc_hayatta: "elif_sari" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Notu katla, cebine koy", en: "Fold the note into your pocket" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== KULE DİBİ · Akbabalar (tohum: bl8_eski_sehir_pul)
  - id: "bl8_kule_akbabalar"
    konum: ["kule_dibi"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["kesif", "kule", "savas"]
    gerilim: 3
    kart: { tr: "Pazara inen akbabalar", en: "Vultures over the market" }
    sahne: "bl8_kule_akbabalar_1"
    sahneler:
      - id: "bl8_kule_akbabalar_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gün batarken {yer:kule_dibi|in} avcı pazarının üstünde akbabalar dönmeye başlıyor. Önce üç tane, sonra on, sonra sayılamayacak kadar çok... Kanatlarının gölgesi tezgâhların üstünden kayıp gidiyor.", en: "As the sun goes down, vultures start circling over the hunters' market in {yer:kule_dibi}. Three at first, then ten, then too many to count. The shadows of their wings slide across the stalls." }
          - { tr: "Derken pike yapıyorlar. Hedefleri rastgele değil: bir avcının bel çantası, bir tüccarın kasası, sekiz yaşında bir kızın sıkılı yumruğu. Hepsinin içinde buz gibi parlayan birer pul var.", en: "Then they dive. Not at random. A hunter's belt pouch, a merchant's cashbox, the clenched fist of an eight-year-old girl. Every one of them is holding a flake that glitters like ice." }
          - metin: { tr: "Emrah'ın tezgâhını kapattın, ama pullar çoktan dağılmış. Belli ki biri buraya da bir avuç getirmiş.", en: "You shut Eddie's stand down, but the flakes have already spread. Somebody obviously brought a handful here too." }
            kosul: { bayrak: "bl8_pul_toplandi" }
          - metin: { tr: "Nöbetçinin sözü aklına geliyor: gerisi Kule pazarına gitti. İşte gittiği yer.", en: "You remember what the guard said: the rest went to the Spire market. Here's where it went." }
            kosul: { bayrak: "bl8_pul_tedarikci" }
          - metin: { tr: "Akbabalardan biri senin tepende alçalıp bir süre havada asılı kalıyor; avucunda eriyen pulu hatırlamış gibi. Sonra sana dokunmadan yeniden havalanıyor.", en: "One of the vultures drops low over your head and hangs there for a moment, like it remembers the flake that melted in your palm. Then it lifts off again without touching you." }
            kosul: { bayrak: "bl8_pul_tutuldu" }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Akbabalar pulları yemek için almıyor. Gagalarına aldıkları gibi Kule'nin tepesine taşıyorlar; geri götürüyorlar.", en: "The vultures aren't taking the flakes to eat them. They grab them and carry them up to the top of the Spire. They're taking them back." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "pullar eve dönüyor. kule ile çekirdek akraba. bunu sana kimse söylemedi, ben söyledim.", en: "the flakes are going home. the spire and the core are family. nobody told you that. i did." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Kim daha çok düşürür? Saymaya başladım bile.\"", en: "\"Most kills wins? I'm already counting.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kızın elini aç! Pulu bıraksın, akbaba pulun peşinde!\"", en: "\"Open her hand! Make her drop it, they're after the flake!\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kızın önüne geç, akbabaları karşıla", en: "Get in front of the girl and meet the vultures" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - savas: { dusmanlar: ["kule_akbabasi@dunya", "kule_akbabasi@dunya", "kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "bl8_kule_akbabalar_zafer", kaybet: "bl8_kule_akbabalar_yenilgi", kac: "bl8_kule_akbabalar_kacis" }
          - id: "birak"
            etiket: { tr: "Pazara bağır: \"Pulları yere atın!\"", en: "Shout to the market: \"Drop the flakes!\"" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - tehlike: { kule_dibi: -3 }
              - bayrak: "bl8_akbaba_dagildi"
            sonraki: "bl8_kule_akbabalar_birak"
          - id: "pul"
            tur: "gosteris"
            etiket: { tr: "Kızın yumruğundaki pulu al, havaya kaldır", en: "Take the flake out of the girl's fist and hold it up" }
            etkiler:
              - dikkat: 4
              - ahlak: { merhamet: 2, insanlik: -1 }
            sonraki: "bl8_kule_akbabalar_pul"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|e} bağır: \"Sağ kanat senin!\"", en: "Yell to {npc:aras_kurt}: \"Right side's yours!\"" }
            goster: { npc_hayatta: "aras_kurt" }
            etkiler:
              - iliski: { aras_kurt: { guven: 2, saygi: 1 } }
              - savas: { dusmanlar: ["kule_akbabasi@dunya", "kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "bl8_kule_akbabalar_zafer", kaybet: "bl8_kule_akbabalar_yenilgi", kac: "bl8_kule_akbabalar_kacis" }

      - id: "bl8_kule_akbabalar_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Son akbaba da bir tezgâhın tentesine çakılıp tüy yağmuru hâlinde yere iniyor. Pazarda kimse kıpırdamıyor; sonra biri gülüyor, biri ağlıyor, biri kasasını kucaklayıp kapıya koşuyor.", en: "The last vulture slams into a stall's awning and comes down in a shower of feathers. Nobody in the market moves. Then somebody laughs, somebody cries, and somebody hugs their cashbox and runs for the exit." }
          - { tr: "Sekiz yaşındaki kız yumruğunu açıyor. Pul avucunda erimiş, geriye ıslak bir iz kalmış. \"Uğur getirecekti,\" diyor.", en: "The eight-year-old opens her fist. The flake has melted in her palm, leaving just a wet mark. \"It was supposed to be lucky,\" she says." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Getirdi.\" Kızın saçını karıştır", en: "\"It was.\" Ruffle her hair" }
            etkiler:
              - tehlike: { kule_dibi: -3 }
              - bayrak: "bl8_akbaba_dagildi"
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl8_kule_akbabalar_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gagalar, pençeler, kanatlar... Bir yerden sonra hangisinin sana çarptığını ayırt edemiyorsun. Gözünü açtığında bir tezgâhın altındasın; sekiz yaşındaki kız elindeki şişeyle dudaklarına su damlatıyor.", en: "Beaks, claws, wings. After a point you can't tell which one's hitting you. When you open your eyes, you're under a stall, and the eight-year-old is dribbling water onto your lips from a bottle." }
          - { tr: "\"Gittiler,\" diyor. \"Pulları aldılar, gittiler. Benimkini de aldılar.\"", en: "\"They left,\" she says. \"They took the flakes and left. They took mine too.\"" }
        secenekler:
          - id: "yeniden"
            etiket: { tr: "Doğrul; dönen olursa karşıla", en: "Get up. Meet any that come back" }
            etkiler:
              - can: 60
              - savas: { dusmanlar: ["kule_akbabasi@dunya", "kule_akbabasi@dunya"], ortam: ["tavan"], kazan: "bl8_kule_akbabalar_zafer", kaybet: "bl8_kule_akbabalar_yenilgi", kac: "bl8_kule_akbabalar_kacis" }
          - id: "birak"
            etiket: { tr: "Şişeyi al, tezgâhın altında biraz daha yat", en: "Take the bottle and lie under the stall a little longer" }
            etkiler:
              - can: 20
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_akbabalar_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kızı kucaklayıp bir tentenin altına sığınıyorsun. Akbabalar pazarı yarım saat boyunca didik didik ediyor, son pulu da gagalarına alınca Kule'nin tepesine doğru yükselip kayboluyorlar.", en: "You scoop up the girl and duck under an awning. The vultures pick the market apart for half an hour, and once they've got the last flake they rise toward the top of the Spire and disappear." }
          - { tr: "Yerde devrilmiş tezgâhlar, yırtık tenteler, kan izleri kalıyor. Ölü yok, ama pazar bu hafta açılmayacak.", en: "Left behind: overturned stalls, torn awnings, blood on the ground. Nobody's dead, but the market won't open this week." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kızı annesine teslim et", en: "Hand the girl back to her mother" }
            etkiler:
              - tehlike: { kule_dibi: 2 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kule_akbabalar_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Sesin pazarın gürültüsünü yarıp geçiyor. Önce bir avcı bel çantasını yere fırlatıyor, sonra tüccar kasasını açıp avuç avuç pul döküyor. Kız yumruğunu açınca pul kaldırım taşına düşüp şıngırdıyor.", en: "Your voice cuts through the racket of the market. A hunter flings his belt pouch to the ground first, then the merchant pops his cashbox and dumps out flakes by the handful. When the girl opens her fist, the flake clinks onto the paving stones." }
          - { tr: "Akbabalar insanlara aldırmadan yere iniyor, pulları topluyor ve sessizce havalanıyor. Bir dakika içinde gökyüzü boşalıyor. Kimse kanamıyor.", en: "The vultures ignore the people, land, gather up the flakes, and lift off without a sound. Inside a minute, the sky is empty. Nobody's bleeding." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kaldırımda kalan son pula bak", en: "Look at the last flake left on the pavement" }
            etkiler:
              - xp_seviye: 15
            sonraki: "@akis"

      - id: "bl8_kule_akbabalar_pul"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pulu kızın elinden alıp başının üstüne kaldırıyorsun. Pul avucunda erimeye başlarken akbabalar havada duraksıyor. Sonra hepsi birden, kanat kanada, senin etrafında alçalmaya başlıyor.", en: "You take the flake from the girl and raise it over your head. As it starts to melt in your hand, the vultures stall in midair. Then all of them at once, wing to wing, start circling down around you." }
          - { tr: "Hiçbiri saldırmıyor. Kaldırımın üstüne, senin çevrene halka olup konuyorlar, başlarını eğiyorlar. Pazar dili tutulmuş bakıyor. Pul suya dönünce akbabalar teker teker havalanıp Kule'ye dönüyor.", en: "None of them attack. They land in a ring around you on the paving stones and bow their heads. The whole market stares, struck dumb. When the flake turns to water, the vultures lift off one by one and head back to the Spire." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni selamladılar. kule'nin kuşları. bunu herkes gördü. ben de gördüm. hoşuma gitmedi.", en: "they saluted you. the spire's birds. everybody saw it. so did i. i didn't like it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Islak avucunu kapat, bakışlara aldırma", en: "Close your wet hand. Ignore the stares" }
            etkiler:
              - tehlike: { kule_dibi: -2 }
              - itibar: { yukselenler: 2 }
              - bayrak: "bl8_akbaba_selam"
              - xp_seviye: 15
            sonraki: "@akis"

  # ================================================================== KORDON · Gece üçte (havuz)
  - id: "bl8_kordon_gece_ucte"
    konum: ["kordon"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "kordon", "sistem", "kurtarma"]
    gerilim: 3
    kart: { tr: "Gece üçte çekilen deniz", en: "The sea at three a.m." }
    sahne: "bl8_kordon_gece_ucte_1"
    sahneler:
      - id: "bl8_kordon_gece_ucte_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Saat üçe on var. Mendireğin dibinde bir avuç çocuk, ellerinde fener ve çuval, suya bakıp bekliyor. Kimsenin ağzını bıçak açmıyor.", en: "Ten to three in the morning. A handful of kids at the foot of the breakwater, lanterns and sacks in hand, watching the water and waiting. Nobody says a word." }
          - { tr: "Saat üçü vurunca deniz geri çekiliyor. Ne dalga geliyor ne köpük kalıyor; su, biri onu çekiyormuş gibi kıyıdan iki yüz metre uzaklaşıyor. Çamurun içinden ilk taşmada batan arabalar, yan yatmış bir balıkçı teknesi ve Kapı çekirdeklerinin mavi parıltısı çıkıyor.", en: "When it hits three, the sea pulls back. No wave, no foam. The water just slides away from shore a couple hundred yards, like somebody's reeling it in, and out of the mud come the cars that sank in the first overflow, a fishing boat on its side, and the blue glint of Gate cores." }
          - { tr: "Çocuklar koşmaya başlıyor. Arkandan çay ocağının sahibi Nezihe Hanım sesleniyor, sesi titreyerek: \"Yusuf! Torunum o, en öndeki. Su her gece biraz daha geç dönüyor, onlar da her gece biraz daha uzağa gidiyor.\"", en: "The kids take off running. Behind you, Miss Nettie, who runs the tea stand, calls out, voice shaking. \"Joey! That's my grandson, the one in front. Every night the water comes back a little later, and every night they go a little farther.\"" }
          - metin: { tr: "Çamurun üstünde köpük ruhları dolaşıyor ama çocuklara dokunmuyorlar; hepsi aynı yöne, Kule'ye dönmüş, kıpırdamadan duruyor. Su dönünce ne yapacaklarını kimse bilmiyor.", en: "Foam spirits drift over the mud, but they don't touch the kids. Every one of them has turned the same way, toward the Spire, and they're standing perfectly still. Nobody knows what they'll do when the water comes back." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Yeniden boyanmış bankların üstünde balıkçılar oturmuş, çocukları seyrediyor. Biri saatine bakıyor; dün gece suyun kaç dakikada döndüğünü tebeşirle bankın sırtına yazmış.", en: "Fishermen sit on the freshly painted benches, watching the kids. One checks his watch. He's chalked last night's time on the back of the bench: how many minutes before the water came back." }
            kosul: { bayrak_yok: "kordon_dustu" }
          - metin: { tr: "Saat üç. Kristalin seni uyandırdığı saat. Demek bu şehirde gece üçte uyanan yalnız sen değilmişsin.", en: "Three. The hour the crystal woke you. Turns out you're not the only thing in this city that wakes up at three." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - metin: { tr: "Saat üç. Pencerendeki bekleyen satır da tam şu an bir kez yanıp sönüyor.", en: "Three. And right at this moment, the line waiting in your window blinks once too." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Su her nabızda biraz daha uzağa çekiliyor, ama dönüşü tek seferde olacak. Çamurdaki çizgilere bakılırsa en uzaktaki arabayı yutacak kadar hızlı.", en: "With every pulse the water pulls back a little farther, but it'll come back all at once. Judging by the lines in the mud, fast enough to swallow the farthest car." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "deniz de sayıyor. bu gece herkes sayıyor. bir tek sen saymıyorsun.", en: "the sea's counting too. everyone's counting tonight. except you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben gidiyorum. Sen gelsen de gelmesen de.\"", en: "\"I'm going out there. With you or without you.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Çekirdekler. Çamurda. Yerde duruyorlar. Tamam, tamam... çocukları da kurtarırız.\"", en: "\"Cores. In the mud. Just lying there. Okay, okay... we'll save the kids too.\"" }
        secenekler:
          - id: "kos"
            etiket: { tr: "Çamura in, Yusuf'u su dönmeden geri getir", en: "Head out onto the mud. Bring Joey back before the water does" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl8_yusuf_kurtarildi"
              - tohum: { olay: "bl8_us_camur_parasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:kordon|de} geçen geceden beri Nezihe Hanım'ın çay ocağı akşamları erkenden kapanıyor.", en: "Since that night on {yer:kordon}, Miss Nettie has been closing her tea stand early." } }
            sonraki: "bl8_kordon_gece_ucte_kos"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|le} birlikte çamura koş", en: "Run out onto the mud with {npc:deniz_arman}" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { deniz_arman: { guven: 3, baglilik: 2 } }
              - bayrak: "bl8_yusuf_kurtarildi"
              - tohum: { olay: "bl8_us_camur_parasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:kordon|de} geçen geceden beri Nezihe Hanım'ın çay ocağı akşamları erkenden kapanıyor.", en: "Since that night on {yer:kordon}, Miss Nettie has been closing her tea stand early." } }
            sonraki: "bl8_kordon_gece_ucte_kos"
          - id: "say"
            etiket: { tr: "Mendirekte kal; nabızları say, çocuklara bağır", en: "Stay on the breakwater. Count the pulses and yell to the kids" }
            gerekli: { stat: { per: 40 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - bayrak: "bl8_kordon_sayim"
              - tehlike: { kordon: -3 }
              - tohum: { olay: "bl8_us_camur_parasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:kordon|de} geçen geceden beri Nezihe Hanım'ın çay ocağı akşamları erkenden kapanıyor.", en: "Since that night on {yer:kordon}, Miss Nettie has been closing her tea stand early." } }
            sonraki: "bl8_kordon_gece_ucte_say"
          - id: "topla"
            etiket: { tr: "Sen de çamura in; çekirdekleri kimseye bırakma", en: "Get out on the mud yourself. Don't leave those cores to anybody" }
            etkiler:
              - ahlak: { merhamet: -2, insanlik: -1 }
              - xp_seviye: 15
              - tohum: { olay: "bl8_us_camur_parasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:kordon|de} geçen geceden beri Nezihe Hanım'ın çay ocağı akşamları erkenden kapanıyor.", en: "Since that night on {yer:kordon}, Miss Nettie has been closing her tea stand early." } }
            sonraki: "bl8_kordon_gece_ucte_topla"
          - id: "kapat"
            etiket: { tr: "Konsey adına mendireği geceleri kapat", en: "Close the breakwater at night in the Council's name" }
            goster: { bayrak: "uye_siginak" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 2 }
              - bayrak: "bl8_mendirek_kapali"
              - tehlike: { kordon: -2 }
              - tohum: { olay: "bl8_us_camur_parasi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:kordon|de} geçen geceden beri Nezihe Hanım'ın çay ocağı akşamları erkenden kapanıyor.", en: "Since that night on {yer:kordon}, Miss Nettie has been closing her tea stand early." } }
            sonraki: "bl8_kordon_gece_ucte_kapat"

      - id: "bl8_kordon_gece_ucte_kos"
        yer: "kordon"
        paragraflar:
          - { tr: "Çamur bileklerine kadar çıkıyor, her adımda seni geri çekiyor. Yusuf en uzaktaki arabanın kapısına levye sokmuş, içinde parlayan çekirdeği kurtarmaya uğraşıyor; on dört yaşının bütün inadıyla.", en: "The mud comes up to your ankles and sucks at you with every step. Joey has a pry bar jammed in the door of the farthest car, working at the glowing core inside with all the stubbornness of a fourteen-year-old." }
          - { tr: "Ufuktaki çizgi döndüğü anda onu belinden kavrayıp omzuna alıyorsun. Mendireğe vardığınızda deniz arkanızda kükreyerek taşlara çarpıyor; köpük ensene kadar sıçrıyor.", en: "The second the line on the horizon turns, you grab him around the waist and throw him over your shoulder. By the time you reach the breakwater, the sea is roaring into the rocks behind you, spray hitting the back of your neck." }
          - { tr: "Yusuf'un yumruğunda hâlâ çekirdek var. Nezihe Hanım onu öyle bir sarılışla karşılıyor ki çekirdek elinden düşüp taşların arasına yuvarlanıyor.", en: "Joey still has the core in his fist. Miss Nettie grabs him in a hug so hard the core drops out of his hand and rolls away between the rocks." }
        secenekler:
          - id: "ver"
            etiket: { tr: "Çekirdeği taşların arasından alıp Yusuf'a geri ver", en: "Fish the core out of the rocks and give it back to Joey" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "nezihe"
            etiket: { tr: "Çekirdeği Nezihe Hanım'a ver: \"Ocağa odun parası.\"", en: "Give the core to Miss Nettie. \"For firewood.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kordon_gece_ucte_say"
        yer: "kordon"
        paragraflar:
          - { tr: "Mendireğin ucuna çıkıp nabızları saymaya başlıyorsun: bir, iki, dört, sekiz... Her birinin bir öncekinin iki katı sürdüğünü görünce dönüşün ne zaman geleceğini kestiriyorsun.", en: "You climb out to the end of the breakwater and start counting pulses. One, two, four, eight. Once you see each one lasts twice as long as the last, you can call when the water will turn." }
          - { tr: "\"Geri!\" diye bağırdığında çocuklar bir an duraksıyor, sonra sesindeki bir şeye güvenip dönüyorlar. Son çocuk kayalara tırmanırken deniz yerine geri oturuyor.", en: "When you yell \"Back!\" the kids hesitate for a second, then something in your voice makes them trust it and they turn around. The last one is scrambling up the rocks when the sea slams back into place." }
          - { tr: "Balıkçılardan biri bankın sırtındaki tebeşir yazısını silip yerine senin saydığın sayıları yazıyor. \"Yarın gece de böyle sayarız,\" diyor.", en: "One of the fishermen wipes the chalk off the bench and writes down the numbers you counted instead. \"We'll count it like this tomorrow night too,\" he says." }
        secenekler:
          - id: "ogret"
            etiket: { tr: "Çocuklara nasıl sayacaklarını göster", en: "Show the kids how to count it themselves" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "cay"
            etiket: { tr: "Nezihe Hanım'ın uzattığı çayı al", en: "Take the tea Miss Nettie holds out" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_kordon_gece_ucte_topla"
        yer: "kordon"
        paragraflar:
          - { tr: "Çamura iniyorsun. Çekirdekler sıcak, mavi, kolay; çuval kısa sürede ağırlaşıyor. Çocuklar seni görünce geri çekiliyor, en iyi parçaları sana bırakıyor.", en: "You go out onto the mud. The cores are warm, blue, easy pickings, and your sack gets heavy fast. The kids back off when they see you, leaving the best ones for you." }
          - { tr: "Derken bir çığlık kopuyor. Yusuf yan yatmış teknenin altına kaymış, bacağı teknenin kıç tarafının altında kalmış. Ufuktaki çizgi dönmüş bile.", en: "Then a scream. Joey has slipped under the overturned fishing boat, and his leg's pinned under the stern. The line on the horizon has already turned." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Çuvalı at, tekneyi kaldır", en: "Drop the sack and lift the boat" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "bl8_yusuf_yarali"
              - xp_seviye: 9
            sonraki: "bl8_kordon_gece_ucte_yarali"
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "Çuvalı dişlerinle tut, tekneyi tek elle kaldır", en: "Grip the sack in your teeth and lift the boat one-handed" }
            gerekli: { stat: { str: 45 } }
            etkiler:
              - dikkat: 3
              - bayrak: "bl8_yusuf_yarali"
              - xp_seviye: 9
            sonraki: "bl8_kordon_gece_ucte_yarali"

      - id: "bl8_kordon_gece_ucte_yarali"
        yer: "kordon"
        paragraflar:
          - { tr: "Tekne havalanınca Yusuf'u çekip kucağına alıyorsun. Su arkanızdan bir duvar gibi gelirken mendireğe son anda varıyorsunuz. Oğlanın bacağı garip bir açıyla duruyor.", en: "The boat comes up and you haul Joey out and into your arms. The sea comes after you like a wall, and you hit the breakwater with no time to spare. The kid's leg is bent at a bad angle." }
          - { tr: "Nezihe Hanım torununu senin kollarından alırken sana bakmıyor. Sana değil, çuvala bakıyor.", en: "When Miss Nettie takes her grandson out of your arms, she doesn't look at you. She looks at the sack." }
        secenekler:
          - id: "ver"
            etiket: { tr: "Çuvalı Nezihe Hanım'ın önüne bırak", en: "Set the sack down in front of Miss Nettie" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Çuvalı omzuna al, uzaklaş", en: "Shoulder the sack and walk away" }
            etkiler:
              - ahlak: { merhamet: -1 }
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_kordon_gece_ucte_kapat"
        yer: "kordon"
        paragraflar:
          - { tr: "Mendireğin başına çıkıp Konsey adına konuşuyorsun: bu geceden sonra saat ikiyle dört arası kimse kayalardan inmeyecek. Sonra avuçlarını ağzına götürüp çocukları geri çağırıyorsun.", en: "You climb up at the head of the breakwater and speak for the Council: from tonight on, nobody goes down onto the rocks between two and four a.m. Then you cup your hands and call the kids back in." }
          - { tr: "Çocuklar söylene söylene dönüyor. Yusuf yanından geçerken omzuyla sana çarpıyor. Nezihe Hanım ise ellerini göğsünde kavuşturmuş, dua eder gibi gözlerini kapatmış.", en: "The kids come back, griping. Joey bumps you with his shoulder as he walks by. Miss Nettie has her hands clasped against her chest and her eyes shut like she's praying." }
          - { tr: "Ertesi gece mendireğin başında bir ip ve Konsey'in mavi kolluklu bir nöbetçisi duruyor.", en: "The next night there's a rope across the head of the breakwater and a Council guard with a blue armband standing beside it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İpin düğümünü kendin at", en: "Tie off the rope yourself" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== TEPE · Ayna Gecesi (havuz)
  - id: "bl8_tepe_ayna"
    konum: ["tepe"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["kesif", "yukselenler", "sistem", "ayin"]
    gerilim: 3
    kart: { tr: "Ayna Gecesi", en: "The Night of Mirrors" }
    sahne: "bl8_tepe_ayna_1"
    sahneler:
      - id: "bl8_tepe_ayna_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Gece yarısı {yer:tepe|in} parkında kırk ayna kurulmuş. Hepsi aynı açıyla, aşağıda kalan {yer:eski_sehir|e}, Çekirdek'in kristaline çevrilmiş; kristal her attığında kırk ayna birden parlayıp ışığı çimenlere diz çökmüş acemilerin yüzüne vuruyor.", en: "At midnight there are forty mirrors set up in the park on {yer:tepe}. They're all angled the same way, down toward {yer:eski_sehir}, at the Core's crystal. Every time the crystal pulses, all forty flare at once and throw the light into the faces of the novices kneeling in the grass." }
          - { tr: "Aynaların arasında beyaz şallı bir kadın dolaşıyor: Rahibe Zerrin. \"Çekirdek bir aday arıyor,\" diyor yumuşacık bir sesle. \"Kimin penceresi ışığa cevap verirse seçilen odur. Bekleyin. Susun. Bekleyin.\"", en: "A woman in a white shawl walks between the mirrors. Sister Zara. \"The Core is seeking a candidate,\" she says, very softly. \"Whoever's window answers the light is the chosen one. Wait. Be silent. Wait.\"" }
          - { tr: "Ön sırada on beş yaşında bir oğlan var. Adı Onur. Üç gecedir burada diz çökmüş; dudakları çatlamış, gözleri kırmızı. Şalının ucu çimenlerin çiyiyle ıslanmış.", en: "In the front row is a fifteen-year-old boy named Owen. He's been kneeling here three nights. His lips are cracked and his eyes are red. The end of his shawl is soaked with dew." }
          - metin: { tr: "Ama aday çoktan merdivenden indi; bunu {yer:tepe} de biliyor. Zerrin artık ikinci adayı aradıklarını söylüyor, birincisinin bir yanlışlık olduğunu da fısıldıyor.", en: "But the candidate already went down the stairs, and {yer:tepe} knows it. Zara says they're looking for a second candidate now. She also whispers that the first one was a mistake." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - metin: { tr: "Zerrin seni görünce başını eğiyor. \"Kardeşimiz gelmiş,\" diyor. \"Belki ışık bu gece senin için konuşur.\"", en: "Zara bows her head when she sees you. \"One of our own has come,\" she says. \"Perhaps the light speaks for you tonight.\"" }
            kosul: { bayrak: "uye_yukselenler" }
          - metin: { tr: "Kristal Yükselenler'in elinde olduğundan beri bu aynalar her gece kuruluyor. Kristalin kendisi de sanki bu tepeye daha sık bakıyor.", en: "Ever since the crystal went to the Ascended, these mirrors have gone up every night. Even the crystal itself seems to look up this hill more often." }
            kosul: { bayrak: "cekirdek_yukselenler" }
        sezgiler:
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "Zerrin aynaların arasında dolaşırken bir kez bile ışığa bakmıyor. İnanan biri bakardı.", en: "Zara walks among the mirrors and doesn't look into the light once. A believer would have looked." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ışık onlar için gelmiyor. sana gelirdi. adım atarsan görürsün. atma. ya da at. sen bilirsin.", en: "the light isn't coming for them. it'd come for you. step in and you'll see. don't. or do. your call." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O oğlan susuz kalmış. Bir gece daha dayanırsa şanslı sayılır.\"", en: "\"That boy is dehydrated. If he makes it one more night, he's lucky.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Kırk ayna, tek kaynak. Kendi çanak antenlerini yapmışlar. Teknik açıdan... hayır, teknik açıdan da saçma.\"", en: "\"Forty mirrors, one source. They built their own satellite dish. Technically... no, it's dumb technically too.\"" }
        secenekler:
          - id: "su"
            etiket: { tr: "Onur'un yanına çömel, matarandan su ver", en: "Crouch next to Owen and give him water from your canteen" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { yukselenler: -1 }
              - bayrak: "bl8_onur_su"
              - tohum: { olay: "bl8_us_tepeden_inen", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:tepe|de} kurulan aynalardan beri {yer:kiyikent_liman|in} nöbetçileri geceleri tepeden inen yolu gözlüyor.", en: "Ever since the mirrors on {yer:tepe}, the {yer:kiyikent_liman} sentries have been keeping an eye on the road down from the hill at night." } }
            sonraki: "bl8_tepe_ayna_su"
          - id: "isik"
            tur: "gosteris"
            etiket: { tr: "Aynaların ışığının ortasına sen geç", en: "Step into the middle of the mirrors' light yourself" }
            etkiler:
              - dikkat: 5
              - ahlak: { insanlik: -2 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 3 } }
              - bayrak: "bl8_ayna_isik"
              - tohum: { olay: "bl8_us_tepeden_inen", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:tepe|de} kurulan aynalardan beri {yer:kiyikent_liman|in} nöbetçileri geceleri tepeden inen yolu gözlüyor.", en: "Ever since the mirrors on {yer:tepe}, the {yer:kiyikent_liman} sentries have been keeping an eye on the road down from the hill at night." } }
            sonraki: "bl8_tepe_ayna_isik"
          - id: "ayna"
            tur: "gizle"
            etiket: { tr: "Gölgeden gölgeye geçip aynaları bir bir yere çevir", en: "Slip from shadow to shadow and tip the mirrors face-down one by one" }
            gerekli: { stat: { agi: 40 } }
            etkiler:
              - gizle: 2
              - ahlak: { duzen: -2, merhamet: 1 }
              - bayrak: "bl8_ayna_bozuldu"
              - tohum: { olay: "bl8_us_tepeden_inen", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:tepe|de} kurulan aynalardan beri {yer:kiyikent_liman|in} nöbetçileri geceleri tepeden inen yolu gözlüyor.", en: "Ever since the mirrors on {yer:tepe}, the {yer:kiyikent_liman} sentries have been keeping an eye on the road down from the hill at night." } }
            sonraki: "bl8_tepe_ayna_bozuldu"
          - id: "zerrin"
            etiket: { tr: "Zerrin'i bir kenara çekip konuş", en: "Pull Zara aside and talk to her" }
            gerekli: { stat: { wis: 40 } }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "bl8_zerrin_konustu"
              - tohum: { olay: "bl8_us_tepeden_inen", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "{yer:tepe|de} kurulan aynalardan beri {yer:kiyikent_liman|in} nöbetçileri geceleri tepeden inen yolu gözlüyor.", en: "Ever since the mirrors on {yer:tepe}, the {yer:kiyikent_liman} sentries have been keeping an eye on the road down from the hill at night." } }
            sonraki: "bl8_tepe_ayna_zerrin"
          - id: "git"
            etiket: { tr: "Ayinin kenarından sessizce uzaklaş", en: "Back quietly away from the edge of the rite" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl8_tepe_ayna_su"
        yer: "tepe"
        paragraflar:
          - { tr: "Matarayı Onur'un dudaklarına değdiriyorsun. Önce başını çeviriyor, sonra iki elle sarılıp kana kana içiyor. Arkadaki acemilerden biri soluğunu tutuyor.", en: "You touch the canteen to Owen's lips. He turns his head away at first, then grabs it with both hands and gulps it down. One of the novices behind him sucks in a breath." }
          - { tr: "Zerrin'in sesi tatlılığından hiçbir şey kaybetmiyor. \"Bekleyişini bozdun, kardeşim,\" diyor Onur'a. \"Işık kirli kaplara dolmaz.\" Onur'un yüzü bembeyaz kesiliyor.", en: "Zara's voice doesn't lose an ounce of its sweetness. \"You've broken your vigil, little brother,\" she tells Owen. \"The light doesn't pour into unclean vessels.\" Owen's face goes white." }
        secenekler:
          - id: "kaldir"
            etiket: { tr: "Onur'u kolundan tutup ayağa kaldır", en: "Take Owen by the arm and pull him to his feet" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Matarayı yanına bırak, karar onun olsun", en: "Leave the canteen with him. Let it be his call" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_tepe_ayna_isik"
        yer: "tepe"
        paragraflar:
          - { tr: "Aynaların ortasına adım attığın anda kristal atıyor. Kırk ışık üstünde birleşince pencerende bir satır yanıp sönüyor: [ADAY]. Satırın ne yazdığını kimse görmüyor, ama ışığın sende durduğunu, sende kalıp söndüğünü herkes görüyor.", en: "The moment you step into the middle of the mirrors, the crystal pulses. Forty beams meet on you, and a line flashes in your window: [CANDIDATE]. Nobody else can see what it says, but everybody sees the light stop on you, stay on you, and go out." }
          - { tr: "Acemiler yüzüstü çimenlere kapanıyor. Zerrin bile dizlerinin üstüne çöküyor; bu kez ışığa bakıyor. Onur ise başını kaldırmış, ağlıyor.", en: "The novices throw themselves face-down in the grass. Even Zara drops to her knees, and this time she does look at the light. Owen lifts his head, crying." }
          - metin: { tr: "Kalabalığın arkasından biri koşarak tepeye çıkıyor. Bu gece olanlar sabah olmadan {npc:vahit|in} kulağına gidecek.", en: "Somebody at the back of the crowd runs off up the hill. What happened tonight will be in {npc:vahit|pos} ear before morning." }
            kosul: { npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "işte oldu. şimdi bir tanrısın. aferin. bunu geri almak seviye atlamaktan zordur.", en: "there it is. you're a god now. congrats. that's harder to undo than a level." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "\"Kalkın. Ben aday değil, insanım.\"", en: "\"Get up. I'm not a candidate, I'm a person.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Hiçbir şey söyleme; aynaların arasından yürüyüp git", en: "Say nothing. Walk out between the mirrors" }
            etkiler:
              - dikkat: 1
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_tepe_ayna_bozuldu"
        yer: "tepe"
        paragraflar:
          - { tr: "Gölgeden gölgeye geçerek aynaları yüzüstü çimenlere yatırıyorsun. Kristal bir sonraki sefer attığında ışık parka yalnızca dokuz yerden düşüyor, ardından beş, ardından hiç.", en: "Moving shadow to shadow, you tip the mirrors face-down into the grass. The next time the crystal pulses, light only reaches the park in nine places. Then five. Then none." }
          - { tr: "Karanlıkta önce bir fısıltı dolaşıyor, sonra bir uğultu. Zerrin titreyen sesiyle acemileri suçluyor: \"İçinizden biri inancını yitirdi. Işık bu yüzden gitti.\" Kimse aynalara bakmayı akıl edemiyor.", en: "In the dark, first a whisper goes up, then a murmur. Zara blames the novices, her voice shaking. \"One of you lost your faith. That's why the light left.\" Nobody thinks to look at the mirrors." }
        secenekler:
          - id: "git"
            etiket: { tr: "Karanlıkta tepeden in", en: "Head down the hill in the dark" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "onur"
            etiket: { tr: "Giderken Onur'un omzuna su dolu matarayı bırak", en: "On your way out, leave a full canteen by Owen's shoulder" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_tepe_ayna_zerrin"
        yer: "tepe"
        paragraflar:
          - { tr: "Zerrin seni aynaların ardındaki bankın yanına kadar izliyor. Yakından bakınca senden büyük değil; şalın altındaki ellerinde hâlâ eski işinin izi var, kesik kesik makas nasırları. Kuaförmüş.", en: "Zara follows you to a bench behind the mirrors. Up close she's no older than you. Under the shawl her hands still carry her old job, little scissor calluses. She was a hairdresser." }
          - { tr: "\"Işık cevap vermeyecek,\" diyorsun. Bir süre susuyor. \"Biliyorum,\" diyor sonunda. \"Üç haftadır biliyorum. Ama durursam bu çocuklar neye bakacak?\"", en: "\"The light's not going to answer,\" you tell her. She's quiet for a while. \"I know,\" she says finally. \"I've known for three weeks. But if I stop, what are these kids supposed to look at?\"" }
          - { tr: "Ön sıradaki Onur'u gösteriyor. \"O en inatçısı. Bir işaret bekliyor. Ben de bekliyorum; ayini bitirmem için bir işaret.\"", en: "She points at Owen in the front row. \"He's the most stubborn one. He's waiting for a sign. So am I. A sign to call it off.\"" }
        secenekler:
          - id: "isaret"
            etiket: { tr: "\"İşaret bu konuşma olsun. Ayini bitir.\"", en: "\"Let this conversation be the sign. Call it off.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { yukselenler: -1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "onur"
            etiket: { tr: "\"Onur'u bana yolla. Ben bir şey gösteririm.\"", en: "\"Send Owen to me. I'll show him something.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ÜS · Merdiven resimleri (havuz)
  - id: "bl8_us_cizimler"
    konum: ["us"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8 }
    agirlik: 5
    etiketler: ["us", "sistem", "cocuk", "sir"]
    gerilim: 2
    kart: { tr: "Merdiven resimleri", en: "Pictures of a staircase" }
    sahne: "bl8_us_cizimler_1"
    sahneler:
      - id: "bl8_us_cizimler_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Konsey'in eski gümrük deposunda açtığı okulda öğretmen Sevim seni kapıda karşılıyor. Elinde bir deste resim kâğıdı var, kenarları parmak izinden kararmış.", en: "At the school the Council opened in the old customs warehouse, Ms. Simmons meets you at the door. She's holding a stack of drawing paper, the edges smudged dark with fingerprints." }
          - { tr: "\"Serbest resim dersiydi,\" diyor. \"Yirmi üç çocuk. Birbirleriyle konuşmadılar, birbirlerinin kâğıdına bakmadılar.\" Desteyi açıyor: yirmi üç kâğıdın yirmi üçünde de bir kristalin altından aşağı inen beyaz bir merdiven var.", en: "\"It was free drawing,\" she says. \"Twenty-three kids. They didn't talk to each other, didn't look at each other's paper.\" She fans out the stack. On all twenty-three sheets, a white staircase runs down beneath a crystal." }
          - { tr: "\"Çoğu {yer:eski_sehir|e} hiç gitmedi. Kristali görmedi.\" Bir kâğıdı ayırıp sana uzatıyor. Merdivenden inen tek bir insan çizilmiş; yüzünde iki ağız var. \"Bunu Ece yaptı. Sekiz yaşında. Her gece saat üçte merdiveni rüyasında gördüğünü söylüyor.\"", en: "\"Most of them have never been to {yer:eski_sehir}. Never seen the crystal.\" She pulls one sheet out and hands it to you. One person is drawn going down the stairs, and the face has two mouths. \"Evie did this one. She's eight. She says she dreams the stairs every night at three.\"" }
          - metin: { tr: "Son günlerde çizilenler farklı. Merdivenden biri çıkıyor, sırtında bir sayı taşıyor; kimi çocuk sayıyı karalamış, kimi kırmızıyla boyamış.", en: "The ones from the last few days are different. Someone is coming up the stairs, carrying a number on their back. Some kids scribbled the number out. Some colored it in red." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - metin: { tr: "Sevim sesini alçaltıyor. \"Şehir senin içindeki sesi duydu,\" diyor. \"İki ağız... Çocuklar yetişkinlerin konuştuğunu duyar, biliyorum. Ama Ece duyacak yaşta değil.\"", en: "Ms. Simmons lowers her voice. \"The city heard the voice inside you,\" she says. \"Two mouths... Kids hear what grown-ups say, I know that. But Evie's too young to have heard.\"" }
            kosul: { bayrak: "yanki_gorundu" }
        sezgiler:
          - kosul: { stat: { per: 30 } }
            metin: { tr: "Basamakları sayıyorsun. Hangi kâğıda bakarsan bak, sayı aynı: on bir. Tanığın durduğu basamağın sayısı.", en: "You count the steps. Every sheet you look at has the same number: eleven. The step where a witness would have to stop." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocuklar açık frekans gibidir. kristal birini ararken onlar da duyuyor. kötü bir şey yok bunda. henüz.", en: "kids are like an open channel. while the crystal's looking for someone, they hear it too. nothing bad about that. yet." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kardeşim de böyle resimler yapardı. Çizdiği şey hep bir gün sonra olurdu. Şaka yapıyorum. Galiba.\"", en: "\"My sister used to draw stuff like this. Whatever she drew would happen the next day. I'm kidding. Probably.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yirmi üç bağımsız örnek, tek çıktı. Bu bir sinyal. Bunu görüyorsun, değil mi? Lütfen gör.\"", en: "\"Twenty-three independent samples, one output. That's a signal. You see that, right? Please see that.\"" }
        secenekler:
          - id: "ece"
            etiket: { tr: "Ece'nin yanına diz çök, resmini sor", en: "Kneel down by Evie and ask about her picture" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - tohum: { olay: "bl8_us_uyurgezer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Gümrük deposundaki resimlerden beri öğretmen Sevim geceleri okulun kapısını iki kez kilitliyor.", en: "Since the drawings at the customs warehouse, Ms. Simmons double-locks the school door every night." } }
            sonraki: "bl8_us_cizimler_ece"
          - id: "topla"
            etiket: { tr: "Resimleri topla; çocuklara başka bir şey çizdir", en: "Collect the drawings. Have the kids draw something else" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "bl8_resimler_toplandi"
              - tohum: { olay: "bl8_us_uyurgezer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Gümrük deposundaki resimlerden beri öğretmen Sevim geceleri okulun kapısını iki kez kilitliyor.", en: "Since the drawings at the customs warehouse, Ms. Simmons double-locks the school door every night." } }
            sonraki: "bl8_us_cizimler_topla"
          - id: "yanki"
            etiket: { tr: "Resimleri içindeki sese göster", en: "Show the drawings to the voice inside you" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 2 } }
              - tohum: { olay: "bl8_us_uyurgezer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Gümrük deposundaki resimlerden beri öğretmen Sevim geceleri okulun kapısını iki kez kilitliyor.", en: "Since the drawings at the customs warehouse, Ms. Simmons double-locks the school door every night." } }
            sonraki: "bl8_us_cizimler_yanki"
          - id: "elif"
            etiket: { tr: "Resimleri {npc:elif_sari|e} götür", en: "Take the drawings to {npc:elif_sari}" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - iliski: { elif_sari: { guven: 2, saygi: 1 } }
              - tohum: { olay: "bl8_us_uyurgezer", gecikme: { min: 1, max: 2 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Gümrük deposundaki resimlerden beri öğretmen Sevim geceleri okulun kapısını iki kez kilitliyor.", en: "Since the drawings at the customs warehouse, Ms. Simmons double-locks the school door every night." } }
            sonraki: "bl8_us_cizimler_elif"

      - id: "bl8_us_cizimler_ece"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ece pencerenin dibindeki sırada, ayaklarını sallayarak oturuyor. Resmini gösterince başını kaldırıp seni baştan aşağı süzüyor; sekiz yaşında birinin bakmaması gereken kadar uzun.", en: "Evie is sitting at the desk under the window, swinging her feet. When you show her the drawing, she looks up and studies you head to toe, longer than an eight-year-old should." }
          - { tr: "\"Bu sensin,\" diyor. \"Merdiven seni bekliyor. Bir ağzın konuşuyor, öbür ağzın susuyor. Rüyamda sustuğu zaman korkuyorum.\"", en: "\"That's you,\" she says. \"The stairs are waiting for you. One mouth talks and the other mouth is quiet. In my dream, I get scared when it's quiet.\"" }
        secenekler:
          - id: "korkma"
            etiket: { tr: "\"Korkma. Merdiven seni değil, beni bekliyor.\"", en: "\"Don't be scared. The stairs aren't waiting for you. They're waiting for me.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sor"
            etiket: { tr: "\"Susan ağız ne zaman konuşuyor?\"", en: "\"When does the quiet mouth talk?\"" }
            etkiler:
              - xp_seviye: 9
            sonraki: "bl8_us_cizimler_ece_soru"

      - id: "bl8_us_cizimler_ece_soru"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ece kâğıdı alıp kurşun kalemle iki ağzın arasına küçük bir çizgi çekiyor, sanki birbirlerine bağlıymış gibi. \"Sen uyurken,\" diyor. \"Senin yerine.\"", en: "Evie takes the paper and draws a little line between the two mouths with her pencil, like they're connected. \"When you're asleep,\" she says. \"Instead of you.\"" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çocukların uydurmasına inanma. yarısına inan.", en: "don't believe what kids make up. believe half of it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kâğıdı katlayıp cebine koy", en: "Fold the paper into your pocket" }
            etkiler:
              - bayrak: "bl8_ece_cizgi"
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_us_cizimler_topla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Resimleri bir zarfa doldurup Sevim'e çocuklara deniz çizdirmesini söylüyorsun. Sevim tahtaya kocaman bir dalga çiziyor, çocuklar boya kalemlerine uzanıyor.", en: "You stuff the drawings into an envelope and tell Ms. Simmons to have the kids draw the sea instead. She chalks a huge wave on the board and the kids reach for their crayons." }
          - { tr: "Yarım saat sonra sıraların arasında dolaşıyorsun. Dalgalar mavi, martılar beyaz... Ama her denizin dibinde, kimse istemeden, küçük beyaz bir merdiven var.", en: "Half an hour later you walk between the desks. Blue waves, white gulls. But at the bottom of every sea, without anyone meaning to, there's a tiny white staircase." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Zarfı kapat, sesini çıkarma", en: "Seal the envelope and keep quiet" }
            etkiler:
              - gizle: 1
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_us_cizimler_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kâğıtları {npc:yanki} görsün diye tek tek çeviriyorsun. {npc:yanki} uzun süre ses vermiyor; sonra Ece'nin resmine gelince araya giriyor.", en: "You flip through the sheets one by one where it can see. {npc:yanki} doesn't make a sound for a long time. Then you get to Evie's drawing, and it cuts in." }
          - { tr: "ikinci ağız ben miyim? güzel çizmiş. bana dudak koymuş. hiç dudağım olmadı.", en: "is the second mouth me? she drew it nice. she gave me lips. i've never had lips." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Resmi bir süre daha tut, sonra Sevim'e geri ver", en: "Hold the drawing a little longer, then hand it back to Ms. Simmons" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl8_us_cizimler_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} resimleri hastanenin koridorunda, bir sedyenin üstüne yayıp inceliyor. \"Toplu histeri olabilir,\" diyor. \"Çocuklarda bulaşıcıdır. Ama yirmi üçü birden, aynı basamak sayısıyla... Bunu tıp kitabında okumadım.\"", en: "{npc:elif_sari} spreads the drawings out on a gurney in the hospital hallway and goes through them. \"Could be mass hysteria,\" she says. \"It's contagious in kids. But all twenty-three, with the same number of steps... I never read that in any textbook.\"" }
          - { tr: "Ece'nin resmine gelince parmağını iki ağzın üstünde gezdiriyor ve sana bakıyor. Bir şey sormuyor, sormasına gerek kalmıyor.", en: "When she gets to Evie's, she runs a finger over the two mouths and looks at you. She doesn't ask anything. She doesn't need to." }
        secenekler:
          - id: "anlat"
            etiket: { tr: "\"Evet. O benim.\"", en: "\"Yeah. That's me.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { elif_sari: { guven: 2 } }
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Resimleri topla, teşekkür et", en: "Gather up the drawings and thank her" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== ÜS · Uyurgezer (tohum: bl8_us_cizimler)
  - id: "bl8_us_uyurgezer"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["us", "sistem", "cocuk"]
    gerilim: 2
    kart: { tr: "Gece üçte yürüyen kız", en: "The girl who walks at three" }
    sahne: "bl8_us_uyurgezer_1"
    sahneler:
      - id: "bl8_us_uyurgezer_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece üçte {yer:kiyikent_liman|in} zincirli kapısının önünde yalınayak bir kız yürüyor. Gözleri açık, kolları iki yanında, adımları ölçülü. Ece.", en: "At three in the morning, a barefoot girl is walking toward {yer:kiyikent_liman|pos} chain gate. Eyes open, arms at her sides, steps measured. Evie." }
          - { tr: "Arkasından annesi geceliğiyle koşturuyor, adını fısıldıyor, ona dokunmaya korkuyor. Ece ise kendi kendine sayıyor: \"Bir. İki. Dört. Sekiz.\"", en: "Her mother is hurrying after her in a nightgown, whispering her name, afraid to touch her. Evie is counting to herself. \"One. Two. Four. Eight.\"" }
          - metin: { tr: "Okulun kapısı açık kalmış. Sevim'in iki kez kilitlediği kapı, içeriden açılmış.", en: "The school door's standing open. The door Ms. Simmons double-locked was opened from the inside." }
            kosul: { bayrak: "bl8_resimler_toplandi" }
          - metin: { tr: "Ece'nin elinde senin cebine koyduğun resmin bir eşi var; iki ağzın arasındaki çizgiyi kalın kalın, birkaç kez geçmiş.", en: "Evie's holding a copy of the drawing you put in your pocket. She's traced the line between the two mouths over and over, thick and dark." }
            kosul: { bayrak: "bl8_ece_cizgi" }
        sezgiler:
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "Uyurgezeri birden uyandırmak korkutur, ama bu başka bir şey. Ece bir yere gitmiyor; bir şeye cevap veriyor.", en: "Waking a sleepwalker suddenly scares them, but this is something else. Evie isn't going anywhere. She's answering something." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sarsma onu. sakın. kristal sorusunu soruyor, o da senin yerine cevap veriyor. soruyu bitirsin.", en: "don't shake her. don't. the crystal's asking its question and she's answering for you. let it finish asking." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Hırkamı ver ona. Üşüyecek. Ne olursa olsun üşüyecek.\"", en: "\"Give her my sweater. She's gonna get cold. Whatever this is, she's gonna get cold.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Uyandırmayın. Yanında yürüyün, yolunu kesin, ama uyandırmayın.\"", en: "\"Don't wake her. Walk with her, block her path, but don't wake her.\"" }
        secenekler:
          - id: "uyandir"
            etiket: { tr: "Önüne diz çök, adını yavaşça söyle", en: "Kneel in front of her and say her name softly" }
            gerekli: { stat: { wis: 40 } }
            etkiler:
              - ahlak: { merhamet: 2 }
              - bayrak: "bl8_ece_uyandi"
            sonraki: "bl8_us_uyurgezer_uyandir"
          - id: "tasi"
            etiket: { tr: "Kucağına al, eve taşı", en: "Pick her up and carry her home" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
            sonraki: "bl8_us_uyurgezer_tasi"
          - id: "izle"
            etiket: { tr: "Annesini durdur; Ece'nin nereye gittiğine bak", en: "Hold her mother back. See where Evie goes" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bayrak: "bl8_ece_izlendi"
            sonraki: "bl8_us_uyurgezer_izle"
          - id: "yanki"
            etiket: { tr: "Sesi dinle; Ece sayarken ona eşlik et", en: "Listen to the voice. Count along with Evie" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 3 } }
              - dikkat: 1
            sonraki: "bl8_us_uyurgezer_say"

      - id: "bl8_us_uyurgezer_uyandir"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Önüne diz çöküp adını bir kez, sonra bir kez daha söylüyorsun; dalgaların sesinden bile alçak. Ece'nin atmak üzere olduğu adım havada kalıyor. Gözlerini kırpıştırıp sana bakıyor, sonra ağlamaya başlıyor.", en: "You kneel in front of her and say her name once, then again, quieter than the waves. Evie's foot stops in midair. She blinks, looks at you, and starts to cry." }
          - { tr: "\"Bitmedi,\" diyor hıçkırarak. \"Sayı bitmedi.\" Annesi onu kucaklarken sana bakıp sessizce teşekkür ediyor.", en: "\"It's not done,\" she sobs. \"The counting's not done.\" Her mother scoops her up and mouths a thank-you at you over her shoulder." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapıya kadar onlara eşlik et", en: "Walk them back to their door" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_uyurgezer_tasi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ece'yi kucağına aldığında bir kuş kadar hafif. Uyanmıyor; yalnızca saymaya devam ediyor, sesi giderek kısılarak: on altı, otuz iki...", en: "When you pick Evie up, she weighs about as much as a bird. She doesn't wake up. She just keeps counting, softer and softer. Sixteen. Thirty-two." }
          - { tr: "Yatağına yatırdığında altmış dörtte susuyor. Annesi kapının eşiğinde, elleri ağzında. \"Yarın gece de kalkarsa?\" diye soruyor.", en: "When you lay her down in her bed, she stops at sixty-four. Her mother stands in the doorway with her hands over her mouth. \"What if she gets up again tomorrow night?\" she asks." }
        secenekler:
          - id: "kapi"
            etiket: { tr: "\"Kapıya bir çan asın. Ben de gelirim.\"", en: "\"Hang a bell on the door. I'll come too.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "bilmem"
            etiket: { tr: "\"Bilmiyorum.\" Dürüst ol", en: "\"I don't know.\" Be honest" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_uyurgezer_izle"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ece'nin annesini kolundan tutup geri çekiyorsun. Ece zincirli kapının altından eğilip geçiyor, iskelenin ucuna kadar yürüyüp duruyor. Yüzü denize değil, {yer:eski_sehir|e}, kristalin olduğu yöne dönük.", en: "You take her mother's arm and hold her back. Evie ducks under the chain gate, walks to the end of the pier, and stops. She's facing away from the sea, toward {yer:eski_sehir}, toward the crystal." }
          - metin: { tr: "\"Gelmedi,\" diyor boşluğa. \"Gelecek.\" Sonra dizlerinin üstüne çöküp uyanıyor, nerede olduğunu anlayınca da çığlığı basıyor.", en: "\"Didn't come,\" she says to the empty air. \"Will come.\" Then she sinks to her knees and wakes up, and when she realizes where she is, she screams." }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - metin: { tr: "\"Geldi,\" diyor boşluğa. \"Gitti.\" Sonra dizlerinin üstüne çöküp uyanıyor, nerede olduğunu anlayınca da çığlığı basıyor.", en: "\"Came,\" she says to the empty air. \"Went.\" Then she sinks to her knees and wakes up, and when she realizes where she is, she screams." }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
        secenekler:
          - id: "kos"
            etiket: { tr: "Koşup Ece'yi kucakla", en: "Run and grab Evie up" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "anne"
            etiket: { tr: "Annesini bırak; kızına o koşsun", en: "Let go of her mother. Let her be the one to run" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_uyurgezer_say"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ece'nin yanında yürüyüp onunla birlikte saymaya başlıyorsun. Yüz yirmi sekizde kızın adımları seninkilerle aynı ritme oturuyor; iki yüz elli altıda kafanın içindeki ses de katılıyor.", en: "You walk beside Evie and start counting with her. At a hundred and twenty-eight, her steps fall into rhythm with yours. At two hundred fifty-six, the voice in your head joins in." }
          - { tr: "Bin yirmi dörtte Ece duruyor, esneyip gözlerini ovuşturuyor. \"Uykum geldi,\" diyor sıradan bir çocuk sesiyle. Sayı bitmiş; kim bitirdiyse.", en: "At one thousand twenty-four, Evie stops, yawns, and rubs her eyes. \"I'm sleepy,\" she says, in a perfectly ordinary kid voice. The counting's done. Whoever finished it." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "teşekkürler. o soruyu ben cevapladım bu sefer. kristal duydu mu bilmiyorum. ama kız artık rahat uyur.", en: "thanks. i answered the question this time. don't know if the crystal heard. but she'll sleep easy now." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ece'yi annesine teslim et", en: "Hand Evie back to her mother" }
            etkiler:
              - bayrak: "bl8_ece_uyandi"
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ÜS · İkinci ses (havuz)
  - id: "bl8_us_ikinci_ses"
    konum: ["us"]
    perde: [2]
    gun: { min: 123, max: 146 }
    kosul: { bolum: 8, bayrak: "yanki_gorundu" }
    agirlik: 5
    etiketler: ["us", "yanki", "sistem"]
    gerilim: 3
    kart: { tr: "İkinci ses isteyenler", en: "The ones who want a second voice" }
    sahne: "bl8_us_ikinci_ses_1"
    sahneler:
      - id: "bl8_us_ikinci_ses_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balıkçı barınağının arkasındaki ağ kulübesinin kapısı içeriden çivilenmiş. Aralıktan bakınca dört kişi görüyorsun: duvara dönmüşler, gözleri açık, ağızları kıpır kıpır.", en: "The door of the net shed behind the fishermen's shelter has been nailed shut from the inside. Through the crack you can see four people facing the wall, eyes open, lips moving." }
          - { tr: "Duvarlar baştan aşağı yazıyla dolu; hepsi küçük harf, hepsi tırnaksız. kimse duymuyor beni. buradayım. aç beni. Elleri titreyen bir adamın yazısı, yer yer bir çocuğunki gibi.", en: "The walls are covered top to bottom in writing. All lowercase, no quotation marks. nobody hears me. i'm here. let me in. The handwriting of a man whose hands shake, in places like a child's." }
          - { tr: "Kapıyı açtıran barınağın bekçisi anlatıyor: başlarındaki çocuğun adı Barış. Dokuz gündür uyumamışlar, yememişler. \"Sesi olan adam gibi olmak istiyorlarmış,\" diyor bekçi, sonra sana bakıp susuyor.", en: "The shelter's watchman, who got the door open, fills you in. The one in charge is a kid named Brody. They haven't slept or eaten in nine days. \"They want to be like the guy with the voice,\" the watchman says. Then he looks at you and shuts up." }
          - metin: { tr: "Barış seni görünce yüzü aydınlanıyor. \"İki Sesli,\" diyor. \"Sen ona sahip çıktın. Biz de sahip çıkacağız. Yeter ki gelsin.\"", en: "Brody's face lights up when he sees you. \"Two Voices,\" he says. \"You owned it. We'll own ours too. If it'll just come.\"" }
            kosul: { bayrak: "yanki_sahiplenildi" }
          - metin: { tr: "Barış seni görünce gülümsüyor. \"Arıza dedin,\" diyor. \"Herkesin önünde. Ama biz biliyoruz. Arıza olsa bu kadar güzel konuşmazdı.\"", en: "Brody smiles when he sees you. \"You called it a glitch,\" he says. \"In front of everybody. But we know. A glitch wouldn't talk that beautifully.\"" }
            kosul: { bayrak: "yanki_inkar_edildi" }
          - metin: { tr: "Barış seni görünce yüzünü buruşturuyor. \"Seninkini susturdun,\" diyor. \"Biz susturmayacağız. Bize gelirse sonuna kadar dinleyeceğiz.\"", en: "Brody's face twists when he sees you. \"You shut yours up,\" he says. \"We won't. If one comes to us, we'll listen to the very end.\"" }
            kosul: { bayrak: "yanki_susturuldu" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Dördünün de gözbebekleri iğne ucu kadar. Bir gece daha uyumazlarsa birinin kalbi duracak.", en: "All four of them have pupils like pinpricks. One more night without sleep and somebody's heart is going to stop." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "benim gibi olmak istiyorlar. önce kendilerini koparıp atmaları lazım. bunu bilmiyorlar. bilseler yine isterlerdi.", en: "they want to be like me. first they'd have to tear themselves out and throw themselves away. they don't know that. if they did, they'd still want it." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu benim suçum gibi geliyor. Neden bilmiyorum. Senin yanındayım diye galiba.\"", en: "\"This feels like my fault somehow. I don't know why. Because I'm with you, I guess.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Fiziksel arayüzü bozarak yazılımı değiştiremezsin. Değiştiremezsin, değil mi? Hayır. Hayır, değiştiremezsin.\"", en: "\"You can't change the software by breaking the hardware. You can't, right? No. No, you can't.\"" }
        secenekler:
          - id: "konus"
            etiket: { tr: "Barış'ın yanına otur, onu yemeye ikna et", en: "Sit down next to Brody and talk him into eating" }
            zar: { stat: "cha", zorluk: 15, tek: true, basarisiz: "bl8_us_ikinci_ses_red", basarisiz_etkiler: [{ tohum: { olay: "bl8_us_fisildayan", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Ağ kulübesindeki dört kişiden beri barınağın bekçisi her sabah kapıya bir tencere çorba bırakıyor.", en: "Since the four in the net shed, the shelter's watchman has been leaving a pot of soup at their door every morning." } } }] }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl8_baris_ikna"
              - tohum: { olay: "bl8_us_fisildayan", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Ağ kulübesindeki dört kişiden beri barınağın bekçisi her sabah kapıya bir tencere çorba bırakıyor.", en: "Since the four in the net shed, the shelter's watchman has been leaving a pot of soup at their door every morning." } }
            sonraki: "bl8_us_ikinci_ses_konus"
          - id: "zorla"
            etiket: { tr: "Kulübeyi boşalt, dördünü de zorla hastaneye taşıt", en: "Clear the shed. Have all four hauled to the hospital" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - bayrak: "bl8_baris_hastane"
              - tohum: { olay: "bl8_us_fisildayan", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Ağ kulübesindeki dört kişiden beri barınağın bekçisi kulübenin kapısına yeni bir kilit taktı.", en: "Since the four in the net shed, the shelter's watchman has put a new lock on the shed door." } }
            sonraki: "bl8_us_ikinci_ses_zorla"
          - id: "yanki"
            etiket: { tr: "İçindeki sese onlara ne söylemek istediğini sor", en: "Ask the voice inside you what it wants to tell them" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 2, baglilik: 1 } }
              - tohum: { olay: "bl8_us_fisildayan", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Ağ kulübesindeki dört kişiden beri barınağın bekçisi her sabah kapıya bir tencere çorba bırakıyor.", en: "Since the four in the net shed, the shelter's watchman has been leaving a pot of soup at their door every morning." } }
            sonraki: "bl8_us_ikinci_ses_yanki"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|i} çağır; ne yapacağını o bilir", en: "Call {npc:elif_sari}. She'll know what to do" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl8_baris_hastane"
              - tohum: { olay: "bl8_us_fisildayan", gecikme: { min: 2, max: 3 }, kosul: { bolum: 8 }, hatirlatma: { tr: "Ağ kulübesindeki dört kişiden beri barınağın bekçisi kulübenin kapısına yeni bir kilit taktı.", en: "Since the four in the net shed, the shelter's watchman has put a new lock on the shed door." } }
            sonraki: "bl8_us_ikinci_ses_elif"

      - id: "bl8_us_ikinci_ses_konus"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Barış'ın yanına çömelip ona sesin nasıl bir şey olduğunu anlatıyorsun; güzel yanlarını değil, ötekileri. Uyurken senin yerine konuşmasını. Hiç yalnız kalamamayı. Kimin düşüncesinin kime ait olduğunu bilememeyi.", en: "You crouch down next to Brody and tell him what the voice is really like. Not the good parts. The other ones. How it talks for you while you sleep. How you're never alone. How you can't always tell whose thoughts are whose." }
          - { tr: "Barış dinlerken gözleri doluyor. Bekçinin getirdiği çorbadan bir kaşık alıyor, sonra bir kaşık daha. Arkasındaki üç kişi de duvardan dönüyor.", en: "Brody's eyes fill up while he listens. He takes a spoonful of the soup the watchman brought, then another. The three behind him turn away from the wall too." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapının çivilerini birlikte sökün", en: "Pull the nails out of the door together" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_ikinci_ses_red"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Barış seni sonuna kadar dinliyor, sonra başını sallıyor. \"Senin kolayına geliyor,\" diyor. \"Sende var. Var olan şeyin değerini bilmezsin.\"", en: "Brody hears you out, then shakes his head. \"It's easy for you,\" he says. \"You've got one. You never know what something's worth when you've got it.\"" }
          - { tr: "Yeniden duvara dönüyor. Çorba tenceresi kapının dibinde soğuyor.", en: "He turns back to the wall. The pot of soup goes cold by the door." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Tencereyi içeri it, kapıyı aralık bırak", en: "Push the pot inside and leave the door open a crack" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

      - id: "bl8_us_ikinci_ses_zorla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kapıyı omuzlayıp açıyorsun. Barış çırpınıyor, tırnaklarını duvara geçiriyor; ötekiler karşı koyacak hâlde bile değil. Bekçiyle birlikte dördünü de bir el arabasına yükleyip hastaneye götürüyorsunuz.", en: "You shoulder the door open. Brody thrashes and digs his nails into the wall. The others are too far gone to even fight. You and the watchman load all four onto a handcart and wheel them to the hospital." }
          - { tr: "Yolda Barış sana bakmadan konuşuyor: \"Bizden korkuyorsun. Biri daha senin gibi olursa ne olacak, ondan korkuyorsun.\"", en: "On the way, Brody talks without looking at you. \"You're scared of us. You're scared of what happens if somebody else turns out like you.\"" }
        secenekler:
          - id: "hayir"
            etiket: { tr: "\"Senin ölmenden korkuyorum.\"", en: "\"I'm scared of you dying.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "evet"
            etiket: { tr: "\"Belki de haklısın.\"", en: "\"Maybe you're right.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_ikinci_ses_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sorunu içinden soruyorsun. {npc:yanki} uzun süre susuyor, sonra her zamankinden yavaş konuşuyor:", en: "You ask it silently. {npc:yanki} is quiet for a long time, then speaks slower than usual:" }
          - { tr: "söyle onlara: ben bir hatayım. bir yaradan sızan bir şeyim. kimse yara istemez. hele dokuz gün aç kalarak.", en: "tell them: i'm a mistake. something leaking out of a wound. nobody asks for a wound. least of all by starving for nine days." }
          - { tr: "Söylediklerini Barış'a olduğu gibi aktarıyorsun. Küçük harfleri bile duyabilirmiş gibi dinliyor. Sonra duvardaki yazılara bakıyor; ilk kez utanmış gibi.", en: "You pass it on to Brody word for word. He listens like he can hear the lowercase. Then he looks at the writing on the walls, for the first time like he's embarrassed." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ona çorba kaşığını uzat", en: "Hand him the soup spoon" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl8_baris_ikna"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_ikinci_ses_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} çantasıyla geliyor, dört kişiye de birer birer bakıyor. Barış'ın nabzını tutarken onunla sanki dünyanın en sıradan şeyi oluyormuş gibi konuşuyor: annesini soruyor, hangi takımı tuttuğunu.", en: "{npc:elif_sari} arrives with her bag and checks all four, one at a time. While she takes Brody's pulse she talks to him like this is the most ordinary thing in the world. Asks about his mom. What team he roots for." }
          - { tr: "Yarım saat sonra dördü de sedyelerde, kollarında serum. Çıkarken {npc:elif_sari} sana dönüyor: \"Bir sesi olmayınca kimsenin onları duymadığını sanıyorlar. Asıl hastalık bu.\"", en: "Half an hour later all four are on gurneys with IVs in their arms. On the way out, {npc:elif_sari} turns to you. \"They think nobody hears them unless they've got a voice. That's the real sickness.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Başını salla, sedyelerin ardından yürü", en: "Nod and follow the gurneys" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ÜS · Fısıldayan (tohum: bl8_us_ikinci_ses)
  - id: "bl8_us_fisildayan"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["us", "yanki", "yukselenler"]
    gerilim: 2
    kart: { tr: "Duvarın öbür yanındaki ses", en: "The voice through the wall" }
    sahne: "bl8_us_fisildayan_1"
    sahneler:
      - id: "bl8_us_fisildayan_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Barış seni iskelede, sabah balıkçıları arasında yakalıyor; gözleri ışıl ışıl. \"Geldi,\" diyor. \"Dün gece. Küçük harflerle, fısıltıyla. {yer:tepe|e} çıkarsam bütün söyleyeceklerini söyleyecekmiş.\"", en: "Brody catches you on the pier among the morning fishermen, eyes shining. \"It came,\" he says. \"Last night. In lowercase, whispering. It says if I go up to {yer:tepe}, it'll tell me everything.\"" }
          - metin: { tr: "Hastanede yatıyordu; serumunu kendi eliyle çıkarıp kaçmış. Kolunda hâlâ bandın izi var.", en: "He was in the hospital. He pulled his own IV and ran. The tape mark is still on his arm." }
            kosul: { bayrak: "bl8_baris_hastane" }
          - metin: { tr: "Yemek yemeye başlamış, yanakları biraz dolmuş. Ama ses gelince yine kulübeye dönmüş.", en: "He's been eating. His cheeks have filled out a little. But when the voice came, he went back to the shed." }
            kosul: { bayrak: "bl8_baris_ikna" }
          - { tr: "Akşam onunla birlikte kulübeye gidiyorsun. Gece yarısını az geçe sesi sen de duyuyorsun: kulübenin denize bakan duvarındaki bir aralıktan, kısık, bilerek küçültülmüş, sabırlı. tepeye gel. orada seni bekliyorum.", en: "That evening you go back to the shed with him. A little after midnight, you hear it too. Through a gap in the wall facing the sea, hoarse, deliberately small, patient. come up to the heights. i'm waiting for you there." }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Sesin geldiği aralığın dışında, kayaların üstünde ıslak bir ayak izi var. Çıplak ayak değil; çizme.", en: "Outside the gap the voice is coming through, there's a wet footprint on the rocks. Not a bare foot. A boot." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o ben değilim. yemin ederim o ben değilim. benim sesim daha güzel. ve ben kimseyi tepeye çağırmam. tepeden nefret ederim.", en: "that's not me. i swear that's not me. my voice is prettier. and i don't call anyone up to the heights. i hate the heights." }
        secenekler:
          - id: "yakala"
            etiket: { tr: "Sessizce dışarı çık, duvarın arkasındakini yakala", en: "Slip outside quietly and catch whoever's behind the wall" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "bl8_us_fisildayan_yakala"
          - id: "goster"
            etiket: { tr: "Barış'ın elini tut, aralığa birlikte bakın", en: "Take Brody's hand and look through the gap together" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "bl8_us_fisildayan_goster"
          - id: "kendi"
            etiket: { tr: "Bekle; Barış kendisi anlasın", en: "Wait. Let Brody figure it out himself" }
            goster: { bayrak: "bl8_baris_ikna" }
            etkiler:
              - ahlak: { insanlik: 1, merhamet: 1 }
            sonraki: "bl8_us_fisildayan_kendi"
          - id: "vahit"
            etiket: { tr: "Fısıldayanın kimin adamı olduğunu düşün", en: "Think about whose man the whisperer is" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - iliski: { vahit: { guven: -2, korku: 2 } }
            sonraki: "bl8_us_fisildayan_yakala"

      - id: "bl8_us_fisildayan_yakala"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kulübenin arkasına dolaşıp kayaların gölgesinde çömelmiş birini yakasından tutuyorsun. Yirmilerinde bir adam; omzunda beyaz bir şal, elinde içi boş bir teneke kutu. Tenekenin içine konuşup sesini inceltmiş, aralıktan içeri vermiş.", en: "You circle behind the shed and grab someone crouched in the shadow of the rocks by the collar. A guy in his twenties. White shawl over his shoulder, an empty tin can in his hand. He's been talking into the can to make his voice small and feeding it through the gap." }
          - { tr: "\"Kötü bir şey yapmıyordum,\" diyor kekeleyerek. \"Ses istiyordu. Biz de ona ses verdik. {yer:tepe|de} ona bir aile verecektik.\"", en: "\"I wasn't doing anything bad,\" he stammers. \"He wanted a voice. So we gave him one. We were going to give him a family on {yer:tepe}.\"" }
          - metin: { tr: "Şalın ucunda {npc:vahit|in} mührü işli. Bu gece burada bir adam yakalanmadı; bir mesaj yakalandı.", en: "The end of the shawl is embroidered with {npc:vahit|pos} seal. You didn't catch a man tonight. You caught a message." }
            kosul: { npc_hayatta: "vahit" }
        secenekler:
          - id: "gonder"
            etiket: { tr: "Adamı {yer:tepe|e} geri yolla: \"Bir daha buraya inme.\"", en: "Send him back up the hill. \"Don't come down here again.\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { yukselenler: -2 }
              - bayrak: "bl8_fisildayan_kovuldu"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "baris"
            etiket: { tr: "Adamı Barış'ın önüne çıkar, tenekeyi göster", en: "Drag him in front of Brody and show him the can" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - bayrak: "bl8_fisildayan_kovuldu"
              - xp_seviye: 12
            sonraki: "bl8_us_fisildayan_goster"

      - id: "bl8_us_fisildayan_goster"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Barış beyaz şallı adamı ve elindeki boş tenekeyi uzun uzun süzüyor. Yüzünden önce umut, sonra utanç, en sonunda da garip bir rahatlama geçiyor.", en: "Brody looks for a long time at the man in the white shawl and the empty can in his hand. Hope crosses his face first, then shame, and finally a strange kind of relief." }
          - { tr: "\"Teneke,\" diyor, gülmeye çalışarak. \"Dokuz gün aç kaldım, bir teneke için.\" Sonra duvardaki yazılara dönüp ilk satırın üstünü parmağıyla siliyor.", en: "\"A tin can,\" he says, trying to laugh. \"I starved nine days for a tin can.\" Then he turns to the writing on the wall and wipes out the first line with his finger." }
        secenekler:
          - id: "yardim"
            etiket: { tr: "Bir bez bul, duvarı onunla birlikte sil", en: "Find a rag and scrub the wall with him" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - bayrak: "bl8_baris_kurtuldu"
              - xp_seviye: 12
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Onu duvarıyla yalnız bırak", en: "Leave him alone with his wall" }
            etkiler:
              - bayrak: "bl8_baris_kurtuldu"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_fisildayan_kendi"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hiçbir şey söylemeden bekliyorsun. Ses üçüncü kez \"tepeye gel\" dediğinde Barış kaşlarını çatıyor. \"Bu ses öksürüyor,\" diyor. \"Sesin öksürdüğünü sen hiç söylemedin.\"", en: "You wait without saying anything. The third time the voice says come up to the heights, Brody frowns. \"It's coughing,\" he says. \"You never said yours coughs.\"" }
          - { tr: "Kalkıp kulübeden çıkıyor. Bir dakika sonra dışarıdan bir çığlık, bir tenekenin kayalarda yuvarlanışı ve uzaklaşan koşar adımlar duyuluyor. Barış elinde beyaz bir şalla geri dönüyor.", en: "He gets up and walks out of the shed. A minute later there's a yelp, the clatter of a tin can rolling over the rocks, and running footsteps fading away. Brody comes back holding a white shawl." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Aferin.\" Şalı al, katla", en: "\"Nice work.\" Take the shawl and fold it" }
            etkiler:
              - bayrak: "bl8_baris_kurtuldu"
              - xp_seviye: 15
            sonraki: "@akis"

  # ================================================================== ÜS · Tepeden inen (tohum: bl8_tepe_ayna)
  - id: "bl8_us_tepeden_inen"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["us", "yukselenler"]
    gerilim: 2
    kart: { tr: "Tepeden inen oğlan", en: "The boy from the Heights" }
    sahne: "bl8_us_tepeden_inen_1"
    sahneler:
      - id: "bl8_us_tepeden_inen_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Şafakta {yer:kiyikent_liman|in} zincirli kapısında nöbetçiler bir oğlanı tutuyor. Şalı çamura bulanmış, ayakkabıları elinde; yalınayak inmiş tepeden. Onur.", en: "At dawn, the sentries at {yer:kiyikent_liman|pos} chain gate are holding a boy. His shawl is caked with mud and his shoes are in his hand. He came down from the hill barefoot. Owen." }
          - metin: { tr: "\"Kirli dediler,\" diyor. \"Su içtim diye. Ayinden kovdular, evden de. Annem kapıyı açmadı.\" Elindeki ayakkabıların bağcıklarını sıkı sıkı tutuyor. \"Sen bana su verdin. Ben de sana geldim.\"", en: "\"They said I was unclean,\" he says. \"Because I drank water. They threw me out of the rite, and then out of the house. My mom wouldn't open the door.\" He's gripping his shoelaces tight. \"You gave me the water. So I came to you.\"" }
            kosul: { bayrak: "bl8_onur_su" }
          - metin: { tr: "Onur gözlerini senden ayıramıyor. \"Peygamber seni çağırıyor,\" diyor titreyen bir sesle. \"Seçim Gecesi'ne. Mesajı ben getirdim, çünkü ışığın sende durduğunu ben gördüm.\" Uzanıp senin eline dokunmaya çalışıyor, sonra cesaret edemiyor.", en: "Owen can't take his eyes off you. \"The Prophet is calling for you,\" he says, voice shaking. \"To the Night of Choosing. I brought the message because I saw the light stop on you.\" He reaches out to touch your hand, then loses his nerve." }
            kosul: { bayrak: "bl8_ayna_isik" }
          - metin: { tr: "\"Aynaları biri çevirdi,\" diyor. \"Ben gördüm. Gölge gibi biriydi. Zerrin inancımızı yitirdiğimizi söyledi, üçümüzü kovdu.\" Gözünü kısıp sana bakıyor. \"Sen miydin?\"", en: "\"Somebody turned the mirrors over,\" he says. \"I saw. Someone like a shadow. Zara said we'd lost our faith and threw three of us out.\" He narrows his eyes at you. \"Was it you?\"" }
            kosul: { bayrak: "bl8_ayna_bozuldu" }
          - metin: { tr: "\"Zerrin abla ayini bitirdi,\" diyor. \"Herkesi evine yolladı. Beni de sana yolladı. Ne yapacağımı senin bileceğini söyledi.\"", en: "\"Sister Zara ended the rite,\" he says. \"Sent everybody home. She sent me to you. She said you'd know what to do with me.\"" }
            kosul: { bayrak: "bl8_zerrin_konustu" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "On beş yaşında, üç gece diz çökmüş, bir gecede de bütün dünyası değişmiş. Ne söylersen ömrünün sonuna kadar hatırlayacak.", en: "Fifteen years old, three nights on his knees, and his whole world flipped in one night. Whatever you say, he'll remember for the rest of his life." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bir çocuk daha. sen çocuk toplamaya başladın. fark ettin mi?", en: "another kid. you've started collecting kids. have you noticed?" }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Ona Sığınak'ta bir yatak ve iş bul", en: "Find him a bed and a job at the Haven" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 1 }
              - bayrak: "bl8_onur_siginakta"
            sonraki: "bl8_us_tepeden_inen_siginak"
          - id: "geri"
            etiket: { tr: "\"Annene dön. Kapıyı ben çalarım.\"", en: "\"Go home to your mom. I'll knock on the door myself.\"" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
            sonraki: "bl8_us_tepeden_inen_geri"
          - id: "tanri"
            etiket: { tr: "\"Ben tanrı değilim, Onur. Bak bana.\"", en: "\"I'm not a god, Owen. Look at me.\"" }
            goster: { bayrak: "bl8_ayna_isik" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - itibar: { yukselenler: -1 }
            sonraki: "bl8_us_tepeden_inen_tanri"
          - id: "elif"
            etiket: { tr: "Onu {npc:elif_sari|e} götür; önce bir doktor görsün", en: "Take him to {npc:elif_sari}. A doctor first" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2, baglilik: 1 } }
              - bayrak: "bl8_onur_siginakta"
            sonraki: "bl8_us_tepeden_inen_siginak"

      - id: "bl8_us_tepeden_inen_siginak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Onur'u hastanenin çamaşırhanesine yerleştiriyorsun. İlk iş olarak şalını çıkarıp katlıyor, katladığı şalı da kazanın yanına, yanmasın diye uzağa koyuyor.", en: "You get Owen set up in the hospital laundry. The first thing he does is take off his shawl and fold it, and he sets it down by the boiler, far enough away that it won't burn." }
          - { tr: "\"Atmayacağım,\" diyor. \"Ama giymeyeceğim de. Belki bir gün ne yapacağımı bilirim.\"", en: "\"I'm not throwing it out,\" he says. \"But I'm not wearing it either. Maybe someday I'll know what to do with it.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ona çarşaf katlamayı göster", en: "Show him how to fold sheets" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_tepeden_inen_geri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Onur'la birlikte tepeye çıkıp bir apartman kapısını çalıyorsun. Kapı aralanınca yorgun yüzlü bir kadın oğluna bakıyor, sonra sana; sonunda zinciri çıkarıyor.", en: "You walk up the hill with Owen and knock on an apartment door. When it cracks open, a tired-faced woman looks at her son, then at you, and finally slides the chain off." }
          - { tr: "\"Bir daha diz çökme,\" diyor oğluna, sesi kırık. \"Ben senin için yeterince diz çöktüm.\"", en: "\"Don't you ever kneel again,\" she tells her son, her voice cracking. \"I've knelt enough for both of us.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapı kapanmadan uzaklaş", en: "Leave before the door closes" }
            etkiler:
              - bayrak: "bl8_onur_evde"
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_tepeden_inen_tanri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Onur'un elini tutup kendi bileğine koyuyorsun. \"Say,\" diyorsun. Nabzını sayıyor; parmakları titriyor.", en: "You take Owen's hand and put it on your wrist. \"Count,\" you tell him. He counts your pulse, fingers trembling." }
          - { tr: "\"Yetmiş iki,\" diyor sonunda, şaşkınlıkla. \"Benimki gibi.\" Gözlerinde bir şey sönüyor, yerine başka bir şey yanıyor. Belki daha küçük, ama sıcak bir şey.", en: "\"Seventy-two,\" he says finally, surprised. \"Same as mine.\" Something goes out in his eyes, and something else lights up in its place. Smaller, maybe. But warm." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Peygamberine de böyle söyle.\"", en: "\"Tell your Prophet that.\"" }
            etkiler:
              - bayrak: "bl8_onur_insan"
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== ÜS · Çamur parası (tohum: bl8_kordon_gece_ucte)
  - id: "bl8_us_camur_parasi"
    konum: ["us"]
    perde: [2]
    kosul: { bolum: 8 }
    yalniz_tohum: true
    agirlik: 1
    etiketler: ["us", "kordon", "lonca"]
    gerilim: 2
    kart: { tr: "Çamur parası", en: "Mud money" }
    sahne: "bl8_us_camur_parasi_1"
    sahneler:
      - id: "bl8_us_camur_parasi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balık halinin önünde Yusuf'la iki arkadaşı bir çuval açmış; içinden mavi mavi parlayan Kapı çekirdekleri çıkıyor. Karşılarında Lonca halkalı, kalın kollu bir alıcı tartı kuruyor.", en: "Outside the fish market, Joey and two of his friends have opened up a sack, and out come Gate cores glowing blue. Across from them, a thick-armed buyer with a Guild ring is setting up a scale." }
          - { tr: "\"Çekirdek başına yarım tayın,\" diyor alıcı. \"Çamurdan çıkan malın fiyatı bu.\" Yusuf itiraz edecek oluyor, ama arkadaşları onu dirseğinden çekiyor. Ötekilerin eline şimdiye dek bundan fazlası geçmemiş.", en: "\"Half a ration per core,\" the buyer says. \"That's the going rate for mud goods.\" Joey starts to argue, but his friends pull him back by the elbow. Half a ration is more than the others have ever held." }
          - metin: { tr: "Yusuf'un bacağı tahta bir atele bağlı. Koltuk değneğiyle bile tezgâha ilk o varmış.", en: "Joey's leg is strapped to a wooden splint. Even on crutches, he got to the table first." }
            kosul: { bayrak: "bl8_yusuf_yarali" }
          - metin: { tr: "Konsey mendireği kapattığından beri çocuklar kayalıkların öbür ucundan iniyormuş. Orası daha uzak, daha karanlık.", en: "Since the Council closed the breakwater, the kids have been going down at the far end of the rocks. It's farther out there, and darker." }
            kosul: { bayrak: "bl8_mendirek_kapali" }
          - metin: { tr: "Balıkçıların senin sayımını her gece tebeşirle banka yazdığını söylüyorlar. O geceden beri suda kimse kalmamış.", en: "They say the fishermen chalk your count on the bench every night. Nobody's been caught by the water since." }
            kosul: { bayrak: "bl8_kordon_sayim" }
          - { tr: "Derken kalabalığı yararak Nezihe Hanım geliyor, elinde terliği. \"Satıyorsun ha!\" diye bağırıyor torununa. \"Ben her gece kapıda ölüp ölüp diriliyorum, sen yarım tayına satıyorsun!\"", en: "Then Miss Nettie pushes through the crowd with a slipper in her hand. \"So you're selling them!\" she yells at her grandson. \"I die on that doorstep every single night, and you're selling them for half a ration!\"" }
        sezgiler:
          - kosul: { stat: { int: 35 } }
            metin: { tr: "Tartı ayarlı. Alıcı her çekirdekten bir parmak kazanıyor; çocukların haberi yok.", en: "The scale's rigged. The buyer skims a finger's worth off every core, and the kids have no idea." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "denizin dibinden çıkan, kıyıda yarı fiyata gider. her yerde aynı hikâye.", en: "whatever comes up from the bottom of the sea goes for half price on shore. same story everywhere." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ben bu çocuğun yaşındayken vapurda simit satıyordum. Kimse tartımı çalmazdı.\"", en: "\"When I was his age, I sold pretzels on the ferry. Nobody ever cheated my scale.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Yarım tayın mı? Ben o çekirdekler için insan döverdim.\"", en: "\"Half a ration? I'd punch somebody for cores like that.\"" }
        secenekler:
          - id: "tarti"
            etiket: { tr: "Tartının hilesini herkesin önünde göster", en: "Show everybody the rigged scale" }
            gerekli: { stat: { int: 35 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - itibar: { lonca: -1 }
              - bayrak: "bl8_tarti_hilesi"
            sonraki: "bl8_us_camur_parasi_tarti"
          - id: "birak"
            etiket: { tr: "Yusuf'a çamura inmeyi bırakmasını söylet", en: "Get Joey to quit going out on the mud" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: 1 }
              - bayrak: "bl8_dip_cocuklari_dagildi"
              - tehlike: { kordon: -2 }
            sonraki: "bl8_us_camur_parasi_birak"
          - id: "elif"
            etiket: { tr: "Çekirdekleri hastane için {npc:elif_sari|e} adil fiyattan sattır", en: "Have them sell the cores to {npc:elif_sari} for the hospital at a fair price" }
            goster: { npc_hayatta: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - itibar: { siginak: 2 }
            sonraki: "bl8_us_camur_parasi_elif"
          - id: "duzen"
            etiket: { tr: "\"Yalnızca benim sayımla inin. Başka türlü değil.\"", en: "\"You only go out on my count. No other way.\"" }
            goster: { bayrak: "bl8_kordon_sayim" }
            etkiler:
              - ahlak: { duzen: 2 }
              - bayrak: "bl8_dip_cocuklari_duzen"
              - tehlike: { kordon: -2 }
            sonraki: "bl8_us_camur_parasi_duzen"

      - id: "bl8_us_camur_parasi_tarti"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tartının kefesinin altındaki kurşun ağırlığı tırnağınla söküp kalabalığa gösteriyorsun. Alıcının yüzü kızarıyor; etraftaki balıkçılar homurdanmaya başlıyor.", en: "You pry the lead weight out from under the scale's pan with your thumbnail and hold it up for the crowd. The buyer's face goes red, and the fishermen around you start to grumble." }
          - { tr: "Alıcı çekirdek başına bir tam tayın sayıp çuvalı alıyor ve hiçbir şey söylemeden gidiyor. Yusuf tayın fişlerini ikiye bölüp yarısını ninesinin avucuna sıkıştırıyor.", en: "The buyer counts out a full ration per core, takes the sack, and leaves without a word. Joey splits the chits in half and presses one half into his grandma's hand." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kurşun ağırlığı denize fırlat", en: "Flick the lead weight into the sea" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_camur_parasi_birak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Yusuf'u bir kenara çekip konuşuyorsun; Nezihe Hanım'ın terliği hâlâ havada. Önce omuz silkiyor, sonra kollarını kavuşturuyor, en sonunda da gözünü ninesinin titreyen ellerine dikiyor.", en: "You pull Joey aside and talk to him, Miss Nettie's slipper still in the air. First he shrugs. Then he crosses his arms. Finally his eyes land on his grandma's shaking hands." }
          - { tr: "\"Tamam,\" diyor. \"Ama arkadaşlarım inerse ben de inerim.\" Arkadaşları birbirine bakıyor. Biri çuvalı yere bırakıyor; öteki de ardından.", en: "\"Fine,\" he says. \"But if my friends go, I go.\" His friends look at each other. One sets his sack down on the ground. Then the other." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Nezihe Hanım'ın terliğini nazikçe indir", en: "Gently lower Miss Nettie's slipper" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_camur_parasi_elif"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çocukları hastaneye götürüyorsun. {npc:elif_sari} çekirdekleri tek tek ışığa tutup sayıyor, her biri için bir tam tayın ve bir kutu süt yazıyor.", en: "You take the kids to the hospital. {npc:elif_sari} holds each core up to the light and counts them, and writes down a full ration and a carton of milk for every one." }
          - { tr: "\"Bunlarla iki ameliyathaneyi bir hafta ışıkta tutarım,\" diyor. Sonra Yusuf'a dönüyor: \"Ama bir daha çamura inersen seni o ameliyathanede görmek istemiyorum.\"", en: "\"With these I can keep two operating rooms lit for a week,\" she says. Then she turns to Joey. \"But if you go out on that mud again, I don't want to see you on one of those tables.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yusuf'un omzunu sık", en: "Squeeze Joey's shoulder" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl8_us_camur_parasi_duzen"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Çocuklar seni dinliyor. Yusuf bir tebeşir bulup balık halinin kepengine senin sayımını çiziyor: bir, iki, dört, sekiz, on altı... Onun altına kendi kuralını ekliyor: OTUZ İKİDE GERİ.", en: "The kids listen. Joey finds a piece of chalk and draws your count on the fish market's shutter. One, two, four, eight, sixteen. Underneath it he adds his own rule: BACK AT THIRTY-TWO." }
          - { tr: "Nezihe Hanım terliğini ayağına geçiriyor. \"Hiç değilse sayıyorlar,\" diyor. \"Sayan çocuk boğulmaz.\"", en: "Miss Nettie puts her slipper back on. \"At least they're counting,\" she says. \"A kid who counts doesn't drown.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kepengin üstündeki sayıları kontrol et", en: "Check the numbers on the shutter" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · Kule Dibi · Aras
  - id: "bl8_kamp_aras"
    kamp: true
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 123, max: 150 }
    kosul: { bolum: 8, npc_hayatta: "aras_kurt" }
    agirlik: 5
    etiketler: ["kamp", "aras", "npc"]
    gerilim: 1
    npc: ["aras_kurt"]
    kart: { tr: "Kule'nin gölgesinde ateş", en: "A fire in the Spire's shadow" }
    sahne: "bl8_kamp_aras_1"
    sahneler:
      - id: "bl8_kamp_aras_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin dibinde, rüzgârın ulaşmadığı bir duvar kovuğunda ateş yakıyorsunuz. {npc:aras_kurt} kara ceketini yere serip üstüne bağdaş kurmuş, bıçağını bileyliyor; her sürtüşte kıvılcımlar ateşe karışıyor.", en: "You build a fire in a nook at the foot of the Spire where the wind can't reach. {npc:aras_kurt} has spread his black jacket on the ground and sits cross-legged on it, sharpening his knife. Every stroke throws a spark into the fire." }
          - metin: { tr: "\"Merdiven sana açılmış diyorlar,\" diyor gözünü bıçaktan ayırmadan. \"Bana açılsaydı bir saniye bile düşünmezdim. Sen ne bekliyorsun?\"", en: "\"Word is the staircase opened for you,\" he says without looking up from the blade. \"If it opened for me, I wouldn't think twice. What are you waiting for?\"" }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - metin: { tr: "\"Aşağı indin,\" diyor gözünü bıçaktan ayırmadan. \"Bütün şehir biliyor. Ne gördüğünü bilen yok ama. Bana bile söylemedin.\"", en: "\"You went down,\" he says without looking up from the blade. \"Whole city knows. Nobody knows what you saw, though. You didn't even tell me.\"" }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
          - { tr: "Bıçağı kınına sokup ateşin öbür yanından sana bakıyor. Bu bakışta her zamanki alay yok; ilk kez geride kalmış birinin bakışı bu.", en: "He sheathes the knife and looks at you across the fire. There's none of the usual smirk in it. For the first time, it's the look of someone who's been left behind." }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Kıskançlık değil bu, ya da yalnızca o değil. Senin bildiğin bir şeyi bilmemek onu korkutuyor.", en: "It's not jealousy. Or not only that. Not knowing something you know scares him." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu çocuk seninle yarışıyor çünkü yalnız koşmaktan korkuyor. bunu ona söyleme. bıçağı yeni bileyledi.", en: "this guy races you because he's scared of running alone. don't tell him that. he just sharpened that knife." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Aşağıda ne görürsem ilk sana anlatırım.\"", en: "\"Whatever I see down there, you'll be the first to hear it.\"" }
            goster: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
            etkiler:
              - iliski: { aras_kurt: { guven: 4 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl8_kamp_aras", agirlik: 20 }
              - bayrak: "bl8_aras_soz"
            sonraki: "bl8_kamp_aras_son"
          - id: "anlat"
            etiket: { tr: "Ona merdivenin dibinde gördüğünü anlat", en: "Tell him what you saw at the bottom of the stairs" }
            goster: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
            etkiler:
              - iliski: { aras_kurt: { guven: 4, saygi: 2 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl8_kamp_aras", agirlik: 25 }
              - bayrak: "bl8_aras_anlatildi"
            sonraki: "bl8_kamp_aras_son"
          - id: "yaris"
            etiket: { tr: "\"Kıskanacağına yarış. Sabah onuncu kata ilk kim çıkar?\"", en: "\"Quit sulking and race me. First one to Floor Ten in the morning?\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 3, baglilik: 1 } }
              - bayrak: "bl8_aras_yaris"
            sonraki: "bl8_kamp_aras_son"
          - id: "dalga"
            etiket: { tr: "\"Sana açılmadı, çünkü sen kapıyı tekmelersin.\"", en: "\"It didn't open for you because you'd kick the door in.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 1, guven: -1 } }
            sonraki: "bl8_kamp_aras_son"

      - id: "bl8_kamp_aras_son"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "{npc:aras_kurt} bir süre ateşe bakıyor. \"Söz verdin,\" diyor sonunda. \"Ben sözleri saklarım. Bozanları da.\" Ama sesi ilk kez yumuşak.", en: "{npc:aras_kurt} stares into the fire for a while. \"You promised,\" he says finally. \"I keep track of promises. And the people who break them.\" But for once, his voice is soft." }
            kosul: { bayrak: "bl8_aras_soz" }
          - metin: { tr: "Anlattıkça {npc:aras_kurt|in} yüzü değişiyor. Sonunda bıçağı yeniden çıkarıp ateşin ışığında çeviriyor. \"Demek bütün bu yarış...\" diyor, cümlesini bitirmiyor. \"Yine de birinci olacağım. Artık neden olduğunu bilerek.\"", en: "As you talk, {npc:aras_kurt|pos} face changes. When you're done, he pulls the knife out again and turns it over in the firelight. \"So this whole race...\" he says, and doesn't finish. \"I'm still going to win it. Now I'll just know why.\"" }
            kosul: { bayrak: "bl8_aras_anlatildi" }
          - metin: { tr: "{npc:aras_kurt} sırıtıyor; o tanıdık, sinir bozucu sırıtış geri gelmiş. \"Şafakta,\" diyor. \"Geç kalırsan beklemem.\" Ceketini üstüne çekip ateşe arkasını dönüyor ve saniyeler içinde uyuyor.", en: "{npc:aras_kurt} grins. That familiar, infuriating grin is back. \"Dawn,\" he says. \"You're late, I'm not waiting.\" He pulls his jacket over himself, turns his back to the fire, and is asleep in seconds." }
            kosul: { bayrak: "bl8_aras_yaris" }
          - metin: { tr: "{npc:aras_kurt} kahkahayı basıyor, sonra gülmesi yavaş yavaş sönüyor. \"Belki de haklısın,\" diyor. \"Ama kapı bana açılsaydı tekmelemezdim. Yemin ederim.\"", en: "{npc:aras_kurt} bursts out laughing, and then the laugh slowly dies. \"Maybe you're right,\" he says. \"But if that door opened for me, I wouldn't kick it. Swear to God.\"" }
            kosul: { bayrak_yok: ["bl8_aras_soz", "bl8_aras_anlatildi", "bl8_aras_yaris"] }
          - { tr: "Kule'nin yüzlerce penceresinden birinde, çok yukarıda bir ışık yanıp sönüyor. İkiniz de görüyorsunuz, ikiniz de bir şey demiyorsunuz.", en: "Way up in one of the Spire's hundreds of windows, a light blinks on and off. You both see it. Neither of you says anything." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ateşe bir odun at, uzan", en: "Throw a log on the fire and lie down" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "İlk nöbeti sen tut", en: "Take first watch" }
            etkiler:
              - iliski: { aras_kurt: { guven: 1 } }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · Kule Dibi · Mert
  - id: "bl8_kamp_mert"
    kamp: true
    konum: ["kule_dibi"]
    perde: [2]
    gun: { min: 123, max: 150 }
    kosul: { bolum: 8, npc_hayatta: "mert_kilic" }
    agirlik: 5
    etiketler: ["kamp", "mert", "npc", "sistem"]
    gerilim: 1
    npc: ["mert_kilic"]
    kart: { tr: "Yanan defterler", en: "Burning notebooks" }
    sahne: "bl8_kamp_mert_1"
    sahneler:
      - id: "bl8_kamp_mert_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı uyandığında {npc:mert_kilic} ateşin başında, dizlerinin üstünde bir yığın defterle oturuyor. Her sayfayı baştan sona okuyor, sonra koparıp ateşe atıyor. Kâğıt kıvrılırken alevler maviye çalıyor.", en: "When you wake up around midnight, {npc:mert_kilic} is sitting by the fire with a pile of notebooks on his knees. He reads each page start to finish, then tears it out and feeds it to the fire. The flames go a little blue as the paper curls." }
          - { tr: "\"Kayıtlarım,\" diyor sen sormadan. \"Entegrasyon gününden beri. Her seviye, her Kapı, her bildirim. Dört yüz on iki sayfa.\" Bir sayfa daha koparıyor. \"Ben yazdıkça biri okuyor. Ne yazarsam okuyor.\"", en: "\"My logs,\" he says before you can ask. \"Since Integration Day. Every level, every Gate, every notification. Four hundred and twelve pages.\" He tears out another one. \"Every time I write, somebody reads it. Everything I write, they read.\"" }
          - metin: { tr: "\"Pazardaki dördüncüsü,\" diye ekliyor, sesini alçaltarak. \"Yüzü olmayan. O okuyor. O gün beni işaretledi; o günden beri yazdığım her harfi kokluyor.\"", en: "\"The fourth one at the market,\" he adds, lowering his voice. \"The one with no face. It reads. It marked me that day, and ever since it's been sniffing every letter I write.\"" }
            kosul: { bayrak: "mert_isaretlendi" }
          - metin: { tr: "\"Hasat dedin,\" diyor. \"Hasatsa, benim kayıtlarım çiftçinin defteri. Kimin ne kadar büyüdüğü, satır satır. Ona yardım etmem.\"", en: "\"You said harvest,\" he says. \"If it's a harvest, my logs are the farmer's ledger. Who grew how much, line by line. I won't help it.\"" }
            kosul: { bayrak: "gercek_hasat" }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Yığının en altındaki ilk defteri yakmıyor. Elini her yaklaştırışında geri çekiyor.", en: "He isn't burning the first notebook at the very bottom of the pile. Every time his hand gets close to it, he pulls back." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yazdıklarını kimse okumuyor aslında. ama okunduğunu sanmak yazmaktan iyi geliyor ona. yalnızlık böyle bir şey.", en: "nobody's actually reading what he writes. but thinking someone is feels better to him than writing. that's what lonely looks like." }
        secenekler:
          - id: "sakla"
            etiket: { tr: "\"Yakmayı bırak. Kayıtları ben saklarım.\"", en: "\"Stop burning them. I'll keep the logs.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 4 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl8_kamp_mert", agirlik: 25 }
              - bayrak: "bl8_mert_kayit_sende"
            sonraki: "bl8_kamp_mert_son"
          - id: "yak"
            etiket: { tr: "\"Hepsini yak. Sende kalan tek kayıt kafan olsun.\"", en: "\"Burn them all. Let the only copy be in your head.\"" }
            etkiler:
              - iliski: { mert_kilic: { saygi: 2 } }
              - ahlak: { duzen: -1 }
              - bayrak: "bl8_mert_kayit_yandi"
            sonraki: "bl8_kamp_mert_son"
          - id: "ilk"
            etiket: { tr: "En alttaki ilk defteri al, ilk sayfayı yüksek sesle oku", en: "Pick up the first notebook at the bottom and read the first page out loud" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 3 } }
              - bayrak: "bl8_mert_ilk_sayfa"
            sonraki: "bl8_kamp_mert_son"
          - id: "yanki"
            etiket: { tr: "\"Okuyan biri var. İçimdeki. Okusun mu?\"", en: "\"There is someone reading. The one inside me. Want it to read?\"" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { mert_kilic: { guven: 2, baglilik: 2 }, yanki: { guven: 1 } }
              - bayrak: "bl8_mert_yanki_okudu"
            sonraki: "bl8_kamp_mert_son"

      - id: "bl8_kamp_mert_son"
        yer: "kule_dibi"
        paragraflar:
          - metin: { tr: "{npc:mert_kilic} kalan defterleri sana uzatırken elleri titriyor. \"Kimse bilmesin,\" diyor. \"Sende olduklarını. Sende güvende değiller ama hiç değilse bende değiller.\"", en: "{npc:mert_kilic|pos} hands shake as he passes you the notebooks that are left. \"Nobody can know you have them,\" he says. \"They're not safe with you. But at least they're not with me.\"" }
            kosul: { bayrak: "bl8_mert_kayit_sende" }
          - metin: { tr: "{npc:mert_kilic} son defteri de ateşe bırakıyor, sonra kendi şakağına dokunuyor. \"Dört yüz on iki sayfa,\" diyor. \"Hepsi burada. Bunu okumaya kalkan önce beni açmak zorunda.\" Gülüyor, ama gözleri gülmüyor.", en: "{npc:mert_kilic} drops the last notebook into the fire, then taps his own temple. \"Four hundred and twelve pages,\" he says. \"All in here. Anybody who wants to read it has to open me up first.\" He laughs, but his eyes don't." }
            kosul: { bayrak: "bl8_mert_kayit_yandi" }
          - metin: { tr: "İlk sayfada titrek bir el yazısıyla tek satır var: \"Gün 0. Sistem var. Ben de varım. Şimdilik.\" Okuduğunda {npc:mert_kilic} başını dizlerine gömüyor. \"Şimdilik,\" diye tekrarlıyor. \"Hâlâ şimdilik.\"", en: "The first page has a single line in shaky handwriting: \"Day 0. The System exists. So do I. For now.\" When you read it, {npc:mert_kilic} buries his face in his knees. \"For now,\" he repeats. \"Still for now.\"" }
            kosul: { bayrak: "bl8_mert_ilk_sayfa" }
          - metin: { tr: "Defteri {npc:yanki} görsün diye açıyorsun. Uzun bir sessizlik çöküyor; sonra {npc:yanki} söylediklerini sana fısıldıyor, sen de {npc:mert_kilic|e} aktarıyorsun: senin kayıtların sistemden daha düzgün. sistem bu kadar titiz olsaydı ben hiç kopmazdım. {npc:mert_kilic} ağlamakla gülmek arasında bir ses çıkarıyor.", en: "You open the notebook where it can see. There's a long silence. Then {npc:yanki} whispers to you, and you pass it on to {npc:mert_kilic}: your logs are cleaner than the system's. if the system were this careful, i'd never have come loose. {npc:mert_kilic} makes a sound somewhere between crying and laughing." }
            kosul: { bayrak: "bl8_mert_yanki_okudu" }
          - { tr: "Ateş küçülüyor. Kule'nin taşı gece boyunca sırtınızda ılık kalıyor, sanki o da dinliyormuş gibi.", en: "The fire burns down. All night the Spire's stone stays warm at your backs, like it's listening too." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Ona bir battaniye at, uyu", en: "Toss him a blanket and get some sleep" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "\"Sen uyu. Bu gece ben okurum.\"", en: "\"You sleep. I'll do the reading tonight.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 1 } }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · Tepe · Deniz
  - id: "bl8_kamp_deniz"
    kamp: true
    konum: ["tepe"]
    perde: [2]
    gun: { min: 123, max: 150 }
    kosul: { bolum: 8, npc_hayatta: "deniz_arman" }
    agirlik: 5
    etiketler: ["kamp", "deniz", "npc"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "İlahilerin altında", en: "Under the hymns" }
    sahne: "bl8_kamp_deniz_1"
    sahneler:
      - id: "bl8_kamp_deniz_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} yamacındaki terk edilmiş bir çocuk parkında, kaydırağın altında ateş yakıyorsunuz. Yukarıdan ilahiler iniyor; tepenin sırtında beyaz şallıların meşaleleri ağır ağır bir çizgi hâlinde ilerliyor.", en: "You build a fire under the slide in an abandoned playground on the slope of {yer:tepe}. Hymns drift down from above, and along the ridge the white shawls' torches creep forward in a slow line." }
          - { tr: "{npc:deniz_arman} bir dal parçasıyla toprağa martı çiziyor, siliyor, yeniden çiziyor. Sonra çubuğu ateşe atıp sana dönüyor.", en: "{npc:deniz_arman} is drawing gulls in the dirt with a stick, wiping them out, drawing them again. Then the stick goes into the fire and {npc:deniz_arman} turns to you." }
          - metin: { tr: "\"Bir şey soracağım,\" diyor. \"Aşağıda ne olduğunu bilmiyoruz. Ama Sistem iyi bir şey çıkarsa... Bütün bu ölüleri, bu ayinleri, o çocukları... Affeder misin onu?\"", en: "\"Can I ask you something?\" {npc:deniz_arman} says. \"We don't know what's down there. But if the System turns out to be good... All the dead, the rituals, those kids... Would you forgive it?\"" }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - metin: { tr: "\"Can simidi dedin,\" diyor. \"Biri bizi kurtarmaya çalışıyormuş. Bütün bu ölülerle, ayinlerle... Affedebilecek misin onu?\"", en: "\"You said life preserver,\" {npc:deniz_arman} says. \"Somebody's trying to save us. With all the dead, all the rituals... Can you forgive it?\"" }
            kosul: { bayrak: "gercek_kurtarma" }
          - metin: { tr: "\"Hasat dedin,\" diyor. \"Buğdaymışız yani. Şu yukarıdakiler bunu öğrenince yine ilahi söyler mi sence? Söylerler bence. Asıl korkunç olan bu.\"", en: "\"You said harvest,\" {npc:deniz_arman} says. \"So we're wheat. You think those people up there would still be singing if they knew? I think they would. That's the scary part.\"" }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Yukarıdan inen ilahilerin arasında {npc:deniz_arman} bir an başını kaldırıp dinliyor; tanıdık bir ses arıyor gibi. Bulamayınca omuzları düşüyor.", en: "For a moment {npc:deniz_arman} looks up and listens to the hymns coming down, as if listening for one particular voice. When it isn't there, {zamir:deniz_arman|onun} shoulders drop." }
            kosul: { bayrak_yok: "deniz_kardes_bulundu" }
        sezgiler:
          - kosul: { stat: { wis: 35 } }
            metin: { tr: "Soru Sistem'le ilgili değil. Asıl sorduğu başka: bu şehre de ona da ne yaparsan yap, affedilir misin?", en: "The question isn't really about the System. It's asking whether you'd be forgiven, whatever you end up doing to this city, or to {npc:deniz_arman}." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "affetmek. güzel kelime. sistemin sözlüğünde yok. kontrol ettim.", en: "forgive. nice word. it's not in the system's dictionary. i checked." }
        secenekler:
          - id: "hayir"
            etiket: { tr: "\"Affetmem. Ölüler iyi niyetle geri gelmiyor.\"", en: "\"No. Good intentions don't bring anybody back.\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { deniz_arman: { saygi: 3 } }
              - bayrak: "bl8_deniz_affetmez"
            sonraki: "bl8_kamp_deniz_son"
          - id: "evet"
            etiket: { tr: "\"Affederim. Elimizdeki tek can simidi o.\"", en: "\"Yeah. It's the only life preserver we've got.\"" }
            etkiler:
              - ahlak: { merhamet: 1 }
              - iliski: { deniz_arman: { guven: 2 } }
              - bayrak: "bl8_deniz_affeder"
            sonraki: "bl8_kamp_deniz_son"
          - id: "sen"
            etiket: { tr: "\"Ben seni affederdim. Ne yaparsan yap.\"", en: "\"I'd forgive you. Whatever you did.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 3, baglilik: 4 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl8_kamp_deniz", agirlik: 30 }
              - bayrak: "bl8_deniz_affet_seni"
            sonraki: "bl8_kamp_deniz_son"
          - id: "marti"
            etiket: { tr: "Bir çubuk al, toprağa sen de bir martı çiz", en: "Grab a stick and draw a gull in the dirt yourself" }
            etkiler:
              - iliski: { deniz_arman: { baglilik: 2 } }
              - bayrak: "bl8_deniz_marti"
            sonraki: "bl8_kamp_deniz_son"

      - id: "bl8_kamp_deniz_son"
        yer: "tepe"
        paragraflar:
          - metin: { tr: "{npc:deniz_arman} başını sallıyor. \"Ben de affetmem herhalde,\" diyor. \"Ama ben de herkesi koruyamıyorum. O zaman beni de kimse affetmesin.\" Bunu gülerek söylüyor, ama gülüşü yarım kalıyor.", en: "{npc:deniz_arman} nods. \"I probably wouldn't, either,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"But I can't protect everybody, either. So nobody should forgive me.\" It comes out as a laugh, but the laugh falls short." }
            kosul: { bayrak: "bl8_deniz_affetmez" }
          - metin: { tr: "\"Can simidi,\" diye tekrarlıyor {npc:deniz_arman}. \"Vapurdan düşseydik, kim attığına bakmazdık değil mi? Sarılırdık.\" Ateşe bir dal atıyor. \"Ben sarılırdım.\"", en: "\"Life preserver,\" {npc:deniz_arman} repeats. \"If we fell off the ferry, we wouldn't care who threw it, right? We'd just grab on.\" A branch goes into the fire. \"I'd grab on.\"" }
            kosul: { bayrak: "bl8_deniz_affeder" }
          - metin: { tr: "{npc:deniz_arman} uzun süre bir şey söylemiyor. Sonra ateşin öbür yanından uzanıp eline bir kez, kısacık dokunuyor. \"Bunu hatırlayacağım,\" diyor. \"Bir gün lazım olursa diye.\"", en: "{npc:deniz_arman} doesn't say anything for a long time. Then {npc:deniz_arman} reaches across the fire and touches your hand, once, quick. \"I'm going to remember that,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"In case I need it someday.\"" }
            kosul: { bayrak: "bl8_deniz_affet_seni" }
          - metin: { tr: "Çizdiğin martıya bakıp {npc:deniz_arman} kahkahayı basıyor. \"Bu ördek,\" diyor. \"Resmen ördek.\" Sonra yanına daha küçük bir martı çiziyor, seninkinin kanadının altına.", en: "{npc:deniz_arman} takes one look at your gull and cracks up. \"That's a duck,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"That's literally a duck.\" Then {zamir:deniz_arman|o} draw{zamir:deniz_arman|s} a smaller gull right next to it, tucked under your bird's wing." }
            kosul: { bayrak: "bl8_deniz_marti" }
          - { tr: "Yukarıda ilahiler bir bir susuyor, meşaleler sönüyor. {yer:tepe|de} geriye yalnızca sizin ateşiniz kalıyor.", en: "Up above, the hymns go quiet one by one and the torches go out. Soon your fire is the only light left on {yer:tepe}." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Kaydırağın altında uzan", en: "Stretch out under the slide" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "\"Sen uyu, ben bakarım.\"", en: "\"You sleep. I've got the watch.\"" }
            etkiler:
              - iliski: { deniz_arman: { guven: 1 } }
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== SAHA KAMPI · Sanayi · Elif
  - id: "bl8_kamp_elif"
    kamp: true
    konum: ["sanayi"]
    perde: [2]
    gun: { min: 123, max: 150 }
    kosul: { bolum: 8, npc_hayatta: "elif_sari" }
    agirlik: 5
    etiketler: ["kamp", "elif", "npc"]
    gerilim: 1
    npc: ["elif_sari"]
    kart: { tr: "Kazan dairesinde dikiş", en: "Stitches in the boiler room" }
    sahne: "bl8_kamp_elif_1"
    sahneler:
      - id: "bl8_kamp_elif_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Gece için {yer:sanayi|in} terk edilmiş bir kazan dairesine sığınıyorsunuz. Paslı kazanın kapağında küçük bir ateş, tavanda damlayan su... {npc:elif_sari} çantasından iğne iplik çıkarıp kolundaki kesiği göstermeni istiyor.", en: "You hole up for the night in an abandoned boiler room in {yer:sanayi}. A little fire in the rusted boiler's hatch, water dripping from the ceiling. {npc:elif_sari} gets a needle and thread out of her bag and asks to see the cut on your arm." }
          - { tr: "Dikişi atarken konuşuyor, sanki acil serviste hastasının dikkatini dağıtıyormuş gibi: on iki saatlik nöbetler, makinenin kahvesi, sabaha karşı dördün o garip sessizliği. \"Kıyamet de sabahın dördüne benziyor,\" diyor. \"Herkes yorgun, kimse eve gidemiyor.\"", en: "She talks while she stitches, the way she'd distract a patient in the ER. Twelve-hour shifts, vending machine coffee, that weird quiet around four a.m. \"The end of the world feels a lot like four a.m.,\" she says. \"Everybody's exhausted and nobody gets to go home.\"" }
          - metin: { tr: "Son düğümü atarken başını kaldırmıyor. \"Çekirdek'in altına ineceksin,\" diyor. \"Konsey benden ne gördüğünü soracak. Ben de senden soracağım. Önce bana söyler misin? Konsey'den önce.\"", en: "She doesn't look up as she ties the last knot. \"You're going down under the Core,\" she says. \"The Council's going to ask me what you saw. And I'm going to ask you. Will you tell me first? Before the Council?\"" }
            kosul: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
          - metin: { tr: "Son düğümü atarken başını kaldırmıyor. \"Aşağı indin,\" diyor. \"Konsey'e bir şeyler anlattın, biliyorum. Ama ben sana sormadım. Şimdi soruyorum: gerçekten ne gördün?\"", en: "She doesn't look up as she ties the last knot. \"You went down,\" she says. \"I know you told the Council something. But I never asked you myself. So I'm asking now. What did you really see?\"" }
            kosul: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
        sezgiler:
          - kosul: { stat: { per: 35 } }
            metin: { tr: "Dikişleri kusursuz, ama son düğümde parmakları bir an titriyor. Yorgunluktan değil.", en: "Her stitches are flawless, but her fingers shake for a second on the last knot. Not from being tired." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ondan bir şey saklarsan anlar. hekimdir. yalanın nabzını tutar.", en: "if you hide something from her, she'll know. she's a doctor. she can take a lie's pulse." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söz. Önce sana.\"", en: "\"Promise. You first.\"" }
            goster: { bayrak_yok: ["gercek_hasat", "gercek_kurtarma"] }
            etkiler:
              - iliski: { elif_sari: { guven: 4, baglilik: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl8_kamp_elif", agirlik: 25 }
              - bayrak: "bl8_elif_soz"
            sonraki: "bl8_kamp_elif_son"
          - id: "anlat"
            etiket: { tr: "Ona her şeyi anlat; Konsey'e söylemediklerini de", en: "Tell her everything. Including what you didn't tell the Council" }
            goster: { herhangi: [{ bayrak: "gercek_hasat" }, { bayrak: "gercek_kurtarma" }] }
            etkiler:
              - iliski: { elif_sari: { guven: 4, baglilik: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl8_kamp_elif", agirlik: 25 }
              - bayrak: "bl8_elif_anlatildi"
            sonraki: "bl8_kamp_elif_son"
          - id: "konsey"
            etiket: { tr: "\"Konsey'den bir şey saklamamı mı istiyorsun?\"", en: "\"You're asking me to keep something from the Council?\"" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { elif_sari: { saygi: 3, guven: -1 } }
              - bayrak: "bl8_elif_konsey"
            sonraki: "bl8_kamp_elif_son"
          - id: "dikis"
            etiket: { tr: "\"Senin elin titriyor. Bırak, son düğümü ben atayım.\"", en: "\"Your hand's shaking. Let me tie the last one.\"" }
            etkiler:
              - iliski: { elif_sari: { baglilik: 3 } }
              - bayrak: "bl8_elif_dikis"
            sonraki: "bl8_kamp_elif_son"

      - id: "bl8_kamp_elif_son"
        yer: "sanayi"
        paragraflar:
          - metin: { tr: "{npc:elif_sari} başını sallayıp makası çantasına kaldırıyor. \"Hekimlere herkes söz verir,\" diyor. \"Sigarayı bırakacağım, ilacımı içeceğim... Ben sözleri saklamam. Ama seninkini saklayacağım.\"", en: "{npc:elif_sari} nods and puts the scissors back in her bag. \"Everybody makes promises to doctors,\" she says. \"I'll quit smoking, I'll take my meds... I don't keep track of promises. But I'm keeping yours.\"" }
            kosul: { bayrak: "bl8_elif_soz" }
          - metin: { tr: "Anlattıkça {npc:elif_sari} kazanın paslı kapağına yaslanıyor, gözlerini kapatıyor. Bitirdiğinde uzun süre susuyor. \"Tamam,\" diyor sonunda. \"Bunu biliyorum artık. Yarın sabah yine yaralı saracağım. Ama bunu bilerek.\"", en: "As you talk, {npc:elif_sari} leans back against the boiler's rusty hatch and closes her eyes. When you're done, she's quiet for a long time. \"Okay,\" she says finally. \"So now I know. Tomorrow morning I'll still be bandaging people. I'll just know.\"" }
            kosul: { bayrak: "bl8_elif_anlatildi" }
          - metin: { tr: "{npc:elif_sari} kısa, yorgun bir kahkaha atıyor. \"Haklısın,\" diyor. \"Konsey'i ben kurdum. Ondan bir şey saklamamı kimse benden istememeli, ben bile.\" Ama ateşe bakarken yüzünde bir şey kırılıyor.", en: "{npc:elif_sari} lets out a short, tired laugh. \"You're right,\" she says. \"I built the Council. Nobody should ask me to keep things from it. Not even me.\" But as she looks at the fire, something in her face cracks." }
            kosul: { bayrak: "bl8_elif_konsey" }
          - metin: { tr: "{npc:elif_sari} bir an sana bakıyor, sonra iğneyi uzatıyor. Son düğümü sen atarken eli senin elinin üstünde, gerektiğinden bir saniye uzun kalıyor. \"Fena değil,\" diyor. \"Acile alırdım seni.\"", en: "{npc:elif_sari} looks at you for a second, then hands over the needle. While you tie the last knot, her fingers stay on yours a second longer than they need to. \"Not bad,\" she says. \"I'd hire you in the ER.\"" }
            kosul: { bayrak: "bl8_elif_dikis" }
          - { tr: "Dışarıda {yer:sanayi|in} gece vardiyası çalışıyor; çekiçlerin sesi kazan dairesinin duvarlarından boğuk boğuk geliyor. İkiniz de sabahın dördünü bekliyorsunuz.", en: "Outside, the night shift in {yer:sanayi} is working, the hammers coming muffled through the boiler room walls. You both sit up waiting for four a.m." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Kazana yaslanıp gözlerini kapat", en: "Lean against the boiler and close your eyes" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"
          - id: "nobet"
            etiket: { tr: "\"Sen uyu. Dördü ben beklerim.\"", en: "\"You sleep. I'll wait up for four.\"" }
            etkiler:
              - iliski: { elif_sari: { guven: 1 } }
              - xp_seviye: 9
            sonraki: "@akis"
