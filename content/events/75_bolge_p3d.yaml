# Bölge olayları ve saha kampı sahneleri — Perde 3 · Bölüm 15 (Filo, Gün 306–330).
# docs/STORY_FLOW.md "Yeni ölçüt: hikayesiz gün" ve DECISIONS #144: keşif görevindeki boş günlere yerel olay ve kamp anı.
# Bölüm 15 ihanetin (Gün 300) ardından gelir; filo Gün 320'de görünür (perde3_son). Gün 306–319 olayları filodan öncedir,
# Gün 321–330 olayları filonun ayın yanında asılı durduğu günlerdedir. Metinler kimin sattığına (ihanet_*), kimin kaldığına,
# dünyaların durumuna (kervan_*, batik_*, taht_*) ve Bölüm 15 üs sahnelerine (sb15_*, events/74_serbest_p3b.yaml) göre değişir.
# Havuz olayları → tohumla gelen devamları (bu dosyada, sayıma dahil):
#   bl15_kd_merdiven, bl15_pk_ondalik → bl15_us_tavvar · bl15_kd_tapu, bl15_kd_linc, bl15_kd_kacis → bl15_kd_kirkinci_kat
#   bl15_kd_can, bl15_bt_can, bl15_us_gok_sayaci → bl15_us_mektuplar · bl15_yt_haberci → bl15_us_ilan
#   bl15_tp_isaret → bl15_us_beyaz_kapi · bl15_sn_kazan → bl15_kr_atis
# Saha kampı sahneleri: bl15_kd_kamp_elif, bl15_kd_kamp_mert (Kule Dibi), bl15_tp_kamp_deniz (Tepe), bl15_pk_kamp_aras (Pirinç Kervan).
# Bu dosyanın bayrakları: flags/75_bolge_p3d.yaml.
olaylar:
  # ================================================================== MERDİVENDEN İNENLER (Kule Dibi)
  - id: "bl15_kd_merdiven"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 306, max: 318 }
    kosul: { bolum: 15, bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["kesif", "kule", "kervan", "filo"]
    gerilim: 2
    kart: { tr: "Merdivenden inenler", en: "Down the stairs" }
    sahne: "bl15_kd_merdiven_1"
    sahneler:
      - id: "bl15_kd_merdiven_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şafak sökerken Kule'nin zemin kat kapısı içeriden itiliyor. Önce iki Ellinci çıkıyor; halatlı, tozlu, elli katı yürüyerek inmiş insanların yorgunluğuyla. Arkalarından pirinç pullu, uzun boylu yolcular birer birer meydana süzülüyor.", en: "At first light, the Spire's ground-floor door gets pushed open from the inside. Two of the Fifties come out first, roped up and filthy, with the kind of tired you only get from walking down fifty floors. Behind them, one by one, tall travelers with brass scales drift out into the square." }
          - { tr: "Tavvarlar bunlar. Kimi sırtına katlanmış bir terazi bağlamış, kimi kucağında uyuyan bir çocuk taşıyor. Otuz kişi var yok; meydanın taşlarına basınca hepsi aynı anda duruyor, sanki zemini tartıyorlar.", en: "Tavvari. Some have folded scales strapped to their backs; some are carrying sleeping kids. Thirty of them, give or take. When they step onto the paving stones they all stop at once, like they're weighing the ground." }
          - { tr: "Ellincilerden biri sana dönüp alçak sesle anlatıyor: Filo yola çıkmadan önce bağlı dünyalardan sefer ondalığı toplamış. Kervanın pirinci, gemilerin omurgası, borcunu ödeyemeyenlerin kendisi... Ödeyemeyenler bir gece geçide yürümüş. \"Arkalarında kimse kalmadı,\" diyor. \"Önlerinde de biz varız.\"", en: "One of the Fifties turns to you and keeps his voice down. Before the fleet set out, it collected a war tithe from every bonded world. The Caravan's brass, the keels off its ships, and anybody who couldn't pay, the people themselves. The ones who couldn't pay walked into the passage one night. \"There's nobody left behind them,\" he says. \"And in front of them, there's us.\"" }
          - metin: { tr: "Boyun Senedi'ni kırdığın kervandan geliyorlar. Özgür kervan Karanlık Rota'da saklanıyormuş, ama filonun bir ikmal gemisi rotanın ağzına demirleyip yükünü hafifletmesini istemiş. Kervan da en yaşlılarını, en küçüklerini buraya yollamış.", en: "They're from the Caravan whose Neckbond you broke. The free Caravan's been hiding out on the Dark Route, but one of the fleet's supply ships dropped anchor at the mouth of it and told them to lighten their load. So the Caravan sent its oldest and its youngest here." }
            kosul: { bayrak: "kervan_ozgur" }
          - metin: { tr: "Senet senin adına yazılı; bu insanlar kâğıt üstünde senin. Mühürdar'ın adamları onları geçide sürerken arkalarından bağırmış: \"Sahibin malı sahibine!\"", en: "The bond's written in your name. On paper, these people are yours. When the Sealwarden's men drove them into the passage, they yelled after them: \"Property goes back to its owner!\"" }
            kosul: { bayrak: "kervan_sahibi" }
          - metin: { tr: "Aralarında Boş Kefe'nin sağ kalanları da var. Seni tanıyorlar; hiçbiri gözünü kaçırmıyor, hiçbiri de selam vermiyor.", en: "Some of the Empty Pan survivors are in the group. They know you. Not one of them looks away, and not one of them says hello." }
            kosul: { bayrak: "kervan_muhur_korundu" }
          - { tr: "Meydanın ortasında bir Lonca çavuşu tebeşirle yere kalın bir çizgi çekmiş. \"Geçitten gelen geri döner,\" diyor. \"Emir böyle. Kadim kokan hiçbir şey şehre girmez.\" Pazarcılar tezgâhlarının ardından seyrediyor; birinin elinde taş var.", en: "In the middle of the square, a Guild sergeant has chalked a thick line on the ground. \"Whatever comes out of the passage goes back,\" he says. \"Those are the orders. Nothing that smells like the Ancients gets into this city.\" The vendors watch from behind their stalls. One of them is holding a rock." }
          - metin: { tr: "Çavuş seni görünce hazır ola geçiyor. Emri veren Demir Yasa, Demir Yasa'nın sahibi de sensin.", en: "The sergeant snaps to attention when he sees you. The order comes from the Iron Law, and the Iron Law is yours." }
            kosul: { bayrak: "lonca_hakimiyeti" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "En yaşlı Tavvar'ın terazisinin kefesinde mühürlü bir defter duruyor. Mühür Kadim mührü; defteri tutan eller de hiç titremiyor.", en: "There's a sealed ledger sitting in the pan of the oldest Tavvari's scale. The seal is an Ancient seal, and the hands holding it aren't shaking at all." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kaçanların ağırlığı olmaz. kendi terazileri bile tartmaz artık onları.", en: "people who run don't weigh anything. not even their own scales will weigh them now." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Elli kat, yürüyerek, kucakta çocukla.\" Islık çalıyor. \"Senin şehrin bundan azına bile taş atar.\"", en: "\"Fifty floors. On foot. Carrying kids.\" He whistles. \"Your city throws rocks for a lot less.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Ayaklarına bak, hepsinde kan oturmuş. Önce oturmaları lazım, sonra konuşuruz.\"", en: "\"Look at their feet. Every one of them is bruised to the bone. They sit down first. Then we talk.\"" }
        secenekler:
          - id: "liman"
            etiket: { tr: "Hepsini kayda geçir, {yer:kiyikent_liman|e} götür", en: "Sign them all in. Take them to {yer:kiyikent_liman}" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "bl15_tavvar_liman"
              - tohum: { olay: "bl15_us_tavvar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Kule'den indirdiğin Tavvarlar birkaç gündür Gümrük'ün ambarında kalıyor.", en: "The Tavvari you brought down from the Spire have been staying in the Customs House warehouse for a few days now." } }
            sonraki: "bl15_kd_merdiven_liman"
          - id: "defter"
            etiket: { tr: "Defteri taşıyanı ayır; ötekiler geri dönsün", en: "Pull out the one with the ledger. The rest go back" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - bayrak: "bl15_tavvar_defter"
              - tohum: { olay: "bl15_us_tavvar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Kule'den aldığın yaşlı Tavvar birkaç gündür Gümrük'te, defterini kimseye vermeden bekliyor.", en: "The old Tavvari you took off the Spire stairs has been waiting at the Customs House for a few days, not letting anyone touch the ledger." } }
            sonraki: "bl15_kd_merdiven_defter"
          - id: "geri"
            etiket: { tr: "Çizgiye dokunma; emir emirdir", en: "Leave the line alone. Orders are orders" }
            etkiler:
              - ahlak: { merhamet: -3, duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "bl15_kd_merdiven_kapali"
            sonraki: "bl15_kd_merdiven_geri"

      - id: "bl15_kd_merdiven_liman"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tebeşir çizgisinin üstünden geçip Tavvarları arkana alıyorsun. Çavuş bir şey diyecek oluyor, gözü başının üstündeki sayıya kayınca vazgeçiyor.", en: "You step over the chalk line and put the Tavvari behind you. The sergeant starts to say something, glances up at the number over your head, and thinks better of it." }
          - { tr: "Pazarın ortasından geçerken taş havalanıyor. Havada yakalayıp avucunda tartıyorsun, sonra atanın tezgâhına geri bırakıyorsun. Kimse ikinci taşı atmıyor.", en: "Halfway through the market, the rock flies. You catch it out of the air, weigh it in your palm, and set it back down on the stall of the guy who threw it. Nobody throws a second one." }
          - { tr: "En arkadaki Tavvar çocuğu yürürken parmağıyla kaldırım taşlarını sayıyor. {yer:kiyikent_liman|e} vardığınızda dört yüz otuzda kalmış; sana dönüp sayıyı gururla söylüyor, sanki bu şehri satın almış.", en: "The littlest Tavvari kid at the back counts paving stones with one finger the whole way. By the time you reach {yer:kiyikent_liman}, the kid's up to four hundred thirty, and turns to tell you the number proudly, like they just bought the city." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ambarın kapısını aç", en: "Open the warehouse door" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_kd_merdiven_defter"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yaşlı Tavvar'ı kolundan tutup ayırıyorsun. Ötekiler ne olduğunu anlayınca hiç tartışmadan dönüp merdivene yöneliyor; elli kat, bu kez yukarı.", en: "You take the old Tavvari by the arm and pull her out of the line. When the others realize what's happening, they don't argue. They just turn and head for the stairs. Fifty floors, up this time." }
          - { tr: "Yaşlı kadın onların ardından bakarken ağlamıyor. Tavvarlar sessizliğin bedelini bilir. \"Defter benimle gelir,\" diyor sonunda. \"Ama şunu bil: Bugün sen de tartıldın.\"", en: "The old woman doesn't cry, watching them go. The Tavvari know what silence costs. \"The ledger comes with me,\" she says at last. \"But know this. Today, you got weighed too.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu {yer:kiyikent_liman|e} götür", en: "Take her to {yer:kiyikent_liman}" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_kd_merdiven_geri"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çizgiye dokunmuyorsun. Tavvarlar bir süre bekliyor, sonra hiçbir şey söylemeden geri dönüyor. Ellincilerden biri yere tükürüp onların peşinden merdivene giriyor.", en: "You don't touch the line. The Tavvari wait a while, then turn back without a word. One of the Fifties spits on the ground and follows them into the stairwell." }
          - { tr: "Kapı kapanınca çavuş kulpuna zincir dolayıp asma kilit vuruyor. Anahtarı cebine koyarken içi rahatlamış görünüyor. Kapının ardında, çok yukarılarda, bir çocuk ağlamaya başlıyor; ses katlar boyunca inip meydanda kayboluyor.", en: "Once the door shuts, the sergeant wraps a chain through the handle and snaps a padlock on it. He looks relieved, pocketing the key. Behind the door, way up, a kid starts crying. The sound comes down floor after floor and dies out in the square." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Meydandan uzaklaş", en: "Walk away from the square" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== TARTICININ DEFTERİ (Üs · tohum)
  - id: "bl15_us_tavvar"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 15, herhangi: [{ bayrak: "bl15_tavvar_liman" }, { bayrak: "bl15_tavvar_defter" }, { bayrak: "bl15_pk_cocuklar" }] }
    etiketler: ["kervan", "filo", "kadimler"]
    gerilim: 2
    kart: { tr: "Tartıcının defteri", en: "The weigher's ledger" }
    sahne: "bl15_us_tavvar_1"
    sahneler:
      - id: "bl15_us_tavvar_1"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "Gümrük'ün ambarında çuvallar duvara dayanmış, aralarına battaniyeler serilmiş. Tavvar çocukları ip atlıyor; ipi çevirenler {yer:kiyikent_liman|in} çocukları. Kimse onlara bunu yapmalarını söylememiş.", en: "In the Customs House warehouse, sacks are stacked against the walls with blankets spread between them. The Tavvari kids are jumping rope, and the ones turning the rope are kids from {yer:kiyikent_liman}. Nobody told them to." }
            kosul: { bayrak: "bl15_tavvar_liman" }
          - metin: { tr: "Gümrük'ün en arka odasında yaşlı Tavvar tek başına oturuyor. Ötekiler merdivenden geri çıkalı beri ağzını açmamış; yemeğini yemiş, suyunu içmiş, defteri de dizlerinden indirmemiş.", en: "In the back room of the Customs House, the old Tavvari sits alone. She hasn't said a word since the others went back up the stairs. She's eaten her food and drunk her water, and the ledger hasn't left her lap." }
            kosul: { bayrak: "bl15_tavvar_defter" }
          - metin: { tr: "Geçitten getirdiğin Tavvar çocukları Gümrük'ün avlusunda; birbirlerinin pullarını parlatıp yalınayak koşuşuyorlar. Onlara kervanın en yaşlı tartıcısı göz kulak oluyor; elinde bir defterle onların peşinden o da gelmiş.", en: "The Tavvari kids you brought through the passage are out in the Customs House yard, polishing each other's scales and running around barefoot. The Caravan's oldest weigher is keeping an eye on them. She followed them through, a ledger in her hands." }
            kosul: { bayrak: "bl15_pk_cocuklar", bayrak_yok: ["bl15_tavvar_liman", "bl15_tavvar_defter"] }
          - { tr: "Tartıcının adı Pelem. Seni görünce defteri açıp kucağında sana doğru çeviriyor; mühür bozulmuş, sayfalar pirinç tozuyla yapış yapış. Sistem satırları birer birer çeviriyor: [Kırk sekiz gövde için pirinç kaplama. Yedi taht için kırk günlük erzak. Üç bin kafes.]", en: "The weigher's name is Pelem. When she sees you, she opens the ledger in her lap and turns it toward you. The seal's broken and the pages are sticky with brass dust. The System translates the lines one at a time: [Brass plating for forty-eight hulls. Forty days' provisions for seven thrones. Three thousand cages.]" }
          - { tr: "\"Kırk gün,\" diyor Pelem, boğumlu parmağını satırın üstünde tutarak. \"Kuşatmaya gelen ordu yıllık erzak yükler. Kırk günlük erzakla gelen ordu savaşmaya değil, toplamaya gelir.\"", en: "\"Forty days,\" Pelem says, holding a knobby finger on the line. \"An army that comes for a siege packs a year of supplies. An army that packs forty days isn't coming to fight. It's coming to collect.\"" }
        sezgiler:
          - kosul: { stat: { int: 230 } }
            metin: { tr: "Üç bin kafes. {yer:kiyikent|in} Sıralama'ya girmiş avcılarının sayısı da aşağı yukarı bu kadar. Kafesler seviyesi olanlar için.", en: "Three thousand cages. That's roughly how many hunters in {yer:kiyikent} made the Global Ranking. The cages are for people with levels." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kafes senin için değil. senin için başka bir şey yaptılar. onu deftere yazmazlar.", en: "the cages aren't for you. they built something else for you. that doesn't go in a ledger." }
        secenekler:
          - id: "lonca"
            etiket: { tr: "Defteri {npc:kaya_demir|in} topçularına götür", en: "Take the ledger to {npc:kaya_demir|pos} gunners" }
            goster: { npc_hayatta: "kaya_demir" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
              - bayrak: "bl15_defter_lonca"
            sonraki: "bl15_us_tavvar_lonca"
          - id: "konsey"
            etiket: { tr: "Konsey'e götür; herkes bilsin", en: "Take it to the Council. Everyone should know" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { guven: 4 } }
              - bayrak: "bl15_defter_konsey"
            sonraki: "bl15_us_tavvar_konsey"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|e} okut; çevirinin sakladığını o söylesin", en: "Have {npc:thessar} read it. Let him say what the translation skips" }
            goster: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
            etkiler:
              - iliski: { thessar: { guven: 5 } }
              - bayrak: "bl15_defter_thessar"
            sonraki: "bl15_us_tavvar_thessar"
          - id: "sakla"
            etiket: { tr: "Defteri al ve sakla; kimse bilmesin", en: "Take the ledger and hide it. Nobody needs to know" }
            etkiler:
              - gizle: 2
              - ahlak: { insanlik: -1 }
              - iliski: { elif_sari: { guven: -2 } }
              - bayrak: "bl15_defter_sakli"
            sonraki: "bl15_us_tavvar_sakli"

      - id: "bl15_us_tavvar_lonca"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Mendirekteki topçular defteri bir top kızağının üstüne açıp başına toplanıyor. Kırk sekiz gövde, pirinç kaplama... Topçubaşı kaplamanın kalınlığını soruyor, Pelem iki parmağını aralayıp gösteriyor.", en: "The gunners on the breakwater open the ledger on top of a gun carriage and crowd around it. Forty-eight hulls, brass plating. The gun chief asks how thick the plating is, and Pelem holds two fingers apart to show him." }
          - { tr: "{npc:kaya_demir} uzun süre sayfaya bakıyor. \"Bu kalınlığı bizim mermi delmez,\" diyor sonunda. \"Ama perçinleri deler. Gemiyi değil, dikişini vuracağız.\" Topçulara dönüp hedef çizelgesini baştan yazdırıyor.", en: "{npc:kaya_demir} stares at the page for a long time. \"Our shells won't punch through that,\" he says finally. \"But they'll punch through the rivets. We don't shoot the ship. We shoot the seams.\" He turns to the gunners and has them redo the target sheets from scratch." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pelem'i ambara geri götür", en: "Walk Pelem back to the warehouse" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_us_tavvar_konsey"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Konsey salonunda defter elden ele dolaşıyor. \"Üç bin kafes\" satırına gelen herkes bir an duraklıyor, sonra defteri hızla yanındakine veriyor; sanki elinde tutarsa satır onun adını yazacak.", en: "In the Council hall, the ledger goes hand to hand. Everybody who hits the line about three thousand cages stops for a second, then passes it along fast, like the line might write their name in if they hold it too long." }
          - { tr: "{npc:elif_sari} defteri en son alıyor ve kapatıyor. \"Kırk gün,\" diyor salona. \"Demek kırk bir gün dayanırsak aç kalan onlar olur.\" Kimse gülmüyor, ama birkaç kişi ilk kez başını kaldırıyor.", en: "{npc:elif_sari} gets it last and closes it. \"Forty days,\" she tells the room. \"So if we hold out forty-one, they're the ones who go hungry.\" Nobody laughs, but a few people lift their heads for the first time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Salondan çık", en: "Leave the hall" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_us_tavvar_thessar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} defteri iki parmağıyla, kirli bir mendil tutar gibi açıyor. Sayfaları hızlı hızlı çevirip birinde duruyor; Sistem'in çevirmeden geçtiği, senin süslü bir imza sandığın satırda.", en: "{npc:thessar} opens the ledger with two fingers, the way you'd pick up a dirty handkerchief. He flips fast and stops on one page, at a line the System skipped without translating. You'd taken it for a fancy signature." }
          - { tr: "\"Elçinin başı için tek kişilik kafes, gümüş parmaklıklı,\" diye okuyor, sesi düz. Sonra hafifçe gülümsüyor. \"Gümüş. Beni hâlâ önemsiyorlar demek. Bu ırkın en güzel yanı hiçbir şeyi israf etmemesidir.\"", en: "\"One single cage for the Envoy's head, silver bars,\" he reads, flat. Then he smiles a little. \"Silver. So they still think highly of me. The finest thing about my people is that they never waste anything.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defteri ondan geri al", en: "Take the ledger back from him" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_us_tavvar_sakli"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Defteri ceketinin içine sokuyorsun. Pelem itiraz etmiyor; yalnızca boş kucağına bakıp ellerini dizlerinde kavuşturuyor.", en: "You tuck the ledger inside your jacket. Pelem doesn't object. She just looks down at her empty lap and folds her hands on her knees." }
          - { tr: "\"Kervanda bilgiyi saklayan en ağır basar,\" diyor. \"Tartıya hep o çıkar.\" Ardından çocuklara dönüp sana başka bir şey söylemiyor.", en: "\"In the Caravan, whoever keeps the knowledge weighs the most,\" she says. \"They're always the one who ends up on the scale.\" Then she turns back to the kids and doesn't say anything else to you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ambardan çık", en: "Leave the warehouse" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== KAT TAPUSU (Kule Dibi)
  - id: "bl15_kd_tapu"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 306, max: 318 }
    kosul: { bolum: 15 }
    agirlik: 5
    etiketler: ["kesif", "kule", "pazar", "filo"]
    gerilim: 2
    kart: { tr: "Kat tapusu", en: "Floor deeds" }
    sahne: "bl15_kd_tapu_1"
    sahneler:
      - id: "bl15_kd_tapu_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın en kalabalık tezgâhında ne iksir satılıyor ne kat haritası. Tezgâhın üstüne Kule'nin elle çizilmiş bir kesiti asılmış; kırkıncı kattan kırk dokuzuncuya kadar her kat kutu kutu bölünmüş, kutuların çoğunun üstü kırmızıyla çizilmiş: SATILDI.", en: "The busiest stall in the market isn't selling potions or floor maps. Hanging over it is a hand-drawn cross section of the Spire, every floor from forty to forty-nine split into little boxes, and most of the boxes are crossed out in red: SOLD." }
          - { tr: "Tezgâhın ardındaki adam takım elbise giymiş; yakasındaki rozet kıyametten önceki bir emlak ofisinden kalma. \"Filo Kule'yi vurmaz, hanımlar beyler,\" diye bağırıyor. \"Kule Sistem'in kendi yapısı; insan kendi evini yakar mı? Kırkıncı kat ve üstü dünyanın en güvenli adresi!\"", en: "The man behind the stall is wearing a suit, with a pin on his lapel left over from some pre-apocalypse real estate office. \"The fleet won't touch the Spire, ladies and gentlemen!\" he's shouting. \"The Spire belongs to the System itself. Who burns down their own house? Floor forty and up, the safest address on Earth!\"" }
          - { tr: "Önünde kuyruk var. İnsanlar ellerinde konserve kutuları, ilaç şişeleri, mahalle depolarından alınmış un çuvallarıyla bekliyor. Bir kadın alyansını çıkarıp tezgâha bırakıyor, karşılığında mühürlü bir kâğıt alıp göğsüne bastırıyor.", en: "There's a line in front of him. People are waiting with canned goods, medicine bottles, sacks of flour out of the neighborhood stockpiles. A woman pulls off her wedding ring, sets it on the counter, and gets a stamped sheet of paper back that she presses to her chest." }
          - metin: { tr: "Tezgâhın kenarına senin adın da yazılmış: \"Ellinciler'in Kat'ında odası olan kahramanımız bile yukarıda kalıyor!\" Adam seni kalabalıkta görünce sesini bir perde daha yükseltiyor.", en: "Your name's on the side of the stall too: \"Even our hero with a room on the Fifties' Floor stays up top!\" When the man spots you in the crowd, he gets a notch louder." }
            kosul: { bayrak: "p3_ellinci_oda" }
          - metin: { tr: "\"Ellinciler kapılarını açtı, ama yer sınırlı!\" diye ekliyor adam. \"Kırkların fiyatı bugünlük yarım çuval un!\"", en: "\"The Fifties opened their doors, but space is limited!\" the man adds. \"The forties are half a sack of flour, today only!\"" }
            kosul: { bayrak: "p3_ellinci_kapi_acildi" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Kâğıtlardaki mühür Lonca'nın demir halkası gibi görünüyor, ama halkada bir boğum eksik. Biri gerçek bir mührün mumunu kopyalamış; ustaca, ama acele etmiş.", en: "The stamp on the papers looks like the Guild's iron ring, but the ring's missing a knurl. Somebody copied a real seal from the wax. Good work, but rushed." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kule'yi vurmazlar belki. ama içindekileri de saymazlar.", en: "maybe they won't hit the spire. they won't count who's inside it either." }
        yoldas_tepkileri:
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Filonun Kule'yi vurmayacağına dair hiçbir veri yok. Vuracağına dair de yok. Adam boşluğu satıyor.\"", en: "\"There's zero data saying the fleet won't hit the Spire. There's zero saying it will, either. He's selling the gap.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O kadın alyansını verdi. Gördün mü? Hiç düşünmeden verdi.\"", en: "\"That lady just handed over her wedding ring. You see that? Didn't even think about it.\"" }
        secenekler:
          - id: "boz"
            etiket: { tr: "Mührün sahte olduğunu kalabalığa göster", en: "Show the crowd the seal is fake" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl15_tapu_bozuldu"
              - tehlike: { kule_dibi: 2 }
            sonraki: "bl15_kd_tapu_boz"
          - id: "kura"
            etiket: { tr: "Tapulara el koy; çocuklu ailelere kurayla dağıt", en: "Seize the deeds. Hand them out to families with kids, by lottery" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - dikkat: 2
              - bayrak: "bl15_tapu_kura"
              - tohum: { olay: "bl15_kd_kirkinci_kat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Kurayla tapu verdiğin aileler birkaç gün önce Kule'ye çıktı; kırkıncı kattan haber gelmedi.", en: "The families you gave deeds to by lottery went up the Spire a few days ago. No word from the fortieth floor since." } }
            sonraki: "bl15_kd_tapu_kura"
          - id: "lonca"
            etiket: { tr: "Lonca adına el koy; katları askerlerin ailelerine ver", en: "Seize it in the Guild's name. Give the floors to soldiers' families" }
            goster: { herhangi: [{ bayrak: "uye_lonca" }, { bayrak: "lonca_hakimiyeti" }] }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "bl15_tapu_lonca"
              - tohum: { olay: "bl15_kd_kirkinci_kat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Lonca'nın aileleri birkaç gün önce kırkıncı kata yerleşti; dün oradan bir haberci indi.", en: "The Guild families moved onto the fortieth floor a few days ago. Yesterday a runner came down from there." } }
            sonraki: "bl15_kd_tapu_lonca"
          - id: "birak"
            etiket: { tr: "Bırak; adam umut satıyor, insanlar umut alıyor", en: "Let it go. He's selling hope, and people are buying" }
            etkiler:
              - ahlak: { merhamet: -1, duzen: -1 }
              - bayrak: "bl15_tapu_serbest"
              - tohum: { olay: "bl15_kd_kirkinci_kat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Kat tapusu alanlar birkaç gün önce Kule'ye çıktı. Dün içlerinden biri tek başına, yüzü kan içinde indi.", en: "The people who bought floor deeds went up the Spire a few days ago. Yesterday one of them came back down alone, face covered in blood." } }
            sonraki: "bl15_kd_tapu_birak"

      - id: "bl15_kd_tapu_boz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kadının göğsüne bastırdığı kâğıdı nazikçe alıp güneşe tutuyorsun, sonra kalabalığa çevirip halkadaki eksik boğumu parmağınla gösteriyorsun. Önce kimse anlamıyor; derken Lonca'dan emekli bir demirci \"Bu bizim halka değil,\" diye bağırıyor.", en: "You gently take the paper the woman's holding to her chest, hold it up to the sun, then turn it to the crowd and put your finger on the missing knurl. Nobody gets it at first. Then a retired Guild smith yells, \"That's not our ring!\"" }
          - { tr: "Adam tezgâhı devirip kaçıyor; arkasında konserveler, ilaçlar, bir avuç alyans kalıyor. İnsanlar mallarını geri alırken tartışıyor, itişiyor; bir un çuvalı yırtılıp meydanı beyaza boyuyor. Kadın alyansını buluyor ama kâğıdı atamıyor, katlayıp cebine koyuyor.", en: "The man kicks over the stall and bolts, leaving canned goods, medicine, and a handful of wedding rings behind. People argue and shove, getting their stuff back. A flour sack rips open and turns the square white. The woman finds her ring, but she can't bring herself to throw the paper away either. She folds it and puts it in her pocket." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kalabalık dağılana kadar bekle", en: "Wait until the crowd clears" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_tapu_kura"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tezgâhın önüne geçip kesiti duvardan indiriyorsun. Adam itiraz etmeye kalkınca sesin meydanı susturuyor: Tapular bugünden sonra satılmayacak, kurayla verilecek. Önce çocuklu aileler.", en: "You step up to the stall and pull the cross section off the wall. When the man tries to object, your voice shuts the whole square up. No more selling deeds after today. They'll go by lottery. Families with kids first." }
          - { tr: "Kurayı boş bir konserve kutusundan çekiyorsun. Kazananlar ağlıyor, kaybedenler daha çok ağlıyor. Adamın verdiği güvenceyi artık kimse sorgulamıyor, çünkü güvenceyi artık sen veriyorsun.", en: "You draw names out of an empty can. The winners cry. The losers cry harder. Nobody questions the man's guarantee anymore, because now you're the one giving it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kazananları merdivene kadar götür", en: "Walk the winners to the stairs" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_tapu_lonca"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halkanı kaldırınca iki Lonca askeri tezgâhın iki yanına geçiyor. Adam mührünü saklamaya çalışıyor; askerlerden biri onu elinden alıp kuyruğun önünde ikiye kırıyor.", en: "You raise your Guild ring, and two Guild soldiers take up positions on either side of the stall. The man tries to hide his stamp. One of the soldiers takes it out of his hand and snaps it in two in front of the whole line." }
          - { tr: "Katlar Lonca askerlerinin ailelerine yazılıyor. Kuyruktakiler mallarını geri alıp sessizce dağılıyor. Hiçbiri bir şey demiyor, ama giderken askerlerin ailelerini uzun uzun süzüyorlar.", en: "The floors get assigned to Guild soldiers' families. The people in line take their things back and scatter without a sound. Nobody says anything, but as they walk away they give the soldiers' families a long look." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Listeyi onayla", en: "Sign off on the list" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_tapu_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tezgâhın önünden geçip gidiyorsun. Arkanda adam bir kutunun daha üstünü kırmızıyla çiziyor.", en: "You walk past the stall. Behind you, the man crosses out one more box in red." }
          - { tr: "Meydanın köşesinde tapusunu almış bir aile, sırtlarında bohçalarıyla Kule'nin kapısına yürüyor. En küçükleri kâğıdı bayrak gibi sallıyor. Kapıdaki nöbetçi kâğıda bakıp omuz silkiyor; kimin neyi satın aldığını o da bilmiyor.", en: "At the corner of the square, a family with a deed walks toward the Spire's door, bundles on their backs. The littlest one's waving the paper like a flag. The guard at the door looks at it and shrugs. He doesn't know what anybody's buying either." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pazardan çık", en: "Leave the market" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== HAİNİN ADAMI (Kule Dibi)
  - id: "bl15_kd_linc"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 306, max: 319 }
    kosul: { bolum: 15 }
    agirlik: 5
    etiketler: ["kule", "ihanet", "kalabalik"]
    gerilim: 3
    kart: { tr: "Hainin adamı", en: "The traitor's man" }
    sahne: "bl15_kd_linc_1"
    sahneler:
      - id: "bl15_kd_linc_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pazarın eski bayrak direğinin çevresine kalabalık toplanmış. Direğe tırmanış halatıyla yirmili yaşlarda bir adam bağlanmış; boynuna mukavvadan bir levha asılmış, üstünde boyayla tek bir sözcük: HAİN.", en: "A crowd's gathered around the market's old flagpole. A guy in his twenties is tied to it with climbing rope, a piece of cardboard hung around his neck with one word painted on it: TRAITOR." }
          - metin: { tr: "Adamın kolunda Sessiz Ağ'ın telsizcilerinin taktığı gri bant var. \"Ağ'cılar bizi sattı!\" diye bağırıyor biri. \"Listeyi onlar yolladı, bu da dinledi!\"", en: "He's wearing the gray armband the Quiet Network's radio operators wear. \"The Network sold us out!\" somebody yells. \"They sent the list, and this guy was listening in!\"" }
            kosul: { bayrak: "ihanet_mert" }
          - metin: { tr: "Adamın üstünde Lonca'nın lacivert ceketi var, omzundaki arma sökülmüş. \"Darbe gecesi Konsey'in kapısında nöbetteydi!\" diye bağırıyor biri. \"Kapıyı o açtı!\"", en: "He's wearing a navy Guild jacket with the patch torn off the shoulder. \"He was on guard at the Council door the night of the coup!\" somebody yells. \"He's the one who opened it!\"" }
            kosul: { bayrak: "ihanet_kaya" }
          - metin: { tr: "Adamın beyaz gömleği çamura bulanmış. \"{yer:tepe|in} beyazlarından!\" diye bağırıyor biri. \"Seçilmişler onlarla birlikte geldi, birlikte gidecek!\"", en: "His white shirt's caked with mud. \"He's one of the whites from {yer:tepe}!\" somebody yells. \"The chosen came in with them, and they'll go out with them!\"" }
            kosul: { bayrak: "ihanet_deniz" }
          - metin: { tr: "Adamın sırtında siyah bir ceket var; Sıralama'daki avcıların taklit ettiği o ceketlerden. \"Ellinci kattaki kapıyı onlar açtı!\" diye bağırıyor biri. \"Siyah ceketliler Kadimler'e kapı tuttu!\"", en: "He's got a black jacket on, one of those knockoffs the Ranking hunters wear. \"They opened that door on the fiftieth floor!\" somebody yells. \"The black jackets held the door for the Ancients!\"" }
            kosul: { herhangi: [{ bayrak: "ihanet_aras" }, { bayrak: "ihanet_ikinci_sira" }] }
          - metin: { tr: "Adamın bileğinde Kadim yazısıyla bir dövme var; {yer:pirinc_kervan|den} dönen tüccarların gösteriş için yaptırdığı türden. \"Elçi kendi ırkını sattıysa bunlar da bizi satar!\" diye bağırıyor biri.", en: "He's got a tattoo in Ancient script on his wrist, the kind traders coming back from {yer:pirinc_kervan} get for show. \"If the Envoy sold out his own kind, these guys will sell us out too!\" somebody yells." }
            kosul: { bayrak: "ihanet_thessar" }
          - metin: { tr: "Adamın cebinden Kadim işi bir jeton çıkmış; kalabalığın elden ele dolaştırdığı şey o. \"Masada hain yoksa sokakta vardır!\" diye bağırıyor biri.", en: "An Ancient-made token fell out of his pocket, and that's what the crowd is passing around. \"If there wasn't a rat at the table, there's one on the street!\" somebody yells." }
            kosul: { bayrak_yok: ["ihanet_mert", "ihanet_kaya", "ihanet_deniz", "ihanet_aras", "ihanet_ikinci_sira", "ihanet_thessar"] }
          - { tr: "En önde, elinde benzin bidonuyla iri yarı bir adam bağırıyor. Bağlı adam ne ağlıyor ne yalvarıyor; dudakları kıpırdıyor, birinin adını tekrarlıyor gibi.", en: "Out in front, a big guy holding a gas can is doing most of the yelling. The tied-up man isn't crying or begging. His lips are moving, like he's saying someone's name over and over." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Levhadaki boya henüz kurumamış. Bidonlu adamın parmaklarında da aynı boya var; aynı yeşil, aynı sıçrantılar.", en: "The paint on the sign isn't dry yet. The guy with the gas can has the same paint on his fingers. Same green, same spatter." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "korkunca hep bir yüz ararlar. bulamazlarsa uydururlar. sana da bir gün bir levha yazacaklar.", en: "when they're scared they always look for a face. if they can't find one they make one up. someday they'll paint a sign for you too." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "ihanet_deniz" }
            metin: { tr: "\"O levhanın bir benzerini bana da yazdılar. Yalnızca adımı yazmaya cesaret edemediler.\"", en: "\"They made one of those signs for me too. They just didn't have the guts to write my name on it.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bileklerine bak. Halat iki saattir orada; birazdan elleri ölecek.\"", en: "\"Look at his wrists. That rope's been on two hours. His hands are going to go dead soon.\"" }
        secenekler:
          - id: "boya"
            etiket: { tr: "Bidonlu adamın parmaklarındaki boyayı göster", en: "Point out the paint on the gas-can guy's fingers" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - bayrak: "bl15_linc_iftira"
              - iliski: { elif_sari: { saygi: 2 } }
            sonraki: "bl15_kd_linc_iftira"
          - id: "kes"
            etiket: { tr: "Halatı kes, onu yanına al", en: "Cut the rope. Take him with you" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - dikkat: 2
              - bayrak: "bl15_linc_saklandi"
              - tohum: { olay: "bl15_kd_kirkinci_kat", gecikme: { min: 2, max: 4 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Direkten kurtardığın adam birkaç gündür Kule'nin kırkıncı katında saklanıyor.", en: "The man you cut down off the flagpole has been hiding on the Spire's fortieth floor for a few days." } }
            sonraki: "bl15_kd_linc_kes"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} bak; kalabalığa o konuşsun", en: "Look at {npc:deniz_arman}. Let them talk to the crowd" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { deniz_arman: { guven: 5, baglilik: 3 } }
              - bayrak: "bl15_linc_deniz"
            sonraki: "bl15_kd_linc_deniz"
          - id: "konsey"
            etiket: { tr: "Konsey'e teslim et; orada yargılansın", en: "Hand him to the Council. He gets a trial" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { siginak: 2 }
              - iliski: { elif_sari: { saygi: 3 } }
              - bayrak: "bl15_linc_konsey"
            sonraki: "bl15_kd_linc_konsey"
          - id: "birak"
            etiket: { tr: "Kalabalığın işine karışma", en: "Stay out of the crowd's business" }
            etkiler:
              - ahlak: { merhamet: -4, insanlik: -2 }
              - bayrak: "bl15_linc_kalabalik"
            sonraki: "bl15_kd_linc_birak"

      - id: "bl15_kd_linc_iftira"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bidonlu adamın bileğini yakalayıp elini kalabalığın önünde havaya kaldırıyorsun. Parmakları yemyeşil. Kimse bir şey demiyor; herkes önce ele, sonra levhaya bakıyor.", en: "You grab the gas-can guy by the wrist and hold his hand up in front of everybody. His fingers are bright green. Nobody says anything. Everybody looks at the hand, then at the sign." }
          - { tr: "Arkalardan yaşlı bir kadın konuşuyor: Bağlı adam bidonlunun alt katında oturuyormuş, bidonlu da aylardır onun dairesine göz dikmiş. Kalabalık sessizce dağılırken halatı kendi elleriyle çözen de o kadın oluyor.", en: "An old woman in the back speaks up. The tied-up guy lives in the apartment under the gas-can guy, who's had his eye on that apartment for months. As the crowd quietly breaks up, she's the one who unties the rope with her own hands." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bidonlu adamı Konsey nöbetçilerine bırak", en: "Leave the gas-can guy with the Council guards" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_kd_linc_kes"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Halatı tek hamlede kesiyorsun. Kalabalık bir adım öne çıkıyor, sonra iki adım geri gidiyor. Bidonlu adam bir şey diyecek gibi oluyor; yüzüne bakınca bidonu yere bırakıyor.", en: "You cut the rope in one stroke. The crowd steps forward, then two steps back. The gas-can guy looks like he's about to say something, then sees your face and sets the can down." }
          - { tr: "Adamı koluna takıp götürüyorsun. Şehirde artık onun için güvenli bir sokak yok; Kule'nin kırkıncı katında ise kimse kimseye ad sormuyor. \"Neden?\" diye soruyor merdivende. \"Ya gerçekten hainsem?\"", en: "You loop his arm through yours and walk him off. There isn't a safe street in the city for him now, but on the Spire's fortieth floor nobody asks anybody's name. \"Why?\" he asks on the stairs. \"What if I really am a traitor?\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"O zaman sana ben göz kulak olurum.\"", en: "\"Then I'll be the one keeping an eye on you.\"" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_linc_deniz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:deniz_arman} direğin dibine çıkıp kalkanını adamın önüne dayıyor. \"Ben de bir zamanlar bu levhayı hak ettim,\" diyor kalabalığa. \"Belki hâlâ hak ediyorum. Yakacaksanız önce beni yakın.\"", en: "{npc:deniz_arman} climbs up to the foot of the pole and plants the shield in front of the man. \"I earned a sign like this once,\" {zamir:deniz_arman|o} tell{zamir:deniz_arman|s} the crowd. \"Maybe I still do. You want to burn somebody, burn me first.\"" }
          - metin: { tr: "Kalabalığın yarısı {npc:deniz_arman|in} {yer:tepe|de} ne yaptığını biliyor. Hiçbiri kımıldamıyor.", en: "Half the crowd knows what {npc:deniz_arman} did up in {yer:tepe}. Nobody moves." }
            kosul: { bayrak: "ihanet_deniz" }
          - { tr: "Bidonlu adam bir süre {npc:deniz_arman|e}, bir süre sana bakıyor, sonra bidonu bırakıp kalabalığın arasında kayboluyor. Halatı {npc:deniz_arman} çözüyor; ellerinin titrediğini yalnız sen görüyorsun.", en: "The gas-can guy looks at {npc:deniz_arman} for a while, then at you, then drops the can and disappears into the crowd. {npc:deniz_arman} unties the rope. You're the only one who sees {zamir:deniz_arman|onun} hands shaking." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "{npc:deniz_arman|in} omzuna dokun", en: "Put a hand on {npc:deniz_arman|pos} shoulder" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_kd_linc_konsey"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Konsey'in adını anmak kalabalığı soğutmaya yetmiyor; ama senin sesinle anılınca yetiyor. İki Konsey nöbetçisi adamı direkten çözüp aralarına alıyor.", en: "Saying the Council's name isn't enough to cool the crowd down. Saying it in your voice is. Two Council guards untie the man and take him between them." }
          - { tr: "Bidonlu adam arkalarından bağırıyor: \"Konsey de satıldı! Hepiniz satıldınız!\" Kimse ona karşılık vermiyor. Adam nöbetçilerin arasında yürürken bir kez dönüp sana bakıyor; teşekkür mü ediyor, suçluyor mu, belli değil.", en: "The gas-can guy yells after them: \"The Council's sold out too! You're all sold out!\" Nobody answers him. Walking between the guards, the man turns once to look at you. Whether he's thanking you or blaming you, you can't tell." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onları gözden kaybolana kadar izle", en: "Watch them until they're out of sight" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_linc_birak"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Arkanı dönüp pazarın öbür ucuna yürüyorsun. Arkandan bir süre bağırışlar geliyor, sonra bir çığlık, sonra o tuhaf sessizlik.", en: "You turn around and walk to the other end of the market. For a while there's yelling behind you, then a scream, then that strange kind of quiet." }
          - { tr: "Akşamüstü yine meydandan geçiyorsun. Direk boş, halat kesilmiş; dibinde yanmış bir mukavva parçası duruyor. Adamın ne olduğunu kimse söylemiyor, sen de sormuyorsun.", en: "You cross the square again late in the afternoon. The pole's empty and the rope's been cut. There's a burned scrap of cardboard at the base. Nobody says what happened to the man, and you don't ask." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== DÖNMEYENLER ÇANI (Kule Dibi)
  - id: "bl15_kd_can"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 306, max: 319 }
    kosul: { bolum: 15 }
    agirlik: 5
    etiketler: ["kesif", "kule", "siralama", "filo"]
    gerilim: 2
    kart: { tr: "Dönmeyenler çanı", en: "The bell for the lost" }
    sahne: "bl15_kd_can_1"
    sahneler:
      - id: "bl15_kd_can_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısının yanındaki iskeleye eski bir vapur çanı asılı. Pirinci yeşillenmiş, üstünde batmış vapurun adı hâlâ okunuyor. Kule'ye çıkıp dönmeyen her avcı için bir kez çalınır; meydanda bunu bilmeyen yoktur.", en: "On the scaffold beside the Spire's door hangs an old ferry bell. The brass has gone green, and you can still read the name of the sunken ferry on it. It rings once for every hunter who goes up the Spire and doesn't come back. Everybody in the square knows that." }
          - { tr: "Filonun haberi yayıldığından beri tırmanış kuyruğu meydanın iki ucuna kadar uzanıyor. Herkes gemiler gelmeden birkaç seviye daha kapmak istiyor. Çan da ha bire çalıyor; bugün öğleye kadar on bir kez çalmış.", en: "Ever since word of the fleet got around, the line to climb has stretched from one end of the square to the other. Everybody wants to grab a few more levels before the ships show up. And the bell keeps ringing. Eleven times today, and it isn't noon yet." }
          - { tr: "İpin başında ak saçlı, iri yarı bir kadın oturuyor: o vapurun eski kaptanı Nermin. Çanın ipini dizlerine sarmış ama çekmiyor. \"Çaldıkça kuyruk uzuyor,\" diyor sana. \"Her çanda gençler biraz daha acele ediyor. Vakit daralıyor sanıp daha yukarı koşuyorlar. Ben artık çalmayacağım.\"", en: "At the end of the rope sits a big, white-haired woman: Nora, who used to captain that ferry. She's got the bell rope wrapped around her knees, but she isn't pulling it. \"Every time I ring it, the line gets longer,\" she tells you. \"Every bell, the kids get a little more desperate. They think time's running out, so they climb higher. I'm not ringing it anymore.\"" }
          - metin: { tr: "Kuyruğun başlarında on yaşlarında bir çocuk tahta bir kılıçla bekliyor. Annesi yanında, elinde kâğıttan bir tapu; kırkıncı kata çıkacaklar.", en: "Near the front of the line, a kid of maybe ten waits with a wooden sword. His mother's next to him holding a paper deed. They're headed for the fortieth floor." }
            kosul: { herhangi: [{ bayrak: "bl15_tapu_serbest" }, { bayrak: "bl15_tapu_kura" }] }
          - metin: { tr: "Kuyruğun yarısı Sıralama'daki yerini yükseltmeye çalışan avcılar. Birkaçı seni görünce kuyruktan çıkıp yanına geliyor: \"Komutan, filo günü bayrağının altında olacağız. Ama önce biraz güçlenmemiz lazım.\"", en: "Half the line is hunters trying to move up the Ranking. A few of them see you, step out of line, and come over. \"Commander, we'll be under your banner on fleet day. We just need to get stronger first.\"" }
            kosul: { bayrak: "p3_bayrak_kuruldu" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Kuyruktakilerin çoğu otuz beşinci katın üstüne çıkacak seviyede değil. Gemiler gelmeden önce Kule onları teker teker toplayacak.", en: "Most of the people in that line aren't high enough to make it past the thirty-fifth floor. Before the ships ever get here, the Spire's going to harvest them one by one." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "çan çalmazsa ölmeyecekler mi sanıyor? yalnızca kimse duymayacak. ikisi aynı şey değil.", en: "does she think they won't die if the bell doesn't ring? nobody'll hear it, that's all. those aren't the same thing." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Ben de böyle tırmandım. Kimse beni durdurmadı. Durdursalar herhalde kızardım.\" Bir an duruyor. \"Ya da daha uzun yaşardım.\"", en: "\"That's how I climbed. Nobody stopped me. If they had, I'd have been pissed, probably.\" He pauses. \"Or I'd have lived longer.\"" }
        secenekler:
          - id: "ac"
            tur: "aciga_vur"
            etiket: { tr: "Kuyruğun önünde gerçek seviyeni aç", en: "Open your true level in front of the line" }
            etkiler:
              - aciga_vur: true
              - ahlak: { merhamet: 2, duzen: 1 }
              - tehlike: { kule_dibi: -4 }
              - bayrak: "bl15_can_kuyruk_dagildi"
            sonraki: "bl15_kd_can_ac"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|e} kuyruğu muayene ettir; hazır olmayan dönsün", en: "Have {npc:elif_sari} screen the line. Anyone not ready gets turned back" }
            goster: { yoldas: "elif_sari" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 4, saygi: 2 } }
              - tehlike: { kule_dibi: -2 }
              - bayrak: "bl15_can_muayene"
            sonraki: "bl15_kd_can_elif"
          - id: "adlar"
            etiket: { tr: "\"Çalma. Adları ölmeden yazdıralım.\"", en: "\"Don't ring it. Let's get the names written down while they're alive.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - bayrak: "bl15_can_sustu"
              - tohum: { olay: "bl15_us_mektuplar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "{yer:kule_dibi|de} çanı susturan kaptan birkaç gündür Gümrük'te, bir sandığın başında oturuyor.", en: "The captain who silenced the bell at {yer:kule_dibi} has been at the Customs House for a few days, sitting next to a chest." } }
            sonraki: "bl15_kd_can_adlar"
          - id: "cal"
            etiket: { tr: "İpi ondan al; bugünkü çanları sen çal", en: "Take the rope from her. Ring today's bells yourself" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - bayrak: "bl15_can_caldi"
            sonraki: "bl15_kd_can_cal"

      - id: "bl15_kd_can_ac"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Pencereni açıp gerçek satırını kuyruğun üstünde, herkesin göreceği yükseklikte bırakıyorsun. Meydanın gürültüsü önce önden arkaya doğru, sonra arkadan öne doğru kesiliyor.", en: "You open your window and leave your real level hanging over the crowd of climbers, high enough for everybody to see. The noise in the square cuts off front to back, then back to front." }
          - { tr: "\"Bu seviyeye hiçbiriniz filodan önce yetişemezsiniz,\" diyorsun. \"Yetişmeniz de gerekmiyor. Yukarıda ölmeyin, aşağıda yanımda durun; o yeter.\" Kuyruk ağır ağır dağılıyor. Nermin ipi dizlerinden çözüp çanın altına bırakıyor.", en: "\"None of you are catching up to this before the fleet gets here,\" you say. \"And you don't have to. Don't die up there. Stand next to me down here. That's enough.\" The line slowly breaks up. Nora unwraps the rope from her knees and lets it hang under the bell." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pencereni kapat", en: "Close your window" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_can_elif"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} kuyruğun başına bir sandık koyup üstüne çıkıyor. Herkesin nabzına, gözbebeğine, ellerinin titremesine bakıyor; seviyesine bakmıyor bile. Geri çevirdiklerine tek bir cümle söylüyor: \"Filo günü sana ihtiyacım var. Bugün değil.\"", en: "{npc:elif_sari} puts a crate at the front of the line and climbs up on it. She checks everybody's pulse, their pupils, how bad their hands are shaking. She doesn't even look at their levels. To the ones she turns back she says one sentence: \"I need you on fleet day. Not today.\"" }
          - { tr: "Akşama kadar çan bir kez bile çalmıyor. {npc:elif_sari} sandıktan inerken dizleri tutulmuş; koluna giriyorsun, o da itiraz etmiyor.", en: "The bell doesn't ring once all afternoon. When {npc:elif_sari} climbs down off the crate, her knees have locked up. You take her arm, and she doesn't argue." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu kampa götür", en: "Walk her back to camp" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_can_adlar"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Nermin uzun uzun yüzüne bakıyor. \"Vapurda da öyle yapardık,\" diyor sonunda. \"Fırtınaya girmeden yolcuların adını okurduk. Ölenleri değil, yaşayanları. Kimse adı okunmadan kaybolmasın diye.\"", en: "Nora looks at you for a long time. \"We used to do that on the ferry,\" she says finally. \"Before we went into a storm, we read the passenger list out loud. Not the dead. The living. So nobody went missing without their name being said.\"" }
          - { tr: "Çanın ipini halkasından çözüp sarıyor, koltuğunun altına sıkıştırıyor. \"Gümrük'te çelik bir sandık var,\" diyor. \"{yer:kiyikent_liman|de} kalanlar adlarını, söylemek istediklerini oraya yazsın. Çan bir gün çalacaksa o sandık açılırken çalsın.\"", en: "She unties the bell rope from its ring, coils it up, and tucks it under her arm. \"There's a steel chest at the Customs House,\" she says. \"Let people on {yer:kiyikent_liman} write down their names, and whatever they want to say, and put it in there. If that bell's going to ring someday, let it ring when that chest gets opened.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ona {yer:kiyikent_liman|e} kadar eşlik et", en: "Walk her to {yer:kiyikent_liman}" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_can_cal"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İpi ondan alıyorsun. Nermin bırakmak istemiyormuş gibi bir an direniyor, sonra parmakları açılıyor. Kule'nin girişindeki kâtip, gün boyu dönmeyenlerin adlarını sana birer birer okuyor.", en: "You take the rope from her. For a second she holds on like she doesn't want to let go, then her fingers open. The clerk at the Spire's entrance reads you the names of the ones who didn't come back, one at a time, all afternoon." }
          - { tr: "Akşama kadar dokuz kez çalıyorsun. Her çanda kuyruk bir an susuyor; kimse kuyruktan çıkmıyor, ama kimse de artık gülmüyor. Dokuzuncudan sonra Nermin sana bir termos çay uzatıyor. \"Kolun ağrıyacak,\" diyor. \"Ağrımalı da.\"", en: "You ring it nine times before evening. Every time, the line goes quiet for a second. Nobody steps out of line, but nobody's laughing anymore either. After the ninth, Nora hands you a thermos of tea. \"Your arm's going to hurt,\" she says. \"It should.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Çayı iç", en: "Drink the tea" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== GEÇİDE HÜCUM (Kule Dibi · filodan sonra)
  - id: "bl15_kd_kacis"
    konum: ["kule_dibi"]
    perde: [3]
    gun: { min: 321, max: 330 }
    kosul: { bolum: 15, bayrak: "cok_evren_acik" }
    agirlik: 6
    etiketler: ["kesif", "kule", "filo", "kalabalik"]
    gerilim: 3
    kart: { tr: "Geçide hücum", en: "Rush for the passage" }
    sahne: "bl15_kd_kacis_1"
    sahneler:
      - id: "bl15_kd_kacis_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Filo iki gecedir ayın yanında asılı. Artık gündüzleri bile görünüyor; gökyüzünde soluk, yan yana dizilmiş kırk sekiz leke. {yer:kule_dibi} ise o geceden beri bir kez bile boşalmamış.", en: "The fleet's been hanging next to the moon for two nights. You can see it in daylight now, forty-eight pale smudges lined up across the sky. And {yer:kule_dibi} hasn't emptied out once since that night." }
          - { tr: "Binlerce insan Kule'nin kapısına yığılmış. Sırtlarında bohçalar, kucaklarında çocuklar, bir kafeste tavuklar... Herkes aynı şeyi söylüyor: Ellinci kattaki geçitten öbür dünyalara gidilir. \"Hasat aynı dünyaya iki kez gelmez,\" diyor biri. \"{yer:batik_takimada|in} hasadı çoktan bitmiş. Oraya gidelim.\"", en: "Thousands of people are packed against the Spire's door. Bundles on their backs, kids in their arms, chickens in a cage. Everybody's saying the same thing: the passage on the fiftieth floor goes to other worlds. \"The Harvest doesn't hit the same world twice,\" somebody says. \"{yer:batik_takimada|b} already got harvested. Let's go there.\"" }
          - metin: { tr: "Kapının kulpunda hâlâ o zincir var; Tavvarlar geri yollandığı gün çavuşun vurduğu kilit. Aynı kilit şimdi kendi insanlarını dışarıda tutuyor.", en: "That chain's still on the door handle, the padlock the sergeant snapped on the day the Tavvari got sent back. Now the same lock is keeping his own people out." }
            kosul: { bayrak: "bl15_kd_merdiven_kapali" }
          - metin: { tr: "Geçidi bir zamanlar herkese açık bırakmıştın. Kimsenin kimseye izin sormayacağını o gün biliyordun; bugün de sormuyorlar.", en: "You left the passage open to everybody once. You knew back then nobody would ask anybody's permission. They aren't asking today either." }
            kosul: { bayrak: "gecit_herkese_acik" }
          - metin: { tr: "Geçit senin mührünle kapalı; ondan yalnız sen geçebilirsin. Kalabalık da bunu biliyor. Seni görünce bağırışlar bir anda yalvarmaya dönüyor.", en: "The passage is sealed under your mark. Only you can get through it, and the crowd knows it. When they see you, the yelling turns to begging all at once." }
            kosul: { bayrak: "gecit_oyuncunun" }
          - { tr: "Kapıda bir avuç nöbetçi var; Lonca'nın ve Konsey'in adamları omuz omuza. Biri havaya ateş etmiş, tüfeğinin namlusu hâlâ tütüyor. Komutanları sana dönüyor: \"Emir verin. Ya açarız ya ateş ederiz; ikisinin ortası kalmadı.\"", en: "There are a handful of guards at the door, Guild and Council side by side. One of them fired into the air, and his barrel's still smoking. Their commander turns to you. \"Give the order. We either open up or we open fire. There's no in-between anymore.\"" }
        sezgiler:
          - kosul: { stat: { cha: 230 } }
            metin: { tr: "Kalabalığın ön sırası korkudan değil ezilmekten bağırıyor. Arkadakiler öndekileri itmeden durdurulursa bu iş kansız biter.", en: "The front rows aren't screaming because they're scared. They're screaming because they're getting crushed. Stop the back from shoving the front, and this ends without blood." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hasat iki kez gelmez demek, hasadı tanımamak demek. gelir. yalnız geç gelir. bazıları için o kadarı da yeter.", en: "saying the harvest doesn't come twice means you don't know the harvest. it comes. it just comes late. for some of them, late is enough." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kaçmak isteyene kızamıyorum. Ben de bir kere kaçtım. Hâlâ geri dönüp dönmediğimden emin değilim.\"", en: "\"I can't be mad at people who want to run. I ran once. I'm still not sure I ever came back.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Elli kat merdiven, saatte en çok iki yüz kişi. Hesap tutmuyor. Yarısı merdivende ezilir.\"", en: "\"Fifty floors of stairs, two hundred people an hour, tops. The math doesn't work. Half of them get crushed on the stairs.\"" }
        secenekler:
          - id: "ac"
            etiket: { tr: "\"Açın. Gitmek isteyen gitsin.\"", en: "\"Open it. Anybody who wants to go, goes.\"" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -3 }
              - tehlike: { kule_dibi: -3 }
              - bayrak: "bl15_kacis_acik"
              - iliski: { kaya_demir: { saygi: -2 } }
            sonraki: "bl15_kd_kacis_ac"
          - id: "kirk"
            etiket: { tr: "Önce çocuklar ve yaşlılar; kırkıncı katta beklesinler", en: "Kids and old folks first. They wait on the fortieth floor" }
            gerekli: { stat: { cha: 230 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "bl15_kacis_kirk"
              - tohum: { olay: "bl15_kd_kirkinci_kat", gecikme: { min: 1, max: 2 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "Kırkıncı kata çıkardığın çocuklar ve yaşlılar geçidin açılmasını bekliyor.", en: "The kids and old folks you sent up to the fortieth floor are still waiting for the passage to open." } }
            sonraki: "bl15_kd_kacis_kirk"
          - id: "tut"
            etiket: { tr: "\"Kapı kapalı kalacak. Savaşacaksak hep birlikte.\"", en: "\"The door stays shut. If we fight, we all fight.\"" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "bl15_kacis_kapali"
            sonraki: "bl15_kd_kacis_tut"

      - id: "bl15_kd_kacis_ac"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Nöbetçiler kenara çekiliyor. Kalabalık kapıdan bir nehir gibi akıyor. İlk saat merdivende iki kişi ezilip ölüyor; ikinci saat kimse ölmüyor, çünkü insanlar birbirine tutunmayı öğrenmiş.", en: "The guards step aside. The crowd pours through the door like a river. In the first hour, two people get crushed to death on the stairs. In the second hour nobody dies, because people have figured out how to hold on to each other." }
          - { tr: "Akşama doğru meydan yarı yarıya boşalmış. Kalanlar ya çok yaşlı ya çok inatçı ya da gidecek kimsesi olmayanlar. Bir kadın kapının önüne oturmuş, gidenlerin bıraktığı ayakkabıları çift çift diziyor.", en: "By evening, the square's half empty. The ones still here are too old, too stubborn, or have nobody to go with. A woman sits by the door lining up the shoes people left behind, pair by pair." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ona yardım et", en: "Help her" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_kd_kacis_kirk"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir sandığın üstüne çıkıp sesini meydanın sonuna kadar yolluyorsun. Arkadakilere durmalarını, öndekilere nefes almalarını söylüyorsun. İtiş kakış kesilince kuralı koyuyorsun: Önce çocuklar ve yaşlılar, kırkıncı kata kadar. Geçidin ne zaman açılacağına sen karar vereceksin.", en: "You climb onto a crate and send your voice out to the far end of the square. You tell the back to stop and the front to breathe. The shoving stops. Then you lay down the rule: kids and old folks first, up to the fortieth floor. You'll decide when the passage opens." }
          - { tr: "Merdivene ilk giren, tavuk kafesini taşıyan dokuz yaşında bir kız oluyor. Kafesi bırakmıyor. Kimse de ona bırak demiyor.", en: "The first one up the stairs is a nine-year-old girl carrying the chicken cage. She won't put it down. Nobody tells her to." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sırayı akşama kadar sen tut", en: "Hold the line yourself until evening" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_kd_kacis_tut"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapının önüne geçip dikiliyorsun. Kimse sana el sürmeye cesaret edemiyor, ama bağırışlar bir saat sürüyor. Sonra kalabalık, dalga çekilir gibi, ağır ağır geri çekiliyor.", en: "You plant yourself in front of the door. Nobody's got the nerve to lay a hand on you, but the yelling goes on for an hour. Then the crowd pulls back slowly, like a wave going out." }
          - { tr: "Giderken bir adam yere tükürüyor: \"Senin bayrağının altında ölmek istemeyenler de var.\" Haklı mı diye düşünecek vaktin yok; nöbetçiler kapının önüne kum torbaları dizmeye başlamış bile.", en: "On his way out, a guy spits on the ground. \"Some of us don't want to die under your flag.\" You don't have time to wonder whether he's right. The guards are already stacking sandbags in front of the door." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Nöbetçilere kum torbası taşı", en: "Haul sandbags for the guards" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== KIRKINCI KAT (Kule Dibi · tohum)
  - id: "bl15_kd_kirkinci_kat"
    konum: ["kule_dibi"]
    perde: [3]
    yalniz_tohum: true
    kosul:
      bolum: 15
      herhangi: [{ bayrak: "bl15_tapu_kura" }, { bayrak: "bl15_tapu_lonca" }, { bayrak: "bl15_tapu_serbest" }, { bayrak: "bl15_linc_saklandi" }, { bayrak: "bl15_kacis_kirk" }]
    etiketler: ["kule", "filo"]
    gerilim: 3
    kart: { tr: "Kırkıncı kat", en: "The fortieth floor" }
    sahne: "bl15_kd_kirkinci_kat_1"
    sahneler:
      - id: "bl15_kd_kirkinci_kat_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kırkıncı kat, Kule'nin kendi kendine kurduğu bir otel koridoruna benziyor: duvar boyu kapılar, kapıların üstünde anlamsız numaralar, tavanda sönmeyen soluk lambalar. Merdivenden çıkar çıkmaz önünde mavi bir pencere beliriyor: [Kat 40 Kuralı: Yüksek sesle konuşmak yasaktır.]", en: "The fortieth floor looks like a hotel hallway the Spire built for itself: doors all the way down, meaningless numbers over them, dim lights in the ceiling that never go out. The second you step off the stairs, a blue window pops up in front of you: [Floor 40 Rule: Speaking loudly is prohibited.]" }
          - metin: { tr: "Kurayla tapu verdiğin aileler kapıların ardında fısıltıyla yaşıyor. Çocuklara bile kısık sesle gülmeyi öğretmişler.", en: "The families you gave deeds to by lottery are living behind those doors in whispers. They've taught their kids to laugh quietly." }
            kosul: { bayrak: "bl15_tapu_kura" }
          - metin: { tr: "Lonca'nın aileleri koridorun başına bir nöbet masası kurmuş; masadaki asker seni görünce selamı bile fısıltıyla veriyor.", en: "The Guild families have set up a guard desk at the head of the hallway. The soldier behind it even salutes you in a whisper." }
            kosul: { bayrak: "bl15_tapu_lonca" }
          - metin: { tr: "Tapu alanların çoğu odalarının boş olmadığını burada öğrenmiş; satın aldıkları odaların yarısında Kule'nin kendi sakinleri varmış. Hayatta kalanlar koridorun dibindeki tek bir odaya sıkışmış, kapının önüne dolaplar yığmış.", en: "Most of the people who bought deeds found out up here that their rooms weren't empty. Half of what they paid for already had the Spire's own residents in it. The survivors are crammed into one room at the end of the hall, with cabinets piled against the door." }
            kosul: { bayrak: "bl15_tapu_serbest" }
          - metin: { tr: "Direkten kurtardığın adam koridorda su taşıyor. Burada kimse onun hain olup olmadığını sormamış; yalnızca kova taşıyıp taşıyamayacağını sormuşlar.", en: "The man you cut down off the flagpole is hauling water down the hallway. Nobody up here asked whether he was a traitor. They only asked if he could carry a bucket." }
            kosul: { bayrak: "bl15_linc_saklandi" }
          - metin: { tr: "Aşağıdan çıkardığın çocuklar ve yaşlılar koridora battaniye sermiş, geçidin açılmasını bekliyor. Tavukları taşıyan kız kafesi bir kapının önüne bırakmış; tavuklar bile ses çıkarmıyor.", en: "The kids and old folks you sent up have spread blankets down the hallway, waiting for the passage to open. The girl with the chicken cage has set it by a door. Even the chickens are keeping quiet." }
            kosul: { bayrak: "bl15_kacis_kirk" }
          - { tr: "Derken koridorun dibinden metal sesi geliyor; ağır, düzenli adımlar. Kırık bir zırhın içindeki bir şey kapı kapı dolaşıyor. Bir bebek ağlamaya başlıyor; adımlar hızlanıyor.", en: "Then there's a sound of metal from the far end of the hallway. Heavy, even footsteps. Something inside a cracked suit of armor is going door to door. A baby starts crying, and the footsteps speed up." }
          - metin: { tr: "Filo göründüğünden beri Kule'nin içi huzursuz; temizlenmiş katlara Kule'nin eski bekçileri geri dönüyor.", en: "Ever since the fleet showed up, the inside of the Spire's been restless. The old wardens are wandering back onto floors that were cleared." }
            kosul: { gun_min: 321 }
        sezgiler:
          - kosul: { stat: { per: 230 } }
            metin: { tr: "Bekçi gürültüyü değil, gürültünün geldiği yeri arıyor. Bebeği susturmak işe yaramaz; onun dikkatini başka bir sese çekmek gerek.", en: "The warden isn't hunting the noise. It's hunting where the noise comes from. Shushing the baby won't work. You have to pull its attention to some other sound." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kuralına bak. sesini yükseltmeyen kimseye dokunmuyor. bu katta hayatta kalmak çok kolay. yeter ki hiç bağırma.", en: "look at its rule. it doesn't touch anyone who keeps their voice down. staying alive on this floor is easy. you just never scream." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Bekçinin önüne çık; onu koridorda karşıla", en: "Step out in front of the warden. Meet it in the hallway" }
            etkiler:
              - savas: { dusmanlar: ["kacak_kat_bekcisi@dunya"], ortam: ["dar_gecit"], kazan: "bl15_kd_kirkinci_kat_zafer", kaybet: "bl15_kd_kirkinci_kat_yenilgi" }
          - id: "indir"
            etiket: { tr: "Herkesi sessizce aşağı indir", en: "Get everybody downstairs, quietly" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - tehlike: { kule_dibi: 2 }
              - bayrak: "bl15_kirk_bosaltildi"
            sonraki: "bl15_kd_kirkinci_kat_indir"
          - id: "ellinci"
            etiket: { tr: "Ellincilere haber sal; herkesi on kat yukarı alsınlar", en: "Send word to the Fifties. Have them take everybody ten floors up" }
            goster: { herhangi: [{ bayrak: "p3_ellinci_oda" }, { bayrak: "p3_ellinci_kapi_acildi" }, { bayrak: "p3_ellinci_kiz" }] }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { elif_sari: { saygi: 2 } }
              - bayrak: "bl15_kirk_ellinci"
            sonraki: "bl15_kd_kirkinci_kat_ellinci"

      - id: "bl15_kd_kirkinci_kat_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçi koridorun ortasında diz çöküp yığılıyor. Zırhının içinden mavi bir duman sızıyor, kural penceresi bir kez titreyip sönüyor. Ardından kapılar teker teker aralanıyor.", en: "The warden drops to its knees in the middle of the hallway and collapses. Blue smoke seeps out of its armor, and the rule window flickers once and goes out. Then the doors crack open, one by one." }
          - { tr: "İlk konuşan, ağlayan bebeğin annesi oluyor; hem de bağırarak. Kimse onu susturmuyor. Koridor bir anda sesle doluyor: gülüşler, sövgüler, birinin söylediği yarım bir türkü.", en: "The first one to speak is the crying baby's mom, and she's yelling. Nobody shushes her. The hallway fills with noise all at once: laughing, swearing, half a folk song somebody's singing." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bekçinin zırhını merdivenden aşağı at", en: "Throw the warden's armor down the stairs" }
            etkiler:
              - xp_seviye: 15
              - tehlike: { kule_dibi: -3 }
            sonraki: "@akis"

      - id: "bl15_kd_kirkinci_kat_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bekçinin kalkanı göğsüne iniyor; kendine geldiğinde merdiven sahanlığında sırtüstü yatıyorsun. Biri seni oraya sürüklemiş: kurallara uyan ve hiç ses çıkarmayan biri.", en: "The warden's shield comes down on your chest, and you wake up flat on your back on the stair landing. Somebody dragged you there. Somebody who follows the rules and never makes a sound." }
          - { tr: "Koridorun dibinde bekçi hâlâ dolaşıyor. Kapıların ardındakiler nefeslerini tutmuş, bekliyor.", en: "At the end of the hall the warden's still making its rounds. The people behind the doors are holding their breath, waiting." }
        secenekler:
          - id: "don"
            etiket: { tr: "Merdivenden in; başka bir gün dön", en: "Head down the stairs. Come back another day" }
            sonraki: "@akis"

      - id: "bl15_kd_kirkinci_kat_indir"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapıları teker teker tıklatıp herkesi merdivene yolluyorsun; işaretle, fısıltıyla, parmak uçlarında. Bebeğin annesi çocuğu göğsüne bastırıp avucuyla ağzını kapatıyor; merdivenin dibine kadar elini çekmiyor.", en: "You tap on the doors one by one and send everybody to the stairs. Hand signals, whispers, tiptoes. The baby's mom presses the kid to her chest and keeps a palm over the baby's mouth, and she doesn't let go until the bottom of the stairs." }
          - { tr: "Kırkıncı kat boşalıyor. Arkanızda bekçi boş odaların kapılarını tek tek açıp kapatıyor, kimseyi bulamıyor. Meydanda bu kadar insanı nereye koyacağın ise başka bir dert.", en: "The fortieth floor empties out. Behind you, the warden opens and shuts the doors of empty rooms one at a time and finds nobody. Where you're going to put this many people down in the square is a whole other problem." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onları {yer:kiyikent_liman|e} yönlendir", en: "Point them toward {yer:kiyikent_liman}" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kd_kirkinci_kat_ellinci"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Haberciyi on kat yukarı yolluyorsun. Yarım saat sonra merdivenden halatlı, temiz giysili Ellinciler iniyor. Bekçinin çevresinden dolaşmayı biliyorlar; onun kuralını herkesten iyi tanıyorlar.", en: "You send a runner up ten floors. Half an hour later, the Fifties come down the stairs in ropes and clean clothes. They know how to get around the warden. They know its rule better than anybody." }
          - { tr: "Kırkıncı kattakiler el ele, bir zincir halinde yukarı çıkıyor. Ellincilerden biri sana göz kırpıyor: \"Yukarıda bahçe var. Domatesler bu yıl iyi.\"", en: "The people on the fortieth floor head up in a chain, holding hands. One of the Fifties winks at you. \"There's a garden up top. Tomatoes are good this year.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Zincirin sonunda sen yürü", en: "Bring up the rear of the chain" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== SİYAH ETİKETLER (Kule Dibi · saha kampı · Elif)
  - id: "bl15_kd_kamp_elif"
    konum: ["kule_dibi"]
    kamp: true
    perde: [3]
    gun: { min: 306, max: 319 }
    kosul: { bolum: 15 }
    etiketler: ["kamp", "elif"]
    gerilim: 1
    npc: ["elif_sari"]
    kart: { tr: "Siyah etiketler", en: "The black tags" }
    sahne: "bl15_kd_kamp_elif_1"
    sahneler:
      - id: "bl15_kd_kamp_elif_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kamp ateşi Kule'nin gölgesinde yanıyor. {npc:elif_sari} dizlerinin üstüne bir çarşaf sermiş, makasla şerit şerit kesiyor. Yanında dört küçük yığın: yeşil, sarı, kırmızı, siyah.", en: "The campfire's burning in the Spire's shadow. {npc:elif_sari} has a bedsheet spread across her knees and she's cutting it into strips with scissors. There are four little piles next to her: green, yellow, red, black." }
          - { tr: "\"Triaj etiketi,\" diyor sen sormadan. \"Filo günü yaralılara bağlanacak. Yeşil bekleyebilir, sarı acil, kırmızı hemen.\" Makas siyah yığının üstünde duruyor. \"Siyah, beklenen. Yani kurtaramayacağımız. Altı yüz etiket kestim, siyahların üstüne tek bir harf yazamadım.\"", en: "\"Triage tags,\" she says, before you ask. \"On fleet day they get tied to the wounded. Green can wait, yellow's urgent, red is now.\" The scissors stop over the black pile. \"Black is expectant. Meaning we can't save them. I've cut six hundred tags. I haven't been able to write a single letter on the black ones.\"" }
          - metin: { tr: "\"Fırtına gecesi bileklik yazmıştık, hatırlıyor musun? Onlar adı olanlar içindi. Bunlar adı kalmayacaklar için.\"", en: "\"Remember the night of the storm, writing wristbands? Those were for people with names. These are for people who won't have them anymore.\"" }
            kosul: { herhangi: [{ bayrak: "sb13_elif_bileklik" }, { bayrak: "sb13_elif_gece" }, { bayrak: "sb13_elif_satir_adin" }] }
          - metin: { tr: "Darbe gecesinden kalma yara izi bileğinde hâlâ pembe. Makası kavrarken o bileği ateşe doğru çeviriyor; sıcak iyi geliyormuş.", en: "The scar from the night of the coup is still pink on her wrist. When she holds the scissors, she keeps that wrist turned toward the fire. The heat helps, she says." }
            kosul: { herhangi: [{ bayrak: "ihanet_kaya" }, { bayrak: "darbede_elif_korundu" }] }
          - { tr: "Ateşe bir dal atıp sana bakıyor. \"Filo günü biri karar vermek zorunda kalacak. Ben veremezsem... sen verebilir misin?\"", en: "She throws a stick on the fire and looks at you. \"On fleet day somebody's going to have to decide. If I can't... could you?\"" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Siyah yığının en altında katlanmış tek bir etiket duruyor. Üstüne bir şey yazılmış; {npc:elif_sari} onu ötekilerden önce yazmış.", en: "At the bottom of the black pile, a single tag is folded up. Something's written on it. {npc:elif_sari} wrote that one before all the others." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "onun yerine karar verirsen seni affeder. kendini affetmez ama. bunu da bil.", en: "if you decide for her, she'll forgive you. she won't forgive herself. know that too." }
        secenekler:
          - id: "ben"
            etiket: { tr: "\"Siyahları bana ver. Onları ben taşırım.\"", en: "\"Give me the black ones. I'll carry them.\"" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - iliski: { elif_sari: { guven: 5, baglilik: 3 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl15_kd_kamp_elif", agirlik: 35 }
              - bayrak: "bl15_elif_siyah_sende"
            sonraki: "bl15_kd_kamp_elif_ben"
          - id: "yok"
            etiket: { tr: "\"Siyah yazmayalım. Herkese kırmızı.\"", en: "\"Don't write any black. Everybody gets red.\"" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { elif_sari: { guven: 2, saygi: -2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl15_kd_kamp_elif", agirlik: 30 }
              - bayrak: "bl15_elif_siyah_yok"
            sonraki: "bl15_kd_kamp_elif_yok"
          - id: "adim"
            etiket: { tr: "\"Bir tane yaz. Benim adıma.\"", en: "\"Write one. With my name on it.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { elif_sari: { baglilik: 5, korku: 2 } }
              - hafiza: { npc: "elif_sari", id: "olay:bl15_kd_kamp_elif", agirlik: 40 }
              - bayrak: "bl15_elif_siyah_adin"
            sonraki: "bl15_kd_kamp_elif_adim"

      - id: "bl15_kd_kamp_elif_ben"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} siyah yığını toplayıp avucuna bırakıyor. Etiketler hafif, bir avuç kumaş; elin yine de aşağı iniyor.", en: "{npc:elif_sari} gathers up the black pile and puts it in your hand. The tags weigh nothing, a handful of cloth. Your hand still drops." }
          - { tr: "En alttaki katlı etiketi sen fark etmeden geri alıp cebine koyuyor. \"O benim,\" demekle yetiniyor. Sonra kalan çarşafı kesmeye devam ediyor; bu kez yeşiller için.", en: "Before you notice, she takes the folded one off the bottom and slips it into her pocket. \"That one's mine,\" is all she says. Then she goes back to cutting up the sheet. Greens, this time." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Etiketleri çantana koy", en: "Put the tags in your pack" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_kd_kamp_elif_yok"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:elif_sari} acı acı gülüyor. \"Hekim olmayanların lüksü,\" diyor. \"Herkese kırmızı bağlarsan kırmızının bir anlamı kalmaz. Kurtarabileceğin biri, kurtaramayacağın birinin yanında kan kaybından ölür.\"", en: "{npc:elif_sari} laughs, not kindly. \"A luxury for people who aren't doctors,\" she says. \"Put red on everybody and red doesn't mean anything. Somebody you could've saved bleeds out next to somebody you couldn't.\"" }
          - { tr: "Yine de siyah yığını ateşten uzağa itiyor. \"Ama bu gece haklı olmana izin veriyorum,\" diyor. \"Yalnızca bu gece.\"", en: "Still, she pushes the black pile away from the fire. \"But tonight I'm letting you be right,\" she says. \"Just tonight.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşi canlandır", en: "Stoke the fire" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_kd_kamp_elif_adim"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Makas havada kalıyor. {npc:elif_sari} uzun süre sana bakıyor; ne söyleyeceğini bilemeyen birinin değil, söylemek istediğini yutan birinin bakışıyla.", en: "The scissors freeze in midair. {npc:elif_sari} looks at you for a long time. Not like someone who doesn't know what to say. Like someone swallowing what she wants to say." }
          - { tr: "Sonra siyah bir şeridi alıp üstüne senin adını yazıyor, katlıyor ve öbür katlı etiketin yanına, cebine koyuyor. \"Senin başında kimse vakit kaybetmeyecek,\" diyor. \"Ama o gün bu cebi hiç açmayacağım. Bunu da bil.\"", en: "Then she takes a black strip, writes your name on it, folds it, and puts it in her pocket next to the other folded tag. \"Nobody's going to waste time on you,\" she says. \"But I'm never opening this pocket that day. Know that too.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşin başında onunla otur", en: "Sit with her by the fire" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== IŞIĞIN İÇİNDEKİ SAYI (Kule Dibi · saha kampı · Mert)
  - id: "bl15_kd_kamp_mert"
    konum: ["kule_dibi"]
    kamp: true
    perde: [3]
    gun: { min: 306, max: 330 }
    kosul: { bolum: 15 }
    etiketler: ["kamp", "mert"]
    gerilim: 2
    npc: ["mert_kilic"]
    kart: { tr: "Işığın içindeki sayı", en: "The number in the beam" }
    sahne: "bl15_kd_kamp_mert_1"
    sahneler:
      - id: "bl15_kd_kamp_mert_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Gece yarısı. {npc:mert_kilic} kamp ateşinin öbür yanında bağdaş kurmuş, kucağında içi dışına çıkmış bir telsiz. Anteni Kule'nin gölgesinden çıkarıp körfezin üstündeki ters kuleye, ayın yanına uzanan o ince ışığa çevirmiş.", en: "Midnight. {npc:mert_kilic} is sitting cross-legged on the other side of the campfire with a gutted radio in his lap. He's pointed the antenna out of the Spire's shadow at the upside-down tower over the bay, at that thin beam running up to the moon." }
          - { tr: "\"Işığın içinde bir şey var,\" diyor sesini alçaltarak. \"Bir darbe. Tekrar eden bir dizi. Üç gecedir kaydediyorum. Bir sayı... hep aynı sayı. Ama arada bir, bir eksiliyor.\"", en: "\"There's something inside the beam,\" he says, voice low. \"A pulse. A repeating sequence. I've been logging it three nights now. A number. Same number every time. Except sometimes it drops by one.\"" }
          - metin: { tr: "\"Bir de şu var,\" diye ekliyor, gözünü telsizden ayırmadan. \"Onlara yolladığım sahte telemetriye dün gece ilk kez cevap geldi. Tek sözcük: alındı. Bana inanıyorlar mı, benimle oynuyorlar mı, bilmiyorum.\"", en: "\"There's also this,\" he adds, eyes still on the radio. \"Last night, for the first time, they answered the fake telemetry I've been feeding them. One word: received. Whether they believe me or they're playing me, I don't know.\"" }
            kosul: { bayrak: "mert_cift_ajan" }
          - metin: { tr: "Masadan sonra sana her gün bir kopya veriyor: o gün dinlediği her şeyin dökümü. Kimse istememişti. \"Kayıt tutmayı bırakamam,\" demişti. \"Ama artık kimin için tuttuğumu seçebilirim.\"", en: "Ever since the table, he's been handing you a copy every day, a printout of everything he listened to that day. Nobody asked him to. \"I can't stop logging,\" he'd said. \"But I can pick who I'm logging for now.\"" }
            kosul: { bayrak: "ihanet_mert" }
          - metin: { tr: "\"Masada herkesin nabzını kaydetmiştim,\" diyor bir ara. \"İhanetten önceki o son dakikanın. Hâlâ dinliyorum. Kimin nabzının hızlandığını biliyorum artık. Bilmek hiçbir şeyi değiştirmiyor.\"", en: "\"I logged everybody's heart rate at the table,\" he says at one point. \"That last minute before it happened. I still listen to it. I know whose sped up now. Knowing doesn't change anything.\"" }
            kosul: { bayrak: "sb14_mert_tarama", bayrak_yok: "ihanet_mert" }
        sezgiler:
          - kosul: { stat: { int: 230 } }
            metin: { tr: "Sayı yedi basamaklı. {yer:kiyikent|in} nüfusu değil, çok daha büyük. Ama eksildiği anlar rastgele değil.", en: "It's a seven-digit number. Not {yer:kiyikent|pos} population. Way bigger. But the drops aren't random." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sayıyorlar. ben de saymıştım bir zamanlar. sonra saymayı bıraktım ve sayılan oldum.", en: "they're counting. i used to count once too. then i stopped counting and became something that gets counted." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "\"Kapat şunu. Bu gece uyu.\"", en: "\"Turn it off. Sleep tonight.\"" }
            etkiler:
              - iliski: { mert_kilic: { guven: 3 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl15_kd_kamp_mert", agirlik: 30 }
              - bayrak: "bl15_mert_uyudu"
            sonraki: "bl15_kd_kamp_mert_uyu"
          - id: "coz"
            etiket: { tr: "\"Çöz. Sabaha kadar yanında beklerim.\"", en: "\"Crack it. I'll sit up with you till morning.\"" }
            etkiler:
              - iliski: { mert_kilic: { baglilik: 4, saygi: 2 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl15_kd_kamp_mert", agirlik: 35 }
              - bayrak: "bl15_mert_sayi_cozuldu"
            sonraki: "bl15_kd_kamp_mert_coz"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} dinlet; o bu dili bilir", en: "Have {npc:yanki} listen. It knows this language" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 3 }, mert_kilic: { korku: 3, saygi: 2 } }
              - hafiza: { npc: "mert_kilic", id: "olay:bl15_kd_kamp_mert", agirlik: 35 }
              - bayrak: "bl15_mert_yanki_dinledi"
            sonraki: "bl15_kd_kamp_mert_yanki"

      - id: "bl15_kd_kamp_mert_uyu"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:mert_kilic} itiraz edecek oluyor, sonra telsizin düğmesini çeviriyor. Hışırtı kesilince sessizliğin ne kadar büyük olduğunu ikiniz birden fark ediyorsunuz.", en: "{npc:mert_kilic} starts to argue, then turns the knob on the radio. When the static cuts out, you both notice how big the silence is." }
          - { tr: "Battaniyesine sarınıp sırtını ateşe veriyor. Birkaç dakika sonra nefesi ağırlaşıyor; uyumuş. Telsizi yine de kucağından bırakmamış.", en: "He wraps up in his blanket and turns his back to the fire. A few minutes later his breathing slows down. He's asleep. He still hasn't let go of the radio." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Nöbeti sen tut", en: "Take the watch yourself" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_kd_kamp_mert_coz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şafağa yakın, Kule'nin yükseklerinden bir şey düşüyor; uzakta, karanlıkta, ses çıkarmadan. Aynı anda {npc:mert_kilic|in} ekranındaki sayı bir eksiliyor.", en: "Near dawn, something falls from high up on the Spire. Far off, in the dark, without a sound. At that same moment, the number on {npc:mert_kilic|pos} screen drops by one." }
          - { tr: "{npc:mert_kilic} ekrana bakakalıyor. \"Seviyesi olanları sayıyorlar,\" diye fısıldıyor. \"Yalnız burada değil, bütün dünyada. Biri ölünce sayı düşüyor. Elçi gemisi her gece filoya kalan stoku bildiriyor.\" Ellerini dizlerinin arasına sıkıştırıyor. \"Bunu kaydetmek istemiyorum. Kaydedeceğim tabii.\"", en: "{npc:mert_kilic} just stares at the screen. \"They're counting everybody with a level,\" he whispers. \"Not just here. The whole planet. Somebody dies, the number drops. The envoy ship's been reporting the remaining stock to the fleet every night.\" He jams his hands between his knees. \"I don't want to log this. Obviously I'm going to.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ona son bir kahve yap", en: "Make him one last coffee" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_kd_kamp_mert_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Telsizi kucağına alıyorsun. {npc:yanki} pencerenin kenarından sızıyor; bozuk harfleri ekranın üstünde bir an toplanıp dağılıyor. {npc:mert_kilic} geri çekiliyor, ama gözünü ekrandan alamıyor.", en: "You take the radio onto your lap. {npc:yanki} seeps out from the edge of your window. Its broken letters gather on the screen for a second, then scatter. {npc:mert_kilic} leans back, but he can't take his eyes off the screen." }
          - { tr: "{npc:yanki} uzun uzun dinliyor, sonra fısıldıyor: bu bir sayım. seviyesi olan her canlı bir satır. benim de bir satırım vardı bir zamanlar. sonra kendi satırımı sildim. sen de bir satırsın, ama senin satırın onların defterine sığmıyor.", en: "{npc:yanki} listens for a long time, then whispers: it's a census. every living thing with a level is one line. i had a line once too. then i erased mine. you're a line too, but yours doesn't fit in their ledger." }
          - { tr: "{npc:mert_kilic} yutkunuyor. \"Bunu da kaydedebilir miyim?\" diye soruyor; sana değil, ona.", en: "{npc:mert_kilic} swallows. \"Can I log that too?\" he asks. Not you. It." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Kaydet.\"", en: "\"Log it.\"" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== GÖĞÜ SAYAN ADAM (Üs · filodan sonra)
  - id: "bl15_us_gok_sayaci"
    konum: ["us"]
    perde: [3]
    gun: { min: 321, max: 330 }
    kosul: { bolum: 15 }
    agirlik: 6
    etiketler: ["filo", "liman"]
    gerilim: 2
    kart: { tr: "Göğü sayan adam", en: "The man who counts the sky" }
    sahne: "bl15_us_gok_sayaci_1"
    sahneler:
      - id: "bl15_us_gok_sayaci_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'ün çatısında yaşlı bir adam, eski bir sekstantı filoya doğrultmuş. Denizcilik lisesinde otuz yıl seyir dersi vermiş Hikmet Hoca bu; dizinin üstünde açık bir defter, kulağının arkasında kurşunkalem.", en: "Up on the Customs House roof, an old man has an antique sextant aimed at the fleet. That's Mr. Hollis, who taught navigation at the maritime high school for thirty years. There's a notebook open on his knee and a pencil behind his ear." }
          - { tr: "\"Her gece ışıkların açısını ölçüyorum,\" diyor seni görünce. \"Büyüyorlar. Bu hızla büyümeye devam ederlerse on gün sonra tepemizde olacaklar, bilemedin on bir.\" Aşağıda, {yer:kiyikent_liman|in} duvarına tebeşirle yazılmış iri bir rakamı gösteriyor: 10.", en: "\"I measure the angle on those lights every night,\" he says when he sees you. \"They're getting bigger. If they keep growing at this rate, they'll be right over our heads in ten days. Eleven at most.\" He points down at the wall on {yer:kiyikent_liman}. Someone's chalked a big number on it: 10." }
          - { tr: "\"Konsey silinmesini istiyor,\" diye ekliyor. \"Dün iki aile kendini denize atmış. Lonca kalsın diyor: insanlar kaç günleri olduğunu bilirse işini yaparmış. Bana sordular, ben de dedim ki ben yalnızca sayarım. Karar kahramanındır.\"", en: "\"The Council wants it wiped off,\" he adds. \"Yesterday, two families walked into the sea. The Guild says leave it up. If people know how many days they've got, they'll do their jobs. They asked me, and I said I just do the counting. The deciding is for heroes.\"" }
          - metin: { tr: "\"Kırk sekiz,\" diyor sekstanta yeniden eğilirken. \"Sığınağa gelen o uzun boylu Kadim de aynı sayıyı söylemiş. Ben iki kez saydım; yanlış saydığımı umarak.\"", en: "\"Forty-eight,\" he says, bending back over the sextant. \"That tall Ancient who came to us for asylum said the same number. I counted twice, hoping I was wrong.\"" }
            kosul: { bayrak: "thessar_sigindi" }
          - metin: { tr: "\"Biri ötekilerden parlak,\" diyor alçak sesle. \"Gümüşle siyah. Onu saymaya elim varmıyor; sanki bizden biriymiş gibi.\"", en: "\"One's brighter than the others,\" he says quietly. \"Silver and black. I can't bring myself to count that one. Feels like it's one of ours.\"" }
            kosul: { bayrak: "aras_kadimlere_gitti" }
        sezgiler:
          - kosul: { stat: { int: 230 } }
            metin: { tr: "Hesabı doğru, ama ışıklar her gece biraz daha az büyüyor. Gemiler yavaşlıyor. Tepeye gelmeden önce bir yerde duracaklar.", en: "His math is right, but the lights are growing a little less every night. The ships are slowing down. They're going to stop somewhere before they're overhead." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu sayıyı ben de saymıştım bir kez. sonuna geldiğimizde kimse silmeyi düşünmemişti. silecek kimse kalmamıştı.", en: "i counted this number once too. when we got to the end, nobody had thought about wiping it off. there was nobody left to wipe it." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Hastalarıma ne kadar ömürleri kaldığını hep söyledim. Söylemediklerim daha kötü öldü.\"", en: "\"I always told my patients how much time they had left. The ones I didn't tell had it worse at the end.\"" }
        secenekler:
          - id: "kalsin"
            etiket: { tr: "\"Sayaç kalsın. Herkes kaç günü olduğunu bilsin.\"", en: "\"The count stays up. Everybody should know how many days they've got.\"" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
              - iliski: { elif_sari: { guven: 3 } }
              - bayrak: "bl15_sayac_acik"
              - tohum: { olay: "bl15_us_mektuplar", gecikme: { min: 1, max: 2 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "Duvardaki sayaç her sabah bir eksiliyor; Gümrük'ün önünde bir kuyruk oluşmaya başladı.", en: "The count on the wall goes down by one every morning. A line has started forming outside the Customs House." } }
            sonraki: "bl15_us_gok_sayaci_kalsin"
          - id: "sil"
            etiket: { tr: "\"Silin. Bu on günü bilmeden yaşasınlar.\"", en: "\"Wipe it off. Let them live these ten days without knowing.\"" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: -1 }
              - iliski: { elif_sari: { guven: -2 } }
              - bayrak: "bl15_sayac_silindi"
            sonraki: "bl15_us_gok_sayaci_sil"
          - id: "hesap"
            etiket: { tr: "Defterini al; hesabı onunla birlikte yeniden yap", en: "Take his notebook. Run the math again with him" }
            gerekli: { stat: { int: 230 } }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "bl15_sayac_hesap"
            sonraki: "bl15_us_gok_sayaci_hesap"

      - id: "bl15_us_gok_sayaci_kalsin"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ertesi sabah biri rakamın üstünden geçip 9 yazıyor. Kimin yazdığını kimse bilmiyor. Rakamın altına başkaları da bir şeyler eklemiş: \"Annemi aradım.\" \"Kızımla barıştım.\" \"Borcunu ödedim, Necati.\"", en: "The next morning, somebody chalks over the number and writes 9. Nobody knows who. Other people have added things under it: \"Called my mom.\" \"Made up with my daughter.\" \"Paid you back, Nick.\"" }
          - { tr: "Hikmet Hoca çatıdan aşağı bakıp gülümsüyor. \"Gördün mü? Sayınca insan acele ediyor,\" diyor. \"Ama hep yanlış şeye değil.\"", en: "Mr. Hollis looks down from the roof and smiles. \"See that? When you count, people hurry,\" he says. \"But not always toward the wrong thing.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sen de duvara bir satır yaz", en: "Write a line on the wall yourself" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_gok_sayaci_sil"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Rakamı kendi elinle siliyorsun; ıslak bezin altında tebeşir pembe bir lekeye dönüşüyor. Gelip geçenler duvara bakmamaya çalışıyor.", en: "You wipe the number off yourself. Under the wet rag the chalk turns into a pinkish smear. People walking by try not to look at the wall." }
          - { tr: "Akşamüstü Hikmet Hoca'nın defteri çatıda açık kalmış; sayfaya, kimsenin okumayacağı küçük harflerle, yine bir rakam yazmış. Sayıyı yalnız o tutuyor artık.", en: "In the evening, Mr. Hollis's notebook is lying open on the roof. On the page, in tiny handwriting nobody's going to read, he's written another number. He's the only one keeping count now." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Defteri kapatıp ona geri ver", en: "Close the notebook and hand it back to him" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_us_gok_sayaci_hesap"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gece boyu ölçümleri yeniden yapıyorsunuz. Sabaha karşı Hikmet Hoca kurşunkalemi bırakıp başını iki elinin arasına alıyor: Işıklar büyüyor, ama her gece biraz daha az. \"Duracaklar,\" diyor. \"Tepemize gelmeden önce bir yerde durup bekleyecekler. Gemiler inmeden önce bir şey olacak.\"", en: "You run the measurements all night. Toward morning, Mr. Hollis puts the pencil down and puts his head in his hands. The lights are getting bigger, but a little less every night. \"They're going to stop,\" he says. \"Somewhere before they're overhead, they'll stop and wait. Something's going to happen before the ships come down.\"" }
          - { tr: "Hesabı mendirekteki topçulara götürüyorsunuz. Topçubaşı ölçümleri hedef çizelgesine işlerken Hikmet Hoca'ya eski bir meslektaşına davranır gibi kahve ikram ediyor.", en: "You take the math down to the gunners on the breakwater. While the gun chief marks the numbers onto the target sheets, he offers Mr. Hollis a coffee, like he's asking a colleague of forty years." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Duvardaki rakamı düzelt", en: "Fix the number on the wall" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== MÜHÜRLÜ SANDIK (Üs · tohum)
  - id: "bl15_us_mektuplar"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 15, herhangi: [{ bayrak: "bl15_can_sustu" }, { bayrak: "bl15_bt_adlar" }, { bayrak: "bl15_sayac_acik" }] }
    etiketler: ["filo", "liman"]
    gerilim: 1
    kart: { tr: "Mühürlü sandık", en: "The sealed chest" }
    sahne: "bl15_us_mektuplar_1"
    sahneler:
      - id: "bl15_us_mektuplar_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Gümrük'ün giriş salonuna, kıyametten önce kaçak mal saklanan çelik bir sandık çekilmiş. Kapağına bir yarık açılmış; yanına da bir karton konmuş: FİLODAN SONRA AÇILACAK.", en: "An old steel chest that used to hold seized contraband has been dragged into the Customs House lobby. Somebody's cut a slot in the lid, and there's a piece of cardboard next to it: TO BE OPENED AFTER THE FLEET." }
          - metin: { tr: "Sandığın başında Nermin Kaptan oturuyor; çanın ipi hâlâ koltuğunun altında. Her mektubu atan, önce kendi adını yüksek sesle söylüyor. Vapurdaki gibi: Kimse adı söylenmeden kaybolmasın diye.", en: "Captain Nora's sitting by the chest, the bell rope still tucked under her arm. Everybody who drops in a letter says their own name out loud first. Like on the ferry. So nobody goes missing without their name being said." }
            kosul: { bayrak: "bl15_can_sustu" }
          - metin: { tr: "Nehhaların çanını anlattığın günden beri {yer:kiyikent_liman|de} yeni bir âdet başladı: Mektubunu atan, sevdiklerinin adını da yüksek sesle okuyor. Yaşayanlarınkini, ölmeden.", en: "Since the day you told them about the Nehha bell, a new custom's started on {yer:kiyikent_liman}. When people drop their letters in, they read out the names of the people they love. The living. While they're still alive." }
            kosul: { bayrak: "bl15_bt_adlar" }
          - metin: { tr: "Pencereden {yer:kiyikent_liman|in} duvarı görünüyor; tebeşirle yazılmış rakam bu sabah bir daha eksilmiş. Kuyruk her eksilişte biraz daha uzuyor.", en: "You can see the wall on {yer:kiyikent_liman} through the window. The chalk number went down again this morning. Every time it drops, the line gets a little longer." }
            kosul: { bayrak: "bl15_sayac_acik" }
          - { tr: "Sandığın bekçisi, posta müdürlüğünden emekli titiz bir kadın, seni bir kenara çekiyor. Elinde açılmamış bir tomar zarf var. \"Bunlar ölülere yazılmış,\" diyor. \"Entegrasyon gecesi gidenlere. Bir çocuk annesine yazmış. Bunları sandığa mı koyayım? Kim açacak?\"", en: "The woman watching the chest, a fussy retired postmaster, pulls you aside. She's holding a stack of unopened envelopes. \"These are addressed to the dead,\" she says. \"People who went on Integration night. A little boy wrote to his mother. Do I put these in the chest? Who's going to open them?\"" }
          - { tr: "Sonra sana bakıp ekliyor: \"Herkes senin de bir mektup yazıp yazmadığını soruyor.\"", en: "Then she looks at you and adds, \"Everybody's asking if you wrote one too.\"" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Kuyruktakilerin çoğu mektubunu yazıp yazıp yırtmış; ellerinde buruşuk taslaklar var. Yazılan her mektup, yazılamayan üç mektubun üstüne kurulmuş.", en: "Most of the people in line wrote their letters and tore them up over and over. They're holding crumpled drafts. Every letter in there was built on top of three that couldn't get written." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bana da bir zarf bırakacak mısın? kimse bana mektup yazmadı. ölülere bile yazıyorlar.", en: "are you going to leave an envelope for me? nobody's ever written me a letter. they write to the dead, even." }
        secenekler:
          - id: "yazici"
            etiket: { tr: "Bir masa kur; yazamayanlara sen yaz", en: "Set up a table. Write for the ones who can't" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl15_mektup_yazici"
            sonraki: "bl15_us_mektuplar_yazici"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} bir mektup yaz", en: "Write a letter to {npc:deniz_arman}" }
            goster: { npc_hayatta: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4, guven: 2 } }
              - bayrak: "bl15_mektup_deniz"
            sonraki: "bl15_us_mektuplar_deniz"
          - id: "yanki"
            etiket: { tr: "{npc:yanki} için boş bir zarf ayır", en: "Set aside a blank envelope for {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 4, baglilik: 2 } }
              - bayrak: "bl15_mektup_yanki"
            sonraki: "bl15_us_mektuplar_yanki"
          - id: "olu"
            etiket: { tr: "Ölülere yazılanları al; onları denize sen götür", en: "Take the letters addressed to the dead. Carry them out to the sea yourself" }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 2 }
              - bayrak: "bl15_mektup_deniz_yolu"
            sonraki: "bl15_us_mektuplar_olu"
          - id: "bos"
            etiket: { tr: "Sandığa boş bir zarf at", en: "Drop an empty envelope in the chest" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - bayrak: "bl15_mektup_bos"
            sonraki: "bl15_us_mektuplar_bos"

      - id: "bl15_us_mektuplar_yazici"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşama kadar masada oturuyorsun. Yaşlı bir balıkçı, karısına kırk yıldır söyleyemediğini sana yazdırıyor; sözcükleri ağ örer gibi tek tek seçiyor. Bir genç kız yalnızca \"Kedime bakın\" yazdırıyor, başka hiçbir şey.", en: "You sit at that table until evening. An old fisherman has you write down what he hasn't been able to tell his wife for forty years, picking the words one at a time like he's mending a net. A teenage girl dictates just \"Take care of my cat,\" and nothing else." }
          - { tr: "Hava kararırken {npc:elif_sari} koğuştan bir tomar kâğıtla geliyor: yürüyemeyen hastaların mektupları. Onları da masana bırakıp yanına oturuyor. Konuşmuyorsunuz; yalnızca kalemlerin hışırtısı duyuluyor.", en: "As it gets dark, {npc:elif_sari} comes over from the ward with a stack of paper: letters from the patients who can't walk. She sets them on your table and sits down next to you. Neither of you talks. There's just the scratching of pens." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Son mektubu da mühürle", en: "Seal the last letter" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_mektuplar_deniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir köşeye çekilip yazıyorsun. İlk cümleyi dört kez değiştiriyorsun; sonunda vapuru, martıları, bir türlü yetişemediğiniz o son seferi yazıyorsun. Gerisi kendiliğinden geliyor.", en: "You find a corner and write. You change the first line four times. In the end you write about the ferry, the gulls, that last boat you two could never make. The rest comes on its own." }
          - metin: { tr: "Mektubun sonuna iskeledeki sözünü de ekliyorsun: Ne olduğunu öğrendiğinde ilk o bilecek. Belki bu mektup o sözün kendisi olur.", en: "At the end you add the promise you made on the pier. When you find out what you are, they'll be the first to know. Maybe this letter ends up being that promise." }
            kosul: { bayrak: "sb15_deniz_soz" }
          - { tr: "Zarfın üstüne yalnızca adını yazıp sandığa atıyorsun. Atarken kapının önünden {npc:deniz_arman} geçiyor ve görüyor. Bir şey sormuyor; yalnızca bütün gün ilk kez gülümsüyor.", en: "You write just their name on the envelope and drop it in the chest. As you do, {npc:deniz_arman} walks past the door and sees. {zamir:deniz_arman|o|b} {zamir:deniz_arman|does}n't ask anything. {zamir:deniz_arman|o|b} just smile{zamir:deniz_arman|s}, for the first time all day." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kapıya, {npc:deniz_arman|in} yanına çık", en: "Go out the door to {npc:deniz_arman}" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_mektuplar_yanki"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Boş bir zarf alıp üstüne bozuk harflerle, ancak senin okuyabileceğin bir ad yazıyorsun. İçine hiçbir şey koymuyorsun; ne yazacağını bilmiyorsun, o da biliyor.", en: "You take a blank envelope and write a name on it in broken letters only you could read. You don't put anything inside. You don't know what to write, and it knows that." }
          - { tr: "Zarf sandığın yarığından içeri kayarken pencerenin kenarı bir an titriyor. {npc:yanki} hiçbir şey söylemiyor. Gece yatarken kulağının dibinde tek bir sözcük fısıldıyor: sakla.", en: "As the envelope slides through the slot, the edge of your window flickers for a second. {npc:yanki} doesn't say anything. That night, when you lie down, one word gets whispered right by your ear: keep." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Pencereni kapat", en: "Close your window" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_mektuplar_olu"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Ölülere yazılmış zarfları bir file torbaya koyup mendireğin ucuna yürüyorsun. Gece rüzgârı tuzlu ve sert; körfezin üstündeki ışık suya titrek bir yol çiziyor.", en: "You put the letters to the dead in a mesh bag and walk out to the end of the breakwater. The night wind is salty and hard, and the beam over the bay lays a shaky road across the water." }
          - { tr: "Zarfları birer birer suya bırakıyorsun. Çocuğun annesine yazdığı en sona kalıyor; zarfın üstüne yalnızca \"Anne\" yazılmış. O da gidiyor, ışığın çizdiği yolda bir süre yüzüyor, sonra kararıyor.", en: "You let the envelopes go one by one. The boy's letter to his mother is the last one. All it says on the outside is \"Mom.\" It goes too. It floats a while on the road the light makes, then goes dark." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Mendirekten dön", en: "Head back off the breakwater" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_mektuplar_bos"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Boş bir zarfı yarıktan içeri bırakıyorsun. Kuyruktakiler alkışlıyor; kahramanın mektubu sandıkta. Bekçi kadın zarfın ağırlığını eliyle tartmış gibi sana uzun uzun bakıyor.", en: "You drop an empty envelope through the slot. The people in line clap. The hero's letter is in the chest. The postmaster gives you a long look, like she weighed that envelope in her hand." }
          - { tr: "\"Otuz yıl postada çalıştım,\" diyor alçak sesle. \"Boş zarf da bir şey söyler. Genellikle de söylenmesi en zor olanı.\"", en: "\"Thirty years at the post office,\" she says quietly. \"An empty envelope says something too. Usually the hardest thing to say.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Salondan çık", en: "Leave the lobby" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== HASAT HÜKMÜ (Üs · tohum)
  - id: "bl15_us_ilan"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 15, bayrak: "bl15_yt_ilan_alindi" }
    etiketler: ["kadimler", "filo", "konsey"]
    gerilim: 3
    kart: { tr: "Hasat hükmü", en: "The harvest decree" }
    sahne: "bl15_us_ilan_1"
    sahneler:
      - id: "bl15_us_ilan_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:yedi_taht|den} getirdiğin tomar Konsey salonunun masasında açık duruyor. Kenarları altınla işlenmiş, mürekkebi hâlâ ıslakmış gibi parlıyor. Sistem ilk satırları çevirmiş: [{yer:yedi_taht|in} Hükmüdür. {yer:kiyikent} Katmanı'na. Hasat günü teslim olan Katman, ondalığıyla bağışlanır. Direnen Katman bütünüyle toplanır.]", en: "The scroll you brought back from {yer:yedi_taht} lies open on the Council table. Its edges are worked in gold, and the ink still shines like it's wet. The System's translated the first lines: [Decree of {yer:yedi_taht}. To the Layer of {yer:kiyikent}. A Layer that surrenders on Harvest day shall be spared, less its tithe. A Layer that resists shall be gathered whole.]" }
          - metin: { tr: "Tomarın arkasında kendi el yazın duruyor; haberciye bıraktığın cevabın kopyası. Konsey üyeleri onu ön yüzden daha uzun okuyor.", en: "On the back of the scroll is your own handwriting, the copy of the reply you left with the herald. The Council members spend longer reading that side than the front." }
            kosul: { bayrak: "bl15_yt_cevap" }
          - { tr: "Dışarıda kalabalık var. Tomarın şehre geldiği duyulmuş; insanlar ne yazdığını öğrenmek istiyor. Kapının önünde biri bağırıyor: \"Teslim olursak yaşarız diyorlarmış!\"", en: "There's a crowd outside. Word got around that the scroll's in the city, and people want to know what it says. Somebody out front is yelling, \"They're saying if we surrender, we live!\"" }
          - metin: { tr: "{npc:elif_sari} tomara hiç dokunmadan bakıyor. \"Ondalık,\" diyor. \"Onda bir. Demek on kişiden birini verip dokuzunu kurtarabiliriz. Bunu okursak meydanda kaç kişi evet der, biliyor musun?\"", en: "{npc:elif_sari} looks at the scroll without touching it. \"Tithe,\" she says. \"One in ten. So we hand over one person in ten and save nine. You know how many people in that square say yes if we read this out?\"" }
            kosul: { npc_hayatta: "elif_sari" }
        sezgiler:
          - kosul: { stat: { int: 230 } }
            metin: { tr: "\"Ondalık\" sözcüğünün altında Sistem'in kısa bir duraksaması var; çeviri bir an takılıp düzelmiş. Bir şeyi yumuşatmış.", en: "Under the word \"tithe,\" there's a tiny hitch in the System's translation, like it caught on something and smoothed it over. It softened something." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "sistem onların dilini senin diline çevirirken nazik davranıyor. neden nazik davrandığını sor kendine.", en: "the system's being polite when it turns their language into yours. ask yourself why it's being polite." }
        secenekler:
          - id: "oku"
            etiket: { tr: "Meydana çık; hükmü yüksek sesle oku", en: "Go out to the square. Read the decree out loud" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: -1 }
              - iliski: { elif_sari: { saygi: 2 } }
              - bayrak: "bl15_ilan_okundu"
            sonraki: "bl15_us_ilan_oku"
          - id: "yak"
            etiket: { tr: "Yak; kimse teslim olmayı aklından geçirmesin", en: "Burn it. Nobody even thinks about surrendering" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - bayrak: "bl15_ilan_yakildi"
            sonraki: "bl15_us_ilan_yak"
          - id: "konsey"
            etiket: { tr: "Bu salondan çıkmasın; yalnız Konsey bilsin", en: "It doesn't leave this room. Only the Council knows" }
            etkiler:
              - gizle: 1
              - ahlak: { duzen: 1, insanlik: -1 }
              - iliski: { elif_sari: { saygi: -2 } }
              - bayrak: "bl15_ilan_konsey"
            sonraki: "bl15_us_ilan_konsey"
          - id: "thessar"
            etiket: { tr: "{npc:thessar|e} okut; çevirinin yumuşattığını o söylesin", en: "Have {npc:thessar} read it. Let him say what the translation softened" }
            goster: { bayrak: "thessar_sigindi", npc_hayatta: "thessar" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { thessar: { guven: 4, saygi: 2 } }
              - bayrak: "bl15_ilan_thessar"
            sonraki: "bl15_us_ilan_thessar"

      - id: "bl15_us_ilan_oku"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Merdivenin başından hükmü okuyorsun; her cümleden sonra kalabalık biraz daha susuyor. \"Ondalığıyla bağışlanır\" kısmında arkalardan biri \"Kabul!\" diye bağırıyor, sonra bir başkası. Üçüncü ses çıkmıyor.", en: "You read the decree from the top of the steps, and with every sentence the crowd goes quieter. At the part about being spared less the tithe, somebody in the back yells \"Deal!\" Then somebody else does. There's no third voice." }
          - { tr: "Okumayı bitirince tomarı katlayıp kalabalığa dönüyorsun. \"Hükmü duydunuz. Kararı siz verin.\" Kimse kımıldamıyor. Sonra ön sıradaki yaşlı bir kadın yere tükürüp dönüp gidiyor; ardından bir başkası, sonra bir başkası.", en: "When you finish, you fold up the scroll and face the crowd. \"You heard the decree. You decide.\" Nobody moves. Then an old woman in the front row spits on the ground, turns, and walks off. Then another person. Then another." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Meydan boşalana kadar bekle", en: "Wait until the square empties" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_us_ilan_yak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tomarı Konsey salonunun sobasına atıyorsun. Altın işlemeli kenarlar yanmıyor, eriyip damla damla akıyor; kâğıdın kendisi ise mavi bir alevle, hiç duman çıkarmadan tükeniyor.", en: "You toss the scroll into the Council hall's stove. The gold edging doesn't burn. It melts and drips. The paper itself goes up in a blue flame, without any smoke at all." }
          - { tr: "Dışarıdakilere yalnızca şunu söylüyorsun: \"Hüküm yandı. Bizim hükmümüz başka.\" Kalabalık dağılıyor. Ama ertesi gün {yer:kiyikent_liman|in} duvarına biri tebeşirle yazmış: TESLİM OLAN YAŞAR.", en: "To the people outside you say just this: \"The decree burned. Ours is a different one.\" The crowd breaks up. But the next day, somebody's chalked on the wall at {yer:kiyikent_liman}: SURRENDER AND LIVE." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yazıyı silme; bırak dursun", en: "Don't wipe it off. Let it stay" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_ilan_konsey"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tomar Konsey'in kasasına kilitleniyor. Dışarıdakilere \"Kadim saçmalığı\" deniyor; yarısı inanıyor, yarısı inanmıyor.", en: "The scroll gets locked in the Council safe. The people outside are told it's \"Ancient nonsense.\" Half of them believe it. Half don't." }
          - { tr: "Akşam Konsey üyelerinden biri, kimseye görünmeden kasanın anahtarını soruyor. Anahtar sende olduğu için ona hayır diyorsun. Adam gülümseyip özür diliyor, ama sonraki üç gün sana bir kez bile gözünü dikip bakmıyor.", en: "That evening, one of the Council members quietly asks for the key to the safe. Since you have it, you tell him no. He smiles and apologizes, but for the next three days he doesn't look you in the eye once." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Anahtarı cebine koy", en: "Pocket the key" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_us_ilan_thessar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:thessar} tomarı okurken yüzünde hiçbir şey kıpırdamıyor. Sonra parmağını o sözcüğün üstüne koyuyor. \"Sisteminiz sizi seviyor,\" diyor. \"Ya da sizden korkuyor. Buradaki sözcük onda bir değil. Onda bir geride kalıyor demek.\"", en: "Not a muscle in {npc:thessar|pos} face moves as he reads. Then he puts a finger on that word. \"Your System loves you,\" he says. \"Or it's afraid of you. This word doesn't mean one in ten. It means one in ten is left.\"" }
          - { tr: "Salon buz kesiyor. \"Teslim olan Katman'ın onda dokuzu toplanır, onda biri bağışlanır,\" diye sürdürüyor {npc:thessar}. \"Sürünün devam etmesi için. Irkımın merhameti budur. Bunu meydanda okuyun; tek bir kişi bile teslim olmak istemeyecektir.\"", en: "The room goes ice-cold. \"Nine-tenths of a surrendering Layer get gathered. One-tenth is spared,\" {npc:thessar} goes on. \"So the herd continues. That is my people's mercy. Read that in the square, and not one person will want to surrender.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Doğru metni meydana sen götür", en: "Take the true text to the square yourself" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

  # ================================================================== KAZINMIŞ AD (Üs · tohum)
  - id: "bl15_us_beyaz_kapi"
    konum: ["us"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 15, bayrak: "bl15_tp_aile" }
    etiketler: ["yukselenler", "liman", "filo"]
    gerilim: 2
    kart: { tr: "Kazınmış ad", en: "The scraped name" }
    sahne: "bl15_us_beyaz_kapi_1"
    sahneler:
      - id: "bl15_us_beyaz_kapi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Sabah {yer:kiyikent_liman|in} girişinde üç kişi bekliyor: {yer:tepe|de} bir çatıda konuştuğun kız, annesi ve babası. Üçünün de beyazları çamur içinde. Babanın kucağında, kapılarından söküp getirdikleri bir levha var; üstündeki yaldızlı ad bıçakla kazınmış.", en: "In the morning, three people are waiting at the entrance to {yer:kiyikent_liman}: the girl you talked to on that roof in {yer:tepe}, and her mom and dad. All three of their whites are covered in mud. The father's holding a plaque they pried off their front door. The gold-leaf name on it has been scraped off with a knife." }
          - { tr: "{yer:kiyikent_liman|in} hamalları yolu kesmiş. \"Beyazlar burada barınamaz,\" diyor içlerinden biri. \"Dün gökyüzüne ev boyuyorlardı, bugün bizim ekmeğimizi mi yiyecekler?\"", en: "The dockworkers are blocking the way. \"No whites in here,\" one of them says. \"Yesterday they were painting their houses for the sky. Today they want to eat our bread?\"" }
          - metin: { tr: "\"Beyazlardan biri bizi bir kere sattı zaten,\" diye ekliyor bir başkası. Kimseyi adıyla anmıyor; anmasına gerek de yok.", en: "\"One of the whites already sold us out once,\" somebody else adds. He doesn't name anybody. He doesn't need to." }
            kosul: { bayrak: "ihanet_deniz" }
          - { tr: "Kız, Ilgın, öne çıkıyor. Kolunda hâlâ o etiket dikili: YAKIT. \"Babam seçilmişti,\" diyor. \"Ben yakıt. Dün gece babam kendi adını kapıdan kazıdı. Bizi istemezseniz döneriz, ama bilin: {yer:tepe|e} dönersek bir daha inmeyiz.\"", en: "The girl, Iris, steps forward. That label's still sewn on her sleeve: FUEL. \"My dad was chosen,\" she says. \"I was fuel. Last night my dad scraped his own name off our door. If you don't want us, we'll go back. But you should know: if we go back up to {yer:tepe}, we don't come down again.\"" }
        sezgiler:
          - kosul: { stat: { cha: 230 } }
            metin: { tr: "Baba konuşmak istiyor ama korkuyor. Gözü durmadan {yer:tepe|e} kayıyor; orada olacak bir şeyi biliyor.", en: "The father wants to talk, but he's scared. His eyes keep sliding toward {yer:tepe}. He knows something that's going to happen up there." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "adını kazımak kolay değil. ben kendi adımı kazıdım bir kez. hâlâ kenarlarında yaldız kaldı.", en: "scraping off your own name isn't easy. i scraped off mine once. there's still gold leaf on the edges." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"O levhayı ben tanırım. O sokakta otururdum. O kapıdan her sabah geçerdim.\"", en: "\"I know that plaque. I used to live on that street. Walked past that door every morning.\"" }
        secenekler:
          - id: "gumruk"
            etiket: { tr: "Hamalları kenara çek; Gümrük'te onlara yer aç", en: "Move the dockworkers aside. Make room for them at the Customs House" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl15_beyaz_liman"
            sonraki: "bl15_us_beyaz_kapi_gumruk"
          - id: "ifade"
            etiket: { tr: "Babayı konuştur: {yer:tepe} filo günü ne yapacak?", en: "Get the father talking. What's {yer:tepe} planning for fleet day?" }
            gerekli: { stat: { cha: 230 } }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 1, siginak: 1 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "bl15_beyaz_ifade"
            sonraki: "bl15_us_beyaz_kapi_ifade"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} kızla konuşsun", en: "Let {npc:deniz_arman} talk to the girl" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 2 } }
              - bayrak: "bl15_beyaz_liman"
            sonraki: "bl15_us_beyaz_kapi_deniz"
          - id: "yolla"
            etiket: { tr: "{yer:kiyikent_liman|e} yük olmasınlar; {yer:eski_sehir|e} yolla", en: "They can't be a burden on {yer:kiyikent_liman}. Send them to {yer:eski_sehir}" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 1 }
              - bayrak: "bl15_beyaz_gonderildi"
            sonraki: "bl15_us_beyaz_kapi_yolla"

      - id: "bl15_us_beyaz_kapi_gumruk"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Hamallar homurdanarak çekiliyor. Aileyi Gümrük'ün arka koridoruna, Tavvarlarla {yer:kiyikent_liman|in} fazlalarının arasına yerleştiriyorsun. İlk gece kimse onlarla konuşmuyor.", en: "The dockworkers grumble and step aside. You settle the family in the back hallway of the Customs House, between the Tavvari and the overflow from {yer:kiyikent_liman}. Nobody talks to them the first night." }
          - { tr: "Ertesi sabah Ilgın beyaz gömleğini ters çevirip giymiş; YAKIT yazısı içeride kalmış. Kuyrukta bir kadının çocuğunu kucağına alıyor, kadın da sıradaki yerini kaybetmiyor. Akşama doğru biri ona ekmek uzatıyor.", en: "The next morning, Iris has her white shirt on inside out, so the FUEL label's on the inside. She holds a woman's kid in line so the woman can hold her place. Toward evening, somebody hands her some bread." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Levhayı Gümrük'ün duvarına as", en: "Hang the plaque on the Customs House wall" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_beyaz_kapi_ifade"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Babayı bir kenara çekip sakin sakin konuşuyorsun. Önce lafı dolandırıyor, sonra çözülüyor: Filo günü {yer:tepe|in} müminleri bütün kapıları açıp çatılara çıkacak, ellerinde fenerlerle bekleyecekmiş. İlk inen gemiyi kutsamak için.", en: "You take the father aside and talk to him calmly. He talks in circles at first, then it all comes out. On fleet day, the faithful in {yer:tepe} are going to open every door and go up on the roofs to wait with lanterns. To bless the first ship that comes down." }
          - { tr: "\"Yaşlıları, çocukları da çıkaracaklar,\" diyor, sesi titreyerek. \"Seçilmişler önden. Yakıtlar arkadan. Kızımı o sıranın sonunda görmek istemedim.\" Bu bilgiyi Lonca'nın topçularına ve Konsey'e birlikte iletiyorsun.", en: "\"They're taking the old folks and the kids up too,\" he says, his voice shaking. \"The chosen in front. The fuel in back. I didn't want to see my girl at the end of that line.\" You pass it on to the Guild's gunners and the Council both." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Aileyi Gümrük'e yerleştir", en: "Settle the family in at the Customs House" }
            etkiler:
              - xp_seviye: 12
              - bayrak: "bl15_beyaz_liman"
            sonraki: "@akis"

      - id: "bl15_us_beyaz_kapi_deniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:deniz_arman} kızın önünde diz çöküp kolundaki etikete bakıyor. Sonra kendi kolunu sıvıyor: tenine, dikişin geçtiği yerde, soluk bir iz kalmış.", en: "{npc:deniz_arman} kneels in front of the girl and looks at the label on her sleeve. Then {zamir:deniz_arman|o} roll{zamir:deniz_arman|s} up {zamir:deniz_arman|onun} own sleeve. On the skin, where stitches went through once, there's a faint scar." }
          - { tr: "\"Benimki seçilmiş yazıyordu,\" diyor {npc:deniz_arman}. \"İkisi de aynı kumaştan kesiliyor. Söküp atınca altında yine sen kalıyorsun.\" Hamallar bir süre bakışıyor, sonra yolu açıyor.", en: "\"Mine said chosen,\" {npc:deniz_arman} says. \"They cut both of them off the same cloth. When you rip it off, it's still just you under there.\" The dockworkers look at each other a while, then open the way." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onları içeri al", en: "Bring them inside" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_us_beyaz_kapi_yolla"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Onlara {yer:eski_sehir|in} bir sığınağına giden yolu tarif ediyorsun. Baba başıyla teşekkür ediyor; levhayı kızına uzatıp bohçasını sırtlıyor.", en: "You tell them how to get to a shelter in {yer:eski_sehir}. The father nods his thanks, hands the plaque to his daughter, and shoulders their bundle." }
          - { tr: "Ilgın giderken dönüp sana bakmıyor. Yokuşun başında levhayı bir çöp yığınının üstüne bırakıyor; yaldızın kalanı güneşte bir an parlayıp sönüyor.", en: "Iris doesn't look back at you as they go. At the top of the hill she leaves the plaque on a pile of trash. What's left of the gold leaf flashes once in the sun, then goes dull." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İşine dön", en: "Get back to work" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== ÇATILARDAKİ İŞARET (Tepe)
  - id: "bl15_tp_isaret"
    konum: ["tepe"]
    perde: [3]
    gun: { min: 306, max: 318 }
    kosul: { bolum: 15 }
    agirlik: 5
    etiketler: ["kesif", "yukselenler", "filo"]
    gerilim: 3
    kart: { tr: "Çatılardaki işaret", en: "Signs on the roofs" }
    sahne: "bl15_tp_isaret_1"
    sahneler:
      - id: "bl15_tp_isaret_1"
        yer: "tepe"
        paragraflar:
          - { tr: "{yer:tepe|in} çatıları bembeyaz. Müminler merdivenli sokaklardan kova kova kireç taşımış; çatıdan çatıya, yalnız gökyüzünden okunabilecek büyüklükte iç içe daireler çiziyorlar. Ortadaki dairenin içine dev harflerle bir sözcük yazılmış: BURADAYIZ.", en: "The roofs of {yer:tepe} are dead white. The faithful have hauled whitewash up the stepped streets bucket by bucket, and they're painting circles inside circles across roof after roof, so big you could only read them from the sky. In the middle circle, in giant letters: WE'RE HERE." }
          - { tr: "\"Yükseliş geliyor,\" diye fısıldıyor rulosuyla geçen beyaz giysili bir adam. \"Gemiler seçilmişleri alacak. Önce bizi görsünler diye.\" Çevrede ilahi söyleniyor; bu kez kimse sesini alçaltmıyor.", en: "\"The Ascension is coming,\" a man in white whispers as he walks by with his roller. \"The ships are going to take the chosen. We want them to see us first.\" There's hymn-singing all around. Nobody's keeping it down this time." }
          - metin: { tr: "{npc:vahit|in} sahtekâr olduğu ortaya çıkalı aylar oldu, ama boyuyorlar yine de. Artık ona değil, doğrudan gökyüzüne inanıyorlar.", en: "It's been months since {npc:vahit} got exposed as a fraud, and they're painting anyway. They don't believe in him anymore. They believe in the sky directly." }
            kosul: { bayrak: "vahit_sahtekar" }
          - metin: { tr: "{npc:vahit} çatıdan çatıya dolaşıp boyacıların kulağına bir şeyler fısıldıyor; ağzından çıkan her sözcük Sistem'in sesine benziyor.", en: "{npc:vahit} moves from roof to roof, whispering in the painters' ears, and every word out of his mouth sounds like the System's voice." }
            kosul: { bayrak: "vahit_hakli", npc_hayatta: "vahit" }
          - metin: { tr: "Sokağın sonunda yakıt deposunun isli duvarı hâlâ ayakta. Kimse onu boyamamış; beyazın ortasında kapkara bir yara gibi duruyor.", en: "At the end of the street, the soot-black wall of the fuel depot is still standing. Nobody's painted it. It sits there in the middle of all that white like a black wound." }
            kosul: { bayrak: "ihanet_deniz" }
          - { tr: "Bir çatının kenarında on beş yaşlarında bir kız tek başına boyuyor. Kolunda kumaştan bir etiket dikili: YAKIT. \"İlk benim evimi görsünler,\" diyor sana, rulosunu durdurmadan. \"Yakıtlar önden gider. Ben önden gidersem annemle babam seçilmişlerle kalır.\"", en: "On the edge of one roof, a girl of fifteen or so is painting all by herself. There's a cloth label stitched to her sleeve: FUEL. \"I want them to see my house first,\" she tells you, not stopping the roller. \"The fuel goes first. If I go first, Mom and Dad get to stay with the chosen.\"" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Kızın ellerinde kireç yanığı var. Annesi aşağıdaki pencereden ona bakıyor ama seslenmiyor; sesi çıkmıyor gibi.", en: "The girl's hands have lime burns. Her mother's watching her from a window below, but she doesn't call out. Like she can't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "gökyüzüne buradayız diye yazmışlar. gökyüzü zaten biliyor. sayıyor onları.", en: "they wrote we're here to the sky. the sky already knows. it's counting them." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Burada ilahileri ben de söyledim bir zamanlar. Sözlerini hâlâ unutamadım.\"", en: "\"I used to sing those hymns up here. I still can't forget the words.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bu kadar büyük bir beyaz alan yörüngeden bile görünür. Gerçek bir iniş işareti yapmışlar. Şaka değil bu.\"", en: "\"A white patch that size is visible from orbit. They've made an actual landing marker. This isn't a joke.\"" }
        secenekler:
          - id: "boz"
            tur: "gosteris"
            etiket: { tr: "Kireç kovalarını dök; işaretleri boz", en: "Dump the whitewash. Wreck the markings" }
            etkiler:
              - dikkat: 3
              - ahlak: { duzen: -1, insanlik: 1 }
              - itibar: { yukselenler: -3 }
              - iliski: { vahit: { korku: 3, guven: -3 } }
              - tehlike: { tepe: 3 }
              - bayrak: "bl15_tp_isaret_bozuldu"
            sonraki: "bl15_tp_isaret_boz"
          - id: "kiz"
            etiket: { tr: "Kızın yanına çık; onunla konuş", en: "Climb up next to the girl. Talk to her" }
            gerekli: { stat: { cha: 230 } }
            etkiler:
              - ahlak: { merhamet: 3 }
              - bayrak: "bl15_tp_aile"
              - tohum: { olay: "bl15_us_beyaz_kapi", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15 }, hatirlatma: { tr: "{yer:tepe|de} bir çatıda konuştuğun kızdan birkaç gündür haber yok.", en: "No word for a few days from the girl you talked to on that roof in {yer:tepe}." } }
            sonraki: "bl15_tp_isaret_kiz"
          - id: "yem"
            etiket: { tr: "Bırak dursun; filonun nereye ineceğini bilmek işe yarar", en: "Leave it. Knowing where the fleet lands is useful" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -3, insanlik: -2 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "bl15_tp_yem"
            sonraki: "bl15_tp_isaret_yem"
          - id: "kutsa"
            etiket: { tr: "Beyazını giy; işareti kutsa, kızı listeden sil", en: "Put on your whites. Bless the marker, strike the girl off the list" }
            goster: { bayrak: "uye_yukselenler" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: -1 }
              - itibar: { yukselenler: 2 }
              - iliski: { vahit: { guven: 3 } }
              - bayrak: "bl15_tp_kutsandi"
            sonraki: "bl15_tp_isaret_kutsa"

      - id: "bl15_tp_isaret_boz"
        yer: "tepe"
        paragraflar:
          - { tr: "Kovaları çatıdan çatıya tekmeleyerek deviriyorsun. Kireç merdivenlerden aşağı süt gibi akıyor, daireler yarıda kalıyor. Müminler rulolarını bırakıp sana bakıyor; ilahi kesiliyor.", en: "You kick the buckets over, roof after roof. The whitewash runs down the steps like milk, and the circles stop halfway. The faithful drop their rollers and stare at you. The hymn cuts off." }
          - { tr: "Kimse saldırmıyor, ama giderken arkandan taşlar düşüyor; sana değil, önüne. {yer:tepe} artık sana kapalı. Ertesi sabah bozduğun dairelerin yarısı yeniden boyanmış.", en: "Nobody attacks, but as you leave, rocks come down behind you. Not at you. In front of you. {yer:tepe|b} is closed to you now. By the next morning, half the circles you wrecked have been repainted." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yokuştan in", en: "Head down the hill" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_tp_isaret_kiz"
        yer: "tepe"
        paragraflar:
          - { tr: "Çatıya çıkıp kızın yanına oturuyorsun. Adı Ilgın. Bir süre yalnızca boyamasını izliyorsun; sonra yakıt etiketini kimin diktiğini soruyorsun. \"Annem,\" diyor. \"Ağlayarak dikti.\"", en: "You climb up and sit down next to the girl. Her name's Iris. For a while you just watch her paint. Then you ask her who sewed that fuel label on her. \"My mom,\" she says. \"She cried the whole time.\"" }
          - { tr: "\"Annen seni ilk göndermek istese ağlamazdı,\" diyorsun. Rulo duruyor. Aşağıdaki pencerede annesi elini ağzına bastırmış. Ilgın uzun süre konuşmuyor, sonra ruloyu kovaya bırakıyor. \"Babamla konuşmam lazım,\" diyor.", en: "\"If your mom wanted to send you first, she wouldn't have cried,\" you say. The roller stops. In the window below, her mother has a hand pressed over her mouth. Iris doesn't say anything for a long time, then drops the roller in the bucket. \"I need to talk to my dad,\" she says." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Onu aşağı, annesine indir", en: "Help her down to her mom" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_tp_isaret_yem"
        yer: "tepe"
        paragraflar:
          - { tr: "Hiçbir şey demeden geri çekiliyorsun. Aklında topçuların hedef çizelgesi var: İlk gemi buraya inecekse, ilk mermi de buraya düşecek.", en: "You back off without a word. You're thinking about the gunners' target sheets. If the first ship comes down here, the first shell lands here too." }
          - { tr: "Hesap soğuk ve doğru. Mendirekteki topçulara {yer:tepe|in} koordinatlarını yollatıyorsun. Çatıdaki kız rulosunu bir kez daha kovaya batırıp boyamaya devam ediyor; seni hiç görmemiş gibi.", en: "The math is cold, and it's right. You have the coordinates for {yer:tepe} sent down to the gunners on the breakwater. The girl on the roof dips her roller in the bucket one more time and keeps painting, like she never saw you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Arkana bakmadan yürü", en: "Walk away without looking back" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_tp_isaret_kutsa"
        yer: "tepe"
        paragraflar:
          - { tr: "Beyazını giyip çatıya çıkınca ilahi bir an duraksıyor, sonra iki kat gürleyerek yeniden başlıyor. İşaretin ortasına iki elini koyup kutsuyorsun; müminlerin yarısı gözyaşlarına boğuluyor.", en: "When you climb up on the roof in your whites, the hymn falters for a second, then comes back twice as loud. You put both hands on the center of the marker and bless it. Half the faithful break down in tears." }
          - { tr: "Sonra kızın kolundaki etiketi söküp avucuna alıyorsun. \"Bu ev seçilmiş bir evdir,\" diyorsun yüksek sesle. \"İçindeki herkesle.\" Kimse itiraz etmiyor. Kız etiketin söküldüğü yere dokunup kalakalıyor.", en: "Then you rip the label off the girl's sleeve and close it in your palm. \"This is a chosen house,\" you say, loud. \"Everyone in it.\" Nobody objects. The girl touches the place where the label used to be and just stands there." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Etiketi cebine koy", en: "Put the label in your pocket" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== YALDIZLI HARFLER (Tepe · saha kampı · Deniz)
  - id: "bl15_tp_kamp_deniz"
    konum: ["tepe"]
    kamp: true
    perde: [3]
    gun: { min: 306, max: 330 }
    kosul: { bolum: 15 }
    etiketler: ["kamp", "deniz"]
    gerilim: 1
    npc: ["deniz_arman"]
    kart: { tr: "Yaldızlı harfler", en: "Gold letters" }
    sahne: "bl15_tp_kamp_deniz_1"
    sahneler:
      - id: "bl15_tp_kamp_deniz_1"
        yer: "tepe"
        paragraflar:
          - { tr: "Kampı terk edilmiş bir villanın bahçesine kuruyorsunuz. Havuz kurumuş, dibinde yapraklar birikmiş. Bahçe kapısı beyaz; üstündeki yaldızlı ad yarı yarıya dökülmüş, geriye üç harf kalmış.", en: "You set up camp in the garden of an abandoned villa. The pool's dried up, leaves piled at the bottom. The garden gate is white, and the gold-leaf name over it has half flaked off. Three letters are left." }
          - { tr: "{npc:deniz_arman} ateşin başında, çakısıyla kapıdan bir harf sökmüş, avucunda evirip çeviriyor. Harf ışığı yakaladıkça yüzüne küçük altın lekeler düşüyor.", en: "{npc:deniz_arman} sits by the fire, turning a letter {zamir:deniz_arman|o} pried off the gate with a pocketknife. Every time it catches the light, little gold flecks land on {zamir:deniz_arman|onun} face." }
          - metin: { tr: "Sırtını yakıt deposunun olduğu yöne vermiş. O gece burada yanan ateşin kokusu hâlâ sokaklara sinmiş; {npc:deniz_arman} bir kez bile o yöne dönmüyor.", en: "{zamir:deniz_arman|o|b} {zamir:deniz_arman|has} turned {zamir:deniz_arman|onun} back on the fuel depot. The smell of the fire that burned here that night still hangs in the streets. {npc:deniz_arman} doesn't turn that way once." }
            kosul: { bayrak: "ihanet_deniz" }
          - metin: { tr: "\"İki sokak aşağıda otururdum,\" diyor. \"Yükselenler'le olduğum aylarda. Benim kapıma da ad yazmışlardı. Gidip bakmaya cesaretim yok.\"", en: "\"I lived two streets down,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"Those months I was with the Ascended. They put a name on my door too. I don't have the guts to go look.\"" }
            kosul: { bayrak: "deniz_yukselenlere_gitti", bayrak_yok: "ihanet_deniz" }
          - metin: { tr: "\"Kardeşim bunlara bayılırdı,\" diyor harfi göstererek. \"Yaldızlı harflere. Defterinin kapağına yapıştırırdı. Onu bulduğumuzdan beri her şeyi ona götürmek istiyorum. Bunu da.\"", en: "\"My sister loved stuff like this,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, holding up the letter. \"Gold letters. She'd stick them on her notebook cover. Ever since we found her, I want to bring her everything. This too.\"" }
            kosul: { bayrak: "deniz_kardes_bulundu" }
          - metin: { tr: "\"Kardeşim bunlara bayılırdı,\" diyor harfi göstererek. \"Yaldızlı harflere. Defterinin kapağına yapıştırırdı. Hâlâ bir yerlerde yapıştırıyordur belki.\"", en: "\"My sister loved stuff like this,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, holding up the letter. \"Gold letters. She'd stick them on her notebook cover. Maybe she's still sticking them on somewhere.\"" }
            kosul: { bayrak_yok: "deniz_kardes_bulundu" }
          - { tr: "Sonra harfi ateşin ışığına tutuyor. \"Bu kapılara ad yazdıranlar seçildiklerine inanıyordu. Sen seçildin mi sence? Seçildiysen kim seçti?\"", en: "Then {zamir:deniz_arman|o} hold{zamir:deniz_arman|s} the letter up to the firelight. \"The people who put names on these doors believed they'd been chosen. Do you think you were? And if you were, who did the choosing?\"" }
        sezgiler:
          - kosul: { stat: { per: 200 } }
            metin: { tr: "Söktüğü harf bir \"D\". Bunu sen fark ediyorsun; {npc:deniz_arman} etmemiş gibi yapıyor.", en: "The letter {zamir:deniz_arman|o} pried off is a \"D.\" You notice. {npc:deniz_arman} acts like {zamir:deniz_arman|o} didn't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "seni seçen bendim belki. ya da sen beni seçtin. ona söyleme. ikimizi de canavar sanır.", en: "maybe i was the one who chose you. or you chose me. don't tell them. they'd think we're both monsters." }
        secenekler:
          - id: "kimse"
            etiket: { tr: "\"Kimse seçmedi. Ben de seçmedim. Oldu işte.\"", en: "\"Nobody chose. I didn't either. It just happened.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl15_tp_kamp_deniz", agirlik: 30 }
              - bayrak: "bl15_deniz_kamp_secilmedi"
            sonraki: "bl15_tp_kamp_deniz_kimse"
          - id: "sen"
            etiket: { tr: "\"Sen seçtin. Her seferinde yanımda kalarak.\"", en: "\"You did. Every time you stayed next to me.\"" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 5, guven: 2 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl15_tp_kamp_deniz", agirlik: 40 }
              - bayrak: "bl15_deniz_kamp_sen"
            sonraki: "bl15_tp_kamp_deniz_sen"
          - id: "ates"
            etiket: { tr: "Harfi elinden al, ateşe at", en: "Take the letter from them and toss it in the fire" }
            etkiler:
              - iliski: { deniz_arman: { saygi: 2, guven: -1 } }
              - hafiza: { npc: "deniz_arman", id: "olay:bl15_tp_kamp_deniz", agirlik: 25 }
              - bayrak: "bl15_deniz_kamp_ates"
            sonraki: "bl15_tp_kamp_deniz_ates"

      - id: "bl15_tp_kamp_deniz_kimse"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir süre düşünüyor. \"Oldu işte,\" diye tekrarlıyor. \"Bütün dünya bunun bir anlamı olsun diye birbirini yiyor, sen kalkmış oldu işte diyorsun.\"", en: "{npc:deniz_arman} thinks about it for a while. \"It just happened,\" {zamir:deniz_arman|o} repeat{zamir:deniz_arman|s}. \"The whole world's tearing itself apart trying to make this mean something, and you're over here saying it just happened.\"" }
          - { tr: "Harfi cebine koyup gülümsüyor. \"İşin garibi, en çok buna inanıyorum. Tanrılar oldu işte demez. Canavarlar da demez.\"", en: "{zamir:deniz_arman|o|b} pocket{zamir:deniz_arman|s} the letter and smile{zamir:deniz_arman|s}. \"Weird thing is, that's the one I believe the most. Gods don't say it just happened. Monsters don't either.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşe bir dal at", en: "Throw a stick on the fire" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_tp_kamp_deniz_sen"
        yer: "tepe"
        paragraflar:
          - { tr: "{npc:deniz_arman} önce gülüyor, sonra gülmesi yarıda kalıyor. Harfi avucunda sıkıyor; kenarları tenine batsa da bırakmıyor.", en: "{npc:deniz_arman} laughs at first, then the laugh stops halfway. {zamir:deniz_arman|o|b} squeeze{zamir:deniz_arman|s} the letter in {zamir:deniz_arman|onun} fist. The edges dig into the skin, but {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't let go." }
          - metin: { tr: "\"Her seferinde kalmadım ama,\" diyor alçak sesle. \"Bir kere gittim. Burada, bu sokaklarda.\" Sonra başını kaldırıyor. \"Ama döndüm. Onu da sayıyorsan tamam.\"", en: "\"I didn't stay every time, though,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} quietly. \"I left once. Here, on these streets.\" Then {zamir:deniz_arman|o} look{zamir:deniz_arman|s} up. \"But I came back. If you're counting that, okay.\"" }
            kosul: { herhangi: [{ bayrak: "ihanet_deniz" }, { bayrak: "deniz_yukselenlere_gitti" }] }
          - { tr: "Gecenin geri kalanında {npc:deniz_arman} ateşi hiç söndürmüyor; sen uyurken bile.", en: "For the rest of the night, {npc:deniz_arman} never lets the fire go out. Not even while you're sleeping." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Uyu", en: "Sleep" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_tp_kamp_deniz_ates"
        yer: "tepe"
        paragraflar:
          - { tr: "Harfi elinden alıp ateşe atıyorsun. Yaldız bir an parlıyor, sonra kararıyor; altındaki teneke kıvrılıp eriyor. {npc:deniz_arman} itiraz etmiyor, ama gözünü ateşten ayırmıyor.", en: "You take the letter out of {zamir:deniz_arman|onun} hand and toss it in the fire. The gold leaf flares for a second, then goes black, and the tin underneath curls and melts. {npc:deniz_arman} doesn't object, but {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't take {zamir:deniz_arman|onun} eyes off the flames." }
          - { tr: "\"Cevap vermemenin en kısa yolu,\" diyor sonunda. \"Tamam. Bunu da bir cevap sayarım.\" Battaniyesine sarınıp sırtını dönüyor.", en: "\"Shortest way to not answer,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} finally. \"Fine. I'll count that as an answer too.\" {zamir:deniz_arman|o|b} wrap{zamir:deniz_arman|s} up in a blanket and turn{zamir:deniz_arman|s} away." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşin başında yalnız kal", en: "Sit by the fire alone" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== SEFER ONDALIĞI (Pirinç Kervan)
  - id: "bl15_pk_ondalik"
    konum: ["pirinc_kervan"]
    perde: [3]
    gun: { min: 306, max: 318 }
    kosul: { bolum: 15, bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["kesif", "kervan", "kadimler", "filo"]
    gerilim: 3
    kart: { tr: "Sefer ondalığı", en: "The war tithe" }
    sahne: "bl15_pk_ondalik_1"
    sahneler:
      - id: "bl15_pk_ondalik_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Tartı Çarşısı'nda tezgâhlar kapalı. Pirinç zırhlı Gümrük Muhafızları güvertelerin kaplamalarını levye ile söküp istif ediyor; her levha sökülürken kervanın gövdesi inler gibi gıcırdıyor. İstiflerin başında bir Kadim levazım subayı, elinde ince bir değnekle sayıyor.", en: "The stalls in the Weighing Bazaar are shut. Brass-armored Tariff Wardens are prying the plating off the decks with crowbars and stacking it, and every time a plate comes off, the Caravan's hull groans. At the head of the stacks, an Ancient quartermaster counts with a thin rod." }
          - { tr: "Dev terazinin önünde Tavvar aileleri sıraya dizilmiş. Sefer ondalığını pirinçle ödeyemeyen kendini ödüyor: Kefeye çıkıyor, tartılıyor, ağırlığı kadar gemilerde kürek ya da safra olarak yazılıyor.", en: "Tavvari families are lined up in front of the giant scale. Whoever can't pay the war tithe in brass pays with themselves. They step into the pan, get weighed, and get signed up for their weight as rowers or ballast on the ships." }
          - metin: { tr: "Boyun Senedi'ni kırdığın kervan bu. Özgür kervan Karanlık Rota'ya kaçmıştı, ama filonun ikmal gemisi rotanın ağzında bekliyormuş. Özgürlüklerinin bedelini şimdi pirinçle ödüyorlar.", en: "This is the Caravan whose Neckbond you broke. The free Caravan had fled onto the Dark Route, but the fleet's supply ship was waiting at the mouth of it. Now they're paying for their freedom in brass." }
            kosul: { bayrak: "kervan_ozgur" }
          - metin: { tr: "Senet senin adına; muhafızlar bunu biliyor. Seni görünce muhafızların levyeleri havada kalıyor. Sahibin malına el koymak Kadim yasasında da suçtur.", en: "The bond's in your name, and the Wardens know it. When they see you, their crowbars hesitate. Seizing an owner's property is a crime under Ancient law too." }
            kosul: { bayrak: "kervan_sahibi" }
          - metin: { tr: "Ondalıkçı'nın devrildiği meydanda yeni bir Ondalıkçı duruyor; öncekinden daha genç, daha hevesli.", en: "In the square where the Tithe-Taker fell, there's a new Tithe-Taker standing. Younger than the last one, and more eager." }
            kosul: { bayrak: "ondalikci_olduruldu" }
          - { tr: "Dökümhanenin kapısında yaşlı bir Tavvar demirci, Oskut, seni yanına çağırıyor. Fısıltıyla anlatıyor: Filonun istediği perçinleri o döküyor. İçleri boş. \"Gemiler inerken o perçinler gevşeyecek,\" diyor. \"Ama son yük gemiye girene kadar muhafızın kalıpları açmaması lazım. Biri onu oyalarsa...\"", en: "At the foundry door, an old Tavvari smith named Oskut waves you over. He explains in a whisper: he's the one casting the rivets the fleet wants. They're hollow. \"When those ships come down, those rivets are going to work loose,\" he says. \"But the Warden can't open the molds before the last load's aboard. If somebody kept him busy...\"" }
          - { tr: "Arkada, terazinin sırasında, birbirine sarılmış üç çocuk bekliyor. Anne babaları geçen ay tartılmış.", en: "In the back, in the line for the scale, three kids are waiting with their arms around each other. Their parents got weighed last month." }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Muhafızın kaskında bir çatlak var; sesler ona geç ulaşıyor. Önünden değil yanından konuşan birini çok uzun süre dinler.", en: "The Warden's helmet has a crack in it, so sound reaches him late. Somebody talking to him from the side, not the front, could keep him listening a long time." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "boş perçinler. bir dünyanın intikamı bu kadar küçük olur. ama tutar. küçük şeyler hep tutar.", en: "hollow rivets. that's how small a world's revenge gets. but it holds. small things always hold." }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"İhtiyar kafasını kesecekler bunun için. Biliyor da. Hoşuma gitti.\"", en: "\"They're going to take the old man's head for this. And he knows it. I like him.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Donanım düzeyinde sabotaj. Ben yazılımla uğraşıyorum, adam kalıpla yapıyor. Saygı.\"", en: "\"Hardware-level sabotage. I'm messing with software, and this guy's doing it in the mold. Respect.\"" }
        secenekler:
          - id: "oyala"
            etiket: { tr: "Muhafızı yanından yakala; son yük girene kadar oyala", en: "Catch the Warden from the side. Keep him talking until the last load's in" }
            gerekli: { stat: { cha: 230 } }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - dikkat: 2
              - tehlike: { pirinc_kervan: 2 }
              - iliski: { aras_kurt: { saygi: 2 } }
              - bayrak: "bl15_pk_sabotaj"
            sonraki: "bl15_pk_ondalik_oyala"
          - id: "cocuklar"
            etiket: { tr: "Sıradaki çocukları al, geçitten Dünya'ya götür", en: "Take the kids out of line. Bring them through the passage to Earth" }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -1 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl15_pk_cocuklar"
              - tohum: { olay: "bl15_us_tavvar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15 }, hatirlatma: { tr: "Kervandan getirdiğin Tavvar çocukları birkaç gündür Gümrük'ün avlusunda; peşlerinden biri daha gelmiş.", en: "The Tavvari kids you brought from the Caravan have been in the Customs House yard for a few days. Someone else followed them through." } }
            sonraki: "bl15_pk_ondalik_cocuklar"
          - id: "senet"
            etiket: { tr: "Senedi göster: \"Bu pirinç benim.\"", en: "Show them the bond. \"This brass is mine.\"" }
            goster: { bayrak: "kervan_sahibi" }
            etkiler:
              - ahlak: { duzen: 1, merhamet: 1 }
              - itibar: { kadimler: -2 }
              - tehlike: { pirinc_kervan: -3 }
              - bayrak: "bl15_pk_senet"
            sonraki: "bl15_pk_ondalik_senet"
          - id: "karisma"
            etiket: { tr: "Karışma; kervanın derdi kervanın", en: "Stay out of it. The Caravan's problem is the Caravan's" }
            etkiler:
              - ahlak: { merhamet: -2 }
              - bayrak: "bl15_pk_karisma"
            sonraki: "bl15_pk_ondalik_karisma"

      - id: "bl15_pk_ondalik_oyala"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Muhafızın çatlak kaskının yanına geçip sorular sormaya başlıyorsun: kayıt usulü, gümrük oranları, bir anomalinin beyannamede nasıl yazıldığı... Muhafız her soruya ezberden uzun uzun cevap veriyor; Kadim yasası ona susmayı öğretmemiş.", en: "You step up beside the Warden's cracked helmet and start asking questions. Registration procedure, tariff rates, how an anomaly gets listed on a manifest. The Warden answers every one from memory, at length. Ancient law never taught him to stop talking." }
          - { tr: "Arkasında Oskut'un çırakları son sandığı iskeleye taşıyor, kapakları mühürleniyor. Muhafız cevabını bitirdiğinde ikmal gemisi çoktan demir almış. Oskut uzaktan sana başıyla selam veriyor; bir daha göreceğini sanmıyorsun.", en: "Behind him, Oskut's apprentices haul the last crate to the dock, and the lids get sealed. By the time the Warden's done answering, the supply ship has already weighed anchor. Oskut nods to you from a distance. You don't think you'll see him again." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Muhafıza teşekkür et", en: "Thank the Warden" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl15_pk_ondalik_cocuklar"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Çocukları sıradan alıp önüne katıyorsun. Levazım subayı değneğini kaldırıyor, sonra başının üstündeki sayıya bakıp değneği indiriyor ve deftere bir çentik atıyor: üç kalem eksik.", en: "You pull the kids out of line and walk them ahead of you. The quartermaster raises his rod, then looks at the number over your head, lowers it, and makes a tick mark in his ledger. Three items short." }
          - { tr: "Geçide giderken en büyükleri dönüp terazinin ardında bıraktıklarına bakıyor. Arkalarından, elinde bir defterle yaşlı bir tartıcı da koşuyor: \"Bensiz gitmeyin. Ben sayarım sizi.\"", en: "On the way to the passage, the oldest one turns to look back at everybody left behind the scale. An old weigher with a ledger in her hands comes running after them. \"Don't go without me. I keep count of you.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Geçide yürü", en: "Walk into the passage" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_pk_ondalik_senet"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Senedin mührünü levazım subayının yüzüne tutuyorsun. Subay mührü okuyor, bir kez daha okuyor, sonra muhafızlara işaret ediyor: Levyeler iniyor. \"Sahibin malı sahibine,\" diyor; Kadim yasası onun için de bağlayıcı.", en: "You hold the bond's seal up in the quartermaster's face. He reads it, reads it again, then signals the Wardens, and the crowbars come down. \"Property goes back to its owner,\" he says. Ancient law binds him too." }
          - { tr: "Tavvarlar söküleni yerine çakarken sana teşekkür etmiyorlar. Bir sahibe teşekkür edilmez. Ama terazinin sırası o gün dağılıyor ve kimse kefeye çıkmıyor.", en: "The Tavvari don't thank you as they nail the plating back down. You don't thank an owner. But the line at the scale breaks up that day, and nobody steps into the pan." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Senedi katlayıp sakla", en: "Fold up the bond and put it away" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_pk_ondalik_karisma"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Oskut'a başını sallayıp uzaklaşıyorsun. Demirci bir şey demiyor; dökümhanenin kapısını yavaşça kapatıyor.", en: "You shake your head at Oskut and walk off. The smith doesn't say anything. He just slowly closes the foundry door." }
          - { tr: "Arkanda terazinin kefesi iniyor, kalkıyor. Sıradaki üç çocuktan ilki kefeye çıkarken öbür ikisinin elini bırakmıyor; tartıcı üçünü birden yazıyor.", en: "Behind you, the scale's pan goes down and comes up. When the first of the three kids steps into it, the kid won't let go of the other two's hands. The weigher writes all three down at once." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Geçide dön", en: "Head back to the passage" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== TARTILAMAYANLAR (Pirinç Kervan · saha kampı · Aras)
  - id: "bl15_pk_kamp_aras"
    konum: ["pirinc_kervan"]
    kamp: true
    perde: [3]
    gun: { min: 306, max: 330 }
    kosul: { bolum: 15 }
    etiketler: ["kamp", "aras"]
    gerilim: 2
    npc: ["aras_kurt"]
    kart: { tr: "Tartılamayanlar", en: "Can't be weighed" }
    sahne: "bl15_pk_kamp_aras_1"
    sahneler:
      - id: "bl15_pk_kamp_aras_1"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Gece kervanın kıç güvertesinde kamp kuruyorsunuz. Yukarıda bu dünyanın iki ayı var; ikisinin arasından, filonun bıraktığı ince bir ışık izi geçiyor. {npc:aras_kurt} ceketinin önünü açmış, göğsüne dokunup duruyor.", en: "That night you make camp on the Caravan's stern deck. This world has two moons, and between them runs a thin trail of light the fleet left behind. {npc:aras_kurt} has his jacket open, and he keeps touching his chest." }
          - { tr: "\"Filo yola çıktığından beri vızıldıyor,\" diyor. Göğsündeki Kadim çekirdeği tenin altında soluk soluk parlıyor. \"Eve dön diyor. Hiç görmediğim bir eve.\"", en: "\"It's been buzzing since the fleet set out,\" he says. The Ancient core in his chest is glowing faintly under the skin. \"Telling me to go home. A home I've never seen.\"" }
          - metin: { tr: "\"Fırtına gecesi sökeceğine söz vermiştin,\" diye ekliyor, sırıtmadan. \"Beni alırsa. Henüz almadı. Ama sözünü unutma.\"", en: "\"The night of the storm, you promised you'd rip it out,\" he adds, not grinning. \"If it took me. It hasn't yet. But don't forget that promise.\"" }
            kosul: { bayrak: "sb13_aras_cekirdek_soz" }
          - metin: { tr: "Ellinci kattaki o geceden beri onunla ilk kez baş başasın. İkiniz de o kapıdan söz etmiyorsunuz; ama ateşin ışığında o kapının gölgesi aranızda duruyor.", en: "It's the first time you've been alone with him since that night on the fiftieth floor. Neither of you mentions that door. But in the firelight, its shadow sits between you." }
            kosul: { bayrak: "ihanet_aras" }
          - { tr: "{npc:aras_kurt} kalkıp güvertenin kenarındaki küçük bir Tavvar terazisine çıkıyor. İbre durmadan, tur üstüne tur dönüyor. Gülüyor: \"Tartamıyor. Filoya gitsem tartarlardı ama. Orada yerim belli.\"", en: "He gets up and steps onto a small Tavvari scale at the edge of the deck. The needle starts to spin. And it doesn't stop, round after round. {npc:aras_kurt} laughs. \"Can't weigh me. If I went to the fleet, they'd weigh me, though. I'd know where I stand there.\"" }
          - metin: { tr: "Tartı Çarşısı'nın dev terazisi de seni tartamamıştı. {npc:aras_kurt} bunu biliyor; ibreye bakarken sana bakıyor.", en: "The giant scale in the Weighing Bazaar couldn't weigh you either. {npc:aras_kurt} knows that. He's looking at you while he watches the needle." }
            kosul: { bayrak: "kervan_tartilamadi" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Şaka yapıyor ama sesi şaka yapmıyor. Gerçekten gitmeyi düşünmüş; belki birkaç gece önce, belki bu gece.", en: "He's joking, but his voice isn't. He's really thought about going. Maybe a few nights ago. Maybe tonight." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o çekirdek ona ev diyor. bana da bir zamanlar ev demişlerdi. ev diye seslenen her şeye güvenme.", en: "that core calls itself home to him. somebody called something home to me once too. don't trust anything that calls you home." }
        secenekler:
          - id: "durdur"
            etiket: { tr: "\"Gidersen peşinden gelip seni geri getiririm.\"", en: "\"You go, I come after you and drag you back.\"" }
            etkiler:
              - iliski: { aras_kurt: { saygi: 4, korku: 2 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl15_pk_kamp_aras", agirlik: 35 }
              - bayrak: "bl15_aras_kamp_durdur"
            sonraki: "bl15_pk_kamp_aras_durdur"
          - id: "serbest"
            etiket: { tr: "\"Gitmek istersen git. Ama önce bana söyle.\"", en: "\"You want to go, go. Just tell me first.\"" }
            etkiler:
              - iliski: { aras_kurt: { guven: 5 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl15_pk_kamp_aras", agirlik: 35 }
              - bayrak: "bl15_aras_kamp_serbest"
            sonraki: "bl15_pk_kamp_aras_serbest"
          - id: "terazi"
            etiket: { tr: "Sen de teraziye, onun yanına çık", en: "Step onto the scale next to him" }
            etkiler:
              - iliski: { aras_kurt: { baglilik: 4, saygi: 1 } }
              - hafiza: { npc: "aras_kurt", id: "olay:bl15_pk_kamp_aras", agirlik: 40 }
              - bayrak: "bl15_aras_kamp_terazi"
            sonraki: "bl15_pk_kamp_aras_terazi"

      - id: "bl15_pk_kamp_aras_durdur"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:aras_kurt} teraziden inip yüzüne bakıyor. \"Beni geri getirmek için o gemiye çıkman lazım,\" diyor. \"Kırk sekiz gemiden birine. Yalnız.\"", en: "{npc:aras_kurt} steps off the scale and looks you in the face. \"To drag me back, you'd have to get on that ship,\" he says. \"One out of forty-eight. Alone.\"" }
          - { tr: "\"Biliyorum,\" diyorsun. Bir süre ikiniz de konuşmuyorsunuz. Sonra sırıtıyor; bu kez gerçekten. \"Tamam. O zaman gitmem. Seni o kadar yormaya değmez.\"", en: "\"I know,\" you say. Neither of you talks for a while. Then he grins. A real one, this time. \"Okay. Then I won't go. Not worth wearing you out like that.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ateşi canlandır", en: "Stoke the fire" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_pk_kamp_aras_serbest"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "{npc:aras_kurt} beklemediği bir şey duymuş gibi duraksıyor. \"Söylerim,\" diyor sonunda. \"Söylemeden gitmem. Bunu sana borçluyum.\"", en: "{npc:aras_kurt} stops like he heard something he wasn't expecting. \"I'll tell you,\" he says finally. \"I won't go without saying. I owe you that.\"" }
          - { tr: "Ceketinin önünü kapatıyor; çekirdeğin ışığı kumaşın altında kayboluyor. Gece boyu göğsüne bir kez bile dokunmuyor.", en: "He zips his jacket shut, and the core's light disappears under the fabric. He doesn't touch his chest once for the rest of the night." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Uyu", en: "Sleep" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

      - id: "bl15_pk_kamp_aras_terazi"
        yer: "pirinc_kervan"
        paragraflar:
          - { tr: "Teraziye onun yanına çıkıyorsun. İbre bir an daha hızlı dönüyor, sonra sarsılıp tam sıfırda duruyor. İki anomali birbirini götürmüş.", en: "You step onto the scale next to him. The needle spins faster for a second, then shudders and stops. Dead on zero. Two anomalies canceling each other out." }
          - { tr: "{npc:aras_kurt} ibreye bakıp kahkahayı basıyor, hem de kervanın uyuyan bekçilerini kımıldatacak kadar yüksek sesle. \"Sıfır,\" diyor. \"İkimiz birlikte hiçbir şey etmiyoruz. Kadimler bunu deftere nasıl yazacak?\"", en: "{npc:aras_kurt} looks at the needle and bursts out laughing, loud enough to make the Caravan's sleeping watchmen stir. \"Zero,\" he says. \"Together, we weigh nothing. How are the Ancients going to put that in a ledger?\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Teraziden in", en: "Step off the scale" }
            etkiler:
              - xp_seviye: 9
            sonraki: "@akis"

  # ================================================================== ERİTME KAZANI (Sanayi)
  - id: "bl15_sn_kazan"
    konum: ["sanayi"]
    perde: [3]
    gun: { min: 306, max: 318 }
    kosul: { bolum: 15 }
    agirlik: 5
    etiketler: ["kesif", "lonca", "filo"]
    gerilim: 2
    kart: { tr: "Eritme kazanı", en: "The melting pot" }
    sahne: "bl15_sn_kazan_1"
    sahneler:
      - id: "bl15_sn_kazan_1"
        yer: "sanayi"
        paragraflar:
          - { tr: "Haddehanenin büyük kazanı gece gündüz kaynıyor. Mendirekteki toplar için mermi dökülüyor, ama pirinç yetmiyor. Kapıya bir masa konmuş, üstüne tebeşirle yazılmış: BİR YÜZÜK, BİR KOVAN.", en: "The rolling mill's big crucible has been boiling day and night. They're casting shells for the guns on the breakwater, but there isn't enough brass. Somebody's set up a table by the door with a sign chalked on it: ONE RING, ONE SHELL CASING." }
          - { tr: "Masanın tepsisi dolu: alyanslar, kapı anahtarları, madalyalar, bir çocuğun pirinç düdüğü, bir vapur jetonu. Bir usta tepsiyi kaldırıp kazanın başına taşıyor.", en: "The tray on the table is full: wedding rings, house keys, medals, a kid's brass whistle, a ferry token. A foreman lifts the tray and carries it over to the crucible." }
          - { tr: "Tam o sırada kapıdan bir kadın koşarak giriyor, nefes nefese. \"Oğlum babasının yüzüğünü vermiş,\" diyor. \"Bana sormadan. Yirmi iki yıl takmıştı onu. Kocamdan elimde başka bir şey kalmadı.\" Yüzük tepsinin en üstünde duruyor; içine kazınmış tarih buradan bile okunuyor.", en: "Right then a woman runs in through the door, out of breath. \"My son gave away his father's ring,\" she says. \"Without asking me. He wore it twenty-two years. I don't have anything else left of my husband.\" The ring's sitting right on top of the tray. You can read the date engraved inside it from here." }
          - { tr: "Usta tepsiyi bırakmıyor. \"Hanımefendi, bir yüzük bir kovan,\" diyor. \"Herkes kendi yüzüğünü geri isterse topların ağzına taş koyarız.\"", en: "The foreman doesn't put the tray down. \"Ma'am, one ring, one casing,\" he says. \"If everybody wants their ring back, we'll be loading the guns with rocks.\"" }
          - metin: { tr: "Duvarın öbür yanında, Haddehanenin soğuk fırınında {npc:kaya_demir} tutuklu. Kazanın sıcağı o duvara da vuruyor.", en: "On the other side of the wall, in the rolling mill's cold furnace, {npc:kaya_demir} is locked up. The crucible's heat reaches that wall too." }
            kosul: { bayrak: "kaya_hapiste", npc_hayatta: "kaya_demir" }
          - metin: { tr: "Kampanya Demir Yasa'nın, yani senin adınla yürüyor. Masadaki tebeşir yazının altında imzan var.", en: "The drive is running under the Iron Law, which means under your name. Your signature's under the chalk sign on the table." }
            kosul: { bayrak: "lonca_hakimiyeti" }
        sezgiler:
          - kosul: { stat: { end: 230 } }
            metin: { tr: "Kazanın ağzı bin derecenin üstünde. Ama senin derin oraya bir an dayanır; bir an yeter.", en: "The mouth of that crucible is over eighteen hundred degrees. But your skin can stand it for a second. A second's enough." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ölüleri eritip mermi yapıyorlar. akıllıca. ölüler de savaşsın.", en: "they're melting down the dead to make bullets. smart. let the dead fight too." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Bir kovan daha az. O kadının bu geceyi atlatması için o yüzük, bütün o toplardan daha önemli olabilir.\"", en: "\"One casing short. For that woman to make it through tonight, that ring might matter more than every one of those guns.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Usta haklı. Yüzükle gemi düşmez. Mermiyle düşer.\"", en: "\"The foreman's right. A ring doesn't bring down a ship. A shell does.\"" }
        secenekler:
          - id: "cek"
            tur: "gosteris"
            etiket: { tr: "Usta tepsiyi boşaltınca yüzüğü kazandan çıplak elle çek", en: "When the foreman dumps the tray, pull the ring out of the crucible bare-handed" }
            gerekli: { stat: { end: 230 } }
            etkiler:
              - dikkat: 3
              - ahlak: { merhamet: 2, insanlik: -1 }
              - bayrak: "bl15_sn_yuzuk_dondu"
            sonraki: "bl15_sn_kazan_cek"
          - id: "adlar"
            etiket: { tr: "\"Yüzük erisin. Kocasının adı mermiye kazınsın.\"", en: "\"Let it melt. Put her husband's name on the shell.\"" }
            etkiler:
              - ahlak: { duzen: 2, insanlik: 1 }
              - itibar: { lonca: 2 }
              - iliski: { kaya_demir: { saygi: 2 } }
              - bayrak: "bl15_sn_adlar"
              - tohum: { olay: "bl15_kr_atis", gecikme: { min: 2, max: 4 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "Haddehanede adlar kazınmış ilk mermiler hazır; Lonca'nın topçuları onları {yer:kordon|de} denemek istiyor.", en: "The first shells with names engraved on them are ready at the rolling mill. The Guild's gunners want to test them out on {yer:kordon}." } }
            sonraki: "bl15_sn_kazan_adlar"
          - id: "gonullu"
            etiket: { tr: "Kampanyayı değiştir: sahibi vermedikçe hiçbir şey alınmasın", en: "Make it voluntary. Nothing gets taken unless the owner gives it" }
            goster: { herhangi: [{ bayrak: "uye_lonca" }, { bayrak: "lonca_hakimiyeti" }] }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - itibar: { lonca: -1 }
              - iliski: { kaya_demir: { saygi: -2 }, elif_sari: { guven: 2 } }
              - bayrak: "bl15_sn_gonullu"
            sonraki: "bl15_sn_kazan_gonullu"
          - id: "birak"
            etiket: { tr: "Ustaya hak ver; toplar dolmalı", en: "Side with the foreman. The guns have to be loaded" }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - itibar: { lonca: 1 }
              - bayrak: "bl15_sn_eridi"
            sonraki: "bl15_sn_kazan_birak"

      - id: "bl15_sn_kazan_cek"
        yer: "sanayi"
        paragraflar:
          - { tr: "Usta tepsiyi boşaltırken elini kazanın ağzına daldırıyorsun. Bir an dünya beyaz bir uğultuya dönüyor; sonra avucunda, kıpkırmızı ama hâlâ yüzük olan bir halka var. Dökümhane donup kalmış.", en: "As the foreman dumps the tray, you plunge your hand into the mouth of the crucible. For a second the world turns into a white roar. Then there's a band in your palm, glowing red, but still a ring. The whole foundry has frozen." }
          - { tr: "Yüzüğü bir kova suya atıp soğutuyorsun, sonra kadına uzatıyorsun. Kadın yüzüğü alıyor, sonra senin eline bakıyor; deri çoktan iyileşmeye başlamış. Teşekkür etmeyi unutup geri geri kapıya yürüyor.", en: "You drop the ring in a bucket of water to cool it, then hand it to the woman. She takes it, then looks at your hand. The skin's already healing. She forgets to say thank you and backs out the door." }
          - { tr: "Usta tepsinin kalanını kazana döküp sana dönüyor. \"Bir kovan eksik,\" diyor. \"Ama bunu bütün {yer:sanayi} konuşacak. Belki yüzüğünü getiren on kişi daha çıkar.\"", en: "The foreman dumps the rest of the tray into the crucible and turns to you. \"One casing short,\" he says. \"But all of {yer:sanayi} is going to be talking about this. Maybe ten more people bring in their rings.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Elini silkele, dökümhaneden çık", en: "Shake out your hand and leave the foundry" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_sn_kazan_adlar"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kadına yaklaşıp yavaşça konuşuyorsun. Yüzük eriyecek, ama dökülen ilk merminin gövdesine kocasının adı kazınacak; filo geldiğinde o ad gökyüzüne gidecek. Kadın uzun süre susuyor, sonra başını sallıyor.", en: "You go up to the woman and talk to her gently. The ring's going to melt, but her husband's name will be engraved on the body of the first shell they cast. When the fleet comes, that name goes up into the sky. She's quiet a long time. Then she nods." }
          - { tr: "Usta önce homurdanıyor, sonra bir kalem çıkarıp adı yazıyor. Akşama kadar kapıdaki masanın önünde yeni bir kuyruk oluşuyor: yüzüğünü getiren herkes bir ad da getiriyor.", en: "The foreman grumbles at first, then pulls out a pencil and writes down the name. By evening there's a new line in front of the table by the door. Everybody bringing a ring is bringing a name too." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İlk merminin dökülmesini bekle", en: "Wait for the first shell to be cast" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_sn_kazan_gonullu"
        yer: "sanayi"
        paragraflar:
          - { tr: "Tebeşiri alıp tahtadaki yazının altına ekliyorsun: SAHİBİ VERMEDİKÇE ALINMAZ. Usta itiraz edecek oluyor, halkanı görünce susuyor. Yüzük kadına dönüyor.", en: "You take the chalk and add a line under the sign: NOTHING TAKEN UNLESS THE OWNER GIVES IT. The foreman starts to argue, sees your Guild ring, and shuts up. The ring goes back to the woman." }
          - { tr: "Akşam tepsi yarı yarıya boş. Usta mermi sayısını tahtaya yazıp altını iki kez çiziyor. \"Bunu filoya anlatırsın,\" diyor, sana bakmadan.", en: "By evening, the tray's half empty. The foreman chalks the shell count on the board and underlines it twice. \"You can explain that to the fleet,\" he says, without looking at you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kendi yüzüğünü tepsiye bırak", en: "Drop your own ring on the tray" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_sn_kazan_birak"
        yer: "sanayi"
        paragraflar:
          - { tr: "Kadına toplara mermi gerektiğini söylüyorsun. Kadın sana uzun uzun bakıyor, sonra hiçbir şey demeden tepsiye uzanıp yüzüğü bir kez okşuyor; o kadar.", en: "You tell the woman the guns need shells. She gives you a long look, then without a word reaches out to the tray and touches the ring once. That's all." }
          - { tr: "Usta tepsiyi kazana boşaltıyor. Pirinç bir an parlayıp kaynayan yüzeye karışıyor. Kadın gidiyor; kapıda durup bir kez dönüyor, ama kazana değil sana bakıyor.", en: "The foreman dumps the tray into the crucible. The brass flashes for a second and sinks into the boiling surface. The woman leaves. At the door she stops and turns around once, but she's looking at you, not the crucible." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Dökümhaneden çık", en: "Leave the foundry" }
            etkiler:
              - xp_seviye: 8
            sonraki: "@akis"

  # ================================================================== DENEME ATIŞI (Kordon · tohum)
  - id: "bl15_kr_atis"
    konum: ["kordon"]
    perde: [3]
    yalniz_tohum: true
    kosul: { bolum: 15, bayrak: "bl15_sn_adlar" }
    etiketler: ["lonca", "filo"]
    gerilim: 3
    kart: { tr: "Deneme atışı", en: "Test fire" }
    sahne: "bl15_kr_atis_1"
    sahneler:
      - id: "bl15_kr_atis_1"
        yer: "kordon"
        paragraflar:
          - metin: { tr: "Akşamüstü {yer:kordon} boyunca fenerler yeniden yanıyor. Bir zamanlar düşmüş olan sahil şimdi şehrin ilk savunma hattı; kafelerin yerinde kum torbaları, banklarda nöbetçiler var.", en: "Late in the afternoon, the lanterns along {yer:kordon} are lit again. A shoreline that fell once is now the city's first line of defense, with sandbags where the cafés used to be and sentries on the benches." }
            kosul: { bayrak: "p3_kordon_geri_alindi" }
          - metin: { tr: "Akşamüstü {yer:kordon|in} yıkıntıları arasından ilerliyorsun. Molozların arasında temizlenmiş tek bir düzlük var: Topçular onu kum torbalarıyla çevirmiş.", en: "Late in the afternoon, you pick your way through the wreckage of {yer:kordon}. There's one cleared flat spot in the rubble, and the gunners have ringed it with sandbags." }
            kosul: { bayrak_yok: "p3_kordon_geri_alindi" }
          - { tr: "Lonca'nın topçuları sahile hafif bir sahra topu kurmuş. Yanındaki sandıkta haddehaneden gelen ilk mermiler duruyor; gövdelerine adlar kazınmış. En üsttekinde yüzüğünü kazana veren kadının kocasının adı yazılı. Kadın da burada, kum torbalarının ardında.", en: "The Guild's gunners have set up a light field gun on the beach. In the crate beside it are the first shells from the rolling mill, names engraved on their bodies. The one on top has the name of the husband whose ring went into the crucible. His widow's here too, behind the sandbags." }
          - { tr: "Topçubaşı namluyu ağır ağır körfezin üstündeki ters kuleye, elçi gemisine çeviriyor. \"Denize atmak boşa mermi harcamak,\" diyor. \"Gemiyi vurursak hem mermiyi sınarız hem de o ışığı bir an keseriz. Konsey yasakladı. Karar sizin.\"", en: "The gun chief slowly swings the barrel toward the upside-down tower over the bay, the envoy ship. \"Firing into the water's a waste of a shell,\" he says. \"Hit the ship, and we test the shell and cut that beam for a second. The Council said no. Your call.\"" }
          - metin: { tr: "Filo zaten göründü. Kışkırtacak bir şey kalmadığını söyleyenler de var; filonun bu gece ilk kez bir gerekçe arayacağını söyleyenler de.", en: "The fleet's already in sight. Some people say there's nothing left to provoke. Others say that tonight the fleet's going to start looking for an excuse." }
            kosul: { gun_min: 321 }
          - metin: { tr: "{npc:mert_kilic|in} çözdüğü sayıyı hatırlıyorsun: O ışık her gece filoya kalan stoku bildiriyor. Bir an bile kesilse, bir gecelik sayım eksik kalır.", en: "You remember the number {npc:mert_kilic} cracked. That beam reports the remaining stock to the fleet every night. Cut it even for a second, and one night's count comes up short." }
            kosul: { bayrak: "bl15_mert_sayi_cozuldu" }
        sezgiler:
          - kosul: { stat: { per: 220 } }
            metin: { tr: "Gemi menzilin tam sınırında. Rüzgâr batıdan; topçubaşı bunu hesaba katmamış. İki derece sola alırsa vurur.", en: "The ship's right at the edge of the shell's range. Wind's out of the west, and the gun chief hasn't figured that in. Two degrees left and it hits." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "gemiyi vurursan seni görecek. zaten görüyor. ama artık seni hatırlayacak.", en: "hit the ship and it sees you. it already does. but now it'll remember you." }
        yoldas_tepkileri:
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Konsey bunu yasakladı, çünkü ben yasakladım. Bir mermi için kırk sekiz gemiyi kışkırtmaya değmez.\"", en: "\"The Council said no because I said no. One shell isn't worth provoking forty-eight ships.\"" }
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Vur. Bir kere de onlar bizden korksun.\"", en: "\"Fire. For once, let them be scared of us.\"" }
        secenekler:
          - id: "gemi"
            etiket: { tr: "\"İki derece sola al. Gemiyi vur.\"", en: "\"Two degrees left. Hit the ship.\"" }
            gerekli: { stat: { per: 220 } }
            etkiler:
              - dikkat: 4
              - ahlak: { duzen: -2 }
              - itibar: { lonca: 3, siginak: -2 }
              - iliski: { kaya_demir: { saygi: 3 }, elif_sari: { guven: -3 } }
              - tehlike: { kordon: 4 }
              - bayrak: "bl15_kr_elci_vuruldu"
            sonraki: "bl15_kr_atis_gemi"
          - id: "deniz"
            etiket: { tr: "\"Denize atın. Bu yalnızca bir deneme.\"", en: "\"Fire into the water. This is just a test.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { elif_sari: { guven: 2 } }
              - bayrak: "bl15_kr_denize"
            sonraki: "bl15_kr_atis_deniz"
          - id: "kadin"
            etiket: { tr: "Mermiyi kadına ver; o mermi filo günü atılsın", en: "Give the shell to the widow. That one gets fired on fleet day" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - iliski: { kaya_demir: { saygi: -1 } }
              - bayrak: "bl15_kr_mermi_kadinda"
            sonraki: "bl15_kr_atis_kadin"

      - id: "bl15_kr_atis_gemi"
        yer: "kordon"
        paragraflar:
          - { tr: "Top patlıyor; sahil boyunca camlar zangırdıyor. Mermi körfezin üstünde uzun bir yay çizip ters kulenin gövdesine çarpıyor. Ayın yanına uzanan ışık bir, iki, üç saniye sönüp eskisinden kalın yanıyor.", en: "The gun goes off, and windows rattle the length of the shore. The shell draws a long arc over the bay and slams into the body of the upside-down tower. The beam running up to the moon goes out. One, two, three seconds. Then it comes back on, thicker than before." }
          - { tr: "Hemen ardından gemiden körfeze ince bir ışık iniyor ve sahili baştan sona tarıyor; kum torbalarının, topun, senin üstünden geçiyor. Kimse kıpırdamıyor. Işık çekilince kadın kum torbasının ardından doğruluyor. \"Gördü mü onu?\" diye soruyor. \"Adını gördü mü?\"", en: "Right after, a thin light comes down from the ship onto the bay and sweeps the shore end to end, passing over the sandbags, the gun, and you. Nobody moves. When the light pulls back, the widow stands up from behind the sandbags. \"Did it see him?\" she asks. \"Did it see his name?\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Gördü.\"", en: "\"It saw.\"" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl15_kr_atis_deniz"
        yer: "kordon"
        paragraflar:
          - { tr: "Topçubaşı dudak büküyor ama namluyu suya indiriyor. Top patlıyor; mermi körfezin ortasına düşüp beyaz bir su sütunu kaldırıyor. Sütun, ters kulenin ışığında bir an gümüşe kesiyor.", en: "The gun chief makes a face, but he drops the barrel toward the water. The gun goes off, and the shell lands in the middle of the bay, throwing up a white column of water. For a second, in the upside-down tower's light, the column turns silver." }
          - { tr: "\"Çalışıyor,\" diyor topçubaşı, isteksizce. Kadın kum torbasının ardından suya bakıyor; kocasının adı körfezin dibinde. \"Denizi severdi,\" diyor. \"İyi oldu.\"", en: "\"It works,\" the gun chief says, grudgingly. The widow looks at the water from behind the sandbags. Her husband's name is on the bottom of the bay now. \"He loved the sea,\" she says. \"That's good.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Su durulana kadar bekle", en: "Wait until the water settles" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_kr_atis_kadin"
        yer: "kordon"
        paragraflar:
          - { tr: "Adı kazınmış mermiyi sandıktan alıp kadının kucağına bırakıyorsun. Ağır; kadın onu bir bebek tutar gibi iki koluyla sarıyor.", en: "You lift the shell with the engraved name out of the crate and set it in the widow's arms. It's heavy. She wraps both arms around it like she's holding a baby." }
          - { tr: "\"Filo günü bunu ben dolduracağım,\" diyor topçubaşına. Topçubaşı itiraz edecek oluyor, sonra omuz silkiyor. Deneme atışı bir sonraki mermiyle yapılıyor; o da denize düşüyor ve kimse adını sormuyor.", en: "\"On fleet day, I'm the one loading this,\" she tells the gun chief. He starts to argue, then shrugs. They run the test with the next shell. It lands in the water too, and nobody asks whose name was on it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kadını eve kadar götür", en: "Walk the widow home" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== BOŞ SALON (Yedi Taht)
  - id: "bl15_yt_haberci"
    konum: ["yedi_taht"]
    perde: [3]
    gun: { min: 306, max: 319 }
    kosul: { bolum: 15, bayrak: "yedi_taht_davet" }
    agirlik: 5
    etiketler: ["kesif", "kadimler", "taht", "filo"]
    gerilim: 3
    kart: { tr: "Boş salon", en: "The empty hall" }
    sahne: "bl15_yt_haberci_1"
    sahneler:
      - id: "bl15_yt_haberci_1"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Koridorun duvarlarındaki yedi gölge silinmiş. Kabul Salonu'nun kapıları ardına kadar açık; içeride ne muhafız var ne müzik. Tahtların üstüne beyaz örtüler serilmiş, kenarlarına toz birikmeye başlamış. {yer:yedi_taht} filoyla birlikte yola çıkmış.", en: "The seven shadows on the hallway walls are gone. The doors to the Audience Hall stand wide open, and inside there are no guards and no music. White dust covers have been thrown over the thrones, and dust is starting to collect at the edges. {yer:yedi_taht|b} sailed with the fleet." }
          - { tr: "Salonda yalnız hizmetkârlar kalmış; başka başka dünyalardan toplanmış, boyunlarında ince pirinç halkalar. Halıları rulo yapıp kandilleri söndürüyorlar, kimseyle göz göze gelmeden.", en: "Only the servants are left in the hall, gathered up from one world after another, thin brass rings around their necks. They roll up the carpets and put out the lamps without meeting anyone's eyes." }
          - { tr: "Salonun ortasında, kadife bir yastığın arkasında yaşlı bir Kadim haberci dimdik duruyor. Yastığın üstünde altın işlemeli bir tomar var. \"Dünya Katmanı'nın temsilcisi,\" diyor sana eğilerek. \"Hükmü teslim almanız için dokuz gündür bekliyorum. Usul böyledir.\"", en: "In the middle of the hall, behind a velvet cushion, an old Ancient herald stands bolt upright. On the cushion is a scroll worked in gold. \"Representative of the Earth Layer,\" he says, bowing to you. \"I have waited nine days for you to receive the decree. That is protocol.\"" }
          - metin: { tr: "Yedinci koltuğun örtüsünün kenarından adın görünüyor; altın iplikle işlenmiş. Gidenler onu sökmeye zahmet etmemiş.", en: "Your name shows at the edge of the seventh chair's dust cover, embroidered in gold thread. Whoever left didn't bother picking it out." }
            kosul: { bayrak: "taht_koltuga_oturdu" }
          - metin: { tr: "Varisin tahtı siyah bir kumaşla kaplanmış. Kadimler yaslarını da usulle tutuyor.", en: "The Heir's throne is draped in black. The Ancients mourn by protocol too." }
            kosul: { bayrak: "ossiran_olduruldu" }
          - metin: { tr: "Varisin tahtı boş ve örtüsüz. Bağışladığın Kadim filoyla gitmiş; tahtının kolunda, tırnakla kazınmış tek bir çizgi bırakmış.", en: "The Heir's throne is empty and uncovered. The Ancient you spared left with the fleet. On the arm of his throne he left a single line, scratched in with a nail." }
            kosul: { bayrak: "ossiran_bagislandi" }
          - metin: { tr: "Haberci tomarı uzatırken ekliyor: \"Varis {npc:ossiran}, Dünya'yı kendi hasat listesine yazdırdı. Hüküm de buna göre kaleme alınmıştır.\"", en: "As he holds out the scroll, the herald adds, \"Heir {npc:ossiran} had Earth entered on his own harvest list. The decree has been drafted accordingly.\"" }
            kosul: { herhangi: [{ bayrak: "varis_yenilgisi" }, { bayrak: "varis_duellosu_reddedildi" }] }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Haberci yaşlı ve yalnız. Ona verilen son görev bu; tomarı teslim edince burada kalacak, salonla birlikte unutulacak.", en: "The herald is old and alone. This is the last job they gave him. Once he hands off the scroll, he stays here, forgotten along with the hall." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "salon hâlâ konuşuyor. duvarlar son tartışmayı hatırlıyor. dinlemek ister misin?", en: "the hall's still talking. the walls remember the last argument. want to listen?" }
        yoldas_tepkileri:
          - npc: "aras_kurt"
            kosul: { yoldas: "aras_kurt" }
            metin: { tr: "\"Saraylarını boş bırakıp savaşa gitmişler. Ya çok eminler ya da geri dönmeyi hiç düşünmüyorlar.\"", en: "\"They left their palace empty and went to war. Either they're real sure of themselves or they're not planning on coming back.\"" }
        secenekler:
          - id: "al"
            etiket: { tr: "Hükmü teslim al; {yer:kiyikent|e} götür", en: "Accept the decree. Take it to {yer:kiyikent}" }
            etkiler:
              - ahlak: { duzen: 1 }
              - bayrak: "bl15_yt_ilan_alindi"
              - tohum: { olay: "bl15_us_ilan", gecikme: { min: 1, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "{yer:yedi_taht|den} getirdiğin tomarın şehre geldiği duyuldu; Konsey seni bekliyor.", en: "Word's out that the scroll you brought back from {yer:yedi_taht} is in the city. The Council's waiting for you." } }
            sonraki: "bl15_yt_haberci_al"
          - id: "cevap"
            etiket: { tr: "Tomarın arkasına cevabını yaz, bir kopyasını al", en: "Write your answer on the back. Take a copy" }
            gerekli: { stat: { wil: 230 } }
            etkiler:
              - dikkat: 3
              - ahlak: { insanlik: 2 }
              - bayrak: "bl15_yt_cevap"
              - bayrak: "bl15_yt_ilan_alindi"
              - tohum: { olay: "bl15_us_ilan", gecikme: { min: 1, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "{yer:yedi_taht|den} getirdiğin tomarın şehre geldiği duyuldu; Konsey seni bekliyor.", en: "Word's out that the scroll you brought back from {yer:yedi_taht} is in the city. The Council's waiting for you." } }
            sonraki: "bl15_yt_haberci_cevap"
          - id: "dinle"
            etiket: { tr: "{npc:yanki|e} salonu dinlet", en: "Have {npc:yanki} listen to the hall" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - iliski: { yanki: { guven: 3, baglilik: 2 } }
              - bayrak: "bl15_yt_yanki_dinledi"
            sonraki: "bl15_yt_haberci_dinle"
          - id: "yirt"
            etiket: { tr: "Tomarı habercinin önünde yırt", en: "Tear up the scroll in front of the herald" }
            etkiler:
              - ahlak: { duzen: -1 }
              - dikkat: 2
              - itibar: { kadimler: -2 }
              - bayrak: "bl15_yt_yirtildi"
              - bayrak: "bl15_yt_ilan_alindi"
              - tohum: { olay: "bl15_us_ilan", gecikme: { min: 1, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "Habercinin verdiği ikinci kopyanın şehre geldiği duyuldu; Konsey seni bekliyor.", en: "Word's out that the second copy the herald gave you is in the city. The Council's waiting for you." } }
            sonraki: "bl15_yt_haberci_yirt"

      - id: "bl15_yt_haberci_al"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Tomarı yastığın üstünden alıyorsun. Haberci bir kez eğilip doğruluyor; omuzlarından ağır bir yük kalkmış gibi.", en: "You take the scroll off the cushion. The herald bows once and straightens up, like something heavy just came off his shoulders." }
          - { tr: "\"Görevim bitti,\" diyor. Sonra yastığı koltuğunun altına alıp boş tahtların arasına yürüyor; örtülerden birinin kenarına ilişip oturuyor. Salondan çıkarken dönüp bakıyorsun. Kıpırdamıyor.", en: "\"My task is complete,\" he says. Then he tucks the cushion under his arm, walks off between the empty thrones, and sits down on the edge of one of the dust covers. When you leave the hall, you look back. He isn't moving." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Koridordan çık", en: "Walk out down the hallway" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_yt_haberci_cevap"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Habercinin kalemini isteyip tomarın arkasına kendi dilinde birkaç satır yazıyorsun. Ne yazdığını Sistem çevirmiyor; çevirmesine gerek yok. Haberci satırları okuyup ilk kez yüzünü buruşturuyor.", en: "You ask the herald for his pen and write a few lines on the back of the scroll in your own language. The System doesn't translate what you wrote. It doesn't need to. The herald reads the lines, and for the first time, his face twists." }
          - { tr: "\"Usule uygun değil,\" diyor. \"Ama cevap verilmiş bir hüküm, usulen sahibine iletilir.\" Bir kopya çıkarıp sana uzatıyor, aslını kendi koynuna sokuyor. Salonda ilk kez birinin aceleyle yürüdüğünü görüyorsun.", en: "\"This is not in accordance with protocol,\" he says. \"But a decree that has been answered must, by protocol, be forwarded to its owner.\" He makes a copy and hands it to you, and tucks the original inside his robe. It's the first time you've seen anyone in this hall walk fast." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kopyayı al, salondan çık", en: "Take the copy and leave the hall" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl15_yt_haberci_dinle"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Gözlerini kapatıyorsun. {npc:yanki} salonun taşlarına sızıp bir süre susuyor, sonra fısıldıyor: yedi ses. altısı aynı şeyi söylüyor: git. biri susuyor. en son o konuşuyor. tek bir soru soruyor: ya bu kez biz hasat edilirsek?", en: "You close your eyes. {npc:yanki} seeps into the stones of the hall and is quiet for a while, then whispers: seven voices. six of them say the same thing: go. one stays quiet. it speaks last. it asks one question: what if this time we're the ones who get harvested?" }
          - { tr: "{npc:yanki} kısa bir süre daha dinliyor. kimse cevap vermemiş. sonra gemiler kalkmış.", en: "{npc:yanki} listens a little longer. nobody answered. then the ships lifted off." }
          - { tr: "Gözlerini açtığında haberci hâlâ yastığı uzatıyor. Tomarı alıyorsun; ama kulağında o yedinci sesin sorusu kalıyor.", en: "When you open your eyes, the herald is still holding out the cushion. You take the scroll. But that seventh voice's question stays in your ear." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Tomarı al, {yer:kiyikent|e} dön", en: "Take the scroll. Head back to {yer:kiyikent}" }
            etkiler:
              - xp_seviye: 12
              - bayrak: "bl15_yt_ilan_alindi"
              - tohum: { olay: "bl15_us_ilan", gecikme: { min: 1, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "{yer:yedi_taht|den} getirdiğin tomarın şehre geldiği duyuldu; Konsey seni bekliyor.", en: "Word's out that the scroll you brought back from {yer:yedi_taht} is in the city. The Council's waiting for you." } }
            sonraki: "@akis"

      - id: "bl15_yt_haberci_yirt"
        yer: "yedi_taht"
        paragraflar:
          - { tr: "Tomarı ikiye, sonra dörde yırtıp parçaları habercinin ayaklarının dibine bırakıyorsun. Haberci parçalara bakıyor; yüzünde ne öfke var ne şaşkınlık.", en: "You tear the scroll in half, then in quarters, and drop the pieces at the herald's feet. He looks down at them. There's no anger in his face, and no surprise." }
          - { tr: "Cüppesinin içinden ikinci bir tomar çıkarıp yastığın üstüne koyuyor. \"Yedi kopya yazıldı,\" diyor sakin sakin. \"Usul böyledir. Altısı daha var.\" Bu kez tomarı almaktan başka çaren kalmıyor.", en: "He pulls a second scroll out of his robe and sets it on the cushion. \"Seven copies were written,\" he says calmly. \"That is protocol. There are six more.\" This time you've got no choice but to take it." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "İkinci kopyayı koynuna sok", en: "Shove the second copy in your jacket" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

  # ================================================================== ÖLMEDEN ÖNCE ÇALAN ÇAN (Batık Takımada)
  - id: "bl15_bt_can"
    konum: ["batik_takimada"]
    perde: [3]
    gun: { min: 306, max: 319 }
    kosul: { bolum: 15, bayrak: "cok_evren_acik" }
    agirlik: 5
    etiketler: ["kesif", "nehha", "filo"]
    gerilim: 2
    kart: { tr: "Ölmeden çalan çan", en: "The bell before the end" }
    sahne: "bl15_bt_can_1"
    sahneler:
      - id: "bl15_bt_can_1"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{yer:batik_takimada|in} gökyüzünde de aynı ışıklar var. Bu gece kırk sekiz soluk nokta, yıldızların arasından ağır ağır kayıyor. Hasat gemileri her dünyaya giderken Ilunnar'ın göğünden geçermiş; Nehhalar onları iki yüz on iki yıldır sayıyor.", en: "The same lights are in the sky over {yer:batik_takimada}. Tonight, forty-eight pale dots are sliding slowly through the stars. The Harvest ships pass through Ilunnar's sky on the way to every world. The Nehha have been counting them for two hundred and twelve years." }
          - { tr: "Salların arasındaki eski çan kulesi suyun altında; yalnız tepesi dalgaların üstünde kalmış. Yaşlı Nehhalar kuleye bir halat bağlamış, aşağıdaki çanın tokmağına uzatıyor. \"Bir dünya için çalacağız,\" diyor içlerinden biri. \"Seninki için.\"", en: "The old bell tower between the rafts is underwater. Only the top sticks out above the waves. The elder Nehha have tied a rope to the tower and run it down to the clapper of the bell below. \"We're going to ring it for a world,\" one of them says. \"For yours.\"" }
          - { tr: "Âdetleri böyleymiş: Hasat bir dünyaya inmeden önce çalarlar ve o dünyanın yaşayanlarının adlarını okurlar. Sonradan çalmanın anlamı yok. Sonra adları duyacak kimse kalmaz.", en: "That's their custom. Before the Harvest comes down on a world, they ring the bell and read the names of that world's living. Ringing it afterward is pointless. Afterward, there's nobody left to hear the names." }
          - metin: { tr: "\"Fenerdeki otuz yedi çocuk senin dünyanda,\" diye ekliyor yaşlı Nehha. \"Önce onların adlarını okuyacağız. Sonra seninkileri. Bize adlarını ver.\"", en: "\"The thirty-seven children from the Lighthouse are on your world,\" the elder adds. \"We'll read their names first. Then yours. Give us your names.\"" }
            kosul: { bayrak: "batik_cocuklar_dunyada" }
          - metin: { tr: "Kesh zıpkınına yaslanmış, kaşlarını çatmış. \"Erken,\" diyor. \"Biz yemin ettik. Yemin ettiğin bir dünya için çan çalınmaz.\"", en: "Kesh is leaning on his harpoon, frowning. \"Too early,\" he says. \"We swore an oath. You don't ring the bell for a world you've sworn to.\"" }
            kosul: { bayrak: "nehha_yemini" }
          - metin: { tr: "Nehhalar sana Dönen diye sesleniyor hâlâ. Bir tanrının dünyası için çan çalmak, onlar için hem korkunç hem kutsal.", en: "The Nehha still call you the Returner. Ringing the bell for a god's world is both terrible and holy to them." }
            kosul: { bayrak: "batik_tanri_sanildi" }
        sezgiler:
          - kosul: { stat: { wis: 220 } }
            metin: { tr: "Çanın dış yüzüne kazınmış satırlar var; her biri hasat edilmiş bir dünyanın adı. En alttaki satır boş bırakılmış, hemen üstünde Ilunnar'ın satırı var. Okumak için dalman gerek.", en: "There are lines carved around the outside of the bell, each one the name of a harvested world. The bottom line's been left blank, with Ilunnar's line right above it. You'd have to dive to read it." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "adlarını ölmeden duymak. ben hiç duymadım. kimse benim için çalmadı. bırak çalsınlar.", en: "hearing your name before you die. i never did. nobody rang for me. let them ring." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Vapurda yolcu listesini okurlardı. Hep sıkıcı gelirdi. Şimdi neden okuduklarını anlıyorum.\"", en: "\"On the ferry they used to read the passenger list. I always thought it was boring. Now I get why they did it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"İki yüz on iki yıllık gözlem verisi. Hangi dünyaya ne zaman gittiklerini biliyorlar. Bunu kaydetmem lazım.\"", en: "\"Two hundred and twelve years of observation data. They know which world the ships went to and when. I need to log this.\"" }
        secenekler:
          - id: "adlar"
            etiket: { tr: "Çalsınlar. Adları sen söyle", en: "Let them ring it. You give them the names" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - bayrak: "bl15_bt_adlar"
              - tohum: { olay: "bl15_us_mektuplar", gecikme: { min: 2, max: 3 }, kosul: { bolum: 15, gun_max: 330 }, hatirlatma: { tr: "Nehhaların çanını anlattığından beri {yer:kiyikent_liman|de} insanlar sevdiklerinin adlarını yüksek sesle okumaya başladı.", en: "Ever since you told people about the Nehha bell, folks on {yer:kiyikent_liman} have started reading their loved ones' names out loud." } }
            sonraki: "bl15_bt_can_adlar"
          - id: "dur"
            etiket: { tr: "\"Durun. Benim dünyam henüz ölmedi.\"", en: "\"Stop. My world isn't dead yet.\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - tehlike: { batik_takimada: -2 }
              - bayrak: "bl15_bt_sustu"
            sonraki: "bl15_bt_can_dur"
          - id: "yazit"
            etiket: { tr: "Dal; çanın üstündeki satırları oku", en: "Dive. Read the lines on the bell" }
            gerekli: { stat: { wis: 220 } }
            etkiler:
              - bayrak: "bl15_bt_yazit"
            sonraki: "bl15_bt_can_yazit"
          - id: "deniz"
            etiket: { tr: "İlk adı {npc:deniz_arman} söylesin", en: "Let {npc:deniz_arman} say the first name" }
            goster: { yoldas: "deniz_arman" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 3 } }
              - bayrak: "bl15_bt_deniz"
            sonraki: "bl15_bt_can_deniz"

      - id: "bl15_bt_can_adlar"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Halat çekiliyor; dalgaların altından boğuk, ağır bir ses yükseliyor, sanki deniz kendi içinde bir şey hatırlamış. Yaşlı Nehha başını sana çeviriyor.", en: "They pull the rope, and a deep, muffled sound rises from under the waves, like the sea just remembered something inside itself. The elder Nehha turns to you." }
          - { tr: "Adları söylüyorsun. Önce yanında savaşanların, sonra {yer:kiyikent_liman|de} tanıdıkların, sonra adını bildiğin her çocuğun... Her addan sonra çan bir kez daha çalıyor; bitirdiğinde sesin kısılmış, ay alçalmış. Nehhalar adları kendi dillerinde tekrar ediyor, bir kısmını yanlış söylüyorlar, ama hiçbirini atlamıyorlar.", en: "You say the names. First the people who fought beside you, then the ones you know on {yer:kiyikent_liman}, then every kid whose name you know. After each one, the bell rings again. By the time you're done, your voice is gone and the moon is low. The Nehha repeat the names in their own language. They get some of them wrong, but they don't skip a single one." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sesinin kalanıyla teşekkür et", en: "Thank them with what's left of your voice" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"

      - id: "bl15_bt_can_dur"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Yaşlı Nehha halatı bırakıyor. Uzun uzun yüzüne bakıyor, sonra başını eğiyor. \"Ilunnar'da da biri böyle demişti,\" diyor. \"Henüz ölmedik. Haklıydı da. Ertesi sabaha kadar.\"", en: "The elder Nehha lets go of the rope. She looks at your face for a long time, then bows her head. \"Someone on Ilunnar said that too,\" she says. \"We're not dead yet. And they were right. Until the next morning.\"" }
          - { tr: "Yine de çanı çalmıyorlar. Halatı kuleye sarıp bir düğüm atıyorlar; Nehha dilinde sözdür bu. \"Çözmeye gelirsen çalarız,\" diyor yaşlı kadın. \"Kutlamak için. Gelmezsen biz çözeriz.\"", en: "They don't ring it, though. They coil the rope around the tower and tie a knot. In the Nehha language, that's a promise. \"If you come back to untie it, we'll ring it,\" the old woman says. \"To celebrate. If you don't, we'll untie it ourselves.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Düğüme dokun", en: "Touch the knot" }
            etkiler:
              - xp_seviye: 10
            sonraki: "@akis"

      - id: "bl15_bt_can_yazit"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "Halatı izleyerek çanın yanına dalıyorsun. Satırlar yosun tutmuş, ama Sistem birer birer çeviriyor: yüzlerce dünyanın adı, her birinin yanında tek bir not. Ilunnar'ın satırına geldiğinde not şöyle: [Önce gökyüzü sarardı. Sonra gemiler indi.]", en: "You follow the rope down and dive alongside the bell. The lines are furred with algae, but the System translates them one at a time. Hundreds of world names, each with a single note next to it. When you get to Ilunnar's line, the note says: [First the sky turned yellow. Then the ships came down.]" }
          - { tr: "Altındaki satır boş. Yüzeye çıktığında yaşlı Nehha seni bekliyor. \"Gördün mü?\" diye soruyor. \"Gökyüzünüz sararınca vakit kalmamış demektir. O gün adları okumak için de geç olur.\"", en: "The line below it is blank. When you surface, the elder Nehha is waiting for you. \"Did you see?\" she asks. \"When your sky turns yellow, there's no time left. By that day, it's too late even to read the names.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Salın kenarına çık", en: "Climb up onto the raft" }
            etkiler:
              - xp_seviye: 14
            sonraki: "@akis"

      - id: "bl15_bt_can_deniz"
        yer: "batik_takimada"
        paragraflar:
          - { tr: "{npc:deniz_arman} halatın başına geçip bir süre suya bakıyor. Sonra kardeşinin adını söylüyor, yüksek sesle. Çan, dalgaların altından ilk kez onun için çalıyor.", en: "{npc:deniz_arman} steps up to the rope and looks at the water for a while. Then {zamir:deniz_arman|o} say{zamir:deniz_arman|s} {zamir:deniz_arman|onun} sister's name, out loud. For the first time, the bell rings under the waves for her." }
          - metin: { tr: "\"Yaşıyor,\" diyor {npc:deniz_arman}, Nehhalara dönüp. \"Onu bulduk. Adı yaşayanların arasında okunsun istedim.\"", en: "\"She's alive,\" {npc:deniz_arman} says, turning to the Nehha. \"We found her. I wanted her name read with the living.\"" }
            kosul: { bayrak: "deniz_kardes_bulundu" }
          - metin: { tr: "\"Yaşıyor mu bilmiyorum,\" diyor {npc:deniz_arman}, sesi titreyerek. \"Ama yaşıyorsa adını duysun istedim. Ölmeden.\"", en: "\"I don't know if she's alive,\" {npc:deniz_arman} says, voice shaking. \"But if she is, I wanted her to hear her name. Before.\"" }
            kosul: { bayrak_yok: "deniz_kardes_bulundu" }
          - { tr: "Sonra {npc:deniz_arman} sana dönüyor ve senin adını söylüyor. Çan bir kez daha çalıyor. Başka bir şey demiyor; demesine de gerek yok.", en: "Then {npc:deniz_arman} turns to you and says your name. The bell rings once more. {zamir:deniz_arman|o|b} {zamir:deniz_arman|does}n't say anything else. {zamir:deniz_arman|o|b} {zamir:deniz_arman|does}n't need to." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sen de onun adını söyle", en: "Say their name back" }
            etkiler:
              - xp_seviye: 12
            sonraki: "@akis"
