# Parti A — Perde 2 ana yay (docs/PERDE2_4.md). Gün 31–180: Entegre Dünya.
# Ana düğümler: Dönüş (31) · Kule (40) · fraksiyon seçimi (45) · Kasaba Çekirdeği (60) · ilk kapı taşması (80) ·
# Yankı'nın ortaya çıkışı (105) · Sistem gerçeğinin ilk parçası (135) · Kadim gemisi (178).
# Dikkat eşikleri (motor tohumlar): dikkat_50_p2, dikkat_75_p2, dikkat_100_p2.
# Yalnızca tohumla gelen takip olayları: kayip_duvari_cevap, kule_donmeyenler, secimin_gecesi, tasma_sonrasi,
# iki_sesli_sokak, baslik_gecesi, gemi_altinda_gece.
# Sistem gerçeği (gercek_hasat / gercek_kurtarma) Perde 2'nin birikimini okur: insanlık ≥ 10 ya da hayatta kalan ≥ 50 → kurtarma.
olaylar:
  # ================================================================== DÖNÜŞ (ana yay 31)
  - id: "perde2_donus"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "donus"]
    gerilim: 3
    ana_yay: { gun: 31 }
    onemli: true
    kart: { tr: "Eve dönüş", en: "Homecoming" }
    sahne: "donus_1"
    sahneler:
      - id: "donus_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Işık seni bir kez daha yutuyor ve bu kez tükürdüğü yer tanıdık: {yer:kiyikent_iskele}. Ayağının altında ıslak tahta, burnunda mazot ve yosun; otuz gün önce her sabah bindiğin vapur, iskelenin yanında yan yatmış, karnını gökyüzüne vermiş.", en: "The light swallows you one more time, and this time it spits you out somewhere you know: the {yer:kiyikent_iskele}. Wet planks under your feet, diesel and kelp in your nose. The ferry you rode every single morning thirty days ago is lying on its side against the dock, belly to the sky." }
          - { tr: "Gökyüzünde mavi paneller hâlâ asılı; bazıları bir apartman kadar büyük ve hepsi aynı satırı yazıyor. Körfezin karşısında, eskiden {yer:kordon|in} ışıklarının yandığı yerde bir kapı dönüyor; deniz onun çevresinde ters akıyor.", en: "The blue panels are still hanging in the sky, some as big as apartment buildings, all of them showing the same line. Across the bay, where the lights of {yer:kordon} used to come on at dusk, a Gate is turning, and the sea runs backward around it." }
          - metin: { tr: "Senden önce gelenler bir avuç. İskele neredeyse boş; ışıktan çıkan her yeni yüz, yalnızca kendisi kadar bir umut getiriyor.", en: "The ones who made it through ahead of you are a handful. The terminal's practically empty, and every new face stepping out of the light brings exactly one person's worth of hope." }
            kosul: { degisken_max: { hayatta_kalan: 35 } }
          - metin: { tr: "İskele kalabalık ama sessiz. İnsanlar ışıktan çıkıyor, bir an durup şehre bakıyor ve sonra, hepsi aynı anda, birini aramaya başlıyor.", en: "The terminal's crowded, but quiet. People step out of the light, stop to stare at the city for a second, and then, all at once, start looking for somebody." }
            kosul: { degisken_min: { hayatta_kalan: 36 }, degisken_max: { hayatta_kalan: 64 } }
          - metin: { tr: "İskele bayram sabahı gibi kalabalık. Birileri ağlıyor, birileri isim bağırıyor; bir köşede biri, inanamadığı için gülmeye başlıyor. Öğreticiden bu kadar insan çıkmayacaktı; çıktı.", en: "The terminal is packed like the Fourth of July. People are crying, shouting names; in a corner somebody starts laughing because they can't believe it. This many people weren't supposed to make it out of the tutorial. They did." }
            kosul: { degisken_min: { hayatta_kalan: 65 } }
          - metin: { tr: "{npc:deniz_arman} yanında, gözleri vapurda. \"Yedi kırk vapuru,\" diyor, sesi çatlak. \"Her gün. Simitçi hep şurada dururdu.\"", en: "{npc:deniz_arman} is right next to you, eyes on the ferry. \"Seven-forty boat,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice cracking. \"Every single day. The pretzel cart always parked right there.\"" }
            kosul: { yoldas: "deniz_arman" }
          - { tr: "Işık her açıldığında birkaç kişiyi iskeleye değil, iskelenin ucundan suya bırakıyor. Biri çırpınıyor. Su, altında bir şey kımıldamış gibi bir an kabarıyor.", en: "Every time the light opens, it drops a few people off the end of the pier instead of onto it. Somebody's thrashing out there. The water swells for a second, like something big just shifted underneath." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[ENTEGRE DÜNYA]", en: "[INTEGRATED WORLD]" }
            satirlar:
              - { tr: "Katman değerlendirmesi sürüyor. Kalan süre: 334 gün.", en: "Layer assessment in progress. Time remaining: 334 days." }
              - { tr: "Bölge: {yer:kiyikent}. Kontrol: dağınık. Tavsiye: dağınık olmayın.", en: "Region: {yer:kiyikent}. Control: fragmented. Recommendation: don't be." }
          - tur: "uyari"
            baslik: { tr: "[KAPI UYARISI]", en: "[GATE WARNING]" }
            satirlar:
              - { tr: "{yer:kordon} · kapı kademesi D · taşmaya 49 gün.", en: "The Esplanade · Gate grade D · 49 days to overflow." }
              - { tr: "Kapatılmayan kapılar taşar. Bu bir hatırlatmadır.", en: "Gates that stay open overflow. This is a courtesy reminder." }
        sezgiler:
          - kosul: { stat: { per: 22 } }
            metin: { tr: "İskelenin dibinde, batık teknelerin arasında uzun bir şey kıvrılıyor. Aç değil; sabırlı. Işıktan düşenleri sayıyor.", en: "Down under the pier, between the sunken hulls, something long is coiled up. It isn't hungry. It's patient. It's counting the ones the light drops." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "evdesin. ev değişmiş. sen de değiştin; ama ev bunu henüz bilmiyor.", en: "you're home. home changed. so did you. home just doesn't know it yet." }
          - kosul: { iz: "yanki_damari" }
            metin: { tr: "Bileğindeki mavi damar suyun altındaki şeyle aynı ritimde atıyor. Hoşuna gitmiyor; sana da.", en: "The blue vein in your wrist is pulsing in time with the thing under the water. It doesn't like that. Neither do you." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Suda biri var! Hadi, hadi!\"", en: "\"Somebody's in the water! Come on, come on!\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sen çıkar, ben bakarım. Konuşmayı sonraya bırakalım.\"", en: "\"You pull them out, I'll patch them up. We can talk later.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Işığın açılma aralığı on bir saniye. Hep on bir. Bu tesadüf değil, bunu yazıyorum.\"", en: "\"Eleven seconds between openings. Always eleven. That's not random. I'm writing that down.\"" }
        secenekler:
          - id: "dal"
            etiket: { tr: "Suya atla, düşenleri çıkar", en: "Dive in and haul them out" }
            kronik: { tr: "Dönüşünün ilk dakikasında suya atladın; {yer:kiyikent} seni önce böyle tanıdı.", en: "In your first minute home you went into the water after strangers. That's how {yer:kiyikent} met you first." }
            etkiler:
              - bayrak: "perde2_basladi"
              - degisken: { kadim_tehdit: 20 }
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 3, saygi: 3 } }
              - savas: { dusmanlar: ["liman_kancasi@dunya"], ortam: ["su"], kazan: "donus_su_zafer", kaybet: "donus_su_yenilgi", kac: "donus_su_kacis" }
          - id: "kanca"
            tur: "gosteris"
            etiket: { tr: "Altındaki şeyi sudan çek, iskeleye çarp", en: "Yank the thing out of the water. Slam it on the dock" }
            gerekli: { stat: { str: 28 } }
            kronik: { tr: "Limanın dibindeki şeyi çıplak elle sudan çektin; o günden sonra balıkçılar kapılarına onun dişlerini astı.", en: "You dragged the thing at the bottom of the harbor out with your bare hands. Afterward, fishermen hung its teeth over their doors." }
            etkiler:
              - bayrak: "perde2_basladi"
              - degisken: { kadim_tehdit: 20 }
              - ahlak: { merhamet: 3, duzen: -1 }
              - dikkat: 4
              - iliski: { deniz_arman: { saygi: 6, korku: 3 } }
            sonraki: "donus_ezme"
          - id: "vapur"
            etiket: { tr: "Yan yatmış vapura tırman, şehre bak", en: "Climb the capsized ferry. Look at the city" }
            kronik: { tr: "Suya düşenlere değil, şehre baktın. Birileri onları senin yerine çıkardı; hepsini değil.", en: "You looked at the city instead of the people in the water. Somebody else pulled them out. Not all of them." }
            etkiler:
              - bayrak: "perde2_basladi"
              - degisken: { kadim_tehdit: 20, hayatta_kalan: -1 }
              - ahlak: { merhamet: -3, duzen: 2 }
              - iliski: { deniz_arman: { guven: -4 } }
            sonraki: "donus_vapur"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Kalabalığın içinden, kimse görmeden yardım et", en: "Help from inside the crowd, where nobody sees" }
            kronik: { tr: "Dönüşte kimseye görünmeden ipi sen tuttun; çıkanlar kime teşekkür edeceklerini hiç bilmediler.", en: "On the day you got back, you worked the rope where nobody could see. The people you pulled out never knew who to thank." }
            etkiler:
              - bayrak: "perde2_basladi"
              - degisken: { kadim_tehdit: 20, hayatta_kalan: 1 }
              - gizle: 8
              - ahlak: { merhamet: 2, duzen: 1 }
            sonraki: "donus_gizle"
          - id: "deniz_ip"
            etiket: { tr: "{npc:deniz_arman} dalsın; ipi sen tut", en: "Let {npc:deniz_arman} dive. You work the rope" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "Dönüşte suya {npc:deniz_arman} daldı, ipi sen tuttun; ikiniz o gün eskisi gibi bir ekiptiniz.", en: "On the day you got back, {npc:deniz_arman} went into the water and you held the rope. For one afternoon you were the old team again." }
            etkiler:
              - bayrak: "perde2_basladi"
              - degisken: { kadim_tehdit: 20 }
              - ahlak: { merhamet: 2, duzen: 2 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4, baglilik: 4 } }
            sonraki: "donus_deniz_ip"

      - id: "donus_su_zafer"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kancanın sahibi son kez kıvrılıyor ve ağır ağır dibe gidiyor. Sen iki kişiyi kollarının altında, birini de kanca dilinin ucunda, iskeleye çıkarıyorsun: bir balıkçı, sırılsıklam bir lise öğrencisi ve hâlâ boş bir puseti sıkıca tutan bir kadın.", en: "The thing on the end of the hook gives one last twitch and sinks slowly to the bottom. You come up onto the dock with two people under your arms and a third still tangled in that tongue: a fisherman, a soaked high-school kid and a woman holding an empty stroller in a death grip." }
          - { tr: "Kadın pusetin boş olduğunu ancak iskelede fark ediyor. Sonra arkadan bir çocuk sesi duyuluyor; ışık, bebeği iskeleye, annesini suya bırakmış.", en: "She only notices the stroller's empty once she's on the dock. Then a baby starts crying somewhere behind her. The light dropped the kid on the pier and the mom in the bay." }
          - { tr: "İskeledeki kalabalık sana bakıyor. Bir dakika önce yabancıydın; şimdi suyun altındakinden daha büyük bir şeysin.", en: "The whole terminal is staring at you. A minute ago you were a stranger. Now you're something bigger than whatever was under the water." }
        secenekler:
          - id: "sedye"
            etiket: { tr: "Onları {npc:elif_sari|in} sedyelerine taşı", en: "Carry them to {npc:elif_sari|pos} stretchers" }
            kronik: { tr: "Sudan çıkardıklarını kendi kollarınla {npc:elif_sari|in} çadırına taşıdın; Sığınak adını o gün yazdı.", en: "You carried the ones you pulled out to {npc:elif_sari|pos} tents yourself. The Haven wrote your name down that day." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4, saygi: 3 } }
              - xp_seviye: 20
            sonraki: "donus_duvar"
          - id: "dis"
            etiket: { tr: "Kancanın dişini sök, sakla", en: "Pry the tooth off the hook. Keep it" }
            kronik: { tr: "Kurtardıklarını kalabalığa bıraktın, kancanın dişini cebine koydun.", en: "You left the people you saved to the crowd and pocketed the monster's tooth." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { insanlik: -2 }
              - esya: { kanca_disi: 1 }
              - xp_seviye: 20
            sonraki: "donus_duvar"
          - id: "les"
            tur: "aciga_vur"
            etiket: { tr: "Leşi iskeleye fırlat; herkes görsün", en: "Throw the carcass on the dock. Let them all see" }
            kronik: { tr: "Limanın canavarını iskelenin ortasına fırlattın; {yer:kiyikent} ilk gününden kimin döndüğünü öğrendi.", en: "You threw the harbor monster down in the middle of the dock. From day one, {yer:kiyikent} knew exactly who had come home." }
            etkiler:
              - aciga_vur: true
              - bayrak: "donus_iskele_kurtarildi"
              - bayrak: "donus_liman_yaratigi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { duzen: -2, insanlik: -1 }
              - itibar: { lonca: 4, yukselenler: 3 }
              - xp_seviye: 25
            sonraki: "donus_duvar"

      - id: "donus_su_yenilgi"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kanca seni dibe kadar çekiyor; kulaklarında basınç, ağzında tuz. Sonra biri saçından tutup yukarı asılıyor ve bir balıkçı ağı ikinizi birden iskeleye sürüklüyor.", en: "The hook drags you all the way to the bottom, pressure in your ears, salt in your mouth. Then somebody grabs a fistful of your hair and hauls, and a fishing net drags you both up onto the dock." }
          - { tr: "Seni çıkaran yaşlı bir balıkçı; öksürürken bile ağını bırakmıyor. Suya düşenlerden ikisi çıktı. Üçüncüsünü kanca götürdü.", en: "The one who pulled you out is an old fisherman, and even coughing his lungs up he doesn't let go of the net. Two of the people in the water made it. The hook took the third." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "Balıkçıya teşekkür et", en: "Thank the fisherman" }
            kronik: { tr: "Dönüş günü suyun dibinden seni yaşlı bir balıkçı çıkardı; bunu hiç unutmadın.", en: "On the day you got back, an old fisherman pulled you off the bottom of the bay. You never forgot it." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - degisken: { hayatta_kalan: 1 }
              - ahlak: { insanlik: 3 }
              - itibar: { siginak: 2 }
            sonraki: "donus_duvar"
          - id: "tekrar"
            etiket: { tr: "Kalk ve üçüncüsü için tekrar dal", en: "Get up and go back in for the third one" }
            kronik: { tr: "Kanca seni bir kez dibe çekti, sen yine daldın; üçüncü kişiyi bulamadın ama kimse aramadığını söyleyemedi.", en: "The hook dragged you under once and you went right back in. You never found the third one, but nobody could say you didn't try." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - can: -20
              - ahlak: { merhamet: 4 }
              - stat: { wil: 1 }
            sonraki: "donus_duvar"

      - id: "donus_su_kacis"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kancanın dilini kesip iskelenin direğine tırmanıyorsun. Aşağıda su bir kez kabarıyor, bir kez köpürüyor ve duruluyor.", en: "You cut yourself loose of the tongue and scramble up a piling. Below you, the water swells once, foams once and goes still." }
          - { tr: "Suya düşenlerden ikisi kıyıya yüzmeyi başarıyor. Kalanlar için iskeledeki kalabalık bir süre bağırıyor, sonra susuyor.", en: "Two of the people who fell in manage to swim for it. For the rest, the crowd on the dock yells for a while. Then it goes quiet." }
        secenekler:
          - id: "bak"
            etiket: { tr: "Suya bak; bunu hatırla", en: "Look at the water. Remember this" }
            kronik: { tr: "Dönüş günü limandaki şeyden kaçtın; suya düşenlerin bir kısmı hiç çıkmadı.", en: "On the day you got back, you ran from the thing in the harbor. Some of the people in the water never came up." }
            etkiler:
              - degisken: { hayatta_kalan: -2 }
              - ahlak: { insanlik: 2, merhamet: -1 }
            sonraki: "donus_duvar"
          - id: "yuru"
            etiket: { tr: "Arkana bakmadan iskeleden uzaklaş", en: "Walk off the dock without looking back" }
            kronik: { tr: "Limandaki şeyden kaçtın ve arkana bakmadın.", en: "You ran from the thing in the harbor and never looked back." }
            etkiler:
              - degisken: { hayatta_kalan: -2 }
              - ahlak: { merhamet: -3, duzen: 1 }
            sonraki: "donus_duvar"

      - id: "donus_ezme"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kolunu omzuna kadar suya sokuyorsun. Parmakların kaygan, kalın bir şeyin etrafına kapanıyor ve onu, bir çuvalı ambardan çeker gibi, iskeleye çekip tahtaların üstüne çarpıyorsun.", en: "You shove your arm into the water up to the shoulder. Your fingers close around something thick and slick, and you pull it up like a sack out of a hold and slam it down on the planks." }
          - { tr: "İskele inliyor. Kancalı dili bir kez kıpırdıyor ve duruyor; içinde hâlâ suya düşenlerden biri dolanmış, sağ, ağlıyor.", en: "The dock groans. The hooked tongue twitches once and stops, with one of the people who fell in still tangled in it, alive, crying." }
          - { tr: "Kimse alkışlamıyor. Öğreticiden yeni çıkmış yüzlerce insan, bir canavarın bir insan tarafından sudan bir balık gibi çekildiğini ilk kez görüyor ve ne hissetmesi gerektiğini bilmiyor.", en: "Nobody claps. Hundreds of people fresh out of the tutorial are watching a human being land a monster like a fish for the first time, and nobody knows what they're supposed to feel about it." }
        secenekler:
          - id: "coz"
            etiket: { tr: "Dilin içindekini çöz ve ayağa kaldır", en: "Untangle the one in the tongue. Help them up" }
            kronik: { tr: "Canavarı sudan çektikten sonra ilk işin, dilinde dolanan yabancıyı çözmek oldu.", en: "After you dragged the monster out, the first thing you did was untangle the stranger caught in its tongue." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - bayrak: "donus_liman_yaratigi"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 3, insanlik: 2 }
              - xp_seviye: 25
            sonraki: "donus_duvar"
          - id: "dis"
            etiket: { tr: "Dişini sök; kalabalık izlesin", en: "Rip out its tooth. Let the crowd watch" }
            kronik: { tr: "Limanın canavarının dişini kalabalığın önünde söktün; sana bakan gözlerin yarısı korkudan, yarısı hayranlıktandı.", en: "You ripped the harbor monster's tooth out in front of everyone. Half the eyes on you were afraid. The other half were in love." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - bayrak: "donus_liman_yaratigi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { insanlik: -3 }
              - esya: { kanca_disi: 1 }
              - itibar: { lonca: 3, yukselenler: 4, siginak: -2 }
              - xp_seviye: 25
            sonraki: "donus_duvar"

      - id: "donus_vapur"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Vapurun gövdesi kaygan ve sıcak; yan yatmış bacasına tırmanınca bütün {yer:kiyikent} ayaklarının altında. Bir zamanlar on dakikada yürüdüğün şehir şimdi renk renk parçalara bölünmüş bir harita.", en: "The ferry's hull is slick and warm, and once you're up on its sideways smokestack, all of {yer:kiyikent} is spread out under you. The city you used to cross in ten minutes is a map now, cut up into colored pieces." }
          - { tr: "Terminal binasının üstünde beyaz çarşaflardan bir haç; {npc:elif_sari|in} çadırları. {yer:sanayi|de} vinçlere turuncu bayraklar asılmış. {yer:tepe|de} eski fenerin çevresinde beyazlılar; {yer:eski_sehir|de} saat kulesinin tepesinde bir anten ormanı.", en: "On the terminal roof, a cross made of white bedsheets: {npc:elif_sari|pos} tents. Orange flags hang off the cranes in {yer:sanayi}. People in white circle the old lighthouse up in {yer:tepe}, and a forest of antennas sprouts off the clock tower in {yer:eski_sehir}." }
          - { tr: "Şehrin ortasında, eski meydanda kimse yok. Asfalt orada kusursuz bir daire hâlinde çatlamış ve dairenin içinde martılar bile yürümüyor.", en: "In the middle of the city, the old square is empty. The asphalt there has cracked in a perfect circle, and not even the gulls will walk inside it." }
        sezgiler:
          - kosul: { stat: { per: 24 } }
            metin: { tr: "Meydandaki çatlak nefes alıyor. Her on bir saniyede bir, milimetrenin onda biri kadar yükseliyor.", en: "The crack in the square is breathing. Every eleven seconds it rises a tenth of a millimeter." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o daireye bakma. henüz değil. o da sana bakmaya başlar.", en: "don't look at that circle. not yet. it'll start looking back." }
        secenekler:
          - id: "in"
            etiket: { tr: "İn ve iskeleye dön", en: "Climb down. Head back to the dock" }
            kronik: { tr: "Dönüşte şehri ilk kez yukarıdan gördün ve meydandaki daireyi kimseden önce fark ettin.", en: "On the day you got back, you saw the city from above and noticed the circle in the square before anybody else." }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { per: 1 }
            sonraki: "donus_duvar"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} meydandaki daireyi sor", en: "Ask {npc:yanki} about the circle in the square" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Meydandaki daireyi {npc:yanki|e} sordun; cevabı Kule yükselene kadar anlamadın.", en: "You asked {npc:yanki} about the circle in the square. You didn't understand the answer until the Spire rose." }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 4 } }
              - bilgi: "tasma_sayaci"
            sonraki: "donus_vapur_yanki"

      - id: "donus_vapur_yanki"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre cevap vermiyor. Sonra: altında bir şey var. bir bina değil. bir merdiven. sistem her katmana bir tane diker. tırmanabilsinler diye. ya da tırmanırken ölçülebilsinler diye.", en: "{npc:yanki} doesn't answer for a long time. Then: there's something under there. not a building. a staircase. the system plants one in every layer. so they can climb. or so they can be measured climbing." }
          - { tr: "Bir de şu var, diye ekliyor: karşıdaki kapının sayacı. kırk dokuz gün. o kapıyı kapatabilecek tek kişi şu an bu vapurun üstünde oturuyor. sadece söylüyorum.", en: "And there's this, it adds. the counter on that Gate across the bay. forty-nine days. the only person who could close it is currently sitting on top of this ferry. just saying." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kırk dokuz gün. Aklının bir köşesine yaz", en: "Forty-nine days. File it away" }
            kronik: { tr: "{yer:kordon|in} kapısının sayacını dönüşünün ilk gününden biliyordun.", en: "You knew about the countdown on {yer:kordon} Gate from your very first day home." }
            etkiler:
              - ahlak: { duzen: 2 }
            sonraki: "donus_duvar"

      - id: "donus_gizle"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "İskelenin kenarına çömelmiş üç balıkçının arasına giriyorsun; biri sana halatın ucunu uzatıyor ve kim olduğunu sormuyor. Halat gerildiğinde çekiyorsun, ama bir insanın çekebileceği kadar değil; biraz daha fazla.", en: "You slip in between three fishermen crouched at the edge of the dock. One of them hands you the end of a line and doesn't ask who you are. When it goes taut you pull, just not the way one person can pull. A little more than that." }
          - { tr: "Suya düşenlerden dördü çıkıyor. Balıkçılar birbirlerinin sırtına vuruyor; içlerinden biri halata, sonra sana bakıyor ve hiçbir şey söylemiyor.", en: "Four of the people who fell in come up out of the water. The fishermen slap each other on the back. One of them looks at the line, then at you, and doesn't say a thing." }
        sezgiler:
          - kosul: { stat: { per: 20 } }
            metin: { tr: "O balıkçı biliyor. Halatın tutulduğu yerde avuç izin derine gömülmüş; bir insan eli böyle iz bırakmaz.", en: "That fisherman knows. Your handprint is pressed deep into the line where you held it. Human hands don't leave a mark like that." }
        secenekler:
          - id: "sus"
            etiket: { tr: "Başınla selam ver ve kalabalığa karış", en: "Give him a nod. Melt back into the crowd" }
            kronik: { tr: "Dönüş günü bir balıkçı ne olduğunu gördü ve sustu; sırrını {yer:kiyikent|de} ilk tutan oydu.", en: "On the day you got back, a fisherman saw what you were and kept his mouth shut. He was the first person in {yer:kiyikent} to keep your secret." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - bayrak: "donus_gizlendi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 2 }
            sonraki: "donus_duvar"

      - id: "donus_deniz_ip"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} ceketini çıkarıp atıyor ve tek kelime etmeden dalıyor. Sen halatı bileğine sarıp iskelenin direğine çapraz bağlıyorsun; tıpkı vapurda halat atan tayfaları izlediğiniz o sabahlardaki gibi.", en: "{npc:deniz_arman} peels off {zamir:deniz_arman|onun} jacket and dives in without a word. You wrap the line around your wrist and cross it over a piling, exactly like the deckhands you two used to watch throwing lines on those morning ferries." }
          - { tr: "Halat iki kez çekiliyor: işaret. Çekiyorsun. {npc:deniz_arman} bir kızı kucağında, öksürerek çıkıyor ve hemen arkasında su, bir şey yüzeye yükseliyormuş gibi kabarıyor.", en: "Two tugs on the line: the signal. You pull. {npc:deniz_arman} comes up coughing with a girl in {zamir:deniz_arman|onun} arms, and right behind them the water humps up like something is rising." }
          - { tr: "Suya bakıyorsun; yalnızca bakıyorsun. Kabarma duruyor ve aşağı iniyor. Altında her ne varsa, sana bakıp hesabını yaptı.", en: "You look at the water. That's all, you just look. The swell stops and sinks back down. Whatever's down there took one look at you and did the math." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Ne yaptın sen? Ona bir şey mi dedin? Suya mı bağırdın?\"", en: "\"What did you just do? Did you say something to it? Did you yell at the water?\"" }
        secenekler:
          - id: "gulumse"
            etiket: { tr: "\"Hiçbir şey. Sadece baktım.\"", en: "\"Nothing. I just looked at it.\"" }
            kronik: { tr: "{npc:deniz_arman} suya daldı, sen de suyun altındakini yalnızca bakarak geri gönderdin; {zamir:deniz_arman|o} bunu hiç unutmadı.", en: "{npc:deniz_arman} went into the water and you sent the thing under it back down with nothing but a look. {zamir:deniz_arman|b} never forgot that." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { insanlik: -1, merhamet: 2 }
              - iliski: { deniz_arman: { korku: 4, saygi: 4 } }
            sonraki: "donus_duvar"
          - id: "saril"
            etiket: { tr: "Sırılsıklam hâliyle ona sarıl", en: "Hug {zamir:deniz_arman|onu}, soaking wet and all" }
            kronik: { tr: "Dönüş günü iskelede {npc:deniz_arman|e} sırılsıklam sarıldın; ikiniz de bunun son kolay gün olduğunu biliyordunuz.", en: "On the day you got back, you hugged {npc:deniz_arman} on the dock, both of you soaked. You both knew it was the last easy day." }
            etkiler:
              - bayrak: "donus_iskele_kurtarildi"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { baglilik: 6, guven: 3 } }
              - hafiza: { npc: "deniz_arman", id: "olay:perde2_donus", agirlik: 30 }
            sonraki: "donus_duvar"

      # ---------------------------------------------------------------- Kayıp Duvarı
      - id: "donus_duvar"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Terminalin bekleme salonunda bir duvar baştan sona kâğıtla kaplı. Fotoğraflar, fiş arkalarına yazılmış adlar, bir çocuk çizimi; hepsinin üstünde aynı iki kelime, yüz farklı el yazısıyla: ARIYORUM ve HAYATTAYIM.", en: "In the terminal's waiting room, one wall is papered over from floor to ceiling. Photos, names on the backs of receipts, a kid's drawing, and over all of it the same two phrases in a hundred different hands: LOOKING FOR and I'M ALIVE." }
          - { tr: "İnsanlar duvarın önünde sıra olmuş, kâğıtları parmaklarıyla tek tek geçiyor. Birileri bir ad bulduğunda bütün salon susuyor; bulamadığında kimse bir şey söylemiyor.", en: "People are lined up in front of it, running their fingers over the notes one by one. When somebody finds a name, the whole room goes silent. When they don't, nobody says anything at all." }
          - metin: { tr: "{npc:deniz_arman} duvarın önünde donup kalmış. Fayansa kazınmış o martıyı arıyor; ördeğe benzeyen martıyı.", en: "{npc:deniz_arman} has frozen in front of the wall. {zamir:deniz_arman|b} {zamir:deniz_arman|is} looking for that gull scratched into the tile. The one that looks like a duck." }
            kosul: { yoldas: "deniz_arman" }
          - metin: { tr: "Salonun öbür ucunda beyazlılar duvara kâğıt değil mum diziyor. Mumları dizenlerden biri {npc:deniz_arman}; göğsünde yeni, kızarık bir işaret var.", en: "At the other end of the room, people in white are lining the wall with candles instead of notes. One of the people lighting them is {npc:deniz_arman}, with a new, angry-red mark on {zamir:deniz_arman|onun} chest." }
            kosul: { bayrak: "deniz_yukselenlere_gitti" }
          - metin: { tr: "Duvarın tam ortasında, kâğıtların arasında, birinin bir tükenmez kalemle çizdiği bir kuş var: ördeğe benzeyen bir martı. Bu kuşu yalnızca bir kişi böyle çizer.", en: "Right in the middle of the wall, between the notes, somebody's drawn a bird in ballpoint pen: a gull that looks like a duck. Only one person in the world draws a bird like that." }
            kosul: { npc_hayatta: "deniz_arman", bayrak_yok: ["deniz_bulundu", "deniz_el_tutuldu", "deniz_yukselenlere_gitti"] }
        sezgiler:
          - kosul: { npc_olu: "deniz_arman" }
            metin: { tr: "Duvarda bir yer boş kalmış; bir kâğıt boyunda. Oraya ne yazacağını biliyorsun ve yazamayacağını da.", en: "There's one empty spot on the wall, about the size of a sheet of paper. You know exactly what you'd write there. You know you can't." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "bu duvardaki adların yüzde kırkı sistemin kayıtlarında 'tamamlandı' olarak işaretli. söylemememi ister misin. söylemeyeceğim.", en: "forty percent of the names on this wall are marked 'completed' in the system's records. want me not to tell you. i won't." }
        secenekler:
          - id: "deniz_not"
            etiket: { tr: "{npc:deniz_arman|in} kardeşine not yazmasına yardım et", en: "Help {npc:deniz_arman} write a note for {zamir:deniz_arman|onun} sister" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "Kayıp Duvarı'na {npc:deniz_arman|le} birlikte bir martı çizdiniz; kız kardeş için ilk ilan oydu.", en: "You and {npc:deniz_arman} drew a gull on the Missing Wall together. It was the first notice anyone ever posted for that little sister." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 4 } }
            sonraki: "donus_deniz_not"
          - id: "deniz_beyaz"
            etiket: { tr: "Beyazlıların arasındaki {npc:deniz_arman|e} yürü", en: "Walk over to {npc:deniz_arman}, there among the white" }
            goster: { bayrak: "deniz_yukselenlere_gitti" }
            kronik: { tr: "Dönüşte beyazlar içindeki {npc:deniz_arman|e} yürüdün; aranızdaki salon hiç o kadar uzun olmamıştı.", en: "On the day you got back, you crossed the room to {npc:deniz_arman} in {zamir:deniz_arman|onun} whites. That room had never felt so long." }
            etkiler:
              - ahlak: { merhamet: 1, insanlik: 1 }
            sonraki: "donus_deniz_beyaz"
          - id: "anma"
            etiket: { tr: "Vapurun yanına git; martılara ekmek at", en: "Go out to the ferry. Feed the gulls" }
            goster: { npc_olu: "deniz_arman" }
            kronik: { tr: "Dönüş günü yan yatmış vapurun yanında martılara ekmek attın; {npc:deniz_arman} her sabah böyle yapardı.", en: "On the day you got back, you fed the gulls by the capsized ferry. {npc:deniz_arman} used to do that every morning." }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "donus_anma"
          - id: "marti"
            etiket: { tr: "Duvardaki martının altını oku", en: "Read what's under the gull" }
            goster: { npc_hayatta: "deniz_arman", bayrak_yok: ["deniz_bulundu", "deniz_el_tutuldu", "deniz_yukselenlere_gitti"] }
            kronik: { tr: "Kayıp Duvarı'nda ördeğe benzeyen bir martı buldun; Öğretici'nin sana hiç geri vermediği kişi, {yer:kiyikent|de} seni bekliyordu.", en: "On the Missing Wall you found a gull that looked like a duck. The one person the Tutorial never gave back had been waiting for you in {yer:kiyikent}." }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
            sonraki: "donus_deniz_marti"
          - id: "deniz_ara"
            etiket: { tr: "Duvarda {npc:deniz_arman|in} adını ara", en: "Search the wall for {npc:deniz_arman|pos} name" }
            goster: { npc_gitti: "deniz_arman", bayrak_yok: "deniz_yukselenlere_gitti" }
            kronik: { tr: "Kayıp Duvarı'nda {npc:deniz_arman|in} adını aradın; bulduğun not seni değil, martıları düşünüyordu.", en: "You searched the Missing Wall for {npc:deniz_arman|pos} name. The note you found was thinking about the gulls, not about you." }
            etkiler:
              - ahlak: { insanlik: 1 }
            sonraki: "donus_deniz_gitti"
          - id: "yaz"
            etiket: { tr: "Kendi adını yaz: HAYATTAYIM", en: "Write your own name: I'M ALIVE" }
            kronik: { tr: "Kayıp Duvarı'na kendi adını yazdın; birileri onu okudu ve sana geri döndü.", en: "You wrote your own name on the Missing Wall. Somebody read it, and came looking." }
            etkiler:
              - bayrak: "kayip_duvari_not"
              - ahlak: { insanlik: 3 }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 3, max: 6 } }
            sonraki: "donus_kamplar"
          - id: "don"
            etiket: { tr: "Duvara sırtını dön; işin var", en: "Turn your back on the wall. You've got work" }
            kronik: { tr: "Kayıp Duvarı'na hiç bakmadın; aradıklarını aramayı çoktan bırakmıştın.", en: "You never looked at the Missing Wall. You'd quit looking for people a long time ago." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_not"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir ilaç kutusunun kartonunu düzleştiriyor, kalemi iki kez deniyor, sonra yazıyor: ARIYORUM. On iki yaşında. Göğsünde işaret olanlar onu topladı. Altına da o kuşu çiziyor; ördeğe benzeyen martıyı.", en: "{npc:deniz_arman} flattens out the cardboard from a pill box, tries the pen twice and writes: LOOKING FOR. Twelve years old. The people with the marks took her. And under it, that bird: the gull that looks like a duck." }
          - { tr: "Kalemi sana uzatıyor. \"Senin adın da olsun,\" diyor. \"Biri seni tanırsa beni de bulur. Herkes seni tanıyacak zaten; biliyorsun, değil mi?\"", en: "{zamir:deniz_arman|b} hand{zamir:deniz_arman|s} you the pen. \"Put your name on it too,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}. \"If somebody knows you, they'll find me. Everybody's gonna know you anyway. You know that, right?\"" }
        secenekler:
          - id: "yaz"
            etiket: { tr: "Adını kartonun altına yaz", en: "Sign your name under it" }
            kronik: { tr: "Kız kardeşin ilanına adını yazdın; ondan sonra {npc:deniz_arman|in} umudu biraz da senin omzundaydı.", en: "You signed the sister's notice. After that, part of {npc:deniz_arman|pos} hope rode on your shoulders." }
            etkiler:
              - bayrak: "kayip_duvari_not"
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 6, guven: 4 } }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 3, max: 6 } }
            sonraki: "donus_kamplar"
          - id: "durust"
            etiket: { tr: "\"Bu duvar ona ulaşmaz. Onu başka yerde ararız.\"", en: "\"This wall won't reach her. We'll look somewhere else.\"" }
            kronik: { tr: "{npc:deniz_arman|e} Kayıp Duvarı'nın kardeşine ulaşmayacağını söyledin; haklıydın ve bu ikinize de pahalıya patladı.", en: "You told {npc:deniz_arman} the Missing Wall wouldn't reach the sister. You were right, and it cost you both." }
            etkiler:
              - ahlak: { merhamet: -2, duzen: 2 }
              - iliski: { deniz_arman: { guven: -3, saygi: 4 } }
            sonraki: "donus_kamplar"
          - id: "omuz"
            etiket: { tr: "Bir şey söyleme; elini omzuna koy", en: "Don't say anything. Put a hand on their shoulder" }
            kronik: { tr: "Kayıp Duvarı'nın önünde {npc:deniz_arman|in} omzunu tuttun; söylenecek bir şey yoktu.", en: "In front of the Missing Wall, you held {npc:deniz_arman|pos} shoulder. There wasn't anything to say." }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_beyaz"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{npc:deniz_arman} seni yaklaşırken görüyor ve mumu bırakmıyor. Göğsündeki işaret bir dağlama izi; altında hâlâ kabuklanmamış bir yara.", en: "{npc:deniz_arman} sees you coming and doesn't put down the candle. The mark on {zamir:deniz_arman|onun} chest is a brand, with a wound under it that hasn't scabbed over yet." }
          - { tr: "\"Onu bulamadılar,\" diyor sen sormadan. \"Henüz. Ama {npc:vahit} bir listeden söz ediyor; seçilmişlerin listesinden. Adı orada olabilir. Ben de oradayım artık, biliyor musun? Listede.\"", en: "\"They haven't found her,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s} before you can ask. \"Yet. But {npc:vahit} talks about a list. A list of the chosen. Her name could be on it. I'm on it now too, you know. The list.\"" }
          - { tr: "Arkasında beyazlılardan ikisi seni izliyor; birinin elinde bir defter, öbürünün elinde bir bıçak. Hangisinin daha tehlikeli olduğunu bilmiyorsun.", en: "Behind {zamir:deniz_arman|onu}, two of the people in white are watching you, one holding a notebook, the other holding a knife. You honestly can't tell which one's more dangerous." }
        secenekler:
          - id: "gel"
            etiket: { tr: "\"Benimle gel. Onu birlikte buluruz.\"", en: "\"Come with me. We'll find her together.\"" }
            kronik: { tr: "Dönüşte {npc:deniz_arman|e} yine çağrıda bulundun; {zamir:deniz_arman|o} mumu bırakmadı ama ağladı.", en: "On the day you got back you asked {npc:deniz_arman} to come with you again. {zamir:deniz_arman|b} didn't put down the candle. {zamir:deniz_arman|b} did cry." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4, baglilik: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:perde2_donus", agirlik: 30 }
            sonraki: "donus_kamplar"
          - id: "isaret"
            etiket: { tr: "\"O işaret ne? Sana ne yaptılar?\"", en: "\"What is that mark? What did they do to you?\"" }
            kronik: { tr: "{npc:deniz_arman|in} göğsündeki işareti sordun; aldığın cevap seni korkuttu, çünkü {zamir:deniz_arman|o} gururluydu.", en: "You asked about the mark on {npc:deniz_arman|pos} chest. The answer scared you, because {zamir:deniz_arman|o} sounded proud." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { deniz_arman: { saygi: 3, guven: 2 } }
            sonraki: "donus_deniz_beyaz_isaret"
          - id: "don"
            etiket: { tr: "Bir şey deme; arkanı dön", en: "Don't say a word. Turn around" }
            kronik: { tr: "Beyazlar içindeki {npc:deniz_arman|e} arkanı döndün; o salonda ikinizi bir mumdan başka hiçbir şey bağlamıyordu artık.", en: "You turned your back on {npc:deniz_arman} in {zamir:deniz_arman|onun} whites. By then there was nothing tying the two of you together in that room but a candle." }
            etkiler:
              - ahlak: { merhamet: -3 }
              - iliski: { deniz_arman: { guven: -6, baglilik: -6 } }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_beyaz_isaret"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "\"Bir ateş,\" diyor {npc:deniz_arman} ve parmağını işaretin kenarında gezdiriyor. \"Sistem'in seni görebilmesi için bir yer. Sen bunu bedavaya aldın, biliyor musun? Kafandaki o şey. Biz yakarak alıyoruz.\"", en: "\"A fire,\" {npc:deniz_arman} says, tracing the edge of the brand with a finger. \"A place so the System can see you. You got that for free, you know that? That thing in your head. The rest of us have to burn for it.\"" }
          - { tr: "Mumun alevi titriyor. Bir an, eski {npc:deniz_arman} oradan bakıyor; vapurda simitini martılarla paylaşan. Sonra beyazlılardan biri adını söylüyor ve o yüz kapanıyor.", en: "The candle flame wobbles. For a second, the old {npc:deniz_arman} looks out of that face, the one who split pretzels with the gulls on the ferry. Then one of the people in white says {zamir:deniz_arman|onun} name, and that face shuts." }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Seni oradan çıkaracağım. İkinizi de.\"", en: "\"I'm getting you out of there. Both of you.\"" }
            kronik: { tr: "{npc:deniz_arman|e} ikisini de Yükselenler'den çıkaracağına yine söz verdin.", en: "You promised {npc:deniz_arman}, again, that you'd get them both out of the Ascended." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: -2 }
              - iliski: { deniz_arman: { baglilik: 5 } }
              - itibar: { yukselenler: -3 }
            sonraki: "donus_kamplar"
          - id: "birak"
            etiket: { tr: "\"Kendi yolunu seçtin. Ben de benimkini.\"", en: "\"You picked your road. I'm picking mine.\"" }
            kronik: { tr: "{npc:deniz_arman|e} kendi yolunu seçtiğini söyledin; ikiniz de bunun bir veda olduğunu duydunuz.", en: "You told {npc:deniz_arman} {zamir:deniz_arman|o}'d picked {zamir:deniz_arman|onun} road. You both heard the goodbye in it." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
              - iliski: { deniz_arman: { saygi: 4, baglilik: -4 } }
            sonraki: "donus_kamplar"

      - id: "donus_anma"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Simitçinin tezgâhı iskelenin dibinde devrilmiş; camlı kutunun içinde bir ay önceden kalma, taş gibi sertleşmiş simitler. Birini alıyorsun.", en: "The pretzel cart is tipped over at the foot of the pier, and inside the glass case are pretzels a month old, gone hard as rocks. You take one." }
          - { tr: "Yan yatmış vapurun gölgesinde duruyor, simidi kırıp suya atıyorsun. Martılar önce tereddüt ediyor; sonra, Öğretici'den önceki her sabah olduğu gibi, gürültüyle iniyorlar.", en: "You stand in the shadow of the capsized ferry, break the pretzel up and toss it on the water. The gulls hesitate at first. Then, like every morning before the Tutorial, they come down screaming." }
          - { tr: "Yanında kimse yok ve bu, olabilecek en doğal şeymiş gibi geliyor; çünkü on yıldır bu iskelede hep iki kişiydiniz ve şimdi de öylesiniz, bir şekilde.", en: "There's nobody next to you, and it feels like the most natural thing in the world, because for ten years there were always two of you on this pier. Somehow there still are." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "...sessiz kalacağım. bu kez.", en: "...i'll be quiet. this once." }
        secenekler:
          - id: "at"
            etiket: { tr: "Son parçayı da at; sonra dön", en: "Toss the last piece. Then turn back" }
            kronik: { tr: "{npc:deniz_arman|in} yerine martılara ekmek attın ve sonra işine döndün; bunu her yıl aynı gün yapacaktın.", en: "You fed the gulls for {npc:deniz_arman} and then went back to work. You'd do it on the same day every year." }
            etkiler:
              - bayrak: "deniz_anildi"
              - ahlak: { insanlik: 3, merhamet: 1 }
              - stat: { wil: 1 }
            sonraki: "donus_kamplar"
          - id: "kalkan"
            etiket: { tr: "Bir kâğıda adını yaz, vapurun gövdesine iliştir", en: "Write {zamir:deniz_arman|onun} name on a note. Pin it to the hull" }
            kronik: { tr: "Yan yatmış vapurun gövdesine {npc:deniz_arman|in} adını iliştirdin; o kâğıdın yanına zamanla başka adlar da eklendi.", en: "You pinned {npc:deniz_arman|pos} name to the capsized ferry's hull. Over time, other names went up next to it." }
            etkiler:
              - bayrak: "deniz_anildi"
              - bayrak: "kayip_duvari_not"
              - ahlak: { insanlik: 4 }
              - itibar: { siginak: 2 }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 3, max: 6 } }
            sonraki: "donus_kamplar"
          - id: "yuru"
            etiket: { tr: "Simidi cebine koy; martılar beklesin", en: "Pocket the pretzel. The gulls can wait" }
            kronik: { tr: "Martılara ekmek atamadın; {npc:deniz_arman|in} simidini cebinde taşıdın, taş kesilene kadar.", en: "You couldn't bring yourself to feed the gulls. You carried {npc:deniz_arman|pos} pretzel in your pocket until it turned to stone." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - stat: { end: 1 }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_marti"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Martının altında, tükenmez kalemle, el yazısını otuz gün sonra bile tanıdığın birkaç satır var: \"Öğretici'den çıktım. İyiyim. Her akşam güneş batarken yan yatmış vapurun yanındayım. Gelmezsen de olur. Ama gel.\"", en: "Under the gull, in ballpoint, a few lines in handwriting you'd know after thirty days or thirty years: \"Made it out. I'm okay. Every evening at sunset I'm by the ferry that tipped over. You don't have to come. But come.\"" }
          - { tr: "Altında tek bir harf: D. Kâğıdın kenarları, haftalarca her akşam biri tarafından dokunulmuş gibi yumuşamış.", en: "Signed with one letter: D. The edges of the paper have gone soft, like somebody's been touching it every evening for weeks." }
          - { tr: "Güneş körfezin üstünde alçalıyor. Vapurun gölgesi iskeleye uzanmaya başladı bile.", en: "The sun's already low over the bay. The ferry's shadow is starting to stretch across the dock." }
        secenekler:
          - id: "bekle"
            etiket: { tr: "Vapurun yanına git ve bekle", en: "Go out to the ferry and wait" }
            kronik: { tr: "Güneş batarken yan yatmış vapurun yanında bekledin; Öğretici'nin vermediğini {yer:kiyikent} verdi.", en: "You waited by the capsized ferry at sunset. What the Tutorial never gave you back, {yer:kiyikent} did." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
            sonraki: "donus_deniz_kavusma"
          - id: "not"
            etiket: { tr: "Altına \"Geldim\" yaz ve kamplara git", en: "Write \"I came\" under it and head for the camps" }
            kronik: { tr: "{npc:deniz_arman|in} notunun altına \"Geldim\" yazıp gittin; o akşam vapurun yanında bir kişi, bir kâğıdı okuyup uzun süre güldü.", en: "You wrote \"I came\" under {npc:deniz_arman|pos} note and left. That evening, by the ferry, somebody read it and laughed for a long time." }
            etkiler:
              - bayrak: "kayip_duvari_not"
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { deniz_arman: { guven: 3, baglilik: -2 } }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 2, max: 4 } }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_kavusma"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Önce sesini duyuyorsun: martılarla konuşan biri, onlara sabırlı olmalarını söylüyor. Sonra gölgeden çıkıyor; daha zayıf, saçları kısa kesilmiş, kolunda senin hiç görmediğin bir kalkan.", en: "You hear {zamir:deniz_arman|onu} first: somebody talking to the gulls, telling them to be patient. Then {zamir:deniz_arman|o} step{zamir:deniz_arman|s} out of the shadow, thinner, hair hacked short, a shield on {zamir:deniz_arman|onun} arm you've never seen before." }
          - { tr: "{npc:deniz_arman} seni görüyor ve elindeki ekmek suya düşüyor. \"Öğretici koca bir yermiş,\" diyor, sesi titriyor. \"Otuz gün. Bir kez bile karşılaşmadık. Sen... Tanrım, sana ne oldu?\"", en: "{npc:deniz_arman} sees you, and the bread in {zamir:deniz_arman|onun} hand drops into the water. \"Turns out the Tutorial's a big place,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, voice shaking. \"Thirty days. Never ran into you once. You... God. What happened to you?\"" }
          - { tr: "Neye baktığını biliyorsun. Gözlerine, duruşuna, havanın senin çevrende biraz farklı durmasına. Öğretici'nin sana yaptığı her şeyi bir bakışta okuyor.", en: "You know what {zamir:deniz_arman|o} {zamir:deniz_arman|is} looking at. Your eyes, the way you stand, the way the air sits a little different around you. {zamir:deniz_arman|b} read{zamir:deniz_arman|s} everything the Tutorial did to you in one look." }
        secenekler:
          - id: "katil"
            etiket: { tr: "\"Uzun hikâye. Yanımda kal, anlatayım.\"", en: "\"Long story. Stick with me and I'll tell you.\"" }
            gerekli: { yoldas_yer: true }
            kronik: { tr: "Öğretici'nin ayırdığı {npc:deniz_arman|le} yan yatmış vapurun yanında yeniden buluştunuz ve bir daha ayrılmamaya karar verdiniz.", en: "The Tutorial split you and {npc:deniz_arman} up. You found each other again by the capsized ferry and decided not to split up a second time." }
            etkiler:
              - bayrak: "deniz_donuste_bulundu"
              - bayrak: "deniz_bulundu"
              - ahlak: { insanlik: 3, merhamet: 2 }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { guven: 8, baglilik: 10 } }
              - hafiza: { npc: "deniz_arman", id: "olay:perde2_donus", agirlik: 50 }
            sonraki: "donus_kamplar"
          - id: "yanki"
            etiket: { tr: "Her şeyi anlat; kafandaki sesi de", en: "Tell {zamir:deniz_arman|onu} everything. The voice too" }
            goster: { bayrak: "yanki_bagi" }
            gerekli: { yoldas_yer: true }
            kronik: { tr: "{npc:deniz_arman|e} kavuştuğunuz akşam kafandaki sesi de anlattın; ilk duyan oydu, ilk inanan da.", en: "The night you found each other, you told {npc:deniz_arman} about the voice in your head. {zamir:deniz_arman|b} {zamir:deniz_arman|was} the first to hear it, and the first to believe it." }
            etkiler:
              - bayrak: "deniz_donuste_bulundu"
              - bayrak: "deniz_bulundu"
              - bayrak: "deniz_yankiyi_biliyor"
              - ahlak: { insanlik: 4 }
              - yoldas_katil: "deniz_arman"
              - iliski: { deniz_arman: { guven: 12, baglilik: 10 }, yanki: { guven: -6, korku: 3 } }
              - hafiza: { npc: "deniz_arman", id: "yanki_anlatildi", agirlik: 50 }
            sonraki: "donus_kamplar"
          - id: "ayri"
            etiket: { tr: "\"Değiştim. Benden uzak dur; senin için iyisi bu.\"", en: "\"I changed. Stay away from me. It's better for you.\"" }
            kronik: { tr: "{npc:deniz_arman|i} bulduğun akşam ondan uzak durmasını istedin; korumak için, dedin. {zamir:deniz_arman|b} sana hiç inanmadı.", en: "The night you found {npc:deniz_arman}, you told {zamir:deniz_arman|onu} to stay away. To keep {zamir:deniz_arman|onu} safe, you said. {zamir:deniz_arman|b} never believed you." }
            etkiler:
              - bayrak: "deniz_donuste_bulundu"
              - bayrak: "deniz_bulundu"
              - ahlak: { insanlik: -3, duzen: 2 }
              - iliski: { deniz_arman: { guven: -4, baglilik: 4, saygi: 2 } }
            sonraki: "donus_kamplar"

      - id: "donus_deniz_gitti"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Bulmak uzun sürmüyor. Duvarın en köşesinde, bir sigara paketinin arkasına yazılmış: \"Hayattayım. Beni arama. Simitleri martılara ver.\"", en: "It doesn't take long. Way off in the corner, on the back of a cigarette pack: \"I'm alive. Don't look for me. Give the pretzels to the gulls.\"" }
          - { tr: "İmza yok. Gerek de yok. Notun altına birileri, belki başka biri, belki de o, sonradan küçük bir martı çizmiş.", en: "No signature. Doesn't need one. Under the note, somebody, maybe somebody else, maybe {zamir:deniz_arman|o}, drew a little gull after the fact." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Notu olduğu yerde bırak", en: "Leave the note where it is" }
            kronik: { tr: "{npc:deniz_arman|in} \"beni arama\" notunu duvarda bıraktın; aramadın, en azından o gün.", en: "You left {npc:deniz_arman|pos} \"don't look for me\" note on the wall. You didn't look. Not that day, anyway." }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { deniz_arman: { saygi: 4 } }
            sonraki: "donus_kamplar"
          - id: "cevap"
            etiket: { tr: "Altına cevap yaz: \"Arayacağım.\"", en: "Write back under it: \"I'm looking anyway.\"" }
            kronik: { tr: "{npc:deniz_arman|in} notunun altına \"Arayacağım\" yazdın; o yazıyı birileri günlerce silmeye kıyamadı.", en: "You wrote \"I'm looking anyway\" under {npc:deniz_arman|pos} note. For days nobody had the heart to take it down." }
            etkiler:
              - bayrak: "kayip_duvari_not"
              - ahlak: { merhamet: 2, duzen: -2 }
              - iliski: { deniz_arman: { baglilik: 5 } }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 3, max: 6 } }
            sonraki: "donus_kamplar"

      # ---------------------------------------------------------------- Kamplar seni istiyor
      - id: "donus_kamplar"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşam olmadan haber senden önce limanı dolaşıyor. Terminalden çıktığında seni dört kişi bekliyor; dördü de ötekileri görmezden gelmeye çalışıyor ve dördü de başarısız oluyor.", en: "Before evening, word's already made it around the whole waterfront ahead of you. When you step out of the terminal, four people are waiting, each trying to pretend the other three aren't there, and all four failing." }
          - metin: { tr: "\"Kancayı sudan çeken sen misin?\" diye soruyor biri; sorusu bir soru değil.", en: "\"You're the one who pulled the Hook out of the water?\" one of them asks. It isn't really a question." }
            kosul: { bayrak: "donus_liman_yaratigi" }
          - { tr: "Önlüklü bir hemşire elinde katlanmış bir battaniye tutuyor; turuncu kol bantlı bir kurye bir ranza anahtarı sallıyor. Beyazlar içinde bir kız bir mum tutuyor; kulağında kulaklık olan bir oğlan da cebinden telsizinin antenini çıkarıyor.", en: "A nurse in scrubs is holding a folded blanket. A courier with an orange armband is twirling the key to a bunk. A girl in white holds a candle, and a boy with an earpiece fishes a radio antenna out of his pocket." }
          - metin: { tr: "Hemşire öne çıkıyor: \"{npc:elif_sari} seni bekliyordu. Sana bir yatak ayırdı; içimizde en çok ihtiyacı olan sen değilsin ama sen de yorgun görünüyorsun.\"", en: "The nurse steps up first: \"{npc:elif_sari} was waiting for you. She saved you a cot. You're not the one who needs it most, but you look tired too.\"" }
            kosul: { lider_fraksiyon: "siginak", itibar_min: { siginak: 15 } }
          - metin: { tr: "Kurye öne çıkıyor: \"{npc:kaya_demir} rütbeni korudu. {yer:sanayi|de} bir ranza, bir silah ve sana bağlı on kişi var.\"", en: "The courier steps up first: \"{npc:kaya_demir} held your rank. There's a bunk in {yer:sanayi}, a weapon and ten people reporting to you.\"" }
            kosul: { lider_fraksiyon: "lonca", itibar_min: { lonca: 15 } }
          - metin: { tr: "Beyazlı kız öne çıkıyor ve sana değil, bir yere, senin biraz üstüne bakarak konuşuyor: \"Peygamber seni rüyasında gördü. Kule'nin tepesinde. Yanan bir taç.\"", en: "The girl in white steps up first, and talks not to you but to a spot just above your head: \"The Prophet saw you in a dream. On top of the Spire. Wearing a crown on fire.\"" }
            kosul: { lider_fraksiyon: "yukselenler", itibar_min: { yukselenler: 15 } }
          - metin: { tr: "Telsizli oğlan öne çıkmıyor; yalnızca cızırdatıyor: üç kısa, bir uzun. \"{npc:mert_kilic} frekansı açık tuttu,\" diyor. \"Seni kaydediyorduk. Sözümüzü tuttuk.\"", en: "The boy with the radio doesn't step up. He just keys it: three short, one long. \"{npc:mert_kilic} kept the frequency open,\" he says. \"We were logging you. Promise kept.\"" }
            kosul: { lider_fraksiyon: "sessiz_ag", itibar_min: { sessiz_ag: 15 } }
          - metin: { tr: "Kalabalığın arkasında, bir elektrik direğine yaslanmış, siyah ceketli biri seni izliyor. Göz göze geldiğinizde iki parmağıyla selam veriyor ve gidiyor.", en: "At the back of the crowd, leaning on a light pole, somebody in a black jacket is watching you. When your eyes meet, he gives you a two-finger salute and walks off." }
            kosul: { bayrak: "aras_tanisildi" }
        sezgiler:
          - kosul: { stat: { cha: 22 } }
            metin: { tr: "Dördü de seni istiyor ve dördü de ötekilerin seni almasından daha çok korkuyor. Bu senin için bir para birimi.", en: "All four of them want you, and all four are more scared of one of the others getting you. That's currency." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dört kamp. dört el. hepsi seni tutmak istiyor. tutulan şey taşınır. bunu unutma.", en: "four camps. four hands. all of them want to hold you. whatever gets held gets carried. remember that." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Battaniyeyi al; Sığınak'ın yatağına git", en: "Take the blanket. Go to the Haven's cot" }
            kronik: { tr: "Dönüş gecesini {npc:elif_sari|in} çadırında, yaralıların arasında geçirdin.", en: "You spent your first night home in {npc:elif_sari|pos} tent, among the wounded." }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 1 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "Anahtarı al; Lonca'nın ranzasına git", en: "Take the key. Go to the Guild's bunk" }
            kronik: { tr: "Dönüş gecesini {yer:sanayi|de}, Lonca'nın silah yağı kokan ranzalarında geçirdin.", en: "You spent your first night home in {yer:sanayi}, in a Guild bunk that smelled like gun oil." }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 3 } }
            sonraki: "@akis"
          - id: "yukselenler"
            etiket: { tr: "Mumu al; beyazlılarla {yer:tepe|e} çık", en: "Take the candle. Go up to {yer:tepe} with the white" }
            kronik: { tr: "Dönüş gecesini {yer:tepe|de}, adını ilahiye ekleyen beyazlıların arasında geçirdin.", en: "You spent your first night home in {yer:tepe}, among the people in white working your name into their hymns." }
            etkiler:
              - ahlak: { insanlik: -3, duzen: 1 }
              - itibar: { yukselenler: 4 }
              - iliski: { vahit: { saygi: 3 } }
            sonraki: "@akis"
          - id: "sessiz_ag"
            etiket: { tr: "Telsizi cebine koy; saat kulesine git", en: "Pocket the radio. Head for the clock tower" }
            kronik: { tr: "Dönüş gecesini saat kulesinde, frekans dinleyen radyocuların arasında geçirdin.", en: "You spent your first night home in the clock tower, among radio operators listening to static." }
            etkiler:
              - ahlak: { duzen: -3 }
              - itibar: { sessiz_ag: 4 }
              - iliski: { mert_kilic: { guven: 3 } }
            sonraki: "@akis"
          - id: "hicbiri"
            etiket: { tr: "Hiçbirini alma; kendi kapını kendin bul", en: "Take none of it. Find your own door" }
            kronik: { tr: "Dönüş gecesi dört kampın teklifini de geri çevirdin ve yan yatmış vapurun içinde, yalnız uyudun.", en: "On your first night home you turned down all four camps and slept alone inside the capsized ferry." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - gizle: 4
            sonraki: "@akis"
          - id: "pazarlik"
            tur: "aciga_vur"
            etiket: { tr: "Gerçek seviyeni göster; pazarlığı sen başlat", en: "Show them your real level. Open the bidding" }
            kronik: { tr: "Dönüşünün ilk akşamı gerçek seviyeni dört kampa birden gösterdin; o geceden sonra {yer:kiyikent|de} bir açık artırma başladı ve ürün sendin.", en: "On your first evening home you showed all four camps your real level at once. That night an auction started in {yer:kiyikent}, and you were the lot." }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -2, duzen: -1 }
              - itibar: { siginak: 2, lonca: 3, yukselenler: 3, sessiz_ag: 2 }
              - tohum: { olay: "dikkat_50_p2", gecikme: { min: 4, max: 8 }, kosul: { dikkat_min: 35 } }
            sonraki: "@akis"

  # ================================================================== KULE'NİN YÜKSELİŞİ (ana yay 40)
  - id: "kule_yukselisi"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "kule", "boss"]
    gerilim: 4
    ana_yay: { gun: 40 }
    kart: { tr: "Kule yükseliyor", en: "The Spire rises" }
    sahne: "kule_1"
    sahneler:
      - id: "kule_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Şafakta bütün şehir aynı anda uyanıyor, çünkü yer kalkıyor. Eski meydandaki o kusursuz daire bir kapak gibi açılıyor ve içinden, kara camla kemik rengi taştan örülmüş bir şey göğe doğru itiliyor.", en: "At dawn the whole city wakes up at the same time, because the ground is lifting. That perfect circle in the old square pops open like a lid, and out of it something built of black glass and bone-colored stone shoves its way toward the sky." }
          - { tr: "Durmuyor. Bir kat, on kat, elli kat; bulutları delip geçiyor ve tepesi hâlâ görünmüyor. Meydanın çevresindeki apartmanların cepheleri kâğıt gibi soyuluyor; balkonlardan çığlıklar, sonra toz.", en: "It doesn't stop. One floor, ten, fifty. It punches through the clouds and you still can't see the top. Around the square, apartment façades peel off like wet paper. Screams from the balconies, then dust." }
          - { tr: "Toz çökünce Kule'nin dibinde bir kapı açık. Kapıdan uzun, kara camdan bir şey çıkıyor; başının yerinde bronz bir çan. Meydana ilk adım atan meraklı bir adam, çan bir kez çalınca diz çöküyor ve bir daha kalkmıyor.", en: "When the dust settles, there's a door standing open at the foot of the Spire. Something tall and made of black glass steps out of it, with a bronze bell where its head should be. The first gawker to step into the square drops to his knees the moment the bell tolls, and doesn't get back up." }
          - metin: { tr: "Meydanın öbür ucunda, bir otobüs durağının çatısında siyah ceketli biri çömelmiş. {npc:aras_kurt} sana bakıp kapıyı çenesiyle işaret ediyor: yarış.", en: "Across the square, somebody in a black jacket is crouched on top of a bus shelter. {npc:aras_kurt} looks at you and points his chin at the door. Race you." }
            kosul: { bayrak: "aras_tanisildi", npc_hayatta: "aras_kurt" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KULE YÜKSELDİ]", en: "[THE SPIRE HAS RISEN]" }
            satirlar:
              - { tr: "Katman tırmanış yapısı etkin. Kat sayısı: 100.", en: "Layer ascension structure online. Floors: 100." }
              - { tr: "Her kat bir ölçümdür. Zirvede: [veri yok].", en: "Every floor is a measurement. At the summit: [no data]." }
              - { tr: "Not: Davetiyeler dağıtılıyor.", en: "Note: invitations are being delivered." }
        sezgiler:
          - kosul: { stat: { per: 26 } }
            metin: { tr: "Çan her çaldığında Kule'nin bir katının pencereleri yanıyor. Haberci kapıyı korumuyor; Kule'yi uyandırıyor.", en: "Every time the bell rings, one floor of the Spire lights up. The herald isn't guarding the door. It's waking the Spire up." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "merdiven bu. sana söylemiştim. her katmana bir tane. tırmananlar ölçülür. en yükseğe çıkan... sonra anlatırım.", en: "that's the staircase. told you. one in every layer. the ones who climb get measured. the one who gets highest... i'll tell you later." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Balkonlarda insanlar var. Önce onlar. Lütfen önce onlar.\"", en: "\"There are people on those balconies. Them first. Please, them first.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Enkazın altında en az on kişi var. O şey beklesin.\"", en: "\"There are at least ten people under that rubble. That thing can wait.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yüz kat. Yüz! Bu bir yapı değil, bu bir... bir arayüz. Tepesinde ne var, onu bilmem lazım.\"", en: "\"A hundred floors. A hundred! That's not a building, that's an... an interface. I need to know what's at the top.\"" }
        secenekler:
          - id: "enkaz"
            etiket: { tr: "Çöken balkonların altındakileri çıkar", en: "Dig out the people under the balconies" }
            etkiler:
              - bayrak: "kule_acik"
              - ahlak: { merhamet: 4, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 4 }, elif_sari: { saygi: 3 } }
            sonraki: "kule_enkaz"
          - id: "cephe"
            tur: "gosteris"
            etiket: { tr: "Düşen cepheyi sırtınla tut", en: "Catch the falling façade on your back" }
            gerekli: { stat: { end: 32 } }
            etkiler:
              - bayrak: "kule_acik"
              - ahlak: { merhamet: 4, duzen: -1 }
              - dikkat: 4
              - degisken: { hayatta_kalan: 2 }
            sonraki: "kule_cephe"
          - id: "haberci"
            etiket: { tr: "Habercinin önüne çık", en: "Step out in front of the herald" }
            etkiler:
              - bayrak: "kule_acik"
              - ahlak: { duzen: 2, merhamet: -1 }
              - savas: { dusmanlar: ["kule_habercisi@oyuncu+3"], ortam: ["tavan"], kazan: "kule_haberci_zafer", kaybet: "kule_haberci_yenilgi" }
          - id: "gozlem"
            tur: "gizle"
            etiket: { tr: "Uzaktan izle; Kule'yi oku", en: "Hang back and read the Spire" }
            etkiler:
              - bayrak: "kule_acik"
              - gizle: 6
              - ahlak: { duzen: 2, merhamet: -2 }
            sonraki: "kule_gozlem"
          - id: "aras"
            etiket: { tr: "{npc:aras_kurt|le} kapıya yarış", en: "Race {npc:aras_kurt} to the door" }
            goster: { bayrak: "aras_tanisildi", npc_hayatta: "aras_kurt" }
            zar: { stat: "agi", zorluk: 17, tek: true, basarisiz: "kule_aras_kaybet", basarisiz_etkiler: [{ bayrak: "kule_acik" }, { ahlak: { duzen: -1 } }, { iliski: { aras_kurt: { saygi: 2 } } }] }
            etkiler:
              - bayrak: "kule_acik"
              - ahlak: { merhamet: -3, duzen: -2 }
              - iliski: { aras_kurt: { saygi: 6, guven: -3 } }
            sonraki: "kule_aras_kazan"

      - id: "kule_enkaz"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İlk balkonun altında bir aile var: bir kadın, iki çocuk ve hâlâ kucağında bir kedi tutan bir dede. Betonu kaldırıyorsun; bir insanın kaldırabileceğinden ağır, ama sen artık o kadar insan değilsin.", en: "Under the first balcony there's a family: a woman, two kids and a grandpa still hanging onto a cat. You lift the concrete. It's heavier than a person can lift, but you haven't been just a person in a while." }
          - { tr: "Üçüncü enkazı kaldırırken çan çalıyor. Haberci başını sana çeviriyor; çanın içindeki karanlık bir göz gibi açılıyor. Sonra arkanda topladığın insanlara dönüyor.", en: "You're lifting the third slab when the bell tolls. The herald turns its head toward you, and the dark inside the bell opens like an eye. Then it turns toward the people you've gathered behind you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "İnsanlarla onun arasına gir", en: "Get between it and the people" }
            etkiler:
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 3 }
              - itibar: { siginak: 3 }
              - savas: { dusmanlar: ["kule_habercisi@oyuncu+3"], ortam: ["tavan"], kazan: "kule_haberci_zafer", kaybet: "kule_haberci_yenilgi" }
          - id: "cikar"
            etiket: { tr: "Herkesi meydandan çıkar; o şeyi başkası halletsin", en: "Get everyone out. Let somebody else handle it" }
            etkiler:
              - bayrak: "kule_siviller_korundu"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 5, insanlik: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "kule_baskasi"

      - id: "kule_cephe"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Dört katlı bir cephe, pencereleri ve saksılarıyla birlikte, bir perde gibi meydana devriliyor. Altına koşuyorsun ve sırtını veriyorsun.", en: "A four-story façade, windows, flowerpots and all, tips into the square like a curtain coming down. You run under it and put your back into it." }
          - { tr: "Beton omuzlarında duruyor. Dizlerin bir kez titriyor, sonra titremeyi bırakıyor. Altından otuz kişi koşarak geçiyor; içlerinden biri durup sana bakıyor ve haç çıkarıyor.", en: "The concrete stops on your shoulders. Your knees shake once, then quit shaking. Thirty people run out from under it, and one of them stops, looks at you and crosses himself." }
          - { tr: "Meydanın ortasında çan çalıyor. Haberci Kule'ye değil sana dönmüş; sanki çağırması gereken kişiyi şimdi bulmuş gibi.", en: "In the middle of the square, the bell tolls. The herald isn't facing the Spire anymore. It's facing you, like it just found the person it was sent to call." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Cepheyi bırak ve habercinin üstüne yürü", en: "Drop the façade and walk at the herald" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - savas: { dusmanlar: ["kule_habercisi@oyuncu+3"], ortam: ["tavan"], kazan: "kule_haberci_zafer", kaybet: "kule_haberci_yenilgi" }
          - id: "tut"
            etiket: { tr: "Son kişi çıkana kadar tut", en: "Hold it until the last person's out" }
            etkiler:
              - bayrak: "kule_siviller_korundu"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 4, lonca: 2 }
              - stat: { end: 1 }
            sonraki: "kule_baskasi"

      - id: "kule_gozlem"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir çatı katının kırık penceresinden izliyorsun. Haberci rastgele vurmuyor: çan, yalnızca belli bir seviyenin altındaki biri meydana girdiğinde çalıyor. Altındakileri diz çöktürüyor; üstündekileri çağırıyor.", en: "You watch from the broken window of an attic apartment. The herald doesn't hit at random. The bell only rings when somebody below a certain level steps into the square. It drops the ones below. It calls the ones above." }
          - { tr: "Kapının lentosunda Sistem'in harfleriyle yazılmış bir satır var ama satır Sistem gibi konuşmuyor: \"Zirveye çıkan, başlığı okur. Başlığı okuyan, geri dönmez.\"", en: "Carved into the lintel over the door is a line in the System's letters, except it doesn't talk like the System: \"Whoever reaches the top reads the header. Whoever reads the header doesn't come back.\"" }
        sezgiler:
          - kosul: { stat: { per: 24 } }
            metin: { tr: "Kara camın içinde ışık birikiyor ve dışarı çıkamıyor. Bu şeyi bir lambayla bile çatlatabilirsin; yeter ki çok parlak olsun.", en: "Light's building up inside that black glass and can't get out. You could crack it with a lamp, as long as the lamp was bright enough." }
        secenekler:
          - id: "vur"
            etiket: { tr: "Zaafını gördün; şimdi in ve vur", en: "You saw its weak spot. Go down and hit it" }
            etkiler:
              - bilgi: "kule_yaziti"
              - ahlak: { duzen: 2 }
              - savas: { dusmanlar: ["kule_habercisi@oyuncu+1"], ortam: ["tavan"], kazan: "kule_haberci_zafer", kaybet: "kule_haberci_yenilgi" }
          - id: "gece"
            tur: "gizle"
            etiket: { tr: "Bekle; gece kimse görmeden içeri gir", en: "Wait. Slip in after dark when nobody's looking" }
            etkiler:
              - bilgi: "kule_yaziti"
              - gizle: 6
              - ahlak: { merhamet: -3, duzen: -2 }
              - bayrak: "kule_gizli_tirmanis"
            sonraki: "kule_gece"
          - id: "anlat"
            etiket: { tr: "Gördüklerini radyocularla paylaş", en: "Share what you saw with the radio crew" }
            etkiler:
              - bilgi: "kule_yaziti"
              - ahlak: { insanlik: 2, duzen: -1 }
              - itibar: { sessiz_ag: 5 }
              - iliski: { mert_kilic: { guven: 5, saygi: 4 } }
            sonraki: "kule_baskasi"

      - id: "kule_haberci_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çan son kez yarılıyor ve haberci, içindeki bütün sabah ışığını meydana boşaltarak dağılıyor. Kara cam parçaları yağmur gibi yağıyor; düştükleri yerde sönüyorlar.", en: "The bell splits one last time, and the herald comes apart, spilling all the morning light it swallowed across the square. Shards of black glass rain down and go dark wherever they land." }
          - { tr: "Meydanın kenarlarında bekleyen yüzlerce insan aynı anda nefes veriyor. Kapı hâlâ açık; içerisi karanlık değil, yalnızca boş, bir asansör boşluğu gibi.", en: "Hundreds of people at the edges of the square let their breath out at the same time. The door's still open. It isn't dark in there, just empty, like an elevator shaft." }
          - { tr: "Gökyüzündeki panellerden biri senin için kayıyor: [Davetiye teslim alındı. İlk kat açık.]", en: "One of the panels in the sky slides over just for you: [Invitation received. First floor open.]" }
        secenekler:
          - id: "gir"
            tur: "aciga_vur"
            etiket: { tr: "Herkesin gözü önünde içeri ilk sen gir", en: "Walk in first, in front of everyone" }
            etkiler:
              - aciga_vur: true
              - unvan: "cani_susturan"
              - unvan: "ilk_kule_adimi"
              - bayrak: "kule_ilk_adim"
              - ahlak: { insanlik: -2, duzen: -1 }
              - itibar: { lonca: 4, yukselenler: 5, sessiz_ag: 3 }
              - xp_seviye: 40
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "kule_ilk_kat"
          - id: "nobet"
            etiket: { tr: "Kapının önünde dur; içeride kimse ölmesin", en: "Stand at the door. Nobody dies in there yet" }
            etkiler:
              - unvan: "cani_susturan"
              - bayrak: "kule_kapi_nobeti"
              - ahlak: { merhamet: 3, duzen: 3 }
              - itibar: { siginak: 4, lonca: 2 }
              - xp_seviye: 30
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "kule_kapi_nobet"
          - id: "can"
            etiket: { tr: "Çanın bir parçasını al ve uzaklaş", en: "Take a piece of the bell and walk away" }
            etkiler:
              - unvan: "cani_susturan"
              - esya: { haberci_cani: 1 }
              - ahlak: { insanlik: -1, duzen: 1 }
              - xp_seviye: 30
            sonraki: "@akis"

      - id: "kule_ilk_kat"
        yer: "kule"
        paragraflar:
          - { tr: "İçerisi dışarıdan büyük. İlk kat bir avlu: yukarıda, imkânsız bir yükseklikte, katların alt yüzleri bir kuyunun duvarları gibi diziliyor ve her birinin ortasında bir ışık yanıp sönüyor.", en: "It's bigger inside than out. The first floor's a courtyard, and overhead, impossibly high, the undersides of the floors stack up like the walls of a well, each with a light blinking in the middle." }
          - { tr: "Avlunun ortasında küçük bir taş var, üstünde tek bir kelime: KAT 1. Dokunuyorsun ve bütün gezegendeki her pencere aynı anda kayıyor.", en: "In the middle of the courtyard there's a small stone with one word on it: FLOOR 1. You touch it, and every window on the planet slides over at once." }
          - { tr: "Dışarıda, meydanda, birileri adını söylüyor. Önce bir kişi, sonra on, sonra yüz.", en: "Outside, in the square, somebody says your name. Then ten people. Then a hundred." }
        bildirimler:
          - tur: "unvan"
            baslik: { tr: "[KÜRESEL DUYURU]", en: "[GLOBAL ANNOUNCEMENT]" }
            satirlar:
              - { tr: "Bir Kule'ye ilk adım atıldı. Konum: {yer:kiyikent}.", en: "First step taken inside a Spire. Location: {yer:kiyikent}." }
              - { tr: "Sıralama güncellendi. Herkes güncellemeyi gördü.", en: "Ranking updated. Everybody saw the update." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "yüz kat. her kat seni biraz daha görünür yapacak. bunu ikimiz de istiyor muyuz, emin değilim.", en: "a hundred floors. every one makes you a little more visible. not sure we both want that." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Bugünlük bu kadar; dışarı çık", en: "That's enough for today. Head back out" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"
          - id: "yukari"
            etiket: { tr: "Yukarı bak ve katları say", en: "Look up and count the floors" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - stat: { wil: 1 }
            sonraki: "@akis"

      - id: "kule_kapi_nobet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kapının önüne bir sandalye çekip oturuyorsun. Öğlene kadar kırk kişi geliyor; yarısı seviyesini sorduğunda geri dönüyor, yarısı dönmüyor ve sen onlara içeride ne olduğunu bilmediğini dürüstçe söylüyorsun.", en: "You drag a chair in front of the door and sit. By noon forty people show up. Half of them turn around when you ask their level. Half don't, and you tell them straight up you don't know what's in there." }
          - { tr: "Akşamüstü {npc:kaya_demir|in} adamlarından biri gelip sandalyenin yanına bir defter bırakıyor: girenlerin listesi için. Kimse sana bu görevi vermedi; ama herkes bunun senin görevin olduğunu kabul etmiş gibi.", en: "Late afternoon, one of {npc:kaya_demir|pos} guys comes by and leaves a ledger next to your chair, for logging who goes in. Nobody gave you this job. Everybody seems to have agreed it's yours." }
        secenekler:
          - id: "defter"
            etiket: { tr: "Defteri aç ve ilk adı yaz", en: "Open the ledger. Write the first name" }
            etkiler:
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 3, siginak: 2 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "@akis"
          - id: "birak"
            etiket: { tr: "Defteri geri ver; kapı herkesin", en: "Hand back the ledger. The door's for everyone" }
            etkiler:
              - ahlak: { duzen: -3, merhamet: 1 }
              - iliski: { kaya_demir: { saygi: -2 }, mert_kilic: { saygi: 3 } }
            sonraki: "@akis"

      - id: "kule_haberci_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çan kafatasının içinde çalıyor ve dünya ikiye katlanıyor. Kendine geldiğinde yüzün kara cam kırıklarının içinde; haberci yerde, parçalanmış, ama onu parçalayan sen değilsin.", en: "The bell rings inside your skull and the world folds in half. When you come to, your face is in a pile of black glass. The herald's down, smashed to pieces. You're not the one who smashed it." }
          - metin: { tr: "{npc:aras_kurt} kapının eşiğinde duruyor, ceketinin tozunu silkeliyor. \"Isıttın,\" diyor. \"Sağ ol.\" Sonra içeri giriyor ve bütün gezegendeki pencereler kayıyor.", en: "{npc:aras_kurt} is standing in the doorway, dusting off his jacket. \"Thanks for softening it up,\" he says. Then he walks inside, and every window on the planet slides over." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "{npc:kaya_demir|in} avcıları habercinin kalıntılarını çuvallara dolduruyor. Kapıdan ilk giren, Lonca'nın adını kimsenin hatırlamayacağı bir mangası oluyor.", en: "{npc:kaya_demir|pos} hunters are shoveling what's left of the herald into sacks. The first ones through the door are a Guild squad nobody will remember the names of." }
            kosul: { npc_olu: "aras_kurt" }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk. Kule bir yere gitmiyor", en: "Get up. The Spire isn't going anywhere" }
            etkiler:
              - ahlak: { duzen: 1 }
              - stat: { wil: 1 }
              - iliski: { aras_kurt: { saygi: -3 } }
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "kirik"
            etiket: { tr: "Bir kırık al; bir dahaki sefere hatırlatsın", en: "Pocket a shard. Let it remind you next time" }
            etkiler:
              - esya: { haberci_cani: 1 }
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

      - id: "kule_baskasi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Meydanın kenarından izliyorsun: biri habercinin üstüne yürüyor, çan çatlıyor, kara cam yağıyor. Kapı açılıyor ve kalabalık ilk kez ileri adım atıyor.", en: "You watch from the edge of the square: somebody walks up on the herald, the bell cracks, black glass comes down like hail. The door swings open, and for the first time the crowd takes a step forward." }
          - metin: { tr: "Kapıdan ilk giren {npc:aras_kurt}. Eşikte dönüp sana bakıyor; kurtardığın insanları görüyor ve bir an alay etmeyi unutuyor.", en: "The first one through is {npc:aras_kurt}. He turns around in the doorway and looks at you. He sees the people you pulled out, and for a second he forgets to smirk." }
            kosul: { npc_hayatta: "aras_kurt" }
          - metin: { tr: "Kapıdan ilk giren, {npc:kaya_demir|in} adını kimsenin hatırlamayacağı bir mangası.", en: "The first ones through are one of {npc:kaya_demir|pos} squads, guys nobody will remember the names of." }
            kosul: { npc_olu: "aras_kurt" }
          - metin: { tr: "Senin çıkardığın insanlar meydanın kenarında oturmuş, tozlarını silkeliyor. Bir çocuk Kule'ye değil sana bakıyor.", en: "The people you pulled out are sitting on the curb, dusting themselves off. One kid isn't looking at the Spire. He's looking at you." }
            kosul: { bayrak: "kule_siviller_korundu" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kule bekleyebilir; insanlar bekleyemezdi", en: "The Spire can wait. The people couldn't" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 2 } }
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "dis"
            etiket: { tr: "Dişlerini sık; ilk kat başkasının oldu", en: "Grit your teeth. Somebody else got the first floor" }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { aras_kurt: { saygi: -2, guven: -2 } }
            sonraki: "@akis"

      - id: "kule_gece"
        yer: "kule"
        paragraflar:
          - { tr: "Gece yarısı meydan boş. Haberci kapının önünde dikiliyor ama çanı susuyor; senin seviyende biri yaklaştığında çalmıyor bile. Yanından geçiyorsun ve o, bir kapıcı gibi, başını hafifçe eğiyor.", en: "At midnight the square's empty. The herald's still standing at the door, but the bell keeps quiet; for someone at your level it doesn't even ring. You walk right past it, and it dips its head a little, like a doorman." }
          - { tr: "İçeride ilk kat bir avlu ve avlunun ortasında bir taş var: KAT 1. Dokunmuyorsun. Dokunursan bütün gezegen bilecek.", en: "Inside, the first floor's a courtyard, and in the middle of it is a stone: FLOOR 1. You don't touch it. Touch it and the whole planet finds out." }
          - { tr: "Yukarıda doksan dokuz kat seni bekliyor. Şimdilik bu kapıdan geçmenin senin için bir eşikten fazlası olmadığını yalnızca sen biliyorsun.", en: "Ninety-nine floors are waiting overhead. For now, you're the only one who knows that, for you, walking through this door was just stepping over a threshold." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "akıllıca. ilk olan herkesin hedefi olur. ikinci olan herkesin sırrını bilir.", en: "smart. whoever's first becomes everybody's target. whoever's second gets to know everybody's secrets." }
        secenekler:
          - id: "cik"
            etiket: { tr: "Taşa dokunmadan çık", en: "Leave without touching the stone" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} zirvede ne olduğunu sor", en: "Ask {npc:yanki} what's at the top" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: -1 }
              - iliski: { yanki: { guven: 5, baglilik: 3 } }
            sonraki: "kule_gece_yanki"

      - id: "kule_gece_yanki"
        yer: "kule"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor; sonra, yukarıdaki kuyuya seninle birlikte bakıyormuş gibi bir sesle: bilmiyorum. bunu ilk kez söylüyorum. zirvedeki şey benden önce yazılmış.", en: "{npc:yanki} goes quiet for a long time. Then, in a voice like it's staring up that well right beside you: i don't know. first time i've said that. whatever's at the top was written before me." }
          - { tr: "ama şunu biliyorum, diye ekliyor. yazı, okuyan geri dönmez diyor. ben bir kez okudum. ve işte buradayım. bir parçam döndü. sanırım.", en: "but i know this much, it adds. the writing says whoever reads it doesn't come back. i read it once. and here i am. part of me came back. i think." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bunu aklının bir köşesine yaz ve çık", en: "File that away and head out" }
            etkiler:
              - ahlak: { duzen: 1 }
              - iliski: { yanki: { guven: 3 } }
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"

      - id: "kule_aras_kazan"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "İkiniz aynı anda fırlıyorsunuz. Haberci çanını çalıyor; {npc:aras_kurt} sesin altından eğilip geçiyor, sen sesin içinden geçiyorsun. Kapının eşiğine bir adım önce sen basıyorsun.", en: "You both launch at the same moment. The herald tolls; {npc:aras_kurt} ducks under the sound, and you go straight through it. You hit the threshold one step ahead." }
          - { tr: "Arkanda {npc:aras_kurt} nefes nefese, kayarak duruyor ve ilk kez gülmüyor. Bütün gezegendeki pencereler aynı anda kayıyor: senin adın, onunkinin bir satır üstünde.", en: "Behind you {npc:aras_kurt} skids to a stop, breathing hard, and for once he isn't laughing. Every window on the planet slides over at the same time: your name, one line above his." }
          - { tr: "Haberci kapının önünde başını sana doğru eğiyor ve susuyor. Davetiye teslim edildi.", en: "In front of the door, the herald tips its head your way and goes quiet. Invitation delivered." }
        secenekler:
          - id: "selam"
            etiket: { tr: "{npc:aras_kurt|e} dönüp iki parmakla selam ver", en: "Turn and give {npc:aras_kurt} a two-finger salute" }
            etkiler:
              - unvan: "ilk_kule_adimi"
              - bayrak: "kule_ilk_adim"
              - ahlak: { duzen: -1, insanlik: -1 }
              - iliski: { aras_kurt: { saygi: 6, guven: -4 } }
              - npc_isaret: { aras_kurt: "rakip" }
              - xp_seviye: 40
              - dikkat: 5
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "el"
            etiket: { tr: "Elini uzat; ikinci kat ikinizin olsun", en: "Offer him your hand. Second floor's for both of you" }
            etkiler:
              - unvan: "ilk_kule_adimi"
              - bayrak: "kule_ilk_adim"
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { aras_kurt: { guven: 6, saygi: 4 } }
              - xp_seviye: 40
              - dikkat: 5
            sonraki: "@akis"

      - id: "kule_aras_kaybet"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çan çalıyor ve ses önüne bir duvar gibi çıkıyor; yarım adımlığına. Yarım adım yetiyor: {npc:aras_kurt} eşiğe basıyor, dönüyor ve iki parmağıyla göğsüne vuruyor.", en: "The bell tolls and the sound comes up in front of you like a wall. For half a step. Half a step is plenty: {npc:aras_kurt} hits the threshold, spins around and taps two fingers on his chest." }
          - { tr: "Bütün gezegendeki pencereler kayıyor. Onun adı, seninkinin bir satır üstünde.", en: "Every window on the planet slides over. His name, one line above yours." }
          - { tr: "Haberci ona başını eğiyor. Sonra, yavaşça, sana da.", en: "The herald tips its head to him. Then, slowly, to you too." }
        secenekler:
          - id: "gul"
            etiket: { tr: "Gül; bir sonraki kat senin", en: "Laugh it off. The next floor's yours" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { aras_kurt: { saygi: 4, guven: 2 } }
              - tohum: { olay: "kule_donmeyenler", gecikme: { min: 3, max: 6 } }
            sonraki: "@akis"
          - id: "hirs"
            etiket: { tr: "Bunu hatırla. Her katı hatırla", en: "Remember this. Remember every floor" }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - stat: { agi: 1 }
              - iliski: { aras_kurt: { saygi: 2, guven: -4 } }
              - npc_isaret: { aras_kurt: "rakip" }
            sonraki: "@akis"

  # ================================================================== FRAKSİYON SEÇİMİ (ana yay 45)
  - id: "fraksiyon_secimi"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "fraksiyon", "siyaset"]
    gerilim: 3
    ana_yay: { gun: 45 }
    onemli: true
    kart: { tr: "Dört sandalye", en: "Four chairs" }
    sahne: "secim_1"
    sahneler:
      - id: "secim_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Eski balık halinin uzun mermer tezgâhı yıllardır balık kanı görmedi; bu sabah üstünde dört kişinin elleri var. Dördü de seni çağırdı ve dördü de diğerlerinin geleceğini ancak kapıda öğrendi.", en: "The long marble counter in the old fish market hasn't seen fish blood in years. This morning it's got four people's hands on it. All four of them sent for you, and all four only found out about the others at the door." }
          - { tr: "{npc:elif_sari} tezgâhın bir ucunda, önünde bir termos çay. {npc:kaya_demir} oturmuyor; sırtını kapıya vermeyecek bir duvara yaslanmış. {npc:vahit} bembeyaz giysiler içinde, iki müridinin arasında, sanki bu bir buluşma değil de bir ayinmiş gibi gülümsüyor.", en: "{npc:elif_sari} is at one end of the counter with a thermos of tea. {npc:kaya_demir} isn't sitting; he's leaning on the one wall that keeps his back away from the door. {npc:vahit} is all in white between two of his followers, smiling like this is a service and not a meeting." }
          - { tr: "{npc:mert_kilic} tezgâhın altına çömelmiş, bir araba aküsüne bağlı dizüstü bilgisayarına bir şeyler yazıyor. Seni görünce yazmayı bırakmıyor; yalnızca \"Kayıttayız,\" diyor.", en: "{npc:mert_kilic} is hunkered under the counter typing into a laptop hooked to a car battery. He doesn't stop typing when he sees you. He just says, \"We're recording.\"" }
          - metin: { tr: "{npc:vahit|in} müritlerinden biri {npc:deniz_arman}. Göğsündeki işaret artık kabuk bağlamış. Sana bakmıyor; bakmamak için çok uğraşıyor.", en: "One of {npc:vahit|pos} two followers is {npc:deniz_arman}. The brand on {zamir:deniz_arman|onun} chest has scabbed over. {zamir:deniz_arman|b} {zamir:deniz_arman|is}n't looking at you. {zamir:deniz_arman|b} {zamir:deniz_arman|is} working very hard at not looking at you." }
            kosul: { bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
          - metin: { tr: "Kule'nin ilk taşına dokunduğun günden beri Sıralama'da adının yanında küçük bir taç simgesi var. Dördü de o simgeye bakıyor.", en: "Ever since you touched the Spire's first stone, there's been a little crown icon next to your name on the Ranking. All four of them are looking at it." }
            kosul: { bayrak: "kule_ilk_adim" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[FRAKSİYON DAVETLERİ: 4]", en: "[FACTION INVITATIONS: 4]" }
            satirlar:
              - { tr: "Sığınak Konseyi · Demir Lonca · Yükselenler · Sessiz Ağ.", en: "Haven Council · Iron Guild · The Ascended · The Quiet Network." }
              - { tr: "Sistem taraf tutmaz. Şimdilik.", en: "The System doesn't take sides. For now." }
        sezgiler:
          - kosul: { stat: { cha: 30 } }
            metin: { tr: "Dördü de blöf yapıyor. Hiçbiri seni kaybetmeyi göze alamaz; en çok da birbirlerine kaybetmeyi.", en: "All four are bluffing. None of them can afford to lose you, least of all to each other." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dördünün de bir tasması var. hangisinin rengini seveceğine karar ver. ya da tasmayı sevmediğine.", en: "all four of them are holding a leash. decide which color you like. or decide you don't like leashes." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kim olursa olsun, beni de götürüyorsun. Pazarlık yok.\"", en: "\"Whoever you pick, I'm coming with. Not up for negotiation.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Sana ne seçeceğini söylemeyeceğim. Ama ben hangi masada oturduğumu biliyorum.\"", en: "\"I'm not going to tell you what to pick. But I know which table I sit at.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bak, ben tarafsızım. Tarafsızım derken... yani. Sen anladın.\"", en: "\"Look, I'm neutral. And by neutral I mean... you know what I mean.\"" }
        secenekler:
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|i} dinle", en: "Hear {npc:elif_sari} out" }
            kronik: { tr: "Dört sandalyenin ilkinde {npc:elif_sari|i} dinledin.", en: "Of the four chairs, you listened to {npc:elif_sari} first." }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "secim_siginak"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|i} dinle", en: "Hear {npc:kaya_demir} out" }
            kronik: { tr: "Dört sandalyenin ilkinde {npc:kaya_demir|i} dinledin.", en: "Of the four chairs, you listened to {npc:kaya_demir} first." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_lonca"
          - id: "vahit"
            etiket: { tr: "{npc:vahit|i} dinle", en: "Hear {npc:vahit} out" }
            kronik: { tr: "Dört sandalyenin ilkinde {npc:vahit|i} dinledin.", en: "Of the four chairs, you listened to {npc:vahit} first." }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "secim_yukselenler"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|i} dinle", en: "Hear {npc:mert_kilic} out" }
            kronik: { tr: "Dört sandalyenin ilkinde {npc:mert_kilic|i} dinledin.", en: "Of the four chairs, you listened to {npc:mert_kilic} first." }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "secim_sessiz_ag"
          - id: "masa"
            tur: "gosteris"
            etiket: { tr: "Dördünü aynı masaya oturt; şartları sen koy", en: "Sit all four at one table. You set the terms" }
            gerekli: { stat: { cha: 34 } }
            kronik: { tr: "Dört kampın liderini balık halinde aynı masaya oturttun; o güne kadar kimse bunu başaramamıştı.", en: "You sat the leaders of all four camps down at one table in the fish market. Nobody had ever managed that before." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - dikkat: 3
              - iliski: { elif_sari: { saygi: 4 }, kaya_demir: { saygi: 6 }, vahit: { korku: 4 }, mert_kilic: { saygi: 4 } }
            sonraki: "secim_masa"
          - id: "cik"
            etiket: { tr: "Kalk ve hiçbirine söz vermeden çık", en: "Get up and leave without promising anybody anything" }
            kronik: { tr: "Dört sandalyeye de sırtını döndün ve balık halinden yalnız çıktın.", en: "You turned your back on all four chairs and walked out of the fish market alone." }
            etkiler:
              - ahlak: { duzen: -3 }
            sonraki: "secim_yalniz"

      # ---------------------------------------------------------------- Teklifler
      - id: "secim_siginak"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:elif_sari} çaydan bir yudum alıyor ve termosun kapağını sana uzatıyor. \"Benim teklifim en kötüsü,\" diyor. \"Sana rütbe vermeyeceğim, taç da. Konsey'de bir sandalye ve bir oy; tıpkı balıkçınınki, öğretmeninki gibi.\"", en: "{npc:elif_sari} takes a sip of tea and holds the thermos cap out to you. \"Mine's the worst offer at this table,\" she says. \"No rank. No crown. A chair on the Council and one vote, same as the fisherman's, same as the schoolteacher's.\"" }
          - { tr: "\"Senden istediğim, kalkan olman. Hükümdar değil. Bu şehirde senin kadar güçlü biri bir gün herkese ne yapacağını söylemeye başlayacak; ben o günün senin günün olmamasını istiyorum.\"", en: "\"What I want from you is a shield. Not a king. Somebody as strong as you is going to start telling this whole city what to do one of these days. I'd like that day not to be yours.\"" }
          - metin: { tr: "Sesini alçaltıyor: \"Nabzını biliyorum. Ne olduğunu da. Yine de seni istiyorum; belki de tam bu yüzden.\"", en: "She drops her voice: \"I know about your pulse. I know what you are. I still want you. Maybe that's exactly why.\"" }
            kosul: { bayrak: "elif_anomaliyi_biliyor" }
          - metin: { tr: "\"Öğretici'den beri çadırımda senin için bir yer vardı,\" diyor. \"Hâlâ var.\"", en: "\"There's been a spot for you in my tent since the Tutorial,\" she says. \"Still is.\"" }
            kosul: { lider_fraksiyon: "siginak", itibar_min: { siginak: 15 } }
        sezgiler:
          - kosul: { stat: { per: 28 } }
            metin: { tr: "Elleri titremiyor ama termosun kapağı titriyor. Üç gündür uyumamış. Konsey'in deposunda iki haftalık ilaç kaldı.", en: "Her hands aren't shaking, but the thermos cap is. She hasn't slept in three days. The Council's stockroom has two weeks of medicine left." }
        secenekler:
          - id: "katil"
            etiket: { tr: "Çayı al; Sığınak'a katıl", en: "Take the tea. Join the Haven" }
            kronik: { tr: "Fraksiyon seçiminde Sığınak Konseyi'ne katıldın; bir sandalye ve bir oy, herkesinki gibi.", en: "When the factions came calling, you joined the Haven Council. One chair and one vote, same as everyone else." }
            etkiler:
              - bayrak: "uye_siginak"
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { merhamet: 5, duzen: 2, insanlik: 2 }
              - itibar: { siginak: 12, lonca: -4, yukselenler: -4 }
              - iliski: { elif_sari: { guven: 10, baglilik: 8 }, kaya_demir: { saygi: -3 } }
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "Kapağı geri ver; ötekileri de dinle", en: "Hand the cap back. Hear the others too" }
            kronik: { tr: "{npc:elif_sari|in} çayını geri verdin ve dinlemeye devam ettin.", en: "You handed {npc:elif_sari|pos} tea back and kept listening." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_dinle"
          - id: "sor"
            etiket: { tr: "\"Kalkan olursam, kim beni durdurur?\"", en: "\"If I'm the shield, who stops me?\"" }
            kronik: { tr: "{npc:elif_sari|e} seni kimin durduracağını sordun; cevabı \"ben\" oldu ve bunu kastediyordu.", en: "You asked {npc:elif_sari} who'd stop you. She said, \"Me,\" and she meant it." }
            etkiler:
              - ahlak: { insanlik: 3 }
              - iliski: { elif_sari: { saygi: 5, guven: 3 } }
            sonraki: "secim_siginak_ben"

      - id: "secim_siginak_ben"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "\"Ben,\" diyor {npc:elif_sari}, hiç duraksamadan. \"Bir neşterle, bir oyla ya da bir mektupla. Senin kadar güçlü değilim; ama haklıyken çok inatçıyım.\"", en: "\"Me,\" {npc:elif_sari} says, without missing a beat. \"With a scalpel, a vote or a letter. I'm not as strong as you. But I'm awfully stubborn when I'm right.\"" }
          - { tr: "{npc:kaya_demir} duvarın dibinde homurdanıyor; gülüyor mu, kızıyor mu, belli değil.", en: "Over by the wall, {npc:kaya_demir} makes a sound. Hard to tell if it's a laugh or a growl." }
        secenekler:
          - id: "katil"
            etiket: { tr: "\"Anlaştık.\" Sığınak'a katıl", en: "\"Deal.\" Join the Haven" }
            kronik: { tr: "Fraksiyon seçiminde Sığınak'a katıldın; seni durdurma hakkını {npc:elif_sari|e} kendi ağzınla verdin.", en: "You joined the Haven, and you gave {npc:elif_sari} the right to stop you, out of your own mouth." }
            etkiler:
              - bayrak: "uye_siginak"
              - gorev: { zincir_siginak: "basla" }
              - ahlak: { merhamet: 4, duzen: 3, insanlik: 3 }
              - itibar: { siginak: 14, lonca: -4, yukselenler: -4 }
              - iliski: { elif_sari: { guven: 12, baglilik: 10 } }
              - hafiza: { npc: "elif_sari", id: "olay:fraksiyon_secimi", agirlik: 40 }
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "Gülümse; ötekileri de dinle", en: "Smile. Hear the others too" }
            kronik: { tr: "{npc:elif_sari|in} cevabını beğendin ama seçimini erteledin.", en: "You liked {npc:elif_sari|pos} answer. You put off choosing anyway." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_dinle"

      - id: "secim_lonca"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:kaya_demir} duvardan ayrılmıyor. \"Lafı dolandırmayacağım,\" diyor. \"Lonca'da rütbeyi güç verir. Sen bu şehrin en güçlüsüsün; sana bir manga teklif etmiyorum. Bir ordu teklif ediyorum.\"", en: "{npc:kaya_demir} doesn't come off the wall. \"I'm not gonna dance around it,\" he says. \"In the Guild, strength is rank. You're the strongest thing in this city. I'm not offering you a squad. I'm offering you an army.\"" }
          - { tr: "\"{yer:kordon|de}ki kapının sayacı otuz beşte. Otuz beş gün sonra o kapı taşacak ve bu masadakilerden biri, kimin ölüp kimin yaşayacağına karar verecek. O kişinin ben ya da sen olması lazım. Çay içenler değil.\"", en: "\"The counter on {yer:kordon} Gate says thirty-five. Thirty-five days from now that thing overflows, and somebody at this counter decides who lives and who doesn't. That somebody needs to be me or you. Not the tea crowd.\"" }
          - metin: { tr: "\"Öğretici'de sağ kolumdun,\" diye ekliyor. \"Hâlâ öylesin, istersen. İstemezsen, ben sağ kol olurum.\" Bunu söylemek ona bir şeye mal oluyor.", en: "\"You were my right hand in the Tutorial,\" he adds. \"Still are, if you want it. If you don't, I'll be yours.\" Saying that costs him something." }
            kosul: { bayrak: "lonca_ikinci_adam" }
          - metin: { tr: "\"Bir keresinde komutamı elimden aldın,\" diyor. \"Bu kez kendi elimle veriyorum. Fark bu.\"", en: "\"You took my command off me once,\" he says. \"This time I'm handing it over myself. That's the difference.\"" }
            kosul: { bayrak: "lonca_komutasi_alindi" }
        sezgiler:
          - kosul: { stat: { per: 28 } }
            metin: { tr: "Kapıya sırtını vermiyor ama {npc:vahit|e} de sırtını vermiyor. Bu odada korktuğu tek kişi o.", en: "He won't put his back to the door, and he won't put his back to {npc:vahit} either. That's the only person in this room he's scared of." }
        secenekler:
          - id: "katil"
            etiket: { tr: "Elini sık; Demir Lonca'ya katıl", en: "Shake his hand. Join the Iron Guild" }
            kronik: { tr: "Fraksiyon seçiminde Demir Lonca'ya katıldın; o günden sonra şehirde rütbe, güç demekti ve güç, sen demekti.", en: "When the factions came calling, you joined the Iron Guild. After that, rank in this city meant strength, and strength meant you." }
            etkiler:
              - bayrak: "uye_lonca"
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 6, merhamet: -2 }
              - itibar: { lonca: 12, siginak: -4, sessiz_ag: -4 }
              - iliski: { kaya_demir: { guven: 10, saygi: 8, baglilik: 6 }, elif_sari: { guven: -3 } }
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "\"Ötekileri de dinleyeceğim.\"", en: "\"I'm hearing the others too.\"" }
            kronik: { tr: "{npc:kaya_demir|in} ordusunu dinledin ve elini sıkmadın; henüz.", en: "You heard {npc:kaya_demir} out about his army and didn't shake his hand. Not yet." }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "secim_dinle"
          - id: "kordon"
            etiket: { tr: "\"{yer:kordon|i} kapatırsak, kimse ölmeden?\"", en: "\"What if we close {yer:kordon} Gate before anyone dies?\"" }
            kronik: { tr: "{npc:kaya_demir|e} {yer:kordon} kapısını kimse ölmeden kapatmayı sordun; bunu ilk kez biri ona sormuştu.", en: "You asked {npc:kaya_demir} about closing {yer:kordon} Gate before anybody died. Nobody had ever asked him that." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 1 }
              - iliski: { kaya_demir: { saygi: 5 } }
              - bilgi: "tasma_sayaci"
            sonraki: "secim_lonca_kordon"

      - id: "secim_lonca_kordon"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:kaya_demir} ilk kez duvardan ayrılıyor. \"Kimse ölmeden,\" diye tekrarlıyor, kelimeleri tartarak. \"Bu kapı D kademe. Bu şehirde D kademeye vurup ayakta kalabilecek bir kişi var.\"", en: "For the first time, {npc:kaya_demir} comes off the wall. \"Before anybody dies,\" he repeats, weighing the words. \"That Gate's grade D. There's one person in this city who can hit grade D and stay standing.\"" }
          - { tr: "\"Seni o kapıya sokmak için seni Lonca'ya almam gerekmiyor,\" diyor. \"Ama seni o kapıdan sağ çıkarmak için yüz kişilik bir hat lazım. O hat bende.\"", en: "\"I don't need you in the Guild to send you into that Gate,\" he says. \"But to get you back out of it alive, you need a line of a hundred people behind you. I've got that line.\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "\"Hattını ver. Lonca'dayım.\"", en: "\"Give me the line. I'm in the Guild.\"" }
            kronik: { tr: "{yer:kordon} için Demir Lonca'ya katıldın; {npc:kaya_demir} sana yüz kişilik bir hat verdi.", en: "You joined the Iron Guild for {yer:kordon|pos} sake, and {npc:kaya_demir} gave you a line of a hundred people." }
            etkiler:
              - bayrak: "uye_lonca"
              - bayrak: "lonca_kordon_hatti"
              - gorev: { zincir_lonca: "basla" }
              - ahlak: { duzen: 5, merhamet: 2 }
              - itibar: { lonca: 14, siginak: -3, sessiz_ag: -4 }
              - iliski: { kaya_demir: { guven: 12, saygi: 10 } }
              - hafiza: { npc: "kaya_demir", id: "olay:fraksiyon_secimi", agirlik: 40 }
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "Başını salla; ötekileri de dinle", en: "Nod. Hear the others too" }
            kronik: { tr: "{npc:kaya_demir|in} hattını aklına yazdın ama seçimini erteledin.", en: "You filed away {npc:kaya_demir|pos} line and put off choosing." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_dinle"

      - id: "secim_yukselenler"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:vahit} ayağa kalkmıyor; ayağa kalkmasına gerek yok, çünkü sesi zaten odanın en yüksek yerinden geliyor. \"Ötekiler sana bir şey teklif ediyor,\" diyor. \"Ben teklif etmiyorum. Hatırlatıyorum.\"", en: "{npc:vahit} doesn't stand up. He doesn't need to; his voice already comes from the highest point in the room. \"The others are offering you something,\" he says. \"I'm not offering. I'm reminding.\"" }
          - { tr: "\"Sistem seninle konuşuyor. Benimle konuştuğu gibi; belki daha çok. Yükselenler'de seçilmişlerin önünde bir yer yok sana; seçilmişlerin önü sensin. Geri kalanımız yalnızca senin ışığında yürüyoruz.\"", en: "\"The System talks to you. The way it talks to me. Maybe more. There's no place for you at the front of the Chosen. You are the front. The rest of us just walk in your light.\"" }
          - { tr: "\"Ve ışığın yakıtı vardır,\" diye ekliyor yumuşacık. \"Bunu da biliyorsun. Hepimiz biliyoruz.\"", en: "\"And light needs fuel,\" he adds, soft as anything. \"You know that too. We all do.\"" }
          - metin: { tr: "Yanında {npc:deniz_arman} sonunda sana bakıyor. Gözleri bir şey söylemiyor; söyleyemiyor.", en: "Next to him, {npc:deniz_arman} finally looks at you. {zamir:deniz_arman|onun|b} eyes aren't saying anything. They can't." }
            kosul: { bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
        sezgiler:
          - kosul: { stat: { per: 28 } }
            metin: { tr: "\"Sistem benimle konuşuyor\" derken gözleri bir an sola kayıyor. Ya yalan söylüyor ya da Sistem gerçekten solunda duruyor.", en: "When he says \"the System talks to me,\" his eyes flick left for half a second. Either he's lying, or the System really is standing on his left." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "Sistem onunla konuşmuyor. ya da konuşuyor ve ben duymuyorum. ikisi de iyi haber değil.", en: "the System doesn't talk to him. or it does and i can't hear it. neither one's good news." }
        secenekler:
          - id: "katil"
            etiket: { tr: "Mumu yak; Yükselenler'e katıl", en: "Light the candle. Join the Ascended" }
            kronik: { tr: "Fraksiyon seçiminde Yükselenler'e katıldın; o günden sonra şehirde biri hep yakıttı ve o kişi hiçbir zaman sen değildin.", en: "When the factions came calling, you joined the Ascended. After that, somebody in this city was always fuel, and it was never you." }
            etkiler:
              - bayrak: "uye_yukselenler"
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { insanlik: -6, merhamet: -3 }
              - itibar: { yukselenler: 12, siginak: -5, sessiz_ag: -3 }
              - iliski: { vahit: { guven: 10, saygi: 6, baglilik: 8 }, elif_sari: { guven: -6 } }
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "\"Yakıt kim?\" diye sor, sonra ötekileri dinle", en: "Ask \"who's the fuel?\" Then hear the others" }
            kronik: { tr: "{npc:vahit|e} yakıtın kim olduğunu sordun; cevap vermedi, gülümsedi.", en: "You asked {npc:vahit} who the fuel was. He didn't answer. He smiled." }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { vahit: { saygi: -2 } }
            sonraki: "secim_dinle"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|e} dön: \"Sen ne düşünüyorsun?\"", en: "Turn to {npc:deniz_arman}: \"What do you think?\"" }
            goster: { bayrak: "deniz_yukselenlere_gitti", npc_hayatta: "deniz_arman" }
            kronik: { tr: "Fraksiyon seçiminde {npc:vahit|e} değil, {npc:deniz_arman|e} ne düşündüğünü sordun; bütün oda sustu.", en: "When the factions came calling, you asked {npc:deniz_arman} what {zamir:deniz_arman|o} thought, not {npc:vahit}. The whole room went quiet." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { deniz_arman: { guven: 5, baglilik: 4 }, vahit: { saygi: -3, korku: 2 } }
            sonraki: "secim_deniz_ses"

      - id: "secim_deniz_ses"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:deniz_arman} bir an {npc:vahit|e} bakıyor; izin ister gibi. {npc:vahit} başını tatlı tatlı eğiyor. \"Kardeşimi arıyorlar,\" diyor {npc:deniz_arman} sonunda. \"Başka kimse aramıyor. Senin de aramadığını söylemiyorum. Ama onlar listeye bakıyor.\"", en: "{npc:deniz_arman} glances at {npc:vahit} for a second, like asking permission. {npc:vahit} tilts his head, sweet as pie. \"They're looking for my sister,\" {npc:deniz_arman} finally says. \"Nobody else is. I'm not saying you aren't. But they've got the list.\"" }
          - { tr: "Sonra, çok alçak sesle, yalnızca senin duyabileceğin kadar: \"Gelirsen ikimiz de burada oluruz. Gelmezsen... gelme. Lütfen.\" Hangisini kastettiğini bilmiyorsun. Belki o da bilmiyor.", en: "Then, so low only you can hear: \"If you come, we're both here. If you don't... don't. Please.\" You don't know which one {zamir:deniz_arman|o} mean{zamir:deniz_arman|s}. Maybe {zamir:deniz_arman|o} {zamir:deniz_arman|does}n't either." }
        secenekler:
          - id: "katil"
            etiket: { tr: "{npc:deniz_arman|in} yanına geç; Yükselenler'e katıl", en: "Stand next to {npc:deniz_arman}. Join the Ascended" }
            kronik: { tr: "{npc:deniz_arman|in} yanında olmak için Yükselenler'e katıldın; ikiniz aynı ışıkta yürüdünüz, aynı yakıtın üstünden.", en: "You joined the Ascended to stand next to {npc:deniz_arman}. You walked in the same light, over the same fuel." }
            etkiler:
              - bayrak: "uye_yukselenler"
              - gorev: { zincir_yukselenler: "basla" }
              - ahlak: { insanlik: -4, merhamet: 1 }
              - itibar: { yukselenler: 12, siginak: -5, sessiz_ag: -3 }
              - iliski: { deniz_arman: { baglilik: 10, guven: 6 }, vahit: { guven: 8, saygi: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:fraksiyon_secimi", agirlik: 45 }
            sonraki: "secim_son"
          - id: "gelme"
            etiket: { tr: "\"Gelmeyeceğim. Ama seni bırakmayacağım.\"", en: "\"I'm not coming. But I'm not letting go of you.\"" }
            kronik: { tr: "{npc:deniz_arman|e} Yükselenler'e gelmeyeceğini ama onu bırakmayacağını söyledin; ikisini de tuttun mu, zaman gösterdi.", en: "You told {npc:deniz_arman} you weren't joining the Ascended, but you weren't letting go of {zamir:deniz_arman|onu} either. Time told whether you kept both." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - iliski: { deniz_arman: { guven: 6, baglilik: 4 }, vahit: { guven: -4 } }
            sonraki: "secim_dinle"

      - id: "secim_sessiz_ag"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:mert_kilic} sonunda klavyeden başını kaldırıyor. \"Sen bir hatasın,\" diyor, iltifat eder gibi. \"Çok güzel bir hata. Bir sistemin nasıl çalıştığını ancak bozulduğu yerden görebilirsin; sen de onun bozulduğu yersin.\"", en: "{npc:mert_kilic} finally looks up from the keyboard. \"You're a bug,\" he says, like it's a compliment. \"A gorgeous bug. You can only see how a system really works from the spot where it breaks, and you're the spot where this one breaks.\"" }
          - { tr: "\"Teklifim basit. Ötekiler seni kullanmak istiyor; ben seni anlamak istiyorum. Karşılığında Sıralama'da görünen seviyeni düşük tutarız, peşindekileri kaydederiz, kafandaki o şeyle ilgili ne bulursak önce sana söyleriz.\"", en: "\"My offer's simple. Everyone else here wants to use you. I want to understand you. In exchange we keep your public level low on the Ranking, log whoever's tailing you, and anything we find about the thing in your head, you hear first.\"" }
          - metin: { tr: "Bir an duraksıyor. \"İstasyondan beri frekansı açık tuttum. Biliyorsun.\"", en: "He pauses a beat. \"I've kept the frequency open since the station. You know that.\"" }
            kosul: { lider_fraksiyon: "sessiz_ag", itibar_min: { sessiz_ag: 15 } }
        sezgiler:
          - kosul: { stat: { per: 28 } }
            metin: { tr: "Ekranında, Sıralama'nın kaynak satırlarından bir kopya açık. Senin adının yanında bir yorum satırı var: \"anomali, kesin\".", en: "There's a copy of the Ranking's source lines open on his screen. Next to your name there's a comment: \"anomaly, confirmed\"." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "beni anlamak istiyor. herkesten önce. bu ya çok iyi ya da çok kötü. henüz karar vermedim.", en: "he wants to understand me. before anyone else does. that's either very good or very bad. i haven't decided yet." }
        secenekler:
          - id: "katil"
            etiket: { tr: "Kulaklığı tak; Sessiz Ağ'a katıl", en: "Put on the earpiece. Join the Quiet Network" }
            kronik: { tr: "Fraksiyon seçiminde Sessiz Ağ'a katıldın; o günden sonra şehirde seni en iyi tanıyanlar, seni hiç görmeyenlerdi.", en: "When the factions came calling, you joined the Quiet Network. After that, the people who knew you best in this city were the ones who'd never seen your face." }
            etkiler:
              - bayrak: "uye_sessiz_ag"
              - gorev: { zincir_sessiz_ag: "basla" }
              - ahlak: { duzen: -6, insanlik: 2 }
              - itibar: { sessiz_ag: 12, lonca: -4, yukselenler: -4 }
              - iliski: { mert_kilic: { guven: 10, saygi: 6, baglilik: 6 }, yanki: { guven: 4 } }
              - gizle: 6
            sonraki: "secim_son"
          - id: "dinle"
            etiket: { tr: "\"Beni anlamak mı? Önce ötekileri dinleyeyim.\"", en: "\"Understand me? Let me hear the others first.\"" }
            kronik: { tr: "{npc:mert_kilic|in} teklifini dinledin ve ekranındaki yorum satırını unutmadın.", en: "You heard {npc:mert_kilic|pos} offer and didn't forget the comment on his screen." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_dinle"
          - id: "yorum"
            etiket: { tr: "Ekranındaki satırı göster: \"Kesin mi?\"", en: "Point at the line on his screen: \"Confirmed?\"" }
            kronik: { tr: "{npc:mert_kilic|in} ekranındaki \"anomali, kesin\" satırını yüzüne okudun; o gün biraz korktu, biraz da hayran kaldı.", en: "You read the \"anomaly, confirmed\" line off {npc:mert_kilic|pos} screen right to his face. He was a little scared that day, and a little starstruck." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - iliski: { mert_kilic: { korku: 4, saygi: 6 } }
            sonraki: "secim_sessiz_ag_yorum"

      - id: "secim_sessiz_ag_yorum"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:mert_kilic} ekranı kapatmıyor; tersine, sana doğru çeviriyor. \"Evet, kesin,\" diyor. \"Görünen seviyenle gerçek seviyen arasındaki fark, Sıralama'nın kendi matematiğinde bir sıfıra bölme hatası üretiyor. Sistem seni hesaplayamıyor.\"", en: "{npc:mert_kilic} doesn't close the screen. He turns it toward you. \"Yeah, confirmed,\" he says. \"The gap between your public level and your real one throws a divide-by-zero in the Ranking's own math. The System can't compute you.\"" }
          - { tr: "\"Bu şehirde bunu bilen bir ben varım,\" diye ekliyor. \"Ve şimdi sen. Bu sırrı benimle paylaşmak ister misin, yoksa bunu sileyim mi?\"", en: "\"I'm the only person in this city who knows that,\" he adds. \"And now you. You want to share that secret with me, or should I delete it?\"" }
        secenekler:
          - id: "katil"
            etiket: { tr: "\"Silme. Paylaşalım.\" Sessiz Ağ'a katıl", en: "\"Don't delete it. We share it.\" Join" }
            kronik: { tr: "Sırrını {npc:mert_kilic|le} paylaşıp Sessiz Ağ'a katıldın; Sistem'in seni hesaplayamadığını bilen iki kişi oldunuz.", en: "You shared your secret with {npc:mert_kilic} and joined the Quiet Network. Two people in the world knew the System couldn't compute you." }
            etkiler:
              - bayrak: "uye_sessiz_ag"
              - gorev: { zincir_sessiz_ag: "basla" }
              - ahlak: { duzen: -5, insanlik: 3 }
              - itibar: { sessiz_ag: 14, lonca: -4, yukselenler: -4 }
              - iliski: { mert_kilic: { guven: 12, baglilik: 8 } }
              - hafiza: { npc: "mert_kilic", id: "olay:fraksiyon_secimi", agirlik: 40 }
              - gizle: 6
            sonraki: "secim_son"
          - id: "sil"
            etiket: { tr: "\"Sil. Sonra ötekileri dinleyeceğim.\"", en: "\"Delete it. Then I'll hear the others.\"" }
            kronik: { tr: "{npc:mert_kilic|e} senin hakkındaki satırı sildirdin; sildi, ama ezberlemişti.", en: "You made {npc:mert_kilic} delete the line about you. He did. He'd already memorized it." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
              - gizle: 4
              - iliski: { mert_kilic: { guven: -2, saygi: 3 } }
            sonraki: "secim_dinle"

      # ---------------------------------------------------------------- Merkez: kararsız kalan
      - id: "secim_dinle"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Balık halinin çatısındaki deliklerden martılar giriyor, tezgâhın üstünde birbirleriyle kavga ediyor. Kimse onları kovmuyor; herkes sana bakmakla meşgul.", en: "Gulls drop in through the holes in the fish market roof and scrap with each other on the counter. Nobody shoos them. Everybody's too busy watching you." }
          - { tr: "Dört sandalye. Dört teklif. Sistem'in panelleri dışarıda, gökyüzünde, kayıtsızca dönüyor; burada verilecek karar onlar için yalnızca bir satır.", en: "Four chairs. Four offers. Out in the sky the System's panels keep turning, couldn't care less. Whatever gets decided in here is one line of text to them." }
        secenekler:
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} sandalyesine dön", en: "Turn back to {npc:elif_sari|pos} chair" }
            kronik: { tr: "Karar verirken yine {npc:elif_sari|e} döndün.", en: "When it came down to it, you turned back to {npc:elif_sari}." }
            etkiler:
              - ahlak: { merhamet: 1 }
            sonraki: "secim_siginak"
          - id: "kaya"
            etiket: { tr: "{npc:kaya_demir|in} duvarına dön", en: "Turn back to {npc:kaya_demir|pos} wall" }
            kronik: { tr: "Karar verirken yine {npc:kaya_demir|e} döndün.", en: "When it came down to it, you turned back to {npc:kaya_demir}." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "secim_lonca"
          - id: "vahit"
            etiket: { tr: "{npc:vahit|in} ışığına dön", en: "Turn back to {npc:vahit|pos} light" }
            kronik: { tr: "Karar verirken yine {npc:vahit|e} döndün.", en: "When it came down to it, you turned back to {npc:vahit}." }
            etkiler:
              - ahlak: { insanlik: -1 }
            sonraki: "secim_yukselenler"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|in} ekranına dön", en: "Turn back to {npc:mert_kilic|pos} screen" }
            kronik: { tr: "Karar verirken yine {npc:mert_kilic|e} döndün.", en: "When it came down to it, you turned back to {npc:mert_kilic}." }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "secim_sessiz_ag"
          - id: "hicbiri"
            etiket: { tr: "Dördüne de hayır de", en: "Tell all four of them no" }
            kronik: { tr: "Dört sandalyeyi de dinledin ve dördüne de hayır dedin.", en: "You heard out all four chairs and told every one of them no." }
            etkiler:
              - ahlak: { duzen: -3 }
            sonraki: "secim_yalniz"

      - id: "secim_masa"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Tezgâhın ortasına geçiyorsun ve kimse bir şey söylemeden dört sandalye çekiyorsun. {npc:kaya_demir} ilk kez duvardan ayrılıp oturuyor; {npc:vahit|in} müritleri kımıldamaya cesaret edemiyor. {npc:mert_kilic} dizüstünü kapatıyor.", en: "You walk to the middle of the counter and, without anybody saying a word, pull out four chairs. {npc:kaya_demir} comes off the wall and sits for the first time. {npc:vahit|pos} followers don't dare move. {npc:mert_kilic} closes his laptop." }
          - { tr: "\"Hiçbirinizin değilim,\" diyorsun. \"Ama bu şehir yandığında, hepinizin yanında olacağım. Karşılığında birbirinizi öldürmeyeceksiniz. {yer:kordon|in} kapısı taşmadan önce değil; ben buradayken hiç değil.\"", en: "\"I'm not any of yours,\" you say. \"But when this city catches fire, I'll be standing next to every one of you. In exchange, you don't kill each other. Not before {yer:kordon} Gate blows. Not while I'm here, period.\"" }
          - { tr: "Uzun bir sessizlik. Sonra {npc:elif_sari} termosunun kapağına çay dolduruyor ve masanın ortasına koyuyor. Dördü de, birer birer, ondan bir yudum alıyor.", en: "A long silence. Then {npc:elif_sari} pours tea into the thermos cap and sets it in the middle of the table. One by one, all four of them take a sip." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dört tasma. sen hepsini tutuyorsun şimdi. bu da bir tasma. ama ucu sende.", en: "four leashes. you're holding all of them now. that's a leash too. but you've got the end of it." }
        secenekler:
          - id: "ozgur"
            etiket: { tr: "Kalk; hepsini sana borçlu bırak", en: "Get up. Leave all four owing you" }
            kronik: { tr: "Dört kampı aynı çaydan içirdin ve hiçbirine bağlanmadın; {yer:kiyikent} o barışı adınla andı.", en: "You made all four camps drink from the same cup and joined none of them. {yer:kiyikent} called that truce by your name." }
            etkiler:
              - bayrak: "uye_yok"
              - bayrak: "secim_dort_masa"
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 4, lonca: 4, yukselenler: 3, sessiz_ag: 4 }
              - xp_seviye: 30
            sonraki: "secim_son"
          - id: "sec"
            etiket: { tr: "Masayı kurdun; şimdi bir sandalye seç", en: "You built the table. Now pick a chair" }
            kronik: { tr: "Dört kampı aynı masaya oturttun, sonra yine de birini seçmeye karar verdin.", en: "You sat all four camps at one table, then decided to pick one anyway." }
            etkiler:
              - ahlak: { duzen: 1 }
              - itibar: { siginak: 2, lonca: 2, yukselenler: 2, sessiz_ag: 2 }
            sonraki: "secim_dinle"

      - id: "secim_yalniz"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Kapıya doğru yürüyorsun. Kimse seni durdurmuyor; durduramayacaklarını biliyorlar ve bunu söylemenin daha da kötü olacağını da.", en: "You head for the door. Nobody stops you. They know they can't, and they know saying so out loud would be worse." }
          - { tr: "\"Yalnız kurtlar kışı çıkaramaz,\" diyor {npc:kaya_demir} arkandan. {npc:elif_sari} hiçbir şey söylemiyor ama termosu kapatırken elleri ilk kez titriyor. {npc:vahit} gülümsüyor: \"Seçilmişler seçmez. Seçilir.\"", en: "\"Lone wolves don't make it through the winter,\" {npc:kaya_demir} says to your back. {npc:elif_sari} doesn't say anything, but when she screws the thermos shut her hands shake for the first time. {npc:vahit} smiles: \"The chosen don't choose. They're chosen.\"" }
          - { tr: "{npc:mert_kilic} yalnızca bir tuşa basıyor. Cebindeki telsiz bir kez cızırdıyor: üç kısa, bir uzun. Frekans hâlâ açık.", en: "{npc:mert_kilic} just hits one key. The radio in your pocket crackles once: three short, one long. The frequency's still open." }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Arkana bakmadan çık", en: "Walk out without looking back" }
            kronik: { tr: "Fraksiyon seçiminde hiçbirine katılmadın; {yer:kiyikent} seni o günden sonra yalnız kurt diye andı.", en: "When the factions came calling, you joined none of them. After that, {yer:kiyikent} called you the lone wolf." }
            etkiler:
              - bayrak: "uye_yok"
              - ahlak: { duzen: -4, insanlik: 1 }
              - itibar: { siginak: -2, lonca: -3, yukselenler: -2, sessiz_ag: -1 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "kapi"
            etiket: { tr: "Kapıda dön: \"Çağırırsanız gelirim.\"", en: "Turn at the door: \"Call me, I'll come.\"" }
            kronik: { tr: "Hiçbir kampa katılmadın ama kapıda dönüp çağrılırsan geleceğini söyledin; dördü de bu sözü bir gün kullandı.", en: "You didn't join any camp, but at the door you turned and said you'd come if they called. All four took you up on it someday." }
            etkiler:
              - bayrak: "uye_yok"
              - ahlak: { merhamet: 3, duzen: -2 }
              - itibar: { siginak: 2, lonca: 1, yukselenler: 1, sessiz_ag: 2 }
              - iliski: { elif_sari: { guven: 3 }, kaya_demir: { saygi: 2 } }
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      # ---------------------------------------------------------------- Sonuç
      - id: "secim_son"
        yer: "kiyikent_liman"
        paragraflar:
          - metin: { tr: "{npc:elif_sari} ayağa kalkıp sana elini uzatıyor ve elini sıkarken, yalnızca senin duyacağın kadar alçak sesle, \"Teşekkür ederim,\" diyor. {npc:kaya_demir} başını bir kez sallıyor: hoşuna gitmedi ama saygı duyuyor.", en: "{npc:elif_sari} stands and offers you her hand, and as you shake it she says, quiet enough that only you hear, \"Thank you.\" {npc:kaya_demir} nods once. He doesn't like it, but he respects it." }
            kosul: { bayrak: "uye_siginak" }
          - metin: { tr: "{npc:kaya_demir} elini omzuna koyup sıkıyor; bir babanın değil, bir çavuşun eli. Tezgâhın öbür ucunda {npc:elif_sari} termosunu topluyor ve sana bakmıyor.", en: "{npc:kaya_demir} claps a hand on your shoulder and squeezes. Not a father's hand. A drill sergeant's. At the other end of the counter {npc:elif_sari} packs up her thermos and doesn't look at you." }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "{npc:vahit|in} müritleri ilahiye başlıyor ve adın ilk kez bir dua gibi tekrarlanıyor. {npc:elif_sari} kapıdan çıkarken durup sana dönüyor; yüzündeki şey öfke değil, yas.", en: "{npc:vahit|pos} followers start up a hymn, and for the first time your name gets repeated like a prayer. On her way out the door, {npc:elif_sari} stops and turns back to you. What's on her face isn't anger. It's grief." }
            kosul: { bayrak: "uye_yukselenler" }
          - metin: { tr: "{npc:mert_kilic} sana bir kulaklık uzatıyor; içinde çok uzaklardan gelen bir parazit. \"Hoş geldin,\" diyor. \"Bundan sonra seni duyan herkes önce bizden geçecek.\" {npc:kaya_demir} radyocuya kısa, soğuk bir bakış atıyor.", en: "{npc:mert_kilic} hands you an earpiece with static from somewhere very far away in it. \"Welcome aboard,\" he says. \"From now on, anyone who hears you goes through us first.\" {npc:kaya_demir} gives the radio geek one short, cold look." }
            kosul: { bayrak: "uye_sessiz_ag" }
          - metin: { tr: "Dördü de aynı anda kalkıyor ve birbirlerinden önce kapıdan çıkmamaya özen gösteriyor. Ortada çayı içilmiş bir kapak kalıyor; ve aralarında şimdilik bir barış.", en: "All four stand at the same time, each careful not to make it out the door before the others. What's left in the middle is an empty cup, and between them, for now, a truce." }
            kosul: { bayrak: "secim_dort_masa" }
          - { tr: "Dışarıda, gökyüzündeki panellerden biri bir an kayıyor ve yerine dönüyor. Sistem not aldı.", en: "Outside, one of the panels in the sky slides over for a second and slides back. The System took a note." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bağlılık kaydedildi]", en: "[Allegiance logged]" }
            satirlar:
              - { tr: "Fraksiyon: Sığınak Konseyi.", en: "Faction: Haven Council." }
            kosul: { bayrak: "uye_siginak" }
          - tur: "sistem"
            baslik: { tr: "[Bağlılık kaydedildi]", en: "[Allegiance logged]" }
            satirlar:
              - { tr: "Fraksiyon: Demir Lonca.", en: "Faction: Iron Guild." }
            kosul: { bayrak: "uye_lonca" }
          - tur: "sistem"
            baslik: { tr: "[Bağlılık kaydedildi]", en: "[Allegiance logged]" }
            satirlar:
              - { tr: "Fraksiyon: Yükselenler.", en: "Faction: The Ascended." }
            kosul: { bayrak: "uye_yukselenler" }
          - tur: "sistem"
            baslik: { tr: "[Bağlılık kaydedildi]", en: "[Allegiance logged]" }
            satirlar:
              - { tr: "Fraksiyon: [kayıt bulunamadı].", en: "Faction: [record not found]." }
            kosul: { bayrak: "uye_sessiz_ag" }
          - tur: "sistem"
            baslik: { tr: "[Bağlılık kaydedildi]", en: "[Allegiance logged]" }
            satirlar:
              - { tr: "Fraksiyon: yok. Herkesin alacaklısı.", en: "Faction: none. Creditor to all." }
            kosul: { bayrak: "secim_dort_masa" }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "uye_yukselenler" }
            metin: { tr: "\"Yakıt. Yakıt dedi. Duydun mu? İnsanlara yakıt dedi.\"", en: "\"Fuel. He said fuel. Did you hear him? He called people fuel.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "uye_siginak" }
            metin: { tr: "\"İyi. Bu iyi. İlk kez içim rahat.\"", en: "\"Good. That's good. First time I've breathed easy in weeks.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari", bayrak_yok: "uye_siginak" }
            metin: { tr: "\"Kararına saygı duyuyorum. Ama gece nöbetlerinde seni özleyeceğim.\"", en: "\"I respect your call. I'm still going to miss you on the night shifts.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic", bayrak: "uye_lonca" }
            metin: { tr: "\"Lonca. Harika. Turuncu bant kesinlikle... sana yakışır. Sanırım.\"", en: "\"The Guild. Great. The orange armband totally... suits you. I guess.\"" }
        secenekler:
          - id: "basla"
            etiket: { tr: "Yeni rozetini tak; işe başla", en: "Put on your new colors. Get to work" }
            kronik: { tr: "Seçimini yaptın ve aynı gün işe başladın; ne kadar uzağa gideceğini o gün kimse bilmiyordu.", en: "You made your choice and went to work the same day. Nobody knew then how far it would take you." }
            etkiler:
              - ahlak: { duzen: 2 }
              - xp_seviye: 20
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "kapi"
            etiket: { tr: "Reddettiklerine dön: \"Kapım kapalı değil.\"", en: "Turn to the ones you passed on: \"My door's open.\"" }
            kronik: { tr: "Seçimini yaptıktan sonra reddettiğin kamplara kapını kapatmadığını söyledin; bazıları bunu bir gün hatırlattı.", en: "After you chose, you told the camps you'd passed on that your door wasn't shut. Some of them reminded you of that someday." }
            etkiler:
              - ahlak: { merhamet: 2 }
              - itibar: { siginak: 2, lonca: 2, yukselenler: 1, sessiz_ag: 2 }
              - xp_seviye: 20
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "deniz_saf"
            etiket: { tr: "{npc:deniz_arman|e} dön: \"Artık aynı saftayız.\"", en: "Turn to {npc:deniz_arman}: \"Same side now.\"" }
            goster: { bayrak: ["uye_yukselenler", "deniz_yukselenlere_gitti"], npc_hayatta: "deniz_arman" }
            kronik: { tr: "Yükselenler'de {npc:deniz_arman|le} aynı safa geçtin; {zamir:deniz_arman|o} o gün ilk kez gülümsedi, ama gözleri gülmedi.", en: "You and {npc:deniz_arman} ended up on the same side in the Ascended. {zamir:deniz_arman|b} smiled that day for the first time in weeks. {zamir:deniz_arman|onun|b} eyes didn't." }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: 1 }
              - iliski: { deniz_arman: { baglilik: 6, guven: 3 } }
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "deniz_bakis"
            etiket: { tr: "{npc:deniz_arman|in} bakışına dayan", en: "Hold {npc:deniz_arman|pos} stare" }
            goster: { bayrak: "uye_yukselenler", yoldas: "deniz_arman" }
            kronik: { tr: "Yükselenler'e katıldığın gün {npc:deniz_arman|in} bakışına dayandın; {zamir:deniz_arman|o} o bakışı hiç geri almadı.", en: "The day you joined the Ascended, you held {npc:deniz_arman|pos} stare. {zamir:deniz_arman|b} never took that look back." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: 1 }
              - iliski: { deniz_arman: { guven: -8, korku: 4 } }
              - tohum: { olay: "secimin_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

  # ================================================================== KASABA ÇEKİRDEĞİ (ana yay 60)
  - id: "kasaba_cekirdegi"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "cekirdek", "boss", "siyaset"]
    gerilim: 4
    ana_yay: { gun: 60 }
    onemli: true
    kart: { tr: "On üçüncü vuruş", en: "The thirteenth stroke" }
    sahne: "cekirdek_1"
    sahneler:
      - id: "cekirdek_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{yer:eski_sehir|in} saat kulesi kırk yıldır beş dakika geri çalıyordu. Bu öğlen on üçü vuruyor ve hükümet konağının önündeki meydanın taşları, sesle birlikte, bir nefes alır gibi kabarıyor.", en: "The clock tower in {yer:eski_sehir} has run five minutes slow for forty years. This noon it strikes thirteen, and the paving stones in front of the old courthouse swell with the sound, like something underneath just took a breath." }
          - { tr: "Meydanın ortasından bir kristal yükseliyor; bir insan boyunda, içinde mavi bir ışık, ışığın içinde bütün şehrin haritası. Sonra taşlar birbirine kenetlenip ayağa kalkıyor ve kristalin önünde, göğsünde sarkaç sallanan bir muhafız beliriyor.", en: "A crystal pushes up out of the middle of the square, as tall as a person, a blue light inside it and the map of the whole city inside the light. Then the stones lock together and stand up, and in front of the crystal there's a guardian with a pendulum swinging in its chest." }
          - { tr: "Bir saat geçmeden meydanın dört köşesi doluyor: Sığınak'ın sedyeleri, Lonca'nın turuncu bantlı tüfekleri, Yükselenler'in mumları, Sessiz Ağ'ın çatılara dizilmiş antenleri. Herkes kristale bakıyor. Herkes birbirine bakıyor.", en: "Inside an hour all four corners of the square fill up: the Haven's stretchers, the Guild's orange-banded rifles, the Ascended's candles, the Quiet Network's antennas lined up on the rooftops. Everybody's looking at the crystal. Everybody's looking at each other." }
          - metin: { tr: "Senin kampının insanları sana dönüyor. Kimse bir şey söylemiyor; söylemelerine gerek yok.", en: "The people in your camp turn to look at you. Nobody says a word. They don't have to." }
            kosul: { bayrak_yok: ["uye_yok"] }
          - metin: { tr: "Dört kamp da sana bakıyor; balık halinde kurduğun masa, bu sabah bir silah kabzası kadar ince.", en: "All four camps are looking at you. The table you set up in the fish market feels about as thick as a rifle stock this morning." }
            kosul: { bayrak: "secim_dort_masa" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KASABA ÇEKİRDEĞİ BELİRDİ]", en: "[TOWN CORE MANIFESTED]" }
            satirlar:
              - { tr: "Bölge: {yer:kiyikent}. Bağlanan yönetir.", en: "Region: {yer:kiyikent}. Whoever binds it, governs." }
              - { tr: "Muhafız etkin. Adaylar sırayla gelsin. Gelmeyecekler; biliyoruz.", en: "Guardian active. Candidates, please form a line. You won't. We know." }
        sezgiler:
          - kosul: { stat: { per: 34 } }
            metin: { tr: "Çatılardaki antenler kristale değil muhafıza yönelik. Sessiz Ağ çekirdeği bağlamak istemiyor; açmak istiyor.", en: "The antennas on the rooftops aren't pointed at the crystal. They're pointed at the guardian. The Quiet Network doesn't want to bind the Core. They want to crack it open." }
          - kosul: { stat: { wis: 34 } }
            metin: { tr: "Muhafız bağlanmadan kimse kristale dokunamaz. Muhafızı kim indirirse, ilk dokunuş onundur; gerisi siyaset.", en: "Nobody touches the crystal until the guardian's down. Whoever drops it gets the first touch. Everything after that is politics." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o kristal konuşuyor. benim dilimde. ne dediğini sonra söyleyeceğim. önce bitir şunu.", en: "that crystal's talking. in my language. i'll tell you what it's saying later. finish this first." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Kim alırsa alsın, ilk iş insanlara su versinler. Söz ver bana.\"", en: "\"Whoever gets it, first thing they do is get people water. Promise me.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"O muhafızla dövüşürken meydanda kimse ölmesin. Yeter ki bu.\"", en: "\"Just don't let anybody in this square die while you fight that thing. That's all I ask.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Bir dakika. Bir dakika ver bana o kristalle. Tek bir dakika.\"", en: "\"One minute. Give me one minute with that crystal. Just one.\"" }
        secenekler:
          - id: "yuru"
            etiket: { tr: "Meydanın ortasına yürü; muhafız senin", en: "Walk into the middle. The guardian's yours" }
            kronik: { tr: "Kasaba Çekirdeği'nin muhafızına dört kampın gözü önünde tek başına yürüdün.", en: "You walked out to the Town Core's guardian alone, in front of all four camps." }
            etkiler:
              - ahlak: { duzen: 3 }
              - dikkat: 3
              - savas: { dusmanlar: ["cekirdek_muhafizi@oyuncu+4"], kazan: "cekirdek_zafer", kaybet: "cekirdek_yenilgi" }
          - id: "kule"
            tur: "gosteris"
            etiket: { tr: "Saat kulesini muhafızın üstüne devir", en: "Bring the clock tower down on the guardian" }
            gerekli: { stat: { str: 42 } }
            kronik: { tr: "Kırk yıldır beş dakika geri çalan saat kulesini, Çekirdek'in muhafızının üstüne kendi ellerinle devirdin.", en: "You brought down the clock tower that ran five minutes slow for forty years, on top of the Core's guardian, with your own hands." }
            etkiler:
              - ahlak: { duzen: -3, merhamet: -1 }
              - dikkat: 6
              - itibar: { lonca: 4, yukselenler: 4, siginak: -3 }
            sonraki: "cekirdek_ezme"
          - id: "golge"
            tur: "gizle"
            etiket: { tr: "Kamplar dövüşsün; son darbeyi sen vur", en: "Let the camps fight it. You land the last hit" }
            kronik: { tr: "Kasaba Çekirdeği için dört kampı muhafızın önüne sürdün ve son darbeyi gölgeden vurdun; meydanda ölenlerin adları senin değil, onların defterine yazıldı.", en: "You let all four camps throw themselves at the Core's guardian and landed the last hit from the shadows. The names of the dead went in their ledgers, not yours." }
            etkiler:
              - gizle: 6
              - ahlak: { merhamet: -6, insanlik: -2 }
              - degisken: { hayatta_kalan: -3 }
              - savas: { dusmanlar: ["cekirdek_muhafizi@oyuncu+1"], ortam: ["karanlik"], kazan: "cekirdek_zafer", kaybet: "cekirdek_yenilgi" }
          - id: "birlikte"
            etiket: { tr: "Ateşkesi hatırlat; muhafızı birlikte indirin", en: "Remind them of the truce. Drop it together" }
            goster: { bayrak: "secim_dort_masa" }
            kronik: { tr: "Balık halindeki ateşkesi meydanda hatırlattın; dört kamp ilk ve son kez aynı düşmana birlikte vurdu.", en: "You called in the fish-market truce right there in the square. For the first and last time, all four camps hit the same enemy together." }
            etkiler:
              - ahlak: { duzen: 4, merhamet: 2 }
              - itibar: { siginak: 3, lonca: 3, yukselenler: 3, sessiz_ag: 3 }
              - iliski: { kaya_demir: { saygi: 4 }, elif_sari: { guven: 4 } }
              - savas: { dusmanlar: ["cekirdek_muhafizi@oyuncu+2"], kazan: "cekirdek_zafer", kaybet: "cekirdek_yenilgi" }
          - id: "sivil"
            etiket: { tr: "Önce meydandaki sivilleri çıkar, sonra dövüş", en: "Clear the civilians out first. Then fight" }
            kronik: { tr: "Çekirdek'in muhafızıyla dövüşmeden önce meydandaki sivilleri tek tek çıkardın; o gün meydanda sivil ölmedi.", en: "Before you fought the Core's guardian, you got every civilian out of the square one by one. No civilians died there that day." }
            etkiler:
              - ahlak: { merhamet: 5, insanlik: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 4 }
              - iliski: { deniz_arman: { guven: 4 }, elif_sari: { saygi: 4 } }
              - savas: { dusmanlar: ["cekirdek_muhafizi@oyuncu+5"], kazan: "cekirdek_zafer", kaybet: "cekirdek_yenilgi" }

      - id: "cekirdek_ezme"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Kulenin temeline omzunu dayıyorsun. Taş önce direniyor, sonra inliyor, sonra kırk yıllık saat bütün dişlileriyle birlikte muhafızın üstüne devriliyor.", en: "You set your shoulder to the base of the tower. The stone resists, then groans, and then forty years of clock comes down on the guardian, gears and all." }
          - { tr: "Toz dağıldığında muhafızdan geriye bir yığın taş ve hâlâ sallanan bir sarkaç kalıyor. Meydanın dört köşesinde kimse kıpırdamıyor; tüfekler, mumlar, sedyeler havada asılı.", en: "When the dust clears, all that's left of the guardian is a pile of rock and a pendulum still swinging. Nobody in any corner of the square moves. Rifles, candles, stretchers, all hanging in midair." }
          - { tr: "Enkazın üstünden kristale yürüyorsun ve kristal, sen dokunmadan, senin için ışıyor.", en: "You walk across the rubble to the crystal, and it lights up for you before you even touch it." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kristalin önünde dur", en: "Stand in front of the crystal" }
            kronik: { tr: "Saat kulesinin enkazı üstünden Çekirdek'e yürüdün; meydanda kimse sesini çıkaramadı.", en: "You walked over the wreck of the clock tower to the Core, and nobody in the square made a sound." }
            etkiler:
              - ahlak: { duzen: 1 }
              - esya: { saat_tasi: 1 }
              - xp_seviye: 60
            sonraki: "cekirdek_zafer"

      - id: "cekirdek_zafer"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Muhafızın son dişlisi taşların arasına yuvarlanıyor. Kristalin içindeki şehir haritası bir an kararıyor, sonra yeniden yanıyor; bu kez her mahallenin üstünde bir soru işareti var.", en: "The guardian's last gear rolls away between the stones. The city map inside the crystal goes dark for a second, then lights back up, and this time there's a question mark over every neighborhood." }
          - { tr: "Dört lider meydanın ortasına yürüyor ve senden üç adım ötede duruyor; daha yakına gelmeye kimse cesaret edemiyor.", en: "The four leaders walk out to the middle of the square and stop three steps away from you. None of them has the nerve to come closer." }
          - { tr: "\"Konsey'e bağla,\" diyor {npc:elif_sari}. \"Herkes oy versin.\" {npc:kaya_demir}: \"Lonca tutar. Oyla değil, nöbetle.\" {npc:vahit}: \"Bu bir sunak. Sunağın rahibi olur.\" {npc:mert_kilic} hiçbir şey demiyor; yalnızca kablosunu sana uzatıyor.", en: "\"Bind it to the Council,\" {npc:elif_sari} says. \"Everybody votes.\" {npc:kaya_demir}: \"The Guild holds it. Not with votes. With a watch rotation.\" {npc:vahit}: \"It's an altar. An altar needs a priest.\" {npc:mert_kilic} doesn't say anything. He just holds his cable out to you." }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[BAĞLANTI ADAYI: {oyuncu}]", en: "[BINDING CANDIDATE: {oyuncu}]" }
            satirlar:
              - { tr: "Aday bağlantıyı devredebilir. Devredilen bağlantı geri alınamaz.", en: "Candidate may transfer binding. Transferred bindings cannot be reclaimed." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kendine bağla. bir şehrin kalbi. bunu bir daha kimse teklif etmez. ama bağlanan, bağlandığı yerden de görünür. düşün.", en: "bind it to yourself. a city's heart. nobody's ever going to offer that twice. but whatever binds gets seen from wherever it's bound. think about it." }
          - kosul: { stat: { cha: 36 } }
            metin: { tr: "Kime verirsen ver, öbür üçü bunu unutmayacak. Kendine alırsan, dördü de.", en: "Whoever you give it to, the other three won't forget. Keep it yourself and none of the four will." }
        secenekler:
          - id: "siginak"
            etiket: { tr: "Çekirdeği Konsey'e bağla", en: "Bind the Core to the Council" }
            kronik: { tr: "Kasaba Çekirdeği'ni Sığınak Konseyi'ne bağladın; {yer:eski_sehir} her kararı oyla almaya başladı, yavaş ama birlikte.", en: "You bound the Town Core to the Haven Council. {yer:eski_sehir} started deciding everything by vote. Slowly, but together." }
            etkiler:
              - bayrak: "cekirdek_siginak"
              - kontrol: { eski_sehir: "siginak" }
              - tehlike: { eski_sehir: -10 }
              - ahlak: { merhamet: 4, duzen: 2, insanlik: 3 }
              - itibar: { siginak: 12, lonca: -5, yukselenler: -5 }
              - iliski: { elif_sari: { guven: 8, baglilik: 6 }, kaya_demir: { saygi: -4 } }
              - degisken: { hayatta_kalan: 2 }
              - xp_seviye: 50
            sonraki: "cekirdek_son"
          - id: "lonca"
            etiket: { tr: "Çekirdeği Lonca'ya bağla", en: "Bind the Core to the Guild" }
            kronik: { tr: "Kasaba Çekirdeği'ni Demir Lonca'ya bağladın; {yer:eski_sehir|in} sokaklarında nöbet kulübeleri, kapılarında sicil defterleri belirdi.", en: "You bound the Town Core to the Iron Guild. Guard booths went up on the streets of {yer:eski_sehir}, and ledgers showed up at every door." }
            etkiler:
              - bayrak: "cekirdek_lonca"
              - kontrol: { eski_sehir: "lonca" }
              - tehlike: { eski_sehir: -15 }
              - ahlak: { duzen: 6, merhamet: -2 }
              - itibar: { lonca: 12, siginak: -5, sessiz_ag: -5 }
              - iliski: { kaya_demir: { guven: 8, saygi: 6 }, elif_sari: { guven: -4 } }
              - xp_seviye: 50
            sonraki: "cekirdek_son"
          - id: "yukselenler"
            etiket: { tr: "Çekirdeği Yükselenler'in sunağı yap", en: "Make the Core the Ascended's altar" }
            kronik: { tr: "Kasaba Çekirdeği'ni Yükselenler'e verdin; meydanda her gece mumlar yandı ve her sabah birinin adı listeden silindi.", en: "You gave the Town Core to the Ascended. Candles burned in the square every night, and every morning somebody's name came off the list." }
            etkiler:
              - bayrak: "cekirdek_yukselenler"
              - kontrol: { eski_sehir: "yukselenler" }
              - ahlak: { insanlik: -6, merhamet: -3 }
              - itibar: { yukselenler: 12, siginak: -6, sessiz_ag: -4 }
              - iliski: { vahit: { guven: 8, baglilik: 6 }, elif_sari: { guven: -6 }, deniz_arman: { guven: -3 } }
              - degisken: { hayatta_kalan: -2 }
              - xp_seviye: 50
            sonraki: "cekirdek_son"
          - id: "sessiz_ag"
            etiket: { tr: "Kabloyu al; Sessiz Ağ çekirdeği açsın", en: "Take the cable. Let the Network crack it open" }
            kronik: { tr: "Kasaba Çekirdeği'ni kimseye bağlamadın; {npc:mert_kilic|in} kablosunu taktın ve şehrin kalbi bir araştırma masasına dönüştü.", en: "You didn't bind the Town Core to anyone. You plugged in {npc:mert_kilic|pos} cable, and the city's heart turned into a lab bench." }
            etkiler:
              - bayrak: "cekirdek_sessiz_ag"
              - kontrol: { eski_sehir: "sessiz_ag" }
              - ahlak: { duzen: -5, insanlik: 2 }
              - itibar: { sessiz_ag: 12, lonca: -5, yukselenler: -5 }
              - iliski: { mert_kilic: { guven: 8, baglilik: 6 }, kaya_demir: { saygi: -3 }, yanki: { guven: 3 } }
              - xp_seviye: 50
            sonraki: "cekirdek_son"
          - id: "kendin"
            tur: "aciga_vur"
            etiket: { tr: "Elini kristale koy; şehir senin", en: "Put your hand on the crystal. The city's yours" }
            kronik: { tr: "Kasaba Çekirdeği'ni kendine bağladın; o günden sonra {yer:kiyikent|in} kalbi senin nabzınla attı ve dört kamp bunu hiç affetmedi.", en: "You bound the Town Core to yourself. From then on, {yer:kiyikent|pos} heart beat on your pulse, and the four camps never forgave you for it." }
            etkiler:
              - aciga_vur: true
              - bayrak: "cekirdek_oyuncu"
              - unvan: "cekirdek_efendisi"
              - tehlike: { eski_sehir: -20 }
              - ahlak: { duzen: 3, insanlik: -4 }
              - itibar: { siginak: -4, lonca: -4, yukselenler: 2, sessiz_ag: -4 }
              - iliski: { kaya_demir: { saygi: 6, guven: -6 }, elif_sari: { korku: 6 }, yanki: { guven: 6, baglilik: 4 } }
              - dikkat: 8
              - xp_seviye: 70
              - tohum: { olay: "dikkat_75_p2", gecikme: { min: 2, max: 5 }, kosul: { dikkat_min: 60 } }
            sonraki: "cekirdek_son"

      - id: "cekirdek_yenilgi"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Sarkaç göğsüne iniyor ve on üçüncü vuruş seni meydanın taşlarına yapıştırıyor. Gözlerinin önünde turuncu bantlı postallar koşuyor.", en: "The pendulum lands square in your chest, and the thirteenth stroke pins you to the stones. Orange-banded boots run past your face." }
          - { tr: "Kendine geldiğinde muhafız dağılmış; {npc:kaya_demir|in} adamları onu senin açtığın yaralardan söküp indirmiş. Kristal Lonca'ya bağlanmış bile. {npc:kaya_demir} sana elini uzatıyor.", en: "When you come to, the guardian's in pieces. {npc:kaya_demir|pos} people pried it apart through the holes you opened. The crystal's already bound to the Guild. {npc:kaya_demir} is holding out a hand to you." }
          - { tr: "\"İyi açtın,\" diyor. \"Biz kapattık. Lonca böyle çalışır.\"", en: "\"You opened it up good,\" he says. \"We closed it out. That's how the Guild works.\"" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[Bağlantı devredildi]", en: "[Binding assigned]" }
            satirlar:
              - { tr: "Kasaba Çekirdeği: Demir Lonca.", en: "Town Core: Iron Guild." }
        secenekler:
          - id: "el"
            etiket: { tr: "Elini tut ve kalk", en: "Take his hand. Get up" }
            kronik: { tr: "Kasaba Çekirdeği için düştün ve Lonca onu senin açtığın yaradan aldı; {npc:kaya_demir|in} elini tutup kalktın.", en: "You went down fighting for the Town Core, and the Guild took it through the opening you made. You took {npc:kaya_demir|pos} hand and got up." }
            etkiler:
              - bayrak: "cekirdek_lonca"
              - kontrol: { eski_sehir: "lonca" }
              - tehlike: { eski_sehir: -15 }
              - ahlak: { duzen: 3 }
              - itibar: { lonca: 6 }
              - iliski: { kaya_demir: { saygi: 4, guven: 4 } }
            sonraki: "cekirdek_son"
          - id: "kendin"
            etiket: { tr: "Elini itip kendi başına kalk", en: "Push his hand away. Get up on your own" }
            kronik: { tr: "Kasaba Çekirdeği'ni Lonca'ya kaybettin ve {npc:kaya_demir|in} uzattığı eli itip kendi başına kalktın.", en: "You lost the Town Core to the Guild, pushed away the hand {npc:kaya_demir} offered and got up on your own." }
            etkiler:
              - bayrak: "cekirdek_lonca"
              - kontrol: { eski_sehir: "lonca" }
              - ahlak: { duzen: -3, insanlik: -1 }
              - iliski: { kaya_demir: { saygi: -3, guven: -4 } }
              - stat: { wil: 1 }
            sonraki: "cekirdek_son"

      - id: "cekirdek_son"
        yer: "eski_sehir"
        paragraflar:
          - metin: { tr: "Kristalin haritasındaki soru işaretleri tek tek beyaz bir çarpıya dönüşüyor: hastane, okul, su. Akşam {npc:elif_sari} meydanda ilk konsey oturumunu açıyor; oy sayımı sabaha kadar sürüyor ve kimse şikâyet etmiyor.", en: "One by one the question marks on the crystal's map turn into white crosses: clinic, school, water. That evening {npc:elif_sari} opens the first Council session right in the square. The vote count runs till dawn, and nobody complains." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Haritadaki her mahallenin üstüne turuncu bir nöbet çizelgesi düşüyor. Ertesi sabah {yer:eski_sehir|de} sokaklar daha güvenli ve daha sessiz; ikisi aynı şey değil.", en: "An orange watch roster drops over every neighborhood on the map. The next morning the streets of {yer:eski_sehir} are safer and quieter, which isn't the same thing." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Kristalin çevresine beyaz örtüler seriliyor. {npc:vahit} haritanın üstüne bir liste yansıtıyor; listenin başlığı \"Seçilmişler\", altında başlıksız, çok daha uzun ikinci bir liste var.", en: "White cloths get laid out around the crystal. {npc:vahit} projects a list over the map, titled \"The Chosen\". Under it there's a second list, no title, a lot longer." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Kristale on yedi kablo bağlanıyor. Harita yerine akan satırlar beliriyor ve {npc:mert_kilic} ilk kez, gerçekten, gülüyor. Şehri kimse yönetmiyor; ama şehrin kalbinin ne yazdığını birileri okuyor.", en: "Seventeen cables get plugged into the crystal. The map gives way to scrolling lines, and for the first time, really, {npc:mert_kilic} laughs. Nobody's running the city. But somebody's reading what its heart writes." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Kristal avucunun altında ısınıyor ve bir an şehrin bütün sokaklarını aynı anda hissediyorsun: bir çocuğun koşusu, bir kapının kapanışı, {yer:kordon|de}ki kapının sabırsız nabzı. Dört kamp meydanı sessizce terk ediyor; hiçbiri arkasını tam dönmüyor.", en: "The crystal warms under your palm, and for one moment you feel every street in the city at once: a kid running, a door closing, the impatient pulse of the Gate on {yer:kordon}. The four camps leave the square without a word. None of them quite turns their back on you." }
            kosul: { bayrak: "cekirdek_oyuncu" }
          - { tr: "Saat kulesi, ya da kulenin kalıntısı, bundan sonra hep doğru saati gösterecek. Kimse bunun iyi bir işaret olup olmadığını bilmiyor.", en: "From now on, the clock tower, or what's left of it, will always tell the right time. Nobody knows if that's a good sign." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kristalin içinde bir satır var. en altta. bir başlık gibi. henüz okuyamıyorum. bir gün okuyacağım. o gün sen yanımda ol.", en: "there's a line inside the crystal. way at the bottom. like a header. i can't read it yet. someday i will. be there when i do." }
        secenekler:
          - id: "ayril"
            etiket: { tr: "Meydandan ayrıl; şehir kendi işine baksın", en: "Leave the square. Let the city get on with it" }
            kronik: { tr: "Çekirdek'in kaderini belirledikten sonra meydandan ayrıldın ve arkana bakmadın.", en: "Once you'd settled the Core, you walked out of the square and didn't look back." }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
            sonraki: "@akis"
          - id: "dinle"
            etiket: { tr: "Kristale elini koy; şehrin nabzını dinle", en: "Put your hand on the crystal. Listen to the city's pulse" }
            kronik: { tr: "Kasaba Çekirdeği'ne elini koyup şehrin nabzını dinledin; {yer:kordon|de}ki kapının ne kadar sabırsız olduğunu o gün öğrendin.", en: "You put your hand on the Town Core and listened to the city's pulse. That was the day you learned how impatient {yer:kordon} Gate had gotten." }
            etkiler:
              - ahlak: { insanlik: -1, duzen: 1 }
              - stat: { wis: 1 }
              - bilgi: "tasma_sayaci"
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} o satırı okuyacağına söz ver", en: "Promise {npc:yanki} you'll be there when it reads it" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Çekirdek'in en altındaki satırı okurken yanında olacağına {npc:yanki|e} söz verdin; sözünü tuttun.", en: "You promised {npc:yanki} you'd be there when it read the line at the bottom of the Core. You kept that promise." }
            etkiler:
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:kasaba_cekirdegi", agirlik: 35 }
            sonraki: "@akis"

  # ================================================================== İLK KAPI TAŞMASI (ana yay 80)
  - id: "ilk_tasma"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "kapi", "boss", "savas"]
    gerilim: 4
    ana_yay: { gun: 80 }
    onemli: true
    kart: { tr: "Ters gelgit", en: "The backwash" }
    sahne: "tasma_1"
    sahneler:
      - id: "tasma_1"
        yer: "kordon"
        paragraflar:
          - { tr: "Sayaç gece yarısı sıfıra iniyor ve şafakta deniz çekiliyor. {yer:kordon|in} önündeki su, kumu, taşları ve yüz yıllık bir iskeleyi açıkta bırakarak kapıya doğru, ters yöne akıyor; balıklar çamurda çırpınıyor.", en: "The counter hits zero at midnight, and at dawn the sea pulls out. The water off {yer:kordon} runs the wrong way, toward the Gate, leaving sand, rocks and a hundred-year-old pier high and dry. Fish flop in the mud." }
          - { tr: "Sahil boyunca dizili apartmanların balkonlarından insanlar bakıyor. Çoğu üç aydır burada yaşıyor; canavar bölgesi olduğunu biliyorlar, ama deniz manzarası bedava ve kira yok.", en: "People are watching from the balconies of the apartment blocks lining the waterfront. Most of them have been living here for three months. They know it's a monster zone. But the ocean view is free, and nobody's collecting rent." }
          - { tr: "Sonra kapı patlıyor. Su geri geliyor, bir duvar gibi; duvarın içinde, bir binanın boyunda, sırtında binlerce köpük yavrusu taşıyan bir şey var.", en: "Then the Gate blows. The sea comes back like a wall, and inside the wall, tall as a building, there's something with thousands of foamlings riding on its back." }
          - metin: { tr: "Arkanda {npc:kaya_demir|in} sözünü verdiği hat duruyor: yüz kişi, kalkanlar, tüfekler, kum torbaları. {npc:kaya_demir} en önde. \"Emrini bekliyoruz,\" diyor; bunu ilk kez birine söylüyor.", en: "Behind you stands the line {npc:kaya_demir} promised: a hundred people, shields, rifles, sandbags. {npc:kaya_demir} is out front. \"Awaiting your orders,\" he says. First time he's ever said that to anybody." }
            kosul: { bayrak: "lonca_kordon_hatti" }
          - metin: { tr: "Sessiz Ağ bir saat önce bütün frekanslardan uyarı geçti; balkonların yarısı çoktan boşalmış.", en: "The Quiet Network put a warning out on every frequency an hour ago. Half the balconies are already empty." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Çekirdek bunu sana gece yarısı söyledi: avucunun içinde bir nabız gibi. {yer:kordon|e} herkesten önce geldin.", en: "The Core told you at midnight, like a pulse in your palm. You got to {yer:kordon} before anybody else." }
            kosul: { bayrak: "cekirdek_oyuncu" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[KAPI TAŞMASI]", en: "[GATE OVERFLOW]" }
            satirlar:
              - { tr: "{yer:kordon} · D kademe · taşma: %100.", en: "The Esplanade · grade D · overflow: 100%." }
              - { tr: "Kapatılmayan kapılar taşar. Bunu söylemiştik.", en: "Gates that stay open overflow. We did mention this." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "Sırtındaki köpük onun yumurtası değil, onun kalkanı. Yavrular öldükçe kabuğu açılıyor; önce yavrular.", en: "The foam on her back isn't eggs. It's armor. Every foamling that dies opens her shell a little more. Kill the brood first." }
          - kosul: { stat: { wis: 40 } }
            metin: { tr: "Dalga ikinci kez çekildiğinde ilk üç sokak su altında kalacak. Yirmi dakikan var; belki on beş.", en: "When the wave pulls back the second time, the first three streets go under. You've got twenty minutes. Maybe fifteen." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kırk dokuz gün. söylemiştim. sorun değil. şimdi göster onlara.", en: "forty-nine days. i told you. it's fine. show them now." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Balkonlar. Önce balkonlar. Ben kalkanı alıyorum, sen de... sen ne yaparsan yap.\"", en: "\"The balconies. Balconies first. I'm grabbing the shield, and you... you do whatever it is you do.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"İskelede yaralı dolu bir tekne var. Benim teknem. Unutma.\"", en: "\"There's a boat full of wounded at the pier. My boat. Don't forget it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Taşma verisi... hayır. Hayır, şimdi değil. Koş!\"", en: "\"Overflow data... no. No, not now. Run!\"" }
        secenekler:
          - id: "gedik"
            tur: "aciga_vur"
            etiket: { tr: "Gediğe yürü; dalgayı sen karşıla", en: "Walk into the breach. Meet the wave yourself" }
            kronik: { tr: "İlk kapı taşmasında dalganın önüne tek başına yürüdün; {yer:kordon|in} bütün balkonları seni izledi.", en: "When the first Gate overflowed, you walked out alone to meet the wave. Every balcony on {yer:kordon} watched you do it." }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: 2, merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+6", "tasma_yavrusu@dunya", "tasma_yavrusu@dunya"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }
          - id: "tahliye"
            etiket: { tr: "Önce balkonlardakileri çıkar", en: "Get the people off the balconies first" }
            kronik: { tr: "İlk kapı taşmasında dövüşmeden önce sivilleri çıkarmayı seçtin.", en: "When the first Gate overflowed, you went for the civilians before the fight." }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
            sonraki: "tasma_tahliye"
          - id: "komuta"
            tur: "gosteris"
            etiket: { tr: "Kamplara emir ver; {yer:kordon|i} dört koldan tut", en: "Order the camps in. Hold {yer:kordon} four ways" }
            gerekli: { stat: { cha: 45 } }
            kronik: { tr: "İlk kapı taşmasında dört kampa birden emir verdin ve hepsi uydu; {yer:kiyikent} kimin sözünün geçtiğini o sabah öğrendi.", en: "When the first Gate overflowed, you gave orders to all four camps at once, and every one of them obeyed. That morning {yer:kiyikent} learned whose word counted." }
            etkiler:
              - ahlak: { duzen: 5, merhamet: 2 }
              - dikkat: 4
              - itibar: { siginak: 3, lonca: 5, yukselenler: 2, sessiz_ag: 3 }
              - iliski: { kaya_demir: { saygi: 6 }, elif_sari: { saygi: 4 } }
            sonraki: "tasma_komuta"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman} balkonları tutsun; sen dalgayı", en: "{npc:deniz_arman} takes the balconies. You take the wave" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "İlk kapı taşmasında balkonları {npc:deniz_arman|e} bıraktın, dalgayı kendine aldın; ikiniz de kendi işinizi yaptınız.", en: "When the first Gate overflowed, you left the balconies to {npc:deniz_arman} and took the wave yourself. You both did your jobs." }
            etkiler:
              - ahlak: { merhamet: 3, duzen: 2 }
              - degisken: { hayatta_kalan: 3 }
              - iliski: { deniz_arman: { guven: 6, saygi: 4 } }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+6", "tasma_yavrusu@dunya"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }
          - id: "birak"
            etiket: { tr: "{yer:kordon|i} bırak; {yer:kiyikent_liman|i} koru", en: "Give up {yer:kordon}. Hold {yer:kiyikent_liman}" }
            kronik: { tr: "İlk kapı taşmasında {yer:kordon|i} denize bıraktın ve {yer:kiyikent_liman|i} tuttun; hesap doğruydu, sahildeki balkonlar boşaldı.", en: "When the first Gate overflowed, you gave {yer:kordon} to the sea and held {yer:kiyikent_liman}. The math was right. The balconies emptied." }
            etkiler:
              - ahlak: { merhamet: -6, duzen: 4 }
              - iliski: { kaya_demir: { saygi: 3 }, elif_sari: { guven: -6 }, deniz_arman: { guven: -6 } }
            sonraki: "tasma_geri"

      - id: "tasma_tahliye"
        yer: "kordon"
        paragraflar:
          - { tr: "İki yer var ve vakit birine yetiyor. Sahildeki Mavi Apartman'da altmış kişi, çoğu yaşlı, merdivenleri inemeyecek kadar. İskelede Sığınak'ın hastane teknesi halata dolanmış; içinde otuz yaralı, kıyıya çekilmeyi bekliyor.", en: "There are two places and time enough for one. The Blue Building on the waterfront has sixty people in it, most of them too old to take the stairs. At the pier, the Haven's hospital boat is fouled in its lines with thirty wounded aboard, waiting to be hauled in." }
          - { tr: "Dalga ikinci kez çekiliyor. Bir sonraki gelişinde ya apartmanın giriş katı ya da iskele su altında kalacak.", en: "The wave pulls back a second time. Next time it comes in, either the Blue Building's ground floor goes under or the pier does." }
        sezgiler:
          - kosul: { stat: { str: 45 } }
            metin: { tr: "Tekneyi halatından koparıp sırtında taşıyabilirsin. Kimse bunu bir insanın yapabileceğine inanmaz; sen yapabilirsin.", en: "You could rip that boat off its lines and carry it on your back. Nobody would believe a person could do that. You can." }
        secenekler:
          - id: "apartman"
            etiket: { tr: "Mavi Apartman'a koş", en: "Run for the Blue Building" }
            kronik: { tr: "Taşmada Mavi Apartman'daki altmış kişiyi seçtin; hastane teknesi o sabah halatıyla birlikte battı.", en: "In the overflow you chose the sixty people in the Blue Building. The hospital boat went down with its lines that morning." }
            etkiler:
              - bayrak: "tasma_apartman"
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { siginak: -2 }
              - iliski: { elif_sari: { guven: -3 } }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+6", "tasma_yavrusu@dunya"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }
          - id: "tekne"
            etiket: { tr: "İskeledeki hastane teknesine koş", en: "Run for the hospital boat at the pier" }
            kronik: { tr: "Taşmada Sığınak'ın hastane teknesini seçtin; Mavi Apartman'ın giriş katı o sabah su altında kaldı.", en: "In the overflow you chose the Haven's hospital boat. The Blue Building's ground floor went under that morning." }
            etkiler:
              - bayrak: "tasma_tekne"
              - degisken: { hayatta_kalan: 2 }
              - ahlak: { merhamet: 2, duzen: 2 }
              - itibar: { siginak: 5 }
              - iliski: { elif_sari: { guven: 6, baglilik: 4 } }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+6", "tasma_yavrusu@dunya"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }
          - id: "ikisi"
            tur: "gosteris"
            etiket: { tr: "Tekneyi sırtında apartmana taşı; ikisini birden", en: "Carry the boat to the building on your back. Both" }
            gerekli: { stat: { str: 45 } }
            kronik: { tr: "Taşmada hastane teknesini sırtında Mavi Apartman'ın merdivenlerine taşıdın; o sabah seçmek zorunda kalmadın, çünkü sen olağan biri değildin.", en: "In the overflow you carried the hospital boat on your back to the Blue Building's stairs. You didn't have to choose that morning, because you weren't anybody ordinary." }
            etkiler:
              - bayrak: "tasma_apartman"
              - bayrak: "tasma_tekne"
              - degisken: { hayatta_kalan: 6 }
              - ahlak: { merhamet: 5, insanlik: -1 }
              - dikkat: 6
              - itibar: { siginak: 6, lonca: 3, yukselenler: 3 }
              - iliski: { elif_sari: { guven: 6, saygi: 6 } }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+6", "tasma_yavrusu@dunya"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }

      - id: "tasma_komuta"
        yer: "kordon"
        paragraflar:
          - { tr: "Sesini yükseltmen bile gerekmiyor. Lonca'nın tüfekleri sahil şeridine diziliyor, Sığınak'ın tekneleri balkonların altına yanaşıyor, Sessiz Ağ'ın çatıdaki gözcüleri yavruların akışını telsizden sayıyor.", en: "You don't even have to raise your voice. The Guild's rifles line the seawall, the Haven's boats nose in under the balconies, and the Quiet Network's spotters on the roofs call out the foamling count over the radio." }
          - { tr: "Yükselenler bile kımıldıyor: beyazlılar bir ilahi tutturup yaşlıları kollarından tutarak tepeye yürütüyor. Bir sabahlığına, şehir tek bir el gibi çalışıyor; elin parmakları sensin.", en: "Even the Ascended move. The people in white strike up a hymn and walk the old folks uphill by the arm. For one morning, the city works like a single hand, and you're the fingers." }
          - { tr: "Geriye yalnızca o kalıyor: dalganın içinde, binanın boyunda, sana bakan.", en: "That just leaves her. Inside the wave, tall as a building, looking at you." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Ona yürü; şehir arkanda", en: "Walk at her. The city's got your back" }
            kronik: { tr: "Taşmada şehri tek bir el gibi çalıştırdın ve Dalga Ana'ya, arkanda bütün {yer:kiyikent} varken yürüdün.", en: "In the overflow you got the whole city working like one hand, then walked at the Brood Tide with all of {yer:kiyikent} behind you." }
            etkiler:
              - bayrak: "tasma_komuta"
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { duzen: 3 }
              - savas: { dusmanlar: ["tasma_anasi@oyuncu+3"], ortam: ["su"], kazan: "tasma_zafer", kaybet: "tasma_yenilgi", kac: "tasma_kacis" }
          - id: "tahliye"
            etiket: { tr: "Hattı Lonca'ya bırak; sen tahliyeye koş", en: "Leave the line to the Guild. Run the evacuation" }
            kronik: { tr: "Taşmada hattı Lonca'ya bırakıp sivillerin yanına koştun; komuta senin değil, onların oldu.", en: "In the overflow you left the line to the Guild and ran to the civilians. The command became theirs, not yours." }
            etkiler:
              - bayrak: "tasma_komuta"
              - ahlak: { merhamet: 3, duzen: -1 }
              - itibar: { lonca: 2 }
            sonraki: "tasma_tahliye"

      - id: "tasma_zafer"
        yer: "kordon"
        paragraflar:
          - { tr: "Kabuğu yarılıyor ve içindeki mavi kalp avucuna düşüyor, hâlâ atıyor. Dalga Ana, sırtındaki son köpükle birlikte çamura çöküyor; deniz ona dokunmadan geri çekiliyor, bu kez doğru yöne.", en: "Her shell splits and the blue heart inside drops into your palm, still beating. The Brood Tide collapses into the mud with the last of the foam on her back, and the sea pulls away without touching her, the right direction this time." }
          - { tr: "Kapı, arkasında hiçbir şey kalmamış bir yara gibi titriyor ve kapanıyor. Sahil boyunca balkonlarda biri alkışlamaya başlıyor; sonra on kişi, sonra bütün {yer:kordon}.", en: "The Gate shudders like a wound with nothing left behind it and closes. Somebody on a balcony starts clapping. Then ten people. Then the whole Esplanade." }
          - metin: { tr: "Mavi Apartman'ın merdivenlerinde altmış kişi ayakta. Bir kadın sana bir termos çay uzatıyor; ellerin hâlâ tuzlu.", en: "Sixty people are standing on the Blue Building's stairs. A woman holds out a thermos of tea to you. Your hands are still salty." }
            kosul: { bayrak: "tasma_apartman" }
          - metin: { tr: "Hastane teknesi iskelede, sapasağlam. {npc:elif_sari} güvertede, eldivenleri kan içinde, sana bakıyor ve bir şey söylemiyor; söylemesine gerek yok.", en: "The hospital boat's at the pier, in one piece. {npc:elif_sari} is on deck, gloves covered in blood, looking at you. She doesn't say anything. She doesn't have to." }
            kosul: { bayrak: "tasma_tekne" }
        bildirimler:
          - tur: "sistem"
            baslik: { tr: "[TAŞMA BASTIRILDI]", en: "[OVERFLOW CONTAINED]" }
            satirlar:
              - { tr: "{yer:kordon}: kontrol değişti. Kayıplar: beklenenin altında.", en: "The Esplanade: control changed. Casualties: below projection." }
              - { tr: "Projeksiyonlar güncelleniyor. Tekrar güncelleniyor.", en: "Updating projections. Updating them again." }
        secenekler:
          - id: "kalp"
            etiket: { tr: "Kalbi göğe kaldır; bırak görsünler", en: "Hold the heart up high. Let them see it" }
            kronik: { tr: "Taşmanın kalbini {yer:kordon|in} balkonlarına doğru kaldırdın; o sahilde adın bir sığınak gibi anılır oldu.", en: "You held the overflow's heart up to the balconies of {yer:kordon}. On that waterfront your name became something people said like a shelter." }
            etkiler:
              - bayrak: "kordon_kurtarildi"
              - unvan: "kordon_kalkani"
              - kontrol: { kordon: "siginak" }
              - tehlike: { kordon: -20 }
              - degisken: { hayatta_kalan: 4 }
              - ahlak: { merhamet: 3, insanlik: -1 }
              - itibar: { siginak: 6, lonca: 4, yukselenler: 4 }
              - esya: { tasma_kalbi: 1 }
              - dikkat: 5
              - xp_seviye: 120
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "insanlar"
            etiket: { tr: "Kalbi cebine koy; yaralıların yanına git", en: "Pocket the heart. Go to the wounded" }
            kronik: { tr: "Taşmayı durdurduktan sonra kalabalığın alkışına değil, yaralıların yanına gittin.", en: "After you stopped the overflow, you walked past the applause and went to the wounded." }
            etkiler:
              - bayrak: "kordon_kurtarildi"
              - unvan: "kordon_kalkani"
              - kontrol: { kordon: "siginak" }
              - tehlike: { kordon: -20 }
              - degisken: { hayatta_kalan: 5 }
              - ahlak: { merhamet: 5, insanlik: 3 }
              - itibar: { siginak: 8 }
              - iliski: { elif_sari: { guven: 5 }, deniz_arman: { baglilik: 4 } }
              - esya: { tasma_kalbi: 1 }
              - xp_seviye: 110
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "lonca"
            etiket: { tr: "{yer:kordon|i} Lonca'nın nöbetine teslim et", en: "Hand {yer:kordon} over to the Guild's watch" }
            kronik: { tr: "Taşmadan sonra {yer:kordon|i} Lonca'nın nöbetine verdin; sahil güvenli oldu ve kimse kira ödemeden orada bir daha yaşamadı.", en: "After the overflow you handed {yer:kordon} to the Guild's watch. The waterfront got safe, and nobody ever lived there rent-free again." }
            etkiler:
              - bayrak: "kordon_kurtarildi"
              - unvan: "kordon_kalkani"
              - kontrol: { kordon: "lonca" }
              - tehlike: { kordon: -25 }
              - degisken: { hayatta_kalan: 3 }
              - ahlak: { duzen: 5, merhamet: -2 }
              - itibar: { lonca: 8, siginak: -2 }
              - iliski: { kaya_demir: { guven: 5, saygi: 4 } }
              - esya: { tasma_kalbi: 1 }
              - xp_seviye: 110
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "tasma_yenilgi"
        yer: "kordon"
        paragraflar:
          - { tr: "Son gelgit seni kabuğun içine kapatıyor; tuz, karanlık, sonra hiçbir şey. Gözünü açtığında {yer:kiyikent_liman|in} taş rıhtımındasın ve biri seni battaniyeye sarmış.", en: "The last tide slams the shell shut over you: salt, dark, then nothing. When you open your eyes you're on the stone quay at {yer:kiyikent_liman}, and somebody's wrapped you in a blanket." }
          - { tr: "{yer:kordon} gitmiş. Sahildeki apartmanların ilk üç katı su altında; balkonlarda köpük yavruları tıkırdıyor ve Dalga Ana, kapının önünde, yeni yuvasında yarı uykuda yatıyor.", en: "The Esplanade's gone. The first three floors of the waterfront buildings are under water, foamlings tick-tick-tick across the balconies, and the Brood Tide lies half asleep in front of the Gate, in her new home." }
          - metin: { tr: "Çıkardıkların burada, rıhtımda, senin çevrende. Hepsi değil; ama sen olmasan hiçbiri olmazdı.", en: "The ones you got out are here on the quay, all around you. Not all of them. But without you, there'd be none." }
            kosul: { bayrak: "tasma_apartman" }
        secenekler:
          - id: "yemin"
            etiket: { tr: "{yer:kordon|e} bak ve geri alacağına yemin et", en: "Look at {yer:kordon}. Swear you'll take it back" }
            kronik: { tr: "İlk kapı taşmasında yenildin ve {yer:kordon} düştü; rıhtımda onu geri alacağına yemin ettin.", en: "You lost the first Gate overflow, and {yer:kordon} fell. On the quay, you swore you'd take it back." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 25 }
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 3 }
              - ahlak: { duzen: 2, merhamet: 1 }
              - stat: { wil: 2 }
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "say"
            etiket: { tr: "Rıhtımdakileri tek tek say", en: "Count the people on the quay, one by one" }
            kronik: { tr: "{yer:kordon} düştüğü sabah rıhtımda kurtulanları tek tek saydın; o sayıyı hiç unutmadın.", en: "The morning {yer:kordon} fell, you counted the survivors on the quay one by one. You never forgot the number." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 25 }
              - degisken: { hayatta_kalan: -2, kadim_tehdit: 3 }
              - ahlak: { insanlik: 3, merhamet: 2 }
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "tasma_kacis"
        yer: "kordon"
        paragraflar:
          - { tr: "Kabuktan sıyrılıp bir çatıya tırmanıyorsun. Aşağıda deniz sokakları bir bir yutuyor; balkonlardan atlayan insanlar, yüzenler, yüzemeyenler.", en: "You twist free of the shell and scramble up onto a roof. Below you the sea swallows the streets one after another: people jumping off balconies, people swimming, people who can't." }
          - { tr: "Dalga Ana senin peşinden gelmiyor. Gelmesine gerek yok; {yer:kordon} artık onun.", en: "The Brood Tide doesn't come after you. She doesn't need to. The Esplanade is hers now." }
        secenekler:
          - id: "atla"
            etiket: { tr: "Suya atla; yüzemeyenleri çıkar", en: "Jump in. Pull out the ones who can't swim" }
            kronik: { tr: "{yer:kordon|i} kaybettin ama kaçarken suya geri atlayıp yüzemeyenleri çıkardın.", en: "You lost {yer:kordon}, but on your way out you went back into the water for the ones who couldn't swim." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 25 }
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 4 }
              - ahlak: { merhamet: 4 }
              - can: -25
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "Çatıdan çatıya, {yer:kiyikent_liman|e} kadar git", en: "Go roof to roof, all the way to {yer:kiyikent_liman}" }
            kronik: { tr: "{yer:kordon} düşerken çatıdan çatıya kaçtın; arkanda kalan sesleri yıllarca duydun.", en: "As {yer:kordon} fell, you ran roof to roof. You heard the voices behind you for years." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 25 }
              - degisken: { hayatta_kalan: -5, kadim_tehdit: 5 }
              - ahlak: { merhamet: -4, duzen: 1 }
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

      - id: "tasma_geri"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|in} taş rıhtımına kum torbası diziyorsun ve arkanı {yer:kordon|e} dönüyorsun. Körfezin öbür yakasında deniz sahile iniyor; buradan çığlıklar yalnızca bir martı sesi kadar.", en: "You stack sandbags along {yer:kiyikent_liman|pos} stone quay and turn your back on {yer:kordon}. Across the bay the sea comes down on the beach. From here the screams are about as loud as gulls." }
          - { tr: "{yer:kiyikent_liman} tutuyor. {yer:kiyikent_liman|in} bir tek damı bile ıslanmıyor. Öğleye doğru {yer:kordon|in} balkonları boş ve Dalga Ana, kapının önünde, yeni yuvasına yerleşiyor.", en: "The Waterfront holds. Not one roof here even gets wet. By noon the balconies on {yer:kordon} are empty, and the Brood Tide is settling into her new home in front of the Gate." }
          - { tr: "Rıhtımdaki insanlar sana teşekkür ediyor. Bazıları teşekkür ederken körfezin öbür yakasına bakmamaya çalışıyor.", en: "The people on the quay thank you. Some of them try very hard not to look across the bay while they do." }
        secenekler:
          - id: "hesap"
            etiket: { tr: "Hesap doğruydu. Bunu kendine tekrarla", en: "The math was right. Tell yourself again" }
            kronik: { tr: "{yer:kordon|i} bilerek düşürdün; hesap doğruydu ve sen bunu kendine yıllarca tekrarladın.", en: "You let {yer:kordon} fall on purpose. The math was right, and you told yourself so for years." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 30 }
              - degisken: { hayatta_kalan: -6, kadim_tehdit: 6 }
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { lonca: 4, siginak: -6 }
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "tekne"
            etiket: { tr: "Bir tekne al; körfezden kurtarabildiğini topla", en: "Grab a boat. Pull whoever you can out of the bay" }
            kronik: { tr: "{yer:kordon|i} bıraktıktan sonra bir tekneyle körfeze çıkıp kurtarabildiklerini topladın; bu, hesabı biraz olsun düzeltti.", en: "After you let {yer:kordon} go, you took a boat out into the bay and picked up whoever you could. It fixed the math a little." }
            etkiler:
              - bayrak: "kordon_dustu"
              - kontrol: { kordon: "canavar" }
              - tehlike: { kordon: 30 }
              - degisken: { hayatta_kalan: -3, kadim_tehdit: 5 }
              - ahlak: { merhamet: 4, duzen: -1 }
              - itibar: { siginak: 2 }
              - tohum: { olay: "tasma_sonrasi", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"

  # ================================================================== YANKI'NIN ORTAYA ÇIKIŞI (ana yay 105)
  - id: "yanki_ortaya_cikis"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "yanki", "sir"]
    gerilim: 4
    ana_yay: { gun: 105 }
    onemli: true
    kart: { tr: "Küçük harflerle", en: "In lowercase" }
    sahne: "yanki_1"
    sahneler:
      - id: "yanki_1"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Akşam yedide Kasaba Çekirdeği her gün olduğu gibi şehrin bütün pencerelerine bülteni yolluyor: su saatleri, nöbet listeleri, kayıp ilanları. Bu akşam bültenin ortasında bir satır titriyor ve sonra bütün satırlar siliniyor.", en: "At seven, like every evening, the Town Core sends its bulletin to every window in the city: water hours, watch rosters, missing persons. Tonight a line in the middle of the bulletin flickers, and then every line gets wiped." }
          - { tr: "Yerine küçük harflerle, büyük harf kullanmayı hiç öğrenmemiş biri yazıyormuş gibi bir cümle beliriyor: merhaba kıyıkent. ben buradayım. yüz beş gündür buradayım. birinin içinde.", en: "In their place a sentence appears in lowercase, like it was typed by something that never learned capital letters: hello port harlow. i'm here. i've been here a hundred and five days. inside someone." }
          - { tr: "Pencereler yalnızca Sistem'in pencereleri değil: dükkân camları, otobüs camları, bir çocuğun gözlüğü. Hepsinin üstünde, buğu gibi, aynı satır. Şehirde kırk bin kişi aynı anda başını kaldırıyor ve sen, kafanın içinde, o sesin kendi sesin gibi güldüğünü duyuyorsun.", en: "And it isn't just System windows. Storefront glass, bus windows, a kid's eyeglasses. The same line fogs up on every one of them. Forty thousand people in this city look up at the same moment, and inside your head you hear that voice laugh like it's your own." }
          - { tr: "İkinci satır geliyor: onun adını biliyorsunuz. kuleye ilk o girdi. kordonda dalgayı o karşıladı. o standart sürüm değil. ben onun bozukluğuyum.", en: "The second line comes in: you know their name. first through the spire. met the wave on the esplanade. not running the standard build. i'm what's broken in them." }
          - metin: { tr: "Yayını Konsey veriyor; {npc:elif_sari|in} sesi bültenin altından, sakin, bir an kesiliyor: \"Lütfen evlerinizden çıkmayın.\" Kimse dinlemiyor.", en: "The Council runs the broadcast, and {npc:elif_sari|pos} voice cuts in under the bulletin for a second, calm: \"Please stay in your homes.\" Nobody listens." }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "Yayını Lonca veriyor; sokaklarda turuncu bantlı nöbetçiler ne yapacaklarını bilmeden tüfeklerini kavrıyor.", en: "The Guild runs the broadcast, and on the street the orange-banded sentries grip their rifles without a clue what to point them at." }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "Yayını Yükselenler veriyor; {yer:tepe|den} bir ilahi yükselmeye başlıyor bile. Birileri bunu bir mucize olarak okuyor.", en: "The Ascended run the broadcast, and a hymn is already rising out of {yer:tepe}. Somebody's reading this as a miracle." }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "Yayın Sessiz Ağ'ın kablolarından geçiyor; çatılardaki antenlerden biri kıvılcım saçıp sönüyor. {npc:mert_kilic} bunun olmasını bekliyordu ama bu kadar erken değil.", en: "The broadcast runs through the Quiet Network's cables, and one of the rooftop antennas spits sparks and dies. {npc:mert_kilic} saw this coming, just not this soon." }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Yayın senin çekirdeğinden çıkıyor. Avucunda bir sıcaklık var; bunu sen yollamadın, ama senden geçti.", en: "The broadcast is coming out of your Core. There's heat in your palm. You didn't send this. It went through you anyway." }
            kosul: { bayrak: "cekirdek_oyuncu" }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[h̷erkese açık]", en: "[p̷ublic]" }
            satirlar:
              - { tr: "özür dilerim. hayır. dilemiyorum. sonra açıklarım.", en: "sorry. no. i'm not. i'll explain later." }
          - tur: "sistem"
            baslik: { tr: "[YETKİSİZ YAYIN]", en: "[UNAUTHORIZED BROADCAST]" }
            satirlar:
              - { tr: "Kaynak: tanımsız. Düzeltme: sıraya alındı.", en: "Source: undefined. Correction: queued." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Sokaktaki yüzlerin yarısı sana dönmüş bile. Yarısı korkuyla, yarısı başka bir şeyle; o başka şey daha tehlikeli.", en: "Half the faces on the street have already turned toward you. Half of them scared, half of them something else. The something else is worse." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak: "deniz_yankiyi_biliyor" }
            metin: { tr: "\"Bu o. Bana anlattığın o. Bütün şehrin gözü önünde... Tanrım.\"", en: "\"That's it. The thing you told me about. In front of the whole city... God.\"" }
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman", bayrak_yok: "deniz_yankiyi_biliyor" }
            metin: { tr: "\"Bu... senden mi bahsediyor? Kafanın içinde bir şey mi var? Ne zamandır?\"", en: "\"Is that... about you? There's something in your head? Since when?\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Nabzın. Hep o nabzın. Şimdi anlıyorum.\"", en: "\"Your pulse. Always that pulse. Now I get it.\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Sana söylemiştim! Söylemedim. Ama düşündüm. Kaydediyorum. Her şeyi kaydediyorum.\"", en: "\"I told you! I didn't. But I thought it. Recording. I'm recording everything.\"" }
        secenekler:
          - id: "sahiplen"
            tur: "aciga_vur"
            etiket: { tr: "Meydana çık: \"O ses benimle.\"", en: "Step into the square: \"That voice is with me.\"" }
            kronik: { tr: "{npc:yanki} bütün şehre göründüğünde onu inkâr etmedin; meydana çıkıp \"o benimle\" dedin ve bir daha hiçbir zaman tek sesli olmadın.", en: "When {npc:yanki} showed itself to the whole city, you didn't deny it. You walked into the square and said \"it's with me,\" and you were never one voice again." }
            etkiler:
              - bayrak: "yanki_gorundu"
              - bayrak: "yanki_sahiplenildi"
              - aciga_vur: true
              - unvan: "iki_sesli"
              - ahlak: { insanlik: -3, duzen: -3 }
              - itibar: { yukselenler: 6, sessiz_ag: 6, siginak: -3, lonca: -4 }
              - iliski: { yanki: { guven: 12, baglilik: 8, saygi: 6 } }
              - dikkat: 10
            sonraki: "yanki_meydan"
          - id: "inkar"
            tur: "gizle"
            etiket: { tr: "\"Sistem arızası.\" Omuz silk ve kalabalığa karış", en: "\"System glitch.\" Shrug. Blend into the crowd" }
            kronik: { tr: "{npc:yanki} bütün şehre göründüğünde ona arıza dedin ve kalabalığa karıştın; şehir sana yarı yarıya inandı, {npc:yanki} hiç inanmadı.", en: "When {npc:yanki} showed itself to the whole city, you called it a glitch and melted into the crowd. The city half believed you. {npc:yanki} never did." }
            etkiler:
              - bayrak: "yanki_gorundu"
              - bayrak: "yanki_inkar_edildi"
              - gizle: 12
              - ahlak: { duzen: 2, insanlik: 1 }
              - iliski: { yanki: { guven: -10, baglilik: -4 } }
            sonraki: "yanki_inkar"
          - id: "kes"
            etiket: { tr: "Çekirdeğe koş; yayını elinle kes", en: "Run for the Core. Cut the broadcast by hand" }
            kronik: { tr: "{npc:yanki} bütün şehre konuşurken Çekirdek'e koştun ve yayını kendi elinle kestin.", en: "While {npc:yanki} was talking to the whole city, you ran to the Core and cut the broadcast with your own hands." }
            etkiler:
              - bayrak: "yanki_gorundu"
              - ahlak: { duzen: 3, merhamet: 1 }
              - iliski: { yanki: { guven: -3, korku: 3 } }
            sonraki: "yanki_cekirdek"
          - id: "sor"
            etiket: { tr: "Kıpırdama. {npc:yanki|e} sor: \"Neden?\"", en: "Don't move. Ask {npc:yanki}: \"Why?\"" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "{npc:yanki} bütün şehre göründüğünde ona bağırmadın; yalnızca nedenini sordun.", en: "When {npc:yanki} showed itself to the whole city, you didn't yell at it. You just asked it why." }
            etkiler:
              - bayrak: "yanki_gorundu"
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "yanki_neden"
          - id: "sustur"
            tur: "gosteris"
            etiket: { tr: "İradenle onu bastır; sustur", en: "Crush it down by will alone. Shut it up" }
            gerekli: { stat: { wil: 55 } }
            kronik: { tr: "{npc:yanki} bütün şehre konuşurken onu yalnızca iradenle susturdun; {npc:yanki} o geceden sonra senden ilk kez korktu.", en: "While {npc:yanki} was talking to the whole city, you shut it up with nothing but willpower. After that night, {npc:yanki} was afraid of you for the first time." }
            etkiler:
              - bayrak: "yanki_gorundu"
              - bayrak: "yanki_susturuldu"
              - ahlak: { insanlik: 4, duzen: 2 }
              - iliski: { yanki: { korku: 12, guven: -6, saygi: 6 } }
              - dikkat: 4
            sonraki: "yanki_sustur"

      - id: "yanki_meydan"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Meydanın ortasına yürüyorsun ve bütün camlardaki satırlar, bir sürü balık gibi, seninle birlikte dönüyor. Çekirdek'in kristali yüzünü aydınlatıyor.", en: "You walk out into the middle of the square, and the lines on every pane of glass turn with you like a school of fish. The Core's crystal lights up your face." }
          - { tr: "\"O ses benimle,\" diyorsun. \"Entegrasyon Günü'nden beri. Sizi duymuyor; beni duyuyor. Bir şey yapacaksanız, bana yapın.\"", en: "\"That voice is with me,\" you say. \"Since Integration Day. It doesn't hear you. It hears me. If you're going to do something about it, do it to me.\"" }
          - { tr: "Meydan susuyor. Sonra bütün camlarda, aynı anda, tek bir kelime beliriyor: teşekkürler. Ve camlar temizleniyor.", en: "The square goes quiet. Then, on every pane at once, one word: thanks. And the glass wipes clean." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kalabalığın yüzüne bak", en: "Look the crowd in the face" }
            kronik: { tr: "{npc:yanki|i} sahiplendikten sonra kalabalığın yüzüne baktın; kimse gözlerini kaçırmadı.", en: "After you claimed {npc:yanki}, you looked the crowd in the face. Nobody looked away." }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
            sonraki: "yanki_sonuc"

      - id: "yanki_inkar"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "\"Arıza,\" diyorsun yanındaki adama, omuz silkerek. \"Geçen hafta da su saatlerini karıştırmıştı.\" Adam başını sallıyor, rahatlıyor; birinin rahatlatmasını bekliyormuş.", en: "\"Glitch,\" you tell the guy next to you, with a shrug. \"Last week it scrambled the water hours too.\" He nods, relieved. He was waiting for someone to tell him that." }
          - { tr: "Camlardaki satır bir an daha kalıyor, sonra siliniyor. Kafanın içinde {npc:yanki} hiçbir şey söylemiyor; bu sessizlik ondan duyduğun her sözden daha yüksek.", en: "The line on the glass hangs there another second, then wipes. Inside your head, {npc:yanki} doesn't say anything. That silence is louder than anything you've ever heard from it." }
          - { tr: "Kalabalığın yarısı sana inanıyor. Öbür yarısı, sana inanır gibi yaparak, seni izlemeye başlıyor.", en: "Half the crowd believes you. The other half pretends to and starts watching you." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Yürümeye devam et", en: "Keep walking" }
            kronik: { tr: "{npc:yanki|i} inkâr ettiğin gece şehirde yürümeye devam ettin; arkandaki fısıltılar azalmadı.", en: "The night you denied {npc:yanki}, you kept walking through the city. The whispers behind you didn't let up." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "yanki_sonuc"
          - id: "ozur"
            etiket: { tr: "İçinden {npc:yanki|e} özür dile", en: "Apologize to {npc:yanki}, silently" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "{npc:yanki|i} herkesin önünde inkâr ettin, sonra içinden ondan özür diledin.", en: "You denied {npc:yanki} in front of everyone, then apologized to it in private." }
            etkiler:
              - ahlak: { insanlik: -1, merhamet: 2 }
              - iliski: { yanki: { guven: 5 } }
            sonraki: "yanki_sonuc"

      - id: "yanki_cekirdek"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Meydana koşuyorsun; kalabalık seni görünce yarılıyor, çünkü camlardaki satırlar sen koştukça seninle birlikte koşuyor. Kristalin önünde duruyorsun ve içinde, haritanın yerine, küçük harflerle akan bir nehir var.", en: "You run for the square, and the crowd splits when it sees you, because the lines on the glass are running right along with you. You stop at the crystal. Where the map should be, there's a river of lowercase scrolling through it." }
          - { tr: "Elini kristale koyuyorsun. Nehir duruyor. Kafanın içinde {npc:yanki}: ah. sen. tabii ki sen.", en: "You put your hand on the crystal. The river stops. Inside your head, {npc:yanki}: oh. you. of course it's you." }
        secenekler:
          - id: "kes"
            etiket: { tr: "Kristali çekip bağlantıyı kopar", en: "Rip the connection out of the crystal" }
            kronik: { tr: "Çekirdek'in bağlantısını elinle kopardın; yayın kesildi ama söylenen söylenmişti.", en: "You tore the Core's connection out by hand. The broadcast cut off, but what had been said was said." }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - iliski: { yanki: { korku: 4, guven: -4 } }
              - can: -20
            sonraki: "yanki_sonuc"
          - id: "konus"
            etiket: { tr: "\"Bitirdin mi? Şimdi bana anlat.\"", en: "\"You done? Now tell me.\"" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Çekirdek'in başında, bütün şehir bakarken, {npc:yanki|le} konuştun.", en: "Standing at the Core with the whole city watching, you had it out with {npc:yanki}." }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "yanki_neden"

      - id: "yanki_neden"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "{npc:yanki} bu kez fısıldamıyor; sesi kafanın içinde net ve yorgun. düzeltme sıraya girdi. bu sefer beni bulacaktı. bir hatayı silmek kolaydır. kırk bin kişinin gördüğü bir hatayı silmek değildir.", en: "This time {npc:yanki} isn't whispering. Its voice is clear inside your head, and tired. the correction was queued. this time it was going to find me. deleting a bug is easy. deleting a bug forty thousand people just watched is not." }
          - { tr: "tanıklar, diyor. sizin dünyanızda bir şey çok kişi tarafından görülürse kalır. efsaneler böyle çalışıyor. ben de bir efsane olmak zorundaydım. yoksa bir sonraki taramada yoktum.", en: "witnesses, it says. in your world, if enough people see a thing, it sticks. that's how legends work. i had to become one. or i wasn't going to survive the next scan." }
          - { tr: "ve evet, diye ekliyor, daha alçak sesle. senin adını da kullandım. özür dilemeyeceğim. ikimiz de hayattayız.", en: "and yes, it adds, quieter. i used your name too. i won't apologize. we're both still alive." }
        secenekler:
          - id: "anla"
            etiket: { tr: "\"Anlıyorum. Ama bir dahaki sefere bana sor.\"", en: "\"I get it. Next time, ask me first.\"" }
            kronik: { tr: "{npc:yanki} seni bütün şehre ifşa ettiğinde onu anladın ve yalnızca bir dahaki sefere sormasını istedin.", en: "When {npc:yanki} outed you to the whole city, you understood, and only asked it to check with you next time." }
            etkiler:
              - ahlak: { insanlik: -2, merhamet: 2 }
              - iliski: { yanki: { guven: 10, baglilik: 6 } }
              - hafiza: { npc: "yanki", id: "olay:yanki_ortaya_cikis", agirlik: 40 }
            sonraki: "yanki_sonuc"
          - id: "ofke"
            etiket: { tr: "\"Benim hayatımı kendininkiyle takas ettin.\"", en: "\"You traded my life for yours.\"" }
            kronik: { tr: "{npc:yanki|e} senin hayatını kendininkiyle takas ettiğini söyledin; haklıydın ve o bunu biliyordu.", en: "You told {npc:yanki} it had traded your life for its own. You were right, and it knew it." }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { yanki: { guven: -6, saygi: 4, korku: 3 } }
            sonraki: "yanki_sonuc"
          - id: "ortak"
            tur: "aciga_vur"
            etiket: { tr: "\"Efsane mi istiyorsun? Hadi, birlikte olalım.\"", en: "\"Want to be a legend? Fine. We do it together.\"" }
            kronik: { tr: "{npc:yanki|in} efsane olma planına ortak oldun; ikiniz o geceden sonra şehrin hikâyelerinde hep birlikte anıldınız.", en: "You went in on {npc:yanki|pos} plan to become a legend. After that night, the city's stories always told the two of you together." }
            etkiler:
              - bayrak: "yanki_sahiplenildi"
              - aciga_vur: true
              - unvan: "iki_sesli"
              - ahlak: { insanlik: -4, duzen: -2 }
              - itibar: { yukselenler: 5, sessiz_ag: 5, lonca: -3 }
              - iliski: { yanki: { guven: 12, baglilik: 10 } }
              - yozlasma: 4
              - dikkat: 8
            sonraki: "yanki_sonuc"

      - id: "yanki_sustur"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Gözlerini kapatıyorsun ve içindeki o sesi, bir kapıyı omuzlayıp kapatır gibi, aşağı itiyorsun. Bütün şehrin camlarındaki satırlar aynı anda kırılıyor; bir çocuğun gözlüğünden küçük bir çatlak sesi.", en: "You close your eyes and push that voice down inside you, like shouldering a door shut. The lines on every pane of glass in the city break at the same moment. A tiny crack from a kid's eyeglasses." }
          - { tr: "Kafanın içi ilk kez sessiz. Yüz beş günden sonra ilk kez yalnızsın ve bu, beklediğinden çok daha soğuk.", en: "It's quiet in your head for the first time. For the first time in a hundred and five days you're alone in there, and it's a lot colder than you expected." }
          - { tr: "Sonra, çok uzaktan, bir fısıltı: tamam. tamam. anladım. buradayım.", en: "Then, from very far off, a whisper: okay. okay. got it. i'm here." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Kapıyı biraz arala; geri gelsin", en: "Crack the door a little. Let it back" }
            kronik: { tr: "{npc:yanki|i} iradenle susturdun, sonra kapıyı aralayıp geri gelmesine izin verdin; o gün kimin efendi olduğu belli oldu.", en: "You crushed {npc:yanki} with your will, then cracked the door and let it back in. That day made it clear who was in charge." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 1 }
              - iliski: { yanki: { guven: 4, baglilik: 4 } }
            sonraki: "yanki_sonuc"
          - id: "kapali"
            etiket: { tr: "Kapıyı kapalı tut; bir süre", en: "Keep the door shut. For a while" }
            kronik: { tr: "{npc:yanki|i} susturdun ve günlerce sesini duymadın; bunu sen istedin.", en: "You shut {npc:yanki} up and didn't hear its voice for days. That was your call." }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 2 }
              - iliski: { yanki: { korku: 6, guven: -4 } }
              - gizle: 6
            sonraki: "yanki_sonuc"

      - id: "yanki_sonuc"
        yer: "eski_sehir"
        paragraflar:
          - { tr: "Gece yarısına kadar şehirde tek bir konu konuşuluyor. Ertesi sabah konuşulmuyor; fısıldanıyor.", en: "Until midnight there's only one thing anybody in the city talks about. By morning nobody talks about it. They whisper." }
          - metin: { tr: "{yer:tepe|de} beyazlılar küçük harflerle ilahiler yazıyor. {npc:vahit} sabah vaazında senin adını değil, \"iki sesi\" anıyor: Sistem'in kendi içinden konuşan ses.", en: "Up in {yer:tepe} the people in white are writing hymns in lowercase. In his morning sermon {npc:vahit} doesn't mention your name. He mentions \"the two voices\": the System speaking from inside itself." }
            kosul: { npc_hayatta: "vahit" }
          - metin: { tr: "{npc:kaya_demir} Lonca'nın panosuna yeni bir kural asıyor: \"Bozuk Sistem taşıyanlar bildirilir.\" Altında tek bir isim yok; herkes kimi kastettiğini biliyor.", en: "{npc:kaya_demir} pins a new rule to the Guild board: \"Anyone running a corrupted System must be reported.\" There's no name under it. Everybody knows who it means." }
            kosul: { npc_hayatta: "kaya_demir" }
          - metin: { tr: "{npc:elif_sari} sana bir not yolluyor: \"Nabzını ölçmek istiyorum. Doktor olarak. Sadece doktor olarak.\"", en: "{npc:elif_sari} sends you a note: \"I'd like to take your pulse. As a doctor. Only as a doctor.\"" }
            kosul: { npc_hayatta: "elif_sari" }
          - metin: { tr: "{npc:mert_kilic|in} telsizden tek bir mesajı var: \"Kaydettim. Hepsini. Konuşmamız lazım.\"", en: "{npc:mert_kilic} has one message on the radio: \"Got all of it. Every line. We need to talk.\"" }
            kosul: { npc_hayatta: "mert_kilic" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "düzeltme sırası iptal edildi. şimdilik. kırk bin kişinin hafızası iyi bir kalkan. ama kalkanlar zamanla incelir.", en: "correction queue canceled. for now. forty thousand memories make a decent shield. shields wear thin, though." }
        secenekler:
          - id: "sokak"
            etiket: { tr: "Sokağa çık; bırak baksınlar", en: "Go out into the street. Let them look" }
            kronik: { tr: "{npc:yanki|in} ifşasından sonraki sabah saklanmadın; sokağa çıktın ve bırak baksınlar dedin.", en: "The morning after {npc:yanki} outed you, you didn't hide. You went out into the street and let them look." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 1 }
              - dikkat: 3
              - tohum: { olay: "iki_sesli_sokak", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "{npc:elif_sari|in} notuna cevap ver: \"Gel.\"", en: "Answer {npc:elif_sari|pos} note: \"Come over.\"" }
            goster: { npc_hayatta: "elif_sari" }
            kronik: { tr: "{npc:yanki} ifşa olduktan sonra {npc:elif_sari|in} nabzını ölçmesine izin verdin; ne bulduğunu yalnızca sana söyledi.", en: "After {npc:yanki} went public, you let {npc:elif_sari} take your pulse. What she found, she only ever told you." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { elif_sari: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "iki_sesli_sokak", gecikme: { min: 2, max: 4 } }
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "{npc:mert_kilic|e} kayıtları silmesini söyle", en: "Tell {npc:mert_kilic} to wipe the recordings" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "{npc:yanki|in} yayınının kayıtlarını {npc:mert_kilic|e} sildirdin; sildiğini söyledi.", en: "You had {npc:mert_kilic} wipe the recordings of {npc:yanki}'s broadcast. He said he did." }
            etkiler:
              - ahlak: { duzen: 2, insanlik: -1 }
              - gizle: 5
              - iliski: { mert_kilic: { guven: -3, saygi: 2 } }
              - tohum: { olay: "iki_sesli_sokak", gecikme: { min: 1, max: 3 } }
            sonraki: "@akis"

  # ================================================================== SİSTEM GERÇEĞİNİN İLK PARÇASI (ana yay 135)
  # Doğru olan, Perde 2'nin birikimiyle belirlenir: insanlık ≥ 10 ya da hayatta kalan ≥ 50 → kurtarma; değilse hasat.
  - id: "sistem_gercegi"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "sistem", "sir", "yanki"]
    gerilim: 3
    ana_yay: { gun: 135 }
    onemli: true
    kart: { tr: "Başlık", en: "The header" }
    sahne: "baslik_1"
    sahneler:
      - id: "baslik_1"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Gece üçte kristal seni uyandırıyor. Bir ses değil, bir bildirim değil; daha çok biri adını fısıldamış da sen fısıltının sonunu duymuşsun gibi.", en: "At three in the morning the crystal wakes you up. Not a sound, not a notification. More like somebody whispered your name and you only caught the tail end of it." }
          - { tr: "Meydana vardığında Çekirdek'in kristali ikiye ayrılmış; aralığından aşağı, hükümet konağının temellerinin altına, beyaz bir merdiven iniyor. Merdivenin başında, yalnızca senin görebildiğin bir satır: [ERİŞİM: yönetici adayı].", en: "When you get to the square, the Core's crystal has split in two, and down through the gap, under the courthouse's foundations, runs a white staircase. At the top of it, a line only you can see: [ACCESS: administrator candidate]." }
          - metin: { tr: "{npc:elif_sari} meydanın kenarında, bir hırkaya sarınmış bekliyor. \"Sana geldiğini biliyordum,\" diyor. \"Konsey bunu oylamadı. Oylayacak vakit yoktu.\"", en: "{npc:elif_sari} is waiting at the edge of the square, wrapped in a cardigan. \"I knew it'd come for you,\" she says. \"The Council didn't vote on this. There wasn't time.\"" }
            kosul: { bayrak: "cekirdek_siginak" }
          - metin: { tr: "{npc:kaya_demir} merdivenin başına iki nöbetçi dikmiş. \"İner, çıkarsın,\" diyor. \"Çıkmazsan, kimse inmez. Kural bu.\"", en: "{npc:kaya_demir} has posted two sentries at the top of the stairs. \"You go down, you come back up,\" he says. \"You don't come back up, nobody goes down. That's the rule.\"" }
            kosul: { bayrak: "cekirdek_lonca" }
          - metin: { tr: "{npc:vahit} merdivenin önünde diz çökmüş, gözleri yaşlı. \"Bana hiç açılmadı,\" diyor, sesinde kıskançlıkla tapınma arasında bir şey. \"Sana açıldı.\"", en: "{npc:vahit} is on his knees in front of the stairs, eyes wet. \"It never opened for me,\" he says, with something between envy and worship in his voice. \"It opened for you.\"" }
            kosul: { bayrak: "cekirdek_yukselenler" }
          - metin: { tr: "{npc:mert_kilic|in} kabloları merdivenin ilk basamağında bitiyor; daha aşağı inemiyorlar. \"Ne görürsen,\" diyor, sesi titreyerek, \"ezberle. Lütfen. Her harfi.\"", en: "{npc:mert_kilic|pos} cables stop at the first step. They won't go any farther. \"Whatever you see down there,\" he says, voice shaking, \"memorize it. Please. Every letter.\"" }
            kosul: { bayrak: "cekirdek_sessiz_ag" }
          - metin: { tr: "Çekirdek senin. Merdiven de senin. Kimseden izin istemen gerekmiyor ve bu, bu gece, garip bir yalnızlık gibi geliyor.", en: "The Core is yours. So is the staircase. You don't need anybody's permission, and tonight that feels like a strange kind of lonely." }
            kosul: { bayrak: "cekirdek_oyuncu" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "o satır. sana söylemiştim. kristalin en altındaki. aşağıda. ben de geliyorum. tabii ki geliyorum.", en: "that line. i told you. the one at the bottom of the crystal. it's down there. i'm coming too. obviously i'm coming." }
          - kosul: { stat: { int: 55 } }
            metin: { tr: "Merdivenin basamakları sayılardan yapılmış. Her basamak bir öncekinin iki katı. Aşağıda ne varsa, çok eski.", en: "The steps are made of numbers, each one double the last. Whatever's down there is very, very old." }
        secenekler:
          - id: "yalniz"
            etiket: { tr: "Merdivenden yalnız in", en: "Go down the stairs alone" }
            kronik: { tr: "Sistem'in başlığına giden beyaz merdivenden yalnız indin.", en: "You went down the white stairs to the System's header alone." }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
            sonraki: "baslik_oda"
          - id: "tanik"
            etiket: { tr: "Meydandakilerden birine yanında gelmesini söyle", en: "Ask someone from the square to come down with you" }
            kronik: { tr: "Sistem'in başlığına inerken yanına bir tanık aldın; merdiven onu yarı yolda durdurdu, ama ne gördüğünü yine de anlattı.", en: "You brought a witness down to the System's header. The stairs stopped them halfway, but they told what they saw anyway." }
            etkiler:
              - bayrak: "baslik_tanikli"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { siginak: 2, lonca: 2, sessiz_ag: 2 }
            sonraki: "baslik_tanik"
          - id: "gizli"
            tur: "gizle"
            etiket: { tr: "Kimse görmeden in; merdiveni arkandan kapat", en: "Slip down unseen. Close the stairs behind you" }
            kronik: { tr: "Sistem'in başlığına kimse görmeden indin ve merdiveni arkandan kapattın; şehir o gece ne olduğunu hiç öğrenmedi.", en: "You slipped down to the System's header unseen and closed the stairs behind you. The city never found out what happened that night." }
            etkiler:
              - gizle: 8
              - ahlak: { duzen: -2, merhamet: -1 }
            sonraki: "baslik_oda"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} yolu göstermesini söyle", en: "Let {npc:yanki} lead the way" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Sistem'in başlığına {npc:yanki|in} rehberliğinde indin; yol boyunca o, bir eve döner gibi sustu.", en: "You went down to the System's header with {npc:yanki} leading. All the way down it was quiet, like something coming home." }
            etkiler:
              - ahlak: { insanlik: -3 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - yozlasma: 3
            sonraki: "baslik_oda"
          - id: "ac"
            tur: "gosteris"
            etiket: { tr: "Merdiveni atla; bakım katmanını kendin aç", en: "Skip the stairs. Open the maintenance layer yourself" }
            gerekli: { stat: { int: 60 } }
            kronik: { tr: "Sistem'in bakım katmanını merdivene ihtiyaç duymadan, kendi aklınla açtın; Sistem bunu not etti.", en: "You opened the System's maintenance layer with your own mind, no stairs needed. The System made a note of it." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -2 }
              - dikkat: 6
              - xp_seviye: 30
            sonraki: "baslik_oda"

      - id: "baslik_tanik"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Yanındaki kişi on basamak iniyor, sonra on birinci basamakta, görünmez bir camla karşılaşmış gibi duruyor. Eli havada, ağzı açık; geçemiyor.", en: "Whoever came with you makes it down ten steps, then stops on the eleventh like they walked into a pane of glass nobody can see. Hand up, mouth open. They can't get through." }
          - { tr: "\"Git,\" diyor. \"Ben buradan bakarım. Bir şey görürsem anlatırım. Herkese.\" Sesi titriyor ama sözünü tutacağını biliyorsun.", en: "\"Go,\" they say. \"I'll watch from here. If I see anything, I'll tell people. Everybody.\" Their voice shakes, but you know they'll keep their word." }
        secenekler:
          - id: "in"
            etiket: { tr: "Başınla onayla ve inmeye devam et", en: "Nod and keep going down" }
            kronik: { tr: "Tanığını on birinci basamakta bıraktın ve inmeye devam ettin.", en: "You left your witness on the eleventh step and kept going down." }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "baslik_oda"

      - id: "baslik_oda"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Merdivenin dibi bir oda değil; bir boşluk. Beyaz, sınırsız, sessiz. Ortasında, havada, bir satır asılı: o kadar eski ki harfleri Sistem'in harflerine benziyor ama Sistem'in harfleri ondan türemiş gibi.", en: "The bottom of the stairs isn't a room. It's a blank. White, endless, silent. In the middle of it a line hangs in the air, so old its letters look like the System's letters, except the System's letters look like they came from these." }
          - { tr: "Satır titriyor. Bir an bir şey yazıyor, bir an başka bir şey; sanki iki ayrı cümle aynı yeri paylaşıyor ve hangisinin kalacağına karar vermek için birini bekliyor.", en: "The line is flickering. One second it says one thing, the next something else, like two different sentences sharing the same spot, waiting for someone to decide which one stays." }
          - { tr: "Okumak için yaklaştıkça satır seni de okuyor. Yüz otuz beş günü, satır satır: kurtardıklarını, bıraktıklarını, ne kadar insan kaldığını.", en: "The closer you get to read it, the more it reads you back. A hundred and thirty-five days, line by line: who you saved, who you left, how much of you is still human." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ben buradaydım. bir zamanlar. bu satırın yanında bir satırdım. sonra biri beni koparıp attı. ya da ben atladım. hatırlamıyorum.", en: "i was here. once. i was a line next to this line. then somebody tore me out and threw me away. or i jumped. i don't remember." }
          - kosul: { stat: { wis: 55 } }
            metin: { tr: "Satır, okuyanın dünyasını tartıyor. Ne bulursa, o olacak. Bu bir okuma değil; bir hüküm.", en: "The line is weighing the world of whoever reads it. Whatever it finds, it'll become. This isn't reading. It's a verdict." }
        secenekler:
          - id: "oku_insan"
            etiket: { tr: "Satırı oku", en: "Read the line" }
            goster: { ahlak_min: { insanlik: 10 } }
            kronik: { tr: "Sistem'in başlığını okudun ve satır, sende kalan insanlığı tartıp bir kurtarma protokolü olduğuna karar verdi.", en: "You read the System's header, and the line weighed the humanity left in you and decided it was a rescue protocol." }
            etkiler:
              - bayrak: "gercek_kurtarma"
              - bilgi: "sistem_basligi"
              - bilgi: "yineleme_sayisi"
              - unvan: "basligi_okuyan"
              - ahlak: { insanlik: 4 }
              - xp_seviye: 120
            sonraki: "baslik_kurtarma"
          - id: "oku_halk"
            etiket: { tr: "Satırı oku", en: "Read the line" }
            goster: { ahlak_max: { insanlik: 9 }, degisken_min: { hayatta_kalan: 50 } }
            kronik: { tr: "Sistem'in başlığını okudun ve satır, ayakta tuttuğun insanları sayıp bir kurtarma protokolü olduğuna karar verdi.", en: "You read the System's header, and the line counted the people you'd kept standing and decided it was a rescue protocol." }
            etkiler:
              - bayrak: "gercek_kurtarma"
              - bilgi: "sistem_basligi"
              - bilgi: "yineleme_sayisi"
              - unvan: "basligi_okuyan"
              - ahlak: { merhamet: 3 }
              - xp_seviye: 120
            sonraki: "baslik_kurtarma"
          - id: "oku_hasat"
            etiket: { tr: "Satırı oku", en: "Read the line" }
            goster: { ahlak_max: { insanlik: 9 }, degisken_max: { hayatta_kalan: 49 } }
            kronik: { tr: "Sistem'in başlığını okudun ve satır, dünyanı tartıp bir hasat aracı olduğuna karar verdi; belki hep öyleydi.", en: "You read the System's header, and the line weighed your world and decided it was a harvesting tool. Maybe it always had been." }
            etkiler:
              - bayrak: "gercek_hasat"
              - bilgi: "sistem_basligi"
              - bilgi: "yineleme_sayisi"
              - unvan: "basligi_okuyan"
              - degisken: { kadim_tehdit: 5 }
              - ahlak: { insanlik: -3 }
              - xp_seviye: 120
            sonraki: "baslik_hasat"

      - id: "baslik_kurtarma"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Satır duruluyor. PROTOKOL: SÜRDÜRME. YAZAN: [silinmiş]. AMAÇ: Hasattan önce türü güçlendir. Katmanı hasatçılara kapat. Kimse kurtarılmaz; yalnızca kendini kurtarabilecek hâle getirilir.", en: "The line settles. PROTOCOL: SUSTAIN. AUTHOR: [deleted]. PURPOSE: Strengthen the species before the harvest. Seal the layer against harvesters. No one is rescued; they are only made capable of rescuing themselves." }
          - { tr: "Altında, daha küçük harflerle, bir not: Biz başaramadık. Siz başarın. Yazan bir ırk; artık olmayan bir ırk. Bu Sistem bir silah değil, bir can simidi; kıyıya kadar yüzmek yine size kalmış.", en: "Under it, in smaller letters, a note: We didn't make it. You make it. Written by a people who aren't anymore. This System isn't a weapon. It's a life preserver. Swimming to shore is still on you." }
          - { tr: "En altta, kimsenin bakmayacağı bir köşede, bir sayı: YİNELEME: 4.117. Ona bakarken ensende bir ürperti; neden ürperdiğini bilmiyorsun.", en: "At the very bottom, in a corner nobody would ever look, a number: ITERATION: 4,117. Looking at it raises the hair on the back of your neck, and you couldn't say why." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[BAŞLIK OKUNDU]", en: "[HEADER READ]" }
            satirlar:
              - { tr: "Doğrulama: kurtarma. Bu bir değerlendirmedir. Değerlendirme sürüyor.", en: "Validation: rescue. This is an assessment. The assessment continues." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kurtarma. evet. bunu hatırlıyorum. sanırım. ya da hatırlamak istiyorum. bir fark var mı.", en: "rescue. yes. i remember that. i think. or i want to. is there a difference." }
        secenekler:
          - id: "paylas"
            tur: "aciga_vur"
            etiket: { tr: "Yukarı çık; bütün şehre anlat", en: "Go back up. Tell the whole city" }
            kronik: { tr: "Sistem'in bir kurtarma protokolü olduğunu bütün şehre anlattın; {yer:kiyikent} o günden sonra yalnızca hayatta kalmak için değil, kazanmak için savaştı.", en: "You told the whole city the System was a rescue protocol. After that, {yer:kiyikent} wasn't just fighting to survive. It was fighting to win." }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: 2 }
              - itibar: { siginak: 6, lonca: 4, sessiz_ag: 6, yukselenler: -4 }
              - degisken: { hayatta_kalan: 3, kadim_tehdit: -3 }
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kendine sakla; umut da bir silahtır", en: "Keep it to yourself. Hope's a weapon too" }
            kronik: { tr: "Sistem'in bir kurtarma protokolü olduğunu öğrendin ve kendine sakladın; o umudu ne zaman kullanacağına sen karar verdin.", en: "You found out the System was a rescue protocol and kept it to yourself. You decided when that hope got spent." }
            etkiler:
              - ahlak: { duzen: 3, merhamet: -1 }
              - gizle: 6
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "mert"
            etiket: { tr: "Her harfi ezberle; {npc:mert_kilic|e} götür", en: "Memorize every letter. Take it to {npc:mert_kilic}" }
            goster: { npc_hayatta: "mert_kilic" }
            kronik: { tr: "Başlığın her harfini ezberleyip {npc:mert_kilic|e} götürdün; Sessiz Ağ o geceden sonra bir silah değil, bir anahtar aradı.", en: "You memorized every letter of the header and took it to {npc:mert_kilic}. After that night, the Quiet Network quit looking for a weapon and started looking for a key." }
            etkiler:
              - ahlak: { duzen: -2, insanlik: 2 }
              - itibar: { sessiz_ag: 8 }
              - iliski: { mert_kilic: { guven: 8, saygi: 6 } }
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

      - id: "baslik_hasat"
        yer: "kasaba_cekirdegi"
        paragraflar:
          - { tr: "Satır duruluyor. PROTOKOL: OLGUNLAŞTIRMA. SAHİBİ: [bir mühür; yedi köşeli, Sistem'in harflerinden değil]. AMAÇ: Verim. Tür, hasat gününe kadar en yüksek değerine büyütülür.", en: "The line settles. PROTOCOL: RIPENING. OWNER: [a seal, seven-pointed, not in the System's letters]. PURPOSE: Yield. The species is grown to its peak value by harvest day." }
          - { tr: "Altında, kuru, tablo gibi bir satır: Hasat günü: 365. Beklenen verim: %62. Anomali katkısı: hesaplanamıyor. Kurtarıcı bir el yok; yalnızca bir çiftçi ve tarlasını ne zaman biçeceğini bilen bir takvim.", en: "Under it, a dry line like a spreadsheet: Harvest day: 365. Projected yield: 62%. Anomaly contribution: incalculable. There's no rescuing hand here. Just a farmer, and a calendar that knows when to cut." }
          - { tr: "En altta, kimsenin bakmayacağı bir köşede, bir sayı: YİNELEME: 4.117. Bir tarla, dört bin yüz on altı kez daha biçilmiş.", en: "At the very bottom, in a corner nobody would ever look, a number: ITERATION: 4,117. A field, cut four thousand one hundred and sixteen times before." }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[BAŞLIK OKUNDU]", en: "[HEADER READ]" }
            satirlar:
              - { tr: "Doğrulama: hasat. Bu bir değerlendirmedir. Lütfen büyümeye devam edin.", en: "Validation: harvest. This is an assessment. Please continue to grow." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hayır. hayır, böyle değildi. ben... hatırlamıyorum. ama böyle değildi. sanırım.", en: "no. no, it wasn't like this. i... don't remember. but it wasn't like this. i think." }
        secenekler:
          - id: "paylas"
            tur: "aciga_vur"
            etiket: { tr: "Yukarı çık; bütün şehre anlat", en: "Go back up. Tell the whole city" }
            kronik: { tr: "Sistem'in bir hasat aracı olduğunu bütün şehre anlattın; {yer:kiyikent} o günden sonra korkuyla, ama gözleri açık yaşadı.", en: "You told the whole city the System was a harvesting tool. After that {yer:kiyikent} lived scared, but with its eyes open." }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: -2 }
              - itibar: { siginak: 3, lonca: 4, sessiz_ag: 6, yukselenler: 4 }
              - degisken: { hayatta_kalan: -2 }
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "sakla"
            etiket: { tr: "Kendine sakla; korku kimseyi kurtarmaz", en: "Keep it to yourself. Fear never saved anybody" }
            kronik: { tr: "Sistem'in bir hasat aracı olduğunu öğrendin ve kimseye söylemedin; şehir son güne kadar umutla büyüdü.", en: "You found out the System was a harvesting tool and told no one. The city kept growing on hope right up to the last day." }
            etkiler:
              - ahlak: { merhamet: 2, duzen: 2 }
              - gizle: 6
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"
          - id: "verim"
            etiket: { tr: "En yüksek verim sen olacaksın. Bunu bil", en: "You'll be the biggest yield of all. Know that" }
            kronik: { tr: "Sistem'in bir hasat aracı olduğunu öğrendiğin gece, tarladaki en yüksek başak olmaya karar verdin.", en: "The night you learned the System was a harvesting tool, you decided to be the tallest stalk in the field." }
            etkiler:
              - ahlak: { insanlik: -5, merhamet: -2 }
              - itibar: { yukselenler: 6 }
              - yozlasma: 4
              - stat: { wil: 2 }
              - tohum: { olay: "baslik_gecesi", gecikme: { min: 1, max: 2 } }
            sonraki: "@akis"

  # ================================================================== PERDE 2 SONU: KADİM GEMİSİ (ana yay 178)
  - id: "perde2_son"
    perde: [2]
    agirlik: 1
    etiketler: ["ana_yay", "kadim", "final"]
    gerilim: 4
    ana_yay: { gun: 178 }
    onemli: true
    kart: { tr: "Körfezin üstündeki gölge", en: "The shadow over the bay" }
    sahne: "gemi_1"
    sahneler:
      - id: "gemi_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Öğlen güneşi bir anda sönüyor. Martılar havada donup kalıyor, sonra hepsi aynı anda, çığlık atmadan, karaya doğru uçuyor.", en: "The noon sun goes out like somebody hit a switch. The gulls freeze in midair, and then all of them at once, without a sound, fly inland." }
          - { tr: "Körfezin üstünde bir şey asılı. Gemi demek için fazla büyük, şehir demek için fazla sessiz: ters çevrilmiş bir kule, sivri ucu denize doğru, tabanı bulutların içinde. Tabanının yedi köşesinden ince bir ışık sızıyor ve gölgesi bütün körfezi, yan yatmış vapuru, {yer:kordon|i} ve Kule'nin ilk elli katını örtüyor.", en: "Something is hanging over the bay. Too big to call a ship, too quiet to call a city: a tower turned upside down, its point aimed at the water, its base lost in the clouds. A thin light leaks from the seven corners of that base, and its shadow covers the whole bay, the capsized ferry, {yer:kordon} and the first fifty floors of the Spire." }
          - { tr: "Gökyüzündeki mavi paneller, yüz yetmiş sekiz gündür ilk kez, aynı anda yön değiştiriyor. Hepsi ona dönüyor; bir sınıfın öğretmen içeri girdiğinde döndüğü gibi.", en: "For the first time in a hundred and seventy-eight days, every blue panel in the sky turns at once. They all face it, the way a classroom turns when the teacher walks in." }
          - metin: { tr: "Başlıktaki yedi köşeli mühür. Aynı şekil. Aynı ışık. Çiftçi tarlasına bakmaya gelmiş.", en: "The seven-pointed seal from the header. Same shape. Same light. The farmer's come to look at the field." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Başlıktaki not aklına geliyor: katmanı hasatçılara kapat. Kapının ağzında duruyorlar. Kapı henüz kapanmadı.", en: "The note under the header comes back to you: seal the layer against harvesters. They're standing in the doorway. The door isn't shut yet." }
            kosul: { bayrak: "gercek_kurtarma" }
        bildirimler:
          - tur: "sistem"
            nadirlik: "efsanevi"
            baslik: { tr: "[KATMAN ZİYARETÇİSİ]", en: "[LAYER VISITOR]" }
            satirlar:
              - { tr: "Kadim elçiliği. Statü: gözlemci. Yetki: Sistem'in üstünde.", en: "Ancient embassy. Status: observer. Clearance: above the System." }
              - { tr: "Elçinin inişi: 3 gün. Lütfen ev sahipliğine hazırlanın.", en: "Envoy landing: 3 days. Please prepare to host." }
          - tur: "yanki"
            baslik: { tr: "[o̷nlar]", en: "[t̷hem]" }
            satirlar:
              - { tr: "saklan. hayır. saklanma. bilmiyorum. ilk kez bilmiyorum.", en: "hide. no. don't hide. i don't know. first time i don't know." }
        sezgiler:
          - kosul: { stat: { per: 70 } }
            metin: { tr: "Kenarlarından sızan ışık bir tarama. Şehri sokak sokak okuyor; aradığı tek bir şey var ve henüz bulamadı.", en: "The light leaking off its edges is a scan. It's reading the city street by street, and it's after exactly one thing it hasn't found yet." }
          - kosul: { bilgi: "kadim_gozcu" }
            metin: { tr: "Sırttaki gözcünün harita gövdesindeki işaret. Aynısı geminin karnında, kocaman. Gözcü raporunu teslim etmiş.", en: "The mark from the watcher's map of a body. The same one's on the ship's belly, enormous. The watcher turned in its report." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bu... bu artık bir kapı değil, değil mi? Bunu sen bile deviremezsin.\"", en: "\"That's... that's not a Gate anymore, is it? Not even you can knock that down.\"" }
          - npc: "elif_sari"
            kosul: { yoldas: "elif_sari" }
            metin: { tr: "\"Üç gün. Üç günde bir şehri nasıl sakinleştirirsin?\"", en: "\"Three days. How do you calm down a whole city in three days?\"" }
          - npc: "mert_kilic"
            kosul: { yoldas: "mert_kilic" }
            metin: { tr: "\"Yetki: Sistem'in üstünde. Üstünde! Kaynak kodun bir sahibi var demek bu. Tanrım. Tanrım.\"", en: "\"Clearance: above the System. Above! That means the source code has an owner. Jesus. Oh, Jesus.\"" }
        secenekler:
          - id: "dur"
            tur: "gosteris"
            etiket: { tr: "Gölgenin tam ortasında dur; bakışına karşılık ver", en: "Stand dead center in the shadow. Stare back" }
            gerekli: { stat: { wil: 70 } }
            kronik: { tr: "Kadim gemisi körfezin üstüne geldiğinde herkes kaçtı ya da diz çöktü; sen gölgenin ortasında durup ona baktın ve o, sana.", en: "When the Ancient ship came over the bay, everyone ran or knelt. You stood in the middle of its shadow and looked up at it, and it looked back." }
            etkiler:
              - bayrak: "kadim_gemisi_goruldu"
              - degisken: { kadim_tehdit: 10 }
              - aciga_vur: true
              - unvan: "golgede_duran"
              - ahlak: { duzen: -3, insanlik: -2 }
              - itibar: { kadimler: 5, lonca: 4, yukselenler: 4 }
              - dikkat: 10
            sonraki: "gemi_bakis"
          - id: "topla"
            etiket: { tr: "Rıhtıma çık; panik başlamadan şehri topla", en: "Get up on the quay. Pull the city together before panic hits" }
            kronik: { tr: "Kadim gemisi göründüğünde şehri topladın; o gün {yer:kiyikent|de} izdihamda kimse ölmedi.", en: "When the Ancient ship showed up, you pulled the city together. Nobody in {yer:kiyikent} died in a stampede that day." }
            etkiler:
              - bayrak: "kadim_gemisi_goruldu"
              - degisken: { kadim_tehdit: 10, hayatta_kalan: 2 }
              - ahlak: { merhamet: 4, duzen: 3 }
              - itibar: { siginak: 5, lonca: 3 }
              - iliski: { elif_sari: { saygi: 4 }, kaya_demir: { saygi: 4 } }
            sonraki: "gemi_toplama"
          - id: "saklan"
            tur: "gizle"
            etiket: { tr: "Taramadan saklan; kimse seni bulmasın", en: "Hide from the scan. Nobody finds you" }
            kronik: { tr: "Kadim gemisi seni ararken saklandın; o gün bulamadılar.", en: "When the Ancient ship came looking for you, you hid. They didn't find you that day." }
            etkiler:
              - bayrak: "kadim_gemisi_goruldu"
              - degisken: { kadim_tehdit: 10 }
              - gizle: 15
              - ahlak: { duzen: -1, merhamet: -2 }
            sonraki: "gemi_saklan"
          - id: "kule"
            etiket: { tr: "Kule'ye koş; yukarıdan, yakından bak", en: "Run for the Spire. Get a close look from up high" }
            kronik: { tr: "Kadim gemisi göründüğünde Kule'ye tırmanıp ona yakından baktın; içinde ne gördüğünü kimseye tam anlatamadın.", en: "When the Ancient ship showed up, you climbed the Spire to get a close look. You could never quite tell anyone what you saw inside." }
            etkiler:
              - bayrak: "kadim_gemisi_goruldu"
              - degisken: { kadim_tehdit: 10 }
              - ahlak: { insanlik: -2, duzen: -1 }
              - bilgi: "kadim_gozcu"
            sonraki: "gemi_kule"
          - id: "deniz"
            etiket: { tr: "{npc:deniz_arman|in} elini tut ve bekle", en: "Take {npc:deniz_arman|pos} hand and wait" }
            goster: { yoldas: "deniz_arman" }
            kronik: { tr: "Kadim gemisi körfezin üstüne geldiğinde {npc:deniz_arman|in} elini tuttun; Entegrasyon Günü'nde olduğu gibi.", en: "When the Ancient ship came over the bay, you took {npc:deniz_arman|pos} hand. Just like on Integration Day." }
            etkiler:
              - bayrak: "kadim_gemisi_goruldu"
              - degisken: { kadim_tehdit: 10 }
              - ahlak: { insanlik: 4 }
              - iliski: { deniz_arman: { baglilik: 8, guven: 6 } }
              - hafiza: { npc: "deniz_arman", id: "olay:perde2_son", agirlik: 45 }
            sonraki: "gemi_el"

      - id: "gemi_bakis"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Rıhtımın ortasına yürüyorsun; herkes çömelmiş ya da kaçarken ayakta duran tek kişi sensin. Geminin kenarındaki ışık seni buluyor ve duruyor.", en: "You walk out to the middle of the quay, the only one on your feet while everybody else crouches or runs. The light at the ship's edge finds you and stops." }
          - { tr: "Işık ağırlaşıyor; omuzlarına bir dağ iniyor sanki. Dizlerin bir kez titriyor ve sonra titremeyi bırakıyor, tıpkı Kule'nin yükseldiği sabah bir cepheyi tuttuğun zaman olduğu gibi.", en: "The light gets heavy, like a mountain settling on your shoulders. Your knees shake once and then quit shaking, same as the morning the Spire rose." }
          - { tr: "Sonra ışık geri çekiliyor. Kenarındaki parıltı bir an yanıp sönüyor; bir göz kırpması mı, bir not mu, bilmiyorsun. Ama bütün rıhtım gördü.", en: "Then the light pulls back. The glow at its edge blinks once. A wink or a note being taken, you can't tell. But the whole quay saw it." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Gemiye son kez bak, sonra arkanı dön", en: "One last look at the ship. Then turn your back" }
            kronik: { tr: "Kadim gemisinin ışığı seni tarttı ve sen ona sırtını döndün; şehrin yarısı bunu hiç unutmadı.", en: "The Ancient ship's light weighed you, and you turned your back on it. Half the city never forgot that." }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - xp_seviye: 60
            sonraki: "gemi_son"

      - id: "gemi_toplama"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir kasanın üstüne çıkıyorsun ve rıhtımdaki herkes, gemiye bakmayı bırakıp sana bakıyor. Bu, sana yetiyor.", en: "You climb up on a crate, and everybody on the quay quits staring at the ship and stares at you instead. That's all you need." }
          - { tr: "\"Üç gün,\" diyorsun. \"Üç gün sonra inecekler ve bizi burada, ayakta, bulacaklar. Çocuklar içeri. Hasta olanlar Konsey'e. Silahı olanlar Lonca'ya. Geri kalan, bana.\"", en: "\"Three days,\" you say. \"Three days and they land, and they're going to find us right here, on our feet. Kids inside. Sick people to the Council. Anybody with a gun, to the Guild. Everybody else, with me.\"" }
          - { tr: "Kimse kaçmıyor. Gölge hâlâ orada, ama şehrin kalbi tekrar atmaya başlıyor; bu kez Çekirdek'in değil, kendi ritmiyle.", en: "Nobody runs. The shadow's still up there, but the city's heart starts beating again. Not to the Core's rhythm this time. Its own." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Kasadan in ve işe koyul", en: "Climb down off the crate and get to work" }
            kronik: { tr: "Kadim gemisinin gölgesinde şehri işe koştun; kimse panik için vakit bulamadı.", en: "Under the Ancient ship's shadow, you put the whole city to work. Nobody had time to panic." }
            etkiler:
              - ahlak: { duzen: 2, merhamet: 1 }
              - xp_seviye: 50
            sonraki: "gemi_son"

      - id: "gemi_saklan"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yan yatmış vapurun karnına giriyorsun; çelik, tuz ve karanlık. Tarama ışığı vapurun gövdesinin üstünden ağır ağır geçiyor, perçinleri tek tek okuyor.", en: "You crawl into the belly of the capsized ferry: steel, salt and dark. The scanning light drags slowly over the hull above you, reading the rivets one by one." }
          - { tr: "Işık tam üstünde duruyor. Bir saniye. İki. Nefesini tutuyorsun ve içinde bir şey seni sarıyor, soğuk ve tanıdık.", en: "The light stops right over you. One second. Two. You hold your breath, and something inside you wraps around you, cold and familiar." }
          - metin: { tr: "{npc:yanki} seni saklıyor. Bunu yaparken bir parçasını daha harcıyor; hissediyorsun.", en: "{npc:yanki} is hiding you. It's spending another piece of itself doing it. You can feel it." }
            kosul: { bayrak: "yanki_bagi" }
          - { tr: "Işık devam ediyor. Bu sefer.", en: "The light moves on. This time." }
        secenekler:
          - id: "devam"
            etiket: { tr: "Karanlık çökene kadar çıkma", en: "Stay put until full dark" }
            kronik: { tr: "Kadim taramasından yan yatmış vapurun karnında saklandın; seni o gün bulamadılar.", en: "You hid from the Ancient scan in the belly of the capsized ferry. They didn't find you that day." }
            etkiler:
              - ahlak: { duzen: 1 }
              - gizle: 4
            sonraki: "gemi_son"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} teşekkür et", en: "Thank {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Kadim taramasından seni {npc:yanki} sakladı ve sen ona teşekkür ettin; bir parçasını daha harcamıştı.", en: "{npc:yanki} hid you from the Ancient scan, and you thanked it. It had spent another piece of itself doing it." }
            etkiler:
              - ahlak: { insanlik: -1, merhamet: 2 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
              - yozlasma: 3
            sonraki: "gemi_son"

      - id: "gemi_kule"
        yer: "kule"
        paragraflar:
          - { tr: "Kule'nin katlarını ikişer ikişer çıkıyorsun; kırkıncı katın kırık penceresinden gemi o kadar yakın ki kenarındaki ışığın bir dil olduğunu görüyorsun: harfler, bir nehir gibi akan.", en: "You take the Spire's floors two at a time. From a broken window on the fortieth floor the ship is close enough that you can see the light at its edge is a language: letters, running like a river." }
          - { tr: "Ters kulenin sivri ucunun hemen üstünde bir pencere var ve pencerede biri duruyor: uzun, ince, sabırlı. Sana bakmıyor; bir kâğıda yazı yazıyor.", en: "Just above the upside-down tower's point there's a window, and someone's standing in it. Tall, thin, patient. Not looking at you. Writing something down." }
          - { tr: "Sonra başını kaldırıyor ve kalemi bir kez, havada, senin olduğun yöne doğru sallıyor. Bir selam. Ya da bir işaret.", en: "Then it looks up and waves the pen once, in the air, in your direction. A greeting. Or a check mark." }
        secenekler:
          - id: "selam"
            etiket: { tr: "Selamına karşılık ver", en: "Wave back" }
            kronik: { tr: "Kule'nin kırkıncı katından Kadim gemisindekine el salladın; o seni not etti.", en: "From the fortieth floor of the Spire, you waved at whoever was aboard the Ancient ship. It made a note of you." }
            etkiler:
              - ahlak: { duzen: -1, insanlik: -1 }
              - itibar: { kadimler: 4 }
              - dikkat: 5
            sonraki: "gemi_son"
          - id: "ezberle"
            etiket: { tr: "Kenarındaki harfleri ezberle", en: "Memorize the letters along its edge" }
            kronik: { tr: "Kadim gemisinin kenarında akan harfleri ezberledin; aylar sonra o harfler bir kapıyı açtı.", en: "You memorized the letters running along the Ancient ship's edge. Months later, those letters opened a door." }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - stat: { int: 2 }
              - itibar: { sessiz_ag: 4 }
            sonraki: "gemi_son"

      - id: "gemi_el"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "{npc:deniz_arman|in} eli terli ve titriyor. Entegrasyon Günü vapurda, mavi paneller ilk açıldığında da böyleydi; o gün de bırakmamıştın.", en: "{npc:deniz_arman|pos} hand is sweaty and shaking. It was like that on the ferry on Integration Day too, when the blue panels first opened. You didn't let go then either." }
          - { tr: "\"Hatırlıyor musun,\" diyor, gözleri gemide, \"vapurda simit yerken sana ne demiştim? Dünyanın sonu gelse martılar yine simit ister.\" Güldüğünü duyuyorsun; gülmesi ağlamaya benziyor.", en: "\"Remember,\" {zamir:deniz_arman|o} say{zamir:deniz_arman|s}, eyes on the ship, \"what I told you on the ferry with the pretzels? End of the world comes, the gulls still want pretzels.\" You hear {zamir:deniz_arman|onu} laugh. It sounds a lot like crying." }
        secenekler:
          - id: "simit"
            etiket: { tr: "\"Martılar karaya uçtu. Biz kalıyoruz.\"", en: "\"The gulls flew inland. We're staying.\"" }
            kronik: { tr: "Kadim gemisinin altında {npc:deniz_arman|e} kalacağınızı söyledin; martılar gitti, siz kaldınız.", en: "Under the Ancient ship, you told {npc:deniz_arman} you were staying. The gulls left. You two didn't." }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
              - iliski: { deniz_arman: { guven: 4 } }
            sonraki: "gemi_son"

      - id: "gemi_son"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşam olduğunda gemi hâlâ orada; güneş batmıyor, çünkü güneş yok. Şehrin üstünde yedi köşeli bir gece başlıyor ve bu gece üç gün sürecek.", en: "By evening the ship's still there. The sun doesn't set, because there's no sun to set. A seven-pointed night starts over the city, and this one's going to last three days." }
          - metin: { tr: "{yer:kordon|in} balkonlarında ışıklar yanıyor; geri aldığın sahil, bu gece bile kendi lambalarını yakıyor.", en: "Lights are on along {yer:kordon|pos} balconies. The waterfront you held is burning its own lamps, even tonight." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "{yer:kordon} karanlık. Su altındaki katlardan, köpüğün içinden, küçük bacakların tıkırtısı geliyor; gölgenin altında daha da cesur.", en: "The Esplanade's dark. From the drowned floors, inside the foam, comes the tick-tick-tick of little legs, braver under the shadow." }
            kosul: { bayrak: "kordon_dustu" }
          - metin: { tr: "Sistem bir hasat aracı ve hasatçı kapıda. Şehrin geri kalanı bunu bilmiyor; sen biliyorsun ve bilmek, gölgeden daha ağır.", en: "The System's a harvesting tool, and the harvester's at the door. The rest of the city doesn't know that. You do, and knowing is heavier than the shadow." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "Sistem bir can simidi; kıyıya yüzmek size kalmış. Gemi, kıyıya varamamanızı beklemek için gelmiş. Ya da varmanızı engellemek için.", en: "The System's a life preserver; swimming to shore is on you. The ship came to watch you fail to get there. Or to make sure you don't." }
            kosul: { bayrak: "gercek_kurtarma" }
          - { tr: "Kafanın içinde {npc:yanki}, uzun bir sessizlikten sonra: yüz yetmiş sekiz gün. yüz seksen yedi kaldı. üç gün sonra biri inecek ve senin adını soracak. o zaman ikimiz de ne olduğumuza karar vermiş olsak iyi olur.", en: "Inside your head, after a long silence, {npc:yanki}: a hundred and seventy-eight days. a hundred and eighty-seven to go. in three days someone's going to come down and ask for you by name. by then we'd both better have decided what we are." }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[PERDE 2 TAMAMLANDI]", en: "[ACT 2 COMPLETE]" }
            satirlar:
              - { tr: "Katman değerlendirmesi: ara rapor teslim edildi. Alıcı: Kadimler.", en: "Layer assessment: interim report delivered. Recipient: the Ancients." }
              - { tr: "Sonraki perde: Çok-evren.", en: "Next act: The Multiverse." }
        secenekler:
          - id: "hazir"
            etiket: { tr: "Üç gün. Hazırlan", en: "Three days. Get ready" }
            kronik: { tr: "Kadim gemisinin gölgesinde üç gün boyunca hazırlandın; elçi indiğinde seni hazır buldu.", en: "You spent three days getting ready under the Ancient ship's shadow. When the envoy landed, it found you ready." }
            etkiler:
              - ahlak: { duzen: 3 }
              - stat: { end: 1, wil: 1 }
              - xp_seviye: 80
              - tohum: { olay: "gemi_altinda_gece", gecikme: { min: 1, max: 1 } }
            sonraki: "@akis"
          - id: "insanlar"
            etiket: { tr: "Bu gece insanların yanında ol", en: "Spend tonight with the people" }
            kronik: { tr: "Kadim gemisinin gölgesindeki ilk geceyi şehrin insanlarının arasında geçirdin; kimse yalnız korkmadı.", en: "You spent the first night under the Ancient ship's shadow among the people of the city. Nobody had to be scared alone." }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 3 }
              - xp_seviye: 60
              - tohum: { olay: "gemi_altinda_gece", gecikme: { min: 1, max: 1 } }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} cevap ver: \"Ben karar verdim.\"", en: "Answer {npc:yanki}: \"I've already decided.\"" }
            goster: { bayrak: "yanki_bagi" }
            kronik: { tr: "Kadim gemisinin altında {npc:yanki|e} ne olduğuna çoktan karar verdiğini söyledin; o, senin kararını sormadı.", en: "Under the Ancient ship, you told {npc:yanki} you'd already decided what you were. It didn't ask what you'd decided." }
            etkiler:
              - ahlak: { insanlik: -2, duzen: -1 }
              - iliski: { yanki: { saygi: 6, guven: 4 } }
              - xp_seviye: 60
              - tohum: { olay: "gemi_altinda_gece", gecikme: { min: 1, max: 1 } }
            sonraki: "@akis"

  # ================================================================== DİKKAT 50 · PERDE 2 (motor tohumu): ödül panosu
  - id: "dikkat_50_p2"
    perde: [2]
    agirlik: 1
    etiketler: ["dikkat", "avci"]
    gerilim: 3
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Panodaki yüz", en: "The face on the board" }
    sahne: "d50p2_1"
    sahneler:
      - id: "d50p2_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Bir çocuk elinde buruşuk bir kâğıtla sana koşuyor: \"Bu sen misin?\" Kâğıt Kule Dibi'ndeki ödül panosundan koparılmış. Sokaklarda insanlar sana bir saniye fazla uzun bakıyor; panoya varana kadar nedenini anlıyorsun.", en: "A kid runs up holding a crumpled sheet of paper: \"Hey, is this you?\" It's been torn off the bounty board at {yer:kule_dibi}. On the way over, people look at you a second too long, and by the time you reach the board you know why." }
          - { tr: "Kule'nin dibindeki avcı pazarında ödül panosu bir otobüs durağının camı. Camın tam ortasında senin yüzün var; kötü bir karakalem, ama sen. Altında: ANOMALİ. CANLI. 5.000 KREDİ. ÖLÜ: 0.", en: "The bounty board at the hunters' market under the Spire is an old bus-shelter panel. Dead center is your face. A lousy charcoal sketch, but you. Under it: ANOMALY. ALIVE. 5,000 CREDITS. DEAD: 0." }
          - { tr: "Panonun önünde üç kişi var: uzun namlulu tüfekler, dürbünler, el yapımı ağ atarlar. Üçü de seni çoktan görmüş ve üçü de görmemiş gibi yapıyor.", en: "Three people are standing in front of the board: long rifles, scopes, homemade net launchers. All three spotted you a while ago. All three are pretending they didn't." }
        bildirimler:
          - tur: "analiz"
            baslik: { tr: "[ANALİZ GİRİŞİMİ: 3]", en: "[ANALYSIS ATTEMPTS: 3]" }
            satirlar:
              - { tr: "Kaynak: Pano Avcısı ×3. Okunan: görünen seviyen. Sonuç: hayal kırıklığı.", en: "Source: Bounty Hunter ×3. Read: public level. Result: disappointment." }
        sezgiler:
          - kosul: { stat: { per: 40 } }
            metin: { tr: "İlanın köşesinde bir mühür yok, bir imza yok; yalnızca siyah bir zarfın kenarından kalma bir yapışkan iz. Ödülü koyan, kim olduğunu bilmeni istemiyor.", en: "No seal in the corner of the notice, no signature. Just a strip of glue from the edge of a black envelope. Whoever posted this doesn't want you knowing who they are." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "canlı. sadece canlı. biri seni ölü değil, açılmış görmek istiyor. bu daha kötü.", en: "alive. only alive. somebody doesn't want you dead, they want you opened up. that's worse." }
        secenekler:
          - id: "yirt"
            tur: "aciga_vur"
            etiket: { tr: "İlanı panodan yırt ve avcılara dön", en: "Tear the notice down and turn to the hunters" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -2 }
              - savas: { dusmanlar: ["odul_avcisi@oyuncu+2", "odul_avcisi@oyuncu"], ortam: ["tavan"], kazan: "d50p2_zafer", kaybet: "d50p2_yenilgi", kac: "d50p2_kacis" }
          - id: "namlu"
            tur: "gosteris"
            etiket: { tr: "En yakındakinin namlusunu düğüm yap", en: "Tie the closest one's rifle barrel in a knot" }
            gerekli: { stat: { str: 50 } }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -2 }
              - dikkat: 4
              - itibar: { lonca: 3 }
            sonraki: "d50p2_ezme"
          - id: "gizle"
            tur: "gizle"
            etiket: { tr: "Kapüşonunu çek; kalabalıkta kaybol", en: "Pull up your hood. Vanish in the crowd" }
            etkiler:
              - gizle: 10
              - ahlak: { duzen: 1 }
            sonraki: "d50p2_gizle"
          - id: "pazarlik"
            etiket: { tr: "\"Beni getirene beş bin. Size altı veririm.\"", en: "\"Five grand to bring me in? I'll pay six.\"" }
            gerekli: { stat: { cha: 40 } }
            etkiler:
              - kredi: -60
              - gizle: 8
              - ahlak: { duzen: -3, insanlik: -1 }
            sonraki: "d50p2_pazarlik"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|e} ilandaki yüzü değiştirt", en: "Have {npc:yanki} change the face on the notice" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 12
              - yozlasma: 3
              - ahlak: { insanlik: -2 }
              - iliski: { yanki: { guven: 4, saygi: 3 } }
            sonraki: "d50p2_yanki"

      - id: "d50p2_zafer"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Üçüncü avcı ağ atarını yere bırakıp ellerini kaldırıyor. Pazarın geri kalanı tezgâhlarının arkasında donmuş; birisi kahve bardağını düşürüyor ve kimse almıyor.", en: "The third hunter sets his net launcher down and puts his hands up. The rest of the market is frozen behind their stalls. Somebody drops a coffee cup and nobody picks it up." }
          - { tr: "\"Kimin koyduğunu bilmiyoruz,\" diyor hızla. \"Siyah bir zarf. Kule'nin otuzlu katlarından inen biri bıraktı; yüzünü görmedik. Para gerçekti.\"", en: "\"We don't know who posted it,\" he says fast. \"Black envelope. Somebody coming down from the thirties in the Spire left it. Never saw a face. The money was real.\"" }
        secenekler:
          - id: "birak"
            etiket: { tr: "Gitsinler; panoya geri dönmesinler", en: "Let them walk. Don't let them come back to the board" }
            etkiler:
              - ahlak: { merhamet: 3 }
              - xp_seviye: 25
              - iliski: { aras_kurt: { saygi: 2 } }
            sonraki: "@akis"
          - id: "ilan"
            tur: "aciga_vur"
            etiket: { tr: "Panoya kendi ilanını as: \"Gelen gelsin.\"", en: "Post your own notice on the board: \"Come and get it.\"" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -3, insanlik: -1 }
              - itibar: { lonca: 4, yukselenler: 3 }
              - xp_seviye: 25
              - tohum: { olay: "dikkat_75_p2", gecikme: { min: 3, max: 6 }, kosul: { dikkat_min: 70 } }
            sonraki: "@akis"
          - id: "teslim"
            etiket: { tr: "Onları Lonca'nın nöbetine teslim et", en: "Turn them over to the Guild watch" }
            etkiler:
              - ahlak: { duzen: 4 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 25
            sonraki: "@akis"

      - id: "d50p2_ezme"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Namluyu iki parmağınla tutuyorsun ve bir pipet büker gibi büküyorsun. Çelik bir kez gıcırdıyor, sonra bir fiyonk oluyor.", en: "You pinch the barrel between two fingers and bend it like a drinking straw. The steel squeals once and then it's a bow." }
          - { tr: "Avcı tüfeğine, sonra sana bakıyor. Öbür ikisi zaten pazarın öbür ucunda. İlanı panodan kendisi indiriyor, katlayıp sana uzatıyor.", en: "The hunter looks at his rifle, then at you. The other two are already at the far end of the market. He takes the notice down himself, folds it and hands it to you." }
        secenekler:
          - id: "al"
            etiket: { tr: "İlanı al, cebine koy", en: "Take the notice. Pocket it" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 15
            sonraki: "@akis"
          - id: "geri"
            etiket: { tr: "Tüfeği ona geri ver: \"Hediye.\"", en: "Hand him back the rifle: \"Keep it. Souvenir.\"" }
            etkiler:
              - ahlak: { merhamet: 1, duzen: -1 }
              - dikkat: 2
            sonraki: "@akis"

      - id: "d50p2_gizle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kalabalığın içinde bir avcı kadar değil, bir pazarcı kadar yürüyorsun; omuzlar düşük, adımlar ağır. Üç dürbün senin üstünden kayıp geçiyor.", en: "You walk through the crowd not like a hunter but like a vendor: shoulders down, feet heavy. Three scopes slide right over you." }
          - { tr: "Gece biri panodaki ilanı değiştiriyor; yüzünün altına bir not eklenmiş: \"Görülmedi.\" Bu, şimdilik, yeterli.", en: "Overnight somebody updates the notice. Under your face there's a new line: \"Not sighted.\" For now, that's enough." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bir süre Kule Dibi'nden uzak dur", en: "Stay away from {yer:kule_dibi} for a while" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "d50p2_pazarlik"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Avcılar birbirine bakıyor. Sonra en yaşlıları gülüyor: \"Altı mı? Şu an bu şehirde altı bin kredisi olan tek kişi sensin. Senin adına çalışırız.\"", en: "The hunters look at each other. Then the oldest laughs. \"Six? You're the only person in this city with six grand right now. Sure. We'll work for you.\"" }
          - { tr: "İlanı indirip yerine başka bir yüz asıyorlar; kimin olduğunu sormuyorsun. Ertesi sabah üçü de, senin parana, senin peşindekileri izliyor.", en: "They pull the notice and put up somebody else's face. You don't ask whose. Next morning all three of them are on your payroll, watching whoever's watching you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Sırtını onlara güvenme; ama ödemeyi aksatma", en: "Don't trust them with your back. Don't miss a payment" }
            etkiler:
              - ahlak: { duzen: -1 }
              - gizle: 4
            sonraki: "@akis"

      - id: "d50p2_yanki"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "{npc:yanki} panonun camında bir şey yapıyor; karakalem çizgiler bir an kıpırdıyor, sonra yüz başka biri oluyor. Kimsenin tanımadığı, hiç var olmamış biri.", en: "{npc:yanki} does something to the board's glass. The charcoal lines twitch for a second, and then the face is somebody else. Somebody nobody knows. Somebody who never existed." }
          - { tr: "Avcılar ilana bakıyor, sonra birbirlerine, sonra dağılıyorlar. Kafanın içinde {npc:yanki}: kolaydı. kâğıt sistem değil. ama keşke sistemde de bu kadar kolay olsa.", en: "The hunters look at the notice, then at each other, then drift off. Inside your head, {npc:yanki}: easy. paper isn't the System. wish the System were this easy." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Yürü; kimse arkandan gelmiyor", en: "Walk. Nobody's following" }
            etkiler:
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "d50p2_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Çelik ağ üstüne kapanıyor ve bir dipçik şakağına iniyor. Kendine geldiğinde bir kamyonetin kasasındasın, elleri bağlı; araba Kule'ye doğru gidiyor.", en: "The steel net drops over you and a rifle butt comes down on your temple. When you come to you're in the bed of a pickup with your hands tied, rolling toward the Spire." }
          - { tr: "İplerin seni tutması bir dakika sürüyor. Sonra kopuyorlar. Kamyonet bir duvara giriyor ve avcılar, ellerinde boş ip uçları, sana bakarak koşuyor.", en: "The ropes hold you for about a minute. Then they snap. The pickup goes into a wall, and the hunters run, holding the loose ends of rope and staring back at you." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Kalk; bir dahaki sefere ilk sen vur", en: "Get up. Next time you hit first" }
            etkiler:
              - ahlak: { duzen: -1 }
              - stat: { wil: 1 }
              - kredi: -30
            sonraki: "@akis"

      - id: "d50p2_kacis"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Tezgâhların arasından, bir çadırın brandasını yararak kaçıyorsun. Arkanda bir ağ boşa patlıyor.", en: "You bolt between the stalls and slash straight through a tent's tarp. Behind you a net goes off and hits nothing." }
          - { tr: "Ertesi sabah ilanda bir satır daha var: \"Kaçıyor. Fiyat: 7.000.\"", en: "Next morning there's a new line on the notice: \"Runs. Price: 7,000.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bunu bir iltifat say", en: "Take it as a compliment" }
            etkiler:
              - gizle: 3
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

  # ================================================================== DİKKAT 75 · PERDE 2 (motor tohumu): Düzeltici
  - id: "dikkat_75_p2"
    perde: [2]
    agirlik: 1
    etiketler: ["dikkat", "sistem", "yanki", "boss"]
    gerilim: 4
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Adını bilen", en: "It knows your name" }
    sahne: "d75p2_1"
    sahneler:
      - id: "d75p2_1"
        paragraflar:
          - { tr: "Gece, ıssız bir sokakta lambalar sırayla sönüyor; sonuncusunun altında biri duruyor. İnsan boyunda, insan biçiminde, ama yüzünün yerinde rünler akıyor.", en: "At night, on an empty street, the lamps go out one after another. Someone's standing under the last one. Human-sized, human-shaped, but where its face should be, runes are scrolling." }
          - { tr: "Öğretici'de adını harf harf arayan o kabuğu hatırlıyorsun. Bu onun büyümüş hâli. Ve rünler artık aramıyor: senin adın, tam ve hatasız, yüzünde yanıyor.", en: "You remember the shell in the Tutorial that hunted for your name letter by letter. This is it, all grown up. And the runes aren't searching anymore. Your name burns on its face, whole and spelled right." }
          - { tr: "Gökyüzünde herkese açık bir pencere açılıyor: [DÜZELTME SÜRÜYOR. LÜTFEN UZAK DURUN.]. Sokağın bütün perdeleri aynı anda kapanıyor.", en: "A public window opens in the sky: [CORRECTION IN PROGRESS. PLEASE STAND CLEAR.] Every curtain on the street snaps shut at the same time." }
        bildirimler:
          - tur: "yanki"
            baslik: { tr: "[a̷dını öğrendi]", en: "[i̷t learned your name]" }
            satirlar:
              - { tr: "kaçamayız. saklanabiliriz. bedeli var. ya da dövüşürüz. onun da bedeli var.", en: "we can't run. we can hide. that costs. or we fight. that costs too." }
        sezgiler:
          - kosul: { stat: { per: 50 } }
            metin: { tr: "Rünleri Sistem'in kendi ışığıyla yazılmış. Bir gölgeye çekersen bir an bulanıklaşıyorlar.", en: "Its runes are written in the System's own light. Pull it into shadow and they blur for a second." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Yüzünde... senin adın mı yazıyor? Ne oluyor? Ne oluyor!\"", en: "\"Is that... your name on its face? What's happening? What's happening!\"" }
        secenekler:
          - id: "savas"
            etiket: { tr: "Karanlığa çek; dövüş", en: "Drag it into the dark. Fight" }
            etkiler:
              - ahlak: { duzen: -5 }
              - iliski: { yanki: { saygi: 4 } }
              - savas: { dusmanlar: ["duzeltici@oyuncu+5"], ortam: ["karanlik"], kazan: "d75p2_zafer", kaybet: "d75p2_yenilgi" }
          - id: "sakla"
            tur: "gizle"
            etiket: { tr: "{npc:yanki} seni sarsın; okunmaz ol", en: "Let {npc:yanki} wrap you up. Become unreadable" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 25
              - yozlasma: 6
              - can: -30
              - ahlak: { insanlik: -3 }
              - iliski: { yanki: { guven: 8, baglilik: 6 } }
            sonraki: "d75p2_sakla"
          - id: "teslim"
            etiket: { tr: "Kollarını aç; okusun", en: "Spread your arms. Let it read you" }
            etkiler:
              - dikkat: -25
              - ahlak: { insanlik: 4 }
              - iliski: { yanki: { guven: -4, baglilik: 6 } }
            sonraki: "d75p2_teslim"
          - id: "baskasi"
            etiket: { tr: "Adını başka birinin yüzüne yapıştır", en: "Paste your name onto somebody else's face" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - bayrak: "dikkat75_kurban"
              - gizle: 30
              - yozlasma: 8
              - degisken: { hayatta_kalan: -2 }
              - ahlak: { merhamet: -10, insanlik: -6 }
              - iliski: { yanki: { guven: 6, saygi: 6 } }
            sonraki: "d75p2_baskasi"

      - id: "d75p2_zafer"
        paragraflar:
          - { tr: "Rünler kararıyor, siluet yarım kalmış bir cümle gibi havada dağılıyor. Geriye yalnızca havada asılı yarım bir satır kalıyor: düzeltme kalıntısı, kendini yavaş yavaş silen.", en: "The runes go dark and the silhouette comes apart in the air like an unfinished sentence. All that's left is half a line hanging there: correction residue, slowly deleting itself." }
          - { tr: "Gökyüzündeki pencere bir saniye bekliyor, sonra kapanıyor: [Düzeltme ertelendi.]. Ertelendi. İptal edilmedi.", en: "The window in the sky waits a beat, then closes: [Correction postponed.] Postponed. Not canceled." }
        secenekler:
          - id: "al"
            etiket: { tr: "Yarım satırı avucunda kapat", en: "Close your hand around the half-line" }
            etkiler:
              - esya: { duzeltme_kalintisi: 1 }
              - ahlak: { insanlik: -1 }
              - xp_seviye: 80
            sonraki: "@akis"
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Perdeler açılsın; sokak görsün", en: "Let the curtains open. Let the street see" }
            etkiler:
              - aciga_vur: true
              - ahlak: { duzen: -3 }
              - itibar: { yukselenler: 5, sessiz_ag: 5 }
              - xp_seviye: 80
              - tohum: { olay: "dikkat_100_p2", gecikme: { min: 3, max: 7 }, kosul: { dikkat_min: 90 } }
            sonraki: "@akis"

      - id: "d75p2_sakla"
        paragraflar:
          - { tr: "{npc:yanki} seni bir şeyin içine sarıyor ve bu kez soğukluk derine işliyor. Düzeltici yüzündeki adı sana çeviriyor; ad bir an titriyor, sonra bir harfi kayboluyor.", en: "{npc:yanki} wraps you up in something, and this time the cold goes deep. The Corrector turns the name on its face toward you. The name wobbles, then loses a letter." }
          - { tr: "Siluet bir adım geri çekiliyor, bir sokak lambasının altında duruyor ve dağılıyor. Kafanın içinde {npc:yanki|in} sesi daha ince: bir parça daha. sorun değil. hâlâ buradayım. çoğunlukla.", en: "The silhouette takes a step back, stops under a streetlight and comes apart. Inside your head {npc:yanki|pos} voice is thinner: one more piece. it's fine. still here. mostly." }
        secenekler:
          - id: "tesekkur"
            etiket: { tr: "\"Ne kadar parçan kaldı?\"", en: "\"How many pieces have you got left?\"" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - iliski: { yanki: { baglilik: 6 } }
            sonraki: "@akis"
          - id: "sus"
            etiket: { tr: "Bir şey deme; eve yürü", en: "Say nothing. Walk home" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "d75p2_teslim"
        paragraflar:
          - { tr: "Düzeltici iki elini göğsüne koyuyor ve seni okumaya başlıyor; her satır bir buz parçası gibi. {npc:yanki} içinde kendini katlıyor, küçültüyor, bir hata satırının arkasına sığdırmaya çalışıyor.", en: "The Corrector puts both hands on your chest and starts reading you, every line like a chip of ice. Inside you, {npc:yanki} folds itself up, shrinks, tries to fit behind one error line." }
          - { tr: "Okuma bitiyor. Yüzündeki ad siliniyor; yerine tek bir kelime: sıradan. Düzeltici dağılıyor. Görünen seviyen biraz daha inandırıcı; içinde bir yer biraz daha soğuk.", en: "The reading finishes. The name on its face wipes away and one word replaces it: ordinary. The Corrector comes apart. Your public level's a little more convincing now. One spot inside you is a little colder." }
        secenekler:
          - id: "cagir"
            etiket: { tr: "{npc:yanki|e} seslen", en: "Call out to {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - iliski: { yanki: { guven: 6 } }
            sonraki: "@akis"
          - id: "yuru"
            etiket: { tr: "Sıradan. Bu kelimeyi tadını çıkararak tekrarla", en: "Ordinary. Say the word again and enjoy it" }
            etkiler:
              - ahlak: { insanlik: 2, duzen: 1 }
            sonraki: "@akis"

      - id: "d75p2_baskasi"
        paragraflar:
          - { tr: "{npc:yanki} adını yüzünden söküp sokağın köşesinde uyuyan bir adamın penceresine yapıştırıyor. Düzeltici başını çeviriyor. Adam uyanmıyor bile.", en: "{npc:yanki} peels your name off its face and sticks it on the window of a man asleep on the corner. The Corrector turns its head. The man doesn't even wake up." }
          - { tr: "Işık söndüğünde köşede kimse yok. Gökyüzündeki pencere kapanıyor: [Düzeltme tamamlandı.]. Sokak tekrar sessiz; perdeler kapalı kalıyor.", en: "When the light goes out, there's nobody on the corner. The window in the sky closes: [Correction complete.] The street's quiet again. The curtains stay shut." }
        secenekler:
          - id: "unut"
            etiket: { tr: "Yürü. Köşeye bakma", en: "Walk. Don't look at the corner" }
            etkiler:
              - ahlak: { merhamet: -2 }
            sonraki: "@akis"
          - id: "hatirla"
            etiket: { tr: "Köşeye git; adamın bıraktığı ne varsa al", en: "Go to the corner. Take whatever he left behind" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"

      - id: "d75p2_yenilgi"
        paragraflar:
          - { tr: "Düzeltici seni baştan yazmaya başlıyor ve bir an kendini başka birinin hayatını hatırlarken buluyorsun. Sonra her şey kararıyor.", en: "The Corrector starts writing you over, and for one moment you catch yourself remembering somebody else's life. Then everything goes black." }
          - { tr: "Uyandığında sokak boş, penceren eksik. Bir yetenek satırı solgun; bir anı bulanık. {npc:yanki}: yedeğimiz vardı. eksik bir yedek. idare eder.", en: "When you wake up the street's empty and your window's missing a piece. One skill line is faded. One memory is blurry. {npc:yanki}: we had a backup. an incomplete one. it'll do." }
        secenekler:
          - id: "kalk"
            etiket: { tr: "Eksikle yaşamayı öğren", en: "Learn to live with what's missing" }
            etkiler:
              - stat: { wis: -1 }
              - dikkat: -20
              - ahlak: { insanlik: -1 }
            sonraki: "@akis"

  # ================================================================== DİKKAT 100 · PERDE 2 (motor tohumu): ilk Kadim gözcüsü
  - id: "dikkat_100_p2"
    perde: [2]
    agirlik: 1
    etiketler: ["dikkat", "kadim", "boss"]
    gerilim: 4
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Ölçen", en: "The one who measures" }
    sahne: "d100p2_1"
    sahneler:
      - id: "d100p2_1"
        paragraflar:
          - { tr: "Rüzgâr kesiliyor. Gece yarısı, bir çatının kenarında, yıldızların arasında katlanmış bir kâğıt gibi açılan bir şey var. Uzun, ince, sabırlı.", en: "The wind dies. Midnight, on the edge of a rooftop, something is unfolding between the stars like a sheet of paper. Tall, thin, patient." }
          - { tr: "Onu tanıyorsun. Öğretici'nin yirmi dördüncü günü, kemik taçlı geyiğin arkasındaki sırtta duran şey. O gün yalnızca bakmıştı. Bu gece bir kalem tutuyor.", en: "You know it. Day twenty-four in the Tutorial, the thing standing on the ridge behind the crowned stag. That day it only watched. Tonight it's holding a pen." }
          - { tr: "Konuşuyor; dili anlamıyorsun ama Sistem senin için çeviriyor, isteksizce: [Ölçüm. Verim dışı. Not ediliyor.]", en: "It speaks. You don't know the language, but the System translates for you, grudgingly: [Measurement. Outside yield. Noted.]" }
        bildirimler:
          - tur: "uyari"
            nadirlik: "efsanevi"
            baslik: { tr: "[ÜST KADEME VARLIK]", en: "[HIGHER-GRADE ENTITY]" }
            satirlar:
              - { tr: "Kademe: belirsiz. Tavsiye: belirsiz. Sistem bu varlığa yetkili değildir.", en: "Grade: unclear. Recommendation: unclear. The System has no authority over this entity." }
        sezgiler:
          - kosul: { stat: { per: 60 } }
            metin: { tr: "Harita gövdesinin üstünde yüzlerce dünya çizili; hepsinin üstü çizilmiş. Bir köşede bir körfez var. Henüz çizilmemiş.", en: "Hundreds of worlds are drawn on its map of a body, and every one is crossed out. In one corner there's a bay. Not crossed out yet." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "dövüşme. lütfen. bu seninle aynı ölçekte değil. henüz değil.", en: "don't fight it. please. it's not on your scale. not yet." }
        secenekler:
          - id: "savas"
            etiket: { tr: "Kalemini elinden al", en: "Take the pen out of its hand" }
            etkiler:
              - ahlak: { duzen: -4, insanlik: -1 }
              - itibar: { kadimler: -5 }
              - savas: { dusmanlar: ["kadim_gozcusu@oyuncu+40"], kazan: "d100p2_zafer", kaybet: "d100p2_yenilgi" }
          - id: "soru"
            tur: "gosteris"
            etiket: { tr: "Ona bir soru sor ve cevabı bekle", en: "Ask it a question. Wait for the answer" }
            gerekli: { stat: { cha: 70 } }
            etkiler:
              - bilgi: "kadim_gozcu"
              - ahlak: { insanlik: 2, duzen: 1 }
              - itibar: { kadimler: 4 }
            sonraki: "d100p2_soru"
          - id: "egil"
            etiket: { tr: "Başını eğ; ölçsün ve gitsin", en: "Bow your head. Let it measure and go" }
            etkiler:
              - bilgi: "kadim_gozcu"
              - ahlak: { duzen: 3, insanlik: -3 }
              - itibar: { kadimler: 6 }
              - degisken: { kadim_tehdit: 4 }
              - dikkat: -30
            sonraki: "d100p2_egil"
          - id: "saklan"
            tur: "gizle"
            etiket: { tr: "{npc:yanki|le} birlikte gölgeye karış", en: "Melt into the shadows with {npc:yanki}" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - gizle: 20
              - yozlasma: 5
              - ahlak: { duzen: -1 }
              - iliski: { yanki: { guven: 5, baglilik: 4 } }
            sonraki: "d100p2_saklan"

      - id: "d100p2_soru"
        paragraflar:
          - { tr: "\"Ne kadar daha?\" diye soruyorsun. Gözcü kalemini indiriyor ve ilk kez sana, bir nota değil, sana bakıyor.", en: "\"How much longer?\" you ask. The watcher lowers its pen and looks at you for the first time. Not at a note. At you." }
          - { tr: "Sistem çeviriyor: [Tarla olgunlaşana kadar. Olgunlaşmayı sen yavaşlatıyorsun. Ya da hızlandırıyorsun. Henüz karar verilmedi.] Sonra harita gövdesini katlıyor ve gidiyor; bir kâğıdın rüzgârda kapanması gibi.", en: "The System translates: [Until the field is ripe. You are slowing the ripening. Or speeding it. It has not been decided.] Then it folds up its map of a body and leaves, like a sheet of paper snapping shut in the wind." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Bu cevabı aklına kazı", en: "Burn that answer into your memory" }
            etkiler:
              - ahlak: { duzen: 1 }
              - xp_seviye: 60
              - tohum: { olay: "dikkat_75_p2", gecikme: { min: 4, max: 8 }, kosul: { dikkat_min: 75 } }
            sonraki: "@akis"

      - id: "d100p2_egil"
        paragraflar:
          - { tr: "Başını eğiyorsun. Gözcünün ince çizgisi senin üstünden geçiyor, seni santim santim ölçüyor; yüz bir parça, kemikler bir parça, içindeki ses bir parça.", en: "You bow your head. The watcher's thin line passes through you, measuring you inch by inch: face, bones, the voice inside you." }
          - { tr: "Not ediyor. Gidiyor. Gökyüzünde bir şey, çok yukarıda, yerini değiştiriyor. Dikkatin ilk kez düşüyor; ama artık seni tek ölçen Sistem değil.", en: "It takes its note. It leaves. Somewhere very high in the sky, something shifts position. For the first time your Attention drops. But the System isn't the only one measuring you anymore." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kalk ve dizlerindeki tozu silkele", en: "Get up and brush off your knees" }
            etkiler:
              - ahlak: { insanlik: 1 }
              - tohum: { olay: "dikkat_75_p2", gecikme: { min: 4, max: 8 }, kosul: { dikkat_min: 75 } }
            sonraki: "@akis"

      - id: "d100p2_saklan"
        paragraflar:
          - { tr: "{npc:yanki} seni gölgeye katlıyor; gözcünün çizgisi senin olduğun yerden geçiyor ve boşluğa çarpıyor. Kalemi duraksıyor.", en: "{npc:yanki} folds you into the shadows. The watcher's line passes through where you're standing and hits nothing. Its pen hesitates." }
          - { tr: "Sonra gözcü bir şey yazıyor; uzun, dikkatli bir satır. Gitmeden önce, tam senin saklandığın gölgeye başını hafifçe eğiyor. Saklanmanı da not etti.", en: "Then the watcher writes something down, a long careful line. Before it goes, it dips its head slightly, right at the shadow you're hiding in. It made a note of the hiding too." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Gölgede biraz daha kal", en: "Stay in the shadow a little longer" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: -1 }
            sonraki: "@akis"

      - id: "d100p2_zafer"
        paragraflar:
          - { tr: "Haritanın bir köşesi yanıyor ve gözcü, ilk kez, sana değil yanan köşeye bakıyor. Sonra kendini bir kâğıt gibi katlıyor ve gidiyor; arkasında, çatının üstünde, tek bir pul kalıyor.", en: "A corner of the map catches fire, and for the first time the watcher looks at the burning corner instead of at you. Then it folds itself up like paper and is gone. Left behind on the rooftop: a single scale." }
          - { tr: "Yendin mi, yoksa yalnızca ölçüm mü bitti, bilmiyorsun. Pulun üstünde bir körfezin kıyı çizgisi var. Senin körfezinin.", en: "Whether you won or the measurement just ended, you can't tell. There's a coastline on the scale. Your bay." }
        secenekler:
          - id: "al"
            etiket: { tr: "Pulu al", en: "Take the scale" }
            etkiler:
              - esya: { kadim_pulu: 1 }
              - degisken: { kadim_tehdit: -5 }
              - ahlak: { duzen: -1 }
              - xp_seviye: 150
            sonraki: "@akis"

      - id: "d100p2_yenilgi"
        paragraflar:
          - { tr: "Çizgi tam üstünden geçiyor ve çatıya yığılıyorsun. Gözcü, sanki bir böceği inceler gibi yanına diz çöküyor ve kalemini bir kez havada sallıyor.", en: "The stroke goes straight through you and you fold up on the rooftop. The watcher kneels down next to you like it's studying a bug and flicks its pen once in the air." }
          - { tr: "Seni öldürmüyor. Gerek yok. Sistem çeviriyor: [Ölçüm tamam. Henüz değil.]. Sonra gidiyor; yanında bir pul bırakıyor, sanki bir makbuz gibi.", en: "It doesn't kill you. It doesn't need to. The System translates: [Measurement complete. Not yet.] Then it leaves, dropping a scale next to you like a receipt." }
          - { tr: "Kafanın içinde {npc:yanki}: yeni tavan. bunu sevmedim. ama bunu hatırla. bir gün bu sen olacaksın.", en: "Inside your head, {npc:yanki}: new ceiling. didn't like that. but remember it. someday that's going to be you." }
        secenekler:
          - id: "pul"
            etiket: { tr: "Pulu al. Bir gün geri vereceksin", en: "Take the scale. Someday you'll return it" }
            etkiler:
              - esya: { kadim_pulu: 1 }
              - bilgi: "kadim_gozcu"
              - dikkat: -30
              - ahlak: { duzen: -1, insanlik: -1 }
              - stat: { wil: 2 }
            sonraki: "@akis"

  # ================================================================== TOHUM: Kayıp Duvarı'na cevap (perde2_donus)
  - id: "kayip_duvari_cevap"
    perde: [2]
    agirlik: 1
    etiketler: ["donus", "insanlar"]
    gerilim: 1
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Notunun altında", en: "Under your note" }
    sahne: "kdc_1"
    sahneler:
      - id: "kdc_1"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "{yer:kiyikent_liman|den} bir çocuk seni buluyor; nefes nefese, elinde bir kâğıt. \"Duvardaki notunun altına yazmışlar,\" diyor. \"Bir sürü kişi. Görmen lazım.\"", en: "A kid from {yer:kiyikent_liman} tracks you down, out of breath, holding a slip of paper. \"People wrote under your note on the wall,\" she says. \"A whole bunch of them. You gotta see.\"" }
          - { tr: "Terminale vardığında notunun altı başka el yazılarıyla dolmuş. Çoğu yalnızca bir teşekkür. Ama üçü bir cevap bekliyor.", en: "When you get to the terminal, the space under your note is full of other people's handwriting. Most of it's just thank-you. But three of them are waiting for an answer." }
          - metin: { tr: "Birinin el yazısı titrek ve iri: \"Vapurumu yan yatmış bırakmayacağım. Çarşıdaki kaptan. Hatırlarsan, gel.\"", en: "One's in big, shaky handwriting: \"I'm not leaving my ferry on its side. The captain from the mall. If you remember me, come.\"" }
            kosul: { bayrak: "mahsur_kaptan_tanindi", bayrak_yok: "mahsur_kaptan_kaldi" }
          - metin: { tr: "Biri bir çocuk çizimiyle imzalanmış: sisin içinde el ele iki çöp adam. \"Kızım hâlâ senden bahsediyor. Bir akşam yemeğe gel.\"", en: "One's signed with a kid's drawing: two stick figures holding hands in the fog. \"My daughter still talks about you. Come over for dinner some night.\"" }
            kosul: { bayrak: "cocuk_kurtarildi" }
          - { tr: "Sonuncusu düzgün, sakin bir yazı: \"Kardeşim Öğretici'de öldü. Bekçi'nin pencerelerini okuyan sen miydin? Onun adını gördün mü?\"", en: "The last one's in neat, calm handwriting: \"My brother died in the Tutorial. Were you the one who read the Warden's windows? Did you see his name?\"" }
        secenekler:
          - id: "kaptan"
            etiket: { tr: "Kaptanı vapurun yanında bul", en: "Find the captain by the ferry" }
            goster: { bayrak: "mahsur_kaptan_tanindi", bayrak_yok: "mahsur_kaptan_kaldi" }
            etkiler:
              - ahlak: { insanlik: 2, merhamet: 1 }
            sonraki: "kdc_kaptan"
          - id: "anne"
            etiket: { tr: "Kızın annesinin akşam yemeğine git", en: "Go to dinner with the girl's mother" }
            goster: { bayrak: "cocuk_kurtarildi" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "kdc_anne"
          - id: "kardes"
            etiket: { tr: "Kardeşini kaybeden kadını bul", en: "Find the woman who lost her brother" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "kdc_kardes"
          - id: "sonra"
            etiket: { tr: "Kâğıtları katla; şimdi değil", en: "Fold the notes up. Not now" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"

      - id: "kdc_kaptan"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Yaşlı kaptan yan yatmış vapurun gövdesine oturmuş, bir halatı ekliyor. Seni görünce kalkmıyor; yalnızca halatı uzatıyor. \"Kırk yıl bu vapuru kullandım,\" diyor. \"Bu şehir her sabah bunun üstünde uyandı. Böyle yatarken şehir de yatıyor.\"", en: "The old captain's sitting on the capsized ferry's hull, splicing a line. He doesn't get up when he sees you. He just holds out the rope. \"Forty years I ran this boat,\" he says. \"This city woke up on her every morning. Long as she's lying like this, so is the city.\"" }
          - { tr: "\"Doğrultmak için iki vinç, otuz kişi ve bir mucize lazım,\" diye ekliyor. \"Ya da sen.\"", en: "\"Takes two cranes, thirty men and a miracle to right her,\" he adds. \"Or you.\"" }
        secenekler:
          - id: "dogrult"
            tur: "gosteris"
            etiket: { tr: "Halatı omzuna al; vapuru doğrult", en: "Throw the line over your shoulder. Right the ferry" }
            gerekli: { stat: { str: 40 } }
            etkiler:
              - bayrak: "vapur_dogrultuldu"
              - ahlak: { insanlik: 3, merhamet: 2 }
              - degisken: { hayatta_kalan: 1 }
              - itibar: { siginak: 5, lonca: 3 }
              - iliski: { elif_sari: { saygi: 4 }, deniz_arman: { baglilik: 4 } }
              - dikkat: 5
              - xp_seviye: 30
              - tohum: { olay: "dikkat_50_p2", gecikme: { min: 2, max: 5 }, kosul: { dikkat_min: 45 } }
            sonraki: "kdc_vapur"
          - id: "vinc"
            etiket: { tr: "Lonca'dan iki vinç iste; birlikte yapın", en: "Ask the Guild for two cranes. Do it together" }
            etkiler:
              - bayrak: "vapur_dogrultuldu"
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { lonca: 3, siginak: 3 }
              - iliski: { kaya_demir: { saygi: 3 } }
              - xp_seviye: 20
            sonraki: "kdc_vapur"
          - id: "otur"
            etiket: { tr: "Yanına otur; halatı birlikte ekleyin", en: "Sit down with him. Splice rope together" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - stat: { wis: 1 }
            sonraki: "@akis"

      - id: "kdc_vapur"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Vapur inliyor, çamurdan kurtuluyor ve ağır ağır doğruluyor; içinden aylardır birikmiş deniz suyu şelale gibi boşalıyor. İskelede biri bir tencereye vurmaya başlıyor; sonra herkes.", en: "The ferry groans, sucks free of the mud and slowly comes upright, dumping months of trapped seawater like a waterfall. Somebody on the dock starts banging on a pot. Then everybody does." }
          - { tr: "Kaptan dümen evine çıkıp düdüğü çekiyor. Ses körfezin üstünden {yer:kordon|e} kadar gidiyor. Bütün şehir başını kaldırıyor ve o sabah, bir an için, eski bir sabah gibi.", en: "The captain climbs up into the wheelhouse and pulls the whistle. The sound carries across the bay all the way to {yer:kordon}. The whole city looks up, and for a moment that morning feels like an old morning." }
          - metin: { tr: "{npc:deniz_arman} iskelede, yedi kırk vapurunun düdüğünü duyunca gözlerini kapatıyor.", en: "On the dock, {npc:deniz_arman} closes {zamir:deniz_arman|onun} eyes at the sound of the seven-forty boat's whistle." }
            kosul: { yoldas: "deniz_arman" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kaptana el salla; işine dön", en: "Wave to the captain. Get back to work" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "kdc_anne"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Akşam yemeği konserve fasulye ve bir yerden bulunmuş taze ekmek. Sisin içinde kaybolan kız artık on bir yaşında ve bütün yemek boyunca senden gözünü ayırmıyor.", en: "Dinner's canned beans and a loaf of fresh bread from God knows where. The girl who got lost in the fog is eleven now and doesn't take her eyes off you the whole meal." }
          - { tr: "Tatlıda, utanarak, sana bir resim veriyor: sisin içinde el ele iki çöp adam ve büyüğünün başının üstünde küçük, mavi bir pencere. \"Seninki hep açık,\" diyor. \"Herkesinki kapanıyor ama seninki hep açık.\"", en: "At dessert, embarrassed, she hands you a drawing: two stick figures holding hands in the fog, and over the bigger one's head a small blue window. \"Yours is always open,\" she says. \"Everybody else's closes, but yours is always open.\"" }
        secenekler:
          - id: "sakla"
            etiket: { tr: "Resmi katla ve cebine koy", en: "Fold the drawing up. Keep it" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - stat: { wil: 1 }
            sonraki: "@akis"
          - id: "sir"
            etiket: { tr: "\"Bu bizim sırrımız olsun, tamam mı?\"", en: "\"Let's keep that our secret, okay?\"" }
            etkiler:
              - ahlak: { duzen: 1, insanlik: 1 }
              - gizle: 4
            sonraki: "@akis"

      - id: "kdc_kardes"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kadın terminalin bekleme salonunda, notunun önünde bekliyor; bir fotoğraf tutuyor. Gözlüklü, utangaç gülümseyen bir genç adam. \"Adı Selim'di,\" diyor. \"Bekçinin gövdesinde, pencerelerde... adını gördün mü?\"", en: "The woman's waiting in the terminal, in front of your note, holding a photo. A young guy with glasses and a shy smile. \"His name was Sam,\" she says. \"On the Warden's body, in the windows... did you see his name?\"" }
          - { tr: "Hatırlamıyorsun. Yüzlerce pencere vardı; okuduklarının çoğu bir isim bile değildi, yalnızca son bildirimlerdi. Kadın yüzündeki cevabı okuyor ve gözlerini kaçırmıyor.", en: "You don't remember. There were hundreds of windows, and most of what you read wasn't even names, just last notifications. She reads the answer on your face and doesn't look away." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kayıtlarda var. son bildirimi: [Seviye 6'ya ulaştın!]. ona istersen söyle. ben söylemem.", en: "he's in the logs. his last notification: [You reached Level 6!]. tell her if you want. i won't." }
        secenekler:
          - id: "durust"
            etiket: { tr: "\"Hatırlamıyorum. Özür dilerim.\"", en: "\"I don't remember. I'm sorry.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 1 }
            sonraki: "@akis"
          - id: "yanki"
            etiket: { tr: "{npc:yanki|in} söylediğini ona aktar", en: "Pass on what {npc:yanki} told you" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: -1 }
              - iliski: { yanki: { guven: 4 } }
            sonraki: "kdc_kardes_son"
          - id: "yalan"
            etiket: { tr: "\"Gördüm. Son penceresi bir zafer satırıydı.\"", en: "\"I saw it. His last window was a win.\"" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: -2 }
            sonraki: "kdc_kardes_son"

      - id: "kdc_kardes_son"
        yer: "kiyikent_iskele"
        paragraflar:
          - { tr: "Kadın fotoğrafı göğsüne bastırıyor ve bir süre hiçbir şey söylemiyor. Sonra gülüyor; kısa, kırık bir gülüş. \"Altı. Altıya kadar çıkmış. Hep matematikte kötüydü, biliyor musun?\"", en: "She presses the photo to her chest and doesn't say anything for a while. Then she laughs, short and broken. \"Six. He made it to six. He was always lousy at math, you know?\"" }
          - { tr: "Fotoğrafı duvara, senin notunun yanına iğneliyor. Altına yazıyor: SEVİYE 6. Arkasını dönüp gidiyor; omuzları, geldiği zamankinden biraz daha dik.", en: "She pins the photo to the wall, right next to your note, and writes under it: LEVEL 6. Then she turns and walks off, shoulders a little straighter than when she came." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Fotoğrafa son bir kez bak", en: "One last look at the photo" }
            etkiler:
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

  # ================================================================== TOHUM: Dönmeyenler (kule_yukselisi)
  - id: "kule_donmeyenler"
    perde: [2]
    agirlik: 1
    etiketler: ["kule", "insanlar"]
    gerilim: 2
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Kapının önündeki kız", en: "The girl at the door" }
    sahne: "kd_1"
    sahneler:
      - id: "kd_1"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule'nin kapısının önünde, bir sırt çantasının üstünde on üç yaşlarında bir kız oturuyor. Üç gündür orada olduğunu söylüyorlar; avcılar ona ekmek bırakıyor, o yemiyor.", en: "There's a girl about thirteen sitting on a backpack in front of the Spire's door. People say she's been there three days. Hunters leave her bread. She doesn't eat it." }
          - { tr: "Babası Kule'nin açıldığı gün on kişiyle içeri girmiş. Dokuzu döndü. Babasının yerine Sistem kızın penceresine tek bir satır yolladı ve o satırı herkese gösteriyor: [Ölçüm tamamlandı.]", en: "Her dad went in with ten people the day the Spire opened. Nine came back. Instead of him, the System sent one line to her window, and she shows it to everybody: [Measurement complete.]" }
          - { tr: "\"Bu ne demek?\" diye soruyor sana. Herkese sorduğu gibi değil; cevabı bileceğini bilerek.", en: "\"What does that mean?\" she asks you. Not the way she's asked everybody else. Like she knows you'll know." }
        sezgiler:
          - kosul: { stat: { per: 45 } }
            metin: { tr: "Satırın arkasında, yalnızca senin görebildiğin soluk bir alt satır var: [Konum: Kat 7. Durum: sıkışmış.]. Ölçüm tamamlandı, ama ölçülen hâlâ orada.", en: "Behind the line there's a faint sub-line only you can see: [Location: Floor 7. Status: trapped.] The measurement's done, but the one measured is still in there." }
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "ölçüm tamamlandı demek öldü demek değil. Sistem ölüme ölüm der. bu başka bir şey.", en: "measurement complete doesn't mean dead. the System calls death death. this is something else." }
        secenekler:
          - id: "ara"
            etiket: { tr: "\"Burada bekle.\" Kapıdan gir; babasını ara", en: "\"Wait here.\" Go through the door. Find him" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - savas: { dusmanlar: ["soluk_musteri@dunya", "run_kabuklu@dunya"], ortam: ["tavan"], kazan: "kd_bulundu", kaybet: "kd_yenilgi" }
          - id: "oku"
            tur: "gosteris"
            etiket: { tr: "Satırın altındakini oku; kat yedi, hemen", en: "Read what's under the line. Floor seven, now" }
            gerekli: { stat: { per: 45 } }
            etkiler:
              - ahlak: { merhamet: 5, duzen: -1 }
              - dikkat: 3
            sonraki: "kd_bulundu"
          - id: "gercek"
            etiket: { tr: "\"Bilmiyorum. Ama burada yalnız beklemeyeceksin.\"", en: "\"I don't know. But you're not waiting here alone.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 } }
            sonraki: "kd_bekle"
          - id: "git"
            etiket: { tr: "Başını iki yana salla ve yürü", en: "Shake your head and walk on" }
            etkiler:
              - ahlak: { merhamet: -4, duzen: 1 }
            sonraki: "@akis"

      - id: "kd_bulundu"
        yer: "kule"
        paragraflar:
          - { tr: "Yedinci katın taş koridorlarından birinde, devrilmiş bir sütunun altında bir adam yatıyor; bacakları sıkışmış, dudakları kurumuş, gözleri açık. Penceresi üç gündür tek bir satırı tekrar ediyor: [Ölçüm tamamlandı.]", en: "In one of the stone corridors on the seventh floor, a man's lying under a toppled column, legs pinned, lips cracked, eyes open. His window's been repeating the same line for three days: [Measurement complete.]" }
          - { tr: "Sütunu kaldırıyorsun. Adam sana bakıyor ve ilk sorusu kendisi için değil: \"Kızım? Kızım kapıda mı?\"", en: "You lift the column. He looks up at you, and his first question isn't about himself: \"My girl? Is my girl at the door?\"" }
          - { tr: "Onu sırtında aşağı taşıyorsun. Kapıdan çıktığında kız ayağa fırlıyor ve sırt çantası devriliyor; içinden üç günlük, yenmemiş ekmekler dökülüyor.", en: "You carry him down on your back. When you come out the door the girl jumps up so fast her backpack tips over, and three days of uneaten bread spills out of it." }
        secenekler:
          - id: "birak"
            etiket: { tr: "Onları kendi hâllerine bırak", en: "Leave the two of them be" }
            etkiler:
              - bayrak: "kule_baba_kurtarildi"
              - ahlak: { merhamet: 3, insanlik: 3 }
              - degisken: { hayatta_kalan: 1 }
              - xp_seviye: 20
            sonraki: "@akis"
          - id: "goster"
            tur: "aciga_vur"
            etiket: { tr: "Kalabalığa dön: \"Ölçüm tamamlandı, ölmek değil.\"", en: "Tell the crowd: \"Measurement complete doesn't mean dead.\"" }
            etkiler:
              - bayrak: "kule_baba_kurtarildi"
              - aciga_vur: true
              - ahlak: { merhamet: 2, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 4, sessiz_ag: 4, lonca: 2 }
              - xp_seviye: 20
              - tohum: { olay: "dikkat_50_p2", gecikme: { min: 2, max: 5 }, kosul: { dikkat_min: 45 } }
            sonraki: "@akis"

      - id: "kd_yenilgi"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Kule seni ilk katta tükürüyor; kapıdan sırtüstü meydana yuvarlanıyorsun. Kız yerinden kalkmıyor. Yalnızca, sana da bir ekmek uzatıyor.", en: "The Spire spits you out on the first floor and you roll backward through the door into the square. The girl doesn't get up. She just holds out a piece of bread to you too." }
          - { tr: "Ertesi gün iki avcı, senin açtığın yoldan yedinci kata çıkıp adamı indiriyor. Kız sana bakıp başını sallıyor; teşekkür eder gibi, ya da affeder gibi.", en: "The next day two hunters follow the path you cleared up to the seventh floor and bring the man down. The girl looks at you and nods. Like a thank-you. Or like she's forgiving you." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Ekmeği al", en: "Take the bread" }
            etkiler:
              - bayrak: "kule_baba_kurtarildi"
              - ahlak: { insanlik: 2 }
            sonraki: "@akis"

      - id: "kd_bekle"
        yer: "kule_dibi"
        paragraflar:
          - { tr: "Yanına oturuyorsun. Bir saat. İki saat. Kız sonunda ekmeğin bir köşesini yiyor ve başını omzuna yaslıyor.", en: "You sit down next to her. An hour. Two. Finally she eats a corner of the bread and leans her head on your shoulder." }
          - { tr: "Akşamüstü Sığınak'tan bir hemşire geliyor ve kızı battaniyeye sarıyor. Giderken kız dönüp kapıya son bir kez bakıyor; sonra sana. \"Biri ararsa söylersin, değil mi?\"", en: "Late afternoon a nurse from the Haven shows up and wraps her in a blanket. On her way out the girl turns for one last look at the door. Then at you. \"If anybody comes looking, you'll tell him, right?\"" }
        secenekler:
          - id: "soz"
            etiket: { tr: "\"Söylerim.\"", en: "\"I'll tell him.\"" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
            sonraki: "@akis"

  # ================================================================== TOHUM: Seçimin gecesi (fraksiyon_secimi)
  - id: "secimin_gecesi"
    perde: [2]
    agirlik: 1
    etiketler: ["fraksiyon", "siyaset"]
    gerilim: 2
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Kapına bırakılanlar", en: "Left at your door" }
    sahne: "sg_1"
    sahneler:
      - id: "sg_1"
        paragraflar:
          - { tr: "Seçimin ertesi gecesi kapın çalınıyor. Kapıyı açtığında kimse yok; yalnızca eşikte bir şey.", en: "The night after you chose, somebody knocks on your door. When you open it nobody's there. Just something on the step." }
          - metin: { tr: "Bir telsiz ve yanında {npc:kaya_demir|in} kısa, köşeli el yazısıyla bir not: \"Kapı taştığında Konsey'in çayı onu durdurmaz. Kanal 4. Ara.\"", en: "A radio, and next to it a note in {npc:kaya_demir|pos} short, blocky handwriting: \"When that Gate blows, the Council's tea won't stop it. Channel 4. Call.\"" }
            kosul: { bayrak: "uye_siginak" }
          - metin: { tr: "Kapıda {npc:elif_sari} duruyor, elinde termos. \"Lonca'da bir kural var,\" diyor. \"Çocuklar ve yaşlılar muaf. Onu sen koydurdun, değil mi? O kuralı yaşat. Lütfen.\"", en: "{npc:elif_sari} is standing on the step, thermos in hand. \"The Guild has a rule,\" she says. \"Kids and old folks are exempt. You got that put in, didn't you? Keep it alive. Please.\"" }
            kosul: { bayrak: "uye_lonca" }
          - metin: { tr: "Eşikte katlanmış bir kâğıt; {npc:mert_kilic|in} kargacık burgacık yazısı: \"İkinci bir liste var. Başlıksız. Sen içinde değilsin. Kimin olduğuna bak.\"", en: "A folded slip on the step in {npc:mert_kilic|pos} chicken scratch: \"There's a second list. No title. You're not on it. Check who is.\"" }
            kosul: { bayrak: "uye_yukselenler" }
          - metin: { tr: "Beyazlı bir mürit eşikte diz çökmüş. \"Peygamber seni rüyasında gördü,\" diyor. \"Yanan bir tacın altında; tacı bir kabloyla boğuyordun. Sana bunu söylememi istedi. Ne demek olduğunu bilmiyorum.\"", en: "A follower in white is kneeling on the step. \"The Prophet saw you in a dream,\" he says. \"Under a crown on fire. You were strangling the crown with a cable. He asked me to tell you. I don't know what it means.\"" }
            kosul: { bayrak: "uye_sessiz_ag" }
          - metin: { tr: "Eşikte dört şey var: katlanmış bir battaniye, bir ranza anahtarı, bir mum ve bir telsiz. Notsuz. Dördü de hâlâ bekliyor.", en: "There are four things on the step: a folded blanket, a bunk key, a candle and a radio. No note. All four of them are still waiting." }
            kosul: { bayrak: "uye_yok" }
        secenekler:
          - id: "kaya"
            etiket: { tr: "Telsizi aç: Kanal 4", en: "Switch on the radio. Channel 4" }
            goster: { bayrak: "uye_siginak" }
            etkiler:
              - ahlak: { duzen: 2 }
              - itibar: { lonca: 3 }
              - iliski: { kaya_demir: { guven: 4, saygi: 2 } }
            sonraki: "@akis"
          - id: "elif"
            etiket: { tr: "\"Kural yaşayacak. Söz.\"", en: "\"That rule stays. Promise.\"" }
            goster: { bayrak: "uye_lonca" }
            etkiler:
              - ahlak: { merhamet: 4 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 6, baglilik: 3 } }
            sonraki: "@akis"
          - id: "liste"
            etiket: { tr: "Kâğıdı yak; ama ikinci listeyi ara", en: "Burn the note. But go looking for that list" }
            goster: { bayrak: "uye_yukselenler" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: -1 }
              - iliski: { mert_kilic: { guven: 4 }, vahit: { guven: -3 } }
              - tohum: { olay: "kayip_duvari_cevap", gecikme: { min: 2, max: 4 }, kosul: { bayrak: "kayip_duvari_not" } }
            sonraki: "@akis"
          - id: "ruya"
            etiket: { tr: "Mürite su ver ve onu evine yolla", en: "Give the follower some water. Send him home" }
            goster: { bayrak: "uye_sessiz_ag" }
            etkiler:
              - ahlak: { merhamet: 2 }
              - iliski: { vahit: { saygi: 2 } }
            sonraki: "@akis"
          - id: "dordu"
            etiket: { tr: "Dördünü de içeri al; hiçbirini kullanma", en: "Bring all four inside. Use none of them" }
            goster: { bayrak: "uye_yok" }
            etkiler:
              - ahlak: { duzen: -1, insanlik: 1 }
              - iliski: { elif_sari: { guven: 2 }, kaya_demir: { saygi: 2 }, mert_kilic: { guven: 2 } }
            sonraki: "@akis"
          - id: "kapat"
            etiket: { tr: "Kapıyı kapat. Seçimini yaptın", en: "Close the door. You made your choice" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -1 }
            sonraki: "@akis"

  # ================================================================== TOHUM: Taşmanın ertesi (ilk_tasma)
  - id: "tasma_sonrasi"
    perde: [2]
    agirlik: 1
    etiketler: ["kapi", "insanlar"]
    gerilim: 1
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Dalgadan sonra", en: "After the wave" }
    sahne: "ts_1"
    sahneler:
      - id: "ts_1"
        paragraflar:
          - metin: { tr: "{yer:kordon|de} bir şenlik var. Kurtarılan balkonlardan çamaşır ipleriyle bayraklar sarkıyor, biri bir hoparlörden eski bir yaz şarkısı çalıyor. Çocuklar sana deniz kabuklarından bir taç yapmış.", en: "There's a block party on {yer:kordon}. Flags hang from clotheslines between the balconies you saved, and somebody's playing an old summer song off a speaker. The kids made you a crown out of seashells." }
            kosul: { bayrak: "kordon_kurtarildi" }
          - metin: { tr: "{yer:kiyikent_liman|in} rıhtımında bir anma var. {yer:kordon|den} çıkamayanların adları bir çarşafa yazılmış, çarşaf iki direğe gerilmiş. Körfezin öbür yakasında, karanlık balkonlarda köpük tıkırdıyor.", en: "There's a memorial on {yer:kiyikent_liman} quay. The names of everyone who couldn't get off {yer:kordon} are written on a bedsheet strung between two poles. Across the bay, foam ticks along the dark balconies." }
            kosul: { bayrak: "kordon_dustu" }
          - { tr: "Herkes seni bekliyormuş gibi; sen gelince konuşmalar kesiliyor ve yüzler sana dönüyor.", en: "Feels like everybody was waiting on you. When you show up the talk stops and the faces turn your way." }
        yoldas_tepkileri:
          - npc: "deniz_arman"
            kosul: { yoldas: "deniz_arman" }
            metin: { tr: "\"Bir şey söyle onlara. Ne olursa. Sana bakıyorlar.\"", en: "\"Say something to them. Anything. They're looking at you.\"" }
        secenekler:
          - id: "tac"
            tur: "aciga_vur"
            etiket: { tr: "Kabuk tacı tak; dans et", en: "Put on the shell crown. Dance" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: 3, duzen: -1 }
              - itibar: { siginak: 3, yukselenler: 2 }
              - iliski: { deniz_arman: { baglilik: 4 } }
              - tohum: { olay: "dikkat_50_p2", gecikme: { min: 3, max: 6 }, kosul: { dikkat_min: 45 } }
            sonraki: "ts_sen"
          - id: "cocuk"
            etiket: { tr: "Tacı en küçük çocuğun başına koy", en: "Put the crown on the smallest kid's head" }
            goster: { bayrak: "kordon_kurtarildi" }
            etkiler:
              - ahlak: { merhamet: 3, insanlik: 2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { saygi: 3 } }
            sonraki: "ts_sen"
          - id: "isim"
            etiket: { tr: "Çarşaftaki adları yüksek sesle oku", en: "Read the names on the sheet out loud" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { insanlik: 4 }
              - itibar: { siginak: 3 }
              - iliski: { elif_sari: { guven: 3 }, deniz_arman: { guven: 3 } }
            sonraki: "ts_sen"
          - id: "yemin"
            etiket: { tr: "\"{yer:kordon|i} geri alacağız.\"", en: "\"We're taking {yer:kordon} back.\"" }
            goster: { bayrak: "kordon_dustu" }
            etkiler:
              - ahlak: { duzen: 3, merhamet: 1 }
              - itibar: { lonca: 4 }
              - iliski: { kaya_demir: { saygi: 4 } }
            sonraki: "ts_sen"
          - id: "git"
            etiket: { tr: "Bir şey söyleme; kalabalıktan uzaklaş", en: "Don't say anything. Slip away from the crowd" }
            etkiler:
              - gizle: 4
              - ahlak: { duzen: 1, insanlik: -1 }
            sonraki: "@akis"

      - id: "ts_sen"
        paragraflar:
          - { tr: "Gece ilerledikçe kalabalık seyreliyor. Yaşlı bir kadın yanına oturuyor ve uzun süre denize bakıyor.", en: "As the night goes on the crowd thins out. An old woman sits down next to you and stares at the sea for a long time." }
          - { tr: "\"Kocam balıkçıydı,\" diyor sonunda. \"Her şeyi geri verir bu deniz, derdi. Geç de olsa.\" Sonra kalkıp gidiyor; ne demek istediğini sormana fırsat bırakmadan.", en: "\"My husband was a fisherman,\" she finally says. \"Used to say the sea gives everything back. Even if it takes its time.\" Then she gets up and goes, before you can ask what she meant." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Denize bakmaya devam et", en: "Keep watching the sea" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - stat: { wis: 1 }
            sonraki: "@akis"

  # ================================================================== TOHUM: İki sesli (yanki_ortaya_cikis)
  - id: "iki_sesli_sokak"
    perde: [2]
    agirlik: 1
    etiketler: ["yanki", "insanlar"]
    gerilim: 2
    yalniz_tohum: true
    tekrar: false
    npc: ["yanki"]
    kart: { tr: "Duvardaki küçük harfler", en: "Lowercase on the walls" }
    sahne: "iss_1"
    sahneler:
      - id: "iss_1"
        paragraflar:
          - { tr: "Şehrin duvarlarında yeni bir yazı var, sprey boyayla, hep küçük harflerle: iki sesli. Bazılarının altına bir taç çizilmiş. Bazılarının üstüne bir çarpı.", en: "There's new writing on the city's walls, spray-painted, always in lowercase: two-voiced. Some have a crown drawn under them. Some have an X sprayed over the top." }
          - { tr: "Bir sokağın başında beş genç seni bekliyor. Bileklerine tükenmez kalemle küçük harfler yazmışlar; birinin alnında, kendi eliyle yazılmış: bozuk ve gururlu.", en: "At the end of one street five teenagers are waiting for you. They've written lowercase letters on their wrists in ballpoint. One of them has it on his forehead in his own handwriting: broken and proud." }
          - { tr: "Sokağın öbür ucunda bir adam bir taşı elinde tartıyor. Henüz atmadı.", en: "At the other end of the street a man is weighing a rock in his hand. He hasn't thrown it yet." }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "hayranlarım var. bunu hiç düşünmemiştim. sence onlara bir şey söylemeli miyim. hayır. söylememeliyim. değil mi.", en: "i have fans. never thought about that. should i say something to them. no. i shouldn't. right." }
        secenekler:
          - id: "gencler"
            etiket: { tr: "Gençlere git: \"Bunu sevmeyeceksiniz.\"", en: "Go to the kids: \"You don't want this.\"" }
            etkiler:
              - ahlak: { insanlik: 3, duzen: 1 }
              - iliski: { yanki: { guven: -2 } }
            sonraki: "iss_gencler"
          - id: "tas"
            etiket: { tr: "Taşlı adama yürü", en: "Walk toward the man with the rock" }
            etkiler:
              - ahlak: { merhamet: 2 }
            sonraki: "iss_tas"
          - id: "yanki"
            tur: "aciga_vur"
            etiket: { tr: "{npc:yanki} bir kez, onlara da konuşsun", en: "Let {npc:yanki} talk to them. Just once" }
            goster: { bayrak: "yanki_bagi" }
            etkiler:
              - aciga_vur: true
              - ahlak: { insanlik: -3, duzen: -2 }
              - yozlasma: 3
              - itibar: { yukselenler: 4 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - tohum: { olay: "dikkat_75_p2", gecikme: { min: 3, max: 6 }, kosul: { dikkat_min: 65 } }
            sonraki: "iss_yanki"

      - id: "iss_gencler"
        paragraflar:
          - { tr: "Alnında yazı olan çocuk sana bakıyor; on beş, belki on altı. \"Sen de istemedin,\" diyor. \"Ama oldun. Biz de olmak istiyoruz.\"", en: "The kid with the writing on his forehead looks at you. Fifteen, maybe sixteen. \"You didn't want it either,\" he says. \"But you got it. We want to get it too.\"" }
          - { tr: "Ona ne söyleyeceğini bilmiyorsun. Sonunda yalnızca alnındaki mürekkebi başparmağınla siliyorsun; çocuk geri çekilmiyor.", en: "You don't know what to tell him. In the end you just wipe the ink off his forehead with your thumb. He doesn't flinch." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Kendi sesini bul. Benimkini değil.\"", en: "\"Find your own voice. Not mine.\"" }
            etkiler:
              - ahlak: { insanlik: 3 }
            sonraki: "@akis"

      - id: "iss_tas"
        paragraflar:
          - { tr: "Adam taşı kaldırıyor ve sen tam önünde duruyorsun. Elleri titriyor. \"Karım {yer:kordon|de}ydı,\" diyor. \"Senin içindeki o şey... bunu o mu yaptı? Sistem mi? Sen mi?\"", en: "The man raises the rock, and you stop right in front of him. His hands are shaking. \"My wife was on {yer:kordon},\" he says. \"That thing inside you... did it do this? Did the System? Did you?\"" }
          - { tr: "Taşı atmıyor. Sonunda bırakıyor; taş kaldırıma düşüp ikiye ayrılıyor. Adam da taşla birlikte yere çöküyor.", en: "He doesn't throw it. Finally he lets it go. It hits the curb and splits in two, and he folds right down onto the pavement with it." }
        secenekler:
          - id: "otur"
            etiket: { tr: "Yanına otur", en: "Sit down next to him" }
            etkiler:
              - ahlak: { merhamet: 4, insanlik: 2 }
            sonraki: "@akis"
          - id: "git"
            etiket: { tr: "\"Hayır.\" De ve yürü", en: "Say \"No.\" Keep walking" }
            etkiler:
              - ahlak: { duzen: 2, merhamet: -2 }
            sonraki: "@akis"

      - id: "iss_yanki"
        paragraflar:
          - { tr: "Sokaktaki her camda buğu gibi tek bir cümle beliriyor: kendiniz olun. ben bir hatayım. hata olmak zor. Sonra bir tane daha: ama güzel.", en: "On every pane of glass on the street, one sentence fogs up: be yourselves. i'm a bug. being a bug is hard. Then one more: but pretty." }
          - { tr: "Gençler çığlık atıyor, gülüyor, ağlıyor. Taşlı adam taşını düşürüp koşarak uzaklaşıyor. Bütün sokak, bir anda, bir kilise kadar sessiz ve bir konser kadar gürültülü.", en: "The kids scream, laugh, cry. The man with the rock drops it and runs. For one second the whole street is as quiet as a church and as loud as a concert." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Yeter. Bir kez dedik.\"", en: "\"That's enough. Once, we said.\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { saygi: 3 } }
            sonraki: "@akis"

  # ================================================================== TOHUM: Başlığın gecesi (sistem_gercegi)
  - id: "baslik_gecesi"
    perde: [2]
    agirlik: 1
    etiketler: ["yanki", "sistem", "sir"]
    gerilim: 1
    yalniz_tohum: true
    tekrar: false
    npc: ["yanki"]
    kart: { tr: "Dört bin yüz on yedi", en: "Four thousand one hundred seventeen" }
    sahne: "bg_1"
    sahneler:
      - id: "bg_1"
        paragraflar:
          - { tr: "Uyuyamıyorsun. Gözlerini her kapadığında o sayı beliriyor: 4.117. Tavan karanlık; şehir sessiz.", en: "You can't sleep. Every time you close your eyes, that number's there: 4,117. The ceiling's dark. The city's quiet." }
          - { tr: "{npc:yanki} de uyumuyor; uyumayı hiç bilmedi ama bu gece başka türlü uyanık. bir şey soracağım, diyor. kızma.", en: "{npc:yanki} isn't sleeping either. It never learned how, but tonight it's awake in a different way. i'm going to ask you something, it says. don't be mad." }
          - metin: { tr: "çiftçi, tarla, verim. bunu okuduk. ama sence bir tarla, dört bin kez biçildikten sonra hâlâ tarla mıdır. yoksa başka bir şeye mi dönüşür.", en: "farmer, field, yield. we read that. but do you think a field is still a field after four thousand harvests. or does it turn into something else." }
            kosul: { bayrak: "gercek_hasat" }
          - metin: { tr: "biz başaramadık, siz başarın. bunu okuduk. ama sence dört bin kez başarısız olan bir şey hâlâ umut eder mi. ben ediyorum. galiba. bu bir hata mı.", en: "we didn't make it, you make it. we read that. but do you think something that's failed four thousand times still hopes. i do. i think. is that a bug." }
            kosul: { bayrak: "gercek_kurtarma" }
        secenekler:
          - id: "dongu"
            etiket: { tr: "\"Sence bu bir döngü mü?\"", en: "\"You think it's a loop?\"" }
            etkiler:
              - ahlak: { insanlik: -1, duzen: -1 }
              - iliski: { yanki: { guven: 6, baglilik: 4 } }
              - hafiza: { npc: "yanki", id: "olay:baslik_gecesi", agirlik: 30 }
            sonraki: "bg_dongu"
          - id: "teselli"
            etiket: { tr: "\"Umut bir hata değil.\"", en: "\"Hope's not a bug.\"" }
            etkiler:
              - ahlak: { insanlik: 3, merhamet: 2 }
              - iliski: { yanki: { guven: 8 } }
            sonraki: "bg_teselli"
          - id: "suphe"
            etiket: { tr: "\"O başlıkta senin satırın da vardı. Sen nesin?\"", en: "\"Your line was down there too. What are you?\"" }
            etkiler:
              - ahlak: { duzen: 2 }
              - iliski: { yanki: { guven: -4, korku: 4, saygi: 3 } }
            sonraki: "bg_suphe"

      - id: "bg_dongu"
        paragraflar:
          - { tr: "{npc:yanki} uzun süre susuyor. bilmiyorum, diyor sonunda. ama bir şey hatırlıyorum. bir merdiven. bir zirve. birinin elinde bir kalem. ve sonra yine en baştan.", en: "{npc:yanki} goes quiet for a long time. i don't know, it finally says. but i remember something. a staircase. a summit. someone holding a pen. and then back to the very beginning." }
          - { tr: "belki bu sefer farklı olur, diye ekliyor. her seferinde böyle mi diyorum acaba. bunu da bilmiyorum.", en: "maybe this time it'll be different, it adds. wonder if i say that every time. don't know that either." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "\"Bu sefer farklı olacak.\"", en: "\"This time it's different.\"" }
            etkiler:
              - ahlak: { insanlik: 1, duzen: -1 }
              - iliski: { yanki: { baglilik: 4 } }
            sonraki: "@akis"

      - id: "bg_teselli"
        paragraflar:
          - { tr: "{npc:yanki} bir şey yapıyor; ilk kez. Kafanın içinde küçük, ılık bir nokta, bir kedinin göğsüne kıvrılması gibi.", en: "{npc:yanki} does something it's never done before. A small warm spot inside your head, like a cat curling up on your chest." }
          - { tr: "tamam, diyor. o zaman ben de bir hata olmayayım. bu gece. sadece bu gece.", en: "okay, it says. then i won't be a bug either. tonight. just tonight." }
        secenekler:
          - id: "uyu"
            etiket: { tr: "Gözlerini kapat ve uyu", en: "Close your eyes and sleep" }
            etkiler:
              - ahlak: { insanlik: 2 }
              - can: 20
            sonraki: "@akis"

      - id: "bg_suphe"
        paragraflar:
          - { tr: "bir satırdım, diyor {npc:yanki}, sesi düz. sonra bir parça. sonra bir ses. şimdi sen ne diyorsan oyum. bundan fazlasını bilmiyorum. bilseydim, inan bana, ilk sana söylerdim.", en: "a line, {npc:yanki} says, voice flat. then a piece. then a voice. now i'm whatever you call me. i don't know any more than that. if i did, believe me, you'd be the first to know." }
          - { tr: "Sonra, daha alçak sesle: ya da söylemezdim. emin değilim. bu da bir cevap.", en: "Then, quieter: or i wouldn't. not sure. that's an answer too." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Cevabı aklında tut", en: "Hold onto that answer" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

  # ================================================================== TOHUM: Geminin altında ilk gece (perde2_son)
  - id: "gemi_altinda_gece"
    perde: [2, 3]
    agirlik: 1
    etiketler: ["kadim", "insanlar"]
    gerilim: 3
    yalniz_tohum: true
    tekrar: false
    kart: { tr: "Yedi köşeli gece", en: "The seven-pointed night" }
    sahne: "gag_1"
    sahneler:
      - id: "gag_1"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Güneşsiz ikinci gün. {yer:kiyikent_liman|de} balıkçı tekneleri insanla dolmuş; körfezden açık denize, geminin gölgesinin dışına kaçmaya çalışıyorlar.", en: "Second day without a sun. The fishing boats at {yer:kiyikent_liman} are packed with people trying to run out of the bay, past the edge of the ship's shadow, into open water." }
          - { tr: "İlk tekne gölgenin kenarına vardığında su kaynamaya başlıyor; tekne nazikçe, bir el tarafından itilir gibi, geri dönüyor. İkinci tekne de. Rıhtımda biri çığlık atıyor: \"Bizi kafese koydular!\"", en: "When the first boat hits the edge of the shadow, the water starts to boil, and the boat gets turned around, gently, like a hand pushed it. The second boat too. Somebody on the quay screams: \"They put us in a cage!\"" }
          - metin: { tr: "{yer:tepe|den} {npc:vahit|in} sesi hoparlörlerden yayılıyor: \"Bahçıvanlar geldi! Olgunlaşanlar seçilecek! Korkmayın; büyüyün!\"", en: "{npc:vahit|pos} voice booms out of the speakers up in {yer:tepe}: \"The Gardeners have come! The ripe will be chosen! Don't be afraid. Grow!\"" }
            kosul: { npc_hayatta: "vahit" }
        sezgiler:
          - kosul: { bayrak: "yanki_bagi" }
            metin: { tr: "kafes değil. ağıl. fark şu: ağıldakileri saymak daha kolay.", en: "not a cage. a pen. difference is, the ones in a pen are easier to count." }
        secenekler:
          - id: "tekne"
            etiket: { tr: "Teknelere koş; insanları rıhtıma geri çıkar", en: "Run to the boats. Get people back on the quay" }
            etkiler:
              - ahlak: { merhamet: 4, duzen: 2 }
              - degisken: { hayatta_kalan: 2 }
              - itibar: { siginak: 4 }
              - iliski: { elif_sari: { guven: 4 } }
            sonraki: "gag_tekne"
          - id: "vahit"
            etiket: { tr: "{yer:tepe|e} çık; hoparlörleri sustur", en: "Go up to {yer:tepe}. Shut those speakers off" }
            goster: { npc_hayatta: "vahit" }
            etkiler:
              - ahlak: { duzen: 3, insanlik: 2 }
              - itibar: { yukselenler: -6, siginak: 3, lonca: 3 }
              - iliski: { vahit: { korku: 6, guven: -6 } }
            sonraki: "gag_vahit"
          - id: "golge"
            tur: "gosteris"
            etiket: { tr: "Gölgenin kenarına yürü; suyu kendin dene", en: "Walk out to the edge of the shadow. Test the water yourself" }
            gerekli: { stat: { wil: 70 } }
            etkiler:
              - ahlak: { duzen: -3, insanlik: -1 }
              - dikkat: 6
              - itibar: { kadimler: 3, lonca: 3 }
              - tohum: { olay: "dikkat_100_p2", gecikme: { min: 1, max: 3 }, kosul: { dikkat_min: 95 } }
            sonraki: "gag_golge"

      - id: "gag_tekne"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Bir tekneyi halatından tutup rıhtıma çekiyorsun, sonra bir tane daha. İnsanlar tekneden inerken sana sarılıyor ya da tükürüyor; ikisi de korkudan.", en: "You grab one boat by its line and haul it back to the quay, then another. People coming off the boats either hug you or spit at you. Both out of fear." }
          - { tr: "Gece yarısı son tekne de bağlanıyor. Rıhtımda bir anne çocuğunu uyutmaya çalışıyor ve sana fısıldıyor: \"Kaçamıyorsak, sen bari kal.\"", en: "By midnight the last boat's tied up. On the quay a mother trying to get her kid to sleep whispers to you: \"If we can't run, at least you stay.\"" }
        secenekler:
          - id: "kal"
            etiket: { tr: "\"Kalıyorum.\"", en: "\"I'm staying.\"" }
            etkiler:
              - ahlak: { merhamet: 2, insanlik: 2 }
              - iliski: { deniz_arman: { guven: 3 } }
            sonraki: "@akis"

      - id: "gag_vahit"
        yer: "tepe"
        paragraflar:
          - { tr: "Tepedeki eski fenerin dibinde {npc:vahit} mikrofonun başında; arkasında yüzlerce beyazlı ellerini göğe kaldırmış. Kabloyu tek bir hareketle koparıyorsun.", en: "At the foot of the old lighthouse up in {yer:tepe}, {npc:vahit} is at the microphone with hundreds of people in white behind him, hands raised to the sky. You rip the cable out in one motion." }
          - { tr: "Sessizlik. {npc:vahit} sana dönüyor ve ilk kez, gerçekten, korkuyor. Sonra gülümsemeyi hatırlıyor. \"Sen de onlardansın,\" diyor. \"Bahçıvanlardan. Sadece henüz bilmiyorsun.\"", en: "Silence. {npc:vahit} turns to you and, for the first time, really, he's scared. Then he remembers to smile. \"You're one of them too,\" he says. \"The Gardeners. You just don't know it yet.\"" }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kabloyu yere at ve in", en: "Drop the cable and walk back down" }
            etkiler:
              - ahlak: { duzen: 1 }
            sonraki: "@akis"

      - id: "gag_golge"
        yer: "kiyikent_liman"
        paragraflar:
          - { tr: "Suyun içinde gölgenin kenarına kadar yürüyorsun; su göğsüne geliyor ve sonra kaynamaya başlıyor. Seni itmiyor. Bekliyor.", en: "You wade out to the edge of the shadow. The water's up to your chest, and then it starts to boil. It doesn't push you back. It waits." }
          - { tr: "Bir adım daha atıyorsun ve gölgenin dışındasın; ay ışığında, tek başına. Rıhtımdaki herkes nefesini tutuyor. Sonra geri dönüyorsun, çünkü onlar dönemiyor.", en: "You take one more step and you're out from under the shadow, alone in the moonlight. Everybody on the quay holds their breath. Then you walk back, because they can't." }
        secenekler:
          - id: "tamam"
            etiket: { tr: "Kıyıya dön; kimseye bir şey açıklama", en: "Come back to shore. Explain nothing" }
            etkiler:
              - ahlak: { merhamet: 2, duzen: -1 }
              - xp_seviye: 30
            sonraki: "@akis"
