gorevler:
  ogretici_cikis:
    ad: { tr: "Çıkış Kapısı", en: "The Exit Gate" }
    aciklama: { tr: "Öğretici Katman'ın 30 günü dolmadan Çıkış Kapısı'na ulaş ve onu koruyan şeyi geç.", en: "Reach the Exit Gate before the Tutorial Layer's 30 days run out, and get past whatever guards it." }
  deniz_bul:
    ad: { tr: "Kayıp arkadaş", en: "The friend you lost" }
    aciklama: { tr: "Aktarımda {npc:deniz_arman|den} ayrı düştün. Onu bul.", en: "The transfer split you and {npc:deniz_arman} up. Find them." }
  istasyon_sinyali:
    ad: { tr: "İstasyondaki sinyal", en: "The signal at the station" }
    aciklama: { tr: "Kırık İstasyon'dan düzenli aralıklarla bir sinyal geliyor. Kaynağını bul.", en: "Something at the Broken Station keeps broadcasting on a loop. Find the source." }
  carsi_mahsurlari:
    ad: { tr: "Çarşıdaki mahsurlar", en: "Trapped at the mall" }
    aciklama: { tr: "Harabe Çarşı'da bir grup insan mahsur kalmış. Onları çıkar ya da bırak.", en: "A group of people is stuck inside the Dead Mall. Get them out, or don't." }
